<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>多功能工具箱 - TRAE AI 创意大赛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow: hidden;
            touch-action: pan-y;
        }

        /* 横屏容器 */
        .app-container {
            max-width: 1400px;
            max-height: 800px;
            width: 95vw;
            height: 90vh;
            margin: auto;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            border-radius: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        /* 全局控制按钮组 */
        .global-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 100;
            align-items: center;
        }

        .timer-remaining {
            padding: 10px 16px;
            background: linear-gradient(135deg, #ff3b30 0%, #ff9500 100%);
            color: white;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(255, 59, 48, 0.4);
            white-space: nowrap;
            transition: all 0.3s;
        }

        .timer-remaining:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 59, 48, 0.5);
        }

        .pages-wrapper {
            display: flex;
            width: 200%;
            height: 100%;
            transition: transform 0.3s ease;
        }

        .page {
            width: 50%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        .page::-webkit-scrollbar {
            display: none;
        }

        /* 页面1 - 待办清单 */
        .todo-page {
            background: white;
            padding: 70px 20px 0;
            position: relative;
        }

        .todo-header {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .todo-header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-toggle-global {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-toggle-global:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .nav-toggle-global.timer-active {
            background: linear-gradient(135deg, #ff3b30 0%, #ff9500 100%);
            box-shadow: 0 4px 15px rgba(255, 59, 48, 0.4);
        }

        .nav-toggle-global.timer-active:hover {
            box-shadow: 0 6px 20px rgba(255, 59, 48, 0.5);
        }

        .theme-toggle-global {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #17a2b8 0%, #20c997 100%);
            color: white;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(23, 162, 184, 0.4);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle-global:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(23, 162, 184, 0.5);
        }

        .bg-upload-btn-global {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #6f42c1 0%, #e83e8c 100%);
            color: white;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(111, 66, 193, 0.4);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-upload-btn-global:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(111, 66, 193, 0.5);
        }

        .search-section {
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 14px;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: white;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .add-section {
            padding: 25px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .search-section {
            padding: 15px 25px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 14px;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: white;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        #todo-input {
            flex: 1;
            min-width: 200px;
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        #todo-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .priority-select {
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .priority-select:focus {
            outline: none;
            border-color: #667eea;
        }

        #add-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        #add-btn:active {
            transform: translateY(0);
        }

        .filter-section {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 15px 25px;
            background: white;
            border-bottom: 1px solid #e9ecef;
        }

        .filter-btn {
            padding: 8px 20px;
            border: 2px solid #e9ecef;
            background: white;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .filter-btn:hover:not(.active) {
            border-color: #667eea;
            color: #667eea;
        }

        .todo-list {
            padding: 20px 25px;
            max-height: 500px;
            margin-top: 40px;
            overflow-y: auto;
        }

        .todo-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 12px;
            transition: all 0.3s;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .todo-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .todo-item.completed {
            opacity: 0.6;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #6c757d;
        }

        .todo-item.priority-high {
            border-left: 4px solid #dc3545;
            background: linear-gradient(90deg, rgba(220, 53, 69, 0.1) 0%, #f8f9fa 100%);
        }

        .todo-item.priority-medium {
            border-left: 4px solid #ffc107;
            background: linear-gradient(90deg, rgba(255, 193, 7, 0.1) 0%, #f8f9fa 100%);
        }

        .todo-item.priority-low {
            border-left: 4px solid #28a745;
            background: linear-gradient(90deg, rgba(40, 167, 69, 0.1) 0%, #f8f9fa 100%);
        }

        .checkbox {
            width: 22px;
            height: 22px;
            margin-right: 15px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .todo-text {
            flex: 1;
            font-size: 16px;
            color: #212529;
        }

        .priority-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 10px;
        }

        .priority-badge.high {
            background: #dc3545;
            color: white;
        }

        .priority-badge.medium {
            background: #ffc107;
            color: #212529;
        }

        .priority-badge.low {
            background: #28a745;
            color: white;
        }



        .delete-btn {
            padding: 8px 12px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .todo-item:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .stats {
            padding: 20px 25px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            display: flex;
            justify-content: space-around;
            text-align: center;
            position: sticky;
            bottom: 0;
            z-index: 10;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #6c757d;
            margin-top: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 25px;
            color: #6c757d;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* 暗色模式 */
        .dark-theme {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        .dark-theme .todo-app {
            background: #2d2d44;
        }

        .dark-theme .add-section,
        .dark-theme .search-section,
        .dark-theme .stats {
            background: #1f1f33;
            border-color: #3d3d5c;
        }

        .dark-theme .filter-section {
            background: #2d2d44;
            border-color: #3d3d5c;
        }

        .dark-theme #todo-input,
        .dark-theme .search-input,
        .dark-theme .priority-select {
            background: #1f1f33;
            border-color: #3d3d5c;
            color: white;
        }

        .dark-theme #todo-input::placeholder,
        .dark-theme .search-input::placeholder {
            color: #888;
        }

        .dark-theme .filter-btn {
            background: #2d2d44;
            border-color: #3d3d5c;
            color: #ccc;
        }

        .dark-theme .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .dark-theme .filter-btn:hover:not(.active) {
            border-color: #667eea;
            color: #667eea;
        }

        .dark-theme .todo-item {
            background: #1f1f33;
            border-color: #3d3d5c;
        }

        .dark-theme .todo-item:hover {
            background: #2a2a40;
        }

        .dark-theme .todo-text {
            color: #e0e0e0;
        }

        .dark-theme .todo-item.completed .todo-text {
            color: #666;
        }

        .dark-theme .priority-badge.high {
            background: #dc3545;
        }

        .dark-theme .priority-badge.medium {
            background: #ffc107;
        }

        .dark-theme .priority-badge.low {
            background: #28a745;
        }

        .dark-theme .stat-number {
            color: #a78bfa;
        }

        .dark-theme .stat-label {
            color: #888;
        }

        .dark-theme .empty-state {
            color: #666;
        }

        .dark-theme .theme-toggle {
            background: #3d3d5c;
        }

        .dark-theme header p {
            color: #aaa;
        }

        .dark-theme .todo-page {
            background: #2d2d44;
        }

        .dark-theme .todo-header h1 {
            color: #e0e0e0;
            -webkit-text-fill-color: #e0e0e0;
            background: none;
        }

        .dark-theme .timer-page {
            background: #2d2d44;
            color: #e0e0e0;
        }

        .dark-theme .timer-circle .circle-bg {
            stroke: #4a4a6a;
        }

        .dark-theme .timer-time-display .label {
            color: #aaa;
        }

        .dark-theme .timer-input {
            background: #1f1f33;
            border-color: #4a4a6a;
            color: white;
        }

        .dark-theme .timer-input::-webkit-inner-spin-button,
        .dark-theme .timer-input::-webkit-outer-spin-button {
            filter: invert(1);
        }

        .dark-theme .preset-btn {
            background: #1f1f33;
            border-color: #4a4a6a;
            color: #ccc;
        }

        .dark-theme .preset-btn:hover {
            background: #2a2a40;
            border-color: #667eea;
        }

        .dark-theme .timer-remaining {
            background: linear-gradient(135deg, #ff3b30 0%, #ff9500 100%);
            color: white;
        }

        @media (max-width: 480px) {
            header h1 {
                font-size: 1.8rem;
            }

            .input-group {
                flex-direction: column;
            }

            #add-btn {
                width: 100%;
            }

            .filter-section {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 全局控制按钮组 -->
        <div class="global-controls">
            <div class="timer-remaining hidden" id="timer-remaining">⏱️ 00:00:00</div>
            <button class="nav-toggle nav-toggle-global" id="nav-toggle-btn" title="切换页面">⏱️</button>
            <button class="theme-toggle theme-toggle-global" id="theme-toggle" title="切换主题">🌙</button>
            <input type="file" id="bg-upload" accept="image/*" hidden>
            <label class="bg-upload-btn bg-upload-btn-global" for="bg-upload" title="导入背景图片">🖼️</label>
        </div>
        
        <div class="pages-wrapper">
            <!-- 页面1: 待办清单 -->
            <div class="page todo-page">
                <div class="todo-header">
                    <h1>📝 智能待办清单</h1>
                </div>

                <div class="search-section">
                    <input 
                        type="text" 
                        class="search-input" 
                        id="search-input" 
                        placeholder="搜索任务..."
                    >
                </div>

                <div class="add-section">
                    <div class="input-group">
                        <input 
                            type="text" 
                            id="todo-input" 
                            placeholder="添加新任务..." 
                            maxlength="100"
                        >
                        <select id="priority-select" class="priority-select">
                            <option value="medium">中优先级</option>
                            <option value="high">高优先级</option>
                            <option value="low">低优先级</option>
                        </select>
                        <button id="add-btn">添加</button>
                    </div>
                </div>

                <div class="filter-section">
                    <button class="filter-btn active" data-filter="all">全部</button>
                    <button class="filter-btn" data-filter="active">待完成</button>
                    <button class="filter-btn" data-filter="completed">已完成</button>
                    <button class="filter-btn" data-filter="high">高优先级</button>
                </div>

                <div class="todo-list" id="todo-list">
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                        </svg>
                        <p>暂无任务，添加一个开始吧！</p>
                </div>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <span class="stat-number" id="total-count">0</span>
                    <span class="stat-label">总任务</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="active-count">0</span>
                    <span class="stat-label">待完成</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="completed-count">0</span>
                    <span class="stat-label">已完成</span>
                </div>
            </div>
        </div>
        <!-- 页面1结束 -->

        <!-- 页面2: 苹果风格倒计时 -->
        <div class="page timer-page">
            <style>
                .timer-page {
                    background: white;
                    padding: 80px 20px 40px;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    height: 100%;
                    color: #333;
                }

                .timer-container {
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    width: 100%;
                    max-width: 400px;
                }

                .timer-circle {
                    position: relative;
                    width: 280px;
                    height: 280px;
                    margin-bottom: 40px;
                }

                .timer-circle svg {
                    width: 100%;
                    height: 100%;
                    transform: rotate(-90deg);
                }

                .timer-circle circle {
                    fill: none;
                    stroke-width: 8;
                    stroke-linecap: round;
                }

                .timer-circle .circle-bg {
                    stroke: #e0e0e0;
                }

                .timer-circle .circle-progress {
                    stroke: #ff3b30;
                    stroke-dasharray: 816.8;
                    stroke-dashoffset: 0;
                    transition: stroke-dashoffset 0.1s linear;
                }

                .timer-time-display {
                    position: absolute;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    text-align: center;
                }

                .timer-time-display .time {
                    font-size: 3.5rem;
                    font-weight: 300;
                    letter-spacing: 2px;
                }

                .timer-time-display .label {
                    font-size: 1rem;
                    color: #666;
                    margin-top: 5px;
                }

                .timer-inputs {
                    display: flex;
                    gap: 10px;
                    margin-bottom: 30px;
                    align-items: center;
                }

                .timer-input-group {
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                }

                .timer-input-group input {
                    width: 70px;
                    height: 70px;
                    background: #f0f0f0;
                    border: 2px solid #e0e0e0;
                    border-radius: 15px;
                    color: #333;
                    font-size: 2rem;
                    font-weight: 300;
                    text-align: center;
                    outline: none;
                    transition: all 0.3s;
                }

                .timer-input-group input:focus {
                    background: white;
                    border-color: #ff3b30;
                }

                .timer-input-group label {
                    font-size: 0.8rem;
                    color: #666;
                    margin-top: 5px;
                }

                .timer-separator {
                    font-size: 2rem;
                    color: #666;
                    margin-top: -25px;
                }

                .timer-controls {
                    display: flex;
                    gap: 20px;
                    width: 100%;
                    justify-content: center;
                }

                .timer-btn {
                    padding: 15px 40px;
                    border: none;
                    border-radius: 50px;
                    font-size: 1.1rem;
                    font-weight: 600;
                    cursor: pointer;
                    transition: all 0.3s;
                    min-width: 120px;
                }

                .timer-btn.start {
                    background: #ff3b30;
                    color: white;
                }

                .timer-btn.pause {
                    background: #ff9500;
                    color: white;
                }

                .timer-btn.reset {
                    background: #f0f0f0;
                    color: #333;
                }

                .timer-btn:hover {
                    opacity: 0.9;
                    transform: scale(1.05);
                }

                .timer-btn:active {
                    transform: scale(0.95);
                }

                .timer-presets {
                    display: flex;
                    gap: 10px;
                    flex-wrap: wrap;
                    justify-content: center;
                    margin-top: 30px;
                    width: 100%;
                }

                .preset-btn {
                    padding: 12px 24px;
                    background: #f0f0f0;
                    border: 2px solid #e0e0e0;
                    border-radius: 25px;
                    color: #333;
                    font-size: 0.9rem;
                    cursor: pointer;
                    transition: all 0.3s;
                }

                .preset-btn:hover {
                    background: #e0e0e0;
                    border-color: #d0d0d0;
                }

                .hidden {
                    display: none !important;
                }
            </style>

            <div class="timer-container">
                <div class="timer-circle">
                    <svg viewBox="0 0 280 280">
                        <circle class="circle-bg" cx="140" cy="140" r="130"></circle>
                        <circle class="circle-progress" cx="140" cy="140" r="130"></circle>
                    </svg>
                    <div class="timer-time-display">
                        <div class="time" id="countdown-display">00:00:00</div>
                        <div class="label" id="countdown-label">设置时间</div>
                    </div>
                </div>

                <div class="timer-inputs" id="timer-inputs">
                    <div class="timer-input-group">
                        <input type="number" id="hours-input" min="0" max="23" value="0">
                        <label>时</label>
                    </div>
                    <div class="timer-separator">:</div>
                    <div class="timer-input-group">
                        <input type="number" id="minutes-input" min="0" max="59" value="5">
                        <label>分</label>
                    </div>
                    <div class="timer-separator">:</div>
                    <div class="timer-input-group">
                        <input type="number" id="seconds-input" min="0" max="59" value="0">
                        <label>秒</label>
                    </div>
                </div>

                <div class="timer-controls">
                    <button class="timer-btn start" id="countdown-start">开始</button>
                    <button class="timer-btn reset hidden" id="countdown-reset">取消</button>
                </div>

                <div class="timer-presets" id="timer-presets">
                    <button class="preset-btn" data-time="60">1分钟</button>
                    <button class="preset-btn" data-time="300">5分钟</button>
                    <button class="preset-btn" data-time="600">10分钟</button>
                    <button class="preset-btn" data-time="1800">30分钟</button>
                    <button class="preset-btn" data-time="3600">1小时</button>
                </div>
            </div>
        </div>
        <!-- 页面2结束 -->
    </div>
    <!-- pages-wrapper结束 -->

    <script>
        // 获取DOM元素
        const todoInput = document.getElementById('todo-input');
        const prioritySelect = document.getElementById('priority-select');
        const searchInput = document.getElementById('search-input');
        const themeToggle = document.getElementById('theme-toggle');
        const addBtn = document.getElementById('add-btn');
        const todoList = document.getElementById('todo-list');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const totalCount = document.getElementById('total-count');
        const activeCount = document.getElementById('active-count');
        const completedCount = document.getElementById('completed-count');

        // 当前筛选状态
        let currentFilter = 'all';
        let searchQuery = '';
        let isDarkTheme = false;

        // 从本地存储加载任务
        let todos = JSON.parse(localStorage.getItem('todos')) || [];

        // 保存到本地存储
        function saveTodos() {
            localStorage.setItem('todos', JSON.stringify(todos));
            updateStats();
            renderTodos();
        }

        // 更新统计数据
        function updateStats() {
            const total = todos.length;
            const completed = todos.filter(t => t.completed).length;
            const active = total - completed;
            
            totalCount.textContent = total;
            completedCount.textContent = completed;
            activeCount.textContent = active;
        }

        // 获取优先级标签
        function getPriorityLabel(priority) {
            const labels = {
                high: '高',
                medium: '中',
                low: '低'
            };
            return labels[priority] || '中';
        }

        // 渲染任务列表
        function renderTodos() {
            todoList.innerHTML = '';

            let filteredTodos = todos;

            // 搜索过滤
            if (searchQuery) {
                const query = searchQuery.toLowerCase();
                filteredTodos = filteredTodos.filter(t => 
                    t.text.toLowerCase().includes(query)
                );
            }

            // 状态筛选
            if (currentFilter === 'active') {
                filteredTodos = filteredTodos.filter(t => !t.completed);
            } else if (currentFilter === 'completed') {
                filteredTodos = filteredTodos.filter(t => t.completed);
            } else if (currentFilter === 'high') {
                filteredTodos = filteredTodos.filter(t => t.priority === 'high' && !t.completed);
            }

            if (filteredTodos.length === 0) {
                todoList.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                        </svg>
                        <p>暂无任务，添加一个开始吧！</p>
                    </div>
                `;
                return;
            }

            filteredTodos.forEach((todo, index) => {
                const todoItem = document.createElement('div');
                const priority = todo.priority || 'medium';
                
                todoItem.className = `todo-item ${todo.completed ? 'completed' : ''} priority-${priority}`;
                todoItem.innerHTML = `
                    <input 
                        type="checkbox" 
                        class="checkbox" 
                        ${todo.completed ? 'checked' : ''}
                        data-index="${index}"
                    >
                    <span class="todo-text">${escapeHtml(todo.text)}</span>
                    <span class="priority-badge ${priority}">${getPriorityLabel(priority)}</span>
                    <button class="delete-btn" data-index="${index}">删除</button>
                `;
                todoList.appendChild(todoItem);
            });
        }

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 添加任务
        function addTodo() {
            const text = todoInput.value.trim();
            if (!text) return;

            todos.push({
                text: text,
                completed: false,
                priority: prioritySelect.value,
                createdAt: new Date().toISOString()
            });

            todoInput.value = '';
            prioritySelect.value = 'medium';
            saveTodos();
        }

        // 切换任务状态
        function toggleTodo(index) {
            todos[index].completed = !todos[index].completed;
            saveTodos();
        }

        // 删除任务
        function deleteTodo(index) {
            todos.splice(index, 1);
            saveTodos();
        }

        // 切换筛选
        function setFilter(filter) {
            currentFilter = filter;
            filterBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            renderTodos();
        }

        // ==================== 倒计时功能 ====================
        const countdownDisplay = document.getElementById('countdown-display');
        const countdownLabel = document.getElementById('countdown-label');
        const countdownStart = document.getElementById('countdown-start');
        const countdownReset = document.getElementById('countdown-reset');
        const timerInputs = document.getElementById('timer-inputs');
        const timerPresets = document.getElementById('timer-presets');
        const hoursInput = document.getElementById('hours-input');
        const minutesInput = document.getElementById('minutes-input');
        const secondsInput = document.getElementById('seconds-input');
        const circleProgress = document.querySelector('.circle-progress');
        const presetBtns = document.querySelectorAll('.preset-btn');
        const timerRemainingDisplay = document.getElementById('timer-remaining');

        let countdownTotalSeconds = 0;
        let countdownRemainingSeconds = 0;
        let countdownInterval = null;
        let isCountdownRunning = false;
        let isCountdownPaused = false;

        function formatCountdownTime(totalSeconds) {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function updateCountdownDisplay() {
            countdownDisplay.textContent = formatCountdownTime(countdownRemainingSeconds);
            
            // 更新圆形进度条
            const circumference = 816.8; // 2 * π * 130
            const progress = countdownTotalSeconds > 0 ? countdownRemainingSeconds / countdownTotalSeconds : 0;
            const offset = circumference * (1 - progress);
            circleProgress.style.strokeDashoffset = offset;
            
            // 更新待办清单页面的剩余时间显示
            if (timerRemainingDisplay) {
                timerRemainingDisplay.textContent = `⏱️ ${formatCountdownTime(countdownRemainingSeconds)}`;
            }
        }

        function startCountdown() {
            if (!isCountdownRunning) {
                // 开始倒计时
                if (!isCountdownPaused) {
                    // 第一次开始，从输入框读取时间
                    const hours = parseInt(hoursInput.value) || 0;
                    const minutes = parseInt(minutesInput.value) || 0;
                    const seconds = parseInt(secondsInput.value) || 0;
                    
                    countdownTotalSeconds = hours * 3600 + minutes * 60 + seconds;
                    
                    if (countdownTotalSeconds <= 0) {
                        alert('请设置倒计时时间');
                        return;
                    }
                    
                    countdownRemainingSeconds = countdownTotalSeconds;
                }
                
                isCountdownRunning = true;
                isCountdownPaused = false;
                
                // 隐藏输入框，显示取消按钮
                timerInputs.classList.add('hidden');
                timerPresets.classList.add('hidden');
                countdownReset.classList.remove('hidden');
                countdownStart.textContent = '暂停';
                countdownStart.classList.remove('start');
                countdownStart.classList.add('pause');
                countdownLabel.textContent = '倒计时中';
                
                // 显示剩余时间提示
                if (timerRemainingDisplay) {
                    timerRemainingDisplay.classList.remove('hidden');
                }
                
                updateCountdownDisplay();
                
                countdownInterval = setInterval(() => {
                    countdownRemainingSeconds--;
                    updateCountdownDisplay();
                    
                    if (countdownRemainingSeconds <= 0) {
                        clearInterval(countdownInterval);
                        isCountdownRunning = false;
                        isCountdownPaused = false;
                        countdownLabel.textContent = '时间到！';
                        countdownStart.textContent = '开始';
                        countdownStart.classList.remove('pause');
                        countdownStart.classList.add('start');
                        
                        // 隐藏剩余时间提示
                        if (timerRemainingDisplay) {
                            timerRemainingDisplay.classList.add('hidden');
                        }
                        
                        // 播放提示音或震动
                        if (navigator.vibrate) {
                            navigator.vibrate([200, 100, 200]);
                        }
                    }
                }, 1000);
            } else {
                // 暂停倒计时
                isCountdownRunning = false;
                isCountdownPaused = true;
                clearInterval(countdownInterval);
                countdownStart.textContent = '继续';
                countdownStart.classList.remove('pause');
                countdownStart.classList.add('start');
                countdownLabel.textContent = '已暂停';
            }
        }

        function resetCountdown() {
            isCountdownRunning = false;
            isCountdownPaused = false;
            clearInterval(countdownInterval);
            
            // 显示输入框，隐藏取消按钮
            timerInputs.classList.remove('hidden');
            timerPresets.classList.remove('hidden');
            countdownReset.classList.add('hidden');
            countdownStart.textContent = '开始';
            countdownStart.classList.remove('pause');
            countdownStart.classList.add('start');
            countdownLabel.textContent = '设置时间';
            
            // 隐藏剩余时间提示
            if (timerRemainingDisplay) {
                timerRemainingDisplay.classList.add('hidden');
            }
            
            countdownTotalSeconds = 0;
            countdownRemainingSeconds = 0;
            updateCountdownDisplay();
        }

        countdownStart.addEventListener('click', startCountdown);
        countdownReset.addEventListener('click', resetCountdown);

        presetBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const time = parseInt(btn.dataset.time);
                const hours = Math.floor(time / 3600);
                const minutes = Math.floor((time % 3600) / 60);
                const seconds = time % 60;
                
                hoursInput.value = hours;
                minutesInput.value = minutes;
                secondsInput.value = seconds;
                
                if (isCountdownRunning) {
                    resetCountdown();
                }
            });
        });

        // 输入框限制
        [hoursInput, minutesInput, secondsInput].forEach(input => {
            input.addEventListener('change', () => {
                let value = parseInt(input.value) || 0;
                const max = parseInt(input.max);
                const min = parseInt(input.min);
                
                if (value > max) value = max;
                if (value < min) value = min;
                
                input.value = value;
            });
        });

        // 切换主题
        function toggleTheme() {
            isDarkTheme = !isDarkTheme;
            document.body.classList.toggle('dark-theme');
            themeToggle.textContent = isDarkTheme ? '☀️' : '🌙';
            localStorage.setItem('darkTheme', isDarkTheme);
        }

        // 初始化主题
        function initTheme() {
            isDarkTheme = localStorage.getItem('darkTheme') === 'true';
            if (isDarkTheme) {
                document.body.classList.add('dark-theme');
                themeToggle.textContent = '☀️';
            }
        }

        // 事件监听
        addBtn.addEventListener('click', addTodo);

        todoInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                addTodo();
            }
        });

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderTodos();
        });

        themeToggle.addEventListener('click', toggleTheme);

        todoList.addEventListener('change', (e) => {
            if (e.target.classList.contains('checkbox')) {
                const index = parseInt(e.target.dataset.index);
                toggleTodo(index);
            }
        });

        todoList.addEventListener('click', (e) => {
            if (e.target.classList.contains('delete-btn')) {
                const index = parseInt(e.target.dataset.index);
                deleteTodo(index);
            }
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                setFilter(btn.dataset.filter);
            });
        });

        // ==================== 图标导航功能 ====================
        const pagesWrapper = document.querySelector('.pages-wrapper');
        const navToggleBtn = document.getElementById('nav-toggle-btn');
        let currentPage = 0;

        function goToPage(index) {
            currentPage = index;
            pagesWrapper.style.transform = `translateX(-${index * 50}%)`;
            
            // 更新导航按钮的图标和样式
            if (currentPage === 0) {
                // 待办页面
                navToggleBtn.textContent = '⏱️';
                navToggleBtn.classList.remove('timer-active');
            } else {
                // 计时器页面
                navToggleBtn.textContent = '📝';
                navToggleBtn.classList.add('timer-active');
            }
        }

        // 点击导航按钮切换页面
        navToggleBtn.addEventListener('click', () => {
            goToPage(currentPage === 0 ? 1 : 0);
        });

        // ==================== 背景图片导入功能 ====================
        const bgUpload = document.getElementById('bg-upload');
        const bgUploadBtn = document.querySelector('.bg-upload-btn-global');

        // 加载保存的背景图片
        function loadBackgroundImage() {
            const savedBg = localStorage.getItem('customBackground');
            if (savedBg) {
                document.body.style.backgroundImage = `url(${savedBg})`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                document.body.style.backgroundRepeat = 'no-repeat';
            }
        }

        // 上传背景图片
        bgUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const bgDataUrl = event.target.result;
                    localStorage.setItem('customBackground', bgDataUrl);
                    document.body.style.backgroundImage = `url(${bgDataUrl})`;
                    document.body.style.backgroundSize = 'cover';
                    document.body.style.backgroundPosition = 'center';
                    document.body.style.backgroundRepeat = 'no-repeat';
                };
                reader.readAsDataURL(file);
            }
            // 清空value，确保下次点击能正常触发
            bgUpload.value = '';
        });

        // 初始化
        initTheme();
        updateStats();
        renderTodos();
        loadBackgroundImage();
    </script>
</body>
</html>
