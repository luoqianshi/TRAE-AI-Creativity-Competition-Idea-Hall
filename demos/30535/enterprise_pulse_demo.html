<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心跳管理 - 企业脉搏健康分析</title>
    <link rel="stylesheet" href="libs/fontawesome/css/font-awesome.min.css">
    <style>
        /* ===== 基础样式 ===== */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Microsoft YaHei', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== 页面容器 ===== */
        .pulse-container {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ===== 滚动条美化 ===== */
        body::-webkit-scrollbar {
            width: 10px;
        }
        body::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.2);
        }
        body::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 5px;
        }

        /* ===== 页头 ===== */
        .pulse-header {
            margin-bottom: 30px;
        }
        .pulse-header h2 {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            color: white;
            font-size: 28px;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .pulse-header h2 i {
            color: #ff6b6b;
            animation: heartbeat 1.5s ease-in-out infinite;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.15); }
            50% { transform: scale(1); }
            75% { transform: scale(1.15); }
        }
        .pulse-header p {
            color: rgba(255, 255, 255, 0.9);
            margin: 0;
            font-size: 15px;
        }

        /* ===== 健康状态卡片 ===== */
        .pulse-status-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            border-radius: 16px;
            padding: 25px 30px;
            color: #4fc3f7;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            height: 280px;
        }
        .pulse-status-card.status-excellent {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: #00ff88;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.3);
        }
        .pulse-status-card.status-good {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #4fc3f7;
        }
        .pulse-status-card.status-warning {
            background: linear-gradient(135deg, #2d1b69 0%, #11998e 100%);
            color: #ffd93d;
            box-shadow: 0 4px 20px rgba(255, 217, 61, 0.3);
        }
        .pulse-status-card.status-critical {
            background: linear-gradient(135deg, #1a0a0a 0%, #2d0a0a 50%, #4a0a0a 100%);
            color: #ff5252;
            box-shadow: 0 4px 20px rgba(255, 82, 82, 0.4);
        }
        .status-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .status-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .status-update-time {
            font-size: 13px;
            opacity: 0.7;
        }
        .status-score-section {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            padding: 5px 0;
            position: relative;
            gap: 30px;
            height: 180px;
        }
        .status-score-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .status-score-number {
            font-size: 72px;
            font-weight: 900;
            margin-bottom: 8px;
            position: relative;
            display: inline-block;
            text-shadow: 0 0 20px currentColor, 0 0 40px currentColor;
            letter-spacing: 3px;
        }
        .status-score-number.good {
            animation: goodPulse 1.2s infinite;
        }
        @keyframes goodPulse {
            0%, 100% { opacity: 1; text-shadow: 0 0 20px currentColor, 0 0 40px currentColor; }
            50% { opacity: 0.9; text-shadow: 0 0 30px currentColor, 0 0 60px currentColor; }
        }
        .status-label {
            font-size: 22px;
            opacity: 0.9;
        }

        /* ===== 健康趋势图容器 ===== */
        .heartbeat-chart-container {
            flex: 2;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            border: 1px solid rgba(79, 195, 247, 0.3);
            position: relative;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }
        .chart-title {
            font-size: 13px;
            color: rgba(79, 195, 247, 0.9);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chart-title::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #4fc3f7;
            border-radius: 50%;
            animation: pulseDot 2s infinite;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; box-shadow: 0 0 6px #4fc3f7; }
            50% { opacity: 0.5; box-shadow: 0 0 12px #4fc3f7; }
        }
        .chart-canvas {
            width: 100%;
            flex: 1;
            display: block;
        }

        /* ===== 勾选框区域 ===== */
        .checkbox-section {
            background: white;
            border-radius: 12px;
            padding: 20px 25px;
            margin-bottom: 25px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }
        .checkbox-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }
        .checkbox-items {
            display: flex;
            flex-wrap: wrap;
            gap: 22px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #333;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
        }
        .checkbox-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #667eea;
        }

        /* ===== 统计数据网格 ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }
        .stat-card.clickable {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .stat-card.clickable:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        .stat-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }
        .stat-icon {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .stat-icon.extra { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; }
        .stat-icon.no-bom { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; }
        .stat-icon.insufficient { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); color: white; }
        .stat-icon.no-process { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); color: white; }
        .stat-icon.abnormal { background: linear-gradient(135deg, #ff9a56 0%, #ff6b6b 100%); color: white; }
        .stat-icon.price { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .stat-icon.inventory { background: linear-gradient(135deg, #43cea2 0%, #185a9d 100%); color: white; }
        .stat-icon.margin { background: linear-gradient(135deg, #ee9ca7 0%, #ffdde1 100%); color: #c9184a; }

        .stat-title {
            font-size: 14px;
            color: #333;
            font-weight: 600;
        }
        .stat-value {
            font-size: 34px;
            font-weight: 700;
            color: #333;
            margin-bottom: 6px;
        }
        .stat-value.has-issues { color: #e74c3c; }
        .stat-desc {
            font-size: 13px;
            color: #666;
        }

        /* ===== 异常订单列表 ===== */
        .orders-section {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            margin-bottom: 25px;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .refresh-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        .refresh-btn:hover {
            background: #5568d3;
        }
        .export-btn {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
        }
        .export-btn:hover {
            background: linear-gradient(135deg, #219a52, #27ae60);
        }

        .orders-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .orders-table th {
            text-align: left;
            padding: 14px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-weight: 600;
            color: white;
            font-size: 14px;
        }
        .orders-table th:first-child { border-top-left-radius: 8px; }
        .orders-table th:last-child { border-top-right-radius: 8px; }

        .orders-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #e9ecef;
            font-size: 14px;
            color: #333;
        }
        .orders-table tr:hover td {
            background: #f8f9fa;
        }

        .orders-table th:nth-child(1), .orders-table td:nth-child(1) { width: 18%; }
        .orders-table th:nth-child(2), .orders-table td:nth-child(2) { width: 28%; }
        .orders-table th:nth-child(3), .orders-table td:nth-child(3) { width: 18%; }
        .orders-table th:nth-child(4), .orders-table td:nth-child(4) { width: 36%; }

        .order-number {
            font-weight: 600;
            color: #667eea;
            font-size: 14px;
            font-family: 'Courier New', monospace;
        }
        .product-code {
            font-family: 'Courier New', monospace;
            background: #f8f9fa;
            padding: 4px 8px;
            border-radius: 4px;
            color: #333;
            font-size: 13px;
        }
        .issue-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .issue-tag {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        .issue-tag.extra { background: #fff3cd; color: #856404; }
        .issue-tag.no-bom { background: #d1ecf1; color: #0c5460; }
        .issue-tag.insufficient { background: #f8d7da; color: #721c24; }
        .issue-tag.no-process { background: #e2e3e5; color: #383d41; }
        .issue-tag.abnormal { background: #f5c6cb; color: #721c24; }

        /* ===== 弹窗样式 ===== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background: white;
            border-radius: 16px;
            width: 100%;
            max-width: 1200px;
            max-height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transform: scale(0.9) translateY(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 28px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .modal-close {
            width: 40px;
            height: 40px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            transition: all 0.3s ease;
        }
        .modal-close:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: rotate(90deg);
        }
        .modal-body {
            padding: 24px 28px;
            overflow-y: auto;
            flex: 1;
        }
        .modal-body::-webkit-scrollbar { width: 8px; }
        .modal-body::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 4px;
        }

        .detail-table {
            width: 100%;
            border-collapse: collapse;
        }
        .detail-table thead {
            background: #f8f9fa;
        }
        .detail-table th {
            text-align: left;
            padding: 14px 16px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
            border-bottom: 2px solid #e9ecef;
        }
        .detail-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            color: #333;
        }
        .detail-table tbody tr:hover td {
            background: #f8f9fa;
        }
        .detail-desc {
            color: #666;
            font-size: 12px;
            background: #f8f9fa;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        /* ===== 页脚说明 ===== */
        .footer-note {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="pulse-container">
        <!-- 页头 -->
        <div class="pulse-header">
            <h2><i class="fa fa-heartbeat"></i> 心跳管理</h2>
            <p>实时监控生产订单健康状态，发现潜在问题 —— 企业脉搏健康分析系统</p>
        </div>

        <!-- 健康状态卡片 -->
        <div class="pulse-status-card status-good" id="pulseStatusCard">
            <div class="status-top">
                <span class="status-title">企业健康度</span>
                <span class="status-update-time" id="updateTime">2026-06-17 10:30:00</span>
            </div>
            <div class="status-score-section">
                <div class="status-score-container">
                    <div class="status-score-number good" id="healthScore">82</div>
                    <div class="status-label" id="healthLabel">健康状态良好</div>
                </div>
                <div class="heartbeat-chart-container" id="heartbeatChartContainer">
                    <div class="chart-title">健康趋势（近30天）</div>
                    <canvas class="chart-canvas" id="heartbeatChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 勾选框区域 -->
        <div class="checkbox-section">
            <div class="checkbox-title">健康趋势曲线选择（勾选后在上方趋势图中显示对应指标）</div>
            <div class="checkbox-items">
                <label class="checkbox-item">
                    <input type="checkbox" id="cb-bemc" data-field="bemc" checked>
                    <span>BOM计划外领料</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="cb-nbtc" data-field="nbtc" checked>
                    <span>无BOM表</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="cb-wltic" data-field="wltic" checked>
                    <span>领用齐套不足</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="cb-upmc" data-field="upmc">
                    <span>未确定工艺</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="cb-alrc" data-field="alrc">
                    <span>异常损耗率</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="cb-mprw" data-field="mprw">
                    <span>材料量价风险预警</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="cb-iew" data-field="iew">
                    <span>库存预警</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="cb-iew1" data-field="iew1">
                    <span>毛利预警</span>
                </label>
            </div>
        </div>

        <!-- 统计数据网格 -->
        <div class="stats-grid" id="statsGrid">
            <!-- 由 JS 渲染 -->
        </div>

        <!-- 异常订单列表 -->
        <div class="orders-section">
            <div class="section-header">
                <div class="section-title"><i class="fa fa-list"></i> 异常订单列表</div>
                <div style="display: flex; gap: 8px;">
                    <button class="refresh-btn export-btn" id="exportBtn">
                        <i class="fa fa-download"></i>
                        <span>导出数据</span>
                    </button>
                    <button class="refresh-btn" id="refreshBtn">
                        <i class="fa fa-refresh"></i>
                        <span>刷新数据</span>
                    </button>
                </div>
            </div>
            <table class="orders-table">
                <thead>
                    <tr>
                        <th>订单号</th>
                        <th>产品名称</th>
                        <th>产品规格</th>
                        <th>问题标签</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                    <!-- 由 JS 渲染 -->
                </tbody>
            </table>
        </div>

        <!-- 页脚说明 -->
        <div class="footer-note">
            <p>© 2026 企业经营全景透视系统 | 企业脉搏健康分析</p>
        </div>
    </div>

    <!-- 弹窗（由 JS 动态填充内容） -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <div class="modal-header" id="modalHeader">
                <div class="modal-title" id="modalTitle">
                    <i class="fa fa-info-circle"></i> 详情
                </div>
                <button class="modal-close" id="modalClose">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- 内容由 JS 动态填充 -->
            </div>
        </div>
    </div>

    <script>
        /* ================================================================
           1. 模拟数据（替换自真实ERP系统的数据）
           ================================================================ */

        const STAT_CARDS = [
            {
                id: 'extraMaterial', icon: 'fa-exclamation-triangle', iconClass: 'extra',
                title: '计划外领料', desc: '订单存在BOM计划外的材料出库',
                count: 5, hasIssues: true, field: 'extra'
            },
            {
                id: 'noBom', icon: 'fa-file-text-o', iconClass: 'no-bom',

            },
            {
                id: 'insufficient', icon: 'fa-cubes', iconClass: 'insufficient',

            {
                id: 'noProcess', icon: 'fa-cogs', iconClass: 'no-process',
                title: '未确定工艺', desc: '材料出库未指定工艺路线',
                count: 2, hasIssues: true, field: 'no-process'
            },
            {
                id: 'abnormalLoss', icon: 'fa-fire', iconClass: 'abnormal',
                title: '异常损耗率', desc: '材料损耗率超出正常范围（>5%）',
                count: 4, hasIssues: true, field: 'abnormal'
            },
            {
                id: 'materialPriceRisk', icon: 'fa-line-chart', iconClass: 'price',
                title: '材料量价风险预警', desc: '供应商价格波动超出风险阈值',
                count: 4, hasIssues: true, field: 'price'
            },
            {
                id: 'inventoryAlert', icon: 'fa-warehouse', iconClass: 'inventory',
                title: '库存预警', desc: '库存不足，且未识别到有效采购计划',
                count: 0, hasIssues: false, field: 'inventory'
            },
            {
                id: 'marginAlert', icon: 'fa-money', iconClass: 'margin',
                title: '产品毛利预警', desc: '毛利低于该产品"流动均值百分比"阈值',
                count: 0, hasIssues: false, field: 'margin'
            }
        ];

        const ABNORMAL_ORDERS = [
            {
                no: 'PO-2026-0612-001',
                name: '定制实木办公桌',
                spec: '1600×800×750mm',
                tags: ['extra', 'insufficient', 'abnormal']
            },
            {
                no: 'PO-2026-0612-003',
                name: '橡木餐椅',
                spec: '450×450×900mm',
                tags: ['no-bom', 'no-process']
            },
            {
                no: 'PO-2026-0613-005',
                name: '双层书架',
                spec: '800×300×1800mm',
                tags: ['insufficient', 'abnormal']

        /* 健康趋势的历史数据 —— 近30天 */
        const FIELD_COLORS = {
            'bemc': '#ff6b6b',       // 计划外领料
            'nbtc': '#4facfe',        // 无BOM表

            'upmc': '#a55eea',        // 未确定工艺

        /* 生成30天模拟数据的工具函数 */
        function generate30DayData() {
            const labels = [];
            const healthScores = [];
            const byField = {
                'bemc': [], 'nbtc': [], 'wltic': [], 'upmc': [],
                'alrc': [], 'mprw': [], 'iew': [], 'iew1': []
            };
            const today = new Date();
            for (let i = 29; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(today.getDate() - i);
                labels.push(`${d.getMonth() + 1}/${d.getDate()}`);

                // 每天的模拟指标值（0-15的随机整数）
                byField['bemc'].push(Math.floor(Math.random() * 6) + 2);
                byField['nbtc'].push(Math.floor(Math.random() * 4) + 1);
                byField['wltic'].push(Math.floor(Math.random() * 8) + 3);
                byField['upmc'].push(Math.floor(Math.random() * 3) + 1);
                byField['alrc'].push(Math.floor(Math.random() * 5) + 1);
                byField['mprw'].push(Math.floor(Math.random() * 4) + 2);
                byField['iew'].push(Math.floor(Math.random() * 3));
                byField['iew1'].push(Math.floor(Math.random() * 2));

                // 综合健康评分：问题越少分越高
                const totalIssues = byField['bemc'][byField['bemc'].length - 1]
                    + byField['nbtc'][byField['nbtc'].length - 1]
                    + byField['wltic'][byField['wltic'].length - 1]
                    + byField['upmc'][byField['upmc'].length - 1]
                    + byField['alrc'][byField['alrc'].length - 1];
                const score = Math.max(60, Math.min(95, 95 - totalIssues * 2 + Math.floor(Math.random() * 6) - 3));
                healthScores.push(score);
            }
            return { labels, healthScores, byField };
        }

        const TREND_DATA = generate30DayData();

        /* ================================================================
           4. 健康趋势图（Canvas绘制）
           ================================================================ */
        function drawChart() {
            const canvas = document.getElementById('heartbeatChart');
            if (!canvas) return;

            const parent = canvas.parentElement;
            const dpr = window.devicePixelRatio || 1;
            const width = parent.clientWidth - 30;
            const height = parent.clientHeight - 30;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';

            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            ctx.clearRect(0, 0, width, height);

            const padding = { top: 20, right: 20, bottom: 30, left: 40 };
            const chartW = width - padding.left - padding.right;
            const chartH = height - padding.top - padding.bottom;

            // 绘制背景网格
            ctx.strokeStyle = 'rgba(79, 195, 247, 0.12)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 5; i++) {
                const y = padding.top + (chartH / 5) * i;
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(padding.left + chartW, y);
                ctx.stroke();
                // Y轴标签（60-100分）
                ctx.fillStyle = 'rgba(79, 195, 247, 0.6)';
                ctx.font = '11px sans-serif';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillText(String(100 - i * 8), padding.left - 6, y);
            }

            // 获取当前勾选的字段
            const checkedBoxes = document.querySelectorAll('.checkbox-section input[type="checkbox"]:checked');
            const activeFields = [];
            checkedBoxes.forEach(cb => {
                if (cb.dataset.field && FIELD_COLORS[cb.dataset.field]) {
                    activeFields.push(cb.dataset.field);
                }
            });

            const n = TREND_DATA.labels.length;

            // 绘制其他选中的指标（作为折线）
            activeFields.forEach(field => {
                const data = TREND_DATA.byField[field];
                if (!data) return;
                const maxVal = Math.max(...data);

                ctx.strokeStyle = FIELD_COLORS[field];
                ctx.lineWidth = 1.5;
                ctx.globalAlpha = 0.45;
                ctx.beginPath();
                for (let i = 0; i < n; i++) {
                    const x = padding.left + (chartW / (n - 1)) * i;
                    // Y轴映射：把指标值（0-maxVal）映射到图上
                    const normalized = maxVal > 0 ? data[i] / maxVal : 0;
                    const y = padding.top + chartH * (1 - normalized * 0.7);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();

                // 绘制小圆点
                ctx.fillStyle = FIELD_COLORS[field];
                for (let i = 0; i < n; i += 5) {
                    const x = padding.left + (chartW / (n - 1)) * i;
                    const normalized = maxVal > 0 ? data[i] / maxVal : 0;
                    const y = padding.top + chartH * (1 - normalized * 0.7);
                    ctx.beginPath();
                    ctx.arc(x, y, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            ctx.globalAlpha = 1;

            // 绘制主健康评分曲线（最亮、最粗、带填充）
            const mainColor = '#4fc3f7';
            ctx.strokeStyle = mainColor;
            ctx.lineWidth = 2.5;
            ctx.shadowColor = mainColor;
            ctx.shadowBlur = 8;
            ctx.beginPath();
            for (let i = 0; i < n; i++) {
                const x = padding.left + (chartW / (n - 1)) * i;
                const y = padding.top + chartH * (1 - (TREND_DATA.healthScores[i] - 60) / 40);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            // 填充渐变
            const gradient = ctx.createLinearGradient(0, padding.top, 0, padding.top + chartH);
            gradient.addColorStop(0, 'rgba(79, 195, 247, 0.25)');
            gradient.addColorStop(1, 'rgba(79, 195, 247, 0)');
            ctx.fillStyle = gradient;
            ctx.shadowBlur = 0;
            ctx.lineTo(padding.left + chartW, padding.top + chartH);
            ctx.lineTo(padding.left, padding.top + chartH);
            ctx.closePath();
            ctx.fill();

            // 绘制主曲线的圆点
            ctx.shadowBlur = 0;
            ctx.fillStyle = mainColor;
            for (let i = 0; i < n; i++) {
                const x = padding.left + (chartW / (n - 1)) * i;
                const y = padding.top + chartH * (1 - (TREND_DATA.healthScores[i] - 60) / 40);
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            // X轴标签（每5天显示一个）
            ctx.fillStyle = 'rgba(79, 195, 247, 0.6)';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            for (let i = 0; i < n; i += 5) {
                const x = padding.left + (chartW / (n - 1)) * i;
                ctx.fillText(TREND_DATA.labels[i], x, padding.top + chartH + 8);
            }

            // 图例
            const legendItems = [{ label: '健康评分', color: mainColor }];
            activeFields.forEach(field => {
                const fieldLabels = {
                    'bemc': '计划外领料', 'nbtc': '无BOM表', 'wltic': '领用齐套不足',
                    'upmc': '未确定工艺', 'alrc': '异常损耗率', 'mprw': '量价风险',
                    'iew': '库存预警', 'iew1': '毛利预警'
                };
                legendItems.push({ label: fieldLabels[field] || field, color: FIELD_COLORS[field] });
            });

            ctx.font = '11px sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            let legendX = padding.left;
            const legendY = 12;
            legendItems.forEach(item => {
                ctx.fillStyle = item.color;
                ctx.fillRect(legendX, legendY - 4, 10, 3);
                ctx.fillStyle = 'rgba(79, 195, 247, 0.85)';
                ctx.fillText(item.label, legendX + 14, legendY);
                legendX += ctx.measureText(item.label).width + 30;
            });
        }

        /* ================================================================
           5. 弹窗控制
           ================================================================ */
        function showModal(data) {
            if (!data) return;
            const modal = document.getElementById('detailModal');
            const header = document.getElementById('modalHeader');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');

            header.style.background = data.headerStyle;
            title.innerHTML = `<i class="fa ${data.icon}"></i> ${data.title}`;

            body.innerHTML = `
                <table class="detail-table">
                    <thead>
                        <tr>
                            ${data.columns.map(c => `<th>${c}</th>`).join('')}
                        </tr>
                    </thead>
                    <tbody>
                        ${data.rows.map(row => `
                            <tr>
                                ${row.map((cell, idx) => `
                                    <td${idx === 0 ? ' class="order-number"' : ''}>${cell}</td>
                                `).join('')}
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            modal.classList.add('active');
        }

        function hideModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        /* ================================================================
           6. 事件绑定
           ================================================================ */
        function bindEvents() {
            document.getElementById('modalClose').addEventListener('click', hideModal);
            document.getElementById('detailModal').addEventListener('click', (e) => {
                if (e.target.id === 'detailModal') hideModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') hideModal();
            });

            document.getElementById('refreshBtn').addEventListener('click', () => {
                // 简单的"刷新"反馈：重新生成数据
                const now = new Date();
                document.getElementById('updateTime').textContent =
                    `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
                const newScore = Math.floor(Math.random() * 15) + 75;
                document.getElementById('healthScore').textContent = newScore;
                const labelEl = document.getElementById('healthLabel');
                const cardEl = document.getElementById('pulseStatusCard');
                const scoreNumEl = document.getElementById('healthScore');
                cardEl.classList.remove('status-excellent', 'status-good', 'status-warning', 'status-critical');
                if (newScore >= 90) {
                    cardEl.classList.add('status-excellent');
                    labelEl.textContent = '运营状态优秀';
                    scoreNumEl.classList.remove('good');
                } else if (newScore >= 80) {
                    cardEl.classList.add('status-good');
                    labelEl.textContent = '健康状态良好';
                    scoreNumEl.classList.add('good');
                } else if (newScore >= 70) {
                    cardEl.classList.add('status-warning');
                    labelEl.textContent = '需要关注的问题较多';
                    scoreNumEl.classList.remove('good');
                } else {
                    cardEl.classList.add('status-critical');
                    labelEl.textContent = '存在较多异常需处理';
                    scoreNumEl.classList.remove('good');
                }
                drawChart();
            });

            document.getElementById('exportBtn').addEventListener('click', () => {
                alert('正在为您准备导出文件：\n\n1. 异常订单明细（CSV/Excel）\n2. 健康趋势图（PNG）\n3. 供应商风险分析（PDF）\n\n（导出功能需连接后端服务）');
            });

            // 勾选框改变时重绘图表
            document.querySelectorAll('.checkbox-section input[type="checkbox"]').forEach(cb => {
                cb.addEventListener('change', drawChart);
            });

            // 窗口大小改变时重绘
            window.addEventListener('resize', drawChart);
        }

        /* ================================================================
           7. 初始化
           ================================================================ */
        function init() {
            renderStatsGrid();
            renderOrders();
            bindEvents();
            // 延迟一点，确保容器尺寸已计算
            setTimeout(drawChart, 50);
            setTimeout(drawChart, 300);
        }

        init();
    </script>
