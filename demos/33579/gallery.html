<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作品画廊 · 年年有印</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    .gallery-head {
      padding: 60px 0 40px;
      text-align: center;
    }
    .gallery-head h1 {
      font-family: var(--font-brush);
      font-size: 52px;
      color: var(--c-red);
      letter-spacing: 6px;
      margin: 0 0 12px;
    }
    .gallery-head p { color: var(--c-ink-soft); font-size: 16px; }

    .tab-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 30px 0 40px;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 8px 22px;
      background: var(--c-paper);
      border: 1.5px solid var(--c-line-dark);
      color: var(--c-ink-soft);
      border-radius: 24px;
      font-family: var(--font-brush);
      letter-spacing: 3px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active { background: var(--c-red); color: var(--c-paper); border-color: var(--c-red); }
    .tab-btn:hover:not(.active) { border-color: var(--c-red); color: var(--c-red); }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      padding-bottom: 60px;
    }
    .gallery-item {
      background: var(--c-paper);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--c-line);
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
      position: relative;
    }
    .gallery-item:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 36px rgba(60,40,20,0.2);
    }
    .gallery-visual {
      aspect-ratio: 3/4;
      background: var(--c-bg-2);
      overflow: hidden;
    }
    .gallery-visual img,
    .gallery-visual svg { width: 100%; height: 100%; display: block; }
    .gallery-meta {
      padding: 16px 18px;
      border-top: 1px solid var(--c-line);
    }
    .gallery-meta h4 {
      font-family: var(--font-brush);
      font-size: 18px;
      letter-spacing: 2px;
      margin: 0 0 6px;
      color: var(--c-ink);
    }
    .gallery-meta .author {
      font-size: 13px;
      color: var(--c-muted);
    }
    .color-dots {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    .color-dots span {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 1px solid var(--c-line-dark);
    }
    .like-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255,255,255,0.9);
      color: var(--c-red);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--c-muted);
    }
    .empty-state .icon {
      font-family: var(--font-brush);
      font-size: 80px;
      color: var(--c-line-dark);
      opacity: 0.4;
    }

    .my-works-banner {
      background: var(--c-bg-2);
      padding: 30px;
      border-radius: 16px;
      margin: 0 auto 40px;
      text-align: center;
      border: 1px solid var(--c-line);
    }
    .my-works-banner h3 {
      font-family: var(--font-brush);
      font-size: 24px;
      margin: 0 0 8px;
      letter-spacing: 4px;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(29, 26, 22, 0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-content {
      background: var(--c-paper);
      border-radius: 16px;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow: auto;
      padding: 24px;
    }
    .modal-close {
      background: var(--c-red);
      color: var(--c-paper);
      border-radius: 50%;
      width: 40px; height: 40px;
      border: none;
      font-size: 20px;
      float: right;
      cursor: pointer;
    }
    .modal-body { clear: both; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; padding-top: 10px; }
    .modal-img {
      aspect-ratio: 3/4;
      background: var(--c-bg-2);
      border-radius: 12px;
      overflow: hidden;
    }
    .modal-img img { width: 100%; height: 100%; object-fit: contain; }
    .modal-info h3 { font-family: var(--font-brush); font-size: 28px; letter-spacing: 4px; margin: 0 0 12px; color: var(--c-red); }
    .modal-info p { color: var(--c-ink-soft); line-height: 1.8; margin: 0 0 10px; }

    @media (max-width: 700px) {
      .modal-body { grid-template-columns: 1fr; }
      .gallery-head h1 { font-size: 36px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav-bar">
      <a href="index.html" class="logo">
        <span class="logo-seal">印</span>
        <span class="logo-text">年年有印</span>
      </a>
      <nav class="main-nav">
        <a href="index.html">首页</a>
        <a href="create.html">开始创作</a>
        <a href="learn.html">年画知识</a>
        <a href="gallery.html" class="active">作品画廊</a>
        <a href="shop.html">文创周边</a>
      </nav>
      <a href="create.html" class="btn btn-primary">立刻创作</a>
    </div>
  </header>

  <section class="gallery-head">
    <div class="container">
      <h1>作 品 画 廊</h1>
      <p>来看看大家印出的年味儿</p>
    </div>
  </section>

  <div class="container">
    <div class="tab-row" id="tabRow">
      <button class="tab-btn active" data-tab="featured">精选</button>
      <button class="tab-btn" data-tab="mine">我的作品</button>
      <button class="tab-btn" data-tab="door">门神</button>
      <button class="tab-btn" data-tab="fish">连年有余</button>
      <button class="tab-btn" data-tab="fortune">财神</button>
      <button class="tab-btn" data-tab="fu">福字</button>
    </div>

    <div id="galleryGrid" class="gallery-grid"></div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="document.getElementById('modal').classList.remove('show')">×</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <div class="logo"><span class="logo-seal">印</span><span class="logo-text">年年有印</span></div>
        <p>一门正在消失的手艺，一次可以参与的体验。</p>
      </div>
      <div class="footer-cols">
        <div><h4>创作</h4><a href="create.html">开始创作</a><a href="gallery.html">作品画廊</a></div>
        <div><h4>了解</h4><a href="learn.html">年画知识</a></div>
        <div><h4>周边</h4><a href="shop.html">文创商城</a></div>
      </div>
      <div class="footer-copy">© 年年有印 · 非遗数字体验作品</div>
    </div>
  </footer>

  <script>
    // 预置作品数据
    const templates = {
      door: { title: "门神 · 秦琼敬德", colors: ["#b7282e","#c9a24b","#1d1a16"] },
      fish: { title: "连年有余", colors: ["#d9484e","#c9a24b","#1d1a16"] },
      fortune: { title: "财神到", colors: ["#8a1c22","#ffd700","#1d1a16"] },
      spring: { title: "春回大地", colors: ["#2a5a8a","#4f7a4a","#1d1a16"] },
      magpie: { title: "喜上眉梢", colors: ["#d9484e","#c9a24b","#1d1a16"] },
      fu: { title: "五福临门", colors: ["#b7282e","#ffd700","#1d1a16"] }
    };
    const authors = ["老艺人","小年画","墨香","墨 墨","一 手","青 青","墨 梅","年 年"];
    const featuredWorks = [
      { t: "door", by: "老艺人" },
      { t: "fish", by: "小朋友" },
      { t: "fortune", by: "招财猫" },
      { t: "fu", by: "春联子" },
      { t: "spring", by: "喜鹊" },
      { t: "magpie", by: "墨梅" },
      { t: "door", by: "年年" },
      { t: "fish", by: "有余" },
      { t: "fortune", by: "福到" },
      { t: "fu", by: "墨香" },
      { t: "spring", by: "青 青" },
      { t: "magpie", by: "小 墨" }
    ];

    // 生成简化 SVG 年画（含颜色变体）
    function genSvg(key, variant = 0) {
      const data = templates[key] || templates.door;
      const main = data.colors[0], accent = data.colors[1], line = data.colors[2];
      let content = '';
      if (key === 'door') {
        content = `
          <rect x="100" y="50" width="200" height="380" fill="#fdf6e3" stroke="${line}" stroke-width="4"/>
          <circle cx="200" cy="130" r="45" fill="#f5cfb0" stroke="${line}" stroke-width="3"/>
          <path d="M155 130 L180 140 M220 140 L245 130" stroke="${line}" stroke-width="5" fill="none"/>
          <circle cx="185" cy="145" r="5" fill="${line}"/>
          <circle cx="215" cy="145" r="5" fill="${line}"/>
          <path d="M185 180 Q200 200 Q215 180" stroke="${line}" stroke-width="4" fill="none"/>
          <path d="M130 220 L270 220 L250 380 L150 380 Z" fill="${main}" stroke="${line}" stroke-width="3"/>
          <rect x="180" y="260" width="40" height="40" fill="${accent}" stroke="${line}" stroke-width="2"/>
          <rect x="100" y="50" width="200" height="380" fill="none" stroke="${line}" stroke-width="3"/>
          <rect x="110" y="60" width="180" height="360" fill="none" stroke="${line}" stroke-width="1" stroke-dasharray="3 3"/>`;
      } else if (key === 'fish') {
        content = `
          <rect x="100" y="50" width="200" height="380" fill="#fdf6e3" stroke="${line}" stroke-width="4"/>
          <ellipse cx="200" cy="180" rx="70" ry="75" fill="#f5cfb0" stroke="${line}" stroke-width="3"/>
          <circle cx="200" cy="110" r="45" fill="#f5cfb0" stroke="${line}" stroke-width="3"/>
          <path d="M165 140 Q175 155 Q185 140" fill="#e89088" opacity="0.6"/>
          <path d="M215 140 Q225 155 Q235 140" fill="#e89088" opacity="0.6"/>
          <circle cx="185" cy="120" r="5" fill="${line}"/>
          <circle cx="215" cy="120" r="5" fill="${line}"/>
          <path d="M195 155 Q205 165 Q215 155" stroke="${line}" stroke-width="3" fill="none"/>
          <path d="M150 240 Q200 250 Q250 240 Q270 270 Q200 290 Q130 270 Z" fill="${main}" stroke="${line}" stroke-width="3"/>
          <circle cx="160" cy="260" r="8" fill="${line}"/>
          <ellipse cx="200" cy="260" rx="8" ry="6" fill="${accent}" stroke="${line}" stroke-width="1"/>`;
      } else if (key === 'fortune') {
        content = `
          <rect x="100" y="50" width="200" height="380" fill="#fdf6e3" stroke="${line}" stroke-width="4"/>
          <rect x="140" y="75" width="120" height="25" fill="${main}" stroke="${line}" stroke-width="3"/>
          <circle cx="200" cy="150" r="42" fill="#f5cfb0" stroke="${line}" stroke-width="3"/>
          <path d="M175 145 Q185 130 L200 145 Q215 130 L225 145" stroke="${line}" stroke-width="3" fill="none"/>
          <circle cx="188" cy="155" r="4" fill="${line}"/>
          <circle cx="212" cy="155" r="4" fill="${line}"/>
          <path d="M180 175 L190 180 Q200 190 L210 180 L220 175" stroke="${line}" stroke-width="3" fill="none"/>
          <path d="M120 215 L280 215 L270 380 L130 380 Z" fill="${main}" stroke="${line}" stroke-width="3"/>
          <rect x="150" y="260" width="100" height="25" fill="${accent}" stroke="${line}" stroke-width="2"/>
          <path d="M170 320 Q200 340 Q230 320 Q240 340 Q200 360 Q160 340 Z" fill="${accent}" stroke="${line}" stroke-width="2"/>`;
      } else if (key === 'spring') {
        content = `
          <rect x="100" y="50" width="200" height="380" fill="#fdf6e3" stroke="${line}" stroke-width="4"/>
          <g stroke="${line}" stroke-width="4" fill="none">
            <path d="M110 200 Q140 180 L180 200 Q220 180 L260 200 Q290 200"/>
            <path d="M120 240 L160 230"/>
            <path d="M200 230 L240 240"/>
          </g>
          ${[130, 170, 210, 250].map((x,i)=>`<g transform="translate(${x}, ${210+(i%2===0?0:20})"><circle r="10" fill="${main}" stroke="${line}" stroke-width="2"/></g>`).join('')}
          ${[150,190,230].map((x,i)=>`<g transform="translate(${x}, ${220})"><circle r="8" fill="${main}" stroke="${line}" stroke-width="2"/></g>`).join('')}
          <text x="200" y="400" font-family="serif" font-size="36" fill="${main}" text-anchor="middle" font-weight="bold">春</text>`;
      } else if (key === 'magpie') {
        content = `
          <rect x="100" y="50" width="200" height="380" fill="#fdf6e3" stroke="${line}" stroke-width="4"/>
          <line x1="110" y1="400" x2="290" y2="200" stroke="${line}" stroke-width="6"/>
          <g transform="translate(200, 150)"><ellipse rx="30" ry="20" fill="${line}"/><circle cx="-15" cy="-10" r="12" fill="${line}"/><circle cx="-20" cy="-13" r="3" fill="${accent}"/></g>
          ${[160,200,240].map((x,i)=>`<g transform="translate(${x},${350+i*10})"><circle r="9" fill="${main}" stroke="${line}" stroke-width="2"/></g>`).join('')}
          <text x="130" y="150" font-family="serif" font-size="42" fill="${main}" font-weight="bold" stroke="${line}" stroke-width="1">喜</text>`;
      } else { // fu
        content = `
          <rect x="100" y="50" width="200" height="380" fill="#fdf6e3" stroke="${line}" stroke-width="4"/>
          <g transform="translate(200, 240) rotate(0)">
            <rect x="-80" y="-80" width="160" height="160" fill="${main}" stroke="${line}" stroke-width="5"/>
            <text x="0" y="35" font-family="serif" font-size="130" fill="#fdf6e3" text-anchor="middle" font-weight="bold" stroke="${line}" stroke-width="2">福</text>
          </g>
          <g transform="translate(120, 90)"><circle r="10" fill="${accent}" stroke="${line}" stroke-width="2"/></g>
          <g transform="translate(280, 90)"><circle r="10" fill="${accent}" stroke="${line}" stroke-width="2"/></g>`;
      }
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="width:100%;height:100%">
        <rect width="400" height="500" fill="#fdf6e3"/>
        ${content}
      </svg>`;
    }

    function renderGallery(tab) {
      const grid = document.getElementById('galleryGrid');
      let items = [];
      if (tab === 'mine') {
        const works = JSON.parse(localStorage.getItem('nainian_works') || '[]');
        if (works.length === 0) {
          grid.innerHTML = `
            <div class="container" style="grid-column:1/-1">
              <div class="empty-state">
                <div class="icon">印</div>
                <h3 style="font-family:var(--font-brush);font-size:24px;margin:20px 0 10px;letter-spacing:4px;">还 没 有 作 品</h3>
                <p style="font-size:15px;">在创作页面做完后，点"保存到我的作品"就能在这里看到啦</p>
                <a href="create.html" style="display:inline-block;margin-top:20px;padding:10px 28px;background:var(--c-red);color:var(--c-paper);border-radius:8px;text-decoration:none;">去创作一张</a>
              </div>
            </div>`;
          return;
        }
        items = works.map(w => ({ key: w.template, by: '我自己', time: w.time, image: w.dataUrl, colors: w.colors }));
      } else if (tab === 'featured') {
        items = featuredWorks.map((w, i) => ({ key: w.t, by: w.by + (i % 3 === 0 ? ' · 一级画师' : ' · 学员'), colors: templates[w.t].colors }));
      } else {
        items = featuredWorks.filter(w => w.t === tab).map(w => ({ key: w.t, by: w.by, colors: templates[w.t].colors }));
        if (items.length < 4) items = items.concat(items.slice(0, 4 - items.length));
      }

      grid.innerHTML = items.map((item, idx) => `
        <div class="gallery-item" data-idx="${idx}">
          <div class="gallery-visual">
            ${item.image ? `<img src="${item.image}" alt="作品"/>` : `<div style="width:100%;height:100%">${genSvg(item.key, idx)}</div>`}
          </div>
          <div class="gallery-meta">
            <h4>${templates[item.key] ? templates[item.key].title : '我的年画'}</h4>
            <div class="author">作者：${item.by}</div>
            <div class="color-dots">
              ${(item.colors || templates[item.key].colors).slice(0,3).map(c => `<span style="background:${c}"></span>`).join('')}
            </div>
          </div>
          <span class="like-btn">♡ ${Math.floor(Math.random() * 200) + 20}</span>
        </div>`).join('');

      // 绑定点击事件
      grid.querySelectorAll('.gallery-item').forEach((el) => {
        el.addEventListener('click', () => {
          const idx = +el.dataset.idx;
          const item = items[idx];
          const title = (templates[item.key] || {}).title || '我的年画';
          const imgHtml = item.image
            ? `<img src="${item.image}" alt="作品"/>`
            : `<div style="width:100%;height:100%">${genSvg(item.key, idx)}</div>`;
          document.getElementById('modalBody').innerHTML = `
            <div class="modal-img">${imgHtml}</div>
            <div class="modal-info">
              <h3>${title}</h3>
              <p><strong>作者：</strong>${item.by}</p>
              <p><strong>题材：</strong>${title}</p>
              <p><strong>创作感言：</strong>亲手刻一版，印一张属于自己的年画，年味儿就有啦。</p>
              <p><strong>工序：</strong>勾线 → 刻版 → 套色 → 印制</p>
              <p style="color:var(--c-muted);font-size:13px;">点击下方按钮，用你自己的手，印一张属于你的年画。</p>
              <a href="create.html?template=${item.key}" style="display:inline-block;margin-top:20px;padding:10px 24px;background:var(--c-red);color:var(--c-paper);border-radius:8px;text-decoration:none;letter-spacing:3px;font-weight:bold;">类似模板创作一张</a>
            </div>
          `;
          document.getElementById('modal').classList.add('show');
        });
      });
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGallery(btn.dataset.tab);
      });
    });

    // 初始渲染
    renderGallery('featured');
  </script>
</body>
</html>
