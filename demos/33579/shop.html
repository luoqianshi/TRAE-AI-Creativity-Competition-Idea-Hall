<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文创周边 · 年年有印</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    .shop-head {
      padding: 60px 0 30px;
      text-align: center;
    }
    .shop-head h1 {
      font-family: var(--font-brush);
      font-size: 52px;
      color: var(--c-red);
      letter-spacing: 8px;
      margin: 0 0 10px;
    }
    .shop-head p { color: var(--c-ink-soft); font-size: 16px; }

    .category-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 20px 0 40px;
      flex-wrap: wrap;
    }
    .cat-btn {
      padding: 10px 24px;
      background: var(--c-paper);
      border: 1.5px solid var(--c-line-dark);
      border-radius: 24px;
      font-family: var(--font-brush);
      letter-spacing: 3px;
      font-size: 16px;
      color: var(--c-ink-soft);
      cursor: pointer;
      transition: all 0.2s;
    }
    .cat-btn:hover { border-color: var(--c-red); color: var(--c-red); }
    .cat-btn.active { background: var(--c-red); color: var(--c-paper); border-color: var(--c-red); }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 30px;
      padding-bottom: 60px;
    }
    .product-card {
      background: var(--c-paper);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--c-line);
      box-shadow: 0 4px 18px rgba(60,40,20,0.1);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 14px 40px rgba(60,40,20,0.18);
    }
    .product-img {
      aspect-ratio: 4/3;
      background: var(--c-bg-2);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    .product-img svg { width: 100%; height: 100%; max-width: 220px; }
    .product-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: var(--c-red);
      color: var(--c-paper);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      letter-spacing: 2px;
      font-family: var(--font-brush);
    }
    .product-body {
      padding: 20px 24px 24px;
    }
    .product-body h3 {
      font-family: var(--font-brush);
      font-size: 22px;
      margin: 0 0 8px;
      letter-spacing: 3px;
      color: var(--c-ink);
    }
    .product-body p {
      color: var(--c-ink-soft);
      font-size: 14px;
      margin: 0 0 16px;
      min-height: 40px;
      line-height: 1.6;
    }
    .product-price {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .price {
      font-family: var(--font-brush);
      color: var(--c-red);
      font-size: 24px;
      letter-spacing: 2px;
    }
    .price small { font-size: 14px; color: var(--c-ink-soft); margin-left: 8px; text-decoration: line-through; }
    .btn-add {
      background: var(--c-ink);
      color: var(--c-paper);
      padding: 8px 18px;
      border-radius: 24px;
      border: none;
      font-family: var(--font-brush);
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-add:hover { background: var(--c-red); }

    /* 定制 CTA */
    .custom-band {
      background:
        linear-gradient(135deg, var(--c-red), var(--c-red-deep));
      color: var(--c-paper);
      border-radius: 20px;
      padding: 50px 40px;
      margin-bottom: 60px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .custom-band::before {
      content: "印";
      position: absolute;
      right: 40px;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--font-brush);
      font-size: 200px;
      opacity: 0.1;
      line-height: 1;
    }
    .custom-band h2 {
      font-family: var(--font-brush);
      font-size: 36px;
      letter-spacing: 6px;
      margin: 0 0 16px;
    }
    .custom-band p { font-size: 16px; opacity: 0.9; margin: 0 0 24px; }
    .custom-band .btn {
      background: var(--c-paper);
      color: var(--c-red-deep);
      padding: 14px 32px;
      font-size: 16px;
    }
    .custom-band .btn:hover { background: var(--c-gold-light); color: var(--c-red-deep); }

    /* 购物车 */
    .cart-float {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 60px; height: 60px;
      background: var(--c-red);
      color: var(--c-paper);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(183,40,46,0.45);
      z-index: 100;
    }
    .cart-float .count {
      position: absolute;
      top: -5px;
      right: -5px;
      width: 24px; height: 24px;
      background: var(--c-gold);
      color: var(--c-ink);
      border-radius: 50%;
      font-size: 13px;
      font-family: var(--font-brush);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--c-paper);
    }

    .toast {
      position: fixed;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--c-ink);
      color: var(--c-paper);
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 200;
    }
    .toast.show { opacity: 1; }

    @media (max-width: 600px) {
      .shop-head h1 { font-size: 36px; }
      .custom-band h2 { font-size: 26px; }
      .custom-band::before { font-size: 100px; right: 20px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav-bar">
      <a href="index.html" class="logo">
        <span class="logo-seal">印</span>
        <span class="logo-text">年年有印</span>
      </a>
      <nav class="main-nav">
        <a href="index.html">首页</a>
        <a href="create.html">开始创作</a>
        <a href="learn.html">年画知识</a>
        <a href="gallery.html">作品画廊</a>
        <a href="shop.html" class="active">文创周边</a>
      </nav>
      <a href="create.html" class="btn btn-primary">立刻创作</a>
    </div>
  </header>

  <section class="shop-head">
    <div class="container">
      <h1>文 创 周 边</h1>
      <p>把年味儿带回家</p>
    </div>
  </section>

  <div class="container">
    <!-- 定制大横幅 -->
    <div class="custom-band">
      <h2>定 制 你 的 年 画</h2>
      <p>上传你创作的年画，或让我们为你设计 → 变成挂画、春联、利是封、冰箱贴</p>
      <a href="create.html" class="btn">去 创 作 一 张</a>
    </div>

    <div class="category-tabs" id="catTabs">
      <button class="cat-btn active" data-cat="all">全部</button>
      <button class="cat-btn" data-cat="print">挂画 · 版画</button>
      <button class="cat-btn" data-cat="couplet">春联 · 对联</button>
      <button class="cat-btn" data-cat="envelope">利是封</button>
      <button class="cat-btn" data-cat="magnet">冰箱贴</button>
      <button class="cat-btn" data-cat="tea">文房雅玩</button>
    </div>

    <div id="productGrid" class="product-grid"></div>
  </div>

  <div class="cart-float" id="cartBtn" title="购物袋">
    🛍️
    <div class="count" id="cartCount" style="display:none">0</div>
  </div>

  <div class="toast" id="toast">已加入购物袋</div>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <div class="logo"><span class="logo-seal">印</span><span class="logo-text">年年有印</span></div>
        <p>一门正在消失的手艺，一次可以参与的体验。</p>
      </div>
      <div class="footer-cols">
        <div><h4>创作</h4><a href="create.html">开始创作</a><a href="gallery.html">作品画廊</a></div>
        <div><h4>了解</h4><a href="learn.html">年画知识</a></div>
        <div><h4>周边</h4><a href="shop.html">文创商城</a></div>
      </div>
      <div class="footer-copy">© 年年有印 · 非遗数字体验作品</div>
    </div>
  </footer>

  <script>
    // SVG 生成
    function makeProductVisual(key, color) {
      const main = color || '#b7282e', accent = '#c9a24b', line = '#1d1a16', bg = '#fdf6e3';
      if (key === 'print-1') return `<svg viewBox="0 0 400 300"><rect width="400" height="300" fill="${bg}"/><g transform="translate(80, 30)"><rect width="240" height="240" fill="${bg}" stroke="${line}" stroke-width="6"/><text x="120" y="170" font-family="serif" font-size="140" fill="${main}" text-anchor="middle" font-weight="bold" stroke="${line}" stroke-width="2">福</text><circle cx="30" cy="30" r="10" fill="${accent}"/></g></svg>`;
      if (key === 'print-2') return `<svg viewBox="0 0 400 300"><rect width="400" height="300" fill="${bg}"/><rect x="80" y="30" width="240" height="240" fill="${bg}" stroke="${line}" stroke-width="6"/><circle cx="200" cy="120" r="60" fill="#f5cfb0" stroke="${line}" stroke-width="4"/><path d="M150 110 Q165 95 L185 115 M215 115 Q235 95 L250 110" stroke="${line}" stroke-width="4" fill="none"/><circle cx="180" cy="125" r="6" fill="${line}"/><circle cx="220" cy="125" r="6" fill="${line}"/><path d="M170 170 Q200 195 Q230 170" stroke="${line}" stroke-width="4" fill="none"/><path d="M130 200 L270 200 L250 255 L150 255 Z" fill="${main}" stroke="${line}" stroke-width="4"/><circle cx="200" cy="230" r="15" fill="${accent}" stroke="${line}" stroke-width="2"/></svg>`;
      if (key === 'print-3') return `<svg viewBox="0 0 400 300"><rect width="400" height="300" fill="${bg}"/><rect x="80" y="30" width="240" height="240" fill="${bg}" stroke="${line}" stroke-width="6"/><path d="M100 120 Q130 100 160 115 Q190 100 220 115 Q250 100 280 120 Q260 150 250 180 Q260 200 240 220 Q220 235 200 230 Q180 235 160 230 Q140 200 150 180 Z" fill="${main}" stroke="${line}" stroke-width="4"/><circle cx="150" cy="140" r="10" fill="${bg}" stroke="${line}" stroke-width="2"/><circle cx="148" cy="140" r="4" fill="${line}"/><path d="M290 160 L320 170 L290 180" fill="${main}" stroke="${line}" stroke-width="3"/></svg>`;
      if (key === 'couplet-1') return `<svg viewBox="0 0 400 300"><rect width="400" height="300" fill="${bg}"/><rect x="120" y="30" width="50" height="240" fill="${main}" stroke="${line}" stroke-width="3"/><rect x="230" y="30" width="50" height="240" fill="${main}" stroke="${line}" stroke-width="3"/><text x="145" y="75" font-family="serif" font-size="26" fill="${bg}" text-anchor="middle" font-weight="bold">一</text><text x="145" y="115" font-family="serif" font-size="26" fill="${bg}" text-anchor="middle" font-weight="bold">年</text><text x="145" y="155" font-family="serif" font-size="26" fill="${bg}" text-anchor="middle" font-weight="bold">一</text><text x="145" y="195" font-family="serif" font-size="26" fill="${bg}" text-anchor="middle" font-weight="bold">度</text><text x="145" y="235" font-family="serif" font-size="26" fill="${bg}" text-anchor="middle" font-weight="bold">喜</text><text x="255" y="75" font-family="serif" font-size="26" fill="${bg}" text-anchor="middle" font-weight="bold">万</text><text x="255" y="115" font-family="serif" font-size="26" fill="${bg}" text-anchor="middle" font-weight="bold">事</text><text x="255" y="155" font-family="serif" font-size="26" fill="${bg}" text-anchor="middle" font-weight="bold">如</text><text x="255" y="195" font-family="serif" font-size="26" fill="${bg}" text-anchor="middle" font-weight="bold">意</text><text x="255" y="235" font-family="serif" font-size="26" fill="${bg}" text-anchor="middle" font-weight="bold">顺</text></svg>`;
      if (key === 'couplet-2') return `<svg viewBox="0 0 400 300"><rect width="400" height="300" fill="${bg}"/><rect x="80" y="100" width="240" height="100" fill="${main}" stroke="${line}" stroke-width="4"/><text x="200" y="170" font-family="serif" font-size="56" fill="${bg}" text-anchor="middle" font-weight="bold" letter-spacing="10">五福臨門</text><circle cx="100" cy="150" r="8" fill="${accent}" opacity="0.8"/></svg>`;
      if (key === 'envelope-1') return `<svg viewBox="0 0 400 300"><rect width="400" height="300" fill="${bg}"/><rect x="130" y="80" width="140" height="180" fill="${main}" stroke="${line}" stroke-width="4" rx="10"/><path d="M130 90 L200 140 L270 90" fill="none" stroke="${line}" stroke-width="3"/><text x="200" y="180" font-family="serif" font-size="48" fill="${bg}" text-anchor="middle" font-weight="bold">福</text><circle cx="200" cy="230" r="12" fill="${accent}" stroke="${line}" stroke-width="2"/></svg>`;
      if (key === 'envelope-2') return `<svg viewBox="0 0 400 300"><rect width="400" height="300" fill="${bg}"/><rect x="110" y="70" width="80" height="170" fill="${main}" stroke="${line}" stroke-width="3" rx="8"/><rect x="210" y="70" width="80" height="170" fill="${main}" stroke="${line}" stroke-width="3" rx="8"/><text x="150" y="170" font-family="serif" font-size="32" fill="${bg}" text-anchor="middle" font-weight="bold">吉祥</text><text x="250" y="170" font-family="serif" font-size="32" fill="${bg}" text-anchor="middle" font-weight="bold">如意</text><circle cx="150" cy="210" r="8" fill="${accent}"/><circle cx="250" cy="210" r="8" fill="${accent}"/></svg>`;
      if (key === 'magnet-1') return `<svg viewBox="0 0 400 300"><rect width="400" height="300" fill="${bg}"/><circle cx="140" cy="150" r="70" fill="${bg}" stroke="${line}" stroke-width="4"/><circle cx="260" cy="150" r="70" fill="${bg}" stroke="${line}" stroke-width="4"/><text x="140" y="165" font-family="serif" font-size="56" fill="${main}" text-anchor="middle" font-weight="bold">福</text><text x="260" y="165" font-family="serif" font-size="56" fill="${main}" text-anchor="middle" font-weight="bold">禄</text></svg>`;
      if (key === 'magnet-2') return `<svg viewBox="0 0 400 300"><rect width="400" height="300" fill="${bg}"/><rect x="80" y="110" width="80" height="80" fill="${main}" stroke="${line}" stroke-width="4" rx="6"/><rect x="165" y="110" width="80" height="80" fill="${main}" stroke="${line}" stroke-width="4" rx="6"/><rect x="250" y="110" width="80" height="80" fill="${main}" stroke="${line}" stroke-width="4" rx="6"/><text x="120" y="165" font-family="serif" font-size="34" fill="${bg}" text-anchor="middle" font-weight="bold">吉</text><text x="205" y="165" font-family="serif" font-size="34" fill="${bg}" text-anchor="middle" font-weight="bold">祥</text><text x="290" y="165" font-family="serif" font-size="34" fill="${bg}" text-anchor="middle" font-weight="bold">福</text></svg>`;
      if (key === 'tea-1') return `<svg viewBox="0 0 400 300"><rect width="400" height="300" fill="${bg}"/><rect x="100" y="60" width="200" height="140" fill="${main}" stroke="${line}" stroke-width="4" rx="12"/><rect x="130" y="80" width="140" height="100" fill="${bg}" stroke="${line}" stroke-width="2"/><text x="200" y="145" font-family="serif" font-size="36" fill="${line}" text-anchor="middle" font-weight="bold" letter-spacing="4">年畫</text><rect x="150" y="220" width="100" height="25" fill="${accent}" stroke="${line}" stroke-width="3" rx="3"/><text x="200" y="238" font-family="serif" font-size="14" fill="${line}" text-anchor="middle" font-weight="bold">年 年 有 印</text></svg>`;
      if (key === 'tea-2') return `<svg viewBox="0 0 400 300"><rect width="400" height="300" fill="${bg}"/><path d="M150 100 L250 100 L280 250 L120 250 Z" fill="${main}" stroke="${line}" stroke-width="4"/><ellipse cx="200" cy="100" rx="50" ry="10" fill="${accent}" stroke="${line}" stroke-width="3"/><text x="200" y="190" font-family="serif" font-size="38" fill="${bg}" text-anchor="middle" font-weight="bold" letter-spacing="6">有餘</text></svg>`;
      if (key === 'tea-3') return `<svg viewBox="0 0 400 300"><rect width="400" height="300" fill="${bg}"/><rect x="90" y="80" width="70" height="160" fill="${main}" stroke="${line}" stroke-width="4" rx="8"/><rect x="170" y="80" width="70" height="160" fill="${main}" stroke="${line}" stroke-width="4" rx="8"/><rect x="250" y="80" width="70" height="160" fill="${main}" stroke="${line}" stroke-width="4" rx="8"/><text x="125" y="175" font-family="serif" font-size="36" fill="${bg}" text-anchor="middle" font-weight="bold" writing-mode="vertical-rl">年</text><text x="205" y="175" font-family="serif" font-size="36" fill="${bg}" text-anchor="middle" font-weight="bold" writing-mode="vertical-rl">有</text><text x="285" y="175" font-family="serif" font-size="36" fill="${bg}" text-anchor="middle" font-weight="bold" writing-mode="vertical-rl">印</text></svg>`;
      return '';
    }

    const products = [
      { cat: 'print', title: '朱红福字 · 精装版画', price: 128, old: 168, desc: '宣纸精印，木刻原版，朱红套色。', key: 'print-1', badge: '热销' },
      { cat: 'print', title: '门神秦琼 · 传统套色', price: 158, old: 198, desc: '双幅门神，可贴大门，镇宅纳福。', key: 'print-2', color: '#b7282e', badge: '经典' },
      { cat: 'print', title: '连年有余 · 胖娃抱鱼', price: 138, old: 178, desc: '杨柳青风格，寓意年年有余。', key: 'print-3', color: '#d9484e' },
      { cat: 'couplet', title: '手写春联 · 五字联', price: 68, old: 88, desc: '宣纸手工印刷，可定制文字。', key: 'couplet-1', badge: '新年' },
      { cat: 'couplet', title: '横联 · 五福临门', price: 48, old: 58, desc: '与春联搭配，红色宣纸印。', key: 'couplet-2' },
      { cat: 'envelope', title: '朱红利是封 · 福字款', price: 28, old: 38, desc: '一组 8 枚，厚实纸张，送长辈用。', key: 'envelope-1' },
      { cat: 'envelope', title: '吉祥如意 · 文艺红包', price: 32, old: 42, desc: '两枚一套，可定制文字。', key: 'envelope-2', color: '#8a1c22', badge: '新款' },
      { cat: 'magnet', title: '福禄磁贴 · 两枚装', price: 38, old: 48, desc: '厚实陶瓷冰箱贴，磁贴无痕。', key: 'magnet-1' },
      { cat: 'magnet', title: '三字吉祥 · 冰箱贴三枚', price: 48, old: 68, desc: '吉 祥 福 · 三枚一组，磁吸牢固。', key: 'magnet-2', color: '#d9484e' },
      { cat: 'tea', title: '年画书签 · 四枚装', price: 58, old: 78, desc: '金属书签，带流苏，读书雅玩。', key: 'tea-1', badge: '推荐' },
      { cat: 'tea', title: '有余花瓶 · 陶瓷笔海', price: 258, old: 328, desc: '陶瓷烧制，可做文具或花瓶。', key: 'tea-2' },
      { cat: 'tea', title: '年年有印 · 文房礼盒', price: 388, old: 488, desc: '年画书签 + 利是封 + 版画挂轴。', key: 'tea-3', color: '#8a1c22', badge: '珍藏' }
    ];

    function renderProducts(cat) {
      const grid = document.getElementById('productGrid');
      const list = cat === 'all' ? products : products.filter(p => p.cat === cat);
      grid.innerHTML = list.map(p => `
        <div class="product-card">
          <div class="product-img">
            ${p.badge ? `<span class="product-badge">${p.badge}</span>` : ''}
            ${makeProductVisual(p.key, p.color)}
          </div>
          <div class="product-body">
            <h3>${p.title}</h3>
            <p>${p.desc}</p>
            <div class="product-price">
              <span class="price">¥${p.price}<small>¥${p.old}</small></span>
              <button class="btn-add" data-title="${p.title}" data-price="${p.price}">加入购物袋</button>
            </div>
          </div>
        </div>`).join('');

      document.querySelectorAll('.btn-add').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const cart = JSON.parse(localStorage.getItem('nainian_cart') || '[]');
          cart.push({ title: btn.dataset.title, price: +btn.dataset.price, time: Date.now() });
          localStorage.setItem('nainian_cart', JSON.stringify(cart));
          updateCart();
          showToast('已加入购物袋');
        });
      });
    }

    function updateCart() {
      const cart = JSON.parse(localStorage.getItem('nainian_cart') || '[]');
      const countEl = document.getElementById('cartCount');
      if (cart.length > 0) {
        countEl.style.display = 'flex';
        countEl.textContent = cart.length;
      } else {
        countEl.style.display = 'none';
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1800);
    }

    document.getElementById('cartBtn').addEventListener('click', () => {
      const cart = JSON.parse(localStorage.getItem('nainian_cart') || '[]');
      if (cart.length === 0) {
        showToast('购物袋还是空的哦，去挑几件吧~');
        return;
      }
      const total = cart.reduce((sum, it) => sum + it.price, 0);
      const items = cart.map(i => ` · ${i.title} ¥${i.price}`).join('\n');
      if (confirm(`你的购物袋：\n\n${items}\n\n合计：¥${total}\n\n（此为演示站，不会真正下单）\n\n点击确定清空，点击取消保留。`)) {
        localStorage.removeItem('nainian_cart');
        updateCart();
        showToast('已清空');
      }
    });

    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderProducts(btn.dataset.cat);
      });
    });

    renderProducts('all');
    updateCart();
  </script>
</body>
</html>
