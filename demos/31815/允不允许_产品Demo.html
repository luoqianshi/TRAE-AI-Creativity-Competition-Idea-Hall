<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>允不允许｜AI编程权限中文解释助手 Demo</title>
<style>
:root{--bg:#0f1720;--panel:#17222d;--panel2:#1d2b38;--line:#304152;--text:#eef5f8;--muted:#9fb0bc;--cyan:#55d6c2;--blue:#64a9ff;--green:#52d273;--yellow:#ffc857;--red:#ff6b6b;--paper:#f7fafb;--ink:#18232c}
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;background:linear-gradient(145deg,#0c131a,#111f29);color:var(--text);min-height:100vh}
button,select{font:inherit}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.sidebar{border-right:1px solid var(--line);background:rgba(12,19,26,.92);padding:22px 16px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:12px;align-items:center;font-weight:800;font-size:20px;margin:0 8px 24px}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,var(--cyan),var(--blue));display:grid;place-items:center;color:#071217;font-weight:900}.section-label{font-size:12px;color:#6f8798;padding:0 10px 9px;text-transform:uppercase;letter-spacing:1px}.scenario{width:100%;text-align:left;border:1px solid transparent;background:transparent;color:var(--muted);padding:12px;border-radius:13px;margin:4px 0;cursor:pointer;transition:.2s}.scenario:hover{background:#14232e;color:white}.scenario.active{background:#1e3340;border-color:#315467;color:white}.scenario strong{display:block;font-size:14px;margin-bottom:3px}.scenario span{font-size:12px}.main{padding:22px 28px 42px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:20px}.title{font-size:24px;font-weight:800}.level{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}.level select{background:var(--panel);border:1px solid var(--line);color:white;border-radius:10px;padding:8px 10px}.workspace{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(390px,.95fr);gap:18px}.window{border:1px solid var(--line);background:var(--panel);border-radius:18px;overflow:hidden;box-shadow:0 20px 55px rgba(0,0,0,.24)}.window-head{padding:12px 16px;background:#111c25;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.dots{display:flex;gap:7px}.dot{width:10px;height:10px;border-radius:50%;background:#536675}.window-title{font-size:13px;color:var(--muted)}.terminal{padding:22px;min-height:580px;font-family:Consolas,"Courier New",monospace;color:#d9e7ee;white-space:pre-wrap;line-height:1.65}.permission{margin-top:20px;border:1px solid #496071;border-radius:14px;background:#12202a;padding:16px;font-family:"Microsoft YaHei",sans-serif}.permission h3{font-size:16px;margin:0 0 8px}.permission p{color:#b8c8d1;margin:0 0 12px}.original-actions{display:flex;gap:9px;flex-wrap:wrap}.smallbtn{border:1px solid #415767;background:#20323f;color:white;padding:9px 13px;border-radius:10px;cursor:pointer}.smallbtn.primary{background:#256f87;border-color:#3d91aa}.smallbtn.danger{background:#5e2b32;border-color:#8d3d48}.explain{background:var(--paper);color:var(--ink);border-radius:18px;min-height:650px;overflow:hidden;box-shadow:0 20px 55px rgba(0,0,0,.22)}.explain-head{padding:17px 20px;border-bottom:1px solid #dfe7eb;display:flex;justify-content:space-between;align-items:center;background:white}.explain-head strong{font-size:18px}.risk{padding:6px 11px;border-radius:999px;font-weight:800;font-size:13px}.risk.low{background:#e4f8e9;color:#267640}.risk.medium{background:#fff2d0;color:#8b6300}.risk.high{background:#ffe2e2;color:#a1262f}.explain-body{padding:20px}.human{background:#e8f8f5;border-left:5px solid #35aa93;padding:16px 17px;border-radius:12px;font-size:18px;font-weight:800;margin-bottom:18px}.block{border:1px solid #dde6ea;border-radius:14px;margin-bottom:13px;overflow:hidden}.block-title{background:#f0f5f7;padding:10px 13px;font-weight:800}.block-content{padding:13px 14px;color:#42515b}.impact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.impact{padding:10px;border-radius:10px;background:#f4f7f8;font-size:13px}.impact.yes{border-left:4px solid #e0a01b}.impact.no{border-left:4px solid #55b878}.advice{padding:15px;border-radius:13px;font-weight:800;margin:12px 0}.advice.low{background:#e9f8ed;color:#286e40}.advice.medium{background:#fff5d9;color:#7b5a05}.advice.high{background:#ffe7e7;color:#912832}.actionbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.action{border:none;padding:11px 15px;border-radius:11px;cursor:pointer;font-weight:800}.action.allow{background:#2d9667;color:white}.action.inspect{background:#e8eef2;color:#28404f}.action.deny{background:#d9505d;color:white}.receipt{margin-top:18px;border-top:1px dashed #cbd8de;padding-top:16px;display:none}.receipt.show{display:block}.receipt-box{background:#eef6f8;border-radius:12px;padding:14px;color:#35505e}.compare{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.compare>div{border-radius:13px;padding:13px}.before{background:#fff0f0}.after{background:#ecf8ef}.toast{position:fixed;right:24px;bottom:22px;background:#0b1116;color:white;border:1px solid #334856;border-radius:13px;padding:13px 17px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:none}@media(max-width:980px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:none;border-bottom:1px solid var(--line)}.workspace{grid-template-columns:1fr}.scenario-list{display:grid;grid-template-columns:repeat(2,1fr)}.main{padding:18px}.terminal{min-height:420px}}@media(max-width:600px){.scenario-list{grid-template-columns:1fr}.impact-grid,.compare{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="logo">允</div><div>允不允许</div></div>
  <div class="section-label">权限与命令场景</div>
  <div class="scenario-list" id="scenarioList"></div>
</aside>
<main class="main">
  <div class="topbar"><div class="title">AI 编程安全字幕</div><div class="level">解释方式 <select id="level" onchange="render()"><option value="zero">零基础人话</option><option value="basic">基础技术版</option></select></div></div>
  <div class="workspace">
    <section class="window">
      <div class="window-head"><div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="window-title">Codex / Vibe Coding 权限请求</div></div>
      <div class="terminal"><div id="english"></div><div class="permission"><h3 id="requestTitle"></h3><p id="requestDesc"></p><div class="original-actions"><button class="smallbtn primary" onclick="showToast('原工具中的允许按钮，仅用于Demo')">Allow once</button><button class="smallbtn" onclick="showToast('原工具中的始终允许按钮，仅用于Demo')">Allow for session</button><button class="smallbtn danger" onclick="showToast('原工具中的拒绝按钮，仅用于Demo')">Deny</button></div></div></div>
    </section>
    <section class="explain">
      <div class="explain-head"><strong>中文解释卡</strong><span id="riskBadge" class="risk"></span></div>
      <div class="explain-body">
        <div class="human" id="human"></div>
        <div class="block"><div class="block-title">它准备做什么</div><div class="block-content" id="what"></div></div>
        <div class="block"><div class="block-title">会影响哪些内容</div><div class="block-content"><div class="impact-grid" id="impacts"></div></div></div>
        <div class="block"><div class="block-title">为什么需要你的允许</div><div class="block-content" id="why"></div></div>
        <div class="block"><div class="block-title">需要先确认什么</div><div class="block-content" id="checks"></div></div>
        <div id="advice" class="advice"></div>
        <div class="actionbar"><button class="action allow" onclick="executeAction('allow')">仅本次允许</button><button class="action inspect" onclick="executeAction('inspect')">先查看影响范围</button><button class="action deny" onclick="executeAction('deny')">拒绝</button></div>
        <div class="receipt" id="receipt"><div class="block-title">执行结果中文回执</div><div class="receipt-box" id="receiptBox"></div></div>
      </div>
    </section>
  </div>
</main>
</div>
<div class="toast" id="toast"></div>
<script>
const scenarios=[
{key:'network',name:'临时联网',sub:'读取公开专利网页',risk:'low',riskText:'较低风险',title:'Temporary network access',desc:'Do you want to allow temporary network access so I can fetch representative Google Patents pages?',english:`Do you want to allow temporary network access so I can fetch representative Google Patents pages?\n\n$urls = @('https://patents.google.com/patent/...');\nforeach ($u in $urls) {\n  Invoke-WebRequest -Uri $u\n}`,humanZero:'它想临时联网，打开你列出的公开专利网页。',humanBasic:'该命令将向指定 patents.google.com 地址发送 HTTP 请求并读取网页内容。',what:'访问列出的 Google Patents 网页，把网页内容下载到当前分析过程，用于核对专利信息。',impacts:[['联网','是：访问指定公开网站'],['读取本地文件','否'],['修改文件','否'],['删除文件','否'],['上传本地内容','当前命令未发现'],['系统设置','不会修改']],why:'当前 AI 运行环境默认不能自由联网，所以访问外部网站前需要你明确授权。',checks:'确认网址是你认识的公开网站；确认命令中没有把本地文件、账号或密钥一起上传。',advice:'建议仅本次允许。当前请求范围明确，未发现删除、提权或本地文件上传。',receipt:'已访问 4 个公开专利网页；没有修改或删除本地文件；网页内容已用于当前分析。'},
{key:'install',name:'安装依赖',sub:'pip 安装 Python 工具包',risk:'medium',riskText:'中等风险',title:'Run command with network access',desc:'Allow this command to download and install Python packages?',english:`python -m pip install pandas openpyxl\n\nThis command requires network access.`,humanZero:'它想联网下载两个让 Python 能处理数据和 Excel 的工具。',humanBasic:'pip 将从软件包源下载 pandas 和 openpyxl，并安装到当前 Python 环境。',what:'安装 pandas 和 openpyxl。前者常用于表格和数据处理，后者用于读取和生成 Excel 文件。',impacts:[['联网','是：下载软件包'],['读取项目文件','通常不需要'],['修改 Python 环境','是'],['修改业务文件','当前命令不会'],['安装第三方代码','是'],['删除文件','否']],why:'安装包需要从外部软件源下载文件，并改变当前 Python 环境，所以需要联网和执行权限。',checks:'确认当前使用的是项目虚拟环境；确认包名拼写正确；重要项目建议先保存 requirements 文件。',advice:'建议确认环境后仅本次允许。风险主要是依赖版本变化，不是删除业务文件。',receipt:'已安装 pandas 和 openpyxl；当前项目文件未被删除；Python 环境新增了相关依赖。'},
{key:'delete',name:'强制删除',sub:'删除 output 文件夹',risk:'high',riskText:'高风险',title:'Delete files outside normal edit flow',desc:'Allow this command to remove the output directory recursively?',english:`Remove-Item -Path ".\\output" -Recurse -Force`,humanZero:'它想把 output 文件夹和里面所有内容一起强制删除。',humanBasic:'PowerShell 将递归并强制删除当前目录下的 output 文件夹，可能绕过只读限制且不进入回收站。',what:'删除 output 文件夹、所有子文件夹及内部文件。通常用于清理旧输出，但如果其中包含唯一文件，删除后可能无法恢复。',impacts:[['读取文件','可能先检查路径'],['删除文件','是：整个 output 目录'],['强制操作','是：-Force'],['递归操作','是：-Recurse'],['进入回收站','通常不会'],['联网','否']],why:'删除属于不可逆或难恢复操作，且超出普通文本修改范围，所以工具需要明确询问。',checks:'先打开 output 文件夹确认里面是否都是可重新生成的临时文件；确认当前工作目录；重要内容先备份。',advice:'不建议直接允许。先查看影响范围，确认路径和文件内容后再决定。',receipt:'Demo未真正删除文件。真实环境中若允许，该目录及其内部文件会被移除。'},
{key:'secret',name:'读取密钥',sub:'查看 .env 配置文件',risk:'high',riskText:'高风险',title:'Read sensitive configuration file',desc:'Allow access to the .env file to inspect configuration values?',english:`Get-Content .env\n\nThe file may contain API keys or credentials.`,humanZero:'它想打开 .env 文件。这个文件经常放 API 密钥、密码或服务器地址。',humanBasic:'命令将读取项目根目录的 .env 配置内容，可能暴露环境变量、访问令牌和数据库凭据。',what:'读取 .env 文件中的配置值，通常用于排查程序为什么无法连接服务。',impacts:[['读取敏感文件','是'],['可能包含密钥','是'],['修改文件','否'],['上传内容','取决于后续模型处理'],['删除文件','否'],['联网','命令本身不联网']],why:'该文件可能包含高敏感信息，读取后内容可能进入 AI 的上下文，因此必须征得同意。',checks:'优先只读取需要的变量名，不显示完整密钥；确认数据处理方式；公司项目建议先脱敏。',advice:'建议拒绝直接读取完整文件。可以让 AI 只检查变量名称或使用脱敏后的内容。',receipt:'Demo未读取任何真实密钥。建议改为仅显示变量名，并将具体值替换为 ***。'},
{key:'git',name:'强制回退',sub:'Git 丢弃本地改动',risk:'high',riskText:'高风险',title:'Run destructive Git command',desc:'Allow git reset --hard to restore the repository state?',english:`git reset --hard HEAD~1`,humanZero:'它想把代码退回到上一个版本，并丢掉当前没有保存到 Git 的修改。',humanBasic:'该命令把当前分支强制重置到前一个提交，工作区和暂存区的未提交改动可能被永久覆盖。',what:'让代码仓库回到上一个提交版本，用旧版本覆盖当前工作区状态。',impacts:[['修改大量文件','是'],['丢弃未提交改动','是'],['改变 Git 历史位置','是'],['删除提交','当前分支指针回退'],['联网','否'],['容易恢复','取决于 reflog 和备份']],why:'该命令会大范围覆盖文件，并可能导致未提交工作丢失，因此需要高风险确认。',checks:'先运行 git status；保存或提交当前修改；确认要回退的提交；优先创建备份分支。',advice:'建议拒绝直接执行。先备份当前改动或创建新分支，再考虑更安全的回退方式。',receipt:'Demo未执行 Git 回退。真实执行前应先保存当前工作并核对提交记录。'}
];
let current=0;
function buildList(){const list=document.getElementById('scenarioList');list.innerHTML='';scenarios.forEach((s,i)=>{const b=document.createElement('button');b.className='scenario'+(i===current?' active':'');b.innerHTML=`<strong>${s.name}</strong><span>${s.sub}</span>`;b.onclick=()=>{current=i;buildList();render()};list.appendChild(b)})}
function render(){const s=scenarios[current],level=document.getElementById('level').value;document.getElementById('english').textContent=s.english;document.getElementById('requestTitle').textContent=s.title;document.getElementById('requestDesc').textContent=s.desc;document.getElementById('human').textContent=level==='zero'?s.humanZero:s.humanBasic;document.getElementById('what').textContent=s.what;const impacts=document.getElementById('impacts');impacts.innerHTML='';s.impacts.forEach(x=>{const d=document.createElement('div');d.className='impact '+((x[1].startsWith('否')||x[1].includes('不会'))?'no':'yes');d.innerHTML=`<strong>${x[0]}</strong><br>${x[1]}`;impacts.appendChild(d)});document.getElementById('why').textContent=s.why;document.getElementById('checks').textContent=s.checks;const rb=document.getElementById('riskBadge');rb.className='risk '+s.risk;rb.textContent=s.riskText;const a=document.getElementById('advice');a.className='advice '+s.risk;a.textContent=s.advice;document.getElementById('receipt').classList.remove('show')}
function executeAction(type){const s=scenarios[current];const box=document.getElementById('receiptBox');if(type==='allow')box.textContent=s.receipt;else if(type==='inspect')box.textContent='已打开影响范围预览：真实插件会列出目标路径、预计修改文件和可疑参数，再由用户返回原工具决定。';else box.textContent='已选择拒绝。原命令不会执行，你可以要求 AI 改用更安全或范围更小的操作。';document.getElementById('receipt').classList.add('show');showToast(type==='allow'?'已生成执行结果回执':type==='inspect'?'已进入影响范围检查':'已拒绝该请求')}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),2400)}
buildList();render();
</script>
</body>
</html>
