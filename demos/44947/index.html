<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReflectAI - AI 复盘教练</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0f1a;
      --bg-secondary: #111827;
      --bg-card: rgba(17, 24, 39, 0.8);
      --accent-primary: #22d3ee;
      --accent-secondary: #a78bfa;
      --accent-tertiary: #fb7185;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-subtle: rgba(148, 163, 184, 0.1);
      --glow-cyan: 0 0 40px rgba(34, 211, 238, 0.15);
      --glow-purple: 0 0 40px rgba(167, 139, 250, 0.15);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .bg-gradient {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(ellipse 80% 50% at 20% 40%, rgba(34, 211, 238, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 80% 60%, rgba(167, 139, 250, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse 40% 30% at 50% 80%, rgba(251, 113, 133, 0.04) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .noise-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.03;
      pointer-events: none;
      z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
      animation: fadeInDown 0.8s ease-out;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      font-weight: 500;
      background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .tagline {
      font-size: 0.95rem;
      color: var(--text-secondary);
      font-weight: 300;
      letter-spacing: 0.1em;
    }

    .main-layout {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 32px;
      margin-bottom: 48px;
    }

    @media (max-width: 900px) {
      .main-layout {
        grid-template-columns: 1fr;
      }
    }

    .input-section {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 32px;
      backdrop-filter: blur(12px);
      animation: fadeInLeft 0.8s ease-out 0.2s both;
    }

    @keyframes fadeInLeft {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .input-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: block;
      letter-spacing: 0.05em;
    }

    .input-box {
      width: 100%;
      height: 180px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 16px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.7;
      resize: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .input-box::placeholder {
      color: var(--text-muted);
    }

    .input-box:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: var(--glow-cyan);
    }

    .submit-btn {
      width: 100%;
      margin-top: 16px;
      padding: 14px 24px;
      background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
      border: none;
      border-radius: 10px;
      color: #0a0f1a;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.3s;
      position: relative;
      overflow: hidden;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(34, 211, 238, 0.3);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }

    .submit-btn:hover::after {
      left: 100%;
    }

    .output-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: fadeInRight 0.8s ease-out 0.4s both;
    }

    @keyframes fadeInRight {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .reflection-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(12px);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s ease-out, transform 0.5s ease-out, box-shadow 0.3s;
    }

    .reflection-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .reflection-card:nth-child(1) { transition-delay: 0.1s; }
    .reflection-card:nth-child(2) { transition-delay: 0.2s; }
    .reflection-card:nth-child(3) { transition-delay: 0.3s; }

    .reflection-card:hover {
      box-shadow: var(--glow-cyan);
    }

    .reflection-card:nth-child(2):hover {
      box-shadow: var(--glow-purple);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .card-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .card-icon.completed {
      background: rgba(34, 211, 238, 0.15);
    }

    .card-icon.stuck {
      background: rgba(167, 139, 250, 0.15);
    }

    .card-icon.action {
      background: rgba(251, 113, 133, 0.15);
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 500;
    }

    .card-content {
      color: var(--text-secondary);
      font-size: 0.9rem;
      line-height: 1.8;
    }

    .card-content li {
      margin-bottom: 8px;
      padding-left: 16px;
      position: relative;
    }

    .card-content li::before {
      content: '•';
      position: absolute;
      left: 0;
      color: var(--accent-primary);
    }

    .stuck .card-content li::before {
      color: var(--accent-secondary);
    }

    .action .card-content li::before {
      color: var(--accent-tertiary);
    }

    .growth-section {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 32px;
      backdrop-filter: blur(12px);
      animation: fadeInUp 0.8s ease-out 0.6s both;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .growth-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .growth-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 500;
    }

    .growth-badge {
      background: rgba(34, 211, 238, 0.1);
      border: 1px solid rgba(34, 211, 238, 0.2);
      color: var(--accent-primary);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
    }

    .chart-container {
      position: relative;
      height: 200px;
    }

    .chart-canvas {
      width: 100%;
      height: 100%;
    }

    .chart-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      padding: 0 20px;
    }

    .chart-label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .placeholder-message {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      text-align: center;
      gap: 12px;
    }

    .placeholder-icon {
      font-size: 2.5rem;
      opacity: 0.5;
    }

    .placeholder-text {
      font-size: 0.9rem;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .typing-indicator {
      display: flex;
      gap: 6px;
      justify-content: center;
      padding: 20px;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-primary);
      border-radius: 50%;
      animation: pulse 1.4s infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    ::selection {
      background: rgba(34, 211, 238, 0.3);
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--text-muted);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="noise-overlay"></div>

  <div class="container">
    <header>
      <h1 class="logo">ReflectAI</h1>
      <p class="tagline">你的 AI 复盘教练</p>
    </header>

    <div class="main-layout">
      <div class="input-section">
        <label class="input-label">输入你的工作内容</label>
        <textarea class="input-box" id="inputBox" placeholder="用口语化的方式描述一下：&#10;&#10;今天/本周做了什么？&#10;遇到了什么问题？&#10;有什么新的想法？&#10;&#10;例如：完成了用户调研报告，但数据分析和产品方案还没定，团队对方向有分歧。下周要开评审会..."></textarea>
        <button class="submit-btn" id="submitBtn">开始复盘分析</button>
      </div>

      <div class="output-section" id="outputSection">
        <div class="placeholder-message" id="placeholder">
          <span class="placeholder-icon">✨</span>
          <span class="placeholder-text">输入内容后点击按钮<br>AI 将为你生成结构化复盘</span>
        </div>

        <div class="reflection-card completed" id="completedCard">
          <div class="card-header">
            <div class="card-icon completed">✓</div>
            <h3 class="card-title">完成了什么</h3>
          </div>
          <div class="card-content" id="completedContent"></div>
        </div>

        <div class="reflection-card stuck" id="stuckCard">
          <div class="card-header">
            <div class="card-icon stuck">◐</div>
            <h3 class="card-title">卡在哪里</h3>
          </div>
          <div class="card-content" id="stuckContent"></div>
        </div>

        <div class="reflection-card action" id="actionCard">
          <div class="card-header">
            <div class="card-icon action">→</div>
            <h3 class="card-title">下一步行动</h3>
          </div>
          <div class="card-content" id="actionContent"></div>
        </div>
      </div>
    </div>

    <div class="growth-section">
      <div class="growth-header">
        <h3 class="growth-title">成长曲线</h3>
        <span class="growth-badge">近 8 周趋势</span>
      </div>
      <div class="chart-container">
        <canvas id="growthChart" class="chart-canvas"></canvas>
      </div>
      <div class="chart-labels">
        <span class="chart-label">第1周</span>
        <span class="chart-label">第2周</span>
        <span class="chart-label">第3周</span>
        <span class="chart-label">第4周</span>
        <span class="chart-label">第5周</span>
        <span class="chart-label">第6周</span>
        <span class="chart-label">第7周</span>
        <span class="chart-label">第8周</span>
      </div>
    </div>
  </div>

  <script>
    const mockReflections = {
      completed: [
        '完成用户调研报告初稿，收集到 120 份有效问卷',
        '产品原型 v2.0 设计迭代，增加了 3 个新功能模块',
        '技术方案评审会议，确定了后端架构选型',
        '完成 2 场客户访谈，深入了解需求痛点',
        '代码重构优化，系统性能提升 40%'
      ],
      stuck: [
        '数据分析结果与预期差异大，需要重新梳理指标',
        '团队对产品方向存在分歧，尚未达成共识',
        '第三方 API 对接遇到技术壁垒，进度延迟',
        '资源协调困难，设计和开发排期有冲突',
        '测试环境不稳定，影响调试效率'
      ],
      action: [
        '安排与产品负责人一对一面谈，明确优先级',
        '整理数据异常问题，联系数据团队协助排查',
        '组织跨部门对齐会议，同步各方需求',
        '查阅第三方文档，寻求技术支持渠道',
        '制定详细排期表，识别关键路径风险'
      ]
    };

    function getRandomItems(arr, count) {
      const shuffled = [...arr].sort(() => 0.5 - Math.random());
      return shuffled.slice(0, count);
    }

    function renderListItems(items) {
      return items.map(item => `<li>${item}</li>`).join('');
    }

    function showLoading() {
      document.getElementById('placeholder').innerHTML = `
        <div class="typing-indicator">
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
        </div>
        <span class="placeholder-text">AI 正在分析...</span>
      `;
    }

    function showReflection() {
      const completedItems = getRandomItems(mockReflections.completed, 3);
      const stuckItems = getRandomItems(mockReflections.stuck, 3);
      const actionItems = getRandomItems(mockReflections.action, 3);

      document.getElementById('completedContent').innerHTML = `<ul>${renderListItems(completedItems)}</ul>`;
      document.getElementById('stuckContent').innerHTML = `<ul>${renderListItems(stuckItems)}</ul>`;
      document.getElementById('actionContent').innerHTML = `<ul>${renderListItems(actionItems)}</ul>`;

      const cards = document.querySelectorAll('.reflection-card');
      cards.forEach(card => card.classList.remove('visible'));

      setTimeout(() => {
        document.getElementById('placeholder').style.display = 'none';
        cards.forEach(card => card.classList.add('visible'));
      }, 800);
    }

    document.getElementById('submitBtn').addEventListener('click', function() {
      const input = document.getElementById('inputBox').value.trim();
      if (!input) {
        document.getElementById('inputBox').focus();
        return;
      }
      
      showLoading();
      
      setTimeout(() => {
        showReflection();
      }, 1500);
    });

    function drawGrowthChart() {
      const canvas = document.getElementById('growthChart');
      const ctx = canvas.getContext('2d');
      
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      
      const width = rect.width;
      const height = rect.height;
      const padding = { top: 20, right: 20, bottom: 20, left: 20 };
      const chartWidth = width - padding.left - padding.right;
      const chartHeight = height - padding.top - padding.bottom;

      ctx.clearRect(0, 0, width, height);

      const mockData = [62, 68, 65, 72, 78, 75, 85, 88];
      const maxValue = 100;
      const minValue = 50;
      const range = maxValue - minValue;

      const stepX = chartWidth / (mockData.length - 1);

      // Draw grid lines
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.1)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = padding.top + (chartHeight / 4) * i;
        ctx.beginPath();
        ctx.moveTo(padding.left, y);
        ctx.lineTo(width - padding.right, y);
        ctx.stroke();
      }

      // Draw gradient fill
      const gradient = ctx.createLinearGradient(0, padding.top, 0, height - padding.bottom);
      gradient.addColorStop(0, 'rgba(34, 211, 238, 0.25)');
      gradient.addColorStop(1, 'rgba(34, 211, 238, 0)');

      ctx.beginPath();
      mockData.forEach((value, index) => {
        const x = padding.left + index * stepX;
        const y = padding.top + chartHeight - ((value - minValue) / range) * chartHeight;
        if (index === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      });
      
      ctx.lineTo(padding.left + (mockData.length - 1) * stepX, height - padding.bottom);
      ctx.lineTo(padding.left, height - padding.bottom);
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.fill();

      // Draw line
      ctx.beginPath();
      mockData.forEach((value, index) => {
        const x = padding.left + index * stepX;
        const y = padding.top + chartHeight - ((value - minValue) / range) * chartHeight;
        if (index === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      });
      ctx.strokeStyle = '#22d3ee';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();

      // Draw points
      mockData.forEach((value, index) => {
        const x = padding.left + index * stepX;
        const y = padding.top + chartHeight - ((value - minValue) / range) * chartHeight;
        
        // Outer glow
        ctx.beginPath();
        ctx.arc(x, y, 12, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(34, 211, 238, 0.2)';
        ctx.fill();

        // Inner point
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#22d3ee';
        ctx.fill();

        // Center dot
        ctx.beginPath();
        ctx.arc(x, y, 2, 0, Math.PI * 2);
        ctx.fillStyle = '#0a0f1a';
        ctx.fill();
      });
    }

    window.addEventListener('resize', drawGrowthChart);
    window.addEventListener('load', () => {
      setTimeout(drawGrowthChart, 100);
    });
  </script>
</body>
</html>
