      scenes: document.querySelectorAll('.scene-chip'), timeSlider: document.getElementById('time-slider'),
      timeDisplay: document.getElementById('time-display'), taskList: document.getElementById('task-list'),
      btnStart: document.getElementById('btn-start'), focusPage: document.getElementById('focus-page'),
      focusSceneLabel: document.getElementById('focus-scene-label'), focusTaskName: document.getElementById('focus-task-name'),
      timerCountdown: document.getElementById('timer-countdown'), progressCircle: document.getElementById('progress-circle'),
      btnPause: document.getElementById('btn-pause'), btnStop: document.getElementById('btn-stop'),
      completionModal: document.getElementById('completion-modal'), completeTime: document.getElementById('complete-time'),
      completeCapsules: document.getElementById('complete-capsules'), btnDone: document.getElementById('btn-done'),
      weeklyChart: document.getElementById('weekly-chart'), historyList: document.getElementById('history-list'),
      toggles: document.querySelectorAll('.toggle'),
    };
    function init() { renderTasks(); renderWeeklyChart(); renderHistory(); bindEvents(); }
    function bindEvents() {
      els.tabs.forEach(tab => tab.addEventListener('click', () => {
        els.tabs.forEach(t => t.classList.remove('active')); els.sections.forEach(s => s.classList.remove('active'));
        tab.classList.add('active'); document.getElementById('section-' + tab.dataset.tab).classList.add('active');
      }));
      els.scenes.forEach(chip => chip.addEventListener('click', () => {
        els.scenes.forEach(c => c.classList.remove('active')); chip.classList.add('active');
        state.scene = chip.dataset.scene; state.time = parseInt(chip.dataset.time);
        els.timeSlider.value = state.time; els.timeDisplay.textContent = state.time;
        state.selectedTask = null; renderTasks();
      }));
      els.timeSlider.addEventListener('input', e => { state.time = parseInt(e.target.value); els.timeDisplay.textContent = state.time; renderTasks(); });
      els.btnStart.addEventListener('click', startFocus);
      els.btnPause.addEventListener('click', () => state.timerPaused ? resumeTimer() : pauseTimer());
      els.btnStop.addEventListener('click', stopTimer);
      els.btnDone.addEventListener('click', () => { els.completionModal.classList.remove('active'); els.focusPage.classList.remove('active'); state.timerRunning = false; state.timerPaused = false; });
      els.toggles.forEach(t => t.addEventListener('click', () => t.classList.toggle('active')));
    }
    function renderTasks() {
      const tasks = taskDB[state.scene] || [];
      const filtered = tasks.filter(t => t.duration <= state.time);
      els.taskList.innerHTML = '';
      if (filtered.length === 0) { els.taskList.innerHTML = '<div style="color: var(--muted); text-align: center; padding: 1rem;">该时长下暂无推荐任务，试试调整时间吧</div>'; els.btnStart.disabled = true; return; }
      els.btnStart.disabled = false;
      filtered.forEach(task => {
        const div = document.createElement('div');
        div.className = 'task-item' + (state.selectedTask === task.id ? ' selected' : '');
        div.innerHTML = `<div class="task-checkbox"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div><div class="task-info"><div class="task-title">${task.title}</div><div class="task-meta">预计 ${task.duration} 分钟</div></div><div class="task-tag">${task.tag}</div>`;
        div.addEventListener('click', () => { state.selectedTask = task.id; renderTasks(); });
        els.taskList.appendChild(div);
      });
      if (!state.selectedTask && filtered.length > 0) { state.selectedTask = filtered[0].id; renderTasks(); }
    }
    function startFocus() {
      if (!state.selectedTask) return;
      const task = taskDB[state.scene].find(t => t.id === state.selectedTask);
      if (!task) return;
      state.remaining = task.duration * 60; state.timerRunning = true; state.timerPaused = false;
      els.focusSceneLabel.textContent = sceneNames[state.scene]; els.focusTaskName.textContent = task.title;
      els.focusPage.classList.add('active'); els.btnPause.textContent = '暂停';
      updateTimerDisplay(); state.timerInterval = setInterval(tick, 1000);
    }
    function tick() { if (state.timerPaused) return; state.remaining--; updateTimerDisplay(); if (state.remaining <= 0) completeFocus(); }
    function updateTimerDisplay() {
      const m = Math.floor(state.remaining / 60), s = state.remaining % 60;
      els.timerCountdown.textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
      const task = taskDB[state.scene].find(t => t.id === state.selectedTask);
      const total = task ? task.duration * 60 : state.time * 60;
      const pct = state.remaining / total;
      const circumference = 2 * Math.PI * 120;
      els.progressCircle.style.strokeDashoffset = circumference * (1 - pct);
    }
    function pauseTimer() { state.timerPaused = true; els.btnPause.textContent = '继续'; }
    function resumeTimer() { state.timerPaused = false; els.btnPause.textContent = '暂停'; }
    function stopTimer() { clearInterval(state.timerInterval); state.timerRunning = false; state.timerPaused = false; els.focusPage.classList.remove('active'); }
    function completeFocus() {
      clearInterval(state.timerInterval); state.timerRunning = false; state.timerPaused = false;
      const task = taskDB[state.scene].find(t => t.id === state.selectedTask);
      const minutes = task ? task.duration : state.time;
      state.stats.total++; state.stats.time += minutes; state.stats.weekly[6]++;
      const now = new Date(); const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
      state.history.unshift({ title: task.title, scene: state.scene, time: minutes, date: `今天 ${timeStr}` });
      els.completeTime.textContent = minutes; els.completeCapsules.textContent = state.stats.total;
      els.completionModal.classList.add('active');
      document.getElementById('stat-total').textContent = state.stats.total;
      document.getElementById('stat-time').textContent = state.stats.time;
      renderWeeklyChart(); renderHistory();
    }
    function renderWeeklyChart() {
      const days = ['周一','周二','周三','周四','周五','周六','周日']; const maxVal = Math.max(...state.stats.weekly, 1);
      els.weeklyChart.innerHTML = '';
      state.stats.weekly.forEach((val, i) => {
        const bar = document.createElement('div'); bar.className = 'bar-item';
        bar.innerHTML = `<div class="bar" style="height: ${(val / maxVal * 100)}%"></div><div class="bar-label">${days[i]}</div>`;
        els.weeklyChart.appendChild(bar);
      });
    }
    function renderHistory() {
      els.historyList.innerHTML = '';
      state.history.slice(0, 6).forEach(h => {
        const div = document.createElement('div'); div.className = 'history-item';
        div.innerHTML = `<div class="history-icon">💊</div><div class="history-info"><div class="history-title">${h.title}</div><div class="history-meta">${sceneNames[h.scene]} · ${h.date}</div></div><div class="history-time">${h.time}min</div>`;
        els.historyList.appendChild(div);
      });
    }
    init();
  </script>
</body>
</html>
