<!-- 全屏视频逻辑 -->
<script>
    var video = document.getElementById('fullscreen-video');
    var videoContainer = document.getElementById('video-container');

    function showFullscreenVideo() {
        var overlay = document.querySelector('.overlayTime');
        overlay.style.display = 'none';
        // 显示视频容器和视频画面（CSS 中两者默认 display:none）
        if (videoContainer) { videoContainer.style.display = 'block'; }
        video.style.display = 'block';
        video.play();
        // 视频元素本身进入全屏，确保画面正常显示
        if (video.requestFullscreen) {
            video.requestFullscreen();
        } else if (video.webkitRequestFullscreen) {
            video.webkitRequestFullscreen();
        }
        showMagicToast('魔法已开启，尽情享受音乐吧~');
    }
    function enterFullscreen() {
        if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
        else if (document.documentElement.mozRequestFullScreen) { document.documentElement.mozRequestFullScreen(); }
        else if (document.documentElement.webkitRequestFullscreen) { document.documentElement.webkitRequestFullscreen(); }
        else if (document.documentElement.msRequestFullscreen) { document.documentElement.msRequestFullscreen(); }
        video.addEventListener('ended', exitFullscreen);
    }
    function exitFullscreen() {
        if (document.exitFullscreen) { document.exitFullscreen(); }
        else if (document.mozCancelFullScreen) { document.mozCancelFullScreen(); }
        else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
        else if (document.msExitFullscreen) { document.msExitFullscreen(); }
        video.removeEventListener('ended', exitFullscreen);
        // 暂停视频播放，确保退出全屏时声音停止
        video.pause();
        // 隐藏视频容器和视频画面
        video.style.display = 'none';
        if (videoContainer) { videoContainer.style.display = 'none'; }
    }
    // 监听全屏变化事件：按 ESC 退出全屏时自动暂停视频并隐藏
    document.addEventListener('fullscreenchange', function () {
        if (!document.fullscreenElement) {
            video.pause();
            video.style.display = 'none';
            if (videoContainer) { videoContainer.style.display = 'none'; }
        }
    });
    document.addEventListener('webkitfullscreenchange', function () {
        if (!document.webkitFullscreenElement) {
            video.pause();
            video.style.display = 'none';
            if (videoContainer) { videoContainer.style.display = 'none'; }
        }
    });
    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') { exitFullscreen(); }
    });
</script>

<!-- 播放器展开/收起 + 进度条 -->
<script>
    /* 播放器展开/收起 — 改为展开/收起左侧歌曲列表 */
    function expandPlayer() {
        var playlistList = document.getElementById('playlistList');
        if (playlistList) {
            playlistList.classList.remove('collapsed');
        }
        var toggle = document.getElementById('playlistToggle');
        if (toggle) {
            toggle.classList.remove('collapsed');
        }
    }
    function collapsePlayer() {
        var playlistList = document.getElementById('playlistList');
        if (playlistList) {
            playlistList.classList.add('collapsed');
        }
        var toggle = document.getElementById('playlistToggle');
        if (toggle) {
            toggle.classList.add('collapsed');
        }
    }

    /* 进度条点击跳转 */
    function seekAudio(event) {
        var rect = event.currentTarget.getBoundingClientRect();
        var ratio = (event.clientX - rect.left) / rect.width;
        if (audioPlayer.duration) {
            audioPlayer.currentTime = ratio * audioPlayer.duration;
        }
    }

    /* 进度条实时更新 */
    var audioPlayer = document.getElementById('audioPlayer');
    audioPlayer.addEventListener('timeupdate', function() {
        if (!audioPlayer.duration) return;
        var pct = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        var miniFill = document.getElementById('miniProgressFill');
        var miniHandle = document.getElementById('miniProgressHandle');
        var fullFill = document.getElementById('fullProgressFill');
        var fullHandle = document.getElementById('fullProgressHandle');
        if (miniFill) miniFill.style.width = pct + '%';
        if (miniHandle) miniHandle.style.left = pct + '%';
        if (fullFill) fullFill.style.width = pct + '%';
        if (fullHandle) fullHandle.style.left = pct + '%';
    });
</script>
