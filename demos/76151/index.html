<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天说什么 · 灵感大转盘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700;900&family=Monoton&display=swap" rel="stylesheet">
<style>
  :root{
    --font-display:'ZCOOL KuaiLe','PingFang SC','Microsoft YaHei','Heiti SC',sans-serif;
    --font-body:'Noto Sans SC','PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;
    --font-mono:'Monoton','Impact','Arial Black',sans-serif;
    --bg:#1a0b2e;
    --bg2:#2d1b4e;
    --pink:#ff2e9a;
    --cyan:#00f0ff;
    --yellow:#ffd93d;
    --purple:#a855f7;
    --green:#4ade80;
    --orange:#ff6b35;
    --text:#fff5fb;
    --muted:#b9a7d8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font-body);
    background:radial-gradient(ellipse at 20% 10%,#3d1b6e 0%,transparent 50%),
               radial-gradient(ellipse at 80% 90%,#5b1d5e 0%,transparent 50%),
               var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  /* 星空背景 */
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none}
  .star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s infinite ease-in-out}
  @keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.3)}}

  /* 飘浮装饰 */
  .float-deco{position:fixed;font-size:24px;opacity:.25;z-index:1;pointer-events:none;animation:floaty 8s infinite ease-in-out}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-30px) rotate(15deg)}}

  .wrap{
    position:relative;z-index:2;
    max-width:1100px;margin:0 auto;
    padding:32px 24px 60px;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
  }

  /* 顶栏 */
  .topbar{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-family:var(--font-mono);font-size:18px;color:var(--cyan);letter-spacing:2px;text-shadow:0 0 12px var(--cyan)}
  .history-btn{
    display:flex;align-items:center;gap:6px;
    background:rgba(255,46,154,.12);
    border:1px solid rgba(255,46,154,.4);
    color:var(--pink);padding:8px 16px;border-radius:30px;
    font-size:13px;font-weight:700;cursor:pointer;
    transition:all .25s;backdrop-filter:blur(6px);
  }
  .history-btn:hover{background:rgba(255,46,154,.25);transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,46,154,.4)}

  /* 标题区 */
  .title-area{text-align:center;margin:20px 0 12px;position:relative}
  .title{
    font-family:var(--font-display);
    font-weight:900;
    font-size:clamp(42px,7vw,72px);
    background:linear-gradient(135deg,var(--yellow) 0%,var(--pink) 50%,var(--cyan) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    letter-spacing:4px;line-height:1.1;
    filter:drop-shadow(0 0 20px rgba(255,46,154,.5));
    animation:titlePulse 4s ease-in-out infinite;
  }
  @keyframes titlePulse{0%,100%{filter:drop-shadow(0 0 20px rgba(255,46,154,.5))}50%{filter:drop-shadow(0 0 35px rgba(0,240,255,.7))}}
  .subtitle{margin-top:10px;color:var(--muted);font-size:15px;letter-spacing:6px;font-weight:300}
  .subtitle span{color:var(--yellow)}
  .deco-stars{margin-top:8px;font-size:14px;letter-spacing:8px;color:var(--yellow);animation:twinkle 2s infinite}

  /* 风格切换 */
  .style-tabs{display:flex;gap:10px;margin:24px 0 8px;flex-wrap:wrap;justify-content:center}
  .tab{
    padding:8px 20px;border-radius:30px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font-body);
    border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);
    color:var(--muted);transition:all .3s;letter-spacing:1px;
  }
  .tab:hover{color:#fff;border-color:rgba(255,255,255,.4)}
  .tab.active{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(255,46,154,.5)}

  /* 转盘 */
  .wheel-area{
    position:relative;margin:30px 0;
    width:min(500px,92vw);height:min(500px,92vw);
    display:flex;align-items:center;justify-content:center;
  }
  /* 外圈灯泡 */
  .bulbs{position:absolute;inset:-18px;border-radius:50%;pointer-events:none}
  .bulb{
    position:absolute;width:10px;height:10px;border-radius:50%;
    background:var(--yellow);box-shadow:0 0 10px var(--yellow),0 0 20px var(--yellow);
    top:50%;left:50%;transform-origin:0 0;
    animation:bulbBlink 1s infinite;
  }
  @keyframes bulbBlink{0%,100%{opacity:1}50%{opacity:.3}}

  /* 转盘本体 */
  .wheel{
    position:relative;width:100%;height:100%;border-radius:50%;
    transition:transform 4s cubic-bezier(0.17,0.67,0.12,0.99);
    box-shadow:0 0 0 8px #2d1b4e,0 0 0 10px var(--yellow),
               0 0 60px rgba(255,46,154,.6),inset 0 0 40px rgba(0,0,0,.4);
  }
  .wheel.spinning{cursor:not-allowed}

  /* 扇形文字 */
  .slice{
    position:absolute;top:0;left:50%;width:1px;height:50%;
    transform-origin:bottom center;
    display:flex;justify-content:center;
    pointer-events:none;
  }
  .slice-text{
    margin-top:18px;
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(11px,1.8vw,15px);
    color:#fff;text-align:center;
    white-space:nowrap;
    text-shadow:0 1px 3px rgba(0,0,0,.8),0 0 8px rgba(0,0,0,.5);
    transform:translateX(-50%);
    writing-mode:vertical-rl;
    letter-spacing:1px;
    max-height:42%;overflow:hidden;
  }

  /* 中心 */
  .hub{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:70px;height:70px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#fff,#ffd93d 40%,#ff6b35 100%);
    box-shadow:0 0 20px var(--yellow),inset -4px -4px 8px rgba(0,0,0,.3);
    z-index:5;display:flex;align-items:center;justify-content:center;
    font-size:28px;
  }

  /* 指针 */
  .pointer{
    position:absolute;top:-22px;left:50%;transform:translateX(-50%);
    width:0;height:0;
    border-left:18px solid transparent;
    border-right:18px solid transparent;
    border-top:36px solid var(--yellow);
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));
    z-index:10;
    animation:pointerBounce .6s infinite alternate;
  }
  @keyframes pointerBounce{from{transform:translateX(-50%) rotate(-3deg)}to{transform:translateX(-50%) rotate(3deg)}}

  /* 按钮 */
  .controls{display:flex;gap:16px;margin-top:30px;flex-wrap:wrap;justify-content:center}
  .btn{
    font-family:var(--font-display);
    font-weight:900;
    font-size:22px;letter-spacing:3px;
    padding:16px 48px;border:none;border-radius:50px;cursor:pointer;
    position:relative;transition:all .2s;color:#fff;
  }
  .btn-primary{
    background:linear-gradient(135deg,var(--pink) 0%,var(--orange) 100%);
    box-shadow:0 6px 0 #b3186e,0 10px 30px rgba(255,46,154,.5),inset 0 2px 4px rgba(255,255,255,.4);
  }
  .btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 0 #b3186e,0 14px 36px rgba(255,46,154,.7),inset 0 2px 4px rgba(255,255,255,.4)}
  .btn-primary:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #b3186e,0 4px 12px rgba(255,46,154,.4),inset 0 2px 4px rgba(255,255,255,.4)}
  .btn-primary:disabled{opacity:.6;cursor:not-allowed}
  .btn-secondary{
    background:linear-gradient(135deg,var(--cyan) 0%,#0099cc 100%);
    box-shadow:0 6px 0 #006699,0 10px 30px rgba(0,240,255,.4),inset 0 2px 4px rgba(255,255,255,.4);
    font-size:18px;padding:14px 32px;
  }
  .btn-secondary:hover{transform:translateY(-2px);box-shadow:0 8px 0 #006699,0 14px 36px rgba(0,240,255,.6),inset 0 2px 4px rgba(255,255,255,.4)}
  .btn-secondary:active{transform:translateY(4px);box-shadow:0 2px 0 #006699}

  /* 提示文字 */
  .hint{margin-top:24px;color:var(--muted);font-size:13px;text-align:center;letter-spacing:1px}
  .hint b{color:var(--yellow)}

  /* 结果弹窗 */
  .modal-mask{
    position:fixed;inset:0;background:rgba(10,2,24,.8);
    backdrop-filter:blur(8px);z-index:100;
    display:none;align-items:center;justify-content:center;
    opacity:0;transition:opacity .4s;
  }
  .modal-mask.show{display:flex;opacity:1}
  .modal{
    background:linear-gradient(160deg,#2d1b4e,#1a0b2e);
    border:2px solid transparent;
    background-clip:padding-box;
    border-radius:24px;padding:40px 36px;
    max-width:90vw;width:480px;text-align:center;
    position:relative;
    transform:scale(.7);transition:transform .4s cubic-bezier(.34,1.56,.64,1);
    box-shadow:0 0 60px rgba(255,46,154,.4);
  }
  .modal-mask.show .modal{transform:scale(1)}
  .modal::before{
    content:'';position:absolute;inset:-2px;border-radius:24px;z-index:-1;
    background:linear-gradient(135deg,var(--pink),var(--yellow),var(--cyan),var(--green));
    background-size:300% 300%;animation:borderFlow 4s linear infinite;
  }
  @keyframes borderFlow{0%{background-position:0% 50%}100%{background-position:300% 50%}}
  .modal-emoji{font-size:56px;margin-bottom:8px;animation:emojiPop .6s ease}
  @keyframes emojiPop{0%{transform:scale(0) rotate(-180deg)}60%{transform:scale(1.3) rotate(20deg)}100%{transform:scale(1) rotate(0)}}
  .modal-label{font-family:var(--font-mono);color:var(--cyan);font-size:14px;letter-spacing:4px;margin-bottom:16px;text-shadow:0 0 10px var(--cyan)}
  .modal-text{
    font-family:var(--font-display);
    font-weight:900;
    font-size:26px;line-height:1.6;color:#fff;
    padding:24px 16px;margin:0 0 28px;
    background:rgba(255,255,255,.04);border-radius:16px;
    border:1px dashed rgba(255,217,61,.3);
    word-break:break-word;
  }
  .modal-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .modal-btn{
    padding:12px 28px;border-radius:30px;border:none;cursor:pointer;
    font-family:var(--font-body);font-weight:700;font-size:14px;
    transition:all .25s;letter-spacing:1px;
  }
  .modal-copy{background:linear-gradient(135deg,var(--yellow),var(--orange));color:#1a0b2e;box-shadow:0 4px 14px rgba(255,217,61,.4)}
  .modal-copy:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,217,61,.6)}
  .modal-again{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.2)}
  .modal-again:hover{background:rgba(255,255,255,.15)}
  .modal-close{
    position:absolute;top:14px;right:18px;
    background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;
    width:32px;height:32px;border-radius:50%;transition:all .2s;
    display:flex;align-items:center;justify-content:center;
  }
  .modal-close:hover{background:rgba(255,255,255,.1);color:#fff;transform:rotate(90deg)}

  /* 历史抽屉 */
  .drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;opacity:0;visibility:hidden;transition:all .3s}
  .drawer-mask.show{opacity:1;visibility:visible}
  .drawer{
    position:fixed;top:0;right:0;height:100%;width:340px;max-width:85vw;
    background:linear-gradient(180deg,#2d1b4e,#1a0b2e);
    z-index:91;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);
    box-shadow:-10px 0 40px rgba(0,0,0,.5);
    display:flex;flex-direction:column;
  }
  .drawer.show{transform:translateX(0)}
  .drawer-head{padding:24px 22px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:center}
  .drawer-title{font-family:var(--font-display);font-weight:900;font-size:22px;color:var(--yellow);letter-spacing:2px}
  .drawer-close{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;transition:all .2s}
  .drawer-close:hover{color:#fff;transform:rotate(90deg)}
  .drawer-body{flex:1;overflow-y:auto;padding:16px 22px}
  .drawer-empty{text-align:center;color:var(--muted);margin-top:60px;font-size:14px}
  .drawer-empty .big{font-size:48px;margin-bottom:12px;opacity:.4}
  .hist-item{
    padding:14px 16px;margin-bottom:10px;border-radius:12px;
    background:rgba(255,255,255,.04);border-left:3px solid var(--pink);
    transition:all .2s;cursor:pointer;
  }
  .hist-item:hover{background:rgba(255,46,154,.1);transform:translateX(-4px)}
  .hist-text{font-size:14px;line-height:1.5;color:#fff;margin-bottom:6px;word-break:break-word}
  .hist-meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
  .hist-tag{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700}
  .tag-daily{background:rgba(0,240,255,.15);color:var(--cyan)}
  .tag-literary{background:rgba(168,85,247,.15);color:var(--purple)}
  .tag-funny{background:rgba(255,217,61,.15);color:var(--yellow)}
  .drawer-foot{padding:16px 22px;border-top:1px solid rgba(255,255,255,.08)}
  .clear-btn{width:100%;padding:10px;background:rgba(255,46,154,.1);border:1px solid rgba(255,46,154,.3);color:var(--pink);border-radius:10px;cursor:pointer;font-size:13px;font-weight:700;transition:all .2s}
  .clear-btn:hover{background:rgba(255,46,154,.2)}

  /* 彩纸画布 */
  #confetti{position:fixed;inset:0;z-index:99;pointer-events:none}

  /* Toast */
  .toast{
    position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);
    background:rgba(74,222,128,.95);color:#0a1a0a;padding:12px 28px;
    border-radius:30px;font-weight:700;font-size:14px;z-index:200;
    transition:transform .35s cubic-bezier(.34,1.56,.64,1);
    box-shadow:0 8px 24px rgba(74,222,128,.4);
  }
  .toast.show{transform:translateX(-50%) translateY(0)}

  /* 响应式 */
  @media (max-width:768px){
    .wrap{padding:20px 16px 40px}
    .topbar{margin-bottom:0}
    .title{letter-spacing:2px}
    .subtitle{letter-spacing:3px;font-size:13px}
    .controls{gap:10px}
    .btn{font-size:18px;padding:14px 36px}
    .btn-secondary{font-size:15px;padding:12px 24px}
    .modal{padding:32px 24px}
    .modal-text{font-size:22px}
    .drawer{width:100%}
  }
</style>
</head>
<body>

<div id="stars"></div>
<span class="float-deco" style="top:15%;left:8%">✦</span>
<span class="float-deco" style="top:25%;right:10%;animation-delay:2s">✧</span>
<span class="float-deco" style="bottom:20%;left:12%;animation-delay:4s">★</span>
<span class="float-deco" style="bottom:30%;right:8%;animation-delay:1s">✦</span>
<span class="float-deco" style="top:50%;left:5%;animation-delay:3s">✧</span>

<canvas id="confetti"></canvas>

<div class="wrap">
  <div class="topbar">
    <div class="brand">SAY · WHAT</div>
    <button class="history-btn" id="openHistory">
      <span>📜</span><span>历史记录</span>
    </button>
  </div>

  <div class="title-area">
    <h1 class="title">今天说什么</h1>
    <div class="subtitle">点一下 · <span>灵感就来</span> · 说走就走</div>
    <div class="deco-stars">✦ ✧ ✦ ✧ ✦</div>
  </div>

  <div class="style-tabs" id="styleTabs">
    <div class="tab active" data-style="daily">🌸 日常碎碎念</div>
    <div class="tab" data-style="literary">🌙 文艺青年</div>
    <div class="tab" data-style="funny">🤪 搞笑段子</div>
  </div>

  <div class="wheel-area">
    <div class="bulbs" id="bulbs"></div>
    <div class="pointer"></div>
    <div class="wheel" id="wheel"></div>
    <div class="hub">🎯</div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="spinBtn">开 抽 ！</button>
    <button class="btn btn-secondary" id="changeStyleBtn">🎲 换个风格</button>
  </div>

  <div class="hint">点击 <b>开抽</b> 让命运替你发言 · 抽中后可一键复制</div>
</div>

<!-- 结果弹窗 -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <button class="modal-close" id="modalClose">×</button>
    <div class="modal-emoji" id="modalEmoji">🎉</div>
    <div class="modal-label">TODAY'S SAY</div>
    <div class="modal-text" id="modalText">...</div>
    <div class="modal-actions">
      <button class="modal-btn modal-copy" id="copyBtn">📋 复制这句话</button>
      <button class="modal-btn modal-again" id="againBtn">🔄 再抽一次</button>
    </div>
  </div>
</div>

<!-- 历史抽屉 -->
<div class="drawer-mask" id="drawerMask"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-title">📜 抽签历史</div>
    <button class="drawer-close" id="drawerClose">×</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot">
    <button class="clear-btn" id="clearHistory">🗑️ 清空历史</button>
  </div>
</div>

<div class="toast" id="toast">已复制到剪贴板</div>

<script>
/* ========= 台词库 ========= */
const scripts = {
  daily: [
    "今天也是想躺平但被迫营业的一天",
    "咖啡续命，奶茶还魂，打工人不打瞌睡",
    "外卖到了，今天的小确幸准时送达",
    "不想上班但想发财，这矛盾吗",
    "天气不错，适合发呆和摸鱼",
    "今日份快乐：下班的那一刻",
    "又是被闹钟背叛的一个早晨",
    "钱包瘦了，我胖了，公平交易",
    "今天的风很懂事，吹散了我的烦恼",
    "没有什么是一顿火锅解决不了的",
    "周末的我在充电，工作日的我在漏电",
    "今日状态：电量1%，请尽快充电"
  ],
  literary: [
    "我采集了晚霞，寄给远方的你",
    "月亮是夜空写给人间的情书",
    "风穿过指缝，带走未说出口的话",
    "把心事折成纸船，放进时间的河",
    "每个清晨都是世界重新原谅我",
    "星星不说话，却照亮了整片海",
    "我在人间贩卖黄昏，收集温柔",
    "雨落在屋顶，像谁在轻声念诗",
    "春天来信了，拆开全是你的名字",
    "时间煮雨，岁月缝花，慢慢来",
    "把孤独酿成酒，敬过往一杯",
    "云朵在天空写信，落款是彩虹"
  ],
  funny: [
    "我不是胖，我是可爱到膨胀",
    "今天也是被自己帅醒的一天",
    "钱不是问题，问题是我没钱",
    "我这人没啥缺点，就是缺点钱",
    "熬夜冠军申请出战，谁与争锋",
    "本想瘦成闪电，结果胖成饺子",
    "我的人生目标：混吃等死带薪休假",
    "今天也在为别人的钱包努力打工",
    "emo了，但不知道为什么，先emo再说",
    "我不是懒，我只是在节能模式",
    "梦想还是要有的，万一见鬼了呢",
    "今天不开心，反正明天也不会开心"
  ]
};

const styleMeta = {
  daily:{name:"日常",cls:"tag-daily",emoji:"🌸"},
  literary:{name:"文艺",cls:"tag-literary",emoji:"🌙"},
  funny:{name:"搞笑",cls:"tag-funny",emoji:"🤪"}
};

/* 12 格转盘配色（彩虹渐变） */
const sliceColors = [
  '#ff2e9a','#ff6b35','#ffd93d','#4ade80',
  '#00f0ff','#5b8def','#a855f7','#ff2e9a',
  '#ff6b35','#ffd93d','#4ade80','#00f0ff'
];

/* ========= 状态 ========= */
let currentStyle = 'daily';
let isSpinning = false;
let currentRotation = 0;
let history = JSON.parse(localStorage.getItem('sayHistory') || '[]');

/* ========= 星空 ========= */
function createStars(){
  const box = document.getElementById('stars');
  const n = 80;
  for(let i=0;i<n;i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random()*2+1;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.animationDelay = Math.random()*3+'s';
    s.style.animationDuration = (Math.random()*2+2)+'s';
    box.appendChild(s);
  }
}

/* ========= 灯泡 ========= */
function createBulbs(){
  const box = document.getElementById('bulbs');
  const n = 24;
  const radius = 50; // 百分比
  for(let i=0;i<n;i++){
    const b = document.createElement('div');
    b.className = 'bulb';
    const angle = (i/n)*360;
    b.style.transform = `rotate(${angle}deg) translate(${radius}%) translate(-50%,-50%)`;
    // 用更稳的定位
    b.style.top = '50%';
    b.style.left = '50%';
    const rad = angle * Math.PI/180;
    const r = box.offsetWidth/2 || 250;
    b.style.transform = `translate(-50%,-50%) translate(${Math.cos(rad)*r}px,${Math.sin(rad)*r}px)`;
    b.style.animationDelay = (i*0.08)+'s';
    if(i%2===0) b.style.background = 'var(--cyan)', b.style.boxShadow='0 0 10px var(--cyan),0 0 20px var(--cyan)';
    else b.style.background = 'var(--yellow)', b.style.boxShadow='0 0 10px var(--yellow),0 0 20px var(--yellow)';
    box.appendChild(b);
  }
}

/* ========= 转盘绘制 ========= */
function drawWheel(){
  const wheel = document.getElementById('wheel');
  wheel.innerHTML = '';
  const list = scripts[currentStyle];
  // conic-gradient 背景
  const stops = sliceColors.map((c,i)=>`${c} ${i*30}deg ${(i+1)*30}deg`).join(',');
  wheel.style.background = `conic-gradient(${stops})`;

  // 每格文字
  list.forEach((text,i)=>{
    const slice = document.createElement('div');
    slice.className = 'slice';
    slice.style.transform = `rotate(${i*30}deg)`;
    // 文字方向：让文字从中心向外读
    const t = document.createElement('div');
    t.className = 'slice-text';
    t.textContent = text.length>10 ? text.slice(0,9)+'…' : text;
    slice.appendChild(t);
    wheel.appendChild(slice);
  });
}

/* ========= 旋转 ========= */
function spin(){
  if(isSpinning) return;
  isSpinning = true;
  const btn = document.getElementById('spinBtn');
  btn.disabled = true;
  btn.textContent = '旋转中…';

  const targetIndex = Math.floor(Math.random()*12);
  // 每格30度；指针在顶部(0deg)，转盘需让目标格中心对准顶部
  // slice i 中心角度 = i*30 + 15（顺时针从顶部计）
  // 转盘旋转 R 后，slice i 落到顶部 => R ≡ -(i*30+15) (mod 360)
  const baseStop = 360 - (targetIndex*30 + 15);
  const extraSpins = 6; // 多转6圈
  const jitter = (Math.random()*20 - 10); // ±10度抖动，仍落在格内
  const finalAngle = currentRotation - (currentRotation%360) + 360*extraSpins + baseStop + jitter;
  currentRotation = finalAngle;

  const wheel = document.getElementById('wheel');
  wheel.style.transform = `rotate(${finalAngle}deg)`;

  setTimeout(()=>{
    const result = scripts[currentStyle][targetIndex];
    showResult(result);
    addHistory(result, currentStyle);
    launchConfetti();
    isSpinning = false;
    btn.disabled = false;
    btn.textContent = '再抽一次！';
  }, 4100);
}

/* ========= 结果弹窗 ========= */
function showResult(text){
  document.getElementById('modalText').textContent = text;
  const emojis = ['🎉','✨','🎊','💫','🥳','🌟','🎆','🎈'];
  document.getElementById('modalEmoji').textContent = emojis[Math.floor(Math.random()*emojis.length)];
  document.getElementById('modalMask').classList.add('show');
}
function closeModal(){
  document.getElementById('modalMask').classList.remove('show');
}

/* ========= 复制 ========= */
function copyText(){
  const text = document.getElementById('modalText').textContent;
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>showToast('已复制到剪贴板 📋'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');showToast('已复制到剪贴板 📋')}catch(e){showToast('复制失败，请手动复制')}
    document.body.removeChild(ta);
  }
}

/* ========= Toast ========= */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'),2000);
}

/* ========= 彩纸 ========= */
const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');
let confetti = [];
function resizeCanvas(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

function launchConfetti(){
  const colors = ['#ff2e9a','#00f0ff','#ffd93d','#4ade80','#a855f7','#ff6b35'];
  for(let i=0;i<150;i++){
    confetti.push({
      x: innerWidth/2 + (Math.random()-0.5)*200,
      y: innerHeight/2,
      vx: (Math.random()-0.5)*16,
      vy: Math.random()*-16 - 6,
      g: 0.4,
      size: Math.random()*8+4,
      color: colors[Math.floor(Math.random()*colors.length)],
      rot: Math.random()*360,
      vr: (Math.random()-0.5)*20,
      life: 1
    });
  }
  if(!confettiRunning) animateConfetti();
}
let confettiRunning = false;
function animateConfetti(){
  confettiRunning = true;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  confetti = confetti.filter(p=>p.life>0 && p.y<canvas.height+50);
  confetti.forEach(p=>{
    p.vy += p.g;
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.vr;
    p.life -= 0.008;
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rot*Math.PI/180);
    ctx.globalAlpha = Math.max(0,p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
    ctx.restore();
  });
  if(confetti.length>0){
    requestAnimationFrame(animateConfetti);
  } else {
    confettiRunning = false;
    ctx.clearRect(0,0,canvas.width,canvas.height);
  }
}

/* ========= 历史记录 ========= */
function addHistory(text,style){
  const now = new Date();
  const time = now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  history.unshift({text,style,time,date:now.toLocaleDateString('zh-CN')});
  if(history.length>20) history = history.slice(0,20);
  localStorage.setItem('sayHistory',JSON.stringify(history));
  renderHistory();
}
function renderHistory(){
  const body = document.getElementById('drawerBody');
  if(history.length===0){
    body.innerHTML = '<div class="drawer-empty"><div class="big">🎰</div>还没有抽过签哦<br>快去转一下试试手气吧</div>';
    return;
  }
  body.innerHTML = history.map(h=>`
    <div class="hist-item">
      <div class="hist-text">${escapeHtml(h.text)}</div>
      <div class="hist-meta">
        <span class="hist-tag ${styleMeta[h.style].cls}">${styleMeta[h.style].emoji} ${styleMeta[h.style].name}</span>
        <span>${h.date} ${h.time}</span>
      </div>
    </div>
  `).join('');
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function openDrawer(){
  document.getElementById('drawer').classList.add('show');
  document.getElementById('drawerMask').classList.add('show');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('drawerMask').classList.remove('show');
}

/* ========= 风格切换 ========= */
function switchStyle(style){
  currentStyle = style;
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.style===style);
  });
  // 重置转盘到初始
  currentRotation = 0;
  const wheel = document.getElementById('wheel');
  wheel.style.transition = 'none';
  wheel.style.transform = 'rotate(0deg)';
  drawWheel();
  // 恢复 transition
  setTimeout(()=>{wheel.style.transition = 'transform 4s cubic-bezier(0.17,0.67,0.12,0.99)'},50);
}

/* ========= 事件绑定 ========= */
document.getElementById('spinBtn').addEventListener('click', spin);
document.getElementById('changeStyleBtn').addEventListener('click', ()=>{
  const styles = ['daily','literary','funny'];
  const others = styles.filter(s=>s!==currentStyle);
  const next = others[Math.floor(Math.random()*others.length)];
  switchStyle(next);
  showToast(`已切换到「${styleMeta[next].name}」风格 ${styleMeta[next].emoji}`);
});
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    if(isSpinning) return;
    switchStyle(tab.dataset.style);
  });
});
document.getElementById('openHistory').addEventListener('click', openDrawer);
document.getElementById('drawerClose').addEventListener('click', closeDrawer);
document.getElementById('drawerMask').addEventListener('click', closeDrawer);
document.getElementById('clearHistory').addEventListener('click',()=>{
  history = [];
  localStorage.setItem('sayHistory','[]');
  renderHistory();
  showToast('历史已清空 🗑️');
});
document.getElementById('copyBtn').addEventListener('click', copyText);
document.getElementById('againBtn').addEventListener('click',()=>{
  closeModal();
  setTimeout(spin, 350);
});
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalMask').addEventListener('click',e=>{
  if(e.target.id==='modalMask') closeModal();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();closeDrawer()}
  if(e.key===' '&&!isSpinning&&document.getElementById('modalMask').classList.contains('show')===false){
    e.preventDefault();spin();
  }
});

/* ========= 初始化 ========= */
createStars();
drawWheel();
renderHistory();
// 灯泡需要在 layout 后定位
setTimeout(createBulbs, 50);
window.addEventListener('resize',()=>{
  document.getElementById('bulbs').innerHTML='';
  setTimeout(createBulbs,50);
});
</script>
</body>
