<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光合笔记 - PhotoSynthesis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <style>
        /* 光合笔记 - PhotoSynthesis 样式文件 */
        /* 设计理念：自然、温暖、治愈、极简 */

        :root {
            --primary-green: #4a7c59;
            --primary-green-light: #6b9b7a;
            --primary-green-dark: #2d5a3d;
            --warm-yellow: #f4d03f;
            --warm-orange: #e67e22;
            --warm-amber: #d4a574;
            --emotion-color: #7cb342;
            --emotion-bg: rgba(124, 179, 66, 0.1);
            --learning-color: #5c6bc0;
            --learning-bg: rgba(92, 107, 192, 0.1);
            --life-color: #ff8a65;
            --life-bg: rgba(255, 138, 101, 0.1);
            --bg-primary: #faf8f5;
            --bg-secondary: #f5f2ed;
            --bg-card: #ffffff;
            --text-primary: #3d3d3d;
            --text-secondary: #6b6b6b;
            --text-muted: #9a9a9a;
            --border-color: #e8e5e0;
            --border-light: #f0ede8;
            --shadow-sm: 0 2px 8px rgba(74, 124, 89, 0.08);
            --shadow-md: 0 4px 16px rgba(74, 124, 89, 0.12);
            --shadow-lg: 0 8px 32px rgba(74, 124, 89, 0.16);
            --font-display: 'ZCOOL XiaoWei', serif;
            --font-body: 'Noto Serif SC', serif;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --transition-fast: 0.2s ease;
            --transition-normal: 0.3s ease;
            --transition-slow: 0.5s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; scroll-behavior: smooth; }
        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse at top left, rgba(74, 124, 89, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at bottom right, rgba(244, 208, 63, 0.03) 0%, transparent 50%);
        }

        .app-container { max-width: 800px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

        .app-header {
            padding: 20px 24px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-light);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .logo-icon { font-size: 28px; animation: gentle-sway 3s ease-in-out infinite; }
        @keyframes gentle-sway {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }
        .logo-text { font-family: var(--font-display); font-size: 24px; font-weight: 500; color: var(--primary-green); letter-spacing: 2px; }

        .nav-tabs { display: flex; gap: 8px; }
        .nav-tab {
            padding: 10px 20px;
            background: transparent;
            border: none;
            font-family: var(--font-body);
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: var(--radius-md);
            transition: var(--transition-fast);
        }
        .nav-tab:hover { background: var(--bg-secondary); color: var(--text-primary); }
        .nav-tab.active { background: var(--primary-green); color: white; }

        .main-content { flex: 1; padding: 24px; }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .quote-banner {
            padding: 24px;
            background: linear-gradient(135deg, var(--primary-green-light) 0%, var(--primary-green) 100%);
            border-radius: var(--radius-lg);
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }
        .quote-banner::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(244, 208, 63, 0.2) 0%, transparent 70%);
            animation: shimmer 4s ease-in-out infinite;
        }
        @keyframes shimmer { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-20px, 20px); } }
        .quote-text { font-family: var(--font-display); font-size: 18px; color: white; text-align: center; position: relative; z-index: 1; letter-spacing: 1px; }

        .input-container { background: var(--bg-card); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 24px; }
        .input-wrapper { position: relative; }
        .main-input {
            width: 100%;
            padding: 16px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            font-family: var(--font-body);
            font-size: 16px;
            resize: none;
            transition: var(--transition-fast);
            background: var(--bg-secondary);
        }
        .main-input:focus { outline: none; border-color: var(--primary-green); box-shadow: 0 0 0 4px rgba(74, 124, 89, 0.1); }
        .main-input::placeholder { color: var(--text-muted); font-style: italic; }

        .input-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
        .action-btn { padding: 10px 16px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition-fast); }
        .action-btn:hover { background: var(--primary-green-light); border-color: var(--primary-green); }
        .action-btn .btn-icon { font-size: 18px; }
        .submit-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--primary-green-dark) 100%);
            border: none;
            border-radius: var(--radius-md);
            color: white;
            font-family: var(--font-body);
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition-normal);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .submit-btn:active { transform: translateY(0); }

        .image-preview { margin-top: 16px; padding: 12px; background: var(--bg-secondary); border-radius: var(--radius-md); display: flex; align-items: center; gap: 12px; }
        .image-preview.hidden { display: none; }
        .image-preview img { max-width: 120px; max-height: 120px; border-radius: var(--radius-sm); object-fit: cover; }
        .remove-btn { padding: 4px 8px; background: var(--warm-orange); color: white; border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: 16px; }

        .voice-status { margin-top: 12px; padding: 12px; background: var(--emotion-bg); border-radius: var(--radius-md); display: flex; align-items: center; gap: 8px; animation: pulse 1.5s ease-in-out infinite; }
        .voice-status.hidden { display: none; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .voice-icon { font-size: 20px; }
        .voice-text { color: var(--emotion-color); font-size: 14px; }

        .refraction-result { background: var(--bg-card); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-md); animation: slideUp 0.4s ease; }
        .refraction-result.hidden { display: none; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border-light); }
        .result-header h2 { font-family: var(--font-display); font-size: 20px; color: var(--primary-green); }
        .timestamp { color: var(--text-muted); font-size: 12px; }

        .refraction-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        @media (max-width: 600px) { .refraction-cards { grid-template-columns: 1fr; } }
        .refraction-card { padding: 20px; border-radius: var(--radius-md); transition: var(--transition-fast); }
        .refraction-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-sm); }
        .emotion-card { background: var(--emotion-bg); border: 1px solid rgba(124, 179, 66, 0.2); }
        .learning-card { background: var(--learning-bg); border: 1px solid rgba(92, 107, 192, 0.2); }
        .life-card { background: var(--life-bg); border: 1px solid rgba(255, 138, 101, 0.2); }
        .card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .card-icon { font-size: 24px; }
        .card-header h3 { font-family: var(--font-display); font-size: 16px; }
        .emotion-card .card-header h3 { color: var(--emotion-color); }
        .learning-card .card-header h3 { color: var(--learning-color); }
        .life-card .card-header h3 { color: var(--life-color); }
        .card-content p { font-size: 14px; color: var(--text-primary); line-height: 1.8; }

        .tasks-list { margin-top: 12px; }
        .task-item { padding: 8px 12px; background: white; border-radius: var(--radius-sm); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .task-checkbox { width: 16px; height: 16px; border: 2px solid var(--learning-color); border-radius: 4px; cursor: pointer; }

        .archive-tags { margin-top: 12px; }
        .archive-tag { padding: 6px 12px; background: var(--life-color); color: white; border-radius: var(--radius-sm); font-size: 12px; }

        .archive-actions { display: flex; gap: 12px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border-light); }
        .archive-btn, .export-btn { padding: 12px 20px; border: none; border-radius: var(--radius-md); font-family: var(--font-body); font-size: 14px; cursor: pointer; transition: var(--transition-fast); display: flex; align-items: center; gap: 8px; }
        .archive-btn { background: var(--primary-green); color: white; }
        .archive-btn:hover { background: var(--primary-green-dark); }
        .export-btn { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-color); }
        .export-btn:hover { background: var(--warm-amber); color: white; }

        .archive-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .archive-header h2 { font-family: var(--font-display); font-size: 22px; color: var(--primary-green); }
        .archive-filter { display: flex; gap: 12px; }
        .filter-select, .date-filter { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-family: var(--font-body); font-size: 14px; background: var(--bg-card); }

        .archive-list { display: grid; gap: 16px; }
        .archive-item { background: var(--bg-card); border-radius: var(--radius-md); padding: 20px; box-shadow: var(--shadow-sm); cursor: pointer; transition: var(--transition-fast); }
        .archive-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .archive-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .archive-item-date { font-size: 12px; color: var(--text-muted); }
        .archive-item-category { padding: 4px 8px; background: var(--primary-green-light); color: white; border-radius: var(--radius-sm); font-size: 11px; }
        .archive-item-content { font-size: 14px; color: var(--text-primary); line-height: 1.6; }
        .archive-item-preview { margin-top: 12px; padding: 8px; background: var(--bg-secondary); border-radius: var(--radius-sm); font-size: 12px; color: var(--text-secondary); }

        .reports-header h2 { font-family: var(--font-display); font-size: 22px; color: var(--primary-green); margin-bottom: 20px; }
        .reports-tabs { display: flex; gap: 8px; margin-bottom: 24px; }
        .report-tab { padding: 10px 20px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md); font-family: var(--font-body); font-size: 14px; color: var(--text-secondary); cursor: pointer; transition: var(--transition-fast); }
        .report-tab.active { background: var(--primary-green); color: white; border-color: var(--primary-green); }
        .report-content { background: var(--bg-card); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-sm); }
        .report-section { margin-bottom: 24px; }
        .report-section h3 { font-family: var(--font-display); font-size: 18px; color: var(--text-primary); margin-bottom: 12px; }
        .report-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .stat-card { padding: 16px; background: var(--bg-secondary); border-radius: var(--radius-md); text-align: center; }
        .stat-value { font-size: 28px; font-weight: 600; color: var(--primary-green); }
        .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        @media (max-width: 600px) { .report-stats { grid-template-columns: 1fr; } }

        .quotes-header h2 { font-family: var(--font-display); font-size: 22px; color: var(--primary-green); margin-bottom: 20px; }
        .quotes-categories { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
        .quote-category { padding: 8px 16px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md); font-family: var(--font-body); font-size: 14px; color: var(--text-secondary); cursor: pointer; transition: var(--transition-fast); }
        .quote-category.active { background: var(--warm-yellow); color: var(--text-primary); border-color: var(--warm-yellow); }
        .quotes-list { display: grid; gap: 16px; }
        .quote-card { background: var(--bg-card); border-radius: var(--radius-md); padding: 20px; box-shadow: var(--shadow-sm); position: relative; transition: var(--transition-fast); }
        .quote-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .quote-card-text { font-family: var(--font-display); font-size: 16px; color: var(--text-primary); line-height: 1.8; margin-bottom: 12px; }
        .quote-card-category { font-size: 12px; color: var(--text-muted); }
        .quote-card-favorite { position: absolute; top: 16px; right: 16px; font-size: 20px; cursor: pointer; opacity: 0.5; transition: var(--transition-fast); }
        .quote-card-favorite:hover { opacity: 1; }
        .quote-card-favorite.active { opacity: 1; color: var(--warm-orange); }

        .app-footer { padding: 16px 24px; background: var(--bg-card); border-top: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; }
        .status-text { font-size: 14px; color: var(--text-secondary); }
        .status-text strong { color: var(--primary-green); }
        .ai-status { display: flex; align-items: center; gap: 8px; }
        .ai-icon { font-size: 18px; }
        .ai-text { font-size: 14px; color: var(--primary-green); }

        @media (max-width: 600px) {
            .app-header { padding: 16px; }
            .logo-text { font-size: 20px; }
            .nav-tabs { flex-wrap: wrap; }
            .nav-tab { padding: 8px 12px; font-size: 12px; }
            .main-content { padding: 16px; }
            .quote-banner { padding: 16px; }
            .quote-text { font-size: 14px; }
            .input-container { padding: 16px; }
            .main-input { font-size: 14px; }
            .submit-btn { padding: 10px 16px; font-size: 14px; }
            .archive-actions { flex-direction: column; }
            .archive-btn, .export-btn { width: 100%; justify-content: center; }
        }

        .loading { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 20px; }
        .loading-dot { width: 8px; height: 8px; background: var(--primary-green); border-radius: 50%; animation: bounce 1.4s ease-in-out infinite both; }
        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .empty-state-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
        .empty-state-text { font-size: 14px; }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">🌿</span>
                <h1 class="logo-text">光合笔记</h1>
            </div>
            <nav class="nav-tabs">
                <button class="nav-tab active" data-tab="home">首页</button>
                <button class="nav-tab" data-tab="archive">归档</button>
                <button class="nav-tab" data-tab="reports">报告</button>
                <button class="nav-tab" data-tab="quotes">金句</button>
            </nav>
        </header>

        <main class="main-content">
            <section id="home-tab" class="tab-content active">
                <div class="quote-banner">
                    <p class="quote-text">"每一片叶子都在默默光合，你的成长也在悄然发生"</p>
                </div>

                <div class="input-container">
                    <div class="input-wrapper">
                        <textarea id="main-input" class="main-input" placeholder="写下你的想法、情绪、任务...让 AI 帮你三维折射" rows="3"></textarea>
                        <div class="input-actions">
                            <button id="image-btn" class="action-btn" title="上传图片"><span class="btn-icon">📷</span></button>
                            <button id="voice-btn" class="action-btn" title="语音输入"><span class="btn-icon">🎤</span></button>
                            <button id="submit-btn" class="submit-btn"><span class="btn-text">光合</span><span class="btn-icon">✨</span></button>
                        </div>
                    </div>
                    <div id="image-preview" class="image-preview hidden">
                        <img id="preview-img" src="" alt="预览图片">
                        <button id="remove-image" class="remove-btn">×</button>
                    </div>
                    <div id="voice-status" class="voice-status hidden">
                        <span class="voice-icon">🎤</span>
                        <span class="voice-text">正在录音...</span>
                    </div>
                </div>

                <div id="refraction-result" class="refraction-result hidden">
                    <div class="result-header">
                        <h2>三维折射</h2>
                        <span class="timestamp"></span>
                    </div>
                    <div class="refraction-cards">
                        <div class="refraction-card emotion-card">
                            <div class="card-header"><span class="card-icon">💚</span><h3>情绪安抚</h3></div>
                            <div class="card-content"><p id="emotion-text"></p></div>
                        </div>
                        <div class="refraction-card learning-card">
                            <div class="card-header"><span class="card-icon">📚</span><h3>学习指导</h3></div>
                            <div class="card-content"><p id="learning-text"></p><div id="tasks-list" class="tasks-list"></div></div>
                        </div>
                        <div class="refraction-card life-card">
                            <div class="card-header"><span class="card-icon">🌸</span><h3>生活归档</h3></div>
                            <div class="card-content"><p id="life-text"></p><div class="archive-tags"><span id="archive-category" class="archive-tag"></span></div></div>
                        </div>
                    </div>
                    <div class="archive-actions">
                        <button id="archive-btn" class="archive-btn"><span class="btn-icon">📁</span><span class="btn-text">归档保存</span></button>
                        <button id="export-md-btn" class="export-btn"><span class="btn-icon">📄</span><span class="btn-text">导出 MD</span></button>
                    </div>
                </div>
            </section>

            <section id="archive-tab" class="tab-content">
                <div class="archive-header">
                    <h2>时光归档</h2>
                    <div class="archive-filter">
                        <select id="category-filter" class="filter-select">
                            <option value="all">全部</option>
                            <option value="学习">学习</option>
                            <option value="生活">生活</option>
                            <option value="情绪">情绪</option>
                            <option value="灵感">灵感</option>
                        </select>
                        <input type="date" id="date-filter" class="date-filter">
                    </div>
                </div>
                <div id="archive-list" class="archive-list"></div>
            </section>

            <section id="reports-tab" class="tab-content">
                <div class="reports-header"><h2>成长报告</h2></div>
                <div class="reports-tabs">
                    <button class="report-tab active" data-report="weekly">周报</button>
                    <button class="report-tab" data-report="monthly">月报</button>
                    <button class="report-tab" data-report="yearly">年报</button>
                </div>
                <div id="report-content" class="report-content"></div>
            </section>

            <section id="quotes-tab" class="tab-content">
                <div class="quotes-header"><h2>激励金句库</h2></div>
                <div class="quotes-categories">
                    <button class="quote-category active" data-category="all">全部</button>
                    <button class="quote-category" data-category="治愈">治愈</button>
                    <button class="quote-category" data-category="鼓励">鼓励</button>
                    <button class="quote-category" data-category="陪伴">陪伴</button>
                    <button class="quote-category" data-category="力量">力量</button>
                </div>
                <div id="quotes-list" class="quotes-list"></div>
            </section>
        </main>

        <footer class="app-footer">
            <div class="status-info"><span class="status-text">今日已记录 <strong id="today-count">0</strong> 条</span></div>
            <div class="ai-status"><span class="ai-icon">🤖</span><span class="ai-text">AI 已就绪</span></div>
        </footer>
    </div>

    <input type="file" id="image-input" accept="image/*" hidden>

    <script>
        /**
         * 光合笔记 - PhotoSynthesis
         * 核心逻辑
         */

        // ==================== 数据模型 ====================
        class ArchiveItem {
            constructor(id, content, emotionText, learningText, lifeText, category, timestamp, imageUrl = null) {
                this.id = id;
                this.content = content;
                this.emotionText = emotionText;
                this.learningText = learningText;
                this.lifeText = lifeText;
                this.category = category;
                this.timestamp = timestamp;
                this.imageUrl = imageUrl;
                this.tasks = [];
            }
        }

        class Task {
            constructor(id, content, completed = false) {
                this.id = id;
                this.content = content;
                this.completed = completed;
            }
        }

        class Quote {
            constructor(id, text, category, favorite = false) {
                this.id = id;
                this.text = text;
                this.category = category;
                this.favorite = favorite;
            }
        }

        // ==================== 本地存储管理 ====================
        class StorageManager {
            constructor() {
                this.STORAGE_KEYS = {
                    ARCHIVES: 'photosynthesis_archives',
                    QUOTES: 'photosynthesis_quotes',
                    SETTINGS: 'photosynthesis_settings',
                    STATS: 'photosynthesis_stats'
                };
            }

            saveArchive(archive) {
                const archives = this.getArchives();
                archives.unshift(archive);
                localStorage.setItem(this.STORAGE_KEYS.ARCHIVES, JSON.stringify(archives));
                this.updateStats('archiveCount', archives.length);
            }

            getArchives() {
                const data = localStorage.getItem(this.STORAGE_KEYS.ARCHIVES);
                return data ? JSON.parse(data) : [];
            }

            deleteArchive(id) {
                const archives = this.getArchives().filter(a => a.id !== id);
                localStorage.setItem(this.STORAGE_KEYS.ARCHIVES, JSON.stringify(archives));
            }

            saveQuotes(quotes) {
                localStorage.setItem(this.STORAGE_KEYS.QUOTES, JSON.stringify(quotes));
            }

            getQuotes() {
                const data = localStorage.getItem(this.STORAGE_KEYS.QUOTES);
                return data ? JSON.parse(data) : this.getDefaultQuotes();
            }

            toggleQuoteFavorite(id) {
                const quotes = this.getQuotes();
                const quote = quotes.find(q => q.id === id);
                if (quote) { quote.favorite = !quote.favorite; this.saveQuotes(quotes); }
                return quotes;
            }

            getStats() {
                const data = localStorage.getItem(this.STORAGE_KEYS.STATS);
                return data ? JSON.parse(data) : { archiveCount: 0, todayCount: 0, lastDate: null };
            }

            updateStats(key, value) {
                const stats = this.getStats();
                stats[key] = value;
                const today = new Date().toDateString();
                if (stats.lastDate !== today) { stats.todayCount = 0; stats.lastDate = today; }
                localStorage.setItem(this.STORAGE_KEYS.STATS, JSON.stringify(stats));
            }

            incrementTodayCount() {
                const stats = this.getStats();
                const today = new Date().toDateString();
                if (stats.lastDate !== today) { stats.todayCount = 0; stats.lastDate = today; }
                stats.todayCount++;
                localStorage.setItem(this.STORAGE_KEYS.STATS, JSON.stringify(stats));
                return stats.todayCount;
            }

        // ==================== AI 三维折射引擎 ====================
        class AIRefractionEngine {
            async analyze(content, imageUrl = null) {
                await this.simulateDelay(800);
                return this.mockAnalysis(content);
            }

            simulateDelay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

            mockAnalysis(content) {
                const emotionKeywords = ['累', '烦', '难过', '焦虑', '压力', '疲惫', '不开心', '沮丧', 'emo'];
                const learningKeywords = ['复习', '学习', '任务', '作业', '考试', '工作', '项目', '完成', '进度'];
                const lifeKeywords = ['生活', '日常', '今天', '周末', '朋友', '家人', '吃饭', '运动', '休息'];

                let emotionText = "";
                const hasEmotionKeyword = emotionKeywords.some(k => content.includes(k));
                if (hasEmotionKeyword) {
                    emotionText = "我理解你的感受。情绪就像天气，有晴天也有阴天，这都是正常的。给自己一点时间，让情绪慢慢流淌过去。";
                } else {
                    emotionText = "你的状态看起来不错！继续保持这份平静与专注，让内心像阳光一样温暖。";
                }

                let learningText = "";
                let tasks = [];
                const hasLearningKeyword = learningKeywords.some(k => content.includes(k));
                if (hasLearningKeyword) {
                    const taskMatch = content.match(/(\d+).*(章|节|个|项|件)/);
                    if (taskMatch) {
                        const count = parseInt(taskMatch[1]);
                        learningText = `我帮你把任务拆解成${count}个微步，每次只完成一个，降低启动阻力：`;
                        for (let i = 1; i <= count; i++) { tasks.push(new Task(Date.now() + i, `完成第 ${i} 部分`)); }
                    } else {
                        learningText = "建议将任务拆解为更小的微步，每次只专注完成一小部分，降低心理负担。";
                        tasks.push(new Task(Date.now(), "完成第一步"));
                    }
                } else {
                    learningText = "今天没有明确的任务压力，可以专注于当下，或者为明天做些轻松的准备。";
                }

                let category = "生活";
                if (hasLearningKeyword) category = "学习";
                if (hasEmotionKeyword) category = "情绪";
                if (content.includes('灵感') || content.includes('想法')) category = "灵感";

                const lifeText = `已将这条记录归档到"${category}"分类，它将成为你时光酿造的一部分。`;

                return { emotionText, learningText, lifeText, category, tasks };
            }
        }

        // ==================== MD 文件生成器 ====================
        class MDGenerator {
            generate(archive) {
                const date = new Date(archive.timestamp);
                const formattedDate = this.formatDate(date);
                let md = `# 光合笔记 - ${formattedDate}\n\n`;
                md += `> 记录时间：${date.toLocaleString('zh-CN')}\n`;
                md += `> 分类：${archive.category}\n\n`;
                md += `## 原始内容\n\n${archive.content}\n\n`;
                if (archive.imageUrl) { md += `![配图](./images/${archive.id}.png)\n\n`; }
                md += `## 三维折射\n\n### 💚 情绪安抚\n\n${archive.emotionText}\n\n`;
                md += `### 📚 学习指导\n\n${archive.learningText}\n\n`;
                if (archive.tasks && archive.tasks.length > 0) {
                    md += `**微步任务：**\n`;
                    archive.tasks.forEach(task => { const checkbox = task.completed ? '[x]' : '[ ]'; md += `- ${checkbox} ${task.content}\n`; });
                    md += `\n`;
                }
                md += `### 🌸 生活归档\n\n${archive.lifeText}\n\n---\n*光合笔记 - 让每一片叶子都在默默光合*\n`;
                return md;
            }

            formatDate(date) {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            export(archive) {
                const mdContent = this.generate(archive);
                const blob = new Blob([mdContent], { type: 'text/markdown;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `photosynthesis_${this.formatDate(new Date(archive.timestamp))}_${archive.id}.md`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            }
        }

        // ==================== 报告生成器 ====================
        class ReportGenerator {
            constructor(storageManager) { this.storage = storageManager; }

            generateWeeklyReport() {
                const archives = this.storage.getArchives();
                const oneWeekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
                const weeklyArchives = archives.filter(a => new Date(a.timestamp) >= oneWeekAgo);
                const emotionCount = weeklyArchives.filter(a => a.category === '情绪').length;
                const learningCount = weeklyArchives.filter(a => a.category === '学习').length;
                const lifeCount = weeklyArchives.filter(a => a.category === '生活').length;
                const inspirationCount = weeklyArchives.filter(a => a.category === '灵感').length;
                const totalTasks = weeklyArchives.reduce((sum, a) => sum + (a.tasks ? a.tasks.length : 0), 0);
                const completedTasks = weeklyArchives.reduce((sum, a) => sum + (a.tasks ? a.tasks.filter(t => t.completed).length : 0), 0);
                return {
                    type: 'weekly', title: '本周光合报告', period: '过去7天',
                    stats: { totalRecords: weeklyArchives.length, emotionCount, learningCount, lifeCount, inspirationCount, totalTasks, completedTasks, completionRate: totalTasks > 0 ? Math.round(completedTasks / totalTasks * 100) : 0 },
                    message: this.generateWeeklyMessage(weeklyArchives.length, completedTasks, totalTasks)
                };
            }

            generateMonthlyReport() {
                const archives = this.storage.getArchives();
                const oneMonthAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000);
                const monthlyArchives = archives.filter(a => new Date(a.timestamp) >= oneMonthAgo);
                const emotionCount = monthlyArchives.filter(a => a.category === '情绪').length;
                const learningCount = monthlyArchives.filter(a => a.category === '学习').length;
                const lifeCount = monthlyArchives.filter(a => a.category === '生活').length;
                const inspirationCount = monthlyArchives.filter(a => a.category === '灵感').length;
                const totalTasks = monthlyArchives.reduce((sum, a) => sum + (a.tasks ? a.tasks.length : 0), 0);
                const completedTasks = monthlyArchives.reduce((sum, a) => sum + (a.tasks ? a.tasks.filter(t => t.completed).length : 0), 0);
                return {
                    type: 'monthly', title: '本月光合报告', period: '过去30天',
                    stats: { totalRecords: monthlyArchives.length, emotionCount, learningCount, lifeCount, inspirationCount, totalTasks, completedTasks, completionRate: totalTasks > 0 ? Math.round(completedTasks / totalTasks * 100) : 0 },
                    message: this.generateMonthlyMessage(monthlyArchives.length, completedTasks, totalTasks)
                };
            }

            generateYearlyReport() {
                const archives = this.storage.getArchives();
                const oneYearAgo = new Date(Date.now() - 365 * 24 * 60 * 60 * 1000);
                const yearlyArchives = archives.filter(a => new Date(a.timestamp) >= oneYearAgo);
                const emotionCount = yearlyArchives.filter(a => a.category === '情绪').length;
                const learningCount = yearlyArchives.filter(a => a.category === '学习').length;
                const lifeCount = yearlyArchives.filter(a => a.category === '生活').length;
                const inspirationCount = yearlyArchives.filter(a => a.category === '灵感').length;
                const totalTasks = yearlyArchives.reduce((sum, a) => sum + (a.tasks ? a.tasks.length : 0), 0);
                const completedTasks = yearlyArchives.reduce((sum, a) => sum + (a.tasks ? a.tasks.filter(t => t.completed).length : 0), 0);
                return {
                    type: 'yearly', title: '年度光合作用报告', period: '过去365天',
                    stats: { totalRecords: yearlyArchives.length, emotionCount, learningCount, lifeCount, inspirationCount, totalTasks, completedTasks, completionRate: totalTasks > 0 ? Math.round(completedTasks / totalTasks * 100) : 0 },
                    message: this.generateYearlyMessage(yearlyArchives.length, completedTasks, totalTasks)
                };
            }

            generateWeeklyMessage(count, completed, total) {
                if (count === 0) return "这周还没有记录，开始记录你的光合作用吧！";
                if (completed === total && total > 0) return "太棒了！本周所有任务都完成了，你的光合作用效率很高！";
                return `本周你记录了${count}条内容，完成了${completed}/${total}个任务。继续保持，让成长慢慢发生。`;
            }

            generateMonthlyMessage(count, completed, total) {
                if (count === 0) return "这个月还没有记录，开始记录你的光合作用吧！";
                if (count >= 20) return `本月你记录了${count}条内容，你的时光酿造越来越丰富！`;
                return `本月你记录了${count}条内容，完成了${completed}/${total}个任务。每一片叶子都在默默光合。`;
            }

            generateYearlyMessage(count, completed, total) {
                if (count === 0) return "这一年还没有记录，开始记录你的光合作用吧！";
                if (count >= 100) return `这一年你记录了${count}条内容，时光酿造的成果丰硕！`;
                return `这一年你记录了${count}条内容，完成了${completed}/${total}个任务。你的成长在悄然发生。`;
            }
        }

        // ==================== 主应用类 ====================
        class PhotoSynthesisApp {
            constructor() {
                this.storage = new StorageManager();
                this.aiEngine = new AIRefractionEngine();
                this.mdGenerator = new MDGenerator();
                this.reportGenerator = new ReportGenerator(this.storage);
                this.currentArchive = null;
                this.currentImageUrl = null;
                this.init();
            }

            init() {
                this.bindEvents();
                this.updateTodayCount();
                this.loadQuotes();
                this.loadArchives();
            }

            bindEvents() {
                document.querySelectorAll('.nav-tab').forEach(tab => { tab.addEventListener('click', (e) => this.switchTab(e.target.dataset.tab)); });
                document.getElementById('submit-btn').addEventListener('click', () => this.handleSubmit());
                document.getElementById('image-btn').addEventListener('click', () => { document.getElementById('image-input').click(); });
                document.getElementById('image-input').addEventListener('change', (e) => this.handleImageUpload(e));
                document.getElementById('remove-image').addEventListener('click', () => this.removeImage());
                document.getElementById('voice-btn').addEventListener('click', () => this.handleVoiceInput());
                document.getElementById('archive-btn').addEventListener('click', () => this.saveArchive());
                document.getElementById('export-md-btn').addEventListener('click', () => this.exportMD());
                document.getElementById('category-filter').addEventListener('change', () => this.filterArchives());
                document.getElementById('date-filter').addEventListener('change', () => this.filterArchives());
                document.querySelectorAll('.report-tab').forEach(tab => { tab.addEventListener('click', (e) => this.switchReportTab(e.target.dataset.report)); });
                document.querySelectorAll('.quote-category').forEach(cat => { cat.addEventListener('click', (e) => this.filterQuotes(e.target.dataset.category)); });
            }

            switchTab(tabName) {
                document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
                document.querySelector(`.nav-tab[data-tab="${tabName}"]`).classList.add('active');
                document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
                document.getElementById(`${tabName}-tab`).classList.add('active');
                if (tabName === 'archive') this.loadArchives();
                if (tabName === 'reports') this.loadReport('weekly');
                if (tabName === 'quotes') this.loadQuotes();
            }

            async handleSubmit() {
                const input = document.getElementById('main-input');
                const content = input.value.trim();
                if (!content && !this.currentImageUrl) { alert('请输入内容或上传图片'); return; }
                this.showLoading();
                try {
                    const result = await this.aiEngine.analyze(content, this.currentImageUrl);
                    this.showRefractionResult(content, result);
                    input.value = '';
                    this.removeImage();
                } catch (error) {
                    console.error('AI 分析失败:', error);
                    alert('分析失败，请重试');
                }
            }

            showLoading() {
                const resultDiv = document.getElementById('refraction-result');
                resultDiv.classList.remove('hidden');
                resultDiv.innerHTML = `<div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div><p style="text-align: center; color: var(--text-muted);">正在进行光合作用...</p>`;
            }

            showRefractionResult(content, result) {
                const resultDiv = document.getElementById('refraction-result');
                resultDiv.classList.remove('hidden');
                resultDiv.querySelector('.timestamp').textContent = new Date().toLocaleString('zh-CN');
                document.getElementById('emotion-text').textContent = result.emotionText;
                document.getElementById('learning-text').textContent = result.learningText;
                const tasksList = document.getElementById('tasks-list');
                tasksList.innerHTML = '';
                if (result.tasks && result.tasks.length > 0) {
                    result.tasks.forEach(task => {
                        const taskEl = document.createElement('div');
                        taskEl.className = 'task-item';
                        taskEl.innerHTML = `<input type="checkbox" class="task-checkbox" data-task-id="${task.id}"><span>${task.content}</span>`;
                        tasksList.appendChild(taskEl);
                    });
                }
                document.getElementById('life-text').textContent = result.lifeText;
                document.getElementById('archive-category').textContent = result.category;
                this.currentArchive = { content, ...result, timestamp: Date.now(), imageUrl: this.currentImageUrl };
            }

            handleImageUpload(event) {
                const file = event.target.files[0];
                if (!file) return;
                if (!file.type.startsWith('image/')) { alert('请选择图片文件'); return; }
                const reader = new FileReader();
                reader.onload = (e) => {
                    this.currentImageUrl = e.target.result;
                    document.getElementById('preview-img').src = e.target.result;
                    document.getElementById('image-preview').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }

            removeImage() {
                this.currentImageUrl = null;
                document.getElementById('image-preview').classList.add('hidden');
                document.getElementById('image-input').value = '';
            }

            handleVoiceInput() {
                if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                    alert('您的浏览器不支持语音识别，请使用 Chrome 浏览器');
                    return;
                }
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = 'zh-CN';
                recognition.continuous = false;
                recognition.interimResults = false;
                document.getElementById('voice-status').classList.remove('hidden');
                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    document.getElementById('main-input').value = transcript;
                    document.getElementById('voice-status').classList.add('hidden');
                };
                recognition.onerror = (event) => {
                    console.error('语音识别错误:', event.error);
                    document.getElementById('voice-status').classList.add('hidden');
                    alert('语音识别失败，请重试');
                };
                recognition.onend = () => { document.getElementById('voice-status').classList.add('hidden'); };
                recognition.start();
            }

            saveArchive() {
                if (!this.currentArchive) { alert('没有可归档的内容'); return; }
                const archive = new ArchiveItem(Date.now(), this.currentArchive.content, this.currentArchive.emotionText, this.currentArchive.learningText, this.currentArchive.lifeText, this.currentArchive.category, this.currentArchive.timestamp, this.currentArchive.imageUrl);
                archive.tasks = this.currentArchive.tasks || [];
                this.storage.saveArchive(archive);
                this.storage.incrementTodayCount();
                this.updateTodayCount();
                document.getElementById('refraction-result').classList.add('hidden');
                this.currentArchive = null;
                alert('已归档保存！');
            }

            exportMD() {
                if (!this.currentArchive) { alert('没有可导出的内容'); return; }
                const archive = new ArchiveItem(Date.now(), this.currentArchive.content, this.currentArchive.emotionText, this.currentArchive.learningText, this.currentArchive.lifeText, this.currentArchive.category, this.currentArchive.timestamp, this.currentArchive.imageUrl);
                archive.tasks = this.currentArchive.tasks || [];
                this.mdGenerator.export(archive);
            }

            updateTodayCount() {
                const stats = this.storage.getStats();
                document.getElementById('today-count').textContent = stats.todayCount || 0;
            }

            loadArchives() {
                const archives = this.storage.getArchives();
                const listEl = document.getElementById('archive-list');
                if (archives.length === 0) {
                    listEl.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📁</div><p class="empty-state-text">还没有归档记录，开始记录你的光合作用吧</p></div>`;

                    <div class="archive-item" data-id="${archive.id}">
                        <div class="archive-item-header">
                            <span class="archive-item-date">${new Date(archive.timestamp).toLocaleString('zh-CN')}</span>
                            <span class="archive-item-category">${archive.category}</span>
                        </div>
                        <div class="archive-item-content">${archive.content}</div>
                        <div class="archive-item-preview">💚 ${archive.emotionText.substring(0, 30)}...</div>
                    </div>
                `).join('');
                listEl.querySelectorAll('.archive-item').forEach(item => { item.addEventListener('click', (e) => this.showArchiveDetail(e.currentTarget.dataset.id)); });
            }

            filterArchives() {
                const category = document.getElementById('category-filter').value;
                const date = document.getElementById('date-filter').value;
                let archives = this.storage.getArchives();
                if (category !== 'all') { archives = archives.filter(a => a.category === category); }
                if (date) {
                    const filterDate = new Date(date).toDateString();
                    archives = archives.filter(a => new Date(a.timestamp).toDateString() === filterDate);
                }
                const listEl = document.getElementById('archive-list');
                listEl.innerHTML = archives.map(archive => `
                    <div class="archive-item" data-id="${archive.id}">
                        <div class="archive-item-header">
                            <span class="archive-item-date">${new Date(archive.timestamp).toLocaleString('zh-CN')}</span>
                            <span class="archive-item-category">${archive.category}</span>
                        </div>
                        <div class="archive-item-content">${archive.content}</div>
                    </div>
                `).join('');
            }

            showArchiveDetail(id) {
                const archive = this.storage.getArchives().find(a => a.id === parseInt(id));
                if (!archive) return;
                this.switchTab('home');
                this.currentArchive = archive;
                this.showRefractionResult(archive.content, {
                    emotionText: archive.emotionText,
                    learningText: archive.learningText,
                    lifeText: archive.lifeText,
                    category: archive.category,
                    tasks: archive.tasks
                });

                document.querySelectorAll('.report-tab').forEach(tab => tab.classList.remove('active'));

                this.loadReport(reportType);

                switch (reportType) {
                    case 'weekly': report = this.reportGenerator.generateWeeklyReport(); break;

                    case 'yearly': report = this.reportGenerator.generateYearlyReport(); break;

                contentEl.innerHTML = `
                    <div class="report-section"><h3>${report.title}</h3><p style="color: var(--text-muted); margin-bottom: 16px;">${report.period}</p></div>

                        <div class="stat-card"><div class="stat-value">${report.stats.totalRecords}</div><div class="stat-label">记录总数</div></div>
                        <div class="stat-card"><div class="stat-value">${report.stats.completedTasks}/${report.stats.totalTasks}</div><div class="stat-label">任务完成</div></div>
                        <div class="stat-card"><div class="stat-value">${report.stats.completionRate}%</div><div class="stat-label">完成率</div></div>
                    </div></div>
                    <div class="report-section"><h3>📈 分类分布</h3><div class="report-stats">
                        <div class="stat-card" style="background: var(--emotion-bg);"><div class="stat-value">${report.stats.emotionCount}</div><div class="stat-label">💚 情绪</div></div>
                        <div class="stat-card" style="background: var(--learning-bg);"><div class="stat-value">${report.stats.learningCount}</div><div class="stat-label">📚 学习</div></div>
                        <div class="stat-card" style="background: var(--life-bg);"><div class="stat-value">${report.stats.lifeCount}</div><div class="stat-label">🌸 生活</div></div>
                    </div></div>
                    <div class="report-section"><h3>✨ AI 寄语</h3><p style="font-size: 16px; line-height: 1.8; color: var(--text-primary);">${report.message}</p></div>
                `;
            }

            loadQuotes(category = 'all') {
                let quotes = this.storage.getQuotes();
                if (category !== 'all') { quotes = quotes.filter(q => q.category === category); }
                const listEl = document.getElementById('quotes-list');
                listEl.innerHTML = quotes.map(quote => `
                    <div class="quote-card" data-id="${quote.id}">
                        <p class="quote-card-text">"${quote.text}"</p>
                        <span class="quote-card-category">${quote.category}</span>
                        <span class="quote-card-favorite ${quote.favorite ? 'active' : ''}" data-id="${quote.id}">${quote.favorite ? '⭐' : '☆'}</span>
                    </div>
                `).join('');
                listEl.querySelectorAll('.quote-card-favorite').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); this.toggleQuoteFavorite(e.target.dataset.id); }); });
            }

            filterQuotes(category) {
                document.querySelectorAll('.quote-category').forEach(cat => cat.classList.remove('active'));
                document.querySelector(`.quote-category[data-category="${category}"]`).classList.add('active');
                this.loadQuotes(category);
            }

            toggleQuoteFavorite(id) {
                this.storage.toggleQuoteFavorite(parseInt(id));
                this.loadQuotes();
            }
        }

        // ==================== 启动应用 ====================
        document.addEventListener('DOMContentLoaded', () => { window.app = new PhotoSynthesisApp(); });
    </script>
</body>
</html>
