<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周末灵感盒子 - 生活娱乐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            padding: 40px 0 30px;
            color: #fff;
        }
        header h1 {
            font-size: 42px;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }
        header p {
            font-size: 16px;
            opacity: 0.95;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 18px;
            color: #444;
        }
        .mood-grid, .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 14px;
            background: #fff;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            text-align: center;
        }
        .option-btn:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }
        .option-btn.active {
            border-color: #667eea;
            background: #f0f1ff;
            color: #5a67d8;
            font-weight: 600;
        }
        .generate-area {
            text-align: center;
            padding: 20px 0;
        }
        .generate-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            padding: 16px 48px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(102, 126, 234, 0.5);
        }
        .generate-btn:active {
            transform: translateY(0);
        }
        .result-card {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            border-radius: 20px;
            padding: 40px 30px;
            margin-top: 28px;
            text-align: center;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .result-card::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
            opacity: 0.6;
        }
        .result-icon {
            font-size: 56px;
            margin-bottom: 16px;
            z-index: 1;
        }
        .result-title {
            font-size: 26px;
            font-weight: 700;
            color: #5a3e2b;
            margin-bottom: 10px;
            z-index: 1;
        }
        .result-desc {
            font-size: 15px;
            color: #7a5540;
            max-width: 500px;
            line-height: 1.7;
            z-index: 1;
        }
        .result-tags {
            margin-top: 16px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 1;
        }
        .tag {
            background: rgba(255,255,255,0.7);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #8b5e3c;
        }
        .action-bar {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
            z-index: 1;
        }
        .action-btn {
            padding: 10px 22px;
            border-radius: 24px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .action-btn.primary {
            background: #5a3e2b;
            color: #fff;
        }
        .action-btn.secondary {
            background: #fff;
            color: #5a3e2b;
            border: 1px solid #d9c4b5;
        }
        .action-btn:hover {
            opacity: 0.85;
        }
        .favorites {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
        }
        .favorite-item {
            background: #f8f9ff;
            border: 1px solid #e1e4f2;
            border-radius: 12px;
            padding: 14px;
            position: relative;
        }
        .favorite-item .fav-icon {
            font-size: 28px;
            margin-bottom: 6px;
        }
        .favorite-item .fav-title {
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 14px;
        }
        .favorite-item .fav-desc {
            font-size: 12px;
            color: #666;
            line-height: 1.5;
        }
        .remove-fav {
            position: absolute;
            top: 8px;
            right: 10px;
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 16px;
        }
        .empty-tip {
            color: #999;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }
        .hidden {
            display: none;
        }
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.4s ease-out;
        }
        footer {
            text-align: center;
            color: rgba(255,255,255,0.8);
            font-size: 13px;
            padding: 20px 0;
        }
        @media (max-width: 600px) {
            header h1 { font-size: 32px; }
            .card { padding: 22px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>周末灵感盒子</h1>
            <p>专治“周末不知道去哪儿”——摇一摇，发现身边的新鲜玩法</p>
        </header>

        <div class="card">
            <div class="section-title">1. 你现在的心情是？</div>
            <div class="mood-grid">
                <button class="option-btn active" data-mood="relax">🛋️ 想放松</button>
                <button class="option-btn" data-mood="active">🏃 想动起来</button>
                <button class="option-btn" data-mood="social">👫 想社交</button>
                <button class="option-btn" data-mood="explore">🔍 想探索</button>
                <button class="option-btn" data-mood="alone">🌙 想独处</button>
                <button class="option-btn" data-mood="romantic">💕 想约会</button>
            </div>

            <div class="section-title">2. 想玩什么类型？</div>
            <div class="category-grid">
                <button class="option-btn active" data-category="all">✨ 全部</button>
                <button class="option-btn" data-category="food">🍜 美食探店</button>
                <button class="option-btn" data-category="outdoor">🌳 户外</button>
                <button class="option-btn" data-category="indoor">🎮 室内</button>
                <button class="option-btn" data-category="culture">🎨 文艺</button>
                <button class="option-btn" data-category="night">🌃 夜生活</button>
            </div>

            <div class="generate-area">
                <button class="generate-btn" id="generateBtn">给我一个好主意 ✨</button>
            </div>

            <div class="result-card hidden" id="resultCard">
                <div class="result-icon" id="resultIcon">🎁</div>
                <div class="result-title" id="resultTitle">点击按钮开启灵感</div>
                <div class="result-desc" id="resultDesc">选择心情和类型，生成你的周末计划。</div>
                <div class="result-tags" id="resultTags"></div>
                <div class="action-bar">
                    <button class="action-btn primary" id="planBtn">加入计划</button>
                    <button class="action-btn secondary" id="favBtn">收藏 💗</button>
                </div>
            </div>
        </div>

        <div class="card" id="planCard">
            <div class="section-title">我的周末计划</div>
            <div id="planList" class="favorites">
                <div class="empty-tip">还没有计划，去生成一个灵感吧～</div>
            </div>
        </div>

        <div class="card">
            <div class="section-title">我的收藏</div>
            <div id="favList" class="favorites">
                <div class="empty-tip">收藏的灵感会出现在这里</div>
            </div>
        </div>

        <footer>
            <p>生活娱乐赛道创意项目 · 周末灵感盒子</p>
        </footer>
    </div>

    <script>
        const ideas = [
            { icon: '🍰', title: '城市甜品漫游', desc: '地图标记 3 家没吃过的甜品店，今天只负责开心。', mood: 'relax', category: 'food', tags: ['美食', '低强度'] },
            { icon: '🎬', title: '私人电影节', desc: '在家布置一个小影院，连看两部同导演的电影。', mood: 'relax', category: 'indoor', tags: ['电影', '宅家'] },
            { icon: '🏕️', title: '公园野餐日', desc: '买上零食和野餐垫，去最近的公园躺一下午。', mood: 'relax', category: 'outdoor', tags: ['自然', '轻松'] },
            { icon: '🧗', title: '室内攀岩体验', desc: '挑战一条新路线，分泌多巴胺的最佳方式。', mood: 'active', category: 'indoor', tags: ['运动', '挑战'] },
            { icon: '🚴', title: '城市骑行 10km', desc: '骑一条没走过的小路，发现城市隐藏风景。', mood: 'active', category: 'outdoor', tags: ['骑行', '探索'] },
            { icon: '🎤', title: '周末 K 歌局', desc: '约上好友，把最近喜欢的歌单唱一遍。', mood: 'social', category: 'indoor', tags: ['社交', '音乐'] },
            { icon: '🍻', title: '深夜小酒馆', desc: '找一家有现场音乐的小酒馆，和朋友聊到打烊。', mood: 'social', category: 'night', tags: ['夜生活', '社交'] },
            { icon: '📸', title: '老城扫街摄影', desc: '带上手机或相机，记录城市角落的故事。', mood: 'explore', category: 'culture', tags: ['摄影', '城市'] },
            { icon: '🎨', title: '美术馆半日游', desc: '选一家展览，慢慢看、慢慢想，再喝杯咖啡。', mood: 'explore', category: 'culture', tags: ['艺术', '安静'] },
            { icon: '📚', title: '书店漫游计划', desc: '去一家独立书店，挑一本意外之书读一下午。', mood: 'alone', category: 'culture', tags: ['阅读', '独处'] },
            { icon: '🍳', title: '学做一道新菜', desc: '跟着教程做一道没做过的菜，喂饱自己也治愈心。', mood: 'alone', category: 'indoor', tags: ['烹饪', '治愈'] },
            { icon: '🌌', title: '天台看夜景', desc: '带两罐饮料去高处，看看城市的灯火。', mood: 'romantic', category: 'outdoor', tags: ['夜景', '浪漫'] },
            { icon: '🎭', title: '看一场话剧/脱口秀', desc: '现场演出的氛围，是屏幕给不了的快乐。', mood: 'romantic', category: 'culture', tags: ['演出', '约会'] },
            { icon: '🎮', title: '游戏马拉松', desc: '开启那个买了很久没玩的游戏，今晚通关。', mood: 'relax', category: 'indoor', tags: ['游戏', '放松'] },
            { icon: '🧩', title: '拼图挑战', desc: '一副 1000 片拼图，一杯茶，一个安静的下午。', mood: 'alone', category: 'indoor', tags: ['专注', '独处'] },
            { icon: '🍜', title: '老字号美食地图', desc: '探访城市里开了 20 年以上的老店，吃一碗有故事的面。', mood: 'explore', category: 'food', tags: ['美食', '探索'] },
            { icon: '🌅', title: '早起看日出', desc: '去江边或山顶，看一次城市苏醒的样子。', mood: 'active', category: 'outdoor', tags: ['日出', '仪式感'] },
            { icon: '🎸', title: ' livehouse 现场', desc: '买一张小众乐队的票，沉浸在音乐和人群里。', mood: 'social', category: 'night', tags: ['音乐', '现场'] },
            { icon: '🧘', title: '户外瑜伽/冥想', desc: '在公园草地上，跟着音频做一次身心放松。', mood: 'relax', category: 'outdoor', tags: ['瑜伽', '治愈'] },
            { icon: '🎯', title: '射箭/保龄球体验', desc: '尝试一项没玩过的运动，发现新天赋。', mood: 'active', category: 'indoor', tags: ['运动', '新奇'] }
        ];

        let currentMood = 'relax';
        let currentCategory = 'all';
        let currentIdea = null;
        let favorites = JSON.parse(localStorage.getItem('weekendFavs') || '[]');
        let plans = JSON.parse(localStorage.getItem('weekendPlans') || '[]');

        document.querySelectorAll('.mood-grid .option-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mood-grid .option-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMood = btn.dataset.mood;
            });
        });

        document.querySelectorAll('.category-grid .option-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.category-grid .option-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
            });
        });

        function getFilteredIdeas() {
            return ideas.filter(idea => {
                const moodMatch = idea.mood === currentMood;
                const categoryMatch = currentCategory === 'all' || idea.category === currentCategory;
                return moodMatch && categoryMatch;
            });
        }

        function renderIdea(idea) {
            currentIdea = idea;
            const card = document.getElementById('resultCard');
            card.classList.remove('hidden');
            card.classList.remove('animate-pop');
            void card.offsetWidth;
            card.classList.add('animate-pop');

            document.getElementById('resultIcon').textContent = idea.icon;
            document.getElementById('resultTitle').textContent = idea.title;
            document.getElementById('resultDesc').textContent = idea.desc;
            document.getElementById('resultTags').innerHTML = idea.tags.map(t => `<span class="tag">${t}</span>`).join('');
        }

        document.getElementById('generateBtn').addEventListener('click', () => {
            const filtered = getFilteredIdeas();
            if (filtered.length === 0) {
                alert('这个组合暂时没有灵感，换个心情或类型试试～');
                return;
            }
            const idea = filtered[Math.floor(Math.random() * filtered.length)];
            renderIdea(idea);
        });

        document.getElementById('favBtn').addEventListener('click', () => {
            if (!currentIdea) return;
            if (favorites.some(f => f.title === currentIdea.title)) {
                alert('已经收藏过啦！');
                return;
            }
            favorites.push(currentIdea);
            localStorage.setItem('weekendFavs', JSON.stringify(favorites));
            renderFavorites();
        });

        document.getElementById('planBtn').addEventListener('click', () => {
            if (!currentIdea) return;
            if (plans.some(p => p.title === currentIdea.title)) {
                alert('已经加入计划啦！');
                return;
            }
            plans.push(currentIdea);
            localStorage.setItem('weekendPlans', JSON.stringify(plans));
            renderPlans();
        });

        function createItemHtml(item, type, index) {
            return `
                <div class="favorite-item">
                    <button class="remove-fav" onclick="remove${type}(${index})">×</button>
                    <div class="fav-icon">${item.icon}</div>
                    <div class="fav-title">${item.title}</div>
                    <div class="fav-desc">${item.desc}</div>
                </div>
            `;
        }

        function renderFavorites() {
            const list = document.getElementById('favList');
            if (favorites.length === 0) {
                list.innerHTML = '<div class="empty-tip">收藏的灵感会出现在这里</div>';
                return;
            }
            list.innerHTML = favorites.map((f, i) => createItemHtml(f, 'Fav', i)).join('');
        }

        function renderPlans() {
            const list = document.getElementById('planList');
            if (plans.length === 0) {
                list.innerHTML = '<div class="empty-tip">还没有计划，去生成一个灵感吧～</div>';
                return;
            }
            list.innerHTML = plans.map((p, i) => createItemHtml(p, 'Plan', i)).join('');
        }

        window.removeFav = function(index) {
            favorites.splice(index, 1);
            localStorage.setItem('weekendFavs', JSON.stringify(favorites));
            renderFavorites();
        };

        window.removePlan = function(index) {
            plans.splice(index, 1);
            localStorage.setItem('weekendPlans', JSON.stringify(plans));
            renderPlans();
        };

        renderFavorites();
        renderPlans();
    </script>
</body>
</html>
