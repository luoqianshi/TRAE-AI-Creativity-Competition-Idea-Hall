<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喜怒哀乐 App - 终极多媒体潮流版</title>
    <!-- 引入 Tailwind CSS v4 浏览器运行时 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 引入 FontAwesome 字体图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 适配标准移动端容器，模拟潮流硬核手机壳 */
        .phone-container {
            width: 393px;
            height: 852px;
            border: 6px solid #000000;
            border-radius: 40px;
            position: relative;
            background: #FFFDEB; /* 温暖奶黄底色 */
            box-shadow: 12px 12px 0px 0px #000000; /* 野兽主义标志性硬质投影 */
        }
        /* 顶部真机小刘海 */
        .notch {
            width: 120px;
            height: 24px;
            background: #000000;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }
        .no-scrollbar::-webkit-scrollbar { width: 0px; }
        
        /* 新野兽主义粗边框直角硬质投影 */
        .brutal-card {
            border: 3px solid #000000;
            box-shadow: 4px 4px 0px 0px #000000;
            transition: all 0.15s ease;
        }
        .brutal-card:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px 0px #000000;
        }
        /* 音频律动波纹动画 */
        @keyframes wave {
            0%, 100% { height: 4px; }
            50% { height: 16px; }
        }
        .wave-bar { animation: wave 1s ease-in-out infinite; }
        .wave-bar:nth-child(2) { animation-delay: 0.2s; }
        .wave-bar:nth-child(3) { animation-delay: 0.4s; }
        .wave-bar:nth-child(4) { animation-delay: 0.1s; }
    </style>
</head>
<body class="bg-[#E4DFCE] min-h-screen flex justify-center items-center p-4 antialiased text-black select-none">

    <!-- 潮流真机容器外壳 -->
    <div class="phone-container overflow-hidden flex flex-col">
        <div class="notch"></div>

        <!-- 顶部全黑胶囊滑动导航栏 (Segment Tabs) -->
        <div class="pt-9 px-4 pb-3 bg-[#FFFDEB] border-b-[3px] border-black z-40">
            <div class="flex justify-between items-center mb-3">

                    情绪大厅
                </button>
                <button id="tab-forum" onclick="switchNav('forum')" class="flex-1 text-center py-2 rounded-lg text-white transition-all cursor-pointer">
                    共鸣广场
                </button>
                <button id="tab-publish" onclick="switchNav('publish')" class="flex-1 text-center py-2 rounded-lg text-white transition-all cursor-pointer">

                </button>
            </div>
        </div>

        <!-- 主内容滚动视窗 -->
        <div class="flex-1 overflow-y-auto no-scrollbar p-4 pb-6">
            
            <!-- SECTION 1: 不对称便当盒大厅 (Bento Grid) -->

                </div>

                <!-- 不对称便当盒布局网格 -->
                <div class="grid grid-cols-12 gap-3">

                        <div class="flex justify-between items-start">
                            <span class="text-xs font-black bg-black text-white px-2 py-0.5 rounded">HAPPY</span>
                            <i class="fas fa-smile text-2xl text-orange-600"></i>
                        </div>
                        <div>
                            <h3 class="font-black text-lg">欣喜若狂</h3>
                            <p class="text-[10px] font-bold text-black/60 mt-0.5">快乐就该大声喧哗</p>
                        </div>
                    </div>

                    <!-- 怒 -->
                    <div onclick="switchNav('forum', '怒发冲冠')" class="brutal-card col-span-5 bg-[#FF8B94] rounded-2xl p-4 h-40 flex flex-col justify-between cursor-pointer">
                        <div class="flex justify-between items-start">
                            <span class="text-xs font-black bg-black text-white px-2 py-0.5 rounded">ANGRY</span>
                            <i class="fas fa-fire-alt text-2xl text-red-700"></i>
                        </div>
                        <div>
                            <h3 class="font-black text-base">怒发冲冠</h3>
                            <p class="text-[10px] font-bold text-black/60 mt-0.5">不爽无需再忍</p>
                        </div>
                    </div>

                    <!-- 哀 -->

                        <!-- 媒体挂件生根融合区 -->
                        <div class="flex flex-col gap-2">
                            <!-- 1. 图片画布嵌入挂件 -->
                            <div id="canvas-img-wrapper" class="hidden relative w-full h-32 border-2 border-black rounded-xl overflow-hidden shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
                                <img id="canvas-img-preview" src="" class="w-full h-full object-cover">
                                <button onclick="clearCanvasImage()" class="absolute top-1 right-1 bg-black text-white text-xs w-5 h-5 flex items-center justify-center font-black border-2 border-black rounded hover:bg-red-500 cursor-pointer">×</button>
                            </div>
                            
                            <!-- 2. 音频画布嵌入磁带挂件 -->
                            <div id="canvas-audio-wrapper" class="hidden brutal-card bg-[#FFF44F] p-2 rounded-xl flex items-center justify-between">

                                    <div>
                                        <div class="text-[10px] font-black tracking-wide">CUSTOM_AUDIO.mp3</div>

                                    </div>
                                </div>

                            <!-- 图片附件按钮 -->
                            <label class="w-8 h-8 rounded-lg border-2 border-black bg-white flex items-center justify-center cursor-pointer active:translate-y-0.5 shadow-[1px_1px_0px_0px_rgba(0,0,0,1)] hover:bg-amber-50">
                                <i class="fas fa-image text-xs"></i>
                                <input id="file-image-input" type="file" accept="image/*" class="hidden" onchange="embedImageToCanvas(this)">

                            <label class="w-8 h-8 rounded-lg border-2 border-black bg-white flex items-center justify-center cursor-pointer active:translate-y-0.5 shadow-[1px_1px_0px_0px_rgba(0,0,0,1)] hover:bg-amber-50">

                        </div>

                    </div>
                </div>

                <!-- 发射大按钮 -->
                <button onclick="submitBrutalPost()" class="w-full brutal-card bg-black text-white font-black text-xs py-3.5 rounded-xl hover:bg-zinc-800 transition cursor-pointer">
                    ⚡ 确认上墙（图文声同步发射）
                </button>
            </section>

        </div>
    </div>

    <!-- 全局隐藏式音频驱动核心内核 -->

        // 导航切换模块驱动
        function switchNav(target, filterTag = null) {
            ['hub', 'forum', 'publish'].forEach(p => document.getElementById(`view-${p}`).classList.add('hidden'));
            ['hub', 'forum', 'publish'].forEach(t => {
                document.getElementById(`tab-${t}`).className = "flex-1 text-center py-2 rounded-lg text-white transition-all cursor-pointer";
            });
            document.getElementById(`view-${target}`).classList.remove('hidden');
            document.getElementById(`tab-${target}`).className = "flex-1 text-center py-2 rounded-lg bg-[#FFFDEB] text-black border-2 border-black transition-all cursor-pointer";

            if (target === 'forum') { renderBrutalForum(filterTag); }
        }

        // 图片内嵌沙盒大画布事件
        function embedImageToCanvas(input) {
            if (input.files && input.files[0]) {
                currentImgUrl = URL.createObjectURL(input.files[0]);
                document.getElementById('canvas-img-preview').src = currentImgUrl;
                document.getElementById('canvas-img-wrapper').classList.remove('hidden');
            }
        }
        function clearCanvasImage() {
            document.getElementById('file-image-input').value = "";
            document.getElementById('canvas-img-wrapper').classList.add('hidden');
            currentImgUrl = "";
        }

        // 音频内嵌沙盒大画布事件
        function embedAudioToCanvas(input) {
            if (input.files && input.files[0]) {
                currentAudioUrl = URL.createObjectURL(input.files[0]);
                document.getElementById('canvas-audio-wrapper').classList.remove('hidden');
            }
        }
        function clearCanvasAudio() {
            document.getElementById('file-audio-input').value = "";
            document.getElementById('canvas-audio-wrapper').classList.add('hidden');
            currentAudioUrl = "";
        }

        // 渲染共鸣广场动态墙组件（核心：文字正下方紧贴媒体挂件）
        function renderBrutalForum(filterTag) {
            const container = document.getElementById('brutal-posts-box');
            const label = document.getElementById('current-tag');
            container.innerHTML = '';

            let filtered = filterTag ? brutalData.filter(p => p.tag === filterTag) : brutalData;
            label.innerText = filterTag ? `⚡ ${filterTag} 专区` : `📌 全部实时动态`;

            filtered.forEach(post => {
                let commentsHTML = post.comments.map(c => `<p class="bg-[#FFFDEB] px-2 py-1 rounded border border-black/30 mt-1">⚡ ${c}</p>`).join('');
                
                let audioPlayerHTML = "";
                if (post.audio) {
                    audioPlayerHTML = `
                        <!-- 复古黑客流磁带随身听播放器 -->
                        <div class="brutal-card bg-black text-[#FFF44F] p-3 rounded-xl flex items-center justify-between shadow-[2px_2px_0px_0px_rgba(255,244,79,1)]">
                            <div class="flex items-center gap-3">
                                <button onclick="handlePlayAudio(this, '${post.audio}')" class="w-9 h-9 rounded-full bg-[#FFF44F] text-black flex items-center justify-center border-2 border-black active:scale-95 transition-transform cursor-pointer">
                                    <i class="fas fa-play text-sm btn-play-icon"></i>
                                </button>
                                <div>
                                    <span class="text-[11px] font-black tracking-wider block">ENVIRONMENT SOUNDWAVE</span>
                                    <span class="text-[9px] font-bold text-white/50">点击释放声音波段 🔊</span>
                                </div>
                            </div>
                            <div class="flex items-end gap-0.5 h-4 px-2">
                                <div class="w-0.5 bg-[#FFF44F] wave-bar" style="animation-play-state: paused;"></div>
                                <div class="w-0.5 bg-[#FFF44F] wave-bar" style="animation-play-state: paused;"></div>
                                <div class="w-0.5 bg-[#FFF44F] wave-bar" style="animation-play-state: paused;"></div>
                                <div class="w-0.5 bg-[#FFF44F] wave-bar" style="animation-play-state: paused;"></div>
                            </div>
                        </div>
                    `;
                }

                container.innerHTML += `
                    <div class="brutal-card ${post.colorClass} rounded-2xl p-4 space-y-3 animate-fadeIn">
                        <div class="flex justify-between items-center border-b-2 border-black pb-2">
                            <span class="text-xs font-black flex items-center gap-1"><i class="fas fa-user-astronaut"></i> ${post.user}</span>
                            <span class="text-[10px] font-black bg-black text-white px-2 py-0.5 rounded">${post.tag} · ${post.time}</span>
                        </div>
                        
                        <!-- 1. 核心叙事文字 -->
                        <p class="text-xs font-bold text-black leading-relaxed">${post.text}</p>
                        
                        <!-- 2. 文字正下方挂载配图 -->
                        ${post.img ? `<img src="${post.img}" class="w-full h-40 object-cover rounded-xl border-2 border-black shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">` : ''}
                        
                        <!-- 3. 文字正下方挂载声波播放器 -->
                        ${audioPlayerHTML}
                        
                        <!-- 互动回音墙 -->
                        <div class="bg-white/90 p-2.5 rounded-xl border-2 border-black space-y-2">
                            <div class="text-[10px] font-black tracking-wider flex items-center gap-1"><i class="fas fa-comment-dots"></i> 实时评论墙</div>
                            <div id="brutal-comment-${post.id}" class="space-y-0.5 text-[11px] font-bold text-black/70">
                                ${commentsHTML || '<p class="text-slate-400 text-[10px] italic">暂无共鸣，快来抢沙发...</p>'}
                            </div>
                            <div class="flex gap-1 mt-1">
                                <input id="input-reply-${post.id}" type="text" placeholder="留下一句温暖的共鸣..." class="flex-1 text-[11px] font-bold p-1.5 border-2 border-black rounded-lg focus:outline-none bg-white">
                                <button onclick="addBrutalReply(${post.id})" class="bg-black text-white text-[10px] font-black px-3 rounded-lg border-2 border-black cursor-pointer active:scale-95">回应</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // 音频播放内核流控制器
        function handlePlayAudio(btn, audioSrc) {
            const driver = document.getElementById('global-audio-driver');
            const icon = btn.querySelector('.btn-play-icon');
            const waveBars = btn.closest('.brutal-card').querySelectorAll('.wave-bar');

            if (playingAudioUrl === audioSrc) {
                if (!driver.paused) {
                    driver.pause();
                    icon.className = "fas fa-play text-sm btn-play-icon";
                    waveBars.forEach(b => b.style.animationPlayState = "paused");
                } else {
                    driver.play();
                    icon.className = "fas fa-pause text-sm btn-play-icon";
                    waveBars.forEach(b => b.style.animationPlayState = "running");
                }
                return;
            }

            document.querySelectorAll('.btn-play-icon').forEach(i => i.className = "fas fa-play text-sm btn-play-icon");
            document.querySelectorAll('.wave-bar').forEach(b => b.style.animationPlayState = "paused");

            driver.src = audioSrc;
            driver.play();
            playingAudioUrl = audioSrc;
            icon.className = "fas fa-pause text-sm btn-play-icon";
            waveBars.forEach(b => b.style.animationPlayState = "running");

            driver.onended = () => {
                icon.className = "fas fa-play text-sm btn-play-icon";
                waveBars.forEach(b => b.style.animationPlayState = "paused");
                playingAudioUrl = "";
            };
        }

        // 同步发射多媒体数据闭环
        function submitBrutalPost() {
            const selectedMood = document.querySelector('input[name="mood-brutal"]:checked').value;
            const contentArea = document.getElementById('input-content');
            const content = contentArea.value.trim();

            if (!content) {
                alert('画布里还没有写下心里话哦！');
                return;
            }

            const colorMap = { '欣喜若狂': 'bg-[#FFD3B6]', '怒发冲冠': 'bg-[#FF8B94]', '悲痛欲绝': 'bg-[#Dcedc1]', '怡然自得': 'bg-[#A8DADC]' };

            const newBrutalPost = {
                id: Date.now(),
                tag: selectedMood,
                colorClass: colorMap[selectedMood],
                user: '先锋图文声创作者',
                time: '刚刚',
                text: content,
                img: currentImgUrl,      
                audio: currentAudioUrl,  
                comments: []
            };

            brutalData.unshift(newBrutalPost);
            
            contentArea.value = ''; 
            clearCanvasImage();
            clearCanvasAudio();
            
            switchNav('forum'); 
        }

        // 评论墙交互追加
        function addBrutalReply(id) {
            const replyInput = document.getElementById(`input-reply-${id}`);
            const text = replyInput.value.trim();
            if (!text) return;
            const post = brutalData.find(p => p.id === id);
            if (post) {
                post.comments.push(text);
                const curTagText = document.getElementById('current-tag').innerText;
                const filter = curTagText === '📌 全部实时动态' ? null : curTagText.replace('⚡ ', '').replace(' 专区', '');
                renderBrutalForum(filter);
            }
            replyInput.value = '';
        }

        // 页面启动首发加载
        window.onload = () => { renderBrutalForum(); }
    </script>
</body>
</html>
