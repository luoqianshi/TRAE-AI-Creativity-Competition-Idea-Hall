<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>薪火 · 非遗AI数字化平台</title>
<script src="https://cdn.tailwindcss.com/3.4.1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a0a0f;
    --ink-light: #141420;
    --ink-mid: #1e1e30;
    --gold: #C9A96E;
    --gold-light: #D4B87A;
    --gold-dim: #8B7355;
    --jade: #5B8C5A;
    --jade-light: #7AB87A;
    --vermilion: #C45C4A;
    --vermilion-bright: #E85D4A;
    --cream: #F5F0E8;
    --text-primary: #E8E0D5;
    --text-secondary: #9A9288;
    --text-dim: #6B6560;
    --border-subtle: rgba(201,169,110,0.15);
    --border-gold: rgba(201,169,110,0.35);
    --shadow-gold: 0 0 40px rgba(201,169,110,0.08);
    --shadow-vermilion: 0 0 30px rgba(196,92,74,0.15);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --radius-xl: 24px;
    --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
    background: var(--ink);
    color: var(--text-primary);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* Ink texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(201,169,110,0.03) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 60%, rgba(91,140,90,0.03) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(196,92,74,0.02) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }
  /* Noise texture */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.02'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }
  #root { position: relative; z-index: 1; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--ink-light); }
  ::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

  /* Animations */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes pulse-gold {
    0%, 100% { box-shadow: 0 0 0 0 rgba(201,169,110,0.4); }
    50% { box-shadow: 0 0 0 12px rgba(201,169,110,0); }
  }
  @keyframes pulse-vermilion {
    0%, 100% { box-shadow: 0 0 0 0 rgba(232,93,74,0.5); }
    50% { box-shadow: 0 0 0 16px rgba(232,93,74,0); }
  }
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  @keyframes inkReveal {
    from { clip-path: inset(0 100% 0 0); }
    to { clip-path: inset(0 0 0 0); }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
  }
  @keyframes slideRight {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes dotPulse {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }
  @keyframes brushStroke {
    0% { width: 0; opacity: 0; }
    30% { opacity: 1; }
    100% { width: 100%; opacity: 0.6; }
  }
  @keyframes inkRise {
    0% { transform: translateY(0) scale(0); opacity: 0.8; }
    60% { opacity: 0.3; }
    100% { transform: translateY(-120px) scale(1.2); opacity: 0; }
  }
  @keyframes inkDrift {
    0% { transform: translate(0,0) rotate(0deg); opacity: 0; }
    20% { opacity: 0.5; }
    80% { opacity: 0.5; }
    100% { transform: translate(60px,-80px) rotate(20deg); opacity: 0; }
  }
  @keyframes borderSweep {
    0% { background-position: 0% 0%; }
    25% { background-position: 100% 0%; }
    50% { background-position: 100% 100%; }
    75% { background-position: 0% 100%; }
    100% { background-position: 0% 0%; }
  }
  @keyframes borderSweep2 {
    0% { background-position: 100% 100%; }
    25% { background-position: 0% 100%; }
    50% { background-position: 0% 0%; }
    75% { background-position: 100% 0%; }
    100% { background-position: 100% 100%; }
  }
  @keyframes breatheGlow {
    0%, 100% { box-shadow: 0 0 15px rgba(201,169,110,0.05), 0 0 30px rgba(201,169,110,0.02); }
    50% { box-shadow: 0 0 25px rgba(201,169,110,0.12), 0 0 60px rgba(201,169,110,0.06); }
  }
  @keyframes breatheGlowJade {
    0%, 100% { box-shadow: 0 0 15px rgba(91,140,90,0.05), 0 0 30px rgba(91,140,90,0.02); }
    50% { box-shadow: 0 0 25px rgba(91,140,90,0.12), 0 0 60px rgba(91,140,90,0.06); }
  }
  @keyframes breatheGlowBlue {
    0%, 100% { box-shadow: 0 0 15px rgba(100,149,237,0.05), 0 0 30px rgba(100,149,237,0.02); }
    50% { box-shadow: 0 0 25px rgba(100,149,237,0.12), 0 0 60px rgba(100,149,237,0.06); }
  }
  @keyframes breatheGlowVermilion {
    0%, 100% { box-shadow: 0 0 15px rgba(232,93,74,0.05), 0 0 30px rgba(232,93,74,0.02); }
    50% { box-shadow: 0 0 25px rgba(232,93,74,0.12), 0 0 60px rgba(232,93,74,0.06); }
  }
  @keyframes springIn {
    0% { opacity: 0; transform: scale(0.6) translateY(20px); }
    60% { transform: scale(1.04) translateY(-4px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes radarSweep {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  @keyframes gentleRise {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes subtlePulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }
  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes progressPulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.4); }
  }

  .animate-fade-in-up { animation: fadeInUp 0.6s var(--transition-smooth) both; }
  .animate-fade-in { animation: fadeIn 0.8s var(--transition-smooth) both; }
  .animate-shimmer {
    background: linear-gradient(90deg, transparent, rgba(201,169,110,0.08), transparent);
    background-size: 200% 100%;
    animation: shimmer 2s infinite;
  }
  .animate-float { animation: float 3s ease-in-out infinite; }
  .animate-pulse-gold { animation: pulse-gold 2s infinite; }
  .animate-pulse-vermilion { animation: pulse-vermilion 2s infinite; }
  .animate-spring-in { animation: springIn 0.6s var(--transition-smooth) both; }
  .animate-scale-in { animation: scaleIn 0.5s var(--transition-smooth) both; }
  .animate-breathe { animation: breatheGlow 3s ease-in-out infinite; }
  .animate-breathe-jade { animation: breatheGlowJade 3s ease-in-out infinite; }
  .animate-breathe-blue { animation: breatheGlowBlue 3s ease-in-out infinite; }
  .animate-breathe-vermilion { animation: breatheGlowVermilion 3s ease-in-out infinite; }
  .animate-progress { animation: progressPulse 2s ease-in-out infinite; }

  /* Card styles */
  .card-ink {
    background: var(--ink-light);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    backdrop-filter: blur(12px);
    transition: all 0.4s var(--transition-smooth);
  }
  .card-ink:hover {
    border-color: var(--border-gold);
    box-shadow: var(--shadow-gold);
    transform: translateY(-2px);
  }
  .card-glass {
    background: rgba(20,20,40,0.6);
    border: 1px solid rgba(201,169,110,0.12);
    border-radius: var(--radius-lg);
    backdrop-filter: blur(20px);
  }
  .gold-border {
    border: 1px solid var(--border-gold);
  }
  .gold-text {
    background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dim));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .gold-gradient {
    background: linear-gradient(135deg, rgba(201,169,110,0.15), rgba(201,169,110,0.05));
  }
  .vermilion-gradient {
    background: linear-gradient(135deg, rgba(196,92,74,0.2), rgba(196,92,74,0.05));
  }

  /* Nav */
  .nav-link {
    position: relative;
    color: var(--text-secondary);
    transition: color 0.3s;
    cursor: pointer;
    font-size: 0.9rem;
    letter-spacing: 0.05em;
  }
  .nav-link:hover, .nav-link.active {
    color: var(--gold-light);
  }
  .nav-link::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 0;
    height: 1px;
    background: var(--gold);
    transition: width 0.3s var(--transition-smooth);
  }
  .nav-link:hover::after, .nav-link.active::after {
    width: 100%;
  }

  /* Upload zone */
  .upload-zone {
    border: 2px dashed rgba(201,169,110,0.25);
    border-radius: var(--radius-lg);
    transition: all 0.4s var(--transition-smooth);
    cursor: pointer;
  }
  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--gold);
    background: rgba(201,169,110,0.05);
    box-shadow: var(--shadow-gold);
  }

  /* Chat */
  .chat-bubble-user {
    background: rgba(201,169,110,0.1);
    border: 1px solid rgba(201,169,110,0.2);
    border-radius: var(--radius-lg) var(--radius-lg) 4px var(--radius-lg);
  }
  .chat-bubble-ai {
    background: var(--ink-mid);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg) var(--radius-lg) var(--radius-lg) 4px;
  }

  /* Timeline */
  .timeline-line {
    position: absolute;
    left: 15px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: linear-gradient(to bottom, var(--gold), var(--gold-dim), transparent);
  }
  .timeline-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 12px rgba(201,169,110,0.5);
  }

  /* Map marker */
  .map-marker-high { animation: pulse-vermilion 2s infinite; }
  .map-marker-medium { animation: pulse-gold 2.5s infinite; }
  .map-marker-low { animation: dotPulse 3s infinite; }

  /* Tab */
  .tab-btn {
    padding: 0.6rem 1.5rem;
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    color: var(--text-secondary);
    transition: all 0.3s;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .tab-btn:hover { color: var(--text-primary); }
  .tab-btn.active {
    color: var(--gold-light);
    background: rgba(201,169,110,0.1);
    border-color: rgba(201,169,110,0.25);
  }

  /* Progress bar */
  .progress-bar {
    height: 4px;
    background: var(--ink-mid);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    border-radius: 4px;
    transition: width 0.5s var(--transition-smooth);
  }

  /* Stat card number animation */
  .stat-number {
    font-family: 'Noto Serif SC', serif;
    font-weight: 700;
    background: linear-gradient(135deg, var(--text-primary), var(--gold-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* Banner carousel */
  .carousel-slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 1.5s var(--transition-smooth);
  }
  .carousel-slide.active { opacity: 1; }

  /* Graph container */
  .graph-container { width: 100%; height: 400px; }
  .map-container { width: 100%; height: 500px; }

  @keyframes countUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  @keyframes dashFlow { to { stroke-dashoffset:-40; } }
  @keyframes titleGlow { 0%,100% { text-shadow:0 0 40px rgba(201,169,110,0.3),0 0 80px rgba(201,169,110,0.1); } 50% { text-shadow:0 0 60px rgba(201,169,110,0.5),0 0 120px rgba(201,169,110,0.2); } }
  @keyframes widthGrow { from { width:0; } }
  .hero-title { animation:titleGlow 4s ease-in-out infinite; font-family:'Noto Serif SC',serif; font-weight:900; letter-spacing:0.2em; line-height:1; }
  .process-line-animated { stroke-dasharray:8 4; animation:dashFlow 1s linear infinite; }
  .feature-card-large { background:var(--ink-light); border:1px solid var(--border-subtle); border-radius:var(--radius-xl); transition:all .5s var(--transition-smooth); cursor:pointer; overflow:hidden; position:relative; }
  .feature-card-large:hover { border-color:var(--border-gold); box-shadow:0 20px 60px rgba(0,0,0,.4),0 0 80px rgba(201,169,110,.06); transform:translateY(-4px); }
  .feature-icon-wrapper { width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.6rem; }
  .stat-bar { height:3px;border-radius:3px;animation:widthGrow 1.5s var(--transition-smooth) forwards; }
  .demo-step { position:relative;padding:1.5rem;background:var(--ink-light);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);transition:all .4s var(--transition-smooth); }
  .demo-step:hover { border-color:var(--border-gold);box-shadow:var(--shadow-gold); }
  .demo-connector { width:2px;height:24px;background:linear-gradient(to bottom,var(--gold),var(--gold-dim));margin:0 auto; }
  .section-divider { width:60px;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold-dim),transparent);margin:0 auto; }
  .accent-dot { width:6px;height:6px;border-radius:50%;background:var(--gold);display:inline-block;margin-right:.5rem;box-shadow:0 0 8px rgba(201,169,110,.5); }
  .hover-lift { transition:transform .4s var(--transition-smooth),box-shadow .4s var(--transition-smooth); }
  .hover-lift:hover { transform:translateY(-6px);box-shadow:0 24px 48px rgba(0,0,0,.4),0 0 60px rgba(201,169,110,.05); }

  /* Border sweep for feature entry cards */
  .feature-entry-card {
    position: relative;
    overflow: hidden;
  }
  .feature-entry-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(135deg, transparent 30%, rgba(201,169,110,0.3) 50%, transparent 70%);
    background-size: 300% 300%;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0;
    transition: opacity 0.5s;
    animation: none;
  }
  .feature-entry-card:hover::before {
    opacity: 1;
    animation: borderSweep 2s linear infinite;
  }
  .feature-entry-card-2::before { background: linear-gradient(135deg, transparent 30%, rgba(91,140,90,0.3) 50%, transparent 70%); background-size: 300% 300%; }
  .feature-entry-card-3::before { background: linear-gradient(135deg, transparent 30%, rgba(100,149,237,0.3) 50%, transparent 70%); background-size: 300% 300%; }
  .feature-entry-card-4::before { background: linear-gradient(135deg, transparent 30%, rgba(232,93,74,0.3) 50%, transparent 70%); background-size: 300% 300%; }
  .feature-entry-card-5::before { background: linear-gradient(135deg, transparent 30%, rgba(175,105,238,0.3) 50%, transparent 70%); background-size: 300% 300%; }

  /* Card hover inner glow reveal */
  .card-ink { position: relative; }
  .card-ink::after {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: inherit;
    background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(201,169,110,0.08) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
    z-index: 0;
  }
  .card-ink:hover::after { opacity: 1; }

  /* ====== MOBILE RESPONSIVE ====== */
  @media (max-width: 768px) {
    .nav-desktop-links { display: none !important; }
    .nav-hamburger { display: flex !important; }
    .nav-brand { font-size: 1.2rem !important; }
    .mobile-drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: 280px; z-index: 200;
      background: rgba(14,14,24,0.98); backdrop-filter: blur(30px);
      border-left: 1px solid rgba(201,169,110,0.15);
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; flex-direction: column; padding: 5rem 2rem 2rem; gap: 0.3rem;
    }
    .mobile-drawer.open { transform: translateX(0); }
    .mobile-drawer-overlay {
      position: fixed; inset: 0; z-index: 199; background: rgba(0,0,0,0.6);
      opacity: 0; pointer-events: none; transition: opacity 0.35s;
    }
    .mobile-drawer-overlay.open { opacity: 1; pointer-events: auto; }
    .mobile-nav-link {
      display: block; padding: 0.9rem 1rem; color: #9A9288; font-size: 0.95rem;
      border-radius: 8px; cursor: pointer; transition: all 0.3s; letter-spacing: 0.05em;
      border-bottom: 1px solid rgba(201,169,110,0.06);
    }
    .mobile-nav-link:hover, .mobile-nav-link.mobile-active { color: #C9A96E; background: rgba(201,169,110,0.06); }
    .hero-title { font-size: 3rem !important; letter-spacing: 0.12em !important; }
    .hero-subtitle { font-size: 0.95rem !important; }
    .hero-feature-cards { flex-direction: column !important; align-items: center !important; }
     .hero-feature-cards > div { max-width: 340px !important; min-width: auto !important; flex: none !important; width: 100% !important; }
    section { padding-left: 1rem !important; padding-right: 1rem !important; }
    .stats-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 0.8rem !important; }
    .stats-grid .stat-number { font-size: 1.6rem !important; }
    .process-flow-row { flex-direction: column !important; align-items: center !important; gap: 0.5rem !important; }
    .process-flow-row svg { transform: rotate(90deg); }
    .feature-card-inner { flex-direction: column !important; gap: 1.5rem !important; text-align: center !important; }
    .feature-card-inner > div:first-child { width: 140px !important; height: 120px !important; min-width: auto !important; margin: 0 auto !important; font-size: 2.8rem !important; }
    .feature-highlights { justify-content: center !important; }
    .demo-grid { grid-template-columns: 1fr 1fr !important; gap: 0.6rem !important; }
    .urgency-text { font-size: 1.15rem !important; }
    footer { padding: 3rem 1.5rem 2rem !important; }
    footer blockquote { padding: 1rem 1.2rem !important; }
    footer blockquote p { font-size: 0.9rem !important; }
    .dl-two-col { grid-template-columns: 1fr !important; }
    .graph-container { height: 300px !important; }
    .assistant-chat { height: 55vh !important; min-height: 380px !important; }
    .roadmap-form-grid { grid-template-columns: 1fr !important; }
    .risk-two-col { grid-template-columns: 1fr !important; }
    .risk-map-wrapper { height: 360px !important; }
    .map-container { height: 320px !important; }
    .section-title { font-size: 1.4rem !important; }
     .chat-bubble-user, .chat-bubble-ai { max-width: 92% !important; }
     .tab-btn { padding: 0.5rem 1rem !important; font-size: 0.78rem !important; }
     section:first-of-type { padding-top: 1rem !important; }
     .feature-entry-card::before { display: none !important; }
     .inkwash-bg { opacity: 0.15 !important; filter: blur(15px) !important; }
     .card-expanded-demo.expanded { max-height: 800px !important; }
     .review-card { padding: 0.8rem !important; }
     .pattern-card { min-width: 140px !important; }
     .risk-two-col { grid-template-columns: 1fr !important; }
     .risk-map-wrapper { height: auto !important; }
     .hero-feature-cards { gap: 0.5rem !important; }
     .hero-feature-cards > div { padding: 1rem 0.9rem !important; }
     .dl-dialect-cols { grid-template-columns: 1fr !important; }
  }
  @media (max-width: 480px) {
    .stats-grid { grid-template-columns: 1fr 1fr !important; gap: 0.5rem !important; }
    .demo-grid { grid-template-columns: 1fr !important; }
    .hero-title { font-size: 2.5rem !important; }
  }

  /* Card expansion demo */
  .card-expanded-demo {
    overflow: hidden;
    transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s 0.1s, margin 0.5s;

// ==================== SCROLL REVEAL COMPONENT ====================
const ScrollReveal = ({ children, delay = 0, className = '' }) => {
  const [visible, setVisible] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { setVisible(true); obs.unobserve(el); }
    }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);

  return (
    <div ref={ref} className={className} style={{
      opacity: visible ? 1 : 0,
      transform: visible ? 'translateY(0)' : 'translateY(30px)',
      transition: `all 0.7s ${delay}ms cubic-bezier(0.4, 0, 0.2, 1)`,
    }}>{children}</div>
  );
};

// ==================== INK PARTICLE COMPONENT ====================
const InkParticles = ({ count = 15, colors = ['rgba(201,169,110,0.25)'] }) => {
  const particles = useMemo(() =>
    Array.from({ length: count }, (_, i) => ({
      id: i,
      left: Math.random() * 100,
      size: 2 + Math.random() * 5,
      delay: Math.random() * 6,
      duration: 3 + Math.random() * 5,
      color: colors[Math.floor(Math.random() * colors.length)],
      xDrift: (Math.random() - 0.5) * 80,
    })), [count]);

  return (
    <div style={{ position: 'absolute', inset: 0, overflow: 'hidden', pointerEvents: 'none', zIndex: 1 }}>
      {particles.map(p => (
        <div key={p.id} style={{
          position: 'absolute', bottom: '-10px', left: `${p.left}%`,
          width: `${p.size}px`, height: `${p.size}px`, borderRadius: '50%',
          background: p.color,
          animation: `inkRise ${p.duration}s ${p.delay}s infinite ease-out`,
        }}/>
      ))}
    </div>
  );
};

const StatCard = ({ stat, visible, index }) => {
  const [displayVal, setDisplayVal] = useState(0);

  useEffect(() => {
    if (!visible) return;
    const target = parseInt(stat.value.replace(/,/g,''));
    let start = 0;
    const duration = 1500;
    const step = Math.max(1, Math.ceil(target / (duration / 16)));
    const timer = setInterval(() => {
      start += step;
      if (start >= target) { setDisplayVal(target); clearInterval(timer); }
      else { setDisplayVal(start); }
    }, 16);
    return () => clearInterval(timer);
  }, [visible]);

  const breatheClasses = ['animate-breathe', 'animate-breathe-jade', 'animate-breathe-blue', 'animate-breathe-vermilion', 'animate-breathe-vermilion'];

  return (
    <div className={`card-ink hover-lift ${breatheClasses[index]}`} style={{
      padding:'1.8rem', textAlign:'center',
      animation:`scaleIn 0.6s ${0.12*index}s cubic-bezier(0.4, 0, 0.2, 1) both`,
    }}>
      <div style={{ fontSize:'2.2rem', marginBottom:'0.8rem', filter:'grayscale(0.15)' }}>{stat.icon}</div>
      <div className="stat-number" style={{ fontSize:'2.5rem', marginBottom:'0.3rem' }}>
        {displayVal.toLocaleString()}<span style={{ fontSize:'0.85rem', color:'#9A9288', fontWeight:400 }}>{stat.suffix}</span>
      </div>
      <div style={{ color:'#E8E0D5', fontSize:'0.95rem', fontWeight:500, marginBottom:'0.3rem' }}>{stat.label}</div>
      <div style={{ color:'#6B6560', fontSize:'0.75rem', marginBottom:'0.8rem' }}>{stat.desc}</div>
      <div className="progress-bar">
        <div className="stat-bar animate-progress" style={{ width:visible?stat.bar:'0%', background:stat.color }}/>
      </div>
    </div>
  );
};

  };

  const handleDrop = useCallback((e) => {
    e.preventDefault();
    setIsDragging(false);
    const files = Array.from(e.dataTransfer.files);

      const newFiles = files.map(f => ({
        name: f.name,
        type: f.type.startsWith('video') ? 'video' : f.type.startsWith('audio') ? 'audio' : f.type.startsWith('image') ? 'image' : 'text',
        size: f.size,
        progress: 0,
        id: Date.now() + Math.random(),
      }));
      setUploadedFiles(prev => [...prev, ...newFiles]);
      simulateUpload(newFiles);
    }
  }, []);

  const simulateUpload = (files) => {
    files.forEach(file => {
      let progress = 0;
      const interval = setInterval(() => {
        progress += Math.random() * 15;
        if (progress >= 100) {
          progress = 100;
          clearInterval(interval);
          setUploadedFiles(prev => prev.map(f => f.id === file.id ? { ...f, progress: 100 } : f));
          startAnalysis();
        } else {
          setUploadedFiles(prev => prev.map(f => f.id === file.id ? { ...f, progress } : f));
        }
      }, 300);
    });
  };

  const startAnalysis = () => {
    setAnalyzing(true);
    setTimeout(() => {
      setAnalyzing(false);
      setAnalysisDone(true);
    }, 3000);
  };

                    background:`${DIALECTS.find(d=>d.id===dialect)?.color}10`,
                    border:`1px solid ${DIALECTS.find(d=>d.id===dialect)?.color}25`,

                    <h5 style={{ color: '#C9A96E', marginTop: '1.5rem', marginBottom: '0.5rem' }}>一、技艺概述</h5>
                    <p style={{ color: '#9A9288' }}>{selectedTechnique}是中国传统非物质文化遗产的重要组成部分，承载着丰富的文化内涵和精湛的手工技艺。</p>

                        <div style={{ color: '#E8E0D5', fontWeight: 500 }}>Q: {qa.q}</div>

            🎨 提取的纹样/图案
          </h3>
          <p style={{ color:'#9A9288', fontSize:'0.85rem', lineHeight:1.7, marginBottom:'1.5rem', maxWidth:'800px' }}>
            AI从上传的视频帧和手稿中自动提取传统纹样矢量图，支持多种风格迁移。
            这不是随机换色——每一版本都基于同一纹样源进行AI风格迁移，标注知识节点来源。
          </p>

          {/* Pattern cards */}
          {(() => {
            const patterns = MOCK_PATTERN_DATA[selectedTechnique] || MOCK_PATTERN_DATA['广绣'];
            if (!activePattern && patterns.length > 0) {
              setTimeout(() => setActivePattern(patterns[0]), 0);
            }

            const patternColors = {
              original: { bg:'#1a1a2e', border:'#C9A96E', icon:'🔒' },
              minimal: { bg:'#0f0f18', border:'#9A9288', icon:'✏️' },
              cyber: { bg:'#0a1020', border:'#00FFD1', icon:'🌆' },
              inkwash: { bg:'#12100e', border:'#8B7355', icon:'🖌️' },
              guochao: { bg:'#150a15', border:'#E85D4A', icon:'🎨' },

              <div>

                <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(180px, 1fr))', gap:'1rem', marginBottom:'1.5rem' }}>

                    <div key={i} className="pattern-card" onClick={() => { setActivePattern(p); setStyleGenerated(false); }} style={{ padding:'1rem', borderColor: activePattern && activePattern.id === p.id ? 'rgba(201,169,110,0.5)' : undefined }}>
                      <div style={{ width:'100%', height:'100px', background: activePattern && activePattern.id === p.id?'rgba(201,169,110,0.06)':'rgba(20,20,40,0.4)', borderRadius:'8px', marginBottom:'0.8rem', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'2.5rem', opacity:0.6 }}>

                      </div>
                      <div style={{ color:'#E8E0D5', fontSize:'0.85rem', fontWeight:600, marginBottom:'0.3rem' }}>{p.name}</div>
                      <div style={{ color:'#6B6560', fontSize:'0.7rem', lineHeight:1.4, marginBottom:'0.5rem' }}>{p.desc}</div>
                      <span className="source-badge" style={{ fontSize:'0.65rem' }}>📎 来源：{p.source}</span>
                    </div>
                  ))}
                </div>

                {/* Active pattern + style transfer */}
                {activePattern && (
                <div className="card-ink" style={{ padding:'1.5rem' }}>
                  <div style={{ display:'flex', gap:'1.5rem', flexWrap:'wrap' }}>

                    <div style={{ flex:'0 0 280px', minWidth:'240px' }}>
                      <div style={{ fontSize:'0.75rem', color:'#6B6560', marginBottom:'0.5rem' }}>
                        当前纹样：<span style={{ color:'#C9A96E' }}>{activePattern.name}</span>
                      </div>
                      <div style={{ width:'100%', aspectRatio:'1', background: (patternColors[activeStyle] || patternColors.original).bg, borderRadius:'12px', border:`2px solid ${(patternColors[activeStyle] || patternColors.original).border}`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:'4rem', opacity:0.5, transition:'all 0.5s' }}>
                        {styleGenerated ? (patternColors[activeStyle] || patternColors.original).icon : '🏷️'}
                      </div>
                      <div style={{ marginTop:'0.8rem' }}>
                        <span className="source-badge">📎 基于知识节点 {activePattern.source} 提取</span>

                    <div style={{ flex:1, minWidth:'260px' }}>

                        风格迁移
                      </div>
                      <div style={{ display:'flex', flexWrap:'wrap', gap:'0.5rem', marginBottom:'1rem' }}>
                        {STYLE_TRANSFER_STYLES.map(st => (
                          <button key={st.id} className={`style-btn ${activeStyle === st.id ? 'active' : ''}`}
                            onClick={() => { setActiveStyle(st.id); setStyleGenerated(true); }}
                            style={activeStyle === st.id ? { borderColor:st.color, color:st.color, background:`${st.color}15` } : {}}
                          >
                            {st.icon} {st.name}
                          </button>
                        ))}
                      </div>
                      <div style={{ color:'#6B6560', fontSize:'0.78rem', lineHeight:1.6, marginBottom:'1rem' }}>
                        {STYLE_TRANSFER_STYLES.find(s => s.id === activeStyle)?.desc}
                      </div>
                      <div style={{ display:'flex', gap:'0.5rem', flexWrap:'wrap' }}>
                        <button style={{ padding:'0.5rem 1.2rem', background:'rgba(201,169,110,0.1)', border:'1px solid rgba(201,169,110,0.3)', borderRadius:'8px', color:'#C9A96E', cursor:'pointer', fontSize:'0.8rem', transition:'all 0.3s' }}
                          onMouseEnter={e=>{e.currentTarget.style.background='rgba(201,169,110,0.2)';}}
                          onMouseLeave={e=>{e.currentTarget.style.background='rgba(201,169,110,0.1)';}}
                        >⬇ 下载</button>
                        <button style={{ padding:'0.5rem 1.2rem', background:'rgba(91,140,90,0.1)', border:'1px solid rgba(91,140,90,0.3)', borderRadius:'8px', color:'#7AB87A', cursor:'pointer', fontSize:'0.8rem', transition:'all 0.3s' }}
                          onMouseEnter={e=>{e.currentTarget.style.background='rgba(91,140,90,0.2)';}}
                          onMouseLeave={e=>{e.currentTarget.style.background='rgba(91,140,90,0.1)';}}
                        >🖼️ 应用到海报</button>
                        <button style={{ padding:'0.5rem 1.2rem', background:'rgba(100,149,237,0.1)', border:'1px solid rgba(100,149,237,0.3)', borderRadius:'8px', color:'#6495ED', cursor:'pointer', fontSize:'0.8rem', transition:'all 0.3s' }}
                          onMouseEnter={e=>{e.currentTarget.style.background='rgba(100,149,237,0.2)';}}
                          onMouseLeave={e=>{e.currentTarget.style.background='rgba(100,149,237,0.1)';}}
                        >📱 手机壁纸</button>
                      </div>
                      <div style={{ marginTop:'1rem' }}>
                        <span style={{ display:'inline-flex', alignItems:'center', gap:'0.3rem', color:'#6B6560', fontSize:'0.7rem' }}>
                          <span style={{ color:'#C9A96E' }}>💡</span> 
                          纹样由AI从{selectedTechnique}知识库自动提取，风格迁移保持原始纹样结构不变
                        </span>
                      </div>
                    </div>
                  </div>
                </div>
                )}
              </div>
            );
          })()}
        </div>
      </div>
    </div>
  );
};

// ==================== ASSISTANT PAGE ====================
const AssistantPage = () => {
  const [technique, setTechnique] = useState('广绣');
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const chatEndRef = useRef(null);

  useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

  const handleSend = (text) => {
    const question = text || input.trim();
    if (!question) return;
    setMessages(prev => [...prev, { role: 'user', content: question }]);
    setInput('');
    setLoading(true);
    setTimeout(() => {
      const qaList = MOCK_QA[technique] || [];
      const match = qaList.find(qa => qa.q === question);
      if (match) {
        setMessages(prev => [...prev, { role: 'ai', content: match.a, sources: match.sources }]);
      } else {
        setMessages(prev => [...prev, {
          role: 'ai',
          content: `关于"${question}"，根据当前知识库中的资料，我目前掌握的信息有限。建议您尝试其他相关问题，或上传更多关于${technique}的资料来丰富知识库。`,
          sources: [],
        }]);
      }
      setLoading(false);
    }, 1500 + Math.random() * 1000);
  };

  const handleKeyDown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } };

  return (
    <div style={{ paddingTop: '80px', minHeight: '100vh' }}>
      <div style={{ maxWidth: '900px', margin: '0 auto', padding: '0 2rem' }}>
        <h2 className="section-title" style={{

const RiskMapPage = () => {
  const mapRef = useRef(null);
  const chartInstance = useRef(null);
  const [selectedProject, setSelectedProject] = useState(null);
  const [detailVisible, setDetailVisible] = useState(false);
  const [selectedItem, setSelectedItem] = useState(null);
  const [timelineYear, setTimelineYear] = useState(5);
  const [riskTab, setRiskTab] = useState('map');

  useEffect(() => {
    if (mapRef.current) {
      if (chartInstance.current) chartInstance.current.dispose();
      const chart = echarts.init(mapRef.current);
      echarts.registerMap('guangdong', SIMPLIFIED_GD_GEOJSON);

      const scatterData = RISK_DATA.map(d => ({
        name: d.name,
        value: [d.lng, d.lat, d.risk === 'high' ? 3 : d.risk === 'medium' ? 2 : 1],
        risk: d.risk,
        city: d.city,
        inheritorCount: d.inheritorCount,
        avgAge: d.avgAge,
        completeness: d.completeness,
        desc: d.desc,
      }));

      chart.setOption({
        backgroundColor: 'transparent',
        tooltip: {
          trigger: 'item',
          backgroundColor: 'rgba(20,20,40,0.95)',
          borderColor: '#C9A96E',
          textStyle: { color: '#E8E0D5' },
          formatter: (params) => {
            if (params.seriesType === 'effectScatter' || params.seriesType === 'scatter') {
              const d = params.data;
              return `<div style="font-weight:600;margin-bottom:4px">${d.name}</div>
                <div>城市: ${d.city}</div>
                <div>风险等级: ${d.risk === 'high' ? '🔴 高' : d.risk === 'medium' ? '🟡 中' : '🟢 低'}</div>
                <div>传承人: ${d.inheritorCount}人 | 均龄: ${d.avgAge}岁</div>`;
            }
            return params.name;
          },
        },
        geo: {
          map: 'guangdong',
          roam: true,
          center: [113.5, 23.5],
          zoom: 1.2,
          itemStyle: {
            areaColor: 'rgba(20,20,35,0.8)',
            borderColor: 'rgba(201,169,110,0.3)',
            borderWidth: 1.5,
            shadowColor: 'rgba(201,169,110,0.1)',
            shadowBlur: 20,
          },
          emphasis: {
            itemStyle: {
              areaColor: 'rgba(30,30,50,0.9)',
              borderColor: '#C9A96E',
            },
          },
          label: { show: false },
        },
        series: [
          {
            type: 'effectScatter',
            coordinateSystem: 'geo',
            data: scatterData.filter(d => d.risk === 'high'),
            symbolSize: 18,
            showEffectOn: 'render',
            rippleEffect: { brushType: 'stroke', scale: 4, period: 3, color: '#E85D4A' },
            itemStyle: { color: '#E85D4A', shadowBlur: 20, shadowColor: 'rgba(232,93,74,0.6)' },
            zlevel: 1,
          },
          {
            type: 'effectScatter',
            coordinateSystem: 'geo',
            data: scatterData.filter(d => d.risk === 'medium'),
            symbolSize: 14,
            rippleEffect: { brushType: 'stroke', scale: 3.5, period: 4, color: '#C9A96E' },
            itemStyle: { color: '#C9A96E', shadowBlur: 15, shadowColor: 'rgba(201,169,110,0.5)' },
            zlevel: 1,
          },
          {
            type: 'scatter',
            coordinateSystem: 'geo',
            data: scatterData.filter(d => d.risk === 'low'),
            symbolSize: 12,
            itemStyle: { color: '#5B8C5A', shadowBlur: 10, shadowColor: 'rgba(91,140,90,0.4)' },
            zlevel: 1,
          },
        ],
      });

      chart.on('click', (params) => {
        if (params.componentType === 'series') {
          const found = RISK_DATA.find(d => d.name === params.data.name);
          if (found) {
            setSelectedProject(found);
            setSelectedItem(found);
            setDetailVisible(true);
          }
        }
      });

      chartInstance.current = chart;
      const handleResize = () => chart.resize();
      window.addEventListener('resize', handleResize);
      return () => { window.removeEventListener('resize', handleResize); if (chartInstance.current) chartInstance.current.dispose(); };
    }
  }, []);

  const riskColor = (level) => level === 'high' ? '#E85D4A' : level === 'medium' ? '#C9A96E' : '#5B8C5A';
  const riskLabel = (level) => level === 'high' ? '高风险' : level === 'medium' ? '中风险' : '低风险';

  return (
    <div style={{ paddingTop: '80px', minHeight: '100vh' }}>
      <div style={{ maxWidth: '1400px', margin: '0 auto', padding: '0 2rem' }}>
        <h2 className="section-title" style={{
          fontFamily: "'Noto Serif SC', serif", fontSize: '2rem', fontWeight: 700,
          color: '#E8E0D5', marginBottom: '0.5rem', letterSpacing: '0.08em',
        }}>风险预警中心</h2>

  const [uploadedImage, setUploadedImage] = useState(null);
  const [reviewing, setReviewing] = useState(false);
  const [reviewDone, setReviewDone] = useState(false);
  const fileInputRef = useRef(null);

  const reviewData = MOCK_VISION_REVIEW[selectedTech] || MOCK_VISION_REVIEW['广绣'];

  const handleFileSelect = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setUploadedImage(file.name);
    setReviewDone(false);
    setReviewing(true);
    setTimeout(() => { setReviewing(false); setReviewDone(true); }, 2000);
  };

  const severityLabel = { high:'⚠️ 较高', medium:'📌 中等', low:'💡 建议' };
  const severityStyle = { high:{ color:'#E85D4A', bg:'rgba(232,93,74,0.1)' }, medium:{ color:'#C9A96E', bg:'rgba(201,169,110,0.1)' }, low:{ color:'#5B8C5A', bg:'rgba(91,140,90,0.1)' } };

  return (
    <div style={{ paddingTop:'80px', minHeight:'100vh' }}>
      <div style={{ maxWidth:'1000px', margin:'0 auto', padding:'0 2rem' }}>
        <h2 className="section-title" style={{ fontFamily:"'Noto Serif SC', serif", fontSize:'2rem', fontWeight:700, color:'#E8E0D5', marginBottom:'0.5rem', letterSpacing:'0.08em' }}>AI师傅视觉点评</h2>
        <p style={{ color:'#9A9288', marginBottom:'0.8rem', lineHeight:1.8, maxWidth:'700px' }}>
          拍摄练习作品照片上传，AI自动调用<strong style={{ color:'#AF69EE' }}>视觉识别+知识库标准参照</strong>进行对比点评。
          每条评价均标注知识来源节点，杜绝AI幻觉，让传承路上的每一步都有据可依。
        </p>
        <div style={{ display:'flex', flexWrap:'wrap', gap:'1.2rem', marginBottom:'2rem', color:'#6B6560', fontSize:'0.82rem' }}>
          <span><span style={{ color:'#AF69EE' }}>📸</span> 拍照上传比对</span>
          <span><span style={{ color:'#AF69EE' }}>🎯</span> 知识节点精准匹配</span>
          <span><span style={{ color:'#AF69EE' }}>📋</span> 结构化点评卡片</span>
          <span><span style={{ color:'#AF69EE' }}>📎</span> 来源节点溯源</span>
        </div>

        {/* Upload + Select */}
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'1.5rem', marginBottom:'2rem' }}>
          <div className="card-ink" style={{ padding:'1.5rem', textAlign:'center' }}>
            <div style={{ fontSize:'2.5rem', marginBottom:'1rem', opacity:0.6 }}>📸</div>
            <p style={{ color:'#9A9288', fontSize:'0.9rem', marginBottom:'1rem' }}>拍摄或上传练习作品照片</p>
            <input ref={fileInputRef} type="file" accept="image/*" onChange={handleFileSelect} style={{ display:'none' }} />
            <button onClick={() => fileInputRef.current?.click()} style={{ padding:'0.7rem 2rem', background:'rgba(175,105,238,0.15)', border:'1px solid rgba(175,105,238,0.3)', borderRadius:'10px', color:'#AF69EE', cursor:'pointer', fontSize:'0.9rem', fontWeight:500, transition:'all 0.3s' }}
              onMouseEnter={e=>{e.currentTarget.style.background='rgba(175,105,238,0.25)';}}
              onMouseLeave={e=>{e.currentTarget.style.background='rgba(175,105,238,0.15)';}}
            >选择图片上传</button>
            {uploadedImage && <p style={{ marginTop:'0.8rem', color:'#5B8C5A', fontSize:'0.8rem' }}>✅ {uploadedImage}</p>}
          </div>
          <div className="card-ink" style={{ padding:'1.5rem' }}>
            <p style={{ color:'#9A9288', fontSize:'0.85rem', marginBottom:'0.8rem' }}>选择练习的技艺：</p>
            <div style={{ display:'flex', flexWrap:'wrap', gap:'0.5rem' }}>
              {Object.keys(MOCK_VISION_REVIEW).map(tech => (
                <button key={tech} onClick={() => { setSelectedTech(tech); setUploadedImage(null); setReviewDone(false); }} style={{ padding:'0.5rem 1rem', borderRadius:'8px', border:selectedTech===tech?'1px solid rgba(175,105,238,0.5)':'1px solid rgba(201,169,110,0.15)', background:selectedTech===tech?'rgba(175,105,238,0.12)':'transparent', color:selectedTech===tech?'#AF69EE':'#9A9288', cursor:'pointer', fontSize:'0.85rem', transition:'all 0.3s' }}>{tech}</button>
              ))}
            </div>
          </div>
        </div>

        {/* Loading */}  
        {reviewing && (
          <div className="card-ink" style={{ padding:'2rem', textAlign:'center', marginBottom:'2rem' }}>
            <div style={{ fontSize:'2rem', marginBottom:'1rem', animation:'float 1.5s ease-in-out infinite' }}>🔍</div>
            <p style={{ color:'#AF69EE', fontSize:'0.95rem' }}>AI正在分析作品，与知识库标准进行对比...</p>
            <div style={{ marginTop:'1rem', width:'200px', height:'3px', background:'rgba(175,105,238,0.1)', margin:'0 auto', borderRadius:'2px', overflow:'hidden' }}>
              <div style={{ height:'100%', width:'60%', background:'linear-gradient(90deg, #AF69EE, #C9A96E)', borderRadius:'2px', animation:'shimmer 1.5s infinite' }}/>
            </div>
          </div>
        )}

        {/* Review Results */}
        {reviewDone && (
          <div style={{ animation:'scaleIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) both' }}>
            {/* Overall Assessment */}
            <div className="card-ink" style={{ padding:'1.5rem', marginBottom:'1.5rem', background:'linear-gradient(135deg, rgba(175,105,238,0.06), rgba(175,105,238,0.02))', border:'1px solid rgba(175,105,238,0.2)' }}>
              <div style={{ display:'flex', alignItems:'center', gap:'0.8rem', marginBottom:'1rem' }}>
                <span style={{ fontSize:'2rem' }}>📊</span>
                <h3 style={{ fontFamily:"'Noto Serif SC', serif", color:'#E8E0D5', fontSize:'1.2rem' }}>整体评价</h3>
              </div>
              <p style={{ color:'#9A9288', lineHeight:1.9, fontSize:'0.9rem', marginBottom:'1rem' }}>{reviewData.overall}</p>
              <div style={{ display:'flex', flexWrap:'wrap', gap:'0.5rem' }}>
                {reviewData.sources.map((s,i) => (
                  <span key={i} className="source-badge">📎 引自：{s}</span>
                ))}
              </div>
            </div>

            {/* Individual Review Cards */}
            <h3 style={{ color:'#E8E0D5', fontFamily:"'Noto Serif SC', serif", fontSize:'1.1rem', marginBottom:'1rem' }}>
              问题定位与改进建议
            </h3>
            {reviewData.review.map(r => (
              <div key={r.id} className={`review-card review-severity-${r.severity}`} style={{ animation:`fadeInUp 0.5s ${0.1 * reviewData.review.indexOf(r)}s cubic-bezier(0.4, 0, 0.2, 1) both` }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', flexWrap:'wrap', gap:'0.5rem', marginBottom:'0.5rem' }}>
                  <div style={{ display:'flex', alignItems:'center', gap:'0.5rem' }}>
                    <span style={{ fontSize:'1.1rem' }}>📍</span>
                    <strong style={{ color:'#E8E0D5', fontSize:'0.95rem' }}>{r.title}</strong>
                    <span style={{ ...severityStyle[r.severity], padding:'0.15rem 0.5rem', borderRadius:'4px', fontSize:'0.7rem', fontWeight:500 }}>{severityLabel[r.severity]}</span>
                  </div>
                </div>
                <div style={{ background:'rgba(20,20,40,0.6)', borderRadius:'8px', padding:'1rem', marginBottom:'0.8rem' }}>
                  <div style={{ marginBottom:'0.8rem' }}>
                    <div style={{ fontSize:'0.7rem', color:'#AF69EE', marginBottom:'0.3rem', fontWeight:500 }}>🔴 问题定位</div>
                    <div style={{ color:'#6B6560', fontSize:'0.78rem', marginBottom:'0.3rem' }}>位置：{r.position}</div>
                    <div style={{ color:'#9A9288', fontSize:'0.85rem', lineHeight:1.7 }}>{r.issue}</div>
                  </div>
                  <div style={{ marginBottom:'0.8rem' }}>
                    <div style={{ fontSize:'0.7rem', color:'#5B8C5A', marginBottom:'0.3rem', fontWeight:500 }}>💡 改进建议</div>
                    <div style={{ color:'#9A9288', fontSize:'0.85rem', lineHeight:1.7 }}>{r.suggestion}</div>
                  </div>
                  <div>
                    <div style={{ fontSize:'0.7rem', color:'#C9A96E', marginBottom:'0.3rem', fontWeight:500 }}>🌟 {r.excellent_ref}</div>
                  </div>
                </div>
                <div style={{ display:'flex', flexWrap:'wrap', gap:'0.4rem' }}>
                  {r.ref.map((ref,i) => (
                    <span key={i} className="source-badge">📎 引自：{ref}</span>
                  ))}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
};

// ==================== APP ====================
const App = () => {
  const [currentPage, setCurrentPage] = useState('home');
  const [transitioning, setTransitioning] = useState(false);

  // Global mouse tracking for card glow
  useEffect(() => {
    const onMouseMove = (e) => {
      document.querySelectorAll('.card-ink').forEach(card => {
        const rect = card.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        card.style.setProperty('--mouse-x', `${x}%`);
        card.style.setProperty('--mouse-y', `${y}%`);
      });
    };
    window.addEventListener('mousemove', onMouseMove, { passive: true });
    return () => window.removeEventListener('mousemove', onMouseMove);
  }, []);

  const handleNavigate = (page) => {
    if (page === currentPage) return;
    setTransitioning(true);
    setTimeout(() => {
      setCurrentPage(page);
      setTransitioning(false);
    }, 250);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const renderPage = () => {
    switch (currentPage) {
      case 'home': return <LandingPage onNavigate={handleNavigate} />;
      case 'digital-legacy': return <DigitalLegacyPage />;
      case 'assistant': return <AssistantPage />;
      case 'roadmap': return <RoadmapPage />;
      case 'risk-map': return <RiskMapPage />;
      case 'vision-review': return <VisionReviewPage />;
      default: return <LandingPage onNavigate={handleNavigate} />;
    }
  };

  return (
    <div>
      <Navbar currentPage={currentPage} onNavigate={handleNavigate} />
      <div style={{
        opacity: transitioning ? 0 : 1,
        transform: transitioning ? 'translateY(12px) scale(0.99)' : 'translateY(0) scale(1)',
        transition: 'all 0.3s cubic-bezier(0.4, 0, 0.2, 1)',
      }}>
        {renderPage()}
      </div>
      {/* Footer */}
      <footer style={{
        padding:'4rem 2rem 3rem', textAlign:'center',
        borderTop:'1px solid rgba(201,169,110,0.1)',
        marginTop:'2rem',
      }}>
        <div style={{
          fontFamily:"'Noto Serif SC', serif", fontSize:'1.8rem', fontWeight:900,
          background:'linear-gradient(135deg, #D4B87A, #C9A96E, #8B7355)',
          WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent',
          backgroundClip:'text',
          marginBottom:'1.5rem',
        }}>薪火</div>
        <blockquote style={{
          maxWidth:'600px', margin:'0 auto 2rem',
          padding:'1.5rem 2rem',
          borderLeft:'3px solid rgba(201,169,110,0.3)',
          background:'rgba(201,169,110,0.03)',
          borderRadius:'0 8px 8px 0',
        }}>
          <p style={{ color:'#9A9288', fontSize:'1.05rem', lineHeight:2, fontStyle:'italic', letterSpacing:'0.06em' }}>
            "我们不是在保存视频。<br />
            我们是在老师傅离开之前，把几十年的经验真正留下来。"
          </p>
        </blockquote>
        <div style={{ display:'flex', justifyContent:'center', gap:'2rem', flexWrap:'wrap', marginBottom:'1.5rem' }}>
          {['首页', '数字留灯', 'AI传承助手', '学习路线', '风险预警', 'AI视觉点评'].map(item => (
            <span key={item} style={{ color:'#6B6560', fontSize:'0.8rem', cursor:'pointer', transition:'color 0.3s' }}
              onMouseEnter={e=>e.target.style.color='#C9A96E'}
              onMouseLeave={e=>e.target.style.color='#6B6560'}
            >{item}</span>
          ))}
        </div>
        <div style={{ color:'#4A4540', fontSize:'0.75rem' }}>
          © 2026 薪火 · 非遗AI数字化平台 | AI传承，文化永续
        </div>
        <p style={{ marginTop:'1rem', color:'#6B6560', fontSize:'0.7rem', letterSpacing:'0.04em' }}>
          📎 平台所有AI输出均基于知识库节点溯源，杜绝AI幻觉 · 可追溯 · 可验证 · 可传承
        </p>
      </footer>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

<style>
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
</style>
</body>
</html>
