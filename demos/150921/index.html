<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>心灵奇境 · 六感公仔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ========== RESET & ROOT ========== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --pink:#FF69B4;--pink-light:#FFB6D9;--pink-dark:#E0559A;
  --teal:#4ECDC4;--teal-light:#7EDDD6;--teal-dark:#3AB5AD;
  --bg:#FFF5F9;--glass:rgba(255,255,255,0.45);--glass-border:rgba(255,255,255,0.6);
  --shadow-pink:0 4px 20px rgba(255,105,180,0.25);--shadow-teal:0 4px 20px rgba(78,205,196,0.25);
  --radius:20px;--font-ui:'Noto Sans SC',system-ui,-apple-system,sans-serif;
  --font-hand:'ZCOOL KuaiLe','Ma Shan Zheng',cursive;
}
html,body{height:100%;overflow:hidden;background:#1a1a2e;font-family:var(--font-ui)}
body{display:flex;justify-content:center;align-items:center}

/* ========== PHONE SHELL ========== */
#phone{
  width:100%;max-width:430px;height:100vh;max-height:932px;
  position:relative;overflow:hidden;background:var(--bg);
  box-shadow:0 0 60px rgba(255,105,180,0.3),0 0 120px rgba(78,205,196,0.15);
}
@media(min-width:431px){
  #phone{border-radius:36px;height:min(95vh,900px);border:6px solid #222}
}

/* ========== SPLASH SCREEN ========== */
#splash{
  position:absolute;inset:0;z-index:1000;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
  transition:opacity 0.8s ease,transform 0.8s ease;
}
#splash.hide{opacity:0;transform:scale(1.1);pointer-events:none}
.aurora{
  position:absolute;inset:0;overflow:hidden;opacity:0.6;
}
.aurora-layer{
  position:absolute;width:200%;height:200%;top:-50%;left:-50%;
  border-radius:50%;filter:blur(80px);mix-blend-mode:screen;opacity:0.5;
}
.aurora-layer:nth-child(1){
  background:radial-gradient(ellipse at 30% 50%,rgba(255,105,180,0.6),transparent 60%);
  animation:auroraMove1 6s ease-in-out infinite alternate;
}
.aurora-layer:nth-child(2){
  background:radial-gradient(ellipse at 70% 40%,rgba(78,205,196,0.5),transparent 60%);
  animation:auroraMove2 8s ease-in-out infinite alternate;
}
.aurora-layer:nth-child(3){
  background:radial-gradient(ellipse at 50% 60%,rgba(167,119,255,0.4),transparent 50%);
  animation:auroraMove3 7s ease-in-out infinite alternate;
}
@keyframes auroraMove1{0%{transform:translate(0,0) rotate(0deg)}100%{transform:translate(5%,10%) rotate(15deg)}}
@keyframes auroraMove2{0%{transform:translate(0,0) rotate(0deg)}100%{transform:translate(-8%,5%) rotate(-10deg)}}
@keyframes auroraMove3{0%{transform:translate(0,0) scale(1)}100%{transform:translate(3%,-8%) scale(1.1)}}

.stars{position:absolute;inset:0;overflow:hidden}
.star{
  position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;
  animation:twinkle 2s ease-in-out infinite alternate;
}
@keyframes twinkle{0%{opacity:0.2;transform:scale(0.5)}100%{opacity:1;transform:scale(1.2)}}

.splash-island{
  width:180px;height:180px;border-radius:50%;position:relative;z-index:2;
  background:radial-gradient(ellipse at 40% 35%,#a8e6cf,#88d8b0 30%,#6ec5a0 50%,#55b98d 70%,#3da678);
  box-shadow:0 8px 40px rgba(58,181,173,0.5),inset 0 -4px 20px rgba(0,0,0,0.15),inset 0 4px 15px rgba(255,255,255,0.3);
  animation:splashIslandIn 2s ease-out forwards;
  opacity:0;transform:scale(0.3) translateY(60px);
}
.splash-island::before{
  content:'';position:absolute;top:15%;left:20%;width:60%;height:30%;
  background:radial-gradient(ellipse,rgba(255,255,255,0.4),transparent);
  border-radius:50%;
}
@keyframes splashIslandIn{
  0%{opacity:0;transform:scale(0.3) translateY(60px)}
  60%{opacity:1;transform:scale(1.05) translateY(-5px)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}
.splash-mascot{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);
  width:90px;height:90px;z-index:3;
  animation:splashMascotIn 1.5s 0.5s ease-out forwards;opacity:0;
}
.splash-mascot img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.2))}
@keyframes splashMascotIn{
  0%{opacity:0;transform:translate(-50%,-20%) scale(0.3)}
  70%{transform:translate(-50%,-65%) scale(1.1)}
  100%{opacity:1;transform:translate(-50%,-60%) scale(1)}
}
.splash-logo{
  position:relative;z-index:4;margin-top:30px;
  font-family:var(--font-hand);font-size:32px;color:#fff;
  text-shadow:0 2px 20px rgba(255,105,180,0.8),0 0 40px rgba(78,205,196,0.5);
  animation:splashLogoIn 1.5s 1s ease-out forwards;opacity:0;
}
.splash-subtitle{
  position:relative;z-index:4;margin-top:8px;
  font-family:var(--font-ui);font-size:14px;color:rgba(255,255,255,0.7);
  letter-spacing:4px;animation:splashLogoIn 1.5s 1.3s ease-out forwards;opacity:0;
}
@keyframes splashLogoIn{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:translateY(0)}}

/* ========== MAIN APP ========== */
#app{
  position:absolute;inset:0;display:flex;flex-direction:column;
  opacity:0;transition:opacity 0.6s 0.3s ease;overflow:hidden;
}
#app.show{opacity:1}

/* ========== SCENE BACKGROUND ========== */
#scene-bg{
  position:absolute;inset:0;z-index:0;
  background-size:cover;background-position:center;
  transition:background-image 0.8s ease,opacity 0.8s ease;
}
#scene-bg::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,245,249,0.3) 0%,rgba(255,245,249,0.1) 40%,rgba(255,245,249,0.5) 100%);
}

/* ========== TOP STATUS BAR ========== */
#top-bar{
  position:relative;z-index:10;display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px 8px;
  background:linear-gradient(180deg,rgba(255,245,249,0.85) 0%,rgba(255,245,249,0) 100%);
}
.date-weather{display:flex;align-items:center;gap:6px;font-size:13px;color:#666;font-weight:500}
.date-weather .weather-icon{font-size:18px}
.petal-counter{
  display:flex;align-items:center;gap:5px;
  background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--glass-border);border-radius:20px;padding:5px 12px 5px 8px;
  font-size:13px;color:var(--pink-dark);font-weight:600;
  box-shadow:var(--shadow-pink);
}
.petal-counter .petal-icon{font-size:16px}
.petal-count{min-width:16px;text-align:center}
.scene-btn{
  width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;
  background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--glass-border);font-size:18px;
  box-shadow:var(--shadow-teal);transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  display:flex;align-items:center;justify-content:center;
}
.scene-btn:active{transform:scale(0.85)}

/* ========== SCENE SELECTOR ========== */
#scene-selector{
  position:absolute;top:56px;right:12px;z-index:100;
  background:rgba(255,255,255,0.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:var(--radius);padding:12px;
  box-shadow:0 8px 32px rgba(0,0,0,0.15);
  transform:scale(0.8) translateY(-10px);opacity:0;pointer-events:none;
  transition:all 0.35s cubic-bezier(0.34,1.56,0.64,1);
  transform-origin:top right;
}
#scene-selector.show{transform:scale(1) translateY(0);opacity:1;pointer-events:auto}
#scene-selector .scene-title{font-size:12px;color:#999;margin-bottom:8px;font-weight:500}
.scene-list{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scene-list::-webkit-scrollbar{display:none}
.scene-thumb{
  flex-shrink:0;width:72px;height:54px;border-radius:12px;overflow:hidden;cursor:pointer;
  border:2px solid transparent;transition:all 0.3s ease;position:relative;
}
.scene-thumb.active{border-color:var(--pink);box-shadow:0 0 12px rgba(255,105,180,0.4)}
.scene-thumb img{width:100%;height:100%;object-fit:cover}
.scene-thumb .scene-name{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(transparent,rgba(0,0,0,0.6));
  color:#fff;font-size:8px;text-align:center;padding:8px 2px 3px;
}

/* ========== MASCOT AREA ========== */
#mascot-area{
  flex:1;position:relative;z-index:5;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding-bottom:10px;min-height:0;
}

/* Floating Island */
.island{
  position:relative;width:220px;height:80px;
  display:flex;align-items:center;justify-content:center;
}
.island-base{
  position:absolute;bottom:0;width:100%;height:60px;
  background:radial-gradient(ellipse at 50% 80%,#a8e6cf 0%,#88d8b0 25%,#6ec5a0 50%,#55b98d 75%,#3da678 100%);
  border-radius:50%;filter:blur(1px);
  box-shadow:0 8px 30px rgba(58,181,173,0.4),inset 0 -3px 15px rgba(0,0,0,0.1),inset 0 3px 10px rgba(255,255,255,0.3);
}
.island-base::before{
  content:'';position:absolute;top:10%;left:15%;width:70%;height:35%;
  background:radial-gradient(ellipse,rgba(255,255,255,0.35),transparent);
  border-radius:50%;
}
.island-glow{
  position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);
  width:200px;height:30px;
  background:radial-gradient(ellipse,rgba(78,205,196,0.3),transparent);
  border-radius:50%;filter:blur(8px);
  animation:islandGlowPulse 3s ease-in-out infinite alternate;
}
@keyframes islandGlowPulse{
  0%{opacity:0.5;transform:translateX(-50%) scale(1)}
  100%{opacity:1;transform:translateX(-50%) scale(1.15)}
}

/* Mascot Image */
#mascot-container{
  position:relative;z-index:2;cursor:pointer;
  width:120px;height:120px;
  animation:mascotFloat 3s ease-in-out infinite;
  transition:transform 0.1s;
}
@keyframes mascotFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}
#mascot-container.bounce{animation:mascotBounce 0.6s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes mascotBounce{
  0%{transform:scale(1) rotate(0)}
  20%{transform:scale(0.85,1.15) rotate(-5deg)}
  40%{transform:scale(1.15,0.85) rotate(5deg)}
  60%{transform:scale(0.95,1.05) rotate(-2deg)}
  80%{transform:scale(1.05,0.95) rotate(1deg)}
  100%{transform:scale(1) rotate(0)}
}
#mascot-container.shake{animation:mascotShake 0.5s ease-in-out}
@keyframes mascotShake{
  0%,100%{transform:translateX(0) rotate(0)}
  15%{transform:translateX(-8px) rotate(-5deg)}
  30%{transform:translateX(8px) rotate(5deg)}
  45%{transform:translateX(-6px) rotate(-3deg)}
  60%{transform:translateX(6px) rotate(3deg)}
  75%{transform:translateX(-3px) rotate(-1deg)}
}
#mascot-container.jump{animation:mascotJump 0.8s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes mascotJump{
  0%{transform:translateY(0) scale(1)}
  30%{transform:translateY(-40px) scale(1.1,0.9)}
  50%{transform:translateY(-50px) scale(0.95,1.05)}
  70%{transform:translateY(-20px) scale(1.05,0.95)}
  85%{transform:translateY(5px) scale(0.98,1.02)}
  100%{transform:translateY(0) scale(1)}
}
#mascot-container.sad{animation:mascotSad 1s ease-in-out}
@keyframes mascotSad{
  0%,100%{transform:translateY(0) rotate(0)}
  25%{transform:translateY(3px) rotate(-3deg)}
  50%{transform:translateY(5px) rotate(0) scale(0.95)}
  75%{transform:translateY(3px) rotate(3deg)}
}
#mascot-container.party{animation:mascotParty 0.3s ease-in-out infinite}
@keyframes mascotParty{
  0%,100%{transform:rotate(0) scale(1)}
  25%{transform:rotate(8deg) scale(1.05)}
  50%{transform:rotate(0) scale(0.95)}
  75%{transform:rotate(-8deg) scale(1.05)}
}
#mascot-img{
  width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 6px 12px rgba(0,0,0,0.15));
  transition:opacity 0.4s ease;
}
#mascot-emoji{
  position:absolute;inset:0;display:none;
  align-items:center;justify-content:center;
  font-size:80px;line-height:1;
  filter:drop-shadow(0 6px 12px rgba(0,0,0,0.15));
  transition:opacity 0.4s ease;
}
#mascot-emoji.show{display:flex}

/* Long press indicator */
.longpress-indicator{
  position:absolute;top:-30px;left:50%;transform:translateX(-50%);
  background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-radius:12px;padding:4px 10px;font-size:11px;color:#999;
  opacity:0;transition:opacity 0.3s;white-space:nowrap;
}
.longpress-indicator.show{opacity:1}
.longpress-bar{
  width:60px;height:3px;background:rgba(0,0,0,0.1);border-radius:2px;margin-top:3px;overflow:hidden;
}
.longpress-bar-fill{
  width:0%;height:100%;background:linear-gradient(90deg,var(--pink),var(--teal));
  border-radius:2px;transition:width 0.1s linear;
}

/* ========== SPEECH BUBBLE ========== */
#speech-bubble{
  position:absolute;top:-10px;left:50%;transform:translateX(-50%) translateY(-100%) scale(0.5);
  width:260px;padding:14px 16px;
  background:rgba(255,255,255,0.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--glass-border);border-radius:20px;
  box-shadow:0 4px 20px rgba(255,105,180,0.15),0 2px 8px rgba(0,0,0,0.06);
  font-family:var(--font-hand);font-size:15px;color:#444;line-height:1.6;
  opacity:0;pointer-events:none;
  transition:all 0.5s cubic-bezier(0.34,1.56,0.64,1);
  z-index:20;
}
#speech-bubble.show{opacity:1;transform:translateX(-50%) translateY(-100%) scale(1);pointer-events:auto}
#speech-bubble::after{
  content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;
  border-top:10px solid rgba(255,255,255,0.92);
}
#speech-bubble .bubble-text{min-height:20px}
.bubble-typing-cursor{
  display:inline-block;width:2px;height:16px;background:var(--pink);
  margin-left:2px;vertical-align:text-bottom;
  animation:cursorBlink 0.8s step-end infinite;
}
@keyframes cursorBlink{0%,100%{opacity:1}50%{opacity:0}}

/* ========== CHAT PANEL ========== */
#chat-panel{
  position:absolute;bottom:0;left:0;right:0;z-index:50;
  height:55%;background:rgba(255,245,249,0.97);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:24px 24px 0 0;
  box-shadow:0 -4px 30px rgba(0,0,0,0.1);
  transform:translateY(100%);transition:transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
  display:flex;flex-direction:column;
}
#chat-panel.show{transform:translateY(0)}
.chat-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 18px 10px;border-bottom:1px solid rgba(0,0,0,0.06);
}
.chat-header-title{font-size:15px;font-weight:700;color:#333}
.chat-close{
  width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(0,0,0,0.06);font-size:16px;color:#999;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.3s;
}
.chat-close:active{transform:scale(0.85);background:rgba(0,0,0,0.1)}
.chat-messages{
  flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;
  scrollbar-width:none;
}
.chat-messages::-webkit-scrollbar{display:none}
.msg{display:flex;gap:8px;max-width:85%;animation:msgIn 0.4s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes msgIn{0%{opacity:0;transform:translateY(10px) scale(0.9)}100%{opacity:1;transform:none}}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg-avatar{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;overflow:hidden;
  background:linear-gradient(135deg,var(--pink-light),var(--teal-light));
  display:flex;align-items:center;justify-content:center;font-size:20px;
}
.msg-avatar img{width:100%;height:100%;object-fit:contain}
.msg-bubble{
  padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5;color:#333;
}
.msg.mascot .msg-bubble{
  background:rgba(255,255,255,0.9);border:1px solid rgba(0,0,0,0.05);
  border-top-left-radius:4px;
}
.msg.user .msg-bubble{
  background:linear-gradient(135deg,var(--pink),var(--pink-dark));
  color:#fff;border-top-right-radius:4px;
}
.chat-input-bar{
  display:flex;align-items:center;gap:8px;padding:10px 14px 16px;
  border-top:1px solid rgba(0,0,0,0.05);
}
.chat-input{
  flex:1;height:40px;border-radius:20px;border:1px solid rgba(0,0,0,0.08);
  padding:0 16px;font-size:14px;font-family:var(--font-ui);
  background:rgba(255,255,255,0.8);outline:none;transition:border-color 0.3s;
}
.chat-input:focus{border-color:var(--pink)}
.chat-input::placeholder{color:#bbb}
.chat-btn{
  width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1),background 0.3s;
  flex-shrink:0;
}
.chat-btn:active{transform:scale(0.85)}
.chat-send{background:linear-gradient(135deg,var(--pink),var(--pink-dark));color:#fff;box-shadow:0 2px 10px rgba(255,105,180,0.4)}
.chat-mic{background:rgba(78,205,196,0.15);color:var(--teal-dark)}
.chat-img{background:rgba(255,105,180,0.1);color:var(--pink)}

/* ========== SPARK TASK CARD ========== */
#spark-card{
  position:absolute;bottom:140px;left:50%;transform:translateX(-50%) translateY(20px) scale(0.9);
  width:280px;padding:16px;z-index:30;
  background:rgba(255,255,255,0.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--glass-border);border-radius:var(--radius);
  box-shadow:0 8px 30px rgba(78,205,196,0.2);
  opacity:0;pointer-events:none;
  transition:all 0.5s cubic-bezier(0.34,1.56,0.64,1);
}
#spark-card.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1);pointer-events:auto}
.spark-header{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.spark-icon{font-size:20px}
.spark-title{font-size:14px;font-weight:700;color:var(--teal-dark)}
.spark-desc{font-size:13px;color:#666;line-height:1.5;margin-bottom:12px}
.spark-btn{
  width:100%;height:38px;border-radius:19px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--teal),var(--teal-dark));
  color:#fff;font-size:14px;font-weight:600;font-family:var(--font-ui);
  box-shadow:var(--shadow-teal);
  transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
.spark-btn:active{transform:scale(0.92)}
.spark-btn.done{background:linear-gradient(135deg,#ccc,#aaa);pointer-events:none}
.spark-close{
  position:absolute;top:10px;right:12px;border:none;background:none;
  font-size:18px;color:#bbb;cursor:pointer;
}

/* ========== DOCK BAR ========== */
#dock{
  position:relative;z-index:10;display:flex;justify-content:center;gap:10px;
  padding:10px 16px 8px;
  background:linear-gradient(0deg,rgba(255,245,249,0.9) 0%,rgba(255,245,249,0) 100%);
}
.dock-btn{
  width:54px;height:54px;border-radius:27px;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;position:relative;
  transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow:0 3px 12px rgba(0,0,0,0.1);
}
.dock-btn:active{transform:scale(0.82)!important}
.dock-btn img{width:36px;height:36px;object-fit:contain}
.dock-btn .dock-label{
  position:absolute;bottom:-16px;font-size:9px;color:#999;white-space:nowrap;
  font-weight:500;opacity:0;transition:opacity 0.3s;
}
.dock-btn.active .dock-label{opacity:1}
.dock-btn.active{
  transform:scale(1.15) translateY(-4px);
  box-shadow:0 6px 24px rgba(255,105,180,0.4);
}
.dock-btn .badge{
  position:absolute;top:-2px;right:-2px;width:16px;height:16px;
  background:var(--pink);color:#fff;font-size:9px;border-radius:50%;
  display:none;align-items:center;justify-content:center;
  font-weight:700;box-shadow:0 1px 4px rgba(255,105,180,0.5);
}
.dock-btn .badge.show{display:flex}

/* ========== TIPS AREA ========== */
#tips-area{
  position:relative;z-index:10;padding:4px 0 12px;
}
.tips-label{
  font-size:11px;color:#999;padding:0 20px 6px;font-weight:500;
}
.tips-scroll{
  display:flex;gap:10px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none;
}
.tips-scroll::-webkit-scrollbar{display:none}
.tip-card{
  flex-shrink:0;width:200px;padding:12px 14px;
  background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--glass-border);border-radius:16px;
  box-shadow:0 2px 12px rgba(255,105,180,0.08);
}
.tip-card .tip-emoji{font-size:22px;margin-bottom:6px}
.tip-card .tip-text{font-size:12px;color:#555;line-height:1.6}

/* ========== EASTER EGG BUTTON ========== */
#easter-egg{
  position:absolute;bottom:90px;right:12px;z-index:40;
  width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(255,255,255,0.25);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font-size:18px;opacity:0.5;transition:all 0.3s;
}
#easter-egg:hover{opacity:0.8;transform:scale(1.1)}

/* ========== PARTICLES ========== */
.particle{
  position:absolute;pointer-events:none;z-index:100;
  animation:particleFly 1s ease-out forwards;
}
@keyframes particleFly{
  0%{opacity:1;transform:translate(0,0) scale(1) rotate(0deg)}
  100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0) rotate(var(--rot))}
}
.paper-plane{
  position:absolute;z-index:100;font-size:28px;pointer-events:none;
  animation:planeFly 2s ease-in-out forwards;
}
@keyframes planeFly{
  0%{opacity:1;transform:translate(0,0) rotate(0deg) scale(1)}
  30%{opacity:1;transform:translate(40px,-60px) rotate(-15deg) scale(1.2)}
  100%{opacity:0;transform:translate(250px,-300px) rotate(-30deg) scale(0.3)}
}
.music-note{
  position:absolute;z-index:100;font-size:22px;pointer-events:none;
  animation:noteFloat 1.5s ease-out forwards;
}
@keyframes noteFloat{
  0%{opacity:1;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(-80px) translateX(var(--nx)) scale(0.5)}
}
.rainbow-arc{
  position:absolute;z-index:100;pointer-events:none;
  width:60px;height:30px;border-radius:60px 60px 0 0;
  border:3px solid transparent;
  animation:arcFloat 1.2s ease-out forwards;
}
@keyframes arcFloat{
  0%{opacity:0.8;transform:scale(0.5) translateY(0)}
  100%{opacity:0;transform:scale(1.5) translateY(-60px)}
}
/* +1 float animation */
.petal-float{
  position:absolute;z-index:100;
  font-size:14px;font-weight:700;color:var(--pink);
  pointer-events:none;animation:petalFloat 1s ease-out forwards;
}
@keyframes petalFloat{
  0%{opacity:1;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(-40px) scale(1.3)}
}

/* ========== PARTY OVERLAY ========== */
#party-overlay{
  position:absolute;inset:0;z-index:80;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(255,105,180,0.1),rgba(78,205,196,0.1));
  transition:opacity 0.5s;
}
#party-overlay.show{opacity:1}

/* ========== Aurora intensity based on petals ========== */
.aurora-intensity{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 100%,rgba(78,205,196,0.08),transparent 60%);
  transition:opacity 0.5s;
}

<script>
// ========== APP STATE ==========
const state = {
  currentMascot: 1, // index into mascots array (default: 绒绒)
  petals: 0,
  chatOpen: false,
  sceneSelectorOpen: false,
  sparkDone: false,
  longPressTimer: null,
  longPressActive: false,
  murmurIndex: 0,
  messages: [],
  currentScene: 1 // default: meadow_flowers
};

// ========== DATA ==========
const mascots = [
  { id:'nuonuo', name:'糯糯', emoji:'🐙', color:'#FFB6D9', image:null, darkColor:'#E0559A' },
  { id:'rongrong', name:'绒绒', emoji:'🐰', color:'#F0F0F0', image:'assets/cute_bunny.png', darkColor:'#DDD' },
  { id:'bobo', name:'啵啵', emoji:'🐸', color:'#A8E6CF', image:null, darkColor:'#6ec5a0' },
  { id:'nuannuan', name:'暖暖', emoji:'🐱', color:'#DEB887', image:'assets/cute_cat.png', darkColor:'#C49A6C' },
  { id:'shanshan', name:'闪闪', emoji:'🦄', color:'#D8B4FE', image:null, darkColor:'#A855F7' },
  { id:'kuku', name:'酷酷', emoji:'🦕', color:'#B0B0B0', image:null, darkColor:'#808080' }
];

const scenes = [
  { name:'阳光森林', file:'forest_clearing.png' },
  { name:'野花草地', file:'meadow_flowers.png' },
  { name:'金色沙滩', file:'beach_sand.png' },
  { name:'海湾秘境', file:'cove_aerial.png' },
  { name:'礁石海岸', file:'rocky_coast.png' }
];

const positiveReplies = [
  '太棒了！你的快乐感染到我了！🎉',
  '真好呀！看到你开心我也好开心呢~',
  '快乐就是最好的能量！继续保持哦 ✨'
];

const sadKeywords = ['累','疲惫','烦','难过','不开心','伤心','痛苦','焦虑','压力'];
const happyKeywords = ['开心','高兴','快乐','棒','好棒','太好了','哈哈','嘻嘻','幸福'];
const studyKeywords = ['考试','学习','作业','复习','成绩','题目','试卷'];

const defaultReplies = [
  '谢谢你和我分享！每一个想法都值得被听见哦 💕',
  '我一直在听呢，你说的每一句我都记在心里了 🌟',
  '和你聊天好开心！你是一个很棒的人哦 🌈',
  '无论发生什么，我都陪着你！我们一起面对 💪',
  '嗯嗯，我懂你的感受。要不要抱抱？🤗',
  '你知道吗，今天的天空特别好看，就像你一样 ☁️',
  '每朵花都有自己的花期，你也一样，不用着急哦 🌸',
  '你比你想象的更勇敢、更了不起！✨'
];

const sparkTasks = [
  '要不要和我一起深呼吸5次？我陪你 🧘',
  '来做个拉伸吧！伸个懒腰，感觉会好很多哦～ 🙆',
  '闭上眼睛，想一想今天最让你感恩的一件事 🙏',
  '喝一杯水吧！小小的照顾也是大大的爱 💧',
  '对着镜子笑一笑，你笑起来真好看 😊',
  '听一首你喜欢的歌，让音乐治愈你 🎵',
  '去窗边看看天空，大自然是最好的朋友 🌤️'
];

const murmurQuotes = [
  '你今天也辛苦了，记得要好好休息哦 💤',
  '每个人都有闪闪发光的时候，包括你 ✨',
  '不管怎样，你都是独一无二的 🌟',
  '深呼吸，慢慢来，一切都会好的 🌈',
  '你值得被这个世界温柔对待 💕',
  '勇敢不是不害怕，而是害怕了还往前走 🦁',
  '今天也要做一个温暖的人呀 ☀️',
  '不开心的话就吃点好吃的吧！🍝',
  '你的笑容比星星还亮呢 ⭐',
  '明天又是全新的一天，加油哦 💪'
];

const tips = [
  { emoji:'🧘', text:'每天花5分钟做深呼吸练习，能有效缓解焦虑和压力。' },
  { emoji:'😴', text:'保证7-9小时的充足睡眠，是身心健康的重要基础。' },
  { emoji:'🏃', text:'每天运动30分钟，运动能释放内啡肽，让你更快乐。' },
  { emoji:'📝', text:'试着写日记记录心情，把感受写下来是一种很好的情绪疏导方式。' },
  { emoji:'🌳', text:'多到户外走走，接触大自然有助于减轻压力和改善心情。' },
  { emoji:'🤝', text:'遇到困难时，不要害怕向信任的人倾诉和寻求帮助。' },
  { emoji:'📱', text:'适度使用电子设备，睡前1小时尽量远离手机屏幕。' }
];

// ========== INIT ==========
function init() {
  createStars();
  buildDock();
  buildSceneSelector();
  buildTips();
  bindEvents();
  // Start splash → main transition
  setTimeout(() => {
    document.getElementById('splash').classList.add('hide');
    document.getElementById('app').classList.add('show');
    // Show initial speech bubble after transition
    setTimeout(() => showGreetingBubble(), 800);
  }, 3000);
}

// ========== STARS (Splash) ==========
function createStars() {
  const c = document.getElementById('stars');
  for (let i = 0; i < 50; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*100 + '%';
    s.style.animationDelay = Math.random()*3 + 's';
    s.style.animationDuration = (1.5 + Math.random()*2) + 's';
    s.style.width = s.style.height = (1 + Math.random()*2) + 'px';
    c.appendChild(s);
  }
}

// ========== DOCK ==========
function buildDock() {
  const dock = document.getElementById('dock');
  mascots.forEach((m, i) => {
    const btn = document.createElement('button');
    btn.className = 'dock-btn' + (i === state.currentMascot ? ' active' : '');
    btn.style.background = `linear-gradient(135deg, ${m.color}, ${m.darkColor})`;
    btn.dataset.index = i;
    if (m.image) {
      btn.innerHTML = `<img src="${m.image}" alt="${m.name}">`;
    } else {
      btn.textContent = m.emoji;
    }
    btn.innerHTML += `<span class="dock-label">${m.name}</span><span class="badge" id="badge-${i}">&#127942;</span>`;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      switchMascot(i);
    });
    dock.appendChild(btn);
  });
}

// ========== SCENE SELECTOR ==========
function buildSceneSelector() {
  const list = document.getElementById('scene-list');
  scenes.forEach((s, i) => {
    const thumb = document.createElement('div');
    thumb.className = 'scene-thumb' + (i === state.currentScene ? ' active' : '');
    thumb.innerHTML = `<img src="assets/${s.file}" alt="${s.name}"><span class="scene-name">${s.name}</span>`;
    thumb.addEventListener('click', () => switchScene(i));
    list.appendChild(thumb);
  });
}

// ========== TIPS ==========
function buildTips() {
  const scroll = document.getElementById('tips-scroll');
  tips.forEach(t => {
    const card = document.createElement('div');
    card.className = 'tip-card';
    card.innerHTML = `<div class="tip-emoji">${t.emoji}</div><div class="tip-text">${t.text}</div>`;
    scroll.appendChild(card);
  });
}

// ========== EVENTS ==========
function bindEvents() {
  // Scene toggle
  document.getElementById('scene-toggle').addEventListener('click', (e) => {
    e.stopPropagation();
    state.sceneSelectorOpen = !state.sceneSelectorOpen;
    document.getElementById('scene-selector').classList.toggle('show', state.sceneSelectorOpen);
  });

  // Mascot click
  const mc = document.getElementById('mascot-container');
  let pressTimer = null;
  let isLongPress = false;

  const startPress = (e) => {
    isLongPress = false;
    const indicator = document.getElementById('longpress-indicator');
    const fill = document.getElementById('longpress-fill');
    indicator.classList.add('show');
    fill.style.width = '0%';
    let progress = 0;
    const interval = setInterval(() => {
      progress += 5;
      fill.style.width = progress + '%';
    }, 100);
    pressTimer = setTimeout(() => {
      isLongPress = true;
      clearInterval(interval);
      fill.style.width = '100%';
      setTimeout(() => indicator.classList.remove('show'), 300);
      triggerMurmurMode();
    }, 2000);
    // Store interval for cleanup
    mc._pressInterval = interval;
  };

  const endPress = () => {
    clearTimeout(pressTimer);
    clearInterval(mc._pressInterval);
    document.getElementById('longpress-indicator').classList.remove('show');
    if (!isLongPress) {
      onMascotClick();
    }
    isLongPress = false;
  };

  mc.addEventListener('mousedown', startPress);
  mc.addEventListener('mouseup', endPress);
  mc.addEventListener('mouseleave', endPress);
  mc.addEventListener('touchstart', (e) => { e.preventDefault(); startPress(e); }, {passive:false});
  mc.addEventListener('touchend', endPress);
  mc.addEventListener('touchcancel', endPress);

  // Chat close
  document.getElementById('chat-close').addEventListener('click', closeChat);

  // Chat send
  document.getElementById('chat-send').addEventListener('click', sendMessage);
  document.getElementById('chat-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  // Spark close
  document.getElementById('spark-close').addEventListener('click', () => {
    document.getElementById('spark-card').classList.remove('show');
  });

  // Spark complete
  document.getElementById('spark-btn').addEventListener('click', completeSparkTask);

  // Easter egg
  document.getElementById('easter-egg').addEventListener('click', triggerEasterEgg);

  // Close scene selector when clicking elsewhere
  document.getElementById('app').addEventListener('click', (e) => {
    if (state.sceneSelectorOpen && !e.target.closest('#scene-selector') && !e.target.closest('#scene-toggle')) {
      state.sceneSelectorOpen = false;
      document.getElementById('scene-selector').classList.remove('show');
    }
  });
}

// ========== MASCOT SWITCH ==========
function switchMascot(index) {
  if (index === state.currentMascot) return;
  state.currentMascot = index;
  const m = mascots[index];

  // Update dock
  document.querySelectorAll('.dock-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === index);
  });

  // Update mascot image
  const img = document.getElementById('mascot-img');
  const emoji = document.getElementById('mascot-emoji');
  if (m.image) {
    img.src = m.image;
    img.style.display = 'block';
    emoji.classList.remove('show');
  } else {
    img.style.display = 'none';
    emoji.textContent = m.emoji;
    emoji.classList.add('show');
  }

  // Bounce animation
  const container = document.getElementById('mascot-container');
  container.className = '';
  void container.offsetWidth; // force reflow
  container.classList.add('bounce');
  setTimeout(() => {
    container.className = '';
    // Restore float
  }, 700);

  // Update chat title
  document.getElementById('chat-title').textContent = `和${m.name}聊天`;

  // Update chat avatar
  updateChatAvatars();

  // Hide speech bubble
  document.getElementById('speech-bubble').classList.remove('show');

  // Bobo party mode trigger
  if (index === 2) {
    triggerPartyMode();
  }

  // Add petal
  addPetal();
}

// ========== SCENE SWITCH ==========
function switchScene(index) {
  if (index === state.currentScene) return;
  state.currentScene = index;
  const bg = document.getElementById('scene-bg');
  bg.style.opacity = '0';
  setTimeout(() => {
    bg.style.backgroundImage = `url('assets/${scenes[index].file}')`;
    bg.style.opacity = '1';
  }, 400);
  // Update thumbs
  document.querySelectorAll('.scene-thumb').forEach((t, i) => {
    t.classList.toggle('active', i === index);
  });
  addPetal();
}

// ========== GREETING BUBBLE ==========
function showGreetingBubble() {
  const text = '嗨，今天你过的好吗？可以和我分享一下吗？悄悄告诉你，我会帮你把不开心的事变成星星哦 ✨';
  typeText(text, document.getElementById('bubble-text'), () => {
    // Keep bubble visible
  });
  document.getElementById('speech-bubble').classList.add('show');
}

// ========== TYPEWRITER ==========
function typeText(text, element, callback) {
  element.innerHTML = '';
  let i = 0;
  const cursor = document.createElement('span');
  cursor.className = 'bubble-typing-cursor';
  element.appendChild(cursor);
  const interval = setInterval(() => {
    if (i < text.length) {
      element.insertBefore(document.createTextNode(text[i]), cursor);
      i++;
    } else {
      clearInterval(interval);
      setTimeout(() => cursor.remove(), 1000);
      if (callback) callback();
    }
  }, 60);
}

// ========== MASCOT CLICK ==========
function onMascotClick() {
  const container = document.getElementById('mascot-container');
  container.className = '';
  void container.offsetWidth;
  container.classList.add('bounce');
  setTimeout(() => { container.className = ''; }, 700);
  openChat();
}

// ========== CHAT ==========
function openChat() {
  state.chatOpen = true;
  document.getElementById('chat-panel').classList.add('show');
  document.getElementById('speech-bubble').classList.remove('show');
  document.getElementById('spark-card').classList.remove('show');
  setTimeout(() => {
    document.getElementById('chat-input').focus();
    scrollChatToBottom();
  }, 500);
}

function closeChat() {
  state.chatOpen = false;
  document.getElementById('chat-panel').classList.remove('show');
}

function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  // Add user message
  addChatMessage(text, 'user');
  addPetal();

  // Hide bubble if showing
  document.getElementById('speech-bubble').classList.remove('show');

  // Mascot reaction
  const container = document.getElementById('mascot-container');
  container.className = '';
  void container.offsetWidth;

  // Determine response based on keywords
  let reply = '';
  let reaction = 'bounce';
  let specialEffect = null;

  if (sadKeywords.some(k => text.includes(k))) {
    reaction = 'sad';
    reply = '那我们把不开心折成纸飞机吧！让它飞走~ 🛩️';
    specialEffect = 'paperPlane';
  } else if (happyKeywords.some(k => text.includes(k))) {
    reaction = 'jump';
    reply = positiveReplies[Math.floor(Math.random() * positiveReplies.length)];
    specialEffect = 'fireworks';
  } else if (studyKeywords.some(k => text.includes(k))) {
    reaction = 'bounce';
    reply = '加油！你已经很努力了，休息一下也没关系哦 ☕';
  } else {
    reaction = 'bounce';
    reply = defaultReplies[Math.floor(Math.random() * defaultReplies.length)];
  }

  container.classList.add(reaction);

  // Delay mascot reply
  setTimeout(() => {
    // Restore float after reaction
    container.className = '';
    addChatMessage(reply, 'mascot');
    addPetal();

    // Special effects
    if (specialEffect === 'paperPlane') {
      createPaperPlane();
    } else if (specialEffect === 'fireworks') {
      createFireworks();
    }

    // Show spark task card
    setTimeout(() => {
      const task = sparkTasks[Math.floor(Math.random() * sparkTasks.length)];
      document.getElementById('spark-desc').textContent = task;
      document.getElementById('spark-card').classList.add('show');
      document.getElementById('spark-btn').textContent = '一起完成 ❤️';
      document.getElementById('spark-btn').classList.remove('done');
      state.sparkDone = false;
    }, 1200);
  }, 1000);

  scrollChatToBottom();
}

function addChatMessage(text, sender) {
  const messages = document.getElementById('chat-messages');
  const msg = document.createElement('div');
  msg.className = `msg ${sender}`;

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  const m = mascots[state.currentMascot];
  if (sender === 'mascot') {
    if (m.image) {
      avatar.innerHTML = `<img src="${m.image}" alt="${m.name}">`;
    } else {
      avatar.textContent = m.emoji;
    }
  } else {
    avatar.textContent = '🧒';
  }

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;

  msg.appendChild(avatar);
  msg.appendChild(bubble);
  messages.appendChild(msg);
  scrollChatToBottom();
}

function scrollChatToBottom() {
  const messages = document.getElementById('chat-messages');
  setTimeout(() => { messages.scrollTop = messages.scrollHeight; }, 50);
}

function updateChatAvatars() {
  // Refresh mascot avatar in existing messages - simplified: just note for future
}

// ========== PETAL COUNTER ==========
function addPetal() {
  state.petals++;
  document.getElementById('petal-count').textContent = state.petals;

  // Float +1 animation
  const counter = document.getElementById('petal-counter');
  const rect = counter.getBoundingClientRect();
  const phoneRect = document.getElementById('phone').getBoundingClientRect();
  const float = document.createElement('div');
  float.className = 'petal-float';
  float.textContent = '+1';
  float.style.left = (rect.left - phoneRect.left + rect.width/2 - 10) + 'px';
  float.style.top = (rect.top - phoneRect.top) + 'px';
  document.getElementById('phone').appendChild(float);
  setTimeout(() => float.remove(), 1100);

  // Update aurora intensity
  updateAuroraIntensity();
}

function updateAuroraIntensity() {
  const intensity = Math.min(state.petals / 30, 1);
  const aurora = document.getElementById('aurora-intensity');
  const glow = document.getElementById('island-glow');
  aurora.style.opacity = 0.3 + intensity * 0.7;
  glow.style.width = (200 + intensity * 80) + 'px';
  glow.style.opacity = 0.5 + intensity * 0.5;
}

// ========== SPARK TASK ==========
function completeSparkTask() {
  if (state.sparkDone) return;
  state.sparkDone = true;
  document.getElementById('spark-btn').textContent = '已完成 ✓';
  document.getElementById('spark-btn').classList.add('done');
  addPetal();

  // Show badge on current dock button
  const badge = document.getElementById(`badge-${state.currentMascot}`);
  if (badge) badge.classList.add('show');

  // Fireworks!
  createFireworks();

  // Close card after delay
  setTimeout(() => {
    document.getElementById('spark-card').classList.remove('show');
  }, 1500);
}

// ========== LONG PRESS MURMUR MODE ==========
function triggerMurmurMode() {
  state.longPressActive = true;
  state.murmurIndex = 0;
  const bubble = document.getElementById('speech-bubble');
  bubble.classList.add('show');
  showNextMurmur();

  // Show chat panel
  openChat();
  // Add mascot messages
  addMurmurMessage();

  // Auto stop after 30s
  setTimeout(() => {
    state.longPressActive = false;
    document.getElementById('speech-bubble').classList.remove('show');
  }, 30000);
}

function showNextMurmur() {
  if (state.murmurIndex >= murmurQuotes.length) {
    state.murmurIndex = 0;
  }
  const quote = murmurQuotes[state.murmurIndex];
  const bubbleText = document.getElementById('bubble-text');
  typeText(quote, bubbleText, () => {
    // Auto advance after delay
    if (state.longPressActive) {
      setTimeout(() => {
        if (state.longPressActive) {
          state.murmurIndex++;
          showNextMurmur();
          addMurmurMessage();
        }
      }, 3000);
    }
  });
}

function addMurmurMessage() {
  const quote = murmurQuotes[state.murmurIndex];
  addChatMessage(quote, 'mascot');
}

// ========== PARTY MODE (Bobo) ==========
function triggerPartyMode() {
  const overlay = document.getElementById('party-overlay');
  overlay.classList.add('show');

  // All dock buttons shake
  document.querySelectorAll('.dock-btn').forEach(btn => {
    btn.classList.add('party');
  });

  // Music notes and rainbows
  const phone = document.getElementById('phone');
  for (let i = 0; i < 15; i++) {
    setTimeout(() => {
      const note = document.createElement('div');
      note.className = 'music-note';
      note.textContent = ['🎵','🎶','🎵','🎶','♫'][Math.floor(Math.random()*5)];
      note.style.left = (Math.random() * 80 + 10) + '%';
      note.style.top = (Math.random() * 40 + 30) + '%';
      note.style.setProperty('--nx', (Math.random()*80-40) + 'px');
      note.style.animationDuration = (1 + Math.random()) + 's';
      phone.appendChild(note);
      setTimeout(() => note.remove(), 2000);
    }, i * 150);
  }

  // Rainbow arcs
  for (let i = 0; i < 6; i++) {
    setTimeout(() => {
      const arc = document.createElement('div');
      arc.className = 'rainbow-arc';
      const colors = ['#FF69B4','#FFB347','#FFD700','#4ECDC4','#7B68EE','#9370DB'];
      arc.style.borderColor = `transparent transparent ${colors[i%colors.length]} ${colors[(i+1)%colors.length]}`;
      arc.style.left = (Math.random() * 70 + 15) + '%';
      arc.style.top = (Math.random() * 30 + 25) + '%';
      phone.appendChild(arc);
      setTimeout(() => arc.remove(), 1500);
    }, i * 200);
  }

  // Mascot container shake
  const mc = document.getElementById('mascot-container');
  mc.classList.add('party');

  setTimeout(() => {
    overlay.classList.remove('show');
    document.querySelectorAll('.dock-btn').forEach(btn => btn.classList.remove('party'));
    mc.classList.remove('party');
    mc.className = '';
  }, 3000);
}

// ========== EASTER EGG ==========
function triggerEasterEgg() {
  const phone = document.getElementById('phone');
  // All mascots party
  const mc = document.getElementById('mascot-container');
  mc.classList.add('party');

  // Dock buttons party
  document.querySelectorAll('.dock-btn').forEach(btn => {
    btn.style.animation = 'mascotParty 0.3s ease-in-out infinite';
    btn.style.filter = `hue-rotate(${Math.random()*360}deg)`;
  });

  // Massive fireworks
  for (let wave = 0; wave < 3; wave++) {
    setTimeout(() => createFireworks(20), wave * 500);
  }

  // Lots of hearts and stars
  const emojis = ['❤️','💖','⭐','✨','🌟','💜','🩷','💫'];
  for (let i = 0; i < 25; i++) {
    setTimeout(() => {
      const p = document.createElement('div');
      p.className = 'particle';
      p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      p.style.left = (Math.random()*80 + 10) + '%';
      p.style.top = (Math.random()*60 + 10) + '%';
      p.style.fontSize = (16 + Math.random()*16) + 'px';
      p.style.setProperty('--tx', (Math.random()*200-100) + 'px');
      p.style.setProperty('--ty', (-50 - Math.random()*150) + 'px');
      p.style.setProperty('--rot', (Math.random()*720-360) + 'deg');
      p.style.animationDuration = (0.8 + Math.random()*0.8) + 's';
      phone.appendChild(p);
      setTimeout(() => p.remove(), 2000);
    }, i * 80);
  }

  // Screen flash
  const overlay = document.getElementById('party-overlay');
  overlay.style.background = 'radial-gradient(circle,rgba(255,105,180,0.3),rgba(78,205,196,0.2))';
  overlay.classList.add('show');

  setTimeout(() => {
    mc.className = '';
    document.querySelectorAll('.dock-btn').forEach(btn => {
      btn.style.animation = '';
      btn.style.filter = '';
    });
    overlay.classList.remove('show');
    overlay.style.background = '';
  }, 3500);
}

// ========== PARTICLE EFFECTS ==========
function createFireworks(count = 12) {
  const phone = document.getElementById('phone');
  const mc = document.getElementById('mascot-container');
  const mcRect = mc.getBoundingClientRect();
  const phoneRect = document.getElementById('phone').getBoundingClientRect();
  const cx = mcRect.left - phoneRect.left + mcRect.width/2;
  const cy = mcRect.top - phoneRect.top + mcRect.height/2;

  const emojis = ['✨','⭐','🌟','💫','🎉','🎊','❤️','🩷','💜'];
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    p.style.fontSize = (14 + Math.random()*12) + 'px';
    const angle = (Math.PI * 2 * i) / count;
    const dist = 60 + Math.random() * 80;
    p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
    p.style.setProperty('--rot', (Math.random()*360) + 'deg');
    p.style.animationDuration = (0.6 + Math.random()*0.6) + 's';
    phone.appendChild(p);
    setTimeout(() => p.remove(), 1500);
  }
}

function createPaperPlane() {
  const phone = document.getElementById('phone');
  const mc = document.getElementById('mascot-container');
  const mcRect = mc.getBoundingClientRect();
  const phoneRect = document.getElementById('phone').getBoundingClientRect();
  const cx = mcRect.left - phoneRect.left + mcRect.width/2;
  const cy = mcRect.top - phoneRect.top + mcRect.height/3;

  for (let i = 0; i < 3; i++) {
    setTimeout(() => {
      const plane = document.createElement('div');
      plane.className = 'paper-plane';
      plane.textContent = '✈️';
      plane.style.left = cx + 'px';
      plane.style.top = cy + 'px';
      phone.appendChild(plane);
      setTimeout(() => plane.remove(), 2200);
    }, i * 300);
  }
}
