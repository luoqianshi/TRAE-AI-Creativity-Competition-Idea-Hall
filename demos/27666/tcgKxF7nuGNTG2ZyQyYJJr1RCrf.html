<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>“黄胡子雷叔”AI互动绘本生成平台 - Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #F8F9FD;
        }
        .dribbble-shadow {
            box-shadow: 0px 10px 30px rgba(108, 93, 211, 0.05), 0px 1px 3px rgba(0, 0, 0, 0.02);
        }
        .glow-btn {
            transition: all 0.3s ease;
        }
        .glow-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0px 8px 20px rgba(108, 93, 211, 0.3);
        }
    </style>
</head>
<body class="text-slate-800 antialiased">

    <!-- Top Navigation -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-100 px-6 py-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-[#6C5DD3] rounded-2xl flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-[#6C5DD3]/20">
                    🧔
                </div>
                <div>
                    <span class="font-bold text-lg tracking-tight block text-slate-900">黄胡子雷叔</span>
                    <span class="text-xs text-slate-400 font-medium">AI 互动绘本平台</span>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <span class="text-sm bg-purple-50 text-[#6C5DD3] px-3 py-1.5 rounded-full font-medium">✨ 创意大赛演示版</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Column: Generator Workspace (6 Columns) -->
        <div class="lg:col-span-5 bg-white p-6 rounded-[32px] dribbble-shadow border border-slate-100 flex flex-col justify-between h-[calc(100vh-160px)] min-h-[600px]">
            <div>
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                        <span>🪄</span> 故事灵感生成器
                    </h2>
                    <span class="text-xs text-slate-400 bg-slate-100 px-2.5 py-1 rounded-md font-mono">Auto Workflow</span>
                </div>

                <!-- Step 1: Character -->
                <div class="mb-5">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">1. 选择主角形象</label>
                    <div class="grid grid-cols-3 gap-3">
                        <button onclick="selectCharacter('雷叔')" id="char-1" class="border-2 border-[#6C5DD3] bg-purple-50/50 p-3 rounded-2xl text-center transition-all">
                            <div class="text-2xl mb-1">🧔</div>
                            <div class="text-xs font-bold text-slate-800">黄胡子雷叔</div>
                        </button>
                        <button onclick="selectCharacter('小恐龙')" id="char-2" class="border-2 border-slate-100 hover:border-purple-200 p-3 rounded-2xl text-center transition-all">
                            <div class="text-2xl mb-1">🦖</div>
                            <div class="text-xs font-bold text-slate-600">太空小恐龙</div>
                        </button>
                        <button onclick="selectCharacter('机械狗')" id="char-3" class="border-2 border-slate-100 hover:border-purple-200 p-3 rounded-2xl text-center transition-all">
                            <div class="text-2xl mb-1">🤖</div>
                            <div class="text-xs font-bold text-slate-600">发光机械狗</div>
                        </button>
                    </div>
                </div>

                <!-- Step 2: Prompt Input -->
                <div class="mb-5">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">2. 输入今晚的奇思妙想</label>
                    <textarea id="story-prompt" rows="3" class="w-full bg-slate-50/70 border border-slate-200 rounded-2xl p-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#6C5DD3]/20 focus:border-[#6C5DD3] transition-all resize-none" placeholder="例如：在月球上开一家会飞的汉堡店，但是面包飞走了..."></textarea>
                    
                    <!-- Quick tags -->
                    <div class="flex flex-wrap gap-1.5 mt-2">
                        <button onclick="setPrompt('在火星上举办一场街头健身比赛，大家都飘起来了')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-2.5 py-1 rounded-lg transition-colors">🔥 火星健身</button>
                        <button onclick="setPrompt('雷叔带着魔法画笔，把墙上的涂鸦变成了真的小动物')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-2.5 py-1 rounded-lg transition-colors">🎨 魔法涂鸦</button>
                    </div>
                </div>

                <!-- Step 3: Visual Style -->
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">3. 插画视觉画风</label>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl border border-slate-100">
                            <div class="w-4 h-4 rounded-full bg-[#FF7A00]"></div>
                            <span class="text-xs font-medium text-slate-700">Dribbble 糖果色系</span>
                        </div>
                        <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl border border-slate-100 opacity-60">
                            <div class="w-4 h-4 rounded-full bg-[#4A90E2]"></div>
                            <span class="text-xs font-medium text-slate-500">经典复古绘本</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Generate Button -->
            <button onclick="generateBook()" class="w-full bg-[#6C5DD3] text-white py-4 rounded-2xl font-bold tracking-wide glow-btn flex items-center justify-center gap-2 text-sm shadow-lg shadow-[#6C5DD3]/10">
                <span>⚡</span> 一键生成互动绘本 (n8n + ComfyUI)
            </button>
        </div>

        <!-- Right Column: Interactive Book Preview (7 Columns) -->
        <div class="lg:col-span-7 flex flex-col gap-4">
            
            <!-- Book Container -->
            <div class="bg-[#FFF4E8] rounded-[32px] p-8 dribbble-shadow border border-orange-100/50 flex flex-col justify-between min-h-[500px] relative overflow-hidden transition-all duration-500" id="book-canvas">
                
                <!-- Top Badge -->
                <div class="flex justify-between items-center mb-6 z-10">
                    <span class="bg-white/80 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-bold text-orange-600 border border-orange-200/40" id="book-title">
                        《黄胡子雷叔的梦境冒险》
                    </span>
                    <span class="text-xs font-bold text-orange-700/60 font-mono bg-orange-100/40 px-2 py-0.5 rounded-md" id="page-number">PAGE 1 / 3</span>
                </div>

                <!-- Image Placeholder (ComfyUI Visual Mock) -->
                <div class="w-full h-64 bg-white/60 rounded-2xl border-4 border-white shadow-sm flex flex-col items-center justify-center relative overflow-hidden mb-6 group">
                    <div class="absolute inset-0 bg-gradient-to-tr from-purple-100/40 via-amber-100/30 to-transparent"></div>
                    
                    <!-- Simulated Dynamic Graphic -->
                    <div id="graphic-avatar" class="text-7xl mb-2 filter drop-shadow-md transform transition-transform group-hover:scale-110 duration-300">🧔</div>
                    <div id="graphic-scene" class="text-sm font-bold text-orange-800/80 tracking-wide px-4 text-center">正在月球基地漫步...</div>
                    
                    <!-- Decorative Elements -->
                    <div class="absolute top-4 right-4 text-xl opacity-30 animate-pulse">⭐</div>
                    <div class="absolute bottom-4 left-4 text-xl opacity-30">☁️</div>
                </div>

                <!-- Story Text Box -->
                <div class="bg-white/90 backdrop-blur-sm p-5 rounded-2xl border border-orange-100 shadow-sm z-10">
                    <p class="text-base text-slate-800 leading-relaxed font-medium transition-all duration-300" id="story-text">
                        夜深了，黄胡子雷叔摸了摸他闪闪发亮的金色胡须。今天，他决定和小朋友们一起乘着由一万只彩色气球拉动的飞行工作室，飞向那颗由爆米花组成的神秘星球……
                    </p>
                </div>

                <!-- Background Subtle Shapes -->
                <div class="absolute -right-12 -bottom-12 w-40 h-40 bg-orange-200/20 rounded-full blur-2xl"></div>
                <div class="absolute -left-12 -top-12 w-32 h-32 bg-purple-200/20 rounded-full blur-2xl"></div>
            </div>

            <!-- Pagination Control Bar -->
            <div class="bg-white p-4 rounded-2xl dribbble-shadow border border-slate-100 flex justify-between items-center">
                <button onclick="prevPage()" class="px-4 py-2 border border-slate-200 hover:bg-slate-50 rounded-xl text-xs font-bold text-slate-600 transition-colors">
                    ⬅️ 上一页
                </button>
                <div class="flex gap-1">
                    <span id="dot-1" class="w-2 h-2 rounded-full bg-[#6C5DD3]"></span>
                    <span id="dot-2" class="w-2 h-2 rounded-full bg-slate-200"></span>
                    <span id="dot-3" class="w-2 h-2 rounded-full bg-slate-200"></span>
                </div>
                <button onclick="nextPage()" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-bold transition-colors">
                    下一页 ➡️
                </button>
            </div>

        </div>

    </main>

    <!-- Footer Meta -->
    <footer class="max-w-6xl mx-auto px-4 py-6 text-center text-xs text-slate-400 font-medium">
        TRAE Work Auto-generated Prototype Layout • 响应式高级 UI 交互演示
    </footer>

    <!-- Prototype Logic Script -->
    <script>
        let currentCharacter = '雷叔';
        let currentPage = 1;

        // Mock Database for demo interaction
        const storyData = {
            '雷叔': [
                { text: "夜深了，黄胡子雷叔摸了摸他闪闪发亮的金色胡须。今天，他决定和小朋友们一起乘着飞行工作室，飞向那颗由爆米花组成的神秘星球……", scene: "正在准备起飞...", icon: "🧔", bg: "#FFF4E8" },
                { text: "“快看！”雷叔指着窗外。无数由大语言模型变成的彩色小精灵正围着飞船跳舞，它们身上还散发着暖洋洋的粉紫色光芒呢！", scene: "穿越星际迷雾...", icon: "✨", bg: "#F3E8FF" },
                { text: "飞船稳稳落在了爆米花星球上。雷叔笑着对身旁的孩子说：“看，只要敢想象，我们的代码和创意就能变成最棒的童话世界！”", scene: "成功登陆星球！", icon: "🚀", bg: "#E8F5FF" }
            ],
            '小恐龙': [
                { text: "太空小恐龙嘟嘟最喜欢在银河系里找好吃的。今天它背上小火箭，打算去寻找传说中会飞的超级大汉堡。", scene: "嘟嘟整装待发...", icon: "🦖", bg: "#E8F8F5" },
                { text: "可是刚飞到月球，嘟嘟就发现汉堡的面包片因为没有引力，啪嗒啪嗒全都向四面八方飘走了！它急得尾巴直摇。", scene: "糟糕，汉堡飞走了！", icon: "🍔", bg: "#FEF9E7" },
                { text: "就在这时，它遇到了正在散步的机械狗。机械狗伸出磁力抓手，瞬间把面包片全吸了回来，太棒啦！", scene: "美味汉堡合体！", icon: "🎉", bg: "#EAF2F8" }
            ]
        };

        function selectCharacter(name) {
            currentCharacter = name === '雷叔' ? '雷叔' : '小恐龙';
            currentPage = 1;
            
            // UI Switch Toggle
            for(let i=1; i<=3; i++) {
                const btn = document.getElementById(`char-${i}`);
                btn.className = "border-2 border-slate-100 hover:border-purple-200 p-3 rounded-2xl text-center transition-all";
                btn.querySelector('div:last-child').className = "text-xs font-bold text-slate-600";
            }
            const activeId = name === '雷叔' ? 'char-1' : (name === '小恐龙' ? 'char-2' : 'char-3');
            const activeBtn = document.getElementById(activeId);
            activeBtn.className = "border-2 border-[#6C5DD3] bg-purple-50/50 p-3 rounded-2xl text-center transition-all";
            activeBtn.querySelector('div:last-child').className = "text-xs font-bold text-slate-800";
            
            updateBookView();
        }

        function setPrompt(text) {
            document.getElementById('story-prompt').value = text;
        }

        function generateBook() {
            const prompt = document.getElementById('story-prompt').value;
            if(!prompt) {
                alert("请输入或选择一个故事灵感创意吧！");
                return;
            }
            alert("✨ [n8n Workflow 触发成功]\n已将输入同步至大模型及 ComfyUI 绘本生工作流！正在渲染 Dribbble 画风的高清绘本页...");
            currentPage = 1;
            updateBookView();
        }

        function updateBookView() {
            const dataPool = storyData[currentCharacter] || storyData['雷叔'];
            const pageData = dataPool[currentPage - 1];

            // Update DOM Elements with smooth feedback
            document.getElementById('book-title').innerText = `《${currentCharacter}的奇幻绘本故事》`;
            document.getElementById('page-number').innerText = `PAGE ${currentPage} / 3`;
            document.getElementById('graphic-avatar').innerText = pageData.icon;
            document.getElementById('graphic-scene').innerText = pageData.scene;
            document.getElementById('story-text').innerText = pageData.text;
            document.getElementById('book-canvas').style.backgroundColor = pageData.bg;

            // Dots update
            for(let i=1; i<=3; i++) {
                document.getElementById(`dot-${i}`).className = `w-2 h-2 rounded-full ${i === currentPage ? 'bg-[#6C5DD3]' : 'bg-slate-200'}`;
            }
        }

        function nextPage() {
            if(currentPage < 3) {
                currentPage++;
                updateBookView();
            } else {
                alert("✨ 本篇绘本已播放完毕，快去输入新的创意灵感，生成下一个故事吧！");
            }
        }

        function prevPage() {
            if(currentPage > 1) {
                currentPage--;
                updateBookView();
            }
        }
    </script>
</body>
</html>
