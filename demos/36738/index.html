<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>种花得花</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Microsoft YaHei", sans-serif;
      background: #FAF6F0;
      color: #3D3229;
      min-height: 100vh;
    }

    /* ===== 导航栏 ===== */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #e8e0d4;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
    }
    .navbar h1 { font-size: 20px; color: #2D5A27; }
    .nav-btns { display: flex; gap: 8px; }
    .nav-btns button {
      padding: 6px 16px; border: none; border-radius: 20px;
      cursor: pointer; font-size: 14px; transition: all 0.2s;
    }
    .btn-ghost { background: transparent; color: #5a5a5a; }
    .btn-ghost:hover { background: #f0ece4; }
    .btn-primary { background: #2D5A27; color: white; }
    .btn-primary:hover { background: #234a1e; }

    /* ===== 页面容器 ===== */
    main { padding: 80px 24px 40px; max-width: 1000px; margin: 0 auto; min-height: calc(100vh - 80px); }
    .page { display: none; }
    .page.active { display: block; }

    /* ===== 花园页面 ===== */
    .garden-header {
      text-align: center; margin-bottom: 32px;
    }
    .garden-header h2 {
      font-size: 28px; color: #2D5A27; margin-bottom: 6px;
    }
    .garden-header p { color: #7A6F63; font-size: 14px; }

    .plant-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    /* ===== 植物卡片 ===== */
    .plant-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      position: relative;
    }
    .plant-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }

    .plant-svg-wrap {
      width: 140px; height: 180px; margin: 0 auto 12px;
    }

    .plant-name {
      font-size: 16px; font-weight: 600; margin-bottom: 4px;
    }
    .plant-stage {
      font-size: 13px; color: #7A6F63; margin-bottom: 10px;
    }

    /* 进度条 */
    .progress-bar {
      width: 100%; height: 8px; border-radius: 4px;
      background: #eee; overflow: hidden; margin-bottom: 8px;
    }
    .progress-bar .fill {
      height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, #4A7C59, #E8A838);
      transition: width 0.5s ease;
    }
    .progress-text { font-size: 12px; color: #999; margin-bottom: 8px; }

    .countdown {
      font-size: 13px; font-weight: 600;
      padding: 4px 12px; border-radius: 12px; display: inline-block;
    }
    .countdown.normal { background: #f0f7ee; color: #2D5A27; }
    .countdown.urgent { background: #fef0ef; color: #c0392b; }
    .countdown.done { background: #fff8e1; color: #E8A838; }

    .card-actions {
      margin-top: 12px; display: flex; gap: 6px; justify-content: center;
    }
    .card-actions button {
      padding: 4px 14px; border: 1px solid #ddd; border-radius: 14px;
      background: white; cursor: pointer; font-size: 12px;
    }
    .card-actions button.harvest {
      background: #E8A838; color: white; border-color: #E8A838;
    }
    .card-actions button.danger {
      color: #c0392b; border-color: #f5c6cb;
    }

    /* 成熟卡片高亮 */
    .card-mature {
      border: 2px solid #E8A838;
      box-shadow: 0 4px 20px rgba(232,168,56,0.25);
      animation: maturePulse 2s ease-in-out infinite;
    }
    @keyframes maturePulse {
      0%, 100% { box-shadow: 0 4px 20px rgba(232,168,56,0.25); }
      50% { box-shadow: 0 4px 28px rgba(232,168,56,0.45); }
    }
    .mature-badge {
      position: absolute; top: -10px; right: -6px;
      background: #E8A838; color: white;
      font-size: 11px; font-weight: 700;
      padding: 3px 12px; border-radius: 12px;
      z-index: 5;
    }

    /* 空状态 */
    .empty-state {
      text-align: center; padding: 60px 20px; color: #999;
    }
    .empty-state .emoji { font-size: 64px; margin-bottom: 16px; }
    .empty-state h3 { color: #555; margin-bottom: 8px; }
    .empty-state p { font-size: 14px; line-height: 1.6; }

    /* ===== 种植表单 ===== */
    .form-card {
      background: white; border-radius: 16px; padding: 32px;
      max-width: 520px; margin: 0 auto;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .form-card h2 { text-align: center; color: #2D5A27; margin-bottom: 24px; }

    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block; font-weight: 600; font-size: 14px;
      margin-bottom: 6px; color: #444;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 10px 14px; border: 1px solid #ddd;
      border-radius: 10px; font-size: 14px; font-family: inherit;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus,
    .form-group select:focus {
      outline: none; border-color: #4A7C59;
    }
    .form-group textarea { resize: vertical; min-height: 72px; }

    /* 种子选择器 */
    .seed-selector { display: flex; gap: 10px; flex-wrap: wrap; }
    .seed-option {
      width: 76px; text-align: center; padding: 10px 6px;
      border: 2px solid #eee; border-radius: 12px;
      cursor: pointer; transition: all 0.2s;
    }
    .seed-option.selected {
      border-color: #4A7C59; background: #f6faf4;
    }
    .seed-option .emoji { font-size: 28px; }
    .seed-option .name { font-size: 11px; margin-top: 4px; color: #666; }

    .submit-btn {
      width: 100%; padding: 12px; background: #2D5A27; color: white;
      border: none; border-radius: 12px; font-size: 16px; font-weight: 600;
      cursor: pointer; margin-top: 8px;
    }
    .submit-btn:hover { background: #234a1e; }

    /* ===== 仓库 ===== */
    .stats-row {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: white; border-radius: 12px; padding: 18px;
      text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .stat-card .num { font-size: 28px; font-weight: 700; color: #2D5A27; }
    .stat-card .label { font-size: 13px; color: #999; margin-top: 2px; }

    .fruit-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    .fruit-card {
      background: white; border-radius: 14px; padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .fruit-card .emoji { font-size: 36px; text-align: center; }
    .fruit-card .name { font-weight: 600; text-align: center; margin-top: 6px; }
    .fruit-card .info { font-size: 12px; color: #999; text-align: center; margin-top: 4px; }

    /* ===== 枯萎园 ===== */
    .withered-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .withered-card {
      background: #f5efe6; border-radius: 14px; padding: 18px;
      text-align: center; opacity: 0.75;
    }
    .withered-card .name { font-weight: 600; color: #8B7355; }
    .withered-card .info { font-size: 12px; color: #aaa; margin-top: 4px; }

    /* ===== 详情弹窗 ===== */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.35); z-index: 200;
      justify-content: center; align-items: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: white; border-radius: 20px; padding: 28px;
      max-width: 420px; width: 90%;
      box-shadow: 0 16px 48px rgba(0,0,0,0.15);
    }
    .modal h3 { color: #2D5A27; margin-bottom: 12px; text-align: center; }
    .modal .desc { color: #666; font-size: 14px; line-height: 1.7; margin-bottom: 16px; }
    .modal .close-btn {
      display: block; margin: 0 auto; padding: 8px 28px;
      background: #f0f0f0; border: none; border-radius: 20px;
      cursor: pointer;
    }

    /* ===== 页面底部快速导航 ===== */
    .page-footer {
      margin-top: 36px; padding-top: 20px;
      border-top: 1px solid #e8e0d4;
      display: flex; justify-content: center; gap: 24px; flex-wrap: wrap;
    }
    .page-footer a {
      color: #7A6F63; text-decoration: none; font-size: 14px;
      padding: 6px 16px; border-radius: 16px; border: 1px solid #e8e0d4;
      transition: all 0.2s; cursor: pointer;
    }
    .page-footer a:hover {
      background: #2D5A27; color: white; border-color: #2D5A27;
    }
  </style>
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar">
  <h1>🌱 种花得花</h1>
  <div class="nav-btns">
    <button class="btn-ghost" onclick="showPage('garden')">🌸 花园</button>
    <button class="btn-ghost" onclick="showPage('plant')">🌰 种植</button>
    <button class="btn-ghost" onclick="showPage('warehouse')">📦 仓库</button>
    <button class="btn-ghost" onclick="showPage('withered')">🥀 枯萎园</button>
  </div>
</nav>

<main>
  <!-- 花园页 -->
  <div id="page-garden" class="page active">
    <div class="garden-header">
      <h2>我的花园</h2>
      <p>每一颗种子都是一份期待，用心浇灌，静待花开 🌸</p>
    </div>
    <div id="garden-grid" class="plant-grid"></div>
    <div class="page-footer">
      <a onclick="showPage('plant')">🌰 去种植新目标</a>
      <a onclick="showPage('warehouse')">📦 查看仓库</a>
      <a onclick="showPage('withered')">🥀 枯萎园</a>
    </div>
  </div>

  <!-- 种植页 -->
  <div id="page-plant" class="page">
    <div class="form-card">
      <h2>🌰 种下一颗新种子</h2>
      <form id="plant-form" onsubmit="handlePlant(event)">
        <div class="form-group">
          <label>目标名称 *</label>
          <input id="goal-name" type="text" placeholder="例如：30天养成阅读习惯" required>
        </div>
        <div class="form-group">
          <label>目标描述（可选）</label>
          <textarea id="goal-desc" placeholder="写下你的目标和动力..."></textarea>
        </div>
        <div class="form-group">
          <label>截止日期 *</label>
          <input id="goal-deadline" type="datetime-local" required>
        </div>
        <div class="form-group">
          <label>选择种子类型</label>
          <div class="seed-selector" id="seed-selector"></div>
        </div>
        <button type="submit" class="submit-btn">种下这颗种子 🌱</button>
      </form>
    </div>
    <div class="page-footer">
      <a onclick="showPage('garden')">🌸 返回花园</a>
      <a onclick="showPage('warehouse')">📦 查看仓库</a>
      <a onclick="showPage('withered')">🥀 枯萎园</a>
    </div>
  </div>

  <!-- 仓库页 -->
  <div id="page-warehouse" class="page">
    <div class="garden-header">
      <h2>🍎 果实仓库</h2>
      <p>每一个收获都值得被珍藏 ✨</p>
    </div>
    <div id="stats-row" class="stats-row"></div>
    <div id="fruit-grid" class="fruit-grid"></div>
    <div class="page-footer">
      <a onclick="showPage('garden')">🌸 返回花园</a>
      <a onclick="showPage('plant')">🌰 种植新目标</a>
      <a onclick="showPage('withered')">🥀 枯萎园</a>
    </div>
  </div>

  <!-- 枯萎园 -->
  <div id="page-withered" class="page">
    <div class="garden-header">
      <h2>🥀 枯萎园</h2>
      <p>每一段旅程都有终点，感谢曾经的陪伴</p>
    </div>
    <div id="withered-grid" class="withered-grid"></div>
    <div class="page-footer">
      <a onclick="showPage('garden')">🌸 返回花园</a>
      <a onclick="showPage('plant')">🌰 种植新目标</a>
      <a onclick="showPage('warehouse')">📦 查看仓库</a>
    </div>
  </div>
</main>

<!-- 详情弹窗 -->
<div class="modal-overlay" id="detail-modal" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <button class="close-btn" onclick="document.getElementById('detail-modal').classList.remove('show')">关闭</button>
  </div>
</div>

<script>
// ========== 数据定义 ==========
const SEED_TYPES = [
  { id: 'sunflower', name: '向日葵', emoji: '🌻', color: '#E8A838' },
  { id: 'sakura',   name: '樱花',   emoji: '🌸', color: '#FFB7C5' },
  { id: 'rose',     name: '玫瑰',   emoji: '🌹', color: '#D4858A' },
  { id: 'cactus',   name: '仙人掌', emoji: '🌵', color: '#4DB6AC' },
  { id: 'lavender', name: '薰衣草', emoji: '💜', color: '#9575CD' },
];

const STAGE_NAMES = ['种子', '发芽', '幼苗', '成长', '开花', '结果', '成熟'];
const STAGE_EMOJIS = ['🌰', '🌱', '🌿', '🪴', '🌸', '🫛', '🍎'];

// 状态
let plants = [];
let fruits = [];
let witheredPlants = [];
let selectedSeed = SEED_TYPES[0].id;

// 从 localStorage 加载
function loadData() {
  try {
    const d = JSON.parse(localStorage.getItem('garden-data') || '{}');
    plants = d.plants || [];
    fruits = d.fruits || [];
    witheredPlants = d.withered || [];
  } catch(e) {}
}
function saveData() {
  localStorage.setItem('garden-data', JSON.stringify({ plants, fruits, witheredPlants }));
}

// ========== 工具函数 ==========
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function calcProgress(created, deadline) {
  const total = new Date(deadline) - new Date(created);
  if (total <= 0) return 100;
  const elapsed = Date.now() - new Date(created).getTime();
  return Math.min(100, Math.max(0, (elapsed / total) * 100));
}

function getStage(progress) {
  const t = [0, 10, 25, 45, 70, 90, 100];
  for (let i = t.length - 1; i >= 0; i--) if (progress >= t[i]) return i;
  return 0;
}

function formatTimeRemaining(deadline) {
  const diff = new Date(deadline) - Date.now();
  if (diff <= 0) return { text: '已到期', cls: 'done' };
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor(diff / 3600000);
  if (days > 0) return { text: `还剩 ${days} 天`, cls: 'normal' };
  if (hours > 0) return { text: `还剩 ${hours} 小时`, cls: hours < 24 ? 'urgent' : 'normal' };
  return { text: '即将到期', cls: 'urgent' };
}

function formatRelative(dateStr) {
  const diff = Date.now() - new Date(dateStr).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 60) return `${mins} 分钟前`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs} 小时前`;
  return `${Math.floor(hrs / 24)} 天前`;
}

function getSeedById(id) { return SEED_TYPES.find(s => s.id === id) || SEED_TYPES[0]; }

// ========== 植物SVG绘制 ==========
function renderPlantSVG(seedType, stage, isWithered) {
  const c = isWithered ? '#8B7355' : seedType.color;
  const stemColor = isWithered ? '#6B5344' : '#4A7C59';
  const leafColor = isWithered ? '#7A6B5A' : '#5D9C6B';
  // 各阶段参数：茎高、叶数、是否有花/果
  const configs = [
    { h: 0, leaves: 0, flower: false, fruit: false },  // 0 种子
    { h: 25, leaves: 2, flower: false, fruit: false },  // 1 发芽
    { h: 50, leaves: 3, flower: false, fruit: false },  // 2 幼苗
    { h: 85, leaves: 5, flower: false, fruit: false },  // 3 成长
    { h: 105, leaves: 5, flower: true, fruit: false },  // 4 开花
    { h: 110, leaves: 5, flower: true, fruit: true, fruitSize: 10 },  // 5 结果
    { h: 115, leaves: 6, flower: true, fruit: true, fruitSize: 16 },  // 6 成熟
  ];
  const cfg = configs[stage] || configs[0];

  let svg = `<svg viewBox="0 0 140 180" xmlns="http://www.w3.org/2000/svg">`;

  // 土壤
  svg += `<ellipse cx="70" cy="168" rx="55" ry="10" fill="#5D4037"/>`;
  svg += `<ellipse cx="70" cy="165" rx="48" ry="7" fill="#6D4C41"/>`;

  if (stage === 0) {
    // 种子 - 土壤中的椭圆
    svg += `<ellipse cx="70" cy="162" rx="10" ry="6" fill="${c}" opacity="0.85"/>`;
    svg += `<ellipse cx="68" cy="160" rx="4" ry="2" fill="rgba(255,255,255,0.25)"/>`;
  } else {
    // 茎
    const baseY = 165;
    const topY = baseY - cfg.h;
    svg += `<path d="M${70},${baseY} Q${68},${baseY - cfg.h/2} ${70},${topY}" stroke="${stemColor}" stroke-width="${stage < 2 ? 2 : 3.5}" fill="none" stroke-linecap="round"/>`;

    // 叶子
    for (let i = 0; i < cfg.leaves; i++) {
      const ratio = (i + 1) / (cfg.leaves + 1);
      const ly = baseY - cfg.h * ratio;
      const side = i % 2 === 0 ? 1 : -1;
      const leafSize = 8 + stage * 2;
      svg += `<ellipse cx="${70 + side * leafSize}" cy="${ly}" rx="${leafSize}" ry="${leafSize * 0.5}" fill="${leafColor}" transform="rotate(${side * 25}, ${70 + side * leafSize}, ${ly})" opacity="0.9"/>`;
    }

    // 花朵
    if (cfg.flower) {
      const petalCount = 6;
      const petalR = stage >= 5 ? 8 : 11;
      for (let p = 0; p < petalCount; p++) {
        const angle = (p / petalCount) * Math.PI * 2;
        const px = 70 + Math.cos(angle) * petalR;
        const py = topY - 5 + Math.sin(angle) * petalR;
        svg += `<circle cx="${px}" cy="${py}" r="${petalR * 0.7}" fill="${c}" opacity="0.85"/>`;
      }
      svg += `<circle cx="${70}" cy="${topY - 5}" r="5" fill="${isWithered ? '#8B7355': '#E8A838'}"/>`;
    }

    // 果实
    if (cfg.fruit) {
      const fs = cfg.fruitSize || 10;
      svg += `<circle cx="${70}" cy="${topY + (cfg.flower ? 14 : 0)}" r="${fs}" fill="${isWithered ? '#8B7355': seedType.color === '#E8A838' ? '#C4891A': seedType.color}" opacity="0.9"/>`;
      svg += `<ellipse cx="${67}" cy="${topY + (cfg.flower ? 14 : 0) - fs*0.3}" rx="${fs*0.3}" ry="${fs*0.15}" fill="rgba(255,255,255,0.3)" transform="rotate(-20, ${67}, ${topY})"/>`;
    }
  }

  svg += `</svg>`;
  return svg;
}

// ========== 渲染函数 ==========

// 自动收获：检查所有植物，到期/超期的自动收获
function autoHarvest() {
  let changed = false;
  plants = plants.filter(p => {
    const progress = calcProgress(p.createdAt, p.deadline);
    if (progress >= 100) {
      // 自动收获：果实进仓库，植株进枯萎园
      const duration = Math.round((Date.now() - new Date(p.createdAt).getTime()) / 3600000);
      fruits.push({
        id: genId(), plantId: p.id, goalName: p.goalName,
        seedTypeId: p.seedTypeId, harvestedAt: new Date().toISOString(),
        growthDuration: Math.max(1, duration),
      });
      witheredPlants.push({ ...p, status: 'dead' });
      changed = true;
      return false; // 从活跃列表移除
    }
    return true; // 保留在花园中
  });
  if (changed) saveData();
}

function renderGarden() {
  // 先执行自动收获检查
  autoHarvest();

  const grid = document.getElementById('garden-grid');

  if (plants.length === 0) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column: 1/-1;">
        <div class="emoji">🌱</div>
        <h3>花园还是空的</h3>
        <p>种下一颗种子，开始你的目标之旅吧！<br>每一个目标都值得被精心培育 ✨</p>
        <button class="btn-primary" style="margin-top:16px;padding:10px 28px;" onclick="showPage('plant')">去种植</button>
      </div>`;
    return;
  }

  grid.innerHTML = plants.map(p => {
    const progress = calcProgress(p.createdAt, p.deadline);
    const stage = getStage(progress);
    const seed = getSeedById(p.seedTypeId);
    const timeInfo = formatTimeRemaining(p.deadline);

    return `
      <div class="plant-card" onclick="showDetail('${p.id}')">
        <div class="plant-svg-wrap">${renderPlantSVG(seed, stage, false)}</div>
        <div class="plant-name">${p.goalName}</div>
        <div class="plant-stage">${STAGE_EMOJIS[stage]} ${STAGE_NAMES[stage]}</div>
        <div class="progress-bar"><div class="fill" style="width:${Math.min(progress,99.9)}%"></div></div>
        <div class="progress-text">${Math.round(progress)}%</div>
        <span class="countdown ${timeInfo.cls}">${timeInfo.text}</span>
        <div class="card-actions">
          <button class="harvest" onclick="event.stopPropagation();harvestPlant('${p.id}')">提前收获</button>
          <button class="danger" onclick="event.stopPropagation();removePlant('${p.id}')">放弃</button>
        </div>
      </div>`;
  }).join('');
}

function renderWarehouse() {
  const statsRow = document.getElementById('stats-row');
  const fruitGrid = document.getElementById('fruit-grid');

  statsRow.innerHTML = `
    <div class="stat-card"><div class="num">${fruits.length}</div><div class="label">总收获</div></div>
    <div class="stat-card"><div class="num">${fruits.length > 0 ? Math.max(...fruits.map(f => f.growthDuration)) + 'h' : '-'}</div><div class="label">最长目标</div></div>
    <div class="stat-card"><div class="num">${fruits.filter(f => {
      const m = new Date(f.harvestedAt);
      const now = new Date();
      return m.getMonth() === now.getMonth() && m.getFullYear() === now.getFullYear();
    }).length}</div><div class="label">本月完成</div></div>`;

  if (fruits.length === 0) {
    fruitGrid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="emoji">📦</div><h3>仓库空空的</h3><p>完成的目标会在这里变成果实，快去种下第一颗种子吧！</p></div>`;
    return;
  }

  fruitGrid.innerHTML = fruits.map(f => {
    const seed = getSeedById(f.seedTypeId);
    return `
      <div class="fruit-card">
        <div class="emoji">${seed.emoji}</div>
        <div class="name">${f.goalName}</div>
        <div class="info">${formatRelative(f.harvestedAt)} 收获 · 成长 ${f.growthDuration} 小时</div>
      </div>`;
  }).join('');
}

function renderWithered() {
  const grid = document.getElementById('withered-grid');
  if (witheredPlants.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="emoji">💚</div><h3>没有枯萎的植株</h3><p>太好了，说明你一直在坚持！</p></div>`;
    return;
  }
  grid.innerHTML = witheredPlants.map(p => {
    const seed = getSeedById(p.seedTypeId);
    const progress = calcProgress(p.createdAt, p.deadline);
    const stage = getStage(Math.min(progress, 100));
    return `
      <div class="withered-card">
        <div class="plant-svg-wrap" style="width:100px;height:130px;margin:0 auto 8px;">${renderPlantSVG(seed, stage, true)}</div>
        <div class="name">${p.goalName}</div>
        <div class="info">原定 ${new Date(p.deadline).toLocaleDateString()}</div>
        <button style="margin-top:8px;font-size:11px;padding:3px 12px;border:1px solid #ccc;border-radius:10px;background:none;cursor:pointer;" onclick="clearWithered('${p.id}')">清除记录</button>
      </div>`;
  }).join('');
}

// ========== 页面切换 ==========
function showPage(name) {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  if (name === 'garden') renderGarden();
  if (name === 'warehouse') renderWarehouse();
  if (name === 'withered') renderWithered();
  window.scrollTo(0, 0);
}

// ========== 操作函数 ==========
function handlePlant(e) {
  e.preventDefault();
  const name = document.getElementById('goal-name').value.trim();
  const desc = document.getElementById('goal-desc').value.trim();
  const deadline = document.getElementById('goal-deadline').value;
  if (!name || !deadline) return alert('请填写完整信息');

  plants.push({
    id: genId(),
    goalName: name,
    description: desc,
    seedTypeId: selectedSeed,
    createdAt: new Date().toISOString(),
    deadline: new Date(deadline).toISOString(),
    status: 'growing',
    currentStage: 0,
    progress: 0,
  });
  saveData();

  // 重置表单
  document.getElementById('plant-form').reset();
  setDefaultDeadline();
  alert('种子已种下！🌱\n"' + name + '" 开始生长了~');
  showPage('garden');
}

function harvestPlant(id) {
  const idx = plants.findIndex(p => p.id === id);
  if (idx === -1) return;
  const p = plants[idx];
  const duration = Math.round((Date.now() - new Date(p.createdAt).getTime()) / 3600000);

  fruits.push({
    id: genId(), plantId: id, goalName: p.goalName,
    seedTypeId: p.seedTypeId, harvestedAt: new Date().toISOString(),
    growthDuration: Math.max(1, duration),
  });
  witheredPlants.push({ ...p, status: 'dead' });
  plants.splice(idx, 1);
  saveData();
  alert('🎉 恭喜收获果实！\n"' + p.goalName + '" 已存入仓库！');
  renderGarden();
}

function removePlant(id) {
  if (!confirm('确定要放弃这个目标吗？植株将移入枯萎园。')) return;
  const idx = plants.findIndex(p => p.id === id);
  if (idx === -1) return;
  witheredPlants.push({ ...plants[idx], status: 'withering' });
  plants.splice(idx, 1);
  saveData();
  renderGarden();
}

function clearWithered(id) {
  witheredPlants = witheredPlants.filter(w => w.id !== id);
  saveData();
  renderWithered();
}

function showDetail(id) {
  const p = plants.find(pl => pl.id === id);
  if (!p) return;
  const progress = calcProgress(p.createdAt, p.deadline);
  const stage = getStage(progress);
  const seed = getSeedById(p.seedTypeId);

  document.getElementById('modal-title').textContent = seed.emoji + ' ' + p.goalName;
  document.getElementById('modal-body').innerHTML = `
    <div style="text-align:center;margin-bottom:12px;">${renderPlantSVG(seed, stage, false).replace(/width="140"/,'width="120"').replace(/height="180"/,'height="150"')}</div>
    <p class="desc"><strong>当前阶段：</strong>${STAGE_EMOJIS[stage]} ${STAGE_NAMES[stage]} (${Math.round(progress)}%)</p>
    ${p.description ? `<p class="desc"><strong>描述：</strong>${p.description}</p>` : ''}
    <p class="desc"><strong>种植时间：</strong>${new Date(p.createdAt).toLocaleString()}</p>
    <p class="desc"><strong>截止时间：</strong>${new Date(p.deadline).toLocaleString()}</p>
    <p class="desc"><strong>剩余：</strong>${formatTimeRemaining(p.deadline).text}</p>`;
  document.getElementById('detail-modal').classList.add('show');
}

function closeModal(e) {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('show');
}

// ========== 种子选择器渲染 ==========
function renderSeedSelector() {
  const container = document.getElementById('seed-selector');
  container.innerHTML = SEED_TYPES.map(s => `
    <div class="seed-option ${s.id === selectedSeed ? 'selected' : ''}"
         onclick="selectSeed('${s.id}', this)">
      <div class="emoji">${s.emoji}</div>
      <div class="name">${s.name}</div>
    </div>
  `).join('');
}

function selectSeed(id, el) {
  selectedSeed = id;
  document.querySelectorAll('.seed-option').forEach(d => d.classList.remove('selected'));
  el.classList.add('selected');
}

function setDefaultDeadline() {
  const d = new Date();
  d.setDate(d.getDate() + 7);
  const pad = n => String(n).padStart(2, '0');
  document.getElementById('goal-deadline').value =
    `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T12:00`;
}

// ========== 初始化 ==========
loadData();
renderSeedSelector();
setDefaultDeadline();
renderGarden();

// 定时刷新（每10秒检查一次，确保及时自动收获）
setInterval(() => { renderGarden(); }, 10000);
</script>

</body>
</html>
