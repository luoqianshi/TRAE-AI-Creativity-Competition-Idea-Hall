<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>知效</title>
  <style>
    :root {
      --bg-page: #f5f6fa;
      --bg-card: #ffffff;
      --bg-nav: rgba(255,255,255,0.92);
      --text-primary: #1a1a2e;
      --text-secondary: #8a8f9d;
      --text-tertiary: #b0b3be;
      --text-inverse: #ffffff;
      --accent: #5e6ad2;
      --accent-light: #eef0fe;
      --accent-gradient: linear-gradient(135deg, #5e6ad2, #8b5cf6);
      --success: #34d399;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #3b82f6;
      --border: #e8e8ef;
      --divider: #f0f0f5;
      --shadow-card: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
      --shadow-float: 0 4px 12px rgba(0,0,0,0.08);
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-full: 9999px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      line-height: 1.6;
      font-size: 14px;
    }

    /* Desktop wrapper */
    @media (min-width: 768px) {
      body { background: #e8e8ef; display: flex; justify-content: center; align-items: center; }
      #app { width: 430px; height: 90vh; max-height: 900px; border-radius: 24px; overflow: hidden; box-shadow: 0 25px 80px rgba(0,0,0,0.15); position: relative; background: var(--bg-page); }
    }
    @media (max-width: 767px) {
      #app { width: 100%; height: 100%; position: relative; }
    }

    /* Layout */
    .page-container { position: absolute; top: 44px; left: 0; right: 0; bottom: calc(50px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: var(--space-4); padding-bottom: calc(var(--space-4) + 20px); }
    .page-section { display: none; animation: fadeInUp 0.2s ease-out; }
    .page-section.active { display: block; }

    /* NavBar */
    .navbar { position: absolute; top: 0; left: 0; right: 0; height: 44px; background: var(--bg-nav); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .navbar-title { font-size: 17px; font-weight: 600; color: var(--text-primary); }

    /* TabBar */
    .tabbar { position: absolute; bottom: 0; left: 0; right: 0; height: calc(50px + env(safe-area-inset-bottom, 0px)); background: var(--bg-nav); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--border); display: flex; z-index: 100; padding-bottom: env(safe-area-inset-bottom, 0px); }
    .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; transition: all 0.2s; }
    .tab-item.active .tab-icon { color: var(--accent); }
    .tab-item.active .tab-label { color: var(--accent); }
    .tab-icon { width: 24px; height: 24px; color: var(--text-tertiary); transition: color 0.2s; }
    .tab-label { font-size: 10px; color: var(--text-tertiary); transition: color 0.2s; }

    /* Card */
    .card { background: var(--bg-card); border-radius: var(--radius-lg); padding: var(--space-4); box-shadow: var(--shadow-card); margin-bottom: var(--space-3); }
    .card-title { font-size: 16px; font-weight: 600; margin-bottom: var(--space-3); display: flex; align-items: center; justify-content: space-between; }

    /* Button */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1); padding: 0 var(--space-4); height: 40px; border-radius: var(--radius-md); border: none; font-size: 14px; font-weight: 500; cursor: pointer; transition: transform 0.1s, opacity 0.2s; font-family: inherit; }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--accent-gradient); color: var(--text-inverse); }
    .btn-secondary { background: var(--divider); color: var(--text-primary); }
    .btn-ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); }
    .btn-sm { height: 32px; padding: 0 var(--space-3); font-size: 13px; }
    .btn-block { width: 100%; }

    /* Tag */
    .tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: var(--radius-full); font-size: 11px; font-weight: 500; }
    .tag-high { background: rgba(239,68,68,0.08); color: var(--danger); }
    .tag-medium { background: rgba(245,158,11,0.08); color: var(--warning); }
    .tag-low { background: rgba(52,211,153,0.08); color: var(--success); }
    .tag-accent { background: var(--accent-light); color: var(--accent); }

    /* ProgressBar */
    .progress-bar { width: 100%; height: 6px; background: var(--divider); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent-gradient); border-radius: 3px; transition: width 0.6s ease-in-out; }
    .progress-fill.breathing { animation: breathing 2s ease-in-out infinite; }

    /* Checkbox */
    .checkbox { width: 24px; height: 24px; border-radius: var(--radius-sm); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; flex-shrink: 0; }
    .checkbox.checked { background: var(--accent); border-color: var(--accent); animation: checkPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .checkbox.checked svg { display: block; }
    .checkbox svg { display: none; width: 14px; height: 14px; color: white; }

    /* ListItem */
    .list-item { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-3) 0; border-bottom: 1px solid var(--divider); transition: background 0.2s; }
    .list-item:last-child { border-bottom: none; }
    .list-item-content { flex: 1; min-width: 0; }
    .list-item-title { font-size: 15px; font-weight: 500; color: var(--text-primary); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-item-title.completed { text-decoration: line-through; color: var(--text-tertiary); }
    .list-item-meta { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; opacity: 0; visibility: hidden; transition: opacity 0.25s, visibility 0.25s; display: flex; align-items: flex-end; justify-content: center; }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-content { background: var(--bg-card); border-radius: var(--radius-xl) var(--radius-xl) 0 0; width: 100%; max-height: 85vh; overflow-y: auto; transform: translateY(100%); transition: transform 0.25s ease-out; padding: var(--space-5) var(--space-4) calc(var(--space-5) + env(safe-area-inset-bottom, 0px)); }
    .modal-overlay.active .modal-content { transform: translateY(0); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-4); }
    .modal-title { font-size: 18px; font-weight: 600; }
    .modal-close { width: 32px; height: 32px; border-radius: var(--radius-full); border: none; background: var(--divider); color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* Toast */
    .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) translateY(8px); background: rgba(0,0,0,0.8); color: white; padding: 10px 16px; border-radius: var(--radius-md); font-size: 14px; z-index: 300; opacity: 0; visibility: hidden; transition: opacity 0.2s, transform 0.2s, visibility 0.2s; pointer-events: none; white-space: nowrap; }
    .toast.active { opacity: 1; visibility: visible; transform: translate(-50%, -50%) translateY(0); }

    /* ActionSheet */
    .actionsheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; opacity: 0; visibility: hidden; transition: opacity 0.25s, visibility 0.25s; display: flex; align-items: flex-end; justify-content: center; }
    .actionsheet-overlay.active { opacity: 1; visibility: visible; }
    .actionsheet-content { background: var(--bg-card); border-radius: var(--radius-xl) var(--radius-xl) 0 0; width: 100%; padding: var(--space-3) var(--space-4) calc(var(--space-4) + env(safe-area-inset-bottom, 0px)); transform: translateY(100%); transition: transform 0.25s ease-out; }
    .actionsheet-overlay.active .actionsheet-content { transform: translateY(0); }
    .actionsheet-item { padding: var(--space-4); text-align: center; font-size: 16px; color: var(--text-primary); border-bottom: 1px solid var(--divider); cursor: pointer; }
    .actionsheet-item:last-child { border-bottom: none; }
    .actionsheet-item.danger { color: var(--danger); }
    .actionsheet-cancel { margin-top: var(--space-2); padding: var(--space-4); text-align: center; font-size: 16px; color: var(--text-secondary); background: var(--divider); border-radius: var(--radius-md); cursor: pointer; }

    /* FloatButton */
    .float-btn { position: fixed; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); right: var(--space-4); width: 56px; height: 56px; border-radius: var(--radius-full); background: var(--accent-gradient); color: white; border: none; box-shadow: var(--shadow-float); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 90; transition: transform 0.2s; }
    .float-btn:active { transform: scale(0.92); }

    /* EmptyState */
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--space-6) var(--space-4); text-align: center; }
    .empty-icon { width: 64px; height: 64px; color: var(--text-tertiary); margin-bottom: var(--space-3); }
    .empty-title { font-size: 15px; color: var(--text-secondary); margin-bottom: var(--space-2); }

    /* Form */
    .form-group { margin-bottom: var(--space-4); }
    .form-label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: var(--space-2); }
    .form-input, .form-textarea, .form-select { width: 100%; padding: var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 14px; font-family: inherit; background: var(--bg-card); color: var(--text-primary); outline: none; transition: border-color 0.2s; }
    .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--accent); }
    .form-textarea { resize: vertical; min-height: 80px; }
    .radio-group { display: flex; gap: var(--space-2); }
    .radio-item { flex: 1; padding: var(--space-3); border: 2px solid var(--border); border-radius: var(--radius-md); text-align: center; cursor: pointer; transition: all 0.2s; font-size: 13px; }
    .radio-item.active { border-color: var(--accent); background: var(--accent-light); color: var(--accent); font-weight: 600; }

    /* Specific page styles */
    .greeting { font-size: 24px; font-weight: 700; margin-bottom: var(--space-1); }
    .greeting-sub { font-size: 14px; color: var(--text-secondary); margin-bottom: var(--space-4); }
    .top3-card { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-4); background: var(--bg-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); margin-bottom: var(--space-3); border-left: 3px solid var(--accent); transition: all 0.3s; opacity: 0; transform: translateY(12px); animation: slideIn 0.4s ease-out forwards; }
    .top3-card.completed { opacity: 0.6; border-left-color: var(--success); }
    .top3-number { width: 28px; height: 28px; border-radius: var(--radius-full); background: var(--accent-gradient); color: white; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
    .top3-reason { font-size: 12px; color: var(--accent); margin-top: var(--space-1); background: var(--accent-light); padding: 2px 8px; border-radius: var(--radius-full); display: inline-block; }

    .banner { background: var(--accent-gradient); color: white; padding: var(--space-3) var(--space-4); border-radius: var(--radius-lg); margin-bottom: var(--space-3); display: flex; align-items: center; gap: var(--space-3); }
    .banner-icon { width: 32px; height: 32px; opacity: 0.9; flex-shrink: 0; }

    .filter-tabs { display: flex; gap: var(--space-2); margin-bottom: var(--space-3); overflow-x: auto; padding-bottom: var(--space-1); }
    .filter-tab { padding: var(--space-2) var(--space-3); border-radius: var(--radius-full); font-size: 13px; white-space: nowrap; cursor: pointer; border: 1px solid var(--border); color: var(--text-secondary); transition: all 0.2s; background: var(--bg-card); }
    .filter-tab.active { background: var(--accent); color: white; border-color: var(--accent); }

    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); margin-bottom: var(--space-4); }
    .stat-card { background: var(--bg-card); border-radius: var(--radius-lg); padding: var(--space-4); text-align: center; box-shadow: var(--shadow-card); }
    .stat-value { font-size: 28px; font-weight: 700; color: var(--accent); margin-bottom: var(--space-1); }
    .stat-label { font-size: 12px; color: var(--text-secondary); }

    .chart-bar-container { display: flex; align-items: flex-end; gap: var(--space-2); height: 120px; padding: var(--space-3) 0; }
    .chart-bar { flex: 1; background: var(--accent); border-radius: 3px 3px 0 0; transition: height 0.6s ease-out; opacity: 0.7; min-height: 4px; }
    .chart-bar:hover { opacity: 1; }
    .chart-label { font-size: 10px; color: var(--text-tertiary); text-align: center; margin-top: var(--space-1); }

    .priority-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-top: var(--space-2); }
    .priority-segment { transition: width 0.6s ease-out; }

    .onboarding-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 400; display: flex; align-items: center; justify-content: center; padding: var(--space-4); }
    .onboarding-card { background: var(--bg-card); border-radius: var(--radius-xl); padding: var(--space-5); max-width: 320px; width: 100%; text-align: center; }
    .onboarding-step { display: none; }
    .onboarding-step.active { display: block; animation: fadeInUp 0.3s ease-out; }
    .onboarding-icon { width: 80px; height: 80px; color: var(--accent); margin: 0 auto var(--space-4); }

    .focus-overlay { position: fixed; inset: 0; background: var(--text-primary); z-index: 350; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0.3s; }
    .focus-overlay.active { opacity: 1; visibility: visible; }
    .focus-timer { font-size: 72px; font-weight: 200; font-variant-numeric: tabular-nums; margin-bottom: var(--space-5); }

    /* Animations */
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }
    @keyframes checkPop { 0% { transform: scale(0); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
    @keyframes breathing { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
    @keyframes loadingDots { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }
    .loading-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin: 0 2px; animation: loadingDots 1.4s infinite ease-in-out both; }
    .loading-dot:nth-child(1) { animation-delay: -0.32s; }
    .loading-dot:nth-child(2) { animation-delay: -0.16s; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="app">
    <!-- NavBar -->
    <div class="navbar">
      <div class="navbar-title" id="navbarTitle">今日</div>
    </div>

    <!-- Page Container -->
    <div class="page-container">
      <!-- 今日 -->
      <div class="page-section active" id="page-today">
        <div class="greeting" id="greeting">早上好</div>
        <div class="greeting-sub" id="greetingSub">今天有 3 件事等着你</div>
        <div id="todayBanner"></div>
        <div id="todayProgress"></div>
        <div id="todayTop3"></div>
        <div id="todayEmpty"></div>
        <button class="btn btn-primary btn-block" id="btnGenerate" style="margin-top:var(--space-3);">
          <span>生成今日排程</span>
        </button>
      </div>

      <!-- 任务 -->
      <div class="page-section" id="page-tasks">
        <div class="filter-tabs" id="taskFilters">
          <div class="filter-tab active" data-filter="all">全部</div>
          <div class="filter-tab" data-filter="today">今日</div>
          <div class="filter-tab" data-filter="high">重要</div>
          <div class="filter-tab" data-filter="in_progress">进行中</div>
          <div class="filter-tab" data-filter="completed">已完成</div>
        </div>
        <div id="tasksList"></div>
        <div id="tasksEmpty"></div>
      </div>

      <!-- 收藏 -->
      <div class="page-section" id="page-collections">
        <div class="filter-tabs" id="collectionFilters">
          <div class="filter-tab active" data-filter="all">全部</div>
          <div class="filter-tab" data-filter="unread">未读</div>
          <div class="filter-tab" data-filter="processed">已处理</div>
          <div class="filter-tab" data-filter="archived">已归档</div>
        </div>
        <div id="collectionsList"></div>
        <div id="collectionsEmpty"></div>
      </div>

      <!-- 统计 -->
      <div class="page-section" id="page-stats">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value" id="statWeek">0</div>
            <div class="stat-label">本周完成</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="statTotal">0</div>
            <div class="stat-label">总计</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="statStreak">0</div>
            <div class="stat-label">连续打卡</div>
          </div>
        </div>
        <div class="card">
          <div class="card-title">本周趋势</div>
          <div class="chart-bar-container" id="weekChart"></div>
        </div>
        <div class="card">
          <div class="card-title">任务优先级分布</div>
          <div class="priority-bar" id="priorityBar"></div>
          <div style="display:flex;gap:var(--space-3);margin-top:var(--space-3);font-size:12px;color:var(--text-secondary);">
            <div><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);margin-right:4px;"></span>高</div>
            <div><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warning);margin-right:4px;"></span>中</div>
            <div><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--success);margin-right:4px;"></span>低</div>
          </div>
        </div>
        <div class="card">
          <div class="card-title">设置</div>
          <div class="list-item" style="cursor:pointer;" onclick="clearAllData()">
            <div class="list-item-content">
              <div class="list-item-title">清除所有数据</div>
              <div class="list-item-meta">重置为初始状态</div>
            </div>
          </div>
          <div class="list-item" style="cursor:pointer;" onclick="exportData()">
            <div class="list-item-content">
              <div class="list-item-title">导出数据</div>
              <div class="list-item-meta">下载 JSON 备份文件</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- TabBar -->
    <div class="tabbar">
      <div class="tab-item active" data-page="today">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <span class="tab-label">今日</span>
      </div>
      <div class="tab-item" data-page="tasks">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        <span class="tab-label">任务</span>
      </div>
      <div class="tab-item" data-page="collections">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
        <span class="tab-label">收藏</span>
      </div>
      <div class="tab-item" data-page="stats">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        <span class="tab-label">统计</span>
      </div>
    </div>

    <!-- Float Button (任务页) -->
    <button class="float-btn hidden" id="floatBtn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>

    <!-- Modal: Task Form -->
    <div class="modal-overlay" id="taskModal">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title" id="taskModalTitle">新建任务</div>
          <button class="modal-close" onclick="closeTaskModal()">&times;</button>
        </div>
        <div class="form-group">
          <label class="form-label">任务标题</label>
          <input type="text" class="form-input" id="taskTitle" placeholder="输入任务名称">
        </div>
        <div class="form-group">
          <label class="form-label">备注</label>
          <textarea class="form-textarea" id="taskDesc" placeholder="补充说明（可选）"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">优先级</label>
          <div class="radio-group">
            <div class="radio-item" data-priority="high">高</div>
            <div class="radio-item active" data-priority="medium">中</div>
            <div class="radio-item" data-priority="low">低</div>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">预估时间（分钟）</label>
          <input type="number" class="form-input" id="taskTime" placeholder="30" value="30">
        </div>
        <div class="form-group">
          <label class="form-label">截止日期</label>
          <input type="date" class="form-input" id="taskDue">
        </div>
        <div class="form-group">
          <label class="form-label">标签（用逗号分隔）</label>
          <input type="text" class="form-input" id="taskTags" placeholder="工作, 学习">
        </div>
        <button class="btn btn-primary btn-block" onclick="saveTask()">保存</button>
      </div>
    </div>

    <!-- Modal: Collection Form -->
    <div class="modal-overlay" id="collectionModal">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title">添加收藏</div>
          <button class="modal-close" onclick="closeCollectionModal()">&times;</button>
        </div>
        <div class="form-group">
          <label class="form-label">标题</label>
          <input type="text" class="form-input" id="colTitle" placeholder="文章/链接标题">
        </div>
        <div class="form-group">
          <label class="form-label">链接 URL</label>
          <input type="text" class="form-input" id="colUrl" placeholder="https://...">
        </div>
        <button class="btn btn-primary btn-block" onclick="saveCollection()">保存</button>
      </div>
    </div>

    <!-- ActionSheet -->
    <div class="actionsheet-overlay" id="actionSheet">
      <div class="actionsheet-content">
        <div id="actionSheetItems"></div>
        <div class="actionsheet-cancel" onclick="closeActionSheet()">取消</div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Focus Overlay -->
    <div class="focus-overlay" id="focusOverlay">
      <div class="focus-timer" id="focusTimer">25:00</div>
      <div style="color:var(--text-tertiary);margin-bottom:var(--space-5);">保持专注</div>
      <button class="btn btn-secondary" onclick="closeFocus()" style="min-width:120px;">结束专注</button>
    </div>

    <!-- Onboarding -->
    <div class="onboarding-overlay hidden" id="onboarding">
      <div class="onboarding-card">
        <div class="onboarding-step active" data-step="0">
          <svg class="onboarding-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <div style="font-size:20px;font-weight:700;margin-bottom:var(--space-2);">欢迎来到知效</div>
          <div style="color:var(--text-secondary);margin-bottom:var(--space-4);">你的 AI 执行陪伴助手。每天早上 3 分钟，帮你进入专注状态。</div>
          <button class="btn btn-primary btn-block" onclick="nextOnboarding()">下一步</button>
        </div>
        <div class="onboarding-step" data-step="1">
          <svg class="onboarding-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          <div style="font-size:20px;font-weight:700;margin-bottom:var(--space-2);">三步闭环</div>
          <div style="color:var(--text-secondary);margin-bottom:var(--space-4);">信息筛选 → 智能排程 → 执行陪伴。AI 帮你做决定、陪你坚持。</div>
          <button class="btn btn-primary btn-block" onclick="nextOnboarding()">下一步</button>
        </div>
        <div class="onboarding-step" data-step="2">
          <svg class="onboarding-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          <div style="font-size:20px;font-weight:700;margin-bottom:var(--space-2);">开始体验</div>
          <div style="color:var(--text-secondary);margin-bottom:var(--space-4);">数据已为你准备好。点击"生成今日排程"，开启今天的高效之旅。</div>
          <button class="btn btn-primary btn-block" onclick="finishOnboarding()">开始使用</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ============ Utilities ============
    const fmtDate = (d) => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; };
    const todayStr = () => fmtDate(new Date());
    const daysDiff = (a, b) => { const ms = new Date(b) - new Date(a); return Math.ceil(ms / 86400000); };
    const genId = (prefix) => `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2,6)}`;
    const escapeHtml = (s) => (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    // ============ Storage ============
    const STORAGE_KEY = 'zhixiao_data';
    function getData() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || null; } catch { return null; }
    }
    function setData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

    function initMockData() {
      const t = todayStr();
      const y1 = fmtDate(new Date(Date.now() - 86400000));
      const y2 = fmtDate(new Date(Date.now() - 2 * 86400000));
      const t3 = fmtDate(new Date(Date.now() + 3 * 86400000));
      const data = {
        tasks: [
          { id: genId('t'), title: '完成竞品分析报告', description: '对比三款主流效率工具的收藏管理功能', priority: 'high', status: 'pending', estimatedTime: 45, dueDate: t, tags: ['工作','分析'], createdAt: `${t}T08:00:00Z`, completedAt: null, source: 'manual', aiReason: '' },
          { id: genId('t'), title: '阅读《AI 产品趋势 2024》', description: '重点看第三章关于个性化推荐的案例', priority: 'medium', status: 'pending', estimatedTime: 30, dueDate: t, tags: ['学习','阅读'], createdAt: `${t}T09:00:00Z`, completedAt: null, source: 'collection', aiReason: '' },
          { id: genId('t'), title: '整理浏览器收藏夹', description: '把堆积的 30+ 标签页分类归档', priority: 'low', status: 'pending', estimatedTime: 20, dueDate: t3, tags: ['整理'], createdAt: `${y1}T10:00:00Z`, completedAt: null, source: 'manual', aiReason: '' },
          { id: genId('t'), title: '撰写下周工作计划', description: '列出关键目标和可交付成果', priority: 'high', status: 'in_progress', estimatedTime: 25, dueDate: t, tags: ['工作','计划'], createdAt: `${y1}T11:00:00Z`, completedAt: null, source: 'manual', aiReason: '' },
          { id: genId('t'), title: '回复客户邮件', description: '确认需求变更并给出排期', priority: 'medium', status: 'completed', estimatedTime: 15, dueDate: y1, tags: ['工作','沟通'], createdAt: `${y1}T08:30:00Z`, completedAt: `${y1}T14:00:00Z`, source: 'manual', aiReason: '' },
          { id: genId('t'), title: '学习 TRAE 新功能', description: '了解最新的 AI 辅助编程能力', priority: 'low', status: 'pending', estimatedTime: 40, dueDate: t3, tags: ['学习','工具'], createdAt: `${y2}T09:00:00Z`, completedAt: null, source: 'collection', aiReason: '' },
          { id: genId('t'), title: '更新项目文档', description: '补充 API 变更说明和使用示例', priority: 'medium', status: 'pending', estimatedTime: 35, dueDate: t, tags: ['工作','文档'], createdAt: `${t}T07:00:00Z`, completedAt: null, source: 'manual', aiReason: '' },
          { id: genId('t'), title: '团队周会准备', description: '整理本周进展和下周重点', priority: 'high', status: 'pending', estimatedTime: 20, dueDate: t, tags: ['工作','会议'], createdAt: `${t}T07:30:00Z`, completedAt: null, source: 'manual', aiReason: '' },
          { id: genId('t'), title: '优化个人博客', description: '调整排版和加载速度', priority: 'low', status: 'archived', estimatedTime: 60, dueDate: y2, tags: ['个人','优化'], createdAt: `${y2}T10:00:00Z`, completedAt: null, source: 'manual', aiReason: '' }
        ],
        collections: [
          { id: genId('c'), title: '2024 年 AI 产品趋势报告', url: 'https://example.com/ai-trends-2024', source: '公众号', summary: '生成式 AI 正在重塑 SaaS 产品形态，个性化推荐和智能助手成为核心差异化方向。报告分析了 50+ 产品的演进路径。', status: 'unread', priority: 'high', addedAt: `${y1}T10:00:00Z`, convertedToTaskId: null },
          { id: genId('c'), title: '深度工作：如何有效利用每一点脑力', url: 'https://example.com/deep-work', source: '豆瓣', summary: '作者提出"深度工作"概念，即在无干扰状态下进行专注的职业活动。书中给出了 4 条具体实践规则。', status: 'unread', priority: 'medium', addedAt: `${y2}T14:00:00Z`, convertedToTaskId: null },
          { id: genId('c'), title: 'Notion 高级模板搭建指南', url: 'https://example.com/notion-guide', source: 'B站', summary: '从零搭建一套完整的个人管理系统，包含项目看板、习惯追踪、知识库三大模块。', status: 'processed', priority: 'low', addedAt: `${y2}T09:00:00Z`, convertedToTaskId: null },
          { id: genId('c'), title: '注意力经济：我们是如何被设计的', url: 'https://example.com/attention-economy', source: '知乎', summary: '探讨科技产品如何利用心理学原理捕获用户注意力，以及如何进行数字断舍离。', status: 'unread', priority: 'medium', addedAt: `${t}T08:00:00Z`, convertedToTaskId: null },
          { id: genId('c'), title: '效率工具横向测评：2024 版', url: 'https://example.com/tools-review', source: '少数派', summary: '对比 12 款主流效率工具的核心功能、定价和适用人群，帮助读者找到最适合自己的方案。', status: 'unread', priority: 'high', addedAt: `${t}T09:30:00Z`, convertedToTaskId: null }
        ],
        dailySchedules: [],
        stats: {
          streakDays: 5,
          longestStreak: 12,
          totalCompleted: 87,
          weeklyData: [
            { date: fmtDate(new Date(Date.now() - 6*86400000)).slice(5), completed: 3, total: 5 },
            { date: fmtDate(new Date(Date.now() - 5*86400000)).slice(5), completed: 4, total: 6 },
            { date: fmtDate(new Date(Date.now() - 4*86400000)).slice(5), completed: 2, total: 4 },
            { date: fmtDate(new Date(Date.now() - 3*86400000)).slice(5), completed: 5, total: 5 },
            { date: fmtDate(new Date(Date.now() - 2*86400000)).slice(5), completed: 3, total: 5 },
            { date: fmtDate(new Date(Date.now() - 1*86400000)).slice(5), completed: 4, total: 6 },
            { date: t.slice(5), completed: 1, total: 4 }
          ]
        },
        settings: { userName: '', reminderStyle: 'gentle', onboarded: false }
      };
      setData(data);
      return data;
    }

    let store = getData();
    if (!store) store = initMockData();

    // ============ AI Scheduling ============
    function generateDailyTop3() {
      const today = todayStr();
      const pending = store.tasks.filter(t => t.status === 'pending' || t.status === 'in_progress');
      const scored = pending.map(task => {
        let score = 0;
        score += { high: 30, medium: 20, low: 10 }[task.priority] || 0;
        const diff = daysDiff(today, task.dueDate);
        if (diff <= 0) score += 25;
        else if (diff === 1) score += 15;
        else if (diff <= 3) score += 5;
        if (task.tags.includes('今日')) score += 10;
        if (task.source === 'collection' && task.priority === 'high') score += 8;
        if (task.estimatedTime <= 15) score += 5;
        return { ...task, score };
      });
      scored.sort((a, b) => b.score - a.score);
      return scored.slice(0, 3).map((task, i) => ({
        ...task,
        aiRank: i + 1,
        aiReason: generateReason(task, today)
      }));
    }

    function generateReason(task, today) {
      if (task.priority === 'high' && daysDiff(today, task.dueDate) <= 1) return '高优先级且即将截止';
      if (task.source === 'collection' && task.priority === 'high') return '收藏内容中价值最高，建议优先消化';
      if (task.estimatedTime <= 15) return '耗时短，适合快速完成建立成就感';
      if (task.tags.includes('今日')) return '已标记为今日重点';
      if (task.priority === 'high') return '高优先级任务，建议优先处理';
      return '与近期目标高度相关';
    }

    function saveSchedule(top3) {
      const today = todayStr();
      const idx = store.dailySchedules.findIndex(s => s.date === today);
      const schedule = { date: today, top3TaskIds: top3.map(t => t.id), generatedAt: new Date().toISOString(), completedCount: 0 };
      if (idx >= 0) store.dailySchedules[idx] = schedule;
      else store.dailySchedules.push(schedule);
      setData(store);
    }

    // ============ Global UI Helpers ============
    let currentPage = 'today';
    let taskFilter = 'all';
    let collectionFilter = 'all';
    let editingTaskId = null;
    let focusTimerId = null;

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('active');
      setTimeout(() => el.classList.remove('active'), 2000);
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    function openTaskModal(taskId) {
      editingTaskId = taskId || null;
      document.getElementById('taskModalTitle').textContent = taskId ? '编辑任务' : '新建任务';
      if (taskId) {
        const t = store.tasks.find(x => x.id === taskId);
        document.getElementById('taskTitle').value = t.title;
        document.getElementById('taskDesc').value = t.description || '';
        document.getElementById('taskTime').value = t.estimatedTime;
        document.getElementById('taskDue').value = t.dueDate;
        document.getElementById('taskTags').value = t.tags.join(', ');
        document.querySelectorAll('.radio-item').forEach(el => el.classList.toggle('active', el.dataset.priority === t.priority));
      } else {
        document.getElementById('taskTitle').value = '';
        document.getElementById('taskDesc').value = '';
        document.getElementById('taskTime').value = 30;
        document.getElementById('taskDue').value = todayStr();
        document.getElementById('taskTags').value = '';
        document.querySelectorAll('.radio-item').forEach(el => el.classList.toggle('active', el.dataset.priority === 'medium'));
      }
      openModal('taskModal');
    }
    function closeTaskModal() { closeModal('taskModal'); editingTaskId = null; }
    function openCollectionModal() { openModal('collectionModal'); }
    function closeCollectionModal() { closeModal('collectionModal'); document.getElementById('colTitle').value = ''; document.getElementById('colUrl').value = ''; }
    function openActionSheet(items) {
      const container = document.getElementById('actionSheetItems');
      container.innerHTML = items.map(it => `<div class="actionsheet-item ${it.danger ? 'danger' : ''}" onclick="${it.action}; closeActionSheet();">${it.label}</div>`).join('');
      document.getElementById('actionSheet').classList.add('active');
    }
    function closeActionSheet() { document.getElementById('actionSheet').classList.remove('active'); }

    // ============ Tab Switching ============
    document.querySelectorAll('.tab-item').forEach(el => {
      el.addEventListener('click', () => {
        const page = el.dataset.page;
        if (page === currentPage) return;
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
        document.getElementById('page-' + page).classList.add('active');
        document.getElementById('navbarTitle').textContent = { today: '今日', tasks: '任务', collections: '收藏', stats: '统计' }[page];
        currentPage = page;
        document.getElementById('floatBtn').classList.toggle('hidden', page !== 'tasks' && page !== 'collections');
        if (page === 'today') renderToday();
        if (page === 'tasks') renderTasks();
        if (page === 'collections') renderCollections();
        if (page === 'stats') renderStats();
      });
    });

    // ============ Today Page ============
    function renderToday() {
      const hour = new Date().getHours();
      const greeting = hour < 12 ? '早上好' : hour < 18 ? '下午好' : '晚上好';
      document.getElementById('greeting').textContent = greeting;

      const today = todayStr();
      const schedule = store.dailySchedules.find(s => s.date === today);
      const pending = store.tasks.filter(t => t.status === 'pending' || t.status === 'in_progress');

      // Fatigue banner
      const bannerEl = document.getElementById('todayBanner');
      if (hour >= 14 && hour < 17 && pending.length > 0 && schedule) {
        const uncompleted = schedule.top3TaskIds.filter(id => {
          const t = store.tasks.find(x => x.id === id);
          return t && t.status !== 'completed';
        }).length;
        if (uncompleted > 0) {
          const msgs = ['已完成 ' + (schedule.top3TaskIds.length - uncompleted) + '/' + schedule.top3TaskIds.length + '，最后一步了', '这个任务只需几分钟，完成后今天就可以放松了', '深呼吸，专注 5 分钟就能完成它'];
          bannerEl.innerHTML = `<div class="banner"><svg class="banner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg><div><div style="font-weight:600;margin-bottom:2px;">下午好，需要一点推动力吗？</div><div style="font-size:13px;opacity:0.9;">${msgs[Math.floor(Math.random()*msgs.length)]}</div></div></div>`;
        } else { bannerEl.innerHTML = ''; }
      } else { bannerEl.innerHTML = ''; }

      if (schedule && schedule.top3TaskIds.length > 0) {
        document.getElementById('todayEmpty').innerHTML = '';
        document.getElementById('btnGenerate').style.display = 'none';
        const completedCount = schedule.top3TaskIds.filter(id => store.tasks.find(t => t.id === id)?.status === 'completed').length;
        const pct = Math.round((completedCount / schedule.top3TaskIds.length) * 100);
        document.getElementById('todayProgress').innerHTML = `
          <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <span style="font-size:15px;font-weight:600;">今日进度</span><span style="font-size:13px;color:var(--text-secondary);">${completedCount}/${schedule.top3TaskIds.length} 完成</span>
          </div><div class="progress-bar"><div class="progress-fill ${hour>=14&&hour<17&&completedCount<schedule.top3TaskIds.length?'breathing':''}" style="width:${pct}%"></div></div></div>`;

        document.getElementById('todayTop3').innerHTML = schedule.top3TaskIds.map((id, i) => {
          const t = store.tasks.find(x => x.id === id);
          if (!t) return '';
          const isDone = t.status === 'completed';
          return `
            <div class="top3-card ${isDone?'completed':''}" style="animation-delay:${i*150}ms">
              <div class="top3-number">${i+1}</div>
              <div style="flex:1;min-width:0;">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
                  <div style="font-size:15px;font-weight:500;${isDone?'text-decoration:line-through;color:var(--text-tertiary);':''}">${escapeHtml(t.title)}</div>
                  <div class="checkbox ${isDone?'checked':''}" onclick="toggleTaskComplete('${t.id}')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                  </div>
                </div>
                <div class="list-item-meta" style="margin-top:4px;">
                  <span class="tag tag-${t.priority}">${{high:'高',medium:'中',low:'低'}[t.priority]}</span>
                  <span>${t.estimatedTime}分钟</span>
                  ${t.dueDate===today?'<span style="color:var(--danger);">今天截止</span>':''}
                </div>
                <div class="top3-reason">${escapeHtml(t.aiReason || schedule.aiReasons?.[i] || '推荐任务')}</div>
                ${!isDone ? `<button class="btn btn-sm btn-secondary" style="margin-top:8px;" onclick="openFocus('${t.id}')">开始专注</button>` : ''}
              </div>
            </div>`;
        }).join('');
        document.getElementById('greetingSub').textContent = `今天还有 ${schedule.top3TaskIds.length - completedCount} 件事等你完成`;
      } else {
        document.getElementById('todayTop3').innerHTML = '';
        document.getElementById('todayProgress').innerHTML = '';
        document.getElementById('btnGenerate').style.display = 'flex';
        document.getElementById('todayEmpty').innerHTML = `
          <div class="empty-state">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <div class="empty-title">还没有今日排程</div>
            <div style="font-size:13px;color:var(--text-tertiary);margin-bottom:12px;">让 AI 帮你选出今天最重要的三件事</div>
          </div>`;
        document.getElementById('greetingSub').textContent = `今天有 ${pending.length} 个待办任务`;
      }
    }

    document.getElementById('btnGenerate').addEventListener('click', () => {
      const btn = document.getElementById('btnGenerate');
      btn.innerHTML = '<span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span>';
      btn.disabled = true;
      setTimeout(() => {
        const top3 = generateDailyTop3();
        if (top3.length === 0) { showToast('暂无待办任务，先去添加几个吧'); btn.innerHTML = '<span>生成今日排程</span>'; btn.disabled = false; return; }
        top3.forEach(t => {
          const task = store.tasks.find(x => x.id === t.id);
          if (task) task.aiReason = t.aiReason;
        });
        saveSchedule(top3);
        btn.innerHTML = '<span>生成今日排程</span>'; btn.disabled = false;
        renderToday();
        showToast('今日排程已生成');
      }, 900);
    });

    function toggleTaskComplete(taskId) {
      const t = store.tasks.find(x => x.id === taskId);
      if (!t) return;
      t.status = t.status === 'completed' ? 'pending' : 'completed';
      t.completedAt = t.status === 'completed' ? new Date().toISOString() : null;
      if (t.status === 'completed') {
        store.stats.totalCompleted++;
        const today = todayStr();
        const wd = store.stats.weeklyData.find(w => w.date === today.slice(5));
        if (wd) wd.completed++;
      } else {
        store.stats.totalCompleted = Math.max(0, store.stats.totalCompleted - 1);
      }
      setData(store);
      renderToday();
      if (currentPage === 'tasks') renderTasks();
      if (currentPage === 'stats') renderStats();
      showToast(t.status === 'completed' ? '任务完成！' : '已恢复为进行中');
    }

    function openFocus(taskId) {
      document.getElementById('focusOverlay').classList.add('active');
      let sec = 25 * 60;
      const el = document.getElementById('focusTimer');
      const tick = () => {
        const m = String(Math.floor(sec / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        el.textContent = `${m}:${s}`;
        if (sec > 0) { sec--; focusTimerId = setTimeout(tick, 1000); }
        else { showToast('专注时间结束！'); closeFocus(); }
      };
      tick();
    }
    function closeFocus() { clearTimeout(focusTimerId); document.getElementById('focusOverlay').classList.remove('active'); document.getElementById('focusTimer').textContent = '25:00'; }

    // ============ Tasks Page ============
    function renderTasks() {
      const list = document.getElementById('tasksList');
      const empty = document.getElementById('tasksEmpty');
      let filtered = store.tasks.filter(t => t.status !== 'archived');
      if (taskFilter === 'today') filtered = filtered.filter(t => t.dueDate === todayStr());
      else if (taskFilter === 'high') filtered = filtered.filter(t => t.priority === 'high');
      else if (taskFilter === 'in_progress') filtered = filtered.filter(t => t.status === 'pending' || t.status === 'in_progress');
      else if (taskFilter === 'completed') filtered = filtered.filter(t => t.status === 'completed');

      if (filtered.length === 0) {
        list.innerHTML = '';
        empty.innerHTML = `<div class="empty-state"><svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg><div class="empty-title">暂无任务</div></div>`;
        return;
      }
      empty.innerHTML = '';
      list.innerHTML = filtered.map(t => `
        <div class="list-item" style="cursor:pointer;" onclick="openTaskModal('${t.id}')">
          <div class="checkbox ${t.status==='completed'?'checked':''}" onclick="event.stopPropagation();toggleTaskComplete('${t.id}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div class="list-item-content">
            <div class="list-item-title ${t.status==='completed'?'completed':''}">${escapeHtml(t.title)}</div>
            <div class="list-item-meta">
              <span class="tag tag-${t.priority}">${{high:'高',medium:'中',low:'低'}[t.priority]}</span>
              <span>${t.estimatedTime}分钟</span>
              <span>${t.dueDate}</span>
              ${t.tags.map(tag => `<span class="tag tag-accent">${escapeHtml(tag)}</span>`).join('')}
            </div>
          </div>
        </div>`).join('');
    }

    document.querySelectorAll('#taskFilters .filter-tab').forEach(el => {
      el.addEventListener('click', () => {
        document.querySelectorAll('#taskFilters .filter-tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        taskFilter = el.dataset.filter;
        renderTasks();
      });
    });

    document.querySelectorAll('.radio-item').forEach(el => {
      el.addEventListener('click', () => {
        document.querySelectorAll('.radio-item').forEach(r => r.classList.remove('active'));
        el.classList.add('active');
      });
    });

    function saveTask() {
      const title = document.getElementById('taskTitle').value.trim();
      if (!title) { showToast('请输入任务标题'); return; }
      const priority = document.querySelector('.radio-item.active').dataset.priority;
      const desc = document.getElementById('taskDesc').value.trim();
      const time = parseInt(document.getElementById('taskTime').value) || 30;
      const due = document.getElementById('taskDue').value || todayStr();
      const tags = document.getElementById('taskTags').value.split(',').map(s => s.trim()).filter(Boolean);

      if (editingTaskId) {
        const t = store.tasks.find(x => x.id === editingTaskId);
        t.title = title; t.description = desc; t.priority = priority;
        t.estimatedTime = time; t.dueDate = due; t.tags = tags;
      } else {
        store.tasks.push({ id: genId('t'), title, description: desc, priority, status: 'pending', estimatedTime: time, dueDate: due, tags, createdAt: new Date().toISOString(), completedAt: null, source: 'manual', aiReason: '' });
      }
      setData(store);
      closeTaskModal();
      renderTasks();
      if (currentPage === 'today') renderToday();
      if (currentPage === 'stats') renderStats();
      showToast(editingTaskId ? '任务已更新' : '任务已添加');
    }

    // ============ Collections Page ============
    function renderCollections() {
      const list = document.getElementById('collectionsList');
      const empty = document.getElementById('collectionsEmpty');
      let filtered = store.collections;
      if (collectionFilter !== 'all') filtered = filtered.filter(c => c.status === collectionFilter);

      if (filtered.length === 0) {
        list.innerHTML = '';
        empty.innerHTML = `<div class="empty-state"><svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg><div class="empty-title">暂无收藏</div></div>`;
        return;
      }
      empty.innerHTML = '';
      list.innerHTML = filtered.map(c => `
        <div class="card" style="margin-bottom:12px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;">
            <div style="font-size:15px;font-weight:500;flex:1;">${escapeHtml(c.title)}</div>
            <span class="tag tag-${c.priority}">${{high:'高',medium:'中',low:'低'}[c.priority]}</span>
          </div>
          <div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">${escapeHtml(c.source)} · ${escapeHtml(c.url.slice(0,40))}${c.url.length>40?'...':''}</div>
          ${c.summary ? `<div style="font-size:13px;color:var(--text-secondary);background:var(--divider);padding:8px 12px;border-radius:var(--radius-md);margin-bottom:10px;">AI 提炼：${escapeHtml(c.summary)}</div>` : ''}
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            ${c.status === 'unread' ? `<button class="btn btn-sm btn-primary" onclick="processCollection('${c.id}')">AI 提炼</button>` : ''}
            ${c.status !== 'archived' ? `<button class="btn btn-sm btn-secondary" onclick="convertToTask('${c.id}')">转为任务</button>` : ''}
            ${c.status !== 'archived' ? `<button class="btn btn-sm btn-ghost" onclick="archiveCollection('${c.id}')">归档</button>` : ''}
            ${c.status === 'archived' ? `<button class="btn btn-sm btn-secondary" onclick="restoreCollection('${c.id}')">恢复</button>` : ''}
          </div>
        </div>`).join('');
    }

    document.querySelectorAll('#collectionFilters .filter-tab').forEach(el => {
      el.addEventListener('click', () => {
        document.querySelectorAll('#collectionFilters .filter-tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        collectionFilter = el.dataset.filter;
        renderCollections();
      });
    });

    function saveCollection() {
      const title = document.getElementById('colTitle').value.trim();
      const url = document.getElementById('colUrl').value.trim();
      if (!title) { showToast('请输入标题'); return; }
      const col = { id: genId('c'), title, url: url || '#', source: '手动添加', summary: '', status: 'unread', priority: 'medium', addedAt: new Date().toISOString(), convertedToTaskId: null };
      store.collections.push(col);
      setData(store);
      closeCollectionModal();
      renderCollections();
      setTimeout(() => {
        const isHigh = Math.random() > 0.5;
        if (isHigh) {
          openActionSheet([
            { label: '该内容与您的近期目标相关，建议加入今日队列', action: '' },
            { label: '加入今日任务', action: `convertToTask('${col.id}')` },
            { label: '仅收藏', action: 'showToast("已保存到收藏夹")' }
          ]);
        } else {
          col.status = 'archived';
          setData(store);
          renderCollections();
          showToast('AI 判断为低价值，已自动归档');
        }
      }, 400);
    }

    function processCollection(id) {
      const c = store.collections.find(x => x.id === id);
      if (!c) return;
      const summaries = [
        '核心观点：信息过载的本质不是信息太多，而是筛选机制失效。建议建立"先筛选、后阅读"的工作流。',
        '本文提出了"深度工作"的四条规则，最实用的是第三条：拥抱无聊，减少碎片化娱乐对注意力的侵蚀。',
        '对比分析了 12 款工具，结论是没有万能工具，关键是找到适合自己工作节奏的组合。',
        '从心理学角度分析了通知设计的成瘾机制，并给出了 5 个减少干扰的具体方法。',
        '报告预测未来 3 年内，AI 助手将成为效率工具的标配功能，差异化在于个性化程度。'
      ];
      c.summary = summaries[Math.floor(Math.random() * summaries.length)];
      c.status = 'processed';
      setData(store);
      renderCollections();
      showToast('AI 提炼完成');
    }

    function convertToTask(id) {
      const c = store.collections.find(x => x.id === id);
      if (!c) return;
      const task = { id: genId('t'), title: `阅读：${c.title}`, description: c.summary || '', priority: c.priority, status: 'pending', estimatedTime: 30, dueDate: todayStr(), tags: ['收藏'], createdAt: new Date().toISOString(), completedAt: null, source: 'collection', aiReason: '来自收藏夹的高价值内容' };
      store.tasks.push(task);
      c.convertedToTaskId = task.id;
      c.status = 'processed';
      setData(store);
      renderCollections();
      if (currentPage === 'tasks') renderTasks();
      if (currentPage === 'today') renderToday();
      showToast('已转为任务');
    }

    function archiveCollection(id) {
      const c = store.collections.find(x => x.id === id);
      if (c) { c.status = 'archived'; setData(store); renderCollections(); showToast('已归档'); }
    }
    function restoreCollection(id) {
      const c = store.collections.find(x => x.id === id);
      if (c) { c.status = 'unread'; setData(store); renderCollections(); showToast('已恢复'); }
    }

    // Float button
    document.getElementById('floatBtn').addEventListener('click', () => {
      if (currentPage === 'tasks') openTaskModal();
      else if (currentPage === 'collections') openCollectionModal();
    });

    // ============ Stats Page ============
    function renderStats() {
      const completed = store.tasks.filter(t => t.status === 'completed').length;
      const weekCompleted = store.stats.weeklyData.reduce((s, d) => s + d.completed, 0);
      document.getElementById('statWeek').textContent = weekCompleted;
      document.getElementById('statTotal').textContent = store.stats.totalCompleted;
      document.getElementById('statStreak').textContent = store.stats.streakDays;

      const chart = document.getElementById('weekChart');
      const maxVal = Math.max(...store.stats.weeklyData.map(d => d.total), 1);
      chart.innerHTML = store.stats.weeklyData.map(d => `
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
          <div class="chart-bar" style="height:${(d.completed / maxVal * 100)}%"></div>
          <div class="chart-label">${d.date}</div>
        </div>`).join('');

      const high = store.tasks.filter(t => t.priority === 'high').length;
      const medium = store.tasks.filter(t => t.priority === 'medium').length;
      const low = store.tasks.filter(t => t.priority === 'low').length;
      const total = Math.max(high + medium + low, 1);
      document.getElementById('priorityBar').innerHTML = `
        <div class="priority-segment" style="width:${high/total*100}%;background:var(--danger);"></div>
        <div class="priority-segment" style="width:${medium/total*100}%;background:var(--warning);"></div>
        <div class="priority-segment" style="width:${low/total*100}%;background:var(--success);"></div>`;
    }

    function clearAllData() {
      if (!confirm('确定要清除所有数据并恢复初始状态吗？')) return;
      localStorage.removeItem(STORAGE_KEY);
      store = initMockData();
      renderToday(); renderTasks(); renderCollections(); renderStats();
      showToast('数据已重置');
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(store, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `zhixiao-backup-${todayStr()}.json`; a.click();
      URL.revokeObjectURL(url);
      showToast('数据已导出');
    }

    // ============ Onboarding ============
    let onboardingStep = 0;
    function nextOnboarding() {
      document.querySelectorAll('.onboarding-step').forEach(s => s.classList.remove('active'));
      onboardingStep++;
      const next = document.querySelector(`.onboarding-step[data-step="${onboardingStep}"]`);
      if (next) next.classList.add('active');
    }
    function finishOnboarding() {
      document.getElementById('onboarding').classList.add('hidden');
      store.settings.onboarded = true;
      setData(store);
    }

    // ============ Keyboard Support ============
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        closeTaskModal(); closeCollectionModal(); closeActionSheet(); closeFocus();
      }
      if (e.key === 'Enter' && (document.getElementById('taskModal').classList.contains('active'))) {
        if (document.activeElement.tagName !== 'TEXTAREA') saveTask();
      }
    });

    // ============ Initialization ============
    function init() {
      renderToday();
      renderTasks();
      renderCollections();
      renderStats();
      if (!store.settings.onboarded) {
        document.getElementById('onboarding').classList.remove('hidden');
      }
    }
    init();
  </script>
</body>
</html>
