<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D人物动作编辑器 - 武术·体育·全息</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
        @layer base {
            :root {
                --color-bg: #0a0a0f;
                --color-surface: #12121a;
                --color-surface-light: #1a1a28;
                --color-accent: #e8b86d;
                --color-accent-glow: rgba(232, 184, 109, 0.3);
                --color-primary: #4a9eff;
                --color-primary-glow: rgba(74, 158, 255, 0.3);
                --color-text: #e8e8f0;
                --color-text-dim: #8a8a9a;
                --color-border: #2a2a3a;
                --color-hologram: rgba(0, 255, 255, 0.15);
            }
            body {
                font-family: 'Noto Sans SC', sans-serif;
                background: var(--color-bg);
                color: var(--color-text);
                overflow: hidden;
            }
            h1, h2, h3 {
                font-family: 'Noto Serif SC', serif;
            }
        }
        @layer components {
            .glass-panel {
                background: rgba(18, 18, 26, 0.85);
                backdrop-filter: blur(20px);
                border: 1px solid var(--color-border);
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            }
            .hologram-border {
                position: relative;
                border: 1px solid rgba(0, 255, 255, 0.2);
                box-shadow: 
                    0 0 20px rgba(0, 255, 255, 0.05),
                    inset 0 0 20px rgba(0, 255, 255, 0.02);
            }
            .hologram-border::before {
                content: '';
                position: absolute;
                top: -1px;
                left: -1px;
                right: -1px;
                bottom: -1px;
                background: linear-gradient(45deg, transparent 40%, rgba(0, 255, 255, 0.1) 50%, transparent 60%);
                pointer-events: none;
                animation: hologramScan 3s linear infinite;
            }
            @keyframes hologramScan {
                0% { transform: translateX(-100%); }
                100% { transform: translateX(100%); }
            }
            .bone-node {
                transition: all 0.3s ease;
                cursor: pointer;
            }
            .bone-node:hover {
                background: rgba(74, 158, 255, 0.2);
                border-color: var(--color-primary);
            }
            .bone-node.selected {
                background: rgba(232, 184, 109, 0.2);
                border-color: var(--color-accent);
                box-shadow: 0 0 15px var(--color-accent-glow);
            }
            .slider-custom {
                -webkit-appearance: none;
                appearance: none;
                width: 100%;
                height: 4px;
                background: var(--color-border);
                border-radius: 2px;
                outline: none;
            }
            .slider-custom::-webkit-slider-thumb {
                -webkit-appearance: none;
                appearance: none;
                width: 16px;
                height: 16px;
                border-radius: 50%;
                background: var(--color-accent);
                cursor: pointer;
                box-shadow: 0 0 10px var(--color-accent-glow);
                transition: transform 0.2s;
            }
            .slider-custom::-webkit-slider-thumb:hover {
                transform: scale(1.2);
            }
            .btn-primary {
                background: linear-gradient(135deg, var(--color-accent), #d4a056);
                color: #0a0a0f;
                font-weight: 700;
                transition: all 0.3s ease;
            }
            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 25px var(--color-accent-glow);
            }
            .btn-secondary {
                background: var(--color-surface-light);
                border: 1px solid var(--color-border);
                color: var(--color-text);
                transition: all 0.3s ease;
            }
            .btn-secondary:hover {
                background: var(--color-primary);
                border-color: var(--color-primary);
                color: #fff;
            }
            .timeline-track {
                background: var(--color-surface-light);
                border: 1px solid var(--color-border);
                position: relative;
                overflow: hidden;
            }
            .timeline-keyframe {
                position: absolute;
                width: 12px;
                height: 12px;
                background: var(--color-accent);
                border-radius: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                cursor: pointer;
                box-shadow: 0 0 8px var(--color-accent-glow);
            }
            .timeline-keyframe:hover {
                transform: translate(-50%, -50%) scale(1.3);
            }
            .timeline-playhead {
                position: absolute;
                width: 2px;
                height: 100%;
                background: var(--color-primary);
                top: 0;
                left: 0;
                box-shadow: 0 0 10px var(--color-primary-glow);
                pointer-events: none;
            }
            .grid-bg {
                background-image: 
                    linear-gradient(rgba(74, 158, 255, 0.03) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(74, 158, 255, 0.03) 1px, transparent 1px);
                background-size: 50px 50px;
            }
            .scroll-custom::-webkit-scrollbar {
                width: 6px;
            }
            .scroll-custom::-webkit-scrollbar-track {
                background: var(--color-surface);
            }
            .scroll-custom::-webkit-scrollbar-thumb {
                background: var(--color-border);
                border-radius: 3px;
            }
            .scroll-custom::-webkit-scrollbar-thumb:hover {
                background: var(--color-text-dim);
            }
            .pose-card {
                transition: all 0.3s ease;
                cursor: pointer;
            }
            .pose-card:hover {
                transform: translateY(-4px);
                box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
                border-color: var(--color-accent);
            }
            .pose-card.active {
                border-color: var(--color-accent);
                background: rgba(232, 184, 109, 0.1);
            }
            .loading-spinner {
                border: 3px solid var(--color-border);
                border-top-color: var(--color-accent);
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }
            @keyframes spin {
                to { transform: rotate(360deg); }
            }
            .fade-in {
                animation: fadeIn 0.5s ease forwards;
            }
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden">
    <!-- 顶部导航栏 -->
    <header class="h-14 glass-panel flex items-center justify-between px-6 z-50 relative">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-amber-400 to-orange-600 flex items-center justify-center">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
            </div>
            <h1 class="text-lg font-bold tracking-wide" style="color: var(--color-accent);">3D人物动作编辑器</h1>
            <span class="text-xs px-2 py-0.5 rounded-full border" style="border-color: var(--color-border); color: var(--color-text-dim);">v2.0</span>
        </div>
        
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 text-xs" style="color: var(--color-text-dim);">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                <span>引擎就绪</span>
            </div>
            <button onclick="document.getElementById('fileInput').click()" class="btn-primary px-4 py-1.5 rounded-lg text-sm flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                </svg>
                导入模型
            </button>
            <input type="file" id="fileInput" accept=".gltf,.glb,.fbx,.obj" class="hidden" onchange="handleFileImport(event)">
            <button onclick="exportAnimation()" class="btn-secondary px-4 py-1.5 rounded-lg text-sm flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-4 4m0 0l-4-4m4 4V4"/>
                </svg>
                导出动作
            </button>
        </div>
    </header>

    <!-- 主工作区 -->
    <div class="flex h-[calc(100vh-56px)]">
        <!-- 左侧边栏 - 骨骼层级 -->
        <aside class="w-64 glass-panel flex flex-col border-r" style="border-color: var(--color-border);">
            <div class="p-4 border-b" style="border-color: var(--color-border);">
                <h2 class="text-sm font-bold flex items-center gap-2" style="color: var(--color-accent);">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                    骨骼层级
                </h2>
            </div>
            <div id="boneTree" class="flex-1 overflow-y-auto scroll-custom p-3 space-y-1">
                <!-- 动态生成骨骼树 -->
            </div>
            <div class="p-3 border-t" style="border-color: var(--color-border);">
                <div class="text-xs mb-2" style="color: var(--color-text-dim);">选中骨骼: <span id="selectedBoneName" class="font-medium" style="color: var(--color-accent);">无</span></div>
                <div class="flex gap-2">
                    <button onclick="resetBoneRotation()" class="btn-secondary flex-1 py-1.5 rounded text-xs">重置旋转</button>
                    <button onclick="resetAllBones()" class="btn-secondary flex-1 py-1.5 rounded text-xs">重置全部</button>
                </div>
            </div>
        </aside>

        <!-- 中间 3D 视口 -->
        <main class="flex-1 relative grid-bg">
            <div id="canvas-container" class="w-full h-full"></div>
            
            <!-- 3D 视图控制 -->
            <div class="absolute top-4 left-4 flex flex-col gap-2">
                <button onclick="setViewMode('front')" class="btn-secondary w-10 h-10 rounded-lg flex items-center justify-center text-xs" title="前视图">前</button>
                <button onclick="setViewMode('side')" class="btn-secondary w-10 h-10 rounded-lg flex items-center justify-center text-xs" title="侧视图">侧</button>
                <button onclick="setViewMode('top')" class="btn-secondary w-10 h-10 rounded-lg flex items-center justify-center text-xs" title="顶视图">顶</button>
                <button onclick="setViewMode('perspective')" class="btn-secondary w-10 h-10 rounded-lg flex items-center justify-center text-xs" title="透视图">透</button>
            </div>

            <!-- 显示模式切换 -->
            <div class="absolute top-4 right-4 flex gap-2">
                <button onclick="toggleWireframe()" class="btn-secondary px-3 py-1.5 rounded-lg text-xs flex items-center gap-1">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
                    </svg>
                    线框
                </button>
                <button onclick="toggleSkeleton()" class="btn-secondary px-3 py-1.5 rounded-lg text-xs flex items-center gap-1">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                    </svg>
                    骨骼
                </button>
                <button onclick="toggleHologram()" class="btn-secondary px-3 py-1.5 rounded-lg text-xs flex items-center gap-1">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                    全息
                </button>
            </div>

            <!-- 底部时间轴 -->
            <div class="absolute bottom-0 left-0 right-0 glass-panel border-t p-4" style="border-color: var(--color-border);">
                <div class="flex items-center gap-4 mb-3">
                    <button onclick="togglePlay()" id="playBtn" class="btn-primary w-10 h-10 rounded-full flex items-center justify-center">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                    </button>
                    <button onclick="stopAnimation()" class="btn-secondary w-8 h-8 rounded-full flex items-center justify-center">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M6 6h12v12H6z"/>
                        </svg>
                    </button>
                    <div class="flex items-center gap-2">
                        <span class="text-xs" style="color: var(--color-text-dim);">帧率</span>
                        <select id="fpsSelect" class="btn-secondary px-2 py-1 rounded text-xs">
                            <option value="24">24fps</option>
                            <option value="30">30fps</option>
                            <option value="60" selected>60fps</option>
                        </select>
                    </div>
                    <div class="flex-1"></div>
                    <div class="text-sm font-mono" style="color: var(--color-accent);">
                        <span id="currentFrame">0</span> / <span id="totalFrames">120</span> 帧
                    </div>
                </div>
                <div class="timeline-track h-10 rounded-lg" id="timeline">
                    <div class="timeline-playhead" id="playhead"></div>
                    <!-- 关键帧标记 -->
                </div>
                <div class="flex justify-between mt-1 text-xs" style="color: var(--color-text-dim);">
                    <span>0s</span>
                    <span>1s</span>
                    <span>2s</span>
                    <span>3s</span>
                    <span>4s</span>
                </div>
            </div>

            <!-- 加载提示 -->
            <div id="loadingOverlay" class="absolute inset-0 flex items-center justify-center bg-black/50 backdrop-blur-sm hidden">
                <div class="text-center">
                    <div class="loading-spinner w-12 h-12 mx-auto mb-4"></div>
                    <p class="text-sm" style="color: var(--color-accent);">正在加载模型...</p>
                </div>
            </div>
        </main>

        <!-- 右侧边栏 - 属性面板 -->
        <aside class="w-80 glass-panel flex flex-col border-l" style="border-color: var(--color-border);">
            <!-- 动作预设 -->
            <div class="p-4 border-b" style="border-color: var(--color-border);">
                <h2 class="text-sm font-bold mb-3 flex items-center gap-2" style="color: var(--color-accent);">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    动作预设
                </h2>
                <div class="grid grid-cols-2 gap-2">
                    <div class="pose-card p-3 rounded-lg border text-center" style="border-color: var(--color-border);" onclick="loadPose('tpose')">
                        <div class="w-full h-16 rounded mb-2 flex items-center justify-center" style="background: var(--color-surface-light);">
                            <svg class="w-8 h-8" style="color: var(--color-text-dim);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4v16m-8-8h16"/>
                            </svg>
                        </div>
                        <span class="text-xs">T-Pose</span>
                    </div>
                    <div class="pose-card p-3 rounded-lg border text-center" style="border-color: var(--color-border);" onclick="loadPose('apose')">
                        <div class="w-full h-16 rounded mb-2 flex items-center justify-center" style="background: var(--color-surface-light);">
                            <svg class="w-8 h-8" style="color: var(--color-text-dim);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4v16m-6-6l6-6 6 6"/>
                            </svg>
                        </div>
                        <span class="text-xs">A-Pose</span>
                    </div>
                    <div class="pose-card p-3 rounded-lg border text-center" style="border-color: var(--color-border);" onclick="loadPose('walking')">
                        <div class="w-full h-16 rounded mb-2 flex items-center justify-center" style="background: var(--color-surface-light);">
                            <svg class="w-8 h-8" style="color: var(--color-text-dim);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
                            </svg>
                        </div>
                        <span class="text-xs">行走</span>
                    </div>
                    <div class="pose-card p-3 rounded-lg border text-center" style="border-color: var(--color-border);" onclick="loadPose('running')">
                        <div class="w-full h-16 rounded mb-2 flex items-center justify-center" style="background: var(--color-surface-light);">
                            <svg class="w-8 h-8" style="color: var(--color-text-dim);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                            </svg>
                        </div>
                        <span class="text-xs">奔跑</span>
                    </div>
                </div>
            </div>

            <!-- 武术动作 -->
            <div class="p-4 border-b" style="border-color: var(--color-border);">
                <h2 class="text-sm font-bold mb-3 flex items-center gap-2" style="color: var(--color-accent);">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21v-8a2 2 0 012-2h14a2 2 0 012 2v8M3 21h18M5 21v-8a2 2 0 012-2h14a2 2 0 012 2v8"/>
                    </svg>
                    武术动作
                </h2>
                <div class="space-y-2">
                    <button onclick="loadPose('punch')" class="btn-secondary w-full py-2 rounded-lg text-sm flex items-center gap-2">
                        <span class="w-6 h-6 rounded flex items-center justify-center text-xs" style="background: rgba(232, 184, 109, 0.2); color: var(--color-accent);">拳</span>
                        直拳出击
                    </button>
                    <button onclick="loadPose('kick')" class="btn-secondary w-full py-2 rounded-lg text-sm flex items-center gap-2">
                        <span class="w-6 h-6 rounded flex items-center justify-center text-xs" style="background: rgba(232, 184, 109, 0.2); color: var(--color-accent);">腿</span>
                        侧踢
                    </button>
                    <button onclick="loadPose('defense')" class="btn-secondary w-full py-2 rounded-lg text-sm flex items-center gap-2">
                        <span class="w-6 h-6 rounded flex items-center justify-center text-xs" style="background: rgba(232, 184, 109, 0.2); color: var(--color-accent);">防</span>
                        防御姿态
                    </button>
                    <button onclick="loadPose('stance')" class="btn-secondary w-full py-2 rounded-lg text-sm flex items-center gap-2">
                        <span class="w-6 h-6 rounded flex items-center justify-center text-xs" style="background: rgba(232, 184, 109, 0.2); color: var(--color-accent);">马</span>
                        马步
                    </button>
                </div>
            </div>

            <!-- 旋转控制 -->
            <div class="p-4 flex-1 overflow-y-auto scroll-custom">
                <h2 class="text-sm font-bold mb-3 flex items-center gap-2" style="color: var(--color-accent);">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                    旋转控制
                </h2>
                <div class="space-y-4">
                    <div>
                        <div class="flex justify-between mb-1">
                            <label class="text-xs" style="color: var(--color-text-dim);">X 轴旋转</label>
                            <span id="rotXValue" class="text-xs font-mono" style="color: var(--color-accent);">0°</span>
                        </div>
                        <input type="range" id="rotX" class="slider-custom" min="-180" max="180" value="0" oninput="updateBoneRotation('x', this.value)">
                    </div>
                    <div>
                        <div class="flex justify-between mb-1">
                            <label class="text-xs" style="color: var(--color-text-dim);">Y 轴旋转</label>
                            <span id="rotYValue" class="text-xs font-mono" style="color: var(--color-accent);">0°</span>
                        </div>
                        <input type="range" id="rotY" class="slider-custom" min="-180" max="180" value="0" oninput="updateBoneRotation('y', this.value)">
                    </div>
                    <div>
                        <div class="flex justify-between mb-1">
                            <label class="text-xs" style="color: var(--color-text-dim);">Z 轴旋转</label>
                            <span id="rotZValue" class="text-xs font-mono" style="color: var(--color-accent);">0°</span>
                        </div>
                        <input type="range" id="rotZ" class="slider-custom" min="-180" max="180" value="0" oninput="updateBoneRotation('z', this.value)">
                    </div>
                </div>

                <div class="mt-6">
                    <h2 class="text-sm font-bold mb-3 flex items-center gap-2" style="color: var(--color-accent);">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                        </svg>
                        位置微调
                    </h2>
                    <div class="space-y-4">
                        <div>
                            <div class="flex justify-between mb-1">
                                <label class="text-xs" style="color: var(--color-text-dim);">X 位置</label>
                                <span id="posXValue" class="text-xs font-mono" style="color: var(--color-accent);">0.00</span>
                            </div>
                            <input type="range" id="posX" class="slider-custom" min="-2" max="2" step="0.01" value="0" oninput="updateBonePosition('x', this.value)">
                        </div>
                        <div>
                            <div class="flex justify-between mb-1">
                                <label class="text-xs" style="color: var(--color-text-dim);">Y 位置</label>
                                <span id="posYValue" class="text-xs font-mono" style="color: var(--color-accent);">0.00</span>
                            </div>
                            <input type="range" id="posY" class="slider-custom" min="-2" max="2" step="0.01" value="0" oninput="updateBonePosition('y', this.value)">
                        </div>
                        <div>
                            <div class="flex justify-between mb-1">
                                <label class="text-xs" style="color: var(--color-text-dim);">Z 位置</label>
                                <span id="posZValue" class="text-xs font-mono" style="color: var(--color-accent);">0.00</span>
                            </div>
                            <input type="range" id="posZ" class="slider-custom" min="-2" max="2" step="0.01" value="0" oninput="updateBonePosition('z', this.value)">
                        </div>
                    </div>
                </div>

                <div class="mt-6 p-3 rounded-lg border" style="border-color: var(--color-border); background: var(--color-surface-light);">
                    <h3 class="text-xs font-bold mb-2" style="color: var(--color-accent);">全息投影模式</h3>
                    <div class="space-y-2">
                        <div class="flex items-center justify-between">
                            <span class="text-xs" style="color: var(--color-text-dim);">透明度</span>
                            <input type="range" class="slider-custom w-24" min="0" max="100" value="30" oninput="updateHologramOpacity(this.value)">
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-xs" style="color: var(--color-text-dim);">扫描线</span>
                            <input type="checkbox" id="scanlineToggle" checked onchange="toggleScanline()" class="accent-amber-500">
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-xs" style="color: var(--color-text-dim);">发光强度</span>
                            <input type="range" class="slider-custom w-24" min="0" max="100" value="50" oninput="updateGlowIntensity(this.value)">
                        </div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        // Three.js 全局变量
        let scene, camera, renderer, controls;
        let character, skeleton, bones = [];
        let selectedBone = null;
        let isPlaying = false;
        let currentFrame = 0;
        let totalFrames = 120;
        let animationId;
        let isWireframe = false;
        let showSkeleton = true;
        let isHologram = false;
        let hologramOpacity = 0.3;
        let scanlineEnabled = true;
        let glowIntensity = 0.5;
        let skeletonHelper;

        // 初始化 Three.js 场景
        function initScene() {
            const container = document.getElementById('canvas-container');
            
            // 场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0f);
            scene.fog = new THREE.Fog(0x0a0a0f, 10, 50);

            // 相机
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 1.5, 4);

            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 控制器
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 1, 0);
            controls.minDistance = 2;
            controls.maxDistance = 10;

            // 灯光
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);

            const keyLight = new THREE.DirectionalLight(0xffffff, 1);
            keyLight.position.set(5, 10, 7);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 2048;
            keyLight.shadow.mapSize.height = 2048;
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0x4a9eff, 0.3);
            fillLight.position.set(-5, 5, -5);
            scene.add(fillLight);

            const rimLight = new THREE.DirectionalLight(0xe8b86d, 0.3);
            rimLight.position.set(0, 5, -8);
            scene.add(rimLight);

            // 地面网格
            const gridHelper = new THREE.GridHelper(20, 40, 0x2a2a3a, 0x1a1a28);
            scene.add(gridHelper);

            // 地面平面
            const planeGeometry = new THREE.PlaneGeometry(20, 20);
            const planeMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x0a0a0f,
                roughness: 0.8,
                metalness: 0.2
            });
            const plane = new THREE.Mesh(planeGeometry, planeMaterial);
            plane.rotation.x = -Math.PI / 2;
            plane.receiveShadow = true;
            scene.add(plane);

            // 创建默认人物模型
            createDefaultCharacter();

            // 窗口大小调整
            window.addEventListener('resize', onWindowResize);

            // 开始渲染循环
            animate();
        }

        // 创建默认人物模型（简化版）
        function createDefaultCharacter() {
            character = new THREE.Group();

            // 材质
            const bodyMaterial = new THREE.MeshStandardMaterial({
                color: 0x8a8a9a,
                roughness: 0.5,
                metalness: 0.3
            });

            const jointMaterial = new THREE.MeshStandardMaterial({
                color: 0x4a9eff,
                roughness: 0.3,
                metalness: 0.7,
                emissive: 0x1a3a5a,
                emissiveIntensity: 0.2
            });

            // 头部
            const headGeo = new THREE.SphereGeometry(0.12, 16, 16);
            const head = new THREE.Mesh(headGeo, bodyMaterial);
            head.position.y = 1.7;
            head.castShadow = true;
            head.name = 'head';
            character.add(head);
            bones.push({ name: 'head', mesh: head, parent: null });

            // 颈部
            const neckGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.08, 8);
            const neck = new THREE.Mesh(neckGeo, jointMaterial);
            neck.position.y = 1.58;
            neck.name = 'neck';
            character.add(neck);
            bones.push({ name: 'neck', mesh: neck, parent: 'head' });

            // 躯干
            const torsoGeo = new THREE.CylinderGeometry(0.15, 0.12, 0.5, 12);
            const torso = new THREE.Mesh(torsoGeo, bodyMaterial);
            torso.position.y = 1.3;
            torso.castShadow = true;
            torso.name = 'torso';
            character.add(torso);
            bones.push({ name: 'torso', mesh: torso, parent: 'neck' });

            // 胸部
            const chestGeo = new THREE.CylinderGeometry(0.18, 0.15, 0.25, 12);
            const chest = new THREE.Mesh(chestGeo, bodyMaterial);
            chest.position.y = 1.55;
            chest.castShadow = true;
            chest.name = 'chest';
            character.add(chest);
            bones.push({ name: 'chest', mesh: chest, parent: 'torso' });

            // 骨盆
            const pelvisGeo = new THREE.CylinderGeometry(0.12, 0.14, 0.15, 12);
            const pelvis = new THREE.Mesh(pelvisGeo, bodyMaterial);
            pelvis.position.y = 1.0;
            pelvis.castShadow = true;
            pelvis.name = 'pelvis';
            character.add(pelvis);
            bones.push({ name: 'pelvis', mesh: pelvis, parent: 'torso' });

            // 左上臂
            const leftUpperArmGeo = new THREE.CylinderGeometry(0.04, 0.035, 0.3, 8);
            const leftUpperArm = new THREE.Mesh(leftUpperArmGeo, bodyMaterial);
            leftUpperArm.position.set(-0.22, 1.45, 0);
            leftUpperArm.castShadow = true;
            leftUpperArm.name = 'leftUpperArm';
            character.add(leftUpperArm);
            bones.push({ name: 'leftUpperArm', mesh: leftUpperArm, parent: 'chest' });

            // 左前臂
            const leftForearmGeo = new THREE.CylinderGeometry(0.035, 0.03, 0.28, 8);
            const leftForearm = new THREE.Mesh(leftForearmGeo, bodyMaterial);
            leftForearm.position.set(-0.22, 1.15, 0);
            leftForearm.castShadow = true;
            leftForearm.name = 'leftForearm';
            character.add(leftForearm);
            bones.push({ name: 'leftForearm', mesh: leftForearm, parent: 'leftUpperArm' });

            // 左手
            const leftHandGeo = new THREE.SphereGeometry(0.04, 8, 8);
            const leftHand = new THREE.Mesh(leftHandGeo, jointMaterial);
            leftHand.position.set(-0.22, 0.95, 0);
            leftHand.name = 'leftHand';
            character.add(leftHand);
            bones.push({ name: 'leftHand', mesh: leftHand, parent: 'leftForearm' });

            // 右上臂
            const rightUpperArmGeo = new THREE.CylinderGeometry(0.04, 0.035, 0.3, 8);
            const rightUpperArm = new THREE.Mesh(rightUpperArmGeo, bodyMaterial);
            rightUpperArm.position.set(0.22, 1.45, 0);
            rightUpperArm.castShadow = true;
            rightUpperArm.name = 'rightUpperArm';
            character.add(rightUpperArm);
            bones.push({ name: 'rightUpperArm', mesh: rightUpperArm, parent: 'chest' });

            // 右前臂
            const rightForearmGeo = new THREE.CylinderGeometry(0.035, 0.03, 0.28, 8);
            const rightForearm = new THREE.Mesh(rightForearmGeo, bodyMaterial);
            rightForearm.position.set(0.22, 1.15, 0);
            rightForearm.castShadow = true;
            rightForearm.name = 'rightForearm';
            character.add(rightForearm);
            bones.push({ name: 'rightForearm', mesh: rightForearm, parent: 'rightUpperArm' });

            // 右手
            const rightHandGeo = new THREE.SphereGeometry(0.04, 8, 8);
            const rightHand = new THREE.Mesh(rightHandGeo, jointMaterial);
            rightHand.position.set(0.22, 0.95, 0);
            rightHand.name = 'rightHand';
            character.add(rightHand);
            bones.push({ name: 'rightHand', mesh: rightHand, parent: 'rightForearm' });

            // 左大腿
            const leftThighGeo = new THREE.CylinderGeometry(0.06, 0.05, 0.4, 8);
            const leftThigh = new THREE.Mesh(leftThighGeo, bodyMaterial);
            leftThigh.position.set(-0.1, 0.8, 0);
            leftThigh.castShadow = true;
            leftThigh.name = 'leftThigh';
            character.add(leftThigh);
            bones.push({ name: 'leftThigh', mesh: leftThigh, parent: 'pelvis' });

            // 左小腿
            const leftShinGeo = new THREE.CylinderGeometry(0.05, 0.04, 0.4, 8);
            const leftShin = new THREE.Mesh(leftShinGeo, bodyMaterial);
            leftShin.position.set(-0.1, 0.4, 0);
            leftShin.castShadow = true;
            leftShin.name = 'leftShin';
            character.add(leftShin);
            bones.push({ name: 'leftShin', mesh: leftShin, parent: 'leftThigh' });

            // 左脚
            const leftFootGeo = new THREE.BoxGeometry(0.08, 0.05, 0.15);
            const leftFoot = new THREE.Mesh(leftFootGeo, jointMaterial);
            leftFoot.position.set(-0.1, 0.15, 0.02);
            leftFoot.name = 'leftFoot';
            character.add(leftFoot);
            bones.push({ name: 'leftFoot', mesh: leftFoot, parent: 'leftShin' });

            // 右大腿
            const rightThighGeo = new THREE.CylinderGeometry(0.06, 0.05, 0.4, 8);
            const rightThigh = new THREE.Mesh(rightThighGeo, bodyMaterial);
            rightThigh.position.set(0.1, 0.8, 0);
            rightThigh.castShadow = true;
            rightThigh.name = 'rightThigh';
            character.add(rightThigh);
            bones.push({ name: 'rightThigh', mesh: rightThigh, parent: 'pelvis' });

            // 右小腿
            const rightShinGeo = new THREE.CylinderGeometry(0.05, 0.04, 0.4, 8);
            const rightShin = new THREE.Mesh(rightShinGeo, bodyMaterial);
            rightShin.position.set(0.1, 0.4, 0);
            rightShin.castShadow = true;
            rightShin.name = 'rightShin';
            character.add(rightShin);
            bones.push({ name: 'rightShin', mesh: rightShin, parent: 'rightThigh' });

            // 右脚
            const rightFootGeo = new THREE.BoxGeometry(0.08, 0.05, 0.15);
            const rightFoot = new THREE.Mesh(rightFootGeo, jointMaterial);
            rightFoot.position.set(0.1, 0.15, 0.02);
            rightFoot.name = 'rightFoot';
            character.add(rightFoot);
            bones.push({ name: 'rightFoot', mesh: rightFoot, parent: 'rightShin' });

            scene.add(character);

            // 创建骨骼辅助线
            createSkeletonHelper();

            // 更新骨骼树UI
            updateBoneTree();
        }

        // 创建骨骼辅助线
        function createSkeletonHelper() {
            if (skeletonHelper) {
                scene.remove(skeletonHelper);
            }

            const points = [];
            bones.forEach(bone => {
                if (bone.parent) {
                    const parentBone = bones.find(b => b.name === bone.parent);
                    if (parentBone) {
                        points.push(parentBone.mesh.position.clone());
                        points.push(bone.mesh.position.clone());
                    }
                }
            });

            const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
            const lineMaterial = new THREE.LineBasicMaterial({ 
                color: 0x4a9eff,
                transparent: true,
                opacity: 0.6
            });
            skeletonHelper = new THREE.LineSegments(lineGeometry, lineMaterial);
            skeletonHelper.visible = showSkeleton;
            scene.add(skeletonHelper);
        }

        // 更新骨骼树UI
        function updateBoneTree() {
            const treeContainer = document.getElementById('boneTree');
            treeContainer.innerHTML = '';

            bones.forEach(bone => {
                const boneElement = document.createElement('div');
                boneElement.className = 'bone-node p-2 rounded-lg border text-sm flex items-center gap-2';
                boneElement.style.borderColor = 'var(--color-border)';
                boneElement.dataset.boneName = bone.name;
                
                const indent = bone.parent ? 'ml-4' : '';
                const icon = bone.parent ? 
                    '<svg class="w-3 h-3" style="color: var(--color-primary);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>' :
                    '<svg class="w-3 h-3" style="color: var(--color-accent);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>';

                boneElement.innerHTML = `
                    <div class="${indent} flex items-center gap-2 flex-1">
                        ${icon}
                        <span>${getBoneDisplayName(bone.name)}</span>
                    </div>
                `;

                boneElement.addEventListener('click', () => selectBone(bone.name));
                treeContainer.appendChild(boneElement);
            });
        }

        // 获取骨骼显示名称
        function getBoneDisplayName(name) {
            const names = {
                'head': '头部',
                'neck': '颈部',
                'torso': '躯干',
                'chest': '胸部',
                'pelvis': '骨盆',
                'leftUpperArm': '左上臂',
                'leftForearm': '左前臂',
                'leftHand': '左手',
                'rightUpperArm': '右上臂',
                'rightForearm': '右前臂',
                'rightHand': '右手',
                'leftThigh': '左大腿',
                'leftShin': '左小腿',
                'leftFoot': '左脚',
                'rightThigh': '右大腿',
                'rightShin': '右小腿',
                'rightFoot': '右脚'
            };
            return names[name] || name;
        }

        // 选择骨骼
        function selectBone(boneName) {
            // 移除之前的选中状态
            document.querySelectorAll('.bone-node').forEach(node => {
                node.classList.remove('selected');
            });

            // 添加新的选中状态
            const selectedNode = document.querySelector(`[data-bone-name="${boneName}"]`);
            if (selectedNode) {
                selectedNode.classList.add('selected');
            }

            selectedBone = bones.find(b => b.name === boneName);
            document.getElementById('selectedBoneName').textContent = getBoneDisplayName(boneName);

            // 更新旋转滑块
            if (selectedBone) {
                const rotation = selectedBone.mesh.rotation;
                document.getElementById('rotX').value = THREE.MathUtils.radToDeg(rotation.x);
                document.getElementById('rotY').value = THREE.MathUtils.radToDeg(rotation.y);
                document.getElementById('rotZ').value = THREE.MathUtils.radToDeg(rotation.z);
                document.getElementById('rotXValue').textContent = Math.round(THREE.MathUtils.radToDeg(rotation.x)) + '°';
                document.getElementById('rotYValue').textContent = Math.round(THREE.MathUtils.radToDeg(rotation.y)) + '°';
                document.getElementById('rotZValue').textContent = Math.round(THREE.MathUtils.radToDeg(rotation.z)) + '°';

                // 更新位置滑块
                const position = selectedBone.mesh.position;
                document.getElementById('posX').value = position.x;
                document.getElementById('posY').value = position.y;
                document.getElementById('posZ').value = position.z;
                document.getElementById('posXValue').textContent = position.x.toFixed(2);
                document.getElementById('posYValue').textContent = position.y.toFixed(2);
                document.getElementById('posZValue').textContent = position.z.toFixed(2);
            }
        }

        // 更新骨骼旋转
        function updateBoneRotation(axis, value) {
            if (!selectedBone) return;

            const radians = THREE.MathUtils.degToRad(parseFloat(value));
            selectedBone.mesh.rotation[axis] = radians;

            document.getElementById(`rot${axis.toUpperCase()}Value`).textContent = Math.round(value) + '°';

            // 更新骨骼辅助线
            createSkeletonHelper();
        }

        // 更新骨骼位置
        function updateBonePosition(axis, value) {
            if (!selectedBone) return;

            selectedBone.mesh.position[axis] = parseFloat(value);
            document.getElementById(`pos${axis.toUpperCase()}Value`).textContent = parseFloat(value).toFixed(2);

            // 更新骨骼辅助线
            createSkeletonHelper();
        }

        // 重置骨骼旋转
        function resetBoneRotation() {
            if (!selectedBone) return;

            selectedBone.mesh.rotation.set(0, 0, 0);
            document.getElementById('rotX').value = 0;
            document.getElementById('rotY').value = 0;
            document.getElementById('rotZ').value = 0;
            document.getElementById('rotXValue').textContent = '0°';
            document.getElementById('rotYValue').textContent = '0°';
            document.getElementById('rotZValue').textContent = '0°';

            createSkeletonHelper();
        }

        // 重置所有骨骼
        function resetAllBones() {
            bones.forEach(bone => {
                bone.mesh.rotation.set(0, 0, 0);
            });

            document.getElementById('rotX').value = 0;
            document.getElementById('rotY').value = 0;
            document.getElementById('rotZ').value = 0;
            document.getElementById('rotXValue').textContent = '0°';
            document.getElementById('rotYValue').textContent = '0°';
            document.getElementById('rotZValue').textContent = '0°';

            createSkeletonHelper();
        }

        // 加载预设姿势
        function loadPose(poseName) {
            resetAllBones();

            const poses = {
                'tpose': () => {
                    // T-Pose: 手臂平举
                    const leftUpperArm = bones.find(b => b.name === 'leftUpperArm');
                    const rightUpperArm = bones.find(b => b.name === 'rightUpperArm');
                    if (leftUpperArm) leftUpperArm.mesh.rotation.z = Math.PI / 2;
                    if (rightUpperArm) rightUpperArm.mesh.rotation.z = -Math.PI / 2;
                },
                'apose': () => {
                    // A-Pose: 手臂斜举
                    const leftUpperArm = bones.find(b => b.name === 'leftUpperArm');
                    const rightUpperArm = bones.find(b => b.name === 'rightUpperArm');
                    if (leftUpperArm) leftUpperArm.mesh.rotation.z = Math.PI / 3;
                    if (rightUpperArm) rightUpperArm.mesh.rotation.z = -Math.PI / 3;
                },
                'walking': () => {
                    // 行走姿势
                    const leftThigh = bones.find(b => b.name === 'leftThigh');
                    const rightThigh = bones.find(b => b.name === 'rightThigh');
                    const leftShin = bones.find(b => b.name === 'leftShin');
                    const rightShin = bones.find(b => b.name === 'rightShin');
                    const leftUpperArm = bones.find(b => b.name === 'leftUpperArm');
                    const rightUpperArm = bones.find(b => b.name === 'rightUpperArm');

                    if (leftThigh) leftThigh.mesh.rotation.x = 0.3;
                    if (rightThigh) rightThigh.mesh.rotation.x = -0.3;
                    if (leftShin) leftShin.mesh.rotation.x = 0.2;
                    if (rightShin) rightShin.mesh.rotation.x = 0.1;
                    if (leftUpperArm) leftUpperArm.mesh.rotation.x = -0.3;
                    if (rightUpperArm) rightUpperArm.mesh.rotation.x = 0.3;
                },
                'running': () => {
                    // 奔跑姿势
                    const leftThigh = bones.find(b => b.name === 'leftThigh');
                    const rightThigh = bones.find(b => b.name === 'rightThigh');
                    const leftShin = bones.find(b => b.name === 'leftShin');
                    const rightShin = bones.find(b => b.name === 'rightShin');
                    const leftUpperArm = bones.find(b => b.name === 'leftUpperArm');
                    const rightUpperArm = bones.find(b => b.name === 'rightUpperArm');
                    const torso = bones.find(b => b.name === 'torso');

                    if (leftThigh) leftThigh.mesh.rotation.x = 0.6;
                    if (rightThigh) rightThigh.mesh.rotation.x = -0.6;
                    if (leftShin) leftShin.mesh.rotation.x = 0.8;
                    if (rightShin) rightShin.mesh.rotation.x = 0.2;
                    if (leftUpperArm) leftUpperArm.mesh.rotation.x = -0.6;
                    if (rightUpperArm) rightUpperArm.mesh.rotation.x = 0.6;
                    if (torso) torso.mesh.rotation.x = 0.15;
                },
                'punch': () => {
                    // 直拳
                    const rightUpperArm = bones.find(b => b.name === 'rightUpperArm');
                    const rightForearm = bones.find(b => b.name === 'rightForearm');
                    const leftUpperArm = bones.find(b => b.name === 'leftUpperArm');
                    const torso = bones.find(b => b.name === 'torso');

                    if (rightUpperArm) {
                        rightUpperArm.mesh.rotation.x = -Math.PI / 3;
                        rightUpperArm.mesh.rotation.y = -0.2;
                    }
                    if (rightForearm) rightForearm.mesh.rotation.x = -Math.PI / 6;
                    if (leftUpperArm) {
                        leftUpperArm.mesh.rotation.z = Math.PI / 4;
                        leftUpperArm.mesh.rotation.x = -0.3;
                    }
                    if (torso) torso.mesh.rotation.y = -0.2;
                },
                'kick': () => {
                    // 侧踢
                    const rightThigh = bones.find(b => b.name === 'rightThigh');
                    const rightShin = bones.find(b => b.name === 'rightShin');
                    const leftThigh = bones.find(b => b.name === 'leftThigh');
                    const torso = bones.find(b => b.name === 'torso');
                    const pelvis = bones.find(b => b.name === 'pelvis');

                    if (rightThigh) {
                        rightThigh.mesh.rotation.z = Math.PI / 2.5;
                        rightThigh.mesh.rotation.x = 0.2;
                    }
                    if (rightShin) rightShin.mesh.rotation.x = 0.1;
                    if (leftThigh) leftThigh.mesh.rotation.z = -0.2;
                    if (torso) torso.mesh.rotation.z = 0.1;
                    if (pelvis) pelvis.mesh.rotation.y = 0.3;
                },
                'defense': () => {
                    // 防御姿态
                    const leftUpperArm = bones.find(b => b.name === 'leftUpperArm');
                    const rightUpperArm = bones.find(b => b.name === 'rightUpperArm');
                    const leftForearm = bones.find(b => b.name === 'leftForearm');
                    const rightForearm = bones.find(b => b.name === 'rightForearm');
                    const torso = bones.find(b => b.name === 'torso');

                    if (leftUpperArm) {
                        leftUpperArm.mesh.rotation.x = -Math.PI / 2.5;
                        leftUpperArm.mesh.rotation.z = 0.3;
                    }
                    if (rightUpperArm) {
                        rightUpperArm.mesh.rotation.x = -Math.PI / 2.5;
                        rightUpperArm.mesh.rotation.z = -0.3;
                    }
                    if (leftForearm) leftForearm.mesh.rotation.x = -Math.PI / 3;
                    if (rightForearm) rightForearm.mesh.rotation.x = -Math.PI / 3;
                    if (torso) torso.mesh.rotation.x = 0.1;
                },
                'stance': () => {
                    // 马步
                    const leftThigh = bones.find(b => b.name === 'leftThigh');
                    const rightThigh = bones.find(b => b.name === 'rightThigh');
                    const leftShin = bones.find(b => b.name === 'leftShin');
                    const rightShin = bones.find(b => b.name === 'rightShin');
                    const leftUpperArm = bones.find(b => b.name === 'leftUpperArm');
                    const rightUpperArm = bones.find(b => b.name === 'rightUpperArm');
                    const pelvis = bones.find(b => b.name === 'pelvis');

                    if (leftThigh) leftThigh.mesh.rotation.z = Math.PI / 6;
                    if (rightThigh) rightThigh.mesh.rotation.z = -Math.PI / 6;
                    if (leftShin) leftShin.mesh.rotation.z = -Math.PI / 8;
                    if (rightShin) rightShin.mesh.rotation.z = Math.PI / 8;
                    if (leftUpperArm) {
                        leftUpperArm.mesh.rotation.z = Math.PI / 3;
                        leftUpperArm.mesh.rotation.x = -0.2;
                    }
                    if (rightUpperArm) {
                        rightUpperArm.mesh.rotation.z = -Math.PI / 3;
                        rightUpperArm.mesh.rotation.x = -0.2;
                    }
                    if (pelvis) pelvis.mesh.position.y = 0.85;
                }
            };

            if (poses[poseName]) {
                poses[poseName]();
                createSkeletonHelper();

                // 更新选中骨骼的旋转值
                if (selectedBone) {
                    selectBone(selectedBone.name);
                }
            }
        }

        // 切换线框模式
        function toggleWireframe() {
            isWireframe = !isWireframe;
            character.traverse(child => {
                if (child.isMesh) {
                    child.material.wireframe = isWireframe;
                }
            });
        }

        // 切换骨骼显示
        function toggleSkeleton() {
            showSkeleton = !showSkeleton;
            if (skeletonHelper) {
                skeletonHelper.visible = showSkeleton;
            }
        }

        // 切换全息模式
        function toggleHologram() {
            isHologram = !isHologram;
            character.traverse(child => {
                if (child.isMesh) {
                    if (isHologram) {
                        child.material.transparent = true;
                        child.material.opacity = hologramOpacity;
                        child.material.emissive = new THREE.Color(0x00ffff);
                        child.material.emissiveIntensity = glowIntensity;
                    } else {
                        child.material.transparent = false;
                        child.material.opacity = 1;
                        child.material.emissive = new THREE.Color(0x000000);
                        child.material.emissiveIntensity = 0;
                    }
                }
            });
        }

        // 更新全息透明度
        function updateHologramOpacity(value) {
            hologramOpacity = value / 100;
            if (isHologram) {
                character.traverse(child => {
                    if (child.isMesh) {
                        child.material.opacity = hologramOpacity;
                    }
                });
            }
        }

        // 切换扫描线
        function toggleScanline() {
            scanlineEnabled = document.getElementById('scanlineToggle').checked;
        }

        // 更新发光强度
        function updateGlowIntensity(value) {
            glowIntensity = value / 100;
            if (isHologram) {
                character.traverse(child => {
                    if (child.isMesh) {
                        child.material.emissiveIntensity = glowIntensity;
                    }
                });
            }
        }

        // 设置视图模式
        function setViewMode(mode) {
            switch(mode) {
                case 'front':
                    camera.position.set(0, 1.5, 4);
                    controls.target.set(0, 1, 0);
                    break;
                case 'side':
                    camera.position.set(4, 1.5, 0);
                    controls.target.set(0, 1, 0);
                    break;
                case 'top':
                    camera.position.set(0, 5, 0);
                    controls.target.set(0, 1, 0);
                    break;
                case 'perspective':
                    camera.position.set(3, 2, 3);
                    controls.target.set(0, 1, 0);
                    break;
            }
            controls.update();
        }

        // 播放/暂停动画
        function togglePlay() {
            isPlaying = !isPlaying;
            const playBtn = document.getElementById('playBtn');
            if (isPlaying) {
                playBtn.innerHTML = '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/></svg>';
                playAnimation();
            } else {
                playBtn.innerHTML = '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
            }
        }

        // 停止动画
        function stopAnimation() {
            isPlaying = false;
            currentFrame = 0;
            document.getElementById('currentFrame').textContent = '0';
            document.getElementById('playhead').style.left = '0%';
            const playBtn = document.getElementById('playBtn');
            playBtn.innerHTML = '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
        }

        // 播放动画
        function playAnimation() {
            if (!isPlaying) return;

            currentFrame++;
            if (currentFrame >= totalFrames) {
                currentFrame = 0;
            }

            document.getElementById('currentFrame').textContent = currentFrame;
            document.getElementById('playhead').style.left = (currentFrame / totalFrames * 100) + '%';

            // 简单的动画演示
            const time = currentFrame / 60;
            const leftThigh = bones.find(b => b.name === 'leftThigh');
            const rightThigh = bones.find(b => b.name === 'rightThigh');
            const leftShin = bones.find(b => b.name === 'leftShin');
            const rightShin = bones.find(b => b.name === 'rightShin');

            if (leftThigh) leftThigh.mesh.rotation.x = Math.sin(time * 4) * 0.3;
            if (rightThigh) rightThigh.mesh.rotation.x = Math.sin(time * 4 + Math.PI) * 0.3;
            if (leftShin) leftShin.mesh.rotation.x = Math.max(0, Math.sin(time * 4) * 0.5);
            if (rightShin) rightShin.mesh.rotation.x = Math.max(0, Math.sin(time * 4 + Math.PI) * 0.5);

            createSkeletonHelper();

            requestAnimationFrame(playAnimation);
        }

        // 处理文件导入
        function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.classList.remove('hidden');

            const reader = new FileReader();
            reader.onload = function(e) {
                const contents = e.target.result;
                
                if (file.name.endsWith('.gltf') || file.name.endsWith('.glb')) {
                    const loader = new THREE.GLTFLoader();
                    loader.parse(contents, '', function(gltf) {
                        if (character) {
                            scene.remove(character);
                        }
                        character = gltf.scene;
                        scene.add(character);

                        // 提取骨骼
                        bones = [];
                        character.traverse(child => {
                            if (child.isBone) {
                                bones.push({
                                    name: child.name,
                                    mesh: child,
                                    parent: child.parent ? child.parent.name : null
                                });
                            }
                        });

                        updateBoneTree();
                        loadingOverlay.classList.add('hidden');
                    }, function(error) {
                        console.error('Error loading GLTF:', error);
                        loadingOverlay.classList.add('hidden');
                        alert('模型加载失败，请检查文件格式');
                    });
                }
            };

            if (file.name.endsWith('.glb')) {
                reader.readAsArrayBuffer(file);
            } else {
                reader.readAsText(file);
            }
        }

        // 导出动画
        function exportAnimation() {
            const animationData = {
                bones: bones.map(bone => ({
                    name: bone.name,
                    rotation: {
                        x: bone.mesh.rotation.x,
                        y: bone.mesh.rotation.y,
                        z: bone.mesh.rotation.z
                    },
                    position: {
                        x: bone.mesh.position.x,
                        y: bone.mesh.position.y,
                        z: bone.mesh.position.z
                    }
                })),
                timestamp: new Date().toISOString()
            };

            const blob = new Blob([JSON.stringify(animationData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `animation_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // 窗口大小调整
        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // 全息扫描线效果
            if (isHologram && scanlineEnabled) {
                const time = Date.now() * 0.001;
                character.traverse(child => {
                    if (child.isMesh && child.material) {
                        child.material.emissiveIntensity = glowIntensity + Math.sin(time * 3) * 0.1;
                    }
                });
            }

            renderer.render(scene, camera);
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', initScene);
    </script>
</body>
</html>
