<body>

<h1>吹墨成树</h1>
<p class="subtitle">交互式水墨树生成器</p>

<div class="main-container">
  <div class="canvas-wrapper">
    <canvas id="treeCanvas" width="700" height="600"></canvas>
  </div>

  <div class="controls">
    <div class="control-group">
      <label>分叉概率</label>
      <p class="desc">控制树枝分叉的可能性</p>
      <div class="slider-container">
        <input type="range" id="branchProb" min="0" max="100" value="92">
        <span class="value-display" id="branchProbVal">92%</span>
      </div>
    </div>

    <div class="control-group">
      <label>墨水大小</label>
      <p class="desc">调节墨滴的初始半径</p>
      <div class="slider-container">
        <input type="range" id="inkSize" min="2" max="20" value="8">
        <span class="value-display" id="inkSizeVal">8</span>
      </div>
    </div>

    <div class="control-group">
      <label>墨水数量</label>
      <p class="desc">画布底部并排的墨滴数量</p>
      <div class="slider-container">
        <input type="range" id="inkCount" min="1" max="20" value="1">
        <span class="value-display" id="inkCountVal">1</span>
      </div>
    </div>

    <div class="control-group">
      <label>生长速度</label>
      <p class="desc">控制动画播放速度</p>
      <div class="slider-container">
        <input type="range" id="speed" min="1" max="10" value="5">
        <span class="value-display" id="speedVal">5</span>
      </div>
    </div>

    <div class="control-group">
      <label>树枝长度</label>
      <p class="desc">调节单段树枝的长度</p>
      <div class="slider-container">
        <input type="range" id="branchLen" min="10" max="120" value="80">
        <span class="value-display" id="branchLenVal">80</span>
      </div>
    </div>

    <div class="control-group">
      <label>桃花数量</label>
      <p class="desc">控制树枝末端桃花的数量</p>
      <div class="slider-container">
        <input type="range" id="flowerCount" min="0" max="100" value="30">
        <span class="value-display" id="flowerCountVal">30</span>
      </div>
    </div>

    <div class="control-group">
      <label>桃花大小</label>
      <p class="desc">调节桃花的绘制面积</p>
      <div class="slider-container">
        <input type="range" id="flowerSize" min="3" max="25" value="10">
        <span class="value-display" id="flowerSizeVal">10</span>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn-primary" id="generateBtn">生成新树</button>
      <button class="btn-secondary" id="clearBtn">清空画布</button>
    </div>

    <p class="hint">点击"生成新树"按钮从底部生成向上生长的树，或直接在画布底部区域点击来生成吹墨效果</p>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('treeCanvas');
  const ctx = canvas.getContext('2d');

  // 控件
  const branchProbSlider = document.getElementById('branchProb');
  const inkSizeSlider = document.getElementById('inkSize');
  const inkCountSlider = document.getElementById('inkCount');
  const speedSlider = document.getElementById('speed');
  const branchLenSlider = document.getElementById('branchLen');
  const flowerCountSlider = document.getElementById('flowerCount');
  const flowerSizeSlider = document.getElementById('flowerSize');
  const generateBtn = document.getElementById('generateBtn');
  const clearBtn = document.getElementById('clearBtn');

  // 值显示
  const branchProbVal = document.getElementById('branchProbVal');
  const inkSizeVal = document.getElementById('inkSizeVal');
  const inkCountVal = document.getElementById('inkCountVal');
  const speedVal = document.getElementById('speedVal');
  const branchLenVal = document.getElementById('branchLenVal');
  const flowerCountVal = document.getElementById('flowerCountVal');
  const flowerSizeVal = document.getElementById('flowerSizeVal');

  // 更新显示值
  branchProbSlider.addEventListener('input', () => branchProbVal.textContent = branchProbSlider.value + '%');
  inkSizeSlider.addEventListener('input', () => inkSizeVal.textContent = inkSizeSlider.value);
  inkCountSlider.addEventListener('input', () => inkCountVal.textContent = inkCountSlider.value);
  speedSlider.addEventListener('input', () => speedVal.textContent = speedSlider.value);
  branchLenSlider.addEventListener('input', () => branchLenVal.textContent = branchLenSlider.value);
  flowerCountSlider.addEventListener('input', () => flowerCountVal.textContent = flowerCountSlider.value);
  flowerSizeSlider.addEventListener('input', () => flowerSizeVal.textContent = flowerSizeSlider.value);

  // 动画队列
  let animationQueue = [];
  let isAnimating = false;
  let animationId = null;

  // 绘制水墨点（去掉边缘阴影，更实心的墨点）
  function drawInkDrop(x, y, radius, opacity) {
    // 实心墨点，边缘清晰
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(15, 15, 15, ${opacity})`;
    ctx.fill();

    // 内部略深的核心
    ctx.beginPath();
    ctx.arc(x, y, radius * 0.6, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(5, 5, 5, ${opacity * 0.95})`;
    ctx.fill();
  }

  // 绘制树枝（去掉晕染，边缘清晰）
  function drawBranch(x1, y1, x2, y2, width, opacity) {
    // 使用二次贝塞尔曲线让线条更自然
    const midX = (x1 + x2) / 2 + (Math.random() - 0.5) * width * 0.3;
    const midY = (y1 + y2) / 2 + (Math.random() - 0.5) * width * 0.3;

    // 主干线条（实心，无晕染）
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.quadraticCurveTo(midX, midY, x2, y2);
    ctx.lineWidth = width;
    ctx.strokeStyle = `rgba(15, 15, 15, ${opacity})`;
    ctx.lineCap = 'round';
    ctx.stroke();

    // 内部核心线条（更细更浓，增加层次感）
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.quadraticCurveTo(midX, midY, x2, y2);
    ctx.lineWidth = width * 0.5;
    ctx.strokeStyle = `rgba(5, 5, 5, ${opacity * 0.95})`;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  // 绘制水墨风格桃花
  function drawFlower(x, y, size, opacity) {
    const petalCount = 5;
    const petalLen = size;
    const petalWidth = size * 0.45;

    // 花瓣颜色 - 淡雅的粉色
    const petalColor = `rgba(230, 160, 180, ${opacity * 0.75})`;
    const petalCoreColor = `rgba(240, 190, 205, ${opacity * 0.5})`;
    const centerColor = `rgba(200, 120, 140, ${opacity * 0.9})`;

    ctx.save();
    ctx.translate(x, y);

    // 绘制花瓣
    for (let i = 0; i < petalCount; i++) {
      const angle = (Math.PI * 2 / petalCount) * i - Math.PI / 2;
      ctx.save();
      ctx.rotate(angle);

      // 花瓣主体（椭圆形状）
      ctx.beginPath();
      ctx.ellipse(petalLen * 0.5, 0, petalLen * 0.5, petalWidth * 0.5, 0, 0, Math.PI * 2);
      ctx.fillStyle = petalColor;
      ctx.fill();

      // 花瓣内部浅色
      ctx.beginPath();
      ctx.ellipse(petalLen * 0.45, 0, petalLen * 0.35, petalWidth * 0.35, 0, 0, Math.PI * 2);
      ctx.fillStyle = petalCoreColor;
      ctx.fill();

      ctx.restore();
    }

    // 花蕊中心
    ctx.beginPath();
    ctx.arc(0, 0, size * 0.2, 0, Math.PI * 2);
    ctx.fillStyle = centerColor;
    ctx.fill();

    // 花蕊细线
    for (let i = 0; i < 6; i++) {
      const angle = (Math.PI * 2 / 6) * i;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(angle) * size * 0.35, Math.sin(angle) * size * 0.35);
      ctx.lineWidth = 0.8;
      ctx.strokeStyle = `rgba(180, 100, 120, ${opacity * 0.6})`;
      ctx.stroke();
    }

    ctx.restore();
  }

  // 生成随机角度偏移
  function randomAngleOffset() {
    return (Math.random() - 0.5) * Math.PI * 0.6;
  }

  // 生成吹墨树（从底部向上生长）
  function generateInkTree(startX, startY) {
    const branchProb = parseInt(branchProbSlider.value) / 100;
    const inkSize = parseInt(inkSizeSlider.value);
    const inkCount = parseInt(inkCountSlider.value);
    const branchLen = parseInt(branchLenSlider.value);

    const queue = [];

    // 计算底部墨滴的排列位置
    const canvasWidth = canvas.width;
    const margin = 60;
    const availableWidth = canvasWidth - margin * 2;
    const spacing = inkCount > 1 ? availableWidth / (inkCount - 1) : 0;

    for (let i = 0; i < inkCount; i++) {
      // 在底部水平排列墨滴
      const x = inkCount > 1 ? margin + spacing * i : canvasWidth / 2;
      const y = canvas.height - 40 - Math.random() * 20;
      const size = inkSize * (0.8 + Math.random() * 0.5);

      queue.push({
        type: 'ink',
        x: x,
        y: y,
        radius: size,
        opacity: 0.7 + Math.random() * 0.3
      });

      // 从每个墨滴向上生长树枝（角度朝上，略带左右偏移）
      const baseAngle = -Math.PI / 2 + (Math.random() - 0.5) * 0.4;
      // 最粗的初始枝干直径与墨水直径一致
      const baseWidth = size * 2;
      queue.push({
        type: 'branch',
        x1: x,
        y1: y,
        angle: baseAngle,
        length: branchLen * (0.8 + Math.random() * 0.5),
        width: baseWidth,
        opacity: 0.8 + Math.random() * 0.2,
        depth: 0
      });
    }

    return queue;
  }

  // 扩展树枝（向上生长，限制角度）
  function expandBranch(branch, branchProb, branchLen) {
    const results = [];
    const endX = branch.x1 + Math.cos(branch.angle) * branch.length;
    const endY = branch.y1 + Math.sin(branch.angle) * branch.length;

    // 绘制当前树枝
    results.push({
      type: 'drawBranch',
      x1: branch.x1,
      y1: branch.y1,
      x2: endX,
      y2: endY,
      width: branch.width,
      opacity: branch.opacity
    });

    // 在末端添加小墨点（大小与枝干粗细协调）
    if (branch.width > 1.5) {
      results.push({
        type: 'ink',
        x: endX,
        y: endY,
        radius: Math.max(2, branch.width * 0.6),
        opacity: branch.opacity * 0.75
      });
    }

    // 在较细的末端添加桃花
    const flowerCount = parseInt(flowerCountSlider.value);
    const flowerSize = parseInt(flowerSizeSlider.value);
    const flowerProb = flowerCount / 100;

    if (branch.depth >= 3 && branch.width < 4 && Math.random() < flowerProb) {
      const flowerOffsetX = (Math.random() - 0.5) * branch.width * 3;
      const flowerOffsetY = (Math.random() - 0.5) * branch.width * 3;
      results.push({
        type: 'flower',
        x: endX + flowerOffsetX,
        y: endY + flowerOffsetY,
        size: flowerSize * (0.6 + Math.random() * 0.6),
        opacity: 0.6 + Math.random() * 0.4
      });
    }

    // 决定是否分叉
    if (branch.depth < 8 && Math.random() < branchProb) {
      const numBranches = Math.random() < 0.3 ? 3 : 2;

      for (let i = 0; i < numBranches; i++) {
        // 限制分叉角度，主要向上生长
        const angleOffset = (Math.random() - 0.5) * Math.PI * 0.7;
        const newAngle = branch.angle + angleOffset;
        // 确保角度保持向上（不允许向下生长）
        const clampedAngle = Math.max(-Math.PI * 0.9, Math.min(-Math.PI * 0.1, newAngle));
        const newLength = branch.length * (0.65 + Math.random() * 0.25);
        // 分叉时粗细递减更平滑
        const widthDecay = 0.6 + Math.random() * 0.15;
        const newWidth = Math.max(0.8, branch.width * widthDecay);
        const newOpacity = branch.opacity * (0.75 + Math.random() * 0.15);

        if (newWidth > 0.5 && newLength > 5) {
          results.push({
            type: 'branch',
            x1: endX,
            y1: endY,
            angle: clampedAngle,
            length: newLength,
            width: newWidth,
            opacity: newOpacity,
            depth: branch.depth + 1
          });
        }
      }
    }

    // 偶尔在树枝中间长出小枝条
    if (branch.depth < 5 && Math.random() < branchProb * 0.4) {
      const midX = (branch.x1 + endX) / 2;
      const midY = (branch.y1 + endY) / 2;
      const sideAngle = branch.angle + (Math.random() < 0.5 ? 1 : -1) * (Math.PI / 4 + Math.random() * 0.4);
      // 限制侧枝角度也保持向上
      const clampedSideAngle = Math.max(-Math.PI * 0.85, Math.min(-Math.PI * 0.15, sideAngle));
      const sideLength = branch.length * (0.35 + Math.random() * 0.35);
      // 侧枝粗细与主枝协调递减
      const sideWidth = Math.max(0.8, branch.width * (0.5 + Math.random() * 0.15));

      results.push({
        type: 'branch',
        x1: midX,
        y1: midY,
        angle: clampedSideAngle,
        length: sideLength,
        width: sideWidth,
        opacity: branch.opacity * 0.8,
        depth: branch.depth + 1
      });
    }

    return results;
  }

  // 处理动画队列
  function processQueue() {
    if (animationQueue.length === 0) {
      isAnimating = false;
      return;
    }

    isAnimating = true;
    const speed = parseInt(speedSlider.value);
    const itemsPerFrame = speed;

    for (let i = 0; i < itemsPerFrame && animationQueue.length > 0; i++) {
      const item = animationQueue.shift();

      if (item.type === 'ink') {
        drawInkDrop(item.x, item.y, item.radius, item.opacity);
      } else if (item.type === 'drawBranch') {
        drawBranch(item.x1, item.y1, item.x2, item.y2, item.width, item.opacity);
      } else if (item.type === 'flower') {
        drawFlower(item.x, item.y, item.size, item.opacity);
      } else if (item.type === 'branch') {
        const branchProb = parseInt(branchProbSlider.value) / 100;
        const branchLen = parseInt(branchLenSlider.value);
        const newItems = expandBranch(item, branchProb, branchLen);
        animationQueue.push(...newItems);
      }
    }

    animationId = requestAnimationFrame(processQueue);
  }

  // 开始生成
  function startGeneration(x, y) {
    // 如果有正在进行的动画，先停止
    if (animationId) {
      cancelAnimationFrame(animationId);
    }

    const newQueue = generateInkTree(x, y);
    animationQueue.push(...newQueue);

    if (!isAnimating) {
      processQueue();
    }
  }

  // 生成按钮
  generateBtn.addEventListener('click', () => {
    startGeneration(0, 0);
  });

  // 清空按钮
  clearBtn.addEventListener('click', () => {
    if (animationId) {
      cancelAnimationFrame(animationId);
    }
    animationQueue = [];
    isAnimating = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });

  // 画布点击（限制在底部区域）
  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    // 只有在画布底部区域点击才有效
    if (y > canvas.height - 100) {
      startGeneration(x, y);
    }
  });

  // 初始化背景
  ctx.fillStyle = '#faf8f5';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

})();
</script>
