<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>药看得懂 - AI药品说明书助手 Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#fff8f0;color:#333;line-height:1.8}

.container{max-width:480px;margin:0 auto;padding:0 16px}

.header{background:linear-gradient(135deg,#ff9a6c,#ffb38a);padding:32px 16px;text-align:center;color:#fff}
.header h1{font-size:32px;font-weight:700;margin-bottom:8px}
.header p{font-size:16px;opacity:.95}

.step{background:#fff;border-radius:24px;padding:24px;margin:20px 0;box-shadow:0 8px 32px rgba(255,122,69,.08);min-height:500px}
.step-title{font-size:20px;font-weight:600;color:#ff7a45;margin-bottom:20px;text-align:center}

.upload-area{border:4px dashed #ffb38a;border-radius:24px;padding:48px 24px;text-align:center;cursor:pointer;transition:all .3s}
.upload-area:hover,.upload-area.active{border-color:#ff7a45;background:#fff5f0}
.upload-area .icon{font-size:64px;margin-bottom:16px}
.upload-area .text{font-size:20px;color:#666;margin-bottom:8px}
.upload-area .hint{font-size:14px;color:#999}
.upload-area input{display:none}

.pill-select{display:flex;flex-wrap:wrap;gap:16px;margin-top:20px}
.pill-item{width:calc(50% - 8px);background:#f9f9f9;border-radius:16px;padding:16px;text-align:center;cursor:pointer;border:3px solid transparent;transition:all .3s}
.pill-item:hover{border-color:#ff9a6c}
.pill-item.active{border-color:#ff7a45;background:#fff5f0}
.pill-item .icon{font-size:40px;margin-bottom:8px}
.pill-item .name{font-size:16px;font-weight:600;color:#333}

.processing{text-align:center;padding:60px 24px}
.processing .spinner{width:64px;height:64px;border:6px solid #ffb38a;border-top-color:#ff7a45;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 24px}
@keyframes spin{to{transform:rotate(360deg)}}
.processing .text{font-size:20px;color:#666}
.processing .steps{margin-top:24px;font-size:16px;color:#999;text-align:left}
.processing .steps div{margin-bottom:8px;padding-left:24px;position:relative}
.processing .steps div::before{content:'▶';position:absolute;left:0;color:#ff7a45}
.processing .steps div.done::before{content:'✓';color:#52c41a}
.processing .steps div.done{color:#52c41a}

.result-screen{padding:16px}
.result-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding:16px;background:#fff;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.05)}
.result-header .title{font-size:22px;font-weight:700;color:#ff7a45}
.result-header .avatar{width:50px;height:50px;border-radius:50%;background:#ffb38a;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px}

.pill-card{background:linear-gradient(135deg,#ff9a6c,#ffb38a);border-radius:20px;padding:24px;color:#fff;margin-bottom:20px}
.pill-card .pill-name{font-size:26px;font-weight:700;margin-bottom:8px}
.pill-card .pill-desc{font-size:18px;opacity:.9}

.info-card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.info-card .info-title{font-size:20px;font-weight:600;color:#ff7a45;margin-bottom:12px;padding-left:12px;border-left:5px solid #ff7a45}
.info-card .info-text{font-size:24px;color:#333;line-height:1.6}
.info-card.warning{background:#fff5f0;border:2px solid #ff9a6c}

.btn-group{display:flex;gap:16px;margin-top:24px}
.btn{flex:1;height:64px;border:none;border-radius:16px;font-size:20px;font-weight:600;cursor:pointer;transition:all .3s}
.btn-primary{background:#ff7a45;color:#fff}
.btn-primary:hover{background:#ff9a6c}
.btn-primary:disabled{background:#ffccc0;cursor:not-allowed}
.btn-secondary{background:#f5f5f5;color:#666}
.btn-secondary:hover{background:#eee}

.speaking-indicator{display:none;text-align:center;padding:16px;background:#fff;border-radius:16px;margin-top:16px}
.speaking-indicator.show{display:block}
.speaking-indicator .wave{display:flex;justify-content:center;align-items:center;height:32px}
.speaking-indicator .wave span{width:6px;height:24px;background:#ff7a45;margin:0 3px;border-radius:3px;animation:wave .5s ease-in-out infinite}
.speaking-indicator .wave span:nth-child(2){animation-delay:.1s}
.speaking-indicator .wave span:nth-child(3){animation-delay:.2s}
.speaking-indicator .wave span:nth-child(4){animation-delay:.3s}
.speaking-indicator .wave span:nth-child(5){animation-delay:.4s}
@keyframes wave{0%,100%{height:8px}50%{height:24px}}

.footer{text-align:center;padding:32px;color:#999;font-size:14px}

.hidden{display:none}
</style>
</head>
<body>

<div class="header">
    <h1>药看得懂</h1>
    <p>帮老人读懂药品说明的 AI 助手</p>
</div>

<div class="container">
    <div id="step1" class="step">
        <div class="step-title">📷 第一步：拍摄药品说明书</div>
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <div class="icon">📱</div>
            <div class="text">点击拍照或选择图片</div>
            <div class="hint">支持拍照或从相册选择</div>
            <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect()">
        </div>
        <div class="step-title">或者选择示例药品体验</div>
        <div class="pill-select">
            <div class="pill-item" onclick="selectPill('nifedipine')">
                <div class="icon">💊</div>
                <div class="name">硝苯地平缓释片</div>
            </div>
            <div class="pill-item" onclick="selectPill('aspirin')">
                <div class="icon">🩹</div>
                <div class="name">阿司匹林肠溶片</div>
            </div>
            <div class="pill-item" onclick="selectPill('metformin')">
                <div class="icon">🩺</div>
                <div class="name">盐酸二甲双胍片</div>
            </div>
            <div class="pill-item" onclick="selectPill('amlodipine')">
                <div class="icon">🟢</div>
                <div class="name">氨氯地平片</div>
            </div>
        </div>
    </div>

    <div id="step2" class="step hidden">
        <div class="step-title">🔍 AI正在识别中...</div>
        <div class="processing">
            <div class="spinner"></div>
            <div class="text">正在分析药品说明书</div>
            <div class="steps">
                <div id="step2-1">📷 识别图片内容...</div>
                <div id="step2-2">📝 OCR文字提取...</div>
                <div id="step2-3">🧠 AI智能分析...</div>
                <div id="step2-4">✨ 整理关键信息...</div>
            </div>
        </div>
    </div>

    <div id="step3" class="step hidden">
        <div class="result-screen">
            <div class="result-header">
                <span class="title">药看得懂</span>
                <div class="avatar">👴</div>
            </div>
            
            <div class="pill-card">
                <div id="result-name" class="pill-name">药品名称</div>
                <div id="result-desc" class="pill-desc">药品用途</div>
            </div>

            <div class="info-card">
                <div class="info-title">💊 用法用量</div>
                <div id="result-dose" class="info-text"></div>
            </div>

            <div class="info-card">
                <div class="info-title">⏰ 服用时间</div>
                <div id="result-time" class="info-text"></div>
            </div>

            <div class="info-card warning">
                <div class="info-title">⚠️ 禁忌事项</div>
                <div id="result-warning" class="info-text"></div>
            </div>

            <div class="info-card">
                <div class="info-title">🤒 不良反应</div>
                <div id="result-side" class="info-text"></div>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" onclick="playAudio()" id="audioBtn">🔊 听语音播报</button>
                <button class="btn btn-secondary" onclick="reset()">🔄 重新识别</button>
            </div>

            <div id="speaking" class="speaking-indicator">
                <div class="wave">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
                <div style="margin-top:8px;color:#ff7a45;font-size:16px">正在播报中...</div>
            </div>
        </div>
    </div>
</div>

<div class="footer">
    药看得懂 · 让每一位老人都能安心用药
</div>

<script>
const pillData = {
    nifedipine: {
        name: '硝苯地平缓释片',
        desc: '治疗高血压、心绞痛',
        dose: '每日一次，每次1片',
        time: '早餐后服用',
        warning: '不要掰开或咀嚼药片',
        side: '可能出现头痛、面部潮红、下肢水肿'
    },
    aspirin: {
        name: '阿司匹林肠溶片',
        desc: '预防心肌梗死、脑梗死',
        dose: '每日一次，每次100毫克',
        time: '饭前30分钟服用',
        warning: '有胃溃疡病史者慎用',
        side: '可能出现胃肠道不适、出血倾向'
    },
    metformin: {
        name: '盐酸二甲双胍片',
        desc: '治疗2型糖尿病',
        dose: '每日三次，每次1-2片',
        time: '三餐后服用',
        warning: '肾功能不全者禁用',
        side: '可能出现腹泻、恶心、腹胀'
    },
    amlodipine: {
        name: '氨氯地平片',
        desc: '治疗高血压、冠心病',
        dose: '每日一次，每次5毫克',
        time: '固定时间服用即可',
        warning: '低血压患者慎用',
        side: '可能出现头晕、水肿、心悸'
    }
};

let currentPill = null;
let speechSynth = window.speechSynthesis;

function handleFileSelect() {
    document.getElementById('step1').classList.add('hidden');
    document.getElementById('step2').classList.remove('hidden');
    processRecognition('nifedipine');
}

function selectPill(id) {
    document.querySelectorAll('.pill-item').forEach(item => item.classList.remove('active'));
    event.currentTarget.classList.add('active');
    currentPill = id;
    
    document.getElementById('step1').classList.add('hidden');
    document.getElementById('step2').classList.remove('hidden');
    
    processRecognition(id);
}

function processRecognition(id) {
    currentPill = id;
    const steps = ['step2-1', 'step2-2', 'step2-3', 'step2-4'];
    let stepIndex = 0;
    
    const timer = setInterval(() => {
        document.getElementById(steps[stepIndex]).classList.add('done');
        stepIndex++;
        if (stepIndex >= steps.length) {
            clearInterval(timer);
            setTimeout(showResult, 500);
        }
    }, 600);
}

function showResult() {
    const data = pillData[currentPill];
    document.getElementById('result-name').textContent = data.name;
    document.getElementById('result-desc').textContent = data.desc;
    document.getElementById('result-dose').textContent = data.dose;
    document.getElementById('result-time').textContent = data.time;
    document.getElementById('result-warning').textContent = data.warning;
    document.getElementById('result-side').textContent = data.side;
    
    document.getElementById('step2').classList.add('hidden');
    document.getElementById('step3').classList.remove('hidden');
}

function playAudio() {
    if (speechSynth.speaking) {
        speechSynth.cancel();
        document.getElementById('speaking').classList.remove('show');
        document.getElementById('audioBtn').textContent = '🔊 听语音播报';
        return;
    }
    
    const data = pillData[currentPill];
    const text = `这是${data.name}，用于${data.desc}。${data.dose}，${data.time}。注意：${data.warning}。可能出现的不良反应：${data.side}。`;
    
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-CN';
    utterance.rate = 0.8;
    utterance.pitch = 1;
    
    utterance.onstart = () => {
        document.getElementById('speaking').classList.add('show');
        document.getElementById('audioBtn').textContent = '⏹ 停止播报';
    };
    
    utterance.onend = () => {
        document.getElementById('speaking').classList.remove('show');
        document.getElementById('audioBtn').textContent = '🔊 听语音播报';
    };
    
    speechSynth.speak(utterance);
}

function reset() {
    if (speechSynth.speaking) {
        speechSynth.cancel();
    }
    document.getElementById('speaking').classList.remove('show');
    document.getElementById('audioBtn').textContent = '🔊 听语音播报';
    document.querySelectorAll('.pill-item').forEach(item => item.classList.remove('active'));
    document.getElementById('step2-1').classList.remove('done');
    document.getElementById('step2-2').classList.remove('done');
    document.getElementById('step2-3').classList.remove('done');
    document.getElementById('step2-4').classList.remove('done');
    document.getElementById('step3').classList.add('hidden');
    document.getElementById('step1').classList.remove('hidden');
}
</script>
</body>
</html>
