<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学霸养成记 - 每日学习</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#8B4513',
                        secondary: '#D2691E',
                        accent: '#CD853F',
                        gold: '#FFD700',
                        bronze: '#CD7F32',
                        dark: '#2C1810',
                        light: '#FFF8DC',
                    },
                    fontFamily: {
                        sans: ['Microsoft YaHei', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-up': 'slideUp 0.5s ease-out',
                        'bounce-in': 'bounceIn 0.6s ease-out',
                        'pulse-gold': 'pulseGold 2s infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        bounceIn: {
                            '0%': { opacity: '0', transform: 'scale(0.3)' },
                            '50%': { opacity: '1', transform: 'scale(1.05)' },
                            '70%': { transform: 'scale(0.9)' },
                            '100%': { transform: 'scale(1)' },
                        },
                        pulseGold: {
                            '0%, 100%': { boxShadow: '0 0 5px rgba(255, 215, 0, 0.5)' },
                            '50%': { boxShadow: '0 0 20px rgba(255, 215, 0, 0.8)' },
                        },
                    },
                },
            },
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #FFF8DC 0%, #F5DEB3 50%, #DEB887 100%);
            min-height: 100vh;
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(139, 69, 19, 0.2);
        }
        .btn-gradient {
            background: linear-gradient(135deg, #8B4513 0%, #D2691E 100%);
        }
        .btn-gradient:hover {
            background: linear-gradient(135deg, #D2691E 0%, #CD853F 100%);
        }
        .badge-gold {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
        }
        .badge-bronze {
            background: linear-gradient(135deg, #CD7F32 0%, #B87333 100%);
        }
        .progress-bar {
            background: linear-gradient(90deg, #8B4513 0%, #D2691E 100%);
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .modal-overlay {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="text-dark">
    <header class="bg-dark/90 text-light sticky top-0 z-50 shadow-lg">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-gold to-bronze flex items-center justify-center">
                    <i class="fa fa-graduation-cap text-dark text-xl"></i>
                </div>
                <h1 class="text-xl font-bold">学霸养成记</h1>
            </div>
            <div class="flex items-center space-x-4">
                <div class="flex items-center space-x-2 bg-primary/20 px-3 py-1 rounded-full">
                    <i class="fa fa-trophy text-gold"></i>
                    <span class="font-bold" id="user-points">0</span>
                </div>
                <div class="flex items-center space-x-2 bg-primary/20 px-3 py-1 rounded-full">
                    <i class="fa fa-medal text-bronze"></i>
                    <span class="font-bold" id="user-title">初学者</span>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6">
        <section class="mb-8">
            <div class="bg-white/80 backdrop-blur rounded-2xl p-6 shadow-lg animate-fade-in">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-2xl font-bold text-primary flex items-center">
                        <i class="fa fa-calendar mr-3 text-secondary"></i>
                        今日学习
                    </h2>
                    <span class="text-sm text-gray-500" id="current-date"></span>
                </div>
                
                <div class="grid grid-cols-3 md:grid-cols-9 gap-4">
                    <button onclick="selectSubject('chinese')" class="subject-card card-hover bg-gradient-to-br from-red-50 to-red-100 rounded-xl p-4 text-center border-2 border-transparent hover:border-red-400" id="card-chinese">
                        <i class="fa fa-book text-3xl text-red-600 mb-2"></i>
                        <span class="block font-bold text-red-800">语文</span>
                        <span class="text-xs text-gray-500 mt-1">每日知识</span>
                    </button>
                    <button onclick="selectSubject('math')" class="subject-card card-hover bg-gradient-to-br from-blue-50 to-blue-100 rounded-xl p-4 text-center border-2 border-transparent hover:border-blue-400" id="card-math">
                        <i class="fa fa-calculator text-3xl text-blue-600 mb-2"></i>
                        <span class="block font-bold text-blue-800">数学</span>
                        <span class="text-xs text-gray-500 mt-1">每日知识</span>
                    </button>
                    <button onclick="selectSubject('english')" class="subject-card card-hover bg-gradient-to-br from-green-50 to-green-100 rounded-xl p-4 text-center border-2 border-transparent hover:border-green-400" id="card-english">
                        <i class="fa fa-globe text-3xl text-green-600 mb-2"></i>
                        <span class="block font-bold text-green-800">英语</span>
                        <span class="text-xs text-gray-500 mt-1">每日知识</span>
                    </button>
                    <button onclick="selectSubject('physics')" class="subject-card card-hover bg-gradient-to-br from-purple-50 to-purple-100 rounded-xl p-4 text-center border-2 border-transparent hover:border-purple-400" id="card-physics">
                        <i class="fa fa-atom text-3xl text-purple-600 mb-2"></i>
                        <span class="block font-bold text-purple-800">物理</span>
                        <span class="text-xs text-gray-500 mt-1">每日知识</span>
                    </button>
                    <button onclick="selectSubject('chemistry')" class="subject-card card-hover bg-gradient-to-br from-orange-50 to-orange-100 rounded-xl p-4 text-center border-2 border-transparent hover:border-orange-400" id="card-chemistry">
                        <i class="fa fa-flask text-3xl text-orange-600 mb-2"></i>
                        <span class="block font-bold text-orange-800">化学</span>
                        <span class="text-xs text-gray-500 mt-1">每日知识</span>
                    </button>
                    <button onclick="selectSubject('biology')" class="subject-card card-hover bg-gradient-to-br from-teal-50 to-teal-100 rounded-xl p-4 text-center border-2 border-transparent hover:border-teal-400" id="card-biology">
                        <i class="fa fa-leaf text-3xl text-teal-600 mb-2"></i>
                        <span class="block font-bold text-teal-800">生物</span>
                        <span class="text-xs text-gray-500 mt-1">每日知识</span>
                    </button>
                    <button onclick="selectSubject('history')" class="subject-card card-hover bg-gradient-to-br from-amber-50 to-amber-100 rounded-xl p-4 text-center border-2 border-transparent hover:border-amber-400" id="card-history">
                        <i class="fa fa-clock-o text-3xl text-amber-600 mb-2"></i>
                        <span class="block font-bold text-amber-800">历史</span>
                        <span class="text-xs text-gray-500 mt-1">每日知识</span>
                    </button>
                    <button onclick="selectSubject('politics')" class="subject-card card-hover bg-gradient-to-br from-pink-50 to-pink-100 rounded-xl p-4 text-center border-2 border-transparent hover:border-pink-400" id="card-politics">
                        <i class="fa fa-balance-scale text-3xl text-pink-600 mb-2"></i>
                        <span class="block font-bold text-pink-800">政治</span>
                        <span class="text-xs text-gray-500 mt-1">每日知识</span>
                    </button>
                    <button onclick="selectSubject('geography')" class="subject-card card-hover bg-gradient-to-br from-cyan-50 to-cyan-100 rounded-xl p-4 text-center border-2 border-transparent hover:border-cyan-400" id="card-geography">
                        <i class="fa fa-globe text-3xl text-cyan-600 mb-2"></i>
                        <span class="block font-bold text-cyan-800">地理</span>
                        <span class="text-xs text-gray-500 mt-1">每日知识</span>
                    </button>
                </div>
            </div>
        </section>

        <section id="daily-content" class="hidden">
            <div class="bg-white/90 backdrop-blur rounded-2xl p-6 shadow-lg animate-slide-up">
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center space-x-3">
                        <div id="subject-icon" class="w-12 h-12 rounded-xl flex items-center justify-center text-2xl"></div>
                        <div>
                            <h3 class="text-xl font-bold" id="subject-title">学科名称</h3>
                            <p class="text-sm text-gray-500">今日知识点</p>
                        </div>
                    </div>
                    <button onclick="markLearned()" id="learn-btn" class="btn-gradient text-white px-6 py-2 rounded-full font-bold flex items-center space-x-2 hover:shadow-lg transition-all">
                        <i class="fa fa-check-circle"></i>
                        <span>标记已学习</span>
                    </button>
                </div>
                
                <div class="bg-light/50 rounded-xl p-6 mb-6">
                    <h4 class="text-lg font-bold text-primary mb-3 flex items-center">
                        <i class="fa fa-lightbulb-o mr-2 text-yellow-500"></i>
                        今日知识
                    </h4>
                    <p class="text-lg leading-relaxed" id="daily-knowledge">知识点内容...</p>
                </div>

                <button onclick="showMoreKnowledge()" class="w-full btn-gradient text-white py-3 rounded-xl font-bold flex items-center justify-center space-x-2 hover:shadow-lg transition-all">
                    <i class="fa fa-book-open"></i>
                    <span>学习更多知识</span>
                </button>
            </div>
        </section>

        <section class="mt-8">
            <div class="bg-white/80 backdrop-blur rounded-2xl p-6 shadow-lg">
                <h2 class="text-xl font-bold text-primary mb-4 flex items-center">
                    <i class="fa fa-star mr-3 text-gold"></i>
                    学习进度
                </h2>
                <div class="grid grid-cols-3 gap-4">
                    <div class="text-center">
                        <div class="text-3xl font-bold text-primary" id="learn-count">0</div>
                        <div class="text-sm text-gray-500">已学知识</div>
                    </div>
                    <div class="text-center">
                        <div class="text-3xl font-bold text-secondary" id="streak-days">0</div>
                        <div class="text-sm text-gray-500">连续学习</div>
                    </div>
                    <div class="text-center">
                        <div class="text-3xl font-bold text-accent" id="total-days">0</div>
                        <div class="text-sm text-gray-500">累计天数</div>
                    </div>
                </div>
                <div class="mt-6">
                    <div class="flex justify-between text-sm mb-2">
                        <span>下一称号进度</span>
                        <span id="progress-text">0%</span>
                    </div>
                    <div class="h-3 bg-gray-200 rounded-full overflow-hidden">
                        <div id="progress-bar" class="progress-bar h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                    <p class="text-xs text-gray-500 mt-2 text-center" id="next-title">下一称号：初学者</p>
                </div>
            </div>
        </section>

        <section class="mt-8">
            <div class="bg-white/80 backdrop-blur rounded-2xl p-6 shadow-lg">
                <h2 class="text-xl font-bold text-primary mb-4 flex items-center">
                    <i class="fa fa-trophy mr-3 text-bronze"></i>
                    称号系统
                </h2>
                <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
                    <div class="title-card text-center p-4 rounded-xl bg-gray-50 border-2 border-gray-200" data-title="初学者">
                        <div class="w-12 h-12 mx-auto mb-2 rounded-full bg-gray-200 flex items-center justify-center">
                            <i class="fa fa-user text-gray-500 text-xl"></i>
                        </div>
                        <div class="font-bold text-gray-700">初学者</div>
                        <div class="text-xs text-gray-500 mt-1">0分</div>
                    </div>
                    <div class="title-card text-center p-4 rounded-xl bg-gray-50 border-2 border-gray-200" data-title="勤奋者">
                        <div class="w-12 h-12 mx-auto mb-2 rounded-full bg-bronze flex items-center justify-center">
                            <i class="fa fa-bolt text-white text-xl"></i>
                        </div>
                        <div class="font-bold text-gray-700">勤奋者</div>
                        <div class="text-xs text-gray-500 mt-1">100分</div>
                    </div>
                    <div class="title-card text-center p-4 rounded-xl bg-gray-50 border-2 border-gray-200" data-title="学霸">
                        <div class="w-12 h-12 mx-auto mb-2 rounded-full badge-gold flex items-center justify-center">
                            <i class="fa fa-graduation-cap text-dark text-xl"></i>
                        </div>
                        <div class="font-bold text-gray-700">学霸</div>
                        <div class="text-xs text-gray-500 mt-1">500分</div>
                    </div>
                    <div class="title-card text-center p-4 rounded-xl bg-gray-50 border-2 border-gray-200" data-title="学神">
                        <div class="w-12 h-12 mx-auto mb-2 rounded-full bg-gradient-to-br from-gold to-yellow-400 flex items-center justify-center">
                            <i class="fa fa-star text-dark text-xl"></i>
                        </div>
                        <div class="font-bold text-gray-700">学神</div>
                        <div class="text-xs text-gray-500 mt-1">1000分</div>
                    </div>
                    <div class="title-card text-center p-4 rounded-xl bg-gray-50 border-2 border-gray-200" data-title="宗师">
                        <div class="w-12 h-12 mx-auto mb-2 rounded-full bg-gradient-to-br from-purple-500 to-purple-700 flex items-center justify-center">
                            <i class="fa fa-crown text-white text-xl"></i>
                        </div>
                        <div class="font-bold text-gray-700">宗师</div>
                        <div class="text-xs text-gray-500 mt-1">5000分</div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="more-modal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-2xl max-h-[80vh] overflow-hidden shadow-2xl animate-bounce-in">
            <div class="bg-dark text-light p-4 flex items-center justify-between">
                <h3 class="text-xl font-bold flex items-center">
                    <i class="fa fa-book-open mr-2"></i>
                    <span id="modal-title">更多知识</span>
                </h3>
                <button onclick="closeModal()" class="text-gray-300 hover:text-white">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto max-h-[60vh]" id="modal-content">
                知识内容...
            </div>
            <div class="p-4 border-t bg-gray-50 flex justify-end">
                <button onclick="closeModal()" class="btn-gradient text-white px-6 py-2 rounded-full font-bold">
                    关闭
                </button>
            </div>
        </div>
    </div>

    <div id="reward-modal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md text-center shadow-2xl animate-bounce-in p-8">
            <div class="w-24 h-24 mx-auto mb-4 rounded-full badge-gold animate-pulse-gold flex items-center justify-center">
                <i class="fa fa-trophy text-dark text-4xl"></i>
            </div>
            <h3 class="text-2xl font-bold text-primary mb-2">学习完成!</h3>
            <p class="text-gray-600 mb-4">恭喜你完成今日学习</p>
            <div class="bg-light rounded-xl p-4 mb-6">
                <div class="text-4xl font-bold text-gold mb-1">+10</div>
                <div class="text-sm text-gray-500">获得积分</div>
            </div>
            <button onclick="closeRewardModal()" class="btn-gradient text-white px-8 py-3 rounded-full font-bold w-full">
                继续学习
            </button>
        </div>
    </div>

    <footer class="bg-dark/80 text-light py-6 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p class="text-gray-400">学霸养成记 - 每日学习，成就更好的自己</p>
        </div>
    </footer>

    <script>
        const subjects = {
            chinese: { name: '语文', icon: 'fa-book', color: 'text-red-600', bg: 'bg-red-50', border: 'border-red-400' },
            math: { name: '数学', icon: 'fa-calculator', color: 'text-blue-600', bg: 'bg-blue-50', border: 'border-blue-400' },
            english: { name: '英语', icon: 'fa-globe', color: 'text-green-600', bg: 'bg-green-50', border: 'border-green-400' },
            physics: { name: '物理', icon: 'fa-atom', color: 'text-purple-600', bg: 'bg-purple-50', border: 'border-purple-400' },

        };

        const knowledgeData = {
            chinese: {

                ]
            },

                more: [
                    { title: '现在进行时', content: '构成：am/is/are + doing，表示正在进行的动作。' },

            },
            biology: {
                daily: '细胞是生物体结构和功能的基本单位。动物细胞和植物细胞都有细胞膜、细胞质和细胞核。',
                more: [
                    { title: '光合作用', content: '6CO₂ + 6H₂O + 光能 → C₆H₁₂O₆ + 6O₂，主要在叶绿体中进行。' },
                    { title: '呼吸作用', content: 'C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + 能量，主要在线粒体中进行。' },
                    { title: 'DNA结构', content: 'DNA是双螺旋结构，由四种碱基组成：A、T、C、G。A与T配对，C与G配对。' },
                    { title: '遗传定律', content: '孟德尔两大定律：分离定律和自由组合定律。' },
                    { title: '生态系统', content: '生态系统由生物群落和非生物环境组成，包括生产者、消费者和分解者。' }
                ]
            },
            history: {
                daily: '秦始皇统一六国后，建立了中国历史上第一个统一的多民族封建国家，实行郡县制，统一文字、度量衡和货币。',
                more: [
                    { title: '唐朝盛世', content: '唐朝是中国历史上最强盛的朝代之一，出现了贞观之治和开元盛世。' },
                    { title: '丝绸之路', content: '丝绸之路连接中国与中亚、西亚和欧洲，促进了东西方文化交流。' },
                    { title: '四大发明', content: '造纸术、印刷术、火药、指南针是中国古代四大发明。' },
                    { title: '鸦片战争', content: '1840年鸦片战争标志着中国近代史的开端，中国开始沦为半殖民地半封建社会。' },
                    { title: '辛亥革命', content: '1911年辛亥革命推翻了清王朝统治，结束了中国两千多年的封建帝制。' }
                ]
            },
            politics: {
                daily: '宪法是国家的根本大法，具有最高的法律效力。我国现行宪法是1982年宪法，经过多次修正。',
                more: [
                    { title: '人民代表大会', content: '全国人民代表大会是我国最高国家权力机关，行使立法权、决定权、任免权和监督权。' },
                    { title: '公民权利', content: '我国公民的基本权利：选举权与被选举权、言论自由、宗教信仰自由等。' },
                    { title: '政府职能', content: '政府的主要职能：政治职能、经济职能、文化职能、社会职能。' },
                    { title: '依法治国', content: '依法治国是党领导人民治理国家的基本方略，坚持有法可依、有法必依、执法必严、违法必究。' },
                    { title: '国际关系', content: '和平共处五项原则：互相尊重主权和领土完整、互不侵犯、互不干涉内政、平等互利、和平共处。' }
                ]
            },
            geography: {
                daily: '地球分为七大洲和四大洋。七大洲：亚洲、欧洲、非洲、北美洲、南美洲、大洋洲、南极洲。四大洋：太平洋、大西洋、印度洋、北冰洋。',
                more: [
                    { title: '气候类型', content: '主要气候类型：热带雨林气候、热带草原气候、热带沙漠气候、地中海气候、温带季风气候等。' },
                    { title: '板块构造', content: '地球岩石圈分为六大板块：亚欧板块、非洲板块、美洲板块、太平洋板块、印度洋板块、南极洲板块。' },
                    { title: '洋流分布', content: '世界主要洋流：墨西哥湾暖流、北大西洋暖流、秘鲁寒流、日本暖流等。' },
                    { title: '中国地形', content: '中国地形特点：西高东低，呈三级阶梯分布。第一阶梯：青藏高原；第二阶梯：内蒙古高原、黄土高原、云贵高原等；第三阶梯：东北平原、华北平原、长江中下游平原。' },
                    { title: '时区计算', content: '全球分为24个时区，每个时区相差1小时。北京时间是东八区时间。' }
                ]
            }
        };

        const titles = [
            { name: '初学者', points: 0 },
            { name: '勤奋者', points: 100 },
            { name: '学霸', points: 500 },
            { name: '学神', points: 1000 },
            { name: '宗师', points: 5000 }
        ];

        let currentSubject = '';
        let userData = {
            points: 0,
            title: '初学者',
            learnedToday: [],
            totalLearned: 0,
            streakDays: 0,
            totalDays: 0,
            lastDate: ''
        };

        function loadUserData() {
            const saved = localStorage.getItem('studyAppData');
            if (saved) {
                userData = JSON.parse(saved);
            }
            const today = new Date().toDateString();
            if (userData.lastDate !== today) {
                userData.learnedToday = [];
                if (userData.lastDate) {
                    const last = new Date(userData.lastDate);
                    const now = new Date(today);
                    const diffDays = Math.floor((now - last) / (1000 * 60 * 60 * 24));
                    if (diffDays === 1) {
                        userData.streakDays++;
                    } else {
                        userData.streakDays = 1;
                    }
                    userData.totalDays++;
                } else {
                    userData.streakDays = 1;
                    userData.totalDays = 1;
                }
                userData.lastDate = today;
                saveUserData();
            }
            updateUI();
        }

        function saveUserData() {
            localStorage.setItem('studyAppData', JSON.stringify(userData));
        }

        function updateUI() {
            document.getElementById('user-points').textContent = userData.points;
            document.getElementById('user-title').textContent = userData.title;
            document.getElementById('learn-count').textContent = userData.totalLearned;
            document.getElementById('streak-days').textContent = userData.streakDays;
            document.getElementById('total-days').textContent = userData.totalDays;
            
            const currentIndex = titles.findIndex(t => t.name === userData.title);
            const nextTitle = titles[currentIndex + 1];
            if (nextTitle) {
                const currentPoints = userData.points;
                const prevPoints = titles[currentIndex].points;
                const progress = Math.min(100, ((currentPoints - prevPoints) / (nextTitle.points - prevPoints)) * 100);
                document.getElementById('progress-bar').style.width = progress + '%';
                document.getElementById('progress-text').textContent = Math.round(progress) + '%';
                document.getElementById('next-title').textContent = '下一称号：' + nextTitle.name;
            } else {
                document.getElementById('progress-bar').style.width = '100%';
                document.getElementById('progress-text').textContent = '100%';
                document.getElementById('next-title').textContent = '已达到最高称号';
            }

            document.querySelectorAll('.title-card').forEach(card => {
                const titleName = card.dataset.title;
                const index = titles.findIndex(t => t.name === titleName);
                const userTitleIndex = titles.findIndex(t => t.name === userData.title);
                if (index <= userTitleIndex) {
                    card.classList.add('border-primary', 'bg-primary/5');
                    card.classList.remove('border-gray-200', 'bg-gray-50');
                } else {
                    card.classList.remove('border-primary', 'bg-primary/5');
                    card.classList.add('border-gray-200', 'bg-gray-50');
                }
            });

            document.querySelectorAll('.subject-card').forEach(card => {
                const subjectKey = card.id.replace('card-', '');
                if (userData.learnedToday.includes(subjectKey)) {
                    card.classList.add('opacity-50', 'cursor-not-allowed');
                } else {
                    card.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            });
        }

        function updateTitle() {
            for (let i = titles.length - 1; i >= 0; i--) {
                if (userData.points >= titles[i].points) {
                    if (userData.title !== titles[i].name) {
                        userData.title = titles[i].name;
                    }
                    break;
                }
            }
        }

        function selectSubject(subject) {
            if (userData.learnedToday.includes(subject)) {
                alert('今日已学习该学科，明天再来吧！');
                return;
            }
            currentSubject = subject;
            const data = subjects[subject];
            
            document.getElementById('subject-icon').className = `w-12 h-12 rounded-xl flex items-center justify-center text-2xl ${data.bg} ${data.color}`;
            document.getElementById('subject-icon').innerHTML = `<i class="fa ${data.icon}"></i>`;
            document.getElementById('subject-title').textContent = data.name;
            document.getElementById('daily-knowledge').textContent = knowledgeData[subject].daily;
            
            document.getElementById('daily-content').classList.remove('hidden');
            document.getElementById('learn-btn').disabled = false;
            document.getElementById('learn-btn').innerHTML = '<i class="fa fa-check-circle"></i><span>标记已学习</span>';
            
            window.scrollTo({ top: document.getElementById('daily-content').offsetTop - 20, behavior: 'smooth' });
        }

        function markLearned() {
            if (!currentSubject) return;
            
            userData.points += 10;
            userData.totalLearned++;
            userData.learnedToday.push(currentSubject);
            updateTitle();
            saveUserData();
            updateUI();
            
            document.getElementById('learn-btn').disabled = true;
            document.getElementById('learn-btn').innerHTML = '<i class="fa fa-check-circle"></i><span>已学习</span>';
            
            document.getElementById('reward-modal').classList.remove('hidden');
        }

        function closeRewardModal() {
            document.getElementById('reward-modal').classList.add('hidden');
        }

        function showMoreKnowledge() {
            if (!currentSubject) return;
            
            const data = knowledgeData[currentSubject].more;
            const subjectName = subjects[currentSubject].name;
            
            document.getElementById('modal-title').textContent = subjectName + ' - 更多知识';
            
            let content = '';
            data.forEach((item, index) => {
                content += `
                    <div class="mb-4 p-4 rounded-xl bg-light/50 animate-fade-in" style="animation-delay: ${index * 0.1}s">
                        <h4 class="font-bold text-primary mb-2 flex items-center">
                            <span class="w-6 h-6 rounded-full bg-primary text-white text-sm flex items-center justify-center mr-2">${index + 1}</span>
                            ${item.title}
                        </h4>
                        <p class="text-gray-700">${item.content}</p>
                    </div>
                `;
            });
            content += `
                <div class="p-4 rounded-xl bg-gradient-to-r from-primary/10 to-secondary/10">
                    <p class="text-sm text-gray-600 text-center">继续努力学习，每天进步一点点！</p>
                </div>
            `;
            
            document.getElementById('modal-content').innerHTML = content;
            document.getElementById('more-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('more-modal').classList.add('hidden');
        }

        function setDate() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('current-date').textContent = now.toLocaleDateString('zh-CN', options);
        }

        document.addEventListener('DOMContentLoaded', () => {
            setDate();
            loadUserData();
        });
    </script>
</body>
</html>
