<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>手艺三句话</title>
  <style>
    :root {
      --bg-primary: #fdf8f3;
      --bg-card: #fff;
      --text-primary: #333;
      --text-secondary: #666;
      --accent: #c9a87a;
      --accent-dark: #b89e80;
      --border: #e8d5b5;
      --shadow: rgba(0,0,0,0.04);
    }
    .dark-mode {
      --bg-primary: #2e251f;
      --bg-card: #3a2f27;
      --text-primary: #f5f0e6;
      --text-secondary: #c9a87a;
      --accent: #b89e80;
      --accent-dark: #c9a87a;
      --border: #5a4a3d;
      --shadow: rgba(0,0,0,0.2);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
      color: var(--text-primary);
      background-color: var(--bg-primary);
      transition: background-color 0.3s, color 0.3s;
      padding: 16px;
      min-height: 100vh;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 32px;
      padding-top: 16px;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-primary);
    }
    .subtitle {
      font-size: 1rem;
      color: var(--text-secondary);
      max-width: 600px;
      margin: 0 auto;
    }
    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px var(--shadow);
      z-index: 100;
      transition: all 0.3s;
    }
    .theme-toggle:hover {
      transform: scale(1.05);
      background: var(--accent-dark);
    }
    .input-section {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 12px var(--shadow);
      margin-bottom: 32px;
      border: 1px solid var(--border);
    }
    .input-label {
      display: block;
      margin-bottom: 12px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .input-group {
      display: flex;
      gap: 12px;
      width: 100%;
    }
    input[type="text"] {
      flex: 1;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: all 0.2s;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(201, 168, 122, 0.2);
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    button:hover:not(:disabled) {
      background: var(--accent-dark);
      transform: translateY(-1px);
    }
    button:active:not(:disabled) {
      transform: translateY(0);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .result-section {
      margin-bottom: 32px;
    }
    .result-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .result-title svg {
      width: 20px;
      height: 20px;
      fill: var(--accent);
    }
    .sentence-cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-top: 16px;
    }
    @media (min-width: 768px) {
      .sentence-cards {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    .sentence-card {
      background: var(--bg-card);
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 3px 8px var(--shadow);
      border: 1px solid var(--border);
      transition: transform 0.2s;
    }
    .sentence-card:hover {
      transform: translateY(-2px);
    }
    .sentence-card:nth-child(1) {
      border-top: 4px solid #6a8c5f;
    }
    .sentence-card:nth-child(2) {
      border-top: 4px solid #d9a76a;
    }
    .sentence-card:nth-child(3) {
      border-top: 4px solid #c97a5d;
    }
    .sentence-number {
      font-size: 0.9rem;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 8px;
      display: inline-block;
    }
    .sentence-text {
      font-size: 1.1rem;
      line-height: 1.5;
      color: var(--text-primary);
    }
    .copy-section {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 12px var(--shadow);
      border: 1px solid var(--border);
    }
    .copy-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text-primary);
    }
    .copy-preview {
      background: #f9f7f4;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      font-family: "Courier New", monospace;
      font-size: 0.95rem;
      line-height: 1.5;
      white-space: pre-wrap;
      color: #4a3d2f;
      border: 1px solid #e8d5b5;
    }
    .copy-btn {
      width: 100%;
      padding: 14px;
      font-size: 1.05rem;
    }
    .status {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #8a7a5a;
      text-align: center;
      min-height: 24px;
    }
    footer {
      text-align: center;
      margin-top: 40px;
      padding: 20px;
      color: var(--text-secondary);
      font-size: 0.9rem;
      border-top: 1px solid var(--border);
      margin-top: 40px;
    }
    @media (max-width: 600px) {
      .input-group {
        flex-direction: column;
      }
      h1 {
        font-size: 1.6rem;
      }
      .subtitle {
        font-size: 0.95rem;
      }
      .input-section,
      .copy-section {
        padding: 20px 16px;
      }
      .sentence-card {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="切换深色模式">☀️</button>

  <div class="container">
    <header>
      <h1>手艺三句话</h1>
      <p class="subtitle">输入手艺名称，3秒生成街坊一听就懂的大白话介绍</p>
    </header>

    <section class="input-section">
      <label class="input-label" for="craftInput">请输入手艺名称（如：无锡惠山泥人、凤阳花鼓、蓝印花布）</label>
      <div class="input-group">
        <input type="text" id="craftInput" placeholder="例：剪纸、竹编、泥塑…" autocomplete="off" />
        <button id="generateBtn">生成</button>
      </div>
      <div class="status" id="status"></div>
    </section>

    <section class="result-section">
      <h2 class="result-title">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        这就是你要的三句话
      </h2>
      <div class="sentence-cards" id="sentences">
        <div class="sentence-card">
          <div class="sentence-number">① 生活类比</div>
          <div class="sentence-text" id="sentence1">——像捏橡皮泥一样，但用的是太湖边挖的粗泥和细泥，得阴干不能晒。</div>
        </div>
        <div class="sentence-card">
          <div class="sentence-number">② 动作关键词</div>
          <div class="sentence-text" id="sentence2">——先打坯、再上色、最后阴干，三步缺一不可，急不得。</div>
        </div>
        <div class="sentence-card">
          <div class="sentence-number">③ 冷知识彩蛋</div>
          <div class="sentence-text" id="sentence3">——老艺人手上那层茧，是几十年揉泥留下的“泥指纹”，比指纹还准。</div>
        </div>
      </div>
    </section>

    <section class="copy-section">
      <h3 class="copy-title">一键复制朋友圈文案</h3>
      <div class="copy-preview" id="copyPreview">
① 像捏橡皮泥一样，但用的是太湖边挖的粗泥和细泥，得阴干不能晒。  
② 先打坯、再上色、最后阴干，三步缺一不可，急不得。  
③ 老艺人手上那层茧，是几十年揉泥留下的“泥指纹”，比指纹还准。</div>
      <button class="copy-btn" id="copyBtn">📋 复制全部文案</button>
    </section>

    <footer>
      <p>无需联网 · 本地运行 · 手艺人摆摊前30秒就能用</p>
    </footer>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const themeToggle = document.getElementById('themeToggle');
      const body = document.body;
      const generateBtn = document.getElementById('generateBtn');
      const craftInput = document.getElementById('craftInput');
      const sentences = [
        document.getElementById('sentence1'),
        document.getElementById('sentence2'),
        document.getElementById('sentence3')
      ];
      const copyPreview = document.getElementById('copyPreview');
      const copyBtn = document.getElementById('copyBtn');
      const statusEl = document.getElementById('status');

      // 主题切换
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        body.classList.add('dark-mode');
        themeToggle.innerHTML = '🌙';
      }
      themeToggle.addEventListener('click', () => {
        if (body.classList.contains('dark-mode')) {
          body.classList.remove('dark-mode');
          themeToggle.innerHTML = '☀️';
          localStorage.setItem('theme', 'light');
        } else {
          body.classList.add('dark-mode');
          themeToggle.innerHTML = '🌙';
          localStorage.setItem('theme', 'dark');
        }
      });

      // 预置规则库（6类常见手艺，覆盖竹编/剪纸/泥塑/花鼓/扎染/蓝印花布）
      const rules = {
        '泥塑': {
          analogy: '像捏橡皮泥一样，但用的是太湖边挖的粗泥和细泥，得阴干不能晒。',
          action: '先打坯、再上色、最后阴干，三步缺一不可，急不得。',
          funfact: '老艺人手上那层茧，是几十年揉泥留下的“泥指纹”，比指纹还准。'
        },
        '剪纸': {
          analogy: '像折纸再剪窗花，但用的是百年传承的“阴阳刻”刀法，一刀错全张废。',
          action: '折、画、刻、展四步，最细的线条比头发丝还细，全靠手腕稳。',
          funfact: '北方剪纸爱红纸，南方苏州剪纸偏爱金银箔衬底，光一照就活了。'
        },
        '竹编': {
          analogy: '像编草帽，但用的是青神山里三年生的慈竹，劈成比头发还细的丝。',
          action: '破竹、刮青、分丝、染色、编织，光分丝就要练三年眼力。',
          funfact: '一只竹篮要编3天，但能用30年——老竹器匠人说：“它比人更懂时间。”'
        },
        '花鼓': {
          analogy: '像广场舞加小鼓，但安徽老乡边敲桐木鼓边唱农事节气，鼓点就是庄稼的闹钟。',
          action: '左手摇鼓、右手击槌、脚踩节奏，唱词里藏着二十四节气口诀。',
          funfact: '鼓面蒙的是猪膀胱膜，透气又响亮，老艺人说“听声就知道今年雨水多不多”。'
        },
        '扎染': {
          analogy: '像用橡皮筋扎T恤再染，但白族阿妈靠17种扎法控制颜色流淌，像画水墨一样精准。',
          action: '扎、浸、染、拆、晒五步，拆开那一刻才见真容，从不重样。',
          funfact: '染料来自板蓝根叶子发酵，泡七天出靛蓝，染一次要等三天氧化才显色。'
        },
        '蓝印花布': {
          analogy: '像蜡笔画完再染蓝，但用豆粉石灰调糊防染，刮掉才露出白花。',
          action: '刻版、刮浆、浸染、晾晒、刮灰，一块布要过20道水，蓝得越深越耐洗。',
          funfact: '老作坊墙缝里长着蓝草，那是30年没洗掉的天然染料在呼吸。'
        }
      };

      // 生成逻辑（模糊匹配，不依赖AI服务）
      const generateSentences = (input) => {
        const lower = input.trim().toLowerCase();
        let matched = null;

        // 精确匹配
        for (const [key, value] of Object.entries(rules)) {
          if (lower.includes(key) || lower.includes(key.toLowerCase())) {
            matched = value;
            break;
          }
        }

        // 模糊关键词匹配
        if (!matched) {
          const keywords = [
            { key: '泥', rule: '泥塑' },
            { key: '剪', rule: '剪纸' },
            { key: '竹', rule: '竹编' },
            { key: '鼓', rule: '花鼓' },
            { key: '扎', rule: '扎染' },
            { key: '印', rule: '蓝印花布' }
          ];
          for (const kw of keywords) {
            if (lower.includes(kw.key)) {
              matched = rules[kw.rule];
              break;
            }
          }
        }

        return matched || rules['泥塑']; // 默认回退
      };

      // 更新UI
      const updateResult = (data) => {
        sentences[0].textContent = data.analogy;
        sentences[1].textContent = data.action;
        sentences[2].textContent = data.funfact;

        const previewText = `① ${data.analogy}\n② ${data.action}\n③ ${data.funfact}`;
        copyPreview.textContent = previewText;
      };

      // 生成按钮事件
      generateBtn.addEventListener('click', () => {
        const input = craftInput.value.trim();
        if (!input) {
          statusEl.textContent = '请先输入手艺名称';
          statusEl.style.color = '#c97a5d';
          return;
        }
        const result = generateSentences(input);
        updateResult(result);
        statusEl.textContent = `✅ 已生成“${input}”的三句话`;
        statusEl.style.color = '#6a8c5f';
      });

      // 回车触发
      craftInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') generateBtn.click();
      });

      // 复制功能
      copyBtn.addEventListener('click', () => {
        const text = copyPreview.textContent;
        navigator.clipboard.writeText(text).then(() => {
          copyBtn.textContent = '✅ 已复制！';
          setTimeout(() => {
            copyBtn.textContent = '📋 复制全部文案';
          }, 2000);
        });
      });

      // 初始化默认展示
      updateResult(rules['泥塑']);
    });
  </script>
</body>
</html>
