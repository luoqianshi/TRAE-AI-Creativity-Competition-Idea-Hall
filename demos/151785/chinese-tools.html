<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实用工具集 - 利息计算 / 简繁转换 / 拼音工具</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f0f2f5;
    color: #1d2129;
    min-height: 100vh;
    padding: 24px 16px;
  }
  .app {
    max-width: 900px;
    margin: 0 auto;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,.08);
    overflow: hidden;
  }
  .app-title {
    padding: 20px 28px;
    font-size: 20px;
    font-weight: 700;
    border-bottom: 1px solid #f0f0f0;
  }
  .app-title small { font-size: 13px; font-weight: 400; color: #86909c; margin-left: 10px; }

  /* Tabs */
  .tabs {
    display: flex;
    border-bottom: 1px solid #f0f0f0;
    background: #fafbfc;
    flex-wrap: wrap;
  }
  .tab {
    padding: 13px 20px;
    font-size: 14px;
    color: #4e5969;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all .2s;
    user-select: none;
    white-space: nowrap;
  }
  .tab:hover { color: #1890ff; }
  .tab.active { color: #1890ff; border-bottom-color: #1890ff; font-weight: 600; }

  /* Panels */
  .panel { display: none; padding: 28px; }
  .panel.active { display: block; }

  /* Form elements */
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #4e5969;
    margin-bottom: 7px;
  }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  input[type="text"], input[type="number"], select, textarea {
    border: 1px solid #d9d9d9;
    border-radius: 4px;
    padding: 8px 12px;
    font-size: 14px;
    outline: none;
    color: #1d2129;
    transition: border-color .2s;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { border-color: #1890ff; }
  input[type="number"], input[type="text"] { width: 180px; }
  select { cursor: pointer; background: #fff; }
  textarea {
    width: 100%;
    min-height: 130px;
    resize: vertical;
    line-height: 1.7;
  }
  .unit { font-size: 13px; color: #86909c; }

  .seg {
    display: inline-flex;
    border: 1px solid #d9d9d9;
    border-radius: 4px;
    overflow: hidden;
  }
  .seg button {
    padding: 7px 16px;
    border: none;
    background: #fff;
    font-size: 13px;
    cursor: pointer;
    color: #4e5969;
    transition: all .15s;
  }
  .seg button + button { border-left: 1px solid #d9d9d9; }
  .seg button.on { background: #1890ff; color: #fff; }

  .btn {
    padding: 8px 22px;
    border: 1px solid #1890ff;
    background: #1890ff;
    color: #fff;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
    transition: all .2s;
  }
  .btn:hover { background: #40a9ff; border-color: #40a9ff; }
  .btn.ghost { background: #fff; color: #4e5969; border-color: #d9d9d9; }
  .btn.ghost:hover { color: #1890ff; border-color: #1890ff; }
  .btn-row { display: flex; gap: 10px; margin: 6px 0 18px; flex-wrap: wrap; }

  /* Result box */
  .result {
    background: #f7f9fc;
    border: 1px solid #eaeef3;
    border-radius: 6px;
    padding: 16px 20px;
    margin-top: 6px;
  }
  .result h4 { font-size: 13px; color: #86909c; font-weight: 600; margin-bottom: 12px; }
  .res-line {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    font-size: 14px;
    border-bottom: 1px dashed #eaeef3;
  }
  .res-line:last-child { border-bottom: none; }
  .res-line .k { color: #4e5969; }
  .res-line .v { font-weight: 700; color: #1d2129; }
  .res-line .v.hl { color: #f5222d; font-size: 16px; }

  /* Amortization table */
  .table-wrap { max-height: 300px; overflow-y: auto; margin-top: 14px; border: 1px solid #eaeef3; border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid #f0f0f0; white-space: nowrap; }
  th { background: #fafbfc; color: #4e5969; position: sticky; top: 0; font-weight: 600; }
  th:first-child, td:first-child { text-align: center; }

  .hint { font-size: 12px; color: #86909c; margin-top: 8px; line-height: 1.6; }
  .lib-status {
    font-size: 12px; padding: 4px 10px; border-radius: 4px; display: inline-block; margin-bottom: 14px;
  }
  .lib-status.loading { background: #fff7e6; color: #d46b08; }
  .lib-status.ok { background: #f6ffed; color: #389e0d; }
  .lib-status.err { background: #fff1f0; color: #cf1322; }

  .io-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: stretch; }
  .io-grid .mid { display: flex; flex-direction: column; justify-content: center; gap: 8px; }
  @media (max-width: 640px) {
    .io-grid { grid-template-columns: 1fr; }
    .io-grid .mid { flex-direction: row; justify-content: center; }
  }
  .chip {
    display:inline-block; margin:2px; padding:3px 9px; background:#f0f5ff; color:#1d39c4;
    border-radius:4px; font-size:15px; cursor:pointer; transition:all .15s;
  }
  .chip:hover { background:#1890ff; color:#fff; }
</style>
</head>
<body>
<div class="app">
  <div class="app-title">实用工具集 <small>利息计算 · 简繁转换 · 拼音工具</small></div>

  <div class="tabs">
    <div class="tab active" data-tab="interest">利息计算</div>
    <div class="tab" data-tab="s2t">简繁转换</div>
    <div class="tab" data-tab="hz2py">汉字转拼音</div>
    <div class="tab" data-tab="py2hz">拼音转汉字</div>
    <div class="tab" data-tab="initial">提取首字母</div>
  </div>

  <!-- ===== 利息计算 ===== -->
  <div class="panel active" id="panel-interest">
    <div class="field">
      <label>计算类型</label>
      <div class="seg" id="loanTypeSeg">
        <button class="on" data-v="deposit">存款利息</button>
        <button data-v="loan">贷款利息</button>
      </div>
    </div>

    <!-- 存款 -->
    <div id="depositForm">
      <div class="field">
        <label>存款本金（元）</label>
        <input type="number" id="depPrincipal" value="100000" min="0">
      </div>
      <div class="field">
        <label>年利率（%）</label>
        <input type="number" id="depRate" value="2.75" step="0.01" min="0">
      </div>
      <div class="field">
        <label>存款期限</label>
        <div class="row">
          <input type="number" id="depTerm" value="3" min="0" step="0.01">
          <select id="depTermUnit">
            <option value="year">年</option>
            <option value="month">月</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>计息方式</label>
        <div class="seg" id="depMethodSeg">
          <button class="on" data-v="simple">单利</button>
          <button data-v="compound">复利（按年）</button>
        </div>
      </div>
      <div class="btn-row"><button class="btn" onclick="calcDeposit()">计算利息</button></div>
      <div class="result" id="depResult" style="display:none"></div>
    </div>

    <!-- 贷款 -->
    <div id="loanForm" style="display:none">
      <div class="field">
        <label>贷款本金（元）</label>
        <input type="number" id="loanPrincipal" value="1000000" min="0">
      </div>
      <div class="field">
        <label>年利率（%）</label>
        <input type="number" id="loanRate" value="4.2" step="0.01" min="0">
      </div>
      <div class="field">
        <label>贷款期限</label>
        <div class="row">
          <input type="number" id="loanTerm" value="30" min="1">
          <select id="loanTermUnit">
            <option value="year">年</option>
            <option value="month">月</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>还款方式</label>
        <div class="seg" id="loanMethodSeg">
          <button class="on" data-v="equal_payment">等额本息</button>
          <button data-v="equal_principal">等额本金</button>
        </div>
      </div>
      <div class="btn-row"><button class="btn" onclick="calcLoan()">计算还款</button></div>
      <div class="result" id="loanResult" style="display:none"></div>
      <div class="table-wrap" id="loanScheduleWrap" style="display:none">
        <table id="loanSchedule"></table>
      </div>
    </div>
  </div>

  <!-- ===== 简繁转换 ===== -->
  <div class="panel" id="panel-s2t">
    <div class="lib-status loading" id="occStatus">正在加载简繁转换引擎...</div>
    <div class="io-grid">
      <div class="field" style="margin:0">
        <label>输入文本</label>
        <textarea id="s2tInput" placeholder="在此输入简体或繁体中文..."></textarea>
      </div>
      <div class="mid">
        <button class="btn" onclick="doS2T()">简→繁 ▶</button>
        <button class="btn ghost" onclick="doT2S()">◀ 繁→简</button>
      </div>
      <div class="field" style="margin:0">
        <label>转换结果</label>
        <textarea id="s2tOutput" placeholder="转换结果显示在这里..."></textarea>
      </div>
    </div>
    <div class="btn-row" style="margin-top:14px">
      <button class="btn ghost" onclick="copyVal('s2tOutput')">复制结果</button>
      <button class="btn ghost" onclick="document.getElementById('s2tInput').value='';document.getElementById('s2tOutput').value='';">清空</button>
    </div>
  </div>

  <!-- ===== 汉字转拼音 ===== -->
  <div class="panel" id="panel-hz2py">
    <div class="lib-status loading" id="pyStatus1">正在加载拼音引擎...</div>
    <div class="field">
      <label>输入汉字</label>
      <textarea id="hz2pyInput" placeholder="在此输入中文汉字...">你好，世界</textarea>
    </div>
    <div class="field">
      <label>选项</label>
      <div class="row">
        <label class="unit"><input type="checkbox" id="pyTone" checked> 带声调</label>
        <label class="unit"><input type="checkbox" id="pyUpper"> 首字母大写</label>
        <span class="unit">分隔符：</span>
        <select id="pySep">
          <option value=" ">空格</option>
          <option value="">无</option>
          <option value="-">连字符 -</option>
          <option value=",">逗号 ,</option>
        </select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn" onclick="doHz2Py()">转换拼音</button>
      <button class="btn ghost" onclick="copyVal('hz2pyOutput')">复制结果</button>
    </div>
    <div class="field">
      <label>拼音结果</label>
      <textarea id="hz2pyOutput" placeholder="拼音结果显示在这里..."></textarea>
    </div>
  </div>

  <!-- ===== 拼音转汉字 ===== -->
  <div class="panel" id="panel-py2hz">
    <div class="lib-status loading" id="pyStatus2">正在构建拼音索引...</div>
    <div class="field">
      <label>输入拼音（单个音节，如 hao、zhong，不含声调）</label>
      <div class="row">
        <input type="text" id="py2hzInput" placeholder="例如：hao" value="hao">
        <button class="btn" onclick="doPy2Hz()">查询汉字</button>
      </div>
      <div class="hint">输入一个不带声调的拼音音节，返回所有对应的常用汉字。点击汉字可复制。</div>
    </div>
    <div class="result" id="py2hzResult" style="display:none"></div>
  </div>

  <!-- ===== 提取首字母 ===== -->
  <div class="panel" id="panel-initial">
    <div class="lib-status loading" id="pyStatus3">正在加载拼音引擎...</div>
    <div class="field">
      <label>输入汉字</label>
      <textarea id="initInput" placeholder="在此输入中文...">中华人民共和国</textarea>
    </div>
    <div class="field">
      <label>选项</label>
      <div class="row">
        <div class="seg" id="initCaseSeg">
          <button class="on" data-v="upper">大写</button>
          <button data-v="lower">小写</button>
        </div>
        <span class="unit">分隔符：</span>
        <select id="initSep">
          <option value="">无</option>
          <option value=" ">空格</option>
          <option value="-">连字符 -</option>
        </select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn" onclick="doInitial()">提取首字母</button>
      <button class="btn ghost" onclick="copyVal('initOutput')">复制结果</button>
    </div>
    <div class="field">
      <label>首字母结果</label>
      <textarea id="initOutput" placeholder="首字母结果显示在这里..."></textarea>
    </div>
  </div>
</div>

<!-- 外部纯JS库（非框架）：简繁 opencc-js，拼音 pinyin-pro -->
<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0/dist/index.js"></script>
<script>
/* ================= Tab 切换 ================= */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});

/* 通用 segment 控件 */
function bindSeg(id, cb) {
  const seg = document.getElementById(id);
  seg.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      seg.querySelectorAll('button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      if (cb) cb(b.dataset.v);
    });
  });
}
function segVal(id) { return document.getElementById(id).querySelector('button.on').dataset.v; }

function copyVal(id) {
  const v = document.getElementById(id).value;
  if (!v) return;
  navigator.clipboard.writeText(v).catch(() => {
    const el = document.getElementById(id); el.select(); document.execCommand('copy');
  });
}

/* 数字格式化 */
function fmt(n) {
  return Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

/* ================= 利息计算 ================= */
bindSeg('loanTypeSeg', v => {
  document.getElementById('depositForm').style.display = v === 'deposit' ? 'block' : 'none';
  document.getElementById('loanForm').style.display = v === 'loan' ? 'block' : 'none';
});
bindSeg('depMethodSeg');
bindSeg('loanMethodSeg');

function calcDeposit() {
  const P = parseFloat(document.getElementById('depPrincipal').value) || 0;
  const rate = (parseFloat(document.getElementById('depRate').value) || 0) / 100;
  let term = parseFloat(document.getElementById('depTerm').value) || 0;
  const unit = document.getElementById('depTermUnit').value;
  const years = unit === 'year' ? term : term / 12;
  const method = segVal('depMethodSeg');

  let interest, total;
  if (method === 'simple') {
    interest = P * rate * years;
    total = P + interest;
  } else {
    total = P * Math.pow(1 + rate, years);
    interest = total - P;
  }

  document.getElementById('depResult').style.display = 'block';
  document.getElementById('depResult').innerHTML = `
    <h4>计算结果（${method === 'simple' ? '单利' : '复利'}）</h4>
    <div class="res-line"><span class="k">存款本金</span><span class="v">¥ ${fmt(P)}</span></div>
    <div class="res-line"><span class="k">存款期限</span><span class="v">${term} ${unit === 'year' ? '年' : '月'}（≈ ${years.toFixed(4)} 年）</span></div>
    <div class="res-line"><span class="k">到期利息</span><span class="v hl">¥ ${fmt(interest)}</span></div>
    <div class="res-line"><span class="k">到期本息合计</span><span class="v">¥ ${fmt(total)}</span></div>
  `;
}

function calcLoan() {
  const P = parseFloat(document.getElementById('loanPrincipal').value) || 0;
  const annualRate = (parseFloat(document.getElementById('loanRate').value) || 0) / 100;
  let term = parseFloat(document.getElementById('loanTerm').value) || 0;
  const unit = document.getElementById('loanTermUnit').value;
  const n = Math.round(unit === 'year' ? term * 12 : term); // 总月数
  const r = annualRate / 12; // 月利率
  const method = segVal('loanMethodSeg');

  if (n <= 0) return;

  let totalInterest = 0, totalPay = 0, rows = [], summaryHtml = '';

  if (method === 'equal_payment') {
    // 等额本息
    const M = r === 0 ? P / n : P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
    totalPay = M * n;
    totalInterest = totalPay - P;
    let remain = P;
    for (let i = 1; i <= n; i++) {
      const interestPart = remain * r;
      const principalPart = M - interestPart;
      remain -= principalPart;
      rows.push([i, M, principalPart, interestPart, Math.max(remain, 0)]);
    }
    summaryHtml = `
      <div class="res-line"><span class="k">每月月供</span><span class="v hl">¥ ${fmt(M)}</span></div>
      <div class="res-line"><span class="k">还款总月数</span><span class="v">${n} 期</span></div>
      <div class="res-line"><span class="k">支付利息总额</span><span class="v">¥ ${fmt(totalInterest)}</span></div>
      <div class="res-line"><span class="k">还款总额</span><span class="v">¥ ${fmt(totalPay)}</span></div>`;
  } else {
    // 等额本金
    const principalPart = P / n;
    let remain = P;
    for (let i = 1; i <= n; i++) {
      const interestPart = remain * r;
      const pay = principalPart + interestPart;
      totalInterest += interestPart;
      totalPay += pay;
      remain -= principalPart;
      rows.push([i, pay, principalPart, interestPart, Math.max(remain, 0)]);
    }
    summaryHtml = `
      <div class="res-line"><span class="k">首月月供</span><span class="v hl">¥ ${fmt(rows[0][1])}</span></div>
      <div class="res-line"><span class="k">每月递减</span><span class="v">¥ ${fmt(principalPart * r)}</span></div>
      <div class="res-line"><span class="k">末月月供</span><span class="v">¥ ${fmt(rows[n-1][1])}</span></div>
      <div class="res-line"><span class="k">还款总月数</span><span class="v">${n} 期</span></div>
      <div class="res-line"><span class="k">支付利息总额</span><span class="v">¥ ${fmt(totalInterest)}</span></div>
      <div class="res-line"><span class="k">还款总额</span><span class="v">¥ ${fmt(totalPay)}</span></div>`;
  }

  document.getElementById('loanResult').style.display = 'block';
  document.getElementById('loanResult').innerHTML =
    `<h4>计算结果（${method === 'equal_payment' ? '等额本息' : '等额本金'}）</h4>` + summaryHtml;

  // 还款计划表
  let thtml = '<thead><tr><th>期数</th><th>月供(元)</th><th>本金(元)</th><th>利息(元)</th><th>剩余本金(元)</th></tr></thead><tbody>';
  rows.forEach(rw => {
    thtml += `<tr><td>${rw[0]}</td><td>${fmt(rw[1])}</td><td>${fmt(rw[2])}</td><td>${fmt(rw[3])}</td><td>${fmt(rw[4])}</td></tr>`;
  });
  thtml += '</tbody>';
  document.getElementById('loanSchedule').innerHTML = thtml;
  document.getElementById('loanScheduleWrap').style.display = 'block';
}

/* ================= 简繁转换 ================= */
let occS2T = null, occT2S = null;
function initOpenCC() {
  const st = document.getElementById('occStatus');
  if (typeof OpenCC === 'undefined') {
    st.className = 'lib-status err';
    st.textContent = '简繁转换引擎加载失败，请检查网络连接后刷新页面。';
    return;
  }
  try {
    occS2T = OpenCC.Converter({ from: 'cn', to: 'tw' });
    occT2S = OpenCC.Converter({ from: 'tw', to: 'cn' });
    st.className = 'lib-status ok';
    st.textContent = '简繁转换引擎已就绪 ✓';
  } catch (e) {
    st.className = 'lib-status err';
    st.textContent = '简繁转换引擎初始化失败：' + e.message;
  }
}
function doS2T() {
  if (!occS2T) return alert('转换引擎尚未就绪');
  document.getElementById('s2tOutput').value = occS2T(document.getElementById('s2tInput').value);
}
function doT2S() {
  if (!occT2S) return alert('转换引擎尚未就绪');
  document.getElementById('s2tOutput').value = occT2S(document.getElementById('s2tInput').value);
}

/* ================= 拼音功能 ================= */
let pyReady = false;
function checkPinyin() {
  const ok = typeof pinyinPro !== 'undefined' && pinyinPro.pinyin;
  ['pyStatus1', 'pyStatus3'].forEach(id => {
    const st = document.getElementById(id);
    if (ok) { st.className = 'lib-status ok'; st.textContent = '拼音引擎已就绪 ✓'; }
    else { st.className = 'lib-status err'; st.textContent = '拼音引擎加载失败，请检查网络后刷新。'; }
  });
  pyReady = ok;
  return ok;
}

function doHz2Py() {
  if (!pyReady) return alert('拼音引擎尚未就绪');
  const { pinyin } = pinyinPro;
  const text = document.getElementById('hz2pyInput').value;
  const tone = document.getElementById('pyTone').checked;
  const upper = document.getElementById('pyUpper').checked;
  const sep = document.getElementById('pySep').value;
  let res = pinyin(text, { toneType: tone ? 'symbol' : 'none', type: 'array', nonZh: 'consecutive' });
  if (upper) res = res.map(w => w ? w.charAt(0).toUpperCase() + w.slice(1) : w);
  document.getElementById('hz2pyOutput').value = res.join(sep);
}

function doInitial() {
  if (!pyReady) return alert('拼音引擎尚未就绪');
  const { pinyin } = pinyinPro;
  const text = document.getElementById('initInput').value;
  const sep = document.getElementById('initSep').value;
  const isUpper = segVal('initCaseSeg') === 'upper';
  let res = pinyin(text, { pattern: 'first', toneType: 'none', type: 'array', nonZh: 'consecutive' });
  res = res.map(c => isUpper ? c.toUpperCase() : c.toLowerCase());
  document.getElementById('initOutput').value = res.join(sep);
}

/* 拼音转汉字：加载时基于常用汉字构建反向索引 */
let py2hzMap = null;
function buildPy2HzIndex() {
  const st = document.getElementById('pyStatus2');
  if (typeof pinyinPro === 'undefined' || !pinyinPro.pinyin) {
    st.className = 'lib-status err';
    st.textContent = '拼音引擎加载失败，无法构建索引。';
    return;
  }
  try {
    const { pinyin } = pinyinPro;
    // 遍历常用汉字区间 一(4E00) ~ 龥(9FA5)
    let chars = '';
    for (let code = 0x4E00; code <= 0x9FA5; code++) chars += String.fromCharCode(code);
    const arr = pinyin(chars, { toneType: 'none', type: 'array' });
    py2hzMap = {};
    for (let i = 0; i < chars.length; i++) {
      const syl = arr[i];
      if (!syl || !/^[a-z]+$/.test(syl)) continue;
      (py2hzMap[syl] = py2hzMap[syl] || []).push(chars[i]);
    }
    st.className = 'lib-status ok';
    st.textContent = '拼音索引已就绪（覆盖 ' + Object.keys(py2hzMap).length + ' 个音节）✓';
  } catch (e) {
    st.className = 'lib-status err';
    st.textContent = '索引构建失败：' + e.message;
  }
}

function doPy2Hz() {
  if (!py2hzMap) return alert('拼音索引尚未就绪');
  const key = document.getElementById('py2hzInput').value.trim().toLowerCase().replace(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/g, m => {
    const map = {'ā':'a','á':'a','ǎ':'a','à':'a','ē':'e','é':'e','ě':'e','è':'e','ī':'i','í':'i','ǐ':'i','ì':'i','ō':'o','ó':'o','ǒ':'o','ò':'o','ū':'u','ú':'u','ǔ':'u','ù':'u','ǖ':'v','ǘ':'v','ǚ':'v','ǜ':'v','ü':'v'};
    return map[m] || m;
  });
  const box = document.getElementById('py2hzResult');
  box.style.display = 'block';
  const list = py2hzMap[key];
  if (!list || !list.length) {
    box.innerHTML = `<h4>查询结果</h4><div style="color:#86909c">未找到拼音 “${key}” 对应的常用汉字。请确认输入的是有效的拼音音节。</div>`;
    return;
  }
  const chips = list.map(c => `<span class="chip" onclick="navigator.clipboard.writeText('${c}')">${c}</span>`).join('');
  box.innerHTML = `<h4>拼音 “${key}” 对应汉字（共 ${list.length} 个，点击复制）</h4><div>${chips}</div>`;
}

/* ================= 初始化 ================= */
bindSeg('initCaseSeg');
window.addEventListener('load', () => {
  initOpenCC();
  checkPinyin();
  // 索引构建较重，延迟到空闲执行
  setTimeout(buildPy2HzIndex, 100);
});
</script>
