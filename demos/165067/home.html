<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>亲情清单</title>
    <style id="theme-vars">
/* Family Checklist - Brand CSS */
:root {
  --fc-background: #FEF7F0;
  --fc-foreground: #2D1B0E;
  --fc-card: #FFFFFF;
  --fc-card-foreground: #2D1B0E;
  --fc-popover: #FFFFFF;
  --fc-popover-foreground: #2D1B0E;
  --fc-primary: #E8723A;
  --fc-primary-foreground: #FFFFFF;
  --fc-muted: #F5EDE4;
  --fc-muted-foreground: #8B7355;
  --fc-border: #E8DDD0;
  --fc-input: #FFFFFF;
  --fc-ring: #E8723A;
  --fc-radius-sm: 8px;
  --fc-radius-md: 14px;
  --fc-radius-lg: 20px;
  --fc-state-success: #4CAF50;
  --fc-state-warning: #F9A825;
  --fc-state-error: #E53935;
  --fc-state-info: #42A5F5;
}

/* Dark mode */
.dark {
  --fc-background: #1A1210;
  --fc-foreground: #F5EDE4;
  --fc-card: #2A1F18;
  --fc-card-foreground: #F5EDE4;
  --fc-popover: #2A1F18;
  --fc-popover-foreground: #F5EDE4;
  --fc-primary: #F08C55;
  --fc-primary-foreground: #1A1210;
  --fc-muted: #3D2E22;
  --fc-muted-foreground: #A89880;
  --fc-border: #3D2E22;
  --fc-input: #2A1F18;
  --fc-ring: #F08C55;
}

/* Semantic token fallback */
@theme inline {
  --color-background: var(--fc-background);
  --color-foreground: var(--fc-foreground);
  --color-card: var(--fc-card);
  --color-card-foreground: var(--fc-card-foreground);
  --color-popover: var(--fc-popover);
  --color-popover-foreground: var(--fc-popover-foreground);
  --color-primary: var(--fc-primary);
  --color-primary-foreground: var(--fc-primary-foreground);
  --color-muted: var(--fc-muted);
  --color-muted-foreground: var(--fc-muted-foreground);
  --color-border: var(--fc-border);
  --color-input: var(--fc-input);
  --color-ring: var(--fc-ring);
  --radius-sm: var(--fc-radius-sm);
  --radius-md: var(--fc-radius-md);
  --radius-lg: var(--fc-radius-lg);
}

/* Semantic token fallback */
#semantic-token-fallback {
  color-scheme: light dark;
}

/* Typography */
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Title styling */
.fc-title {
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.3;
  color: var(--fc-foreground);
}

.fc-subtitle {
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--fc-muted-foreground);
  line-height: 1.4;
}

.fc-body {
  font-size: 0.9375rem;
  font-weight: 400;
  color: var(--fc-foreground);
  line-height: 1.6;
}

.fc-caption {
  font-size: 0.75rem;
  font-weight: 400;
  color: var(--fc-muted-foreground);
  line-height: 1.4;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--fc-background);
    --color-foreground: var(--fc-foreground);
    --color-card: var(--fc-card);
    --color-card-foreground: var(--fc-card-foreground);
    --color-popover: var(--fc-popover);
    --color-popover-foreground: var(--fc-popover-foreground);
    --color-primary: var(--fc-primary);
    --color-primary-foreground: var(--fc-primary-foreground);
    --color-muted: var(--fc-muted);
    --color-muted-foreground: var(--fc-muted-foreground);
    --color-border: var(--fc-border);
    --color-input: var(--fc-input);
    --color-ring: var(--fc-ring);
    --radius-sm: var(--fc-radius-sm);
    --radius-md: var(--fc-radius-md);
    --radius-lg: var(--fc-radius-lg);
  }
  @layer base {
    body { background: var(--fc-background); color: var(--fc-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--fc-background); }
      .text-background { color: var(--fc-background); }
      .border-background { border-color: var(--fc-background); }
      .ring-background { --tw-ring-color: var(--fc-background); }
      .bg-foreground { background-color: var(--fc-foreground); }
      .text-foreground { color: var(--fc-foreground); }
      .border-foreground { border-color: var(--fc-foreground); }
      .ring-foreground { --tw-ring-color: var(--fc-foreground); }
      .bg-card { background-color: var(--fc-card); }
      .text-card { color: var(--fc-card); }
      .border-card { border-color: var(--fc-card); }
      .ring-card { --tw-ring-color: var(--fc-card); }
      .bg-card-foreground { background-color: var(--fc-card-foreground); }
      .text-card-foreground { color: var(--fc-card-foreground); }
      .border-card-foreground { border-color: var(--fc-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--fc-card-foreground); }
      .bg-popover { background-color: var(--fc-popover); }
      .text-popover { color: var(--fc-popover); }
      .border-popover { border-color: var(--fc-popover); }
      .ring-popover { --tw-ring-color: var(--fc-popover); }
      .bg-popover-foreground { background-color: var(--fc-popover-foreground); }
      .text-popover-foreground { color: var(--fc-popover-foreground); }
      .border-popover-foreground { border-color: var(--fc-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--fc-popover-foreground); }
      .bg-primary { background-color: var(--fc-primary); }
      .text-primary { color: var(--fc-primary); }
      .border-primary { border-color: var(--fc-primary); }
      .ring-primary { --tw-ring-color: var(--fc-primary); }
      .bg-primary-foreground { background-color: var(--fc-primary-foreground); }
      .text-primary-foreground { color: var(--fc-primary-foreground); }
      .border-primary-foreground { border-color: var(--fc-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--fc-primary-foreground); }
      .bg-muted { background-color: var(--fc-muted); }
      .text-muted { color: var(--fc-muted); }
      .border-muted { border-color: var(--fc-muted); }
      .ring-muted { --tw-ring-color: var(--fc-muted); }
      .bg-muted-foreground { background-color: var(--fc-muted-foreground); }
      .text-muted-foreground { color: var(--fc-muted-foreground); }
      .border-muted-foreground { border-color: var(--fc-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--fc-muted-foreground); }
      .bg-border { background-color: var(--fc-border); }
      .text-border { color: var(--fc-border); }
      .border-border { border-color: var(--fc-border); }
      .ring-border { --tw-ring-color: var(--fc-border); }
      .bg-input { background-color: var(--fc-input); }
      .text-input { color: var(--fc-input); }
      .border-input { border-color: var(--fc-input); }
      .ring-input { --tw-ring-color: var(--fc-input); }
      .bg-ring { background-color: var(--fc-ring); }
      .text-ring { color: var(--fc-ring); }
      .border-ring { border-color: var(--fc-ring); }
      .ring-ring { --tw-ring-color: var(--fc-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen pb-20">

      <!-- Greeting Header -->
      <header class="px-5 pt-6 pb-4 flex items-start justify-between">
        <div class="flex flex-col gap-1">
          <h1 class="fc-title text-xl">亲情清单</h1>
          <p class="fc-caption">别忘了给家人打个电话</p>
        </div>
        <div class="w-9 h-9 rounded-full bg-primary/10 flex items-center justify-center">
          <i data-lucide="bell" class="w-[18px] h-[18px] text-primary"></i>
        </div>
      </header>

      <!-- Urgent Reminder Banner -->
      <section class="mx-5 mb-4 rounded-[var(--fc-radius-md)] p-4 relative overflow-hidden" style="background: linear-gradient(135deg, #FFF3E0 0%, #FFE0B2 100%);">
        <div class="flex items-start gap-3">
          <div class="flex flex-col items-center gap-1 shrink-0">
            <div class="w-10 h-10 rounded-full bg-[var(--fc-state-warning)]/20 flex items-center justify-center">
              <i data-lucide="heart" class="w-5 h-5" style="color: var(--fc-state-warning);"></i>
            </div>
            <span class="w-2 h-2 rounded-full animate-pulse" style="background-color: var(--fc-state-warning);"></span>
          </div>
          <div class="flex flex-col gap-0.5 min-w-0">
            <p class="text-sm font-semibold" style="color: var(--fc-foreground);">妈妈已经 12 天没联系了</p>
            <p class="text-xs" style="color: var(--fc-muted-foreground);">建议尽快联系，别让关心迟到</p>
          </div>
        </div>
      </section>

      <!-- Section Title -->
      <div class="px-5 mb-3 flex items-center justify-between">
        <h2 class="text-sm font-semibold" style="color: var(--fc-foreground);">家人列表</h2>
        <span class="text-xs" style="color: var(--fc-muted-foreground);">共 4 位</span>
      </div>

      <!-- Contact List -->
      <div class="px-5 flex flex-col gap-3">

        <!-- Contact: 妈妈 (overdue) -->
        <div class="rounded-[var(--fc-radius-md)] p-4 flex items-center gap-3.5" style="background: var(--fc-card); border: 1px solid var(--fc-border);" data-dom-id="card-mom">
          <!-- Progress Ring -->
          <div class="relative shrink-0" style="width: 48px; height: 48px;">
            <svg viewBox="0 0 48 48" class="w-full h-full -rotate-90">
              <circle cx="24" cy="24" r="20" fill="none" stroke="var(--fc-muted)" stroke-width="3" opacity="0.25"/>
              <circle cx="24" cy="24" r="20" fill="none" stroke="var(--fc-state-warning)" stroke-width="3" stroke-linecap="round" stroke-dasharray="125.66" stroke-dashoffset="0"/>
            </svg>
            <div class="absolute inset-0 flex items-center justify-center">
              <span class="text-xs font-bold" style="color: var(--fc-state-warning);">12</span>
            </div>
            <!-- Pulsing dot for overdue -->
            <span class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full animate-pulse" style="background-color: var(--fc-state-warning);"></span>
          </div>
          <!-- Info -->
          <div class="flex flex-col gap-0.5 flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <span class="text-sm font-semibold" style="color: var(--fc-foreground);">妈妈</span>
              <span class="text-[10px] px-1.5 py-0.5 rounded-full font-medium" style="background: var(--fc-state-warning); color: var(--fc-primary-foreground);">需联系</span>
            </div>
            <p class="text-xs" style="color: var(--fc-muted-foreground);">上次联系: 12天前</p>
            <p class="text-xs" style="color: var(--fc-muted-foreground);">下次联系: 今天 · 每 7 天</p>
          </div>
          <!-- Action -->
          <div class="shrink-0 w-9 h-9 rounded-full flex items-center justify-center" style="background: var(--fc-primary);">
            <i data-lucide="phone" class="w-4 h-4" style="color: var(--fc-primary-foreground);"></i>
          </div>
        </div>

        <!-- Contact: 爸爸 (normal) -->
        <div class="rounded-[var(--fc-radius-md)] p-4 flex items-center gap-3.5" style="background: var(--fc-card); border: 1px solid var(--fc-border);">
          <!-- Progress Ring -->
          <div class="relative shrink-0" style="width: 48px; height: 48px;">
            <svg viewBox="0 0 48 48" class="w-full h-full -rotate-90">
              <circle cx="24" cy="24" r="20" fill="none" stroke="var(--fc-muted)" stroke-width="3" opacity="0.25"/>
              <circle cx="24" cy="24" r="20" fill="none" stroke="var(--fc-state-success)" stroke-width="3" stroke-linecap="round" stroke-dasharray="125.66" stroke-dashoffset="83.1"/>
            </svg>
            <div class="absolute inset-0 flex items-center justify-center">
              <span class="text-xs font-bold" style="color: var(--fc-state-success);">3</span>
            </div>
            <!-- Green dot for recent -->
            <span class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full" style="background-color: var(--fc-state-success);"></span>
          </div>
          <!-- Info -->
          <div class="flex flex-col gap-0.5 flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <span class="text-sm font-semibold" style="color: var(--fc-foreground);">爸爸</span>
              <span class="text-[10px] px-1.5 py-0.5 rounded-full font-medium" style="background: var(--fc-state-success); color: var(--fc-primary-foreground);">正常</span>
            </div>
            <p class="text-xs" style="color: var(--fc-muted-foreground);">上次联系: 3天前</p>
            <p class="text-xs" style="color: var(--fc-muted-foreground);">下次联系: 11天后 · 每 14 天</p>
          </div>
          <!-- Action -->
          <div class="shrink-0 w-9 h-9 rounded-full flex items-center justify-center" style="background: var(--fc-primary);">
            <i data-lucide="phone" class="w-4 h-4" style="color: var(--fc-primary-foreground);"></i>
          </div>
        </div>

        <!-- Contact: 外婆 (overdue, more severe) -->
        <div class="rounded-[var(--fc-radius-md)] p-4 flex items-center gap-3.5" style="background: var(--fc-card); border: 1px solid var(--fc-border);">
          <!-- Progress Ring -->
          <div class="relative shrink-0" style="width: 48px; height: 48px;">
            <svg viewBox="0 0 48 48" class="w-full h-full -rotate-90">
              <circle cx="24" cy="24" r="20" fill="none" stroke="var(--fc-muted)" stroke-width="3" opacity="0.25"/>
              <circle cx="24" cy="24" r="20" fill="none" stroke="var(--fc-state-error)" stroke-width="3" stroke-linecap="round" stroke-dasharray="125.66" stroke-dashoffset="0"/>
            </svg>
            <div class="absolute inset-0 flex items-center justify-center">
              <span class="text-xs font-bold" style="color: var(--fc-state-error);">20</span>
            </div>
            <!-- Pulsing amber-red dot -->
            <span class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full animate-pulse" style="background-color: var(--fc-state-error);"></span>
          </div>
          <!-- Info -->
          <div class="flex flex-col gap-0.5 flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <span class="text-sm font-semibold" style="color: var(--fc-foreground);">外婆</span>
              <span class="text-[10px] px-1.5 py-0.5 rounded-full font-medium" style="background: var(--fc-state-error); color: var(--fc-primary-foreground);">超期</span>
            </div>
            <p class="text-xs" style="color: var(--fc-muted-foreground);">上次联系: 20天前</p>
            <p class="text-xs" style="color: var(--fc-muted-foreground);">下次联系: 已逾期 · 每 10 天</p>
          </div>
          <!-- Action -->
          <div class="shrink-0 w-9 h-9 rounded-full flex items-center justify-center" style="background: var(--fc-primary);">
            <i data-lucide="phone" class="w-4 h-4" style="color: var(--fc-primary-foreground);"></i>
          </div>
        </div>

        <!-- Contact: 哥哥 (normal, recently contacted) -->
        <div class="rounded-[var(--fc-radius-md)] p-4 flex items-center gap-3.5" style="background: var(--fc-card); border: 1px solid var(--fc-border);">
          <!-- Progress Ring -->
          <div class="relative shrink-0" style="width: 48px; height: 48px;">
            <svg viewBox="0 0 48 48" class="w-full h-full -rotate-90">
              <circle cx="24" cy="24" r="20" fill="none" stroke="var(--fc-muted)" stroke-width="3" opacity="0.25"/>
              <circle cx="24" cy="24" r="20" fill="none" stroke="var(--fc-state-success)" stroke-width="3" stroke-linecap="round" stroke-dasharray="125.66" stroke-dashoffset="124.16"/>
            </svg>
            <div class="absolute inset-0 flex items-center justify-center">
              <span class="text-[10px] font-bold" style="color: var(--fc-state-success);">1</span>
            </div>
            <!-- Green dot for recent -->
            <span class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full" style="background-color: var(--fc-state-success);"></span>
          </div>
          <!-- Info -->
          <div class="flex flex-col gap-0.5 flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <span class="text-sm font-semibold" style="color: var(--fc-foreground);">哥哥</span>
              <span class="text-[10px] px-1.5 py-0.5 rounded-full font-medium" style="background: var(--fc-state-success); color: var(--fc-primary-foreground);">正常</span>
            </div>
            <p class="text-xs" style="color: var(--fc-muted-foreground);">上次联系: 昨天</p>
            <p class="text-xs" style="color: var(--fc-muted-foreground);">下次联系: 29天后 · 每 30 天</p>
          </div>
          <!-- Action -->
          <div class="shrink-0 w-9 h-9 rounded-full flex items-center justify-center" style="background: var(--fc-primary);">
            <i data-lucide="phone" class="w-4 h-4" style="color: var(--fc-primary-foreground);"></i>
          </div>
        </div>

      </div>

      <!-- Bottom Navigation (Global) -->
      <nav data-mobile-nav="global" class="fixed bottom-0 left-0 right-0 h-16 bg-card border-t border-border z-50">
        <div class="w-full max-w-md mx-auto grid grid-cols-3 h-full">
          <a href="#" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-primary" data-nav-key="home" data-active="true">
            <i data-lucide="home" class="w-5 h-5 shrink-0"></i>
            <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">首页</span>
          </a>
          <a href="#" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-muted-foreground" data-nav-key="contacts" data-dom-id="nav-add-contact">
            <i data-lucide="user-plus" class="w-5 h-5 shrink-0"></i>
            <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">联系人</span>
          </a>
          <a href="#" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-muted-foreground" data-nav-key="settings" data-dom-id="nav-free-time">
            <i data-lucide="settings" class="w-5 h-5 shrink-0"></i>
            <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">设置</span>
          </a>
        </div>
      </nav>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
