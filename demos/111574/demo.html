<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时光碎片 - 生活记录工具</title>
<style>
:root {
--main: #9c8b81;
--light: #f8f5f2;
--text: #333;
--shadow: 0 4px 16px rgba(107,91,83,0.1);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif}
body{background:var(--light);color:var(--text);padding:20px;min-height:100vh}
.container{max-width:1200px;margin:0 auto}
header{text-align:center;margin-bottom:30px}
header h1{color:var(--main);font-size:28px;margin-bottom:8px}
header p{color:#777}
.main-wrap{display:grid;grid-template-columns:420px 1fr;gap:24px}
@media(max-width:768px){.main-wrap{grid-template-columns:1fr}}
.panel{background:#fff;border-radius:16px;padding:24px;box-shadow:var(--shadow)}
.panel-title{font-size:18px;margin-bottom:16px;color:var(--main);font-weight:600}
input,textarea,select{width:100%;padding:12px 14px;border:1px solid #e0d8d2;border-radius:10px;margin-bottom:12px;font-size:14px}
textarea{min-height:120px;resize:none}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;cursor:pointer;transition:0.2s}
.btn-primary{background:var(--main);color:#fff}
.btn-del{background:#eee;color:#d65555;margin-top:8px}
.filter-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.filter-bar select{width:auto;flex:1}
.card-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:var(--shadow);transition:transform 0.2s}
.card:hover{transform:translateY(-4px)}
.card-img{width:100%;height:160px;object-fit:cover;border-radius:10px;margin-bottom:12px;background:#f3efeb}
.card h3{font-size:16px;margin-bottom:6px}
.card-time{font-size:12px;color:#999;margin-bottom:8px}
.card-tag{display:inline-block;background:#f0e9e4;color:var(--main);padding:3px 8px;border-radius:6px;font-size:12px;margin-bottom:10px}
.card-desc{font-size:14px;line-height:1.6;color:#555;margin-bottom:12px}
.card-ops{display:flex;gap:8px}
.card-ops button{flex:1;padding:8px;border-radius:8px;border:1px solid #ddd;background:#fff}
.empty{text-align:center;padding:60px 20px;color:#aaa;font-size:15px}
</style>
</head>
<body>
<div class="container">
<header>
<h1>时光碎片 · 生活记录</h1>
<p>保存照片、心情与每一段日常回忆</p>
</header>
<div class="main-wrap">
<!-- 新建记录面板 -->
<div class="panel">
<h2 class="panel-title">新建碎片</h2>
<input id="title" placeholder="标题（例：周末出游）">
<textarea id="content" placeholder="写下今日小事、心情感悟..."></textarea>
<input type="file" id="imgUpload" accept="image/*">
<input id="tag" placeholder="标签，逗号分隔（旅行/美食/日常）">
<button class="btn btn-primary" onclick="saveItem()">保存碎片</button>
</div>

<!-- 记录展示区 -->
<div>
<div class="panel">
<div class="filter-bar">
<select id="filterTag" onchange="renderList()">
<option value="">全部标签</option>
</select>
</div>
<div id="listWrap">
<div class="empty">暂无记录，快来创建第一条生活碎片吧</div>
</div>
</div>
</div>
</div>
</div>

<script>
const STORAGE_KEY = "lifeDiaryData";
let diaryList = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
const filterSel = document.getElementById("filterTag");

// 保存数据到本地存储
function saveStorage(){
localStorage.setItem(STORAGE_KEY, JSON.stringify(diaryList));
}

// 更新标签筛选下拉框
function updateTagFilter(){
const tags = new Set();
diaryList.forEach(item=>{
item.tags.split(",").map(t=>t.trim()).forEach(t=>tags.add(t));
});
filterSel.innerHTML = `<option value="">全部标签</option>`;
tags.forEach(t=>{
filterSel.innerHTML += `<option value="${t}">${t}</option>`;
})
}

// 渲染所有记录卡片
function renderList(){
updateTagFilter();
const wrap = document.getElementById("listWrap");
const selTag = filterSel.value;
let showData = diaryList;
if(selTag) showData = diaryList.filter(i=>i.tags.includes(selTag));

if(showData.length === 0){
wrap.innerHTML = `<div class="empty">暂无匹配记录</div>`;
return;
}
let html = `<div class="card-list">`;
showData.forEach((item,idx)=>{
html += `
<div class="card">
${item.img ? `<img class="card-img" src="${item.img}">` : `<div class="card-img"></div>`}
<h3>${item.title}</h3>
<div class="card-time">${item.time}</div>
<span class="card-tag">${item.tags}</span>
<p class="card-desc">${item.content}</p>
<div class="card-ops">
<button onclick="editItem(${idx})">编辑</button>
<button onclick="delItem(${idx})">删除</button>
</div>
</div>`;
})
html += `</div>`;
wrap.innerHTML = html;
}

// 保存新记录
function saveItem(){
const title = document.getElementById("title").value.trim();
const content = document.getElementById("content").value.trim();
const tag = document.getElementById("tag").value.trim();
const file = document.getElementById("imgUpload").files[0];
if(!title){alert("请填写标题");return;}

if(file){
const reader = new FileReader();
reader.onload = e=>{
createNewItem(e.target.result,title,content,tag);
}
reader.readAsDataURL(file);
}else{
createNewItem("",title,content,tag);
}
}

function createNewItem(img,title,content,tags){
const time = new Date().toLocaleString();
diaryList.unshift({img,title,content,tags,time});
saveStorage();
clearInput();
renderList();
}

// 清空输入框
function clearInput(){
document.getElementById("title").value = "";
document.getElementById("content").value = "";
document.getElementById("tag").value = "";
document.getElementById("imgUpload").value = "";
}

// 删除记录
function delItem(idx){
if(!confirm("确定删除这条记录？删除后无法恢复")) return;
diaryList.splice(idx,1);
saveStorage();
renderList();
}

// 简易编辑弹窗
function editItem(idx){
const item = diaryList[idx];
const newTitle = prompt("修改标题",item.title);
if(newTitle===null)return;
const newText = prompt("修改内容",item.content);
if(newText===null)return;
item.title = newTitle.trim();
item.content = newText.trim();
saveStorage();
renderList();
}

// 页面初始化渲染
renderList();
</script>
</body>
</html>
