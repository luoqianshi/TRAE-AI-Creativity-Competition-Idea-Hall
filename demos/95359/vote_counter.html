<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>班级选票统计工具</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --surface: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --danger: #ef4444;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 10px 15px -3px rgba(0, 0, 0, 0.03);
      --radius: 18px;
    }

    body.dark {
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --primary: #818cf8;
      --primary-light: rgba(129, 140, 248, 0.15);
      --danger: #f87171;
      --danger-bg: rgba(248, 113, 113, 0.12);
      --danger-border: rgba(248, 113, 113, 0.3);
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.25), 0 10px 15px -3px rgba(0, 0, 0, 0.2);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .app {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 18px 64px;
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }

    .spacer { flex: 1; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.05s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      background: var(--surface);
      color: var(--text);
    }

    .btn:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
    .btn:active { transform: translateY(1px); }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 2px 6px rgba(79, 70, 229, 0.22);
    }
    body.dark .btn-primary { box-shadow: 0 2px 6px rgba(129, 140, 248, 0.22); }
    .btn-primary:hover { background: #4338ca; border-color: #4338ca; color: #fff; }
    body.dark .btn-primary:hover { background: #6366f1; border-color: #6366f1; }

    .btn-danger { color: var(--danger); border-color: var(--danger-border); background: var(--danger-bg); }
    .btn-danger:hover { background: var(--danger-bg); border-color: var(--danger); }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
      transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.5px;
      margin: 0 0 14px;
    }

    /* Tags */
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s ease, box-shadow 0.15s ease;
      border: 1px solid transparent;
    }

    .tag:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,0.08); }
    .tag:active { transform: translateY(0); }

    .tag .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .tag .remove {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 13px;
      line-height: 1;
      opacity: 0.65;
      transition: opacity 0.15s ease, background 0.15s ease;
    }
    .tag .remove:hover { opacity: 1; background: rgba(0,0,0,0.08); }

    .tag.current { color: #fff !important; }
    .tag.current .dot { background: #fff !important; }

    .add-tag-row {
      display: flex;
      gap: 10px;
    }

    .add-tag-row input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      transition: background 0.25s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .add-tag-row input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }
    body.dark .add-tag-row input:focus { box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.18); }

    /* Voting */
    .vote-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 38px 24px;
    }

    .vote-project {
      font-size: 30px;
      font-weight: 800;
      margin: 0 0 12px;
      letter-spacing: -0.5px;
      text-align: center;
    }

    .vote-meta {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 28px;
    }

    .badge {
      background: var(--primary-light);
      color: var(--primary);
      padding: 5px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
    }

    .vote-input {
      width: 100%;
      max-width: 440px;
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 18px 22px;
      font-size: 22px;
      font-weight: 700;
      font-family: inherit;
      text-align: center;
      letter-spacing: 1px;
      color: var(--text);
      background: var(--surface);
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.25s ease;
    }
    .vote-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
    }
    body.dark .vote-input:focus { box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.18); }
    .vote-input:disabled { background: var(--bg); color: var(--muted); }

    .vote-hint {
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    .vote-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .progress {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 26px;
      flex-wrap: wrap;
    }

    .progress .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--border);
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .progress .dot.current { transform: scale(1.35); background: var(--primary); }
    .progress .dot.done { background: var(--primary); opacity: 0.45; }

    /* Results */
    .results-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .result-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .result-box h3 {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .result-box .result-meta {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
      margin-left: auto;
    }

    .ranking {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .ranking li {
      display: grid;
      grid-template-columns: 30px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .ranking li:last-child { border-bottom: none; }

    .rank {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 700;
      background: var(--border);
      color: var(--muted);
    }
    .rank.top { background: var(--primary); color: #fff; }

    .candidate { font-weight: 600; font-size: 14px; }
    .candidate input {
      border: none;
      background: transparent;
      padding: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      width: 100%;
    }
    .candidate input:focus { outline: none; }
    .candidate .id { color: var(--muted); font-size: 11px; margin-top: 2px; }

    .count { text-align: right; }
    .count .num { font-size: 16px; font-weight: 700; }
    .count .bar {
      height: 5px;
      width: 80px;
      background: var(--border);
      border-radius: 3px;
      margin-top: 5px;
      overflow: hidden;
    }
    .count .bar span {
      display: block;
      height: 100%;
      background: var(--primary);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 30px 0;
      font-size: 14px;
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(17, 24, 39, 0.95);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>班级不记名选票统计</h1>
      <div class="subtitle">配置、投票、结果，一页搞定</div>
    </header>

    <div class="toolbar">
      <button class="btn" id="btnExport">导出数据</button>
      <button class="btn btn-danger" id="btnReset">清空全部</button>
      <div class="spacer"></div>
      <button class="btn" id="btnTheme">🌙 深色</button>
    </div>

    <!-- 设置区 -->
    <section class="card">
      <div class="card-title">投票项目</div>
      <div class="tags" id="tagsArea"></div>
      <div class="add-tag-row">
        <input type="text" id="newProjectInput" placeholder="输入项目名称，按回车添加" />
        <button class="btn btn-primary" id="btnAddProject">添加</button>
      </div>
    </section>

    <!-- 投票区 -->
    <section class="card vote-area" id="voteCard">
      <div class="vote-project" id="currentProjectTitle">请先添加项目</div>
      <div class="vote-meta" id="voteMeta" style="display:none;">
        <span class="badge" id="roundBadge">第 1 轮</span>
        <span id="progressText">1 / 1</span>
      </div>
      <input type="text" id="voteInput" class="vote-input" placeholder="输入学号" autocomplete="off" disabled />
      <div class="vote-hint" id="voteHint">添加项目后，在这里输入学号并按回车投票。</div>
      <div class="vote-actions" id="voteActions" style="display:none;">
        <button class="btn" id="btnVoteUndo">撤销上一次</button>
        <button class="btn" id="btnUndoRound">撤销上一轮</button>
        <button class="btn" id="btnResetProgress">重置进度</button>
      </div>
      <div class="progress" id="voteProgress"></div>
    </section>

    <!-- 统计结果区 -->
    <section class="card">
      <div class="card-title">统计结果</div>
      <div id="resultsArea">
        <div class="empty">暂无数据</div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = 'class_vote_data_v2';
    const THEME_KEY = 'vote_theme';

    const tagPalette = [
      { bg: '#fef2f2', border: '#fecaca', dot: '#f87171', text: '#b91c1c' },
      { bg: '#fff7ed', border: '#fed7aa', dot: '#fb923c', text: '#c2410c' },
      { bg: '#fffbeb', border: '#fde68a', dot: '#fbbf24', text: '#b45309' },
      { bg: '#f0fdf4', border: '#bbf7d0', dot: '#4ade80', text: '#15803d' },
      { bg: '#f0fdfa', border: '#99f6e4', dot: '#2dd4bf', text: '#0f766e' },
      { bg: '#eff6ff', border: '#bfdbfe', dot: '#60a5fa', text: '#1d4ed8' },
      { bg: '#eef2ff', border: '#c7d2fe', dot: '#818cf8', text: '#3730a3' },
      { bg: '#faf5ff', border: '#e9d5ff', dot: '#c084fc', text: '#7e22ce' },
      { bg: '#fdf2f8', border: '#fbcfe8', dot: '#f472b6', text: '#be185d' },
    ];

    let data = loadData();

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
        const oldRaw = localStorage.getItem('class_vote_data_v1');
        if (oldRaw) {
          const old = JSON.parse(oldRaw);
          return { projects: old.projects || [], activeIndex: 0, session: { active: false, index: 0, round: 1 }, history: old.history || [] };
        }
      } catch (e) {}
      return { projects: [], activeIndex: 0, session: { active: false, index: 0, round: 1 }, history: [] };
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function initTheme() {
      let theme = localStorage.getItem(THEME_KEY);
      if (!theme) {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      applyTheme(theme);
    }

    function applyTheme(theme) {
      document.body.classList.toggle('dark', theme === 'dark');
      const btn = document.getElementById('btnTheme');
      btn.textContent = theme === 'dark' ? '☀ 浅色' : '🌙 深色';
      localStorage.setItem(THEME_KEY, theme);
    }

    function toggleTheme() {
      const isDark = document.body.classList.contains('dark');
      applyTheme(isDark ? 'light' : 'dark');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1800);
    }

    function tagColor(i) {
      return tagPalette[i % tagPalette.length];
    }

    function parseIds(text) {
      return text
        .split(/[\s,，;；]+/)
        .map(s => s.trim())
        .filter(s => s.length > 0);
    }

    function addProject() {
      const input = document.getElementById('newProjectInput');
      const title = input.value.trim();
      if (!title) return;
      const colorIndex = data.projects.length % tagPalette.length;
      data.projects.push({ title, ballots: [], aliases: {}, colorIndex });
      if (!data.session.active) {
        data.session = { active: true, index: 0, round: 1 };
      }
      input.value = '';
      saveData();
      render();
      showToast('已添加：' + title);
      focusInput();
    }

    function removeProject(index, event) {
      event.stopPropagation();
      if (!confirm(`确定删除「${data.projects[index].title}」？`)) return;
      data.projects.splice(index, 1);
      if (data.projects.length === 0) {
        data.session = { active: false, index: 0, round: 1 };
      } else {
        if (data.session.index >= data.projects.length) data.session.index = 0;
      }
      saveData();
      render();
    }

    function selectProject(index) {
      if (!data.projects.length) return;
      data.session.active = true;
      data.session.index = index;
      saveData();
      render();
      focusInput();
    }

    function resetProgress() {
      if (!data.projects.length) return;
      data.session = { active: true, index: 0, round: 1 };
      saveData();
      render();
      showToast('已重置到第 1 轮第 1 项');
      focusInput();
    }

    function focusInput() {
      setTimeout(() => document.getElementById('voteInput').focus(), 30);
    }

    function submitVote() {
      if (!data.session.active || !data.projects.length) return;
      const input = document.getElementById('voteInput');
      const ids = parseIds(input.value);
      if (ids.length === 0) {
        showToast('请输入学号');
        return;
      }
      const beforeIndex = data.session.index;
      const beforeRound = data.session.round;
      const project = data.projects[data.session.index];
      const beforeLength = project.ballots.length;
      project.ballots.push({ ids, time: Date.now() });
      data.history.push({ projectIndex: data.session.index, count: 1, beforeLength, beforeIndex, beforeRound });

      data.session.index++;
      if (data.session.index >= data.projects.length) {
        data.session.index = 0;
        data.session.round++;
      }

      input.value = '';
      saveData();
      render();
      focusInput();
      showToast(`已记录 ${ids.length} 票 · ${project.title}`);
    }

    function undoVote() {
      if (!data.history.length) {
        showToast('没有可撤销的投票');
        return;
      }
      const last = data.history[data.history.length - 1];
      const project = data.projects[last.projectIndex];
      project.ballots.splice(last.beforeLength, last.count);
      data.history.pop();
      if (typeof last.beforeIndex === 'number') {
        data.session.index = last.beforeIndex;
        data.session.round = last.beforeRound;
      }
      saveData();
      render();
      focusInput();
      showToast('已撤销上一次投票');
    }

    function undoLastRound() {
      if (!data.history.length) {
        showToast('没有可撤销的轮次');
        return;
      }
      const roundSet = new Set(data.history.map(h => h.beforeRound));
      const targetRound = Math.max(...roundSet);
      if (!confirm(`确定撤销第 ${targetRound} 轮的所有投票？`)) return;

      const toRemove = data.history.filter(h => h.beforeRound === targetRound);
      // 从后往前移除，避免索引错乱
      [...toRemove].reverse().forEach(h => {
        const project = data.projects[h.projectIndex];
        project.ballots.splice(h.beforeLength, h.count);
      });
      data.history = data.history.filter(h => h.beforeRound !== targetRound);
      data.session.round = targetRound;
      data.session.index = 0;
      saveData();
      render();
      focusInput();
      showToast(`已撤销第 ${targetRound} 轮`);
    }

    function computeRanking(project) {
      const counts = {};
      let total = 0;
      project.ballots.forEach(ballot => {
        ballot.ids.forEach(id => {
          counts[id] = (counts[id] || 0) + 1;
          total++;
        });
      });
      const max = Math.max(0, ...Object.values(counts));
      const list = Object.entries(counts)
        .map(([id, count]) => ({ id, count }))
        .sort((a, b) => b.count - a.count || a.id.localeCompare(b.id, 'zh-CN'));
      return { list, total, max };
    }

    function renderRanking(container, project) {
      if (!project || project.ballots.length === 0) {
        container.innerHTML = '<div class="empty">暂无票数</div>';
        return;
      }
      const { list, max } = computeRanking(project);
      const ul = document.createElement('ul');
      ul.className = 'ranking';
      list.forEach((item, idx) => {
        const li = document.createElement('li');
        const ratio = max ? (item.count / max) * 100 : 0;
        const alias = project.aliases[item.id] || '';
        li.innerHTML = `
          <div class="rank ${idx < 3 ? 'top' : ''}">${idx + 1}</div>
          <div class="candidate">
            <input type="text" value="${escapeHtml(alias)}" placeholder="备注（可选）" data-id="${escapeHtml(item.id)}" />
            <div class="id">学号：${escapeHtml(item.id)}</div>
          </div>
          <div class="count">
            <div class="num">${item.count}</div>
            <div class="bar"><span style="width:${ratio}%"></span></div>
          </div>
        `;
        const input = li.querySelector('input');
        input.addEventListener('change', () => {
          project.aliases[item.id] = input.value.trim();
          saveData();
        });
        ul.appendChild(li);
      });
      container.innerHTML = '';
      container.appendChild(ul);
    }

    function renderTags() {
      const area = document.getElementById('tagsArea');
      area.innerHTML = '';
      data.projects.forEach((p, i) => {
        const c = tagColor(p.colorIndex ?? i);
        const isCurrent = data.session.active && i === data.session.index;
        const tag = document.createElement('div');
        tag.className = 'tag' + (isCurrent ? ' current' : '');
        tag.style.background = isCurrent ? c.dot : c.bg;
        tag.style.color = isCurrent ? '#fff' : c.text;
        tag.style.borderColor = isCurrent ? c.dot : c.border;
        tag.innerHTML = `<span class="dot" style="background:${isCurrent ? '#fff' : c.dot}"></span><span>${escapeHtml(p.title)}</span><span class="remove" style="color:${isCurrent ? '#fff' : c.text}">×</span>`;
        tag.addEventListener('click', () => selectProject(i));
        tag.querySelector('.remove').addEventListener('click', (e) => removeProject(i, e));
        area.appendChild(tag);
      });
    }

    function renderVote() {
      const titleEl = document.getElementById('currentProjectTitle');
      const metaEl = document.getElementById('voteMeta');
      const input = document.getElementById('voteInput');
      const hint = document.getElementById('voteHint');
      const actions = document.getElementById('voteActions');
      const progress = document.getElementById('voteProgress');
      const btnUndoRound = document.getElementById('btnUndoRound');

      if (!data.projects.length || !data.session.active) {
        titleEl.textContent = '请先添加项目';
        metaEl.style.display = 'none';
        input.disabled = true;
        input.placeholder = '输入学号';
        hint.textContent = '添加项目后，在这里输入学号并按回车投票。';
        actions.style.display = 'none';
        progress.innerHTML = '';
        return;
      }

      const project = data.projects[data.session.index];
      titleEl.textContent = project.title;
      metaEl.style.display = 'flex';
      document.getElementById('roundBadge').textContent = '第 ' + data.session.round + ' 轮';
      document.getElementById('progressText').textContent = `${data.session.index + 1} / ${data.projects.length}`;
      input.disabled = false;
      input.placeholder = '输入学号';
      hint.textContent = '按回车提交，自动切换到下一个项目。';
      actions.style.display = 'flex';
      btnUndoRound.disabled = !data.history.length;
      btnUndoRound.style.opacity = data.history.length ? '1' : '0.5';

      progress.innerHTML = '';
      data.projects.forEach((_, i) => {
        const dot = document.createElement('div');
        dot.className = 'dot';
        if (i === data.session.index) dot.classList.add('current');
        else if (data.session.round > 1 || (data.session.round === 1 && i < data.session.index)) dot.classList.add('done');
        progress.appendChild(dot);
      });
    }

    function renderResults() {
      const area = document.getElementById('resultsArea');
      area.innerHTML = '';
      if (!data.projects.length) {
        area.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const grid = document.createElement('div');
      grid.className = 'results-grid';
      data.projects.forEach((p, i) => {
        const c = tagColor(p.colorIndex ?? i);
        const box = document.createElement('div');
        box.className = 'result-box';
        box.innerHTML = `
          <h3>
            <span class="dot" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${c.dot}"></span>
            ${escapeHtml(p.title)}
            <span class="result-meta">${p.ballots.length} 张选票 · ${computeRanking(p).total} 票</span>
          </h3>
        `;
        const inner = document.createElement('div');
        renderRanking(inner, p);
        box.appendChild(inner);
        grid.appendChild(box);
      });
      area.appendChild(grid);
    }

    function render() {
      renderTags();
      renderVote();
      renderResults();
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function exportData() {
      if (data.projects.length === 0) {
        showToast('没有可导出的数据');
        return;
      }
      let text = '班级选票统计结果\n';
      text += '导出时间：' + new Date().toLocaleString('zh-CN') + '\n\n';
      data.projects.forEach((p, i) => {
        const { list, total } = computeRanking(p);
        text += `【${i + 1}】${p.title}\n`;
        text += `已录入选票：${p.ballots.length} 张，总票数：${total}\n`;
        list.forEach((item, idx) => {
          const name = p.aliases[item.id] || '';
          text += `${idx + 1}. 学号 ${item.id}${name ? ' ' + name : ''} —— ${item.count} 票\n`;
        });
        text += '\n';
      });
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '选票统计_' + new Date().toISOString().slice(0, 10) + '.txt';
      a.click();
      URL.revokeObjectURL(url);
      showToast('已导出统计结果');
    }

    function resetAll() {
      if (!confirm('确定清空所有项目和数据？此操作不可恢复。')) return;
      data = { projects: [], activeIndex: 0, session: { active: false, index: 0, round: 1 }, history: [] };
      saveData();
      render();
      showToast('已清空全部数据');
    }

    document.getElementById('btnAddProject').addEventListener('click', addProject);
    document.getElementById('newProjectInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addProject();
    });
    document.getElementById('voteInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitVote();
    });
    document.getElementById('btnVoteUndo').addEventListener('click', undoVote);
    document.getElementById('btnUndoRound').addEventListener('click', undoLastRound);
    document.getElementById('btnResetProgress').addEventListener('click', resetProgress);
    document.getElementById('btnExport').addEventListener('click', exportData);
    document.getElementById('btnReset').addEventListener('click', resetAll);
    document.getElementById('btnTheme').addEventListener('click', toggleTheme);

    initTheme();
    render();
    focusInput();
  </script>
</body>
</html>
