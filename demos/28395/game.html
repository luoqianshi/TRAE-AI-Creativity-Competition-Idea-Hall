<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>童年米字挑棋 | 怀旧小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: #fff8e8;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 10px;
        }
        .title {
            font-size: 28px;
            color: #8b4513;
            margin-bottom: 12px;
        }
        .desc {
            color: #666;
            margin-bottom: 24px;
            text-align: center;
            max-width: 500px;
        }
        .container {
            background: #f5e6cc;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 16px #d9c3a0;
        }
        #board {
            width: 360px;
            height: 360px;
            position: relative;
        }
        /* 米字棋盘线条 */
        .line-h {
            position: absolute;
            left: 0;
            width: 100%;
            height: 3px;
            background: #5a3817;
        }
        .line-v {
            position: absolute;
            top: 0;
            width: 3px;
            height: 100%;
            background: #5a3817;
        }
        .line-slash1 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: #5a3817;
            transform: rotate(45deg);
            transform-origin: top left;
        }
        .line-slash2 {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 3px;
            background: #5a3817;
            transform: rotate(-45deg);
            transform-origin: top right;
        }
        /* 九个落子点位 */
        .point {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .empty {
            border: 2px solid #774e28;
            background: transparent;
        }
        .big-piece {
            background: #222;
            color: #fff;
            font-size: 14px;
        }
        .small-piece {
            background: #c43131;
            color: #fff;
            font-size: 12px;
        }
        .tip-box {
            margin-top: 20px;
            width: 360px;
            padding: 12px;
            background: #fff;
            border-radius: 8px;
            border: 1px solid #e0cdb0;
        }
        .tip-title {
            font-weight: bold;
            color: #8b4513;
            margin-bottom: 8px;
        }
        .btn-group {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        button {
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            background: #a06c34;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #8b5a2b;
        }
    </style>
</head>
<body>
    <h1 class="title">童年米字挑棋</h1>
    <p class="desc">复刻儿时路边民间小游戏，一人操控中心大子，一人操控四周小子，重温简单纯粹的童年快乐</p>

    <div class="container">
        <div id="board">
            <!-- 棋盘横竖米字线 -->
            <div class="line-h" style="top: 120px;"></div>
            <div class="line-h" style="top: 240px;"></div>
            <div class="line-v" style="left: 120px;"></div>
            <div class="line-v" style="left: 240px;"></div>
            <div class="line-slash1"></div>
            <div class="line-slash2"></div>
        </div>
    </div>

    <div class="tip-box">
        <div class="tip-title">游戏规则</div>
        <p>1. 黑色大子：先手，每次沿线走一步；走到两颗小子中间可直接挑掉双子</p>
        <p>2. 红色小子：后手，每次沿线走一步</p>
        <p>3. 胜利条件：大子吃光所有小子获胜；小子困住大子无路可走则获胜</p>
        <p id="status">当前回合：黑方（大子）</p>
    </div>

    <div class="btn-group">
        <button onclick="resetGame()">重新开局</button>
    </div>

    <script>
        // 九个点位坐标 左上/中上/右上/左中/中心/右中/左下/中下/右下
        const pointsPos = [
            {x: 0, y: 0},
            {x: 180, y: 0},
            {x: 360, y: 0},
            {x: 0, y: 180},
            {x: 180, y: 180},
            {x: 360, y: 180},
            {x: 0, y: 360},
            {x: 180, y: 360},
            {x: 360, y: 360},
        ];
        // 初始布局：中心大子，其余8个小子
        let pieceData = [1, 2, 2, 2, 0, 2, 2, 2, 2];
        // 0空 1大黑棋 2小红棋
        let turn = 1; // 1黑方回合，2红方回合
        const board = document.getElementById('board');
        const statusText = document.getElementById('status');

        // 渲染棋盘
        function renderBoard() {
            board.querySelectorAll('.point').forEach(el => el.remove());
            for(let i=0; i<9; i++){
                const pos = pointsPos[i];
                const div = document.createElement('div');
                div.className = 'point';
                div.style.left = pos.x + 'px';
                div.style.top = pos.y + 'px';
                div.dataset.index = i;
                const type = pieceData[i];
                if(type === 0){
                    div.classList.add('empty');
                }else if(type === 1){
                    div.classList.add('big-piece');
                    div.innerText = "大";
                }else{
                    div.classList.add('small-piece');
                    div.innerText = "小";
                }
                div.onclick = () => clickPoint(i);
                board.appendChild(div);
            }
            statusText.innerText = turn === 1 ? "当前回合：黑方（大子）" : "当前回合：红方（小子）";
        }

        // 重置游戏
        function resetGame() {
            pieceData = [1, 2, 2, 2, 0, 2, 2, 2, 2];
            turn = 1;
            renderBoard();
        }

        // 落子点击逻辑（简易基础走棋，完整挑棋逻辑可在此扩展）
        let selectIdx = -1;
        function clickPoint(idx) {
            const type = pieceData[idx];
            // 选中己方棋子
            if(type === turn){
                selectIdx = idx;
                return;
            }
            // 选中空位，执行移动
            if(selectIdx !== -1 && type === 0){
                pieceData[idx] = pieceData[selectIdx];
                pieceData[selectIdx] = 0;
                selectIdx = -1;
                turn = turn === 1 ? 2 : 1;
            }
            renderBoard();
        }

        // 初始化渲染
        renderBoard();
    </script>
</body>
</html>
