<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>替我去远方</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- 落地页 -->
    <section id="screen-landing" class="screen active">
      <div class="landing-bg">
        <img src="assets/landing-bg.jpg" alt="">
        <div class="landing-overlay"></div>
      </div>
      <div class="landing-content">
        <div class="landing-tag">情感陪伴 · AI 旅行</div>
        <h1 class="landing-title">替我去远方</h1>
        <p class="landing-subtitle">一个替你去远方的小毛球<br>每天给你寄回一张当地的明信片</p>
        <button class="btn-primary" onclick="app.goCreate()">开始</button>
      </div>
    </section>

    <!-- 创建分身 -->
    <section id="screen-create" class="screen">
      <div class="create-header">
        <h2>创建你的旅行分身</h2>
        <p>它会替你去看看这个世界</p>
      </div>
      <div class="create-form">
        <div class="avatar-presets">
          <div class="preset-item selected" data-preset="corgi" data-emoji="🐶" data-name="柯基">
            <div class="preset-emoji">🐶</div>
            <div class="preset-name">柯基</div>
          </div>
          <div class="preset-item" data-preset="cat" data-emoji="🐱" data-name="橘猫">
            <div class="preset-emoji">🐱</div>
            <div class="preset-name">橘猫</div>
          </div>
          <div class="preset-item" data-preset="capybara" data-emoji="🦫" data-name="水豚">
            <div class="preset-emoji">🦫</div>
            <div class="preset-name">水豚</div>
          </div>
          <div class="preset-item" data-preset="penguin" data-emoji="🐧" data-name="企鹅">
            <div class="preset-emoji">🐧</div>
            <div class="preset-name">企鹅</div>
          </div>
          <div class="preset-item" data-preset="shiba" data-emoji="🐕" data-name="柴犬">
            <div class="preset-emoji">🐕</div>
            <div class="preset-name">柴犬</div>
          </div>
          <div class="preset-item" data-preset="hamster" data-emoji="🐹" data-name="仓鼠">
            <div class="preset-emoji">🐹</div>
            <div class="preset-name">仓鼠</div>
          </div>
          <div class="preset-item" data-preset="snowleopard" data-emoji="🐆" data-name="雪豹">
            <div class="preset-emoji">🐆</div>
            <div class="preset-name">雪豹</div>
          </div>
          <div class="preset-item" data-preset="otter" data-emoji="🦦" data-name="海獭">
            <div class="preset-emoji">🦦</div>
            <div class="preset-name">海獭</div>
          </div>
        </div>
        <div class="input-group">
          <label>分身昵称</label>
          <input type="text" id="avatar-name" placeholder="给它起个名字" maxlength="8" value="团子">
        </div>
        <button class="btn-primary" onclick="app.createAvatar()">创建分身</button>
      </div>
    </section>

    <!-- 聊天主界面 -->
    <section id="screen-chat" class="screen">
      <div class="chat-header">
        <div class="status-bar">
          <div class="status-avatar" id="chat-avatar">🐶</div>
          <div class="status-info">
            <div class="status-location" id="status-location">在家窝着 · 深圳</div>
            <div class="status-weather" id="status-weather">☀️ 晴 28°C</div>
          </div>
          <button class="mailbox-btn" onclick="app.goMailbox()">📬</button>
        </div>
      </div>
      <div class="chat-messages" id="chat-messages">
        <!-- 消息会动态插入 -->
      </div>
      <div class="chat-shortcuts" id="chat-shortcuts">
        <button onclick="app.sendShortcut('where')">你在哪</button>
        <button onclick="app.sendShortcut('view')">窗外什么样</button>
        <button onclick="app.sendShortcut('today')">今天去哪</button>
        <button onclick="app.sendShortcut('tired')">累不累</button>
      </div>
      <div class="chat-input-bar">
        <input type="text" id="chat-input" placeholder="问问 TA 在哪..." maxlength="50">
        <button onclick="app.sendMessage()">发送</button>
      </div>
    </section>

    <!-- 信箱 -->
    <section id="screen-mailbox" class="screen">
      <div class="mailbox-header">
        <button class="back-btn" onclick="app.goChat()">← 返回</button>
        <h2>远方信箱</h2>
      </div>
      <div class="mailbox-tabs">
        <button class="tab-btn active" data-tab="photos" onclick="app.switchTab('photos')">实拍图</button>
        <button class="tab-btn" data-tab="diaries" onclick="app.switchTab('diaries')">日记</button>
        <button class="tab-btn" data-tab="timeline" onclick="app.switchTab('timeline')">时间线</button>
      </div>
      <div class="mailbox-content" id="mailbox-content">
        <!-- 内容动态插入 -->
      </div>
    </section>

    <!-- 图片查看器 -->
    <div id="image-viewer" class="image-viewer" onclick="app.closeViewer()">
      <img id="viewer-img" src="" alt="">
      <div class="viewer-caption" id="viewer-caption"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
