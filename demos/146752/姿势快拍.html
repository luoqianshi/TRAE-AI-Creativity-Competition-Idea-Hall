<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>姿势快拍</title>
  <style>
    :root {
      --bg: #f9f6f2;
      --card-bg: #e8d7c7;
      --text: #5a4a42;
      --accent: #c19a75;
      --border: #d9c8b5;
      --shadow: rgba(0, 0, 0, 0.05);
      --transition: all 0.2s ease;
    }

    .dark-theme {
      --bg: #2d2d2d;
      --card-bg: #3a3a3a;
      --text: #e0d9d1;
      --accent: #a88a6a;
      --border: #4a4a4a;
      --shadow: rgba(0, 0, 0, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 1.5rem 1rem;
      transition: var(--transition);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-weight: 700;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--accent), #b58a6c);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      font-size: 1rem;
      opacity: 0.8;
      max-width: 500px;
      margin: 0 auto;
    }

    .demo-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 1.8rem;
      box-shadow: 0 4px 12px var(--shadow);
      margin-bottom: 2rem;
      transition: var(--transition);
      border: 1px solid var(--border);
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-title svg {
      width: 1.4rem;
      height: 1.4rem;
      fill: var(--accent);
    }

    .pose-preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      margin: 1.5rem 0;
    }

    .pose-visual {
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      flex-shrink: 0;
    }

    .pose-visual svg {
      width: 80px;
      height: 80px;
      fill: var(--accent);
    }

    .pose-text {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 500;
      line-height: 1.5;
      max-width: 400px;
    }

    .countdown {
      font-size: 3.2rem;
      font-weight: 700;
      text-align: center;
      margin: 1.5rem 0;
      height: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      transition: transform 0.15s ease;
    }

    .countdown.active {
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.03); }
    }

    .status-message {
      text-align: center;
      font-size: 1.2rem;
      font-weight: 600;
      margin-top: 1rem;
      min-height: 1.8rem;
      color: #4a7c59;
      display: none;
    }

    .status-message.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .action-btn {
      display: block;
      width: 100%;
      padding: 0.9rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      margin: 1.5rem auto 0;
      transition: var(--transition);
      max-width: 320px;
    }

    .action-btn:hover:not(:disabled) {
      background: #b58a6c;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .action-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .action-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .pose-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 1rem;
      margin-top: 2rem;
    }

    .pose-item {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      padding: 0.8rem;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid var(--border);
    }

    .pose-item:hover:not(.active) {
      background: rgba(255, 255, 255, 0.4);
      transform: translateY(-3px);
    }

    .pose-item.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .pose-item svg {
      width: 28px;
      height: 28px;
      margin-bottom: 0.4rem;
      fill: currentColor;
    }

    .pose-item span {
      font-size: 0.85rem;
      font-weight: 500;
    }

    .theme-toggle {
      position: fixed;
      top: 1.2rem;
      right: 1.2rem;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 100;
      transition: var(--transition);
      box-shadow: 0 2px 6px var(--shadow);
    }

    .theme-toggle:hover {
      transform: scale(1.05);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      fill: var(--text);
    }

    /* Responsive */
    @media (max-width: 600px) {
      body {
        padding: 1.2rem 0.8rem;
      }
      .demo-card {
        padding: 1.4rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      .countdown {
        font-size: 2.6rem;
      }
      .pose-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 420px) {
      .pose-grid {
        grid-template-columns: 1fr;
      }
      .countdown {
        font-size: 2.2rem;
      }
      .action-btn {
        padding: 0.8rem;
      }
    }

    /* SVG Icons (inline) */
    .icon-sun { fill: #fbbf24; }
    .icon-moon { fill: #94a3b8; }
  </style>
</head>
<body>
  <div class="theme-toggle" id="themeToggle">
    <svg viewBox="0 0 24 24" class="icon-sun"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.162a.75.75 0 00-1.042-.853l-2.5-1.042a.75.75 0 00-1.416.853l2.5 1.042a.75.75 0 001.042.853zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 00-1.042.853l-2.5 1.042a.75.75 0 001.416.853l2.5-1.042a.75.75 0 001.042-.853zM12 18a.75.75 0 01-.75.75H9.75a.75.75 0 010-1.5H12a.75.75 0 01.75.75zM7.758 17.303a.75.75 0 00-1.042.853l-2.5 1.042a.75.75 0 001.416.853l2.5-1.042a.75.75 0 001.042-.853zM6 12a.75.75 0 01-.75.75H3.75a.75.75 0 010-1.5H6a.75.75 0 01.75.75zM6.253 6.162a.75.75 0 00-1.042-.853l-2.5 1.042a.75.75 0 001.416.853l2.5-1.042z"/></svg>
  </div>

  <div class="container">
    <header>
      <h1>姿势快拍</h1>
      <p class="subtitle">举起手机前3秒，AI帮你自然摆好姿势 · 无需下载 · 立即可用</p>
    </header>

    <main>
      <section class="demo-card">
        <h2 class="card-title">
          <svg viewBox="0 0 24 24"><path d="M15.5 10.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM9.5 10.75a.75.75 0 000 1.5h5a.75.75 0 000-1.5h-5z"/></svg>
          当前建议
        </h2>
        <div class="pose-preview">
          <div class="pose-visual">
            <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="3"/><path d="M30 40 Q50 25 70 40" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="40" cy="35" r="3" fill="currentColor"/><circle cx="60" cy="35" r="3" fill="currentColor"/><path d="M35 65 Q50 75 65 65" stroke="currentColor" stroke-width="2" fill="none"/></svg>
          </div>
          <p class="pose-text" id="poseText">左手抬高一点，右脚往前半步，微笑时嘴角微提</p>
        </div>
        <div class="countdown" id="countdown">3</div>
        <div class="status-message" id="statusMessage">✓ 姿势就绪！</div>
        <button class="action-btn" id="startBtn">开始引导</button>
      </section>

      <section class="demo-card">
        <h2 class="card-title">
          <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M2.25 12c0-5.383 4.367-9.75 9.75-9.75s9.75 4.367 9.75 9.75-4.367 9.75-9.75 9.75S2.25 17.383 2.25 12z"/></svg>
          切换拍摄场景
        </h2>
        <div class="pose-grid">
          <div class="pose-item active" data-scene="travel">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2"/></svg>
            <span>旅行打卡</span>
          </div>
          <div class="pose-item" data-scene="dining">
            <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-5.18 2.67L8.9 13.75 4 9.27l6.91-1.01L12 2z"/></svg>
            <span>聚餐合影</span>
          </div>
          <div class="pose-item" data-scene="birthday">
            <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-5.18 2.67L8.9 13.75 4 9.27l6.91-1.01L12 2z"/></svg>
            <span>生日蛋糕</span>
          </div>
          <div class="pose-item" data-scene="group">
            <svg viewBox="0 0 24 24"><path d="M16 7c0-.55-.45-1-1-1s-1 .45-1 1 .45 1 1 1 1-.45 1-1zm-6 7c0-.55-.45-1-1-1s-1 .45-1 1 .45 1 1 1 1-.45 1-1zm-3-10c0-.55.45-1 1-1h14c.55 0 1 .45 1 1v16c0 .55-.45 1-1 1H4c-.55 0-1-.45-1-1V7zm16 16H4V7h16v10z"/></svg>
            <span>全家合影</span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    // 主题切换
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;
    
    if (localStorage.getItem('theme') === 'dark') {
      body.classList.add('dark-theme');
      themeToggle.innerHTML = '<svg viewBox="0 0 24 24" class="icon-moon"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.162a.75.75 0 00-1.042-.853l-2.5-1.042a.75.75 0 00-1.416.853l2.5 1.042a.75.75 0 001.042.853zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 00-1.042.853l-2.5 1.042a.75.75 0 001.416.853l2.5-1.042a.75.75 0 001.042-.853zM12 18a.75.75 0 01-.75.75H9.75a.75.75 0 010-1.5H12a.75.75 0 01.75.75zM7.758 17.303a.75.75 0 00-1.042.853l-2.5 1.042a.75.75 0 001.416.853l2.5-1.042a.75.75 0 001.042-.853zM6 12a.75.75 0 01-.75.75H3.75a.75.75 0 010-1.5H6a.75.75 0 01.75.75zM6.253 6.162a.75.75 0 00-1.042-.853l-2.5 1.042a.75.75 0 001.416.853l2.5-1.042z"/></svg>';
    } else {
      themeToggle.innerHTML = '<svg viewBox="0 0 24 24" class="icon-sun"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.162a.75.75 0 00-1.042-.853l-2.5-1.042a.75.75 0 00-1.416.853l2.5 1.042a.75.75 0 001.042.853zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 00-1.042.853l-2.5 1.042a.75.75 0 001.416.853l2.5-1.042a.75.75 0 001.042-.853zM12 18a.75.75 0 01-.75.75H9.75a.75.75 0 010-1.5H12a.75.75 0 01.75.75zM7.758 17.303a.75.75 0 00-1.042.853l-2.5 1.042a.75.75 0 001.416.853l2.5-1.042a.75.75 0 001.042-.853zM6 12a.75.75 0 01-.75.75H3.75a.75.75 0 010-1.5H6a.75.75 0 01.75.75zM6.253 6.162a.75.75 0 00-1.042-.853l-2.5 1.042a.75.75 0 001.416.853l2.5-1.042z"/></svg>';
    }

    themeToggle.addEventListener('click', () => {
      if (body.classList.contains('dark-theme')) {
        body.classList.remove('dark-theme');
        localStorage.setItem('theme', 'light');
        themeToggle.innerHTML = '<svg viewBox="0 0 24 24" class="icon-sun"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.162a.75.75 0 00-1.042-.853l-2.5-1.042a.75.75 0 00-1.416.853l2.5 1.042a.75.75 0 001.042.853zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 00-1.042.853l-2.5 1.042a.75.75 0 001.416.853l2.5-1.042a.75.75 0 001.042-.853zM12 18a.75.75 0 01-.75.75H9.75a.75.75 0 010-1.5H12a.75.75 0 01.75.75zM7.758 17.303a.75.75 0 00-1.042.853l-2.5 1.042a.75.75 0 001.416.853l2.5-1.042a.75.75 0 001.042-.853zM6 12a.75.75 0 01-.75.75H3.75a.75.75 0 010-1.5H6a.75.75 0 01.75.75zM6.253 6.162a.75.75 0 00-1.042-.853l-2.5 1.042a.75.75 0 001.416.853l2.5-1.042z"/></svg>';
      } else {
        body.classList.add('dark-theme');
        localStorage.setItem('theme', 'dark');
        themeToggle.innerHTML = '<svg viewBox="0 0 24 24" class="icon-moon"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.162a.75.75 0 00-1.042-.853l-2.5-1.042a.75.75 0 00-1.416.853l2.5 1.042a.75.75 0 001.042.853zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 00-1.042.853l-2.5 1.042a.75.75 0 001.416.853l2.5-1.042a.75.75 0 001.042-.853zM12 18a.75.75 0 01-.75.75H9.75a.75.75 0 010-1.5H12a.75.75 0 01.75.75zM7.758 17.303a.75.75 0 00-1.042.853l-2.5 1.042a.75.75 0 001.416.853l2.5-1.042a.75.75 0 001.042-.853zM6 12a.75.75 0 01-.75.75H3.75a.75.75 0 010-1.5H6a.75.75 0 01.75.75zM6.253 6.162a.75.75 0 00-1.042-.853l-2.5 1.042a.75.75 0 001.416.853l2.5-1.042z"/></svg>';
      }
    });

    // 场景切换
    const poseItems = document.querySelectorAll('.pose-item');
    const poseText = document.getElementById('poseText');
    const poseVisual = document.querySelector('.pose-visual svg');

    const scenes = {
      travel: {
        text: "左手抬高一点，右脚往前半步，微笑时嘴角微提",
        svg: '<circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="3"/><path d="M30 40 Q50 25 70 40" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="40" cy="35" r="3" fill="currentColor"/><circle cx="60" cy="35" r="3" fill="currentColor"/><path d="M35 65 Q50 75 65 65" stroke="currentColor" stroke-width="2" fill="none"/>'
      },
      dining: {
        text: "双臂自然垂落，肩膀放松下沉，下巴微收显下颌线",
        svg: '<circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="3"/><path d="M35 45 Q50 40 65 45" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="40" cy="35" r="3" fill="currentColor"/><circle cx="60" cy="35" r="3" fill="currentColor"/><path d="M45 70 Q50 75 55 70" stroke="currentColor" stroke-width="2" fill="none"/>'
      },
      birthday: {
        text: "双手捧住蛋糕边缘，身体稍前倾，眼睛看向镜头笑",
        svg: '<circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="3"/><path d="M30 55 Q50 45 70 55" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="40" cy="35" r="3" fill="currentColor"/><circle cx="60" cy="35" r="3" fill="currentColor"/><path d="M40 65 Q50 70 60 65" stroke="currentColor" stroke-width="2" fill="none"/>'
      },
      group: {
        text: "前排蹲姿，后排站立错开，手搭同伴肩部自然放松",
        svg: '<circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="3"/><path d="M30 45 Q50 35 70 45" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="40" cy="35" r="3" fill="currentColor"/><circle cx="60" cy="35" r="3" fill="currentColor"/><path d="M35 60 Q50 65 65 60" stroke="currentColor" stroke-width="2" fill="none"/>'
      }
    };

    poseItems.forEach(item => {
      item.addEventListener('click', () => {
        poseItems.forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        const scene = item.dataset.scene;
        poseText.textContent = scenes[scene].text;
        poseVisual.innerHTML = scenes[scene].svg;
      });
    });

    // 3秒倒计时交互
    const countdownEl = document.getElementById('countdown');
    const statusMessage = document.getElementById('statusMessage');
    const startBtn = document.getElementById('startBtn');

    startBtn.addEventListener('click', () => {
      startBtn.disabled = true;
      countdownEl.textContent = '3';
      countdownEl.className = 'countdown active';
      statusMessage.classList.remove('show');

      let count = 3;
      const timer = setInterval(() => {
        count--;
        countdownEl.textContent = count;
        if (count === 0) {
          clearInterval(timer);
          countdownEl.className = 'countdown';
          statusMessage.classList.add('show');
          setTimeout(() => {
            startBtn.disabled = false;
          }, 1500);
        }
      }, 1000);
    });

    // 初始化默认场景
    document.querySelector('[data-scene="travel"]').click();
  </script>
</body>
</html>
