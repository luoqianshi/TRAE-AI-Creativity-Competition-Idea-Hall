<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机抽签小工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
            background: #0f0c29;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* 背景粒子 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* 标题区 */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #ff6b6b);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease infinite;
            letter-spacing: 4px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header p {
            color: rgba(255,255,255,0.6);
            margin-top: 10px;
            font-size: 1rem;
        }

        /* 主卡片 */
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        /* 输入区 */
        .input-section h2 {
            font-size: 1.2rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-section h2::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, #ff6b6b, #feca57);
            border-radius: 2px;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .input-wrapper input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 14px;
            background: rgba(0,0,0,0.2);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-wrapper input::placeholder {
            color: rgba(255,255,255,0.35);
        }

        .input-wrapper input:focus {
            border-color: #feca57;
            background: rgba(0,0,0,0.3);
            box-shadow: 0 0 20px rgba(254, 202, 87, 0.15);
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            color: #1a1a2e;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
        }

        .btn-danger {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.3);
        }

        .btn-danger:hover {
            background: rgba(231, 76, 60, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: #fff;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 184, 148, 0.4);
        }

        /* 快捷操作 */
        .quick-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .quick-actions .btn {
            padding: 10px 18px;
            font-size: 0.9rem;
        }

        /* 候选项列表 */
        .items-section {
            margin-top: 20px;
        }

        .items-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .items-header h2 {
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .items-header h2::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, #48dbfb, #ff9ff3);
            border-radius: 2px;
        }

        .item-count {
            background: rgba(255,255,255,0.1);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.7);
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .item-tag {
            position: relative;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            padding: 14px 18px;
            text-align: center;
            font-size: 1rem;
            transition: all 0.3s ease;
            cursor: default;
            word-break: break-all;
        }

        .item-tag:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }

        .item-tag.active {
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            color: #1a1a2e;
            border-color: transparent;
            font-weight: 700;
            transform: scale(1.08);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.5);
            z-index: 2;
        }

        .item-tag.winner {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: #fff;
            border-color: transparent;
            font-weight: 700;
            transform: scale(1.15);
            box-shadow: 0 8px 30px rgba(0, 184, 148, 0.6);
            z-index: 2;
            animation: winnerPulse 1s ease infinite alternate;
        }

        @keyframes winnerPulse {
            from { box-shadow: 0 8px 30px rgba(0, 184, 148, 0.6); }
            to { box-shadow: 0 8px 40px rgba(0, 206, 201, 0.9); }
        }

        .item-tag .remove-btn {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 20px;
            height: 20px;
            background: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 50%;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .item-tag:hover .remove-btn {
            opacity: 1;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: rgba(255,255,255,0.4);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* 抽签按钮区 */
        .draw-section {
            text-align: center;
            margin-top: 32px;
        }

        .draw-btn {
            font-size: 1.4rem;
            padding: 18px 60px;
            border-radius: 50px;
            background: linear-gradient(135deg, #ff6b6b, #feca57, #ff9ff3);
            background-size: 200% 200%;
            color: #1a1a2e;
            font-weight: 700;
            letter-spacing: 4px;
            animation: gradientShift 3s ease infinite;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .draw-btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 40px rgba(255, 107, 107, 0.5);
        }

        .draw-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .draw-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(255,255,255,0.3) 50%,
                transparent 70%
            );
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .draw-btn:hover:not(:disabled)::after {
            transform: translateX(100%);
        }

        /* 结果弹窗 */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }

        .result-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .result-modal {
            text-align: center;
            padding: 40px;
            transform: scale(0.8);
            transition: transform 0.4s ease;
        }

        .result-overlay.show .result-modal {
            transform: scale(1);
        }

        .result-label {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 20px;
            letter-spacing: 8px;
        }

        .result-text {
            font-size: 4rem;
            font-weight: 700;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 2s ease infinite;
            margin-bottom: 30px;
            word-break: break-all;
            max-width: 80vw;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: confettiFall 3s ease-out forwards;
        }

        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* 历史记录 */
        .history-section {
            margin-top: 20px;
        }

        .history-section h2 {
            font-size: 1.2rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .history-section h2::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, #a29bfe, #fd79a8);
            border-radius: 2px;
        }

        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .history-item {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
        }

        .history-item .round {
            color: #feca57;
            font-weight: 600;
            margin-right: 6px;
        }

        /* 设置 */
        .settings-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .setting-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .setting-item label {
            color: rgba(255,255,255,0.7);
            font-size: 0.95rem;
        }

        .setting-item input[type="number"] {
            width: 70px;
            padding: 8px 12px;
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            background: rgba(0,0,0,0.2);
            color: #fff;
            font-size: 1rem;
            outline: none;
            text-align: center;
        }

        .setting-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #feca57;
            cursor: pointer;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .header h1 { font-size: 2rem; }
            .result-text { font-size: 2.5rem; }
            .items-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
            .card { padding: 20px; }
            .draw-btn { padding: 16px 40px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <!-- 背景粒子 -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <!-- 标题 -->
        <div class="header">
            <h1>随机抽签</h1>
            <p>输入候选项，点击开始，让命运来决定！</p>
        </div>

        <!-- 输入区 -->
        <div class="card">
            <div class="input-section">
                <h2>添加选项</h2>
                <div class="input-wrapper">
                    <input type="text" id="itemInput" placeholder="输入选项后按回车添加..." maxlength="50">
                    <button class="btn btn-primary" onclick="addItem()">添加</button>
                </div>
                <div class="quick-actions">
                    <button class="btn btn-secondary" onclick="loadExample('names')">示例：人名</button>
                    <button class="btn btn-secondary" onclick="loadExample('prizes')">示例：奖品</button>
                    <button class="btn btn-secondary" onclick="loadExample('food')">示例：今天吃什么</button>
                    <button class="btn btn-danger" onclick="clearAll()">清空全部</button>
                </div>
            </div>

            <!-- 候选项 -->
            <div class="items-section">
                <div class="items-header">
                    <h2>候选项</h2>
                    <span class="item-count" id="itemCount">共 0 项</span>
                </div>
                <div class="items-grid" id="itemsGrid">
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="3" y="3" width="18" height="18" rx="4"/>
                            <path d="M12 8v8M8 12h8"/>
                        </svg>
                        <p>暂无候选项，请添加后抽签</p>
                    </div>
                </div>
            </div>

            <!-- 设置 -->
            <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
                <h2 style="font-size: 1.1rem; margin-bottom: 12px;">设置</h2>
                <div class="settings-row">
                    <div class="setting-item">
                        <label>动画速度(ms)</label>
                        <input type="number" id="speedInput" value="80" min="20" max="500" step="10">
                    </div>
                    <div class="setting-item">
                        <input type="checkbox" id="removeWinner" checked>
                        <label for="removeWinner">抽中后移除</label>
                    </div>
                    <div class="setting-item">
                        <input type="checkbox" id="soundEnabled">
                        <label for="soundEnabled">音效</label>
                    </div>
                </div>
            </div>

            <!-- 抽签按钮 -->
            <div class="draw-section">
                <button class="draw-btn" id="drawBtn" onclick="startDraw()">开始抽签</button>
            </div>
        </div>

        <!-- 历史记录 -->
        <div class="card" id="historyCard" style="display: none;">
            <div class="history-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <h2>抽签历史</h2>
                    <button class="btn btn-secondary" style="padding: 8px 16px; font-size: 0.85rem;" onclick="clearHistory()">清空历史</button>
                </div>
                <div class="history-list" id="historyList"></div>
            </div>
        </div>
    </div>

    <!-- 结果弹窗 -->
    <div class="result-overlay" id="resultOverlay" onclick="closeResult()">
        <div class="result-modal" onclick="event.stopPropagation()">
            <div class="result-label">抽签结果</div>
            <div class="result-text" id="resultText">?</div>
            <button class="btn btn-success" style="padding: 14px 40px; font-size: 1.1rem;" onclick="closeResult()">确定</button>
        </div>
    </div>

    <script>
        // ==================== 数据 ====================
        let items = [];
        let history = [];
        let isDrawing = false;
        let drawRound = 0;

        const examples = {
            names: ['张三', '李四', '王五', '赵六', '孙七', '周八', '吴九', '郑十'],
            prizes: ['一等奖：iPhone 16', '二等奖：iPad Air', '三等奖：AirPods', '幸运奖：保温杯', '幸运奖：充电宝', '幸运奖：数据线'],
            food: ['火锅', '烧烤', '麻辣烫', '日料', '韩餐', ' Pizza', '汉堡', '轻食沙拉', '兰州拉面', '黄焖鸡']
        };

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
            document.getElementById('itemInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addItem();
            });
        });

        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 15 + 's';
                p.style.animationDuration = (10 + Math.random() * 10) + 's';
                p.style.width = (2 + Math.random() * 4) + 'px';
                p.style.height = p.style.width;
                container.appendChild(p);
            }
        }

        // ==================== 选项管理 ====================
        function addItem() {
            const input = document.getElementById('itemInput');
            const text = input.value.trim();
            if (!text) return;

            // 支持逗号/换行分隔批量添加
            const newItems = text.split(/[,，\n]/).map(s => s.trim()).filter(s => s);
            let added = 0;
            for (const item of newItems) {
                if (!items.includes(item)) {
                    items.push(item);
                    added++;
                }
            }

            if (added > 0) {
                input.value = '';
                renderItems();
                playSound('add');
            }
        }

        function removeItem(index) {
            if (isDrawing) return;
            items.splice(index, 1);
            renderItems();
        }

        function clearAll() {
            if (isDrawing) return;
            if (items.length === 0) return;
            if (!confirm('确定要清空所有候选项吗？')) return;
            items = [];
            renderItems();
        }

        function loadExample(type) {
            if (isDrawing) return;
            items = [...examples[type]];
            renderItems();
        }

        function renderItems() {
            const grid = document.getElementById('itemsGrid');
            const count = document.getElementById('itemCount');
            count.textContent = `共 ${items.length} 项`;

            if (items.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="3" y="3" width="18" height="18" rx="4"/>
                            <path d="M12 8v8M8 12h8"/>
                        </svg>
                        <p>暂无候选项，请添加后抽签</p>
                    </div>`;
                return;
            }

            grid.innerHTML = items.map((item, i) => `
                <div class="item-tag" data-index="${i}" id="item-${i}">
                    ${escapeHtml(item)}
                    <button class="remove-btn" onclick="removeItem(${i})" title="移除">×</button>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ==================== 抽签逻辑 ====================
        function startDraw() {
            if (isDrawing) return;
            if (items.length < 2) {
                alert('请至少添加 2 个候选项！');
                return;
            }

            isDrawing = true;
            drawRound++;
            const btn = document.getElementById('drawBtn');
            btn.disabled = true;
            btn.textContent = '抽签中...';

            const speed = parseInt(document.getElementById('speedInput').value) || 80;
            const totalSteps = 25 + Math.floor(Math.random() * 10);
            let step = 0;
            let lastIndex = -1;

            const interval = setInterval(() => {
                // 清除上一个高亮
                if (lastIndex >= 0) {
                    const el = document.getElementById(`item-${lastIndex}`);
                    if (el) el.classList.remove('active');
                }

                // 随机选一个
                const index = Math.floor(Math.random() * items.length);
                const el = document.getElementById(`item-${index}`);
                if (el) el.classList.add('active');
                lastIndex = index;

                playSound('tick');
                step++;

                // 动态减速
                if (step > totalSteps - 8) {
                    clearInterval(interval);
                    const slowInterval = setInterval(() => {
                        if (lastIndex >= 0) {
                            const prev = document.getElementById(`item-${lastIndex}`);
                            if (prev) prev.classList.remove('active');
                        }
                        const idx = Math.floor(Math.random() * items.length);
                        const cur = document.getElementById(`item-${idx}`);
                        if (cur) cur.classList.add('active');
                        lastIndex = idx;
                        playSound('tick');

                        step++;
                        if (step >= totalSteps) {
                            clearInterval(slowInterval);
                            finishDraw(lastIndex);
                        }
                    }, speed * 2.5);
                }
            }, speed);
        }

        function finishDraw(winnerIndex) {
            const winner = items[winnerIndex];
            const winnerEl = document.getElementById(`item-${winnerIndex}`);
            if (winnerEl) {
                winnerEl.classList.remove('active');
                winnerEl.classList.add('winner');
            }

            // 记录历史
            history.unshift({ round: drawRound, item: winner });
            renderHistory();

            // 播放胜利音效
            playSound('win');

            // 创建彩纸
            createConfetti();

            // 显示结果弹窗（延迟一点）
            setTimeout(() => {
                showResult(winner);

                // 是否移除
                const removeWinner = document.getElementById('removeWinner').checked;
                if (removeWinner) {
                    items.splice(winnerIndex, 1);
                }

                isDrawing = false;
                const btn = document.getElementById('drawBtn');
                btn.disabled = false;
                btn.textContent = '开始抽签';

                if (!removeWinner) {
                    setTimeout(() => {
                        if (winnerEl) winnerEl.classList.remove('winner');
                    }, 2000);
                } else {
                    renderItems();
                }
            }, 500);
        }

        function showResult(text) {
            document.getElementById('resultText').textContent = text;
            document.getElementById('resultOverlay').classList.add('show');
        }

        function closeResult() {
            document.getElementById('resultOverlay').classList.remove('show');
        }

        // ==================== 历史记录 ====================
        function renderHistory() {
            const card = document.getElementById('historyCard');
            const list = document.getElementById('historyList');

            if (history.length === 0) {
                card.style.display = 'none';
                return;
            }

            card.style.display = 'block';
            list.innerHTML = history.map(h => `
                <div class="history-item">
                    <span class="round">第${h.round}轮</span>
                    ${escapeHtml(h.item)}
                </div>
            `).join('');
        }

        function clearHistory() {
            history = [];
            drawRound = 0;
            renderHistory();
        }

        // ==================== 彩纸效果 ====================
        function createConfetti() {
            const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#00b894', '#fd79a8', '#a29bfe'];
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const c = document.createElement('div');
                    c.className = 'confetti';
                    c.style.left = Math.random() * 100 + '%';
                    c.style.background = colors[Math.floor(Math.random() * colors.length)];
                    c.style.width = (5 + Math.random() * 8) + 'px';
                    c.style.height = (5 + Math.random() * 8) + 'px';
                    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    c.style.animationDuration = (2 + Math.random() * 2) + 's';
                    document.getElementById('resultOverlay').appendChild(c);
                    setTimeout(() => c.remove(), 4000);
                }, i * 30);
            }
        }

        // ==================== 音效（Web Audio API） ====================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!document.getElementById('soundEnabled').checked) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'tick') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.05);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'win') {
                // 胜利和弦
                [523, 659, 784, 1047].forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'sine';
                    o.frequency.value = freq;
                    g.gain.setValueAtTime(0, now + i * 0.1);
                    g.gain.linearRampToValueAtTime(0.1, now + i * 0.1 + 0.02);
                    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.4);
                    o.start(now + i * 0.1);
                    o.stop(now + i * 0.1 + 0.4);
                });
            } else if (type === 'add') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(900, now + 0.1);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            }
        }

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeResult();
            if (e.key === ' ' && document.activeElement.tagName !== 'INPUT') {
                e.preventDefault();
                startDraw();
            }
        });
    </script>
</body>
</html>
