<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
      name="description"
      content="RNovModularDB is a Rust modular database engine shown through an interactive memory, disk, and hybrid residency journey."
  />
  <link rel="icon" type="image/svg+xml" href="https://rnmdb.aperip.com/rnov-logo.svg" />
  <title>RNovModularDB | Interactive Engine Journey</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src https://rnmdb.aperip.com; img-src data:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0b0f14;
    }

    iframe {
      display: block;
      width: 100vw;
      height: 100vh;
      border: 0;
      background: #0b0f14;
    }

    .fallback {
      position: fixed;
      inset: auto 16px 16px;
      z-index: 1;
      display: inline-flex;
      width: fit-content;
      max-width: calc(100vw - 32px);
      padding: 10px 12px;
      border: 1px solid rgb(255 255 255 / 18%);
      border-radius: 8px;
      color: #f8fafc;
      background: rgb(15 23 42 / 82%);
      font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-decoration: none;
      backdrop-filter: blur(8px);
    }

    @media (max-width: 520px) {
      .fallback {
        right: 10px;
        bottom: 10px;
        left: 10px;
        justify-content: center;
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <iframe
    title="RNov Modular DB"
    src="https://rnmdb.aperip.com/"
    allow="autoplay; clipboard-read; clipboard-write; fullscreen; gamepad; geolocation; microphone; camera; payment; web-share"
    allowfullscreen>
  </iframe>
</body>
</html>
