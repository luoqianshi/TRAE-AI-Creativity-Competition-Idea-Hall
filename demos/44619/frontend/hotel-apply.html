<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酒店管理员入驻申请 - 酒店预订系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-cream: #fefdf7;
            --bg-peach: #fff8f3;
            --card-white: #ffffff;
            --border-soft: #f0e6d8;
            --primary-sunshine: #ffb347;
            --primary-coral: #ff9966;
            --text-warm: #5d4037;
            --text-medium: #8d6e63;
            --text-light: #bdbdbd;
            --radius-soft: 24px;
            --radius-round: 32px;
            --radius-pill: 40px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, var(--bg-cream) 0%, var(--bg-peach) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .register-container {
            background: var(--card-white);
            border-radius: var(--radius-soft);
            padding: 40px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 12px 40px rgba(255, 179, 71, 0.12);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo i {
            font-size: 48px;
            color: var(--primary-sunshine);
        }
        .logo h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 26px;
            margin-top: 12px;
            background: linear-gradient(135deg, var(--text-warm), var(--text-medium));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo p {
            color: var(--text-light);
            font-size: 14px;
            margin-top: 8px;
        }
        
        .form-section {
            background: var(--bg-peach);
            border-radius: var(--radius-soft);
            padding: 20px;
            margin-bottom: 20px;
        }
        .form-section-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: var(--primary-coral);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .form-row.full {
            grid-template-columns: 1fr;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-medium);
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-group label .required {
            color: var(--primary-coral);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-soft);
            border-radius: var(--radius-pill);
            font-size: 14px;
            font-family: 'Nunito', sans-serif;
            background: var(--card-white);
            color: var(--text-warm);
            transition: all 0.3s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-sunshine);
            box-shadow: 0 4px 16px rgba(255, 179, 71, 0.2);
        }
        .form-group textarea {
            border-radius: var(--radius-soft);
            resize: vertical;
            min-height: 80px;
        }
        .form-group select {
            cursor: pointer;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: var(--radius-pill);
            font-size: 16px;
            font-weight: 700;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-sunshine), var(--primary-coral));
            color: white;
            box-shadow: 0 8px 25px rgba(255, 179, 71, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(255, 179, 71, 0.5);
        }
        
        .links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }
        .links a {
            color: var(--text-medium);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }
        .links a:hover {
            color: var(--primary-sunshine);
        }
        
        .message {
            padding: 14px 18px;
            border-radius: var(--radius-soft);
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            display: none;
        }
        .message.error {
            background: rgba(255, 183, 178, 0.2);
            color: #c62828;
            display: block;
        }
        .message.success {
            background: rgba(168, 230, 207, 0.3);
            color: #2e7d32;
            display: block;
        }
        
        .notice {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: var(--radius-soft);
            padding: 14px;
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--text-medium);
        }
        .notice i {
            color: #f57f17;
            margin-right: 6px;
        }
        
        @media (max-width: 550px) {
            .register-container { padding: 30px 20px; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <i class="fas fa-hotel"></i>
            <h1>酒店管理员入驻申请</h1>
            <p>提交申请后，超级管理员将在1-3个工作日内完成审核</p>
        </div>
        
        <div id="message"></div>
        
        <div class="notice">
            <i class="fas fa-info-circle"></i>
            请确保填写的信息真实有效，审核通过后将自动创建您的管理员账号
        </div>
        
        <form id="registerForm">
            <div class="form-section">
                <div class="form-section-title">
                    <i class="fas fa-user-circle"></i> 管理员账号信息
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>用户名 <span class="required">*</span></label>
                        <input type="text" id="username" placeholder="设置登录用户名（至少3位）" required>
                    </div>
                    <div class="form-group">
                        <label>密码 <span class="required">*</span></label>
                        <input type="password" id="password" placeholder="设置登录密码（至少6位）" required>
                    </div>
                </div>
            </div>
            
            <div class="form-section">
                <div class="form-section-title">
                    <i class="fas fa-building"></i> 酒店基本信息
                </div>
                <div class="form-row full">
                    <div class="form-group">
                        <label>酒店名称 <span class="required">*</span></label>
                        <input type="text" id="hotel_name" placeholder="请输入酒店全称" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>所在城市 <span class="required">*</span></label>
                        <input type="text" id="city" placeholder="如：北京、上海" required>
                    </div>
                    <div class="form-group">
                        <label>酒店星级 <span class="required">*</span></label>
                        <select id="star_rating" required>
                            <option value="">请选择星级</option>
                            <option value="1">一星级</option>
                            <option value="2">二星级</option>
                            <option value="3">三星级</option>
                            <option value="4">四星级</option>
                            <option value="5">五星级</option>
                        </select>
                    </div>
                </div>
                <div class="form-row full">
                    <div class="form-group">
                        <label>详细地址 <span class="required">*</span></label>
                        <input type="text" id="address" placeholder="请输入酒店详细地址" required>
                    </div>
                </div>
            </div>
            
            <div class="form-section">
                <div class="form-section-title">
                    <i class="fas fa-address-card"></i> 联系人信息
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>联系人姓名 <span class="required">*</span></label>
                        <input type="text" id="contact_name" placeholder="请输入联系人姓名" required>
                    </div>
                    <div class="form-group">
                        <label>联系电话 <span class="required">*</span></label>
                        <input type="tel" id="contact_phone" placeholder="请输入联系电话" required>
                    </div>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary">提交申请</button>
            
            <div class="links">
                <a href="login.html">返回登录</a>
                <span style="color: var(--text-light); margin: 0 10px;">|</span>
                <a href="register.html">用户注册</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const hotel_name = document.getElementById('hotel_name').value.trim();
            const city = document.getElementById('city').value.trim();
            const star_rating = document.getElementById('star_rating').value;
            const address = document.getElementById('address').value.trim();
            const contact_name = document.getElementById('contact_name').value.trim();
            const contact_phone = document.getElementById('contact_phone').value.trim();
            
            // 验证
            if (!username || !password || !hotel_name || !city || !star_rating || !address || !contact_name || !contact_phone) {
                showMessage('请填写所有必填项', 'error');
                return;
            }
            
            if (username.length < 3) {
                showMessage('用户名至少3位', 'error');
                return;
            }
            
            if (password.length < 6) {
                showMessage('密码至少6位', 'error');
                return;
            }
            
            if (!/^1[3-9]\d{9}$/.test(contact_phone)) {
                showMessage('请输入有效的手机号', 'error');
                return;
            }
            
            try {
                const res = await fetch('/api/hotel-applications', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username,
                        password,
                        hotel_name,
                        city,
                        star_rating: parseInt(star_rating),
                        address,
                        contact_name,
                        contact_phone
                    })
                });
                const data = await res.json();
                
                if (data.success) {
                    showMessage('申请已提交，请等待超级管理员审核', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showMessage(data.message || data.error || '提交失败', 'error');
                }
            } catch (e) {
                showMessage('网络错误，请稍后重试', 'error');
                console.error(e);
            }
        });

        function showMessage(msg, type) {
            const div = document.getElementById('message');
            div.className = 'message ' + type;
            div.textContent = msg;
            if (type === 'success') {
                setTimeout(() => { div.style.display = 'none'; }, 5000);
            }
        }
    </script>
</body>
</html>
