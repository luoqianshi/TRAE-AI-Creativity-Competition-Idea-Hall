<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 酒店预订系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-cream: #fefdf7;
            --bg-peach: #fff8f3;
            --card-white: #ffffff;
            --border-soft: #f0e6d8;
            --primary-sunshine: #ffb347;
            --primary-coral: #ff9966;
            --text-warm: #5d4037;
            --text-medium: #8d6e63;
            --text-light: #bdbdbd;
            --radius-soft: 24px;
            --radius-pill: 40px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, var(--bg-cream) 0%, var(--bg-peach) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .register-container {
            background: var(--card-white);
            border-radius: var(--radius-soft);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 12px 40px rgba(255, 179, 71, 0.12);
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo i { font-size: 48px; color: var(--primary-sunshine); }
        .logo h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 26px;
            margin-top: 12px;
            background: linear-gradient(135deg, var(--text-warm), var(--text-medium));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo p { color: var(--text-light); font-size: 14px; margin-top: 8px; }
        
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-medium);
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-group label .required { color: var(--primary-coral); }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-soft);
            border-radius: var(--radius-pill);
            font-size: 14px;
            font-family: 'Nunito', sans-serif;
            background: var(--card-white);
            color: var(--text-warm);
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-sunshine);
            box-shadow: 0 4px 16px rgba(255, 179, 71, 0.2);
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: var(--radius-pill);
            font-size: 16px;
            font-weight: 700;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-sunshine), var(--primary-coral));
            color: white;
            box-shadow: 0 8px 25px rgba(255, 179, 71, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(255, 179, 71, 0.5);
        }
        
        .links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }
        .links a {
            color: var(--text-medium);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }
        .links a:hover { color: var(--primary-sunshine); }
        
        .message {
            padding: 14px 18px;
            border-radius: var(--radius-soft);
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            display: none;
        }
        .message.error { background: rgba(255, 183, 178, 0.2); color: #c62828; display: block; }
        .message.success { background: rgba(168, 230, 207, 0.3); color: #2e7d32; display: block; }
        
        .hotel-admin-link {
            margin-top: 20px;
            padding: 16px;
            background: linear-gradient(135deg, rgba(255, 179, 71, 0.1), rgba(255, 153, 102, 0.1));
            border: 1px dashed var(--primary-sunshine);
            border-radius: var(--radius-soft);
            text-align: center;
        }
        .hotel-admin-link a {
            color: var(--primary-coral);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
        }
        .hotel-admin-link a:hover { text-decoration: underline; }
        .hotel-admin-link i { margin-right: 6px; }
        
        @media (max-width: 550px) {
            .register-container { padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <i class="fas fa-user-plus"></i>
            <h1>User Registration</h1>
            <p>Create your hotel booking account</p>
        </div>
        
        <div id="message"></div>
        
        <form id="registerForm">
            <div class="form-group">
                <label>Username <span class="required">*</span></label>
                <input type="text" id="username" placeholder="At least 3 characters" required>
            </div>
            <div class="form-group">
                <label>Password <span class="required">*</span></label>
                <input type="password" id="password" placeholder="At least 6 characters" required>
            </div>
            <div class="form-group">
                <label>Full Name <span class="required">*</span></label>
                <input type="text" id="full_name" placeholder="Your real name" required>
            </div>
            <div class="form-group">
                <label>Phone <span class="required">*</span></label>
                <input type="tel" id="phone" placeholder="11-digit mobile number" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Optional">
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
            <div class="links">
                <a href="login.html">Have an account? Login</a>
            </div>
        </form>
        
        <div class="hotel-admin-link">
            <a href="hotel-apply.html"><i class="fas fa-hotel"></i>Want to manage a hotel? Apply for Hotel Admin</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const full_name = document.getElementById('full_name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();
            
            if (!username || !password || !full_name || !phone) {
                showMessage('Please fill in all required fields', 'error');
                return;
            }
            if (username.length < 3) { showMessage('Username must be at least 3 characters', 'error'); return; }
            if (password.length < 6) { showMessage('Password must be at least 6 characters', 'error'); return; }
            if (!/^1[3-9]\d{9}$/.test(phone)) { showMessage('Please enter a valid phone number', 'error'); return; }
            
            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, full_name, phone, email })
                });
                const data = await res.json();
                
                if (data.success) {
                    showMessage('Registration successful! Redirecting to login...', 'success');
                    setTimeout(() => location.href = 'login.html', 1500);
                } else {
                    showMessage(data.message || data.error || 'Registration failed', 'error');
                }
            } catch (e) {
                showMessage('Network error', 'error');
                console.error(e);
            }
        });

        function showMessage(msg, type) {
            const div = document.getElementById('message');
            div.className = 'message ' + type;
            div.textContent = msg;
        }
    </script>
</body>
</html>
