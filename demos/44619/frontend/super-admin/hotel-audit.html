<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酒店管理员申请审核</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
    :root {
        --bg-cream: #fefdf7;--bg-peach: #fff8f3;--card-white: #ffffff;--border-soft: #f0e6d8;--primary-sunshine: #ffb347;--primary-coral: #ff9966;--text-warm: #5d4037;--text-medium: #8d6e63;--text-light: #bdbdbd;--radius-soft: 24px;--radius-round: 32px;--radius-pill: 40px;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Nunito','Noto Sans SC',sans-serif;background:linear-gradient(180deg,var(--bg-cream) 0%,var(--bg-peach) 100%);color:var(--text-warm);min-height:100vh;display:flex;}
    .sidebar{width:280px;background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);border-right:1px solid rgba(255,179,71,0.15);padding:24px 0;position:fixed;left:0;top:0;bottom:0;z-index:100;}
    .sidebar-logo{font-family:'Fredoka',sans-serif;font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--primary-sunshine),var(--primary-coral));-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:10px;padding:0 24px 24px;border-bottom:1px solid var(--border-soft);margin-bottom:20px;}
    .sidebar-logo i{color:var(--primary-sunshine);font-size:28px;}
    .sidebar-menu{list-style:none;padding:0 16px;}
    .sidebar-menu li{margin-bottom:8px;}
    .sidebar-menu a{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius-soft);text-decoration:none;color:var(--text-medium);font-weight:600;font-size:15px;transition:all 0.3s;}
    .sidebar-menu a:hover{background:var(--bg-peach);color:var(--primary-sunshine);transform:translateX(4px);}
    .sidebar-menu a.active{background:linear-gradient(135deg,rgba(255,179,71,0.15),rgba(255,153,102,0.15));color:var(--primary-sunshine);}
    .sidebar-menu a i{font-size:18px;width:24px;text-align:center;}
    .sidebar-footer{position:absolute;bottom:24px;left:0;right:0;padding:0 16px;border-top:1px solid var(--border-soft);}
    .sidebar-footer a{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius-soft);text-decoration:none;color:var(--text-light);font-size:14px;transition:all 0.3s;}
    .sidebar-footer a:hover{color:var(--primary-coral);background:rgba(255,183,178,0.1);}
    .main-content{flex:1;margin-left:280px;padding:24px;min-height:100vh;}
    .page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;}
    .page-header h1{font-family:'Fredoka',sans-serif;font-size:32px;font-weight:800;background:linear-gradient(135deg,#5d4037,#8d6e63);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    
    .filter-tabs{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;}
    .filter-tab{padding:10px 24px;border-radius:var(--radius-pill);font-size:14px;font-weight:600;cursor:pointer;border:2px solid var(--border-soft);background:white;color:var(--text-medium);transition:all 0.3s;}
    .filter-tab:hover{border-color:var(--primary-sunshine);color:var(--primary-sunshine);}
    .filter-tab.active{background:linear-gradient(135deg,var(--primary-sunshine),var(--primary-coral));color:white;border-color:transparent;}
    .filter-tab .count{margin-left:6px;padding:2px 8px;border-radius:10px;background:rgba(0,0,0,0.1);font-size:12px;}
    
    .btn{padding:10px 26px;border-radius:var(--radius-pill);text-decoration:none;font-size:15px;font-weight:600;transition:all 0.3s;font-family:'Nunito',sans-serif;border:none;cursor:pointer;}
    .btn-primary{background:linear-gradient(135deg,var(--primary-sunshine),var(--primary-coral));color:white;box-shadow:0 8px 25px rgba(255,179,71,0.4);}
    .btn-primary:hover{transform:translateY(-4px);box-shadow:0 14px 35px rgba(255,179,71,0.5);}
    .btn-outline{border:2px solid var(--border-soft);color:var(--text-medium);background:white;}
    .btn-outline:hover{border-color:var(--primary-sunshine);color:var(--primary-sunshine);transform:translateY(-2px);}
    .content-card{background:var(--card-white);border:1px solid var(--border-soft);border-radius:var(--radius-soft);padding:28px;box-shadow:0 8px 24px rgba(255,179,71,0.06);margin-bottom:20px;}
    .content-card h3{font-family:'Fredoka',sans-serif;font-size:20px;font-weight:700;margin-bottom:24px;display:flex;align-items:center;gap:10px;color:var(--text-warm);}
    .content-card h3 i{color:var(--primary-sunshine);}
    
    .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px;}
    .stat-card{background:linear-gradient(135deg,var(--bg-cream),var(--bg-peach));border:1px solid var(--border-soft);border-radius:var(--radius-soft);padding:20px;text-align:center;}
    .stat-card i{font-size:28px;color:var(--primary-sunshine);margin-bottom:8px;}
    .stat-card .num{font-family:'Fredoka',sans-serif;font-size:28px;font-weight:700;color:var(--text-warm);}
    .stat-card .label{font-size:13px;color:var(--text-medium);margin-top:4px;}
    
    .table{width:100%;border-collapse:collapse;}
    .table th{padding:16px;text-align:left;font-size:13px;color:var(--text-light);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;border-bottom:2px solid var(--border-soft);}
    .table td{padding:16px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
    .table tbody tr:hover{background:var(--bg-peach);}
    
    .status-badge{padding:6px 14px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;display:inline-block;}
    .status-pending{background:rgba(255,215,0,0.2);color:#f57f17;}
    .status-approved{background:rgba(168,230,207,0.2);color:#2e7d32;}
    .status-rejected{background:rgba(255,183,178,0.2);color:#c62828;}
    
    .action-buttons{display:flex;gap:8px;}
    .action-btn{padding:8px 16px;border-radius:var(--radius-pill);font-size:13px;font-weight:600;text-decoration:none;transition:all 0.3s;border:none;cursor:pointer;}
    .action-btn.approve{background:rgba(168,230,207,0.2);color:#2e7d32;}
    .action-btn.approve:hover{background:rgba(168,230,207,0.4);transform:translateY(-2px);}
    .action-btn.reject{background:rgba(255,183,178,0.2);color:#c62828;}
    .action-btn.reject:hover{background:rgba(255,183,178,0.4);transform:translateY(-2px);}
    
    .detail-section{background:var(--bg-peach);border-radius:var(--radius-soft);padding:16px;margin-top:12px;font-size:13px;}
    .detail-section .row{display:flex;gap:16px;margin-bottom:8px;}
    .detail-section .row:last-child{margin-bottom:0;}
    .detail-section .label{color:var(--text-medium);min-width:80px;}
    .detail-section .value{color:var(--text-warm);font-weight:500;}
    
    .empty-state{text-align:center;padding:60px;color:var(--text-light);}
    .empty-state i{font-size:64px;margin-bottom:20px;color:var(--border-soft);}
    .empty-state p{font-size:16px;}
    
    .loading{text-align:center;padding:40px;color:var(--text-medium);}
    .loading i{font-size:32px;color:var(--primary-sunshine);animation:spin 1s linear infinite;}
    @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo"><i class="fas fa-crown"></i><span>超级管理</span></div>
        <ul class="sidebar-menu">
            <li><a href="index.html"><i class="fas fa-chart-pie"></i> 仪表盘</a></li>
            <li><a href="hotel-audit.html" class="active"><i class="fas fa-user-plus"></i> 酒店审核</a></li>
            <li><a href="hotel-list.html"><i class="fas fa-building"></i> 酒店列表</a></li>
            <li><a href="price-audit.html"><i class="fas fa-tags"></i> 价格审核</a></li>
            <li><a href="user-list.html"><i class="fas fa-users"></i> 用户管理</a></li>
            <li><a href="reviews.html"><i class="fas fa-star"></i> 评价管理</a></li>
        </ul>
        <div class="sidebar-footer"><a href="#" onclick="Auth.logout()"><i class="fas fa-sign-out-alt"></i> 退出登录</a></div>
    </aside>
    
    <main class="main-content">
        <div class="page-header">
            <h1>酒店管理员申请审核</h1>
        </div>
        
        <div class="stats-row">
            <div class="stat-card">
                <i class="fas fa-clock"></i>
                <div class="num" id="statPending">0</div>
                <div class="label">待审核</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-check-circle"></i>
                <div class="num" id="statApproved">0</div>
                <div class="label">已通过</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-times-circle"></i>
                <div class="num" id="statRejected">0</div>
                <div class="label">已拒绝</div>
            </div>
        </div>
        
        <div class="filter-tabs">
            <button class="filter-tab active" data-status="pending">待审核 <span class="count" id="tabPending">0</span></button>
            <button class="filter-tab" data-status="approved">已通过 <span class="count" id="tabApproved">0</span></button>
            <button class="filter-tab" data-status="rejected">已拒绝 <span class="count" id="tabRejected">0</span></button>
            <button class="filter-tab" data-status="">全部 <span class="count" id="tabAll">0</span></button>
        </div>
        
        <div class="content-card">
            <h3><i class="fas fa-list"></i> 申请列表</h3>
            <div id="loadingIndicator" class="loading"><i class="fas fa-spinner"></i></div>
            <table class="table" id="applicationsTable" style="display:none;">
                <thead>
                    <tr>
                        <th>用户名</th>
                        <th>酒店名称</th>
                        <th>城市</th>
                        <th>星级</th>
                        <th>联系人</th>
                        <th>电话</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="applicationsTableBody"></tbody>
            </table>
            <div id="emptyState" class="empty-state" style="display:none;">
                <i class="fas fa-inbox"></i>
                <p>暂无申请</p>
            </div>
        </div>
    </main>
    
    <script src="../js/auth.js"></script>
    <script>
        let allApplications = [];
        let currentFilter = 'pending';
        
        async function init() {
            const authResult = await Auth.checkAuthStatus();
            if (!authResult.loggedIn) { 
                Auth.redirectToLogin('super-admin/hotel-audit.html'); 
                return; 
            }
            if (authResult.user.role !== 'super_admin') { 
                alert('No permission');
                window.location.href = '../index.html'; 
                return; 
            }
            
            // Setup filter tabs
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentFilter = tab.dataset.status;
                    renderTable();
                });
            });
            
            await loadApplications();
        }
        
        async function loadApplications() {
            try {
                const res = await Auth.fetchWithAuth('/api/super-admin/hotel-applications');
                const data = await res.json();
                
                if (data.success && data.data) {
                    allApplications = data.data;
                    updateStats();
                    renderTable();
                } else {
                    showError();
                }
            } catch(e) { 
                console.error('Load failed:', e); 
                showError();
            }
        }
        
        function updateStats() {
            const pending = allApplications.filter(a => a.status === 'pending').length;
            const approved = allApplications.filter(a => a.status === 'approved').length;
            const rejected = allApplications.filter(a => a.status === 'rejected').length;
            const total = allApplications.length;
            
            document.getElementById('statPending').textContent = pending;
            document.getElementById('statApproved').textContent = approved;
            document.getElementById('statRejected').textContent = rejected;
            document.getElementById('tabPending').textContent = pending;
            document.getElementById('tabApproved').textContent = approved;
            document.getElementById('tabRejected').textContent = rejected;
            document.getElementById('tabAll').textContent = total;
        }
        
        function renderTable() {
            document.getElementById('loadingIndicator').style.display = 'none';
            
            const filtered = currentFilter 
                ? allApplications.filter(a => a.status === currentFilter)
                : allApplications;
            
            const tbody = document.getElementById('applicationsTableBody');
            
            if (filtered.length === 0) {
                document.getElementById('applicationsTable').style.display = 'none';
                document.getElementById('emptyState').style.display = 'block';
                return;
            }
            
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('applicationsTable').style.display = 'table';
            
            tbody.innerHTML = filtered.map(app => `
                <tr>
                    <td><strong>${app.username || '-'}</strong></td>
                    <td>${app.hotel_name || '-'}</td>
                    <td>${app.city || '-'}</td>
                    <td>${app.star_rating ? '★'.repeat(app.star_rating) : '-'}</td>
                    <td>${app.contact_name || '-'}</td>
                    <td>${app.contact_phone || '-'}</td>
                    <td><span class="status-badge status-${app.status}">${app.status === 'pending' ? '待审核' : (app.status === 'approved' ? '已通过' : '已拒绝')}</span></td>
                    <td>
                        ${app.status === 'pending' ? `
                            <div class="action-buttons">
                                <button class="action-btn approve" onclick="approveApplication(${app.application_id})">
                                    <i class="fas fa-check"></i> 通过
                                </button>
                                <button class="action-btn reject" onclick="rejectApplication(${app.application_id})">
                                    <i class="fas fa-times"></i> 拒绝
                                </button>
                            </div>
                        ` : `<span style="color:var(--text-light)">-</span>`}
                    </td>
                </tr>
                <tr>
                    <td colspan="8">
                        <div class="detail-section">
                            <div class="row">
                                <span class="label">地址:</span>
                                <span class="value">${app.address || '-'}</span>
                            </div>
                            <div class="row">
                                <span class="label">申请时间:</span>
                                <span class="value">${app.created_at ? new Date(app.created_at).toLocaleString('zh-CN') : '-'}</span>
                            </div>
                            ${app.reviewed_at ? `
                            <div class="row">
                                <span class="label">审核时间:</span>
                                <span class="value">${new Date(app.reviewed_at).toLocaleString('zh-CN')}</span>
                            </div>
                            ` : ''}
                            ${app.reject_reason ? `
                            <div class="row">
                                <span class="label">拒绝原因:</span>
                                <span class="value" style="color:#c62828">${app.reject_reason}</span>
                            </div>
                            ` : ''}
                        </div>
                    </td>
                </tr>
            `).join('');
        }
        
        async function approveApplication(id) {
            if (!confirm('确认通过此申请？\n\n这将自动创建酒店管理员账户。')) return;
            
            try {
                const res = await Auth.fetchWithAuth(`/api/super-admin/hotel-applications/${id}/approve`, { 
                    method: 'POST' 
                });
                const data = await res.json();
                
                if (data.success) {
                    alert('审核通过！\n\n酒店管理员账户已创建。\n用户ID: ' + data.data.user_id + '\n酒店ID: ' + data.data.hotel_id);
                    await loadApplications();
                } else {
                    alert(data.message || '操作失败');
                }
            } catch(e) { 
                alert('操作失败: ' + e.message); 
            }
        }
        
        async function rejectApplication(id) {
            const reason = prompt('请输入拒绝原因:');
            if (!reason) return;
            
            try {
                const res = await Auth.fetchWithAuth(`/api/super-admin/hotel-applications/${id}/reject`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reason: reason })
                });
                const data = await res.json();
                
                if (data.success) {
                    alert('已拒绝');
                    await loadApplications();
                } else {
                    alert(data.message || '操作失败');
                }
            } catch(e) { 
                alert('操作失败: ' + e.message); 
            }
        }
        
        function showError() {
            document.getElementById('loadingIndicator').style.display = 'none';
            document.getElementById('applicationsTable').style.display = 'none';
            document.getElementById('emptyState').style.display = 'block';
            document.querySelector('#emptyState p').textContent = '加载失败';
        }
        
        init();
    </script>
</body>
</html>
