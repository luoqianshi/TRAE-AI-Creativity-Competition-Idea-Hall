<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付确认 - 酒店预订管理系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-cream: #fefdf7;
            --bg-peach: #fff8f3;
            --bg-mint: #f0fffa;
            --bg-lavender: #f5f3ff;
            --card-white: #ffffff;
            --border-soft: #f0e6d8;
            --primary-sunshine: #ffb347;
            --primary-coral: #ff9966;
            --secondary-lavender: #b39ddb;
            --secondary-sky: #81d4fa;
            --accent-pink: #ffb7b2;
            --accent-mint: #a8e6cf;
            --accent-lemon: #fff4a3;
            --text-warm: #5d4037;
            --text-medium: #8d6e63;
            --text-light: #bdbdbd;
            --shadow-soft: 0 8px 24px rgba(255, 179, 71, 0.06);
            --shadow-float: 0 12px 32px rgba(255, 179, 71, 0.12);
            --star-yellow: #ffd700;
            --radius-soft: 24px;
            --radius-round: 32px;
            --radius-pill: 40px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', 'Noto Sans SC', sans-serif;
            background: linear-gradient(180deg, var(--bg-cream) 0%, var(--bg-peach) 100%);
            color: var(--text-warm);
            min-height: 100vh;
        }
        
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 179, 71, 0.15);
            padding: 16px 0;
            box-shadow: 0 2px 20px rgba(255, 179, 71, 0.08);
        }
        .header-content { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; }
        .logo {
            font-family: 'Fredoka', sans-serif;
            font-size: 30px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-sunshine) 0%, var(--primary-coral) 50%, var(--accent-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -1px;
        }
        .logo i { 
            color: var(--primary-sunshine); 
            font-size: 32px;
            filter: drop-shadow(0 3px 6px rgba(255, 179, 71, 0.35));
        }
        nav { display: flex; gap: 35px; }
        nav a {
            color: var(--text-medium);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            padding: 8px 0;
            font-family: 'Nunito', sans-serif;
        }
        nav a:hover { 
            color: var(--primary-sunshine); 
            transform: translateY(-2px);
        }

        .container { max-width: 520px; margin: 0 auto; padding: 40px 24px; }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-medium);
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 24px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .back-btn:hover { 
            color: var(--primary-sunshine); 
            transform: translateX(-4px);
        }

        .payment-card { 
            background: var(--card-white); 
            border-radius: var(--radius-round); 
            padding: 40px; 
            box-shadow: var(--shadow-float);
            border: 1px solid var(--border-soft);
        }
        
        .card-title { 
            font-family: 'Fredoka', sans-serif;
            font-size: 24px; 
            font-weight: 700; 
            margin-bottom: 30px; 
            padding-bottom: 20px; 
            border-bottom: 2px solid var(--border-soft);
            color: var(--text-warm);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-title i { color: var(--primary-sunshine); }
        
        .order-summary { 
            background: linear-gradient(135deg, var(--bg-peach) 0%, var(--bg-lavender) 100%); 
            padding: 24px; 
            border-radius: var(--radius-soft); 
            margin-bottom: 30px;
            border: 1px solid var(--border-soft);
        }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 15px; }
        .summary-row span:first-child { color: var(--text-medium); }
        .summary-row span:last-child { font-weight: 600; color: var(--text-warm); }
        .summary-row:last-child { margin-bottom: 0; }
        
        .amount-display {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 30px;
        }
        .amount-label {
            font-size: 16px;
            color: var(--text-medium);
            margin-bottom: 10px;
        }
        .amount-value {
            font-family: 'Fredoka', sans-serif;
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-sunshine) 0%, var(--primary-coral) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .amount-value::before {
            content: '¥';
            font-size: 28px;
        }

        .payment-methods { margin-bottom: 30px; }
        .payment-methods-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-warm);
            margin-bottom: 16px;
        }
        .payment-method-list { display: flex; flex-direction: column; gap: 12px; }
        .payment-method {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            border: 2px solid var(--border-soft);
            border-radius: var(--radius-soft);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: var(--card-white);
        }
        .payment-method:hover {
            border-color: var(--primary-sunshine);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 179, 71, 0.15);
        }
        .payment-method.selected {
            border-color: var(--primary-sunshine);
            background: linear-gradient(135deg, rgba(255, 179, 71, 0.08) 0%, rgba(255, 153, 102, 0.08) 100%);
            box-shadow: 0 4px 15px rgba(255, 179, 71, 0.2);
        }
        .payment-method-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-right: 16px;
        }
        .payment-method-icon.alipay {
            background: linear-gradient(135deg, #00a1e9 0%, #1677ff 100%);
            color: white;
        }
        .payment-method-icon.wechat {
            background: linear-gradient(135deg, #07c160 0%, #06ad56 100%);
            color: white;
        }
        .payment-method-icon.bank {
            background: linear-gradient(135deg, var(--primary-sunshine) 0%, var(--primary-coral) 100%);
            color: white;
        }
        .payment-method-name {
            flex: 1;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-warm);
        }
        .payment-method-check {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--border-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .payment-method.selected .payment-method-check {
            border-color: var(--primary-sunshine);
            background: var(--primary-sunshine);
            color: white;
        }

        .qrcode-section {
            text-align: center;
            padding: 30px 0;
            background: linear-gradient(135deg, var(--bg-lavender) 0%, var(--bg-mint) 100%);
            border-radius: var(--radius-soft);
            margin-bottom: 20px;
            border: 1px solid var(--border-soft);
        }
        .qrcode-container {
            width: 280px;
            height: 280px;
            margin: 0 auto 20px;
            background: white;
            border-radius: var(--radius-soft);
            padding: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qrcode-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: var(--radius-soft);
        }
        .qrcode-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-light);
        }
        .qrcode-placeholder i {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .qrcode-label {
            font-size: 14px;
            color: var(--text-medium);
            margin-bottom: 8px;
        }
        .qrcode-hint {
            font-size: 12px;
            color: var(--text-light);
        }
        .qrcode-expire {
            font-size: 13px;
            color: #ff5252;
            margin-top: 10px;
            font-weight: 600;
        }

        .mock-pay-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: var(--radius-round);
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: 'Fredoka', sans-serif;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--accent-mint) 0%, #4caf50 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.3);
        }
        .mock-pay-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 14px 35px rgba(76, 175, 80, 0.4);
        }
        .mock-pay-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .mock-pay-btn span {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn { 
            width: 100%; 
            padding: 18px; 
            border: none; 
            border-radius: var(--radius-round); 
            font-size: 17px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: 'Fredoka', sans-serif;
            letter-spacing: 1px;
        }
        .btn-primary { 
            background: linear-gradient(135deg, var(--primary-sunshine) 0%, var(--primary-coral) 100%); 
            color: white;
            box-shadow: 0 8px 25px rgba(255, 179, 71, 0.4);
        }
        .btn-primary:hover { 
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 14px 35px rgba(255, 179, 71, 0.5);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .error-message { 
            background: #ffebee; 
            color: #c62828; 
            padding: 14px 18px; 
            border-radius: var(--radius-soft); 
            margin-bottom: 20px; 
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 成功页面 */
        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, var(--bg-cream) 0%, var(--bg-peach) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s;
        }
        .success-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .success-content {
            text-align: center;
            padding: 40px;
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .success-icon {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-mint) 0%, #4caf50 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            box-shadow: 0 20px 60px rgba(76, 175, 80, 0.3);
        }
        .success-icon i {
            font-size: 60px;
            color: white;
        }
        .success-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--text-warm);
            margin-bottom: 16px;
        }
        .success-message-text {
            font-size: 16px;
            color: var(--text-medium);
            margin-bottom: 30px;
        }
        .countdown-text {
            font-size: 14px;
            color: var(--text-light);
        }
        .countdown-text span {
            color: var(--primary-coral);
            font-weight: 700;
        }

        .decoration-cloud {
            position: fixed;
            top: 150px;
            left: -100px;
            width: 200px;
            height: 80px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            z-index: -1;
            filter: blur(20px);
            animation: floatCloud 20s ease-in-out infinite;
        }
        .decoration-cloud:nth-child(2) {
            top: 500px;
            right: -80px;
            width: 150px;
            height: 60px;
            animation-delay: -10s;
        }
        @keyframes floatCloud {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(50px); }
        }

        @media (max-width: 600px) {
            .container { padding: 20px; }
            .payment-card { padding: 24px; }
            .amount-value { font-size: 40px; }
        }
    </style>
</head>
<body>
    <div class="decoration-cloud"></div>
    <div class="decoration-cloud"></div>

    <header>
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-hotel"></i>
                <span>酒店预订</span>
            </div>
            <nav>
                <a href="index.html">首页</a>
                <a href="search.html">酒店搜索</a>
                <a href="user/profile.html?tab=orders">我的订单</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <a class="back-btn" href="user/profile.html?tab=orders">
            <i class="fas fa-arrow-left"></i>
            返回订单列表
        </a>

        <div class="payment-card">
            <div class="card-title"><i class="fas fa-credit-card"></i> 支付确认</div>
            
            <div id="message"></div>
            
            <div id="paymentContent">
                <div class="order-summary">
                    <div class="summary-row">
                        <span>酒店名称</span>
                        <span id="hotelName"></span>
                    </div>
                    <div class="summary-row">
                        <span>房型</span>
                        <span id="roomName"></span>
                    </div>
                    <div class="summary-row">
                        <span>入住日期</span>
                        <span id="checkInDate"></span>
                    </div>
                    <div class="summary-row">
                        <span>退房日期</span>
                        <span id="checkOutDate"></span>
                    </div>
                    <div class="summary-row">
                        <span>入住晚数</span>
                        <span id="nights"></span>
                    </div>
                </div>

                <div class="amount-display">
                    <div class="amount-label">支付金额</div>
                    <div class="amount-value" id="totalAmount"></div>
                </div>

                <div class="payment-methods">
                    <div class="payment-methods-title">选择支付方式</div>
                    <div class="payment-method-list">
                        <div class="payment-method selected" data-method="alipay" onclick="selectPayment('alipay')">
                            <div class="payment-method-icon alipay">
                                <i class="fab fa-alipay"></i>
                            </div>
                            <div class="payment-method-name">支付宝</div>
                            <div class="payment-method-check">
                                <i class="fas fa-check"></i>
                            </div>
                        </div>
                        <div class="payment-method" data-method="wechat" onclick="selectPayment('wechat')">
                            <div class="payment-method-icon wechat">
                                <i class="fab fa-weixin"></i>
                            </div>
                            <div class="payment-method-name">微信支付</div>
                            <div class="payment-method-check">
                                <i class="fas fa-check"></i>
                            </div>
                        </div>
                        <div class="payment-method" data-method="bank" onclick="selectPayment('bank')">
                            <div class="payment-method-icon bank">
                                <i class="fas fa-university"></i>
                            </div>
                            <div class="payment-method-name">银行卡</div>
                            <div class="payment-method-check">
                                <i class="fas fa-check"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <button type="button" class="btn btn-primary" id="payBtn" onclick="confirmPayment()">
                    确认支付
                </button>

                <div id="qrcodeSection" style="display: none;">
                    <div class="qrcode-section">
                        <div class="qrcode-label">扫码支付</div>
                        <div class="qrcode-container" id="qrcodeContainer">
                            <div class="qrcode-placeholder">
                                <i class="fas fa-qrcode"></i>
                                <span>生成二维码中...</span>
                            </div>
                        </div>
                        <div class="qrcode-hint">请使用手机扫描二维码完成支付</div>
                        <div class="qrcode-expire" id="qrcodeExpire">二维码有效期：15分钟</div>
                    </div>

                    <button type="button" class="mock-pay-btn" id="mockPayBtn" onclick="mockPayment()">
                        <span><i class="fas fa-check-circle"></i> 模拟支付（测试用）</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 成功页面 -->
    <div class="success-overlay" id="successOverlay">
        <div class="success-content">
            <div class="success-icon">
                <i class="fas fa-check"></i>
            </div>
            <div class="success-title">支付成功</div>
            <div class="success-message-text">您的订单已支付成功</div>
            <div class="countdown-text">
                <span id="countdown">3</span> 秒后自动跳转到订单列表
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        const bookingId = new URLSearchParams(window.location.search).get('id');
        let selectedPayment = 'alipay';
        let orderData = {};
        let qrcodeExpireTimer = null;

        Auth.updateHeaderNav();

        async function loadOrderDetail() {
            if (!bookingId) {
                showMessage('订单ID不能为空', 'error');
                return;
            }

            try {
                const res = await Auth.fetchWithAuth(`/api/orders/${bookingId}`);
                const data = await res.json();
                
                if (data.success && data.data) {
                    orderData = data.data;
                    renderOrderDetail(orderData);
                } else {
                    showMessage(data.message || '获取订单信息失败', 'error');
                }
            } catch (e) {
                showMessage('网络错误，请重试', 'error');
            }
        }

        function renderOrderDetail(order) {
            document.getElementById('hotelName').textContent = order.hotel_name || '未知酒店';
            document.getElementById('roomName').textContent = order.room_name || '未知房型';
            document.getElementById('checkInDate').textContent = order.check_in_date || '-';
            document.getElementById('checkOutDate').textContent = order.check_out_date || '-';
            document.getElementById('nights').textContent = (order.total_nights || 1) + '晚';
            document.getElementById('totalAmount').textContent = order.total_amount || '0';
        }

        function selectPayment(method) {
            selectedPayment = method;
            document.querySelectorAll('.payment-method').forEach(el => {
                el.classList.remove('selected');
            });
            document.querySelector(`.payment-method[data-method="${method}"]`).classList.add('selected');
        }

        async function confirmPayment() {
            const btn = document.getElementById('payBtn');
            btn.disabled = true;
            btn.textContent = '生成二维码...';

            try {
                const res = await Auth.fetchWithAuth(`/api/orders/${bookingId}/payment-qrcode`);
                const data = await res.json();
                
                if (data.success && data.data) {
                    showQrcodeSection(data.data);
                    btn.style.display = 'none';
                } else {
                    showMessage(data.message || data.error || '生成二维码失败', 'error');
                    btn.disabled = false;
                    btn.textContent = '确认支付';
                }
            } catch (e) {
                console.error('生成二维码失败:', e);
                showMessage('网络错误，请重试', 'error');
                btn.disabled = false;
                btn.textContent = '确认支付';
            }
        }

        function showQrcodeSection(qrcodeData) {
            document.getElementById('qrcodeSection').style.display = 'block';
            
            if (qrcodeData.qrcodeUrl) {
                document.getElementById('qrcodeContainer').innerHTML = `
                    <img src="${qrcodeData.qrcodeUrl}" class="qrcode-image" alt="支付二维码">
                `;
            } else {
                document.getElementById('qrcodeContainer').innerHTML = `
                    <div class="qrcode-placeholder">
                        <i class="fas fa-qrcode"></i>
                        <span>二维码生成失败</span>
                    </div>
                `;
            }

            if (qrcodeData.expireTime) {
                startExpireTimer(qrcodeData.expireTime);
            }

            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function startExpireTimer(expireTimeStr) {
            if (qrcodeExpireTimer) {
                clearInterval(qrcodeExpireTimer);
            }

            const expireTime = new Date(expireTimeStr);
            
            qrcodeExpireTimer = setInterval(() => {
                const now = new Date();
                const diff = Math.floor((expireTime - now) / 1000);
                
                if (diff <= 0) {
                    clearInterval(qrcodeExpireTimer);
                    document.getElementById('qrcodeExpire').textContent = '二维码已过期，请重新生成';
                    document.getElementById('mockPayBtn').disabled = true;
                    return;
                }

                const minutes = Math.floor(diff / 60);
                const seconds = diff % 60;
                document.getElementById('qrcodeExpire').textContent = 
                    `二维码有效期：${minutes}分${seconds}秒`;
            }, 1000);
        }

        async function mockPayment() {
            const btn = document.getElementById('mockPayBtn');
            btn.disabled = true;
            btn.innerHTML = '<span><i class="fas fa-spinner fa-spin"></i> 支付处理中...</span>';

            try {
                const res = await Auth.fetchWithAuth(`/api/orders/${bookingId}/simulate-pay`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();
                
                if (data.success) {
                    showSuccessPage();
                } else {
                    showMessage(data.message || data.error || '支付失败', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<span><i class="fas fa-check-circle"></i> 模拟支付（测试用）</span>';
                }
            } catch (e) {
                console.error('模拟支付失败:', e);
                showMessage('网络错误，请重试', 'error');
                btn.disabled = false;
                btn.innerHTML = '<span><i class="fas fa-check-circle"></i> 模拟支付（测试用）</span>';
            }
        }

        function showSuccessPage() {
            if (qrcodeExpireTimer) {
                clearInterval(qrcodeExpireTimer);
            }
            const overlay = document.getElementById('successOverlay');
            overlay.classList.add('show');
            
            let seconds = 3;
            const countdownEl = document.getElementById('countdown');
            
            const timer = setInterval(() => {
                seconds--;
                countdownEl.textContent = seconds;
                if (seconds <= 0) {
                    clearInterval(timer);
                    location.href = 'user/profile.html?tab=orders';
                }
            }, 1000);
        }

        function showMessage(msg, type) {
            const div = document.getElementById('message');
            div.innerHTML = `<div class="error-message"><i class="fas fa-exclamation-circle"></i> ${msg}</div>`;
        }

        // 页面加载时检查登录状态并加载订单
        Auth.checkAuthStatus().then(result => {
            if (!result.loggedIn) {
                showMessage('请先登录才能进行支付', 'error');
                document.getElementById('payBtn').disabled = true;
            }
            loadOrderDetail();
        });
    </script>
</body>
</html>
