<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的评价</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../js/auth.js"></script>
    <style>
        :root {
            --bg-cream: #fefdf7;--bg-peach: #fff8f3;--card-white: #ffffff;--border-soft: #f0e6d8;--primary-sunshine: #ffb347;--primary-coral: #ff9966;--text-warm: #5d4037;--text-medium: #8d6e63;--text-light: #bdbdbd;--star-yellow: #ffd700;--radius-soft: 24px;--radius-round: 32px;--radius-pill: 40px;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Nunito','Noto Sans SC',sans-serif;background:linear-gradient(180deg,var(--bg-cream) 0%,var(--bg-peach) 100%);color:var(--text-warm);min-height:100vh;}
        header{display:flex;justify-content:space-between;align-items:center;padding:16px 40px;background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,179,71,0.15);box-shadow:0 4px 20px rgba(0,0,0,0.05);position:sticky;top:0;z-index:100;}
        .logo{font-family:'Fredoka',sans-serif;font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--primary-sunshine),var(--primary-coral));-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:10px;}
        .logo i{color:var(--primary-sunshine);font-size:28px;}
        nav{display:flex;gap:30px;align-items:center;}
        nav a{text-decoration:none;color:var(--text-medium);font-weight:600;font-size:15px;}
        nav a.active{color:var(--primary-sunshine);}
        .user-menu{display:flex;align-items:center;gap:12px;}
        .btn{padding:10px 24px;border-radius:var(--radius-pill);text-decoration:none;font-size:14px;font-weight:600;transition:all 0.3s;font-family:'Nunito',sans-serif;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px;}
        .btn-primary{background:linear-gradient(135deg,var(--primary-sunshine),var(--primary-coral));color:white;}
        .btn-outline{border:2px solid var(--border-soft);color:var(--text-medium);background:white;}
        .btn-danger{background:linear-gradient(135deg,#ff8a80,#ff5252);color:white;}
        .container{max-width:1000px;margin:0 auto;padding:30px 20px;}
        .page-header{text-align:center;margin-bottom:30px;}
        .page-header h1{font-family:'Fredoka',sans-serif;font-size:32px;font-weight:800;background:linear-gradient(135deg,var(--text-warm),var(--text-medium));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;}
        .page-header p{color:var(--text-light);font-size:15px;}
        .stats-bar{display:flex;gap:16px;margin-bottom:24px;justify-content:center;}
        .stat-pill{padding:12px 24px;background:var(--card-white);border:1px solid var(--border-soft);border-radius:var(--radius-pill);display:flex;align-items:center;gap:10px;}
        .stat-pill-value{font-family:'Fredoka',sans-serif;font-size:24px;font-weight:800;color:var(--primary-sunshine);}
        .stat-pill-label{font-size:13px;color:var(--text-medium);font-weight:600;}
        .review-list{display:flex;flex-direction:column;gap:20px;}
        .review-card{background:var(--card-white);border:1px solid var(--border-soft);border-radius:var(--radius-soft);padding:24px;box-shadow:0 4px 16px rgba(255,179,71,0.05);transition:all 0.3s;}
        .review-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,179,71,0.1);}
        .review-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
        .review-hotel{display:flex;gap:14px;align-items:center;}
        .review-hotel-image{width:60px;height:60px;border-radius:14px;background-size:cover;background-position:center;background-color:var(--bg-peach);}
        .review-hotel-info h3{font-family:'Fredoka',sans-serif;font-size:17px;font-weight:700;margin-bottom:4px;}
        .review-hotel-info p{color:var(--text-light);font-size:13px;}
        .review-actions{display:flex;gap:8px;}
        .review-rating{display:flex;gap:3px;margin-bottom:12px;}
        .review-rating i{color:var(--star-yellow);font-size:16px;}
        .review-rating i.empty{color:var(--border-soft);}
        .review-content{color:var(--text-medium);font-size:14px;line-height:1.7;margin-bottom:14px;white-space:pre-wrap;}
        .review-images{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
        .review-images img{width:90px;height:90px;object-fit:cover;border-radius:14px;cursor:pointer;transition:transform 0.3s;}
        .review-images img:hover{transform:scale(1.05);}
        .review-footer{display:flex;justify-content:space-between;align-items:center;padding-top:14px;border-top:1px solid var(--border-soft);font-size:13px;color:var(--text-light);}
        .empty-state{text-align:center;padding:80px 20px;}
        .empty-state i{font-size:80px;color:var(--border-soft);margin-bottom:20px;}
        .empty-state h3{font-family:'Fredoka',sans-serif;font-size:22px;margin-bottom:10px;color:var(--text-medium);}
        .empty-state p{color:var(--text-light);font-size:15px;margin-bottom:24px;}
        .toast{position:fixed;top:100px;right:24px;padding:16px 24px;border-radius:var(--radius-soft);font-weight:600;font-size:15px;z-index:3000;animation:slideInRight 0.3s ease-out;box-shadow:0 8px 25px rgba(0,0,0,0.15);}
        .toast.success{background:linear-gradient(135deg,#a8e6cf,#81c784);color:white;}
        .toast.error{background:linear-gradient(135deg,#ffb7b2,#ff8a80);color:white;}
        @keyframes slideInRight{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:2000;display:none;}
        .modal-overlay.show{display:flex;}
        .modal-content{background:var(--card-white);border-radius:var(--radius-round);padding:32px;width:400px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.2);}
        .modal-content h3{font-family:'Fredoka',sans-serif;font-size:20px;margin:14px 0 10px;}
        .modal-content p{color:var(--text-medium);margin-bottom:24px;}
        .modal-buttons{display:flex;gap:12px;}
        .modal-buttons .btn{flex:1;justify-content:center;}
    </style>
</head>
<body>
    <header>
        <a href="../index.html" class="logo"><i class="fas fa-hotel"></i><span>酒店预订</span></a>
        <nav>
            <a href="../index.html">首页</a>
            <a href="../search.html">酒店搜索</a>
            <a href="profile.html?tab=orders">我的订单</a>
            <a href="reviews.html" class="active">我的评价</a>
        </nav>
        <div class="user-menu" id="userMenu">
            <a href="../login.html" class="btn btn-outline">登录</a>
            <a href="../register.html" class="btn btn-primary">注册</a>
        </div>
    </header>
    <div class="container">
        <div class="page-header">
            <h1>我的评价</h1>
            <p>查看您提交的所有酒店评价</p>
        </div>
        <div class="stats-bar" id="statsBar"></div>
        <div class="review-list" id="reviewList">
            <div style="text-align:center;padding:40px;color:var(--text-light);"><i class="fas fa-spinner fa-spin" style="font-size:32px;"></i></div>
        </div>
    </div>
    <div class="modal-overlay" id="deleteModal">
        <div class="modal-content">
            <i class="fas fa-exclamation-circle" style="font-size:48px;color:var(--primary-coral);"></i>
            <h3>删除评价</h3>
            <p>确定要删除这条评价吗？删除后将无法恢复。</p>
            <div class="modal-buttons">
                <button class="btn btn-outline" onclick="closeDeleteModal()">取消</button>
                <button class="btn btn-danger" id="confirmDeleteBtn">确认删除</button>
            </div>
        </div>
    </div>
    <script>
        if (window.Auth) Auth.updateHeaderNav();

        let deleteReviewId = null;

        async function init() {
            const authResult = await Auth.checkAuthStatus();
            if (!authResult.loggedIn) {
                Auth.redirectToLogin(window.location.href);
                return;
            }
            await loadReviews();
        }

        async function loadReviews() {
            try {
                const res = await Auth.fetchWithAuth('/api/reviews/mine');
                const data = await res.json();
                if (data.success && data.data) {
                    const reviews = data.data;
                    renderStats(reviews);
                    renderReviews(reviews);
                } else {
                    document.getElementById('reviewList').innerHTML = renderEmpty();
                }
            } catch(e) {
                document.getElementById('reviewList').innerHTML = renderEmpty();
            }
        }

        function renderStats(reviews) {
            const total = reviews.length;
            const avg = total > 0 ? (reviews.reduce((sum, r) => sum + (r.rating || 0), 0) / total).toFixed(1) : '0.0';
            const fiveStar = reviews.filter(r => r.rating === 5).length;
            document.getElementById('statsBar').innerHTML = '<div class="stat-pill"><div class="stat-pill-value">' + total + '</div><div class="stat-pill-label">总评价数</div></div><div class="stat-pill"><div class="stat-pill-value">' + avg + '</div><div class="stat-pill-label">平均评分</div></div><div class="stat-pill"><div class="stat-pill-value">' + fiveStar + '</div><div class="stat-pill-label">5星好评</div></div>';
        }

        function renderReviews(reviews) {
            if (reviews.length === 0) {
                document.getElementById('reviewList').innerHTML = renderEmpty();
                return;
            }
            document.getElementById('reviewList').innerHTML = reviews.map(r => {
                const stars = [1,2,3,4,5].map(i => '<i class="fas fa-star ' + (i <= (r.rating || 0) ? '' : 'empty') + '"></i>').join('');
                const images = (r.images && r.images.length > 0) ? '<div class="review-images">' + r.images.map(img => '<img src="' + img + '" onclick="window.open(\'' + img + '\')">').join('') + '</div>' : '';
                return '<div class="review-card"><div class="review-header"><div class="review-hotel"><div class="review-hotel-image" style="background-image:url(\'' + (r.hotel_image || '/img/default-hotel.jpg') + '\')"></div><div class="review-hotel-info"><h3>' + (r.hotel_name || '酒店') + '</h3><p>' + (r.room_type_name || '') + '</p></div></div><div class="review-actions"><button class="btn btn-danger" onclick="confirmDelete(' + (r.review_id || r.id) + ')" style="padding:8px 16px;font-size:13px;"><i class="fas fa-trash"></i> 删除</button></div></div><div class="review-rating">' + stars + '</div><div class="review-content">' + (r.comment || '用户未填写文字评价') + '</div>' + images + '<div class="review-footer"><span><i class="fas fa-calendar"></i> ' + formatDate(r.created_at) + '</span><span>订单号: ' + (r.order_no || '-') + '</span></div></div>';
            }).join('');
        }

        function renderEmpty() {
            return '<div class="empty-state"><i class="fas fa-comment-slash"></i><h3>暂无评价</h3><p>您还未提交任何酒店评价</p><a href="profile.html?tab=orders" class="btn btn-primary">去评价订单</a></div>';
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }

        function confirmDelete(reviewId) {
            deleteReviewId = reviewId;
            document.getElementById('deleteModal').classList.add('show');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('show');
            deleteReviewId = null;
        }

        document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
            if (!deleteReviewId) return;
            try {
                const res = await Auth.fetchWithAuth('/api/reviews/' + deleteReviewId, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    showToast('评价已删除', 'success');
                    closeDeleteModal();
                    setTimeout(() => loadReviews(), 500);
                } else {
                    showToast(data.message || '删除失败', 'error');
                }
            } catch(e) {
                showToast('删除失败', 'error');
            }
        });

        function showToast(msg, type) {
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        init();
    </script>
</body>
</html>
