<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单详情 - 酒店预订管理系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-cream: #fefdf7;
            --bg-peach: #fff8f3;
            --bg-mint: #f0fffa;
            --bg-lavender: #f5f3ff;
            --card-white: #ffffff;
            --border-soft: #f0e6d8;
            --primary-sunshine: #ffb347;
            --primary-coral: #ff9966;
            --secondary-lavender: #b39ddb;
            --secondary-sky: #81d4fa;
            --accent-pink: #ffb7b2;
            --accent-mint: #a8e6cf;
            --accent-lemon: #fff4a3;
            --text-warm: #5d4037;
            --text-medium: #8d6e63;
            --text-light: #bdbdbd;
            --shadow-soft: 0 8px 24px rgba(255, 179, 71, 0.06);
            --shadow-float: 0 12px 32px rgba(255, 179, 71, 0.12);
            --star-yellow: #ffd700;
            --radius-soft: 24px;
            --radius-round: 32px;
            --radius-pill: 40px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', 'Noto Sans SC', sans-serif;
            background: linear-gradient(180deg, var(--bg-cream) 0%, var(--bg-peach) 100%);
            color: var(--text-warm);
            min-height: 100vh;
        }
        
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 179, 71, 0.15);
            padding: 16px 0;
            box-shadow: 0 2px 20px rgba(255, 179, 71, 0.08);
        }
        .header-content { max-width: 800px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; }
        .logo {
            font-family: 'Fredoka', sans-serif;
            font-size: 30px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-sunshine) 0%, var(--primary-coral) 50%, var(--accent-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -1px;
        }
        .logo i { 
            color: var(--primary-sunshine); 
            font-size: 32px;
            filter: drop-shadow(0 3px 6px rgba(255, 179, 71, 0.35));
        }
        nav { display: flex; gap: 35px; }
        nav a {
            color: var(--text-medium);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            padding: 8px 0;
            font-family: 'Nunito', sans-serif;
        }
        nav a:hover { 
            color: var(--primary-sunshine); 
            transform: translateY(-2px);
        }
        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-sunshine), var(--accent-pink));
            border-radius: 2px;
            transition: width 0.3s;
        }
        nav a:hover::after { width: 80%; }

        .container { max-width: 800px; margin: 0 auto; padding: 40px 24px 120px; }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-medium);
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 24px;
            transition: all 0.3s;
        }
        .back-btn:hover {
            color: var(--primary-sunshine);
            transform: translateX(-4px);
        }

        .detail-card { 
            background: var(--card-white); 
            border-radius: var(--radius-round); 
            padding: 40px; 
            box-shadow: var(--shadow-float);
            border: 1px solid var(--border-soft);
            margin-bottom: 24px;
        }

        .status-banner {
            text-align: center;
            padding: 30px;
            border-radius: var(--radius-soft);
            margin-bottom: 30px;
        }
        .status-banner.status-pending {
            background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
            border: 2px solid var(--primary-sunshine);
        }
        .status-banner.status-confirmed {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            border: 2px solid var(--secondary-sky);
        }
        .status-banner.status-checked_in_pre {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            border: 2px solid var(--accent-mint);
        }
        .status-banner.status-checked_in {
            background: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%);
            border: 2px solid var(--secondary-lavender);
        }
        .status-banner.status-checked_out {
            background: linear-gradient(135deg, var(--bg-lavender) 0%, #d1c4e9 100%);
            border: 2px solid var(--secondary-lavender);
        }
        .status-banner.status-cancelled {
            background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%);
            border: 2px solid var(--accent-pink);
        }
        .status-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .status-text {
            font-family: 'Fredoka', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-warm);
        }
        .status-desc {
            font-size: 14px;
            color: var(--text-medium);
            margin-top: 8px;
        }

        .booking-id {
            text-align: center;
            font-size: 14px;
            color: var(--text-medium);
            margin-bottom: 24px;
            padding: 12px;
            background: var(--bg-cream);
            border-radius: var(--radius-pill);
        }
        .booking-id span {
            font-weight: 700;
            color: var(--text-warm);
        }

        .info-section {
            margin-bottom: 28px;
        }
        .info-section:last-child { margin-bottom: 0; }
        .section-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-warm);
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border-soft);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title i { color: var(--primary-sunshine); }
        .section-title.purple i { color: var(--secondary-lavender); }
        .section-title.green i { color: var(--accent-mint); }
        .section-title.orange i { color: var(--primary-coral); }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        .info-item {
            padding: 16px;
            background: var(--bg-cream);
            border-radius: var(--radius-soft);
        }
        .info-item.full-width { grid-column: span 2; }
        .info-label {
            font-size: 13px;
            color: var(--text-medium);
            margin-bottom: 6px;
        }
        .info-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-warm);
        }

        .price-box {
            background: linear-gradient(135deg, var(--bg-peach) 0%, var(--bg-lavender) 100%);
            border-radius: var(--radius-soft);
            padding: 24px;
            border: 1px solid var(--border-soft);
        }
        .price-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 15px;
        }
        .price-row span:first-child { color: var(--text-medium); }
        .price-row span:last-child { font-weight: 600; color: var(--text-warm); }
        .price-total { 
            font-family: 'Fredoka', sans-serif;
            font-size: 28px; 
            font-weight: 800; 
            color: var(--primary-coral); 
            padding-top: 16px; 
            margin-top: 12px;
            border-top: 2px solid var(--border-soft);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 20px 24px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
            border-top: 1px solid var(--border-soft);
            z-index: 100;
        }
        .action-bar-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 16px;
        }

        .btn { 
            flex: 1;
            padding: 18px; 
            border: none; 
            border-radius: var(--radius-round); 
            font-size: 17px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: 'Fredoka', sans-serif;
            letter-spacing: 1px;
            text-align: center;
            text-decoration: none;
        }
        .btn-primary { 
            background: linear-gradient(135deg, var(--primary-sunshine) 0%, var(--primary-coral) 100%); 
            color: white;
            box-shadow: 0 8px 25px rgba(255, 179, 71, 0.4);
        }
        .btn-primary:hover { 
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 14px 35px rgba(255, 179, 71, 0.5);
        }
        .btn-outline { 
            background: transparent;
            border: 2px solid var(--border-soft);
            color: var(--text-medium);
            box-shadow: none;
        }
        .btn-outline:hover { 
            border-color: var(--primary-sunshine);
            color: var(--primary-sunshine);
            transform: translateY(-2px);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ff8a80 0%, #ff5252 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(255, 82, 82, 0.3);
        }
        .btn-danger:hover { 
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 14px 35px rgba(255, 82, 82, 0.4);
        }
        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary-lavender) 0%, var(--secondary-sky) 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(179, 157, 219, 0.4);
        }
        .btn-secondary:hover { 
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 14px 35px rgba(179, 157, 219, 0.5);
        }

        .message-box { 
            padding: 16px 20px; 
            border-radius: var(--radius-soft); 
            margin-bottom: 20px; 
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .error-message { 
            background: #ffebee; 
            color: #c62828; 
            border: 1px solid #ffcdd2;
        }
        .success-message { 
            background: #e8f5e9; 
            color: #2e7d32; 
            border: 1px solid #c8e6c9;
        }
        .info-message { 
            background: #e3f2fd; 
            color: #1565c0; 
            border: 1px solid #bbdefb;
        }

        .decoration-cloud {
            position: fixed;
            top: 150px;
            left: -100px;
            width: 200px;
            height: 80px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            z-index: -1;
            filter: blur(20px);
            animation: floatCloud 20s ease-in-out infinite;
        }
        .decoration-cloud:nth-child(2) {
            top: 500px;
            right: -80px;
            width: 150px;
            height: 60px;
            animation-delay: -10s;
        }
        @keyframes floatCloud {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(50px); }
        }

        .loading-state {
            text-align: center;
            padding: 80px 40px;
        }
        .loading-state i {
            font-size: 48px;
            color: var(--primary-sunshine);
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .container { padding: 20px 16px 140px; }
            .detail-card { padding: 24px; }
            .info-grid { grid-template-columns: 1fr; }
            .info-item.full-width { grid-column: span 1; }
            .status-text { font-size: 24px; }
            .price-total { font-size: 24px; }
            nav { gap: 20px; }
            .logo { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="decoration-cloud"></div>
    <div class="decoration-cloud"></div>

    <header>
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-hotel"></i>
                <span>酒店预订</span>
            </div>
            <nav>
                <a href="../index.html">首页</a>
                <a href="../search.html">酒店搜索</a>
                <a href="profile.html?tab=orders">我的订单</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <a href="profile.html?tab=orders" class="back-btn">
            <i class="fas fa-arrow-left"></i> 返回订单列表
        </a>

        <div id="messageBox"></div>

        <div id="content">
            <div class="loading-state">
                <i class="fas fa-spinner"></i>
                <p style="margin-top: 16px; color: var(--text-medium);">加载中...</p>
            </div>
        </div>
    </div>

    <div class="action-bar" id="actionBar" style="display: none;">
        <div class="action-bar-content" id="actionContent"></div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        const bookingId = new URLSearchParams(window.location.search).get('id');

        Auth.checkAuthStatus().then(result => {
            if (!result.loggedIn) {
                showMessage('请先登录查看订单详情', 'error', true);
                document.getElementById('content').innerHTML = `
                    <div class="detail-card">
                        <div class="message-box error-message">
                            <i class="fas fa-lock"></i>
                            <span>请先登录</span>
                        </div>
                        <a href="login.html?redirect=order-detail.html?id=${bookingId}" class="btn btn-primary">立即登录</a>
                    </div>
                `;
            } else {
                loadOrderDetail();
            }
        });

        async function loadOrderDetail() {
            if (!bookingId) {
                showMessage('订单ID不存在', 'error');
                return;
            }

            try {
                const res = await Auth.fetchWithAuth(`/api/orders/${bookingId}`);
                
                if (res.status === 401) {
                    await Auth.checkAuthStatus();
                    const retryRes = await Auth.fetchWithAuth(`/api/orders/${bookingId}`);
                    const retryData = await retryRes.json();
                    if (retryData.success && retryData.data) {
                        renderOrderDetail(retryData.data);
                    } else {
                        showMessage(retryData.error || '获取订单详情失败，请重新登录', 'error');
                        document.getElementById('content').innerHTML = `
                            <div class="detail-card">
                                <div class="message-box error-message">
                                    <i class="fas fa-exclamation-circle"></i>
                                    <span>${retryData.error || '获取订单详情失败，请重新登录'}</span>
                                </div>
                                <a href="login.html?redirect=order-detail.html?id=${bookingId}" class="btn btn-primary">立即登录</a>
                            </div>
                        `;
                    }
                    return;
                }

                const data = await res.json();

                if (data.success && data.data) {
                    renderOrderDetail(data.data);
                } else {
                    showMessage(data.error || '获取订单详情失败', 'error');
                    document.getElementById('content').innerHTML = `
                        <div class="detail-card">
                            <div class="message-box error-message">
                                <i class="fas fa-exclamation-circle"></i>
                                <span>${data.error || '获取订单详情失败'}</span>
                            </div>
                        </div>
                    `;
                }
            } catch (e) {
                showMessage('网络错误，请刷新重试', 'error');
            }
        }

        function renderOrderDetail(order) {
            const statusConfig = getStatusConfig(order.status);
            const createdTime = new Date(order.created_at).toLocaleString('zh-CN');

            let actionButtons = '';
            switch (order.status) {
                case 'pending':
                    actionButtons = `
                        <a href="../payment.html?id=${order.booking_id}" class="btn btn-primary">
                            <i class="fas fa-credit-card"></i> 立即支付
                        </a>
                        <button class="btn btn-outline" onclick="cancelOrder(${order.booking_id})">
                            <i class="fas fa-times"></i> 取消订单
                        </button>
                    `;
                    break;
                case 'confirmed':
                    actionButtons = `
                        <button class="btn btn-danger" onclick="cancelOrder(${order.booking_id})">
                            <i class="fas fa-times-circle"></i> 取消订单
                        </button>
                    `;
                    break;
                case 'checked_in_pre':
                    actionButtons = `
                        <div class="message-box info-message" style="flex: 1; text-align: center;">
                            <i class="fas fa-info-circle"></i>
                            <span>入住准备中，请耐心等待</span>
                        </div>
                    `;
                    break;
                case 'checked_in':
                    actionButtons = `
                        <div class="message-box info-message" style="flex: 1; text-align: center;">
                            <i class="fas fa-home"></i>
                            <span>入住中，请按时退房</span>
                        </div>
                    `;
                    break;
                case 'checked_out':
                    actionButtons = `
                        <a href="review.html?bookingId=${order.booking_id}" class="btn btn-secondary">
                            <i class="fas fa-star"></i> 立即评价
                        </a>
                    `;
                    break;
                case 'cancelled':
                    actionButtons = `
                        <div class="message-box error-message" style="flex: 1; text-align: center;">
                            <i class="fas fa-ban"></i>
                            <span>订单已取消</span>
                        </div>
                    `;
                    break;
            }

            document.getElementById('actionBar').style.display = 'block';
            document.getElementById('actionContent').innerHTML = actionButtons;

            document.getElementById('content').innerHTML = `
                <div class="detail-card">
                    <div class="status-banner status-${order.status}">
                        <div class="status-icon"><i class="fas ${statusConfig.icon}"></i></div>
                        <div class="status-text">${statusConfig.text}</div>
                        <div class="status-desc">${statusConfig.desc}</div>
                    </div>

                    <div class="booking-id">
                        订单编号：<span>${order.booking_id}</span>
                    </div>

                    <div class="info-section">
                        <div class="section-title">
                            <i class="fas fa-hotel"></i> 酒店信息
                        </div>
                        <div class="info-grid">
                            <div class="info-item full-width">
                                <div class="info-label">酒店名称</div>
                                <div class="info-value">${order.hotel_name || '未知酒店'}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">酒店地址</div>
                                <div class="info-value">${order.hotel_address || '-'}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">酒店电话</div>
                                <div class="info-value">${order.hotel_phone || '-'}</div>
                            </div>
                        </div>
                    </div>

                    <div class="info-section">
                        <div class="section-title purple">
                            <i class="fas fa-bed"></i> 房型信息
                        </div>
                        <div class="info-grid">
                            <div class="info-item full-width">
                                <div class="info-label">房型名称</div>
                                <div class="info-value">${order.room_name || '未知房型'}</div>
                            </div>
                        </div>
                    </div>

                    <div class="info-section">
                        <div class="section-title green">
                            <i class="fas fa-calendar-check"></i> 入住信息
                        </div>
                        <div class="info-grid">
                            <div class="info-item">
                                <div class="info-label">入住日期</div>
                                <div class="info-value">${order.check_in_date}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">退房日期</div>
                                <div class="info-value">${order.check_out_date}</div>
                            </div>
                            <div class="info-item full-width">
                                <div class="info-label">入住夜数</div>
                                <div class="info-value">${order.total_nights || 1} 晚</div>
                            </div>
                        </div>
                    </div>

                    <div class="info-section">
                        <div class="section-title">
                            <i class="fas fa-user"></i> 入住人信息
                        </div>
                        <div class="info-grid">
                            <div class="info-item">
                                <div class="info-label">入住人姓名</div>
                                <div class="info-value">${order.guest_name || '-'}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">联系电话</div>
                                <div class="info-value">${order.guest_phone || '-'}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">身份证号码</div>
                                <div class="info-value">${order.guest_id_card ? (order.guest_id_card.length >= 18 ? order.guest_id_card.slice(0,4)+'**********'+order.guest_id_card.slice(-4) : order.guest_id_card) : '-'}</div>
                            </div>
                            <div class="info-item full-width">
                                <div class="info-label">电子邮箱</div>
                                <div class="info-value">${order.guest_email || '-'}</div>
                            </div>
                            <div class="info-item full-width">
                                <div class="info-label">特殊要求</div>
                                <div class="info-value">${order.special_requests || '无'}</div>
                            </div>
                        </div>
                    </div>

                    <div class="info-section">
                        <div class="section-title orange">
                            <i class="fas fa-receipt"></i> 费用信息
                        </div>
                        <div class="price-box">
                            <div class="price-row">
                                <span>单价</span>
                                <span>¥${(order.total_amount / (order.total_nights || 1)).toFixed(2)}/晚</span>
                            </div>
                            <div class="price-row">
                                <span>入住夜数</span>
                                <span>${order.total_nights || 1} 晚</span>
                            </div>
                            <div class="price-total">
                                <span>总价</span>
                                <span>¥${order.total_amount}</span>
                            </div>
                        </div>
                    </div>

                    <div class="info-section">
                        <div class="section-title purple">
                            <i class="fas fa-clock"></i> 其他信息
                        </div>
                        <div class="info-grid">
                            <div class="info-item">
                                <div class="info-label">下单时间</div>
                                <div class="info-value">${createdTime}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">支付状态</div>
                                <div class="info-value">${getPaymentStatusText(order.payment_status)}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function getStatusConfig(status) {
            const config = {
                'pending': {
                    icon: 'fa-clock',
                    text: '待支付',
                    desc: '请尽快完成支付，订单将在24小时后自动取消'
                },
                'confirmed': {
                    icon: 'fa-check-circle',
                    text: '已确认',
                    desc: '订单已确认，请按时入住'
                },
                'checked_in_pre': {
                    icon: 'fa-luggage-cart',
                    text: '待入住',
                    desc: '酒店正在为您的入住做准备'
                },
                'checked_in': {
                    icon: 'fa-home',
                    text: '已入住',
                    desc: '祝您入住愉快，请按时退房'
                },
                'checked_out': {
                    icon: 'fa-flag-checkered',
                    text: '已完成',
                    desc: '感谢您的入住，期待您的评价'
                },
                'cancelled': {
                    icon: 'fa-ban',
                    text: '已取消',
                    desc: '订单已取消，如有问题请联系客服'
                }
            };
            return config[status] || { icon: 'fa-question', text: status, desc: '' };
        }

        function getPaymentStatusText(status) {
            const map = {
                'unpaid': '未支付',
                'paid': '已支付',
                'refunded': '已退款'
            };
            return map[status] || status || '-';
        }

        async function cancelOrder(id) {
            if (!confirm('确定要取消此订单吗？')) return;

            try {
                const res = await Auth.fetchWithAuth(`/api/orders/${id}/cancel`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reason: '用户主动取消' })
                });
                const data = await res.json();

                if (data.success) {
                    showMessage('订单已成功取消', 'success');
                    setTimeout(() => {
                        location.href = 'profile.html?tab=orders';
                    }, 1500);
                } else {
                    showMessage(data.error || '取消订单失败', 'error');
                }
            } catch (e) {
                showMessage('网络错误，取消失败', 'error');
            }
        }

        function showMessage(msg, type, replace = false) {
            const box = document.getElementById('messageBox');
            const icon = type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle';
            const className = type === 'success' ? 'success-message' : type === 'error' ? 'error-message' : 'info-message';
            
            if (replace) {
                box.innerHTML = `<div class="message-box ${className}"><i class="fas fa-${icon}"></i><span>${msg}</span></div>`;
            } else {
                box.innerHTML += `<div class="message-box ${className}" style="margin-bottom: 16px;"><i class="fas fa-${icon}"></i><span>${msg}</span></div>`;
            }
            setTimeout(() => {
                box.innerHTML = '';
            }, 3000);
        }
    </script>
</body>
</html>
