<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提交评价</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../js/auth.js"></script>
    <style>
        :root {
            --bg-cream: #fefdf7;--bg-peach: #fff8f3;--card-white: #ffffff;--border-soft: #f0e6d8;--primary-sunshine: #ffb347;--primary-coral: #ff9966;--text-warm: #5d4037;--text-medium: #8d6e63;--text-light: #bdbdbd;--star-yellow: #ffd700;--radius-soft: 24px;--radius-round: 32px;--radius-pill: 40px;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Nunito','Noto Sans SC',sans-serif;background:linear-gradient(180deg,var(--bg-cream) 0%,var(--bg-peach) 100%);color:var(--text-warm);min-height:100vh;}
        header{display:flex;justify-content:space-between;align-items:center;padding:16px 40px;background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,179,71,0.15);box-shadow:0 4px 20px rgba(0,0,0,0.05);position:sticky;top:0;z-index:100;}
        .logo{font-family:'Fredoka',sans-serif;font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--primary-sunshine),var(--primary-coral));-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:10px;}
        .logo i{color:var(--primary-sunshine);font-size:28px;}
        nav{display:flex;gap:30px;align-items:center;}
        nav a{text-decoration:none;color:var(--text-medium);font-weight:600;font-size:15px;}
        nav a.active{color:var(--primary-sunshine);}
        .user-menu{display:flex;align-items:center;gap:12px;}
        .btn{padding:12px 28px;border-radius:var(--radius-pill);text-decoration:none;font-size:15px;font-weight:600;transition:all 0.3s;font-family:'Nunito',sans-serif;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:8px;}
        .btn-primary{background:linear-gradient(135deg,var(--primary-sunshine),var(--primary-coral));color:white;box-shadow:0 8px 25px rgba(255,179,71,0.4);}
        .btn-primary:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(255,179,71,0.5);}
        .btn-outline{border:2px solid var(--border-soft);color:var(--text-medium);background:white;}
        .container{max-width:800px;margin:0 auto;padding:30px 20px;}
        .page-header{text-align:center;margin-bottom:30px;}
        .page-header h1{font-family:'Fredoka',sans-serif;font-size:32px;font-weight:800;background:linear-gradient(135deg,var(--text-warm),var(--text-medium));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;}
        .page-header p{color:var(--text-light);font-size:15px;}
        .order-summary{background:var(--card-white);border:1px solid var(--border-soft);border-radius:var(--radius-soft);padding:24px;margin-bottom:24px;display:flex;gap:20px;align-items:center;box-shadow:0 4px 16px rgba(255,179,71,0.05);}
        .order-image{width:100px;height:100px;border-radius:var(--radius-soft);background-size:cover;background-position:center;flex-shrink:0;background-color:var(--bg-peach);}
        .order-info{flex:1;}
        .order-info h3{font-family:'Fredoka',sans-serif;font-size:18px;margin-bottom:6px;}
        .order-info p{color:var(--text-medium);font-size:14px;margin:3px 0;}
        .review-card{background:var(--card-white);border:1px solid var(--border-soft);border-radius:var(--radius-soft);padding:32px;box-shadow:0 4px 16px rgba(255,179,71,0.05);}
        .form-section{margin-bottom:30px;}
        .form-section h3{font-family:'Fredoka',sans-serif;font-size:18px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px;color:var(--text-warm);}
        .form-section h3 i{color:var(--primary-sunshine);}
        .rating-stars{display:flex;gap:8px;font-size:42px;cursor:pointer;}
        .rating-stars i{cursor:pointer;color:var(--text-light);transition:all 0.2s;}
        .rating-stars i.active{color:var(--star-yellow);transform:scale(1.1);}
        .rating-stars i:hover{transform:scale(1.2);}
        .rating-text{margin-top:10px;font-size:14px;color:var(--text-medium);font-weight:600;}
        .comment-area{width:100%;min-height:160px;padding:18px;border:2px solid var(--border-soft);border-radius:var(--radius-soft);font-size:15px;font-family:'Nunito',sans-serif;background:var(--bg-peach);color:var(--text-warm);resize:vertical;transition:all 0.3s;}
        .comment-area:focus{outline:none;border-color:var(--primary-sunshine);background:white;box-shadow:0 6px 24px rgba(255,179,71,0.2);}
        .char-count{text-align:right;margin-top:6px;font-size:13px;color:var(--text-light);}
        .char-count.warn{color:var(--primary-coral);font-weight:600;}
        .upload-area{border:2px dashed var(--border-soft);border-radius:var(--radius-soft);padding:30px;text-align:center;cursor:pointer;transition:all 0.3s;background:var(--bg-peach);}
        .upload-area:hover{border-color:var(--primary-sunshine);background:white;}
        .upload-area i{font-size:32px;color:var(--primary-sunshine);margin-bottom:10px;}
        .upload-area p{color:var(--text-medium);font-size:14px;}
        .image-list{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px;}
        .image-item{position:relative;aspect-ratio:1;border-radius:var(--radius-soft);overflow:hidden;background:var(--bg-peach);}
        .image-item img{width:100%;height:100%;object-fit:cover;}
        .image-remove{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,0.6);color:white;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;}
        .actions{display:flex;gap:12px;justify-content:center;margin-top:24px;}
        .toast{position:fixed;top:100px;right:24px;padding:16px 24px;border-radius:var(--radius-soft);font-weight:600;font-size:15px;z-index:3000;animation:slideInRight 0.3s ease-out;box-shadow:0 8px 25px rgba(0,0,0,0.15);}
        .toast.success{background:linear-gradient(135deg,#a8e6cf,#81c784);color:white;}
        .toast.error{background:linear-gradient(135deg,#ffb7b2,#ff8a80);color:white;}
        @keyframes slideInRight{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
        .loading{text-align:center;padding:60px;color:var(--text-light);}
    </style>
</head>
<body>
    <header>
        <a href="../index.html" class="logo"><i class="fas fa-hotel"></i><span>酒店预订</span></a>
        <nav>
            <a href="../index.html">首页</a>
            <a href="../search.html">酒店搜索</a>
            <a href="profile.html?tab=orders" class="active">我的订单</a>
        </nav>
        <div class="user-menu" id="userMenu">
            <a href="../login.html" class="btn btn-outline">登录</a>
            <a href="../register.html" class="btn btn-primary">注册</a>
        </div>
    </header>
    <div class="container" id="container">
        <div class="loading"><i class="fas fa-spinner fa-spin" style="font-size:32px;"></i><br>加载中...</div>
    </div>
    <script>
        if (window.Auth) Auth.updateHeaderNav();

        let orderId = null;
        let orderData = null;
        let rating = 0;
        let uploadedImages = [];

        const ratingTexts = ['', '非常差', '差', '一般', '满意', '非常满意'];

        async function init() {
            const authResult = await Auth.checkAuthStatus();
            if (!authResult.loggedIn) {
                Auth.redirectToLogin(window.location.href);
                return;
            }
            const params = new URLSearchParams(window.location.search);
            orderId = params.get('booking_id') || params.get('orderId');
            if (!orderId) {
                document.getElementById('container').innerHTML = '<div class="loading">订单ID不存在</div>';
                return;
            }
            await loadOrder();
        }

        async function loadOrder() {
            try {
                const res = await Auth.fetchWithAuth('/api/orders/' + orderId);
                const data = await res.json();
                if (data.success && data.data) {
                    orderData = data.data;
                    if (!['checked_out','completed'].includes(orderData.status)) {
                        document.getElementById('container').innerHTML = '<div class="loading"><i class="fas fa-exclamation-circle" style="font-size:48px;color:var(--primary-coral);"></i><p style="margin-top:20px;">该订单还未退房，无法评价</p><a href="profile.html?tab=orders" class="btn btn-primary" style="margin-top:20px;">返回订单列表</a></div>';
                        return;
                    }
                    renderForm();
                } else {
                    document.getElementById('container').innerHTML = '<div class="loading">订单不存在</div>';
                }
            } catch(e) {
                document.getElementById('container').innerHTML = '<div class="loading">加载失败</div>';
            }
        }

        function renderForm() {
            const o = orderData;
            document.getElementById('container').innerHTML = '<div class="page-header"><h1>评价您的入住体验</h1><p>您的评价将帮助其他用户做出更好的选择</p></div><div class="order-summary"><div class="order-image" style="background-image:url(\'' + (o.hotel_image || '/img/default-hotel.jpg') + '\')"></div><div class="order-info"><h3>' + (o.hotel_name || '') + '</h3><p>' + (o.room_type_name || '') + '</p><p><i class="fas fa-calendar"></i> ' + (o.check_in_date || '') + ' ~ ' + (o.check_out_date || '') + '</p></div></div><div class="review-card"><div class="form-section"><h3><i class="fas fa-star"></i> 总体评分</h3><div class="rating-stars" id="ratingStars"><i class="far fa-star" data-value="1"></i><i class="far fa-star" data-value="2"></i><i class="far fa-star" data-value="3"></i><i class="far fa-star" data-value="4"></i><i class="far fa-star" data-value="5"></i></div><div class="rating-text" id="ratingText">请选择评分</div></div><div class="form-section"><h3><i class="fas fa-comment"></i> 评价内容</h3><textarea class="comment-area" id="comment" maxlength="500" placeholder="请分享您的入住体验..."></textarea><div class="char-count" id="charCount">0 / 500</div></div><div class="form-section"><h3><i class="fas fa-camera"></i> 上传图片 <span style="font-size:13px;color:var(--text-light);font-weight:400;">（最多5张）</span></h3><div class="upload-area" id="uploadArea" onclick="document.getElementById(\'fileInput\').click()"><i class="fas fa-cloud-upload-alt"></i><p>点击上传图片</p></div><input type="file" id="fileInput" accept="image/*" multiple style="display:none"><div class="image-list" id="imageList"></div></div><div class="actions"><a href="profile.html?tab=orders" class="btn btn-outline">取消</a><button class="btn btn-primary" onclick="submitReview()"><i class="fas fa-paper-plane"></i> 提交评价</button></div></div>';
            bindRatingEvents();
            bindUploadEvents();
            bindCommentEvent();
        }

        function bindRatingEvents() {
            const stars = document.querySelectorAll('#ratingStars i');
            stars.forEach(star => {
                star.addEventListener('click', () => {
                    rating = parseInt(star.getAttribute('data-value'));
                    updateStarsDisplay();
                });
                star.addEventListener('mouseenter', () => {
                    const val = parseInt(star.getAttribute('data-value'));
                    highlightStars(val);
                });
            });
            document.getElementById('ratingStars').addEventListener('mouseleave', () => {
                highlightStars(rating);
            });
        }

        function highlightStars(count) {
            const stars = document.querySelectorAll('#ratingStars i');
            stars.forEach((star, idx) => {
                if (idx < count) {
                    star.classList.remove('far');
                    star.classList.add('fas', 'active');
                } else {
                    star.classList.remove('fas', 'active');
                    star.classList.add('far');
                }
            });
        }

        function updateStarsDisplay() {
            highlightStars(rating);
            document.getElementById('ratingText').textContent = rating > 0 ? rating + '分 - ' + ratingTexts[rating] : '请选择评分';
        }

        function bindUploadEvents() {
            document.getElementById('fileInput').addEventListener('change', handleFileSelect);
        }

        function handleFileSelect(e) {
            const files = e.target.files;
            for (let i = 0; i < files.length && uploadedImages.length < 5; i++) {
                const file = files[i];
                if (file.size > 5 * 1024 * 1024) {
                    showToast('图片大小不能超过5MB', 'error');
                    continue;
                }
                const reader = new FileReader();
                reader.onload = (ev) => {
                    uploadedImages.push(ev.target.result);
                    renderImages();
                };
                reader.readAsDataURL(file);
            }
            e.target.value = '';
        }

        function renderImages() {
            const list = document.getElementById('imageList');
            list.innerHTML = uploadedImages.map((img, idx) => '<div class="image-item"><img src="' + img + '"><button class="image-remove" onclick="removeImage(' + idx + ')">×</button></div>').join('');
        }

        function removeImage(idx) {
            uploadedImages.splice(idx, 1);
            renderImages();
        }

        function bindCommentEvent() {
            const comment = document.getElementById('comment');
            const charCount = document.getElementById('charCount');
            comment.addEventListener('input', () => {
                const len = comment.value.length;
                charCount.textContent = len + ' / 500';
                if (len >= 450) charCount.classList.add('warn');
                else charCount.classList.remove('warn');
            });
        }

        async function submitReview() {
            if (rating === 0) {
                showToast('请选择评分', 'error');
                return;
            }
            const comment = document.getElementById('comment').value.trim();
            if (comment.length > 500) {
                showToast('评价内容不能超过500字', 'error');
                return;
            }
            try {
                const res = await Auth.fetchWithAuth('/api/reviews', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({
                        orderId: parseInt(orderId),
                        rating: rating,
                        comment: comment,
                        images: uploadedImages
                    })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('评价提交成功', 'success');
                    setTimeout(() => window.location.href = 'reviews.html', 1500);
                } else {
                    showToast(data.message || '提交失败', 'error');
                }
            } catch(e) {
                showToast('提交失败', 'error');
            }
        }

        function showToast(msg, type) {
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        init();
    </script>
</body>
</html>
