        let orderCurrentStatus = '';
        let orderCurrentPage = 1;
        let orderTotalPages = 1;
        let selectedOrderIds = new Set();
        let currentOrderSearch = '';
        let allOrdersCache = [];
        let orderCurrentSortBy = 'created_at';
        let orderCurrentSortDir = 'desc';

        // 搜索处理
        function handleOrderSearch(keyword) {
            currentOrderSearch = keyword.toLowerCase();
            if (allOrdersCache.length > 0) {
                const filtered = allOrdersCache.filter(o => 
                    (o.hotel_name || '').toLowerCase().includes(currentOrderSearch)
                );
                renderOrders(filtered);
            }
        }

        // 排序处理
        function onOrderSortChange() {
            const sortValue = document.getElementById('orderSortSelect').value;
            const [sortBy, sortDir] = sortValue.split('-');
            orderCurrentSortBy = sortBy;
            orderCurrentSortDir = sortDir;
            orderCurrentPage = 1;
            localStorage.setItem('userOrderSort', sortValue);
            loadOrders();
        }

        // 选择相关
        function toggleOrderSelection(orderId) {
            if (selectedOrderIds.has(orderId)) {
                selectedOrderIds.delete(orderId);
            } else {
                selectedOrderIds.add(orderId);
            }
            updateOrderSelectionUI();
        }

        function updateOrderSelectionUI() {
            const batchActions = document.getElementById('orderBatchActions');
            const selectedCount = document.getElementById('selectedOrderCount');
            if (selectedOrderIds.size > 0) {
                batchActions.style.display = 'flex';
                selectedCount.innerHTML = `已选择 <b>${selectedOrderIds.size}</b> 项`;
            } else {
                batchActions.style.display = 'none';
            }
        }

        function clearOrderSelection() {
            selectedOrderIds.clear();
            updateOrderSelectionUI();
            loadOrders();
        }

        // 批量取消
        async function batchCancelOrders() {
            if (selectedOrderIds.size === 0) {
                Toast.warning('请先选择要取消的订单');
                return;
            }
            
            if (!confirm(`确定要取消选中的 ${selectedOrderIds.size} 个订单吗？`)) {
                return;
            }
            
            const btn = event.target.closest('button');
            Request.setButtonLoading(btn);
            
            let successCount = 0;
            let failCount = 0;
            
            for (const orderId of selectedOrderIds) {
                try {
                    const res = await Auth.fetchWithAuth(`/api/orders/${orderId}/cancel`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    const data = await res.json();
                    if (data.success) {
                        successCount++;
                    } else {
                        failCount++;
                    }
                } catch (e) {
                    failCount++;
                }
            }
            
            Request.resetButton(btn, '批量取消');
            selectedOrderIds.clear();
            updateOrderSelectionUI();
            loadOrders();
            
            if (successCount > 0) {
                Toast.success(`成功取消 ${successCount} 个订单`);
            }
            if (failCount > 0) {
                Toast.error(`有 ${failCount} 个订单取消失败`);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedSort = localStorage.getItem('userOrderSort');
            if (savedSort) {
                const [sortBy, sortDir] = savedSort.split('-');
                orderCurrentSortBy = sortBy;
                orderCurrentSortDir = sortDir;
                const sortSelect = document.getElementById('orderSortSelect');
                if (sortSelect) {
                    sortSelect.value = savedSort;
                }
            }

            document.querySelectorAll('#orderStatusTabs .status-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('#orderStatusTabs .status-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    orderCurrentStatus = tab.dataset.status;
                    orderCurrentPage = 1;
                    loadOrders();
                });
            });
        });

        async function loadOrders() {
            const container = document.getElementById('ordersContainer');
            
            if (!container) {
                console.error('ordersContainer element not found');
                return;
            }
            
            Loading.show(container, { text: '正在加载订单...' });
            
            try {
                let url = `/api/orders/my?page=${orderCurrentPage}&limit=100&sortBy=${orderCurrentSortBy}&sortDir=${orderCurrentSortDir}`;
                if (orderCurrentStatus) {
                    url += `&status=${orderCurrentStatus}`;
                }
                
                const res = await Request.fetchWithRetry('/api/auth/me', {
                    headers: { 'Authorization': `Bearer ${Auth.getToken()}` }
                });
                const authData = await res.json();
                if (authData.success && authData.data && authData.data.token) {
                    Auth.login(authData.data);
                }
                
                const ordersRes = await Request.fetchWithRetry(url, {
                    headers: { 'Authorization': `Bearer ${Auth.getToken()}` }
                });
                const data = await ordersRes.json();
                
                Loading.hide(container);
                
                if (data.success && data.data) {
                    allOrdersCache = data.data.content || data.data || [];
                    const orders = currentOrderSearch 
                        ? allOrdersCache.filter(o => (o.hotel_name || '').toLowerCase().includes(currentOrderSearch))
                        : allOrdersCache;
                    
                    if (orders.length === 0) {
                        renderOrdersEmptyState();
                    } else {
                        renderOrders(orders);
                    }
                } else {
                    Toast.error('加载订单失败');
                    renderOrdersEmptyState();
                }
            } catch (e) {
                Loading.hide(container);
                Toast.error('网络错误，请稍后重试');
                renderOrdersEmptyState();
            }
        }

        function renderOrdersEmptyState() {
            const container = document.getElementById('ordersContainer');
            const statusText = getOrderStatusText(orderCurrentStatus) || '订单';
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <h3>暂无${statusText}</h3>
                    <p>您还没有相关的订单记录</p>
                    <a href="../search.html" class="btn btn-primary">去预订酒店</a>
                </div>
            `;
        }

        function renderOrders(orders) {
            const container = document.getElementById('ordersContainer');
            container.innerHTML = orders.map(order => {
                const statusBadgeClass = `status-${order.status}`;
                const statusText = getOrderStatusText(order.status);
                const actionsHtml = getOrderActions(order);
                const isSelected = selectedOrderIds.has(order.booking_id);
                const canSelect = order.status === 'pending' || order.status === 'confirmed';
                
                return `
                <div class="order-card ${isSelected ? 'selected' : ''}" style="position:relative;">
                    ${canSelect ? `
                    <div class="order-checkbox" style="position:absolute;top:16px;left:16px;z-index:10;">
                        <input type="checkbox" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation();toggleOrderSelection(${order.booking_id})" style="width:20px;height:20px;cursor:pointer;">
                    </div>
                    ` : ''}
                    <div class="order-card-content" onclick="goToOrderDetail(${order.booking_id})">
                        <div class="order-header">
                            <div class="order-hotel">
                                <div class="order-hotel-image" style="background-image: url('https://picsum.photos/seed/hotel${order.hotel_id}/200/150')"></div>
                                <div class="order-hotel-info">
                                    <div class="order-hotel-name">${order.hotel_name || '未知酒店'}</div>
                                    <div class="order-room-name">${order.room_name || '未知房型'} · ${order.room_count || 1}间</div>
                                </div>
                            </div>
                            <div class="order-status-badge ${statusBadgeClass}">${statusText}</div>
                        </div>
                        <div class="order-body">
                            <div class="order-dates">
                                <div class="order-date-item">
                                    <i class="fas fa-calendar-check"></i>
                                    <div>
                                        <div class="date-label">入住日期</div>
                                        <div class="date-value">${order.check_in_date || '-'}</div>
                                    </div>
                                </div>
                                <div class="order-date-item">
                                    <i class="fas fa-calendar-times"></i>
                                    <div>
                                        <div class="date-label">退房日期</div>
                                        <div class="date-value">${order.check_out_date || '-'}</div>
                                    </div>
                                </div>
                                <div class="order-nights">
                                    <i class="fas fa-moon"></i>
                                    ${order.total_nights || 1}晚
                                </div>
                            </div>
                            <div class="order-details">
                                <div class="order-detail-row">
                                    <span><i class="fas fa-user"></i>入住人：${order.guest_name || '-'}</span>
                                </div>
                                <div class="order-detail-row">
                                    <span><i class="fas fa-clock"></i>下单时间：${formatDateTime(order.created_at)}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="order-footer">
                        <div class="order-price">
                            <span class="order-price-label">总金额</span>
                            <span class="order-price-value">${order.total_amount || 0}</span>
                        </div>
                        <div class="order-actions" onclick="event.stopPropagation();">
                            ${actionsHtml}
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        function getOrderActions(order) {
            switch (order.status) {
                case 'pending':
                    return `
                        <button class="btn btn-primary" onclick="payOrder(${order.booking_id})">立即支付</button>
                        <button class="btn btn-outline-danger" onclick="cancelOrder(${order.booking_id})">取消订单</button>
                    `;
                case 'confirmed':
                    return `
                        <button class="btn btn-outline-danger" onclick="cancelOrder(${order.booking_id})">取消订单</button>
                    `;
                case 'checked_in_pre':
                    return `
                        <button class="btn btn-secondary" onclick="goToOrderDetail(${order.booking_id})">查看详情</button>
                    `;
                case 'checked_in':
                    return `
                        <button class="btn btn-secondary" disabled>入住中</button>
                    `;
                case 'checked_out':
                    return `
                        <button class="btn btn-primary" onclick="writeReview(${order.booking_id})">立即评价</button>
                        <button class="btn btn-secondary" onclick="rebookHotel(${order.hotel_id})">再次预订</button>
                    `;
                case 'cancelled':
                    return `
                        <button class="btn btn-secondary" onclick="goToOrderDetail(${order.booking_id})">查看详情</button>
                    `;
                default:
                    return `
                        <button class="btn btn-secondary" onclick="goToOrderDetail(${order.booking_id})">查看详情</button>
                    `;
            }
        }

        function getOrderStatusText(status) {
            const map = {
                'pending': '待支付',
                'confirmed': '已确认',
                'checked_in_pre': '待入住',
                'checked_in': '已入住',
                'checked_out': '已完成',
                'cancelled': '已取消'
            };
            return map[status] || status;
        }

        function formatDateTime(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function goToOrderDetail(bookingId) {
            location.href = `order-detail.html?id=${bookingId}`;
        }

        function payOrder(bookingId) {
            location.href = `../payment.html?id=${bookingId}`;
        }

        async function cancelOrder(bookingId) {
            if (!confirm('确定要取消此订单吗？')) return;
            
            const btn = event.target;
            Request.setButtonLoading(btn);
            
            try {
                const res = await Request.fetchWithRetry(`/api/orders/${bookingId}/cancel`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${Auth.getToken()}`
                    }
                });
                const data = await res.json();
                
                Request.resetButton(btn, '取消订单');
                
                if (data.success) {
                    Toast.success('订单已取消');
                    loadOrders();
                } else {
                    Toast.error(data.error || '取消失败，请稍后重试');
                }
            } catch (e) {
                Request.resetButton(btn, '取消订单');
                Toast.error('网络错误，请稍后重试');
            }
        }

        function writeReview(bookingId) {
            location.href = `review-submit.html?booking_id=${bookingId}`;
        }

        function rebookHotel(hotelId) {
            location.href = `../hotel-detail.html?id=${hotelId}`;
        }

        function renderOrderPagination() {
            const container = document.getElementById('orderPagination');
            if (orderTotalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = '';
            if (orderCurrentPage > 1) {
                html += `<button class="page-btn" onclick="goToOrderPage(${orderCurrentPage - 1})">上一页</button>`;
            }

            for (let i = 1; i <= Math.min(5, orderTotalPages); i++) {
                html += `<button class="page-btn ${orderCurrentPage === i ? 'active' : ''}" onclick="goToOrderPage(${i})">${i}</button>`;
            }

            if (orderCurrentPage < orderTotalPages) {
                html += `<button class="page-btn" onclick="goToOrderPage(${orderCurrentPage + 1})">下一页</button>`;
            }

            container.innerHTML = html;
        }

        function goToOrderPage(page) {
            orderCurrentPage = page;
            loadOrders();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        let deleteReviewId = null;
        let selectedReviewIds = new Set();

        function toggleReviewSelection(reviewId) {
            if (selectedReviewIds.has(reviewId)) {
                selectedReviewIds.delete(reviewId);
            } else {
                selectedReviewIds.add(reviewId);
            }
            updateReviewSelectionUI();
        }

        function updateReviewSelectionUI() {
            const batchActions = document.getElementById('reviewBatchActions');
            const selectedCount = document.getElementById('selectedReviewCount');
            if (!batchActions) return;
            if (selectedReviewIds.size > 0) {
                batchActions.style.display = 'flex';
                selectedCount.innerHTML = `已选择 <b>${selectedReviewIds.size}</b> 项`;
            } else {
                batchActions.style.display = 'none';
            }
        }

        function clearReviewSelection() {
            selectedReviewIds.clear();
            updateReviewSelectionUI();
            loadReviews();
        }

        async function batchDeleteReviews() {
            if (selectedReviewIds.size === 0) {
                Toast.warning('请先选择要删除的评价');
                return;
            }
            
            if (!confirm(`确定要删除选中的 ${selectedReviewIds.size} 条评价吗？删除后将无法恢复。`)) {
                return;
            }
            
            const btn = event.target.closest('button');
            Request.setButtonLoading(btn);
            
            let successCount = 0;
            let failCount = 0;
            
            for (const reviewId of selectedReviewIds) {
                try {
                    const res = await Auth.fetchWithAuth(`/api/reviews/${reviewId}`, { method: 'DELETE' });
                    const data = await res.json();
                    if (data.success) {
                        successCount++;
                    } else {
                        failCount++;
                    }
                } catch (e) {
                    failCount++;
                }
            }
            
            Request.resetButton(btn, '批量删除');
            selectedReviewIds.clear();
            updateReviewSelectionUI();
            loadReviews();
            
            if (successCount > 0) {
                Toast.success(`成功删除 ${successCount} 条评价`);
            }
            if (failCount > 0) {
                Toast.error(`有 ${failCount} 条评价删除失败`);
            }
        }

        async function loadReviews() {
            const container = document.getElementById('reviewList');
            if (!container) return;
            
            Loading.show(container, { text: '正在加载评价...' });
            
            try {
                const res = await Auth.fetchWithAuth('/api/reviews/mine');
                const data = await res.json();
                
                Loading.hide(container);
                
                if (data.success && data.data) {
                    const reviews = data.data;
                    renderReviewStats(reviews);
                    renderReviews(reviews);
                } else {
                    document.getElementById('reviewList').innerHTML = renderReviewEmpty();
                }
            } catch(e) {
                Loading.hide(container);
                Toast.error('加载评价失败');
                document.getElementById('reviewList').innerHTML = renderReviewEmpty();
            }
        }

        function renderReviewStats(reviews) {
            const total = reviews.length;
            const avg = total > 0 ? (reviews.reduce((sum, r) => sum + (r.rating || 0), 0) / total).toFixed(1) : '0.0';
            const fiveStar = reviews.filter(r => r.rating === 5).length;
            document.getElementById('reviewStatsBar').innerHTML = '<div class="stat-pill"><div class="stat-pill-value">' + total + '</div><div class="stat-pill-label">总评价数</div></div><div class="stat-pill"><div class="stat-pill-value">' + avg + '</div><div class="stat-pill-label">平均评分</div></div><div class="stat-pill"><div class="stat-pill-value">' + fiveStar + '</div><div class="stat-pill-label">5星好评</div></div>';
        }

        function renderReviews(reviews) {
            if (reviews.length === 0) {
                document.getElementById('reviewList').innerHTML = renderReviewEmpty();
                return;
            }
            document.getElementById('reviewList').innerHTML = `
                <div class="review-toolbar" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                    <span style="color:var(--text-medium);font-size:14px;">共 ${reviews.length} 条评价</span>
                    <div class="review-batch-actions" id="reviewBatchActions" style="display:none;gap:10px;align-items:center;">
                        <span id="selectedReviewCount" style="color:var(--text-medium);font-size:14px;">已选择 <b>0</b> 项</span>
                        <button class="btn btn-outline-danger" onclick="batchDeleteReviews()">
                            <i class="fas fa-trash-alt"></i> 批量删除
                        </button>
                        <button class="btn btn-outline" onclick="clearReviewSelection()">清除选择</button>
                    </div>
                </div>
            ` + reviews.map(r => {
                const stars = [1,2,3,4,5].map(i => '<i class="fas fa-star ' + (i <= (r.rating || 0) ? '' : 'empty') + '"></i>').join('');
                const images = (r.images && r.images.length > 0) ? '<div class="review-images">' + r.images.map(img => '<img src="' + img + '" onclick="window.open(\'' + img + '\')">').join('') + '</div>' : '';
                const reviewId = r.review_id || r.id;
                const isSelected = selectedReviewIds.has(reviewId);
                return `
                <div class="review-card ${isSelected ? 'selected' : ''}" style="position:relative;">
                    <div class="review-checkbox" style="position:absolute;top:16px;left:16px;z-index:10;">
                        <input type="checkbox" ${isSelected ? 'checked' : ''} onclick="toggleReviewSelection(${reviewId})" style="width:20px;height:20px;cursor:pointer;">
                    </div>
                    <div class="review-header">
                        <div class="review-hotel">
                            <div class="review-hotel-image" style="background-image:url('${r.hotel_image || '/img/default-hotel.jpg'}')"></div>
                            <div class="review-hotel-info">
                                <h3>${r.hotel_name || '酒店'}</h3>
                                <p>${r.room_type_name || ''}</p>
                            </div>
                        </div>
                        <div class="review-actions">
                            <button class="btn btn-outline-danger" onclick="confirmDeleteReview(${reviewId})" style="padding:8px 16px;font-size:13px;">
                                <i class="fas fa-trash"></i> 删除
                            </button>
                        </div>
                    </div>
                    <div class="review-rating">${stars}</div>
                    <div class="review-content">${r.comment || '用户未填写文字评价'}</div>
                    ${images}
                    <div class="review-footer">
                        <span><i class="fas fa-calendar"></i> ${formatReviewDate(r.created_at)}</span>
                        <span>订单号: ${r.order_no || '-'}</span>
                    </div>
                </div>`;
            }).join('');
        }

        function renderReviewEmpty() {
            return '<div class="empty-state"><i class="fas fa-comment-slash"></i><h3>暂无评价</h3><p>您还未提交任何酒店评价</p><button class="btn btn-primary" onclick="switchTab(\'orders\')">去评价订单</button></div>';
        }

        function formatReviewDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }

        function confirmDeleteReview(reviewId) {
            deleteReviewId = reviewId;
            if (confirm('确定要删除这条评价吗？删除后将无法恢复。')) {
                deleteReview();
            }
        }

        async function deleteReview() {
            if (!deleteReviewId) return;
            try {
                const res = await Auth.fetchWithAuth('/api/reviews/' + deleteReviewId, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    Toast.success('评价已删除');
                    setTimeout(() => loadReviews(), 500);
                } else {
                    Toast.error(data.message || '删除失败');
                }
            } catch(e) {
                Toast.error('删除失败');
            }
        }

        function tryInit() {
            if (typeof Auth !== 'undefined') {
                init();
            } else {
                setTimeout(tryInit, 100);
            }
        }
        tryInit();
    </script>
</body>
</html>
