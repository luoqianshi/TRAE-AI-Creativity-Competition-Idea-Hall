<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>个人信息 - 酒店预订系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/js/auth.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/loading.js"></script>
    <script src="/js/cache.js"></script>
    <script src="/js/request.js"></script>
    <script src="/js/utils.js"></script>
    <style>
        :root {
            --bg-cream: #fefdf7;
            --bg-peach: #fff8f3;
            --bg-mint: #f0fffa;
            --bg-lavender: #f5f3ff;
            --card-white: #ffffff;
            --border-soft: #f0e6d8;
            --primary-sunshine: #ffb347;
            --primary-coral: #ff9966;
            --secondary-lavender: #b39ddb;
            --secondary-sky: #81d4fa;
            --accent-pink: #ffb7b2;
            --accent-mint: #a8e6cf;
            --accent-lemon: #fff4a3;
            --text-warm: #5d4037;
            --text-medium: #8d6e63;
            --text-light: #bdbdbd;
            --shadow-soft: 0 8px 24px rgba(255, 179, 71, 0.06);
            --shadow-float: 0 12px 32px rgba(255, 179, 71, 0.12);
            --radius-soft: 24px;
            --radius-round: 32px;
            --radius-pill: 40px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', 'Noto Sans SC', sans-serif;
            background: linear-gradient(180deg, var(--bg-cream) 0%, var(--bg-peach) 100%);
            color: var(--text-warm);
            min-height: 100vh;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 179, 71, 0.15);
            padding: 16px 0;
            box-shadow: 0 2px 20px rgba(255, 179, 71, 0.08);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
        }

        .logo {
            font-family: 'Fredoka', sans-serif;
            font-size: 30px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-sunshine) 0%, var(--primary-coral) 50%, var(--accent-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -1px;
            text-decoration: none;
        }

        .logo i { 
            color: var(--primary-sunshine); 
            font-size: 32px;
            filter: drop-shadow(0 3px 6px rgba(255, 179, 71, 0.35));
        }

        nav { display: flex; gap: 35px; }
        nav a {
            color: var(--text-medium);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            position: relative;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            padding: 8px 0;
            font-family: 'Nunito', sans-serif;
        }
        nav a:hover { 
            color: var(--primary-sunshine); 
            transform: translateY(-2px);
        }
        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-sunshine), var(--accent-pink));
            border-radius: 2px;
            transition: width 0.3s;
        }
        nav a:hover::after { width: 80%; }
        nav a.active { 
            color: var(--primary-sunshine); 
            font-weight: 700;
        }
        nav a.active::after { width: 100%; }

        .user-menu { display: flex; align-items: center; gap: 15px; }
        
        .user-dropdown {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: var(--radius-pill);
            background: var(--bg-peach);
            border: 2px solid var(--border-soft);
            transition: all 0.3s;
        }
        
        .user-dropdown:hover {
            border-color: var(--primary-sunshine);
            box-shadow: 0 4px 15px rgba(255, 179, 71, 0.15);
        }
        
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-sunshine), var(--accent-pink));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 14px;
        }
        
        .user-name {
            font-weight: 600;
            color: var(--text-warm);
            font-size: 15px;
        }
        
        .user-dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 10px;
            background: white;
            border: 2px solid var(--border-soft);
            border-radius: var(--radius-soft);
            min-width: 180px;
            box-shadow: var(--shadow-float);
            display: none;
            overflow: hidden;
        }
        
        .user-dropdown-menu.show {
            display: block;
            animation: slideDown 0.2s ease-out;
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .dropdown-item {
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-medium);
            text-decoration: none;
            transition: all 0.2s;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        
        .dropdown-item:hover {
            background: var(--bg-peach);
            color: var(--primary-coral);
        }
        
        .dropdown-item i {
            width: 20px;
            color: var(--primary-sunshine);
        }
        
        .dropdown-divider {
            height: 1px;
            background: var(--border-soft);
            margin: 4px 0;
        }

        .main-layout {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 24px;
            gap: 30px;
        }

        .sidebar {
            width: 280px;
            flex-shrink: 0;
            position: sticky;
            top: 100px;
            height: fit-content;
        }

        .sidebar-card {
            background: var(--card-white);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-soft);
            overflow: hidden;
            box-shadow: var(--shadow-soft);
        }

        .sidebar-header {
            padding: 30px 24px;
            background: linear-gradient(135deg, var(--bg-peach) 0%, var(--bg-lavender) 100%);
            text-align: center;
            border-bottom: 1px solid var(--border-soft);
        }

        .sidebar-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-sunshine), var(--accent-pink));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-size: 32px;
            font-weight: 700;
            margin: 0 auto 15px;
            box-shadow: 0 8px 25px rgba(255, 179, 71, 0.3);
        }

        .sidebar-name {
            font-family: 'Fredoka', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-warm);
            margin-bottom: 5px;
        }

        .sidebar-role {
            font-size: 13px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sidebar-menu {
            padding: 16px 0;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 24px;
            color: var(--text-medium);
            text-decoration: none;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
        }

        .sidebar-item:hover {
            background: var(--bg-peach);
            color: var(--primary-coral);
        }

        .sidebar-item.active {
            background: linear-gradient(135deg, rgba(255, 179, 71, 0.1), rgba(255, 153, 102, 0.1));
            color: var(--primary-coral);
            border-left: 4px solid var(--primary-sunshine);
        }

        .sidebar-item i {
            width: 22px;
            font-size: 18px;
            color: var(--primary-sunshine);
        }

        .sidebar-item.danger:hover {
            background: rgba(198, 40, 40, 0.08);
            color: #c62828;
        }

        .sidebar-item.danger i {
            color: #c62828;
        }

        .content {
            flex: 1;
            min-width: 0;
        }

        .content-card {
            background: var(--card-white);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-soft);
            padding: 40px;
            box-shadow: var(--shadow-soft);
        }

        .content-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--text-warm);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .content-title i {
            color: var(--primary-sunshine);
            font-size: 28px;
        }

        .content-subtitle {
            font-size: 15px;
            color: var(--text-light);
            margin-bottom: 35px;
            padding-left: 42px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 28px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-medium);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-label.readonly {
            color: var(--text-light);
        }

        .form-input {
            padding: 16px 20px;
            border: 2px solid var(--border-soft);
            border-radius: var(--radius-round);
            font-size: 15px;
            background: var(--bg-peach);
            color: var(--text-warm);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: 'Nunito', sans-serif;
            font-weight: 500;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-sunshine);
            box-shadow: 0 6px 24px rgba(255, 179, 71, 0.2);
            transform: translateY(-2px);
            background: white;
        }

        .form-input:disabled {
            background: var(--bg-cream);
            color: var(--text-light);
            cursor: not-allowed;
        }

        .form-input:disabled:hover {
            transform: none;
            box-shadow: none;
        }

        .form-input::placeholder {
            color: var(--text-light);
        }

        .form-hint {
            font-size: 12px;
            color: var(--text-light);
        }

        .form-actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid var(--border-soft);
        }

        .btn {
            padding: 16px 40px;
            border-radius: var(--radius-pill);
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-sunshine) 0%, var(--primary-coral) 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(255, 179, 71, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 14px 35px rgba(255, 179, 71, 0.5);
        }

        .btn-outline {
            border: 2px solid var(--border-soft);
            color: var(--text-medium);
            background: white;
        }

        .btn-outline:hover {
            border-color: var(--primary-sunshine);
            color: var(--primary-sunshine);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 179, 71, 0.15);
        }

        .toast {
            position: fixed;
            top: 100px;
            right: 30px;
            padding: 18px 28px;
            border-radius: var(--radius-soft);
            background: white;
            box-shadow: var(--shadow-float);
            display: flex;
            align-items: center;
            gap: 14px;
            font-weight: 600;
            font-size: 15px;
            z-index: 1000;
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            border-left: 5px solid var(--accent-mint);
        }

        .toast.success i {
            color: var(--accent-mint);
            font-size: 22px;
        }

        .toast.error {
            border-left: 5px solid #c62828;
        }

        .toast.error i {
            color: #c62828;
            font-size: 22px;
        }

        .login-prompt {
            text-align: center;
            padding: 80px 40px;
        }

        .login-prompt-icon {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--bg-peach), var(--bg-lavender));
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
        }

        .login-prompt-icon i {
            font-size: 44px;
            color: var(--primary-sunshine);
        }

        .login-prompt h2 {
            font-family: 'Fredoka', sans-serif;
            font-size: 28px;
            color: var(--text-warm);
            margin-bottom: 15px;
        }

        .login-prompt p {
            font-size: 16px;
            color: var(--text-light);
            margin-bottom: 35px;
        }

        .info-display {
            padding: 16px 20px;
            border: 2px solid var(--border-soft);
            border-radius: var(--radius-round);
            font-size: 15px;
            background: var(--bg-cream);
            color: var(--text-light);
            font-family: 'Nunito', sans-serif;
            font-weight: 500;
        }

        @media (max-width: 1024px) {
            .main-layout {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                position: static;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
        }

        @media (max-width: 768px) {
            .content-card {
                padding: 25px;
            }
            .header-content {
                flex-wrap: wrap;
                gap: 15px;
            }
            nav {
                gap: 20px;
            }
            nav a {
                font-size: 14px;
            }
        }

        .status-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            overflow-x: auto;
            padding-bottom: 10px;
            -webkit-overflow-scrolling: touch;
        }
        .status-tabs::-webkit-scrollbar { height: 4px; }
        .status-tabs::-webkit-scrollbar-thumb { background: var(--border-soft); border-radius: 2px; }
        .status-tab {
            padding: 12px 24px;
            border: 2px solid var(--border-soft);
            border-radius: var(--radius-pill);
            background: var(--card-white);
            color: var(--text-medium);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: 'Nunito', sans-serif;
        }
        .status-tab:hover {
            border-color: var(--primary-sunshine);
            color: var(--primary-sunshine);
            transform: translateY(-2px);
        }
        .status-tab.active {
            background: linear-gradient(135deg, var(--primary-sunshine), var(--primary-coral));
            border-color: var(--primary-sunshine);
            color: white;
            box-shadow: 0 6px 20px rgba(255, 179, 71, 0.35);
        }

        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
        }

        .order-card {
            background: var(--card-white);
            border-radius: var(--radius-round);
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-soft);
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }
        .order-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-float);
            border-color: rgba(255, 179, 71, 0.25);
        }
        .order-card.selected {
            border-color: var(--primary-coral);
            box-shadow: 0 0 0 2px rgba(255, 153, 102, 0.3);
        }
        .order-card-content {
            cursor: pointer;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            background: linear-gradient(135deg, rgba(255, 179, 71, 0.05), rgba(255, 153, 102, 0.05));
            border-bottom: 1px solid var(--border-soft);
        }
        .order-hotel {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .order-hotel-image {
            width: 80px;
            height: 60px;
            border-radius: var(--radius-soft);
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }
        .order-hotel-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .order-hotel-name {
            font-family: 'Fredoka', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-warm);
        }
        .order-room-name {
            font-size: 13px;
            color: var(--text-medium);
        }
        .order-status-badge {
            padding: 8px 18px;
            border-radius: var(--radius-pill);
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }
        .status-pending { background: linear-gradient(135deg, #fff4e6, #ffe4cc); color: #f57c00; border: 1px solid #ffb74d; }
        .status-confirmed { background: linear-gradient(135deg, #e3f2fd, #bbdefb); color: #1976d2; border: 1px solid #64b5f6; }
        .status-checked_in_pre { background: linear-gradient(135deg, #f3e5f5, #e1bee7); color: #7b1fa2; border: 1px solid #ba68c8; }
        .status-checked_in { background: linear-gradient(135deg, #e8f5e9, #c8e6c9); color: #388e3c; border: 1px solid #81c784; }
        .status-checked_out { background: linear-gradient(135deg, #e0e0e0, #bdbdbd); color: #616161; border: 1px solid #9e9e9e; }
        .status-cancelled { background: linear-gradient(135deg, #ffebee, #ffcdd2); color: #c62828; border: 1px solid #ef9a9a; }

        .order-body {
            display: flex;
            padding: 24px;
            gap: 24px;
        }
        .order-dates {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 180px;
        }
        .order-date-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .order-date-item i {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-peach);
            color: var(--primary-coral);
            border-radius: 50%;
            font-size: 12px;
        }
        .order-date-item .date-label { font-size: 12px; color: var(--text-light); }
        .order-date-item .date-value { font-size: 14px; font-weight: 600; color: var(--text-warm); }
        .order-nights {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: var(--accent-lemon);
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-warm);
            margin-top: 4px;
        }

        .order-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .order-detail-row {
            display: flex;
            gap: 24px;
            font-size: 14px;
            color: var(--text-medium);
            margin-bottom: 8px;
        }
        .order-detail-row i { color: var(--primary-sunshine); margin-right: 6px; }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            background: var(--bg-cream);
            border-top: 1px solid var(--border-soft);
        }
        .order-price {
            display: flex;
            flex-direction: column;
        }
        .order-price-label { font-size: 12px; color: var(--text-light); }
        .order-price-value {
            font-family: 'Fredoka', sans-serif;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-sunshine), var(--primary-coral));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .order-price-value::before { content: '¥'; font-size: 16px; }

        .order-actions { display: flex; gap: 12px; }
        .btn-secondary {
            background: var(--card-white);
            color: var(--text-medium);
            border: 2px solid var(--border-soft);
        }
        .btn-secondary:hover {
            border-color: var(--primary-sunshine);
            color: var(--primary-sunshine);
            transform: translateY(-2px);
        }
        .btn-outline-danger {
            background: transparent;
            color: var(--text-medium);
            border: 2px solid var(--border-soft);
        }
        .btn-outline-danger:hover {
            border-color: #ef5350;
            color: #ef5350;
            background: rgba(239, 83, 80, 0.05);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: var(--card-white);
            border-radius: var(--radius-round);
            box-shadow: var(--shadow-soft);
        }
        .empty-state i {
            font-size: 72px;
            color: var(--text-light);
            margin-bottom: 20px;
            opacity: 0.5;
        }
        .empty-state h3 {
            font-family: 'Fredoka', sans-serif;
            font-size: 24px;
            color: var(--text-warm);
            margin-bottom: 10px;
        }
        .empty-state p {
            color: var(--text-medium);
            font-size: 15px;
            margin-bottom: 25px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 40px;
        }
        .page-btn {
            padding: 14px 24px;
            border: 2px solid var(--border-soft);
            border-radius: var(--radius-round);
            background: var(--card-white);
            color: var(--text-medium);
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: 'Fredoka', sans-serif;
        }
        .page-btn:hover {
            border-color: var(--primary-sunshine);
            color: var(--primary-sunshine);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 179, 71, 0.15);
        }
        .page-btn.active {
            background: linear-gradient(135deg, var(--primary-sunshine), var(--primary-coral));
            color: white;
            border-color: var(--primary-sunshine);
            box-shadow: 0 6px 20px rgba(255, 179, 71, 0.4);
        }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        .stats-bar {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            justify-content: center;
        }
        .stat-pill {
            padding: 12px 24px;
            background: var(--card-white);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-pill);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .stat-pill-value {
            font-family: 'Fredoka', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: var(--primary-sunshine);
        }
        .stat-pill-label { font-size: 13px; color: var(--text-medium); font-weight: 600; }

        .review-list { display: flex; flex-direction: column; gap: 20px; }
        .review-card {
            background: var(--card-white);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-soft);
            padding: 24px;
            box-shadow: 0 4px 16px rgba(255, 179, 71, 0.05);
            transition: all 0.3s;
        }
        .review-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 179, 71, 0.1);
        }
        .review-card.selected {
            border-color: var(--primary-coral);
            box-shadow: 0 0 0 2px rgba(255, 153, 102, 0.3);
        }
        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        .review-hotel { display: flex; gap: 14px; align-items: center; }
        .review-hotel-image {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            background-size: cover;
            background-position: center;
            background-color: var(--bg-peach);
        }
        .review-hotel-info h3 {
            font-family: 'Fredoka', sans-serif;
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .review-hotel-info p { color: var(--text-light); font-size: 13px; }
        .review-actions { display: flex; gap: 8px; }

        .review-rating { display: flex; gap: 3px; margin-bottom: 12px; }
        .review-rating i { color: var(--star-yellow); font-size: 16px; }
        .review-rating i.empty { color: var(--border-soft); }

        .review-content {
            color: var(--text-medium);
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 14px;
            white-space: pre-wrap;
        }
        .review-images {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .review-images img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .review-images img:hover { transform: scale(1.05); }

        .review-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            border-top: 1px solid var(--border-soft);
            font-size: 13px;
            color: var(--text-light);
        }

        @media (max-width: 768px) {
            .order-header { flex-direction: column; align-items: flex-start; gap: 16px; }
            .order-body { flex-direction: column; }
            .order-dates {
                min-width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 12px;
            }
            .order-footer { flex-direction: column; gap: 20px; }
            .order-actions { width: 100%; flex-wrap: wrap; }
            .order-actions .btn { flex: 1; min-width: 120px; }
            .stats-bar { flex-wrap: wrap; justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="../index.html" class="logo"><i class="fas fa-hotel"></i><span>酒店预订</span></a>
            <nav>
                <a href="../index.html">首页</a>
                <a href="../search.html">酒店搜索</a>
            </nav>
            <div class="user-menu" id="userMenu">
                <a href="login.html" class="btn btn-outline">登录</a>
                <a href="register.html" class="btn btn-primary">注册</a>
            </div>
        </div>
    </header>

    <div class="main-layout">
        <aside class="sidebar" id="sidebar" style="display: none;">
            <div class="sidebar-card">
                <div class="sidebar-header">
                    <div class="sidebar-avatar" id="sidebarAvatar">U</div>
                    <div class="sidebar-name" id="sidebarName">用户名</div>
                    <div class="sidebar-role" id="sidebarRole">会员</div>
                </div>
                <div class="sidebar-menu">
                    <div class="sidebar-item" data-tab="orders" onclick="switchTab('orders')">
                        <i class="fas fa-shopping-bag"></i>
                        <span>我的订单</span>
                    </div>
                    <div class="sidebar-item" data-tab="reviews" onclick="switchTab('reviews')">
                        <i class="fas fa-star"></i>
                        <span>我的评价</span>
                    </div>
                    <div class="sidebar-item active" data-tab="profile" onclick="switchTab('profile')">
                        <i class="fas fa-user"></i>
                        <span>个人信息</span>
                    </div>
                    <div class="sidebar-item" data-tab="guests" onclick="switchTab('guests')">
                        <i class="fas fa-users"></i>
                        <span>常用入住人</span>
                    </div>
                    <div class="dropdown-divider"></div>
                    <div class="sidebar-item danger" onclick="handleLogout()">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>退出登录</span>
                    </div>
                </div>
            </div>
        </aside>

        <main class="content">
            <div class="content-card" id="loginPrompt" style="display: none;">
                <div class="login-prompt">
                    <div class="login-prompt-icon">
                        <i class="fas fa-lock"></i>
                    </div>
                    <h2>请先登录</h2>
                    <p>登录后才能访问个人信息页面</p>
                    <a href="../login.html?redirect=user/profile.html" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt"></i>
                        立即登录
                    </a>
                </div>
            </div>

            <div class="content-card" id="profileContent" style="display: none;">
                <h1 class="content-title">
                    <i class="fas fa-user-circle"></i>
                    个人信息
                </h1>
                <p class="content-subtitle">管理您的账户信息和个人资料</p>

                <form id="profileForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">用户名</label>
                            <input type="text" class="form-input" id="username" disabled placeholder="用户名">
                            <span class="form-hint">用户名不可修改</span>
                        </div>
                        <div class="form-group">
                            <label class="form-label">昵称</label>
                            <input type="text" class="form-input" id="fullName" placeholder="请输入昵称">
                        </div>
                        <div class="form-group">
                            <label class="form-label">手机号</label>
                            <input type="tel" class="form-input" id="phone" placeholder="请输入手机号">
                        </div>
                        <div class="form-group">
                            <label class="form-label">邮箱</label>
                            <input type="email" class="form-input" id="email" placeholder="请输入邮箱">
                        </div>
                        <div class="form-group">
                            <label class="form-label readonly">注册时间</label>
                            <div class="info-display" id="createdAt">-</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label readonly">角色</label>
                            <div class="info-display" id="role">-</div>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i>
                            保存修改
                        </button>
                    </div>
                </form>
            </div>

            <div class="content-card" id="guestContent" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <div>
                        <h1 class="content-title">
                            <i class="fas fa-users"></i>
                            常用入住人
                        </h1>
                        <p class="content-subtitle">管理您的常用入住人信息，预订时可快速选择</p>
                    </div>
                    <button class="btn btn-primary" onclick="openGuestModal()">
                        <i class="fas fa-plus"></i>
                        添加入住人
                    </button>
                </div>

                <div id="guestList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px;">
                </div>

                <div class="empty-state" id="guestEmptyState" style="display: none; text-align: center; padding: 60px;">
                    <div style="width: 80px; height: 80px; border-radius: 50%; background: var(--bg-peach); margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-users" style="font-size: 36px; color: var(--primary-sunshine);"></i>
                    </div>
                    <p style="color: var(--text-light); font-size: 16px;">暂无常用入住人</p>
                    <p style="color: var(--text-light); font-size: 14px; margin-top: 10px;">添加常用入住人后，预订时可快速选择</p>
                    <button class="btn btn-primary" onclick="openGuestModal()" style="margin-top: 20px;">
                        <i class="fas fa-plus"></i>
                        添加入住人
                    </button>
                </div>
            </div>

            <div class="content-card" id="ordersContent" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <div>
                        <h1 class="content-title">
                            <i class="fas fa-shopping-bag"></i>
                            我的订单
                        </h1>
                        <p class="content-subtitle">查看和管理您的所有订单</p>
                    </div>
                </div>

                <div class="status-tabs" id="orderStatusTabs">
                    <button class="status-tab active" data-status="">全部</button>
                    <button class="status-tab" data-status="pending">待支付</button>
                    <button class="status-tab" data-status="confirmed">已确认</button>
                    <button class="status-tab" data-status="checked_in_pre">待入住</button>
                    <button class="status-tab" data-status="checked_in">已入住</button>
                    <button class="status-tab" data-status="checked_out">已完成</button>
                    <button class="status-tab" data-status="cancelled">已取消</button>
                </div>

                <div class="order-toolbar" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                    <div class="order-search" style="position:relative;flex:1;max-width:300px;">
                        <input type="text" id="orderSearchInput" placeholder="搜索酒店名称..." 
                               style="width:100%;padding:10px 16px 10px 40px;border:2px solid var(--border-soft);border-radius:20px;font-size:14px;outline:none;transition:all 0.3s;"
                               oninput="handleOrderSearch(this.value)">
                        <i class="fas fa-search" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-light);"></i>
                    </div>
                    <div style="display:flex;align-items:center;gap:15px;">
                        <div class="sort-controls" style="display:flex;align-items:center;gap:8px;">
                            <label style="font-weight:600;color:var(--text-medium);font-size:14px;">排序：</label>
                            <select id="orderSortSelect" onchange="onOrderSortChange()" style="padding:8px 16px;border-radius:20px;border:1px solid var(--border-soft);background:white;font-size:14px;cursor:pointer;">
                                <option value="created_at-desc">下单时间（最新优先）</option>
                                <option value="created_at-asc">下单时间（最早优先）</option>
                                <option value="check_in_date-desc">入住时间（最近优先）</option>
                                <option value="check_in_date-asc">入住时间（最远优先）</option>
                            </select>
                        </div>
                        <div class="order-batch-actions" id="orderBatchActions" style="display:none;gap:10px;">
                            <span id="selectedOrderCount" style="color:var(--text-medium);font-size:14px;">已选择 <b>0</b> 项</span>
                            <button class="btn btn-outline-danger" onclick="batchCancelOrders()">
                                <i class="fas fa-trash-alt"></i> 批量取消
                            </button>
                            <button class="btn btn-outline" onclick="clearOrderSelection()">清除选择</button>
                        </div>
                    </div>
                </div>

                <div id="ordersContainer"></div>
                <div class="pagination" id="orderPagination"></div>
            </div>

            <div class="content-card" id="reviewsContent" style="display: none;">
                <div>
                    <h1 class="content-title">
                        <i class="fas fa-star"></i>
                        我的评价
                    </h1>
                    <p class="content-subtitle">查看您提交的所有酒店评价</p>
                </div>

                <div class="stats-bar" id="reviewStatsBar"></div>
                <div class="review-list" id="reviewList">
                    <div style="text-align:center;padding:40px;color:var(--text-light);"><i class="fas fa-spinner fa-spin" style="font-size:32px;"></i></div>
                </div>
            </div>
        </main>
    </div>

    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">保存成功</span>
    </div>

    <div class="modal-overlay" id="guestModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div class="modal-content" style="background: white; border-radius: var(--radius-soft); padding: 40px; width: 480px; max-width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.2);">
            <h2 style="font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 700; color: var(--text-warm); margin-bottom: 30px; display: flex; align-items: center; gap: 10px;">
                <i class="fas fa-user-plus" style="color: var(--primary-sunshine);"></i>
                <span id="modalTitle">添加常用入住人</span>
            </h2>
            
            <form id="guestForm">
                <input type="hidden" id="guestId">
                
                <div class="form-group">
                    <label class="form-label">姓名 <span style="color: #c62828;">*</span></label>
                    <input type="text" class="form-input" id="guestNameInput" placeholder="请输入姓名">
                </div>
                
                <div class="form-group">
                    <label class="form-label">身份证号码 <span style="color: #c62828;">*</span></label>
                    <input type="text" class="form-input" id="guestIdCardInput" placeholder="请输入身份证号码" maxlength="18">
                </div>
                
                <div class="form-group">
                    <label class="form-label">联系电话 <span style="color: #c62828;">*</span></label>
                    <input type="tel" class="form-input" id="guestPhoneInput" placeholder="请输入联系电话">
                </div>
                
                <div class="form-group">
                    <label class="form-label">备注</label>
                    <input type="text" class="form-input" id="guestRemarkInput" placeholder="如：家人、朋友等（选填）">
                </div>
                
                <div class="form-group" style="display: flex; align-items: center; gap: 12px;">
                    <input type="checkbox" id="guestIsDefault" style="width: 20px; height: 20px; cursor: pointer;">
                    <label style="font-weight: 600; color: var(--text-medium); cursor: pointer;">设为默认入住人</label>
                </div>
                
                <div style="display: flex; gap: 12px; margin-top: 30px;">
                    <button type="button" class="btn btn-outline" onclick="closeGuestModal()" style="flex: 1;">取消</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        async function loadProfile() {
            try {
                const res = await Auth.fetchWithAuth('/api/users/profile');
                const data = await res.json();
                
                if (data.success && data.data) {
                    const user = data.data;
                    document.getElementById('username').value = user.username || '';
                    document.getElementById('fullName').value = user.full_name || '';
                    document.getElementById('phone').value = user.phone || '';
                    document.getElementById('email').value = user.email || '';
                    document.getElementById('createdAt').textContent = user.created_at ? formatDate(user.created_at) : '-';
                    document.getElementById('role').textContent = getRoleText(user.role);
                    
                    document.getElementById('sidebarAvatar').textContent = (user.full_name || user.username || 'U').charAt(0).toUpperCase();
                    document.getElementById('sidebarName').textContent = user.full_name || user.username || '用户';
                    document.getElementById('sidebarRole').textContent = getRoleText(user.role);
                    
                    Auth.login(user);
                } else {
                    showLoginRequired();
                }
            } catch (e) {
                showLoginRequired();
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        function getRoleText(role) {
            const map = {
                'admin': '管理员',
                'hotel_admin': '酒店管理员',
                'user': '会员'
            };
            return map[role] || '会员';
        }

        function showLoginRequired() {
            document.getElementById('loginPrompt').style.display = 'block';
            document.getElementById('sidebar').style.display = 'none';
            document.getElementById('profileContent').style.display = 'none';
            document.getElementById('guestContent').style.display = 'none';
        }

        function switchTab(tabName) {
            document.getElementById('profileContent').style.display = 'none';
            document.getElementById('guestContent').style.display = 'none';
            document.getElementById('ordersContent').style.display = 'none';
            document.getElementById('reviewsContent').style.display = 'none';
            
            if (tabName === 'profile') {
                document.getElementById('profileContent').style.display = 'block';
            } else if (tabName === 'guests') {
                document.getElementById('guestContent').style.display = 'block';
                loadGuestList();
            } else if (tabName === 'orders') {
                document.getElementById('ordersContent').style.display = 'block';
                loadOrders();
            } else if (tabName === 'reviews') {
                document.getElementById('reviewsContent').style.display = 'block';
                loadReviews();
            }
            
            document.querySelectorAll('.sidebar-item[data-tab]').forEach(item => {
                item.classList.remove('active');
            });
            const activeItem = document.querySelector(`.sidebar-item[data-tab="${tabName}"]`);
            if (activeItem) {
                activeItem.classList.add('active');
            }
        }

        async function updateProfile(e) {
            e.preventDefault();
            
            const data = {
                full_name: document.getElementById('fullName').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                email: document.getElementById('email').value.trim()
            };
            
            try {
                const res = await Auth.fetchWithAuth('/api/users/profile', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await res.json();
                
                if (result.success) {
                    showToast('保存成功', 'success');
                    loadProfile();
                } else {
                    showToast(result.error || '保存失败', 'error');
                }
            } catch (e) {
                showToast('保存失败，请稍后重试', 'error');
            }
        }

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            
            toast.className = 'toast ' + type + ' show';
            toastMessage.textContent = message;
            
            if (type === 'success') {
                toast.querySelector('i').className = 'fas fa-check-circle';
            } else {
                toast.querySelector('i').className = 'fas fa-exclamation-circle';
            }
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        async function handleLogout() {
            try {
                await Auth.fetchWithAuth('/api/auth/logout', { method: 'POST' });
            } catch (e) {
                // ignore
            }
            Auth.logout();
            window.location.href = 'index.html';
        }

        function updateUserMenu() {
            const user = Auth.getUser();
            const userMenu = document.getElementById('userMenu');
            
            if (user) {
                userMenu.innerHTML = `
                    <div class="user-dropdown" onclick="toggleUserDropdown()">
                        <div class="user-avatar">${(user.full_name || user.username || 'U').charAt(0).toUpperCase()}</div>
                        <span class="user-name">${user.full_name || user.username}</span>
                        <i class="fas fa-chevron-down" style="color: var(--text-light); font-size: 12px;"></i>
                    </div>
                    <div class="user-dropdown-menu" id="userDropdownMenu">
                        <a href="profile.html?tab=orders" class="dropdown-item">
                            <i class="fas fa-shopping-bag"></i>
                            <span>我的订单</span>
                        </a>
                        <a href="profile.html?tab=reviews" class="dropdown-item">
                            <i class="fas fa-star"></i>
                            <span>我的评价</span>
                        </a>
                        <a href="profile.html?tab=profile" class="dropdown-item">
                            <i class="fas fa-user"></i>
                            <span>个人信息</span>
                        </a>
                        <div class="dropdown-divider"></div>
                        <div class="dropdown-item" onclick="handleLogout()">
                            <i class="fas fa-sign-out-alt"></i>
                            <span>退出登录</span>
                        </div>
                    </div>
                `;
            } else {
                userMenu.innerHTML = `
                    <a href="login.html" class="btn btn-outline">登录</a>
                    <a href="register.html" class="btn btn-primary">注册</a>
                `;
            }
        }

        function toggleUserDropdown() {
            const menu = document.getElementById('userDropdownMenu');
            menu.classList.toggle('show');
            
            document.addEventListener('click', function closeDropdown(e) {
                if (!e.target.closest('.user-dropdown')) {
                    menu.classList.remove('show');
                    document.removeEventListener('click', closeDropdown);
                }
            });
        }

        document.getElementById('profileForm').addEventListener('submit', updateProfile);
        document.getElementById('guestForm').addEventListener('submit', saveGuest);

        async function init() {
            updateUserMenu();
            
            try {
                const res = await Auth.fetchWithAuth('/api/auth/me');
                const data = await res.json();
                
                if (data.success && data.data) {
                    // 显示侧边栏
                    document.getElementById('loginPrompt').style.display = 'none';
                    document.getElementById('sidebar').style.display = 'block';
                    
                    const params = new URLSearchParams(window.location.search);
                    const tab = params.get('tab') || 'profile';
                    
                    if (tab === 'guests') {
                        switchTab('guests');
                    } else if (tab === 'orders') {
                        switchTab('orders');
                    } else if (tab === 'reviews') {
                        switchTab('reviews');
                    } else {
                        switchTab('profile');
                        loadProfile();
                    }
                } else {
                    showLoginRequired();
                }
            } catch (e) {
                showLoginRequired();
            }
        }

        function openGuestModal(guest) {
            const modal = document.getElementById('guestModal');
            const title = document.getElementById('modalTitle');

            if (guest) {
                title.textContent = '编辑常用入住人';
                document.getElementById('guestId').value = guest.id;
                document.getElementById('guestNameInput').value = guest.name || '';
                // 编辑时使用完整的身份证号和手机号
                document.getElementById('guestIdCardInput').value = guest.idCardFull || guest.idCard || '';
                document.getElementById('guestPhoneInput').value = guest.phoneFull || guest.phone || '';
                document.getElementById('guestRemarkInput').value = guest.remark || '';
                document.getElementById('guestIsDefault').checked = guest.isDefault || false;
            } else {
                title.textContent = '添加常用入住人';
                document.getElementById('guestId').value = '';
                document.getElementById('guestNameInput').value = '';
                document.getElementById('guestIdCardInput').value = '';
                document.getElementById('guestPhoneInput').value = '';
                document.getElementById('guestRemarkInput').value = '';
                document.getElementById('guestIsDefault').checked = false;
            }

            modal.style.display = 'flex';
        }

        function closeGuestModal() {
            document.getElementById('guestModal').style.display = 'none';
        }

        async function saveGuest(e) {
            e.preventDefault();

            const id = document.getElementById('guestId').value;
            const name = document.getElementById('guestNameInput').value.trim();
            const idCard = document.getElementById('guestIdCardInput').value.trim();
            const phone = document.getElementById('guestPhoneInput').value.trim();
            const remark = document.getElementById('guestRemarkInput').value.trim();
            const isDefault = document.getElementById('guestIsDefault').checked;

            if (!name) {
                showToast('请输入姓名', 'error');
                return;
            }
            if (!idCard) {
                showToast('请输入身份证号码', 'error');
                return;
            }
            if (!/^\d{17}[\dXx]$/.test(idCard)) {
                showToast('请输入正确的身份证号码', 'error');
                return;
            }
            if (!phone) {
                showToast('请输入联系电话', 'error');
                return;
            }

            try {
                let url = '/api/guest-info/add';
                let method = 'POST';

                if (id) {
                    url = `/api/guest-info/${id}`;
                    method = 'PUT';
                }

                const res = await Auth.fetchWithAuth(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, idCard, phone, remark, isDefault })
                });

                const data = await res.json();

                if (data.success) {
                    showToast(id ? '更新成功' : '添加成功', 'success');
                    closeGuestModal();
                    loadGuestList();
                } else {
                    showToast(data.message || '操作失败', 'error');
                }
            } catch (e) {
                showToast('网络错误', 'error');
            }
        }

        function editGuest(guest) {
            openGuestModal(guest);
        }

        async function deleteGuest(id) {
            if (!confirm('确定要删除这个常用入住人吗？')) return;
            
            try {
                const res = await Auth.fetchWithAuth(`/api/guest-info/${id}`, {
                    method: 'DELETE'
                });
                
                const data = await res.json();
                
                if (data.success) {
                    showToast('删除成功', 'success');
                    loadGuestList();
                } else {
                    showToast(data.message || '删除失败', 'error');
                }
            } catch (e) {
                showToast('网络错误', 'error');
            }
        }

        async function setDefaultGuest(id) {
            try {
                const res = await Auth.fetchWithAuth(`/api/guest-info/${id}/set-default`, {
                    method: 'POST'
                });

                const data = await res.json();

                if (data.success) {
                    showToast('已设为默认入住人', 'success');

                } else {
                    showToast(data.message || '操作失败', 'error');
                }

                showToast('网络错误', 'error');
