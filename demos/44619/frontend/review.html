<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>评价 - 酒店预订系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans SC', sans-serif; background-color: #f8f9fa; }
        
        header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: white; padding: 15px 0; }
        .header-content { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .logo { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        nav { display: flex; gap: 20px; }
        nav a { color: white; text-decoration: none; font-size: 14px; }

        .container { max-width: 600px; margin: 0 auto; padding: 30px 20px; }
        .review-card { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 2px 15px rgba(0,0,0,0.08); }
        
        .card-title { font-size: 20px; font-weight: 600; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        
        .rating-section { margin-bottom: 25px; }
        .rating-label { font-size: 14px; color: #666; margin-bottom: 15px; }
        .star-rating { display: flex; gap: 15px; }
        .star-rating i { font-size: 36px; color: #ddd; cursor: pointer; transition: color 0.3s; }
        .star-rating i.active { color: #f39c12; }
        
        .review-content { margin-bottom: 25px; }
        .review-content label { display: block; font-size: 14px; color: #666; margin-bottom: 10px; }
        textarea { width: 100%; height: 150px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; resize: none; }
        textarea:focus { outline: none; border-color: #f39c12; }
        
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); }
        
        .success-message { background: #e8f5e9; color: #2e7d32; padding: 15px; border-radius: 8px; text-align: center; }
    </style>
    <script src="js/auth.js"></script>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-hotel"></i>
                <span>酒店预订系统</span>
            </div>
            <nav>
                <a href="index.html">首页</a>
                <a href="user/profile.html?tab=orders">我的订单</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="review-card">
            <div class="card-title">评价酒店</div>
            
            <div id="message"></div>
            
            <form id="reviewForm">
                <div class="rating-section">
                    <div class="rating-label">评分</div>
                    <div class="star-rating" id="starRating">
                        <i class="fas fa-star" data-rating="1"></i>
                        <i class="fas fa-star" data-rating="2"></i>
                        <i class="fas fa-star" data-rating="3"></i>
                        <i class="fas fa-star" data-rating="4"></i>
                        <i class="fas fa-star" data-rating="5"></i>
                    </div>
                </div>
                
                <div class="review-content">
                    <label>评价内容</label>
                    <textarea id="reviewContent" placeholder="分享您的入住体验..."></textarea>
                </div>
                
                <button type="submit" class="btn btn-primary">提交评价</button>
            </form>
        </div>
    </div>

    <script>
        if (window.Auth) {
            Auth.updateHeaderNav();
        }

        const bookingId = new URLSearchParams(window.location.search).get('bookingId');
        let selectedRating = 0;

        document.querySelectorAll('.star-rating i').forEach(star => {
            star.addEventListener('click', () => {
                selectedRating = parseInt(star.dataset.rating);
                document.querySelectorAll('.star-rating i').forEach(s => {
                    if (parseInt(s.dataset.rating) <= selectedRating) {
                        s.classList.add('active');
                    } else {
                        s.classList.remove('active');
                    }
                });
            });
        });

        document.getElementById('reviewForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const content = document.getElementById('reviewContent').value;
            
            if (selectedRating === 0) {
                alert('请选择评分');
                return;
            }

            try {
                const res = await Auth.fetchWithAuth('/api/reviews', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        booking_id: parseInt(bookingId),
                        rating: selectedRating,
                        content: content
                    })
                });
                const data = await res.json();
                
                if (data.success) {
                    document.querySelector('.review-card').innerHTML = `
                        <div class="success-message">
                            <i class="fas fa-check-circle" style="font-size:48px;margin-bottom:10px;"></i>
                            <p>评价提交成功！</p>
                            <p style="font-size:14px;margin-top:10px;"><a href="user/profile.html?tab=orders" style="color:#2e7d32;">返回订单列表</a></p>
                        </div>
                    `;
                } else {
                    alert(data.error || '提交失败');
                }
            } catch (e) {
                alert('提交失败，请先登录');
            }
        });
    </script>
</body>
</html>
