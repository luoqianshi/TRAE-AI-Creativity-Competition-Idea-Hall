<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 酒店预订管理系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-cream: #fefdf7;
            --bg-peach: #fff8f3;
            --bg-mint: #f0fffa;
            --bg-lavender: #f5f3ff;
            --card-white: #ffffff;
            --border-soft: #f0e6d8;
            --primary-sunshine: #ffb347;
            --primary-coral: #ff9966;
            --secondary-lavender: #b39ddb;
            --secondary-sky: #81d4fa;
            --accent-pink: #ffb7b2;
            --accent-mint: #a8e6cf;
            --accent-lemon: #fff4a3;
            --text-warm: #5d4037;
            --text-medium: #8d6e63;
            --text-light: #bdbdbd;
            --shadow-soft: 0 8px 24px rgba(255, 179, 71, 0.06);
            --shadow-float: 0 12px 32px rgba(255, 179, 71, 0.12);
            --star-yellow: #ffd700;
            --radius-soft: 24px;
            --radius-round: 32px;
            --radius-pill: 40px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, var(--bg-cream) 0%, var(--bg-peach) 50%, var(--bg-lavender) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container { 
            background: var(--card-white); 
            border-radius: var(--radius-round); 
            padding: 50px; 
            width: 420px; 
            box-shadow: 0 20px 60px rgba(255, 179, 71, 0.15);
            border: 1px solid var(--border-soft);
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -20%;
            width: 80%;
            height: 100%;
            background: radial-gradient(circle at center, var(--accent-lemon) 0%, transparent 50%);
            opacity: 0.5;
            pointer-events: none;
        }

        .logo { text-align: center; margin-bottom: 35px; position: relative; z-index: 1; }
        .logo-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--primary-sunshine) 0%, var(--primary-coral) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 30px rgba(255, 179, 71, 0.4);
            animation: bounce 2s ease-in-out infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .logo-icon i { font-size: 48px; color: white; }
        .logo h1 { 
            font-family: 'Fredoka', sans-serif;
            font-size: 28px; 
            margin-top: 10px; 
            background: linear-gradient(135deg, var(--primary-sunshine) 0%, var(--primary-coral) 50%, var(--accent-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
        }
        
        .form-group { margin-bottom: 24px; position: relative; z-index: 1; }
        .form-group label { 
            display: block; 
            font-size: 15px; 
            color: var(--text-warm); 
            margin-bottom: 10px;
            font-weight: 600;
        }
        .form-group input { 
            width: 100%; 
            padding: 16px 18px; 
            border: 2px solid var(--border-soft); 
            border-radius: var(--radius-soft); 
            font-size: 15px;
            background: var(--card-white);
            color: var(--text-warm);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: 'Nunito', sans-serif;
        }
        .form-group input:focus { 
            outline: none; 
            border-color: var(--primary-sunshine); 
            box-shadow: 0 6px 24px rgba(255, 179, 71, 0.25);
            transform: translateY(-2px);
        }
        .form-group input::placeholder { color: var(--text-light); }
        
        .btn { 
            width: 100%; 
            padding: 18px; 
            border: none; 
            border-radius: var(--radius-round); 
            font-size: 17px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: 'Fredoka', sans-serif;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }
        .btn-primary { 
            background: linear-gradient(135deg, var(--primary-sunshine) 0%, var(--primary-coral) 100%); 
            color: white;
            box-shadow: 0 8px 25px rgba(255, 179, 71, 0.4);
        }
        .btn-primary:hover { 
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 14px 35px rgba(255, 179, 71, 0.5);
        }
        
        .links { display: flex; justify-content: center; margin-top: 25px; font-size: 14px; position: relative; z-index: 1; }
        .links a { color: var(--text-medium); text-decoration: none; font-weight: 600; }
        .links a:hover { color: var(--primary-coral); }
        
        .error-message { 
            background: #ffebee; 
            color: #c62828; 
            padding: 14px 18px; 
            border-radius: var(--radius-soft); 
            margin-bottom: 20px; 
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            z-index: 1;
        }
        .success-message { 
            background: #e8f5e9; 
            color: #2e7d32; 
            padding: 14px 18px; 
            border-radius: var(--radius-soft); 
            margin-bottom: 20px; 
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            z-index: 1;
        }

        @media (max-width: 480px) {
            .login-container { width: 90%; padding: 35px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-hotel"></i>
            </div>
            <h1>酒店预订</h1>
        </div>
        
        <div id="message"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="请输入密码">
            </div>
            <button type="submit" class="btn btn-primary">登 录</button>
            <div class="links">
                <a href="register.html">还没有账号？立即注册</a>
            </div>
        </form>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                showMessage('请填写用户名和密码', 'error');
                return;
            }

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (data.success) {
                    Auth.login(data.data);
                    showMessage('登录成功', 'success');
                    
                    const redirect = new URLSearchParams(window.location.search).get('redirect');
                    setTimeout(() => {
                        const userRole = data.data.role;
                        if (userRole === 'super_admin' || userRole === 'SUPER_ADMIN') {
                            window.location.href = redirect || 'super-admin/index.html';
                        } else if (userRole === 'hotel_admin' || userRole === 'HOTEL_ADMIN') {
                            window.location.href = redirect || 'admin/index.html';
                        } else {
                            window.location.href = redirect || 'user/profile.html';
                        }
                    }, 1000);
                } else {
                    showMessage(data.message || data.error || '登录失败', 'error');
                }
            } catch (e) {
                showMessage('网络错误: ' + e.message, 'error');
            }
        });

        function showMessage(msg, type) {
            const div = document.getElementById('message');
            div.innerHTML = `<div class="${type}-message"><i class="fas fa-${type === 'success' ? 'check-circle' : 'alert-circle'}"></i> ${msg}</div>`;
        }
    </script>
</body>
</html>
