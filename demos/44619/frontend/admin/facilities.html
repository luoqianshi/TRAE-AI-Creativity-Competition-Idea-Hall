<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酒店设施管理</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
    :root {
        --bg-cream: #fefdf7;--bg-peach: #fff8f3;--card-white: #ffffff;--border-soft: #f0e6d8;--primary-sunshine: #ffb347;--primary-coral: #ff9966;--text-warm: #5d4037;--text-medium: #8d6e63;--text-light: #bdbdbd;--radius-soft: 24px;--radius-round: 32px;--radius-pill: 40px;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Nunito','Noto Sans SC',sans-serif;background:linear-gradient(180deg,var(--bg-cream) 0%,var(--bg-peach) 100%);color:var(--text-warm);min-height:100vh;display:flex;}
    .sidebar{width:260px;background:rgba(255,255,255,0.98);backdrop-filter:blur(20px);border-right:1px solid rgba(255,179,71,0.15);padding:24px 0;position:fixed;left:0;top:0;bottom:0;z-index:100;}
    .sidebar-logo{font-family:'Fredoka',sans-serif;font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--primary-sunshine),var(--primary-coral));-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:10px;padding:0 24px 24px;border-bottom:1px solid var(--border-soft);margin-bottom:20px;}
    .sidebar-logo i{color:var(--primary-sunshine);font-size:28px;}
    .sidebar-menu{list-style:none;padding:0 16px;}
    .sidebar-menu li{margin-bottom:8px;}
    .sidebar-menu a{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius-soft);text-decoration:none;color:var(--text-medium);font-weight:600;font-size:15px;transition:all 0.3s;}
    .sidebar-menu a:hover{background:var(--bg-peach);color:var(--primary-sunshine);transform:translateX(4px);}
    .sidebar-menu a.active{background:linear-gradient(135deg,rgba(255,179,71,0.15),rgba(255,153,102,0.15));color:var(--primary-sunshine);}
    .sidebar-menu a i{font-size:18px;width:24px;text-align:center;}
    .sidebar-footer{position:absolute;bottom:24px;left:0;right:0;padding:0 16px;border-top:1px solid var(--border-soft);}
    .sidebar-footer a{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius-soft);text-decoration:none;color:var(--text-light);font-size:14px;transition:all 0.3s;}
    .sidebar-footer a:hover{color:var(--primary-coral);background:rgba(255,183,178,0.1);}
    .main-content{flex:1;margin-left:260px;padding:24px;min-height:100vh;}
    .page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;}
    .page-header h1{font-family:'Fredoka',sans-serif;font-size:32px;font-weight:800;background:linear-gradient(135deg,#5d4037,#8d6e63);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .btn{padding:10px 26px;border-radius:var(--radius-pill);text-decoration:none;font-size:15px;font-weight:600;transition:all 0.3s;font-family:'Nunito',sans-serif;border:none;cursor:pointer;}
    .btn-primary{background:linear-gradient(135deg,var(--primary-sunshine),var(--primary-coral));color:white;box-shadow:0 8px 25px rgba(255,179,71,0.4);}
    .btn-primary:hover{transform:translateY(-4px);box-shadow:0 14px 35px rgba(255,179,71,0.5);}
    .btn-outline{border:2px solid var(--border-soft);color:var(--text-medium);background:white;}
    .btn-outline:hover{border-color:var(--primary-sunshine);color:var(--primary-sunshine);transform:translateY(-2px);}
    .btn-sm{padding:6px 16px;font-size:12px;}
    .content-card{background:var(--card-white);border:1px solid var(--border-soft);border-radius:var(--radius-soft);padding:28px;box-shadow:0 8px 24px rgba(255,179,71,0.06);margin-bottom:20px;}
    .content-card h3{font-family:'Fredoka',sans-serif;font-size:20px;font-weight:700;margin-bottom:24px;display:flex;align-items:center;gap:10px;color:var(--text-warm);}
    .content-card h3 i{color:var(--primary-sunshine);}
    .facility-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;}
    .facility-card{padding:20px;background:var(--bg-peach);border-radius:var(--radius-soft);border:2px solid var(--border-soft);transition:all 0.3s;}
    .facility-card:hover{transform:translateY(-4px);box-shadow:0 8px 25px rgba(255,179,71,0.2);border-color:var(--primary-sunshine);}
    .facility-image{width:100%;height:160px;border-radius:var(--radius-round);background:var(--border-soft);margin-bottom:12px;overflow:hidden;}
    .facility-image img{width:100%;height:100%;object-fit:cover;}
    .facility-image.placeholder{color:var(--text-light);font-size:32px;display:flex;align-items:center;justify-content:center;}
    .facility-icon{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--primary-sunshine),var(--primary-coral));display:flex;align-items:center;justify-content:center;font-size:24px;color:white;margin-bottom:12px;}
    .facility-name{font-size:18px;font-weight:700;color:var(--text-warm);margin-bottom:6px;}
    .facility-desc{font-size:13px;color:var(--text-medium);margin-bottom:8px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .facility-category{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--radius-pill);font-size:11px;font-weight:600;background:rgba(79,195,247,0.15);color:#0288d1;margin-bottom:8px;}
    .facility-status{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;cursor:pointer;transition:all 0.3s;}
    .facility-status.available{background:rgba(168,230,207,0.2);color:#2e7d32;}
    .facility-status.available:hover{background:rgba(168,230,207,0.4);}
    .facility-status.unavailable{background:rgba(255,183,178,0.2);color:#c62828;}
    .facility-status.unavailable:hover{background:rgba(255,183,178,0.4);}
    .facility-actions{display:flex;gap:6px;margin-top:12px;}
    .action-btn{padding:6px 14px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;text-decoration:none;transition:all 0.3s;border:none;cursor:pointer;}
    .action-btn.edit{background:rgba(79,195,247,0.2);color:#0288d1;}
    .action-btn.edit:hover{background:rgba(79,195,247,0.3);transform:translateY(-2px);}
    .action-btn.delete{background:rgba(255,183,178,0.2);color:#c62828;}
    .action-btn.delete:hover{background:rgba(255,183,178,0.3);transform:translateY(-2px);}
    .hotel-selector{margin-bottom:16px;}
    .hotel-selector label{font-size:13px;color:var(--text-light);font-weight:600;margin-bottom:8px;display:block;}
    .hotel-selector select{width:200px;padding:12px 16px;border:2px solid var(--border-soft);border-radius:var(--radius-round);font-size:14px;background:var(--bg-peach);color:var(--text-warm);font-family:'Nunito',sans-serif;font-weight:500;cursor:pointer;}
    .hotel-selector select:focus{outline:none;border-color:var(--primary-sunshine);box-shadow:0 6px 24px rgba(255,179,71,0.2);background:white;}
    .filter-bar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
    .filter-bar select{padding:10px 14px;border:2px solid var(--border-soft);border-radius:var(--radius-round);font-size:14px;background:white;color:var(--text-warm);font-family:'Nunito',sans-serif;font-weight:500;cursor:pointer;}
    .filter-bar select:focus{outline:none;border-color:var(--primary-sunshine);}
    .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;}
    .modal.show{display:flex;}
    .modal-content{background:white;border-radius:var(--radius-soft);padding:28px;width:550px;max-width:90%;max-height:90vh;overflow-y:auto;}
    .modal-header{font-family:'Fredoka',sans-serif;font-size:20px;font-weight:700;margin-bottom:20px;}
    .form-group{margin-bottom:16px;}
    .form-group label{display:block;font-size:14px;font-weight:600;color:var(--text-warm);margin-bottom:8px;}
    .form-group input,.form-group textarea,.form-group select{width:100%;padding:12px 16px;border:2px solid var(--border-soft);border-radius:var(--radius-round);font-size:15px;font-family:'Nunito',sans-serif;}
    .form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:var(--primary-sunshine);}
    .form-group .image-upload{border:2px dashed var(--border-soft);border-radius:var(--radius-round);padding:24px;text-align:center;cursor:pointer;transition:all 0.3s;}
    .form-group .image-upload:hover{border-color:var(--primary-sunshine);background:var(--bg-peach);}
    .form-group .image-upload.has-image{border-style:solid;border-color:var(--border-soft);padding:12px;}
    .form-group .image-upload.has-image:hover{border-color:var(--primary-sunshine);}
    .form-group .image-preview{width:100%;height:180px;border-radius:var(--radius-round);object-fit:cover;margin-bottom:12px;display:none;}
    .form-group .image-preview.show{display:block;}
    .form-group .image-placeholder{color:var(--text-light);font-size:28px;margin-bottom:8px;}
    .form-group .image-upload input[type="file"]{display:none;}
    .modal-footer{display:flex;justify-content:flex-end;gap:12px;margin-top:20px;}
    .empty-state{text-align:center;padding:60px;color:var(--text-light);}
    .empty-state i{font-size:48px;margin-bottom:16px;color:var(--border-soft);}
    .empty-state p{font-size:16px;}
    .toast{position:fixed;top:24px;right:24px;padding:16px 24px;border-radius:var(--radius-soft);font-weight:600;font-size:15px;z-index:3000;animation:slideInRight 0.3s ease-out;box-shadow:0 8px 25px rgba(0,0,0,0.15);}
    .toast.success{background:linear-gradient(135deg,#a8e6cf,#81c784);color:white;}
    .toast.error{background:linear-gradient(135deg,#ffb7b2,#ff8a80);color:white;}
    @keyframes slideInRight{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo"><i class="fas fa-hotel"></i><span>酒店管理</span></div>
        <ul class="sidebar-menu">
            <li><a href="index.html"><i class="fas fa-chart-pie"></i> 仪表盘</a></li>
            <li><a href="analytics.html"><i class="fas fa-chart-line"></i> 数据分析</a></li>
            <li><a href="hotel-info.html"><i class="fas fa-building"></i> 酒店信息</a></li>
            <li><a href="room-types.html"><i class="fas fa-bed"></i> 房型管理</a></li>
            <li><a href="room-sales.html"><i class="fas fa-chart-bar"></i> 房型销售</a></li>
            <li><a href="orders.html"><i class="fas fa-receipt"></i> 订单管理</a></li>
            <li><a href="reviews.html"><i class="fas fa-star"></i> 评价管理</a></li>
            <li><a href="notifications.html"><i class="fas fa-bell"></i> 消息通知</a></li>
            <li><a href="checkin.html"><i class="fas fa-clipboard-check"></i> 入住管理</a></li>
            <li><a href="facilities.html" class="active"><i class="fas fa-concierge-bell"></i> 设施管理</a></li>
        </ul>
        <div class="sidebar-footer"><a href="#" onclick="Auth.logout()"><i class="fas fa-sign-out-alt"></i> 退出登录</a></div>
    </aside>
    <main class="main-content">
        <div class="page-header"><h1>酒店设施管理</h1><button class="btn btn-primary" onclick="openAddModal()"><i class="fas fa-plus"></i> 添加设施</button></div>
        <div class="hotel-selector"><label>选择酒店</label><select id="hotelSelect" onchange="loadFacilities()"><option value="">请选择酒店</option></select></div>
        <div class="filter-bar">
            <select id="categoryFilter" onchange="loadFacilities()">
                <option value="">全部分类</option>
                <option value="休闲设施">休闲设施</option>
                <option value="商务设施">商务设施</option>
                <option value="餐饮设施">餐饮设施</option>
                <option value="服务设施">服务设施</option>
                <option value="安全设施">安全设施</option>
            </select>
            <select id="statusFilter" onchange="loadFacilities()">
                <option value="">全部状态</option>
                <option value="true">可用</option>
                <option value="false">不可用</option>
            </select>
        </div>
        <div class="content-card">
            <h3><i class="fas fa-concierge-bell"></i> 设施列表</h3>
            <div class="facility-grid" id="facilityGrid"></div>
        </div>
    </main>
    <div class="modal" id="facilityModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">添加设施</div>
            <div class="modal-body">
                <input type="hidden" id="facilityId">
                <input type="hidden" id="facilityImageUrl">
                <div class="form-group">
                    <label>设施名称 <span style="color:red;">*</span></label>
                    <input type="text" id="facilityName" placeholder="请输入设施名称（1-100字符）" maxlength="100">
                </div>
                <div class="form-group">
                    <label>设施分类 <span style="color:red;">*</span></label>
                    <select id="facilityCategory">
                        <option value="">请选择分类</option>
                        <option value="休闲设施">休闲设施</option>
                        <option value="商务设施">商务设施</option>
                        <option value="餐饮设施">餐饮设施</option>
                        <option value="服务设施">服务设施</option>
                        <option value="安全设施">安全设施</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>设施描述</label>
                    <textarea id="facilityDesc" rows="3" placeholder="请输入设施描述（最多500字符）" maxlength="500"></textarea>
                </div>
                <div class="form-group">
                    <label>设施图片</label>
                    <div class="image-upload" id="imageUpload" onclick="document.getElementById('facilityImageFile').click()">
                        <img id="facilityImagePreview" class="image-preview" src="">
                        <div id="imagePlaceholder">
                            <i class="fas fa-image image-placeholder"></i>
                            <p style="font-size:14px;color:var(--text-light);">点击上传图片（支持JPG/PNG，最大2MB）</p>
                        </div>
                        <input type="file" id="facilityImageFile" accept="image/jpeg,image/png" onchange="handleImageSelect(this)">
                    </div>
                    <button id="removeImageBtn" class="btn btn-outline btn-sm" style="display:none;margin-top:8px;" onclick="removeImage()">删除图片</button>
                </div>
                <div class="form-group">
                    <label>图标</label>
                    <select id="facilityIcon">
                        <option value="fa-wifi">WiFi</option>
                        <option value="fa-parking">停车场</option>
                        <option value="fa-swimming-pool">游泳池</option>
                        <option value="fa-dumbbell">健身房</option>
                        <option value="fa-utensils">餐厅</option>
                        <option value="fa-spa">SPA</option>
                        <option value="fa-cocktail">酒吧</option>
                        <option value="fa-concierge-bell">礼宾服务</option>
                        <option value="fa-elevator">电梯</option>
                        <option value="fa-meeting-room">会议室</option>
                        <option value="fa-briefcase">商务中心</option>
                        <option value="fa-shirt">洗衣服务</option>
                        <option value="fa-suitcase">行李寄存</option>
                        <option value="fa-clock">24小时前台</option>
                        <option value="fa-baby">儿童设施</option>
                        <option value="fa-car">停车场</option>
                        <option value="fa-coffee">咖啡厅</option>
                        <option value="fa-smoking">吸烟区</option>
                        <option value="fa-heart-pulse">医疗服务</option>
                        <option value="fa-shield-alt">安保服务</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <select id="facilityStatus">
                        <option value="true">可用</option>
                        <option value="false">不可用</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>排序</label>
                    <input type="number" id="facilitySortOrder" value="0" placeholder="排序值（0-999）" min="0" max="999">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="saveFacility()">保存</button>
            </div>
        </div>
    </div>
    <script src="../js/auth.js"></script>
    <script>
        let hotels = [], currentFacilityId = null;
        
        const categories = {
            '休闲设施': '休闲设施',
            '商务设施': '商务设施',
            '餐饮设施': '餐饮设施',
            '服务设施': '服务设施',
            '安全设施': '安全设施'
        };

        async function init() {
            const authResult = await Auth.checkAuthStatus();
            if (!authResult.loggedIn) { Auth.redirectToLogin('admin/facilities.html'); return; }
            const userRole = authResult.user.role;
            if (userRole !== 'hotel_admin' && userRole !== 'super_admin') { 
                alert('无权限访问，当前角色: ' + userRole); 
                window.location.href='../index.html'; 
                return; 
            }
            await loadHotels();
        }

        async function loadHotels() {
            try {
                const res = await Auth.fetchWithAuth('/api/admin/hotels');
                const data = await res.json();
                if (data.success && data.data) {
                    hotels = data.data;
                    const select = document.getElementById('hotelSelect');
                    select.innerHTML = '<option value="">请选择酒店</option>';
                    hotels.forEach(h => {
                        const option = document.createElement('option');
                        option.value = h.hotel_id;
                        option.textContent = h.name;
                        select.appendChild(option);
                    });
                    if (hotels.length > 0) { select.value = hotels[0].hotel_id; loadFacilities(); }
                }
            } catch(e) { console.error('加载酒店失败:',e); }
        }

        async function loadFacilities() {
            const hotelId = document.getElementById('hotelSelect').value;
            const category = document.getElementById('categoryFilter').value;
            const status = document.getElementById('statusFilter').value;
            if (!hotelId) return;
            try {
                const res = await Auth.fetchWithAuth('/api/admin/hotels/' + hotelId + '/facilities');
                const data = await res.json();
                console.log('Facilities API response:', data);
                const container = document.getElementById('facilityGrid');
                container.innerHTML = '';
                if (data.success && data.data && data.data.length > 0) {
                    let filtered = data.data;
                    if (category) filtered = filtered.filter(f => f.category === category);
                    if (status !== '') filtered = filtered.filter(f => String(f.is_available) === status);
                    
                    if (filtered.length > 0) {
                        filtered.forEach(facility => {
                            container.innerHTML += renderFacilityCard(facility);
                        });
                    } else {
                        container.innerHTML = '<div class="empty-state"><i class="fas fa-concierge-bell"></i><p>暂无符合条件的设施</p></div>';
                    }
                } else {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-concierge-bell"></i><p>暂无设施</p></div>';
                }
            } catch(e) { console.error('加载设施失败:',e); }
        }

        function renderFacilityCard(facility) {
            const statusClass = facility.is_available ? 'available' : 'unavailable';
            const statusLabel = facility.is_available ? '可用' : '不可用';
            const imageHtml = facility.image_url ? 
                '<div class="facility-image"><img src="' + facility.image_url + '" onerror="this.parentElement.innerHTML=\'<div class=\\\'facility-image placeholder\\\'><i class=\\\'fas ' + (facility.icon || 'fa-check') + '\\\'></i></div>\'"></div>' : 
                '<div class="facility-image placeholder"><i class="fas ' + (facility.icon || 'fa-check') + '"></i></div>';
            
            return '<div class="facility-card">' +
                imageHtml +
                '<div class="facility-name">' + escapeHtml(facility.name) + '</div>' +
                (facility.category ? '<span class="facility-category"><i class="fas fa-tag"></i> ' + escapeHtml(facility.category) + '</span>' : '') +
                '<div class="facility-desc">' + (facility.description || '暂无描述') + '</div>' +
                '<span class="facility-status ' + statusClass + '" onclick="toggleFacilityStatus(' + facility.facility_id + ', ' + !facility.is_available + ')"><i class="fas fa-circle" style="font-size:8px;"></i> ' + statusLabel + '</span>' +
                '<div class="facility-actions">' +
                '<button class="action-btn edit" onclick="openEditModal(' + JSON.stringify(facility) + ')"><i class="fas fa-edit"></i> 编辑</button>' +
                '<button class="action-btn delete" onclick="deleteFacility(' + facility.facility_id + ')"><i class="fas fa-trash"></i> 删除</button>' +
                '</div></div>';
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function openAddModal() {
            const hotelId = document.getElementById('hotelSelect').value;
            if (!hotelId) { showToast('请先选择酒店', 'error'); return; }
            currentFacilityId = null;
            document.getElementById('modalTitle').textContent = '添加设施';
            document.getElementById('facilityId').value = '';
            document.getElementById('facilityImageUrl').value = '';
            document.getElementById('facilityName').value = '';
            document.getElementById('facilityCategory').value = '';
            document.getElementById('facilityDesc').value = '';
            document.getElementById('facilityIcon').value = 'fa-wifi';
            document.getElementById('facilityStatus').value = 'true';
            document.getElementById('facilitySortOrder').value = '0';
            
            document.getElementById('facilityImagePreview').src = '';
            document.getElementById('facilityImagePreview').classList.remove('show');
            document.getElementById('imagePlaceholder').style.display = 'block';
            document.getElementById('imageUpload').classList.remove('has-image');
            document.getElementById('removeImageBtn').style.display = 'none';
            
            document.getElementById('facilityModal').classList.add('show');
        }

        function openEditModal(facility) {
            currentFacilityId = facility.facility_id;
            document.getElementById('modalTitle').textContent = '编辑设施';
            document.getElementById('facilityId').value = facility.facility_id;
            document.getElementById('facilityImageUrl').value = facility.image_url || '';
            document.getElementById('facilityName').value = facility.name || '';
            document.getElementById('facilityCategory').value = facility.category || '';
            document.getElementById('facilityDesc').value = facility.description || '';
            document.getElementById('facilityIcon').value = facility.icon || 'fa-wifi';
            document.getElementById('facilityStatus').value = facility.is_available ? 'true' : 'false';
            document.getElementById('facilitySortOrder').value = facility.sort_order || '0';
            
            if (facility.image_url) {
                document.getElementById('facilityImagePreview').src = facility.image_url;
                document.getElementById('facilityImagePreview').classList.add('show');
                document.getElementById('imagePlaceholder').style.display = 'none';
                document.getElementById('imageUpload').classList.add('has-image');
                document.getElementById('removeImageBtn').style.display = 'inline-block';
            } else {
                document.getElementById('facilityImagePreview').src = '';
                document.getElementById('facilityImagePreview').classList.remove('show');
                document.getElementById('imagePlaceholder').style.display = 'block';
                document.getElementById('imageUpload').classList.remove('has-image');
                document.getElementById('removeImageBtn').style.display = 'none';
            }
            
            document.getElementById('facilityModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('facilityModal').classList.remove('show');
            currentFacilityId = null;
        }

        function handleImageSelect(input) {
            const file = input.files[0];
            if (!file) return;
            
            const maxSize = 2 * 1024 * 1024;
            if (file.size > maxSize) {
                showToast('图片大小不能超过2MB', 'error');
                input.value = '';
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('facilityImagePreview').src = e.target.result;
                document.getElementById('facilityImagePreview').classList.add('show');
                document.getElementById('imagePlaceholder').style.display = 'none';
                document.getElementById('imageUpload').classList.add('has-image');
                document.getElementById('removeImageBtn').style.display = 'inline-block';
            };
            reader.readAsDataURL(file);
        }

        function removeImage() {
            document.getElementById('facilityImagePreview').src = '';
            document.getElementById('facilityImagePreview').classList.remove('show');
            document.getElementById('imagePlaceholder').style.display = 'block';
            document.getElementById('imageUpload').classList.remove('has-image');
            document.getElementById('removeImageBtn').style.display = 'none';
            document.getElementById('facilityImageFile').value = '';
            document.getElementById('facilityImageUrl').value = '';
        }

        async function saveFacility() {
            const name = document.getElementById('facilityName').value.trim();
            const category = document.getElementById('facilityCategory').value;
            
            if (!name) { showToast('请输入设施名称', 'error'); return; }
            if (name.length > 100) { showToast('设施名称不能超过100字符', 'error'); return; }
            if (!category) { showToast('请选择设施分类', 'error'); return; }
            
            const desc = document.getElementById('facilityDesc').value.trim();
            if (desc.length > 500) { showToast('设施描述不能超过500字符', 'error'); return; }
            
            const sortOrder = parseInt(document.getElementById('facilitySortOrder').value) || 0;
            if (sortOrder < 0 || sortOrder > 999) { showToast('排序值必须在0-999之间', 'error'); return; }
            
            const body = {
                name: name,
                category: category,
                description: desc,
                icon: document.getElementById('facilityIcon').value,
                is_available: document.getElementById('facilityStatus').value === 'true',
                sort_order: sortOrder
            };
            
            try {
                let url, method;
                if (currentFacilityId) {
                    url = '/api/admin/facilities/' + currentFacilityId;
                    method = 'PUT';
                } else {
                    const hotelId = document.getElementById('hotelSelect').value;
                    url = '/api/admin/hotels/' + hotelId + '/facilities';
                    method = 'POST';
                }
                
                const res = await Auth.fetchWithAuth(url, {
                    method: method,
                    headers: {'Content-Type': 'application/json', ...Auth._getAuthHeaders()},
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                
                if (data.success) {
                    const savedFacility = data.data;
                    
                    const imageFile = document.getElementById('facilityImageFile').files[0];
                    if (imageFile) {
                        await uploadImage(savedFacility.facility_id, imageFile);
                    }
                    
                    showToast(currentFacilityId ? '更新成功' : '添加成功', 'success');
                    closeModal();
                    loadFacilities();
                } else {
                    showToast(data.message || '操作失败', 'error');
                }
            } catch(e) { showToast('操作失败', 'error'); }
        }

        async function uploadImage(facilityId, file) {
            try {
                const formData = new FormData();
                formData.append('file', file);
                
                const res = await Auth.fetchWithAuth('/api/admin/facilities/' + facilityId + '/upload-image', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (!data.success) {
                    showToast(data.message || '图片上传失败', 'error');
                }
            } catch(e) {
                showToast('图片上传失败', 'error');
            }
        }

        async function toggleFacilityStatus(facilityId, newStatus) {
            try {
                const res = await Auth.fetchWithAuth('/api/admin/facilities/' + facilityId, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json', ...Auth._getAuthHeaders()},
                    body: JSON.stringify({ is_available: newStatus })
                });
                const data = await res.json();
                if (data.success) {
                    loadFacilities();
                } else {
                    showToast(data.message || '操作失败', 'error');
                }
            } catch(e) { showToast('操作失败', 'error'); }
        }

        async function deleteFacility(id) {
            if (!confirm('确定要删除此设施吗？')) return;
            try {
                const res = await Auth.fetchWithAuth('/api/admin/facilities/' + id, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    showToast('删除成功', 'success');
                    loadFacilities();
                } else {
                    showToast(data.message || '删除失败', 'error');
                }
            } catch(e) { showToast('删除失败', 'error'); }
        }

        function showToast(msg, type) {
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        init();
    </script>
</body>
</html>
