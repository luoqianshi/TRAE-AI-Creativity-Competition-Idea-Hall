<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>评价管理</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
    :root {
        --bg-cream: #fefdf7;--bg-peach: #fff8f3;--card-white: #ffffff;--border-soft: #f0e6d8;--primary-sunshine: #ffb347;--primary-coral: #ff9966;--text-warm: #5d4037;--text-medium: #8d6e63;--text-light: #bdbdbd;--radius-soft: 24px;--radius-round: 32px;--radius-pill: 40px;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Nunito','Noto Sans SC',sans-serif;background:linear-gradient(180deg,var(--bg-cream) 0%,var(--bg-peach) 100%);color:var(--text-warm);min-height:100vh;display:flex;}
    .sidebar{width:260px;background:rgba(255,255,255,0.98);backdrop-filter:blur(20px);border-right:1px solid rgba(255,179,71,0.15);padding:24px 0;position:fixed;left:0;top:0;bottom:0;z-index:100;}
    .sidebar-logo{font-family:'Fredoka',sans-serif;font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--primary-sunshine),var(--primary-coral));-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:10px;padding:0 24px 24px;border-bottom:1px solid var(--border-soft);margin-bottom:20px;}
    .sidebar-logo i{color:var(--primary-sunshine);font-size:28px;}
    .sidebar-menu{list-style:none;padding:0 16px;}
    .sidebar-menu li{margin-bottom:8px;}
    .sidebar-menu a{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius-soft);text-decoration:none;color:var(--text-medium);font-weight:600;font-size:15px;transition:all 0.3s;}
    .sidebar-menu a:hover{background:var(--bg-peach);color:var(--primary-sunshine);transform:translateX(4px);}
    .sidebar-menu a.active{background:linear-gradient(135deg,rgba(255,179,71,0.15),rgba(255,153,102,0.15));color:var(--primary-sunshine);}
    .sidebar-menu a i{font-size:18px;width:24px;text-align:center;}
    .sidebar-footer{position:absolute;bottom:24px;left:0;right:0;padding:0 16px;border-top:1px solid var(--border-soft);}
    .sidebar-footer a{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius-soft);text-decoration:none;color:var(--text-light);font-size:14px;transition:all 0.3s;}
    .sidebar-footer a:hover{color:var(--primary-coral);background:rgba(255,183,178,0.1);}
    .main-content{flex:1;margin-left:260px;padding:24px;min-height:100vh;}
    .page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;}
    .page-header h1{font-family:'Fredoka',sans-serif;font-size:32px;font-weight:800;background:linear-gradient(135deg,#5d4037,#8d6e63);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .content-card{background:var(--card-white);border:1px solid var(--border-soft);border-radius:var(--radius-soft);padding:28px;box-shadow:0 8px 24px rgba(255,179,71,0.06);margin-bottom:20px;}
    .content-card h3{font-family:'Fredoka',sans-serif;font-size:20px;font-weight:700;margin-bottom:24px;display:flex;align-items:center;gap:10px;color:var(--text-warm);}
    .content-card h3 i{color:var(--primary-sunshine);}
    .review-list{display:flex;flex-direction:column;gap:16px;}
    .review-item{padding:20px;background:var(--bg-peach);border-radius:var(--radius-soft);border:1px solid var(--border-soft);}
    .review-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
    .review-rating{color:#ffd700;font-size:16px;}
    .review-date{font-size:13px;color:var(--text-light);}
    .review-content{font-size:15px;line-height:1.6;margin-bottom:12px;}
    .review-reply{padding:12px;background:rgba(255,179,71,0.1);border-radius:12px;margin-top:12px;}
    .review-reply-header{font-size:13px;color:var(--primary-coral);font-weight:600;margin-bottom:6px;}
    .review-reply-content{font-size:14px;color:var(--text-medium);}
    .review-reply-time{font-size:12px;color:var(--text-light);margin-top:8px;}
    .review-actions{display:flex;gap:8px;margin-top:12px;}
    .btn{padding:8px 16px;border-radius:var(--radius-pill);font-size:13px;font-weight:600;text-decoration:none;transition:all 0.3s;font-family:'Nunito',sans-serif;border:none;cursor:pointer;}
    .btn-primary{background:linear-gradient(135deg,var(--primary-sunshine),var(--primary-coral));color:white;}
    .btn-primary:hover{transform:translateY(-2px);}
    .btn-outline{border:2px solid var(--border-soft);color:var(--text-medium);background:white;}
    .btn-outline:hover{border-color:var(--primary-sunshine);color:var(--primary-sunshine);}
    .tag-badge{padding:4px 12px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;}
    .tag-good{background:rgba(168,230,207,0.2);color:#2e7d32;}
    .tag-bad{background:rgba(255,183,178,0.2);color:#c62828;}
    .tag-normal{background:rgba(255,215,0,0.2);color:#f57f17;}
    .hotel-selector{margin-bottom:20px;}
    .hotel-selector label{font-size:13px;color:var(--text-light);font-weight:600;margin-bottom:8px;display:block;}
    .hotel-selector select{width:300px;padding:14px 20px;border:2px solid var(--border-soft);border-radius:var(--radius-round);font-size:15px;background:var(--bg-peach);color:var(--text-warm);font-family:'Nunito',sans-serif;font-weight:500;cursor:pointer;}
    .hotel-selector select:focus{outline:none;border-color:var(--primary-sunshine);box-shadow:0 6px 24px rgba(255,179,71,0.2);background:white;}
    .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;}
    .modal.show{display:flex;}
    .modal-content{background:white;border-radius:var(--radius-soft);padding:28px;width:500px;max-width:90%;}
    .modal-header{font-family:'Fredoka',sans-serif;font-size:20px;font-weight:700;margin-bottom:20px;}
    .modal-body textarea{width:100%;padding:14px;border:2px solid var(--border-soft);border-radius:var(--radius-soft);font-size:15px;font-family:'Nunito',sans-serif;resize:vertical;min-height:120px;}
    .modal-body textarea:focus{outline:none;border-color:var(--primary-sunshine);}
    .modal-footer{display:flex;justify-content:flex-end;gap:12px;margin-top:20px;}
    .empty-state{text-align:center;padding:60px;color:var(--text-light);}
    .empty-state i{font-size:48px;margin-bottom:16px;color:var(--border-soft);}
    .empty-state p{font-size:16px;}
    .toast{position:fixed;top:24px;right:24px;padding:16px 24px;border-radius:var(--radius-soft);font-weight:600;font-size:15px;z-index:3000;animation:slideInRight 0.3s ease-out;box-shadow:0 8px 25px rgba(0,0,0,0.15);}
    .toast.success{background:linear-gradient(135deg,#a8e6cf,#81c784);color:white;}
    .toast.error{background:linear-gradient(135deg,#ffb7b2,#ff8a80);color:white;}
    @keyframes slideInRight{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo"><i class="fas fa-hotel"></i><span>酒店管理</span></div>
        <ul class="sidebar-menu">
            <li><a href="index.html"><i class="fas fa-chart-pie"></i> 仪表盘</a></li>
            <li><a href="analytics.html"><i class="fas fa-chart-line"></i> 数据分析</a></li>
            <li><a href="hotel-info.html"><i class="fas fa-building"></i> 酒店信息</a></li>
            <li><a href="room-types.html"><i class="fas fa-bed"></i> 房型管理</a></li>
            <li><a href="room-sales.html"><i class="fas fa-chart-bar"></i> 房型销售</a></li>
            <li><a href="orders.html"><i class="fas fa-receipt"></i> 订单管理</a></li>
            <li><a href="reviews.html" class="active"><i class="fas fa-star"></i> 评价管理</a></li>
            <li><a href="notifications.html"><i class="fas fa-bell"></i> 消息通知</a></li>
            <li><a href="checkin.html"><i class="fas fa-clipboard-check"></i> 入住管理</a></li>
            <li><a href="facilities.html"><i class="fas fa-concierge-bell"></i> 设施管理</a></li>
        </ul>
        <div class="sidebar-footer"><a href="#" onclick="Auth.logout()"><i class="fas fa-sign-out-alt"></i> 退出登录</a></div>
    </aside>
    <main class="main-content">
        <div class="page-header"><h1>评价管理</h1></div>
        <div class="hotel-selector"><label>选择酒店</label><select id="hotelSelect" onchange="loadReviews()"><option value="">请选择酒店</option></select></div>
        <div class="content-card">
            <h3><i class="fas fa-star"></i> 评价列表</h3>
            <div class="review-list" id="reviewList"></div>
        </div>
    </main>
    <div class="modal" id="replyModal">
        <div class="modal-content">
            <div class="modal-header">回复评价</div>
            <div class="modal-body">
                <textarea id="replyContent" placeholder="请输入回复内容..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeReplyModal()">取消</button>
                <button class="btn btn-primary" onclick="submitReply()">提交回复</button>
            </div>
        </div>
    </div>
    <script src="../js/auth.js"></script>
    <script>
        let hotels = [], currentReviewId = null;
        async function init() {
            const authResult = await Auth.checkAuthStatus();
            if (!authResult.loggedIn) { Auth.redirectToLogin('admin/reviews.html'); return; }
            const userRole = authResult.user.role;
            if (userRole !== 'hotel_admin' && userRole !== 'super_admin') { 
                alert('无权限访问，当前角色: ' + userRole); 
                window.location.href='../index.html'; 
                return; 
            }
            await loadHotels();
        }
        async function loadHotels() {
            try {
                const res = await Auth.fetchWithAuth('/api/admin/hotels');
                const data = await res.json();
                if (data.success && data.data) {
                    hotels = data.data;
                    const select = document.getElementById('hotelSelect');
                    select.innerHTML = '<option value="">请选择酒店</option>';
                    hotels.forEach(h => {
                        const option = document.createElement('option');
                        option.value = h.hotel_id;
                        option.textContent = h.name;
                        select.appendChild(option);
                    });
                    if (hotels.length > 0) { select.value = hotels[0].hotel_id; loadReviews(); }
                }
            } catch(e) { console.error('加载酒店失败:',e); }
        }
        async function loadReviews() {
            const hotelId = document.getElementById('hotelSelect').value;
            if (!hotelId) return;
            try {
                const res = await Auth.fetchWithAuth('/api/admin/hotels/' + hotelId + '/reviews');
                const data = await res.json();
                const container = document.getElementById('reviewList');
                container.innerHTML = '';
                if (data.success && data.data && data.data.length > 0) {
                    data.data.forEach(review => {
                        container.innerHTML += renderReviewItem(review);
                    });
                } else {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-star"></i><p>暂无评价</p></div>';
                }
            } catch(e) { console.error('加载评价失败:',e); }
        }
        function renderReviewItem(review) {
            let stars = '';
            for (let i = 0; i < 5; i++) {
                stars += i < review.rating ? '<i class="fas fa-star"></i>' : '<i class="far fa-star"></i>';
            }
            // 评分标签（由系统根据评分自动生成，管理员不可修改）
            let tagHtml = '';
            if (review.rating) {
                let tagClass = 'tag-normal';
                let tagLabel = '一般';
                if (review.rating >= 4) { tagClass = 'tag-good'; tagLabel = '好评'; }
                else if (review.rating <= 2) { tagClass = 'tag-bad'; tagLabel = '差评'; }
                tagHtml = '<span class="tag-badge ' + tagClass + '">' + tagLabel + '</span>';
            }
            let replyHtml = '';
            if (review.reply_content) {
                replyHtml = '<div class="review-reply"><div class="review-reply-header"><i class="fas fa-reply"></i> 商家回复</div><div class="review-reply-content">' + review.reply_content + '</div><div class="review-reply-time">回复时间：' + formatDate(review.reply_at) + '</div></div>';
            }
            // 回复按钮：已回复的显示"查看回复"，未回复的显示"回复评价"
            const replyBtn = review.reply_content 
                ? '<button class="btn btn-outline" onclick="viewReply(' + review.review_id + ')"><i class="fas fa-eye"></i> 查看回复</button>'
                : '<button class="btn btn-primary" onclick="openReplyModal(' + review.review_id + ')"><i class="fas fa-reply"></i> 回复评价</button>';
            return '<div class="review-item"><div class="review-header"><div class="review-rating">' + stars + '</div><div>' + tagHtml + ' <span class="review-date">' + formatDate(review.created_at) + '</span></div></div><div class="review-content">' + (review.content || '用户未填写评价内容') + '</div>' + replyHtml + '<div class="review-actions">' + replyBtn + '</div></div>';
        }
        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return d.toLocaleDateString('zh-CN');
        }
        function openReplyModal(reviewId) {
            currentReviewId = reviewId;
            document.getElementById('replyContent').value = '';
            document.getElementById('replyModal').classList.add('show');
        }
        function closeReplyModal() {
            document.getElementById('replyModal').classList.remove('show');
            currentReviewId = null;
        }
        async function submitReply() {
            const content = document.getElementById('replyContent').value.trim();
            if (!content) { showToast('请输入回复内容', 'error'); return; }
            try {
                const res = await Auth.fetchWithAuth('/api/admin/reviews/' + currentReviewId + '/reply', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', ...Auth._getAuthHeaders()},
                    body: JSON.stringify({reply_content: content})
                });
                const data = await res.json();
                if (data.success) {
                    showToast('回复成功', 'success');
                    closeReplyModal();
                    loadReviews();
                } else {
                    showToast(data.message || '回复失败', 'error');
                }
            } catch(e) { showToast('回复失败', 'error'); }
        }
        
        // 查看回复
        function viewReply(reviewId) {
            // 找到该评价并展开回复内容
            const container = document.getElementById('reviewList');
            const items = container.querySelectorAll('.review-item');
            items.forEach(item => {
                const btn = item.querySelector('button');
                if (btn && btn.getAttribute('onclick').includes(reviewId)) {
                    // 展开回复
                    item.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    item.style.boxShadow = '0 0 0 3px var(--primary-sunshine)';
                    setTimeout(() => { item.style.boxShadow = ''; }, 2000);
                }
            });
        }
        function showToast(msg, type) {
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        init();
    </script>
</body>
</html>
