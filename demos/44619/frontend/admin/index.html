﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酒店管理后台 - 仪表盘</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-cream: #fefdf7;
            --bg-peach: #fff8f3;
            --bg-mint: #f0fffa;
            --bg-lavender: #f5f3ff;
            --card-white: #ffffff;
            --border-soft: #f0e6d8;
            --primary-sunshine: #ffb347;
            --primary-coral: #ff9966;
            --secondary-lavender: #b39ddb;
            --secondary-sky: #81d4fa;
            --accent-pink: #ffb7b2;
            --accent-mint: #a8e6cf;
            --accent-lemon: #fff4a3;
            --text-warm: #5d4037;
            --text-medium: #8d6e63;
            --text-light: #bdbdbd;
            --shadow-soft: 0 8px 24px rgba(255, 179, 71, 0.06);
            --shadow-float: 0 12px 32px rgba(255, 179, 71, 0.12);
            --star-yellow: #ffd700;
            --radius-soft: 24px;
            --radius-round: 32px;
            --radius-pill: 40px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Nunito', 'Noto Sans SC', sans-serif; background: linear-gradient(180deg, var(--bg-cream) 0%, var(--bg-peach) 100%); color: var(--text-warm); min-height: 100vh; display: flex; }
        .sidebar { width: 260px; background: rgba(255,255,255,0.98); backdrop-filter: blur(20px); border-right: 1px solid rgba(255,179,71,0.15); padding: 24px 0; position: fixed; left: 0; top: 0; bottom: 0; z-index: 100; }
        .sidebar-logo { font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 800; background: linear-gradient(135deg, var(--primary-sunshine), var(--primary-coral)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 10px; padding: 0 24px 24px; border-bottom: 1px solid var(--border-soft); margin-bottom: 20px; }
        .sidebar-logo i { color: var(--primary-sunshine); font-size: 28px; }
        .sidebar-menu { list-style: none; padding: 0 16px; }
        .sidebar-menu li { margin-bottom: 8px; }
        .sidebar-menu a { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--radius-soft); text-decoration: none; color: var(--text-medium); font-weight: 600; font-size: 15px; transition: all 0.3s; }
        .sidebar-menu a:hover { background: var(--bg-peach); color: var(--primary-sunshine); transform: translateX(4px); }
        .sidebar-menu a.active { background: linear-gradient(135deg, rgba(255,179,71,0.15), rgba(255,153,102,0.15)); color: var(--primary-sunshine); }
        .sidebar-menu a i { font-size: 18px; width: 24px; text-align: center; }
        .sidebar-footer { position: absolute; bottom: 24px; left: 0; right: 0; padding: 0 16px; border-top: 1px solid var(--border-soft); }
        .sidebar-footer a { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--radius-soft); text-decoration: none; color: var(--text-light); font-size: 14px; transition: all 0.3s; }
        .sidebar-footer a:hover { color: var(--primary-coral); background: rgba(255,183,178,0.1); }
        .main-content { flex: 1; margin-left: 260px; padding: 24px; min-height: 100vh; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .page-header h1 { font-family: 'Fredoka', sans-serif; font-size: 32px; font-weight: 800; background: linear-gradient(135deg, #5d4037, #8d6e63); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .user-info { display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: white; border-radius: var(--radius-pill); box-shadow: var(--shadow-soft); }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--primary-sunshine), var(--accent-pink)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 15px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-white); border: 1px solid var(--border-soft); border-radius: var(--radius-soft); padding: 28px; transition: all 0.4s; position: relative; overflow: hidden; }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, var(--primary-sunshine), var(--accent-pink), var(--secondary-lavender)); opacity: 0; transition: opacity 0.4s; }
        .stat-card:hover { transform: translateY(-6px); border-color: rgba(255,179,71,0.3); box-shadow: var(--shadow-float); }
        .stat-card:hover::before { opacity: 1; }
        .stat-icon { width: 56px; height: 56px; border-radius: var(--radius-round); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; font-size: 24px; color: white; }
        .stat-icon.orders { background: linear-gradient(135deg, #ffb347, #ff9966); }
        .stat-icon.pending { background: linear-gradient(135deg, #b39ddb, #9575cd); }
        .stat-icon.checkedin { background: linear-gradient(135deg, #81d4fa, #4fc3f7); }
        .stat-icon.revenue { background: linear-gradient(135deg, #a8e6cf, #81c784); }
        .stat-value { font-family: 'Fredoka', sans-serif; font-size: 36px; font-weight: 800; background: linear-gradient(135deg, var(--primary-sunshine), var(--primary-coral)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; }
        .stat-label { font-size: 14px; color: var(--text-light); font-weight: 600; }
        .content-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .content-card { background: var(--card-white); border: 1px solid var(--border-soft); border-radius: var(--radius-soft); padding: 28px; box-shadow: var(--shadow-soft); }
        .content-card h3 { font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; color: var(--text-warm); }
        .content-card h3 i { color: var(--primary-sunshine); }
        .order-list { display: flex; flex-direction: column; gap: 16px; }
        .order-item { display: flex; align-items: center; gap: 16px; padding: 18px; background: var(--bg-peach); border-radius: var(--radius-soft); cursor: pointer; transition: all 0.3s; }
        .order-item:hover { transform: translateX(8px); box-shadow: 0 6px 20px rgba(255,179,71,0.15); }
        .order-status { padding: 6px 14px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .order-status.pending { background: rgba(255,215,0,0.2); color: #f57f17; }
        .order-status.confirmed { background: rgba(79,195,247,0.2); color: #0288d1; }
        .order-status.checked_in_pre { background: rgba(168,230,207,0.2); color: #2e7d32; }
        .order-status.checked_in { background: rgba(139,195,74,0.2); color: #558b2f; }
        .order-status.checked_out { background: rgba(189,189,189,0.2); color: #616161; }
        .order-status.cancelled { background: rgba(255,183,178,0.2); color: #c62828; }
        .order-info { flex: 1; }
        .order-info h4 { font-size: 15px; font-weight: 700; color: var(--text-warm); margin-bottom: 4px; }
        .order-info p { font-size: 13px; color: var(--text-light); }
        .order-price { font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 700; color: var(--primary-coral); }
        .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .quick-action-btn { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px; background: var(--bg-peach); border: 1px solid var(--border-soft); border-radius: var(--radius-soft); cursor: pointer; transition: all 0.3s; text-decoration: none; color: var(--text-warm); }
        .quick-action-btn:hover { transform: translateY(-4px); border-color: var(--primary-sunshine); box-shadow: 0 8px 25px rgba(255,179,71,0.2); }
        .quick-action-btn i { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; color: white; }
        .quick-action-btn.orange i { background: linear-gradient(135deg, #ffb347, #ff9966); }
        .quick-action-btn.blue i { background: linear-gradient(135deg, #81d4fa, #4fc3f7); }
        .quick-action-btn.green i { background: linear-gradient(135deg, #a8e6cf, #81c784); }
        .quick-action-btn.purple i { background: linear-gradient(135deg, #b39ddb, #9575cd); }
        .quick-action-btn span { font-size: 13px; font-weight: 600; }
        .hotel-selector { margin-bottom: 24px; }
        .hotel-selector label { font-size: 13px; color: var(--text-light); font-weight: 600; margin-bottom: 8px; display: block; }
        .hotel-selector select { width: 100%; padding: 14px 20px; border: 2px solid var(--border-soft); border-radius: var(--radius-round); font-size: 15px; background: var(--bg-peach); color: var(--text-warm); font-family: 'Nunito', sans-serif; font-weight: 500; cursor: pointer; transition: all 0.3s; }
        .hotel-selector select:focus { outline: none; border-color: var(--primary-sunshine); box-shadow: 0 6px 24px rgba(255,179,71,0.2); background: white; }
        @media (max-width: 1200px) { .stats-grid { grid-template-columns: repeat(2,1fr); } .content-grid { grid-template-columns: 1fr; } }
        @media (max-width: 768px) { .sidebar { width: 100%; transform: translateX(-100%); } .sidebar.show { transform: translateX(0); } .main-content { margin-left: 0; } .stats-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo"><i class="fas fa-hotel"></i><span>酒店管理</span></div>
        <ul class="sidebar-menu">
            <li><a href="index.html" class="active"><i class="fas fa-chart-pie"></i> 仪表盘</a></li>
            <li><a href="analytics.html"><i class="fas fa-chart-line"></i> 数据分析</a></li>
            <li><a href="hotel-info.html"><i class="fas fa-building"></i> 酒店信息</a></li>
            <li><a href="room-types.html"><i class="fas fa-bed"></i> 房型管理</a></li>
            <li><a href="room-sales.html"><i class="fas fa-chart-bar"></i> 房型销售</a></li>
            <li><a href="orders.html"><i class="fas fa-receipt"></i> 订单管理</a></li>
            <li><a href="reviews.html"><i class="fas fa-star"></i> 评价管理</a></li>
            <li><a href="notifications.html"><i class="fas fa-bell"></i> 消息通知</a></li>
            <li><a href="checkin.html"><i class="fas fa-clipboard-check"></i> 入住管理</a></li>
            <li><a href="facilities.html"><i class="fas fa-concierge-bell"></i> 设施管理</a></li>
        </ul>
        <div class="sidebar-footer"><a href="#" onclick="event.preventDefault(); Auth.logout(); return false;"><i class="fas fa-sign-out-alt"></i> 退出登录</a></div>
    </aside>
    <main class="main-content">
        <div class="page-header"><h1>欢迎回来，管理员</h1><div class="user-info"><div class="user-avatar" id="userAvatar">管</div><span id="userName">酒店管理员</span></div></div>
        <div class="hotel-selector"><label>当前管理酒店</label><div id="currentHotelDisplay" style="padding: 14px 20px; background: var(--bg-peach); border-radius: var(--radius-round); font-size: 16px; font-weight: 600; color: var(--text-warm); border: 2px solid var(--border-soft);">请登录...</div>
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-icon orders"><i class="fas fa-receipt"></i></div><div class="stat-value" id="statTotalOrders">0</div><div class="stat-label">总订单数</div></div>
            <div class="stat-card"><div class="stat-icon pending"><i class="fas fa-clock"></i></div><div class="stat-value" id="statPendingOrders">0</div><div class="stat-label">待处理订单</div></div>
            <div class="stat-card"><div class="stat-icon checkedin"><i class="fas fa-users"></i></div><div class="stat-value" id="statCheckedIn">0</div><div class="stat-label">当前入住</div></div>
            <div class="stat-card"><div class="stat-icon revenue"><i class="fas fa-yen-sign"></i></div><div class="stat-value" id="statRevenue">0</div><div class="stat-label">累计营收(元)</div></div>
            <div class="stat-card"><div class="stat-icon checkin" style="background: linear-gradient(135deg, #60a5fa, #3b82f6);"><i class="fas fa-door-open"></i></div><div class="stat-value" id="statTodayCheckIn">0</div><div class="stat-label">今日入住</div></div>
            <div class="stat-card"><div class="stat-icon checkout" style="background: linear-gradient(135deg, #f87171, #ef4444);"><i class="fas fa-sign-out-alt"></i></div><div class="stat-value" id="statTodayCheckOut">0</div><div class="stat-label">今日退房</div></div>
            <div class="stat-card"><div class="stat-icon occupancy" style="background: linear-gradient(135deg, #34d399, #10b981);"><i class="fas fa-chart-line"></i></div><div class="stat-value" id="statOccupancyRate">0%</div><div class="stat-label">入住率</div></div>
        </div>
        <div class="content-grid">
            <div class="content-card"><h3><i class="fas fa-list"></i> 最近订单</h3><div class="order-list" id="recentOrders"></div></div>
            <div class="content-card"><h3><i class="fas fa-bolt"></i> 快捷操作</h3><div class="quick-actions">
                <a href="orders.html?status=pending" class="quick-action-btn orange"><i class="fas fa-clock"></i><span>待处理订单</span></a>
                <a href="checkin.html" class="quick-action-btn blue"><i class="fas fa-key"></i><span>办理入住</span></a>
                <a href="room-types.html" class="quick-action-btn green"><i class="fas fa-bed"></i><span>房型管理</span></a>
                <a href="hotel-info.html" class="quick-action-btn purple"><i class="fas fa-building"></i><span>酒店设置</span></a>
            </div></div>
        </div>
    </main>
    <script src="../js/auth.js"></script>
    <script>
        let hotels = [], currentHotelId = null;
        function getStatusLabel(status) {
            const labels = {'pending':'待支付','confirmed':'已确认','checked_in_pre':'待入住','checked_in':'已入住','checked_out':'已完成','cancelled':'已取消'};
            return labels[status] || status;
        }
        async function init() {
            const authResult = await Auth.checkAuthStatus();
            console.log('Admin init - authResult:', authResult);
            console.log('Admin init - user role:', authResult.user?.role);
            if (!authResult.loggedIn) { Auth.redirectToLogin('admin/index.html'); return; }
            // 支持 hotel_admin 和 super_admin 访问酒店管理员后台
            const userRole = authResult.user.role;
            if (userRole !== 'hotel_admin' && userRole !== 'super_admin') { 
                alert('无权限访问，当前角色: ' + userRole); 
                window.location.href='../index.html'; 
                return; 
            }
            document.getElementById('userName').textContent = authResult.user.full_name || authResult.user.username;
            document.getElementById('userAvatar').textContent = (authResult.user.full_name || authResult.user.username)[0];
            await loadHotels();
        }
        async function loadHotels() {
            try {
                const res = await Auth.fetchWithAuth('/api/admin/hotels');
                const data = await res.json();
                if (data.success && data.data) {
                    hotels = data.data;
                    const display = document.getElementById('currentHotelDisplay');
                    if (hotels.length > 0) { 
                        currentHotelId = hotels[0].hotel_id; 
                        display.textContent = hotels[0].name;
                        loadStats(); 
                    } else {
                        display.textContent = '暂无管理的酒店';
                    }
                }
            } catch(e) { console.error('加载酒店失败:',e); }
        }
        async function loadStats() {
            if (!currentHotelId) return;
            try {
                const res = await Auth.fetchWithAuth(`/api/admin/hotels/${currentHotelId}/stats`);
                const data = await res.json();
                if (data.success && data.data) {
                    const s = data.data;
                    document.getElementById('statTotalOrders').textContent = s.totalOrders || 0;
                    document.getElementById('statPendingOrders').textContent = (s.confirmedOrders || 0) + (s.checkedInPreOrders || 0);
                    document.getElementById('statCheckedIn').textContent = s.checkedInOrders || 0;
                    document.getElementById('statRevenue').textContent = (s.revenue || 0).toLocaleString();
                    document.getElementById('statTodayCheckIn').textContent = s.todayCheckInOrders || 0;
                    document.getElementById('statTodayCheckOut').textContent = s.todayCheckOutOrders || 0;
                    document.getElementById('statOccupancyRate').textContent = (s.occupancyRate || 0) + '%';
                }
            } catch(e) { console.error('加载统计失败:',e); }
            await loadRecentOrders();
        }
        async function loadRecentOrders() {
            if (!currentHotelId) return;
            try {
                const res = await Auth.fetchWithAuth(`/api/admin/hotels/${currentHotelId}/orders`);
                const data = await res.json();
                if (data.success && data.data) {
                    const orders = (data.data.orders || data.data).slice(0,5);
                    const container = document.getElementById('recentOrders');
                    container.innerHTML = '';
                    if (orders.length === 0) { container.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-light);">暂无订单</div>'; return; }
                    orders.forEach(order => {
                        const item = document.createElement('div');
                        item.className = 'order-item';
                        item.innerHTML = `<div class="order-status ${order.status}">${getStatusLabel(order.status)}</div><div class="order-info"><h4>订单 #${order.booking_id}</h4><p>${order.guest_name} | ${order.check_in_date || ''} - ${order.check_out_date || ''}</p></div><div class="order-price">¥${order.total_amount}</div>`;
                        item.onclick = () => window.location.href = `orders.html?id=${order.booking_id}`;
                        container.appendChild(item);
                    });
                }
            } catch(e) { console.error('加载订单失败:',e); }
        }
        init();
    </script>
</body>
</html>
