<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>房型销售看板 - 酒店管理后台</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-cream: #fefdf7;
            --bg-peach: #fff8f3;
            --bg-mint: #f0fffa;
            --bg-lavender: #f5f3ff;
            --card-white: #ffffff;
            --border-soft: #f0e6d8;
            --primary-sunshine: #ffb347;
            --primary-coral: #ff9966;
            --secondary-lavender: #b39ddb;
            --secondary-sky: #81d4fa;
            --accent-pink: #ffb7b2;
            --accent-mint: #a8e6cf;
            --text-warm: #5d4037;
            --text-medium: #8d6e63;
            --text-light: #bdbdbd;
            --shadow-soft: 0 8px 24px rgba(255, 179, 71, 0.06);
            --shadow-float: 0 12px 32px rgba(255, 179, 71, 0.12);
            --radius-soft: 24px;
            --radius-round: 32px;
            --radius-pill: 40px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Nunito', 'Noto Sans SC', sans-serif; background: linear-gradient(180deg, var(--bg-cream) 0%, var(--bg-peach) 100%); color: var(--text-warm); min-height: 100vh; display: flex; }
        .sidebar { width: 260px; background: rgba(255,255,255,0.98); backdrop-filter: blur(20px); border-right: 1px solid rgba(255,179,71,0.15); padding: 24px 0; position: fixed; left: 0; top: 0; bottom: 0; z-index: 100; }
        .sidebar-logo { font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 800; background: linear-gradient(135deg, var(--primary-sunshine), var(--primary-coral)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 10px; padding: 0 24px 24px; border-bottom: 1px solid var(--border-soft); margin-bottom: 20px; }
        .sidebar-logo i { color: var(--primary-sunshine); font-size: 28px; }
        .sidebar-menu { list-style: none; padding: 0 16px; }
        .sidebar-menu li { margin-bottom: 8px; }
        .sidebar-menu a { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--radius-soft); text-decoration: none; color: var(--text-medium); font-weight: 600; font-size: 15px; transition: all 0.3s; }
        .sidebar-menu a:hover { background: var(--bg-peach); color: var(--primary-sunshine); transform: translateX(4px); }
        .sidebar-menu a.active { background: linear-gradient(135deg, rgba(255,179,71,0.15), rgba(255,153,102,0.15)); color: var(--primary-sunshine); }
        .sidebar-menu a i { font-size: 18px; width: 24px; text-align: center; }
        .sidebar-footer { position: absolute; bottom: 24px; left: 0; right: 0; padding: 0 16px; border-top: 1px solid var(--border-soft); }
        .sidebar-footer a { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--radius-soft); text-decoration: none; color: var(--text-light); font-size: 14px; transition: all 0.3s; }
        .sidebar-footer a:hover { color: var(--primary-coral); background: rgba(255,183,178,0.1); }
        .main-content { flex: 1; margin-left: 260px; padding: 24px; min-height: 100vh; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .page-header h1 { font-family: 'Fredoka', sans-serif; font-size: 32px; font-weight: 800; background: linear-gradient(135deg, #5d4037, #8d6e63); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .refresh-btn { display: flex; align-items: center; gap: 8px; padding: 12px 24px; background: var(--card-white); border: 2px solid var(--border-soft); border-radius: var(--radius-pill); font-size: 14px; font-weight: 600; color: var(--text-warm); cursor: pointer; transition: all 0.3s; }
        .refresh-btn:hover { border-color: var(--primary-sunshine); background: var(--bg-peach); }
        .room-sales-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 24px; }
        .room-sales-card { background: var(--card-white); border: 1px solid var(--border-soft); border-radius: var(--radius-soft); padding: 28px; box-shadow: var(--shadow-soft); transition: all 0.3s; }
        .room-sales-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-float); }
        .room-sales-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        .room-sales-header h3 { font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 700; color: var(--text-warm); }
        .room-sales-header .price { font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 800; color: var(--primary-coral); }
        .room-sales-header .price span { font-size: 14px; color: var(--text-light); font-weight: 400; }
        .room-sales-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
        .room-sales-stat { text-align: center; padding: 16px 8px; background: var(--bg-cream); border-radius: var(--radius-soft); }
        .room-sales-stat .value { font-family: 'Fredoka', sans-serif; font-size: 28px; font-weight: 800; background: linear-gradient(135deg, var(--primary-sunshine), var(--primary-coral)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .room-sales-stat .label { font-size: 12px; color: var(--text-light); margin-top: 4px; }
        .room-sales-divider { height: 1px; background: var(--border-soft); margin: 20px 0; }
        .room-status-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .room-status-item { display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--bg-peach); border-radius: var(--radius-soft); }
        .room-status-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
        .room-status-dot.available { background: #4caf50; }
        .room-status-dot.booked { background: #2196f3; }
        .room-status-dot.occupied { background: #ff9800; }
        .room-status-dot.dirty { background: #f44336; }
        .room-status-dot.maintenance { background: #607d8b; }
        .room-status-dot.locked { background: #9c27b0; }
        .room-status-info { flex: 1; }
        .room-status-info .name { font-size: 12px; color: var(--text-light); }
        .room-status-info .count { font-family: 'Fredoka', sans-serif; font-size: 18px; font-weight: 700; color: var(--text-warm); }
        .room-booking-summary { margin-top: 20px; padding-top: 20px; border-top: 1px dashed var(--border-soft); }
        .booking-summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .booking-summary-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--bg-mint); border-radius: var(--radius-soft); }
        .booking-summary-item .label { font-size: 13px; color: var(--text-medium); }
        .booking-summary-item .value { font-family: 'Fredoka', sans-serif; font-size: 18px; font-weight: 700; color: var(--text-warm); }
        .empty-state { text-align: center; padding: 80px 40px; background: var(--card-white); border-radius: var(--radius-soft); border: 2px dashed var(--border-soft); }
        .empty-state i { font-size: 64px; color: var(--text-light); margin-bottom: 20px; }
        .empty-state h3 { font-family: 'Fredoka', sans-serif; font-size: 24px; color: var(--text-warm); margin-bottom: 10px; }
        .empty-state p { color: var(--text-light); }
        .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.95); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .loading-spinner { width: 50px; height: 50px; border: 4px solid var(--border-soft); border-top-color: var(--primary-sunshine); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 1200px) { .room-sales-grid { grid-template-columns: 1fr; } }
        @media (max-width: 768px) { .sidebar { width: 100%; transform: translateX(-100%); } .sidebar.show { transform: translateX(0); } .main-content { margin-left: 0; } }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo"><i class="fas fa-hotel"></i><span>酒店管理</span></div>
        <ul class="sidebar-menu">
            <li><a href="index.html"><i class="fas fa-chart-pie"></i> 仪表盘</a></li>
            <li><a href="analytics.html"><i class="fas fa-chart-line"></i> 数据分析</a></li>
            <li><a href="hotel-info.html"><i class="fas fa-building"></i> 酒店信息</a></li>
            <li><a href="room-types.html"><i class="fas fa-bed"></i> 房型管理</a></li>
            <li><a href="room-sales.html" class="active"><i class="fas fa-chart-bar"></i> 房型销售</a></li>
            <li><a href="orders.html"><i class="fas fa-receipt"></i> 订单管理</a></li>
            <li><a href="reviews.html"><i class="fas fa-star"></i> 评价管理</a></li>
            <li><a href="notifications.html"><i class="fas fa-bell"></i> 消息通知</a></li>
            <li><a href="checkin.html"><i class="fas fa-clipboard-check"></i> 入住管理</a></li>
            <li><a href="facilities.html"><i class="fas fa-concierge-bell"></i> 设施管理</a></li>
        </ul>
        <div class="sidebar-footer"><a href="#" onclick="Auth.logout()"><i class="fas fa-sign-out-alt"></i> 退出登录</a></div>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h1><i class="fas fa-chart-bar"></i> 房型销售看板</h1>
            <button class="refresh-btn" onclick="loadData()">
                <i class="fas fa-sync-alt"></i> 刷新数据
            </button>
        </div>

        <div id="roomSalesGrid" class="room-sales-grid"></div>
    </main>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <script src="../js/auth.js"></script>
    <script>
        let currentHotelId = null;

        // 权限检查：支持 hotel_admin 和 super_admin
        Auth.checkAuthStatus().then(result => {
            if (!result.loggedIn) {
                Auth.redirectToLogin(window.location.pathname);
                return;
            }
            const userRole = result.user.role;
            if (userRole !== 'hotel_admin' && userRole !== 'super_admin') {
                alert('无权限访问，当前角色: ' + userRole);
                window.location.href = '../index.html';
                return;
            }
            loadData();
        });

        async function loadData() {
            document.getElementById('loadingOverlay').style.display = 'flex';
            try {
                const hotelsRes = await Auth.fetchWithAuth('/api/admin/hotels');
                const hotelsData = await hotelsRes.json();

                if (!hotelsData.success || !hotelsData.data || hotelsData.data.length === 0) {
                    document.getElementById('roomSalesGrid').innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-hotel"></i>
                            <h3>暂无管理的酒店</h3>
                            <p>请联系管理员分配酒店管理权限</p>
                        </div>
                    `;
                    return;
                }

                currentHotelId = hotelsData.data[0].hotel_id;
                const res = await Auth.fetchWithAuth(`/api/admin/hotels/${currentHotelId}/room-sales`);
                const data = await res.json();
                
                if (!data.success || !data.data || data.data.length === 0) {
                    document.getElementById('roomSalesGrid').innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-bed"></i>
                            <h3>暂无房型</h3>
                            <p>请先在房型管理中添加房型</p>
                        </div>
                    `;
                    return;
                }

                renderRoomSales(data.data);
            } catch (e) {
                console.error('加载数据失败:', e);
                document.getElementById('roomSalesGrid').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>加载失败</h3>
                        <p>请刷新页面重试</p>
                    </div>
                `;
            } finally {
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        function renderRoomSales(roomSales) {
            const grid = document.getElementById('roomSalesGrid');
            grid.innerHTML = roomSales.map(room => {
                const totalRooms = room.total_rooms || 0;
                const forSaleRooms = room.for_sale_rooms || 0;
                
                return `
                <div class="room-sales-card">
                    <div class="room-sales-header">
                        <h3>${room.name}</h3>
                        <div class="price">¥${room.base_price || 0}<span>/晚</span></div>
                    </div>
                    
                    <div class="room-sales-stats">
                        <div class="room-sales-stat">
                            <div class="value">${totalRooms}</div>
                            <div class="label">总房间数</div>
                        </div>
                        <div class="room-sales-stat">
                            <div class="value">${forSaleRooms}</div>
                            <div class="label">可售房间</div>
                        </div>
                        <div class="room-sales-stat">
                            <div class="value">${room.available_rooms || 0}</div>
                            <div class="label">空房可入住</div>
                        </div>
                        <div class="room-sales-stat">
                            <div class="value">${(room.occupied_rooms || 0) + (room.booked_rooms || 0)}</div>
                            <div class="label">已占用</div>
                        </div>
                    </div>
                    
                    <div class="room-sales-divider"></div>
                    
                    <div class="room-status-grid">
                        <div class="room-status-item">
                            <div class="room-status-dot available"></div>
                            <div class="room-status-info">
                                <div class="name">空房</div>
                                <div class="count">${room.available_rooms || 0}</div>
                            </div>
                        </div>
                        <div class="room-status-item">
                            <div class="room-status-dot booked"></div>
                            <div class="room-status-info">
                                <div class="name">已预订</div>
                                <div class="count">${room.booked_rooms || 0}</div>
                            </div>
                        </div>
                        <div class="room-status-item">
                            <div class="room-status-dot occupied"></div>
                            <div class="room-status-info">
                                <div class="name">入住中</div>
                                <div class="count">${room.occupied_rooms || 0}</div>
                            </div>
                        </div>
                        <div class="room-status-item">
                            <div class="room-status-dot dirty"></div>
                            <div class="room-status-info">
                                <div class="name">待打扫</div>
                                <div class="count">${room.dirty_rooms || 0}</div>
                            </div>
                        </div>
                        <div class="room-status-item">
                            <div class="room-status-dot maintenance"></div>
                            <div class="room-status-info">
                                <div class="name">维修中</div>
                                <div class="count">${room.maintenance_rooms || 0}</div>
                            </div>
                        </div>
                        <div class="room-status-item">
                            <div class="room-status-dot locked"></div>
                            <div class="room-status-info">
                                <div class="name">已锁定</div>
                                <div class="count">${room.locked_rooms || 0}</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="room-booking-summary">
                        <div class="booking-summary-grid">
                            <div class="booking-summary-item">
                                <span class="label">今日预订</span>
                                <span class="value">${room.today_bookings || 0}</span>
                            </div>
                            <div class="booking-summary-item">
                                <span class="label">明日入住</span>
                                <span class="value">${room.tomorrow_checkins || 0}</span>
                            </div>
                            <div class="booking-summary-item">
                                <span class="label">今日退房</span>
                                <span class="value">${room.today_checkouts || 0}</span>
                            </div>
                            <div class="booking-summary-item">
                                <span class="label">本周入住</span>
                                <span class="value">${room.week_checkins || 0}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        loadData();
    </script>
</body>
</html>
