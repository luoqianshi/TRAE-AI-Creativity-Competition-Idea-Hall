<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
    :root {
        --bg-cream: #fefdf7;--bg-peach: #fff8f3;--card-white: #ffffff;--border-soft: #f0e6d8;--primary-sunshine: #ffb347;--primary-coral: #ff9966;--text-warm: #5d4037;--text-medium: #8d6e63;--text-light: #bdbdbd;--radius-soft: 24px;--radius-round: 32px;--radius-pill: 40px;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Nunito','Noto Sans SC',sans-serif;background:linear-gradient(180deg,var(--bg-cream) 0%,var(--bg-peach) 100%);color:var(--text-warm);min-height:100vh;display:flex;}
    .sidebar{width:260px;background:rgba(255,255,255,0.98);backdrop-filter:blur(20px);border-right:1px solid rgba(255,179,71,0.15);padding:24px 0;position:fixed;left:0;top:0;bottom:0;z-index:100;}
    .sidebar-logo{font-family:'Fredoka',sans-serif;font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--primary-sunshine),var(--primary-coral));-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:10px;padding:0 24px 24px;border-bottom:1px solid var(--border-soft);margin-bottom:20px;}
    .sidebar-logo i{color:var(--primary-sunshine);font-size:28px;}
    .sidebar-menu{list-style:none;padding:0 16px;}
    .sidebar-menu li{margin-bottom:8px;}
    .sidebar-menu a{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius-soft);text-decoration:none;color:var(--text-medium);font-weight:600;font-size:15px;transition:all 0.3s;}
    .sidebar-menu a:hover{background:var(--bg-peach);color:var(--primary-sunshine);transform:translateX(4px);}
    .sidebar-menu a.active{background:linear-gradient(135deg,rgba(255,179,71,0.15),rgba(255,153,102,0.15));color:var(--primary-sunshine);}
    .sidebar-menu a i{font-size:18px;width:24px;text-align:center;}
    .sidebar-footer{position:absolute;bottom:24px;left:0;right:0;padding:0 16px;border-top:1px solid var(--border-soft);}
    .sidebar-footer a{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius-soft);text-decoration:none;color:var(--text-light);font-size:14px;transition:all 0.3s;}
    .sidebar-footer a:hover{color:var(--primary-coral);background:rgba(255,183,178,0.1);}
    .main-content{flex:1;margin-left:260px;padding:24px;min-height:100vh;}
    .page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;}
    .page-header h1{font-family:'Fredoka',sans-serif;font-size:32px;font-weight:800;background:linear-gradient(135deg,#5d4037,#8d6e63);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .btn{padding:10px 26px;border-radius:var(--radius-pill);text-decoration:none;font-size:15px;font-weight:600;transition:all 0.3s;font-family:'Nunito',sans-serif;border:none;cursor:pointer;}
    .btn-primary{background:linear-gradient(135deg,var(--primary-sunshine),var(--primary-coral));color:white;box-shadow:0 8px 25px rgba(255,179,71,0.4);}
    .btn-primary:hover{transform:translateY(-4px);box-shadow:0 14px 35px rgba(255,179,71,0.5);}
    .btn-outline{border:2px solid var(--border-soft);color:var(--text-medium);background:white;}
    .btn-outline:hover{border-color:var(--primary-sunshine);color:var(--primary-sunshine);transform:translateY(-2px);}
    .content-card{background:var(--card-white);border:1px solid var(--border-soft);border-radius:var(--radius-soft);padding:28px;box-shadow:0 8px 24px rgba(255,179,71,0.06);margin-bottom:20px;}
    .content-card h3{font-family:'Fredoka',sans-serif;font-size:20px;font-weight:700;margin-bottom:24px;display:flex;align-items:center;gap:10px;color:var(--text-warm);}
    .content-card h3 i{color:var(--primary-sunshine);}
    .table{width:100%;border-collapse:collapse;}
    .table th{padding:16px;text-align:left;font-size:13px;color:var(--text-light);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;border-bottom:2px solid var(--border-soft);}
    .table td{padding:16px;border-bottom:1px solid var(--border-soft);}
    .table tbody tr:hover{background:var(--bg-peach);}
    .status-badge{padding:6px 14px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;}
    .status-active{background:rgba(168,230,207,0.2);color:#2e7d32;}
    .status-inactive{background:rgba(255,183,178,0.2);color:#c62828;}
    .status-pending{background:rgba(255,215,0,0.2);color:#f57f17;}
    .status-confirmed{background:rgba(79,195,247,0.2);color:#0288d1;}
    .action-buttons{display:flex;gap:8px;}
    .action-btn{padding:6px 14px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;text-decoration:none;transition:all 0.3s;border:none;cursor:pointer;}
    .action-btn.edit{background:rgba(79,195,247,0.2);color:#0288d1;}
    .action-btn.edit:hover{background:rgba(79,195,247,0.3);transform:translateY(-2px);}
    .action-btn.delete{background:rgba(255,183,178,0.2);color:#c62828;}
    .action-btn.delete:hover{background:rgba(255,183,178,0.3);transform:translateY(-2px);}
    .action-btn.confirm{background:rgba(168,230,207,0.2);color:#2e7d32;}
    .search-bar{display:flex;gap:12px;margin-bottom:20px;}
    .search-bar input{flex:1;padding:14px 20px;border:2px solid var(--border-soft);border-radius:var(--radius-round);font-size:15px;background:var(--bg-peach);color:var(--text-warm);font-family:'Nunito',sans-serif;font-weight:500;}
    .search-bar input:focus{outline:none;border-color:var(--primary-sunshine);box-shadow:0 6px 24px rgba(255,179,71,0.2);background:white;}
    .toast{position:fixed;top:24px;right:24px;padding:16px 24px;border-radius:var(--radius-soft);font-weight:600;font-size:15px;z-index:3000;animation:slideInRight 0.3s ease-out;box-shadow:0 8px 25px rgba(0,0,0,0.15);}
    .toast.success{background:linear-gradient(135deg,#a8e6cf,#81c784);color:white;}
    .toast.error{background:linear-gradient(135deg,#ffb7b2,#ff8a80);color:white;}
    @keyframes slideInRight{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
    .hotel-selector{margin-bottom:20px;}
    .hotel-selector label{font-size:13px;color:var(--text-light);font-weight:600;margin-bottom:8px;display:block;}
    .hotel-selector select{width:300px;padding:14px 20px;border:2px solid var(--border-soft);border-radius:var(--radius-round);font-size:15px;background:var(--bg-peach);color:var(--text-warm);font-family:'Nunito',sans-serif;font-weight:500;cursor:pointer;}
    .hotel-selector select:focus{outline:none;border-color:var(--primary-sunshine);box-shadow:0 6px 24px rgba(255,179,71,0.2);background:white;}
    .empty-state{text-align:center;padding:60px;color:var(--text-light);}
    .empty-state i{font-size:48px;margin-bottom:16px;color:var(--border-soft);}
    .empty-state p{font-size:16px;}
    .action-btn.detail{background:linear-gradient(135deg,rgba(108,99,255,0.15),rgba(139,92,246,0.15));color:#6c63ff;}
    .action-btn.detail:hover{background:linear-gradient(135deg,rgba(108,99,255,0.25),rgba(139,92,246,0.25));transform:translateY(-2px);}
</style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo"><i class="fas fa-hotel"></i><span>酒店管理</span></div>
        <ul class="sidebar-menu">
            <li><a href="index.html"><i class="fas fa-chart-pie"></i> 仪表盘</a></li>
            <li><a href="analytics.html"><i class="fas fa-chart-line"></i> 数据分析</a></li>
            <li><a href="hotel-info.html"><i class="fas fa-building"></i> 酒店信息</a></li>
            <li><a href="room-types.html"><i class="fas fa-bed"></i> 房型管理</a></li>
            <li><a href="room-sales.html"><i class="fas fa-chart-bar"></i> 房型销售</a></li>
            <li><a href="orders.html" class="active"><i class="fas fa-receipt"></i> 订单管理</a></li>
            <li><a href="reviews.html"><i class="fas fa-star"></i> 评价管理</a></li>
            <li><a href="notifications.html"><i class="fas fa-bell"></i> 消息通知</a></li>
            <li><a href="checkin.html"><i class="fas fa-clipboard-check"></i> 入住管理</a></li>
            <li><a href="facilities.html"><i class="fas fa-concierge-bell"></i> 设施管理</a></li>
        </ul>
        <div class="sidebar-footer"><a href="#" onclick="Auth.logout()"><i class="fas fa-sign-out-alt"></i> 退出登录</a></div>
    </aside>
    <main class="main-content">
        <div class="page-header"><h1>订单管理</h1></div>
        <div class="hotel-selector"><label>当前管理酒店</label><div id="currentHotelDisplay" style="padding: 14px 20px; background: var(--bg-peach); border-radius: var(--radius-round); font-size: 16px; font-weight: 600; color: var(--text-warm); border: 2px solid var(--border-soft);">加载中...</div></div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="搜索订单号或入住人姓名" style="width:220px;">
            <select id="statusFilter" onchange="currentPage=1;loadOrders()">
                <option value="">全部状态</option>
                <option value="pending_process">待处理</option>
                <option value="pending">待支付</option>
                <option value="confirmed">已确认</option>
                <option value="checked_in_pre">待入住</option>
                <option value="checked_in">已入住</option>
                <option value="checked_out">已完成</option>
                <option value="cancelled">已取消</option>
            </select>
            <select id="sortOrder" onchange="currentPage=1;loadOrders()" style="padding:14px 20px;border:2px solid var(--border-soft);border-radius:var(--radius-round);font-size:15px;background:var(--bg-peach);color:var(--text-warm);font-family:'Nunito',sans-serif;font-weight:500;cursor:pointer;">
                <option value="desc">最新在前</option>
                <option value="asc">最旧在前</option>
            </select>
            <button class="btn btn-primary" onclick="currentPage=1;loadOrders()"><i class="fas fa-search"></i></button>
        </div>
        <div class="content-card">
            <h3><i class="fas fa-list"></i> 订单列表 <span id="orderCount" style="font-size:14px;color:var(--text-light);font-weight:normal;"></span></h3>
            <table class="table">
                <thead><tr><th>订单号</th><th>入住人</th><th>房型</th><th>日期</th><th>金额</th><th>状态</th><th>操作</th></tr></thead>
                <tbody id="orderTableBody"></tbody>
            </table>
            <div id="paginationControls" class="pagination-controls" style="display:none;margin-top:20px;display:flex;justify-content:center;align-items:center;gap:10px;">
                <button id="prevPage" class="btn btn-secondary" onclick="prevPage()"><i class="fas fa-chevron-left"></i> 上一页</button>
                <span id="pageInfo" style="font-size:14px;color:var(--text-light);"></span>
                <button id="nextPage" class="btn btn-secondary" onclick="nextPage()">下一页 <i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </main>
    <script src="../js/auth.js"></script>
    <script>
        let hotels = [], currentHotelId = null;
        let currentPage = 1, pageSize = 20, totalPages = 1, totalOrders = 0;

        async function init() {
            const authResult = await Auth.checkAuthStatus();
            if (!authResult.loggedIn) { Auth.redirectToLogin('admin/orders.html'); return; }
            // 支持 hotel_admin 和 super_admin 访问
            const userRole = authResult.user.role;
            if (userRole !== 'hotel_admin' && userRole !== 'super_admin') { 
                alert('无权限访问，当前角色: ' + userRole); 
                window.location.href='../index.html'; 
                return; 
            }
            await loadHotels();
        }
        async function loadHotels() {
            try {
                const res = await Auth.fetchWithAuth('/api/admin/hotels');
                const data = await res.json();
                if (data.success && data.data) {
                    hotels = data.data;
                    const display = document.getElementById('currentHotelDisplay');
                    if (hotels.length > 0) { 
                        currentHotelId = hotels[0].hotel_id; 
                        display.textContent = hotels[0].name;
                        loadOrders(); 
                    } else {
                        display.textContent = '暂无管理的酒店';
                    }
                }
            } catch(e) { console.error('加载酒店失败:',e); }
        }
        async function loadOrders() {
            if (!currentHotelId) return;
            const status = document.getElementById('statusFilter').value;
            const sort = document.getElementById('sortOrder').value;
            const search = document.getElementById('searchInput').value;
            let url = '/api/admin/hotels/' + currentHotelId + '/orders';
            const params = [];
            if (status) params.push('status=' + status);
            params.push('sort=' + sort);
            params.push('page=' + currentPage);
            params.push('pageSize=' + pageSize);
            if (params.length > 0) url += '?' + params.join('&');
            try {
                const res = await Auth.fetchWithAuth(url);
                const data = await res.json();
                const tbody = document.getElementById('orderTableBody');
                tbody.innerHTML = '';
                if (data.success && data.data) {
                    let orders = data.data.orders || [];
                    totalOrders = data.data.total || 0;
                    totalPages = data.data.totalPages || 1;

                    // 前端搜索过滤（仅当有搜索关键词时）
                    if (search) {
                        orders = orders.filter(o => o.booking_id.toString().includes(search) || (o.guest_name && o.guest_name.includes(search)));
                    }

                    document.getElementById('orderCount').textContent = `(共 ${totalOrders} 条)`;

                    if (orders.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="7" class="empty-state"><i class="fas fa-receipt"></i><p>暂无订单数据</p></td></tr>';
                        document.getElementById('paginationControls').style.display = 'none';
                        return;
                    }

                    orders.forEach(order => {
                        const actions = '<a href="order-detail.html?id=' + order.booking_id + '" class="action-btn detail">查看详情</a>';
                        tbody.innerHTML += '<tr><td>#' + order.booking_id + '</td><td>' + order.guest_name + '</td><td>' + (order.room_type_name || order.room_name || '房型') + '</td><td>' + order.check_in_date + ' - ' + order.check_out_date + '</td><td>¥' + order.total_amount + '</td><td><span class="status-badge ' + getStatusClass(order.status) + '">' + getStatusLabel(order.status) + '</span></td><td><div class="action-buttons">' + actions + (order.status === 'pending' ? '<button class="action-btn confirm" onclick="confirmOrder(' + order.booking_id + ')">确认订单</button>' : '') + (order.status === 'confirmed' || order.status === 'checked_in_pre' ? '<button class="action-btn confirm" onclick="checkInOrder(' + order.booking_id + ')">办理入住</button>' : '') + (order.status === 'checked_in' ? '<button class="action-btn edit" onclick="checkOutOrder(' + order.booking_id + ')">办理退房</button>' : '') + '</div></td></tr>';
                    });

                    // 更新分页控件
                    updatePagination();
                    document.getElementById('paginationControls').style.display = 'flex';
                } else {
                    tbody.innerHTML = '<tr><td colspan="7" class="empty-state"><i class="fas fa-receipt"></i><p>暂无订单数据</p></td></tr>';
                    document.getElementById('paginationControls').style.display = 'none';
                }
            } catch(e) { console.error('加载订单失败:',e); }
        }

        function updatePagination() {
            document.getElementById('pageInfo').textContent = '第 ' + currentPage + ' / ' + totalPages + ' 页，共 ' + totalOrders + ' 条';
            document.getElementById('prevPage').disabled = currentPage <= 1;
            document.getElementById('nextPage').disabled = currentPage >= totalPages;
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                loadOrders();
            }
        }

        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                loadOrders();
            }
        }
        function getStatusLabel(status) {
            const labels = {'pending_process':'待处理','pending':'待支付','confirmed':'已确认','checked_in_pre':'待入住','checked_in':'已入住','checked_out':'已完成','cancelled':'已取消'};
            return labels[status] || status;
        }
        function getStatusClass(status) {
            const classes = {'pending_process':'status-pending','pending':'status-pending','confirmed':'status-confirmed','checked_in_pre':'status-active','checked_in':'status-active','checked_out':'status-inactive','cancelled':'status-inactive'};
            return classes[status] || '';
        }
        async function confirmOrder(id) {
            try {
                const res = await Auth.fetchWithAuth('/api/admin/orders/' + id + '/confirm', { method: 'POST' });
                const data = await res.json();
                if (data.success) { showToast('已设为待入住', 'success'); loadOrders(); }
                else { showToast(data.message || '操作失败', 'error'); }
            } catch(e) { showToast('操作失败', 'error'); }
        }
        async function checkInOrder(id) {
            const roomNumber = prompt('请输入分配的房号：');
            if (!roomNumber) return;
            const guestName = prompt('请输入实际入住人姓名：');
            if (!guestName) return;
            try {
                const res = await Auth.fetchWithAuth('/api/admin/orders/' + id + '/check-in', {
                    method: 'POST', headers: {'Content-Type':'application/json', ...Auth._getAuthHeaders()},
                    body: JSON.stringify({room_number: roomNumber, actual_guest_name: guestName, actual_guest_id_card: '110101199001011234', id_card_front_image: '/uploads/id-cards/' + id + '/front.jpg', id_card_back_image: '/uploads/id-cards/' + id + '/back.jpg'})
                });
                const data = await res.json();
                if (data.success) { showToast('入住办理成功', 'success'); loadOrders(); }
                else { showToast(data.message || '操作失败', 'error'); }
            } catch(e) { showToast('操作失败', 'error'); }
        }
        async function checkOutOrder(id) {
            if (!confirm('确定要办理退房吗？')) return;
            try {
                const res = await Auth.fetchWithAuth('/api/admin/orders/' + id + '/check-out', { method: 'POST' });
                const data = await res.json();
                if (data.success) { showToast('退房办理成功', 'success'); loadOrders(); }
                else { showToast(data.message || '操作失败', 'error'); }
            } catch(e) { showToast('操作失败', 'error'); }
        }
        function showToast(msg, type) {
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        init();
    </script>
</body>
</html>
