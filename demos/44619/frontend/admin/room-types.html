<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>房型管理</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
    :root {
        --bg-cream: #fefdf7;--bg-peach: #fff8f3;--bg-mint: #f0fffa;--card-white: #ffffff;--border-soft: #f0e6d8;--primary-sunshine: #ffb347;--primary-coral: #ff9966;--secondary-lavender: #b39ddb;--accent-pink: #ffb7b2;--text-warm: #5d4037;--text-medium: #8d6e63;--text-light: #bdbdbd;--shadow-soft: 0 8px 24px rgba(255,179,71,0.06);--radius-soft: 24px;--radius-round: 32px;--radius-pill: 40px;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Nunito','Noto Sans SC',sans-serif;background:linear-gradient(180deg,var(--bg-cream) 0%,var(--bg-peach) 100%);color:var(--text-warm);min-height:100vh;display:flex;}
    .sidebar{width:260px;background:rgba(255,255,255,0.98);backdrop-filter:blur(20px);border-right:1px solid rgba(255,179,71,0.15);padding:24px 0;position:fixed;left:0;top:0;bottom:0;z-index:100;}
    .sidebar-logo{font-family:'Fredoka',sans-serif;font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--primary-sunshine),var(--primary-coral));-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:10px;padding:0 24px 24px;border-bottom:1px solid var(--border-soft);margin-bottom:20px;}
    .sidebar-logo i{color:var(--primary-sunshine);font-size:28px;}
    .sidebar-menu{list-style:none;padding:0 16px;}
    .sidebar-menu li{margin-bottom:8px;}
    .sidebar-menu a{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius-soft);text-decoration:none;color:var(--text-medium);font-weight:600;font-size:15px;transition:all 0.3s;}
    .sidebar-menu a:hover{background:var(--bg-peach);color:var(--primary-sunshine);transform:translateX(4px);}
    .sidebar-menu a.active{background:linear-gradient(135deg,rgba(255,179,71,0.15),rgba(255,153,102,0.15));color:var(--primary-sunshine);}
    .sidebar-menu a i{font-size:18px;width:24px;text-align:center;}
    .sidebar-footer{position:absolute;bottom:24px;left:0;right:0;padding:0 16px;border-top:1px solid var(--border-soft);}
    .sidebar-footer a{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius-soft);text-decoration:none;color:var(--text-light);font-size:14px;transition:all 0.3s;}
    .sidebar-footer a:hover{color:var(--primary-coral);background:rgba(255,183,178,0.1);}
    .main-content{flex:1;margin-left:260px;padding:24px;min-height:100vh;}
    .page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;}
    .page-header h1{font-family:'Fredoka',sans-serif;font-size:32px;font-weight:800;background:linear-gradient(135deg,#5d4037,#8d6e63);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .btn{padding:10px 26px;border-radius:var(--radius-pill);text-decoration:none;font-size:15px;font-weight:600;transition:all 0.3s;font-family:'Nunito',sans-serif;border:none;cursor:pointer;}
    .btn-primary{background:linear-gradient(135deg,var(--primary-sunshine),var(--primary-coral));color:white;box-shadow:0 8px 25px rgba(255,179,71,0.4);}
    .btn-primary:hover{transform:translateY(-4px);box-shadow:0 14px 35px rgba(255,179,71,0.5);}
    .btn-outline{border:2px solid var(--border-soft);color:var(--text-medium);background:white;}
    .btn-outline:hover{border-color:var(--primary-sunshine);color:var(--primary-sunshine);transform:translateY(-2px);}
    .content-card{background:var(--card-white);border:1px solid var(--border-soft);border-radius:var(--radius-soft);padding:28px;box-shadow:var(--shadow-soft);margin-bottom:20px;}
    .content-card h3{font-family:'Fredoka',sans-serif;font-size:20px;font-weight:700;margin-bottom:24px;display:flex;align-items:center;gap:10px;color:var(--text-warm);}
    .content-card h3 i{color:var(--primary-sunshine);}
    .form-group{margin-bottom:20px;}
    .form-group label{font-size:13px;color:var(--text-light);font-weight:600;margin-bottom:8px;display:block;text-transform:uppercase;letter-spacing:0.5px;}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:14px 20px;border:2px solid var(--border-soft);border-radius:var(--radius-round);font-size:15px;background:var(--bg-peach);color:var(--text-warm);font-family:'Nunito',sans-serif;font-weight:500;transition:all 0.3s;}
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary-sunshine);box-shadow:0 6px 24px rgba(255,179,71,0.2);background:white;}
    .form-group textarea{resize:vertical;min-height:100px;}
    .table{width:100%;border-collapse:collapse;}
    .table th{padding:16px;text-align:left;font-size:13px;color:var(--text-light);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;border-bottom:2px solid var(--border-soft);}
    .table td{padding:16px;border-bottom:1px solid var(--border-soft);}
    .table tbody tr:hover{background:var(--bg-peach);}
    .status-badge{padding:6px 14px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;}
    .status-active{background:rgba(168,230,207,0.2);color:#2e7d32;}
    .status-inactive{background:rgba(255,183,178,0.2);color:#c62828;}
    .status-pending{background:rgba(255,215,0,0.2);color:#f57f17;}
    .action-buttons{display:flex;gap:8px;}
    .action-btn{padding:6px 14px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;text-decoration:none;transition:all 0.3s;border:none;cursor:pointer;}
    .action-btn.edit{background:rgba(79,195,247,0.2);color:#0288d1;}
    .action-btn.edit:hover{background:rgba(79,195,247,0.3);transform:translateY(-2px);}
    .action-btn.delete{background:rgba(255,183,178,0.2);color:#c62828;}
    .action-btn.delete:hover{background:rgba(255,183,178,0.3);transform:translateY(-2px);}
    .action-btn.confirm{background:rgba(168,230,207,0.2);color:#2e7d32;}
    .action-btn.generate{background:rgba(255,179,71,0.2);color:#e65100;}
    .action-btn.generate:hover{background:rgba(255,179,71,0.3);transform:translateY(-2px);}
    .modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);z-index:2000;align-items:center;justify-content:center;}
    .modal.show{display:flex;}
    .modal-content{background:white;border-radius:var(--radius-soft);padding:30px;width:90%;max-width:500px;box-shadow:0 20px 60px rgba(0,0,0,0.15);animation:slideUp 0.3s ease-out;}
    @keyframes slideUp{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
    .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
    .modal-header h3{font-family:'Fredoka',sans-serif;font-size:22px;font-weight:700;color:var(--text-warm);}
    .modal-close{background:none;border:none;font-size:24px;color:var(--text-light);cursor:pointer;}
    .modal-footer{display:flex;justify-content:flex-end;gap:12px;margin-top:24px;}
    .toast{position:fixed;top:24px;right:24px;padding:16px 24px;border-radius:var(--radius-soft);font-weight:600;font-size:15px;z-index:3000;animation:slideInRight 0.3s ease-out;box-shadow:0 8px 25px rgba(0,0,0,0.15);}
    .toast.success{background:linear-gradient(135deg,#a8e6cf,#81c784);color:white;}
    .toast.error{background:linear-gradient(135deg,#ffb7b2,#ff8a80);color:white;}
    @keyframes slideInRight{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
    .hotel-selector{margin-bottom:20px;}
    .hotel-selector label{font-size:13px;color:var(--text-light);font-weight:600;margin-bottom:8px;display:block;}
    .hotel-selector select{width:300px;padding:14px 20px;border:2px solid var(--border-soft);border-radius:var(--radius-round);font-size:15px;background:var(--bg-peach);color:var(--text-warm);font-family:'Nunito',sans-serif;font-weight:500;cursor:pointer;}
    .hotel-selector select:focus{outline:none;border-color:var(--primary-sunshine);box-shadow:0 6px 24px rgba(255,179,71,0.2);background:white;}
    .empty-state{text-align:center;padding:60px;color:var(--text-light);}
    .empty-state i{font-size:48px;margin-bottom:16px;color:var(--border-soft);}
    .empty-state p{font-size:16px;}
</style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo"><i class="fas fa-hotel"></i><span>酒店管理</span></div>
        <ul class="sidebar-menu">
            <li><a href="index.html"><i class="fas fa-chart-pie"></i> 仪表盘</a></li>
            <li><a href="analytics.html"><i class="fas fa-chart-line"></i> 数据分析</a></li>
            <li><a href="hotel-info.html"><i class="fas fa-building"></i> 酒店信息</a></li>
            <li><a href="room-types.html" class="active"><i class="fas fa-bed"></i> 房型管理</a></li>
            <li><a href="room-sales.html"><i class="fas fa-chart-bar"></i> 房型销售</a></li>
            <li><a href="orders.html"><i class="fas fa-receipt"></i> 订单管理</a></li>
            <li><a href="reviews.html"><i class="fas fa-star"></i> 评价管理</a></li>
            <li><a href="notifications.html"><i class="fas fa-bell"></i> 消息通知</a></li>
            <li><a href="checkin.html"><i class="fas fa-clipboard-check"></i> 入住管理</a></li>
            <li><a href="facilities.html"><i class="fas fa-concierge-bell"></i> 设施管理</a></li>
        </ul>
        <div class="sidebar-footer"><a href="#" onclick="Auth.logout()"><i class="fas fa-sign-out-alt"></i> 退出登录</a></div>
    </aside>
    <main class="main-content">
        <div class="page-header"><h1>房型管理</h1><button class="btn btn-primary" onclick="showAddModal()"><i class="fas fa-plus"></i> 新增房型</button></div>
        <div class="hotel-selector"><label>选择酒店</label><select id="hotelSelect" onchange="loadRooms()"><option value="">请选择酒店</option></select></div>
        <div class="content-card">
            <h3><i class="fas fa-list"></i> 房型列表</h3>
            <table class="table">
                <thead><tr><th>房型名称</th><th>床型</th><th>面积</th><th>人数</th><th>价格</th><th>库存</th><th>已生成房间</th><th>楼层分布</th><th>状态</th><th>操作</th></tr></thead>
                <tbody id="roomTableBody"></tbody>
            </table>
        </div>
    </main>
    <div class="modal" id="roomModal">
        <div class="modal-content">
            <div class="modal-header"><h3 id="modalTitle">新增房型</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
            <form id="roomForm">
                <input type="hidden" id="roomId">
                <div class="form-group"><label>房型名称</label><input type="text" id="roomName" placeholder="请输入房型名称"></div>
                <div class="form-group"><label>床型</label><select id="roomBedType"><option value="single">单人床</option><option value="double">双人床</option><option value="king">特大床</option><option value="twin">双床</option></select></div>
                <div class="form-group"><label>面积(㎡)</label><input type="number" id="roomArea" placeholder="请输入面积"></div>
                <div class="form-group"><label>最大人数</label><input type="number" id="roomGuests" placeholder="请输入最大人数"></div>
                <div class="form-group"><label>单价(元/晚)</label><input type="number" id="roomPrice" placeholder="请输入单价"></div>
                <div class="form-group"><label>总房间数</label><input type="number" id="roomInventory" placeholder="请输入总房间数"></div>
                <div class="form-group"><label>房型描述</label><textarea id="roomDesc" placeholder="请输入房型描述"></textarea></div>
                <div class="form-group"><label>状态</label><select id="roomStatus"><option value="active">启用</option><option value="inactive">停用</option></select></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
    <!-- 生成房间模态框 -->
    <div class="modal" id="generateModal">
        <div class="modal-content">
            <div class="modal-header"><h3>生成房间</h3><button class="modal-close" onclick="closeGenerateModal()">&times;</button></div>
            <form id="generateForm">
                <input type="hidden" id="generateRoomId">
                <p style="margin-bottom: 16px; color: var(--text-medium);">为房型 <strong id="generateRoomName"></strong> 批量生成具体房间实例</p>
                <div class="form-group"><label>起始楼层</label><input type="number" id="startFloor" value="1" min="1" placeholder="从第几层开始"></div>
                <div class="form-group"><label>起始房号</label><input type="number" id="startRoom" value="101" min="1" placeholder="如101表示第1层第1间"></div>
                <div class="form-group"><label>生成数量</label><input type="number" id="generateCount" min="1" placeholder="留空则使用房型库存数"></div>
                <div class="form-group"><label>房号前缀</label><input type="text" id="roomPrefix" placeholder="可选，如A栋填写A"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="closeGenerateModal()">取消</button>
                    <button type="submit" class="btn btn-primary">生成房间</button>
                </div>
            </form>
        </div>
    </div>
    <script src="../js/auth.js"></script>
    <script>
        let hotels = [], currentHotelId = null;
        async function init() {
            const authResult = await Auth.checkAuthStatus();
            if (!authResult.loggedIn) { Auth.redirectToLogin('admin/room-types.html'); return; }
            const userRole = authResult.user.role;
            if (userRole !== 'hotel_admin' && userRole !== 'super_admin') { 
                alert('无权限访问，当前角色: ' + userRole); 
                window.location.href='../index.html'; 
                return; 
            }
            await loadHotels();
        }
        async function loadHotels() {
            try {
                const res = await Auth.fetchWithAuth('/api/admin/hotels');
                const data = await res.json();
                if (data.success && data.data) {
                    hotels = data.data;
                    const select = document.getElementById('hotelSelect');
                    select.innerHTML = '<option value="">请选择酒店</option>';
                    hotels.forEach(h => {
                        const option = document.createElement('option');
                        option.value = h.hotel_id;
                        option.textContent = h.name;
                        select.appendChild(option);
                    });
                    if (hotels.length > 0) { select.value = hotels[0].hotel_id; loadRooms(); }
                }
            } catch(e) { console.error('加载酒店失败:',e); }
        }
        async function loadRooms() {
            const hotelId = document.getElementById('hotelSelect').value;
            if (!hotelId) return;
            currentHotelId = parseInt(hotelId);
            try {
                // 获取房型列表
                const res = await Auth.fetchWithAuth('/api/admin/hotels/' + hotelId + '/rooms');
                const data = await res.json();
                
                // 获取已生成的房间列表（用于统计每个房型的房间数）
                const roomsRes = await Auth.fetchWithAuth('/api/admin/hotels/' + hotelId + '/rooms-instances');
                const roomsData = await roomsRes.json();
                
                // 统计每个房型的已生成房间数
                const roomCountMap = {};
                if (roomsData.success && roomsData.data) {
                    roomsData.data.forEach(room => {
                        const typeId = String(room.room_type_id);
                        roomCountMap[typeId] = (roomCountMap[typeId] || 0) + 1;
                    });
                }
                
                // 按房型ID和楼层分组统计房间
                const floorStatsMap = {};
                if (roomsData.success && roomsData.data) {
                    roomsData.data.forEach(room => {
                        const typeId = String(room.room_type_id);
                        const floorNum = room.floor_number;
                        if (!floorStatsMap[typeId]) floorStatsMap[typeId] = {};
                        floorStatsMap[typeId][floorNum] = (floorStatsMap[typeId][floorNum] || 0) + 1;
                    });
                }
                
                const tbody = document.getElementById('roomTableBody');
                tbody.innerHTML = '';
                if (data.success && data.data) {
                    data.data.forEach(room => {
                        const roomIdStr = String(room.room_id);
                        const generatedCount = roomCountMap[roomIdStr] || 0;
                        const needGenerate = generatedCount === 0;
                        const floors = floorStatsMap[roomIdStr] || {};
                        const floorKeys = Object.keys(floors).sort((a, b) => a - b);
                        const floorDisplay = floorKeys.length > 0
                            ? floorKeys.map(f => `${f}层 ${floors[f]}间`).join('，')
                            : '未分配';
                        tbody.innerHTML += '<tr><td>' + room.name + '</td><td>' + getBedTypeLabel(room.bed_type) + '</td><td>' + (room.area_sqm || 0) + ' ㎡</td><td>' + room.max_guests + '人</td><td>¥' + room.base_price + '</td><td>' + room.inventory_count + '间</td><td><span class="status-badge ' + (generatedCount > 0 ? 'status-active' : 'status-inactive') + '">' + generatedCount + '间</span></td><td style="font-size:12px;line-height:1.6;">' + floorDisplay + '</td><td><span class="status-badge ' + (room.status === 'active' ? 'status-active' : 'status-inactive') + '">' + (room.status === 'active' ? '启用' : '停用') + '</span></td><td><div class="action-buttons">' + (needGenerate ? '<button class="action-btn generate" onclick="showGenerateModal(' + room.room_id + ', \'' + room.name + '\', ' + room.inventory_count + ')">生成房间</button>' : '') + '<button class="action-btn edit" onclick="editRoom(' + room.room_id + ')">编辑</button><button class="action-btn delete" onclick="deleteRoom(' + room.room_id + ')">删除</button></div></td></tr>';
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="10" class="empty-state"><i class="fas fa-bed"></i><p>暂无房型数据</p></td></tr>';
                }
            } catch(e) { console.error('加载房型失败:',e); }
        }
        function getBedTypeLabel(type) {
            const labels = {'single':'单人床','double':'双人床','king':'特大床','twin':'双床'};
            return labels[type] || type;
        }
        function showAddModal() {
            document.getElementById('modalTitle').textContent = '新增房型';
            document.getElementById('roomId').value = '';
            document.getElementById('roomName').value = '';
            document.getElementById('roomBedType').value = 'double';
            document.getElementById('roomArea').value = '';
            document.getElementById('roomGuests').value = '';
            document.getElementById('roomPrice').value = '';
            document.getElementById('roomInventory').value = '';
            document.getElementById('roomDesc').value = '';
            document.getElementById('roomStatus').value = 'active';
            document.getElementById('roomModal').classList.add('show');
        }
        function editRoom(id) {
            Auth.fetchWithAuth('/api/admin/hotels/' + currentHotelId + '/rooms').then(res => res.json()).then(data => {
                if (data.success) {
                    const room = data.data.find(r => r.room_id === id);
                    if (room) {
                        document.getElementById('modalTitle').textContent = '编辑房型';
                        document.getElementById('roomId').value = room.room_id;
                        document.getElementById('roomName').value = room.name;
                        document.getElementById('roomBedType').value = room.bed_type || 'double';
                        document.getElementById('roomArea').value = room.area_sqm || '';
                        document.getElementById('roomGuests').value = room.max_guests;
                        document.getElementById('roomPrice').value = room.base_price;
                        document.getElementById('roomInventory').value = room.inventory_count;
                        document.getElementById('roomDesc').value = room.description || '';
                        document.getElementById('roomStatus').value = room.status;
                        document.getElementById('roomModal').classList.add('show');
                    }
                }
            });
        }
        function closeModal() { document.getElementById('roomModal').classList.remove('show'); }
        
        function showGenerateModal(roomId, roomName, inventory) {
            document.getElementById('generateRoomId').value = roomId;
            document.getElementById('generateRoomName').textContent = roomName;
            document.getElementById('generateCount').value = inventory;
            document.getElementById('generateCount').placeholder = '默认 ' + inventory + ' 间';
            document.getElementById('generateModal').classList.add('show');
        }
        
        function closeGenerateModal() { document.getElementById('generateModal').classList.remove('show'); }
        
        document.getElementById('generateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const roomId = document.getElementById('generateRoomId').value;
            const body = {
                start_floor: parseInt(document.getElementById('startFloor').value) || 1,
                start_room: parseInt(document.getElementById('startRoom').value) || 101,
                count: parseInt(document.getElementById('generateCount').value) || undefined,
                prefix: document.getElementById('roomPrefix').value || ''
            };
            try {
                const res = await Auth.fetchWithAuth('/api/admin/hotels/' + currentHotelId + '/rooms/' + roomId + '/generate-rooms', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json', ...Auth._getAuthHeaders()},
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (data.success) {
                    showToast(data.message || '生成成功', 'success');
                    closeGenerateModal();
                    loadRooms();
                } else {
                    showToast(data.message || '生成失败', 'error');
                }
            } catch(e) {
                showToast('生成失败', 'error');
            }
        });
        
        document.getElementById('roomForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const roomId = document.getElementById('roomId').value;
            const body = {
                name: document.getElementById('roomName').value,
                bed_type: document.getElementById('roomBedType').value,
                area_sqm: document.getElementById('roomArea').value,
                max_guests: document.getElementById('roomGuests').value,
                base_price: document.getElementById('roomPrice').value,
                inventory_count: document.getElementById('roomInventory').value,
                description: document.getElementById('roomDesc').value,
                status: document.getElementById('roomStatus').value
            };
            try {
                let res;
                if (roomId) {
                    res = await Auth.fetchWithAuth('/api/admin/hotels/' + currentHotelId + '/rooms/' + roomId, {
                        method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
                    });
                } else {
                    res = await Auth.fetchWithAuth('/api/admin/hotels/' + currentHotelId + '/rooms', {
                        method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
                    });
                }
                const data = await res.json();
                if (data.success) { showToast(roomId ? '更新成功' : '创建成功', 'success'); closeModal(); loadRooms(); }
                else { showToast(data.message || '操作失败', 'error'); }
            } catch(e) { showToast('操作失败', 'error'); }
        });
        async function deleteRoom(id) {
            if (!confirm('确定要删除这个房型吗？')) return;
            try {
                const res = await Auth.fetchWithAuth('/api/admin/hotels/' + currentHotelId + '/rooms/' + id, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) { showToast('删除成功', 'success'); loadRooms(); }
                else { showToast(data.message || '删除失败', 'error'); }
            } catch(e) { showToast('删除失败', 'error'); }
        }
        function showToast(msg, type) {
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        init();
    </script>
</body>
</html>
