<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息通知</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
    :root {
        --bg-cream: #fefdf7;--bg-peach: #fff8f3;--card-white: #ffffff;--border-soft: #f0e6d8;--primary-sunshine: #ffb347;--primary-coral: #ff9966;--text-warm: #5d4037;--text-medium: #8d6e63;--text-light: #bdbdbd;--radius-soft: 24px;--radius-round: 32px;--radius-pill: 40px;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Nunito','Noto Sans SC',sans-serif;background:linear-gradient(180deg,var(--bg-cream) 0%,var(--bg-peach) 100%);color:var(--text-warm);min-height:100vh;display:flex;}
    .sidebar{width:260px;background:rgba(255,255,255,0.98);backdrop-filter:blur(20px);border-right:1px solid rgba(255,179,71,0.15);padding:24px 0;position:fixed;left:0;top:0;bottom:0;z-index:100;}
    .sidebar-logo{font-family:'Fredoka',sans-serif;font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--primary-sunshine),var(--primary-coral));-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:10px;padding:0 24px 24px;border-bottom:1px solid var(--border-soft);margin-bottom:20px;}
    .sidebar-logo i{color:var(--primary-sunshine);font-size:28px;}
    .sidebar-menu{list-style:none;padding:0 16px;}
    .sidebar-menu li{margin-bottom:8px;}
    .sidebar-menu a{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius-soft);text-decoration:none;color:var(--text-medium);font-weight:600;font-size:15px;transition:all 0.3s;}
    .sidebar-menu a:hover{background:var(--bg-peach);color:var(--primary-sunshine);transform:translateX(4px);}
    .sidebar-menu a.active{background:linear-gradient(135deg,rgba(255,179,71,0.15),rgba(255,153,102,0.15));color:var(--primary-sunshine);}
    .sidebar-menu a i{font-size:18px;width:24px;text-align:center;}
    .sidebar-footer{position:absolute;bottom:24px;left:0;right:0;padding:0 16px;border-top:1px solid var(--border-soft);}
    .sidebar-footer a{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius-soft);text-decoration:none;color:var(--text-light);font-size:14px;transition:all 0.3s;}
    .sidebar-footer a:hover{color:var(--primary-coral);background:rgba(255,183,178,0.1);}
    .main-content{flex:1;margin-left:260px;padding:24px;min-height:100vh;}
    .page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;}
    .page-header h1{font-family:'Fredoka',sans-serif;font-size:32px;font-weight:800;background:linear-gradient(135deg,#5d4037,#8d6e63);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .content-card{background:var(--card-white);border:1px solid var(--border-soft);border-radius:var(--radius-soft);padding:28px;box-shadow:0 8px 24px rgba(255,179,71,0.06);margin-bottom:20px;}
    .content-card h3{font-family:'Fredoka',sans-serif;font-size:20px;font-weight:700;margin-bottom:24px;display:flex;align-items:center;gap:10px;color:var(--text-warm);}
    .content-card h3 i{color:var(--primary-sunshine);}
    .notification-list{display:flex;flex-direction:column;gap:12px;}
    .notification-item{display:flex;align-items:flex-start;gap:16px;padding:18px;background:var(--bg-peach);border-radius:var(--radius-soft);cursor:pointer;transition:all 0.3s;border:2px solid transparent;}
    .notification-item:hover{transform:translateX(8px);box-shadow:0 6px 20px rgba(255,179,71,0.15);}
    .notification-item.unread{background:rgba(255,179,71,0.1);border-color:var(--primary-sunshine);}
    .notification-icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:white;flex-shrink:0;}
    .notification-icon.order{background:linear-gradient(135deg,#ffb347,#ff9966);}
    .notification-icon.review{background:linear-gradient(135deg,#b39ddb,#9575cd);}
    .notification-icon.system{background:linear-gradient(135deg,#81d4fa,#4fc3f7);}
    .notification-icon.price_change{background:linear-gradient(135deg,#a8e6cf,#81c784);}
    .notification-content{flex:1;}
    .notification-title{font-size:16px;font-weight:700;color:var(--text-warm);margin-bottom:4px;}
    .notification-text{font-size:14px;color:var(--text-medium);line-height:1.5;}
    .notification-time{font-size:12px;color:var(--text-light);margin-top:6px;}
    .notification-dot{width:10px;height:10px;border-radius:50%;background:var(--primary-coral);flex-shrink:0;}
    .empty-state{text-align:center;padding:60px;color:var(--text-light);}
    .empty-state i{font-size:48px;margin-bottom:16px;color:var(--border-soft);}
    .empty-state p{font-size:16px;}
    .toast{position:fixed;top:24px;right:24px;padding:16px 24px;border-radius:var(--radius-soft);font-weight:600;font-size:15px;z-index:3000;animation:slideInRight 0.3s ease-out;box-shadow:0 8px 25px rgba(0,0,0,0.15);}
    .toast.success{background:linear-gradient(135deg,#a8e6cf,#81c784);color:white;}
    .toast.error{background:linear-gradient(135deg,#ffb7b2,#ff8a80);color:white;}
    @keyframes slideInRight{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo"><i class="fas fa-hotel"></i><span>酒店管理</span></div>
        <ul class="sidebar-menu">
            <li><a href="index.html"><i class="fas fa-chart-pie"></i> 仪表盘</a></li>
            <li><a href="analytics.html"><i class="fas fa-chart-line"></i> 数据分析</a></li>
            <li><a href="hotel-info.html"><i class="fas fa-building"></i> 酒店信息</a></li>
            <li><a href="room-types.html"><i class="fas fa-bed"></i> 房型管理</a></li>
            <li><a href="room-sales.html"><i class="fas fa-chart-bar"></i> 房型销售</a></li>
            <li><a href="orders.html"><i class="fas fa-receipt"></i> 订单管理</a></li>
            <li><a href="reviews.html"><i class="fas fa-star"></i> 评价管理</a></li>
            <li><a href="notifications.html" class="active"><i class="fas fa-bell"></i> 消息通知</a></li>
            <li><a href="checkin.html"><i class="fas fa-clipboard-check"></i> 入住管理</a></li>
            <li><a href="facilities.html"><i class="fas fa-concierge-bell"></i> 设施管理</a></li>
        </ul>
        <div class="sidebar-footer"><a href="#" onclick="Auth.logout()"><i class="fas fa-sign-out-alt"></i> 退出登录</a></div>
    </aside>
    <main class="main-content">
        <div class="page-header"><h1>消息通知</h1></div>
        <div class="content-card">
            <h3><i class="fas fa-bell"></i> 通知列表</h3>
            <div class="notification-list" id="notificationList"></div>
        </div>
    </main>
    <script src="../js/auth.js"></script>
    <script>
        async function init() {
            const authResult = await Auth.checkAuthStatus();
            if (!authResult.loggedIn) { Auth.redirectToLogin('admin/notifications.html'); return; }
            const userRole = authResult.user.role;
            if (userRole !== 'hotel_admin' && userRole !== 'super_admin') { 
                alert('无权限访问，当前角色: ' + userRole); 
                window.location.href='../index.html'; 
                return; 
            }
            await loadNotifications();
        }
        async function loadNotifications() {
            try {
                const res = await Auth.fetchWithAuth('/api/admin/notifications');
                const data = await res.json();
                const container = document.getElementById('notificationList');
                container.innerHTML = '';
                if (data.success && data.data && data.data.length > 0) {
                    data.data.forEach(notification => {
                        container.innerHTML += renderNotificationItem(notification);
                    });
                } else {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-bell-slash"></i><p>暂无通知</p></div>';
                }
            } catch(e) { console.error('加载通知失败:',e); }
        }
        function renderNotificationItem(notification) {
            const iconClass = notification.type || 'system';
            const iconMap = {
                'order': 'fa-receipt',
                'review': 'fa-star',
                'system': 'fa-cog',
                'price_change': 'fa-tag'
            };
            const icon = iconMap[iconClass] || 'fa-bell';
            const unreadClass = notification.is_read ? '' : 'unread';
            const dotHtml = notification.is_read ? '' : '<div class="notification-dot"></div>';
            return '<div class="notification-item ' + unreadClass + '" onclick="markRead(' + notification.notification_id + ')"><div class="notification-icon ' + iconClass + '"><i class="fas ' + icon + '"></i></div><div class="notification-content"><div class="notification-title">' + notification.title + '</div><div class="notification-text">' + notification.content + '</div><div class="notification-time">' + formatDate(notification.created_at) + '</div></div>' + dotHtml + '</div>';
        }
        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return d.toLocaleString('zh-CN');
        }
        async function markRead(notificationId) {
            try {
                const res = await Auth.fetchWithAuth('/api/admin/notifications/' + notificationId + '/read', {
                    method: 'PUT'
                });
                const data = await res.json();
                if (data.success) {
                    loadNotifications();
                }
            } catch(e) { console.error('标记已读失败:',e); }
        }
        init();
    </script>
</body>
</html>
