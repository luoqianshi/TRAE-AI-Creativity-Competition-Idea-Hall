<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酒店详情 - 酒店预订管理系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-cream: #fefdf7;
            --bg-peach: #fff8f3;
            --bg-mint: #f0fffa;
            --bg-lavender: #f5f3ff;
            --card-white: #ffffff;
            --border-soft: #f0e6d8;
            --primary-sunshine: #ffb347;
            --primary-coral: #ff9966;
            --secondary-lavender: #b39ddb;
            --secondary-sky: #81d4fa;
            --accent-pink: #ffb7b2;
            --accent-mint: #a8e6cf;
            --accent-lemon: #fff4a3;
            --text-warm: #5d4037;
            --text-medium: #8d6e63;
            --text-light: #bdbdbd;
            --shadow-soft: 0 8px 24px rgba(255, 179, 71, 0.06);
            --shadow-float: 0 12px 32px rgba(255, 179, 71, 0.12);
            --star-yellow: #ffd700;
            --radius-soft: 24px;
            --radius-round: 32px;
            --radius-pill: 40px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', 'Noto Sans SC', sans-serif;
            background: linear-gradient(180deg, var(--bg-cream) 0%, var(--bg-peach) 100%);
            color: var(--text-warm);
            min-height: 100vh;
        }
        
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 179, 71, 0.15);
            padding: 16px 0;
            box-shadow: 0 2px 20px rgba(255, 179, 71, 0.08);
        }
        .header-content { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; }
        .logo {
            font-family: 'Fredoka', sans-serif;
            font-size: 30px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-sunshine) 0%, var(--primary-coral) 50%, var(--accent-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -1px;
        }
        .logo i { 
            color: var(--primary-sunshine); 
            font-size: 32px;
            filter: drop-shadow(0 3px 6px rgba(255, 179, 71, 0.35));
        }
        nav { display: flex; gap: 35px; }
        nav a {
            color: var(--text-medium);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            padding: 8px 0;
            font-family: 'Nunito', sans-serif;
        }
        nav a:hover { 
            color: var(--primary-sunshine); 
            transform: translateY(-2px);
        }
        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-sunshine), var(--accent-pink));
            border-radius: 2px;
            transition: width 0.3s;
        }
        nav a:hover::after { width: 80%; }
        nav a.active { 
            color: var(--primary-sunshine); 
            font-weight: 700;
        }
        nav a.active::after { width: 100%; }

        .container { max-width: 1200px; margin: 0 auto; padding: 40px 24px; }

        .hotel-header { display: flex; gap: 30px; margin-bottom: 40px; }
        .hotel-main-image-wrap { 
            width: 60%; 
            position: relative;
        }
        .hotel-main-image { 
            width: 100%; 
            height: 450px; 
            background-size: cover; 
            background-position: center; 
            border-radius: var(--radius-round);
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
            position: relative;
            overflow: hidden;
        }
        .hotel-main-image::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(to top, rgba(0,0,0,0.2), transparent);
        }
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-warm);
            font-size: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 5;
        }
        .carousel-btn:hover {
            background: white;
            transform: translateY(-50%) scale(1.15);
            box-shadow: 0 10px 30px rgba(255, 179, 71, 0.4);
            color: var(--primary-sunshine);
        }
        .carousel-btn.prev { left: 20px; }
        .carousel-btn.next { right: 20px; }
        .carousel-indicators {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 5;
        }
        .carousel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .carousel-dot.active {
            background: white;
            width: 24px;
            border-radius: 4px;
        }
        .image-counter {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            z-index: 5;
            backdrop-filter: blur(8px);
        }
        .hotel-thumbs {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            overflow-x: auto;
            padding-bottom: 8px;
        }
        .hotel-thumb {
            flex-shrink: 0;
            width: 90px;
            height: 65px;
            background-size: cover;
            background-position: center;
            border-radius: 12px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.3s;
            opacity: 0.7;
        }
        .hotel-thumb.active {
            border-color: var(--primary-sunshine);
            opacity: 1;
            transform: scale(1.05);
        }
        .hotel-thumb:hover { opacity: 1; }
        @media (max-width: 768px) {
            .hotel-main-image-wrap { width: 100%; }
            .hotel-main-image { height: 300px; }
        }
        .hotel-summary { 
            width: 40%; 
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        .hotel-title { 
            font-family: 'Fredoka', sans-serif;
            font-size: 32px; 
            font-weight: 800; 
            margin-bottom: 15px;
            background: linear-gradient(135deg, var(--text-warm), var(--text-medium));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hotel-location { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            color: var(--text-medium); 
            margin-bottom: 20px;
            font-size: 15px;
        }
        .hotel-location i { color: var(--primary-coral); }
        .hotel-rating { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .rating-star { color: var(--star-yellow); font-size: 24px; }
        .rating-num { font-size: 32px; font-weight: 800; color: var(--text-warm); }
        .rating-count { color: var(--text-light); font-size: 14px; }
        .hotel-price { 
            font-family: 'Fredoka', sans-serif;
            font-size: 40px; 
            color: var(--primary-sunshine); 
            font-weight: 800; 
            margin-bottom: 30px;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .hotel-price span { font-size: 16px; color: var(--text-light); font-weight: 500; }
        .book-btn { 
            background: linear-gradient(135deg, var(--primary-sunshine) 0%, var(--primary-coral) 100%);
            color: white; 
            border: none; 
            padding: 18px 40px; 
            border-radius: var(--radius-round); 
            font-size: 18px; 
            font-weight: 700; 
            cursor: pointer; 
            width: 100%; 
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 25px rgba(255, 179, 71, 0.4);
            font-family: 'Fredoka', sans-serif;
            letter-spacing: 1px;
        }
        .book-btn:hover { 
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 14px 35px rgba(255, 179, 71, 0.5);
        }

        .info-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 40px; }
        .info-card { 
            background: var(--card-white); 
            padding: 24px; 
            border-radius: var(--radius-soft); 
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-soft);
            transition: all 0.3s;
        }
        .info-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-float);
        }
        .info-card h3 { 
            margin-bottom: 12px; 
            font-size: 17px;
            font-weight: 700;
            color: var(--text-warm);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .info-card h3 i { color: var(--primary-coral); }
        .info-card p { color: var(--text-medium); font-size: 14px; line-height: 1.8; }

        .rooms-section { margin-bottom: 40px; }
        .section-title { 
            font-family: 'Fredoka', sans-serif;
            font-size: 26px; 
            font-weight: 700; 
            margin-bottom: 25px;
            color: var(--text-warm);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title i { color: var(--primary-sunshine); }
        .room-card { 
            background: var(--card-white); 
            border-radius: var(--radius-round); 
            padding: 24px; 
            box-shadow: var(--shadow-soft);
            margin-bottom: 20px; 
            display: flex; 
            gap: 24px;
            border: 1px solid var(--border-soft);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .room-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-float);
            border-color: rgba(255, 179, 71, 0.2);
        }
        .room-image { 
            width: 220px; 
            height: 160px; 
            background-size: cover; 
            background-position: center; 
            border-radius: var(--radius-soft);
            flex-shrink: 0;
        }
        .room-info { flex: 1; }
        .room-name { 
            font-family: 'Fredoka', sans-serif;
            font-size: 20px; 
            font-weight: 700; 
            margin-bottom: 8px; 
            color: var(--text-warm);
        }
        .room-desc { color: var(--text-medium); font-size: 14px; margin-bottom: 12px; }
        .room-features { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
        .feature-tag { 
            background: var(--bg-peach); 
            padding: 8px 14px; 
            border-radius: var(--radius-pill); 
            font-size: 13px; 
            color: var(--text-medium);
            font-weight: 600;
            border: 1px solid var(--border-soft);
        }
        .room-price-row { display: flex; justify-content: space-between; align-items: center; }
        .room-price { 
            font-family: 'Fredoka', sans-serif;
            font-size: 28px; 
            color: var(--primary-sunshine); 
            font-weight: 800; 
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .room-price span { font-size: 14px; color: var(--text-light); font-weight: 500; }
        .room-book-btn { 
            background: linear-gradient(135deg, var(--primary-sunshine), var(--primary-coral));
            color: white; 
            border: none; 
            padding: 12px 30px; 
            border-radius: var(--radius-soft); 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 15px rgba(255, 179, 71, 0.3);
            font-family: 'Nunito', sans-serif;
        }
        .room-book-btn:hover { 
            transform: translateY(-3px);
            box-shadow: 0 8px 22px rgba(255, 179, 71, 0.45);
        }
        /* 房间可用性状态样式 */
        .room-avail-normal { font-size: 12px; color: #22c55e; margin-left: 8px; font-weight: 500; }
        .room-avail-warning { font-size: 12px; color: #ef4444; margin-left: 8px; font-weight: 600; animation: pulse 1.5s infinite; }
        .room-avail-soldout { font-size: 12px; color: #9ca3af; margin-left: 8px; font-weight: 500; }
        .room-unavailable { opacity: 0.7; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .facilities-section { margin-bottom: 40px; }
        .facilities-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
        }
        .facility-item {
            background: var(--card-white);
            padding: 20px 16px;
            border-radius: var(--radius-soft);
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-soft);
            text-align: center;
            transition: all 0.3s;
        }
        .facility-item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-float);
            border-color: var(--primary-sunshine);
        }
        .facility-item img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            background: var(--bg-peach);
        }
        .facility-item i {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-sunshine), var(--primary-coral));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            margin: 0 auto 10px;
        }
        .facility-item .facility-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-warm);
        }
        .facility-category-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-warm);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .facility-category-title::before {
            content: '';
            width: 4px;
            height: 16px;
            background: linear-gradient(180deg, var(--primary-sunshine), var(--primary-coral));
            border-radius: 2px;
        }
        .facility-group {
            margin-bottom: 24px;
        }

        .reviews-section { margin-bottom: 40px; }
        .review-card {
            background: var(--card-white);
            padding: 24px;
            border-radius: var(--radius-soft);
            box-shadow: var(--shadow-soft);
            margin-bottom: 16px;
            border: 1px solid var(--border-soft);
        }
        .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .review-author { font-weight: 600; color: var(--text-warm); }
        .review-date { font-size: 13px; color: var(--text-light); }
        .review-rating { color: var(--star-yellow); margin-bottom: 10px; }
        .review-comment { color: var(--text-medium); font-size: 14px; line-height: 1.7; }

        .decoration-cloud {
            position: fixed;
            top: 120px;
            left: -100px;
            width: 200px;
            height: 80px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            z-index: -1;
            filter: blur(20px);
            animation: floatCloud 20s ease-in-out infinite;
        }
        .decoration-cloud:nth-child(2) {
            top: 400px;
            right: -80px;
            width: 150px;
            height: 60px;
            animation-delay: -10s;
        }
        @keyframes floatCloud {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(50px); }
        }

        @media (max-width: 768px) {
            .hotel-header { flex-direction: column; }
            .hotel-main-image { width: 100%; height: 300px; }
            .hotel-summary { width: 100%; }
            .hotel-title { font-size: 26px; }
            .info-section { grid-template-columns: 1fr; }
            .room-card { flex-direction: column; }
            .room-image { width: 100%; }
            .nav { gap: 20px; }
        }
    </style>
</head>
<body>
    <div class="decoration-cloud"></div>
    <div class="decoration-cloud"></div>

    <header>
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-hotel"></i>
                <span>酒店预订</span>
            </div>
            <nav>
                <a href="index.html">首页</a>
                <a href="search.html">酒店搜索</a>
                <a href="login.html">登录</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="hotel-header" id="hotelHeader">
            <div class="hotel-main-image-wrap">
                <div class="hotel-main-image" id="hotelImage"></div>
                <button class="carousel-btn prev" id="carouselPrev" style="display:none;"><i class="fas fa-chevron-left"></i></button>
                <button class="carousel-btn next" id="carouselNext" style="display:none;"><i class="fas fa-chevron-right"></i></button>
                <div class="carousel-indicators" id="carouselIndicators"></div>
                <div class="image-counter" id="imageCounter" style="display:none;"></div>
                <div class="hotel-thumbs" id="hotelThumbs"></div>
            </div>
            <div class="hotel-summary">
                <div class="hotel-title" id="hotelName"></div>
                <div class="hotel-location">
                    <i class="fas fa-map-marker-alt"></i>
                    <span id="hotelAddress"></span>
                </div>
                <div class="hotel-rating">
                    <div class="rating-star">
                        <i class="fas fa-star"></i>
                    </div>
                    <span class="rating-num" id="hotelRating"></span>
                    <span class="rating-count" id="hotelReviewCount"></span>
                </div>
                <div class="hotel-price">
                    <span>¥</span><span id="hotelPrice"></span>
                    <span>起/晚</span>
                </div>
                <button class="book-btn" id="bookBtn">立即预订</button>
            </div>
        </div>

        <div class="info-section">
            <div class="info-card">
                <h3><i class="fas fa-info-circle"></i> 酒店简介</h3>
                <p id="hotelDescription"></p>
            </div>
            <div class="info-card">
                <h3><i class="fas fa-clock"></i> 入住政策</h3>
                <p id="hotelPolicies"></p>
            </div>
        </div>

        <div class="facilities-section">
            <div class="section-title"><i class="fas fa-concierge-bell"></i> 酒店设施</div>
            <div id="facilitiesList"></div>
        </div>

        <div class="rooms-section">
            <div class="section-title"><i class="fas fa-bed"></i> 房型选择</div>
            <div id="roomsList"></div>
        </div>

        <div class="reviews-section">
            <div class="section-title"><i class="fas fa-star"></i> 用户评价</div>
            <div id="reviewsList"></div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        const hotelId = new URLSearchParams(window.location.search).get('id');
        const checkIn = new URLSearchParams(window.location.search).get('checkIn');
        const checkOut = new URLSearchParams(window.location.search).get('checkOut');

        let hotelImages = [];
        let currentImageIndex = 0;
        let carouselTimer = null;
        let roomsData = [];

        Auth.updateHeaderNav();

        function renderCarousel() {
            const img = hotelImages[currentImageIndex];
            document.getElementById('hotelImage').style.backgroundImage = `url('${img}')`;

            const total = hotelImages.length;
            document.getElementById('imageCounter').textContent = `${currentImageIndex + 1} / ${total}`;
            document.getElementById('imageCounter').style.display = total > 1 ? 'block' : 'none';
            document.getElementById('carouselPrev').style.display = total > 1 ? 'flex' : 'none';
            document.getElementById('carouselNext').style.display = total > 1 ? 'flex' : 'none';

            const indicatorsHtml = hotelImages.map((_, idx) => 
                `<div class="carousel-dot ${idx === currentImageIndex ? 'active' : ''}" data-index="${idx}"></div>`
            ).join('');
            document.getElementById('carouselIndicators').innerHTML = indicatorsHtml;
            document.querySelectorAll('.carousel-dot').forEach(dot => {
                dot.addEventListener('click', (e) => {
                    e.stopPropagation();
                    currentImageIndex = parseInt(e.target.dataset.index);
                    renderCarousel();
                    resetCarouselTimer();
                });
            });

            const thumbsHtml = hotelImages.map((img, idx) => 
                `<div class="hotel-thumb ${idx === currentImageIndex ? 'active' : ''}" 
                      data-index="${idx}" 
                      style="background-image: url('${img}')"></div>`
            ).join('');
            document.getElementById('hotelThumbs').innerHTML = thumbsHtml;
            document.querySelectorAll('.hotel-thumb').forEach(thumb => {
                thumb.addEventListener('click', (e) => {
                    e.stopPropagation();
                    currentImageIndex = parseInt(e.target.dataset.index);
                    renderCarousel();
                    resetCarouselTimer();
                });
            });
        }

        function nextImage() {
            currentImageIndex = (currentImageIndex + 1) % hotelImages.length;
            renderCarousel();
        }

        function prevImage() {
            currentImageIndex = (currentImageIndex - 1 + hotelImages.length) % hotelImages.length;
            renderCarousel();
        }

        function resetCarouselTimer() {
            if (carouselTimer) clearInterval(carouselTimer);
            if (hotelImages.length > 1) {
                carouselTimer = setInterval(nextImage, 5000);
            }
        }

        async function loadHotelDetail() {
            if (!hotelId) return;
            try {
                let apiUrl = `/api/hotels/${hotelId}`;
                if (checkIn && checkOut) {
                    apiUrl += `?checkIn=${checkIn}&checkOut=${checkOut}`;
                }
                const res = await fetch(apiUrl);
                const data = await res.json();
                const hotel = data.data;

                document.getElementById('hotelName').textContent = hotel.name;
                document.getElementById('hotelAddress').textContent = hotel.city + (hotel.district || hotel.districtName || '') + ' · ' + hotel.address;
                document.getElementById('hotelRating').textContent = hotel.avg_rating || hotel.avgRating || '0.0';
                document.getElementById('hotelReviewCount').textContent = (hotel.review_count || hotel.reviewCount || 0) + '条评价';
                
                // 价格显示：优先使用min_price，否则使用minPrice，默认0
                const minPrice = hotel.min_price || hotel.minPrice || 0;
                document.getElementById('hotelPrice').textContent = minPrice;
                
                document.getElementById('hotelDescription').textContent = hotel.description || '暂无描述';
                document.getElementById('hotelPolicies').textContent = hotel.policies || '暂无政策信息';

                const images = (hotel.images || []).map(img => img.image_url || img.imageUrl).filter(Boolean);
                if (images.length === 0) {
                    images.push(`https://picsum.photos/seed/hotel${hotelId}/800/500`);
                }
                hotelImages = images;
                currentImageIndex = 0;
                renderCarousel();
                resetCarouselTimer();

                // 优先使用 roomAvailabilities（带可用性信息），否则使用 rooms
                const roomsData = hotel.room_availabilities || hotel.roomAvailabilities || hotel.rooms || [];
                const hasAvailability = !!(hotel.room_availabilities || hotel.roomAvailabilities);
                renderRooms(roomsData, hasAvailability);

                document.getElementById('carouselPrev').addEventListener('click', (e) => {
                    e.stopPropagation();
                    prevImage();
                    resetCarouselTimer();
                });
                document.getElementById('carouselNext').addEventListener('click', (e) => {
                    e.stopPropagation();
                    nextImage();
                    resetCarouselTimer();
                });

                document.getElementById('bookBtn').addEventListener('click', () => {
                    if (roomsData.length > 0) {
                        Auth.requireLogin(() => {
                            const roomId = roomsData[0].room_id || roomsData[0].roomId;
                            location.href = `booking.html?hotelId=${hotelId}&roomId=${roomId}&checkIn=${checkIn}&checkOut=${checkOut}`;
                        });
                    } else {
                        alert('暂无可预订房型，请稍后再试');
                    }
                });

                loadFacilities();
            } catch (e) { console.error(e); }
        }

        async function loadFacilities() {
            if (!hotelId) return;
            try {
                const res = await fetch(`/api/admin/hotels/${hotelId}/facilities`);
                const data = await res.json();
                if (data.success && data.data && data.data.length > 0) {
                    const availableFacilities = data.data.filter(f => f.is_available);
                    if (availableFacilities.length > 0) {
                        const grouped = availableFacilities.reduce((acc, f) => {
                            const category = f.category || '其他设施';
                            if (!acc[category]) acc[category] = [];
                            acc[category].push(f);
                            return acc;
                        }, {});
                        
                        let html = '';
                        for (const [category, facilities] of Object.entries(grouped)) {
                            html += `<div class="facility-group">
                                <div class="facility-category-title">${category}</div>
                                <div class="facilities-container">`;
                            facilities.forEach(f => {
                                const iconHtml = f.image_url ? 
                                    `<img src="${f.image_url}" alt="${f.name}">` : 
                                    `<i class="fas ${f.icon || 'fa-check'}"></i>`;
                                html += `<div class="facility-item">${iconHtml}<div class="facility-name">${f.name}</div></div>`;
                            });
                            html += '</div></div>';
                        }
                        document.getElementById('facilitiesList').innerHTML = html;
                    } else {
                        document.getElementById('facilitiesList').innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-light);"><i class="fas fa-concierge-bell" style="font-size:48px;margin-bottom:15px;opacity:0.4;"></i><br><p>暂无设施</p></div>';
                    }
                } else {
                    document.getElementById('facilitiesList').innerHTML = '';
                }
            } catch (e) { 
                console.error('加载设施失败:', e); 
                document.getElementById('facilitiesList').innerHTML = '';
            }
        }

        function renderRooms(rooms, hasAvailability) {
            const container = document.getElementById('roomsList');
            if (rooms.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-light);"><i class="fas fa-bed" style="font-size:48px;margin-bottom:15px;opacity:0.4;"></i><br><p>暂无房型</p></div>';
                return;
            }
            container.innerHTML = rooms.map(room => {
                const roomId = room.room_id || room.roomId;
                const isAvailable = hasAvailability ? (room.is_available || room.isAvailable || false) : true;
                const availableRooms = room.available_rooms || room.availableRooms || 0;
                const totalRooms = room.total_rooms || room.totalRooms || 0;
                const basePrice = room.base_price || room.basePrice || 0;
                const maxGuests = room.max_guests || room.maxGuests || 0;
                const bedType = room.bed_type || room.bedType || '';
                const areaSqm = room.area_sqm || room.areaSqm || 0;
                const primaryImage = room.primary_image || room.image_url || room.imageUrl || '';

                let availabilityHtml = '';
                if (hasAvailability) {
                    if (isAvailable) {
                        if (availableRooms <= 3 && availableRooms > 0) {
                            availabilityHtml = `<span class="room-avail-warning">仅剩${availableRooms}间</span>`;
                        } else if (availableRooms > 3) {
                            availabilityHtml = `<span class="room-avail-normal">剩余${availableRooms}间</span>`;
                        }
                    } else {
                        availabilityHtml = `<span class="room-avail-soldout">已满房</span>`;
                    }
                }

                return `
                <div class="room-card ${!isAvailable ? 'room-unavailable' : ''}">
                    <div class="room-image" style="background-image: url('${primaryImage || 'https://picsum.photos/seed/room' + roomId + '/400/300'}')"></div>
                    <div class="room-info">
                        <div class="room-name">${room.name || ''}</div>
                        <div class="room-desc">${room.description || '暂无描述'}</div>
                        <div class="room-features">
                            <span class="feature-tag">${maxGuests}人入住</span>
                            <span class="feature-tag">${bedType}</span>
                            <span class="feature-tag">${areaSqm}㎡</span>
                        </div>
                        <div class="room-price-row">
                            <div>
                                <span class="room-price">¥${basePrice} <span>/晚</span></span>
                                ${availabilityHtml}
                            </div>
                            <button class="room-book-btn" onclick="handleRoomBook(${roomId})" ${!isAvailable ? 'disabled style="background:#ccc;cursor:not-allowed;"' : ''}>
                                ${isAvailable ? '选择此房型' : '已满房'}
                            </button>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        function handleRoomBook(roomId) {
            Auth.requireLogin(() => {
                location.href = `booking.html?hotelId=${hotelId}&roomId=${roomId}&checkIn=${checkIn}&checkOut=${checkOut}`;
            });
        }

        function renderReviews(reviews) {
            const container = document.getElementById('reviewsList');
            if (reviews.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-light);"><i class="fas fa-star" style="font-size:48px;margin-bottom:15px;opacity:0.4;"></i><br><p>暂无评价</p></div>';
                return;
            }
            container.innerHTML = reviews.map(review => `
                <div class="review-card">
                    <div class="review-header">
                        <span class="review-author">${review.user_name || '匿名用户'}</span>
                        <span class="review-date">${review.created_at ? review.created_at.split('T')[0] : ''}</span>
                    </div>
                    <div class="review-rating">
                        ${Array(5).fill(0).map((_, i) => 
                            `<i class="fas fa-star ${i < review.rating ? '' : 'opacity-30'}" style="${i < review.rating ? 'color:var(--star-yellow)' : 'color:#ddd'}"></i>`
                        ).join('')}
                    </div>
                    <div class="review-comment">${review.comment || '暂无评价内容'}</div>
                </div>
            `).join('');
        }

        loadHotelDetail();
    </script>
</body>
</html>
