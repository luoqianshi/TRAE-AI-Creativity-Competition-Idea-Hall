// ===================== WEATHER =====================
function initWeather() {
  const cityEl = document.getElementById('weather-city');
  const tempEl = document.getElementById('weather-temp');
  const descEl = document.getElementById('weather-desc');
  const iconEl = document.getElementById('weather-icon');

  if (!navigator.geolocation) {
    cityEl.textContent = '北京';
    tempEl.textContent = '26°C';
    descEl.textContent = '多云';
    iconEl.textContent = '⛅';
    return;
  }
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      try {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
        const data = await res.json();
        const w = data.current_weather;
        const code = w.weathercode;
        let icon = '🌤', desc = '晴';
        if (code >= 51) { icon = '🌧'; desc = '雨'; }
        else if (code >= 3) { icon = '☁'; desc = '多云'; }
        else if (code >= 1) { icon = '⛅'; desc = '阴'; }
        else { icon = '☀'; desc = '晴'; }
        // Reverse geocoding via nominatim
        const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10`, { headers: { 'User-Agent': 'TiangongApp/1.0' } });
        const geo = await geoRes.json();
        const cityName = geo.address?.city || geo.address?.town || geo.address?.county || '当地';
        cityEl.textContent = cityName;
        tempEl.textContent = Math.round(w.temperature) + '°C';
        descEl.textContent = desc;
        iconEl.textContent = icon;
      } catch (e) {
        cityEl.textContent = '北京';
        tempEl.textContent = '26°C';
        descEl.textContent = '多云';
        iconEl.textContent = '⛅';
      }
    },
    () => {
      cityEl.textContent = '北京';
      tempEl.textContent = '26°C';
      descEl.textContent = '多云';
      iconEl.textContent = '⛅';
    },
    { timeout: 8000 }
  );
}

// ===================== MAP =====================
function initMap() {
  document.querySelectorAll('.province-path').forEach(path => {
    path.addEventListener('click', function() {
      document.querySelectorAll('.province-path').forEach(p => p.classList.remove('active'));
      this.classList.add('active');
      const prov = this.getAttribute('data-prov');
      showProvinceHeritage(prov);
    });
  });
}
function showProvinceHeritage(prov) {
  const listEl = document.getElementById('map-heritage-list');
  const titleEl = document.getElementById('map-province-title');
  const itemsEl = document.getElementById('map-province-items');
  const items = provinceHeritage[prov] || [];
  titleEl.textContent = prov + ' · 非遗项目';

  // Build weather card HTML
  let weatherHtml = '';
  const coords = provinceCoords[prov];
  if (coords) {
    weatherHtml = `<div class="map-weather" id="map-weather-card">
      <span class="map-weather-icon">🌤</span>
      <div class="map-weather-info">
        <div class="map-weather-city">${coords.city}天气</div>
        <div class="map-weather-detail" id="map-weather-detail">正在获取...</div>
      </div>
      <span class="map-weather-temp" id="map-weather-temp">--°</span>
    </div>`;
    // Fetch weather async
    fetchMapWeather(coords.lat, coords.lon);
  }

  if (items.length === 0) {
    itemsEl.innerHTML = '<div class="list-item">暂无数据</div>';
  } else {
    itemsEl.innerHTML = items.map(i => `
      <div class="list-item">
        <div>${i.name}</div>
        <div class="loc">📍 ${i.loc}</div>
      </div>
    `).join('');
  }
  listEl.style.display = 'block';
  // Insert weather card at the top
  const titleNode = listEl.querySelector('.list-title');
  if (weatherHtml && titleNode) {
    const weatherDiv = document.createElement('div');
    weatherDiv.innerHTML = weatherHtml;
    titleNode.after(weatherDiv.firstElementChild);
  }
}

async function fetchMapWeather(lat, lon) {
  try {
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
    const data = await res.json();
    const w = data.current_weather;
    const code = w.weathercode;
    let icon = '🌤', desc = '晴';
    if (code >= 51) { icon = '🌧'; desc = '雨'; }
    else if (code >= 3) { icon = '☁'; desc = '多云'; }
    else if (code >= 1) { icon = '⛅'; desc = '阴'; }
    else { icon = '☀'; desc = '晴'; }
    const iconEl = document.querySelector('.map-weather-icon');
    const detailEl = document.getElementById('map-weather-detail');
    const tempEl = document.getElementById('map-weather-temp');
    if (iconEl) iconEl.textContent = icon;
    if (detailEl) detailEl.textContent = desc;
    if (tempEl) tempEl.textContent = Math.round(w.temperature) + '°';
  } catch(e) {}
}

async function fetchTravelWeather() {
  const cards = document.querySelectorAll('.travel-guide-weather');
  for (const card of cards) {
    const lat = card.getAttribute('data-lat');
    const lon = card.getAttribute('data-lon');
    const city = card.getAttribute('data-city');
    try {
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
      const data = await res.json();
      const w = data.current_weather;
      const code = w.weathercode;
      let icon = '🌤', desc = '晴';
      if (code >= 51) { icon = '🌧'; desc = '雨'; }
      else if (code >= 3) { icon = '☁'; desc = '多云'; }
      else if (code >= 1) { icon = '⛅'; desc = '阴'; }
      else { icon = '☀'; desc = '晴'; }
      card.innerHTML = `<span class="travel-guide-weather-icon">${icon}</span><span>${city} · ${desc}</span><span class="travel-guide-weather-temp">${Math.round(w.temperature)}°C</span>`;
    } catch(e) {
      card.innerHTML = `<span class="travel-guide-weather-icon">🌤</span><span>${city} · 天气暂不可用</span>`;
    }
  }
}

// ===================== AI CHAT =====================
let currentMaster = null;
function renderChatSelect() {
  const grid = document.getElementById('master-grid');
  grid.innerHTML = masters.map(m => `
    <div class="master-card" onclick="startChat('${m.id}')">
      <div class="master-avatar">${m.avatar}</div>
      <div class="master-name">${m.name}</div>
      <div class="master-craft">${m.craft}匠人</div>
    </div>
  `).join('');
  document.getElementById('chat-select').style.display = 'block';
  document.getElementById('chat-room').style.display = 'none';
}
function startChat(masterId) {
  currentMaster = masters.find(m => m.id === masterId);
  if (!currentMaster) return;
  document.getElementById('chat-select').style.display = 'none';
  document.getElementById('chat-room').style.display = 'flex';
  document.getElementById('chat-avatar').textContent = currentMaster.avatar;
  document.getElementById('chat-master-name').textContent = currentMaster.name;
  const msgs = document.getElementById('chat-messages');
  msgs.innerHTML = '';
  addMasterMsg("你好啊，年轻人。我是" + currentMaster.name + "，做" + currentMaster.craft + "的。有什么想了解的，尽管问。");
}
function exitChat() {
  document.getElementById('chat-select').style.display = 'block';
  document.getElementById('chat-room').style.display = 'none';
  currentMaster = null;
}
function stopChat() {
  currentMaster = null;
}
function addMasterMsg(text) {
  if (!currentMaster) return;
  const msgs = document.getElementById('chat-messages');
  const action = currentMaster.actions[Math.floor(Math.random() * currentMaster.actions.length)];
  const div = document.createElement('div');
  div.className = 'msg msg-master';
  div.innerHTML = `<div class="msg-action">${action}：</div><div class="msg-bubble">${text}</div><div class="msg-time">${nowTime()}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}
function addUserMsg(text) {
  const msgs = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg msg-user';
  div.innerHTML = `<div class="msg-bubble">${text}</div><div class="msg-time">${nowTime()}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}
function nowTime() {
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
function sendMsg() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || !currentMaster) return;
  addUserMsg(text);
  input.value = '';
  setTimeout(() => replyMaster(text), 600);
}
function replyMaster(userText) {
  if (!currentMaster) return;
  const replies = masterReplies[currentMaster.id];
  if (!replies) {
    addMasterMsg("这个我还真不太懂，咱聊聊" + currentMaster.craft + "的事吧。");
    return;
  }
  let pool = replies.default;
  const lower = userText.toLowerCase();
  if (lower.includes('技艺') || lower.includes('怎么做') || lower.includes('工序') || lower.includes('流程')) pool = replies.技艺 || replies.default;
  else if (lower.includes('日常') || lower.includes('生活') || lower.includes('日子') || lower.includes('每天')) pool = replies.日常 || replies.default;
  else if (lower.includes('传承') || lower.includes('徒弟') || lower.includes('学') || lower.includes('教') || lower.includes('初心')) pool = replies.传承 || replies.default;
  const reply = pool[Math.floor(Math.random() * pool.length)];
  addMasterMsg(reply);
}

// ===================== AUDIO =====================
let audioCtx = null;
let musicOsc = null;
let musicGain = null;
let musicInterval = null;
let isMusicOn = false;

function initAudio() {
  // User interaction required to start audio context
}

function toggleMusic() {
  const btn = document.getElementById('audio-btn');
  if (!isMusicOn) {
    startMusic();
    btn.classList.remove('off');
    btn.textContent = '🎵';
    isMusicOn = true;
  } else {
    stopMusic();
    btn.classList.add('off');
    btn.textContent = '🔇';
    isMusicOn = false;
  }
}

function startMusic() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (musicInterval) return;

  const pentatonic = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25]; // C D E G A C
  let noteIdx = 0;

  function playNote() {
    if (!isMusicOn) return;
    const freq = pentatonic[Math.floor(Math.random() * pentatonic.length)];
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 2);
  }

  playNote();
  musicInterval = setInterval(playNote, 2500);
}

function stopMusic() {
  if (musicInterval) {
    clearInterval(musicInterval);
    musicInterval = null;
  }
}
