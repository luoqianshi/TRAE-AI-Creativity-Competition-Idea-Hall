<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>销售碎碎念 · 每一笔都是努力的痕迹</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6fa;
    min-height: 100vh;
    color: #333;
    padding-bottom: 80px;
    transition: background 0.3s, color 0.3s;
  }
  body.dark {
    background: #1a1a2e;
    color: #e8e8f0;
  }

  /* ============ 顶部标题栏 ============ */
  .app-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    padding: 20px 16px 18px;
    text-align: center;
    box-shadow: 0 4px 16px rgba(102, 126, 234, 0.35);
    position: sticky;
    top: 0;
    z-index: 100;
    overflow: hidden;
    position: relative;
  }
  body.dark .app-header {
    background: linear-gradient(135deg, #4a5fc1 0%, #5a3a7e 100%);
  }
  .app-header::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(255,255,255,0.15), transparent);
    border-radius: 50%;
  }
  .app-header h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: 2px;
    position: relative;
    z-index: 1;
  }
  .app-header p {
    font-size: 12px;
    opacity: 0.9;
    position: relative;
    z-index: 1;
    font-style: italic;
  }
  .dark-toggle {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(255,255,255,0.2);
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    color: #fff;
    backdrop-filter: blur(10px);
    z-index: 2;
  }

  /* ============ 标签切换 ============ */
  .tab-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #fff;
    display: flex;
    box-shadow: 0 -2px 16px rgba(0, 0, 0, 0.08);
    z-index: 100;
    border-top: 1px solid #f0f0f0;
  }
  body.dark .tab-bar {
    background: #252542;
    border-top-color: #3a3a5c;
  }
  .tab-btn {
    flex: 1;
    padding: 10px 8px;
    text-align: center;
    background: none;
    border: none;
    font-size: 12px;
    color: #999;
    cursor: pointer;
    transition: color 0.2s;
    position: relative;
  }
  .tab-btn .tab-icon {
    display: block;
    font-size: 20px;
    margin-bottom: 2px;
    transition: transform 0.3s;
  }
  .tab-btn.active {
    color: #667eea;
    font-weight: 600;
  }
  .tab-btn.active .tab-icon {
    transform: scale(1.2);
  }
  body.dark .tab-btn {
    color: #888;
  }
  body.dark .tab-btn.active {
    color: #a5b4e8;
  }
  .tab-btn.active::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 3px;
    background: linear-gradient(90deg, #667eea, #764ba2);
    border-radius: 0 0 3px 3px;
  }

  /* ============ 页面容器 ============ */
  .page {
    display: none;
    padding: 16px;
    animation: fadeIn 0.3s ease;
  }
  .page.active {
    display: block;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ============ 输入页 ============ */
  .card {
    background: #fff;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
  }
  body.dark .card {
    background: #2d2d4a;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
  }

  .input-section {
    margin-bottom: 16px;
  }
  .input-section:last-child { margin-bottom: 0; }

  .input-label {
    font-size: 13px;
    color: #666;
    margin-bottom: 8px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  body.dark .input-label { color: #b8b8d0; }
  .input-label .label-icon { font-size: 16px; }

  .date-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .input-field, .input-textarea, .input-gift, .input-select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #e8e8f0;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    background: #fafbff;
    transition: all 0.2s;
    outline: none;
    color: #333;
  }
  body.dark .input-field,
  body.dark .input-textarea,
  body.dark .input-gift,
  body.dark .input-select {
    background: #35355c;
    border-color: #4a4a6e;
    color: #e8e8f0;
  }
  .input-field:focus, .input-textarea:focus, .input-gift:focus, .input-select:focus {
    border-color: #667eea;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
  }
  body.dark .input-field:focus,
  body.dark .input-textarea:focus,
  body.dark .input-gift:focus,
  body.dark .input-select:focus {
    background: #3a3a5c;
    box-shadow: 0 0 0 3px rgba(165, 180, 232, 0.2);
  }

  /* 类别标签选择 */
  .category-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
  }
  .category-chip {
    padding: 8px 14px;
    background: #f5f6fa;
    border: 1.5px solid #e8e8f0;
    border-radius: 20px;
    font-size: 12px;
    color: #666;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
  }
  body.dark .category-chip {
    background: #35355c;
    border-color: #4a4a6e;
    color: #b8b8d0;
  }
  .category-chip.active {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
    transform: scale(1.05);
  }
  .category-chip.add-new {
    border-style: dashed;
    color: #667eea;
  }
  body.dark .category-chip.add-new {
    color: #a5b4e8;
    border-color: #a5b4e8;
  }

  /* 常用赠品标签 */
  .common-gift-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 6px;
  }
  .common-gift-chip {
    padding: 8px 14px;
    background: #fff;
    border: 1.5px solid #e8e8f0;
    border-radius: 20px;
    font-size: 13px;
    color: #555;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  body.dark .common-gift-chip {
    background: #35355c;
    border-color: #4a4a6e;
    color: #c8c8e0;
  }
  .common-gift-chip:active {
    transform: scale(0.95);
  }
  .common-gift-chip.checked {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
  }
  .common-gift-chip.checked::before {
    content: '✓';
    font-weight: bold;
  }

  /* 赠品列表 */
  .gift-list { margin-bottom: 10px; }
  .gift-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    animation: slideIn 0.2s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .gift-item .input-gift { flex: 1; }
  .btn-delete-gift {
    width: 36px;
    height: 36px;
    border: none;
    background: #fef0f0;
    color: #f56c6c;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  body.dark .btn-delete-gift {
    background: #4a2d3a;
    color: #ff8a9c;
  }
  .btn-delete-gift:active { transform: scale(0.9); }

  .btn-add-gift, .btn-primary-action {
    width: 100%;
    padding: 12px;
    border: 1.5px dashed #c9d0f0;
    background: #f8f9ff;
    color: #667eea;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 8px;
    font-weight: 500;
    transition: all 0.2s;
  }
  body.dark .btn-add-gift {
    background: #35355c;
    border-color: #5a5a8e;
    color: #a5b4e8;
  }
  .btn-add-gift:active { transform: scale(0.98); }

  .btn-primary-action {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    border: none;
    border-style: solid;
    font-size: 15px;
    font-weight: 600;
    padding: 14px;
    box-shadow: 0 4px 14px rgba(102, 126, 234, 0.35);
    margin-bottom: 0;
  }
  .btn-primary-action:active {
    transform: scale(0.98);
    box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
  }

  /* 快速填充 */
  .quick-fill {
    margin-top: 12px;
    text-align: center;
  }
  .quick-fill-btn {
    background: none;
    border: none;
    color: #667eea;
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
  }
  body.dark .quick-fill-btn { color: #a5b4e8; }

  /* 批量输入区 */
  .batch-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .batch-title {
    font-size: 15px;
    font-weight: 600;
    color: #333;
  }
  body.dark .batch-title { color: #e8e8f0; }
  .batch-toggle {
    font-size: 13px;
    color: #667eea;
    background: none;
    border: none;
    cursor: pointer;
  }
  body.dark .batch-toggle { color: #a5b4e8; }
  .batch-hint {
    background: #f8f9ff;
    border-left: 3px solid #667eea;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 12px;
    color: #666;
    line-height: 1.8;
    margin-bottom: 12px;
  }
  body.dark .batch-hint {
    background: #35355c;
    color: #b8b8d0;
  }
  .batch-textarea {
    width: 100%;
    min-height: 140px;
    padding: 12px 14px;
    border: 1.5px solid #e8e8f0;
    border-radius: 10px;
    font-size: 13px;
    font-family: inherit;
    background: #fafbff;
    outline: none;
    resize: vertical;
    line-height: 1.8;
    color: #333;
  }
  body.dark .batch-textarea {
    background: #35355c;
    border-color: #4a4a6e;
    color: #e8e8f0;
  }
  .batch-textarea:focus { border-color: #667eea; background: #fff; }
  body.dark .batch-textarea:focus { background: #3a3a5c; }

  /* ============ 查看页 ============ */
  .stats-card {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 18px;
    padding: 18px;
    color: #fff;
    margin-bottom: 14px;
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
    position: relative;
    overflow: hidden;
  }
  .stats-card::before {
    content: '';
    position: absolute;
    top: -30%;
    right: -10%;
    width: 150px;
    height: 150px;
    background: radial-gradient(circle, rgba(255,255,255,0.15), transparent);
    border-radius: 50%;
  }
  .stats-title {
    font-size: 12px;
    opacity: 0.9;
    margin-bottom: 14px;
    font-weight: 500;
    letter-spacing: 1px;
  }
  .stats-row {
    display: flex;
    justify-content: space-around;
    position: relative;
    z-index: 1;
  }
  .stat-item {
    text-align: center;
    flex: 1;
  }
  .stat-value {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 2px;
    letter-spacing: -0.5px;
  }
  .stat-label {
    font-size: 11px;
    opacity: 0.85;
  }
  .stat-divider {
    width: 1px;
    background: rgba(255, 255, 255, 0.25);
    margin: 4px 0;
  }

  /* 迷你图表 */
  .mini-chart {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.15);
    position: relative;
    z-index: 1;
  }
  .chart-title {
    font-size: 11px;
    opacity: 0.8;
    margin-bottom: 8px;
  }
  .chart-bars {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 50px;
  }
  .chart-bar {
    flex: 1;
    background: rgba(255,255,255,0.3);
    border-radius: 4px 4px 0 0;
    min-height: 4px;
    transition: all 0.5s;
    position: relative;
    animation: grow 0.6s ease;
  }
  @keyframes grow {
    from { height: 0; }
  }
  .chart-bar-label {
    text-align: center;
    font-size: 9px;
    opacity: 0.7;
    margin-top: 4px;
  }

  /* 分类统计卡片 */
  .category-stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 14px;
  }
  .cat-stat {
    background: #fff;
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    transition: transform 0.2s;
  }
  body.dark .cat-stat { background: #2d2d4a; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .cat-stat:active { transform: scale(0.97); }
  .cat-stat-icon {
    font-size: 22px;
    margin-bottom: 6px;
  }
  .cat-stat-name {
    font-size: 12px;
    color: #999;
    margin-bottom: 4px;
  }
  body.dark .cat-stat-name { color: #888; }
  .cat-stat-value {
    font-size: 18px;
    font-weight: 700;
    color: #667eea;
  }

  /* 操作栏 */
  .action-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .action-btn {
    flex: 1;
    padding: 10px 8px;
    background: #fff;
    border: 1.5px solid #e8e8f0;
    border-radius: 10px;
    font-size: 12px;
    color: #666;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-weight: 500;
  }
  body.dark .action-btn {
    background: #2d2d4a;
    border-color: #4a4a6e;
    color: #b8b8d0;
  }
  .action-btn:active { background: #f0f0f5; transform: scale(0.97); }
  body.dark .action-btn:active { background: #3a3a5c; }
  .action-btn.danger { color: #f56c6c; }
  body.dark .action-btn.danger { color: #ff8a9c; }
  .action-btn.primary { color: #667eea; border-color: #c9d0f0; }
  body.dark .action-btn.primary { color: #a5b4e8; }

  /* 搜索框 */
  .search-box {
    background: #fff;
    border-radius: 14px;
    padding: 8px 14px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  body.dark .search-box {
    background: #2d2d4a;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
  }
  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    padding: 8px 0;
    font-size: 14px;
    background: transparent;
    color: #333;
  }
  body.dark .search-box input { color: #e8e8f0; }
  .search-icon { font-size: 16px; opacity: 0.5; }

  /* 月份筛选 */
  .month-filter {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .month-filter::-webkit-scrollbar { display: none; }
  .month-chip {
    padding: 7px 14px;
    background: #fff;
    border: 1.5px solid #e8e8f0;
    border-radius: 20px;
    font-size: 12px;
    color: #666;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: all 0.2s;
    font-weight: 500;
  }
  body.dark .month-chip {
    background: #2d2d4a;
    border-color: #4a4a6e;
    color: #b8b8d0;
  }
  .month-chip.active {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
  }

  /* 记录卡片 */
  .record-card {
    background: #fff;
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    position: relative;
    border-left: 4px solid #667eea;
    animation: slideIn 0.3s ease;
  }
  body.dark .record-card {
    background: #2d2d4a;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
  }
  .record-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .record-date-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .record-date {
    font-size: 13px;
    color: #667eea;
    font-weight: 600;
    background: #f0f2ff;
    padding: 4px 10px;
    border-radius: 6px;
  }
  body.dark .record-date { background: #3a3a5c; color: #a5b4e8; }
  .record-category {
    font-size: 11px;
    padding: 3px 8px;
    background: #fef3e6;
    color: #e8891a;
    border-radius: 6px;
    font-weight: 500;
  }
  .record-delete {
    background: none;
    border: none;
    color: #f56c6c;
    font-size: 13px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.2s;
  }
  .record-delete:active { background: #fef0f0; }
  body.dark .record-delete:active { background: #4a2d3a; }
  .record-product {
    font-size: 16px;
    font-weight: 700;
    color: #333;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }
  body.dark .record-product { color: #e8e8f0; }
  .record-price {
    font-size: 18px;
    color: #f56c6c;
    font-weight: 700;
    margin-bottom: 12px;
    letter-spacing: 0.5px;
  }
  body.dark .record-price { color: #ff8a9c; }
  .record-price::before { content: '¥'; font-size: 14px; margin-right: 2px; }
  .record-gifts {
    background: #f8f9ff;
    border-radius: 10px;
    padding: 10px 12px;
  }
  body.dark .record-gifts { background: #35355c; }
  .gifts-label {
    font-size: 11px;
    color: #999;
    margin-bottom: 6px;
    font-weight: 500;
  }
  body.dark .gifts-label { color: #888; }
  .gifts-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .gift-tag {
    background: #fff;
    border: 1px solid #e8e8f0;
    padding: 5px 10px;
    border-radius: 7px;
    font-size: 12px;
    color: #666;
  }
  body.dark .gift-tag {
    background: #3a3a5c;
    border-color: #4a4a6e;
    color: #b8b8d0;
  }
  .gift-tag::before { content: '🎁 '; }

  /* 空状态 */
  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: #999;
  }
  body.dark .empty-state { color: #777; }
  .empty-icon {
    font-size: 60px;
    margin-bottom: 16px;
    opacity: 0.6;
  }
  .empty-title {
    font-size: 15px;
    margin-bottom: 8px;
    color: #666;
    font-weight: 600;
  }
  body.dark .empty-title { color: #b8b8d0; }
  .empty-desc {
    font-size: 12px;
    color: #aaa;
    line-height: 1.6;
  }

  /* Toast消息 */
  .toast {
    position: fixed;
    top: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(0, 0, 0, 0.85);
    color: #fff;
    padding: 12px 24px;
    border-radius: 24px;
    font-size: 14px;
    z-index: 999;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    white-space: nowrap;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast.success { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }

    <span class="tab-icon">📋</span>
    看记录
  </button>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  // ======== 数据存储 ========
  const STORAGE_KEY = 'sales_records_data_v3';
  let records = [];
  let categories = ['科大讯飞学习机', '学而思学习机', '耳机'];
  let currentCategory = '科大讯飞学习机';
  let currentMonth = 'all';
  let darkMode = false;

  // 每个类别对应的常用赠品（可自定义）
  let commonGifts = {
    '科大讯飞学习机': ['1个手机包', '1个蓝牙鼠键', '1个词典笔', '1个文具袋', '1个小风扇', '1年延保'],
    '学而思学习机': ['1个手机包', '1个蓝牙鼠键', '1个词典笔', '1个文具袋', '1个小风扇', '1年延保'],
    '耳机': ['1个收纳包', '1对耳帽', '1根充电线', '1年延保']
  };

  // 初始化
  function init() {
    // 加载记录
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try { records = JSON.parse(saved); } catch(e) { records = []; }
    }

    // 加载类别
    const savedCats = localStorage.getItem(STORAGE_KEY + '_cats');
    if (savedCats) {
      try { categories = JSON.parse(savedCats); } catch(e) {}
    }

    // 加载常用赠品
    const savedGifts = localStorage.getItem(STORAGE_KEY + '_gifts');
    if (savedGifts) {
      try { commonGifts = JSON.parse(savedGifts); } catch(e) {}
    }

    // 加载深色模式
    darkMode = localStorage.getItem(STORAGE_KEY + '_dark') === '1';
    if (darkMode) {
      document.body.classList.add('dark');
      document.getElementById('darkBtn').textContent = '☀️';
    }

    fillToday();
    addGiftInput();
    renderCategories();
    renderCommonGifts();
    renderRecords();
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  }
  function saveCategories() {
    localStorage.setItem(STORAGE_KEY + '_cats', JSON.stringify(categories));
  }

  // ============ 深色模式 ============
  function toggleDarkMode() {
    darkMode = !darkMode;
    if (darkMode) {
      document.body.classList.add('dark');
      document.getElementById('darkBtn').textContent = '☀️';
    } else {
      document.body.classList.remove('dark');
      document.getElementById('darkBtn').textContent = '🌙';
    }
    localStorage.setItem(STORAGE_KEY + '_dark', darkMode ? '1' : '0');
  }

  // ============ Toast ============
  function showToast(msg, type) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast show ' + (type || '');
    setTimeout(() => { toast.className = 'toast'; }, 2200);
  }

  // ============ 切换标签页 ============
  function switchTab(tab) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

    if (tab === 'input') {
      document.getElementById('pageInput').classList.add('active');
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('pageSubtitle').textContent = '每一笔销售，都是努力的痕迹';
    } else {
      document.getElementById('pageView').classList.add('active');
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('pageSubtitle').textContent = '看看你都付出了多少努力';
      renderRecords();
    }
  }

  // ============ 填充今天日期 ============
  function fillToday() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    document.getElementById('inputDate').value = `${y}.${m}.${day}`;
  }

  // ============ 类别标签渲染 ============
  function renderCategories() {
    const container = document.getElementById('categoryChips');
    let html = '';
    categories.forEach(cat => {
      html += `<span class="category-chip ${cat === currentCategory ? 'active' : ''}" onclick="selectCategory('${cat.replace(/'/g, "\\'")}')">${cat}</span>`;
    });
    html += `<span class="category-chip add-new" onclick="addCategory()">+ 新增</span>`;
    container.innerHTML = html;
  }

  function selectCategory(cat) {
    currentCategory = cat;
    renderCategories();
    renderCommonGifts();
  }

  // 渲染常用赠品（按类别显示）
  function renderCommonGifts() {
    const container = document.getElementById('commonGiftChips');
    if (!container) return;
    const gifts = commonGifts[currentCategory] || [];
    container.innerHTML = gifts.map(g => 
      `<span class="common-gift-chip" onclick="toggleCommonGift('${g.replace(/'/g, "\\'")}')">${g}</span>`
    ).join('');
  }

  // 勾选常用赠品
  function toggleCommonGift(gift) {
    const list = document.getElementById('giftList');
    // 检查是否已勾选了这个赠品
    const existingInputs = list.querySelectorAll('.input-gift');
    let found = false;
    existingInputs.forEach(inp => {
      if (inp.value.trim() === gift) {
        // 如果已存在，删除它（取消勾选）
        inp.parentElement.remove();
        found = true;
      }
    });
    if (!found) {
      // 添加新赠品
      const div = document.createElement('div');
      div.className = 'gift-item';
      div.innerHTML = `
        <input type="text" class="input-gift" value="${gift}">
        <button class="btn-delete-gift" onclick="this.parentElement.remove()">✕</button>
      `;
      list.appendChild(div);
    }
    // 更新标签样式
    renderCommonGifts();
    // 给已勾选的标签加上 checked 样式
    const currentInputs = [];
    document.querySelectorAll('.input-gift').forEach(i => {
      if (i.value.trim()) currentInputs.push(i.value.trim());
    });
    document.querySelectorAll('.common-gift-chip').forEach(chip => {
      const giftText = chip.textContent.trim().replace(/^✓\s*/, '');
      if (currentInputs.includes(giftText)) {
        chip.classList.add('checked');
      }
    });
  }

  // 新增常用赠品
  function addCustomCommonGift() {
    const newGift = prompt('请输入要添加的常用赠品：');
    if (newGift && newGift.trim()) {
      const trimmed = newGift.trim();
      if (!commonGifts[currentCategory]) commonGifts[currentCategory] = [];
      if (!commonGifts[currentCategory].includes(trimmed)) {
        commonGifts[currentCategory].push(trimmed);
        localStorage.setItem(STORAGE_KEY + '_gifts', JSON.stringify(commonGifts));
        renderCommonGifts();
        showToast('✓ 已添加常用赠品', 'success');
      } else {
        showToast('这个赠品已经有啦', 'error');
      }
    }
  }

  function addCategory() {
    const newCat = prompt('请输入新的产品类别：');
    if (newCat && newCat.trim()) {
      const trimmed = newCat.trim();
      if (!categories.includes(trimmed)) {
        categories.push(trimmed);
        currentCategory = trimmed;
        saveCategories();
        renderCategories();
        showToast('✓ 已添加类别', 'success');
      } else {
        currentCategory = trimmed;
        renderCategories();
      }
    }
  }

  // ============ 添加赠品输入框 ============
  function addGiftInput() {
    const list = document.getElementById('giftList');
    const div = document.createElement('div');
    div.className = 'gift-item';
    div.innerHTML = `
      <input type="text" class="input-gift" placeholder="如：1个手机包">
      <button class="btn-delete-gift" onclick="this.parentElement.remove()">✕</button>
    `;
    list.appendChild(div);
  }

  // ============ 切换批量模式 ============
  function toggleBatch() {
    const batch = document.getElementById('batchCard');
    if (batch.style.display === 'none') {
      batch.style.display = 'block';
    } else {
      batch.style.display = 'none';
    }
  }

  // ============ 保存单条记录 ============
  function saveRecord() {
    const date = document.getElementById('inputDate').value.trim();
    const product = document.getElementById('inputProduct').value.trim();
    const price = document.getElementById('inputPrice').value.trim();
    const giftInputs = document.querySelectorAll('.input-gift');
    const gifts = [];
    giftInputs.forEach(g => {
      const val = g.value.trim();
      if (val) gifts.push(val);
    });

    if (!product) {
      showToast('请填写产品名称', 'error');
      return;
    }
    if (!date) {
      showToast('请填写日期', 'error');
      return;
    }

    const record = {
      id: Date.now() + Math.random(),
      date: formatDate(date),
      category: currentCategory,
      product: product,
      price: price || '',
      gifts: gifts
    };

    records.unshift(record);
    save();

    // 清空输入（保留日期和类别）
    document.getElementById('inputProduct').value = '';
    document.getElementById('inputPrice').value = '';
    document.getElementById('giftList').innerHTML = '';
    addGiftInput();
    renderCommonGifts(); // 重置常用赠品勾选状态

    showToast('✨ 已记录！继续加油', 'success');
  }

  // ============ 格式化日期 ============
  function formatDate(dateStr) {
    if (/^\d{4}[.\-\/]\d{1,2}[.\-\/]\d{1,2}/.test(dateStr)) {
      const parts = dateStr.split(/[.\-\/]/);
      return `${parts[0]}.${parts[1].padStart(2, '0')}.${parts[2].padStart(2, '0')}`;
    }
    if (/^\d{1,2}[.\-\/]\d{1,2}/.test(dateStr)) {
      const parts = dateStr.split(/[.\-\/]/);
      const y = new Date().getFullYear();
      return `${y}.${parts[0].padStart(2, '0')}.${parts[1].padStart(2, '0')}`;
    }
    return dateStr;
  }

  // ============ 解析产品和价格 ============
  function parseProductAndPrice(line) {
    if (!line) return { product: '', price: '' };
    const text = line.trim();
    let price = '';
    let product = text;

    const parenPrice = text.match(/[（(](?:[^）)]*?)(\d+(?:\.\d+)?)[^）)]*[）)]/);
    if (parenPrice) price = parenPrice[1];

    if (!price) {
      const pm = text.match(/价格[：:]*\s*[¥￥]?(\d+(?:\.\d+)?)/);
      if (pm) price = pm[1];
    }

    if (!price) {
      const nm = text.match(/[¥￥](\d+(?:\.\d+)?)/);
      if (nm) price = nm[1];
    }

    if (!price) {
      const em = text.match(/(\d+(?:\.\d+)?)\s*[元块]?$/);
      if (em) price = em[1];
    }

    product = text
      .replace(/[（(][^）)]*[）)]/g, '')
      .replace(/价格[：:]*\s*[¥￥]?\d+(?:\.\d+)?/g, '')
      .replace(/[¥￥]\d+(?:\.\d+)?/g, '')
      .replace(/\d+(?:\.\d+)?\s*[元块]/g, '')
      .replace(/销售/g, '')
      .trim();

    if (!product) product = text;
    return { product, price };
  }

  // ============ 批量解析 ============
  function parseBatch() {
    const text = document.getElementById('batchText').value.trim();
    if (!text) { showToast('请输入内容', 'error'); return; }

    const blocks = text.split(/\n\s*\n/);
    let added = 0;

    for (const block of blocks) {
      const lines = block.trim().split('\n').map(l => l.trim()).filter(l => l);
      if (lines.length === 0) continue;

      let date = '';
      let product = '';
      let price = '';
      let gifts = [];
      let idx = 0;

      if (/^\d+[.\-\/]\d+/.test(lines[0]) || /^\d{4}[.\-\/]\d+/.test(lines[0])) {
        date = formatDate(lines[0]);
        idx = 1;
      }

      // 找产品和价格行
      for (; idx < lines.length; idx++) {
        const line = lines[idx];
        const isGiftLine = /赠品\s*[：:]/.test(line) ||
                           /^[\d一二三四五六七八九十]/.test(line) ||
                           /^[-•*]/.test(line) ||
                           (line.includes('个') && line.length < 20);

        if (!isGiftLine && (line.includes('销售') || /[（(]/.test(line) || !line.includes('：'))) {
          const pp = parseProductAndPrice(line);
          product = pp.product;
          price = pp.price;
          idx++;
          break;
        }
        if (idx === 1) {
          const pp = parseProductAndPrice(line);
          product = pp.product;
          price = pp.price;
          idx++;
          break;
        }
      }

      if (!date) {
        const d = new Date();
        date = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
      }

      for (; idx < lines.length; idx++) {
        let gift = lines[idx].trim();
        if (/赠品\s*[：:]/.test(gift) && gift.length < 15) continue;
        gift = gift
          .replace(/^赠品\s*[：:]\s*/, '')
          .replace(/^[\d一二三四五六七八九十]+[.、\s)]*/, '')
          .replace(/^[-•*]\s*/, '')
          .trim();
        if (gift) gifts.push(gift);
      }

      if (product || gifts.length > 0) {
        records.unshift({
          id: Date.now() + Math.random() + added,
          date,
          category: currentCategory,
          product, price, gifts
        });
        added++;
      }
    }

    if (added > 0) {
      save();
      document.getElementById('batchText').value = '';
      showToast(`✨ 已添加 ${added} 条记录`, 'success');
    } else {
      showToast('未能识别记录，请检查格式', 'error');
    }
  }

  // ============ 填入示例 ============
  function fillExample() {
    document.getElementById('batchText').value =
`6.18
销售t4(国补后5466)
赠品：
1个手机包
1个蓝牙鼠键
1个词典笔

1个小风扇
1年延保

6.19
销售t5 Pro(国补后6999)
赠品：

1个蓝牙键盘
1个充电宝
2年延保

销售iPad Air5(教育优惠4799)
赠品：

1支手写笔
1年碎屏险`;
  }

  // ============ 渲染记录 ============
  function renderRecords() {
    // 基础统计
    document.getElementById('totalCount').textContent = records.length;
    let total = 0;
    let totalGifts = 0;
    records.forEach(r => {
      if (r.price) total += parseFloat(r.price) || 0;
      totalGifts += r.gifts.length;
    });
    document.getElementById('totalAmount').textContent = total.toLocaleString();
    document.getElementById('totalGifts').textContent = totalGifts;

    // 生成迷你图表（近7天）
    renderMiniChart();

    // 类别统计
    renderCategoryStats();

    // 月份筛选
    renderMonthFilter();

    // 搜索关键词
    const keyword = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();

    // 筛选记录
    let filtered = records;
    if (currentMonth !== 'all') {
      filtered = filtered.filter(r => r.date.startsWith(currentMonth));
    }
    if (keyword) {
      filtered = filtered.filter(r =>
        (r.product || '').toLowerCase().includes(keyword) ||
        (r.gifts || []).some(g => g.toLowerCase().includes(keyword)) ||
        (r.category || '').toLowerCase().includes(keyword)
      );
    }

    // 渲染列表
    const list = document.getElementById('recordsList');
    if (filtered.length === 0) {
      const hasData = records.length > 0;
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">${hasData ? '🔍' : '📭'}</div>
          <div class="empty-title">${hasData ? '没有匹配的记录' : '还没有销售记录'}</div>
          <div class="empty-desc">${hasData ? '试试换个关键词或月份' : '去"记一笔"添加第一条记录吧～<br>每一笔都是努力的痕迹 ✨'}</div>
        </div>`;
      return;
    }

    list.innerHTML = filtered.map(r => `
      <div class="record-card">
        <div class="record-header">
          <div class="record-date-wrap">
            <span class="record-date">${r.date}</span>
            ${r.category ? `<span class="record-category" style="background:${getCategoryColor(r.category)}bg; color:${getCategoryColor(r.category)}text;">${r.category}</span>` : ''}
          </div>
          <button class="record-delete" onclick="deleteRecord(${r.id})">删除</button>
        </div>
        <div class="record-product">${escapeHtml(r.product)}</div>
        ${r.price ? `<div class="record-price">${escapeHtml(r.price)}</div>` : ''}
        ${r.gifts && r.gifts.length > 0 ? `
          <div class="record-gifts">
            <div class="gifts-label">🎁 赠品清单 · ${r.gifts.length}件</div>
            <div class="gifts-tags">
              ${r.gifts.map(g => `<span class="gift-tag">${escapeHtml(g)}</span>`).join('')}
            </div>
          </div>
        ` : ''}
      </div>
    `).join('');
  }

  // 类别颜色
  function getCategoryColor(cat) {
    const colors = [
      { bg: '#fef3e6', text: '#e8891a' },  // 橙色
      { bg: '#e6f7ee', text: '#2eb88a' },  // 绿色
      { bg: '#eef0ff', text: '#667eea' },  // 紫色
      { bg: '#fde8ef', text: '#e85a8c' },  // 粉色
      { bg: '#e6f7f7', text: '#19c0b7' },  // 青色
      { bg: '#fff4e6', text: '#e8a85a' },  // 金色
    ];
    let hash = 0;
    for (let i = 0; i < cat.length; i++) hash += cat.charCodeAt(i);
    const c = colors[hash % colors.length];
    return { bg: c.bg, text: c.text };
  }

  // 迷你图表
  function renderMiniChart() {
    const bars = document.getElementById('chartBars');
    if (records.length === 0) {
      document.getElementById('miniChart').style.display = 'none';
      return;
    }
    document.getElementById('miniChart').style.display = 'block';

    // 取最近7天
    const daily = {};
    const today = new Date();
    for (let i = 6; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(today.getDate() - i);
      const key = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
      daily[key] = 0;
    }
    records.forEach(r => {
      if (daily[r.date] !== undefined && r.price) {
        daily[r.date] += parseFloat(r.price) || 0;
      }
    });

    const values = Object.values(daily);
    const max = Math.max(...values, 1);

    let html = '';
    const dates = Object.keys(daily);
    const labels = [];
    for (let i = 0; i < dates.length; i++) {
      const parts = dates[i].split('.');
      labels.push(`${parseInt(parts[1])}/${parseInt(parts[2])}`);
    }

    for (let i = 0; i < values.length; i++) {
      const height = Math.max((values[i] / max) * 100, 4);
      html += `<div style="flex:1; display:flex; flex-direction:column; align-items:center;">
        <div class="chart-bar" style="height:${height}%"></div>
        <div class="chart-bar-label">${labels[i]}</div>
      </div>`;
    }
    bars.innerHTML = html;
  }

  // 类别统计卡片
  function renderCategoryStats() {
    const container = document.getElementById('categoryStats');
    if (records.length === 0) {
      container.style.display = 'none';
      return;
    }
    container.style.display = 'grid';

    const catData = {};
    records.forEach(r => {
      const cat = r.category || '未分类';
      if (!catData[cat]) catData[cat] = { count: 0, amount: 0 };
      catData[cat].count++;
      if (r.price) catData[cat].amount += parseFloat(r.price) || 0;
    });

    const icons = ['📚', '🎧', '📦', '💡'];
    const sorted = Object.keys(catData).sort((a, b) => catData[b].amount - catData[a].amount);
    const icons2 = { '科大讯飞学习机': '🤖', '学而思学习机': '📚', '耳机': '🎧', '学习机': '📚', '手机': '📱', '平板': '📟', '笔记本': '💻' };

    let html = '';
    sorted.slice(0, 4).forEach((cat, idx) => {
      const data = catData[cat];
      const icon = icons2[cat] || icons[idx % icons.length];
      html += `
        <div class="cat-stat">
          <div class="cat-stat-icon">${icon}</div>
          <div class="cat-stat-name">${escapeHtml(cat)}</div>
          <div class="cat-stat-value">¥${data.amount.toLocaleString()}</div>
          <div style="font-size:11px; color:#999; margin-top:4px;">${data.count} 笔成交</div>
        </div>
      `;
    });
    container.innerHTML = html;
  }

  // 月份筛选
  function renderMonthFilter() {
    const months = new Set();
    records.forEach(r => {
      const parts = r.date.split('.');
      if (parts.length >= 2) {
        months.add(`${parts[0]}.${parts[1]}`);
      }
    });

    const sorted = Array.from(months).sort().reverse();
    const filter = document.getElementById('monthFilter');
    let html = `<button class="month-chip ${currentMonth === 'all' ? 'active' : ''}" onclick="setMonth('all')">全部 · ${records.length}</button>`;
    sorted.forEach(m => {
      const [y, mo] = m.split('.');
      const monthCount = records.filter(r => r.date.startsWith(m)).length;
      html += `<button class="month-chip ${currentMonth === m ? 'active' : ''}" onclick="setMonth('${m}')">${parseInt(mo)}月 · ${monthCount}</button>`;
    });
    filter.innerHTML = html;
  }

  function setMonth(m) {
    currentMonth = m;
    renderRecords();
  }

  // 删除记录
  function deleteRecord(id) {
    if (!confirm('确定删除这条记录吗？')) return;
    records = records.filter(r => r.id !== id);
    save();
    renderRecords();
    showToast('已删除', 'success');
  }

  // 清空所有
  function clearAll() {
    if (records.length === 0) { showToast('没有记录', 'error'); return; }
    if (!confirm(`确定清空全部 ${records.length} 条记录吗？\n此操作不可恢复！`)) return;
    records = [];
    save();
    renderRecords();
    showToast('🗑 已清空所有记录', 'success');
  }

  // 导出CSV
  function exportCSV() {
    if (records.length === 0) { showToast('没有记录可导出', 'error'); return; }
    const header = '日期,类别,产品,价格,赠品\n';
    const rows = records.map(r => {
      const date = `"${r.date}"`;
      const cat = `"${(r.category || '').replace(/"/g, '""')}"`;
      const product = `"${(r.product || '').replace(/"/g, '""')}"`;
      const price = `"${r.price || ''}"`;
      const gifts = `"${(r.gifts || []).join('；').replace(/"/g, '""')}"`;
      return `${date},${cat},${product},${price},${gifts}`;
    }).join('\n');

    const csv = '\uFEFF' + header + rows;
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `销售记录_${new Date().toLocaleDateString('zh-CN').replace(/\//g, '-')}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('📥 CSV已导出', 'success');
  }

  // 导出JSON备份
  function exportJSON() {
    if (records.length === 0) { showToast('没有记录可导出', 'error'); return; }
    const data = {
      version: 'v3',
      exportTime: new Date().toISOString(),
      categories: categories,
      records: records
    };
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `销售记录备份_${new Date().toLocaleDateString('zh-CN').replace(/\//g, '-')}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('💾 备份已导出', 'success');
  }

  function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  init();
</script>

</body>
</html>
