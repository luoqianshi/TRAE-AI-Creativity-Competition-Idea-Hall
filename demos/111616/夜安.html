<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>夜安 checklist</title>
    <style>
        :root {
            --bg-primary: #f9f7f3;
            --bg-card: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --accent: #4a6fa5;
            --accent-light: #6b8cbf;
            --border: #e0d9cf;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s ease;
            --radius: 12px;
        }

        .dark-theme {
            --bg-primary: #1a1f2d;
            --bg-card: #252d40;
            --text-primary: #f0f0f0;
            --text-secondary: #a9b7c6;
            --accent: #7aa2e3;
            --accent-light: #89b3f0;
            --border: #3a445a;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 16px;
            transition: var(--transition);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 24px 0;
            margin-bottom: 24px;
        }

        h1 {
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: var(--accent);
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
            max-width: 500px;
            margin: 0 auto;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            font-size: 0.9rem;
        }

        .time-display {
            font-weight: 500;
            color: var(--accent);
        }

        .progress {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-text {
            font-weight: 500;
        }

        .progress-bar {
            width: 80px;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.4s ease;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        label {
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        select, button {
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
        }

        select:focus, button:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(74, 111, 165, 0.2);
        }

        select:hover, button:hover {
            border-color: var(--accent);
        }

        .checklist {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .item {
            display: flex;
            align-items: flex-start;
            padding: 16px;
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .item:hover {
            transform: translateY(-2px);
        }

        .checkbox {
            margin-top: 4px;
            margin-right: 12px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .item-text {
            flex: 1;
            font-size: 1rem;
            padding-top: 2px;
        }

        .item-actions {
            display: flex;
            gap: 8px;
        }

        .btn-speak {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(74, 111, 165, 0.1);
            border-radius: 50%;
            border: none;
            color: var(--accent);
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-speak:hover {
            background: rgba(74, 111, 165, 0.2);
        }

        .btn-speak:active {
            transform: scale(0.95);
        }

        .all-done {
            display: block;
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 16px;
            transition: var(--transition);
        }

        .all-done:hover {
            background: var(--accent-light);
            transform: translateY(-1px);
        }

        .theme-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            background: var(--bg-card);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            transform: scale(1.05);
        }

        .moon, .sun {
            font-size: 20px;
            transition: var(--transition);
        }

        .dark-theme .sun {
            display: none;
        }

        .dark-theme .moon {
            display: inline;
        }

        .light-theme .moon {
            display: none;
        }

        .light-theme .sun {
            display: inline;
        }

        footer {
            text-align: center;
            padding: 24px 0;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 32px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            h1 {
                font-size: 1.5rem;
            }
            .status-bar {
                flex-direction: column;
                gap: 12px;
                text-align: left;
            }
            .controls {
                flex-direction: column;
            }
            .item {
                padding: 14px;
            }
        }

        /* Animation */
        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        .completed {
            animation: pulse 1.2s infinite;
            background-color: rgba(107, 140, 191, 0.08);
        }

        .completed .item-text {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .completed .checkbox {
            accent-color: var(--accent);
        }
    </style>
</head>
<body class="light-theme">
    <div class="container">
        <header>
            <h1>夜安 checklist</h1>
            <p class="subtitle">睡前30秒，安心入眠 —— 专为独居青年定制的安全自查</p>
        </header>

        <div class="status-bar">
            <div class="time-display" id="current-time">晚上 10:23</div>
            <div class="progress">
                <span class="progress-text">已完成 <span id="done-count">0</span>/5</span>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>
        </div>

        <div class="controls">
            <label for="housing-type">我的居住类型：</label>
            <select id="housing-type">
                <option value="rental">出租屋（老小区/无智能设备）</option>
                <option value="studio">一室一厅（带厨房卫生间）</option>
                <option value="balcony">有阳台（需额外防坠检查）</option>
            </select>
        </div>

        <div class="checklist" id="checklist">
            <!-- Items will be generated by JS -->
        </div>

        <button class="all-done" id="mark-all-done">✅ 全部确认完成</button>

        <footer>
            <p>轻量、无需安装 · 每次刷新自动更新今日项</p>
        </footer>
    </div>

    <button class="theme-toggle" id="theme-toggle">
        <span class="moon">🌙</span>
        <span class="sun">☀️</span>
    </button>

    <script>
        // 初始化时间
        function updateTime() {
            const now = new Date();
            const hours = now.getHours();
            let period = '早上';
            let displayHour = hours % 12 || 12;
            if (hours >= 12 && hours < 18) period = '下午';
            if (hours >= 18 || hours < 6) period = '晚上';
            document.getElementById('current-time').textContent = `${period} ${displayHour}:${String(now.getMinutes()).padStart(2, '0')}`;
        }
        updateTime();
        setInterval(updateTime, 60000);

        // 主题切换
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;
        const savedTheme = localStorage.getItem('nightAnTheme') || 'light';
        if (savedTheme === 'dark') {
            body.classList.add('dark-theme');
            body.classList.remove('light-theme');
        } else {
            body.classList.add('light-theme');
            body.classList.remove('dark-theme');
        }
        themeToggle.addEventListener('click', () => {
            if (body.classList.contains('light-theme')) {
                body.classList.remove('light-theme');
                body.classList.add('dark-theme');
                localStorage.setItem('nightAnTheme', 'dark');
            } else {
                body.classList.remove('dark-theme');
                body.classList.add('light-theme');
                localStorage.setItem('nightAnTheme', 'light');
            }
        });

        // 检查项数据（按户型）
        const checklistData = {
            rental: [
                "检查大门是否反锁（老式防盗门需按两下）",
                "确认厨房燃气阀门已关闭",
                "拔掉床头手机充电器",
                "检查阳台推拉窗是否上锁",
                "确认卫生间排气扇已停转"
            ],
            studio: [
                "检查入户门猫眼是否清晰、门链是否挂好",
                "确认灶台旁无易燃物，打火器已收好",
                "查看冰箱密封条无破损，冷藏温度正常",
                "检查浴室地漏无堵塞，干湿分离门已关严",
                "确认客厅空调已关机，遥控器放固定位置"
            ],
            balcony: [
                "检查阳台栏杆稳固性，无松动或锈蚀",
                "确认晾衣架已收回，无悬挂重物",
                "检查门窗缝隙无异常声响（防撬提示）",
                "确认花盆已远离边缘，暴雨天已加固",
                "检查纱窗完好，无破损孔洞"
            ]
        };

        // 渲染检查项
        function renderChecklist(type) {
            const container = document.getElementById('checklist');
            container.innerHTML = '';
            const items = checklistData[type] || checklistData.rental;

            items.forEach((text, index) => {
                const item = document.createElement('div');
                item.className = 'item';
                item.innerHTML = `
                    <input type="checkbox" class="checkbox" data-index="${index}">
                    <div class="item-text">${text}</div>
                    <div class="item-actions">
                        <button class="btn-speak" title="语音提醒">${index === 0 ? '🔊' : '🔈'}</button>
                    </div>
                `;
                container.appendChild(item);
            });

            // 绑定事件
            document.querySelectorAll('.checkbox').forEach(box => {
                box.addEventListener('change', updateProgress);
            });
            document.querySelectorAll('.btn-speak').forEach((btn, i) => {
                btn.addEventListener('click', () => speakItem(items[i]));
            });
        }

        // 更新进度条
        function updateProgress() {
            const checkedCount = document.querySelectorAll('.checkbox:checked').length;
            const totalCount = 5;
            document.getElementById('done-count').textContent = checkedCount;
            document.getElementById('progress-fill').style.width = `${(checkedCount / totalCount) * 100}%`;
            
            // 添加完成态样式
            document.querySelectorAll('.item').forEach((item, i) => {
                const checkbox = item.querySelector('.checkbox');
                if (checkbox.checked) {
                    item.classList.add('completed');
                } else {
                    item.classList.remove('completed');
                }
            });
        }

        // 语音播报
        function speakItem(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.9;
                speechSynthesis.speak(utterance);
            }
        }

        // 全部完成
        document.getElementById('mark-all-done').addEventListener('click', () => {
            document.querySelectorAll('.checkbox').forEach(cb => cb.checked = true);
            updateProgress();
        });

        // 初始化
        document.getElementById('housing-type').addEventListener('change', (e) => {
            renderChecklist(e.target.value);
        });
        renderChecklist('rental');

        // 首次加载后更新一次进度
        updateProgress();
    </script>
</body>
</html>
