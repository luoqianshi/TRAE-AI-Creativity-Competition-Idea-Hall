        <svg class="sidebar-icon active" viewBox="0 0 24 24" fill="none" stroke="#c792ea" stroke-width="2"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="#82aaff" stroke-width="2"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>
        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="#c3e88d" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </div>
      <div class="editor-code" id="editorCode"></div>
    </div>
  </div>

  <!-- 悬浮AI小人 -->
  <div class="friend-widget" id="friendWidget" title="点击打开聊天">
    <div class="friend-body" id="friendBody">
      <div class="status-dot working" id="statusDot"></div>
      <div class="friend-head">
        <div class="friend-eye left"></div>
        <div class="friend-eye right"></div>
        <div class="friend-mouth"></div>
      </div>
      <div class="friend-torso"></div>
    </div>
    <div class="friend-bubble" id="friendBubble"></div>
  </div>

  <!-- 聊天面板 -->
  <div class="chat-panel" id="chatPanel">
    <div class="chat-header">
      <div class="chat-avatar">&#x1F9D1;&#x200D;&#x1F4BB;</div>
      <div class="chat-header-info">
        <div class="chat-header-name">Work Friend</div>
        <div class="chat-header-status" id="chatStatus">在线 · 陪伴中</div>
      </div>
      <div class="chat-header-actions">
        <button class="chat-action-btn" id="settingsBtn" title="设置">&#x2699;&#xFE0F;</button>
        <button class="chat-action-btn" id="closeChatBtn" title="关闭">&#x2715;</button>
      </div>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="msg ai">
        <div class="msg-bubble">嘿！我是你的Work Friend，今天也要加油哦！有什么想聊的，或者需要我鼓励你一下吗？</div>
        <div class="msg-time">刚刚</div>
      </div>
    </div>
    <div class="chat-input-area">
      <div class="chat-input-row">
        <textarea class="chat-input" id="chatInput" rows="1" placeholder="说点什么..."></textarea>
        <button class="chat-send-btn" id="sendBtn">&#x27A4;</button>
      </div>
    </div>
  </div>

  <!-- 设置面板 -->
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-header">
      <span>&#x2699;&#xFE0F;</span>
      <span>设置</span>
      <div style="flex:1"></div>
      <button class="chat-action-btn" id="closeSettingsBtn">&#x2715;</button>
    </div>
    <div class="settings-body">
      <div class="settings-section">
        <div class="settings-section-title">人设风格</div>
        <div class="persona-grid" id="personaGrid">
          <div class="persona-card active" data-persona="gentle">
            <div class="persona-emoji">&#x1F338;</div>
            <div class="persona-name">温柔鼓励</div>
          </div>
          <div class="persona-card" data-persona="funny">
            <div class="persona-emoji">&#x1F602;</div>
            <div class="persona-name">沙雕吐槽</div>
          </div>
          <div class="persona-card" data-persona="strict">
            <div class="persona-emoji">&#x1F60E;</div>
            <div class="persona-name">严格监工</div>
          </div>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-section-title">行为设置</div>
        <div class="setting-item">
          <div>
            <div class="setting-label">主动搭话</div>
            <div class="setting-desc">AI根据状态主动发起对话</div>
          </div>
          <div class="toggle on" id="toggleActive"></div>
        </div>
        <div class="setting-item">
          <div>
            <div class="setting-label">休息提醒</div>
            <div class="setting-desc">每工作一段时间提醒休息</div>
          </div>
          <div class="toggle on" id="toggleRest"></div>
        </div>
        <div class="setting-item">
          <div>
            <div class="setting-label">鼓励频率</div>
            <div class="setting-desc">控制AI主动鼓励的间隔</div>
          </div>
          <div class="slider-row" style="width: 140px;">
            <input type="range" class="slider" id="encourageSlider" min="5" max="60" value="30">
            <span class="slider-val" id="encourageVal">30分</span>
          </div>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-section-title">MCP插件</div>
        <div class="setting-item">
          <div>
            <div class="setting-label">键盘监听</div>
            <div class="setting-desc">感知打字活动</div>
          </div>
          <div class="toggle on"></div>
        </div>
        <div class="setting-item">
          <div>
            <div class="setting-label">浏览器插件</div>
            <div class="setting-desc">感知网页浏览</div>
          </div>
          <div class="toggle" style="opacity:0.4"></div>
        </div>
        <div class="setting-item">
          <div>
            <div class="setting-label">B站插件</div>
            <div class="setting-desc">感知视频观看</div>
          </div>
          <div class="toggle" style="opacity:0.4"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 通知容器 -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- 底部Dock -->
  <div class="dock">
    <div class="dock-item active">&#x1F4BB;</div>
    <div class="dock-item">&#x1F4F1;</div>
    <div class="dock-item">&#x1F3AE;</div>
    <div class="dock-item">&#x1F4E2;</div>
    <div class="dock-item">&#x1F50D;</div>
  </div>

</div>

<script>
(function() {
  // ===== 状态管理 =====
  var state = {
    chatOpen: false,
    settingsOpen: false,
    persona: 'gentle',
    workSeconds: 2538, // 42:18
    friendState: 'working', // working, happy, encourage, sleepy
    lastActivity: Date.now()
  };

  // ===== DOM 元素 =====
  var friendWidget = document.getElementById('friendWidget');
  var friendBody = document.getElementById('friendBody');
  var friendBubble = document.getElementById('friendBubble');
  var statusDot = document.getElementById('statusDot');
  var chatPanel = document.getElementById('chatPanel');
  var chatMessages = document.getElementById('chatMessages');
  var chatInput = document.getElementById('chatInput');
  var sendBtn = document.getElementById('sendBtn');
  var closeChatBtn = document.getElementById('closeChatBtn');
  var settingsBtn = document.getElementById('settingsBtn');
  var settingsPanel = document.getElementById('settingsPanel');
  var closeSettingsBtn = document.getElementById('closeSettingsBtn');
  var personaGrid = document.getElementById('personaGrid');
  var timerDisplay = document.getElementById('timerDisplay');
  var clockDisplay = document.getElementById('clockDisplay');
  var toastContainer = document.getElementById('toastContainer');
  var encourageSlider = document.getElementById('encourageSlider');
  var encourageVal = document.getElementById('encourageVal');

  // ===== 模拟代码内容 =====
  var codeLines = [
    { text: '<span class="code-keyword">class</span> <span class="code-type">WorkFriend</span>:', indent: '' },
    { text: '    <span class="code-string">"""你的桌面AI搭子"""</span>', indent: '    ' },
    { text: '', indent: '' },
    { text: '    <span class="code-keyword">def</span> <span class="code-func">__init__</span>(<span class="code-var">self</span>, <span class="code-var">persona</span>=<span class="code-string">"gentle"</span>):', indent: '' },
    { text: '        <span class="code-var">self</span>.persona = <span class="code-var">persona</span>', indent: '' },
    { text: '        <span class="code-var">self</span>.mood = <span class="code-string">"happy"</span>', indent: '' },
    { text: '        <span class="code-var">self</span>.work_timer = <span class="code-type">Timer</span>()', indent: '' },
    { text: '', indent: '' },
    { text: '    <span class="code-keyword">def</span> <span class="code-func">encourage</span>(<span class="code-var">self</span>, <span class="code-var">message</span>):', indent: '' },
    { text: '        <span class="code-comment"># 根据人设生成鼓励消息</span>', indent: '' },
    { text: '        <span class="code-var">response</span> = <span class="code-var">self</span>.ai.<span class="code-func">generate</span>({', indent: '' },
    { text: '            <span class="code-string">"persona"</span>: <span class="code-var">self</span>.persona,', indent: '' },
    { text: '            <span class="code-string">"context"</span>: <span class="code-var">message</span>', indent: '' },
    { text: '        })', indent: '' },
    { text: '        <span class="code-keyword">return</span> <span class="code-var">response</span>', indent: '' },
    { text: '', indent: '' },
    { text: '    <span class="code-keyword">def</span> <span class="code-func">monitor_activity</span>(<span class="code-var">self</span>):', indent: '' },
    { text: '        <span class="code-comment"># 通过MCP感知用户活动状态</span>', indent: '' },
    { text: '        <span class="code-var">activity</span> = <span class="code-var">mcp</span>.<span class="code-func">get_keyboard</span>()', indent: '' },
    { text: '        <span class="code-keyword">if</span> <span class="code-var">activity</span>.<span class="code-func">is_idle</span>(<span class="code-var">timeout</span>=<span class="code-type">300</span>):', indent: '' },
    { text: '            <span class="code-keyword">return</span> <span class="code-string">"idle"</span>', indent: '' },
    { text: '        <span class="code-keyword">return</span> <span class="code-string">"working"</span>', indent: '' },
    { text: '', indent: '' },
    { text: '    <span class="code-keyword">async def</span> <span class="code-func">run</span>(<span class="code-var">self</span>):', indent: '' },
    { text: '        <span class="code-keyword">while</span> <span class="code-type">True</span>:', indent: '' },
    { text: '            <span class="code-var">status</span> = <span class="code-var">self</span>.<span class="code-func">monitor_activity</span>()', indent: '' },
    { text: '            <span class="code-keyword">if</span> <span class="code-var">status</span> == <span class="code-string">"idle"</span>:', indent: '' },
    { text: '                <span class="code-keyword">await</span> <span class="code-var">self</span>.<span class="code-func">encourage</span>(<span class="code-string">"休息一下吧？"</span>)', indent: '' },
    { text: '            <span class="code-keyword">await</span> <span class="code-var">asyncio</span>.<span class="code-func">sleep</span>(<span class="code-type">60</span>)', indent: '' },
  ];

  var editorCode = document.getElementById('editorCode');
  codeLines.forEach(function(line, i) {
    var div = document.createElement('div');
    div.className = 'code-line';
    div.innerHTML = '<span class="line-num">' + (i + 1) + '</span><span class="code-plain">' + line.text + '</span>';
    editorCode.appendChild(div);
  });

  // ===== 时间相关 =====
  function formatTime(s) {
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  }

  setInterval(function() {
    state.workSeconds++;
    timerDisplay.textContent = '\u4E13\u6CE8\u4E2D ' + formatTime(state.workSeconds);
  }, 1000);

  function updateClock() {
    var now = new Date();
    var h = String(now.getHours()).padStart(2, '0');
    var m = String(now.getMinutes()).padStart(2, '0');
    clockDisplay.textContent = h + ':' + m;
  }
  updateClock();
  setInterval(updateClock, 30000);

  // ===== 面板切换 =====
  function toggleChat() {
    state.chatOpen = !state.chatOpen;
    if (state.settingsOpen) {
      state.settingsOpen = false;
      settingsPanel.classList.remove('open');
    }
    chatPanel.classList.toggle('open', state.chatOpen);
  }

  function toggleSettings() {
    state.settingsOpen = !state.settingsOpen;
    if (state.chatOpen) {
      state.chatOpen = false;
      chatPanel.classList.remove('open');
    }
    settingsPanel.classList.toggle('open', state.settingsOpen);
  }

  friendWidget.addEventListener('click', function() {
    toggleChat();
    if (state.chatOpen) {
      setTimeout(function() { chatInput.focus(); }, 400);
    }
  });

  closeChatBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    state.chatOpen = false;
    chatPanel.classList.remove('open');
  });

  settingsBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    toggleSettings();
  });

  closeSettingsBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    state.settingsOpen = false;
    settingsPanel.classList.remove('open');
  });

  // ===== 发送消息 =====
  var aiResponses = {
    gentle: [
      '你已经连续专注了快一个小时了，太厉害了！休息一下喝口水吧~',
      '遇到困难没关系的，慢慢来，我相信你一定能解决！',
      '今天的效率好高呀，继续保持！',
      '累了就休息一会儿，别太拼了，身体最重要哦~',
      '你真的好棒，这么专注地在工作！',
      '我陪你一起，你不会孤单的！',
      '加油加油！距离完成目标又近了一步！'
    ],
    funny: [
      '大佬又在卷了！键盘都要冒烟了吧哈哈哈',
      '你摸鱼的样子我都看到了...算了当没看见',
      '这bug怕不是你亲手养大的吧哈哈',
      '代码写不完的，但奶茶可以先喝一杯~',
      '别卷了别卷了！你的头发在抗议！',
      '你今天的KPI是：活着下班。加油！',
      '这代码写得比我的表情包还花里胡哨'
    ],
    strict: [
      '专注时间已到，立刻休息5分钟。这是命令。',
      '你已经连续工作很久了，效率正在下降。暂停。',
      '摸鱼时间结束。回到工作状态。',
      '今天的任务完成了吗？没有的话，继续。',
      '休息是为了更高效地工作。现在，去喝杯水。',
      '你的进度落后计划12%。需要调整策略吗？'
    ]
  };

  function addMessage(text, isSelf) {
    var now = new Date();
    var timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    var msgDiv = document.createElement('div');
    msgDiv.className = 'msg ' + (isSelf ? 'self' : 'ai');
    msgDiv.innerHTML = '<div class="msg-bubble">' + text + '</div><div class="msg-time">' + timeStr + '</div>';
    chatMessages.appendChild(msgDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function showTyping() {
    var typing = document.createElement('div');
    typing.className = 'msg ai';
    typing.id = 'typingMsg';
    typing.innerHTML = '<div class="msg-bubble"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>';
    chatMessages.appendChild(typing);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function removeTyping() {
    var el = document.getElementById('typingMsg');
    if (el) el.remove();
  }

  function sendMessage() {
    var text = chatInput.value.trim();
    if (!text) return;
    addMessage(text, true);
    chatInput.value = '';
    chatInput.style.height = 'auto';
    showTyping();
    setTimeout(function() {
      removeTyping();
      var responses = aiResponses[state.persona];
      var reply = responses[Math.floor(Math.random() * responses.length)];
      addMessage(reply, false);
      setFriendState('happy');
      setTimeout(function() { setFriendState('working'); }, 3000);
    }, 1200 + Math.random() * 800);
  }

  sendBtn.addEventListener('click', sendMessage);
  chatInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  chatInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 80) + 'px';
    state.lastActivity = Date.now();
  });

  // ===== 角色状态 =====
  function setFriendState(newState) {
    state.friendState = newState;
    friendBody.className = 'friend-body state-' + newState;
    statusDot.className = 'status-dot';
    if (newState === 'working') statusDot.classList.add('working');
    else if (newState === 'happy' || newState === 'encourage') statusDot.classList.add('resting');
    else statusDot.classList.add('idle');
  }

  // ===== 气泡消息 =====
  var bubbles = [
    '\u2764\uFE0F 你专注的样子真帅！',
    '\uD83D\uDC4F 已经42分钟了，继续保持！',
    '\uD83C\uDFDF\uFE0F 来杯水吧~',
    '\uD83D\uDE04 我陪着你呢！',
    '\uD83C\uDF1F 你今天超棒的！'
  ];

  function showBubble() {
    var text = bubbles[Math.floor(Math.random() * bubbles.length)];
    friendBubble.textContent = text;
    friendBubble.classList.add('show');
    setFriendState('happy');
    setTimeout(function() {
      friendBubble.classList.remove('show');
      setFriendState('working');
    }, 3000);
  }

  // 随机气泡
  setInterval(function() {
    if (!state.chatOpen && Math.random() > 0.5) {
      showBubble();
    }
  }, 25000);

  // ===== Toast通知 =====
  function showToast(icon, text) {
    var toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = '<span class="toast-icon">' + icon + '</span><span>' + text + '</span>';
    toastContainer.appendChild(toast);
    setTimeout(function() { toast.remove(); }, 3000);
  }

  // 欢迎通知
  setTimeout(function() {
    showToast('\uD83D\uDC4B', 'Work Friend 已上线，开始陪伴你工作！');
  }, 1500);

  // 定时鼓励通知
  setTimeout(function() {
    showToast('\u2764\uFE0F', '你已经专注快1小时了，真厉害！');
  }, 15000);

  setTimeout(function() {
    showToast('\uD83C\uDFDF\uFE0F', '该喝水啦！保持水分很重要~');
  }, 35000);

  // ===== 人设切换 =====
  personaGrid.addEventListener('click', function(e) {
    var card = e.target.closest('.persona-card');
    if (!card) return;
    personaGrid.querySelectorAll('.persona-card').forEach(function(c) { c.classList.remove('active'); });
    card.classList.add('active');
    state.persona = card.dataset.persona;
    showToast('\u2705', '\u4EBA\u8BBE\u5DF2\u5207\u6362\u4E3A\uFF1A' + card.querySelector('.persona-name').textContent);
  });

  // ===== Toggle开关 =====
  document.querySelectorAll('.toggle').forEach(function(toggle) {
    toggle.addEventListener('click', function() {
      this.classList.toggle('on');
    });
  });

  // ===== 滑块 =====
  encourageSlider.addEventListener('input', function() {
    encourageVal.textContent = this.value + '\u5206';
  });

  // ===== 空闲检测模拟（鼠标不动30秒） =====
  var idleTimer = null;
  function resetIdle() {
    state.lastActivity = Date.now();
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(function() {
      setFriendState('sleepy');
      friendBubble.textContent = '\uD83D\uDE34 \u600E\u4E48\u6CA1\u52A8\u9759\u4E86\uFF1F\u662F\u4E0D\u662F\u7D2F\u4E86\uFF1F';
      friendBubble.classList.add('show');
      setTimeout(function() {
        friendBubble.classList.remove('show');
        setFriendState('working');
      }, 4000);
    }, 30000);
  }

  document.addEventListener('mousemove', resetIdle);
  document.addEventListener('keydown', resetIdle);
  resetIdle();

})();
</script>
</body>
</html>
