<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>贪吃蛇 - Retro Snake</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
            position: relative;
        }

        /* Scanline effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1) 0px,
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }

        .header {
            display: flex;
            gap: 40px;
            margin-bottom: 10px;
        }

        .score-box {
            color: #00ff88;
            font-size: 14px;
            text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88;
        }

        .score-box.high {
            color: #ffd700;
            text-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700;
        }

        .score-label {
            color: #888;
            font-size: 8px;
            margin-bottom: 5px;
        }

        #gameCanvas {
            border: 4px solid #00ff88;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5),
                        inset 0 0 20px rgba(0, 255, 136, 0.1);
            background: #0d0d1a;
        }

        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            z-index: 100;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88, 0 0 30px #00ff88;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .overlay.gameover h1 {
            color: #ff4757;
            text-shadow: 0 0 10px #ff4757, 0 0 30px #ff4757;
            animation: flashRed 0.5s ease-in-out infinite;
        }

        .overlay p {
            font-size: 10px;
            color: #888;
            margin-top: 15px;
            animation: blink 1s step-end infinite;
        }

        .final-score {
            font-size: 16px;
            color: #ffd700;
            margin: 20px 0;
            text-shadow: 0 0 10px #ffd700;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes flashRed {
            0%, 100% { color: #ff4757; }
            50% { color: #ff6b7a; }
        }

        /* Mobile controls */
        .mobile-controls {
            display: none;
            margin-top: 20px;
            gap: 5px;
        }

        .control-row {
            display: flex;
            justify-content: center;
            gap: 5px;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid #00ff88;
            border-radius: 8px;
            color: #00ff88;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.1s;
        }

        .control-btn:active {
            background: rgba(0, 255, 136, 0.3);
            transform: scale(0.95);
        }

        .control-placeholder {
            width: 60px;
            height: 60px;
        }

        @media (max-width: 500px) {
            .mobile-controls {
                display: flex;
                flex-direction: column;
            }

            .score-box {
                font-size: 10px;
            }

            .score-label {
                font-size: 6px;
            }

            .header {
                gap: 20px;
            }
        }

        @media (hover: none) and (pointer: coarse) {
            .mobile-controls {
                display: flex;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="score-box">
                <div class="score-label">SCORE</div>
                <div id="score">0</div>
            </div>
            <div class="score-box high">
                <div class="score-label">HIGH</div>
                <div id="highScore">0</div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="startOverlay" class="overlay">
            <h1>贪吃蛇</h1>
            <p>按空格开始</p>
        </div>

        <div id="gameoverOverlay" class="overlay gameover hidden">
            <h1>GAME OVER</h1>
            <div class="final-score">得分: <span id="finalScore">0</span></div>
            <p>按空格重新开始</p>
        </div>

        <div class="mobile-controls" id="mobileControls">
            <div class="control-row">
                <div class="control-placeholder"></div>
                <button class="control-btn" data-dir="up">▲</button>
                <div class="control-placeholder"></div>
            </div>
            <div class="control-row">
                <button class="control-btn" data-dir="left">◀</button>
                <button class="control-btn" data-dir="down">▼</button>
                <button class="control-btn" data-dir="right">▶</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const startOverlay = document.getElementById('startOverlay');
        const gameoverOverlay = document.getElementById('gameoverOverlay');
        const finalScoreEl = document.getElementById('finalScore');
        const mobileControls = document.getElementById('mobileControls');

        // Game constants
        const GRID_SIZE = 20;
        const CELL_SIZE = 20;
        const BASE_SPEED = 150;

        // Calculate canvas size based on screen
        function getCanvasSize() {
            const maxWidth = Math.min(window.innerWidth - 40, 400);
            const size = Math.floor(maxWidth / GRID_SIZE) * GRID_SIZE;
            return Math.max(size, 200);
        }

        let cellSize = getCanvasSize() / GRID_SIZE;
        canvas.width = cellSize * GRID_SIZE;
        canvas.height = cellSize * GRID_SIZE;

        // Game state
        let snake = [];
        let direction = 'right';
        let nextDirection = 'right';
        let food = { x: 0, y: 0 };
        let score = 0;
        let highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
        let gameState = 'waiting';
        let speed = BASE_SPEED;
        let gameLoop = null;
        let foodBlink = 0;

        highScoreEl.textContent = highScore;

        function initGame() {
            snake = [
                { x: 5, y: 10 },
                { x: 4, y: 10 },
                { x: 3, y: 10 }
            ];
            direction = 'right';
            nextDirection = 'right';
            score = 0;
            speed = BASE_SPEED;
            scoreEl.textContent = score;
            generateFood();
        }

        function generateFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * GRID_SIZE);
                food.y = Math.floor(Math.random() * GRID_SIZE);
                valid = !snake.some(s => s.x === food.x && s.y === food.y);
            }
        }

        function moveSnake() {
            direction = nextDirection;
            const head = { ...snake[0] };

            switch (direction) {
                case 'up': head.y--; break;
                case 'down': head.y++; break;
                case 'left': head.x--; break;
                case 'right': head.x++; break;
            }

            // Check wall collision
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                gameOver();
                return;
            }

            // Check self collision
            if (snake.some(s => s.x === head.x && s.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                generateFood();

                // Speed up every 5 foods
                if (score % 50 === 0) {
                    speed = Math.max(50, speed * 0.9);
                    restartGameLoop();
                }
            } else {
                snake.pop();
            }
        }

        function gameOver() {
            gameState = 'gameover';
            clearInterval(gameLoop);
            gameLoop = null;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreEl.textContent = highScore;
            }

            finalScoreEl.textContent = score;
            gameoverOverlay.classList.remove('hidden');
        }

        function restartGameLoop() {
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(() => {
                moveSnake();
                render();
            }, speed);
        }

        function render() {
            ctx.fillStyle = '#0d0d1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = 'rgba(0, 255, 136, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * cellSize, 0);
                ctx.lineTo(i * cellSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * cellSize);
                ctx.lineTo(canvas.width, i * cellSize);
                ctx.stroke();
            }

            // Draw food with blinking effect
            foodBlink = (foodBlink + 1) % 20;
            const foodAlpha = foodBlink < 10 ? 1 : 0.5;
            ctx.fillStyle = `rgba(255, 71, 87, ${foodAlpha})`;
            ctx.shadowColor = '#ff4757';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(
                food.x * cellSize + cellSize / 2,
                food.y * cellSize + cellSize / 2,
                cellSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0;

            // Draw snake
            snake.forEach((segment, index) => {
                const isHead = index === 0;
                const brightness = 1 - (index / snake.length) * 0.3;

                ctx.fillStyle = `rgba(0, 255, 136, ${brightness})`;
                ctx.shadowColor = '#00ff88';
                ctx.shadowBlur = isHead ? 15 : 8;

                const padding = 2;
                const radius = 4;
                const x = segment.x * cellSize + padding;
                const y = segment.y * cellSize + padding;
                const w = cellSize - padding * 2;
                const h = cellSize - padding * 2;

                ctx.beginPath();
                ctx.roundRect(x, y, w, h, radius);
                ctx.fill();
            });
            ctx.shadowBlur = 0;
        }

        function startGame() {
            if (gameState === 'playing') return;

            gameState = 'playing';
            startOverlay.classList.add('hidden');
            gameoverOverlay.classList.add('hidden');
            initGame();
            render();
            restartGameLoop();
        }

        function handleKeydown(e) {
            const keyMap = {
                'ArrowUp': 'up', 'KeyW': 'up',
                'ArrowDown': 'down', 'KeyS': 'down',
                'ArrowLeft': 'left', 'KeyA': 'left',
                'ArrowRight': 'right', 'KeyD': 'right'
            };

            if (e.code === 'Space') {
                e.preventDefault();
                if (gameState !== 'playing') {
                    startGame();
                }
                return;
            }

            const newDir = keyMap[e.code];
            if (newDir) {
                e.preventDefault();
                const opposites = { up: 'down', down: 'up', left: 'right', right: 'left' };
                if (opposites[newDir] !== direction) {
                    nextDirection = newDir;
                }
            }
        }

        function handleTouchControl(dir) {
            if (gameState !== 'playing') {
                startGame();
                return;
            }
            const opposites = { up: 'down', down: 'up', left: 'right', right: 'left' };
            if (opposites[dir] !== direction) {
                nextDirection = dir;
            }
        }

        document.addEventListener('keydown', handleKeydown);

        // Mobile controls
        document.querySelectorAll('.control-btn').forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const dir = btn.dataset.dir;
                handleTouchControl(dir);
            });
            btn.addEventListener('click', () => {
                const dir = btn.dataset.dir;
                handleTouchControl(dir);
            });
        });

        // Resize handler
        window.addEventListener('resize', () => {
            const newSize = getCanvasSize();
            cellSize = newSize / GRID_SIZE;
            canvas.width = cellSize * GRID_SIZE;
            canvas.height = cellSize * GRID_SIZE;
            render();
        });

        // Initial render
        render();
    </script>
</body>
</html>
