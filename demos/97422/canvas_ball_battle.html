<meta charset="utf-8">
<style>
  :root {
    --bg: #08111f;
    --panel: #111a2b;
    --panel-2: #172238;
    --line: #26344f;
    --text: #eef4ff;
    --muted: #93a4bf;
    --accent: #40c4ff;
    --accent-2: #ff4d6d;
    --good: #47d18c;
    --warn: #ffd166;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 20% 10%, #16365b 0, #08111f 34%, #050912 100%);
    color: var(--text);
    font-family: Inter, "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }

  .app {
    min-height: 100vh;
  }

  .view {
    min-height: 100vh;
  }

  .app[data-view="game"] .settings-view {
    display: none;
  }

  .app[data-view="settings"] .game-view {
    display: none;
  }

  .stage-wrap {
    position: relative;
    display: grid;
    place-items: center;
    min-height: 100vh;
    padding: 24px;
  }

  .game-panel {
    position: absolute;
    right: 24px;
    top: 24px;
    width: 320px;
    max-width: calc(100vw - 48px);
    max-height: calc(100vh - 48px);
    overflow: auto;
    background: rgba(10, 16, 29, .88);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px;
    backdrop-filter: blur(16px);
  }

  .game-controls {
    display: grid;
    gap: 10px;
    margin-top: 14px;
  }

  .settings-view {
    height: 100vh;
    overflow: auto;
    padding: 24px;
  }

  .settings-panel {
    max-width: 860px;
    margin: 0 auto;
    background: rgba(10, 16, 29, .92);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 22px;
    backdrop-filter: blur(16px);
  }

  .settings-header {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-start;
  }

  .settings-header button {
    width: auto;
    margin-top: 0;
    white-space: nowrap;
  }

  .settings-header h2 {
    margin: 0 0 14px;
    font-size: 18px;
  }

  canvas {
    width: min(76vw, 860px);
    height: min(76vh, 860px);
    aspect-ratio: 1 / 1;
    background: #0b8ed8;
    border: 12px solid #05070d;
    box-shadow: 0 24px 80px rgba(0, 0, 0, .42);
    cursor: default;
  }

  .hint {
    margin: 0 0 18px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
  }

  .group {
    padding: 16px 0;
    border-top: 1px solid var(--line);
  }

  .group h3 {
    margin: 0 0 12px;
    font-size: 14px;
    color: #cfe4ff;
  }

  label {
    display: block;
    margin: 12px 0;
    font-size: 13px;
    color: var(--muted);
  }

  .row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: center;
  }

  .checkline {
    display: flex;
    gap: 10px;
    align-items: center;
    color: var(--text);
  }

  .checkline input {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }

  input[type="range"]:disabled {
    opacity: .45;
  }

  input[type="text"],
  input[type="color"],
  input[type="file"],
  select {
    width: 100%;
    margin-top: 8px;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
  }

  .value {
    min-width: 54px;
    text-align: right;
    font: 600 13px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
    color: var(--text);
  }

  button {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 12px 14px;
    margin-top: 10px;
    color: #06101c;
    background: var(--accent);
    font-weight: 700;
    cursor: pointer;
  }

  button.secondary {
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
  }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
  }

  .role-library-list {
    display: grid;
    gap: 10px;
  }

  .role-card {
    display: grid;
    grid-template-columns: 42px 1fr;
    gap: 10px;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px;
  }

  .role-card.is-selected {
    border-color: var(--accent);
  }

  .role-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #05070d;
    background-size: cover;
    background-position: center;
  }

  .role-info b {
    display: block;
    font-size: 14px;
  }

  .role-info span {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.4;
  }

  .role-picked {
    display: inline-block;
    margin-top: 6px;
    margin-right: 6px;
    color: var(--warn);
    font-size: 12px;
  }

  .role-card-actions {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .role-card-actions button {
    margin-top: 0;
    padding: 9px 10px;
  }

  .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px;
  }

  .stat b {
    display: block;
    font-size: 18px;
  }

  .stat span {
    color: var(--muted);
    font-size: 12px;
  }

  /* ── 设置子导航 ── */
  .settings-nav {
    display: flex;
    gap: 8px;
    margin: 16px 0 0;
    border-bottom: 1px solid var(--line);
    padding-bottom: 12px;
  }

  .settings-nav-btn {
    width: auto;
    margin-top: 0;
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid var(--line);
    color: var(--muted);
    background: transparent;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }

  .settings-nav-btn.active {
    color: var(--text);
    background: var(--panel-2);
    border-color: var(--accent);
  }

  /* ── 子视图切换 ── */
  .settings-subview {
    display: none;
  }

  .settings-panel[data-subview="library"] .settings-subview[data-subview="library"],
  .settings-panel[data-subview="edit-role"] .settings-subview[data-subview="edit-role"],
  .settings-panel[data-subview="battle"] .settings-subview[data-subview="battle"] {
    display: block;
  }

  /* ── 角色编辑页 ── */
  .role-edit-page {
    padding: 4px 0;
  }

  .role-edit-page h3 {
    margin: 0 0 16px;
    font-size: 15px;
    color: #cfe4ff;
  }

  .back-btn {
    width: auto;
    margin-top: 0;
    margin-bottom: 14px;
    padding: 8px 14px;
    font-size: 13px;
  }

  .role-edit-actions {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-top: 18px;
  }

  .role-edit-actions button {
    margin-top: 0;
  }

  button.danger {
    color: var(--accent-2);
    background: var(--panel-2);
    border: 1px solid var(--accent-2);
  }

  /* ── 主页面下拉选择器 ── */
  .role-select-group select {
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  @media (max-width: 900px) {
    body {
      overflow: auto;
    }

    .game-view .stage-wrap {
      min-height: 100vh;
      padding: 16px;
      align-content: start;
    }

    .game-panel {
      position: static;
      width: min(92vw, 720px);
      margin-top: 16px;
    }

    .settings-view {
      height: auto;
      min-height: 100vh;
      padding: 16px;
    }

    .settings-header {
      display: block;
    }

    canvas {
      width: min(92vw, 720px);
      height: min(92vw, 720px);
    }

    .role-edit-actions {
      grid-template-columns: 1fr 1fr;
    }
  }
</style>

<div class="app" data-view="game">
  <!-- ══════════ 游戏页面 ══════════ -->
  <section class="view game-view">
    <main class="stage-wrap">
      <canvas id="game" width="800" height="800"></canvas>

      <section class="game-panel">
        <section class="group status-group">
          <h3>当前状态</h3>
          <div class="stats">
            <div class="stat"><b id="fighterANameStat">均衡型</b><span>A 当前角色</span></div>
            <div class="stat"><b id="fighterBNameStat">强攻战士</b><span>B 当前角色</span></div>
            <div class="stat"><b id="fighterAHpStat">200</b><span>角色 A 血量</span></div>
            <div class="stat"><b id="fighterBHpStat">200</b><span>角色 B 血量</span></div>
            <div class="stat"><b id="hitStat">0</b><span>碰撞次数</span></div>
            <div class="stat"><b id="resultStat">待开始</b><span>当前结果</span></div>
          </div>
        </section>

        <section class="group role-select-group">
          <h3>选择角色</h3>
          <label>
            角色 A
            <select id="roleSelectA"></select>
          </label>
          <label>
            角色 B
            <select id="roleSelectB"></select>
          </label>
        </section>

        <section class="game-controls">
          <button id="startBattle">开始对战</button>
          <button id="toggleBattle" class="secondary">暂停</button>
          <button id="reset" class="secondary">重置本局</button>
          <button id="goSettings" class="secondary">去设置</button>
        </section>
      </section>
    </main>
  </section>

  <!-- ══════════ 设置页面 ══════════ -->
  <section class="view settings-view">
    <aside class="settings-panel" data-subview="library">
      <header class="settings-header">
        <div>
          <h2>设置</h2>
          <p class="hint">管理角色库和战斗参数。角色参数在每个角色的编辑页面中调整。</p>
        </div>
        <button id="backToGame" class="secondary">返回游戏</button>
      </header>

      <nav class="settings-nav">
        <button class="settings-nav-btn active" data-subview="library">角色库</button>
        <button class="settings-nav-btn" data-subview="battle">战斗参数</button>
      </nav>

      <!-- 角色库列表 -->
      <div class="settings-subview" data-subview="library">
        <div id="roleLibraryList" class="role-library-list"></div>
      </div>

      <!-- 角色编辑页 -->
      <div class="settings-subview" data-subview="edit-role">
        <div class="role-edit-page">
          <button id="backToLibrary" class="secondary back-btn">← 返回角色库</button>
          <h3>编辑角色</h3>
          <label>
            角色名称
            <input id="editRoleName" type="text" placeholder="输入角色名称">
          </label>
          <label>
            角色颜色
            <input id="editRoleColor" type="color" value="#40c4ff">
          </label>
          <label>
            角色图片
            <input id="editRoleImage" type="file" accept="image/*">
          </label>
          <label class="row">
            <span>血量</span>
            <span class="value" id="editRoleHpValue">200</span>
          </label>
          <input id="editRoleHp" type="range" min="20" max="600" value="200">
          <label class="row">
            <span>大小</span>
            <span class="value" id="editRoleRadiusValue">34</span>
          </label>
          <input id="editRoleRadius" type="range" min="16" max="90" value="34">
          <label class="row">
            <span>速度</span>
            <span class="value" id="editRoleSpeedValue">8</span>
          </label>
          <input id="editRoleSpeed" type="range" min="2" max="18" value="8">
          <label class="row">
            <span>伤害</span>
            <span class="value" id="editRoleDamageValue">24</span>
          </label>
          <input id="editRoleDamage" type="range" min="5" max="100" value="24">
          <label class="row">
            <span>冷却</span>
            <span class="value" id="editRoleHitCooldownValue">24</span>
          </label>
          <input id="editRoleHitCooldown" type="range" min="6" max="60" value="24">
          <label class="row">
            <span>攻击范围</span>
            <span class="value" id="editRoleAttackRangeValue">34</span>
          </label>
          <input id="editRoleAttackRange" type="range" min="10" max="120" value="34">
          <div class="role-edit-actions">
            <button id="saveEditedRole">保存</button>
            <button id="cancelEditRole" class="secondary">取消</button>
            <button id="deleteEditedRole" class="secondary danger">删除角色</button>
          </div>
        </div>
      </div>

      <!-- 战斗参数 -->
      <div class="settings-subview" data-subview="battle">
        <section class="group">
          <h3>反弹损耗</h3>
          <label class="row">
            <span>反弹损耗</span>
            <span class="value" id="bounceValue">0.86</span>
          </label>
          <label class="checkline">
            <input id="useBounceLoss" type="checkbox" checked>
            <span>启用反弹损耗</span>
          </label>
          <input id="bounce" type="range" min="0.50" max="1.00" step="0.01" value="0.86">
        </section>

        <section class="group">
          <h3>地图</h3>
          <label>
            地图样式
            <select id="levelType">
              <option value="box">封闭房间</option>
              <option value="maze">迷宫墙体</option>
              <option value="target">靶场布局</option>
            </select>
          </label>
        </section>
      </div>
    </aside>
  </section>
</div>

<script>
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const ROLE_PRESETS = {
    balanced: {
      label: "均衡型",
      hp: 200,
      radius: 34,
      speed: 8,
      damage: 24,
      hitCooldown: 24,
      attackRange: 34,
      color: "#40c4ff"
    },
    tank: {
      label: "重装坦克",
      hp: 360,
      radius: 44,
      speed: 5,
      damage: 30,
      hitCooldown: 28,
      attackRange: 44,
      color: "#47d18c"
    },
    assassin: {
      label: "高速刺客",
      hp: 140,
      radius: 28,
      speed: 13,
      damage: 34,
      hitCooldown: 16,
      attackRange: 28,
      color: "#ffd166"
    },
    bruiser: {
      label: "强攻战士",
      hp: 240,
      radius: 38,
      speed: 9,
      damage: 42,
      hitCooldown: 22,
      attackRange: 38,
      color: "#ff4d6d"
    }
  };

  const ui = {
    roleSelectA: document.getElementById("roleSelectA"),
    roleSelectB: document.getElementById("roleSelectB"),
    useBounceLoss: document.getElementById("useBounceLoss"),
    bounce: document.getElementById("bounce"),
    levelType: document.getElementById("levelType"),
    startBattle: document.getElementById("startBattle"),
    reset: document.getElementById("reset"),
    toggleBattle: document.getElementById("toggleBattle"),
    fighterAHpStat: document.getElementById("fighterAHpStat"),
    fighterBHpStat: document.getElementById("fighterBHpStat"),
    fighterANameStat: document.getElementById("fighterANameStat"),
    fighterBNameStat: document.getElementById("fighterBNameStat"),
    hitStat: document.getElementById("hitStat"),
    resultStat: document.getElementById("resultStat"),
    roleLibraryList: document.getElementById("roleLibraryList"),
    editRoleName: document.getElementById("editRoleName"),
    editRoleColor: document.getElementById("editRoleColor"),
    editRoleImage: document.getElementById("editRoleImage"),
    editRoleHp: document.getElementById("editRoleHp"),
    editRoleRadius: document.getElementById("editRoleRadius"),
    editRoleSpeed: document.getElementById("editRoleSpeed"),
    editRoleDamage: document.getElementById("editRoleDamage"),
    editRoleHitCooldown: document.getElementById("editRoleHitCooldown"),
    editRoleAttackRange: document.getElementById("editRoleAttackRange"),
    saveEditedRole: document.getElementById("saveEditedRole"),
    cancelEditRole: document.getElementById("cancelEditRole"),
    deleteEditedRole: document.getElementById("deleteEditedRole"),
    backToLibrary: document.getElementById("backToLibrary")
  };

  const valueLabels = {
    bounce: document.getElementById("bounceValue"),
    editRoleHp: document.getElementById("editRoleHpValue"),
    editRoleRadius: document.getElementById("editRoleRadiusValue"),
    editRoleSpeed: document.getElementById("editRoleSpeedValue"),
    editRoleDamage: document.getElementById("editRoleDamageValue"),
    editRoleHitCooldown: document.getElementById("editRoleHitCooldownValue"),
    editRoleAttackRange: document.getElementById("editRoleAttackRangeValue")
  };

  const config = {
    useBounceLoss: true,
    bounce: 0.86
  };

  const fighters = [
    {
      id: "a",
      name: "角色 A",
      x: 230,
      y: 400,
      vx: 0,
      vy: 0,
      hp: 200,
      maxHp: 200,
      radius: 34,
      speed: 8,
      damage: 24,
      hitCooldown: 24,
      attackRange: 34,
      image: null,
      invincible: 0,
      color: "#40c4ff"
    },
    {
      id: "b",
      name: "角色 B",
      x: 570,
      y: 400,
      vx: 0,
      vy: 0,
      hp: 200,
      maxHp: 200,
      radius: 34,
      speed: 8,
      damage: 24,
      hitCooldown: 24,
      attackRange: 34,
      image: null,
      invincible: 0,
      color: "#ff4d6d"
    }
  ];

  const ROLE_LIBRARY_STORAGE_KEY = "canvasBallBattleRoleLibrary";

  let roleLibrary = [];
  let selectedRoleIds = { a: "balanced", b: "bruiser" };
  let editingRoleId = null;
  let editRoleImageDraft = { imageDataUrl: "", image: null };

  let walls = [];
  let particles = [];
  let damageTexts = [];
  let hitCount = 0;
  let battleState = "ready";
  let winner = null;
  let message = "请选择角色并点击开始";

  /* ──────────── 配置同步 ──────────── */

  function syncConfig() {
    config.useBounceLoss = ui.useBounceLoss.checked;
    config.bounce = Number(ui.bounce.value);
    ui.bounce.disabled = !config.useBounceLoss;
    valueLabels.bounce.textContent = config.useBounceLoss ? config.bounce.toFixed(2) : "关闭";
  }

  /* ──────────── 角色库持久化 ──────────── */

  function createDefaultRoleLibrary() {
    return Object.entries(ROLE_PRESETS).map(([id, preset]) => ({
      id,
      name: preset.label,
      hp: preset.hp,
      radius: preset.radius,
      speed: preset.speed,
      damage: preset.damage,
      hitCooldown: preset.hitCooldown,
      attackRange: preset.attackRange,
      color: preset.color,
      imageDataUrl: "",
      image: null,
      builtin: true
    }));
  }

  function createImageFromDataUrl(imageDataUrl) {
    if (!imageDataUrl) return null;
    const img = new Image();
    img.src = imageDataUrl;
    return img;
  }

  function loadRoleLibrary() {
    const defaults = createDefaultRoleLibrary();
    const raw = localStorage.getItem(ROLE_LIBRARY_STORAGE_KEY);
    if (!raw) return defaults;

    try {
      const saved = JSON.parse(raw);
      const merged = [...defaults];
      for (const role of saved) {
        const restored = {
          ...role,
          attackRange: role.attackRange || role.radius,
          image: createImageFromDataUrl(role.imageDataUrl)
        };
        const index = merged.findIndex(item => item.id === restored.id);
        if (index >= 0) {
          merged[index] = { ...merged[index], ...restored, builtin: merged[index].builtin };
        } else {
          merged.push(restored);
        }
      }
      return merged;
    } catch {
      return defaults;
    }
  }

  function saveRoleLibrary() {
    const data = roleLibrary.map(({ image, ...serializable }) => serializable);
    localStorage.setItem(ROLE_LIBRARY_STORAGE_KEY, JSON.stringify(data));
  }

  function getRoleById(roleId) {
    return roleLibrary.find(role => role.id === roleId);
  }

  /* ──────────── UI 渲染 ──────────── */

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char]));
  }

  function roleAvatarStyle(role) {
    if (role.imageDataUrl) {
      return `background-image:url('${role.imageDataUrl.replace(/'/g, "%27")}')`;
    }
    return `background:${role.color}`;
  }

  function renderRoleCard(role) {
    const picked = [
      selectedRoleIds.a === role.id ? '<span class="role-picked">A 已选择</span>' : "",
      selectedRoleIds.b === role.id ? '<span class="role-picked">B 已选择</span>' : ""
    ].join("");
    const selectedClass = selectedRoleIds.a === role.id || selectedRoleIds.b === role.id ? " is-selected" : "";

    return `
      <div class="role-card${selectedClass}">
        <div class="role-avatar" style="${roleAvatarStyle(role)}"></div>
        <div class="role-info">
          <b>${escapeHtml(role.name)}</b>
          <span>血量 ${role.hp} / 速度 ${role.speed} / 伤害 ${role.damage} / 范围 ${role.attackRange}</span>
          ${picked}
        </div>
        <div class="role-card-actions">
          <button data-action="edit-role" data-role-id="${role.id}">编辑</button>
          <button class="secondary" data-action="delete-role" data-role-id="${role.id}" ${role.builtin ? "disabled" : ""}>删除</button>
        </div>
      </div>
    `;
  }

  function renderRoleLibraryList() {
    ui.roleLibraryList.innerHTML = roleLibrary.map(role => renderRoleCard(role)).join("");
  }

  function renderRoleSelects() {
    const optionsA = roleLibrary.map(role =>
      `<option value="${role.id}" ${selectedRoleIds.a === role.id ? "selected" : ""}>${escapeHtml(role.name)}</option>`
    ).join("");
    ui.roleSelectA.innerHTML = optionsA;

    const optionsB = roleLibrary.map(role =>
      `<option value="${role.id}" ${selectedRoleIds.b === role.id ? "selected" : ""}>${escapeHtml(role.name)}</option>`
    ).join("");
    ui.roleSelectB.innerHTML = optionsB;
  }

  function renderRoleLists() {
    renderRoleLibraryList();
    renderRoleSelects();
  }

  /* ──────────── 角色应用 ──────────── */

  function applyRoleToSide(side, roleId) {
    const role = getRoleById(roleId);
    if (!role) return;

    if (battleState === "running") {
      battleState = "paused";
      message = "已暂停，角色已切换";
    }

    selectedRoleIds[side] = roleId;
    const fighter = side === "a" ? fighters[0] : fighters[1];
    const oldMaxHp = fighter.maxHp || role.hp;

    fighter.name = "角色 " + side.toUpperCase() + " · " + role.name;
    fighter.color = role.color;
    fighter.maxHp = role.hp;
    fighter.radius = role.radius;
    fighter.speed = role.speed;
    fighter.damage = role.damage;
    fighter.hitCooldown = role.hitCooldown;
    fighter.attackRange = role.attackRange;
    fighter.image = role.image || null;

    if (battleState === "ready") {
      fighter.hp = role.hp;
    } else {
      const ratio = oldMaxHp > 0 ? fighter.hp / oldMaxHp : 1;
      fighter.hp = Math.min(role.hp, Math.max(1, Math.round(ratio * role.hp)));
    }

    if (battleState === "ended") {
      prepareGame();
    }

    updateStats();
    renderRoleSelects();
  }

  /* ──────────── 角色编辑页 ──────────── */

  function openRoleEditPage(roleId) {
    const role = getRoleById(roleId);
    if (!role) return;

    editingRoleId = roleId;
    editRoleImageDraft = { imageDataUrl: role.imageDataUrl || "", image: role.image || null };

    ui.editRoleName.value = role.name;
    ui.editRoleColor.value = role.color;
    ui.editRoleImage.value = "";
    ui.editRoleHp.value = role.hp;
    ui.editRoleRadius.value = role.radius;
    ui.editRoleSpeed.value = role.speed;
    ui.editRoleDamage.value = role.damage;
    ui.editRoleHitCooldown.value = role.hitCooldown;
    ui.editRoleAttackRange.value = role.attackRange;
    ui.deleteEditedRole.disabled = !!role.builtin;

    valueLabels.editRoleHp.textContent = role.hp;
    valueLabels.editRoleRadius.textContent = role.radius;
    valueLabels.editRoleSpeed.textContent = role.speed;
    valueLabels.editRoleDamage.textContent = role.damage;
    valueLabels.editRoleHitCooldown.textContent = role.hitCooldown;
    valueLabels.editRoleAttackRange.textContent = role.attackRange;

    document.querySelector(".settings-panel").dataset.subview = "edit-role";
    document.querySelectorAll(".settings-nav-btn").forEach(b => b.classList.remove("active"));
  }

  function closeRoleEditPage() {
    editingRoleId = null;
    document.querySelector(".settings-panel").dataset.subview = "library";
    document.querySelectorAll(".settings-nav-btn").forEach(b => {
      b.classList.toggle("active", b.dataset.subview === "library");
    });
  }

  function saveEditedRole() {
    if (!editingRoleId) return;
    const role = getRoleById(editingRoleId);
    if (!role) return;

    role.name = ui.editRoleName.value.trim() || "未命名";
    role.color = ui.editRoleColor.value;
    role.hp = Number(ui.editRoleHp.value);
    role.radius = Number(ui.editRoleRadius.value);
    role.speed = Number(ui.editRoleSpeed.value);
    role.damage = Number(ui.editRoleDamage.value);
    role.hitCooldown = Number(ui.editRoleHitCooldown.value);
    role.attackRange = Number(ui.editRoleAttackRange.value);

    if (editRoleImageDraft.imageDataUrl) {
      role.imageDataUrl = editRoleImageDraft.imageDataUrl;
      role.image = editRoleImageDraft.image;
    }

    if (selectedRoleIds.a === role.id) applyRoleToSide("a", role.id);
    if (selectedRoleIds.b === role.id) applyRoleToSide("b", role.id);

    saveRoleLibrary();
    renderRoleLibraryList();
    renderRoleSelects();
    closeRoleEditPage();
  }

  function deleteEditedRole() {
    if (!editingRoleId) return;
    const role = getRoleById(editingRoleId);
    if (!role || role.builtin) return;

    roleLibrary = roleLibrary.filter(item => item.id !== role.id);
    if (selectedRoleIds.a === role.id) applyRoleToSide("a", "balanced");
    if (selectedRoleIds.b === role.id) applyRoleToSide("b", "bruiser");

    saveRoleLibrary();
    renderRoleLibraryList();
    renderRoleSelects();
    closeRoleEditPage();
  }

  function handleRoleAction(action, roleId) {
    if (action === "edit-role") openRoleEditPage(roleId);
    if (action === "delete-role") {
      const role = getRoleById(roleId);
      if (!role || role.builtin) return;
      roleLibrary = roleLibrary.filter(item => item.id !== role.id);
      if (selectedRoleIds.a === role.id) applyRoleToSide("a", "balanced");
      if (selectedRoleIds.b === role.id) applyRoleToSide("b", "bruiser");
      saveRoleLibrary();
      renderRoleLibraryList();
      renderRoleSelects();
    }
  }

  /* ──────────── 关卡生成 ──────────── */

  function makeLevel() {
    const type = ui.levelType.value;
    walls = [
      { x: 70, y: 70, w: 660, h: 18 },
      { x: 70, y: 712, w: 660, h: 18 },
      { x: 70, y: 70, w: 18, h: 660 },
      { x: 712, y: 70, w: 18, h: 660 }
    ];

    if (type === "maze") {
      walls.push(
        { x: 150, y: 190, w: 420, h: 18 },
        { x: 570, y: 190, w: 18, h: 250 },
        { x: 220, y: 500, w: 390, h: 18 },
        { x: 150, y: 320, w: 18, h: 198 }
      );
    }

    if (type === "target") {
      walls.push(
        { x: 250, y: 210, w: 18, h: 260 },
        { x: 430, y: 330, w: 18, h: 260 },
        { x: 510, y: 160, w: 140, h: 18 }
      );
    }
  }

  function randomVelocity(speed) {
    const angle = Math.random() * Math.PI * 2;
    return {
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed
    };
  }

  function getBounceFactor() {
    return config.useBounceLoss ? config.bounce : 1;
  }

  /* ──────────── 游戏流程 ──────────── */

  function prepareGame() {
    syncConfig();
    makeLevel();
    fighters[0].x = 230;
    fighters[0].y = 400;
    fighters[1].x = 570;
    fighters[1].y = 400;

    for (const fighter of fighters) {
      fighter.hp = fighter.maxHp;
      fighter.invincible = 0;
      fighter.vx = 0;
      fighter.vy = 0;
    }

    hitCount = 0;
    particles = [];
    damageTexts = [];
    winner = null;
    battleState = "ready";
    message = "请选择角色并点击开始";
    updateStats();
  }

  function startBattle() {
    if (battleState === "running") return;
    if (battleState === "ended") {
      prepareGame();
    }

    syncConfig();
    applyRoleToSide("a", selectedRoleIds.a);
    applyRoleToSide("b", selectedRoleIds.b);

    for (const fighter of fighters) {
      const velocity = randomVelocity(fighter.speed);
      fighter.vx = velocity.vx;
      fighter.vy = velocity.vy;
      fighter.invincible = 0;
    }

    winner = null;
    battleState = "running";
    message = "自动对战开始";
    updateStats();
  }

  function readImageFile(input, callback) {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const imageDataUrl = reader.result;
      const img = new Image();
      img.onload = () => callback({ imageDataUrl, image: img });
      img.src = imageDataUrl;
    };
    reader.readAsDataURL(file);
  }

  /* ──────────── 碰撞检测 ──────────── */

  function circleRectCollision(circle, radius, rect) {
    const nearX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.w));
    const nearY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.h));
    const dx = circle.x - nearX;
    const dy = circle.y - nearY;
    return dx * dx + dy * dy < radius * radius;
  }

  function resolveWallCollision(ball, radius, rect) {
    const nearestX = Math.max(rect.x, Math.min(ball.x, rect.x + rect.w));
    const nearestY = Math.max(rect.y, Math.min(ball.y, rect.y + rect.h));
    let nx = ball.x - nearestX;
    let ny = ball.y - nearestY;
    let distance = Math.hypot(nx, ny);

    if (distance === 0) {
      const left = Math.abs(ball.x - rect.x);
      const right = Math.abs(ball.x - (rect.x + rect.w));
      const top = Math.abs(ball.y - rect.y);
      const bottom = Math.abs(ball.y - (rect.y + rect.h));
      const min = Math.min(left, right, top, bottom);
      if (min === left) {
        nx = -1;
        ny = 0;
      } else if (min === right) {
        nx = 1;
        ny = 0;
      } else if (min === top) {
        nx = 0;
        ny = -1;
      } else {
        nx = 0;
        ny = 1;
      }
      distance = 1;
    }

    nx /= distance;
    ny /= distance;
    const overlap = radius - distance + 1;
    ball.x += nx * overlap;
    ball.y += ny * overlap;

    const dot = ball.vx * nx + ball.vy * ny;
    if (dot < 0) {
      const bounceFactor = getBounceFactor();
      ball.vx = (ball.vx - 2 * dot * nx) * bounceFactor;
      ball.vy = (ball.vy - 2 * dot * ny) * bounceFactor;
    }
  }

  function updateBall(ball) {
    ball.x += ball.vx;
    ball.y += ball.vy;

    for (const wall of walls) {
      if (circleRectCollision(ball, ball.radius, wall)) {
        resolveWallCollision(ball, ball.radius, wall);
      }
    }

    if (ball.invincible > 0) {
      ball.invincible--;
    }
  }

  function resolveBallCollision(a, b) {
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    let dist = Math.hypot(dx, dy);
    const minDist = a.radius + b.radius;
    if (dist >= minDist) return;

    let nx = dx / (dist || 1);
    let ny = dy / (dist || 1);
    if (dist === 0) {
      nx = 1;
      ny = 0;
      dist = 1;
    }

    const overlap = minDist - dist + 1;
    a.x -= nx * overlap / 2;
    a.y -= ny * overlap / 2;
    b.x += nx * overlap / 2;
    b.y += ny * overlap / 2;

    const avn = a.vx * nx + a.vy * ny;
    const bvn = b.vx * nx + b.vy * ny;
    const impulse = (bvn - avn) * getBounceFactor();
    a.vx += impulse * nx;
    a.vy += impulse * ny;
    b.vx -= impulse * nx;
    b.vy -= impulse * ny;
  }

  function resolveAttackRange(a, b) {
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const dist = Math.hypot(dx, dy);
    const attackDist = a.attackRange + b.attackRange;
    if (dist >= attackDist) return;

    applyCollisionDamage(a, b);
  }

  function applyCollisionDamage(a, b) {
    if (a.invincible > 0 || b.invincible > 0 || battleState !== "running") return;

    const relativeSpeed = Math.hypot(a.vx - b.vx, a.vy - b.vy);
    const speedFactor = Math.max(0.5, relativeSpeed / 12);
    const damageToA = Math.max(1, Math.round(b.damage * speedFactor));
    const damageToB = Math.max(1, Math.round(a.damage * speedFactor));

    a.hp = Math.max(0, a.hp - damageToA);
    b.hp = Math.max(0, b.hp - damageToB);
    a.invincible = a.hitCooldown;
    b.invincible = b.hitCooldown;
    hitCount++;
    message = "碰撞！双方扣血";

    addDamageText(a, damageToA);
    addDamageText(b, damageToB);
    addHitParticles((a.x + b.x) / 2, (a.y + b.y) / 2);
    checkBattleResult();
    updateStats();
  }

  function addDamageText(fighter, damage) {
    damageTexts.push({
      x: fighter.x,
      y: fighter.y - fighter.radius - 12,
      text: "-" + damage,
      color: fighter.color,
      life: 46
    });
  }

  function addHitParticles(x, y) {
    for (let i = 0; i < 10; i++) {
      particles.push({
        x,
        y,
        vx: (Math.random() - .5) * 7,
        vy: (Math.random() - .5) * 7,
        life: 24
      });
    }
  }

  function checkBattleResult() {
    const alive = fighters.filter(fighter => fighter.hp > 0);
    if (alive.length === 1) {
      battleState = "ended";
      winner = alive[0];
      message = winner.name + " 胜利";
      stopFighters();
    } else if (alive.length === 0) {
      battleState = "ended";
      winner = null;
      message = "平局";
      stopFighters();
    }
  }

  function stopFighters() {
    for (const fighter of fighters) {
      fighter.vx = 0;
      fighter.vy = 0;
    }
  }

  /* ──────────── 状态与渲染 ──────────── */

  function updateStats() {
    ui.fighterANameStat.textContent = getRoleById(selectedRoleIds.a)?.name || "未选择";
    ui.fighterBNameStat.textContent = getRoleById(selectedRoleIds.b)?.name || "未选择";
    ui.fighterAHpStat.textContent = Math.max(0, Math.ceil(fighters[0].hp));
    ui.fighterBHpStat.textContent = Math.max(0, Math.ceil(fighters[1].hp));
    ui.hitStat.textContent = hitCount;
    ui.resultStat.textContent =
      battleState === "ready" ? "待开始" :
      battleState === "ended" ? message :
      battleState === "paused" ? "已暂停" :
      "对战中";
    ui.startBattle.textContent = battleState === "ended" ? "再战一局" : "开始对战";
    ui.toggleBattle.textContent = battleState === "paused" ? "继续" : "暂停";
    ui.toggleBattle.disabled = battleState === "ready" || battleState === "ended";
  }

  function update() {
    if (battleState !== "running") {
      return;
    }

    for (const fighter of fighters) {
      updateBall(fighter);
    }
    resolveAttackRange(fighters[0], fighters[1]);
    resolveBallCollision(fighters[0], fighters[1]);

    particles = particles.filter(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= .92;
      p.vy *= .92;
      p.life--;
      return p.life > 0;
    });

    damageTexts = damageTexts.filter(d => {
      d.y -= 0.8;
      d.life--;
      return d.life > 0;
    });
  }

  function drawRoundImage(img, x, y, r) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(img, x - r, y - r, r * 2, r * 2);
    ctx.restore();
  }

  function drawFighter(fighter) {
    ctx.save();
    ctx.globalAlpha = fighter.invincible > 0 && fighter.invincible % 6 < 3 ? 0.72 : 1;

    if (fighter.image) {
      drawRoundImage(fighter.image, fighter.x, fighter.y, fighter.radius);
    } else {
      ctx.fillStyle = fighter.color;
      ctx.beginPath();
      ctx.arc(fighter.x, fighter.y, fighter.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(5, 7, 13, .75)";
      ctx.beginPath();
      ctx.arc(fighter.x - fighter.radius * .28, fighter.y - fighter.radius * .18, fighter.radius * .12, 0, Math.PI * 2);
      ctx.arc(fighter.x + fighter.radius * .28, fighter.y - fighter.radius * .18, fighter.radius * .12, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(5, 7, 13, .7)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(fighter.x, fighter.y + fighter.radius * .15, fighter.radius * .32, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
    }

    ctx.globalAlpha = 1;
    ctx.strokeStyle = "#05070d";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(fighter.x, fighter.y, fighter.radius, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = "rgba(5, 7, 13, .72)";
    ctx.beginPath();
    ctx.arc(fighter.x + fighter.radius * .56, fighter.y + fighter.radius * .56, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#eef4ff";
    ctx.font = "800 13px Inter, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(fighter.id.toUpperCase(), fighter.x + fighter.radius * .56, fighter.y + fighter.radius * .56 + 5);
    ctx.restore();
  }

  function drawHealthBar(fighter) {
    const width = Math.max(70, fighter.radius * 2.25);
    const height = 10;
    const x = fighter.x - width / 2;
    const y = fighter.y - fighter.radius - 30;
    const ratio = Math.max(0, fighter.hp / fighter.maxHp);

    ctx.fillStyle = "rgba(5, 7, 13, .8)";
    ctx.fillRect(x, y, width, height);
    ctx.fillStyle = ratio > .45 ? "#47d18c" : ratio > .2 ? "#ffd166" : "#ff4d6d";
    ctx.fillRect(x, y, width * ratio, height);
    ctx.strokeStyle = "#05070d";
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, width, height);

    ctx.fillStyle = "#eef4ff";
    ctx.font = "700 16px ui-monospace, Consolas, monospace";
    ctx.textAlign = "center";
    ctx.fillText(Math.ceil(fighter.hp), fighter.x, y - 6);
  }

  function drawTarget() {
    const x = 680;
    const y = 470;
    for (let i = 4; i > 0; i--) {
      ctx.beginPath();
      ctx.arc(x, y, i * 10, 0, Math.PI * 2);
      ctx.fillStyle = i % 2 ? "#fff" : "#e11d48";
      ctx.fill();
      ctx.strokeStyle = "#111827";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#0b8ed8";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "rgba(255,255,255,.035)";
    for (let x = 0; x < canvas.width; x += 40) {
      ctx.fillRect(x, 0, 1, canvas.height);
      ctx.fillRect(0, x, canvas.width, 1);
    }

    ctx.fillStyle = "#05070d";
    for (const wall of walls) {
      ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
    }

    if (ui.levelType.value === "target") {
      drawTarget();
    }

    for (const fighter of fighters) {
      if (fighter.hp > 0) {
        drawFighter(fighter);
        drawHealthBar(fighter);
      }
    }

    for (const fighter of fighters) {
      if (fighter.hp > 0) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(fighter.x, fighter.y, fighter.attackRange, 0, Math.PI * 2);
        ctx.strokeStyle = fighter.color;
        ctx.globalAlpha = 0.25;
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.stroke();
        ctx.restore();
      }
    }

    for (const p of particles) {
      ctx.globalAlpha = p.life / 24;
      ctx.fillStyle = "#fff1a8";
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    for (const d of damageTexts) {
      ctx.globalAlpha = d.life / 46;
      ctx.fillStyle = d.color;
      ctx.font = "800 24px ui-monospace, Consolas, monospace";
      ctx.textAlign = "center";
      ctx.fillText(d.text, d.x, d.y);
      ctx.globalAlpha = 1;
    }

    ctx.fillStyle = "rgba(5, 7, 13, .72)";
    ctx.fillRect(24, 24, 260, 44);
    ctx.fillStyle = "#eef4ff";
    ctx.font = "700 18px Inter, system-ui, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(message, 42, 52);

    if (battleState === "ended") {
      ctx.fillStyle = "rgba(5, 7, 13, .82)";
      ctx.fillRect(250, 360, 300, 80);
      ctx.strokeStyle = winner ? winner.color : "#ffd166";
      ctx.lineWidth = 3;
      ctx.strokeRect(250, 360, 300, 80);
      ctx.fillStyle = "#eef4ff";
      ctx.font = "800 30px Inter, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(message, 400, 410);
    }
  }

  function loop() {
    update();
    render();
    updateStats();
    requestAnimationFrame(loop);
  }

  /* ──────────── 事件绑定 ──────────── */

  const app = document.querySelector(".app");
  const goSettings = document.getElementById("goSettings");
  const backToGame = document.getElementById("backToGame");

  function showView(view) {
    app.dataset.view = view;
  }

  // 主页面角色选择
  ui.roleSelectA.addEventListener("change", () => applyRoleToSide("a", ui.roleSelectA.value));
  ui.roleSelectB.addEventListener("change", () => applyRoleToSide("b", ui.roleSelectB.value));

  // 角色库列表操作
  ui.roleLibraryList.addEventListener("click", event => {
    const button = event.target.closest("button[data-action]");
    if (!button) return;
    handleRoleAction(button.dataset.action, button.dataset.roleId);
  });

  // 角色编辑页
  ui.editRoleImage.addEventListener("change", () => {
    readImageFile(ui.editRoleImage, ({ imageDataUrl, image }) => {
      editRoleImageDraft = { imageDataUrl, image };
    });
  });
  ui.saveEditedRole.addEventListener("click", saveEditedRole);
  ui.cancelEditRole.addEventListener("click", closeRoleEditPage);
  ui.deleteEditedRole.addEventListener("click", deleteEditedRole);
  ui.backToLibrary.addEventListener("click", closeRoleEditPage);

  // 编辑页滑块实时更新
  const editSliders = ["editRoleHp", "editRoleRadius", "editRoleSpeed", "editRoleDamage", "editRoleHitCooldown", "editRoleAttackRange"];
  for (const key of editSliders) {
    ui[key].addEventListener("input", () => {
      valueLabels[key].textContent = ui[key].value;
    });
  }

  // 设置子导航
  document.querySelector(".settings-nav").addEventListener("click", event => {
    const btn = event.target.closest("[data-subview]");
    if (!btn) return;
    const subview = btn.dataset.subview;

    document.querySelectorAll(".settings-nav-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    document.querySelector(".settings-panel").dataset.subview = subview;
  });

  // 游戏控制
  ui.startBattle.addEventListener("click", startBattle);
  ui.reset.addEventListener("click", prepareGame);
  ui.levelType.addEventListener("change", prepareGame);
  ui.toggleBattle.addEventListener("click", () => {
    if (battleState !== "running" && battleState !== "paused") return;
    battleState = battleState === "paused" ? "running" : "paused";
    message = battleState === "paused" ? "已暂停" : "继续对战";
    updateStats();
  });

  goSettings.addEventListener("click", () => {
    if (battleState === "running") {
      battleState = "paused";
      message = "已暂停";
      updateStats();
    }
    showView("settings");
    renderRoleLibraryList();
  });

  backToGame.addEventListener("click", () => {
    showView("game");
  });

  // 全局参数同步
  ui.useBounceLoss.addEventListener("change", syncConfig);
  ui.bounce.addEventListener("input", syncConfig);

  /* ──────────── 初始化 ──────────── */

  roleLibrary = loadRoleLibrary();
  renderRoleLibraryList();
  renderRoleSelects();
  applyRoleToSide("a", selectedRoleIds.a);
