<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的服药提醒 - 银发就医小棉袄</title>
  <link rel="stylesheet" href="../../shared/css/variables.css">
  <link rel="stylesheet" href="../../shared/css/base.css">
  <link rel="stylesheet" href="../../shared/css/components.css">
  <link rel="stylesheet" href="../../shared/css/animations.css">
  <link rel="stylesheet" href="../../shared/css/app-layout.css">
</head>
<body class="theme-accessible">
  <div class="page">
    <nav class="navbar">
      <button class="navbar-back" onclick="goBack()">← 返回</button>
      <span class="navbar-title">我的服药提醒</span>
    </nav>

    <!-- 时效性声明 -->
    <div class="disclaimer-banner">
      本提醒基于6月27日心内科就诊医嘱生成
    </div>

    <main class="page-content has-tab-bar" style="padding-top: var(--space-md);">

      <!-- 今日用药状态卡片 -->
      <div class="card">
        <div class="card-header">今日用药状态</div>
        <div class="card-body">
          <p style="font-size: var(--font-m); margin-bottom: var(--space-sm);" id="todayProgress">服药进度：已服用 0/2 种药</p>
          <div class="progress-bar" style="margin-bottom: var(--space-md);">
            <div class="progress-fill" id="todayProgressFill" style="width: 0%;"></div>
          </div>
          <div id="todayDrugsStatus"></div>
        </div>
      </div>

      <!-- 今日用药列表 -->
      <div class="card">
        <div class="card-header">2026年6月27日 周六</div>
        <div class="card-body">
          <div class="card-row" style="flex-wrap: wrap;" id="drugRow1">
            <span style="flex: 1;">美托洛尔（倍他乐克）25mg 半片</span>
            <label class="toggle-switch">
              <input type="checkbox" id="drugToggle1" onchange="onDrugToggle('drugToggle1', '美托洛尔')">
              <span class="slider"></span>
            </label>
            <div style="width: 100%;" id="drugStatus1"></div>
          </div>
          <div class="card-row" style="flex-wrap: wrap; padding-top: var(--space-sm);" id="drugRow2">
            <span style="flex: 1;">阿托伐他汀（立普妥）20mg 1片</span>
            <label class="toggle-switch">
              <input type="checkbox" id="drugToggle2" onchange="onDrugToggle('drugToggle2', '阿托伐他汀')">
              <span class="slider"></span>
            </label>
            <div style="width: 100%;" id="drugStatus2"></div>
          </div>
        </div>
      </div>

      <!-- 用药规则卡片 -->
      <div class="card">
        <div class="card-header">用药规则</div>
        <div class="card-body">
          <div class="card-row"><span>⏰ 阿托伐他汀需睡前服用</span></div>
          <div class="card-row"><span>🚫 避免与西柚汁同服</span></div>
          <div class="card-row"><span>🍽️ 二甲双胍需随餐服用</span></div>
        </div>
      </div>

      <!-- 历史服药记录 -->
      <div class="card">
        <div class="card-header">历史记录</div>
        <div class="card-body" id="historySection">
          <!-- 动态渲染 -->
        </div>
      </div>

      <!-- 每周统计 -->
      <div class="card">
        <div class="card-header">周统计</div>
        <div class="card-body">
          <p style="font-size: var(--font-m); margin-bottom: var(--space-sm);" id="weeklyStat">本周服药率：85%（12/14）</p>
          <div class="progress-bar">
            <div class="progress-fill safe" id="weeklyBar" style="width: 85%;"></div>
          </div>
        </div>
      </div>

    </main>

    <nav class="tab-bar">
      <a class="tab-item active" href="me_home.html">
        <span class="tab-icon">❤️</span>
        <span class="tab-label">健康</span>
      </a>
      <a class="tab-item" href="me_diagnosis.html">
        <span class="tab-icon">🏥</span>
        <span class="tab-label">就医</span>
      </a>
      <a class="tab-item" href="../family/family_home.html">
        <span class="tab-icon">👨‍👩‍👧</span>
        <span class="tab-label">亲人</span>
      </a>
      <a class="tab-item" href="me_profile.html">
        <span class="tab-icon">👤</span>
        <span class="tab-label">我的</span>
      </a>
    </nav>
  </div>

  <script src="../../shared/js/mock-data.js"></script>
  <script src="../../shared/js/storage.js"></script>
  <script src="../../shared/js/navigation.js"></script>
  <script src="../../shared/js/theme.js"></script>
  <script src="../../shared/js/utils.js"></script>
  <script>
    initMockData();

    // 今日目标药物（从最新就诊记录获取）
    var todayDrugs = ['美托洛尔', '阿托伐他汀'];

    // 加载今日用药状态
    function loadTodayDrugs() {
      var today = getTodayStr();
      var logs = getMedicationLogs();
      var todayLogs = logs.filter(function(l) { return l.date === today; });

      var takenCount = 0;
      var statusHtml = '';

      todayDrugs.forEach(function(drug, idx) {
        var toggleId = 'drugToggle' + (idx + 1);
        var statusId = 'drugStatus' + (idx + 1);
        var toggle = document.getElementById(toggleId);
        var statusEl = document.getElementById(statusId);

        var drugLog = todayLogs.find(function(l) { return l.drug === drug && l.status === 'taken'; });

        if (drugLog) {
          toggle.checked = true;
          takenCount++;
          var sourceTag = drugLog.source === 'voice' ? ' 🎤 语音记录' : '';
          statusEl.innerHTML = '<span class="text-safe" style="font-size: var(--font-s);">✅ ' + drugLog.time + ' 已服用' + sourceTag + '</span>';
        } else {
          toggle.checked = false;
          statusEl.innerHTML = '<span class="text-danger" style="font-size: var(--font-s);">❌ 待服用</span>';
        }
      });

      // 更新进度
      var total = todayDrugs.length;
      document.getElementById('todayProgress').textContent = '服药进度：已服用 ' + takenCount + '/' + total + ' 种药';
      var percent = Math.round((takenCount / total) * 100);
      document.getElementById('todayProgressFill').style.width = percent + '%';
    }

    // 服药开关切换
    function onDrugToggle(toggleId, drugName) {
      var toggle = document.getElementById(toggleId);
      var status = toggle.checked ? 'taken' : 'untaken';
      var today = getTodayStr();
      var time = getNowTimeStr();

      var logs = getMedicationLogs();

      if (status === 'untaken') {
        logs = logs.filter(function(l) {
          return !(l.date === today && l.drug === drugName && l.status === 'taken');
        });
        saveMedicationLogs(logs);
      } else {
        logs = logs.filter(function(l) {
          return !(l.date === today && l.drug === drugName);
        });
        logs.unshift({
          date: today,
          time: time,
          drug: drugName,
          status: 'taken',
          source: 'manual'
        });
        saveMedicationLogs(logs);
      }

      // 重新加载显示
      loadTodayDrugs();
    }

    // 加载历史记录
    function loadHistory() {
      var logs = getMedicationLogs();
      var today = getTodayStr();

      // 按日期分组（排除今天）
      var grouped = {};
      logs.forEach(function(l) {
        if (l.date === today) return;
        if (!grouped[l.date]) grouped[l.date] = [];
        grouped[l.date].push(l);
      });

      var dates = Object.keys(grouped).sort(function(a, b) { return b.localeCompare(a); });
      var html = '';

      // 取最近5天
      dates.slice(0, 5).forEach(function(date) {
        var weekday = getWeekday(date);
        var dateLabel = formatDate(date) + ' ' + weekday;
        html += '<div style="margin-bottom: var(--space-sm);">';
        html += '<p class="text-s" style="font-weight: 600; margin-bottom: var(--space-xs);">' + dateLabel + '</p>';

        grouped[date].forEach(function(log) {
          var icon = log.status === 'taken' ? '✅' : '❌';
          var statusText = log.status === 'taken' ? '已服用' : '未服用';
          html += '<div class="card-row"><span>' + icon + ' ' + log.time + ' ' + log.drug + ' ' + statusText + '</span></div>';
        });

        html += '</div>';
      });

      document.getElementById('historySection').innerHTML = html || '<p class="text-weak">暂无历史记录</p>';
    }

    // 加载周统计
    function loadWeeklyStats() {
      var logs = getMedicationLogs();
      var today = new Date();
      var totalExpected = 0;
      var totalTaken = 0;

      // 最近7天
      for (var i = 0; i < 7; i++) {
        var d = new Date(today);
        d.setDate(d.getDate() - i);
        var dateStr = d.getFullYear() + '-' +
          String(d.getMonth() + 1).padStart(2, '0') + '-' +
          String(d.getDate()).padStart(2, '0');

        // 每天预期 2 种药
        totalExpected += 2;

        var dayLogs = logs.filter(function(l) { return l.date === dateStr && l.status === 'taken'; });
        // 去重（同一天同一药品只算一次）
        var takenDrugs = {};
        dayLogs.forEach(function(l) { takenDrugs[l.drug] = true; });
        totalTaken += Object.keys(takenDrugs).length;
      }

      var rate = totalExpected > 0 ? Math.round((totalTaken / totalExpected) * 100) : 0;
      document.getElementById('weeklyStat').textContent = '本周服药率：' + rate + '%（' + totalTaken + '/' + totalExpected + '）';
      document.getElementById('weeklyBar').style.width = rate + '%';
    }

    // 初始化
    loadTodayDrugs();
    loadHistory();
    loadWeeklyStats();
  </script>
</body>
</html>
