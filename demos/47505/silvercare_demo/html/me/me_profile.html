<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的 - 银发就医小棉袄</title>
  <link rel="stylesheet" href="../../shared/css/variables.css">
  <link rel="stylesheet" href="../../shared/css/base.css">
  <link rel="stylesheet" href="../../shared/css/components.css">
  <link rel="stylesheet" href="../../shared/css/animations.css">
  <link rel="stylesheet" href="../../shared/css/app-layout.css">
  <link rel="stylesheet" href="../../shared/css/toast.css">
</head>
<body class="theme-accessible">
  <div class="page">
    <nav class="navbar">
      <span class="navbar-title">我的</span>
    </nav>

    <main class="page-content has-tab-bar">

      <!-- 个人资料卡片 -->
      <div class="profile-card" onclick="showToast('个人资料编辑 - 概念演示', 'info')">
        <div class="profile-avatar">张</div>
        <div class="profile-info">
          <div class="profile-name">张秀兰</div>
          <div class="profile-meta">72岁 · 四川话</div>
        </div>
        <span class="profile-arrow">→</span>
      </div>

      <!-- 设置组1：健康管理 -->
      <div class="settings-group">
        <div class="settings-item" onclick="openDrugQuery()">
          <span class="settings-icon">💊</span>
          <span class="settings-label">药物信息查询</span>
          <span class="settings-arrow">→</span>
        </div>
        <a class="settings-item" href="../family/family_home.html">
          <span class="settings-icon">👨‍👩‍👧</span>
          <span class="settings-label">我的亲人管理</span>
          <span class="settings-value">4位亲人</span>
          <span class="settings-arrow">→</span>
        </a>
        <a class="settings-item" href="me_share.html">
          <span class="settings-icon">📤</span>
          <span class="settings-label">分享管理</span>
          <span class="settings-arrow">→</span>
        </a>
      </div>

      <!-- 设置组2：显示与安全 -->
      <div class="settings-group">
        <div class="settings-item" onclick="openThemeModal()">
          <span class="settings-icon">🎨</span>
          <span class="settings-label">显示模式</span>
          <span class="settings-value" id="themeModeLabel">适老模式</span>
          <span class="settings-arrow">→</span>
        </div>
        <div class="settings-item" onclick="showToast('账户安全 - 概念演示', 'info')">
          <span class="settings-icon">🔒</span>
          <span class="settings-label">账户安全</span>
          <span class="settings-arrow">→</span>
        </div>
      </div>

      <!-- 设置组3：其他 -->
      <div class="settings-group">
        <a class="settings-item" href="../common/common_privacy.html">
          <span class="settings-icon">📄</span>
          <span class="settings-label">隐私政策</span>
          <span class="settings-arrow">→</span>
        </a>
        <div class="settings-item" onclick="showToast('银发就医小棉袄 Demo V3.0 · 2026-06-28', 'info')">
          <span class="settings-icon">ℹ️</span>
          <span class="settings-label">关于我们</span>
          <span class="settings-value">V3.0</span>
          <span class="settings-arrow">→</span>
        </div>
      </div>

      <!-- 设置组4：退出登录 -->
      <div class="settings-group">
        <div class="settings-item danger" onclick="showToast('退出登录 - 概念演示', 'warning')">
          <span class="settings-icon">🚪</span>
          <span class="settings-label">退出登录</span>
          <span class="settings-arrow">→</span>
        </div>
      </div>

    </main>

    <!-- 底部标签栏 -->
    <nav class="tab-bar">
      <a class="tab-item" href="me_home.html">
        <span class="tab-icon">❤️</span>
        <span class="tab-label">健康</span>
      </a>
      <a class="tab-item" href="me_diagnosis.html">
        <span class="tab-icon">🏥</span>
        <span class="tab-label">就医</span>
      </a>
      <a class="tab-item" href="../family/family_home.html">
        <span class="tab-icon">👨‍👩‍👧</span>
        <span class="tab-label">亲人</span>
      </a>
      <a class="tab-item active" href="me_profile.html">
        <span class="tab-icon">👤</span>
        <span class="tab-label">我的</span>
      </a>
    </nav>
  </div>

  <!-- 显示模式切换弹窗 -->
  <div class="modal-overlay" id="themeModal" style="display: none;">
    <div class="modal">
      <div class="modal-title">选择显示模式</div>
      <div class="theme-switcher">
        <button class="theme-btn active" data-theme="accessible" onclick="switchThemeFromModal('accessible')">适老模式</button>
        <button class="theme-btn" data-theme="standard" onclick="switchThemeFromModal('standard')">标准模式</button>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeThemeModal()">取消</button>
      </div>
    </div>
  </div>

  <!-- ===== 药物查询底部抽屉 ===== -->
  <div class="modal-overlay" id="drugQueryModal" style="display: none;">
    <div class="drug-drawer">
      <div class="drug-drawer-header">
        <span class="drug-drawer-title">💊 药物信息查询</span>
        <button class="drug-drawer-close" onclick="closeDrugQuery()">✕</button>
      </div>
      <div class="drug-drawer-body">
        <div class="drug-search-bar">
          <input type="text" class="drug-search-input" id="drugSearchInput" placeholder="输入药品名称，或点击下方语音输入">
          <button class="drug-search-voice" onclick="showToast('语音输入药品名 - 概念演示', 'info')">🎤</button>
        </div>
        <div class="drug-result" id="drugResult">
          <div class="drug-result-placeholder">
            <div class="drug-result-icon">🔍</div>
            <div>输入药品名称查询</div>
            <div class="text-s text-weak">支持查询药品通用名、商品名、用法用量</div>
          </div>
        </div>
        <div class="drug-quick-list">
          <div class="text-s text-secondary" style="margin-bottom: 8px;">常用药品：</div>
          <button class="drug-tag" onclick="searchDrug('美托洛尔')">美托洛尔（倍他乐克）</button>
          <button class="drug-tag" onclick="searchDrug('阿托伐他汀')">阿托伐他汀（立普妥）</button>
          <button class="drug-tag" onclick="searchDrug('二甲双胍')">二甲双胍（格华止）</button>
          <button class="drug-tag" onclick="searchDrug('拜新同')">拜新同（硝苯地平）</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../shared/js/mock-data.js"></script>
  <script src="../../shared/js/storage.js"></script>
  <script src="../../shared/js/navigation.js"></script>
  <script src="../../shared/js/theme.js"></script>
  <script src="../../shared/js/utils.js"></script>
  <script src="../../shared/js/toast.js"></script>
  <script>
    initMockData();

    // 初始化主题显示
    (function() {
      var theme = getCurrentTheme();
      var label = theme === 'standard' ? '标准模式' : '适老模式';
      document.getElementById('themeModeLabel').textContent = label;
    })();

    // 打开主题弹窗
    function openThemeModal() {
      var modal = document.getElementById('themeModal');
      modal.style.display = 'flex';
      var currentTheme = getCurrentTheme();
      var btns = modal.querySelectorAll('.theme-btn');
      btns.forEach(function(btn) {
        if (btn.getAttribute('data-theme') === currentTheme) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    // 关闭主题弹窗
    function closeThemeModal() {
      document.getElementById('themeModal').style.display = 'none';
    }

    // 从弹窗切换主题
    function switchThemeFromModal(mode) {
      switchTheme(mode);
      var label = mode === 'standard' ? '标准模式' : '适老模式';
      document.getElementById('themeModeLabel').textContent = label;
      closeThemeModal();
    }

    // 点击弹窗遮罩关闭
    document.getElementById('themeModal').addEventListener('click', function(e) {
      if (e.target === this) closeThemeModal();
    });

    // ===== 药物查询 =====
    function openDrugQuery() {
      document.getElementById('drugQueryModal').style.display = 'flex';
      document.getElementById('drugSearchInput').focus();
    }

    function closeDrugQuery() {
      document.getElementById('drugQueryModal').style.display = 'none';
      document.getElementById('drugResult').innerHTML = '<div class="drug-result-placeholder"><div class="drug-result-icon">🔍</div><div>输入药品名称查询</div><div class="text-s text-weak">支持查询药品通用名、商品名、用法用量</div></div>';
      document.getElementById('drugSearchInput').value = '';
    }

    function searchDrug(name) {
      document.getElementById('drugSearchInput').value = name;
      var mockData = {
        '美托洛尔': { generic: '美托洛尔', brand: '倍他乐克', usage: '25mg，每日2次，半片', note: '用于高血压、冠心病。需监测心率。', category: 'β受体阻滞剂' },
        '阿托伐他汀': { generic: '阿托伐他汀', brand: '立普妥', usage: '20mg，每日1次，1片（睡前服用）', note: '用于高胆固醇血症。避免与西柚汁同服。', category: '他汀类降脂药' },
        '二甲双胍': { generic: '二甲双胍', brand: '格华止', usage: '500mg，每日2次，1片（随餐服用）', note: '用于2型糖尿病。需随餐服用以减少胃肠道反应。', category: '双胍类降糖药' },
        '拜新同': { generic: '硝苯地平', brand: '拜新同', usage: '30mg，每日1次，1粒', note: '用于高血压。整粒吞服，不可嚼碎。', category: '钙通道阻滞剂' }
      };
      var data = mockData[name];
      if (data) {
        document.getElementById('drugResult').innerHTML =
          '<div class="drug-info-card">' +
          '<div class="drug-info-name">' + data.generic + '</div>' +
          '<div class="drug-info-brand">商品名：' + data.brand + ' | ' + data.category + '</div>' +
          '<div class="drug-info-usage"><strong>用法用量：</strong>' + data.usage + '</div>' +
          '<div class="drug-info-note"><strong>注意事项：</strong>' + data.note + '</div>' +
          '<div class="disclaimer-banner" style="margin-top: 12px; border-radius: 8px;">⚠️ 概念演示 · 仅供参考 · 请遵医嘱</div>' +
          '</div>';
      } else {
        showToast('未找到该药品信息（概念演示）', 'warning');
      }
    }

    document.getElementById('drugQueryModal').addEventListener('click', function(e) {
      if (e.target === this) closeDrugQuery();
    });

    document.getElementById('drugSearchInput').addEventListener('input', function(e) {
      var val = e.target.value.trim();
      if (val) searchDrug(val);
    });
  </script>
</body>
</html>
