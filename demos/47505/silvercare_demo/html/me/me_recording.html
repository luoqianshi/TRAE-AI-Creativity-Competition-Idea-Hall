<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>就诊录音 - 银发就医小棉袄</title>
  <link rel="stylesheet" href="../../shared/css/variables.css">
  <link rel="stylesheet" href="../../shared/css/base.css">
  <link rel="stylesheet" href="../../shared/css/components.css">
  <link rel="stylesheet" href="../../shared/css/animations.css">
</head>
<body class="theme-accessible">
  <div class="page">
    <nav class="navbar">
      <button class="navbar-back" onclick="goBack()">← 返回</button>
      <span class="navbar-title">就诊录音</span>
    </nav>

    <main class="page-content">

      <!-- 录音状态区域 -->
      <div style="text-align:center; padding: var(--space-xxl) 0 var(--space-md);">
        <button class="btn-record" id="recordBtn" onclick="onRecordClick()">
          <span class="record-icon" id="recordIcon">🎙️</span>
          <span class="record-label" id="recordLabel">点击开始录音</span>
        </button>
        <p class="text-s" id="recordDuration" style="margin-top: var(--space-sm); display: none;"></p>
      </div>

      <!-- 处理中进度条（默认隐藏） -->
      <div id="processingSection" style="display: none;">
        <div class="card">
          <div class="card-header">处理进度</div>
          <div class="card-body">
            <div style="margin-bottom: var(--space-md);">
              <div style="display: flex; justify-content: space-between; margin-bottom: var(--space-xs);">
                <span>ASR 转写</span>
                <span class="text-weak" id="step1Percent">0%</span>
              </div>
              <div class="progress-bar">
                <div class="progress-fill" id="step1Fill" style="width: 0%;"></div>
              </div>
            </div>
            <div style="margin-bottom: var(--space-md);">
              <div style="display: flex; justify-content: space-between; margin-bottom: var(--space-xs);">
                <span>结构化提取</span>
                <span class="text-weak" id="step2Percent">0%</span>
              </div>
              <div class="progress-bar">
                <div class="progress-fill" id="step2Fill" style="width: 0%;"></div>
              </div>
            </div>
            <div>
              <div style="display: flex; justify-content: space-between; margin-bottom: var(--space-xs);">
                <span>安全分级</span>
                <span class="text-weak" id="step3Percent">0%</span>
              </div>
              <div class="progress-bar">
                <div class="progress-fill safe" id="step3Fill" style="width: 0%;"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 完成后的操作按钮（默认隐藏） -->
      <div id="doneSection" style="display: none; padding: var(--space-md) 0;">
        <button class="btn-primary" onclick="navigateTo('me_summary.html')">查看就诊摘要</button>
        <div style="height: var(--space-sm);"></div>
        <button class="btn-secondary" onclick="resetAll()">重新录音</button>
      </div>

    </main>
  </div>

  <script src="../../shared/js/mock-data.js"></script>
  <script src="../../shared/js/storage.js"></script>
  <script src="../../shared/js/navigation.js"></script>
  <script src="../../shared/js/theme.js"></script>
  <script src="../../shared/js/utils.js"></script>
  <script src="../../shared/js/demo-recording.js"></script>
  <script>
    initMockData();

    var recordBtn = document.getElementById('recordBtn');
    var recordIcon = document.getElementById('recordIcon');
    var recordLabel = document.getElementById('recordLabel');
    var recordDuration = document.getElementById('recordDuration');
    var processingSection = document.getElementById('processingSection');
    var doneSection = document.getElementById('doneSection');

    var step1Fill = document.getElementById('step1Fill');
    var step2Fill = document.getElementById('step2Fill');
    var step3Fill = document.getElementById('step3Fill');
    var step1Percent = document.getElementById('step1Percent');
    var step2Percent = document.getElementById('step2Percent');
    var step3Percent = document.getElementById('step3Percent');

    function onRecordClick() {
      var state = getRecordingState();
      if (state === 'idle') {
        startRecording(stateChangeCallback);
      }
    }

    function stateChangeCallback(state, seconds, step) {
      if (state === 'recording') {
        // 录音中
        recordBtn.classList.add('recording');
        recordBtn.classList.add('animate-pulse-record');
        recordBtn.classList.remove('animate-ripple');
        recordIcon.textContent = '🎙️';
        recordLabel.textContent = '录音中...';
        recordDuration.style.display = 'block';
        recordDuration.textContent = formatRecordingTime(seconds);
        processingSection.style.display = 'none';
        doneSection.style.display = 'none';
      } else if (state === 'processing') {
        // 处理中
        recordBtn.classList.remove('recording');
        recordBtn.classList.remove('animate-pulse-record');
        recordBtn.classList.add('animate-ripple');
        recordIcon.textContent = '⏳';
        recordLabel.textContent = '处理中...';
        recordDuration.style.display = 'none';
        processingSection.style.display = 'block';
        doneSection.style.display = 'none';

        // 更新三个进度条（6步，每步约1秒）
        // ASR 转写：最多 40%（前2步）
        var asrProgress = Math.min(step * 20, 40);
        // 结构化提取：最多 30%（第3-4步）
        var structProgress = Math.max(0, Math.min((step - 2) * 15, 30));
        // 安全分级：最多 30%（第5-6步）
        var safetyProgress = Math.max(0, Math.min((step - 4) * 15, 30));

        step1Fill.style.width = asrProgress + '%';
        step1Percent.textContent = asrProgress + '%';
        step2Fill.style.width = structProgress + '%';
        step2Percent.textContent = structProgress + '%';
        step3Fill.style.width = safetyProgress + '%';
        step3Percent.textContent = safetyProgress + '%';
      } else if (state === 'done') {
        // 完成
        recordBtn.classList.remove('recording');
        recordBtn.classList.remove('animate-pulse-record');
        recordBtn.classList.remove('animate-ripple');
        recordIcon.textContent = '✅';
        recordLabel.textContent = '录音完成';
        recordDuration.style.display = 'none';
        processingSection.style.display = 'none';
        doneSection.style.display = 'block';

        // 最终进度条填满
        step1Fill.style.width = '100%';
        step1Percent.textContent = '100%';
        step2Fill.style.width = '100%';
        step2Percent.textContent = '100%';
        step3Fill.style.width = '100%';
        step3Percent.textContent = '100%';
      } else {
        // idle
        recordBtn.classList.remove('recording');
        recordBtn.classList.remove('animate-pulse-record');
        recordBtn.classList.remove('animate-ripple');
        recordIcon.textContent = '🎙️';
        recordLabel.textContent = '点击开始录音';
        recordDuration.style.display = 'none';
        processingSection.style.display = 'none';
        doneSection.style.display = 'none';
      }
    }

    function resetAll() {
      resetRecording(stateChangeCallback);
    }
  </script>
</body>
</html>
