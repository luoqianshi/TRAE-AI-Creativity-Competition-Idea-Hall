<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelPal - AI 智能旅行规划助手</title>
    <style>
        :root {
            --primary: #FF6B35;
            --primary-light: #FF8B6B;
            --secondary: #4ECDC4;
            --bg: #FFF8F0;
            --bg2: #FFFFFF;
            --bg3: #F8F9FA;
            --text: #2D3436;
            --text-secondary: #636E72;
            --text-muted: #B2BEC3;
            --border: #E8E8E8;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --radius: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .header {
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
            color: var(--primary);
        }
        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .btn {
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg2);
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
        }
        .homepage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 60px);
            padding: 40px 20px;
            text-align: center;
        }
        .homepage.hidden { display: none; }
        .pet-container {
            margin-bottom: 24px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .pet-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary);
            box-shadow: 0 8px 30px rgba(255, 107, 53, 0.3);
        }
        .speech-bubble {
            background: var(--bg2);
            border-radius: var(--radius);
            padding: 16px 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            position: relative;
            max-width: 400px;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid var(--bg2);
        }
        .homepage-title {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .homepage-subtitle {
            color: var(--text-secondary);
            margin-bottom: 32px;
        }
        .input-section {
            max-width: 600px;
            width: 100%;
            margin-bottom: 24px;
        }
        .input-wrapper {
            display: flex;
            gap: 12px;
            padding: 8px;
            background: var(--bg2);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .input-field {
            flex: 1;
            padding: 12px 16px;
            border: none;
            outline: none;
            font-size: 15px;
            background: transparent;
        }
        .send-btn {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        .suggestions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .suggestion-chip {
            padding: 10px 20px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }
        .chat-layout {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .chat-layout.active { display: block; }
        .chat-section {
            background: var(--bg2);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 120px);
        }
        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            display: flex;
            gap: 12px;
        }
        .message-user { flex-direction: row-reverse; }
        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 14px;
        }
        .message-user .message-content {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
        }
        .message-ai .message-content {
            background: var(--bg3);
            border: 1px solid var(--border);
        }
        .message-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .quick-replies {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .quick-reply {
            padding: 8px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }
        .pref-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }
        .pref-option {
            padding: 12px;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
        }
        .pref-option.selected {
            border-color: var(--primary);
            background: #FFF5F0;
        }
        .confirm-btn {
            margin-top: 12px;
            padding: 10px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .plan-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
        }
        .plan-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .plan-emoji { font-size: 32px; }
        .plan-title { font-size: 18px; font-weight: 600; }
        .plan-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .plan-tag {
            padding: 4px 10px;
            background: var(--bg);
            border-radius: 6px;
            font-size: 12px;
        }
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px;
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1); }
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 12px;
        }
        @media (max-width: 768px) {
            .homepage-title { font-size: 32px; }
            .message-content { max-width: 85%; }
        }
    </style>
</head>

                <div class="logo-icon">🐾</div>

            <div style="display: flex; align-items: center; gap: 8px;">

                <span style="font-size: 12px; color: var(--text-secondary);">在线</span>
                <button class="btn" onclick="resetChat()">重新开始</button>
            </div>
        </div>
    </header>

                <div>
                    <h3 style="font-size: 16px; font-weight: 600;">小旅</h3>
                    <p style="font-size: 12px; color: var(--text-secondary);">AI 旅行助手</p>
                </div>
            </div>
            <div class="messages-container" id="messagesContainer"></div>
            <div style="padding: 16px 20px; border-top: 1px solid var(--border);">
                <div style="display: flex; gap: 12px;">
                    <input type="text" class="input-field" id="chatInput" placeholder="输入你的消息..." onkeypress="if(event.key==='Enter')sendChatMessage()" style="border: 2px solid var(--border); border-radius: 12px;">
                    <button class="send-btn" onclick="sendChatMessage()">➤</button>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">
        <p>🐾 TravelPal - AI 智能旅行规划助手</p>
    </div>
    <script>
        let chatStep = 'welcome';
        let userInfo = { groupSize: 0, budget: '', preferences: [], duration: '' };
        let messages = [];
        let isTyping = false;
        let selectedPrefs = [];
        const API_BASE = 'http://localhost:3001';
        const PET_IMG = document.getElementById('petAvatar').src;

        function sendHomepageMessage() {
            const input = document.getElementById('homepageInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            startChat(text);
        }

        function sendSuggestion(text) { startChat(text); }

        function startChat(text) {
            document.getElementById('homepage').classList.add('hidden');
            document.getElementById('chatLayout').classList.add('active');
            addMessage('user', text);
            chatStep = 'duration';
            callAI(text);
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || isTyping) return;
            input.value = '';
            addMessage('user', text);
            updateChatStep(text);
            callAI(text);
        }

        function updateChatStep(text) {
            if (chatStep === 'duration') { userInfo.duration = text; chatStep = 'group-size'; }
            else if (chatStep === 'group-size') { userInfo.groupSize = parseInt(text) || 2; chatStep = 'budget'; }
            else if (chatStep === 'budget') { userInfo.budget = text; chatStep = 'preferences'; }
        }

        async function callAI(text) {
            showTyping();
            try {
                const response = await fetch(API_BASE + '/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: messages.map(m => ({ role: m.role, content: m.content })), userInfo, shouldGeneratePlan: chatStep === 'generating' })
                });
                const data = await response.json();
                hideTyping();
                if (data.reply) addMessage('assistant', data.reply, data.travelPlans);
                if (data.travelPlans && data.travelPlans.length > 0) { chatStep = 'done'; showPlans(data.travelPlans); }
            } catch (error) {
                hideTyping();
                addMessage('assistant', '抱歉，出了点小问题，请稍后再试~ 🐾');
            }
        }

        function addMessage(role, content, plans) {
            const container = document.getElementById('messagesContainer');
            messages.push({ id: Date.now(), role, content, timestamp: Date.now() });
            const div = document.createElement('div');
            div.className = 'message message-' + role;
            const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            if (role === 'user') {
                div.innerHTML = '<div><div class="message-content"><div>' + escapeHtml(content) + '</div></div><div class="message-time">' + time + '</div></div>';
            } else {
                div.innerHTML = '<img src="' + PET_IMG + '" alt="小旅" class="message-avatar"><div><div class="message-content"><div>' + formatAI(content) + '</div></div>' + getQuickReplies() + '<div class="message-time">' + time + '</div></div>';
            }
            container.appendChild(div);
            scrollToBottom();
        }

        function formatAI(text) {
            text = text.replace(/<think>[\s\S]*?<\/think>/g, '');
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\n/g, '<br>');
            return text;
        }

        function getQuickReplies() {
            if (chatStep === 'duration') return '<div class="quick-replies"><div class="quick-reply" onclick="sendQuickReply(\'3天2夜\')">3天2夜</div><div class="quick-reply" onclick="sendQuickReply(\'5天4夜\')">5天4夜</div></div>';
            if (chatStep === 'group-size') return '<div class="quick-replies"><div class="quick-reply" onclick="sendQuickReply(\'1\')">1人</div><div class="quick-reply" onclick="sendQuickReply(\'2\')">2人</div><div class="quick-reply" onclick="sendQuickReply(\'4\')">家庭</div></div>';
            if (chatStep === 'budget') return '<div class="quick-replies"><div class="quick-reply" onclick="sendQuickReply(\'2000-3000\')">2000-3000</div><div class="quick-reply" onclick="sendQuickReply(\'3000-5000\')">3000-5000</div><div class="quick-reply" onclick="sendQuickReply(\'5000-8000\')">5000-8000</div></div>';
            if (chatStep === 'preferences') return '<div class="pref-grid"><div class="pref-option" onclick="togglePref(this,\'nature\')">🌿<div>自然风光</div></div><div class="pref-option" onclick="togglePref(this,\'city\')">🏙️<div>城市探索</div></div><div class="pref-option" onclick="togglePref(this,\'food\')">🍜<div>美食之旅</div></div><div class="pref-option" onclick="togglePref(this,\'culture\')">🏛️<div>文化古迹</div></div></div><button class="confirm-btn" onclick="confirmPrefs()">确认选择</button>';
            return '';
        }

        function sendQuickReply(value) { document.getElementById('chatInput').value = value; sendChatMessage(); }

        function togglePref(el, pref) {
            el.classList.toggle('selected');
            if (selectedPrefs.includes(pref)) selectedPrefs = selectedPrefs.filter(p => p !== pref);
            else selectedPrefs.push(pref);
        }

        function confirmPrefs() {
            const prefs = selectedPrefs.length > 0 ? selectedPrefs : ['综合旅行'];
            userInfo.preferences = prefs;
            chatStep = 'generating';
            addMessage('user', '我喜欢的旅行类型是：' + prefs.join('、') + '。请帮我生成旅行方案！');
            callAI('我喜欢的旅行类型是：' + prefs.join('、') + '。请帮我生成旅行方案！');
        }

        function showPlans(plans) {
            const container = document.getElementById('messagesContainer');
            const plansDiv = document.createElement('div');
            plans.forEach((plan, i) => {
                const card = document.createElement('div');
                card.className = 'plan-card';
                card.innerHTML = '<div class="plan-header"><span class="plan-emoji">' + (plan.emoji || '✈️') + '</span><div><div class="plan-title">' + (plan.title || '方案 ' + (i+1)) + '</div></div></div><div class="plan-tags"><span class="plan-tag">📍 ' + (plan.destination || '') + '</span><span class="plan-tag">⏱️ ' + (plan.duration || '') + '</span><span class="plan-tag">💰 ' + (plan.budget || '') + '</span></div>';
                plansDiv.appendChild(card);
            });
            container.appendChild(plansDiv);
            scrollToBottom();
        }

        function showTyping() {
            isTyping = true;
            const container = document.getElementById('messagesContainer');
            const typing = document.createElement('div');
            typing.id = 'typingIndicator';
            typing.className = 'message message-ai';
            typing.innerHTML = '<img src="' + PET_IMG + '" alt="小旅" class="message-avatar"><div class="message-content"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>';
            container.appendChild(typing);
            scrollToBottom();
        }

        function hideTyping() {
            isTyping = false;
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        function scrollToBottom() {
            const container = document.getElementById('messagesContainer');
            container.scrollTop = container.scrollHeight;
        }

        function resetChat() {
            chatStep = 'welcome';
            userInfo = { groupSize: 0, budget: '', preferences: [], duration: '' };
            messages = [];
            selectedPrefs = [];
            document.getElementById('messagesContainer').innerHTML = '';
            document.getElementById('chatLayout').classList.remove('active');
            document.getElementById('homepage').classList.remove('hidden');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
