<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智题库 SmartQuiz - AI智能刷题平台</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
      background-color: #0a0e27;
      color: #e0e0e0;
      min-height: 100vh;
      overflow-x: hidden;
    }
    #root { min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; padding: 0 16px; }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0e27; }
    ::-webkit-scrollbar-thumb { background: #1a1f4e; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0, 229, 255, 0.2); }
    
    /* Glass card */
    .glass-card {
      background: rgba(19, 24, 64, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 229, 255, 0.1);
      border-radius: 16px;
    }
    .glass-card:hover { border-color: rgba(0, 229, 255, 0.3); }
    
    /* Gradient text */
    .gradient-text {
      background: linear-gradient(135deg, #00e5ff, #b388ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    /* Animations */
    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 0 20px rgba(0, 229, 255, 0.3); }
      50% { box-shadow: 0 0 40px rgba(0, 229, 255, 0.6); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .animate-glow-pulse { animation: glow-pulse 2s ease-in-out infinite; }
    .animate-float { animation: float 3s ease-in-out infinite; }
    
    /* Canvas */
    #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    
    /* Layout */
    .page { position: relative; z-index: 10; padding-top: 56px; padding-bottom: 32px; }
    
    /* Navbar */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      background: rgba(19, 24, 64, 0.6); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.05); border-radius: 0;
      height: 56px; display: flex; align-items: center;
    }
    .navbar-content { max-width: 800px; margin: 0 auto; padding: 0 16px; width: 100%; display: flex; justify-content: space-between; align-items: center; }
    .nav-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .nav-logo-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, #00e5ff, #b388ff);
      display: flex; align-items: center; justify-content: center;
    }
    .nav-title { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: bold; color: #00e5ff; }
    .nav-links { display: flex; gap: 4px; }
    .nav-link {
      padding: 8px 12px; border-radius: 8px; font-size: 14px;
      color: #9ca3af; text-decoration: none; display: flex; align-items: center; gap: 6px;
      transition: all 0.2s;
    }
    .nav-link:hover { color: #fff; background: rgba(255,255,255,0.05); }
    .nav-link.active { color: #00e5ff; background: rgba(0, 229, 255, 0.1); }
    
    /* Home Page */
    .hero { text-align: center; padding-top: 48px; padding-bottom: 32px; }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 16px; border-radius: 9999px;
      background: rgba(19, 24, 64, 0.6); backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 229, 255, 0.1);
      margin-bottom: 24px; font-size: 14px; color: #00e5ff;
      animation: glow-pulse 2s ease-in-out infinite;
    }
    .hero h1 { font-family: 'Orbitron', sans-serif; font-size: 48px; font-weight: 900; margin-bottom: 16px; }
    .hero p { font-size: 18px; color: #9ca3af; max-width: 400px; margin: 0 auto 8px; }
    .hero p:last-of-type { font-size: 14px; color: #6b7280; }
    
    /* Stats */
    .stats { display: flex; gap: 24px; justify-content: center; margin-bottom: 40px; flex-wrap: wrap; }
    .stat-card {
      padding: 16px 24px; text-align: center; min-width: 100px;
      background: rgba(19, 24, 64, 0.6); backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 229, 255, 0.1); border-radius: 16px;
    }
    .stat-icon { margin-bottom: 4px; }
    .stat-value { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: bold; color: #fff; }
    .stat-label { font-size: 12px; color: #9ca3af; }
    
    /* Action Cards */
    .actions { display: flex; flex-direction: column; gap: 16px; max-width: 480px; margin: 0 auto; }
    .action-card {
      padding: 20px; display: flex; align-items: center; gap: 16px;
      background: rgba(19, 24, 64, 0.6); backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 107, 107, 0.3); border-radius: 16px;
      cursor: pointer; transition: all 0.2s; text-align: left;
    }
    .action-card:hover { transform: scale(1.02); border-color: rgba(255, 107, 107, 0.6); }
    .action-card.ai { border-color: rgba(179, 136, 255, 0.3); animation: glow-pulse 2s ease-in-out infinite; }
    .action-card.ai:hover { border-color: rgba(179, 136, 255, 0.6); }
    .action-card.category { border-color: rgba(0, 229, 255, 0.3); }
    .action-card.category:hover { border-color: rgba(0, 229, 255, 0.6); }
    .action-icon {
      width: 48px; height: 48px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255, 107, 107, 0.15);
    }
    .action-card.ai .action-icon { background: rgba(179, 136, 255, 0.15); }
    .action-card.category .action-icon { background: rgba(0, 229, 255, 0.15); }
    .action-content { flex: 1; }
    .action-title { font-weight: 600; color: #fff; font-size: 18px; margin-bottom: 4px; }
    .action-desc { font-size: 14px; color: #9ca3af; }
    .action-badge {
      font-size: 10px; padding: 2px 6px; border-radius: 4px;
      background: rgba(179, 136, 255, 0.2); color: #b388ff; font-weight: 500;
    }
    
    /* Category Page */
    .page-title { text-align: center; margin-bottom: 32px; }
    .page-title h2 { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: bold; color: #fff; margin-bottom: 8px; }
    .page-title p { font-size: 14px; color: #9ca3af; }
    
    /* Difficulty Selector */
    .difficulty-selector { display: flex; gap: 8px; justify-content: center; margin-bottom: 32px; }
    .difficulty-btn {
      padding: 8px 20px; border-radius: 9999px; font-size: 14px; font-weight: 500;
      border: 1px solid rgba(255,255,255,0.1); color: #9ca3af;
      cursor: pointer; transition: all 0.2s; background: transparent;
    }
    .difficulty-btn:hover { border-color: rgba(255,255,255,0.2); }
    .difficulty-btn.active-easy { color: #00e676; background: rgba(0, 230, 118, 0.1); border-color: rgba(0, 230, 118, 0.3); }
    .difficulty-btn.active-medium { color: #ffd740; background: rgba(255, 215, 64, 0.1); border-color: rgba(255, 215, 64, 0.3); }
    .difficulty-btn.active-hard { color: #ff6b6b; background: rgba(255, 107, 107, 0.1); border-color: rgba(255, 107, 107, 0.3); }
    
    /* Category Grid */
    .category-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; max-width: 600px; margin: 0 auto; }
    @media (max-width: 600px) { .category-grid { grid-template-columns: repeat(2, 1fr); } }
    .category-card {
      padding: 20px; text-align: center; cursor: pointer;
      background: rgba(19, 24, 64, 0.6); backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 229, 255, 0.1); border-radius: 16px;
      transition: all 0.3s;
    }
    .category-card:hover { transform: translateY(-4px) scale(1.05); }
    .category-icon { font-size: 32px; margin-bottom: 8px; }
    .category-name { color: #fff; font-weight: 500; font-size: 14px; margin-bottom: 4px; }
    .category-count { font-size: 12px; color: #6b7280; }
    
    /* AI Card */
    .ai-card {
      max-width: 400px; margin: 0 auto 24px; padding: 24px;
      background: rgba(19, 24, 64, 0.6); backdrop-filter: blur(12px);
      border: 1px solid rgba(179, 136, 255, 0.4); border-radius: 16px;
      cursor: pointer; text-align: center;
      animation: glow-pulse 2s ease-in-out infinite;
      transition: all 0.2s;
    }
    .ai-card:hover { transform: scale(1.02); border-color: rgba(179, 136, 255, 0.7); }
    .ai-card-icon {
      width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 12px;
      background: rgba(179, 136, 255, 0.15);
      display: flex; align-items: center; justify-content: center;
    }
    .ai-card h3 { color: #fff; font-weight: 600; font-size: 18px; margin-bottom: 8px; }
    .ai-card p { font-size: 12px; color: #9ca3af; }
    
    /* Quiz Page */
    .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .quiz-counter { font-size: 14px; color: #9ca3af; }
    .quiz-counter span { color: #00e5ff; font-family: 'Orbitron', sans-serif; }
    .quiz-actions { display: flex; align-items: center; gap: 16px; }
    .quiz-timer { display: flex; align-items: center; gap: 6px; font-size: 14px; color: #ffd740; font-family: 'Orbitron', sans-serif; }
    .submit-btn {
      padding: 6px 16px; border-radius: 8px; font-size: 14px; font-weight: 500;
      background: rgba(255, 107, 107, 0.15); color: #ff6b6b;
      border: 1px solid rgba(255, 107, 107, 0.3); cursor: pointer; transition: all 0.2s;
    }
    .submit-btn:hover { background: rgba(255, 107, 107, 0.25); }
    
    /* Progress Bar */
    .progress-bar { width: 100%; height: 4px; border-radius: 9999px; background: rgba(255,255,255,0.05); margin-bottom: 24px; overflow: hidden; }
    .progress-fill {
      height: 100%; border-radius: 9999px;
      background: linear-gradient(90deg, #00e5ff, #b388ff);
      transition: width 0.3s ease;
    }
    
    /* Question Card */
    .question-card {
      padding: 24px; margin-bottom: 16px;
      background: rgba(19, 24, 64, 0.6); backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 229, 255, 0.1); border-radius: 16px;
    }
    .question-tags { display: flex; gap: 8px; margin-bottom: 16px; }
    .question-tag {
      font-size: 12px; padding: 2px 8px; border-radius: 9999px;
    }
    .tag-category { background: rgba(0, 229, 255, 0.1); color: #00e5ff; }
    .tag-easy { background: rgba(0, 230, 118, 0.1); color: #00e676; }
    .tag-medium { background: rgba(255, 215, 64, 0.1); color: #ffd740; }
    .tag-hard { background: rgba(255, 107, 107, 0.1); color: #ff6b6b; }
    .question-text { font-size: 18px; color: #fff; font-weight: 500; line-height: 1.6; margin-bottom: 24px; }
    
    /* Options */
    .options { display: flex; flex-direction: column; gap: 12px; }
    .option {
      width: 100%; padding: 16px; border-radius: 12px; text-align: left;
      border: 1px solid rgba(255,255,255,0.1); background: transparent;
      cursor: pointer; display: flex; align-items: center; gap: 16px;
      transition: all 0.2s;
    }
    .option:hover { border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.05); }
    .option.selected { border-color: #00e5ff; background: rgba(0, 229, 255, 0.1); }
    .option-label {
      width: 32px; height: 32px; border-radius: 8px; display: flex;
      align-items: center; justify-content: center; font-size: 14px;
      font-weight: bold; font-family: 'Orbitron', sans-serif;
      background: rgba(255,255,255,0.05); color: #9ca3af;
      flex-shrink: 0;
    }
    .option.selected .option-label { background: #00e5ff; color: #0a0e27; }
    .option-text { font-size: 14px; color: #d1d5db; flex: 1; }
    .option.selected .option-text { color: #fff; }
    
    /* Quiz Navigation */
    .quiz-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
    .nav-btn {
      padding: 8px 16px; border-radius: 8px; font-size: 14px;
      color: #9ca3af; display: flex; align-items: center; gap: 6px;
      background: transparent; border: none; cursor: pointer; transition: all 0.2s;
    }
    .nav-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .nav-btn.primary { color: #00e5ff; }
    .nav-btn.primary:hover { background: rgba(0, 229, 255, 0.1); }
    .nav-btn.submit {
      background: #00e5ff; color: #0a0e27; font-weight: 500;
      padding: 8px 20px;
    }
    .nav-btn.submit:hover { background: rgba(0, 229, 255, 0.9); }
    .answered-count { font-size: 12px; color: #6b7280; }
    
    /* Result Page */
    .result-center { display: flex; flex-direction: column; align-items: center; }
    .score-ring { position: relative; margin-bottom: 24px; }
    .score-ring svg { transform: rotate(-90deg); }
    .score-ring circle {
      fill: none;
      stroke-width: 8;
      stroke-linecap: round;
    }
    .score-ring .bg { stroke: rgba(255,255,255,0.05); }
    .score-ring .fill { transition: stroke-dashoffset 1.5s ease-out; }
    .score-ring .score {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center;
    }
    .score-value { font-family: 'Orbitron', sans-serif; font-size: 48px; font-weight: 900; }
    .score-label { font-size: 14px; color: #9ca3af; }
    
    .result-title { font-size: 20px; font-weight: bold; color: #fff; margin-bottom: 4px; }
    .result-subtitle { font-size: 14px; color: #9ca3af; margin-bottom: 24px; }
    
    /* Stats Cards */
    .result-stats { display: flex; gap: 16px; width: 100%; max-width: 480px; margin-bottom: 32px; flex-wrap: wrap; justify-content: center; }
    .result-stat {
      flex: 1; min-width: 80px; padding: 16px; text-align: center;
      background: rgba(19, 24, 64, 0.6); backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 230, 118, 0.2); border-radius: 16px;
    }
    .result-stat.wrong { border-color: rgba(255, 107, 107, 0.2); }
    .result-stat.unanswered { border-color: rgba(107, 114, 128, 0.2); }
    .result-stat-icon { margin-bottom: 4px; }
    .result-stat-value { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: bold; }
    .result-stat-label { font-size: 12px; color: #9ca3af; }
    
    /* AI Analysis */
    .ai-analysis {
      width: 100%; max-width: 480px; padding: 20px; margin-bottom: 32px;
      background: rgba(19, 24, 64, 0.6); backdrop-filter: blur(12px);
      border: 1px solid rgba(179, 136, 255, 0.2); border-radius: 16px; text-align: left;
    }
    .ai-analysis-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .ai-analysis-icon {
      width: 40px; height: 40px; border-radius: 12px;
      background: rgba(179, 136, 255, 0.15);
      display: flex; align-items: center; justify-content: center;
    }
    .ai-analysis h3 { color: #fff; font-weight: 600; font-size: 14px; }
    .ai-analysis p { font-size: 14px; color: #d1d5db; line-height: 1.6; white-space: pre-line; }
    
    /* Result Actions */
    .result-actions { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 480px; }
    @media (min-width: 600px) { .result-actions { flex-direction: row; } }
    .result-action {
      flex: 1; padding: 12px 20px; border-radius: 12px; font-weight: 500;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: rgba(19, 24, 64, 0.6); backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 229, 255, 0.3); color: #00e5ff;
      cursor: pointer; transition: all 0.2s; text-decoration: none;
    }
    .result-action:hover { border-color: rgba(0, 229, 255, 0.6); }
    .result-action.danger { border-color: rgba(255, 107, 107, 0.3); color: #ff6b6b; }
    .result-action.danger:hover { border-color: rgba(255, 107, 107, 0.6); }
    .result-action.secondary { border-color: rgba(255,255,255,0.1); color: #d1d5db; }
    .result-action.secondary:hover { border-color: rgba(255,255,255,0.25); }
    
    /* Review Page */
    .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .review-back { display: flex; align-items: center; gap: 6px; font-size: 14px; color: #9ca3af; text-decoration: none; }
    .review-back:hover { color: #fff; }
    .review-count { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #ff6b6b; }
    .review-card {
      padding: 20px; margin-bottom: 16px;
      background: rgba(19, 24, 64, 0.6); backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 229, 255, 0.1); border-radius: 16px;
    }
    .review-q-num { font-size: 14px; color: #ff6b6b; font-family: 'Orbitron', sans-serif; margin-bottom: 8px; }
    .review-q-tags { display: flex; gap: 8px; margin-bottom: 12px; }
    .review-question { font-size: 16px; color: #fff; font-weight: 500; margin-bottom: 16px; }
    .review-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .review-option {
      display: flex; align-items: center; gap: 12px; padding: 12px;
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
    }
    .review-option.correct { border-color: rgba(0, 230, 118, 0.4); background: rgba(0, 230, 118, 0.05); }
    .review-option.wrong { border-color: rgba(255, 107, 107, 0.4); background: rgba(255, 107, 107, 0.05); }
    .review-option-label {
      width: 28px; height: 28px; border-radius: 6px; display: flex;
      align-items: center; justify-content: center; font-size: 12px;
      font-weight: bold; font-family: 'Orbitron', sans-serif;
      background: rgba(255,255,255,0.05); color: #9ca3af;
    }
    .review-option.correct .review-option-label { background: rgba(0, 230, 118, 0.2); color: #00e676; }
    .review-option.wrong .review-option-label { background: rgba(255, 107, 107, 0.2); color: #ff6b6b; }
    .review-option-text { font-size: 14px; color: #d1d5db; flex: 1; }
    .review-explanation {
      padding: 16px; border-radius: 12px;
      background: rgba(0, 229, 255, 0.05);
      border: 1px solid rgba(0, 229, 255, 0.1);
    }
    .review-explanation-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .review-explanation-label { font-size: 12px; color: #00e5ff; font-weight: 500; }
    .review-explanation p { font-size: 14px; color: #d1d5db; line-height: 1.6; }
    
    /* Empty State */
    .empty-state { text-align: center; padding: 80px 20px; }
    .empty-icon { font-size: 64px; margin-bottom: 16px; }
    .empty-title { font-size: 20px; font-weight: bold; color: #fff; margin-bottom: 8px; }
    .empty-desc { font-size: 14px; color: #9ca3af; margin-bottom: 24px; }
    
    /* Loading */
    .loading { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .loading-spinner {
      width: 40px; height: 40px; border: 3px solid rgba(179, 136, 255, 0.2);
      border-top-color: #b388ff; border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #b388ff; font-weight: 500; }
    .loading-sub { font-size: 12px; color: #6b7280; }
    
    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
    }
    .modal {
      max-width: 320px; margin: 0 16px; padding: 24px;
      background: rgba(19, 24, 64, 0.9); backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 215, 64, 0.3); border-radius: 16px;
    }
    .modal-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .modal-title { color: #fff; font-weight: 600; }
    .modal-body { font-size: 14px; color: #9ca3af; margin-bottom: 24px; }
    .modal-body strong { color: #ff6b6b; font-weight: bold; }
    .modal-footer { display: flex; gap: 12px; }
    .modal-btn {
      flex: 1; padding: 8px 16px; border-radius: 8px; font-size: 14px;
      cursor: pointer; transition: all 0.2s;
    }
    .modal-btn.secondary {
      background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #d1d5db;
    }
    .modal-btn.secondary:hover { background: rgba(255,255,255,0.05); }
    .modal-btn.primary {
      background: rgba(255, 107, 107, 0.2); color: #ff6b6b;
      border: 1px solid rgba(255, 107, 107, 0.3);
    }
    .modal-btn.primary:hover { background: rgba(255, 107, 107, 0.3); }
    
    /* SVG Icons */
    .icon { display: inline-block; vertical-align: middle; }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>
  <div id="root"></div>
  
  <script>
    // ===== DATA =====
    const categories = [
      { id: 'history', name: '历史', icon: '🏛️', color: '#f4a460', count: 7 },
      { id: 'geography', name: '地理', icon: '🌍', color: '#00e676', count: 7 },
      { id: 'science', name: '科学', icon: '🔬', color: '#00e5ff', count: 7 },
      { id: 'literature', name: '文学', icon: '📚', color: '#b388ff', count: 7 },
      { id: 'art', name: '艺术', icon: '🎨', color: '#ff6b6b', count: 6 },

    // ===== PARTICLES =====
    function initParticles() {
      const canvas = document.getElementById('particles');
      const ctx = canvas.getContext('2d');
      const particles = [];
      const count = 60;
      
      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);
      
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.5,
          vy: (Math.random() - 0.5) * 0.5,
          size: Math.random() * 2 + 0.5,
          opacity: Math.random() * 0.5 + 0.2,
        });
      }
      
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
          if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
          
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0, 229, 255, ${p.opacity})`;
          ctx.fill();
        });
        
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist < 150) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(0, 229, 255, ${0.08 * (1 - dist / 150)})`;
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        }
        
        requestAnimationFrame(animate);
      }
      animate();
    }

    // ===== HELPERS =====
    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }
    
    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      state.elapsed = 0;
      timerInterval = setInterval(() => {
        state.elapsed++;
        const timerEl = document.getElementById('timer');
        if (timerEl) timerEl.textContent = formatTime(state.elapsed);
      }, 1000);
    }
    
    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
    }
    
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    
    function generateAnalysis() {
      const stats = { correct: 0, total: state.quizQuestions.length };
      state.answers.forEach((a, i) => {
        if (a === state.quizQuestions[i].correctIndex) stats.correct++;
      });
      
      const ratio = stats.correct / stats.total;
      let strength, weakness, suggestion;
      
      if (ratio >= 0.8) {
        strength = '基础知识掌握扎实';
        weakness = '部分高难度题目需要加强';
        suggestion = '建议在巩固基础的同时，适当挑战更高难度的题目，拓宽知识面。';
      } else if (ratio >= 0.6) {
        strength = '答题速度较快，反应敏捷';
        weakness = '部分题目审题不够仔细';
        suggestion = '建议在做题时放慢节奏，仔细阅读每个选项，提高准确率。';
      } else if (ratio >= 0.4) {
        strength = '综合知识面广泛';
        weakness = '某些特定领域存在知识盲区';
        suggestion = '建议针对薄弱领域进行专项练习，建立完整的知识体系。';
      } else {
        strength = '逻辑推理能力出色';
        weakness = '知识记忆类题目有待提升';
        suggestion = '建议多做记忆类题目，结合艾宾浩斯遗忘曲线进行复习。';
      }
      
      return `根据你的答题表现，AI 智能分析如下：

强项：${strength}
弱项：${weakness}

学习建议：${suggestion}`;
    }
    
    function typeAnalysis(text) {
      state.showAnalysis = true;
      state.analysisText = '';
      let i = 0;
      function type() {
        if (i < text.length) {
          state.analysisText = text.slice(0, i + 1);
          i++;
          render();
          setTimeout(type, 30);
        }
      }
      type();
    }
    
    // ===== NAVIGATION =====
    function navigate(page) {
      if (page === 'home') {
        stopTimer();
        state.page = 'home';
        state.isAI = false;
        state.quizQuestions = [];
        state.answers = [];
        state.startTime = null;
        state.elapsed = 0;
        state.showModal = false;
        state.showAnalysis = false;
        state.analysisText = '';
      } else {
        state.page = page;
      }
      render();
    }

      state.difficulty = d;

      stopTimer();

      state.quizQuestions = shuffle(questions).slice(0, 10);
      state.currentIndex = 0;
      state.answers = new Array(state.quizQuestions.length).fill(null);
      state.startTime = Date.now();
      state.elapsed = 0;
      state.showModal = false;
      state.showAnalysis = false;
      state.analysisText = '';

      render();

      navigate('categories');

      state.aiLoading = true;
      render();
      
      setTimeout(() => {
        stopTimer();
        state.aiLoading = false;
        state.page = 'quiz';
        state.quizQuestions = shuffle(questions).slice(0, 10);
        state.currentIndex = 0;
        state.answers = new Array(state.quizQuestions.length).fill(null);
        state.startTime = Date.now();
        state.elapsed = 0;
        state.showModal = false;
        state.showAnalysis = false;
        state.analysisText = '';
        startTimer();
        render();
      }, 2000);
    }
    
    function startCategoryQuiz(categoryId) {
      stopTimer();
      state.isAI = false;
      state.page = 'quiz';
      const filtered = questions.filter(q => q.category === categoryId && q.difficulty === state.difficulty);
      state.quizQuestions = filtered.length > 0 ? filtered : questions.filter(q => q.category === categoryId);
      state.currentIndex = 0;
      state.answers = new Array(state.quizQuestions.length).fill(null);
      state.startTime = Date.now();
      state.elapsed = 0;
      state.showModal = false;
      state.showAnalysis = false;
      state.analysisText = '';
      startTimer();
      render();
    }
    
    function selectOption(idx) {
      state.answers[state.currentIndex] = idx;
      render();
    }
    
    function nextQuestion() {
      if (state.currentIndex < state.quizQuestions.length - 1) {
        state.currentIndex++;
        render();
      }
    }
    
    function prevQuestion() {
      if (state.currentIndex > 0) {
        state.currentIndex--;
        render();
      }
    }
    
    function confirmSubmit() {
      const unanswered = state.quizQuestions.length - state.answers.filter(a => a !== null).length;
      if (unanswered > 0) {
        state.showModal = true;
        render();
      } else {
        submitQuiz();
      }
    }
    
    function closeModal() {
      state.showModal = false;
      render();
    }
    
    function submitQuiz() {
      stopTimer();
      state.showModal = false;
      state.page = 'result';
      state.analysisText = generateAnalysis();
      render();
    }
    
    function toggleAnalysis() {
      if (!state.showAnalysis) {
        typeAnalysis(state.analysisText);
      } else {
        state.showAnalysis = false;
        render();
      }
    }
    
    // ===== INIT =====
    initParticles();
    render();
  </script>
</body>
</html>
