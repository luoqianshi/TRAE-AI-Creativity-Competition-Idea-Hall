<script>
(function() {
  'use strict';

  // ===== 基础配置 =====
  const canvas = document.getElementById('mainCanvas');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  let width, height;
  let currentMode = 'chart';
  let animationId = null;
  let releaseCount = 0;
  let streakCount = 0;
  let pressure = 92;

  // ===== Canvas 尺寸管理 =====
  function resizeCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    width = rect.width;
    height = rect.height;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // ===== 颜色工具 =====
  const COLORS = {
    bg: '#1a1d23',
    bg2: '#21252b',
    bg3: '#2c313a',
    ink: '#c9d1d9',
    muted: '#8b949e',
    rule: '#30363d',
    accent: '#58a6ff',
    accent2: '#3fb950',
    danger: '#f85149',
    warning: '#d29922',
    purple: '#a371f7',
    cyan: '#39c5cf'
  };

  // ===== 模式：数据概览（伪装柱状图） =====
  const chartData = {
    labels: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
    values: [65, 78, 52, 89, 73, 45, 38],
    target: [70, 70, 70, 70, 70, 70, 70]
  };

  let chartAnimProgress = 0;

  function drawChart() {
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, width, height);

    const margin = { top: 60, right: 40, bottom: 60, left: 60 };
    const chartW = width - margin.left - margin.right;
    const chartH = height - margin.top - margin.bottom;

    // 标题
    ctx.fillStyle = COLORS.ink;
    ctx.font = '600 14px "SF Mono", Consolas, Monaco, monospace';
    ctx.textAlign = 'left';
    ctx.fillText('本周绩效完成率趋势', margin.left, 30);

    // 网格线
    ctx.strokeStyle = COLORS.rule;
    ctx.lineWidth = 1;
    for (let i = 0; i <= 5; i++) {
      const y = margin.top + chartH * (i / 5);
      ctx.beginPath();
      ctx.moveTo(margin.left, y);
      ctx.lineTo(margin.left + chartW, y);
      ctx.stroke();

      const val = Math.round(100 - i * 20);
      ctx.fillStyle = COLORS.muted;
      ctx.font = '11px "SF Mono", Consolas, Monaco, monospace';
      ctx.textAlign = 'right';
      ctx.fillText(val + '%', margin.left - 10, y + 4);
    }

    // 柱状图
    const barCount = chartData.values.length;
    const barGap = chartW / barCount;
    const barWidth = barGap * 0.5;

    chartData.values.forEach((val, i) => {
      const x = margin.left + barGap * i + (barGap - barWidth) / 2;
      const barH = (val / 100) * chartH * chartAnimProgress;
      const y = margin.top + chartH - barH;

      // 柱子
      const grad = ctx.createLinearGradient(0, y, 0, margin.top + chartH);
      grad.addColorStop(0, COLORS.accent);
      grad.addColorStop(1, COLORS.accent + '44');
      ctx.fillStyle = grad;
      ctx.fillRect(x, y, barWidth, barH);

      // 目标线
      const targetY = margin.top + chartH - (chartData.target[i] / 100) * chartH;
      ctx.strokeStyle = COLORS.warning + '66';
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(x - 5, targetY);
      ctx.lineTo(x + barWidth + 5, targetY);
      ctx.stroke();
      ctx.setLineDash([]);

      // 数值
      ctx.fillStyle = COLORS.ink;
      ctx.font = '11px "SF Mono", Consolas, Monaco, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(Math.round(val * chartAnimProgress) + '%', x + barWidth / 2, y - 8);

      // 标签
      ctx.fillStyle = COLORS.muted;
      ctx.fillText(chartData.labels[i], x + barWidth / 2, margin.top + chartH + 20);
    });

    // X轴
    ctx.strokeStyle = COLORS.rule;
    ctx.beginPath();
    ctx.moveTo(margin.left, margin.top + chartH);
    ctx.lineTo(margin.left + chartW, margin.top + chartH);
    ctx.stroke();

    if (chartAnimProgress < 1) {
      chartAnimProgress += 0.02;
    }
  }

  // ===== 模式：气泡矩阵 =====
  const bubbles = [];
  const maxBubbles = 80;

  function initBubbles() {
    bubbles.length = 0;
    for (let i = 0; i < 30; i++) {
      bubbles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: 4 + Math.random() * 20,
        vx: (Math.random() - 0.5) * 2,
        vy: (Math.random() - 0.5) * 2,
        color: [COLORS.accent, COLORS.accent2, COLORS.purple, COLORS.cyan][Math.floor(Math.random() * 4)],
        alpha: 0.3 + Math.random() * 0.5
      });
    }
  }

  function drawBubbles() {
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, width, height);

    // 绘制气泡
    bubbles.forEach(b => {
      b.x += b.vx;
      b.y += b.vy;

      if (b.x < -b.r) b.x = width + b.r;
      if (b.x > width + b.r) b.x = -b.r;
      if (b.y < -b.r) b.y = height + b.r;
      if (b.y > height + b.r) b.y = -b.r;

      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = b.color + Math.floor(b.alpha * 255).toString(16).padStart(2, '0');
      ctx.fill();

      // 高光
      ctx.beginPath();
      ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.25, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fill();
    });

    // 连接线
    ctx.strokeStyle = COLORS.rule;
    ctx.lineWidth = 0.5;
    for (let i = 0; i < bubbles.length; i++) {
      for (let j = i + 1; j < bubbles.length; j++) {
        const dx = bubbles[i].x - bubbles[j].x;
        const dy = bubbles[i].y - bubbles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) {
          ctx.globalAlpha = 1 - dist / 120;
          ctx.beginPath();
          ctx.moveTo(bubbles[i].x, bubbles[i].y);
          ctx.lineTo(bubbles[j].x, bubbles[j].y);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }
    }

    // 提示文字
    ctx.fillStyle = COLORS.muted;
    ctx.font = '12px "SF Mono", Consolas, Monaco, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('点击空白处释放气泡 · 拖动鼠标产生涟漪', width / 2, height - 20);
  }

  function spawnBubble(x, y) {
    if (bubbles.length >= maxBubbles) bubbles.shift();
    bubbles.push({
      x: x,
      y: y,
      r: 8 + Math.random() * 24,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4,
      color: [COLORS.accent, COLORS.accent2, COLORS.purple, COLORS.cyan, COLORS.danger][Math.floor(Math.random() * 5)],
      alpha: 0.6 + Math.random() * 0.4
    });
    releaseCount++;
    updateStats();
  }

  // ===== 模式：键盘释放 =====
  const keyParticles = [];
  const keys = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()'.split('');

  function drawKeyboard() {
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, width, height);

    // 提示
    ctx.fillStyle = COLORS.muted;
    ctx.font = '14px "SF Mono", Consolas, Monaco, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('狂按键盘释放压力！支持任意字母、数字、符号', width / 2, height / 2 - 40);
    ctx.fillText('已捕获按键: ' + releaseCount, width / 2, height / 2 + 40);

    // 粒子
    keyParticles.forEach((p, i) => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.15;
      p.life -= 0.015;
      p.r *= 0.995;

      if (p.life <= 0) {
        keyParticles.splice(i, 1);
        return;
      }

      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.font = `bold ${p.r}px "SF Mono", Consolas, Monaco, monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(p.char, p.x, p.y);
      ctx.restore();
    });
  }

  function spawnKeyParticle(char) {
    keyParticles.push({
      x: width / 2 + (Math.random() - 0.5) * 100,
      y: height / 2 + (Math.random() - 0.5) * 40,
      vx: (Math.random() - 0.5) * 8,
      vy: -6 - Math.random() * 6,
      r: 24 + Math.random() * 16,
      char: char,
      color: [COLORS.accent, COLORS.accent2, COLORS.purple, COLORS.cyan, COLORS.danger, COLORS.warning][Math.floor(Math.random() * 6)],
      life: 1
    });
    releaseCount++;
    streakCount++;
    pressure = Math.max(0, pressure - 1);
    updateStats();
  }

  // ===== 模式：碎片打击 =====
  const shards = [];
  let shatterTarget = null;

  function initShatter() {
    shatterTarget = {
      x: width / 2,
      y: height / 2,
      w: 120,
      h: 120,
      text: '压力',
      color: COLORS.danger
    };
    shards.length = 0;
  }

  function drawShatter() {
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, width, height);

    // 绘制目标
    if (shatterTarget) {
      const t = shatterTarget;
      ctx.save();
      ctx.translate(t.x, t.y);

      // 外框
      ctx.strokeStyle = t.color;
      ctx.lineWidth = 2;
      ctx.strokeRect(-t.w / 2, -t.h / 2, t.w, t.h);

      // 内部
      ctx.fillStyle = t.color + '22';
      ctx.fillRect(-t.w / 2, -t.h / 2, t.w, t.h);

      // 文字
      ctx.fillStyle = t.color;
      ctx.font = 'bold 28px "SF Mono", Consolas, Monaco, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(t.text, 0, 0);

      ctx.restore();
    }

    // 碎片
    shards.forEach((s, i) => {
      s.x += s.vx;
      s.y += s.vy;
      s.vy += 0.2;
      s.rotation += s.vr;
      s.life -= 0.008;

      if (s.life <= 0) {
        shards.splice(i, 1);
        return;
      }

      ctx.save();
      ctx.globalAlpha = s.life;
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rotation);
      ctx.fillStyle = s.color;
      ctx.fillRect(-s.w / 2, -s.h / 2, s.w, s.h);
      ctx.restore();
    });

    // 提示
    ctx.fillStyle = COLORS.muted;
    ctx.font = '12px "SF Mono", Consolas, Monaco, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('点击方块将其击碎！', width / 2, height - 30);
  }

  function shatterTargetAt(x, y) {
    if (!shatterTarget) return;
    const t = shatterTarget;
    const pieceCount = 12 + Math.floor(Math.random() * 8);

    for (let i = 0; i < pieceCount; i++) {
      shards.push({
        x: t.x + (Math.random() - 0.5) * t.w,
        y: t.y + (Math.random() - 0.5) * t.h,
        w: 8 + Math.random() * 16,
        h: 8 + Math.random() * 16,
        vx: (Math.random() - 0.5) * 12,
        vy: -6 - Math.random() * 8,
        vr: (Math.random() - 0.5) * 0.3,
        rotation: Math.random() * Math.PI * 2,
        color: [COLORS.danger, COLORS.warning, COLORS.accent, COLORS.accent2][Math.floor(Math.random() * 4)],
        life: 1
      });
    }

    // 重置目标位置
    shatterTarget.x = 80 + Math.random() * (width - 160);
    shatterTarget.y = 80 + Math.random() * (height - 160);
    const labels = ['压力', '焦虑', 'KPI', '加班', 'Deadline', 'Bug', '会议', '汇报'];
    shatterTarget.text = labels[Math.floor(Math.random() * labels.length)];

    releaseCount++;
    pressure = Math.max(0, pressure - 3);
    updateStats();
  }

  // ===== 模式：发泄涂鸦 =====
  const doodleLines = [];
  let isDrawing = false;
  let currentLine = null;

  function drawDoodle() {
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, width, height);

    // 绘制所有线条
    doodleLines.forEach(line => {
      if (line.points.length < 2) return;
      ctx.strokeStyle = line.color;
      ctx.lineWidth = line.width;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(line.points[0].x, line.points[0].y);
      for (let i = 1; i < line.points.length; i++) {
        ctx.lineTo(line.points[i].x, line.points[i].y);
      }
      ctx.stroke();
    });

    // 提示
    ctx.fillStyle = COLORS.muted;
    ctx.font = '12px "SF Mono", Consolas, Monaco, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('按住鼠标涂鸦发泄 · 右键清空画布', width / 2, height - 20);
  }

  // ===== 统计更新 =====
  function updateStats() {
    document.getElementById('releaseCount').textContent = releaseCount;
    document.getElementById('streakCount').textContent = streakCount;
    document.getElementById('pressureText').textContent = pressure + '%';
    document.getElementById('pressureBar').style.width = pressure + '%';
  }

  // ===== 模式切换 =====
  function setMode(mode) {
    currentMode = mode;

    // 更新按钮状态
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mode === mode);
    });

    // 初始化对应模式
    if (mode === 'bubbles') initBubbles();
    if (mode === 'shatter') initShatter();
    if (mode === 'keyboard') { keyParticles.length = 0; }
    if (mode === 'doodle') { doodleLines.length = 0; }
    if (mode === 'chart') { chartAnimProgress = 0; }
  }

  // ===== 渲染循环 =====
  function render() {
    switch (currentMode) {
      case 'chart': drawChart(); break;
      case 'bubbles': drawBubbles(); break;
      case 'keyboard': drawKeyboard(); break;
      case 'shatter': drawShatter(); break;
      case 'doodle': drawDoodle(); break;
    }
    animationId = requestAnimationFrame(render);
  }

  render();

  // ===== 事件绑定 =====

  // 模式按钮
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => setMode(btn.dataset.mode));
  });

  // Canvas 鼠标事件
  canvas.addEventListener('mousedown', e => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (currentMode === 'bubbles') {
      spawnBubble(x, y);
    } else if (currentMode === 'shatter' && shatterTarget) {
      const t = shatterTarget;
      if (x > t.x - t.w / 2 && x < t.x + t.w / 2 &&
          y > t.y - t.h / 2 && y < t.y + t.h / 2) {
        shatterTargetAt(x, y);
      }
    } else if (currentMode === 'doodle') {
      isDrawing = true;
      currentLine = {
        points: [{x, y}],
        color: [COLORS.accent, COLORS.accent2, COLORS.purple, COLORS.cyan, COLORS.danger, COLORS.warning][Math.floor(Math.random() * 6)],
        width: 2 + Math.random() * 4
      };
      doodleLines.push(currentLine);
    }
  });

  canvas.addEventListener('mousemove', e => {
    if (currentMode === 'doodle' && isDrawing && currentLine) {
      const rect = canvas.getBoundingClientRect();
      currentLine.points.push({
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      });
    }
  });

  canvas.addEventListener('mouseup', () => {
    isDrawing = false;
    currentLine = null;
  });

  canvas.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (currentMode === 'doodle') {
      doodleLines.length = 0;
    }
  });

  // 键盘事件
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      const overlay = document.getElementById('coverOverlay');
      overlay.classList.toggle('show');
      return;
    }

    if (currentMode === 'keyboard') {
      const char = e.key.length === 1 ? e.key.toUpperCase() : keys[Math.floor(Math.random() * keys.length)];
      spawnKeyParticle(char);
    }
  });

  // 压力自然恢复
  setInterval(() => {
    if (pressure < 92) {
      pressure = Math.min(92, pressure + 0.5);
      updateStats();
    }
    if (streakCount > 0 && currentMode !== 'keyboard') {
      streakCount = Math.max(0, streakCount - 1);
      updateStats();
    }
  }, 2000);

})();
</script>
</body>
</html>
