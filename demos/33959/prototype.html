<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Scope - 嵌入式示波器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
        }

        /* Toolbar */
        .toolbar {
            background-color: #2d2d2d;
            border-bottom: 1px solid #404040;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            height: 48px;
        }

        .toolbar-btn {
            background-color: #3c3c3c;
            border: 1px solid #505050;
            border-radius: 4px;
            color: #ffffff;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s;
        }

        .toolbar-btn:hover {
            background-color: #4a4a4a;
        }

        .toolbar-btn:active {
            background-color: #555555;
        }

        .toolbar-btn.active {
            background-color: #0e639c;
            border-color: #1177bb;
        }

        .toolbar-btn.danger {
            background-color: #c42b1c;
            border-color: #e81123;
        }

        .toolbar-separator {
            width: 1px;
            height: 28px;
            background-color: #404040;
            margin: 0 4px;
        }

        .toolbar-status {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #555555;
        }

        .status-dot.connected {
            background-color: #4ec9b0;
        }

        .status-dot.sampling {
            background-color: #dcdcaa;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Main Content */
        .main-content {
            display: flex;
            height: calc(100vh - 48px);
        }

        /* Left Panel - Variable List */
        .left-panel {
            width: 280px;
            min-width: 200px;
            background-color: #252526;
            border-right: 1px solid #404040;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 1px solid #404040;
            background-color: #2d2d2d;
        }

        .search-box {
            padding: 8px 12px;
            border-bottom: 1px solid #404040;
        }

        .search-input {
            width: 100%;
            background-color: #1e1e1e;
            border: 1px solid #505050;
            border-radius: 4px;
            padding: 6px 10px;
            color: #ffffff;
            font-size: 13px;
        }

        .search-input:focus {
            outline: none;
            border-color: #0e639c;
        }

        .search-input::placeholder {
            color: #666666;
        }

        .variable-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .variable-item {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .variable-item:hover {
            background-color: #2a2d2e;
        }

        .variable-item.selected {
            background-color: #094771;
        }

        .variable-checkbox {
            margin-right: 10px;
            accent-color: #0e639c;
        }

        .variable-name {
            font-size: 13px;
            flex: 1;
        }

        .variable-type {
            font-size: 11px;
            color: #888888;
            background-color: #333333;
            padding: 2px 6px;
            border-radius: 3px;
        }

        /* Right Panel */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Waveform Area */
        .waveform-area {
            flex: 2;
            background-color: #1e1e1e;
            position: relative;
            min-height: 300px;
        }

        .waveform-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .waveform-canvas {
            width: 100%;
            height: 100%;
        }

        .waveform-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .waveform-legend {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(30, 30, 30, 0.9);
            border: 1px solid #404040;
            border-radius: 4px;
            padding: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            font-size: 12px;
        }

        .legend-color {
            width: 16px;
            height: 3px;
            border-radius: 1px;
        }

        .waveform-controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background-color: rgba(30, 30, 30, 0.9);
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid #404040;
        }

        .waveform-btn {
            background-color: #3c3c3c;
            border: 1px solid #505050;
            border-radius: 3px;
            color: #ffffff;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 12px;
        }

        .waveform-btn:hover {
            background-color: #4a4a4a;
        }

        /* Variable Table */
        .variable-table-area {
            flex: 1;
            min-height: 200px;
            border-top: 1px solid #404040;
            background-color: #252526;
            overflow: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .data-table thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .data-table th {
            background-color: #2d2d2d;
            padding: 8px 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 1px solid #404040;
            border-right: 1px solid #404040;
        }

        .data-table td {
            padding: 6px 12px;
            border-bottom: 1px solid #333333;
            border-right: 1px solid #333333;
        }

        .data-table tr:hover td {
            background-color: #2a2d2e;
        }

        .data-table .editable {
            cursor: pointer;
            position: relative;
        }

        .data-table .editable:hover {
            background-color: #094771;
        }

        .data-table .editable::after {
            content: '✎';
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 10px;
            color: #888888;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .data-table .editable:hover::after {
            opacity: 1;
        }

        .value-cell {
            font-family: 'Consolas', 'Courier New', monospace;
        }

        .address-cell {
            font-family: 'Consolas', 'Courier New', monospace;
            color: #9cdcfe;
        }

        /* Status Bar */
        .status-bar {
            background-color: #007acc;
            padding: 4px 12px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-left {
            display: flex;
            gap: 20px;
        }

        .status-right {
            display: flex;
            gap: 20px;
        }

        /* Rate Control */
        .rate-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rate-label {
            font-size: 11px;
        }

        .rate-input {
            width: 80px;
            background-color: #1e1e1e;
            border: 1px solid #505050;
            border-radius: 3px;
            padding: 2px 6px;
            color: #ffffff;
            font-size: 12px;
            text-align: center;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }

        ::-webkit-scrollbar-thumb {
            background: #424242;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555555;
        }

        /* Resizer */
        .resizer {
            width: 4px;
            background-color: #404040;
            cursor: col-resize;
            transition: background-color 0.2s;
        }

        .resizer:hover {
            background-color: #0e639c;
        }

        /* Settings Dialog (Hidden by default) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background-color: #2d2d2d;
            border: 1px solid #404040;
            border-radius: 8px;
            width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid #404040;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .modal-close:hover {
            background-color: #404040;
            border-radius: 4px;
        }

        .modal-body {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #cccccc;
        }

        .form-input {
            width: 100%;
            background-color: #1e1e1e;
            border: 1px solid #505050;
            border-radius: 4px;
            padding: 8px 12px;
            color: #ffffff;
            font-size: 13px;
        }

        .form-select {
            width: 100%;
            background-color: #1e1e1e;
            border: 1px solid #505050;
            border-radius: 4px;
            padding: 8px 12px;
            color: #ffffff;
            font-size: 13px;
        }

        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid #404040;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .btn {
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid #505050;
        }

        .btn-primary {
            background-color: #0e639c;
            border-color: #1177bb;
        }

        .btn-primary:hover {
            background-color: #1177bb;
        }

        .btn-secondary {
            background-color: #3c3c3c;
        }

        .btn-secondary:hover {
            background-color: #4a4a4a;
        }

        /* Tooltip */
        .tooltip {
            position: absolute;
            background-color: #333333;
            border: 1px solid #505050;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 12px;
            pointer-events: none;
            z-index: 50;
            white-space: nowrap;
        }

        /* Edit Input */
        .edit-input {
            background-color: #094771;
            border: 1px solid #0e639c;
            color: #ffffff;
            padding: 2px 6px;
            font-size: 13px;
            font-family: 'Consolas', monospace;
            width: 100%;
        }

        .edit-input:focus {
            outline: none;
        }

        /* Color indicators */
        .color-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 2px;
            margin-right: 6px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .left-panel {
                width: 220px;
            }
        }
    </style>
</head>
<body>
    <!-- Toolbar -->
    <div class="toolbar">
        <button class="toolbar-btn" id="btnConnect" onclick="toggleConnection()">
            <span>🔌</span> 连接 OpenOCD
        </button>
        <button class="toolbar-btn" onclick="loadElf()">
            <span>📁</span> 加载 ELF
        </button>
        <div class="toolbar-separator"></div>
        <button class="toolbar-btn active" id="btnStart" onclick="toggleSampling()">
            <span>▶</span> 开始采样
        </button>
        <button class="toolbar-btn" id="btnStop" onclick="stopSampling()" style="display:none;">
            <span>⏹</span> 停止采样
        </button>
        <div class="toolbar-separator"></div>
        <button class="toolbar-btn" onclick="showSettings()">
            <span>⚙️</span> 设置
        </button>
        <div class="toolbar-status">
            <div class="status-indicator">
                <div class="status-dot" id="openocdStatus"></div>
                <span>OpenOCD</span>
            </div>
            <div class="status-indicator">
                <div class="status-dot" id="mcuStatus"></div>
                <span>MCU</span>
            </div>
            <div class="rate-control">
                <span class="rate-label">采样率:</span>
                <input type="number" class="rate-input" id="sampleRate" value="1000" min="1" max="20000">
                <span class="rate-label">Hz</span>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Left Panel -->
        <div class="left-panel" id="leftPanel">
            <div class="panel-header">变量列表</div>
            <div class="search-box">
                <input type="text" class="search-input" placeholder="搜索变量..." oninput="filterVariables(this.value)">
            </div>
            <div class="variable-list" id="variableList">
                <!-- Variables will be populated here -->
            </div>
        </div>

        <!-- Resizer -->
        <div class="resizer" id="resizer"></div>

        <!-- Right Panel -->
        <div class="right-panel">
            <!-- Waveform Area -->
            <div class="waveform-area" id="waveformArea">
                <div class="waveform-container">
                    <canvas class="waveform-canvas" id="waveformCanvas"></canvas>
                    <div class="waveform-legend" id="waveformLegend">
                        <!-- Legend items will be populated here -->
                    </div>
                    <div class="waveform-controls">
                        <button class="waveform-btn" onclick="zoomIn()">放大</button>
                        <button class="waveform-btn" onclick="zoomOut()">缩小</button>
                        <button class="waveform-btn" onclick="resetZoom()">重置</button>
                        <button class="waveform-btn" onclick="toggleAutoScroll()">自动滚动</button>
                    </div>
                </div>
            </div>

            <!-- Variable Table -->
            <div class="variable-table-area" id="variableTableArea">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width: 15%">颜色</th>
                            <th style="width: 20%">名称</th>
                            <th style="width: 20%">地址</th>
                            <th style="width: 15%">类型</th>
                            <th style="width: 15%">当前值</th>
                            <th style="width: 15%">Y偏移</th>
                            <th style="width: 15%">Y缩放</th>
                        </tr>
                    </thead>
                    <tbody id="variableTableBody">
                        <!-- Table rows will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
        <div class="status-left">
            <span id="statusText">就绪</span>
            <span id="sampleCount">采样数: 0</span>
        </div>
        <div class="status-right">
            <span id="elapsedTime">运行时间: 00:00</span>
            <span>Embedded Scope v0.1.0</span>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title">设置</span>
                <button class="modal-close" onclick="hideSettings()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">OpenOCD 路径</label>
                    <input type="text" class="form-input" value="openocd">
                </div>
                <div class="form-group">
                    <label class="form-label">调试器接口</label>
                    <select class="form-select">
                        <option value="jlink">J-Link</option>
                        <option value="stlink">ST-Link</option>
                        <option value="cmsis-dap">CMSIS-DAP</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">目标芯片</label>
                    <select class="form-select">
                        <option value="stm32f4x">STM32F4</option>
                        <option value="stm32f1x">STM32F1</option>
                        <option value="esp32c3">ESP32-C3</option>
                        <option value="rp2040">RP2040</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">JTAG/SWD 速度 (kHz)</label>
                    <input type="number" class="form-input" value="10000">
                </div>
                <div class="form-group">
                    <label class="form-label">TCL 端口</label>
                    <input type="number" class="form-input" value="4444">
                </div>
                <div class="form-group">
                    <label class="form-label">缓冲区大小</label>
                    <input type="number" class="form-input" value="10000">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="hideSettings()">取消</button>
                <button class="btn btn-primary" onclick="hideSettings()">确定</button>
            </div>
        </div>
    </div>

    <script>
        // State
        const state = {
            connected: false,
            sampling: false,
            variables: [
                { name: 'motor_current', address: '0x20000000', type: 'float', value: 0, y_offset: 0, y_scale: 1, color: '#FF6B6B', enabled: true },
                { name: 'motor_speed', address: '0x20000004', type: 'float', value: 0, y_offset: 0, y_scale: 1, color: '#4ECDC4', enabled: true },
                { name: 'encoder_count', address: '0x20000008', type: 'int32', value: 0, y_offset: 0, y_scale: 1, color: '#45B7D1', enabled: true },
                { name: 'target_current', address: '0x2000000C', type: 'float', value: 0, y_offset: 0, y_scale: 1, color: '#96CEB4', enabled: false },
                { name: 'pwm_duty', address: '0x20000010', type: 'uint16', value: 0, y_offset: 0, y_scale: 0.01, color: '#FFEAA7', enabled: false },
                { name: 'error_code', address: '0x20000014', type: 'uint32', value: 0, y_offset: 0, y_scale: 1, color: '#DDA0DD', enabled: false },
                { name: 'temperature', address: '0x20000018', type: 'float', value: 0, y_offset: 0, y_scale: 1, color: '#98D8C8', enabled: false },
                { name: 'voltage_bus', address: '0x2000001C', type: 'float', value: 0, y_offset: 0, y_scale: 1, color: '#F7DC6F', enabled: false },
            ],
            sampleCount: 0,
            startTime: null,
            waveformData: {},
            timeWindow: 5, // seconds
            autoScroll: true,
            editingCell: null,
        };

        // Initialize waveform data
        state.variables.forEach(v => {
            state.waveformData[v.name] = [];
        });

        // Populate variable list
        function populateVariableList() {
            const list = document.getElementById('variableList');
            list.innerHTML = state.variables.map((v, i) => `
                <div class="variable-item ${v.enabled ? 'selected' : ''}" onclick="toggleVariable(${i})">
                    <input type="checkbox" class="variable-checkbox" ${v.enabled ? 'checked' : ''} onclick="event.stopPropagation(); toggleVariable(${i})">
                    <span class="variable-name">${v.name}</span>
                    <span class="variable-type">${v.type}</span>
                </div>
            `).join('');
        }

        // Populate variable table
        function populateVariableTable() {
            const tbody = document.getElementById('variableTableBody');
            const enabledVars = state.variables.filter(v => v.enabled);
            tbody.innerHTML = enabledVars.map((v, i) => `
                <tr>
                    <td>
                        <span class="color-indicator" style="background-color: ${v.color}"></span>
                    </td>
                    <td>${v.name}</td>
                    <td class="address-cell">${v.address}</td>
                    <td>${v.type}</td>
                    <td class="value-cell editable" ondblclick="startEdit(this, '${v.name}', 'value')">${v.value.toFixed(4)}</td>
                    <td class="editable" ondblclick="startEdit(this, '${v.name}', 'y_offset')">${v.y_offset}</td>
                    <td class="editable" ondblclick="startEdit(this, '${v.name}', 'y_scale')">${v.y_scale}</td>
                </tr>
            `).join('');
        }

        // Update legend
        function updateLegend() {
            const legend = document.getElementById('waveformLegend');
            const enabledVars = state.variables.filter(v => v.enabled);
            legend.innerHTML = enabledVars.map(v => `
                <div class="legend-item">
                    <div class="legend-color" style="background-color: ${v.color}"></div>
                    <span>${v.name}</span>
                </div>
            `).join('');
        }

        // Toggle variable
        function toggleVariable(index) {
            state.variables[index].enabled = !state.variables[index].enabled;
            populateVariableList();
            populateVariableTable();
            updateLegend();
        }

        // Filter variables
        function filterVariables(text) {
            const items = document.querySelectorAll('.variable-item');
            items.forEach((item, i) => {
                const name = state.variables[i].name.toLowerCase();
                item.style.display = name.includes(text.toLowerCase()) ? 'flex' : 'none';
            });
        }

        // Toggle connection
        function toggleConnection() {
            state.connected = !state.connected;
            const btn = document.getElementById('btnConnect');
            const status = document.getElementById('openocdStatus');
            const mcuStatus = document.getElementById('mcuStatus');

            if (state.connected) {
                btn.innerHTML = '<span>🔌</span> 断开连接';
                btn.classList.add('active');
                status.classList.add('connected');
                mcuStatus.classList.add('connected');
                document.getElementById('statusText').textContent = '已连接到 OpenOCD';
            } else {
                btn.innerHTML = '<span>🔌</span> 连接 OpenOCD';
                btn.classList.remove('active');
                status.classList.remove('connected');
                mcuStatus.classList.remove('connected');
                document.getElementById('statusText').textContent = '已断开连接';
                if (state.sampling) {
                    stopSampling();
                }
            }
        }

        // Toggle sampling
        function toggleSampling() {
            if (!state.connected) {
                alert('请先连接 OpenOCD');
                return;
            }
            startSampling();
        }

        // Start sampling
        function startSampling() {
            state.sampling = true;
            state.startTime = Date.now();
            document.getElementById('btnStart').style.display = 'none';
            document.getElementById('btnStop').style.display = 'flex';
            document.getElementById('openocdStatus').classList.add('sampling');
            document.getElementById('statusText').textContent = '采样中...';
            simulateSampling();
        }

        // Stop sampling
        function stopSampling() {
            state.sampling = false;
            document.getElementById('btnStart').style.display = 'flex';
            document.getElementById('btnStop').style.display = 'none';
            document.getElementById('openocdStatus').classList.remove('sampling');
            document.getElementById('statusText').textContent = '已停止';
        }

        // Simulate sampling
        function simulateSampling() {
            if (!state.sampling) return;

            const rate = parseInt(document.getElementById('sampleRate').value) || 1000;
            const now = Date.now() / 1000;

            state.variables.forEach(v => {
                if (v.enabled) {
                    // Generate simulated waveform data
                    let value;
                    switch (v.name) {
                        case 'motor_current':
                            value = 2.5 * Math.sin(now * 2) + 0.5 * Math.sin(now * 10) + Math.random() * 0.1;
                            break;
                        case 'motor_speed':
                            value = 1500 + 200 * Math.sin(now * 0.5) + Math.random() * 10;
                            break;
                        case 'encoder_count':
                            value = Math.floor(now * 1000) % 65536;
                            break;
                        default:
                            value = Math.sin(now * 3 + v.address.charCodeAt(10)) * 50 + Math.random() * 5;
                    }
                    v.value = value;
                    state.waveformData[v.name].push({ time: now, value: value * v.y_scale + v.y_offset });
                }
            });

            state.sampleCount++;
            document.getElementById('sampleCount').textContent = `采样数: ${state.sampleCount}`;

            // Update elapsed time
            if (state.startTime) {
                const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
                const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
                const seconds = (elapsed % 60).toString().padStart(2, '0');
                document.getElementById('elapsedTime').textContent = `运行时间: ${minutes}:${seconds}`;
            }

            drawWaveform();
            populateVariableTable();

            // Schedule next sample
            const interval = 1000 / rate;
            setTimeout(simulateSampling, Math.max(interval, 16)); // Min 16ms for ~60fps
        }

        // Draw waveform
        function drawWaveform() {
            const canvas = document.getElementById('waveformCanvas');
            const ctx = canvas.getContext('2d');
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;

            const padding = { top: 20, right: 20, bottom: 40, left: 60 };
            const width = canvas.width - padding.left - padding.right;
            const height = canvas.height - padding.top - padding.bottom;

            // Clear canvas
            ctx.fillStyle = '#1e1e1e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 1;

            // Vertical grid lines
            for (let i = 0; i <= 10; i++) {
                const x = padding.left + (width / 10) * i;
                ctx.beginPath();
                ctx.moveTo(x, padding.top);
                ctx.lineTo(x, padding.top + height);
                ctx.stroke();

                // Time labels
                const time = (state.timeWindow / 10) * i;
                ctx.fillStyle = '#666666';
                ctx.font = '11px Consolas';
                ctx.textAlign = 'center';
                ctx.fillText(time.toFixed(1) + 's', x, canvas.height - 10);
            }

            // Horizontal grid lines
            for (let i = 0; i <= 8; i++) {
                const y = padding.top + (height / 8) * i;
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(padding.left + width, y);
                ctx.stroke();
            }

            // Draw waveforms
            const enabledVars = state.variables.filter(v => v.enabled);
            const now = Date.now() / 1000;
            const startTime = now - state.timeWindow;

            enabledVars.forEach(v => {
                const data = state.waveformData[v.name];
                if (data.length < 2) return;

                // Get visible data
                const visibleData = data.filter(d => d.time >= startTime);
                if (visibleData.length < 2) return;

                // Calculate scale
                const values = visibleData.map(d => d.value);
                const minVal = Math.min(...values);
                const maxVal = Math.max(...values);
                const range = maxVal - minVal || 1;

                ctx.strokeStyle = v.color;
                ctx.lineWidth = 2;
                ctx.beginPath();

                visibleData.forEach((d, i) => {
                    const x = padding.left + ((d.time - startTime) / state.timeWindow) * width;
                    const y = padding.top + height - ((d.value - minVal) / range) * height;

                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                });

                ctx.stroke();
            });

            // Draw Y-axis labels
            ctx.fillStyle = '#666666';
            ctx.font = '11px Consolas';
            ctx.textAlign = 'right';
            for (let i = 0; i <= 8; i++) {
                const y = padding.top + (height / 8) * i;
                const value = 100 - (100 / 8) * i;
                ctx.fillText(value.toFixed(0), padding.left - 10, y + 4);
            }
        }

        // Waveform controls
        function zoomIn() {
            state.timeWindow = Math.max(1, state.timeWindow - 1);
        }

        function zoomOut() {
            state.timeWindow = Math.min(30, state.timeWindow + 1);
        }

        function resetZoom() {
            state.timeWindow = 5;
        }

        function toggleAutoScroll() {
            state.autoScroll = !state.autoScroll;
        }

        // Edit cell
        function startEdit(cell, varName, field) {
            if (state.editingCell) {
                finishEdit();
            }

            state.editingCell = { cell, varName, field };
            const currentValue = cell.textContent;
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'edit-input';
            input.value = currentValue;
            input.onblur = () => finishEdit();
            input.onkeydown = (e) => {
                if (e.key === 'Enter') finishEdit();
                if (e.key === 'Escape') cancelEdit();
            };

            cell.textContent = '';
            cell.appendChild(input);
            input.focus();
            input.select();
        }

        function finishEdit() {
            if (!state.editingCell) return;

            const { cell, varName, field } = state.editingCell;
            const input = cell.querySelector('input');
            if (input) {
                const value = parseFloat(input.value);
                if (!isNaN(value)) {
                    const v = state.variables.find(v => v.name === varName);
                    if (v) {
                        if (field === 'value') {
                            v.value = value;
                        } else {
                            v[field] = value;
                        }
                    }
                }
            }

            state.editingCell = null;
            populateVariableTable();
        }

        function cancelEdit() {
            state.editingCell = null;
            populateVariableTable();
        }

        // Load ELF
        function loadElf() {
            alert('请在命令行中使用 -e 参数指定 ELF 文件路径\n\n示例: python -m embedded_scope.main -e firmware.elf');
        }

        // Settings modal
        function showSettings() {
            document.getElementById('settingsModal').classList.add('active');
        }

        function hideSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        // Resizer
        const resizer = document.getElementById('resizer');
        const leftPanel = document.getElementById('leftPanel');
        let isResizing = false;

        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', () => {
                isResizing = false;
                document.removeEventListener('mousemove', handleMouseMove);
            });
        });

        function handleMouseMove(e) {
            if (!isResizing) return;
            const newWidth = e.clientX;
            if (newWidth >= 200 && newWidth <= 500) {
                leftPanel.style.width = newWidth + 'px';
            }
        }

        // Window resize
        window.addEventListener('resize', drawWaveform);

        // Initialize
        populateVariableList();
        populateVariableTable();
        updateLegend();

        // Initial draw
        setTimeout(drawWaveform, 100);
    </script>
</body>
</html>
