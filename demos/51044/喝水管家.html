<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水知道 · 工位饮水小管家</title>
    <!-- Font Awesome 图标库 (免费) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #e9f4f8 0%, #d4e9f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 32px 28px;
            box-shadow: 0 20px 40px rgba(0, 30, 40, 0.15), 0 8px 20px rgba(0, 20, 30, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.2s ease;
        }

        /* 头部：品牌 + 状态 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            background: #2b7a8a;
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 6px 12px rgba(33, 107, 124, 0.25);
        }

        .logo-text {
            font-weight: 600;
            font-size: 22px;
            letter-spacing: -0.5px;
            color: #1b4c5a;
        }
        .logo-text small {
            font-weight: 400;
            font-size: 14px;
            color: #3b6e7e;
            margin-left: 4px;
        }

        .status-badge {
            background: rgba(43, 122, 138, 0.12);
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            color: #1b5a6a;
            border: 1px solid rgba(43, 122, 138, 0.15);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-badge i {
            font-size: 12px;
            color: #2b7a8a;
        }

        /* 圆形进度 + 水量 */
        .progress-ring-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 6px 0 16px 0;
        }

        .ring-container {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .ring-container svg {
            transform: rotate(-90deg);
            width: 200px;
            height: 200px;
        }

        .ring-bg {
            fill: none;
            stroke: rgba(43, 122, 138, 0.12);
            stroke-width: 10;
        }

        .ring-fg {
            fill: none;
            stroke: #2b7a8a;
            stroke-width: 10;
            stroke-linecap: round;
            stroke-dasharray: 502.4; /* 2*pi*80 ≈ 502.4 */
            stroke-dashoffset: 502.4;
            transition: stroke-dashoffset 0.5s ease;
        }

        .water-center {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #1b4c5a;
        }

        .water-ml {
            font-size: 44px;
            font-weight: 600;
            line-height: 1;
        }
        .water-ml span {
            font-size: 20px;
            font-weight: 400;
            color: #3f7b8b;
            margin-left: 4px;
        }
        .water-target {
            font-size: 16px;
            color: #3f6b7a;
            background: rgba(255,255,255,0.4);
            padding: 4px 16px;
            border-radius: 40px;
            margin-top: 6px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* 快捷加水按钮组 */
        .quick-add {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin: 20px 0 24px 0;
            flex-wrap: wrap;
        }

        .btn-water {
            background: white;
            border: none;
            border-radius: 60px;
            padding: 12px 18px;
            font-weight: 600;
            font-size: 18px;
            color: #1b4c5a;
            box-shadow: 0 4px 8px rgba(0, 20, 30, 0.04);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.15s;
            border: 1px solid rgba(43, 122, 138, 0.1);
            flex: 1 0 auto;
            justify-content: center;
            cursor: pointer;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(4px);
        }
        .btn-water i {
            color: #2b7a8a;
        }
        .btn-water:hover {
            background: white;
            box-shadow: 0 8px 16px rgba(43, 122, 138, 0.15);
            transform: scale(1.02);
            border-color: #2b7a8a50;
        }
        .btn-water:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: #2b7a8a;
            border: 1px solid #1f6371;
            color: white;
            box-shadow: 0 6px 14px rgba(43, 122, 138, 0.3);
            padding: 14px 24px;
            font-weight: 600;
            border-radius: 60px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(4px);
            border: none;
        }
        .btn-primary i {
            color: rgba(255,255,255,0.8);
        }
        .btn-primary:hover {
            background: #236a7a;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(33, 107, 124, 0.3);
        }
        .btn-primary:active {
            transform: scale(0.96);
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid rgba(43, 122, 138, 0.25);
            color: #1b5a6a;
            padding: 12px 22px;
            border-radius: 60px;
            font-weight: 500;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-outline:hover {
            background: rgba(43, 122, 138, 0.06);
            border-color: #2b7a8a;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin: 14px 0 18px 0;
            flex-wrap: wrap;
        }

        .reminder-area {
            background: rgba(255,255,255,0.4);
            backdrop-filter: blur(4px);
            border-radius: 60px;
            padding: 4px 4px 4px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255,255,255,0.5);
            flex: 1;
        }
        .reminder-area span {
            font-size: 15px;
            color: #1b4c5a;
            font-weight: 500;
        }
        .reminder-area span i {
            margin-right: 8px;
            color: #2b7a8a;
        }

        .toggle-reminder {
            background: #2b7a8a;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 2px 6px rgba(43, 122, 138, 0.2);
        }
        .toggle-reminder.off {
            background: #b0c9d2;
            box-shadow: none;
            color: #2d4d58;
        }

        .log-area {
            margin-top: 20px;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(4px);
            border-radius: 30px;
            padding: 18px 22px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #1f5b6b;
            font-weight: 500;
            margin-bottom: 12px;
            opacity: 0.8;
        }
        .log-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 110px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .log-item {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            color: #1b4c5a;
            padding: 4px 0;
            border-bottom: 1px dashed rgba(43, 122, 138, 0.08);
        }
        .log-item i {
            color: #2b7a8a;
            width: 22px;
        }
        .log-item .time {
            color: #3f7b8b;
            font-weight: 400;
        }
        .empty-log {
            color: #6d8f9b;
            font-size: 15px;
            text-align: center;
            padding: 10px 0;
        }
        .reset-btn {
            background: transparent;
            border: none;
            color: #4d7b8a;
            font-size: 13px;
            cursor: pointer;
            opacity: 0.6;
            transition: 0.1s;
        }
        .reset-btn:hover {
            opacity: 1;
            color: #1f5a6a;
        }

        .footer-note {
            margin-top: 16px;
            text-align: center;
            font-size: 13px;
            color: #4d7b8a;
            opacity: 0.7;
            letter-spacing: 0.3px;
        }

        /* scroll */
        .log-list::-webkit-scrollbar {
            width: 4px;
        }
        .log-list::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.02);
            border-radius: 10px;
        }
        .log-list::-webkit-scrollbar-thumb {
            background: #2b7a8a60;
            border-radius: 10px;
        }

        @media (max-width: 480px) {
            .card { padding: 24px 18px; }
            .ring-container { width: 160px; height: 160px; }
            .ring-container svg { width: 160px; height: 160px; }
            .water-ml { font-size: 34px; }
            .quick-add { gap: 8px; }
            .btn-water { font-size: 16px; padding: 10px 14px; }
        }
    </style>
</head>
<body>

<div class="card" id="app">
    <!-- 头部 -->
    <div class="header">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-droplet"></i></div>
            <div class="logo-text">水知道 <small>· 工位</small></div>
        </div>
        <div class="status-badge">
            <i class="fas fa-circle" style="color: #4bc0b0;"></i> 工作中
        </div>
    </div>

    <!-- 进度环 -->
    <div class="progress-ring-wrapper">
        <div class="ring-container">
            <svg viewBox="0 0 200 200">
                <circle class="ring-bg" cx="100" cy="100" r="80" />
                <circle class="ring-fg" id="ringFg" cx="100" cy="100" r="80" />
            </svg>
            <div class="water-center">
                <div class="water-ml"><span id="currentMl">0</span><span>ml</span></div>
                <div class="water-target">目标 2000 ml</div>
            </div>
        </div>
    </div>

    <!-- 快捷加水 -->
    <div class="quick-add">
        <button class="btn-water" @click="addWater(100)"><i class="fas fa-plus-circle"></i> 100ml</button>
        <button class="btn-water" @click="addWater(200)"><i class="fas fa-plus-circle"></i> 200ml</button>
        <button class="btn-water" @click="addWater(300)"><i class="fas fa-plus-circle"></i> 300ml</button>
    </div>

    <!-- 主要操作栏 -->
    <div class="action-bar">
        <div class="reminder-area">
            <span><i class="fas fa-clock"></i> 定时提醒</span>
            <button class="toggle-reminder" :class="{ off: !reminderActive }" @click="toggleReminder">
                {{ reminderActive ? '开启' : '关闭' }}
            </button>
        </div>
        <button class="btn-primary" @click="addWater(250)">
            <i class="fas fa-mug-saucer"></i> 一杯水
        </button>
    </div>

    <!-- 饮水记录 -->
    <div class="log-area">
        <div class="log-header">
            <span><i class="fas fa-list-ul" style="margin-right: 8px;"></i>今日饮水记录</span>
            <button class="reset-btn" @click="resetLog"><i class="fas fa-undo-alt"></i> 重置</button>
        </div>
        <div class="log-list" id="logList">
            <div v-if="logs.length === 0" class="empty-log">
                <i class="fas fa-mug-hot" style="margin-right: 6px;"></i> 还没有记录，喝一杯水吧
            </div>
            <div v-for="(log, index) in logs" :key="index" class="log-item">
                <span><i class="fas fa-tint"></i> {{ log.amount }} ml</span>
                <span class="time">{{ log.time }}</span>
            </div>
        </div>
    </div>

    <div class="footer-note">
        <i class="fas fa-bell" style="margin-right: 6px;"></i> 每小时提醒 · 喝够8杯水
    </div>
</div>

<!-- Vue 3 + 组合式 API -->
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
    const { createApp, ref, computed, watch, onMounted } = Vue;

    const app = createApp({
        setup() {
            // ---------- 响应式数据 ----------
            const totalMl = ref(0);               // 当前总饮水量 ml
            const targetMl = 2000;                 // 每日目标
            const logs = ref([]);                  // { amount, time }
            const reminderActive = ref(true);      // 提醒开关
            let reminderInterval = null;           // 定时器句柄

            // ---------- 计算属性 ----------
            const progressPercent = computed(() => {
                const p = Math.min(totalMl.value / targetMl, 1);
                return p * 100;
            });

            // 更新环形进度 (stroke-dashoffset)
            function updateRing(percent) {
                const ring = document.getElementById('ringFg');
                if (!ring) return;
                const circumference = 2 * Math.PI * 80; // 502.4
                const offset = circumference - (percent / 100) * circumference;
                ring.style.strokeDasharray = circumference;
                ring.style.strokeDashoffset = offset;
            }

            // ---------- 方法 ----------
            function addWater(amount) {
                if (amount <= 0) return;
                totalMl.value += amount;
                // 记录日志
                const now = new Date();
                const timeStr = now.getHours().toString().padStart(2, '0') + ':' +
                                now.getMinutes().toString().padStart(2, '0');
                logs.value.push({ amount, time: timeStr });
                // 自动滚动到底部
                nextTick(() => {
                    const list = document.getElementById('logList');
                    if (list) list.scrollTop = list.scrollHeight;
                });
                // 如果超过目标，温和提醒
                if (totalMl.value >= targetMl) {
                    setTimeout(() => {
                        alert('🎉 太棒啦！今日饮水目标已达成！继续加油～');
                    }, 100);
                }
            }

            function resetLog() {
                if (confirm('确定要重置今日饮水记录吗？')) {
                    totalMl.value = 0;
                    logs.value = [];
                }
            }

            // 定时提醒逻辑
            function toggleReminder() {
                reminderActive.value = !reminderActive.value;
                if (reminderActive.value) {
                    startReminder();
                } else {
                    stopReminder();
                }
            }

            function startReminder() {
                stopReminder(); // 清除旧定时器
                reminderInterval = setInterval(() => {
                    if (!reminderActive.value) return;
                    // 仅当在工作时间范围内 (9:00 ~ 18:00) 且 未达到目标时提醒
                    const now = new Date();
                    const hour = now.getHours();
                    const isWorking = hour >= 9 && hour < 18;
                    if (!isWorking) return;
                    if (totalMl.value >= targetMl) return; // 已达标不提醒

                    // 浏览器通知 + 页面内提醒
                    const msg = `💧 该喝水啦！ 当前已喝 ${totalMl.value} ml，目标 ${targetMl} ml`;
                    // 使用 Notification API (需用户授权)
                    if (Notification.permission === 'granted') {
                        new Notification('水知道 · 饮水提醒', {
                            body: msg,
                            icon: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Ccircle cx="50" cy="50" r="45" fill="%232b7a8a" /%3E%3Ctext x="50" y="68" font-size="50" text-anchor="middle" fill="white"%3E💧%3C/text%3E%3C/svg%3E',
                            silent: false,
                        });
                    } else if (Notification.permission === 'default') {
                        Notification.requestPermission();
                    }
                    // 页面内也显示提醒 (不依赖通知)
                    alert(`⏰ ${msg}`);
                }, 60 * 60 * 1000); // 每小时提醒一次
            }

            function stopReminder() {
                if (reminderInterval) {
                    clearInterval(reminderInterval);
                    reminderInterval = null;
                }
            }

            // 监听totalMl变化，更新环
            watch(totalMl, (newVal) => {
                const percent = Math.min((newVal / targetMl) * 100, 100);
                updateRing(percent);
                // 同步当前显示
                document.getElementById('currentMl').innerText = newVal;
            });

            // 生命周期: 挂载后初始化
            onMounted(() => {
                // 请求通知权限
                if ('Notification' in window && Notification.permission === 'default') {
                    Notification.requestPermission();
                }
                // 初始环
                updateRing(0);
                document.getElementById('currentMl').innerText = '0';
                // 若提醒开启，启动
                if (reminderActive.value) {
                    startReminder();
                }
            });

            // 清理定时器 (组件卸载时)
            // (Vue3 中 onBeforeUnmount)
            const { onBeforeUnmount } = Vue;
            onBeforeUnmount(() => {
                stopReminder();
            });

            // 为了模板中能使用 nextTick
            const { nextTick } = Vue;

            return {
                totalMl,
                logs,
                reminderActive,
                targetMl,
                progressPercent,
                addWater,
                resetLog,
                toggleReminder,
                nextTick,
            };
        }
    });

    app.mount('#app');
</script>
</body>
</html>
