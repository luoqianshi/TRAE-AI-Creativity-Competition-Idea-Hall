<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI智能出题 - 高考模拟智能刷题平台</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== CSS Custom Properties ===== */
:root {
  --navy: #1a365d;
  --navy-light: #2a4a7f;
  --navy-dark: #0f2340;
  --gold: #c9a227;
  --gold-light: #e0bc4a;
  --gold-dark: #a68520;
  --ivory: #faf8f5;
  --ivory-dark: #f0ece6;
  --ink: #2d3748;
  --ink-light: #4a5568;
  --ink-lighter: #718096;
  --white: #ffffff;
  --success: #38a169;
  --danger: #e53e3e;
  --warning: #dd6b20;
  --glass-bg: rgba(255,255,255,0.65);
  --glass-border: rgba(255,255,255,0.3);
  --glass-shadow: 0 8px 32px rgba(26,54,93,0.12);
  --radius: 16px;
  --radius-sm: 10px;
  --transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
  --font-heading: 'Noto Serif SC', serif;
  --font-body: 'Noto Sans SC', sans-serif;
}

/* ===== Reset & Base ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:var(--ivory);
  min-height:100vh;
  overflow-x:hidden;
  line-height:1.7;
}
button{cursor:pointer;font-family:var(--font-body);border:none;outline:none}
input,textarea,select{font-family:var(--font-body);outline:none}
a{text-decoration:none;color:inherit}

/* ===== Scrollbar ===== */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--navy-light);border-radius:3px}

/* ===== Particle Canvas ===== */
#particle-canvas{
  position:fixed;top:0;left:0;width:100%;height:100%;
  z-index:0;pointer-events:none;
}

/* ===== App Container ===== */
#app{position:relative;z-index:1}

/* ===== View Transitions ===== */
.view{
  display:none;
  animation:fadeSlideIn 0.5s cubic-bezier(0.4,0,0.2,1) forwards;
}
.view.active{display:block}
@keyframes fadeSlideIn{
  from{opacity:0;transform:translateY(24px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fadeSlideOut{
  from{opacity:1;transform:translateY(0)}
  to{opacity:0;transform:translateY(-24px)}
}

/* ===== Loading Overlay ===== */
#loading-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(26,54,93,0.85);
  backdrop-filter:blur(8px);
  z-index:9999;
  display:none;
  align-items:center;justify-content:center;
  flex-direction:column;gap:24px;
}
#loading-overlay.show{display:flex}
.loader-ring{
  width:64px;height:64px;
  border:4px solid rgba(255,255,255,0.2);
  border-top-color:var(--gold);
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{
  color:var(--white);font-size:1.1rem;
  font-family:var(--font-heading);letter-spacing:2px;
}
.loader-dots::after{
  content:'';animation:dots 1.5s steps(4,end) infinite;
}
@keyframes dots{
  0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}
}

/* ===== HERO SECTION ===== */
.hero{
  text-align:center;padding:80px 20px 40px;
  position:relative;
}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,var(--navy),var(--navy-light));
  color:var(--gold-light);padding:6px 20px;border-radius:20px;
  font-size:0.8rem;font-weight:500;letter-spacing:1px;
  margin-bottom:24px;
  animation:fadeInDown 0.6s ease;
}
.hero-badge svg{width:16px;height:16px;fill:var(--gold)}
.hero h1{
  font-family:var(--font-heading);
  font-size:clamp(2.4rem,6vw,4rem);
  font-weight:900;
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 50%,var(--gold) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:12px;
  animation:fadeInUp 0.6s ease 0.1s both;
}
.hero .subtitle{
  font-size:clamp(1rem,2.5vw,1.3rem);
  color:var(--ink-light);
  font-weight:300;letter-spacing:3px;
  animation:fadeInUp 0.6s ease 0.2s both;
}
.hero .subtitle span{color:var(--gold);font-weight:600}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}

/* ===== Section Titles ===== */
.section-title{
  font-family:var(--font-heading);
  font-size:1.4rem;font-weight:700;
  color:var(--navy);
  margin-bottom:20px;
  display:flex;align-items:center;gap:10px;
}
.section-title::before{
  content:'';width:4px;height:24px;
  background:linear-gradient(180deg,var(--gold),var(--navy));
  border-radius:2px;
}

/* ===== Container ===== */
.container{max-width:1100px;margin:0 auto;padding:0 20px}

/* ===== Subject Grid ===== */
.subject-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:16px;margin-bottom:40px;
}
.subject-card{
  position:relative;
  border-radius:var(--radius);
  padding:28px 16px 20px;
  text-align:center;
  cursor:pointer;
  transition:var(--transition);
  border:2px solid transparent;
  overflow:hidden;
  background:var(--glass-bg);
  backdrop-filter:blur(10px);
  box-shadow:var(--glass-shadow);
}
.subject-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  border-radius:var(--radius) var(--radius) 0 0;
  transition:var(--transition);
}
.subject-card.selected{
  border-color:var(--gold);
  transform:translateY(-4px);
  box-shadow:0 12px 40px rgba(201,162,39,0.2);
}
.subject-card.selected::after{
  content:'✓';position:absolute;top:10px;right:10px;
  width:22px;height:22px;border-radius:50%;
  background:var(--gold);color:var(--white);
  font-size:12px;display:flex;align-items:center;justify-content:center;
  font-weight:700;animation:popIn 0.3s cubic-bezier(0.175,0.885,0.32,1.275);
}
@keyframes popIn{from{transform:scale(0)}to{transform:scale(1)}}
.subject-card:hover{transform:translateY(-3px);box-shadow:0 12px 36px rgba(26,54,93,0.15)}
.subject-card .icon{
  width:52px;height:52px;margin:0 auto 12px;
  border-radius:14px;display:flex;align-items:center;justify-content:center;
  transition:var(--transition);
}
.subject-card .icon svg{width:28px;height:28px}
.subject-card .name{
  font-weight:600;font-size:1rem;color:var(--ink);
  margin-bottom:4px;
}
.subject-card .count{font-size:0.75rem;color:var(--ink-lighter)}

/* Subject colors */
.subject-card[data-subject="chinese"]::before{background:linear-gradient(90deg,#e53e3e,#fc8181)}
.subject-card[data-subject="chinese"] .icon{background:linear-gradient(135deg,#fed7d7,#feb2b2);color:#e53e3e}
.subject-card[data-subject="math"]::before{background:linear-gradient(90deg,#3182ce,#63b3ed)}
.subject-card[data-subject="math"] .icon{background:linear-gradient(135deg,#bee3f8,#90cdf4);color:#3182ce}
.subject-card[data-subject="english"]::before{background:linear-gradient(90deg,#38a169,#68d391)}
.subject-card[data-subject="english"] .icon{background:linear-gradient(135deg,#c6f6d5,#9ae6b4);color:#38a169}
.subject-card[data-subject="physics"]::before{background:linear-gradient(90deg,#805ad5,#b794f4)}
.subject-card[data-subject="physics"] .icon{background:linear-gradient(135deg,#e9d8fd,#d6bcfa);color:#805ad5}
.subject-card[data-subject="chemistry"]::before{background:linear-gradient(90deg,#dd6b20,#fbd38d)}
.subject-card[data-subject="chemistry"] .icon{background:linear-gradient(135deg,#fefcbf,#fef3c7);color:#dd6b20}
.subject-card[data-subject="biology"]::before{background:linear-gradient(90deg,#319795,#81e6d9)}
.subject-card[data-subject="biology"] .icon{background:linear-gradient(135deg,#b2f5ea,#81e6d9);color:#319795}

/* ===== Knowledge Points ===== */
.knowledge-section{margin-bottom:36px}
.knowledge-groups{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:12px;
}
.knowledge-group{
  background:var(--glass-bg);backdrop-filter:blur(10px);
  border-radius:var(--radius-sm);padding:16px;
  box-shadow:0 4px 16px rgba(26,54,93,0.06);
  border:1px solid rgba(255,255,255,0.5);
}
.knowledge-group h4{
  font-size:0.85rem;color:var(--navy);font-weight:600;
  margin-bottom:10px;
  display:flex;align-items:center;gap:6px;
}
.knowledge-group h4 .dot{
  width:6px;height:6px;border-radius:50%;background:var(--gold);
}
.kp-list{display:flex;flex-wrap:wrap;gap:6px}
.kp-tag{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 12px;border-radius:16px;
  font-size:0.78rem;cursor:pointer;
  border:1.5px solid var(--ivory-dark);
  background:var(--white);
  transition:var(--transition);
  user-select:none;
}
.kp-tag:hover{border-color:var(--navy-light);background:#edf2f7}
.kp-tag.selected{
  background:linear-gradient(135deg,var(--navy),var(--navy-light));
  color:var(--white);border-color:transparent;
}
.kp-tag input{display:none}

/* ===== Settings Row ===== */
.settings-row{
  display:flex;flex-wrap:wrap;gap:20px;margin-bottom:36px;
  align-items:flex-start;
}
.setting-group{flex:1;min-width:200px}
.setting-group label{
  display:block;font-size:0.85rem;font-weight:600;
  color:var(--navy);margin-bottom:10px;
}
.difficulty-options,.count-options{display:flex;gap:8px;flex-wrap:wrap}
.diff-btn,.count-btn{
  padding:8px 18px;border-radius:var(--radius-sm);
  background:var(--white);border:1.5px solid var(--ivory-dark);
  font-size:0.85rem;color:var(--ink);font-weight:500;
  transition:var(--transition);
}
.diff-btn:hover,.count-btn:hover{border-color:var(--navy-light);color:var(--navy)}
.diff-btn.selected{
  background:linear-gradient(135deg,var(--navy),var(--navy-light));
  color:var(--white);border-color:transparent;
}
.count-btn.selected{
  background:linear-gradient(135deg,var(--gold-dark),var(--gold));
  color:var(--white);border-color:transparent;
}
.diff-stars{margin-left:4px;font-size:0.7rem;color:var(--gold)}

/* ===== Generate Button ===== */
.generate-wrap{text-align:center;margin:40px 0 60px}
.btn-generate{
  position:relative;
  padding:18px 64px;
  font-size:1.2rem;font-weight:700;
  font-family:var(--font-heading);
  color:var(--white);
  background:linear-gradient(135deg,var(--navy),var(--navy-light));
  border-radius:50px;
  letter-spacing:3px;
  transition:var(--transition);
  overflow:hidden;
}
.btn-generate::before{
  content:'';position:absolute;inset:-2px;
  border-radius:52px;
  background:linear-gradient(135deg,var(--gold),var(--navy),var(--gold));
  z-index:-1;opacity:0;transition:var(--transition);
}
.btn-generate:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 32px rgba(26,54,93,0.3),0 0 60px rgba(201,162,39,0.15);
}
.btn-generate:hover::before{opacity:1}
.btn-generate:active{transform:translateY(0)}
.btn-generate .glow{
  position:absolute;top:50%;left:50%;
  width:200%;height:200%;
  background:radial-gradient(circle,rgba(201,162,39,0.2),transparent 70%);
  transform:translate(-50%,-50%);opacity:0;
  animation:none;
}
.btn-generate:hover .glow{animation:glowPulse 2s ease infinite}
@keyframes glowPulse{0%,100%{opacity:0.5}50%{opacity:1}}

/* ===== EXAM VIEW ===== */
.exam-header{
  background:linear-gradient(135deg,var(--navy),var(--navy-dark));
  color:var(--white);padding:16px 24px;
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:12px;
  box-shadow:0 4px 20px rgba(0,0,0,0.15);
}
.exam-header .subject-name{
  font-family:var(--font-heading);font-size:1.2rem;font-weight:700;
  display:flex;align-items:center;gap:10px;
}
.exam-header .subject-name .dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.exam-meta{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.exam-timer{
  display:flex;align-items:center;gap:6px;
  font-size:1.1rem;font-weight:600;
  font-variant-numeric:tabular-nums;
  padding:6px 16px;border-radius:20px;
  background:rgba(255,255,255,0.1);
}
.exam-timer.warning{color:#fc8181;animation:timerPulse 1s ease infinite}
@keyframes timerPulse{0%,100%{opacity:1}50%{opacity:0.5}}
.exam-timer svg{width:18px;height:18px;fill:currentColor}
.timer-btns{display:flex;gap:4px}
.timer-btn{
  background:rgba(255,255,255,0.15);color:var(--white);
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;transition:var(--transition);
}
.timer-btn:hover{background:rgba(255,255,255,0.25)}
.progress-wrap{flex:1;min-width:200px;max-width:400px}
.progress-label{font-size:0.75rem;margin-bottom:4px;opacity:0.8}
.progress-bar{
  height:6px;background:rgba(255,255,255,0.2);border-radius:3px;
  overflow:hidden;
}
.progress-fill{
  height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));
  border-radius:3px;transition:width 0.4s ease;width:0%;
}

/* ===== Exam Layout ===== */
.exam-body{display:flex;gap:20px;padding:24px;min-height:calc(100vh - 80px)}
.exam-main{flex:1;min-width:0}
.exam-sidebar{
  width:260px;flex-shrink:0;
  position:sticky;top:100px;align-self:flex-start;
}

/* ===== Answer Card ===== */
.answer-card{
  background:var(--glass-bg);backdrop-filter:blur(12px);
  border-radius:var(--radius);padding:20px;
  box-shadow:var(--glass-shadow);
  border:1px solid var(--glass-border);
}
.answer-card h3{
  font-family:var(--font-heading);font-size:1rem;
  color:var(--navy);margin-bottom:16px;
  padding-bottom:10px;border-bottom:1px solid var(--ivory-dark);
}
.answer-dots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.answer-dot{
  width:100%;aspect-ratio:1;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:0.75rem;font-weight:600;cursor:pointer;
  transition:var(--transition);
  border:2px solid var(--ivory-dark);
  background:var(--white);color:var(--ink-lighter);
}
.answer-dot.answered{
  background:var(--navy);color:var(--white);border-color:var(--navy);
}
.answer-dot.current{
  border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,0.2);
}
.answer-card .stats{
  display:flex;justify-content:center;gap:16px;
  padding-top:12px;border-top:1px solid var(--ivory-dark);
  font-size:0.8rem;color:var(--ink-lighter);
}
.answer-card .stats span{display:flex;align-items:center;gap:4px}
.answer-card .stats .stat-dot{
  width:8px;height:8px;border-radius:50%;
}

/* ===== Question Cards ===== */
.question-card{
  background:var(--glass-bg);backdrop-filter:blur(12px);
  border-radius:var(--radius);padding:28px;
  margin-bottom:20px;
  box-shadow:var(--glass-shadow);
  border:1px solid var(--glass-border);
  transition:var(--transition);
  animation:cardEnter 0.4s ease both;
}
.question-card:hover{box-shadow:0 12px 40px rgba(26,54,93,0.1)}
@keyframes cardEnter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.q-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.q-number{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--navy),var(--navy-light));
  color:var(--white);font-weight:700;font-size:0.9rem;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.q-type{
  padding:3px 10px;border-radius:12px;font-size:0.72rem;font-weight:600;
}
.q-type.choice{background:#ebf8ff;color:#2b6cb0}
.q-type.fill{background:#f0fff4;color:#276749}
.q-type.essay{background:#faf5ff;color:#6b46c1}
.q-diff{margin-left:auto;font-size:0.75rem;color:var(--gold)}
.q-content{font-size:1rem;line-height:1.9;margin-bottom:20px}

/* Choice Options */
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.option-item{
  display:flex;align-items:center;gap:12px;
  padding:14px 18px;border-radius:var(--radius-sm);
  border:1.5px solid var(--ivory-dark);
  background:var(--white);
  cursor:pointer;transition:var(--transition);
}
.option-item:hover{border-color:var(--navy-light);background:#f7fafc}
.option-item.selected{border-color:var(--navy);background:linear-gradient(135deg,rgba(26,54,93,0.05),rgba(42,74,127,0.08))}
.option-circle{
  width:28px;height:28px;border-radius:50%;
  border:2px solid var(--ivory-dark);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:var(--transition);
  font-size:0.8rem;font-weight:600;color:var(--ink-lighter);
}
.option-item.selected .option-circle{
  border-color:var(--navy);background:var(--navy);color:var(--white);
}
.option-text{font-size:0.95rem}

/* Fill Inputs */
.fill-input{
  width:100%;padding:12px 4px;
  border:none;border-bottom:2px solid var(--ivory-dark);
  background:transparent;font-size:1rem;
  color:var(--ink);transition:var(--transition);
}
.fill-input:focus{border-bottom-color:var(--navy)}
.fill-input::placeholder{color:var(--ink-lighter)}

/* Essay Textarea */
.essay-area{
  width:100%;min-height:140px;padding:14px;
  border:1.5px solid var(--ivory-dark);
  border-radius:var(--radius-sm);
  background:var(--white);
  font-size:0.95rem;color:var(--ink);
  resize:vertical;transition:var(--transition);
  line-height:1.8;
}
.essay-area:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(26,54,93,0.08)}
.char-count{text-align:right;font-size:0.75rem;color:var(--ink-lighter);margin-top:6px}

/* ===== Exam Navigation ===== */
.exam-nav{
  display:flex;justify-content:space-between;align-items:center;
  padding:20px 0;margin-top:10px;
}
.btn-nav{
  padding:10px 28px;border-radius:var(--radius-sm);
  font-weight:600;font-size:0.9rem;
  transition:var(--transition);
}
.btn-prev{
  background:var(--white);color:var(--ink);
  border:1.5px solid var(--ivory-dark);
}
.btn-prev:hover{border-color:var(--navy-light);color:var(--navy)}
.btn-next{
  background:linear-gradient(135deg,var(--navy),var(--navy-light));
  color:var(--white);
}
.btn-next:hover{box-shadow:0 4px 16px rgba(26,54,93,0.25)}
.btn-submit{
  background:linear-gradient(135deg,var(--gold-dark),var(--gold));
  color:var(--white);padding:12px 36px;
  border-radius:var(--radius-sm);font-weight:700;font-size:1rem;
  transition:var(--transition);
}
.btn-submit:hover{box-shadow:0 4px 20px rgba(201,162,39,0.35);transform:translateY(-1px)}

/* ===== RESULTS VIEW ===== */
.results-hero{
  text-align:center;padding:50px 20px 30px;
}
.results-hero h2{
  font-family:var(--font-heading);font-size:2rem;
  color:var(--navy);margin-bottom:30px;
}

/* Score Ring */
.score-ring-wrap{
  width:220px;height:220px;margin:0 auto 30px;
  position:relative;
}
.score-ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.score-ring-bg{fill:none;stroke:var(--ivory-dark);stroke-width:10}
.score-ring-fill{
  fill:none;stroke:var(--gold);stroke-width:10;
  stroke-linecap:round;
  stroke-dasharray:628;stroke-dashoffset:628;
  transition:stroke-dashoffset 1.5s cubic-bezier(0.4,0,0.2,1);
}
.score-center{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);text-align:center;
}
.score-number{
  font-family:var(--font-heading);font-size:3rem;
  font-weight:900;color:var(--navy);line-height:1;
}
.score-label{font-size:0.85rem;color:var(--ink-lighter);margin-top:4px}
.score-grade{
  margin-top:8px;font-size:1rem;font-weight:700;
  padding:4px 16px;border-radius:20px;display:inline-block;
}
.score-grade.excellent{background:#c6f6d5;color:#276749}
.score-grade.good{background:#bee3f8;color:#2a4365}
.score-grade.average{background:#fefcbf;color:#975a16}
.score-grade.poor{background:#fed7d7;color:#9b2c2c}

/* Breakdown */
.score-breakdown{
  display:flex;justify-content:center;gap:40px;
  margin:30px 0;flex-wrap:wrap;
}
.breakdown-item{text-align:center}
.breakdown-item .num{
  font-size:2rem;font-weight:800;
  font-family:var(--font-heading);line-height:1;
}
.breakdown-item .label{font-size:0.8rem;color:var(--ink-lighter);margin-top:4px}
.breakdown-item.correct .num{color:var(--success)}
.breakdown-item.wrong .num{color:var(--danger)}
.breakdown-item.skipped .num{color:var(--ink-lighter)}

/* Time Used */
.time-used{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin:20px 0;color:var(--ink-lighter);font-size:0.9rem;
}
.time-used svg{width:18px;height:18px;fill:var(--ink-lighter)}

/* Radar Chart */
.radar-section{
  max-width:500px;margin:30px auto;
  background:var(--glass-bg);backdrop-filter:blur(12px);
  border-radius:var(--radius);padding:24px;
  box-shadow:var(--glass-shadow);
  border:1px solid var(--glass-border);
}
.radar-section h3{
  font-family:var(--font-heading);font-size:1.1rem;
  color:var(--navy);text-align:center;margin-bottom:16px;
}
#radar-canvas{width:100%;max-width:400px;display:block;margin:0 auto}

/* Question Analysis */
.analysis-section{
  max-width:800px;margin:30px auto;padding:0 20px;
}
.analysis-section h3{
  font-family:var(--font-heading);font-size:1.3rem;
  color:var(--navy);margin-bottom:20px;
  display:flex;align-items:center;gap:10px;
}
.analysis-card{
  background:var(--glass-bg);backdrop-filter:blur(12px);
  border-radius:var(--radius);padding:24px;
  margin-bottom:16px;
  box-shadow:var(--glass-shadow);
  border:1px solid var(--glass-border);
  border-left:4px solid var(--ivory-dark);
  animation:cardEnter 0.4s ease both;
}
.analysis-card.correct{border-left-color:var(--success)}
.analysis-card.wrong{border-left-color:var(--danger)}
.analysis-card.skipped{border-left-color:var(--ink-lighter)}
.analysis-q{
  font-weight:600;margin-bottom:12px;
  display:flex;align-items:flex-start;gap:10px;
}
.analysis-icon{
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:14px;color:var(--white);font-weight:700;
}
.analysis-card.correct .analysis-icon{background:var(--success)}
.analysis-card.wrong .analysis-icon{background:var(--danger)}
.analysis-card.skipped .analysis-icon{background:var(--ink-lighter)}
.analysis-answers{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
  margin:12px 0;padding:12px;border-radius:var(--radius-sm);
  background:rgba(0,0,0,0.02);font-size:0.9rem;
}
.analysis-answers .label{font-weight:600;color:var(--ink-lighter);font-size:0.8rem;margin-bottom:2px}
.analysis-answers .value{color:var(--ink)}
.analysis-explain{
  font-size:0.9rem;color:var(--ink-light);
  line-height:1.8;padding:12px;
  background:rgba(26,54,93,0.03);border-radius:var(--radius-sm);
  margin-top:12px;
}
.analysis-explain::before{content:'💡 解析：';font-weight:600;color:var(--navy)}

/* Results Actions */
.results-actions{
  display:flex;justify-content:center;gap:16px;
  padding:40px 20px 60px;flex-wrap:wrap;
}
.btn-action{
  padding:12px 32px;border-radius:var(--radius-sm);
  font-weight:600;font-size:0.95rem;transition:var(--transition);
}
.btn-home{
  background:var(--white);color:var(--navy);
  border:1.5px solid var(--navy);
}
.btn-home:hover{background:var(--navy);color:var(--white)}
.btn-retry{
  background:linear-gradient(135deg,var(--gold-dark),var(--gold));
  color:var(--white);
}
.btn-retry:hover{box-shadow:0 4px 20px rgba(201,162,39,0.35)}

/* ===== WRONG BOOK VIEW ===== */
.wrongbook-header{
  background:linear-gradient(135deg,var(--navy),var(--navy-dark));
  color:var(--white);padding:40px 20px;text-align:center;
}
.wrongbook-header h2{
  font-family:var(--font-heading);font-size:1.8rem;margin-bottom:8px;
}
.wrongbook-header p{opacity:0.7;font-size:0.9rem}
.wrongbook-body{max-width:900px;margin:0 auto;padding:24px 20px 60px}
.wrong-subject-group{margin-bottom:30px}
.wrong-subject-title{
  font-family:var(--font-heading);font-size:1.1rem;
  color:var(--navy);font-weight:700;
  padding:10px 0;border-bottom:2px solid var(--gold);
  margin-bottom:16px;display:flex;align-items:center;gap:8px;
}
.wrong-q-card{
  background:var(--glass-bg);backdrop-filter:blur(12px);
  border-radius:var(--radius);padding:20px;
  margin-bottom:12px;
  box-shadow:var(--glass-shadow);
  border:1px solid var(--glass-border);
}
.wrong-q-content{font-size:0.95rem;margin-bottom:12px;line-height:1.8}
.wrong-q-answers{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  margin-bottom:12px;font-size:0.88rem;
}
.wrong-q-answers .your{color:var(--danger)}
.wrong-q-answers .correct{color:var(--success)}
.wrong-q-analysis{
  font-size:0.85rem;color:var(--ink-light);
  padding:10px;background:rgba(26,54,93,0.03);
  border-radius:var(--radius-sm);margin-bottom:12px;line-height:1.7;
}
.wrong-q-actions{display:flex;gap:8px}
.btn-sm{
  padding:6px 16px;border-radius:8px;
  font-size:0.8rem;font-weight:600;transition:var(--transition);
}
.btn-retry-q{background:var(--navy);color:var(--white)}
.btn-retry-q:hover{background:var(--navy-light)}
.btn-remove-q{background:var(--ivory-dark);color:var(--ink-light)}
.btn-remove-q:hover{background:#e2e8f0}

/* Empty State */
.empty-state{
  text-align:center;padding:60px 20px;
}
.empty-state .empty-icon{
  width:120px;height:120px;margin:0 auto 24px;
  background:var(--ivory-dark);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:3rem;
}
.empty-state h3{
  font-family:var(--font-heading);font-size:1.3rem;
  color:var(--navy);margin-bottom:8px;
}
.empty-state p{color:var(--ink-lighter);font-size:0.9rem}
.btn-back-home{
  margin-top:20px;padding:10px 28px;border-radius:var(--radius-sm);
  background:var(--navy);color:var(--white);font-weight:600;
  transition:var(--transition);
}
.btn-back-home:hover{background:var(--navy-light)}

/* ===== Floating Wrong Book Button ===== */
.fab-wrongbook{
  position:fixed;bottom:30px;right:30px;
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,var(--navy),var(--navy-light));
  color:var(--white);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 24px rgba(26,54,93,0.3);
  z-index:200;transition:var(--transition);
  font-size:22px;
}
.fab-wrongbook:hover{transform:translateY(-3px);box-shadow:0 10px 32px rgba(26,54,93,0.4)}
.fab-badge{
  position:absolute;top:-4px;right:-4px;
  min-width:20px;height:20px;border-radius:10px;
  background:var(--danger);color:var(--white);
  font-size:0.7rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  padding:0 5px;
}
.fab-badge:empty{display:none}

/* ===== Back Button ===== */
.btn-back{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 16px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,0.1);color:var(--white);
  font-size:0.85rem;font-weight:500;
  transition:var(--transition);margin-bottom:8px;
}
.btn-back:hover{background:rgba(255,255,255,0.2)}

/* ===== Responsive ===== */
@media(max-width:768px){
  .exam-body{flex-direction:column;padding:16px}
  .exam-sidebar{
    width:100%;position:static;
    order:-1;
  }
  .answer-dots{grid-template-columns:repeat(8,1fr)}
  .options{grid-template-columns:1fr}
  .settings-row{flex-direction:column}
  .subject-grid{grid-template-columns:repeat(3,1fr)}
  .analysis-answers{grid-template-columns:1fr}
  .wrong-q-answers{grid-template-columns:1fr}
  .score-breakdown{gap:24px}
  .hero h1{font-size:2.2rem}
  .exam-header{padding:12px 16px}
}
@media(max-width:480px){
  .subject-grid{grid-template-columns:repeat(2,1fr)}
  .answer-dots{grid-template-columns:repeat(6,1fr)}
  .exam-header{flex-direction:column;align-items:stretch}
  .exam-meta{justify-content:center}
}
</style>
</head>
<body>

<!-- Particle Canvas Background -->
<canvas id="particle-canvas"></canvas>

<!-- Loading Overlay -->
<div id="loading-overlay">
  <div class="loader-ring"></div>
  <div class="loader-text">AI智能生成中<span class="loader-dots"></span></div>
</div>

<!-- Floating Wrong Book Button -->
<button class="fab-wrongbook" id="fab-wrongbook" title="错题本" onclick="showView('wrongbook')">
  📖
  <span class="fab-badge" id="fab-badge"></span>
</button>

<div id="app">
  <!-- ===== HOME VIEW ===== -->
  <div id="home-view" class="view active">
    <div class="hero">
      <div class="hero-badge">
        <svg viewBox="0 0 24 24"><path d="M12 2L1 12h3v9h6v-6h4v6h6v-9h3L12 2z"/></svg>
        AI POWERED · 高考智能
      </div>
      <h1>AI智能出题</h1>
      <p class="subtitle">高考模拟<span>智能刷题</span>平台</p>
    </div>

    <div class="container">
      <!-- Subject Selection -->
      <div class="section-title">选择科目</div>
      <div class="subject-grid" id="subject-grid"></div>

      <!-- Knowledge Points -->
      <div class="knowledge-section" id="knowledge-section" style="display:none">
        <div class="section-title">知识点筛选</div>
        <div class="knowledge-groups" id="knowledge-groups"></div>
      </div>

      <!-- Settings -->
      <div class="settings-row">
        <div class="setting-group">
          <label>难度等级</label>
          <div class="difficulty-options" id="difficulty-options">
            <button class="diff-btn" data-diff="1" onclick="selectDifficulty(1)">基础巩固 <span class="diff-stars">★</span></button>
            <button class="diff-btn" data-diff="2" onclick="selectDifficulty(2)">能力提升 <span class="diff-stars">★★</span></button>
            <button class="diff-btn selected" data-diff="3" onclick="selectDifficulty(3)">综合突破 <span class="diff-stars">★★★</span></button>
            <button class="diff-btn" data-diff="4" onclick="selectDifficulty(4)">高考真题 <span class="diff-stars">★★★★</span></button>
          </div>
        </div>
        <div class="setting-group">
          <label>题目数量</label>
          <div class="count-options" id="count-options">
            <button class="count-btn" data-count="5" onclick="selectCount(5)">5题</button>
            <button class="count-btn selected" data-count="10" onclick="selectCount(10)">10题</button>
            <button class="count-btn" data-count="15" onclick="selectCount(15)">15题</button>
            <button class="count-btn" data-count="20" onclick="selectCount(20)">20题</button>
          </div>
        </div>
      </div>

      <!-- Generate Button -->
      <div class="generate-wrap">
        <button class="btn-generate" onclick="generateExam()">
          <span class="glow"></span>
          开始生成
        </button>
      </div>
    </div>
  </div>

  <!-- ===== EXAM VIEW ===== -->
  <div id="exam-view" class="view">
    <div class="exam-header">
      <div class="subject-name">
        <span class="dot"></span>
        <span id="exam-subject-name"></span>
      </div>
      <div class="exam-meta">
        <div class="exam-timer" id="exam-timer">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.4 0-8-3.6-8-8s3.6-8 8-8 8 3.6 8 8-3.6 8-8 8zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7V7z"/></svg>
          <span id="timer-text">30:00</span>
        </div>
        <div class="timer-btns">
          <button class="timer-btn" id="btn-pause" onclick="toggleTimer()" title="暂停/继续">⏸</button>
        </div>
      </div>
      <div class="progress-wrap">
        <div class="progress-label">答题进度 <span id="progress-text">0/0</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
    </div>
    <div class="exam-body">
      <div class="exam-main" id="exam-questions"></div>
      <div class="exam-sidebar">
        <div class="answer-card">
          <h3>答题卡</h3>
          <div class="answer-dots" id="answer-dots"></div>
          <div class="stats">
            <span><span class="stat-dot" style="background:var(--navy)"></span> 已答 <strong id="stat-answered">0</strong></span>
            <span><span class="stat-dot" style="background:var(--ivory-dark)"></span> 未答 <strong id="stat-unanswered">0</strong></span>
          </div>
        </div>
        <div class="exam-nav">
          <button class="btn-nav btn-prev" onclick="prevQuestion()">← 上一题</button>
          <button class="btn-nav btn-next" onclick="nextQuestion()">下一题 →</button>
        </div>
        <div style="text-align:center;margin-top:12px">
          <button class="btn-submit" onclick="submitExam()">交卷</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== RESULTS VIEW ===== -->
  <div id="results-view" class="view">
    <div class="results-hero">
      <div class="section-title" style="justify-content:center">考试报告</div>
      <h2 id="results-subject-name"></h2>
      <div class="score-ring-wrap">
        <svg viewBox="0 0 220 220">
          <circle class="score-ring-bg" cx="110" cy="110" r="100"/>
          <circle class="score-ring-fill" id="score-ring-fill" cx="110" cy="110" r="100"/>
        </svg>
        <div class="score-center">
          <div class="score-number" id="score-number">0</div>
          <div class="score-label">得分</div>
          <div class="score-grade" id="score-grade"></div>
        </div>
      </div>
      <div class="score-breakdown">
        <div class="breakdown-item correct">
          <div class="num" id="result-correct">0</div>
          <div class="label">✓ 正确</div>
        </div>
        <div class="breakdown-item wrong">
          <div class="num" id="result-wrong">0</div>
          <div class="label">✗ 错误</div>
        </div>
        <div class="breakdown-item skipped">
          <div class="num" id="result-skipped">0</div>
          <div class="label">— 未答</div>
        </div>
      </div>
      <div class="time-used">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.4 0-8-3.6-8-8s3.6-8 8-8 8 3.6 8 8-3.6 8-8 8zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7V7z"/></svg>
        用时：<strong id="result-time">0分0秒</strong>
      </div>
    </div>

    <!-- Radar Chart -->
    <div class="radar-section">
      <h3>知识点掌握雷达图</h3>
      <canvas id="radar-canvas" width="400" height="400"></canvas>
    </div>

    <!-- Question Analysis -->
    <div class="analysis-section">
      <h3>📋 题目详解</h3>
      <div id="analysis-list"></div>
    </div>

    <div class="results-actions">
      <button class="btn-action btn-home" onclick="showView('home')">🏠 返回首页</button>
      <button class="btn-action btn-retry" onclick="generateExam()">🔄 再做一套</button>
    </div>
  </div>

  <!-- ===== WRONG BOOK VIEW ===== -->
  <div id="wrongbook-view" class="view">
    <div class="wrongbook-header">
      <button class="btn-back" onclick="goBackFromWrongbook()">← 返回</button>
      <h2>📖 错题本</h2>
      <p>记录每一次错误，进步从此开始</p>
    </div>
    <div class="wrongbook-body" id="wrongbook-body"></div>
  </div>
</div>

<script>

   answer:'B',analysis:'"拍手称快"指拍着手喊痛快，多用来形容仇恨得到消除或正义得到伸张时高兴的样子。用于形容演讲精彩不恰当，应改为"拍手叫好"或"赞不绝口"。',knowledgePoints:['成语','语言运用']},

  {id:'c7',subject:'chinese',topic:'现代文阅读',difficulty:3,type:'choice',
   content:'阅读下面的语段，回答问题。\n\n"月光如流水一般，静静地泻在这一片叶子和花上。薄薄的青雾浮起在荷塘里。叶子和花仿佛在牛乳中洗过一样；又像笼着轻纱的梦。"\n\n对这段文字赏析不正确的一项是（　）',
   options:['运用了比喻手法，将月光比作流水，写出月光的流动感',
            '"泻"字用得精妙，化静为动，赋予月光动态美',
            '"牛乳"的比喻表现了月色的朦胧柔和',
            '"笼着轻纱的梦"是暗喻，写出了荷塘的神秘感'],
   answer:'D',analysis:'"笼着轻纱的梦"使用的是明喻（有本体、喻词"像"、喻体），而非暗喻。暗喻的标志是"是""成为"等判断词。这段话出自朱自清《荷塘月色》，运用多种修辞手法营造了优美的意境。',knowledgePoints:['散文','修辞鉴赏']},

  {id:'c8',subject:'chinese',topic:'语言表达',difficulty:2,type:'choice',
   content:'下列各句中，没有语病的一项是（　）',
   options:['通过这次活动，使我们开阔了眼界',
            '为了防止这类事故不再发生，我们必须采取有效措施',
            '我们能否取得好成绩，关键在于平时的努力',
            '这本书的内容和形式都很丰富'],
   answer:'C',analysis:'A缺主语（"通过"和"使"不能同时使用）；B否定不当，"防止"与"不再"双重否定等于肯定；D搭配不当，"内容"不能说"丰富"。C项表述正确，两面对一面的表达是恰当的。',knowledgePoints:['病句辨析','语言运用']},

  // ===== 数学 (Math) =====
  {id:'m1',subject:'math',topic:'集合与逻辑',difficulty:1,type:'choice',
   content:'设集合A={1,2,3,4}，B={2,4,6}，则A∩B=（　）',
   options:['{2,4}','{1,2,3,4,6}','{1,3}','{6}'],
   answer:'A',analysis:'A∩B表示A和B的交集，即同时属于A和B的元素。A={1,2,3,4}，B={2,4,6}，公共元素为2和4，所以A∩B={2,4}。',knowledgePoints:['集合','交集']},

  {id:'m2',subject:'math',topic:'函数',difficulty:2,type:'choice',
   content:'函数f(x)=ln(x-1)的定义域为（　）',
   options:['(0,+∞)','(1,+∞)','[1,+∞)','(-∞,1)'],
   answer:'B',analysis:'对数函数ln(u)要求真数u>0，即x-1>0，解得x>1。所以定义域为(1,+∞)。',knowledgePoints:['函数','定义域','对数函数']},

  {id:'m3',subject:'math',topic:'三角函数',difficulty:3,type:'choice',
   content:'已知sinα+cosα=√2，则sin2α=（　）',
   options:['1','√2','1/2','0'],
   answer:'A',analysis:'将sinα+cosα=√2两边平方得：sin²α+2sinαcosα+cos²α=2，即1+sin2α=2，所以sin2α=1。',knowledgePoints:['三角函数','二倍角公式']},

  {id:'m4',subject:'math',topic:'导数',difficulty:3,type:'fill',
   content:'已知函数f(x)=x³-3x²+2，求f\'(x)=________，函数f(x)在x=1处的切线方程为________。',
   answer:'f\'(x)=3x²-6x；y=-1（或y+1=0）',analysis:'f\'(x)=3x²-6x。当x=1时，f(1)=1-3+2=0，f\'(1)=3-6=-3。切线方程：y-0=-3(x-1)，即y=-3x+3。注意：若题目简化问f\'(1)的值，则f\'(1)=-3。',knowledgePoints:['导数','切线方程']},

  {id:'m5',subject:'math',topic:'数列',difficulty:2,type:'choice',
   content:'等差数列{aₙ}中，a₁=2，公差d=3，则a₁₀=（　）',
   options:['26','27','29','30'],
   answer:'C',analysis:'等差数列通项公式：aₙ=a₁+(n-1)d=2+(10-1)×3=2+27=29。',knowledgePoints:['等差数列','通项公式']},

  {id:'m6',subject:'math',topic:'立体几何',difficulty:3,type:'choice',
   content:'一个正方体的棱长为2，则其外接球的半径为（　）',
   options:['√2','√3','2','2√3'],
   answer:'B',analysis:'正方体外接球的直径等于正方体的体对角线长度。体对角线=√(2²+2²+2²)=√12=2√3，所以外接球半径R=√3。',knowledgePoints:['立体几何','正方体','外接球']},

  {id:'m7',subject:'math',topic:'概率统计',difficulty:2,type:'choice',
   content:'将一枚均匀的硬币抛掷两次，至少出现一次正面朝上的概率为（　）',
   options:['1/4','1/2','3/4','1'],
   answer:'C',analysis:'两次抛掷共有4种等可能结果：{正正,正反,反正,反反}。至少一次正面的对立事件是两次都反面，概率为1/4。所以至少一次正面的概率=1-1/4=3/4。',knowledgePoints:['概率','古典概型']},

  {id:'m8',subject:'math',topic:'解析几何',difficulty:4,type:'choice',
   content:'椭圆x²/4+y²/3=1的离心率为（　）',
   options:['1/2','√3/2','1/4','√7/4'],
   answer:'A',analysis:'a²=4, b²=3，c²=a²-b²=4-3=1，c=1。离心率e=c/a=1/2。',knowledgePoints:['椭圆','离心率','解析几何']},

  {id:'m9',subject:'math',topic:'不等式',difficulty:1,type:'fill',
   content:'不等式x²-4x+3<0的解集为________。',
   answer:'(1,3)（或{x|1<x<3}）',analysis:'x²-4x+3=(x-1)(x-3)<0。因为二次函数开口向上，所以在两根之间取负值，解集为(1,3)。',knowledgePoints:['一元二次不等式','解不等式']},

  {id:'e1',subject:'english',topic:'语法',difficulty:1,type:'choice',

   answer:'B',analysis:'句中有明确的时间状语"yesterday"，表示过去发生的动作，应使用一般过去时。go的过去式为went。',knowledgePoints:['一般过去时','动词时态']},

  {id:'e2',subject:'english',topic:'词汇',difficulty:2,type:'choice',
   content:'The teacher asked us to ______ the article in our own words.',
   options:['retell','rebuild','reconsider','replace'],
   answer:'A',analysis:'retell意为"复述"，符合语境——老师要求我们用自己的话复述文章。rebuild（重建）、reconsider（重新考虑）、replace（替换）均不符合。',knowledgePoints:['词汇辨析','动词']},

  {id:'e3',subject:'english',topic:'阅读理解',difficulty:3,type:'choice',
   content:'"The initiative has been well received, with over 10,000 participants signing up within the first week." What does "well received" mean in this context?',
   options:['被很好地接受','被很好地收到','被很好地接待','被很好地理解'],

  {id:'e4',subject:'english',topic:'写作',difficulty:3,type:'fill',
   content:'用适当的连接词完成下面的句子：\n\n1. ______ it rains tomorrow, we will cancel the picnic. (如果)\n2. He has been studying hard ______ he wants to pass the exam. (因为)\n3. She couldn\'t go to the party ______ she was ill. (因为)',
   answer:'1. If  2. because/since  3. because/since/as',analysis:'1. If引导条件状语从句；2/3. because/since/as都可以引导原因状语从句。注意if引导的条件从句要用一般现在时表示将来。',knowledgePoints:['连词','状语从句']},

  {id:'e5',subject:'english',topic:'语法',difficulty:2,type:'choice',
   content:'If I ______ you, I would take the job without hesitation.',
   options:['am','was','were','be'],
   answer:'C',analysis:'这是虚拟语气的条件句，表示与现在事实相反的假设。在虚拟条件句中，无论主语是什么人称，be动词一律用were。',knowledgePoints:['虚拟语气','条件句']},

  {id:'e6',subject:'english',topic:'完形填空',difficulty:3,type:'choice',

  {id:'e7',subject:'english',topic:'翻译',difficulty:2,type:'essay',
   content:'将以下句子翻译成英文：\n\n"随着科技的发展，人工智能已经深刻地改变了我们的生活方式。"',
   answer:'With the development of technology, artificial intelligence has profoundly changed our way of life.',analysis:'注意：随着...的翻译使用with短语或as引导的从句；"深刻地"可用profoundly或deeply；"生活方式"翻译为way of life或lifestyle。时态使用现在完成时表示对现在的影响。',knowledgePoints:['英汉互译','科技话题']},

  {id:'e8',subject:'english',topic:'语法',difficulty:4,type:'choice',

   answer:'B',analysis:'Not only位于句首时，其所在的分句需要部分倒装（助动词提前）。时态为过去时，所以用did he read。注意：but also后面的分句不倒装。',knowledgePoints:['倒装句','not only...but also']},

  // ===== 物理 (Physics) =====
  {id:'p1',subject:'physics',topic:'力学',difficulty:1,type:'choice',
   content:'一个质量为2kg的物体，在水平面上受到10N的水平推力，物体做匀速直线运动。则物体受到的摩擦力大小为（　）',
   options:['5N','10N','20N','无法确定'],
   answer:'B',analysis:'物体做匀速直线运动，处于平衡状态，合力为零。水平方向上推力与摩擦力大小相等、方向相反，所以摩擦力F_f=F=10N。',knowledgePoints:['牛顿第一定律','摩擦力','平衡状态']},

  {id:'p2',subject:'physics',topic:'运动学',difficulty:2,type:'choice',
   content:'一个物体从静止开始做匀加速直线运动，前3秒内的位移为9m，则物体的加速度为（　）',
   options:['1m/s²','2m/s²','3m/s²','6m/s²'],
   answer:'B',analysis:'由位移公式x=½at²，代入x=9m，t=3s：9=½×a×9，解得a=2m/s²。',knowledgePoints:['匀加速直线运动','运动学公式']},

  {id:'p3',subject:'physics',topic:'电磁学',difficulty:3,type:'choice',
   content:'在匀强磁场中，一个带电粒子做匀速圆周运动。若粒子的速度增大为原来的2倍，则圆周运动的半径变为原来的（　）',
   options:['2倍','4倍','1/2倍','不变'],
   answer:'A',analysis:'带电粒子在磁场中做圆周运动的半径r=mv/(qB)。当速度v增大为2倍时，r也增大为2倍（m、q、B不变）。',knowledgePoints:['洛伦兹力','带电粒子在磁场中运动']},

  {id:'p4',subject:'physics',topic:'能量',difficulty:3,type:'fill',
   content:'一个质量为0.5kg的小球从10m高处自由落下（g取10m/s²），不计空气阻力。小球落地时的动能为________J，落地时的速度为________m/s。',
   answer:'50J；√200m/s≈14.1m/s',analysis:'由机械能守恒：mgh=½mv²，代入数据：0.5×10×10=½×0.5×v²，解得v=√(200)≈14.1m/s。落地动能Ek=mgh=50J。',knowledgePoints:['机械能守恒','自由落体']},

  {id:'p5',subject:'physics',topic:'光学',difficulty:2,type:'choice',
   content:'一束光从空气射入水中，入射角为60°，水的折射率为4/3。则折射角的正弦值为（　）',
   options:['1/2','√3/2','3√3/8','√3/4'],
   answer:'C',analysis:'根据折射定律n₁sinθ₁=n₂sinθ₂，即1×sin60°=(4/3)×sinθ₂。sin60°=√3/2，所以sinθ₂=(3√3)/8。',knowledgePoints:['折射定律','几何光学']},

  {id:'p6',subject:'physics',topic:'热学',difficulty:1,type:'choice',
   content:'一定质量的理想气体，在等温过程中，体积增大为原来的2倍，则压强变为原来的（　）',
   options:['2倍','1/2倍','4倍','不变'],
   answer:'B',analysis:'根据玻意耳定律（等温过程）：PV=C（常数）。体积增大为2倍，则压强变为原来的1/2。',knowledgePoints:['玻意耳定律','气体状态方程']},

  {id:'p7',subject:'physics',topic:'力学',difficulty:4,type:'choice',
   content:'如图所示，一个质量为M的斜面体放在光滑水平面上，斜面光滑，倾角为θ。一个质量为m的物体从斜面顶端由静止滑下。在物体下滑过程中，斜面体的加速度大小为（　）',
   options:['mg sinθ/M','mg sin²θ/(M+m sin²θ)','mg sinθ cosθ/M','mg sinθ cosθ/(M+m)'],
   answer:'B',analysis:'由于水平面光滑，系统在水平方向动量守恒。物体在斜面上滑动时，斜面会向相反方向运动。利用牛顿第二定律和运动学关系可以推导出斜面的加速度为a_M = mg sin²θ/(M+m sin²θ)。',knowledgePoints:['牛顿运动定律','动量守恒','力学综合']},

  {id:'p8',subject:'physics',topic:'电学',difficulty:3,type:'fill',
   content:'一个电路中有三个电阻并联：R₁=6Ω，R₂=12Ω，R₃=4Ω。则总电阻R=________Ω。',
   answer:'2Ω',analysis:'并联电阻公式：1/R=1/R₁+1/R₂+1/R₃=1/6+1/12+1/4=2/12+1/12+3/12=6/12=1/2，所以R=2Ω。',knowledgePoints:['电路','并联电阻']},

  // ===== 化学 (Chemistry) =====
  {id:'ch1',subject:'chemistry',topic:'物质结构',difficulty:1,type:'choice',
   content:'下列元素中原子半径最大的是（　）',
   options:['Na','Mg','Al','Si'],
   answer:'A',analysis:'Na、Mg、Al、Si位于同一周期（第三周期），从左到右原子半径逐渐减小。Na在最左边，原子半径最大。',knowledgePoints:['原子结构','周期律']},

  {id:'ch2',subject:'chemistry',topic:'化学反应',difficulty:2,type:'choice',
   content:'下列反应中，属于氧化还原反应的是（　）',
   options:['CaO + H₂O = Ca(OH)₂',
            '2Na + 2H₂O = 2NaOH + H₂↑',
            'NaOH + HCl = NaCl + H₂O',
            'CaCO₃ = CaO + CO₂↑'],
   answer:'B',analysis:'氧化还原反应的特征是有元素化合价的变化。B中Na从0价变为+1价，H从+1价变为0价，有化合价变化，是氧化还原反应。其余反应中各元素化合价均未改变。',knowledgePoints:['氧化还原反应','化合价']},

  {id:'ch3',subject:'chemistry',topic:'有机化学',difficulty:3,type:'choice',
   content:'下列有机物中，能使酸性高锰酸钾溶液褪色的是（　）',
   options:['苯','甲苯','环己烷','乙酸'],
   answer:'B',analysis:'甲苯中的甲基受苯环影响变得活泼，能被酸性高锰酸钾氧化为苯甲酸，使溶液褪色。苯、环己烷性质稳定，不能使酸性KMnO₄褪色。乙酸无还原性，也不能使之褪色。',knowledgePoints:['有机化学','甲苯','高锰酸钾']},

  {id:'ch4',subject:'chemistry',topic:'化学平衡',difficulty:3,type:'fill',
   content:'在一定温度下，反应 N₂(g) + 3H₂(g) ⇌ 2NH₃(g) 达到平衡。\n\n（1）增大压强，平衡向________方向移动。\n（2）升高温度，平衡向________方向移动（已知该反应为放热反应）。',
   answer:'（1）正反应（气体体积减小的方向） （2）逆反应（吸热方向）',analysis:'（1）增大压强，平衡向气体分子数减小的方向移动。正反应方向气体从4mol变为2mol，所以正向移动。（2）升高温度，平衡向吸热方向（逆反应方向）移动。',knowledgePoints:['化学平衡','勒夏特列原理']},

  {id:'ch5',subject:'chemistry',topic:'电化学',difficulty:4,type:'choice',
   content:'在铜锌原电池中，下列说法正确的是（　）',
   options:['铜片是负极，发生氧化反应',
            '锌片是正极，发生还原反应',
            '铜片上有气泡产生',
            '电子从铜片流向锌片'],
   answer:'C',analysis:'铜锌原电池中，锌比铜活泼，锌为负极（Zn-2e⁻=Zn²⁺，氧化反应），铜为正极（2H⁺+2e⁻=H₂↑，还原反应）。电子从锌片（负极）经外电路流向铜片（正极），铜片上有氢气气泡产生。',knowledgePoints:['原电池','电化学']},

  {id:'ch6',subject:'chemistry',topic:'元素化学',difficulty:2,type:'choice',
   content:'下列物质中，既能与盐酸反应又能与氢氧化钠溶液反应的是（　）',
   options:['Al₂O₃','Fe₂O₃','SiO₂','Na₂O'],
   answer:'A',analysis:'Al₂O₃是两性氧化物，既能与酸反应（Al₂O₃+6HCl=2AlCl₃+3H₂O），又能与碱反应（Al₂O₃+2NaOH=2NaAlO₂+H₂O）。Fe₂O₃和Na₂O只与酸反应，SiO₂只与碱反应。',knowledgePoints:['两性氧化物','铝的化合物']},

  {id:'ch7',subject:'chemistry',topic:'溶液',difficulty:1,type:'fill',
   content:'配制500mL 0.1mol/L的NaOH溶液，需要NaOH的质量为________g。',
   answer:'2.0g',analysis:'n(NaOH)=C×V=0.1mol/L×0.5L=0.05mol。m(NaOH)=n×M=0.05mol×40g/mol=2.0g。',knowledgePoints:['物质的量浓度','溶液配制']},

  {id:'ch8',subject:'chemistry',topic:'实验',difficulty:3,type:'essay',
   content:'请简述检验某溶液中是否含有Cl⁻离子的实验方法和操作步骤。',
   answer:'取少量待测液于试管中，先加入稀硝酸酸化，再加入AgNO₃溶液，若产生白色沉淀，则证明含有Cl⁻离子。反应方程式：Ag⁺+Cl⁻=AgCl↓（白色沉淀，不溶于稀硝酸）。',
   analysis:'检验Cl⁻的关键步骤：①先用稀硝酸酸化（排除CO₃²⁻等干扰离子）；②加入AgNO₃溶液；③观察是否有不溶于稀硝酸的白色沉淀（AgCl）。注意不能用盐酸酸化，因为会引入Cl⁻。',knowledgePoints:['离子检验','实验操作']},

  {id:'b1',subject:'biology',topic:'细胞',difficulty:1,type:'choice',
   content:'下列细胞结构中，具有双层膜的是（　）',
   options:['核糖体','内质网','线粒体','高尔基体'],

let state = {

  questionCount: 10,

  timerRemaining: 30*60,

  timerPaused: false,

/* ============================================================
   VIEW MANAGEMENT
   ============================================================ */
function showView(viewName) {
  if (viewName !== 'wrongbook') state.previousView = viewName;
  document.querySelectorAll('.view').forEach(v => {
    v.classList.remove('active');
  });
  setTimeout(() => {
    const el = document.getElementById(viewName + '-view');
    if (el) el.classList.add('active');
  }, 50);
  updateFabBadge();
}

function goBackFromWrongbook() {
  showView(state.previousView);
}

/* ============================================================
   HOME VIEW - Initialize
   ============================================================ */
function initHome() {
  const grid = document.getElementById('subject-grid');
  grid.innerHTML = '';
  Object.entries(SUBJECTS).forEach(([key, sub]) => {
    const qCount = QUESTION_BANK.filter(q => q.subject === key).length;
    const card = document.createElement('div');
    card.className = 'subject-card' + (state.selectedSubjects.includes(key) ? ' selected' : '');
    card.dataset.subject = key;
    card.onclick = () => toggleSubject(key);
    card.innerHTML = `
      <div class="icon">${sub.icon}</div>
      <div class="name">${sub.name}</div>
      <div class="count">${qCount}题可选</div>
    `;
    grid.appendChild(card);
  });
}

function toggleSubject(subject) {
  const idx = state.selectedSubjects.indexOf(subject);
  if (idx >= 0) {
    state.selectedSubjects.splice(idx, 1);
  } else {
    state.selectedSubjects.push(subject);
  }
  // Update UI
  document.querySelectorAll('.subject-card').forEach(card => {
    card.classList.toggle('selected', state.selectedSubjects.includes(card.dataset.subject));
  });
  // Show/hide knowledge points
  updateKnowledgePoints();
}

function updateKnowledgePoints() {
  const section = document.getElementById('knowledge-section');
  const container = document.getElementById('knowledge-groups');
  if (state.selectedSubjects.length === 0) {
    section.style.display = 'none';
    state.selectedTopics = [];
    return;
  }
  section.style.display = 'block';
  container.innerHTML = '';
  state.selectedTopics = [];
  state.selectedSubjects.forEach(subKey => {
    const sub = SUBJECTS[subKey];
    const group = document.createElement('div');
    group.className = 'knowledge-group';
    let tagsHtml = sub.topics.map(t =>
      `<label class="kp-tag" onclick="toggleTopic('${t}',this)">
        <input type="checkbox" value="${t}"> ${t}
      </label>`
    ).join('');
    group.innerHTML = `<h4><span class="dot"></span>${sub.name}</h4><div class="kp-list">${tagsHtml}</div>`;
    container.appendChild(group);
  });
}

function toggleTopic(topic, el) {
  el.classList.toggle('selected');
  const idx = state.selectedTopics.indexOf(topic);
  if (idx >= 0) state.selectedTopics.splice(idx, 1);
  else state.selectedTopics.push(topic);
}

function selectDifficulty(d) {
  state.difficulty = d;
  document.querySelectorAll('.diff-btn').forEach(b => {
    b.classList.toggle('selected', parseInt(b.dataset.diff) === d);
  });
}

function selectCount(c) {
  state.questionCount = c;
  document.querySelectorAll('.count-btn').forEach(b => {
    b.classList.toggle('selected', parseInt(b.dataset.count) === c);
  });
}

/* ============================================================
   GENERATE EXAM
   ============================================================ */
function generateExam() {
  // If no subject selected, pick the first one
  if (state.selectedSubjects.length === 0) {
    state.selectedSubjects = ['chinese'];
    initHome();
  }

  // Show loading
  const overlay = document.getElementById('loading-overlay');
  overlay.classList.add('show');

  setTimeout(() => {
    // Filter questions
    let pool = QUESTION_BANK.filter(q => {
      if (!state.selectedSubjects.includes(q.subject)) return false;
      if (state.selectedTopics.length > 0) {
        const hasTopic = q.knowledgePoints.some(kp => state.selectedTopics.includes(kp));
        if (!hasTopic) return false;
      }
      return true;
    });

    // Try to match difficulty, but don't be too strict
    let matched = pool.filter(q => q.difficulty === state.difficulty);
    if (matched.length < state.questionCount) {
      matched = pool; // fallback to all filtered
    }

    // Shuffle and pick
    matched = shuffleArray(matched);
    state.currentExam = matched.slice(0, Math.min(state.questionCount, matched.length));
    state.answers = {};
    state.currentIndex = 0;

    // Shuffle choice options for choice questions
    state.currentExam.forEach(q => {
      if (q.type === 'choice' && q.options) {
        q._shuffledOptions = [...q.options];
        q._shuffledLabels = ['A','B','C','D'];
      }
    });

    // Start timer
    startTimer();

    overlay.classList.remove('show');
    renderExam();
    showView('exam');
  }, 1500);
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ============================================================
   TIMER
   ============================================================ */
function startTimer() {
  clearTimer();
  state.timerRemaining = state.timerTotal;
  state.timerPaused = false;
  state.examStartTime = Date.now();
  document.getElementById('btn-pause').textContent = '⏸';
  updateTimerDisplay();
  state.timerInterval = setInterval(() => {
    if (state.timerPaused) return;
    state.timerRemaining--;
    updateTimerDisplay();
    if (state.timerRemaining <= 0) {
      clearTimer();
      submitExam();
    }
  }, 1000);
}

function clearTimer() {
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = null;
}

function toggleTimer() {
  state.timerPaused = !state.timerPaused;
  document.getElementById('btn-pause').textContent = state.timerPaused ? '▶' : '⏸';
}

function updateTimerDisplay() {
  const m = Math.floor(state.timerRemaining / 60);
  const s = state.timerRemaining % 60;
  const text = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  document.getElementById('timer-text').textContent = text;
  const timerEl = document.getElementById('exam-timer');
  timerEl.classList.toggle('warning', state.timerRemaining <= 300);
}

/* ============================================================
   EXAM VIEW
   ============================================================ */
function renderExam() {
  const subName = state.currentExam[0]?.subject || 'chinese';
  const subLabel = SUBJECTS[subName]?.name || '综合';
  document.getElementById('exam-subject-name').textContent = subLabel + ' · 模拟考试';

  renderQuestions();
  renderAnswerDots();
  updateProgress();
}

function renderQuestions() {
  const container = document.getElementById('exam-questions');
  container.innerHTML = '';
  state.currentExam.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.style.animationDelay = `${i * 0.05}s`;
    card.id = `q-${i}`;

    let typeLabel = '';
    let typeClass = '';
    if (q.type === 'choice') { typeLabel = '选择题'; typeClass = 'choice'; }
    else if (q.type === 'fill') { typeLabel = '填空题'; typeClass = 'fill'; }
    else { typeLabel = '简答题'; typeClass = 'essay'; }

    let stars = '★'.repeat(q.difficulty) + '☆'.repeat(4 - q.difficulty);

    let bodyHtml = '';
    if (q.type === 'choice') {
      const labels = ['A','B','C','D'];
      bodyHtml = '<div class="options">' + q.options.map((opt, oi) => {
        const isSelected = state.answers[q.id] === labels[oi];
        return `<div class="option-item${isSelected ? ' selected' : ''}" onclick="selectOption('${q.id}','${labels[oi]}',this)">
          <div class="option-circle">${labels[oi]}</div>
          <div class="option-text">${opt}</div>
        </div>`;
      }).join('') + '</div>';
    } else if (q.type === 'fill') {
      const val = state.answers[q.id] || '';
      bodyHtml = `<textarea class="essay-area" placeholder="请输入答案..." oninput="saveFillAnswer('${q.id}',this.value)" style="min-height:100px">${val}</textarea>
        <div class="char-count"><span>${val.length}</span> 字</div>`;
    } else {
      const val = state.answers[q.id] || '';
      bodyHtml = `<textarea class="essay-area" placeholder="请在此作答..." oninput="saveFillAnswer('${q.id}',this.value)">${val}</textarea>
        <div class="char-count"><span>${val.length}</span> 字</div>`;
    }

    card.innerHTML = `
      <div class="q-header">
        <div class="q-number">${i + 1}</div>
        <span class="q-type ${typeClass}">${typeLabel}</span>
        <span class="q-diff">${stars}</span>
      </div>
      <div class="q-content">${q.content.replace(/\n/g, '<br>')}</div>
      ${bodyHtml}
    `;
    container.appendChild(card);
  });
  scrollToQuestion(state.currentIndex);
}

function selectOption(qId, label, el) {
  state.answers[qId] = label;
  // Update UI
  const card = el.closest('.question-card');
  card.querySelectorAll('.option-item').forEach(opt => opt.classList.remove('selected'));
  el.classList.add('selected');
  updateProgress();
  renderAnswerDots();
}

function saveFillAnswer(qId, val) {
  state.answers[qId] = val;
  // Update char count
  updateProgress();
}

function renderAnswerDots() {
  const container = document.getElementById('answer-dots');
  container.innerHTML = '';
  state.currentExam.forEach((q, i) => {
    const dot = document.createElement('div');
    dot.className = 'answer-dot';
    if (state.answers[q.id]) dot.classList.add('answered');
    if (i === state.currentIndex) dot.classList.add('current');
    dot.textContent = i + 1;
    dot.onclick = () => {
      state.currentIndex = i;
      scrollToQuestion(i);
      renderAnswerDots();
    };
    container.appendChild(dot);
  });
  const answered = state.currentExam.filter(q => state.answers[q.id]).length;
  document.getElementById('stat-answered').textContent = answered;
  document.getElementById('stat-unanswered').textContent = state.currentExam.length - answered;
}

function updateProgress() {
  const answered = state.currentExam.filter(q => state.answers[q.id]).length;
  const total = state.currentExam.length;
  document.getElementById('progress-text').textContent = `${answered}/${total}`;
  document.getElementById('progress-fill').style.width = `${(answered/total)*100}%`;
}

function scrollToQuestion(index) {
  state.currentIndex = index;
  const el = document.getElementById(`q-${index}`);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function prevQuestion() {
  if (state.currentIndex > 0) {
    state.currentIndex--;
    scrollToQuestion(state.currentIndex);
    renderAnswerDots();
  }
}

function nextQuestion() {
  if (state.currentIndex < state.currentExam.length - 1) {
    state.currentIndex++;
    scrollToQuestion(state.currentIndex);
    renderAnswerDots();
  }
}

/* ============================================================
   SUBMIT EXAM
   ============================================================ */
function submitExam() {
  if (!confirm('确定要交卷吗？')) return;
  clearTimer();
  state.examEndTime = Date.now();
  calculateResults();
  showView('results');
}

function calculateResults() {
  let correct = 0, wrong = 0, skipped = 0;
  const results = [];

  state.currentExam.forEach((q, i) => {
    const userAns = state.answers[q.id] || '';
    let isCorrect = false;

    if (q.type === 'choice') {
      isCorrect = userAns === q.answer;
    } else {
      // For fill/essay, do simple text match
      const normalize = s => s.replace(/\s+/g,'').toLowerCase();
      isCorrect = normalize(userAns) === normalize(q.answer);
    }

    if (!userAns) skipped++;
    else if (isCorrect) correct++;
    else wrong++;

    results.push({ ...q, userAnswer: userAns, isCorrect, index: i });
  });

  const total = state.currentExam.length;
  const percentage = Math.round((correct / total) * 100);
  const timeUsed = Math.floor((state.examEndTime - state.examStartTime) / 1000);

  // Add wrong questions to wrong book
  results.filter(r => !r.isCorrect && r.userAnswer).forEach(r => {
    if (!state.wrongBook.find(w => w.id === r.id)) {
      state.wrongBook.push({
        id: r.id, subject: r.subject, topic: r.topic,
        content: r.content, options: r.options,
        answer: r.answer, userAnswer: r.userAnswer,
        analysis: r.analysis, type: r.type,
        addedAt: Date.now()
      });
    }
  });
  localStorage.setItem('gaokao_wrongbook', JSON.stringify(state.wrongBook));
  updateFabBadge();

  // Render results
  renderResults(percentage, correct, wrong, skipped, timeUsed, results);
}

function renderResults(percentage, correct, wrong, skipped, timeUsed, results) {
  // Subject name
  const subName = state.currentExam[0]?.subject || 'chinese';
  document.getElementById('results-subject-name').textContent = SUBJECTS[subName]?.name + ' · 考试报告';

  // Score ring animation
  const circumference = 2 * Math.PI * 100; // r=100
  const offset = circumference * (1 - percentage / 100);
  const ring = document.getElementById('score-ring-fill');
  ring.style.strokeDasharray = circumference;
  ring.style.strokeDashoffset = circumference;
  setTimeout(() => {
    ring.style.strokeDashoffset = offset;
    // Color based on score
    if (percentage >= 80) ring.style.stroke = 'var(--success)';
    else if (percentage >= 60) ring.style.stroke = 'var(--gold)';
    else ring.style.stroke = 'var(--danger)';
  }, 200);

  // Animated score number
  animateNumber('score-number', percentage, 1500);

  // Grade badge
  const gradeEl = document.getElementById('score-grade');
  if (percentage >= 90) { gradeEl.textContent = '优秀 🌟'; gradeEl.className = 'score-grade excellent'; }
  else if (percentage >= 75) { gradeEl.textContent = '良好 👍'; gradeEl.className = 'score-grade good'; }
  else if (percentage >= 60) { gradeEl.textContent = '及格 ✊'; gradeEl.className = 'score-grade average'; }
  else { gradeEl.textContent = '需加油 💪'; gradeEl.className = 'score-grade poor'; }

  // Breakdown
  animateNumber('result-correct', correct, 800);
  animateNumber('result-wrong', wrong, 800);
  animateNumber('result-skipped', skipped, 800);

  // Time
  const tm = Math.floor(timeUsed / 60);
  const ts = timeUsed % 60;
  document.getElementById('result-time').textContent = `${tm}分${ts}秒`;

  // Radar chart
  setTimeout(() => drawRadarChart(results), 500);

  // Analysis list
  const listEl = document.getElementById('analysis-list');
  listEl.innerHTML = '';
  results.forEach((r, i) => {
    const card = document.createElement('div');
    let statusClass = r.isCorrect ? 'correct' : (r.userAnswer ? 'wrong' : 'skipped');
    let statusIcon = r.isCorrect ? '✓' : '✗';
    if (!r.userAnswer) statusIcon = '—';

    let answersHtml = '';
    if (r.type === 'choice') {
      const labels = ['A','B','C','D'];
      answersHtml = `
        <div class="analysis-answers">
          <div><div class="label">你的答案</div><div class="value ${r.isCorrect ? '' : 'your'}">${r.userAnswer ? r.userAnswer + '. ' + r.options[labels.indexOf(r.userAnswer)] : '未作答'}</div></div>
          <div><div class="label">正确答案</div><div class="value" style="color:var(--success)">${r.answer}. ${r.options[labels.indexOf(r.answer)]}</div></div>
        </div>`;
    } else {
      answersHtml = `
        <div class="analysis-answers">
          <div><div class="label">你的答案</div><div class="value">${r.userAnswer || '未作答'}</div></div>
          <div><div class="label">参考答案</div><div class="value" style="color:var(--success)">${r.answer}</div></div>
        </div>`;
    }

    card.className = `analysis-card ${statusClass}`;
    card.style.animationDelay = `${i * 0.05}s`;
    card.innerHTML = `
      <div class="analysis-q">
        <div class="analysis-icon">${statusIcon}</div>
        <span>第${i+1}题 · ${r.topic}</span>
      </div>
      <div style="font-size:0.9rem;color:var(--ink-light);margin-bottom:8px">${r.content.substring(0,100)}${r.content.length>100?'...':''}</div>
      ${answersHtml}
      <div class="analysis-explain">${r.analysis}</div>
      ${!r.isCorrect && r.userAnswer ? `<div style="margin-top:10px"><button class="btn-sm btn-remove-q" onclick="removeFromWrongBook('${r.id}')">移除错题</button></div>` : ''}
    `;
    listEl.appendChild(card);
  });
}

function animateNumber(elId, target, duration) {
  const el = document.getElementById(elId);
  if (!el) return;
  const start = 0;
  const startTime = performance.now();
  function update(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    el.textContent = Math.round(start + (target - start) * eased);
    if (progress < 1) requestAnimationFrame(update);
  }
  requestAnimationFrame(update);
}

/* ============================================================
   RADAR CHART
   ============================================================ */
function drawRadarChart(results) {
  const canvas = document.getElementById('radar-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2, R = 150;

  ctx.clearRect(0, 0, W, H);

  // Group results by topic
  const topicMap = {};
  results.forEach(r => {
    const topic = r.topic;
    if (!topicMap[topic]) topicMap[topic] = { total: 0, correct: 0 };
    topicMap[topic].total++;
    if (r.isCorrect) topicMap[topic].correct++;
  });

  const topics = Object.keys(topicMap);
  if (topics.length < 3) {
    // Add dummy topics if fewer than 3
    while (topics.length < 5) topics.push('知识点' + (topics.length + 1));
  }

  const n = topics.length;
  const angleStep = (2 * Math.PI) / n;

  // Draw grid circles
  for (let level = 1; level <= 5; level++) {
    const r = (R / 5) * level;
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const angle = angleStep * i - Math.PI/2;
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = 'rgba(26,54,93,0.08)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Draw axes
  for (let i = 0; i < n; i++) {
    const angle = angleStep * i - Math.PI/2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + R * Math.cos(angle), cy + R * Math.sin(angle));
    ctx.strokeStyle = 'rgba(26,54,93,0.1)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Draw data polygon
  const values = topics.map(t => topicMap[t] ? topicMap[t].correct / topicMap[t].total : 0);

  ctx.beginPath();
  values.forEach((v, i) => {
    const angle = angleStep * i - Math.PI/2;
    const r = R * v;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.closePath();
  ctx.fillStyle = 'rgba(201,162,39,0.2)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(201,162,39,0.8)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Draw data points and labels
  values.forEach((v, i) => {
    const angle = angleStep * i - Math.PI/2;
    const r = R * v;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);

    // Point
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, 2 * Math.PI);
    ctx.fillStyle = 'var(--gold)';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Label
    const lx = cx + (R + 24) * Math.cos(angle);
    const ly = cy + (R + 24) * Math.sin(angle);
    ctx.fillStyle = '#2d3748';
    ctx.font = '13px "Noto Sans SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const displayTopic = topics[i].length > 6 ? topics[i].substring(0,6) + '...' : topics[i];
    ctx.fillText(displayTopic, lx, ly);

    // Percentage below label
    ctx.fillStyle = '#718096';
    ctx.font = '11px "Noto Sans SC", sans-serif';
    ctx.fillText(Math.round(v * 100) + '%', lx, ly + 16);
  });
}

/* ============================================================
   WRONG BOOK
   ============================================================ */
function renderWrongBook() {
  const body = document.getElementById('wrongbook-body');
  if (state.wrongBook.length === 0) {
    body.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📖</div>
        <h3>错题本是空的</h3>
        <p>还没有收录任何错题，继续加油吧！</p>
        <button class="btn-back-home" onclick="showView('home')">去刷题</button>
      </div>
    `;
    return;
  }

  // Group by subject
  const groups = {};
  state.wrongBook.forEach(q => {
    if (!groups[q.subject]) groups[q.subject] = [];
    groups[q.subject].push(q);
  });

  body.innerHTML = '';
  Object.entries(groups).forEach(([subKey, questions]) => {
    const sub = SUBJECTS[subKey] || { name: '未知' };
    const groupEl = document.createElement('div');
    groupEl.className = 'wrong-subject-group';
    groupEl.innerHTML = `<div class="wrong-subject-title">${sub.name} (${questions.length}题)</div>`;

    questions.forEach(q => {
      const card = document.createElement('div');
      card.className = 'wrong-q-card';
      card.id = `wb-${q.id}`;

      let answersHtml = '';
      if (q.type === 'choice') {
        const labels = ['A','B','C','D'];
        answersHtml = `
          <div class="wrong-q-answers">
            <div class="your">你的答案：${q.userAnswer ? q.userAnswer + '. ' + q.options[labels.indexOf(q.userAnswer)] : '未作答'}</div>
            <div class="correct">正确答案：${q.answer}. ${q.options[labels.indexOf(q.answer)]}</div>
          </div>`;
      } else {
        answersHtml = `
          <div class="wrong-q-answers">
            <div class="your">你的答案：${q.userAnswer || '未作答'}</div>
            <div class="correct">参考答案：${q.answer}</div>
          </div>`;
      }

      card.innerHTML = `
        <div class="wrong-q-content">${q.content.substring(0,150)}${q.content.length>150?'...':''}</div>
        ${answersHtml}
        <div class="wrong-q-analysis">${q.analysis}</div>
        <div class="wrong-q-actions">
          <button class="btn-sm btn-retry-q" onclick="retryWrongQuestion('${q.id}')">重新练习</button>
          <button class="btn-sm btn-remove-q" onclick="removeWrongQuestion('${q.id}')">移除</button>
        </div>
      `;
      groupEl.appendChild(card);
    });

    body.appendChild(groupEl);
  });
}

function removeFromWrongBook(qId) {
  state.wrongBook = state.wrongBook.filter(q => q.id !== qId);
  localStorage.setItem('gaokao_wrongbook', JSON.stringify(state.wrongBook));
  updateFabBadge();
  // If on results page, just show a message
  const card = document.querySelector(`.analysis-card [onclick*="${qId}"]`);
  if (card) {
    card.textContent = '已移除';
    card.disabled = true;
  }
}

function removeWrongQuestion(qId) {
  state.wrongBook = state.wrongBook.filter(q => q.id !== qId);
  localStorage.setItem('gaokao_wrongbook', JSON.stringify(state.wrongBook));
  updateFabBadge();
  const card = document.getElementById(`wb-${qId}`);
  if (card) {
    card.style.transition = 'all 0.3s ease';
    card.style.opacity = '0';
    card.style.transform = 'translateX(20px)';
    setTimeout(() => {
      card.remove();
      if (state.wrongBook.length === 0) renderWrongBook();
    }, 300);
  }
}

function retryWrongQuestion(qId) {
  const q = QUESTION_BANK.find(qq => qq.id === qId);
  if (!q) return;
  state.currentExam = [q];
  state.answers = {};
  state.currentIndex = 0;
  state.timerTotal = 5 * 60; // 5 minutes for single question
  startTimer();
  renderExam();
  showView('exam');
}

function updateFabBadge() {
  const badge = document.getElementById('fab-badge');
  badge.textContent = state.wrongBook.length > 0 ? state.wrongBook.length : '';
}

/* ============================================================
   PARTICLE ANIMATION
   ============================================================ */
function initParticles() {
  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let w, h;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }

  function createParticles() {
    particles = [];
    const count = Math.floor((w * h) / 15000);
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 2 + 0.5,
        dx: (Math.random() - 0.5) * 0.4,
        dy: (Math.random() - 0.5) * 0.4,
        opacity: Math.random() * 0.3 + 0.1
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, 2 * Math.PI);
      ctx.fillStyle = `rgba(26,54,93,${p.opacity})`;
      ctx.fill();

      p.x += p.dx;
      p.y += p.dy;

      if (p.x < 0 || p.x > w) p.dx *= -1;
      if (p.y < 0 || p.y > h) p.dy *= -1;
    });

    // Draw connections
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(26,54,93,${0.06 * (1 - dist / 120)})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }

    requestAnimationFrame(draw);
  }

  resize();
  createParticles();
  draw();
  window.addEventListener('resize', () => { resize(); createParticles(); });
}

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  initHome();
  initParticles();
  updateFabBadge();

  // Override showView to also render content when switching
  const originalShowView = showView;
  showView = function(viewName) {
    if (viewName !== 'wrongbook') state.previousView = viewName;
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    setTimeout(() => {
      const el = document.getElementById(viewName + '-view');
      if (el) el.classList.add('active');
    }, 50);
    if (viewName === 'wrongbook') renderWrongBook();
    if (viewName === 'home') initHome();
    updateFabBadge();
  };
});
