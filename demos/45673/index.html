<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心花园</title>
    <style id="theme-vars">
/* Heart Garden — Dreamy Garden Brand CSS */

/* ===== Light Mode (Default) ===== */
:root {
  /* Primary — Lavender Purple */
  --color-primary: #B794F6;
  --color-primary-light: #D4B8FF;
  --color-primary-lighter: #EDE0FF;
  --color-primary-lightest: #F7F0FF;
  --color-primary-dark: #8B6CC1;
  --color-primary-darker: #6A4FA0;

  /* Secondary — Soft Pink */
  --color-secondary: #FFB6C1;
  --color-secondary-light: #FFD4DC;
  --color-secondary-lighter: #FFF0F3;

  /* Accent — Mint Green */
  --color-accent: #A8E6CF;
  --color-accent-light: #C8F0DF;
  --color-accent-lighter: #E8FAF4;

  /* Neutral */
  --color-text-primary: #3D2C5E;
  --color-text-secondary: #6B5A8D;
  --color-text-tertiary: #9B8DB8;
  --color-text-inverse: #FFFFFF;
  --color-surface: #FAF7FF;
  --color-surface-elevated: #FFFFFF;
  --color-border: #E8DFF5;
  --color-border-light: #F0EBF8;

  /* State Colors */
  --state-success: #7DCEA0;
  --state-warning: #F7DC6F;
  --state-error: #F1948A;
  --state-info: #85C1E9;

  /* Radius Scale */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* Typography */
  --font-title: 'Noto Serif SC', 'Georgia', serif;
  --font-body: 'Inter', 'Noto Sans SC', sans-serif;
  --font-display: 'Noto Serif SC', Georgia, serif;

  /* Spacing */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: 48px;
  --space-3xl: 64px;

  /* Shadows — static surfaces use border/surface layering */
  --shadow-sm: 0 1px 2px rgba(61, 44, 94, 0.04);
  --shadow-md: 0 2px 8px rgba(61, 44, 94, 0.05);
  --shadow-lg: 0 4px 16px rgba(61, 44, 94, 0.05);
  --shadow-float: 0 8px 32px rgba(61, 44, 94, 0.08);
}

/* ===== Dark Mode ===== */
html.dark {
  --color-primary: #C4A8FF;
  --color-primary-light: #D4B8FF;
  --color-primary-lighter: #2D1F4E;
  --color-primary-lightest: #1A1230;
  --color-primary-dark: #E0CCFF;
  --color-primary-darker: #F0E6FF;

  --color-secondary: #FF9EB0;
  --color-secondary-light: #FFD4DC;
  --color-secondary-lighter: #2D1F2D;

  --color-accent: #7DD4B0;
  --color-accent-light: #4DA882;
  --color-accent-lighter: #1A2D24;

  --color-text-primary: #EDE0FF;
  --color-text-secondary: #B8A8D0;
  --color-text-tertiary: #7A6D95;
  --color-text-inverse: #3D2C5E;
  --color-surface: #1A1230;
  --color-surface-elevated: #2D1F4E;
  --color-border: #3D2C5E;
  --color-border-light: #2D1F4E;

  --state-success: #5DB87E;
  --state-warning: #D4AC0D;
  --state-error: #E74C3C;
  --state-info: #5DADE2;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.05);
  --shadow-float: 0 8px 32px rgba(0, 0, 0, 0.08);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
    --color-accent: var(--color-accent);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="background: var(--color-surface); color: var(--color-text-primary);">

    <main>

        <!-- ========== 1. Hero Section ========== -->
        <section class="relative overflow-hidden" style="min-height: 100vh;">
            <!-- Hero background image with soft overlay -->
            <div class="absolute inset-0">
                <img src="../assets/hero-garden.jpg" alt="心花园 — 梦幻花园" class="w-full h-full object-cover" loading="eager">
                <div class="absolute inset-0" style="background: linear-gradient(180deg, rgba(183,148,246,0.25) 0%, rgba(250,247,255,0.55) 100%);"></div>
            </div>

            <!-- Floating decorative blobs -->
            <div class="absolute top-16 left-8 w-20 h-20 rounded-full opacity-30" style="background: var(--color-primary-light); filter: blur(24px);" aria-hidden="true"></div>
            <div class="absolute top-32 right-12 w-14 h-14 rounded-full opacity-25" style="background: var(--color-secondary); filter: blur(20px);" aria-hidden="true"></div>
            <div class="absolute bottom-40 left-16 w-16 h-16 rounded-full opacity-20" style="background: var(--color-accent); filter: blur(18px);" aria-hidden="true"></div>
            <div class="absolute top-48 left-1/3 w-10 h-10 rounded-full opacity-20" style="background: var(--color-primary); filter: blur(16px);" aria-hidden="true"></div>

            <!-- Hero content -->
            <div class="relative flex flex-col items-center justify-center px-4 text-center" style="min-height: 100vh; padding-top: 120px; padding-bottom: 80px;">
                <h1 class="leading-tight" style="font-family: var(--font-display); font-size: clamp(48px, 10vw, 88px); font-weight: 600; letter-spacing: -0.03em; color: var(--color-text-inverse); text-wrap: balance; word-break: keep-all; overflow-wrap: break-word; text-shadow: 0 2px 16px rgba(61,44,94,0.15);">
                    心花园
                </h1>
                <p class="mt-6 max-w-xs mx-auto" style="font-family: var(--font-body); font-size: clamp(16px, 4vw, 18px); line-height: 1.6; color: var(--color-text-inverse); opacity: 0.9;">
                    你的秘密花园<br>一个不用动脑子的放松角落
                </p>
                <a href="#" class="mt-10 inline-flex items-center justify-center whitespace-nowrap" data-dom-id="cta-enter-garden" style="background: var(--color-primary); color: var(--color-text-inverse); font-family: var(--font-body); font-size: 16px; font-weight: 600; padding: 14px 36px; border-radius: var(--radius-full); box-shadow: 0 4px 16px rgba(183,148,246,0.3); transition: transform 160ms cubic-bezier(.2,.8,.2,1), box-shadow 160ms cubic-bezier(.2,.8,.2,1);"
                   onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 24px rgba(183,148,246,0.4)';"
                   onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 16px rgba(183,148,246,0.3)';"
                   onmousedown="this.style.transform='translateY(0)';"
                >
                    进入花园
                </a>
            </div>

            <!-- Asymmetric fade: hero bleeds into next section -->
            <div class="absolute bottom-0 left-0 right-0 h-24" style="background: linear-gradient(0deg, var(--color-surface), transparent);" aria-hidden="true"></div>
        </section>

        <!-- ========== 2. Features Section ========== -->
        <section class="px-4 py-12 md:py-16 lg:py-20" style="max-width: 640px; margin-left: auto; margin-right: auto;">
            <h2 class="text-center mb-10" style="font-family: var(--font-title); font-size: clamp(22px, 5vw, 28px); font-weight: 600; letter-spacing: -0.015em; color: var(--color-text-primary); text-wrap: balance; word-break: keep-all;">
                在花园里做什么
            </h2>

            <div class="flex flex-col gap-4">
                <!-- Feature Card 1: 今日心情 -->
                <div class="flex items-start gap-4 p-5 transition-transform duration-200" style="background: var(--color-primary-lightest); border: 1px solid var(--color-border-light); border-radius: var(--radius-lg); transition: transform 160ms cubic-bezier(.2,.8,.2,1);"
                     onmouseover="this.style.transform='translateY(-2px)';"
                     onmouseout="this.style.transform='translateY(0)';"
                >
                    <div class="flex items-center justify-center shrink-0" style="width: 48px; height: 48px; border-radius: var(--radius-md); background: var(--color-primary-light); color: var(--color-primary-darker);">
                        <i data-lucide="sun" style="width: 24px; height: 24px;"></i>
                    </div>
                    <div>
                        <h3 class="mb-1" style="font-family: var(--font-title); font-size: 18px; font-weight: 600; color: var(--color-text-primary);">今日心情</h3>
                        <p style="font-family: var(--font-body); font-size: 14px; line-height: 1.6; color: var(--color-text-secondary);">选一个天气，花园会为你悄悄变化</p>
                    </div>
                </div>

                <!-- Feature Card 2: 匿名便利贴 -->
                <div class="flex items-start gap-4 p-5 transition-transform duration-200" style="background: var(--color-secondary-lighter); border: 1px solid var(--color-border-light); border-radius: var(--radius-lg); transition: transform 160ms cubic-bezier(.2,.8,.2,1);"
                     onmouseover="this.style.transform='translateY(-2px)';"
                     onmouseout="this.style.transform='translateY(0)';"
                >
                    <div class="flex items-center justify-center shrink-0" style="width: 48px; height: 48px; border-radius: var(--radius-md); background: var(--color-secondary-light); color: var(--color-text-primary);">
                        <i data-lucide="sticky-note" style="width: 24px; height: 24px;"></i>
                    </div>
                    <div>
                        <h3 class="mb-1" style="font-family: var(--font-title); font-size: 18px; font-weight: 600; color: var(--color-text-primary);">匿名便利贴</h3>
                        <p style="font-family: var(--font-body); font-size: 14px; line-height: 1.6; color: var(--color-text-secondary);">写张便利贴，丢到公共花园，24小时后自动消失</p>
                    </div>
                </div>

                <!-- Feature Card 3: 放空一会儿 -->
                <div class="flex items-start gap-4 p-5 transition-transform duration-200" style="background: var(--color-accent-lighter); border: 1px solid var(--color-border-light); border-radius: var(--radius-lg); transition: transform 160ms cubic-bezier(.2,.8,.2,1);"
                     onmouseover="this.style.transform='translateY(-2px)';"
                     onmouseout="this.style.transform='translateY(0)';"
                >
                    <div class="flex items-center justify-center shrink-0" style="width: 48px; height: 48px; border-radius: var(--radius-md); background: var(--color-accent-light); color: var(--color-text-primary);">
                        <i data-lucide="headphones" style="width: 24px; height: 24px;"></i>
                    </div>
                    <div>
                        <h3 class="mb-1" style="font-family: var(--font-title); font-size: 18px; font-weight: 600; color: var(--color-text-primary);">放空一会儿</h3>
                        <p style="font-family: var(--font-body); font-size: 14px; line-height: 1.6; color: var(--color-text-secondary);">虫鸣、风声、雨声，点一下就播放</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- ========== 3. Illustration Section — 情绪花园 ========== -->
        <section class="px-4 py-12 md:py-16 lg:py-20">
            <div style="max-width: 640px; margin-left: auto; margin-right: auto;">
                <div class="overflow-hidden" style="border-radius: var(--radius-lg);">
                    <img src="../assets/feature-emotion.jpg" alt="情绪花园 — 你的情绪花园都懂" class="w-full object-cover" style="aspect-ratio: 4/3; display: block;" loading="lazy">
                </div>
                <div class="mt-8 text-center">
                    <h2 class="mb-4" style="font-family: var(--font-title); font-size: clamp(22px, 5vw, 28px); font-weight: 600; letter-spacing: -0.015em; color: var(--color-text-primary); text-wrap: balance; word-break: keep-all;">
                        你的情绪，花园都懂
                    </h2>
                    <p class="mx-auto" style="font-family: var(--font-body); font-size: 15px; line-height: 1.7; color: var(--color-text-secondary); max-width: 480px;">
                        不开心的时候，花园会安静下来。不是枯萎，只是陪你休息一下。等你回来，花还会开。
                    </p>
                </div>
            </div>
        </section>

        <!-- ========== 4. Anonymous Section — 完全匿名 ========== -->
        <section class="px-4 py-12 md:py-16 lg:py-20" style="background: var(--color-surface-elevated);">
            <div style="max-width: 640px; margin-left: auto; margin-right: auto;">
                <div class="overflow-hidden" style="border-radius: var(--radius-lg);">
                    <img src="../assets/feature-anonymous.jpg" alt="完全匿名 — 没有人知道你是谁" class="w-full object-cover" style="aspect-ratio: 16/10; display: block;" loading="lazy">
                </div>
                <div class="mt-8">
                    <h2 class="mb-6 text-center" style="font-family: var(--font-title); font-size: clamp(22px, 5vw, 28px); font-weight: 600; letter-spacing: -0.015em; color: var(--color-text-primary); text-wrap: balance; word-break: keep-all;">
                        没有人知道你是谁
                    </h2>
                    <ul class="flex flex-col gap-3" style="list-style: none; padding: 0; margin: 0;">
                        <li class="flex items-start gap-3 p-4" style="background: var(--color-surface); border-radius: var(--radius-md); border: 1px solid var(--color-border-light);">
                            <i data-lucide="eye-off" class="shrink-0 mt-0.5" style="width: 20px; height: 20px; color: var(--color-primary);"></i>
                            <span style="font-family: var(--font-body); font-size: 15px; line-height: 1.6; color: var(--color-text-primary);">没有头像，没有昵称</span>
                        </li>
                        <li class="flex items-start gap-3 p-4" style="background: var(--color-surface); border-radius: var(--radius-md); border: 1px solid var(--color-border-light);">
                            <i data-lucide="clock" class="shrink-0 mt-0.5" style="width: 20px; height: 20px; color: var(--color-primary);"></i>
                            <span style="font-family: var(--font-body); font-size: 15px; line-height: 1.6; color: var(--color-text-primary);">便利贴 24 小时后消失</span>
                        </li>
                        <li class="flex items-start gap-3 p-4" style="background: var(--color-surface); border-radius: var(--radius-md); border: 1px solid var(--color-border-light);">
                            <i data-lucide="message-circle-off" class="shrink-0 mt-0.5" style="width: 20px; height: 20px; color: var(--color-primary);"></i>
                            <span style="font-family: var(--font-body); font-size: 15px; line-height: 1.6; color: var(--color-text-primary);">不能回复，不能私信</span>
                        </li>
                        <li class="flex items-start gap-3 p-4" style="background: var(--color-surface); border-radius: var(--radius-md); border: 1px solid var(--color-border-light);">
                            <i data-lucide="shield-check" class="shrink-0 mt-0.5" style="width: 20px; height: 20px; color: var(--color-primary);"></i>
                            <span style="font-family: var(--font-body); font-size: 15px; line-height: 1.6; color: var(--color-text-primary);">匿名不是冷漠，是安全感</span>
                        </li>
                    </ul>
                </div>
            </div>
        </section>

        <!-- ========== 5. CTA Section ========== -->
        <section class="px-4 py-16 md:py-20 lg:py-24 text-center" style="background: linear-gradient(180deg, var(--color-surface) 0%, var(--color-primary-lightest) 100%);">
            <div style="max-width: 640px; margin-left: auto; margin-right: auto;">
                <h2 class="mb-4" style="font-family: var(--font-title); font-size: clamp(22px, 5vw, 28px); font-weight: 600; letter-spacing: -0.015em; color: var(--color-text-primary); text-wrap: balance; word-break: keep-all;">
                    准备好了吗
                </h2>
                <a href="#" class="inline-flex items-center justify-center whitespace-nowrap" data-dom-id="cta-plant-flower" style="background: var(--color-primary); color: var(--color-text-inverse); font-family: var(--font-body); font-size: 17px; font-weight: 600; padding: 16px 40px; border-radius: var(--radius-full); box-shadow: 0 4px 16px rgba(183,148,246,0.3); transition: transform 160ms cubic-bezier(.2,.8,.2,1), box-shadow 160ms cubic-bezier(.2,.8,.2,1);"
                   onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 24px rgba(183,148,246,0.4)';"
                   onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 16px rgba(183,148,246,0.3)';"
                   onmousedown="this.style.transform='translateY(0)';"
                >
                    种下你的第一朵花
                </a>
                <p class="mt-4" style="font-family: var(--font-body); font-size: 14px; line-height: 1.6; color: var(--color-text-tertiary);">
                    打开就是舒服，关上也没负担
                </p>
            </div>
        </section>

    </main>

    <!-- Custom styles in body (FullHtmlReplaceHead mode) -->
    <style>
        @media (prefers-reduced-motion: reduce) {
            * {
                transition-duration: 0.01ms !important;
            }
        }
    </style>

    <script>lucide.createIcons();</script>
</body>
</html>
