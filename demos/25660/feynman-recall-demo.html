<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>费曼记忆 · Feynman Recall（参赛演示）</title>
<style>
  :root{
    --bg:#0f1115; --panel:#181b22; --panel-2:#20242d; --border:#2b303b;
    --text:#e6e8ee; --muted:#9aa3b2; --accent:#6ea8fe; --accent-2:#7ee0a8;
    --warn:#ffcd6b; --danger:#ff7a7a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1a2030,transparent),var(--bg);
    color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}
  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 90px}
  .hero h1{font-size:26px;margin:0}
  .hero .sub{color:var(--muted);font-size:14px;margin-top:6px}
  .hero .tag{display:inline-block;margin-top:10px;font-size:12px;color:var(--accent-2);
    border:1px solid var(--border);background:var(--panel);padding:3px 10px;border-radius:999px}
  .tabs{display:flex;gap:6px;margin:22px 0}
  .tab{flex:1;padding:10px 12px;border-radius:10px;cursor:pointer;background:var(--panel);
    border:1px solid var(--border);color:var(--muted);text-align:center;font-size:14px;user-select:none}
  .tab.active{color:var(--text);border-color:var(--accent);background:var(--panel-2)}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
  input[type=text],input[type=password],textarea{width:100%;background:var(--bg);color:var(--text);
    border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;resize:vertical}
  textarea{min-height:150px}
  button{background:var(--accent);color:#08111f;border:none;border-radius:10px;padding:10px 15px;
    font-size:14px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:var(--panel-2);color:var(--text);border:1px solid var(--border)}
  button.sm{padding:5px 10px;font-size:12px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .stat{background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:16px}
  .stat .n{font-size:30px;font-weight:700}
  .stat .l{font-size:12px;color:var(--muted)}
  .muted{color:var(--muted);font-size:13px}
  .pill{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--border);color:var(--muted)}
  .front{font-size:19px;font-weight:600;margin-bottom:8px}
  .section-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
  .back{white-space:pre-wrap}
  .feynman{background:var(--panel-2);border-left:3px solid var(--accent-2);padding:10px 12px;border-radius:8px}
  .excerpt{font-size:12px;color:var(--muted);border-left:2px solid var(--border);padding-left:10px}
  .rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
  .rate button{width:100%}
  .r1{background:var(--danger)} .r2{background:var(--warn)} .r3{background:var(--accent)} .r4{background:var(--accent-2)}
  .rate .s{font-size:11px;opacity:.8;font-weight:400;display:block}
  .deck-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
  .deck-row:last-child{border-bottom:none}
  .clk{cursor:pointer}
  .kp{padding:12px 14px;border-radius:10px;background:var(--panel-2);border:1px solid var(--border);
    margin-bottom:10px;border-left:3px solid var(--border)}
  .kp.imp-3{border-left-color:var(--danger)} .kp.imp-2{border-left-color:var(--accent)} .kp.imp-1{border-left-color:var(--muted)}
  .kp.hot{box-shadow:inset 3px 0 0 var(--danger)}
  .kp-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .kp-title{font-weight:600;font-size:15px}
  .badge{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--border)}
  .badge.teacher{background:#3a1f24;border-color:var(--danger);color:#ffd0d0}
  .badge.core{background:#3a2f1f;border-color:var(--warn);color:#ffe6b0}
  .badge.cat{background:var(--bg);color:var(--muted)}
  .badge.freq{background:#3a1f24;border-color:var(--danger);color:#ffb3b3;font-weight:700}
  .banner{padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px}
  .banner.ok{background:#1f3a2b;border:1px solid var(--accent-2);color:#c9f7dd}
  .banner.err{background:#3a1f24;border:1px solid var(--danger);color:#ffd0d0}
  .progress{height:10px;background:var(--bg);border:1px solid var(--border);border-radius:999px;overflow:hidden;margin-top:14px}
  .progress .bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .3s}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel-2);
    border:1px solid var(--accent-2);color:var(--text);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;
    transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}
  details summary{cursor:pointer;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>费曼记忆 · Feynman Recall</h1>
    <div class="sub">整本教材 + 老师课堂重点 → AI 生成详尽知识点 → 历年真题反推高频考点 → 费曼式 FSRS 复习</div>
    <span class="tag">参赛单文件演示 · 数据存于浏览器本地</span>
  </div>

  <div class="tabs">
    <div class="tab" data-tab="ingest">教材入库</div>
    <div class="tab" data-tab="library">知识库</div>
    <div class="tab" data-tab="review">复习</div>
    <div class="tab" data-tab="dash">仪表盘</div>
  </div>

  <div id="view"></div>

  <div class="foot">
    完整版为 Next.js + SQLite + DeepSeek 全栈应用（真题反推、FSRS 调度、PDF/Word 解析）。本演示在单文件内复刻核心流程，便于零配置体验。
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
/* ───────────────────────── 状态与持久化 ───────────────────────── */
const KEY="feynman_demo_v1";
let state=load();

function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.docs)return s;}catch(e){}
  return seed();
}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function id(){return state.seq++;}

let tab="library", openDocId=1;

/* ───────────────────────── 示例数据（来自 DeepSeek 真实生成） ─────────────── */
function seed(){
  const s={seq:1,docs:[],chunks:[],kps:[],exams:[],hits:[],cards:[],dskey:""};
  const docId=s.seq++, chId=s.seq++;
  s.docs.push({id:docId,title:"生物 · 细胞呼吸",teacherNotes:"重点考有氧呼吸三个阶段的场所和产物"});
  s.chunks.push({id:chId,docId,title:"第3章 细胞呼吸"});
  const K=(title,detail,importance,teacher,category,src)=>{const k={id:s.seq++,docId,chunkId:chId,title,detail,importance,teacher_flag:teacher,category,source_excerpt:src};s.kps.push(k);return k.id;};
  const k1=K("细胞呼吸的定义","细胞呼吸是指有机物在细胞内经过一系列氧化分解，生成二氧化碳或其他产物，释放能量并生成 ATP 的过程。它是细胞获取能量的主要途径。",3,false,"定义","细胞呼吸是指有机物在细胞内经过一系列氧化分解……");
  const k2=K("有氧呼吸是主要形式","有氧呼吸是细胞呼吸的主要形式，在有氧条件下进行，能高效释放能量并生成大量 ATP。",2,false,"分类","有氧呼吸是细胞呼吸的主要形式。");
  const k3=K("有氧呼吸三个阶段概述","全过程分三个阶段：第一阶段在细胞质基质，第二阶段在线粒体基质，第三阶段在线粒体内膜；三阶段共产生大量 ATP。",3,true,"机制","全过程分为三个阶段。");
  const k4=K("第一阶段：场所与反应","在细胞质基质中进行。一分子葡萄糖分解成两分子丙酮酸，释放少量能量，生成少量 [H] 与 ATP；不需要氧参与。",3,true,"机制","第一阶段在细胞质基质中进行。");
  const k5=K("第二阶段：场所与反应","在线粒体基质中进行。丙酮酸和水彻底分解为二氧化碳，释放少量能量，生成大量 [H] 与少量 ATP；不需要氧参与。",3,true,"机制","第二阶段……在线粒体基质中。");
  const k6=K("第三阶段：场所与反应","在线粒体内膜上进行。前两阶段产生的 [H] 与氧结合生成水，释放大量能量、生成大量 ATP；需要氧作为电子受体。",3,true,"机制","第三阶段……在线粒体内膜上进行。");
  const k7=K("总产物与能量","三个阶段共产生大量 ATP，是细胞主要能量来源；最终产物为二氧化碳和水。",2,false,"总结","三个阶段共产生大量 ATP。");
  const k8=K("场所与产物对应关系","必背：①细胞质基质 葡萄糖→丙酮酸+[H]+少量ATP；②线粒体基质 丙酮酸+水→CO₂+[H]+少量ATP；③线粒体内膜 [H]+O₂→水+大量ATP。",3,true,"易错点","考生需牢记场所与产物的对应关系。");
  // 两套历年真题，反推出频次
  const e1=s.seq++, e2=s.seq++;
  s.exams.push({id:e1,docId,name:"2023 期末真题"});
  s.exams.push({id:e2,docId,name:"2022 期末真题"});
  const H=(examId,kpId)=>s.hits.push({examId,kpId});
  H(e1,k1);H(e1,k4);H(e1,k5);H(e1,k6);H(e1,k8);
  H(e2,k3);H(e2,k4);H(e2,k6);H(e2,k8);
  // 由知识点派生复习卡（默认到期）
  for(const k of s.kps) addCard(s,k);
  return s;
}

/* ───────────────────────── FSRS 风格调度（演示版） ─────────────── */
const DAY=86400000;
function newCardState(){return {due:Date.now(),stability:0,difficulty:5,reps:0,lapses:0,statename:"new",last:null};}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
// rating: 1 重来 2 困难 3 良好 4 简单 → 返回 {state, intervalDays}
function schedule(c,rating){
  const now=Date.now();
  if(c.reps===0){
    c.stability={1:0.5,2:1,3:3,4:7}[rating];
    c.difficulty=clamp(6-(rating-3),1,10);
  }else if(rating===1){
    c.lapses++; c.difficulty=clamp(c.difficulty+1,1,10);
    c.stability=Math.max(0.5,c.stability*0.4); c.statename="relearning";
  }else{
    c.difficulty=clamp(c.difficulty-(rating-3)*0.5,1,10);
    const hard=rating===2?0.85:1, easy=rating===4?1.3:1;
    const growth=Math.max(1.1,(2.6-c.difficulty*0.15)*hard*easy);
    c.stability=c.stability*growth; c.statename="review";
  }
  c.reps++; c.last=now;
  const interval = rating===1 ? 0 : Math.max(1,Math.round(c.stability));
  c.due = rating===1 ? now+10*60*1000 : now+interval*DAY;
  return {intervalDays:interval};
}

/* ───────────────────────── 工具 ───────────────────────── */
function addCard(s,k){
  s.cards.push({id:s.seq++,kpId:k.id,docId:k.docId,deckName:(s.docs.find(d=>d.id===k.docId)||{}).title+"（知识点卡）",
    front:"请回忆并解释："+k.title, back:k.detail,
    feynman:"用自己的话向初学者讲清「"+k.title+"」，并说明它为什么重要、与什么相关。",
    ...newCardState()});
}
function examCount(kpId){return new Set(state.hits.filter(h=>h.kpId===kpId).map(h=>h.examId)).size;}
function esc(t){return (t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2200);}

/* ───────────────────────── 渲染 ───────────────────────── */
function render(){
  document.querySelectorAll(".tab").forEach(el=>el.classList.toggle("active",el.dataset.tab===tab));
  const v=document.getElementById("view");
  if(tab==="ingest")v.innerHTML=viewIngest();
  else if(tab==="library")v.innerHTML=openDocId?viewDoc(openDocId):viewLibrary();
  else if(tab==="review")v.innerHTML=viewReview();
  else v.innerHTML=viewDash();
}

/* —— 教材入库 —— */
function viewIngest(){
  return `<div class="card">
    <div class="banner ok">演示提示：可直接“一键载入示例数据”查看完整效果；或填入 DeepSeek Key 实时生成（浏览器直连若被跨域限制，请用全栈版）。</div>
    <label>章节名称</label>
    <input type="text" id="i_title" placeholder="如：第3章 细胞呼吸">
    <label>教材原文（粘贴一章；完整版支持 PDF/Word 上传）</label>
    <textarea id="i_text" placeholder="把教材内容粘贴到这里…"></textarea>
    <label>老师课上强调的重点（可选）—— 填了会把相关知识点标“核心/老师强调”</label>
    <textarea id="i_teacher" style="min-height:80px" placeholder="如：重点考有氧呼吸三个阶段的场所和产物…"></textarea>
    <label>DeepSeek API Key（可选，仅本地保存，用于实时生成）</label>
    <input type="password" id="i_key" placeholder="sk-..." value="${esc(state.dskey||"")}">
    <div class="row" style="margin-top:14px;justify-content:space-between">
      <button class="ghost" onclick="loadSample()">一键载入示例数据</button>
      <button onclick="doGenerate()">生成知识点</button>
    </div>
    <div id="i_status" style="margin-top:12px"></div>
  </div>`;
}

async function doGenerate(){
  const title=val("i_title")||"未命名章节", text=val("i_text").trim(), teacher=val("i_teacher").trim(), key=val("i_key").trim();
  state.dskey=key; save();
  const st=document.getElementById("i_status");
  if(text.length<50){st.innerHTML=`<div class="banner err">文本太短（至少 50 字）。</div>`;return;}
  if(!key){st.innerHTML=`<div class="banner err">未填 DeepSeek Key。可先点“一键载入示例数据”体验效果。</div>`;return;}
  st.innerHTML=`<div class="progress"><div class="bar" style="width:40%"></div></div><div class="muted" style="margin-top:8px">正在调用 DeepSeek 生成知识点…</div>`;
  try{
    const pts=await deepseekKP(key,title,text,teacher);
    const docId=id(), chId=id();
    state.docs.push({id:docId,title,teacherNotes:teacher});
    state.chunks.push({id:chId,docId,title});
    pts.forEach(p=>{
      const imp={core:3,important:2,supplementary:1}[p.importance]||2;
      const k={id:id(),docId,chunkId:chId,title:p.title,detail:p.detail,importance:imp,
        teacher_flag:!!p.teacher_flag,category:p.category||"",source_excerpt:p.source_excerpt||""};
      state.kps.push(k); addCard(state,k);
    });
    save(); openDocId=docId; tab="library"; render();
    toast("已生成 "+pts.length+" 个知识点");
  }catch(e){
    st.innerHTML=`<div class="banner err">生成失败：${esc(e.message)}<br><span class="muted">浏览器直连 DeepSeek 可能被跨域(CORS)限制；可改用本地全栈版，或点“一键载入示例数据”查看效果。</span></div>`;
  }
}

function loadSample(){ state=seed(); save(); openDocId=state.docs[0].id; tab="library"; render(); toast("已载入示例数据"); }

/* —— DeepSeek 调用（浏览器直连，OpenAI 兼容） —— */
async function deepseekJSON(key,system,user,hint,max){
  const resp=await fetch("https://api.deepseek.com/chat/completions",{
    method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
    body:JSON.stringify({model:"deepseek-chat",max_tokens:max||8000,response_format:{type:"json_object"},
      messages:[{role:"system",content:system+"\n\n只输出合法 JSON，结构如下：\n"+hint},{role:"user",content:user}]})
  });
  if(!resp.ok)throw new Error("API "+resp.status);
  const d=await resp.json(); let t=d.choices[0].message.content||"";
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/i); if(f)t=f[1];
  const a=t.indexOf("{"),b=t.lastIndexOf("}"); if(a>=0&&b>a)t=t.slice(a,b+1);
  return JSON.parse(t);
}
async function deepseekKP(key,title,text,teacher){
  const sys="你是顶尖学科老师，把教材整理成详尽知识点：忠于原文不编造；每点 title+detail（讲透）；importance=core/important/supplementary；若与老师重点相关则 importance=core 且 teacher_flag=true；给 category 与 source_excerpt。";
  const hint='{"points":[{"title":"","detail":"","importance":"core|important|supplementary","teacher_flag":false,"category":"","source_excerpt":""}]}';
  const tb=teacher?("\n\n【老师课上强调的重点】\n"+teacher):"";
  const r=await deepseekJSON(key,sys,"章节：「"+title+"」\n\n【教材原文】\n"+text+tb,hint);
  return r.points||[];
}
async function deepseekExam(key,examText,kps){
  const sys="你是命题与备考专家。把真题每道题考查的知识点反向对应到【已有知识点清单】里的条目。kp_id 必须是清单中真实存在的数字 ID，绝不编造；找不到的放进 unmatched。";
  const hint='{"hits":[{"kp_id":0,"question_excerpt":""}],"unmatched":[{"concept":"","question_excerpt":""}]}';
  const catalog=kps.map(k=>k.id+": "+k.title+(k.category?("（"+k.category+"）"):"")).join("\n");
  const r=await deepseekJSON(key,sys,"【已有知识点清单（ID: 名称）】\n"+catalog+"\n\n【历年真题】\n"+examText,hint);
  return {hits:r.hits||[],unmatched:r.unmatched||[]};
}

/* —— 知识库列表 —— */
function viewLibrary(){
  if(state.docs.length===0)return `<div class="card"><div class="front">知识库还是空的</div>
    <div class="muted">去「教材入库」放入教材，或点下面的按钮。</div>
    <div style="margin-top:14px"><button onclick="loadSample()">一键载入示例数据</button></div></div>`;
  let rows=state.docs.map(d=>{
    const kp=state.kps.filter(k=>k.docId===d.id).length;
    return `<div class="deck-row clk" onclick="openDoc(${d.id})"><span>${esc(d.title)}</span>
      <span class="muted">${kp} 个知识点 →</span></div>`;}).join("");
  return `<div class="card"><div class="row" style="justify-content:space-between">
    <strong>我的教材</strong><button class="ghost sm" onclick="tab='ingest';render()">+ 新增</button></div>
    <div style="margin-top:10px">${rows}</div></div>`;
}
function openDoc(i){openDocId=i;tab="library";render();}

/* —— 文档详情：知识点 + 真题频次 —— */
let docByFreq=false;
function viewDoc(i){
  const doc=state.docs.find(d=>d.id===i); if(!doc){openDocId=null;return viewLibrary();}
  const chunks=state.chunks.filter(c=>c.docId===i);
  const exams=state.exams.filter(e=>e.docId===i);
  const kpCard=(p)=>{
    const ec=examCount(p.id);
    const badges=[
      ec>0?`<span class="badge freq">真题 ×${ec}</span>`:"",
      p.teacher_flag?`<span class="badge teacher">老师强调</span>`:"",
      (p.importance===3&&!p.teacher_flag)?`<span class="badge core">核心</span>`:"",
      p.category?`<span class="badge cat">${esc(p.category)}</span>`:""
    ].join("");
    return `<div class="kp imp-${p.importance} ${ec>0?"hot":""}">
      <div class="kp-head"><span class="kp-title">${esc(p.title)}</span>${badges}</div>
      <div class="back" style="margin-top:4px">${esc(p.detail)}</div>
      ${p.source_excerpt?`<div class="excerpt" style="margin-top:6px">${esc(p.source_excerpt)}</div>`:""}</div>`;
  };
  let body;
  if(docByFreq){
    const sorted=[...state.kps.filter(k=>k.docId===i)].sort((a,b)=>examCount(b.id)-examCount(a.id)||b.importance-a.importance);
    const max=sorted.reduce((m,p)=>Math.max(m,examCount(p.id)),0);
    body=`<div class="card"><strong>按真题命中频次（高频优先复习）</strong>
      ${max===0?'<div class="muted" style="margin-top:8px">还没上传真题。</div>':""}
      <div style="margin-top:10px">${sorted.map(kpCard).join("")}</div></div>`;
  }else{
    body=chunks.map(ch=>{
      const pts=state.kps.filter(k=>k.chunkId===ch.id);
      return `<div class="card"><div class="row" style="justify-content:space-between">
        <strong>${esc(ch.title)}</strong><span class="muted">${pts.length} 点</span></div>
        <div style="margin-top:10px">${pts.map(kpCard).join("")}</div></div>`;
    }).join("");
  }
  const examList=exams.length?`<div style="margin-top:8px">${exams.map(e=>`<div class="deck-row"><span>${esc(e.name)}</span><span class="muted">命中 ${state.hits.filter(h=>h.examId===e.id).length} 处</span></div>`).join("")}</div>`:`<div class="muted" style="margin-top:8px">还没上传真题。</div>`;
  return `<div>
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <button class="ghost" onclick="openDocId=null;render()">← 返回</button>
      <div class="row">
        <button class="${docByFreq?'':'ghost'} sm" onclick="docByFreq=true;render()">按真题频次</button>
        <button class="${docByFreq?'ghost':''} sm" onclick="docByFreq=false;render()">按章节</button>
        <button class="sm" onclick="makeCards(${i})">转复习卡</button>
      </div>
    </div>
    <div class="row" style="gap:8px;margin-bottom:8px">
      <h1 style="font-size:18px;margin:0">${esc(doc.title)}</h1>
      <button class="ghost sm" onclick="renameDoc(${i})">✎ 改名</button>
    </div>
    <div class="card"><div class="row" style="justify-content:space-between">
      <strong>历年真题分析</strong><button class="ghost sm" onclick="toggleExam(${i})">+ 上传真题</button></div>
      ${examList}
      <div id="exambox"></div>
    </div>
    ${body}
  </div>`;
}
function renameDoc(i){const doc=state.docs.find(d=>d.id===i);const t=prompt("新的教材名称：",doc.title);if(t&&t.trim()){doc.title=t.trim();save();render();toast("已改名");}}
function makeCards(i){
  const have=new Set(state.cards.map(c=>c.kpId));
  let n=0; for(const k of state.kps.filter(k=>k.docId===i)){if(!have.has(k.id)){addCard(state,k);n++;}}
  save(); toast(n>0?("已生成 "+n+" 张复习卡"):"已全部转过，无新卡");
}
function toggleExam(i){
  const box=document.getElementById("exambox");
  if(box.innerHTML){box.innerHTML="";return;}
  box.innerHTML=`<div style="margin-top:12px">
    <label>真题名称</label><input type="text" id="ex_name" placeholder="2024 期末卷">
    <label>真题内容（粘贴；需已填 DeepSeek Key 实时分析）</label>
    <textarea id="ex_text" style="min-height:120px" placeholder="把真题题目粘贴到这里…"></textarea>
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button onclick="doExam(${i})">分析这套真题</button></div>
    <div id="ex_status"></div></div>`;
}
async function doExam(i){
  const name=val("ex_name")||"未命名真题", text=val("ex_text").trim(), key=(state.dskey||"").trim();
  const st=document.getElementById("ex_status");
  if(text.length<20){st.innerHTML=`<div class="banner err">真题内容太短。</div>`;return;}
  if(!key){st.innerHTML=`<div class="banner err">未填 DeepSeek Key（在“教材入库”页填入）。示例数据已自带真题频次可供查看。</div>`;return;}
  const kps=state.kps.filter(k=>k.docId===i);
  st.innerHTML=`<div class="muted" style="margin-top:8px">正在用 DeepSeek 分析真题…</div>`;
  try{
    const {hits,unmatched}=await deepseekExam(key,text,kps);
    const valid=new Set(kps.map(k=>k.id)); const good=hits.filter(h=>valid.has(h.kp_id));
    const exId=id(); state.exams.push({id:exId,docId:i,name});
    good.forEach(h=>state.hits.push({examId:exId,kpId:h.kp_id}));
    save(); render(); toast("已映射 "+good.length+" 处到知识点");
    if(unmatched.length){toast("另有 "+unmatched.length+" 个真题考点知识库未覆盖");}
  }catch(e){
    st.innerHTML=`<div class="banner err">分析失败：${esc(e.message)}（可能为跨域限制，请用全栈版）</div>`;
  }
}

/* —— 复习 —— */
let revIdx=0, revealed=false, revDone=0;
function dueCards(){return state.cards.filter(c=>c.due<=Date.now())
  .sort((a,b)=>examCount(b.kpId)-examCount(a.kpId)||a.due-b.due);}
function viewReview(){
  const q=dueCards();
  if(q.length===0)return `<div class="card"><div class="front">🎉 今日复习完成</div>
    <div class="muted">本轮已复习 ${revDone} 张。没有到期卡片了。${state.cards.length===0?'去知识库把知识点“转复习卡”。':'明天再来，或去知识库加新卡。'}</div></div>`;
  if(revIdx>=q.length)revIdx=0;
  const c=q[revIdx]; const ec=examCount(c.kpId);
  return `<div>
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <span class="pill">${esc(c.deckName||"")}</span>
      <span class="muted">${revIdx+1} / ${q.length}（本轮已复习 ${revDone}）${ec>0?' · 高频考点 ×'+ec:''}</span>
    </div>
    <div class="card">
      <div class="front">${esc(c.front)}</div>
      ${!revealed?`<button style="margin-top:12px" onclick="revealed=true;render()">显示答案</button>`:`
        <div class="section-label">答案</div><div class="back">${esc(c.back)}</div>
        <div class="section-label">费曼自测</div><div class="feynman">${esc(c.feynman)}</div>
        <div class="rate">
          <button class="r1" onclick="rate(1)">重来<span class="s">没记住</span></button>
          <button class="r2" onclick="rate(2)">困难<span class="s">勉强</span></button>
          <button class="r3" onclick="rate(3)">良好<span class="s">记得</span></button>
          <button class="r4" onclick="rate(4)">简单<span class="s">秒答</span></button>
        </div>`}
    </div></div>`;
}
function rate(r){
  const q=dueCards(); const c=q[revIdx]; if(!c)return;
  const {intervalDays}=schedule(c,r); revDone++; revealed=false; save();
  toast(r===1?"稍后再练（约 10 分钟后）":("下次复习：约 "+intervalDays+" 天后"));
  render();
}

/* —— 仪表盘 —— */
function viewDash(){
  const total=state.cards.length, due=dueCards().length;
  const decks={}; state.cards.forEach(c=>{decks[c.deckName]=(decks[c.deckName]||{t:0,d:0});decks[c.deckName].t++;if(c.due<=Date.now())decks[c.deckName].d++;});
  const drows=Object.keys(decks).map(n=>`<div class="deck-row"><span>${esc(n)}</span><span class="muted">${decks[n].d>0?'<span class="pill">待复习 '+decks[n].d+'</span> ':''}共 ${decks[n].t} 张</span></div>`).join("")||'<div class="muted">还没有复习卡。</div>';
  const hotKp=[...state.kps].map(k=>({k,ec:examCount(k.id)})).filter(x=>x.ec>0).sort((a,b)=>b.ec-a.ec).slice(0,5);
  const hot=hotKp.length?hotKp.map(x=>`<div class="deck-row"><span>${esc(x.k.title)}</span><span class="badge freq">真题 ×${x.ec}</span></div>`).join(""):'<div class="muted">上传真题后这里显示高频考点排行。</div>';
  return `<div class="grid">
      <div class="stat"><div class="n">${due}</div><div class="l">今日待复习</div></div>
      <div class="stat"><div class="n">${revDone}</div><div class="l">本轮已复习</div></div>
      <div class="stat"><div class="n">${total}</div><div class="l">复习卡总数</div></div>
    </div>
    <div class="card" style="margin-top:16px"><strong>🔥 高频考点 Top（真题反推）</strong><div style="margin-top:10px">${hot}</div></div>
    <div class="card"><strong>卡组</strong><div style="margin-top:10px">${drows}</div></div>
    <div class="card"><details><summary>演示数据管理</summary>
      <div class="row" style="margin-top:10px">
        <button class="ghost sm" onclick="loadSample()">重置为示例数据</button>
        <button class="ghost sm" onclick="if(confirm('清空所有本地数据？')){localStorage.removeItem(KEY);state=seed();save();render();}">清空全部</button>
      </div></details></div>`;
}

/* ───────────────────────── 绑定 ───────────────────────── */
function val(id){const el=document.getElementById(id);return el?el.value:"";}
document.querySelectorAll(".tab").forEach(el=>el.addEventListener("click",()=>{tab=el.dataset.tab;if(tab==="library")openDocId=openDocId;render();}));
render();
</script>
</body>
</html>
