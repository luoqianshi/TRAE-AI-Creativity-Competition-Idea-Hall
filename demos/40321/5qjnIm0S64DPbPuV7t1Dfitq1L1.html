<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心仓 Mind Closet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #B8A9C9;
      --primary-light: #D4C8E0;
      --bg: #FAF8F5;
      --bg-card: #FFFFFF;
      --text: #4A4458;
      --text-light: #7A7488;
      --accent-warm: #9B8EA8;
      --accent-mint: #A8D5D1;
      --accent-coral: #F2B5A8;
      --accent-gold: #E8D5B5;
      --shadow: rgba(74, 68, 88, 0.08);
      --shadow-hover: rgba(74, 68, 88, 0.15);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    h1, h2, h3 {
      font-family: 'Noto Serif SC', serif;
      font-weight: 500;
    }

    /* Background decoration */
    .bg-decoration {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .cloud {
      position: absolute;
      background: linear-gradient(135deg, rgba(184, 169, 201, 0.15), rgba(168, 213, 209, 0.1));
      border-radius: 50%;
      filter: blur(40px);
      animation: float 20s ease-in-out infinite;
    }

    .cloud:nth-child(1) { width: 300px; height: 200px; top: 10%; left: 10%; animation-delay: 0s; }
    .cloud:nth-child(2) { width: 400px; height: 250px; top: 60%; right: 5%; animation-delay: -5s; animation-duration: 25s; }
    .cloud:nth-child(3) { width: 350px; height: 220px; bottom: 20%; left: 30%; animation-delay: -10s; animation-duration: 22s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(20px, -15px) scale(1.05); }
      50% { transform: translate(-10px, 10px) scale(0.95); }
      75% { transform: translate(15px, 5px) scale(1.02); }
    }

    /* Main container */
    .container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      min-height: 100vh;
    }

    /* Views */
    .view {
      display: none;
      animation: fadeIn 0.6s ease-out;
    }

    .view.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Home View */
    .home-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 40px);
      text-align: center;
      padding: 40px 20px;
    }

    .home-view.active {
      display: flex;
    }

    .logo-area {
      margin-bottom: 40px;
    }

    .logo {
      width: 120px;
      height: 120px;
      background: linear-gradient(135deg, var(--primary), var(--accent-mint));
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 20px 60px var(--shadow);
      animation: breathe 4s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); box-shadow: 0 20px 60px var(--shadow); }
      50% { transform: scale(1.02); box-shadow: 0 25px 70px var(--shadow-hover); }
    }

    .logo svg {
      width: 60px;
      height: 60px;
      fill: white;
    }

    .brand-name {
      font-size: 2.5rem;
      background: linear-gradient(135deg, var(--primary), var(--accent-warm));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .brand-tagline {
      color: var(--text-light);
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: 2px;
    }

    .intro-text {
      max-width: 500px;
      color: var(--text-light);
      line-height: 1.8;
      margin-bottom: 50px;
      font-size: 1rem;
    }

    .start-btn {
      background: linear-gradient(135deg, var(--primary), var(--accent-warm));
      color: white;
      border: none;
      padding: 18px 50px;
      font-size: 1.1rem;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 40px rgba(184, 169, 201, 0.4);
      font-family: 'Noto Sans SC', sans-serif;
      letter-spacing: 1px;
    }

    .start-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 50px rgba(184, 169, 201, 0.5);
    }

    /* Emotion Wheel View */
    .emotion-view {
      padding: 40px 0;
    }

    .view-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .view-title {
      font-size: 1.8rem;
      color: var(--text);
      margin-bottom: 8px;
    }

    .view-subtitle {
      color: var(--text-light);
      font-size: 0.95rem;
    }

    .step-indicator {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 30px;
    }

    .step-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary-light);
      transition: all 0.3s ease;
    }

    .step-dot.active {
      background: var(--primary);
      width: 24px;
      border-radius: 4px;
    }

    .emotion-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 30px;
    }

    @media (max-width: 600px) {
      .emotion-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .emotion-card {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid transparent;
      box-shadow: 0 4px 20px var(--shadow);
    }

    .emotion-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 30px var(--shadow-hover);
    }

    .emotion-card.selected {
      border-color: var(--primary);
      background: linear-gradient(135deg, rgba(184, 169, 201, 0.1), rgba(168, 213, 209, 0.1));
    }

    .emotion-emoji {
      font-size: 2.5rem;
      margin-bottom: 12px;
      display: block;
    }

    .emotion-name {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text);
    }

    /* Sub emotions */
    .sub-emotions {
      display: none;
      animation: fadeIn 0.4s ease-out;
    }

    .sub-emotions.active {
      display: block;
    }

    .sub-emotion-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .sub-emotion-title {
      font-size: 1.3rem;
      color: var(--text);
      margin-bottom: 6px;
    }

    .sub-emotion-hint {
      color: var(--text-light);
      font-size: 0.9rem;
    }

    .sub-emotion-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-bottom: 30px;
    }

    .sub-emotion-tag {
      background: var(--bg-card);
      border: 1.5px solid var(--primary-light);
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.95rem;
      color: var(--text);
    }

    .sub-emotion-tag:hover {
      background: var(--primary-light);
      color: white;
    }

    .sub-emotion-tag.selected {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .action-row {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    .btn {
      padding: 14px 36px;
      border-radius: 30px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Noto Sans SC', sans-serif;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent-warm));
      color: white;
      box-shadow: 0 8px 30px rgba(184, 169, 201, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(184, 169, 201, 0.4);
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text);
      border: 1.5px solid var(--primary-light);
    }

    .btn-secondary:hover {
      background: var(--primary-light);
      color: white;
    }

    /* Writing View */
    .writing-view {
      padding: 40px 0;
      max-width: 650px;
      margin: 0 auto;
    }

    .writing-card {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 10px 50px var(--shadow);
    }

    .writing-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .writing-emotion-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(184, 169, 201, 0.15), rgba(168, 213, 209, 0.1));
      padding: 8px 20px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .writing-emotion-badge span:first-child {
      font-size: 1.3rem;
    }

    .writing-emotion-badge span:last-child {
      color: var(--text);
      font-weight: 500;
    }

    .writing-prompts {
      margin-bottom: 24px;
    }

    .prompt-item {
      color: var(--text-light);
      font-size: 0.95rem;
      line-height: 1.8;
      padding: 12px 0;
      border-bottom: 1px dashed var(--primary-light);
      font-style: italic;
    }

    .prompt-item:last-child {
      border-bottom: none;
    }

    .writing-area {
      position: relative;
      margin-bottom: 24px;
    }

    .writing-textarea {
      width: 100%;
      min-height: 200px;
      border: 2px solid var(--primary-light);
      border-radius: 16px;
      padding: 20px;
      font-size: 1rem;
      line-height: 1.8;
      font-family: 'Noto Sans SC', sans-serif;
      color: var(--text);
      resize: vertical;
      transition: border-color 0.3s ease;
      background: linear-gradient(135deg, rgba(250, 248, 245, 0.8), rgba(255, 255, 255, 1));
    }

    .writing-textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .writing-textarea::placeholder {
      color: var(--text-light);
      opacity: 0.7;
    }

    .word-count {
      text-align: right;
      color: var(--text-light);
      font-size: 0.85rem;
      margin-top: 8px;
    }

    .response-card {
      background: linear-gradient(135deg, rgba(168, 213, 209, 0.1), rgba(242, 181, 168, 0.1));
      border-radius: 16px;
      padding: 24px;
      margin-top: 24px;
      display: none;
      animation: fadeIn 0.6s ease-out;
    }

    .response-card.visible {
      display: block;
    }

    .response-label {
      font-size: 0.85rem;
      color: var(--accent-warm);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .response-text {
      font-size: 1.1rem;
      color: var(--text);
      line-height: 1.8;
      font-family: 'Noto Serif SC', serif;
    }

    .writing-actions {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 24px;
    }

    /* Diary View */
    .diary-view {
      padding: 40px 0;
    }

    .diary-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .diary-stats {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 20px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--primary);
      font-family: 'Noto Serif SC', serif;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-light);
    }

    .diary-timeline {
      position: relative;
      padding-left: 30px;
    }

    .diary-timeline::before {
      content: '';
      position: absolute;
      left: 8px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(to bottom, var(--primary-light), var(--accent-mint));
      border-radius: 2px;
    }

    .diary-item {
      position: relative;
      background: var(--bg-card);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px var(--shadow);
      animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .diary-item::before {
      content: '';
      position: absolute;
      left: -26px;
      top: 28px;
      width: 12px;
      height: 12px;
      background: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(184, 169, 201, 0.3);
    }

    .diary-date {
      font-size: 0.85rem;
      color: var(--text-light);
      margin-bottom: 8px;
    }

    .diary-emotion {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, rgba(184, 169, 201, 0.15), rgba(168, 213, 209, 0.1));
      padding: 6px 14px;
      border-radius: 15px;
      margin-bottom: 12px;
    }

    .diary-emotion span:first-child {
      font-size: 1.1rem;
    }

    .diary-emotion span:last-child {
      font-size: 0.9rem;
      color: var(--text);
    }

    .diary-content {
      color: var(--text);
      line-height: 1.8;
      font-size: 0.95rem;
    }

    .diary-empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-light);
    }

    .diary-empty-icon {
      font-size: 4rem;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .diary-empty-text {
      font-size: 1.1rem;
      margin-bottom: 8px;
    }

    .diary-empty-hint {
      font-size: 0.9rem;
      opacity: 0.7;
    }

    /* Sound View */
    .sound-view {
      padding: 40px 0;
    }

    .sound-categories {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 30px;
    }

    @media (max-width: 600px) {
      .sound-categories {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .sound-card {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px var(--shadow);
    }

    .sound-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 30px var(--shadow-hover);
    }

    .sound-card.active {
      border: 2px solid var(--primary);
      background: linear-gradient(135deg, rgba(184, 169, 201, 0.1), rgba(168, 213, 209, 0.1));
    }

    .sound-icon {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, var(--primary-light), var(--accent-mint));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 1.8rem;
    }

    .sound-name {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 4px;
    }

    .sound-desc {
      font-size: 0.85rem;
      color: var(--text-light);
    }

    .sound-player {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 10px 50px var(--shadow);
    }

    .now-playing-label {
      font-size: 0.85rem;
      color: var(--text-light);
      margin-bottom: 8px;
    }

    .now-playing-name {
      font-size: 1.3rem;
      font-family: 'Noto Serif SC', serif;
      color: var(--text);
      margin-bottom: 30px;
    }

    .player-visual {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto 30px;
    }

    .player-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px solid var(--primary-light);
    }

    .player-circle:nth-child(1) {
      width: 200px;
      height: 200px;
      animation: pulse 3s ease-in-out infinite;
    }

    .player-circle:nth-child(2) {
      width: 160px;
      height: 160px;
      animation: pulse 3s ease-in-out infinite 0.5s;
    }

    .player-circle:nth-child(3) {
      width: 120px;
      height: 120px;
      animation: pulse 3s ease-in-out infinite 1s;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.6; transform: translate(-50%, -50%) scale(1.05); }
    }

    .play-btn {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--primary), var(--accent-warm));
      border: none;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      box-shadow: 0 10px 40px rgba(184, 169, 201, 0.4);
      position: relative;
      z-index: 1;
    }

    .play-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 50px rgba(184, 169, 201, 0.5);
    }

    .play-btn svg {
      width: 30px;
      height: 30px;
      fill: white;
    }

    .volume-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
    }

    .volume-icon {
      color: var(--text-light);
    }

    .volume-slider {
      width: 150px;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--primary-light);
      border-radius: 3px;
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      background: var(--primary);
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .volume-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 12px 0;
      box-shadow: 0 -4px 20px var(--shadow);
      z-index: 100;
      display: none;
    }

    .bottom-nav.visible {
      display: block;
    }

    .nav-items {
      display: flex;
      justify-content: center;
      gap: 8px;
      max-width: 500px;
      margin: 0 auto;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      border-radius: 12px;
      color: var(--text-light);
      background: none;
      border: none;
      font-family: 'Noto Sans SC', sans-serif;
    }

    .nav-item:hover {
      background: rgba(184, 169, 201, 0.1);
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-item svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
    }

    .nav-item span {
      font-size: 0.75rem;
    }

    /* Quick music toggle */
    .music-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background: var(--bg-card);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px var(--shadow);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99;
    }

    .music-toggle.visible {
      display: flex;
    }

    .music-toggle svg {
      width: 24px;
      height: 24px;
      stroke: var(--primary);
      fill: none;
      stroke-width: 1.5;
    }

    .music-toggle.playing {
      background: linear-gradient(135deg, var(--primary), var(--accent-warm));
    }

    .music-toggle.playing svg {
      stroke: white;
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      .container {
        padding: 16px;
      }

      .writing-card, .sound-player {
        padding: 24px;
      }

      .emotion-card {
        padding: 20px 16px;
      }

      .diary-stats {
        gap: 20px;
      }

      .stat-value {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="bg-decoration">
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>
  </div>

  <div class="container">
    <!-- Home View -->
    <div id="home-view" class="view home-view active">
      <div class="logo-area">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
          </svg>
        </div>
        <h1 class="brand-name">心仓</h1>
        <p class="brand-tagline">Mind Closet</p>
      </div>
      <p class="intro-text">
        轻轻走进这扇门，给自己5分钟的时间。<br>
        选一个最贴近此刻的感受，写下心里的声音。<br>
        这里没有评判，只有安静的陪伴。
      </p>
      <button class="start-btn" onclick="startJourney()">开始探索</button>
    </div>

    <!-- Emotion Wheel View -->
    <div id="emotion-view" class="view emotion-view">
      <div class="step-indicator">
        <div class="step-dot active"></div>
        <div class="step-dot"></div>
        <div class="step-dot"></div>
      </div>

      <div class="view-header">
        <h2 class="view-title">此刻，你感受如何？</h2>
        <p class="view-subtitle">选择最贴近你心情的那个词</p>
      </div>

      <div class="emotion-grid" id="emotion-grid"></div>

      <div class="sub-emotions" id="sub-emotions">
        <div class="sub-emotion-header">
          <h3 class="sub-emotion-title" id="sub-emotion-title">细分情绪</h3>
          <p class="sub-emotion-hint">可以多选，找到最贴合的词</p>
        </div>
        <div class="sub-emotion-grid" id="sub-emotion-grid"></div>
        <div class="action-row">
          <button class="btn btn-secondary" onclick="backToCategories()">上一步</button>
          <button class="btn btn-primary" onclick="goToWriting()">继续书写</button>
        </div>
      </div>
    </div>

    <!-- Writing View -->
    <div id="writing-view" class="view writing-view">
      <div class="writing-card">
        <div class="writing-header">
          <div class="writing-emotion-badge">
            <span id="writing-emoji"></span>
            <span id="writing-emotion-name"></span>
          </div>
          <h2 class="view-title">在这里，慢慢说</h2>
        </div>

        <div class="writing-prompts">
          <p class="prompt-item">"今天发生了什么，让你有这样的感受？"</p>
          <p class="prompt-item">"这件事让你想到了什么？"</p>
          <p class="prompt-item">"如果这份感受会说话，它想说什么？"</p>
        </div>

        <div class="writing-area">
          <textarea
            id="writing-text"
            class="writing-textarea"
            placeholder="在这里写下你的心情，没有对错，只管说出来..."
          ></textarea>
          <div class="word-count"><span id="word-count">0</span> 字</div>
        </div>

        <div class="response-card" id="response-card">
          <div class="response-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            温暖的回应
          </div>
          <p class="response-text" id="response-text"></p>
        </div>

        <div class="writing-actions">
          <button class="btn btn-secondary" onclick="saveDraft()">保存草稿</button>
          <button class="btn btn-primary" onclick="submitWriting()">完成书写</button>
        </div>
      </div>
    </div>

    <!-- Diary View -->
    <div id="diary-view" class="view diary-view">
      <div class="view-header">
        <h2 class="view-title">心绪日记</h2>
        <p class="view-subtitle">你的每一次书写，都在这里沉淀</p>
        <div class="diary-stats">
          <div class="stat-item">
            <div class="stat-value" id="total-entries">0</div>
            <div class="stat-label">篇日记</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="week-summary">—</div>
            <div class="stat-label">本周感受</div>
          </div>
        </div>
      </div>

      <div class="diary-timeline" id="diary-timeline">
        <div class="diary-empty" id="diary-empty">
          <div class="diary-empty-icon">📝</div>
          <p class="diary-empty-text">还没有日记</p>
          <p class="diary-empty-hint">完成一次情绪梳理后，这里就会有记录啦</p>
        </div>
      </div>
    </div>

    <!-- Sound View -->
    <div id="sound-view" class="view sound-view">
      <div class="view-header">
        <h2 class="view-title">情绪音药舱</h2>
        <p class="view-subtitle">让声音轻轻陪伴你</p>
      </div>

      <div class="sound-categories" id="sound-categories"></div>

      <div class="sound-player">
        <div class="now-playing-label">正在播放</div>
        <div class="now-playing-name" id="now-playing-name">选择一种音效开始</div>
        <div class="player-visual">
          <div class="player-circle"></div>
          <div class="player-circle"></div>
          <div class="player-circle"></div>
        </div>
        <button class="play-btn" id="play-btn" onclick="togglePlay()">
          <svg id="play-icon" viewBox="0 0 24 24">
            <polygon points="5,3 19,12 5,21"/>
          </svg>
        </button>
        <div class="volume-control">
          <span class="volume-icon">🔈</span>
          <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="70">
          <span class="volume-icon">🔊</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" id="bottom-nav">
    <div class="nav-items">
      <button class="nav-item active" data-view="home-view" onclick="navigateTo('home-view')">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </button>
      <button class="nav-item" data-view="emotion-view" onclick="navigateTo('emotion-view')">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
        <span>梳理</span>
      </button>
      <button class="nav-item" data-view="diary-view" onclick="navigateTo('diary-view')">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span>日记</span>
      </button>
      <button class="nav-item" data-view="sound-view" onclick="navigateTo('sound-view')">
        <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <span>音乐</span>
      </button>
    </div>
  </nav>

  <!-- Music Toggle Button -->
  <button class="music-toggle" id="music-toggle" onclick="toggleMusic()">
    <svg viewBox="0 0 24 24" id="music-toggle-icon">
      <path d="M9 18V5l12-2v13"/>
      <circle cx="6" cy="18" r="3"/>
      <circle cx="18" cy="16" r="3"/>
    </svg>
  </button>

  <script>
    // Emotion data
    const emotions = [
      { id: 'happy', name: '开心', emoji: '😊', color: '#F2B5A8',
        subEmotions: ['愉悦', '兴奋', '满足', '轻松', '期待', '庆幸'] },
      { id: 'sad', name: '难过', emoji: '😢', color: '#A8D5D1',
        subEmotions: ['委屈', '失落', '空虚', '自责', '后悔', '孤独'] },
      { id: 'anxious', name: '焦虑', emoji: '😰', color: '#B8A9C9',
        subEmotions: ['紧张', '不安', '压力', '恐慌', '烦躁', '担忧'] },
      { id: 'angry', name: '愤怒', emoji: '😤', color: '#E8D5B5',
        subEmotions: ['生气', '恼火', '挫败', '怨恨', '恼怒', '不耐烦'] },
      { id: 'peaceful', name: '平静', emoji: '😌', color: '#9B8EA8',
        subEmotions: ['放松', '安心', '满足', '释然', '通透', '清明'] },
      { id: 'confused', name: '迷茫', emoji: '😶', color: '#D4C8E0',
        subEmotions: ['困惑', '犹豫', '彷徨', '无措', '麻木', '空洞'] }
    ];

    // Response messages by emotion category
    const responses = {
      happy: [
        '今天的你值得被庆祝，每一个小确幸都值得被记住。',
        '快乐是会传染的，愿这份心情能延续更久。',
        '真好，能感受到开心本身就是一件幸福的事。',
        '你的笑容，是今天最美的风景。'
      ],
      sad: [
        '难过了也没关系，我在这里陪着你。',
        '难过是真实的感受，允许自己这样。',
        '有时候，泪水是心的语言，你在认真倾听它。',
        '不管多难过，天总会亮的。'
      ],
      anxious: [
        '焦虑是在提醒你，有些事对你很重要。',
        '深呼吸，慢慢来，你比自己想的更强大。',
        '这一刻的不安，会慢慢过去的。',
        '试着把注意力放在当下，一切都会好的。'
      ],
      angry: [
        '愤怒也是一种力量，它在告诉你边界在哪里。',
        '先深呼吸，让自己平静下来再面对。',
        '你的感受很重要，即使是愤怒也值得被尊重。',
        '给愤怒一点空间，然后轻轻放下。'
      ],
      peaceful: [
        '这份平静，是你给自己的最好礼物。',
        '享受当下的安宁，感恩此刻的拥有。',
        '心境如水，清明通透。',
        '你找到了内心的宁静，这很珍贵。'
      ],
      confused: [
        '迷茫是成长的开始，你正在寻找答案。',
        '不用急着看清一切，有些路走着走着就会清晰。',
        '给自己一些时间，你总会找到方向的。',
        '困惑也是一种探索，你在接近真相。'
      ]
    };

    // Sound data
    const sounds = [
      { id: 'rain', name: '雨声', emoji: '🌧️', desc: '细雨绵绵', audio: null },
      { id: 'forest', name: '森林', emoji: '🌲', desc: '鸟鸣风语', audio: null },
      { id: 'waves', name: '海浪', emoji: '🌊', desc: '潮起潮落', audio: null },
      { id: 'fire', name: '壁炉', emoji: '🔥', desc: '温暖火光', audio: null },
      { id: 'wind', name: '清风', emoji: '🍃', desc: '微风轻拂', audio: null },
      { id: 'night', name: '夜晚', emoji: '🌙', desc: '宁静夜色', audio: null }
    ];

    // App state
    let state = {
      selectedCategory: null,
      selectedSubEmotions: [],
      writingContent: '',
      currentView: 'home-view',
      diaryEntries: JSON.parse(localStorage.getItem('mindCloset_diary') || '[]'),
      emotionLibrary: JSON.parse(localStorage.getItem('mindCloset_library') || '[]'),
      currentSound: null,
      isPlaying: false,
      volume: 0.7,
      draftText: localStorage.getItem('mindCloset_draft') || ''
    };

    // Audio context for ambient sounds
    let audioContext = null;
    let oscillators = [];

    // Initialize
    function init() {
      renderEmotionGrid();
      renderSoundCategories();
      loadDraft();
      updateDiaryStats();

      if (state.diaryEntries.length > 0) {
        renderDiaryEntries();
      }
    }

    // Render emotion grid
    function renderEmotionGrid() {
      const grid = document.getElementById('emotion-grid');
      grid.innerHTML = emotions.map(e => `
        <div class="emotion-card" data-id="${e.id}" onclick="selectCategory('${e.id}')">
          <span class="emotion-emoji">${e.emoji}</span>
          <span class="emotion-name">${e.name}</span>
        </div>
      `).join('');
    }

    // Select emotion category
    function selectCategory(id) {
      state.selectedCategory = emotions.find(e => e.id === id);
      state.selectedSubEmotions = [];

      // Update UI
      document.querySelectorAll('.emotion-card').forEach(card => {
        card.classList.toggle('selected', card.dataset.id === id);
      });

      // Show sub emotions
      const subContainer = document.getElementById('sub-emotions');
      const title = document.getElementById('sub-emotion-title');
      const grid = document.getElementById('sub-emotion-grid');

      title.textContent = state.selectedCategory.name + '，是怎样的感受？';
      grid.innerHTML = state.selectedCategory.subEmotions.map(e => `
        <span class="sub-emotion-tag" onclick="toggleSubEmotion(this, '${e}')">${e}</span>
      `).join('');

      subContainer.classList.add('active');
      document.querySelector('.step-dot:nth-child(2)').classList.add('active');
    }

    // Toggle sub emotion selection
    function toggleSubEmotion(el, emotion) {
      el.classList.toggle('selected');

      if (state.selectedSubEmotions.includes(emotion)) {
        state.selectedSubEmotions = state.selectedSubEmotions.filter(e => e !== emotion);
      } else {
        state.selectedSubEmotions.push(emotion);
      }
    }

    // Back to categories
    function backToCategories() {
      document.getElementById('sub-emotions').classList.remove('active');
      document.querySelectorAll('.step-dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === 0);
      });
      document.querySelectorAll('.emotion-card').forEach(card => {
        card.classList.remove('selected');
      });
    }

    // Go to writing
    function goToWriting() {
      if (!state.selectedSubEmotions.length) {
        alert('请至少选择一个细分情绪');
        return;
      }

      document.getElementById('writing-emoji').textContent = state.selectedCategory.emoji;
      document.getElementById('writing-emotion-name').textContent = state.selectedSubEmotions.join('、');
      document.getElementById('sub-emotions').classList.remove('active');
      document.querySelectorAll('.step-dot').forEach((dot, i) => {
        dot.classList.toggle('active', i < 3);
      });

      navigateTo('writing-view');

      if (state.draftText) {
        document.getElementById('writing-text').value = state.draftText;
        updateWordCount();
      }
    }

    // Update word count
    function updateWordCount() {
      const text = document.getElementById('writing-text').value;
      document.getElementById('word-count').textContent = text.length;
      state.writingContent = text;
    }

    // Save draft
    function saveDraft() {
      localStorage.setItem('mindCloset_draft', state.writingContent);
      alert('草稿已保存');
    }

    // Load draft
    function loadDraft() {
      if (state.draftText) {
        document.getElementById('writing-text').value = state.draftText;
      }
    }

    // Submit writing
    function submitWriting() {
      const content = state.writingContent.trim();

      if (!content) {
        alert('请写下你的心情');
        return;
      }

      // Generate response
      const categoryResponses = responses[state.selectedCategory.id];
      const response = categoryResponses[Math.floor(Math.random() * categoryResponses.length)];
      document.getElementById('response-text').textContent = response;
      document.getElementById('response-card').classList.add('visible');

      // Save to diary
      const entry = {
        id: Date.now().toString(),
        date: new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' }),
        category: state.selectedCategory.name,
        emoji: state.selectedCategory.emoji,
        subEmotions: [...state.selectedSubEmotions],
        content: content,
        createdAt: Date.now()
      };

      state.diaryEntries.unshift(entry);
      localStorage.setItem('mindCloset_diary', JSON.stringify(state.diaryEntries));

      // Update emotion library
      state.selectedSubEmotions.forEach(e => {
        if (!state.emotionLibrary.includes(e)) {
          state.emotionLibrary.push(e);
        }
      });
      localStorage.setItem('mindCloset_library', JSON.stringify(state.emotionLibrary));

      // Clear draft
      localStorage.removeItem('mindCloset_draft');
      state.draftText = '';

      // Show music toggle
      document.getElementById('music-toggle').classList.add('visible');

      // Update stats
      updateDiaryStats();

      setTimeout(() => {
        alert('书写已完成，已存入你的日记');
      }, 1000);
    }

    // Render sound categories
    function renderSoundCategories() {
      const grid = document.getElementById('sound-categories');
      grid.innerHTML = sounds.map(s => `
        <div class="sound-card" data-id="${s.id}" onclick="selectSound('${s.id}')">
          <div class="sound-icon">${s.emoji}</div>
          <div class="sound-name">${s.name}</div>
          <div class="sound-desc">${s.desc}</div>
        </div>
      `).join('');
    }

    // Select sound
    function selectSound(id) {
      state.currentSound = sounds.find(s => s.id === id);

      document.querySelectorAll('.sound-card').forEach(card => {
        card.classList.toggle('active', card.dataset.id === id);
      });

      document.getElementById('now-playing-name').textContent = state.currentSound.name + ' · ' + state.currentSound.desc;

      // Auto play when selected
      if (!state.isPlaying) {
        togglePlay();
      }
    }

    // Toggle play
    function togglePlay() {
      state.isPlaying = !state.isPlaying;

      const btn = document.getElementById('play-btn');
      const icon = document.getElementById('play-icon');

      if (state.isPlaying) {
        icon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
        btn.style.animation = 'pulse 2s ease-in-out infinite';
        startAmbientSound();
      } else {
        icon.innerHTML = '<polygon points="5,3 19,12 5,21"/>';
        btn.style.animation = 'none';
        stopAmbientSound();
      }
    }

    // Start ambient sound (using Web Audio API for demo)
    function startAmbientSound() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }

      // Create brown noise for ambient effect
      const bufferSize = 2 * audioContext.sampleRate;
      const noiseBuffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
      const output = noiseBuffer.getChannelData(0);

      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        output[i] = (0.02 * white) + (0.98 * (output[i - 1] || 0));
      }

      const whiteNoise = audioContext.createBufferSource();
      whiteNoise.buffer = noiseBuffer;
      whiteNoise.loop = true;

      const filter = audioContext.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = state.currentSound?.id === 'rain' ? 400 :
                               state.currentSound?.id === 'waves' ? 600 :
                               state.currentSound?.id === 'wind' ? 800 : 500;

      const gainNode = audioContext.createGain();
      gainNode.gain.value = state.volume * 0.3;

      whiteNoise.connect(filter);
      filter.connect(gainNode);
      gainNode.connect(audioContext.destination);

      whiteNoise.start();
      oscillators.push({ source: whiteNoise, gain: gainNode });
    }

    // Stop ambient sound
    function stopAmbientSound() {
      oscillators.forEach(({ source, gain }) => {
        gain.gain.linearRampToValueAtTime(0, audioContext.currentTime + 0.5);
        setTimeout(() => source.stop(), 500);
      });
      oscillators = [];
    }

    // Toggle music
    function toggleMusic() {
      const toggle = document.getElementById('music-toggle');
      toggle.classList.toggle('playing');

      if (toggle.classList.contains('playing')) {
        // Link to current emotion if available
        if (state.selectedCategory) {
          const soundMap = {
            'happy': 'waves',
            'sad': 'rain',
            'anxious': 'rain',
            'angry': 'wind',
            'peaceful': 'forest',
            'confused': 'night'
          };
          selectSound(soundMap[state.selectedCategory.id] || 'rain');
        } else {
          selectSound('rain');
        }
        togglePlay();
      } else {
        if (state.isPlaying) togglePlay();
      }
    }

    // Volume control
    document.getElementById('volume-slider').addEventListener('input', (e) => {
      state.volume = e.target.value / 100;
      if (oscillators.length > 0) {
        oscillators.forEach(({ gain }) => {
          gain.gain.value = state.volume * 0.3;
        });
      }
    });

    // Writing textarea input
    document.getElementById('writing-text').addEventListener('input', updateWordCount);

    // Start journey
    function startJourney() {
      navigateTo('emotion-view');
    }

    // Navigate to view
    function navigateTo(viewId) {
      // Handle special case for home view
      if (viewId === 'home-view') {
        document.getElementById('bottom-nav').classList.remove('visible');
        document.getElementById('music-toggle').classList.remove('visible');
      } else {
        document.getElementById('bottom-nav').classList.add('visible');
      }

      // Hide response card when leaving writing view
      if (state.currentView === 'writing-view' && viewId !== 'writing-view') {
        document.getElementById('response-card').classList.remove('visible');
      }

      // Update views
      document.querySelectorAll('.view').forEach(view => {
        view.classList.toggle('active', view.id === viewId);
      });

      // Update nav
      document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.toggle('active', item.dataset.view === viewId);
      });

      state.currentView = viewId;

      // Update diary if navigating to diary view
      if (viewId === 'diary-view') {
        renderDiaryEntries();
        updateDiaryStats();
      }
    }

    // Update diary stats
    function updateDiaryStats() {
      document.getElementById('total-entries').textContent = state.diaryEntries.length;

      // Calculate week summary
      const oneWeekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
      const weekEntries = state.diaryEntries.filter(e => e.createdAt > oneWeekAgo);

      if (weekEntries.length > 0) {
        const categories = weekEntries.map(e => e.category);
        const summary = categories.sort((a, b) =>
          categories.filter(v => v === a).length - categories.filter(v => v === b).length
        ).pop();
        document.getElementById('week-summary').textContent = summary;
      } else {
        document.getElementById('week-summary').textContent = '—';
      }
    }

    // Render diary entries
    function renderDiaryEntries() {
      const timeline = document.getElementById('diary-timeline');
      const empty = document.getElementById('diary-empty');

      if (state.diaryEntries.length === 0) {
        empty.style.display = 'block';
        return;
      }

      empty.style.display = 'none';

      const entriesHTML = state.diaryEntries.map(entry => `
        <div class="diary-item">
          <div class="diary-date">${entry.date}</div>
          <div class="diary-emotion">
            <span>${entry.emoji}</span>
            <span>${entry.subEmotions.join('、')}</span>
          </div>
          <div class="diary-content">${entry.content}</div>
        </div>
      `).join('');

      timeline.innerHTML = entriesHTML;
    }

    // Initialize app
    init();
  </script>
</body>
</html>
