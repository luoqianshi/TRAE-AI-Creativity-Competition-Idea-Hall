<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄任务流</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #e74c3c;
            --primary-light: #ff6b6b;
            --primary-dark: #c0392b;
            --rest: #27ae60;
            --rest-light: #2ecc71;
            --bg: #faf6f2;
            --card-bg: #ffffff;
            --text: #2d3436;
            --text-light: #636e72;
            --border: #e8e0d8;
            --priority-high: #e74c3c;
            --priority-medium: #f39c12;
            --priority-low: #3498db;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .app-container {
            display: flex;
            min-height: 100vh;
        }

        /* 左侧任务面板 */
        .task-panel {
            width: 420px;
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .panel-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
        }

        .app-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .stats-bar {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: linear-gradient(135deg, #fff5f5, #ffe8e8);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            color: var(--text-light);
        }

        .stat-item strong {
            display: block;
            font-size: 18px;
            color: var(--primary);
        }

        .stat-item.rest-stat {
            background: linear-gradient(135deg, #f0fff4, #e6ffed);
        }

        .stat-item.rest-stat strong {
            color: var(--rest);
        }

        .add-task-form {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .task-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            background: var(--bg);
        }

        .task-input:focus {
            border-color: var(--primary-light);
        }

        .priority-select {
            padding: 12px 12px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 13px;
            outline: none;
            background: var(--bg);
            cursor: pointer;
        }

        .add-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
        }

        .add-btn:active {
            transform: translateY(0);
        }

        .task-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .task-item {
            background: var(--bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 4px solid transparent;
            position: relative;
        }

        .task-item:hover {
            background: #f5efe8;
            transform: translateX(4px);
        }

        .task-item.active {
            background: #fff0f0;
            border-left-color: var(--primary);
            box-shadow: var(--shadow);
        }

        .task-item.completed {
            opacity: 0.6;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
        }

        .task-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .priority-badge {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .priority-badge.high { background: var(--priority-high); }
        .priority-badge.medium { background: var(--priority-medium); }
        .priority-badge.low { background: var(--priority-low); }

        .task-text {
            flex: 1;
            font-size: 15px;
            font-weight: 500;
            word-break: break-word;
        }

        .task-actions {
            display: flex;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .task-item:hover .task-actions {
            opacity: 1;
        }

        .action-btn {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;

        }

        .complete-btn {
            background: #d4edda;

        }

        .complete-btn:hover {
            background: #c3e6cb;
        }

        .delete-btn {
            background: #f8d7da;
            color: var(--primary);
        }

        .delete-btn:hover {
            background: #f5c6cb;
        }

        .task-meta {
            display: flex;
            gap: 12px;
            font-size: 12px;
            color: var(--text-light);
        }

        .task-pomodoros {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .pomo-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary-light);
        }

        .pomo-dot.empty {
            background: var(--border);
        }

        /* 右侧番茄钟面板 */
        .timer-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: linear-gradient(180deg, var(--bg) 0%, #fff5f5 100%);
        }

        .timer-panel.rest-mode {
            background: linear-gradient(180deg, var(--bg) 0%, #f0fff4 100%);
        }

        .mode-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 40px;
            background: var(--card-bg);
            padding: 6px;
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        .mode-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
            color: var(--text-light);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
        }

        .mode-btn.rest.active {
            background: linear-gradient(135deg, var(--rest), var(--rest-light));
        }

        .timer-circle {
            position: relative;
            width: 320px;
            height: 320px;

        .timer-circle svg {
            transform: rotate(-90deg);

        .timer-circle-bg {
            fill: none;
            stroke: var(--border);
            stroke-width: 8;
        }

        .timer-circle-progress {
            fill: none;
            stroke: var(--primary);
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s linear;
        }

        .timer-panel.rest-mode .timer-circle-progress {
            stroke: var(--rest);
        }

        .timer-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .time-text {
            font-size: 64px;
            font-weight: 700;
            color: var(--text);
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
        }

        .mode-text {
            font-size: 16px;
            color: var(--text-light);
            margin-top: 4px;
        }

        .current-task {
            font-size: 18px;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 32px;
            text-align: center;
            max-width: 400px;
            min-height: 28px;
        }

        .current-task .task-label {
            color: var(--text-light);
            font-size: 13px;
            display: block;
            margin-bottom: 4px;
        }

        .timer-controls {
            display: flex;
            gap: 16px;
        }

        .control-btn {
            padding: 16px 40px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .start-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            box-shadow: 0 4px 20px rgba(231, 76, 60, 0.3);
        }

        .timer-panel.rest-mode .start-btn {
            background: linear-gradient(135deg, var(--rest), var(--rest-light));
            box-shadow: 0 4px 20px rgba(39, 174, 96, 0.3);
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 24px rgba(231, 76, 60, 0.4);
        }

        .reset-btn {
            background: var(--card-bg);
            color: var(--text);
            box-shadow: var(--shadow);
        }

        .reset-btn:hover {
            background: var(--bg);
        }

        /* 设置面板 */
        .settings-section {
            margin-top: 40px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 400px;
        }

        .settings-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .settings-row:last-child {
            margin-bottom: 0;
        }

        .settings-label {
            font-size: 14px;
            color: var(--text);
        }

        .duration-input {
            width: 80px;
            padding: 8px 12px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            outline: none;
            background: var(--bg);
        }

        .duration-input:focus {
            border-color: var(--primary-light);
        }

        .settings-unit {
            font-size: 13px;
            color: var(--text-light);
            margin-left: 8px;
        }

        .save-settings-btn {
            width: 100%;
            margin-top: 12px;
            padding: 10px;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .save-settings-btn:hover {
            background: var(--border);
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state-text {
            font-size: 14px;
        }

        /* 响应式设计 */
        @media (max-width: 900px) {
            .app-container {
                flex-direction: column;
            }

            .task-panel {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border);
                max-height: 50vh;
            }

            .timer-panel {
                padding: 30px 20px;
            }

            .timer-circle {
                width: 260px;
                height: 260px;
                margin-bottom: 30px;
            }

            .time-text {
                font-size: 52px;
            }

            .panel-header {
                padding: 20px;
            }

            .add-task-form {
                padding: 16px 20px;
            }
        }

        @media (max-width: 480px) {
            .timer-circle {
                width: 220px;
                height: 220px;
            }

            .time-text {
                font-size: 44px;
            }

            .control-btn {
                padding: 14px 28px;
                font-size: 15px;
            }

            .stats-bar {
                gap: 8px;
            }

            .stat-item {
                padding: 8px 12px;
                font-size: 12px;
            }

            .stat-item strong {
                font-size: 16px;
            }
        }

        /* 完成动画 */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .timer-complete {
            animation: pulse 0.5s ease-in-out 3;
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #d4ccc4;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 左侧任务面板 -->
        <div class="task-panel">
            <div class="panel-header">
                <h1 class="app-title">
                    <span>🍅</span> 番茄任务流
                </h1>
                <div class="stats-bar">
                    <div class="stat-item">
                        <strong id="todayPomodoros">0</strong>
                        今日番茄
                    </div>
                    <div class="stat-item rest-stat">
                        <strong id="todayMinutes">0</strong>
                        专注分钟
                    </div>
                    <div class="stat-item">
                        <strong id="totalTasks">0</strong>
                        待办任务
                    </div>
                </div>
            </div>

            <form class="add-task-form" id="addTaskForm">
                <div class="input-group">
                    <input type="text" class="task-input" id="taskInput" placeholder="添加新任务..." maxlength="100">
                    <select class="priority-select" id="prioritySelect">
                        <option value="high">高优先</option>
                        <option value="medium" selected>中优先</option>
                        <option value="low">低优先</option>
                    </select>
                </div>
                <button type="submit" class="add-btn">+ 添加任务</button>
            </form>

            <div class="task-list" id="taskList">
                <div class="empty-state">
                    <div class="empty-state-icon">📝</div>
                    <div class="empty-state-text">添加一个任务开始专注吧！</div>
                </div>
            </div>
        </div>

        <!-- 右侧番茄钟面板 -->
        <div class="timer-panel" id="timerPanel">
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="focus">专注</button>
                <button class="mode-btn rest" data-mode="rest">休息</button>
            </div>

            <div class="timer-circle" id="timerCircle">
                <svg width="100%" height="100%" viewBox="0 0 320 320">
                    <circle class="timer-circle-bg" cx="160" cy="160" r="140"></circle>
                    <circle class="timer-circle-progress" id="timerProgress" cx="160" cy="160" r="140" 
                            stroke-dasharray="879.6" stroke-dashoffset="0"></circle>
                </svg>
                <div class="timer-display">
                    <div class="time-text" id="timeDisplay">25:00</div>
                    <div class="mode-text" id="modeText">专注时间</div>
                </div>
            </div>

            <div class="current-task" id="currentTask">
                <span class="task-label">当前任务</span>
                <span id="currentTaskText">选择一个任务开始专注</span>
            </div>

            <div class="timer-controls">
                <button class="control-btn start-btn" id="startBtn">开始</button>
                <button class="control-btn reset-btn" id="resetBtn">重置</button>
            </div>

            <div class="settings-section">
                <div class="settings-title">⚙️ 时长设置</div>
                <div class="settings-row">
                    <span class="settings-label">专注时长</span>
                    <div>
                        <input type="number" class="duration-input" id="focusDuration" value="25" min="1" max="120">
                        <span class="settings-unit">分钟</span>
                    </div>
                </div>
                <div class="settings-row">
                    <span class="settings-label">休息时长</span>
                    <div>
                        <input type="number" class="duration-input" id="restDuration" value="5" min="1" max="60">
                        <span class="settings-unit">分钟</span>
                    </div>
                </div>
                <button class="save-settings-btn" id="saveSettingsBtn">保存设置</button>
            </div>
        </div>
    </div>

    <script>
        // 应用状态
        const state = {
            tasks: [],
            currentTaskId: null,
            mode: 'focus', // 'focus' or 'rest'
            isRunning: false,
            timeLeft: 25 * 60,
            totalTime: 25 * 60,
            timerInterval: null,
            settings: {
                focusDuration: 25,
                restDuration: 5
            },
            stats: {
                date: '',
                pomodoros: 0,
                focusMinutes: 0
            }
        };

        // DOM 元素
        const elements = {
            taskList: document.getElementById('taskList'),
            addTaskForm: document.getElementById('addTaskForm'),
            taskInput: document.getElementById('taskInput'),
            prioritySelect: document.getElementById('prioritySelect'),
            timeDisplay: document.getElementById('timeDisplay'),
            modeText: document.getElementById('modeText'),
            timerProgress: document.getElementById('timerProgress'),
            timerPanel: document.getElementById('timerPanel'),
            timerCircle: document.getElementById('timerCircle'),
            startBtn: document.getElementById('startBtn'),
            resetBtn: document.getElementById('resetBtn'),
            currentTaskText: document.getElementById('currentTaskText'),
            modeBtns: document.querySelectorAll('.mode-btn'),
            focusDuration: document.getElementById('focusDuration'),
            restDuration: document.getElementById('restDuration'),
            saveSettingsBtn: document.getElementById('saveSettingsBtn'),
            todayPomodoros: document.getElementById('todayPomodoros'),
            todayMinutes: document.getElementById('todayMinutes'),
            totalTasks: document.getElementById('totalTasks')
        };

        // 初始化
        function init() {
            loadFromStorage();
            checkNewDay();
            renderTasks();
            updateStats();
            updateTimerDisplay();
            bindEvents();
        }

        // 本地存储
        function saveToStorage() {
            localStorage.setItem('pomodoro_tasks', JSON.stringify(state.tasks));
            localStorage.setItem('pomodoro_settings', JSON.stringify(state.settings));
            localStorage.setItem('pomodoro_stats', JSON.stringify(state.stats));
        }

        function loadFromStorage() {
            const tasks = localStorage.getItem('pomodoro_tasks');
            const settings = localStorage.getItem('pomodoro_settings');
            const stats = localStorage.getItem('pomodoro_stats');

            if (tasks) state.tasks = JSON.parse(tasks);
            if (settings) state.settings = JSON.parse(settings);
            if (stats) state.stats = JSON.parse(stats);

            elements.focusDuration.value = state.settings.focusDuration;
            elements.restDuration.value = state.settings.restDuration;
            
            resetTimer();
        }

        // 检查是否新的一天
        function checkNewDay() {
            const today = new Date().toDateString();
            if (state.stats.date !== today) {
                state.stats = {
                    date: today,
                    pomodoros: 0,
                    focusMinutes: 0
                };
                saveToStorage();
            }
        }

        // 绑定事件
        function bindEvents() {
            elements.addTaskForm.addEventListener('submit', addTask);
            elements.startBtn.addEventListener('click', toggleTimer);
            elements.resetBtn.addEventListener('click', resetTimer);

            elements.modeBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    switchMode(btn.dataset.mode);
                });
            });

            elements.saveSettingsBtn.addEventListener('click', saveSettings);
        }

        // 添加任务
        function addTask(e) {
            e.preventDefault();
            const text = elements.taskInput.value.trim();
            if (!text) return;

            const task = {
                id: Date.now().toString(),
                text: text,
                priority: elements.prioritySelect.value,
                completed: false,
                pomodoros: 0,
                createdAt: new Date().toISOString()
            };

            state.tasks.unshift(task);
            elements.taskInput.value = '';
            saveToStorage();
            renderTasks();
            updateStats();
        }

        // 删除任务
        function deleteTask(id) {
            state.tasks = state.tasks.filter(t => t.id !== id);
            if (state.currentTaskId === id) {
                state.currentTaskId = null;
                elements.currentTaskText.textContent = '选择一个任务开始专注';
            }
            saveToStorage();
            renderTasks();
            updateStats();
        }

        // 切换任务完成状态
        function toggleTaskComplete(id) {
            const task = state.tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveToStorage();
                renderTasks();
            }
        }

        // 选择任务
        function selectTask(id) {
            state.currentTaskId = id;
            const task = state.tasks.find(t => t.id === id);
            elements.currentTaskText.textContent = task ? task.text : '选择一个任务开始专注';
            renderTasks();
        }

        // 渲染任务列表
        function renderTasks() {
            const incompleteTasks = state.tasks.filter(t => !t.completed);
            const completedTasks = state.tasks.filter(t => t.completed);
            const sortedTasks = [...incompleteTasks, ...completedTasks];

            if (sortedTasks.length === 0) {
                elements.taskList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <div class="empty-state-text">添加一个任务开始专注吧！</div>
                    </div>
                `;
                return;
            }

            elements.taskList.innerHTML = sortedTasks.map(task => `
                <div class="task-item ${task.id === state.currentTaskId ? 'active' : ''} ${task.completed ? 'completed' : ''}" 
                     data-id="${task.id}">
                    <div class="task-header">
                        <span class="priority-badge ${task.priority}"></span>
                        <span class="task-text">${escapeHtml(task.text)}</span>
                        <div class="task-actions">
                            <button class="action-btn complete-btn" onclick="toggleTaskComplete('${task.id}')" title="${task.completed ? '取消完成' : '标记完成'}">
                                ${task.completed ? '↩' : '✓'}
                            </button>
                            <button class="action-btn delete-btn" onclick="deleteTask('${task.id}')" title="删除">✕</button>
                        </div>
                    </div>
                    <div class="task-meta">
                        <span class="task-pomodoros">
                            ${Array(Math.min(task.pomodoros, 8)).fill('<span class="pomo-dot"></span>').join('')}
                            ${Array(Math.max(0, 4 - Math.min(task.pomodoros, 4))).fill('<span class="pomo-dot empty"></span>').join('')}
                            ${task.pomodoros > 0 ? `<span style="margin-left:4px">×${task.pomodoros}</span>` : ''}
                        </span>
                        <span>${getPriorityText(task.priority)}</span>
                    </div>
                </div>
            `).join('');

            // 绑定点击事件
            document.querySelectorAll('.task-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (e.target.closest('.action-btn')) return;
                    selectTask(item.dataset.id);
                });
            });
        }

        // 获取优先级文本
        function getPriorityText(priority) {
            const map = { high: '高优先级', medium: '中优先级', low: '低优先级' };
            return map[priority] || '中优先级';
        }

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 切换模式
        function switchMode(mode) {
            if (state.isRunning) {
                if (!confirm('计时器正在运行，确定要切换模式吗？')) return;
                pauseTimer();
            }
            state.mode = mode;
            elements.modeBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
            elements.timerPanel.classList.toggle('rest-mode', mode === 'rest');
            elements.modeText.textContent = mode === 'focus' ? '专注时间' : '休息时间';
            resetTimer();
        }

        // 切换计时器
        function toggleTimer() {
            if (state.isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        // 开始计时
        function startTimer() {
            state.isRunning = true;
            elements.startBtn.textContent = '暂停';
            
            state.timerInterval = setInterval(() => {
                state.timeLeft--;
                updateTimerDisplay();
                updateProgress();

                if (state.timeLeft <= 0) {
                    completeTimer();
                }
            }, 1000);
        }

        // 暂停计时
        function pauseTimer() {
            state.isRunning = false;
            elements.startBtn.textContent = '开始';
            clearInterval(state.timerInterval);
        }

        // 重置计时器
        function resetTimer() {
            pauseTimer();
            const duration = state.mode === 'focus' ? state.settings.focusDuration : state.settings.restDuration;
            state.totalTime = duration * 60;
            state.timeLeft = state.totalTime;
            updateTimerDisplay();
            updateProgress();
        }

        // 完成计时
        function completeTimer() {
            pauseTimer();
            elements.timerCircle.classList.add('timer-complete');
            setTimeout(() => elements.timerCircle.classList.remove('timer-complete'), 1500);

            if (state.mode === 'focus') {
                state.stats.pomodoros++;
                state.stats.focusMinutes += state.settings.focusDuration;

                if (state.currentTaskId) {
                    const task = state.tasks.find(t => t.id === state.currentTaskId);
                    if (task) {
                        task.pomodoros++;
                    }
                }

                saveToStorage();
                updateStats();
                renderTasks();

                // 播放提示音
                playNotification();
                alert('🎉 专注完成！该休息一下了~');
                switchMode('rest');
            } else {
                playNotification();
                alert('☕ 休息结束！准备开始下一个番茄吧~');
                switchMode('focus');
            }
        }

        // 更新计时器显示
        function updateTimerDisplay() {
            const minutes = Math.floor(state.timeLeft / 60);
            const seconds = state.timeLeft % 60;
            elements.timeDisplay.textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            document.title = `${elements.timeDisplay.textContent} - ${state.mode === 'focus' ? '专注' : '休息'} | 番茄任务流`;
        }

        // 更新进度环
        function updateProgress() {
            const circumference = 2 * Math.PI * 140;
            const progress = state.timeLeft / state.totalTime;
            const offset = circumference * (1 - progress);
            elements.timerProgress.style.strokeDashoffset = offset;
        }

        // 更新统计
        function updateStats() {
            elements.todayPomodoros.textContent = state.stats.pomodoros;
            elements.todayMinutes.textContent = state.stats.focusMinutes;
            elements.totalTasks.textContent = state.tasks.filter(t => !t.completed).length;
        }

        // 保存设置
        function saveSettings() {
            const focus = parseInt(elements.focusDuration.value) || 25;
            const rest = parseInt(elements.restDuration.value) || 5;

            state.settings.focusDuration = Math.max(1, Math.min(120, focus));
            state.settings.restDuration = Math.max(1, Math.min(60, rest));

            elements.focusDuration.value = state.settings.focusDuration;
            elements.restDuration.value = state.settings.restDuration;

            saveToStorage();
            resetTimer();
            alert('设置已保存！');
        }

        // 播放提示音（使用 Web Audio API）
        function playNotification() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);

                // 第二个音
                setTimeout(() => {
                    const osc2 = audioContext.createOscillator();
                    const gain2 = audioContext.createGain();
                    osc2.connect(gain2);
                    gain2.connect(audioContext.destination);
                    osc2.frequency.value = 1000;
                    osc2.type = 'sine';
                    gain2.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gain2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                    osc2.start(audioContext.currentTime);
                    osc2.stop(audioContext.currentTime + 0.5);
                }, 200);
            } catch (e) {
                // 音频播放失败时静默处理
            }
        }

        // 全局函数（供onclick使用）
        window.deleteTask = deleteTask;
        window.toggleTaskComplete = toggleTaskComplete;

        // 启动应用
        init();
    </script>
</body>
</html>
