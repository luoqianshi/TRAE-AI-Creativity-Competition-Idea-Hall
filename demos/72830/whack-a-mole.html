<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打地鼠游戏</title>
    <style>
        /* ===== 全局样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            user-select: none;
        }

        /* ===== 游戏容器 ===== */
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        /* ===== 信息面板 ===== */
        .info-panel {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            padding: 15px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 12px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .info-label {
            font-size: 0.9em;
            color: #666;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-value {
            font-size: 2em;
            font-weight: bold;
            color: #764ba2;
            margin-top: 5px;
        }

        .info-value.time-warning {
            color: #e74c3c;
            animation: pulse 0.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* ===== 游戏网格 ===== */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
            padding: 20px;
            background: linear-gradient(135deg, #a8e063 0%, #56ab2f 100%);
            border-radius: 15px;
        }

        /* ===== 地洞样式 ===== */
        .hole {
            aspect-ratio: 1;
            background: radial-gradient(ellipse at center, #3d2914 0%, #2a1d0e 70%, #1a1209 100%);
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            box-shadow: inset 0 10px 20px rgba(0, 0, 0, 0.5);
            border: 4px solid #5d4037;
        }

        .hole::after {
            content: '';
            position: absolute;
            bottom: -10%;
            left: -5%;
            right: -5%;
            height: 30%;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.6) 0%, transparent 70%);
            border-radius: 50%;
        }

        /* ===== 地鼠样式 ===== */
        .mole {
            position: absolute;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3.5em;
            transition: bottom 0.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
        }

        .hole.active .mole {
            bottom: 15%;
        }

        .mole.hit {
            animation: hit 0.3s ease-out;
        }

        @keyframes hit {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.3); filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)) brightness(1.5); }
            100% { transform: translateX(-50%) scale(0); opacity: 0; }
        }

        /* ===== 得分飘字动画 ===== */
        .score-popup {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5em;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
            z-index: 20;
            animation: popup 0.6s ease-out forwards;
        }

        @keyframes popup {
            0% { 
                opacity: 1; 
                transform: translateX(-50%) translateY(0) scale(0.5);
            }
            50% {
                transform: translateX(-50%) translateY(-30px) scale(1.2);
            }
            100% { 
                opacity: 0; 
                transform: translateX(-50%) translateY(-60px) scale(1);
            }
        }

        /* ===== 按钮样式 ===== */
        .btn {
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-start {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-start:active {
            transform: translateY(0);
        }

        .btn-start:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== 游戏结束面板 ===== */
        .game-over {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .game-over.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .game-over-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            animation: bounceIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        .game-over h2 {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 10px;
        }

        .final-score {
            font-size: 4em;
            font-weight: bold;
            color: #764ba2;
            margin: 20px 0;
        }

        .score-message {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 30px;
        }

        /* ===== 响应式设计 ===== */
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8em;
            }

            .game-container {
                padding: 20px;
            }

            .mole {
                font-size: 2.5em;
            }

            .info-value {
                font-size: 1.5em;
            }

            .game-grid {
                gap: 10px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🔨 打地鼠 🐹</h1>
        
        <!-- 信息面板 -->
        <div class="info-panel">
            <div class="info-item">
                <span class="info-label">得分</span>
                <span class="info-value" id="score">0</span>
            </div>
            <div class="info-item">
                <span class="info-label">时间</span>
                <span class="info-value" id="time">30</span>
            </div>
        </div>

        <!-- 游戏网格 -->
        <div class="game-grid" id="gameGrid">
            <!-- 9个地洞由JS生成 -->
        </div>

        <!-- 开始按钮 -->
        <button class="btn btn-start" id="startBtn">开始游戏</button>
    </div>

    <!-- 游戏结束面板 -->
    <div class="game-over" id="gameOver">
        <div class="game-over-content">
            <h2>游戏结束！</h2>
            <div class="final-score" id="finalScore">0</div>
            <p class="score-message" id="scoreMessage"></p>
            <button class="btn btn-start" id="restartBtn">再来一局</button>
        </div>
    </div>

    <script>
        // ===== 游戏配置 =====
        const CONFIG = {
            GAME_DURATION: 30,        // 游戏时长（秒）
            MOLE_MIN_TIME: 800,       // 地鼠最短停留时间（毫秒）
            MOLE_MAX_TIME: 1200,      // 地鼠最长停留时间（毫秒）
            MOLE_INTERVAL_MIN: 400,   // 地鼠出现最小间隔（毫秒）
            MOLE_INTERVAL_MAX: 800,   // 地鼠出现最大间隔（毫秒）
            HOLE_COUNT: 9             // 地洞数量
        };

        // ===== 游戏状态 =====
        let gameState = {
            score: 0,
            timeLeft: CONFIG.GAME_DURATION,
            isPlaying: false,
            currentMole: null,        // 当前有地鼠的洞
            moleTimer: null,          // 地鼠自动缩回的定时器
            spawnTimer: null,         // 地鼠出现的定时器
            countdownTimer: null      // 倒计时定时器
        };

        // ===== DOM 元素 =====
        const elements = {
            gameGrid: document.getElementById('gameGrid'),
            score: document.getElementById('score'),
            time: document.getElementById('time'),
            startBtn: document.getElementById('startBtn'),
            gameOver: document.getElementById('gameOver'),
            finalScore: document.getElementById('finalScore'),
            scoreMessage: document.getElementById('scoreMessage'),
            restartBtn: document.getElementById('restartBtn')
        };

        // ===== 初始化游戏网格 =====
        function initGrid() {
            elements.gameGrid.innerHTML = '';
            for (let i = 0; i < CONFIG.HOLE_COUNT; i++) {
                const hole = document.createElement('div');
                hole.className = 'hole';
                hole.dataset.index = i;
                
                const mole = document.createElement('div');
                mole.className = 'mole';
                mole.textContent = '🐹';
                
                hole.appendChild(mole);
                hole.addEventListener('click', () => handleHoleClick(hole));
                elements.gameGrid.appendChild(hole);
            }
        }

        // ===== 获取随机数 =====
        function getRandom(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // ===== 获取随机地洞（排除当前有地鼠的洞）=====
        function getRandomHole() {
            const holes = document.querySelectorAll('.hole');
            const availableHoles = Array.from(holes).filter(hole => !hole.classList.contains('active'));
            if (availableHoles.length === 0) return null;
            return availableHoles[getRandom(0, availableHoles.length - 1)];
        }

        // ===== 地鼠出现 =====
        function spawnMole() {
            if (!gameState.isPlaying) return;

            // 如果还有地鼠在外面，先让它缩回
            if (gameState.currentMole) {
                gameState.currentMole.classList.remove('active');
            }

            // 随机选择一个洞
            const hole = getRandomHole();
            if (!hole) return;

            gameState.currentMole = hole;
            hole.classList.add('active');

            // 设置地鼠缩回时间
            const moleStayTime = getRandom(CONFIG.MOLE_MIN_TIME, CONFIG.MOLE_MAX_TIME);
            gameState.moleTimer = setTimeout(() => {
                hole.classList.remove('active');
                gameState.currentMole = null;
            }, moleStayTime);

            // 设置下一只地鼠出现时间
            const nextSpawnTime = getRandom(CONFIG.MOLE_INTERVAL_MIN, CONFIG.MOLE_INTERVAL_MAX);
            gameState.spawnTimer = setTimeout(spawnMole, nextSpawnTime);
        }

        // ===== 处理地洞点击 =====
        function handleHoleClick(hole) {
            if (!gameState.isPlaying) return;

            // 点中有地鼠的洞
            if (hole.classList.contains('active')) {
                // 加分
                gameState.score++;
                updateScore();

                // 显示得分飘字
                showScorePopup(hole, '+1');

                // 击中动画
                const mole = hole.querySelector('.mole');
                mole.classList.add('hit');
                setTimeout(() => {
                    mole.classList.remove('hit');
                }, 300);

                // 立即缩回地鼠
                hole.classList.remove('active');
                gameState.currentMole = null;

                // 清除定时器
                if (gameState.moleTimer) {
                    clearTimeout(gameState.moleTimer);
                }
            }
        }

        // ===== 显示得分飘字 =====
        function showScorePopup(hole, text) {
            const popup = document.createElement('div');
            popup.className = 'score-popup';
            popup.textContent = text;
            hole.appendChild(popup);

            setTimeout(() => {
                popup.remove();
            }, 600);
        }

        // ===== 更新分数显示 =====
        function updateScore() {
            elements.score.textContent = gameState.score;
        }

        // ===== 更新时间显示 =====
        function updateTime() {
            elements.time.textContent = gameState.timeLeft;
            
            // 最后5秒警告
            if (gameState.timeLeft <= 5) {
                elements.time.classList.add('time-warning');
            } else {
                elements.time.classList.remove('time-warning');
            }
        }

        // ===== 开始倒计时 =====
        function startCountdown() {
            gameState.countdownTimer = setInterval(() => {
                gameState.timeLeft--;
                updateTime();

                if (gameState.timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        // ===== 开始游戏 =====
        function startGame() {
            // 重置状态
            gameState.score = 0;
            gameState.timeLeft = CONFIG.GAME_DURATION;
            gameState.isPlaying = true;
            gameState.currentMole = null;

            // 更新UI
            updateScore();
            updateTime();
            elements.startBtn.disabled = true;
            elements.startBtn.textContent = '游戏中...';
            elements.gameOver.classList.remove('show');
            elements.time.classList.remove('time-warning');

            // 清除所有洞的状态
            document.querySelectorAll('.hole').forEach(hole => {
                hole.classList.remove('active');
            });

            // 开始游戏
            startCountdown();
            
            // 延迟一点时间后开始出现地鼠
            setTimeout(spawnMole, 500);
        }

        // ===== 结束游戏 =====
        function endGame() {
            gameState.isPlaying = false;

            // 清除所有定时器
            clearInterval(gameState.countdownTimer);
            clearTimeout(gameState.moleTimer);
            clearTimeout(gameState.spawnTimer);

            // 让所有地鼠缩回
            document.querySelectorAll('.hole').forEach(hole => {
                hole.classList.remove('active');
            });

            // 更新结束面板
            elements.finalScore.textContent = gameState.score;
            elements.scoreMessage.textContent = getScoreMessage(gameState.score);

            // 显示结束面板
            setTimeout(() => {
                elements.gameOver.classList.add('show');
            }, 300);

            // 重置开始按钮
            elements.startBtn.disabled = false;
            elements.startBtn.textContent = '开始游戏';
        }

        // ===== 根据得分给出评价 =====
        function getScoreMessage(score) {
            if (score >= 25) return '🏆 太厉害了！地鼠克星！';
            if (score >= 20) return '🌟 高手！反应超快！';
            if (score >= 15) return '👍 不错哦！继续加油！';
            if (score >= 10) return '😊 还可以，多练习会更好！';
            if (score >= 5) return '💪 加油，你可以的！';
            return '🐹 地鼠们都嘲笑你了，再来一局吧！';
        }

        // ===== 事件监听 =====
        elements.startBtn.addEventListener('click', startGame);
        elements.restartBtn.addEventListener('click', () => {
            elements.gameOver.classList.remove('show');
            startGame();
        });

        // ===== 初始化 =====
        initGrid();
    </script>
</body>
</html>
