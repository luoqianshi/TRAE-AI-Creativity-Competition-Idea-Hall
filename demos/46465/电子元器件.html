<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>料号参数提取器</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f0f4f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 840px;
            width: 100%;
            background: #ffffff;
            border-radius: 40px;
            padding: 40px 36px;
            box-shadow: 0 20px 60px -12px rgba(0, 20, 40, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            margin-bottom: 28px;
            gap: 12px;
        }

        .header-left .badge {
            display: inline-block;
            background: #1a2634;
            color: #b0c7db;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.8px;
            padding: 4px 18px;
            border-radius: 40px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .header-left h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #0b1a2a;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .header-left h1 i {
            background: linear-gradient(145deg, #2463eb, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-style: normal;
        }

        .header-left p {
            color: #5b6f82;
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .header-right {
            background: #eef3f8;
            padding: 6px 16px 6px 12px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.78rem;
            color: #2c3e50;
            white-space: nowrap;
            border: 1px solid #dce4ec;
        }

        .header-right .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0% { opacity: 0.6; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.6; transform: scale(0.9); }
        }

        /* ===== 输入区 ===== */
        .input-section {
            background: #f7fafc;
            border-radius: 28px;
            padding: 24px 24px 20px;
            margin-bottom: 28px;
            border: 1px solid #e7edf4;
        }

        .input-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1e2a3a;
            margin-bottom: 12px;
        }

        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .input-row input {
            flex: 1;
            min-width: 200px;
            padding: 14px 22px;
            border: 2px solid #dce4ec;
            border-radius: 60px;
            font-size: 1rem;
            font-family: "SF Mono", "Menlo", monospace;
            background: #ffffff;
            transition: all 0.25s;
            outline: none;
            color: #0b1a2a;
        }

        .input-row input:focus {
            border-color: #2463eb;
            box-shadow: 0 0 0 4px rgba(36, 99, 235, 0.12);
        }

        .input-row input::placeholder {
            color: #9aafc0;
            font-family: inherit;
        }

        .input-row button {
            padding: 14px 34px;
            background: linear-gradient(135deg, #2463eb, #7c3aed);
            color: white;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 4px 16px rgba(36, 99, 235, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .input-row button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(36, 99, 235, 0.4);
        }

        .input-row button:active:not(:disabled) {
            transform: translateY(0);
        }

        .input-row button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .examples {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px dashed #dce4ec;
        }

        .examples .hint {
            font-size: 0.8rem;
            color: #7a8fa3;
            font-weight: 500;
        }

        .example-chip {
            background: #ffffff;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.78rem;
            font-family: "SF Mono", "Menlo", monospace;
            color: #1e2a3a;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #dce4ec;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
        }

        .example-chip:hover {
            background: #2463eb;
            color: #fff;
            border-color: #2463eb;
            transform: scale(1.03);
        }

        /* ===== 结果区 ===== */
        .result-section {
            min-height: 100px;
            border-radius: 28px;
            background: #ffffff;
            padding: 24px;
            border: 1px solid #e7edf4;
            transition: all 0.3s;
        }

        .result-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #9aafc0;
            text-align: center;
            padding: 20px 0;
        }

        .result-placeholder .big-icon {
            font-size: 3rem;
            opacity: 0.6;
            margin-bottom: 6px;
        }

        .loading-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 0;
            gap: 16px;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #e7edf4;
            border-top-color: #2463eb;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== 参数卡片 ===== */
        .params-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
            animation: fadeUp 0.45s ease forwards;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(18px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .param-card {
            background: #f7fafc;
            border-radius: 18px;
            padding: 14px 12px;
            text-align: center;
            border: 1px solid #eef3f8;
            transition: 0.15s;
        }

        .param-card:hover {
            background: #f0f4f9;
            border-color: #cbdae6;
        }

        .param-card .label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #7a8fa3;
            font-weight: 600;
        }

        .param-card .value {
            font-size: 1.05rem;
            font-weight: 700;
            color: #0b1a2a;
            margin-top: 4px;
            word-break: break-all;
        }

        .param-card .value.brand {
            color: #2463eb;
        }

        /* 料号展示条 */
        .mpn-display {
            grid-column: 1 / -1;
            background: #1a2634;
            color: #e4edf5;
            border-radius: 18px;
            padding: 12px 20px;
            text-align: center;
            font-family: "SF Mono", "Menlo", monospace;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            border: none;
        }

        .mpn-display .mpn-text {
            flex: 1;
            text-align: left;
        }

        .mpn-display .copy-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cbdae6;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }

        .mpn-display .copy-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
        }

        .mpn-display .match-tag {
            background: #2d3b4a;
            padding: 2px 14px;
            border-radius: 40px;
            font-size: 0.65rem;
            font-family: -apple-system, sans-serif;
            color: #9ab0c5;
            letter-spacing: 0.3px;
        }

        .error-msg {
            color: #dc2626;
            font-weight: 500;
        }

        /* ===== 底部 ===== */
        .footer {
            margin-top: 28px;
            text-align: center;
            color: #9aafc0;
            font-size: 0.75rem;
            border-top: 1px solid #e7edf4;
            padding-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .footer a {
            color: #2463eb;
            text-decoration: none;
            font-weight: 500;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            .container {
                padding: 24px 16px;
            }
            .header-left h1 {
                font-size: 1.6rem;
            }
            .header-right {
                font-size: 0.7rem;
                padding: 4px 12px;
            }
            .input-row input {
                min-width: 100%;
            }
            .input-row button {
                width: 100%;
                justify-content: center;
            }
            .params-grid {
                grid-template-columns: 1fr 1fr;
            }
            .mpn-display {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .mpn-display .mpn-text {
                text-align: center;
            }
        }

        @media (max-width: 400px) {
            .params-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div class="header-left">
                <h1>📦 料号 <i>参数提取器</i></h1>
                <p>输入 MPN，智能解析电容 / 电阻 / 电感等元器件关键参数</p>
            </div>
            <div class="header-right">
                <span class="dot"></span> 离线可用 · 即开即用
            </div>
        </div>

        <!-- 输入区 -->
        <div class="input-section">
            <div class="input-label">
                <span>🔍</span> 输入元器件料号 (MPN)
            </div>
            <div class="input-row">
                <input type="text" id="partInput" placeholder="例如: GRM188R71E104KA01D" autocomplete="off" />
                <button id="extractBtn">🚀 提取参数</button>
            </div>
            <div class="examples">
                <span class="hint">💡 快速体验：</span>
                <span class="example-chip" data-part="GRM188R71E104KA01D">GRM188R71E104KA01D</span>
                <span class="example-chip" data-part="CL05B104KO5NNNC">CL05B104KO5NNNC</span>
                <span class="example-chip" data-part="0603B104K500NT">0603B104K500NT</span>
                <span class="example-chip" data-part="RC0603FR-0710KL">RC0603FR-0710KL</span>
            </div>
        </div>

        <!-- 结果区 -->
        <div class="result-section" id="resultSection">
            <!-- 由 JS 动态渲染 -->
        </div>

        <!-- 页脚 -->
        <div class="footer">
            <span>⚡ 基于料号编码规则智能匹配</span>
        </div>
    </div>

    <script>
        (function() {
            // ============================================================
            //  核心解析引擎（精确库 + 启发式推测）
            // ============================================================
            function parsePartNumber(mpn) {
                const raw = mpn.trim().toUpperCase();
                if (!raw) return { success: false, error: '请输入料号' };

                // ---------- 精确库 ----------
                const library = {
                    'GRM188R71E104KA01D': {
                        manufacturer: 'Murata',
                        series: 'GRM',
                        type: '陶瓷电容',
                        capacitance: '100nF',
                        voltage: '25V',
                        tolerance: '±10%',
                        package: '0603 (1608)',
                        temperature: 'X7R',
                        matchType: '🔷 精确库匹配'
                    },
                    'CL05B104KO5NNNC': {
                        manufacturer: 'Samsung',
                        series: 'CL',
                        type: '陶瓷电容',
                        capacitance: '100nF',
                        voltage: '16V',
                        tolerance: '±10%',
                        package: '0402 (1005)',
                        temperature: 'X7R',
                        matchType: '🔷 精确库匹配'
                    },
                    '0603B104K500NT': {
                        manufacturer: 'Fenghua',
                        series: '0603',
                        type: '陶瓷电容',
                        capacitance: '100nF',
                        voltage: '50V',
                        tolerance: '±10%',
                        package: '0603 (1608)',
                        temperature: 'X7R',
                        matchType: '🔷 精确库匹配'
                    },
                    'RC0603FR-0710KL': {
                        manufacturer: 'Yageo',
                        series: 'RC',
                        type: '厚膜电阻',
                        resistance: '10kΩ',
                        power: '1/10W',
                        tolerance: '±1%',
                        package: '0603 (1608)',
                        temperature: '±100ppm/°C',
                        matchType: '🔷 精确库匹配'
                    }
                };

                // 1) 精确匹配
                if (library[raw]) {
                    return { success: true, data: library[raw], mpn: raw };
                }

                // 2) 启发式推测（演示用）
                let capacitance = '未知';
                const capMatch = raw.match(/(\d{2,4})[A-Z]/);
                if (capMatch) {
                    const code = parseInt(capMatch[1], 10);
                    if (code >= 100 && code <= 999) {
                        const pF = parseInt(String(code).slice(0, -1), 10) * Math.pow(10, parseInt(String(code).slice(-1),
                        10));
                        capacitance = pF >= 1000 ? (pF / 1000) + 'nF' : pF + 'pF';
                    }
                }

                let voltage = '未知';
                const voltageMap = { '1E': '25V', '1C': '16V', '1H': '50V', '1A': '10V' };
                for (const [key, val] of Object.entries(voltageMap)) {
                    if (raw.includes(key)) { voltage = val; break; }
                }

                let packageSize = '未知';
                const pkgMatch = raw.match(/(\d{4})/);
                if (pkgMatch) {
                    const pkg = pkgMatch[1];
                    if (['0603', '0402', '0805', '1206'].includes(pkg)) {
                        packageSize = pkg + ' (公制)';
                    }
                }

                return {
                    success: true,
                    data: {
                        manufacturer: '未知',
                        series: '—',
                        type: '元器件',
                        capacitance: capacitance,
                        voltage: voltage,
                        tolerance: '±10% (估算)',
                        package: packageSize,
                        temperature: '—',
                        matchType: '🟡 启发式推测'
                    },
                    mpn: raw,
                    isFallback: true
                };
            }

            // ---------- DOM ----------
            const inputEl = document.getElementById('partInput');
            const btn = document.getElementById('extractBtn');
            const resultSection = document.getElementById('resultSection');

            // ---------- 渲染 ----------
            function renderResult(result) {
                if (!result || !result.success) {
                    resultSection.innerHTML = `
                        <div class="result-placeholder">
                            <div class="big-icon">❌</div>
                            <p class="error-msg">${result?.error || '解析失败，请重试'}</p>
                        </div>
                    `;
                    return;
                }

                const { data, mpn, isFallback } = result;

                const paramItems = [
                    { label: '制造商', value: data.manufacturer || '—' },
                    { label: '系列', value: data.series || '—' },
                    { label: '类型', value: data.type || '—' },
                    { label: '容值 / 阻值', value: data.capacitance || data.resistance || '—' },
                    { label: '额定电压 / 功率', value: data.voltage || data.power || '—' },
                    { label: '精度', value: data.tolerance || '—' },
                    { label: '封装', value: data.package || '—' },
                    { label: '温度特性', value: data.temperature || '—' }
                ];

                let cardsHtml = paramItems.map(item => `
                    <div class="param-card">
                        <div class="label">${item.label}</div>
                        <div class="value ${item.label === '制造商' ? 'brand' : ''}">${item.value}</div>
                    </div>
                `).join('');

                const fallbackNote = isFallback ?
                    `<div style="grid-column:1/-1; text-align:center; font-size:0.75rem; color:#94a3b8; margin-top:4px;">
                        ⚡ 基于料号特征智能推测，部分参数仅供参考
                    </div>` :
                    '';

                resultSection.innerHTML = `
                    <div class="params-grid">
                        <div class="mpn-display">
                            <span class="mpn-text">📌 ${mpn}</span>
                            <span class="match-tag">${data.matchType || '匹配'}</span>
                            <button class="copy-btn" onclick="navigator.clipboard?.writeText('${mpn}') || alert('复制失败，请手动复制')">📋 复制</button>
                        </div>
                        ${cardsHtml}
                        ${fallbackNote}
                    </div>
                `;
            }

            function showLoading() {
                resultSection.innerHTML = `
                    <div class="loading-box">
                        <div class="spinner"></div>
                        <p>🔎 正在解析料号参数...</p>
                    </div>
                `;
            }

            function showPlaceholder() {
                resultSection.innerHTML = `
                    <div class="result-placeholder">
                        <div class="big-icon">🧩</div>
                        <p>输入料号后点击「提取参数」，<br />即可查看解析出的元器件参数</p>
                    </div>
                `;
            }

            // ---------- 主逻辑 ----------
            function handleExtract() {
                const raw = inputEl.value.trim();
                if (!raw) {
                    resultSection.innerHTML = `
                        <div class="result-placeholder">
                            <div class="big-icon">⚠️</div>
                            <p class="error-msg">请先输入元器件料号</p>
                        </div>
                    `;
                    return;
                }

                showLoading();
                btn.disabled = true;

                setTimeout(() => {
                    try {
                        const result = parsePartNumber(raw);
                        renderResult(result);
                    } catch (err) {
                        resultSection.innerHTML = `
                            <div class="result-placeholder">
                                <div class="big-icon">❌</div>
                                <p class="error-msg">解析出错：${err.message}</p>
                            </div>
                        `;
                    } finally {
                        btn.disabled = false;
                    }
                }, 500);
            }

            // ---------- 事件绑定 ----------
            btn.addEventListener('click', handleExtract);

            inputEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleExtract();
                }
            });

            document.querySelectorAll('.example-chip').forEach((chip) => {
                chip.addEventListener('click', function() {
                    inputEl.value = this.getAttribute('data-part');
                    handleExtract();
                });
            });

            // ---------- 初始 ----------
            showPlaceholder();
        })();
    </script>

</body>
</html>
