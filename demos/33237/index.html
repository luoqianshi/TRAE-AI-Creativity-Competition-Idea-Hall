<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>词道 · AI考公词语学习助手</title>
<style>
  :root {
    --primary: #2c5f7c;
    --primary-light: #3a7ca5;
    --primary-dark: #1e4055;
    --accent: #d4a853;
    --accent-light: #f0d48a;
    --bg: #f8f6f1;
    --bg-card: #ffffff;
    --text: #2d2d2d;
    --text-light: #6b7280;
    --text-lighter: #9ca3af;
    --border: #e5e2db;
    --success: #4ade80;
    --success-bg: #f0fdf4;
    --error: #f87171;
    --error-bg: #fef2f2;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.1);
    --radius: 12px;
    --transition: all 0.3s ease;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ===== HEADER ===== */
  .header {
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    color: white;
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  .header-inner {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
  }
  .logo-icon {
    width: 32px;
    height: 32px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }
  .header-stats {
    display: flex;
    gap: 20px;
    font-size: 13px;
    opacity: 0.9;
  }
  .header-stats span {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* ===== NAV ===== */
  .nav {
    max-width: 960px;
    margin: 20px auto 0;
    padding: 0 24px;
    display: flex;
    gap: 8px;
  }
  .nav-btn {
    padding: 10px 20px;
    border: 2px solid var(--border);
    background: var(--bg-card);
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-light);
    transition: var(--transition);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .nav-btn:hover {
    border-color: var(--primary-light);
    color: var(--primary);
  }
  .nav-btn.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }
  .nav-btn .badge {
    background: var(--error);
    color: white;
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 10px;
    font-weight: 600;
  }

  /* ===== MAIN ===== */
  .main {
    max-width: 960px;
    margin: 20px auto;
    padding: 0 24px 40px;
  }
  .page { display: none; }
  .page.active { display: block; animation: fadeIn 0.3s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== LEARN PAGE ===== */
  .learn-hero {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    border-radius: var(--radius);
    padding: 32px;
    color: white;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  .learn-hero::after {
    content: '词';
    position: absolute;
    right: 30px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 120px;
    opacity: 0.08;
    font-weight: 900;
  }
  .learn-hero h2 {
    font-size: 24px;
    margin-bottom: 8px;
  }
  .learn-hero p {
    opacity: 0.85;
    font-size: 14px;
  }
  .learn-progress {
    margin-top: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
  }
  .progress-bar {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,0.25);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.5s ease;
  }

  .word-card {
    background: var(--bg-card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px;
    margin-bottom: 16px;
    transition: var(--transition);
    cursor: pointer;
    border: 2px solid transparent;
  }
  .word-card:hover {
    box-shadow: var(--shadow-hover);
    border-color: var(--primary-light);
    transform: translateY(-2px);
  }
  .word-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }
  .word-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--primary-dark);
  }
  .word-pinyin {
    font-size: 13px;
    color: var(--text-light);
    margin-top: 2px;
  }
  .word-tag {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    background: #eef4ff;
    color: var(--primary);
    font-weight: 500;
  }
  .word-tag.hot {
    background: #fff7ed;
    color: #c2410c;
  }
  .word-def {
    font-size: 14px;
    color: var(--text);
    line-height: 1.8;
    margin-bottom: 12px;
  }
  .word-example {
    font-size: 13px;
    color: var(--text-light);
    padding: 12px 16px;
    background: var(--bg);
    border-radius: 8px;
    border-left: 3px solid var(--accent);
    margin-bottom: 12px;
  }
  .word-confuse {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .confuse-chip {
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 20px;
    background: #fef3c7;
    color: #92400e;
    cursor: pointer;
    transition: var(--transition);
  }
  .confuse-chip:hover {
    background: #fde68a;
  }

  .word-detail {
    display: none;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .word-card.expanded .word-detail { display: block; }

  .load-more {
    text-align: center;
    margin: 20px 0;
  }
  .load-more button {
    padding: 10px 32px;
    border: 2px solid var(--primary);
    background: transparent;
    color: var(--primary);
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: var(--transition);
  }
  .load-more button:hover {
    background: var(--primary);
    color: white;
  }

  /* ===== QUIZ PAGE ===== */
  .quiz-container {
    max-width: 640px;
    margin: 0 auto;
  }
  .quiz-header {
    text-align: center;
    margin-bottom: 32px;
  }
  .quiz-header h2 {
    font-size: 22px;
    color: var(--primary-dark);
    margin-bottom: 8px;
  }
  .quiz-meta {
    display: flex;
    justify-content: center;
    gap: 24px;
    font-size: 13px;
    color: var(--text-light);
  }
  .quiz-meta span {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .quiz-card {
    background: var(--bg-card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 32px;
    margin-bottom: 20px;
  }
  .quiz-question {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text);
  }
  .quiz-hint {
    font-size: 13px;
    color: var(--text-light);
    margin-bottom: 24px;
  }
  .quiz-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .quiz-option {
    padding: 14px 18px;
    border: 2px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    transition: var(--transition);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .quiz-option:hover:not(.disabled) {
    border-color: var(--primary-light);
    background: #f0f7ff;
  }
  .quiz-option .option-letter {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-light);
    flex-shrink: 0;
  }
  .quiz-option.correct {
    border-color: var(--success);
    background: var(--success-bg);
  }
  .quiz-option.correct .option-letter {
    background: var(--success);
    color: white;
  }
  .quiz-option.wrong {
    border-color: var(--error);
    background: var(--error-bg);
  }
  .quiz-option.wrong .option-letter {
    background: var(--error);
    color: white;
  }
  .quiz-option.disabled {
    cursor: default;
    opacity: 0.6;
  }
  .quiz-option.disabled.correct,
  .quiz-option.disabled.wrong {
    opacity: 1;
  }

  .quiz-explanation {
    margin-top: 20px;
    padding: 16px;
    background: #f0f7ff;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.8;
    display: none;
    border-left: 3px solid var(--primary);
  }
  .quiz-explanation.show { display: block; }

  .quiz-actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 20px;
  }
  .btn {
    padding: 12px 28px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: var(--transition);
  }
  .btn-primary {
    background: var(--primary);
    color: white;
  }
  .btn-primary:hover {
    background: var(--primary-light);
  }
  .btn-outline {
    background: transparent;
    border: 2px solid var(--border);
    color: var(--text-light);
  }
  .btn-outline:hover {
    border-color: var(--primary);
    color: var(--primary);
  }
  .btn-accent {
    background: var(--accent);
    color: white;
  }
  .btn-accent:hover {
    background: var(--accent-light);
    color: var(--text);
  }

  /* Quiz result */
  .quiz-result {
    text-align: center;
    padding: 40px 20px;
  }
  .quiz-result .score-circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    color: white;
  }
  .quiz-result .score-circle .score-num {
    font-size: 36px;
    font-weight: 800;
    line-height: 1;
  }
  .quiz-result .score-circle .score-label {
    font-size: 12px;
    opacity: 0.8;
  }
  .quiz-result h3 {
    font-size: 20px;
    margin-bottom: 8px;
  }
  .quiz-result p {
    color: var(--text-light);
    font-size: 14px;
    margin-bottom: 24px;
  }

  /* ===== MISTAKES PAGE ===== */
  .mistakes-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .mistakes-header h2 {
    font-size: 20px;
    color: var(--primary-dark);
  }
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-light);
  }
  .empty-state .empty-icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.3;
  }
  .empty-state p {
    font-size: 14px;
  }

  .mistake-item {
    background: var(--bg-card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 24px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: var(--transition);
    border-left: 4px solid var(--error);
  }
  .mistake-item:hover {
    box-shadow: var(--shadow-hover);
  }
  .mistake-word {
    font-size: 18px;
    font-weight: 600;
    color: var(--primary-dark);
  }
  .mistake-info {
    font-size: 13px;
    color: var(--text-light);
    margin-top: 4px;
  }
  .mistake-actions {
    display: flex;
    gap: 8px;
  }
  .mistake-actions button {
    padding: 6px 14px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text-light);
    transition: var(--transition);
  }
  .mistake-actions button:hover {
    border-color: var(--primary);
    color: var(--primary);
  }
  .mistake-actions button.remove:hover {
    border-color: var(--error);
    color: var(--error);
  }

  /* ===== STATS PAGE ===== */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--bg-card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    text-align: center;
  }
  .stat-card .stat-num {
    font-size: 32px;
    font-weight: 800;
    color: var(--primary);
    line-height: 1.2;
  }
  .stat-card .stat-label {
    font-size: 13px;
    color: var(--text-light);
    margin-top: 4px;
  }
  .stat-card.accent .stat-num { color: var(--accent); }

  .stats-chart {
    background: var(--bg-card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
  }
  .stats-chart h3 {
    font-size: 16px;
    margin-bottom: 16px;
    color: var(--text);
  }
  .chart-bars {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .chart-bar-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .chart-bar-label {
    width: 80px;
    font-size: 13px;
    color: var(--text-light);
    text-align: right;
    flex-shrink: 0;
  }
  .chart-bar-track {
    flex: 1;
    height: 24px;
    background: var(--bg);
    border-radius: 12px;
    overflow: hidden;
  }
  .chart-bar-fill {
    height: 100%;
    border-radius: 12px;
    background: linear-gradient(90deg, var(--primary), var(--primary-light));
    transition: width 0.8s ease;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 8px;
    font-size: 11px;
    color: white;
    font-weight: 600;
    min-width: 36px;
  }
  .chart-bar-fill.gold {
    background: linear-gradient(90deg, var(--accent), var(--accent-light));
    color: var(--text);
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 640px) {
    .header-inner { flex-direction: column; height: auto; padding: 12px 0; gap: 8px; }
    .nav { flex-wrap: wrap; }
    .nav-btn { flex: 1; min-width: 0; justify-content: center; font-size: 13px; padding: 8px 12px; }
    .word-card { padding: 20px; }
    .quiz-card { padding: 20px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .learn-hero::after { display: none; }
  }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-lighter); }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--primary-dark);
    color: white;
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    z-index: 1000;
    opacity: 0;
    transition: all 0.4s ease;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ===== SEARCH ===== */
  .search-box {
    margin-bottom: 20px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    padding: 12px 16px 12px 42px;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    background: var(--bg-card);
    transition: var(--transition);
    outline: none;
  }
  .search-box input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(44,95,124,0.1);
  }
  .search-box::before {
    content: '🔍';
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
  }

  /* Review mode */
  .review-mode {
    display: none;
  }
  .review-mode.active {
    display: block;
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">词</div>
      <span>词道 · 考公词语学习</span>
    </div>
    <div class="header-stats">
      <span>📚 已学 <strong id="statLearned">0</strong> 词</span>
      <span>✅ 正确率 <strong id="statAccuracy">0%</strong></span>
    </div>
  </div>
</div>

<!-- NAV -->
<div class="nav">
  <button class="nav-btn active" onclick="switchPage('learn')">📖 词语学习</button>
  <button class="nav-btn" onclick="switchPage('quiz')">✏️ 每日练习</button>
  <button class="nav-btn" onclick="switchPage('mistakes')">📝 错词本 <span class="badge" id="mistakeBadge" style="display:none">0</span></button>
  <button class="nav-btn" onclick="switchPage('stats')">📊 学习统计</button>
</div>

<!-- MAIN -->
<div class="main">

  <!-- LEARN PAGE -->
  <div class="page active" id="page-learn">
    <div class="learn-hero">
      <h2>📖 今日词语学习</h2>
      <p>掌握高频考公词语，夯实言语理解基础</p>
      <div class="learn-progress">
        <span>学习进度</span>
        <div class="progress-bar">
          <div class="progress-fill" id="learnProgress" style="width:0%"></div>
        </div>
        <span id="learnProgressText">0/0</span>
      </div>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索词语..." oninput="filterWords()">
    </div>

    <div id="wordList"></div>
    <div class="load-more" id="loadMore">
      <button onclick="loadMoreWords()">加载更多词语</button>
    </div>
  </div>

  <!-- QUIZ PAGE -->
  <div class="page" id="page-quiz">
    <div class="quiz-container">
      <div class="quiz-header">
        <h2>✏️ 词语练习</h2>
        <div class="quiz-meta">
          <span>📋 题目 <strong id="quizCurrent">1</strong>/<strong id="quizTotal">10</strong></span>
          <span>✅ 正确 <strong id="quizCorrect">0</strong></span>
          <span>❌ 错误 <strong id="quizWrong">0</strong></span>
        </div>
      </div>

      <div id="quizContent">
        <div class="quiz-card">
          <div class="quiz-question" id="quizQuestion"></div>
          <div class="quiz-hint" id="quizHint"></div>
          <div class="quiz-options" id="quizOptions"></div>
          <div class="quiz-explanation" id="quizExplanation"></div>
        </div>
        <div class="quiz-actions">
          <button class="btn btn-primary" id="quizNextBtn" onclick="nextQuestion()" style="display:none">下一题 →</button>
        </div>
      </div>

      <div id="quizResult" style="display:none">
        <div class="quiz-result">
          <div class="score-circle">
            <div class="score-num" id="resultScore">0</div>
            <div class="score-label">正确率</div>
          </div>
          <h3 id="resultTitle">练习完成！</h3>
          <p id="resultDesc"></p>
          <div class="quiz-actions">
            <button class="btn btn-primary" onclick="startQuiz()">再来一轮</button>
            <button class="btn btn-outline" onclick="switchPage('mistakes')">查看错词本</button>
          </div>
        </div>
      </div>

      <div id="quizStart">
        <div class="quiz-card" style="text-align:center; padding: 40px;">
          <div style="font-size:48px; margin-bottom:16px;">📝</div>
          <h3 style="font-size:18px; margin-bottom:8px;">准备好了吗？</h3>
          <p style="color:var(--text-light); font-size:14px; margin-bottom:24px;">
            每轮 10 道题，涵盖词语释义、近义词辨析、用法判断等题型
          </p>
          <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
            <button class="btn btn-primary" onclick="startQuiz()">🚀 开始练习</button>
            <button class="btn btn-outline" onclick="startQuiz('review')">🔄 错词复习</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MISTAKES PAGE -->
  <div class="page" id="page-mistakes">

// ===== STATE =====
let state = {
  learned: JSON.parse(localStorage.getItem('cidao_learned') || '[]'),
  mistakes: JSON.parse(localStorage.getItem('cidao_mistakes') || '[]'),
  quizHistory: JSON.parse(localStorage.getItem('cidao_quizHistory') || '[]'),
  currentQuiz: null,
  displayedWords: 8,
  currentPage: 'learn'
};

// ===== SAVE STATE =====
function saveState() {
  localStorage.setItem('cidao_learned', JSON.stringify(state.learned));
  localStorage.setItem('cidao_mistakes', JSON.stringify(state.mistakes));
  localStorage.setItem('cidao_quizHistory', JSON.stringify(state.quizHistory));
}

// ===== PAGE SWITCH =====
function switchPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  state.currentPage = page;

  const btns = document.querySelectorAll('.nav-btn');
  const pages = ['learn', 'quiz', 'mistakes', 'stats'];
  btns[pages.indexOf(page)].classList.add('active');

  if (page === 'learn') renderWords();
  if (page === 'mistakes') renderMistakes();
  if (page === 'stats') renderStats();
  if (page === 'quiz') resetQuizView();
  updateHeaderStats();
}

// ===== HEADER STATS =====
function updateHeaderStats() {
  document.getElementById('statLearned').textContent = state.learned.length;

  const total = state.quizHistory.reduce((a, b) => a + b.total, 0);
  const correct = state.quizHistory.reduce((a, b) => a + b.correct, 0);
  const accuracy = total > 0 ? Math.round(correct / total * 100) : 0;
  document.getElementById('statAccuracy').textContent = accuracy + '%';
}

// ===== LEARN PAGE =====
function renderWords(filter = '') {
  const container = document.getElementById('wordList');
  let words = wordDB;

  if (filter) {
    words = words.filter(w =>
      w.word.includes(filter) ||
      w.definition.includes(filter) ||
      (w.synonyms && w.synonyms.some(s => s.includes(filter)))
    );
  }

  const displayed = words.slice(0, state.displayedWords);
  container.innerHTML = displayed.map((w, i) => {
    const isLearned = state.learned.includes(w.word);
    return `
      <div class="word-card" onclick="toggleCard(this)" data-word="${w.word}">
        <div class="word-card-header">
          <div>
            <div class="word-title">${w.word}</div>
            <div class="word-pinyin">${w.pinyin}</div>
          </div>
          <div style="display:flex;gap:6px;align-items:center;">
            ${w.hot ? '<span class="word-tag hot">🔥 高频</span>' : ''}
            <span class="word-tag">${w.category}</span>
            ${isLearned ? '<span style="color:var(--success);font-size:18px;">✓</span>' : ''}
          </div>
        </div>
        <div class="word-def">${w.definition}</div>
        <div class="word-example">📌 ${w.example}</div>
        <div class="word-detail">
          ${w.synonyms && w.synonyms.length ? `<div style="margin-bottom:8px;"><strong>近义词：</strong>${w.synonyms.join('、')}</div>` : ''}
          ${w.antonyms && w.antonyms.length ? `<div style="margin-bottom:8px;"><strong>反义词：</strong>${w.antonyms.join('、')}</div>` : ''}
          ${w.confuse && w.confuse.length ? `<div style="margin-bottom:8px;"><strong>⚠️ 易混淆：</strong><div class="word-confuse" style="margin-top:6px;">${w.confuse.map(c => `<span class="confuse-chip">${c}</span>`).join('')}</div></div>` : ''}
          <div style="margin-top:12px;">
            <button class="btn ${isLearned ? 'btn-outline' : 'btn-accent'}" onclick="event.stopPropagation(); toggleLearned('${w.word}')" style="padding:8px 20px; font-size:13px;">
              ${isLearned ? '取消标记' : '✓ 标记已学'}
            </button>
          </div>
        </div>
      </div>
    `;
  }).join('');

  // Update progress
  const progress = Math.min(100, Math.round(state.learned.length / wordDB.length * 100));
  document.getElementById('learnProgress').style.width = progress + '%';
  document.getElementById('learnProgressText').textContent = `${state.learned.length}/${wordDB.length}`;

  // Load more button
  document.getElementById('loadMore').style.display =
    state.displayedWords < words.length ? 'block' : 'none';
}

function toggleCard(el) {
  el.classList.toggle('expanded');
  const word = el.dataset.word;
  if (!state.learned.includes(word)) {
    state.learned.push(word);
    saveState();
    updateHeaderStats();
  }
}

function toggleLearned(word) {
  const idx = state.learned.indexOf(word);
  if (idx > -1) {
    state.learned.splice(idx, 1);
  } else {
    state.learned.push(word);
  }
  saveState();
  updateHeaderStats();
  renderWords(document.getElementById('searchInput').value);
}

function loadMoreWords() {
  state.displayedWords += 8;
  renderWords(document.getElementById('searchInput').value);
}

function filterWords() {
  const val = document.getElementById('searchInput').value.trim();
  state.displayedWords = 8;
  renderWords(val);
}

// ===== QUIZ =====
function resetQuizView() {
  document.getElementById('quizStart').style.display = 'block';
  document.getElementById('quizContent').style.display = 'none';
  document.getElementById('quizResult').style.display = 'none';
}

function startQuiz(mode = 'normal') {
  document.getElementById('quizStart').style.display = 'none';
  document.getElementById('quizContent').style.display = 'block';
  document.getElementById('quizResult').style.display = 'none';

  let pool = [...wordDB];
  if (mode === 'review' && state.mistakes.length > 0) {
    pool = wordDB.filter(w => state.mistakes.includes(w.word));
  }

  if (pool.length < 4) {
    pool = [...wordDB];
  }

  // Shuffle and pick 10
  pool = shuffle(pool).slice(0, 10);

  state.currentQuiz = {
    questions: pool.map(w => generateQuestion(w, wordDB)),
    currentIndex: 0,
    correct: 0,
    wrong: 0,
    wrongWords: [],
    mode: mode
  };

  showQuestion();
}

function generateQuestion(word, allWords) {
  const types = ['meaning', 'synonym', 'usage', 'confuse'];
  const type = types[Math.floor(Math.random() * types.length)];
  let question, hint, options, correctAnswer, explanation;

  switch(type) {
    case 'meaning': {
      question = `"${word.word}" 的正确释义是？`;
      hint = '请选择最准确的解释';
      const wrongDefs = shuffle(allWords.filter(w => w.word !== word.word)).slice(0, 3);
      options = shuffle([
        { text: word.definition, correct: true },
        ...wrongDefs.map(w => ({ text: w.definition, correct: false }))
      ]);
      correctAnswer = word.definition;
      explanation = `<strong>${word.word}</strong>（${word.pinyin}）：${word.definition}`;
      break;
    }
    case 'synonym': {
      if (!word.synonyms || word.synonyms.length === 0) return generateQuestion(word, allWords);
      question = `下列哪个词语与 "${word.word}" 意思最接近？`;
      hint = '近义词辨析';
      const wrongWords = shuffle(allWords.filter(w => w.word !== word.word && (!w.synonyms || !w.synonyms.includes(word.synonyms[0])))).slice(0, 3);
      options = shuffle([
        { text: word.synonyms[0], correct: true },
        ...wrongWords.map(w => ({ text: w.word, correct: false }))
      ]);
      correctAnswer = word.synonyms[0];
      explanation = `<strong>${word.word}</strong> 的近义词是「${word.synonyms.join('、')}」。\n${word.definition}`;
      break;
    }
    case 'usage': {
      question = `以下关于 "${word.word}" 的用法，哪个是正确的？`;
      hint = '判断正确用法';
      const wrongUsage = generateWrongUsage(word);
      options = shuffle([
        { text: `「${word.word}」${word.example}`, correct: true },
        { text: `「${word.word}」${wrongUsage}`, correct: false }
      ]);
      // Add more options
      const extraWrong = shuffle(allWords.filter(w => w.word !== word.word)).slice(0, 2);
      options.push(...extraWrong.map(w => ({ text: `「${w.word}」${w.example}`, correct: false })));
      options = shuffle(options);
      correctAnswer = `「${word.word}」${word.example}`;
      explanation = `<strong>${word.word}</strong>：${word.definition}\n正确例句：${word.example}`;
      break;
    }
    case 'confuse': {
      if (!word.confuse || word.confuse.length === 0) return generateQuestion(word, allWords);
      question = `关于 "${word.word}"，以下哪个说法是正确的？`;
      hint = '易混淆点辨析';
      const confuseItem = word.confuse[0];
      options = shuffle([
        { text: confuseItem, correct: true },
        { text: `"${word.word}" 可以写作 "${word.word[0]}步就班"`, correct: false },
        { text: `"${word.word}" 是褒义词`, correct: false },
        { text: `"${word.word}" 意思是"完全不行"`, correct: false }
      ]);
      correctAnswer = confuseItem;
      explanation = `<strong>${word.word}</strong>易混淆点：${word.confuse.join('；')}\n\n${word.definition}`;
      break;
    }
  }

  return { word: word.word, type, question, hint, options, correctAnswer, explanation };
}

function generateWrongUsage(word) {
  const wrongTemplates = [
    `他${word.word}地完成了任务，大家都很满意。`,
    `这个问题非常${word.word}，需要认真对待。`,
    `老师说他${word.word}，值得表扬。`,
    `这件事做得${word.word}，令人赞叹。`
  ];
  return wrongTemplates[Math.floor(Math.random() * wrongTemplates.length)];
}

function showQuestion() {
  const quiz = state.currentQuiz;
  if (quiz.currentIndex >= quiz.questions.length) {
    showResult();
    return;
  }

  const q = quiz.questions[quiz.currentIndex];
  document.getElementById('quizCurrent').textContent = quiz.currentIndex + 1;
  document.getElementById('quizTotal').textContent = quiz.questions.length;
  document.getElementById('quizCorrect').textContent = quiz.correct;
  document.getElementById('quizWrong').textContent = quiz.wrong;

  document.getElementById('quizQuestion').textContent = q.question;
  document.getElementById('quizHint').textContent = q.hint;

  const letters = ['A', 'B', 'C', 'D'];
  document.getElementById('quizOptions').innerHTML = q.options.map((opt, i) => `
    <div class="quiz-option" onclick="selectAnswer(this, ${opt.correct})" data-correct="${opt.correct}">
      <span class="option-letter">${letters[i]}</span>
      <span>${opt.text}</span>
    </div>
  `).join('');

  document.getElementById('quizExplanation').classList.remove('show');
  document.getElementById('quizExplanation').innerHTML = '';
  document.getElementById('quizNextBtn').style.display = 'none';
}

function selectAnswer(el, isCorrect) {
  const quiz = state.currentQuiz;
  const q = quiz.questions[quiz.currentIndex];

  // Disable all options
  document.querySelectorAll('.quiz-option').forEach(opt => {
    opt.classList.add('disabled');
    if (opt.dataset.correct === 'true') {
      opt.classList.add('correct');
    }
  });

  if (isCorrect) {
    el.classList.add('correct');
    quiz.correct++;
  } else {
    el.classList.add('wrong');
    quiz.wrong++;
    if (!quiz.wrongWords.includes(q.word)) {
      quiz.wrongWords.push(q.word);
    }
    // Add to mistakes
    if (!state.mistakes.includes(q.word)) {
      state.mistakes.push(q.word);
      saveState();
      updateMistakeBadge();
    }
  }

  // Show explanation
  document.getElementById('quizExplanation').innerHTML = q.explanation.replace(/\n/g, '<br>');
  document.getElementById('quizExplanation').classList.add('show');
  document.getElementById('quizNextBtn').style.display = 'inline-block';
  document.getElementById('quizNextBtn').textContent =
    quiz.currentIndex + 1 >= quiz.questions.length ? '查看结果 →' : '下一题 →';
}

function nextQuestion() {
  state.currentQuiz.currentIndex++;
  showQuestion();
}

function showResult() {
  const quiz = state.currentQuiz;
  const total = quiz.questions.length;
  const score = Math.round(quiz.correct / total * 100);

  // Save history
  state.quizHistory.push({
    date: new Date().toLocaleDateString(),
    correct: quiz.correct,
    total: total,
    score: score
  });
  saveState();

  document.getElementById('quizContent').style.display = 'none';
  document.getElementById('quizResult').style.display = 'block';

  document.getElementById('resultScore').textContent = score + '%';

  let title, desc;
  if (score >= 90) {
    title = '🎉 太棒了！';
    desc = `答对 ${quiz.correct}/${total} 题，你对考公词语的掌握非常扎实！`;
  } else if (score >= 70) {
    title = '👍 不错！';
    desc = `答对 ${quiz.correct}/${total} 题，继续加油，争取更高分！`;
  } else if (score >= 50) {
    title = '💪 继续努力！';
    desc = `答对 ${quiz.correct}/${total} 题，建议多复习错词本中的词语。`;
  } else {
    title = '📚 需要多练习';
    desc = `答对 ${quiz.correct}/${total} 题，建议先回到词语学习页面打好基础。`;
  }

  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultDesc').textContent = desc;

  updateHeaderStats();
}

// ===== MISTAKES =====
function renderMistakes() {
  const container = document.getElementById('mistakesList');
  updateMistakeBadge();

  if (state.mistakes.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📝</div>
        <p>错词本还是空的</p>
        <p style="margin-top:4px;">去做几道练习题吧！</p>
      </div>
    `;
    return;
  }

  container.innerHTML = state.mistakes.map(word => {
    const w = wordDB.find(item => item.word === word);
    if (!w) return '';
    return `
      <div class="mistake-item">
        <div>
          <div class="mistake-word">${w.word}</div>
          <div class="mistake-info">${w.definition.substring(0, 40)}...</div>
        </div>
        <div class="mistake-actions">
          <button onclick="removeMistake('${w.word}')">移除</button>
        </div>
      </div>
    `;
  }).join('');
}

function updateMistakeBadge() {
  const badge = document.getElementById('mistakeBadge');
  if (state.mistakes.length > 0) {
    badge.style.display = 'inline';
    badge.textContent = state.mistakes.length;
  } else {
    badge.style.display = 'none';
  }
}

function removeMistake(word) {
  state.mistakes = state.mistakes.filter(w => w !== word);
  saveState();
  renderMistakes();
  showToast('已从错词本移除');
}

function clearMistakes() {
  if (state.mistakes.length === 0) return;
  if (confirm('确定要清空错词本吗？')) {
    state.mistakes = [];
    saveState();
    renderMistakes();
    showToast('错词本已清空');
  }
}

// ===== STATS =====
function renderStats() {
  document.getElementById('statTotalWords').textContent = wordDB.length;
  document.getElementById('statLearnedCount').textContent = state.learned.length;
  document.getElementById('statQuizCount').textContent = state.quizHistory.length;

  const total = state.quizHistory.reduce((a, b) => a + b.total, 0);
  const correct = state.quizHistory.reduce((a, b) => a + b.correct, 0);
  const accuracy = total > 0 ? Math.round(correct / total * 100) : 0;
  document.getElementById('statAccuracyCount').textContent = accuracy + '%';

  // Chart
  const chartBars = document.getElementById('chartBars');
  const learnedPct = Math.round(state.learned.length / wordDB.length * 100);
  const accuracyPct = accuracy;
  const mistakePct = Math.round(state.mistakes.length / wordDB.length * 100);

  chartBars.innerHTML = `
    <div class="chart-bar-row">
      <div class="chart-bar-label">学习进度</div>
      <div class="chart-bar-track">
        <div class="chart-bar-fill" style="width:${learnedPct}%">${learnedPct}%</div>
      </div>
    </div>
    <div class="chart-bar-row">
      <div class="chart-bar-label">正确率</div>
      <div class="chart-bar-track">
        <div class="chart-bar-fill gold" style="width:${accuracyPct}%">${accuracyPct}%</div>
      </div>
    </div>
    <div class="chart-bar-row">
      <div class="chart-bar-label">错词占比</div>
      <div class="chart-bar-track">
        <div class="chart-bar-fill" style="width:${Math.min(mistakePct, 100)}%;background:linear-gradient(90deg,#f87171,#fca5a5)">${mistakePct}%</div>
      </div>
    </div>
    <div class="chart-bar-row">
      <div class="chart-bar-label">练习次数</div>
      <div class="chart-bar-track">
        <div class="chart-bar-fill" style="width:${Math.min(state.quizHistory.length * 10, 100)}%">${state.quizHistory.length}次</div>
      </div>
    </div>
  `;
}

// ===== UTILS =====
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// ===== INIT =====
renderWords();
updateHeaderStats();
updateMistakeBadge();
</script>
