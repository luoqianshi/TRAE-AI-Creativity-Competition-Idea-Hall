<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeetMind · AI 会议智能中枢</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Inter", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f6f7fb;
    color: #1f2937;
    min-height: 100vh;
  }
  .topbar {
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    padding: 16px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .topbar .brand { display: flex; align-items: center; gap: 12px; }
  .topbar .brand-icon {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, #4f46e5, #06b6d4);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: bold;
  }
  .topbar .brand-text { font-weight: 600; font-size: 1.05rem; }
  .topbar .brand-text small { display: block; color: #9ca3af; font-size: 0.75rem; font-weight: normal; }
  .topbar .actions { display: flex; gap: 12px; align-items: center; }
  .topbar .actions span { color: #6b7280; font-size: 0.85rem; }
  .topbar .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 0.9rem;
  }
  .main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px 32px;
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 20px;
  }
  .card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 22px;
  }
  .card h2 {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 14px;
    color: #111827;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h2 .badge {
    background: #eef2ff;
    color: #4f46e5;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: 500;
  }
  textarea {
    width: 100%;
    min-height: 220px;
    padding: 14px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    font-size: 0.9rem;
    resize: vertical;
    outline: none;
    font-family: inherit;
    line-height: 1.7;
  }
  textarea:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px #4f46e51a; }
  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 14px;
  }
  .toolbar select {
    padding: 8px 12px;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    font-size: 0.85rem;
    background: #fff;
  }
  .btn-primary {
    margin-left: auto;
    background: linear-gradient(135deg, #4f46e5, #06b6d4);
    color: #fff;
    padding: 10px 22px;
    border: none;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-ghost {
    background: #fff;
    border: 1px solid #e5e7eb;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .summary-box {
    background: #f9fafb;
    border-left: 3px solid #4f46e5;
    padding: 14px;
    border-radius: 0 8px 8px 0;
    color: #374151;
    line-height: 1.7;
    font-size: 0.9rem;
  }
  .todo-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    margin-bottom: 8px;
    transition: all 0.2s;
  }
  .todo-item:hover { background: #f9fafb; }
  .todo-check {
    width: 18px; height: 18px;
    border: 2px solid #d1d5db;
    border-radius: 4px;
    flex-shrink: 0;
    margin-top: 2px;
    cursor: pointer;
  }
  .todo-check.done { background: #10b981; border-color: #10b981; }
  .todo-content { flex: 1; }
  .todo-content .title { font-size: 0.9rem; color: #111827; }
  .todo-content .meta { font-size: 0.75rem; color: #6b7280; margin-top: 4px; display: flex; gap: 10px; }
  .tag-pill {
    background: #eef2ff;
    color: #4f46e5;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.7rem;
  }
  .tag-pill.danger { background: #fef2f2; color: #dc2626; }
  .tag-pill.warn { background: #fffbeb; color: #d97706; }
  .keyword {
    display: inline-block;
    background: #f3f4f6;
    color: #374151;
    padding: 4px 10px;
    border-radius: 16px;
    font-size: 0.8rem;
    margin: 4px 4px 0 0;
  }
  .meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .meta-card {
    background: linear-gradient(135deg, #eef2ff, #e0f2fe);
    padding: 14px;
    border-radius: 8px;
  }
  .meta-card .label { font-size: 0.75rem; color: #4f46e5; font-weight: 500; }
  .meta-card .value { font-size: 1.4rem; font-weight: 600; color: #1f2937; margin-top: 4px; }
  .hidden { display: none; }
  @media (max-width: 900px) {
    .main { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="brand-icon">M</div>
    <div class="brand-text">MeetMind <small>企业版 · 会议智能中枢</small></div>
  </div>
  <div class="actions">
    <span>📅 2026-07-09 · Q3 启动会</span>
    <div class="avatar">YL</div>
  </div>
</div>

<div class="main">
  <div>
    <div class="card">
      <h2>📝 原始转录文本 <span class="badge">实时识别</span></h2>
      <textarea id="transcript" placeholder="粘贴或上传会议转录文本...">讨论第三季度产品上线计划，确认在 7 月 20 日完成内测。市场部需要在 7 月 10 日前提供推广素材。技术部负责接口联调，预计 7 月 15 日完成。下次评审会议定在 7 月 8 日下午 3 点。本次会议由产品总监主持，共 8 人参会。</textarea>
      <div class="toolbar">
        <select>
          <option>会议类型：项目同步</option>
          <option>会议类型：产品评审</option>
          <option>会议类型：客户沟通</option>
        </select>
        <button class="btn-ghost">📎 上传音频</button>
        <button class="btn-primary" onclick="generate()">⚡ AI 提炼纪要</button>
      </div>
    </div>

    <div class="card" style="margin-top: 20px;">
      <h2>📌 会议摘要</h2>
      <div class="meta-grid">
        <div class="meta-card">
          <div class="label">关键议题</div>
          <div class="value">3</div>
        </div>
        <div class="meta-card">
          <div class="label">待办事项</div>
          <div class="value" id="todoCount">4</div>
        </div>
      </div>
      <div class="summary-box" id="summaryBox">
        点击右上角「AI 提炼纪要」按钮，AI 将自动生成结构化会议摘要、提取待办与关键结论。
      </div>
    </div>
  </div>

  <div>
    <div class="card">
      <h2>✅ 待办事项</h2>
      <div id="todoList" style="margin-top: 8px;">
        <div style="color: #9ca3af; font-size: 0.85rem; text-align: center; padding: 20px;">尚未生成</div>
      </div>
    </div>

    <div class="card" style="margin-top: 20px;">
      <h2>🏷️ 关键词与话题</h2>
      <div id="keywords" style="margin-top: 8px;">
        <span style="color: #9ca3af; font-size: 0.85rem;">尚未生成</span>
      </div>
    </div>

    <div class="card" style="margin-top: 20px;">
      <h2>👥 参会人</h2>
      <div style="display: flex; gap: -8px; margin-top: 8px;">
        <div class="avatar" style="background: linear-gradient(135deg, #4f46e5, #06b6d4);">YL</div>
        <div class="avatar" style="background: linear-gradient(135deg, #f59e0b, #ef4444); margin-left: -10px;">ZJ</div>
        <div class="avatar" style="background: linear-gradient(135deg, #10b981, #06b6d4); margin-left: -10px;">LS</div>
        <div class="avatar" style="background: linear-gradient(135deg, #8b5cf6, #ec4899); margin-left: -10px;">+5</div>
      </div>
    </div>
  </div>
</div>

<script>
  const todos = [
    { title: '完成产品内测', meta: ['负责人：技术部', '截止：7-20'], tag: 'danger', tagText: '高优' },
    { title: '提交推广素材', meta: ['负责人：市场部', '截止：7-10'], tag: 'warn', tagText: '紧急' },
    { title: '完成接口联调', meta: ['负责人：技术部', '截止：7-15'], tag: '', tagText: '常规' },
    { title: '召开下次评审会', meta: ['时间：7-8 15:00', '全员参与'], tag: '', tagText: '会议' }
  ];
  function generate() {
    document.getElementById('summaryBox').innerHTML = '本次会议围绕 <strong>Q3 产品上线计划</strong>展开，明确了技术、市场等部门的关键里程碑：内测节点为 7-20，推广素材 7-10 前到位，接口联调 7-15 完成。会议同时确认了下次评审时间与参会范围。';
    document.getElementById('todoCount').textContent = todos.length;
    document.getElementById('todoList').innerHTML = todos.map(t => `
      <div class="todo-item">
        <div class="todo-check" onclick="this.classList.toggle('done')"></div>
        <div class="todo-content">
          <div class="title">${t.title}</div>
          <div class="meta">
            ${t.meta.map(m => `<span>${m}</span>`).join('')}
            <span class="tag-pill ${t.tag}">${t.tagText}</span>
          </div>
        </div>
      </div>
    `).join('');
    const kws = ['Q3', '产品上线', '内测', '推广素材', '接口联调', '评审会议', '产品总监'];
    document.getElementById('keywords').innerHTML = kws.map(k => `<span class="keyword">#${k}</span>`).join('');
  }
</script>
</body>
</html>
