<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>世界推演引擎 · 交互式 Demo</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap");

            :root {
                --bg: #0a0e17;
                --bg2: #111827;
                --bg3: #1a2235;
                --accent: #60a5fa;
                --accent2: #a78bfa;
                --accent3: #34d399;
                --danger: #ef4444;
                --gold: #fbbf24;
                --text: #e2e8f0;
                --text2: #94a3b8;
                --text3: #475569;
                --border: #1e293b;
            }

            body {
                font-family: "Noto Sans SC", sans-serif;
                background: var(--bg);
                color: var(--text);
                height: 100vh;
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }

            /* ===== Header ===== */
            .header {
                background: var(--bg2);
                border-bottom: 1px solid var(--border);
                padding: 0.6rem 1.2rem;
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-shrink: 0;
                z-index: 10;
            }
            .header-logo {
                font-weight: 700;
                font-size: 1rem;
                background: linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent2)
                );
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
            .header-status {
                display: flex;
                align-items: center;
                gap: 1rem;
                font-size: 0.8rem;
                color: var(--text2);
            }
            .header-status .stat {
                display: flex;
                align-items: center;
                gap: 0.3rem;
            }
            .header-status .stat .val {
                color: var(--text);
                font-weight: 500;
            }
            .header-status .stat .val.gold {
                color: var(--gold);
            }
            .header-status .stat .val.affinity {
                color: var(--accent3);
            }

            /* ===== Main Layout ===== */
            .main {
                display: flex;
                flex: 1;
                overflow: hidden;
            }

            /* ===== Left Panel - Story ===== */
            .story-panel {
                flex: 1;
                display: flex;
                flex-direction: column;
                border-right: 1px solid var(--border);
                min-width: 0;
            }

            .story-log {
                flex: 1;
                overflow-y: auto;
                padding: 1rem 1.2rem;
                display: flex;
                flex-direction: column;
                gap: 0.6rem;
            }
            .story-log::-webkit-scrollbar {
                width: 4px;
            }
            .story-log::-webkit-scrollbar-track {
                background: transparent;
            }
            .story-log::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 2px;
            }

            .msg {
                padding: 0.6rem 0.8rem;
                border-radius: 8px;
                font-size: 0.88rem;
                line-height: 1.6;
                animation: msgIn 0.3s ease;
            }
            @keyframes msgIn {
                from {
                    opacity: 0;
                    transform: translateY(8px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .msg.system {
                background: rgba(96, 165, 250, 0.08);
                border-left: 2px solid var(--accent);
                color: var(--text2);
                font-size: 0.8rem;
            }
            .msg.narrator {
                text-align: center;
                color: var(--text2);
                font-style: italic;
                font-size: 0.82rem;
            }
            .msg.npc {
                background: rgba(167, 139, 250, 0.08);
                border-left: 2px solid var(--accent2);
            }
            .msg.npc .name {
                color: var(--accent2);
                font-weight: 600;
                font-size: 0.8rem;
                margin-bottom: 0.2rem;
            }
            .msg.player {
                background: rgba(52, 211, 153, 0.06);
                border-left: 2px solid var(--accent3);
                margin-left: 1.5rem;
            }
            .msg.player .name {
                color: var(--accent3);
                font-weight: 600;
                font-size: 0.8rem;
                margin-bottom: 0.2rem;
            }
            .msg.important {
                background: rgba(251, 191, 36, 0.1);
                border: 1px solid rgba(251, 191, 36, 0.2);
                color: var(--gold);
                text-align: center;
                font-weight: 500;
            }

            /* ===== Actions ===== */
            .actions {
                border-top: 1px solid var(--border);
                padding: 0.8rem 1.2rem;
                background: var(--bg2);
                flex-shrink: 0;
            }
            .actions .prompt {
                font-size: 0.8rem;
                color: var(--text2);
                margin-bottom: 0.5rem;
            }
            .action-buttons {
                display: flex;
                flex-wrap: wrap;
                gap: 0.4rem;
            }
            .action-btn {
                padding: 0.45rem 1rem;
                border-radius: 8px;
                border: 1px solid var(--border);
                background: var(--bg3);
                color: var(--text);
                font-size: 0.82rem;
                font-family: inherit;
                cursor: pointer;
                transition: all 0.2s;
                white-space: nowrap;
            }
            .action-btn:hover {
                border-color: var(--accent);
                background: rgba(96, 165, 250, 0.1);
            }
            .action-btn:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }
            .action-btn.primary {
                border-color: var(--accent);
                color: var(--accent);
                background: rgba(96, 165, 250, 0.1);
            }
            .action-btn.primary:hover {
                background: rgba(96, 165, 250, 0.2);
            }
            .action-btn.danger {
                border-color: var(--danger);
                color: var(--danger);
            }
            .action-btn.danger:hover {
                background: rgba(239, 68, 68, 0.1);
            }
            .action-btn.special {
                border-color: var(--gold);
                color: var(--gold);
                background: rgba(251, 191, 36, 0.08);
            }
            .action-btn.special:hover {
                background: rgba(251, 191, 36, 0.15);
            }

            /* ===== Right Panel - World ===== */
            .world-panel {
                width: 300px;
                display: flex;
                flex-direction: column;
                flex-shrink: 0;
                overflow-y: auto;
            }
            .world-panel::-webkit-scrollbar {
                width: 4px;
            }
            .world-panel::-webkit-scrollbar-track {
                background: transparent;
            }
            .world-panel::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 2px;
            }

            .location-box {
                padding: 1rem;
                border-bottom: 1px solid var(--border);
            }
            .location-box .label {
                font-size: 0.7rem;
                color: var(--text3);
                text-transform: uppercase;
                letter-spacing: 0.1em;
                margin-bottom: 0.3rem;
            }
            .location-box .name {
                font-size: 1.1rem;
                font-weight: 600;
            }
            .location-box .desc {
                font-size: 0.82rem;
                color: var(--text2);
                margin-top: 0.3rem;
                line-height: 1.5;
            }

            .npc-list {
                padding: 0.8rem 1rem;
            }
            .npc-list .section-title {
                font-size: 0.7rem;
                color: var(--text3);
                text-transform: uppercase;
                letter-spacing: 0.1em;
                margin-bottom: 0.6rem;
            }

            .npc-card {
                background: var(--bg2);
                border: 1px solid var(--border);
                border-radius: 10px;
                padding: 0.7rem 0.9rem;
                margin-bottom: 0.5rem;
                cursor: pointer;
                transition: all 0.2s;
            }
            .npc-card:hover {
                border-color: rgba(167, 139, 250, 0.3);
            }
            .npc-card.active {
                border-color: var(--accent2);
                background: rgba(167, 139, 250, 0.06);
            }
            .npc-card .npc-header {
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }
            .npc-card .npc-avatar {
                width: 32px;
                height: 32px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1rem;
                flex-shrink: 0;
            }
            .npc-card .npc-info {
                flex: 1;
                min-width: 0;
            }
            .npc-card .npc-name {
                font-weight: 600;
                font-size: 0.88rem;
            }
            .npc-card .npc-title {
                font-size: 0.72rem;
                color: var(--text2);
            }
            .npc-card .npc-affinity {
                font-size: 0.72rem;
                color: var(--accent3);
                margin-top: 0.15rem;
            }
            .npc-card .npc-affinity.low {
                color: var(--danger);
            }
            .npc-card .npc-affinity.mid {
                color: var(--gold);
            }
            .npc-card .npc-affinity.high {
                color: var(--accent3);
            }

            .legend {
                padding: 0.8rem 1rem;
                border-top: 1px solid var(--border);
                font-size: 0.72rem;
                color: var(--text3);
                line-height: 1.7;
            }
            .legend span {
                display: block;
            }

            /* ===== Intro overlay ===== */
            .intro-overlay {
                position: fixed;
                inset: 0;
                background: rgba(10, 14, 23, 0.97);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 100;
                padding: 2rem;
                text-align: center;
                transition: opacity 0.6s ease;
            }
            .intro-overlay.hidden {
                opacity: 0;
                pointer-events: none;
            }
            .intro-overlay h1 {
                font-size: clamp(2rem, 5vw, 3.5rem);
                font-weight: 900;
                background: linear-gradient(135deg, #60a5fa, #a78bfa);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                margin-bottom: 1rem;
            }
            .intro-overlay p {
                color: var(--text2);
                max-width: 500px;
                font-size: 0.95rem;
                line-height: 1.7;
                margin-bottom: 0.5rem;
            }
            .intro-overlay .start-btn {
                margin-top: 1.5rem;
                padding: 0.8rem 2.5rem;
                border-radius: 12px;
                border: 1px solid var(--accent);
                background: rgba(96, 165, 250, 0.1);
                color: var(--accent);
                font-size: 1.1rem;
                font-family: inherit;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s;
            }
            .intro-overlay .start-btn:hover {
                background: rgba(96, 165, 250, 0.2);
                transform: scale(1.02);
            }

            /* ===== Responsive ===== */
            @media (max-width: 700px) {
                .world-panel {
                    display: none;
                }
                .story-panel {
                    border-right: none;
                }
            }
        </style>
    </head>
    <body>
        <!-- ===== Intro Overlay ===== -->
        <div class="intro-overlay" id="introOverlay">
            <h1>世界推演引擎</h1>
            <p>边境小镇「埃尔多雷」迎来了一个陌生的旅人——那就是你。</p>
            <p>镇上有三位居民：沉默的铁匠、健谈的酒馆老板、神秘的猎人。</p>
            <p>你的每一个选择，都会被他们记住。</p>
            <p
                style="
                    font-size: 0.82rem;
                    color: var(--text3);
                    margin-top: 1rem;
                "
            >
                — 交互式 Demo · 约 5 分钟体验 —
            </p>
            <button class="start-btn" onclick="startGame()">踏入世界</button>
        </div>

        <!-- ===== Header ===== -->
        <div class="header">
            <div class="header-logo">✦ 世界推演引擎 · 边境小镇</div>
            <div class="header-status">
                <span class="stat"
                    >🗓️ <span class="val" id="dayDisplay">第 1 天</span></span
                >
                <span class="stat"
                    >⏰ <span class="val" id="timeDisplay">清晨</span></span
                >
                <span class="stat"
                    >💰 <span class="val gold" id="goldDisplay">10</span></span
                >
            </div>
        </div>

        <!-- ===== Main ===== -->
        <div class="main">
            <!-- Story Panel -->
            <div class="story-panel">
                <div class="story-log" id="storyLog"></div>
                <div class="actions" id="actionsPanel">
                    <div class="prompt" id="actionPrompt">◈ 你要做什么？</div>
                    <div class="action-buttons" id="actionButtons"></div>
                </div>
            </div>

            <!-- World Panel -->
            <div class="world-panel">
                <div class="location-box" id="locationBox">
                    <div class="label">当前位置</div>
                    <div class="name" id="locName">镇中心广场</div>
                    <div class="desc" id="locDesc">
                        小镇最热闹的地方，人来人往。
                    </div>
                </div>
                <div class="npc-list">
                    <div class="section-title">✦ 镇上的居民</div>
                    <div id="npcCards"></div>
                </div>
                <div class="legend">
                    <span>💬 点击 NPC 卡片可查看详情</span>
                    <span>🟢 好感度良好 &nbsp; 🟡 一般 &nbsp; 🔴 差</span>
                    <span>⚡ Trae Work (Auto) 生成交互原型</span>
                </div>
            </div>
        </div>

        <script>
            // ============================================================
            //  GAME DATA
            // ============================================================

            const LOCATIONS = {
                square: {
                    name: "镇中心广场",
                    desc: "青石板铺就的广场上竖着一口老井，几个孩子在追逐嬉闹。秋日的阳光温和地洒在屋檐上。",
                    npcs: ["kara", "finn"],
                    explore:
                        "广场边上贴着一张褪色的告示，隐约能看见「矿洞坍塌…招募志愿者」的字样。角落里有个老者在拉手风琴。",
                },
                forge: {
                    name: "铁匠铺",
                    desc: "炉火噼啪作响，墙上挂满了各式铁器。空气里弥漫着金属和炭火的气味。",
                    npcs: ["kara"],
                    explore:
                        "角落里有一柄未完工的长剑，剑身上刻着细密的符文。墙上挂着一幅泛黄的全家福。",
                },
                tavern: {
                    name: "「旅者之憩」酒馆",
                    desc: "木质吧台被岁月磨得发亮，壁炉里烧着桦木。吧台后的架子上摆满了各种酒瓶。",
                    npcs: ["finn", "elsa"],
                    explore:
                        "吧台上压着一叠泛黄的纸，似乎是某人的日记。壁炉上方的鹿头标本眼眶里嵌着一颗异常明亮的蓝色石头。",
                },
                forest: {
                    name: "镇外林地",
                    desc: "松树高耸入云，林间弥漫着薄雾。远处偶尔传来不知名的鸟鸣。一条小路通向密林深处。",
                    npcs: ["elsa"],
                    explore:
                        "林间有一块被苔藓覆盖的石碑，刻着古老的文字。树下有几个新鲜的脚印，延伸到迷雾中。",
                },
            };

            const NPCS = {
                kara: {
                    name: "卡拉",
                    emoji: "🔨",
                    title: "铁匠",
                    color: "#ef4444",
                    desc: "体格健壮的中年女性，手臂上满是疤痕。寡言少语，但眼神锐利。",
                    personality: "沉默、务实、外冷内热",
                    dialog: {
                        greeting: [
                            '卡拉抬头看了你一眼，手上的锤子没有停下。"新面孔。需要什么？"',
                            '卡拉擦了一把额头的汗："说。我听着。"',
                            '卡拉放下锤子，用布擦了擦手："说吧。"',
                        ],
                        ask_work: [
                            '"最近矿洞不太平，订单少了很多。"她皱眉，"上周马库斯家的老二在矿洞里摔断了腿。"',
                            '"铁矿石涨价了，品质还差。以前老矿区出的钢能砍断这个。"她敲了敲砧板。',
                        ],
                        ask_town: [
                            '"这镇子…比看上去复杂。"她压低声音，"夜里少出门。"',
                            '"镇长是个好人，但他管不住所有人。特别是矿上那些人。"',
                        ],
                        give_gift: [
                            '卡拉接过你递上的磨刀石，掂了掂，嘴角微微上扬："有心了。以后铁器有问题，找我。"',
                            '卡拉看着手里的铁锭，点了点头："算你有眼光。"她把铁锭收进围裙口袋。',
                        ],
                        flirt: [
                            '卡拉停下手中的活，盯着你看了三秒，面无表情："我的锤子比男人可靠。"然后继续打铁。',
                        ],
                    },
                },
                finn: {
                    name: "芬恩",
                    emoji: "🍺",
                    title: "酒馆老板",
                    color: "#fbbf24",
                    desc: "瘦高的中年男人，总是带着温和的笑容。说话时喜欢比划手势。",
                    personality: "健谈、圆滑、消息灵通",
                    dialog: {
                        greeting: [
                            '"哎呀，新客人！"芬恩眼睛一亮，用抹布擦了擦吧台，"坐坐坐，第一杯算我的。"',
                            '"欢迎欢迎！"芬恩热情地招呼，"今天有刚到的蜂蜜酒，尝尝？"',
                            '芬恩从吧台下摸出一个杯子："来得正好，刚泡好一壶草药茶。"',
                        ],
                        ask_work: [
                            '"酒馆生意还行，就是最近矿石商赊账太多。"他叹气，"但我也不好得罪他们。"',
                            '"我这儿是全镇的消息集散地。"他眨眨眼，"只要你买一杯酒。"',
                        ],
                        ask_town: [
                            '"这镇子啊…"他压低声音，"表面平静，底下暗流涌动。矿洞那边的事没那么简单。"',
                            '"你知道吗，镇上的人分两派——矿工派和守旧派。我？我中立。做生意嘛。"',
                        ],
                        give_gift: [
                            '芬恩接过那瓶陈年威士忌，眼睛放光："好酒！今晚我就开了它，咱俩喝一杯。"',
                            '"你太客气了！"芬恩把酒收好，"下回来，我给你留一桌最好的位置。"',
                        ],
                        flirt: [
                            '芬恩愣了一下，随即哈哈大笑："我女儿都十五岁了！不过……谢谢夸奖。"',
                        ],
                    },
                },
                elsa: {
                    name: "艾尔莎",
                    emoji: "🏹",
                    title: "猎人",
                    color: "#34d399",
                    desc: "年轻女子，披着深绿色斗篷，背着长弓。目光深邃，似乎总是若有所思。",
                    personality: "神秘、敏锐、寡言",
                    dialog: {
                        greeting: [
                            '艾尔莎从树上跳下来，无声落地。"你踩到我的陷阱了。"她盯着你，语气平静。',
                            '艾尔莎正用匕首削一根木箭。她抬头看了你一眼："有事？"',
                            '林间光影晃动，艾尔莎不知何时出现在你身后三步远。"你跟了我很久。说吧。"',
                        ],
                        ask_work: [
                            '"最近的猎物不对劲。"她皱眉，"它们往北边跑了，像是……在躲避什么。"',
                            '"我追踪一头鹿到了矿洞附近，然后……"她顿了顿，"我听到了不该存在的声音。"',
                        ],
                        ask_town: [
                            '"镇上的人分为两种：知道的和不知道的。"她低声说，"而你，看起来是第三种——想知道的人。"',
                            '"芬恩知道很多，但他不会全告诉你。卡拉知道更多，但她不会说。"',
                        ],
                        give_gift: [
                            '艾尔莎接过你递的精铁箭头，仔细端详："好手艺。"她收进箭袋，"我欠你一个人情。"',
                            '她闻了闻你给的草药，眼神微微闪动："这草药很稀有。谢谢。"',
                        ],
                        flirt: [
                            '艾尔莎微微歪头，嘴角带着一丝若有若无的笑意："你很特别。不过，我不属于任何地方。"',
                        ],
                    },
                },
            };

            // ============================================================
            //  GAME STATE
            // ============================================================

            let state = {
                day: 1,
                time: "清晨",
                location: "square",
                gold: 10,
                inventory: [],
                affinity: { kara: 0, finn: 0, elsa: 0 },
                flags: {},
                dialogHistory: {},
                talkingTo: null,
                storyPhase: "intro",
                turnCount: 0,
            };

            const logEl = document.getElementById("storyLog");
            const actionPrompt = document.getElementById("actionPrompt");
            const actionButtons = document.getElementById("actionButtons");
            const npcCardsEl = document.getElementById("npcCards");

            // ============================================================
            //  RENDER FUNCTIONS
            // ============================================================

            function renderLocation() {
                const loc = LOCATIONS[state.location];
                document.getElementById("locName").textContent = loc.name;
                document.getElementById("locDesc").textContent = loc.desc;
                document.getElementById("dayDisplay").textContent =
                    `第 ${state.day} 天`;
                document.getElementById("timeDisplay").textContent = state.time;
                document.getElementById("goldDisplay").textContent = state.gold;
            }

            function renderNPCCards() {
                const loc = LOCATIONS[state.location];
                let html = "";
                for (const id of loc.npcs) {
                    const npc = NPCS[id];
                    const aff = state.affinity[id];
                    const affClass =
                        aff <= -2 ? "low" : aff >= 2 ? "high" : "mid";
                    const affLabel =
                        aff <= -2
                            ? "冷淡"
                            : aff >= 2
                              ? "友好"
                              : aff === 0
                                ? "中立"
                                : "初识";
                    html += `
      <div class="npc-card ${state.talkingTo === id ? "active" : ""}" onclick="talkToNpc('${id}')">
        <div class="npc-header">
          <div class="npc-avatar" style="background:${npc.color}22;border:1px solid ${npc.color}44;">${npc.emoji}</div>
          <div class="npc-info">
            <div class="npc-name">${npc.name}</div>
            <div class="npc-title">${npc.title}</div>
            <div class="npc-affinity ${affClass}">❤ ${affLabel}</div>
          </div>
        </div>
      </div>`;
                }
                npcCardsEl.innerHTML = html;
            }

            function addMsg(type, content, name) {
                const div = document.createElement("div");
                div.className = `msg ${type}`;
                if (name) {
                    div.innerHTML = `<div class="name">${name}</div>${content}`;
                } else {
                    div.textContent = content;
                }
                logEl.appendChild(div);
                logEl.scrollTop = logEl.scrollHeight;
            }

            function clearActions() {
                actionButtons.innerHTML = "";
            }

            function setActions(prompt, buttons) {
                actionPrompt.textContent = prompt;
                actionButtons.innerHTML = "";
                for (const b of buttons) {
                    const btn = document.createElement("button");
                    btn.className = `action-btn ${b.cls || ""}`;
                    btn.textContent = b.label;
                    btn.onclick = b.action;
                    if (b.disabled) btn.disabled = true;
                    actionButtons.appendChild(btn);
                }
            }

            // ============================================================
            //  ADVANCE TIME
            // ============================================================

            function advanceTime() {
                state.turnCount++;
                const times = ["清晨", "上午", "正午", "午后", "傍晚", "夜晚"];
                const idx = times.indexOf(state.time);
                if (idx < times.length - 1) {
                    state.time = times[idx + 1];
                } else {
                    state.time = "清晨";
                    state.day++;
                }
                renderLocation();
            }

            // ============================================================
            //  AFFINITY CHANGES
            // ============================================================

            function changeAffinity(npcId, delta) {
                state.affinity[npcId] = (state.affinity[npcId] || 0) + delta;
                renderNPCCards();
            }

            // ============================================================
            //  NPC DIALOG ENGINE
            // ============================================================

            function getRandomDialog(npcId, key) {
                const npc = NPCS[npcId];
                const lines = npc.dialog[key];
                if (!lines) return "……（她没有回应）";
                // Use a simple hash to give variety but consistency per turn
                const idx =
                    (state.turnCount +
                        Object.keys(state.dialogHistory).length) %
                    lines.length;
                return lines[idx];
            }

            function openNpcDialog(npcId) {
                state.talkingTo = npcId;
                const npc = NPCS[npcId];
                renderNPCCards();

                addMsg(
                    "npc",
                    getRandomDialog(npcId, "greeting"),
                    npc.emoji + " " + npc.name,
                );
                changeAffinity(npcId, 0.5);

                renderNpcActions(npcId);
            }

            function renderNpcActions(npcId) {
                const npc = NPCS[npcId];
                const aff = state.affinity[npcId];

                setActions(`◈ 你想和 ${npc.name} 聊什么？`, [
                    {
                        label: "👋 问候",
                        action: () => {
                            addMsg("player", "你好。", "你");
                            addMsg(
                                "npc",
                                getRandomDialog(npcId, "greeting"),
                                npc.emoji + " " + npc.name,
                            );
                            changeAffinity(npcId, 0.5);
                            renderNpcActions(npcId);
                        },
                    },
                    {
                        label: "🔧 问工作",
                        action: () => {
                            addMsg("player", "你最近在忙什么？", "你");
                            addMsg(
                                "npc",
                                getRandomDialog(npcId, "ask_work"),
                                npc.emoji + " " + npc.name,
                            );
                            changeAffinity(npcId, 1);
                            renderNpcActions(npcId);
                        },
                    },
                    {
                        label: "🏘️ 问镇子",
                        action: () => {
                            addMsg("player", "这个镇子……有什么故事吗？", "你");
                            addMsg(
                                "npc",
                                getRandomDialog(npcId, "ask_town"),
                                npc.emoji + " " + npc.name,
                            );
                            changeAffinity(npcId, 1.5);
                            renderNpcActions(npcId);
                        },
                    },
                    {
                        label: "🎁 赠送礼物",
                        action: () => {
                            if (state.gold >= 3) {
                                state.gold -= 3;
                                addMsg("player", "这个送给你。", "你");
                                addMsg(
                                    "npc",
                                    getRandomDialog(npcId, "give_gift"),
                                    npc.emoji + " " + npc.name,
                                );
                                changeAffinity(npcId, 3);
                                renderLocation();
                                renderNpcActions(npcId);
                            } else {
                                addMsg(
                                    "system",
                                    "你翻了翻口袋……只有 " +
                                        state.gold +
                                        " 枚铜币，买不起像样的礼物。",
                                );
                                renderNpcActions(npcId);
                            }
                        },
                    },
                    {
                        label: "💕 表达好感",
                        action: () => {
                            addMsg("player", "其实我很欣赏你……", "你");
                            addMsg(
                                "npc",
                                getRandomDialog(npcId, "flirt"),
                                npc.emoji + " " + npc.name,
                            );
                            changeAffinity(npcId, aff >= 3 ? 2 : -1);
                            renderNpcActions(npcId);
                        },
                    },
                    {
                        label: "🚪 告别",
                        cls: "danger",
                        action: () => {
                            addMsg("player", "我先走了，回见。", "你");
                            addMsg(
                                "system",
                                "你结束了和 " + npc.name + " 的对话。",
                            );
                            state.talkingTo = null;
                            advanceTime();
                            renderNPCCards();
                            showMainActions();
                        },
                    },
                ]);
            }

            // ============================================================
            //  MAIN ACTIONS
            // ============================================================

            function showMainActions() {
                const loc = LOCATIONS[state.location];
                const canMove = {
                    square: ["forge", "tavern", "forest"],
                    forge: ["square"],
                    tavern: ["square"],
                    forest: ["square"],
                };

                let btns = [
                    {
                        label: "🔍 观察四周",
                        cls: "",
                        action: () => {
                            addMsg("narrator", loc.explore);
                            addMsg(
                                "system",
                                "你仔细观察了周围，发现了一些细节。",
                            );
                            advanceTime();
                            showMainActions();
                        },
                    },
                    {
                        label: "💰 搜寻零钱",
                        cls: "",
                        action: () => {
                            const found = Math.floor(Math.random() * 3) + 1;
                            state.gold += found;
                            addMsg(
                                "system",
                                `你在角落里找到了 ${found} 枚铜币。`,
                            );
                            renderLocation();
                            advanceTime();
                            showMainActions();
                        },
                    },
                ];

                // Movement buttons
                for (const target of canMove[state.location] || []) {
                    const tLoc = LOCATIONS[target];
                    btns.push({
                        label: `🚶 前往 ${tLoc.name}`,
                        cls: "primary",
                        action: () => {
                            state.location = target;
                            state.talkingTo = null;
                            renderLocation();
                            renderNPCCards();
                            addMsg("narrator", `你来到了 ${tLoc.name}。`);
                            addMsg("system", tLoc.desc);
                            advanceTime();
                            showMainActions();
                        },
                    });
                }

                // NPC talk buttons
                for (const id of loc.npcs) {
                    const npc = NPCS[id];
                    btns.push({
                        label: `💬 和 ${npc.name} 聊聊`,
                        cls: "",
                        action: () => {
                            openNpcDialog(id);
                        },
                    });
                }

                // Rest
                if (state.time === "夜晚") {
                    btns.push({
                        label: "🌙 休息到天亮",
                        cls: "special",
                        action: () => {
                            addMsg(
                                "important",
                                "🌙 你找了间客栈住下，沉沉睡去……",
                            );
                            addMsg("narrator", "新的一天开始了。");
                            state.time = "清晨";
                            state.day++;
                            // Random event
                            const events = [
                                "窗外传来急促的敲门声——有人出事了。",
                                "你闻到了烤面包的香气。今天会是平静的一天。",
                                "梦见了那片迷雾笼罩的森林。有什么在呼唤你。",
                                "你听到酒馆里传来激烈的争吵声。",
                            ];
                            addMsg(
                                "narrator",
                                events[state.day % events.length],
                            );
                            renderLocation();
                            advanceTime();
                            showMainActions();
                        },
                    });
                }

                setActions("◈ 你要做什么？", btns);
            }

            // ============================================================
            //  START GAME
            // ============================================================

            function startGame() {
                document.getElementById("introOverlay").classList.add("hidden");

                addMsg("narrator", "✦ 世界推演引擎 · 边境小镇「埃尔多雷」 ✦");
                addMsg(
                    "narrator",
                    "你是一个流浪的旅人，带着行囊和一颗好奇心，来到了这个偏僻的边境小镇。",
                );
                addMsg(
                    "system",
                    "你站在镇中心广场上。秋日的阳光温和，远处传来铁匠铺的敲打声。",
                );
                addMsg(
                    "system",
                    "提示：点击右侧 NPC 卡片可快速对话。每个选择都会影响他们对你的态度。",
                );

                renderLocation();
                renderNPCCards();
                showMainActions();
            }

            // ============================================================
            //  QUICK TALK FROM NPC CARD
            // ============================================================

            function talkToNpc(id) {
                if (state.talkingTo === id) return;
                // Check if NPC is in current location
                const loc = LOCATIONS[state.location];
                if (!loc.npcs.includes(id)) {
                    addMsg("system", NPCS[id].name + " 不在这里。");
                    return;
                }
                openNpcDialog(id);
            }
        </script>
    </body>
</html>
