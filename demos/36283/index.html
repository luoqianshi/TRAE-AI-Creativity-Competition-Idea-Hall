<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>思聊</title>
<style>
:root {
  --bg: #f5f5f7; --bg-elevated: #ffffff; --card: #ffffff; --card-hover: #f0f0f2;
  --text: #1d1d1f; --text-secondary: #6e6e73; --text-tertiary: #86868b; --text-quaternary: #aeaeb2;
  --bubble-user: #007aff; --bubble-user-text: #ffffff; --bubble-ai: #e9e9ed; --bubble-ai-text: #1d1d1f;
  --accent: #007aff; --accent-dim: rgba(0,122,255,0.10); --accent-glow: rgba(0,122,255,0.18);
  --border: rgba(60,60,67,0.12); --border-subtle: rgba(60,60,67,0.06); --overlay: rgba(0,0,0,0.36);
  --shadow-xs: 0 0.5px 0.5px rgba(0,0,0,0.02); --shadow-sm: 0 0.5px 0 0 rgba(0,0,0,0.03), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 2px 8px rgba(0,0,0,0.05), 0 12px 32px rgba(0,0,0,0.10);
  --shadow-float: 0 2px 8px rgba(0,0,0,0.06), 0 8px 28px rgba(0,0,0,0.10);
  --shadow-overlay: 0 0 0 0.5px rgba(0,0,0,0.06), 0 4px 20px rgba(0,0,0,0.14), 0 20px 60px rgba(0,0,0,0.18);
  --input-bg: #f2f2f7; --topbar-bg: rgba(245,245,247,0.72); --separator: rgba(60,60,67,0.12);
  --danger: #ff3b30; --danger-hover: #ff453a; --danger-bg: rgba(255,59,48,0.08); --success: #34c759; --online: #34c759;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 20px; --radius-2xl: 24px; --radius-full: 9999px;
  --spring: cubic-bezier(0.22, 0.58, 0.12, 1); --spring-smooth: cubic-bezier(0.32, 0.08, 0.24, 1);
}

[data-theme="dark"] {
  --bg: #000000; --bg-elevated: #1c1c1e; --card: #1c1c1e; --card-hover: #2c2c2e;
  --text: #f5f5f7; --text-secondary: #a1a1a6; --text-tertiary: #636366; --text-quaternary: #48484a;
  --bubble-user: #0a84ff; --bubble-user-text: #ffffff; --bubble-ai: #2c2c2e; --bubble-ai-text: #f5f5f7;
  --accent: #0a84ff; --accent-dim: rgba(10,132,255,0.14); --accent-glow: rgba(10,132,255,0.22);
  --border: rgba(255,255,255,0.12); --border-subtle: rgba(255,255,255,0.06); --overlay: rgba(0,0,0,0.60);
  --shadow-xs: 0 0.5px 0.5px rgba(0,0,0,0.12); --shadow-sm: 0 0.5px 0 0 rgba(0,0,0,0.16), 0 1px 2px rgba(0,0,0,0.20);
  --shadow-md: 0 1px 3px rgba(0,0,0,0.20), 0 4px 12px rgba(0,0,0,0.28);
  --shadow-lg: 0 2px 8px rgba(0,0,0,0.24), 0 12px 32px rgba(0,0,0,0.40);
  --shadow-float: 0 2px 8px rgba(0,0,0,0.24), 0 8px 28px rgba(0,0,0,0.36);
  --shadow-overlay: 0 0 0 0.5px rgba(255,255,255,0.04), 0 4px 20px rgba(0,0,0,0.32), 0 20px 60px rgba(0,0,0,0.48);
  --input-bg: #1c1c1e; --topbar-bg: rgba(0,0,0,0.72); --separator: rgba(255,255,255,0.12);
  --danger: #ff453a; --danger-hover: #ff6961; --danger-bg: rgba(255,69,58,0.10); --success: #30d158; --online: #30d158;
}

[data-theme="warmgold"] {
  --bg: #f7f3eb; --bg-elevated: #fefcf8; --card: #fefcf8; --card-hover: #f5efe3;
  --text: #2c2416; --text-secondary: #6b5e4a; --text-tertiary: #a89880; --text-quaternary: #d4c8b4;
  --bubble-user: #c9a96e; --bubble-user-text: #ffffff; --bubble-ai: #f5f0e5; --bubble-ai-text: #2c2416;
  --accent: #c9a96e; --accent-dim: rgba(201,169,110,0.12); --accent-glow: rgba(201,169,110,0.20);
  --border: rgba(44,36,22,0.10); --border-subtle: rgba(44,36,22,0.05); --overlay: rgba(44,36,22,0.30);
  --shadow-xs: 0 0.5px 0.5px rgba(44,36,22,0.02); --shadow-sm: 0 0.5px 0 0 rgba(44,36,22,0.02), 0 1px 2px rgba(44,36,22,0.03);
  --shadow-md: 0 1px 3px rgba(44,36,22,0.03), 0 4px 12px rgba(44,36,22,0.05);
  --shadow-lg: 0 2px 8px rgba(44,36,22,0.04), 0 12px 32px rgba(44,36,22,0.08);
  --shadow-float: 0 2px 8px rgba(44,36,22,0.05), 0 8px 28px rgba(44,36,22,0.08);
  --shadow-overlay: 0 0 0 0.5px rgba(44,36,22,0.04), 0 4px 20px rgba(44,36,22,0.10), 0 20px 60px rgba(44,36,22,0.14);
  --input-bg: #f5efe3; --topbar-bg: rgba(247,243,235,0.72); --separator: rgba(44,36,22,0.10);
  --danger: #d4a0a0; --danger-hover: #e0b8b8; --danger-bg: rgba(212,160,160,0.08); --success: #8cb89a; --online: #8cb89a;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { height:100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
  font-size:17px; font-weight:400; line-height:1.47059; letter-spacing:-0.022em; background:var(--bg); color:var(--text);
  height:100%; overflow:hidden; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
}

.screen { position:absolute; inset:0; display:flex; flex-direction:column; background:var(--bg); transition:opacity 0.45s var(--spring-smooth), transform 0.45s var(--spring-smooth); }
.screen.hidden { opacity:0; pointer-events:none; }
#charSelectScreen.hidden { transform:scale(0.97); }
#chatScreen { transform:translateX(100%); opacity:0; pointer-events:none; }
#chatScreen.active { transform:translateX(0); opacity:1; pointer-events:auto; }

.tab-bar { position:fixed; bottom:0; left:0; right:0; height:82px; padding:6px 0 20px; display:flex; align-items:flex-start; justify-content:space-around; background:var(--topbar-bg); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px); border-top:0.33px solid var(--separator); z-index:40; transition:transform 0.35s var(--spring-smooth); }
.tab-bar.hidden { transform:translateY(100%); }
.tab-item { display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; padding:4px 16px; border-radius:10px; transition:all 0.15s var(--spring); position:relative; border:none; background:transparent; color:var(--text-quaternary); font-family:inherit; }
.tab-item.active { color:var(--accent); }
.tab-item:active { transform:scale(0.94); }
.tab-item svg { width:22px; height:22px; }
.tab-item-label { font-size:10px; font-weight:500; letter-spacing:0.01em; }
.tab-item-badge { position:absolute; top:2px; right:12px; min-width:16px; height:16px; padding:0 4px; border-radius:8px; background:#ff3b30; color:#fff; font-size:10px; font-weight:600; line-height:16px; text-align:center; display:none; }
.tab-item-badge.show { display:block; }

.tab-content { display:none; flex:1; flex-direction:column; }
.tab-content.active { display:flex; }

.conv-list-screen { flex:1; display:flex; flex-direction:column; }
.conv-list-header { padding:12px 16px; flex-shrink:0; }
.conv-list-title { font-size:34px; font-weight:700; letter-spacing:-0.012em; color:var(--text); line-height:1.18; }
.conv-list-subtitle { font-size:13px; font-weight:400; color:var(--text-tertiary); letter-spacing:-0.01em; margin-top:4px; }
.conv-list-scroll { flex:1; overflow-y:auto; overscroll-behavior:contain; }
.conv-list-item { display:flex; align-items:center; gap:12px; padding:10px 16px; cursor:pointer; transition:background 0.15s ease; border-bottom:0.33px solid var(--separator); }
.conv-list-item:hover { background:var(--card-hover); }
.conv-list-item:active { background:var(--card-active); }
.conv-list-avatar { width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:26px; background:var(--card); flex-shrink:0; position:relative; }
.conv-list-info { flex:1; min-width:0; }
.conv-list-name { font-size:17px; font-weight:590; letter-spacing:-0.01em; color:var(--text); }
.conv-list-preview { font-size:14px; font-weight:400; color:var(--text-tertiary); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.conv-list-meta { display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0; }
.conv-list-time { font-size:12px; font-weight:400; color:var(--text-quaternary); }
.conv-list-unread { min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:#ff3b30; color:#fff; font-size:11px; font-weight:600; line-height:20px; text-align:center; display:none; }
.conv-list-unread.show { display:block; }
.conv-list-empty { text-align:center; padding:60px 20px; color:var(--text-tertiary); font-size:15px; }

.discover-screen { flex:1; display:flex; flex-direction:column; }
.discover-header { padding:16px; flex-shrink:0; }
.discover-title { font-size:34px; font-weight:700; letter-spacing:-0.012em; color:var(--text); line-height:1.18; }
.discover-desc { font-size:13px; font-weight:400; color:var(--text-tertiary); margin-top:4px; }
.discover-scroll { flex:1; overflow-y:auto; overscroll-behavior:contain; padding-bottom:20px; }
.discover-section { padding:0 16px; margin-bottom:24px; }
.discover-section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.discover-section-title { font-size:15px; font-weight:600; color:var(--text); }
.discover-section-more { font-size:12px; font-weight:400; color:var(--text-tertiary); cursor:pointer; }

.discover-char-scroll { display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; -ms-overflow-style:none; scrollbar-width:none; }
.discover-char-scroll::-webkit-scrollbar { display:none; }
.discover-char-card { flex-shrink:0; width:130px; background:var(--card); border-radius:var(--radius-xl); border:0.33px solid var(--border); padding:16px 12px; text-align:center; cursor:pointer; transition:all 0.2s var(--spring); }
.discover-char-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); }
.discover-char-card:active { transform:scale(0.97); }
.discover-char-avatar { width:48px; height:48px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:24px; background:var(--bg); margin-bottom:8px; }
.discover-char-name { font-size:13px; font-weight:590; color:var(--text); margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.discover-char-tag { font-size:10px; font-weight:400; color:var(--text-quaternary); margin-bottom:6px; }
.discover-char-stat { font-size:10px; color:var(--text-tertiary); }

.discover-conv-list { display:flex; flex-direction:column; gap:8px; }
.discover-conv-item { background:var(--card); border-radius:var(--radius-lg); border:0.33px solid var(--border); padding:14px; cursor:pointer; transition:all 0.2s var(--spring); }
.discover-conv-item:hover { background:var(--card-hover); }
.discover-conv-item:active { transform:scale(0.98); }
.discover-conv-top { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.discover-conv-avatars { display:flex; align-items:center; }
.discover-conv-avatars span { width:24px; height:24px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:12px; background:var(--bg); border:0.33px solid var(--border); }
.discover-conv-avatars span:last-child { margin-left:-6px; }
.discover-conv-meta { font-size:11px; font-weight:500; color:var(--text-secondary); }
.discover-conv-preview { font-size:12px; font-weight:400; color:var(--text-tertiary); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.discover-conv-tags { display:flex; gap:6px; margin-top:8px; }
.discover-conv-tag { font-size:10px; padding:2px 8px; border-radius:10px; background:var(--bg); color:var(--text-tertiary); }

.discover-template-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; }
.discover-template-card { background:var(--card); border-radius:var(--radius-lg); border:0.33px solid var(--border); padding:16px; cursor:pointer; transition:all 0.2s var(--spring); }
.discover-template-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); }
.discover-template-card:active { transform:scale(0.97); }
.discover-template-icon { font-size:28px; margin-bottom:8px; }
.discover-template-name { font-size:13px; font-weight:590; color:var(--text); margin-bottom:2px; }
.discover-template-desc { font-size:11px; font-weight:400; color:var(--text-tertiary); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

.mine-screen { flex:1; display:flex; flex-direction:column; overflow-y:auto; }
.mine-header { padding:40px 20px 24px; display:flex; align-items:center; gap:16px; }
.mine-avatar { width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:32px; background:var(--card); border:0.5px solid var(--border); flex-shrink:0; }
.mine-info { flex:1; }
.mine-name { font-size:22px; font-weight:700; letter-spacing:-0.012em; color:var(--text); }
.mine-bio { font-size:13px; font-weight:400; color:var(--text-tertiary); margin-top:4px; line-height:1.4; }
.mine-section { padding:4px 16px; }
.mine-section-title { font-size:11px; font-weight:600; color:var(--text-quaternary); text-transform:uppercase; letter-spacing:0.05em; padding:8px 4px 4px; }
.mine-item { display:flex; align-items:center; justify-content:space-between; padding:14px 12px; background:var(--card); border-radius:var(--radius-md); cursor:pointer; transition:background 0.15s ease; margin-bottom:1px; }
.mine-item:hover { background:var(--card-hover); }
.mine-item:active { background:var(--card-active); }
.mine-item-left { display:flex; align-items:center; gap:10px; }
.mine-item-icon { width:28px; height:28px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:14px; }
.mine-item-label { font-size:16px; font-weight:400; color:var(--text); }
.mine-item-arrow { font-size:16px; color:var(--text-quaternary); }

.mine-top-chars { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; -ms-overflow-style:none; scrollbar-width:none; }
.mine-top-chars::-webkit-scrollbar { display:none; }
.mine-top-char-card { flex-shrink:0; display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--card); border-radius:var(--radius-lg); border:0.33px solid var(--border); cursor:pointer; transition:all 0.15s var(--spring); }
.mine-top-char-card:hover { background:var(--card-hover); }
.mine-top-char-card:active { transform:scale(0.97); }
.mine-top-char-avatar { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; background:var(--bg); flex-shrink:0; }
.mine-top-char-name { font-size:12px; font-weight:500; color:var(--text); white-space:nowrap; }
.mine-top-char-count { font-size:10px; color:var(--text-tertiary); }

.msg-time { font-size:11px; font-weight:400; color:var(--text-quaternary); margin-bottom:2px; padding:0 4px; }
.msg-read { font-size:10px; font-weight:400; color:var(--text-quaternary); text-align:right; margin-top:2px; padding:0 4px; }

.char-info-overlay { position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.25s ease; }
.char-info-overlay.show { opacity:1; pointer-events:auto; }
.char-info-mask { position:absolute; inset:0; background:rgba(0,0,0,0.3); }
.char-info-card { position:relative; background:var(--bg-elevated); border-radius:var(--radius-xl); width:300px; padding:28px 24px; text-align:center; box-shadow:var(--shadow-overlay); transform:translateY(20px); transition:transform 0.35s var(--spring); }
.char-info-overlay.show .char-info-card { transform:translateY(0); }
.char-info-avatar { width:72px; height:72px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:36px; background:var(--card); border:0.5px solid var(--border); margin-bottom:12px; }
.char-info-name { font-size:20px; font-weight:700; color:var(--text); margin-bottom:4px; }
.char-info-desc { font-size:13px; font-weight:400; color:var(--text-tertiary); line-height:1.5; margin-bottom:16px; }
.char-info-actions { display:flex; gap:8px; justify-content:center; }
.char-info-btn { padding:8px 20px; border-radius:20px; border:0.5px solid var(--border); background:var(--card); font-size:14px; font-weight:500; color:var(--text); cursor:pointer; transition:all 0.15s var(--spring); font-family:inherit; }
.char-info-btn:hover { background:var(--card-hover); }
.char-info-btn.primary { background:var(--accent); color:#fff; border:none; }
.char-info-btn.primary:hover { opacity:0.9; }

.char-select-container { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; padding-bottom:20px; }
.char-select-title { font-size:34px; font-weight:700; letter-spacing:-0.012em; margin-bottom:8px; color:var(--text); line-height:1.18; }
.char-select-subtitle { font-size:15px; font-weight:400; color:var(--text-tertiary); letter-spacing:-0.01em; margin-bottom:20px; }

.carousel-wrapper { position:relative; width:100%; max-width:600px; }
.carousel-mask-left, .carousel-mask-right { position:absolute; top:-24px; bottom:-12px; width:108px; z-index:2; pointer-events:none; }
.carousel-mask-left { left:0; background:linear-gradient(to right, var(--bg) 0%, var(--bg) 12%, transparent 100%); }
.carousel-mask-right { right:0; background:linear-gradient(to left, var(--bg) 0%, var(--bg) 12%, transparent 100%); }
.carousel-track { display:flex; gap:32px; padding:48px 108px 24px; overflow-x:auto; scroll-behavior:smooth; cursor:grab; -ms-overflow-style:none; scrollbar-width:none; }
.carousel-track::-webkit-scrollbar { display:none; }
.carousel-track:active { cursor:grabbing; }

.char-card { display:flex; flex-direction:column; align-items:center; gap:12px; flex-shrink:0; cursor:pointer; transition:transform 0.25s var(--spring); padding:8px 4px; border-radius:var(--radius-xl); }
.char-card:hover { transform:translateY(-4px); }
.char-card:active { transform:scale(0.94); }

.char-avatar { width:88px; height:88px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:40px; background:var(--card); border:0.5px solid var(--border); box-shadow:var(--shadow-sm); transition:all 0.25s var(--spring); position:relative; }
.char-avatar::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg, rgba(255,255,255,0.5) 0%, transparent 50%, rgba(0,0,0,0.02) 100%); border-radius:inherit; pointer-events:none; }
.char-avatar::after { content:''; position:absolute; inset:0; border-radius:inherit; box-shadow:inset 0 0.5px 0 0 rgba(255,255,255,0.5), inset 0 -0.5px 0 0 rgba(0,0,0,0.04); pointer-events:none; }
.char-avatar.frame-square { border-radius:20px; }
.char-avatar.frame-ring { border-radius:50%; box-shadow:var(--shadow-sm), 0 0 0 3px var(--border); }
.char-avatar.frame-none { border-radius:50%; border:none; box-shadow:none; background:transparent; }
.char-avatar.frame-none::before, .char-avatar.frame-none::after { display:none; }
.char-avatar:hover { border-color:var(--accent); box-shadow:var(--shadow-md), 0 0 0 5px var(--accent-dim); transform:scale(1.04); }
.char-avatar.frame-ring:hover { box-shadow:var(--shadow-md), 0 0 0 3px var(--accent), 0 0 0 7px var(--accent-dim); transform:scale(1.04); }
.char-avatar.frame-none:hover { box-shadow:0 0 0 5px var(--accent-dim); transform:scale(1.04); }
.char-card:hover .char-avatar { transform:scale(1.04); }
.char-avatar.add-char { border:1.5px dashed var(--text-quaternary); background:transparent; color:var(--text-quaternary); font-size:36px; box-shadow:none; }
.char-avatar.add-char::before, .char-avatar.add-char::after { display:none; }
.char-avatar.add-char:hover { border-color:var(--accent); color:var(--accent); box-shadow:0 0 0 5px var(--accent-dim); transform:scale(1.04); }
.char-card:hover .char-avatar.add-char { transform:scale(1.04); }

.char-name { font-size:14px; font-weight:590; letter-spacing:-0.01em; color:var(--text); text-align:center; max-width:96px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

function setupCarouselScroll() {
  var w = document.getElementById('carouselWrapper'), t = document.getElementById('carouselTrack'), iv = null;
  w.addEventListener('mousemove', function(e) {
    var r = w.getBoundingClientRect(), x = e.clientX - r.left, ew = 100;
    if (x < ew) start(-(1 - x/ew)*5);
    else if (x > r.width - ew) start(((x - (r.width - ew))/ew)*5);
    else stop();
  });
  w.addEventListener('mouseleave', stop);
  function start(s) { if (iv) return; iv = setInterval(function() { t.scrollLeft += s; }, 16); }
  function stop() { if (iv) { clearInterval(iv); iv = null; } }
}

function closeConvManager() { hidePanel('conv'); }
function switchConversation(convId) { state.currentConvId = convId; closeConvManager(); renderMessages(); }
function deleteConversation(convId) {
  var convs = state.conversations[state.currentCharId];
  state.conversations[state.currentCharId] = convs.filter(function(c) { return c.id !== convId; });
  if (state.currentConvId === convId) {
    var remaining = state.conversations[state.currentCharId];
    state.currentConvId = remaining.length > 0 ? remaining[remaining.length-1].id : null;
  }
  renderMessages(); openConvManager();
}
function newConversation() {
  if (!state.currentCharId) return;
  var convs = state.conversations[state.currentCharId];
  var newId = 'conv_' + state.currentCharId + '_' + Date.now();
  var conv = { id:newId, characterId:state.currentCharId, title:'新对话', messages:[], createdAt:Date.now(), updatedAt:Date.now() };
  convs.push(conv); state.currentConvId = newId;
  renderMessages();
}

function showPanel(type) {
  var mask, panel;
  if (type === 'settings') { mask = document.getElementById('settingsMask'); panel = document.getElementById('settingsPanel'); }
  else if (type === 'conv') { mask = document.getElementById('convMask'); panel = document.getElementById('convPanel'); }
  else if (type === 'charEdit') { mask = document.getElementById('charEditMask'); panel = document.getElementById('charEditPanel'); }
  mask.classList.add('visible'); panel.classList.add('visible');
}
function hidePanel(type) {
  var mask, panel;
  if (type === 'settings') { mask = document.getElementById('settingsMask'); panel = document.getElementById('settingsPanel'); }
  else if (type === 'conv') { mask = document.getElementById('convMask'); panel = document.getElementById('convPanel'); }
  else if (type === 'charEdit') { mask = document.getElementById('charEditMask'); panel = document.getElementById('charEditPanel'); }
  mask.classList.remove('visible'); panel.classList.remove('visible');
}

}

function openCharEdit(charId) {
  state.editingCharId = charId || null;
  var title = document.getElementById('charEditTitle'), deleteBtn = document.getElementById('deleteCharBtn');
  if (charId) {
    var ch = state.characters.find(function(c) { return c.id === charId; });
    if (!ch) return;
    title.textContent = '编辑角色';
    document.getElementById('editCharName').value = ch.name;
    document.getElementById('editCharEmoji').value = ch.avatar.value;
    state.editingFrame = ch.avatar.frame;
    selectFrame(ch.avatar.frame);
    document.getElementById('editCharDesc').value = ch.description;
    document.getElementById('editCharPersona').value = ch.persona || '';
    document.getElementById('editCharTemplate').value = ch.presetTemplate || 'custom';
    deleteBtn.style.display = 'block';
  } else {
    title.textContent = '新建角色';
    document.getElementById('editCharName').value = '';
    document.getElementById('editCharEmoji').value = '😊';
    state.editingFrame = 'ring';
    selectFrame('ring');
    document.getElementById('editCharDesc').value = '';
    document.getElementById('editCharPersona').value = '';
    document.getElementById('editCharTemplate').value = 'gentle';
    deleteBtn.style.display = 'none';
  }
  showPanel('charEdit');

function openNewChar() { openCharEdit(null); }
function closeCharEdit() { hidePanel('charEdit'); }

function selectFrame(frame) {
  state.editingFrame = frame;
  document.querySelectorAll('.frame-option').forEach(function(o) { o.classList.toggle('active', o.dataset.frame === frame); });
}

function saveChar() {
  var name = document.getElementById('editCharName').value.trim();
  var emoji = document.getElementById('editCharEmoji').value.trim();
  if (!name) { alert('请输入角色名称'); return; }
  if (!emoji) { emoji = '😊'; }
  var data = {
    name: name,
    avatar: { type:'emoji', value:emoji, frame:state.editingFrame },
    description: document.getElementById('editCharDesc').value.trim(),
    persona: document.getElementById('editCharPersona').value.trim(),
    presetTemplate: document.getElementById('editCharTemplate').value
  };
  if (state.editingCharId) {
    var idx = state.characters.findIndex(function(c) { return c.id === state.editingCharId; });
    if (idx >= 0) { state.characters[idx] = Object.assign({}, state.characters[idx], data); }
  } else {
    var newId = 'char_' + Date.now();
    state.characters.push(Object.assign({ id:newId }, data));
  }
  closeCharEdit();
  renderCharSelect();
  if (state.currentCharId && state.editingCharId === state.currentCharId) {
    var ch = getCurrentChar();
    document.getElementById('chatTopbarAvatar').textContent = ch.avatar.value;
    document.getElementById('chatTopbarAvatar').className = 'chat-topbar-avatar frame-'+ch.avatar.frame;
    document.getElementById('chatTopbarName').textContent = ch.name;
  }
}

function deleteCurrentChar() {
  if (!state.editingCharId) return;
  if (!confirm('确定要删除这个角色吗？相关的对话记录也会被删除。')) return;
  state.characters = state.characters.filter(function(c) { return c.id !== state.editingCharId; });
  delete state.conversations[state.editingCharId];
  if (state.currentCharId === state.editingCharId) { state.currentCharId = null; state.currentConvId = null; }
  closeCharEdit(); renderCharSelect();
  if (!state.currentCharId) goBackToCharSelect();
}

function timeAgo(ts) {
  var d = (Date.now() - ts) / 1000;
  if (d < 60) return '刚刚';
  if (d < 3600) return Math.floor(d/60) + ' 分钟前';
  if (d < 86400) return Math.floor(d/3600) + ' 小时前';
  return Math.floor(d/86400) + ' 天前';
}

function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.tab-item').forEach(function(t) { t.classList.remove('active'); });
  var content = document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1));
  if (content) content.classList.add('active');
  var btn = document.querySelector('.tab-item[data-tab="' + tab + '"]');
  if (btn) btn.classList.add('active');
  if (tab === 'chars') renderCharSelect();
  if (tab === 'discover') renderDiscover();
  if (tab === 'mine') renderMineTopChars();
}

function formatTime(ts) {
  var now = Date.now(), diff = now - ts;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
  if (diff < 172800000) return '昨天';
  var d = new Date(ts);
  return (d.getMonth() + 1) + '/' + d.getDate();
}

function formatMsgTime(ts) {
  var d = new Date(ts);
  return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}

function getTotalUnread() {
  var total = 0;
  for (var k in state.unreadCounts) { total += state.unreadCounts[k] || 0; }
  return total;
}

function updateTabBadge() {
  var total = getTotalUnread();
  var badge = document.getElementById('tabBadgeChars');
  if (total > 0) {
    badge.textContent = total > 99 ? '99+' : total;
    badge.classList.add('show');
  } else {
    badge.classList.remove('show');
  }
}

function renderConvList() {
  var scroll = document.getElementById('convListScroll');
  var items = [];
  for (var charId in state.conversations) {
    var convs = state.conversations[charId];
    if (!convs || convs.length === 0) continue;
    var ch = state.characters.find(function(c) { return c.id === charId; });
    if (!ch) continue;
    convs.forEach(function(conv) {
      if (conv.messages.length === 0) return;
      items.push({ charId: charId, convId: conv.id, title: conv.title, avatar: ch.avatar, name: ch.name, updatedAt: conv.updatedAt, lastMsg: conv.messages[conv.messages.length-1], unread: state.unreadCounts[charId] || 0 });
    });
  }
  items.sort(function(a, b) { return b.updatedAt - a.updatedAt; });
  document.getElementById('convListCount').textContent = items.length + ' 个对话';
  if (items.length === 0) {
    scroll.innerHTML = '<div class="conv-list-empty">还没有对话，去「角色」页开始聊天吧</div>';
    return;
  }
  var h = '';
  items.forEach(function(item) {
    var lastContent = item.lastMsg.content.slice(0, 30) + (item.lastMsg.content.length > 30 ? '…' : '');
    var unreadHtml = '';
    if (item.unread > 0) {
      unreadHtml = '<span class="conv-list-unread show">' + (item.unread > 99 ? '99+' : item.unread) + '</span>';
    }
    h += '<div class="conv-list-item" onclick="enterChatFromList(\'' + item.charId + '\',\'' + item.convId + '\')"><div class="conv-list-avatar frame-' + item.avatar.frame + '">' + item.avatar.value + '</div><div class="conv-list-info"><div class="conv-list-name">' + esc(item.name) + '</div><div class="conv-list-preview">' + esc(lastContent) + '</div></div><div class="conv-list-meta"><span class="conv-list-time">' + formatTime(item.updatedAt) + '</span>' + unreadHtml + '</div></div>';
  });
  scroll.innerHTML = h;
}

function renderMineTopChars() {
  var chars = state.characters.map(function(c) {
    var convs = state.conversations[c.id] || [];
    var msgCount = 0;
    convs.forEach(function(cv) { msgCount += cv.messages.length; });
    return { id:c.id, name:c.name, avatar:c.avatar, msgCount:msgCount };
  }).filter(function(c) { return c.msgCount > 0; }).sort(function(a, b) { return b.msgCount - a.msgCount; });
  var container = document.getElementById('mineTopChars');
  if (chars.length === 0) {
    container.innerHTML = '<div style="font-size:12px;color:var(--text-tertiary);padding:4px 0;">还没有聊天记录，去「角色」页开始对话吧</div>';
    return;
  }
  var h = '';
  chars.slice(0, 6).forEach(function(c) {
    h += '<div class="mine-top-char-card" onclick="switchTab(\'chars\');enterChat(\'' + c.id + '\')"><div class="mine-top-char-avatar frame-' + c.avatar.frame + '">' + c.avatar.value + '</div><div class="mine-top-char-name">' + esc(c.name) + '</div><div class="mine-top-char-count">' + c.msgCount + '条消息</div></div>';
  });
  container.innerHTML = h;
}

function enterChatFromList(charId, convId) {
  state.currentCharId = charId; state.currentConvId = convId;
  var ch = getCurrentChar();
  document.getElementById('chatTopbarAvatar').textContent = ch.avatar.value;
  document.getElementById('chatTopbarAvatar').className = 'chat-topbar-avatar frame-' + ch.avatar.frame;
  document.getElementById('chatTopbarName').textContent = ch.name;
  document.getElementById('chatTopbarStatus').textContent = '在线';
  document.getElementById('chatTopbarStatus').classList.remove('typing');
  state.unreadCounts[charId] = 0; state.unreadLastMsg[charId] = '';
  var cs = document.getElementById('charSelectScreen'), ct = document.getElementById('chatScreen');
  cs.classList.add('hidden'); ct.classList.remove('hidden');
  document.getElementById('tabBar').classList.add('hidden');
  requestAnimationFrame(function() { ct.classList.add('active'); });
  applyChatBackground();
  renderMessages(); renderCharSelect(); updateTabBadge(); document.getElementById('chatInput').focus();
}

function openCharInfo() {
  if (!state.currentCharId) return;
  var ch = getCurrentChar(); if (!ch) return;
  document.getElementById('charInfoAvatar').textContent = ch.avatar.value;
  document.getElementById('charInfoAvatar').className = 'char-info-avatar frame-' + ch.avatar.frame;
  document.getElementById('charInfoName').textContent = ch.name;
  document.getElementById('charInfoDesc').textContent = ch.description;
  document.getElementById('charInfoOverlay').classList.add('show');
}

function closeCharInfo() {
  document.getElementById('charInfoOverlay').classList.remove('show');
}

function switchChatBg(bg) {

function initEmojiPicker() {
  switchEmojiCategory('face', document.querySelector('.emoji-category-btn'));
  var grid = document.getElementById('emojiGrid');
  grid.onclick = function(e) {
    var btn = e.target.closest('.emoji-item');
    if (btn) {
      var emoji = decodeURIComponent(btn.getAttribute('data-emoji'));
      insertEmoji(emoji);
    }
  };
}

function switchEmojiCategory(cat, btn) {
  state.emojiCategory = cat;
  document.querySelectorAll('.emoji-category-btn').forEach(function(b) { b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  var grid = document.getElementById('emojiGrid'), emojis = Array.from(EMOJI_DATA[cat] || '');
  var h = '';
  emojis.forEach(function(emoji) {
    h += '<button class="emoji-item" data-emoji="' + encodeURIComponent(emoji) + '">' + emoji + '</button>';
  });
  grid.innerHTML = h;
}

function toggleEmojiPicker() {
  var picker = document.getElementById('emojiPicker');
  picker.classList.toggle('visible');
  if (picker.classList.contains('visible')) initEmojiPicker();
}

function insertEmoji(emoji) {
  var inp = document.getElementById('chatInput');
  inp.value += emoji; inp.focus();
  onInputChange();
}

function hideEmojiPicker() {
  document.getElementById('emojiPicker').classList.remove('visible');
}

function copyMessage(idx) {
  var conv = getCurrentConv(); if (!conv) return;
  var msg = conv.messages[idx]; if (!msg) return;
  navigator.clipboard.writeText(msg.content).then(function() {
    showToast('已复制到剪贴板');
  }).catch(function() {
    showToast('复制失败');
  });
}

function mockVoiceMsg(idx) {
  var conv = getCurrentConv(); if (!conv) return;
  var msg = conv.messages[idx]; if (!msg) return;
  showToast('🔊 正在朗读...');
}

function quoteMessage(idx) {
  var conv = getCurrentConv(); if (!conv) return;
  var msg = conv.messages[idx]; if (!msg) return;
  var inp = document.getElementById('chatInput');
  inp.value = '> ' + msg.content.slice(0, 60) + (msg.content.length > 60 ? '...' : '') + '\n\n' + inp.value;
  inp.focus(); onInputChange();
}

function forwardMessage(idx) {
  var conv = getCurrentConv(); if (!conv) return;
  var msg = conv.messages[idx]; if (!msg) return;
  showToast('📤 已转发到 ' + (state.characters[0] ? state.characters[0].name : '其他对话'));
}

function deleteMessage(idx) {
  var conv = getCurrentConv(); if (!conv) return;
  conv.messages.splice(idx, 1); conv.updatedAt = Date.now();
  renderMessages();
}

function toggleVoiceInput() {

    btn.classList.add('recording');

var toastTimer = null;
function showToast(msg) {
  var t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:200;background:var(--text);color:var(--bg);padding:10px 20px;border-radius:20px;font-size:14px;font-weight:500;letter-spacing:-0.01em;pointer-events:none;opacity:0;transition:opacity 0.25s ease;box-shadow:var(--shadow-float);white-space:nowrap;';
    document.body.appendChild(t);
  }
  t.textContent = msg; t.style.opacity = '1';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { t.style.opacity = '0'; }, 1800);
}

function init() {
  renderCharSelect(); setupCarouselScroll(); updateSendBtn(); applyChatBackground();
  renderDiscover(); renderMineTopChars(); updateTabBadge();
  document.addEventListener('click', function(e) {
    var picker = document.getElementById('emojiPicker');
    if (picker && picker.classList.contains('visible')) {
      if (!picker.contains(e.target) && e.target.closest('.toolbar-btn') === null) {
        picker.classList.remove('visible');
      }
    }
  });
}
init();
