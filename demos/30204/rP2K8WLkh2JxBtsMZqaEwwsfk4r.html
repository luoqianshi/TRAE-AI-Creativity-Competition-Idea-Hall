<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>答案之书 · 启动器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #EDE5E3;
  min-height: 100vh;
  color: #4A5568;
  overflow-x: hidden;
}

/* 柔和光晕背景 */
.glow-bg {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(ellipse 60% 50% at 20% 30%, rgba(110,135,176,0.15) 0%, transparent 70%),
    radial-gradient(ellipse 50% 40% at 80% 70%, rgba(183,121,158,0.12) 0%, transparent 70%),
    radial-gradient(ellipse 40% 50% at 50% 50%, rgba(178,193,214,0.1) 0%, transparent 70%);
  animation: glowMove 25s ease-in-out infinite alternate;
}

@keyframes glowMove {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(20px, -15px) scale(1.03); }
  100% { transform: translate(-10px, 10px) scale(1.01); }
}

/* 浮动装饰点 */
.dots {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}
.dot {
  position: absolute;
  width: 4px; height: 4px;
  background: rgba(110,135,176,0.3);
  border-radius: 50%;
  animation: floatDot 6s ease-in-out infinite;
}
.dot:nth-child(odd) {
  background: rgba(183,121,158,0.25);
}
@keyframes floatDot {
  0%, 100% { opacity: 0.2; transform: translateY(0); }
  50% { opacity: 0.6; transform: translateY(-15px); }
}

.container {
  position: relative;
  z-index: 1;
  max-width: 600px;
  margin: 0 auto;
  padding: 40px 20px;
}

/* 头部 */
header {
  text-align: center;
  margin-bottom: 40px;
  animation: fadeInDown 1s ease;
}

.book-emoji {
  font-size: 5rem;
  margin-bottom: 15px;
  display: block;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

header h1 {
  font-size: 2.2rem;
  font-weight: 700;
  margin-bottom: 8px;
  background: linear-gradient(90deg, #6E87B0, #B7799E, #B2C1D6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

header .subtitle {
  color: #8B7E8C;
  font-size: 1rem;
  letter-spacing: 3px;
}

/* 主卡片 */
.main-card {
  background: rgba(255,255,255,0.55);
  backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 40px;
  border: 1px solid rgba(110,135,176,0.15);
  box-shadow: 0 20px 60px rgba(110,135,176,0.1);
  animation: fadeInUp 1s ease 0.3s both;
}

/* 提问区域 */
.ask-section {
  text-align: center;
  padding: 30px 0;
}

.ask-section h2 {
  font-size: 1.4rem;
  margin-bottom: 10px;
  color: #4A5568;
}

.ask-section p {
  color: #8B7E8C;
  font-size: 0.9rem;
  margin-bottom: 30px;
}

/* 魔法按钮 */
.magic-btn {
  position: relative;
  display: inline-block;
  padding: 18px 70px;
  background: linear-gradient(135deg, #6E87B0, #B7799E);
  color: #fff;
  border: none;
  border-radius: 50px;
  font-size: 1.2rem;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 6px;
  overflow: hidden;
  transition: all 0.3s ease;
  box-shadow: 0 10px 30px rgba(110,135,176,0.3);
}

.magic-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 40px rgba(183,121,158,0.35);
}

.magic-btn:active {
  transform: translateY(0);
}

.magic-btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transition: left 0.5s;
}

.magic-btn:hover::before {
  left: 100%;
}

/* 结果区域 */
.result-area {
  display: none;
}

/* 答案卡片 */
.answer-box {
  background: linear-gradient(135deg, rgba(110,135,176,0.12), rgba(183,121,158,0.08));
  border-radius: 20px;
  padding: 35px;
  margin-bottom: 25px;
  border: 1px solid rgba(110,135,176,0.2);
  text-align: center;
  animation: fadeInScale 0.6s ease;
}

@keyframes fadeInScale {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

.answer-label {
  display: inline-block;
  padding: 6px 20px;
  background: rgba(110,135,176,0.15);
  border-radius: 20px;
  font-size: 0.8rem;
  color: #6E87B0;
  margin-bottom: 20px;
  letter-spacing: 2px;
}

.answer-text {
  font-size: 1.6rem;
  font-weight: 600;
  color: #4A5568;
  line-height: 1.6;
}

/* 输入区域 */
.input-area {
  margin-top: 25px;
}

.input-area h3 {
  font-size: 1.1rem;
  margin-bottom: 20px;
  color: #4A5568;
}

.input-group {
  margin-bottom: 18px;
}

.input-group label {
  display: block;
  color: #8B7E8C;
  font-size: 0.85rem;
  margin-bottom: 8px;
  padding-left: 5px;
}

.input-group textarea {
  width: 100%;
  padding: 16px;
  background: rgba(255,255,255,0.5);
  border: 1px solid rgba(110,135,176,0.2);
  border-radius: 14px;
  font-size: 0.95rem;
  color: #4A5568;
  min-height: 90px;
  font-family: inherit;
  resize: vertical;
  transition: all 0.3s ease;
}

.input-group textarea::placeholder {
  color: rgba(139,126,140,0.5);
}

.input-group textarea:focus {
  outline: none;
  border-color: #B7799E;
  background: rgba(255,255,255,0.7);
  box-shadow: 0 0 20px rgba(183,121,158,0.15);
}

/* 获取步骤按钮 */
.step-btn {
  display: block;
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, #DBBACB, #B7799E);
  color: #fff;
  border: none;
  border-radius: 14px;
  font-size: 1.1rem;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 2px;
  transition: all 0.3s ease;
  margin-top: 10px;
}

.step-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(183,121,158,0.3);
}

/* 步骤结果 */
.step-result {
  display: none;
  margin-top: 25px;
  padding: 30px;
  background: linear-gradient(135deg, rgba(219,186,203,0.2), rgba(183,121,158,0.1));
  border-radius: 20px;
  border: 1px solid rgba(219,186,203,0.4);
  animation: fadeInScale 0.6s ease;
}

.step-result h3 {
  color: #B7799E;
  font-size: 0.85rem;
  margin-bottom: 15px;
  letter-spacing: 2px;
}

.step-result .step-text {
  font-size: 1.2rem;
  color: #4A5568;
  line-height: 1.8;
  font-weight: 500;
}

.step-result .step-hint {
  margin-top: 18px;
  padding-top: 18px;
  border-top: 1px dashed rgba(110,135,176,0.2);
  color: #8B7E8C;
  font-size: 0.85rem;
  line-height: 1.6;
}

/* 重置按钮 */
.reset-btn {
  display: inline-block;
  padding: 12px 35px;
  background: transparent;
  color: #8B7E8C;
  border: 1px solid rgba(110,135,176,0.2);
  border-radius: 25px;
  font-size: 0.9rem;
  cursor: pointer;
  margin-top: 20px;
  transition: all 0.3s ease;
}

.reset-btn:hover {
  border-color: #B7799E;
  color: #B7799E;
  background: rgba(183,121,158,0.08);
}

/* 特性列表 */
.features {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  margin-top: 30px;
  animation: fadeInUp 1s ease 0.6s both;
}

.feature-item {
  text-align: center;
  padding: 20px 15px;
  background: rgba(255,255,255,0.4);
  border-radius: 16px;
  border: 1px solid rgba(110,135,176,0.1);
  transition: all 0.3s ease;
}

.feature-item:hover {
  background: rgba(255,255,255,0.6);
  transform: translateY(-3px);
  box-shadow: 0 10px 25px rgba(110,135,176,0.1);
}

.feature-item .icon {
  font-size: 2rem;
  margin-bottom: 8px;
}

.feature-item h4 {
  font-size: 0.85rem;
  color: #4A5568;
  margin-bottom: 4px;
}

.feature-item p {
  font-size: 0.75rem;
  color: #8B7E8C;
}

/* 底部 */
footer {
  text-align: center;
  margin-top: 40px;
  padding: 20px;
  color: #8B7E8C;
  font-size: 0.75rem;
  animation: fadeIn 1s ease 0.9s both;
}

/* 动画 */
@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-30px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* 粒子效果 */
.particle {
  position: fixed;
  width: 4px; height: 4px;
  background: #B7799E;
  border-radius: 50%;
  pointer-events: none;
  z-index: 2;
}

/* 响应式 */
@media (max-width: 480px) {
  header h1 { font-size: 1.8rem; }
  .main-card { padding: 25px; }
  .magic-btn { padding: 16px 50px; font-size: 1.1rem; }
  .features { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- 柔和光晕背景 -->
<div class="glow-bg"></div>

<!-- 浮动装饰点 -->
<div class="dots" id="dots"></div>

<div class="container">
  <header>
    <span class="book-emoji">&#128214;</span>
    <h1>答案之书 · 启动器</h1>
    <p class="subtitle">给自己一个开始的契机</p>
  </header>

  <div class="main-card">
    <!-- 提问区域 -->
    <div class="ask-section" id="askSection">
      <h2>心中默念你想做的事</h2>
      <p>深呼吸，专注思考，然后点击按钮</p>
      <button class="magic-btn" onclick="showResult()">问 一 问</button>
    </div>

    <!-- 结果区域 -->
    <div class="result-area" id="resultArea">
      <div class="answer-box">
        <div class="answer-label">&#128220; 答案之书</div>
        <div class="answer-text" id="answerText"></div>
      </div>

      <div class="input-area">
        <h3>&#128173; 记录你的想法</h3>
        <div class="input-group">
          <label>看到这个结果，你有什么想法？</label>
          <textarea id="thoughtInput" placeholder="这个答案让我想到..."></textarea>
        </div>
        <div class="input-group">
          <label>你目前考虑的点有哪些？</label>
          <textarea id="considerInput" placeholder="我担心时间不够 / 不知道从哪里开始..."></textarea>
        </div>
        <button class="step-btn" onclick="getStep()">获取最容易启动的一步</button>
      </div>

      <div class="step-result" id="stepResult">
        <h3>&#128640; 你的启动步骤</h3>
        <div class="step-text" id="stepText"></div>
        <div class="step-hint">
          &#10024; 这一步只需要5-10分钟，做完即可<br>
          不需要完美，只需要开始
        </div>
        <button class="reset-btn" onclick="resetAll()">再问一次</button>
      </div>
    </div>
  </div>

  <div class="features">
    <div class="feature-item">
      <div class="icon">&#127919;</div>
      <h4>零压力启动</h4>
      <p>不做任何指导</p>
    </div>
    <div class="feature-item">
      <div class="icon">&#128221;</div>
      <h4>记录与反思</h4>
      <p>写下内心想法</p>
    </div>
    <div class="feature-item">
      <div class="icon">&#9889;</div>
      <h4>最小行动</h4>
      <p>最容易的一步</p>
    </div>
    <div class="feature-item">
      <div class="icon">&#127775;</div>
      <h4>仪式感满满</h4>
      <p>点燃行动勇气</p>
    </div>
  </div>

  <footer>
    <p>本工具仅供娱乐与启发，最终行动由用户自主决定</p>
    <p>答案之书 · 启动器 - TRAE AI 创造力大赛参赛作品</p>
  </footer>
</div>

<script>
// 生成浮动装饰点
var dotsContainer = document.getElementById('dots');
for (var i = 0; i < 30; i++) {
  var dot = document.createElement('div');
  dot.className = 'dot';
  dot.style.left = Math.random() * 100 + '%';
  dot.style.top = Math.random() * 100 + '%';
  dot.style.animationDelay = Math.random() * 6 + 's';
  dot.style.animationDuration = (4 + Math.random() * 4) + 's';
  dot.style.width = (3 + Math.random() * 3) + 'px';
  dot.style.height = dot.style.width;
  dotsContainer.appendChild(dot);
}

var answers = [
  "现在就是最好的时机",
  "先迈出第一步，其他的交给时间",
  "相信你的直觉，它知道答案",
  "从小事做起，大事自然成",
  "不必等准备好，开始就是准备",
  "你的内心早已有了选择",
  "试试看，最坏不过是回到原点",
  "答案就在你眼前，只是需要行动",
  "今天不做，明天会后悔",
  "放下犹豫，直接开始",
  "你比想象中更有能力",
  "每一个伟大的开始都很小",
  "时机已至，无需再等",
  "做就是了，别想太多",
  "你的热情是最好的指南针",
  "先完成，再完美",
  "行动是最好的答案",
  "哪怕一小步，也是进步",
  "犹豫一万次，不如做一次",
  "开始本身就是胜利"
];

var steps = [
  "打开你的手机备忘录，写下这件事的三个关键词。只需要30秒。",
  "在搜索引擎里输入你的主题，点开搜索结果的第一条，快速浏览一下。",
  "打开一个你常用的社交平台，搜索相关话题，看一条热门内容。",
  "找一张白纸，画出这件事的第一步应该做什么，哪怕只是一个箭头。",
  "给你的朋友发一条消息，说'我想做一件事'，不需要说具体是什么。",
  "打开一个相关APP或网站，注册一个账号，仅此而已。",
  "在购物网站搜索一下做这件事可能需要的工具，加入购物车（不用买）。",
  "设定一个5分钟的倒计时，在这5分钟里随便做点什么相关的事。",
  "打开语音备忘录，对着手机说出你的想法，说满1分钟。",
  "找一本相关的书或文章，只看目录和前言。",
  "在手机上新建一个文件夹，命名为你的项目名字。",
  "打开日历，为这件事预约一个30分钟的时间段。",
  "列出做这件事需要的三个资源，只列名字，不用去找。",
  "给你的微信置顶发一条消息：'我准备开始了'。",
  "打开一个空白文档，写下这件事的标题，保存关闭。"
];

function showResult() {
  createParticles(event);

  var randomAnswer = answers[Math.floor(Math.random() * answers.length)];
  document.getElementById('answerText').textContent = randomAnswer;
  document.getElementById('askSection').style.display = 'none';
  document.getElementById('resultArea').style.display = 'block';
}

function getStep() {
  var thought = document.getElementById('thoughtInput').value;
  var consider = document.getElementById('considerInput').value;

  if (!thought.trim() || !consider.trim()) {
    alert('请先填写你的想法和考虑点哦~');
    return;
  }

  var randomStep = steps[Math.floor(Math.random() * steps.length)];
  document.getElementById('stepText').textContent = randomStep;
  document.getElementById('stepResult').style.display = 'block';

  setTimeout(function() {
    document.getElementById('stepResult').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 100);
}

function resetAll() {
  document.getElementById('thoughtInput').value = '';
  document.getElementById('considerInput').value = '';
  document.getElementById('stepResult').style.display = 'none';
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('askSection').style.display = 'block';
}

function createParticles(e) {
  var btn = e.target;
  var rect = btn.getBoundingClientRect();
  var centerX = rect.left + rect.width / 2;
  var centerY = rect.top + rect.height / 2;

  for (var i = 0; i < 12; i++) {
    var particle = document.createElement('div');
    particle.className = 'particle';
    particle.style.left = centerX + 'px';
    particle.style.top = centerY + 'px';

    var angle = (Math.PI * 2 * i) / 12;
    var velocity = 80 + Math.random() * 60;
    var vx = Math.cos(angle) * velocity;
    var vy = Math.sin(angle) * velocity;

    document.body.appendChild(particle);

    var startTime = Date.now();
    function animate() {
      var elapsed = Date.now() - startTime;
      var progress = elapsed / 600;
      if (progress > 1) {
        particle.remove();
        return;
      }
      particle.style.left = (centerX + vx * progress) + 'px';
      particle.style.top = (centerY + vy * progress - 50 * progress * progress) + 'px';
      particle.style.opacity = 1 - progress;
      requestAnimationFrame(animate);
    }
    animate();
  }
}
</script>

</body>
</html>
