<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>今日吃啥 - 食堂选择困难症终结者</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #FF6B35;
      --primary-light: #FF8C5A;
      --secondary: #FFD23F;
      --bg: #FFF8F0;
      --card-bg: #FFFFFF;
      --text: #2D2D2D;
      --text-light: #666666;
      --shadow: 0 4px 20px rgba(255, 107, 53, 0.15);
      --radius: 16px;
    }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
      padding-bottom: 100px;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 20px 0 30px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      color: var(--text-light);
    }

    /* Canteen Selector */
    .canteen-selector {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .canteen-chip {
      padding: 8px 16px;
      border-radius: 20px;
      border: 2px solid #E0E0E0;
      background: white;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .canteen-chip:hover {
      border-color: var(--primary-light);
    }

    .canteen-chip.active {
      border-color: var(--primary);
      background: var(--primary);
      color: white;
    }

    /* Result Card */
    .result-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 30px;
      text-align: center;
      margin-bottom: 24px;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .result-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
    }

    .result-card.empty {
      background: linear-gradient(135deg, #FFF8F0 0%, #FFE8D6 100%);
    }

    .result-card .location {
      font-size: 13px;
      color: var(--text-light);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .result-card .shop-name {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .result-card .item-name {
      font-size: 16px;
      color: var(--primary);
      background: rgba(255, 107, 53, 0.1);
      padding: 6px 16px;
      border-radius: 20px;
      display: inline-block;
    }

    .result-card .placeholder {
      font-size: 16px;
      color: var(--text-light);
    }

    .result-card .placeholder-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    /* Spinning Animation */
    .spinning {
      animation: spin 0.1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .result-card.animate {
      animation: pulse 0.3s ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    /* Button */
    .btn-primary {
      width: 100%;
      padding: 18px;
      font-size: 18px;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4);
      margin-bottom: 32px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 107, 53, 0.5);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* Section */
    .section {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title .icon {
      font-size: 20px;
    }

    /* Recommendation */
    .recommendation {
      background: linear-gradient(135deg, #FFF8F0 0%, #FFE8D6 100%);
      border: 2px solid var(--secondary);
    }

    .recommendation .section-title {
      color: var(--primary);
    }

    .rec-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .rec-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: white;
      border-radius: 12px;
      transition: transform 0.2s ease;
    }

    .rec-item:hover {
      transform: translateX(4px);
    }

    .rec-rank {
      width: 28px;
      height: 28px;
      background: var(--secondary);
      color: var(--text);
      font-weight: 700;
      font-size: 14px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rec-info {
      flex: 1;
    }

    .rec-location {
      font-size: 12px;
      color: var(--text-light);
      margin-bottom: 2px;
    }

    .rec-shop {
      font-weight: 600;
      font-size: 15px;
      color: var(--text);
    }

    .rec-detail {
      font-size: 13px;
      color: var(--text-light);
    }

    .rec-score {
      font-size: 13px;
      color: var(--primary);
      font-weight: 600;
    }

    /* Ranking */
    .rank-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .rank-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: #FAFAFA;
      border-radius: 10px;
    }

    .rank-item:nth-child(1) .rank-num {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: white;
    }

    .rank-item:nth-child(2) .rank-num {
      background: linear-gradient(135deg, #C0C0C0, #A0A0A0);
      color: white;
    }

    .rank-item:nth-child(3) .rank-num {
      background: linear-gradient(135deg, #CD7F32, #B8860B);
      color: white;
    }

    .rank-num {
      width: 24px;
      height: 24px;
      background: #E0E0E0;
      color: var(--text);
      font-weight: 700;
      font-size: 12px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rank-info {
      flex: 1;
    }

    .rank-location {
      font-size: 11px;
      color: var(--text-light);
    }

    .rank-shop {
      font-weight: 600;
      font-size: 14px;
      color: var(--text);
    }

    .rank-count {
      font-size: 12px;
      color: var(--text-light);
    }

    .rank-badge {
      font-size: 11px;
      padding: 2px 8px;
      background: rgba(255, 107, 53, 0.1);
      color: var(--primary);
      border-radius: 10px;
      font-weight: 500;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 20px;
      color: var(--text-light);
      font-size: 14px;
    }

    /* Clear Button */
    .clear-btn {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      color: var(--text-light);
      background: transparent;
      border: 1px solid #E0E0E0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 12px;
    }

    .clear-btn:hover {
      background: #F5F5F5;
      color: var(--text);
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: var(--text-light);
    }

    /* Entrance Animation */
    .fade-in {
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.2s; }
    .stagger-3 { animation-delay: 0.3s; }
  </style>
</head>
<body>
  <div class="container">
    <header class="header fade-in">
      <h1>今日吃啥 🍜</h1>
      <p>食堂选择困难症终结者</p>
    </header>

    <div class="canteen-selector fade-in" id="canteenSelector">
      <button class="canteen-chip active" data-canteen="all">全校抽取</button>
    </div>

    <div class="result-card empty fade-in stagger-1" id="resultCard">
      <div class="placeholder">
        <div class="placeholder-icon">🎰</div>
        <div>点击下方按钮开始抽取</div>
      </div>
    </div>

    <button class="btn-primary fade-in stagger-2" id="pickBtn">开始抽取</button>

    <section class="section recommendation fade-in stagger-3">
      <h2 class="section-title"><span class="icon">🏆</span> 今日推荐</h2>
      <div class="rec-list" id="recList">
        <div class="empty-state">暂无推荐数据，多抽几次吧~</div>
      </div>
    </section>

    <section class="section fade-in stagger-3">
      <h2 class="section-title"><span class="icon">📊</span> 热门榜单</h2>
      <div class="rank-list" id="rankList">
        <div class="empty-state">还没有选择记录，快去抽取吧！</div>
      </div>
      <button class="clear-btn" id="clearBtn">清除历史记录</button>
    </section>

    <footer class="footer">
      <p>基于选择次数与评分智能推荐</p>
    </footer>
  </div>

  <script>
    // 食堂层级数据
    const canteens = [
      {
        id: 1,
        name: "第一食堂",
        floors: [
          {
            id: 1,
            name: "一楼",
            shops: [
              { id: 101, name: "川味麻辣烫", rating: 4.8, items: ["麻辣烫", "串串香", "冒菜"] },
              { id: 102, name: "黄焖鸡米饭", rating: 4.5, items: ["黄焖鸡", "鸡公煲", "黄焖排骨"] },
              { id: 103, name: "煎饼果子", rating: 4.7, items: ["原味煎饼", "加蛋煎饼", "双蛋煎饼"] }
            ]
          },
          {
            id: 2,
            name: "二楼",
            shops: [
              { id: 104, name: "兰州拉面", rating: 4.6, items: ["牛肉拉面", "刀削面", "炸酱面"] },
              { id: 105, name: "饺子馆", rating: 4.4, items: ["水饺", "蒸饺", "煎饺"] },
              { id: 106, name: "沙县小吃", rating: 4.1, items: ["拌面", "扁肉", "蒸饺"] }
            ]
          },
          {
            id: 3,
            name: "三楼",
            shops: [
              { id: 107, name: "自助快餐", rating: 4.2, items: ["各式小炒", "凉菜", "汤品"] },
              { id: 108, name: "广东烧腊", rating: 4.6, items: ["叉烧饭", "烧鸭饭", "白切鸡饭"] }
            ]
          }
        ]
      },
      {
        id: 2,
        name: "第二食堂",
        floors: [
          {
            id: 4,
            name: "一楼",
            shops: [
              { id: 201, name: "石锅拌饭", rating: 4.5, items: ["牛肉石锅", "猪肉石锅", "素石锅"] },
              { id: 202, name: "过桥米线", rating: 4.4, items: ["鸡肉米线", "牛肉米线", "鱼片米线"] }
            ]
          },
          {
            id: 5,
            name: "二楼",
            shops: [
              { id: 203, name: "重庆小面", rating: 4.7, items: ["豌杂面", "肥肠面", "牛肉面"] },
              { id: 204, name: "盖浇饭", rating: 4.3, items: ["番茄炒蛋盖饭", "鱼香肉丝盖饭", "红烧肉盖饭"] }
            ]
          }
        ]
      },
      {
        id: 3,
        name: "第三食堂",
        floors: [
          {
            id: 6,
            name: "一楼",
            shops: [
              { id: 301, name: "麻辣香锅", rating: 4.6, items: ["微辣", "中辣", "特辣"] },
              { id: 302, name: "花甲粉", rating: 4.5, items: ["花甲粉", "蛤蜊粉", "螺蛳粉"] }
            ]
          },
          {
            id: 7,
            name: "二楼",
            shops: [
              { id: 303, name: "酸菜鱼", rating: 4.8, items: ["酸菜鱼", "番茄鱼", "水煮鱼"] },
              { id: 304, name: "烤肉饭", rating: 4.4, items: ["烤肉饭", "鸡排饭", "牛肉饭"] }
            ]
          }
        ]
      }
    ];

    // 当前选择的食堂（null 表示全校）
    let selectedCanteen = 'all';

    // 本地存储键名
    const STORAGE_KEY = 'canteen_pick_history';

    // 获取所有店家
    function getAllShops() {
      const shops = [];
      canteens.forEach(canteen => {
        canteen.floors.forEach(floor => {
          floor.shops.forEach(shop => {
            shops.push({ ...shop, canteen, floor });
          });
        });
      });
      return shops;
    }

    // 获取可选的店家（根据当前选择的食堂）
    function getAvailableShops() {
      if (selectedCanteen === 'all') {
        return getAllShops();
      }
      const canteen = canteens.find(c => c.id === selectedCanteen);
      if (!canteen) return [];
      const shops = [];
      canteen.floors.forEach(floor => {
        floor.shops.forEach(shop => {
          shops.push({ ...shop, canteen, floor });
        });
      });
      return shops;
    }

    // 获取历史记录
    function getHistory() {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    }

    // 保存历史记录
    function saveHistory(history) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }

    // 添加选择记录
    function addPick(canteenId, floorId, shopId, item) {
      const history = getHistory();
      history.push({
        canteenId,
        floorId,
        shopId,
        item,
        timestamp: Date.now()
      });
      saveHistory(history);
    }

    // 统计选择次数
    function getSelectCount() {
      const history = getHistory();
      const countMap = {};
      history.forEach(record => {
        const key = `${record.shopId}-${record.item}`;
        countMap[key] = (countMap[key] || 0) + 1;
      });
      return countMap;
    }

    // 计算推荐列表
    function getRecommendations() {
      const countMap = getSelectCount();
      const allShops = getAllShops();

      // 为每个店家计算得分
      const shopScores = allShops.map(shop => {
        let totalCount = 0;
        shop.items.forEach(item => {
          const key = `${shop.id}-${item}`;
          totalCount += countMap[key] || 0;
        });
        return {
          shop,
          score: totalCount * shop.rating,
          totalCount
        };
      });

      // 按得分排序，取前三
      shopScores.sort((a, b) => b.score - a.score);
      return shopScores.slice(0, 3);
    }

    // 随机选择
    function randomPick() {
      const shops = getAvailableShops();
      const shop = shops[Math.floor(Math.random() * shops.length)];
      const item = shop.items[Math.floor(Math.random() * shop.items.length)];
      return { canteen: shop.canteen, floor: shop.floor, shop, item };
    }

    // 渲染食堂选择器
    function renderCanteenSelector() {
      const selector = document.getElementById('canteenSelector');
      let html = `<button class="canteen-chip ${selectedCanteen === 'all' ? 'active' : ''}" data-canteen="all">全校抽取</button>`;

      canteens.forEach(canteen => {
        html += `<button class="canteen-chip ${selectedCanteen === canteen.id ? 'active' : ''}" data-canteen="${canteen.id}">${canteen.name}</button>`;
      });

      selector.innerHTML = html;

      // 绑定点击事件
      selector.querySelectorAll('.canteen-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const canteenId = chip.dataset.canteen;
          selectedCanteen = canteenId === 'all' ? 'all' : parseInt(canteenId);

          // 更新激活状态
          selector.querySelectorAll('.canteen-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
        });
      });
    }

    // 渲染推荐列表
    function renderRecommendations() {
      const recList = document.getElementById('recList');
      const recommendations = getRecommendations();

      if (recommendations.length === 0 || recommendations[0].totalCount === 0) {
        recList.innerHTML = '<div class="empty-state">暂无推荐数据，多抽几次吧~</div>';
        return;
      }

      recList.innerHTML = recommendations.map((rec, index) => `
        <div class="rec-item">
          <span class="rec-rank">${index + 1}</span>
          <div class="rec-info">
            <div class="rec-location">${rec.shop.canteen.name} · ${rec.shop.floor.name}</div>
            <div class="rec-shop">${rec.shop.name}</div>
            <div class="rec-detail">评分 ${rec.shop.rating} · 已选 ${rec.totalCount} 次</div>
          </div>
          <span class="rec-score">${rec.score.toFixed(1)}分</span>
        </div>
      `).join('');
    }

    // 渲染排行榜
    function renderRanking() {
      const rankList = document.getElementById('rankList');
      const countMap = getSelectCount();

      // 转换并排序
      const allShops = getAllShops();
      const records = Object.entries(countMap)
        .map(([key, count]) => {
          const [shopId, item] = key.split('-');
          const shop = allShops.find(s => s.id === parseInt(shopId));
          if (!shop) return null;
          return { canteen: shop.canteen, floor: shop.floor, shop, item, count };
        })
        .filter(Boolean)
        .sort((a, b) => b.count - a.count)
        .slice(0, 5);

      if (records.length === 0) {
        rankList.innerHTML = '<div class="empty-state">还没有选择记录，快去抽取吧！</div>';
        return;
      }

      rankList.innerHTML = records.map((record, index) => `
        <div class="rank-item">
          <span class="rank-num">${index + 1}</span>
          <div class="rank-info">
            <div class="rank-location">${record.canteen.name} · ${record.floor.name}</div>
            <div class="rank-shop">${record.shop.name}</div>
            <div class="rank-count">${record.item} · ${record.count}次</div>
          </div>
          ${index < 3 ? '<span class="rank-badge">热门</span>' : ''}
        </div>
      `).join('');
    }

    // 显示抽取结果
    function showResult(canteen, floor, shop, item) {
      const card = document.getElementById('resultCard');
      card.classList.remove('empty');
      card.classList.add('animate');
      card.innerHTML = `
        <div class="location">${canteen.name} · ${floor.name}</div>
        <div class="shop-name">${shop.name}</div>
        <div class="item-name">${item}</div>
      `;

      setTimeout(() => {
        card.classList.remove('animate');
      }, 300);
    }

    // 动画抽取
    async function animatePick() {
      const btn = document.getElementById('pickBtn');
      const card = document.getElementById('resultCard');

      btn.disabled = true;
      btn.textContent = '抽取中...';

      // 快速切换显示
      let count = 0;
      const maxCount = 15;
      const interval = setInterval(() => {
        const { canteen, floor, shop, item } = randomPick();
        card.classList.add('spinning');
        card.classList.remove('empty');
        card.innerHTML = `
          <div class="location">${canteen.name} · ${floor.name}</div>
          <div class="shop-name">${shop.name}</div>
          <div class="item-name">${item}</div>
        `;
        count++;
      }, 80);

      // 停止动画并显示结果
      setTimeout(async () => {
        clearInterval(interval);
        card.classList.remove('spinning');

        const { canteen, floor, shop, item } = randomPick();
        showResult(canteen, floor, shop, item);
        addPick(canteen.id, floor.id, shop.id, item);

        btn.disabled = false;
        btn.textContent = '开始抽取';

        renderRecommendations();
        renderRanking();
      }, maxCount * 80);
    }

    // 清除历史
    function clearHistory() {
      if (confirm('确定要清除所有历史记录吗？')) {
        localStorage.removeItem(STORAGE_KEY);
        renderRecommendations();
        renderRanking();

        const card = document.getElementById('resultCard');
        card.classList.add('empty');
        card.innerHTML = `
          <div class="placeholder">
            <div class="placeholder-icon">🎰</div>
            <div>点击下方按钮开始抽取</div>
          </div>
        `;
      }
    }

    // 初始化
    renderCanteenSelector();
    document.getElementById('pickBtn').addEventListener('click', animatePick);
    document.getElementById('clearBtn').addEventListener('click', clearHistory);
    renderRecommendations();
    renderRanking();
  </script>
</body>
