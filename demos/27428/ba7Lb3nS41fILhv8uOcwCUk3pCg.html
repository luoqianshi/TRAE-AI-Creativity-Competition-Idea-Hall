<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>冰箱侦察兵</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body {
            background: #f2f7f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .app {
            background: #ffffff;
            border-radius: 36px;
            padding: 28px 22px 34px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 40, 30, 0.08);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #1a2e2a;
        }
        .header .badge {
            background: #e6f0ed;
            color: #1f6b5a;
            font-size: 11px;
            padding: 4px 14px;
            border-radius: 30px;
            font-weight: 500;
        }
        .subhead {
            color: #5f7a72;
            font-size: 14px;
            margin-bottom: 18px;
        }

        /* 拍照区域 */
        .scan-area {
            border: 2px dashed #b8d0c8;
            border-radius: 20px;
            padding: 24px 16px;
            text-align: center;
            background: #f8fbfa;
            margin-bottom: 18px;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .scan-area:active {
            transform: scale(0.97);
            background: #eef5f2;
        }
        .scan-area .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 4px;
        }
        .scan-area .main {
            font-weight: 600;
            color: #1a2e2a;
            font-size: 15px;
        }
        .scan-area .sub {
            font-size: 13px;
            color: #7a9a8f;
            margin-top: 2px;
        }
        .scan-area .hint {
            font-size: 12px;
            color: #9ab0a7;
            margin-top: 8px;
            background: #edf4f1;
            padding: 4px 14px;
            border-radius: 30px;
            display: inline-block;
        }
        .scanning {
            animation: pulse 1s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* 食材标签 */
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #1a2e2a;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .section-title .count {
            font-size: 12px;
            color: #7a9a8f;
            font-weight: 400;
        }
        .ingredient-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            min-height: 36px;
        }
        .ingredient-tags .tag {
            background: #eef5f2;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            color: #1a3a32;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .ingredient-tags .tag .del {
            cursor: pointer;
            color: #9ab0a7;
            font-size: 14px;
            transition: 0.2s;
        }
        .ingredient-tags .tag .del:active {
            color: #c0392b;
            transform: scale(1.2);
        }
        .ingredient-tags .tag.expiring {
            background: #fdf0e6;
            border: 1px solid #e8b88a;
        }

        /* 偏好筛选 */
        .pref-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .pref-bar .pref-btn {
            background: #f0f5f2;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            color: #4a6a5f;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
        }
        .pref-bar .pref-btn.active {
            background: #1a3a32;
            color: #fff;
        }
        .pref-bar .pref-btn:active {
            transform: scale(0.94);
        }

        /* 菜谱列表 */
        .recipe-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 18px;
            max-height: 320px;
            overflow-y: auto;
        }
        .recipe-item {
            background: #f8fbfa;
            border-radius: 16px;
            padding: 14px 16px;
            border-left: 4px solid #3a8a72;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .recipe-item .info .name {
            font-size: 15px;
            font-weight: 600;
            color: #1a2e2a;
        }
        .recipe-item .info .desc {
            font-size: 13px;
            color: #5f7a72;
            margin-top: 2px;
        }
        .recipe-item .info .match {
            font-size: 12px;
            color: #7a9a8f;
            margin-top: 2px;
        }
        .recipe-item .info .match .highlight {
            color: #2a7a5a;
            font-weight: 600;
        }
        .recipe-item .action-btn {
            background: #1a3a32;
            border: none;
            color: #fff;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .recipe-item .action-btn:active {
            transform: scale(0.94);
        }
        .recipe-item .action-btn.missing {
            background: #e8b88a;
            color: #3a2a1a;
        }

        /* 操作按钮 */
        .btn-group {
            display: flex;
            gap: 12px;
        }
        .btn-group .btn {
            flex: 1;
            padding: 13px 0;
            border: none;
            border-radius: 60px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .btn-group .btn:active {
            transform: scale(0.96);
        }
        .btn-group .btn-primary {
            background: #1a3a32;
            color: #fff;
        }
        .btn-group .btn-secondary {
            background: #eef5f2;
            color: #1a3a32;
        }
        .btn-group .btn-warning {
            background: #fdf0e6;
            color: #8a5a3a;
        }

        .footer-note {
            margin-top: 16px;
            font-size: 12px;
            color: #9ab0a7;
            text-align: center;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(26, 46, 42, 0.90);
            color: #fff;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 14px;
            opacity: 0;
            transition: 0.3s ease;
            pointer-events: none;
            backdrop-filter: blur(8px);
            white-space: nowrap;
            max-width: 90%;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <h1>🧊 冰箱侦察兵</h1>
        <span class="badge">v1.0 原型</span>
    </div>
    <div class="subhead">拍张照 · AI 告诉你今晚能吃什么</div>

    <!-- 拍照识别 -->
    <div class="scan-area" id="scanArea">
        <span class="icon">📸</span>
        <div class="main" id="scanMain">点击拍照 / 上传冰箱照片</div>
        <div class="sub" id="scanSub">AI 将自动识别冰箱里的食材</div>
        <div class="hint" id="scanHint">👆 点击模拟识别</div>
    </div>

    <!-- 食材列表 -->
    <div class="section-title">
        <span>🥬 识别出的食材</span>
        <span class="count" id="ingCount">0 种</span>
    </div>
    <div class="ingredient-tags" id="ingTags">
        <!-- 动态渲染 -->
    </div>

    <!-- 偏好筛选 -->
    <div class="section-title" style="margin-bottom:8px;">
        <span>🍳 筛选偏好</span>
    </div>
    <div class="pref-bar">
        <button class="pref-btn active" data-pref="all">📋 全部</button>
        <button class="pref-btn" data-pref="quick">⏱️ 快手 (< 20min)</button>
        <button class="pref-btn" data-pref="spicy">🌶️ 想吃辣</button>
        <button class="pref-btn" data-pref="healthy">🥗 清淡健康</button>
    </div>

    <!-- 菜谱推荐 -->
    <div class="section-title">
        <span>🍽️ AI 推荐菜谱</span>
        <span class="count" id="recipeCount">0 道</span>
    </div>
    <div class="recipe-list" id="recipeList">
        <!-- 动态渲染 -->
    </div>

    <!-- 操作 -->
    <div class="btn-group">
        <button class="btn btn-secondary" id="resetBtn">🔄 重置示例</button>
        <button class="btn btn-warning" id="expiryBtn">⏰ 临期提醒</button>
        <button class="btn btn-primary" id="addBtn">🛒 一键补购</button>
    </div>
    <div class="footer-note">点击「拍照」模拟 AI 识别，菜谱根据现有食材动态生成</div>
</div>

<div class="toast" id="toast"></div>

<script>
    // ---------- 数据 ----------
    const allIngredients = [
        { name: '鸡蛋', emoji: '🥚', expiring: false },
        { name: '西红柿', emoji: '🍅', expiring: false },
        { name: '豆腐', emoji: '🫘', expiring: true },
        { name: '胡萝卜', emoji: '🥕', expiring: false },
        { name: '卷心菜', emoji: '🥬', expiring: false },
        { name: '洋葱', emoji: '🧅', expiring: false },
        { name: '土豆', emoji: '🥔', expiring: true },
        { name: '青椒', emoji: '🫑', expiring: false },
        { name: '大蒜', emoji: '🧄', expiring: false },
        { name: '牛奶', emoji: '🥛', expiring: true },
        { name: '面粉', emoji: '🌾', expiring: false },
        { name: '鸡胸肉', emoji: '🍗', expiring: false },
    ];

    // 菜谱库
    const recipeDB = [
        { name: '西红柿炒鸡蛋', desc: '经典家常，酸甜开胃', match: 100, time: '15min', spicy: false, healthy: true,
            needs: ['鸡蛋', '西红柿'] },
        { name: '麻婆豆腐', desc: '麻辣鲜香，下饭神器', match: 80, time: '20min', spicy: true, healthy: false,
            needs: ['豆腐', '大蒜'], missing: ['豆瓣酱'] },
        { name: '卷心菜炒鸡蛋', desc: '清爽脆嫩，5分钟搞定', match: 90, time: '10min', spicy: false, healthy: true,
            needs: ['卷心菜', '鸡蛋'] },
        { name: '洋葱炒鸡蛋', desc: '甜香软嫩，营养早餐', match: 85, time: '10min', spicy: false, healthy: true,
            needs: ['洋葱', '鸡蛋'] },
        { name: '胡萝卜炒肉', desc: '清甜脆嫩，荤素搭配', match: 60, time: '20min', spicy: false, healthy: true,
            needs: ['胡萝卜', '鸡胸肉'], missing: ['酱油'] },
        { name: '土豆泥', desc: '奶香绵密，治愈系主食', match: 70, time: '25min', spicy: false, healthy: false,
            needs: ['土豆', '牛奶'] },
        { name: '青椒土豆丝', desc: '清脆爽口，百吃不腻', match: 85, time: '15min', spicy: false, healthy: true,
            needs: ['青椒', '土豆'] },
        { name: '蔬菜煎饼', desc: '随意搭配，清冰箱神器', match: 75, time: '15min', spicy: false, healthy: true,
            needs: ['面粉', '鸡蛋', '卷心菜'] },
        { name: '鸡蛋羹', desc: '嫩滑如布丁，老少皆宜', match: 95, time: '12min', spicy: false, healthy: true,
            needs: ['鸡蛋'] },
        { name: '韩式泡菜汤', desc: '酸辣暖胃，一人食刚好', match: 40, time: '20min', spicy: true, healthy: false,
            needs: ['豆腐'], missing: ['泡菜', '五花肉'] },
        { name: '蒜蓉西兰花', desc: '翠绿脆嫩，营养满分', match: 30, time: '12min', spicy: false, healthy: true,
            needs: ['大蒜'], missing: ['西兰花'] },
        { name: '鸡肉沙拉', desc: '低脂高蛋白，减脂餐', match: 50, time: '10min', spicy: false, healthy: true,
            needs: ['鸡胸肉', '卷心菜'], missing: ['沙拉酱'] },
    ];

    // ---------- 状态 ----------
    let currentIngredients = [];
    let currentPref = 'all';
    let toastTimer = null;

    // ---------- DOM ----------
    const scanArea = document.getElementById('scanArea');
    const scanMain = document.getElementById('scanMain');
    const scanSub = document.getElementById('scanSub');
    const scanHint = document.getElementById('scanHint');
    const ingTags = document.getElementById('ingTags');
    const ingCount = document.getElementById('ingCount');
    const recipeList = document.getElementById('recipeList');
    const recipeCount = document.getElementById('recipeCount');

    // ---------- Toast ----------
    function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
    }

    // ---------- 渲染 ----------
    function render() {
        // 食材
        if (currentIngredients.length === 0) {
            ingTags.innerHTML = '<span style="color:#9ab0a7;font-size:13px;">点击「拍照」识别冰箱里的食材</span>';
            ingCount.textContent = '0 种';
        } else {
            ingTags.innerHTML = currentIngredients.map(ing =>
                `<span class="tag ${ing.expiring ? 'expiring' : ''}">
                            ${ing.emoji} ${ing.name}
                            ${ing.expiring ? '⚠️' : ''}
                            <span class="del" data-name="${ing.name}">✕</span>
                        </span>`
            ).join('');
            ingCount.textContent = `${currentIngredients.length} 种`;
        }

        // 菜谱
        const matched = getMatchedRecipes();
        const filtered = filterRecipes(matched);
        recipeCount.textContent = `${filtered.length} 道`;

        if (filtered.length === 0) {
            recipeList.innerHTML =
                `<div style="text-align:center;padding:30px 0;color:#9ab0a7;font-size:14px;">🍽️ 当前条件下没有匹配的菜谱，试试调整偏好</div>`;
            return;
        }

        recipeList.innerHTML = filtered.map(r => {
            const hasAll = r.needs.every(n => currentIngredients.some(i => i.name === n));
            const missingItems = r.missing || [];
            const allMissing = missingItems.filter(m => !currentIngredients.some(i => i.name === m));
            const status = hasAll ? '✅ 现有食材' : `🛒 缺 ${allMissing.join('、')}`;
            const btnText = hasAll ? '👨‍🍳 做这道' : '🛒 补购';
            const btnClass = hasAll ? '' : 'missing';
            return `
                        <div class="recipe-item">
                            <div class="info">
                                <div class="name">${r.name}</div>
                                <div class="desc">${r.desc} · ⏱️ ${r.time}</div>
                                <div class="match">匹配度 <span class="highlight">${r.match}%</span> · ${status}</div>
                            </div>
                            <button class="action-btn ${btnClass}" data-name="${r.name}">${btnText}</button>
                        </div>
                    `;
        }).join('');

        // 绑定菜谱按钮事件
        document.querySelectorAll('.recipe-item .action-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const name = this.dataset.name;
                const recipe = recipeDB.find(r => r.name === name);
                if (this.classList.contains('missing')) {
                    const missingItems = recipe.missing || [];
                    const need = missingItems.filter(m => !currentIngredients.some(i => i.name === m));
                    showToast(`🛒 需要补购：${need.join('、')}，已加入购物清单`);
                } else {
                    showToast(`👨‍🍳 已选择「${name}」，开始做饭吧！`);
                }
            });
        });

        // 绑定删除食材事件
        document.querySelectorAll('.ingredient-tags .del').forEach(el => {
            el.addEventListener('click', function(e) {
                e.stopPropagation();
                const name = this.dataset.name;
                currentIngredients = currentIngredients.filter(i => i.name !== name);
                render();
                showToast(`已移除「${name}」`);
            });
        });
    }

    // ---------- 匹配逻辑 ----------
    function getMatchedRecipes() {
        if (currentIngredients.length === 0) return [];
        const names = currentIngredients.map(i => i.name);
        return recipeDB.map(r => {
            const has = r.needs.filter(n => names.includes(n));
            const match = Math.round((has.length / r.needs.length) * 100);
            return { ...r, match: Math.min(match, 100) };
        }).filter(r => r.match >= 30).sort((a, b) => b.match - a.match);
    }

    function filterRecipes(recipes) {
        if (currentPref === 'all') return recipes;
        if (currentPref === 'quick') return recipes.filter(r => parseInt(r.time) <= 20);
        if (currentPref === 'spicy') return recipes.filter(r => r.spicy);
        if (currentPref === 'healthy') return recipes.filter(r => r.healthy);
        return recipes;
    }

    // ---------- 模拟拍照识别 ----------
    function simulateScan() {
        scanMain.textContent = '🔍 AI 识别中...';
        scanSub.textContent = '正在分析冰箱里的食材';
        scanHint.textContent = '⏳ 请稍候...';
        scanArea.classList.add('scanning');

        setTimeout(() => {
            // 随机选取 5~8 种食材
            const count = 5 + Math.floor(Math.random() * 4);
            const shuffled = [...allIngredients].sort(() => Math.random() - 0.5);
            currentIngredients = shuffled.slice(0, count);

            scanMain.textContent = '✅ 识别完成！';
            scanSub.textContent = `发现 ${currentIngredients.length} 种食材`;
            scanHint.textContent = '👆 点击重新识别';
            scanArea.classList.remove('scanning');
            render();
            showToast(`📸 识别到 ${currentIngredients.length} 种食材，看看能做什么菜吧！`);
        }, 1500);
    }

    // ---------- 事件绑定 ----------
    scanArea.addEventListener('click', simulateScan);

    // 偏好筛选
    document.querySelectorAll('.pref-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.pref-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentPref = this.dataset.pref;
            render();
        });
    });

    // 重置
    document.getElementById('resetBtn').addEventListener('click', function() {
        currentIngredients = [
            { name: '鸡蛋', emoji: '🥚', expiring: false },
            { name: '西红柿', emoji: '🍅', expiring: false },
            { name: '豆腐', emoji: '🫘', expiring: true },
            { name: '胡萝卜', emoji: '🥕', expiring: false },
            { name: '卷心菜', emoji: '🥬', expiring: false },
        ];
        document.querySelectorAll('.pref-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('[data-pref="all"]').classList.add('active');
        currentPref = 'all';
        render();
        showToast('🔄 已重置为示例食材');
    });

    // 临期提醒
    document.getElementById('expiryBtn').addEventListener('click', function() {
        const expiring = currentIngredients.filter(i => i.expiring);
        if (expiring.length === 0) {
            showToast('🎉 没有临期食材，继续保持！');
        } else {
            showToast(`⚠️ 以下食材即将过期：${expiring.map(i => i.name).join('、')}，建议优先使用`);
        }
    });

    // 一键补购
    document.getElementById('addBtn').addEventListener('click', function() {
        if (currentIngredients.length === 0) {
            showToast('📸 请先拍照识别冰箱食材');
            return;
        }
        const allNeeds = new Set();
        const matched = getMatchedRecipes();
        matched.slice(0, 3).forEach(r => {
            r.needs.forEach(n => {
                if (!currentIngredients.some(i => i.name === n)) {
                    allNeeds.add(n);
                }
            });
        });
        if (allNeeds.size === 0) {
            showToast('🛒 现有食材已经够做很多菜了，不用补购！');
        } else {
            showToast(`🛒 推荐补购：${[...allNeeds].join('、')}，可解锁更多菜谱`);
        }
    });

    // ---------- 启动 ----------
    // 默认加载示例食材
    currentIngredients = [
        { name: '鸡蛋', emoji: '🥚', expiring: false },
        { name: '西红柿', emoji: '🍅', expiring: false },
        { name: '豆腐', emoji: '🫘', expiring: true },
        { name: '胡萝卜', emoji: '🥕', expiring: false },
        { name: '卷心菜', emoji: '🥬', expiring: false },
    ];
    render();
</script>
</body>
</html>
