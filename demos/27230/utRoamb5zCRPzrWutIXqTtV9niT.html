<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>孩子积分系统 Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #FFF4E6 0%, #FFE5D4 50%, #D4F1EA 100%);
    color: #3D3D3D;
    font-size: 14px;
    overflow: hidden;
  }
  .app {
    max-width: 420px;
    margin: 0 auto;
    height: 100vh;
    background: #FFF8F0;
    position: relative;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 30px rgba(255, 150, 80, 0.15);
  }
  /* ========== 顶部栏 ========== */
  .topbar {
    background: linear-gradient(135deg, #FF9966 0%, #FFB084 100%);
    color: #fff;
    padding: 16px 18px 18px;
    position: relative;
    box-shadow: 0 4px 14px rgba(255, 153, 102, 0.25);
  }
  .topbar .slogan { font-size: 12px; opacity: 0.9; letter-spacing: 1px; margin-bottom: 6px; }
  .topbar h1 { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
  .topbar .subtitle { font-size: 12px; opacity: 0.85; margin-top: 3px; }
  /* ========== 主内容 ========== */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    padding-bottom: 80px;
    -webkit-overflow-scrolling: touch;
  }
  .main::-webkit-scrollbar { width: 0; }
  /* ========== 卡片 ========== */
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 4px 14px rgba(255, 153, 102, 0.08);
    border: 1px solid rgba(255, 200, 160, 0.3);
  }
  .card-title {
    font-size: 15px;
    font-weight: 700;
    color: #4A3520;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-title .tag {
    font-size: 11px;
    padding: 2px 8px;
    background: #FFE5D4;
    color: #FF7A3D;
    border-radius: 10px;
    font-weight: 500;
  }
  /* ========== 孩子信息卡 ========== */
  .kid-card {
    background: linear-gradient(135deg, #FFB084 0%, #FF9966 100%);
    color: #fff;
    border-radius: 20px;
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 8px 20px rgba(255, 122, 61, 0.25);
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
  }
  .kid-card::before {
    content: '';
    position: absolute;
    right: -30px;
    top: -30px;
    width: 120px;
    height: 120px;
    background: rgba(255, 255, 255, 0.12);
    border-radius: 50%;
  }
  .kid-card::after {
    content: '';
    position: absolute;
    right: 20px;
    bottom: -40px;
    width: 80px;
    height: 80px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 50%;
  }
  .avatar {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    flex-shrink: 0;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    position: relative;
    z-index: 1;
  }
  .kid-info { flex: 1; position: relative; z-index: 1; }
  .kid-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .kid-meta { font-size: 12px; opacity: 0.9; }
  .kid-score {
    font-size: 13px;
    background: rgba(255,255,255,0.25);
    padding: 4px 10px;
    border-radius: 12px;
    margin-top: 6px;
    display: inline-block;
  }
  .kid-score b { font-size: 16px; font-weight: 700; }
  /* ========== 积分卡片 ========== */
  .score-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }
  .score-item {
    text-align: center;
    padding: 12px 6px;
    background: linear-gradient(135deg, #FFF4E6, #FFE5D4);
    border-radius: 12px;
  }
  .score-item .num { font-size: 22px; font-weight: 700; color: #FF7A3D; }
  .score-item.earn .num { color: #FF7A3D; }
  .score-item.use .num { color: #4AB8A1; }
  .score-item.balance .num { color: #E8A84C; }
  .score-item .lbl { font-size: 11px; color: #7A6650; margin-top: 2px; }
  /* ========== 进度 ========== */
  .progress-box { display: flex; align-items: center; gap: 12px; }
  .progress-ring {
    width: 64px; height: 64px;
    position: relative;
    flex-shrink: 0;
  }
  .progress-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .progress-ring .bg { fill: none; stroke: #FFE5D4; stroke-width: 8; }
  .progress-ring .fg { fill: none; stroke: #FF9966; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset .5s; }
  .progress-ring .pct {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    font-size: 14px; font-weight: 700; color: #FF7A3D;
  }
  .progress-text { flex: 1; }
  .progress-text .big { font-size: 16px; font-weight: 700; color: #4A3520; }
  .progress-text .small { font-size: 12px; color: #7A6650; margin-top: 4px; }
  /* ========== 快捷入口 ========== */
  .quick-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .quick-item {
    text-align: center;
    padding: 12px 4px;
    cursor: pointer;
    border-radius: 12px;
    transition: background .2s;
  }
  .quick-item:active { background: #FFF4E6; }
  .quick-icon {
    width: 44px; height: 44px;
    margin: 0 auto 6px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .quick-icon.c1 { background: #FFE5D4; }
  .quick-icon.c2 { background: #D4F1EA; }
  .quick-icon.c3 { background: #FFF2C4; }
  .quick-icon.c4 { background: #E0D4F5; }
  .quick-item .name { font-size: 12px; color: #4A3520; font-weight: 500; }
  /* ========== 动态 ========== */
  .feed-item {
    display: flex;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed #F5E6D3;
    align-items: flex-start;
  }
  .feed-item:last-child { border-bottom: none; }
  .feed-ico {
    width: 32px; height: 32px;
    border-radius: 10px;
    background: #FFE5D4;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .feed-body { flex: 1; }
  .feed-text { font-size: 13px; color: #4A3520; line-height: 1.5; }
  .feed-time { font-size: 11px; color: #B08C6A; margin-top: 3px; }
  .feed-score { font-size: 12px; font-weight: 700; color: #FF7A3D; flex-shrink: 0; }
  .feed-score.minus { color: #4AB8A1; }
  /* ========== 任务列表 ========== */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 8px 16px;
    background: #fff;
    border-radius: 20px;
    font-size: 13px;
    color: #7A6650;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    border: 1px solid transparent;
    transition: all .2s;
  }
  .tab.active {
    background: linear-gradient(135deg, #FF9966, #FF7A3D);
    color: #fff;
    box-shadow: 0 4px 10px rgba(255, 122, 61, 0.25);
  }
  .task-item {
    background: #fff;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    display: flex;
    gap: 12px;
    align-items: center;
    box-shadow: 0 3px 10px rgba(255, 153, 102, 0.08);
    border-left: 4px solid #FF9966;
  }
  .task-item.type-learn { border-left-color: #6BA8E3; }
  .task-item.type-life { border-left-color: #FF9966; }
  .task-item.type-sport { border-left-color: #4AB8A1; }
  .task-item.type-chore { border-left-color: #E8A84C; }
  .task-item.type-habit { border-left-color: #B892D9; }
  .task-ico {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    background: #FFF4E6;
    flex-shrink: 0;
  }
  .task-info { flex: 1; min-width: 0; }
  .task-name { font-size: 14px; font-weight: 600; color: #4A3520; margin-bottom: 4px; }
  .task-desc { font-size: 12px; color: #7A6650; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; }
  .task-meta { display: flex; gap: 8px; margin-top: 6px; }
  .task-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 8px;
    background: #FFF4E6;
    color: #FF7A3D;
    font-weight: 500;
  }
  .task-tag.score { background: #FFE5D4; }
  .task-tag.time { background: #FFF2C4; color: #B88A2E; }
  .btn-task {
    padding: 8px 14px;
    border-radius: 12px;
    border: none;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
    transition: all .2s;
    white-space: nowrap;
  }
  .btn-task.primary {
    background: linear-gradient(135deg, #FF9966, #FF7A3D);
    color: #fff;
    box-shadow: 0 4px 10px rgba(255, 122, 61, 0.25);
  }
  .btn-task.wait { background: #FFF2C4; color: #B88A2E; }
  .btn-task.done { background: #D4F1EA; color: #4AB8A1; }
  .btn-task.confirm { background: linear-gradient(135deg, #4AB8A1, #38998A); color: #fff; }
  /* ========== 浮动按钮 ========== */
  .fab {
    position: absolute;
    right: 18px;
    bottom: 86px;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #FF9966, #FF7A3D);
    color: #fff;
    font-size: 24px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255, 122, 61, 0.4);
    z-index: 10;
    display: flex; align-items: center; justify-content: center;
  }
  /* ========== 底部导航 ========== */
  .bottom-nav {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: #fff;
    display: flex;
    padding: 8px 0 12px;
    box-shadow: 0 -4px 14px rgba(255, 153, 102, 0.1);
    z-index: 20;
  }
  .nav-item {
    flex: 1;
    text-align: center;
    padding: 6px 0;
    cursor: pointer;
    color: #B08C6A;
    transition: color .2s;
  }
  .nav-item .ico { font-size: 20px; line-height: 1; }
  .nav-item .lbl { font-size: 11px; margin-top: 3px; font-weight: 500; }
  .nav-item.active { color: #FF7A3D; }
  /* ========== 表单 ========== */
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 13px; color: #7A6650; margin-bottom: 6px; display: block; font-weight: 500; }
  .form-input, .form-select, .form-textarea {
    width: 100%;
    padding: 12px 14px;
    background: #FFF8F0;
    border: 1.5px solid #FFE5D4;
    border-radius: 12px;
    font-size: 14px;
    color: #4A3520;
    outline: none;
    transition: border-color .2s;
    font-family: inherit;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: #FF9966;
  }
  .form-textarea { min-height: 80px; resize: vertical; }
  .form-row { display: flex; gap: 10px; }
  .form-row > div { flex: 1; }
  /* ========== 模板选择 ========== */
  .template-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .tpl-item {
    padding: 10px;
    background: #FFF8F0;
    border: 1.5px solid #FFE5D4;
    border-radius: 12px;
    cursor: pointer;
    font-size: 12px;
    text-align: center;
    transition: all .2s;
    color: #4A3520;
  }
  .tpl-item.selected {
    background: linear-gradient(135deg, #FFB084, #FF9966);
    color: #fff;
    border-color: #FF9966;
  }
  .tpl-item .s { font-size: 18px; display: block; margin-bottom: 4px; }
  .tpl-item .p { font-size: 10px; opacity: 0.8; margin-top: 2px; }
  /* ========== 按钮 ========== */
  .btn-primary {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #FF9966, #FF7A3D);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 14px rgba(255, 122, 61, 0.3);
    margin-top: 8px;
    letter-spacing: 2px;
  }
  .btn-primary:active { transform: scale(0.98); }
  .btn-secondary {
    width: 100%;
    padding: 12px;
    background: #fff;
    color: #FF7A3D;
    border: 1.5px solid #FF9966;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
  }
  /* ========== 奖励卡片 ========== */
  .reward-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .reward-card {
    background: #fff;
    border-radius: 16px;
    padding: 14px 12px;
    text-align: center;
    box-shadow: 0 4px 12px rgba(255, 153, 102, 0.08);
    position: relative;
    overflow: hidden;
    border: 2px solid transparent;
  }
  .reward-card.locked { opacity: 0.75; }
  .reward-ico {
    font-size: 40px;
    margin-bottom: 6px;
  }
  .reward-name { font-size: 14px; font-weight: 600; color: #4A3520; margin-bottom: 4px; }
  .reward-desc { font-size: 11px; color: #7A6650; line-height: 1.4; margin-bottom: 8px; min-height: 30px; }
  .reward-score { font-size: 13px; font-weight: 700; color: #FF7A3D; margin-bottom: 10px; }
  .reward-btn {
    width: 100%;
    padding: 8px;
    border: none;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
  }
  .reward-btn.ok { background: linear-gradient(135deg, #FF9966, #FF7A3D); color: #fff; }
  .reward-btn.locked { background: #FFF4E6; color: #B08C6A; }
  .reward-btn.wait { background: #FFF2C4; color: #B88A2E; }
  .reward-btn.done { background: #D4F1EA; color: #4AB8A1; }
  /* ========== 积分流水 ========== */
  .flow-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px dashed #F5E6D3;
  }
  .flow-item:last-child { border-bottom: none; }
  .flow-ico {
    width: 38px; height: 38px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .flow-ico.income { background: #FFE5D4; }
  .flow-ico.expense { background: #D4F1EA; }
  .flow-info { flex: 1; min-width: 0; }
  .flow-title { font-size: 13px; font-weight: 600; color: #4A3520; }
  .flow-time { font-size: 11px; color: #B08C6A; margin-top: 3px; }
  .flow-score { font-size: 15px; font-weight: 700; color: #FF7A3D; flex-shrink: 0; }
  .flow-score.minus { color: #4AB8A1; }
  /* ========== 成长时间线 ========== */
  .timeline { position: relative; padding-left: 24px; }
  .timeline::before {
    content: '';
    position: absolute;
    left: 8px;
    top: 4px;
    bottom: 4px;
    width: 2px;
    background: linear-gradient(180deg, #FF9966, #D4F1EA);
    border-radius: 1px;
  }
  .tl-item { position: relative; padding-bottom: 14px; }
  .tl-item::before {
    content: '';
    position: absolute;
    left: -20px;
    top: 6px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid #FF9966;
  }
  .tl-date { font-size: 11px; color: #B08C6A; margin-bottom: 4px; }
  .tl-content {
    background: #fff;
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 13px;
    color: #4A3520;
    line-height: 1.5;
    box-shadow: 0 3px 8px rgba(255,153,102,0.08);
  }
  .tl-content .s { font-weight: 700; color: #FF7A3D; }
  .tl-content .s.minus { color: #4AB8A1; }
  /* ========== 统计卡片 ========== */
  .stat-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }
  .stat-card {
    background: #fff;
    border-radius: 14px;
    padding: 14px 10px;
    text-align: center;
    box-shadow: 0 3px 10px rgba(255, 153, 102, 0.08);
  }
  .stat-card .big { font-size: 22px; font-weight: 700; color: #FF7A3D; }
  .stat-card .lbl { font-size: 11px; color: #7A6650; margin-top: 3px; }
  .stat-card.c1 .big { color: #FF7A3D; }
  .stat-card.c2 .big { color: #4AB8A1; }
  .stat-card.c3 .big { color: #B892D9; }
  /* ========== 空状态 ========== */
  .empty {
    text-align: center;
    padding: 30px 10px;
    color: #B08C6A;
    font-size: 13px;
  }
  .empty .ico { font-size: 40px; margin-bottom: 10px; opacity: 0.5; }
  /* ========== 弹窗 ========== */
  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(58, 30, 10, 0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-mask.show { display: flex; animation: fadein .2s; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: #fff;
    border-radius: 20px;
    width: 100%;
    max-width: 360px;
    padding: 24px 20px 20px;
    animation: popin .3s;
  }
  @keyframes popin {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .modal-title {
    font-size: 17px;
    font-weight: 700;
    color: #4A3520;
    text-align: center;
    margin-bottom: 12px;
  }
  .modal-body {
    font-size: 13px;
    color: #7A6650;
    text-align: center;
    line-height: 1.6;
    margin-bottom: 18px;
  }
  .modal-big-ico {
    font-size: 60px;
    text-align: center;
    margin-bottom: 10px;
  }
  .modal-btn-row { display: flex; gap: 10px; }
  .modal-btn {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .modal-btn.primary { background: linear-gradient(135deg, #FF9966, #FF7A3D); color: #fff; }
  .modal-btn.cancel { background: #FFF4E6; color: #7A6650; }
  /* ========== Toast ========== */
  .toast {
    position: fixed;
    left: 50%;
    top: 40%;
    transform: translate(-50%, -50%);
    background: rgba(58, 30, 10, 0.88);
    color: #fff;
    padding: 12px 22px;
    border-radius: 14px;
    font-size: 14px;
    z-index: 999;
    display: none;
    white-space: nowrap;
  }
  .toast.show { display: block; animation: toastin .2s; }
  @keyframes toastin { from { opacity: 0; transform: translate(-50%, -40%); } to { opacity: 1; transform: translate(-50%, -50%); } }
</style>
</head>
<body>
<div class="app">
  <!-- 顶部栏 -->
  <div class="topbar" id="topbar">
    <div class="slogan" id="topSlogan">亲子陪伴 · 成长记录</div>
    <h1 id="topTitle">孩子积分系统</h1>
    <div class="subtitle" id="topSub">把努力变成积分，把成长变成看得见的记录</div>
  </div>

  <!-- 主内容区 -->
  <div class="main" id="main"></div>

  <!-- 浮动创建按钮(仅任务中心显示) -->
  <button class="fab" id="fabBtn" style="display:none;" title="创建任务">＋</button>

  <!-- 底部导航 -->
  <div class="bottom-nav">
    <div class="nav-item active" data-page="home"><div class="ico">🏠</div><div class="lbl">首页</div></div>
    <div class="nav-item" data-page="tasks"><div class="ico">📋</div><div class="lbl">任务中心</div></div>
    <div class="nav-item" data-page="score"><div class="ico">💰</div><div class="lbl">积分账户</div></div>
    <div class="nav-item" data-page="reward"><div class="ico">🎁</div><div class="lbl">奖励兑换</div></div>
    <div class="nav-item" data-page="growth"><div class="ico">📈</div><div class="lbl">成长记录</div></div>
  </div>
</div>

<!-- 通用弹窗 -->
<div class="modal-mask" id="modal">
  <div class="modal" id="modalContent"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>

const TEMPLATES = [
  { name: '阅读 20 分钟', icon: '📖', score: 10, type: 'learn', desc: '每天坚持阅读课外书 20 分钟' },
  { name: '整理书桌', icon: '🗂️', score: 5, type: 'life', desc: '把学习用品和书本整理好' },

  { name: '跳绳 500 下', icon: '🏃', score: 15, type: 'sport', desc: '分三组完成，每组休息 2 分钟' },
  { name: '按时刷牙', icon: '🪥', score: 5, type: 'habit', desc: '早晚各一次，每次 3 分钟' },
  { name: '完成作业', icon: '✏️', score: 20, type: 'learn', desc: '认真完成今天的家庭作业' }
];

/* ============ 工具函数 ============ */
function $(id) { return document.getElementById(id); }
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1800);
}
function openModal(html) {
  $('modalContent').innerHTML = html;
  $('modal').classList.add('show');
}
function closeModal() { $('modal').classList.remove('show'); }
function nowTime() {
  const d = new Date();
  const pad = n => (n < 10 ? '0' + n : n);
  return `今天 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* ============ 页面渲染 ============ */
function renderHome() {
  const kid = STATE.kid;
  const todayTasks = STATE.tasks.filter(t => t.createTime.startsWith('今天'));
  const doneCount = todayTasks.filter(t => t.status === 'done').length;
  const totalCount = todayTasks.length || 1;
  const pct = Math.round((doneCount / totalCount) * 100);
  const circumference = 2 * Math.PI * 28;
  const offset = circumference - (pct / 100) * circumference;

  const recentFlows = STATE.flows.slice(0, 4).map(f => `
    <div class="feed-item">
      <div class="feed-ico">${f.type === 'income' ? '⭐' : '🎁'}</div>
      <div class="feed-body">
        <div class="feed-text">${f.title}</div>
        <div class="feed-time">${f.time}</div>
      </div>
      <div class="feed-score ${f.score < 0 ? 'minus' : ''}">${f.score > 0 ? '+' : ''}${f.score}</div>
    </div>
  `).join('');

  $('main').innerHTML = `
    <div class="kid-card">
      <div class="avatar">${kid.avatar}</div>
      <div class="kid-info">
        <div class="kid-name">${kid.name}</div>
        <div class="kid-meta">${kid.age} 岁 · 已连续坚持 ${kid.streak} 天 🔥</div>
        <div class="kid-score">当前积分 <b>${kid.balance}</b></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">积分账户 <span class="tag">余额</span></div>
      <div class="score-grid">
        <div class="score-item balance"><div class="num">${kid.balance}</div><div class="lbl">当前积分</div></div>
        <div class="score-item earn"><div class="num">${kid.totalEarn}</div><div class="lbl">累计获得</div></div>
        <div class="score-item use"><div class="num">${kid.totalUse}</div><div class="lbl">累计使用</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">今日任务进度 <span class="tag">${doneCount}/${totalCount}</span></div>
      <div class="progress-box">
        <div class="progress-ring">
          <svg viewBox="0 0 64 64">
            <circle class="bg" cx="32" cy="32" r="28"/>
            <circle class="fg" cx="32" cy="32" r="28" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"/>
          </svg>
          <div class="pct">${pct}%</div>
        </div>
        <div class="progress-text">
          <div class="big">太棒了，继续加油！</div>
          <div class="small">今天已完成 ${doneCount} 个任务，还有 ${totalCount - doneCount} 个等你挑战</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">快捷入口</div>
      <div class="quick-grid">
        <div class="quick-item" onclick="switchPage('tasks')"><div class="quick-icon c1">📋</div><div class="name">任务中心</div></div>
        <div class="quick-item" onclick="switchPage('reward')"><div class="quick-icon c2">🎁</div><div class="name">奖励兑换</div></div>
        <div class="quick-item" onclick="switchPage('score')"><div class="quick-icon c3">💰</div><div class="name">积分流水</div></div>
        <div class="quick-item" onclick="switchPage('growth')"><div class="quick-icon c4">📈</div><div class="name">成长记录</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">最近动态</div>
      ${recentFlows}
    </div>
  `;
  $('fabBtn').style.display = 'none';
}

function renderTasks() {
  const tab = STATE.currentTab;
  const tabLabel = { todo: '待完成', wait: '待确认', done: '已完成', expired: '已过期' };
  const filtered = STATE.tasks.filter(t => t.status === tab);

  const tabsHtml = ['todo', 'wait', 'done', 'expired'].map(t => {
    const count = STATE.tasks.filter(x => x.status === t).length;
    return `<div class="tab ${tab === t ? 'active' : ''}" data-tab="${t}">${tabLabel[t]} ${count > 0 ? '('+count+')' : ''}</div>`;
  }).join('');

  let listHtml = '';
  if (filtered.length === 0) {
    listHtml = `<div class="empty"><div class="ico">🌸</div>这里还没有任务哦</div>`;
  } else {
    listHtml = filtered.map(t => {
      const btn = {
        todo: `<button class="btn-task primary" onclick="submitTask(${t.id})">我完成了</button>`,
        wait: `<button class="btn-task confirm" onclick="confirmTask(${t.id})">确认完成 +${t.score}</button>`,
        done: `<button class="btn-task done" disabled>✓ 已完成</button>`,
        expired: `<button class="btn-task wait" disabled>已过期</button>`
      }[t.status];
      const typeInfo = TYPE_MAP[t.type];
      return `
        <div class="task-item type-${t.type}">
          <div class="task-ico" style="background:${typeInfo.bg};">${t.icon}</div>
          <div class="task-info">
            <div class="task-name">${t.name}</div>
            <div class="task-desc">${t.desc}</div>
            <div class="task-meta">
              <span class="task-tag score">+${t.score} 积分</span>
              <span class="task-tag" style="background:${typeInfo.bg};color:${typeInfo.color};">${typeInfo.name}</span>
              <span class="task-tag time">⏰ ${t.deadline}</span>
            </div>
          </div>
          ${btn}
        </div>
      `;
    }).join('');
  }

  $('main').innerHTML = `
    <div class="tabs">${tabsHtml}</div>
    ${listHtml}
  `;

  document.querySelectorAll('.tab').forEach(el => {
    el.addEventListener('click', () => {
      STATE.currentTab = el.dataset.tab;
      renderTasks();
    });
  });
  $('fabBtn').style.display = 'flex';
}

function renderScore() {
  const kid = STATE.kid;
  const flows = STATE.flows.map(f => `
    <div class="flow-item">
      <div class="flow-ico ${f.type}">${f.type === 'income' ? '⭐' : '🎁'}</div>
      <div class="flow-info">
        <div class="flow-title">${f.title}</div>
        <div class="flow-time">${f.time}</div>
      </div>
      <div class="flow-score ${f.score < 0 ? 'minus' : ''}">${f.score > 0 ? '+' : ''}${f.score}</div>
    </div>
  `).join('');

  $('main').innerHTML = `
    <div class="kid-card">
      <div class="avatar">${kid.avatar}</div>
      <div class="kid-info">
        <div class="kid-name">${kid.name}</div>
        <div class="kid-meta">积分账户总览</div>
        <div class="kid-score">💰 余额 <b>${kid.balance}</b> 积分</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">积分概览 <span class="tag">共 ${STATE.flows.length} 条记录</span></div>
      <div class="score-grid">
        <div class="score-item balance"><div class="num">${kid.balance}</div><div class="lbl">当前积分</div></div>
        <div class="score-item earn"><div class="num">${kid.totalEarn}</div><div class="lbl">累计获得</div></div>
        <div class="score-item use"><div class="num">${kid.totalUse}</div><div class="lbl">累计使用</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">积分流水</div>
      ${flows}
    </div>
  `;
  $('fabBtn').style.display = 'none';
}

function renderReward() {
  const kid = STATE.kid;
  const rewards = STATE.rewards.map(r => {
    const canAfford = kid.balance >= r.score;
    let btn, cls = '';
    if (r.status === 'done') btn = `<button class="reward-btn done" disabled>✓ 已兑换</button>`;
    else if (r.status === 'wait') btn = `<button class="reward-btn wait" onclick="confirmReward(${r.id})">等待家长确认</button>`;
    else if (!canAfford) { btn = `<button class="reward-btn locked" disabled>还差 ${r.score - kid.balance} 分</button>`; cls = 'locked'; }
    else btn = `<button class="reward-btn ok" onclick="applyReward(${r.id})">立即兑换</button>`;

    return `
      <div class="reward-card ${cls}">
        <div class="reward-ico">${r.icon}</div>
        <div class="reward-name">${r.name}</div>
        <div class="reward-desc">${r.desc}</div>
        <div class="reward-score">${r.score} 积分</div>
        ${btn}
      </div>
    `;
  }).join('');

  $('main').innerHTML = `
    <div class="card" style="background: linear-gradient(135deg, #FFB084, #FF9966); color:#fff;">
      <div style="display:flex; align-items:center; gap:14px;">
        <div class="avatar" style="width:50px;height:50px;font-size:26px;">${kid.avatar}</div>
        <div style="flex:1;">
          <div style="font-size:14px; opacity:0.9;">我的可用积分</div>
          <div style="font-size:26px; font-weight:700;">${kid.balance}</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">🎁 奖励兑换</div>
      <div class="reward-grid">${rewards}</div>
    </div>
  `;
  $('fabBtn').style.display = 'none';
}

function renderGrowth() {
  const kid = STATE.kid;
  const totalTasks = STATE.tasks.filter(t => t.status === 'done').length + 3;
  const timeline = STATE.growth.map(g => `
    <div style="margin-bottom:18px;">
      <div style="font-size:13px; font-weight:700; color:#FF7A3D; margin-bottom:8px;">${g.date}</div>
      <div class="timeline">
        ${g.items.map(it => `
          <div class="tl-item">
            <div class="tl-date">${it.time}</div>
            <div class="tl-content">${it.text} <span class="s ${it.score < 0 ? 'minus' : ''}">${it.score > 0 ? '+' : ''}${it.score}分</span></div>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');

  $('main').innerHTML = `
    <div class="card">
      <div class="card-title">${kid.name} 的成长档案 🌟</div>
      <div style="text-align:center; padding:10px 0 6px;">
        <div style="font-size:48px; margin-bottom:6px;">${kid.avatar}</div>
        <div style="font-size:15px; font-weight:700; color:#4A3520;">坚持，是最棒的礼物！</div>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-card c1"><div class="big">${kid.streak}</div><div class="lbl">连续坚持天数</div></div>
      <div class="stat-card c2"><div class="big">${totalTasks}</div><div class="lbl">累计完成任务</div></div>
      <div class="stat-card c3"><div class="big">${kid.totalEarn}</div><div class="lbl">累计获得积分</div></div>
    </div>

    <div class="card">
      <div class="card-title">成长时间线</div>
      ${timeline}
    </div>
  `;
  $('fabBtn').style.display = 'none';
}

function renderCreateTask() {
  const tplHtml = TEMPLATES.map((t, i) => `
    <div class="tpl-item" data-idx="${i}">
      <span class="s">${t.icon}</span>${t.name}<div class="p">+${t.score} 积分</div>
    </div>
  `).join('');

  $('main').innerHTML = `
    <div class="card">
      <div class="card-title">✨ 从模板快速选择</div>
      <div class="template-list">${tplHtml}</div>
    </div>
    <div class="card">
      <div class="card-title">📝 自定义任务</div>
      <div class="form-group">
        <label class="form-label">任务名称</label>
        <input class="form-input" id="f-name" placeholder="例如：阅读 20 分钟">
      </div>
      <div class="form-group">
        <label class="form-label">任务描述</label>
        <textarea class="form-textarea" id="f-desc" placeholder="简要说明任务内容和要求..."></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">任务分类</label>
          <select class="form-select" id="f-type">
            <option value="learn">📖 学习</option>
            <option value="life">🏠 生活</option>
            <option value="sport">🏃 运动</option>
            <option value="chore">🧹 家务</option>
            <option value="habit">🌱 习惯</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">积分奖励</label>
          <input class="form-input" id="f-score" type="number" value="10" min="1" max="999">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">截止时间</label>
        <input class="form-input" id="f-deadline" placeholder="例如：今日 21:00" value="今日 21:00">
      </div>
      <button class="btn-primary" onclick="saveTask()">发布任务</button>
      <button class="btn-secondary" onclick="switchPage('tasks')">返回任务中心</button>
    </div>
  `;
  document.querySelectorAll('.tpl-item').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.tpl-item').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
      const tpl = TEMPLATES[el.dataset.idx];
      $('f-name').value = tpl.name;
      $('f-desc').value = tpl.desc;
      $('f-type').value = tpl.type;
      $('f-score').value = tpl.score;
      showToast('已填入模板内容');
    });
  });
  $('fabBtn').style.display = 'none';
}

/* ============ 交互逻辑 ============ */
function switchPage(page) {
  STATE.currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  const titleMap = {
    home: { t: '孩子积分系统', s: '亲子陪伴 · 成长记录', sub: '把努力变成积分，把成长变成看得见的记录' },
    tasks: { t: '任务中心', s: '今日任务', sub: '完成任务，获得积分奖励' },
    create: { t: '创建任务', s: '发布新任务', sub: '为孩子设定一个可实现的小目标' },
    score: { t: '积分账户', s: '我的积分', sub: '每一份努力都看得见' },
    reward: { t: '奖励兑换', s: '兑换中心', sub: '用积分换取心仪的奖励' },
    growth: { t: '成长记录', s: '时间轴', sub: '记录成长的每一步' }
  };
  const info = titleMap[page] || titleMap.home;
  $('topTitle').textContent = info.t;
  $('topSlogan').textContent = info.s;
  $('topSub').textContent = info.sub;

  if (page === 'home') renderHome();
  else if (page === 'tasks') renderTasks();
  else if (page === 'create') renderCreateTask();
  else if (page === 'score') renderScore();
  else if (page === 'reward') renderReward();
  else if (page === 'growth') renderGrowth();

  $('main').scrollTop = 0;
}

// 孩子提交完成
function submitTask(id) {
  const task = STATE.tasks.find(t => t.id === id);
  if (!task) return;
  openModal(`
    <div class="modal-big-ico">✋</div>
    <div class="modal-title">提交完成申请</div>
    <div class="modal-body">
      确认已经完成「${task.name}」了吗？<br>
      提交后将等待爸爸妈妈确认，<br>
      通过后 <b style="color:#FF7A3D;">+${task.score} 积分</b> 将自动到账哦！
    </div>
    <div class="modal-btn-row">
      <button class="modal-btn cancel" onclick="closeModal()">再等等</button>
      <button class="modal-btn primary" onclick="doSubmit(${id})">我完成了！</button>
    </div>
  `);
}
function doSubmit(id) {
  const task = STATE.tasks.find(t => t.id === id);
  task.status = 'wait';
  closeModal();
  showToast('已提交，等待家长确认 🎉');
  renderTasks();
}

// 家长确认
function confirmTask(id) {
  const task = STATE.tasks.find(t => t.id === id);
  if (!task) return;
  openModal(`
    <div class="modal-big-ico">⭐</div>
    <div class="modal-title">家长确认完成</div>
    <div class="modal-body">
      孩子已完成「${task.name}」<br>
      确认发放 <b style="color:#FF7A3D;">+${task.score} 积分</b> 奖励？
    </div>
    <div class="modal-btn-row">
      <button class="modal-btn cancel" onclick="closeModal()">取消</button>
      <button class="modal-btn primary" onclick="doConfirm(${id})">确认发放</button>
    </div>
  `);
}
function doConfirm(id) {
  const task = STATE.tasks.find(t => t.id === id);
  task.status = 'done';
  STATE.kid.balance += task.score;
  STATE.kid.totalEarn += task.score;
  // 流水
  STATE.flows.unshift({
    id: Date.now(), type: 'income',
    title: `完成任务「${task.name}」`,
    time: nowTime(), score: task.score
  });
  // 成长记录
  const today = STATE.growth[0];
  if (today && today.date === '今天') {
    today.items.unshift({
      time: nowTime().replace('今天 ', ''),
      text: `完成了「${task.name}」`,
      score: task.score, type: 'income'
    });
  }
  closeModal();
  showToast(`积分到账 +${task.score} 🌟`);
  renderTasks();
}

// 孩子申请兑换
function applyReward(id) {
  const r = STATE.rewards.find(x => x.id === id);
  if (!r) return;
  if (STATE.kid.balance < r.score) {
    showToast('积分不足，继续加油哦');
    return;
  }
  openModal(`
    <div class="modal-big-ico">${r.icon}</div>
    <div class="modal-title">申请兑换</div>
    <div class="modal-body">
      用 <b style="color:#FF7A3D;">${r.score} 积分</b> 兑换「${r.name}」？<br>
      提交后将等待爸爸妈妈确认，<br>
      通过后积分将自动扣除。
    </div>
    <div class="modal-btn-row">
      <button class="modal-btn cancel" onclick="closeModal()">再想想</button>
      <button class="modal-btn primary" onclick="doApply(${id})">申请兑换</button>
    </div>
  `);
}
function doApply(id) {
  const r = STATE.rewards.find(x => x.id === id);
  r.status = 'wait';
  closeModal();
  showToast('已提交兑换申请 🎁');
  renderReward();
}

// 家长确认奖励
function confirmReward(id) {
  const r = STATE.rewards.find(x => x.id === id);
  if (!r) return;
  openModal(`
    <div class="modal-big-ico">🎉</div>
    <div class="modal-title">家长确认兑现</div>
    <div class="modal-body">
      确认兑现「${r.name}」并扣除 <b style="color:#4AB8A1;">${r.score} 积分</b>？
    </div>
    <div class="modal-btn-row">
      <button class="modal-btn cancel" onclick="closeModal()">取消</button>
      <button class="modal-btn primary" onclick="doConfirmReward(${id})">确认兑现</button>
    </div>
  `);
}
function doConfirmReward(id) {
  const r = STATE.rewards.find(x => x.id === id);
  if (STATE.kid.balance < r.score) {
    closeModal();
    showToast('积分不足');
    return;
  }
  r.status = 'done';
  STATE.kid.balance -= r.score;
  STATE.kid.totalUse += r.score;
  STATE.flows.unshift({
    id: Date.now(), type: 'expense',
    title: `兑换「${r.name}」`,
    time: nowTime(), score: -r.score
  });
  const today = STATE.growth[0];
  if (today && today.date === '今天') {
    today.items.unshift({
      time: nowTime().replace('今天 ', ''),
      text: `兑换了「${r.name}」`,
      score: -r.score, type: 'expense'
    });
  }
  closeModal();
  showToast(`兑换成功 -${r.score} 积分 🎁`);
  renderReward();
}

// 创建任务
function saveTask() {
  const name = $('f-name').value.trim();
  const desc = $('f-desc').value.trim() || '无';
  const type = $('f-type').value;
  const score = parseInt($('f-score').value) || 10;
  const deadline = $('f-deadline').value.trim() || '今日 21:00';
  if (!name) { showToast('请填写任务名称'); return; }
  const tpl = TEMPLATES.find(t => t.name === name) || TEMPLATES.find(t => t.type === type) || TEMPLATES[0];
  STATE.tasks.unshift({
    id: Date.now(),
    name, desc, type,
    icon: tpl.icon,
    score, deadline,
    status: 'todo',
    createTime: nowTime()
  });
  showToast('任务发布成功 ✨');
  switchPage('tasks');
}

/* ============ 事件绑定 ============ */
document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => switchPage(el.dataset.page));
});
$('fabBtn').addEventListener('click', () => switchPage('create'));
$('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') closeModal();
});

/* ============ 启动 ============ */
switchPage('home');
</script>
</body>
</html>
