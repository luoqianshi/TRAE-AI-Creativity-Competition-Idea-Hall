<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实验伙伴 LabMate — AI 实验数据分析助手</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --primary: #2563eb;
  --primary-light: #60a5fa;
  --primary-dark: #1e40af;
  --accent: #06b6d4;
  --green: #10b981;
  --orange: #f59e0b;
  --red: #ef4444;
  --purple: #8b5cf6;
  --bg: #f0f4f8;
  --card: #ffffff;
  --text: #1e293b;
  --text-soft: #64748b;
  --text-faint: #94a3b8;
  --border: #e2e8f0;
  --shadow: 0 4px 24px rgba(37, 99, 235, 0.08);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
  --gradient: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%);
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* 顶部导航 */
.topbar {
  background: var(--gradient);
  color: white;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 2px 12px rgba(37, 99, 235, 0.2);
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 18px;
  font-weight: 700;
}
.logo-icon {
  width: 36px;
  height: 36px;
  background: rgba(255,255,255,0.2);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  backdrop-filter: blur(10px);
}
.topbar-actions { display: flex; gap: 8px; }
.topbar-btn {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.25);
  color: white;
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.2s;
}
.topbar-btn:hover { background: rgba(255,255,255,0.25); }

/* 主体布局 */
.layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  min-height: calc(100vh - 60px);
}

/* 侧边栏 */
.sidebar {
  background: white;
  border-right: 1px solid var(--border);
  padding: 20px 16px;
  position: sticky;
  top: 60px;
  height: calc(100vh - 60px);
  overflow-y: auto;
}
.sidebar-section { margin-bottom: 24px; }
.sidebar-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
  padding: 0 8px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  color: var(--text-soft);
  transition: all 0.2s;
  margin-bottom: 2px;
}
.nav-item:hover { background: var(--bg); color: var(--text); }
.nav-item.active { background: #eff6ff; color: var(--primary); font-weight: 600; }
.nav-item .icon { font-size: 18px; width: 24px; text-align: center; }
.nav-item .badge {
  margin-left: auto;
  background: var(--primary);
  color: white;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
}

/* 主内容区 */
.main {
  padding: 24px 32px;
  max-width: 100%;
  overflow-x: hidden;
}
.page-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 24px;
}
.page-title { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
.page-subtitle { font-size: 14px; color: var(--text-soft); }

/* 卡片 */
.card {
  background: white;
  border-radius: 16px;
  padding: 24px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  margin-bottom: 20px;
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.card-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }

/* 数据输入区 */
.data-input-wrap {
  display: grid;
  grid-template-columns: 1fr 200px;
  gap: 16px;
  align-items: start;
}
.data-textarea {
  width: 100%;
  min-height: 140px;
  padding: 14px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
  font-size: 13px;
  resize: vertical;
  outline: none;
  transition: border-color 0.2s;
  background: #f8fafc;
  color: var(--text);
  line-height: 1.6;
}
.data-textarea:focus { border-color: var(--primary); background: white; }
.input-side { display: flex; flex-direction: column; gap: 10px; }
.sample-btn {
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  background: white;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s;
  color: var(--text-soft);
}
.sample-btn:hover { border-color: var(--primary); background: #eff6ff; color: var(--primary); }
.sample-btn .emoji { font-size: 18px; }

.analyze-btn {
  padding: 12px;
  background: var(--gradient);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
  transition: transform 0.2s;
}
.analyze-btn:active { transform: scale(0.97); }
.analyze-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* 统计卡片 */
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.stat-box {
  background: white;
  border-radius: 12px;
  padding: 16px;
  border: 1px solid var(--border);
  text-align: center;
}
.stat-box .label { font-size: 12px; color: var(--text-faint); margin-bottom: 4px; }
.stat-box .value { font-size: 24px; font-weight: 700; color: var(--text); }
.stat-box .value.green { color: var(--green); }
.stat-box .value.red { color: var(--red); }
.stat-box .value.blue { color: var(--primary); }
.stat-box .value.orange { color: var(--orange); }
.stat-box .delta { font-size: 11px; margin-top: 2px; }

/* 图表区 */
.charts-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}
.chart-card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}
.chart-card.full { grid-column: 1 / -1; }
.chart-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.chart-desc { font-size: 12px; color: var(--text-faint); margin-bottom: 14px; }
.chart-canvas-wrap {
  position: relative;
  height: 220px;
  display: flex;
  align-items: flex-end;
  justify-content: space-around;
  padding: 10px 0;
  border-bottom: 2px solid var(--border);
}
.bar {
  width: 8%;
  min-width: 24px;
  background: var(--gradient);
  border-radius: 6px 6px 0 0;
  position: relative;
  transition: height 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
}
.bar:hover { filter: brightness(1.1); }
.bar .bar-label {
  position: absolute;
  bottom: -24px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: var(--text-faint);
  white-space: nowrap;
}
.bar .bar-value {
  position: absolute;
  top: -22px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
  opacity: 0;
  transition: opacity 0.2s;
}
.bar:hover .bar-value { opacity: 1; }

/* 折线图 */
.line-chart {
  height: 200px;
  position: relative;
  border-bottom: 2px solid var(--border);
  border-left: 2px solid var(--border);
  margin: 10px 0 24px;
}
.line-chart svg { width: 100%; height: 100%; }
.line-chart .y-label {
  position: absolute;
  left: -32px;
  font-size: 10px;
  color: var(--text-faint);
}
.line-chart .x-label {
  position: absolute;
  bottom: -20px;
  font-size: 10px;
  color: var(--text-faint);
}

/* 饼图(用 conic-gradient) */
.pie-wrap { display: flex; align-items: center; gap: 20px; }
.pie {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  flex-shrink: 0;
  position: relative;
}
.pie-legend { flex: 1; }
.pie-legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  margin-bottom: 8px;
}
.pie-legend-item .dot { width: 12px; height: 12px; border-radius: 3px; }
.pie-legend-item .pct { margin-left: auto; font-weight: 600; color: var(--text-soft); }

/* AI 分析报告 */
.ai-report {
  background: linear-gradient(135deg, #eff6ff 0%, #f0f9ff 100%);
  border: 1px solid #bfdbfe;
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 20px;
}
.ai-report-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.ai-avatar {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
.ai-report-title { font-size: 15px; font-weight: 700; }
.ai-report-status { font-size: 11px; color: var(--green); }
.ai-report-body { font-size: 14px; line-height: 1.8; color: var(--text); }
.ai-report-body p { margin-bottom: 10px; }
.ai-report-body b { color: var(--primary); }
.ai-report-body .highlight {
  background: #fef3c7;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: 600;
}
.ai-report-body .tag {
  display: inline-block;
  background: white;
  border: 1px solid var(--border);
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 12px;
  margin: 2px 4px 2px 0;
  color: var(--text-soft);
}
.insight-item {
  display: flex;
  gap: 10px;
  padding: 10px;
  background: white;
  border-radius: 10px;
  margin-bottom: 8px;
  border-left: 3px solid var(--primary);
}
.insight-item.warn { border-left-color: var(--orange); }
.insight-item.danger { border-left-color: var(--red); }
.insight-item.success { border-left-color: var(--green); }
.insight-icon { font-size: 18px; flex-shrink: 0; }
.insight-text { font-size: 13px; line-height: 1.5; }
.insight-text b { color: var(--text); }

/* 报告生成 */
.report-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.report-btn {
  padding: 10px 18px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: white;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-soft);
  transition: all 0.2s;
}
.report-btn:hover { border-color: var(--primary); color: var(--primary); background: #eff6ff; }
.report-btn.primary { background: var(--primary); color: white; border-color: var(--primary); }
.report-btn.primary:hover { background: var(--primary-dark); }

/* 数据表格 */
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.data-table th {
  background: #f8fafc;
  padding: 10px 12px;
  text-align: left;
  font-weight: 600;
  color: var(--text-soft);
  border-bottom: 2px solid var(--border);
  font-size: 12px;
}
.data-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
}
.data-table tr:hover { background: #f8fafc; }
.data-table .num { font-family: "SF Mono", monospace; text-align: right; }
.data-table .anomaly { color: var(--red); font-weight: 600; }

/* 空状态 */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-faint);
}
.empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
.empty-state .title { font-size: 16px; font-weight: 600; color: var(--text-soft); margin-bottom: 6px; }
.empty-state .desc { font-size: 13px; }

/* Toast */
.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(30, 41, 59, 0.95);
  color: white;
  padding: 12px 24px;
  border-radius: 24px;
  font-size: 13px;
  z-index: 9999;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  animation: toastIn 0.3s ease;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* 加载动画 */
.loading-dots {
  display: inline-flex;
  gap: 4px;
  align-items: center;
}
.loading-dots span {
  width: 6px;
  height: 6px;
  background: var(--primary);
  border-radius: 50%;
  animation: bounce 1.4s infinite ease-in-out both;
}
.loading-dots span:nth-child(1) { animation-delay: -0.32s; }
.loading-dots span:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounce {
  0%, 80%, 100% { transform: scale(0); }
  40% { transform: scale(1); }
}

/* 响应式 */
@media (max-width: 1024px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .charts-grid { grid-template-columns: 1fr; }
  .data-input-wrap { grid-template-columns: 1fr; }
  .main { padding: 16px; }
}
</style>
</head>
<body>

<!-- 顶部导航 -->
<header class="topbar">
  <div class="logo">
    <div class="logo-icon">🔬</div>
    <span>实验伙伴 LabMate</span>
  </div>
  <div class="topbar-actions">
    <button class="topbar-btn" onclick="showToast('📁 项目已保存到本地')">📁 保存</button>
    <button class="topbar-btn" onclick="showToast('📤 导出 PDF 报告功能开发中...')">📤 导出</button>
    <button class="topbar-btn" onclick="showToast('⚙️ 设置已打开')">⚙️</button>
  </div>
</header>

<div class="layout">

  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">工作台</div>
      <div class="nav-item active" onclick="switchTab(this,'analysis')">
        <span class="icon">📊</span> 数据分析
      </div>
      <div class="nav-item" onclick="switchTab(this,'history')">
        <span class="icon">📁</span> 历史实验
        <span class="badge">12</span>
      </div>
      <div class="nav-item" onclick="switchTab(this,'report')">
        <span class="icon">📝</span> 报告草稿
        <span class="badge">3</span>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">AI 助手</div>
      <div class="nav-item" onclick="switchTab(this,'chat')">
        <span class="icon">🤖</span> 问 LabMate
      </div>
      <div class="nav-item" onclick="switchTab(this,'formula')">
        <span class="icon">🧮</span> 公式推导
      </div>
      <div class="nav-item" onclick="switchTab(this,'literature')">
        <span class="icon">📚</span> 文献速读
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">最近实验</div>
      <div class="nav-item" onclick="showToast('📂 已打开:催化剂浓度对反应速率的影响')">
        <span class="icon">🧪</span> 催化剂浓度实验
      </div>
      <div class="nav-item" onclick="showToast('📂 已打开:温度对酶活性的影响')">
        <span class="icon">🌡️</span> 酶活性实验
      </div>
      <div class="nav-item" onclick="showToast('📂 已打开:光照强度-光合速率')">
        <span class="icon">🌱</span> 光合作用实验
      </div>
    </div>
  </aside>

  <!-- 主内容 -->
  <main class="main" id="mainContent">

    <!-- 页面标题 -->
    <div class="page-header">
      <div>
        <div class="page-title">📊 数据分析工作台</div>
        <div class="page-subtitle">粘贴实验数据,AI 自动生成图表、统计分析与报告草稿</div>
      </div>
    </div>

    <!-- 数据输入 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">📥 数据输入</div>
        <div style="font-size:12px;color:var(--text-faint);">支持 CSV / TSV 格式,可直接从 Excel 粘贴</div>
      </div>
      <div class="data-input-wrap">
        <textarea class="data-textarea" id="dataInput" placeholder="在这里粘贴你的实验数据...

示例格式(CSV):
温度,反应速率
20,0.15
30,0.28
40,0.42
50,0.65
60,0.88
70,1.12
80,1.35

或直接点击右侧示例数据快速体验"></textarea>
        <div class="input-side">
          <button class="sample-btn" onclick="loadSample('chemistry')">
            <span class="emoji">🧪</span> 化学反应速率
          </button>
          <button class="sample-btn" onclick="loadSample('biology')">
            <span class="emoji">🌱</span> 酶活性实验
          </button>
          <button class="sample-btn" onclick="loadSample('physics')">
            <span class="emoji">⚡</span> 电阻温度特性
          </button>
          <button class="analyze-btn" id="analyzeBtn" onclick="analyzeData()">
            ✨ AI 智能分析
          </button>
        </div>
      </div>
    </div>

    <!-- 分析结果区(动态填充) -->
    <div id="resultArea">
      <div class="empty-state">
        <div class="emoji">🔬</div>
        <div class="title">还没有分析数据</div>
        <div class="desc">粘贴数据或点击右侧示例,然后点击「AI 智能分析」</div>
      </div>
    </div>

  </main>
</div>

<script>
// 示例数据集
const samples = {
  chemistry: `温度,反应速率
20,0.15
30,0.28
40,0.42
50,0.65
60,0.88
70,1.12
80,1.35
90,1.58
100,1.72`,
  biology: `pH值,酶活性
3,5
4,18
5,42
6,78
7,95
8,88
9,62
10,35
11,12`,
  physics: `温度(℃),电阻(Ω)
0,4.20
10,4.38
20,4.56
30,4.74
40,4.92
50,5.10
60,5.28
70,5.46
80,5.64
90,5.82
100,6.00`
};

let currentData = null;

function loadSample(type) {
  document.getElementById('dataInput').value = samples[type];
  showToast('📋 示例数据已载入,点击「AI 智能分析」开始');
}

function switchTab(el, tab) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  if (tab !== 'analysis') {
    showToast('🚧 ' + el.textContent.trim() + ' 功能开发中,当前展示数据分析工作台');
  }
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transition = 'opacity 0.3s';
    setTimeout(() => t.remove(), 300);
  }, 2400);
}

function parseData(text) {
  const lines = text.trim().split('\n').filter(l => l.trim());
  if (lines.length < 2) return null;
  const delimiter = lines[0].includes('\t') ? '\t' : (lines[0].includes(',') ? ',' : /\s+/);
  const headers = lines[0].split(delimiter).map(h => h.trim());
  const rows = lines.slice(1).map(line => {
    const parts = line.split(delimiter);
    const row = {};
    headers.forEach((h, i) => {
      const v = parts[i] ? parts[i].trim() : '';
      row[h] = isNaN(parseFloat(v)) ? v : parseFloat(v);
    });
    return row;
  });
  return { headers, rows };
}

function calcStats(values) {
  const n = values.length;
  const sum = values.reduce((a, b) => a + b, 0);
  const mean = sum / n;
  const variance = values.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / n;
  const std = Math.sqrt(variance);
  const sorted = [...values].sort((a, b) => a - b);
  const median = n % 2 === 0 ? (sorted[n/2-1] + sorted[n/2]) / 2 : sorted[Math.floor(n/2)];
  const min = sorted[0];
  const max = sorted[n-1];
  // 线性回归(用索引做x)
  const xs = values.map((_, i) => i);
  const xMean = xs.reduce((a,b)=>a+b,0)/n;
  let num=0, den=0;
  xs.forEach((x,i)=>{ num+=(x-xMean)*(values[i]-mean); den+=Math.pow(x-xMean,2); });
  const slope = den===0?0:num/den;
  const r = den===0?0:num/(Math.sqrt(den)*Math.sqrt(variance*n));
  return { n, sum, mean, std, median, min, max, slope, r };
}

function analyzeData() {
  const text = document.getElementById('dataInput').value;
  if (!text.trim()) { showToast('⚠️ 请先输入或载入数据'); return; }
  const data = parseData(text);
  if (!data || data.rows.length === 0) { showToast('⚠️ 数据格式无法识别'); return; }

  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-dots"><span></span><span></span><span></span></span> 分析中';

  setTimeout(() => {
    currentData = data;
    renderResults(data);
    btn.disabled = false;
    btn.innerHTML = '✨ AI 智能分析';
    showToast('✅ 分析完成!已生成图表、统计与 AI 报告');
  }, 1200);
}

  document.getElementById('resultArea').innerHTML = html;

}

function getPieSlices(values) {
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || 1;
  const q1 = min + range * 0.25;
  const q2 = min + range * 0.5;
  const q3 = min + range * 0.75;
  let s1=0, s2=0, s3=0, s4=0;
  values.forEach(v => {
    if (v <= q1) s1++;
    else if (v <= q2) s2++;
    else if (v <= q3) s3++;
    else s4++;
  });
  const total = values.length;
  return [
    Math.round(s1/total*100),
    Math.round(s2/total*100),
    Math.round(s3/total*100),
    Math.round(s4/total*100)
  ];
}

function renderLineChart(xValues, yValues) {
  const container = document.getElementById('lineChart');
  if (!container) return;
  const w = container.clientWidth;
  const h = container.clientHeight;
  const max = Math.max(...yValues);
  const min = Math.min(...yValues);
  const range = max - min || 1;
  const padding = 20;
  const points = yValues.map((v, i) => {
    const x = padding + (i / (yValues.length - 1)) * (w - padding * 2);
    const y = h - padding - ((v - min) / range) * (h - padding * 2);
    return [x, y];
  });
  const pathD = points.map((p, i) => (i === 0 ? 'M' : 'L') + p[0] + ',' + p[1]).join(' ');
  const areaD = pathD + ` L${points[points.length-1][0]},${h-padding} L${points[0][0]},${h-padding} Z`;

  container.innerHTML = `
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <defs>
        <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2563eb" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="${areaD}" fill="url(#areaGrad)"/>
      <path d="${pathD}" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${points.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="white" stroke="#2563eb" stroke-width="2"/>`).join('')}
    </svg>
  `;
}
