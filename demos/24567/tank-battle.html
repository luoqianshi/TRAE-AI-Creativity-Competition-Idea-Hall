<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>坦克大战</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #1A3320;
  font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}

/* ── 游戏容器 ── */
#gameContainer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #1a3320;
}

#gameCanvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: auto;
}

/* ── 摇杆层 ── */
#joystickLayer {
  position: absolute;
  inset: 0;
  z-index: 20;
  touch-action: none;
}

/* ── 摇杆底座 ── */
.joystick-base {
  position: absolute;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: rgba(255,255,255,0.06);
  border: 3px solid rgba(255,255,255,0.15);
  pointer-events: none;
  display: block;
  transition: background-color 0.2s ease, border-color 0.2s ease;
}

#p1JoystickBase {
  left: 60px;
  bottom: 60px;
  border-color: rgba(239, 83, 80, 0.25);
}
#p1JoystickBase.active {
  background: rgba(239, 83, 80, 0.12);
  border-color: rgba(239, 83, 80, 0.6);
}
#p1JoystickKnob {
  background: rgba(239, 83, 80, 0.85);
  box-shadow: 0 4px 16px rgba(239, 83, 80, 0.4);
}

#p2JoystickBase {
  right: 60px;
  bottom: 60px;
  border-color: rgba(102, 187, 106, 0.25);
}
#p2JoystickBase.active {
  background: rgba(102, 187, 106, 0.12);
  border-color: rgba(102, 187, 106, 0.6);
}
#p2JoystickKnob {
  background: rgba(102, 187, 106, 0.85);
  box-shadow: 0 4px 16px rgba(102, 187, 106, 0.4);
}

.joystick-knob {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 50px;
  height: 50px;
  margin-left: -25px;
  margin-top: -25px;
  border-radius: 50%;
  border: 2px solid rgba(0,0,0,0.1);
  transition: transform 0.04s linear;
}

/* ── HUD ── */
#hud {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 12px 16px;
  pointer-events: none;
}

.hud-left, .hud-right {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.hud-label {
  font-size: 11px;
  font-weight: 600;
  color: rgba(255,255,255,0.5);
  letter-spacing: 1px;
  text-transform: uppercase;
}

.hud-value {
  font-size: 28px;
  font-weight: 700;
  color: white;
  font-family: 'Fredoka', sans-serif;
  text-shadow: 0 2px 8px rgba(0,0,0,0.4);
}

.hud-value.score {
  color: #FFD54F;
}

.hud-value.health {
  color: #EF9A9A;
}

.hp-bar {
  display: flex;
  gap: 4px;
  margin-top: 4px;
}

.hp-segment {
  width: 24px;
  height: 6px;
  border-radius: 3px;
  background: rgba(255,255,255,0.2);
  transition: background 0.3s ease;
}

.hp-segment.filled {
  background: #EF5350;
}

.hp-segment.filled.p2 {
  background: #66BB6A;
}

/* ── 游戏结束覆盖 ── */
#gameOverOverlay {
  position: absolute;
  inset: 0;
  z-index: 30;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
}

#gameOverOverlay.show {
  display: flex;
}

.gameover-card {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 28px;
  border: 1px solid rgba(255,255,255,0.2);
  padding: 40px 48px;
  text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

.gameover-title {
  font-size: 36px;
  font-weight: 700;
  color: #EF9A9A;
  margin-bottom: 8px;
}

.gameover-score {
  font-size: 18px;
  color: rgba(255,255,255,0.7);
  margin-bottom: 8px;
}

.gameover-score span {
  color: #FFD54F;
  font-weight: 700;
  font-size: 28px;
}

.gameover-hint {
  font-size: 13px;
  color: rgba(255,255,255,0.4);
  margin-bottom: 24px;
}

.restart-btn {
  padding: 14px 48px;
  border: none;
  border-radius: 50px;
  background: linear-gradient(135deg, #4CAF50, #3A7D32);
  color: white;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: 1px;
  box-shadow: 0 4px 16px rgba(76,175,80,0.4);
  transition: all 0.2s ease;
}

.restart-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(76,175,80,0.5);
}

.restart-btn:active {
  transform: translateY(0);
}

/* ── 倒计时提示 ── */
#countdown {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 25;
  font-size: 80px;
  font-weight: 700;
  color: white;
  text-shadow: 0 4px 20px rgba(0,0,0,0.5);
  display: none;
  pointer-events: none;
}

#countdown.show {
  display: block;
}

/* ── 提示文本 ── */
#helpText {
  position: fixed;
  bottom: 6vh;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  color: rgba(255,255,255,0.25);
  font-size: 13px;
  pointer-events: none;
  text-align: center;
  transition: opacity 0.5s ease;
}

/* ── 移动端 ── */
@media (max-width: 480px) {
  #gameContainer {
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 0;
  }
  .hud-value { font-size: 22px; }
  .hp-segment { width: 18px; height: 5px; }
  .gameover-card { padding: 28px 24px; }
  .gameover-title { font-size: 28px; }
  #helpText { bottom: 2vh; font-size: 11px; }
  .joystick-base {
    width: 100px;
    height: 100px;
    bottom: 40px;
  }
  #p1JoystickBase { left: 40px; }
  #p2JoystickBase { right: 40px; }
  .joystick-knob {
    width: 40px;
    height: 40px;
    margin-left: -20px;
    margin-top: -20px;
  }
}

/* ── 模式选择菜单 ── */
#startMenu {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: radial-gradient(ellipse at center, #2d4a37 0%, #1a2f22 60%, #0d1a12 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
}

#startMenu.hidden { display: none; }

.menu-title {
  font-size: 48px;
  font-weight: 800;
  color: #fff;
  text-shadow: 0 4px 24px rgba(0,0,0,0.5), 0 0 60px rgba(76,175,80,0.3);
  margin-bottom: 8px;
  letter-spacing: 4px;
}

.menu-subtitle {
  font-size: 14px;
  color: rgba(255,255,255,0.35);
  margin-bottom: 32px;
  letter-spacing: 2px;
}

.mode-btn {
  width: 280px;
  padding: 18px 0;
  border: 2px solid rgba(255,255,255,0.15);
  border-radius: 16px;
  background: rgba(255,255,255,0.06);
  color: #fff;
  font-size: 18px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.25s ease;
  backdrop-filter: blur(8px);
  letter-spacing: 1px;
}

.mode-btn:hover {
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,255,255,0.35);
  transform: translateY(-3px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

.mode-btn:active { transform: translateY(0); }

.mode-btn .mode-icon { font-size: 28px; display: block; margin-bottom: 4px; }
.mode-btn .mode-desc {
  font-size: 11px;
  color: rgba(255,255,255,0.4);
  font-weight: 400;
  margin-top: 4px;
}
</style>
</head>
<body>

<!-- 模式选择菜单 -->
<div id="startMenu">
  <div class="menu-title">🎮 坦克大战</div>
  <div class="menu-subtitle">TANK BATTLE</div>
  <button class="mode-btn" id="btnSingle">
    <span class="mode-icon">🎯</span>
    单人模式
    <span class="mode-desc">独自挑战，看看你能走多远</span>
  </button>
  <button class="mode-btn" id="btnLocal">
    <span class="mode-icon">👥</span>
    本地双人
    <span class="mode-desc">共用一台设备，左右摇杆协作</span>
  </button>
</div>

<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>

  <div id="joystickLayer">
    <div class="joystick-base" id="p1JoystickBase">
      <div class="joystick-knob" id="p1JoystickKnob"></div>
    </div>
    <div class="joystick-base" id="p2JoystickBase">
      <div class="joystick-knob" id="p2JoystickKnob"></div>
    </div>
  </div>

  <div id="hud">
    <div class="hud-left">
      <div class="hud-label" style="color: #ef5350; font-size: 13px; font-weight: bold;">P1 (红)</div>
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <span class="hud-label">击杀</span>
        <span class="hud-value score" id="p1ScoreDisplay" style="color: #ef5350;">0</span>
      </div>
      <div class="hp-bar" id="p1HpBar"></div>
    </div>
    <div class="hud-right" style="align-items: flex-end;">
      <div class="hud-label" style="color: #66bb6a; font-size: 13px; font-weight: bold;">P2 (绿)</div>
      <div style="display: flex; align-items: baseline; gap: 8px; flex-direction: row-reverse;">
        <span class="hud-label">击杀</span>
        <span class="hud-value score" id="p2ScoreDisplay" style="color: #66bb6a;">0</span>
      </div>
      <div class="hp-bar" id="p2HpBar"></div>
    </div>
  </div>

  <div id="countdown"></div>

  <div id="gameOverOverlay">
    <div class="gameover-card">
      <div class="gameover-title">💥 战役结束</div>
      <div class="gameover-score" style="margin-bottom: 12px; font-size: 16px;">
        P1击杀: <span id="p1FinalScore" style="color: #ef5350; font-size:24px;">0</span> 辆 | 
        P2击杀: <span id="p2FinalScore" style="color: #66bb6a; font-size:24px;">0</span> 辆
      </div>
      <div class="gameover-score">总击杀: <span id="finalScore" style="color: #FFD54F;">0</span> 辆</div>
      <div class="gameover-hint">点击下方按钮重新开始</div>
      <button class="restart-btn" id="restartBtn">重新开始</button>
    </div>
  </div>
</div>

<div id="helpText" style="line-height: 1.6;">PC端: P1使用 WASD 移动，P2使用 方向键 移动<br>移动端: 触摸屏幕左半部分控制P1，右半部分控制P2</div>

<script>
(function() {
  'use strict';

  // ── 检测是否为手机手柄模式 ──
  const urlParams = new URLSearchParams(window.location.search);
  const isController = urlParams.get('controller') === 'true';
  const hostPeerId = urlParams.get('host');

  // ── DOM ──
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const joystickLayer = document.getElementById('joystickLayer');
  const p1JoystickBase = document.getElementById('p1JoystickBase');
  const p1JoystickKnob = document.getElementById('p1JoystickKnob');
  const p2JoystickBase = document.getElementById('p2JoystickBase');
  const p2JoystickKnob = document.getElementById('p2JoystickKnob');
  const p1ScoreDisplay = document.getElementById('p1ScoreDisplay');
  const p2ScoreDisplay = document.getElementById('p2ScoreDisplay');
  const p1HpBar = document.getElementById('p1HpBar');
  const p2HpBar = document.getElementById('p2HpBar');
  const gameOverOverlay = document.getElementById('gameOverOverlay');
  const p1FinalScore = document.getElementById('p1FinalScore');
  const p2FinalScore = document.getElementById('p2FinalScore');
  const finalScore = document.getElementById('finalScore');
  const restartBtn = document.getElementById('restartBtn');
  const countdownEl = document.getElementById('countdown');
  const helpText = document.getElementById('helpText');
  const startMenu = document.getElementById('startMenu');
  const hudRight = document.querySelector('.hud-right');

  // ── 常量 ──
  let WORLD_W = 800;
  let WORLD_H = 600;
  const JOYSTICK_RADIUS = 50;
  const TANK_RADIUS = 18;
  const BULLET_RADIUS = 4;
  const PLAYER_SPEED = 200;
  const ENEMY_SPEED = 100;
  const BULLET_SPEED = 340;
  const PLAYER_FIRE_MS = 1000;
  const ENEMY_FIRE_MS = 1800;
  const ENEMY_SPAWN_MS = 2000;
  const MAX_ENEMIES = 15;
  const PLAYER_MAX_HP = 5;
  const KNOCKBACK = 3;

  // ── 状态 ──
  let gameRunning = false;
  let gameOver = false;
  let p1Score = 0;
  let p2Score = 0;
  let lastTime = 0;
  let gameMode = 'local'; // 'single', 'local'

  // 摇杆状态
  const joy1 = { active: false, id: null, cx: 0, cy: 0, dx: 0, dy: 0 };
  const joy2 = { active: false, id: null, cx: 0, cy: 0, dx: 0, dy: 0 };

  // 键盘状态
  const keys = {};
  window.addEventListener('keydown', function(e) {
    keys[e.code] = true;
  });
  window.addEventListener('keyup', function(e) {
    keys[e.code] = false;
  });

  // 玩家
  let player1 = null;
  let player2 = null;

  // 实体
  let enemies = [];
  let bullets = [];
  let particles = [];

  // 计时器
  let enemySpawnTimer = 0;
  let powerups = [];
  let powerupSpawnTimer = 0;
  let bossKillsCounter = 0;

  // ── Canvas 大小 ──
  function updateJoystickCenters() {
    const rect1 = p1JoystickBase.getBoundingClientRect();
    joy1.cx = rect1.left + rect1.width / 2;
    joy1.cy = rect1.top + rect1.height / 2;

    const rect2 = p2JoystickBase.getBoundingClientRect();
    joy2.cx = rect2.left + rect2.width / 2;
    joy2.cy = rect2.top + rect2.height / 2;
  }

  function resizeCanvas() {
    const container = document.getElementById('gameContainer');
    const rect = container.getBoundingClientRect();
    canvas.width = Math.floor(rect.width);
    canvas.height = Math.floor(rect.height);

    WORLD_W = canvas.width;
    WORLD_H = canvas.height;

    if (player1) {
      player1.x = clamp(player1.x, TANK_RADIUS, WORLD_W - TANK_RADIUS);
      player1.y = clamp(player1.y, TANK_RADIUS, WORLD_H - TANK_RADIUS);
    }
    if (player2) {
      player2.x = clamp(player2.x, TANK_RADIUS, WORLD_W - TANK_RADIUS);
      player2.y = clamp(player2.y, TANK_RADIUS, WORLD_H - TANK_RADIUS);
    }
    if (enemies) {
      for (const e of enemies) {
        e.x = clamp(e.x, TANK_RADIUS, WORLD_W - TANK_RADIUS);
        e.y = clamp(e.y, TANK_RADIUS, WORLD_H - TANK_RADIUS);
      }
    }

    updateJoystickCenters();
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // 世界 → 屏幕映射
  let cam = { x: 0, y: 0 };

  function updateCamera() {
    cam.x = 0;
    cam.y = 0;
  }

  // ── HP 条 ──
  function updateHpBar() {
    p1HpBar.innerHTML = '';
    if (player1) {
      for (let i = 0; i < PLAYER_MAX_HP; i++) {
        const seg = document.createElement('div');
        seg.className = 'hp-segment' + (player1.alive && i < player1.hp ? ' filled' : '');
        p1HpBar.appendChild(seg);
      }
    }
    p2HpBar.innerHTML = '';
    if (player2) {
      for (let i = 0; i < PLAYER_MAX_HP; i++) {
        const seg = document.createElement('div');
        seg.className = 'hp-segment p2' + (player2.alive && i < player2.hp ? ' filled p2' : '');
        p2HpBar.appendChild(seg);
      }
    }
  }

  // ── 工具 ──
  function dist(a, b) {
    return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
  }

  function angle(a, b) {
    return Math.atan2(b.y - a.y, b.x - a.x);
  }

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function rand(min, max) {
    return Math.random() * (max - min) + min;
  }

  function randInt(min, max) {
    return Math.floor(rand(min, max + 1));
  }

  // ── 实体 ──
  function createTank(x, y, color, darkColor, isPlayer) {
    const initialHp = isPlayer ? PLAYER_MAX_HP : 2;
    const initialSpeed = isPlayer ? PLAYER_SPEED : ENEMY_SPEED;
    const initialFireInterval = isPlayer ? PLAYER_FIRE_MS : ENEMY_FIRE_MS + rand(-300, 300);
    return {
      x, y,
      radius: TANK_RADIUS,
      angle: -Math.PI / 2, // 默认朝上
      hp: initialHp,
      maxHp: initialHp,
      color,
      darkColor,
      isPlayer,
      speed: initialSpeed,
      baseSpeed: initialSpeed,
      lastFireTime: 0,
      fireInterval: initialFireInterval,
      baseFireInterval: initialFireInterval,
      alive: true,
      hitFlash: 0,
      extraBullets: 0,
      shield: false,
    };
  }

  function createBullet(x, y, angle, tank) {
    return {
      x, y,
      vx: Math.cos(angle) * BULLET_SPEED,
      vy: Math.sin(angle) * BULLET_SPEED,
      radius: BULLET_RADIUS,
      isPlayer: tank.isPlayer,
      playerId: tank.isPlayer ? tank.id : null,
      alive: true,
      life: 0,
      maxLife: 3, // seconds
    };
  }

  function createParticle(x, y, color) {
    return {
      x, y,
      vx: rand(-120, 120),
      vy: rand(-120, 120),
      life: 1,
      maxLife: rand(0.3, 0.8),
      radius: rand(2, 5),
      color,
      alive: true,
    };
  }

  // ── 初始化 ──
  function initGame() {
    player1 = createTank(WORLD_W / 2 - 100, WORLD_H / 2, '#e53935', '#b71c1c', true);
    player1.id = 1;
    player1.invulnerable = 2;

    if (gameMode === 'single') {
      player2 = createTank(-999, -999, '#4caf50', '#2e7d32', true);
      player2.id = 2;
      player2.alive = false;
      p2JoystickBase.style.display = 'none';
      if (hudRight) hudRight.style.display = 'none';
    } else {
      player2 = createTank(WORLD_W / 2 + 100, WORLD_H / 2, '#4caf50', '#2e7d32', true);
      player2.id = 2;
      player2.invulnerable = 2;
      p2JoystickBase.style.display = '';
      if (hudRight) hudRight.style.display = '';
    }

    enemies = [];
    bullets = [];
    particles = [];
    powerups = [];
    powerupSpawnTimer = 2000;
    p1Score = 0;
    p2Score = 0;
    bossKillsCounter = 0;
    gameOver = false;
    gameRunning = false;
    enemySpawnTimer = 2000;
    p1ScoreDisplay.textContent = '0';
    p2ScoreDisplay.textContent = '0';
    gameOverOverlay.classList.remove('show');
    updateHpBar();
    helpText.style.opacity = '1';

    startCountdown();
  }

  function isGameOver() {
    if (gameMode === 'single') return !player1.alive;
    return !player1.alive && !player2.alive;
  }

  function startCountdown() {
    let count = 3;
    countdownEl.textContent = count;
    countdownEl.classList.add('show');

    const tick = setInterval(function() {
      count--;
      if (count > 0) {
        countdownEl.textContent = count;
      } else if (count === 0) {
        countdownEl.textContent = '开始!';
      } else {
        clearInterval(tick);
        countdownEl.classList.remove('show');
        gameRunning = true;
        helpText.style.opacity = '0';
      }
    }, 800);
  }

  // ── 摇杆 ──
  function initJoystick() {
    function getJoystickByTouchId(id) {
      if (joy1.active && joy1.id === id) return { joy: joy1, base: p1JoystickBase, knob: p1JoystickKnob };
      if (joy2.active && joy2.id === id) return { joy: joy2, base: p2JoystickBase, knob: p2JoystickKnob };
      return null;
    }

    function startJoystick(id, cx, cy) {
      if (!gameRunning || gameOver) return;
      const isLeft = cx < window.innerWidth / 2;
      if (isLeft) {
        if (joy1.active) return;
        joy1.active = true;
        joy1.id = id;
        p1JoystickBase.classList.add('active');
        moveJoystick(id, cx, cy);
      } else {
        if (joy2.active) return;
        joy2.active = true;
        joy2.id = id;
        p2JoystickBase.classList.add('active');
        moveJoystick(id, cx, cy);
      }
    }

    function moveJoystick(id, cx, cy) {
      const match = getJoystickByTouchId(id);
      if (!match) return;
      const { joy, base, knob } = match;
      const dx = cx - joy.cx;
      const dy = cy - joy.cy;
      const len = Math.sqrt(dx * dx + dy * dy);
      
      if (len > 8) {
        joy.dx = dx / len;
        joy.dy = dy / len;
      } else {
        joy.dx = 0;
        joy.dy = 0;
      }

      let knobX = dx;
      let knobY = dy;
      if (len > JOYSTICK_RADIUS) {
        knobX = (dx / len) * JOYSTICK_RADIUS;
        knobY = (dy / len) * JOYSTICK_RADIUS;
      }
      knob.style.transform = `translate(${knobX}px, ${knobY}px)`;
    }

    function endJoystick(id) {
      const match = getJoystickByTouchId(id);
      if (!match) return;
      const { joy, base, knob } = match;
      joy.active = false;
      joy.id = null;
      joy.dx = 0;
      joy.dy = 0;
      base.classList.remove('active');
      knob.style.transform = 'translate(0px, 0px)';
    }

    // Touch
    joystickLayer.addEventListener('touchstart', function(e) {
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        startJoystick(t.identifier, t.clientX, t.clientY);
      }
    }, { passive: true });

    joystickLayer.addEventListener('touchmove', function(e) {
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        moveJoystick(t.identifier, t.clientX, t.clientY);
      }
    }, { passive: true });

    function handleTouchEnd(e) {
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        endJoystick(t.identifier);
      }
    }
    joystickLayer.addEventListener('touchend', handleTouchEnd, { passive: true });
    joystickLayer.addEventListener('touchcancel', handleTouchEnd, { passive: true });

    // Mouse
    joystickLayer.addEventListener('mousedown', function(e) {
      startJoystick('mouse', e.clientX, e.clientY);
    });

    window.addEventListener('mousemove', function(e) {
      moveJoystick('mouse', e.clientX, e.clientY);
    });

    window.addEventListener('mouseup', function(e) {
      endJoystick('mouse');
    });
  }

  // ── 生成敌人 ──
  function spawnEnemy() {
    if (!gameRunning || gameOver) return;
    if (enemies.length >= MAX_ENEMIES) return;

    // 从边缘随机位置生成
    const side = randInt(0, 3);
    let x, y;
    const margin = 40;
    switch (side) {
      case 0: // top
        x = rand(margin, WORLD_W - margin);
        y = margin;
        break;
      case 1: // right
        x = WORLD_W - margin;
        y = rand(margin, WORLD_H - margin);
        break;
      case 2: // bottom
        x = rand(margin, WORLD_W - margin);
        y = WORLD_H - margin;
        break;
      case 3: // left
        x = margin;
        y = rand(margin, WORLD_H - margin);
        break;
    }

    const enemy = createTank(x, y, '#1e88e5', '#0d47a1', false);

    // 随着击杀数增加，敌人更强
    const combinedScore = p1Score + p2Score;
    enemy.hp = 1;                            // 一枪倒
    enemy.fireInterval = ENEMY_FIRE_MS + rand(-300, 300);
    enemy.speed = ENEMY_SPEED;

    enemies.push(enemy);
  }

  // ── 生成 Boss ──
  function spawnBoss() {
    if (!gameRunning || gameOver) return;

    const side = randInt(0, 3);
    let x, y;
    const margin = 80;
    switch (side) {
      case 0: x = rand(margin, WORLD_W - margin); y = margin; break;
      case 1: x = WORLD_W - margin; y = rand(margin, WORLD_H - margin); break;
      case 2: x = rand(margin, WORLD_W - margin); y = WORLD_H - margin; break;
      case 3: x = margin; y = rand(margin, WORLD_H - margin); break;
    }

    const boss = createTank(x, y, '#d32f2f', '#b71c1c', false);
    boss.isBoss = true;
    boss.hp = 30;
    boss.maxHp = 30;
    boss.radius = TANK_RADIUS * 2.5;
    boss.fireInterval = 500;
    boss.speed = ENEMY_SPEED * 0.6;
    boss.lastFlowerTime = performance.now();

    enemies.push(boss);
    
    createTextParticle(WORLD_W / 2, WORLD_H / 2 - 100, "WARNING: BOSS APPROACHING", "#ff5252");
  }

  // ── 道具生成 ──
  function spawnPowerup() {
    if (!gameRunning || gameOver) return;
    const margin = 60;
    const x = rand(margin, WORLD_W - margin);
    const y = rand(margin, WORLD_H - margin);
    const types = ['fireRate', 'bulletCount', 'moveSpeed', 'recovery'];
    const type = types[randInt(0, 3)];

    powerups.push({
      x, y,
      radius: 14,
      type: type,
      alive: true,
      pulseTimer: 0
    });
  }

  function createTextParticle(x, y, text, color) {
    particles.push({
      x, y,
      vx: rand(-15, 15),
      vy: rand(-40, -25),
      life: 1.5,
      maxLife: 1.5,
      text: text,
      color: color,
      isText: true,
      alive: true
    });
  }

  // ── 开火 ──
  function fireBullet(tank, targetAngle) {
    const baseAngle = targetAngle !== undefined ? targetAngle : tank.angle;
    const extra = Math.min(2, tank.extraBullets || 0);
    
    let offsets = [0];
    if (extra === 1) {
      offsets = [-15 * Math.PI / 180, 15 * Math.PI / 180];
    } else if (extra === 2) {
      offsets = [-30 * Math.PI / 180, 0, 30 * Math.PI / 180];
    }

    for (let i = 0; i < offsets.length; i++) {
      const a = baseAngle + offsets[i];
      const bx = tank.x + Math.cos(a) * (tank.radius + BULLET_RADIUS + 2);
      const by = tank.y + Math.sin(a) * (tank.radius + BULLET_RADIUS + 2);
      const b = createBullet(bx, by, a, tank);
      bullets.push(b);
    }
    tank.lastFireTime = performance.now();
  }

  // ── 粒子爆炸 ──
  function explode(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      particles.push(createParticle(x, y, color));
    }
  }

  // ── Update ──
  function update(dt) {
    if (!gameRunning || gameOver) return;

    const now = performance.now();

    // 0. 更新无敌状态与复活倒计时
    if (player1.alive && player1.invulnerable > 0) {
      player1.invulnerable -= dt;
    }
    if (player2.alive && player2.invulnerable > 0) {
      player2.invulnerable -= dt;
    }

    // 0.1 更新与检查道具
    powerupSpawnTimer -= dt * 1000;
    if (powerupSpawnTimer <= 0) {
      spawnPowerup();
      powerupSpawnTimer = 10000;
    }
    
    for (const p of powerups) {
      if (!p.alive) continue;
      
      const checkCollection = (tank) => {
        if (!p.alive) return;
        if (tank.alive && dist(p, tank) < tank.radius + p.radius) {
          p.alive = false;
          let effectText = "";
          let effectColor = "#fff";
          
          if (p.type === 'fireRate') {
            tank.fireInterval = Math.max(tank.baseFireInterval * 0.5, tank.fireInterval * 0.9);
            effectText = "攻速 +10%";
            effectColor = "#ea80fc";
          } else if (p.type === 'bulletCount') {
            tank.extraBullets = Math.min(2, (tank.extraBullets || 0) + 1);
            effectText = "弹道 +1";
            effectColor = "#ffd180";
          } else if (p.type === 'moveSpeed') {
            tank.speed = Math.min(tank.baseSpeed * 1.3, tank.speed * 1.05);
            effectText = "移速 +5%";
            effectColor = "#eeff41";
          } else if (p.type === 'recovery') {
            if (tank.hp < tank.maxHp) {
              tank.hp = Math.min(tank.maxHp, tank.hp + 1);
              effectText = "生命 +1";
              effectColor = "#69f0ae";
              if (tank.isPlayer) updateHpBar();
            } else {
              tank.shield = true;
              effectText = "护盾激活!";
              effectColor = "#00e5ff";
            }
          }
          
          createTextParticle(tank.x, tank.y - 20, effectText, effectColor);
          explode(p.x, p.y, effectColor, 15);
        }
      };

      if (player1) checkCollection(player1);
      if (player2) checkCollection(player2);
      for (const e of enemies) checkCollection(e);
    }

    // 1. 玩家移动
    // P1
    if (player1.alive) {
      let dx = 0, dy = 0;
      if (joy1.active && (joy1.dx !== 0 || joy1.dy !== 0)) {
        dx = joy1.dx;
        dy = joy1.dy;
      }
      let kx = 0, ky = 0;
      if (keys['KeyW']) ky -= 1;
      if (keys['KeyS']) ky += 1;
      if (keys['KeyA']) kx -= 1;
      if (keys['KeyD']) kx += 1;
      const klen = Math.sqrt(kx * kx + ky * ky);
      if (klen > 0) {
        dx = kx / klen;
        dy = ky / klen;
      }

      if (dx !== 0 || dy !== 0) {
        const speed = player1.speed * dt;
        let nx = player1.x + dx * speed;
        let ny = player1.y + dy * speed;
        player1.x = clamp(nx, TANK_RADIUS, WORLD_W - TANK_RADIUS);
        player1.y = clamp(ny, TANK_RADIUS, WORLD_H - TANK_RADIUS);
        player1.angle = Math.atan2(dy, dx);
      }
    }

    // P2
    if (player2.alive) {
      let dx = 0, dy = 0;
      if (joy2.active && (joy2.dx !== 0 || joy2.dy !== 0)) {
        dx = joy2.dx;
        dy = joy2.dy;
      }
      let kx = 0, ky = 0;
      if (keys['ArrowUp']) ky -= 1;
      if (keys['ArrowDown']) ky += 1;
      if (keys['ArrowLeft']) kx -= 1;
      if (keys['ArrowRight']) kx += 1;
      const klen = Math.sqrt(kx * kx + ky * ky);
      if (klen > 0) {
        dx = kx / klen;
        dy = ky / klen;
      }

      if (dx !== 0 || dy !== 0) {
        const speed = player2.speed * dt;
        let nx = player2.x + dx * speed;
        let ny = player2.y + dy * speed;
        player2.x = clamp(nx, TANK_RADIUS, WORLD_W - TANK_RADIUS);
        player2.y = clamp(ny, TANK_RADIUS, WORLD_H - TANK_RADIUS);
        player2.angle = Math.atan2(dy, dx);
      }
    }

    // 2. 玩家自动开火
    if (player1.alive && now - player1.lastFireTime >= player1.fireInterval) {
      fireBullet(player1);
    }
    if (player2.alive && now - player2.lastFireTime >= player2.fireInterval) {
      fireBullet(player2);
    }

    // 3. 敌人 AI — 随机游走，寻找最近玩家
    for (const e of enemies) {
      if (!e.alive) continue;

      // 切换随机方向
      e.aiTimer = (e.aiTimer || 0) - dt;
      if (e.aiTimer <= 0) {
        e.moveDir = rand(0, Math.PI * 2);
        e.aiTimer = rand(1.5, 4);
      }

      const speed = e.speed * dt;
      let nx = e.x + Math.cos(e.moveDir) * speed;
      let ny = e.y + Math.sin(e.moveDir) * speed;
      nx = clamp(nx, TANK_RADIUS, WORLD_W - TANK_RADIUS);
      ny = clamp(ny, TANK_RADIUS, WORLD_H - TANK_RADIUS);

      if (nx === TANK_RADIUS || nx === WORLD_W - TANK_RADIUS ||
          ny === TANK_RADIUS || ny === WORLD_H - TANK_RADIUS) {
        e.moveDir = rand(0, Math.PI * 2);
        e.aiTimer = rand(1, 2);
      }

      e.x = nx;
      e.y = ny;
      e.angle = e.moveDir;

      // 寻找最近玩家开火
      let target = null;
      let minDist = Infinity;
      if (player1.alive) {
        const d1 = dist(e, player1);
        if (d1 < minDist) { minDist = d1; target = player1; }
      }
      if (player2.alive) {
        const d2 = dist(e, player2);
        if (d2 < minDist) { minDist = d2; target = player2; }
      }

      if (target && minDist < 500 && now - e.lastFireTime >= e.fireInterval) {
        const spread = rand(-0.3, 0.3);
        fireBullet(e, e.angle + spread);
      }

      if (e.isBoss && now - e.lastFlowerTime >= 3000) {
        e.lastFlowerTime = now;
        for (let i = 0; i < 18; i++) {
          const a = i * (Math.PI * 2 / 18);
          const bx = e.x + Math.cos(a) * (e.radius + BULLET_RADIUS + 2);
          const by = e.y + Math.sin(a) * (e.radius + BULLET_RADIUS + 2);
          const b = createBullet(bx, by, a, e);
          bullets.push(b);
        }
      }
    }

    // 4. 生成敌人
    enemySpawnTimer -= dt * 1000;
    if (enemySpawnTimer <= 0) {
      spawnEnemy();
      const spawnRate = Math.max(600, ENEMY_SPAWN_MS - (p1Score + p2Score) * 40);
      enemySpawnTimer = spawnRate;
    }

    // 5. 子弹更新
    for (const b of bullets) {
      if (!b.alive) continue;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life += dt;
      if (b.x < -50 || b.x > WORLD_W + 50 || b.y < -50 || b.y > WORLD_H + 50 || b.life >= b.maxLife) {
        b.alive = false;
        continue;
      }
    }

    // 6. 碰撞检测 - 子弹 vs 坦克
    for (const b of bullets) {
      if (!b.alive) continue;

      if (b.isPlayer) {
        // 玩家子弹 → 敌人
        for (const e of enemies) {
          if (!e.alive) continue;
          if (dist(b, e) < e.radius + b.radius) {
            b.alive = false;
            if (e.shield) {
              e.shield = false;
              explode(e.x, e.y, '#00e5ff', 15);
              break;
            }
            e.hp--;
            e.hitFlash = 0.15;
            if (e.hp <= 0) {
              e.alive = false;
              if (b.playerId === 1) {
                p1Score++;
                p1ScoreDisplay.textContent = p1Score;
              } else if (b.playerId === 2) {
                p2Score++;
                p2ScoreDisplay.textContent = p2Score;
              }
              if (!e.isBoss) {
                bossKillsCounter++;
                if (bossKillsCounter >= 30) {
                  bossKillsCounter = 0;
                  spawnBoss();
                }
              }
              explode(e.x, e.y, e.color, e.isBoss ? 50 : 20);
              explode(e.x, e.y, '#ffab00', e.isBoss ? 20 : 8);
            } else {
              explode(b.x, b.y, '#ffab00', 3);
            }
            break;
          }
        }
      } else {
        // 敌人子弹 → 玩家
        if (player1.alive && player1.invulnerable <= 0) {
          if (dist(b, player1) < TANK_RADIUS + b.radius) {
            b.alive = false;
            if (player1.shield) {
              player1.shield = false;
              explode(player1.x, player1.y, '#00e5ff', 15);
              continue;
            }
            player1.hp--;
            player1.hitFlash = 0.15;
            updateHpBar();
            explode(b.x, b.y, '#ff1744', 5);

            if (player1.hp <= 0) {
              player1.alive = false;
              explode(player1.x, player1.y, player1.color, 30);
              explode(player1.x, player1.y, '#ffab00', 15);
              if (isGameOver()) {
                endGame();
                return;
              }
            }
          }
        }

        if (b.alive && player2.alive && player2.invulnerable <= 0) {
          if (dist(b, player2) < TANK_RADIUS + b.radius) {
            b.alive = false;
            if (player2.shield) {
              player2.shield = false;
              explode(player2.x, player2.y, '#00e5ff', 15);
              continue;
            }
            player2.hp--;
            player2.hitFlash = 0.15;
            updateHpBar();
            explode(b.x, b.y, '#ff1744', 5);

            if (player2.hp <= 0) {
              player2.alive = false;
              explode(player2.x, player2.y, player2.color, 30);
              explode(player2.x, player2.y, '#ffab00', 15);
              if (isGameOver()) {
                endGame();
                return;
              }
            }
          }
        }
      }
    }

    // 7. 敌人 vs 玩家碰撞
    for (const e of enemies) {
      if (!e.alive) continue;
      if (player1.alive) {
        const d = dist(e, player1);
        if (d < TANK_RADIUS * 2) {
          const overlap = TANK_RADIUS * 2 - d;
          const a = angle(e, player1);
          player1.x -= Math.cos(a) * overlap * 0.5;
          player1.y -= Math.sin(a) * overlap * 0.5;
          e.x += Math.cos(a) * overlap * 0.5;
          e.y += Math.sin(a) * overlap * 0.5;
          player1.x = clamp(player1.x, TANK_RADIUS, WORLD_W - TANK_RADIUS);
          player1.y = clamp(player1.y, TANK_RADIUS, WORLD_H - TANK_RADIUS);
          e.x = clamp(e.x, TANK_RADIUS, WORLD_W - TANK_RADIUS);
          e.y = clamp(e.y, TANK_RADIUS, WORLD_H - TANK_RADIUS);
        }
      }
      if (player2.alive) {
        const d = dist(e, player2);
        if (d < TANK_RADIUS * 2) {
          const overlap = TANK_RADIUS * 2 - d;
          const a = angle(e, player2);
          player2.x -= Math.cos(a) * overlap * 0.5;
          player2.y -= Math.sin(a) * overlap * 0.5;
          e.x += Math.cos(a) * overlap * 0.5;
          e.y += Math.sin(a) * overlap * 0.5;
          player2.x = clamp(player2.x, TANK_RADIUS, WORLD_W - TANK_RADIUS);
          player2.y = clamp(player2.y, TANK_RADIUS, WORLD_H - TANK_RADIUS);
          e.x = clamp(e.x, TANK_RADIUS, WORLD_W - TANK_RADIUS);
          e.y = clamp(e.y, TANK_RADIUS, WORLD_H - TANK_RADIUS);
        }
      }
    }

    // 玩家 vs 玩家碰撞
    if (player1.alive && player2.alive) {
      const d = dist(player1, player2);
      if (d < TANK_RADIUS * 2) {
        const overlap = TANK_RADIUS * 2 - d;
        const a = angle(player1, player2);
        player1.x -= Math.cos(a) * overlap * 0.5;
        player1.y -= Math.sin(a) * overlap * 0.5;
        player2.x += Math.cos(a) * overlap * 0.5;
        player2.y += Math.sin(a) * overlap * 0.5;
        player1.x = clamp(player1.x, TANK_RADIUS, WORLD_W - TANK_RADIUS);
        player1.y = clamp(player1.y, TANK_RADIUS, WORLD_H - TANK_RADIUS);
        player2.x = clamp(player2.x, TANK_RADIUS, WORLD_W - TANK_RADIUS);
        player2.y = clamp(player2.y, TANK_RADIUS, WORLD_H - TANK_RADIUS);
      }
    }

    // 8. 敌人 vs 敌人碰撞
    for (let i = 0; i < enemies.length; i++) {
      for (let j = i + 1; j < enemies.length; j++) {
        const a = enemies[i], b = enemies[j];
        if (!a.alive || !b.alive) continue;
        const d = dist(a, b);
        if (d < TANK_RADIUS * 2) {
          const overlap = TANK_RADIUS * 2 - d;
          const ang = angle(a, b);
          a.x -= Math.cos(ang) * overlap * 0.5;
          a.y -= Math.sin(ang) * overlap * 0.5;
          b.x += Math.cos(ang) * overlap * 0.5;
          b.y += Math.sin(ang) * overlap * 0.5;
        }
      }
    }

    // 9. 更新粒子
    for (const p of particles) {
      if (!p.alive) continue;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) p.alive = false;
    }

    // 10. 更新 hitFlash
    if (player1.hitFlash > 0) player1.hitFlash -= dt;
    if (player2.hitFlash > 0) player2.hitFlash -= dt;
    for (const e of enemies) {
      if (e.hitFlash > 0) e.hitFlash -= dt;
    }

    // 11. 清理死亡实体
    enemies = enemies.filter(function(e) { return e.alive; });
    bullets = bullets.filter(function(b) { return b.alive; });
    particles = particles.filter(function(p) { return p.alive; });
    powerups = powerups.filter(function(p) { return p.alive; });
  }

  // ── 游戏结束 ──
  function endGame() {
    gameOver = true;
    gameRunning = false;
    p1FinalScore.textContent = p1Score;
    p2FinalScore.textContent = p2Score;
    finalScore.textContent = p1Score + p2Score;
    gameOverOverlay.classList.add('show');
  }

  // ── 渲染 ──
  function render() {
    const cw = canvas.width;
    const ch = canvas.height;
    ctx.clearRect(0, 0, cw, ch);

    // 背景
    ctx.fillStyle = '#2a4a2a';
    ctx.fillRect(0, 0, cw, ch);

    ctx.save();

    // 摄像机偏移
    const ox = -cam.x;
    const oy = -cam.y;

    // 网格线
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    const gridSize = 80;
    const startX = Math.floor(cam.x / gridSize) * gridSize;
    const startY = Math.floor(cam.y / gridSize) * gridSize;
    for (let x = startX; x < cam.x + cw + gridSize; x += gridSize) {
      ctx.beginPath();
      ctx.moveTo(x + ox, Math.max(0, cam.y) + oy);
      ctx.lineTo(x + ox, Math.min(WORLD_H, cam.y + ch) + oy);
      ctx.stroke();
    }
    for (let y = startY; y < cam.y + ch + gridSize; y += gridSize) {
      ctx.beginPath();
      ctx.moveTo(Math.max(0, cam.x) + ox, y + oy);
      ctx.lineTo(Math.min(WORLD_W, cam.x + cw) + ox, y + oy);
      ctx.stroke();
    }

    // 边界
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 2;
    ctx.strokeRect(ox, oy, WORLD_W, WORLD_H);

    // 道具
    const time = performance.now();
    for (const p of powerups) {
      if (!p.alive) continue;
      const sx = p.x + ox;
      const sy = p.y + oy;
      p.pulseTimer += 0.05;
      const pulseScale = 1 + Math.sin(p.pulseTimer) * 0.15;
      
      let baseColor;
      if (p.type === 'fireRate') baseColor = '#ea80fc';
      else if (p.type === 'bulletCount') baseColor = '#ffd180';
      else if (p.type === 'moveSpeed') baseColor = '#eeff41';
      else if (p.type === 'recovery') baseColor = '#69f0ae';
      
      // 发光圈
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = baseColor;
      ctx.beginPath();
      ctx.arc(sx, sy, p.radius * pulseScale * 1.5, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(sx, sy, p.radius, 0, Math.PI * 2);
      ctx.fill();
      
      // 图标绘制
      ctx.save();
      ctx.translate(sx, sy);
      if (p.type === 'fireRate') {
        // 闪电 + 子弹
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(-3, -1, 2.5, Math.PI, 0);
        ctx.lineTo(-0.5, 5);
        ctx.lineTo(-5.5, 5);
        ctx.fill();
        ctx.fillStyle = '#ff9800'; // 闪电
        ctx.beginPath();
        ctx.moveTo(3, -5); ctx.lineTo(-1, 0); ctx.lineTo(2, 0);
        ctx.lineTo(-1, 6); ctx.lineTo(6, -1); ctx.lineTo(2, -1); ctx.fill();
      } else if (p.type === 'bulletCount') {
        // 两个子弹
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(-3.5, -2, 2.5, Math.PI, 0);
        ctx.lineTo(-1, 5); ctx.lineTo(-6, 5); ctx.fill();
        ctx.beginPath();
        ctx.arc(3.5, -2, 2.5, Math.PI, 0);
        ctx.lineTo(6, 5); ctx.lineTo(1, 5); ctx.fill();
      } else if (p.type === 'moveSpeed') {
        // 闪电 + 坦克
        ctx.fillStyle = '#000';
        ctx.fillRect(-6, -1, 6, 6);
        ctx.fillRect(-8, -3, 2, 10);
        ctx.fillRect(-2, -3, 2, 10);
        ctx.fillRect(-4, -4, 2, 3);
        ctx.fillStyle = '#ff9800'; // 闪电
        ctx.beginPath();
        ctx.moveTo(4, -5); ctx.lineTo(0, 0); ctx.lineTo(3, 0);
        ctx.lineTo(0, 6); ctx.lineTo(7, -1); ctx.lineTo(3, -1); ctx.fill();
      } else if (p.type === 'recovery') {
        // 十字
        ctx.fillStyle = '#000';
        ctx.fillRect(-5, -1.5, 10, 3);
        ctx.fillRect(-1.5, -5, 3, 10);
      }
      ctx.restore();
    }

    // 粒子
    for (const p of particles) {
      const alpha = p.life / p.maxLife;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      if (p.isText) {
        ctx.font = 'bold 14px "Arial"';
        ctx.textAlign = 'center';
        ctx.fillText(p.text, p.x + ox, p.y + oy);
      } else {
        ctx.beginPath();
        ctx.arc(p.x + ox, p.y + oy, p.radius * alpha, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // 子弹
    for (const b of bullets) {
      const sx = b.x + ox;
      const sy = b.y + oy;
      // 发光效果
      const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, b.radius * 3);
      let bulletGlow = '#ff1744';
      let bulletGradStop = 'rgba(255,23,68,0.5)';
      if (b.isPlayer) {
        if (b.playerId === 1) {
          bulletGlow = '#ffab00';
          bulletGradStop = 'rgba(255,171,0,0.6)';
        } else {
          bulletGlow = '#66bb6a';
          bulletGradStop = 'rgba(102,187,106,0.6)';
        }
      }
      grad.addColorStop(0, bulletGlow);
      grad.addColorStop(0.4, bulletGradStop);
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(sx, sy, b.radius * 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = b.isPlayer ? (b.playerId === 1 ? '#fff8e1' : '#e8f5e9') : '#fff';
      ctx.beginPath();
      ctx.arc(sx, sy, b.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    // 敌人
    for (const e of enemies) {
      drawTank(e, ox, oy);
    }

    // 玩家 1
    if (player1.alive) {
      ctx.save();
      if (player1.invulnerable > 0) {
        ctx.globalAlpha = 0.4 + Math.sin(performance.now() / 50) * 0.2; // 幽灵闪烁无敌效果
      }
      drawTank(player1, ox, oy);
      ctx.restore();
      drawPlayerAura(player1, ox, oy);
    }

    // 玩家 2
    if (player2.alive) {
      ctx.save();
      if (player2.invulnerable > 0) {
        ctx.globalAlpha = 0.4 + Math.sin(performance.now() / 50) * 0.2;
      }
      drawTank(player2, ox, oy);
      ctx.restore();
      drawPlayerAura(player2, ox, oy);
    }

    ctx.restore();
  }

  // ── 画坦克 ──
  function drawTank(tank, ox, oy) {
    const sx = tank.x + ox;
    const sy = tank.y + oy;
    const r = tank.radius;

    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(tank.angle);

    // 履带（两侧）
    ctx.fillStyle = tank.darkColor;
    ctx.fillRect(-r - 3, -r - 2, 6, r * 2 + 4);
    ctx.fillRect(r - 3, -r - 2, 6, r * 2 + 4);

    // 车身（圆角矩形）
    const bodyColor = tank.hitFlash > 0 ? '#fff' : tank.color;
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.roundRect(-r + 2, -r + 2, r * 2 - 4, r * 2 - 4, 5);
    ctx.fill();

    // 车身边框
    ctx.strokeStyle = tank.darkColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(-r + 2, -r + 2, r * 2 - 4, r * 2 - 4, 5);
    ctx.stroke();

    // 炮塔底座
    let turretColor = '#90caf9';
    if (tank.isPlayer) {
      turretColor = tank.id === 1 ? '#ff8a80' : '#a5d6a7';
    }
    ctx.fillStyle = tank.hitFlash > 0 ? '#eee' : turretColor;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = tank.darkColor;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 炮管
    const barrelLen = r + 8;
    ctx.strokeStyle = tank.darkColor;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(barrelLen, 0);
    ctx.stroke();

    // 炮口
    ctx.fillStyle = tank.hitFlash > 0 ? '#ddd' : '#444';
    ctx.beginPath();
    ctx.arc(barrelLen, 0, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    if (tank.shield) {
      ctx.save();
      ctx.globalAlpha = 0.5 + Math.sin(performance.now() / 150) * 0.2;
      ctx.strokeStyle = '#00e5ff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(sx, sy, r + 6, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = 'rgba(0, 229, 255, 0.1)';
      ctx.fill();
      ctx.restore();
    }

    if (tank.isBoss) {
      const barW = 80;
      const barH = 8;
      const hpRatio = Math.max(0, tank.hp / tank.maxHp);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
      ctx.fillRect(sx - barW / 2, sy - r - 20, barW, barH);
      ctx.fillStyle = '#ff1744';
      ctx.fillRect(sx - barW / 2 + 1, sy - r - 19, (barW - 2) * hpRatio, barH - 2);
    }
  }

  // ── 玩家光圈 ──
  function drawPlayerAura(tank, ox, oy) {
    const sx = tank.x + ox;
    const sy = tank.y + oy;
    const r = TANK_RADIUS + 8;
    const color = tank.id === 1 ? '#e53935' : '#4caf50';

    ctx.save();
    ctx.globalAlpha = 0.2 + Math.sin(performance.now() / 300) * 0.08;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 8]);
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  // ── 游戏循环 ──
  function gameLoop(time) {
    const dt = Math.min((time - (lastTime || time)) / 1000, 0.05);
    lastTime = time;

    updateCamera();
    update(dt);
    render();

    requestAnimationFrame(gameLoop);
  }

  // ── 重新开始 ──
  restartBtn.addEventListener('click', function() {
    startMenu.classList.remove('hidden');
  });

  // ── 模式选择逻辑 ──
  function startWithMode(mode) {
    gameMode = mode;
    startMenu.classList.add('hidden');
    initGame();
  }

  document.getElementById('btnSingle').addEventListener('click', function() {
    startWithMode('single');
  });
  document.getElementById('btnLocal').addEventListener('click', function() {
    startWithMode('local');
  });

  // ── 启动 ──
  // polyfill roundRect
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii) {
      const r = typeof radii === 'number' ? radii : (radii || 0);
      this.moveTo(x + r, y);
      this.lineTo(x + w - r, y);
      this.quadraticCurveTo(x + w, y, x + w, y + r);
      this.lineTo(x + w, y + h - r);
      this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      this.lineTo(x + r, y + h);
      this.quadraticCurveTo(x, y + h, x, y + h - r);
      this.lineTo(x, y + r);
      this.quadraticCurveTo(x, y, x + r, y);
      return this;
    };
  }

  initJoystick();
  requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
