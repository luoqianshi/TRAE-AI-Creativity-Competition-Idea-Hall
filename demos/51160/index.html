<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>微光日记 - 一句话记录每一天</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-primary: #0f0f1a;
      --bg-card: #1a1a2e;
      --bg-hover: #252542;
      --accent: #e94560;
      --accent-light: #ff6b81;
      --text-primary: #f0f0f5;
      --text-secondary: #8b8ba7;
      --border: #2a2a45;
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    .app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    /* 导航 */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: var(--bg-card);
      border-radius: var(--radius);
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }

    .nav-actions {
      display: flex;
      gap: 12px;
    }

    .btn-report {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.3s;
    }

    .btn-report:hover {
      background: var(--accent-light);
      transform: translateY(-2px);
    }

    .btn-demo {
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--accent);
      padding: 10px 24px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.3s;
    }

    .btn-demo:hover {
      background: var(--accent);
      color: white;
    }

    /* 主布局 */
    .main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    /* 日历 */
    .calendar-section {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .calendar-header button {
      background: var(--bg-hover);
      border: none;
      color: var(--text-primary);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.2s;
    }

    .calendar-header button:hover {
      background: var(--accent);
    }

    .calendar-header h2 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .day-header {
      text-align: center;
      padding: 10px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .day-cell {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      background: var(--bg-hover);
    }

    .day-cell:hover {
      background: var(--border);
      transform: scale(1.05);
    }

    .day-cell.selected {
      background: var(--accent);
    }

    .day-cell.has-entry::after {
      content: '';
      position: absolute;
      bottom: 6px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-light);
    }

    .day-cell .day-number {
      font-size: 0.95rem;
      font-weight: 500;
    }

    .day-cell .day-mood {
      font-size: 1.2rem;
      margin-top: 2px;
    }

    .day-cell.today {
      border: 2px solid var(--accent);
    }

    /* 编辑器 */
    .editor-section {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .editor-date {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--accent);
    }

    .mood-selector {
      margin-bottom: 16px;
    }

    .mood-selector > span {
      display: block;
      margin-bottom: 10px;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .mood-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .mood-tag {
      background: var(--bg-hover);
      border: 2px solid transparent;
      color: var(--text-primary);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .mood-tag:hover {
      border-color: var(--accent);
    }

    .mood-tag.active {
      background: var(--accent);
      border-color: var(--accent);
    }

    textarea {
      width: 100%;
      background: var(--bg-hover);
      border: 2px solid var(--border);
      color: var(--text-primary);
      padding: 16px;
      border-radius: 12px;
      font-size: 1rem;
      resize: vertical;
      min-height: 80px;
      font-family: inherit;
      margin-bottom: 12px;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn-expand {
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--accent);
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      margin-bottom: 12px;
      transition: all 0.2s;
    }

    .btn-expand:hover {
      background: var(--accent);
      color: white;
    }

    .expanded-text {
      background: var(--bg-hover);
      border-left: 4px solid var(--accent);
      padding: 16px;
      border-radius: 0 12px 12px 0;
      margin-bottom: 16px;
      line-height: 1.7;
      color: var(--text-secondary);
      min-height: 50px;
    }

    .btn-save {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.3s;
    }

    .btn-save:hover {
      background: var(--accent-light);
      transform: translateY(-2px);
    }

    .empty-state {
      text-align: center;
      color: var(--text-secondary);
      padding: 40px 20px;
    }

    .empty-state .icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    /* 弹窗 */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 32px;
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      box-shadow: var(--shadow);
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin: 24px 0;
    }

    .stat-card {
      background: var(--bg-hover);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-number {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-label {
      margin-top: 4px;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .charts-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 24px;
    }

    .chart-container {
      background: var(--bg-hover);
      padding: 20px;
      border-radius: 12px;
    }

    .chart-container h3 {
      margin-bottom: 16px;
      font-size: 1rem;
      color: var(--text-secondary);
    }

    .word-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
      min-height: 200px;
    }

    .word-item {
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 500;
      transition: transform 0.2s;
    }

    .word-item:hover {
      transform: scale(1.1);
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .main {
        grid-template-columns: 1fr;
      }

      .charts-row {
        grid-template-columns: 1fr;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .nav {
        flex-direction: column;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 导航 -->
    <nav class="nav">
      <div class="logo">✨ 微光日记</div>
      <div class="nav-actions">
        <button class="btn-demo" onclick="loadDemoData()">加载演示数据</button>
        <button class="btn-report" onclick="showReport()">月度报告</button>
      </div>
    </nav>

    <!-- 主内容 -->
    <main class="main">
      <!-- 日历区域 -->
      <section class="calendar-section">
        <div class="calendar-header">
          <button onclick="changeMonth(-1)">&#8249;</button>
          <h2 id="monthTitle">2026年6月</h2>
          <button onclick="changeMonth(1)">&#8250;</button>
        </div>
        <div class="calendar-grid" id="calendarGrid">
          <!-- JS 生成 -->
        </div>
      </section>

      <!-- 日记编辑区域 -->
      <section class="editor-section" id="editorSection">
        <div id="editorContent">
          <div class="editor-date" id="editorDate">请选择日期</div>
          <div class="mood-selector">
            <span>今天的心情：</span>
            <div class="mood-tags">
              <button class="mood-tag" data-mood="happy">&#128522; 开心</button>
              <button class="mood-tag" data-mood="calm">&#128524; 平静</button>
              <button class="mood-tag" data-mood="tired">&#128564; 疲惫</button>
              <button class="mood-tag" data-mood="excited">&#129321; 激动</button>
              <button class="mood-tag" data-mood="sad">&#128546; 低落</button>
            </div>
          </div>
          <textarea id="sentenceInput" placeholder="用一句话记录今天..." rows="3"></textarea>
          <button class="btn-expand" onclick="expandSentence()">&#10024; AI 帮我扩展</button>
          <div class="expanded-text" id="expandedText"></div>
          <button class="btn-save" onclick="saveDiary()">保存日记</button>
        </div>
      </section>
    </main>

    <!-- 月度报告弹窗 -->
    <div class="modal" id="reportModal">
      <div class="modal-content">
        <button class="modal-close" onclick="closeReport()">&#215;</button>
        <h2>&#128202; 月度心情报告</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-number" id="totalDays">0</div>
            <div class="stat-label">坚持天数</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="totalWords">0</div>
            <div class="stat-label">记录字数</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="topMood">-</div>
            <div class="stat-label">本月主情绪</div>
          </div>
        </div>
        <div class="charts-row">
          <div class="chart-container">
            <h3>情绪分布</h3>
            <canvas id="moodChart"></canvas>
          </div>
          <div class="chart-container">
            <h3>高频关键词</h3>
            <div class="word-cloud" id="wordCloud"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ========== 配置 ==========
    const STORAGE_KEY = 'glow-diary-data';

    const moodConfig = {
      happy: { emoji: '😊', label: '开心', color: '#fbbf24' },
      calm: { emoji: '😌', label: '平静', color: '#60a5fa' },
      tired: { emoji: '😴', label: '疲惫', color: '#a78bfa' },
      excited: { emoji: '🤩', label: '激动', color: '#f472b6' },
      sad: { emoji: '😢', label: '低落', color: '#6b7280' }
    };

    const expandTemplates = {
      happy: (s) => `今天真是开心的一天，${s}。阳光仿佛都变得更温暖了，嘴角忍不住上扬，希望这样的好心情能一直延续下去。`,
      calm: (s) => `今天过得平静而充实，${s}。生活不必总是波澜壮阔，这样温柔的节奏反而让人感到踏实和安心。`,
      tired: (s) => `虽然身体有些疲惫，但${s}。今晚一定要好好休息，让身心都得到放松，明天又是充满可能的一天。`,
      excited: (s) => `太激动了！${s}。这种心跳加速的感觉真好，为自己的努力感到骄傲，期待更多精彩时刻的到来！`,
      sad: (s) => `今天心情有些低落，${s}。但没关系，允许自己偶尔脆弱，每一种情绪都是生活的一部分，明天会好起来的。`
    };

    const stopWords = new Set(['的', '了', '在', '是', '我', '有', '和', '就', '不', '人', '都', '一', '一个', '上', '也', '很', '到', '说', '要', '去', '你', '会', '着', '没有', '看', '好', '自己', '这', '那', '今天', '明天', '现在', '一下', '感觉', '觉得', '不过', '因为', '所以', '还是', '但是', '这个', '那个', '什么', '怎么', '这么', '那么', '可以', '可能', '好像', '真的', '已经', '开始', '时候', '时间', '地方', '东西', '知道', '想到', '觉得']);

    // ========== 状态 ==========
    let currentDate = new Date();
    let selectedDate = null;
    let selectedMood = null;
    let moodChartInstance = null;

    // ========== 数据操作 ==========
    function getData() {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    }

    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // ========== 日历 ==========
    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      document.getElementById('monthTitle').textContent = `${year}年${month + 1}月`;

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
      weekDays.forEach(day => {
        const el = document.createElement('div');
        el.className = 'day-header';
        el.textContent = day;
        grid.appendChild(el);
      });

      const data = getData();
      const todayStr = formatDate(new Date());

      for (let i = 0; i < firstDay; i++) {
        grid.appendChild(document.createElement('div'));
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const cell = document.createElement('div');
        cell.className = 'day-cell';
        cell.dataset.date = dateStr;

        if (dateStr === todayStr) {
          cell.classList.add('today');
        }

        const entry = data[dateStr];
        if (entry) {
          cell.classList.add('has-entry');
          cell.innerHTML = `
            <span class="day-number">${day}</span>
            <span class="day-mood">${moodConfig[entry.mood]?.emoji || ''}</span>
          `;
        } else {
          cell.innerHTML = `<span class="day-number">${day}</span>`;
        }

        if (selectedDate === dateStr) {
          cell.classList.add('selected');
        }

        cell.addEventListener('click', () => selectDate(dateStr));
        grid.appendChild(cell);
      }
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    function formatDate(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    // ========== 编辑器 ==========
    function selectDate(dateStr) {
      selectedDate = dateStr;
      const data = getData();
      const entry = data[dateStr];

      document.getElementById('editorDate').textContent = dateStr;

      document.getElementById('sentenceInput').value = entry?.sentence || '';
      document.getElementById('expandedText').textContent = entry?.expanded || '';
      selectedMood = entry?.mood || null;

      document.querySelectorAll('.mood-tag').forEach(tag => {
        tag.classList.toggle('active', tag.dataset.mood === selectedMood);
      });

      renderCalendar();
    }

    // 情绪选择
    document.querySelectorAll('.mood-tag').forEach(tag => {
      tag.addEventListener('click', () => {
        document.querySelectorAll('.mood-tag').forEach(t => t.classList.remove('active'));
        tag.classList.add('active');
        selectedMood = tag.dataset.mood;
      });
    });

    // AI 扩展
    function expandSentence() {
      const sentence = document.getElementById('sentenceInput').value.trim();
      if (!sentence) {
        alert('请先输入一句话');
        return;
      }
      if (!selectedMood) {
        alert('请选择心情');
        return;
      }

      const template = expandTemplates[selectedMood];
      const expanded = template ? template(sentence) : sentence;

      // 打字机效果
      const el = document.getElementById('expandedText');
      el.textContent = '';
      let i = 0;
      const timer = setInterval(() => {
        el.textContent += expanded[i];
        i++;
        if (i >= expanded.length) clearInterval(timer);
      }, 20);
    }

    // 保存
    function saveDiary() {
      if (!selectedDate) {
        alert('请先选择日期');
        return;
      }

      const sentence = document.getElementById('sentenceInput').value.trim();
      if (!sentence) {
        alert('请输入日记内容');
        return;
      }

      const expanded = document.getElementById('expandedText').textContent;
      const data = getData();

      data[selectedDate] = {
        sentence,
        expanded: expanded || sentence,
        mood: selectedMood || 'calm',
        keywords: extractKeywords(sentence + ' ' + expanded)
      };

      saveData(data);
      renderCalendar();

      const btn = document.querySelector('.btn-save');
      const originalText = btn.textContent;
      btn.textContent = '✓ 已保存';
      setTimeout(() => btn.textContent = originalText, 1500);
    }

    // 关键词提取
    function extractKeywords(text) {
      const words = text.split(/[\s,，.。!！?？;；:：""''（）()【】\[\]]+/);
      const freq = {};
      words.forEach(w => {
        if (w.length >= 2 && !stopWords.has(w)) {
          freq[w] = (freq[w] || 0) + 1;
        }
      });
      return Object.entries(freq)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10)
        .map(([word]) => word);
    }

    // ========== 月度报告 ==========
    function showReport() {
      const data = getData();
      const currentMonthPrefix = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}`;

      const monthEntries = Object.entries(data).filter(([date]) => date.startsWith(currentMonthPrefix));

      document.getElementById('totalDays').textContent = monthEntries.length;

      let totalWords = 0;
      const moodCount = {};
      const allKeywords = [];

      monthEntries.forEach(([date, entry]) => {
        totalWords += (entry.sentence + entry.expanded).length;
        moodCount[entry.mood] = (moodCount[entry.mood] || 0) + 1;
        allKeywords.push(...(entry.keywords || []));
      });

      document.getElementById('totalWords').textContent = totalWords;

      const topMood = Object.entries(moodCount).sort((a, b) => b[1] - a[1])[0];
      document.getElementById('topMood').textContent = topMood ? moodConfig[topMood[0]].emoji + moodConfig[topMood[0]].label : '-';

      renderMoodChart(moodCount);
      renderWordCloud(allKeywords);

      document.getElementById('reportModal').classList.add('active');
    }

    function closeReport() {
      document.getElementById('reportModal').classList.remove('active');
    }

    function renderMoodChart(moodCount) {
      const ctx = document.getElementById('moodChart').getContext('2d');

      if (moodChartInstance) {
        moodChartInstance.destroy();
      }

      const labels = Object.keys(moodCount).map(m => moodConfig[m].label);
      const data = Object.values(moodCount);
      const colors = Object.keys(moodCount).map(m => moodConfig[m].color);

      moodChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels,
          datasets: [{
            data,
            backgroundColor: colors,
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { color: '#a0a0b7', padding: 16 }
            }
          }
        }
      });
    }

    function renderWordCloud(keywords) {
      const container = document.getElementById('wordCloud');
      container.innerHTML = '';

      const freq = {};
      keywords.forEach(k => freq[k] = (freq[k] || 0) + 1);

      const sorted = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 20);
      const maxFreq = sorted[0]?.[1] || 1;

      const cloudColors = ['#e94560', '#60a5fa', '#fbbf24', '#a78bfa', '#f472b6', '#34d399'];

      sorted.forEach(([word, count], i) => {
        const el = document.createElement('span');
        el.className = 'word-item';
        el.textContent = word;
        const size = 0.8 + (count / maxFreq) * 1.5;
        el.style.fontSize = `${size}rem`;
