<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>随兴厨房</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

        :root {
            --primary: #F59E0B;
            --primary-dark: #D97706;
            --primary-light: #FCD34D;
            --bg: #FDF8F0;
            --bg-warm: #FFF7ED;
            --card-bg: #FFFFFF;
            --text-primary: #1F2937;
            --text-secondary: #6B7280;
            --text-light: #9CA3AF;
            --border: #F3F4F6;
            --shadow: 0 4px 20px rgba(245, 158, 11, 0.08);
            --shadow-lg: 0 8px 30px rgba(245, 158, 11, 0.12);
            --radius: 20px;
            --radius-sm: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        #app {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            background: var(--bg);
        }

        /* ===== 页面容器 ===== */
        .page {
            display: none;
            min-height: 100vh;
            padding-bottom: 90px;
            animation: fadeIn 0.3s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== 首页 ===== */
        .home-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            padding: 48px 24px 64px;
            border-radius: 0 0 32px 32px;
            position: relative;
            overflow: hidden;
        }

        .home-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }

        .home-header::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 200px;
            height: 200px;
            background: rgba(255,255,255,0.06);
            border-radius: 50%;
        }

        .brand-title {
            font-size: 28px;
            font-weight: 700;
            color: white;
            position: relative;
            z-index: 1;
        }

        .brand-slogan {
            font-size: 14px;
            color: rgba(255,255,255,0.85);
            margin-top: 8px;
            position: relative;
            z-index: 1;
            font-weight: 300;
        }

        .home-content {
            padding: 0 20px;
            margin-top: -32px;
            position: relative;
            z-index: 2;
        }

        .input-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow-lg);
        }

        .input-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .photo-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border: none;
            border-radius: var(--radius-sm);
            color: white;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .photo-btn:active {
            transform: scale(0.98);
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.15);
        }

        .photo-btn input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: var(--text-light);
            font-size: 13px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .text-input-wrapper {
            position: relative;
        }

        .text-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-family: inherit;
            background: var(--bg-warm);
            transition: border-color 0.2s;
            resize: none;
        }

        .text-input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
        }

        .text-input::placeholder {
            color: var(--text-light);
        }

        .recommend-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border: none;
            border-radius: var(--radius-sm);
            color: white;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        .recommend-btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 6px rgba(245, 158, 11, 0.3);
        }

        .recommend-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ===== 结果页 ===== */
        .result-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            padding: 24px;
            color: white;
        }

        .result-title {
            font-size: 18px;
            font-weight: 500;
        }

        .result-subtitle {
            font-size: 13px;
            opacity: 0.85;
            margin-top: 4px;
        }

        .ingredient-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .ingredient-tag {
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            backdrop-filter: blur(4px);
        }

        .result-content {
            padding: 20px;
        }

        .recipe-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            transition: all 0.2s;
            position: relative;
        }

        .recipe-card:active {
            transform: scale(0.99);
        }

        .recipe-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .recipe-name {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .match-badge {
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .recipe-meta {
            display: flex;
            gap: 16px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .extra-shop {
            font-size: 13px;
            color: var(--primary-dark);
            background: var(--bg-warm);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            margin-bottom: 12px;
        }

        .recipe-actions {
            display: flex;
            gap: 10px;
        }

        .btn-primary {
            flex: 1;
            padding: 10px 16px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border: none;
            border-radius: var(--radius-sm);
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-fav {
            width: 42px;
            height: 42px;
            border: 2px solid var(--border);
            background: white;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
        }

        .btn-fav.active {
            background: #FEF2F2;
            border-color: #FECACA;
        }

        .btn-fav:active {
            transform: scale(0.9);
        }

        /* ===== 弹窗 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            align-items: flex-end;
            justify-content: center;
            backdrop-filter: blur(2px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 480px;
            max-height: 80vh;
            border-radius: 24px 24px 0 0;
            padding: 24px;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
        }

        .modal-close {
            width: 36px;
            height: 36px;
            border: none;
            background: var(--border);
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .modal-close:active {
            background: var(--text-light);
        }

        .step-list {
            list-style: none;
        }

        .step-item {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .step-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .step-num {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .step-text {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-primary);
            padding-top: 2px;
        }

        /* ===== 收藏页 ===== */
        .page-header {
            padding: 24px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
        }

        .page-header h2 {
            font-size: 22px;
            font-weight: 600;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            text-align: center;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-text {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .empty-action {
            margin-top: 20px;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border: none;
            border-radius: var(--radius-sm);
            color: white;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
        }

        /* ===== 我的页面 ===== */
        .profile-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
        }

        .avatar {
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 12px;
            border: 3px solid rgba(255,255,255,0.3);
        }

        .nickname {
            font-size: 18px;
            font-weight: 500;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-top: 16px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 2px;
        }

        .menu-list {
            padding: 20px;
        }

        .menu-item {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.2s;
        }

        .menu-item:active {
            transform: scale(0.99);
        }

        .menu-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
        }

        .menu-icon {
            font-size: 20px;
        }

        .menu-arrow {
            color: var(--text-light);
            font-size: 18px;
        }

        /* ===== 底部导航 ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
            box-shadow: 0 -2px 20px rgba(0,0,0,0.06);
            z-index: 50;
            border-radius: 20px 20px 0 0;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 6px 0;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            background: none;
            font-family: inherit;
        }

        .nav-item:active {
            transform: scale(0.9);
        }

        .nav-icon {
            font-size: 22px;
            transition: all 0.2s;
        }

        .nav-label {
            font-size: 11px;
            color: var(--text-light);
            transition: all 0.2s;
        }

        .nav-item.active .nav-icon {
            transform: translateY(-2px);
        }

        .nav-item.active .nav-label {
            color: var(--primary);
            font-weight: 500;
        }

        /* ===== 提示条 ===== */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 14px;
            z-index: 200;
            display: none;
            backdrop-filter: blur(4px);
        }

        .toast.show {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        /* ===== 图片预览 ===== */
        .photo-preview {
            margin-top: 12px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            display: none;
        }

        .photo-preview img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .photo-preview.show {
            display: block;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- ===== 首页 ===== -->
        <div class="page active" id="page-home">
            <div class="home-header">
                <div class="brand-title">随兴厨房</div>
                <div class="brand-slogan">拍一拍冰箱，AI帮你决定今晚吃什么</div>
            </div>
            <div class="home-content">
                <div class="input-card">
                    <div class="input-title">告诉AI你有什么食材</div>
                    
                    <button class="photo-btn">
                        <span style="font-size: 20px;">📸</span>
                        <span>拍照识食材</span>
                        <input type="file" accept="image/*" id="photoInput" capture="environment">
                    </button>
                    
                    <div class="photo-preview" id="photoPreview">
                        <img src="" alt="预览" id="previewImg">
                    </div>
                    
                    <div class="divider">或</div>
                    
                    <div class="text-input-wrapper">
                        <textarea class="text-input" id="ingredientInput" rows="3" placeholder="例如：豆腐、鸡蛋、洋葱"></textarea>
                    </div>
                    
                    <button class="recommend-btn" id="recommendBtn">🍳 帮我推荐</button>
                </div>
            </div>
        </div>

        <!-- ===== 结果页 ===== -->
        <div class="page" id="page-result">
            <div class="result-header">
                <div class="result-title">根据你的食材</div>
                <div class="result-subtitle">AI为你推荐以下菜品</div>
                <div class="ingredient-tags" id="resultTags"></div>
            </div>
            <div class="result-content" id="resultList"></div>
        </div>

        <!-- ===== 收藏页 ===== -->
        <div class="page" id="page-fav">
            <div class="page-header">
                <h2>我的收藏</h2>
            </div>
            <div id="favContent"></div>
        </div>

        <!-- ===== 我的页面 ===== -->
        <div class="page" id="page-profile">
            <div class="profile-header">
                <div class="avatar">👨‍🍳</div>
                <div class="nickname">美食探索家</div>
                <div class="stats-bar">
                    <div class="stat-item">
                        <div class="stat-value" id="statFav">0</div>
                        <div class="stat-label">已收藏</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="statCooked">0</div>
                        <div class="stat-label">已做过</div>
                    </div>
                </div>
            </div>
            <div class="menu-list">
                <div class="menu-item" onclick="clearCache()">
                    <div class="menu-item-left">
                        <span class="menu-icon">🗑️</span>
                        <span>清除缓存</span>
                    </div>
                    <span class="menu-arrow">›</span>
                </div>
                <div class="menu-item" onclick="showAbout()">
                    <div class="menu-item-left">
                        <span class="menu-icon">ℹ️</span>
                        <span>关于我们</span>
                    </div>
                    <span class="menu-arrow">›</span>
                </div>
            </div>
        </div>

        <!-- ===== 底部导航 ===== -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-page="home">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">首页</span>
            </button>
            <button class="nav-item" data-page="fav">
                <span class="nav-icon">❤️</span>
                <span class="nav-label">收藏</span>
            </button>
            <button class="nav-item" data-page="profile">
                <span class="nav-icon">👤</span>
                <span class="nav-label">我的</span>
            </button>
        </nav>

        <!-- ===== 做法弹窗 ===== -->
        <div class="modal-overlay" id="recipeModal">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-title" id="modalTitle">菜品做法</div>
                    <button class="modal-close" onclick="closeModal()">✕</button>
                </div>
                <ol class="step-list" id="stepList"></ol>
            </div>
        </div>

        <!-- ===== Toast ===== -->
        <div class="toast" id="toast"></div>
    </div>

    <script>
        // ===== 数据 =====
        const recipeData = {
            '豆腐,鸡蛋,洋葱': [
                {
                    id: 1,
                    name: '香煎豆腐',
                    match: 95,
                    time: '15分钟',
                    difficulty: 2,
                    extra: null,
                    steps: [
                        '豆腐切成1cm厚片，用厨房纸吸干表面水分',
                        '平底锅倒油，中小火将豆腐两面煎至金黄',
                        '淋入生抽、蚝油调成的酱汁，撒上葱花',
                        '小火焖2分钟让豆腐入味，出锅装盘'
                    ]
                },
                {
                    id: 2,
                    name: '洋葱炒蛋',
                    match: 88,
                    time: '10分钟',
                    difficulty: 1,
                    extra: null,
                    steps: [
                        '洋葱切丝，鸡蛋打散加少许盐',
                        '热锅倒油，先倒入蛋液快速炒散盛出',
                        '锅中留底油，炒香洋葱丝至半透明',
                        '倒入炒好的鸡蛋，加盐调味，翻炒均匀出锅'
                    ]
                },
                {
                    id: 3,
                    name: '日式豆腐汤',
                    match: 72,
                    time: '20分钟',
                    difficulty: 3,
                    extra: '葱花、味噌',
                    steps: [
                        '豆腐切小块，洋葱切丝备用',
                        '锅中加水烧开，放入洋葱煮软',
                        '加入豆腐，调入味噌酱搅匀',
                        '小火煮5分钟，撒葱花，滴几滴香油出锅'
                    ]
                }
            ],
            'default': [
                {
                    id: 4,
                    name: '番茄炒蛋',
                    match: 85,
                    time: '12分钟',
                    difficulty: 1,
                    extra: null,
                    steps: [
                        '番茄切块，鸡蛋打散备用',
                        '热锅倒油，倒入蛋液炒散盛出',
                        '锅中留底油，炒番茄出汁',
                        '倒入鸡蛋，加盐糖调味，翻炒均匀'
                    ]
                },
                {
                    id: 5,
                    name: '蛋炒饭',
                    match: 80,
                    time: '10分钟',
                    difficulty: 1,
                    extra: '葱花',
                    steps: [
                        '剩饭打散，鸡蛋打散备用',
                        '热锅倒油，倒入蛋液快速炒散',
                        '加入米饭翻炒均匀，用铲子压散饭团',
                        '加盐调味，撒葱花，大火快炒出锅'
                    ]
                },
                {
                    id: 6,
                    name: '蔬菜煎蛋饼',
                    match: 65,
                    time: '15分钟',
                    difficulty: 2,
                    extra: '面粉、牛奶',
                    steps: [
                        '蔬菜切丁，与鸡蛋、面粉、牛奶混合成面糊',
                        '加盐和少许黑胡椒调味',
                        '平底锅刷油，倒入面糊摊平',
                        '中小火煎至两面金黄，切块装盘'
                    ]
                }
            ]
        };

        // ===== 状态 =====
        let currentIngredients = [];
        let favorites = JSON.parse(localStorage.getItem('sx_favorites') || '[]');
        let cookedCount = parseInt(localStorage.getItem('sx_cooked') || '0');

        // ===== DOM 元素 =====
        const pages = document.querySelectorAll('.page');
        const navItems = document.querySelectorAll('.nav-item');
        const photoInput = document.getElementById('photoInput');
        const photoPreview = document.getElementById('photoPreview');
        const previewImg = document.getElementById('previewImg');
        const ingredientInput = document.getElementById('ingredientInput');
        const recommendBtn = document.getElementById('recommendBtn');
        const recipeModal = document.getElementById('recipeModal');
        const toast = document.getElementById('toast');

        // ===== 页面切换 =====
        function showPage(pageName) {
            pages.forEach(p => p.classList.remove('active'));
            navItems.forEach(n => n.classList.remove('active'));
            
            document.getElementById(`page-${pageName}`).classList.add('active');
            document.querySelector(`[data-page="${pageName}"]`).classList.add('active');
            
            if (pageName === 'fav') renderFavorites();
            if (pageName === 'profile') updateStats();
        }

        navItems.forEach(item => {
            item.addEventListener('click', () => showPage(item.dataset.page));
        });

        // ===== 拍照上传 =====
        photoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    previewImg.src = ev.target.result;
                    photoPreview.classList.add('show');
                    showToast('📸 已识别食材：豆腐、鸡蛋、洋葱');
                    ingredientInput.value = '豆腐、鸡蛋、洋葱';
                };
                reader.readAsDataURL(file);
            }
        });

        // ===== 推荐逻辑 =====
        recommendBtn.addEventListener('click', () => {
            const input = ingredientInput.value.trim();
            if (!input && !photoPreview.classList.contains('show')) {
                showToast('请先输入或拍照上传食材～');
                return;
            }
            
            const ingredients = input ? input.split(/[,，、\s]+/).filter(Boolean) : ['豆腐', '鸡蛋', '洋葱'];
            currentIngredients = ingredients;
            
            const key = Object.keys(recipeData).find(k => {
                const items = k.split(',');
                return items.every(item => ingredients.includes(item));
            }) || 'default';
            
            renderResults(recipeData[key] || recipeData.default);
            showPage('result');
        });

        // ===== 渲染结果 =====
        function renderResults(recipes) {
            const tagsHtml = currentIngredients.map(i => `<span class="ingredient-tag">${i}</span>`).join('');
            document.getElementById('resultTags').innerHTML = tagsHtml;
            
            const listHtml = recipes.map(r => `
                <div class="recipe-card">
                    <div class="recipe-header">
                        <div class="recipe-name">${r.name}</div>
                        <div class="match-badge">${r.match}%匹配</div>
                    </div>
                    <div class="recipe-meta">
                        <div class="meta-item"><span>⏱️</span><span>${r.time}</span></div>
                        <div class="meta-item"><span>${'⭐'.repeat(r.difficulty)}</span><span>${['简单','简单','中等','困难'][r.difficulty-1] || '简单'}</span></div>
                    </div>
                    ${r.extra ? `<div class="extra-shop">🛒 需额外购买：${r.extra}</div>` : '<div class="extra-shop">✅ 无需额外采购</div>'}
                    <div class="recipe-actions">
                        <button class="btn-primary" onclick="showRecipe(${r.id})">查看做法</button>
                        <button class="btn-fav ${isFav(r.id) ? 'active' : ''}" onclick="toggleFav(${r.id}, this)">
                            ${isFav(r.id) ? '❤️' : '🤍'}
                        </button>
                    </div>
                </div>
            `).join('');
            
            document.getElementById('resultList').innerHTML = listHtml;
        }

        // ===== 做法弹窗 =====
        function showRecipe(id) {
            const allRecipes = [...recipeData['豆腐,鸡蛋,洋葱'], ...recipeData.default];
            const recipe = allRecipes.find(r => r.id === id);
            if (!recipe) return;
            
            document.getElementById('modalTitle').textContent = recipe.name;
            document.getElementById('stepList').innerHTML = recipe.steps.map((s, i) => `
                <li class="step-item">
                    <div class="step-num">${i + 1}</div>
                    <div class="step-text">${s}</div>
                </li>
            `).join('');
            
            recipeModal.classList.add('active');
        }

        function closeModal() {
            recipeModal.classList.remove('active');
        }

        recipeModal.addEventListener('click', (e) => {
            if (e.target === recipeModal) closeModal();
        });

        // ===== 收藏功能 =====
        function isFav(id) {
            return favorites.includes(id);
        }

        function toggleFav(id, btn) {
            if (isFav(id)) {
                favorites = favorites.filter(f => f !== id);
                btn.innerHTML = '🤍';
                btn.classList.remove('active');
                showToast('已取消收藏');
            } else {
                favorites.push(id);
                btn.innerHTML = '❤️';
                btn.classList.add('active');
                showToast('已收藏');
            }
            localStorage.setItem('sx_favorites', JSON.stringify(favorites));
            updateStats();
        }

        // ===== 渲染收藏 =====
        function renderFavorites() {
            const container = document.getElementById('favContent');
            
            if (favorites.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🍽️</div>
                        <div class="empty-text">还没有收藏的菜谱<br>去首页推荐看看吧~</div>
                        <button class="empty-action" onclick="showPage('home')">去首页</button>
                    </div>
                `;
                return;
            }
            
            const allRecipes = [...recipeData['豆腐,鸡蛋,洋葱'], ...recipeData.default];
            const favRecipes = allRecipes.filter(r => favorites.includes(r.id));
            
            container.innerHTML = `<div class="result-content">${favRecipes.map(r => `
                <div class="recipe-card">
                    <div class="recipe-header">
                        <div class="recipe-name">${r.name}</div>
                        <div class="match-badge">${r.match}%匹配</div>
                    </div>
                    <div class="recipe-meta">
                        <div class="meta-item"><span>⏱️</span><span>${r.time}</span></div>
                        <div class="meta-item"><span>${'⭐'.repeat(r.difficulty)}</span><span>${['简单','简单','中等','困难'][r.difficulty-1] || '简单'}</span></div>
                    </div>
                    ${r.extra ? `<div class="extra-shop">🛒 需额外购买：${r.extra}</div>` : '<div class="extra-shop">✅ 无需额外采购</div>'}
                    <div class="recipe-actions">
                        <button class="btn-primary" onclick="showRecipe(${r.id})">查看做法</button>
                        <button class="btn-fav active" onclick="toggleFav(${r.id}, this)">❤️</button>
                    </div>
                </div>
            `).join('')}</div>`;
        }

        // ===== 统计 =====
        function updateStats() {
            document.getElementById('statFav').textContent = favorites.length;
            document.getElementById('statCooked').textContent = cookedCount;
        }

        // ===== 清除缓存 =====
        function clearCache() {
            if (confirm('确定要清除所有缓存数据吗？')) {
                localStorage.removeItem('sx_favorites');
                localStorage.removeItem('sx_cooked');
                favorites = [];
                cookedCount = 0;
                updateStats();
                showToast('缓存已清除');
            }
        }

        // ===== 关于 =====
        function showAbout() {
            alert('随兴厨房 v1.0\n\n一款帮助独居年轻人解决"打开冰箱不知道做什么"的AI菜谱推荐工具。\n\n让每一餐都充满小确幸 ✨');
        }

        // ===== Toast =====
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // ===== 初始化 =====
        updateStats();
    </script>
</body>
</html>
