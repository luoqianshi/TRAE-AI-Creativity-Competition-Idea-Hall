<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LifeLog · 我的生活手帐</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper-bg: #f5efe0;
      --paper-card: #fffdf7;
      --paper-card-shadow: rgba(139, 115, 85, 0.15);
      --text-main: #5c4a3a;
      --text-sub: #8b7355;
      --text-light: #b0a090;
      --line-color: #d4c5a9;
      --line-dashed: #c9b896;
      --accent-red: #c0504d;
      --accent-blue: #6a8caf;
      --accent-green: #7a9a6a;
      --accent-yellow: #d4a857;
      --accent-pink: #d4849a;
      --accent-purple: #9a7aaf;
      --tape-pink: rgba(212, 132, 154, 0.4);
      --tape-blue: rgba(106, 140, 175, 0.4);
      --tape-yellow: rgba(212, 168, 87, 0.4);
      --tape-green: rgba(122, 154, 106, 0.4);
      --rating-like: #7a9a6a;
      --rating-ok: #d4a857;
      --rating-dislike: #c0504d;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Serif SC', 'Songti SC', serif;
      background: var(--paper-bg);
      background-image: 
        repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(180, 160, 130, 0.08) 31px, rgba(180, 160, 130, 0.08) 32px),
        radial-gradient(circle at 20% 30%, rgba(212, 168, 87, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(192, 80, 77, 0.04) 0%, transparent 50%);
      color: var(--text-main);
      line-height: 1.7;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    .header {
      position: sticky; top: 0;
      background: var(--paper-bg);
      background-image: repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(180, 160, 130, 0.08) 31px, rgba(180, 160, 130, 0.08) 32px);
      border-bottom: 2px dashed var(--line-dashed);
      padding: 16px 20px 12px; z-index: 100; text-align: center;
    }
    .header h1 {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 26px; color: var(--accent-red); letter-spacing: 2px;
      position: relative; display: inline-block;
    }
    .header h1::after { content: '✦'; position: absolute; right: -20px; top: 0; font-size: 14px; color: var(--accent-yellow); }
    .header .subtitle { font-size: 11px; color: var(--text-light); margin-top: 2px; letter-spacing: 1px; }

    .nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--paper-card);
      border-top: 2px dashed var(--line-dashed);
      display: flex; justify-content: space-around;
      padding: 10px 0 8px; z-index: 100;
      box-shadow: 0 -2px 10px rgba(139, 115, 85, 0.08);
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center;
      padding: 6px 20px; color: var(--text-sub); font-size: 11px;
      cursor: pointer; border-radius: 12px 12px 4px 4px;
      transition: all 0.3s; position: relative;
    }
    .nav-item:hover, .nav-item.active { color: var(--accent-red); }
    .nav-item.active::before {
      content: ''; position: absolute; top: -10px; left: 50%;
      transform: translateX(-50%); width: 30px; height: 4px;
      background: var(--accent-red); border-radius: 2px; opacity: 0.6;
    }
    .nav-item svg { width: 22px; height: 22px; margin-bottom: 3px; stroke-width: 1.8; }

    .view { display: none; padding: 16px; max-width: 100%; }
    .view.active { display: block; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .card {
      background: var(--paper-card);
      border: 1px solid var(--line-color);
      border-radius: 4px;
      padding: 20px 18px 18px;
      margin-bottom: 16px;
      position: relative;
      box-shadow: 2px 3px 8px var(--paper-card-shadow), inset 0 0 20px rgba(212, 168, 87, 0.03);
      background-image: repeating-linear-gradient(0deg, transparent, transparent 28px, rgba(180, 160, 130, 0.06) 28px, rgba(180, 160, 130, 0.06) 29px);
    }
    .card.taped::before {
      content: ''; position: absolute; top: -8px; left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      width: 80px; height: 22px;
      background: var(--tape-yellow);
      background-image: repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(255,255,255,0.3) 4px, rgba(255,255,255,0.3) 8px);
      border-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }

    .section-title {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 20px; color: var(--text-main);
      margin-bottom: 16px; padding-bottom: 8px;
      border-bottom: 2px dotted var(--line-dashed);
      display: flex; align-items: center; gap: 8px;
    }
    .section-title::before { content: '✎'; color: var(--accent-red); font-size: 18px; }

    .question-card {
      background: rgba(255, 253, 247, 0.5);
      border: 1px dashed var(--line-color);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 14px;
      transition: all 0.2s;
    }
    .question-card:focus-within {
      border-color: var(--accent-red);
      border-style: solid;
      background: var(--paper-card);
      box-shadow: 0 0 0 3px rgba(192, 80, 77, 0.08);
    }
    .question-label {
      display: flex; align-items: center; gap: 6px;
      font-size: 14px; font-weight: 500;
      color: var(--text-sub); margin-bottom: 8px;
      font-family: 'Noto Serif SC', serif;
    }
    .question-label .q-icon { font-size: 18px; }
    .question-input {
      width: 100%; padding: 8px 12px;
      border: none; border-radius: 6px;
      font-size: 14px; font-family: 'Noto Serif SC', serif;
      background: transparent; color: var(--text-main);
      resize: vertical; min-height: 44px;
      background-image: repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(180, 160, 130, 0.05) 27px, rgba(180, 160, 130, 0.05) 28px);
    }
    .question-input:focus { outline: none; }
    .question-input::placeholder { color: var(--text-light); font-style: italic; }

    .rating-group {
      display: flex; gap: 8px; margin-top: 8px;
    }
    .rating-btn {
      flex: 1; padding: 6px 8px;
      border: 1px solid var(--line-color);
      border-radius: 16px;
      background: transparent;
      font-size: 12px; font-family: 'Noto Serif SC', serif;
      color: var(--text-light); cursor: pointer;
      transition: all 0.2s; text-align: center;
    }
    .rating-btn:hover { background: rgba(245, 239, 224, 0.6); }
    .rating-btn.active.like {
      background: var(--rating-like); color: white; border-color: var(--rating-like);
    }
    .rating-btn.active.ok {
      background: var(--rating-ok); color: white; border-color: var(--rating-ok);
    }
    .rating-btn.active.dislike {
      background: var(--rating-dislike); color: white; border-color: var(--rating-dislike);
    }

    .form-label {
      display: block; font-size: 13px; font-weight: 500;
      margin-bottom: 8px; color: var(--text-sub);
      font-family: 'Noto Serif SC', serif;
    }
    .form-label::before { content: '◆ '; color: var(--accent-yellow); font-size: 10px; }

    .form-input {
      width: 100%; padding: 10px 14px;
      border: 1px solid var(--line-color); border-radius: 6px;
      font-size: 14px; font-family: 'Noto Serif SC', serif;
      background: rgba(255, 253, 247, 0.6); color: var(--text-main);
      transition: all 0.2s;
    }
    .form-input:focus { outline: none; border-color: var(--accent-red); background: var(--paper-card); box-shadow: 0 0 0 3px rgba(192, 80, 77, 0.1); }

    .tags-container {
      display: flex; flex-wrap: wrap; gap: 8px;
      padding: 10px; border: 1px dashed var(--line-color);
      border-radius: 8px; min-height: 46px; align-items: center;
      background: rgba(255, 253, 247, 0.4);
    }
    .tag {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; background: var(--tape-yellow);
      background-image: repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(255,255,255,0.2) 4px, rgba(255,255,255,0.2) 8px);
      border-radius: 3px; font-size: 12px; color: var(--text-main);
      box-shadow: 1px 1px 2px rgba(0,0,0,0.1);
      transform: rotate(-1deg); transition: transform 0.2s;
    }
    .tag:nth-child(even) { transform: rotate(1deg); background: var(--tape-pink); }
    .tag:nth-child(3n) { background: var(--tape-blue); }
    .tag:nth-child(4n) { background: var(--tape-green); }
    .tag-remove { cursor: pointer; color: var(--text-sub); font-size: 14px; margin-left: 2px; }
    .tag-remove:hover { color: var(--accent-red); }
    .tag-input {
      border: none; outline: none; font-size: 14px; flex: 1; min-width: 100px;
      background: transparent; font-family: 'Noto Serif SC', serif; color: var(--text-main);
    }
    .tag-input::placeholder { color: var(--text-light); font-style: italic; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 20px; border: none; border-radius: 24px;
      font-size: 14px; font-weight: 500; font-family: 'Noto Serif SC', serif;
      cursor: pointer; transition: all 0.25s; position: relative;
    }
    .btn-primary { background: var(--accent-red); color: #fff; box-shadow: 2px 2px 0 var(--text-sub); }
    .btn-primary:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--text-sub); }
    .btn-primary:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--text-sub); }
    .btn-secondary { background: var(--paper-card); color: var(--text-main); border: 1px solid var(--line-color); box-shadow: 1px 1px 0 var(--line-color); }
    .btn-secondary:hover { background: rgba(245, 239, 224, 0.8); transform: translate(-1px, -1px); box-shadow: 2px 2px 0 var(--line-color); }
    .btn-small { padding: 5px 12px; font-size: 12px; border-radius: 16px; }
    .btn-full { width: 100%; }
    .btn-icon { padding: 8px; background: transparent; border: none; cursor: pointer; color: var(--text-sub); font-size: 18px; }
    .btn-icon:hover { color: var(--accent-red); }

    .datetime-input { display: flex; gap: 8px; }
    .datetime-input input[type="date"] { flex: 1; }
    .datetime-input input[type="time"] { width: 110px; }

    .timeline-date {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 18px; color: var(--accent-red);
      margin: 24px 0 14px; padding-bottom: 6px;
      border-bottom: 2px dotted var(--line-dashed);
      display: flex; align-items: center; gap: 8px;
    }
    .timeline-date::before { content: '❀'; color: var(--accent-yellow); font-size: 16px; }
    .timeline-date:first-child { margin-top: 0; }

    .entry-card { position: relative; transform: rotate(-0.3deg); }
    .entry-card:nth-child(even) { transform: rotate(0.3deg); }

    .entry-time {
      font-size: 12px; color: var(--text-light); font-style: italic;
      margin-bottom: 12px; padding-bottom: 8px;
      border-bottom: 1px dashed var(--line-dashed);
    }
    .entry-field {
      display: flex; gap: 8px; margin-bottom: 10px;
      font-size: 14px; line-height: 1.8;
    }
    .entry-field .field-icon { font-size: 16px; flex-shrink: 0; margin-top: 2px; }
    .entry-field .field-content { color: var(--text-main); flex: 1; }
    .entry-field .field-rating {
      display: inline-block; padding: 1px 8px; border-radius: 10px;
      font-size: 11px; margin-left: 6px; vertical-align: middle;
    }
    .field-rating.like { background: var(--rating-like); color: white; }
    .field-rating.ok { background: var(--rating-ok); color: white; }
    .field-rating.dislike { background: var(--rating-dislike); color: white; }

    .entry-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .entry-tags .tag { background: var(--tape-yellow); font-size: 11px; padding: 2px 8px; transform: rotate(-1deg); }

    .entry-actions {
      display: flex; gap: 8px; margin-top: 14px;
      padding-top: 12px; border-top: 1px dashed var(--line-dashed);
    }

    .stats-card { margin-bottom: 20px; }
    .stats-section { margin-bottom: 16px; }
    .stats-section:last-child { margin-bottom: 0; }
    .stats-title {
      font-size: 14px; font-weight: 500; color: var(--text-sub);
      margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
    }
    .stats-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
    }
    .stats-box {
      padding: 10px; border-radius: 8px; text-align: center;
    }
    .stats-box.like { background: rgba(122, 154, 106, 0.15); border: 1px solid rgba(122, 154, 106, 0.3); }
    .stats-box.ok { background: rgba(212, 168, 87, 0.15); border: 1px solid rgba(212, 168, 87, 0.3); }
    .stats-box.dislike { background: rgba(192, 80, 77, 0.15); border: 1px solid rgba(192, 80, 77, 0.3); }
    .stats-box .count { font-size: 22px; font-weight: 700; font-family: 'Ma Shan Zheng', cursive; }
    .stats-box.like .count { color: var(--rating-like); }
    .stats-box.ok .count { color: var(--rating-ok); }
    .stats-box.dislike .count { color: var(--rating-dislike); }
    .stats-box .label { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
    .stats-list { font-size: 13px; color: var(--text-main); line-height: 1.8; }
    .stats-list-item { padding: 4px 0; border-bottom: 1px dashed var(--line-dashed); }
    .stats-list-item:last-child { border-bottom: none; }

    /* 我的页面 */
    .profile-section {
      display: flex; align-items: center; gap: 14px;
      padding: 16px; margin-bottom: 16px;
      background: rgba(212, 168, 87, 0.1);
      border-radius: 8px; border: 1px dashed var(--line-color);
    }
    .profile-avatar {
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--tape-yellow);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; flex-shrink: 0;
      box-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }
    .profile-info { flex: 1; }
    .profile-name { font-family: 'Ma Shan Zheng', cursive; font-size: 18px; color: var(--text-main); }
    .profile-desc { font-size: 12px; color: var(--text-light); margin-top: 2px; }

    .menu-list { list-style: none; }
    .menu-item {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; cursor: pointer;
      border-bottom: 1px dashed var(--line-dashed);
      transition: background 0.2s;
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:hover { background: rgba(245, 239, 224, 0.6); }
    .menu-item .menu-icon { font-size: 20px; width: 24px; text-align: center; }
    .menu-item .menu-text { flex: 1; font-size: 14px; color: var(--text-main); }
    .menu-item .menu-arrow { color: var(--text-light); font-size: 14px; }

    .setting-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0; border-bottom: 1px dashed var(--line-dashed);
    }
    .setting-row:last-child { border-bottom: none; }
    .setting-label { font-size: 14px; color: var(--text-main); }
    .setting-desc { font-size: 11px; color: var(--text-light); margin-top: 2px; }

    .question-config-item {
      padding: 14px; margin-bottom: 12px;
      border: 1px dashed var(--line-color); border-radius: 8px;
      background: rgba(255, 253, 247, 0.4);
    }
    .question-config-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 10px; font-size: 14px; font-weight: 500;
      color: var(--text-sub);
    }
    .question-config-header .q-icon { font-size: 18px; }
    .question-config-fields { display: grid; gap: 8px; }
    .question-config-fields .form-input { font-size: 13px; padding: 8px 10px; }
    .rating-config { display: flex; gap: 6px; }
    .rating-config .form-input { font-size: 12px; padding: 6px 8px; text-align: center; }

    .export-tabs { display: flex; gap: 10px; margin-bottom: 18px; }
    .export-tab {
      flex: 1; padding: 14px; border: 1px solid var(--line-color);
      border-radius: 8px; background: var(--paper-card); cursor: pointer;
      text-align: center; font-size: 14px; transition: all 0.2s;
      font-family: 'Noto Serif SC', serif; color: var(--text-sub);
      box-shadow: 1px 1px 3px rgba(0,0,0,0.05);
    }
    .export-tab:hover { background: rgba(245, 239, 224, 0.8); }
    .export-tab.active { background: var(--accent-red); color: white; border-color: var(--accent-red); box-shadow: 2px 2px 4px rgba(192, 80, 77, 0.3); }

    .export-preview {
      background: var(--paper-card);
      background-image: repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(180, 160, 130, 0.06) 27px, rgba(180, 160, 130, 0.06) 28px);
      border: 1px solid var(--line-color); border-radius: 8px;
      padding: 18px; font-family: 'Courier New', monospace; font-size: 12px;
      white-space: pre-wrap; word-break: break-all;
      max-height: 420px; overflow-y: auto; margin-bottom: 18px;
      color: var(--text-main); box-shadow: inset 0 0 15px rgba(212, 168, 87, 0.05);
    }
    .export-actions { display: flex; gap: 10px; }
    .export-actions .btn { flex: 1; }

    .empty-state { text-align: center; padding: 60px 24px; color: var(--text-light); }
    .empty-state svg { width: 72px; height: 72px; margin-bottom: 20px; opacity: 0.4; stroke: var(--text-light); }
    .empty-state p { font-family: 'Ma Shan Zheng', cursive; font-size: 18px; color: var(--text-sub); }
    .empty-state .hint { margin-top: 10px; font-size: 12px; font-family: 'Noto Serif SC', serif; color: var(--text-light); font-style: italic; }

    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(92, 74, 58, 0.4); backdrop-filter: blur(2px);
      z-index: 200; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.active { display: flex; animation: fadeIn 0.3s ease; }
    .modal {
      background: var(--paper-card);
      background-image: repeating-linear-gradient(0deg, transparent, transparent 28px, rgba(180, 160, 130, 0.06) 28px, rgba(180, 160, 130, 0.06) 29px);
      border-radius: 8px; width: 100%; max-width: 480px; max-height: 90vh;
      overflow-y: auto; box-shadow: 4px 4px 20px rgba(92, 74, 58, 0.25);
      border: 1px solid var(--line-color);
    }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 2px dotted var(--line-dashed); }
    .modal-header h2 { font-family: 'Ma Shan Zheng', cursive; font-size: 20px; color: var(--accent-red); }
    .modal-body { padding: 20px; }
    .modal-footer { padding: 16px 20px; border-top: 2px dotted var(--line-dashed); display: flex; gap: 10px; justify-content: flex-end; }

    .toast {
      position: fixed; bottom: 90px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--text-main); color: var(--paper-bg);
      padding: 12px 28px; border-radius: 24px; font-size: 13px;
      z-index: 300; opacity: 0; transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 2px 2px 10px rgba(0,0,0,0.2); font-family: 'Noto Serif SC', serif;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    .deco-star { position: fixed; color: var(--accent-yellow); opacity: 0.15; pointer-events: none; font-size: 20px; }
    .deco-star:nth-child(1) { top: 15%; right: 8%; transform: rotate(15deg); }
    .deco-star:nth-child(2) { top: 45%; left: 5%; transform: rotate(-20deg); font-size: 14px; }
    .deco-star:nth-child(3) { top: 70%; right: 10%; transform: rotate(10deg); font-size: 16px; }

    .hidden { display: none !important; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line-color); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-light); }

    @media (max-width: 380px) {
      .header h1 { font-size: 22px; }
      .card { padding: 16px 14px 14px; }
      .stats-grid { grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    }
  </style>
</head>
<body>
  <div class="deco-star">✦</div>
  <div class="deco-star">✧</div>
  <div class="deco-star">✦</div>

  <header class="header">
    <h1>我的生活手帐</h1>
    <div class="subtitle">LifeLog · 记录每一个真实的自己</div>
  </header>

  <!-- View: Record -->
  <div id="view-record" class="view active">
    <div class="card taped">
      <h2 class="section-title">今日一页</h2>
      <form id="record-form">
        <div class="form-group" style="margin-bottom: 18px;">
          <label class="form-label">日期时间</label>
          <div class="datetime-input">
            <input type="date" id="entry-date" class="form-input" required>
            <input type="time" id="entry-time" class="form-input" required>
          </div>
        </div>
        <div id="record-questions"></div>
        <div class="form-group" style="margin-top: 18px;">
          <label class="form-label">标签</label>
          <div class="tags-container" id="tags-container">
            <input type="text" class="tag-input" id="tag-input" placeholder="输入标签后按回车添加">
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full" style="margin-top: 16px;">保存到手帐</button>
      </form>
    </div>
  </div>

  <!-- View: Timeline -->
  <div id="view-timeline" class="view">
    <div id="timeline-container"></div>
  </div>

  <!-- View: Mine (我的) -->

    </div>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      <span>手帐内页</span>
    </div>
    <div class="nav-item" data-view="mine">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>我的</span>
    </div>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>编辑这一页</h2>
        <button class="btn-icon" id="close-modal">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group" style="margin-bottom: 18px;">
          <label class="form-label">日期时间</label>
          <div class="datetime-input">
            <input type="date" id="edit-date" class="form-input" required>
            <input type="time" id="edit-time" class="form-input" required>
          </div>
        </div>
        <div id="edit-questions"></div>
        <div class="form-group" style="margin-top: 18px;">
          <label class="form-label">标签</label>
          <div class="tags-container" id="edit-tags-container">
            <input type="text" class="tag-input" id="edit-tag-input" placeholder="输入标签后按回车添加">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancel-edit">取消</button>
        <button class="btn btn-primary" id="save-edit">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ==========================================
    // 默认问题配置
    // ==========================================
    const DEFAULT_QUESTIONS = [
      { key: 'meal', icon: '🍜', label: '今天吃了什么？好吃吗？', placeholder: '比如：中午吃了浇汁黄面，味道一般，有点咸...', ratingLabels: { like: '👍 喜欢', ok: '👌 还行', dislike: '👎 不喜欢' } },
      { key: 'sleep', icon: '😴', label: '睡得好吗？', placeholder: '比如：昨晚12点睡的，睡了6小时，有点累...', ratingLabels: { like: '👍 睡得好', ok: '👌 一般', dislike: '👎 没睡好' } },
      { key: 'mood', icon: '💛', label: '心情怎么样？', placeholder: '比如：有点烦躁，可能是因为没睡好...', ratingLabels: { like: '👍 开心', ok: '👌 平静', dislike: '👎 烦躁' } },
      { key: 'physical', icon: '🌿', label: '身体有什么反应？', placeholder: '比如：下午拉肚子了，可能是中午那碗面...', ratingLabels: { like: '👍 状态好', ok: '👌 还行', dislike: '👎 不舒服' } },
      { key: 'highlight', icon: '✨', label: '今天的小确幸或小烦恼？', placeholder: '比如：下班路上看到晚霞，心情好了一点...', ratingLabels: { like: '👍 小确幸', ok: '👌 平淡', dislike: '👎 小烦恼' } }
    ];

    // ==========================================
    // Storage Layer
    // ==========================================
    class Storage {
      constructor() { this.dbName = 'lifeLogDB'; this.dbVersion = 3; this.db = null; }

      async init() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(this.dbName, this.dbVersion);
          request.onerror = () => reject(request.error);
          request.onsuccess = () => { this.db = request.result; resolve(); };
          request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains('entries')) {
              const store = db.createObjectStore('entries', { keyPath: 'id' });
              store.createIndex('timestamp', 'timestamp', { unique: false });
            }
            if (!db.objectStoreNames.contains('settings')) {
              db.createObjectStore('settings', { keyPath: 'key' });
            }
          };
        });
      }

      async addEntry(entry) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction('entries', 'readwrite');
          const request = tx.objectStore('entries').add(entry);
          request.onsuccess = () => resolve(entry);
          request.onerror = () => reject(request.error);
        });
      }
      async updateEntry(entry) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction('entries', 'readwrite');
          const request = tx.objectStore('entries').put(entry);
          request.onsuccess = () => resolve(entry);
          request.onerror = () => reject(request.error);
        });
      }
      async deleteEntry(id) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction('entries', 'readwrite');
          const request = tx.objectStore('entries').delete(id);
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
        });
      }
      async getAllEntries() {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction('entries', 'readonly');
          const request = tx.objectStore('entries').getAll();
          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => reject(request.error);
        });
      }
      async getSetting(key) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction('settings', 'readonly');
          const request = tx.objectStore('settings').get(key);
          request.onsuccess = () => resolve(request.result ? request.result.value : null);
          request.onerror = () => reject(request.error);
        });
      }
      async setSetting(key, value) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction('settings', 'readwrite');
          const request = tx.objectStore('settings').put({ key, value });
          request.onsuccess = () => resolve(value);
          request.onerror = () => reject(request.error);
        });
      }
    }

    // ==========================================
    // DataManager
    // ==========================================
    class DataManager {
      constructor() { this.storage = new Storage(); }
      async init() { await this.storage.init(); }

      generateId() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
          const r = Math.random() * 16 | 0;
          return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
        });
      }

      async getQuestions() {
        const saved = await this.storage.getSetting('questions');
        return saved || JSON.parse(JSON.stringify(DEFAULT_QUESTIONS));
      }
      async saveQuestions(questions) {
        await this.storage.setSetting('questions', questions);
      }
      async resetQuestions() {
        await this.storage.setSetting('questions', JSON.parse(JSON.stringify(DEFAULT_QUESTIONS)));
        return JSON.parse(JSON.stringify(DEFAULT_QUESTIONS));
      }

      async createEntry(data) {
        const entry = { id: this.generateId(), timestamp: data.timestamp, tags: data.tags || [] };
        const questions = await this.getQuestions();
        questions.forEach(q => {
          entry[q.key] = data[q.key] || '';
          entry[q.key + 'Rating'] = data[q.key + 'Rating'] || '';
        });
        await this.storage.addEntry(entry);
        return entry;
      }

      async updateEntry(id, updates) {
        const entries = await this.storage.getAllEntries();
        const entry = entries.find(e => e.id === id);
        if (!entry) throw new Error('Entry not found');
        const updated = { ...entry, ...updates };
        await this.storage.updateEntry(updated);
        return updated;
      }

      async deleteEntry(id) { await this.storage.deleteEntry(id); }

      async getEntries() {
        let entries = await this.storage.getAllEntries();
        entries.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        return entries;
      }

      getStats(entries, questions) {
        const stats = {};
        questions.forEach(q => {
          stats[q.key] = { like: 0, ok: 0, dislike: 0, dislikeItems: [], label: q.label };
        });
        entries.forEach(e => {
          questions.forEach(q => {
            const rating = e[q.key + 'Rating'];
            if (rating) stats[q.key][rating]++;
            if (rating === 'dislike' && e[q.key]) {
              stats[q.key].dislikeItems.push(e[q.key]);
            }
          });
        });
        return stats;
      }

      exportHumanView(entries, questions) {
        if (entries.length === 0) return '暂无记录';
        let md = '# 我的生活手帐\n\n';
        const byDate = {};
        entries.forEach(entry => {
          const date = entry.timestamp.split('T')[0];
          if (!byDate[date]) byDate[date] = [];
          byDate[date].push(entry);
        });
        const ratingLabels = { like: '喜欢', ok: '还行', dislike: '不喜欢' };
        for (const date of Object.keys(byDate).sort().reverse()) {
          md += `## ${date}\n\n`;
          byDate[date].forEach(entry => {
            const time = entry.timestamp.split('T')[1].substring(0, 5);
            md += `### ${time}\n`;
            questions.forEach(q => {
              if (entry[q.key]) {
                md += `${q.icon} **${q.label}**: ${entry[q.key]}`;
                if (entry[q.key + 'Rating']) md += ` [${ratingLabels[entry[q.key + 'Rating']]}]`;
                md += '\n';
              }
            });
            if (entry.tags && entry.tags.length > 0) md += `🏷️ **标签**: ${entry.tags.join(', ')}\n`;
            md += '\n';
          });
        }
        return md;
      }

      exportAgentView(entries, questions) {
        if (entries.length === 0) return JSON.stringify({ message: '暂无记录' }, null, 2);
        const data = {
          generatedAt: new Date().toISOString(),
          totalEntries: entries.length,
          entries: entries.map(e => {
            const obj = { id: e.id, timestamp: e.timestamp, tags: e.tags || [] };
            questions.forEach(q => {
              obj[q.key] = e[q.key] || null;
              obj[q.key + 'Rating'] = e[q.key + 'Rating'] || null;
            });
            return obj;
          })
        };
        return JSON.stringify(data, null, 2);
      }
    }

    // ==========================================
    // App
    // ==========================================
    class App {
      constructor() {
        this.dataManager = new DataManager();
        this.currentView = 'record';
        this.currentExportView = 'human';
        this.tags = [];
        this.editTags = [];
        this.ratings = {};
        this.editRatings = {};
        this.questions = [];
        this.mineSubPage = 'menu'; // menu | export | questions
      }

      async init() {
        await this.dataManager.init();
        this.questions = await this.dataManager.getQuestions();
        this.initRatings();
        this.bindEvents();
        this.setDefaultDateTime();
        this.renderRecordQuestions();
      }

      initRatings() {
        this.ratings = {};
        this.editRatings = {};
        this.questions.forEach(q => {
          this.ratings[q.key] = '';
          this.editRatings[q.key] = '';
        });
      }

      setDefaultDateTime() {
        const now = new Date();
        document.getElementById('entry-date').value = now.toISOString().split('T')[0];
        document.getElementById('entry-time').value = now.toTimeString().substring(0, 5);
      }

      // 渲染记录页问题
      renderRecordQuestions() {
        const container = document.getElementById('record-questions');
        container.innerHTML = this.questions.map(q => this.renderQuestionCard(q, 'record')).join('');
        this.bindRatingButtons(container, 'record');
      }

      renderQuestionCard(q, mode) {
        const field = mode === 'record' ? q.key : `edit-${q.key}`;
        const inputId = mode === 'record' ? `q-${q.key}` : `edit-${q.key}`;
        const placeholder = q.placeholder || '';
        return `<div class="question-card">
          <div class="question-label"><span class="q-icon">${q.icon}</span> ${q.label}</div>
          <textarea class="question-input" id="${inputId}" placeholder="${placeholder}"></textarea>
          <div class="rating-group" data-field="${field}" data-key="${q.key}">
            <button type="button" class="rating-btn like" data-rating="like">${q.ratingLabels.like}</button>
            <button type="button" class="rating-btn ok" data-rating="ok">${q.ratingLabels.ok}</button>
            <button type="button" class="rating-btn dislike" data-rating="dislike">${q.ratingLabels.dislike}</button>
          </div>
        </div>`;
      }

      bindRatingButtons(container, mode) {
        container.querySelectorAll('.rating-group').forEach(group => {
          const key = group.dataset.key;
          group.querySelectorAll('.rating-btn').forEach(btn => {
            btn.addEventListener('click', () => this.setRating(key, btn.dataset.rating, mode));
          });
        });
      }

      setRating(key, rating, mode) {
        const target = mode === 'record' ? this.ratings : this.editRatings;
        target[key] = rating;
        const selector = mode === 'record'
          ? `#record-questions .rating-group[data-key="${key}"]`
          : `#edit-questions .rating-group[data-key="${key}"]`;
        const group = document.querySelector(selector);
        if (group) {
          group.querySelectorAll('.rating-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.dataset.rating === rating) btn.classList.add('active');
          });
        }
      }

      clearRatings(mode) {
        const target = mode === 'record' ? this.ratings : this.editRatings;
        Object.keys(target).forEach(k => target[k] = '');
        const selector = mode === 'record' ? '#record-questions .rating-btn' : '#edit-questions .rating-btn';
        document.querySelectorAll(selector).forEach(btn => btn.classList.remove('active'));
      }

      bindEvents() {
        document.querySelectorAll('.nav-item').forEach(item => {
          item.addEventListener('click', () => this.switchView(item.dataset.view));
        });
        document.getElementById('record-form').addEventListener('submit', (e) => this.handleSubmit(e));
        document.getElementById('tag-input').addEventListener('keydown', (e) => this.handleTagInput(e, 'tags', 'tag-input'));
        document.getElementById('edit-tag-input').addEventListener('keydown', (e) => this.handleTagInput(e, 'editTags', 'edit-tag-input'));

        document.getElementById('close-modal').addEventListener('click', () => this.closeEditModal());
        document.getElementById('cancel-edit').addEventListener('click', () => this.closeEditModal());
        document.getElementById('save-edit').addEventListener('click', () => this.saveEdit());
        document.getElementById('edit-modal').addEventListener('click', (e) => {
          if (e.target.id === 'edit-modal') this.closeEditModal();
        });
      }

      switchView(viewName) {
        this.currentView = viewName;
        document.querySelectorAll('.nav-item').forEach(item => item.classList.toggle('active', item.dataset.view === viewName));
        document.querySelectorAll('.view').forEach(view => view.classList.toggle('active', view.id === `view-${viewName}`));
        if (viewName === 'timeline') this.renderTimeline();
        else if (viewName === 'mine') this.renderMine();
      }

      async handleSubmit(e) {
        e.preventDefault();
        const timestamp = `${document.getElementById('entry-date').value}T${document.getElementById('entry-time').value}:00+08:00`;
        const entry = { timestamp, tags: [...this.tags] };
        let hasContent = false;
        this.questions.forEach(q => {
          entry[q.key] = document.getElementById(`q-${q.key}`).value.trim();
          entry[q.key + 'Rating'] = this.ratings[q.key];
          if (entry[q.key]) hasContent = true;
        });
        if (!hasContent) { this.showToast('至少写一个吧~'); return; }
        try {
          await this.dataManager.createEntry(entry);
          this.showToast('已记入手帐 ✦');
          e.target.reset();
          this.setDefaultDateTime();
          this.tags = [];
          this.renderTags('tags');
          this.clearRatings('record');
        } catch (err) { this.showToast('保存失败'); console.error(err); }
      }

      handleTagInput(e, tagArrayName, inputId) {
        if (e.key === 'Enter' && e.target.value.trim()) {
          e.preventDefault();
          const tag = e.target.value.trim();
          if (!this[tagArrayName].includes(tag)) {
            this[tagArrayName].push(tag);
            this.renderTags(tagArrayName === 'tags' ? 'tags' : 'editTags');
          }
          e.target.value = '';
        }
      }

      renderTags(containerType) {
        const container = containerType === 'tags' ? document.getElementById('tags-container') : document.getElementById('edit-tags-container');
        const tagsArray = containerType === 'tags' ? this.tags : this.editTags;
        const inputId = containerType === 'tags' ? 'tag-input' : 'edit-tag-input';
        container.innerHTML = tagsArray.map((tag, index) => `
          <span class="tag">${tag}<span class="tag-remove" data-index="${index}" data-container="${containerType}">×</span></span>
        `).join('') + `<input type="text" class="tag-input" id="${inputId}" placeholder="输入标签后按回车添加">`;
        document.getElementById(inputId).addEventListener('keydown', (e) => this.handleTagInput(e, containerType === 'tags' ? 'tags' : 'editTags', inputId));
        container.querySelectorAll('.tag-remove').forEach(btn => {
          btn.addEventListener('click', () => {
            const index = parseInt(btn.dataset.index);
            const ct = btn.dataset.container;
            if (ct === 'tags') { this.tags.splice(index, 1); this.renderTags('tags'); }
            else { this.editTags.splice(index, 1); this.renderTags('editTags'); }
          });
        });
      }

      async renderTimeline() {
        const entries = await this.dataManager.getEntries();
        const container = document.getElementById('timeline-container');
        if (entries.length === 0) {
          container.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg><p>这一页还是空白的</p><p class="hint">点击下方「记录」开始书写</p></div>`;
          return;
        }
        const stats = this.dataManager.getStats(entries, this.questions);
        const ratingIcons = { like: '👍', ok: '👌', dislike: '👎' };
        let statsHtml = '<div class="card stats-card"><h2 class="section-title">生活偏好统计</h2>';
        this.questions.forEach(q => {
          const s = stats[q.key];
          const total = s.like + s.ok + s.dislike;
          if (total === 0) return;
          statsHtml += `<div class="stats-section">
            <div class="stats-title">${q.icon} ${q.label}</div>
            <div class="stats-grid">
              <div class="stats-box like"><div class="count">${s.like}</div><div class="label">${q.ratingLabels.like}</div></div>
              <div class="stats-box ok"><div class="count">${s.ok}</div><div class="label">${q.ratingLabels.ok}</div></div>
              <div class="stats-box dislike"><div class="count">${s.dislike}</div><div class="label">${q.ratingLabels.dislike}</div></div>
            </div>`;
          if (s.dislikeItems.length > 0) {
            statsHtml += '<div class="stats-list" style="margin-top:8px;">';
            s.dislikeItems.forEach(item => { statsHtml += `<div class="stats-list-item">👎 ${item}</div>`; });
            statsHtml += '</div>';
          }
          statsHtml += '</div>';
        });
        statsHtml += '</div>';

        const byDate = {};
        entries.forEach(entry => {
          const date = entry.timestamp.split('T')[0];
          if (!byDate[date]) byDate[date] = [];
          byDate[date].push(entry);
        });
        let timelineHtml = '';
        Object.keys(byDate).sort().reverse().forEach(date => {
          const dateObj = new Date(date);
          const dateStr = dateObj.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
          timelineHtml += `<div class="timeline-date">${dateStr}</div>`;
          byDate[date].forEach(entry => {
            const time = entry.timestamp.split('T')[1].substring(0, 5);
            let fieldsHtml = '';
            this.questions.forEach(q => {
              if (entry[q.key]) {
                let ratingHtml = '';
                const r = entry[q.key + 'Rating'];
                if (r) ratingHtml = `<span class="field-rating ${r}">${ratingIcons[r]}</span>`;
                fieldsHtml += `<div class="entry-field"><span class="field-icon">${q.icon}</span><span class="field-content">${entry[q.key]}${ratingHtml}</span></div>`;
              }
            });
            const tagsHtml = entry.tags && entry.tags.length > 0
              ? `<div class="entry-tags">${entry.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : '';
            timelineHtml += `<div class="card entry-card">
              <div class="entry-time">⏰ ${time}</div>
              ${fieldsHtml}
              ${tagsHtml}
              <div class="entry-actions">
                <button class="btn btn-secondary btn-small" onclick="app.openEditModal('${entry.id}')">编辑</button>
                <button class="btn btn-secondary btn-small" onclick="app.deleteEntry('${entry.id}')">删除</button>
              </div>
            </div>`;
          });
        });
        container.innerHTML = statsHtml + timelineHtml;
      }

      // ==========================================
      // 我的页面
      // ==========================================
      renderMine() {
        this.mineSubPage = 'menu';
        this.renderMineMenu();
      }

      renderMineMenu() {
        const container = document.getElementById('mine-container');
        container.innerHTML = `
          <div class="profile-section">
            <div class="profile-avatar">📖</div>
            <div class="profile-info">
              <div class="profile-name">我的生活手帐</div>
              <div class="profile-desc">记录每一个真实的自己</div>
            </div>
          </div>
          <div class="card" style="padding: 0;">
            <ul class="menu-list">
              <li class="menu-item" onclick="app.renderAICopyPage()">
                <span class="menu-icon">🤖</span>
                <span class="menu-text">复制给AI</span>
                <span class="menu-arrow">›</span>
              </li>
              <li class="menu-item" onclick="app.renderExportPage()">
                <span class="menu-icon">📤</span>
                <span class="menu-text">导出手帐</span>
                <span class="menu-arrow">›</span>
              </li>
              <li class="menu-item" onclick="app.renderQuestionsConfig()">
                <span class="menu-icon">⚙️</span>
                <span class="menu-text">自定义问题</span>
                <span class="menu-arrow">›</span>
              </li>
              <li class="menu-item" onclick="app.renderAboutPage()">
                <span class="menu-icon">💡</span>
                <span class="menu-text">关于 LifeLog</span>
                <span class="menu-arrow">›</span>
              </li>
            </ul>
          </div>
        `;
      }

      renderMineBackButton() {
        return `<button class="btn btn-secondary btn-small" style="margin-bottom: 16px;" onclick="app.renderMineMenu()">‹ 返回</button>`;
      }

      // ==========================================
      // 复制给AI
      // ==========================================
      async renderAICopyPage() {
        this.mineSubPage = 'ai';
        const container = document.getElementById('mine-container');
        const entries = await this.dataManager.getEntries();
        const prompt = this.generateAIPrompt(entries);

        container.innerHTML = `
          ${this.renderMineBackButton()}
          <div class="card">
            <h2 class="section-title">复制给AI</h2>
            <p style="font-size: 12px; color: var(--text-light); margin-bottom: 16px; font-style: italic;">将你的生活档案生成AI可读的格式，粘贴到任何AI对话框即可让AI了解你</p>
            <div class="export-preview" id="ai-preview">${this.escapeHtml(prompt)}</div>
            <div class="export-actions">
              <button class="btn btn-secondary" onclick="app.renderAICopyPage()">刷新</button>
              <button class="btn btn-primary" onclick="app.copyAIPrompt()">复制给AI</button>
            </div>
          </div>
        `;
      }

      escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      generateAIPrompt(entries) {
        if (entries.length === 0) return '暂无记录，先去记录几天生活吧~';

        const stats = this.dataManager.getStats(entries, this.questions);
        const sorted = [...entries].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
        const startDate = sorted[0].timestamp.split('T')[0];
        const endDate = sorted[sorted.length - 1].timestamp.split('T')[0];

        let prompt = `你是我的个人Agent，以下是我的生活档案：\n\n`;
        prompt += `## 基本信息\n`;
        prompt += `- 记录时间：${startDate} 至 ${endDate}\n`;
        prompt += `- 总记录数：${entries.length}条\n\n`;

        // 按问题维度生成偏好分析
        this.questions.forEach(q => {
          const s = stats[q.key];
          const total = s.like + s.ok + s.dislike;
          if (total === 0) return;

          prompt += `## ${q.label}\n`;

          if (s.like > 0) {
            prompt += `### 喜欢/正向\n`;
            const likeItems = entries.filter(e => e[q.key + 'Rating'] === 'like' && e[q.key]).map(e => e[q.key]);
            likeItems.forEach(item => { prompt += `- ${item}\n`; });
          }

          if (s.dislike > 0) {
            prompt += `### 不喜欢/负向\n`;
            s.dislikeItems.forEach(item => { prompt += `- ${item}\n`; });
          }

          if (s.ok > 0) {
            prompt += `### 一般/中性\n`;
            const okItems = entries.filter(e => e[q.key + 'Rating'] === 'ok' && e[q.key]).map(e => e[q.key]);
            okItems.forEach(item => { prompt += `- ${item}\n`; });
          }

          prompt += `\n`;
        });

        // 近期记录摘要
        prompt += `## 近期记录摘要\n`;
        const recent = entries.slice(0, 5);
        recent.forEach(entry => {
          const date = entry.timestamp.split('T')[0];
          const time = entry.timestamp.split('T')[1].substring(0, 5);
          prompt += `### ${date} ${time}\n`;
          this.questions.forEach(q => {
            if (entry[q.key]) {
              const rating = entry[q.key + 'Rating'];
              const ratingText = rating ? `[${rating}]` : '';
              prompt += `- ${q.icon} ${entry[q.key]} ${ratingText}\n`;
            }
          });
          if (entry.tags && entry.tags.length > 0) {
            prompt += `- 标签: ${entry.tags.join(', ')}\n`;
          }
          prompt += `\n`;
        });

        return prompt.trim();
      }

      async copyAIPrompt() {
        const preview = document.getElementById('ai-preview');
        if (!preview) return;
        const text = preview.textContent;
        try { await navigator.clipboard.writeText(text); this.showToast('已复制，粘贴给AI吧 ✦'); }
        catch (err) {
          const ta = document.createElement('textarea'); ta.value = text;
          document.body.appendChild(ta); ta.select(); document.execCommand('copy');
          document.body.removeChild(ta); this.showToast('已复制，粘贴给AI吧 ✦');
        }
      }

      async renderExportPage() {
        this.mineSubPage = 'export';
        const container = document.getElementById('mine-container');
        const entries = await this.dataManager.getEntries();
        container.innerHTML = `
          ${this.renderMineBackButton()}
          <div class="card">
            <h2 class="section-title">导出手帐</h2>
            <div class="export-tabs">
              <button class="export-tab active" data-view="human" onclick="app.switchExportView('human')">👤 给自己看</button>
              <button class="export-tab" data-view="agent" onclick="app.switchExportView('agent')">🤖 给Agent看</button>
            </div>
            <div class="export-preview" id="export-preview"></div>
            <div class="export-actions">
              <button class="btn btn-secondary" onclick="app.copyExport()">复制</button>
              <button class="btn btn-primary" onclick="app.downloadExport()">下载</button>
            </div>
          </div>
        `;
        this.currentExportView = 'human';
        this.renderExport();
      }

      async renderExport() {
        const entries = await this.dataManager.getEntries();
        const preview = document.getElementById('export-preview');
        if (!preview) return;
        preview.textContent = this.currentExportView === 'human'
          ? this.dataManager.exportHumanView(entries, this.questions)
          : this.dataManager.exportAgentView(entries, this.questions);
      }

      switchExportView(view) {
        this.currentExportView = view;
        document.querySelectorAll('.export-tab').forEach(tab => tab.classList.toggle('active', tab.dataset.view === view));
        this.renderExport();
      }

      async copyExport() {
        const preview = document.getElementById('export-preview');
        if (!preview) return;
        const text = preview.textContent;
        try { await navigator.clipboard.writeText(text); this.showToast('已复制 ✦'); }
        catch (err) {
          const ta = document.createElement('textarea'); ta.value = text;
          document.body.appendChild(ta); ta.select(); document.execCommand('copy');
          document.body.removeChild(ta); this.showToast('已复制 ✦');
        }
      }

      downloadExport() {
        const preview = document.getElementById('export-preview');
        if (!preview) return;
        const text = preview.textContent;
        const isJson = this.currentExportView === 'agent';
        const filename = isJson
          ? `lifelog-agent-${new Date().toISOString().split('T')[0]}.json`
          : `lifelog-human-${new Date().toISOString().split('T')[0]}.md`;
        const blob = new Blob([text], { type: isJson ? 'application/json' : 'text/markdown' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        this.showToast(`已下载 ${filename}`);
      }

      // ==========================================
      // 问题自定义
      // ==========================================
      renderQuestionsConfig() {
        this.mineSubPage = 'questions';
        const container = document.getElementById('mine-container');
        let html = `${this.renderMineBackButton()}
        <div class="card">
          <h2 class="section-title">自定义问题</h2>
          <p style="font-size: 12px; color: var(--text-light); margin-bottom: 16px; font-style: italic;">修改问题文案、提示语和评价按钮，打造属于你自己的手帐</p>
          <div id="questions-config-list">`;

        this.questions.forEach((q, i) => {
          html += `<div class="question-config-item">
            <div class="question-config-header"><span class="q-icon">${q.icon}</span> 问题 ${i + 1}</div>
            <div class="question-config-fields">
              <input type="text" class="form-input" id="cfg-label-${i}" value="${q.label}" placeholder="问题标题">
              <input type="text" class="form-input" id="cfg-placeholder-${i}" value="${q.placeholder}" placeholder="输入提示语">
              <input type="text" class="form-input" id="cfg-icon-${i}" value="${q.icon}" placeholder="图标(emoji)" style="max-width: 60px; text-align: center;">
              <div class="rating-config">
                <input type="text" class="form-input" id="cfg-like-${i}" value="${q.ratingLabels.like}" placeholder="喜欢">
                <input type="text" class="form-input" id="cfg-ok-${i}" value="${q.ratingLabels.ok}" placeholder="还行">
                <input type="text" class="form-input" id="cfg-dislike-${i}" value="${q.ratingLabels.dislike}" placeholder="不喜欢">
              </div>
            </div>
          </div>`;
        });

        html += `</div>
          <div style="display: flex; gap: 10px; margin-top: 16px;">
            <button class="btn btn-secondary" style="flex:1;" onclick="app.resetQuestionsConfig()">恢复默认</button>
            <button class="btn btn-primary" style="flex:1;" onclick="app.saveQuestionsConfig()">保存设置</button>
          </div>
        </div>`;
        container.innerHTML = html;
      }

      async saveQuestionsConfig() {
        const newQuestions = this.questions.map((q, i) => ({
          key: q.key,
          icon: document.getElementById(`cfg-icon-${i}`).value.trim() || q.icon,
          label: document.getElementById(`cfg-label-${i}`).value.trim() || q.label,
          placeholder: document.getElementById(`cfg-placeholder-${i}`).value.trim(),
          ratingLabels: {
            like: document.getElementById(`cfg-like-${i}`).value.trim() || '👍 喜欢',
            ok: document.getElementById(`cfg-ok-${i}`).value.trim() || '👌 还行',
            dislike: document.getElementById(`cfg-dislike-${i}`).value.trim() || '👎 不喜欢'
          }
        }));
        await this.dataManager.saveQuestions(newQuestions);
        this.questions = newQuestions;
        this.initRatings();
        this.renderRecordQuestions();
        this.showToast('设置已保存 ✦');
        this.renderMineMenu();
      }

      async resetQuestionsConfig() {
        if (!confirm('确定恢复默认问题吗？')) return;
        this.questions = await this.dataManager.resetQuestions();
        this.initRatings();
        this.renderRecordQuestions();
        this.showToast('已恢复默认 ✦');
        this.renderQuestionsConfig();
      }

      renderAboutPage() {
        const container = document.getElementById('mine-container');
        container.innerHTML = `
          ${this.renderMineBackButton()}
          <div class="card">
            <h2 class="section-title">关于 LifeLog</h2>
            <p style="font-size: 14px; line-height: 2; color: var(--text-main);">
              <strong>LifeLog</strong> 不是另一个笔记软件，而是为生活世界保留的飞地。<br><br>
              在这里，你的身体反应、情绪波动、饮食偏好不被KPI衡量，不被任务清单规训，只属于你自己。<br><br>
              同时，它为未来的个人AI Agent准备了结构化数据——让Agent真正理解你的生活喜好。<br><br>
              <span style="color: var(--text-light); font-size: 12px;">数据存储在本地浏览器中，隐私安全，不会上传任何服务器。</span>
            </p>
          </div>
        `;
      }

      // ==========================================
      // 编辑
      // ==========================================
      async openEditModal(id) {
        const entries = await this.dataManager.getEntries();
        const entry = entries.find(e => e.id === id);
        if (!entry) return;
        this.editingId = id;
        const dateTime = entry.timestamp.split('T');
        document.getElementById('edit-date').value = dateTime[0];
        document.getElementById('edit-time').value = dateTime[1].substring(0, 5);

        // 动态渲染编辑页问题
        const editContainer = document.getElementById('edit-questions');
        editContainer.innerHTML = this.questions.map(q => this.renderQuestionCard(q, 'edit')).join('');
        this.bindRatingButtons(editContainer, 'edit');

        // 填充数据
        this.editRatings = {};
        this.questions.forEach(q => {
          document.getElementById(`edit-${q.key}`).value = entry[q.key] || '';
          this.editRatings[q.key] = entry[q.key + 'Rating'] || '';
          const r = entry[q.key + 'Rating'];
          if (r) {
            const group = editContainer.querySelector(`.rating-group[data-key="${q.key}"]`);
            if (group) {
              group.querySelectorAll('.rating-btn').forEach(btn => {
                if (btn.dataset.rating === r) btn.classList.add('active');
              });
            }
          }
        });

        this.editTags = [...(entry.tags || [])];
        this.renderTags('editTags');
        document.getElementById('edit-modal').classList.add('active');
      }

      closeEditModal() { document.getElementById('edit-modal').classList.remove('active'); this.editingId = null; }

      async saveEdit() {
        if (!this.editingId) return;
        const timestamp = `${document.getElementById('edit-date').value}T${document.getElementById('edit-time').value}:00+08:00`;
        const updates = { timestamp, tags: [...this.editTags] };
        let hasContent = false;
        this.questions.forEach(q => {
          updates[q.key] = document.getElementById(`edit-${q.key}`).value.trim();
          updates[q.key + 'Rating'] = this.editRatings[q.key];
          if (updates[q.key]) hasContent = true;
        });
        if (!hasContent) { this.showToast('至少写一个吧~'); return; }
        try {
          await this.dataManager.updateEntry(this.editingId, updates);
          this.showToast('已更新 ✦');
          this.closeEditModal();
          this.renderTimeline();
        } catch (err) { this.showToast('更新失败'); console.error(err); }
      }

      async deleteEntry(id) {
        if (!confirm('确定要撕掉这一页吗？')) return;
        try { await this.dataManager.deleteEntry(id); this.showToast('已撕掉这一页'); this.renderTimeline(); }
        catch (err) { this.showToast('删除失败'); console.error(err); }
      }

      showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      }
    }

    const app = new App();
    app.init().catch(console.error);
  </script>
</body>
</html>
