<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IdeaGraveyard AI Demo</title>
<style>
:root{
--bg:#07060a;
--card:rgba(255,255,255,.07);
--line:rgba(255,255,255,.12);
--text:#f5f5f7;
--muted:#b9b9c6;
--green:#7cf7c2;
--purple:#a78bfa;
--red:#ff6b6b;
--shadow:0 20px 60px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
color:var(--text);
background:radial-gradient(circle at 20% 10%,rgba(167,139,250,.18),transparent 30%),
radial-gradient(circle at 80% 20%,rgba(255,107,107,.12),transparent 35%),
linear-gradient(180deg,#0a0712,#05040a);
}
.wrap{width:min(1180px,calc(100% - 30px));margin:auto}
.nav{position:sticky;top:0;background:rgba(0,0,0,.6);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);z-index:10}
.navin{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;
background:linear-gradient(135deg,var(--purple),var(--red));font-size:20px}
.hero{padding:70px 0 40px}
h1{font-size:clamp(36px,5vw,70px);margin:0 0 12px;line-height:1.05}
.grad{background:linear-gradient(135deg,#fff,var(--purple),var(--red));
-webkit-background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:18px;line-height:1.8;max-width:760px}
.btn{padding:14px 20px;border-radius:14px;border:1px solid var(--line);
background:var(--card);color:var(--text);cursor:pointer;text-decoration:none;
display:inline-flex;gap:8px;align-items:center;font-weight:800}
.btn:hover{transform:translateY(-2px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;
padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.bad{color:var(--red)}
.good{color:var(--green)}
.grave{
background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
border:1px solid var(--line);
border-radius:22px;
padding:16px;
margin-bottom:12px;
cursor:pointer;
transition:.2s;
}
.grave:hover{transform:translateX(4px);border-color:rgba(167,139,250,.5)}
.tag{font-size:12px;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.08);margin-right:6px}
.panel{min-height:520px}
h3{margin:0 0 6px}
.small{color:var(--muted);font-size:13px;line-height:1.6}
.result{margin-top:14px;padding:14px;border-radius:18px;background:rgba(0,0,0,.3);border:1px solid var(--line)}
.cta{margin:30px 0;text-align:center;padding:36px;border-radius:26px;border:1px solid var(--line);
background:radial-gradient(circle at 20% 20%,rgba(167,139,250,.18),transparent 40%),
radial-gradient(circle at 80% 60%,rgba(255,107,107,.12),transparent 45%)}
</style>
</head>
<body>
<div class="nav">
<div class="wrap navin">
<div style="display:flex;align-items:center;gap:10px">
<div class="logo">💀</div>
<div>
<div style="font-weight:900">IdeaGraveyard AI</div>
<div style="font-size:12px;color:var(--muted)">学习工作赛道 · 被埋葬的创意搜索引擎</div>
</div>
</div>
<a class="btn">Resurrect Ideas</a>
</div>
</div>

<div class="wrap hero">
<h1><span class="grad">所有失败的想法</span><br>都值得被重新搜索</h1>
<div class="sub">
IdeaGraveyard AI 记录所有被放弃的想法：做了一半的项目、创业失败的点子、写到一半的产品设计。
你可以用一句话，搜索你曾经埋葬的灵感。
</div>
</div>

<div class="wrap grid">

<div class="card panel">
<h3>🪦 创意墓地</h3>
<div id="list"></div>
</div>

<div class="card panel">
<h3>🔍 搜索复活</h3>
<input id="q" placeholder="例如：AI记账App" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff">
<div id="result" style="margin-top:12px"></div>
</div>

</div>

<div class="wrap cta">
<h2>“不是所有失败都叫结束，有些只是被埋起来了”</h2>
<div class="small">IdeaGraveyard AI 让被放弃的想法重新被找到、复活、甚至重新创业。</div>
</div>

<script>
const ideas=[
{id:"1",title:"AI 记账助手",desc:"自动识别消费并生成理财建议",reason:"竞争激烈",tags:["金融","AI"]},
{id:"2",title:"情绪日记AI",desc:"语音分析情绪变化",reason:"MVP未完成",tags:["心理","AI"]},
{id:"3",title:"匿名校园墙",desc:"基于位置的匿名社交",reason:"增长困难",tags:["社交"]},
{id:"4",title:"AI旅行规划",desc:"自动生成旅行路线",reason:"API成本高",tags:["旅行","AI"]}
];

const list=document.getElementById("list");
const q=document.getElementById("q");
const result=document.getElementById("result");

function render(){
list.innerHTML="";
ideas.forEach(i=>{
const div=document.createElement("div");
div.className="grave";
div.innerHTML=`
<div style="font-weight:900">${i.title}</div>
<div class="small">${i.desc}</div>
<div class="small bad">死亡原因：${i.reason}</div>
<div>${i.tags.map(t=>`<span class='tag'>${t}</span>`).join("")}</div>
`;
div.onclick=()=>{
q.value=i.title;
search();
};
list.appendChild(div);
});
}

function search(){
const val=q.value.toLowerCase();
const found=ideas.find(i=>i.title.toLowerCase().includes(val));
if(!found){
result.innerHTML="<div class='small'>没有找到，但这个想法可能还活着。</div>";
return;
}
result.innerHTML=`
<div class='result'>
<div style='font-weight:900'>${found.title}</div>
<div class='small'>${found.desc}</div>
<div class='small good'>💡 AI复活建议：这个想法可以用轻量MVP重新启动</div>
</div>`;
}

q.addEventListener("keydown",e=>{if(e.key==="Enter")search();});

render();
</script>

</body>
</html>
