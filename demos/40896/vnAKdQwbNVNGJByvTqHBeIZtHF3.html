<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R90 Sleep</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        /* =========================================================
           Design System — 深夜星穹 · 暖黄月光
           ========================================================= */
        :root {
            --night-deepest: #050e24;
            --night-deep: #0B1B3B;
            --night-mid: #1a2a4a;
            --night-soft: #2b3f6d;
            --moon-gold: #F7C76B;
            --moon-warm: #E5B94F;
            --text-soft: #c8d3ea;
            --text-dim: #7a8bb0;
            --text-white: #f4f6fb;
            --card-bg: rgba(20, 34, 66, 0.72);
            --card-border: rgba(247, 199, 107, 0.18);
            --overlay-bg: rgba(5, 14, 36, 0.88);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
            color: var(--text-soft);
            min-height: 100vh;
            background:
                radial-gradient(ellipse at 20% 10%, rgba(247, 199, 107, 0.07) 0%, transparent 45%),
                radial-gradient(ellipse at 85% 85%, rgba(43, 63, 109, 0.32) 0%, transparent 55%),
                linear-gradient(180deg, var(--night-deepest) 0%, var(--night-deep) 45%, #0a1630 100%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* Starfield */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image:
                radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,0.85), transparent),
                radial-gradient(1px 1px at 27% 55%, rgba(255,255,255,0.5), transparent),
                radial-gradient(2px 2px at 65% 12%, rgba(247, 199, 107, 0.55), transparent),
                radial-gradient(1px 1px at 82% 42%, rgba(255,255,255,0.65), transparent),
                radial-gradient(1.5px 1.5px at 40% 80%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1px 1px at 90% 75%, rgba(247, 199, 107, 0.35), transparent),
                radial-gradient(2px 2px at 55% 30%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1px 1px at 8% 62%, rgba(255,255,255,0.45), transparent),
                radial-gradient(1.5px 1.5px at 73% 67%, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 33% 33%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1.5px 1.5px at 61% 88%, rgba(247, 199, 107, 0.4), transparent),
                radial-gradient(1px 1px at 18% 91%, rgba(255,255,255,0.35), transparent);
            animation: twinkle 6s ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            from { opacity: 0.5; }
            to   { opacity: 1; }
        }

        /* =========================================================
           COVER PAGE — 首次欢迎封面
           ========================================================= */
        #coverPage {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: linear-gradient(180deg, #050e24 0%, #0a1a3a 50%, #050e24 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
        }

        /* 封面背景大月亮 */
        .cover-bg-moon {
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fff9e6, #f7c76b 40%, #e5b94f 70%, #c9953a 100%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -58%);
            opacity: 0;
            animation: coverMoonRise 1.8s 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            box-shadow:
                0 0 60px 20px rgba(247, 199, 107, 0.25),
                0 0 120px 60px rgba(247, 199, 107, 0.12),
                0 0 200px 100px rgba(247, 199, 107, 0.05);
        }
        /* 月牙遮罩（右侧深色圆形叠加） */
        .cover-bg-moon::after {
            content: '';
            position: absolute;
            width: 260px;
            height: 320px;
            border-radius: 50%;
            background: linear-gradient(180deg, #050e24 0%, #0a1a3a 100%);
            top: 0;
            right: -90px;
        }
        @keyframes coverMoonRise {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
            100% { opacity: 0.18; transform: translate(-50%, -58%) scale(1); }
        }

        /* 封面月亮图标 */
        .cover-moon {
            font-size: 52px;
            position: relative;
            z-index: 2;
            opacity: 0;
            animation: coverFadeUp 1s 0.3s ease-out forwards;
            filter: drop-shadow(0 0 24px rgba(247, 199, 107, 0.6));
        }

        /* 封面标题 */
        .cover-title {
            font-family: 'Fraunces', 'PingFang SC', serif;
            font-size: clamp(38px, 8vw, 56px);
            font-weight: 400;
            color: var(--moon-gold);
            letter-spacing: 8px;
            position: relative;
            z-index: 2;
            margin-top: 28px;
            opacity: 0;
            animation: coverFadeUp 1s 0.8s ease-out forwards;
        }
        .cover-title span {
            display: inline-block;
        }
        .cover-title .r90 {
            font-style: italic;
            font-weight: 300;
        }

        /* 封面副标题 */
        .cover-sub {
            font-size: 13px;
            letter-spacing: 6px;
            color: var(--text-dim);
            text-transform: uppercase;
            position: relative;
            z-index: 2;
            margin-top: 14px;
            opacity: 0;
            animation: coverFadeUp 1s 1.2s ease-out forwards;
        }

        /* 封面底部分隔线 */
        .cover-divider {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--moon-gold), transparent);
            margin: 28px auto 0;
            position: relative;
            z-index: 2;
            opacity: 0;
            animation: coverFadeUp 1s 1.5s ease-out forwards;
        }

        /* 封面时间文案 */
        .cover-tagline {
            font-size: 14px;
            color: var(--text-dim);
            letter-spacing: 3px;
            position: relative;
            z-index: 2;
            margin-top: 20px;
            opacity: 0;
            animation: coverFadeUp 1s 1.7s ease-out forwards;
        }

        /* 封面进入按钮 */
        .cover-enter {
            position: relative;
            z-index: 2;
            margin-top: 40px;
            padding: 14px 44px;
            background: rgba(247, 199, 107, 0.1);
            border: 1px solid rgba(247, 199, 107, 0.35);
            color: var(--moon-gold);
            font-family: 'Fraunces', serif;
            font-size: 15px;
            letter-spacing: 4px;
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.35s ease;
            opacity: 0;
            animation: coverFadeUp 1s 2s ease-out forwards;
        }
        .cover-enter:hover {
            background: rgba(247, 199, 107, 0.2);
            border-color: var(--moon-gold);
            box-shadow: 0 0 30px rgba(247, 199, 107, 0.2);
            transform: translateY(-2px);
        }

        /* 封面光粒 */
        .cover-particle {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: rgba(247, 199, 107, 0.5);
            opacity: 0;
            animation: particleFloat 4s ease-in-out infinite;
        }
        @keyframes particleFloat {
            0% { opacity: 0; transform: translateY(0) scale(0.5); }
            40% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-80px) scale(1); }
        }
        @keyframes coverFadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================================================
           MAIN APP — 主界面
           ========================================================= */
        #appPage {
            display: none;
            position: relative;
            z-index: 1;
            min-height: 100vh;
        }
        #appPage.active { display: block; }

        .wrap {
            max-width: 560px;
            margin: 0 auto;
            padding: 48px 24px 80px;
        }

        /* 主卡片 */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 32px 28px;
            box-shadow: 0 30px 60px -20px rgba(5, 14, 36, 0.8),
                        inset 0 1px 0 rgba(255,255,255,0.04);
            position: relative;
            overflow: visible;
            animation: fadeInUp 0.9s ease-out;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--moon-gold), transparent);
            border-radius: 0 0 3px 3px;
            opacity: 0.8;
        }

        /* =========================================================
           倒计时卡片（移至最上方）
           ========================================================= */
        .countdown-card {
            margin-bottom: 24px;
            /* 顶部 padding 0 留出顶部空间；底部 padding 56px 给弧线下移腾出位置
               弧线 + 天体下移到与下方"入睡/唤醒"时间标签相接 */
            padding: 0 24px 56px;
            background: rgba(5, 14, 36, 0.5);
            border: 1px solid rgba(247, 199, 107, 0.1);
            border-radius: 18px;
            display: none;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            position: relative;
            overflow: visible;
        }
        .countdown-card.is-show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* =========================================================
           简洁进度条 + 天体指示器（指示器在轨道上）
           ========================================================= */
        .progress-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            margin: 0 auto 12px;
            /* 固定高度容器 */
            height: 56px;
            z-index: 3;
        }
        /* 进度条轨道 */
        .progress-track {
            position: absolute;
            top: 24px; /* 轨道垂直居中 */
            left: 0;
            right: 0;
            height: 6px;
            background: rgba(247, 199, 107, 0.18);
            border-radius: 3px;
        }
        /* 进度填充 */
        .progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--moon-gold), #ffd700);
            border-radius: 3px;
            box-shadow: 0 0 8px rgba(247, 199, 107, 0.6);
            transition: width 1s linear;
        }
        /* 天体指示器：小型圆点，落在进度条正上方作为标记 */
        .celestial-indicator {
            position: absolute;
            top: 20px; /* 与轨道顶部对齐 */
            left: 0;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            z-index: 5;
            transform: translateX(-50%); /* 居中对齐 */
            transition: left 1s linear, background 0.8s ease, box-shadow 0.8s ease;
            pointer-events: auto;
        }
        .celestial-indicator.sun {
            background: radial-gradient(circle at 40% 40%, #fff9e6, #f7c76b 70%);
            box-shadow:
                0 0 8px rgba(247, 199, 107, 0.9),
                0 0 16px rgba(247, 199, 107, 0.5);
            animation: sunGlow 2.8s ease-in-out infinite;
        }
        .celestial-indicator.moon {
            background: radial-gradient(circle at 40% 40%, #fff9e6, #f7c76b 70%);
            box-shadow:
                0 0 6px rgba(247, 199, 107, 0.8),
                0 0 12px rgba(247, 199, 107, 0.4);
            animation: moonGlow 3.2s ease-in-out infinite;
        }
        /* 月牙效果 */
        .celestial-indicator.moon::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 14px;
            border-radius: 50%;
            background: rgba(5, 14, 36, 0.95);
            top: 0;
            right: -2px;
        }
        @keyframes sunGlow {
            0%, 100% { box-shadow: 0 0 6px rgba(247,199,107,0.8), 0 0 14px rgba(247,199,107,0.4); }
            50% { box-shadow: 0 0 10px rgba(247,199,107,1), 0 0 20px rgba(247,199,107,0.6); }
        }
        @keyframes moonGlow {
            0%, 100% { box-shadow: 0 0 5px rgba(247,199,107,0.7), 0 0 12px rgba(247,199,107,0.3); }
            50% { box-shadow: 0 0 8px rgba(247,199,107,0.9), 0 0 16px rgba(247,199,107,0.5); }
        }

        /* 进度条两端时间标签 + 数字面板（三列布局）
           固定 margin-top 匹配 progress-wrapper 的 56px 高度 */
        .arc-labels {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: end;
            gap: 12px;
            margin-top: 8px;
            position: relative;
            z-index: 2;
        }
        .arc-labels .arc-side {
            text-align: left;
            padding-left: 12px;
        }
        .arc-labels .arc-side.right {
            text-align: right;
            padding-left: 0;
            padding-right: 12px;
        }
        .arc-side-title {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-dim);
            opacity: 0.8;
        }
        .arc-side-time {
            font-family: 'Fraunces', serif;
            font-size: 18px;
            color: var(--moon-gold);
            font-weight: 500;
            letter-spacing: 1px;
            margin-top: 2px;
        }
        .arc-labels .arc-side.right .arc-side-time {
            color: var(--moon-gold);
        }

        /* 数字面板 */
        .arc-numbers {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 24px;
            margin-top: 0;
        }
        .arc-numbers .time-cell {
            text-align: center;
            min-width: 48px;
        }
        .arc-numbers .num {
            font-family: 'Fraunces', serif;
            font-size: 22px;
            color: var(--moon-gold);
            font-weight: 500;
            letter-spacing: 1px;
            display: block;
        }
        .arc-numbers .label {
            font-size: 9px;
            color: var(--text-dim);
            letter-spacing: 3px;
            text-transform: uppercase;
            display: block;
            margin-top: 2px;
        }

        /* =========================================================
           输入字段
           ========================================================= */
        .field { margin-bottom: 20px; }
        .field-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .time-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(5, 14, 36, 0.55);
            border: 1px solid rgba(247, 199, 107, 0.12);
            border-radius: 14px;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
        }
        .time-card:hover {
            border-color: rgba(247, 199, 107, 0.38);
            background: rgba(5, 14, 36, 0.72);
            box-shadow: 0 0 0 1px rgba(247, 199, 107, 0.06), 0 8px 24px -8px rgba(5, 14, 36, 0.6);
            transform: translateY(-1px);
        }
        .time-card:active { transform: translateY(0); }
        .time-card-info { display: flex; align-items: center; gap: 12px; }
        .time-card-icon { font-size: 22px; opacity: 0.85; }
        .time-card-value {
            font-family: 'Fraunces', 'PingFang SC', serif;
            font-size: 30px;
            font-weight: 500;
            color: var(--moon-gold);
            letter-spacing: 3px;
            line-height: 1;
        }
        .time-card-arrow {
            font-size: 16px;
            color: var(--text-dim);
            opacity: 0.5;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .time-card:hover .time-card-arrow {
            opacity: 0.9;
            transform: translateX(3px);
        }

        .divider-moon {
            text-align: center;
            margin: 2px 0 16px;
            color: var(--moon-gold);
            opacity: 0.4;
            font-size: 11px;
            letter-spacing: 8px;
        }

        /* 主按钮 */
        .btn-primary {
            width: 100%;
            padding: 18px 24px;
            background: linear-gradient(135deg, var(--moon-gold) 0%, var(--moon-warm) 100%);
            color: var(--night-deep);
            font-family: 'Fraunces', 'PingFang SC', serif;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 4px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 0 12px 28px -10px rgba(247, 199, 107, 0.55);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 36px -12px rgba(247, 199, 107, 0.75);
        }
        .btn-primary::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 60%; height: 100%;
            background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.55) 50%, transparent 100%);
            animation: shimmer 3.5s ease-in-out infinite;
        }
        @keyframes shimmer {
            0% { left: -100%; }
            60% { left: 120%; }
            100% { left: 120%; }
        }

        /* 快速场景按钮 */
        .quick-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }
        .btn-quick {
            padding: 14px 16px;
            background: rgba(43, 63, 109, 0.4);
            border: 1px solid rgba(247, 199, 107, 0.12);
            color: var(--text-soft);
            font-family: inherit;
            font-size: 14px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .btn-quick:hover {
            background: rgba(247, 199, 107, 0.1);
            border-color: rgba(247, 199, 107, 0.38);
            transform: translateY(-1px);
        }
        .btn-quick .label {
            display: block;
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--text-dim);
            margin-bottom: 4px;
        }
        .btn-quick .value {
            font-family: 'Fraunces', serif;
            color: var(--moon-gold);
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* 结果区 */
        .result {
            margin-top: 24px;
            background: linear-gradient(160deg, rgba(247, 199, 107, 0.07) 0%, rgba(20, 34, 66, 0.55) 100%);
            border: 1px solid rgba(247, 199, 107, 0.16);
            border-radius: 20px;
            padding: 28px 24px 24px;
            display: none;
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            position: relative;
            overflow: hidden;
        }
        .result.visible { display: block; }
        .result.visible-anim { opacity: 1; transform: translateY(0); }
        .result::before {
            content: '';
            position: absolute;
            top: -40px;
            right: -40px;
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, rgba(247, 199, 107, 0.2), transparent 60%);
            pointer-events: none;
        }
        .result.error {
            background: linear-gradient(160deg, rgba(255, 120, 120, 0.07) 0%, rgba(20, 34, 66, 0.55) 100%);
            border-color: rgba(255, 150, 150, 0.2);
        }
        .result-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-dim);
        }
        .result-head .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--moon-gold);
            box-shadow: 0 0 10px var(--moon-gold);
            display: inline-block;
            margin-right: 7px;
            vertical-align: middle;
            animation: dotPulse 2s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%, 100% { box-shadow: 0 0 8px rgba(247,199,107,0.6); }
            50% { box-shadow: 0 0 16px rgba(247,199,107,1); }
        }

        .wake-time-display { text-align: center; padding: 20px 0 16px; }
        .wake-time-label {
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 12px;
        }
        .wake-time-big {
            font-family: 'Fraunces', 'PingFang SC', serif;
            font-size: clamp(50px, 14vw, 80px);
            font-weight: 300;
            color: var(--moon-gold);
            letter-spacing: 4px;
            line-height: 1;
            text-shadow: 0 0 36px rgba(247, 199, 107, 0.22);
        }
        .wake-time-big .colon {
            opacity: 0.65;
            animation: blink 1.2s ease-in-out infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 0.65; }
            50% { opacity: 0.25; }
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(247, 199, 107, 0.1);
        }
        .info-cell { text-align: center; padding: 10px 8px; }
        .info-cell .info-label {
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 5px;
        }
        .info-cell .info-value {
            font-family: 'Fraunces', serif;
            font-size: 20px;
            font-weight: 500;
            color: var(--text-white);
            letter-spacing: 1px;
        }
        .info-cell .info-value .unit {
            font-size: 11px;
            color: var(--text-dim);
            margin-left: 4px;
        }
        .extra-msg {
            margin-top: 14px;
            text-align: center;
            font-size: 13px;
            color: var(--moon-gold);
            letter-spacing: 1px;
            padding: 9px 12px;
            background: rgba(247, 199, 107, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(247, 199, 107, 0.08);
        }

    <script>
        /* =========================================================
           封面页控制（测试阶段：每次进入都显示封面）
           ========================================================= */
        function enterApp() {
            const cover = document.getElementById('coverPage');
            cover.style.transition = 'opacity 0.8s ease';
            cover.style.opacity = '0';
            setTimeout(() => {
                cover.style.display = 'none';
                document.getElementById('appPage').classList.add('active');
            }, 800);
        }

        (function checkFirstVisit() {
            // 测试阶段：每次都显示封面，不读取 localStorage
            // 上线时可改回：
            //   if (localStorage.getItem('r90_visited') === '1') {
            //       document.getElementById('coverPage').style.display = 'none';
            //       document.getElementById('appPage').classList.add('active');
            //   }
        })();

        /* =========================================================
           全局时间状态
           ========================================================= */
        const TimeState = {
            bedTime:   { hour: '23', minute: '30' },
            wakeLimit: { hour: '07', minute: '00' }
        };

        function pad2(n) { return String(n).padStart(2, '0'); }

        function syncCardDisplay(id) {
            const state = TimeState[id];
            if (!state) return;
            const display = document.getElementById('display-' + id);
            if (display) display.textContent = state.hour + ':' + state.minute;
            // 同步弧线两端时间标签
            const timeStr = state.hour + ':' + state.minute;
            if (id === 'bedTime') {
                const el = document.getElementById('arcStartLabel');
                if (el) el.textContent = timeStr;
            } else if (id === 'wakeLimit') {
                const el = document.getElementById('arcEndLabel');
                if (el) el.textContent = timeStr;
            }
        }

        function syncAllDisplays() {
            Object.keys(TimeState).forEach(syncCardDisplay);
        }

        function getTimeValue(id) {
            const s = TimeState[id];
            return (s ? (s.hour + ':' + s.minute) : '00:00');
        }

        function setTimeValue(id, h, m) {
            TimeState[id] = { hour: pad2(h), minute: pad2(m) };
            syncCardDisplay(id);
        }

        /* =========================================================
           模态滚轮引擎
           ========================================================= */
        const WheelEngine = (function () {
            const ROW_H = 40;
            const SNAP_MS = 260;
            const INERTIA_MS = 500;
            let hourCol = null, minCol = null;
            let currentTarget = null;

            function buildTrack(col, max) {
                const track = col.querySelector('.wheel-track');
                track.innerHTML = '';
                for (let i = 0; i <= max; i++) {
                    const item = document.createElement('div');
                    item.className = 'wheel-item';
                    item.textContent = pad2(i);
                    track.appendChild(item);
                }
                col._items = track.querySelectorAll('.wheel-item');
                col._max = max;
                col._translate = 0;
                col._offsetFromCenter = 80;
                col._velocity = 0;
                col._rafId = null;
                col._snapRafId = null;
            }

            function getCenterY(col) { return col.clientHeight / 2; }

            function updateSelection(col) {
                const cy = getCenterY(col);
                const t = col._translate;
                const idx = Math.round((cy - t - col._offsetFromCenter) / ROW_H);
                const items = col._items;
                for (let i = 0; i < items.length; i++) {
                    if (i === idx) items[i].classList.add('w-selected');
                    else items[i].classList.remove('w-selected');
                }
            }

            function applyTransform(col) {
                col.querySelector('.wheel-track').style.transform = 'translate3d(0,' + col._translate + 'px,0)';
                updateSelection(col);
            }

            function setTranslateForValue(col, value) {
                const cy = getCenterY(col);
                col._translate = cy - col._offsetFromCenter - value * ROW_H;
                applyTransform(col);
            }

            function snapToNearest(col) {
                if (col._snapRafId) cancelAnimationFrame(col._snapRafId);
                if (col._rafId) { cancelAnimationFrame(col._rafId); col._rafId = null; }
                const cy = getCenterY(col);
                const rawIdx = (cy - col._translate - col._offsetFromCenter) / ROW_H;
                const targetIdx = Math.max(0, Math.min(col._max, Math.round(rawIdx)));
                const targetT = cy - col._offsetFromCenter - targetIdx * ROW_H;
                const start = col._translate;
                const delta = targetT - start;
                const t0 = performance.now();
                function step(now) {
                    const t = Math.min(1, (now - t0) / SNAP_MS);
                    const ease = 1 - Math.pow(1 - t, 3);
                    col._translate = start + delta * ease;
                    applyTransform(col);
                    if (t < 1) col._snapRafId = requestAnimationFrame(step);
                    else col._snapRafId = null;
                }
                col._snapRafId = requestAnimationFrame(step);
            }

            function inertia(col) {
                if (col._rafId) cancelAnimationFrame(col._rafId);
                const t0 = performance.now();
                let prevT = t0;
                const v0 = col._velocity;
                function step(now) {
                    const elapsed = now - t0;
                    const frame = now - prevT;
                    prevT = now;
                    const decay = Math.max(0, 1 - elapsed / INERTIA_MS);
                    col._velocity = v0 * decay;
                    col._translate += col._velocity * (frame / 16);
                    const minT = getCenterY(col) - col._offsetFromCenter - col._max * ROW_H;
                    const maxT = getCenterY(col) - col._offsetFromCenter;
                    if (col._translate > maxT) col._translate = maxT;
                    if (col._translate < minT) col._translate = minT;
                    applyTransform(col);
                    if (elapsed < INERTIA_MS && Math.abs(col._velocity) > 0.1) {
                        col._rafId = requestAnimationFrame(step);
                    } else {
                        col._rafId = null;
                        snapToNearest(col);
                    }
                }
                col._rafId = requestAnimationFrame(step);
            }

            function bindEvents(col) {
                let isDown = false, startY = 0, startT = 0, lastY = 0, lastT = 0;
                function onDown(y) {
                    isDown = true;
                    startY = lastY = y;
                    lastT = performance.now();
                    startT = col._translate;
                    col._velocity = 0;
                    if (col._rafId) cancelAnimationFrame(col._rafId);
                    if (col._snapRafId) cancelAnimationFrame(col._snapRafId);
                    document.getElementById('modalWheel').classList.add('is-dragging');
                }
                function onMove(y) {
                    if (!isDown) return;
                    const dt = performance.now() - lastT;
                    col._translate = startT + (y - startY);
                    col._velocity = dt > 0 ? (y - lastY) / dt * 16 : 0;
                    lastY = y;
                    lastT = performance.now();
                    applyTransform(col);
                }
                function onUp() {
                    if (!isDown) return;
                    isDown = false;
                    document.getElementById('modalWheel').classList.remove('is-dragging');
                    if (Math.abs(col._velocity) > 0.5) inertia(col);
                    else snapToNearest(col);
                }
                col.addEventListener('mousedown', e => { e.preventDefault(); onDown(e.clientY); });
                window.addEventListener('mousemove', e => { if (isDown) { e.preventDefault(); onMove(e.clientY); } });
                window.addEventListener('mouseup', () => onUp());
                col.addEventListener('touchstart', e => { if (e.touches.length) { e.preventDefault(); onDown(e.touches[0].clientY); } }, { passive: false });
                col.addEventListener('touchmove', e => { if (e.touches.length) { e.preventDefault(); onMove(e.touches[0].clientY); } }, { passive: false });
                col.addEventListener('touchend', () => onUp());
                col.addEventListener('wheel', e => {
                    e.preventDefault();
                    if (col._rafId) cancelAnimationFrame(col._rafId);
                    if (col._snapRafId) cancelAnimationFrame(col._snapRafId);
                    const dir = e.deltaY > 0 ? 1 : -1;
                    const cy = getCenterY(col);
                    const rawIdx = (cy - col._translate - col._offsetFromCenter) / ROW_H;
                    let targetIdx = Math.max(0, Math.min(col._max, Math.round(rawIdx) + dir));
                    const targetT = cy - col._offsetFromCenter - targetIdx * ROW_H;
                    const start = col._translate;
                    const delta = targetT - start;
                    const t0 = performance.now();
                    function step(now) {
                        const t = Math.min(1, (now - t0) / 180);
                        const ease = 1 - Math.pow(1 - t, 3);
                        col._translate = start + delta * ease;
                        applyTransform(col);
                        if (t < 1) col._snapRafId = requestAnimationFrame(step);
                        else col._snapRafId = null;
                    }
                    col._snapRafId = requestAnimationFrame(step);
                }, { passive: false });
            }

            function getCurrentValues() {
                const hIdx = Math.round((getCenterY(hourCol) - hourCol._translate - hourCol._offsetFromCenter) / ROW_H);
                const mIdx = Math.round((getCenterY(minCol) - minCol._translate - minCol._offsetFromCenter) / ROW_H);
                return {
                    hour: Math.max(0, Math.min(23, hIdx)),
                    minute: Math.max(0, Math.min(59, mIdx))
                };
            }

            function open(targetId) {
                currentTarget = targetId;
                const state = TimeState[targetId];
                setTranslateForValue(hourCol, parseInt(state.hour, 10));
                setTranslateForValue(minCol, parseInt(state.minute, 10));
                document.getElementById('timeModalOverlay').classList.add('open');
            }

            function confirm() {
                const v = getCurrentValues();
                setTimeValue(currentTarget, v.hour, v.minute);
                close();
            }

            function close() {
                document.getElementById('timeModalOverlay').classList.remove('open');
                currentTarget = null;
            }

            function init() {
                hourCol = document.getElementById('modalHourCol');
                minCol = document.getElementById('modalMinCol');
                buildTrack(hourCol, 23);
                buildTrack(minCol, 59);
                bindEvents(hourCol);
                bindEvents(minCol);
            }

            return { init, open, confirm, close };
        })();

        function openTimeModal(targetId, title) {
            document.getElementById('modalTitle').textContent = title;
            WheelEngine.open(targetId);
        }

        function closeTimeModal(confirmed) {
            if (confirmed) WheelEngine.confirm();
            else WheelEngine.close();
        }

        function handleOverlayClick(event) {
            if (event.target === event.currentTarget) closeTimeModal(false);
        }

        /* =========================================================
           核心：calculateR90
           ========================================================= */
        function calculateR90(bedTime, wakeUpLimit) {
            if (!(bedTime instanceof Date) || isNaN(bedTime.getTime())) throw new TypeError('bedTime 必须是合法 Date');
            if (!(wakeUpLimit instanceof Date) || isNaN(wakeUpLimit.getTime())) throw new TypeError('wakeUpLimit 必须是合法 Date');
            const bedSec = bedTime.getHours() * 3600 + bedTime.getMinutes() * 60;
            const wakeSec = wakeUpLimit.getHours() * 3600 + wakeUpLimit.getMinutes() * 60;
            const adjusted = new Date(wakeUpLimit.getTime());
            if (bedSec >= wakeSec) adjusted.setDate(adjusted.getDate() + 1);
            const CYCLE_MS = 90 * 60 * 1000;
            let current = new Date(bedTime.getTime());
            let best = null, cycles = 0;
            while (true) {
                const next = new Date(current.getTime() + CYCLE_MS);
                if (next.getTime() > adjusted.getTime()) break;
                best = next;
                cycles++;
                current = next;
            }
            if (best === null || cycles === 0) {
                return { status: 'insufficient', message: '睡眠时间不足一个周期，建议调整作息' };
            }
            return { status: 'success', wakeUpTime: best, adjustedWakeUpLimit: adjusted, cycles: cycles };
        }

        /* =========================================================
           水平进度条 + 天体指示器（简化版，几何直观易调整）
           ========================================================= */
        const SUNRISE_HOUR = 6;
        const SUNSET_HOUR = 19;

        function getCelestialState() {
            const now = new Date();
            const h = now.getHours();
            if (h >= SUNRISE_HOUR && h < SUNSET_HOUR) return 'sun';
            return 'moon';
        }

        function updateCelestialIndicator() {
            const indicator = document.getElementById('celestialIndicator');
            const state = getCelestialState();
            indicator.className = 'celestial-indicator ' + state;
        }

        function updateProgress(pct) {
            const fill = document.getElementById('progressFill');
            const indicator = document.getElementById('celestialIndicator');
            const clamped = Math.min(100, Math.max(0, pct));

            // 1) 更新进度条宽度（从左往右填充）
            fill.style.width = clamped.toFixed(2) + '%';

            // 2) 更新天体位置（沿进度条从左→右移动）
            indicator.style.left = clamped.toFixed(2) + '%';

            // 3) 更新太阳/月亮形态
            updateCelestialIndicator();
        }

        /* =========================================================
           倒计时控制
           ========================================================= */
        let progressInterval = null;

        function stopCountdown() {
            if (progressInterval) { clearInterval(progressInterval); progressInterval = null; }
        }

        function startCountdown(bedDate, wakeDateObj) {
            const totalRange = wakeDateObj.getTime() - bedDate.getTime();

            const cdCard = document.getElementById('countdownCard');
            cdCard.classList.remove('is-show');
            cdCard.style.display = 'block';
            void cdCard.offsetWidth;
            cdCard.classList.add('is-show');

            // 弧线两端时间标签
            document.getElementById('arcStartLabel').textContent =
                pad2(bedDate.getHours()) + ':' + pad2(bedDate.getMinutes());
            document.getElementById('arcEndLabel').textContent =
                pad2(wakeDateObj.getHours()) + ':' + pad2(wakeDateObj.getMinutes());

            updateProgress(0);

            function tick() {
                const now = new Date();
                const diff = wakeDateObj.getTime() - now.getTime();
                if (diff <= 0) {
                    document.getElementById('cdH').textContent = '00';
                    document.getElementById('cdM').textContent = '00';
                    document.getElementById('cdS').textContent = '00';
                    updateProgress(100);
                    stopCountdown();
                    return;
                }
                const totalSec = Math.floor(diff / 1000);
                const h = Math.floor(totalSec / 3600);
                const m = Math.floor((totalSec % 3600) / 60);
                const s = totalSec % 60;
                // 唯一时间显示 — HRS/MIN/SEC 数字面板
                document.getElementById('cdH').textContent = pad2(h);
                document.getElementById('cdM').textContent = pad2(m);
                document.getElementById('cdS').textContent = pad2(s);

                const pct = ((now.getTime() - bedDate.getTime()) / totalRange) * 100;
                updateProgress(pct);
            }

            tick();
            progressInterval = setInterval(tick, 1000);
        }

        /* =========================================================
           页面交互
           ========================================================= */
        function applyScenario(type) {
            if (type === 'late') {
                setTimeValue('bedTime', 1, 0);
                setTimeValue('wakeLimit', 7, 0);
            } else {
                setTimeValue('bedTime', 23, 30);
                setTimeValue('wakeLimit', 7, 0);
            }
        }

        function calculateAndShow() {
            stopCountdown();

            const bedVal = getTimeValue('bedTime');
            const wakeVal = getTimeValue('wakeLimit');

            const today = new Date();
            const bedDate = new Date(today.toDateString() + ' ' + bedVal);
            const wakeDate = new Date(today.toDateString() + ' ' + wakeVal);

            const result = calculateR90(bedDate, wakeDate);

            const area = document.getElementById('resultArea');
            const cdCard = document.getElementById('countdownCard');

            area.classList.remove('visible-anim');
            cdCard.classList.remove('is-show');
            cdCard.style.display = '';

            if (result.status === 'success') {
                const wake = result.wakeUpTime;
                document.getElementById('wakeHH').textContent = pad2(wake.getHours());
                document.getElementById('wakeMM').textContent = pad2(wake.getMinutes());
                document.getElementById('displayBed').textContent = bedVal;
                document.getElementById('displayCycles').textContent = result.cycles;
                document.getElementById('extraMessage').textContent = '🌙 已避开深睡期，起床更轻松';
                document.getElementById('statusTag').textContent = '计 算 完 成';
                area.classList.remove('error');
                area.style.display = 'block';
                setTimeout(() => area.classList.add('visible-anim'), 20);
                startCountdown(bedDate, wake);
            } else {
                document.getElementById('wakeHH').textContent = '';
                document.getElementById('wakeMM').textContent = '';
                document.getElementById('displayBed').textContent = bedVal;
                document.getElementById('displayCycles').textContent = '0';
                document.getElementById('extraMessage').textContent = '⚠ ' + result.message;
                document.getElementById('statusTag').textContent = '无 法 计 算';
                area.classList.add('error');
                area.style.display = 'block';
                setTimeout(() => area.classList.add('visible-anim'), 20);
                cdCard.style.display = 'none';
                cdCard.classList.remove('is-show');
            }
        }

        /* =========================================================
           初始化
           ========================================================= */
        document.addEventListener('DOMContentLoaded', function () {
            WheelEngine.init();
            syncAllDisplays();
        });
    </script>
</body>
</html>
