<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发泄出来 | SCREAM IT OUT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');
body{
  font-family:'Noto Sans SC',system-ui,sans-serif;
  background:#0a0a0a;color:#fff;
  min-height:100vh;display:flex;
  flex-direction:column;align-items:center;
  overflow:hidden;user-select:none
}

/* === HEADER === */
.header{text-align:center;padding-top:1.5rem;padding-bottom:.5rem;z-index:10;position:relative}
.title{
  font-size:2.4rem;font-weight:900;
  background:linear-gradient(135deg,#ff4444,#ff6f00,#ff4444);
  background-size:200% 200%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  animation:gradShift 2s ease infinite
}
@keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.subtitle{color:#555;font-size:.8rem;letter-spacing:2px;margin-top:2px}

/* === CONTROLS === */
.controls{z-index:10;position:relative;display:flex;gap:8px;align-items:center;margin-bottom:.3rem}
.controls input{
  width:280px;padding:.7rem 1rem;
  background:rgba(26,26,26,.9);border:2px solid #333;
  border-radius:10px;color:#fff;font-size:.95rem;
  font-family:inherit;outline:none;transition:border-color .2s
}
.controls input:focus{border-color:#ff4444}
.controls input::placeholder{color:#444}

.auto-btn{
  padding:.7rem 1rem;font-size:.85rem;font-weight:700;
  font-family:inherit;color:#fff;
  background:linear-gradient(135deg,#c62828,#ff6f00);
  border:none;border-radius:10px;cursor:pointer;
  white-space:nowrap;transition:transform .15s,box-shadow .15s;
  box-shadow:0 0 15px rgba(255,68,68,.15)
}
.auto-btn:hover{transform:scale(1.03);box-shadow:0 0 25px rgba(255,68,68,.3)}
.auto-btn:active{transform:scale(.95)}
.auto-btn.firing{animation:btnPulse .4s ease infinite}
@keyframes btnPulse{0%,100%{box-shadow:0 0 15px rgba(255,68,68,.2)}50%{box-shadow:0 0 35px rgba(255,68,68,.6)}}

/* === BALLOON STAGE === */
.balloon-stage{
  position:fixed;bottom:0;left:0;right:0;
  height:72vh;display:flex;
  flex-direction:column;align-items:center;justify-content:flex-end;
  overflow:hidden;z-index:1
}

/* BALLOON BODY - proper balloon shape */
.balloon-body{
  position:relative;
  width:clamp(80px,28vw,180px);
  height:clamp(100px,36vh,260px);
  border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
  background:radial-gradient(ellipse at 35% 20%,#ff5252 0%,#c62828 45%,#8e0000 75%,#4a0000 100%);
  transform-origin:bottom center;
  transition:transform .6s cubic-bezier(.34,1.56,.64,1),box-shadow .6s;
  z-index:2;
  box-shadow:0 -10px 60px rgba(255,23,68,.2),inset 0 -30px 40px rgba(0,0,0,.35)
}
/* Highlight */
.balloon-body::before{
  content:'';position:absolute;
  top:12%;left:15%;width:38%;height:42%;
  border-radius:50%;
  background:radial-gradient(ellipse at center, rgba(255,255,255,.4) 0%, rgba(255,255,255,.08) 60%, transparent 100%);
  transform:rotate(-12deg);
  pointer-events:none
}
.balloon-body::after{
  content:'';position:absolute;
  bottom:22%;right:12%;width:14%;height:20%;
  border-radius:50%;
  background:radial-gradient(ellipse, rgba(255,255,255,.12) 0%, transparent 100%);
  pointer-events:none
}

.balloon-knot{
  width:14px;height:10px;
  background:#8e0000;
  clip-path:polygon(0 0,100% 0,50% 100%);
  z-index:2;margin-top:-2px;
  transition:transform .6s cubic-bezier(.34,1.56,.64,1);
  transform-origin:center top
}
/* String */
.balloon-string{
  width:2px;height:60px;
  background:linear-gradient(180deg,#666,#222);
  border-radius:1px;z-index:1
}

/* Balloon fill indicator */
.balloon-label{
  position:absolute;top:35%;left:50%;transform:translate(-50%,-50%);
  font-size:clamp(2rem,5vw,4.5rem);font-weight:900;color:rgba(255,255,255,.9);
  text-shadow:0 0 20px rgba(255,23,68,.4),inset 0 0 10px rgba(255,255,255,.1);
  z-index:4;pointer-events:none;mix-blend-mode:overlay
}
.balloon-pct{
  position:absolute;bottom:22%;left:50%;transform:translateX(-50%);
  font-size:.8rem;color:rgba(255,255,255,.5);
  z-index:4;pointer-events:none;
  letter-spacing:2px
}

/* Pulse wobble animation (intensifies with fill) */
.balloon-body.wobble{
  animation:balloonWobble var(--wobble-speed,2s) ease-in-out infinite
}
@keyframes balloonWobble{
  0%,100%{transform:scale(var(--s,1)) rotate(0deg)}
  25%{transform:scale(calc(var(--s,1)*1.015),calc(var(--s,1)*.99)) rotate(.5deg)}
  50%{transform:scale(calc(var(--s,1)*.995),calc(var(--s,1)*1.005)) rotate(0deg)}
  75%{transform:scale(calc(var(--s,1)*1.01),calc(var(--s,1)*.995)) rotate(-.5deg)}
}
.balloon-body.wobble-fast{
  animation:balloonFast var(--wobble-speed,.5s) ease-in-out infinite
}
@keyframes balloonFast{
  0%,100%{transform:scale(var(--s,1)) rotate(0deg)}
  10%{transform:scale(calc(var(--s,1)*1.025),calc(var(--s,1)*.98)) rotate(.8deg)}
  20%{transform:scale(calc(var(--s,1)*.98),calc(var(--s,1)*1.02)) rotate(-.6deg)}
  30%{transform:scale(calc(var(--s,1)*1.02),calc(var(--s,1)*.99)) rotate(.7deg)}
  40%{transform:scale(calc(var(--s,1)*.99),calc(var(--s,1)*1.015)) rotate(-.5deg)}
  50%{transform:scale(calc(var(--s,1)*1.015),calc(var(--s,1)*.99)) rotate(.4deg)}
  60%{transform:scale(calc(var(--s,1)*.985),calc(var(--s,1)*1.02)) rotate(-.6deg)}
  70%{transform:scale(calc(var(--s,1)*1.02),calc(var(--s,1)*.985)) rotate(.5deg)}
  80%{transform:scale(calc(var(--s,1)*.99),calc(var(--s,1)*1.01)) rotate(-.4deg)}
  90%{transform:scale(calc(var(--s,1)*1.01),calc(var(--s,1)*.995)) rotate(.3deg)}
}
.info span{color:#ff6f00;font-weight:700}
.timer{color:#ff6f00;font-weight:700;opacity:0;transition:opacity .5s;display:inline-block}
.timer.show{opacity:1}
.balloon-timer{margin-top:6px;text-align:center;z-index:5;position:relative}
.balloon-timer .timer{color:#ff6f00;font-weight:700;font-size:.9rem;letter-spacing:1px}


/* === NAME TARGET SIDEBAR === */
.name-sidebar{
  position:fixed;right:1.2rem;top:50%;transform:translateY(-50%);
  z-index:20;display:flex;flex-direction:column;align-items:center;
  background:rgba(20,20,20,.92);border:1px solid #333;
  border-radius:14px;padding:1rem .75rem;gap:8px;
  backdrop-filter:blur(6px);min-width:95px;
  box-shadow:0 0 20px rgba(0,0,0,.5)
}
.name-sidebar .hint{font-size:.7rem;color:#888;letter-spacing:1px;text-align:center}
.name-sidebar .hint-icon{font-size:1rem;margin-bottom:2px}
.name-sidebar input{
  width:100%;padding:.4rem .5rem;font-size:.78rem;
  background:rgba(40,40,40,.9);border:1px solid #555;
  border-radius:8px;color:#fff;font-family:inherit;
  outline:none;text-align:center;transition:border-color .2s
}
.name-sidebar input:focus{border-color:#ff6f00}
.name-sidebar input::placeholder{color:#555;font-size:.7rem}
.name-sidebar .name-tag{
  display:none;padding:.35rem .65rem;font-size:.85rem;font-weight:700;
  background:linear-gradient(135deg,#c62828,#ff6f00);
  border-radius:8px;cursor:pointer;text-align:center;
  transition:transform .15s,box-shadow .15s;white-space:nowrap;
  box-shadow:0 0 10px rgba(255,68,68,.15)
}
.name-sidebar .name-tag:hover{transform:scale(1.05);box-shadow:0 0 20px rgba(255,68,68,.3)}
.name-sidebar .name-tag.active{box-shadow:0 0 20px #ff6f00,0 0 40px rgba(255,111,0,.3)}
.name-sidebar .status{
  font-size:.65rem;color:#ff6f00;letter-spacing:1px;
  display:none;text-align:center;line-height:1.3
}

/* === EXPLOSION OVERLAY === */
.overlay{
  position:fixed;inset:0;z-index:100;
  display:none;justify-content:center;align-items:center;
  cursor:pointer;
  background:rgba(0,0,0,.92);
  backdrop-filter:blur(4px)
}
.overlay.active{display:flex}

/* === VENT FLY TEXT === */
.fly-text{
  position:fixed;z-index:50;pointer-events:none;
  font-weight:900;white-space:nowrap;
  animation:flyText .9s cubic-bezier(.34,1.56,.64,1) forwards
}
@keyframes flyText{
  0%{transform:translate(-50%,-50%) scale(.1);opacity:1;filter:blur(10px)}
  20%{transform:translate(-50%,-50%) scale(2.8);opacity:1;filter:blur(0)}
  40%{transform:translate(-50%,-50%) scale(2);opacity:1}
  100%{transform:translate(var(--fx),var(--fy)) scale(.25);opacity:0}
}

/* === CONFETTI === */
.confetti{
  position:fixed;pointer-events:none;z-index:101;
  animation:confFall var(--dur) var(--del) ease-in forwards
}
@keyframes confFall{
  0%{transform:translateY(0) rotate(0deg);opacity:1}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0}
}
</style>
</head>
<body>

<div class="header">
  <div class="title" id="titleMain">💢 发泄出来！</div>
  <div class="subtitle" id="subtitleMain">想骂就骂，骂到爽为止</div>
</div>

<div class="controls">
  <input id="inputText" maxlength="60" placeholder="发泄5分钟，enter键发射" autofocus>
  <button class="auto-btn" id="autoBtn" onclick="toggleAuto()"><span id="autoBtnText">😤 骂不动了，你替我骂</span></button>
</div>

<div class="balloon-stage">
  <div class="balloon-body" id="balloonBody">
    <div class="balloon-label" id="balloonLabel">0</div>
    <div class="balloon-pct" id="balloonPct">0%</div>
  </div>
  <div class="balloon-knot" id="balloonKnot"></div>
  <div class="balloon-string" id="balloonString"></div>
  <div class="balloon-timer"><span class="timer" id="timerDisplay"></span></div>
</div>

<div class="info">
  <span id="shotLabel">已发射</span> <span id="shotCount">0</span> <span id="shotUnit">发</span>
</div>

<div class="name-sidebar" id="nameSidebar">
  <div class="hint-icon">@</div>
  <div class="hint" id="nameHint">试试输入姓名</div>
  <input id="nameInput" maxlength="10" placeholder="输入名字">
  <div class="name-tag" id="nameTag"></div>
  <div class="status" id="nameStatus">已锁定目标</div>
</div>
<div class="overlay" id="overlay" onclick="closeOverlay()">
  <div style="text-align:center;padding:2rem" id="overlayContent"></div>
</div>

<script>
// ====== INSULTS POOL ======
const INSULTS_ZH=[
  '菜鸡！！！','就这？？？','废物点心','你行你上啊','烦死了！！',
  '无语！！','摆烂了','什么玩意儿','气死我了','滚啊！！！',
  '垃圾！！','脑残吗','受不了了','啊啊啊啊啊','什么鬼东西',
  '我服了','你配吗','搞什么','一天天的','真够可以的',
  '别逼我','气炸了','没救了','毁灭吧','累了！！！',
  '你谁啊','真下头','离谱','救命','栓Q了'
];
INSULTS_EN=[
  'N00B!!!','IS THAT IT?!','USELESS','BRING IT ON','SO ANNOYING!!',
  'SPEECHLESS!!','I GIVE UP','WHAT A JOKE','PISSING ME OFF','GET LOST!!!',
  'GARBAGE!!','BRAIN DEAD',"CAN'T STAND IT",'AAAAARGH','WTF IS THAT',
  'I GIVE UP','YOU EVEN TRY?','WHAT ARE YOU DOING','EVERY DANG DAY','YOU SERIOUSLY',
  "DON'T PUSH ME",'FUMING','HOPELESS','SCREW IT',"I'M DONE!!!",
  'WHO ARE YOU?','SO CRINGE','SERIOUSLY','HELP','OMG'
];
// === i18n ===
const isCN = navigator.language.startsWith("zh");
const t = (zh, en) => isCN ? zh : en;
const INSULTS = isCN ? INSULTS_ZH : INSULTS_EN;

let shots=0;
let sessionStart=null;
let timerInterval=null;
let bossTriggered=false;
let isExploding=false;
let autoFiring=false;
let autoTimer=null;
let audioCtx=null;
let scale=0.1;
let curWobbleSpeed=2;
let targetName='';
let nameLocked=false;

const BODY=document.getElementById('balloonBody');
const KNOT=document.getElementById('balloonKnot');
const LABEL=document.getElementById('balloonLabel');
const PCT=document.getElementById('balloonPct');
const STAGE=document.querySelector('.balloon-stage');
const AUTO_BTN=document.getElementById('autoBtn');

const INPUT=document.getElementById('inputText');

function getCtx(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

// === SOUNDS ===
function playHit(){
  try{
    const ctx=getCtx(),dur=.08;
    const buf=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*.08));
    const src=ctx.createBufferSource();src.buffer=buf;
    const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=1500;
    const g=ctx.createGain();g.gain.setValueAtTime(.35,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.01,ctx.currentTime+dur);
    src.connect(f).connect(g).connect(ctx.destination);src.start()
  }catch(e){}
}
function playBoom(){
  try{
    const ctx=getCtx(),dur=.5;
    const buf=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++){const t=i/d.length;d[i]=(Math.random()*2-1)*Math.exp(-t*5)*(1-Math.random()*.3*Math.exp(-t*8))}
    const src=ctx.createBufferSource();src.buffer=buf;
    const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(400,ctx.currentTime);f.frequency.exponentialRampToValueAtTime(50,ctx.currentTime+dur);
    const g=ctx.createGain();g.gain.setValueAtTime(.5,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.01,ctx.currentTime+dur);
    src.connect(f).connect(g).connect(ctx.destination);src.start()
  }catch(e){}
}
function playInflate(){
  try{
    const ctx=getCtx(),dur=.25;
    const buf=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.15*Math.sin(i*.1)*Math.exp(-i/(d.length*.4));
    const src=ctx.createBufferSource();src.buffer=buf;
    const g=ctx.createGain();g.gain.setValueAtTime(.12,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.01,ctx.currentTime+dur);
    src.connect(g).connect(ctx.destination);src.start()
  }catch(e){}
}
function playPop(){
  try{
    const ctx=getCtx();
    const sr=ctx.sampleRate;
    // Layer 1: sharp crack (short noise burst)
    const dur1=.2;
    const buf1=ctx.createBuffer(1,sr*dur1,sr);
    const d1=buf1.getChannelData(0);
    for(let i=0;i<d1.length;i++)d1[i]=(Math.random()*2-1)*Math.exp(-i/(d1.length*.04));
    const src1=ctx.createBufferSource();src1.buffer=buf1;
    const f1=ctx.createBiquadFilter();f1.type='highpass';f1.frequency.value=1500;
    const g1=ctx.createGain();g1.gain.setValueAtTime(2.0,ctx.currentTime);g1.gain.exponentialRampToValueAtTime(.01,ctx.currentTime+dur1);
    src1.connect(f1).connect(g1).connect(ctx.destination);src1.start();
    // Layer 2: deep sub-boom (low frequency rumble) - much louder & longer
    const dur2=1.5;
    const buf2=ctx.createBuffer(1,sr*dur2,sr);
    const d2=buf2.getChannelData(0);
    for(let i=0;i<d2.length;i++){const t=i/d2.length;d2[i]=(Math.random()*2-1)*Math.exp(-t*3)*(1+t*1.5)}
    const src2=ctx.createBufferSource();src2.buffer=buf2;
    const f2=ctx.createBiquadFilter();f2.type='lowpass';f2.frequency.setValueAtTime(250,ctx.currentTime);f2.frequency.exponentialRampToValueAtTime(15,ctx.currentTime+dur2);
    const g2=ctx.createGain();g2.gain.setValueAtTime(2.8,ctx.currentTime);g2.gain.exponentialRampToValueAtTime(.01,ctx.currentTime+dur2);
    src2.connect(f2).connect(g2).connect(ctx.destination);src2.start();
    // Layer 3: low sine wave for that stomach-punch feel
    const osc=ctx.createOscillator();osc.type='sawtooth';osc.frequency.setValueAtTime(60,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(10,ctx.currentTime+.8);
    const g3=ctx.createGain();g3.gain.setValueAtTime(2.0,ctx.currentTime);g3.gain.exponentialRampToValueAtTime(.01,ctx.currentTime+.8);
    osc.connect(g3).connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.8);
  }catch(e){}
}
function playFanfare(){
  try{
    const ctx=getCtx();
    [0,.1,.2].forEach((d,i)=>{
      const f=[400,500,600][i];
      const osc=ctx.createOscillator();osc.type='square';osc.frequency.setValueAtTime(f,ctx.currentTime+d);
      const g=ctx.createGain();g.gain.setValueAtTime(0,ctx.currentTime+d);g.gain.linearRampToValueAtTime(.1,ctx.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.01,ctx.currentTime+d+.2);
      osc.connect(g).connect(ctx.destination);osc.start(ctx.currentTime+d);osc.stop(ctx.currentTime+d+.25)
    })
  }catch(e){}
}

// === AUTO FIRE ===
function toggleAuto(){
  if(bossTriggered) return;
  if(autoFiring){
    stopAuto();
  }else{
    startAuto();
  }
}
function startAuto(){
  if(autoFiring) return;
  autoFiring=true;
  AUTO_BTN.innerHTML='<span id="autoBtnText">'+t('😤 停！我亲自来','😤 Stop! My turn')+'</span>';
  AUTO_BTN.classList.add('firing');
  fireAuto();
}
function stopAuto(){
  autoFiring=false;
  AUTO_BTN.innerHTML='<span id="autoBtnText">'+t('😤 骂不动了，你替我骂','😤 Auto Fire')+'</span>';
  AUTO_BTN.classList.remove('firing');
  if(autoTimer) clearTimeout(autoTimer);
}
function fireAuto(){
  if(!autoFiring||bossTriggered||isExploding){stopAuto();return}
  let insult=INSULTS[Math.floor(Math.random()*INSULTS.length)];
  if(targetName&&nameLocked) insult=targetName+'，'+insult;
  fireText(insult);
  // Speed up as more shots fired
  const delay=Math.max(150,600-shots*8);
  autoTimer=setTimeout(fireAuto,delay);
}

// === FIRE TEXT (shared by manual & auto) ===
function fireText(text){
  if(!text||isExploding)return;
  if(!sessionStart){
    sessionStart=Date.now();
    document.getElementById('timerDisplay').classList.add('show');
    timerInterval=setInterval(updateTimer,1000);
    updateTimer();
  }

  shots++;
  document.getElementById('shotCount').textContent=shots;
  LABEL.textContent=shots;

  // Sound
  playHit();setTimeout(()=>playBoom(),20);setTimeout(()=>playInflate(),120);

  // Fly animation
  const cx=window.innerWidth/2;
  const cy=window.innerHeight*.35;

  const fly=document.createElement('div');
  fly.className='fly-text';
  const colors=['#ffffff','#00e5ff','#76ff03','#ffff00','#e040fb','#ff9100'];
  fly.style.cssText='left:'+cx+'px;top:'+cy+'px;font-size:1.6rem;color:'+colors[shots%colors.length]+';text-shadow:0 0 15px #000,0 0 30px '+colors[shots%colors.length];

  const balloonRect=BODY.getBoundingClientRect();
  const bx=balloonRect.left+balloonRect.width/2;
  const by=balloonRect.top+balloonRect.height/2;

  fly.style.setProperty('--fx',(bx-cx)+'px');
  fly.style.setProperty('--fy',(by-cy)+'px');
  fly.textContent=text;
  document.body.appendChild(fly);
  setTimeout(()=>fly.remove(),1100);

  // Particles
  const pColors=['#ff1744','#ff6f00','#ffab00'];
  for(let i=0;i<20;i++){
    const p=document.createElement('div');
    const sz=2+Math.random()*8;
    const ang=Math.random()*Math.PI*2;
    const dist=30+Math.random()*100;
    p.style.cssText='position:fixed;pointer-events:none;z-index:49;border-radius:50%;width:'+sz+'px;height:'+sz+'px;background:'+pColors[i%pColors.length]+';left:'+cx+'px;top:'+cy+'px;animation:pp '+(.2+Math.random()*.3)+'s ease-out forwards';
    p.style.setProperty('--dx',Math.cos(ang)*dist+'px');
    p.style.setProperty('--dy',Math.sin(ang)*dist+'px');
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),600)
  }
  document.head.insertAdjacentHTML('beforeend','<style>@keyframes pp{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}</style>');

  // Inflate balloon
  const fillPct=Math.min(shots/30,1);
  scale=0.1+fillPct*2.0;
  BODY.style.transform='scale('+scale+')';
  KNOT.style.transform='scale('+scale+')';
  PCT.textContent=Math.round(fillPct*100)+'%';


  // Wobble intensity
  const speed=Math.max(0.4,2-fillPct*1.6);
  BODY.style.setProperty('--wobble-speed',speed+'s');
  BODY.style.setProperty('--s',scale);
  BODY.classList.remove('wobble','wobble-fast');
  // Force reflow
  void BODY.offsetWidth;
  if(fillPct>0.35) BODY.classList.add('wobble-fast');
  else if(fillPct>0.15) BODY.classList.add('wobble');
  else BODY.classList.remove('wobble','wobble-fast');

  // Glow intensifies
  const glow=25+fillPct*50;
  BODY.style.boxShadow='0 -30px '+glow+'px rgba(255,23,68,'+(.15+fillPct*.2)+'), inset 0 -40px 60px rgba(0,0,0,.4)';

  // Boss check
  if(!bossTriggered&&sessionStart&&Date.now()-sessionStart>=30000){
    bossTriggered=true;
    stopAuto();
    setTimeout(triggerBoss,400);
  }
}

// === VENT (manual) ===
function vent(){
  const ta=INPUT;
  let text=ta.value.trim();
  if(!text||isExploding)return;
  if(targetName&&nameLocked) text=targetName+'，'+text;
  fireText(text);
  if(autoFiring) stopAuto();
  ta.value='';
}

// === BALLOON BURST ===
function triggerBoss(){
  clearInterval(timerInterval);
  isExploding=true;

  playPop();
  // No more fanfare

  // Balloon explodes
  BODY.style.transition='all .35s';
  BODY.style.transform='scale(4)';
  BODY.style.opacity='0';
  KNOT.style.opacity='0';

  const cx=window.innerWidth/2,cy=window.innerHeight*.4;
  // Shards
  for(let i=0;i<80;i++){
    const sh=document.createElement('div');
    const sz=5+Math.random()*25;
    const ang=Math.random()*Math.PI*2;
    const dist=100+Math.random()*500;
    sh.style.cssText='position:fixed;pointer-events:none;z-index:50;border-radius:'+(Math.random()>.5?'50%':'2px')+';width:'+sz+'px;height:'+(sz*.7)+'px;background:'+['#ff1744','#c62828','#ff6f00','#7f0000','#ff5252','#ffab00','#d500f9','#b71c1c'][i%8]+';left:'+cx+'px;top:'+cy+'px;animation:shard '+(.4+Math.random()*.4)+'s ease-out forwards';
    sh.style.setProperty('--dx',Math.cos(ang)*dist+'px');
    sh.style.setProperty('--dy',Math.sin(ang)*dist+'px');
    document.body.appendChild(sh);
    setTimeout(()=>sh.remove(),1000)
  }
  document.head.insertAdjacentHTML('beforeend','<style>@keyframes shard{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}</style>');

  // Confetti
  const cc=['#ff1744','#ff6f00','#ffab00','#ffea00','#00e5ff','#d500f9','#76ff03','#ff9100'];
  for(let i=0;i<100;i++){
    const c=document.createElement('div');
    c.className='confetti';
    const sz=4+Math.random()*14;
    const x=Math.random()*window.innerWidth;
    c.style.cssText='position:fixed;top:-20px;left:'+x+'px;width:'+sz+'px;height:'+(sz*.6)+'px;background:'+cc[i%cc.length]+';z-index:101;pointer-events:none;border-radius:2px;transform:rotate('+(Math.random()*360)+'deg);animation:confFall '+(2+Math.random()*3)+'s '+(Math.random()*2)+'s ease-in forwards';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),6000)
  }

  setTimeout(()=>{
    const ov=document.getElementById('overlay');
    const oc=document.getElementById('overlayContent');
    oc.innerHTML='<div style="font-size:clamp(1.8rem,8vw,4.5rem);font-weight:900;color:#ff1744;text-shadow:0 0 40px #ff1744,0 0 120px #ff174466;line-height:1.5;animation:msgIn .8s cubic-bezier(.34,1.56,.64,1) forwards">'+t('那傻逼已经收到了来自宇宙的无数暴击了!!!!!','THAT JERK JUST GOT OBLITERATED BY THE UNIVERSE!!!!!')+'</div><div style="margin-top:1.2rem;font-size:1.2rem;color:#ff6f00;text-shadow:0 0 20px #ff6f0066;opacity:0;animation:msgSub .5s .5s forwards">'+t('✦ 气 球 爆 破 ✦','✦ B A L L O O N  B O O M ✦')+'</div>';
    document.head.insertAdjacentHTML('beforeend','<style>@keyframes msgIn{0%{transform:scale(.1);opacity:0}100%{transform:scale(1);opacity:1}}@keyframes msgSub{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}</style>');
    ov.classList.add('active');
  },400);
}

function closeOverlay(){
  document.getElementById('overlay').classList.remove('active');
  isExploding=false;
  BODY.style.opacity='1';
  BODY.style.transform='';
  BODY.style.boxShadow='';
  BODY.classList.remove('wobble','wobble-fast');
  KNOT.style.opacity='1';
  KNOT.style.transform='';
  scale=0.1;
  shots=0;
  LABEL.textContent=0;
  PCT.textContent='0%';
  document.getElementById('shotCount').textContent=0;
  document.getElementById('inputText').focus();
  document.getElementById('timerDisplay').classList.remove('show');
  sessionStart=null;
  bossTriggered=false;
  if(timerInterval) clearInterval(timerInterval);
}

function updateTimer(){
  const el=document.getElementById('timerDisplay');
  if(!sessionStart){el.textContent='';return}
  const remaining=Math.max(0,30000-(Date.now()-sessionStart));
  let rs=Math.floor(remaining/1000), rm=Math.floor(rs/60); rs=rs%60;
  el.textContent=remaining>0?t('充能 ','CHARGING ')+String(rm).padStart(2,'0')+':'+String(rs).padStart(2,'0'):t('✦ 充满! 要炸了!','✦ FULL! ABOUT TO BURST! ✦');
}

// === NAME INPUT HANDLER ===
const NAME_INPUT=document.getElementById('nameInput');
const NAME_TAG=document.getElementById('nameTag');
const NAME_STATUS=document.getElementById('nameStatus');

function updateNameTag(){
  if(targetName){
    NAME_TAG.style.display='block';
    NAME_TAG.textContent=targetName;
    if(nameLocked){
      NAME_TAG.classList.add('active');
      NAME_STATUS.style.display='block';
      INPUT.placeholder=t('骂 ','Yell at ')+targetName+'...';
    }else{
      NAME_TAG.classList.remove('active');
      NAME_STATUS.style.display='none';
      INPUT.placeholder=t('发泄5分钟，enter键发射','Vent 5 min, press Enter');
    }
  }else{
    NAME_TAG.style.display='none';
    NAME_STATUS.style.display='none';
  }
}
function setTargetName(){
  const n=NAME_INPUT.value.trim();
  if(n){
    targetName=n;
    nameLocked=true;
    updateNameTag();
    INPUT.focus();
  }
}
function clearName(){
  targetName='';
  nameLocked=false;
  NAME_INPUT.value='';
  updateNameTag();
  INPUT.placeholder=t('发泄5分钟，enter键发射','Vent 5 min, press Enter');
  INPUT.focus();
}
NAME_TAG.addEventListener('click',function(){
  if(targetName){
    if(nameLocked){
      NAME_TAG.classList.remove('active');
      nameLocked=false;
      INPUT.placeholder=t('发泄5分钟，enter键发射','Vent 5 min, press Enter');
      NAME_STATUS.style.display='none';
    }else{
      NAME_TAG.classList.add('active');
      nameLocked=true;
      INPUT.placeholder=t('骂 ','Yell at ')+targetName+'...';
      NAME_STATUS.style.display='block';
    }
    INPUT.focus();
  }
});
NAME_INPUT.addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();setTargetName()}
});
NAME_INPUT.addEventListener('blur',setTargetName);

// === EVENTS ===
INPUT.addEventListener('keydown',(e)=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();vent()}
});
// i18n: update labels
if(!isCN){
  const el=document.getElementById('titleMain');
  if(el) el.textContent='💢 SCREAM IT OUT!';
  const sub=document.getElementById('subtitleMain');
  if(sub) sub.textContent='Vent it out, fire on Enter';
  const sl=document.getElementById('shotLabel');
  if(sl) sl.textContent='Shots fired';
  const su=document.getElementById('shotUnit');
  if(su) su.textContent='';
  const nh=document.getElementById('nameHint');
  if(nh) nh.textContent='Target a name';
  const np=document.getElementById('nameInput');
  if(np) np.placeholder='Enter name';
  const ns=document.getElementById('nameStatus');
  if(ns) ns.textContent='Target locked';
  const at=document.getElementById('autoBtnText');
  if(at) at.textContent='😤 Auto Fire';
  const ip=document.getElementById('inputText');
  if(ip) ip.placeholder='Vent 5 min, press Enter';
}
setTimeout(()=>INPUT.focus(),100);
</script>
