<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>澄识 — AI 信息精炼与深度阅读</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0d1117;
      --ink-soft: #1a1f2e;
      --mist: #f7f6f3;
      --mist-warm: #faf9f7;
      --amber: #d4a853;
      --amber-glow: #e8c478;
      --amber-dim: #a6863d;
      --slate: #6b7280;
      --slate-light: #9ca3af;
      --divider: rgba(212, 168, 83, 0.15);
      --radius: 12px;
      --radius-sm: 8px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', -apple-system, sans-serif;
      background: var(--ink);
      color: var(--mist);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Noise texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      z-index: 1000;
    }

    /* Ambient gradient */
    .ambient {
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 30% 20%, rgba(212, 168, 83, 0.08) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 80%, rgba(107, 114, 128, 0.05) 0%, transparent 40%);
      animation: drift 20s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(-2%, 1%) rotate(1deg); }
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 24px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      padding: 48px 0 0;
      text-align: center;
    }

    .logo-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border: 1.5px solid var(--amber);
      border-radius: 50%;
      margin-bottom: 32px;
      position: relative;
    }

    .logo-mark::after {
      content: '';
      position: absolute;
      inset: 6px;
      border: 1px solid var(--divider);
      border-radius: 50%;
    }

    .logo-mark svg {
      width: 24px;
      height: 24px;
      color: var(--amber);
    }

    .brand {
      font-family: 'Noto Serif SC', serif;
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--mist) 0%, var(--amber-glow) 50%, var(--mist) 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 4s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% { background-position: 0% center; }
      50% { background-position: 100% center; }
    }

    .tagline {
      font-size: 1.1rem;
      color: var(--slate-light);
      font-weight: 300;
      letter-spacing: 0.15em;
      margin-bottom: 48px;
    }

    /* Hero description */
    .hero-desc {
      font-size: 1rem;
      line-height: 1.8;
      color: var(--slate);
      max-width: 520px;
      margin: 0 auto 64px;
      text-align: center;
    }

    /* Divider */
    .divider {
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--amber), transparent);
      margin: 0 auto 64px;
    }

    /* Three-tier explanation */
    .tiers {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-bottom: 80px;
    }

    .tier {
      text-align: center;
      padding: 28px 16px;
      background: rgba(26, 31, 46, 0.5);
      border: 1px solid rgba(212, 168, 83, 0.08);
      border-radius: var(--radius);
      transition: all 0.3s ease;
    }

    .tier:hover {
      border-color: rgba(212, 168, 83, 0.25);
      transform: translateY(-4px);
    }

    .tier-num {
      font-family: 'Noto Serif SC', serif;
      font-size: 2rem;
      font-weight: 600;
      color: var(--amber);
      opacity: 0.6;
      margin-bottom: 8px;
    }

    .tier-name {
      font-family: 'Noto Serif SC', serif;
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--mist);
    }

    .tier-desc {
      font-size: 0.85rem;
      color: var(--slate);
      line-height: 1.6;
    }

    /* Signup form */
    .signup-section {
      background: var(--mist-warm);
      border-radius: 20px;
      padding: 48px 40px;
      margin-bottom: 80px;
      position: relative;
      overflow: hidden;
    }

    .signup-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--amber-dim), var(--amber-glow), var(--amber-dim));
    }

    .signup-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--ink);
      text-align: center;
      margin-bottom: 8px;
    }

    .signup-subtitle {
      font-size: 0.9rem;
      color: var(--slate);
      text-align: center;
      margin-bottom: 36px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--ink-soft);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1rem;
      font-family: inherit;
      color: var(--ink);
      background: #fff;
      border: 1.5px solid #e5e5e5;
      border-radius: var(--radius-sm);
      transition: all 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(212, 168, 83, 0.15);
    }

    .form-input::placeholder {
      color: var(--slate-light);
    }

    /* Topic tags */
    .topics-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .topic-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      font-size: 0.9rem;
      font-family: inherit;
      color: var(--ink-soft);
      background: #fff;
      border: 1.5px solid #e5e5e5;
      border-radius: 24px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .topic-tag:hover {
      border-color: var(--amber-dim);
      background: #fffdf8;
    }

    .topic-tag.selected {
      background: var(--amber);
      border-color: var(--amber);
      color: var(--ink);
      font-weight: 500;
    }

    .topic-tag.selected::before {
      content: '✓';
      font-weight: 600;
    }

    .topic-tag.disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .topic-count {
      font-size: 0.8rem;
      color: var(--slate);
      text-align: center;
      margin-top: 12px;
    }

    .topic-count.warning {
      color: var(--amber-dim);
      font-weight: 500;
    }

    /* Dashboard preview link */
    .dashboard-preview {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      margin-top: 16px;
      background: rgba(212, 168, 83, 0.08);
      border: 1px dashed rgba(212, 168, 83, 0.3);
      border-radius: var(--radius-sm);
      opacity: 0;
      transform: translateY(-8px);
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .dashboard-preview.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .dashboard-preview a {
      color: var(--amber);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .dashboard-preview a:hover {
      color: var(--amber-glow);
    }

    .dashboard-preview svg {
      width: 16px;
      height: 16px;
    }

    .dashboard-preview-hint {
      font-size: 0.8rem;
      color: var(--slate);
      margin-left: 4px;
    }

    /* Submit button */
    .submit-btn {
      width: 100%;
      padding: 16px 32px;
      font-size: 1rem;
      font-family: inherit;
      font-weight: 600;
      color: var(--ink);
      background: linear-gradient(135deg, var(--amber-glow), var(--amber));
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(212, 168, 83, 0.35);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .submit-btn.loading {
      color: transparent;
    }

    .submit-btn.loading::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      top: 50%;
      left: 50%;
      margin: -10px 0 0 -10px;
      border: 2px solid var(--ink);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Success state */
    .success-message {
      display: none;
      text-align: center;
      padding: 32px 0;
    }

    .success-message.show {
      display: block;
    }

    .success-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .success-icon svg {
      width: 32px;
      height: 32px;
      color: #fff;
    }

    .success-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .success-desc {
      font-size: 0.95rem;
      color: var(--slate);
      line-height: 1.6;
    }

    /* Form state */
    .form-content {
      transition: opacity 0.3s ease;
    }

    .form-content.hidden {
      display: none;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 32px 0 48px;
      color: var(--slate);
      font-size: 0.85rem;
    }

    footer a {
      color: var(--amber-dim);
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover {
      color: var(--amber);
    }

    /* Responsive */
    @media (max-width: 640px) {
      .brand {
        font-size: 2rem;
      }

      .tagline {
        font-size: 0.95rem;
        letter-spacing: 0.1em;
      }

      .hero-desc {
        font-size: 0.95rem;
        margin-bottom: 48px;
      }

      .tiers {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .tier {
        padding: 24px 20px;
      }

      .signup-section {
        padding: 36px 24px;
        border-radius: 16px;
      }

      .topics-grid {
        gap: 8px;
      }

      .topic-tag {
        padding: 6px 12px;
        font-size: 0.85rem;
      }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="ambient"></div>

  <header>
    <div class="container">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 2a7 7 0 0 1 0 14 7 7 0 0 1 0-14"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </div>
      <h1 class="brand">澄识</h1>
      <p class="tagline">AI 信息精炼与深度阅读</p>
      <p class="hero-desc">
        在信息洪流中，为你筛选精华、提炼价值。<br>
        每日送达，只看你真正需要的内容。
      </p>
      <div class="divider"></div>
    </div>
  </header>

  <main>
    <div class="container">
      <!-- Three-tier explanation -->
      <section class="tiers">
        <div class="tier">
          <div class="tier-num">01</div>
          <div class="tier-name">摘要层</div>
          <div class="tier-desc">核心要点快速获取<br>5分钟了解精华</div>
        </div>
        <div class="tier">
          <div class="tier-num">02</div>
          <div class="tier-name">解读层</div>
          <div class="tier-desc">背景分析与多角度解读<br>有兴趣时深入探索</div>
        </div>
        <div class="tier">
          <div class="tier-num">03</div>
          <div class="tier-name">报告层</div>
          <div class="tier-desc">完整报告与延伸阅读<br>支持系统化学习</div>
        </div>
      </section>

      <!-- Signup form -->
      <section class="signup-section">
        <div class="form-content" id="formContent">
          <h2 class="signup-title">开启你的每日精炼简报</h2>
          <p class="signup-subtitle">填写以下信息，我们将每日为你推送精选内容</p>

          <form id="signupForm">
            <div class="form-group">
              <label class="form-label" for="email">邮箱地址</label>
              <input
                type="email"
                id="email"
                class="form-input"
                placeholder="your@email.com"
                required
                autocomplete="email"
              >
              <div class="dashboard-preview" id="dashboardPreview">
                <a href="#" id="dashboardLink">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"/>
                    <rect x="14" y="3" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/>
                    <rect x="3" y="14" width="7" height="7"/>
                  </svg>
                  预览我的专属仪表盘
                </a>
                <span class="dashboard-preview-hint">（输入邮箱后可见）</span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">关注主题（最多选择 5 个）</label>
              <div class="topics-grid" id="topicsGrid">
                <button type="button" class="topic-tag" data-topic="人工智能">人工智能</button>
                <button type="button" class="topic-tag" data-topic="商业财经">商业财经</button>
                <button type="button" class="topic-tag" data-topic="科技创新">科技创新</button>
                <button type="button" class="topic-tag" data-topic="健康医疗">健康医疗</button>
                <button type="button" class="topic-tag" data-topic="教育学习">教育学习</button>
                <button type="button" class="topic-tag" data-topic="文化社科">文化社科</button>
                <button type="button" class="topic-tag" data-topic="环境能源">环境能源</button>
                <button type="button" class="topic-tag" data-topic="设计创意">设计创意</button>
              </div>
              <div class="topic-count" id="topicCount">已选择 0 / 5 个主题</div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
              立即订阅
            </button>
          </form>
        </div>

        <div class="success-message" id="successMessage">
          <div class="success-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <h3 class="success-title">订阅成功</h3>
          <p class="success-desc">
            请查收邮箱中的验证邮件，点击链接完成订阅确认。
          </p>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>© 2026 澄识 · 让信息回归价值</p>
    </div>
  </footer>

  <script>
    (function() {
      const MAX_TOPICS = 5;
      const topicsGrid = document.getElementById('topicsGrid');
      const topicCount = document.getElementById('topicCount');
      const formContent = document.getElementById('formContent');
      const successMessage = document.getElementById('successMessage');
      const signupForm = document.getElementById('signupForm');
      const submitBtn = document.getElementById('submitBtn');
      const emailInput = document.getElementById('email');
      const dashboardPreview = document.getElementById('dashboardPreview');
      const dashboardLink = document.getElementById('dashboardLink');

      let selectedTopics = [];

      // Email validation helper
      function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      }

      // Update dashboard preview visibility and link
      function updateDashboardPreview() {
        const email = emailInput.value.trim();

        if (isValidEmail(email)) {
          // Build preview link with current selections
          const topics = selectedTopics.length > 0 ? selectedTopics : ['人工智能', '商业财经', '科技创新'];
          const previewUrl = `澄识-个人仪表盘.html?email=${encodeURIComponent(email)}&topics=${topics.join(',')}&confirmed=true`;
          dashboardLink.href = previewUrl;
          dashboardPreview.classList.add('visible');
        } else {
          dashboardPreview.classList.remove('visible');
        }
      }

      // Listen for email input changes
      emailInput.addEventListener('input', updateDashboardPreview);
      emailInput.addEventListener('blur', updateDashboardPreview);

      // Topic selection
      topicsGrid.addEventListener('click', (e) => {
        const tag = e.target.closest('.topic-tag');
        if (!tag || tag.classList.contains('disabled')) return;

        const topic = tag.dataset.topic;
        const isSelected = tag.classList.contains('selected');

        if (isSelected) {
          // Deselect
          selectedTopics = selectedTopics.filter(t => t !== topic);
          tag.classList.remove('selected');
        } else {
          // Select (if under limit)
          if (selectedTopics.length < MAX_TOPICS) {
            selectedTopics.push(topic);
            tag.classList.add('selected');
          }
        }

        updateTopicCount();
        updateDisabledTags();
        updateDashboardPreview(); // Update preview link with new topics
      });

      function updateTopicCount() {
        const count = selectedTopics.length;
        topicCount.textContent = `已选择 ${count} / ${MAX_TOPICS} 个主题`;
        topicCount.classList.toggle('warning', count >= MAX_TOPICS);
      }

      function updateDisabledTags() {
        const isFull = selectedTopics.length >= MAX_TOPICS;
        document.querySelectorAll('.topic-tag').forEach(tag => {
          if (!tag.classList.contains('selected')) {
            tag.classList.toggle('disabled', isFull);
          }
        });
      }

      // Form submission
      signupForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = emailInput.value.trim();
        if (!email) {
          emailInput.focus();
          return;
        }

        if (selectedTopics.length === 0) {
          topicCount.textContent = '请至少选择一个主题';
          topicCount.classList.add('warning');
          return;
        }

        // Show loading state
        submitBtn.classList.add('loading');
        submitBtn.disabled = true;

        // Simulate API call
        await new Promise(resolve => setTimeout(resolve, 1500));

        // Store subscription data for demo
        localStorage.setItem('chongshi_email', email);
        localStorage.setItem('chongshi_topics', JSON.stringify(selectedTopics));

        // Show success with confirmation link
        formContent.classList.add('hidden');
        successMessage.classList.add('show');

        // Update success message with demo link
        const successDesc = successMessage.querySelector('.success-desc');
        const demoLink = `?email=${encodeURIComponent(email)}&topics=${selectedTopics.join(',')}&confirmed=true`;
        successDesc.innerHTML = `
          订阅成功！<br><br>
          <strong>演示链接</strong>（模拟邮件中的确认入口）：<br>
          <a href="澄识-个人仪表盘.html${demoLink}" style="color: var(--amber-dim); word-break: break-all;">
            点击此处查看你的专属仪表盘 →
          </a>
        `;

        // Log for demo
        console.log('Subscription:', { email, topics: selectedTopics });
      });

      // Focus state for input
      emailInput.addEventListener('focus', () => {
        emailInput.parentElement.classList.add('focused');
      });
      emailInput.addEventListener('blur', () => {
        emailInput.parentElement.classList.remove('focused');
      });
    })();
  </script>
</body>
</html>
