<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>分层小哨</title>
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --accent-high: #3b82f6;
            --accent-paid: #10b981;
            --accent-complaint: #ef4444;
            --shadow: 0 2px 8px rgba(0,0,0,0.05);
            --radius: 0.75rem;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
        }

        .dark-mode {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
            --shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: var(--spacing-md);
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 1024px;
            margin: 0 auto;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-weight: 700;
            font-size: 1.5rem;
            margin: 0;
        }

        .theme-toggle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: var(--accent-high);
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
        }

        /* Input Section */
        .input-section {
            margin-bottom: var(--spacing-lg);
        }

        .input-label {
            display: block;
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
            font-size: 1.05rem;
        }

        .input-area {
            width: 100%;
            min-height: 200px;
            padding: var(--spacing-md);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background-color: var(--bg-card);
            font-size: 0.95rem;
            line-height: 1.5;
            resize: vertical;
            transition: border-color 0.2s;
        }

        .input-area:focus {
            outline: none;
            border-color: var(--accent-high);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .input-placeholder {
            color: var(--text-secondary);
        }

        .btn-analyze {
            background-color: var(--accent-high);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            margin-top: var(--spacing-sm);
            transition: all 0.2s;
        }

        .btn-analyze:hover:not(:disabled) {
            background-color: #2563eb;
            transform: translateY(-1px);
        }

        .btn-analyze:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Results Section */
        .results-section {
            margin-top: var(--spacing-lg);
        }

        .results-title {
            font-weight: 700;
            font-size: 1.25rem;
            margin-bottom: var(--spacing-md);
            display: flex;
            align-items: center;
        }

        .results-title span {
            margin-left: 0.5rem;
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .cards-container {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            overflow-x: auto;
            padding-bottom: 0.5rem;
            -webkit-overflow-scrolling: touch;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: var(--radius);
            padding: var(--spacing-md);
            box-shadow: var(--shadow);
            border-left: 4px solid var(--accent-high);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--spacing-sm);
        }

        .action-tag {
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tag-high { background-color: rgba(59, 130, 246, 0.1); color: var(--accent-high); }
        .tag-paid { background-color: rgba(16, 185, 129, 0.1); color: var(--accent-paid); }
        .tag-complaint { background-color: rgba(239, 68, 68, 0.1); color: var(--accent-complaint); }

        .card-title {
            font-weight: 700;
            font-size: 1.05rem;
            margin: 0;
        }

        .card-content {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin: var(--spacing-sm) 0;
            padding: 0.5rem;
            background-color: rgba(0,0,0,0.03);
            border-radius: var(--radius);
            word-break: break-word;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .copy-btn {
            background: none;
            border: none;
            color: var(--accent-high);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .copy-btn:hover:not(:disabled) {
            background-color: rgba(59, 130, 246, 0.1);
        }

        .copy-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
        }

        .empty-state p {
            margin-top: var(--spacing-md);
            font-size: 0.95rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: var(--spacing-sm);
            }

            .container {
                padding: 0;
            }

            header {
                flex-direction: column;
                gap: var(--spacing-md);
                text-align: center;
            }

            .cards-container {
                align-items: center;
            }

            .card {
                width: 100%;
                max-width: 480px;
            }
        }

        /* Scrollbar for cards container */
        .cards-container::-webkit-scrollbar {
            height: 6px;
        }
        .cards-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .cards-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>分层小哨</h1>
            <button class="theme-toggle" id="themeToggle" aria-label="切换深色模式">🌙</button>
        </header>

        <section class="input-section">
            <label class="input-label" for="chatInput">粘贴微信聊天记录（纯文本）</label>
            <textarea 
                id="chatInput" 
                class="input-area" 
                placeholder="示例：&#10;[2024-05-20 14:22] 张三：你们家试用装怎么买？&#10;[2024-05-20 14:23] 客服：稍等，我给您发链接~&#10;[2024-05-20 15:01] 李四：物流太慢了，已退款！&#10;[2024-05-20 15:30] 王五：价格能再优惠点吗？想下单……"></textarea>
            <button id="analyzeBtn" class="btn-analyze">开始分层分析</button>
        </section>

        <section class="results-section">
            <h2 class="results-title">可执行动作清单 <span id="resultCount">(共 0 条)</span></h2>
            <div class="cards-container" id="cardsContainer">
                <div class="empty-state">
                    <p>粘贴聊天记录后点击「开始分层分析」，将自动生成可执行动作卡片</p>
                </div>
            </div>
        </section>
    </div>

    <script>
        // 主题切换
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            body.classList.add('dark-mode');
            themeToggle.textContent = '☀️';
        }

        themeToggle.addEventListener('click', () => {
            if (body.classList.contains('dark-mode')) {
                body.classList.remove('dark-mode');
                localStorage.setItem('theme', 'light');
                themeToggle.textContent = '🌙';
            } else {
                body.classList.add('dark-mode');
                localStorage.setItem('theme', 'dark');
                themeToggle.textContent = '☀️';
            }
        });

        // 模拟AI分层逻辑（前端轻量规则）
        function parseChatText(text) {
            const lines = text.split('\n').filter(line => line.trim() !== '');
            const actions = [];

            // 简单关键词匹配（模拟TRAE Work语义识别）
            lines.forEach((line, idx) => {
                const cleanLine = line.trim();
                if (!cleanLine) return;

                // 提取时间、昵称、消息体（简化版）
                const timeMatch = cleanLine.match(/\[(\d{4}-\d{2}-\d{2} \d{2}:\d{2})\]/);
                const nameMatch = cleanLine.match(/\](.*?):/);
                const msgBody = cleanLine.replace(/\[.*?\].*?:/, '').trim();

                if (!msgBody) return;

                let tag = '高意向';
                let colorClass = 'tag-high';
                let action = '';

                if (/试用|试用装|样品/.test(msgBody)) {
                    tag = '高意向';
                    colorClass = 'tag-high';
                    action = `【明日跟进】${nameMatch ? nameMatch[1].trim() : '未知用户'}-咨询试用`;
                } else if (/价格.*?优惠|能便宜|再降点|想下单/.test(msgBody)) {
                    tag = '高意向';
                    colorClass = 'tag-high';
                    action = `【今日跟进】${nameMatch ? nameMatch[1].trim() : '未知用户'}-问过价格未下单`;
                } else if (/已付款|已转账|已下单/.test(msgBody)) {
                    tag = '已付费';
                    colorClass = 'tag-paid';
                    action = `【确认发货】${nameMatch ? nameMatch[1].trim() : '未知用户'}-完成支付`;
                } else if (/退款|退钱|太慢|差评|投诉/.test(msgBody)) {
                    tag = '投诉倾向';
                    colorClass = 'tag-complaint';
                    action = `【紧急处理】${nameMatch ? nameMatch[1].trim() : '未知用户'}-表达不满`;
                } else if (/物流|快递|发货/.test(msgBody) && /慢|差|没到/.test(msgBody)) {
                    tag = '投诉倾向';
                    colorClass = 'tag-complaint';
                    action = `【物流核查】${nameMatch ? nameMatch[1].trim() : '未知用户'}-物流异常`;
                } else {
                    return; // 忽略无明确意图的普通消息
                }

                actions.push({
                    tag,
                    colorClass,
                    action,
                    snippet: msgBody.length > 40 ? msgBody.substring(0, 40) + '…' : msgBody,
                    time: timeMatch ? timeMatch[1] : '未知时间'
                });
            });

            return actions;
        }

        // 渲染卡片
        function renderCards(actions) {
            const container = document.getElementById('cardsContainer');
            const countEl = document.getElementById('resultCount');

            if (actions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p>未识别到可执行动作，请检查聊天记录是否包含明确意图关键词（如“试用”“价格”“退款”等）</p>
                    </div>
                `;
                countEl.textContent = '(共 0 条)';
                return;
            }

            countEl.textContent = `(${actions.length} 条)`;

            container.innerHTML = actions.map((item, i) => `
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">${item.action}</div>
                        <span class="action-tag ${item.colorClass}">${item.tag}</span>
                    </div>
                    <div class="card-content">${item.snippet}</div>
                    <div class="card-footer">
                        <span>${item.time}</span>
                        <button class="copy-btn" data-index="${i}" title="复制此条动作">📋</button>
                    </div>
                </div>
            `).join('');

            // 绑定复制事件
            document.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const index = parseInt(this.getAttribute('data-index'));
                    const textToCopy = actions[index].action;
                    navigator.clipboard.writeText(textToCopy)
                        .then(() => {
                            const originalText = this.textContent;
                            this.textContent = '✓';
                            setTimeout(() => {
                                this.textContent = originalText;
                            }, 1500);
                        })
                        .catch(err => console.warn('复制失败:', err));
                });
            });
        }

        // 分析按钮事件
        const analyzeBtn = document.getElementById('analyzeBtn');
        const chatInput = document.getElementById('chatInput');

        analyzeBtn.addEventListener('click', () => {
            const inputText = chatInput.value.trim();
            if (!inputText) {
                alert('请先粘贴聊天记录');
                return;
            }
            const actions = parseChatText(inputText);
            renderCards(actions);
        });

        // 初始化示例数据（仅首次加载时展示，避免干扰用户）
        if (!chatInput.value.trim()) {
            chatInput.value = `[2024-05-20 14:22] 张三：你们家试用装怎么买？\n[2024-05-20 14:23] 客服：稍等，我给您发链接~\n[2024-05-20 15:01] 李四：物流太慢了，已退款！\n[2024-05-20 15:30] 王五：价格能再优惠点吗？想下单……`;
        }
    </script>
</body>
</html>
