// ============ APP STATE ============
let currentGroup = null;
let currentWords = [];
let currentIndex = 0;
let isFlipped = false;
let mode = 'all'; // 'all', 'unknown', 'shuffle'
let knownSet = new Set(); // store "group:word" keys
let unknownSet = new Set();
let learnedSet = new Set();

// Load from localStorage
function loadState() {
  try {
    const saved = localStorage.getItem('fudanVocabState');
    if (saved) {
      const data = JSON.parse(saved);
      knownSet = new Set(data.known || []);
      unknownSet = new Set(data.unknown || []);
      learnedSet = new Set(data.learned || []);
    }
  } catch(e) {}
}

function saveState() {
  try {
    localStorage.setItem('fudanVocabState', JSON.stringify({
      known: [...knownSet],
      unknown: [...unknownSet],
      learned: [...learnedSet]
    }));
  } catch(e) {}
}

function getWordKey(word) {
  return currentGroup + ':' + word.w;
}

// ============ INIT ============
function init() {
  loadState();
  renderGroupBar();
  // Select first group by default
  const firstGroup = Object.keys(wordData)[0];
  selectGroup(firstGroup);
}

function renderGroupBar() {
  const bar = document.getElementById('groupBar');
  bar.innerHTML = '';
  for (const groupName in wordData) {
    const btn = document.createElement('button');
    btn.className = 'group-btn';
    btn.textContent = groupName;
    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = '(' + wordData[groupName].words.length + ')';
    btn.appendChild(count);
    btn.onclick = function() { selectGroup(groupName); };
    bar.appendChild(btn);
  }
}

function selectGroup(groupName) {
  currentGroup = groupName;
  // Update active button
  const buttons = document.querySelectorAll('.group-btn');
  buttons.forEach(function(btn) {
    btn.classList.toggle('active', btn.textContent.indexOf(groupName) === 0);
  });

  // Build word list based on mode
  rebuildWordList();
  currentIndex = 0;
  showCard();
}

function rebuildWordList() {
  let words = wordData[currentGroup].words.slice();

  if (mode === 'unknown') {
    // Only show unknown words
    words = words.filter(function(w) {
      return unknownSet.has(getWordKey(w)) || !learnedSet.has(getWordKey(w));
    });
    // Actually for unknown mode, show only marked unknown
    words = wordData[currentGroup].words.filter(function(w) {
      return unknownSet.has(currentGroup + ':' + w.w);
    });
    if (words.length === 0) {
      words = wordData[currentGroup].words.filter(function(w) {
        return !knownSet.has(currentGroup + ':' + w.w);
      });
    }
  }

  if (mode === 'shuffle') {
    // Shuffle
    for (var i = words.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = words[i];
      words[i] = words[j];
      words[j] = temp;
    }
  }

  currentWords = words;
}

// ============ CARD DISPLAY ============
function showCard() {
  if (currentWords.length === 0) {
    showComplete();
    return;
  }

  if (currentIndex >= currentWords.length) {
    showComplete();
    return;
  }

  var word = currentWords[currentIndex];
  var tagClass = wordData[currentGroup].color;

  document.getElementById('cardWord').textContent = word.w;
  document.getElementById('cardPhonetic').textContent = word.p || '';
  document.getElementById('cardMeaning').textContent = word.m;
  document.getElementById('cardDerivative').textContent = word.d && word.d !== '—' ? '派生: ' + word.d : '';
  document.getElementById('cardExample').textContent = word.e ? '"' + word.e + '"' : '';

  var tag = document.getElementById('cardTag');
  tag.className = 'card-tag ' + tagClass;
  tag.textContent = currentGroup.replace(/学术高频词|与ChatGPT术语|高频基础词|高频搭配/g, function(m) {
    return {'学术高频词':'AWL','与ChatGPT术语':'AI','高频基础词':'基础','高频搭配':'搭配'}[m];
  });

  var tagBack = document.getElementById('cardTagBack');
  tagBack.className = 'card-tag ' + tagClass;
  tagBack.textContent = tag.textContent;

  // Reset flip
  isFlipped = false;
  document.getElementById('flashcard').classList.remove('flipped');

  // Update mark buttons
  var key = getWordKey(word);
  var btnKnown = document.getElementById('btnKnown');
  var btnUnknown = document.getElementById('btnUnknown');
  btnKnown.classList.toggle('marked', knownSet.has(key));
  btnUnknown.classList.toggle('marked', unknownSet.has(key));

  // Update progress
  updateProgress();
  updateStats();
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('flashcard').classList.toggle('flipped', isFlipped);
}

function nextCard() {
  if (currentIndex < currentWords.length - 1) {
    currentIndex++;
    showCard();
  } else {
    showComplete();
  }
}

function prevCard() {
  if (currentIndex > 0) {
    currentIndex--;
    showCard();
  }
}

function markKnown() {
  var word = currentWords[currentIndex];
  var key = getWordKey(word);
  knownSet.add(key);
  unknownSet.delete(key);
  learnedSet.add(key);
  saveState();
  // Auto advance
  setTimeout(nextCard, 200);
}

function markUnknown() {
  var word = currentWords[currentIndex];
  var key = getWordKey(word);
  unknownSet.add(key);
  knownSet.delete(key);
  learnedSet.add(key);
  saveState();
  // Auto advance
  setTimeout(nextCard, 200);
}

function updateProgress() {
  var total = currentWords.length;
  var current = currentIndex + 1;
  var percent = total > 0 ? (current / total) * 100 : 0;
  document.getElementById('progressFill').style.width = percent + '%';
  document.getElementById('progressCurrent').textContent = '第 ' + current + ' / ' + total + ' 张';
  document.getElementById('progressGroup').textContent = currentGroup;
}

function updateStats() {
  document.getElementById('statLearned').textContent = learnedSet.size;
  document.getElementById('statKnown').textContent = knownSet.size;
  document.getElementById('statUnknown').textContent = unknownSet.size;
}

function showComplete() {
  document.getElementById('cardArea').classList.add('hidden');
  document.getElementById('controls').classList.add('hidden');
  document.getElementById('completeScreen').classList.remove('hidden');

  var knownCount = 0;
  var unknownCount = 0;
  currentWords.forEach(function(w) {
    var key = getWordKey(w);
    if (knownSet.has(key)) knownCount++;
    if (unknownSet.has(key)) unknownCount++;
  });

  document.getElementById('completeKnown').textContent = knownCount;
  document.getElementById('completeUnknown').textContent = unknownCount;

  if (unknownCount > 0) {
    document.getElementById('completeTitle').textContent = '本组背诵完成！';
    document.getElementById('completeDesc').textContent = '有 ' + unknownCount + ' 个不认识的词，建议切换"只背不认识的"模式再过一遍';
  } else {
    document.getElementById('completeTitle').textContent = '太棒了！全部掌握！';
    document.getElementById('completeDesc').textContent = '本组所有单词都标记为已认识';
  }
}

function restartGroup() {
  document.getElementById('completeScreen').classList.add('hidden');
  document.getElementById('cardArea').classList.remove('hidden');
  document.getElementById('controls').classList.remove('hidden');
  currentIndex = 0;
  rebuildWordList();
  showCard();
}

function setMode(newMode) {
  mode = newMode;
  // Update mode buttons
  var modeBtns = document.querySelectorAll('.mode-btn');
  var modeMap = {'all':0, 'unknown':1, 'shuffle':2};
  modeBtns.forEach(function(btn, i) {
    btn.classList.toggle('active', i === modeMap[newMode]);
  });

  // Show controls again if hidden
  document.getElementById('completeScreen').classList.add('hidden');
  document.getElementById('cardArea').classList.remove('hidden');
  document.getElementById('controls').classList.remove('hidden');

  currentIndex = 0;
  rebuildWordList();
  showCard();
}

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
  if (document.getElementById('completeScreen').classList.contains('hidden') === false) return;
  switch(e.key) {
    case ' ':
    case 'Enter':
      e.preventDefault();
      flipCard();
      break;
    case 'ArrowRight':
      nextCard();
      break;
    case 'ArrowLeft':
      prevCard();
      break;
    case '1':
      markKnown();
      break;
    case '2':
      markUnknown();
      break;
  }
});

// Start
init();
</script>
