    <script>
        // 计算工作年限
        function calculateWorkingYears(entryDate, leaveDate) {
            const entry = new Date(entryDate);
            const leave = new Date(leaveDate);
            const diffTime = leave - entry;
            const diffDays = diffTime / (1000 * 60 * 60 * 24);
            const years = diffDays / 365.25;
            
            let n = Math.floor(years);
            const remainder = years - n;
            
            if (remainder >= 0.5) {
                n += 1;
            } else if (remainder > 0 && remainder < 0.5) {
                n += 0.5;
            }
            
            // 至少0.5年
            if (n < 0.5 && diffDays > 0) {
                n = 0.5;
            }
            
            return {
                totalDays: Math.floor(diffDays),
                totalMonths: Math.floor(diffDays / 30.44),
                years: n,
                fullYears: Math.floor(years),
                remainderDays: Math.floor(diffDays % 365.25)
            };
        }

        // 格式化日期
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
        }

        // 生成报告
        function generateReport() {
            const entryDate = document.getElementById('entryDate').value;
            const leaveDate = document.getElementById('leaveDate').value;
            const monthlySalary = parseFloat(document.getElementById('monthlySalary').value);
            const district = document.getElementById('district').value;
            const disputeType = document.getElementById('disputeType').value;

            // 验证输入
            if (!entryDate || !leaveDate || !monthlySalary || !district || !disputeType) {
                alert('请填写所有必填项');
                return;
            }

            if (new Date(entryDate) > new Date(leaveDate)) {
                alert('入职日期不能晚于离职日期');
                return;
            }

            // 计算工作年限
            const workInfo = calculateWorkingYears(entryDate, leaveDate);
            
            // 显示报告区
            document.getElementById('reportSection').classList.add('visible');

            // 生成各区块内容
            generateCaseSummary(entryDate, leaveDate, monthlySalary, district, disputeType, workInfo);
            generateApplicableLaws(disputeType);
            generateCompensationCalc(entryDate, leaveDate, monthlySalary, disputeType, workInfo);
            generateEvidenceList(disputeType);
            generateApplicationText(entryDate, leaveDate, monthlySalary, district, disputeType, workInfo);
            generateDefenseSimulation(disputeType, workInfo, monthlySalary);
            generateRiskWarning(disputeType);

            // 滚动到报告区
            document.getElementById('reportSection').scrollIntoView({ behavior: 'smooth' });
        }

        // 区块1：案情梳理
        function generateCaseSummary(entryDate, leaveDate, monthlySalary, district, disputeType, workInfo) {
            const entryStr = formatDate(entryDate);
            const leaveStr = formatDate(leaveDate);
            
            let content = `
                <p><strong>当事人信息：</strong>劳动者，于${entryStr}入职用人单位，工作地点位于上海市${district}。</p>
                <p><strong>劳动关系存续期间：</strong>${entryStr}至${leaveStr}，共计<span class="highlight">${workInfo.totalDays}天</span>（约${workInfo.totalMonths}个月），折算工作年限为<span class="highlight">${workInfo.years}年</span>。</p>
                <p><strong>月均税前工资：</strong>${monthlySalary.toLocaleString()}元。</p>
                <p><strong>纠纷类型：</strong>${disputeType}。</p>
            `;

            if (disputeType === '违法辞退') {
                content += `<p><strong>案情概述：</strong>用人单位在无合法理由或未依法定程序的情况下，单方解除与劳动者的劳动合同，构成违法解除。根据《劳动合同法》第四十八条规定，劳动者有权要求继续履行劳动合同或主张违法解除赔偿金。</p>`;
            } else if (disputeType === '拖欠工资') {
                content += `<p><strong>案情概述：</strong>用人单位未按劳动合同约定或法定时间支付劳动报酬，构成拖欠工资行为。根据《劳动法》第五十条规定，工资应当以货币形式按月支付给劳动者本人，不得克扣或者无故拖欠。</p>`;
            } else if (disputeType === '未签合同') {
                content += `<p><strong>案情概述：</strong>用人单位自用工之日起超过一个月不满一年未与劳动者订立书面劳动合同，违反《劳动合同法》第十条规定。根据第八十二条规定，用人单位应当向劳动者每月支付二倍的工资。</p>`;
            }

            document.getElementById('caseSummary').innerHTML = content;
        }

        // 区块2：适用法条
        function generateApplicableLaws(disputeType) {
            let content = '';

            if (disputeType === '违法辞退') {
                content = `
                    <div class="law-quote">
                        <div class="law-title">《中华人民共和国劳动合同法》第四十八条</div>
                        <p>用人单位违反本法规定解除或者终止劳动合同，劳动者要求继续履行劳动合同的，用人单位应当继续履行；劳动者不要求继续履行劳动合同或者劳动合同已经不能继续履行的，用人单位应当依照本法第八十七条规定支付赔偿金。</p>
                    </div>
                    <div class="law-quote">
                        <div class="law-title">《中华人民共和国劳动合同法》第八十七条</div>
                        <p>用人单位违反本法规定解除或者终止劳动合同的，应当依照本法第四十七条规定的经济补偿标准的二倍向劳动者支付赔偿金。</p>
                    </div>
                    <div class="law-quote">
                        <div class="law-title">《中华人民共和国劳动合同法》第四十七条</div>
                        <p>经济补偿按劳动者在本单位工作的年限，每满一年支付一个月工资的标准向劳动者支付。六个月以上不满一年的，按一年计算；不满六个月的，向劳动者支付半个月工资的经济补偿。</p>
                        <p>劳动者月工资高于用人单位所在直辖市、设区的市级人民政府公布的本地区上年度职工月平均工资三倍的，向其支付经济补偿的标准按职工月平均工资三倍的数额支付，向其支付经济补偿的年限最高不超过十二年。</p>
                        <p>本条所称月工资是指劳动者在劳动合同解除或者终止前十二个月的平均工资。</p>
                    </div>
                `;
            } else if (disputeType === '拖欠工资') {
                content = `
                    <div class="law-quote">
                        <div class="law-title">《中华人民共和国劳动法》第五十条</div>
                        <p>工资应当以货币形式按月支付给劳动者本人。不得克扣或者无故拖欠劳动者的工资。</p>
                    </div>
                    <div class="law-quote">
                        <div class="law-title">《中华人民共和国劳动合同法》第三十条</div>
                        <p>用人单位应当按照劳动合同约定和国家规定，向劳动者及时足额支付劳动报酬。</p>
                    </div>
                    <div class="law-quote">
                        <div class="law-title">《中华人民共和国劳动合同法》第八十五条</div>
                        <p>用人单位有下列情形之一的，由劳动行政部门责令限期支付劳动报酬、加班费或者经济补偿；劳动报酬低于当地最低工资标准的，应当支付其差额部分；逾期不支付的，责令用人单位按应付金额百分之五十以上百分之一百以下的标准向劳动者加付赔偿金：</p>
                        <p>（一）未按照劳动合同的约定或者国家规定及时足额支付劳动者劳动报酬的；</p>
                        <p>（二）低于当地最低工资标准支付劳动者工资的；</p>
                        <p>（三）安排加班不支付加班费的；</p>
                        <p>（四）解除或者终止劳动合同，未依照本法规定向劳动者支付经济补偿的。</p>
                    </div>
                `;
            } else if (disputeType === '未签合同') {
                content = `
                    <div class="law-quote">

        // 区块3：赔偿计算
        function generateCompensationCalc(entryDate, leaveDate, monthlySalary, disputeType, workInfo) {
            let content = '';
            const n = workInfo.years;
            
            if (disputeType === '违法辞退') {
                // 2N赔偿
                const twoN = n * 2;
                const compensation = twoN * monthlySalary;
                
                content = `
                    <p><strong>计算依据：</strong>违法解除劳动合同赔偿金为经济补偿标准的二倍（2N）。</p>
                    <table class="calc-table">
                        <thead>
                            <tr>
                                <th>计算项目</th>
                                <th>数值</th>
                                <th>计算公式</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>工作年限（N）</td>
                                <td class="highlight">${n}年</td>
                                <td>入职至离职的累计年限，满半年算1年，不满半年算0.5年</td>
                            </tr>
                            <tr>
                                <td>赔偿系数</td>
                                <td>2N</td>
                                <td class="formula">2 × N = 2 × ${n} = ${twoN}</td>
                            </tr>
                            <tr>
                                <td>月均工资</td>
                                <td>${monthlySalary.toLocaleString()}元</td>
                                <td>离职前12个月平均工资</td>
                            </tr>
                            <tr class="total-row">
                                <td>违法解除赔偿金</td>
                                <td colspan="2">${compensation.toLocaleString()}元</td>
                            </tr>
                        </tbody>
                    </table>
                    <p><strong>最终赔偿金额：</strong><span style="color: var(--accent); font-size: 1.25rem; font-weight: 700;">${compensation.toLocaleString()}元</span></p>
                    <p style="color: var(--muted); font-size: 0.9rem;">注：若月均工资高于上海市上年度职工月平均工资三倍，则按三倍封顶计算，且N最高不超过12年。</p>
                `;
            } else if (disputeType === '拖欠工资') {
                content = `
                    <p><strong>计算依据：</strong>用人单位应足额支付被拖欠的工资。</p>
                    <table class="calc-table">
                        <thead>
                            <tr>
                                <th>计算项目</th>
                                <th>数值</th>
                                <th>说明</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>被拖欠工资</td>
                                <td>需核实</td>
                                <td>请补充实际拖欠月数及金额</td>
                            </tr>
                            <tr>
                                <td>加付赔偿金（50%-100%）</td>
                                <td>可主张</td>
                                <td>需经劳动行政部门责令限期支付后逾期仍未支付</td>
                            </tr>
                        </tbody>
                    </table>
                    <p><strong>建议：</strong>请补充提供工资条、银行流水等证明实际被拖欠的工资金额，以便精确计算。</p>
                `;
            } else if (disputeType === '未签合同') {
                // 双倍工资，最高11个月
                const doublePayMonths = Math.min(workInfo.totalMonths - 1, 11);
                const actualMonths = doublePayMonths > 0 ? doublePayMonths : 0;
                const doublePay = actualMonths * monthlySalary;
                
                content = `
                    <p><strong>计算依据：</strong>用人单位自用工之日起超过一个月未订立书面劳动合同的，应当支付双倍工资，最多支持11个月。</p>
                    <table class="calc-table">
                        <thead>
                            <tr>
                                <th>计算项目</th>
                                <th>数值</th>
                                <th>计算公式</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>工作总月数</td>
                                <td>${workInfo.totalMonths}个月</td>
                                <td>入职至离职的累计天数 ÷ 30</td>
                            </tr>
                            <tr>
                                <td>双倍工资起算月数</td>
                                <td>第2个月起</td>
                                <td>入职满1个月后开始计算</td>
                            </tr>
                            <tr>
                                <td>可主张月数</td>
                                <td class="highlight">${actualMonths}个月</td>
                                <td class="formula">min(总月数-1, 11) = min(${workInfo.totalMonths}-1, 11) = ${actualMonths}</td>
                            </tr>
                            <tr>
                                <td>月均工资</td>
                                <td>${monthlySalary.toLocaleString()}元</td>
                                <td>离职前12个月平均工资</td>
                            </tr>
                            <tr class="total-row">
                                <td>双倍工资差额</td>
                                <td colspan="2">${doublePay.toLocaleString()}元</td>
                            </tr>
                        </tbody>
                    </table>
                    <p><strong>最终赔偿金额：</strong><span style="color: var(--accent); font-size: 1.25rem; font-weight: 700;">${doublePay.toLocaleString()}元</span></p>
                    <p style="color: var(--muted); font-size: 0.9rem;">注：双倍工资差额为已发工资之外的额外部分，即"一倍"差额。若工作不满1个月则无此项主张。</p>
                `;
            }

            document.getElementById('compensationCalc').innerHTML = content;
        }

                </div>
                <div class="risk-item">
                    <div class="risk-icon">⚠</div>
                    <div class="risk-content">
                        <strong>仲裁时效风险</strong>
                        <p>劳动争议申请仲裁的时效期间为一年，从当事人知道或应当知道权利被侵害之日起计算。请核实是否在时效内。</p>
                    </div>
                </div>
                <div class="risk-item">
                    <div class="risk-icon">⚠</div>
                    <div class="risk-content">
                        <strong>工资标准争议风险</strong>
                        <p>若月工资高于上海市上年度职工月平均工资三倍，经济补偿/赔偿金计算基数将按三倍封顶。请核实最新社平工资标准。</p>
                    </div>
                </div>
            `;

            if (disputeType === '违法辞退') {
                content += `
                    <div class="risk-item">
                        <div class="risk-icon">⚠</div>
                        <div class="risk-content">
                            <strong>解除原因举证风险</strong>
                            <p>企业可能主张解除合同有合法理由（如严重违纪、不能胜任等）。需准备反驳证据，核实企业解除程序的合法性。</p>
                        </div>
                    </div>
                    <div class="risk-item">
                        <div class="risk-icon">⚠</div>
                        <div class="risk-content">
                            <strong>继续履行 vs 赔偿金选择风险</strong>
                            <p>违法解除情形下，劳动者可选择继续履行合同或主张赔偿金。若选择赔偿金，则丧失恢复劳动关系的机会。</p>
                        </div>
                    </div>
                `;
            } else if (disputeType === '拖欠工资') {
                content += `
                    <div class="risk-item">
                        <div class="risk-icon">⚠</div>
                        <div class="risk-content">
                            <strong>拖欠金额证明风险</strong>
                            <p>需准确证明被拖欠工资金额，建议提供工资条、银行流水、考勤记录等多维证据。</p>
                        </div>
                    </div>
                    <div class="risk-item">
                        <div class="risk-icon">⚠</div>
                        <div class="risk-content">
                            <strong>加付赔偿金前置程序风险</strong>
                            <p>主张50%-100%加付赔偿金需先经劳动行政部门责令限期支付，逾期未付方可主张。建议先向劳动监察部门投诉。</p>
                        </div>
                    </div>
                `;
            } else if (disputeType === '未签合同') {
                content += `
                    <div class="risk-item">
                        <div class="risk-icon">⚠</div>
                        <div class="risk-content">
                            <strong>双倍工资起算点风险</strong>
                            <p>双倍工资自用工之日起第2个月开始计算，需准确证明入职时间。</p>
                        </div>
                    </div>
                    <div class="risk-item">
                        <div class="risk-icon">⚠</div>
                        <div class="risk-content">
                            <strong>时效分段计算风险</strong>
                            <p>双倍工资仲裁时效可能按月分别计算，超过一年的部分可能无法支持。请核实各月的时效状态。</p>
                        </div>
                    </div>
                `;
            }

            content += `
                <div style="margin-top: 1.5rem; padding: 1rem; background: var(--accent-light); border-radius: 4px; border-left: 4px solid var(--accent);">
                    <strong style="color: var(--accent);">重要提示：</strong>
                    <p style="margin-top: 0.5rem;">本计算结果仅供参考，实际赔偿金额以仲裁委员会裁决为准。建议在申请仲裁前咨询专业律师，获取个性化法律意见。</p>
                </div>
            `;

            document.getElementById('riskWarning').innerHTML = content;
        }

        // 重置表单
        function resetForm() {
            document.getElementById('entryDate').value = '';
            document.getElementById('leaveDate').value = '';
            document.getElementById('monthlySalary').value = '';
            document.getElementById('district').value = '';
            document.getElementById('disputeType').value = '';
            document.getElementById('reportSection').classList.remove('visible');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
