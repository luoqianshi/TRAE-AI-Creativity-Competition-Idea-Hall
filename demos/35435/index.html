<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对话即学习 Dialog2Learn - Powered by TRAE</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a1a2e;
            --secondary: #16213e;
            --accent: #00d4ff;
            --accent-light: #7dd3fc;
            --surface: rgba(255, 255, 255, 0.05);
            --surface-hover: rgba(255, 255, 255, 0.1);
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --success: #10b981;
            --warning: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 导航栏 */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            height: 64px;
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .logo-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            background: rgba(0, 212, 255, 0.15);
            color: var(--accent);
            border-radius: 12px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            margin-left: 0.5rem;
        }

        .nav-tabs {
            display: flex;
            gap: 0.5rem;
        }

        .nav-tab {
            padding: 0.5rem 1.25rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            color: var(--text-muted);
            border: none;
            background: transparent;
        }

        .nav-tab:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .nav-tab.active {
            background: rgba(0, 212, 255, 0.15);
            color: var(--accent);
        }

        .nav-stats {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .stat-badge {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.8rem;
            background: var(--surface);
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .stat-badge i {
            color: var(--accent);
        }

        /* 主内容区 */
        .main-content {
            padding-top: 64px;
            min-height: 100vh;
        }

        .page {
            display: none;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            animation: fadeIn 0.4s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 对话页 */
        .chat-layout {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 1.5rem;
            height: calc(100vh - 120px);
        }

        .chat-panel {
            background: var(--surface);
            border-radius: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .scene-selector {
            display: flex;
            gap: 0.5rem;
        }

        .scene-tag {
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .scene-tag:hover {
            background: var(--surface-hover);
        }

        .scene-tag.active {
            background: rgba(0, 212, 255, 0.2);
            color: var(--accent);
            border-color: rgba(0, 212, 255, 0.4);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 1rem 1.25rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.6;
            animation: messageSlide 0.3s ease;
        }

        @keyframes messageSlide {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(0, 212, 255, 0.1));
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .message.ai {
            align-self: flex-start;
            background: var(--surface-hover);
            border: 1px solid var(--border);
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .message-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }

        .message.user .message-avatar {
            background: var(--accent);
            color: var(--primary);
        }

        .message.ai .message-avatar {
            background: var(--surface-hover);
            color: var(--text-muted);
        }

        .chat-input-area {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 0.75rem;
        }

        .chat-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        .chat-input::placeholder {
            color: var(--text-muted);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: var(--primary);
            font-weight: 600;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* 知识提取面板 */
        .extract-panel {
            background: var(--surface);
            border-radius: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .extract-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .extract-header h3 {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .extract-header h3 i {
            color: var(--accent);
        }

        .extract-status {
            font-size: 0.75rem;
            padding: 0.25rem 0.6rem;
            border-radius: 12px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .extract-status.analyzing {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .extract-content {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .knowledge-card {
            background: var(--surface-hover);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: cardFlyIn 0.5s ease;
        }

        @keyframes cardFlyIn {
            from {
                opacity: 0;
                transform: translateX(30px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        .knowledge-card:hover {
            border-color: rgba(0, 212, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .knowledge-card-title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
            color: var(--text);
        }

        .knowledge-card-summary {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 0.6rem;
        }

        .knowledge-card-tags {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .tag {
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            font-size: 0.7rem;
            background: rgba(0, 212, 255, 0.1);
            color: var(--accent);
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .tag.source {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border-color: rgba(16, 185, 129, 0.2);
        }

        /* 知识库页 */
        .library-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .library-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .library-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            padding: 0.6rem 1rem 0.6rem 2.5rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            width: 280px;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .search-box i {
            position: absolute;
            left: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .filter-tabs {
            display: flex;
            gap: 0.5rem;
        }

        .filter-tab {
            padding: 0.4rem 0.9rem;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .filter-tab:hover, .filter-tab.active {
            background: rgba(0, 212, 255, 0.15);
            color: var(--accent);
            border-color: rgba(0, 212, 255, 0.3);
        }

        .library-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
        }

        .library-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.25rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .library-card:hover {
            border-color: rgba(0, 212, 255, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        .library-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }

        .library-card-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .library-card-date {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .library-card-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }

        .library-card-summary {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 0.75rem;
        }

        .library-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 成长报告页 */
        .report-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .report-header h2 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .report-header p {
            color: var(--text-muted);
        }

        .report-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .report-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
        }

        .report-card-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 0.25rem;
        }

        .report-card-label {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .report-card-change {
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }

        .report-card-change.positive {
            color: var(--success);
        }

        .charts-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .chart-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            min-height: 300px;
        }

        .chart-card h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .chart-card h3 i {
            color: var(--accent);
        }

        .chart-card canvas {
            max-height: 280px;
        }

        .timeline-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
        }

        .timeline-section h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .timeline {
            position: relative;
            padding-left: 2rem;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 0.5rem;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, var(--accent), transparent);
        }

        .timeline-item {
            position: relative;
            padding-bottom: 1.5rem;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -1.75rem;
            top: 0.25rem;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid var(--primary);
        }

        .timeline-date {
            font-size: 0.8rem;
            color: var(--accent);
            margin-bottom: 0.25rem;
        }

        .timeline-title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }

        .timeline-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* 分析中动画 */
        .analyzing-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 26, 46, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            z-index: 10;
            border-radius: 16px;
        }

        .analyzing-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .analyzing-text {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .analyzing-dots::after {
            content: '';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        /* 响应式 */
        @media (max-width: 1024px) {
            .chat-layout {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto;
            }
            .extract-panel {
                max-height: 400px;
            }
            .report-grid {
                grid-template-columns: 1fr;
            }
            .charts-row {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 0 1rem;
            }
            .nav-tabs {
                display: none;
            }
            .page {
                padding: 1rem;
            }
            .library-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 空状态 */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            color: var(--text-muted);
            text-align: center;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-comments"></i></div>
            <span>对话即学习</span>
            <span class="logo-badge">Dialog2Learn</span>
        </div>
        <div class="nav-tabs">
            <button class="nav-tab active" data-page="chat">
                <i class="fas fa-comment-dots"></i> 对话学习
            </button>
            <button class="nav-tab" data-page="library">
                <i class="fas fa-book"></i> 知识库
            </button>
            <button class="nav-tab" data-page="report">
                <i class="fas fa-chart-line"></i> 成长报告
            </button>
        </div>
        <div class="nav-stats">
            <div class="stat-badge">
                <i class="fas fa-bolt"></i>
                <span>Powered by TRAE</span>
            </div>
            <div class="stat-badge">
                <i class="fas fa-database"></i>
                <span id="nav-card-count">0</span> 知识卡片
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 对话页 -->
        <div class="page active" id="page-chat">
            <div class="chat-layout">
                <!-- 对话面板 -->
                <div class="chat-panel">
                    <div class="chat-header">
                        <div class="scene-selector">
                            <div class="scene-tag active" data-scene="work">工作聊天</div>
                            <div class="scene-tag" data-scene="ai">AI 对话</div>
                            <div class="scene-tag" data-scene="meeting">会议纪要</div>
                            <div class="scene-tag" data-scene="doc">文档笔记</div>
                        </div>
                        <button class="btn btn-primary" onclick="loadExample()">
                            <i class="fas fa-magic"></i> 加载示例
                        </button>
                    </div>
                    <div class="chat-messages" id="chat-messages">
                        <div class="empty-state">
                            <i class="fas fa-comments"></i>
                            <p>选择场景并输入对话，或点击「加载示例」开始体验<br>TRAE AI 将自动提取对话中的知识点</p>
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" class="chat-input" id="chat-input" 
                               placeholder="输入对话内容，按回车发送..." 
                               onkeypress="handleKeyPress(event)">
                        <button class="btn btn-primary" onclick="sendMessage()">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>

                <!-- 知识提取面板 -->
                <div class="extract-panel">
                    <div class="extract-header">
                        <h3><i class="fas fa-sparkles"></i> 知识提取</h3>
                        <div class="extract-status" id="extract-status">等待输入</div>
                    </div>
                    <div class="extract-content" id="extract-content">
                        <div class="empty-state">
                            <i class="fas fa-lightbulb"></i>
                            <p>发送对话后，TRAE AI 将自动分析并提取知识点</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 知识库页 -->
        <div class="page" id="page-library">
            <div class="library-header">
                <h2><i class="fas fa-book"></i> 我的知识库</h2>
                <div class="library-controls">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="搜索知识点..." id="library-search" oninput="filterLibrary()">
                    </div>
                    <div class="filter-tabs">
                        <div class="filter-tab active" data-filter="all">全部</div>
                        <div class="filter-tab" data-filter="skill">技能</div>
                        <div class="filter-tab" data-filter="insight">洞察</div>
                        <div class="filter-tab" data-filter="method">方法</div>
                    </div>
                </div>
            </div>
            <div class="library-grid" id="library-grid">
                <!-- 动态生成 -->
            </div>
        </div>

        <!-- 成长报告页 -->
        <div class="page" id="page-report">
            <div class="report-header">
                <h2>我的学习成长报告</h2>
                <p>基于你的对话记录，TRAE AI 为你生成的个性化学习分析</p>
            </div>
            <div class="report-grid">
                <div class="report-card">
                    <div class="report-card-value" id="report-total">0</div>
                    <div class="report-card-label">知识卡片总数</div>
                    <div class="report-card-change positive">
                        <i class="fas fa-arrow-up"></i> 本周新增 12 张
                    </div>
                </div>
                <div class="report-card">
                    <div class="report-card-value" id="report-categories">0</div>
                    <div class="report-card-label">知识领域覆盖</div>
                    <div class="report-card-change positive">
                        <i class="fas fa-arrow-up"></i> 新增 3 个领域
                    </div>
                </div>
                <div class="report-card">
                    <div class="report-card-value" id="report-streak">0</div>
                    <div class="report-card-label">连续学习天数</div>
                    <div class="report-card-change positive">
                        <i class="fas fa-fire"></i> 保持中
                    </div>
                </div>
            </div>
            <div class="charts-row">
                <div class="chart-card">
                    <h3><i class="fas fa-chart-area"></i> 知识增长趋势</h3>
                    <canvas id="growthChart"></canvas>
                </div>
                <div class="chart-card">
                    <h3><i class="fas fa-chart-pie"></i> 知识领域分布</h3>
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
            <div class="timeline-section">
                <h3><i class="fas fa-stream"></i> 学习里程碑</h3>
                <div class="timeline" id="timeline">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>
    </main>

    <script>
        // ==================== 数据存储 ====================
        let knowledgeCards = [];
        let currentScene = 'work';
        let currentFilter = 'all';
        let growthChart = null;
        let categoryChart = null;

        // ==================== 示例数据 ====================
        const exampleDialogs = {
            work: [
                { role: 'user', content: '这次项目复盘，我发现我们在需求评审阶段花的时间太少了，导致后面返工很多。', name: '我' },
                { role: 'ai', content: '确实，需求评审是项目成功的关键。建议下次在评审前让产品经理先输出 PRD，然后技术团队提前阅读，评审会上直接讨论争议点。', name: '同事' },
                { role: 'user', content: '好主意！另外我觉得我们缺少一个统一的设计规范，每个页面风格都不太一样。', name: '我' },
                { role: 'ai', content: '可以建立一个 Design System，包括颜色、字体、组件库。这样不仅能保证一致性，还能提高开发效率。', name: '同事' }
            ],
            ai: [
                { role: 'user', content: 'TRAE，帮我分析一下如何在工作中更高效地学习新技术？', name: '我' },
                { role: 'ai', content: '建议采用「项目驱动学习法」：选择一个实际工作中的问题，用新技术去解决。这样学习更有针对性，也更容易记住。', name: 'TRAE AI' },
                { role: 'user', content: '具体怎么操作呢？', name: '我' },
                { role: 'ai', content: '1. 识别工作中的痛点；2. 调研是否有新技术可以解决；3. 用新技术做一个最小可行方案；4. 记录学习过程和踩坑经验。', name: 'TRAE AI' }
            ],
            meeting: [
                { role: 'user', content: '今天的周会，我们讨论了 Q3 的产品规划。', name: '我' },
                { role: 'ai', content: 'Q3 的重点是提升用户留存率，目标是从 35% 提升到 45%。', name: '产品经理' },
                { role: 'user', content: '具体策略是什么？', name: '我' },
                { role: 'ai', content: '三个方向：1. 优化新用户引导流程；2. 增加个性化推荐；3. 建立用户激励体系。每个方向都有明确的负责人和时间节点。', name: '产品经理' }
            ],
            doc: [
                { role: 'user', content: '读了《深度工作》这本书，有几个收获想记录一下。', name: '我' },
                { role: 'ai', content: '请分享你的收获。', name: '笔记助手' },
                { role: 'user', content: '第一，深度工作是指在无干扰状态下进行的专业活动，能将认知能力推向极限。第二，要培养深度工作的习惯，需要设定固定的工作时间和仪式。', name: '我' },
                { role: 'ai', content: '很好的总结！建议你在工作中实践：每天设定 2 小时的无干扰深度工作时间，关闭通知，专注于最重要的任务。', name: '笔记助手' }
            ]
        };

        const exampleKnowledge = {
            work: [
                { title: '需求评审最佳实践', summary: '在评审前让产品经理输出 PRD，技术团队提前阅读，评审会上直接讨论争议点，减少返工。', tags: ['项目管理', '需求分析'], type: 'method', icon: 'fa-tasks' },
                { title: '建立 Design System', summary: '统一的设计规范包括颜色、字体、组件库，能保证产品一致性并提高开发效率。', tags: ['设计', '前端开发'], type: 'skill', icon: 'fa-palette' },
                { title: '项目复盘方法论', summary: '定期复盘项目中的问题，识别改进点，是团队持续成长的关键。', tags: ['团队协作', '复盘'], type: 'method', icon: 'fa-redo' }
            ],
            ai: [
                { title: '项目驱动学习法', summary: '选择实际工作中的问题，用新技术去解决，学习更有针对性，记忆更深刻。', tags: ['学习方法', '技术成长'], type: 'method', icon: 'fa-rocket' },
                { title: '最小可行方案（MVP）', summary: '学习新技术时，先做一个最小可行方案验证思路，避免过度设计。', tags: ['产品开发', '敏捷'], type: 'method', icon: 'fa-cube' },
                { title: '学习过程记录', summary: '记录学习过程中的踩坑经验和解决方案，形成个人知识库，便于后续回顾。', tags: ['知识管理', '笔记'], type: 'skill', icon: 'fa-book' }
            ],
            meeting: [
                { title: '留存率提升策略', summary: '通过优化新用户引导、个性化推荐和用户激励体系三个方向提升留存率。', tags: ['产品策略', '用户增长'], type: 'insight', icon: 'fa-chart-line' },
                { title: '目标分解方法', summary: '将大目标分解为具体方向，每个方向明确负责人和时间节点，确保执行落地。', tags: ['项目管理', '目标管理'], type: 'method', icon: 'fa-bullseye' },
                { title: '数据驱动决策', summary: '用具体数据（35%→45%）定义目标，便于后续衡量效果和复盘。', tags: ['数据分析', '决策'], type: 'insight', icon: 'fa-database' }
            ],
            doc: [
                { title: '深度工作概念', summary: '在无干扰状态下进行的专业活动，将认知能力推向极限，是高质量产出的关键。', tags: ['效率', '专注力'], type: 'insight', icon: 'fa-brain' },
                { title: '工作仪式设计', summary: '设定固定的工作时间和仪式，帮助大脑进入深度工作状态，提高专注力。', tags: ['习惯养成', '时间管理'], type: 'method', icon: 'fa-clock' },
                { title: '无干扰工作时间', summary: '每天设定 2 小时无干扰时间，关闭通知，专注于最重要的任务。', tags: ['效率', '专注力'], type: 'skill', icon: 'fa-shield-alt' }
            ]
        };

        // ==================== 页面切换 ====================
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const page = tab.dataset.page;
                switchPage(page);
            });
        });

        function switchPage(page) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            
            document.querySelector(`[data-page="${page}"]`).classList.add('active');
            document.getElementById(`page-${page}`).classList.add('active');

            if (page === 'library') {
                renderLibrary();
            } else if (page === 'report') {
                renderReport();
            }
        }

        // ==================== 场景切换 ====================
        document.querySelectorAll('.scene-tag').forEach(tag => {
            tag.addEventListener('click', () => {
                document.querySelectorAll('.scene-tag').forEach(t => t.classList.remove('active'));
                tag.classList.add('active');
                currentScene = tag.dataset.scene;
            });
        });

        // ==================== 对话功能 ====================
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const content = input.value.trim();
            if (!content) return;

            addMessage('user', content, '我');
            input.value = '';

            // 模拟 AI 回复
            setTimeout(() => {
                const responses = [
                    '这个观点很有价值，建议记录下来。',
                    '确实，这是一个很好的实践方法。',
                    '可以进一步思考如何落地执行。',
                    '这个经验值得沉淀到知识库中。'
                ];
                const randomResponse = responses[Math.floor(Math.random() * responses.length)];
                addMessage('ai', randomResponse, '助手');
                
                // 模拟知识提取
                simulateKnowledgeExtraction();
            }, 800);
        }

        function addMessage(role, content, name) {
            const container = document.getElementById('chat-messages');
            
            // 移除空状态
            if (container.querySelector('.empty-state')) {
                container.innerHTML = '';
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.innerHTML = `
                <div class="message-header">
                    <div class="message-avatar">${name[0]}</div>
                    <span>${name}</span>
                </div>
                <div class="message-content">${content}</div>
            `;
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        function simulateKnowledgeExtraction() {
            const status = document.getElementById('extract-status');
            const content = document.getElementById('extract-content');
            
            status.textContent = 'TRAE AI 分析中...';
            status.classList.add('analyzing');

            // 移除空状态
            if (content.querySelector('.empty-state')) {
                content.innerHTML = '';
            }

            setTimeout(() => {
                // 随机生成一个知识卡片
                const scenes = Object.keys(exampleKnowledge);
                const randomScene = scenes[Math.floor(Math.random() * scenes.length)];
                const sceneKnowledge = exampleKnowledge[randomScene];
                const randomKnowledge = sceneKnowledge[Math.floor(Math.random() * sceneKnowledge.length)];
                
                const card = createKnowledgeCard(randomKnowledge);
                content.insertBefore(card, content.firstChild);
                
                // 添加到知识库
                knowledgeCards.push({
                    ...randomKnowledge,
                    id: Date.now(),
                    date: new Date().toLocaleDateString('zh-CN'),
                    scene: randomScene
                });
                
                updateNavCount();
                
                status.textContent = '提取完成';
                status.classList.remove('analyzing');
            }, 2000);
        }

        function createKnowledgeCard(knowledge) {
            const card = document.createElement('div');
            card.className = 'knowledge-card';
            card.innerHTML = `
                <div class="knowledge-card-title">${knowledge.title}</div>
                <div class="knowledge-card-summary">${knowledge.summary}</div>
                <div class="knowledge-card-tags">
                    <span class="tag source"><i class="fas fa-${knowledge.icon}"></i> ${knowledge.type === 'skill' ? '技能' : knowledge.type === 'insight' ? '洞察' : '方法'}</span>
                    ${knowledge.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                </div>
            `;
            return card;
        }

        function updateNavCount() {
            document.getElementById('nav-card-count').textContent = knowledgeCards.length;
        }

        // ==================== 加载示例 ====================
        function loadExample() {
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';
            
            const dialogs = exampleDialogs[currentScene];
            let delay = 0;
            
            dialogs.forEach((dialog, index) => {
                setTimeout(() => {
                    addMessage(dialog.role, dialog.content, dialog.name);
                }, delay);
                delay += 600;
            });

            // 模拟知识提取
            setTimeout(() => {
                const status = document.getElementById('extract-status');
                const content = document.getElementById('extract-content');
                
                status.textContent = 'TRAE AI 分析中...';
                status.classList.add('analyzing');
                content.innerHTML = '';

                const knowledge = exampleKnowledge[currentScene];
                let cardDelay = 0;
                
                knowledge.forEach((item, index) => {
                    setTimeout(() => {
                        const card = createKnowledgeCard(item);
                        content.appendChild(card);
                        
                        knowledgeCards.push({
                            ...item,
                            id: Date.now() + index,
                            date: new Date().toLocaleDateString('zh-CN'),
                            scene: currentScene
                        });
                        updateNavCount();
                    }, cardDelay);
                    cardDelay += 400;
                });

                setTimeout(() => {
                    status.textContent = '提取完成';
                    status.classList.remove('analyzing');
                }, cardDelay + 500);
            }, delay + 500);
        }

        // ==================== 知识库页 ====================
        function renderLibrary() {
            const grid = document.getElementById('library-grid');
            const searchTerm = document.getElementById('library-search').value.toLowerCase();
            
            let filtered = knowledgeCards;
            
            if (searchTerm) {
                filtered = filtered.filter(card => 
                    card.title.toLowerCase().includes(searchTerm) ||
                    card.summary.toLowerCase().includes(searchTerm) ||
                    card.tags.some(tag => tag.toLowerCase().includes(searchTerm))
                );
            }
            
            if (currentFilter !== 'all') {
                filtered = filtered.filter(card => card.type === currentFilter);
            }

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <i class="fas fa-inbox"></i>
                        <p>还没有知识卡片，去对话页开始积累吧！</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(card => `
                <div class="library-card">
                    <div class="library-card-header">
                        <div class="library-card-icon" style="background: ${getTypeColor(card.type)}20; color: ${getTypeColor(card.type)};">
                            <i class="fas ${card.icon}"></i>
                        </div>
                        <div class="library-card-date">${card.date}</div>
                    </div>
                    <div class="library-card-title">${card.title}</div>
                    <div class="library-card-summary">${card.summary}</div>
                    <div class="library-card-footer">
                        <div class="knowledge-card-tags">
                            ${card.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                        <span class="tag source">${card.type === 'skill' ? '技能' : card.type === 'insight' ? '洞察' : '方法'}</span>
                    </div>
                </div>
            `).join('');
        }

        function getTypeColor(type) {
            const colors = {
                skill: '#00d4ff',
                insight: '#10b981',
                method: '#f59e0b'
            };
            return colors[type] || '#00d4ff';
        }

        function filterLibrary() {
            renderLibrary();
        }

        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.dataset.filter;
                renderLibrary();
            });
        });

        // ==================== 成长报告页 ====================
        function renderReport() {
            document.getElementById('report-total').textContent = knowledgeCards.length;
            document.getElementById('report-categories').textContent = new Set(knowledgeCards.flatMap(c => c.tags)).size;
            document.getElementById('report-streak').textContent = Math.min(knowledgeCards.length, 30);

            renderGrowthChart();
            renderCategoryChart();
            renderTimeline();
        }

        function renderGrowthChart() {
            const ctx = document.getElementById('growthChart').getContext('2d');
            
            if (growthChart) {
                growthChart.destroy();
            }

            const days = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
            const data = [3, 5, 2, 8, 6, 4, knowledgeCards.length > 0 ? knowledgeCards.length : 7];

            growthChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: days,
                    datasets: [{
                        label: '知识卡片数',
                        data: data,
                        borderColor: '#00d4ff',
                        backgroundColor: 'rgba(0, 212, 255, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#00d4ff',
                        pointBorderColor: '#1a1a2e',
                        pointBorderWidth: 2,
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#94a3b8' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#94a3b8' }
                        }
                    }
                }
            });
        }

        function renderCategoryChart() {
            const ctx = document.getElementById('categoryChart').getContext('2d');
            
            if (categoryChart) {
                categoryChart.destroy();
            }

            const categories = {};
            knowledgeCards.forEach(card => {
                card.tags.forEach(tag => {
                    categories[tag] = (categories[tag] || 0) + 1;
                });
            });

            if (Object.keys(categories).length === 0) {
                categories['项目管理'] = 3;
                categories['学习方法'] = 2;
                categories['产品设计'] = 2;
                categories['技术成长'] = 1;
            }

            const labels = Object.keys(categories);
            const data = Object.values(categories);
            const colors = ['#00d4ff', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'];

            categoryChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: colors.slice(0, labels.length),
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: '#94a3b8', padding: 15 }
                        }
                    }
                }
            });
        }

        function renderTimeline() {
            const container = document.getElementById('timeline');
            
            const milestones = [
                { date: '今天', title: '开始使用对话即学习', desc: '你开启了知识沉淀之旅，TRAE AI 将陪伴你成长' },
                { date: '本周', title: `积累了 ${knowledgeCards.length} 个知识点`, desc: '涵盖项目管理、学习方法、产品设计等多个领域' },
                { date: '近期目标', title: '建立个人知识体系', desc: '持续积累，形成结构化的知识网络' }
            ];

            if (knowledgeCards.length > 5) {
                milestones.splice(1, 0, {
                    date: '里程碑',
                    title: '知识卡片突破 5 张',
                    desc: '你已经建立了初步的知识积累习惯'
                });
            }

            container.innerHTML = milestones.map(m => `
                <div class="timeline-item">
                    <div class="timeline-date">${m.date}</div>
                    <div class="timeline-title">${m.title}</div>
                    <div class="timeline-desc">${m.desc}</div>
                </div>
            `).join('');
        }

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', () => {
            // 预加载一些示例数据
            const initialData = [
                { title: '项目复盘方法论', summary: '定期复盘项目中的问题，识别改进点，是团队持续成长的关键。', tags: ['团队协作', '复盘'], type: 'method', icon: 'fa-redo', id: 1, date: '2026-06-18', scene: 'work' },
                { title: '项目驱动学习法', summary: '选择实际工作中的问题，用新技术去解决，学习更有针对性。', tags: ['学习方法', '技术成长'], type: 'method', icon: 'fa-rocket', id: 2, date: '2026-06-19', scene: 'ai' },
                { title: '留存率提升策略', summary: '通过优化新用户引导、个性化推荐和用户激励体系提升留存。', tags: ['产品策略', '用户增长'], type: 'insight', icon: 'fa-chart-line', id: 3, date: '2026-06-19', scene: 'meeting' }
            ];
            
            knowledgeCards = [...initialData];
            updateNavCount();
        });
    </script>
</body>
</html>
