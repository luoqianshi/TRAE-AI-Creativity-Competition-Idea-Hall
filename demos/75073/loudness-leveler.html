<script>
/* ===================== 工具函数 ===================== */
const $ = (s, p=document) => p.querySelector(s);

function genId() { return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function formatTime(sec) {
  if (!isFinite(sec) || sec < 0) return "00:00";
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}
function formatSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + " KB";
  return (bytes/1024/1024).toFixed(2) + " MB";
}
function dbToGain(db) { return Math.pow(10, db/20); }
function stripExt(name) { return name.replace(/\.[^/.]+$/, ""); }
function getFileExt(name) { const m = name.match(/\.([^/.]+)$/); return m ? m[1].toLowerCase() : ""; }
function clamp(v, min, max, fb) { if (typeof v !== "number" || isNaN(v)) return fb; return Math.max(min, Math.min(max, v)); }

/* ===================== 图标 SVG ===================== */

  sliders: '<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>',

  speaker: '<rect x="6" y="6" width="12" height="12" rx="2"/><circle cx="12" cy="11" r="2.5"/><circle cx="12" cy="16" r="0.5"/>',
  disc: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/>',
  orbit: '<circle cx="12" cy="12" r="3"/><path d="M21 12a9 9 0 0 1-9 9m-9-9a9 9 0 0 1 9-9"/><path d="M3 12a9 9 0 0 1 9-9"/>',
  power: '<path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/>',
  chevronDown: '<polyline points="6 9 12 15 18 9"/>',
  gauge: '<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
  zap: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
  shieldCheck: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/>',
};
function svgIcon(name, size=16, fill=false) {
  const path = ICONS[name] || "";
  return `<svg class="icon${fill?' icon-fill':''}" width="${size}" height="${size}" viewBox="0 0 24 24">${path}</svg>`;
}

/* ===================== 状态 ===================== */
const state = {
  tracks: [],
  currentTrackId: null,
  isPlaying: false,
  progress: 0,
  currentTime: 0,
  playMode: "order",
  targetLoudness: -18,
  normalizeEnabled: true,
  masterVolume: 1,
  effects: JSON.parse(JSON.stringify(DEFAULT_EFFECTS)),
  activeEffectPanel: "eq",
  level: { left:0, right:0, peakLeft:0, peakRight:0, clipped:false },
  isDraggingFile: false,
  confirmClear: false,
  expandedEffect: "eq",
};

function loadPersisted() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (typeof d.targetLoudness === "number") state.targetLoudness = clamp(d.targetLoudness, TARGET_LOUDNESS_MIN, TARGET_LOUDNESS_MAX, -18);
    if (typeof d.normalizeEnabled === "boolean") state.normalizeEnabled = d.normalizeEnabled;
    if (typeof d.masterVolume === "number") state.masterVolume = clamp(d.masterVolume, 0, 1, 1);
    if (d.playMode) state.playMode = d.playMode;
    if (d.effects) state.effects = Object.assign(JSON.parse(JSON.stringify(DEFAULT_EFFECTS)), d.effects);
  } catch {}
}
function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      targetLoudness: state.targetLoudness,
      normalizeEnabled: state.normalizeEnabled,
      masterVolume: state.masterVolume,
      playMode: state.playMode,
      effects: state.effects,
    }));
  } catch {}
}
loadPersisted();

/* ===================== 音频引擎 ===================== */
const audioEngine = {
  ctx: null, audioEl: null, sourceNode: null,
  normalizeGain: null, masterGain: null,
  eqNodes: [], reverbConvolver: null, reverbWet: null, reverbDry: null,
  bassBoost: null, vinylShaper: null, vinylNoiseSource: null, vinylNoiseGain: null,
  surroundPanner: null, analyser: null,
  currentTrackId: null, objectUrl: null,
  rafId: null, peakHoldL: 0, peakHoldR: 0, lastClipTime: 0,
  targetLoudness: state.targetLoudness,
  normalizeEnabled: state.normalizeEnabled,
  masterVolume: state.masterVolume,
  effects: state.effects,
  levelListeners: new Set(),
  progressListeners: new Set(),
  endedListeners: new Set(),

  ensureContext() {
    if (this.ctx) return this.ctx;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    this.ctx = new Ctx();
    this.audioEl = new Audio();
    this.audioEl.crossOrigin = "anonymous";
    this.audioEl.preload = "auto";
    this.sourceNode = this.ctx.createMediaElementSource(this.audioEl);

    this.normalizeGain = this.ctx.createGain();
    this.masterGain = this.ctx.createGain();
    this.analyser = this.ctx.createAnalyser();
    this.analyser.fftSize = 2048;
    this.analyser.smoothingTimeConstant = 0.6;

    this.eqNodes = EQ_BAND_FREQUENCIES.map((freq, i) => {
      const node = this.ctx.createBiquadFilter();
      node.type = i === 0 ? "lowshelf" : i === EQ_BAND_FREQUENCIES.length-1 ? "highshelf" : "peaking";
      node.frequency.value = freq;
      node.Q.value = 1.4;
      node.gain.value = 0;
      return node;
    });

    this.reverbConvolver = this.ctx.createConvolver();
    this.reverbWet = this.ctx.createGain();
    this.reverbDry = this.ctx.createGain();
    this.reverbWet.gain.value = 0;
    this.reverbDry.gain.value = 1;
    this.updateReverbIR(1.5);

    this.bassBoost = this.ctx.createBiquadFilter();
    this.bassBoost.type = "lowshelf";
    this.bassBoost.frequency.value = 100;
    this.bassBoost.gain.value = 0;

    this.vinylShaper = this.ctx.createWaveShaper();
    this.vinylShaper.curve = this.makeVinylCurve(0.4);
    this.vinylShaper.oversample = "2x";
    this.vinylNoiseGain = this.ctx.createGain();
    this.vinylNoiseGain.gain.value = 0;
    this.vinylNoiseSource = this.createNoiseSource(0.3);
    this.vinylNoiseSource.connect(this.vinylNoiseGain);
    this.vinylNoiseSource.start();

    this.surroundPanner = this.ctx.createStereoPanner();
    this.surroundPanner.pan.value = 0;

    this.sourceNode.connect(this.normalizeGain);
    this.normalizeGain.connect(this.masterGain);
    this.masterGain.connect(this.analyser);
    this.analyser.connect(this.ctx.destination);

    this.audioEl.addEventListener("timeupdate", () => {
      if (!this.audioEl) return;
      const dur = this.audioEl.duration;
      if (!isFinite(dur) || dur === 0) return;
      const ratio = this.audioEl.currentTime / dur;
      this.progressListeners.forEach(l => l(ratio, this.audioEl.currentTime));
    });
    this.audioEl.addEventListener("ended", () => {
      this.endedListeners.forEach(l => l());
    });

    this.startLevelLoop();
    return this.ctx;
  },
  async resume() {
    const ctx = this.ensureContext();
    if (ctx.state === "suspended") await ctx.resume();
  },
  async analyzeFile(file) {
    const id = genId();
    const base = { id, file, name: file.name, size: file.size, duration:0, sampleRate:0, channels:0, rmsLoudness:0, peakAmplitude:0, gainDb:0, status:"analyzing" };
    try {
      const ab = await file.arrayBuffer();
      const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      const decCtx = new Ctx(1, 1, 44100);
      const buf = await decCtx.decodeAudioData(ab.slice(0));
      let sumSq = 0, sampleCount = 0, peak = 0;
      const channels = buf.numberOfChannels;
      for (let ch = 0; ch < channels; ch++) {
        const data = buf.getChannelData(ch);
        for (let i = 0; i < data.length; i++) {
          const s = data[i];
          sumSq += s*s;
          const a = Math.abs(s);
          if (a > peak) peak = a;
        }
        sampleCount += data.length;
      }
      const rms = Math.sqrt(sumSq / Math.max(sampleCount,1));
      const rmsDb = 20 * Math.log10(Math.max(rms, 1e-7));
      let gainDb = this.targetLoudness - rmsDb;
      if (gainDb > MAX_GAIN_DB) gainDb = MAX_GAIN_DB;
      if (gainDb > 0) {
        const sp = peak * Math.pow(10, gainDb/20);
        if (sp > 1.0) gainDb = 20 * Math.log10(1 / Math.max(peak, 1e-7));
      }
      return Object.assign(base, { duration: buf.duration, sampleRate: buf.sampleRate, channels, rmsLoudness: rmsDb, peakAmplitude: peak, gainDb, status:"ready" });
    } catch (err) {
      return Object.assign(base, { status:"error", errorMessage: err && err.message ? err.message : "解码失败" });
    }
  },
  async loadTrack(track) {
    const ctx = this.ensureContext();
    await ctx.resume();
    if (!this.audioEl) return;
    if (this.objectUrl) URL.revokeObjectURL(this.objectUrl);
    this.objectUrl = URL.createObjectURL(track.file);
    this.audioEl.src = this.objectUrl;
    this.currentTrackId = track.id;
    this.applyNormalizeForTrack(track);
  },
  applyNormalizeForTrack(track) {
    if (!this.normalizeGain || !this.ctx) return;
    const target = this.normalizeEnabled ? dbToGain(track.gainDb) : 1;
    const now = this.ctx.currentTime;
    this.normalizeGain.gain.cancelScheduledValues(now);
    this.normalizeGain.gain.setValueAtTime(this.normalizeGain.gain.value, now);
    this.normalizeGain.gain.linearRampToValueAtTime(target, now + 0.05);
  },
  recomputeGains(tracks) {
    return tracks.map(t => {
      if (t.status !== "ready") return t;
      let g = this.targetLoudness - t.rmsLoudness;
      if (g > MAX_GAIN_DB) g = MAX_GAIN_DB;
      if (g > 0) {
        const sp = t.peakAmplitude * Math.pow(10, g/20);
        if (sp > 1.0) g = 20 * Math.log10(1 / Math.max(t.peakAmplitude, 1e-7));
      }
      return Object.assign({}, t, { gainDb: g });
    });
  },
  async play() { const ctx = this.ensureContext(); await ctx.resume(); await this.audioEl && this.audioEl.play(); },
  pause() { this.audioEl && this.audioEl.pause(); },
  stop() { if (this.audioEl) { this.audioEl.pause(); this.audioEl.currentTime = 0; } },
  seek(r) { if (this.audioEl && isFinite(this.audioEl.duration)) this.audioEl.currentTime = r * this.audioEl.duration; },
  setTargetLoudness(db) { this.targetLoudness = db; },
  setNormalizeEnabled(en) { this.normalizeEnabled = en; },
  refreshNormalize(cur) {
    if (cur && this.currentTrackId === cur.id) this.applyNormalizeForTrack(cur);
  },
  setMasterVolume(v) {
    this.masterVolume = Math.max(0, Math.min(1, v));
    if (this.masterGain && this.ctx) {
      const now = this.ctx.currentTime;
      this.masterGain.gain.cancelScheduledValues(now);
      this.masterGain.gain.setValueAtTime(this.masterGain.gain.value, now);
      this.masterGain.gain.linearRampToValueAtTime(this.masterVolume, now + 0.03);
    }
  },
  setEffects(effects) {
    const ctx = this.ensureContext();
    this.effects = effects;
    if (!this.normalizeGain || !this.masterGain) return;
    try { this.normalizeGain.disconnect(); } catch {}
    this.eqNodes.forEach(n => n.disconnect());
    this.reverbConvolver && this.reverbConvolver.disconnect();
    this.reverbWet && this.reverbWet.disconnect();
    this.reverbDry && this.reverbDry.disconnect();
    this.bassBoost && this.bassBoost.disconnect();
    this.vinylShaper && this.vinylShaper.disconnect();
    this.surroundPanner && this.surroundPanner.disconnect();

    let lastNode = this.normalizeGain;
    const append = (n) => { lastNode.connect(n); lastNode = n; };

    if (effects.eq.enabled) {
      effects.eq.params.bands.forEach((g, i) => { if (this.eqNodes[i]) this.eqNodes[i].gain.value = g; });
      this.eqNodes.forEach(n => append(n));
    } else {
      this.eqNodes.forEach(n => n.gain.value = 0);
    }

    if (effects.reverb.enabled) {
      const { mix, decay } = effects.reverb.params;
      this.updateReverbIR(decay);
      if (this.reverbWet && this.reverbDry && this.reverbConvolver) {
        this.reverbWet.gain.value = mix;
        this.reverbDry.gain.value = 1 - mix * 0.4;
        lastNode.connect(this.reverbDry);
        lastNode.connect(this.reverbConvolver);
        this.reverbConvolver.connect(this.reverbWet);
        const merger = ctx.createGain();
        this.reverbDry.connect(merger);
        this.reverbWet.connect(merger);
        lastNode = merger;
      }
    } else {
      if (this.reverbWet) this.reverbWet.gain.value = 0;
      if (this.reverbDry) this.reverbDry.gain.value = 1;
    }

    if (effects["bass-boost"].enabled) {
      if (this.bassBoost) {
        this.bassBoost.frequency.value = effects["bass-boost"].params.frequency;
        this.bassBoost.gain.value = effects["bass-boost"].params.gain;
        append(this.bassBoost);
      }
    } else {
      if (this.bassBoost) this.bassBoost.gain.value = 0;
    }

    if (effects.vinyl.enabled) {
      if (this.vinylShaper) {
        this.vinylShaper.curve = this.makeVinylCurve(effects.vinyl.params.warmth);
        append(this.vinylShaper);
      }
      if (this.vinylNoiseGain) this.vinylNoiseGain.gain.value = effects.vinyl.params.crackle * 0.06;
    } else {
      if (this.vinylNoiseGain) this.vinylNoiseGain.gain.value = 0;
    }

    if (effects.surround3d.enabled) {
      if (this.surroundPanner) {
        this.surroundPanner.pan.value = 0;
        append(this.surroundPanner);
      }
    }

    lastNode.connect(this.masterGain);
  },
  updateReverbIR(decaySec) {
    if (!this.ctx || !this.reverbConvolver) return;
    const sr = this.ctx.sampleRate;
    const length = Math.max(1, Math.floor(sr * decaySec));
    const ir = this.ctx.createBuffer(2, length, sr);
    for (let ch = 0; ch < 2; ch++) {
      const data = ir.getChannelData(ch);
      for (let i = 0; i < length; i++) {
        const t = i / length;
        const env = Math.pow(1 - t, 3);
        data[i] = (Math.random()*2 - 1) * env;
      }
    }
    this.reverbConvolver.buffer = ir;
  },
  makeVinylCurve(warmth) {
    const n = 1024;
    const curve = new Float32Array(n);
    const amount = Math.max(0, Math.min(1, warmth)) * 0.5;
    for (let i = 0; i < n; i++) {
      const x = (i / (n-1)) * 2 - 1;
      curve[i] = x + amount * Math.tanh(x * 3) * 0.3;
    }
    return curve;
  },
  createNoiseSource(intensity) {
    const ctx = this.ensureContext();
    const sr = ctx.sampleRate;
    const length = Math.floor(sr * 2);
    const buf = ctx.createBuffer(1, length, sr);
    const data = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < length; i++) {
      const w = Math.random() * 2 - 1;
      last = last * 0.92 + w * 0.08;
      data[i] = last * intensity;
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    return src;
  },
  startLevelLoop() {
    if (!this.analyser) return;
    const bufferLength = this.analyser.fftSize;
    const tick = () => {
      const timeData = new Uint8Array(bufferLength);
      this.analyser.getByteTimeDomainData(timeData);
      let sumSq = 0, peak = 0;
      for (let i = 0; i < bufferLength; i++) {
        const v = (timeData[i] - 128) / 128;
        sumSq += v * v;
        const a = Math.abs(v);
        if (a > peak) peak = a;
      }
      const rms = Math.sqrt(sumSq / bufferLength);
      this.peakHoldL = Math.max(peak, this.peakHoldL * 0.96);
      this.peakHoldR = this.peakHoldL;
      const clipped = peak >= 0.995;
      if (clipped) this.lastClipTime = Date.now();
      const showClip = Date.now() - this.lastClipTime < 500;
      const level = { left: rms, right: rms, peakLeft: this.peakHoldL, peakRight: this.peakHoldR, clipped: showClip };
      this.levelListeners.forEach(l => l(level));
      this.rafId = requestAnimationFrame(tick);
    };
    this.rafId = requestAnimationFrame(tick);
  },
  subscribeLevel(cb) { this.levelListeners.add(cb); this.ensureContext(); return () => this.levelListeners.delete(cb); },
  subscribeProgress(cb) { this.progressListeners.add(cb); return () => this.progressListeners.delete(cb); },
  subscribeEnded(cb) { this.endedListeners.add(cb); return () => this.endedListeners.delete(cb); },
};

audioEngine.subscribeProgress((ratio, t) => { state.progress = ratio; state.currentTime = t; renderProgress(); });
audioEngine.subscribeLevel((lv) => { state.level = lv; renderLevel(); });
audioEngine.subscribeEnded(() => {
  if (state.playMode === "repeat-one" && state.currentTrackId) {
    playTrack(state.currentTrackId);
  } else {
    next();
  }
});

/* ===================== 业务方法 ===================== */
async function addFiles(files) {
  const audioFiles = files.filter(f => f.type.startsWith("audio/") || /\.(mp3|wav|flac|ogg|m4a|aac|opus|webm)$/i.test(f.name));
  if (audioFiles.length === 0) return;
  const placeholders = audioFiles.map(f => ({
    id: genId(), file: f, name: f.name, size: f.size,
    duration:0, sampleRate:0, channels:0, rmsLoudness:0, peakAmplitude:0, gainDb:0, status:"analyzing",
  }));
  state.tracks = state.tracks.concat(placeholders);
  renderPlaylist();
  for (const pt of placeholders) {
    try {
      const analyzed = await audioEngine.analyzeFile(pt.file);
      analyzed.id = pt.id;
      const idx = state.tracks.findIndex(t => t.id === pt.id);
      if (idx >= 0) state.tracks[idx] = analyzed;
    } catch {
      const idx = state.tracks.findIndex(t => t.id === pt.id);
      if (idx >= 0) state.tracks[idx] = Object.assign(state.tracks[idx], { status:"error", errorMessage:"分析失败" });
    }
    renderPlaylist();
    if (state.currentTrackId === pt.id) renderPlayer();
  }
}
function removeTrack(id) {
  const wasCurrent = state.currentTrackId === id;
  if (wasCurrent) { audioEngine.stop(); state.currentTrackId = null; state.isPlaying = false; state.progress = 0; state.currentTime = 0; }
  state.tracks = state.tracks.filter(t => t.id !== id);
  renderPlaylist(); renderPlayer();
}
function clearTracks() {
  audioEngine.stop();
  state.tracks = []; state.currentTrackId = null; state.isPlaying = false; state.progress = 0; state.currentTime = 0;
  renderPlaylist(); renderPlayer();
}
function reorderTracks(from, to) {
  const arr = state.tracks.slice();
  const [m] = arr.splice(from, 1);
  arr.splice(to, 0, m);
  state.tracks = arr;
  renderPlaylist();
}
async function playTrack(id) {
  const t = state.tracks.find(t => t.id === id);
  if (!t || t.status !== "ready") return;
  await audioEngine.loadTrack(t);
  audioEngine.setMasterVolume(state.masterVolume);
  audioEngine.setEffects(state.effects);
  audioEngine.refreshNormalize(state.normalizeEnabled ? t : null);
  await audioEngine.play();
  state.currentTrackId = id; state.isPlaying = true; state.progress = 0; state.currentTime = 0;
  renderPlaylist(); renderPlayer();
}
async function togglePlay() {
  if (!state.currentTrackId) {
    const first = state.tracks.find(t => t.status === "ready");
    if (first) await playTrack(first.id);
    return;
  }
  if (state.isPlaying) { audioEngine.pause(); state.isPlaying = false; }
  else { await audioEngine.play(); state.isPlaying = true; }
  renderPlaylist(); renderPlayer();
}
async function next() {
  if (state.tracks.length === 0) return;
  const ready = state.tracks.filter(t => t.status === "ready");
  if (ready.length === 0) return;
  if (state.playMode === "shuffle") {
    const others = ready.filter(t => t.id !== state.currentTrackId);
    const pool = others.length > 0 ? others : ready;
    await playTrack(pool[Math.floor(Math.random()*pool.length)].id);
    return;
  }
  const idx = ready.findIndex(t => t.id === state.currentTrackId);
  await playTrack(ready[(idx+1) % ready.length].id);
}
async function prev() {
  if (state.tracks.length === 0) return;
  const ready = state.tracks.filter(t => t.status === "ready");
  if (ready.length === 0) return;
  const idx = ready.findIndex(t => t.id === state.currentTrackId);
  await playTrack(ready[(idx-1+ready.length) % ready.length].id);
}
function seek(r) { audioEngine.seek(r); state.progress = r; renderProgress(); }
function setPlayMode(m) { state.playMode = m; persist(); renderPlayer(); }
function setTargetLoudness(db) {
  const c = clamp(db, TARGET_LOUDNESS_MIN, TARGET_LOUDNESS_MAX, -18);
  audioEngine.setTargetLoudness(c);
  state.tracks = audioEngine.recomputeGains(state.tracks);
  state.targetLoudness = c;
  const cur = state.tracks.find(t => t.id === state.currentTrackId);
  if (cur && state.normalizeEnabled) audioEngine.refreshNormalize(cur);
  persist();
  renderBalancer(); renderPlaylist(); renderPlayer();
}
function setNormalizeEnabled(en) {
  audioEngine.setNormalizeEnabled(en);
  const cur = state.tracks.find(t => t.id === state.currentTrackId);
  audioEngine.refreshNormalize(en ? cur : null);
  state.normalizeEnabled = en;
  persist();
  renderBalancer(); renderPlayer();
}
function setMasterVolume(v) { audioEngine.setMasterVolume(v); state.masterVolume = v; persist(); renderPlayer(); }
function setEffects(eff) { audioEngine.setEffects(eff); state.effects = eff; persist(); renderEffects(); }
function setEffectEnabled(id, en) {
  const eff = JSON.parse(JSON.stringify(state.effects));
  eff[id].enabled = en;
  setEffects(eff);
}
function updateEffectParams(id, params) {
  const eff = JSON.parse(JSON.stringify(state.effects));
  eff[id].params = Object.assign({}, eff[id].params, params);
  setEffects(eff);
}
function applyEqPreset(p) {
  const eff = JSON.parse(JSON.stringify(state.effects));
  eff.eq.params.preset = p;
  eff.eq.params.bands = [...EQ_PRESETS[p]];
  setEffects(eff);
}
function setDraggingFile(d) { state.isDraggingFile = d; renderDragOverlay(); }

/* ===================== 渲染 ===================== */
function renderDragOverlay() {
  const el = $("#drag-overlay");
  if (state.isDraggingFile) el.classList.remove("hidden");
  else el.classList.add("hidden");
}

function renderPlaylist() {
  const root = $("#playlist-section");
  const tracks = state.tracks;
  const readyCount = tracks.filter(t => t.status === "ready").length;
  const analyzingCount = tracks.filter(t => t.status === "analyzing").length;
  const errorCount = tracks.filter(t => t.status === "error").length;

  let html = `<div class="flex h-full flex-col gap-3">`;
  // 头部
  html += `<div class="flex items-center justify-between px-1">
    <div class="flex items-center gap-2">
      ${svgIcon("listMusic", 16)}
      <h2 class="font-display text-lg tracking-[0.15em] text-ink-100">PLAYLIST</h2>
      <span class="rounded-full bg-ink-700 px-2 py-0.5 font-mono text-[10px] text-ink-300" style="background-color: rgba(26,26,31,0.8);">${tracks.length}</span>
      ${analyzingCount > 0 ? `<span class="font-mono text-[10px] text-neon">· ${analyzingCount} 分析中</span>` : ``}
      ${errorCount > 0 ? `<span class="font-mono text-[10px] text-clip">· ${errorCount} 失败</span>` : ``}
    </div>
    ${tracks.length > 0 ? `<button type="button" id="clear-btn" class="flex items-center gap-1 rounded-md border px-2 py-1 font-mono text-[10px] transition-all ${state.confirmClear ? 'border-clip text-clip' : 'border-ink-500 text-ink-300'}" style="border-color: ${state.confirmClear ? 'rgba(255,59,48,0.4)' : 'rgba(58,58,64,0.4)'}; background-color: ${state.confirmClear ? 'rgba(255,59,48,0.1)' : 'transparent'};">
      ${svgIcon("trash", 12)}
      ${state.confirmClear ? "确认清空" : "清空"}
    </button>` : ``}
  </div>`;

  // 列表区
  html += `<div class="flex-1 overflow-y-auto pr-1">`;
  if (tracks.length === 0) {
    // 上传区
    html += renderUploadZone();
  } else {
    html += `<div class="flex flex-col gap-2">`;
    tracks.forEach((t, i) => { html += renderTrackItem(t, i); });
    // 追加文件
    html += `<label class="mt-2 flex cursor-pointer items-center justify-center gap-2 rounded-lg border border-dashed py-3 text-ink-300 transition-all" style="border-color: rgba(42,42,46,0.4); background-color: rgba(19,19,22,0.4);">
      ${svgIcon("music", 14)}
      <span class="font-mono text-xs">追加更多曲目</span>
      <input type="file" accept="audio/*,.mp3,.wav,.flac,.ogg,.m4a,.aac,.opus" multiple id="append-input" />
    </label>`;
    html += `</div>`;
  }
  html += `</div>`;

  // 底部统计
  if (tracks.length > 0) {
    html += `<div class="flex items-center justify-between border-t pt-2 font-mono text-[10px] text-ink-400" style="border-color: rgba(26,26,31,0.6);">
      <span>${readyCount} 首可用</span>
      <span>拖拽手柄排序</span>
    </div>`;
  }
  html += `</div>`;
  root.innerHTML = html;

  // 绑定事件
  const clearBtn = $("#clear-btn");
  if (clearBtn) {
    clearBtn.addEventListener("click", () => {
      if (state.confirmClear) { clearTracks(); state.confirmClear = false; }
      else { state.confirmClear = true; setTimeout(() => { state.confirmClear = false; renderPlaylist(); }, 2500); renderPlaylist(); }
    });
  }
  const appendInput = $("#append-input");
  if (appendInput) appendInput.addEventListener("change", (e) => { if (e.target.files.length) { addFiles(Array.from(e.target.files)); e.target.value = ""; } });

  // 上传区文件选择（label 自动触发 input，无需 JS 点击）
  const uploadInput = $("#upload-input");
  if (uploadInput) uploadInput.addEventListener("change", (e) => {
    const files = Array.from(e.target.files);
    e.target.value = ""; // 先清空，避免 addFiles 内 re-render 销毁元素后操作失败
    if (files.length) addFiles(files);
  });

  // 拖拽排序
  $$(".track-item").forEach(el => {
    const id = el.dataset.id;
    const grip = el.querySelector(".grip-handle");
    let dragFromIdx = null;
    if (grip) {
      grip.setAttribute("draggable", "true");
      grip.addEventListener("dragstart", (e) => {
        dragFromIdx = parseInt(el.dataset.idx);
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", String(dragFromIdx));
      });
    }
    el.addEventListener("dragover", (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; });
    el.addEventListener("drop", (e) => {
      e.preventDefault();
      e.stopPropagation();
      const from = parseInt(e.dataTransfer.getData("text/plain"));
      const to = parseInt(el.dataset.idx);
      if (!isNaN(from) && !isNaN(to) && from !== to) reorderTracks(from, to);
    });
    // 主按钮
    const mainBtn = el.querySelector(".track-main-btn");
    if (mainBtn) mainBtn.addEventListener("click", () => {
      if (t_status(id) !== "ready") return;
      if (state.currentTrackId === id) togglePlay();
      else playTrack(id);
    });
    const delBtn = el.querySelector(".track-del-btn");
    if (delBtn) delBtn.addEventListener("click", () => removeTrack(id));
  });
}

function t_status(id) { const t = state.tracks.find(t => t.id === id); return t ? t.status : "error"; }

function renderUploadZone() {
  return `<label id="upload-zone" for="upload-input" class="upload-zone upload-zone-default cursor-pointer block">
    <input type="file" accept="audio/*,.mp3,.wav,.flac,.ogg,.m4a,.aac,.opus" multiple id="upload-input" />
    <div class="flex w-full flex-col items-center justify-center gap-3 px-6 py-10 text-center">
      <div id="upload-icon" class="flex h-16 w-16 items-center justify-center rounded-full border transition-all" style="border-color: rgba(138,138,146,0.6); background-color: rgba(26,26,31,0.6); color: var(--ink-200);">
        ${svgIcon("upload", 28)}
      </div>
      <div class="space-y-1">
        <p class="font-display text-2xl tracking-wider text-ink-100">拖入音频文件 或 点击上传</p>
        <p class="font-mono text-xs text-ink-300">支持 MP3 / WAV / FLAC / OGG / M4A / AAC · 多选批量</p>
      </div>
      <div class="mt-2 flex items-center gap-2 rounded-full border px-4 py-1.5" style="border-color: rgba(58,58,64,0.6); background-color: rgba(26,26,31,0.6);">
        ${svgIcon("music2", 14)}
        <span class="font-mono text-xs text-ink-200">选择文件</span>
      </div>
    </div>
    <span class="absolute h-1.5 w-1.5 rounded-full" style="left:16px;top:16px;background-color: rgba(78,205,196,0.7); box-shadow: 0 0 24px rgba(78,205,196,0.45);"></span>
    <span class="absolute h-1.5 w-1.5 rounded-full" style="right:16px;top:16px;background-color: rgba(255,140,66,0.7); box-shadow: 0 0 24px rgba(255,140,66,0.45);"></span>
  </label>`;
}

function renderTrackItem(t, i) {
  const isCurrent = state.currentTrackId === t.id;
  const isPlaying = state.isPlaying && isCurrent;
  const isReady = t.status === "ready";
  const isError = t.status === "error";
  const isAnalyzing = t.status === "analyzing";
  const gainSign = t.gainDb >= 0 ? "+" : "";
  const ext = getFileExt(t.name).toUpperCase();

  let cls = "track-item ";
  if (isCurrent) cls += "track-current";
  else if (isError) cls += "track-error";
  else cls += "track-default";

  let mainIcon = svgIcon("play", 14, true);
  if (isAnalyzing) mainIcon = `<svg class="icon" width="14" height="14" viewBox="0 0 24 24" style="animation: spin 1s linear infinite;"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>`;
  else if (isError) mainIcon = `<span style="color: var(--clip);">${svgIcon("alert", 14)}</span>`;
  else if (isCurrent && isPlaying) mainIcon = svgIcon("pause", 14, true);

  let badgeColor = "border-ink-500 bg-ink-800 text-ink-200";
  if (t.gainDb > 0) badgeColor = "";
  else if (t.gainDb < 0) badgeColor = "";

  let html = `<div class="${cls}" data-id="${t.id}" data-idx="${i}">
    <button type="button" class="grip-handle cursor-grab text-ink-400 hover:text-ink-100" aria-label="拖拽排序" style="background:transparent;border:none;">${svgIcon("grip", 16)}</button>
    <button type="button" class="track-main-btn flex h-9 w-9 shrink-0 items-center justify-center rounded-full border transition-all" style="border-color: ${isCurrent ? 'var(--amber)' : 'rgba(58,58,64,0.4)'}; background-color: ${isCurrent ? 'rgba(255,140,66,0.1)' : 'rgba(19,19,22,0.6)'}; color: ${isCurrent ? 'var(--amber)' : 'var(--ink-300)'}; ${isCurrent ? 'box-shadow: 0 0 24px rgba(255,140,66,0.45), inset 0 0 12px rgba(255,140,66,0.2);' : ''} ${!isReady ? 'opacity:0.6;cursor:not-allowed;' : 'cursor:pointer;'}">
      ${mainIcon}
    </button>
    <div class="min-w-0 flex-1">
      <div class="flex items-center gap-2">
        <span class="truncate font-medium" style="color: ${isCurrent ? 'var(--amber)' : 'var(--ink-100)'};">${stripExt(t.name)}</span>
        ${ext ? `<span class="shrink-0 rounded px-1 py-0.5 font-mono text-[9px] tracking-wider text-ink-300" style="background-color: rgba(19,19,22,0.8);">${ext}</span>` : ``}
      </div>
      <div class="mt-0.5 flex items-center gap-3 font-mono text-[10px] text-ink-300">`;
  if (isAnalyzing) html += `<span class="text-neon">分析中…</span>`;
  else if (isError) html += `<span class="text-clip">${t.errorMessage || "解析失败"}</span>`;
  else html += `<span>${formatTime(t.duration)}</span><span class="text-ink-500">·</span><span>${formatSize(t.size)}</span>${t.channels > 0 ? `<span class="text-ink-500">·</span><span>${t.channels === 2 ? "STEREO" : "MONO"}</span>` : ``}`;
  html += `</div></div>`;

  if (isReady) {
    html += `<div class="hidden shrink-0 items-center gap-2 sm:flex">
      <div class="flex flex-col items-end">
        <span class="font-mono text-[9px] tracking-wider text-ink-400">RMS</span>
        <span class="font-mono text-xs text-ink-200">${t.rmsLoudness.toFixed(1)} dB</span>
      </div>
      <div class="flex flex-col items-end rounded-md border px-2 py-1" style="border-color: ${t.gainDb > 0 ? 'rgba(255,140,66,0.4)' : t.gainDb < 0 ? 'rgba(78,205,196,0.4)' : 'rgba(58,58,64,0.4)'}; background-color: ${t.gainDb > 0 ? 'rgba(255,140,66,0.1)' : t.gainDb < 0 ? 'rgba(78,205,196,0.1)' : 'rgba(19,19,22,0.6)'};">
        <span class="font-mono text-[9px] tracking-wider text-ink-400">GAIN</span>
        <span class="font-mono text-xs font-bold" style="color: ${t.gainDb > 0 ? 'var(--amber)' : t.gainDb < 0 ? 'var(--neon)' : 'var(--ink-200)'};">${gainSign}${t.gainDb.toFixed(1)} dB</span>
      </div>
    </div>`;
  }

let meterRaf = 0;
function renderLevel() {
  // 仅更新 VU 条；波形由独立 raf 循环驱动
  const root = $("#meter-section");
  if (!root) return;
  const lv = state.level;
  const lLevel = rmsToLevel(lv.left);
  const rLevel = rmsToLevel(lv.right);
  const lPeak = rmsToLevel(lv.peakLeft);
  const rPeak = rmsToLevel(lv.peakRight);
  updateMeterBar(root.querySelector('[data-side="L"]'), lLevel, lPeak, lv.clipped);
  updateMeterBar(root.querySelector('[data-side="R"]'), rLevel, rPeak, lv.clipped);
  const clipEl = root.querySelector("#clip-badge");
  if (clipEl) clipEl.style.display = lv.clipped ? "block" : "none";
}

function rmsToLevel(rms) {
  if (rms <= 0) return 0;
  const db = 20 * Math.log10(rms);
  return Math.max(0, Math.min(1, (db + 60) / 60));
}

function updateMeterBar(el, level, peak, clipped) {
  if (!el) return;
  const segments = 24;
  const activeCount = Math.round(level * segments);
  const peakIndex = Math.round(peak * segments);
  const bars = el.querySelectorAll(".meter-segment");
  bars.forEach((bar, i) => {
    const ratio = i / segments;
    const isActive = i < activeCount;
    const isPeak = i === peakIndex - 1 || i === peakIndex;
    let color = "var(--ink-600)";
    if (isActive || isPeak) {
      if (ratio > 0.9) color = "var(--clip)";
      else if (ratio > 0.7) color = "var(--amber)";
      else color = "var(--neon)";
    }
    bar.style.backgroundColor = color;
  });
  el.parentElement.style.animation = clipped ? "pulse-soft 0.5s ease-in-out infinite" : "none";
}

function renderMeter() {
  const root = $("#meter-section");
  const lv = state.level;
  const isPlaying = state.isPlaying;
  const trackCount = state.tracks.length;

  const segments = 24;
  let html = `<div class="relative flex h-full flex-col gap-2 rounded-xl border p-3 backdrop-blur" style="border-color: rgba(42,42,46,0.4); background-color: rgba(19,19,22,0.6);">
    <div class="flex items-center justify-between">
      <span class="font-display text-sm tracking-[0.2em] text-ink-200">LEVEL METER</span>
      <div class="flex items-center gap-2">
        <span class="h-1.5 w-1.5 rounded-full" style="background-color: ${trackCount > 0 ? (isPlaying ? 'var(--neon)' : 'rgba(255,140,66,0.7)') : 'var(--ink-500)'}; ${trackCount > 0 && isPlaying ? 'box-shadow: 0 0 24px rgba(78,205,196,0.45), inset 0 0 12px rgba(78,205,196,0.2); animation: pulse-soft 1.5s ease-in-out infinite;' : ''}"></span>
        <span class="font-mono text-[10px] text-ink-300">${trackCount > 0 ? (isPlaying ? "PLAYING" : "STANDBY") : "NO SIGNAL"}</span>
      </div>
    </div>
    <div class="flex flex-1 items-center gap-4">
      <div class="flex items-stretch gap-3">
        ${renderMeterBar("L", lv.left, lv.peakLeft, lv.clipped)}
        ${renderMeterBar("R", lv.right, lv.peakRight, lv.clipped)}
      </div>
      <div class="relative h-16 flex-1 overflow-hidden rounded-md border" style="border-color: rgba(42,42,46,0.4); background-color: rgba(10,10,11,0.8);">
        <canvas id="wave-canvas" width="400" height="64" class="h-full w-full"></canvas>
        <span id="clip-badge" class="absolute rounded px-1.5 py-0.5 font-mono text-[9px] font-bold text-white" style="right:8px;top:50%;transform:translateY(-50%);background-color: var(--clip); box-shadow: 0 0 24px rgba(255,140,66,0.45); display:none;">CLIP</span>
      </div>
    </div>
    <div class="flex items-center justify-between font-mono text-[10px] text-ink-300">
      <span>-60</span><span>-40</span><span>-20</span><span class="text-amber">-6</span><span class="text-clip">0 dB</span>
    </div>
  </div>`;
  root.innerHTML = html;

  // 启动波形绘制循环
  const canvas = $("#wave-canvas");
  const ctx = canvas.getContext("2d");
  if (meterRaf) cancelAnimationFrame(meterRaf);
  const draw = () => {
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle = "rgba(78, 205, 196, 0.08)";
    ctx.lineWidth = 1;
    for (let x = 0; x < w; x += 24) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(0, h/2); ctx.lineTo(w, h/2); ctx.stroke();
    const amp = state.isPlaying ? state.level.left : 0;
    const grad = ctx.createLinearGradient(0,0,w,0);
    grad.addColorStop(0, "#4ECDC4");
    grad.addColorStop(0.7, "#FF8C42");
    grad.addColorStop(1, "#FF3B30");
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    const points = 80;
    for (let i = 0; i <= points; i++) {
      const x = (i/points)*w;
      const base = Math.sin(i*0.4 + Date.now()*0.005) * amp * h * 0.4;
      const noise = (Math.random()-0.5) * amp * h * 0.2;
      const y = h/2 + base + noise;
      if (i === 0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
    meterRaf = requestAnimationFrame(draw);
  };
  draw();
}

function renderMeterBar(side, level, peak, clipped) {
  const segments = 24;
  let html = `<div class="flex flex-col items-center gap-1">
    <span class="font-mono text-[10px] tracking-wider text-ink-300">${side}</span>
    <div data-side="${side}" class="relative flex h-32 w-3 flex-col-reverse gap-[2px] overflow-hidden rounded-sm p-[2px]" style="background-color: rgba(10,10,11,0.8);">`;
  for (let i = 0; i < segments; i++) {
    html += `<div class="meter-segment"></div>`;
  }
  html += `</div></div>`;
  return html;
}

}

function renderEffectParams(id) {
  const eff = state.effects[id];
  if (id === "eq") {
    const params = eff.params;
    let html = `<div class="space-y-3">
      <div>
        <div class="mb-1.5 font-mono text-[10px] tracking-wider text-ink-400">PRESET</div>
        <div class="grid grid-cols-4 gap-1">`;
    EQ_PRESET_LIST.forEach(p => {
      const active = params.preset === p;
      html += `<button type="button" data-preset="${p}" class="preset-btn ${active ? 'preset-btn-active' : 'preset-btn-default'}"><span class="font-display text-xs tracking-wider">${EQ_PRESET_LABELS[p]}</span></button>`;
    });
    html += `</div></div>
      <div>
        <div class="mb-1 font-mono text-[10px] tracking-wider text-ink-400">BANDS · 10</div>
        <div class="rounded-md border p-3" style="border-color: rgba(42,42,46,0.4); background-color: rgba(10,10,11,0.6);">
          <div class="flex h-32 items-end justify-between gap-1">`;
    params.bands.forEach((gain, idx) => {
      const isPositive = gain > 0;
      html += `<div class="group relative flex h-full flex-1 flex-col items-center justify-center">
        <div class="absolute left-0 right-0 h-px" style="top:50%;background-color: rgba(42,42,46,0.6);"></div>
        <div class="eq-band-bar" style="height: ${Math.abs(gain)/12*48}%; align-self: ${isPositive ? 'flex-start' : 'flex-end'}; margin-top: ${isPositive ? (50 - Math.abs(gain)/12*48) + '%' : '50%'}; background-color: ${isPositive ? 'var(--amber)' : gain < 0 ? 'var(--neon)' : 'var(--ink-500)'};"></div>
        <span class="mt-1 font-mono text-[8px] text-ink-400">${gain > 0 ? "+" : ""}${gain.toFixed(0)}</span>
      </div>`;
    });
    html += `</div>
          <div class="mt-1 flex justify-between font-mono text-[8px] text-ink-500">`;
    EQ_BAND_FREQUENCIES.forEach(f => { html += `<span>${f >= 1000 ? (f/1000)+'k' : f}</span>`; });
    html += `</div>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-x-3 gap-y-2">`;
    params.bands.forEach((gain, idx) => {
      html += `<div class="flex items-center gap-2">
        <span class="w-8 font-mono text-[9px] text-ink-400">${EQ_BAND_FREQUENCIES[idx] >= 1000 ? (EQ_BAND_FREQUENCIES[idx]/1000)+'k' : EQ_BAND_FREQUENCIES[idx]}</span>
        <input type="range" min="-12" max="12" step="0.5" value="${gain}" data-band="${idx}" class="ll-slider flex-1" style="--fill: ${((gain+12)/24)*100}%; --track-fill: ${gain >= 0 ? '#FF8C42' : '#4ECDC4'};" />
        <span class="w-8 text-right font-mono text-[9px] text-ink-300">${gain > 0 ? "+" : ""}${gain.toFixed(1)}</span>
      </div>`;
    });
    html += `</div></div>`;
    return html;
  }

  if (id === "reverb") {
    const p = eff.params;
    return `<div class="space-y-3">
      ${renderSliderRow("MIX", p.mix, 0, 1, 0.01, v => `${Math.round(v*100)}%`, v => updateEffectParams("reverb", { mix: v }), "#4ECDC4")}
      ${renderSliderRow("DECAY", p.decay, 0.1, 5, 0.1, v => `${v.toFixed(1)}s`, v => updateEffectParams("reverb", { decay: v }), "#4ECDC4")}
    </div>`;
  }
  if (id === "bass-boost") {
    const p = eff.params;
    return `<div class="space-y-3">
      ${renderSliderRow("FREQUENCY", p.frequency, 60, 200, 5, v => `${v} Hz`, v => updateEffectParams("bass-boost", { frequency: v }), "#FF8C42")}
      ${renderSliderRow("GAIN", p.gain, 0, 12, 0.5, v => `+${v.toFixed(1)} dB`, v => updateEffectParams("bass-boost", { gain: v }), "#FF8C42")}
    </div>`;
  }
  if (id === "vinyl") {
    const p = eff.params;
    return `<div class="space-y-3">
      ${renderSliderRow("CRACKLE", p.crackle, 0, 1, 0.01, v => `${Math.round(v*100)}%`, v => updateEffectParams("vinyl", { crackle: v }), "#FF8C42")}
      ${renderSliderRow("WARMTH", p.warmth, 0, 1, 0.01, v => `${Math.round(v*100)}%`, v => updateEffectParams("vinyl", { warmth: v }), "#FF8C42")}
    </div>`;
  }
  if (id === "surround3d") {
    const p = eff.params;
    return `<div class="space-y-3">
      ${renderSliderRow("WIDTH", p.width, 0, 1, 0.01, v => `${Math.round(v*100)}%`, v => updateEffectParams("surround3d", { width: v }), "#4ECDC4")}
      ${renderSliderRow("DEPTH", p.depth, 0, 1, 0.01, v => `${Math.round(v*100)}%`, v => updateEffectParams("surround3d", { depth: v }), "#4ECDC4")}
    </div>`;
  }
  return "";
}

function renderSliderRow(label, value, min, max, step, format, onChange, color) {
  const ratio = (value - min) / (max - min);
  const id = "slider-" + label.toLowerCase() + "-" + genId();
  setTimeout(() => {
    const el = $("#" + id);
    if (el) el.addEventListener("input", (e) => onChange(parseFloat(e.target.value)));
  }, 0);
  return `<div>
    <div class="flex items-center justify-between">
      <span class="font-mono text-[10px] tracking-wider text-ink-400">${label}</span>
      <span class="font-mono text-xs font-bold text-ink-100">${format(value)}</span>
    </div>
    <input type="range" min="${min}" max="${max}" step="${step}" value="${value}" id="${id}" class="ll-slider mt-1.5" style="--fill: ${ratio*100}%; --track-fill: ${color};" />
  </div>`;
}

function renderAll() {
  renderPlaylist();
  renderPlayer();
  renderBalancer();
  renderMeter();
  renderEffects();
}

/* ===================== 全局拖拽事件 ===================== */
window.addEventListener("drop", (e) => {
  e.preventDefault();
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
    addFiles(Array.from(e.dataTransfer.files));
  }
  setDraggingFile(false);
});
window.addEventListener("dragover", (e) => {
  if (e.dataTransfer && e.dataTransfer.types.includes("Files")) {
    e.preventDefault();
    setDraggingFile(true);
  }
});
window.addEventListener("dragleave", (e) => {
  if (e.relatedTarget === null) setDraggingFile(false);
});

/* EQ 预设和频段事件委托（在 renderEffects 后绑定） */
document.addEventListener("click", (e) => {
  const presetBtn = e.target.closest("[data-preset]");
  if (presetBtn) { applyEqPreset(presetBtn.dataset.preset); return; }
});
document.addEventListener("input", (e) => {
  const bandSlider = e.target.closest("[data-band]");
  if (bandSlider) {
    const idx = parseInt(bandSlider.dataset.band);
    const v = parseFloat(bandSlider.value);
    const eff = JSON.parse(JSON.stringify(state.effects));
    eff.eq.params.bands[idx] = v;
    eff.eq.params.preset = "flat";
    setEffects(eff);
  }
});

/* 初始化 */
audioEngine.setTargetLoudness(state.targetLoudness);
audioEngine.setNormalizeEnabled(state.normalizeEnabled);
audioEngine.setMasterVolume(state.masterVolume);
renderAll();
</script>
</body>
</html>
