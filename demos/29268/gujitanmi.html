      </div>

      </div>

      <!-- Mode Selection -->
      <div id="gameModeSelect">
        <div class="game-modes">
          <div class="game-mode-btn active" onclick="selectMode('match')">
            <span class="mode-icon">🔗</span>
            <span class="mode-name">图文配对</span>
          </div>
          <div class="game-mode-btn" onclick="selectMode('fill')">
            <span class="mode-icon">✏️</span>
            <span class="mode-name">填空补句</span>
          </div>
          <div class="game-mode-btn" onclick="selectMode('riddle')">
            <span class="mode-icon">🔍</span>
            <span class="mode-name">情境解谜</span>
          </div>
        </div>
        <button class="game-btn game-btn-primary" onclick="startGame()" style="width:100%">开始闯关</button>
      </div>

      <!-- Match Game -->
      <div class="game-area" id="game-match">
        <div class="match-instruction">点击左侧古文，再点击右侧对应的白话翻译进行配对</div>
        <div class="match-container" id="matchContainer"></div>
        <div class="game-controls">
          <button class="game-btn game-btn-secondary" onclick="backToModeSelect()">返回</button>
          <button class="game-btn game-btn-primary" onclick="nextMatchRound()">下一关</button>
        </div>
      </div>

      <!-- Fill Game -->
      <div class="game-area" id="game-fill">
        <div class="fill-passage" id="fillPassage"></div>
        <div class="fill-options" id="fillOptions"></div>
        <div class="game-controls">
          <button class="game-btn game-btn-secondary" onclick="backToModeSelect()">返回</button>
          <button class="game-btn game-btn-primary" onclick="nextFillRound()">下一关</button>
        </div>
      </div>

      <!-- Riddle Game -->
      <div class="game-area" id="game-riddle">
        <div class="riddle-scene" id="riddleScene"></div>
        <div class="riddle-options" id="riddleOptions"></div>
        <div class="game-controls">
          <button class="game-btn game-btn-secondary" onclick="backToModeSelect()">返回</button>
          <button class="game-btn game-btn-primary" onclick="nextRiddleRound()">下一关</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Score Popup -->
  <div class="overlay" id="overlay" onclick="closePopup()"></div>
  <div class="score-popup" id="scorePopup">
    <div class="score-label">本轮得分</div>
    <div class="big-score" id="popupScore">+10</div>
    <div class="score-msg" id="popupMsg">回答正确！</div>
    <button class="game-btn game-btn-primary" onclick="closePopup()" style="width:100%">继续</button>
  </div>

  <script>
    // ===== Page Switching =====
    function switchPage(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      document.getElementById('page-' + page).classList.add('active');
      document.querySelector('[data-page="' + page + '"]').classList.add('active');
    }

    // ===== AI Interpret =====
    const examples = [
      { text: '学而不思则罔，思而不学则殆。', source: '《论语·为政》',
        translate: '只学习却不思考，就会迷惘而无所适从；只思考却不学习，就会疑惑而更加危险。',
        fun: '孔子早在2500年前就发现了"输入"和"处理"的关系——光输入不处理，大脑就像一个没有索引的硬盘，存了一堆东西但找不到；光处理不输入，就像CPU空转，想得再多也没有数据支撑。现代教育说的"批判性思维"，孔子一个"罔"字就概括了。' },
      { text: '北冥有鱼，其名为鲲。鲲之大，不知其几千里也。化而为鸟，其名为鹏。鹏之背，不知其几千里也。', source: '《庄子·逍遥游》',
        translate: '北方深海里有一条鱼，名字叫鲲。鲲的体积巨大，不知道有几千里。它变化成为鸟，名字叫鹏。鹏的背，也不知道有几千里。',
        fun: '庄子大概是古代最会"吹牛"的哲学家。但他的"吹牛"有深意：鲲和鹏的巨大体型，象征的是打破常规认知的想象力。庄子想告诉我们——别被眼前的世界限制了，你的格局可以更大。放到今天，这就是在说"Think Big"。' },
      { text: '道可道，非常道；名可名，非常名。', source: '《道德经》第一章',
        translate: '可以说出来的道，就不是永恒的道；可以叫出来的名，就不是永恒的名。',
        fun: '老子开篇就来了一个"元悖论"——当你试图定义它的时候，它就已经不是它了。这就像你试图向别人解释"什么是意识"——你越解释，对方越糊涂。老子在提醒我们：有些东西只能体会，不能言传。放到今天，这大概就是"只可意会不可言传"的哲学版。' },
      { text: '关关雎鸠，在河之洲。窈窕淑女，君子好逑。', source: '《诗经·周南·关雎》',
        translate: '关关鸣叫的雎鸠鸟，停在河中的沙洲上。美丽贤淑的女子，是君子理想的对象。',
        fun: '这是中国最早的"情歌"之一，收录在《诗经》的第一篇，地位相当于中国文学的"开屏曲"。有趣的是，古人谈恋爱也讲究"门当户对"——"君子"配"淑女"，不是随便谁都能追的。而且这首诗的追爱方式相当文明：先在河边远远地看着，然后弹琴鼓瑟来表白，最后敲锣打鼓来庆祝。堪称古代版"正确追爱指南"。' }
    ];

    function fillExample(idx) {
      document.getElementById('aiInput').value = examples[idx].text;
    }

    function submitAI() {
      const input = document.getElementById('aiInput').value.trim();
      if (!input) return;

      const btn = document.getElementById('aiSubmitBtn');
      const loading = document.getElementById('aiLoading');
      const result = document.getElementById('aiResult');

      btn.disabled = true;
      result.classList.remove('show');
      loading.classList.add('show');

      // Find matching example or generate generic response
      let matched = examples.find(e => input.includes(e.text.substring(0, 6)));

      setTimeout(function() {
        loading.classList.remove('show');
        btn.disabled = false;

        if (matched) {
          document.getElementById('resultOriginal').textContent = matched.text;
          document.getElementById('resultTranslate').textContent = matched.translate;
          document.getElementById('resultFun').textContent = matched.fun;
        } else {
          document.getElementById('resultOriginal').textContent = input;
          document.getElementById('resultTranslate').textContent = '（Demo模式）这段古文的白话翻译将在此处显示。实际产品中，这里会调用大模型API（如DeepSeek、通义千问）实时生成翻译。';
          document.getElementById('resultFun').textContent = '（Demo模式）趣味解读将在此处显示。AI会用现代语言、网络热词、生活场景来解读古籍含义，让古文变得有趣好懂。';
        }
        result.classList.add('show');
      }, 1500);
    }

    // ===== Game Data =====
    let gameScore = 0;
    let gameLevel = 1;
    let gameCorrect = 0;
    let currentMode = 'match';
    let selectedMatch = null;

    const matchData = [
      [
        { classical: '三人行，必有我师焉', modern: '几个人一起走路，其中一定有可以做我老师的人' },
        { classical: '温故而知新', modern: '温习旧知识从而得到新的理解和体会' },
        { classical: '己所不欲，勿施于人', modern: '自己不想要的，不要施加给别人' },
        { classical: '知之为知之', modern: '知道就是知道，不知道就是不知道' }
      ],
      [
        { classical: '天下兴亡，匹夫有责', modern: '国家的兴衰存亡，每个普通人都有责任' },
        { classical: '生于忧患，死于安乐', modern: '在忧患中生存，在安乐中灭亡' },
        { classical: '千里之行，始于足下', modern: '千里远的路程，从脚下第一步开始' },
        { classical: '上善若水', modern: '最高尚的品德就像水一样' }
      ]
    ];

    const fillData = [
      {
        source: '《论语·里仁》',
        parts: ['三人行，必有我', { blank: '师', options: ['师', '友', '父'] }, '焉。择其善者而从之，其不善者而改之。']
      },
      {
        source: '《道德经》第六十四章',
        parts: ['千里之行，始于', { blank: '足', options: ['足', '手', '心'] }, '下。'],
        full: '合抱之木，生于毫末；九层之台，起于累土；千里之行，始于足下。'
      },
      {
        source: '《论语·雍也》',
        parts: ['知之者不如', { blank: '好', options: ['好', '乐', '善'] }, '之者，好之者不如乐之者。']
      }
    ];

    const riddleData = [
      {
        scene: '春秋时期，鲁国有一位老师，他带着学生们周游列国十四年。有一天，一个学生问他："老师，有没有一个字可以作为终身奉行的准则？"老师想了想说："大概是'恕'吧——自己不想要的，不要施加给别人。"',
        question: '这段故事出自哪部古籍？这位老师是谁？',
        options: ['《论语》——孔子', '《孟子》——孟子', '《庄子》——庄子', '《韩非子》——韩非子'],
        answer: 0
      },
      {
        scene: '战国时期，有一位哲学家梦见自己变成了一只蝴蝶，翩翩飞舞，感到非常快乐，完全忘记了自己是庄周。醒来后，他坐在那里发呆：到底是庄周梦见了蝴蝶，还是蝴蝶梦见了庄周呢？',
        question: '这个著名的"蝴蝶梦"出自哪部古籍？',
        options: ['《道德经》', '《庄子·齐物论》', '《列子》', '《楚辞》'],
        answer: 1
      },
      {
        scene: '一位老人骑着青牛向西走去，路过函谷关时，守关的官员拦住他说："您就要隐居了，请务必写一本书留下吧。"于是老人写下了五千字的著作，然后不知所踪。这本书记录了他对"道"的理解。',
        question: '这位老人是谁？他写的书叫什么？',
        options: ['孔子——《论语》', '墨子——《墨子》', '老子——《道德经》', '孙子——《孙子兵法》'],
        answer: 2
      }
    ];

    // ===== Game Logic =====
    function selectMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.game-mode-btn').forEach(b => b.classList.remove('active'));
      event.currentTarget.classList.add('active');
    }

    function startGame() {
      document.getElementById('gameModeSelect').style.display = 'none';
      if (currentMode === 'match') {
        document.getElementById('game-match').classList.add('active');
        loadMatchRound();
      } else if (currentMode === 'fill') {
        document.getElementById('game-fill').classList.add('active');
        loadFillRound();
      } else {
        document.getElementById('game-riddle').classList.add('active');
        loadRiddleRound();
      }
    }

    function backToModeSelect() {
      document.getElementById('gameModeSelect').style.display = 'block';
      document.querySelectorAll('.game-area').forEach(a => a.classList.remove('active'));
    }

    function updateStats() {
      document.getElementById('gameScore').textContent = gameScore;
      document.getElementById('gameLevel').textContent = gameLevel;
      document.getElementById('gameCorrect').textContent = gameCorrect;
    }

    function showScorePopup(score, msg) {
      document.getElementById('popupScore').textContent = '+' + score;
      document.getElementById('popupMsg').textContent = msg;
      document.getElementById('overlay').classList.add('show');
      document.getElementById('scorePopup').classList.add('show');
    }

    function closePopup() {
      document.getElementById('overlay').classList.remove('show');
      document.getElementById('scorePopup').classList.remove('show');
    }

    // Match Game
    function loadMatchRound() {
      const roundIdx = (gameLevel - 1) % matchData.length;
      const data = matchData[roundIdx];
      const container = document.getElementById('matchContainer');
      container.innerHTML = '';
      selectedMatch = null;

      // Shuffle modern sides
      const modernShuffled = data.map((d, i) => ({ text: d.modern, idx: i }));
      for (let i = modernShuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [modernShuffled[i], modernShuffled[j]] = [modernShuffled[j], modernShuffled[i]];
      }

      data.forEach((item, i) => {
        const left = document.createElement('div');
        left.className = 'match-item';
        left.innerHTML = '<span class="item-classical">' + item.classical + '</span>';
        left.dataset.idx = i;
        left.dataset.side = 'left';
        left.onclick = function() { selectMatchItem(this); };
        container.appendChild(left);
      });

      modernShuffled.forEach(item => {
        const right = document.createElement('div');
        right.className = 'match-item';
        right.innerHTML = '<span class="item-modern">' + item.text + '</span>';
        right.dataset.idx = item.idx;
        right.dataset.side = 'right';
        right.onclick = function() { selectMatchItem(this); };
        container.appendChild(right);
      });
    }

    function selectMatchItem(el) {
      if (el.classList.contains('correct')) return;

      if (!selectedMatch) {
        document.querySelectorAll('.match-item.selected').forEach(i => i.classList.remove('selected'));
        el.classList.add('selected');
        selectedMatch = el;
      } else {
        if (selectedMatch.dataset.side === el.dataset.side) {
          selectedMatch.classList.remove('selected');
          el.classList.add('selected');
          selectedMatch = el;
          return;
        }

        if (selectedMatch.dataset.idx === el.dataset.idx) {
          selectedMatch.classList.remove('selected');
          selectedMatch.classList.add('correct');
          el.classList.add('correct');
          selectedMatch = null;
          gameScore += 10;
          gameCorrect++;
          updateStats();

          // Check if all matched
          const allCorrect = document.querySelectorAll('.match-item.correct').length;
          const total = document.querySelectorAll('.match-item').length;
          if (allCorrect === total) {
            gameLevel++;
            updateStats();
            setTimeout(function() {
              showScorePopup(10, '全部配对正确！');
            }, 300);
          }
        } else {
          el.classList.add('wrong');
          selectedMatch.classList.add('wrong');
          const prev = selectedMatch;
          setTimeout(function() {
            el.classList.remove('wrong');
            prev.classList.remove('wrong', 'selected');
          }, 500);
          selectedMatch = null;
        }
      }
    }

    function nextMatchRound() {
      loadMatchRound();
    }

    // Fill Game
    let activeBlank = null;
    function loadFillRound() {
      const roundIdx = (gameLevel - 1) % fillData.length;
      const data = fillData[roundIdx];
      const passage = document.getElementById('fillPassage');
      const options = document.getElementById('fillOptions');

      passage.innerHTML = '<div class="fill-source">' + data.source + '</div><div class="fill-text" id="fillText"></div>';

      const textEl = document.getElementById('fillText');
      textEl.innerHTML = '';

      data.parts.forEach(function(part) {
        if (typeof part === 'string') {
          textEl.appendChild(document.createTextNode(part));
        } else {
          const blank = document.createElement('span');
          blank.className = 'fill-blank';
          blank.textContent = '？';
          blank.dataset.answer = part.blank;
          blank.onclick = function() {
            document.querySelectorAll('.fill-blank.active').forEach(b => b.classList.remove('active'));
            blank.classList.add('active');
            activeBlank = blank;
          };
          textEl.appendChild(blank);
        }
      });

      // Shuffle options
      const opts = data[0].parts.find(p => typeof p === 'object').options.slice();
      for (let i = opts.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [opts[i], opts[j]] = [opts[j], opts[i]];
      }

      options.innerHTML = '';
      opts.forEach(function(opt) {
        const btn = document.createElement('span');
        btn.className = 'fill-option';
        btn.textContent = opt;
        btn.onclick = function() {
          if (!activeBlank) return;
          if (opt === activeBlank.dataset.answer) {
            activeBlank.textContent = opt;
            activeBlank.classList.remove('active');
            activeBlank.classList.add('correct');
            btn.classList.add('used');
            gameScore += 10;
            gameCorrect++;
            updateStats();
            gameLevel++;
            updateStats();
            setTimeout(function() {
              showScorePopup(10, '填空正确！');
            }, 300);
          } else {
            activeBlank.classList.add('wrong');
            setTimeout(function() {
              activeBlank.classList.remove('wrong', 'active');
            }, 500);
          }
          activeBlank = null;
        };
        options.appendChild(btn);
      });

      // Auto-select first blank
      setTimeout(function() {
        const firstBlank = document.querySelector('.fill-blank');
        if (firstBlank) {
          firstBlank.classList.add('active');
          activeBlank = firstBlank;
        }
      }, 100);
    }

    function nextFillRound() {
      loadFillRound();
    }

    // Riddle Game
    let riddleAnswered = false;
    function loadRiddleRound() {
      const roundIdx = (gameLevel - 1) % riddleData.length;
      const data = riddleData[roundIdx];
      riddleAnswered = false;

      document.getElementById('riddleScene').innerHTML =
        '<div class="riddle-label">历史场景</div>' +
        '<div class="riddle-text">' + data.scene + '</div>' +
        '<div class="riddle-question">' + data.question + '</div>';

      const optionsEl = document.getElementById('riddleOptions');
      optionsEl.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D'];
      data.options.forEach(function(opt, i) {
        const div = document.createElement('div');
        div.className = 'riddle-option';
        div.innerHTML = '<span class="opt-letter">' + letters[i] + '</span><span>' + opt + '</span>';
        div.onclick = function() {
          if (riddleAnswered) return;
          riddleAnswered = true;
          if (i === data.answer) {
            div.classList.add('correct');
            gameScore += 15;
            gameCorrect++;
            gameLevel++;
            updateStats();
            setTimeout(function() {
              showScorePopup(15, '解谜成功！');
            }, 400);
          } else {
            div.classList.add('wrong');
            optionsEl.children[data.answer].classList.add('correct');
          }
        };
        optionsEl.appendChild(div);
      });
    }

    function nextRiddleRound() {
      loadRiddleRound();
    }
  </script>

</body>
</html>
