<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>重演</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #121212;
            --bg-card: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #666666;
            --accent: #e85d04;
            --accent-light: #f48c06;
            --accent-dark: #dc2f02;
            --border: #2a2a2a;
            --success: #4ade80;
            --warning: #fbbf24;
            --danger: #f87171;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* 动态背景 */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 20% 20%, rgba(232, 93, 4, 0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 80%, rgba(220, 47, 2, 0.1) 0%, transparent 50%),
                        radial-gradient(ellipse at 50% 50%, rgba(10, 10, 10, 0.9) 0%, var(--bg-primary) 100%);
            pointer-events: none;
            z-index: -1;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: -1;
        }

        /* 页面容器 */
        .page {
            min-height: 100vh;
            padding: 24px;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page.hidden {
            display: none;
        }

        /* 首页 */
        .hero-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .title {
            font-size: 64px;
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--accent-light) 0%, var(--accent) 50%, var(--accent-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 60px rgba(232, 93, 4, 0.3);
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                filter: brightness(1);
            }
            to {
                filter: brightness(1.2);
            }
        }

        .subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            letter-spacing: 2px;
            margin-bottom: 60px;
            font-weight: 300;
        }

        .input-card {
            width: 100%;
            max-width: 500px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            transition: var(--transition);
        }

        .input-card:hover {
            border-color: rgba(232, 93, 4, 0.3);
            box-shadow: 0 20px 80px rgba(232, 93, 4, 0.1);
        }

        .input-label {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: block;
            text-align: left;
        }

        .input-area {
            width: 100%;
            height: 150px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            resize: none;
            outline: none;
            transition: var(--transition);
            line-height: 1.8;
        }

        .input-area:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(232, 93, 4, 0.1);
        }

        .input-area::placeholder {
            color: var(--text-muted);
        }

        .start-btn {
            width: 100%;
            margin-top: 20px;
            padding: 16px 32px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(232, 93, 4, 0.4);
        }

        .start-btn:active {
            transform: translateY(0);
        }

        .start-btn.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .btn-text {
            position: relative;
            z-index: 1;
        }

        /* Loading动画 */
        .loading-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .start-btn.loading .loading-ring {
            opacity: 1;
        }

        .start-btn.loading .btn-text {
            opacity: 0;
        }

        @keyframes spin {
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        /* 重演页面 */
        .replay-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .back-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
        }

        .back-btn:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .progress-bar {
            flex: 1;
            height: 3px;
            background: var(--bg-secondary);
            border-radius: 2px;
            margin: 0 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-light), var(--accent));
            width: 0%;
            transition: width 0.6s ease;
        }

        .scene-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding-bottom: 100px;
        }

        /* 关键瞬间卡片 */
        .moment-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(30px);
            animation: cardFadeIn 0.6s ease forwards;
        }

        @keyframes cardFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .moment-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), transparent);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .moment-card.highlight::before {
            opacity: 1;
        }

        .moment-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .moment-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .moment-time {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .moment-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .moment-content {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.8;
            white-space: pre-wrap;
        }

        /* 逐字浮现效果 */
        .typing-effect {
            overflow: hidden;
            border-right: 2px solid var(--accent);
            animation: typingCursor 1s step-end infinite;
        }

        @keyframes typingCursor {
            0%, 100% {
                border-color: var(--accent);
            }
            50% {
                border-color: transparent;
            }
        }

        /* 选择区域 */
        .choice-section {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, var(--bg-primary) 80%, transparent);
            padding: 40px 24px 30px;
            z-index: 100;
            opacity: 0;
            transform: translateY(100%);
            transition: var(--transition);
        }

        .choice-section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .choice-title {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .choice-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .choice-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px 20px;
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .choice-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, rgba(232, 93, 4, 0.1) 0%, transparent 100%);
            opacity: 0;
            transform: translateX(-100%);
            transition: var(--transition);
        }

        .choice-btn:hover {
            border-color: var(--accent);
            transform: translateX(4px);
            animation: heartbeat 0.6s ease-in-out;
        }

        .choice-btn:hover::before {
            opacity: 1;
            transform: translateX(0);
        }

        .choice-btn:active {
            transform: translateX(2px);
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: translateX(4px);
            }
            25% {
                transform: translateX(6px);
            }
            50% {
                transform: translateX(3px);
            }
            75% {
                transform: translateX(5px);
            }
        }

        .choice-letter {
            display: inline-block;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--bg-secondary);
            color: var(--accent);
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            line-height: 24px;
            margin-right: 12px;
        }

        /* 结局页 */
        .ending-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .ending-icon {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            margin-bottom: 30px;
            animation: iconBreathe 3s ease-in-out infinite;
            box-shadow: 0 0 60px rgba(232, 93, 4, 0.3);
        }

        @keyframes iconBreathe {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 60px rgba(232, 93, 4, 0.3);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 80px rgba(232, 93, 4, 0.5);
            }
        }

        .ending-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .ending-subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 40px;
            max-width: 320px;
        }

        .ending-btn {
            padding: 16px 48px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .ending-btn:hover {
            background: var(--bg-secondary);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-muted);
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* 移动端适配 */
        @media (max-width: 480px) {
            .title {
                font-size: 48px;
            }

            .subtitle {
                font-size: 14px;
                margin-bottom: 40px;
            }

            .input-card {
                padding: 20px;
                border-radius: 16px;
            }

            .input-area {
                height: 120px;
                font-size: 14px;
            }

            .moment-card {
                padding: 20px;
            }

            .moment-title {
                font-size: 16px;
            }

            .moment-content {
                font-size: 14px;
            }

            .choice-section {
                padding: 30px 16px 24px;
            }

            .choice-btn {
                padding: 16px 18px;
                font-size: 14px;
            }

            .ending-icon {
                width: 100px;
                height: 100px;
                font-size: 50px;
            }

            .ending-title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="bg-noise"></div>

    <!-- 首页 -->
    <div id="home-page" class="page">
        <div class="hero-section">
            <h1 class="title">重演</h1>
            <p class="subtitle">如果那一刻，你做了不同的选择</p>
            
            <div class="input-card">
                <label class="input-label">粘贴一段你最想重来的对话</label>
                <textarea id="dialog-input" class="input-area" placeholder="例如：&#10;他：我们分手吧。&#10;你：为什么？&#10;他：我爱上了别人。&#10;你：..."></textarea>
                <button id="start-btn" class="start-btn">
                    <span class="btn-text">开始重演</span>
                    <div class="loading-ring"></div>
                </button>
            </div>
        </div>
        
        <footer>本页面为 TRAE AI 创造力大赛报名创意产物</footer>
    </div>

    <!-- 重演页面 -->
    <div id="replay-page" class="page hidden">
        <div class="replay-header">
            <button id="back-btn" class="back-btn">返回</button>
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <span id="step-indicator" class="moment-time">1/3</span>
        </div>

        <div id="scene-container" class="scene-container"></div>

        <div id="choice-section" class="choice-section">
            <p class="choice-title">你的选择将改变一切</p>
            <div id="choice-grid" class="choice-grid"></div>
        </div>
        
        <footer>本页面为 TRAE AI 创造力大赛报名创意产物</footer>
    </div>

    <!-- 结局页 -->
    <div id="ending-page" class="page hidden">
        <div class="ending-section">
            <div class="ending-icon">✨</div>
            <h2 class="ending-title">你选择了重生路线</h2>
            <p id="ending-text" class="ending-subtitle"></p>
            <button id="restart-btn" class="ending-btn">再次重演</button>
        </div>
        
        <footer>本页面为 TRAE AI 创造力大赛报名创意产物</footer>
    </div>

    <script>
        // 预设剧情数据（模拟AI生成）
        const storyData = {
            default: {
                moments: [
                    {
                        time: "14:32",
                        icon: "💔",
                        title: "决裂的开始",
                        content: "他看着你，眼神中带着决绝。这是你从未见过的他，仿佛面前站着一个陌生人。"
                    },
                    {
                        time: "14:35",
                        icon: "🗡️",
                        title: "致命的坦白",
                        content: "\"我们分手吧。\" 这句话像一把利刃，瞬间刺穿了你所有的防线。你感觉整个世界都在崩塌。"
                    },
                    {
                        time: "14:38",
                        icon: "🌪️",
                        title: "真相的风暴",
                        content: "\"我爱上了别人。\" 他终于说出了那个你最害怕听到的答案。空气凝固，你的心脏停止了跳动。"
                    }
                ],
                choices: [
                    {
                        letter: "A",
                        text: "说出没敢说的话：其实我早就知道了，祝你幸福"
                    },
                    {
                        letter: "B",
                        text: "转身离开：不解释、不追问，体面地退场"
                    },
                    {
                        letter: "C",
                        text: "修改这句话：既然不爱了，为什么不早点说？"
                    }
                ],
                endings: {
                    A: {
                        text: "你选择了释然。在那一刻，你终于放下了心中的执念，也放过了自己。这段感情虽然结束了，但你获得了成长。"
                    },
                    B: {
                        text: "你选择了体面。转身的那一刻，你忍住了所有的眼泪。有些故事注定没有结局，而你选择留下最美的背影。"
                    },
                    C: {
                        text: "你选择了质问。真相往往比谎言更伤人，但你终于得到了一个答案。也许不够完美，但至少不再有遗憾。"
                    }
                }
            }
        };

        // 状态管理
        let currentStory = null;
        let currentStep = 0;
        let userChoice = null;

        // DOM元素
        const homePage = document.getElementById('home-page');
        const replayPage = document.getElementById('replay-page');
        const endingPage = document.getElementById('ending-page');
        const dialogInput = document.getElementById('dialog-input');
        const startBtn = document.getElementById('start-btn');
        const backBtn = document.getElementById('back-btn');
        const sceneContainer = document.getElementById('scene-container');
        const choiceSection = document.getElementById('choice-section');
        const choiceGrid = document.getElementById('choice-grid');
        const progressFill = document.getElementById('progress-fill');
        const stepIndicator = document.getElementById('step-indicator');
        const endingText = document.getElementById('ending-text');
        const restartBtn = document.getElementById('restart-btn');

        // 页面切换
        function showPage(page) {
            [homePage, replayPage, endingPage].forEach(p => p.classList.add('hidden'));
            page.classList.remove('hidden');
            page.style.animation = 'none';
            page.offsetHeight;
            page.style.animation = 'fadeInUp 0.8s ease forwards';
        }

        // 开始重演
        startBtn.addEventListener('click', async () => {
            const dialog = dialogInput.value.trim();
            
            if (!dialog) {
                dialogInput.focus();
                dialogInput.style.borderColor = 'var(--danger)';
                setTimeout(() => {
                    dialogInput.style.borderColor = 'var(--border)';
                }, 2000);
                return;
            }

            // Loading动画
            startBtn.classList.add('loading');
            
            await new Promise(resolve => setTimeout(resolve, 2000));
            
            // 初始化剧情
            currentStory = storyData.default;
            currentStep = 0;
            userChoice = null;
            
            // 清空场景
            sceneContainer.innerHTML = '';
            choiceSection.classList.remove('visible');
            
            // 切换页面
            showPage(replayPage);
            startBtn.classList.remove('loading');
            
            // 开始播放剧情
            playNextMoment();
        });

        // 播放下一个瞬间
        function playNextMoment() {
            if (currentStep >= currentStory.moments.length) {
                showChoices();
                return;
            }

            const moment = currentStory.moments[currentStep];
            
            // 创建卡片
            const card = document.createElement('div');
            card.className = 'moment-card';
            if (currentStep === currentStory.moments.length - 1) {
                card.classList.add('highlight');
            }
            
            card.innerHTML = `
                <div class="moment-header">
                    <div class="moment-icon">${moment.icon}</div>
                    <span class="moment-time">${moment.time}</span>
                </div>
                <h3 class="moment-title">${moment.title}</h3>
                <p class="moment-content"></p>
            `;
            
            sceneContainer.appendChild(card);
            
            // 滚动到底部
            setTimeout(() => {
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
            
            // 逐字浮现
            const contentEl = card.querySelector('.moment-content');
            typeText(contentEl, moment.content, () => {
                currentStep++;
                updateProgress();
                
                // 延迟播放下一个
                setTimeout(playNextMoment, 1500);
            });
        }

        // 逐字打字效果
        function typeText(element, text, callback) {
            let index = 0;
            element.textContent = '';
            
            function type() {
                if (index < text.length) {
                    element.textContent += text[index];
                    index++;
                    setTimeout(type, 40);
                } else {
                    callback();
                }
            }
            
            type();
        }

        // 更新进度条
        function updateProgress() {
            const total = currentStory.moments.length;
            const progress = (currentStep / total) * 100;
            progressFill.style.width = `${progress}%`;
            stepIndicator.textContent = `${currentStep}/${total}`;
        }

        // 显示选择
        function showChoices() {
            choiceGrid.innerHTML = '';
            
            currentStory.choices.forEach((choice, index) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.style.animationDelay = `${index * 0.1}s`;
                btn.innerHTML = `
                    <span class="choice-letter">${choice.letter}</span>
                    ${choice.text}
                `;
                
                btn.addEventListener('click', () => {
                    makeChoice(choice.letter);
                });
                
                choiceGrid.appendChild(btn);
            });
            
            choiceSection.classList.add('visible');
        }

        // 做出选择
        function makeChoice(letter) {
            userChoice = letter;
            
            // 隐藏选择区域
            choiceSection.classList.remove('visible');
            
            // 显示结局
            setTimeout(() => {
                showEnding();
            }, 800);
        }

        // 显示结局
        function showEnding() {
            const ending = currentStory.endings[userChoice];
            endingText.textContent = ending.text;
            showPage(endingPage);
        }

        // 返回首页
        backBtn.addEventListener('click', () => {
            showPage(homePage);
            dialogInput.value = '';
        });

        // 重新开始
        restartBtn.addEventListener('click', () => {
            showPage(homePage);
            dialogInput.value = '';
        });

        // 键盘支持
        dialogInput.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                startBtn.click();
            }
        });
    </script>
</body>
</html>
