<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>美妆保质哨</title>
    <style>
        :root {
            --bg-primary: #fff9fb;
            --bg-card: #ffffff;
            --text-primary: #333333;
            --text-secondary: #7a7a7a;
            --accent: #ff85a2;
            --accent-light: #ffd6e0;
            --border: #f0e6f0;
            --shadow: 0 4px 12px rgba(255, 133, 162, 0.08);
            --radius: 16px;
            --transition: all 0.25s ease;
        }

        .theme-dark {
            --bg-primary: #1e1a25;
            --bg-card: #2d273a;
            --text-primary: #f8f5ff;
            --text-secondary: #b8b0c9;
            --accent: #e9648d;
            --accent-light: #4a3a52;
            --border: #3d3552;
            --shadow: 0 4px 12px rgba(233, 100, 141, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 20px;
            transition: var(--transition);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
            padding-top: 12px;
        }

        h1 {
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, var(--accent), #ff5ca5);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        /* 主视觉区：模拟手机取景框 */
        .camera-frame {
            position: relative;
            width: 100%;
            max-width: 360px;
            height: 240px;
            margin: 0 auto 24px;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 2px solid var(--border);
            background: #f8f5ff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .camera-frame::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, rgba(255,255,255,0.8) 0%, transparent 70%);
            pointer-events: none;
        }

        .camera-icon {
            font-size: 2.8rem;
            opacity: 0.7;
        }

        .sample-bottle {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.05));
        }

        /* 识别结果区 */
        .result-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 22px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .result-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .result-title svg {
            width: 18px;
            height: 18px;
            fill: var(--accent);
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 18px;
        }

        .info-item {
            background: var(--accent-light);
            border-radius: 10px;
            padding: 12px 14px;
            text-align: center;
        }

        .info-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .info-value {
            font-weight: 600;
            font-size: 1.05rem;
        }

        .open-date-section {
            margin-top: 16px;
        }

        .slider-container {
            margin: 16px 0;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #f0e6f0;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(255,133,162,0.3);
        }

        .date-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-top: 4px;
            color: var(--text-secondary);
        }

        /* 提醒状态区 */
        .alert-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .alert-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .alert-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: bold;
        }

        .alert-icon.green { background: #e8f5e9; color: #2e7d32; }
        .alert-icon.yellow { background: #fff8e1; color: #f57c00; }
        .alert-icon.red { background: #ffebee; color: #c62828; }

        .alert-text {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .days-remaining {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 12px 0;
            text-align: center;
        }

        .green { color: #2e7d32; }
        .yellow { color: #f57c00; }
        .red { color: #c62828; }

        .reminder-note {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--border);
        }

        /* 主题切换按钮 */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: white;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 100;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            transform: scale(1.05);
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .camera-frame {
                height: 200px;
            }
            h1 {
                font-size: 1.6rem;
            }
            .info-grid {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 16px;
            }
        }

        @media (max-width: 360px) {
            .camera-frame {
                height: 180px;
            }
        }

        /* 隐藏滚动条（可选） */
        ::-webkit-scrollbar {
            width: 0;
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">☀️</button>

    <div class="container">
        <header>
            <h1>美妆保质哨</h1>
            <p class="subtitle">拍瓶身 · 查保质 · 定提醒</p>
        </header>

        <div class="camera-frame">
            <div class="camera-icon">📷</div>
            <p>点击下方按钮模拟拍摄</p>
        </div>

        <div class="result-card">
            <div class="result-title">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                识别结果
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">产品名称</div>
                    <div class="info-value" id="productName">VC精华液</div>
                </div>
                <div class="info-item">
                    <div class="info-label">保质期</div>
                    <div class="info-value" id="shelfLife">3年</div>
                </div>
                <div class="info-item">
                    <div class="info-label">生产日期</div>
                    <div class="info-value" id="prodDate">2023.08.12</div>
                </div>
                <div class="info-item">
                    <div class="info-label">开封图标</div>
                    <div class="info-value" id="openIcon">12M</div>
                </div>
            </div>

            <div class="open-date-section">
                <div class="slider-label">
                    <span>实际开封日</span>
                    <span id="selectedDate">2024.05.20</span>
                </div>
                <div class="slider-container">
                    <input type="range" min="0" max="365" value="0" id="openSlider">
                </div>
                <div class="date-display">
                    <span>今天</span>
                    <span>1年前</span>
                </div>
            </div>
        </div>

        <div class="alert-card">
            <div class="alert-header">
                <div class="alert-icon green">✓</div>
                <div class="alert-text">您的产品仍在安全使用期内</div>
            </div>
            <div class="days-remaining green" id="daysRemaining">剩余 217 天</div>
            <p class="reminder-note">下次提醒：2025.05.20（开封后12个月）</p>
        </div>
    </div>

    <script>
        // 主题切换
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;

        themeToggle.addEventListener('click', () => {
            if (body.classList.contains('theme-dark')) {
                body.classList.remove('theme-dark');
                themeToggle.innerHTML = '☀️';
            } else {
                body.classList.add('theme-dark');
                themeToggle.innerHTML = '🌙';
            }
        });

        // 模拟拍摄交互
        const cameraFrame = document.querySelector('.camera-frame');
        const sampleImages = [
            '💄', // 口红
            '💧', // 精华
            '🧴'  // 面霜
        ];
        const productNames = ['柔雾唇釉', 'VC精华液', '多效面霜'];
        const shelfLives = ['2年', '3年', '3年'];
        const prodDates = ['2023.10.05', '2023.08.12', '2024.01.18'];
        const openIcons = ['24M', '12M', '6M'];

        cameraFrame.addEventListener('click', () => {
            const idx = Math.floor(Math.random() * 3);
            document.getElementById('productName').textContent = productNames[idx];
            document.getElementById('shelfLife').textContent = shelfLives[idx];
            document.getElementById('prodDate').textContent = prodDates[idx];
            document.getElementById('openIcon').textContent = openIcons[idx];

            // 更新相机框内图标
            cameraFrame.innerHTML = `<span class="sample-bottle">${sampleImages[idx]}</span>`;
            cameraFrame.style.background = '#fdf7ff';

            // 重置滑块并更新日期
            const slider = document.getElementById('openSlider');
            slider.value = 0;
            updateOpenDateAndAlert();
        });

        // 开封日期滑块交互
        const slider = document.getElementById('openSlider');
        const selectedDateEl = document.getElementById('selectedDate');
        const daysRemainingEl = document.getElementById('daysRemaining');
        const alertIcon = document.querySelector('.alert-icon');
        const alertText = document.querySelector('.alert-text');
        const reminderNote = document.querySelector('.reminder-note');

        function updateOpenDateAndAlert() {
            const daysAgo = parseInt(slider.value);
            const today = new Date();
            const openDate = new Date(today);
            openDate.setDate(today.getDate() - daysAgo);

            // 格式化为 YYYY.MM.DD
            const y = openDate.getFullYear();
            const m = String(openDate.getMonth() + 1).padStart(2, '0');
            const d = String(openDate.getDate()).padStart(2, '0');
            selectedDateEl.textContent = `${y}.${m}.${d}`;

            // 计算剩余天数（按12M示例）
            const expiryDate = new Date(openDate);
            expiryDate.setMonth(expiryDate.getMonth() + 12); // 默认按12个月计算

            const diffTime = expiryDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            // 更新显示
            if (diffDays > 30) {
                daysRemainingEl.textContent = `剩余 ${diffDays} 天`;
                daysRemainingEl.className = 'days-remaining green';
                alertIcon.className = 'alert-icon green';
                alertText.textContent = '您的产品仍在安全使用期内';
                alertIcon.textContent = '✓';
                reminderNote.textContent = `下次提醒：${expiryDate.getFullYear()}.${String(expiryDate.getMonth() + 1).padStart(2, '0')}.${String(expiryDate.getDate()).padStart(2, '0')}（开封后12个月）`;
            } else if (diffDays > 0) {
                daysRemainingEl.textContent = `仅剩 ${diffDays} 天`;
                daysRemainingEl.className = 'days-remaining yellow';
                alertIcon.className = 'alert-icon yellow';
                alertText.textContent = '请尽快使用，临近开封有效期';
                alertIcon.textContent = '⚠️';
                reminderNote.textContent = `下次提醒：${expiryDate.getFullYear()}.${String(expiryDate.getMonth() + 1).padStart(2, '0')}.${String(expiryDate.getDate()).padStart(2, '0')}（开封后12个月）`;
            } else {
                daysRemainingEl.textContent = '已过期！';
                daysRemainingEl.className = 'days-remaining red';
                alertIcon.className = 'alert-icon red';
                alertText.textContent = '建议停止使用，避免刺激皮肤';
                alertIcon.textContent = '❗';
                reminderNote.textContent = `已超期 ${Math.abs(diffDays)} 天 —— 请更换新品`;
            }
        }

        slider.addEventListener('input', updateOpenDateAndAlert);
        // 初始化一次
        updateOpenDateAndAlert();
    </script>
</body>
</html>
