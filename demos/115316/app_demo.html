<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>日事清 · 智能学工看板</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f4f7fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .phone-frame {
            max-width: 420px;
            width: 100%;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0,20,40,0.12), 0 0 0 8px #eef2f6;
            overflow: hidden;
            padding: 16px 20px 24px;
            position: relative;
        }
        /* 状态栏 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 4px 0 12px;
            font-size: 12px;
            font-weight: 600;
            color: #1e293b;
        }
        /* 头部 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
        }
        .header h1 span { color: #3b82f6; }
        .header .date {
            font-size: 13px;
            color: #64748b;
            background: #f1f5f9;
            padding: 6px 12px;
            border-radius: 30px;
        }
        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #f8fafc;
            border-radius: 16px;
            padding: 12px 8px;
            text-align: center;
            border: 1px solid #e9eef3;
        }
        .stat-card .num {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.2;
        }
        .stat-card .label {
            font-size: 10px;
            color: #64748b;
            font-weight: 500;
            margin-top: 2px;
        }
        .stat-card .num.green { color: #10b981; }
        .stat-card .num.orange { color: #f59e0b; }
        .stat-card .num.blue { color: #3b82f6; }
        .stat-card .num.red { color: #ef4444; }

        /* 看板双栏 */
        .dashboard-row {
            display: flex;
            gap: 14px;
            margin-bottom: 20px;
        }
        .dashboard-row .col {
            flex: 1;
            background: #f8fafc;
            border-radius: 20px;
            padding: 14px 12px;
            border: 1px solid #e9eef3;
        }
        .col-title {
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }
        .col-title .badge-count {
            background: #e2e8f0;
            border-radius: 30px;
            padding: 0 10px;
            font-size: 11px;
        }

        /* 任务列表 */
        .task-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #eef2f6;
        }
        .task-item:last-child { border-bottom: none; }
        .task-item .checkbox {
            width: 18px;
            height: 18px;
            border-radius: 6px;
            border: 2px solid #cbd5e1;
            background: white;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
            cursor: default;
        }
        .task-item .checkbox.done {
            background: #3b82f6;
            border-color: #3b82f6;
        }
        .task-item .task-info { flex: 1; }
        .task-item .task-info .title {
            font-size: 13px;
            font-weight: 500;
            color: #0f172a;
        }
        .task-item .task-info .meta {
            font-size: 10px;
            color: #94a3b8;
            display: flex;
            gap: 12px;
        }
        .task-item .task-info .title.done-line { text-decoration: line-through; color: #94a3b8; }
        .task-item .tag-ddl {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 30px;
            background: #fee2e2;
            color: #b91c1c;
            white-space: nowrap;
        }
        .task-item .tag-ddl.urgent { background: #fef3c7; color: #b45309; }

        /* 课程/时间线 */
        .schedule-item {
            display: flex;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid #eef2f6;
            align-items: center;
        }
        .schedule-item:last-child { border-bottom: none; }
        .schedule-item .time {
            font-size: 12px;
            font-weight: 600;
            color: #3b82f6;
            min-width: 44px;
        }
        .schedule-item .info .name {
            font-size: 13px;
            font-weight: 500;
            color: #0f172a;
        }
        .schedule-item .info .place {
            font-size: 10px;
            color: #94a3b8;
        }
        .schedule-item .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            margin-left: auto;
        }
        .schedule-item .status-dot.orange { background: #f59e0b; }

        /* 进度条模块 */
        .focus-section {
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
            border-radius: 20px;
            padding: 16px 18px;
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #bfdbfe;
        }
        .focus-section .left .label {
            font-size: 12px;
            color: #1e40af;
            font-weight: 500;
        }
        .focus-section .left .progress-text {
            font-size: 22px;
            font-weight: 700;
            color: #1e3a8a;
        }
        .focus-section .right .btn-focus {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(37,99,235,0.3);
            cursor: default;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .focus-section .right .btn-focus i { font-size: 14px; }

        /* 底部提示 */
        .footer-note {
            margin-top: 18px;
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
        }

        @media (max-width: 420px) {
            .phone-frame { border-radius: 28px; padding: 12px 14px 20px; }
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
            .dashboard-row { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <!-- 状态栏 -->
        <div class="status-bar">
            <span>9:41</span>
            <span><i class="fas fa-signal"></i> <i class="fas fa-wifi"></i> <i class="fas fa-battery-three-quarters"></i></span>
        </div>

        <!-- 头部 -->
        <div class="header">
            <h1>📘 日事<span>清</span></h1>
            <span class="date"><i class="far fa-calendar-alt"></i> 2026.07.12</span>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card"><div class="num blue">8</div><div class="label">待办</div></div>
            <div class="stat-card"><div class="num green">5</div><div class="label">进行中</div></div>
            <div class="stat-card"><div class="num orange">3</div><div class="label">已完成</div></div>
            <div class="stat-card"><div class="num red">2</div><div class="label">紧急</div></div>
        </div>

        <!-- 双栏：任务看板 + 今日课表 -->
        <div class="dashboard-row">
            <!-- 左栏：任务看板 -->
            <div class="col">
                <div class="col-title">
                    <span>📋 任务看板</span>
                    <span class="badge-count">4项</span>
                </div>
                <div class="task-item">
                    <div class="checkbox"></div>
                    <div class="task-info"><div class="title">高数作业 (第三章)</div><div class="meta"><span>📅 7/14截止</span></div></div>
                    <span class="tag-ddl urgent">🔥 2天</span>
                </div>
                <div class="task-item">
                    <div class="checkbox done"><i class="fas fa-check" style="color:white;"></i></div>
                    <div class="task-info"><div class="title done-line">英语论文初稿</div><div class="meta"><span>✅ 已完成</span></div></div>
                </div>
                <div class="task-item">
                    <div class="checkbox"></div>
                    <div class="task-info"><div class="title">项目原型设计</div><div class="meta"><span>📅 7/15截止</span></div></div>
                    <span class="tag-ddl">⏳ 3天</span>
                </div>
                <div class="task-item">
                    <div class="checkbox"></div>
                    <div class="task-info"><div class="title">周报整理</div><div class="meta"><span>📅 今日 18:00</span></div></div>
                    <span class="tag-ddl urgent">⚠️ 今日</span>
                </div>
            </div>

            <!-- 右栏：今日课表/计划 -->
            <div class="col">
                <div class="col-title">
                    <span>📖 今日计划</span>
                    <span class="badge-count">3节</span>
                </div>
                <div class="schedule-item">
                    <span class="time">09:00</span>
                    <div class="info"><div class="name">机器学习 · 周教授</div><div class="place">三教 201</div></div>
                    <span class="status-dot"></span>
                </div>
                <div class="schedule-item">
                    <span class="time">14:00</span>
                    <div class="info"><div class="name">项目组会</div><div class="place">线上 · 腾讯会议</div></div>
                    <span class="status-dot orange"></span>
                </div>
                <div class="schedule-item">
                    <span class="time">16:30</span>
                    <div class="info"><div class="name">英语听力练习</div><div class="place">图书馆 4F</div></div>
                    <span class="status-dot"></span>
                </div>
                <!-- 额外小提示 -->
                <div style="margin-top:12px; background:#eef2ff; border-radius:12px; padding:8px 12px; font-size:12px; color:#4338ca;">
                    <i class="fas fa-lightbulb"></i> 下一项任务：14:00 组会汇报
                </div>
            </div>
        </div>

        <!-- 专注进度条 / 番茄钟 -->
        <div class="focus-section">
            <div class="left">
                <div class="label">📌 今日专注时长</div>
                <div class="progress-text">2.5h / 4h</div>
                <div style="width:100%; height:6px; background:#bfdbfe; border-radius:10px; margin-top:4px;">
                    <div style="width:62%; height:6px; background:#2563eb; border-radius:10px;"></div>
                </div>
            </div>
            <div class="right">
                <button class="btn-focus"><i class="fas fa-play"></i> 专注</button>
            </div>
        </div>

        <!-- 底部小贴士 -->
        <div class="footer-note">
            <i class="fas fa-robot"></i> 智能提醒：高数作业距离截止仅剩 2 天，建议优先处理。
        </div>
    </div>
    <!-- 微交互：点击卡片无实际效果，仅静态演示 -->
</body>
</html>
