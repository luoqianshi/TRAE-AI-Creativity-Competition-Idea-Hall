<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<script>
const { ipcRenderer } = require('electron');
const path = require('path');
const fs = require('fs');

let soundPath;
try {
    soundPath = path.join(process.resourcesPath, 'sound', 'bo.mp3');
    if (!fs.existsSync(soundPath)) {
        soundPath = path.join(__dirname, '..', 'sound', 'bo.mp3');
    }
} catch(e) {
    soundPath = path.join(__dirname, '..', 'sound', 'bo.mp3');
}

const fileUrl = 'file:///' + soundPath.replace(/\\/g, '/');
const audio = new Audio(fileUrl);
audio.volume = 0.6;
audio.preload = 'auto';

ipcRenderer.on('play-start-sound', () => {
    try {
        audio.currentTime = 0;
        audio.play().catch(() => {});
    } catch(e) {}
});
</script>
</body>
</html>
