<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XiaoZhi Expanded</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            margin: 0; padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden; user-select: none;
            background: transparent;
        }
        .expanded-mode {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .mic-container {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(50, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }
        .mic-icon {
            width: 35px;
            height: 45px;
            position: absolute;
            z-index: 2;
            filter: blur(1.25px);
            opacity: 0.6;
            top: 8px;
        }
        .mic-icon svg {
            width: 100%;
            height: 100%;
            fill: rgba(255, 255, 255, 0.6);
            stroke: none;
        }
        .waves-container {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            z-index: 2;
            top: 50%;
            transform: translateY(-50%);
        }
        .wave-bar {
            width: 4px;
            height: 16px;
            background: #ff6b6b;
            border-radius: 2px;
            transition: transform 0.02s ease;
            transform-origin: center center;
        }
        .wave-bar:nth-child(1) { height: 16px; }
        .wave-bar:nth-child(2) { height: 24px; }
        .wave-bar:nth-child(3) { height: 32px; }
        .wave-bar:nth-child(4) { height: 24px; }
        .wave-bar:nth-child(5) { height: 16px; }
        .processing-text {
            display: none;
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 5;
        }
        .processing-text.show { display: flex; }
        .processing-label {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.9);
            position: relative;
            z-index: 2;
        }

        @keyframes rippleExpand {
            0% {
                transform: translate(-50%, -50%) scale(0.3);
                opacity: 0.9;
            }
            100% {
                transform: translate(-50%, -50%) scale(8);
                opacity: 0;
            }
        }

        @keyframes pulseScale {
            0%, 100% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 0.2;
            }
            50% {
                transform: translate(-50%, -50%) scale(3);
                opacity: 0.6;
            }
        }

        @keyframes ringRotate {
            0% {
                transform: translate(-50%, -50%) rotate(0deg) scale(1);
                opacity: 0.8;
            }
            100% {
                transform: translate(-50%, -50%) rotate(360deg) scale(2);
                opacity: 0.2;
            }
        }

        @keyframes waveFloat {
            0%, 100% {
                transform: translate(-50%, -50%) scaleY(0.5) scaleX(1);
                opacity: 0.6;
            }
            50% {
                transform: translate(-50%, -50%) scaleY(1.2) scaleX(0.8);
                opacity: 0.9;
            }
        }

        .anim-ripple .ring {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid rgba(255, 107, 107, 0.7);
        }
        .anim-ripple .ring:nth-child(1) { animation: rippleExpand 1.8s ease-out infinite; }
        .anim-ripple .ring:nth-child(2) { animation: rippleExpand 1.8s ease-out infinite 0.6s; }
        .anim-ripple .ring:nth-child(3) { animation: rippleExpand 1.8s ease-out infinite 1.2s; }
        .anim-ripple .processing-label { animation: processingGlow 2s ease-in-out infinite; }

        .anim-pulse .ring {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(255, 107, 107, 0.5);
        }
        .anim-pulse .ring:nth-child(1) { animation: pulseScale 1.2s ease-in-out infinite; }
        .anim-pulse .ring:nth-child(2) { animation: pulseScale 1.2s ease-in-out infinite 0.4s; }
        .anim-pulse .ring:nth-child(3) { animation: pulseScale 1.2s ease-in-out infinite 0.8s; }
        .anim-pulse .processing-label { animation: pulseLabel 1.2s ease-in-out infinite; }

        .mic-container:has(.processing-text.anim-pulse.show) .mic-icon {
            filter: blur(0px);
            opacity: 0.9;
        }
        .mic-container:has(.processing-text.anim-pulse.show) .waves-container {
            display: none;
        }

        .anim-rotate .ring {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid rgba(255, 107, 107, 0.6);
            border-top-color: transparent;
        }
        .anim-rotate .ring:nth-child(1) { animation: ringRotate 1.5s linear infinite; }
        .anim-rotate .ring:nth-child(2) { animation: ringRotate 1.5s linear infinite 0.5s; width: 45px; height: 45px; }
        .anim-rotate .ring:nth-child(3) { animation: ringRotate 1.5s linear infinite 1s; width: 60px; height: 60px; }
        .anim-rotate .processing-label { animation: processingGlow 1.5s ease-in-out infinite; }

        .anim-wave .wave-bar {
            position: absolute;
            width: 4px;
            height: 20px;
            background: rgba(255, 107, 107, 0.7);
            border-radius: 2px;
        }
        .anim-wave .wave-bar:nth-child(1) { left: 30%; animation: waveFloat 0.8s ease-in-out infinite; }
        .anim-wave .wave-bar:nth-child(2) { left: 40%; animation: waveFloat 0.8s ease-in-out infinite 0.15s; }
        .anim-wave .wave-bar:nth-child(3) { left: 50%; animation: waveFloat 0.8s ease-in-out infinite 0.3s; }
        .anim-wave .wave-bar:nth-child(4) { left: 60%; animation: waveFloat 0.8s ease-in-out infinite 0.45s; }
        .anim-wave .wave-bar:nth-child(5) { left: 70%; animation: waveFloat 0.8s ease-in-out infinite 0.6s; }
        .anim-wave .processing-label { animation: waveLabel 0.8s ease-in-out infinite; }

        @keyframes processingGlow {
            0%, 100% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        @keyframes pulseLabel {
            0%, 100% { transform: scale(0.85); }
            50% { transform: scale(1.15); }
        }

        @keyframes waveLabel {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
    </style>
</head>
<body>
    <div class="expanded-mode">
        <div class="mic-container" id="micContainer">
            <div class="mic-icon">
                <svg viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg">
                    <path d="M511.752 70.5c-86.605 0-156.835 69.734-156.835 155.747l0 273.812c0 86.013 70.23 155.748 156.835 155.748 86.602 0 156.832-69.735 156.832-155.748L668.584 226.247C668.584 140.234 598.354 70.5 511.752 70.5L511.752 70.5 511.752 70.5zM243.854 461.102c-18.051 0-32.649 14.496-32.649 32.451 0 2.269 0.197 4.436 0.689 6.506l-0.689 0c0 151.605 113.922 276.578 261.386 295.713l0 80.687-52.275 0c-21.702 0-39.257 17.458-39.257 38.964 0 21.499 17.555 38.957 39.257 38.957l182.969 0c21.701 0 39.256-17.458 39.256-38.957 0-21.506-17.555-38.964-39.256-38.964L551.01 876.459l0-80.687c143.119-18.543 254.383-137.002 260.691-282.688 0.396-2.072 0.695-4.243 0.695-6.512 0-0.79-0.197-1.479-0.197-2.167 0-1.483 0.197-2.86 0.197-4.345l-0.695 0c-3.058-14.795-16.172-25.94-32.057-25.94-15.782 0-28.999 11.145-32.057 25.94l-0.688 0c0 129.019-105.344 233.572-235.249 233.572-129.903 0-235.249-104.554-235.249-233.572l-0.689 0c0.396-2.07 0.689-4.237 0.689-6.506C276.503 475.598 261.906 461.102 243.854 461.102L243.854 461.102 243.854 461.102zM243.854 461.102"></path>
                </svg>
            </div>
            <div class="waves-container" id="wavesContainer">
                <div class="wave-bar" data-index="0"></div>
                <div class="wave-bar" data-index="1"></div>
                <div class="wave-bar" data-index="2"></div>
                <div class="wave-bar" data-index="3"></div>
                <div class="wave-bar" data-index="4"></div>
            </div>
            <div class="processing-text anim-pulse" id="processingText">
                <div class="ring"></div>
                <div class="ring"></div>
                <div class="ring"></div>
            </div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        const micContainer = document.getElementById('micContainer');
        const processingText = document.getElementById('processingText');
        const wavesContainer = document.getElementById('wavesContainer');
        const waveBars = wavesContainer.querySelectorAll('.wave-bar');

        let isVisualizing = false;
        let vizAnimFrame = null;
        let audioContext = null;
        let analyser = null;
        let dataArray = null;
        let micStream = null;

        const baseHeights = [16, 24, 32, 24, 16];

        function resetWaves() {
            waveBars.forEach((bar, i) => {
                bar.style.transform = 'scaleY(0.5)';
            });
        }

        async function startVisualization() {
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(micStream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = 0.6;
                source.connect(analyser);

                dataArray = new Float32Array(analyser.frequencyBinCount);
                isVisualizing = true;
                animate();
            } catch (e) {
                console.error('麦克风获取失败:', e);
            }
        }

        function stopVisualization() {
            isVisualizing = false;
            if (vizAnimFrame) {
                cancelAnimationFrame(vizAnimFrame);
                vizAnimFrame = null;
            }
            if (audioContext) {
                audioContext.close().catch(() => {});
                audioContext = null;
            }
            if (micStream) {
                micStream.getTracks().forEach(t => t.stop());
                micStream = null;
            }
            analyser = null;
            dataArray = null;
            resetWaves();
        }

        let smoothedVolume = 0;
        let lastVolumes = [];

        function animate() {
            if (!isVisualizing) return;

            vizAnimFrame = requestAnimationFrame(animate);

            if (!analyser || !dataArray) return;
            
            analyser.getFloatTimeDomainData(dataArray);
            
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i] * dataArray[i];
            }
            const rms = Math.sqrt(sum / dataArray.length);
            let rawVolume = Math.min(rms * 12, 1);
            
            lastVolumes.push(rawVolume);
            if (lastVolumes.length > 4) {
                lastVolumes.shift();
            }
            const avgVolume = lastVolumes.reduce((a, b) => a + b, 0) / lastVolumes.length;
            smoothedVolume = smoothedVolume * 0.5 + avgVolume * 0.5;
            
            const isSilent = smoothedVolume < 0.08;

            waveBars.forEach((bar, i) => {
                if (isSilent) {
                    const time = Date.now() / 200;
                    const tinyWave = Math.sin(time + i * 2) * 0.12;
                    bar.style.transform = `scaleY(${0.4 + tinyWave})`;
                } else {
                    const time = Date.now() / 60;
                    const waveOffset = Math.sin(time + i * 1) * 0.35;
                    const targetScale = 0.4 + smoothedVolume * 0.9 + waveOffset;
                    const scale = Math.max(0.3, Math.min(1.5, targetScale));
                    bar.style.transform = `scaleY(${scale})`;
                }
                bar.style.height = `${baseHeights[i]}px`;
            });
        }

        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let mouseDownTime = 0;
        const DRAG_THRESHOLD = 5;

        micContainer.addEventListener('mousedown', (e) => {
            e.preventDefault();
            isDragging = false;
            dragStartX = e.screenX;
            dragStartY = e.screenY;
            mouseDownTime = Date.now();
            ipcRenderer.send('expanded-start-drag');
        });

        document.addEventListener('mousemove', (e) => {
            if (dragStartX === 0 && dragStartY === 0) return;
            const dx = e.screenX - dragStartX;
            const dy = e.screenY - dragStartY;
            if (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD) {
                isDragging = true;
            }
        });

        document.addEventListener('mouseup', (e) => {
            ipcRenderer.send('expanded-end-drag');
            if (!isDragging && (Date.now() - mouseDownTime) < 500) {
                ipcRenderer.send('expanded-stop-clicked');
            }
            isDragging = false;
            dragStartX = 0;
            dragStartY = 0;
        });

        document.addEventListener('contextmenu', (e) => { e.preventDefault(); });

        ipcRenderer.on('start-viz', () => {
            micContainer.classList.remove('processing');
            processingText.classList.remove('show');
            startVisualization();
        });

        ipcRenderer.on('stop-viz', () => {
            stopVisualization();
        });

        const animationTypes = ['anim-ripple', 'anim-pulse', 'anim-rotate', 'anim-wave'];
        let currentAnimIndex = 0;

        function setAnimationType(index) {
            currentAnimIndex = index;
            animationTypes.forEach((anim, i) => {
                processingText.classList.remove(anim);
            });
            processingText.classList.add(animationTypes[index]);
        }

        ipcRenderer.on('show-processing', () => {
            stopVisualization();
            processingText.classList.add('show');
        });

        ipcRenderer.on('set-animation', (event, type) => {
            if (typeof type === 'number' && type >= 0 && type < animationTypes.length) {
                setAnimationType(type);
            }
        });

        ipcRenderer.on('reset-waves', () => {
            stopVisualization();
            resetWaves();
        });

        waveBars.forEach((bar, i) => {
            bar.style.height = `${baseHeights[i]}px`;
            bar.style.transform = 'scaleY(0.5)';
        });
    </script>
</body>
</html>
