<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>话筒样式选择</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            color: white;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            color: rgba(255,255,255,0.7);
            margin-bottom: 40px;
            font-size: 14px;
        }
        .styles-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            max-width: 900px;
        }
        .style-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .style-card:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-5px);
        }
        .style-card.selected {
            border: 2px solid #ff6b6b;
            background: rgba(255,107,107,0.1);
        }
        .mic-wrapper {
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 20px;
        }
        .style-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            text-align: center;
        }
        .style-desc {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            text-align: center;
            line-height: 1.5;
        }
        .mic {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 4px 20px rgba(255, 107, 107, 0.4);
        }
        .mic svg {
            width: 30px;
            height: 40px;
            fill: none;
            stroke: white;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Style 1: 缩放呼吸 */
        .style1 .mic {
            animation: style1-breathe 2s ease-in-out infinite;
        }
        @keyframes style1-breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        /* Style 2: 声波环 */
        .style2 .ripple {
            position: absolute;
            border-radius: 50%;
            border: 2px solid #ff6b6b;
            animation: style2-ripple 2s ease-out infinite;
        }
        .style2 .ripple:nth-child(1) { animation-delay: 0s; }
        .style2 .ripple:nth-child(2) { animation-delay: 0.6s; }
        .style2 .ripple:nth-child(3) { animation-delay: 1.2s; }
        @keyframes style2-ripple {
            0% { width: 60px; height: 60px; opacity: 0.8; }
            100% { width: 120px; height: 120px; opacity: 0; }
        }

        /* Style 3: 声波线 */
        .style3 .waves {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .style3 .wave-bar {
            width: 4px;
            background: #ff6b6b;
            border-radius: 2px;
            animation: style3-wave 0.6s ease-in-out infinite;
        }
        .style3 .wave-bar:nth-child(1) { height: 12px; animation-delay: 0s; }
        .style3 .wave-bar:nth-child(2) { height: 18px; animation-delay: 0.1s; }
        .style3 .wave-bar:nth-child(3) { height: 24px; animation-delay: 0.2s; }
        .style3 .wave-bar:nth-child(4) { height: 18px; animation-delay: 0.3s; }
        .style3 .wave-bar:nth-child(5) { height: 12px; animation-delay: 0.4s; }
        @keyframes style3-wave {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1); }
        }

        /* Style 4: 脉冲发光 */
        .style4 .mic {
            animation: style4-pulse 1.5s ease-in-out infinite;
        }
        @keyframes style4-pulse {
            0%, 100% {
                box-shadow: 0 4px 20px rgba(255, 107, 107, 0.4),
                            0 0 0 0 rgba(255, 107, 107, 0.4);
            }
            50% {
                box-shadow: 0 4px 20px rgba(255, 107, 107, 0.4),
                            0 0 0 15px rgba(255, 107, 107, 0);
            }
        }

        /* Style 5: 旋转缩放 */
        .style5 .mic {
            animation: style5-rotate 3s ease-in-out infinite;
        }
        @keyframes style5-rotate {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.1) rotate(5deg); }
            75% { transform: scale(1.1) rotate(-5deg); }
        }

        /* Style 6: 心跳闪烁 */
        .style6 .mic {
            animation: style6-heartbeat 1s ease-in-out infinite;
        }
        @keyframes style6-heartbeat {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.1); }
            70% { transform: scale(1); }
        }

        .controls {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .volume-slider {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .volume-slider label {
            font-size: 14px;
        }
        input[type="range"] {
            width: 150px;
            cursor: pointer;
        }
        .selected-info {
            margin-top: 20px;
            font-size: 14px;
            color: #ff6b6b;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <h1>🎤 话筒样式选择</h1>
    <p class="subtitle">点击卡片选择你喜欢的样式，拖动滑块测试音量效果</p>

    <div class="styles-container">
        <!-- Style 1 -->
        <div class="style-card" data-style="1" onclick="selectStyle(1)">
            <div class="mic-wrapper style1">
                <div class="mic">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </div>
            </div>
            <div class="style-name">缩放呼吸</div>
            <div class="style-desc">话筒整体缩放的呼吸效果</div>
        </div>

        <!-- Style 2 -->
        <div class="style-card" data-style="2" onclick="selectStyle(2)">
            <div class="mic-wrapper style2">
                <div class="ripple"></div>
                <div class="ripple"></div>
                <div class="ripple"></div>
                <div class="mic">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </div>
            </div>
            <div class="style-name">波纹扩散</div>
            <div class="style-desc">三层圆圈向外扩散的效果</div>
        </div>

        <!-- Style 3 -->
        <div class="style-card" data-style="3" onclick="selectStyle(3)">
            <div class="mic-wrapper style3">
                <div class="mic" style="opacity: 0.3;">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </div>
                <div class="waves">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                </div>
            </div>
            <div class="style-name">声波跳动</div>
            <div class="style-desc">左右声波柱上下跳动</div>
        </div>

        <!-- Style 4 -->
        <div class="style-card" data-style="4" onclick="selectStyle(4)">
            <div class="mic-wrapper style4">
                <div class="mic">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </div>
            </div>
            <div class="style-name">脉冲发光</div>
            <div class="style-desc">向外脉冲式发光效果</div>
        </div>

        <!-- Style 5 -->
        <div class="style-card" data-style="5" onclick="selectStyle(5)">
            <div class="mic-wrapper style5">
                <div class="mic">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </div>
            </div>
            <div class="style-name">左右摇摆</div>
            <div class="style-desc">轻微左右旋转的效果</div>
        </div>

        <!-- Style 6 -->
        <div class="style-card" data-style="6" onclick="selectStyle(6)">
            <div class="mic-wrapper style6">
                <div class="mic">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </div>
            </div>
            <div class="style-name">心跳闪烁</div>
            <div class="style-desc">类似心跳的节奏闪烁</div>
        </div>
    </div>

    <div class="controls">
        <div class="volume-slider">
            <label>音量模拟：</label>
            <input type="range" id="volumeSlider" min="0" max="100" value="50">
        </div>
    </div>

    <div class="selected-info" id="selectedInfo">点击卡片选择样式</div>

    <script>
        let selectedStyle = null;

        function selectStyle(styleNum) {
            selectedStyle = styleNum;
            document.querySelectorAll('.style-card').forEach(card => {
                card.classList.remove('selected');
            });
            document.querySelector(`[data-style="${styleNum}"]`).classList.add('selected');
            document.getElementById('selectedInfo').textContent = `已选择：${getStyleName(styleNum)}`;
        }

        function getStyleName(num) {
            const names = {
                1: '缩放呼吸',
                2: '波纹扩散',
                3: '声波跳动',
                4: '脉冲发光',
                5: '左右摇摆',
                6: '心跳闪烁'
            };
            return names[num];
        }

        // 音量滑块控制动画速度
        const volumeSlider = document.getElementById('volumeSlider');
        volumeSlider.addEventListener('input', (e) => {
            const volume = e.target.value;
            const speed = 3 - (volume / 50); // 音量越大，速度越快
            
            document.querySelectorAll('.style1 .mic').forEach(el => {
                el.style.animationDuration = `${speed}s`;
            });
            document.querySelectorAll('.style2 .ripple').forEach(el => {
                el.style.animationDuration = `${speed}s`;
            });
            document.querySelectorAll('.style3 .wave-bar').forEach(el => {
                el.style.animationDuration = `${speed * 0.3}s`;
            });
            document.querySelectorAll('.style4 .mic').forEach(el => {
                el.style.animationDuration = `${speed * 0.75}s`;
            });
            document.querySelectorAll('.style5 .mic').forEach(el => {
                el.style.animationDuration = `${speed * 1.5}s`;
            });
            document.querySelectorAll('.style6 .mic').forEach(el => {
                el.style.animationDuration = `${speed * 0.5}s`;
            });
        });
    </script>
</body>
</html>
