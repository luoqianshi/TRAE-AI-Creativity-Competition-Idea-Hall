<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XiaoZhi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; user-select: none; background: transparent; }

        .floating-mode {
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            width: 80px; height: 80px;
        }
        .mic-btn {
            width: 60px; height: 60px;
            border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s;
            box-shadow: none;
            background: transparent;
        }
        .mic-btn:hover { transform: scale(1.1); }
        .mic-btn.recording {
            animation: pulse 1.2s ease-in-out infinite;
        }
        .mic-btn img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }
        @keyframes pulse {
            0%,100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .expanded-mode {
            display: none;
        }

    </style>
</head>
<body>
    <div class="floating-mode" id="floatingMode">
        <button class="mic-btn" id="floatingMicBtn" title="点击开始语音输入">
            <img src="../image/xiaozhi256.png" alt="XiaoZhi Icon">
        </button>
    </div>

    <script>
        const CONFIG = {
            apiKey: 'agent-fcc4413ad249f30f549d61c6a3d0488b',
            proxyUrl: 'http://localhost:28517/proxy',
            silenceThreshold: 0.03,
            silenceTimeout: 3000,
            pauseSilenceThreshold: 0.04,
            segmentMinDuration: 1500,
            segmentMaxDuration: 5000,
            pauseThreshold: 200,
            // WebSocket 流式语音识别配置（已禁用，使用 HTTP 模式）
            wsAsrUrl: 'ws://172.16.99.103:8765',
            useWebSocketAsr: false
        };

        let featureMode = 'ai-input';
        let autoInputEnabled = true; // 当前功能模式的自动输入状态
        let ttsEnabled = false;
        let ttsPlaying = false;
        let currentUserInfo = null; // { user_name, username(工号) }

        // 获取登录用户信息
        async function loadUserInfo() {
            try {
                const info = await window.electronAPI.getUserInfo();
                if (info) {
                    currentUserInfo = info;
                    console.log('[用户] 已获取用户信息:', info.user_name, info.username);
                } else {
                    currentUserInfo = null;
                }
            } catch(e) {
                currentUserInfo = null;
                console.log('[用户] 未登录或获取用户信息失败');
            }
        }
        loadUserInfo();

        // 监听登录/退出事件，刷新用户信息
        window.electronAPI.onUserLoggedIn && window.electronAPI.onUserLoggedIn(() => { loadUserInfo(); });
        window.electronAPI.onUserLoggedOut && window.electronAPI.onUserLoggedOut(() => { currentUserInfo = null; });

        const $ = id => document.getElementById(id);

        const floatingMode = $('floatingMode');
        const floatingMicBtn = $('floatingMicBtn');

        let isRecording = false;
        let isExpanded = false;
        let isProcessing = false;
        let isAiActive = false; // AI 预览框或 TTS 播放正在进行
        let hotkeyMode = false;
        let clickMode = false;
        let previewInputActive = false; // 预览框输入模式标志，阻止录音结果提交
        let chatId = null;
        let chatIdCreatedAt = 0;
        let chatIdLastUsedAt = 0;
        const SESSION_MAX_IDLE_MS = 30 * 60 * 1000;
        let mediaRecorder = null;
        let currentStream = null;
        let segmentIndex = 0;
        let segmentResults = {};
        let pendingSegments = 0;
        let allRecordingDone = false;
        let segmentTimer = null;
        let segmentStartTime = 0;
        let pauseStartTime = null;
        let audioContext = null;
        let analyser = null;
        let silenceCheckInterval = null;
        let hasSpeech = false;
        let focusInfo = { hwndFocus: 0, hwndActive: 0 };
        let fullResponseText = '';
        let previewText = '';
        let previewVisible = false;

        // WebSocket 流式识别相关变量
        let ws = null;
        let wsAudioContext = null;
        let processor = null;
        let wsAudioBuffer = [];
        let recognizedText = '';

        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let mouseDownTime = 0;
        const DRAG_THRESHOLD = 5;

        async function setClickThrough(enabled) {
            await window.electronAPI.setIgnoreMouseEvents(enabled);
        }

        function lockTarget() {
            if (focusInfo && focusInfo.hwndActive) {
                fetch(`${CONFIG.proxyUrl}/lock-target`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(focusInfo)
                }).catch(() => {});
            }
        }

        function unlockAndActivateTarget() {
            if (focusInfo && focusInfo.hwndActive) {
                fetch(`${CONFIG.proxyUrl}/activate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(focusInfo)
                }).catch(() => {});
            }
            fetch(`${CONFIG.proxyUrl}/unlock-target`, { method: 'POST' }).catch(() => {});
        }

        document.addEventListener('DOMContentLoaded', () => {
            floatingMicBtn.addEventListener('mousedown', onMicMouseDown);
            document.addEventListener('mousemove', onMicMouseMove);
            document.addEventListener('mouseup', onMicMouseUp);

            // 禁用默认右键菜单
            floatingMicBtn.addEventListener('contextmenu', (e) => { e.preventDefault(); });
            document.addEventListener('contextmenu', (e) => { e.preventDefault(); });
            
            floatingMicBtn.addEventListener('mouseenter', () => {
                fetch(`${CONFIG.proxyUrl}/capture`, { method: 'POST' })
                    .then(r => r.json())
                    .then(data => {
                        if (data.code === 200 && data.data) {
                            focusInfo = data.data;
                            window.electronAPI.saveFocusInfo(focusInfo);
                        }
                    })
                    .catch(() => {});
                setClickThrough(false);
            });
            floatingMicBtn.addEventListener('mouseleave', () => {
                if (!isExpanded) {
                    setClickThrough(true);
                }
            });
            
            setClickThrough(true);
            
            createChatSession();

            window.electronAPI.onFeatureModeChanged((mode) => {
                featureMode = mode;
                // 切换功能模式时，同步更新自动输入状态
                window.electronAPI.getAutoInputEnabled(mode).then((enabled) => {
                    autoInputEnabled = enabled;
                });
                chatId = null;
                createChatSession();
            });

            window.electronAPI.getTtsEnabled().then((enabled) => {
                ttsEnabled = enabled;
            });

            window.electronAPI.onTtsEnabledChanged((enabled) => {
                ttsEnabled = enabled;
            });

            // 初始化自动输入状态
            window.electronAPI.getAutoInputEnabled(featureMode).then((enabled) => {
                autoInputEnabled = enabled;
            });

            window.electronAPI.onAutoInputChanged((mode, enabled) => {
                if (mode === featureMode) {
                    autoInputEnabled = enabled;
                }
            });

            window.electronAPI.onTtsFinished(() => {
                ttsPlaying = false;
                isAiActive = false;
                isExpanded = false;
                // 如果正在录音，不显示悬浮球（录音流程会自行管理窗口状态）
                if (!isRecording) {
                    floatingMode.style.display = 'flex';
                }
            });

            window.electronAPI.onAiPreviewClosed(() => {
                isExpanded = false;
                isAiActive = false;
                floatingMode.style.display = 'flex';
            });

            window.electronAPI.onHotkeyStart((capturedFocus) => {
                if (isRecording) {
                    // 快捷键再次按下：停止录音
                    console.log('[快捷键] 录音中再次按下快捷键，停止录音');
                    stopRecording();
                } else if (isAiActive || isProcessing) {
                    // AI 预览框显示中或 TTS 播放中，先关闭再开始新录音
                    console.log('[快捷键] AI 预览/TTS 播放中，关闭后开始新录音');
                    try { window.electronAPI.forceStopTts(); } catch(e) {}
                    isAiActive = false;
                    ttsPlaying = false;
                    isProcessing = false;
                    isExpanded = false;
                    hotkeyMode = false;
                    clickMode = false;
                    fullResponseText = '';
                    startHotkeyRecording(capturedFocus);
                } else {
                    startHotkeyRecording(capturedFocus);
                }
            });
            window.electronAPI.onHotkeyShortUp(() => {
                hotkeyMode = false;
            });
            window.electronAPI.onHotkeyLong(() => {
                hotkeyMode = true;
            });
            window.electronAPI.onHotkeyStop(() => {
                // 长按松开停止录音
                if (isRecording && hotkeyMode) {
                    console.log('[快捷键] 长按松开，停止录音');
                    stopRecording();
                }
            });
            window.electronAPI.onStopFromExpanded(() => {
                if (isRecording) {
                    manualStop();
                }
            });

            // 预览框点击 → 停止录音，切换到输入模式
            window.electronAPI.onPreviewClicked(async () => {
                if (!isRecording) return;
                console.log('[预览] 用户点击预览框，停止录音并切换到输入模式');

                // 设置标志，阻止录音识别结果被 processAllResults 提交
                previewInputActive = true;

                // 先获取已识别的文本（仅用于预览框显示，不提交）
                let currentText = '';
                if (CONFIG.useWebSocketAsr && recognizedText && recognizedText.trim()) {
                    currentText = recognizedText;
                } else if (previewText && previewText.trim()) {
                    currentText = previewText;
                }

                // 如果文本是"正在聆听..."，清空，让用户从头输入
                if (currentText === '正在聆听...' || currentText === '正在聆听') {
                    currentText = '';
                }

                // 立即停止录音，清空识别结果
                isRecording = false;
                isProcessing = false;
                allRecordingDone = true;
                clickMode = false;
                previewText = '';
                recognizedText = '';
                segmentResults = {};
                pendingSegments = 0;

                if (segmentTimer) {
                    clearTimeout(segmentTimer);
                    segmentTimer = null;
                }

                floatingMicBtn.classList.remove('recording');
                stopSilenceDetection();

                // 停止音频流
                if (CONFIG.useWebSocketAsr && ws) {
                    if (wsAudioBuffer && wsAudioBuffer.length > 100) {
                        try { sendAudioChunk(wsAudioBuffer); } catch (e) {}
                    }
                    wsAudioBuffer = [];
                    if (wsAudioContext) {
                        wsAudioContext.close().catch(() => {});
                        wsAudioContext = null;
                    }
                    setTimeout(() => {
                        if (ws) { try { ws.close(); } catch (e) {} ws = null; }
                    }, 200);
                } else if (mediaRecorder) {
                    mediaRecorder.stop();
                }

                if (currentStream) {
                    currentStream.getTracks().forEach(t => t.stop());
                    currentStream = null;
                }

                // 通知预览框切换到输入模式
                await window.electronAPI.switchToInputMode({ text: currentText });
            });

            // 预览框提交文本 → 发送输入框的文本和文件给 AI
            window.electronAPI.onPreviewSubmit(async (data) => {
                // 兼容旧格式（纯文本）和新格式（{text, files}）
                let text = typeof data === 'string' ? data : (data.text || '');
                const files = typeof data === 'object' && data.files ? data.files : [];

                console.log('[预览] 用户提交:', text.substring(0, 50), files.length ? `+${files.length}个文件` : '');
                previewInputActive = false;
                previewVisible = false;
                window.electronAPI.hidePreview();

                text = fixPunctuation(text);
                if (!text.trim() && files.length === 0) {
                    collapseAfterError();
                    return;
                }

                if (!chatId) {
                    await ensureChatSession();
                    if (!chatId) { collapseAfterError(); return; }
                }

                try {
                    await window.electronAPI.typeToActive();
                    await sendMessage(text, false, files);
                } catch (e) {
                    console.error('[预览] 提交失败:', e);
                    collapseAfterError();
                }
            });

            // 预览框取消输入
            window.electronAPI.onPreviewCancel(() => {
                console.log('[预览] 用户取消输入');
                previewInputActive = false;
                previewVisible = false;
                window.electronAPI.hidePreview();
                // 立即恢复悬浮球，不延迟
                isProcessing = false;
                hotkeyMode = false;
                clickMode = false;
                isExpanded = false; // 重置窗口展开状态，避免快捷键录音时误判
                floatingMicBtn.classList.remove('recording');
                try { window.electronAPI.hideAIPreview(); } catch(e) {}
                try { window.electronAPI.stopExpandedViz(); } catch(e) {}
                window.electronAPI.collapseWindow().then(() => {
                    floatingMode.style.display = 'flex';
                });
                unlockAndActivateTarget();
            });
        });

        async function onMicMouseDown(e) {
            e.preventDefault();
            // 右键：打开上下文菜单
            if (e.button === 2) {
                e.stopPropagation();
                window.electronAPI.openContextMenu && window.electronAPI.openContextMenu();
                return;
            }
            isDragging = false;
            dragStartX = e.screenX;
            dragStartY = e.screenY;
            mouseDownTime = Date.now();
            // 并行执行，避免串行 await 延迟拖动启动
            await Promise.all([
                setClickThrough(false),
                window.electronAPI.startDrag()
            ]);
        }

        async function onMicMouseMove(e) {
            if (dragStartX === 0 && dragStartY === 0) return;
            const dx = e.screenX - dragStartX;
            const dy = e.screenY - dragStartY;
            if (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD) {
                isDragging = true;
            }
        }

        function onMicMouseUp(e) {
            window.electronAPI.endDrag();
            if (!isDragging && (Date.now() - mouseDownTime) < 500) {
                onMicClick();
            } else {
                setClickThrough(true);
            }
            isDragging = false;
            dragStartX = 0;
            dragStartY = 0;
        }

        async function onMicClick() {
            if (isRecording) {
                manualStop();
                return;
            }
            if (isAiActive || isProcessing) {
                // AI 预览框显示中或 TTS 播放中，先关闭再开始新录音
                console.log('[点击] AI 预览/TTS 播放中，关闭后开始新录音');
                try { window.electronAPI.forceStopTts(); } catch(e) {}
                isAiActive = false;
                ttsPlaying = false;
                isProcessing = false;
                isExpanded = false;
                hotkeyMode = false;
                clickMode = false;
                fullResponseText = '';
            }
            clickMode = true;
            lockTarget();
            isExpanded = await window.electronAPI.toggleWindow();
            if (isExpanded) {
                floatingMode.style.display = 'none';
                await setClickThrough(true);
            }
            await startRecording();
        }

        async function startHotkeyRecording(capturedFocus) {
            if (isRecording) return;
            clickMode = false;
            if (capturedFocus) {
                focusInfo = capturedFocus;
                window.electronAPI.saveFocusInfo(focusInfo);
            }
            lockTarget();
            if (!isExpanded) {
                isExpanded = await window.electronAPI.toggleWindow();
            }
            if (isExpanded) {
                floatingMode.style.display = 'none';
                await setClickThrough(true);
            }
            hotkeyMode = true;

            // 先检查剪贴板是否有选中内容
            try {
                const clipboardResult = await window.electronAPI.readFromClipboard();
                if (clipboardResult.success && clipboardResult.text && clipboardResult.text.trim()) {
                    const selectedText = clipboardResult.text.trim();
                    console.log('[快捷键] 检测到选中内容，直接发送给AI:', selectedText.substring(0, 50));
                    // 隐藏预览，显示处理中
                    previewVisible = false;
                    window.electronAPI.hidePreview();
                    try { window.electronAPI.showExpandedProcessing(); } catch(e) {}
                    // 发送选中内容给AI处理
                    if (!chatId) {
                        await ensureChatSession();
                    }
                    if (chatId) {
                        await window.electronAPI.typeToActive();
                        await sendMessage(selectedText);
                    } else {
                        collapseAfterError();
                    }
                    return;
                }
            } catch (e) {
                console.error('[快捷键] 读取剪贴板失败:', e);
            }

            // 没有选中内容，开始录音
            await startRecording();
        }

        async function createChatSession() {
            try {
                const headers = { 'Authorization': `Bearer ${CONFIG.apiKey}`, 'Accept': '*/*', 'X-Feature-Mode': featureMode };
                if (currentUserInfo) {
                    headers['X-User-Name'] = encodeURIComponent(currentUserInfo.user_name || '');
                    headers['X-User-ID'] = encodeURIComponent(currentUserInfo.username || '');
                }
                const resp = await fetch(`${CONFIG.proxyUrl}/open`, {
                    method: 'GET',
                    headers
                });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();
                if (data.code === 200) {
                    chatId = data.data;
                    chatIdCreatedAt = Date.now();
                    chatIdLastUsedAt = Date.now();
                    console.log('[会话] 新会话已创建:', chatId);
                } else {
                    throw new Error(data.message || '创建会话失败');
                }
            } catch (e) {
                console.error('创建会话失败:', e);
            }
        }

        async function ensureChatSession() {
            if (!chatId) {
                await createChatSession();
                return;
            }
            const idleMs = Date.now() - chatIdLastUsedAt;
            if (idleMs > SESSION_MAX_IDLE_MS) {
                console.log(`[会话] 会话已空闲${Math.round(idleMs / 60000)}分钟，超过${SESSION_MAX_IDLE_MS / 60000}分钟阈值，重建会话`);
                chatId = null;
                await createChatSession();
            }
        }

        // WAV 格式编码工具
        function floatTo16BitPCM(output, offset, input) {
            for (let i = 0; i < input.length; i++, offset += 2) {
                let s = Math.max(-1, Math.min(1, input[i]));
                output.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }
        }

        function encodeWAV(samples, sampleRate, channels) {
            const buffer = new ArrayBuffer(44 + samples.length * 2);
            const view = new DataView(buffer);
            
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + samples.length * 2, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, channels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * channels * 2, true);
            view.setUint16(32, channels * 2, true);
            view.setUint16(34, 16, true);
            writeString(view, 36, 'data');
            view.setUint32(40, samples.length * 2, true);
            
            floatTo16BitPCM(view, 44, samples);
            return buffer;
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        // 安全的 Base64 编码（使用内置 API，避免手动循环）
        function arrayBufferToBase64(buffer) {
            try {
                return btoa(String.fromCharCode(...new Uint8Array(buffer)));
            } catch (e) {
                // 备用方案：分块处理
                const bytes = new Uint8Array(buffer);
                let binary = '';
                const chunkSize = 4096;
                for (let i = 0; i < bytes.length; i += chunkSize) {
                    const chunk = bytes.subarray(i, Math.min(i + chunkSize, bytes.length));
                    binary += String.fromCharCode.apply(null, chunk);
                }
                return btoa(binary);
            }
        }

        // 连接 WebSocket
        async function connectWebSocket() {
            return new Promise((resolve, reject) => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    resolve('connected');
                    return;
                }
                
                console.log('[WS] 正在连接:', CONFIG.wsAsrUrl);
                ws = new WebSocket(CONFIG.wsAsrUrl);
                
                const connectTimeout = setTimeout(() => {
                    if (ws && ws.readyState !== WebSocket.OPEN) {
                        console.error('[WS] 连接超时');
                        try { ws.close(); } catch(e) {}
                        ws = null;
                        reject(new Error('连接超时'));
                    }
                }, 5000);
                
                ws.onopen = () => {
                    clearTimeout(connectTimeout);
                    console.log('[WS] WebSocket 连接成功');
                    resolve('connected');
                };
                
                ws.onmessage = (event) => {
                    try {
                        const rawData = event.data;
                        let result;
                        
                        if (typeof rawData === 'string') {
                            result = JSON.parse(rawData);
                        } else {
                            const textDecoder = new TextDecoder('utf-8');
                            const text = textDecoder.decode(rawData);
                            result = JSON.parse(text);
                        }
                        
                        console.log('[WS] 收到消息:', JSON.stringify(result).substring(0, 200));
                        
                        // 尝试多种可能的响应格式提取文字
                        let text = '';
                        if (result.text !== undefined) {
                            text = typeof result.text === 'string' ? result.text : JSON.stringify(result.text);
                        } else if (result.result !== undefined) {
                            if (typeof result.result === 'string') {
                                text = result.result;
                            } else if (result.result.text) {
                                text = result.result.text;
                            } else if (result.result.transcription) {
                                text = result.result.transcription;
                            } else {
                                text = JSON.stringify(result.result);
                            }
                        } else if (result.transcription !== undefined) {
                            text = typeof result.transcription === 'string' ? result.transcription : JSON.stringify(result.transcription);
                        } else if (result.message !== undefined) {
                            text = result.message;
                        }
                        
                        if (text) {
                            recognizedText += text;
                            console.log('[WS] 流式识别结果:', text);
                            
                            // 实时更新预览
                            if (!allRecordingDone) {
                                window.electronAPI.sendPreviewSegment({ text: text, error: false }).catch(() => {});
                            }
                        } else if (result.error) {
                            console.error('[WS] 服务端错误:', result.error);
                        }
                    } catch (e) {
                        console.error('[WS] 解析消息失败:', e, '原始数据:', event.data.toString().substring(0, 200));
                    }
                };
                
                ws.onerror = (error) => {
                    clearTimeout(connectTimeout);
                    console.error('[WS] WebSocket 错误');
                    reject(error);
                };
                
                ws.onclose = (event) => {
                    clearTimeout(connectTimeout);
                    console.log('[WS] WebSocket 连接关闭:', event.code, event.reason);
                    ws = null;
                };
            });
        }

        // 发送音频数据
        function sendAudioChunk(samples) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                console.error('[WS] sendAudioChunk: WebSocket 未连接, readyState=', ws ? ws.readyState : 'null');
                return;
            }

            try {
                const wavBuffer = encodeWAV(samples, 16000, 1);
                const base64Audio = arrayBufferToBase64(wavBuffer);
                ws.send(JSON.stringify({ audio: base64Audio }));
                console.log('[WS] 已发送音频分片, 大小:', wavBuffer.byteLength, '字节');
            } catch (err) {
                console.error('[WS] 发送音频失败:', err);
            }
        }

        async function startRecording() {
            try { window.electronAPI.playStartSound(); } catch(e) {}
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        sampleRate: 16000,
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true
                    } 
                });
                segmentIndex = 0;
                segmentResults = {};
                pendingSegments = 0;
                allRecordingDone = false;
                hasSpeech = false;
                pauseStartTime = null;
                fullResponseText = '';
                recognizedText = '';
                previewText = '';
                previewVisible = false;

                // 使用 WebSocket 流式识别
                if (CONFIG.useWebSocketAsr) {
                    console.log('[录音] 使用 WebSocket 流式识别');

                    // 立即显示预览框
                    await window.electronAPI.showPreview();
                    window.electronAPI.sendPreviewSegment({ text: '正在聆听...', error: false, placeholder: true });

                    try {
                        await connectWebSocket();
                    } catch (wsError) {
                        console.error('[WS] WebSocket 连接失败，回退到传统方式:', wsError);
                        window.electronAPI.sendPreviewSegment({ text: '语音识别服务连接失败，使用备用方式...', error: true });
                        // 回退到传统分段方式
                        startNewSegment();
                        // 继续录音流程
                        isRecording = true;
                        floatingMicBtn.classList.add('recording');
                        startSilenceDetection(currentStream);
                        try { window.electronAPI.startExpandedViz(); } catch(e) {}
                        return;
                    }

                    // 创建 AudioContext（在 connectWebSocket 之后，确保用户手势上下文仍有效）
                    wsAudioContext = new AudioContext({ sampleRate: 16000 });
                    console.log('[WS] AudioContext 创建后状态:', wsAudioContext.state, '采样率:', wsAudioContext.sampleRate);
                    
                    // 确保 AudioContext 处于运行状态
                    if (wsAudioContext.state === 'suspended') {
                        console.log('[WS] AudioContext 被挂起，尝试恢复');
                        await wsAudioContext.resume();
                        console.log('[WS] AudioContext resume 后状态:', wsAudioContext.state);
                    }

                    const source = wsAudioContext.createMediaStreamSource(currentStream);

                    const bufferSize = 2048;
                    processor = wsAudioContext.createScriptProcessor(bufferSize, 1, 1);

                    wsAudioBuffer = [];
                    let audioChunkCount = 0;
                    let isProcessingChunk = false;

                    processor.onaudioprocess = function(e) {
                        const inputBuffer = e.inputBuffer.getChannelData(0);
                        wsAudioBuffer = wsAudioBuffer.concat(Array.from(inputBuffer));

                        // 每收集约 0.5 秒的数据发送一次，使用异步处理避免阻塞音频回调
                        if (wsAudioBuffer.length >= 8000 && !isProcessingChunk) {
                            isProcessingChunk = true;
                            const chunkToSend = wsAudioBuffer.slice(0, 8000);
                            wsAudioBuffer = wsAudioBuffer.slice(8000);
                            
                            // 使用 setTimeout 避免阻塞音频回调
                            setTimeout(() => {
                                try {
                                    audioChunkCount++;
                                    console.log('[WS] 发送第', audioChunkCount, '个音频分片');
                                    sendAudioChunk(chunkToSend);
                                } finally {
                                    isProcessingChunk = false;
                                }
                            }, 0);
                        }
                    };

                    source.connect(processor);
                    processor.connect(wsAudioContext.destination);
                    console.log('[WS] 音频处理器已连接, AudioContext 状态:', wsAudioContext.state);

                    isRecording = true;
                    floatingMicBtn.classList.add('recording');
                    // WS 模式下不调用 startSilenceDetection，避免第二个 AudioContext 干扰 wsAudioContext
                    // 也不需要分段录音的静音检测和自动截断逻辑
                    try { window.electronAPI.startExpandedViz(); } catch(e) {}
                } else {
                    // 传统分段方式 - 立即显示预览
                    previewVisible = true;
                    await window.electronAPI.showPreview();
                    window.electronAPI.sendPreviewSegment({ text: '正在聆听...', placeholder: true });
                    startNewSegment();
                    isRecording = true;
                    floatingMicBtn.classList.add('recording');
                    startSilenceDetection(currentStream);
                    try { window.electronAPI.startExpandedViz(); } catch(e) {}
                }
            } catch (e) {
                console.error('录音失败:', e);
                // 麦克风不可用（未检测到设备/权限被拒/设备被占用等）时，回退到手动输入模式
                if (e && (e.name === 'NotFoundError' || e.name === 'NotAllowedError' ||
                          e.name === 'OverconstrainedError' || e.name === 'NotReadableError' ||
                          e.name === 'DevicesNotFoundError' || e.name === 'SourceUnavailableError')) {
                    await enterManualInputMode();
                } else {
                    collapseAfterError();
                }
            }
        }

        // 无麦克风时进入手动输入模式：显示预览框并直接切换到输入态
        async function enterManualInputMode() {
            console.log('[录音] 未检测到可用麦克风，切换到手动输入模式');
            // 标记预览框为输入模式，阻止录音识别结果提交（此处无录音，仅为保持状态一致）
            previewInputActive = true;
            previewVisible = true;
            isProcessing = false;
            isRecording = false;
            try {
                // 显示预览框
                await window.electronAPI.showPreview();
                // 直接切换到输入模式（无识别文本）
                await window.electronAPI.switchToInputMode({ text: '' });
            } catch (err) {
                console.error('[手动输入] 进入手动输入模式失败:', err);
                collapseAfterError();
            }
        }

        function startNewSegment() {
            const recorder = new MediaRecorder(currentStream);
            const chunks = [];
            const idx = segmentIndex;

            recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
            recorder.onstop = () => {
                const blob = chunks.length > 0 ? new Blob(chunks, { type: 'audio/webm' }) : null;

                if (blob && blob.size > 100) {
                    pendingSegments++;
                    // 异步识别：不阻塞，录音和识别并行
                    speechToText(blob).then(text => {
                        segmentResults[idx] = text;
                        previewText += text;
                        console.log(`[分段] 第${idx + 1}段识别完成: ${text.substring(0, 30)}`);
                        if (previewVisible && text.trim()) {
                            window.electronAPI.sendPreviewSegment({ text: previewText, full: true });
                        }
                    }).catch(e => {
                        console.error(`[分段] 第${idx + 1}段识别失败:`, e);
                        segmentResults[idx] = '';
                    }).finally(() => {
                        pendingSegments--;
                        if (allRecordingDone && pendingSegments === 0) {
                            processAllResults();
                        }
                    });
                } else {
                    segmentResults[idx] = '';
                    if (allRecordingDone && pendingSegments === 0) {
                        processAllResults();
                    }
                }
            };

            recorder.start(500);
            mediaRecorder = recorder;
            segmentStartTime = Date.now();
            pauseStartTime = null;

            if (segmentTimer) clearTimeout(segmentTimer);
            segmentTimer = setTimeout(() => {
                if (isRecording) {
                    console.log(`[分段] 达到最大时长${CONFIG.segmentMaxDuration / 1000}s，强制截断`);
                    pauseStartTime = null;
                    rotateRecorder();
                }
            }, CONFIG.segmentMaxDuration);
        }

        function rotateRecorder() {
            segmentIndex++;
            const oldRecorder = mediaRecorder;
            startNewSegment();
            oldRecorder.stop();
        }

        function startSilenceDetection(stream) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.3;
            source.connect(analyser);

            const timeData = new Float32Array(analyser.fftSize);
            let silenceStart = null;
            let currentAmplitude = 0;
            function analyzeAudio() {
                if (!isRecording) {
                    clearInterval(silenceCheckInterval);
                    silenceCheckInterval = null;
                    return;
                }

                analyser.getFloatTimeDomainData(timeData);

                let sum = 0;
                for (let i = 0; i < timeData.length; i++) {
                    sum += timeData[i] * timeData[i];
                }
                const rms = Math.sqrt(sum / timeData.length);

                if (rms > CONFIG.silenceThreshold) {
                    hasSpeech = true;
                    silenceStart = null;
                } else if (hasSpeech) {
                    if (!silenceStart) {
                        silenceStart = Date.now();
                    } else if (Date.now() - silenceStart > CONFIG.silenceTimeout) {
                        // 点击模式下不自动停止，快捷键模式下3秒静音自动停止
                        if (!clickMode) {
                            console.log(`检测到${CONFIG.silenceTimeout / 1000}秒静音，自动提交`);
                            stopRecording();
                        }
                    }
                }

                if (isRecording && hasSpeech) {
                    if (rms > CONFIG.pauseSilenceThreshold) {
                        pauseStartTime = null;
                    } else {
                        if (!pauseStartTime) {
                            pauseStartTime = Date.now();
                        }
                    }
                    if (pauseStartTime) {
                        const elapsed = Date.now() - segmentStartTime;
                        const pauseDuration = Date.now() - pauseStartTime;
                        if (elapsed >= CONFIG.segmentMinDuration && pauseDuration >= CONFIG.pauseThreshold) {
                            console.log(`[分段] 录音${(elapsed / 1000).toFixed(1)}s，检测到${(pauseDuration / 1000).toFixed(1)}s气口，在气口截断`);
                            pauseStartTime = null;
                            rotateRecorder();
                        }
                    }
                }
            }

            silenceCheckInterval = setInterval(analyzeAudio, 16);
        }

        function stopSilenceDetection() {
            if (silenceCheckInterval) {
                clearInterval(silenceCheckInterval);
                silenceCheckInterval = null;
            }
            if (audioContext) {
                audioContext.close().catch(() => {});
                audioContext = null;
            }
            analyser = null;
        }

        function manualStop() {
            if (isRecording) {
                stopRecording();
            }
        }

        function stopRecording() {
            if (!isRecording) return;
            
            isRecording = false;
            isProcessing = true;
            allRecordingDone = true;
            clickMode = false;

            if (segmentTimer) {
                clearTimeout(segmentTimer);
                segmentTimer = null;
            }

            floatingMicBtn.classList.remove('recording');
            stopSilenceDetection();
            // 预览保持可见，等 processAllResults 中隐藏
            try { window.electronAPI.stopExpandedViz(); } catch(e) {}

            // 停止 WebSocket 流式识别
            if (CONFIG.useWebSocketAsr) {
                // 停止音频处理器
                if (processor) {
                    processor.disconnect();
                    processor = null;
                }

                // 发送最后残留的音频数据
                if (wsAudioBuffer && wsAudioBuffer.length > 100) {
                    try {
                        sendAudioChunk(wsAudioBuffer);
                    } catch (e) {
                        console.error('[WS] 发送最后一段音频失败:', e);
                    }
                }
                wsAudioBuffer = [];

                // 关闭 wsAudioContext
                if (wsAudioContext) {
                    wsAudioContext.close().catch(() => {});
                    wsAudioContext = null;
                }

                // 给服务器 500ms 处理最后一批音频并返回识别结果，然后再关闭 WebSocket
                setTimeout(() => {
                    if (ws) {
                        try { ws.close(); } catch (e) {}
                        ws = null;
                    }
                    if (currentStream) {
                        currentStream.getTracks().forEach(t => t.stop());
                        currentStream = null;
                    }
                    processAllResults();
                }, 500);
            } else {
                // 传统方式停止录音
                if (mediaRecorder) {
                    mediaRecorder.stop();
                }
            }
        }

        async function processAllResults() {
            // 预览框输入模式下，跳过录音结果提交
            if (previewInputActive) {
                console.log('[结果] 预览框输入模式，跳过录音结果提交');
                previewInputActive = false;
                return;
            }

            // 隐藏预览，显示处理中
            previewVisible = false;
            window.electronAPI.hidePreview();
            try { window.electronAPI.showExpandedProcessing(); } catch(e) {}

            if (currentStream) {
                currentStream.getTracks().forEach(t => t.stop());
                currentStream = null;
            }

            let fullText = '';

            // WebSocket 流式识别优先使用 recognizedText
            if (CONFIG.useWebSocketAsr) {
                if (recognizedText && recognizedText.trim()) {
                    fullText = recognizedText;
                    console.log('[WS] 流式识别完整文本:', fullText.substring(0, 100));
                } else {
                    console.log('[WS] 流式识别结果为空，回退到分段方式');
                    for (let i = 0; i <= segmentIndex; i++) {
                        const t = segmentResults[i];
                        if (t && t.trim()) {
                            fullText += t;
                        }
                    }
                }
            } else {
                // 传统分段方式 - 使用已累积的预览文本
                fullText = previewText;
            }

            // 标点修正
            fullText = fixPunctuation(fullText);

            if (!fullText.trim()) {
                console.log('[结果] 无有效识别文本，放弃处理');
                collapseAfterError();
                return;
            }

            if (!chatId) {
                await ensureChatSession();
                if (!chatId) { collapseAfterError(); return; }
            }

            try {
                await window.electronAPI.typeToActive();
                await sendMessage(fullText);
            } catch (e) {
                console.error('语音处理失败:', e);

        function collapseAfterError() {
            setTimeout(async () => {
                isProcessing = false;
                hotkeyMode = false;
                clickMode = false;
                try { window.electronAPI.hideAIPreview(); } catch(e) {}

        // 标点修正：补齐缺失标点，去除重复标点
        function fixPunctuation(text) {
            if (!text || !text.trim()) return text;
            // 去除连续重复标点
            text = text.replace(/([。！？，、；：])\1+/g, '$1');
            // 去除句首标点
            text = text.replace(/^[。！？，、；：\s]+/, '');
            // 如果最后不是终止标点，加句号
            if (text.trim() && !/[。！？…」》'"）)!？]$/.test(text.trim())) {
                text = text.trimEnd() + '。';
            }
            return text;
        }

        async function speechToText(audioBlob) {
            const formData = new FormData();
            formData.append('file', audioBlob, 'recording.webm');
            console.log('[STT] 发送语音识别请求, 音频大小:', audioBlob.size);
            const resp = await fetch(`${CONFIG.proxyUrl}/stt`, { method: 'POST', body: formData, headers: { 'X-Feature-Mode': featureMode } });
            if (!resp.ok) throw new Error(`STT请求失败: ${resp.status}`);
            const data = await resp.json();
            console.log('[STT] 识别结果:', JSON.stringify(data));
            if (data.code === 200 && data.text) return data.text;
            throw new Error(data.message || '语音识别失败');
        }

        function isSessionExpired(msg) {
            if (!msg) return false;
            const m = msg.toLowerCase();
            return m.includes('uuid') || m.includes('不存在') || m.includes('过期') || m.includes('失效') || m.includes('已结束') || m.includes('已关闭') || m.includes('invalid') || m.includes('expired') || m.includes('not found') || m.includes('closed');
        }

        // 清理 Markdown 格式，用于 TTS 朗读
        function stripMarkdown(text) {
            return text
                // 代码块 - 完全移除
                .replace(/```[\s\S]*?```/g, '')
                // JSON表单数据 - 完全移除
                .replace(/\{[^{}]*"form_field_list"\s*:\s*\[[\s\S]*?\][^{}]*\}/g, '')
                // 网址链接 - 完全移除
                .replace(/https?:\/\/[^\s<>"')\]]+/g, '')
                // 长哈希/ID字符串 (32位以上连续十六进制或UUID格式)
                .replace(/[0-9a-f]{32,}/gi, '')
                .replace(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi, '')
                // 图片 ![alt](url) → alt
                .replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1')
                // 链接 [text](url) → text
                .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
                // 标题 ## → 去掉（任意位置，直接移除所有#）
                .replace(/#/g, '')
                // 加粗 **text** 或 __text__ → text
                .replace(/\*\*(.+?)\*\*/g, '$1')
                .replace(/__(.+?)__/g, '$1')
                // 斜体 *text* 或 _text_ → text
                .replace(/\*(.+?)\*/g, '$1')
                .replace(/(?<!\w)_(.+?)_(?!\w)/g, '$1')
                // 移除所有单独的*号（列表标记等）
                .replace(/\*/g, '')
                // 删除线 ~~text~~ → text
                .replace(/~~(.+?)~~/g, '$1')
                // 行内代码 `code` → code
                .replace(/`(.+?)`/g, '$1')
                // 引用 > → 去掉
                .replace(/^>\s+/gm, '')
                // 无序列表 - * + → 去掉
                .replace(/^[\s]*[-*+]\s+/gm, '')
                // 有序列表 1. → 去掉
                .replace(/^\d+\.\s+/gm, '')
                // 水平线 --- *** → 去掉
                .replace(/^[-*_]{3,}\s*$/gm, '')
                // HTML 标签
                .replace(/<[^>]+>/g, '')
                // 残余的JSON片段（花括号包裹的内容）
                .replace(/\{["'][\s\S]*?["']\s*:\s*[\s\S]*?\}/g, '')
                // 多余空行
                .replace(/\n{3,}/g, '\n\n')
                .trim();
        }

        // 判断文件扩展名类型
        function isImageExt(ext) {
            return ['.jpg', '.jpeg', '.png', '.gif', '.bmp', '.webp', '.svg', '.ico'].includes(ext.toLowerCase());
        }
        function isDocumentExt(ext) {
            return ['.doc', '.docx', '.xls', '.xlsx', '.ppt', '.pptx', '.pdf', '.txt', '.csv', '.md'].includes(ext.toLowerCase());
        }
        function isAudioExt(ext) {
            return ['.mp3', '.wav', '.ogg', '.flac', '.aac', '.m4a', '.wma'].includes(ext.toLowerCase());
        }

        // 上传文件到 OSS 并构建 image_list/document_list 对象
        async function uploadFilesToOss(files, chatId) {
            const imageList = [];
            const documentList = [];
            const audioList = [];
            const otherList = [];

            for (const f of files) {
                try {
                    console.log(`[OSS] 上传文件: ${f.name}`);
                    const result = await window.electronAPI.uploadFileToOss({
                        filePath: f.path,
                        fileName: f.name,
                        chatId: chatId,
                        sourceType: 'CHAT'
                    });

                    if (!result.success) {
                        console.error(`[OSS] 上传失败: ${f.name} - ${result.error}`);
                        continue;
                    }

                    console.log(`[OSS] 上传成功: ${f.name} -> ${result.url}`);

                    // 构建 image_list 对象（参考 Java 客户端格式）
                    const fileItem = {
                        name: f.name,
                        percentage: 0,
                        status: 'ready',
                        size: result.size,
                        raw: { uid: result.uid },
                        uid: result.uid,
                        url: result.url,
                        file_id: result.file_id
                    };

                    // 按文件类型分类
                    const ext = '.' + (f.type || f.name.split('.').pop() || '').toLowerCase();
                    if (isImageExt(ext)) {
                        imageList.push(fileItem);
                    } else if (isDocumentExt(ext)) {
                        documentList.push(fileItem);
                    } else if (isAudioExt(ext)) {
                        audioList.push(fileItem);
                    } else {
                        otherList.push(fileItem);
                    }
                } catch (e) {
                    console.error(`[OSS] 上传异常: ${f.name}`, e);
                }
            }

            return { imageList, documentList, audioList, otherList };
        }

        async function sendMessage(message, isRetry, files) {
            await ensureChatSession();
            if (!chatId) { collapseAfterError(); return; }
            try {
                const headers = { 'Authorization': `Bearer ${CONFIG.apiKey}`, 'Content-Type': 'application/json', 'Accept': '*/*', 'X-Feature-Mode': featureMode };
                if (currentUserInfo) {
                    headers['X-User-Name'] = encodeURIComponent(currentUserInfo.user_name || '');
                    headers['X-User-ID'] = encodeURIComponent(currentUserInfo.username || '');
                }
                const body = { message, stream: true, re_chat: false };

                // 上传文件到 OSS 并构建 image_list/document_list
                if (files && files.length > 0) {
                    const ossResult = await uploadFilesToOss(files, chatId);
                    body.image_list = ossResult.imageList;
                    body.document_list = ossResult.documentList;
                    body.audio_list = ossResult.audioList;
                    body.video_list = [];
                    body.other_list = ossResult.otherList;
                    body.form_data = {};
                    console.log(`[消息] 附加文件: image=${ossResult.imageList.length}, doc=${ossResult.documentList.length}, audio=${ossResult.audioList.length}, other=${ossResult.otherList.length}`);
                }

                const resp = await fetch(`${CONFIG.proxyUrl}/chat_message/${chatId}`, {
                    method: 'POST',
                    headers,
                    body: JSON.stringify(body)
                });
                if (!resp.ok) {
                    if (!isRetry) {
                        console.log(`请求失败 HTTP ${resp.status}，重建会话重试`);
                        chatId = null;
                        await createChatSession();
                        if (chatId) return await sendMessage(message, true, files);
                    }
                    throw new Error(`HTTP ${resp.status}`);
                }

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let hasContent = false;
                let buffer = '';
                let typeBuffer = '';
                let typeTimer = null;
                // --- base64图片过滤状态机 ---
                let typeState = 'NORMAL'; // NORMAL | HOLD | SKIP
                let holdBuffer = '';       // 暂存可能含base64图片的片段
                let normalReady = '';      // 确定不含图片标记的可发送文本

                function processTypeBuffer() {
                    // 将 typeBuffer 中的内容按状态机处理，产出可发送文本到 normalReady
                    let input = typeBuffer;
                    typeBuffer = '';

                    while (input.length > 0) {
                        if (typeState === 'NORMAL') {
                            const imgStart = input.indexOf('![');
                            if (imgStart === -1) {
                                normalReady += input;
                                input = '';
                            } else {
                                normalReady += input.substring(0, imgStart);
                                holdBuffer = input.substring(imgStart);
                                input = '';
                                typeState = 'HOLD';
                            }
                        } else if (typeState === 'HOLD') {
                            holdBuffer += input;
                            input = '';
                            // 检查是否有 ]( 标记
                            const bracketUrl = holdBuffer.indexOf('](');
                            if (bracketUrl !== -1) {
                                const afterUrl = holdBuffer.substring(bracketUrl + 2);
                                if (afterUrl.startsWith('data:image/')) {
                                    // base64图片，进入SKIP
                                    typeState = 'SKIP';
                                } else {
                                    // 非base64图片（URL图片），跳过alt，保留URL
                                    typeState = 'SKIP_URL';
                                }
                            }
                            // 否则继续等待更多数据
                        } else if (typeState === 'SKIP') {
                            // 跳过base64图片内容，等待 ) 闭合
                            // base64数据不含 ) 字符，所以第一个 ) 就是闭合位置
                            holdBuffer += input;
                            input = '';
                            const closeIdx = holdBuffer.indexOf(')', holdBuffer.indexOf(']('));
                            if (closeIdx !== -1) {
                                // base64图片完整，跳过，输出占位符
                                normalReady += '[图片]';
                                // ) 之后可能还有内容
                                const afterClose = holdBuffer.substring(closeIdx + 1);
                                holdBuffer = '';
                                typeState = 'NORMAL';
                                if (afterClose.length > 0) {
                                    input = afterClose; // 继续处理剩余内容
                                }
                            }
                        } else if (typeState === 'SKIP_URL') {
                            // 跳过URL图片的alt，保留URL部分
                            holdBuffer += input;
                            input = '';
                            const bracketUrlIdx = holdBuffer.indexOf('](');
                            const closeIdx = holdBuffer.indexOf(')', bracketUrlIdx + 2);
                            if (closeIdx !== -1) {
                                // 提取URL
                                const url = holdBuffer.substring(bracketUrlIdx + 2, closeIdx);
                                normalReady += url;
                                // ) 之后可能还有内容
                                const afterClose = holdBuffer.substring(closeIdx + 1);
                                holdBuffer = '';
                                typeState = 'NORMAL';
                                if (afterClose.length > 0) {
                                    input = afterClose;
                                }
                            }
                        }
                    }
                }

                function flushTypeBuffer() {
                    processTypeBuffer();
                    // HOLD/SKIP/SKIP_URL 状态时不发送，等待更多数据
                    if (typeState !== 'NORMAL') {
                        typeTimer = setTimeout(flushTypeBuffer, 200);
                        return;
                    }
                    if (normalReady.length > 0) {
                        const text = normalReady;
                        normalReady = '';
                        // 仅在自动输入开启时，通过打字输入到焦点窗口
                        if (autoInputEnabled) {
                            fetch(`${CONFIG.proxyUrl}/type`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ text })
                            }).catch(typeErr => {
                                console.error('打字输出失败:', typeErr);
                            });
                        }
                    }
                    typeTimer = null;
                }

                function flushTypeBufferFinal() {
                    // 流结束时强制刷新，处理未闭合的状态
                    if (typeState === 'HOLD') {
                        // 未闭合的 ![ ，保守发送
                        normalReady += holdBuffer;
                        holdBuffer = '';
                        typeState = 'NORMAL';
                    } else if (typeState === 'SKIP') {
                        // 未闭合的base64图片，输出占位符
                        normalReady += '[图片]';
                        holdBuffer = '';
                        typeState = 'NORMAL';
                    } else if (typeState === 'SKIP_URL') {
                        // 未闭合的URL图片，提取已有URL部分
                        const bracketUrl = holdBuffer.indexOf('](');
                        if (bracketUrl !== -1) {
                            const url = holdBuffer.substring(bracketUrl + 2);
                            normalReady += url;
                        } else {
                            normalReady += holdBuffer;
                        }
                        holdBuffer = '';
                        typeState = 'NORMAL';
                    }
                    // 处理剩余 typeBuffer
                    processTypeBuffer();
                    // 发送所有剩余文本
                    if (normalReady.length > 0) {
                        const text = normalReady;
                        normalReady = '';
                        if (autoInputEnabled) {
                            fetch(`${CONFIG.proxyUrl}/type`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ text })
                            }).catch(typeErr => {
                                console.error('打字输出失败:', typeErr);
                            });
                        }
                    }
                    typeBuffer = '';
                    if (typeTimer) { clearTimeout(typeTimer); typeTimer = null; }
                }
                let ttsStarted = false;
                let aiPreviewShown = false;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const events = buffer.split('\n');
                    buffer = events.pop() || '';
                    for (const line of events) {
                        const trimmed = line.trim();
                        if (!trimmed || !trimmed.startsWith('data:')) continue;
                        const jsonStr = trimmed.replace(/^data:\s*/, '');
                        if (!jsonStr) continue;
                        try {
                            const data = JSON.parse(jsonStr);
                            if (data.code && data.code !== 200) {
                                if (!isRetry && isSessionExpired(data.message)) {
                                    console.log('会话失效，重建重试:', data.message);
                                    chatId = null;
                                    await createChatSession();
                                    if (chatId) return await sendMessage(message, true, files);
                                }
                                throw new Error(data.message || 'AI服务错误');
                            }
                            if (data.content) {
                                hasContent = true;
                                typeBuffer += data.content;
                                fullResponseText += data.content;
                                // AI 预览窗：首块文本到达时显示，后续文本追加
                                if (!aiPreviewShown) {
                                    aiPreviewShown = true;
                                    isAiActive = true;
                                    try { window.electronAPI.showAIPreview(); } catch(e) {}
                                    try { window.electronAPI.sendAIPreviewMode(featureMode); } catch(e) {}
                                }
                                try { window.electronAPI.sendAIPreviewSegment({ text: data.content }); } catch(e) {}
                                if (!typeTimer) {
                                    typeTimer = setTimeout(flushTypeBuffer, 100);
                                }
                                // TTS 处理：teaching-demo 模式只说一句话
                                if (featureMode === 'teaching-demo') {
                                    if (ttsEnabled && !ttsStarted) {
                                        ttsStarted = true;
                                        ttsPlaying = true;
                                        try { window.electronAPI.ttsStart(); } catch(e) {}
                                        try { window.electronAPI.ttsText('页面生成中，请您稍后'); } catch(e) {}
                                        try { window.electronAPI.ttsStreamEnd(); } catch(e) {}
                                    }
                                } else {
                                    if (ttsEnabled && !ttsStarted) {
                                        ttsStarted = true;
                                        ttsPlaying = true;
                                        try { window.electronAPI.ttsStart(); } catch(e) {}
                                    }
                                    if (ttsEnabled) {
                                        try { window.electronAPI.ttsText(stripMarkdown(data.content)); } catch(e) {}
                                    }
                                }
                            }
                        } catch (e) {
                            if (!isRetry && isSessionExpired(e.message)) {
                                console.log('会话失效，重建重试:', e.message);
                                chatId = null;
                                await createChatSession();
                                if (chatId) return await sendMessage(message, true, files);
                            }
                            console.error('SSE解析错误:', e);
                        }
                    }
                }

                if (typeBuffer.length > 0 || normalReady.length > 0 || holdBuffer.length > 0) {
                    clearTimeout(typeTimer);
                    flushTypeBufferFinal();
                }

                if (ttsEnabled && ttsStarted && featureMode !== 'teaching-demo') {
                    try { window.electronAPI.ttsStreamEnd(); } catch(e) {}
                }

                // AI 预览窗：流式输出结束，显示复制按钮
                if (aiPreviewShown) {
                    try { window.electronAPI.sendAIPreviewStreamEnd(); } catch(e) {}
                    // 流结束后，将 base64 图片转换为本地文件
                    try {
                        const result = await window.electronAPI.saveBase64Images(fullResponseText);
                        if (result && result.replacements && result.replacements.length > 0) {
                            // 更新 fullResponseText 中的 base64 为本地路径
                            let updatedText = fullResponseText;
                            for (const rep of result.replacements) {
                                updatedText = updatedText.replace(rep.original, rep.localPath);
                            }
                            fullResponseText = updatedText;
                            // 通知预览窗替换图片
                            window.electronAPI.replacePreviewImages(result.replacements);
                        }
                    } catch(e) {
                        console.error('base64图片本地化失败:', e);
                    }
                }

                if (!hasContent) {
                    if (!isRetry) {
                        console.log('AI返回空内容，重建会话重试');
                        chatId = null;
                        await createChatSession();
                        if (chatId) return await sendMessage(message, true, files);
                    }
                    throw new Error('AI返回空内容');
                }

                await finishStreaming();
            } catch (e) {
                console.error('发送消息失败:', e);
                collapseAfterError();
            }
        }

        async function finishStreaming() {
            isProcessing = false;
            hotkeyMode = false;
            clickMode = false;
            chatIdLastUsedAt = Date.now();

            if (fullResponseText) {
                try { window.electronAPI.saveHistory(featureMode, fullResponseText); } catch(e) {}
            }

            if (ttsPlaying) {
                try { window.electronAPI.stopExpandedViz(); } catch(e) {}
                try { window.electronAPI.hideExpanded(); } catch(e) {}
                // TTS 模式下，AI 预览窗在 tts-playback-done 时关闭
            } else if (featureMode === 'teaching-demo') {
                // 教学演示模式：不自动关闭预览窗，让用户查看网页和下载
                unlockAndActivateTarget();
                try { window.electronAPI.stopExpandedViz(); } catch(e) {}
            } else {
                // 非 TTS 模式，AI 预览窗保持显示，30秒后自动关闭
                unlockAndActivateTarget();
                try { window.electronAPI.stopExpandedViz(); } catch(e) {}
                setTimeout(async () => {
                    try { window.electronAPI.hideAIPreview(); } catch(e) {}
                    isExpanded = await window.electronAPI.collapseWindow();
                    floatingMode.style.display = 'flex';
                }, 30000);
            }
        }
    </script>
