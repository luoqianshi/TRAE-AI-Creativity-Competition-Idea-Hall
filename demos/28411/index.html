<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍱 今天吃啥呀？</title>
  <style>
    /* ================= 基础 ================= */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #FFF6E5;
      color: #4a3b2a;
      min-height: 100vh;
      padding: 24px 16px 80px;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
    }

    /* ================= 标题 ================= */
    .header {
      text-align: center;
      padding: 18px 0 22px;
    }
    .header h1 {
      font-size: 30px;
      background: linear-gradient(135deg, #FF8FAB 0%, #FFB347 50%, #87CEEB 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .header .subtitle {
      font-size: 13px;
      color: #b08e6a;
      margin-top: 6px;
    }

    /* ================= 卡片通用 ================= */
    .card {
      background: #ffffff;
      border-radius: 22px;
      padding: 18px 18px 16px;
      box-shadow: 0 6px 20px rgba(255, 182, 193, 0.25);
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 14px;
      color: #b08e6a;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ================= 餐别 pill ================= */
    .meal-pills {
      display: flex;
      gap: 10px;
      justify-content: space-between;
    }
    .pill {
      flex: 1;
      border: 2px solid #ffe0e9;
      background: #fff;
      border-radius: 16px;
      padding: 12px 0;
      text-align: center;
      cursor: pointer;
      font-size: 15px;
      color: #b08e6a;
      transition: all 0.2s;
      user-select: none;
    }
    .pill .icon { font-size: 22px; display: block; margin-bottom: 2px; }
    .pill:hover { transform: translateY(-2px); }
    .pill.active {
      background: linear-gradient(135deg, #FFB6C1 0%, #FFE066 100%);
      border-color: transparent;
      color: #fff;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(255, 182, 193, 0.4);
    }
    .meal-pills.auto .pill { opacity: 0.55; }
    .meal-pills.auto .pill.active { opacity: 1; }

    /* ================= 选项行 ================= */
    .option-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .chip {
      border: 2px solid #ffe0e9;
      background: #fff;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 14px;
      color: #b08e6a;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }
    .chip:hover { transform: translateY(-1px); }
    .chip.active {
      background: #FFB6C1;
      border-color: #FFB6C1;
      color: #fff;
      font-weight: 600;
    }
    .chip.soup.active { background: #87CEEB; border-color: #87CEEB; }
    .chip.gather.active { background: #FFE066; border-color: #FFE066; color: #8a6a00; }

    /* ================= 推荐按钮 ================= */
    .big-btn {
      width: 100%;
      padding: 18px;
      font-size: 19px;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, #FF8FAB 0%, #FFB347 100%);
      border: none;
      border-radius: 22px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 143, 171, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: 2px;
      margin: 4px 0 8px;
    }
    .big-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(255, 143, 171, 0.5); }
    .big-btn:active { transform: translateY(0); }
    .big-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .big-btn .pulse {
      display: inline-block;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    /* ================= 推荐结果卡 ================= */
    .result {
      background: linear-gradient(135deg, #fff0f5 0%, #fffbe6 100%);
      border-radius: 22px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(255, 224, 233, 0.6);
      margin-bottom: 16px;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    .result.empty .result-emoji { font-size: 60px; opacity: 0.5; }
    .result-emoji {
      font-size: 72px;
      line-height: 1;
      margin-bottom: 12px;
      animation: bounceIn 0.5s ease;
    }
    @keyframes bounceIn {
      0%   { transform: scale(0.3); opacity: 0; }
      60%  { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); }
    }
    .result-name {
      font-size: 28px;
      font-weight: 800;
      color: #d96b8a;
      margin-bottom: 8px;
    }
    .result-meta {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    .result-tag {
      background: #fff;
      border: 1.5px dashed #ffc1d4;
      color: #b06a82;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
    }
    .result-hint {
      font-size: 14px;
      color: #b08e6a;
      line-height: 1.6;
    }

    /* ================= 操作按钮 ================= */
    .action-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .action-btn {
      flex: 1;
      padding: 12px 0;
      border-radius: 16px;
      border: 2px solid #ffe0e9;
      background: #fff;
      font-size: 14px;
      color: #b08e6a;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
    }
    .action-btn:hover { background: #fff0f5; }
    .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ================= 菜品库 ================= */
    .library-toggle {
      width: 100%;
      text-align: left;
      background: #fff;
      border: none;
      border-radius: 18px;
      padding: 16px 18px;
      cursor: pointer;
      font-size: 15px;
      color: #b08e6a;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(255, 182, 193, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .library-toggle .arrow {
      transition: transform 0.2s;
    }
    .library-toggle.open .arrow { transform: rotate(180deg); }
    .library-panel {
      display: none;
      background: #fff;
      border-radius: 0 0 18px 18px;
      padding: 4px 18px 18px;
      margin-top: -16px;
      box-shadow: 0 4px 14px rgba(255, 182, 193, 0.2);
    }
    .library-panel.open { display: block; }
    .add-btn {
      width: 100%;
      padding: 10px;
      border: 2px dashed #ffc1d4;
      background: #fff8fa;
      color: #d96b8a;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      margin: 12px 0;
      font-weight: 600;
    }
    .add-btn:hover { background: #fff0f5; }
    .dish-list { list-style: none; }
    .dish-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 4px;
      border-bottom: 1px solid #fff0f5;
      font-size: 14px;
    }
    .dish-item:last-child { border-bottom: none; }
    .dish-item .e { font-size: 22px; }
    .dish-item .n { flex: 1; color: #4a3b2a; font-weight: 600; }
    .dish-item .t { color: #b08e6a; font-size: 11px; }
    .dish-item .op {
      background: none;
      border: none;
      cursor: pointer;
      color: #d96b8a;
      font-size: 13px;
      padding: 4px 6px;
      border-radius: 8px;
    }
    .dish-item .op:hover { background: #fff0f5; }

    /* ================= 弹窗（新增/编辑菜品） ================= */
    .modal-mask {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-mask.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 22px;
      padding: 22px;
      width: 100%;
      max-width: 400px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal h3 {
      color: #d96b8a;
      margin-bottom: 14px;
      font-size: 18px;
    }
    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 12px;
      color: #b08e6a;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .field input[type=text] {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #ffe0e9;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }
    .field input[type=text]:focus { border-color: #FFB6C1; }
    .field-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .field-row .chip { font-size: 13px; padding: 6px 12px; }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
    .modal-actions button {
      flex: 1;
      padding: 12px;
      border-radius: 14px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-cancel { background: #f5f0e8; color: #b08e6a; }
    .btn-save   { background: linear-gradient(135deg, #FF8FAB 0%, #FFB347 100%); color: #fff; }
    .btn-danger { background: #ffe0e0; color: #c0392b; }

    /* ================= Toast ================= */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%) translateY(20px);
      background: rgba(74, 59, 42, 0.92);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
      z-index: 200;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ================= 浮动 emoji ================= */
    .float-emoji {
      position: absolute;
      font-size: 28px;
      animation: floatUp 1.6s ease-out forwards;
      pointer-events: none;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-120px) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 标题 -->
    <div class="header">
      <h1>🍱 今天吃啥呀？🍜</h1>
      <div class="subtitle" id="subtitle">让选择困难症下班～</div>
    </div>

    <!-- 餐别 -->
    <div class="card">
      <div class="card-title">⏰ 现在是哪一餐？</div>
      <div class="meal-pills" id="mealPills">
        <div class="pill" data-meal="breakfast"><span class="icon">🍳</span>早餐</div>
        <div class="pill" data-meal="lunch"><span class="icon">🍚</span>午餐</div>
        <div class="pill" data-meal="dinner"><span class="icon">🍲</span>晚餐</div>
      </div>
    </div>

    <!-- 日期类型 -->
    <div class="card">
      <div class="card-title">📅 今天是？</div>
      <div class="option-row" id="dayTypeRow">
        <div class="chip active" data-day="workday">💼 工作日</div>
        <div class="chip" data-day="restday">🌴 休息日</div>
      </div>
    </div>

    <!-- 偏好 -->
    <div class="card">
      <div class="card-title">💖 想吃点啥风格？（可多选，不选=全部）</div>
      <div class="option-row" id="prefRow">
        <div class="chip dry"   data-pref="dry">🍚 干的</div>
        <div class="chip soup"  data-pref="soup">🍲 汤的</div>
        <div class="chip gather" data-pref="gather">🎉 聚餐</div>
      </div>
    </div>

    <!-- 主按钮 -->
    <button class="big-btn" id="pickBtn"><span class="pulse">✨ 帮我选！✨</span></button>

    <!-- 推荐结果 -->
    <div class="result empty" id="result">
      <div class="result-emoji">🍽️</div>
      <div class="result-hint">点击上方按钮，让我来帮你决定～</div>
    </div>

    <!-- 操作行 -->
    <div class="action-row" id="actionRow" style="display:none;">
      <button class="action-btn" id="dislikeBtn">😣 不喜欢</button>
      <button class="action-btn" id="rerollBtn">🔄 换一换</button>
    </div>

    <!-- 菜品库 -->
    <button class="library-toggle" id="libToggle">
      <span>🍱 我的菜品库 (<span id="dishCount">0</span>)</span>
      <span class="arrow">▾</span>
    </button>
    <div class="library-panel" id="libPanel">
      <button class="add-btn" id="addBtn">+ 新增菜品</button>
      <ul class="dish-list" id="dishList"></ul>
      <button class="add-btn" id="resetBtn" style="margin-top:18px;border-color:#ffd0d0;color:#c0392b;background:#fff5f5;">↺ 恢复内置默认菜品</button>
    </div>
  </div>

  <!-- 编辑弹窗 -->
  <div class="modal-mask" id="modalMask">
    <div class="modal">
      <h3 id="modalTitle">新增菜品</h3>

      <div class="field">
        <label>菜名</label>
        <input type="text" id="fName" placeholder="例如：麻辣香锅" />
      </div>

      <div class="field">
        <label>Emoji（视觉图标）</label>
        <input type="text" id="fEmoji" placeholder="例如：🌶️" maxlength="4" />
      </div>

      <div class="field">
        <label>适合的餐别</label>
        <div class="field-row" id="fMeal">
          <div class="chip" data-meal="breakfast">🍳 早餐</div>
          <div class="chip" data-meal="lunch">🍚 午餐</div>
          <div class="chip" data-meal="dinner">🍲 晚餐</div>
        </div>
      </div>

      <div class="field">
        <label>耗时</label>
        <div class="field-row" id="fDuration">
          <div class="chip" data-dur="quick">⚡ 快速 (&lt;15min)</div>
          <div class="chip" data-dur="medium">⏱️ 中等 (15-45min)</div>
          <div class="chip" data-dur="long">🕐 耗时 (&gt;45min)</div>
        </div>
      </div>

      <div class="field">
        <label>风格</label>
        <div class="field-row" id="fPref">
          <div class="chip" data-pref="dry">🍚 干的</div>
          <div class="chip" data-pref="soup">🍲 汤的</div>
          <div class="chip" data-pref="gather">🎉 聚餐</div>
          <div class="chip" data-pref="any">🔄 通用</div>
        </div>
      </div>

      <div class="field">
        <label>限制</label>
        <div class="field-row" id="fRest">
          <div class="chip" data-rest="false">💼 工作日也可</div>
          <div class="chip" data-rest="true">🌴 仅休息日</div>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" id="mCancel">取消</button>
        <button class="btn-save" id="mSave">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ================= 默认菜品 =================
    const DEFAULT_DISHES = [
      // 早餐
      { id: 'd01', name: '包子',         emoji: '🥟', meal: ['breakfast'],            duration: 'quick',  preference: ['dry'],   restDayOnly: false },
      { id: 'd02', name: '豆浆油条',     emoji: '🥖', meal: ['breakfast'],            duration: 'quick',  preference: ['dry'],   restDayOnly: false },
      { id: 'd03', name: '白粥配咸菜',   emoji: '🍚', meal: ['breakfast'],            duration: 'quick',  preference: ['soup'],  restDayOnly: false },
      { id: 'd04', name: '鸡蛋灌饼',     emoji: '🥚', meal: ['breakfast'],            duration: 'quick',  preference: ['dry'],   restDayOnly: false },
      { id: 'd05', name: '煎饼果子',     emoji: '🌯', meal: ['breakfast'],            duration: 'quick',  preference: ['dry'],   restDayOnly: false },
      { id: 'd06', name: '燕麦牛奶',     emoji: '🥣', meal: ['breakfast'],            duration: 'quick',  preference: ['soup'],  restDayOnly: false },
      { id: 'd07', name: '馄饨',         emoji: '🥟', meal: ['breakfast','lunch'],    duration: 'quick',  preference: ['soup'],  restDayOnly: false },
      { id: 'd08', name: '小笼包',       emoji: '🥟', meal: ['breakfast','lunch'],    duration: 'quick',  preference: ['soup'],  restDayOnly: false },

      // 午餐
      { id: 'd09', name: '盖浇饭',       emoji: '🍚', meal: ['lunch','dinner'],       duration: 'quick',  preference: ['dry'],   restDayOnly: false },
      { id: 'd10', name: '兰州拉面',     emoji: '🍜', meal: ['lunch','dinner'],       duration: 'medium', preference: ['soup'],  restDayOnly: false },
      { id: 'd11', name: '黄焖鸡米饭',   emoji: '🍗', meal: ['lunch','dinner'],       duration: 'medium', preference: ['dry'],   restDayOnly: false },
      { id: 'd12', name: '麻辣烫',       emoji: '🌶️', meal: ['lunch','dinner'],       duration: 'medium', preference: ['soup'],  restDayOnly: false },
      { id: 'd13', name: '沙县拌面',     emoji: '🍝', meal: ['lunch'],                duration: 'quick',  preference: ['dry'],   restDayOnly: false },
      { id: 'd14', name: '炒饭',         emoji: '🍳', meal: ['lunch','dinner'],       duration: 'quick',  preference: ['dry'],   restDayOnly: false },
      { id: 'd15', name: '螺蛳粉',       emoji: '🍲', meal: ['lunch','dinner'],       duration: 'medium', preference: ['soup'],  restDayOnly: false },
      { id: 'd16', name: '饺子',         emoji: '🥟', meal: ['lunch','dinner'],       duration: 'medium', preference: ['dry'],   restDayOnly: false },
      { id: 'd17', name: '煲仔饭',       emoji: '🍲', meal: ['lunch','dinner'],       duration: 'medium', preference: ['dry'],   restDayOnly: false },
      { id: 'd18', name: '汉堡',         emoji: '🍔', meal: ['lunch','dinner'],       duration: 'quick',  preference: ['dry'],   restDayOnly: false },

      // 晚餐
      { id: 'd19', name: '火锅',         emoji: '🍲', meal: ['dinner'],               duration: 'long',   preference: ['gather','soup'], restDayOnly: false },
      { id: 'd20', name: '烧烤',         emoji: '🍢', meal: ['dinner'],               duration: 'long',   preference: ['gather','dry'],  restDayOnly: false },
      { id: 'd21', name: '烤肉',         emoji: '🥩', meal: ['dinner'],               duration: 'long',   preference: ['gather','dry'],  restDayOnly: false },
      { id: 'd22', name: '小龙虾',       emoji: '🦞', meal: ['dinner'],               duration: 'long',   preference: ['gather'],       restDayOnly: true  },
      { id: 'd23', name: '披萨',         emoji: '🍕', meal: ['dinner'],               duration: 'medium', preference: ['dry'],          restDayOnly: false },
      { id: 'd24', name: '寿司',         emoji: '🍣', meal: ['dinner'],               duration: 'medium', preference: ['dry'],          restDayOnly: false },
      { id: 'd25', name: '日式拉面',     emoji: '🍜', meal: ['dinner'],               duration: 'medium', preference: ['soup'],         restDayOnly: false },
      { id: 'd26', name: '家常炒菜',     emoji: '🥘', meal: ['dinner'],               duration: 'medium', preference: ['dry'],          restDayOnly: false },
      { id: 'd27', name: '砂锅粥',       emoji: '🍲', meal: ['dinner'],               duration: 'medium', preference: ['soup'],         restDayOnly: false },
      { id: 'd28', name: '炒米粉',       emoji: '🍝', meal: ['lunch','dinner'],       duration: 'quick',  preference: ['dry'],          restDayOnly: false },
      { id: 'd29', name: '麻辣香锅',     emoji: '🌶️', meal: ['dinner'],               duration: 'medium', preference: ['dry','soup'],   restDayOnly: false },
      { id: 'd30', name: '酸菜鱼',       emoji: '🐟', meal: ['dinner'],               duration: 'medium', preference: ['soup'],         restDayOnly: false },
    ];

    const STORAGE_DISHES = 'eatHtml_dishes';
    const STORAGE_HISTORY = 'eatHtml_history';
    const DURATION_LABEL = { quick: '⚡ 约 15 分钟内', medium: '⏱️ 约 15-45 分钟', long: '🕐 约 1 小时以上' };
    const PREF_LABEL = { dry: '干的', soup: '汤的', gather: '聚餐', any: '通用' };

    // ================= 数据层 =================
    let storageOK = true;
    function loadDishes() {
      try {
        const raw = localStorage.getItem(STORAGE_DISHES);
        if (!raw) {
          saveDishes(DEFAULT_DISHES);
          return [...DEFAULT_DISHES];
        }
        const arr = JSON.parse(raw);
        if (!Array.isArray(arr) || arr.length === 0) return [...DEFAULT_DISHES];
        return arr;
      } catch (e) {
        storageOK = false;
        return [...DEFAULT_DISHES];
      }
    }
    function saveDishes(arr) {
      try { localStorage.setItem(STORAGE_DISHES, JSON.stringify(arr)); }
      catch (e) { storageOK = false; toast('保存失败：浏览器存储不可用'); }
    }
    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(STORAGE_HISTORY) || '[]'); }
      catch (e) { return []; }
    }
    function saveHistory(arr) {
      try { localStorage.setItem(STORAGE_HISTORY, JSON.stringify(arr.slice(-20))); }
      catch (e) {}
    }

    // ================= 状态 =================
    let dishes = loadDishes();
    let state = {
      meal: getCurrentMeal(),
      dayType: 'workday',           // 'workday' | 'restday'
      prefs: new Set(),             // 偏好集合
      lastId: null,                 // 上一次推荐，避免重复
      recentIds: loadHistory(),      // 近期不喜欢的（弱降权）
      autoMeal: true,               // 餐别是否为自动推断
    };

    // ================= 时段推断 =================
    function getCurrentMeal() {
      const h = new Date().getHours();
      if (h >= 5  && h < 10) return 'breakfast';
      if (h >= 10 && h < 16) return 'lunch';
      if (h >= 16 && h < 22) return 'dinner';
      return 'dinner'; // 深夜兜底
    }

    // ================= 推荐算法 =================
    function recommend(meal, dayType, prefs, lastId) {
      // 第一轮：完整筛选
      let pool = filterPool(meal, dayType, prefs, false);
      // 第二轮：去掉偏好限制
      if (pool.length === 0) pool = filterPool(meal, dayType, new Set(), false);
      // 第三轮：放开 long 餐别限制（仅工作日午餐）
      if (pool.length === 0) pool = filterPool(meal, dayType, new Set(), true);
      if (pool.length === 0) return null;

      // 弱降权：上次推荐 / 近期不喜欢的
      const weighted = pool.map(d => {
        let w = 1;
        if (d.id === lastId) w *= 0.15;
        if (state.recentIds.includes(d.id)) w *= 0.4;
        return { d, w };
      });
      const total = weighted.reduce((s, x) => s + x.w, 0);
      let r = Math.random() * total;
      for (const x of weighted) {
        r -= x.w;
        if (r <= 0) return x.d;
      }
      return weighted[weighted.length - 1].d;
    }

    function filterPool(meal, dayType, prefs, allowLongForLunch) {
      return dishes.filter(d => {
        if (!d.meal || !d.meal.includes(meal)) return false;
        if (d.restDayOnly && dayType !== 'restday') return false;
        if (meal === 'lunch' && dayType === 'workday' && d.duration === 'long' && !allowLongForLunch) return false;
        if (prefs && prefs.size > 0) {
          // 偏好筛选：菜品的 preference 必须与用户偏好有交集，或包含 'any'
          const hit = (d.preference || []).some(p => p === 'any' || prefs.has(p));
          if (!hit) return false;
        }
        return true;
      });
    }

    // ================= 渲染：推荐结果 =================
    const $result = document.getElementById('result');
    function renderResult(dish) {
      $result.classList.remove('empty');
      const tags = (dish.preference || []).filter(p => p !== 'any').map(p =>
        `<span class="result-tag">${PREF_LABEL[p] || p}</span>`
      ).join('');
      $result.innerHTML = `
        <div class="result-emoji">${dish.emoji || '🍽️'}</div>
        <div class="result-name">${escapeHTML(dish.name)}</div>
        <div class="result-meta">
          <span class="result-tag">${DURATION_LABEL[dish.duration] || ''}</span>
          ${tags}
          ${dish.restDayOnly ? '<span class="result-tag">🌴 仅休息日</span>' : ''}
        </div>
      `;
      // 浮动 emoji 效果
      spawnFloatEmojis(dish.emoji || '✨');
    }

    function renderEmptyHint(hint) {
      $result.classList.add('empty');
      $result.innerHTML = `
        <div class="result-emoji">🥺</div>
        <div class="result-hint">${hint}</div>
      `;
    }

    function spawnFloatEmojis(emoji) {
      const rect = $result.getBoundingClientRect();
      const emojis = [emoji, emoji, emoji, '✨', '🎉'];
      for (let i = 0; i < 5; i++) {
        const el = document.createElement('div');
        el.className = 'float-emoji';
        el.textContent = emojis[i % emojis.length];
        el.style.left = (rect.left + 20 + Math.random() * (rect.width - 40)) + 'px';
        el.style.top  = (rect.top  + rect.height - 20) + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1700);
      }
    }

    // ================= 渲染：菜品库 =================
    const $dishList = document.getElementById('dishList');
    const $dishCount = document.getElementById('dishCount');
    function renderLibrary() {
      $dishCount.textContent = dishes.length;
      $dishList.innerHTML = dishes.map(d => {
        const meals = (d.meal || []).map(m => ({breakfast:'早', lunch:'中', dinner:'晚'}[m])).join('/');
        return `
          <li class="dish-item" data-id="${d.id}">
            <span class="e">${d.emoji || '🍽️'}</span>
            <span class="n">${escapeHTML(d.name)}</span>
            <span class="t">${meals} · ${DURATION_LABEL[d.duration]?.replace(/^[^\s]+\s/,'') || ''}</span>
            <button class="op" data-act="edit">✏️</button>
            <button class="op" data-act="del">🗑️</button>
          </li>
        `;
      }).join('');
    }

    // ================= 工具 =================
    function escapeHTML(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => t.classList.remove('show'), 1800);
    }

    // ================= 弹窗（新增/编辑） =================
    const $mask = document.getElementById('modalMask');
    const $modalTitle = document.getElementById('modalTitle');
    let editingId = null;
    let form = { meal: new Set(), duration: '', preference: new Set(), restDayOnly: false };

    function openModal(dish) {
      editingId = dish ? dish.id : null;
      $modalTitle.textContent = dish ? '编辑菜品' : '新增菜品';
      document.getElementById('fName').value  = dish ? dish.name  : '';
      document.getElementById('fEmoji').value = dish ? dish.emoji : '';
      form.meal = new Set(dish ? (dish.meal || []) : ['lunch']);
      form.duration = dish ? (dish.duration || 'medium') : 'medium';
      form.preference = new Set(dish ? (dish.preference || []) : ['any']);
      form.restDayOnly = dish ? !!dish.restDayOnly : false;
      refreshFormChips();
      $mask.classList.add('open');
    }
    function closeModal() { $mask.classList.remove('open'); editingId = null; }
    function refreshFormChips() {
      document.querySelectorAll('#fMeal .chip').forEach(c => {
        c.classList.toggle('active', form.meal.has(c.dataset.meal));
      });
      document.querySelectorAll('#fDuration .chip').forEach(c => {
        c.classList.toggle('active', c.dataset.dur === form.duration);
      });
      document.querySelectorAll('#fPref .chip').forEach(c => {
        c.classList.toggle('active', form.preference.has(c.dataset.pref));
      });
      document.querySelectorAll('#fRest .chip').forEach(c => {
        c.classList.toggle('active', (c.dataset.rest === 'true') === form.restDayOnly);
      });
    }

    // 弹窗内的 chip 点击
    document.getElementById('fMeal').addEventListener('click', e => {
      const c = e.target.closest('.chip'); if (!c) return;
      const m = c.dataset.meal;
      if (form.meal.has(m)) form.meal.delete(m); else form.meal.add(m);
      refreshFormChips();
    });
    document.getElementById('fDuration').addEventListener('click', e => {
      const c = e.target.closest('.chip'); if (!c) return;
      form.duration = c.dataset.dur;
      refreshFormChips();
    });
    document.getElementById('fPref').addEventListener('click', e => {
      const c = e.target.closest('.chip'); if (!c) return;
      const p = c.dataset.pref;
      if (form.preference.has(p)) form.preference.delete(p); else form.preference.add(p);
      refreshFormChips();
    });
    document.getElementById('fRest').addEventListener('click', e => {
      const c = e.target.closest('.chip'); if (!c) return;
      form.restDayOnly = (c.dataset.rest === 'true');
      refreshFormChips();
    });

    document.getElementById('mCancel').addEventListener('click', closeModal);
    $mask.addEventListener('click', e => { if (e.target === $mask) closeModal(); });

    document.getElementById('mSave').addEventListener('click', () => {
      const name = document.getElementById('fName').value.trim();
      const emoji = document.getElementById('fEmoji').value.trim() || '🍽️';
      if (!name) { toast('请填写菜名'); return; }
      if (form.meal.size === 0) { toast('至少选一个餐别'); return; }
      if (!form.duration) { toast('请选择耗时'); return; }
      if (form.preference.size === 0) { toast('请选择风格（至少一项）'); return; }

      const obj = {
        name, emoji,
        meal: Array.from(form.meal),
        duration: form.duration,
        preference: Array.from(form.preference),
        restDayOnly: form.restDayOnly,
      };

      if (editingId) {
        const idx = dishes.findIndex(d => d.id === editingId);
        if (idx >= 0) dishes[idx] = { ...dishes[idx], ...obj };
        toast('已更新');
      } else {
        obj.id = 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
        dishes.push(obj);
        toast('已添加');
      }
      saveDishes(dishes);
      renderLibrary();
      closeModal();
    });

    // ================= 事件绑定 =================
    // 餐别 pill
    document.getElementById('mealPills').addEventListener('click', e => {
      const c = e.target.closest('.pill'); if (!c) return;
      state.meal = c.dataset.meal;
      state.autoMeal = false;
      document.getElementById('mealPills').classList.remove('auto');
      document.querySelectorAll('#mealPills .pill').forEach(p =>
        p.classList.toggle('active', p === c)
      );
    });
    function highlightMeal() {
      document.querySelectorAll('#mealPills .pill').forEach(p =>
        p.classList.toggle('active', p.dataset.meal === state.meal)
      );
      document.getElementById('mealPills').classList.toggle('auto', state.autoMeal);
    }

    // 日期类型
    document.getElementById('dayTypeRow').addEventListener('click', e => {
      const c = e.target.closest('.chip'); if (!c) return;
      state.dayType = c.dataset.day;
      document.querySelectorAll('#dayTypeRow .chip').forEach(x =>
        x.classList.toggle('active', x === c)
      );
    });

    // 偏好
    document.getElementById('prefRow').addEventListener('click', e => {
      const c = e.target.closest('.chip'); if (!c) return;
      const p = c.dataset.pref;
      if (state.prefs.has(p)) state.prefs.delete(p); else state.prefs.add(p);
      c.classList.toggle('active');
    });

    // 主按钮
    document.getElementById('pickBtn').addEventListener('click', () => {
      const dish = recommend(state.meal, state.dayType, state.prefs, state.lastId);
      if (!dish) {
        renderEmptyHint('找不到合适的菜 😢<br/>试着放宽偏好或切换餐别～');
        document.getElementById('actionRow').style.display = 'none';
        return;
      }
      state.lastId = dish.id;
      renderResult(dish);
      document.getElementById('actionRow').style.display = 'flex';
    });

    // 换一换
    document.getElementById('rerollBtn').addEventListener('click', () => {
      // 换一换 = 把当前 lastId 视为不喜欢，加入 recent
      if (state.lastId && !state.recentIds.includes(state.lastId)) {
        state.recentIds.push(state.lastId);
        saveHistory(state.recentIds);
      }
      document.getElementById('pickBtn').click();
    });

    // 不喜欢
    document.getElementById('dislikeBtn').addEventListener('click', () => {
      if (state.lastId && !state.recentIds.includes(state.lastId)) {
        state.recentIds.push(state.lastId);
        saveHistory(state.recentIds);
        toast('记住了～下次会避开');
      }
      document.getElementById('pickBtn').click();
    });

    // 菜品库：折叠
    document.getElementById('libToggle').addEventListener('click', () => {
      const t = document.getElementById('libToggle');
      const p = document.getElementById('libPanel');
      t.classList.toggle('open');
      p.classList.toggle('open');
    });

    // 菜品库：新增
    document.getElementById('addBtn').addEventListener('click', () => openModal(null));

    // 菜品库：编辑 / 删除
    $dishList.addEventListener('click', e => {
      const op = e.target.closest('.op'); if (!op) return;
      const li = e.target.closest('.dish-item');
      const id = li.dataset.id;
      const dish = dishes.find(d => d.id === id);
      if (!dish) return;
      if (op.dataset.act === 'edit') {
        openModal(dish);
      } else if (op.dataset.act === 'del') {
        if (confirm(`确定删除「${dish.name}」吗？`)) {
          dishes = dishes.filter(d => d.id !== id);
          saveDishes(dishes);
          renderLibrary();
          toast('已删除');
        }
      }
    });

    // 恢复默认
    document.getElementById('resetBtn').addEventListener('click', () => {
      if (!confirm('确定恢复为内置默认菜品吗？\n（已添加的自定义菜品会被清除）')) return;
      dishes = [...DEFAULT_DISHES];
      saveDishes(dishes);
      renderLibrary();
      toast('已恢复默认');
    });

    // ================= 初始化 =================
    highlightMeal();
    renderLibrary();
    if (!storageOK) toast('浏览器存储不可用，数据无法保存');
  </script>
</body>
</html>
