<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>今日食 · 天时择餐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5EFE3;
    --paper-2:#EFE6D2;
    --ink:#1C1A17;
    --ink-soft:#3B352C;
    --cinnabar:#C8463B;
    --cinnabar-deep:#A1342B;
    --gilt:#B8893A;
    --gilt-soft:#D9B068;
    --indigo:#3A5A6B;
    --indigo-soft:#6E8B9A;
    --line:rgba(28,26,23,.12);
    --line-gold:rgba(184,137,58,.45);
    --card:rgba(255,252,244,.86);
    --shadow:0 24px 60px -28px rgba(28,26,23,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Noto Sans SC",system-ui,sans-serif;
    color:var(--ink);
    background:var(--paper);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }
  /* ===== atmosphere layers ===== */
  .atmo{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    transition:background 1.2s ease;
  }
  .atmo::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(1200px 700px at 80% -10%, rgba(184,137,58,.10), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(58,90,107,.10), transparent 60%);
  }
  .atmo.sunny{background:linear-gradient(180deg,#F8E9C7 0%,#F5EFE3 45%,#EFE6D2 100%)}
  .atmo.rainy{background:linear-gradient(180deg,#C9D2D6 0%,#D8DDE0 45%,#E7E5DE 100%)}
  .atmo.snowy{background:linear-gradient(180deg,#E4E9EE 0%,#EDF0F2 45%,#F3EEE2 100%)}
  .atmo.cloudy{background:linear-gradient(180deg,#D8D4CB 0%,#E2DDD2 45%,#EFE6D2 100%)}
  .atmo.foggy{background:linear-gradient(180deg,#CFCCC4 0%,#DCD8CE 45%,#EBE3D2 100%)}
  .atmo.thunder{background:linear-gradient(180deg,#6B6660 0%,#8B847A 45%,#B6AC9C 100%)}
  #particles{position:fixed;inset:0;z-index:1;pointer-events:none}

  /* paper grain */
  .grain{
    position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.5;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.11  0 0 0 0 0.10  0 0 0 0 0.09  0 0 0 0.06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    mix-blend-mode:multiply;
  }

  /* ===== layout ===== */
  .wrap{
    position:relative;z-index:5;
    max-width:1080px;margin:0 auto;
    padding:28px 32px 80px;
  }

  /* top term bar */
  .termbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 22px;
    background:linear-gradient(90deg,rgba(28,26,23,.92),rgba(28,26,23,.82));
    color:var(--paper);
    border:1px solid var(--gilt);
    border-radius:2px;
    box-shadow:0 8px 30px -16px rgba(0,0,0,.5);
    transform:translateY(-12px);opacity:0;
    animation:slideIn .8s .1s cubic-bezier(.2,.8,.2,1) forwards;
    position:relative;
  }
  .termbar::before,.termbar::after{
    content:"";position:absolute;top:6px;bottom:6px;width:1px;background:var(--gilt-soft);opacity:.6;
  }
  .termbar::before{left:10px}.termbar::after{right:10px}
  .term-left{display:flex;align-items:baseline;gap:14px}
  .term-name{font-family:"Ma Shan Zheng",cursive;font-size:26px;color:var(--gilt-soft);letter-spacing:2px}
  .term-date{font-family:"Fraunces",serif;font-size:13px;letter-spacing:.5px;opacity:.78}
  .term-right{display:flex;align-items:center;gap:10px;font-size:14px}
  .term-right .wicon{width:22px;height:22px;display:inline-block}
  .term-right .temp{font-family:"Fraunces",serif;font-size:18px;color:var(--gilt-soft)}

  /* hero heading */
  .hero{
    text-align:center;margin:46px 0 30px;
    position:relative;
  }
  .hero .kicker{
    font-family:"Fraunces",serif;font-style:italic;font-size:14px;letter-spacing:4px;
    color:var(--gilt);text-transform:uppercase;margin-bottom:10px;
  }
  .hero h1{
    font-family:"Noto Serif SC",serif;font-weight:900;
    font-size:clamp(54px,8vw,104px);line-height:.95;letter-spacing:6px;
    color:var(--ink);
  }
  .hero h1 .accent{color:var(--cinnabar)}
  .hero .sub{
    margin-top:14px;font-size:15px;color:var(--ink-soft);letter-spacing:2px;
  }
  .hero .sub span{color:var(--cinnabar);font-weight:500}
  .seal{
    position:absolute;right:6%;top:-8px;
    width:62px;height:62px;border:2px solid var(--cinnabar);
    color:var(--cinnabar);font-family:"Ma Shan Zheng",cursive;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;line-height:1;text-align:center;
    transform:rotate(8deg);
    background:rgba(245,239,227,.4);
    box-shadow:0 0 0 4px rgba(200,70,59,.08);
  }
  .seal small{display:block;font-size:11px;letter-spacing:1px;margin-top:2px}

  /* scene switcher */
  .switcher{
    margin:0 auto 38px;max-width:760px;
    background:var(--card);border:1px solid var(--line);
    border-radius:4px;padding:14px 18px;
    backdrop-filter:blur(6px);
    box-shadow:0 10px 30px -22px rgba(28,26,23,.4);
    display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center;
  }
  .switcher .group{display:flex;align-items:center;gap:8px}
  .switcher .label{
    font-size:12px;letter-spacing:3px;color:var(--ink-soft);
    border-right:1px solid var(--line-gold);padding-right:12px;
  }
  .chip{
    font-family:"Noto Sans SC",sans-serif;font-size:13px;
    padding:6px 14px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:var(--ink-soft);
    transition:all .25s ease;letter-spacing:1px;
  }
  .chip:hover{border-color:var(--gilt);color:var(--ink)}
  .chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* main dish card */
  .stage{
    position:relative;perspective:1600px;
    min-height:430px;display:flex;justify-content:center;align-items:center;
  }
  .dish{
    width:100%;max-width:760px;
    background:var(--card);
    border:1px solid var(--line-gold);
    border-radius:6px;
    box-shadow:var(--shadow);
    padding:42px 46px 38px;
    position:relative;
    transform-style:preserve-3d;
    backface-visibility:hidden;
    transition:transform .7s cubic-bezier(.2,.85,.25,1),opacity .35s ease;
  }
  .dish.flipping{transform:rotateY(90deg);opacity:0}
  .dish::before{
    content:"";position:absolute;inset:8px;border:1px solid var(--line-gold);border-radius:3px;pointer-events:none;
  }
  .dish .corner{
    position:absolute;width:34px;height:34px;border:2px solid var(--cinnabar);
  }
  .corner.tl{top:-1px;left:-1px;border-right:none;border-bottom:none}
  .corner.tr{top:-1px;right:-1px;border-left:none;border-bottom:none}
  .corner.bl{bottom:-1px;left:-1px;border-right:none;border-top:none}
  .corner.br{bottom:-1px;right:-1px;border-left:none;border-top:none}

  .dish-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px}
  .dish-tags{display:flex;gap:8px;flex-wrap:wrap}
  .tag{
    font-size:12px;letter-spacing:2px;padding:4px 12px;border-radius:2px;
    background:rgba(184,137,58,.14);color:var(--gilt);border:1px solid var(--line-gold);
  }
  .tag.cal-high{background:rgba(200,70,59,.12);color:var(--cinnabar);border-color:rgba(200,70,59,.3)}
  .tag.cal-mid{background:rgba(184,137,58,.14);color:var(--gilt)}
  .tag.cal-low{background:rgba(58,90,107,.12);color:var(--indigo);border-color:rgba(58,90,107,.3)}
  .dish-emoji{font-size:64px;line-height:1;filter:drop-shadow(0 8px 12px rgba(0,0,0,.18))}

  .dish-name{
    font-family:"Noto Serif SC",serif;font-weight:900;
    font-size:clamp(40px,5.4vw,68px);line-height:1.05;letter-spacing:4px;
    color:var(--ink);margin:6px 0 4px;
  }
  .dish-cuisine{
    font-family:"Fraunces",serif;font-style:italic;font-size:14px;color:var(--gilt);letter-spacing:2px;
  }
  .dish-desc{
    margin-top:18px;font-size:16px;line-height:1.9;color:var(--ink-soft);
    border-left:2px solid var(--cinnabar);padding-left:16px;
    font-family:"Noto Serif SC",serif;font-weight:400;
  }

  /* rationale panel */
  .rationale{
    margin-top:26px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;
  }
  .reason{
    padding:16px 14px;background:rgba(255,252,244,.6);border:1px solid var(--line);
    border-radius:4px;text-align:center;
    transition:transform .3s ease,border-color .3s ease;
  }
  .reason:hover{transform:translateY(-3px);border-color:var(--gilt)}
  .reason .ricon{font-size:22px;margin-bottom:6px}
  .reason .rtitle{font-size:12px;letter-spacing:3px;color:var(--gilt);margin-bottom:6px}
  .reason .rtext{font-size:13px;color:var(--ink-soft);line-height:1.6}

  /* action row */
  .actions{margin-top:30px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
  .btn{
    font-family:"Noto Serif SC",serif;font-weight:600;font-size:15px;letter-spacing:4px;
    padding:13px 30px;border-radius:3px;cursor:pointer;border:1px solid var(--ink);
    transition:all .25s ease;display:inline-flex;align-items:center;gap:10px;
  }
  .btn.primary{background:var(--cinnabar);color:var(--paper);border-color:var(--cinnabar);box-shadow:0 10px 24px -14px rgba(200,70,59,.7)}
  .btn.primary:hover{background:var(--cinnabar-deep);transform:translateY(-2px)}
  .btn.primary:active{transform:translateY(0)}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn.ghost:hover{background:var(--ink);color:var(--paper)}
  .btn .spin{display:none;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  .btn.loading .spin{display:inline-block}
  .btn.loading .btxt{opacity:.8}

  /* backup three */
  .backup{margin-top:46px}
  .backup-head{
    display:flex;align-items:center;gap:14px;margin-bottom:18px;
  }
  .backup-head .line{flex:1;height:1px;background:var(--line-gold)}
  .backup-head h3{
    font-family:"Noto Serif SC",serif;font-weight:700;font-size:18px;letter-spacing:6px;color:var(--ink);
  }
  .backup-head .en{font-family:"Fraunces",serif;font-style:italic;font-size:12px;color:var(--gilt)}
  .backup-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .alt{
    background:var(--card);border:1px solid var(--line);border-radius:4px;
    padding:20px 18px;cursor:pointer;text-align:center;
    transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease;
    position:relative;
  }
  .alt:hover{transform:translateY(-6px);box-shadow:0 18px 36px -22px rgba(28,26,23,.5);border-color:var(--gilt)}
  .alt .aemoji{font-size:36px}
  .alt .aname{font-family:"Noto Serif SC",serif;font-weight:700;font-size:20px;margin-top:8px;letter-spacing:2px}
  .alt .acui{font-family:"Fraunces",serif;font-style:italic;font-size:11px;color:var(--gilt);margin-top:4px}
  .alt .apick{
    margin-top:10px;font-size:11px;letter-spacing:2px;color:var(--cinnabar);
    border-top:1px dashed var(--line-gold);padding-top:8px;
  }

  /* food verse */
  .verse{
    margin:60px auto 0;max-width:680px;text-align:center;
    padding:30px 24px;
    opacity:0;transform:translateY(10px);
    animation:fadeUp 1s .3s ease forwards;
  }
  .verse .deco{font-family:"Fraunces",serif;color:var(--gilt);font-size:14px;letter-spacing:6px}
  .verse p{
    font-family:"Ma Shan Zheng",cursive;font-size:clamp(22px,2.6vw,30px);
    color:var(--ink);letter-spacing:4px;line-height:1.8;margin:12px 0;
  }
  .verse .stamp{
    display:inline-block;margin-top:10px;
    font-family:"Ma Shan Zheng",cursive;font-size:14px;color:var(--cinnabar);
    border:1.5px solid var(--cinnabar);padding:3px 10px;border-radius:2px;
    transform:rotate(-3deg);
  }

  /* footer */
  footer{
    margin-top:60px;text-align:center;
    font-family:"Fraunces",serif;font-size:12px;color:var(--ink-soft);letter-spacing:3px;
    opacity:.7;
  }
  footer .dot{color:var(--cinnabar)}

  /* loading poem overlay during reroll */
  .poem-flash{
    position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
    pointer-events:none;opacity:0;transition:opacity .25s ease;
  }
  .poem-flash.show{opacity:1}
  .poem-flash span{
    font-family:"Ma Shan Zheng",cursive;font-size:30px;color:var(--cinnabar);
    letter-spacing:8px;background:rgba(245,239,227,.7);padding:14px 26px;border-radius:4px;
    box-shadow:0 10px 30px -16px rgba(0,0,0,.4);
  }

  /* animations */
  @keyframes slideIn{to{transform:translateY(0);opacity:1}}
  @keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

  .reveal{opacity:0;transform:translateY(14px);animation:fadeUp .7s ease forwards}

  /* responsive */
  @media (max-width:760px){
    .wrap{padding:18px 16px 60px}
    .seal{display:none}
    .termbar{flex-direction:column;gap:8px;align-items:flex-start}
    .dish{padding:30px 22px 26px}
    .rationale{grid-template-columns:1fr;gap:10px}
    .backup-grid{grid-template-columns:1fr}
    .dish-emoji{font-size:48px}
  }
</style>
</head>
<body>
<div class="atmo sunny" id="atmo"></div>
<canvas id="particles"></canvas>
<div class="grain"></div>

<div class="wrap">
  <!-- top term bar -->
  <div class="termbar" id="termbar">
    <div class="term-left">
      <span class="term-name" id="termName">小暑</span>
      <span class="term-date" id="termDate">JUL · 02</span>
    </div>
    <div class="term-right">
      <span class="wicon" id="wIcon"></span>
      <span id="wText">晴</span>
      <span class="temp" id="temp">28°</span>
      <span style="opacity:.5">|</span>
      <span id="dayType">工作日</span>
    </div>
  </div>

  <!-- hero -->
  <header class="hero">
    <div class="kicker">Tian Shi Ze Can · 2026</div>
    <h1>今日<span class="accent">食</span></h1>
    <p class="sub">以天时择餐 · <span id="heroHint">晴日宜清鲜</span></p>
    <div class="seal">天时<small>择餐</small></div>
  </header>

  <!-- scene switcher -->
  <div class="switcher">
    <div class="group">
      <span class="label">天气</span>
      <button class="chip active" data-w="sunny">晴</button>
      <button class="chip" data-w="cloudy">阴</button>
      <button class="chip" data-w="rainy">雨</button>
      <button class="chip" data-w="snowy">雪</button>
      <button class="chip" data-w="foggy">雾</button>
      <button class="chip" data-w="thunder">雷</button>
    </div>
    <div class="group">
      <span class="label">日子</span>
      <button class="chip active" data-d="工作日">工作日</button>
      <button class="chip" data-d="周末">周末</button>
      <button class="chip" data-d="节假日">节假日</button>
    </div>
  </div>

  <!-- main dish stage -->
  <div class="stage">
    <article class="dish" id="dish">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>

      <div class="dish-head">
        <div>
          <div class="dish-tags" id="dishTags"></div>
          <h2 class="dish-name" id="dishName">—</h2>
          <div class="dish-cuisine" id="dishCuisine">—</div>
        </div>
        <div class="dish-emoji" id="dishEmoji">🍽️</div>
      </div>

      <p class="dish-desc" id="dishDesc">—</p>

      <div class="rationale" id="rationale"></div>

      <div class="actions">
        <button class="btn primary" id="reroll"><span class="spin"></span><span class="btxt">换 一 道</span></button>
        <button class="btn ghost" id="surprise">天意随选</button>
      </div>
    </article>
  </div>

  <!-- backup three -->
  <section class="backup">
    <div class="backup-head">
      <span class="line"></span>
      <h3>备 选 三 连</h3>
      <span class="en">Alternatives</span>
      <span class="line"></span>
    </div>
    <div class="backup-grid" id="altGrid"></div>
  </section>

  <!-- food verse -->
  <section class="verse" id="verse">
    <div class="deco">— 今 日 食 签 —</div>
    <p id="verseText">夜雨剪春韭，新炊间黄粱。</p>
    <span class="stamp">食有时</span>
  </section>

  <footer>今日食 · 天时择餐 <span class="dot">·</span> 创造力大赛参赛作品 <span class="dot">·</span> 2026</footer>
</div>

<div class="poem-flash" id="poemFlash"><span>天意斟酌中…</span></div>

<script>
/* ============ DATA: 24 solar terms (approx Gregorian) ============ */
const SOLAR_TERMS = [
  ["小寒",1,5],["大寒",1,20],
  ["立春",2,4],["雨水",2,19],
  ["惊蛰",3,6],["春分",3,21],
  ["清明",4,5],["谷雨",4,20],
  ["立夏",5,6],["小满",5,21],
  ["芒种",6,6],["夏至",6,21],
  ["小暑",7,7],["大暑",7,23],
  ["立秋",8,8],["处暑",8,23],
  ["白露",9,8],["秋分",9,23],
  ["寒露",10,8],["霜降",10,23],
  ["立冬",11,7],["小雪",11,22],
  ["大雪",12,7],["冬至",12,22]
];

/* fixed-date holidays (month/day) */
const HOLIDAYS = {
  "1-1":"元旦","2-14":"情人节","3-8":"妇女节","5-1":"劳动节",
  "6-1":"儿童节","10-1":"国庆","12-25":"圣诞节","12-31":"跨年夜"
};

/* food verses per weather */
const VERSES = {
  sunny:"日高人渴漫思茶，一盏清鲜最宜人。",
  cloudy:"云淡风轻近午天，傍花随柳过前川。",
  rainy:"夜雨剪春韭，新炊间黄粱。",
  snowy:"绿蚁新醅酒，红泥小火炉。",
  foggy:"雾失楼台月迷津，一盏温汤最解忧。",
  thunder:"雷动风行惊蛰后，一锅沸汤暖人心。"
};

const HERO_HINT = {
  sunny:"晴日宜清鲜",cloudy:"阴天宜浓香",rainy:"雨日宜暖汤",
  snowy:"雪日宜沸锅",foggy:"雾日宜温粥",thunder:"雷夜宜酣畅"
};

const TEMP_RANGE = {
  sunny:[24,33],cloudy:[18,26],rainy:[14,22],snowy:[-4,3],foggy:[8,16],thunder:[20,28]
};

/* weather icons (inline svg) */
const W_ICONS = {
  sunny:`<svg viewBox="0 0 24 24" fill="none" stroke="#D9B068" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.2" fill="#D9B068" stroke="none"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7"/></svg>`,

/* ============ STATE ============ */
let state = {
  weather:"sunny",
  dayType:"工作日",
  current:null,
  exclude:[]  // recently shown ids to avoid repeat
};

/* ============ ENGINE: solar term + holiday ============ */
function getSolarTerm(date){
  const m=date.getMonth()+1, d=date.getDate();
  let term = SOLAR_TERMS[0];
  for(const t of SOLAR_TERMS){
    if(t[1]<m || (t[1]===m && t[2]<=d)) term=t;
    else break;
  }
  // find next term for "将至"
  return term[0];
}
function getHoliday(date){
  const m=date.getMonth()+1, d=date.getDate();
  return HOLIDAYS[`${m}-${d}`] || null;
}
function getDayType(date){
  const dow = date.getDay();
  if(dow===0 || dow===6) return "周末";
  return "工作日";
}

/* ============ ENGINE: weighted random ============ */
function scoreDish(dish, weather, dayType){
  const w = dish.wf[weather] ?? 2;
  const h = dish.hf[dayType] ?? 2;
  return w*1.5 + h*1.2 + Math.random()*1.2;
}
function pickDishes(weather, dayType, count, excludeIds){
  const pool = DISHES.filter(d=>!excludeIds.includes(d.id));
  const scored = pool.map(d=>({d, s:scoreDish(d,weather,dayType)}));
  scored.sort((a,b)=>b.s-a.s);
  return scored.slice(0,count).map(x=>x.d);
}
function pickOne(weather, dayType, excludeIds){
  const pool = DISHES.filter(d=>!excludeIds.includes(d.id));
  if(pool.length===0){ excludeIds.length=0; return pickOne(weather,dayType,excludeIds); }
  const scored = pool.map(d=>({d, s:scoreDish(d,weather,dayType)}));
  const total = scored.reduce((a,b)=>a+b.s,0);
  let r = Math.random()*total;
  for(const x of scored){ r-=x.s; if(r<=0) return x.d; }
  return scored[0].d;
}

/* ============ RENDER ============ */
function reasonText(dish, weather, dayType){
  const wMap = {
    sunny:"晴日当空，宜清鲜不腻",cloudy:"阴云低压，宜浓香暖胃",
    rainy:"细雨连绵，宜一锅热汤",snowy:"飞雪满天，宜沸锅暖身",
    foggy:"雾气迷蒙，宜温润一盏",thunder:"雷动风骤，宜酣畅重口"
  };
  const dMap = {
    "工作日":"工作日里，宜快手省事","周末":"周末闲暇，宜慢慢享用",
    "节假日":"节庆之时，宜有仪式之感"
  };
  const moodText = dish.mood.slice(0,2).join("·");
  return [
    {icon:W_ICONS[weather],title:"天 时",text:wMap[weather]},
    {icon:`<svg viewBox="0 0 24 24" fill="none" stroke="#B8893A" stroke-width="1.6"><rect x="4" y="5" width="16" height="15" rx="1.5"/><path d="M4 9h16M8 3v4M16 3v4" stroke-linecap="round"/></svg>`,title:"日 子",text:dMap[dayType]},
    {icon:`<svg viewBox="0 0 24 24" fill="none" stroke="#C8463B" stroke-width="1.6"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z" fill="rgba(200,70,59,.12)"/></svg>`,title:"心 情",text:`此菜宜「${moodText}」`}
  ];
}

function renderDish(dish, animate){
  const el = document.getElementById("dish");
  const apply = ()=>{
    document.getElementById("dishName").textContent = dish.name;
    document.getElementById("dishEmoji").textContent = dish.emoji;
    document.getElementById("dishCuisine").textContent = dish.cuisine;
    document.getElementById("dishDesc").textContent = dish.desc;
    const tags = document.getElementById("dishTags");
    tags.innerHTML = "";
    const calClass = dish.cal==="高"?"cal-high":dish.cal==="低"?"cal-low":"cal-mid";
    tags.innerHTML = `<span class="tag">${dish.cuisine.split(" ")[0]}</span><span class="tag ${calClass}">热量·${dish.cal}</span>`;
    const rat = document.getElementById("rationale");
    rat.innerHTML = "";
    reasonText(dish,state.weather,state.dayType).forEach(r=>{
      const div=document.createElement("div");
      div.className="reason reveal";
      div.style.animationDelay=(0.15+Math.random()*0.1)+"s";
      div.innerHTML=`<div class="ricon">${r.icon}</div><div class="rtitle">${r.title}</div><div class="rtext">${r.text}</div>`;
      rat.appendChild(div);
    });
  };
  if(animate){
    el.classList.add("flipping");
    setTimeout(()=>{ apply(); el.classList.remove("flipping"); }, 380);
  } else { apply(); }
}

function renderBackup(excludeIds){
  const alts = pickDishes(state.weather, state.dayType, 3, excludeIds);
  const grid = document.getElementById("altGrid");
  grid.innerHTML="";
  alts.forEach((a,i)=>{
    const div=document.createElement("div");
    div.className="alt reveal";
    div.style.animationDelay=(0.1+i*0.08)+"s";
    div.innerHTML=`
      <div class="aemoji">${a.emoji}</div>
      <div class="aname">${a.name}</div>
      <div class="acui">${a.cuisine}</div>
      <div class="apick">点 此 一 鍵 换 上</div>`;
    div.addEventListener("click",()=>{
      state.exclude = [state.current.id, ...alts.map(x=>x.id)].slice(0,6);
      state.current = a;
      renderDish(a, true);
      renderBackup([a.id, ...alts.filter(x=>x.id!==a.id).map(x=>x.id)]);
      flashVerse();
    });
    grid.appendChild(div);
  });
}

function flashVerse(){
  const pf = document.getElementById("poemFlash");
  pf.querySelector("span").textContent = "天意斟酌中…";
  pf.classList.add("show");
  setTimeout(()=>pf.classList.remove("show"), 520);
}

function updateVerse(){
  document.getElementById("verseText").textContent = VERSES[state.weather];
}

function updateAtmo(){
  document.getElementById("atmo").className = "atmo " + state.weather;
  startParticles();
}

function updateTermbar(){
  const now = new Date();
  const term = getSolarTerm(now);
  const hol = getHoliday(now);
  const m = String(now.getMonth()+1).padStart(2,"0");
  const d = String(now.getDate()).padStart(2,"0");
  const monEng = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"][now.getMonth()];
  document.getElementById("termName").textContent = hol || term;
  document.getElementById("termDate").textContent = `${monEng} · ${d}`;
  // weather icon & temp
  document.getElementById("wIcon").innerHTML = W_ICONS[state.weather];
  const wText = {sunny:"晴",cloudy:"阴",rainy:"雨",snowy:"雪",foggy:"雾",thunder:"雷"}[state.weather];
  document.getElementById("wText").textContent = wText;
  const [lo,hi] = TEMP_RANGE[state.weather];
  const temp = Math.round(lo + Math.random()*(hi-lo));
  document.getElementById("temp").textContent = temp + "°";
  // day type
  document.getElementById("dayType").textContent = hol?`节假·${hol}`:(state.dayType==="工作日"?"工作日":state.dayType);
  // hero hint
  document.getElementById("heroHint").textContent = HERO_HINT[state.weather];
}

/* ============ PARTICLES ============ */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
let particles = [];
let rafId = null;
function resizeCanvas(){ canvas.width=innerWidth; canvas.height=innerHeight; }
addEventListener("resize", resizeCanvas);

function startParticles(){
  resizeCanvas();
  cancelAnimationFrame(rafId);
  particles = [];
  const W = canvas.width, H = canvas.height;
  const type = state.weather;
  const count = type==="sunny"? 28 : type==="rainy"? 120 : type==="snowy"? 90 : type==="foggy"? 14 : type==="thunder"? 80 : 18;
  for(let i=0;i<count;i++){
    particles.push(makeParticle(type, W, H));
  }
  loop(type);
}
function makeParticle(type, W, H){
  if(type==="sunny"){
    return {x:Math.random()*W, y:Math.random()*H, r:Math.random()*3+1, vy:-Math.random()*0.3-0.1, a:Math.random()*0.5+0.2, type};
  }
  if(type==="rainy"){
    return {x:Math.random()*W, y:Math.random()*H, len:Math.random()*14+8, vy:Math.random()*6+8, vx:-1.5, type};
  }
  if(type==="snowy"){
    return {x:Math.random()*W, y:Math.random()*H, r:Math.random()*3+1.5, vy:Math.random()*1+0.5, vx:Math.random()*0.6-0.3, a:Math.random()*0.7+0.3, sw:Math.random()*0.02+0.01, ph:Math.random()*Math.PI*2, type};
  }
  if(type==="foggy"){
    return {x:Math.random()*W, y:Math.random()*H, r:Math.random()*80+60, vx:Math.random()*0.3-0.15, a:Math.random()*0.05+0.02, type};
  }
  if(type==="thunder"){
    return {x:Math.random()*W, y:Math.random()*H, len:Math.random()*16+10, vy:Math.random()*7+9, vx:-2, type};
  }
  // cloudy
  return {x:Math.random()*W, y:Math.random()*H*0.5, r:Math.random()*60+40, vx:Math.random()*0.2+0.05, a:Math.random()*0.05+0.02, type};
}
function loop(type){
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  for(const p of particles){
    if(type==="sunny"){
      ctx.beginPath();
      ctx.fillStyle = `rgba(217,176,104,${p.a})`;
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
      p.y+=p.vy; p.x+=Math.sin(p.y*0.01)*0.2;
      if(p.y<-10){p.y=H+10;p.x=Math.random()*W;}
    } else if(type==="rainy"){
      ctx.strokeStyle="rgba(58,90,107,0.45)";
      ctx.lineWidth=1.2;
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+p.vx*2,p.y+p.len);ctx.stroke();
      p.y+=p.vy; p.x+=p.vx;
      if(p.y>H){p.y=-p.len;p.x=Math.random()*W;}
    } else if(type==="snowy"){
      ctx.beginPath();
      ctx.fillStyle=`rgba(255,255,255,${p.a})`;
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
      p.y+=p.vy; p.x+=Math.sin(p.ph)*0.5+p.vx; p.ph+=p.sw;
      if(p.y>H+10){p.y=-10;p.x=Math.random()*W;}
    } else if(type==="foggy"){
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
      g.addColorStop(0,`rgba(220,216,206,${p.a})`);
      g.addColorStop(1,"rgba(220,216,206,0)");
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
      p.x+=p.vx; if(p.x>W+p.r)p.x=-p.r;
    } else if(type==="thunder"){
      ctx.strokeStyle="rgba(255,235,200,0.5)";
      ctx.lineWidth=1.4;
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+p.vx*2,p.y+p.len);ctx.stroke();
      p.y+=p.vy; p.x+=p.vx;
      if(p.y>H){p.y=-p.len;p.x=Math.random()*W;}
      // occasional flash
      if(Math.random()<0.003){
        ctx.fillStyle="rgba(255,245,210,0.25)";
        ctx.fillRect(0,0,W,H);
      }
    } else { // cloudy
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
      g.addColorStop(0,`rgba(255,255,255,${p.a})`);
      g.addColorStop(1,"rgba(255,255,255,0)");
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
      p.x+=p.vx; if(p.x>W+p.r)p.x=-p.r;
    }
  }
  rafId = requestAnimationFrame(()=>loop(type));
}

/* ============ EVENTS ============ */
function bindChips(){
  document.querySelectorAll(".chip[data-w]").forEach(c=>{
    c.addEventListener("click",()=>{
      document.querySelectorAll(".chip[data-w]").forEach(x=>x.classList.remove("active"));
      c.classList.add("active");
      state.weather = c.dataset.w;
      rerollAll(true);
    });
  });
  document.querySelectorAll(".chip[data-d]").forEach(c=>{
    c.addEventListener("click",()=>{
      document.querySelectorAll(".chip[data-d]").forEach(x=>x.classList.remove("active"));
      c.classList.add("active");
      state.dayType = c.dataset.d;
      rerollAll(true);
    });
  });
  document.getElementById("reroll").addEventListener("click",(e)=>{
    const btn = e.currentTarget;
    btn.classList.add("loading");
    flashVerse();
    setTimeout(()=>{
      state.exclude = [state.current.id, ...state.exclude].slice(0,6);
      state.current = pickOne(state.weather, state.dayType, state.exclude);
      renderDish(state.current, true);
      renderBackup([state.current.id]);
      btn.classList.remove("loading");
    }, 420);
  });
  document.getElementById("surprise").addEventListener("click",()=>{
    // random weather + day
    const ws=["sunny","cloudy","rainy","snowy","foggy","thunder"];
    const ds=["工作日","周末","节假日"];
    state.weather = ws[Math.floor(Math.random()*ws.length)];
    state.dayType = ds[Math.floor(Math.random()*ds.length)];
    document.querySelectorAll(".chip[data-w]").forEach(x=>x.classList.toggle("active", x.dataset.w===state.weather));
    document.querySelectorAll(".chip[data-d]").forEach(x=>x.classList.toggle("active", x.dataset.d===state.dayType));
    rerollAll(true);
  });
}

function rerollAll(updateScene){
  if(updateScene){
    updateAtmo();
    updateVerse();
    updateTermbar();
  }
  state.exclude = [];
  state.current = pickOne(state.weather, state.dayType, state.exclude);
  renderDish(state.current, true);
  renderBackup([state.current.id]);
}

/* ============ INIT ============ */
function init(){
  // infer from system date
  const now = new Date();
  const hol = getHoliday(now);
  state.dayType = hol ? "节假日" : getDayType(now);
  document.querySelectorAll(".chip[data-d]").forEach(x=>x.classList.toggle("active", x.dataset.d===state.dayType));
  // default weather by month (rough)
  const m = now.getMonth()+1;
  let defW = "sunny";
  if(m===12||m===1||m===2) defW="snowy";
  else if(m===6||m===7||m===8) defW="sunny";
  else if(m===3||m===4) defW="rainy";
  else defW="cloudy";
  state.weather = defW;
  document.querySelectorAll(".chip[data-w]").forEach(x=>x.classList.toggle("active", x.dataset.w===defW));

  bindChips();
  updateAtmo();
  updateVerse();
  updateTermbar();
  state.current = pickOne(state.weather, state.dayType, []);
  renderDish(state.current, false);
  renderBackup([state.current.id]);
}
init();
</script>
