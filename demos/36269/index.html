<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>文案小助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #FF6B6B;
    --primary-light: #FFE0E0;
    --bg: #F5F5F7;
    --card: #FFFFFF;
    --text: #1D1D1F;
    --text2: #6E6E73;
    --text3: #AEAEB2;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --radius: 16px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding-bottom: env(safe-area-inset-bottom, 20px);
  }
  .phone-frame {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    background: var(--bg);
    position: relative;
    overflow-x: hidden;
  }
  /* 顶部导航 */
  .nav-bar {
    position: sticky; top: 0; z-index: 100;
    background: linear-gradient(135deg, #FF6B6B 0%, #FF8E8E 100%);
    padding: 48px 20px 20px;
    border-radius: 0 0 24px 24px;
    box-shadow: 0 4px 20px rgba(255,107,107,0.25);
  }
  .nav-bar h1 {
    color: #fff; font-size: 22px; font-weight: 700; text-align: center;
    letter-spacing: 1px;
  }
  .nav-bar p {
    color: rgba(255,255,255,0.85); font-size: 13px; text-align: center;
    margin-top: 4px;
  }
  /* 内容区 */
  .content { padding: 20px 16px 100px; }
  /* 场景选择 */
  .section-title {
    font-size: 15px; font-weight: 600; color: var(--text);
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 6px;
  }
  .section-title .icon { font-size: 18px; }
  .scene-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 24px;
  }
  .scene-item {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 12px 4px;
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: all 0.25s;
    border: 2px solid transparent;
    user-select: none;
  }
  .scene-item:active { transform: scale(0.95); }
  .scene-item.active {
    border-color: var(--primary);
    background: var(--primary-light);
  }
  .scene-item .emoji { font-size: 28px; line-height: 1; }
  .scene-item .label { font-size: 12px; color: var(--text2); font-weight: 500; }
  .scene-item.active .label { color: var(--primary); font-weight: 600; }

  /* 风格标签 */
  .style-tags {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-bottom: 24px;
  }
  .style-tag {
    padding: 7px 16px;
    border-radius: 20px;
    font-size: 13px;
    background: var(--card);
    color: var(--text2);
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: all 0.25s;
    border: 1.5px solid transparent;
    user-select: none;
  }
  .style-tag:active { transform: scale(0.95); }
  .style-tag.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
    box-shadow: 0 2px 12px rgba(255,107,107,0.3);
  }

  /* 输入区 */
  .input-area {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }
  .input-area textarea {
    width: 100%; border: none; outline: none; resize: none;
    font-size: 15px; line-height: 1.6;
    color: var(--text);
    background: transparent;
    font-family: inherit;
    min-height: 80px;
  }
  .input-area textarea::placeholder { color: var(--text3); }
  .input-hint {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 10px; padding-top: 10px;
    border-top: 1px solid #F0F0F0;
  }
  .input-hint span { font-size: 12px; color: var(--text3); }
  .img-upload {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--primary);
    cursor: pointer; padding: 4px 10px;
    border-radius: 8px;
    transition: background 0.2s;
  }
  .img-upload:hover { background: var(--primary-light); }

  /* 生成按钮 */
  .gen-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(255,107,107,0.35);
    transition: all 0.3s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 24px;
  }
  .gen-btn:active { transform: scale(0.97); box-shadow: 0 2px 10px rgba(255,107,107,0.3); }
  .gen-btn:disabled {
    opacity: 0.6; cursor: not-allowed;
  }
  .gen-btn .spinner {
    width: 18px; height: 18px;
    border: 2.5px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .gen-btn.loading .spinner { display: block; }
  .gen-btn.loading .btn-text { display: none; }
  .gen-btn.loading .loading-text { display: inline; }
  .loading-text { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 结果卡片 */
  .results { display: none; }
  .results.show { display: block; }
  .result-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
    position: relative;
    animation: fadeUp 0.4s ease both;
    overflow: hidden;
  }
  .result-card::before {
    content: '';
    position: absolute; top: 0; left: 0;
    width: 4px; height: 100%;
    border-radius: 4px 0 0 4px;
  }
  .result-card:nth-child(1)::before { background: linear-gradient(180deg, #FF6B6B, #FF8E53); }
  .result-card:nth-child(2)::before { background: linear-gradient(180deg, #6B9FFF, #53C1FF); }
  .result-card:nth-child(3)::before { background: linear-gradient(180deg, #A78BFA, #C084FC); }
  .result-card:nth-child(4)::before { background: linear-gradient(180deg, #34D399, #6EE7B7); }
  .result-card:nth-child(5)::before { background: linear-gradient(180deg, #FBBF24, #FCD34D); }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .result-card:nth-child(1) { animation-delay: 0s; }
  .result-card:nth-child(2) { animation-delay: 0.08s; }
  .result-card:nth-child(3) { animation-delay: 0.16s; }
  .result-card:nth-child(4) { animation-delay: 0.24s; }
  .result-card:nth-child(5) { animation-delay: 0.32s; }
  .result-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px;
    border-radius: 8px;
    font-size: 12px; font-weight: 700; color: #fff;
    margin-bottom: 10px;
  }
  .result-card:nth-child(1) .result-num { background: linear-gradient(135deg, #FF6B6B, #FF8E53); }
  .result-card:nth-child(2) .result-num { background: linear-gradient(135deg, #6B9FFF, #53C1FF); }
  .result-card:nth-child(3) .result-num { background: linear-gradient(135deg, #A78BFA, #C084FC); }
  .result-card:nth-child(4) .result-num { background: linear-gradient(135deg, #34D399, #6EE7B7); }
  .result-card:nth-child(5) .result-num { background: linear-gradient(135deg, #FBBF24, #FCD34D); }
  .result-text {
    font-size: 15px; line-height: 1.8; color: var(--text);
    margin-bottom: 12px;
    white-space: pre-line;
  }
  .result-actions {
    display: flex; gap: 8px; justify-content: flex-end;
  }
  .action-btn {
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 12px;
    border: 1.5px solid #E5E5EA;
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 4px;
  }
  .action-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
  .action-btn.copied { border-color: #34D399; color: #059669; background: #ECFDF5; }

  /* 底部 */
  .footer {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: var(--text3);
  }

  /* Toast */
  .toast {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(0,0,0,0.75);
    color: #fff;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 14px;
    opacity: 0;
    transition: all 0.3s;
    z-index: 999;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* 历史记录浮层 */
  .history-fab {
    position: fixed;
    bottom: 30px; right: calc(50% - 200px);
    width: 50px; height: 50px;
    border-radius: 50%;
    background: linear-gradient(135deg, #FF6B6B, #FF8E53);
    color: #fff;
    border: none;
    box-shadow: 0 4px 16px rgba(255,107,107,0.4);
    font-size: 22px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s;
    z-index: 50;
  }
  .history-fab:active { transform: scale(0.9); }
  @media (max-width: 420px) {
    .history-fab { right: 16px; }
  }

  /* 历史面板 */
  .history-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .history-overlay.show { opacity: 1; pointer-events: auto; }
  .history-panel {
    position: fixed; bottom: 0; left: 50%;
    transform: translateX(-50%) translateY(100%);
    width: 100%; max-width: 420px;
    max-height: 70vh;
    background: var(--bg);
    border-radius: 20px 20px 0 0;
    z-index: 201;
    transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .history-overlay.show .history-panel { transform: translateX(-50%) translateY(0); }
  .history-header {
    padding: 16px 20px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #E5E5EA;
  }
  .history-header h3 { font-size: 17px; font-weight: 600; }
  .history-close {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: #E5E5EA;
    border: none;
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .history-list {
    flex: 1; overflow-y: auto;
    padding: 12px 16px;
  }
  .history-item {
    background: var(--card);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
  }
  .history-item .hi-scene {
    font-size: 12px; color: var(--primary); font-weight: 600;
    margin-bottom: 6px;
  }
  .history-item .hi-text {
    font-size: 14px; color: var(--text); line-height: 1.6;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .history-item .hi-time {
    font-size: 11px; color: var(--text3); margin-top: 6px;
  }
  .history-empty {
    text-align: center; padding: 40px 0;
    color: var(--text3); font-size: 14px;
  }
  .clear-history-btn {
    margin: 10px 16px 20px;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: #F2F2F7;
    color: var(--primary);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="phone-frame">
  <!-- 导航栏 -->
  <div class="nav-bar">
    <h1>✨ 文案小助手</h1>
    <p>朋友圈文案，一键生成</p>
  </div>

  <div class="content">
    <!-- 场景选择 -->
    <div class="section-title"><span class="icon">📸</span> 选择场景</div>
    <div class="scene-grid" id="sceneGrid">
      <div class="scene-item active" data-scene="美食">
        <span class="emoji">🍜</span><span class="label">美食</span>
      </div>
      <div class="scene-item" data-scene="旅行">
        <span class="emoji">✈️</span><span class="label">旅行</span>
      </div>
      <div class="scene-item" data-scene="自拍">
        <span class="emoji">🤳</span><span class="label">自拍</span>
      </div>
      <div class="scene-item" data-scene="日常">
        <span class="emoji">☀️</span><span class="label">日常</span>
      </div>
      <div class="scene-item" data-scene="聚会">
        <span class="emoji">🎉</span><span class="label">聚会</span>
      </div>
      <div class="scene-item" data-scene="运动">
        <span class="emoji">🏃</span><span class="label">运动</span>
      </div>
      <div class="scene-item" data-scene="工作">
        <span class="emoji">💼</span><span class="label">工作</span>
      </div>
      <div class="scene-item" data-scene="节日">
        <span class="emoji">🎊</span><span class="label">节日</span>
      </div>
    </div>

    <!-- 风格选择 -->
    <div class="section-title"><span class="icon">🎨</span> 选择风格</div>
    <div class="style-tags" id="styleTags">
      <span class="style-tag active" data-style="文艺">🌿 文艺</span>
      <span class="style-tag" data-style="幽默">😂 幽默</span>
      <span class="style-tag" data-style="励志">💪 励志</span>
      <span class="style-tag" data-style="浪漫">💕 浪漫</span>
      <span class="style-tag" data-style="高级">✨ 高级</span>
      <span class="style-tag" data-style="沙雕">🤪 沙雕</span>
      <span class="style-tag" data-style="古风">🏮 古风</span>
      <span class="style-tag" data-style="治愈">🌈 治愈</span>
    </div>

    <!-- 输入区 -->
    <div class="section-title"><span class="icon">💡</span> 描述一下（可选）</div>
    <div class="input-area">
      <textarea id="userInput" placeholder="例如：周末和闺蜜在咖啡店喝下午茶，拍了好看的照片..." maxlength="200"></textarea>
      <div class="input-hint">
        <span id="charCount">0/200</span>
        <label class="img-upload">
          📷 模拟上传
          <input type="file" accept="image/*" style="display:none" onchange="handleImage(this)">
        </label>
      </div>
    </div>
    <div id="imagePreview" style="display:none; margin-bottom:20px;">
      <div style="display:flex;align-items:center;gap:8px;background:var(--card);padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);">
        <span style="font-size:32px;">🖼️</span>
        <span style="flex:1;font-size:13px;color:var(--text2);" id="imageName">image.jpg</span>
        <span style="color:var(--primary);cursor:pointer;font-size:13px;" onclick="removeImage()">移除</span>
      </div>
    </div>

    <!-- 生成按钮 -->
    <button class="gen-btn" id="genBtn" onclick="generate()">
      <span class="btn-text">✨ 一键生成文案</span>
      <div class="spinner"></div>
      <span class="loading-text">灵感飞来中...</span>
    </button>

    <!-- 结果区 -->
    <div class="results" id="results">
      <div class="section-title"><span class="icon">📝</span> 为你生成的文案</div>
      <div id="resultCards"></div>
    </div>

    <div class="footer">文案小助手 · 让每条朋友圈都有灵魂 ✨</div>
  </div>
</div>

<!-- 历史记录浮层 -->
<button class="history-fab" onclick="toggleHistory()" title="历史记录">📋</button>
<div class="history-overlay" id="historyOverlay" onclick="closeHistory(event)">
  <div class="history-panel" onclick="event.stopPropagation()">
    <div class="history-header">
      <h3>📋 历史记录</h3>
      <button class="history-close" onclick="toggleHistory()">✕</button>
    </div>
    <div class="history-list" id="historyList"></div>
    <button class="clear-history-btn" onclick="clearHistory()">🗑️ 清空历史</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ========== 文案素材库 ==========
const corpus = {
  "美食": {
    "文艺": [
      "人间烟火气，最抚凡人心。\n一碗热汤，是生活最温柔的回答。",
      "把日子过成诗，从认真对待每一餐开始。\n食物是最低成本的浪漫。",
      "味蕾上的旅行，不需要机票。\n一口就能抵达远方。",
      "厨房是最小的教堂，\n每一道菜都是虔诚的祈祷。",
      "世间万物，唯有美食与爱不可辜负。\n今天的胃，是幸福的形状。"
    ],
    "幽默": [
      "我不是在吃，就是在去吃的路上。\n人生苦短，再来一碗！🍜",
      "减肥？明天再说吧。\n毕竟今天的我，只负责快乐。😋",
      "卡路里是明天的事，\n今天我只负责：好吃！😍",
      "吃货的人生没有低谷，\n只有「饿了」和「撑了」。",
      "体重不会骗你，\n它忠实地记录了你的每一次快乐。🤫"
    ],
    "励志": [
      "好好吃饭，是对自己最基本的尊重。\n吃饱了，才有力气追逐梦想。",
      "认真对待每一餐的人，\n运气都不会太差。",
      "生活需要仪式感，\n而仪式感从一碗用心准备的美食开始。",
      "能治愈你的不是时间，\n是热气腾腾的饭菜和永远等你回家的人。",
      "做自己的大厨，\n把平淡的日子炒出幸福的味道。"
    ],
    "浪漫": [
      "想和你一起吃很多很多顿饭，\n从早餐到晚餐，从青丝到白发。💕",
      "你是我见过最美的风景，\n比面前这桌美食还要美一万倍。",
      "你做的饭，是我这辈子\n吃过最好吃的米其林。🌹",
      "余生很长，我想和你\n一起吃遍人间烟火。",
      "爱是想触碰又收回的手，\n也是想夹给你又不好意思的鸡腿。💗"
    ],
    "高级": [
      "味蕾的极致体验，\n是对平庸日常最优雅的叛逆。",
      "食物是连接记忆与当下的桥梁，\n每一口都是时间的琥珀。",
      "精致不是价格，\n而是你对待生活的态度。",
      "在烟火人间里，\n做一个优雅的食客。",
      "味觉是最诚实的感官，\n它从不辜负每一次用心。"
    ],
    "沙雕": [
      "干饭人干饭魂！\n今天也是努力干饭的一天！🍚💨",
      "肚子：我饱了\n嘴巴：不你没有\n脑子：听嘴巴的",
      "我的胃说它还能再战！\n服务员：您的第三份已上桌 🫡",
      "别问好不好吃\n盘子都被我舔干净了你说呢 😂",
      "吃的时候有多快乐\n上秤的时候就有多沉默 🤡"
    ],
    "古风": [
      "人间有味是清欢，\n一盏茶、一箸菜，皆是风雅。",
      "食一碗人间烟火，\n饮几杯岁月长歌。",
      "粗茶淡饭随缘过，\n万水千山只等闲。",
      "红尘万丈，不及一盏清茶、\n两碟小菜、三两知己。",
      "民以食为天，\n我以筷为剑，仗剑走天涯。"
    ],
    "治愈": [
      "再难过的事，吃完这顿就好了。\n胃暖了，心也就暖了。🌸",
      "生活的解药，\n有时候只是一碗热汤面。",
      "没有什么是一顿好吃的解决不了的，\n如果有，那就两顿。🌈",
      "当你不知道吃什么的时候，\n就吃你最喜欢的吧。快乐最重要。",
      "一个人也要好好吃饭，\n因为你在的地方就是家。🏠"
    ]
  },

// ========== 状态管理 ==========
let currentScene = '美食';
let currentStyle = '文艺';
let history = JSON.parse(localStorage.getItem('copyHistory') || '[]');

// ========== 场景选择 ==========
document.getElementById('sceneGrid').addEventListener('click', e => {
  const item = e.target.closest('.scene-item');
  if (!item) return;
  document.querySelectorAll('.scene-item').forEach(el => el.classList.remove('active'));
  item.classList.add('active');
  currentScene = item.dataset.scene;
});

// ========== 风格选择 ==========
document.getElementById('styleTags').addEventListener('click', e => {
  const tag = e.target.closest('.style-tag');
  if (!tag) return;
  document.querySelectorAll('.style-tag').forEach(el => el.classList.remove('active'));
  tag.classList.add('active');
  currentStyle = tag.dataset.style;
});

// ========== 输入计数 ==========
document.getElementById('userInput').addEventListener('input', e => {
  document.getElementById('charCount').textContent = `${e.target.value.length}/200`;
});

// ========== 图片处理 ==========
function handleImage(input) {
  if (input.files && input.files[0]) {
    document.getElementById('imagePreview').style.display = 'block';
    document.getElementById('imageName').textContent = input.files[0].name;
  }
}
function removeImage() {
  document.getElementById('imagePreview').style.display = 'none';
  document.querySelector('.img-upload input').value = '';
}

// ========== 生成文案 ==========
function generate() {
  const btn = document.getElementById('genBtn');
  if (btn.disabled) return;
  btn.classList.add('loading');
  btn.disabled = true;

  const pool = corpus[currentScene]?.[currentStyle] || corpus['日常']['文艺'];
  const userInput = document.getElementById('userInput').value.trim();

  // 模拟 AI 生成延迟
  setTimeout(() => {
    const results = [];
    const shuffled = [...pool].sort(() => Math.random() - 0.5);
    const count = Math.min(5, shuffled.length);

    for (let i = 0; i < count; i++) {
      let text = shuffled[i];
      // 如果有用户输入，可能会融合一些关键词
      if (userInput && i === 0) {
        const keywords = extractKeywords(userInput);
        if (keywords.length > 0) {
          text = `「${keywords.join('·')}」\n\n${text}`;
        }
      }
      results.push(text);
    }

    renderResults(results);
    saveHistory(results);

    btn.classList.remove('loading');
    btn.disabled = false;
  }, 1200 + Math.random() * 800);
}

function extractKeywords(text) {
  const stopWords = new Set(['的','了','在','是','我','和','有','不','这','那','一个','很','也','就','都','而','但','对','到','说','要','会','去','能','让','把','被','从','给','以','与','及','等','之','其','或','如果','因为','所以','虽然','但是']);
  return text.split(/[，。！？、\s,.\-]+/)
    .map(s => s.trim())
    .filter(s => s.length >= 2 && !stopWords.has(s))
    .slice(0, 3);
}

function renderResults(results) {
  const container = document.getElementById('resultCards');
  container.innerHTML = results.map((text, i) => `
    <div class="result-card">
      <div class="result-num">${i + 1}</div>
      <div class="result-text">${escapeHtml(text)}</div>
      <div class="result-actions">
        <button class="action-btn" onclick="copyText(this, ${i})">📋 复制</button>
        <button class="action-btn" onclick="regenOne(${i})">🔄 换一条</button>
      </div>
    </div>
  `).join('');
  document.getElementById('results').classList.add('show');
  // 存储当前结果供后续操作
  window._currentResults = results;
  // 滚动到结果区
  setTimeout(() => {
    document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ========== 复制 ==========
function copyText(btn, index) {
  const text = window._currentResults[index];
  navigator.clipboard.writeText(text).then(() => {
    btn.classList.add('copied');
    btn.innerHTML = '✅ 已复制';
    showToast('文案已复制到剪贴板');
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '📋 复制';
    }, 2000);
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.classList.add('copied');
    btn.innerHTML = '✅ 已复制';
    showToast('文案已复制到剪贴板');
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '📋 复制';
    }, 2000);
  });
}

// ========== 换一条 ==========
function regenOne(index) {
  const pool = corpus[currentScene]?.[currentStyle] || corpus['日常']['文艺'];
  const current = window._currentResults[index];
  let newText = pool[Math.floor(Math.random() * pool.length)];
  // 尽量避免重复
  let tries = 0;
  while (newText === current && tries < 5) {
    newText = pool[Math.floor(Math.random() * pool.length)];
    tries++;
  }
  window._currentResults[index] = newText;
  const card = document.querySelectorAll('.result-card')[index];
  card.querySelector('.result-text').textContent = newText;
  card.style.animation = 'none';
  card.offsetHeight; // reflow
  card.style.animation = 'fadeUp 0.4s ease both';
  showToast('已为你换了一条新文案 ✨');
}

// ========== 历史记录 ==========
function saveHistory(results) {
  const now = new Date();
  const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const entry = {
    scene: currentScene,
    style: currentStyle,
    results: results,
    time: timeStr
  };
  history.unshift(entry);
  if (history.length > 50) history = history.slice(0, 50);
  localStorage.setItem('copyHistory', JSON.stringify(history));
}

function toggleHistory() {
  const overlay = document.getElementById('historyOverlay');
  const isShowing = overlay.classList.contains('show');
  if (isShowing) {
    overlay.classList.remove('show');
  } else {
    renderHistory();
    overlay.classList.add('show');
  }
}
function closeHistory(e) {
  if (e.target === e.currentTarget) {
    document.getElementById('historyOverlay').classList.remove('show');
  }
}
function renderHistory() {
  const list = document.getElementById('historyList');
  if (history.length === 0) {
    list.innerHTML = '<div class="history-empty">📭 暂无历史记录<br>快去生成文案吧～</div>';
    return;
  }
  list.innerHTML = history.map(h => `
    <div class="history-item">
      <div class="hi-scene">${h.scene} · ${h.style}</div>
      <div class="hi-text">${escapeHtml(h.results[0] || '')}</div>
      <div class="hi-time">${h.time}</div>
    </div>
  `).join('');
}
function clearHistory() {
  if (confirm('确定要清空所有历史记录吗？')) {
    history = [];
    localStorage.removeItem('copyHistory');
    renderHistory();
    showToast('历史记录已清空');
  }
}

// ========== Toast ==========
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
}
