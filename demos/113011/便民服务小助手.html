<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>便民服务小助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f6fa;
            color: #333;
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 页面容器 */
        .page {
            display: none;
            min-height: 100vh;
            padding-bottom: 20px;
        }
        .page.active { display: block; }

        /* 顶部导航栏 */
        .header {
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            color: white;
            padding: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .header h1 { font-size: 18px; font-weight: 600; }
        .back-btn {
            background: rgba(255,255,255,0.25);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
            display: none;
        }
        .back-btn.visible { display: inline-block; }

        /* 搜索框 */
        .search-box {
            background: white;
            border-radius: 24px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .search-box input {
            border: none;
            outline: none;
            flex: 1;
            font-size: 14px;
            color: #333;
        }
        .search-box input::placeholder { color: #999; }
        .search-icon { color: #999; font-size: 16px; }

        /* 首页内容 */
        .home-content { padding: 16px; }

        /* 定位提示 */
        .location-bar {
            background: white;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #555;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .location-bar .loc-icon { color: #ff6b35; font-size: 18px; }
        .location-bar .loc-text { flex: 1; }
        .location-bar .loc-change {
            color: #ff6b35;
            font-size: 13px;
            cursor: pointer;
        }

        /* 分类图标栏 */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .category-item {
            background: white;
            border-radius: 14px;
            padding: 16px 8px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .category-item:active { transform: scale(0.96); }
        .category-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
            font-size: 24px;
        }
        .cat1 .category-icon { background: #fff3e6; }
        .cat2 .category-icon { background: #e6f7ff; }
        .cat3 .category-icon { background: #f0ffe6; }
        .cat4 .category-icon { background: #f3e6ff; }
        .category-item p { font-size: 12px; color: #555; font-weight: 500; }

        /* 大入口按钮 */
        .main-btn {
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 18px;
            width: 100%;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(255,107,53,0.3);
            transition: transform 0.2s;
        }
        .main-btn:active { transform: scale(0.98); }

        /* 快捷服务标签 */
        .quick-tags {
            margin-top: 20px;
        }
        .section-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
        }
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tag {
            background: white;
            border: 1px solid #eee;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tag:active { background: #fff3e6; border-color: #ff6b35; color: #ff6b35; }

        /* 师傅列表页 */
        .list-content { padding: 12px; }
        .sort-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 4px 12px;
            font-size: 13px;
            color: #666;
        }
        .sort-bar span { color: #ff6b35; font-weight: 500; }

        /* 师傅卡片 */
        .master-card {
            background: white;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .shop-name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }
        .shop-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: #888;
        }
        .rating {
            color: #ff9500;
            font-weight: 600;
        }
        .distance {
            background: #fff3e6;
            color: #ff6b35;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .services {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 10px 0;
        }
        .service-tag {
            background: #f5f6fa;
            color: #666;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
        }
        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
            padding: 10px 0;
            border-top: 1px dashed #eee;
            border-bottom: 1px dashed #eee;
            font-size: 13px;
            color: #666;
        }
        .price { color: #ff6b35; font-weight: 600; font-size: 15px; }
        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn {
            flex: 1;
            padding: 11px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.97); }
        .btn-outline {
            background: white;
            border: 1.5px solid #ff6b35;
            color: #ff6b35;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            color: white;
        }

        /* 下单页 */
        .order-content { padding: 16px; }
        .form-card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            display: block;
        }
        .form-label .required { color: #ff6b35; margin-left: 2px; }
        .service-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .service-option {
            border: 1.5px solid #eee;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            color: #555;
        }
        .service-option.selected {
            border-color: #ff6b35;
            background: #fff8f5;
            color: #ff6b35;
            font-weight: 600;
        }
        .service-option .opt-price {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        .service-option.selected .opt-price { color: #ff6b35; }

        .input-field {
            width: 100%;
            padding: 14px;
            border: 1.5px solid #eee;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        .input-field:focus { border-color: #ff6b35; }
        textarea.input-field { resize: none; min-height: 80px; }

        .time-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .time-option {
            border: 1.5px solid #eee;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            color: #555;
        }
        .time-option.selected {
            border-color: #ff6b35;
            background: #fff8f5;
            color: #ff6b35;
            font-weight: 500;
        }

        .submit-area {
            padding: 16px;
            position: sticky;
            bottom: 0;
            background: #f5f6fa;
        }
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(255,107,53,0.3);
            transition: transform 0.2s;
        }
        .submit-btn:active { transform: scale(0.98); }
        .submit-btn:disabled {
            background: #ccc;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* 弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white;
            border-radius: 20px;
            padding: 32px 24px;
            text-align: center;
            max-width: 320px;
            width: 100%;
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-icon {
            width: 64px;
            height: 64px;
            background: #e6f9ed;
            color: #22c55e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 16px;
        }
        .modal h3 { font-size: 18px; margin-bottom: 8px; }
        .modal p { font-size: 14px; color: #666; margin-bottom: 20px; }
        .modal-btn {
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 32px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
        }

        /* 订单记录 */
        .order-item {
            background: white;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .order-info { flex: 1; }
        .order-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
        .order-time { font-size: 12px; color: #999; }
        .order-status {
            background: #fff3e6;
            color: #ff6b35;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 500;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- 页面1：首页 -->
    <div class="page active" id="page-home">
        <div class="header">
            <div class="header-top">
                <h1>便民服务小助手</h1>
            </div>
            <div class="search-box">
                <span class="search-icon">&#128269;</span>
                <input type="text" placeholder="搜索配钥匙、修鞋、修拉链..." id="homeSearch">
            </div>
        </div>
        <div class="home-content">
            <div class="location-bar">
                <span class="loc-icon">&#128205;</span>
                <span class="loc-text">当前定位：<strong id="currentLoc">阳光花园小区</strong></span>
                <span class="loc-change" onclick="changeLoc()">切换</span>
            </div>

            <div class="category-grid">
                <div class="category-item cat1" onclick="goList('修鞋补鞋')">
                    <div class="category-icon">&#128094;</div>
                    <p>修鞋补鞋</p>
                </div>
                <div class="category-item cat2" onclick="goList('配钥匙')">
                    <div class="category-icon">&#128273;</div>
                    <p>配钥匙</p>
                </div>
                <div class="category-item cat3" onclick="goList('衣物缝补')">
                    <div class="category-icon">&#9986;</div>
                    <p>衣物缝补</p>
                </div>
                <div class="category-item cat4" onclick="goList('小家电维修')">
                    <div class="category-icon">&#9889;</div>
                    <p>小家电维修</p>
                </div>
            </div>

            <button class="main-btn" onclick="goList()">
                <span>&#128205;</span>
                查看附近师傅
            </button>

            <div class="quick-tags">
                <div class="section-title">热门服务</div>
                <div class="tags">
                    <span class="tag" onclick="goList('皮鞋换底')">皮鞋换底</span>
                    <span class="tag" onclick="goList('配防盗门钥匙')">配防盗门钥匙</span>
                    <span class="tag" onclick="goList('改裤脚')">改裤脚</span>
                    <span class="tag" onclick="goList('电饭煲维修')">电饭煲维修</span>
                    <span class="tag" onclick="goList('拉链更换')">拉链更换</span>
                    <span class="tag" onclick="goList('配车钥匙')">配车钥匙</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 页面2：师傅列表 -->
    <div class="page" id="page-list">
        <div class="header">
            <div class="header-top">
                <button class="back-btn visible" onclick="goHome()">&#10094; 返回</button>
                <h1>附近师傅</h1>
                <span></span>
            </div>
            <div class="search-box">
                <span class="search-icon">&#128269;</span>
                <input type="text" placeholder="搜索服务或门店..." id="listSearch">
            </div>
        </div>
        <div class="list-content">
            <div class="sort-bar">
                <span id="resultCount">共 10 位师傅</span>
                <span>按距离由近到远 &#8595;</span>
            </div>
            <div id="masterList"></div>
        </div>
    </div>

    <!-- 页面3：下单页 -->
    <div class="page" id="page-order">
        <div class="header">
            <div class="header-top">
                <button class="back-btn visible" onclick="goList()">&#10094; 返回</button>
                <h1>预约下单</h1>
                <span></span>
            </div>
        </div>
        <div class="order-content">
            <div class="form-card">
                <label class="form-label">选择服务项目<span class="required">*</span></label>
                <div class="service-options" id="serviceOptions"></div>
            </div>

            <div class="form-card">
                <label class="form-label">详细地址<span class="required">*</span></label>
                <textarea class="input-field" id="addressInput" placeholder="请输入小区名称、楼栋号、门牌号..."></textarea>
            </div>

            <div class="form-card">
                <label class="form-label">预约时间<span class="required">*</span></label>
                <div class="time-options" id="timeOptions"></div>
            </div>

            <div class="form-card">
                <label class="form-label">备注需求（选填）</label>
                <textarea class="input-field" id="remarkInput" placeholder="请描述具体问题，如：鞋底开裂、拉链卡住..."></textarea>
            </div>

            <div class="form-card">
                <label class="form-label">联系手机<span class="required">*</span></label>
                <input type="tel" class="input-field" id="phoneInput" placeholder="请输入手机号">
            </div>

            <div style="height: 20px;"></div>
        </div>
        <div class="submit-area">
            <button class="submit-btn" onclick="submitOrder()">提交订单</button>
        </div>
    </div>

    <!-- 页面4：订单记录（额外提供） -->
    <div class="page" id="page-orders">
        <div class="header">
            <div class="header-top">
                <button class="back-btn visible" onclick="goHome()">&#10094; 返回</button>
                <h1>我的订单</h1>
                <span></span>
            </div>
        </div>
        <div class="order-content" id="ordersList">
            <div class="empty-state">暂无订单记录</div>
        </div>
    </div>

    <!-- 弹窗 -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-icon">&#10003;</div>
            <h3>下单成功！</h3>
            <p>师傅将尽快接单并与您联系，请保持手机畅通。</p>
            <button class="modal-btn" onclick="closeModal()">我知道了</button>
        </div>
    </div>

    <script>
        // ===================== 测试数据 =====================
        const masters = [
            { name: "张师傅修鞋铺", distance: "0.3km", rating: 4.9, services: ["皮鞋换底", "运动鞋修补", "拉链更换", "皮带打孔"], price: "¥15起", hours: "08:00-20:00", tag: "修鞋补鞋" },
            { name: "老李配钥匙", distance: "0.5km", rating: 4.8, services: ["配防盗门钥匙", "配车钥匙", "配信箱钥匙", "换锁芯"], price: "¥10起", hours: "07:30-21:00", tag: "配钥匙" },
            { name: "王姐缝补店", distance: "0.6km", rating: 4.7, services: ["改裤脚", "换拉链", "缝补破洞", "改衣服尺寸"], price: "¥8起", hours: "09:00-19:00", tag: "衣物缝补" },
            { name: "家电维修刘师傅", distance: "0.8km", rating: 4.6, services: ["电饭煲维修", "电水壶维修", "电风扇维修", "微波炉维修"], price: "¥30起", hours: "08:30-20:30", tag: "小家电维修" },
            { name: "便民综合维修站", distance: "1.0km", rating: 4.5, services: ["修鞋", "配钥匙", "缝补", "小家电"], price: "¥10起", hours: "08:00-21:00", tag: "综合" },
            { name: "赵记修鞋匠", distance: "1.2km", rating: 4.8, services: ["皮鞋保养", "鞋底更换", "鞋面修补", "运动鞋清洗"], price: "¥20起", hours: "09:00-18:00", tag: "修鞋补鞋" },
            { name: "快捷配钥匙中心", distance: "1.3km", rating: 4.7, services: ["智能锁钥匙", "车钥匙", "门禁卡复制", "保险箱钥匙"], price: "¥15起", hours: "08:00-22:00", tag: "配钥匙" },
            { name: "巧手裁缝铺", distance: "1.5km", rating: 4.9, services: ["定制改衣", "旗袍修改", "西装修改", "窗帘加工"], price: "¥25起", hours: "09:00-20:00", tag: "衣物缝补" },
            { name: "电器快修王", distance: "1.8km", rating: 4.4, services: ["电磁炉维修", "豆浆机维修", "加湿器维修", "榨汁机维修"], price: "¥25起", hours: "08:00-20:00", tag: "小家电维修" },
            { name: "社区便民服务站", distance: "2.0km", rating: 4.6, services: ["修鞋", "配钥匙", "缝补", "家电"], price: "¥8起", hours: "07:00-21:00", tag: "综合" }
        ];

        const allServices = [
            { name: "皮鞋换底", price: "¥25起" },
            { name: "运动鞋修补", price: "¥15起" },
            { name: "配防盗门钥匙", price: "¥15起" },
            { name: "配车钥匙", price: "¥50起" },
            { name: "改裤脚", price: "¥10起" },
            { name: "换拉链", price: "¥8起" },
            { name: "电饭煲维修", price: "¥35起" },
            { name: "电水壶维修", price: "¥25起" }
        ];

        const timeSlots = [
            "今天 14:00-16:00",
            "今天 16:00-18:00",
            "今天 18:00-20:00",
            "明天 08:00-10:00",
            "明天 10:00-12:00",
            "明天 14:00-16:00"
        ];

        let selectedService = "";
        let selectedTime = "";
        let selectedMaster = null;

        // ===================== 页面切换 =====================
        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            window.scrollTo(0, 0);
        }

        function goHome() {
            showPage('page-home');
        }

        function goList(filter) {
            showPage('page-list');
            renderMasters(filter);
        }

        function goOrder(master) {
            selectedMaster = master;
            showPage('page-order');
            renderServiceOptions(master);
            renderTimeOptions();
            selectedService = "";
            selectedTime = "";
            document.getElementById('addressInput').value = '';
            document.getElementById('remarkInput').value = '';
            document.getElementById('phoneInput').value = '';
        }

        // ===================== 首页 =====================
        function changeLoc() {
            const locs = ["阳光花园小区", "锦绣家园", "幸福里社区", "万科城", "保利花园"];
            const current = document.getElementById('currentLoc').textContent;
            let idx = locs.indexOf(current);
            idx = (idx + 1) % locs.length;
            document.getElementById('currentLoc').textContent = locs[idx];
        }

        document.getElementById('homeSearch').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') goList(this.value);
        });

        // ===================== 师傅列表 =====================
        function renderMasters(filter) {
            let list = [...masters];
            if (filter) {
                const f = filter.toLowerCase();
                list = list.filter(m =>
                    m.name.includes(filter) ||
                    m.services.some(s => s.includes(filter)) ||
                    m.tag.includes(filter)
                );
            }

            document.getElementById('resultCount').textContent = `共 ${list.length} 位师傅`;
            const container = document.getElementById('masterList');

            if (list.length === 0) {
                container.innerHTML = '<div class="empty-state">未找到相关师傅</div>';
                return;
            }

            container.innerHTML = list.map(m => `
                <div class="master-card">
                    <div class="card-header">
                        <div>
                            <div class="shop-name">${m.name}</div>
                            <div class="shop-meta">
                                <span class="rating">&#9733; ${m.rating}</span>
                                <span>${m.hours}</span>
                            </div>
                        </div>
                        <span class="distance">${m.distance}</span>
                    </div>
                    <div class="services">
                        ${m.services.map(s => `<span class="service-tag">${s}</span>`).join('')}
                    </div>
                    <div class="price-row">
                        <span>统一标价</span>
                        <span class="price">${m.price}</span>
                    </div>
                    <div class="card-actions">
                        <button class="btn btn-outline" onclick="alert('导航功能：前往 ${m.name}')">到店维修</button>
                        <button class="btn btn-primary" onclick='goOrder(${JSON.stringify(m).replace(/'/g, "&#39;")})'>预约上门</button>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('listSearch').addEventListener('input', function() {
            renderMasters(this.value);
        });

        // ===================== 下单页 =====================
        function renderServiceOptions(master) {
            const container = document.getElementById('serviceOptions');
            const services = master ? master.services.map((s, i) => ({ name: s, price: allServices.find(a => a.name === s)?.price || "面议" })) : allServices;

            container.innerHTML = services.map(s => `
                <div class="service-option" onclick="selectService(this, '${s.name}')">
                    ${s.name}
                    <div class="opt-price">${s.price}</div>
                </div>
            `).join('');
        }

        function selectService(el, name) {
            document.querySelectorAll('.service-option').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
            selectedService = name;
        }

        function renderTimeOptions() {
            const container = document.getElementById('timeOptions');
            container.innerHTML = timeSlots.map(t => `
                <div class="time-option" onclick="selectTime(this, '${t}')">${t}</div>
            `).join('');
        }

        function selectTime(el, time) {
            document.querySelectorAll('.time-option').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
            selectedTime = time;
        }

        function submitOrder() {
            const address = document.getElementById('addressInput').value.trim();
            const phone = document.getElementById('phoneInput').value.trim();
            const remark = document.getElementById('remarkInput').value.trim();

            if (!selectedService) { alert('请选择服务项目'); return; }
            if (!address) { alert('请填写详细地址'); return; }
            if (!selectedTime) { alert('请选择预约时间'); return; }
            if (!phone) { alert('请填写联系手机'); return; }
            if (!/^1\d{10}$/.test(phone)) { alert('请输入正确的手机号'); return; }

            const order = {
                service: selectedService,
                master: selectedMaster ? selectedMaster.name : '系统分配',
                address: address,
                time: selectedTime,
                remark: remark,
                phone: phone,
                createTime: new Date().toLocaleString('zh-CN')
            };

            let orders = JSON.parse(localStorage.getItem('bw_orders') || '[]');
            orders.unshift(order);
            localStorage.setItem('bw_orders', JSON.stringify(orders));

            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            showPage('page-home');
        }

        // ===================== 初始化 =====================
        renderMasters();
    </script>
</body>
</html>
