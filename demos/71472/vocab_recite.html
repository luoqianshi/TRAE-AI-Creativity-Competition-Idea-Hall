<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语单词循环背诵 - MemoryLoop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #6366f1;
            --primary-dark: #4f46e5;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --bg-gradient-start: #e0e7ff;
            --bg-gradient-end: #f0f9ff;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2rem;
            color: #1e293b;
            margin-bottom: 8px;
            background: linear-gradient(90deg, var(--primary-color), #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #64748b;
            font-size: 0.95rem;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stat-card {
            background: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            text-align: center;
            min-width: 100px;
        }

        .stat-card .number {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .stat-card .label {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 4px;
        }

        .card-container {
            perspective: 1000px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 30px;
        }

        .flash-card {
            width: 100%;
            height: 320px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .flash-card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        .card-front {
            background: white;
            border-top: 4px solid var(--primary-color);
        }

        .card-back {
            background: linear-gradient(135deg, var(--primary-color) 0%, #8b5cf6 100%);
            color: white;
            transform: rotateY(180deg);
        }

        .word-text {
            font-size: 2.5rem;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 15px;
        }

        .card-back .word-text {
            color: white;
        }

        .word-phonetic {
            font-size: 1.2rem;
            color: #94a3b8;
            font-style: italic;
        }

        .card-back .word-phonetic {
            color: rgba(255, 255, 255, 0.8);
        }

        .meaning-text {
            font-size: 1.3rem;
            text-align: center;
            line-height: 1.6;
            margin-top: 20px;
        }

        .example-text {
            font-size: 1rem;
            text-align: center;
            margin-top: 15px;
            opacity: 0.9;
            font-style: italic;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 500px;
        }

        .action-btn {
            flex: 1;
            min-width: 120px;
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-forget {
            background: var(--danger-color);
            color: white;
        }

        .btn-forget:hover {
            background: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .btn-hard {
            background: var(--warning-color);
            color: white;
        }

        .btn-hard:hover {
            background: #d97706;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        .btn-easy {
            background: var(--success-color);
            color: white;
        }

        .btn-easy:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-skip {
            background: #e2e8f0;
            color: #64748b;
        }

        .btn-skip:hover {
            background: #cbd5e1;
        }

        .progress-bar {
            width: 100%;
            max-width: 500px;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), #8b5cf6);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .control-btn {
            padding: 10px 20px;
            border: 1px solid #cbd5e1;
            background: white;
            border-radius: 8px;
            color: #475569;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .control-btn:hover {
            background: #f8fafc;
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .complete-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .complete-modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: modalPop 0.3s ease;
        }

        @keyframes modalPop {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-content h2 {
            font-size: 1.8rem;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .modal-content p {
            color: #64748b;
            margin-bottom: 25px;
        }

        .modal-content .result-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
        }

        .result-stat {
            text-align: center;
        }

        .result-stat .value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .result-stat .label {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .star-icon {
            font-size: 3rem;
            color: #fbbf24;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .card-face {
                padding: 20px;
            }

            .word-text {
                font-size: 2rem;
            }

            .meaning-text {
                font-size: 1.1rem;
            }

            .action-btn {
                min-width: 100px;
                padding: 12px 16px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📚 MemoryLoop 单词循环背诵</h1>
        <p>基于艾宾浩斯遗忘曲线，智能规划复习节奏</p>
    </div>

    <div class="stats-bar">
        <div class="stat-card">
            <div class="number" id="total-count">0</div>
            <div class="label">总单词数</div>
        </div>
        <div class="stat-card">
            <div class="number" id="learned-count">0</div>
            <div class="label">已掌握</div>
        </div>
        <div class="stat-card">
            <div class="number" id="review-count">0</div>
            <div class="label">待复习</div>
        </div>
        <div class="stat-card">
            <div class="number" id="streak-count">0</div>
            <div class="label">连续天数</div>
        </div>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="progress-text" id="progress-text">今日进度: 0/0</div>

    <div class="card-container">
        <div class="flash-card" id="flash-card" onclick="flipCard()">
            <div class="card-face card-front">
                <div class="word-text" id="word-text">点击开始</div>
                <div class="word-phonetic" id="word-phonetic">开始你的单词之旅</div>
                <div style="margin-top: 30px; color: #94a3b8; font-size: 0.9rem;">点击卡片查看释义</div>
            </div>
            <div class="card-face card-back">
                <div class="word-text" id="back-word-text"></div>
                <div class="word-phonetic" id="back-phonetic"></div>
                <div class="meaning-text" id="word-meaning"></div>
                <div class="example-text" id="word-example"></div>
            </div>
        </div>
    </div>

    <div class="action-buttons">
        <button class="action-btn btn-forget" onclick="handleAnswer('forget')">
            <span>😵</span> 忘记
        </button>
        <button class="action-btn btn-hard" onclick="handleAnswer('hard')">
            <span>😓</span> 困难
        </button>
        <button class="action-btn btn-easy" onclick="handleAnswer('easy')">
            <span>😊</span> 轻松
        </button>
        <button class="action-btn btn-skip" onclick="handleAnswer('skip')">
            <span>⏭️</span> 跳过
        </button>
    </div>

    <div class="controls">
        <button class="control-btn" onclick="resetProgress()">重置进度</button>
        <button class="control-btn" onclick="shuffleWords()">打乱顺序</button>
    </div>

    <div class="complete-modal" id="complete-modal">
        <div class="modal-content">
            <div class="star-icon">🎉</div>
            <h2>太棒了！</h2>
            <p>今日单词任务已完成</p>
            <div class="result-stats">
                <div class="result-stat">
                    <div class="value" id="result-learned">0</div>
                    <div class="label">新学单词</div>
                </div>
                <div class="result-stat">
                    <div class="value" id="result-reviewed">0</div>
                    <div class="label">复习单词</div>
                </div>
            </div>
            <button class="action-btn btn-easy" onclick="closeModalAndRestart()" style="width: 100%;">
                继续学习
            </button>
        </div>
    </div>

    <script>
        const wordDatabase = [
            { word: "abandon", phonetic: "/əˈbændən/", meaning: "v. 放弃，抛弃", example: "He decided to abandon the project." },
            { word: "ability", phonetic: "/əˈbɪləti/", meaning: "n. 能力，才能", example: "She has the ability to learn quickly." },
            { word: "absorb", phonetic: "/əbˈsɔːrb/", meaning: "v. 吸收；吸引", example: "Plants absorb carbon dioxide." },
            { word: "abstract", phonetic: "/ˈæbstrækt/", meaning: "adj. 抽象的", example: "Love is an abstract concept." },
            { word: "academic", phonetic: "/ˌækəˈdemɪk/", meaning: "adj. 学术的", example: "He has excellent academic records." },
            { word: "accent", phonetic: "/ˈæksent/", meaning: "n. 口音；重音", example: "She speaks with a French accent." },
            { word: "accept", phonetic: "/əkˈsept/", meaning: "v. 接受；认可", example: "I accept your apology." },
            { word: "access", phonetic: "/ˈækses/", meaning: "n./v. 通道；访问", example: "You need a key to access the building." },
            { word: "accident", phonetic: "/ˈæksɪdənt/", meaning: "n. 事故，意外", example: "It was just an accident." },
            { word: "accompany", phonetic: "/əˈkʌmpəni/", meaning: "v. 陪伴；伴随", example: "She accompanied him to the doctor." },
            { word: "accomplish", phonetic: "/əˈkɑːmplɪʃ/", meaning: "v. 完成，实现", example: "We accomplished our goal." },
            { word: "accurate", phonetic: "/ˈækjərət/", meaning: "adj. 准确的", example: "Please provide accurate information." },
            { word: "achieve", phonetic: "/əˈtʃiːv/", meaning: "v. 实现，达到", example: "She achieved great success." },
            { word: "acquire", phonetic: "/əˈkwaɪər/", meaning: "v. 获得，取得", example: "He acquired a new skill." },
            { word: "adapt", phonetic: "/əˈdæpt/", meaning: "v. 适应；改编", example: "She quickly adapted to the new environment." },
            { word: "addition", phonetic: "/əˈdɪʃn/", meaning: "n. 加法；增加", example: "In addition, we need more time." },
            { word: "address", phonetic: "/əˈdres/", meaning: "n. 地址 v. 演讲", example: "Please write down your address." },
            { word: "adjust", phonetic: "/əˈdʒʌst/", meaning: "v. 调整，调节", example: "Adjust the volume to your liking." },
            { word: "administration", phonetic: "/ədˌmɪnɪˈstreɪʃn/", meaning: "n. 管理；行政", example: "The school administration." },
            { word: "admire", phonetic: "/ədˈmaɪər/", meaning: "v. 钦佩，羡慕", example: "I admire your courage." },
            { word: "admit", phonetic: "/ədˈmɪt/", meaning: "v. 承认；准许进入", example: "He admitted his mistake." },
            { word: "adopt", phonetic: "/əˈdɑːpt/", meaning: "v. 采纳；收养", example: "They decided to adopt a child." },
            { word: "advance", phonetic: "/ədˈvæns/", meaning: "v./n. 前进；进步", example: "Technology is advancing rapidly." },
            { word: "advantage", phonetic: "/ədˈvæntɪdʒ/", meaning: "n. 优势，好处", example: "This gives us an advantage." },
            { word: "adventure", phonetic: "/ədˈventʃər/", meaning: "n. 冒险，奇遇", example: "Life is an adventure." },
            { word: "advertise", phonetic: "/ˈædvərtaɪz/", meaning: "v. 做广告", example: "They advertise on TV." },
            { word: "advise", phonetic: "/ədˈvaɪz/", meaning: "v. 建议，劝告", example: "I advise you to be careful." },
            { word: "affect", phonetic: "/əˈfekt/", meaning: "v. 影响；感动", example: "The weather affects my mood." },
            { word: "afford", phonetic: "/əˈfɔːrd/", meaning: "v. 负担得起", example: "I can't afford a new car." },
            { word: "afraid", phonetic: "/əˈfreɪd/", meaning: "adj. 害怕的", example: "Don't be afraid of failure." },
            { word: "agency", phonetic: "/ˈeɪdʒənsi/", meaning: "n. 代理处；机构", example: "He works at a travel agency." },
            { word: "agenda", phonetic: "/əˈdʒendə/", meaning: "n. 议程，日程", example: "What's on the agenda today?" },
            { word: "agent", phonetic: "/ˈeɪdʒənt/", meaning: "n. 代理人；特工", example: "He is a real estate agent." },
            { word: "aggressive", phonetic: "/əˈɡresɪv/", meaning: "adj. 侵略的；积极的", example: "He has an aggressive style." },
            { word: "agreement", phonetic: "/əˈɡriːmənt/", meaning: "n. 协议，同意", example: "We reached an agreement." },
            { word: "agriculture", phonetic: "/ˈæɡrɪkʌltʃər/", meaning: "n. 农业", example: "Agriculture is important." },
            { word: "ahead", phonetic: "/əˈhed/", meaning: "adv. 向前；提前", example: "Go ahead and start." },
            { word: "alarm", phonetic: "/əˈlɑːrm/", meaning: "n. 警报 v. 警告", example: "The alarm went off." },
            { word: "album", phonetic: "/ˈælbəm/", meaning: "n. 相册；专辑", example: "This is my favorite album." },
            { word: "alcohol", phonetic: "/ˈælkəhɔːl/", meaning: "n. 酒精", example: "Don't drink too much alcohol." },
            { word: "alive", phonetic: "/əˈlaɪv/", meaning: "adj. 活着的", example: "She is still alive." },
            { word: "allow", phonetic: "/əˈlaʊ/", meaning: "v. 允许，准许", example: "Smoking is not allowed." },
            { word: "alone", phonetic: "/əˈloʊn/", meaning: "adj./adv. 单独的", example: "I want to be alone." },
            { word: "along", phonetic: "/əˈlɔːŋ/", meaning: "prep./adv. 沿着", example: "Walk along this street." },
            { word: "aloud", phonetic: "/əˈlaʊd/", meaning: "adv. 大声地", example: "Read the text aloud." },
            { word: "alphabet", phonetic: "/ˈælfəbet/", meaning: "n. 字母表", example: "Learn the alphabet." },
            { word: "alter", phonetic: "/ˈɔːltər/", meaning: "v. 改变，修改", example: "The plan was altered." },
            { word: "alternative", phonetic: "/ɔːlˈtɜːrnətɪv/", meaning: "n./adj. 替代品；替代的", example: "Do you have an alternative?" },
            { word: "altitude", phonetic: "/ˈæltɪtuːd/", meaning: "n. 海拔，高度", example: "The altitude is very high." },
            { word: "amazing", phonetic: "/əˈmeɪzɪŋ/", meaning: "adj. 令人惊叹的", example: "What an amazing view!" },
            { word: "ambition", phonetic: "/æmˈbɪʃn/", meaning: "n. 雄心，抱负", example: "He has big ambitions." },
            { word: "ambulance", phonetic: "/ˈæmbjələns/", meaning: "n. 救护车", example: "Call an ambulance!" }
        ];

        let reviewQueue = [];
        let learnedWords = new Set();
        let currentWordIndex = 0;
        let isFlipped = false;
        let todayLearned = 0;
        let todayReviewed = 0;
        let streakDays = 0;

        const INTERVALS = [1, 2, 4, 7, 15, 30];

        function init() {
            loadProgress();
            initReviewQueue();
            updateStats();
            showCurrentWord();
        }

        function loadProgress() {
            const saved = localStorage.getItem('memoryloop_progress');
            if (saved) {
                const data = JSON.parse(saved);
                learnedWords = new Set(data.learned || []);
                streakDays = data.streak || 0;
                
                const lastDate = data.lastDate;
                const today = new Date().toDateString();
                if (lastDate !== today) {
                    todayLearned = 0;
                    todayReviewed = 0;
                    if (lastDate) {
                        const last = new Date(lastDate);
                        const curr = new Date(today);
                        const diff = Math.floor((curr - last) / (1000 * 60 * 60 * 24));
                        if (diff === 1) {
                            streakDays++;
                        } else if (diff > 1) {
                            streakDays = 1;
                        }
                    } else {
                        streakDays = 1;
                    }
                } else {
                    todayLearned = data.todayLearned || 0;
                    todayReviewed = data.todayReviewed || 0;
                }
            } else {
                streakDays = 1;
            }
        }

        function saveProgress() {
            localStorage.setItem('memoryloop_progress', JSON.stringify({
                learned: Array.from(learnedWords),
                streak: streakDays,
                lastDate: new Date().toDateString(),
                todayLearned,
                todayReviewed
            }));
        }

        function initReviewQueue() {
            const toLearn = wordDatabase.filter(w => !learnedWords.has(w.word));
            const toReview = wordDatabase.filter(w => learnedWords.has(w.word));
            
            reviewQueue = [...toLearn, ...toReview];
            
            if (reviewQueue.length === 0) {
                reviewQueue = [...wordDatabase];
            }
        }

        function updateStats() {
            document.getElementById('total-count').textContent = wordDatabase.length;
            document.getElementById('learned-count').textContent = learnedWords.size;
            document.getElementById('review-count').textContent = reviewQueue.length - learnedWords.size;
            document.getElementById('streak-count').textContent = streakDays;
            
            const progress = reviewQueue.length > 0 ? 
                Math.round(((wordDatabase.length - reviewQueue.length + learnedWords.size) / wordDatabase.length) * 100) : 0;
            document.getElementById('progress-fill').style.width = `${progress}%`;
            document.getElementById('progress-text').textContent = 
                `今日进度: 新学${todayLearned}个 + 复习${todayReviewed}个`;
        }

        function showCurrentWord() {
            if (reviewQueue.length === 0) {
                showCompleteModal();
                return;
            }

            currentWordIndex = Math.floor(Math.random() * reviewQueue.length);
            const word = reviewQueue[currentWordIndex];

            document.getElementById('word-text').textContent = word.word;
            document.getElementById('word-phonetic').textContent = word.phonetic;
            document.getElementById('back-word-text').textContent = word.word;
            document.getElementById('back-phonetic').textContent = word.phonetic;
            document.getElementById('word-meaning').textContent = word.meaning;
            document.getElementById('word-example').textContent = word.example;

            isFlipped = false;
            document.getElementById('flash-card').classList.remove('flipped');
        }

        function flipCard() {
            isFlipped = !isFlipped;
            document.getElementById('flash-card').classList.toggle('flipped', isFlipped);
        }

        function handleAnswer(result) {
            if (!isFlipped) {
                flipCard();
                return;
            }

            const word = reviewQueue[currentWordIndex];

            if (result === 'easy') {
                learnedWords.add(word.word);
                if (!learnedWords.has(word.word)) {
                    todayLearned++;
                } else {
                    todayReviewed++;
                }
                reviewQueue.splice(currentWordIndex, 1);
            } else if (result === 'hard') {
                if (learnedWords.has(word.word)) {
                    todayReviewed++;
                }
            } else if (result === 'forget') {
                learnedWords.delete(word.word);
                if (learnedWords.has(word.word)) {
                    todayReviewed++;
                }
            } else if (result === 'skip') {
                if (learnedWords.has(word.word)) {
                    todayReviewed++;
                }
            }

            saveProgress();
            updateStats();
            
            setTimeout(() => {
                showCurrentWord();
            }, 300);
        }

        function resetProgress() {
            if (confirm('确定要重置所有学习进度吗？')) {
                localStorage.removeItem('memoryloop_progress');
                learnedWords.clear();
                todayLearned = 0;
                todayReviewed = 0;
                streakDays = 1;
                initReviewQueue();
                updateStats();
                showCurrentWord();
            }
        }

        function shuffleWords() {
            for (let i = reviewQueue.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [reviewQueue[i], reviewQueue[j]] = [reviewQueue[j], reviewQueue[i]];
            }
            showCurrentWord();
        }

        function showCompleteModal() {
            document.getElementById('result-learned').textContent = todayLearned;
            document.getElementById('result-reviewed').textContent = todayReviewed;
            document.getElementById('complete-modal').classList.add('show');
        }

        function closeModalAndRestart() {
            document.getElementById('complete-modal').classList.remove('show');
            initReviewQueue();
            showCurrentWord();
        }

        init();
    </script>
</body>
</html>
