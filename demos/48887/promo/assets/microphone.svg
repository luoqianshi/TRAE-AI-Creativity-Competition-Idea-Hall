<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" fill="none" role="img" aria-label="Friendly microphone for kids">
  <defs>
    <linearGradient id="micGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA86A"/>
      <stop offset="1" stop-color="#FF7A1F"/>
    </linearGradient>
    <linearGradient id="meshGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5BB5E8"/>
      <stop offset="1" stop-color="#3A8FCB"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#FFD93D" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFD93D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Glow behind mic -->
  <ellipse cx="240" cy="180" rx="200" ry="170" fill="url(#glow)"/>

  <!-- Stand base -->
  <ellipse cx="240" cy="490" rx="120" ry="14" fill="#2A1A0F" opacity="0.18"/>
  <path d="M 150 480 Q 240 510 330 480 L 320 470 Q 240 496 160 470 Z" fill="#3A2418"/>
  <rect x="225" y="450" width="30" height="30" rx="4" fill="#2A1A0F"/>

  <!-- Stand pole -->
  <rect x="232" y="260" width="16" height="200" rx="6" fill="#3A2418"/>
  <rect x="232" y="260" width="4" height="200" fill="#5C3A24" opacity="0.7"/>

  <!-- Yoke / shock mount -->
  <path d="M 180 200 Q 180 260 220 280 L 260 280 Q 300 260 300 200" stroke="#2A1A0F" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="180" cy="200" r="10" fill="#3A2418" stroke="#2A1A0F" stroke-width="2"/>
  <circle cx="300" cy="200" r="10" fill="#3A2418" stroke="#2A1A0F" stroke-width="2"/>

  <!-- Mic body -->
  <rect x="170" y="80" width="140" height="200" rx="70" fill="url(#micGrad)" stroke="#2A1A0F" stroke-width="3"/>
  <!-- Body inner shadow -->
  <rect x="170" y="80" width="140" height="200" rx="70" fill="url(#bodyShine)" opacity="0.6"/>

  <!-- Mic mesh top (capsule) -->
  <ellipse cx="240" cy="140" rx="58" ry="68" fill="url(#meshGrad)" stroke="#2A1A0F" stroke-width="3"/>
  <!-- Mesh grid -->
  <g stroke="#FFFFFF" stroke-width="0.8" opacity="0.35">
    <line x1="190" y1="100" x2="290" y2="100"/>
    <line x1="184" y1="120" x2="296" y2="120"/>
    <line x1="180" y1="140" x2="300" y2="140"/>
    <line x1="184" y1="160" x2="296" y2="160"/>
    <line x1="190" y1="180" x2="290" y2="180"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="0.8" opacity="0.35">
    <line x1="200" y1="78" x2="200" y2="202"/>
    <line x1="220" y1="74" x2="220" y2="206"/>
    <line x1="240" y1="72" x2="240" y2="208"/>
    <line x1="260" y1="74" x2="260" y2="206"/>
    <line x1="280" y1="78" x2="280" y2="202"/>
  </g>

  <!-- Highlight on body -->
  <path d="M 188 100 Q 200 90 218 92" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Brand tag on body -->
  <rect x="200" y="232" width="80" height="22" rx="6" fill="#FFD93D" stroke="#2A1A0F" stroke-width="1.5"/>
  <text x="240" y="247" font-family="ui-sans-serif" font-size="11" font-weight="800" fill="#2A1A0F" text-anchor="middle" letter-spacing="1">DUB · K</text>

  <!-- Indicator LED -->
  <circle cx="240" cy="270" r="4" fill="#7ED957" stroke="#2A1A0F" stroke-width="1"/>

  <defs>
    <linearGradient id="bodyShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
