<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none" role="img" aria-label="Auto-sentence-segmented timeline">
  <!-- Timeline base -->
  <line x1="40" y1="100" x2="760" y2="100" stroke="#2A1A0F" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.3"/>

  <!-- Sentence chips along the timeline -->
  <g font-family="ui-sans-serif" font-size="11" font-weight="700" fill="#2A1A0F">
    <!-- 1. active -->
    <g transform="translate(60 60)">
      <rect width="140" height="36" rx="18" fill="#FF8C42" stroke="#2A1A0F" stroke-width="2"/>
      <circle cx="18" cy="18" r="6" fill="#FFD93D" stroke="#2A1A0F" stroke-width="1.5"/>
      <text x="34" y="22">Hello there!</text>
    </g>
    <line x1="130" y1="96" x2="130" y2="100" stroke="#2A1A0F" stroke-width="1.5"/>

    <!-- 2. done -->
    <g transform="translate(220 60)">
      <rect width="120" height="36" rx="18" fill="#7ED957" stroke="#2A1A0F" stroke-width="2"/>
      <path d="M 14 18 l 5 5 l 10 -10" stroke="#2A1A0F" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="22">How are you</text>
    </g>
    <line x1="280" y1="96" x2="280" y2="100" stroke="#2A1A0F" stroke-width="1.5"/>

    <!-- 3. done -->
    <g transform="translate(360 60)">
      <rect width="110" height="36" rx="18" fill="#7ED957" stroke="#2A1A0F" stroke-width="2"/>
      <path d="M 14 18 l 5 5 l 10 -10" stroke="#2A1A0F" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="22">doing today?</text>
    </g>
    <line x1="415" y1="96" x2="415" y2="100" stroke="#2A1A0F" stroke-width="1.5"/>

    <!-- 4. pending -->
    <g transform="translate(490 60)">
      <rect width="120" height="36" rx="18" fill="#FFE6C9" stroke="#2A1A0F" stroke-width="2" stroke-dasharray="4 3"/>
      <circle cx="18" cy="18" r="6" fill="#FFFFFF" stroke="#2A1A0F" stroke-width="1.5"/>
      <text x="34" y="22">I am ready.</text>
    </g>
    <line x1="550" y1="96" x2="550" y2="100" stroke="#2A1A0F" stroke-width="1.5"/>

    <!-- 5. pending -->
    <g transform="translate(630 60)">
      <rect width="100" height="36" rx="18" fill="#FFE6C9" stroke="#2A1A0F" stroke-width="2" stroke-dasharray="4 3"/>
      <circle cx="18" cy="18" r="6" fill="#FFFFFF" stroke="#2A1A0F" stroke-width="1.5"/>
      <text x="34" y="22">Let's go!</text>
    </g>
  </g>

  <!-- Time markers -->
  <g font-family="ui-monospace, monospace" font-size="10" fill="#2A1A0F" opacity="0.5">
    <text x="40" y="130">00:00</text>
    <text x="240" y="130">00:04</text>
    <text x="440" y="130">00:08</text>
    <text x="640" y="130">00:12</text>
  </g>

  <!-- Playhead -->
  <g transform="translate(130 100)">
    <circle r="6" fill="#FF8C42" stroke="#2A1A0F" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="22" stroke="#2A1A0F" stroke-width="1.5" stroke-dasharray="2 2"/>
  </g>
</svg>
