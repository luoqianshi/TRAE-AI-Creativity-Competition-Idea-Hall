<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" fill="none" role="img" aria-label="Tape reels illustration">
  <!-- Background warm card -->
  <rect x="0" y="0" width="600" height="320" fill="none"/>

  <!-- Body of a portable cassette recorder, three-quarter perspective -->
  <g transform="translate(60 60)">
    <!-- Back shadow plate -->
    <rect x="6" y="14" width="480" height="240" rx="22" fill="#2A1A0F" opacity="0.18"/>

    <!-- Recorder body -->
    <rect x="0" y="0" width="480" height="240" rx="22" fill="#FF8C42"/>
    <rect x="0" y="0" width="480" height="240" rx="22" fill="url(#recorderSheen)"/>

    <!-- Top stripe (deck) -->
    <rect x="20" y="22" width="440" height="110" rx="10" fill="#2A1A0F"/>
    <rect x="20" y="22" width="440" height="110" rx="10" fill="url(#tapeShine)"/>

    <!-- Cassette window inside deck -->
    <rect x="60" y="38" width="360" height="78" rx="6" fill="#FFE6C9"/>
    <rect x="60" y="38" width="360" height="78" rx="6" fill="url(#cassetteInner)"/>

    <!-- Cassette body inside window -->
    <rect x="92" y="50" width="296" height="54" rx="4" fill="#F2D4A8" stroke="#2A1A0F" stroke-width="2"/>

    <!-- Left tape reel -->
    <g transform="translate(150 77)">
      <circle r="22" fill="#FF8C42" stroke="#2A1A0F" stroke-width="2.5"/>
      <circle r="14" fill="#FFE6C9"/>
      <circle r="3" fill="#2A1A0F"/>
      <g stroke="#2A1A0F" stroke-width="1.6" stroke-linecap="round">
        <line x1="0" y1="-9" x2="0" y2="-12"/>
        <line x1="0" y1="9" x2="0" y2="12"/>
        <line x1="-9" y1="0" x2="-12" y2="0"/>
        <line x1="9" y1="0" x2="12" y2="0"/>
        <line x1="-6.4" y1="-6.4" x2="-8.5" y2="-8.5"/>
        <line x1="6.4" y1="-6.4" x2="8.5" y2="-8.5"/>
        <line x1="-6.4" y1="6.4" x2="-8.5" y2="8.5"/>
        <line x1="6.4" y1="6.4" x2="8.5" y2="8.5"/>
      </g>
    </g>

    <!-- Right tape reel -->
    <g transform="translate(330 77)">
      <circle r="22" fill="#FF8C42" stroke="#2A1A0F" stroke-width="2.5"/>
      <circle r="14" fill="#FFE6C9"/>
      <circle r="3" fill="#2A1A0F"/>
      <g stroke="#2A1A0F" stroke-width="1.6" stroke-linecap="round">
        <line x1="0" y1="-9" x2="0" y2="-12"/>
        <line x1="0" y1="9" x2="0" y2="12"/>
        <line x1="-9" y1="0" x2="-12" y2="0"/>
        <line x1="9" y1="0" x2="12" y2="0"/>
        <line x1="-6.4" y1="-6.4" x2="-8.5" y2="-8.5"/>
        <line x1="6.4" y1="-6.4" x2="8.5" y2="-8.5"/>
        <line x1="-6.4" y1="6.4" x2="-8.5" y2="8.5"/>
        <line x1="6.4" y1="6.4" x2="8.5" y2="8.5"/>
      </g>
    </g>

    <!-- Tape strand between reels -->
    <path d="M 150 77 Q 240 96 330 77" stroke="#2A1A0F" stroke-width="1.2" fill="none" opacity="0.7"/>

    <!-- Cassette label -->
    <rect x="180" y="86" width="120" height="14" rx="2" fill="#FFD93D"/>
    <line x1="186" y1="93" x2="294" y2="93" stroke="#2A1A0F" stroke-width="0.6" opacity="0.5"/>

    <!-- Buttons row -->
    <g>
      <circle cx="60" cy="190" r="20" fill="#FFD93D" stroke="#2A1A0F" stroke-width="2"/>
      <circle cx="120" cy="190" r="20" fill="#7ED957" stroke="#2A1A0F" stroke-width="2"/>
      <circle cx="180" cy="190" r="20" fill="#5BB5E8" stroke="#2A1A0F" stroke-width="2"/>
      <circle cx="240" cy="190" r="20" fill="#FFE6C9" stroke="#2A1A0F" stroke-width="2"/>

      <!-- Center display -->
      <rect x="280" y="170" width="140" height="40" rx="6" fill="#2A1A0F"/>
      <g transform="translate(298 184)" fill="#FFD93D" font-family="ui-monospace, monospace" font-size="14" font-weight="700">
        <text>00:42 / 03:18</text>
      </g>
      <rect x="298" y="200" width="104" height="3" rx="1.5" fill="#FFD93D" opacity="0.3"/>
      <rect x="298" y="200" width="62" height="3" rx="1.5" fill="#FFD93D"/>

      <!-- Brand badge -->
      <rect x="20" y="220" width="80" height="14" rx="3" fill="#2A1A0F" opacity="0.18"/>
    </g>

    <!-- Speaker grille bottom -->
    <g transform="translate(20 150)">
      <rect width="20" height="80" rx="4" fill="#2A1A0F" opacity="0.4"/>
    </g>
  </g>

  <defs>
    <linearGradient id="recorderSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tapeShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="cassetteInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
</svg>
