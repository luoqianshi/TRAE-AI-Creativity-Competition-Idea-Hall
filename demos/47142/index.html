<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>逃 · 不是为了逃走，而是为了发现</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="grain"></div>

  <div class="app-container">
    <main class="page-content" id="pageContent">
      <!-- 首页 - 刷卡片 -->
      <section class="page active" id="pageHome">
        <div class="home-top">
          <div class="home-title">
            <span class="brand-char">逃</span>
            <p class="brand-slogan">在历史中，寻找同频的灵魂</p>
          </div>
          <div class="publish-input-wrap">
            <input 
              type="text" 
              class="publish-input" 
              id="publishInput"
              placeholder="说点什么，去找同频的古人聊聊..."
              onkeypress="handlePublishKeypress(event)"
            />
            <button class="publish-btn" onclick="publishFeeling()">
              <span>找同频</span>
            </button>
          </div>
        </div>
        <div class="card-stack" id="cardStack"></div>
        <div class="card-actions">
          <button class="card-action-btn skip" onclick="skipCard()">
            <span class="action-icon">✕</span>
          </button>
          <button class="card-action-btn talk" onclick="openChat()">
            <span class="action-icon">💬</span>
          </button>
        </div>
      </section>

      <!-- 知识库 -->
      <section class="page" id="pageLibrary">
        <div class="library-header">
          <h2>同频古人</h2>
          <p>跨越时间的灵魂共振</p>
        </div>
        <div class="library-list" id="libraryList"></div>
      </section>

      <!-- 念头 -->
      <section class="page" id="pageThoughts">
        <div class="thoughts-header">
          <h2>留个念头</h2>
          <p>说不定，千年前也有人这样想过</p>
        </div>
        <div class="thought-input-wrap">
          <input type="text" id="thoughtInput" placeholder="留下此刻的念头..." />
          <button onclick="addThought()">留下</button>
        </div>
        <div class="thoughts-list" id="thoughtsList"></div>
      </section>

      <!-- 个人信息 -->
      <section class="page" id="pageProfile">
        <div class="profile-header">
          <div class="profile-avatar" id="profileAvatar">旅</div>
          <h2 id="profileName">旅人</h2>
          <p class="profile-days">与逃共度 <span id="profileDays">1</span> 天</p>
        </div>
        <div class="profile-stats">
          <div class="stat-item">
            <span class="stat-num" id="statEchoes">0</span>
            <span class="stat-label">回声</span>
          </div>
          <div class="stat-item">
            <span class="stat-num" id="statChats">0</span>
            <span class="stat-label">对话</span>
          </div>
        </div>
        <div class="profile-menu">
          <div class="menu-item" onclick="showAbout()">
            <span>关于逃</span>
            <span class="arrow">→</span>
          </div>
        </div>
      </section>
    </main>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-page="Home" onclick="switchPage('Home')">
        <span class="nav-icon">⌂</span>
        <span class="nav-label">首页</span>
      </button>
      <button class="nav-item" data-page="Library" onclick="switchPage('Library')">
        <span class="nav-icon">◎</span>
        <span class="nav-label">回声</span>
      </button>
      <button class="nav-item" data-page="Thoughts" onclick="switchPage('Thoughts')">
        <span class="nav-icon">✎</span>
        <span class="nav-label">念头</span>
      </button>
      <button class="nav-item" data-page="Profile" onclick="switchPage('Profile')">
        <span class="nav-icon">⊙</span>
        <span class="nav-label">我的</span>
      </button>
    </nav>

    <!-- AI对话弹窗 -->
    <div class="chat-overlay" id="chatOverlay">
      <div class="chat-container">
        <div class="chat-header">
          <button class="chat-close" onclick="closeChat()">←</button>
          <div class="chat-figure-info">
            <div class="chat-avatar" id="chatAvatar"></div>
            <div class="chat-info">
              <h3 id="chatName"></h3>
              <p id="chatTitle"></p>
            </div>
          </div>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
          <input type="text" id="chatInput" placeholder="说点什么..." onkeypress="handleChatKeypress(event)" />
          <button onclick="sendMessage()">发送</button>
        </div>
      </div>
    </div>

    <!-- 加载动画 -->
    <div class="loading-screen hidden" id="loadingScreen">
      <div class="loading-content">
        <span class="loading-char">逃</span>
        <p>穿越时间中...</p>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
