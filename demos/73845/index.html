<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebPlay - 让你的网页作品被看见</title>
    <style>
        :root {
            --bg-color: #F5F0EB;
            --card-bg: #D4C5B2;
            --accent-color: #C9A87C;
            --text-primary: #3D3D3D;
            --text-secondary: #6B6B6B;
            --white: #FFFFFF;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* 导航栏 */
        .nav {
            background: var(--white);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            cursor: pointer;
        }

        .nav-title span {
            color: var(--accent-color);
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--accent-color);
            color: var(--white);
        }

        .btn-primary:hover {
            background: #B8956A;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--white);
            color: var(--text-primary);
            border: 2px solid var(--card-bg);
        }

        .btn-secondary:hover {
            border-color: var(--accent-color);
        }

        /* 页面容器 */
        .page {
            display: none;
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page.active {
            display: block;
        }

        /* 首页 - 作品墙 */
        .hero {
            text-align: center;
            padding: 40px 0 60px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .hero p {
            font-size: 18px;
            color: var(--text-secondary);
        }

        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .filter-tag {
            padding: 8px 20px;
            background: var(--white);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .filter-tag:hover,
        .filter-tag.active {
            background: var(--accent-color);
            color: var(--white);
        }

        .works-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 28px;
        }

        .work-card {
            background: var(--white);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .work-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .work-preview {
            width: 100%;
            height: 200px;
            background: var(--card-bg);
            position: relative;
            overflow: hidden;
        }

        .work-preview iframe {
            width: 200%;
            height: 200%;
            border: none;
            transform: scale(0.5);
            transform-origin: top left;
            pointer-events: none;
        }

        .work-info {
            padding: 20px;
        }

        .work-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .work-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .work-category {
            background: var(--card-bg);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
        }

        .work-likes {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 详情页 */
        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }

        .detail-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .detail-meta {
            display: flex;
            gap: 16px;
            color: var(--text-secondary);
        }

        .like-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: var(--white);
            border: 2px solid var(--card-bg);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
            font-weight: 600;
        }

        .like-btn:hover,
        .like-btn.liked {
            border-color: var(--accent-color);
            background: #FFF8F0;
        }

        .like-btn.liked .heart {
            color: #E74C3C;
        }

        .detail-preview {
            background: var(--white);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }

        .detail-preview iframe {
            width: 100%;
            height: 600px;
            border: none;
        }

        .detail-desc {
            background: var(--white);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }

        .detail-desc h3 {
            margin-bottom: 12px;
            font-size: 18px;
        }

        .code-section {
            background: var(--white);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .code-header {
            padding: 16px 24px;
            background: var(--card-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .code-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .code-content.open {
            max-height: 800px;
        }

        .code-content pre {
            padding: 24px;
            background: #2D2D2D;
            color: #F8F8F2;
            overflow-x: auto;
            font-size: 13px;
            line-height: 1.6;
        }

        /* 发布页 */
        .publish-form {
            max-width: 800px;
            margin: 0 auto;
            background: var(--white);
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--shadow);
        }

        .publish-form h2 {
            margin-bottom: 32px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--card-bg);
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 200px;
            font-family: 'Consolas', 'Monaco', monospace;
        }

        .form-actions {
            display: flex;
            gap: 16px;
            margin-top: 32px;
        }

        .form-actions .btn {
            flex: 1;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .nav {
                padding: 16px 20px;
            }

            .page {
                padding: 20px;
            }

            .hero h1 {
                font-size: 32px;
            }

            .works-grid {
                grid-template-columns: 1fr;
            }

            .detail-preview iframe {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-title" onclick="showPage('home')">Web<span>Play</span></div>
        <button class="btn btn-primary" onclick="showPage('publish')">+ 发布作品</button>
    </nav>

    <!-- 首页 -->
    <div id="page-home" class="page active">
        <div class="hero">
            <h1>让你的网页作品被看见 ✨</h1>
            <p>发现有趣的创意，分享你的作品</p>
        </div>

        <div class="filter-bar">
            <div class="filter-tag active" data-filter="all">全部</div>
            <div class="filter-tag" data-filter="个人主页">个人主页</div>
            <div class="filter-tag" data-filter="活动邀请函">活动邀请函</div>
            <div class="filter-tag" data-filter="小工具">小工具</div>
            <div class="filter-tag" data-filter="创意视觉">创意视觉</div>
            <div class="filter-tag" data-filter="数据可视化">数据可视化</div>
        </div>

        <div id="works-grid" class="works-grid"></div>
    </div>

    <!-- 详情页 -->
    <div id="page-detail" class="page">
        <div class="detail-header">
            <div>
                <button class="btn btn-secondary" onclick="showPage('home')">← 返回</button>
                <h2 id="detail-title" class="detail-title"></h2>
                <div class="detail-meta">
                    <span id="detail-author"></span>
                    <span id="detail-category"></span>
                </div>
            </div>
            <button id="like-btn" class="like-btn" onclick="toggleLike()">
                <span class="heart">❤</span>
                <span id="like-count">0</span>
            </button>
        </div>

        <div class="detail-preview">
            <iframe id="detail-iframe" sandbox="allow-scripts"></iframe>
        </div>

        <div class="detail-desc">
            <h3>作品描述</h3>
            <p id="detail-desc"></p>
        </div>

        <div class="code-section">
            <div class="code-header" onclick="toggleCode()">
                <span>查看源代码</span>
                <span id="code-toggle-icon">▼</span>
            </div>
            <div id="code-content" class="code-content">
                <pre><code id="detail-code"></code></pre>
            </div>
        </div>
    </div>

    <!-- 发布页 -->
    <div id="page-publish" class="page">
        <div class="publish-form">
            <h2>发布你的作品 🚀</h2>

            <div class="form-group">
                <label>作品标题</label>
                <input type="text" id="publish-title" placeholder="给你的作品起个名字">
            </div>

            <div class="form-group">
                <label>作者名称</label>
                <input type="text" id="publish-author" placeholder="你的名字">
            </div>

            <div class="form-group">
                <label>作品分类</label>
                <select id="publish-category">
                    <option value="个人主页">个人主页</option>
                    <option value="活动邀请函">活动邀请函</option>
                    <option value="小工具">小工具</option>
                    <option value="创意视觉">创意视觉</option>
                    <option value="数据可视化">数据可视化</option>
                </select>
            </div>

            <div class="form-group">
                <label>作品描述</label>
                <textarea id="publish-desc" placeholder="简单介绍一下你的作品"></textarea>
            </div>

            <div class="form-group">
                <label>HTML 代码</label>
                <textarea id="publish-code" placeholder="粘贴你的完整 HTML 代码"></textarea>
            </div>

            <div class="form-actions">
                <button class="btn btn-secondary" onclick="showPage('home')">取消</button>
                <button class="btn btn-primary" onclick="publishWork()">发布作品</button>
            </div>
        </div>
    </div>

    <script>
        // 预置5个示例作品
        const sampleWorks = [
            {
                id: '1',
                title: '我的个人主页',
                author: '小美',
                category: '个人主页',
                description: '这是我用 TRAE 做的第一个个人主页，展示了我的兴趣爱好和联系方式。',
                likes: 42,

            {
                id: '2',

                author: '阿杰',
                category: '活动邀请函',
                description: '为新年派对制作的电子邀请函，有倒计时动画效果。',
                likes: 68,
                liked: false,
                code: '<!DOCTYPE html>\n<html>\n<head>\n    <style>\n        body { font-family: sans-serif; text-align: center; padding: 60px; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; margin: 0; min-height: 100vh; }\n        h1 { font-size: 56px; margin-bottom: 10px; }\n        .countdown { display: flex; justify-content: center; gap: 20px; margin: 40px 0; }\n        .time-box { background: rgba(255,255,255,0.2); padding: 20px 30px; border-radius: 16px; font-size: 36px; font-weight: bold; }\n        .info { font-size: 24px; margin: 20px 0; }\n        .confetti { font-size: 60px; animation: bounce 1s infinite; }\n        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }\n    </style>\n</head>\n<body>\n    <div class="confetti">🎉</div>\n    <h1>新年派对</h1>\n    <p>2025年12月31日 · 晚8点</p>\n    <div class="countdown">\n        <div class="time-box">10<div style="font-size:14px">天</div></div>\n        <div class="time-box">08<div style="font-size:14px">时</div></div>\n        <div class="time-box">30<div style="font-size:14px">分</div></div>\n        <div class="time-box">45<div style="font-size:14px">秒</div></div>\n    </div>\n    <p class="info">📍 创意空间 · 不见不散</p>\n</body>\n</html>'
            },
            {
                id: '3',
                title: '番茄钟计时器',
                author: '大伟',
                category: '小工具',
                description: '一个简单好用的番茄钟，帮助你专注工作。',
                likes: 95,
                liked: false,
                code: '<!DOCTYPE html>\n<html>\n<head>\n    <style>\n        body { font-family: sans-serif; text-align: center; padding: 60px; background: #2D2D2D; color: white; margin: 0; min-height: 100vh; }\n        h1 { font-size: 36px; margin-bottom: 40px; }\n        .timer { font-size: 120px; font-weight: bold; margin: 40px 0; font-family: "Courier New", monospace; }\n        .buttons { display: flex; gap: 20px; justify-content: center; }\n        button { padding: 16px 40px; font-size: 18px; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; }\n        .start { background: #4CAF50; color: white; }\n        .reset { background: #555; color: white; }\n        .tomato { font-size: 80px; margin-bottom: 20px; }\n    </style>\n</head>\n<body>\n    <div class="tomato">🍅</div>\n    <h1>番茄钟</h1>\n    <div class="timer" id="timer">25:00</div>\n    <div class="buttons">\n        <button class="start" onclick="alert(\"开始专注！\")">开始</button>\n        <button class="reset" onclick="document.getElementById(\"timer\").textContent=\"25:00\"">重置</button>\n    </div>\n    <p style="margin-top:40px;opacity:0.6">专注25分钟，休息5分钟</p>\n</body>\n</html>'
            },
            {
                id: '4',
                title: '渐变艺术画布',
                author: '小雨',
                category: '创意视觉',
                description: '鼠标移动时会产生漂亮的渐变动画效果。',
                likes: 128,
                liked: false,
                code: '<!DOCTYPE html>\n<html>\n<head>\n    <style>\n        body { margin: 0; height: 100vh; background: linear-gradient(45deg, #ff9a9e, #fecfef, #fecfef, #ff9a9e); background-size: 400% 400%; animation: gradient 15s ease infinite; }\n        @keyframes gradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }\n        .content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white; font-family: sans-serif; }\n        h1 { font-size: 48px; text-shadow: 2px 2px 10px rgba(0,0,0,0.2); }\n        p { font-size: 20px; opacity: 0.9; }\n        .shapes { position: absolute; width: 100%; height: 100%; overflow: hidden; pointer-events: none; }\n        .shape { position: absolute; border-radius: 50%; opacity: 0.3; animation: float 6s ease-in-out infinite; }\n        @keyframes float { 0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)} }\n    </style>\n</head>\n<body>\n    <div class="shapes">\n        <div class="shape" style="width:200px;height:200px;background:white;top:10%;left:10%;animation-delay:0s"></div>\n        <div class="shape" style="width:150px;height:150px;background:pink;top:60%;left:80%;animation-delay:2s"></div>\n        <div class="shape" style="width:100px;height:100px;background:purple;top:30%;left:70%;animation-delay:4s"></div>\n    </div>\n    <div class="content">\n        <h1>✨ 渐变艺术 ✨</h1>\n        <p>移动鼠标感受色彩的流动</p>\n    </div>\n</body>\n</html>'
            },
            {
                id: '5',
                title: '每周阅读统计',
                author: '小琳',
                category: '数据可视化',
                description: '用图表展示我的每周阅读时长统计。',
                likes: 76,
                liked: false,
                code: '<!DOCTYPE html>\n<html>\n<head>\n    <style>\n        body { font-family: sans-serif; padding: 60px; background: #f8f9fa; margin: 0; min-height: 100vh; }\n        h1 { text-align: center; color: #333; margin-bottom: 50px; }\n        .chart { display: flex; justify-content: space-around; align-items: flex-end; height: 400px; max-width: 800px; margin: 0 auto; padding: 20px; background: white; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }\n        .bar { width: 80px; background: linear-gradient(to top, #667eea, #764ba2); border-radius: 12px 12px 0 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; color: white; padding-bottom: 10px; font-weight: bold; transition: transform 0.3s; }\n        .bar:hover { transform: scale(1.05); }\n        .label { margin-top: 10px; color: #666; font-size: 14px; }\n    </style>\n</head>\n<body>\n    <h1>📚 每周阅读统计</h1>\n    <div class="chart">\n        <div><div class="bar" style="height:180px">2h</div><div class="label">周一</div></div>\n        <div><div class="bar" style="height:280px">3h</div><div class="label">周二</div></div>\n        <div><div class="bar" style="height:150px">1.5h</div><div class="label">周三</div></div>\n        <div><div class="bar" style="height:320px">3.5h</div><div class="label">周四</div></div>\n        <div><div class="bar" style="height:240px">2.5h</div><div class="label">周五</div></div>\n        <div><div class="bar" style="height:380px">4h</div><div class="label">周六</div></div>\n        <div><div class="bar" style="height:300px">3h</div><div class="label">周日</div></div>\n    </div>\n    <p style="text-align:center;color:#666;margin-top:40px">本周总计：19.5 小时 ✨</p>\n</body>\n</html>'
            }
        ];

        let works = [];
        let currentWorkId = null;

        // 初始化
        function init() {
            const storedWorks = localStorage.getItem('webplay-works');
            if (storedWorks) {
                works = JSON.parse(storedWorks);
            } else {
                works = [...sampleWorks];
                saveWorks();
            }
            renderWorks();
        }

        // 保存作品
        function saveWorks() {
            localStorage.setItem('webplay-works', JSON.stringify(works));
        }

        // 渲染作品墙
        function renderWorks(filter = 'all') {
            const grid = document.getElementById('works-grid');
            const filteredWorks = filter === 'all' 
                ? works 
                : works.filter(w => w.category === filter);
            
            grid.innerHTML = filteredWorks.map(work => `
                <div class="work-card" onclick="showDetail('${work.id}')">
                    <div class="work-preview">
                        <iframe srcdoc="${escapeHtml(work.code)}" sandbox="allow-scripts"></iframe>
                    </div>
                    <div class="work-info">
                        <div class="work-title">${escapeHtml(work.title)}</div>
                        <div class="work-meta">
                            <span class="work-category">${escapeHtml(work.category)}</span>
                            <span class="work-likes">
                                ${work.liked ? '❤' : '🤍'} ${work.likes}
                            </span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 切换页面
        function showPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${page}`).classList.add('active');
        }

        // 显示详情页
        function showDetail(id) {
            currentWorkId = id;
            const work = works.find(w => w.id === id);
            if (!work) return;

            document.getElementById('detail-title').textContent = work.title;
            document.getElementById('detail-author').textContent = `作者: ${work.author}`;
            document.getElementById('detail-category').textContent = work.category;
            document.getElementById('detail-desc').textContent = work.description;
            document.getElementById('detail-iframe').srcdoc = work.code;
            document.getElementById('detail-code').textContent = work.code;
            document.getElementById('like-count').textContent = work.likes;
            
            const likeBtn = document.getElementById('like-btn');
            if (work.liked) {
                likeBtn.classList.add('liked');
            } else {
                likeBtn.classList.remove('liked');
            }

            document.getElementById('code-content').classList.remove('open');
            document.getElementById('code-toggle-icon').textContent = '▼';
            
            showPage('detail');
        }

        // 切换点赞
        function toggleLike() {
            if (!currentWorkId) return;
            const work = works.find(w => w.id === currentWorkId);
            if (!work) return;

            if (work.liked) {
                work.likes--;
                work.liked = false;
            } else {
                work.likes++;
                work.liked = true;
            }

            document.getElementById('like-count').textContent = work.likes;
            const likeBtn = document.getElementById('like-btn');
            likeBtn.classList.toggle('liked');
            
            saveWorks();
            renderWorks(document.querySelector('.filter-tag.active').dataset.filter);
        }

        // 切换代码显示
        function toggleCode() {
            const codeContent = document.getElementById('code-content');
            const icon = document.getElementById('code-toggle-icon');
            codeContent.classList.toggle('open');
            icon.textContent = codeContent.classList.contains('open') ? '▲' : '▼';
        }

        // 发布作品
        function publishWork() {
            const title = document.getElementById('publish-title').value.trim();
            const author = document.getElementById('publish-author').value.trim();
            const category = document.getElementById('publish-category').value;
            const desc = document.getElementById('publish-desc').value.trim();
            const code = document.getElementById('publish-code').value.trim();

            if (!title || !author || !desc || !code) {
                alert('请填写所有字段！');
                return;
            }

            const newWork = {
                id: Date.now().toString(),
                title,
                author,
                category,
                description: desc,
                code,
                likes: 0,
                liked: false
            };

            works.unshift(newWork);
            saveWorks();
            renderWorks();

            document.getElementById('publish-title').value = '';
            document.getElementById('publish-author').value = '';
            document.getElementById('publish-desc').value = '';
            document.getElementById('publish-code').value = '';

            showPage('home');
            alert('发布成功！🎉');
        }

        // 筛选标签点击
        document.querySelectorAll('.filter-tag').forEach(tag => {
            tag.addEventListener('click', () => {
                document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
                tag.classList.add('active');
                renderWorks(tag.dataset.filter);
            });
        });

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 启动
        init();
    </script>
</body>
</html>
