<style>

  /* 噪点纹理叠加 */
  .noise-bg::before {
    content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0.4; z-index: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/%3E%3C/svg%3E");
  }

  /* blob 装饰 */
  .blob {
    position: absolute; border-radius: 50%; filter: blur(40px); opacity: 0.55; z-index: 0;
    animation: floatBlob 12s ease-in-out infinite;
  }
  @keyframes floatBlob {
    0%, 100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(20px,-15px) scale(1.08); }
    66% { transform: translate(-15px,20px) scale(0.95); }
  }

  /* 呼吸动画 */
  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(1.12); opacity: 1; }
  }
  .animate-breathe { animation: breathe 4s ease-in-out infinite; }

  /* 页面切换淡入 */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .page-enter { animation: fadeInUp 0.45s cubic-bezier(0.22, 1, 0.36, 1); }

  /* 卡片悬浮 */
  .card-hover { transition: transform .35s cubic-bezier(.22,1,.36,1), box-shadow .35s; }
  .card-hover:active { transform: scale(0.97); }

  /* 情绪表情 */
  .mood-btn { transition: transform .25s, box-shadow .25s; }
  .mood-btn:active { transform: scale(1.18); }
  .mood-btn.active { transform: scale(1.15); box-shadow: 0 8px 24px rgba(168,197,224,0.5); }

  /* 聊天气泡 */
  .bubble-in { animation: bubbleIn .4s cubic-bezier(.22,1,.36,1); }
  @keyframes bubbleIn { from { opacity:0; transform: translateY(8px) scale(.96);} to {opacity:1; transform: translateY(0) scale(1);} }

  /* 打字指示器 */
  .typing-dot { animation: typingDot 1.2s infinite; }
  .typing-dot:nth-child(2){ animation-delay: .2s; }
  .typing-dot:nth-child(3){ animation-delay: .4s; }
  @keyframes typingDot { 0%,60%,100%{ opacity:.3; transform: translateY(0);} 30%{ opacity:1; transform: translateY(-4px);} }

  /* 呼吸训练圆 */
  @keyframes breathCircle {
    0%, 100% { transform: scale(0.7); }
    100% { transform: scale(1); }
  }

  /* 毛玻璃 */
  .glass { background: rgba(250,247,242,0.72); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }

  /* 底部导航激活态 */
  .nav-item.active { color: #7FA8C9; }
  .nav-item.active .nav-icon { transform: translateY(-2px) scale(1.1); }
  .nav-icon { transition: transform .3s cubic-bezier(.22,1,.36,1); }

  /* 渐变文字 */
  .gradient-text {
    background: linear-gradient(135deg, #7FA8C9 0%, #A8C5E0 50%, #C5DEDD 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* 安全区域 */
  .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }

  /* 隐藏滚动条但可滚动 */
  .scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .scroll-x::-webkit-scrollbar { display: none; }

  /* 进度环 */
  .ring-bg { stroke: #E8EFF5; }
  .ring-fg { stroke: #A8C5E0; transition: stroke-dashoffset 1s cubic-bezier(.22,1,.36,1); }

  /* 涟漪 */
  .ripple { position: relative; overflow: hidden; }

function genMoodData() {
  const data = JSON.parse(localStorage.getItem('moodHistory') || '[]');
  if (data.length === 0) {
    // 预设30天
    for (let i = 29; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate()-i);
      data.push({ date: d.toISOString().slice(0,10), mood: 2+Math.floor(Math.random()*3) });
    }
    localStorage.setItem('moodHistory', JSON.stringify(data));
    state.moodHistory = data;
  }
  return data;
}

function greeting() {

  if (h < 12) return '早安，新的一天';
  if (h < 14) return '午安，记得休息';
  if (h < 18) return '下午好';
  if (h < 22) return '晚上好';
  return '深夜陪伴';
}

function computeStreak(data) {
  if (!data.length) return 0;
  let s = 0; const todayD = new Date(); todayD.setHours(0,0,0,0);
  for (let i = 0; i < 60; i++) {
    const d = new Date(todayD); d.setDate(d.getDate()-i);
    const ds = d.toISOString().slice(0,10);
    if (data.find(m => m.date === ds)) s++;
    else if (i > 0) break;
  }
  return s;
}

}

function answer(i) {
  const a = state.assessment;
  a.answers.push(i);
  if (a.current < a.total - 1) {
    a.current++;
    render();
  } else {
    // 计算结果
    const score = a.answers.reduce((s,v) => s+v, 0);
    const max = a.total * 3;
    const pct = Math.round((score / max) * 100);
    let level = 'normal', levelText = '状态良好', levelColor = 'text-heal-green';
    if (pct >= 70) { level='severe'; levelText='需要关注'; levelColor='text-red-500'; }
    else if (pct >= 45) { level='moderate'; levelText='轻度波动'; levelColor='text-amber-500'; }
    else if (pct >= 25) { level='mild'; levelText='基本平稳'; levelColor='text-heal-blueDeep'; }
    const record = { id: Date.now().toString(), type: a.type, title: a.title, date: today(), score: pct, level, answers: [...a.answers] };
    state.assessmentHistory.unshift(record);
    save();
    state.lastReport = record;
    navigate('assessment-report');
  }
}

function sendChat() {
  const input = $('#chatInput');
  const text = input.value.trim();
  if (!text) return;
  state.chat.push({ role: 'user', content: text });
  input.value = '';
  render();

  // 检测危机
  if (checkCrisis(text)) {
    setTimeout(() => {
      state.chat.push({ role: 'ai', content: '我听到你了，也很感谢你愿意说出来。此刻你的感受非常重要，请先看看这个——你不是一个人，有人可以立即陪着你。' });
      render();
    }, 1200);
    return;
  }

  // 模拟AI回复
  setTimeout(() => {
    showTyping();
    setTimeout(() => {
      hideTyping();
      let reply;
      if (/焦虑|紧张|不安|烦躁|害怕|担心/.test(text)) reply = rand(AI_REPLIES.anxiety);
      else if (/难过|伤心|哭|失落|痛苦|绝望/.test(text)) reply = rand(AI_REPLIES.sad);
      else if (/睡|失眠|困|累|疲惫/.test(text)) reply = rand(AI_REPLIES.sleep);
      else if (/工作|职场|领导|同事|加班|压力/.test(text)) reply = rand(AI_REPLIES.work);
      else reply = rand(AI_REPLIES.default);
      state.chat.push({ role: 'ai', content: reply });
      render();
    }, 1500);
  }, 400);
}

let breathTimer = null, breathCycle = 0, breathPhase = 0;
const BREATH_PHASES = [
  { text: '吸气', dur: 4, scale: 1.3 },
  { text: '屏息', dur: 7, scale: 1.3 },
  { text: '呼气', dur: 8, scale: 0.85 },
];

function toggleBreathing() {
  if (breathTimer) stopBreathing();
  else startBreathing();
}

function startBreathing() {
  breathCycle = 0; breathPhase = 0;
  $('#breathBtn').textContent = '停止';
  nextBreathPhase();
}

function nextBreathPhase() {
  if (!breathTimer) return;
  const phase = BREATH_PHASES[breathPhase];
  $('#breathText').textContent = phase.text;
  const circle = $('#breathCircle');
  circle.style.transition = `transform ${phase.dur}s ease-in-out`;
  circle.style.transform = `scale(${phase.scale})`;

  let count = phase.dur;
  $('#breathCount').textContent = count + '秒';
  const countdown = setInterval(() => {
    count--;
    if (count >= 0) $('#breathCount').textContent = count + '秒';
    if (count <= 0) clearInterval(countdown);
  }, 1000);

  breathTimer = setTimeout(() => {
    breathPhase++;
    if (breathPhase >= BREATH_PHASES.length) {
      breathPhase = 0;
      breathCycle++;
      $('#cycleCount').textContent = breathCycle;
      const dot = $('#dot-' + ((breathCycle-1)%8));
      if (dot) dot.classList.replace('bg-heal-blueSoft','bg-heal-blue');
      if (breathCycle >= 8) { stopBreathing(); toast('练习完成，干得漂亮'); return; }
    }
    nextBreathPhase();
  }, phase.dur * 1000);
}

function stopBreathing() {
  if (breathTimer) { clearTimeout(breathTimer); breathTimer = null; }
  $('#breathBtn').textContent = '开始呼吸';
  $('#breathText').textContent = '准备';
  $('#breathCount').textContent = '点击开始';
  const circle = $('#breathCircle');
  if (circle) { circle.style.transition = 'transform 1s ease'; circle.style.transform = 'scale(1)'; }
}

function initBreathing() { breathTimer = null; }

  if (activeTab !== '推荐') articles = ARTICLES.filter(a => a.cat.includes(activeTab) || activeTab==='推荐');
  if (articles.length === 0) articles = ARTICLES;

  return `
  <header class="px-6 pt-12 pb-4">
    <h1 class="font-serif-cn text-2xl text-heal-ink">心理科普</h1>
    <p class="text-sm text-heal-inkSoft mt-1">科学认知 · 温柔理解</p>
  </header>

  <section class="px-6 mb-4">
    <div class="scroll-x flex gap-2">
      ${tabs.map(t => `
        <button onclick="navigate('content',{tab:'${t}'})" class="flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-medium transition ${activeTab===t?'bg-heal-blue text-white shadow-soft':'bg-white/70 text-heal-inkSoft'}">${t}</button>
      `).join('')}
    </div>
  </section>

  ${activeTab === '推荐' ? `
  <section class="px-6 mb-5">
    <div class="rounded-2xl bg-gradient-to-br from-heal-blue/30 to-heal-green/30 p-5 relative overflow-hidden">
      <div class="absolute -right-4 -bottom-4 text-6xl opacity-20">📖</div>
      <div class="relative z-10">
        <div class="text-xs text-heal-inkSoft mb-1">本周精选</div>
        <h2 class="font-serif-cn text-lg text-heal-ink mb-2 leading-snug">${ARTICLES[2].title}</h2>
        <p class="text-xs text-heal-inkSoft leading-relaxed mb-3">${ARTICLES[2].summary}</p>
        <button class="text-xs text-heal-blueDeep">阅读全文 →</button>
      </div>
    </div>
  </section>
  ` : ''}

  <section class="px-6 space-y-3">
    ${articles.map(a => `
      <button class="card-hover w-full text-left bg-white/80 rounded-2xl overflow-hidden shadow-card">
        <div class="h-32 ${a.cover} flex items-center justify-center text-5xl relative overflow-hidden">
          <div class="absolute inset-0 bg-black/5"></div>
          <span class="relative">📝</span>
        </div>
        <div class="p-4">
          <div class="flex items-center gap-2 mb-1.5">
            <span class="text-[10px] px-2 py-0.5 rounded-full bg-heal-blueSoft text-heal-blueDeep">${a.cat}</span>
            <span class="text-[10px] text-heal-inkSoft">${a.reads}阅读</span>
          </div>
          <h3 class="font-medium text-heal-ink text-sm mb-1 leading-snug">${a.title}</h3>
          <p class="text-xs text-heal-inkSoft leading-relaxed line-clamp-2">${a.summary}</p>
        </div>
      </button>
    `).join('')}
  </section>

  <style>
    .gradient-1 { background: linear-gradient(135deg, #A8C5E0, #7FA8C9); }
    .gradient-2 { background: linear-gradient(135deg, #C5DEDD, #A8C5E0); }
    .gradient-3 { background: linear-gradient(135deg, #F4D9A0, #F2C94C); }
    .gradient-4 { background: linear-gradient(135deg, #A8C5E0, #C5DEDD); }
    .gradient-5 { background: linear-gradient(135deg, #7FA8C9, #A8C5E0); }
    .gradient-6 { background: linear-gradient(135deg, #F4D9A0, #A8C5E0); }
    .line-clamp-2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  </style>
  `;
}

// ---------------- 个人中心 ----------------
function renderProfile() {
  const moodData = genMoodData();
  const avgMood = (moodData.reduce((s,m)=>s+m.mood,0)/moodData.length).toFixed(1);
  const streak = computeStreak(moodData);
  return `
  <header class="px-6 pt-12 pb-4">
    <div class="flex items-center gap-3 mb-1">
      <div class="w-14 h-14 rounded-full bg-gradient-to-br from-heal-blue to-heal-blueDeep flex items-center justify-center text-2xl text-white shadow-soft">🌿</div>
      <div>
        <div class="font-serif-cn text-lg text-heal-ink">匿名用户</div>
        <div class="text-xs text-heal-inkSoft">连续记录 ${streak} 天 · 心理成长中</div>
      </div>
    </div>
  </header>

  <!-- 仪表盘 -->
  <section class="px-6 mb-5">
    <div class="grid grid-cols-3 gap-3 mb-4">
      <div class="bg-white/80 rounded-2xl p-4 shadow-card text-center">
        <div class="font-serif-cn text-2xl text-heal-blueDeep">${avgMood}</div>
        <div class="text-[10px] text-heal-inkSoft mt-1">平均心情</div>
      </div>
      <div class="bg-white/80 rounded-2xl p-4 shadow-card text-center">
        <div class="font-serif-cn text-2xl text-heal-blueDeep">${state.assessmentHistory.length}</div>
        <div class="text-[10px] text-heal-inkSoft mt-1">测评次数</div>
      </div>
      <div class="bg-white/80 rounded-2xl p-4 shadow-card text-center">
        <div class="font-serif-cn text-2xl text-heal-blueDeep">${streak}</div>
        <div class="text-[10px] text-heal-inkSoft mt-1">打卡天数</div>
      </div>
    </div>

    <div class="bg-white/80 rounded-3xl p-5 shadow-card">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-serif-cn text-base text-heal-ink">30天情绪曲线</h2>
        <span class="text-xs text-heal-inkSoft">月度趋势</span>
      </div>
      <canvas id="moodChart" height="160"></canvas>
    </div>
  </section>

  <!-- 成长档案 -->
  <section class="px-6 mb-5">
    <h2 class="font-serif-cn text-base text-heal-ink mb-3">成长档案</h2>
    <div class="bg-white/80 rounded-2xl p-4 shadow-card">
      ${state.assessmentHistory.length > 0 ? state.assessmentHistory.slice(0,3).map(r => `
        <div class="flex items-center gap-3 py-2.5 border-b border-heal-blueSoft/50 last:border-0">
          <div class="w-8 h-8 rounded-full bg-heal-blueSoft flex items-center justify-center text-sm">${ASSESSMENTS.find(a=>a.id===r.type)?.icon||'📋'}</div>
          <div class="flex-1">
            <div class="text-sm text-heal-ink">${r.title}</div>
            <div class="text-[10px] text-heal-inkSoft">${r.date}</div>
          </div>
          <div class="text-sm font-medium text-heal-blueDeep">${r.score}分</div>
        </div>
      `).join('') : '<div class="text-center text-xs text-heal-inkSoft py-4">暂无测评记录</div>'}
    </div>
  </section>

  <!-- 功能入口 -->
  <section class="px-6 mb-5">
    <div class="bg-white/80 rounded-2xl shadow-card overflow-hidden">
      ${[
        { icon: '⭐', label: '我的收藏', action: 'toast("暂无收藏")' },
        { icon: '📅', label: '咨询记录', action: 'toast("暂无咨询记录")' },
        { icon: '🔒', label: '隐私设置', action: 'toast("数据已加密保护")' },
        { icon: '💎', label: '会员中心', action: 'toast("会员功能开发中")' },
        { icon: '🗑️', label: '清除所有数据', action: 'clearData()', danger: true },
      ].map((item,i) => `
        <button onclick="${item.action}" class="w-full flex items-center gap-3 px-4 py-3.5 ${i!==4?'border-b border-heal-blueSoft/40':''} text-left">
          <span class="text-lg">${item.icon}</span>
          <span class="flex-1 text-sm ${item.danger?'text-red-500':'text-heal-ink'}">${item.label}</span>
          <svg class="w-4 h-4 ${item.danger?'text-red-400':'text-heal-inkSoft'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      `).join('')}
    </div>
  </section>

  <div class="px-6 text-center text-xs text-heal-inkSoft/60 mb-4">心愈·轻心理 v1.0 · 让心理向阳生长</div>
  `;
}

function initProfileCharts() {
  const moodData = genMoodData();
  if (!$('#moodChart')) return;
  const ctx = $('#moodChart').getContext('2d');
  new Chart(ctx, {
    type: 'line',
    data: {
      labels: moodData.map(m => m.date.slice(5)),
      datasets: [{
        data: moodData.map(m => m.mood),
        borderColor: '#7FA8C9', borderWidth: 2, fill: true, tension: 0.4,
        backgroundColor: (ctx) => {
          const g = ctx.chart.ctx.createLinearGradient(0,0,0,160);
          g.addColorStop(0,'rgba(168,197,224,0.4)');
          g.addColorStop(1,'rgba(168,197,224,0)');
          return g;
        },
        pointRadius: 0, pointHoverRadius: 4, pointHoverBackgroundColor: '#7FA8C9',
      }]
    },
    options: {
      plugins: { legend: { display: false }, tooltip: {
        callbacks: { label: (c) => MOOD_LABELS[c.raw] }
      }},
      scales: {
        x: { display: false },
        y: { min: 0.5, max: 5.5, ticks: { stepSize: 1, callback:(v)=>MOOD_LABELS[v]||'', font:{size:10} }, grid: { color: 'rgba(127,168,201,0.15)' } }
      }
    }
  });
}

function clearData() {
  if (confirm('确定清除所有数据吗？此操作不可恢复。')) {
    localStorage.clear();
    state.moodHistory = []; state.assessmentHistory = []; state.chat = []; state.favorites = [];
    toast('数据已清除');
    setTimeout(() => location.reload(), 800);
  }
}

// ---------------- Toast ----------------
function toast(msg) {
  const t = el('div', 'fixed left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-[200] bg-heal-ink/85 text-white text-sm px-5 py-2.5 rounded-full shadow-float', msg);
  document.body.appendChild(t);
  t.style.animation = 'fadeInUp .3s';
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(()=>t.remove(),300); }, 1800);
}

// ---------------- 启动 ----------------
document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => navigate(btn.dataset.route));
});

// 初始化
genMoodData();
navigate('home');
</script>
</body>
</html>
