<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>备忘录</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=ZCOOL+XiaoWei&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #f5f0e8;
      --bg-secondary: #fff;
      --accent: #c45c48;
      --text-primary: #2c2c2c;
      --text-secondary: #6b6b6b;
      --border: #d4c5b5;
      --shadow: rgba(0, 0, 0, 0.08);
    }

    body {
      font-family: 'Noto Serif SC', serif;
      background: var(--bg-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      background-image:
        radial-gradient(circle at 20% 80%, rgba(196, 92, 72, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(196, 92, 72, 0.05) 0%, transparent 50%);
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      position: relative;
    }

    h1 {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 2.5rem;
      color: var(--text-primary);
      letter-spacing: 0.1em;
      position: relative;
      display: inline-block;
    }

    h1::before,
    h1::after {
      content: '✦';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: var(--accent);
      font-size: 0.8rem;
    }

    h1::before { left: -30px; }
    h1::after { right: -30px; }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 8px;
      letter-spacing: 0.2em;
    }

    .memo-card {
      background: var(--bg-secondary);
      border-radius: 4px;
      box-shadow: 0 4px 20px var(--shadow);
      padding: 30px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .memo-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), #e8a87c, var(--accent));
    }

    .input-section {
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      height: 120px;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 16px;
      font-family: 'Noto Serif SC', serif;
      font-size: 1rem;
      color: var(--text-primary);
      resize: none;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      background: #fafaf8;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(196, 92, 72, 0.1);
    }

    textarea::placeholder {
      color: #aaa;
    }

    .btn-row {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    button {
      padding: 10px 24px;
      border: none;
      border-radius: 4px;
      font-family: 'Noto Serif SC', serif;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-add {
      background: var(--accent);
      color: white;
    }

    .btn-add:hover {
      background: #a84d3b;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(196, 92, 72, 0.3);
    }

    .btn-clear {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .btn-clear:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .memo-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .memo-item {
      background: var(--bg-secondary);
      border-radius: 4px;
      padding: 20px;
      box-shadow: 0 2px 12px var(--shadow);
      border: 1px solid var(--border);
      position: relative;
      animation: slideIn 0.4s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .memo-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--accent);
      border-radius: 4px 0 0 4px;
    }

    .memo-content {
      font-size: 1rem;
      color: var(--text-primary);
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .memo-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
    }

    .memo-time {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .btn-delete {
      background: none;
      color: #999;
      padding: 4px 12px;
      font-size: 0.85rem;
    }

    .btn-delete:hover {
      color: #c45c48;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-state .icon {
      font-size: 3rem;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state p {
      font-size: 0.95rem;
      letter-spacing: 0.1em;
    }

    .stats {
      text-align: center;
      margin-top: 30px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      letter-spacing: 0.1em;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-secondary);
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>备忘录</h1>
      <p class="subtitle">MEMO</p>
    </header>

    <div class="memo-card">
      <div class="input-section">
        <textarea id="memoInput" placeholder="记录此刻的想法..."></textarea>
      </div>
      <div class="btn-row">
        <button class="btn-clear" onclick="clearInput()">清空</button>
        <button class="btn-add" onclick="addMemo()">添加</button>
      </div>
    </div>

    <div id="memoList" class="memo-list"></div>

    <div id="emptyState" class="empty-state">
      <div class="icon">📝</div>
      <p>暂无备忘录</p>
    </div>

    <div id="stats" class="stats"></div>

    <footer>记录生活 · 定格思考</footer>
  </div>

  <script>
    const STORAGE_KEY = 'memos';

    function getMemos() {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    }

    function saveMemos(memos) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(memos));
    }

    function formatTime(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      const h = String(date.getHours()).padStart(2, '0');
      const min = String(date.getMinutes()).padStart(2, '0');
      return `${y}/${m}/${d} ${h}:${min}`;
    }

    function addMemo() {
      const input = document.getElementById('memoInput');
      const content = input.value.trim();

      if (!content) {
        input.focus();
        return;
      }

      const memos = getMemos();
      memos.unshift({
        id: Date.now(),
        content,
        time: formatTime(new Date())
      });

      saveMemos(memos);
      input.value = '';
      renderMemos();
    }

    function deleteMemo(id) {
      const memos = getMemos().filter(m => m.id !== id);
      saveMemos(memos);
      renderMemos();
    }

    function clearInput() {
      document.getElementById('memoInput').value = '';
    }

    function renderMemos() {
      const memos = getMemos();
      const listEl = document.getElementById('memoList');
      const emptyEl = document.getElementById('emptyState');
      const statsEl = document.getElementById('stats');

      if (memos.length === 0) {
        listEl.innerHTML = '';
        emptyEl.style.display = 'block';
        statsEl.textContent = '';
        return;
      }

      emptyEl.style.display = 'none';
      statsEl.textContent = `共 ${memos.length} 条记录`;

      listEl.innerHTML = memos.map(memo => `
        <div class="memo-item">
          <div class="memo-content">${escapeHtml(memo.content)}</div>
          <div class="memo-footer">
            <span class="memo-time">${memo.time}</span>
            <button class="btn-delete" onclick="deleteMemo(${memo.id})">删除</button>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 快捷键支持
    document.getElementById('memoInput').addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'Enter') {
        addMemo();
      }
    });

    renderMemos();
  </script>
</body>
</html>
