    <div id="app">
      <canvas id="scene"></canvas>

      <header class="topbar">
        <div class="brand">
          <span class="brand-mark"></span>
          <div>
            <strong>CYBER FUSION CENTER</strong>
            <span>网络设备攻击态势感知大屏</span>
          </div>
        </div>
        <div class="top-metrics">
          <div><span id="clock">--:--:--</span><small>实时监控</small></div>
          <div><span id="threatLevel">高危</span><small>威胁等级</small></div>
          <div><span id="riskScore">89</span><small>综合风险</small></div>
        </div>
      </header>

      <aside class="panel panel-left">
        <section class="module">
          <h2>资产状态</h2>
          <div class="asset-ring">
            <div class="ring-core">
              <strong id="onlineCount">128</strong>
              <span>在线设备</span>
            </div>
          </div>
          <div class="status-grid">
            <div><b id="safeCount">91</b><span>正常</span></div>
            <div><b id="warnCount">26</b><span>告警</span></div>
            <div><b id="dangerCount">11</b><span>失陷</span></div>
          </div>
        </section>

        <section class="module">
          <h2>攻击类型分布</h2>
          <div class="bars" id="attackBars"></div>
        </section>

        <section class="module compact">
          <h2>防护链路</h2>
          <div class="defense-list">
            <p><span></span> WAF 拦截策略运行中</p>
            <p><span></span> IDS 异常流量分析中</p>
            <p><span></span> EDR 终端联动处置中</p>
          </div>
        </section>
      </aside>

      <aside class="panel panel-right">
        <section class="module">
          <h2>实时攻击事件</h2>
          <div class="event-list" id="eventList"></div>
        </section>

        <section class="module">
          <h2>高危目标</h2>
          <div class="target-list" id="targetList"></div>
        </section>
      </aside>

      <footer class="bottombar">
        <div class="scan-line"></div>
        <div class="ticker" id="ticker">正在聚合东西向流量、VPN 登录、交换机镜像口与边界防火墙告警...</div>
      </footer>
    </div>
