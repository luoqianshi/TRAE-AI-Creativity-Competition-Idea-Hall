<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全损音乐播放器 - 回到音质很差的年代</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }
        
        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }
        
        /* 复古标题 */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 900;
            color: #e94560;
            text-shadow: 3px 3px 0px #16213e;
            letter-spacing: 2px;
        }
        
        .header .subtitle {
            font-size: 14px;
            color: #888;
            margin-top: 8px;
        }
        
        .header .year-badge {
            display: inline-block;
            background: #e94560;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 10px;
            font-weight: 700;
        }
        
        /* 播放器主体 */
        .player-card {
            background: #16213e;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border: 2px solid #0f3460;
        }
        
        /* 唱片动画 */
        .vinyl-container {
            width: 220px;
            height: 220px;
            margin: 0 auto 25px;
            position: relative;
        }
        
        .vinyl {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: 
                radial-gradient(circle at center, #1a1a2e 0%, #1a1a2e 15%, transparent 15%),
                repeating-radial-gradient(circle at center, #222 0px, #222 2px, #111 2px, #111 4px);
            border: 8px solid #111;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.3);
            animation: spin 3s linear infinite;
            animation-play-state: paused;
            position: relative;
        }
        
        .vinyl.playing {
            animation-play-state: running;
        }
        
        .vinyl::after {
            content: '🎵';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 30px;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* 音轨可视化 */
        .visualizer {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 60px;
            gap: 4px;
            margin-bottom: 20px;
        }
        
        .bar {
            width: 6px;
            background: #e94560;
            border-radius: 3px;
            transition: height 0.1s ease;
        }
        
        /* 歌曲信息 */
        .song-info {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .song-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 5px;
        }
        
        .song-artist {
            font-size: 14px;
            color: #888;
        }
        
        .quality-badge {
            display: inline-block;
            background: #e94560;
            color: white;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 11px;
            margin-top: 8px;
            font-weight: 700;
        }
        
        /* 进度条 */
        .progress-container {
            margin-bottom: 20px;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #0f3460;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }
        
        .progress-fill {
            height: 100%;
            background: #e94560;
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        
        /* 控制按钮 */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .btn {
            background: none;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            color: #fff;
            font-size: 24px;
        }
        
        .btn:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }
        
        .btn-play {
            width: 60px;
            height: 60px;
            background: #e94560;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 20px rgba(233, 69, 96, 0.4);
        }
        
        /* 音质效果选择 */
        .effects-section {
            border-top: 1px solid #0f3460;
            padding-top: 20px;
        }
        
        .effects-title {
            font-size: 14px;
            color: #888;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .effects-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        
        .effect-btn {
            background: #0f3460;
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 12px 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        
        .effect-btn:hover {
            border-color: #e94560;
            transform: translateY(-2px);
        }
        
        .effect-btn.active {
            background: #e94560;
            border-color: #e94560;
        }
        
        .effect-icon {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .effect-name {
            font-size: 11px;
            color: #fff;
            font-weight: 700;
        }
        
        .effect-btn.active .effect-name {
            color: #fff;
        }
        
        /* 文件上传 */
        .upload-section {
            margin-top: 20px;
            text-align: center;
        }
        
        .upload-btn {
            background: #0f3460;
            border: 2px dashed #e94560;
            border-radius: 12px;
            padding: 15px 30px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            width: 100%;
        }
        
        .upload-btn:hover {
            background: #e94560;
            border-style: solid;
        }
        
        input[type="file"] {
            display: none;
        }
        
        /* 怀旧语录 */
        .quote {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #666;
            font-style: italic;
        }
        
        /* 响应式 */
        @media (max-width: 480px) {
            .header h1 {
                font-size: 22px;
            }
            
            .vinyl-container {
                width: 180px;
                height: 180px;
            }
        }
        
        /* 故障艺术效果 */
        .glitch {
            position: relative;
        }
        
        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 #00fff9;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }
        
        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 #e94560;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }
        
        @keyframes glitch-anim {
            0% { clip: rect(31px, 9999px, 94px, 0); }
            20% { clip: rect(70px, 9999px, 11px, 0); }
            40% { clip: rect(12px, 9999px, 83px, 0); }
            60% { clip: rect(89px, 9999px, 23px, 0); }
            80% { clip: rect(45px, 9999px, 67px, 0); }
            100% { clip: rect(2px, 9999px, 96px, 0); }
        }
        
        @keyframes glitch-anim2 {
            0% { clip: rect(65px, 9999px, 30px, 0); }
            20% { clip: rect(15px, 9999px, 78px, 0); }
            40% { clip: rect(92px, 9999px, 5px, 0); }
            60% { clip: rect(38px, 9999px, 52px, 0); }
            80% { clip: rect(71px, 9999px, 19px, 0); }
            100% { clip: rect(54px, 9999px, 88px, 0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="glitch" data-text="全损音乐播放器">全损音乐播放器</h1>
            <p class="subtitle">回到那个音质很差，但回忆很美的年代</p>
            <span class="year-badge">90's - 00's 怀旧版</span>
        </div>
        
        <div class="player-card">
            <!-- 唱片 -->
            <div class="vinyl-container">
                <div class="vinyl" id="vinyl"></div>
            </div>
            
            <!-- 可视化 -->
            <div class="visualizer" id="visualizer">
                <!-- 动态生成 -->
            </div>
            
            <!-- 歌曲信息 -->
            <div class="song-info">
                <div class="song-title" id="songTitle">选择一首歌曲</div>
                <div class="song-artist" id="songArtist">支持 MP3 / WAV / OGG</div>
                <span class="quality-badge" id="qualityBadge">原始音质</span>
            </div>
            
            <!-- 进度条 -->
            <div class="progress-container">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>
            
            <!-- 控制按钮 -->
            <div class="controls">
                <button class="btn" id="prevBtn">⏮</button>
                <button class="btn btn-play" id="playBtn">▶</button>
                <button class="btn" id="nextBtn">⏭</button>
            </div>
            
            <!-- 音质效果 -->
            <div class="effects-section">
                <div class="effects-title">选择你的"全损"体验 👇</div>
                <div class="effects-grid">
                    <div class="effect-btn active" data-effect="original">
                        <div class="effect-icon">✨</div>
                        <div class="effect-name">原始音质</div>
                    </div>
                    <div class="effect-btn" data-effect="radio">
                        <div class="effect-icon">📻</div>
                        <div class="effect-name">收音机</div>
                    </div>
                    <div class="effect-btn" data-effect="tape">
                        <div class="effect-icon">📼</div>
                        <div class="effect-name">磁带卡顿</div>
                    </div>
                    <div class="effect-btn" data-effect="cd">
                        <div class="effect-icon">💿</div>
                        <div class="effect-name">光盘划痕</div>
                    </div>
                    <div class="effect-btn" data-effect="phone">
                        <div class="effect-icon">📞</div>
                        <div class="effect-name">电话音质</div>
                    </div>
                    <div class="effect-btn" data-effect="mp3">
                        <div class="effect-icon">🎵</div>
                        <div class="effect-name">64kbps</div>
                    </div>
                </div>
            </div>
            
            <!-- 上传 -->
            <div class="upload-section">
                <label for="fileInput" class="upload-btn">
                    📁 上传音乐文件，开始"全损"之旅
                </label>
                <input type="file" id="fileInput" accept="audio/*">
            </div>
        </div>
        
        <p class="quote" id="quote">"那时候我们用磁带听歌，A面听完要手动翻面..."</p>
    </div>

    <script>
        // 音频上下文
        let audioContext = null;
        let audioBuffer = null;
        let sourceNode = null;
        let gainNode = null;
        let filterNode = null;
        let distortionNode = null;
        let isPlaying = false;
        let startTime = 0;
        let pauseTime = 0;
        let currentEffect = 'original';
        let animationId = null;
        
        // 怀旧语录
        const quotes = [
            "那时候我们用磁带听歌，A面听完要手动翻面...",
            "MP3播放器只有128MB，却能装下整个青春",
            "耳机线总是打结，就像我们的青春一样纠缠",
            "网吧里戴着廉价耳机，听着周杰伦的新歌",
            "磁带绞带了，用铅笔插进去慢慢转回来",
            "CD机防震功能不好，走路听歌就跳音",
            "诺基亚的铃声，是那个年代最动听的旋律",
            "用复读机听英语，其实在听流行歌曲"
        ];
        
        // DOM 元素
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const vinyl = document.getElementById('vinyl');
        const fileInput = document.getElementById('fileInput');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const songTitle = document.getElementById('songTitle');
        const songArtist = document.getElementById('songArtist');
        const qualityBadge = document.getElementById('qualityBadge');
        const visualizer = document.getElementById('visualizer');
        const quoteEl = document.getElementById('quote');
        
        // 创建可视化条
        for (let i = 0; i < 20; i++) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            bar.style.height = '5px';
            visualizer.appendChild(bar);
        }
        
        // 初始化音频上下文
        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        // 创建效果节点
        function createEffectNodes() {
            if (!audioContext) return;
            
            // 清除旧节点
            if (filterNode) filterNode.disconnect();
            if (distortionNode) distortionNode.disconnect();
            
            filterNode = audioContext.createBiquadFilter();
            distortionNode = audioContext.createWaveShaper();
            gainNode = audioContext.createGain();
            
            // 根据效果设置参数
            switch (currentEffect) {
                case 'radio':
                    // 收音机效果：带通滤波 + 轻微失真
                    filterNode.type = 'bandpass';
                    filterNode.frequency.value = 1500;
                    filterNode.Q.value = 1;
                    distortionNode.curve = makeDistortionCurve(50);
                    gainNode.gain.value = 1.2;
                    break;
                    
                case 'tape':
                    // 磁带效果：低频增强 + 轻微失真
                    filterNode.type = 'lowpass';
                    filterNode.frequency.value = 8000;
                    distortionNode.curve = makeDistortionCurve(20);
                    gainNode.gain.value = 1.1;
                    break;
                    
                case 'cd':
                    // 光盘划痕：间歇性爆音（通过增益模拟）
                    filterNode.type = 'allpass';
                    distortionNode.curve = makeDistortionCurve(100);
                    gainNode.gain.value = 1.3;
                    break;
                    
                case 'phone':
                    // 电话音质：窄带通
                    filterNode.type = 'bandpass';
                    filterNode.frequency.value = 2000;
                    filterNode.Q.value = 0.5;
                    distortionNode.curve = makeDistortionCurve(80);
                    gainNode.gain.value = 1.5;
                    break;
                    
                case 'mp3':
                    // 64kbps效果：低通滤波 + 压缩感
                    filterNode.type = 'lowpass';
                    filterNode.frequency.value = 5000;
                    distortionNode.curve = makeDistortionCurve(30);
                    gainNode.gain.value = 0.9;
                    break;
                    
                default:
                    // 原始音质
                    filterNode.type = 'allpass';
                    distortionNode.curve = makeDistortionCurve(0);
                    gainNode.gain.value = 1;
            }
        }
        
        // 创建失真曲线
        function makeDistortionCurve(amount) {
            const samples = 44100;
            const curve = new Float32Array(samples);
            const deg = Math.PI / 180;
            
            for (let i = 0; i < samples; i++) {
                const x = (i * 2) / samples - 1;
                curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
            }
            
            return curve;
        }
        
        // 播放音频
        function playAudio() {
            if (!audioBuffer || !audioContext) return;
            
            // 停止之前的播放
            if (sourceNode) {
                sourceNode.stop();
            }
            
            createEffectNodes();
            
            sourceNode = audioContext.createBufferSource();
            sourceNode.buffer = audioBuffer;
            
            // 连接节点链
            sourceNode.connect(filterNode);
            filterNode.connect(distortionNode);
            distortionNode.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            // 从暂停位置开始
            const offset = pauseTime || 0;
            sourceNode.start(0, offset);
            startTime = audioContext.currentTime - offset;
            isPlaying = true;
            
            vinyl.classList.add('playing');
            playBtn.textContent = '⏸';
            
            // 更新进度
            updateProgress();
            
            // 播放结束
            sourceNode.onended = () => {
                if (isPlaying) {
                    isPlaying = false;
                    vinyl.classList.remove('playing');
                    playBtn.textContent = '▶';
                    pauseTime = 0;
                    progressFill.style.width = '0%';
                }
            };
        }
        
        // 暂停音频
        function pauseAudio() {
            if (sourceNode) {
                sourceNode.stop();
            }
            pauseTime = audioContext.currentTime - startTime;
            isPlaying = false;
            vinyl.classList.remove('playing');
            playBtn.textContent = '▶';
            cancelAnimationFrame(animationId);
        }
        
        // 更新进度
        function updateProgress() {
            if (!isPlaying || !audioBuffer) return;
            
            const current = audioContext.currentTime - startTime;
            const duration = audioBuffer.duration;
            const progress = (current / duration) * 100;
            
            progressFill.style.width = progress + '%';
            currentTimeEl.textContent = formatTime(current);
            durationEl.textContent = formatTime(duration);
            
            // 可视化动画
            updateVisualizer();
            
            animationId = requestAnimationFrame(updateProgress);
        }
        
        // 更新可视化
        function updateVisualizer() {
            const bars = visualizer.querySelectorAll('.bar');
            bars.forEach((bar, index) => {
                const height = Math.random() * 50 + 5;
                bar.style.height = height + 'px';
                
                // 根据效果改变颜色
                if (currentEffect === 'radio') {
                    bar.style.background = '#f39c12';
                } else if (currentEffect === 'tape') {
                    bar.style.background = '#e74c3c';
                } else if (currentEffect === 'cd') {
                    bar.style.background = '#9b59b6';
                } else if (currentEffect === 'phone') {
                    bar.style.background = '#3498db';
                } else if (currentEffect === 'mp3') {
                    bar.style.background = '#1abc9c';
                } else {
                    bar.style.background = '#e94560';
                }
            });
        }
        
        // 格式化时间
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return mins + ':' + (secs < 10 ? '0' : '') + secs;
        }
        
        // 加载音频文件
        function loadAudioFile(file) {
            initAudioContext();
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const arrayBuffer = e.target.result;
                audioContext.decodeAudioData(arrayBuffer, (buffer) => {
                    audioBuffer = buffer;
                    pauseTime = 0;
                    
                    songTitle.textContent = file.name.replace(/\.[^/.]+$/, '');
                    songArtist.textContent = '本地音乐文件';
                    durationEl.textContent = formatTime(buffer.duration);
                    
                    // 自动播放
                    playAudio();
                });
            };
            reader.readAsArrayBuffer(file);
        }
        
        // 事件监听
        playBtn.addEventListener('click', () => {
            if (!audioBuffer) {
                alert('请先上传一首音乐！');
                return;
            }
            
            initAudioContext();
            
            if (isPlaying) {
                pauseAudio();
            } else {
                playAudio();
            }
        });
        
        prevBtn.addEventListener('click', () => {
            pauseTime = 0;
            if (isPlaying) playAudio();
            progressFill.style.width = '0%';
            currentTimeEl.textContent = '0:00';
        });
        
        nextBtn.addEventListener('click', () => {
            // 随机切换语录
            quoteEl.textContent = '"' + quotes[Math.floor(Math.random() * quotes.length)] + '"';
        });
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                loadAudioFile(file);
            }
        });
        
        // 进度条点击
        progressBar.addEventListener('click', (e) => {
            if (!audioBuffer) return;
            
            const rect = progressBar.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percent = clickX / rect.width;
            
            pauseTime = percent * audioBuffer.duration;
            progressFill.style.width = (percent * 100) + '%';
            
            if (isPlaying) {
                playAudio();
            }
        });
        
        // 效果切换
        document.querySelectorAll('.effect-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.effect-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                currentEffect = btn.dataset.effect;
                
                // 更新音质标签
                const effectNames = {
                    'original': '原始音质',
                    'radio': '📻 收音机杂音',
                    'tape': '📼 磁带卡顿',
                    'cd': '💿 光盘划痕',
                    'phone': '📞 电话音质',
                    'mp3': '🎵 64kbps超低保真'
                };
                qualityBadge.textContent = effectNames[currentEffect];
                
                // 如果正在播放，重新应用效果
                if (isPlaying && audioContext) {
                    const current = audioContext.currentTime - startTime;
                    pauseTime = current;
                    sourceNode.stop();
                    playAudio();
                }
            });
        });
        
        // 随机显示语录
        setInterval(() => {
            if (Math.random() > 0.7) {
                quoteEl.textContent = '"' + quotes[Math.floor(Math.random() * quotes.length)] + '"';
            }
        }, 10000);
    </script>
</body>
</html>
