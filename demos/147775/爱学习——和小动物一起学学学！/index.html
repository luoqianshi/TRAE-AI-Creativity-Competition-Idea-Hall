<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>爱学习——和小动物一起学学学！</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'ZCOOL KuaiLe', cursive, sans-serif;
      background: linear-gradient(135deg, #E0F7FA 0%, #FFF8DC 50%, #FFE4E1 100%);
      min-height: 100vh;
      color: #374151;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 36px;
      color: #374151;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 18px;
      color: #6B7280;
    }

    .section-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .animal-cards {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 24px;
    }

    .animal-card {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .animal-card:hover {
      transform: scale(1.1);
      box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
    }

    .animal-card.selected {
      box-shadow: 0 0 0 4px #FFD700;
      transform: scale(1.1);
    }

    .animal-card.rabbit { background: #FFB6C1; }
    .animal-card.squirrel { background: #FFA500; }
    .animal-card.bird { background: #87CEEB; }

    .status-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 24px;
    }

    .status-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .status-emoji {
      font-size: 64px;
      animation: bounce-slow 2s infinite;
    }

    .status-info h2 {
      font-size: 24px;
      color: #374151;
    }

    .status-level {
      font-size: 16px;
      color: #6B7280;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .exp-bar-container {
      margin-bottom: 8px;
    }

    .exp-label {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .exp-bar {
      height: 24px;
      background: #E5E7EB;
      border-radius: 12px;
      overflow: hidden;
    }

    .exp-fill {
      height: 100%;
      background: linear-gradient(90deg, #FFB6C1, #FFA500, #87CEEB, #98FB98, #FFD700);
      transition: width 0.5s ease-out;
    }

    .rewards {
      margin-top: 16px;
    }

    .rewards-label {
      font-size: 14px;
      color: #6B7280;
      margin-bottom: 8px;
    }

    .rewards-list {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .reward-item {
      font-size: 24px;
      animation: sparkle 1.5s ease-in-out infinite;
    }

    .btn-primary {
      width: 100%;
      padding: 16px 32px;
      font-size: 20px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
    }

    .btn-primary.numbers {
      background: linear-gradient(135deg, #FFB6C1, #FF69B4);
    }

    .btn-primary.colors {
      background: linear-gradient(135deg, #87CEEB, #40E0D0);
    }

    .btn-primary.vocabulary {
      background: linear-gradient(135deg, #98FB98, #ADFF2F);
    }

    .btn-secondary {
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      color: #374151;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      transition: all 0.3s;
      background: white;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .btn-secondary:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #374151;
      cursor: pointer;
      font-size: 18px;
    }

    .back-btn:hover {
      color: #1F2937;
    }

    .score-board {
      display: flex;
      gap: 24px;
    }

    .score-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 18px;
      font-weight: bold;
    }

    .category-tag {
      display: inline-block;
      padding: 8px 16px;
      background: #E0F2FE;
      color: #0369A1;
      border-radius: 20px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .question-card {
      background: rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 24px;
      text-align: center;
    }

    .question-number {
      display: inline-block;
      padding: 8px 16px;
      background: #FFD700;
      color: white;
      border-radius: 20px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .question-text {
      font-size: 28px;
      font-weight: bold;
      color: #374151;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      padding: 16px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s;
      background: white;
      color: #374151;
      text-align: center;
    }

    .option-btn:hover:not(:disabled) {
      transform: scale(1.05);
      background: #F3F4F6;
    }

    .option-btn:disabled {
      cursor: not-allowed;
    }

    .option-btn.selected {
      box-shadow: 0 0 0 4px #FFD700;
    }

    .option-btn.correct {
      background: #98FB98;
      color: white;
    }

    .option-btn.incorrect {
      background: #F87171;
      color: white;
    }

    .feedback-card {
      margin-top: 24px;
      padding: 24px;
      border-radius: 20px;
      text-align: center;
      animation: pop 0.3s ease-out;
    }

    .feedback-card.success {
      background: #98FB98;
      color: white;
    }

    .feedback-card.error {
      background: #F87171;
      color: white;
    }

    .feedback-icon {
      font-size: 48px;
      margin-bottom: 8px;
    }

    .feedback-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .feedback-text {
      font-size: 18px;
      margin-bottom: 16px;
    }

    .next-btn {
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      background: white;
      color: #374151;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .next-btn:hover {
      background: #F3F4F6;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      border-left: 4px solid;
    }

    .stat-card.blue { border-color: #60A5FA; }
    .stat-card.green { border-color: #4ADE80; }
    .stat-card.purple { border-color: #A78BFA; }
    .stat-card.orange { border-color: #FB923C; }

    .stat-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stat-emoji {
      font-size: 36px;
    }

    .stat-info {
      flex: 1;
    }

    .stat-label {
      font-size: 14px;
      color: #6B7280;
    }

    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: #374151;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    .streak-card {
      background: rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      padding: 32px;
      text-align: center;
      margin-bottom: 24px;
    }

    .streak-emoji {
      font-size: 64px;
      margin-bottom: 16px;
    }

    .streak-text {
      font-size: 24px;
      font-weight: bold;
      color: #374151;
      margin-bottom: 8px;
    }

    .streak-hint {
      font-size: 16px;
      color: #6B7280;
    }

    .progress-card {
      background: rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .progress-rate {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .progress-bar {
      height: 16px;
      background: #E5E7EB;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #F472B6, #FB923C, #FBBF24);
      transition: width 0.5s;
    }

    .category-stats {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .category-row {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
    }

    .achievement-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .achievement-item {
      background: rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      padding: 16px;
    }

    .achievement-item.locked {
      opacity: 0.5;
    }

    .achievement-emoji {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .achievement-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .achievement-desc {
      font-size: 12px;
      color: #6B7280;
    }

    .level-rewards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .level-reward-item {
      background: rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      padding: 16px;
    }

    .level-reward-item.locked {
      opacity: 0.5;
    }

    .level-reward-item.current {
      box-shadow: 0 0 0 2px #FFD700;
    }

    .level-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .level-emoji {
      font-size: 24px;
    }

    .level-number {
      font-size: 16px;
      font-weight: bold;
    }

    .level-desc {
      font-size: 12px;
      color: #6B7280;
    }

    .tips-card {
      background: rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .tips-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tip-item {
      display: flex;
      gap: 12px;
      font-size: 16px;
    }

    .tip-emoji {
      font-size: 20px;
    }

    .confetti-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 9999;
    }

    .confetti-piece {
      position: absolute;
      font-size: 24px;
      animation: confetti-fall 3s ease-out forwards;
    }

    @keyframes bounce-slow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes sparkle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @keyframes pop {
      0% { transform: scale(0); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    @keyframes confetti-fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="app" class="container"></div>

  <script>
    const STORAGE_KEY = 'animal-learning-game';

    const initialAnimals = [
      { id: 'rabbit-1', type: 'rabbit', name: '小白兔', emoji: '🐰', level: 1, exp: 0, maxExp: 100, rewards: [] },
      { id: 'squirrel-1', type: 'squirrel', name: '小松鼠', emoji: '🐿️', level: 1, exp: 0, maxExp: 100, rewards: [] },
      { id: 'bird-1', type: 'bird', name: '小鸟儿', emoji: '🐦', level: 1, exp: 0, maxExp: 100, rewards: [] },
    ];

    const questionsData = [
      { id: 'num-1', category: 'numbers', question: '图片中有几个苹果？', options: ['1', '2', '3', '4'], correctAnswer: '3' },
      { id: 'num-2', category: 'numbers', question: '5 + 3 = ?', options: ['7', '8', '9', '10'], correctAnswer: '8' },
      { id: 'num-3', category: 'numbers', question: '哪个数字最大？', options: ['5', '12', '8', '3'], correctAnswer: '12' },
      { id: 'num-4', category: 'numbers', question: '10 - 4 = ?', options: ['5', '6', '7', '8'], correctAnswer: '6' },
      { id: 'num-5', category: 'numbers', question: '一共有几只小动物？', options: ['2', '3', '4', '5'], correctAnswer: '3' },
      { id: 'col-1', category: 'colors', question: '天空是什么颜色的？', options: ['红色', '蓝色', '绿色', '黄色'], correctAnswer: '蓝色' },
      { id: 'col-2', category: 'colors', question: '太阳是什么颜色的？', options: ['紫色', '橙色', '黄色', '粉色'], correctAnswer: '黄色' },
      { id: 'col-3', category: 'colors', question: '草地是什么颜色的？', options: ['绿色', '蓝色', '红色', '白色'], correctAnswer: '绿色' },
      { id: 'col-4', category: 'colors', question: '草莓是什么颜色的？', options: ['黄色', '蓝色', '红色', '紫色'], correctAnswer: '红色' },
      { id: 'col-5', category: 'colors', question: '香蕉是什么颜色的？', options: ['绿色', '黄色', '红色', '紫色'], correctAnswer: '黄色' },
      { id: 'voc-1', category: 'vocabulary', question: '🐰 是什么动物？', options: ['小猫', '小狗', '兔子', '小鸟'], correctAnswer: '兔子' },
      { id: 'voc-2', category: 'vocabulary', question: '🐱 喜欢吃什么？', options: ['骨头', '胡萝卜', '鱼', '草'], correctAnswer: '鱼' },
      { id: 'voc-3', category: 'vocabulary', question: '🌳 是什么？', options: ['花朵', '树木', '房子', '汽车'], correctAnswer: '树木' },
      { id: 'voc-4', category: 'vocabulary', question: '🌞 是什么？', options: ['月亮', '星星', '太阳', '云朵'], correctAnswer: '太阳' },
      { id: 'voc-5', category: 'vocabulary', question: '🦋 是什么？', options: ['蜜蜂', '蝴蝶', '小鸟', '蜻蜓'], correctAnswer: '蝴蝶' },
    ];

    const levelRewards = [
      { level: 1, description: '解锁小星星', emoji: '⭐' },
      { level: 2, description: '解锁闪亮星', emoji: '🌟' },
      { level: 3, description: '解锁彩虹', emoji: '🌈' },
      { level: 4, description: '解锁礼物', emoji: '🎁' },
      { level: 5, description: '解锁独角兽', emoji: '🦄' },
      { level: 6, description: '解锁糖果', emoji: '🍭' },
      { level: 7, description: '解锁蝴蝶', emoji: '🦋' },
      { level: 8, description: '解锁皇冠', emoji: '👑' },
    ];

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return JSON.parse(saved);
      } catch (e) {
        console.error('Failed to load game state');
      }
      return {};
    }

    function saveState(state) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error('Failed to save game state');
      }
    }

    const saved = loadState();

    const state = {
      animals: saved.animals || initialAnimals,
      currentAnimalId: saved.currentAnimalId || initialAnimals[0].id,
      questions: [],
      currentQuestionIndex: 0,
      currentCategory: 'numbers',
      score: 0,
      correctCount: 0,
      isPlaying: false,
      gameSessions: saved.gameSessions || [],
      stats: saved.stats || {
        totalStudyTime: 0,
        totalGamesPlayed: 0,
        correctRate: 0,
        completedLevels: 0,
        streakDays: 0,
        lastPlayDate: '',
      },
    };

    function getCurrentAnimal() {
      return state.animals.find(a => a.id === state.currentAnimalId);
    }

    function selectAnimal(animalId) {
      state.currentAnimalId = animalId;
      saveState(state);
      render();
    }

    function getRandomQuestions(category, count) {
      const categoryQuestions = questionsData.filter(q => q.category === category);
      const shuffled = [...categoryQuestions].sort(() => Math.random() - 0.5);
      return shuffled.slice(0, count);
    }

    function calculateStreak(lastPlayDate) {
      if (!lastPlayDate) return 0;
      const today = new Date();
      const lastDate = new Date(lastPlayDate);
      const diffDays = Math.floor((today.getTime() - lastDate.getTime()) / (1000 * 60 * 60 * 24));
      if (diffDays === 0) return 1;
      if (diffDays === 1) return 2;
      return 1;
    }

    let currentRoute = '/';

    function navigate(route) {
      currentRoute = route;
      render();
    }

    function startGame(category) {
      state.questions = getRandomQuestions(category, 5);
      state.currentQuestionIndex = 0;
      state.currentCategory = category;
      state.score = 0;
      state.correctCount = 0;
      state.isPlaying = true;
      navigate('/game');
    }

    function addExp(amount) {
      const animalIndex = state.animals.findIndex(a => a.id === state.currentAnimalId);
      if (animalIndex === -1) return;

      let animal = { ...state.animals[animalIndex] };
      let newExp = animal.exp + amount;
      let newLevel = animal.level;
      let newMaxExp = animal.maxExp;
      const newRewards = [...animal.rewards];

      while (newExp >= newMaxExp) {
        newExp -= newMaxExp;
        newLevel += 1;
        newMaxExp = Math.floor(newMaxExp * 1.5);
        const rewardEmojis = ['⭐', '🌟', '💫', '🎁', '🎉', '🌈', '🦄', '🍭'];
        if (newRewards.length < rewardEmojis.length) {
          newRewards.push(rewardEmojis[newRewards.length]);
        }
      }

      animal = { ...animal, exp: newExp, level: newLevel, maxExp: newMaxExp, rewards: newRewards };
      state.animals[animalIndex] = animal;
      saveState(state);
    }

    function endGame() {
      const session = {
        id: Date.now().toString(),
        category: state.currentCategory,
        score: state.score,
        totalQuestions: state.questions.length,
        correctAnswers: state.correctCount,
        timestamp: new Date(),
      };
      state.gameSessions.push(session);

      const today = new Date().toISOString().split('T')[0];
      if (state.stats.lastPlayDate !== today) {
        state.stats.streakDays = calculateStreak(state.stats.lastPlayDate);
      }

      const totalCorrect = state.stats.totalGamesPlayed * 5 * (state.stats.correctRate / 100) + state.correctCount;
      const totalQuestions = state.stats.totalGamesPlayed * 5 + state.questions.length;
      state.stats.correctRate = totalQuestions > 0 ? Math.round((totalCorrect / totalQuestions) * 100) : 0;
      state.stats.totalGamesPlayed += 1;
      state.stats.completedLevels += 1;
      state.stats.lastPlayDate = today;
      state.isPlaying = false;

      saveState(state);
      navigate('/');
    }

    function showConfetti() {
      const container = document.createElement('div');
      container.className = 'confetti-container';
      document.body.appendChild(container);

      for (let i = 0; i < 20; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.textContent = ['⭐', '🌟', '💫', '🎊', '🎉'][Math.floor(Math.random() * 5)];
        piece.style.left = Math.random() * 100 + '%';
        piece.style.top = '-20px';
        piece.style.animationDelay = Math.random() * 0.5 + 's';
        piece.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
        container.appendChild(piece);
      }

      setTimeout(() => {
        container.remove();
      }, 3000);
    }

    function renderHome() {
      const currentAnimal = getCurrentAnimal();
      const html = `
        <div class="header">
          <h1>🎓 爱学习 ✨</h1>
          <p>和小动物一起学学学！</p>
        </div>

        <div class="section-title">
          <span>✨</span>选择你的学习伙伴
        </div>

        <div class="animal-cards">
          ${state.animals.map(animal => `
            <div 
              class="animal-card ${animal.type} ${animal.id === state.currentAnimalId ? 'selected' : ''}"
              onclick="selectAnimal('${animal.id}')"
            >
              ${animal.emoji}
            </div>
          `).join('')}
        </div>

        ${currentAnimal ? `
        <div class="status-card">
          <div class="status-header">
            <div class="status-emoji">${currentAnimal.emoji}</div>
            <div class="status-info">
              <h2>${currentAnimal.name}</h2>
              <div class="status-level">
                <span>⭐</span>等级 ${currentAnimal.level}
              </div>
            </div>
          </div>
          <div class="exp-bar-container">
            <div class="exp-label">
              <span>⚡ 经验值</span>
              <span>${currentAnimal.exp} / ${currentAnimal.maxExp}</span>
            </div>
            <div class="exp-bar">
              <div class="exp-fill" style="width: ${(currentAnimal.exp / currentAnimal.maxExp) * 100}%"></div>
            </div>
          </div>
          ${currentAnimal.rewards.length > 0 ? `
          <div class="rewards">
            <div class="rewards-label">已获得奖励：</div>
            <div class="rewards-list">
              ${currentAnimal.rewards.map((reward, i) => `<span class="reward-item" style="animation-delay: ${i * 0.2}s">${reward}</span>`).join('')}
            </div>
          </div>
          ` : ''}
        </div>
        ` : ''}

        <div class="section-title">
          <span>▶️</span>开始学习
        </div>

        <button class="btn-primary numbers" onclick="startGame('numbers')">
          <span>🔢</span>数字识别
        </button>
        <button class="btn-primary colors" onclick="startGame('colors')">
          <span>🎨</span>颜色认知
        </button>
        <button class="btn-primary vocabulary" onclick="startGame('vocabulary')">
          <span>📚</span>简单词汇
        </button>

        <div class="btn-group">
          <button class="btn-secondary" onclick="navigate('/growth')">
            <span>🏆</span>动物成长
          </button>
          <button class="btn-secondary" onclick="navigate('/stats')">
            <span>📊</span>学习统计
          </button>
        </div>
      `;
      return html;
    }

    let gameState = {
      selectedAnswer: null,
      isCorrect: null,
      showFeedback: false,
    };

    function resetGameState() {
      gameState = {
        selectedAnswer: null,
        isCorrect: null,
        showFeedback: false,
      };
    }

    function handleAnswer(answer) {
      if (gameState.selectedAnswer !== null) return;

      const currentQuestion = state.questions[state.currentQuestionIndex];
      gameState.selectedAnswer = answer;
      gameState.isCorrect = answer === currentQuestion.correctAnswer;
      gameState.showFeedback = true;

      if (gameState.isCorrect) {
        state.score += 10;
        state.correctCount += 1;
        addExp(10);
        showConfetti();
      }

      render();
    }

    function handleNext() {
      if (state.currentQuestionIndex < state.questions.length - 1) {
        state.currentQuestionIndex += 1;
        resetGameState();
      } else {
        endGame();
        return;
      }
      render();
    }

    const categoryNames = { numbers: '数字识别', colors: '颜色认知', vocabulary: '简单词汇' };

    function renderGame() {
      const currentQuestion = state.questions[state.currentQuestionIndex];
      if (!currentQuestion) {
        return '<div style="text-align:center; padding: 50px;">加载中...</div>';
      }

      const currentAnimal = getCurrentAnimal();

      return `
        <div class="game-header">
          <div class="back-btn" onclick="navigate('/')">
            <span>←</span>返回
          </div>
          <div class="score-board">
            <div class="score-item">
              <span>⭐</span>${state.score}
            </div>
            <div class="score-item">
              <span>⚡</span>${state.correctCount}
            </div>
          </div>
        </div>

        <div style="text-align:center; margin-bottom: 16px;">
          <span class="category-tag">${categoryNames[state.currentCategory]}</span>
        </div>

        ${currentAnimal ? `
        <div style="text-align:center; margin-bottom: 16px;">
          <span style="font-size: 48px; animation: bounce-slow 2s infinite;">${currentAnimal.emoji}</span>
          <p style="color:#6B7280;">和 ${currentAnimal.name} 一起学习！</p>
        </div>
        ` : ''}

        <div class="question-card">
          <div class="question-number">${state.currentQuestionIndex + 1} / ${state.questions.length}</div>
          <div class="question-text">${currentQuestion.question}</div>
        </div>

        <div class="options-list">
          ${currentQuestion.options.map(option => {
            let className = 'option-btn';
            if (gameState.showFeedback) {
              if (option === currentQuestion.correctAnswer) {
                className += ' correct';
              } else if (gameState.selectedAnswer === option && !gameState.isCorrect) {
                className += ' incorrect';
              }
            } else if (gameState.selectedAnswer === option) {
              className += ' selected';
            }
            return `
              <button 
                class="${className}" 
                onclick="handleAnswer('${option}')"
                ${gameState.showFeedback ? 'disabled' : ''}
              >
                ${option}
              </button>
            `;
          }).join('')}
        </div>

        ${gameState.showFeedback ? `
        <div class="feedback-card ${gameState.isCorrect ? 'success' : 'error'}">
          <div class="feedback-icon">${gameState.isCorrect ? '✅' : '❌'}</div>
          <div class="feedback-title">${gameState.isCorrect ? '太棒了！🎉' : '加油哦！💪'}</div>
          <div class="feedback-text">${gameState.isCorrect ? '获得 10 经验值！' : '正确答案是：' + currentQuestion.correctAnswer}</div>
          <button class="next-btn" onclick="handleNext()">
            ${state.currentQuestionIndex < state.questions.length - 1 ? '下一题' : '完成'}
          </button>
        </div>
        ` : ''}
      `;
    }

    function renderGrowth() {
      const currentAnimal = getCurrentAnimal();

      return `
        <div class="game-header">
          <div class="back-btn" onclick="navigate('/')">
            <span>←</span>返回
          </div>
          <h1 style="font-size:24px;">🐾 动物成长</h1>
          <div style="width:60px;"></div>
        </div>

        ${currentAnimal ? `
        <div class="status-card">
          <div class="status-header">
            <div class="status-emoji">${currentAnimal.emoji}</div>
            <div class="status-info">
              <h2>${currentAnimal.name}</h2>
              <div class="status-level">
                <span>⭐</span>等级 ${currentAnimal.level}
              </div>
            </div>
          </div>
          <div class="exp-bar-container">
            <div class="exp-label">
              <span>⚡ 经验值</span>
              <span>${currentAnimal.exp} / ${currentAnimal.maxExp}</span>
            </div>
            <div class="exp-bar">
              <div class="exp-fill" style="width: ${(currentAnimal.exp / currentAnimal.maxExp) * 100}%"></div>
            </div>
          </div>
          ${currentAnimal.rewards.length > 0 ? `
          <div class="rewards">
            <div class="rewards-label">已获得奖励：</div>
            <div class="rewards-list">
              ${currentAnimal.rewards.map((reward, i) => `<span class="reward-item" style="animation-delay: ${i * 0.2}s">${reward}</span>`).join('')}
            </div>
          </div>
          ` : ''}
        </div>
        ` : ''}

        <div class="section-title">
          <span>🏆</span>等级奖励
        </div>

        <div class="level-rewards-grid">
          ${levelRewards.map(reward => {
            const isUnlocked = currentAnimal && currentAnimal.level >= reward.level;
            const isCurrent = currentAnimal && currentAnimal.level === reward.level;
            return `
              <div class="level-reward-item ${!isUnlocked ? 'locked' : ''} ${isCurrent ? 'current' : ''}">
                <div class="level-header">
                  <span class="level-emoji">${isUnlocked ? reward.emoji : '🔒'}</span>
                  <span class="level-number">Lv.${reward.level}</span>
                </div>
                <div class="level-desc">${reward.description}</div>
              </div>
            `;
          }).join('')}
        </div>

        <div class="section-title">
          <span>⭐</span>成长小贴士
        </div>

        <div class="tips-card">
          <div class="tips-list">
            <div class="tip-item">
              <span class="tip-emoji">📚</span>每天完成学习任务可以获得经验值
            </div>
            <div class="tip-item">
              <span class="tip-emoji">✅</span>答对题目可以获得更多经验值
            </div>
            <div class="tip-item">
              <span class="tip-emoji">⭐</span>升级后可以解锁更多奖励哦！
            </div>
            <div class="tip-item">
              <span class="tip-emoji">🎯</span>完成所有学习关卡可以快速升级
            </div>
          </div>
        </div>

        <div class="section-title">
          <span>⚡</span>当前状态
        </div>

        <div class="stats-grid">
          <div class="stat-card blue">
            <div class="stat-content">
              <span class="stat-emoji">⭐</span>
              <div class="stat-info">
                <div class="stat-label">总等级</div>
                <div class="stat-value">${currentAnimal ? currentAnimal.level : 1}</div>
              </div>
            </div>
          </div>
          <div class="stat-card orange">
            <div class="stat-content">
              <span class="stat-emoji">⚡</span>
              <div class="stat-info">
                <div class="stat-label">总经验</div>
                <div class="stat-value">${currentAnimal ? currentAnimal.exp : 0}</div>
              </div>
            </div>
          </div>
          <div class="stat-card purple">
            <div class="stat-content">
              <span class="stat-emoji">🏆</span>
              <div class="stat-info">
                <div class="stat-label">已获得奖励</div>
                <div class="stat-value">${currentAnimal ? currentAnimal.rewards.length : 0}</div>
              </div>
            </div>
          </div>
          <div class="stat-card green">
            <div class="stat-content">
              <span class="stat-emoji">🎯</span>
              <div class="stat-info">
                <div class="stat-label">距离下一等级</div>
                <div class="stat-value">${currentAnimal ? currentAnimal.maxExp - currentAnimal.exp : 100}</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderStats() {
      const categoryStats = {
        numbers: state.gameSessions.filter(s => s.category === 'numbers').length,
        colors: state.gameSessions.filter(s => s.category === 'colors').length,
        vocabulary: state.gameSessions.filter(s => s.category === 'vocabulary').length,
      };

      return `
        <div class="game-header">
          <div class="back-btn" onclick="navigate('/')">
            <span>←</span>返回
          </div>
          <h1 style="font-size:24px;">📊 学习统计</h1>
          <div style="width:60px;"></div>
        </div>

        <div class="stats-grid">
          <div class="stat-card blue">
            <div class="stat-content">
              <span class="stat-emoji">📅</span>
              <div class="stat-info">
                <div class="stat-label">学习天数</div>
                <div class="stat-value">${state.stats.streakDays} 天</div>
              </div>
            </div>
          </div>
          <div class="stat-card green">
            <div class="stat-content">
              <span class="stat-emoji">🎯</span>
              <div class="stat-info">
                <div class="stat-label">完成关卡</div>
                <div class="stat-value">${state.stats.completedLevels}</div>
              </div>
            </div>
          </div>
          <div class="stat-card purple">
            <div class="stat-content">
              <span class="stat-emoji">✅</span>
              <div class="stat-info">
                <div class="stat-label">答题正确率</div>
                <div class="stat-value">${state.stats.correctRate}%</div>
              </div>
            </div>
          </div>
          <div class="stat-card orange">
            <div class="stat-content">
              <span class="stat-emoji">🎮</span>
              <div class="stat-info">
                <div class="stat-label">游戏次数</div>
                <div class="stat-value">${state.stats.totalGamesPlayed}</div>
              </div>
            </div>
          </div>
        </div>

        <div class="section-title">
          <span>🔥</span>连续学习
        </div>

        <div class="streak-card">
          <div class="streak-emoji">
            ${state.stats.streakDays >= 7 ? '🏆' : state.stats.streakDays >= 3 ? '🔥' : state.stats.streakDays >= 1 ? '⭐' : '🌱'}
          </div>
          <div class="streak-text">连续学习 ${state.stats.streakDays} 天</div>
          <div class="streak-hint">
            ${state.stats.streakDays >= 7 ? '🎉 太棒了！获得学习之星称号！' : 
              state.stats.streakDays >= 3 ? '🔥 继续加油！坚持就是胜利！' :
              state.stats.streakDays === 0 ? '🌱 今天开始你的学习之旅吧！' : ''}
          </div>
        </div>

        <div class="section-title">
          <span>🎯</span>学习进度
        </div>

        <div class="progress-card">
          <div class="progress-rate">
            <span>正确率</span>
            <span>${state.stats.correctRate}%</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${state.stats.correctRate}%"></div>
          </div>
          <div class="category-stats">
            <div class="category-row">
              <span>🔢 数字识别</span>
              <span class="font-bold">${categoryStats.numbers} 次</span>
            </div>
            <div class="category-row">
              <span>🎨 颜色认知</span>
              <span class="font-bold">${categoryStats.colors} 次</span>
            </div>
            <div class="category-row">
              <span>📚 简单词汇</span>
              <span class="font-bold">${categoryStats.vocabulary} 次</span>
            </div>
          </div>
        </div>

        <div class="section-title">
          <span>🏆</span>成就徽章
        </div>

        <div class="achievement-grid">
          ${[
            { emoji: '🎯', title: '初学者', description: '完成第一次学习', unlocked: state.stats.totalGamesPlayed >= 1 },
            { emoji: '🔥', title: '坚持者', description: '连续学习3天', unlocked: state.stats.streakDays >= 3 },
            { emoji: '⭐', title: '学霸', description: '正确率达到80%', unlocked: state.stats.correctRate >= 80 },
            { emoji: '🏆', title: '学习之星', description: '连续学习7天', unlocked: state.stats.streakDays >= 7 },
          ].map((achievement, i) => `
            <div class="achievement-item ${achievement.unlocked ? '' : 'locked'}">
              <div class="achievement-emoji">${achievement.unlocked ? achievement.emoji : '🔒'}</div>
              <div class="achievement-title">${achievement.title}</div>
              <div class="achievement-desc">${achievement.description}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function render() {
      const app = document.getElementById('app');
      if (!app) return;

      let html = '';
      switch (currentRoute) {
        case '/game':
          html = renderGame();
          break;
        case '/growth':
          html = renderGrowth();
          break;
        case '/stats':
          html = renderStats();
          break;
        default:
          html = renderHome();
      }

      app.innerHTML = html;
    }

    render();
  </script>
</body>
</html>
