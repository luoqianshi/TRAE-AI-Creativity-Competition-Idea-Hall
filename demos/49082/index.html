<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>山东威海初中会考复习系统</title>
<style>
:root{--blue:#2563eb;--light:#f5f7fb;--text:#1f2937;--muted:#6b7280;--card:#fff;--green:#10b981;--red:#ef4444;--orange:#f59e0b;--purple:#7c3aed;--border:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei",Arial,sans-serif;background:linear-gradient(135deg,#eef5ff,#f8fbff);color:var(--text)}header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}.nav{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:14px 18px}.logo{font-weight:800;font-size:20px;color:var(--blue)}.tabs button,.back{border:0;background:transparent;padding:9px 12px;border-radius:10px;cursor:pointer;color:#374151;font-weight:600}.tabs button:hover,.tabs button.active,.back:hover{background:#eaf1ff;color:var(--blue)}main{max-width:1180px;margin:0 auto;padding:24px 18px 60px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:stretch}.panel,.card,.subject,.paper,.question{background:var(--card);border:1px solid var(--border);border-radius:22px;box-shadow:0 12px 30px rgba(37,99,235,.08)}.panel{padding:26px}.panel h1{font-size:34px;margin:0 0 10px}.panel p{color:var(--muted);line-height:1.8}.badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.badge{background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:8px 12px;font-size:14px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:22px}.subject{padding:24px;cursor:pointer;transition:.2s}.subject:hover{transform:translateY(-4px);box-shadow:0 20px 36px rgba(37,99,235,.15)}.subject .icon{font-size:38px}.subject h3{margin:12px 0 6px}.subject p{margin:0;color:var(--muted);font-size:14px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:28px 0 14px}.section-title h2{margin:0}.search{width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:16px;font-size:16px}.cols{display:grid;grid-template-columns:270px 1fr;gap:18px}.side{background:#fff;border:1px solid var(--border);border-radius:20px;padding:14px;align-self:start}.side button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:12px;padding:12px;margin:3px 0;cursor:pointer;font-weight:600}.side button:hover,.side button.active{background:#eff6ff;color:var(--blue)}.content{background:#fff;border:1px solid var(--border);border-radius:20px;padding:22px}.book-grid,.unit-grid,.paper-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.card,.paper{padding:18px;cursor:pointer;transition:.2s}.card:hover,.paper:hover{transform:translateY(-3px);box-shadow:0 14px 26px rgba(0,0,0,.08)}.mini{color:var(--muted);font-size:13px}.tag{display:inline-block;background:#f3f4f6;border-radius:999px;padding:5px 9px;margin:4px 4px 0 0;font-size:12px}.knowledge h3{color:var(--blue)}.note{border-left:5px solid var(--blue);background:#eff6ff;padding:12px 14px;border-radius:12px;margin:12px 0}.wrong{border-left-color:var(--red);background:#fff1f2}.formula{border-left-color:var(--green);background:#ecfdf5}.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:99;padding:18px}.modal{background:#fff;border-radius:24px;width:min(520px,100%);padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.25)}.check-row{display:flex;gap:12px;align-items:center;margin:12px 0;padding:14px;border:1px solid var(--border);border-radius:14px}.check-row input{width:20px;height:20px}.primary{background:var(--blue);color:white;border:0;border-radius:14px;padding:12px 18px;font-weight:800;cursor:pointer}.ghost{background:#f3f4f6;color:#374151;border:0;border-radius:14px;padding:12px 18px;font-weight:700;cursor:pointer}.exam-top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.question{padding:20px;margin-bottom:16px}.options label{display:block;border:1px solid var(--border);border-radius:12px;margin:8px 0;padding:10px;cursor:pointer}.options label:hover{background:#f9fafb}.result-card{border-radius:14px;padding:14px;margin:10px 0;border:1px solid var(--border)}.result-card.correct{background:#ecfdf5;border-color:#86efac}.result-card.wrong{background:#fff1f2;border-color:#fecdd3}.result-card.neutral{background:#f9fafb}.rubric-row{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--border);border-radius:12px;padding:10px;margin:8px 0}.rubric-row.ok{background:#ecfdf5;border-color:#86efac}.rubric-row.no{background:#fff1f2;border-color:#fecdd3}.answer-area textarea{width:100%;min-height:90px;border:1px solid var(--border);border-radius:12px;padding:10px}.result{font-size:30px;font-weight:900;color:var(--blue)}.analysis-box{background:#f9fafb;border:1px solid var(--border);border-radius:14px;padding:14px;margin-top:10px}.hide{display:none!important}@media(max-width:900px){.hero,.cols{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.tabs{display:none}}@media(max-width:520px){.grid{grid-template-columns:1fr}.panel h1{font-size:26px}}
</style>
</head>
<body>
<header><div class="nav"><div class="logo">山东威海初中会考复习系统</div><div class="tabs"><button onclick="showHome()" class="active">首页</button><button onclick="showExamCenter()">试题中心</button><button onclick="showSearch()">搜索</button><button onclick="showAbout()">说明</button></div></div></header>
<main id="app"></main>
<div class="modal-mask" id="typeModal"><div class="modal"><h2 id="modalTitle">选择题型</h2><p class="mini">勾选需要生成的题型，点击确认后再开始答题。</p><label class="check-row"><input type="checkbox" value="choice" checked> 选择题</label><label class="check-row"><input type="checkbox" value="judge" checked> 判断题</label><label class="check-row"><input type="checkbox" value="essay" checked> 大题 / 材料分析题</label><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px"><button class="ghost" onclick="closeModal()">取消</button><button class="primary" onclick="confirmGenerate()">确认生成试卷</button></div></div></div>
<script>
const subjects={
 geography:{name:'地理',icon:'🌍',color:'#10b981',exam:'初二会考',books:['初一上册','初一下册','初二上册','初二下册'],units:['地图与方向','地球与经纬网','天气与气候','世界地理','中国地理','区域发展'],knowledge:['经线指示南北方向，纬线指示东西方向。','等高线越密集，坡度越陡；等高线越稀疏，坡度越缓。','影响气候的主要因素包括纬度位置、海陆位置和地形。']},
 history:{name:'历史',icon:'📖',color:'#f59e0b',exam:'初三会考',books:['初一上册','初一下册','初二上册','初二下册','初三上册','初三下册'],units:['中国古代史','秦汉时期','隋唐时期','中国近代史','中国现代史','世界近现代史'],knowledge:['复习历史要抓住时间、人物、事件、原因、影响五个要素。','中国近代史常考列强侵略、民族危机、救亡图存和社会变革。','世界近现代史要注意工业革命、资本主义发展和国际格局变化。']},
 biology:{name:'生物',icon:'🧬',color:'#06b6d4',exam:'初三会考',books:['初一上册','初一下册','初二上册','初二下册','初三上册','初三下册'],units:['细胞与生物体','绿色植物','人体消化系统','人体呼吸系统','人体循环系统','遗传与变异','生物与环境'],knowledge:['细胞是生物体结构和功能的基本单位。','人体循环系统包括心脏、血管和血液。','遗传和变异是生物进化和多样性形成的重要基础。']},
 politics:{name:'道德与法治',icon:'⚖️',color:'#7c3aed',exam:'初四会考',books:['初一上册','初一下册','初二上册','初二下册','初三上册','初三下册','初四上册','初四下册'],units:['成长中的我','友谊与师长','规则与法律','权利与义务','宪法与法治','社会责任','国家发展','世界与未来'],knowledge:['道德与法治复习要联系生活情境，学会用教材观点分析材料。','公民权利与义务具有统一性，既要依法行使权利，也要自觉履行义务。','宪法是国家的根本法，具有最高法律效力。']}
};
const app=document.getElementById('app');let currentPaper=null;let currentExam=[];let userAnswers={};
function setActive(i){document.querySelectorAll('.tabs button').forEach((b,idx)=>b.classList.toggle('active',idx===i));}
function showHome(){setActive(0);app.innerHTML=`<section class="hero"><div class="panel"><h1>山东威海初中会考复习系统</h1><p>五四制四科复习：知识点学习、单元训练、单科综合试题、题型勾选生成试卷。当前版本不使用浏览器存储，因此已去掉错题本、收藏、学习统计等保存类功能。</p><div class="badges"><span class="badge">离线打开</span><span class="badge">不保存数据</span><span class="badge">题型可选</span><span class="badge">单科综合</span></div></div><div class="panel"><h2>使用流程</h2><p>选择科目 → 选择教材/单元 → 查看知识点或进入试题中心 → 勾选题型 → 确认生成试卷 → 答题 → 查看解析。</p></div></section><div class="section-title"><h2>选择科目</h2><button class="primary" onclick="showExamCenter()">进入试题中心</button></div><div class="grid">${Object.keys(subjects).map(k=>subjectCard(k)).join('')}</div>`;}
function subjectCard(k){const s=subjects[k];return `<div class="subject" onclick="showSubject('${k}')"><div class="icon">${s.icon}</div><h3>${s.name}</h3><p>${s.exam}</p><p class="mini">${s.books.length}册教材 · ${s.units.length}个示例单元</p></div>`}
function showSubject(k){const s=subjects[k];app.innerHTML=`<button class="back" onclick="showHome()">← 返回首页</button><div class="section-title"><h2>${s.icon} ${s.name}知识学习</h2><button class="primary" onclick="showSubjectPapers('${k}')">本科学科试题</button></div><div class="cols"><div class="side"><h3>教材册次</h3>${s.books.map((b,i)=>`<button onclick="showBook('${k}',${i})">${b}</button>`).join('')}</div><div class="content"><h2>请选择教材册次</h2><p class="mini">点击左侧册次后，可查看对应单元目录和知识点。这里先放入示例结构，后期可以继续扩充具体教材内容。</p><div class="book-grid">${s.books.map((b,i)=>`<div class="card" onclick="showBook('${k}',${i})"><h3>${b}</h3><p class="mini">查看单元与知识点</p></div>`).join('')}</div></div></div>`;}
function showBook(k,i){const s=subjects[k];app.innerHTML=`<button class="back" onclick="showSubject('${k}')">← 返回${s.name}</button><div class="section-title"><h2>${s.name} · ${s.books[i]}</h2><button class="primary" onclick="showSubjectPapers('${k}')">综合试题</button></div><div class="cols"><div class="side"><h3>单元目录</h3>${s.units.map((u,idx)=>`<button onclick="showUnit('${k}',${i},${idx})">${u}</button>`).join('')}</div><div class="content"><h2>单元目录</h2><div class="unit-grid">${s.units.map((u,idx)=>`<div class="card" onclick="showUnit('${k}',${i},${idx})"><h3>${u}</h3><p class="mini">知识点 + 单元5份试题</p></div>`).join('')}</div></div></div>`;}
function showUnit(k,bi,ui){const s=subjects[k],u=s.units[ui];app.innerHTML=`<button class="back" onclick="showBook('${k}',${bi})">← 返回单元目录</button><div class="section-title"><h2>${s.name} · ${u}</h2><button class="primary" onclick="showUnitPapers('${k}','${u}')">单元训练</button></div><div class="content knowledge"><h3>一、核心知识点</h3>${s.knowledge.map(x=>`<div class="note">${x}</div>`).join('')}<h3>二、必须记住</h3><div class="note formula">围绕概念、特点、作用、原因、影响、应用六个角度整理。</div><h3>三、易错提醒</h3><div class="note wrong">审题时注意关键词，如“正确的是”“不正确的是”“主要原因”“根本原因”等。</div><h3>四、配套训练</h3><p>本单元配置5份单元试题，每份试题均可勾选选择题、判断题和大题后生成。</p><button class="primary" onclick="showUnitPapers('${k}','${u}')">进入本单元试题</button></div>`;}
function showExamCenter(){setActive(1);app.innerHTML=`<div class="section-title"><h2>试题中心</h2><span class="mini">单元训练 + 单科综合试题</span></div><div class="grid">${Object.keys(subjects).map(k=>`<div class="subject" onclick="showSubjectPapers('${k}')"><div class="icon">${subjects[k].icon}</div><h3>${subjects[k].name}</h3><p>2份单科综合试题</p><p class="mini">每个单元5份试题</p></div>`).join('')}</div>`;}
function showSubjectPapers(k){const s=subjects[k];app.innerHTML=`<button class="back" onclick="showExamCenter()">← 返回试题中心</button><div class="section-title"><h2>${s.icon} ${s.name}试题</h2><span class="mini">综合试题为单科内部综合，不是四科混合</span></div><div class="content"><h2>单科综合试题</h2><div class="paper-grid">${[1,2].map(n=>`<div class="paper" onclick="openTypeModal('${k}','综合试题${n}','综合')"><h3>${s.name}综合试题${n}</h3><p class="mini">覆盖本科多个单元</p><span class="tag">选择题</span><span class="tag">判断题</span><span class="tag">大题</span></div>`).join('')}</div><h2 style="margin-top:28px">单元训练</h2><div class="unit-grid">${s.units.map(u=>`<div class="card" onclick="showUnitPapers('${k}','${u}')"><h3>${u}</h3><p class="mini">5份单元试题</p></div>`).join('')}</div></div>`;}
function showUnitPapers(k,u){const s=subjects[k];app.innerHTML=`<button class="back" onclick="showSubjectPapers('${k}')">← 返回${s.name}试题</button><div class="section-title"><h2>${s.name} · ${u}单元训练</h2><span class="mini">每个单元5份试题</span></div><div class="paper-grid">${[1,2,3,4,5].map(n=>`<div class="paper" onclick="openTypeModal('${k}','${u}单元测试${n}','${u}')"><h3>${u}单元测试${n}</h3><p class="mini">点击后先选择题型</p><span class="tag">选择题</span><span class="tag">判断题</span><span class="tag">大题</span></div>`).join('')}</div>`;}
function openTypeModal(subjectKey,paperName,scope){currentPaper={subjectKey,paperName,scope};document.getElementById('modalTitle').innerText=paperName+' · 选择题型';document.getElementById('typeModal').style.display='flex';}
function closeModal(){document.getElementById('typeModal').style.display='none'}
function confirmGenerate(){const checked=[...document.querySelectorAll('#typeModal input:checked')].map(x=>x.value);if(!checked.length){alert('请至少选择一种题型');return}closeModal();generateExam(checked)}

function qbank(k,scope){
 const s=subjects[k];

 if(k==='geography'){
   const geoChoice=[
     {q:'亚洲河流受地势影响，主要呈现出的流向特点是（ ）',ops:['由四周流向中部','由中部流向四周','全部自西向东流','全部自北向南流'],a:'B',ex:'亚洲地势中部高四周低。'},
     {q:'我国地理位置属于（ ）',ops:['东半球北半球','西半球南半球','西半球北半球','东半球南半球'],a:'A',ex:'我国位于东半球北半球。'},
     {q:'我国主要位于（ ）',ops:['热带','北温带','南温带','寒带'],a:'B',ex:'北温带为主。'},
     {q:'我国地势特征（ ）',ops:['西高东低','东高西低','南高北低','中间低四周高'],a:'A',ex:'西高东低。'},
     {q:'长江注入（ ）',ops:['渤海','黄海','东海','南海'],a:'C',ex:'东海。'}
   ];
   const geoJudge=[
     {q:'我国位于北半球。',a:'对',ex:'正确'},
     {q:'长江是我国最长河流。',a:'对',ex:'正确'}
   ];
   const geoEssay=[
     {q:'简述我国地理位置。',score:10,a:'略',ex:'略',rubric:[]}
   ];
   return {choice:geoChoice,judge:geoJudge,essay:geoEssay};
 }

 if(k==='history'){
   return {
     choice:[
       {q:'鸦片战争爆发于（ ）',ops:['1840','1911','1921','1949'],a:'A',ex:'1840年'},
       {q:'辛亥革命推翻（ ）',ops:['清朝','元朝','明朝','唐朝'],a:'A',ex:'清朝'},
       {q:'中国共产党成立于（ ）',ops:['1921','1919','1937','1945'],a:'A',ex:'1921'}
     ],
     judge:[
       {q:'五四运动是爱国运动。',a:'对',ex:'正确'},
       {q:'辛亥革命建立清朝。',a:'错',ex:'推翻清朝'}
     ],
     essay:[
       {q:'简述鸦片战争影响。',score:10,a:'中国开始沦为半殖民地半封建社会',ex:'核心结论',rubric:[]}
     ]
   };
 }

 if(k==='biology'){
   return {
     choice:[
       {q:'细胞是（ ）',ops:['结构和功能单位','器官','组织','系统'],a:'A',ex:'细胞'},
       {q:'光合作用主要器官（ ）',ops:['叶','根','茎','花'],a:'A',ex:'叶'},
       {q:'呼吸器官（ ）',ops:['肺','心','肝','胃'],a:'A',ex:'肺'}
     ],
     judge:[
       {q:'细胞是生命基本单位。',a:'对',ex:'正确'}
     ],
     essay:[
       {q:'循环系统组成。',score:10,a:'心脏血管血液',ex:'三部分',rubric:[]}
     ]
   };
 }

 if(k==='politics'){
   return {
     choice:[
       {q:'宪法是（ ）',ops:['根本法','普通法','地方性法规','习惯法'],a:'A',ex:'根本法'},
       {q:'国家性质是（ ）',ops:['社会主义','资本主义','封建','奴隶制'],a:'A',ex:'社会主义'},
       {q:'权利与义务关系（ ）',ops:['统一','对立','无关','随机'],a:'A',ex:'统一'}
     ],
     judge:[
       {q:'宪法最高法律效力。',a:'对',ex:'正确'}
     ],
     essay:[
       {q:'公民权利义务关系。',score:10,a:'统一关系',ex:'略',rubric:[]}
     ]
   };
 }

 return {choice:[],judge:[],essay:[]};
}


function generateExam(types){const {subjectKey,paperName,scope}=currentPaper;const bank=qbank(subjectKey,scope);currentExam=[];types.forEach(t=>{bank[t].forEach((q,i)=>currentExam.push({...q,type:t,id:t+i}))});userAnswers={};showExam(paperName)}
function typeName(t){return t==='choice'?'选择题':t==='judge'?'判断题':'大题'}
function showExam(title){app.innerHTML=`<div class="exam-top"><div><button class="back" onclick="showSubjectPapers('${currentPaper.subjectKey}')">← 返回试题</button><h2>${title}</h2><p class="mini">本次生成 ${currentExam.length} 道题。当前版本不保存答题记录，刷新或关闭后数据不会保留。</p></div><button class="primary" onclick="submitExam()">提交试卷</button></div><div>${currentExam.map((q,idx)=>renderQuestion(q,idx)).join('')}</div><button class="primary" onclick="submitExam()">提交试卷</button>`;}
function renderQuestion(q,idx){if(q.type==='choice')return `<div class="question"><h3>第${idx+1}题【${typeName(q.type)}】</h3><p>${q.q}</p><div class="options">${q.ops.map((op,i)=>{let letter='ABCD'[i];return `<label><input type="radio" name="q${idx}" value="${letter}" onchange="userAnswers[${idx}]=this.value"> ${letter}. ${op}</label>`}).join('')}</div></div>`;if(q.type==='judge')return `<div class="question"><h3>第${idx+1}题【判断题】</h3><p>${q.q}</p><div class="options"><label><input type="radio" name="q${idx}" value="对" onchange="userAnswers[${idx}]=this.value"> 对</label><label><input type="radio" name="q${idx}" value="错" onchange="userAnswers[${idx}]=this.value"> 错</label></div></div>`;return `<div class="question"><h3>第${idx+1}题【大题】</h3><p>${q.q}</p><div class="answer-area"><textarea oninput="userAnswers[${idx}]=this.value" placeholder="请在这里作答"></textarea></div></div>`}
function generateExam(types){
 const {subjectKey,paperName,scope}=currentPaper;
 const bank=qbank(subjectKey,scope);
 currentExam=[];
 types.forEach(t=>{
   const count=t==='choice'?5:(t==='judge'?3:2);
   bank[t].slice(0,count).forEach((q,i)=>currentExam.push({...q,type:t,id:t+i}));
 });
 userAnswers={};showExam(paperName)
}
function typeName(t){return t==='choice'?'选择题':t==='judge'?'判断题':'大题'}
function showExam(title){app.innerHTML=`<div class="exam-top"><div><button class="back" onclick="showSubjectPapers('${currentPaper.subjectKey}')">← 返回试题</button><h2>${title}</h2><p class="mini">本次生成 ${currentExam.length} 道题。客观题自动判分；大题按评分点关键词给分，空答为0分。</p></div><button class="primary" onclick="submitExam()">提交试卷</button></div><div>${currentExam.map((q,idx)=>renderQuestion(q,idx)).join('')}</div><button class="primary" onclick="submitExam()">提交试卷</button>`;}
function renderQuestion(q,idx){if(q.type==='choice')return `<div class="question"><h3>第${idx+1}题【${typeName(q.type)}】</h3><p>${q.q}</p><div class="options">${q.ops.map((op,i)=>{let letter='ABCD'[i];return `<label><input type="radio" name="q${idx}" value="${letter}" onchange="userAnswers[${idx}]=this.value"> ${letter}. ${op}</label>`}).join('')}</div></div>`;if(q.type==='judge')return `<div class="question"><h3>第${idx+1}题【判断题】</h3><p>${q.q}</p><div class="options"><label><input type="radio" name="q${idx}" value="对" onchange="userAnswers[${idx}]=this.value"> 对</label><label><input type="radio" name="q${idx}" value="错" onchange="userAnswers[${idx}]=this.value"> 错</label></div></div>`;return `<div class="question"><h3>第${idx+1}题【大题】</h3><p>${q.q}</p><div class="answer-area"><textarea oninput="userAnswers[${idx}]=this.value" placeholder="请在这里作答，系统将按评分点关键词给分，空答为0分。"></textarea></div></div>`}
function scoreEssay(q,answer){
 const text=(answer||'').replace(/\s/g,'');
 if(!text) return {score:0,rows:(q.rubric||[]).map(r=>({...r,hit:false,matched:[]}))};
 let total=0;
 const rows=(q.rubric||[]).map(r=>{
   const matched=(r.keywords||[]).filter(kw=>text.includes(kw));
   const hit=matched.length>0;
   if(hit) total+=r.score;
   return {...r,hit,matched};
 });
 return {score:total,rows};
}
function submitExam(){
 let total=0, earned=0;
 let resultHtml=currentExam.map((q,idx)=>{
   const ua=userAnswers[idx]||'';
   if(q.type==='choice' || q.type==='judge'){
     const point=q.type==='choice'?2:1;
     total+=point;
     const ok=ua===q.a;
     if(ok) earned+=point;
     const showUa=ua||'未作答';
     return `<div class="result-card ${ok?'correct':'wrong'}"><h3>第${idx+1}题【${typeName(q.type)}】</h3><p><b>${ok?'✔ 正确':'✘ 错误'}</b></p><p class="mini">你的作答：${showUa}。本页面默认不显示正确答案。</p><details><summary>查看答案与解析</summary><p><b>正确答案：</b>${q.a}</p><p><b>解析：</b>${q.ex}</p></details></div>`;
   }
   total+=q.score||10;
   const scored=scoreEssay(q,ua);
   earned+=scored.score;
   const rows=scored.rows.map(r=>`<div class="rubric-row ${r.hit?'ok':'no'}"><span>${r.hit?'✔':'✘'} ${r.point}<br><span class="mini">关键词：${(r.keywords||[]).join('、')}</span></span><b>${r.hit?r.score:0}/${r.score}分</b></div>`).join('');
   return `<div class="result-card neutral"><h3>第${idx+1}题【大题】</h3><p>${q.q}</p><p><b>你的答案：</b>${ua?ua:'未作答'}</p><p><b>本题得分：</b>${scored.score}/${q.score||10}分</p><h3>评分点</h3>${rows}<h3>标准答案</h3><p>${q.a}</p><h3>解析</h3><p>${q.ex}</p></div>`;
 }).join('');
 const score=total?Math.round(earned/total*100):0;
 app.innerHTML=`<button class="back" onclick="showSubjectPapers('${currentPaper.subjectKey}')">← 返回试题</button><div class="content"><div class="result">总分：${earned}/${total}分（${score}分制：${score}分）</div><p class="mini">答对的客观题背景为绿色，答错或未作答为红色；大题按评分点关键词给分，未作答为0分。</p><h2>判题结果</h2>${resultHtml}<button class="primary" onclick="showSubjectPapers('${currentPaper.subjectKey}')">返回试题中心</button></div>`;
}

function showSearch(){setActive(2);app.innerHTML=`<div class="section-title"><h2>搜索知识点</h2><span class="mini">不保存搜索记录</span></div><input class="search" id="kw" placeholder="输入：循环系统、鸦片战争、经纬网、宪法……" oninput="doSearch()"><div id="results" style="margin-top:18px"></div>`;}
function doSearch(){const kw=document.getElementById('kw').value.trim();const box=document.getElementById('results');if(!kw){box.innerHTML='';return}let res=[];Object.keys(subjects).forEach(k=>{const s=subjects[k];s.units.forEach(u=>{if(u.includes(kw)||s.name.includes(kw)||s.knowledge.join('').includes(kw))res.push({k,s,u})})});box.innerHTML=res.length?`<div class="paper-grid">${res.map(r=>`<div class="card" onclick="showSubjectPapers('${r.k}')"><h3>${r.s.icon} ${r.s.name}</h3><p>${r.u}</p><p class="mini">点击进入该科试题</p></div>`).join('')}</div>`:`<div class="content">暂未找到相关内容，可后续继续扩充知识库。</div>`;}
function showAbout(){setActive(3);app.innerHTML=`<div class="content"><h2>系统说明</h2><div class="note">本版本已按照你的要求去掉错题本、收藏、学习统计等需要浏览器存储的功能。</div><div class="note formula">保留功能：四科入口、教材册次、知识点示例、单元5份试题、每科2份综合试题、题型勾选、确认生成试卷、答题、提交、查看解析。</div><div class="note wrong">注意：当前题库为示例题库，后续可以继续补充真实会考知识点和题目。</div></div>`;}
showHome();
</script>
