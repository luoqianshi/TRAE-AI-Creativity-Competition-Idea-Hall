<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>办公学习一站式工具箱</title>
    <style>
        :root {
            --primary-color: #1E90FF;
            --primary-hover: #0066CC;
            --bg-color: #FFFFFF;
            --card-bg: #F8FAFC;
            --text-color: #1E293B;
            --text-secondary: #64748B;
            --border-color: #E2E8F0;
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-hover: 0 4px 16px rgba(0,0,0,0.1);
            --search-bg: #FFFFFF;
            --copy-btn-bg: #E0F2FE;
            --copy-btn-text: #0369A1;
            --copy-btn-hover: #BAE6FD;
            --success-bg: #DCFCE7;
            --success-text: #16A34A;
        }
        [data-theme="dark"] {
            --primary-color: #3B82F6;
            --primary-hover: #2563EB;
            --bg-color: #0F172A;
            --card-bg: #1E293B;
            --text-color: #F1F5F9;
            --text-secondary: #94A3B8;
            --border-color: #334155;
            --shadow: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-hover: 0 4px 16px rgba(0,0,0,0.4);
            --search-bg: #1E293B;
            --copy-btn-bg: #1E40AF;
            --copy-btn-text: #93C5FD;
            --copy-btn-hover: #2563EB;
            --success-bg: #064E3B;
            --success-text: #34D399;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-content { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
        .logo { font-size: 20px; font-weight: 700; color: var(--primary-color); display: flex; align-items: center; gap: 8px; }
        .theme-toggle {
            background: none; border: 1px solid var(--border-color); border-radius: 50%;
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 18px; transition: all 0.3s; color: var(--text-color);
        }
        .theme-toggle:hover { background-color: var(--border-color); transform: rotate(180deg); }
        .tabs { display: flex; gap: 4px; overflow-x: auto; padding: 12px 0; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            padding: 10px 20px; border: none; background: none; color: var(--text-secondary);
            font-size: 14px; font-weight: 500; cursor: pointer; border-radius: 8px;
            transition: all 0.3s; white-space: nowrap; display: flex; align-items: center; gap: 6px;
        }
        .tab:hover { background-color: rgba(30,144,255,0.1); color: var(--primary-color); }
        .tab.active { background-color: var(--primary-color); color: white; }
        main { padding: 24px 0; min-height: calc(100vh - 200px); }
        .module { display: none; animation: fadeIn 0.3s ease; }
        .module.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .module-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .module-title { font-size: 20px; font-weight: 600; }
        .search-box {
            flex: 1; max-width: 400px; padding: 10px 16px;
            border: 1px solid var(--border-color); border-radius: 8px;
            background-color: var(--search-bg); color: var(--text-color);
            font-size: 14px; transition: all 0.3s;
        }
        .search-box:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(30,144,255,0.1); }
        .search-box::placeholder { color: var(--text-secondary); }
        .category-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .category-tab {
            padding: 6px 14px; border: 1px solid var(--border-color); background: none;
            color: var(--text-secondary); font-size: 13px; cursor: pointer;
            border-radius: 20px; transition: all 0.3s;
        }
        .category-tab:hover { border-color: var(--primary-color); color: var(--primary-color); }
        .category-tab.active { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }
        .content-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 16px; }
        .content-card {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 16px; transition: all 0.3s; cursor: pointer;
        }
        .content-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); border-color: var(--primary-color); }
        .card-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
        .card-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; }
        .card-code {
            background-color: rgba(30,144,255,0.08); padding: 8px 12px;
            border-radius: 6px; font-family: 'Consolas', monospace; font-size: 14px;
            color: var(--primary-color); display: flex; justify-content: space-between; align-items: center;
        }
        .copy-btn {
            background-color: var(--copy-btn-bg); color: var(--copy-btn-text);
            border: none; padding: 4px 10px; border-radius: 4px; font-size: 12px;
            cursor: pointer; transition: all 0.2s;
        }
        .copy-btn:hover { background-color: var(--copy-btn-hover); }
        .copy-btn.copied { background-color: var(--success-bg); color: var(--success-text); }
        .symbol-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px,1fr)); gap: 8px; }
        .symbol-item {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 16px; text-align: center; cursor: pointer;
            transition: all 0.2s; font-size: 20px;
        }
        .symbol-item:hover { box-shadow: var(--shadow-hover); border-color: var(--primary-color); transform: scale(1.05); }
        .symbol-item span { display: block; font-size: 11px; color: var(--text-secondary); margin-top: 6px; font-family: sans-serif; }
        .markdown-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; transition: all 0.3s; }
        .markdown-card:hover { box-shadow: var(--shadow-hover); }
        .md-example {
            background-color: rgba(0,0,0,0.05); padding: 12px; border-radius: 6px;
            font-family: 'Consolas', monospace; font-size: 13px; color: var(--text-color);
            margin: 8px 0; overflow-x: auto;
        }
        .tool-section { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
        .tool-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
        .tool-input {
            width: 100%; padding: 12px; border: 1px solid var(--border-color);
            border-radius: 8px; background-color: var(--bg-color); color: var(--text-color);
            font-size: 14px; margin-bottom: 12px; resize: vertical; min-height: 100px;
        }
        .tool-input:focus { outline: none; border-color: var(--primary-color); }
        .tool-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .tool-btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .tool-btn-primary { background-color: var(--primary-color); color: white; }
        .tool-btn-primary:hover { background-color: var(--primary-hover); }
        .tool-btn-secondary { background-color: rgba(30,144,255,0.1); color: var(--primary-color); }
        .tool-btn-secondary:hover { background-color: rgba(30,144,255,0.2); }
        .tool-result { margin-top: 12px; padding: 12px; background-color: rgba(30,144,255,0.05); border-radius: 8px; font-size: 14px; }
        .calc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 16px; }
        .calc-item { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; }
        .calc-full { grid-column: span 2; }
        .calc-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
        .calc-input {
            width: 100%; padding: 10px; border: 1px solid var(--border-color);
            border-radius: 6px; background-color: var(--bg-color); color: var(--text-color);
            font-size: 14px; margin-bottom: 10px;
        }
        .calc-input:focus { outline: none; border-color: var(--primary-color); }
        .calc-result { font-size: 18px; font-weight: 600; color: var(--primary-color); }
        .date-calc { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
        .date-calc input { flex: 1; min-width: 150px; }
        .calculator { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; max-width: 360px; margin: 20px auto 0; }
        .calc-display { width: 100%; padding: 18px; border: 1px solid var(--border-color); border-radius: 8px; background-color: #2D3748; color: #F7FAFC; font-size: 28px; font-weight: 600; text-align: right; margin-bottom: 16px; outline: none; }
        .calc-buttons { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
        .calc-btn { padding: 18px; border: none; border-radius: 8px; font-size: 18px; font-weight: 500; cursor: pointer; transition: all 0.2s; background-color: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); }
        .calc-btn:hover { background-color: rgba(30,144,255,0.1); border-color: var(--primary-color); }
        .calc-btn.operator { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }
        .calc-btn.operator:hover { background-color: var(--primary-hover); }
        .calc-btn.equal { grid-column: span 2; background-color: #10B981; color: white; border-color: #10B981; }
        .calc-btn.equal:hover { background-color: #059669; }
        .calc-btn.zero { grid-column: span 2; }
        .copy-toast {
            position: fixed; bottom: 30px; right: 30px;
            background-color: var(--success-bg); color: var(--success-text);
            padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 500;
            opacity: 0; transform: translateY(20px); transition: all 0.3s; z-index: 1000;
            box-shadow: var(--shadow);
        }
        .copy-toast.show { opacity: 1; transform: translateY(0); }
        footer { background-color: var(--card-bg); border-top: 1px solid var(--border-color); padding: 20px 0; text-align: center; color: var(--text-secondary); font-size: 13px; margin-top: 40px; }
        .footer-info { display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; margin-bottom: 10px; }
        .footer-info span { display: flex; align-items: center; gap: 6px; }
        @media (max-width: 768px) {
            .header-content { flex-direction: column; align-items: flex-start; }
            .tabs { width: 100%; }
            .content-grid { grid-template-columns: 1fr; }
            .symbol-grid { grid-template-columns: repeat(6,1fr); }
            .module-header { flex-direction: column; align-items: stretch; }
            .search-box { max-width: 100%; }
        }
        @media (max-width: 480px) {
            .symbol-grid { grid-template-columns: repeat(4,1fr); }
            .tab { padding: 8px 12px; font-size: 12px; }
            .calc-full { grid-column: span 1; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo"><span>📦</span><span>办公学习工具箱</span></div>
                <button class="theme-toggle" onclick="toggleTheme(this)">🌙</button>
            </div>
            <div class="tabs">
                <button class="tab active" onclick="switchTab(this,'windows')"><span>🖥️</span>Windows快捷键</button>
                <button class="tab" onclick="switchTab(this,'office')"><span>📊</span>Office办公</button>
                <button class="tab" onclick="switchTab(this,'emoji')"><span>🎉</span>Emoji符号</button>
                <button class="tab" onclick="switchTab(this,'markdown')"><span>📝</span>Markdown</button>
                <button class="tab" onclick="switchTab(this,'text')"><span>✏️</span>文本处理</button>
                <button class="tab" onclick="switchTab(this,'calc')"><span>🧮</span>简易换算</button>
            </div>
        </div>
    </header>
    <main class="container">
        <div class="module active" id="windows">
            <div class="module-header"><h2 class="module-title">Windows系统快捷键</h2><input type="text" class="search-box" placeholder="搜索快捷键..." oninput="searchModule('windows',this.value)"></div>
            <div class="category-tabs" id="windows-categories">
                <button class="category-tab active" onclick="filterCategory('windows',this,'all')">全部</button>
                <button class="category-tab" onclick="filterCategory('windows',this,'system')">系统操作</button>
                <button class="category-tab" onclick="filterCategory('windows',this,'window')">窗口管理</button>
                <button class="category-tab" onclick="filterCategory('windows',this,'screenshot')">截图功能</button>
                <button class="category-tab" onclick="filterCategory('windows',this,'file')">文件管理</button>
                <button class="category-tab" onclick="filterCategory('windows',this,'browser')">浏览器</button>
            </div>
            <div class="content-grid" id="windows-content"></div>
        </div>
        <div class="module" id="office">
            <div class="module-header"><h2 class="module-title">Office办公大全</h2><input type="text" class="search-box" placeholder="搜索Office功能..." oninput="searchModule('office',this.value)"></div>
            <div class="category-tabs" id="office-categories">
                <button class="category-tab active" onclick="filterCategory('office',this,'all')">全部</button>
                <button class="category-tab" onclick="filterCategory('office',this,'excel')">Excel函数</button>
                <button class="category-tab" onclick="filterCategory('office',this,'word')">Word快捷键</button>
                <button class="category-tab" onclick="filterCategory('office',this,'ppt')">PPT快捷键</button>
            </div>
            <div class="content-grid" id="office-content"></div>
        </div>
        <div class="module" id="emoji">
            <div class="module-header"><h2 class="module-title">Emoji+特殊符号大全</h2><input type="text" class="search-box" placeholder="搜索符号..." oninput="searchModule('emoji',this.value)"></div>
            <div class="category-tabs" id="emoji-categories">
                <button class="category-tab active" onclick="filterCategory('emoji',this,'all')">全部</button>
                <button class="category-tab" onclick="filterCategory('emoji',this,'emoji')">常用表情</button>
                <button class="category-tab" onclick="filterCategory('emoji',this,'arrow')">方向箭头</button>
                <button class="category-tab" onclick="filterCategory('emoji',this,'math')">数学符号</button>
                <button class="category-tab" onclick="filterCategory('emoji',this,'line')">分割线</button>
                <button class="category-tab" onclick="filterCategory('emoji',this,'special')">上下标</button>
            </div>
            <div class="symbol-grid" id="emoji-content"></div>
        </div>
        <div class="module" id="markdown">
            <div class="module-header"><h2 class="module-title">Markdown语法速查</h2><input type="text" class="search-box" placeholder="搜索Markdown语法..." oninput="searchModule('markdown',this.value)"></div>
            <div class="content-grid" id="markdown-content"></div>
        </div>
        <div class="module" id="text">
            <div class="module-header"><h2 class="module-title">文本处理工具</h2></div>
            <div class="tool-section">
                <h3 class="tool-title">📊 字数统计</h3>
                <textarea class="tool-input" id="word-count-input" placeholder="在此输入文本..." oninput="countWords()"></textarea>
                <div class="tool-result" id="word-count-result">汉字：0 | 字符：0 | 空格：0 | 行数：0</div>
            </div>
            <div class="tool-section">
                <h3 class="tool-title">🔤 大小写转换</h3>
                <textarea class="tool-input" id="case-input" placeholder="在此输入英文文本..."></textarea>
                <div class="tool-buttons">
                    <button class="tool-btn tool-btn-primary" onclick="convertCase('upper')">转大写</button>
                    <button class="tool-btn tool-btn-primary" onclick="convertCase('lower')">转小写</button>
                    <button class="tool-btn tool-btn-secondary" onclick="convertCase('first')">首字母大写</button>
                    <button class="tool-btn tool-btn-secondary" onclick="convertCase('reverse')">大小写反转</button>
                </div>
                <div class="tool-result" id="case-result"></div>
            </div>
            <div class="tool-section">
                <h3 class="tool-title">🔄 简繁互转</h3>
                <textarea class="tool-input" id="cn-input" placeholder="在此输入中文文本..."></textarea>
                <div class="tool-buttons">
                    <button class="tool-btn tool-btn-primary" onclick="convertCN('s2t')">简体转繁体</button>
                    <button class="tool-btn tool-btn-primary" onclick="convertCN('t2s')">繁体转简体</button>
                </div>
                <div class="tool-result" id="cn-result"></div>
            </div>
        </div>
        <div class="module" id="calc">
            <div class="module-header"><h2 class="module-title">简易换算工具</h2></div>
            <div class="calc-grid">
                <div class="calc-item">
                    <h3 class="tool-title">💾 字节换算</h3>
                    <div class="calc-label">输入字节数</div>
                    <input type="number" class="calc-input" id="byte-input" placeholder="例如：1024" oninput="convertBytes()">
                    <div class="calc-result" id="byte-result"></div>
                </div>
                <div class="calc-item">
                    <h3 class="tool-title">📅 日期间隔</h3>
                    <div class="date-calc">
                        <div style="flex:1"><div class="calc-label">开始日期</div><input type="date" class="calc-input" id="date-start"></div>
                        <div style="flex:1"><div class="calc-label">结束日期</div><input type="date" class="calc-input" id="date-end"></div>
                    </div>
                    <button class="tool-btn tool-btn-primary" style="width:100%" onclick="calcDateDiff()">计算间隔</button>
                    <div class="calc-result" id="date-result"></div>
                </div>
                <div class="calc-item calc-full">
                    <h3 class="tool-title" style="text-align:center">🔢 简易计算器</h3>
                    <input type="text" class="calc-display" id="calc-display" readonly placeholder="0">
                    <div class="calc-buttons">
                        <button class="calc-btn" onclick="calcInput('7')">7</button>
                        <button class="calc-btn" onclick="calcInput('8')">8</button>
                        <button class="calc-btn" onclick="calcInput('9')">9</button>
                        <button class="calc-btn operator" onclick="calcInput('/')">÷</button>
                        <button class="calc-btn" onclick="calcInput('4')">4</button>
                        <button class="calc-btn" onclick="calcInput('5')">5</button>
                        <button class="calc-btn" onclick="calcInput('6')">6</button>
                        <button class="calc-btn operator" onclick="calcInput('*')">×</button>
                        <button class="calc-btn" onclick="calcInput('1')">1</button>
                        <button class="calc-btn" onclick="calcInput('2')">2</button>
                        <button class="calc-btn" onclick="calcInput('3')">3</button>
                        <button class="calc-btn operator" onclick="calcInput('-')">-</button>
                        <button class="calc-btn zero" onclick="calcInput('0')">0</button>
                        <button class="calc-btn" onclick="calcInput('.')">.</button>
                        <button class="calc-btn operator" onclick="calcInput('+')">+</button>
                        <button class="calc-btn" onclick="calcClear()">C</button>
                        <button class="calc-btn" onclick="calcBackspace()">⌫</button>
                        <button class="calc-btn equal" onclick="calcEval()">=</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="container">
            <div class="footer-info"><span>📱 纯离线运行</span><span>🔒 无需注册登录</span><span>🚀 零广告打扰</span></div>
            <p>办公学习一站式工具箱 - 让效率更简单</p>
        </div>
    </footer>
    <div class="copy-toast" id="copy-toast">✓ 已复制到剪贴板</div>
    <script>
const windowsData=[

{category:'system',title:'Win + I',desc:'打开设置',code:'Win + I'},

{category:'window',title:'Win + Shift + ↑',desc:'垂直最大化',code:'Win + Shift + ↑'},

const filters={windows:{category:'all',search:''},office:{category:'all',search:''},emoji:{category:'all',search:''},markdown:{category:'all',search:''}};
function initApp(){renderWindows();renderOffice();renderEmoji();renderMarkdown();loadTheme();}
function renderWindows(){const container=document.getElementById('windows-content');container.innerHTML=windowsData.map(item=>`<div class="content-card" data-category="${item.category}" data-copy="${item.code}" onclick="copyFromData(this)"><div class="card-title">${item.title}</div><div class="card-desc">${item.desc}</div><div class="card-code">${item.code}<button class="copy-btn" data-copy="${item.code}" onclick="event.stopPropagation();copyFromData(this)">复制</button></div></div>`).join('');}
function renderOffice(){const container=document.getElementById('office-content');container.innerHTML=officeData.map(item=>`<div class="content-card" data-category="${item.category}" data-copy="${item.code}" onclick="copyFromData(this)"><div class="card-title">${item.title}</div><div class="card-desc">${item.desc}</div><div class="card-code">${item.code}<button class="copy-btn" data-copy="${item.code}" onclick="event.stopPropagation();copyFromData(this)">复制</button></div>${item.example?`<div style="margin-top:8px;font-size:12px;color:var(--text-secondary)">示例：${item.example}</div>`:''}</div>`).join('');}
function renderEmoji(){const container=document.getElementById('emoji-content');container.innerHTML=emojiData.map(item=>`<div class="symbol-item" data-category="${item.category}" data-copy="${item.symbol}" onclick="copyFromData(this)">${item.symbol}<span>${item.name}</span></div>`).join('');}
function renderMarkdown(){const container=document.getElementById('markdown-content');container.innerHTML=markdownData.map(item=>`<div class="markdown-card" data-category="all"><div class="card-title">${item.title}</div><div class="md-example">${item.example.replace(/\n/g,'<br>')}</div><div class="md-result">效果：${item.result}</div><button class="copy-btn" style="margin-top:8px" data-copy="${item.example}" onclick="copyFromData(this)">复制模板</button></div>`).join('');}
function switchTab(tab,moduleId){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.module').forEach(m=>m.classList.remove('active'));tab.classList.add('active');document.getElementById(moduleId).classList.add('active');}
function applyFilter(module){const f=filters[module];const items=document.querySelectorAll(`#${module}-content > div`);items.forEach(item=>{const matchCat=f.category==='all'||item.dataset.category===f.category;const matchSearch=f.search===''||item.textContent.toLowerCase().includes(f.search);item.style.display=matchCat&&matchSearch?'':'none';});}
function filterCategory(module,btn,category){document.querySelectorAll(`#${module}-categories .category-tab`).forEach(t=>t.classList.remove('active'));btn.classList.add('active');filters[module].category=category;applyFilter(module);}
function searchModule(module,keyword){filters[module].search=keyword.toLowerCase();applyFilter(module);}
function copyFromData(el){const text=el.dataset.copy;navigator.clipboard.writeText(text).then(()=>{showToast();if(el.classList.contains('copy-btn')){el.classList.add('copied');el.textContent='已复制';setTimeout(()=>{el.classList.remove('copied');el.textContent='复制';},2000);}else{el.style.backgroundColor='var(--success-bg)';setTimeout(()=>{el.style.backgroundColor='';},1000);}}).catch(()=>{const textarea=document.createElement('textarea');textarea.value=text;document.body.appendChild(textarea);textarea.select();document.execCommand('copy');document.body.removeChild(textarea);showToast();});}
function showToast(){const toast=document.getElementById('copy-toast');toast.classList.add('show');setTimeout(()=>{toast.classList.remove('show');},2000);}
function toggleTheme(btn){const html=document.documentElement;const isDark=html.getAttribute('data-theme')==='dark';html.setAttribute('data-theme',isDark?'light':'dark');btn.textContent=isDark?'🌙':'☀️';localStorage.setItem('theme',isDark?'light':'dark');}
function loadTheme(){const saved=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',saved);document.querySelector('.theme-toggle').textContent=saved==='dark'?'☀️':'🌙';}
function countWords(){const text=document.getElementById('word-count-input').value;const chinese=text.match(/[\u4e00-\u9fa5]/g);const chars=text.length;const spaces=(text.match(/\s/g)||[]).length;const lines=(text.match(/\n/g)||[]).length+1;document.getElementById('word-count-result').textContent=`汉字：${chinese?chinese.length:0} | 字符：${chars} | 空格：${spaces} | 行数：${lines}`;}
function convertCase(type){const input=document.getElementById('case-input');let result='';switch(type){case'upper':result=input.value.toUpperCase();break;case'lower':result=input.value.toLowerCase();break;case'first':result=input.value.toLowerCase().replace(/(?:^|\s)\w/g,m=>m.toUpperCase());break;case'reverse':result=input.value.split('').map(c=>c===c.toUpperCase()?c.toLowerCase():c.toUpperCase()).join('');}document.getElementById('case-result').textContent=`结果：${result}`;}
function convertCN(type){const input=document.getElementById('cn-input').value;let result='';if(type==='s2t'){result=input.split('').map(c=>cnMap[c]||c).join('');}else{const tMap={};Object.keys(cnMap).forEach(k=>tMap[cnMap[k]]=k);result=input.split('').map(c=>tMap[c]||c).join('');}document.getElementById('cn-result').textContent=`结果：${result}`;}
function convertBytes(){const bytes=parseFloat(document.getElementById('byte-input').value);if(!bytes){document.getElementById('byte-result').textContent='';return;}const units=['B','KB','MB','GB','TB'];let value=bytes;let unitIndex=0;while(value>=1024&&unitIndex<units.length-1){value/=1024;unitIndex++;}document.getElementById('byte-result').textContent=`${value.toFixed(2)} ${units[unitIndex]}`;}
function calcDateDiff(){const start=document.getElementById('date-start').value;const end=document.getElementById('date-end').value;if(!start||!end){document.getElementById('date-result').textContent='请选择日期';return;}const diff=Math.abs(new Date(end)-new Date(start));const days=Math.floor(diff/(1000*60*60*24));const years=Math.floor(days/365);const months=Math.floor((days%365)/30);const remainingDays=days%30;let result=`${days} 天`;if(years>0)result=`${years}年${months}个月${remainingDays}天`;else if(months>0)result=`${months}个月${remainingDays}天`;document.getElementById('date-result').textContent=result;}
function calcInput(val){const display=document.getElementById('calc-display');if(val==='×')val='*';if(val==='÷')val='/';display.value+=val;}
function calcClear(){document.getElementById('calc-display').value='';}
function calcBackspace(){const display=document.getElementById('calc-display');display.value=display.value.slice(0,-1);}
function calcEval(){const display=document.getElementById('calc-display');try{display.value=eval(display.value);}catch{display.value='错误';}}
document.addEventListener('DOMContentLoaded',initApp);
</script>
