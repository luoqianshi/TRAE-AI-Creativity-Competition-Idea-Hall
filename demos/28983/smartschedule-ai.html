<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartSchedule AI - 智能日程规划助手</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-deep:#080d1a;--bg-main:#0c1225;--bg-card:#131b33;--bg-card-hover:#182040;
  --border:rgba(56,189,248,.12);--border-active:rgba(56,189,248,.35);
  --accent:#38bdf8;--accent2:#2dd4bf;--accent3:#818cf8;
  --text:#e2e8f0;--text-dim:#94a3b8;--text-bright:#f8fafc;
  --danger:#f87171;--warning:#fbbf24;--success:#34d399;
  --radius:14px;--radius-sm:8px;--shadow:0 4px 24px rgba(0,0,0,.35);
  --font-display:'Outfit',sans-serif;--font-body:'DM Sans',sans-serif;
}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--bg-deep);color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.6}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--text-bright);line-height:1.2}

/* ── Background Atmosphere ── */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 50% at 20% 10%,rgba(56,189,248,.06),transparent),
    radial-gradient(ellipse 60% 40% at 80% 80%,rgba(45,212,191,.05),transparent),
    radial-gradient(ellipse 50% 50% at 50% 50%,rgba(129,140,248,.03),transparent);
}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(56,189,248,.2);border-radius:3px}

/* ── Layout ── */
.app{position:relative;z-index:1;max-width:1360px;margin:0 auto;padding:0 24px 60px}

/* ── Header ── */
.header{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--border);margin-bottom:32px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:1.35rem;color:var(--text-bright)}
.logo-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:18px;color:#080d1a;font-weight:800}
.nav{display:flex;gap:6px}
.nav-btn{padding:8px 16px;border-radius:var(--radius-sm);border:1px solid transparent;background:transparent;color:var(--text-dim);font-family:var(--font-body);font-size:.875rem;cursor:pointer;transition:all .2s}
.nav-btn:hover{color:var(--text);background:rgba(56,189,248,.06)}
.nav-btn.active{color:var(--accent);background:rgba(56,189,248,.1);border-color:var(--border-active)}

/* ── Input Section ── */
.input-section{margin-bottom:36px}
.input-section h1{font-size:clamp(1.6rem,3.5vw,2.2rem);margin-bottom:6px;font-weight:800}
.input-section .subtitle{color:var(--text-dim);font-size:.95rem;margin-bottom:20px}
.input-box{display:flex;gap:10px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:6px;transition:border-color .25s,box-shadow .25s}
.input-box:focus-within{border-color:var(--border-active);box-shadow:0 0 0 3px rgba(56,189,248,.08)}
.input-box input{flex:1;background:transparent;border:none;outline:none;color:var(--text-bright);font-size:1rem;padding:14px 16px;font-family:var(--font-body)}
.input-box input::placeholder{color:var(--text-dim)}
.input-box button{padding:14px 28px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#080d1a;font-family:var(--font-display);font-weight:600;font-size:.95rem;cursor:pointer;transition:transform .15s,opacity .2s;white-space:nowrap}
.input-box button:hover{opacity:.9;transform:translateY(-1px)}
.input-box button:active{transform:scale(.97)}
.input-hints{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.hint-chip{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:rgba(56,189,248,.04);color:var(--text-dim);font-size:.8rem;cursor:pointer;transition:all .2s}
.hint-chip:hover{border-color:var(--border-active);color:var(--accent);background:rgba(56,189,248,.08)}

/* ── Main Grid ── */
.main-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:32px}
@media(max-width:900px){.main-grid{grid-template-columns:1fr}}

/* ── Card Base ── */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;transition:border-color .2s}
.card:hover{border-color:rgba(56,189,248,.2)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.card-header h2{font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:8px}
.card-header .badge{padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600;font-family:var(--font-display)}
.badge-accent{background:rgba(56,189,248,.12);color:var(--accent)}
.badge-success{background:rgba(52,211,153,.12);color:var(--success)}

/* ── Schedule Board ── */
.schedule-list{display:flex;flex-direction:column;gap:10px;max-height:520px;overflow-y:auto;padding-right:4px}
.task-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:rgba(255,255,255,.015);cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.task-item:hover{background:var(--bg-card-hover);border-color:var(--border-active);transform:translateX(4px)}
.task-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:0 3px 3px 0}
.task-item.priority-high::before{background:var(--danger)}
.task-item.priority-medium::before{background:var(--warning)}
.task-item.priority-low::before{background:var(--success)}
.task-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--text-dim);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .2s}
.task-check:hover{border-color:var(--accent)}
.task-check.done{background:var(--accent);border-color:var(--accent)}
.task-check.done::after{content:'✓';color:#080d1a;font-size:13px;font-weight:700}
.task-info{flex:1;min-width:0}
.task-name{font-weight:500;color:var(--text-bright);font-size:.925rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-name.completed{text-decoration:line-through;color:var(--text-dim)}
.task-meta{display:flex;gap:8px;margin-top:3px;font-size:.78rem;color:var(--text-dim)}
.task-meta span{display:flex;align-items:center;gap:3px}
.priority-tag{padding:2px 8px;border-radius:4px;font-size:.72rem;font-weight:600}
.tag-high{background:rgba(248,113,113,.12);color:var(--danger)}
.tag-medium{background:rgba(251,191,36,.12);color:var(--warning)}
.tag-low{background:rgba(52,211,153,.12);color:var(--success)}
.task-time{font-size:.82rem;color:var(--accent);font-weight:500;white-space:nowrap}

/* ── Calendar ── */
.calendar-tabs{display:flex;gap:4px;margin-bottom:16px;background:rgba(255,255,255,.03);border-radius:var(--radius-sm);padding:3px}
.cal-tab{flex:1;padding:7px;text-align:center;border-radius:6px;border:none;background:transparent;color:var(--text-dim);font-size:.82rem;font-family:var(--font-body);cursor:pointer;transition:all .2s}
.cal-tab:hover{color:var(--text)}
.cal-tab.active{background:rgba(56,189,248,.12);color:var(--accent);font-weight:600}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:1rem}
.cal-nav-btn:hover{border-color:var(--border-active);color:var(--accent)}
.cal-nav-title{font-family:var(--font-display);font-weight:600;font-size:.95rem;color:var(--text-bright)}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week-day{text-align:center;padding:10px 4px;border-radius:var(--radius-sm);border:1px solid transparent;transition:all .2s;cursor:pointer;min-height:90px}
.week-day:hover{background:rgba(56,189,248,.04);border-color:var(--border)}
.week-day.today{background:rgba(56,189,248,.08);border-color:var(--border-active)}
.week-day-name{font-size:.72rem;color:var(--text-dim);font-weight:500;margin-bottom:4px}
.week-day-num{font-family:var(--font-display);font-size:1.05rem;font-weight:600;color:var(--text-bright);margin-bottom:6px}
.week-day.today .week-day-num{color:var(--accent)}
.cal-task-dot{padding:3px 6px;border-radius:4px;font-size:.68rem;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:opacity .2s}
.cal-task-dot:hover{opacity:.8}
.dot-high{background:rgba(248,113,113,.15);color:var(--danger)}
.dot-medium{background:rgba(251,191,36,.15);color:var(--warning)}
.dot-low{background:rgba(52,211,153,.15);color:var(--success)}

/* ── Month View ── */
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.month-header-cell{text-align:center;padding:8px 4px;font-size:.75rem;color:var(--text-dim);font-weight:600}
.month-cell{min-height:64px;padding:6px;border-radius:var(--radius-sm);border:1px solid transparent;transition:all .15s;cursor:pointer}
.month-cell:hover{background:rgba(56,189,248,.04);border-color:var(--border)}
.month-cell.today{background:rgba(56,189,248,.08);border-color:var(--border-active)}
.month-cell.other-month{opacity:.35}
.month-cell .day-num{font-size:.8rem;font-weight:500;color:var(--text-dim);margin-bottom:4px}
.month-cell.today .day-num{color:var(--accent);font-weight:700}

/* ── Day View ── */
.day-view{display:flex;flex-direction:column;gap:2px}
.day-hour{display:flex;align-items:flex-start;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.03);min-height:48px}
.day-hour-label{width:50px;font-size:.78rem;color:var(--text-dim);font-weight:500;flex-shrink:0;text-align:right}
.day-hour-content{flex:1;position:relative}
.day-event{padding:6px 10px;border-radius:6px;font-size:.78rem;font-weight:500;cursor:pointer;transition:opacity .2s;margin-bottom:4px}
.day-event:hover{opacity:.85}
.day-event.ev-high{background:rgba(248,113,113,.15);color:var(--danger);border-left:3px solid var(--danger)}
.day-event.ev-medium{background:rgba(251,191,36,.15);color:var(--warning);border-left:3px solid var(--warning)}
.day-event.ev-low{background:rgba(52,211,153,.15);color:var(--success);border-left:3px solid var(--success)}

/* ── Stats Panel ── */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media(max-width:900px){.stats-grid{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.stats-grid{grid-template-columns:1fr}}
.stat-card{text-align:center}
.stat-ring{position:relative;width:110px;height:110px;margin:0 auto 14px}
.stat-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.stat-ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.stat-ring .ring-bg{stroke:rgba(255,255,255,.06)}
.stat-ring .ring-fill{transition:stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1)}
.stat-ring .ring-value{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1.5rem;font-weight:700;color:var(--text-bright)}
.stat-ring .ring-value small{font-size:.7rem;color:var(--text-dim);font-weight:400;margin-top:2px}
.stat-label{font-size:.88rem;font-weight:500;color:var(--text)}
.stat-sublabel{font-size:.78rem;color:var(--text-dim);margin-top:2px}

/* ── Progress Bars ── */
.progress-section{margin-top:20px}
.progress-item{margin-bottom:14px}
.progress-label{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:6px}
.progress-label span:first-child{color:var(--text)}
.progress-label span:last-child{color:var(--accent);font-weight:600}
.progress-bar{height:8px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width 1s cubic-bezier(.4,0,.2,1)}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .25s}
.modal-overlay.show{display:flex;opacity:1}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:18px;width:100%;max-width:480px;padding:28px;box-shadow:var(--shadow);transform:translateY(20px);transition:transform .3s}
.modal-overlay.show .modal{transform:translateY(0)}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;transition:all .2s}
.modal-close:hover{border-color:var(--border-active);color:var(--text-bright)}
.modal{position:relative}
.modal h3{font-size:1.15rem;margin-bottom:16px;padding-right:40px}
.modal-field{margin-bottom:14px}
.modal-field label{display:block;font-size:.8rem;color:var(--text-dim);margin-bottom:5px;font-weight:500}
.modal-field input,.modal-field select,.modal-field textarea{width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text-bright);font-family:var(--font-body);font-size:.9rem;outline:none;transition:border-color .2s}
.modal-field input:focus,.modal-field select:focus,.modal-field textarea:focus{border-color:var(--border-active)}
.modal-field textarea{resize:vertical;min-height:60px}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions button{flex:1;padding:11px;border-radius:var(--radius-sm);border:none;font-family:var(--font-display);font-weight:600;font-size:.9rem;cursor:pointer;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#080d1a}
.btn-primary:hover{opacity:.9}
.btn-secondary{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--border) !important}
.btn-secondary:hover{background:rgba(255,255,255,.1)}

/* ── Toast ── */
.toast-container{position:fixed;top:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{padding:14px 20px;border-radius:var(--radius-sm);background:var(--bg-card);border:1px solid var(--border-active);color:var(--text-bright);font-size:.88rem;box-shadow:var(--shadow);animation:toastIn .3s ease-out;display:flex;align-items:center;gap:10px;max-width:360px}
.toast .toast-icon{font-size:1.1rem}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(40px)}}

/* ── Animations ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .5s ease-out both}
.fade-up:nth-child(1){animation-delay:.05s}
.fade-up:nth-child(2){animation-delay:.1s}
.fade-up:nth-child(3){animation-delay:.15s}
.fade-up:nth-child(4){animation-delay:.2s}
.fade-up:nth-child(5){animation-delay:.25s}
.fade-up:nth-child(6){animation-delay:.3s}
.fade-up:nth-child(7){animation-delay:.35s}
.fade-up:nth-child(8){animation-delay:.4s}

/* ── AI Typing Indicator ── */
.ai-indicator{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;background:rgba(45,212,191,.1);color:var(--accent2);font-size:.78rem;font-weight:500}
.ai-dot{width:6px;height:6px;border-radius:50%;background:var(--accent2);animation:aiPulse 1.4s infinite}
.ai-dot:nth-child(2){animation-delay:.2s}
.ai-dot:nth-child(3){animation-delay:.4s}
@keyframes aiPulse{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

/* ── Responsive ── */
@media(max-width:640px){
  .app{padding:0 14px 40px}
  .header{flex-direction:column;gap:12px;align-items:flex-start}
  .input-box{flex-direction:column}
  .input-box button{width:100%}
  .card{padding:18px}
  .week-grid{gap:3px}
  .week-day{min-height:60px;padding:6px 2px}
  .stats-grid{gap:14px}
}
</style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <header class="header fade-up">
    <div class="logo">
      <div class="logo-icon">S</div>
      SmartSchedule AI
    </div>
    <nav class="nav">
      <button class="nav-btn active" data-view="dashboard">工作台</button>
      <button class="nav-btn" data-view="calendar">日历</button>
      <button class="nav-btn" data-view="stats">统计</button>
    </nav>
  </header>

  <!-- Input Section -->
  <section class="input-section fade-up">
    <h1>用一句话，安排你的一天</h1>
    <p class="subtitle">告诉 AI 你的计划，自动识别、拆解、排期，让每一天都井井有条</p>
    <div class="input-box">
      <input type="text" id="taskInput" placeholder="试试输入：&quot;下周三前交完季度报告，优先处理&quot;" autocomplete="off">
      <button id="submitBtn" onclick="handleAddTask()">AI 排期</button>
    </div>
    <div class="input-hints">
      <span class="hint-chip" onclick="fillHint(this)">明天下午3点开会</span>
      <span class="hint-chip" onclick="fillHint(this)">本周五前完成设计稿</span>
      <span class="hint-chip" onclick="fillHint(this)">每天复习英语30分钟</span>
      <span class="hint-chip" onclick="fillHint(this)">下周一提交项目方案</span>
    </div>
  </section>

  <!-- Main Grid -->
  <div class="main-grid">
    <!-- Today's Schedule -->
    <div class="card fade-up">
      <div class="card-header">
        <h2>
          <span class="ai-indicator"><span class="ai-dot"></span><span class="ai-dot"></span><span class="ai-dot"></span></span>
          今日智能日程
        </h2>
        <span class="badge badge-accent" id="todayDate"></span>
      </div>
      <div class="schedule-list" id="scheduleList"></div>
    </div>

    <!-- Calendar -->
    <div class="card fade-up">
      <div class="card-header">
        <h2>📅 日程日历</h2>
        <span class="badge badge-success" id="taskCount"></span>
      </div>
      <div class="calendar-tabs">
        <button class="cal-tab active" data-cal="week">周</button>
        <button class="cal-tab" data-cal="day">日</button>
        <button class="cal-tab" data-cal="month">月</button>
      </div>
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="calNav(-1)">‹</button>
        <span class="cal-nav-title" id="calTitle"></span>
        <button class="cal-nav-btn" onclick="calNav(1)">›</button>
      </div>
      <div id="calendarContainer"></div>
    </div>
  </div>

  <!-- Stats Panel -->
  <div class="card fade-up">
    <div class="card-header">
      <h2>📊 效率统计</h2>
      <span class="badge badge-accent">本周报告</span>
    </div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-ring">
          <svg viewBox="0 0 120 120">
            <circle class="ring-bg" cx="60" cy="60" r="50"/>
            <circle class="ring-fill" cx="60" cy="60" r="50" stroke="var(--accent)" stroke-dasharray="314" stroke-dashoffset="314" data-target="94"/>
          </svg>
          <div class="ring-value">75%<small>完成率</small></div>
        </div>
        <div class="stat-label">今日任务完成度</div>
        <div class="stat-sublabel">6/8 项已完成</div>
      </div>
      <div class="stat-card">
        <div class="stat-ring">
          <svg viewBox="0 0 120 120">
            <circle class="ring-bg" cx="60" cy="60" r="50"/>
            <circle class="ring-fill" cx="60" cy="60" r="50" stroke="var(--accent2)" stroke-dasharray="314" stroke-dashoffset="314" data-target="78.5"/>
          </svg>
          <div class="ring-value">6.2h<small>专注时长</small></div>
        </div>
        <div class="stat-label">深度工作时间</div>
        <div class="stat-sublabel">目标 8h / 已用 6.2h</div>
      </div>
      <div class="stat-card">
        <div class="stat-ring">
          <svg viewBox="0 0 120 120">
            <circle class="ring-bg" cx="60" cy="60" r="50"/>
            <circle class="ring-fill" cx="60" cy="60" r="50" stroke="var(--accent3)" stroke-dasharray="314" stroke-dashoffset="314" data-target="62.8"/>
          </svg>
          <div class="ring-value">92<small>效率分</small></div>
        </div>
        <div class="stat-label">AI 效率评分</div>
        <div class="stat-sublabel">超过 87% 的用户</div>
      </div>
    </div>
    <div class="progress-section">
      <div class="progress-item">
        <div class="progress-label"><span>工作类任务</span><span>85%</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2))" data-width="85%"></div></div>
      </div>
      <div class="progress-item">
        <div class="progress-label"><span>学习类任务</span><span>60%</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:0%;background:linear-gradient(90deg,var(--accent3),#a78bfa)" data-width="60%"></div></div>
      </div>
      <div class="progress-item">
        <div class="progress-label"><span>生活类任务</span><span>100%</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:0%;background:linear-gradient(90deg,var(--success),#6ee7b7)" data-width="100%"></div></div>
      </div>
    </div>
  </div>
</div>

<!-- Task Detail Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3 id="modalTitle">任务详情</h3>
    <div class="modal-field">
      <label>任务名称</label>
      <input type="text" id="modalName">
    </div>
    <div class="modal-field">
      <label>截止时间</label>
      <input type="text" id="modalDeadline">
    </div>
    <div class="modal-field">
      <label>优先级</label>
      <select id="modalPriority">
        <option value="high">🔴 高优先级</option>
        <option value="medium">🟡 中优先级</option>
        <option value="low">🟢 低优先级</option>
      </select>
    </div>
    <div class="modal-field">
      <label>备注</label>
      <textarea id="modalNote" placeholder="添加备注信息..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn-primary" onclick="saveTask()">保存修改</button>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script>
// ── Data ──
const TODAY = new Date(2026, 5, 17); // 2026-06-17 Wednesday
const DAY_NAMES = ['日','一','二','三','四','五','六'];
const MONTH_NAMES = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

function dateOffset(d, n) { const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function fmtDate(d) { return `${d.getMonth()+1}月${d.getDate()}日`; }
function fmtDateFull(d) { return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`; }
function isSameDay(a,b) { return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }

let tasks = [
  { id:1, name:'完成季度项目报告', deadline:'周三截止（6/17）', deadlineDate:dateOffset(TODAY,0), priority:'high', time:'09:00-11:30', category:'工作', note:'需要包含Q2数据分析和Q3规划', done:false },
  { id:2, name:'回复客户合作邮件', deadline:'今天', deadlineDate:dateOffset(TODAY,0), priority:'low', time:'11:30-12:00', category:'工作', note:'确认合作方案细节', done:true },
  { id:3, name:'准备周五演讲PPT', deadline:'周四截止（6/18）', deadlineDate:dateOffset(TODAY,1), priority:'high', time:'14:00-16:00', category:'工作', note:'主题：AI在日程管理中的应用', done:false },
  { id:4, name:'健身房有氧训练', deadline:'今天', deadlineDate:dateOffset(TODAY,0), priority:'medium', time:'18:00-19:00', category:'生活', note:'跑步30分钟+拉伸', done:true },
  { id:5, name:'阅读《深度工作》第5章', deadline:'今天', deadlineDate:dateOffset(TODAY,0), priority:'low', time:'20:00-21:00', category:'学习', note:'', done:true },
  { id:6, name:'团队周会', deadline:'周五 14:00', deadlineDate:dateOffset(TODAY,2), priority:'medium', time:'14:00-15:00', category:'工作', note:'讨论Q3产品路线图', done:false },
  { id:7, name:'提交月度工作总结', deadline:'周五截止（6/19）', deadlineDate:dateOffset(TODAY,2), priority:'high', time:'全天', category:'工作', note:'汇总本月项目进展和关键指标', done:false },
  { id:8, name:'学习Python数据分析课程', deadline:'周六', deadlineDate:dateOffset(TODAY,3), priority:'medium', time:'10:00-12:00', category:'学习', note:'Coursera 第7-8模块', done:false },
];

let nextId = 9;
let calView = 'week';
let calOffset = 0;
let editingTaskId = null;

// ── Init ──
document.getElementById('todayDate').textContent = fmtDate(TODAY);
document.getElementById('taskCount').textContent = tasks.length + ' 项任务';
renderSchedule();
renderCalendar();
animateStats();

// ── Schedule Board ──
function renderSchedule() {
  const list = document.getElementById('scheduleList');
  const todayTasks = tasks.filter(t => isSameDay(t.deadlineDate, TODAY));
  todayTasks.sort((a,b) => {
    const p = {high:0,medium:1,low:2};
    if (a.done !== b.done) return a.done ? 1 : -1;
    return p[a.priority] - p[b.priority];
  });
  list.innerHTML = todayTasks.map((t,i) => `
    <div class="task-item priority-${t.priority} fade-up" onclick="openModal(${t.id})" style="animation-delay:${i*0.05}s">
      <div class="task-check ${t.done?'done':''}" onclick="event.stopPropagation();toggleDone(${t.id})"></div>
      <div class="task-info">
        <div class="task-name ${t.done?'completed':''}">${t.name}</div>
        <div class="task-meta">
          <span class="priority-tag tag-${t.priority}">${{high:'高',medium:'中',low:'低'}[t.priority]}</span>
          <span>⏰ ${t.time}</span>
          <span>📁 ${t.category}</span>
        </div>
      </div>
      <div class="task-time">${t.deadline}</div>
    </div>
  `).join('');
}

function toggleDone(id) {
  const t = tasks.find(x=>x.id===id);
  if (t) { t.done = !t.done; renderSchedule(); showToast(t.done?'✅ 已标记完成':'🔄 已恢复任务'); }
}

// ── Calendar ──
function renderCalendar() {
  const container = document.getElementById('calendarContainer');
  const title = document.getElementById('calTitle');
  if (calView === 'week') renderWeek(container, title);
  else if (calView === 'day') renderDay(container, title);
  else renderMonth(container, title);
}

function renderWeek(container, title) {
  const base = dateOffset(TODAY, calOffset * 7);
  const monday = dateOffset(base, -base.getDay() + 1);
  if (base.getDay() === 0) monday.setDate(monday.getDate() - 7);
  title.textContent = `${fmtDate(monday)} - ${fmtDate(dateOffset(monday,6))}`;
  let html = '<div class="week-grid">';
  for (let i = 0; i < 7; i++) {
    const d = dateOffset(monday, i);
    const isToday = isSameDay(d, TODAY);
    const dayTasks = tasks.filter(t => isSameDay(t.deadlineDate, d));
    html += `<div class="week-day ${isToday?'today':''}">
      <div class="week-day-name">${DAY_NAMES[d.getDay()]}</div>
      <div class="week-day-num">${d.getDate()}</div>
      ${dayTasks.slice(0,3).map(t => `<div class="cal-task-dot dot-${t.priority}" onclick="openModal(${t.id})">${t.name}</div>`).join('')}
      ${dayTasks.length > 3 ? `<div class="cal-task-dot" style="color:var(--text-dim)">+${dayTasks.length-3} 更多</div>` : ''}
    </div>`;
  }
  html += '</div>';
  container.innerHTML = html;
}

function renderDay(container, title) {
  const d = dateOffset(TODAY, calOffset);
  title.textContent = fmtDateFull(d);
  const dayTasks = tasks.filter(t => isSameDay(t.deadlineDate, d));
  let html = '<div class="day-view">';
  for (let h = 7; h <= 21; h++) {
    const hTasks = dayTasks.filter(t => {
      const start = parseInt(t.time);
      return !isNaN(start) && start === h;
    });
    html += `<div class="day-hour">
      <div class="day-hour-label">${h}:00</div>
      <div class="day-hour-content">
        ${hTasks.map(t => `<div class="day-event ev-${t.priority}" onclick="openModal(${t.id})">${t.name}</div>`).join('')}
      </div>
    </div>`;
  }
  html += '</div>';
  container.innerHTML = html;
}

function renderMonth(container, title) {
  const base = new Date(TODAY.getFullYear(), TODAY.getMonth() + calOffset, 1);
  title.textContent = `${base.getFullYear()}年${MONTH_NAMES[base.getMonth()]}`;
  const firstDay = new Date(base.getFullYear(), base.getMonth(), 1).getDay();
  const daysInMonth = new Date(base.getFullYear(), base.getMonth()+1, 0).getDate();
  const prevDays = new Date(base.getFullYear(), base.getMonth(), 0).getDate();
  let html = '<div class="month-grid">';
  DAY_NAMES.forEach(n => { html += `<div class="month-header-cell">${n}</div>`; });
  for (let i = 0; i < 42; i++) {
    let day, cls = 'month-cell';
    if (i < firstDay) { day = prevDays - firstDay + 1 + i; cls += ' other-month'; }
    else if (i - firstDay >= daysInMonth) { day = i - firstDay - daysInMonth + 1; cls += ' other-month'; }
    else {
      day = i - firstDay + 1;
      const cellDate = new Date(base.getFullYear(), base.getMonth(), day);
      if (isSameDay(cellDate, TODAY)) cls += ' today';
      const cellTasks = tasks.filter(t => isSameDay(t.deadlineDate, cellDate));
      if (cellTasks.length) {
        html += `<div class="${cls}"><div class="day-num">${day}</div>`;
        cellTasks.slice(0,2).forEach(t => {
          html += `<div class="cal-task-dot dot-${t.priority}" onclick="openModal(${t.id})">${t.name}</div>`;
        });
        if (cellTasks.length > 2) html += `<div class="cal-task-dot" style="color:var(--text-dim)">+${cellTasks.length-2}</div>`;
        html += '</div>';
        continue;
      }
    }
    html += `<div class="${cls}"><div class="day-num">${day}</div></div>`;
  }
  html += '</div>';
  container.innerHTML = html;
}

function calNav(dir) {
  if (calView === 'month') calOffset += dir;
  else if (calView === 'day') calOffset += dir;
  else calOffset += dir;
  renderCalendar();
}

// Calendar tab switching
document.querySelectorAll('.cal-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.cal-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    calView = tab.dataset.cal;
    calOffset = 0;
    renderCalendar();
  });
});

// Nav tab switching
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// ── Task Input ──
function handleAddTask() {
  const input = document.getElementById('taskInput');
  const text = input.value.trim();
  if (!text) { showToast('⚠️ 请输入任务描述'); return; }
  const priority = text.match(/紧急|重要|优先|赶紧/i) ? 'high' : text.match(/尽量|有空|可以/i) ? 'low' : 'medium';
  const dayMatch = text.match(/(今天|明天|后天|下周[一二三四五六日天]|周[一二三四五六日天]|周\d|这周|本周)/);
  const timeMatch = text.match(/(\d{1,2})[点时:：](\d{0,2})/);
  let deadlineDate = new Date(TODAY);
  let deadlineText = '今天';
  if (dayMatch) {
    const dw = dayMatch[1];
    if (dw === '明天') { deadlineDate = dateOffset(TODAY,1); deadlineText = '明天'; }
    else if (dw === '后天') { deadlineDate = dateOffset(TODAY,2); deadlineText = '后天'; }
    else if (/周[一二三四五六日天]/.test(dw) || /下周[一二三四五六日天]/.test(dw)) {
      const dayMap = {'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':0,'天':0};
      const target = dayMap[dw.replace('下周','').replace('这周','').replace('本周','')];
      const current = TODAY.getDay();
      let diff = target - current;
      if (diff <= 0) diff += 7;
      if (dw.startsWith('下周')) diff += 7;
      deadlineDate = dateOffset(TODAY, diff);
      deadlineText = fmtDate(deadlineDate);
    }
  }
  let timeText = '全天';
  if (timeMatch) {
    const h = parseInt(timeMatch[1]);
    const m = timeMatch[2] ? parseInt(timeMatch[2]) : 0;
    timeText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  }
  const name = text.replace(/(今天|明天|后天|下周|周[一二三四五六日天]|周\d|这周|本周|前|截止|完成|提交|准备|参加|去|到|在)\s*/g, '').replace(/\s*(紧急|重要|优先|尽量|有空|可以|点|时|:|：)\s*/g, ' ').trim() || text;
  const newTask = {
    id: nextId++,
    name: name,
    deadline: deadlineText,
    deadlineDate: deadlineDate,
    priority: priority,
    time: timeText,
    category: '工作',
    note: '',
    done: false
  };
  tasks.push(newTask);
  input.value = '';
  renderSchedule();
  renderCalendar();
  document.getElementById('taskCount').textContent = tasks.length + ' 项任务';
  showToast('🤖 AI 已为你排期：' + name);
}

document.getElementById('taskInput').addEventListener('keydown', e => { if (e.key === 'Enter') handleAddTask(); });

function fillHint(el) {
  document.getElementById('taskInput').value = el.textContent;
  document.getElementById('taskInput').focus();
}

// ── Modal ──
function openModal(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  editingTaskId = id;
  document.getElementById('modalTitle').textContent = '编辑任务';
  document.getElementById('modalName').value = t.name;
  document.getElementById('modalDeadline').value = t.deadline;
  document.getElementById('modalPriority').value = t.priority;
  document.getElementById('modalNote').value = t.note || '';
  const overlay = document.getElementById('modalOverlay');
  overlay.classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  editingTaskId = null;
}

function saveTask() {
  const t = tasks.find(x => x.id === editingTaskId);
  if (!t) return;
  t.name = document.getElementById('modalName').value;
  t.deadline = document.getElementById('modalDeadline').value;
  t.priority = document.getElementById('modalPriority').value;
  t.note = document.getElementById('modalNote').value;
  closeModal();
  renderSchedule();
  renderCalendar();
  showToast('✅ 任务已更新');
}

document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

// ── Toast ──
function showToast(msg) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `<span class="toast-icon">${msg.slice(0,2)}</span><span>${msg.slice(2)}</span>`;
  container.appendChild(toast);
  setTimeout(() => { toast.style.animation = 'toastOut .3s ease-in forwards'; setTimeout(() => toast.remove(), 300); }, 3000);
}

// ── Animate Stats ──
function animateStats() {
  setTimeout(() => {
    document.querySelectorAll('.ring-fill').forEach(ring => {
      ring.style.strokeDashoffset = ring.dataset.target;
    });
    document.querySelectorAll('.progress-fill').forEach(bar => {
      bar.style.width = bar.dataset.width;
    });
  }, 400);
}
</script>
</body>
</html>
