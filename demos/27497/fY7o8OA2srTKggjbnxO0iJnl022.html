<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恐龙快跑 - AI创造力大赛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 90%;
        }
        
        .game-title {
            text-align: center;
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .game-subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 1.1em;
        }
        
        #gameCanvas {
            border: 3px solid #333;
            border-radius: 10px;
            display: block;
            margin: 0 auto 20px;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 50%, #F0E68C 50%, #DEB887 100%);
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            font-family: inherit;
        }
        
        .btn-start {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-jump {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .btn-jump:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }
        
        .name-input-container {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .name-input-container label {
            font-size: 1.1em;
            color: #333;
            margin-right: 10px;
        }
        
        #playerName {
            padding: 10px 20px;
            font-size: 1em;
            border: 2px solid #667eea;
            border-radius: 25px;
            outline: none;
            width: 200px;
            text-align: center;
            font-family: inherit;
        }
        
        #playerName:focus {
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(118, 75, 162, 0.3);
        }
        
        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            font-size: 1.2em;
            color: #333;
        }
        
        .score-item {
            background: rgba(102, 126, 234, 0.1);
            padding: 10px 20px;
            border-radius: 15px;
        }
        
        .instructions {
            text-align: center;
            color: #666;
            font-size: 0.9em;
            margin-top: 10px;
        }
        
        .instructions kbd {
            background: #f4f4f4;
            border: 1px solid #ccc;
            border-radius: 3px;
            padding: 2px 8px;
            font-family: monospace;
        }
        
        .game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            display: none;
            z-index: 100;
        }
        
        .game-over-screen h2 {
            font-size: 2em;
            margin-bottom: 20px;
        }
        
        .game-over-screen p {
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        
        .canvas-wrapper {
            position: relative;
            display: inline-block;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">🦖 恐龙快跑</h1>
        <p class="game-subtitle">AI创造力大赛参赛作品 - 自定义你的恐龙角色！</p>
        
        <div class="name-input-container">
            <label for="playerName">🎮 角色名字：</label>
            <input type="text" id="playerName" placeholder="输入恐龙名字" maxlength="10" value="小恐龙">
        </div>
        
        <div class="score-board">
            <div class="score-item">👤 角色: <span id="displayName">小恐龙</span></div>
            <div class="score-item">🏆 得分: <span id="score">0</span></div>
            <div class="score-item">🚀 速度: <span id="speed">1</span>x</div>
        </div>
        
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="800" height="300"></canvas>
            <div class="game-over-screen" id="gameOverScreen">
                <h2>💥 游戏结束！</h2>
                <p><span id="finalName">小恐龙</span> 的最终得分: <span id="finalScore">0</span></p>
                <button class="btn btn-start" onclick="restartGame()">🔄 再玩一次</button>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-start" id="startBtn" onclick="startGame()">▶️ 开始游戏</button>
            <button class="btn btn-jump" id="jumpBtn" onclick="jump()" disabled>⬆️ 跳跃</button>
        </div>
        
        <div class="instructions">
            <p>💡 操作说明：点击"跳跃"按钮或按 <kbd>空格键</kbd> / <kbd>↑</kbd> 键让恐龙跳跃躲避障碍物</p>
            <p>🎯 随着分数增加，游戏速度会越来越快，挑战你的反应极限！</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const playerNameInput = document.getElementById('playerName');
        const displayName = document.getElementById('displayName');
        const scoreElement = document.getElementById('score');
        const speedElement = document.getElementById('speed');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalName = document.getElementById('finalName');
        const finalScore = document.getElementById('finalScore');
        const startBtn = document.getElementById('startBtn');
        const jumpBtn = document.getElementById('jumpBtn');
        
        // 游戏状态
        let gameRunning = false;
        let score = 0;
        let gameSpeed = 5;
        let animationId;
        
        // 恐龙对象
        const dino = {
            x: 50,
            y: 220,
            width: 50,
            height: 50,
            jumping: false,
            jumpVelocity: 0,
            gravity: 0.6,
            jumpPower: -12,
            groundY: 220,
            color: '#4CAF50'
        };
        
        // 障碍物数组
        let obstacles = [];
        let obstacleTimer = 0;
        let obstacleInterval = 120;
        
        // 云朵装饰
        let clouds = [];
        
        // 更新显示的名字
        playerNameInput.addEventListener('input', function() {
            displayName.textContent = this.value || '小恐龙';
        });
        
        // 绘制恐龙
        function drawDino() {
            ctx.save();
            
            // 恐龙身体
            ctx.fillStyle = dino.color;
            ctx.fillRect(dino.x, dino.y, dino.width, dino.height);
            
            // 恐龙头部
            ctx.fillStyle = '#45a049';
            ctx.fillRect(dino.x + 30, dino.y - 15, 25, 25);
            
            // 恐龙眼睛
            ctx.fillStyle = 'white';
            ctx.fillRect(dino.x + 40, dino.y - 10, 8, 8);
            ctx.fillStyle = 'black';
            ctx.fillRect(dino.x + 44, dino.y - 8, 4, 4);
            
            // 恐龙嘴巴
            ctx.fillStyle = '#ff6b6b';
            ctx.fillRect(dino.x + 48, dino.y - 2, 10, 6);
            
            // 恐龙腿（跑步动画）
            ctx.fillStyle = dino.color;
            const legOffset = Math.sin(Date.now() / 100) * 5;
            if (!dino.jumping) {
                ctx.fillRect(dino.x + 5, dino.y + dino.height, 12, 20 + legOffset);
                ctx.fillRect(dino.x + 30, dino.y + dino.height, 12, 20 - legOffset);
            } else {
                ctx.fillRect(dino.x + 5, dino.y + dino.height, 12, 15);
                ctx.fillRect(dino.x + 30, dino.y + dino.height, 12, 15);
            }
            
            // 恐龙背刺
            ctx.fillStyle = '#388E3C';
            for (let i = 0; i < 4; i++) {
                ctx.fillRect(dino.x + 5 + i * 10, dino.y - 8, 6, 10);
            }
            
            // 显示名字
            ctx.fillStyle = '#333';
            ctx.font = 'bold 12px Microsoft YaHei';
            ctx.textAlign = 'center';
            ctx.fillText(playerNameInput.value || '小恐龙', dino.x + dino.width/2, dino.y - 20);
            
            ctx.restore();
        }
        
        // 绘制障碍物
        function drawObstacles() {
            obstacles.forEach(obstacle => {
                ctx.save();
                
                if (obstacle.type === 'cactus') {
                    // 绘制仙人掌
                    ctx.fillStyle = '#2E7D32';
                    ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
                    
                    // 仙人掌刺
                    ctx.fillStyle = '#1B5E20';
                    for (let i = 0; i < 3; i++) {
                        ctx.fillRect(obstacle.x - 3, obstacle.y + 10 + i * 15, 6, 3);
                        ctx.fillRect(obstacle.x + obstacle.width - 3, obstacle.y + 10 + i * 15, 6, 3);
                    }
                    
                    // 仙人掌分支
                    ctx.fillRect(obstacle.x - 10, obstacle.y + 10, 10, 8);
                    ctx.fillRect(obstacle.x + obstacle.width, obstacle.y + 20, 10, 8);
                } else if (obstacle.type === 'rock') {
                    // 绘制石头
                    ctx.fillStyle = '#795548';
                    ctx.beginPath();
                    ctx.ellipse(obstacle.x + obstacle.width/2, obstacle.y + obstacle.height/2, 
                               obstacle.width/2, obstacle.height/2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 石头纹理
                    ctx.fillStyle = '#5D4037';
                    ctx.beginPath();
                    ctx.ellipse(obstacle.x + obstacle.width/2 - 5, obstacle.y + obstacle.height/2 - 3, 
                               5, 3, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else if (obstacle.type === 'bird') {
                    // 绘制飞鸟
                    ctx.fillStyle = '#FF5722';
                    ctx.beginPath();
                    ctx.ellipse(obstacle.x + obstacle.width/2, obstacle.y + obstacle.height/2, 
                               obstacle.width/2, obstacle.height/3, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 鸟翅膀
                    const wingOffset = Math.sin(Date.now() / 80) * 10;
                    ctx.fillStyle = '#FF8A65';
                    ctx.beginPath();
                    ctx.moveTo(obstacle.x + 5, obstacle.y + obstacle.height/2);
                    ctx.lineTo(obstacle.x - 10, obstacle.y + obstacle.height/2 - 10 + wingOffset);
                    ctx.lineTo(obstacle.x + 5, obstacle.y + obstacle.height/2 - 5);
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.moveTo(obstacle.x + obstacle.width - 5, obstacle.y + obstacle.height/2);
                    ctx.lineTo(obstacle.x + obstacle.width + 10, obstacle.y + obstacle.height/2 - 10 + wingOffset);
                    ctx.lineTo(obstacle.x + obstacle.width - 5, obstacle.y + obstacle.height/2 - 5);
                    ctx.fill();
                }
                
                ctx.restore();
            });
        }
        
        // 绘制云朵
        function drawClouds() {
            clouds.forEach(cloud => {
                ctx.save();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.size, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 0.8, cloud.y - cloud.size * 0.3, cloud.size * 0.7, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 1.5, cloud.y, cloud.size * 0.8, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            });
        }
        
        // 绘制地面
        function drawGround() {
            ctx.fillStyle = '#DEB887';
            ctx.fillRect(0, 270, canvas.width, 30);
            
            // 地面纹理
            ctx.fillStyle = '#D2B48C';
            for (let i = 0; i < canvas.width; i += 20) {
                ctx.fillRect(i, 270, 10, 3);
            }
        }
        
        // 更新恐龙
        function updateDino() {
            if (dino.jumping) {
                dino.y += dino.jumpVelocity;
                dino.jumpVelocity += dino.gravity;
                
                if (dino.y >= dino.groundY) {
                    dino.y = dino.groundY;
                    dino.jumping = false;
                    dino.jumpVelocity = 0;
                }
            }
        }
        
        // 更新障碍物
        function updateObstacles() {
            obstacleTimer++;
            
            if (obstacleTimer >= obstacleInterval) {
                obstacleTimer = 0;
                
                const types = ['cactus', 'rock', 'bird'];
                const type = types[Math.floor(Math.random() * types.length)];
                
                let obstacle = {
                    x: canvas.width,
                    type: type,
                    passed: false
                };
                
                if (type === 'cactus') {
                    obstacle.width = 25;
                    obstacle.height = 40 + Math.random() * 20;
                    obstacle.y = 270 - obstacle.height;
                } else if (type === 'rock') {
                    obstacle.width = 30;
                    obstacle.height = 25;
                    obstacle.y = 270 - obstacle.height;
                } else if (type === 'bird') {
                    obstacle.width = 40;
                    obstacle.height = 25;
                    obstacle.y = 150 + Math.random() * 80;
                }
                
                obstacles.push(obstacle);
                
                // 随着分数增加，加快生成速度
                obstacleInterval = Math.max(60, 120 - Math.floor(score / 50) * 5);
            }
            
            obstacles.forEach((obstacle, index) => {
                obstacle.x -= gameSpeed;
                
                // 计分
                if (!obstacle.passed && obstacle.x + obstacle.width < dino.x) {
                    obstacle.passed = true;
                    score += 10;
                    scoreElement.textContent = score;
                    
                    // 每100分增加速度
                    if (score % 100 === 0) {
                        gameSpeed += 0.5;
                        speedElement.textContent = (gameSpeed / 5).toFixed(1);
                    }
                }
                
                // 移除屏幕外的障碍物
                if (obstacle.x + obstacle.width < 0) {
                    obstacles.splice(index, 1);
                }
            });
        }
        
        // 更新云朵
        function updateClouds() {
            if (Math.random() < 0.01) {
                clouds.push({
                    x: canvas.width,
                    y: 30 + Math.random() * 80,
                    size: 20 + Math.random() * 20
                });
            }
            
            clouds.forEach((cloud, index) => {
                cloud.x -= gameSpeed * 0.3;
                
                if (cloud.x + cloud.size * 2 < 0) {
                    clouds.splice(index, 1);
                }
            });
        }
        
        // 碰撞检测
        function checkCollision() {
            for (let obstacle of obstacles) {
                if (dino.x < obstacle.x + obstacle.width &&
                    dino.x + dino.width > obstacle.x &&
                    dino.y < obstacle.y + obstacle.height &&
                    dino.y + dino.height > obstacle.y) {
                    return true;
                }
            }
            return false;
        }
        
        // 游戏主循环
        function gameLoop() {
            if (!gameRunning) return;
            
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制背景
            drawClouds();
            drawGround();
            
            // 更新和绘制游戏对象
            updateDino();
            updateObstacles();
            updateClouds();
            
            drawDino();
            drawObstacles();
            
            // 碰撞检测
            if (checkCollision()) {
                gameOver();
                return;
            }
            
            animationId = requestAnimationFrame(gameLoop);
        }
        
        // 跳跃
        function jump() {
            if (!gameRunning) return;
            
            if (!dino.jumping) {
                dino.jumping = true;
                dino.jumpVelocity = dino.jumpPower;
            }
        }
        
        // 开始游戏
        function startGame() {
            if (gameRunning) return;
            
            // 重置游戏状态
            gameRunning = true;
            score = 0;
            gameSpeed = 5;
            obstacles = [];
            clouds = [];
            obstacleTimer = 0;
            obstacleInterval = 120;
            
            dino.y = dino.groundY;
            dino.jumping = false;
            dino.jumpVelocity = 0;
            
            scoreElement.textContent = '0';
            speedElement.textContent = '1';
            
            startBtn.textContent = '⏸️ 游戏进行中';
            startBtn.disabled = true;
            jumpBtn.disabled = false;
            
            gameOverScreen.style.display = 'none';
            
            gameLoop();
        }
        
        // 游戏结束
        function gameOver() {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            
            finalName.textContent = playerNameInput.value || '小恐龙';
            finalScore.textContent = score;
            gameOverScreen.style.display = 'block';
            
            startBtn.textContent = '▶️ 开始游戏';
            startBtn.disabled = false;
            jumpBtn.disabled = true;
        }
        
        // 重新开始
        function restartGame() {
            gameOverScreen.style.display = 'none';
            startGame();
        }
        
        // 键盘控制
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                jump();
            }
        });
        
        // 初始绘制
        function initialDraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGround();
            drawDino();
            
            // 绘制提示文字
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.font = 'bold 24px Microsoft YaHei';
            ctx.textAlign = 'center';
            ctx.fillText('点击"开始游戏"开始挑战！', canvas.width/2, canvas.height/2);
        }
        
        initialDraw();
    </script>
</body>
</html>
