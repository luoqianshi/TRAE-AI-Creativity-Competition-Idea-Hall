  <script>
    (function() {
      const STORAGE_KEY = 'quadrant_tasks_v1';
      const QUADRANTS = [
        { id: 'urgent-important', name: '重要且紧急', color: '#ef4444' },
        { id: 'important-not-urgent', name: '重要不紧急', color: '#f59e0b' },
        { id: 'urgent-not-important', name: '紧急不重要', color: '#3b82f6' },
        { id: 'not-urgent-not-important', name: '不紧急不重要', color: '#9ca3af' }
      ];

      function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
      }

      function loadTasks() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : getDemoTasks();
        } catch (e) {
          return getDemoTasks();
        }
      }

      function saveTasks(tasks) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      }

      function getDemoTasks() {
        const now = new Date();
        const fmt = d => d.toISOString().split('T')[0];
        return [
          { id: generateId(), title: '完成项目汇报PPT', desc: '明天上午10点部门汇报', quadrant: 'urgent-important', deadline: fmt(new Date(now.getTime()+86400000)), completed: false, createdAt: Date.now() },
          { id: generateId(), title: '回复客户紧急邮件', desc: '关于合同条款的确认', quadrant: 'urgent-important', deadline: fmt(now), completed: false, createdAt: Date.now() },
          { id: generateId(), title: '学习Python数据分析', desc: '系统提升数据处理能力', quadrant: 'important-not-urgent', deadline: fmt(new Date(now.getTime()+30*86400000)), completed: false, createdAt: Date.now() },
          { id: generateId(), title: '制定季度工作计划', desc: '梳理Q3核心目标与里程碑', quadrant: 'important-not-urgent', deadline: fmt(new Date(now.getTime()+7*86400000)), completed: true, createdAt: Date.now() },
          { id: generateId(), title: '取快递', desc: '顺丰快递柜', quadrant: 'urgent-not-important', deadline: fmt(now), completed: false, createdAt: Date.now() },
          { id: generateId(), title: '整理桌面文件', desc: '归类近期文档', quadrant: 'not-urgent-not-important', deadline: '', completed: false, createdAt: Date.now() }
        ];
      }

      const app = {
        tasks: loadTasks(),
        draggedId: null,

        init() {
          this.render();
          this.updateStats();
        },

        render() {
          QUADRANTS.forEach(q => {
            const list = document.getElementById('list-' + q.id);
            const qTasks = this.tasks.filter(t => t.quadrant === q.id).sort((a,b) => a.completed - b.completed || b.createdAt - a.createdAt);
            document.getElementById('count-' + q.id).textContent = qTasks.length + ' 任务';
            const completed = qTasks.filter(t => t.completed).length;
            const pct = qTasks.length ? (completed / qTasks.length * 100) : 0;
            document.getElementById('progress-' + q.id).style.width = pct + '%';

            if (qTasks.length === 0) {
              list.innerHTML = '<div class="empty-state">暂无任务<br>点击右上角新增任务</div>';
              return;
            }
            list.innerHTML = qTasks.map(t => `
              <div class="task-item ${t.completed ? 'completed' : ''}" draggable="true" data-id="${t.id}" ondragstart="app.handleDragStart(event)" ondragend="app.handleDragEnd(event)">
                <div class="task-title">${this.escapeHtml(t.title)}</div>
                <div class="task-meta">
                  ${t.deadline ? `<span>📅 ${t.deadline}</span>` : ''}
                  ${t.desc ? `<span>📝 ${this.escapeHtml(t.desc)}</span>` : ''}
                </div>
                <div class="task-actions">
                  <button class="task-btn complete" onclick="app.toggleComplete('${t.id}')">${t.completed ? '↩ 撤销' : '✓ 完成'}</button>
                  <button class="task-btn edit" onclick="app.editTask('${t.id}')">✎ 编辑</button>
                  <button class="task-btn delete" onclick="app.deleteTask('${t.id}')">✕ 删除</button>
                </div>
              </div>
            `).join('');
          });
        },

        updateStats() {
          const total = this.tasks.length;
          const completed = this.tasks.filter(t => t.completed).length;
          const pending = total - completed;
          const rate = total ? Math.round(completed / total * 100) : 0;

          document.getElementById('totalTasks').textContent = total;
          document.getElementById('completedTasks').textContent = completed;
          document.getElementById('pendingTasks').textContent = pending;
          document.getElementById('completionRate').textContent = rate + '%';

          document.getElementById('totalBar').style.width = total ? '100%' : '0%';
          document.getElementById('completedBar').style.width = rate + '%';
          document.getElementById('pendingBar').style.width = (100 - rate) + '%';
          document.getElementById('rateBar').style.width = rate + '%';

          if (window.updateCharts) window.updateCharts(this.tasks);
        },

        openModal(taskId) {
          document.getElementById('taskModal').classList.add('active');
          if (taskId) {
            const t = this.tasks.find(x => x.id === taskId);
            if (!t) return;
            document.getElementById('modalTitle').textContent = '编辑任务';
            document.getElementById('taskId').value = t.id;
            document.getElementById('taskTitle').value = t.title;
            document.getElementById('taskDesc').value = t.desc || '';
            document.getElementById('taskQuadrant').value = t.quadrant;
            document.getElementById('taskDeadline').value = t.deadline || '';
          } else {
            document.getElementById('modalTitle').textContent = '新增任务';
            document.getElementById('taskId').value = '';
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDesc').value = '';
            document.getElementById('taskQuadrant').value = 'urgent-important';
            document.getElementById('taskDeadline').value = '';
          }
        },

        closeModal() {
          document.getElementById('taskModal').classList.remove('active');
        },

        saveTask() {
          const id = document.getElementById('taskId').value;
          const title = document.getElementById('taskTitle').value.trim();
          const desc = document.getElementById('taskDesc').value.trim();
          const quadrant = document.getElementById('taskQuadrant').value;
          const deadline = document.getElementById('taskDeadline').value;
          if (!title) { this.showToast('请输入任务标题', 'error'); return; }
          if (id) {
            const t = this.tasks.find(x => x.id === id);
            if (t) { t.title = title; t.desc = desc; t.quadrant = quadrant; t.deadline = deadline; }
          } else {
            this.tasks.push({ id: generateId(), title, desc, quadrant, deadline, completed: false, createdAt: Date.now() });
          }
          saveTasks(this.tasks);
          this.render();
          this.updateStats();
          this.closeModal();
          this.showToast(id ? '任务已更新' : '任务已创建');
        },

        toggleComplete(id) {
          const t = this.tasks.find(x => x.id === id);
          if (t) { t.completed = !t.completed; saveTasks(this.tasks); this.render(); this.updateStats(); this.showToast(t.completed ? '任务已完成' : '已撤销完成状态'); }
        },

        editTask(id) { this.openModal(id); },

        deleteTask(id) {
          if (!confirm('确定删除该任务吗？')) return;
          this.tasks = this.tasks.filter(x => x.id !== id);
          saveTasks(this.tasks);
          this.render();
          this.updateStats();
          this.showToast('任务已删除');
        },

        clearAll() {
          if (!this.tasks.length) { this.showToast('当前没有任务'); return; }
          if (!confirm('确定清空所有任务吗？此操作不可恢复！')) return;
          this.tasks = [];
          saveTasks(this.tasks);
          this.render();
          this.updateStats();
          this.showToast('全部任务已清空');
        },

        handleDragStart(e) {
          this.draggedId = e.target.dataset.id;
          e.target.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        },

        handleDragEnd(e) {
          e.target.classList.remove('dragging');
          this.draggedId = null;
          document.querySelectorAll('.quadrant').forEach(q => q.classList.remove('drag-over'));
        },

        handleDragOver(e) {
          e.preventDefault();
          e.currentTarget.classList.add('drag-over');
        },

        handleDragLeave(e) {
          e.currentTarget.classList.remove('drag-over');
        },

        handleDrop(e) {
          e.preventDefault();
          const quadrant = e.currentTarget.dataset.quadrant;
          e.currentTarget.classList.remove('drag-over');
          if (!this.draggedId) return;
          const t = this.tasks.find(x => x.id === this.draggedId);
          if (t && t.quadrant !== quadrant) {
            t.quadrant = quadrant;
            saveTasks(this.tasks);
            this.render();
            this.updateStats();
            this.showToast('任务已移动到 ' + QUADRANTS.find(q => q.id === quadrant).name);
          }
        },

        showToast(msg) {
          const container = document.getElementById('toastContainer');
          const toast = document.createElement('div');
          toast.className = 'toast';
          toast.textContent = msg;
          container.appendChild(toast);
          setTimeout(() => { toast.remove(); }, 2500);
        },

        escapeHtml(str) {
          if (!str) return '';
          return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[m]));
        }
      };

      window.app = app;
      app.init();

      document.getElementById('taskModal').addEventListener('click', function(e) {
        if (e.target === this) app.closeModal();
      });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') app.closeModal();
      });
    })();
  </script>
</body>
</html>
