<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字母拼词 - 英语单词游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            min-height: 600px;
            overflow: hidden;
            position: relative;
        }

        /* 页面 */
        .page {
            display: none;
            padding: 30px;
            min-height: 600px;
            flex-direction: column;
        }

        .page.active {
            display: flex;
        }

        /* 首页 */
        .home-page {
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 30px;
        }

        .logo {
            font-size: 60px;
            margin-bottom: 10px;
        }

        .title {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-top: 10px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-small {
            padding: 10px 25px;
            font-size: 14px;
        }

        /* 关卡选择页 */
        .levels-page {
            gap: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            color: #333;
        }

        .back-btn {
            background: #f0f0f0;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: #e0e0e0;
        }

        .stats-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-item {
            flex: 1;
            background: linear-gradient(135deg, #667eea22, #764ba222);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            flex: 1;
            align-content: start;
        }

        .level-card {
            background: white;
            border: 3px solid #eee;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .level-card:hover {
            border-color: #667eea;
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.2);
        }

        .level-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .level-card.locked:hover {
            transform: none;
            border-color: #eee;
            box-shadow: none;
        }

        .level-icon {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .level-name {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .level-words {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        /* 游戏页面 */
        .game-page {
            gap: 20px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-progress {
            display: flex;
            gap: 5px;
        }

        .progress-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #eee;
        }

        .progress-dot.correct {
            background: #4ade80;
        }

        .progress-dot.wrong {
            background: #f87171;
        }

        .progress-dot.current {
            background: #667eea;
            transform: scale(1.2);
        }

        .score-display {
            background: linear-gradient(135deg, #667eea22, #764ba222);
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 600;
            color: #667eea;
        }

        .meaning-box {
            background: linear-gradient(135deg, #f093fb22, #f5576c22);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            margin: 10px 0;
        }

        .meaning-text {
            font-size: 28px;
            font-weight: 600;
            color: #333;
        }

        .hint-text {
            font-size: 14px;
            color: #999;
            margin-top: 10px;
        }

        /* 字母区域 */
        .letters-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
            justify-content: center;
        }

        .answer-area {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            min-height: 60px;
            padding: 15px;
            background: #f8f8f8;
            border-radius: 15px;
            border: 3px dashed #ddd;
        }

        .answer-area.correct {
            background: #4ade8022;
            border-color: #4ade80;
            animation: pulse 0.5s;
        }

        .answer-area.wrong {
            background: #f8717122;
            border-color: #f87171;
            animation: shake 0.5s;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .letter-slot {
            width: 45px;
            height: 55px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            transition: all 0.2s;
        }

        .letter-slot.empty {
            background: transparent;
            border: 2px dashed #ddd;
        }

        .letter-slot.filled {
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.2);
            cursor: pointer;
        }

        .letter-slot.filled:hover {
            background: #667eea;
            color: white;
        }

        .options-area {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .letter-btn {
            width: 50px;
            height: 60px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .letter-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .letter-btn:active {
            transform: translateY(0);
        }

        .letter-btn.used {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        /* 结果页面 */
        .result-page {
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 25px;
        }

        .result-icon {
            font-size: 80px;
        }

        .result-title {
            font-size: 32px;
            font-weight: 700;
            color: #333;
        }

        .result-stats {
            display: flex;
            gap: 20px;
            width: 100%;
            justify-content: center;
        }

        .result-stat {
            background: #f8f8f8;
            padding: 20px 30px;
            border-radius: 20px;
        }

        .result-stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #667eea;
        }

        .result-stat-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        .result-buttons {
            display: flex;
            gap: 15px;
        }

        /* 单词库页面 */
        .wordlist-page {
            gap: 15px;
        }

        .word-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            flex: 1;
            overflow-y: auto;
            align-content: start;
        }

        .word-card {
            background: linear-gradient(135deg, #667eea22, #764ba222);
            padding: 15px;
            border-radius: 15px;
        }

        .word-text {
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }

        .word-meaning {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        .word-mastered {
            background: linear-gradient(135deg, #4ade8022, #22c55e22);
        }

        .word-mastered .word-text::after {
            content: ' ✓';
            color: #4ade80;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 首页 -->
        <div id="homePage" class="page home-page active">
            <div class="logo">🎮</div>
            <div class="title">字母拼词</div>
            <div class="subtitle">在游戏中记住英语单词</div>
            <button class="btn" onclick="showLevels()">开始游戏</button>
            <button class="btn btn-secondary btn-small" onclick="showWordList()">单词库</button>
        </div>

        <!-- 关卡选择页 -->
        <div id="levelsPage" class="page levels-page">
            <div class="header">
                <button class="back-btn" onclick="showHome()">←</button>
                <div class="header-title">选择关卡</div>
                <div></div>
            </div>
            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-value" id="totalScore">0</div>
                    <div class="stat-label">总得分</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="correctRate">0%</div>
                    <div class="stat-label">正确率</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="masteredCount">0</div>
                    <div class="stat-label">已掌握</div>
                </div>
            </div>
            <div class="level-grid" id="levelGrid"></div>
        </div>

        <!-- 游戏页 -->
        <div id="gamePage" class="page game-page">
            <div class="game-header">
                <button class="back-btn" onclick="confirmExit()">←</button>
                <div class="game-progress" id="gameProgress"></div>
                <div class="score-display" id="currentScore">0分</div>
            </div>
            <div class="meaning-box">
                <div class="meaning-text" id="meaningText">苹果</div>
                <div class="hint-text">拼写出这个单词</div>
            </div>
            <div class="letters-area">
                <div class="answer-area" id="answerArea"></div>
                <div class="options-area" id="optionsArea"></div>
            </div>
        </div>

        <!-- 结果页 -->
        <div id="resultPage" class="page result-page">
            <div class="result-icon" id="resultIcon">🎉</div>
            <div class="result-title" id="resultTitle">太棒了！</div>
            <div class="result-stats">
                <div class="result-stat">
                    <div class="result-stat-value" id="resultScore">0</div>
                    <div class="result-stat-label">得分</div>
                </div>
                <div class="result-stat">
                    <div class="result-stat-value" id="resultCorrect">0/0</div>
                    <div class="result-stat-label">正确数</div>
                </div>
            </div>
            <div class="result-buttons">
                <button class="btn btn-small" onclick="restartGame()">再玩一次</button>
                <button class="btn btn-secondary btn-small" onclick="showLevels()">返回关卡</button>
            </div>
        </div>

        <!-- 单词库页 -->
        <div id="wordlistPage" class="page wordlist-page">
            <div class="header">
                <button class="back-btn" onclick="showHome()">←</button>
                <div class="header-title">单词库</div>
                <div></div>
            </div>
            <div class="word-grid" id="wordGrid"></div>
        </div>
    </div>

    <script>
        // 单词数据库 - 80个单词，8个等级
        const wordDatabase = [
            // Level 1 - 基础词汇 (3-4字母)
            { word: "cat", meaning: "猫", level: 1 },
            { word: "dog", meaning: "狗", level: 1 },
            { word: "sun", meaning: "太阳", level: 1 },
            { word: "moon", meaning: "月亮", level: 1 },
            { word: "tree", meaning: "树", level: 1 },
            { word: "book", meaning: "书", level: 1 },
            { word: "fish", meaning: "鱼", level: 1 },
            { word: "bird", meaning: "鸟", level: 1 },
            { word: "hand", meaning: "手", level: 1 },
            { word: "foot", meaning: "脚", level: 1 },

            // Level 2 - 食物水果 (4-5字母)
            { word: "apple", meaning: "苹果", level: 2 },
            { word: "grape", meaning: "葡萄", level: 2 },
            { word: "orange", meaning: "橙子", level: 2 },
            { word: "egg", meaning: "鸡蛋", level: 2 },
            { word: "rice", meaning: "米饭", level: 2 },
            { word: "bread", meaning: "面包", level: 2 },
            { word: "milk", meaning: "牛奶", level: 2 },
            { word: "water", meaning: "水", level: 2 },
            { word: "juice", meaning: "果汁", level: 2 },
            { word: "sugar", meaning: "糖", level: 2 },

            // Level 3 - 动物世界 (4-6字母)
            { word: "tiger", meaning: "老虎", level: 3 },
            { word: "lion", meaning: "狮子", level: 3 },
            { word: "elephant", meaning: "大象", level: 3 },
            { word: "monkey", meaning: "猴子", level: 3 },
            { word: "snake", meaning: "蛇", level: 3 },
            { word: "horse", meaning: "马", level: 3 },
            { word: "sheep", meaning: "羊", level: 3 },
            { word: "panda", meaning: "熊猫", level: 3 },
            { word: "rabbit", meaning: "兔子", level: 3 },
            { word: "zebra", meaning: "斑马", level: 3 },

            // Level 4 - 自然环境 (5-6字母)
            { word: "river", meaning: "河流", level: 4 },
            { word: "ocean", meaning: "海洋", level: 4 },
            { word: "mountain", meaning: "山", level: 4 },
            { word: "forest", meaning: "森林", level: 4 },
            { word: "flower", meaning: "花", level: 4 },
            { word: "garden", meaning: "花园", level: 4 },
            { word: "beach", meaning: "海滩", level: 4 },
            { word: "island", meaning: "岛屿", level: 4 },
            { word: "cloud", meaning: "云", level: 4 },
            { word: "storm", meaning: "暴风雨", level: 4 },

            // Level 5 - 日常物品 (5-7字母)
            { word: "table", meaning: "桌子", level: 5 },
            { word: "chair", meaning: "椅子", level: 5 },
            { word: "window", meaning: "窗户", level: 5 },
            { word: "door", meaning: "门", level: 5 },
            { word: "phone", meaning: "手机", level: 5 },
            { word: "clock", meaning: "时钟", level: 5 },
            { word: "mirror", meaning: "镜子", level: 5 },
            { word: "pillow", meaning: "枕头", level: 5 },
            { word: "blanket", meaning: "毯子", level: 5 },
            { word: "towel", meaning: "毛巾", level: 5 },

            // Level 6 - 形容词 (6-8字母)
            { word: "beautiful", meaning: "美丽的", level: 6 },
            { word: "dangerous", meaning: "危险的", level: 6 },
            { word: "important", meaning: "重要的", level: 6 },
            { word: "wonderful", meaning: "精彩的", level: 6 },
            { word: "fantastic", meaning: "极好的", level: 6 },
            { word: "delicious", meaning: "美味的", level: 6 },
            { word: "exciting", meaning: "令人兴奋的", level: 6 },
            { word: "friendly", meaning: "友好的", level: 6 },
            { word: "popular", meaning: "流行的", level: 6 },
            { word: "careful", meaning: "仔细的", level: 6 },

            // Level 7 - 动词短语 (6-9字母)
            { word: "remember", meaning: "记住", level: 7 },
            { word: "understand", meaning: "理解", level: 7 },
            { word: "challenge", meaning: "挑战", level: 7 },
            { word: "celebrate", meaning: "庆祝", level: 7 },
            { word: "communicate", meaning: "交流", level: 7 },
            { word: "discover", meaning: "发现", level: 7 },
            { word: "experience", meaning: "体验", level: 7 },
            { word: "imagine", meaning: "想象", level: 7 },
            { word: "improve", meaning: "改进", level: 7 },
            { word: "protect", meaning: "保护", level: 7 },

            // Level 8 - 高级词汇 (7-10字母)
            { word: "education", meaning: "教育", level: 8 },
            { word: "friendship", meaning: "友谊", level: 8 },
            { word: "knowledge", meaning: "知识", level: 8 },
            { word: "adventure", meaning: "冒险", level: 8 },
            { word: "chocolate", meaning: "巧克力", level: 8 },
            { word: "christmas", meaning: "圣诞节", level: 8 },
            { word: "hurricane", meaning: "飓风", level: 8 },
            { word: "keyboard", meaning: "键盘", level: 8 },
            { word: "medicine", meaning: "药", level: 8 },
            { word: "basketball", meaning: "篮球", level: 8 },
        ];

        // 关卡配置 - 8个关卡
        const levelConfig = [
            { id: 1, name: "基础篇", icon: "🌱", words: 5 },
            { id: 2, name: "食物篇", icon: "🍎", words: 5 },
            { id: 3, name: "动物篇", icon: "🦁", words: 5 },
            { id: 4, name: "自然篇", icon: "🌍", words: 5 },
            { id: 5, name: "物品篇", icon: "🏠", words: 5 },
            { id: 6, name: "形容词", icon: "✨", words: 5 },
            { id: 7, name: "动词篇", icon: "💪", words: 5 },
            { id: 8, name: "挑战篇", icon: "🔥", words: 5 },
        ];

        // 游戏状态
        let gameState = {
            currentLevel: 1,
            currentWordIndex: 0,
            score: 0,
            correctCount: 0,
            totalCount: 0,
            currentWords: [],
            selectedLetters: [],
            correctWords: new Set(),
        };

        // 用户数据
        let userData = {
            totalScore: 0,
            totalCorrect: 0,
            totalAttempts: 0,
            masteredWords: new Set(),
        };

        // 初始化
        function init() {
            loadUserData();
            updateStats();
        }

        // 加载用户数据
        function loadUserData() {
            const saved = localStorage.getItem('wordGameData');
            if (saved) {
                const data = JSON.parse(saved);
                userData.totalScore = data.totalScore || 0;
                userData.totalCorrect = data.totalCorrect || 0;
                userData.totalAttempts = data.totalAttempts || 0;
                userData.masteredWords = new Set(data.masteredWords || []);
            }
        }

        // 保存用户数据
        function saveUserData() {
            localStorage.setItem('wordGameData', JSON.stringify({
                totalScore: userData.totalScore,
                totalCorrect: userData.totalCorrect,
                totalAttempts: userData.totalAttempts,
                masteredWords: Array.from(userData.masteredWords),
            }));
        }

        // 更新统计
        function updateStats() {
            document.getElementById('totalScore').textContent = userData.totalScore;
            const rate = userData.totalAttempts > 0 
                ? Math.round((userData.totalCorrect / userData.totalAttempts) * 100) 
                : 0;
            document.getElementById('correctRate').textContent = rate + '%';
            document.getElementById('masteredCount').textContent = userData.masteredWords.size;
        }

        // 页面导航
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        function showHome() {
            showPage('homePage');
            updateStats();
        }

        function showLevels() {
            renderLevelGrid();
            showPage('levelsPage');
        }

        function showWordList() {
            renderWordList();
            showPage('wordlistPage');
        }

        // 渲染关卡网格
        function renderLevelGrid() {
            const grid = document.getElementById('levelGrid');
            grid.innerHTML = '';

            levelConfig.forEach(level => {
                const words = wordDatabase.filter(w => w.level === level.id);
                const masteredInLevel = words.filter(w => userData.masteredWords.has(w.word)).length;
                
                const card = document.createElement('div');
                card.className = 'level-card';
                card.innerHTML = `
                    <div class="level-icon">${level.icon}</div>
                    <div class="level-name">${level.name}</div>
                    <div class="level-words">${masteredInLevel}/${words.length} 已掌握</div>
                `;
                card.onclick = () => startGame(level.id);
                grid.appendChild(card);
            });
        }

        // 渲染单词库
        function renderWordList() {
            const grid = document.getElementById('wordGrid');
            grid.innerHTML = '';

            wordDatabase.forEach(word => {
                const isMastered = userData.masteredWords.has(word.word);
                const card = document.createElement('div');
                card.className = 'word-card' + (isMastered ? ' word-mastered' : '');
                card.innerHTML = `
                    <div class="word-text">${word.word}</div>
                    <div class="word-meaning">${word.meaning}</div>
                `;
                grid.appendChild(card);
            });
        }

        // 开始游戏
        function startGame(levelId) {
            gameState = {
                currentLevel: levelId,
                currentWordIndex: 0,
                score: 0,
                correctCount: 0,
                totalCount: levelConfig[levelId - 1].words,
                currentWords: shuffleArray(wordDatabase.filter(w => w.level === levelId)).slice(0, levelConfig[levelId - 1].words),
                selectedLetters: [],
                correctWords: new Set(),
            };

            showPage('gamePage');
            renderProgress();
            loadWord();
        }

        // 随机打乱数组
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // 渲染进度点
        function renderProgress() {
            const progress = document.getElementById('gameProgress');
            progress.innerHTML = '';

            for (let i = 0; i < gameState.totalCount; i++) {
                const dot = document.createElement('div');
                dot.className = 'progress-dot';
                if (i < gameState.currentWordIndex) {
                    dot.className += gameState.correctWords.has(gameState.currentWords[i].word) ? ' correct' : ' wrong';
                } else if (i === gameState.currentWordIndex) {
                    dot.className += ' current';
                }
                progress.appendChild(dot);
            }

            document.getElementById('currentScore').textContent = gameState.score + '分';
        }

        // 加载单词
        function loadWord() {
            if (gameState.currentWordIndex >= gameState.totalCount) {
                endGame();
                return;
            }

            const word = gameState.currentWords[gameState.currentWordIndex];
            document.getElementById('meaningText').textContent = word.meaning;

            // 生成字母选项（正确答案 + 干扰项）
            const correctLetters = word.word.split('');
            const干扰项 = 'abcdefghijklmnopqrstuvwxyz'.split('')
                .filter(l => !correctLetters.includes(l));
            
            const extraLetters = shuffleArray(干扰项).slice(0, Math.max(0, 6 - correctLetters.length));
            const allLetters = shuffleArray([...correctLetters, ...extraLetters]);

            // 渲染答案槽
            const answerArea = document.getElementById('answerArea');
            answerArea.innerHTML = '';
            answerArea.className = 'answer-area';

            for (let i = 0; i < correctLetters.length; i++) {
                const slot = document.createElement('div');
                slot.className = 'letter-slot empty';
                slot.dataset.index = i;
                answerArea.appendChild(slot);
            }

            // 渲染字母按钮
            const optionsArea = document.getElementById('optionsArea');
            optionsArea.innerHTML = '';

            allLetters.forEach((letter, index) => {
                const btn = document.createElement('button');
                btn.className = 'letter-btn';
                btn.textContent = letter.toUpperCase();
                btn.onclick = () => selectLetter(letter, btn);
                optionsArea.appendChild(btn);
            });

            gameState.selectedLetters = [];
        }

        // 选择字母
        function selectLetter(letter, btn) {
            if (btn.classList.contains('used')) return;

            const emptySlot = document.querySelector('.letter-slot.empty');
            if (!emptySlot) return;

            btn.classList.add('used');
            emptySlot.textContent = letter.toUpperCase();
            emptySlot.className = 'letter-slot filled';
            emptySlot.dataset.letter = letter;

            gameState.selectedLetters.push(letter);

            // 检查是否填满
            const answerArea = document.getElementById('answerArea');
            if (!answerArea.querySelector('.letter-slot.empty')) {
                checkAnswer();
            }
        }

        // 检查答案
        function checkAnswer() {
            const word = gameState.currentWords[gameState.currentWordIndex];
            const answer = gameState.selectedLetters.join('');
            const answerArea = document.getElementById('answerArea');

            if (answer === word.word) {
                // 正确
                answerArea.classList.add('correct');
                gameState.correctCount++;
                gameState.score += 10;
                gameState.correctWords.add(word.word);
                userData.masteredWords.add(word.word);

                setTimeout(() => {
                    gameState.currentWordIndex++;
                    renderProgress();
                    loadWord();
                }, 800);
            } else {
                // 错误
                answerArea.classList.add('wrong');

                // 显示正确答案
                const slots = answerArea.querySelectorAll('.letter-slot');
                slots.forEach((slot, i) => {
                    slot.style.color = '#f87171';
                    slot.textContent = word.word[i].toUpperCase();
                });

                setTimeout(() => {
                    gameState.currentWordIndex++;
                    renderProgress();
                    loadWord();
                }, 1200);
            }

            // 更新用户数据
            userData.totalCorrect++;
            userData.totalAttempts++;
            userData.totalScore += gameState.score > 0 ? 10 : 0;
            saveUserData();
        }

        // 结束游戏
        function endGame() {
            const rate = Math.round((gameState.correctCount / gameState.totalCount) * 100);

            document.getElementById('resultIcon').textContent = rate >= 80 ? '🎉' : rate >= 60 ? '👍' : '💪';
            document.getElementById('resultTitle').textContent = rate >= 80 ? '太棒了！' : rate >= 60 ? '很不错！' : '继续加油！';
            document.getElementById('resultScore').textContent = gameState.score;
            document.getElementById('resultCorrect').textContent = gameState.correctCount + '/' + gameState.totalCount;

            showPage('resultPage');
        }

        // 重新开始
        function restartGame() {
            startGame(gameState.currentLevel);
        }

        // 确认退出
        function confirmExit() {
            if (gameState.currentWordIndex > 0) {
                if (confirm('确定要退出吗？当前进度将不会保存。')) {
                    showLevels();
                }
            } else {
                showLevels();
            }
        }

        // 初始化
        init();
    </script>
</body>
</html>
