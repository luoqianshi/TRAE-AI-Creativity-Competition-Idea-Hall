<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学公式格式转换工具 | 标准数学格式生成</title>
    <!-- 引入Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入字体图标 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <!-- 引入MathJax用于渲染数学公式 -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]']]
            },
            chtml: {
                fontURL: 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/output/chtml/fonts/woff-v2'
            },
            startup: {
                typeset: false
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <!-- 引入html2canvas用于保存图片 -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <!-- 自定义配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#d32f2f',
                        secondary: '#f5f5f5',
                        dark: '#333333',
                    },
                    fontFamily: {
                        sans: ['Microsoft YaHei', 'Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .text-shadow {
                text-shadow: 0 1px 2px rgba(0,0,0,0.1);
            }
            .btn-hover {
                @apply transition-all duration-300 hover:shadow-lg hover:-translate-y-1;
            }
            .card {
                @apply bg-white rounded-lg shadow-md p-2 sm:p-4 transition-all duration-300 hover:shadow-lg;
            }
            .formula-preview {
                @apply bg-white rounded-lg p-6 text-xl md:text-2xl lg:text-3xl text-center min-h-[150px] flex items-center justify-center;
            }
            .formula-item {
                @apply py-2 px-3 rounded-md hover:bg-gray-100 cursor-pointer transition-all duration-200 text-sm border-b border-gray-100;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-3 max-w-7xl">
        <!-- 标题区域 -->
        <header class="text-center">
            <h1 class="text-[clamp(1.2rem,3vw,2rem)] font-bold text-dark text-shadow mb-2">数学公式格式转换工具</h1>
        </header>

        <!-- 基础设置区 -->
        <section class="card mb-3">
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-12 gap-2 md:gap-3 items-end">
                <!-- 公式渲染样式 -->
                <div class="flex flex-col md:col-span-3">
                    <label class="text-gray-700 mb-1 text-sm font-medium">渲染样式：</label>
                    <select id="renderStyle" class="border border-gray-300 rounded-md px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-primary/50 max-w-[160px] sm:max-w-full md:max-w-[160px]">
                        <option value="display">块级公式（居中大号）</option>
                        <option value="inline">行内公式（常规大小）</option>
                    </select>
                </div>

                <!-- 公式字体大小 -->
                <div class="flex flex-col md:col-span-2">
                    <label class="text-gray-700 mb-1 text-sm font-medium">字体大小：</label>
                    <input type="number" id="fontSize" value="24" min="12" max="48"
                           class="border border-gray-300 rounded-md px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-primary/50 max-w-[70px] sm:max-w-[80px] md:max-w-[70px]">
                </div>

                <!-- 公式颜色 -->
                <div class="flex flex-col md:col-span-2">
                    <label class="text-gray-700 mb-1 text-sm font-medium">公式颜色：</label>
                    <input type="color" id="formulaColor" value="#000000"
                           class="border border-gray-300 rounded-md px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-primary/50 max-w-[70px] sm:max-w-[80px] md:max-w-[70px]">
                </div>

                <!-- 背景样式 -->
                <div class="flex flex-col md:col-span-3">
    <label class="text-gray-700 mb-1 text-sm font-medium">预览背景：</label>
    <input type="color" id="bgStyle" value="#ffffff"
           class="border border-gray-300 rounded-md px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-primary/50 max-w-[160px] sm:max-w-full md:max-w-[160px] h-9 cursor-pointer">
</div>

                <!-- 自动转换 -->
                <div class="flex flex-col md:col-span-2">
                    <label class="text-gray-700 mb-1 text-sm font-medium">自动转换：</label>
                    <label class="flex items-center cursor-pointer whitespace-nowrap">
                        <input type="checkbox" id="autoConvert" checked class="mr-1 accent-primary">
                        <span>输入即转换</span>
                    </label>
                </div>
            </div>
        </section>

        <!-- 核心区域：隐藏LaTeX输出框，保留输入区+常用符号区并占满宽度 -->
        <section class="mb-3">
            <!-- 输出区（隐藏，仅保留功能） -->
            <div class="hidden">
                <textarea id="outputFormula" rows="8"
                          class="w-full border border-gray-300 rounded-md p-3 font-mono text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-primary/50"></textarea>
            </div>

            <!-- 输入区 + 常用符号列表 - 占满宽度 -->
            <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
                <!-- 输入区（键盘式公式） -->
                <div class="card md:col-span-7 lg:col-span-8">
                    <h3 class="text-lg font-medium text-gray-800 mb-2">输入简易数学公式：</h3>
                    <div class="mb-2 flex flex-wrap gap-2">
                        <span class="text-xs text-gray-500">注意：大括号可以在符号内使用多个合起来的值，比如a^{b+c}表示a的b+c次方。  如果需要使用大括号，可以使用\{\}</span>
                    </div>
                    <textarea id="inputFormula" rows="8"
                              class="w-full border border-gray-300 rounded-md p-3 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-primary/50">
\{a^{2+n}\}frac(3,4) ∫(0 to ∞) e^{-x}sqrt(3^{2^{3}})
→{x}vmatrix(1 2;3 4)lim(x→1)
支持输入常用符号库里的中文
                    </textarea>
                </div>

                <!-- 常用符号列表（可滚动） -->
                <div class="card md:col-span-5 lg:col-span-4">
                    <h3 class="text-lg font-medium text-gray-800 mb-2 flex items-center">
                        <i class="fa fa-book mr-2 text-primary"></i>常用符号库
                    </h3>
                    <div id="commonSymbolsList" class="max-h-[220px] overflow-y-auto pr-1">
                        <!-- 常用符号项会通过JS动态生成 -->
                    </div>
                </div>
            </div>
        </section>

        <!-- 按钮区 -->
        <section class="flex flex-wrap gap-4 mb-3">
            <button id="convertBtn" class="btn-hover bg-primary text-white px-6 py-2 rounded-md flex items-center">
                <i class="fa fa-exchange mr-2"></i>转换为标准格式
            </button>
            <button id="copyBtn" class="btn-hover bg-green-600 text-white px-6 py-2 rounded-md flex items-center" style="display:None;">
                <i class="fa fa-copy mr-2"></i>复制标准公式
            </button>
            <button id="saveBtn" class="btn-hover bg-blue-600 text-white px-6 py-2 rounded-md flex items-center">
                <i class="fa fa-save mr-2"></i>保存公式为PNG
            </button>
            <button id="clearBtn" class="btn-hover bg-gray-600 text-white px-6 py-2 rounded-md flex items-center">
                <i class="fa fa-eraser mr-2"></i>清空输入输出
            </button>
        </section>

        <!-- 公式预览区 -->
        <section class="card">
            <h3 class="text-lg font-medium text-gray-800 mb-2">标准数学公式预览：</h3>
            <div id="previewContainer" class="formula-preview border border-gray-200 rounded-md">
                <div id="formulaPreview"></div>
            </div>
        </section>
    </div>

        <script>
        // ===================== 全局变量 =====================
        let autoConvertTimer = null;
        // 中文关键词转模板映射（关键词: {template: 模板, cursorPos: 光标位置索引}）
        const chineseToTemplate = {

            '二重积分': { template: '∬( to ;to )', cursorPos: 2 },
            '三重积分': { template: '∭( to ;to )', cursorPos: 3 },
            '积分': { template: '∫( to )', cursorPos: 2 },
            '求和': { template: '∑( to )', cursorPos: 2 },
            '累加': { template: '∑( to )', cursorPos: 2 },
            '极限': { template: 'lim(→)', cursorPos: 4 },
            '偏导': { template: '∂/∂', cursorPos: 1 },
            '梯度': { template: '∇', cursorPos: 1 },
            '散度': { template: '∇·', cursorPos: 2 },
            '旋度': { template: '∇×', cursorPos: 2 },

            '开方': { template: 'sqrt(,)', cursorPos: 5 },
            '上标': { template: '^{}', cursorPos: 2 },
            '的平方': { template: '^2', cursorPos: 2 },

            '减去': { template: '-', cursorPos: 1 },
            '除与': { template: '/', cursorPos: 1 },
            '减': { template: '-', cursorPos: 1 },
            '下标': { template: '_{}', cursorPos: 1 },
            '乘积': { template: '∏( to )', cursorPos: 2 },
            '积乘': { template: '∏( to )', cursorPos: 2 },
            '矩阵': { template: 'matrix(;)', cursorPos: 7 },
            '行列式': { template: 'vmatrix(;)', cursorPos: 8 },
            '范数': { template: '|| ||', cursorPos: 2 },
            '求和符号': { template: '∑( to )', cursorPos: 2 },
            '积分符号': { template: '∫( to )', cursorPos: 2 },
            '无穷大': { template: '∞', cursorPos: 1 },
            '正无穷': { template: '∞', cursorPos: 1 },
            '负无穷': { template: '-∞', cursorPos: 2 },
            '圆周率': { template: 'π', cursorPos: 1 },
            'pai': { template: 'π', cursorPos: 1 },
            '西塔': { template: 'θ', cursorPos: 1 },
            '阿尔法': { template: 'α', cursorPos: 1 },
            '贝塔': { template: 'β', cursorPos: 1 },
            '伽马': { template: 'γ', cursorPos: 1 },
            '正负号': { template: '±', cursorPos: 1 },
            '不等于': { template: '≠', cursorPos: 1 },
            '大于等于': { template: '≥', cursorPos: 1 },
            '小于等于': { template: '≤', cursorPos: 1 },
            '度': { template: '°', cursorPos: 1 },
            '向量': { template: '→{}', cursorPos: 2 },
            '乘与': { template: '×', cursorPos: 1 },
            // 新增中文映射
            '反正弦': { template: 'arcsin()', cursorPos: 7 },
            '反正弦': { template: 'arcsin()', cursorPos: 7 },
            '反余弦': { template: 'arccos()', cursorPos: 7 },
            '反余弦': { template: 'arccos()', cursorPos: 7 },
            '反正切': { template: 'arctan()', cursorPos: 7 },

            '双曲正切': { template: 'tanh()', cursorPos: 5 },
            '绝对值符号': { template: '||', cursorPos: 1 },
            '绝对值': { template: '||', cursorPos: 1 },

            '对数底数2': { template: 'log2()', cursorPos: 5 },
            '垂直': { template: '⊥', cursorPos: 1 },
            '平行': { template: '∥', cursorPos: 1 },
            '角': { template: '∠', cursorPos: 1 },
            '三角形': { template: '△', cursorPos: 1 },
            '正方形': { template: '□', cursorPos: 1 },

            '派': { template: 'π', cursorPos: 1 },
            '柔': { template: 'ρ', cursorPos: 1 },

            '斐': { template: 'φ', cursorPos: 1 },
            '普赛': { template: 'ψ', cursorPos: 1 },
            '欧米伽': { template: 'ω', cursorPos: 1 }
        };

        // 常用符号库（名称 + 简易语法 + LaTeX语法 + 说明）- 按常用程度排序
        const commonSymbols = [
            // 最常用基础运算
            { name: "分数", simple: "frac(分子,分母)", latex: "\\frac{分子}{分母}", desc: "分数，如frac(1,2) → \\frac{1}{2}" },
            { name: "根号", simple: "sqrt(次方数,开方数)", latex: "\\sqrt{内容}", desc: "平方根，如sqrt(2) → \\sqrt{2}" },
            { name: "积分", simple: "∫(a to b)", latex: "\\int_{a}^{b}", desc: "定积分，如∫(0 to ∞) → \\int_{0}^{∞}" },

            { name: "乘积", simple: "∏(a to b)", latex: "\\prod_{a}^{b}", desc: "乘积，如∏(k=1 to n) → \\prod_{k=1}^{n}" },

            // 常用符号
            { name: "不等于", simple: "≠", latex: "\\neq", desc: "不等于，如a≠b → a\\neq b" },
            { name: "正负号", simple: "±", latex: "\\pm", desc: "正负号，± → \\pm" },
            { name: "大于等于", simple: "≥", latex: "\\geq", desc: "大于等于，≥ → \\geq" },
            { name: "小于等于", simple: "≤", latex: "\\leq", desc: "小于等于，≤ → \\leq" },
            { name: "无穷大", simple: "∞", latex: "\\infty", desc: "无穷大，∞ → \\infty" },
            { name: "度", simple: "°", latex: "^\\circ", desc: "角度符号，30° → 30^\\circ" },
            { name: "向量", simple: "→{}", latex: "\\vec{a}", desc: "向量，如→a → \\vec{a}" },

            // 微积分相关
            { name: "偏导", simple: "∂", latex: "\\partial", desc: "偏导数，如∂f/∂x → \\partial f/\\partial x" },
            { name: "微分", simple: "d", latex: "\\mathrm{d}", desc: "微分，如dx → \\mathrm{d}x" },
            { name: "梯度", simple: "∇", latex: "\\nabla", desc: "梯度，∇f → \\nabla f" },
            { name: "散度", simple: "∇·", latex: "\\nabla·", desc: "散度，∇·v → \\nabla·v" },
            { name: "旋度", simple: "∇×", latex: "\\nabla×", desc: "旋度，∇×v → \\nabla×v" },
            { name: "二重积分", simple: "∬(a to b; c to d)", latex: "\\iint_{a}^{b}_{c}^{d}", desc: "二重积分，如∬(0 to 1;0 to 1) → \\iint_{0}^{1}_{0}^{1}" },
            { name: "三重积分", simple: "∭(a to b; c to d; e to f)", latex: "\\iiint_{a}^{b}_{c}^{d}_{e}^{f}", desc: "三重积分，如∭(0 to 1;0 to 1;0 to 1) → \\iiint_{0}^{1}_{0}^{1}_{0}^{1}" },

            // 希腊字母（常用）
            { name: "圆周率", simple: "π", latex: "\\pi", desc: "圆周率符号，π → \\pi" },
            { name: "西塔", simple: "θ", latex: "\\theta", desc: "希腊字母θ，θ → \\theta" },
            { name: "阿尔法", simple: "α", latex: "\\alpha", desc: "希腊字母α，α → \\alpha" },
            { name: "贝塔", simple: "β", latex: "\\beta", desc: "希腊字母β，β → \\beta" },
            { name: "伽马", simple: "γ", latex: "\\gamma", desc: "希腊字母γ，γ → \\gamma" },

            { name: "伊普西龙", simple: "ε", latex: "\\epsilon", desc: "希腊字母ε，ε → \\epsilon" },
            { name: "西格玛", simple: "σ", latex: "\\sigma", desc: "希腊字母σ，σ → \\sigma" },
            { name: "缪", simple: "μ", latex: "\\mu", desc: "希腊字母μ，μ → \\mu" },

            { name: "陶", simple: "τ", latex: "\\tau", desc: "希腊字母τ，τ → \\tau" },

            { name: "普赛", simple: "ψ", latex: "\\psi", desc: "希腊字母ψ，ψ → \\psi" },
            { name: "欧米伽", simple: "ω", latex: "\\omega", desc: "希腊字母ω，ω → \\omega" },

            { name: "自然对数", simple: "ln(x)", latex: "\\ln(x)", desc: "自然对数，ln(x) → \\ln(x)" },
            { name: "以10为底对数", simple: "log10(x)", latex: "\\log_{10}(x)", desc: "以10为底对数，log10(x) → \\log_{10}(x)" },
            { name: "以2为底对数", simple: "log2(x)", latex: "\\log_{2}(x)", desc: "以2为底对数，log2(x) → \\log_{2}(x)" },

            // 集合符号
            { name: "绝对值", simple: "|x|", latex: "\\vert x \\vert", desc: "绝对值，|x| → \\vert x \\vert" },
            { name: "空集", simple: "∅", latex: "\\emptyset", desc: "空集符号，∅ → \\emptyset" },
            { name: "交集", simple: "∩", latex: "\\cap", desc: "交集符号，A∩B → A\\cap B" },
            { name: "并集", simple: "∪", latex: "\\cup", desc: "并集符号，A∪B → A\\cup B" },
            { name: "属于", simple: "∈", latex: "\\in", desc: "属于符号，x∈A → x\\in A" },
            { name: "不属于", simple: "∉", latex: "\\notin", desc: "不属于符号，x∉A → x\\notin A" },
            { name: "包含", simple: "⊂", latex: "\\subset", desc: "包含符号，A⊂B → A\\subset B" },
            { name: "包含于", simple: "⊃", latex: "\\supset", desc: "包含于符号，A⊃B → A\\supset B" },

            // 逻辑与几何符号
            { name: "因为", simple: "∵", latex: "\\because", desc: "因为符号，∵ → \\because" },
            { name: "所以", simple: "∴", latex: "\\therefore", desc: "所以符号，∴ → \\therefore" },
            { name: "约等于", simple: "≈", latex: "\\approx", desc: "约等于符号，≈ → \\approx" },
            { name: "正比于", simple: "∝", latex: "\\propto", desc: "正比于符号，∝ → \\propto" },
            { name: "全等", simple: "≌", latex: "\\cong", desc: "全等符号，△ABC≌△DEF → \\triangle ABC \\cong \\triangle DEF" },
            { name: "相似", simple: "∽", latex: "\\sim", desc: "相似符号，△ABC∽△DEF → \\triangle ABC \\sim \\triangle DEF" },
            { name: "垂直", simple: "⊥", latex: "\\perp", desc: "垂直符号，AB⊥CD → AB \\perp CD" },
            { name: "平行", simple: "∥", latex: "\\parallel", desc: "平行符号，AB∥CD → AB \\parallel CD" },
            { name: "角", simple: "∠", latex: "\\angle", desc: "角符号，∠ABC → \\angle ABC" },
            { name: "三角形", simple: "△", latex: "\\triangle", desc: "三角形符号，△ABC → \\triangle ABC" },
            { name: "无穷小", simple: "ο", latex: "\\omicron", desc: "无穷小符号，ο(1) → \\omicron(1)" }
        ];

        // ===================== 配置初始化 =====================
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化常用符号列表
            renderCommonSymbols();
            // 初始化转换
            convertFormula();
            // 绑定事件
            bindEvents();
        });

        // ===================== 事件绑定 =====================
        function bindEvents() {
            // 转换按钮
            document.getElementById('convertBtn').addEventListener('click', convertFormula);

            // 复制按钮
            document.getElementById('copyBtn').addEventListener('click', copyFormula);

            // 保存按钮
            document.getElementById('saveBtn').addEventListener('click', saveFormulaAsImage);

            // 清空按钮
            document.getElementById('clearBtn').addEventListener('click', clearAll);

            // 输入框事件（处理中文转模板、*转×）
            document.getElementById('inputFormula').addEventListener('input', handleInputConversion);

            document.getElementById('bgStyle').addEventListener('change', updatePreviewStyle);
            ['renderStyle', 'fontSize', 'formulaColor'].forEach(id => {
                document.getElementById(id).addEventListener('change', convertFormula);
            });
        }

        // ===================== 输入框实时处理函数 =====================
        function handleInputConversion(e) {
            const input = e.target;
            const cursorPos = input.selectionStart;
            const currentValue = input.value;

            // 1. 处理*转×（乘号）
            let newValue = currentValue.replace(/\*/g, '×');

            // 2. 处理中文关键词转模板
            let newCursorPos = cursorPos;
            Object.keys(chineseToTemplate).forEach(keyword => {
                if (newValue.includes(keyword)) {
                    const templateInfo = chineseToTemplate[keyword];
                    // 计算替换后的光标位置偏移
                    const offset = templateInfo.template.length - keyword.length;
                    // 替换关键词为模板
                    newValue = newValue.replace(keyword, templateInfo.template);
                    // 调整光标位置
                    if (cursorPos > newValue.indexOf(templateInfo.template)) {
                        newCursorPos = newValue.indexOf(templateInfo.template) + templateInfo.cursorPos;
                    }
                }
            });

            // 更新输入框值和光标位置
            if (newValue !== currentValue) {
                input.value = newValue;
                // 保持光标位置
                input.selectionStart = input.selectionEnd = newCursorPos;
            }

            // 自动转换公式
            if (document.getElementById('autoConvert').checked) {
                clearTimeout(autoConvertTimer);
                autoConvertTimer = setTimeout(convertFormula, 500);
            }
        }

        // ===================== 渲染常用符号列表 =====================
        function renderCommonSymbols() {
            const listContainer = document.getElementById('commonSymbolsList');
            listContainer.innerHTML = ''; // 清空原有内容

            commonSymbols.forEach(item => {
                const symbolItem = document.createElement('div');
                symbolItem.className = 'formula-item';
                // 名称和简易语法同行
                symbolItem.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="text-primary font-medium">${item.name}</span>
                        <code class="bg-gray-100 px-1 rounded text-gray-700">${item.simple}</code>
                    </div>
                `;
                // 绑定点击事件：插入符号的简易语法到输入框光标位置
                symbolItem.addEventListener('click', () => {
                    insertFormulaToInput(item.simple);
                });
                listContainer.appendChild(symbolItem);
            });
        }

        // ===================== 插入符号到输入框光标位置 =====================
        function insertFormulaToInput(symbolText) {
            const inputTextarea = document.getElementById('inputFormula');
            const cursorPos = inputTextarea.selectionStart; // 获取光标起始位置
            const currentValue = inputTextarea.value;

            // 拼接新内容：光标前内容 + 符号文本 + 光标后内容
            const newValue =
                currentValue.substring(0, cursorPos) +
                symbolText +
                currentValue.substring(cursorPos);

            // 更新输入框内容
            inputTextarea.value = newValue;
            // 重置光标位置到插入内容的末尾
            inputTextarea.selectionStart = inputTextarea.selectionEnd = cursorPos + symbolText.length;
            // 聚焦输入框
            inputTextarea.focus();

            // 如果开启自动转换，触发转换
            if (document.getElementById('autoConvert').checked) {
                clearTimeout(autoConvertTimer);
                autoConvertTimer = setTimeout(convertFormula, 500);
            }
        }

        // ===================== 核心转换函数 =====================
        function convertFormula() {
            const input = document.getElementById('inputFormula').value.trim();
            if (!input) {
                document.getElementById('outputFormula').value = '';
                document.getElementById('formulaPreview').innerHTML = '';
                return;
            }

            // 按行转换
            const lines = input.split('\n').filter(line => line.trim());
            let latexLines = [];

            lines.forEach(line => {
                let latex = line.trim();

                // ========== 行列式修复：必须放在所有转换规则最前面 ==========
// 替换原行列式转换代码为：
// ========== 行列式修复：强制优先匹配vmatrix（无单词边界限制） ==========
latex = latex.replace(/vmatrix\(([\s\S]*?)\)/g, function(match, content) {
    // 1. 清理首尾空白（包括换行/制表符）
    const cleanContent = content.replace(/^\s+|\s+$/g, '');
    if (!cleanContent) {
        return "\\begin{vmatrix}\\end{vmatrix}";
    }
    // 2. 处理行分隔符（;）和列分隔符（空格/多个空格）
    const processedRows = cleanContent
        .split(';') // 拆分行
        .map(row => {
            // 清理每行首尾空白 + 多个空格转单个& + 过滤空列
            const cleanedRow = row.trim().replace(/\s+/g, '&');
            return cleanedRow || '&'; // 空行兜底，避免渲染异常
        })
        .filter(row => row !== '&' || cleanContent.split(';').length > 1) // 过滤全空行（但保留至少一行）
        .join('\\\\'); // 行之间用\\连接

    // 3. 返回标准行列式语法（强制加{}包裹，避免和其他符号冲突）
    return "\\begin{vmatrix}" + processedRows + "\\end{vmatrix}";
});

                // ========== 1. 中文符号名称转简易语法 ==========
                // 上标（中文）：上标2 → ^2
                latex = latex.replace(/上标([^ \\+\\-\\=\\×\\/\\(\\)])/g, '^$1');
                // 下标（中文）：下标1 → _1
                latex = latex.replace(/下标([^ \\+\\-\\=\\×\\/\\(\\)])/g, '_$1');
                // 分数（中文）：分数(1,2) → frac(1,2)
                latex = latex.replace(/分数\(([^,]+),([^)]+)\)/g, 'frac($1,$2)');
                // 根号（中文）：根号2 → sqrt(2)
                // 1. 普通根号：sqrt(x) → \sqrt{x}
latex = latex.replace(/sqrt\(([^),]+?)\)/g, '\\sqrt{$1}');
// 2. n次方根：sqrt(n,x) → \sqrt[n]{x}
latex = latex.replace(/sqrt\((.+?),(.+?)\)/g, '\\sqrt[$1]{$2}');
                // 正弦（中文）：正弦(θ) → sin(θ)
                latex = latex.replace(/正弦\(([^)]+)\)/g, 'sin($1)');
                // 余弦（中文）：余弦(θ) → cos(θ)
                latex = latex.replace(/余弦\(([^)]+)\)/g, 'cos($1)');
                // 正切（中文）：正切(θ) → tan(θ)
                latex = latex.replace(/正切\(([^)]+)\)/g, 'tan($1)');
                // 反三角函数中文转换
                latex = latex.replace(/反正弦\(([^)]+)\)/g, 'arcsin($1)');
                latex = latex.replace(/反余弦\(([^)]+)\)/g, 'arccos($1)');
                latex = latex.replace(/反正切\(([^)]+)\)/g, 'arctan($1)');
                // 双曲函数中文转换
                latex = latex.replace(/双曲正弦\(([^)]+)\)/g, 'sinh($1)');
                latex = latex.replace(/双曲余弦\(([^)]+)\)/g, 'cosh($1)');
                latex = latex.replace(/双曲正切\(([^)]+)\)/g, 'tanh($1)');
                // 希腊字母中文转符号
                latex = latex.replace(/西塔/g, 'θ');
                latex = latex.replace(/阿尔法/g, 'α');
                latex = latex.replace(/贝塔/g, 'β');
                latex = latex.replace(/伽马/g, 'γ');
                latex = latex.replace(/圆周率/g, 'π');
                latex = latex.replace(/德尔塔/g, 'δ');
                latex = latex.replace(/西格玛/g, 'σ');
                latex = latex.replace(/缪/g, 'μ');
                latex = latex.replace(/柔/g, 'ρ');
                latex = latex.replace(/陶/g, 'τ');
                latex = latex.replace(/宇普西龙/g, 'ε');
                latex = latex.replace(/斐/g, 'φ');
                latex = latex.replace(/普赛/g, 'ψ');
                latex = latex.replace(/欧米伽/g, 'ω');
                // 集合符号中文转换
                latex = latex.replace(/绝对值\(([^)]+)\)/g, '|$1|');
                latex = latex.replace(/空集/g, '∅');
                latex = latex.replace(/交集/g, '∩');
                latex = latex.replace(/并集/g, '∪');
                latex = latex.replace(/属于/g, '∈');
                latex = latex.replace(/不属于/g, '∉');
                latex = latex.replace(/包含/g, '⊂');
                latex = latex.replace(/包含于/g, '⊃');
                // 其他中文符号转换
                latex = latex.replace(/因为/g, '∵');
                latex = latex.replace(/所以/g, '∴');
                latex = latex.replace(/约等于/g, '≈');
                latex = latex.replace(/正比于/g, '∝');
                latex = latex.replace(/全等/g, '≌');
                latex = latex.replace(/相似/g, '∽');
                latex = latex.replace(/无穷小/g, 'ο');
                latex = latex.replace(/垂直/g, '⊥');
                latex = latex.replace(/平行/g, '∥');
                latex = latex.replace(/角/g, '∠');
                latex = latex.replace(/三角形/g, '△');
                latex = latex.replace(/正方形/g, '□');

                // ========== 2. 1/2 形式转 frac(1,2) ==========
                // 匹配 数字/数字 形式（避免和路径等冲突，仅匹配纯数字）
                latex = latex.replace(/(\d+)\/(\d+)/g, 'frac($1,$2)');
                // 匹配 表达式/表达式 形式（带括号的）
                latex = latex.replace(/\(([^)]+)\)\/\(([^)]+)\)/g, 'frac($1,$2)');

                // ========== 3. ×转LaTeX乘号 ==========
                latex = latex.replace(/×/g, '\\times');

                // ========== 4. 简易语法 → LaTeX语法 ==========
                // 分数：frac(分子,分母) → \frac{分子}{分母}
                latex = latex.replace(/frac\(([^,]+),([^)]+)\)/g, '\\frac{$1}{$2}');

                // 根号：sqrt(内容) → \sqrt{内容}
                latex = latex.replace(/sqrt\(([^)]+)\)/g, '\\sqrt{$1}');

                // ========== 新增：矩阵转换 ==========
                // matrix(1 2;3 4) → 标准LaTeX矩阵（空格→&，分号→\\）
latex = latex.replace(/matrix\(([\s\S]*?)\)/g, function(match, content) {
    const clean = content.trim().split(';').map(row=>row.trim().replace(/\s+/g,'&')).filter(row=>row).join('\\\\');
    return "\\begin{bmatrix}"+clean+"\\end{bmatrix}";
});



                // 上下标增强（处理连续字符）
                // 上标：^后接数字/字母自动加{}，支持多字符如^2x → ^{2}x
                latex = latex.replace(/\^([^ \\+\\-\\=\\×\\/\\(\\)])/g, '^{$1}');
                // 下标：_后接数字/字母自动加{}
                latex = latex.replace(/\_([^ \\+\\-\\=\\×\\/\\(\\)])/g, '_{$1}');

                // 积分：∫(a to b) → \int_{a}^{b}
                latex = latex.replace(/∫\(([^ ]+) to ([^)]+)\)/g, '\\int_{$1}^{$2}');
                latex = latex.replace(/int\(([^ ]+) to ([^)]+)\)/g, '\\int_{$1}^{$2}');
                // 二重积分
                latex = latex.replace(/∬\(([^ ]+) to ([^;]+); ([^ ]+) to ([^)]+)\)/g, '\\iint_{$1}^{$2}_{$3}^{$4}');
                // 三重积分
                latex = latex.replace(/∭\(([^ ]+) to ([^;]+); ([^ ]+) to ([^;]+); ([^ ]+) to ([^)]+)\)/g, '\\iiint_{$1}^{$2}_{$3}^{$4}_{$5}^{$6}');

                // 求和：∑(a to b) → \sum_{a}^{b}
                latex = latex.replace(/∑\(([^ ]+) to ([^)]+)\)/g, '\\sum_{$1}^{$2}');
                latex = latex.replace(/sum\(([^ ]+) to ([^)]+)\)/g, '\\sum_{$1}^{$2}');

                // 乘积：∏(a to b) → \prod_{a}^{b}
                latex = latex.replace(/∏\(([^ ]+) to ([^)]+)\)/g, '\\prod_{$1}^{$2}');
                latex = latex.replace(/prod\(([^ ]+) to ([^)]+)\)/g, '\\prod_{$1}^{$2}');

                // 极限：lim(x→a) → \lim_{x \to a}
                latex = latex.replace(/lim\((.+?)→(.+?)\)/g, '\\lim_{$1 \\to $2}');

                // 梯度、散度、旋度
                latex = latex.replace(/∇/g, '\\nabla');
                latex = latex.replace(/∇·/g, '\\nabla·');
                latex = latex.replace(/∇×/g, '\\nabla×');

                // 常用函数自动加反斜杠
                const functions = [
                    'sin', 'cos', 'tan', 'cot', 'sec', 'csc',
                    'arcsin', 'arccos', 'arctan', 'arccot',
                    'sinh', 'cosh', 'tanh',
                    'log', 'ln', 'log10', 'log2', 'exp', 'lim', 'sum', 'prod'
                ];
                functions.forEach(func => {
                    latex = latex.replace(new RegExp(`(?<!\\\\)${func}(?=\\()`, 'g'), `\\${func}`);
                });

                // 希腊字母简易转换
                latex = latex.replace(/θ/g, '\\theta');
                latex = latex.replace(/π/g, '\\pi');
                latex = latex.replace(/α/g, '\\alpha');
                latex = latex.replace(/β/g, '\\beta');
                latex = latex.replace(/γ/g, '\\gamma');
                latex = latex.replace(/δ/g, '\\delta');
                latex = latex.replace(/ε/g, '\\epsilon');
                latex = latex.replace(/σ/g, '\\sigma');
                latex = latex.replace(/μ/g, '\\mu');
                latex = latex.replace(/ρ/g, '\\rho');
                latex = latex.replace(/τ/g, '\\tau');
                latex = latex.replace(/φ/g, '\\phi');
                latex = latex.replace(/ψ/g, '\\psi');
                latex = latex.replace(/ω/g, '\\omega');
                latex = latex.replace(/Σ/g, '\\Sigma');
                latex = latex.replace(/Π/g, '\\Pi');
                latex = latex.replace(/Γ/g, '\\Gamma');

                // 其他符号转换
                latex = latex.replace(/∞/g, '\\infty');
                latex = latex.replace(/∂/g, '\\partial');
                latex = latex.replace(/±/g, '\\pm');
                latex = latex.replace(/≠/g, '\\neq');
                latex = latex.replace(/≥/g, '\\geq');
                latex = latex.replace(/≤/g, '\\leq');
                latex = latex.replace(/°/g, '^\\circ');
                latex = latex.replace(/%/g, '\\%');
                latex = latex.replace(/→/g, '\\vec');
                latex = latex.replace(/∅/g, '\\emptyset');
                latex = latex.replace(/∩/g, '\\cap');
                latex = latex.replace(/∪/g, '\\cup');
                latex = latex.replace(/∈/g, '\\in');
                latex = latex.replace(/∉/g, '\\notin');
                latex = latex.replace(/⊂/g, '\\subset');
                latex = latex.replace(/⊃/g, '\\supset');
                latex = latex.replace(/∵/g, '\\because');
                latex = latex.replace(/∴/g, '\\therefore');
                latex = latex.replace(/≈/g, '\\approx');
                latex = latex.replace(/∝/g, '\\propto');
                latex = latex.replace(/≌/g, '\\cong');
                latex = latex.replace(/∽/g, '\\sim');
                latex = latex.replace(/⊥/g, '\\perp');
                latex = latex.replace(/∥/g, '\\parallel');
                latex = latex.replace(/∠/g, '\\angle');
                latex = latex.replace(/△/g, '\\triangle');
                latex = latex.replace(/□/g, '\\square');
                latex = latex.replace(/ο/g, '\\omicron');
                latex = latex.replace(/\|/g, '\\vert'); // 绝对值竖线转换


                latexLines.push(latex);
            });

            // 生成输出内容（隐藏的textarea仍会填充）
            const renderStyle = document.getElementById('renderStyle').value;
            const latexOutput = latexLines.join('\n');
            document.getElementById('outputFormula').value = latexOutput;

            // 生成预览内容
            let previewContent = '';
            latexLines.forEach(line => {
                if (renderStyle === 'display') {
                    previewContent += `\\[ ${line} \\]`;
                } else {
                    previewContent += `\\( ${line} \\) `;
                }
            });

            document.getElementById('formulaPreview').innerHTML = previewContent;

            const formulaPreview = document.getElementById('formulaPreview');
            const previewContainer = document.getElementById('previewContainer');
            const fontSize = document.getElementById('fontSize').value + 'px';
            const formulaColor = document.getElementById('formulaColor').value;
            const bgColor = document.getElementById('bgStyle').value;

            formulaPreview.style.color = formulaColor;
            formulaPreview.style.fontSize = fontSize;
            previewContainer.style.backgroundColor = bgColor;

            MathJax.typesetPromise([formulaPreview])
                .catch(err => console.error('MathJax渲染失败:', err));
        }



        // ===================== 样式更新 =====================
        function updatePreviewStyle() {
            const previewContainer = document.getElementById('previewContainer');
            const bgColor = document.getElementById('bgStyle').value;
            previewContainer.style.backgroundColor = bgColor;
        }

        // ===================== 复制公式 =====================
        function copyFormula() {
            const output = document.getElementById('outputFormula');
            output.select();
            document.execCommand('copy');

            // 提示复制成功
            const originalText = document.getElementById('copyBtn').innerHTML;
            document.getElementById('copyBtn').innerHTML = '<i class="fa fa-check mr-2"></i>复制成功';
            setTimeout(() => {
                document.getElementById('copyBtn').innerHTML = originalText;
            }, 2000);
        }

        // ===================== 保存为图片 =====================
        function saveFormulaAsImage() {
            const previewContainer = document.getElementById('previewContainer');

            // 临时调整样式确保截图效果
            const originalStyle = {
                backgroundColor: previewContainer.style.backgroundColor,
                padding: previewContainer.style.padding
            };

            // 如果是透明背景，临时设置为白色
            if (previewContainer.style.backgroundColor === 'transparent') {
                previewContainer.style.backgroundColor = '#ffffff';
            }

            // 增加内边距
            previewContainer.style.padding = '20px';

            // 使用html2canvas截图
            html2canvas(previewContainer, {
                backgroundColor: previewContainer.style.backgroundColor === 'transparent' ? null : previewContainer.style.backgroundColor,
                scale: 2, // 2倍分辨率
                logging: false
            }).then(canvas => {
                // 恢复原始样式
                previewContainer.style.backgroundColor = originalStyle.backgroundColor;
                previewContainer.style.padding = originalStyle.padding;

                // 下载图片
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                link.download = '数学公式_' + new Date().getTime() + '.png';
                link.click();
            });
        }

        // ===================== 清空所有内容 =====================
        function clearAll() {
            document.getElementById('inputFormula').value = '';
            document.getElementById('outputFormula').value = '';
            document.getElementById('formulaPreview').innerHTML = '';
        }
    </script>
</body>
</html>
