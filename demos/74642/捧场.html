<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>捧场王 - 你的专属气氛组</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1rem;
            opacity: 0.9;
            margin-top: 5px;
        }

        .main-display {
            flex: 1;
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ccc;
            transition: all 0.3s ease;
        }

        .status-dot.active {
            background: #4CAF50;
            box-shadow: 0 0 10px #4CAF50;
            animation: pulse 1.5s infinite;
        }

        .status-dot.listening {
            background: #FF9800;
            box-shadow: 0 0 10px #FF9800;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .scene-badge {
            padding: 5px 15px;
            background: #E3F2FD;
            color: #1976D2;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .transcript-area {
            flex: 1;
            background: #f8f9fa;
            border-radius: 15px;
            padding: 15px;
            overflow-y: auto;
            font-size: 1.1rem;
            line-height: 1.6;
            color: #333;
            position: relative;
        }

        .transcript-area .placeholder {
            color: #999;
            font-style: italic;
        }

        .transcript-line {
            margin-bottom: 8px;
            padding: 5px;
            border-radius: 8px;
            transition: background 0.3s ease;
        }

        .transcript-line.highlight {
            background: #FFF3E0;
            animation: highlight 0.5s ease;
        }

        @keyframes highlight {
            0% { background: #FFEB3B; }
            100% { background: #FFF3E0; }
        }

        .emoji-reaction {
            font-size: 1.5rem;
            animation: bounce 0.5s ease;
            display: inline-block;
            margin-right: 10px;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }

        .control-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .control-btn.start {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
        }

        .control-btn.start:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(76, 175, 80, 0.4);
        }

        .control-btn.stop {
            background: linear-gradient(135deg, #f44336, #d32f2f);
            color: white;
        }

        .control-btn.stop:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(244, 67, 54, 0.4);
        }

        .sound-effects {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .sound-btn {
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: rgba(255,255,255,0.8);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .sound-btn:hover {
            background: rgba(255,255,255,1);
            transform: scale(1.1);
        }

        .sound-btn.active {
            background: #FFECB3;
            box-shadow: 0 0 15px rgba(255, 193, 7, 0.5);
            animation: glow 1s infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 15px rgba(255, 193, 7, 0.5); }
            50% { box-shadow: 0 0 25px rgba(255, 193, 7, 0.8); }
        }

        .sound-btn span {
            font-size: 0.7rem;
            color: #666;
        }

        .music-panel {
            margin-top: 15px;
            background: rgba(255,255,255,0.8);
            border-radius: 15px;
            padding: 15px;
        }

        .music-panel h3 {
            font-size: 1rem;
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .music-selector {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .music-option {
            padding: 10px 15px;
            border: 2px solid transparent;
            border-radius: 10px;
            background: #f0f0f0;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .music-option:hover {
            background: #e0e0e0;
        }

        .music-option.active {
            border-color: #667eea;
            background: #E3F2FD;
            color: #1976D2;
        }

        .music-player {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .music-player button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: #667eea;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .music-player button:hover {
            background: #5a6fd6;
        }

        .music-player .progress {
            flex: 1;
            height: 4px;
            background: #ddd;
            border-radius: 2px;
            overflow: hidden;
        }

        .music-player .progress-bar {
            height: 100%;
            background: #667eea;
            width: 0%;
            transition: width 0.3s ease;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }

        .volume-control input[type="range"] {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            background: #ddd;
            border-radius: 3px;
        }

        .volume-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #667eea;
            border-radius: 50%;
            cursor: pointer;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            padding: 10px;
            background: rgba(255,255,255,0.8);
            border-radius: 10px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #666;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 0.9rem;
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(0);
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .controls {
                flex-direction: column;
            }

            .sound-effects {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>🎉 捧场王 🎉</h1>
            <p>你的专属AI气氛组，让每一次演讲都精彩</p>
        </div>

        <div class="main-display">
            <div class="status-bar">
                <div class="status-indicator">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">准备就绪</span>
                </div>
                <div class="scene-badge" id="sceneBadge">🎯 通用模式</div>
            </div>

            <div class="transcript-area" id="transcriptArea">
                <div class="placeholder">点击下方按钮开始录音，我会实时分析你的讲话并自动捧场！</div>
            </div>

            <div class="controls">
                <button class="control-btn start" id="startBtn">
                    🎤 开始捧场
                </button>
                <button class="control-btn stop" id="stopBtn" disabled>
                    ⏹️ 停止
                </button>
            </div>

            <div class="sound-effects">
                <button class="sound-btn" id="btnClap" onclick="playSound('clap')">
                    👏
                    <span>掌声</span>
                </button>
                <button class="sound-btn" id="btnLaugh" onclick="playSound('laugh')">
                    😂
                    <span>笑声</span>
                </button>
                <button class="sound-btn" id="btnCheer" onclick="playSound('cheer')">
                    🎉
                    <span>欢呼</span>
                </button>
                <button class="sound-btn" id="btnWow" onclick="playSound('wow')">
                    😲
                    <span>惊叹</span>
                </button>
                <button class="sound-btn" id="btnMusic" onclick="toggleMusic()">
                    🎵
                    <span>BGM</span>
                </button>
                <button class="sound-btn" id="btnHeart" onclick="playSound('heart')">
                    ❤️
                    <span>爱心</span>
                </button>
                <button class="sound-btn" id="btnApplause" onclick="playSound('applause')">
                    👏👏
                    <span>热烈</span>
                </button>
                <button class="sound-btn" id="btnDrum" onclick="playSound('drum')">
                    🥁
                    <span>鼓点</span>
                </button>
            </div>

            <div class="music-panel">
                <h3>🎶 氛围音乐</h3>
                <div class="music-selector">
                    <div class="music-option active" onclick="selectMusic('cheerful')">欢快</div>
                    <div class="music-option" onclick="selectMusic('epic')">激昂</div>
                    <div class="music-option" onclick="selectMusic('elegant')">优雅</div>
                    <div class="music-option" onclick="selectMusic('inspirational')">励志</div>
                    <div class="music-option" onclick="selectMusic('funny')">搞笑</div>
                </div>
                <div class="music-player">
                    <button id="musicPlayBtn" onclick="toggleMusic()">▶️</button>
                    <div class="progress">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                </div>
            </div>

            <div class="volume-control">
                <span>🔊</span>
                <input type="range" id="volumeSlider" min="0" max="100" value="70" onchange="setVolume(this.value)">
                <span id="volumeValue">70%</span>
            </div>

            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-value" id="statWords">0</div>
                    <div class="stat-label">识别字数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statReactions">0</div>
                    <div class="stat-label">捧场次数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statLaughs">0</div>
                    <div class="stat-label">笑点触发</div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const transcriptArea = document.getElementById('transcriptArea');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const sceneBadge = document.getElementById('sceneBadge');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeValue = document.getElementById('volumeValue');
        const toast = document.getElementById('toast');

        const statWords = document.getElementById('statWords');
        const statReactions = document.getElementById('statReactions');
        const statLaughs = document.getElementById('statLaughs');

        let recognition = null;
        let isListening = false;
        let audioContext = null;
        let currentMusic = null;
        let currentMusicType = 'cheerful';
        let musicPlaying = false;
        let volume = 0.7;

        let totalWords = 0;
        let totalReactions = 0;
        let totalLaughs = 0;

        const laughKeywords = ['哈哈', '好笑', '有趣', '笑死', '逗', '幽默', '玩笑', '笑话', '搞笑', '滑稽', '开心', '快乐', '太棒了', '太好了', '厉害', '牛', '绝了'];
        const cheerKeywords = ['谢谢', '感谢', '感恩', '掌声', '欢呼', '加油', '鼓励', '支持', '胜利', '成功', '完成', '结束'];
        const wowKeywords = ['哇', '哦', '天呐', '天哪', '竟然', '真的吗', '不可思议', '难以置信', '太神奇', '震惊'];
        const heartKeywords = ['爱', '喜欢', '感动', '温暖', '幸福', '美好', '甜蜜', '温馨'];

        const soundUrls = {
            clap: 'https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3',
            laugh: 'https://assets.mixkit.co/active_storage/sfx/2569/2569-preview.mp3',
            cheer: 'https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3',
            wow: 'https://assets.mixkit.co/active_storage/sfx/1436/1436-preview.mp3',
            heart: 'https://assets.mixkit.co/active_storage/sfx/2570/2570-preview.mp3',
            applause: 'https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3',
            drum: 'https://assets.mixkit.co/active_storage/sfx/2572/2572-preview.mp3'
        };

        const musicUrls = {
            cheerful: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3',
            epic: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3',
            elegant: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3',
            inspirational: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3',
            funny: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3'
        };

        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            initAudioContext();
            const url = soundUrls[type];
            if (!url) return;

            fetch(url)
                .then(response => response.arrayBuffer())
                .then(buffer => audioContext.decodeAudioData(buffer))
                .then(audioBuffer => {
                    const source = audioContext.createBufferSource();
                    const gainNode = audioContext.createGain();
                    source.buffer = audioBuffer;
                    source.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    gainNode.gain.value = volume * 0.5;
                    source.start(0);
                })
                .catch(err => console.error('播放音效失败:', err));

            highlightButton(`btn${type.charAt(0).toUpperCase() + type.slice(1)}`);
            updateStats('reactions');
        }

        function highlightButton(btnId) {
            const btn = document.getElementById(btnId);
            if (btn) {
                btn.classList.add('active');
                setTimeout(() => btn.classList.remove('active'), 500);
            }
        }

        function selectMusic(type) {
            currentMusicType = type;
            document.querySelectorAll('.music-option').forEach(opt => opt.classList.remove('active'));
            event.target.classList.add('active');
            
            if (musicPlaying) {
                stopMusic();
                setTimeout(() => playMusic(), 500);
            }
        }

        function toggleMusic() {
            if (musicPlaying) {
                stopMusic();
            } else {
                playMusic();
            }
        }

        function playMusic() {
            initAudioContext();
            if (currentMusic) {
                currentMusic.pause();
                currentMusic = null;
            }

            currentMusic = new Audio(musicUrls[currentMusicType]);
            currentMusic.volume = volume * 0.3;
            currentMusic.loop = true;
            currentMusic.play().then(() => {
                musicPlaying = true;
                document.getElementById('musicPlayBtn').textContent = '⏸️';
                document.getElementById('btnMusic').classList.add('active');
                showToast('🎵 背景音乐已开启');
            }).catch(err => {
                console.error('播放音乐失败:', err);
                showToast('音乐播放失败，请检查网络');
            });
        }

        function stopMusic() {
            if (currentMusic) {
                currentMusic.pause();
                currentMusic = null;
            }
            musicPlaying = false;
            document.getElementById('musicPlayBtn').textContent = '▶️';
            document.getElementById('btnMusic').classList.remove('active');
            showToast('🎵 背景音乐已关闭');
        }

        function setVolume(val) {
            volume = val / 100;
            volumeValue.textContent = val + '%';
            if (currentMusic) {
                currentMusic.volume = volume * 0.3;
            }
        }

        function analyzeText(text) {
            let reaction = null;
            let emoji = '';

            if (laughKeywords.some(keyword => text.includes(keyword))) {
                reaction = 'laugh';
                emoji = '😂';
                updateStats('laughs');
            } else if (cheerKeywords.some(keyword => text.includes(keyword))) {
                reaction = 'applause';
                emoji = '👏';
            } else if (wowKeywords.some(keyword => text.includes(keyword))) {
                reaction = 'wow';
                emoji = '😲';
            } else if (heartKeywords.some(keyword => text.includes(keyword))) {
                reaction = 'heart';
                emoji = '❤️';
            }

            const length = text.length;
            if (!reaction && length > 50) {
                reaction = 'clap';
                emoji = '👏';
            } else if (!reaction && length > 100) {
                reaction = 'applause';
                emoji = '👏👏';
            }

            if (reaction && Math.random() > 0.3) {
                setTimeout(() => playSound(reaction), 300);
                return emoji;
            }
            return '';
        }

        function updateStats(type) {
            switch (type) {
                case 'words':
                    totalWords++;
                    statWords.textContent = totalWords;
                    break;
                case 'reactions':
                    totalReactions++;
                    statReactions.textContent = totalReactions;
                    break;
                case 'laughs':
                    totalLaughs++;
                    statLaughs.textContent = totalLaughs;
                    break;
            }
        }

        function addTranscript(text, isFinal = false) {
            transcriptArea.innerHTML = '';
            
            const lines = text.split(/[。！？\n]/).filter(line => line.trim());
            lines.forEach(line => {
                if (!line.trim()) return;
                
                const lineDiv = document.createElement('div');
                lineDiv.className = 'transcript-line';
                
                const emoji = isFinal ? analyzeText(line) : '';
                if (emoji) {
                    lineDiv.innerHTML = `<span class="emoji-reaction">${emoji}</span>${line}`;
                    lineDiv.classList.add('highlight');
                } else {
                    lineDiv.textContent = line;
                }
                
                transcriptArea.appendChild(lineDiv);
                updateStats('words');
            });

            transcriptArea.scrollTop = transcriptArea.scrollHeight;
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function startListening() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                showToast('您的浏览器不支持语音识别功能');
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onstart = () => {
                isListening = true;
                statusDot.className = 'status-dot active listening';
                statusText.textContent = '正在聆听...';
                startBtn.disabled = true;
                stopBtn.disabled = false;
                showToast('🎤 开始录音，尽情演讲吧！');
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                const fullText = finalTranscript + interimTranscript;
                addTranscript(fullText, !!finalTranscript);
            };

            recognition.onerror = (event) => {
                console.error('语音识别错误:', event.error);
                if (event.error === 'not-allowed') {
                    showToast('请允许麦克风权限');
                } else {
                    showToast('语音识别出错: ' + event.error);
                }
                stopListening();
            };

            recognition.onend = () => {
                if (isListening) {
                    recognition.start();
                }
            };

            recognition.start();
        }

        function stopListening() {
            if (recognition) {
                recognition.stop();
                recognition = null;
            }
            isListening = false;
            statusDot.className = 'status-dot';
            statusText.textContent = '准备就绪';
            startBtn.disabled = false;
            stopBtn.disabled = true;
            showToast('⏹️ 录音已停止');
        }

        startBtn.addEventListener('click', startListening);
        stopBtn.addEventListener('click', stopListening);

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat) {
                e.preventDefault();
                if (isListening) {
                    stopListening();
                } else {
                    startListening();
                }
            }
        });

        window.addEventListener('load', () => {
            showToast('🎉 欢迎使用捧场王！');
        });
    </script>
</body>
</html>
