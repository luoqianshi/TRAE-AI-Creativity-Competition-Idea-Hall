<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>像素接宝 - Pixel Treasure Catcher</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      cursor: default
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Press Start 2P', monospace
    }

    #gameWrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center
    }

    #gameCanvas {
      display: block;
      image-rendering: pixelated;
      box-shadow: 0 0 60px rgba(0, 255, 0, 0.15), 0 0 120px rgba(0, 255, 0, 0.05);
      border: 2px solid rgba(0, 255, 0, 0.3);
      background: #000
    }
  </style>
</head>

<body>
  <div id="gameWrapper"><canvas id="gameCanvas"></canvas></div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = 800, H = 600;

    // ─── Fullscreen Scaling ──────────────────────────────────
    let scaleX = 1, scaleY = 1, scale = 1;
    function resizeCanvas() {
      const vw = window.innerWidth, vh = window.innerHeight;
      const pad = 10;
      const availW = vw - pad * 2, availH = vh - pad * 2;
      scale = Math.min(availW / W, availH / H);
      // 移除硬编码的缩放限制，支持更多设备
      const cw = Math.floor(W * scale), ch = Math.floor(H * scale);
      canvas.width = W; canvas.height = H;
      canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
      scaleX = cw / W; scaleY = ch / H;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ─── Coordinates Helper ─────────────────────────────────
    function getGameCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
      const clientY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
      return { mx: (clientX - rect.left) / scaleX, my: (clientY - rect.top) / scaleY };
    }

    // ─── Ambient Stars ────────────────────────────────────────
    let ambientStars = [];
    function initStars() {
      ambientStars = [];
      for (let i = 0; i < 60; i++) ambientStars.push({
        x: Math.random() * W, y: Math.random() * H, size: 1 + Math.floor(Math.random() * 3),
        speed: 0.1 + Math.random() * 0.3, twinkle: Math.random() * Math.PI * 2, alpha: 0.2 + Math.random() * 0.4
      });
    }
    initStars();

    // ─── Object Pooling ────────────────────────────────────────
    const pool = {
      particles: [],
      items: [],
      floatingTexts: []
    };

    function getFromPool(type) {
      return pool[type].pop() || {};
    }

    function returnToPool(type, obj) {
      if (pool[type].length < 100) pool[type].push(obj);
    }

    // ─── 8-bit Sound Engine ──────────────────────────────────
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let masterGain = null;
    let activeOscillators = 0;
    const MAX_OSCILLATORS = 8;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioCtx();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.5;
        masterGain.connect(audioCtx.destination);
      }
    }

    function playBeep(freq, dur, type = 'square', vol = 0.08) {
      if (activeOscillators >= MAX_OSCILLATORS) return;
      try {
        initAudio();
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = type;
        o.frequency.value = freq;
        g.gain.value = vol;
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g);
        g.connect(masterGain);
        o.start();
        activeOscillators++;
        o.onended = () => { activeOscillators--; };
        o.stop(audioCtx.currentTime + dur);
      } catch (e) { }
    }
    const _sfx = { catch: [587, 784], bomb: [120, 80], lvlup: [523, 659, 784, 1047], gameover: [440, 349, 262], powerup: [880, 1108, 1318], click: [440] };
    function playCatch() { if (!soundEnabled) return; playBeep(587, 0.08); setTimeout(() => playBeep(784, 0.08), 50) }
    function playBomb() { if (!soundEnabled) return; playBeep(120, 0.25, 'sawtooth', 0.12); playBeep(80, 0.3, 'sawtooth', 0.1) }
    function playLevelUp() { if (!soundEnabled) return; playBeep(523, 0.1); setTimeout(() => playBeep(659, 0.1), 100); setTimeout(() => playBeep(784, 0.1), 200); setTimeout(() => playBeep(1047, 0.2), 300) }
    function playGameOver() { if (!soundEnabled) return; playBeep(440, 0.2); setTimeout(() => playBeep(349, 0.2), 200); setTimeout(() => playBeep(262, 0.4), 400) }
    function playPowerUp() { if (!soundEnabled) return; playBeep(880, 0.1); setTimeout(() => playBeep(1108, 0.1), 80); setTimeout(() => playBeep(1318, 0.15), 160) }
    function playClick() { if (!soundEnabled) return; playBeep(440, 0.06) }
    function playAchieve() { if (!soundEnabled) return; playBeep(1047, 0.1); setTimeout(() => playBeep(1319, 0.1), 100); setTimeout(() => playBeep(1568, 0.2), 200) }
    let soundEnabled = true;
    function toggleSound() { soundEnabled = !soundEnabled; if (soundEnabled) playClick() }

    // ─── Font Helper ──────────────────────────────────────────
    function drawText(text, x, y, size, color, align = 'center') {
      const hasCJK = [...text].some(c => c.charCodeAt(0) > 0x4E00);
      ctx.font = hasCJK ? `${size}px 'VT323','Microsoft YaHei','SimHei',sans-serif` : `${size}px 'Press Start 2P',monospace`;
      ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color; ctx.fillText(text, x, y)
    }

    // ─── Achievements ─────────────────────────────────────────
    const ACHIEVEMENTS = [
      { id: 'first', name: '初次接宝', icon: '🎯', desc: '完成第一局游戏', check: s => s.gamesPlayed >= 1 },
      { id: 'star100', name: '星辰收集者', icon: '⭐', desc: '累计接到100个星星', check: s => s.stars >= 100 },
      { id: 'star500', name: '银河搬运工', icon: '🌌', desc: '累计接到500个星星', check: s => s.stars >= 500 },
      { id: 'combo10', name: '连击大师', icon: '🔥', desc: '达到10连击', check: s => s.maxComboEver >= 10 },
      { id: 'combo20', name: '连击王者', icon: '💥', desc: '达到20连击', check: s => s.maxComboEver >= 20 },
      { id: 'perfect50', name: '完美主义者', icon: '★', desc: '累计50次完美接取', check: s => s.perfects >= 50 },
      { id: 'score500', name: '小有所成', icon: '📈', desc: '单局得分达到500', check: s => s.bestScore >= 500 },
      { id: 'score1000', name: '千分猎手', icon: '🏆', desc: '单局得分达到1000', check: s => s.bestScore >= 1000 },
      { id: 'level10', name: '持久战', icon: '⏱️', desc: '达到 Level 10', check: s => s.maxLevelEver >= 10 },
      { id: 'shield', name: '护盾依赖', icon: '🛡️', desc: '在一局中触发护盾抵消', check: s => s.usedShield },
      { id: 'ruby', name: '红宝石之恋', icon: '❤️', desc: '接住一个红宝石', check: s => s.caughtRuby >= 1 },
      { id: 'dodge100', name: '闪避达人', icon: '💨', desc: '累计躲避100个炸弹', check: s => s.bombs >= 100 },
    ];
    let unlockedAchievements = JSON.parse(localStorage.getItem('pixelCatch_achievements') || '[]');
    let pendingAchievement = null;
    let achieveFlash = 0;

    // ─── Lifetime Stats ──────────────────────────────────────
    const LS_KEY = 'pixelCatch_lifetime';
    function loadLifetimeStats() {
      let d = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
      return {
        gamesPlayed: d.gamesPlayed || 0, bestScore: d.bestScore || 0,
        stars: d.stars || 0, gems: d.gems || 0, rubies: d.rubies || 0, bombs: d.bombs || 0,
        perfects: d.perfects || 0, maxComboEver: d.maxComboEver || 0,
        maxLevelEver: d.maxLevelEver || 0, usedShield: d.usedShield || 0,
        caughtRuby: d.caughtRuby || 0, totalScore: d.totalScore || 0
      };
    }
    function saveLifetimeStats(s) {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify(s));
      } catch (e) { console.warn("Failed to save lifetime stats", e); }
    }
    let lifetimeStats = loadLifetimeStats();

    function checkAchievements(s) {
      for (const a of ACHIEVEMENTS) {
        if (!unlockedAchievements.includes(a.id) && a.check(s)) {
          unlockedAchievements.push(a.id);
          localStorage.setItem('pixelCatch_achievements', JSON.stringify(unlockedAchievements));
          pendingAchievement = a;
          achieveFlash = 150;
          playAchieve();
        }
      }
    }

    // ─── Difficulty ───────────────────────────────────────────
    const DIFFICULTIES = [
      { name: '简单', lives: 5, speedMul: 0.8, spawnMul: 0.85, powerUpRate: 1.5, desc: '5条命 · 速度慢 · 道具多' },
      { name: '普通', lives: 3, speedMul: 1.0, spawnMul: 1.0, powerUpRate: 1.0, desc: '3条命 · 标准速度' },
      { name: '困难', lives: 2, speedMul: 1.25, spawnMul: 1.15, powerUpRate: 0.6, desc: '2条命 · 速度快 · 道具少' },
    ];
    let diffIdx = 1; // default: normal

    // ─── Game State ──────────────────────────────────────────
    const G = {
      screen: 'start', score: 0, lives: 3, level: 1,
      highScore: parseInt(localStorage.getItem('pixelCatch_highScore') || '0'),
      leaderboard: JSON.parse(localStorage.getItem('pixelCatch_leaderboard') || '[]'),
      time: 0, blink: 0, combo: 0, maxCombo: 0,
      levelUpFlash: 0, invincible: 0,
      shakeX: 0, shakeY: 0, flashAlpha: 0,
      perfectCatch: 0, gameOverFreeze: 0,
      powerUp: null, powerUpTimer: 0,
      totalCaught: 0, totalBombs: 0, diff: 1
    };
    const player = { x: 360, y: 440, w: 80, h: 20, speed: 6, bounce: 0 };
    let items = [], powerUpItems = [], floatingTexts = [], particles = [];
    let itemTimer = 0, itemInterval = 40;
    const ITEM_TYPES = {
      star: { color: '#FFD700', points: 10, weight: 45, size: 18 },
      gem: { color: '#00D4FF', points: 25, weight: 18, size: 20 },
      ruby: { color: '#FF3366', points: 40, weight: 8, size: 20 },
      bomb: { color: '#FF4444', points: -1, weight: 25, size: 18 }
    };
    const POWERUP_TYPES = {
      shield: { icon: '🛡️', color: '#4488FF', duration: 600 },
      magnet: { icon: '🧲', color: '#FF8800', duration: 480 },
      slow: { icon: '🐌', color: '#88FF44', duration: 420 }
    };
    let keys = { left: false, right: false, up: false, down: false, space: false };

    // ─── Input ────────────────────────────────────────────────
    document.addEventListener('keydown', e => {
      const k = e.key;
      if (k === 'ArrowLeft' || k === 'a') keys.left = true;
      if (k === 'ArrowRight' || k === 'd') keys.right = true;
      if (k === 'ArrowUp' || k === 'w') keys.up = true;
      if (k === 'ArrowDown' || k === 's') { if (G.screen === 'playing') keys.down = true; else if (G.screen !== 'playing') { toggleSound(); return } }
      if (k === 'p' || k === 'P') { if (G.screen === 'playing') { G.screen = 'paused'; playClick() } else if (G.screen === 'paused') { handlePauseClick('resume') } }
      if (k === 's' || k === 'S') toggleSound();
      if (k === ' ') {
        e.preventDefault()
        if (G.screen === 'start') { playClick(); if (Math.abs(e.target.offsetY - 570) < 30) return; startGame() }
        else if (G.screen === 'over') { playClick(); startGame() }
        else if (G.screen === 'paused') { handlePauseClick('resume') }
      }
      if (k === 'Escape') { if (G.screen === 'playing') { G.screen = 'paused'; playClick() } else if (G.screen === 'paused') handlePauseClick('resume') }
    });
    document.addEventListener('keyup', e => {
      const k = e.key;
      if (k === 'ArrowLeft' || k === 'a') keys.left = false; if (k === 'ArrowRight' || k === 'd') keys.right = false;
      if (k === 'ArrowUp' || k === 'w') keys.up = false; if (k === 'ArrowDown' || k === 's') keys.down = false
    });

    function handleInput(e, type) {
      const { mx, my } = getGameCoords(e);
      if (mx > 760 && my < 35) { toggleSound(); return true; }

      if (G.screen === 'start') {
        // Difficulty buttons
        if (my > 360 && my < 405) {
          if (mx > 160 && mx < 300) { diffIdx = 0; playClick(); return true; }
          else if (mx > 330 && mx < 470) { diffIdx = 1; playClick(); return true; }
          else if (mx > 500 && mx < 640) { diffIdx = 2; playClick(); return true; }
        }
        // Stats button
        if (mx > 360 && mx < 440 && my > 555 && my < 580) { G.screen = 'stats'; playClick(); return true; }
        // Achievements button
        if (mx > 700 && mx < 770 && my > 530 && my < 570) { G.screen = 'achievements'; playClick(); return true; }

        // Default to start game if clicking anywhere else meaningful
        if (my < 520) { startGame(); return true; }
      } else if (G.screen === 'over') {
        startGame(); return true;
      } else if (G.screen === 'paused') {
        return handlePauseClick(mx, my);
      } else if (G.screen === 'stats' || G.screen === 'achievements') {
        G.screen = 'start'; playClick(); return true;
      }
      return false;
    }

    canvas.addEventListener('mousemove', e => { const { mx, my } = getGameCoords(e); if (G.screen === 'playing') { player.x = Math.max(0, Math.min(W - player.w, mx - player.w / 2)); player.y = Math.max(42, Math.min(H - player.h, my - player.h / 2)) } });
    canvas.addEventListener('click', e => { handleInput(e, 'click'); });
    canvas.addEventListener('touchmove', e => { e.preventDefault(); const { mx, my } = getGameCoords(e); if (G.screen === 'playing') { player.x = Math.max(0, Math.min(W - player.w, mx - player.w / 2)); player.y = Math.max(42, Math.min(H - player.h, my - player.h / 2)) } }, { passive: false });
    canvas.addEventListener('touchstart', e => {
      if (G.screen !== 'playing') {
        if (handleInput(e, 'touch')) e.preventDefault();
      }
    }, { passive: false });

    function handlePauseClick(mx, my) {
      if (typeof mx === 'string') {
        if (mx === 'resume') { G.screen = 'playing'; playClick(); return true; }
        return false;
      }
      if (my > 250 && my < 290) { if (mx > 300 && mx < 500) { G.screen = 'playing'; playClick(); return true; } }
      else if (my > 310 && my < 350) { if (mx > 300 && mx < 500) { playClick(); startGame(); return true; } }
      else if (my > 370 && my < 410) { if (mx > 300 && mx < 500) { G.screen = 'start'; playClick(); return true; } }
      return false;
    }

    // ─── Game Functions ──────────────────────────────────────
    function startGame() {
      const d = DIFFICULTIES[diffIdx];
      G.screen = 'playing'; G.score = 0; G.lives = d.lives; G.level = 1; G.diff = diffIdx;
      G.time = 0; G.combo = 0; G.maxCombo = 0; G.levelUpFlash = 0;
      G.invincible = 0; G.powerUp = null; G.powerUpTimer = 0;
      G.perfectCatch = 0; G.gameOverFreeze = 0; G.flashAlpha = 0;
      G.totalCaught = 0; G.totalBombs = 0;
      perGameItems = { stars: 0, gems: 0, rubies: 0, bombs: 0, usedShield: 0, caughtRuby: 0 };
      items = []; powerUpItems = []; floatingTexts = []; particles = [];
      itemTimer = 0; itemInterval = 40; player.x = 360; player.y = 440; player.bounce = 0
    }

    function spawnItem() {
      const types = Object.keys(ITEM_TYPES);
      let totalW = 0;
      for (const t of types) { let w = ITEM_TYPES[t].weight; if (t === 'ruby' && G.level < 2) w = 0; totalW += w }
      let r = Math.random() * totalW, type = types[0], acc = 0;
      for (const t of types) { let w = ITEM_TYPES[t].weight; if (t === 'ruby' && G.level < 2) w = 0; acc += w; if (r <= acc) { type = t; break } }
      const dMul = DIFFICULTIES[G.diff].speedMul;
      const speed = (2 + G.level * 0.5 + Math.random() * 0.8) * dMul;
      let spawnX = 30 + Math.random() * (W - 60);
      if (G.level >= 2 && Math.random() < 0.2) spawnX = Math.random() < 0.5 ? -20 : W + 20;

      const item = getFromPool('items');
      item.type = type; item.x = spawnX; item.y = -20;
      item.size = ITEM_TYPES[type].size;
      item.speed = G.powerUp === 'slow' ? speed * 0.45 : speed;
      item.wobble = Math.random() * Math.PI * 2;
      item.wobbleAmp = 0.3 + Math.random() * 0.5;
      item.fromSide = spawnX < 0 || spawnX > W;
      items.push(item);
    }

    function spawnPowerUp() {
      const types = Object.keys(POWERUP_TYPES);
      if (types.length === 0) return;
      const type = types[Math.floor(Math.random() * types.length)];
      powerUpItems.push({ type, x: 40 + Math.random() * (W - 80), y: -22, speed: 1.2 + G.level * 0.2, size: 22, wobble: Math.random() * Math.PI * 2 })
    }

    function addFloatingText(x, y, text, color) {
      const ft = getFromPool('floatingTexts');
      ft.x = x; ft.y = y; ft.text = text; ft.color = color;
      ft.life = 40; ft.maxLife = 40;
      floatingTexts.push(ft);
    }

    function addParticles(x, y, color, count = 8) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 3;
        const p = getFromPool('particles');
        p.x = x; p.y = y; p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s;
        p.life = 30 + Math.random() * 20; p.maxLife = 50; p.color = color;
        p.size = 2 + Math.random() * 3;
        particles.push(p);
      }
    }

    function saveScore(score) {
      try {
        let lb = JSON.parse(localStorage.getItem('pixelCatch_leaderboard') || '[]');
        lb.push({ score, date: new Date().toLocaleDateString(), diff: DIFFICULTIES[G.diff].name });
        lb.sort((a, b) => b.score - a.score); lb = lb.slice(0, 10);
        localStorage.setItem('pixelCatch_leaderboard', JSON.stringify(lb));
        G.leaderboard = lb;
        if (score > G.highScore) { G.highScore = score; localStorage.setItem('pixelCatch_highScore', String(score)) }
      } catch (e) { console.warn("Failed to save score to localStorage", e); }
    }

    function updateLifetimeStats() {
      const s = lifetimeStats;
      s.gamesPlayed++; s.totalScore += G.score;
      if (G.score > s.bestScore) s.bestScore = G.score;
      if (G.level > s.maxLevelEver) s.maxLevelEver = G.level;
      if (G.maxCombo > s.maxComboEver) s.maxComboEver = G.maxCombo;
      if (G.perfectCatch > 0) s.perfects += G.perfectCatch;

      // 更新各类型物品统计
      s.stars = (s.stars || 0) + perGameItems.stars;
      s.gems = (s.gems || 0) + perGameItems.gems;
      s.rubies = (s.rubies || 0) + perGameItems.rubies;
      s.bombs = (s.bombs || 0) + perGameItems.bombs;
      s.usedShield = (s.usedShield || 0) + perGameItems.usedShield;
      s.caughtRuby = (s.caughtRuby || 0) + perGameItems.caughtRuby;

      saveLifetimeStats(s);
    }

    // Per-game item counter for stats
    let perGameItems = { stars: 0, gems: 0, rubies: 0, bombs: 0, usedShield: 0 };

    // ─── Drawing ──────────────────────────────────────────────
    function drawPixelItem(x, y, type, size) {
      ctx.save(); const px = Math.round(x), py = Math.round(y), s = Math.round(size), half = Math.round(s / 2);
      if (type === 'star') {
        ctx.fillStyle = '#FFD700'; const n = Math.round(s * 0.12);
        ctx.beginPath(); ctx.moveTo(px, py - half); ctx.lineTo(px + n, py - n); ctx.lineTo(px + half, py); ctx.lineTo(px + n, py + n); ctx.lineTo(px, py + half); ctx.lineTo(px - n, py + n); ctx.lineTo(px - half, py); ctx.lineTo(px - n, py - n); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#B8860B'; ctx.lineWidth = 1; ctx.stroke(); ctx.fillStyle = '#FFF8DC'; ctx.beginPath(); ctx.arc(px, py, 2, 0, Math.PI * 2); ctx.fill()
      } else if (type === 'gem') {
        ctx.fillStyle = '#00D4FF'; const h = Math.round(s * 0.6);
        ctx.beginPath(); ctx.moveTo(px, py - h); ctx.lineTo(px + half, py); ctx.lineTo(px, py + h); ctx.lineTo(px - half, py); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.moveTo(px - 2, py - h + 4); ctx.lineTo(px + 2, py - h + 4); ctx.lineTo(px + half - 4, py - 2); ctx.lineTo(px - half + 4, py - 2); ctx.closePath(); ctx.fill()
      } else if (type === 'ruby') {
        ctx.fillStyle = '#FF3366'; ctx.beginPath(); ctx.moveTo(px, py - half); ctx.lineTo(px + half, py); ctx.lineTo(px, py + half); ctx.lineTo(px - half, py); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.moveTo(px - 2, py - half + 3); ctx.lineTo(px + 2, py - half + 3); ctx.lineTo(px + half - 3, py - 2); ctx.lineTo(px - half + 3, py - 2); ctx.closePath(); ctx.fill();
        ctx.shadowColor = '#FF3366'; ctx.shadowBlur = 10; ctx.fillStyle = 'rgba(255,51,102,0.3)'; ctx.beginPath(); ctx.arc(px, py, half + 2, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0
      } else { // bomb
        ctx.fillStyle = '#FF4444'; ctx.beginPath(); ctx.arc(px, py, half, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#CC0000'; ctx.lineWidth = 2; ctx.stroke();
        ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, py - half); ctx.quadraticCurveTo(px + 8, py - half - 6, px + 6, py - half - 10); ctx.stroke();

    // ─── Update Logic ─────────────────────────────────────────
    function update() {
      G.blink++;
      if (achieveFlash > 0) achieveFlash--;
      if (achieveFlash > 0 && achieveFlash < 149) pendingAchievement = null;
      if (G.shakeX > 0) { G.shakeX = -G.shakeX * 0.8; if (Math.abs(G.shakeX) < 1) G.shakeX = 0 }
      if (G.shakeY > 0) { G.shakeY = -G.shakeY * 0.8; if (Math.abs(G.shakeY) < 1) G.shakeY = 0 }
      if (G.screen === 'start' || G.screen === 'over' || G.screen === 'paused' || G.screen === 'stats' || G.screen === 'achievements') return;
      if (G.gameOverFreeze > 0) { G.gameOverFreeze--; G.blink++; return }
      G.time++;
      if (keys.left) player.x -= player.speed; if (keys.right) player.x += player.speed;
      if (keys.up) player.y -= player.speed; if (keys.down) player.y += player.speed;
      player.x = Math.max(0, Math.min(W - player.w, player.x)); player.y = Math.max(42, Math.min(H - player.h, player.y));
      if (G.powerUpTimer > 0) { G.powerUpTimer--; if (G.powerUpTimer <= 0) G.powerUp = null }
      const newLevel = 1 + Math.floor(Math.max(0, G.time - 200) / 500);
      if (newLevel > G.level) { G.level = newLevel; itemInterval = Math.max(14, 38 - G.level * 3.5); G.levelUpFlash = 50; playLevelUp(); addParticles(400, 300, '#FFFF00', 15) }
      if (G.levelUpFlash > 0) G.levelUpFlash--;
      if (G.invincible > 0) G.invincible--;
      if (G.flashAlpha > 0) G.flashAlpha = Math.max(0, G.flashAlpha - 0.02);
      if (player.bounce > 0) player.bounce *= 0.75; if (player.bounce < 0.5) player.bounce = 0;
      for (const s of ambientStars) { s.y += s.speed; if (s.y > H) { s.y = -2; s.x = Math.random() * W } }
      itemTimer++; if (itemTimer >= itemInterval) { itemTimer = 0; spawnItem() }
      const dMul = DIFFICULTIES[G.diff].spawnMul;
      if (powerUpItems.length === 0 && G.powerUp === null && Math.random() < DIFFICULTIES[G.diff].powerUpRate * (0.005 + G.level * 0.001)) spawnPowerUp();
      const baseSpeed = G.powerUp === 'slow' ? 0.45 : 1;
      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        if (item.fromSide) { item.x += (item.x < 0 ? 1 : -1) * (1.5 + G.level * 0.3); item.y += item.speed * baseSpeed * 0.6 } else { item.y += item.speed * baseSpeed; item.x += Math.sin(item.wobble + G.time * 0.02) * item.wobbleAmp }
        if (G.powerUp === 'magnet') { const dx = (player.x + 40) - item.x, dy = (player.y + 10) - item.y, dist = Math.sqrt(dx * dx + dy * dy); if (dist < 200 && dist > 0) { const f = 4 * (1 - dist / 200); item.x += (dx / dist) * f; item.y += (dy / dist) * f } }
        const hs = item.size / 2;
        if (item.y + hs > player.y && item.y - hs < player.y + 20 && item.x + hs > player.x && item.x - hs < player.x + 80) {
          if (item.type === 'bomb') {
            if (G.powerUp === 'shield') { G.powerUp = null; G.powerUpTimer = 0; perGameItems.usedShield = 1; addParticles(item.x, item.y, '#4488FF', 14); addFloatingText(item.x, item.y - 20, '🛡️护盾抵消!', '#4488FF'); playBomb(); items.splice(i, 1); continue }
            if (G.invincible > 0) { items.splice(i, 1); continue }
            G.lives--; G.combo = 0; G.invincible = 45; G.totalBombs++; perGameItems.bombs++;
            G.shakeX = 8; G.shakeY = 5; G.flashAlpha = 0.5; addParticles(item.x, item.y, '#FF4444', 18); playBomb();
            if (G.lives <= 0) {
              G.gameOverFreeze = 40;
              const currentScore = G.score;
              setTimeout(() => {
                if (G.lives <= 0 && G.screen === 'playing') {
                  G.screen = 'over';
                  saveScore(currentScore);
                  updateLifetimeStats();
                  lifetimeStats = loadLifetimeStats();
                  checkAchievements(lifetimeStats);
                  playGameOver();
                }
              }, 700);
            }
          } else {
            const pts = ITEM_TYPES[item.type].points; G.score += pts; G.combo++; G.totalCaught++;
            if (item.type === 'star') perGameItems.stars++; else if (item.type === 'gem') perGameItems.gems++; else if (item.type === 'ruby') { perGameItems.rubies++; perGameItems.caughtRuby = 1 }
            if (G.combo > G.maxCombo) G.maxCombo = G.combo;
            const basketCenter = player.x + 40, perfectZone = 16, isPerfect = Math.abs(item.x - basketCenter) < perfectZone;
            let perfBonus = 0; if (isPerfect) { perfBonus = Math.floor(pts * 0.3); G.perfectCatch++ }
            let bonus = 0; if (G.combo >= 10) bonus = Math.floor(pts * 0.5); else if (G.combo >= 5) bonus = Math.floor(pts * 0.25);
            const totalBonus = bonus + perfBonus; if (totalBonus > 0) G.score += totalBonus;
            player.bounce = 6; let ft = `+${pts}`; if (perfBonus > 0) ft += `★+${perfBonus}`; if (bonus > 0) ft += ` x${bonus}`;
            addParticles(item.x, item.y, ITEM_TYPES[item.type].color, 10); addFloatingText(item.x, item.y - 20, ft, ITEM_TYPES[item.type].color);
            if (G.combo >= 5 && G.combo % 5 === 0) addFloatingText(400, 400, `🔥${G.combo}连击!`, '#FFD700');
            playCatch()
          }
          returnToPool('items', items.splice(i, 1)[0]); continue
        }
        if (item.y > H + 20 || item.x < -40 || item.x > W + 40) { returnToPool('items', items.splice(i, 1)[0]); }
      }
      for (let i = powerUpItems.length - 1; i >= 0; i--) {
        const pu = powerUpItems[i]; pu.y += pu.speed * baseSpeed; pu.x += Math.sin(pu.wobble + G.time * 0.03) * 0.5;
        const hs = pu.size / 2;
        if (pu.y + hs > player.y && pu.y - hs < player.y + 20 && pu.x + hs > player.x && pu.x - hs < player.x + 80) {
          G.powerUp = pu.type; G.powerUpTimer = POWERUP_TYPES[pu.type].duration;
          const nm = { shield: '护盾', magnet: '磁铁', slow: '减速' };
          addParticles(pu.x, pu.y, POWERUP_TYPES[pu.type].color, 16); addFloatingText(400, 280, `${POWERUP_TYPES[pu.type].icon}${nm[pu.type]}!`, POWERUP_TYPES[pu.type].color); playPowerUp(); powerUpItems.splice(i, 1); continue
        }
        if (pu.y > H + 20) powerUpItems.splice(i, 1)
      }
      for (let i = floatingTexts.length - 1; i >= 0; i--) { const ft = floatingTexts[i]; ft.y -= 1.2; ft.life--; if (ft.life <= 0) returnToPool('floatingTexts', floatingTexts.splice(i, 1)[0]) }
      for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life--; if (p.life <= 0) returnToPool('particles', particles.splice(i, 1)[0]) }
    }

    // ─── Main Loop ────────────────────────────────────────────
    function gameLoop() {
      update();
      if (G.screen === 'start') drawStartScreen();
      else if (G.screen === 'playing') drawGameScreen();
      else if (G.screen === 'paused') drawPauseScreen();
      else if (G.screen === 'over') drawGameOverScreen();
      else if (G.screen === 'stats') drawStatsScreen();
      else if (G.screen === 'achievements') drawAchievementsScreen();
      requestAnimationFrame(gameLoop)
    }
    gameLoop();
  </script>
</body>
