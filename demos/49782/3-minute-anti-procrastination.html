<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3分钟对抗拖延症</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-deep: #0c0c1a;
      --bg-card: rgba(255, 255, 255, 0.04);
      --accent: #f59e0b;
      --accent-warm: #ea580c;
      --accent-glow: rgba(245, 158, 11, 0.3);
      --text-primary: #fef3c7;
      --text-secondary: rgba(254, 243, 199, 0.6);
      --border: rgba(245, 158, 11, 0.15);
      --success: #10b981;
    }

    body {
      font-family: 'LXGW WenKai', 'PingFang SC', serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 动态背景 */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }

    .orb-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.3), transparent 70%);
      top: -10%;
      left: -10%;
      animation: float1 20s ease-in-out infinite;
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(234, 88, 12, 0.2), transparent 70%);
      bottom: -10%;
      right: -10%;
      animation: float2 25s ease-in-out infinite;
    }

    .orb-3 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.15), transparent 70%);
      top: 50%;
      left: 50%;
      animation: float3 18s ease-in-out infinite;
    }

    @keyframes float1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(80px, 60px) scale(1.15); }
    }

    @keyframes float2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-60px, -80px) scale(1.1); }
    }

    @keyframes float3 {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-40%, -60%) scale(1.2); }
    }

    /* 噪点纹理 */
    .noise {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.03;
      pointer-events: none;
      z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    /* 主容器 */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 600px;
      padding: 24px;
    }

    /* 卡片 */
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 48px 40px;
      box-shadow:
        0 8px 40px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(245, 158, 11, 0.4), transparent);
    }

    /* 步骤管理 */
    .step {
      display: none;
      opacity: 0;
      transform: translateY(20px) scale(0.98);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .step.active {
      display: block;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* 标题 */
    h1 {
      font-family: 'ZCOOL KuaiLe', cursive;
      font-size: 2.8rem;
      font-weight: 400;
      text-align: center;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-warm));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 2px;
    }

    h2 {
      font-family: 'ZCOOL KuaiLe', cursive;
      font-size: 2.2rem;
      font-weight: 400;
      text-align: center;
      margin-bottom: 24px;
      color: var(--accent);
    }

    .subtitle {
      text-align: center;
      color: var(--text-secondary);
      font-size: 1.05rem;
      margin-bottom: 36px;
      line-height: 1.7;
    }

    /* 输入框 */
    .input-wrapper {
      position: relative;
      margin-bottom: 28px;
    }

    .task-input {
      width: 100%;
      padding: 18px 24px;
      font-size: 1.05rem;
      font-family: 'LXGW WenKai', serif;
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid var(--border);
      border-radius: 18px;
      color: var(--text-primary);
      transition: all 0.3s ease;
      outline: none;
    }

    .task-input::placeholder {
      color: rgba(254, 243, 199, 0.3);
    }

    .task-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.1), 0 0 30px rgba(245, 158, 11, 0.1);
      background: rgba(255, 255, 255, 0.06);
    }

    .task-input.shake {
      animation: shake 0.5s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    /* 按钮 */
    .btn {
      display: block;
      width: 100%;
      padding: 16px 32px;
      font-size: 1.1rem;
      font-family: 'LXGW WenKai', serif;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
      margin-bottom: 12px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-warm));
      color: #fff;
      font-weight: 600;
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(245, 158, 11, 0.5);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      border-color: rgba(245, 158, 11, 0.3);
    }

    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.35);
    }

    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(16, 185, 129, 0.5);
    }

    .btn-group {
      display: flex;
      gap: 12px;
    }

    .btn-group .btn {
      flex: 1;
      margin-bottom: 0;
    }

    /* 拆解结果 */
    .breakdown-box {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(234, 88, 12, 0.05));
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .breakdown-box::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(245, 158, 11, 0.03), transparent);
      animation: shimmer 3s ease-in-out infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%) translateY(-100%); }
      100% { transform: translateX(100%) translateY(100%); }
    }

    .breakdown-label {
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 600;
    }

    .breakdown-text {
      font-size: 1.25rem;
      line-height: 1.7;
      color: var(--text-primary);
      position: relative;
      z-index: 1;
    }

    /* 倒计时 */
    .timer-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }

    .timer-ring-wrapper {
      position: relative;
      width: 220px;
      height: 220px;
      margin-bottom: 24px;
    }

    .timer-ring-wrapper svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }

    .timer-ring-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.05);
      stroke-width: 6;
    }

    .timer-ring-progress {
      fill: none;
      stroke: url(#gradient);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 628;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear;
      filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.4));
    }

    .timer-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'ZCOOL KuaiLe', cursive;
      font-size: 3.2rem;
      color: var(--text-primary);
      letter-spacing: 2px;
    }

    .encourage-text {
      text-align: center;
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.7;
      min-height: 60px;
      transition: opacity 0.5s ease;
    }

    /* 完成页 */
    .celebration {
      text-align: center;
      margin-bottom: 20px;
    }

    .celebration-icon {
      font-size: 4rem;
      display: inline-block;
      animation: celebrate 0.6s ease-out;
    }

    @keyframes celebrate {
      0% { transform: scale(0) rotate(-30deg); opacity: 0; }
      60% { transform: scale(1.3) rotate(10deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .done-message {
      text-align: center;
      color: var(--text-secondary);
      font-size: 1.05rem;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .done-message strong {
      color: var(--accent);
      font-weight: 600;
    }

    /* 彩纸 */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      pointer-events: none;
      z-index: 100;
    }

    @keyframes confettiFall {
      0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    /* 标签 */
    .tag {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 20px;
      font-size: 0.85rem;
      color: var(--accent);
      margin: 0 4px 8px 0;
    }

    /* 提示 */
    .hint {
      text-align: center;
      color: rgba(254, 243, 199, 0.25);
      font-size: 0.85rem;
      margin-top: 20px;
    }

    /* 放弃按钮 */
    .give-up {
      background: transparent;
      border: none;
      color: rgba(254, 243, 199, 0.25);
      font-family: 'LXGW WenKai', serif;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: rgba(254, 243, 199, 0.15);
      transition: color 0.3s ease;
      display: block;
      margin: 16px auto 0;
    }

    .give-up:hover {
      color: rgba(254, 243, 199, 0.5);
    }

    /* 呼吸动画 */
    .breathe {
      animation: breathe 3s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.03); opacity: 0.9; }
    }

    /* 响应式 */
    @media (max-width: 480px) {
      .card {
        padding: 32px 24px;
        border-radius: 22px;
      }

      h1 {
        font-size: 2.2rem;
      }

      h2 {
        font-size: 1.8rem;
      }

      .timer-ring-wrapper {
        width: 180px;
        height: 180px;
      }

      .timer-text {
        font-size: 2.6rem;
      }

      .btn-group {
        flex-direction: column;
      }
    }

    /* 初始提示 */
    .start-hint {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
    }

    .start-hint span {
      color: rgba(254, 243, 199, 0.3);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <!-- 背景光晕 -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>
  <div class="noise"></div>

  <!-- SVG渐变定义 -->
  <svg width="0" height="0" style="position:absolute;">
    <defs>
      <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
      </linearGradient>
    </defs>
  </svg>

  <div class="container">
    <div class="card">

      <!-- 步骤1：输入任务 -->
      <div class="step active" id="step-input">
        <h1>3分钟<br>对抗拖延症</h1>
        <p class="subtitle">
          输入那个你一直拖延的任务<br>
          我们帮你拆解成"3分钟就能开始"的最小行动
        </p>
        <div class="input-wrapper">
          <input
            type="text"
            class="task-input"
            id="taskInput"
            placeholder="比如：写一篇论文、复习考试、做PPT..."
            onkeypress="if(event.key==='Enter') breakTask()"
          >
        </div>
        <button class="btn btn-primary" onclick="breakTask()">
          帮我拆解任务
        </button>
        <div class="start-hint">
          <span class="tag">写论文</span>
          <span class="tag">做PPT</span>
          <span class="tag">复习</span>
          <span class="tag">写代码</span>
          <span class="tag">健身</span>
        </div>
        <p class="hint">无需注册，打开即用</p>
      </div>

      <!-- 步骤2：展示拆解 -->
      <div class="step" id="step-break">
        <h2>你的3分钟行动</h2>
        <div class="breakdown-box">
          <div class="breakdown-label">Step 1</div>
          <p class="breakdown-text" id="breakdownText"></p>
        </div>
        <p class="subtitle" style="margin-bottom: 24px;">
          不需要完美，不需要计划周全。<br>
          你只需要开始做这3分钟。
        </p>
        <div class="btn-group">
          <button class="btn btn-primary" onclick="startTimer()">
            开始3分钟
          </button>
          <button class="btn btn-secondary" onclick="goBack()">
            换一个
          </button>
        </div>
      </div>

      <!-- 步骤3：倒计时 -->
      <div class="step" id="step-timer">
        <h2 style="margin-bottom: 16px;">专注当下</h2>
        <div class="timer-container">
          <div class="timer-ring-wrapper breathe">
            <svg viewBox="0 0 220 220">
              <circle class="timer-ring-bg" cx="110" cy="110" r="100"/>
              <circle class="timer-ring-progress" id="progressRing" cx="110" cy="110" r="100"/>
            </svg>
            <div class="timer-text" id="timerDisplay">03:00</div>
          </div>
          <p class="encourage-text" id="encourageText">
            专注于这一小步，3分钟后你会感谢现在的自己
          </p>
        </div>
        <button class="btn btn-primary" id="pauseBtn" onclick="togglePause()">
          暂停
        </button>
        <button class="give-up" onclick="giveUp()">
          我放弃了
        </button>
      </div>

      <!-- 步骤4：完成 -->
      <div class="step" id="step-done">
        <div class="celebration">
          <span class="celebration-icon">🎉</span>
        </div>
        <h2>太棒了！</h2>
        <p class="done-message">
          你已经完成了最难的部分——<strong>开始</strong>。<br>
          接下来，你可以选择继续，或者休息一会儿。
        </p>
        <div class="btn-group">
          <button class="btn btn-success" onclick="continueTask()">
            再来5分钟
          </button>
          <button class="btn btn-secondary" onclick="newTask()">
            新任务
          </button>
        </div>
        <p class="hint" style="margin-top: 20px;">
          你已经打败了今天的拖延怪兽
        </p>
      </div>

    </div>
  </div>

  <script>
    // 任务拆解数据库
    const breakdowns = [
      { keywords: ['论文', 'article', 'essay'], action: '打开文档，写下论文标题和第一段的第一句话（哪怕很烂也没关系）' },
      { keywords: ['报告', 'report'], action: '新建文档，写下报告大纲的第一个标题和一句简介' },
      { keywords: ['PPT', '幻灯片', 'presentation', 'ppt'], action: '打开PPT软件，新建文件，在封面页写下标题' },
      { keywords: ['复习', '考试', '备考', 'study'], action: '翻开书的第一页，读第一个知识点并用自己的话大声说出来' },
      { keywords: ['读书', '阅读', 'book', 'read'], action: '拿起书，翻开第一页，读完第一段并划出一句话' },
      { keywords: ['代码', '编程', '程序', 'code', 'programming'], action: '打开IDE，新建文件，写下第一个函数名和一行注释' },
      { keywords: ['设计', 'UI', '画', 'design'], action: '打开设计软件，新建画布，画一个矩形并填充喜欢的颜色' },
      { keywords: ['健身', '运动', '锻炼', 'workout', 'exercise'], action: '换上运动装，做5个深蹲或1分钟拉伸' },
      { keywords: ['跑步', 'run', ' jog'], action: '穿上跑鞋，走出门，快走或慢跑1分钟' },
      { keywords: ['写作', '写', 'write'], action: '打开编辑器，写下第一句话，哪怕只是"我要写..."' },
      { keywords: ['邮件', 'email', '信'], action: '打开邮箱，新建邮件，写下收件人和主题' },
      { keywords: ['整理', '收拾', 'clean', 'organize'], action: '选一个最小的区域（比如桌面一角），整理3样东西' },
      { keywords: ['学习', 'learn'], action: '打开学习资料，读第一页的第一个概念' },
      { keywords: ['项目', 'project'], action: '打开项目管理工具，写下项目目标和第一个待办事项' },
      { keywords: ['面试', 'interview'], action: '打开文档，写下自我介绍的前三句话' },
      { keywords: ['简历', 'resume'], action: '打开简历模板，更新最上面的一段经历' }
    ];

    const encourageMessages = [
      '专注于这一小步，3分钟后你会感谢现在的自己',
      '不需要完美，只需要开始',
      '这一刻的专注，就是对抗拖延的最好武器',
      '3分钟很短，但足够让你进入状态',
      '别想太多，做就对了',
      '完成比完美更重要',
      '你正在做一件很棒的事情',
      '每一次开始，都是对拖延的一次胜利'
    ];

    let timerInterval = null;
    let timeLeft = 180;
    let isPaused = false;
    let currentTask = '';
    const totalTime = 180;
    const circumference = 2 * Math.PI * 100;

    function showStep(stepId) {
      document.querySelectorAll('.step').forEach(s => {
        s.classList.remove('active');
      });
      setTimeout(() => {
        document.getElementById(stepId).classList.add('active');
      }, 50);
    }

    function breakTask() {
      const input = document.getElementById('taskInput');
      const task = input.value.trim();

      if (!task) {
        input.classList.add('shake');
        setTimeout(() => input.classList.remove('shake'), 500);
        return;
      }

      currentTask = task;
      let action = '准备好所有需要的材料/工具，写下第一步具体要做什么';

      for (const item of breakdowns) {
        for (const keyword of item.keywords) {
          if (task.toLowerCase().includes(keyword.toLowerCase())) {
            action = item.action;
            break;
          }
        }
      }

      document.getElementById('breakdownText').textContent = action;
      showStep('step-break');
    }

    function goBack() {
      showStep('step-input');
    }

    function startTimer() {
      showStep('step-timer');
      timeLeft = totalTime;
      isPaused = false;
      updateTimerDisplay();
      updateProgressRing();
      document.getElementById('pauseBtn').textContent = '暂停';
      document.getElementById('pauseBtn').className = 'btn btn-primary';

      // 随机鼓励语
      const msg = encourageMessages[Math.floor(Math.random() * encourageMessages.length)];
      document.getElementById('encourageText').textContent = msg;

      if (timerInterval) clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        if (!isPaused) {
          timeLeft--;
          updateTimerDisplay();
          updateProgressRing();

          // 随机更换鼓励语
          if (timeLeft % 30 === 0 && timeLeft > 0) {
            const newMsg = encourageMessages[Math.floor(Math.random() * encourageMessages.length)];
            const el = document.getElementById('encourageText');
            el.style.opacity = '0';
            setTimeout(() => {
              el.textContent = newMsg;
              el.style.opacity = '1';
            }, 500);
          }

          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            timerInterval = null;
            showStep('step-done');
            createConfetti();
          }
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const secs = (timeLeft % 60).toString().padStart(2, '0');
      document.getElementById('timerDisplay').textContent = `${mins}:${secs}`;
    }

    function updateProgressRing() {
      const offset = circumference - (timeLeft / totalTime) * circumference;
      document.getElementById('progressRing').style.strokeDashoffset = offset;
    }

    function togglePause() {
      const btn = document.getElementById('pauseBtn');
      isPaused = !isPaused;
      if (isPaused) {
        btn.textContent = '继续';
        btn.className = 'btn btn-secondary';
        document.querySelector('.timer-ring-wrapper').classList.remove('breathe');
      } else {
        btn.textContent = '暂停';
        btn.className = 'btn btn-primary';
        document.querySelector('.timer-ring-wrapper').classList.add('breathe');
      }
    }

    function giveUp() {
      if (confirm('确定要放弃吗？再坚持一下也许就进入状态了！')) {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
        showStep('step-input');
        document.getElementById('taskInput').value = '';
      }
    }

    function continueTask() {
      // 再来5分钟
      timeLeft = 300;
      showStep('step-timer');
      updateTimerDisplay();
      updateProgressRing();
      document.getElementById('pauseBtn').textContent = '暂停';
      document.getElementById('pauseBtn').className = 'btn btn-primary';
      isPaused = false;

      if (timerInterval) clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        if (!isPaused) {
          timeLeft--;
          updateTimerDisplay();
          updateProgressRing();

          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            timerInterval = null;
            showStep('step-done');
            createConfetti();
          }
        }
      }, 1000);
    }

    function newTask() {
      showStep('step-input');
      document.getElementById('taskInput').value = '';
      document.getElementById('taskInput').focus();
    }

    function createConfetti() {
      const colors = ['#f59e0b', '#ea580c', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6'];
      for (let i = 0; i < 60; i++) {
        setTimeout(() => {
          const confetti = document.createElement('div');
          confetti.className = 'confetti';
          const color = colors[Math.floor(Math.random() * colors.length)];
          const left = Math.random() * 100;
          const size = 6 + Math.random() * 8;
          const duration = 2 + Math.random() * 3;
          const rotate = Math.random() * 360;

          confetti.style.cssText = `
            left: ${left}vw;
            top: -20px;
            width: ${size}px;
            height: ${size}px;
            background: ${color};
            border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
            transform: rotate(${rotate}deg);
            animation: confettiFall ${duration}s ease-out forwards;
          `;
          document.body.appendChild(confetti);
          setTimeout(() => confetti.remove(), duration * 1000);
        }, i * 30);
      }
    }

    // 初始化进度环
    document.getElementById('progressRing').style.strokeDasharray = `${circumference} ${circumference}`;
    document.getElementById('progressRing').style.strokeDashoffset = '0';
  </script>
</body>
</html>
