<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxData Prep - AI语料清洗与速编系统</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F9FAFB;
            --card-bg: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
            --success: #10B981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 2rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
        }

        .upload-zone {
            background-color: var(--card-bg);
            border: 2px dashed var(--border-color);
            border-radius: 0.75rem;
            padding: 3rem 2rem;
            text-align: center;
            transition: all 0.2s ease;
            cursor: pointer;
            margin-bottom: 2rem;
        }

        .upload-zone:hover {
            border-color: var(--primary);
            background-color: #EEF2FF;
        }

        .upload-icon {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-outline:hover {
            background-color: #F3F4F6;
        }

        .dashboard {
            background-color: var(--card-bg);
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .dashboard-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .audio-list {
            list-style: none;
        }

        .audio-item {
            display: flex;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.2s;
        }

        .audio-item:hover {
            background-color: #F9FAFB;
        }

        .audio-item:last-child {
            border-bottom: none;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--success);
            margin-right: 1rem;
        }

        .audio-info {
            flex: 1;
        }

        .audio-name {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
        }

        .audio-tags {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            gap: 0.5rem;
        }

        .tag {
            background-color: #E5E7EB;
            padding: 0.1rem 0.5rem;
            border-radius: 999px;
        }

        .waveform-mock {
            width: 150px;
            height: 30px;
            background: linear-gradient(90deg, #E5E7EB 20%, #4F46E5 20%, #4F46E5 80%, #E5E7EB 80%);
            border-radius: 4px;
            margin: 0 1.5rem;
            opacity: 0.7;
        }

        .controls {
            display: flex;
            gap: 0.5rem;
        }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>VoxData Prep</h1>
        <p class="subtitle">AI 数据集准备与音频切片自动化清洗工具</p>
    </header>

    <div class="upload-zone" onclick="alert('触发文件选择器：支持导入文件夹或批量音频文件 (.wav, .mp3)')">
        <div class="upload-icon">📁</div>
        <h3>拖拽原始音频素材至此</h3>
        <p class="subtitle" style="margin-top: 0.5rem; margin-bottom: 1rem;">自动进行 VAD 人声检测、剔除空白与冗余语气词</p>
        <button class="btn">浏览文件</button>
    </div>

    <div class="dashboard">
        <div class="dashboard-header">
            <h3>已处理切片 (300+)</h3>
            <div>
                <button class="btn btn-outline" style="margin-right: 0.5rem;">⚙️ 识别设置</button>
                <button class="btn" onclick="alert('开始打包导出标准格式的数据集！')">📦 导出多轨/数据集</button>
            </div>
        </div>
        
        <ul class="audio-list">
            <!-- Mock Item 1 -->
            <li class="audio-item">
                <div class="status-dot"></div>
                <div class="audio-info">
                    <div class="audio-name">vocal_slice_001.wav</div>
                    <div class="audio-tags">
                        <span class="tag">纯净人声</span>
                        <span class="tag">0.8s</span>
                        <span class="tag">识别: "你好"</span>
                    </div>
                </div>
                <div class="waveform-mock"></div>
                <div class="controls">
                    <button class="btn btn-outline">▶️ 试听</button>
                    <button class="btn btn-outline">🗑️</button>
                </div>
            </li>
            
            <!-- Mock Item 2 -->
            <li class="audio-item">
                <div class="status-dot"></div>
                <div class="audio-info">
                    <div class="audio-name">vocal_slice_002_nonverbal.wav</div>
                    <div class="audio-tags">
                        <span class="tag" style="background-color: #FEF3C7; color: #D97706;">非结构化声音</span>
                        <span class="tag">1.2s</span>
                        <span class="tag">过滤: 呼吸声/语气词</span>
                    </div>
                </div>
                <div class="waveform-mock" style="background: linear-gradient(90deg, #E5E7EB 40%, #F59E0B 40%, #F59E0B 60%, #E5E7EB 60%);"></div>
                <div class="controls">
                    <button class="btn btn-outline">▶️ 试听</button>
                    <button class="btn btn-outline">🗑️</button>
                </div>
            </li>

            <!-- Mock Item 3 -->
            <li class="audio-item">
                <div class="status-dot" style="background-color: #EF4444;"></div>
                <div class="audio-info">
                    <div class="audio-name">vocal_slice_003.wav</div>
                    <div class="audio-tags">
                        <span class="tag">杂音过多</span>
                        <span class="tag">0.5s</span>
                        <span class="tag">自动废弃</span>
                    </div>
                </div>
                <div class="waveform-mock" style="background: #E5E7EB;"></div>
                <div class="controls">
                    <button class="btn btn-outline">▶️ 试听</button>
                    <button class="btn btn-outline">恢复</button>
                </div>
            </li>
        </ul>
    </div>
</div>

</body>
</html>
