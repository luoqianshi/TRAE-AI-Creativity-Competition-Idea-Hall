<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实验侦探 - 你的7x24小时AI实验助教</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'tech-blue': '#378ADD',
                        'fresh-green': '#1D9E75',
                        'code-bg': '#1E293B',
                        'success': '#22C55E',
                        'error': '#EF4444',
                        'warning': '#F59E0B'
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                        'slide-down': 'slideDown 0.4s ease-out',
                        'pulse-slow': 'pulse 2s infinite',
                        'spin-slow': 'spin 3s linear infinite',
                        'scale-in': 'scaleIn 0.3s ease-out'
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        slideDown: { '0%': { opacity: '0', transform: 'translateY(-20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        scaleIn: { '0%': { opacity: '0', transform: 'scale(0.95)' }, '100%': { opacity: '1', transform: 'scale(1)' } }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #F8FAFC 0%, #E2E8F0 100%);
            min-height: 100vh;
        }

        .gradient-text {
            background: linear-gradient(135deg, #378ADD 0%, #1D9E75 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #378ADD 0%, #1D9E75 100%);
        }

        .card-hover {
            transition: all 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(55, 138, 221, 0.25);
        }

        .code-block {
            font-family: 'Fira Code', monospace;
            background: #1E293B;
            color: #E2E8F0;
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
            position: relative;
        }

        .code-block .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #94A3B8;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .code-block .copy-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #E2E8F0;
        }

        .code-block .copy-btn.copied {
            background: #22C55E;
            color: white;
        }

        .step-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
        }

        .step-content.open {
            max-height: 1000px;
        }

        .loading-dots span {
            animation: loadingDot 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes loadingDot {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .type-card.selected {
            border-width: 2px;
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(55, 138, 221, 0.2);
        }

        .type-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="text-gray-800">
    <nav class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">

                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>

                    <button onclick="App.navigate('check')" class="nav-item text-gray-600 hover:text-tech-blue transition-colors">错误检查</button>

    <main id="app-container" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    </main>

    <footer class="bg-white/60 backdrop-blur-sm mt-12 py-6">

            <p>实验侦探 - 你的7x24小时AI实验助教 | Trae AI创造力大赛参赛作品</p>
        </div>

    <script>
        const App = {
            currentPage: 'home',
            currentCodeData: [],
            experimentData: { type: '', selectedExample: null },
            
            init() {
                this.renderHome();
            },

            navigate(pageId) {
                this.currentPage = pageId;
                document.querySelectorAll('.nav-item').forEach(item => {
                    item.classList.remove('nav-active');
                    const map = { home: '首页', create: '创建实验', analysis: 'AI分析', check: '错误检查', report: '实验报告' };
                    if (item.textContent === map[pageId]) item.classList.add('nav-active');
                });
                const container = document.getElementById('app-container');
                container.style.opacity = '0';
                setTimeout(() => {
                    switch(pageId) {
                        case 'home': this.renderHome(); break;
                        case 'create': this.renderCreate(); break;
                        case 'analysis': this.renderAnalysis(); break;
                        case 'check': this.renderCheck(); break;
                        case 'report': this.renderReport(); break;

                    container.style.opacity = '1';
                }, 200);
            },

                document.getElementById('app-container').innerHTML = `

                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>

                            <span class="px-4 py-2 bg-purple-100 text-purple-600 rounded-full text-sm">华为eNSP</span>
                            <span class="px-4 py-2 bg-pink-100 text-pink-600 rounded-full text-sm">Multisim</span>
                        </div>

                `;
            },

            renderCreate() {
                document.getElementById('app-container').innerHTML = `
                    <section class="animate-fade-in">
                        <h1 class="text-3xl font-bold mb-2 gradient-text">创建新实验</h1>
                        <p class="text-gray-500 mb-8">选择实验类型，输入实验要求，开始AI辅导</p>

                        <div class="grid md:grid-cols-3 gap-6 mb-8">
                            <div onclick="App.selectExperimentType('network')" id="type-network" class="type-card bg-white rounded-2xl p-6 shadow-card cursor-pointer border-2 border-transparent hover:border-tech-blue">
                                <div class="w-14 h-14 rounded-xl bg-tech-blue/10 flex items-center justify-center mb-4">
                                    <svg class="w-7 h-7 text-tech-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                                    </svg>
                                </div>
                                <h3 class="text-lg font-semibold mb-2">网络配置实验</h3>
                                <p class="text-gray-500 text-sm">华为eNSP模拟器配置，VLAN、STP、OSPF等</p>
                            </div>
                            <div onclick="App.selectExperimentType('circuit')" id="type-circuit" class="type-card bg-white rounded-2xl p-6 shadow-card cursor-pointer border-2 border-transparent hover:border-fresh-green">
                                <div class="w-14 h-14 rounded-xl bg-fresh-green/10 flex items-center justify-center mb-4">
                                    <svg class="w-7 h-7 text-fresh-green" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                                    </svg>
                                </div>
                                <h3 class="text-lg font-semibold mb-2">电路设计实验</h3>
                                <p class="text-gray-500 text-sm">Multisim电路仿真，逻辑门、计数器等</p>
                            </div>
                            <div onclick="App.selectExperimentType('programming')" id="type-programming" class="type-card bg-white rounded-2xl p-6 shadow-card cursor-pointer border-2 border-transparent hover:border-warning">
                                <div class="w-14 h-14 rounded-xl bg-warning/10 flex items-center justify-center mb-4">
                                    <svg class="w-7 h-7 text-warning" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
                                    </svg>
                                </div>
                                <h3 class="text-lg font-semibold mb-2">编程实验</h3>
                                <p class="text-gray-500 text-sm">Java/C语言编程，数据结构、算法实现等</p>

                        </div>

                        <div class="bg-white rounded-2xl p-6 shadow-card mb-8">

                                <button onclick="App.selectExample('counter')" class="px-4 py-2 bg-gray-100 hover:bg-fresh-green/10 text-gray-700 hover:text-fresh-green rounded-lg transition-colors text-sm">74LS160计数器设计实验</button>
                                <button onclick="App.selectExample('ospf')" class="px-4 py-2 bg-gray-100 hover:bg-tech-blue/10 text-gray-700 hover:text-tech-blue rounded-lg transition-colors text-sm">OSPF单区域配置实验</button>
                                <button onclick="App.selectExample('sort')" class="px-4 py-2 bg-gray-100 hover:bg-warning/10 text-gray-700 hover:text-warning rounded-lg transition-colors text-sm">快速排序算法实现</button>
                            </div>
                        </div>

                        <div class="bg-white rounded-2xl p-6 shadow-card">
                            <h3 class="text-lg font-semibold mb-4">实验要求</h3>
                            <textarea id="experiment-requirements" rows="6" class="w-full p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-tech-blue/50 focus:border-tech-blue outline-none resize-none text-gray-700" placeholder="请输入实验要求，或上传实验指导书截图..."></textarea>
                            
                            <div class="mt-4 flex flex-col sm:flex-row gap-4">
                                <label class="flex items-center justify-center gap-2 px-6 py-3 border-2 border-dashed border-gray-300 rounded-xl cursor-pointer hover:border-tech-blue hover:bg-tech-blue/5 transition-all w-full sm:w-auto">
                                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                                    </svg>
                                    <span class="text-gray-600">上传实验截图</span>
                                    <input type="file" accept="image/*" class="hidden" onchange="alert('已模拟上传截图！')">
                                </label>
                                <button onclick="App.startAnalysis()" class="px-8 py-3 gradient-bg text-white font-semibold rounded-xl shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-300 w-full sm:w-auto">

            selectExperimentType(type) {
                this.experimentData.type = type;
                document.querySelectorAll('.type-card').forEach(el => {
                    el.classList.remove('selected', 'border-tech-blue', 'border-fresh-green', 'border-warning');
                });
                const card = document.getElementById('type-' + type);
                card.classList.add('selected');
                const colors = { network: 'border-tech-blue', circuit: 'border-fresh-green', programming: 'border-warning' };
                card.classList.add(colors[type]);
            },

            selectExample(example) {
                this.experimentData.selectedExample = example;
                const examples = {
                    mstp: '【MSTP网络配置实验】\n实验目标：配置多生成树协议，实现不同VLAN负载分担\n技术要求：创建VLAN 10、20、30，配置MSTP实例，实现负载分担',
                    counter: '【74LS160计数器设计实验】\n实验目标：使用74LS160设计一个模12计数器\n技术要求：搭建电路，实现异步清零，验证计数范围0-11',
                    ospf: '【OSPF单区域配置实验】\n实验目标：配置OSPF单区域，实现全网互通\n技术要求：配置接口IP，启用OSPF，验证邻居关系',
                    sort: '【快速排序算法实现】\n实验目标：用Java实现快速排序算法\n技术要求：递归实现，处理边界情况，编写测试用例'
                };
                document.getElementById('experiment-requirements').value = examples[example];
                if (example === 'mstp' || example === 'ospf') this.selectExperimentType('network');
                else if (example === 'counter') this.selectExperimentType('circuit');
                else this.selectExperimentType('programming');
            },

            startAnalysis() {
                const requirements = document.getElementById('experiment-requirements').value;
                if (!requirements && !this.experimentData.selectedExample) {
                    alert('请输入实验要求或选择示例实验');
                    return;
                }
                
                const container = document.getElementById('app-container');
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-20 animate-fade-in">

                            <div class="absolute inset-0 flex items-center justify-center">
                                <svg class="w-8 h-8 text-tech-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>

                    </div>
                `;
                
                setTimeout(() => this.navigate('analysis'), 2500);

            getAnalysisData(example) {

                        techPoints: ['MSTP多实例配置', 'VLAN创建与划分', '交换机优先级设置', '端口角色选举原理'],
                        acceptance: ['各VLAN间通信正常', '不同实例选择不同根交换机', '链路负载均衡效果明显', '拓扑收敛时间<30s'],
                        knowledgePoints: [
                            { title: 'MSTP概述', content: '多生成树协议（MSTP）将多个VLAN映射到不同的生成树实例，每个实例独立计算生成树拓扑，从而实现负载分担。' },
                            { title: '实例与VLAN映射', content: '一个MSTP实例可以包含多个VLAN，同一实例内的VLAN共享相同的生成树拓扑。' },
                            { title: '根交换机选举', content: '根交换机由交换机优先级和MAC地址共同决定，优先级值越小越优先成为根交换机。' }
                        ],
                        steps: [
                            {
                                title: '创建VLAN',
                                description: '在三台交换机上分别创建VLAN 10、20、30。',
                                commands: 'system-view\nvlan batch 10 20 30',
                                tips: '使用batch命令可以一次性创建多个VLAN，提高配置效率。'
                            },
                            {
                                title: '配置端口模式',
