<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>冰箱里有啥</title>
  <style>
    /* ===== 全局重置与变量 ===== */
    :root {
      --orange: #FF8C42;
      --orange-light: #FFF0E0;
      --orange-soft: #FFFAF5;
      --cream: #FFF8F0;
      --green: #34C759;
      --green-light: #E8F5E9;
      --green-soft: #F0FFF4;
      --red: #FF5252;
      --red-light: #FFEBEE;
      --red-soft: #FFF5F5;
      --blue: #5AC8FA;
      --blue-light: #E6F7FF;
      --yellow: #FFCC00;
      --text: #1C1C1E;
      --text-secondary: #8E8E93;
      --text-tertiary: #C7C7CC;
      --card-bg: #FFFFFF;
      --bg-warm: #FFF8F0;
      --shadow: 0 2px 12px rgba(0,0,0,0.06);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.1);
      --radius: 20px;
      --radius-sm: 14px;
      --radius-xs: 10px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", sans-serif;
      background: var(--bg-warm);
      color: var(--text);
      overflow: hidden;
    }

    /* ===== 页面容器 ===== */
    .app {
      max-width: 430px;
      height: 100vh;
      margin: 0 auto;
      background: var(--bg-warm);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .page {
      flex: 1;
      overflow-y: auto;
      padding: 0 0 90px;
      display: none;
      animation: fadeIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-overflow-scrolling: touch;
    }
    .page.active { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== 顶部渐变Header ===== */
    .hero-header {
      background: linear-gradient(160deg, #FF8C42 0%, #FF6B35 50%, #FF9500 100%);
      border-radius: 0 0 32px 32px;
      padding: 48px 24px 32px;
      color: #fff;
      position: relative;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .hero-header::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 160px; height: 160px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
    }
    .hero-header::after {
      content: '';
      position: absolute;
      bottom: 20px; left: -20px;
      width: 100px; height: 100px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
    }
    .hero-title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .hero-subtitle {
      font-size: 14px;
      opacity: 0.92;
      font-weight: 400;
    }

    /* ===== 内容区统一padding ===== */
    .section { padding: 0 20px; margin-bottom: 20px; }

    /* ===== 拍照按钮区 ===== */
    .snap-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 28px;
      text-align: center;
      box-shadow: var(--shadow);
      margin-top: -10px;
      position: relative;
      z-index: 2;
    }
    .snap-btn {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--orange), #FF6B35);
      color: #fff;
      border: none;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 8px 28px rgba(255,140,66,0.4);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      margin: 0 auto 12px;
    }
    .snap-btn:active {
      transform: scale(0.94);
      box-shadow: 0 4px 14px rgba(255,140,66,0.35);
    }
    .snap-btn .icon { font-size: 38px; }
    .snap-hint {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* ===== 已识别食材 ===== */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .section-title {
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-count {
      font-size: 13px;
      color: var(--text-secondary);
      background: var(--orange-light);
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 600;
    }
    .tags-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .tag {
      padding: 9px 16px;
      border-radius: 24px;
      background: var(--card-bg);
      border: 2px solid transparent;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
      position: relative;
      transition: all 0.2s;
      box-shadow: var(--shadow);
      font-weight: 500;
    }
    .tag.selected {
      border-color: var(--orange);
      background: var(--orange-light);
      color: var(--orange);
      font-weight: 700;
    }
    .tag .expiry {
      position: absolute;
      top: -7px;
      right: -7px;
      background: var(--red);
      color: #fff;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 10px;
      white-space: nowrap;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(255,82,82,0.35);
    }

    /* ===== 营养概览小卡片 ===== */
    .nutrition-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nutrition-pill {
      flex: 1;
      background: var(--card-bg);
      border-radius: var(--radius-sm);
      padding: 14px 10px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .nutrition-pill .value {
      font-size: 20px;
      font-weight: 800;
      color: var(--orange);
      line-height: 1.2;
    }
    .nutrition-pill .label {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* ===== 大按钮 ===== */
    .btn-primary {
      width: 100%;
      padding: 17px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--orange), #FF6B35);
      color: #fff;
      border: none;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(255,140,66,0.35);
      transition: all 0.2s;
      letter-spacing: 0.5px;
    }
    .btn-primary:active {
      transform: scale(0.98);
      box-shadow: 0 3px 10px rgba(255,140,66,0.3);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ===== 底部导航 ===== */
    .nav-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 76px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 -2px 16px rgba(0,0,0,0.06);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
      border-radius: 28px 28px 0 0;
      padding-bottom: 6px;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      color: var(--text-tertiary);
      cursor: pointer;
      transition: color 0.2s;
      border: none;
      background: none;
      padding: 6px 16px;
      border-radius: 16px;
    }
    .nav-item.active {
      color: var(--orange);
      background: var(--orange-light);
    }
    .nav-item .nav-icon { font-size: 24px; margin-bottom: 1px; }

    /* ===== 菜谱推荐页 ===== */
    .recipes-header {
      background: linear-gradient(160deg, #FF8C42 0%, #FF6B35 100%);
      border-radius: 0 0 32px 32px;
      padding: 48px 24px 24px;
      color: #fff;
      margin-bottom: 20px;
    }
    .recipes-header h2 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 16px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.18);
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      backdrop-filter: blur(10px);
    }
    .toggle-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
    }
    .switch {
      position: relative;
      width: 48px;
      height: 26px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.35);
      border-radius: 26px;
      transition: 0.3s;
    }
    .slider::before {
      content: "";
      position: absolute;
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.3s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .switch input:checked + .slider { background: rgba(255,255,255,0.55); }
    .switch input:checked + .slider::before { transform: translateX(22px); }

    /* 菜谱卡片 - 现代设计 */
    .recipe-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin: 0 20px 16px;
      transition: all 0.25s;
      border: 2px solid transparent;
    }
    .recipe-card.highlight {
      border-color: var(--orange);
      box-shadow: 0 4px 20px rgba(255,140,66,0.2);
    }
    .recipe-card:active { transform: scale(0.99); }
    .recipe-img {
      width: 100%;
      height: 190px;
      background: linear-gradient(135deg, var(--orange-light), var(--green-light));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 72px;
      position: relative;
    }
    .recipe-calorie-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .recipe-body { padding: 18px; }
    .recipe-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .recipe-title {
      font-size: 18px;
      font-weight: 800;
    }
    .recipe-calorie-inline {
      font-size: 14px;
      font-weight: 700;
      color: var(--orange);
      background: var(--orange-light);
      padding: 4px 10px;
      border-radius: 10px;
    }
    .recipe-meta {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .badge {
      padding: 5px 11px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-time { background: var(--blue-light); color: #007AFF; }
    .badge-level { background: var(--green-soft); color: var(--green); }
    .badge-urgent { background: var(--red-soft); color: var(--red); }
    .badge-cal { background: var(--orange-light); color: var(--orange); }
    .recipe-ingredients {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 14px;
      line-height: 1.7;
    }
    .recipe-ingredients .urgent {
      color: var(--red);
      font-weight: 700;
      background: var(--red-soft);
      padding: 1px 6px;
      border-radius: 6px;
    }
    .recipe-nutrition-row {
      display: flex;
      gap: 16px;
      margin-bottom: 14px;
      padding: 10px 0;
      border-top: 1px solid #F2F2F7;
      border-bottom: 1px solid #F2F2F7;
    }
    .recipe-nutrition-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .recipe-nutrition-item strong {
      color: var(--text);
      font-weight: 700;
    }
    .btn-secondary {
      width: 100%;
      padding: 13px;
      border-radius: var(--radius-xs);
      background: var(--orange-light);
      color: var(--orange);
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-secondary:active { background: #FFE4D0; }

    /* ===== 做法详情页 ===== */
    .detail-header-bar {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      background: var(--card-bg);
      position: sticky;
      top: 0;
      z-index: 5;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .back-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--orange-light);
      border: none;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--orange);
      margin-right: 12px;
    }
    .detail-title { font-size: 18px; font-weight: 800; flex: 1; }
    .detail-share {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--green-light);
      border: none;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .detail-hero {
      width: 100%;
      height: 220px;
      background: linear-gradient(135deg, var(--orange-light), var(--green-light));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 88px;
      position: relative;
    }
    .detail-hero-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 20px;
      background: linear-gradient(transparent, rgba(0,0,0,0.5));
      color: #fff;
    }
    .detail-hero-overlay h2 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .detail-hero-overlay .meta {
      display: flex;
      gap: 12px;
      font-size: 13px;
      opacity: 0.95;
    }

    /* 营养信息大卡片 */
    .nutrition-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      margin: -30px 20px 20px;
      padding: 20px;
      box-shadow: var(--shadow-lg);
      position: relative;
      z-index: 3;
    }
    .nutrition-card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .nutrition-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      text-align: center;
    }
    .nutrition-grid-item .n-value {
      font-size: 20px;
      font-weight: 800;
      color: var(--orange);
      line-height: 1.2;
    }
    .nutrition-grid-item .n-label {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    .nutrition-grid-item .n-bar {
      width: 100%;
      height: 4px;
      background: #F2F2F7;
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }
    .nutrition-grid-item .n-bar-fill {
      height: 100%;
      border-radius: 2px;
      background: var(--orange);
    }

    .detail-section {
      padding: 0 20px;
      margin-bottom: 20px;
    }
    .detail-section-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 食材清单 */
    .ingredient-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ingredient-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      padding: 14px 16px;
      border-radius: var(--radius-xs);
      box-shadow: var(--shadow);
    }
    .ingredient-item .ing-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 600;
    }
    .ingredient-item .ing-cal {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }
    .ingredient-item .ing-urgent {
      font-size: 11px;
      color: var(--red);
      background: var(--red-soft);
      padding: 2px 8px;
      border-radius: 8px;
      font-weight: 700;
      margin-left: 6px;
    }

    /* 步骤卡片 */
    .step-card {
      background: var(--card-bg);
      border-radius: var(--radius-sm);
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      display: flex;
      gap: 14px;
      align-items: flex-start;
      border-left: 3px solid var(--orange);
    }
    .step-num {
      min-width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--orange);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
    }
    .step-text {
      flex: 1;
      font-size: 15px;
      line-height: 1.75;
      color: var(--text);
      padding-top: 4px;
    }

    .detail-actions {
      display: flex;
      gap: 12px;
      padding: 0 20px 20px;
    }
    .detail-actions .btn-primary { flex: 1; }
    .btn-outline {
      flex: 1;
      padding: 17px;
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--orange);
      border: 2px solid var(--orange);
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-outline:active {
      background: var(--orange-light);
    }

    /* ===== 模拟扫描动画 ===== */
    .scan-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      flex-direction: column;
      gap: 24px;
      backdrop-filter: blur(8px);
    }
    .scan-overlay.active { display: flex; }
    .scan-box {
      width: 260px;
      height: 260px;
      border: 3px solid var(--orange);
      border-radius: 28px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(255,140,66,0.3);
    }
    .scan-line {
      position: absolute;
      left: 0; right: 0;
      height: 3px;
      background: var(--orange);
      box-shadow: 0 0 16px var(--orange);
      animation: scan 1.4s linear infinite;
    }
    @keyframes scan {
      0% { top: 0; }
      100% { top: 100%; }
    }
    .scan-text { color: #fff; font-size: 16px; font-weight: 600; }
    .scan-dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes dots {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-secondary);
    }
    .empty-state .emoji { font-size: 56px; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; }

    /* 卡路里小标签 */
    .cal-tag {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 12px;
      font-weight: 700;
      color: var(--orange);
      background: var(--orange-light);
      padding: 3px 8px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 扫描动画遮罩 -->
    <div class="scan-overlay" id="scanOverlay">
      <div class="scan-box"><div class="scan-line"></div></div>
      <div class="scan-text">正在识别冰箱食材<span class="scan-dots"></span></div>
    </div>

    <!-- ===== 首页：拍照识别 ===== -->
    <div class="page active" id="pageHome">
      <div class="hero-header">
        <div class="hero-title">冰箱里有啥</div>
        <div class="hero-subtitle">拍一拍冰箱，AI 帮你搞定今晚吃什么 🍽️</div>
      </div>

      <div class="section">
        <div class="snap-card">
          <button class="snap-btn" id="btnSnap">
            <span class="icon">📷</span>
            <span>拍一拍</span>
          </button>
          <div class="snap-hint">点击模拟识别冰箱内的食材</div>
        </div>
      </div>

      <!-- 营养概览 -->
      <div class="section" id="nutritionSection" style="display:none">
        <div class="nutrition-bar">
          <div class="nutrition-pill">
            <div class="value" id="calTotal">0</div>
            <div class="label">预估热量 kcal</div>
          </div>
          <div class="nutrition-pill">
            <div class="value" id="proteinTotal">0g</div>
            <div class="label">蛋白质</div>
          </div>
          <div class="nutrition-pill">
            <div class="value" id="itemCount">0</div>
            <div class="label">已选食材</div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-header">
          <div class="section-title">🥬 已识别食材</div>
          <div class="section-count" id="tagCount">0 种</div>
        </div>
        <div class="tags-cloud" id="tagsCloud"></div>
      </div>

      <div class="section" style="padding-bottom: 10px">
        <button class="btn-primary" id="btnGenerate">🔥 生成今晚菜谱</button>
      </div>
    </div>

    <!-- ===== 菜谱推荐页 ===== -->
    <div class="page" id="pageRecipes">
      <div class="recipes-header">
        <h2>🍳 推荐菜谱</h2>
        <div class="toggle-row">
          <div class="toggle-left">
            <span>⚡</span>
            <span>优先消耗临期食材</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="toggleUrgent" />
            <span class="slider"></span>
          </label>
        </div>
      </div>
      <div id="recipeList"></div>
    </div>

    <!-- ===== 做法详情页 ===== -->
    <div class="page" id="pageDetail">
      <div class="detail-header-bar">
        <button class="back-btn" id="btnBack">←</button>
        <div class="detail-title" id="detailTitle">菜名</div>
        <button class="detail-share" id="btnShare">↗️</button>
      </div>
      <div class="detail-hero" id="detailImg">
        🍳
        <div class="detail-hero-overlay">
          <h2 id="detailHeroTitle">菜名</h2>
          <div class="meta">
            <span id="detailTime">⏱ 10分钟</span>
            <span id="detailLevel">📊 简单</span>
            <span id="detailCal">🔥 0 kcal</span>
          </div>
        </div>
      </div>

      <!-- 营养信息卡片 -->
      <div class="nutrition-card">
        <div class="nutrition-card-title">📊 营养信息（每份）</div>
        <div class="nutrition-grid">
          <div class="nutrition-grid-item">
            <div class="n-value" id="nCal">0</div>
            <div class="n-label">热量 kcal</div>
            <div class="n-bar"><div class="n-bar-fill" id="nCalBar" style="width:0%"></div></div>
          </div>
          <div class="nutrition-grid-item">
            <div class="n-value" id="nProtein">0g</div>
            <div class="n-label">蛋白质</div>
            <div class="n-bar"><div class="n-bar-fill" id="nProteinBar" style="width:0%;background:var(--green)"></div></div>
          </div>
          <div class="nutrition-grid-item">
            <div class="n-value" id="nFat">0g</div>
            <div class="n-label">脂肪</div>
            <div class="n-bar"><div class="n-bar-fill" id="nFatBar" style="width:0%;background:var(--yellow)"></div></div>
          </div>
          <div class="nutrition-grid-item">
            <div class="n-value" id="nCarb">0g</div>
            <div class="n-label">碳水</div>
            <div class="n-bar"><div class="n-bar-fill" id="nCarbBar" style="width:0%;background:var(--blue)"></div></div>
          </div>
        </div>
      </div>

      <div class="detail-section">
        <div class="detail-section-title">🥕 所需食材</div>
        <div class="ingredient-list" id="detailIngredients"></div>
      </div>

      <div class="detail-section">
        <div class="detail-section-title">👨‍🍳 烹饪步骤</div>
        <div id="detailSteps"></div>
      </div>

      <div class="detail-actions">
        <button class="btn-outline" id="btnFav">⭐ 收藏</button>
        <button class="btn-primary" id="btnStart">🔥 开始烹饪</button>
      </div>
    </div>

    <!-- ===== 底部导航 ===== -->
    <nav class="nav-bar">
      <button class="nav-item active" data-target="pageHome">
        <span class="nav-icon">📷</span>
        <span>拍照</span>
      </button>
      <button class="nav-item" data-target="pageRecipes">
        <span class="nav-icon">🍳</span>
        <span>菜谱</span>
      </button>
      <button class="nav-item" data-target="pageDetail" style="display:none">
        <span class="nav-icon">📖</span>
        <span>做法</span>
      </button>
    </nav>
  </div>

  <script>
    /* ================= 数据 ================= */
    // 食材数据：name 名称，urgent 是否临期，expiry 临期文案，cal 卡路里，protein 蛋白质
    const INGREDIENTS_DB = [
      { name: '鸡蛋', urgent: false, cal: 70, protein: 6, unit: '个' },
      { name: '番茄', urgent: true, expiry: '还剩 1 天', cal: 18, protein: 1, unit: '个' },
      { name: '青椒', urgent: false, cal: 22, protein: 1, unit: '个' },
      { name: '土豆', urgent: false, cal: 77, protein: 2, unit: '个' },
      { name: '牛奶', urgent: true, expiry: '还剩 2 天', cal: 65, protein: 3, unit: '杯' },
      { name: '火腿', urgent: false, cal: 120, protein: 8, unit: '片' },
      { name: '胡萝卜', urgent: false, cal: 25, protein: 1, unit: '根' },
      { name: '洋葱', urgent: false, cal: 40, protein: 1, unit: '个' },
    ];

    // 菜谱数据（加入卡路里和营养信息）
    const RECIPES_DB = [
      {
        id: 1,
        name: '番茄炒蛋',
        emoji: '🍅',
        time: '10 分钟',
        level: '简单',
        calories: 245,
        protein: 14,
        fat: 16,
        carbs: 12,
        ingredients: ['番茄', '鸡蛋'],
        urgentIngredients: ['番茄'],
        ingredientAmounts: { '番茄': '2个', '鸡蛋': '3个' },
        steps: [
          '番茄洗净切块，鸡蛋打散加少许盐搅匀。',
          '热锅凉油，倒入蛋液快速划散，炒至凝固盛出备用。',
          '锅中再加少许油，放入番茄块中火翻炒出汁。',
          '倒入炒好的鸡蛋，翻炒均匀，加盐调味即可出锅。'
        ]
      },
      {
        id: 2,
        name: '青椒土豆丝',
        emoji: '🥔',
        time: '15 分钟',
        level: '简单',
        calories: 168,
        protein: 4,
        fat: 8,
        carbs: 22,
        ingredients: ['土豆', '青椒'],
        urgentIngredients: [],
        ingredientAmounts: { '土豆': '2个', '青椒': '1个' },
        steps: [
          '土豆去皮切丝，用清水浸泡去掉多余淀粉；青椒切丝备用。',
          '热锅凉油，爆香蒜末（如有）。',
          '下土豆丝大火快炒 2 分钟，加入青椒丝继续翻炒。',
          '加盐、少许醋调味，翻炒均匀后出锅。'
        ]
      },
      {
        id: 3,
        name: '火腿三明治',
        emoji: '🥪',
        time: '5 分钟',
        level: '零基础',
        calories: 320,
        protein: 18,
        fat: 14,
        carbs: 28,
        ingredients: ['火腿', '鸡蛋', '牛奶'],
        urgentIngredients: ['牛奶'],
        ingredientAmounts: { '火腿': '3片', '鸡蛋': '1个', '牛奶': '1杯' },
        steps: [
          '平底锅煎熟鸡蛋和火腿片，表面微焦更香。',
          '吐司片（如有）烤至微脆，涂抹适量酱料。',
          '依次放上生菜、火腿、煎蛋，再盖上一片吐司。',
          '对半切开，搭配一杯牛奶即可享用。'
        ]
      }
    ];

    /* ================= 状态 ================= */
    let selectedIngredients = new Set();
    let urgentFirst = false;
    let currentRecipe = null;

    /* ================= DOM 引用 ================= */
    const pages = {
      home: document.getElementById('pageHome'),
      recipes: document.getElementById('pageRecipes'),
      detail: document.getElementById('pageDetail')
    };
    const navItems = document.querySelectorAll('.nav-item');
    const tagsCloud = document.getElementById('tagsCloud');
    const recipeList = document.getElementById('recipeList');
    const scanOverlay = document.getElementById('scanOverlay');

    /* ================= 工具函数 ================= */
    function showPage(name) {
      Object.values(pages).forEach(p => p.classList.remove('active'));
      pages[name].classList.add('active');
      navItems.forEach(n => {
        const targetName = n.dataset.target.replace('page', '').toLowerCase();
        if (targetName === name) {
          n.classList.add('active');
        } else {
          n.classList.remove('active');
        }
      });
    }

    function getIngredient(name) {
      return INGREDIENTS_DB.find(i => i.name === name);
    }

    function updateNutritionSummary() {
      const section = document.getElementById('nutritionSection');
      if (selectedIngredients.size === 0) {
        section.style.display = 'none';
        return;
      }
      section.style.display = 'block';
      let totalCal = 0, totalProtein = 0;
      selectedIngredients.forEach(name => {
        const ing = getIngredient(name);
        if (ing) {
          totalCal += ing.cal;
          totalProtein += ing.protein;
        }
      });
      document.getElementById('calTotal').textContent = totalCal;
      document.getElementById('proteinTotal').textContent = totalProtein + 'g';
      document.getElementById('itemCount').textContent = selectedIngredients.size;
    }

    function renderTags() {
      tagsCloud.innerHTML = '';
      INGREDIENTS_DB.forEach(item => {
        const tag = document.createElement('div');
        tag.className = 'tag' + (selectedIngredients.has(item.name) ? ' selected' : '');
        tag.textContent = item.name;
        if (item.urgent) {
          const exp = document.createElement('span');
          exp.className = 'expiry';
          exp.textContent = item.expiry;
          tag.appendChild(exp);
        }
        tag.addEventListener('click', () => {
          if (selectedIngredients.has(item.name)) {
            selectedIngredients.delete(item.name);
          } else {
            selectedIngredients.add(item.name);
          }
          renderTags();
          updateNutritionSummary();
          document.getElementById('tagCount').textContent = selectedIngredients.size + ' 种';
        });
        tagsCloud.appendChild(tag);
      });
    }

    function getSortedRecipes() {
      let list = RECIPES_DB.filter(r =>
        r.ingredients.some(ing => selectedIngredients.has(ing))
      );
      if (urgentFirst) {
        list = list.sort((a, b) => {
          const aUrgent = a.urgentIngredients.filter(i => selectedIngredients.has(i)).length;
          const bUrgent = b.urgentIngredients.filter(i => selectedIngredients.has(i)).length;
          return bUrgent - aUrgent;
        });
      }
      return list;
    }

    function renderRecipes() {
      const list = getSortedRecipes();
      if (list.length === 0) {
        recipeList.innerHTML = `
          <div class="empty-state">
            <div class="emoji">🍽️</div>
            <p>请先选择食材并生成菜谱～</p>
          </div>`;
        return;
      }
      recipeList.innerHTML = '';
      list.forEach(r => {
        const hasUrgent = r.urgentIngredients.some(i => selectedIngredients.has(i));
        const card = document.createElement('div');
        card.className = 'recipe-card' + (hasUrgent && urgentFirst ? ' highlight' : '');
        const ingHtml = r.ingredients.map(ing => {
          const isUrgent = r.urgentIngredients.includes(ing) && selectedIngredients.has(ing);
          return isUrgent ? `<span class="urgent">${ing}</span>` : ing;
        }).join('、');

        card.innerHTML = `
          <div class="recipe-img">
            ${r.emoji}
            <div class="recipe-calorie-badge">🔥 ${r.calories} kcal</div>
          </div>
          <div class="recipe-body">
            <div class="recipe-title-row">
              <div class="recipe-title">${r.name}</div>
              <div class="recipe-calorie-inline">${r.calories} kcal</div>
            </div>
            <div class="recipe-meta">
              <span class="badge badge-time">⏱ ${r.time}</span>
              <span class="badge badge-level">${r.level}</span>
              ${hasUrgent && urgentFirst ? '<span class="badge badge-urgent">临期优先</span>' : ''}
            </div>
            <div class="recipe-ingredients">食材：${ingHtml}</div>
            <div class="recipe-nutrition-row">
              <div class="recipe-nutrition-item">🔥 <strong>${r.calories}</strong> kcal</div>
              <div class="recipe-nutrition-item">🥩 <strong>${r.protein}g</strong> 蛋白质</div>
              <div class="recipe-nutrition-item">🍞 <strong>${r.carbs}g</strong> 碳水</div>
            </div>
            <button class="btn-secondary" data-id="${r.id}">查看做法</button>
          </div>
        `;
        card.querySelector('.btn-secondary').addEventListener('click', () => openDetail(r));
        recipeList.appendChild(card);
      });
    }

    function openDetail(recipe) {
      currentRecipe = recipe;
      document.getElementById('detailTitle').textContent = recipe.name;
      document.getElementById('detailHeroTitle').textContent = recipe.name;
      document.getElementById('detailImg').innerHTML = `
        ${recipe.emoji}
        <div class="detail-hero-overlay">
          <h2>${recipe.name}</h2>
          <div class="meta">
            <span>⏱ ${recipe.time}</span>
            <span>📊 ${recipe.level}</span>
            <span>🔥 ${recipe.calories} kcal</span>
          </div>
        </div>
      `;

      // 营养信息
      document.getElementById('nCal').textContent = recipe.calories;
      document.getElementById('nProtein').textContent = recipe.protein + 'g';
      document.getElementById('nFat').textContent = recipe.fat + 'g';
      document.getElementById('nCarb').textContent = recipe.carbs + 'g';
      document.getElementById('nCalBar').style.width = Math.min(recipe.calories / 600 * 100, 100) + '%';
      document.getElementById('nProteinBar').style.width = Math.min(recipe.protein / 30 * 100, 100) + '%';
      document.getElementById('nFatBar').style.width = Math.min(recipe.fat / 25 * 100, 100) + '%';
      document.getElementById('nCarbBar').style.width = Math.min(recipe.carbs / 50 * 100, 100) + '%';

      // 食材清单
      const ingContainer = document.getElementById('detailIngredients');
      ingContainer.innerHTML = '';
      recipe.ingredients.forEach(ing => {
        const ingData = getIngredient(ing);
        const isUrgent = recipe.urgentIngredients.includes(ing) && selectedIngredients.has(ing);
        const amount = recipe.ingredientAmounts[ing] || '';
        const item = document.createElement('div');
        item.className = 'ingredient-item';
        item.innerHTML = `
          <div class="ing-left">
            <span>${ing}</span>
            <span style="color:var(--text-tertiary);font-weight:500">${amount}</span>
            ${isUrgent ? '<span class="ing-urgent">建议今天吃</span>' : ''}
          </div>
          <div class="ing-cal">${ingData ? '🔥 ' + ingData.cal + ' kcal/' + ingData.unit : ''}</div>
        `;
        ingContainer.appendChild(item);
      });

      // 步骤
      const stepsContainer = document.getElementById('detailSteps');
      stepsContainer.innerHTML = '';
      recipe.steps.forEach((step, idx) => {
        const card = document.createElement('div');
        card.className = 'step-card';
        card.innerHTML = `<div class="step-num">${idx + 1}</div><div class="step-text">${step}</div>`;
        stepsContainer.appendChild(card);
      });

      showPage('detail');
    }

    /* ================= 事件绑定 ================= */
    navItems.forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.dataset.target;
        if (target === 'pageHome') showPage('home');
        if (target === 'pageRecipes') showPage('recipes');
      });
    });

    document.getElementById('btnSnap').addEventListener('click', () => {
      scanOverlay.classList.add('active');
      setTimeout(() => {
        scanOverlay.classList.remove('active');
        INGREDIENTS_DB.slice(0, 5).forEach(i => selectedIngredients.add(i.name));
        renderTags();
        updateNutritionSummary();
        document.getElementById('tagCount').textContent = selectedIngredients.size + ' 种';
        const btn = document.getElementById('btnSnap');
        const original = btn.innerHTML;
        btn.innerHTML = '<span class="icon">✅</span><span>识别完成</span>';
        setTimeout(() => btn.innerHTML = original, 1500);
      }, 1800);
    });

    document.getElementById('btnGenerate').addEventListener('click', () => {
      if (selectedIngredients.size === 0) {
        alert('请先选择或识别至少一种食材哦～');
        return;
      }
      renderRecipes();
      showPage('recipes');
    });

    document.getElementById('toggleUrgent').addEventListener('change', (e) => {
      urgentFirst = e.target.checked;
      renderRecipes();
    });

    document.getElementById('btnBack').addEventListener('click', () => {
      showPage('recipes');
    });

    document.getElementById('btnShare').addEventListener('click', () => {
      alert('分享功能开发中，敬请期待！📤');
    });

    document.getElementById('btnFav').addEventListener('click', function() {
      this.textContent = this.textContent.includes('已收藏') ? '⭐ 收藏' : '❤️ 已收藏';
    });

    document.getElementById('btnStart').addEventListener('click', () => {
      alert('祝你烹饪愉快，享受美味时光！🍽️\n\n今日摄入约 ' + (currentRecipe ? currentRecipe.calories : 0) + ' kcal');
    });

    /* ================= 初始化 ================= */
    renderTags();
  </script>
</body>
</html>
