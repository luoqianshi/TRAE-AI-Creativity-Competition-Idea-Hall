<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f0f2f5;
  --bg2: #ffffff;
  --ink: #1a1a2e;
  --muted: #6b7280;
  --rule: #e5e7eb;
  --accent: #4a6cf7;
  --accent2: #7c3aed;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --shadow-lg: 0 10px 25px rgba(0,0,0,.1), 0 4px 10px rgba(0,0,0,.06);
  --sidebar-w: 240px;
  --nav-h: 0px;
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
}
html { font-size: 15px; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }

/* ===== Sidebar ===== */
.sidebar {
  width: var(--sidebar-w);
  min-height: 100vh;
  background: var(--bg2);
  border-right: 1px solid var(--rule);
  padding: 0;
  display: flex;
  flex-direction: column;
  position: fixed;
  left: 0; top: 0; bottom: 0;
  z-index: 100;
  transition: transform .3s;
}
.sidebar-brand {
  padding: 24px 20px 16px;
  border-bottom: 1px solid var(--rule);
  display: flex;
  align-items: center;
  gap: 10px;
}
.sidebar-brand .logo {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 1rem;
}
.sidebar-brand h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: -.01em; }
.sidebar-brand small { display: block; font-size: .7rem; color: var(--muted); font-weight: 400; }
.sidebar-nav { flex: 1; padding: 12px 10px; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: var(--radius-sm);
  color: var(--muted); cursor: pointer; transition: all .15s;
  font-size: .9rem; font-weight: 500;
  margin-bottom: 2px;
}
.nav-item:hover { background: var(--bg); color: var(--ink); }
.nav-item.active {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff; box-shadow: 0 2px 8px rgba(74,108,247,.3);
}
.nav-item .icon { font-size: 1.2rem; width: 24px; text-align: center; flex-shrink: 0; }
.nav-item .badge {
  margin-left: auto; font-size: .7rem; background: var(--bg); padding: 1px 8px;
  border-radius: 10px; color: var(--muted);
}
.nav-item.active .badge { background: rgba(255,255,255,.2); color: #fff; }

/* ===== Main ===== */
.main {
  margin-left: var(--sidebar-w);
  flex: 1;
  min-height: 100vh;
  padding: 28px 32px;
  max-width: calc(100vw - var(--sidebar-w));
}
.page { display: none; animation: fadeIn .25s ease; }
.page.active { display: block; }
@keyframes fadeIn { from{ opacity:0; transform:translateY(8px) } to{ opacity:1; transform:translateY(0) } }

.page-header {
  margin-bottom: 24px;
}
.page-header h2 { font-size: 1.5rem; font-weight: 700; }
.page-header p { color: var(--muted); font-size: .88rem; margin-top: 4px; }

/* ===== Cards & Stats ===== */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 16px; margin-bottom: 28px; }
.stat-card {
  background: var(--bg2); border-radius: var(--radius); padding: 20px;
  box-shadow: var(--shadow); border: 1px solid var(--rule);
}
.stat-card .stat-label { font-size: .8rem; color: var(--muted); font-weight: 500; }
.stat-card .stat-value { font-size: 1.8rem; font-weight: 700; margin-top: 4px; }
.stat-card .stat-value .unit { font-size: .9rem; font-weight: 400; color: var(--muted); }
.stat-card .stat-sub { font-size: .78rem; color: var(--muted); margin-top: 2px; }

/* ===== Subject Grid ===== */
.subject-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 16px; }
.subject-card {
  background: var(--bg2); border-radius: var(--radius);
  box-shadow: var(--shadow); border: 1px solid var(--rule);
  padding: 20px; cursor: pointer; transition: all .2s;
  position: relative; overflow: hidden;
}
.subject-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.subject-card .card-color {
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
}
.subject-card h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 6px; }
.subject-card .card-meta { font-size: .8rem; color: var(--muted); }
.subject-card .card-meta span { margin-right: 12px; }
.subject-card .card-actions {
  margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--rule);
  display: flex; gap: 8px; justify-content: flex-end;
}
.subject-card .countdown {
  display: inline-block; margin-top: 8px;
  font-size: .78rem; font-weight: 600; color: var(--accent);
}

/* ===== Buttons ===== */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 18px; border-radius: var(--radius-sm);
  font-size: .85rem; font-weight: 600; cursor: pointer;
  border: 1px solid var(--rule); background: var(--bg2);
  color: var(--ink); transition: all .15s;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff; border-color: transparent;
}
.btn-primary:hover { opacity: .9; color: #fff; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(74,108,247,.3); }
.btn-sm { padding: 5px 12px; font-size: .8rem; }
.btn-icon { padding: 6px 10px; font-size: 1rem; }
.btn-danger { color: var(--danger); border-color: var(--danger); }
.btn-danger:hover { background: var(--danger); color: #fff; }
.btn-success { color: var(--success); border-color: var(--success); }
.btn-success:hover { background: var(--success); color: #fff; }

/* ===== Modals ===== */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4);
  z-index: 200; align-items: center; justify-content: center;
  backdrop-filter: blur(2px);
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--bg2); border-radius: var(--radius);
  width: 90%; max-width: 560px; max-height: 85vh;
  box-shadow: var(--shadow-lg); animation: modalIn .2s ease;
  display: flex; flex-direction: column;
}
@keyframes modalIn { from{ opacity:0; transform:scale(.95) translateY(10px) } to{ opacity:1; transform:scale(1) translateY(0) } }
.modal-header {
  padding: 20px 24px 16px; border-bottom: 1px solid var(--rule);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-header h3 { font-size: 1.1rem; font-weight: 700; }
.modal-close {
  width: 32px; height: 32px; border-radius: 50%;
  border: none; background: var(--bg); cursor: pointer;
  font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
  transition: background .15s; color: var(--muted);
}
.modal-close:hover { background: var(--rule); color: var(--ink); }
.modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
.modal-footer {
  padding: 16px 24px 20px; border-top: 1px solid var(--rule);
  display: flex; justify-content: flex-end; gap: 8px;
}

/* ===== Form ===== */
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: .82rem; font-weight: 600; margin-bottom: 6px; color: var(--ink); }
.form-group .hint { font-size: .75rem; color: var(--muted); margin-top: 4px; }
.form-input, .form-textarea, .form-select {
  width: 100%; padding: 10px 12px; border: 1px solid var(--rule);
  border-radius: var(--radius-sm); font-size: .88rem;
  font-family: var(--font); background: var(--bg2); color: var(--ink);
  transition: border-color .15s;
}
.form-input:focus, .form-textarea:focus, .form-select:focus {
  outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(74,108,247,.1);
}
.form-textarea { min-height: 80px; resize: vertical; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ===== Subject Detail (MOC) ===== */
.moc-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
}
.moc-header .moc-info h2 { font-size: 1.4rem; }
.moc-header .moc-info .moc-meta { color: var(--muted); font-size: .82rem; margin-top: 4px; }
.moc-tabs {
  display: flex; gap: 0; border-bottom: 2px solid var(--rule);
  margin-bottom: 24px;
}
.moc-tab {
  padding: 10px 20px; font-size: .88rem; font-weight: 600;
  color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent;
  margin-bottom: -2px; transition: all .15s;
}
.moc-tab:hover { color: var(--ink); }
.moc-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.moc-content { display: none; }
.moc-content.active { display: block; }

/* Chapter list */
.chapter-list { display: flex; flex-direction: column; gap: 12px; }
.chapter-item {
  background: var(--bg2); border: 1px solid var(--rule);
  border-radius: var(--radius-sm); padding: 16px 18px;
  transition: box-shadow .15s;
}
.chapter-item:hover { box-shadow: var(--shadow); }
.chapter-item .chapter-head {
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer;
}
.chapter-item .chapter-head h4 { font-size: .95rem; font-weight: 600; }
.chapter-item .chapter-head .chapter-num {
  display: inline-block; font-size: .75rem; font-weight: 700;
  color: var(--accent); background: rgba(74,108,247,.1);
  padding: 1px 10px; border-radius: 10px; margin-right: 8px;
}
.chapter-item .chapter-body {
  margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--rule);
  display: none;
}
.chapter-item.expanded .chapter-body { display: block; }
.chapter-body .field { margin-bottom: 10px; }
.chapter-body .field-label { font-size: .78rem; font-weight: 700; color: var(--accent2); margin-bottom: 4px; }
.chapter-body .field-value { font-size: .85rem; color: var(--ink); white-space: pre-wrap; line-height: 1.7; }
.chapter-body .field-attachments { margin-top: 8px; }
.chapter-body .att-link {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: .8rem; padding: 3px 10px; background: var(--bg);
  border-radius: 6px; margin: 2px 4px 2px 0;
}
.att-link .att-del { cursor: pointer; color: var(--danger); font-size: .7rem; margin-left: 4px; }

/* ===== Attachments section ===== */
.attachments-grid { display: flex; flex-direction: column; gap: 8px; }
.attachment-item {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg2); border: 1px solid var(--rule);
  border-radius: var(--radius-sm); padding: 12px 16px;
}
.attachment-item .att-icon { font-size: 1.3rem; flex-shrink: 0; }
.attachment-item .att-info { flex: 1; min-width: 0; }
.attachment-item .att-info .att-name { font-weight: 600; font-size: .88rem; }
.attachment-item .att-info .att-url { font-size: .78rem; color: var(--accent); word-break: break-all; }
.attachment-item .att-info .att-note { font-size: .78rem; color: var(--muted); margin-top: 2px; }

/* ===== Plans ===== */
.plan-toggle {
  display: flex; gap: 0; border: 1px solid var(--rule); border-radius: var(--radius-sm);
  overflow: hidden; margin-bottom: 20px; width: fit-content;
}
.plan-toggle button {
  padding: 8px 20px; font-size: .85rem; font-weight: 600;
  border: none; background: var(--bg2); color: var(--muted); cursor: pointer;
  transition: all .15s;
}
.plan-toggle button.active {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
}

.plan-view { display: none; }
.plan-view.active { display: block; }

.plan-week-grid { display: grid; gap: 12px; }
.plan-week-card {
  background: var(--bg2); border: 1px solid var(--rule);
  border-radius: var(--radius-sm); padding: 16px 18px;
}
.plan-week-card .week-label {
  font-size: .82rem; font-weight: 700; color: var(--accent);
  margin-bottom: 8px;
}
.plan-week-card .week-tasks { display: flex; flex-direction: column; gap: 6px; }
.plan-week-card .task-item {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 8px; border-radius: 6px; font-size: .85rem;
  transition: background .15s;
}
.plan-week-card .task-item:hover { background: var(--bg); }
.task-item .task-check {
  width: 18px; height: 18px; border: 2px solid var(--rule);
  border-radius: 50%; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.task-item .task-check.done { background: var(--success); border-color: var(--success); color: #fff; }
.task-item .task-check.done::after { content: '✓'; font-size: .7rem; font-weight: 700; }
.task-item .task-text { flex: 1; }
.task-item .task-text.done { text-decoration: line-through; color: var(--muted); }
.task-item .task-date { font-size: .75rem; color: var(--muted); flex-shrink: 0; }
.task-item .task-tag {
  font-size: .7rem; padding: 1px 8px; border-radius: 6px;
  background: rgba(74,108,247,.1); color: var(--accent); flex-shrink: 0;
}

/* Monthly plan */
.plan-month-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }
.plan-month-card {
  background: var(--bg2); border: 1px solid var(--rule);
  border-radius: var(--radius-sm); padding: 16px; min-height: 200px;
}
.plan-month-card .month-label { font-size: .9rem; font-weight: 700; color: var(--accent); margin-bottom: 10px; }
.plan-month-card .month-tasks { display: flex; flex-direction: column; gap: 6px; }

/* ===== Countdown ===== */
.countdown-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap: 16px; }
.countdown-card {
  background: var(--bg2); border-radius: var(--radius);
  box-shadow: var(--shadow); border: 1px solid var(--rule);
  padding: 24px; text-align: center; position: relative; overflow: hidden;
}
.countdown-card .cd-bg {
  position: absolute; top: -50%; right: -50%; width: 100%; height: 100%;
  background: radial-gradient(circle, rgba(74,108,247,.05) 0%, transparent 70%);
  pointer-events: none;
}
.countdown-card .cd-subject { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
.countdown-card .cd-date { font-size: .78rem; color: var(--muted); margin-bottom: 16px; }
.countdown-card .cd-number {
  font-size: 3rem; font-weight: 800; line-height: 1;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.countdown-card .cd-label { font-size: .8rem; color: var(--muted); margin-top: 4px; }
.countdown-card .cd-unit { font-size: .85rem; font-weight: 600; color: var(--muted); }

/* ===== Empty state ===== */
.empty-state {
  text-align: center; padding: 48px 20px; color: var(--muted);
}
.empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; opacity: .5; }
.empty-state h3 { font-size: 1.1rem; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
.empty-state p { font-size: .85rem; }

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; padding: 20px 16px; max-width: 100vw; }
  .stats-grid { grid-template-columns: repeat(2,1fr); }
  .subject-grid { grid-template-columns: 1fr; }
  .form-row { grid-template-columns: 1fr; }
  .plan-month-grid { grid-template-columns: repeat(2,1fr); }
  .countdown-grid { grid-template-columns: repeat(2,1fr); }
  .mobile-toggle {
    display: flex !important; position: fixed; top: 16px; right: 16px;
    z-index: 101; width: 40px; height: 40px; border-radius: var(--radius-sm);
    background: var(--bg2); border: 1px solid var(--rule);
    align-items: center; justify-content: center; font-size: 1.2rem;
    cursor: pointer; box-shadow: var(--shadow);
  }
}
.mobile-toggle { display: none; }
.sidebar-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.3);
  z-index: 99;
}
.sidebar-overlay.show { display: block; }
@media (max-width: 480px) {
  .stats-grid { grid-template-columns: 1fr; }
  .plan-month-grid { grid-template-columns: 1fr; }
  .countdown-grid { grid-template-columns: 1fr; }
}

/* ===== Toast ===== */
.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--ink); color: #fff; padding: 12px 20px;
  border-radius: var(--radius-sm); font-size: .85rem;
  box-shadow: var(--shadow-lg); z-index: 300;
  animation: toastIn .3s ease; max-width: 360px;
}
@keyframes toastIn { from{ opacity:0; transform:translateY(20px) } to{ opacity:1; transform:translateY(0) } }
.toast.toast-remove { animation: toastOut .3s ease forwards; }
@keyframes toastOut { to{ opacity:0; transform:translateY(20px) } }

/* ===== Misc ===== */
.ml-auto { margin-left: auto; }
.flex { display: flex; }
.flex-center { align-items: center; }
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.mb-8 { margin-bottom: 8px; }
.mb-16 { margin-bottom: 16px; }
.mt-8 { margin-top: 8px; }
.text-muted { color: var(--muted); }
.text-sm { font-size: .82rem; }
.text-center { text-align: center; }
.w-full { width: 100%; }
</style>
</head>
<body>

<!-- Mobile Toggle -->
<button class="mobile-toggle" id="mobileToggle" aria-label="Toggle menu">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- ===== SIDEBAR ===== -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="logo">KB</div>
    <div>
      <h1>学习知识库</h1>
      <small>LearnKB · 智能学习助手</small>
    </div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-item active" data-page="dashboard" onclick="navigateTo('dashboard')">
      <span class="icon">📊</span> 仪表盘
    </div>
    <div class="nav-item" data-page="subjects" onclick="navigateTo('subjects')">
      <span class="icon">📚</span> 知识库
      <span class="badge" id="subjectBadge">0</span>
    </div>
    <div class="nav-item" data-page="plans" onclick="navigateTo('plans')">
      <span class="icon">📋</span> 学习计划
    </div>
    <div class="nav-item" data-page="countdown" onclick="navigateTo('countdown')">
      <span class="icon">⏰</span> 倒计时
    </div>
  </nav>
  <div style="padding:16px 20px;border-top:1px solid var(--rule);font-size:.75rem;color:var(--muted);text-align:center;">
    数据存储在本地浏览器
  </div>
</aside>

<!-- ===== MAIN ===== -->
<main class="main">

  <!-- ===== DASHBOARD ===== -->
  <div class="page active" id="page-dashboard">
    <div class="page-header">
      <h2>📊 学习仪表盘</h2>
      <p>总览你的学习进度、计划和关键节点</p>
    </div>
    <div class="stats-grid" id="dashboardStats"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div>
        <h3 style="font-size:1rem;font-weight:600;margin-bottom:12px;">📌 近期任务</h3>
        <div id="dashboardTasks" style="background:var(--bg2);border-radius:var(--radius);border:1px solid var(--rule);padding:16px;min-height:120px;"></div>
      </div>
      <div>
        <h3 style="font-size:1rem;font-weight:600;margin-bottom:12px;">⏰ 即将截止</h3>
        <div id="dashboardCountdowns" style="background:var(--bg2);border-radius:var(--radius);border:1px solid var(--rule);padding:16px;min-height:120px;"></div>
      </div>
    </div>
  </div>

  <!-- ===== SUBJECTS ===== -->
  <div class="page" id="page-subjects">
    <div class="page-header flex flex-center" style="justify-content:space-between;">
      <div>
        <h2>📚 知识库</h2>
        <p>管理所有学习科目，每个科目包含 MOC 章节重点与附件资料</p>
      </div>
      <button class="btn btn-primary" onclick="openSubjectModal()">+ 添加科目</button>
    </div>
    <div class="subject-grid" id="subjectGrid"></div>
  </div>

  <!-- ===== SUBJECT DETAIL (MOC) ===== -->
  <div class="page" id="page-subject-detail">
    <div class="moc-header">
      <div class="moc-info">
        <div style="font-size:.8rem;color:var(--muted);margin-bottom:4px;">
          <a href="#" onclick="event.preventDefault();navigateTo('subjects')">← 返回知识库</a>
        </div>
        <h2 id="mocSubjectTitle">科目名称</h2>
        <div class="moc-meta" id="mocSubjectMeta"></div>
      </div>
      <div class="flex gap-8">
        <button class="btn btn-sm" onclick="editCurrentSubject()">✏️ 编辑科目</button>
        <button class="btn btn-sm btn-danger" onclick="deleteCurrentSubject()">🗑 删除</button>
      </div>
    </div>

    <div class="moc-tabs">
      <div class="moc-tab active" data-moc-tab="chapters" onclick="switchMocTab('chapters')">📖 章节重点</div>
      <div class="moc-tab" data-moc-tab="attachments" onclick="switchMocTab('attachments')">📎 附件资料</div>
    </div>

    <!-- Chapters Tab -->
    <div class="moc-content active" id="moc-chapters">
      <div class="flex flex-center gap-8 mb-16">
        <button class="btn btn-sm btn-primary" onclick="openChapterModal()">+ 添加章节</button>
      </div>
      <div class="chapter-list" id="chapterList"></div>
    </div>

    <!-- Attachments Tab -->
    <div class="moc-content" id="moc-attachments">
      <div class="flex flex-center gap-8 mb-16">
        <button class="btn btn-sm btn-primary" onclick="openAttachmentModal()">+ 添加附件</button>
      </div>
      <div class="attachments-grid" id="attachmentList"></div>
    </div>
  </div>

  <!-- ===== PLANS ===== -->
  <div class="page" id="page-plans">
    <div class="page-header flex flex-center" style="justify-content:space-between;">
      <div>
        <h2>📋 学习计划</h2>
        <p>按周和月分布学习任务，追踪进度</p>
      </div>
      <button class="btn btn-sm btn-primary" onclick="openTaskModal()">+ 添加任务</button>
    </div>

    <div class="plan-toggle">
      <button class="active" data-plan="weekly" onclick="switchPlanView('weekly')">📅 周计划</button>
      <button data-plan="monthly" onclick="switchPlanView('monthly')">📆 月计划</button>
    </div>

    <!-- Weekly -->
    <div class="plan-view active" id="plan-weekly">
      <div class="plan-week-grid" id="weeklyPlanGrid"></div>
    </div>

    <!-- Monthly -->
    <div class="plan-view" id="plan-monthly">
      <div class="plan-month-grid" id="monthlyPlanGrid"></div>
    </div>
  </div>

  <!-- ===== COUNTDOWN ===== -->
  <div class="page" id="page-countdown">
    <div class="page-header">
      <h2>⏰ 倒计时</h2>
      <p>所有科目的考试截止日期倒计时</p>
    </div>
    <div class="countdown-grid" id="countdownGrid"></div>
  </div>

</main>

<!-- ===== MODAL: Subject ===== -->
<div class="modal-overlay" id="subjectModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="subjectModalTitle">添加科目</h3>
      <button class="modal-close" onclick="closeModal('subjectModal')">✕</button>

    <div class="modal-body">
      <div class="form-group">

      <div class="form-group">
        <label>科目描述</label>

        <label>考试/截止日期</label>
        <input class="form-input" id="subjectExamDate" type="date" />

      <div class="form-group">
        <label>颜色标签</label>
        <div class="flex gap-8" id="colorPicker">

          <span class="color-swatch" data-color="#4a6cf7" style="background:#4a6cf7;width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;display:inline-block;"></span>
          <span class="color-swatch" data-color="#7c3aed" style="background:#7c3aed;width:28px;height:28px;border-radius:50%;cursor:pointer;display:inline-block;"></span>
          <span class="color-swatch" data-color="#10b981" style="background:#10b981;width:28px;height:28px;border-radius:50%;cursor:pointer;display:inline-block;"></span>
          <span class="color-swatch" data-color="#f59e0b" style="background:#f59e0b;width:28px;height:28px;border-radius:50%;cursor:pointer;display:inline-block;"></span>
          <span class="color-swatch" data-color="#ef4444" style="background:#ef4444;width:28px;height:28px;border-radius:50%;cursor:pointer;display:inline-block;"></span>
          <span class="color-swatch" data-color="#06b6d4" style="background:#06b6d4;width:28px;height:28px;border-radius:50%;cursor:pointer;display:inline-block;"></span>
        </div>
      </div>

    <div class="modal-footer">

<!-- ===== MODAL: Chapter ===== -->
<div class="modal-overlay" id="chapterModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="chapterModalTitle">添加章节</h3>
      <button class="modal-close" onclick="closeModal('chapterModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>章节标题 *</label>
        <input class="form-input" id="chapterTitle" placeholder="例如：第一章 函数与极限" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>章节编号</label>
          <input class="form-input" id="chapterNumber" type="number" min="1" placeholder="1" />
        </div>
        <div class="form-group">
          <label>状态</label>
          <select class="form-select" id="chapterStatus">
            <option value="未开始">未开始</option>
            <option value="学习中">学习中</option>
            <option value="已掌握">已掌握</option>

        </div>
      </div>
      <div class="form-group">
        <label>📌 本章重点 <span class="hint">(从学习资料中总结的核心知识点)</span></label>
        <textarea class="form-textarea" id="chapterKeyPoints" rows="5" placeholder="总结本章的核心概念、公式、定理等关键知识点..."></textarea>
      </div>
      <div class="form-group">
        <label>📝 常考题型 <span class="hint">(本章常见的考试题型)</span></label>
        <textarea class="form-textarea" id="chapterExamTypes" rows="3" placeholder="选择题、填空题、计算题、证明题..."></textarea>
      </div>
      <div class="form-group">
        <label>🔗 补充链接/附件</label>
        <div id="chapterAttachmentsContainer">
          <div class="flex gap-8 mb-8 att-row">
            <input class="form-input" placeholder="附件名称" style="flex:2;" />
            <input class="form-input" placeholder="链接 URL" style="flex:3;" />
            <button class="btn btn-sm btn-danger" onclick="this.parentElement.remove()">✕</button>
          </div>

        <button class="btn btn-sm mt-8" onclick="addChapterAttRow()">+ 添加附件行</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('chapterModal')">取消</button>
      <button class="btn btn-primary" onclick="saveChapter()">保存</button>
    </div>
  </div>
</div>

<!-- ===== MODAL: Attachment (subject-level) ===== -->
<div class="modal-overlay" id="attachmentModal">
  <div class="modal">
    <div class="modal-header">
      <h3>添加附件资料</h3>
      <button class="modal-close" onclick="closeModal('attachmentModal')">✕</button>

    <div class="modal-body">

    <div class="modal-footer">
      <button class="btn" onclick="closeModal('attachmentModal')">取消</button>

  </div>
</div>

<!-- ===== MODAL: Task ===== -->
<div class="modal-overlay" id="taskModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="taskModalTitle">添加任务</h3>
      <button class="modal-close" onclick="closeModal('taskModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>任务描述 *</label>
        <input class="form-input" id="taskDesc" placeholder="例如：完成第三章复习..." />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>所属科目</label>
          <select class="form-select" id="taskSubject"></select>
        </div>
        <div class="form-group">
          <label>计划类型</label>
          <select class="form-select" id="taskPlanType">
            <option value="weekly">周计划</option>
            <option value="monthly">月计划</option>
          </select>

        <label>日期</label>
        <input class="form-input" id="taskDate" type="date" />
      </div>

        <input class="form-input" id="taskTag" placeholder="例如：复习、习题、预习..." />
      </div>

      <button class="btn" onclick="closeModal('taskModal')">取消</button>
      <button class="btn btn-primary" onclick="saveTask()">保存</button>
    </div>
  </div>
</div>

<script>
// ===== DATA LAYER =====
const STORAGE_KEY = 'learnkb_data';

function getDefaultData() {
  return { subjects: [], tasks: [], nextId: 1 };
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      // Ensure all subjects have the 'attachments' field
      d.subjects.forEach(s => {
        if (!s.attachments) s.attachments = [];
        if (!s.color) s.color = '#4a6cf7';
      });
      return d;
    }
  } catch(e) { console.warn('Data load error:', e); }
  return getDefaultData();
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function genId(data) {
  return 'id_' + (data.nextId++);
}

let DATA = loadData();

// ===== STATE =====
let currentSubjectId = null;
let editingSubjectId = null;
let editingChapterId = null;
let editingChapterSubjectId = null;

// ===== NAVIGATION =====
function navigateTo(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const pageEl = document.getElementById('page-' + page);
  if (pageEl) pageEl.classList.add('active');
  const navEl = document.querySelector(`.nav-item[data-page="${page}"]`);
  if (navEl) navEl.classList.add('active');
  // Close mobile sidebar
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');

  if (page === 'dashboard') renderDashboard();
  else if (page === 'subjects') renderSubjects();
  else if (page === 'plans') renderPlans();
  else if (page === 'countdown') renderCountdown();

  updateBadge();
}

// Mobile sidebar
document.getElementById('mobileToggle').addEventListener('click', function() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
});
document.getElementById('sidebarOverlay').addEventListener('click', function() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
});

// ===== MODAL HELPERS =====
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('show');
  });
});

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.classList.add('toast-remove'); setTimeout(() => t.remove(), 300); }, 2500);
}

// Color picker
document.querySelectorAll('.color-swatch').forEach(el => {
  el.addEventListener('click', function() {
    document.querySelectorAll('.color-swatch').forEach(s => s.style.border = '2px solid transparent');
    this.style.border = '2px solid var(--ink)';
    const rb = document.querySelector('input[name="subjectColor"]');
    rb.value = this.dataset.color;
  });
});

function updateBadge() {
  document.getElementById('subjectBadge').textContent = DATA.subjects.length;
}

// ===== SUBJECTS =====
function renderSubjects() {
  const grid = document.getElementById('subjectGrid');
  const subs = DATA.subjects;
  if (subs.length === 0) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1;">
        <div class="empty-icon">📚</div>
        <h3>还没有添加科目</h3>
        <p>点击右上角「添加科目」开始建立你的知识库</p>
      </div>
    `;
    return;
  }
  grid.innerHTML = subs.map(s => {
    const chCnt = (s.chapters || []).length;
    const attCnt = (s.attachments || []).length;
    let cdHtml = '';
    if (s.examDate) {
      const days = getDaysUntil(s.examDate);
      cdHtml = `<div class="countdown">⏰ ${days >= 0 ? '剩余 ' + days + ' 天' : '已过期 ' + Math.abs(days) + ' 天'}</div>`;
    }
    return `
      <div class="subject-card" onclick="openSubjectDetail('${s.id}')">
        <div class="card-color" style="background:${s.color || '#4a6cf7'}"></div>
        <h3>${escHtml(s.name)}</h3>
        <div class="card-meta">
          <span>📖 ${chCnt} 章</span>
          <span>📎 ${attCnt} 附件</span>
        </div>
        ${cdHtml}
        <div class="card-actions" onclick="event.stopPropagation();">
          <button class="btn btn-sm" onclick="openSubjectModal('${s.id}')">✏️ 编辑</button>
          <button class="btn btn-sm btn-danger" onclick="confirmDeleteSubject('${s.id}')">🗑 删除</button>
        </div>
      </div>
    `;
  }).join('');
}

function openSubjectModal(id) {
  editingSubjectId = id || null;
  document.getElementById('subjectModalTitle').textContent = id ? '编辑科目' : '添加科目';
  document.getElementById('subjectName').value = '';
  document.getElementById('subjectDesc').value = '';
  document.getElementById('subjectExamDate').value = '';
  document.querySelectorAll('.color-swatch').forEach(s => s.style.border = '2px solid transparent');
  document.querySelector('.color-swatch').style.border = '2px solid var(--ink)';
  document.querySelector('input[name="subjectColor"]').value = '#4a6cf7';

  if (id) {
    const s = DATA.subjects.find(x => x.id === id);
    if (s) {
      document.getElementById('subjectName').value = s.name;
      document.getElementById('subjectDesc').value = s.description || '';
      document.getElementById('subjectExamDate').value = s.examDate || '';
      document.querySelectorAll('.color-swatch').forEach(el => {
        el.style.border = el.dataset.color === (s.color || '#4a6cf7') ? '2px solid var(--ink)' : '2px solid transparent';
        if (el.dataset.color === (s.color || '#4a6cf7')) {
          document.querySelector('input[name="subjectColor"]').value = el.dataset.color;
        }
      });
    }
  }
  openModal('subjectModal');
}

function saveSubject() {
  const name = document.getElementById('subjectName').value.trim();
  if (!name) { toast('请输入科目名称'); return; }
  const desc = document.getElementById('subjectDesc').value.trim();
  const examDate = document.getElementById('subjectExamDate').value;
  const color = document.querySelector('input[name="subjectColor"]').value;

  if (editingSubjectId) {
    const s = DATA.subjects.find(x => x.id === editingSubjectId);
    if (s) {
      s.name = name;
      s.description = desc;
      s.examDate = examDate;
      s.color = color;
    }
  } else {
    DATA.subjects.push({
      id: genId(DATA),
      name, description: desc, examDate, color,
      chapters: [],
      attachments: []
    });
  }
  saveData(DATA);
  closeModal('subjectModal');
  toast(editingSubjectId ? '科目已更新' : '科目已添加');
  editingSubjectId = null;
  renderSubjects();
  updateBadge();
}

function confirmDeleteSubject(id) {
  if (confirm('确定要删除这个科目及其所有章节和附件吗？')) {
    DATA.subjects = DATA.subjects.filter(s => s.id !== id);
    saveData(DATA);
    toast('科目已删除');
    renderSubjects();
    updateBadge();
  }
}

// ===== SUBJECT DETAIL (MOC) =====
function openSubjectDetail(id) {
  currentSubjectId = id;
  const s = DATA.subjects.find(x => x.id === id);
  if (!s) { toast('科目不存在'); return; }
  document.getElementById('mocSubjectTitle').textContent = s.name;
  document.getElementById('mocSubjectMeta').textContent =
    `📖 ${(s.chapters || []).length} 章 · 📎 ${(s.attachments || []).length} 附件` +
    (s.examDate ? ` · 截止: ${s.examDate}` : '');
  switchMocTab('chapters');
  renderChapters();
  renderAttachments();
  navigateTo('subject-detail');
}

function editCurrentSubject() {
  if (currentSubjectId) openSubjectModal(currentSubjectId);
}

function deleteCurrentSubject() {
  if (currentSubjectId) {
    if (confirm('确定要删除这个科目吗？')) {
      DATA.subjects = DATA.subjects.filter(s => s.id !== currentSubjectId);
      saveData(DATA);
      toast('科目已删除');
      navigateTo('subjects');
    }
  }
}

function switchMocTab(tab) {
  document.querySelectorAll('.moc-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.moc-content').forEach(c => c.classList.remove('active'));
  document.querySelector(`.moc-tab[data-moc-tab="${tab}"]`).classList.add('active');
  document.getElementById('moc-' + tab).classList.add('active');
}

function getCurrentSubject() {
  return DATA.subjects.find(s => s.id === currentSubjectId);
}

// ===== CHAPTERS =====
function renderChapters() {
  const s = getCurrentSubject();
  if (!s) return;
  const list = document.getElementById('chapterList');
  const chs = s.chapters || [];
  if (chs.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">📖</div><h3>暂无章节</h3><p>点击「添加章节」开始整理每章的重点和题型</p></div>`;
    return;
  }
  list.innerHTML = chs.map((ch, idx) => {
    const atts = (ch.attachments || []).map(a =>
      `<span class="att-link">🔗 ${escHtml(a.name)}${a.url ? ` <a href="${escHtml(a.url)}" target="_blank">打开</a>` : ''}<span class="att-del" onclick="event.stopPropagation();deleteChapterAtt('${ch.id}','${a.id}')">✕</span></span>`
    ).join('');
    const statusColors = { '未开始': '#ef4444', '学习中': '#f59e0b', '已掌握': '#10b981' };
    return `
      <div class="chapter-item" id="ch-${ch.id}">
        <div class="chapter-head" onclick="toggleChapter('${ch.id}')">
          <div>
            <span class="chapter-num">${ch.number || idx + 1}</span>
            <h4 style="display:inline;">${escHtml(ch.title)}</h4>
          </div>
          <div class="flex gap-8">
            <span style="font-size:.75rem;padding:1px 8px;border-radius:6px;background:${statusColors[ch.status] || '#6b7280'}20;color:${statusColors[ch.status] || '#6b7280'};font-weight:600;">${ch.status || '未开始'}</span>
            <span class="text-muted text-sm">${chs.length > 0 ? '展开 ▼' : ''}</span>
          </div>
        </div>
        <div class="chapter-body">
          <div class="field">
            <div class="field-label">📌 重点内容</div>
            <div class="field-value">${ch.keyPoints ? escHtml(ch.keyPoints) : '<span class="text-muted">暂未填写</span>'}</div>
          </div>
          <div class="field">
            <div class="field-label">📝 常考题型</div>
            <div class="field-value">${ch.examTypes ? escHtml(ch.examTypes) : '<span class="text-muted">暂未填写</span>'}</div>
          </div>
          ${atts ? `<div class="field"><div class="field-label">🔗 附件链接</div><div class="field-attachments">${atts}</div></div>` : ''}
          <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--rule);display:flex;gap:8px;">
            <button class="btn btn-sm" onclick="event.stopPropagation();openChapterModal('${ch.id}')">✏️ 编辑</button>
            <button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteChapter('${ch.id}')">🗑 删除</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function toggleChapter(id) {
  const el = document.getElementById('ch-' + id);
  if (el) el.classList.toggle('expanded');
}

function openChapterModal(chapterId) {
  editingChapterId = chapterId || null;
  document.getElementById('chapterModalTitle').textContent = chapterId ? '编辑章节' : '添加章节';
  document.getElementById('chapterTitle').value = '';
  document.getElementById('chapterNumber').value = '';
  document.getElementById('chapterStatus').value = '未开始';
  document.getElementById('chapterKeyPoints').value = '';
  document.getElementById('chapterExamTypes').value = '';
  document.getElementById('chapterAttachmentsContainer').innerHTML = '';

  if (chapterId) {
    const s = getCurrentSubject();
    const ch = (s.chapters || []).find(c => c.id === chapterId);
    if (ch) {
      document.getElementById('chapterTitle').value = ch.title || '';
      document.getElementById('chapterNumber').value = ch.number || '';
      document.getElementById('chapterStatus').value = ch.status || '未开始';
      document.getElementById('chapterKeyPoints').value = ch.keyPoints || '';
      document.getElementById('chapterExamTypes').value = ch.examTypes || '';
      (ch.attachments || []).forEach(a => {
        addChapterAttRow(a.name, a.url, a.id);
      });
    }
  }
  openModal('chapterModal');
}

function addChapterAttRow(name, url, attId) {
  const container = document.getElementById('chapterAttachmentsContainer');
  const row = document.createElement('div');
  row.className = 'flex gap-8 mb-8 att-row';
  row.innerHTML = `
    <input class="form-input" placeholder="附件名称" value="${escHtml(name || '')}" style="flex:2;" />
    <input class="form-input" placeholder="链接 URL" value="${escHtml(url || '')}" style="flex:3;" />
    <input type="hidden" class="att-id" value="${attId || ''}" />
    <button class="btn btn-sm btn-danger" onclick="this.parentElement.remove()">✕</button>
  `;
  container.appendChild(row);
}

function saveChapter() {
  const s = getCurrentSubject();
  if (!s) { toast('请先选择科目'); return; }
  const title = document.getElementById('chapterTitle').value.trim();
  if (!title) { toast('请输入章节标题'); return; }

  const attRows = document.querySelectorAll('#chapterAttachmentsContainer .att-row');
  const atts = Array.from(attRows).map(row => {
    const inputs = row.querySelectorAll('input');
    const name = inputs[0].value.trim();
    const url = inputs[1].value.trim();
    const attId = inputs[2] ? inputs[2].value : '';
    if (!name && !url) return null;
    return { id: attId || genId(DATA), name: name || '未命名附件', url: url || '' };
  }).filter(Boolean);

  if (editingChapterId) {
    const ch = (s.chapters || []).find(c => c.id === editingChapterId);
    if (ch) {
      ch.title = title;
      ch.number = parseInt(document.getElementById('chapterNumber').value) || (s.chapters.length + 1);
      ch.status = document.getElementById('chapterStatus').value;
      ch.keyPoints = document.getElementById('chapterKeyPoints').value.trim();
      ch.examTypes = document.getElementById('chapterExamTypes').value.trim();
      ch.attachments = atts;
    }
  } else {
    if (!s.chapters) s.chapters = [];
    s.chapters.push({
      id: genId(DATA),
      title,
      number: parseInt(document.getElementById('chapterNumber').value) || (s.chapters.length + 1),
      status: document.getElementById('chapterStatus').value,
      keyPoints: document.getElementById('chapterKeyPoints').value.trim(),
      examTypes: document.getElementById('chapterExamTypes').value.trim(),
      attachments: atts
    });
  }
  saveData(DATA);
  closeModal('chapterModal');
  toast(editingChapterId ? '章节已更新' : '章节已添加');
  renderChapters();
  // Update meta
  document.getElementById('mocSubjectMeta').textContent =
    `📖 ${(s.chapters || []).length} 章 · 📎 ${(s.attachments || []).length} 附件` +
    (s.examDate ? ` · 截止: ${s.examDate}` : '');
}

function deleteChapter(id) {
  if (!confirm('确定要删除这个章节吗？')) return;
  const s = getCurrentSubject();
  if (s) {
    s.chapters = (s.chapters || []).filter(c => c.id !== id);
    saveData(DATA);
    toast('章节已删除');
    renderChapters();
  }
}

function deleteChapterAtt(chapterId, attId) {
  const s = getCurrentSubject();
  if (!s) return;
  const ch = (s.chapters || []).find(c => c.id === chapterId);
  if (ch) {
    ch.attachments = (ch.attachments || []).filter(a => a.id !== attId);
    saveData(DATA);
    renderChapters();
    toast('附件已删除');
  }
}

// ===== ATTACHMENTS (Subject-level) =====
function renderAttachments() {
  const s = getCurrentSubject();
  if (!s) return;
  const list = document.getElementById('attachmentList');
  const atts = s.attachments || [];
  if (atts.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">📎</div><h3>暂无附件资料</h3><p>添加你的专业资料、教材链接、笔记等补充资源</p></div>`;
    return;
  }
  list.innerHTML = atts.map(a => `
    <div class="attachment-item">
      <div class="att-icon">📄</div>
      <div class="att-info">
        <div class="att-name">${escHtml(a.name)}</div>
        ${a.url ? `<div class="att-url"><a href="${escHtml(a.url)}" target="_blank">${escHtml(a.url)}</a></div>` : ''}
        ${a.note ? `<div class="att-note">${escHtml(a.note)}</div>` : ''}
      </div>
      <button class="btn btn-sm btn-danger" onclick="deleteAttachment('${a.id}')">✕</button>
    </div>
  `).join('');
}

function openAttachmentModal() {
  document.getElementById('attachmentName').value = '';
  document.getElementById('attachmentUrl').value = '';
  document.getElementById('attachmentNote').value = '';
  openModal('attachmentModal');
}

function saveAttachment() {
  const s = getCurrentSubject();
  if (!s) { toast('请先选择科目'); return; }
  const name = document.getElementById('attachmentName').value.trim();
  if (!name) { toast('请输入附件名称'); return; }
  const url = document.getElementById('attachmentUrl').value.trim();
  const note = document.getElementById('attachmentNote').value.trim();
  if (!s.attachments) s.attachments = [];
  s.attachments.push({ id: genId(DATA), name, url, note });
  saveData(DATA);
  closeModal('attachmentModal');
  toast('附件已添加');
  renderAttachments();
  document.getElementById('mocSubjectMeta').textContent =
    `📖 ${(s.chapters || []).length} 章 · 📎 ${s.attachments.length} 附件` +
    (s.examDate ? ` · 截止: ${s.examDate}` : '');
}

function deleteAttachment(id) {
  if (!confirm('确定要删除这个附件吗？')) return;
  const s = getCurrentSubject();
  if (s) {
    s.attachments = (s.attachments || []).filter(a => a.id !== id);
    saveData(DATA);
    toast('附件已删除');
    renderAttachments();
  }
}

// ===== PLANS =====
let planView = 'weekly';

function switchPlanView(view) {
  planView = view;
  document.querySelectorAll('.plan-toggle button').forEach(b => b.classList.remove('active'));
  document.querySelector(`.plan-toggle button[data-plan="${view}"]`).classList.add('active');
  document.querySelectorAll('.plan-view').forEach(v => v.classList.remove('active'));
  document.getElementById('plan-' + view).classList.add('active');
  renderPlans();
}

function renderPlans() {
  if (planView === 'weekly') renderWeeklyPlan();
  else renderMonthlyPlan();
}

function getWeekLabel(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const startOfYear = new Date(d.getFullYear(), 0, 1);
  const diff = d - startOfYear + (startOfYear.getTimezoneOffset() - d.getTimezoneOffset()) * 60000;
  const week = Math.ceil((diff / 86400000 + startOfYear.getDay() + 1) / 7);
  return `第 ${week} 周`;
}

function renderWeeklyPlan() {
  const grid = document.getElementById('weeklyPlanGrid');
  // Group tasks by week
  const weekTasks = {};
  const today = new Date();
  const weekBounds = [];
  for (let w = -1; w <= 4; w++) {
    const start = new Date(today);
    start.setDate(start.getDate() - start.getDay() + 1 + w * 7); // Monday
    const end = new Date(start);
    end.setDate(end.getDate() + 6);
    weekBounds.push({ start, end, label: w === -1 ? '上周' : w === 0 ? '本周' : w === 1 ? '下周' : `第${w+1}周` });
  }

  (DATA.tasks || []).filter(t => t.planType === 'weekly').forEach(task => {
    const td = new Date(task.date + 'T00:00:00');
    for (const wb of weekBounds) {
      if (td >= wb.start && td <= wb.end) {
        if (!weekTasks[wb.label]) weekTasks[wb.label] = [];
        weekTasks[wb.label].push(task);
        break;
      }
    }
  });

  if (Object.keys(weekTasks).length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="empty-icon">📋</div><h3>暂无周计划任务</h3><p>点击「添加任务」开始规划你的学习周</p></div>`;
    return;
  }

  grid.innerHTML = weekBounds.map(wb => {
    const tasks = weekTasks[wb.label] || [];
    return `
      <div class="plan-week-card">
        <div class="week-label">${wb.label} (${formatDate(wb.start)} - ${formatDate(wb.end)})</div>
        <div class="week-tasks">
          ${tasks.length === 0 ? '<span class="text-muted text-sm">暂无任务</span>' :
            tasks.map(t => renderTaskItem(t)).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function renderMonthlyPlan() {
  const grid = document.getElementById('monthlyPlanGrid');
  const today = new Date();
  const months = [];
  for (let m = -1; m <= 4; m++) {
    const d = new Date(today.getFullYear(), today.getMonth() + m, 1);
    months.push({
      label: `${d.getFullYear()}年${d.getMonth()+1}月`,
      year: d.getFullYear(),
      month: d.getMonth() + 1
    });
  }

  const monthTasks = {};
  (DATA.tasks || []).filter(t => t.planType === 'monthly').forEach(task => {
    const td = new Date(task.date + 'T00:00:00');
    const key = `${td.getFullYear()}年${td.getMonth()+1}月`;
    if (!monthTasks[key]) monthTasks[key] = [];
    monthTasks[key].push(task);
  });

  grid.innerHTML = months.map(m => {
    const tasks = monthTasks[m.label] || [];
    return `
      <div class="plan-month-card">
        <div class="month-label">${m.label}</div>
        <div class="month-tasks">
          ${tasks.length === 0 ? '<span class="text-muted text-sm">暂无任务</span>' :
            tasks.map(t => renderTaskItem(t)).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function renderTaskItem(task) {
  const done = task.done ? 'done' : '';
  return `
    <div class="task-item" data-task-id="${task.id}">
      <div class="task-check ${done}" onclick="toggleTaskDone('${task.id}')"></div>
      <span class="task-text ${done}">${escHtml(task.desc)}</span>
      <span class="task-date">${formatDate(new Date(task.date + 'T00:00:00'))}</span>
      ${task.tag ? `<span class="task-tag">${escHtml(task.tag)}</span>` : ''}
      <button class="btn btn-sm btn-danger" style="padding:2px 6px;font-size:.7rem;" onclick="deleteTask('${task.id}')">✕</button>
    </div>
  `;
}

function toggleTaskDone(id) {
  const task = (DATA.tasks || []).find(t => t.id === id);
  if (task) {
    task.done = !task.done;
    saveData(DATA);
    renderPlans();
  }
}

function deleteTask(id) {
  if (!confirm('确定要删除这个任务吗？')) return;
  DATA.tasks = (DATA.tasks || []).filter(t => t.id !== id);
  saveData(DATA);
  toast('任务已删除');
  renderPlans();
}

function openTaskModal() {
  document.getElementById('taskModalTitle').textContent = '添加任务';
  document.getElementById('taskDesc').value = '';
  document.getElementById('taskDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('taskTag').value = '';

  const sel = document.getElementById('taskSubject');
  sel.innerHTML = '<option value="">不指定科目</option>' +
    DATA.subjects.map(s => `<option value="${s.id}">${escHtml(s.name)}</option>`).join('');

  document.getElementById('taskPlanType').value = planView;
  openModal('taskModal');
}

function saveTask() {
  const desc = document.getElementById('taskDesc').value.trim();
  if (!desc) { toast('请输入任务描述'); return; }
  const subjectId = document.getElementById('taskSubject').value;
  const planType = document.getElementById('taskPlanType').value;
  const date = document.getElementById('taskDate').value;
  const tag = document.getElementById('taskTag').value.trim();

  if (!DATA.tasks) DATA.tasks = [];
  DATA.tasks.push({
    id: genId(DATA),
    desc, subjectId, planType, date, tag,
    done: false
  });
  saveData(DATA);
  closeModal('taskModal');
  toast('任务已添加');
  renderPlans();
}

// ===== COUNTDOWN =====
function renderCountdown() {
  const grid = document.getElementById('countdownGrid');
  const subs = DATA.subjects.filter(s => s.examDate);
  if (subs.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="empty-icon">⏰</div><h3>尚未设置任何截止日期</h3><p>在科目设置中填写考试或截止日期，这里将显示倒计时</p></div>`;
    return;
  }
  grid.innerHTML = subs.map(s => {
    const days = getDaysUntil(s.examDate);
    const expired = days < 0;
    return `
      <div class="countdown-card" onclick="openSubjectDetail('${s.id}')" style="cursor:pointer;">
        <div class="cd-bg"></div>
        <div class="cd-subject">${escHtml(s.name)}</div>
        <div class="cd-date">${s.examDate}</div>
        <div class="cd-number">${Math.abs(days)}</div>
        <div class="cd-label">${expired ? '已过期' : '剩余天数'}</div>
      </div>
    `;
  }).join('');
}

// ===== DASHBOARD =====
function renderDashboard() {
  const stats = document.getElementById('dashboardStats');
  const subs = DATA.subjects;
  const tasks = DATA.tasks || [];
  const chCount = subs.reduce((sum, s) => sum + (s.chapters || []).length, 0);
  const attCount = subs.reduce((sum, s) => sum + (s.attachments || []).length, 0);
  const taskDone = tasks.filter(t => t.done).length;
  const taskTotal = tasks.length;
  const upcomingExams = subs.filter(s => s.examDate && getDaysUntil(s.examDate) >= 0).length;

  stats.innerHTML = `
    <div class="stat-card"><div class="stat-label">📚 科目总数</div><div class="stat-value">${subs.length} <span class="unit">门</span></div></div>
    <div class="stat-card"><div class="stat-label">📖 总章节</div><div class="stat-value">${chCount} <span class="unit">章</span></div></div>
    <div class="stat-card"><div class="stat-label">📎 总附件</div><div class="stat-value">${attCount} <span class="unit">个</span></div></div>
    <div class="stat-card"><div class="stat-label">📋 任务进度</div><div class="stat-value">${taskTotal > 0 ? Math.round(taskDone/taskTotal*100) : 0}<span class="unit">%</span></div><div class="stat-sub">${taskDone}/${taskTotal} 完成</div></div>
    <div class="stat-card"><div class="stat-label">⏰ 即将到期</div><div class="stat-value">${upcomingExams} <span class="unit">门</span></div></div>
  `;

  // Recent tasks
  const taskBox = document.getElementById('dashboardTasks');
  const recentTasks = tasks.filter(t => !t.done).sort((a,b) => a.date.localeCompare(b.date)).slice(0, 5);
  if (recentTasks.length === 0) {
    taskBox.innerHTML = '<div class="empty-state" style="padding:24px;"><div class="empty-icon" style="font-size:2rem;">✅</div><p style="font-size:.85rem;">暂无待办任务</p></div>';
  } else {
    taskBox.innerHTML = recentTasks.map(t => {
      const subName = t.subjectId ? (DATA.subjects.find(s => s.id === t.subjectId)?.name || '') : '';
      return `
        <div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--rule);font-size:.85rem;">
          <span style="color:${t.done ? 'var(--success)' : 'var(--muted)'};">${t.done ? '✓' : '○'}</span>
          <span style="flex:1;">${escHtml(t.desc)}</span>
          ${subName ? `<span style="font-size:.75rem;padding:1px 8px;border-radius:6px;background:rgba(74,108,247,.1);color:var(--accent);">${escHtml(subName)}</span>` : ''}
          <span style="font-size:.75rem;color:var(--muted);">${formatDate(new Date(t.date + 'T00:00:00'))}</span>
        </div>
      `;
    }).join('');
  }

  // Upcoming deadlines
  const cdBox = document.getElementById('dashboardCountdowns');
  const examSubs = subs.filter(s => s.examDate).sort((a,b) => (a.examDate || '').localeCompare(b.examDate || ''));
  if (examSubs.length === 0) {
    cdBox.innerHTML = '<div class="empty-state" style="padding:24px;"><div class="empty-icon" style="font-size:2rem;">📅</div><p style="font-size:.85rem;">尚未设置考试日期</p></div>';
  } else {
    cdBox.innerHTML = examSubs.slice(0, 5).map(s => {
      const days = getDaysUntil(s.examDate);
      return `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--rule);font-size:.85rem;" onclick="openSubjectDetail('${s.id}')" style="cursor:pointer;">
          <span style="font-weight:600;">${escHtml(s.name)}</span>
          <span style="font-weight:700;color:${days < 7 ? 'var(--danger)' : days < 30 ? 'var(--warning)' : 'var(--success)'};">${days >= 0 ? days + '天' : '已过期'}</span>
        </div>
      `;
    }).join('');
  }
}

// ===== UTILITY =====
function escHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatDate(d) {
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function getDaysUntil(dateStr) {
  const now = new Date();
  now.setHours(0,0,0,0);
  const target = new Date(dateStr + 'T00:00:00');
  return Math.round((target - now) / 86400000);
}

// ===== INIT =====
updateBadge();
renderDashboard();
</script>
