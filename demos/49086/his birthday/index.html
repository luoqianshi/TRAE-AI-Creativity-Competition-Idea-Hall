<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生日纪 - 你的专属生日时光机</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 星空背景 -->
  <div class="starry-bg"></div>
  <div class="stars" id="stars"></div>

  <!-- 首页 -->
  <div class="home-page" id="homePage">
    <h1 class="home-title">生日纪</h1>
    <p class="home-subtitle">你的专属生日时光机</p>
    <div class="date-input-group">
      <div class="date-picker-row">
        <div class="date-picker-item">
          <label for="birthYear" class="date-label">年</label>
          <select class="date-select" id="birthYear"></select>
        </div>
        <div class="date-picker-item">
          <label for="birthMonth" class="date-label">月</label>
          <select class="date-select" id="birthMonth"></select>
        </div>
        <div class="date-picker-item">
          <label for="birthDay" class="date-label">日</label>
          <select class="date-select" id="birthDay"></select>
        </div>
      </div>
    </div>
    <button class="explore-btn" id="exploreBtn">
      <i class="fas fa-magic"></i> 探索我的生日
    </button>
    <p class="home-tagline">每一个生日，都是一次与历史的重逢</p>
  </div>

  <!-- 结果页 -->
  <div class="result-page" id="resultPage">
    <button class="back-btn" id="backBtn">
      <i class="fas fa-arrow-left"></i> 返回
    </button>

    <!-- 时光卡 -->
    <div class="time-card" id="timeCard"></div>

    <!-- 历史时间线 -->
    <div class="timeline-section fade-in-section">
      <h2 class="section-title"><i class="fas fa-history"></i> 历史上的今天</h2>
      <div class="timeline" id="timeline"></div>
    </div>

    <!-- 名人生辰 -->
    <div class="celebrity-section fade-in-section">
      <h2 class="section-title"><i class="fas fa-star"></i> 这一天出生的名人</h2>
      <div class="celebrity-grid" id="celebrityGrid"></div>
    </div>

    <!-- 节日 -->
    <div class="holiday-section fade-in-section">
      <h2 class="section-title"><i class="fas fa-calendar-day"></i> 今日节日</h2>
      <div id="holidayTags"></div>
    </div>

    <!-- 今日热点 -->
    <div class="news-section fade-in-section">
      <h2 class="section-title"><i class="fas fa-newspaper"></i> 今日热点</h2>
      <div class="news-list" id="newsList"></div>
    </div>

    <!-- 走出家门 -->
    <div class="activity-section fade-in-section">
      <h2 class="section-title"><i class="fas fa-map-marker-alt"></i> 走出家门</h2>
      <div class="activity-city-selector">
        <label>选择城市：</label>
        <select class="activity-city-select" id="citySelect">
          <optgroup label="上海">
            <option value="上海" selected>上海</option>
          </optgroup>
          <optgroup label="江苏">
            <option value="南京">南京</option>
            <option value="苏州">苏州</option>
            <option value="无锡">无锡</option>
            <option value="常州">常州</option>
            <option value="徐州">徐州</option>
            <option value="南通">南通</option>
            <option value="扬州">扬州</option>
            <option value="盐城">盐城</option>
            <option value="淮安">淮安</option>
            <option value="镇江">镇江</option>
            <option value="连云港">连云港</option>
            <option value="泰州">泰州</option>
            <option value="宿迁">宿迁</option>
          </optgroup>
          <optgroup label="浙江">
            <option value="杭州">杭州</option>
            <option value="宁波">宁波</option>
            <option value="温州">温州</option>
            <option value="嘉兴">嘉兴</option>
            <option value="湖州">湖州</option>
            <option value="绍兴">绍兴</option>
            <option value="金华">金华</option>
            <option value="衢州">衢州</option>
            <option value="舟山">舟山</option>
            <option value="台州">台州</option>
            <option value="丽水">丽水</option>
          </optgroup>
          <optgroup label="安徽">
            <option value="合肥">合肥</option>
            <option value="芜湖">芜湖</option>
            <option value="蚌埠">蚌埠</option>
            <option value="淮南">淮南</option>
            <option value="马鞍山">马鞍山</option>
            <option value="淮北">淮北</option>
            <option value="铜陵">铜陵</option>
            <option value="安庆">安庆</option>
            <option value="黄山">黄山</option>
            <option value="滁州">滁州</option>
            <option value="阜阳">阜阳</option>
            <option value="宿州">宿州</option>
            <option value="六安">六安</option>
            <option value="亳州">亳州</option>
            <option value="池州">池州</option>
            <option value="宣城">宣城</option>
          </optgroup>
        </select>
      </div>
      <div class="activity-grid" id="activityGrid"></div>
    </div>

    <!-- 海报生成 -->
    <div class="poster-section fade-in-section">
      <h2 class="section-title"><i class="fas fa-image"></i> 生日海报</h2>
      <button class="generate-btn" id="generateBtn">
        <i class="fas fa-camera"></i> 生成我的生日海报
      </button>
      <div class="poster-preview" id="posterPreview">
        <div class="poster-board" id="posterContainer">
          <!-- 左列上：信息卡 -->
          <div class="p-card p-info">
            <div class="p-inner">
              <div class="p-date" id="polaroidTitle"></div>
              <div class="p-week" id="polaroidMeta"></div>
              <div class="p-tags" id="polaroidTags"></div>
              <div class="p-info-extra" id="polaroidInfoExtra"></div>
            </div>
          </div>
          <!-- 右列上：运势卡 -->
          <div class="p-card p-fortune">
            <div class="p-img-box">
              <img src="images/fortune-card.jpg" alt="">
            </div>
            <div class="p-caption" id="polaroidFortune"></div>
            <div class="p-scores" id="polaroidScores"></div>
          </div>
          <!-- 左列下：幸运指南 -->
          <div class="p-card p-lucky">
            <div class="p-inner">
              <div class="p-lucky-title">幸运指南</div>
              <div id="polaroidLucky"></div>
            </div>
          </div>
          <!-- 右列下：祝福卡 -->
          <div class="p-card p-bless">
            <div class="p-img-box">
              <img src="images/blessing-card.jpg" alt="">
            </div>
            <div class="p-bless-text" id="polaroidBlessing"></div>
          </div>
          <!-- 装饰贴纸 -->
          <div class="p-sticker">生日纪</div>
          <!-- 装饰胶带 -->
          <div class="p-tape p-tape--1"></div>
          <div class="p-tape p-tape--2"></div>
        </div>
        <button class="download-btn" id="downloadBtn">下载海报</button>
      </div>
    </div>
  </div>

  <div class="footer">
    <p>生日纪 · 每一个生日，都是一次与历史的重逢</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="data/data.js"></script>
  <script src="data/utils.js"></script>
  <script src="app.js"></script>
</body>
</html>
