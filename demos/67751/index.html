<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智享生活</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f6fa;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            max-width: 430px;
            margin: 0 auto;
            height: 100vh;
            background: #fff;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* 顶部栏 */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
        }

        .header-icons {
            display: flex;
            gap: 15px;
            font-size: 20px;
        }

        /* 搜索栏 */
        .search-bar {
            padding: 12px 20px;
            background: #fff;
            border-bottom: 1px solid #eee;
            flex-shrink: 0;
        }

        .search-input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            background: #f5f6fa;
        }

        .search-input:focus {
            border-color: #667eea;
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .main-content::-webkit-scrollbar {
            display: none;
        }

        /* 页面 */
        .page {
            display: none;
            padding-bottom: 20px;
        }

        .page.active {
            display: block;
        }

        /* 首页 */
        .home-banner {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 15px 20px;
            border-radius: 16px;
            padding: 25px 20px;
            color: white;
        }

        .home-banner h2 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .home-banner p {
            font-size: 14px;
            opacity: 0.9;
        }

        /* 快捷入口 */
        .quick-access {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 20px;
        }

        .quick-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .quick-item:active {
            transform: scale(0.95);
        }

        .quick-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .quick-icon.food { background: #ffeaa7; }
        .quick-icon.home { background: #dfe6e9; }
        .quick-icon.edu { background: #74b9ff; }
        .quick-icon.ent { background: #fd79a8; }
        .quick-icon.shop { background: #a29bfe; }
        .quick-icon.health { background: #55efc4; }
        .quick-icon.travel { background: #81ecec; }
        .quick-icon.more { background: #dfe6e9; }

        .quick-label {
            font-size: 12px;
            color: #666;
        }

        /* 推荐卡片 */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px 10px;
        }

        .section-title {
            font-size: 17px;
            font-weight: 600;
            color: #333;
        }

        .section-more {
            font-size: 13px;
            color: #667eea;
            cursor: pointer;
        }

        .card-list {
            display: flex;
            gap: 12px;
            padding: 0 20px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .card-list::-webkit-scrollbar {
            display: none;
        }

        .recommend-card {
            min-width: 160px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .recommend-card:active {
            transform: scale(0.98);
        }

        .card-img {
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .card-info {
            padding: 10px 12px;
        }

        .card-name {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 4px;
        }

        .card-desc {
            font-size: 12px;
            color: #999;
        }

        .card-price {
            font-size: 15px;
            color: #e74c3c;
            font-weight: 600;
            margin-top: 6px;
        }

        /* 服务页面 */
        .service-tabs {
            display: flex;
            padding: 0 20px;
            border-bottom: 1px solid #eee;
            gap: 25px;
        }

        .service-tab {
            padding: 12px 0;
            font-size: 15px;
            color: #999;
            cursor: pointer;
            position: relative;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }

        .service-tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            font-weight: 600;
        }

        .service-list {
            padding: 15px 20px;
        }

        .service-item {
            display: flex;
            gap: 15px;
            padding: 15px;
            background: white;
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .service-item:active {
            transform: scale(0.98);
        }

        .service-img {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            flex-shrink: 0;
        }

        .service-detail {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .service-name {
            font-size: 15px;
            font-weight: 500;
            color: #333;
        }

        .service-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .service-tag {
            font-size: 11px;
            padding: 2px 8px;
            background: #f0f0f0;
            color: #666;
            border-radius: 4px;
        }

        .service-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .service-price {
            font-size: 16px;
            color: #e74c3c;
            font-weight: 600;
        }

        .service-btn {
            padding: 6px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }

        /* 学习页面 */
        .course-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 15px 20px;
        }

        .course-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            cursor: pointer;
        }

        .course-img {
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .course-info {
            padding: 10px;
        }

        .course-title {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .course-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #999;
        }

        .course-progress {
            width: 100%;
            height: 4px;
            background: #eee;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }

        .course-progress-bar {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
            transition: width 0.3s;
        }

        /* 娱乐页面 */
        .ent-tabs {
            display: flex;
            padding: 10px 20px;
            gap: 10px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .ent-tabs::-webkit-scrollbar {
            display: none;
        }

        .ent-tab {
            padding: 8px 20px;
            background: #f0f0f0;
            border-radius: 20px;
            font-size: 14px;
            color: #666;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .ent-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .video-list {
            padding: 10px 20px;
        }

        .video-item {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }

        .video-thumb {
            width: 140px;
            height: 80px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
            position: relative;
        }

        .video-duration {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .video-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .video-title {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .-video-meta {
            font-size: 12px;
            color: #999;
        }

        /* 我的页面 */
        .profile-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px 20px;
            color: white;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            border: 3px solid rgba(255,255,255,0.5);
        }

        .profile-info h3 {
            font-size: 18px;
            margin-bottom: 4px;
        }

        .profile-info p {
            font-size: 13px;
            opacity: 0.9;
        }

        .profile-stats {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            background: white;
            margin-bottom: 12px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-num {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        .menu-list {
            background: white;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #f5f5f5;
            cursor: pointer;
        }

        .menu-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 18px;
        }

        .menu-text {
            flex: 1;
            font-size: 15px;
            color: #333;
        }

        .menu-arrow {
            color: #ccc;
            font-size: 14px;
        }

        /* 底部导航 */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            background: white;
            border-top: 1px solid #eee;
            flex-shrink: 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 4px 12px;
            color: #999;
            transition: color 0.3s;
        }

        .nav-item.active {
            color: #667eea;
        }

        .nav-icon {
            font-size: 22px;
        }

        .nav-label {
            font-size: 11px;
        }

        /* 弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 25px;
            max-width: 320px;
            width: 100%;
            text-align: center;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .modal-desc {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .modal-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            cursor: pointer;
        }

        /* 订单页面 */
        .order-list {
            padding: 15px 20px;
        }

        .order-item {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .order-shop {
            font-weight: 500;
            color: #333;
        }

        .order-status {
            color: #667eea;
        }

        .order-goods {
            display: flex;
            gap: 10px;
            padding: 10px 0;
            border-top: 1px solid #f5f5f5;
            border-bottom: 1px solid #f5f5f5;
        }

        .order-img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .order-detail {
            flex: 1;
        }

        .order-name {
            font-size: 14px;
            color: #333;
            margin-bottom: 4px;
        }

        .order-price {
            font-size: 14px;
            color: #e74c3c;
            font-weight: 500;
        }

        .order-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }

        .order-btn {
            padding: 6px 16px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }

        .order-btn.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
        }

        /* 智能推荐 */
        .ai-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 12px;
            margin-left: 8px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state .icon {
            font-size: 60px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 顶部栏 -->
        <div class="header">
            <div class="header-title" id="pageTitle">智享生活</div>
            <div class="header-icons">
                <span>🔔</span>
                <span>⚙️</span>
            </div>
        </div>

        <!-- 搜索栏 -->
        <div class="search-bar" id="searchBar">
            <input type="text" class="search-input" placeholder="搜索服务、课程、内容..." id="searchInput">
        </div>

        <!-- 主内容 -->
        <div class="main-content" id="mainContent">
            <!-- 首页 -->
            <div class="page active" id="pageHome">
                <div class="home-banner">
                    <h2>发现美好生活</h2>
                    <p>智能推荐，为你定制专属服务</p>
                </div>

                <div class="quick-access">
                    <div class="quick-item" onclick="goToService('food')">
                        <div class="quick-icon food">🍔</div>
                        <span class="quick-label">美食外卖</span>
                    </div>
                    <div class="quick-item" onclick="goToService('home')">
                        <div class="quick-icon home">🏠</div>
                        <span class="quick-label">家政服务</span>
                    </div>
                    <div class="quick-item" onclick="goToPage('learn')">
                        <div class="quick-icon edu">📚</div>
                        <span class="quick-label">在线学习</span>
                    </div>
                    <div class="quick-item" onclick="goToPage('ent')">
                        <div class="quick-icon ent">🎮</div>
                        <span class="quick-label">娱乐休闲</span>
                    </div>
                    <div class="quick-item" onclick="goToService('shop')">
                        <div class="quick-icon shop">🛍️</div>
                        <span class="quick-label">超市便利</span>
                    </div>
                    <div class="quick-item" onclick="goToService('health')">
                        <div class="quick-icon health">💊</div>
                        <span class="quick-label">医药健康</span>
                    </div>
                    <div class="quick-item" onclick="goToService('travel')">
                        <div class="quick-icon travel">🚗</div>
                        <span class="quick-label">出行服务</span>
                    </div>
                    <div class="quick-item" onclick="showMore()">
                        <div class="quick-icon more">➕</div>
                        <span class="quick-label">更多</span>
                    </div>
                </div>

                <div class="section-header">
                    <div class="section-title">为你推荐 <span class="ai-badge">🤖 AI推荐</span></div>
                    <span class="section-more" onclick="refreshRecommend()">换一批</span>
                </div>
                <div class="card-list" id="recommendList">
                    <!-- 动态生成 -->
                </div>

                <div class="section-header">
                    <div class="section-title">热门服务</div>
                    <span class="section-more">查看全部</span>
                </div>
                <div class="card-list" id="hotList">
                    <!-- 动态生成 -->
                </div>
            </div>

            <!-- 服务页面 -->
            <div class="page" id="pageService">
                <div class="service-tabs">
                    <div class="service-tab active" onclick="switchServiceTab('all', this)">全部</div>
                    <div class="service-tab" onclick="switchServiceTab('food', this)">美食</div>
                    <div class="service-tab" onclick="switchServiceTab('home', this)">家政</div>
                    <div class="service-tab" onclick="switchServiceTab('shop', this)">购物</div>
                </div>
                <div class="service-list" id="serviceList">
                    <!-- 动态生成 -->
                </div>
            </div>

            <!-- 学习页面 -->
            <div class="page" id="pageLearn">
                <div class="section-header">
                    <div class="section-title">热门课程 <span class="ai-badge">🤖 AI推荐</span></div>
                </div>
                <div class="course-grid" id="courseList">
                    <!-- 动态生成 -->
                </div>
            </div>

            <!-- 娱乐页面 -->
            <div class="page" id="pageEnt">
                <div class="ent-tabs">
                    <div class="ent-tab active" onclick="switchEntTab('video', this)">短视频</div>
                    <div class="ent-tab" onclick="switchEntTab('movie', this)">电影</div>
                    <div class="ent-tab" onclick="switchEntTab('game', this)">游戏</div>
                    <div class="ent-tab" onclick="switchEntTab('music', this)">音乐</div>
                </div>
                <div class="video-list" id="videoList">
                    <!-- 动态生成 -->
                </div>
            </div>

            <!-- 订单页面 -->
            <div class="page" id="pageOrder">
                <div class="section-header">
                    <div class="section-title">我的订单</div>
                </div>
                <div class="order-list" id="orderList">
                    <div class="empty-state">
                        <div class="icon">📋</div>
                        <p>暂无订单，快去下单吧~</p>
                    </div>
                </div>
            </div>

            <!-- 我的页面 -->
            <div class="page" id="pageMe">
                <div class="profile-header">
                    <div class="avatar">👤</div>
                    <div class="profile-info">
                        <h3>用户昵称</h3>
                        <p>智享生活，让美好触手可及</p>
                    </div>
                </div>
                <div class="profile-stats">
                    <div class="stat-item">
                        <div class="stat-num" id="couponCount">3</div>
                        <div class="stat-label">优惠券</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-num" id="pointCount">128</div>
                        <div class="stat-label">积分</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-num" id="favCount">12</div>
                        <div class="stat-label">收藏</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-num" id="historyCount">8</div>
                        <div class="stat-label">足迹</div>
                    </div>
                </div>
                <div class="menu-list">
                    <div class="menu-item" onclick="showToast('功能开发中')">
                        <div class="menu-icon" style="background: #ffeaa7;">📍</div>
                        <div class="menu-text">我的地址</div>
                        <div class="menu-arrow">›</div>
                    </div>
                    <div class="menu-item" onclick="showToast('功能开发中')">
                        <div class="menu-icon" style="background: #74b9ff;">💳</div>
                        <div class="menu-text">钱包</div>
                        <div class="menu-arrow">›</div>
                    </div>
                    <div class="menu-item" onclick="showToast('功能开发中')">
                        <div class="menu-icon" style="background: #a29bfe;">🎁</div>
                        <div class="menu-text">会员中心</div>
                        <div class="menu-arrow">›</div>
                    </div>
                    <div class="menu-item" onclick="showToast('功能开发中')">
                        <div class="menu-icon" style="background: #fd79a8;">💬</div>
                        <div class="menu-text">客服中心</div>
                        <div class="menu-arrow">›</div>
                    </div>
                    <div class="menu-item" onclick="showToast('功能开发中')">
                        <div class="menu-icon" style="background: #55efc4;">⚙️</div>
                        <div class="menu-text">设置</div>
                        <div class="menu-arrow">›</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部导航 -->
        <div class="bottom-nav">
            <div class="nav-item active" onclick="goToPage('home')">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">首页</span>
            </div>
            <div class="nav-item" onclick="goToPage('service')">
                <span class="nav-icon">🛒</span>
                <span class="nav-label">服务</span>
            </div>
            <div class="nav-item" onclick="goToPage('order')">
                <span class="nav-icon">📋</span>
                <span class="nav-label">订单</span>
            </div>
            <div class="nav-item" onclick="goToPage('me')">
                <span class="nav-icon">👤</span>
                <span class="nav-label">我的</span>
            </div>
        </div>

        <!-- 弹窗 -->
        <div class="modal" id="modal">
            <div class="modal-content">
                <div class="modal-icon" id="modalIcon">✅</div>
                <div class="modal-title" id="modalTitle">提示</div>
                <div class="modal-desc" id="modalDesc">操作成功</div>
                <button class="modal-btn" onclick="closeModal()">确定</button>
            </div>
        </div>
    </div>

    <script>
        // 数据
        const services = [
            { id: 1, name: '必胜客', category: 'food', tags: ['披萨', '西餐'], price: '¥30起', icon: '🍕', color: '#ffeaa7' },
            { id: 2, name: '美团外卖', category: 'food', tags: ['快餐', '中餐'], price: '¥20起', icon: '🍱', color: '#fab1a0' },
            { id: 3, name: '星巴克', category: 'food', tags: ['咖啡', '甜品'], price: '¥35起', icon: '☕', color: '#dfe6e9' },
            { id: 4, name: '家政保洁', category: 'home', tags: ['清洁', '保洁'], price: '¥80起', icon: '🧹', color: '#74b9ff' },
            { id: 5, name: '管道维修', category: 'home', tags: ['维修', '水电'], price: '¥50起', icon: '🔧', color: '#a29bfe' },
            { id: 6, name: '盒马鲜生', category: 'shop', tags: ['生鲜', '超市'], price: '¥0起送', icon: '🦐', color: '#55efc4' },
            { id: 7, name: '京东到家', category: 'shop', tags: ['超市', '便利'], price: '¥0起送', icon: '📦', color: '#fd79a8' },
            { id: 8, name: '海底捞', category: 'food', tags: ['火锅', '聚餐'], price: '¥100起', icon: '🍲', color: '#e17055' }
        ];

        const courses = [
            { id: 1, title: 'Python编程入门', icon: '🐍', color: '#ffeaa7', progress: 35, students: '1.2万' },
            { id: 2, title: '摄影基础课程', icon: '📷', color: '#74b9ff', progress: 0, students: '8千' },
            { id: 3, title: '英语口语提升', icon: '🗣️', color: '#a29bfe', progress: 60, students: '2万' },
            { id: 4, title: '烹饪美食课', icon: '👨‍🍳', color: '#fab1a0', progress: 0, students: '5千' },
            { id: 5, title: '健身入门指南', icon: '💪', color: '#55efc4', progress: 15, students: '1万' },
            { id: 6, title: '理财投资基础', icon: '💰', color: '#ffeaa7', progress: 0, students: '3万' }
        ];

        const videos = [
            { id: 1, title: '10分钟学会做红烧肉', category: 'video', duration: '10:23', author: '美食达人', views: '12万', icon: '🍖', color: '#e17055' },
            { id: 2, title: '2024年必看电影推荐', category: 'movie', duration: '15:30', author: '影评君', views: '45万', icon: '🎬', color: '#a29bfe' },
            { id: 3, title: '原神新版本攻略', category: 'game', duration: '20:15', author: '游戏解说', views: '88万', icon: '🎮', color: '#74b9ff' },
            { id: 4, title: '周杰伦经典歌曲串烧', category: 'music', duration: '08:45', author: '音乐频道', views: '120万', icon: '🎵', color: '#fd79a8' },
            { id: 5, title: '家居收纳整理技巧', category: 'video', duration: '12:00', author: '生活家', views: '23万', icon: '🏠', color: '#55efc4' },
            { id: 6, title: '漫威宇宙观影顺序', category: 'movie', duration: '18:30', author: '电影百科', views: '67万', icon: '🦸', color: '#e74c3c' }
        ];

        let orders = [];
        let currentPage = 'home';

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            renderRecommend();
            renderHot();
            renderServices('all');
            renderCourses();
            renderVideos('video');
        });

        // 页面切换
        function goToPage(page) {
            // 隐藏所有页面
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            // 显示目标页面
            document.getElementById('page' + page.charAt(0).toUpperCase() + page.slice(1)).classList.add('active');
            
            // 更新导航状态
            document.querySelectorAll('.nav-item').forEach((item, index) => {
                item.classList.remove('active');
            });
            
            // 更新标题
            const titles = {
                home: '智享生活',
                service: '生活服务',
                learn: '在线学习',
                ent: '娱乐休闲',
                order: '我的订单',
                me: '个人中心'
            };
            document.getElementById('pageTitle').textContent = titles[page] || '智享生活';
            
            // 显示/隐藏搜索栏
            const searchBar = document.getElementById('searchBar');
            if (page === 'home' || page === 'service' || page === 'learn') {
                searchBar.style.display = 'block';
            } else {
                searchBar.style.display = 'none';
            }
            
            // 更新底部导航
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            
            const navMap = { home: 0, service: 1, order: 2, me: 3 };
            if (navMap[page] !== undefined) {
                document.querySelectorAll('.nav-item')[navMap[page]].classList.add('active');
            }
            
            currentPage = page;
        }

        // 渲染推荐
        function renderRecommend() {
            const list = document.getElementById('recommendList');
            const items = services.slice(0, 4);
            list.innerHTML = items.map(item => `
                <div class="recommend-card" onclick="showServiceDetail(${item.id})">
                    <div class="card-img" style="background: ${item.color};">${item.icon}</div>
                    <div class="card-info">
                        <div class="card-name">${item.name}</div>
                        <div class="card-desc">${item.tags.join(' · ')}</div>
                        <div class="card-price">${item.price}</div>
                    </div>
                </div>
            `).join('');
        }

        // 渲染热门
        function renderHot() {
            const list = document.getElementById('hotList');
            const items = [...services].reverse().slice(0, 4);
            list.innerHTML = items.map(item => `
                <div class="recommend-card" onclick="showServiceDetail(${item.id})">
                    <div class="card-img" style="background: ${item.color};">${item.icon}</div>
                    <div class="card-info">
                        <div class="card-name">${item.name}</div>
                        <div class="card-desc">${item.tags.join(' · ')}</div>
                        <div class="card-price">${item.price}</div>
                    </div>
                </div>
            `).join('');
        }

        // 刷新推荐
        function refreshRecommend() {
            const list = document.getElementById('recommendList');
            list.innerHTML = '<div class="loading">加载中...</div>';
            setTimeout(() => {
                const shuffled = [...services].sort(() => Math.random() - 0.5).slice(0, 4);
                list.innerHTML = shuffled.map(item => `
                    <div class="recommend-card" onclick="showServiceDetail(${item.id})">
                        <div class="card-img" style="background: ${item.color};">${item.icon}</div>
                        <div class="card-info">
                            <div class="card-name">${item.name}</div>
                            <div class="card-desc">${item.tags.join(' · ')}</div>
                            <div class="card-price">${item.price}</div>
                        </div>
                    </div>
                `).join('');
            }, 500);
        }

        // 渲染服务列表
        function renderServices(category) {
            const list = document.getElementById('serviceList');
            const items = category === 'all' ? services : services.filter(s => s.category === category);
            
            if (items.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>该分类暂无服务</p>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = items.map(item => `
                <div class="service-item" onclick="showServiceDetail(${item.id})">
                    <div class="service-img" style="background: ${item.color};">${item.icon}</div>
                    <div class="service-detail">
                        <div class="service-name">${item.name}</div>
                        <div class="service-tags">
                            ${item.tags.map(tag => `<span class="service-tag">${tag}</span>`).join('')}
                        </div>
                        <div class="service-bottom">
                            <span class="service-price">${item.price}</span>
                            <button class="service-btn" onclick="event.stopPropagation(); orderService(${item.id})">立即下单</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 切换服务分类
        function switchServiceTab(category, el) {
            document.querySelectorAll('.service-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            renderServices(category);
        }

        // 渲染课程
        function renderCourses() {
            const list = document.getElementById('courseList');
            list.innerHTML = courses.map(course => `
                <div class="course-card" onclick="showToast('开始学习：${course.title}')">
                    <div class="course-img" style="background: ${course.color};">${course.icon}</div>
                    <div class="course-info">
                        <div class="course-title">${course.title}</div>
                        <div class="course-meta">
                            <span>${course.students}人在学</span>
                            <span>${course.progress > 0 ? '已学' + course.progress + '%' : '未开始'}</span>
                        </div>
                        ${course.progress > 0 ? `
                            <div class="course-progress">
                                <div class="course-progress-bar" style="width: ${course.progress}%"></div>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        // 渲染视频
        function renderVideos(category) {
            const list = document.getElementById('videoList');
            const items = category === 'all' ? videos : videos.filter(v => v.category === category);
            
            if (items.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📺</div>
                        <p>该分类暂无内容</p>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = items.map(video => `
                <div class="video-item" onclick="showToast('播放：${video.title}')">
                    <div class="video-thumb" style="background: ${video.color}20;">
                        ${video.icon}
                        <span class="video-duration">${video.duration}</span>
                    </div>
                    <div class="video-info">
                        <div class="video-title">${video.title}</div>
                        <div class="video-meta">${video.author} · ${video.views}次观看</div>
                    </div>
                </div>
            `).join('');
        }

        // 切换娱乐分类
        function switchEntTab(category, el) {
            document.querySelectorAll('.ent-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            renderVideos(category);
        }

        // 跳转服务
        function goToService(category) {
            goToPage('service');
            setTimeout(() => {
                const tabs = document.querySelectorAll('.service-tab');
                const tabMap = { food: 1, home: 2, shop: 3 };
                if (tabMap[category] !== undefined) {
                    tabs[tabMap[category]].click();
                }
            }, 100);
        }

        // 服务详情
        function showServiceDetail(id) {
            const service = services.find(s => s.id === id);
            if (service) {
                showModal('🏬', service.name, `${service.tags.join(' · ')}\n价格：${service.price}\n\n点击"立即下单"即可体验完整服务流程`);
            }
        }

        // 下单
        function orderService(id) {
            const service = services.find(s => s.id === id);
            if (service) {
                const order = {
                    id: Date.now(),
                    serviceId: service.id,
                    serviceName: service.name,
                    icon: service.icon,
                    color: service.color,
                    price: service.price,
                    status: '待服务',
                    time: new Date().toLocaleString()
                };
                orders.push(order);
                renderOrders();
                showModal('✅', '下单成功', `${service.name} 已下单成功！\n我们会尽快为您安排服务。`);
            }
        }

        // 渲染订单
        function renderOrders() {
            const list = document.getElementById('orderList');
            if (orders.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📋</div>
                        <p>暂无订单，快去下单吧~</p>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = orders.map(order => `
                <div class="order-item">
                    <div class="order-header">
                        <span class="order-shop">${order.serviceName}</span>
                        <span class="order-status">${order.status}</span>
                    </div>
                    <div class="order-goods">
                        <div class="order-img" style="background: ${order.color};">${order.icon}</div>
                        <div class="order-detail">
                            <div class="order-name">${order.serviceName}服务</div>
                            <div class="order-price">${order.price}</div>
                        </div>
                    </div>
                    <div class="order-footer">
                        <button class="order-btn" onclick="cancelOrder(${order.id})">取消订单</button>
                        <button class="order-btn primary" onclick="showToast('联系客服')">联系客服</button>
                    </div>
                </div>
            `).join('');
        }

        // 取消订单
        function cancelOrder(orderId) {
            orders = orders.filter(o => o.id !== orderId);
            renderOrders();
            showToast('订单已取消');
        }

        // 更多功能
        function showMore() {
            showModal('📱', '更多服务', '更多生活服务即将上线，敬请期待！\n\n包括：旅游出行、医疗健康、教育培训等');
        }

        // 弹窗
        function showModal(icon, title, desc) {
            document.getElementById('modalIcon').textContent = icon;
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalDesc').textContent = desc;
            document.getElementById('modal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
        }

        // Toast提示
        function showToast(msg) {
            // 创建toast元素
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(0,0,0,0.8);
                color: white;
                padding: 12px 24px;
                border-radius: 8px;
                font-size: 14px;
                z-index: 9999;
                animation: fadeIn 0.3s;
            `;
            toast.textContent = msg;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        // 搜索
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const keyword = this.value.trim();
                if (keyword) {
                    showToast('搜索：' + keyword);
                    // 这里可以实现实际的搜索功能
                }
            }
        });

        // 添加动画样式
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
                to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            }
            @keyframes fadeOut {
                from { opacity: 1; transform: translate(-50%, -50%) scale(1); }
                to { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
