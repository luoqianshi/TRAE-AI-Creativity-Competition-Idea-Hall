<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoachEngine 教练引擎 - AI 跑步私教</title>
<style>
  :root {
    --primary: #ff5722;
    --primary-light: #ff7a3d;
    --e: #4a90e2; --m: #50c8b8; --t: #ff8a3d; --i: #f04142; --r: #9254de;
    --gray: #86909c; --bg: #f7f8fa;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  /* ========== 手机外壳 ========== */
  .phone { position:relative; width:390px; height:760px; background:#fff; border-radius:44px;
    box-shadow:0 30px 80px rgba(0,0,0,.35), 0 0 0 3px #1a1a2e, 0 0 0 6px #2d2d44, 0 0 0 8px #1a1a2e;
    overflow:hidden; display:flex; flex-direction:column; }
  .statusbar { height:44px; background:#222; color:#fff; font-size:12px; display:flex;
    align-items:center; justify-content:space-between; padding:0 24px; flex-shrink:0; }
  .statusbar .time { font-weight:600; }
  .statusbar .icons { display:flex; gap:6px; }
  /* ========== 导航栏 ========== */
  .navbar { height:48px; background:var(--primary); color:#fff; display:flex;
    align-items:center; justify-content:center; font-size:17px; font-weight:600; flex-shrink:0;
    letter-spacing:1px; }
  .navbar .dot { width:8px; height:8px; background:#fff; border-radius:50%; margin:0 4px; opacity:.6; }
  /* ========== 内容区 ========== */
  .content { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; min-height:0; }
  /* ========== Tab Bar ========== */
  .tabbar { height:56px; border-top:1px solid #f0f1f3; background:#fff; display:flex; flex-shrink:0;
    align-items:center; justify-content:space-around; padding-bottom:env(safe-area-inset-bottom); }
  .tab { display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer;
    font-size:11px; color:var(--gray); padding:4px 8px; transition:.2s; }
  .tab.active { color:var(--primary); font-weight:600; }
  .tab .tab-icon { font-size:22px; line-height:1; }
  /* ========== 今日训练 ========== */
  .today-summary { background:linear-gradient(135deg, var(--primary) 0%, #ff7a3d 100%);
    color:#fff; padding:20px 20px 24px; }
  .today-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .today-date { font-size:14px; opacity:.9; }
  .today-phase { background:rgba(255,255,255,.22); padding:3px 12px; border-radius:20px; font-size:12px; }
  .today-card { background:rgba(255,255,255,.18); border-radius:16px; padding:18px;
    display:flex; align-items:center; gap:16px; }
  .today-card .tc-emoji { font-size:48px; flex-shrink:0; }
  .today-card .tc-info h2 { font-size:22px; margin-bottom:4px; }
  .today-card .tc-info .tc-dist { font-size:30px; font-weight:700; margin-bottom:2px; }
  .today-card .tc-info .tc-pace { font-size:13px; opacity:.85; }
  /* 5 区标签 */
  .zone-tag { display:inline-block; padding:2px 10px; border-radius:10px; font-size:12px;
    font-weight:600; color:#fff; }
  .zone-E { background:var(--e); } .zone-M { background:var(--m); }
  .zone-T { background:var(--t); } .zone-I { background:var(--i); } .zone-R { background:var(--r); }
  /* 按钮行 */
  .today-actions { display:flex; gap:10px; padding:16px 20px; }
  .btn { flex:1; height:42px; border:none; border-radius:21px; font-size:15px; font-weight:600;
    cursor:pointer; transition:.15s; }
  .btn:hover { transform:scale(.97); opacity:.9; }
  .btn-primary { background:var(--primary); color:#fff; }
  .btn-outline { background:#fff; color:var(--primary); border:1.5px solid var(--primary); }
  .btn-ghost { background:#f2f3f5; color:var(--gray); }
  /* 恢复建议 */
  .recovery-card { margin:0 20px 16px; padding:16px; border-radius:12px;
    background:#f0fdf4; border:1px solid #bbf7d0; }
  .recovery-card .rec-level { font-weight:700; color:#16a34a; margin-bottom:6px; }
  .recovery-card .rec-actions { font-size:13px; color:#4e5969; line-height:1.6; }
  .recovery-card.warn { background:#fff7ed; border-color:#fed7aa; }
  .recovery-card.warn .rec-level { color:#ea580c; }
  /* RPE */
  .rpe-bar { display:flex; gap:6px; padding:0 20px 16px; flex-wrap:wrap; }
  .rpe-dot { width:26px; height:26px; border-radius:50%; border:1.5px solid #ddd; font-size:11px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s; }
  .rpe-dot:hover { border-color:var(--primary); background:#fff3e0; }
  .rpe-dot.sel { background:var(--primary); color:#fff; border-color:var(--primary); }
  .rpe-label { width:100%; font-size:12px; color:var(--gray); margin-top:2px; }
  /* ========== 计划页 ========== */
  .week-tabs { display:flex; overflow-x:auto; padding:12px 16px; gap:8px; scrollbar-width:none; }
  .week-tabs::-webkit-scrollbar { display:none; }
  .week-tab { flex-shrink:0; padding:6px 16px; border-radius:16px; background:#f2f3f5; font-size:13px;
    font-weight:500; cursor:pointer; transition:.15s; border:none; }
  .week-tab.active { background:var(--primary); color:#fff; }
  .week-label { padding:8px 20px 0; font-size:14px; color:var(--gray); font-weight:500; }
  .day-card { display:flex; align-items:center; gap:12px; margin:8px 16px; padding:14px 16px;
    border-radius:12px; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.06);
    border-left:4px solid transparent; }
  .day-card.done { border-left-color:#16a34a; background:#f0fdf4; }
  .day-card.miss { border-left-color:var(--gray); opacity:.6; }
  .day-card.rest { border-left-color:#e5e6eb; }
  .day-emoji { font-size:28px; flex-shrink:0; width:36px; text-align:center; }
  .day-info { flex:1; min-width:0; }
  .day-info .dname { font-size:15px; font-weight:600; margin-bottom:2px; }
  .day-info .dmeta { font-size:12px; color:var(--gray); }
  .day-dist { font-size:16px; font-weight:700; flex-shrink:0; }
  .day-status { font-size:11px; font-weight:600; padding:3px 10px; border-radius:10px; }
  .day-status.done { background:#dcfce7; color:#16a34a; }
  .day-status.miss { background:#f2f3f5; color:var(--gray); }
  .day-status.plan { background:#fff3e0; color:var(--primary); }
  /* ========== 我的 / 伤病风险 ========== */
  .profile-header { padding:24px 20px; text-align:center; background:linear-gradient(135deg,#f7f8fa,#fff); }
  .profile-avatar { font-size:56px; margin-bottom:8px; }
  .profile-name { font-size:20px; font-weight:700; }
  .profile-vdot { font-size:36px; font-weight:800; color:var(--primary); }
  .profile-vdot-label { font-size:12px; color:var(--gray); }
  .stat-row { display:flex; justify-content:space-around; padding:16px 0; border-top:1px solid #f0f1f3; }
  .stat-item { text-align:center; }
  .stat-val { font-size:20px; font-weight:700; }
  .stat-label { font-size:11px; color:var(--gray); margin-top:2px; }
  .risk-card { margin:12px 16px; padding:18px; border-radius:12px; border:1px solid #f0f1f3; }
  .risk-card.low { background:#f0fdf4; border-color:#bbf7d0; }
  .risk-card.medium { background:#fff7ed; border-color:#fed7aa; }
  .risk-card.high { background:#fef2f2; border-color:#fecaca; }
  .risk-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .risk-title { font-size:16px; font-weight:700; }
  .risk-badge { padding:4px 14px; border-radius:12px; font-size:13px; font-weight:700; color:#fff; }
  .risk-badge.low { background:#16a34a; }
  .risk-badge.medium { background:#ea580c; }
  .risk-badge.high { background:#dc2626; }
  .risk-bar { height:8px; border-radius:4px; background:#e5e6eb; margin-bottom:8px; overflow:hidden; }
  .risk-fill { height:100%; border-radius:4px; transition:width .6s ease; }
  .risk-dims { display:flex; flex-wrap:wrap; gap:6px; }
  .risk-dim { padding:3px 10px; border-radius:10px; font-size:11px; font-weight:600; }
  .risk-dim.ok { background:#dcfce7; color:#16a34a; }
  .risk-dim.warn { background:#fff3e0; color:#ea580c; }
  .risk-dim.danger { background:#fef2f2; color:#dc2626; }
  /* ========== 体系页 ========== */
  .sys-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:12px 16px; }
  .sys-card { border-radius:14px; padding:16px; cursor:pointer; transition:.15s; min-height:80px;
    display:flex; flex-direction:column; gap:6px; }
  .sys-card:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,.1); }
  .sys-name { font-size:16px; font-weight:700; }
  .sys-desc { font-size:11px; opacity:.8; line-height:1.4; }
  /* ========== 通用 ========== */
  .section-title { font-size:15px; font-weight:700; padding:16px 20px 8px; }
  .fade-in { animation: fi .35s ease; }
  @keyframes fi { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  /* 隐藏页面 */
  .page { display:none; }
  .page.show { display:block; }
  /* Home 指示器 */
  .home-indicator { height:20px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .home-indicator .bar { width:80px; height:4px; background:#ddd; border-radius:2px; }
</style>
</head>
<body>

<div class="phone">
  <!-- 状态栏 -->
  <div class="statusbar">
    <span class="time" id="statusTime">9:41</span>
    <span class="icons">📶 🔋</span>
  </div>

  <!-- 导航栏 -->
  <div class="navbar" id="navTitle">CoachEngine 教练引擎</div>

  <!-- 内容区 -->
  <div class="content" id="contentRoot"></div>

  <!-- 底部 Tab -->
  <div class="tabbar">
    <div class="tab active" data-page="today">
      <span class="tab-icon">🏠</span> 今日
    </div>
    <div class="tab" data-page="plan">
      <span class="tab-icon">📋</span> 计划
    </div>
    <div class="tab" data-page="systems">
      <span class="tab-icon">🧠</span> 体系
    </div>
    <div class="tab" data-page="profile">
      <span class="tab-icon">👤</span> 我的
    </div>
  </div>
  <div class="home-indicator"><div class="bar"></div></div>
</div>

<script>
// ========== 数据层 ==========
const DATA = {
  user: { name:'小明', vdot:48.3, weeklyKm:45, monthlyKm:180, height:175, weight:68, maxHr:192, restingHr:55,
    pb: { '5000':'19:42', '10000':'41:20', half:'1:35:00' } },
  plan: {
    name:'2026 半马破 130 计划', startDate:'2026-06-09', totalWeeks:12,
    weekIndex:2, // 当前训练到第 3 周
    phases: ['base','base','base','build','build','build','peak','peak','peak','taper','taper','race'],
    weeks: []
  }
};

// 构建 12 周训练数据（模拟计划引擎输出）
const phraseLabelMap = { base:'基础期', build:'强化期', peak:'巅峰期', taper:'减量期', race:'比赛期' };
const weekLayouts = [
  // [周跑量, [日课型数组]]
  [28, ['E','RECOVERY_JOG','REST','I','E','E_long','REST']],
  [30, ['E','REST','T','E','I','E_long','REST']],
  [32, ['E','REST','I','E','T_long','E_long','REST']],
  [35, ['E','REST','M','E','CRUISE','E_long','REST']],
  [38, ['E','REST','T','E','YASSO','E_long','REST']],
  [42, ['REST','E','T','I','E','PYRAMID_INV','REST']],
  [45, ['E','REST','I_long','E','STRIDES','E_long','REST']],
  [48, ['E','REST','T','I','E','SPECIFIC','REST']],
  [50, ['E','REST','I','E','TUNE_RACE','E_long','REST']],
  [38, ['E','REST','T','E','E_long','REST','REST']],
  [25, ['E','REST','STRIDES','E','REST','E','REST']],
  [15, ['E','REST','REST','STRIDES','REST','RACE','REST']],
];

function buildPlan() {
  const weeks = [];
  for (let w = 0; w < 12; w++) {
    const [vol, types] = weekLayouts[w];
    const days = [];
    for (let d = 0; d < 7; d++) {
      const type = types[d];
      const day = {
        type, name: getWorkoutName(type), distance: 0, completed:false, skipped:false,
        icon: getIcon(type), zone: getZone(type), color: getColor(type),
        reps: null, description: ''
      };
      // 估算距离
      if (type === 'E') day.distance = Math.round(vol * 0.15 * 10) / 10;
      else if (type === 'E_long') day.distance = Math.round(vol * 0.28 * 10) / 10;
      else if (type === 'RECOVERY_JOG') day.distance = Math.round(vol * 0.1 * 10) / 10;
      else if (type === 'I') day.distance = Math.round(vol * 0.11 * 10) / 10;
      else if (type === 'T') day.distance = Math.round(vol * 0.13 * 10) / 10;
      else if (type === 'M') day.distance = Math.round(vol * 0.18 * 10) / 10;
      else if (type === 'CRUISE') day.distance = Math.round(vol * 0.14 * 10) / 10;
      else if (type === 'YASSO') { day.distance = Math.round(vol * 0.13 * 10) / 10; day.reps = { count:8, repDist:0.8, rest:'400m慢跑' }; }
      else if (type === 'PYRAMID_INV') { day.distance = Math.round(vol * 0.16 * 10) / 10; day.description = '4km+3km+2km+1km @ I 区'; }
      else if (type === 'STRIDES') day.distance = Math.round(vol * 0.08 * 10) / 10;
      else if (type === 'SPECIFIC') day.distance = Math.round(vol * 0.17 * 10) / 10;
      else if (type === 'TUNE_RACE') day.distance = Math.round(vol * 0.15 * 10) / 10;
      else if (type === 'I_long') day.distance = Math.round(vol * 0.14 * 10) / 10;
      else if (type === 'T_long') day.distance = Math.round(vol * 0.15 * 10) / 10;
      else if (type === 'RACE') day.distance = 21.1;
      else day.distance = 0;
      days.push(day);
    }
    // 前 2 周已完成
    if (w < 2) {
      days.forEach(d => { if (d.type !== 'REST') d.completed = true; });
    }
    // 当前周部分完成
    if (w === 2) {
      for (let d = 0; d < 5; d++) { if (days[d].type !== 'REST') days[d].completed = true; }
    }
    weeks.push({ weekIndex:w, phase:DATA.plan.phases[w], phaseLabel:phraseLabelMap[DATA.plan.phases[w]], volume:vol, days });
  }
  DATA.plan.weeks = weeks;
}

const WORKOUT_NAMES = {
  E:'轻松跑', E_long:'长距离慢跑', RECOVERY_JOG:'恢复慢跑', REST:'休息日',
  I:'间歇跑 I', I_long:'长间歇', T:'乳酸阈值跑 T', T_long:'长阈值',
  M:'马拉松配速跑', M_long:'长距离 M 配速',
  R:'重复跑 R', R_long:'长重复跑',
  PYRAMID_INV:'倒金字塔', STRIDES:'快步跑', YASSO:'亚索 800',
  CRUISE:'巡航间歇', SPECIFIC:'专项耐力', TUNE_RACE:'赛前模拟',
  RACE:'比赛日', STRENGTH:'力量训练', XTRAIN:'交叉训练'
};
function getWorkoutName(t) { return WORKOUT_NAMES[t] || t; }
function getZone(t) {
  const m = { E:'E',E_long:'E',RECOVERY_JOG:'E',M:'M',M_long:'M',SPECIFIC:'M',
    T:'T',T_long:'T',CRUISE:'T',I:'I',I_long:'I',YASSO:'I',TUNE_RACE:'I',PYRAMID_INV:'I',
    R:'R',R_long:'R',STRIDES:'R' };
  return m[t] || '';
}
const ICONS = { E:'🏃',E_long:'🏃',RECOVERY_JOG:'🚶',REST:'🛌',M:'🎯',M_long:'🎯',
  T:'⚡',T_long:'⚡',I:'🔥',I_long:'🔥',R:'💨',R_long:'💨',PYRAMID_INV:'⚡',
  STRIDES:'💨',YASSO:'🔥',CRUISE:'⚡',SPECIFIC:'🎯',TUNE_RACE:'🏁',RACE:'🥇',
  STRENGTH:'💪',XTRAIN:'🚴' };
function getIcon(t) { return ICONS[t] || '🏃'; }
const COLORS = { E:'#4a90e2', M:'#50c8b8', T:'#ff8a3d', I:'#f04142', R:'#9254de',
  PYRAMID_INV:'#e64a19', REST:'#c9cdd4', RACE:'#f59e0b' };
function getColor(t) { return COLORS[t] || COLORS[getZone(t)] || '#86909c'; }

// 初始化
buildPlan();

// ========== 渲染引擎 ==========
const root = document.getElementById('contentRoot');
const navTitle = document.getElementById('navTitle');
let currentPage = 'today';

function renderToday() {
  navTitle.textContent = 'CoachEngine 教练引擎';
  const p = DATA.plan;
  const today = new Date();
  const dayOfWeek = (today.getDay() + 6) % 7; // 周一=0
  const week = p.weeks[2]; // 当前周
  const day = week.days[dayOfWeek];
  const s1 = p.weeks.slice(0, 2).reduce((sum,w) => sum + w.volume, 0);
  const s2 = [0,1,2].reduce((sum,i) => sum + p.weeks[i].volume, 0);
  const totalKm = s2;

  let html = `<div class="fade-in">`;
  // 今日摘要
  html += `<div class="today-summary">
    <div class="today-header">
      <span class="today-date">第 ${week.weekIndex+1} 周 · ${['日','一','二','三','四','五','六'][dayOfWeek]}</span>
      <span class="today-phase">${week.phaseLabel}</span>
    </div>
    <div class="today-card">
      <span class="tc-emoji">${day.icon}</span>
      <div class="tc-info">
        <h2>${day.name}</h2>
        ${day.distance > 0 ? `<div class="tc-dist">${day.distance} km</div>` : ''}
        ${day.zone ? `<div class="tc-pace"><span class="zone-tag zone-${day.zone}">${day.zone} 区</span> 配速 4:25–4:48 /km</div>` : ''}
        ${day.reps ? `<div class="tc-pace" style="margin-top:4px">${day.reps.count}组 × ${day.reps.repDist}km · ${day.reps.rest}</div>` : ''}
        ${day.description ? `<div class="tc-pace" style="margin-top:4px;font-size:12px">${day.description}</div>` : ''}
      </div>
    </div>
  </div>`;

  // 按钮
  html += `<div class="today-actions">
    <button class="btn btn-primary" onclick="completeWorkout()">✓ 完成</button>
    <button class="btn btn-outline" onclick="skipWorkout()">跳过</button>
    <button class="btn btn-ghost">详情 ▸</button>
  </div>`;

  // RPE
  html += `<div class="rpe-bar"><span style="font-size:12px;color:var(--gray);margin-right:4px">RPE 自评：</span>`;
  for (let i = 1; i <= 10; i++) {
    html += `<span class="rpe-dot" onclick="selectRpe(${i})" id="rpe-${i}">${i}</span>`;
  }
  html += `<span class="rpe-label">1=很轻松 · 5=有些吃力 · 10=极限</span></div>`;

  // 恢复建议
  const hardCount = week.days.filter(d => d.completed && ['I','T','PYRAMID_INV','CRUISE','YASSO'].includes(d.type)).length;
  const isWarn = hardCount >= 2;
  html += `<div class="recovery-card ${isWarn?'warn':''}">
    <div class="rec-level">${isWarn?'⚠️ 注意负荷':'✅ 恢复良好'}</div>
    <div class="rec-actions">${isWarn
      ? '· 本周已累计 2 次高强度训练，明日建议轻松跑或休息<br>· 周跑量增幅 12%，建议控制在 20% 以内<br>· RPE 如超过 7 分，请调整配速'
      : '· 当前训练负荷正常，继续按计划执行<br>· 注意补充睡眠，今晚建议 7.5h+ 睡眠<br>· 下次硬课间隔 ≥ 2 天'}</div>
  </div>`;

  // 本周进度
  const completedThisWeek = week.days.filter(d => d.completed && d.type !== 'REST').reduce((s,d) => s + d.distance, 0);
  html += `<div class="section-title">本周进度</div>
  <div style="margin:0 20px 20px;padding:14px;border-radius:10px;background:#f7f8fa;font-size:13px;color:#4e5969;line-height:1.7">
    累计完成：<b>${completedThisWeek.toFixed(1)} / ${week.volume} km</b><br>
    训练日完成率：<b>${week.days.filter(d=>d.completed&&d.type!=='REST').length} / ${week.days.filter(d=>d.type!=='REST').length}</b> 天<br>
    计划总累计：<b>${totalKm} km</b><br>
    周均跑量：<b>${Math.round(totalKm/3)} km</b>
  </div>`;

  html += `</div>`;
  root.innerHTML = html;
}

function renderPlan() {
  navTitle.textContent = '训练计划';
  const p = DATA.plan;
  let html = `<div class="fade-in">`;
  html += `<div class="week-tabs">`;
  for (let w = 0; w < p.weeks.length; w++) {
    const week = p.weeks[w];
    const isActive = w === 2;
    html += `<button class="week-tab ${isActive?'active':''}" onclick="switchWeek(${w})">W${w+1}<br><small>${week.phaseLabel}</small></button>`;
  }
  html += `</div>`;

  // 默认展示第 3 周
  const currentWeek = p.weeks[2];
  html += `<div class="week-label">第 ${currentWeek.weekIndex+1} 周 · ${currentWeek.phaseLabel} · 跑量 ${currentWeek.volume} km</div>
  <div style="margin:8px 20px 0;"><div style="height:6px;border-radius:3px;background:#e5e6eb;"><div style="height:100%;width:${Math.round(currentWeek.volume/60*100)}%;border-radius:3px;background:linear-gradient(90deg,var(--primary),var(--primary-light));"></div></div></div>`;

  for (const day of currentWeek.days) {
    const statusCls = day.completed ? 'done' : 'day-card';
    const statusBadge = day.type === 'REST' ? '' :
      (day.completed ? `<span class="day-status done">✓ 完成</span>` : `<span class="day-status plan">待训练</span>`);
    html += `<div class="day-card ${statusCls}" style="border-left-color:${getColor(day.type)}">
      <span class="day-emoji">${day.icon}</span>
      <div class="day-info">
        <div class="dname">${day.name}</div>
        <div class="dmeta">${day.zone ? day.zone+' 区' : ''}${day.reps ? ' · '+day.reps.count+'组×'+day.reps.repDist+'km' : ''}</div>
      </div>
      <div class="day-dist">${day.distance > 0 ? day.distance+' km' : '—'}</div>
      ${statusBadge}
    </div>`;
  }
  html += `</div>`;
  root.innerHTML = html;
}

function renderSystems() {
  navTitle.textContent = '8 大训练体系';
  const systems = [
    { name:'Daniels', desc:'VDOT 经典体系\n5 区配速 + 周期化', bg:'#e8f4fd', color:'#4a90e2' },
    { name:'Lydiard', desc:'山坡训练之父\n基础打底 → 巅峰冲刺', bg:'#fdf2e8', color:'#ea580c' },
    { name:'Holmer', desc:'法特莱克发明者\n速度游戏 · 随性变速', bg:'#fef3e0', color:'#d97706' },
    { name:'Hudson', desc:'自适应训练系统\n坡度 + 快步 + 模拟赛', bg:'#f0fdf4', color:'#16a34a' },
    { name:'Pfitzinger', desc:'高级马拉松\n中长跑 + 巡航间歇', bg:'#fdf2f8', color:'#db2777' },
    { name:'McMillan', desc:'完赛时间计算器\nYasso 800s 预言全马', bg:'#f5f3ff', color:'#7c3aed' },
    { name:'Canova', desc:'专项耐力突破\n中周期 + 赛前模块', bg:'#ecfdf5', color:'#059669' },
    { name:'Norwegian', desc:'双阈值训练法\n上午 T + 下午 T · 精英密度', bg:'#f0f9ff', color:'#0284c7' },
  ];
  let html = `<div class="fade-in"><div style="padding:12px 20px;font-size:13px;color:var(--gray);line-height:1.6">
    CoachEngine 融合 8 大世界级训练体系，自动匹配周期阶段。<br>Daniels 为必修体系，其余可按需组合。
  </div><div class="sys-grid">`;
  for (const s of systems) {
    html += `<div class="sys-card" style="background:${s.bg};border:1px solid ${s.color}22">
      <div class="sys-name" style="color:${s.color}">${s.name}</div>
      <div class="sys-desc" style="color:${s.color}99;white-space:pre-line">${s.desc}</div>
    </div>`;
  }
  html += `</div></div>`;
  root.innerHTML = html;
}

function renderProfile() {
  navTitle.textContent = '我的';
  const u = DATA.user;
  const uP = DATA.plan;
  const totalKm = uP.weeks.reduce((s,w) => s + w.volume, 0);
  const completedKm = uP.weeks.slice(0,2).reduce((s,w) => s + w.volume, 0) +
    uP.weeks[2].days.filter(d => d.completed && d.type !== 'REST').reduce((s,d) => s + d.distance, 0);
  const rate = Math.round(completedKm / uP.weeks.slice(0,3).reduce((s,w) => s + w.volume, 0) * 100);
  // 模拟风险计算
  const riskScore = Math.min(75, Math.round((u.weeklyKm / 1.2 + rate * 0.3) / 2));
  const riskLevel = riskScore < 30 ? 'low' : riskScore < 60 ? 'medium' : 'high';
  const riskLabel = { low:'低风险', medium:'中等风险', high:'高风险' }[riskLevel];

  let html = `<div class="fade-in">`;
  html += `<div class="profile-header">
    <div class="profile-avatar">🏃‍♂️</div>
    <div class="profile-name">${u.name}</div>
    <div class="profile-vdot">${u.vdot}</div>
    <div class="profile-vdot-label">综合 VDOT · 5K PB ${u.pb['5000']}</div>
  </div>
  <div class="stat-row">
    <div class="stat-item"><div class="stat-val">${totalKm}</div><div class="stat-label">计划总跑量 km</div></div>
    <div class="stat-item"><div class="stat-val">${completedKm.toFixed(0)}</div><div class="stat-label">已完成 km</div></div>
    <div class="stat-item"><div class="stat-val">${rate}%</div><div class="stat-label">完成率</div></div>
    <div class="stat-item"><div class="stat-val">${Math.round(totalKm/12)}</div><div class="stat-label">周均 km</div></div>
  </div>`;

  // 伤病风险
  html += `<div class="section-title">伤病风险评估</div>
  <div class="risk-card ${riskLevel}">
    <div class="risk-header">
      <span class="risk-title">综合风险</span>
      <span class="risk-badge ${riskLevel}">${riskLabel} · ${riskScore}分</span>
    </div>
    <div class="risk-bar"><div class="risk-fill" style="width:${riskScore}%;background:${riskScore<30?'#16a34a':riskScore<60?'#ea580c':'#dc2626'}"></div></div>
    <div class="risk-dims">
      <span class="risk-dim ${riskScore<40?'ok':'warn'}">周跑量 ${u.weeklyKm}km</span>
      <span class="risk-dim ok">月/周比 4.0</span>
      <span class="risk-dim ok">BMI 22.2</span>
      <span class="risk-dim ok">周期 12周</span>
      <span class="risk-dim ${riskScore>50?'warn':'ok'}">完成率 ${rate}%</span>
      <span class="risk-dim ok">ACWR 1.08</span>
    </div>
  </div>`;

  // PB 列表
  html += `<div class="section-title">PB 成绩</div>
  <div style="margin:0 16px 20px">`;
  const pbList = [{ k:'5K', v:u.pb['5000'] },{ k:'10K', v:u.pb['10000'] },{ k:'半马', v:u.pb.half }];
  for (const pb of pbList) {
    html += `<div style="display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #f0f1f3;font-size:15px">
      <span style="color:var(--gray)">${pb.k}</span><span style="font-weight:700">${pb.v}</span></div>`;
  }
  html += `</div>`;

  html += `</div>`;
  root.innerHTML = html;
}

// ========== 交互 ==========
function switchTab(page) {
  currentPage = page;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.page === page));
  if (page === 'today') renderToday();
  else if (page === 'plan') renderPlan();
  else if (page === 'systems') renderSystems();
  else if (page === 'profile') renderProfile();
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => switchTab(tab.dataset.page));
});

function switchWeek(w) {
  const week = DATA.plan.weeks[w];
  document.querySelectorAll('.week-tab').forEach((el,i) => el.classList.toggle('active', i===w));
  // 重新渲染 plan 时显示指定周
  renderPlanWeek(w);
}

function renderPlanWeek(w) {
  const week = DATA.plan.weeks[w];
  let html = `<div class="fade-in">`;
  // 周标签
  html += `<div class="week-tabs">`;
  for (let i = 0; i < DATA.plan.weeks.length; i++) {
    const wk = DATA.plan.weeks[i];
    html += `<button class="week-tab ${i===w?'active':''}" onclick="switchWeek(${i})">W${i+1}<br><small>${wk.phaseLabel}</small></button>`;
  }
  html += `</div>`;

  html += `<div class="week-label">第 ${week.weekIndex+1} 周 · ${week.phaseLabel} · 跑量 ${week.volume} km</div>
  <div style="margin:8px 20px 0;"><div style="height:6px;border-radius:3px;background:#e5e6eb;"><div style="height:100%;width:${Math.round(week.volume/60*100)}%;border-radius:3px;background:linear-gradient(90deg,var(--primary),var(--primary-light));"></div></div></div>`;

  for (const day of week.days) {
    const statusCls = day.completed ? 'done' : 'day-card';
    const statusBadge = day.type === 'REST' ? '' :
      (day.completed ? `<span class="day-status done">✓ 完成</span>` : `<span class="day-status plan">待训练</span>`);
    html += `<div class="day-card ${statusCls}" style="border-left-color:${getColor(day.type)}">
      <span class="day-emoji">${day.icon}</span>
      <div class="day-info">
        <div class="dname">${day.name}</div>
        <div class="dmeta">${day.zone ? day.zone+' 区' : '—'}${day.reps ? ' · '+day.reps.count+'组×'+day.reps.repDist+'km' : ''}</div>
      </div>
      <div class="day-dist">${day.distance > 0 ? day.distance+' km' : '—'}</div>
      ${statusBadge}
    </div>`;
  }
  html += `</div>`;
  navTitle.textContent = '训练计划';
  root.innerHTML = html;
}

function completeWorkout() {
  const week = DATA.plan.weeks[2];
  const today = new Date();
  const dayOfWeek = (today.getDay() + 6) % 7;
  week.days[dayOfWeek].completed = true;
  alert('训练完成！干得漂亮 🎉');
  renderToday();
}

function skipWorkout() {
  const week = DATA.plan.weeks[2];
  const today = new Date();
  const dayOfWeek = (today.getDay() + 6) % 7;
  week.days[dayOfWeek].skipped = true;
  alert('已跳过今日训练，请注意恢复');
  renderToday();
}

function selectRpe(v) {
  document.querySelectorAll('.rpe-dot').forEach(d => d.classList.remove('sel'));
  const dot = document.getElementById('rpe-' + v);
  if (dot) dot.classList.add('sel');
}

// ========== 启动 ==========
function updateStatusTime() {
  const now = new Date();
  document.getElementById('statusTime').textContent =
    String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
}
updateStatusTime();
setInterval(updateStatusTime, 60000);
renderToday();
</script>

</html>
