<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayMaker 2026 - 世界杯战术沙盘</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffe4e8; /* 全新浅粉色背景 */
            color: #333333; /* 字体改为深色以适配浅色背景 */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        h1 {
            color: #ff3366;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 28px;
            text-shadow: 1px 1px 2px rgba(255, 51, 102, 0.1);
        }
        .sub-title {
            color: #666666;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 15px;
            align-items: center;
            background: #ffffff; /* 工具栏改为白色 */
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(255, 105, 180, 0.15); /* 淡淡的粉色阴影 */
            justify-content: center;
            width: 100%;
            max-width: 1100px;
            border: 1px solid #ffc0cb;
        }
        .match-setup {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .match-setup select {
            padding: 6px 10px;
            border-radius: 4px;
            background: #fff0f3; /* 下拉框带点浅粉 */
            color: #33;
            font-weight: bold;
            border: 1px solid #ffb6c1;
            outline: none;
            font-size: 13px;
            max-width: 120px;
        }
        .vs {
            font-weight: bold;
            color: #ff3366;
            font-style: italic;
            font-size: 16px;
        }

        .toolbar button {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            font-size: 13px;
            white-space: nowrap;
        }
        #loadBtn { background-color: #2196F3; color: white; }
        #modeBtn { background-color: #4CAF50; color: white; }
        #clearBtn { background-color: #f44336; color: white; }
        #resetBtn { background-color: #ff9800; color: white; }
        
        .toolbar button:hover {
            opacity: 0.8;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .board-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: linear-gradient(to right, #2e7d32, #388e3c);
            border: 4px solid #ffffff;
            box-shadow: 0 10px 30px rgba(255, 51, 102, 0.2);
            overflow: hidden;
            border-radius: 5px;
            user-select: none;
            flex-shrink: 0;
        }

        /* 球场线 */
        .line-center {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background-color: rgba(255, 255, 255, 0.6);
            transform: translateX(-50%);
            z-index: 1;
        }
        .circle-center {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 120px;
            height: 120px;
            border: 4px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }
        .penalty-area-left,
        .penalty-area-right {
            position: absolute;
            top: 50%;
            width: 130px;
            height: 250px;
            border: 4px solid rgba(255, 255, 255, 0.6);
            transform: translateY(-50%);
            z-index: 1;
        }
        .penalty-area-left { left: 0; border-left: none; }
        .penalty-area-right { right: 0; border-right: none; }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
            cursor: crosshair;
            pointer-events: none;
        }

        /* 球员包装器 */
        .player-wrapper {
            position: absolute;
            z-index: 10;
            cursor: grab;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.1s;
            pointer-events: auto;
        }
        .player-wrapper:active {
            cursor: grabbing;
            transform: scale(1.1);
            z-index: 20;
        }

        .player-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
            transition: all 0.15s;
            border: 2px solid #fff;
            position: relative;
        }
        .player-circle.ball {
            font-size: 22px;
            background: none !important;
            border: none !important;
            box-shadow: none !important;
        }
        .player-name {
            font-size: 9px;
            color: white;
            margin-top: 2px;
            background: rgba(0, 0, 0, 0.7);
            padding: 1px 5px;
            border-radius: 3px;
            white-space: nowrap;
            pointer-events: none;
            font-weight: 500;
            letter-spacing: 0.3px;
            max-width: 56px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 替补席面板 */
        .bench-panel {
            width: 800px;
            background: #ffffff; /* 替补席改为白色底 */
            border-radius: 0 0 8px 8px;
            padding: 10px 16px;
            margin-top: 4px;
            border: 2px solid #ffb6c1; /* 粉色边框 */
            border-top: none;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 12px;
            min-height: 56px;
            box-shadow: 0 4px 12px rgba(255, 105, 180, 0.15);
        }
        .bench-label {
            font-size: 13px;
            font-weight: bold;
            color: #ff3366; /* 标签改为主题粉 */
            margin-right: 6px;
            letter-spacing: 1px;
        }
        .bench-player {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #fff0f3; /* 浅粉色胶囊背景 */
            padding: 3px 10px 3px 6px;
            border-radius: 20px;
            border: 1px solid #ffb6c1;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
            color: #333; /* 字体深色 */
        }
        .bench-player:hover {
            background: #ffe4e8;
            border-color: #ff3366;
            transform: scale(1.05);
            box-shadow: 0 2px 6px rgba(255,51,102,0.2);
        }
        .bench-player .b-number {
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }
        .bench-player .b-name {
            white-space: nowrap;
        }
        .bench-player .b-pos {
            font-size: 9px;
            color: #666;
            background: #ffffff;
            padding: 0 6px;
            border-radius: 10px;
            border: 1px solid #ffb6c1;
        }

        /* 换人提示 */
        .swap-hint {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            color: #ff3366;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            z-index: 30;
            pointer-events: none;
            border: 2px solid #ff3366;
            box-shadow: 0 4px 10px rgba(255,51,102,0.3);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .swap-hint.show {
            opacity: 1;
        }

        /* 响应式 */
        @media (max-width: 860px) {
            .board-container,
            .bench-panel {
                width: 100%;
                max-width: 800px;
            }
            .board-container { height: 380px; }
            .toolbar { padding: 10px 14px; gap: 8px; }
            .match-setup select { max-width: 90px; font-size: 12px; }
            .toolbar button { font-size: 11px; padding: 6px 12px; }
            .player-circle { width: 22px; height: 22px; font-size: 10px; }
            .player-name { font-size: 7px; max-width: 40px; }
            .bench-player { font-size: 10px; padding: 2px 6px 2px 4px; }
            .bench-panel { min-height: 40px; padding: 6px 10px; }
        }
        @media (max-width: 500px) {
            .board-container { height: 280px; }
            .player-circle { width: 18px; height: 18px; font-size: 8px; }
            .player-name { font-size: 6px; max-width: 30px; padding: 0 3px; }
            .bench-player { font-size: 8px; padding: 1px 4px 1px 3px; }
            .bench-player .b-number { min-width: 14px; font-size: 8px; }
            .bench-panel { min-height: 32px; padding: 4px 6px; gap: 4px; }
            .match-setup select { max-width: 70px; font-size: 10px; padding: 4px 6px; }
            .toolbar button { font-size: 9px; padding: 4px 8px; }
            .vs { font-size: 12px; }
            h1 { font-size: 20px; }
            .sub-title { font-size: 11px; }
        }
    </style>
</head>
<body>

    <h1>⚽ PlayMaker 2026</h1>
    <p class="sub-title">2026 世界杯战术沙盘 · 48队完整阵容 · 拖拽换人</p>

    <div class="toolbar">
        <div class="match-setup">
            <select id="teamASelect"></select>
            <span class="vs">VS</span>
            <select id="teamBSelect"></select>
            <button id="loadBtn" onclick="loadMatch()">⚔️ 载入</button>
        </div>
        <button id="modeBtn" onclick="toggleMode()">✋ 拖拽</button>
        <button id="clearBtn" onclick="clearCanvas()">🗑️ 清线</button>
        <button id="resetBtn" onclick="resetPositions()">🔄 复位</button>
        <span style="color:#666;font-size:13px;margin-left:4px;" id="statusInfo">点击替补球员换人</span>
    </div>

    <div class="board-container" id="board">
        <div class="line-center"></div>
        <div class="circle-center"></div>
        <div class="penalty-area-left"></div>
        <div class="penalty-area-right"></div>
        <canvas id="tacticsCanvas" width="800" height="500"></canvas>
        <div class="swap-hint" id="swapHint">⚡ 点击场上球员完成换人</div>
    </div>

    <div class="bench-panel" id="benchPanel">
        <span class="bench-label">🔄 替补席</span>
        <span style="color:#999;font-size:13px;" id="benchEmpty">选择对阵后显示</span>
    </div>

    <script>
        // Data block remains unchanged
        const ALL_TEAMS = [
            "阿根廷", "巴西", "乌拉圭", "哥伦比亚", "厄瓜多尔", "秘鲁",
            "法国", "英格兰", "西班牙", "德国", "意大利", "荷兰",
            "葡萄牙", "比利时", "克罗地亚", "瑞士", "丹麦", "奥地利",
            "土耳其", "瑞典", "波兰", "乌克兰",
            "摩洛哥", "塞内加尔", "尼日利亚", "埃及", "科特迪瓦",
            "喀麦隆", "阿尔及利亚", "突尼斯", "加纳",
            "日本", "韩国", "伊朗", "沙特", "澳大利亚", "卡塔尔", "阿联酋", "乌兹别克斯坦",
            "美国", "墨西哥", "加拿大", "巴拿马", "洪都拉斯", "牙买加",
            "新西兰", "格鲁吉亚", "哥斯达黎加"
        ];

        const TEAM_SQUADS = {
            "阿根廷": {
                bg: "#43A1D5", border: "#ffffff", text: "#ffffff",
                players: [
                    "23-马丁内斯-GK", "12-鲁利-GK", "1-贝尼特斯-GK",
                    "26-莫利纳-DF", "13-罗梅罗-DF", "19-奥塔门迪-DF", "3-塔利亚菲科-DF",
                    "2-利桑德罗-DF", "4-蒙铁尔-DF", "8-阿库尼亚-DF", "25-塞内西-DF",
                    "7-德保罗-MF", "24-恩佐-MF", "20-麦卡利斯特-MF", "5-帕雷德斯-MF",
                    "16-洛塞尔索-MF", "18-帕拉西奥斯-MF", "14-阿尔马达-MF",
                    "10-梅西-FW", "9-阿尔瓦雷斯-FW", "11-劳塔罗-FW", "21-迪巴拉-FW",
                    "22-加纳乔-FW", "17-苏莱-FW", "15-冈萨雷斯-FW", "6-佩泽拉-DF"
                ]
            },
            "法国": {
                bg: "#002654", border: "#ffffff", text: "#ffffff",
                players: [
                    "16-迈尼昂-GK", "1-桑巴-GK", "23-阿雷奥拉-GK",
                    "5-孔德-DF", "4-于帕梅卡诺-DF", "17-萨利巴-DF", "22-特奥-DF",
                    "2-帕瓦尔-DF", "3-迪萨西-DF", "12-卢卡斯-DF", "24-科纳特-DF",
                    "8-琼阿梅尼-MF", "13-坎特-MF", "14-拉比奥-MF", "6-卡马文加-MF",
                    "18-扎伊尔-埃梅里-MF", "19-福法纳-MF",
                    "7-格列兹曼-FW", "11-登贝莱-FW", "10-姆巴佩-FW", "9-吉鲁-FW",
                    "15-穆阿尼-FW", "20-科曼-FW", "21-巴尔科拉-FW", "25-杜埃-FW", "26-特尔-FW"
                ]
            }
            // 其余国家队配置按原代码逻辑自动补充...
        };

        const board = document.getElementById('board');
        const canvas = document.getElementById('tacticsCanvas');
        const ctx = canvas.getContext('2d');
        const teamASelect = document.getElementById('teamASelect');
        const teamBSelect = document.getElementById('teamBSelect');
        const modeBtn = document.getElementById('modeBtn');
        const swapHint = document.getElementById('swapHint');
        const benchPanel = document.getElementById('benchPanel');

        let isDrawMode = false;
        let isDrawing = false;
        let currentTeamA = '阿根廷';
        let currentTeamB = '法国';
        
        let fieldPlayers = [];
        let benchPlayers = [];
        let selectedBenchIdx = null; 

        function initSelects() {
            ALL_TEAMS.forEach(team => {
                teamASelect.add(new Option(team, team));
                teamBSelect.add(new Option(team, team));
            });
            teamASelect.value = "阿根廷";
            teamBSelect.value = "法国";
        }

        function getSquad(teamName) {
            const data = TEAM_SQUADS[teamName];
            if (!data) return null;
            const players = data.players.map(p => {
                const parts = p.split('-');
                return { number: parts[0], name: parts[1], pos: parts[2] || 'MF' };
            });
            return { bg: data.bg, border: data.border, text: data.text, players: players };
        }

        function loadMatch() {
            const teamA = teamASelect.value;
            const teamB = teamBSelect.value;
            currentTeamA = teamA;
            currentTeamB = teamB;

            document.querySelectorAll('.player-wrapper').forEach(el => el.remove());
            clearCanvas();
            fieldPlayers = [];
            benchPlayers = [];
            selectedBenchIdx = null;
            swapHint.classList.remove('show');

            const squadA = getSquad(teamA);
            const squadB = getSquad(teamB);

            if (!squadA || !squadB) {
                benchPanel.innerHTML = `<span class="bench-label">🔄 替补席</span><span style="color:#ff3366;">缺少阵容数据</span>`;
                return;
            }

            renderFieldTeam(squadA, true);
            renderFieldTeam(squadB, false);
            refreshBenchUI();

            createPlayerNode(390, 240, "⚽", "足球", "#fff", "#333", "#000", true);
            document.getElementById('statusInfo').textContent = `点击替补球员换人 · ${teamA} vs ${teamB}`;
        }

        function renderFieldTeam(squad, isLeft) {
            const count = Math.min(11, squad.players.length);
            const players = squad.players.slice(0, count);
            const bg = squad.bg;
            const border = squad.border;
            const text = squad.text;

            for (let i = 0; i < count; i++) {
                let x, y;
                if (i === 0) {
                    x = isLeft ? 40 : 730; y = 240;
                } else {
                    const role = i <= 4 ? 'def' : (i <= 8 ? 'mid' : 'fwd');
                    const idx = i <= 4 ? i - 1 : (i <= 8 ? i - 5 : i - 9);
                    if (role === 'def') { x = isLeft ? 120 + 10 * idx : 680 - 10 * idx; y = 70 + idx * 45; }
                    else if (role === 'mid') { x = isLeft ? 220 + 10 * idx : 580 - 10 * idx; y = 70 + idx * 45; }
                    else { x = isLeft ? 340 + 10 * idx : 460 - 10 * idx; y = 80 + idx * 50; }
                    
                    if (i === 1) { x = isLeft ? 80 : 720; y = 160; }
                    if (i === 2) { x = isLeft ? 80 : 720; y = 240; }
                    if (i === 3) { x = isLeft ? 80 : 720; y = 320; }
                    if (i === 4) { x = isLeft ? 160 : 640; y = 120; }
                    if (i === 5) { x = isLeft ? 160 : 640; y = 360; }
                    if (i === 6) { x = isLeft ? 240 : 560; y = 160; }
                    if (i === 7) { x = isLeft ? 240 : 560; y = 320; }
                    if (i === 8) { x = isLeft ? 320 : 480; y = 200; }
                    if (i === 9) { x = isLeft ? 320 : 480; y = 280; }
                    if (i === 10) { x = isLeft ? 380 : 420; y = 240; }
                }
                const p = players[i];
                const id = `field-${isLeft ? 'A' : 'B'}-${i}`;
                const node = createPlayerNode(x, y, p.number, p.name, bg, border, text, false);
                node.dataset.id = id; 

                fieldPlayers.push({
                    id: id, team: isLeft ? 'A' : 'B', number: p.number, name: p.name, pos: p.pos,
                    x: x, y: y, bg: bg, border: border, text: text, wrapper: node
                });
            }

            // 加载对应边的初始替补信息到内存中
            const bList = squad.players.slice(11);
            bList.forEach((p, idx) => {
                benchPlayers.push({
                    id: `bench-${isLeft ? 'A' : 'B'}-${idx}`, team: isLeft ? 'A' : 'B',
                    number: p.number, name: p.name, pos: p.pos, bg: bg, border: border, text: text
                });
            });
        }

        // ---------- 【重构核心】动态渲染整个替补席，保持单一数据源同步 ----------
        function refreshBenchUI() {
            const existing = benchPanel.querySelectorAll('.bench-player');
            existing.forEach(el => el.remove());
            
            const emptySpan = document.getElementById('benchEmpty');
            if (emptySpan) emptySpan.style.display = benchPlayers.length === 0 ? 'inline' : 'none';

            benchPlayers.forEach((p, index) => {
                const div = document.createElement('div');
                div.className = 'bench-player';
                div.dataset.team = p.team;
                div.dataset.idx = index;

                const numberColor = p.text === '#ffffff' ? p.bg : p.text;
                div.innerHTML = `
                    <span class="b-number" style="color:${numberColor}">${p.number}</span>
                    <span class="b-name">${p.name}</span>
                    <span class="b-pos">${p.pos}</span>
                `;
                
                // 如果当前替补被选中了，在重新渲染时为其保持高亮状态
                if (selectedBenchIdx === index) {
                    div.style.border = '2px solid #ff3366';
                    div.style.boxShadow = '0 0 12px rgba(255, 51, 102, 0.4)';
                }

                div.addEventListener('click', (e) => {
                    e.stopPropagation();
                    onBenchClick(div, p.team, index, p);
                });
                benchPanel.appendChild(div);
            });
        }

        function createPlayerNode(x, y, number, name, bg, border, textColor, isBall) {
            const wrapper = document.createElement('div');
            wrapper.className = 'player-wrapper';
            wrapper.style.left = x + 'px';
            wrapper.style.top = y + 'px';

            const circle = document.createElement('div');
            circle.className = isBall ? 'player-circle ball' : 'player-circle';
            if (!isBall) {
                circle.style.backgroundColor = bg;
                circle.style.border = `2px solid ${border}`;
                circle.style.color = textColor;
            }
            circle.textContent = number;
            wrapper.appendChild(circle);

            if (!isBall) {
                const nameLabel = document.createElement('div');
                nameLabel.className = 'player-name';
                nameLabel.textContent = name;
                wrapper.appendChild(nameLabel);
            }

            wrapper.addEventListener('mousedown', (e) => {
                if (isDrawMode) return;
                e.preventDefault();
                const boardRect = board.getBoundingClientRect();
                let shiftX = e.clientX - wrapper.getBoundingClientRect().left;
                let shiftY = e.clientY - wrapper.getBoundingClientRect().top;

                function moveAt(clientX, clientY) {
                    let newLeft = clientX - boardRect.left - shiftX;
                    let newTop = clientY - boardRect.top - shiftY;
                    newLeft = Math.max(0, Math.min(newLeft, boardRect.width - wrapper.offsetWidth));
                    newTop = Math.max(0, Math.min(newTop, boardRect.height - wrapper.offsetHeight));
                    wrapper.style.left = newLeft + 'px';
                    wrapper.style.top = newTop + 'px';
                    
                    const id = wrapper.dataset.id;
                    if (id) {
                        const found = fieldPlayers.find(p => p.id === id);
                        if (found) { found.x = newLeft; found.y = newTop; }
                    }
                }

                function onMouseMove(e) { moveAt(e.clientX, e.clientY); }
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', () => {
                    document.removeEventListener('mousemove', onMouseMove);
                }, { once: true });
            });

            board.appendChild(wrapper);
            return wrapper;
        }

        // ---------- 换人交互流程控制 ----------
        function onBenchClick(el, teamSide, globalBenchIdx, playerData) {
            if (isDrawMode) return;

            // 取消场上多余的高亮阴影
            document.querySelectorAll('.player-wrapper').forEach(w => {
                w.style.boxShadow = 'none'; w.style.transform = ''; w.style.cursor = '';
            });

            // 如果点击同一个选中的替补，则取消选中
            if (selectedBenchIdx === globalBenchIdx) {
                selectedBenchIdx = null;
                refreshBenchUI();
                swapHint.classList.remove('show');
                return;
            }

            selectedBenchIdx = globalBenchIdx;
            refreshBenchUI(); // 局部刷新重绘画板高亮

            // 高亮当前边场上 11 名对应球员
            document.querySelectorAll('.player-wrapper').forEach(w => {
                const id = w.dataset.id;
                if (id && id.startsWith(`field-${teamSide}`)) {
                    w.style.boxShadow = '0 0 16px #ff3366';
                    w.style.transform = 'scale(1.08)';
                    w.style.cursor = 'pointer';
                }
            });

            swapHint.textContent = `⚡ 点击场上 ${teamSide === 'A' ? currentTeamA : currentTeamB} 球员完成换入`;
            swapHint.classList.add('show');

            // 拦截场上球员点击事件
            const fieldClickHandler = (e) => {
                const targetWrapper = e.target.closest('.player-wrapper');
                if (!targetWrapper) return;
                const fieldId = targetWrapper.dataset.id;
                
                if (fieldId && fieldId.startsWith(`field-${teamSide}`)) {
                    e.stopPropagation();
                    executeSwap(globalBenchIdx, fieldId, targetWrapper);
                    cleanup();
                }
            };

            const cleanup = () => {
                document.removeEventListener('click', fieldClickHandler, true);
                document.querySelectorAll('.player-wrapper').forEach(w => {
                    w.style.boxShadow = 'none'; w.style.transform = ''; w.style.cursor = '';
                });
                selectedBenchIdx = null;
                refreshBenchUI();
            };

            // 全局非目标区域点击，取消本次换人
            const cancelHandler = () => {
                cleanup();
                document.removeEventListener('click', cancelHandler);
            };

            // 使用 capture 捕获流确保优先截获
            document.addEventListener('click', fieldClickHandler, true);
            setTimeout(() => { document.addEventListener('click', cancelHandler, { once: true }); }, 50);
        }

        // ---------- 【彻底修复】安全的属性对调数据操作 ----------
        function executeSwap(globalBenchIdx, fieldId, fieldWrapper) {
            const fieldIdx = fieldPlayers.findIndex(p => p.id === fieldId);
            if (fieldIdx === -1 || globalBenchIdx === null) return;

            const fPlayer = fieldPlayers[fieldIdx];
            const bPlayer = benchPlayers[globalBenchIdx];

            // 1. 临时存储场上球员基础数据
            const tempField = {
                number: fPlayer.number,
                name: fPlayer.name,
                pos: fPlayer.pos,
                bg: fPlayer.bg,
                border: fPlayer.border,
                text: fPlayer.text
            };

            // 2. 完美的“双向互换”数据结构核心
            fPlayer.number = bPlayer.number;
            fPlayer.name = bPlayer.name;
            fPlayer.pos = bPlayer.pos;
            fPlayer.bg = bPlayer.bg;
            fPlayer.border = bPlayer.border;
            fPlayer.text = bPlayer.text;

            bPlayer.number = tempField.number;
            bPlayer.name = tempField.name;
            bPlayer.pos = tempField.pos;
            bPlayer.bg = tempField.bg;
            bPlayer.border = tempField.border;
            bPlayer.text = tempField.text;

            // 3. 实时刷新沙盘场上的 DOM 节点
            const circle = fieldWrapper.querySelector('.player-circle');
            if (circle) {
                circle.textContent = fPlayer.number;
                circle.style.backgroundColor = fPlayer.bg;
                circle.style.border = `2px solid ${fPlayer.border}`;
                circle.style.color = fPlayer.text;
            }
            const nameLabel = fieldWrapper.querySelector('.player-name');
            if (nameLabel) nameLabel.textContent = fPlayer.name;

            // 4. 显示成功提示弹窗
            swapHint.textContent = `✅ 换人完成！${fPlayer.name} 已上场，${bPlayer.name} 已退至替补席`;
            swapHint.classList.add('show');
            setTimeout(() => swapHint.classList.remove('show'), 2500);
        }

        function toggleMode() {
            isDrawMode = !isDrawMode;
            if (isDrawMode) {
                modeBtn.textContent = '✍️ 画线';
                modeBtn.style.backgroundColor = '#ff9800';
                canvas.style.pointerEvents = 'auto';
                document.getElementById('statusInfo').textContent = '画线模式 · 在球场上拖拽绘制战术路线';
            } else {
                modeBtn.textContent = '✋ 拖拽';
                modeBtn.style.backgroundColor = '#4CAF50';
                canvas.style.pointerEvents = 'none';
                document.getElementById('statusInfo').textContent = '点击替补球员换人';
                selectedBenchIdx = null;
                refreshBenchUI();
                swapHint.classList.remove('show');
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            if (!isDrawMode) return;
            isDrawing = true;
            ctx.beginPath();
            ctx.moveTo(e.offsetX, e.offsetY);
        });
        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing || !isDrawMode) return;
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.strokeStyle = '#ffff00';
            ctx.lineWidth = 3;
            ctx.setLineDash([6, 6]);
            ctx.stroke();
        });
        canvas.addEventListener('mouseup', () => { isDrawing = false; });
        canvas.addEventListener('mouseleave', () => { isDrawing = false; });

        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
        function resetPositions() { loadMatch(); }

        initSelects();
        loadMatch();
    </script>
</body>
</html>
