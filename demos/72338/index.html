<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目成本计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 25px;
        }

        .cost-sections {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .cost-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .cost-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.15);
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .card-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-right: 15px;
        }

        .labor-icon { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .material-icon { background: linear-gradient(135deg, #f093fb, #f5576c); color: white; }
        .warehouse-icon { background: linear-gradient(135deg, #4facfe, #00f2fe); color: white; }

        .card-title {
            font-size: 1.3rem;
            color: #333;
            font-weight: 600;
        }

        .card-subtitle {
            font-size: 0.9rem;
            color: #888;
            margin-top: 3px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input, .form-group select {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(17, 153, 142, 0.4);
        }

        .items-list {
            margin-top: 20px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .item-row:hover {
            background: #e9ecef;
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-weight: 600;
            color: #333;
        }

        .item-detail {
            font-size: 0.85rem;
            color: #666;
            margin-top: 3px;
        }

        .item-cost {
            font-size: 1.2rem;
            font-weight: 700;
            color: #667eea;
            margin-right: 15px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .summary-panel {
            position: sticky;
            top: 20px;
        }

        .summary-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .summary-title {
            font-size: 1.4rem;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        .summary-label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #555;
        }

        .summary-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot-labor { background: linear-gradient(135deg, #667eea, #764ba2); }
        .dot-material { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .dot-warehouse { background: linear-gradient(135deg, #4facfe, #00f2fe); }

        .summary-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
        }

        .total-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 3px solid #667eea;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-label {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
        }

        .total-value {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
        }

        .action-buttons {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .action-buttons .btn {
            width: 100%;
            justify-content: center;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #888;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .summary-panel {
                position: static;
            }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #333;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .report-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .report-modal.show {
            display: flex;
        }

        .report-content {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .report-title {
            font-size: 1.5rem;
            color: #333;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #888;
        }

        .report-section {
            margin-bottom: 20px;
        }

        .report-section-title {
            font-size: 1.1rem;
            color: #667eea;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .report-table {
            width: 100%;
            border-collapse: collapse;
        }

        .report-table th,
        .report-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }

        .report-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 项目成本计算器</h1>
            <p>精确计算人工成本、材料损耗成本和租仓成本</p>
        </div>

        <div class="main-content">
            <div class="cost-sections">
                <!-- 人工成本 -->
                <div class="cost-card">
                    <div class="card-header">
                        <div class="card-icon labor-icon">👷</div>
                        <div>
                            <div class="card-title">人工成本</div>
                            <div class="card-subtitle">计算项目所需的人工费用</div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>工种/职位</label>
                            <input type="text" id="laborPosition" placeholder="例如：技术工人">
                        </div>
                        <div class="form-group">
                            <label>人数</label>
                            <input type="number" id="laborCount" placeholder="1" min="1">
                        </div>
                        <div class="form-group">
                            <label>日薪/单价 (元)</label>
                            <input type="number" id="laborPrice" placeholder="300" min="0">
                        </div>
                        <div class="form-group">
                            <label>工作天数</label>
                            <input type="number" id="laborDays" placeholder="30" min="1">
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="addLaborCost()">
                        <span>+</span> 添加人工成本
                    </button>
                    <div class="items-list" id="laborList">
                        <div class="empty-state">
                            <div class="empty-state-icon">👷</div>
                            <p>暂无人工成本数据</p>
                        </div>
                    </div>
                </div>

                <!-- 材料损耗成本 -->
                <div class="cost-card">
                    <div class="card-header">
                        <div class="card-icon material-icon">📦</div>
                        <div>
                            <div class="card-title">材料损耗成本</div>
                            <div class="card-subtitle">计算材料采购及损耗费用</div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>材料名称</label>
                            <input type="text" id="materialName" placeholder="例如：钢材">
                        </div>
                        <div class="form-group">
                            <label>数量</label>
                            <input type="number" id="materialQuantity" placeholder="100" min="0">
                        </div>
                        <div class="form-group">
                            <label>单位</label>
                            <input type="text" id="materialUnit" placeholder="kg/米/个">
                        </div>
                        <div class="form-group">
                            <label>单价 (元)</label>
                            <input type="number" id="materialPrice" placeholder="50" min="0">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>损耗率 (%)</label>
                            <input type="number" id="materialLossRate" placeholder="5" min="0" max="100" value="5">
                        </div>
                        <div class="form-group">
                            <label>运输费用 (元)</label>
                            <input type="number" id="materialTransport" placeholder="0" min="0" value="0">
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="addMaterialCost()">
                        <span>+</span> 添加材料成本
                    </button>
                    <div class="items-list" id="materialList">
                        <div class="empty-state">
                            <div class="empty-state-icon">📦</div>
                            <p>暂无材料成本数据</p>
                        </div>
                    </div>
                </div>

                <!-- 租仓成本 -->
                <div class="cost-card">
                    <div class="card-header">
                        <div class="card-icon warehouse-icon">🏭</div>
                        <div>
                            <div class="card-title">租仓成本</div>
                            <div class="card-subtitle">计算仓库租赁及相关费用</div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>仓库名称/位置</label>
                            <input type="text" id="warehouseName" placeholder="例如：A区仓库">
                        </div>
                        <div class="form-group">
                            <label>租赁面积 (㎡)</label>
                            <input type="number" id="warehouseArea" placeholder="500" min="0">
                        </div>
                        <div class="form-group">
                            <label>租金单价 (元/㎡/月)</label>
                            <input type="number" id="warehousePrice" placeholder="30" min="0">
                        </div>
                        <div class="form-group">
                            <label>租赁月数</label>
                            <input type="number" id="warehouseMonths" placeholder="12" min="1">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>押金 (元)</label>
                            <input type="number" id="warehouseDeposit" placeholder="0" min="0" value="0">
                        </div>
                        <div class="form-group">
                            <label>物业费 (元/月)</label>
                            <input type="number" id="warehousePropertyFee" placeholder="0" min="0" value="0">
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="addWarehouseCost()">
                        <span>+</span> 添加租仓成本
                    </button>
                    <div class="items-list" id="warehouseList">
                        <div class="empty-state">
                            <div class="empty-state-icon">🏭</div>
                            <p>暂无租仓成本数据</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 汇总面板 -->
            <div class="summary-panel">
                <div class="summary-card">
                    <div class="summary-title">💰 成本汇总</div>
                    
                    <div class="summary-item">
                        <div class="summary-label">
                            <div class="summary-dot dot-labor"></div>
                            <span>人工成本</span>
                        </div>
                        <div class="summary-value" id="totalLabor">¥0.00</div>
                    </div>
                    
                    <div class="summary-item">
                        <div class="summary-label">
                            <div class="summary-dot dot-material"></div>
                            <span>材料损耗成本</span>
                        </div>
                        <div class="summary-value" id="totalMaterial">¥0.00</div>
                    </div>
                    
                    <div class="summary-item">
                        <div class="summary-label">
                            <div class="summary-dot dot-warehouse"></div>
                            <span>租仓成本</span>
                        </div>
                        <div class="summary-value" id="totalWarehouse">¥0.00</div>
                    </div>
                    
                    <div class="total-section">
                        <div class="total-row">
                            <div class="total-label">总成本</div>
                            <div class="total-value" id="grandTotal">¥0.00</div>
                        </div>
                    </div>

                    <div class="action-buttons">
                        <button class="btn btn-success" onclick="generateReport()">
                            <span>📋</span> 生成报表
                        </button>
                        <button class="btn btn-danger" onclick="clearAllData()">
                            <span>🗑️</span> 清空数据
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <!-- 报表模态框 -->
    <div class="report-modal" id="reportModal">
        <div class="report-content">
            <div class="report-header">
                <div class="report-title">📊 项目成本报表</div>
                <button class="close-btn" onclick="closeReport()">&times;</button>
            </div>
            <div id="reportBody"></div>
        </div>
    </div>

    <script>
        // 数据存储
        let laborCosts = [];
        let materialCosts = [];
        let warehouseCosts = [];

        // 显示提示
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // 格式化金额
        function formatMoney(amount) {
            return '¥' + amount.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        // 添加人工成本
        function addLaborCost() {
            const position = document.getElementById('laborPosition').value.trim();
            const count = parseInt(document.getElementById('laborCount').value) || 1;
            const price = parseFloat(document.getElementById('laborPrice').value) || 0;
            const days = parseInt(document.getElementById('laborDays').value) || 1;

            if (!position) {
                showToast('请输入工种/职位');
                return;
            }

            if (price <= 0) {
                showToast('请输入有效的日薪');
                return;
            }

            const cost = {
                id: Date.now(),
                position,
                count,
                price,
                days,
                total: count * price * days
            };

            laborCosts.push(cost);
            renderLaborList();
            updateSummary();
            clearLaborInputs();
            showToast('人工成本已添加');
        }

        // 添加材料成本
        function addMaterialCost() {
            const name = document.getElementById('materialName').value.trim();
            const quantity = parseFloat(document.getElementById('materialQuantity').value) || 0;
            const unit = document.getElementById('materialUnit').value.trim() || '个';
            const price = parseFloat(document.getElementById('materialPrice').value) || 0;
            const lossRate = parseFloat(document.getElementById('materialLossRate').value) || 0;
            const transport = parseFloat(document.getElementById('materialTransport').value) || 0;

            if (!name) {
                showToast('请输入材料名称');
                return;
            }

            if (quantity <= 0 || price <= 0) {
                showToast('请输入有效的数量和单价');
                return;
            }

            const baseCost = quantity * price;
            const lossCost = baseCost * (lossRate / 100);
            const total = baseCost + lossCost + transport;

            const cost = {
                id: Date.now(),
                name,
                quantity,
                unit,
                price,
                lossRate,
                transport,
                total
            };

            materialCosts.push(cost);
            renderMaterialList();
            updateSummary();
            clearMaterialInputs();
            showToast('材料成本已添加');
        }

        // 添加租仓成本
        function addWarehouseCost() {
            const name = document.getElementById('warehouseName').value.trim();
            const area = parseFloat(document.getElementById('warehouseArea').value) || 0;
            const price = parseFloat(document.getElementById('warehousePrice').value) || 0;
            const months = parseInt(document.getElementById('warehouseMonths').value) || 1;
            const deposit = parseFloat(document.getElementById('warehouseDeposit').value) || 0;
            const propertyFee = parseFloat(document.getElementById('warehousePropertyFee').value) || 0;

            if (!name) {
                showToast('请输入仓库名称');
                return;
            }

            if (area <= 0 || price <= 0) {
                showToast('请输入有效的面积和租金');
                return;
            }

            const rentCost = area * price * months;
            const propertyCost = propertyFee * months;
            const total = rentCost + deposit + propertyCost;

            const cost = {
                id: Date.now(),
                name,
                area,
                price,
                months,
                deposit,
                propertyFee,
                rentCost,
                propertyCost,
                total
            };

            warehouseCosts.push(cost);
            renderWarehouseList();
            updateSummary();
            clearWarehouseInputs();
            showToast('租仓成本已添加');
        }

        // 删除人工成本
        function deleteLaborCost(id) {
            laborCosts = laborCosts.filter(item => item.id !== id);
            renderLaborList();
            updateSummary();
            showToast('已删除');
        }

        // 删除材料成本
        function deleteMaterialCost(id) {
            materialCosts = materialCosts.filter(item => item.id !== id);
            renderMaterialList();
            updateSummary();
            showToast('已删除');
        }

        // 删除租仓成本
        function deleteWarehouseCost(id) {
            warehouseCosts = warehouseCosts.filter(item => item.id !== id);
            renderWarehouseList();
            updateSummary();
            showToast('已删除');
        }

        // 渲染人工成本列表
        function renderLaborList() {
            const list = document.getElementById('laborList');
            if (laborCosts.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">👷</div>
                        <p>暂无人工成本数据</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = laborCosts.map(item => `
                <div class="item-row">
                    <div class="item-info">
                        <div class="item-name">${item.position}</div>
                        <div class="item-detail">${item.count}人 × ${formatMoney(item.price)}/天 × ${item.days}天</div>
                    </div>
                    <div class="item-cost">${formatMoney(item.total)}</div>
                    <button class="btn btn-danger btn-small" onclick="deleteLaborCost(${item.id})">删除</button>
                </div>
            `).join('');
        }

        // 渲染材料成本列表
        function renderMaterialList() {
            const list = document.getElementById('materialList');
            if (materialCosts.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📦</div>
                        <p>暂无材料成本数据</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = materialCosts.map(item => `
                <div class="item-row">
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        <div class="item-detail">${item.quantity}${item.unit} × ${formatMoney(item.price)} (损耗${item.lossRate}%)</div>
                    </div>
                    <div class="item-cost">${formatMoney(item.total)}</div>
                    <button class="btn btn-danger btn-small" onclick="deleteMaterialCost(${item.id})">删除</button>
                </div>
            `).join('');
        }

        // 渲染租仓成本列表
        function renderWarehouseList() {
            const list = document.getElementById('warehouseList');
            if (warehouseCosts.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🏭</div>
                        <p>暂无租仓成本数据</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = warehouseCosts.map(item => `
                <div class="item-row">
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        <div class="item-detail">${item.area}㎡ × ${formatMoney(item.price)}/㎡/月 × ${item.months}月</div>
                    </div>
                    <div class="item-cost">${formatMoney(item.total)}</div>
                    <button class="btn btn-danger btn-small" onclick="deleteWarehouseCost(${item.id})">删除</button>
                </div>
            `).join('');
        }

        // 更新汇总
        function updateSummary() {
            const totalLabor = laborCosts.reduce((sum, item) => sum + item.total, 0);
            const totalMaterial = materialCosts.reduce((sum, item) => sum + item.total, 0);
            const totalWarehouse = warehouseCosts.reduce((sum, item) => sum + item.total, 0);
            const grandTotal = totalLabor + totalMaterial + totalWarehouse;

            document.getElementById('totalLabor').textContent = formatMoney(totalLabor);
            document.getElementById('totalMaterial').textContent = formatMoney(totalMaterial);
            document.getElementById('totalWarehouse').textContent = formatMoney(totalWarehouse);
            document.getElementById('grandTotal').textContent = formatMoney(grandTotal);
        }

        // 清空输入
        function clearLaborInputs() {
            document.getElementById('laborPosition').value = '';
            document.getElementById('laborCount').value = '';
            document.getElementById('laborPrice').value = '';
            document.getElementById('laborDays').value = '';
        }

        function clearMaterialInputs() {
            document.getElementById('materialName').value = '';
            document.getElementById('materialQuantity').value = '';
            document.getElementById('materialUnit').value = '';
            document.getElementById('materialPrice').value = '';
            document.getElementById('materialLossRate').value = '5';
            document.getElementById('materialTransport').value = '0';
        }

        function clearWarehouseInputs() {
            document.getElementById('warehouseName').value = '';
            document.getElementById('warehouseArea').value = '';
            document.getElementById('warehousePrice').value = '';
            document.getElementById('warehouseMonths').value = '';
            document.getElementById('warehouseDeposit').value = '0';
            document.getElementById('warehousePropertyFee').value = '0';
        }

        // 清空所有数据
        function clearAllData() {
            if (confirm('确定要清空所有数据吗？')) {
                laborCosts = [];
                materialCosts = [];
                warehouseCosts = [];
                renderLaborList();
                renderMaterialList();
                renderWarehouseList();
                updateSummary();
                showToast('所有数据已清空');
            }
        }

        // 生成报表
        function generateReport() {
            const totalLabor = laborCosts.reduce((sum, item) => sum + item.total, 0);
            const totalMaterial = materialCosts.reduce((sum, item) => sum + item.total, 0);
            const totalWarehouse = warehouseCosts.reduce((sum, item) => sum + item.total, 0);
            const grandTotal = totalLabor + totalMaterial + totalWarehouse;

            let reportHTML = `
                <div class="report-section">
                    <div class="report-section-title">人工成本明细</div>
                    ${laborCosts.length > 0 ? `
                        <table class="report-table">
                            <thead>
                                <tr>
                                    <th>工种</th>
                                    <th>人数</th>
                                    <th>日薪</th>
                                    <th>天数</th>
                                    <th>小计</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${laborCosts.map(item => `
                                    <tr>
                                        <td>${item.position}</td>
                                        <td>${item.count}人</td>
                                        <td>${formatMoney(item.price)}</td>
                                        <td>${item.days}天</td>
                                        <td>${formatMoney(item.total)}</td>
                                    </tr>
                                `).join('')}
                                <tr style="font-weight: bold; background: #f8f9fa;">
                                    <td colspan="4">人工成本合计</td>
                                    <td>${formatMoney(totalLabor)}</td>
                                </tr>
                            </tbody>
                        </table>
                    ` : '<p style="color: #888;">无数据</p>'}
                </div>

                <div class="report-section">
                    <div class="report-section-title">材料损耗成本明细</div>
                    ${materialCosts.length > 0 ? `
                        <table class="report-table">
                            <thead>
                                <tr>
                                    <th>材料</th>
                                    <th>数量</th>
                                    <th>单价</th>
                                    <th>损耗率</th>
                                    <th>小计</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${materialCosts.map(item => `
                                    <tr>
                                        <td>${item.name}</td>
                                        <td>${item.quantity}${item.unit}</td>
                                        <td>${formatMoney(item.price)}</td>
                                        <td>${item.lossRate}%</td>
                                        <td>${formatMoney(item.total)}</td>
                                    </tr>
                                `).join('')}
                                <tr style="font-weight: bold; background: #f8f9fa;">
                                    <td colspan="4">材料成本合计</td>
                                    <td>${formatMoney(totalMaterial)}</td>
                                </tr>
                            </tbody>
                        </table>
                    ` : '<p style="color: #888;">无数据</p>'}
                </div>

                <div class="report-section">
                    <div class="report-section-title">租仓成本明细</div>
                    ${warehouseCosts.length > 0 ? `
                        <table class="report-table">
                            <thead>
                                <tr>
                                    <th>仓库</th>
                                    <th>面积</th>
                                    <th>租金</th>
                                    <th>月数</th>
                                    <th>小计</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${warehouseCosts.map(item => `
                                    <tr>
                                        <td>${item.name}</td>
                                        <td>${item.area}㎡</td>
                                        <td>${formatMoney(item.price)}/㎡/月</td>
                                        <td>${item.months}月</td>
                                        <td>${formatMoney(item.total)}</td>
                                    </tr>
                                `).join('')}
                                <tr style="font-weight: bold; background: #f8f9fa;">
                                    <td colspan="4">租仓成本合计</td>
                                    <td>${formatMoney(totalWarehouse)}</td>
                                </tr>
                            </tbody>
                        </table>
                    ` : '<p style="color: #888;">无数据</p>'}
                </div>

                <div class="report-section" style="background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 20px; border-radius: 10px; margin-top: 20px;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 1.2rem; font-weight: 600;">项目总成本</span>
                        <span style="font-size: 1.8rem; font-weight: 700;">${formatMoney(grandTotal)}</span>
                    </div>
                </div>
            `;

            document.getElementById('reportBody').innerHTML = reportHTML;
            document.getElementById('reportModal').classList.add('show');
        }

        // 关闭报表
        function closeReport() {
            document.getElementById('reportModal').classList.remove('show');
        }

        // 点击模态框外部关闭
        document.getElementById('reportModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeReport();
            }
        });

        // 初始化
        updateSummary();
    </script>
</body>
</html>
