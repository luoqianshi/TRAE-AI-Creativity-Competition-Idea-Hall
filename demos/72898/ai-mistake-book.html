<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI智能错题整理与复盘助手</title>
<style>
:root {
  --primary:#4F46E5; --primary-light:#EEF2FF; --primary-hover:#4338CA;
  --green:#10B981; --green-light:#D1FAE5;
  --red:#EF4444; --red-light:#FEE2E2;
  --orange:#F59E0B; --orange-light:#FEF3C7;
  --gray-50:#F9FAFB; --gray-100:#F3F4F6; --gray-200:#E5E7EB; --gray-300:#D1D5DB;
  --gray-400:#9CA3AF; --gray-500:#6B7280; --gray-600:#4B5563;
  --gray-700:#374151; --gray-800:#1F2937; --gray-900:#111827;
  --radius:14px; --radius-sm:8px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
  --shadow-lg:0 12px 32px rgba(0,0,0,.1);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--gray-100); color:var(--gray-900); line-height:1.7; min-height:100vh;
}

/* ===== TOP NAV ===== */
.top-nav{
  position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--gray-200);
  padding:0 32px;display:flex;align-items:center;height:60px;gap:8px;
}
.top-nav .logo{
  font-size:18px;font-weight:800;color:var(--gray-900);margin-right:32px;white-space:nowrap;
}
.top-nav .logo span{background:linear-gradient(135deg,var(--primary),#7C3AED);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.top-nav .nav-links{display:flex;gap:4px;flex:1;}
.top-nav .nav-link{
  padding:8px 18px;border-radius:8px;font-size:14px;font-weight:500;
  color:var(--gray-600);cursor:pointer;transition:.15s;border:none;background:none;
}
.top-nav .nav-link:hover{background:var(--gray-100);color:var(--gray-900);}
.top-nav .nav-link.active{background:var(--primary-light);color:var(--primary);font-weight:600;}
.top-nav .user-info{display:flex;align-items:center;gap:10px;padding-left:16px;border-left:1px solid var(--gray-200);}
.top-nav .user-avatar{
  width:34px;height:34px;border-radius:50%;background:var(--primary-light);
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.top-nav .user-name{font-size:13px;font-weight:600;color:var(--gray-700);}

/* ===== MAIN LAYOUT ===== */
.page-wrapper{max-width:1200px;margin:0 auto;padding:28px 32px 60px;}

/* ===== HOME ===== */
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}
@media(max-width:800px){.home-grid{grid-template-columns:1fr;}}

.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
@media(max-width:768px){.stats-row{grid-template-columns:repeat(2,1fr);}}
.stat-card{
  background:#fff;border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:14px;transition:.2s;
}
.stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.stat-icon{
  width:48px;height:48px;border-radius:12px;display:flex;
  align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
}
.stat-icon.purple{background:var(--primary-light);}
.stat-icon.green{background:var(--green-light);}
.stat-icon.orange{background:var(--orange-light);}
.stat-icon.red{background:var(--red-light);}
.stat-info .stat-num{font-size:26px;font-weight:800;color:var(--gray-900);line-height:1.2;}
.stat-info .stat-label{font-size:13px;color:var(--gray-500);margin-top:2px;}

.panel{
  background:#fff;border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);
}
.panel-title{font-size:16px;font-weight:700;color:var(--gray-900);margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;}
.panel-title .more{font-size:13px;color:var(--primary);font-weight:500;cursor:pointer;}

/* Weak chart */
.weak-item{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.weak-item:last-child{margin-bottom:0;}
.weak-tag{
  font-size:13px;font-weight:600;padding:5px 14px;border-radius:100px;min-width:64px;text-align:center;
}
.weak-tag.math{background:var(--primary-light);color:var(--primary);}
.weak-tag.eng{background:var(--green-light);color:#059669;}
.weak-tag.phys{background:var(--orange-light);color:#D97706;}
.weak-bar-wrap{flex:1;height:10px;background:var(--gray-200);border-radius:5px;overflow:hidden;}
.weak-bar{height:100%;border-radius:5px;width:0%;transition:width .8s ease;}
.weak-bar.math-bar{background:var(--primary);}
.weak-bar.eng-bar{background:var(--green);}
.weak-bar.phys-bar{background:var(--orange);}
.weak-pct{font-size:14px;font-weight:700;color:var(--gray-600);min-width:40px;text-align:right;}

/* AI card */
.ai-card{
  background:linear-gradient(135deg,var(--primary),#7C3AED);
  border-radius:var(--radius);padding:28px;color:#fff;box-shadow:var(--shadow-lg);
  margin-bottom:24px;
}
.ai-card .ai-label{font-size:13px;opacity:.8;margin-bottom:6px;}
.ai-card .ai-title{font-size:22px;font-weight:800;margin-bottom:8px;}
.ai-card .ai-desc{font-size:14px;opacity:.9;margin-bottom:18px;}
.btn-white{
  display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--primary);
  border:none;border-radius:100px;padding:10px 24px;font-size:15px;font-weight:600;
  cursor:pointer;transition:.2s;
}
.btn-white:hover{transform:scale(1.03);box-shadow:0 4px 12px rgba(0,0,0,.15);}
.btn-white:active{transform:scale(.97);}

/* Error list */
.error-list .error-item{
  display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--gray-50);
  border-radius:var(--radius-sm);margin-bottom:8px;cursor:pointer;transition:.2s;
}
.error-list .error-item:hover{background:var(--primary-light);}
.error-icon{
  width:40px;height:40px;border-radius:10px;display:flex;
  align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
}
.error-icon.math-bg{background:#EDE9FE;}
.error-icon.eng-bg{background:#D1FAE5;}
.error-icon.phys-bg{background:#FEF3C7;}
.error-info{flex:1;min-width:0;}
.error-info .error-title{font-size:14px;font-weight:600;color:var(--gray-900);}
.error-info .error-meta{font-size:12px;color:var(--gray-500);margin-top:3px;}
.error-badge{font-size:12px;font-weight:600;padding:4px 12px;border-radius:100px;}
.error-badge.wrong{background:var(--red-light);color:var(--red);}
.error-badge.reviewed{background:var(--green-light);color:#059669;}

/* ===== ADD PAGE ===== */
.add-layout{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
@media(max-width:768px){.add-layout{grid-template-columns:1fr;}}
.upload-panel{
  background:#fff;border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);
}
.upload-zone{
  border:2px dashed var(--gray-300);border-radius:var(--radius);padding:50px 24px;
  text-align:center;cursor:pointer;transition:.2s;position:relative;
}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--primary);background:var(--primary-light);}
.upload-zone .upload-icon{font-size:52px;margin-bottom:12px;}
.upload-zone .upload-text{font-size:16px;font-weight:600;color:var(--gray-700);}
.upload-zone .upload-hint{font-size:13px;color:var(--gray-400);margin-top:6px;}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
.preview-img{
  width:100%;border-radius:var(--radius);display:none;max-height:400px;object-fit:cover;
  border:2px solid var(--primary);
}
.analyzing{display:none;text-align:center;padding:40px 20px;}
.spinner{
  width:48px;height:48px;border:4px solid var(--gray-200);
  border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;
  margin:0 auto 18px;
}
@keyframes spin{to{transform:rotate(360deg);}}
.analyze-text{font-size:15px;color:var(--gray-600);}
.analyze-step{font-size:13px;color:var(--primary);margin-top:8px;}

.result-panel{
  background:#fff;border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);
}
.result-panel .result-section{margin-bottom:20px;}
.result-panel .result-label{font-size:12px;color:var(--gray-500);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
.result-panel .result-val{font-size:16px;font-weight:600;color:var(--gray-900);}
.result-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.result-tag{
  font-size:13px;padding:5px 14px;border-radius:100px;font-weight:500;
}
.result-tag.error-type{background:var(--red-light);color:var(--red);}
.result-tag.knowledge{background:var(--primary-light);color:var(--primary);}
.result-actions{display:flex;gap:12px;margin-top:24px;}
.btn{
  padding:12px 24px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;
  cursor:pointer;border:none;transition:.2s;
}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-hover);}
.btn-outline{background:#fff;color:var(--primary);border:1.5px solid var(--primary);}
.btn-outline:hover{background:var(--primary-light);}
.btn:active{transform:scale(.97);}

.demo-btns{margin-top:24px;text-align:center;}
.demo-btns p{font-size:13px;color:var(--gray-400);margin-bottom:10px;}
.demo-btns .demo-group{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.demo-btn{
  padding:9px 18px;background:var(--gray-50);border:1px solid var(--gray-200);
  border-radius:100px;font-size:13px;cursor:pointer;color:var(--gray-600);transition:.2s;
}
.demo-btn:hover{background:var(--primary-light);color:var(--primary);border-color:var(--primary-light);}

.empty-panel{
  background:#fff;border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;min-height:300px;
}
.empty-panel .empty-content{text-align:center;}
.empty-panel .empty-icon{font-size:64px;margin-bottom:12px;opacity:.5;}
.empty-panel .empty-text{font-size:15px;color:var(--gray-500);}

/* ===== BOOK PAGE ===== */
.filter-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.filter-btn{
  padding:8px 18px;border-radius:100px;font-size:13px;font-weight:500;
  border:1px solid var(--gray-200);background:#fff;color:var(--gray-600);cursor:pointer;transition:.2s;
}
.filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.filter-btn:hover:not(.active){background:var(--gray-50);}

.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;}
@media(max-width:400px){.book-grid{grid-template-columns:1fr;}}

.book-item{
  background:#fff;border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow);
  cursor:pointer;transition:.2s;position:relative;display:flex;gap:14px;
}
.book-item:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
.book-num{
  width:38px;height:38px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0;
}
.book-num.math-bg{background:var(--primary);}
.book-num.eng-bg{background:var(--green);}
.book-num.phys-bg{background:var(--orange);}
.book-content{flex:1;min-width:0;}
.book-content .book-title{font-size:14px;font-weight:600;color:var(--gray-900);margin-bottom:6px;}
.book-content .book-detail{font-size:12px;color:var(--gray-500);line-height:1.6;}
.book-badge{
  position:absolute;top:16px;right:16px;font-size:11px;font-weight:700;
  padding:3px 10px;border-radius:100px;
}
.book-badge.new{background:var(--red-light);color:var(--red);}
.book-badge.mastered{background:var(--green-light);color:#059669;}
.book-count{font-size:13px;color:var(--gray-500);margin-bottom:16px;}

/* ===== REVIEW PAGE ===== */
.review-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;margin-bottom:24px;}
@media(max-width:400px){.review-grid{grid-template-columns:1fr;}}

.review-card{
  background:#fff;border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);
  transition:.2s;
}
.review-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.review-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.review-date{font-size:16px;font-weight:700;color:var(--gray-900);}
.review-count{font-size:13px;color:var(--gray-500);}
.review-subjects{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.review-subject-tag{
  font-size:12px;padding:4px 12px;border-radius:100px;font-weight:500;
}
.review-subject-tag.math-tag{background:var(--primary-light);color:var(--primary);}
.review-subject-tag.eng-tag{background:var(--green-light);color:#059669;}
.review-subject-tag.phys-tag{background:var(--orange-light);color:#D97706;}
.review-bar{height:8px;background:var(--gray-200);border-radius:4px;overflow:hidden;margin-bottom:12px;}
.review-bar-fill{height:100%;background:var(--primary);border-radius:4px;transition:width .4s;}
.review-action{font-size:13px;font-weight:600;color:var(--primary);cursor:pointer;}

.btn-large{
  display:block;width:100%;padding:16px;background:var(--primary);color:#fff;
  border:none;border-radius:var(--radius);font-size:16px;font-weight:600;
  cursor:pointer;margin-top:8px;transition:.2s;
}
.btn-large:hover{background:var(--primary-hover);}
.btn-large:active{transform:scale(.98);}

.tip-box{
  background:var(--orange-light);border-radius:var(--radius);padding:20px 24px;
  margin-top:20px;
}
.tip-box .tip-title{font-size:15px;font-weight:700;color:#92400E;margin-bottom:6px;}
.tip-box .tip-list{font-size:13px;color:#92400E;line-height:2;}

/* ===== PROFILE PAGE ===== */
.profile-header{text-align:center;padding:32px 0;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:24px;}
.profile-avatar{
  width:80px;height:80px;border-radius:50%;background:var(--primary-light);
  margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:40px;
}
.profile-name{font-size:20px;font-weight:700;color:var(--gray-900);}
.profile-id{font-size:13px;color:var(--gray-400);margin-top:4px;}
.profile-stats{display:flex;justify-content:center;gap:48px;margin-top:20px;}
.profile-stat{text-align:center;}
.profile-stat .ps-num{font-size:24px;font-weight:800;color:var(--primary);}
.profile-stat .ps-label{font-size:12px;color:var(--gray-500);margin-top:2px;}

.menu-panel{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.menu-item{
  display:flex;align-items:center;justify-content:space-between;padding:18px 24px;
  border-bottom:1px solid var(--gray-100);cursor:pointer;transition:.2s;
}
.menu-item:last-child{border-bottom:none;}
.menu-item:hover{background:var(--gray-50);}
.menu-left{display:flex;align-items:center;gap:14px;font-size:15px;font-weight:500;color:var(--gray-800);}
.menu-left .menu-icon{font-size:20px;}
.menu-right{font-size:13px;color:var(--gray-400);}

/* Toast */
.toast{
  position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:999;
  background:var(--gray-900);color:#fff;padding:12px 28px;border-radius:100px;
  font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .3s;
}
.toast.show{opacity:1;}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;
  display:none;align-items:center;justify-content:center;
}
.modal-overlay.show{display:flex;}
.modal-dialog{
  width:90%;max-width:640px;max-height:85vh;overflow-y:auto;
  background:#fff;border-radius:var(--radius);padding:32px;box-shadow:var(--shadow-lg);
}
.modal-dialog .modal-title{font-size:19px;font-weight:700;color:var(--gray-900);margin-bottom:24px;}
.modal-dialog .modal-section{margin-bottom:18px;}
.modal-dialog .modal-label{font-weight:600;font-size:13px;color:var(--gray-500);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px;}
.modal-dialog .modal-val{font-size:15px;color:var(--gray-800);line-height:1.7;}
.modal-dialog .modal-answer-wrong{color:var(--red);font-weight:600;}
.modal-dialog .modal-answer-right{color:var(--green);font-weight:600;}
.modal-dialog .modal-ai-box{
  background:var(--primary-light);padding:14px 18px;border-radius:var(--radius-sm);
  color:var(--primary);font-size:14px;line-height:1.7;
}
.modal-actions{display:flex;gap:12px;margin-top:24px;}
.modal-actions .btn{flex:1;}

/* Page title */
.page-title{font-size:24px;font-weight:800;color:var(--gray-900);margin-bottom:4px;}
.page-subtitle{font-size:14px;color:var(--gray-500);margin-bottom:24px;}
</style>
</head>

</nav>

<!-- ===== MAIN CONTENT ===== -->
<div class="page-wrapper" id="mainContent"></div>

const reviewPlan = [
  {date:'今天',day:'7月6日',count:5,subjects:['数学','英语','物理'],progress:0},
  {date:'明天',day:'7月7日',count:3,subjects:['数学','物理'],progress:0},
  {date:'后天',day:'7月8日',count:2,subjects:['英语'],progress:0},
];

// ========== STATE ==========
let currentTab = 'home';
let currentFilter = 'all';
let uploadedImage = null;
let analyzedData = null;
let analysisInterval = null;

// ========== RENDER ==========
function render() {
  renderNav();
  switch(currentTab) {
    case 'home': renderHome(); break;
    case 'add': renderAdd(); break;
    case 'book': renderBook(); break;
    case 'review': renderReview(); break;
    case 'profile': renderProfile(); break;
  }
}

function renderNav() {
  const navs = [
    {id:'home',label:'🏠 首页'},
    {id:'add',label:'➕ 录入错题'},
    {id:'book',label:'📖 错题本'},
    {id:'review',label:'🔄 智能复盘'},
    {id:'profile',label:'👤 我的'},
  ];
  document.getElementById('navLinks').innerHTML = navs.map(n=>
    `<button class="nav-link ${currentTab===n.id?'active':''}" onclick="switchTab('${n.id}')">${n.label}</button>`
  ).join('');
}

// ========== HOME ==========

  const newErrors = errorBook.filter(e=>e.status==='new').length;
  const reviewed = errorBook.filter(e=>e.status==='reviewed').length;

  document.getElementById('mainContent').innerHTML = `
    <div class="page-title">👋 早上好, 同学</div>
    <div class="page-subtitle">今天也要认真复盘哦~</div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-icon purple">📖</div>
        <div class="stat-info"><div class="stat-num">${total}</div><div class="stat-label">错题总数</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon red">❗</div>
        <div class="stat-info"><div class="stat-num">${newErrors}</div><div class="stat-label">待复习</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green">✅</div>
        <div class="stat-info"><div class="stat-num">${reviewed}</div><div class="stat-label">已掌握</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange">📊</div>
        <div class="stat-info"><div class="stat-num">${Math.round(reviewed/total*100)}%</div><div class="stat-label">掌握率</div></div>
      </div>
    </div>

    <div class="ai-card">
      <div class="ai-label">🤖 AI今日推荐</div>
      <div class="ai-title">今日复盘：${reviewPlan[0].count}道错题</div>
      <div class="ai-desc">包含数学·二次函数、英语·非谓语动词、物理·牛顿定律 —— 基于遗忘曲线智能推送</div>

    </div>

    <div class="home-grid">
      <div class="panel">
        <div class="panel-title">📉 知识薄弱点 <span class="more" onclick="switchTab('review')">复盘计划 →</span></div>

          <span class="weak-tag math">数学</span>
          <div class="weak-bar-wrap"><div class="weak-bar math-bar" id="bar-math" style="width:0%"></div></div>
          <span class="weak-pct">75%</span>
        </div>
        <div class="weak-item">
          <span class="weak-tag eng">英语</span>
          <div class="weak-bar-wrap"><div class="weak-bar eng-bar" id="bar-eng" style="width:0%"></div></div>
          <span class="weak-pct">60%</span>
        </div>
        <div class="weak-item">
          <span class="weak-tag phys">物理</span>
          <div class="weak-bar-wrap"><div class="weak-bar phys-bar" id="bar-phys" style="width:0%"></div></div>
          <span class="weak-pct">45%</span>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">📌 最近录入 <span class="more" onclick="switchTab('book')">查看全部 →</span></div>
        <div class="error-list">
          ${errorBook.slice(0,4).map(e=>`
            <div class="error-item" onclick="showErrorDetail(${e.id})">
              <div class="error-icon ${e.subTag}-bg">${e.icon}</div>
              <div class="error-info">
                <div class="error-title">${e.subject} · ${e.title}</div>
                <div class="error-meta">${e.date} · ${e.错误类型}</div>

              <span class="error-badge ${e.status==='new'?'wrong':'reviewed'}">${e.status==='new'?'待复习':'已掌握'}</span>

  // Animate bars
  setTimeout(()=>{
    ['bar-math','bar-eng','bar-phys'].forEach(id=>{
      const el = document.getElementById(id);

// ========== ADD ==========
function renderAdd() {
  document.getElementById('mainContent').innerHTML = `
    <div class="page-title">➕ 录入错题</div>
    <div class="page-subtitle">拍照或上传错题图片，AI自动识别并分析</div>
    <div class="add-layout">
      <div class="upload-panel" id="uploadPanel">
        <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
          <div class="upload-icon">📷</div>
          <div class="upload-text">点击上传错题图片</div>
          <div class="upload-hint">支持 JPG、PNG 格式，AI自动识别题目内容</div>
          <input type="file" id="fileInput" accept="image/*" onchange="handleUpload(this)">
        </div>
        <img class="preview-img" id="previewImg" alt="预览">
        <div class="analyzing" id="analyzingBox">
          <div class="spinner"></div>
          <div class="analyze-text">AI正在分析中...</div>
          <div class="analyze-step" id="analyzeStep">🔍 识别文字中...</div>
        </div>
        <div class="demo-btns">
          <p>💡 或试试这些示例</p>
          <div class="demo-group">
            ${['数学错题','英语错题','物理错题'].map((t,i)=>`<button class="demo-btn" onclick="demoUpload(${i})">📄 ${t}</button>`).join('')}
          </div>
        </div>
      </div>
      <div class="result-panel" id="resultPanel" style="display:none;"></div>
    </div>
  `;
}

function handleUpload(input) {
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    uploadedImage = e.target.result;
    const preview = document.getElementById('previewImg');
    document.getElementById('uploadZone').style.display = 'none';
    preview.src = uploadedImage;
    preview.style.display = 'block';
    startAnalysis();
  };
  reader.readAsDataURL(file);
}

function demoUpload(index) {
  const demos = [
    {img:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200"><rect width="300" height="200" fill="#f8f9fa"/><text x="20" y="40" font-size="15" font-family="sans-serif" fill="#333">已知二次函数y=x²-4x+5，</text><text x="20" y="65" font-size="15" font-family="sans-serif" fill="#333">求在区间[1,4]上的最大值</text><text x="20" y="90" font-size="15" font-family="sans-serif" fill="#333">和最小值。</text><text x="20" y="130" font-size="12" font-family="sans-serif" fill="#888">我的答案: 最大值13, 最小值2</text><text x="20" y="155" font-size="12" font-family="sans-serif" fill="#888">正确答案: 最大值5, 最小值1</text></svg>')},
    {img:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200"><rect width="300" height="200" fill="#f8f9fa"/><text x="20" y="40" font-size="15" font-family="sans-serif" fill="#333">___ from the mountain,</text><text x="20" y="65" font-size="15" font-family="sans-serif" fill="#333">the city looks beautiful.</text><text x="20" y="90" font-size="15" font-family="sans-serif" fill="#333">A.Seeing B.Seen C.Having seen</text><text x="20" y="130" font-size="12" font-family="sans-serif" fill="#888">我的答案: A</text><text x="20" y="155" font-size="12" font-family="sans-serif" fill="#888">正确答案: B</text></svg>')},
    {img:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200"><rect width="300" height="200" fill="#f8f9fa"/><text x="20" y="40" font-size="15" font-family="sans-serif" fill="#333">质量2kg物体，F=10N水平</text><text x="20" y="65" font-size="15" font-family="sans-serif" fill="#333">拉力，μ=0.3，求加速度</text><text x="20" y="130" font-size="12" font-family="sans-serif" fill="#888">我的答案: a=2m/s²</text></svg>')},
  ];
  uploadedImage = demos[index].img;
  const preview = document.getElementById('previewImg');
  document.getElementById('uploadZone').style.display = 'none';
  preview.src = uploadedImage;
  preview.style.display = 'block';
  startAnalysis();
}

function startAnalysis() {
  const analyzingBox = document.getElementById('analyzingBox');
  const resultPanel = document.getElementById('resultPanel');
  if(!analyzingBox) return;
  analyzingBox.style.display = 'block';
  if(resultPanel) resultPanel.style.display = 'none';

  const steps = ['🔍 正在OCR识别题目文字...','🧠 AI正在分析错误类型...','📚 正在拆解知识点标签...','✅ 分析完成，生成错题卡片'];
  let step = 0;
  const stepEl = document.getElementById('analyzeStep');
  if(analysisInterval) clearInterval(analysisInterval);
  analysisInterval = setInterval(() => {
    if(step < steps.length) {
      if(stepEl) stepEl.textContent = steps[step];
      step++;
    } else {
      clearInterval(analysisInterval);
      analyzingBox.style.display = 'none';
      showAnalysisResult();
    }
  }, 800);
}

function showAnalysisResult() {
  const titles = ['二次函数最值问题','非谓语动词作状语','牛顿第二定律受力分析'];
  const types = ['计算错误','语法概念混淆','过程正确但书写不规范'];
  const points = ['二次函数区间最值','非谓语动词逻辑主语','牛顿第二定律F=ma'];
  const subjects = ['数学','英语','物理'];
  const idx = Math.floor(Math.random() * 3);
  analyzedData = {title:titles[idx],type:types[idx],point:points[idx],subject:subjects[idx]};

  const panel = document.getElementById('resultPanel');
  if(!panel) return;
  panel.style.display = 'block';
  panel.innerHTML = `
    <h3 style="font-size:17px;font-weight:700;margin-bottom:20px;">🤖 AI识别结果</h3>
    <div class="result-section">
      <div class="result-label">📝 识别题目</div>
      <div class="result-val">${analyzedData.title}</div>
    </div>
    <div class="result-section">
      <div class="result-label">📂 学科分类</div>
      <div class="result-val">${analyzedData.subject}</div>
    </div>
    <div class="result-section">
      <div class="result-label">🏷️ 标签</div>
      <div class="result-tags">
        <span class="result-tag error-type">${analyzedData.type}</span>
        <span class="result-tag knowledge">${analyzedData.point}</span>
      </div>
    </div>
    <div class="result-actions">
      <button class="btn btn-outline" onclick="cancelUpload()">重新上传</button>
      <button class="btn btn-primary" onclick="saveAnalysis()">确认存入错题本</button>
    </div>
  `;
}

function cancelUpload() {
  uploadedImage = null;
  analyzedData = null;
  if(analysisInterval) clearInterval(analysisInterval);
  const preview = document.getElementById('previewImg');
  const uploadZone = document.getElementById('uploadZone');
  const analyzingBox = document.getElementById('analyzingBox');
  const resultPanel = document.getElementById('resultPanel');
  if(preview) preview.style.display = 'none';
  if(uploadZone) uploadZone.style.display = 'block';
  if(analyzingBox) analyzingBox.style.display = 'none';
  if(resultPanel) resultPanel.style.display = 'none';
  const fi = document.getElementById('fileInput');
  if(fi) fi.value = '';
}

function saveAnalysis() {
  if(!analyzedData) return;
  const newId = Math.max(...errorBook.map(e=>e.id)) + 1;
  const subTag = analyzedData.subject === '数学' ? 'math' : analyzedData.subject === '英语' ? 'eng' : 'phys';
  const icons = {'数学':'📐','英语':'📝','物理':'🔬'};
  errorBook.unshift({
    id:newId, subject:analyzedData.subject, subTag, title:analyzedData.title,
    原题:'(AI自动识别录入)',你的答案:'—',正确答案:'—',
    错误类型:analyzedData.type,知识点:analyzedData.point,
    分析:'AI自动分析中，请在错题本中查看详情。',
    status:'new', date:new Date().toISOString().slice(0,10), icon:icons[analyzedData.subject]||'📄'
  });
  cancelUpload();
  showToast('✅ 错题已存入错题本！');
  setTimeout(()=>switchTab('book'),800);
}

// ========== BOOK ==========
function renderBook() {
  const filters = [
    {id:'all',label:'全部'},{id:'math',label:'📐 数学'},{id:'eng',label:'📝 英语'},
    {id:'phys',label:'🔬 物理'},{id:'new',label:'🔴 待复习'},{id:'reviewed',label:'🟢 已掌握'},
  ];
  let filtered = errorBook;
  if(currentFilter==='math') filtered=errorBook.filter(e=>e.subTag==='math');
  else if(currentFilter==='eng') filtered=errorBook.filter(e=>e.subTag==='eng');
  else if(currentFilter==='phys') filtered=errorBook.filter(e=>e.subTag==='phys');
  else if(currentFilter==='new') filtered=errorBook.filter(e=>e.status==='new');
  else if(currentFilter==='reviewed') filtered=errorBook.filter(e=>e.status==='reviewed');

  document.getElementById('mainContent').innerHTML = `
    <div class="page-title">📖 错题本</div>
    <div class="book-count">共 ${filtered.length} 道错题</div>
    <div class="filter-bar">
      ${filters.map(f=>`<button class="filter-btn ${currentFilter===f.id?'active':''}" onclick="setFilter('${f.id}')">${f.label}</button>`).join('')}
    </div>
    ${filtered.length===0?`
      <div class="empty-panel">
        <div class="empty-content">
          <div class="empty-icon">📭</div>
          <div class="empty-text">暂无错题记录，去录入第一道错题吧！</div>
        </div>
      </div>
    `:`
      <div class="book-grid">
        ${filtered.map(e=>`
          <div class="book-item" onclick="showErrorDetail(${e.id})">
            <div class="book-num ${e.subTag}-bg">${e.icon}</div>
            <div class="book-content">
              <div class="book-title">${e.subject} · ${e.title}</div>
              <div class="book-detail">错误类型：${e.错误类型}<br>知识点：${e.知识点}</div>
            </div>
            <span class="book-badge ${e.status==='new'?'new':'mastered'}">${e.status==='new'?'待复习':'已掌握'}</span>
          </div>
        `).join('')}
      </div>
    `}
  `;
}

function setFilter(f) { currentFilter = f; renderBook(); }

// ========== REVIEW ==========
function renderReview() {
  document.getElementById('mainContent').innerHTML = `
    <div class="page-title">🔄 智能复盘计划</div>
    <div class="page-subtitle">AI根据遗忘曲线为你定制复习节奏，精准攻克薄弱点</div>

    <div class="review-grid">
      ${reviewPlan.map(rp=>`
        <div class="review-card">
          <div class="review-header">
            <span class="review-date">📅 ${rp.day} · ${rp.date}</span>
            <span class="review-count">${rp.count}道待复习</span>
          </div>
          <div class="review-subjects">
            ${rp.subjects.map(s=>{
              const cls = s==='数学'?'math-tag':s==='英语'?'eng-tag':'phys-tag';

            }).join('')}
          </div>
          <div class="review-bar">
            <div class="review-bar-fill" style="width:${rp.progress}%"></div>
          </div>
          <span class="review-action" onclick="startReview()">${rp.progress>0?'继续复习 →':'开始复习 →'}</span>
        </div>
      `).join('')}
    </div>

    <button class="btn-large" onclick="startReview()">🚀 开始今日复盘</button>

    <div class="tip-box">

        · 先独立思考再查看解析<br>
        · 重点标记反复出错的题型<br>
        · 每次复盘后写一句总结<br>
        · 连续3次答对可标记"已掌握"

function startReview() {
  const newItems = errorBook.filter(e=>e.status==='new');
  if(newItems.length===0){showToast('🎉 所有错题已复习完毕！');return;}
  showErrorDetail(newItems[Math.floor(Math.random()*newItems.length)].id);
}

// ========== MODAL ==========
function showErrorDetail(id) {
  const e = errorBook.find(x=>x.id===id);
  if(!e) return;
  document.getElementById('modalTitle').textContent=`${e.subject} · ${e.title}`;
  document.getElementById('modalBody').innerHTML=`
    <div class="modal-section">
      <div class="modal-label">📋 原题</div>
      <div class="modal-val">${e.原题}</div>
    </div>
    <div class="modal-section">
      <div class="modal-label">❌ 你的答案</div>
      <div class="modal-val modal-answer-wrong">${e.你的答案}</div>
    </div>
    <div class="modal-section">
      <div class="modal-label">✅ 正确答案</div>
      <div class="modal-val modal-answer-right">${e.正确答案}</div>
    </div>
    <div class="modal-section">
      <div class="modal-label">🏷️ 错误类型 & 知识点</div>
      <div class="modal-val">${e.错误类型} · ${e.知识点}</div>
    </div>
    <div class="modal-section">
      <div class="modal-label">🤖 AI分析</div>
      <div class="modal-ai-box">${e.分析}</div>
    </div>
  `;
  document.getElementById('modalActions').innerHTML=`
    <button class="btn btn-outline" onclick="closeModal()">关闭</button>
    <button class="btn btn-primary" onclick="markReviewed(${id})">
      ${e.status==='new'?'✅ 标记为已掌握':'🔄 重新加入复习'}
    </button>
  `;
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal(e) {
  if(e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('show');
}

function markReviewed(id) {
  const e = errorBook.find(x=>x.id===id);
  if(!e) return;
  e.status = e.status==='new'?'reviewed':'new';
  closeModal();
  showToast(e.status==='reviewed'?'✅ 已标记为已掌握！':'🔄 已重新加入复习列表');
  render();
}

// ========== UTILS ==========
function switchTab(tab) {
  currentTab = tab;
  uploadedImage = null;
  analyzedData = null;
  if(analysisInterval) clearInterval(analysisInterval);
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'),1800);
}

// ========== INIT ==========
render();
</script>
