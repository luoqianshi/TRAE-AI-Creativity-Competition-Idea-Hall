<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>题目解析AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            --accent-gradient: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            --bg-gradient-start: #e0f2fe;
            --bg-gradient-mid: #f3e8ff;
            --bg-gradient-end: #fce7f3;
            --card-bg: rgba(255, 255, 255, 0.92);
            --card-border: rgba(255, 255, 255, 0.6);
            --card-shadow: 0 20px 40px rgba(102, 126, 234, 0.15);
            --input-bg: rgba(255, 255, 255, 0.6);
            --input-focus-border: #818cf8;
            --input-focus-glow: rgba(129, 140, 248, 0.3);
            --btn-primary: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            --btn-secondary: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            --btn-blue: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            --btn-hover-lift: translateY(-3px);
            --btn-hover-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
            --border-radius-sm: 12px;
            --border-radius-md: 16px;
            --border-radius-lg: 24px;
            --border-radius-xl: 32px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(3deg); }
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.15); }
        }
        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.3); }
        }
        @keyframes float-up {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
        @keyframes wave {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(30px); }
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        @keyframes input-focus {
            0% { box-shadow: 0 0 0 0 rgba(129, 140, 248, 0); }
            50% { box-shadow: 0 0 0 8px rgba(129, 140, 248, 0.1); }
            100% { box-shadow: 0 0 0 0 rgba(129, 140, 248, 0); }
        }

        .spinner {
            animation: spin 1s linear infinite;
        }
        .glass-effect {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow);
        }
        .glass-card {
            background: var(--input-bg);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:focus-within {
            background: rgba(255, 255, 255, 0.85);
            border-color: var(--input-focus-border);
            box-shadow: 0 0 0 3px var(--input-focus-glow);
        }
        .float-animation {
            animation: float 8s ease-in-out infinite;
        }
        .pulse-animation {
            animation: pulse-glow 5s ease-in-out infinite;
        }
        .gradient-shift {
            animation: gradient-shift 25s ease infinite;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.45;
            pointer-events: none;
        }
        .paper-plane {
            position: absolute;
            opacity: 0.12;
            animation: float-up 15s linear infinite;
        }
        .floating-icon {
            position: absolute;
            animation: breathe 4s ease-in-out infinite;
        }
        .grid-pattern {
            background-image: 
                linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        
        .btn-primary {
            background: var(--btn-primary);
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }
        .btn-primary:hover::before {
            left: 100%;
        }
        .btn-primary:hover {
            transform: var(--btn-hover-lift);
            box-shadow: var(--btn-hover-shadow);
        }
        
        .btn-secondary {
            background: var(--btn-secondary);
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-secondary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }
        .btn-secondary:hover::before {
            left: 100%;
        }
        .btn-secondary:hover {
            transform: var(--btn-hover-lift);
            box-shadow: 0 15px 35px rgba(17, 153, 142, 0.3);
        }
        
        .btn-blue {
            background: var(--btn-blue);
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-blue::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }
        .btn-blue:hover::before {
            left: 100%;
        }
        .btn-blue:hover {
            transform: var(--btn-hover-lift);
            box-shadow: 0 15px 35px rgba(59, 130, 246, 0.3);
        }
        
        .select-wrapper {
            position: relative;
        }
        .select-wrapper::after {
            content: '▼';
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            font-size: 10px;
            color: #9ca3af;
            pointer-events: none;
        }
        
        .textarea-focus {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .textarea-focus:focus {
            border-color: var(--input-focus-border);
            box-shadow: 0 0 0 4px var(--input-focus-glow);
        }
        
        .header-glow {
            position: relative;
        }
        .header-glow::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--primary-gradient);
            border-radius: 0 0 20px 20px;
        }
    </style>
</head>
<body class="relative min-h-screen p-4 md:p-8 overflow-y-auto">
    <div class="absolute inset-0 bg-gradient-to-br from-blue-50 via-purple-50 to-pink-50 gradient-shift bg-[length:200%_200%]"></div>
    <div class="absolute inset-0 bg-gradient-to-br from-sky-100/50 via-white/80 to-rose-100/50"></div>
    <div class="absolute inset-0 grid-pattern opacity-20"></div>
    
    <div class="bg-blob w-[900px] h-[900px] bg-gradient-to-br from-blue-300/25 to-indigo-300/25 -top-64 -left-64 float-animation"></div>
    <div class="bg-blob w-[700px] h-[700px] bg-gradient-to-br from-purple-300/25 to-pink-300/25 top-1/2 -right-80 pulse-animation" style="animation-delay: 1.5s;"></div>
    <div class="bg-blob w-[550px] h-[550px] bg-gradient-to-br from-rose-200/25 to-orange-200/25 -bottom-48 left-1/4 float-animation" style="animation-delay: 2.5s;"></div>
    <div class="bg-blob w-[450px] h-[450px] bg-gradient-to-br from-teal-200/25 to-green-200/25 top-32 right-1/4 pulse-animation" style="animation-delay: 0.8s;"></div>
    <div class="bg-blob w-[350px] h-[350px] bg-gradient-to-br from-yellow-200/25 to-amber-200/25 bottom-48 right-16 float-animation" style="animation-delay: 3s;"></div>
    
    <div id="stars-container" class="absolute inset-0 overflow-hidden pointer-events-none"></div>
    <div id="paper-planes-container" class="absolute inset-0 overflow-hidden pointer-events-none"></div>
    <div id="geometric-shapes-container" class="absolute inset-0 overflow-hidden pointer-events-none"></div>
    
    <div class="absolute bottom-0 left-0 right-0 h-48 bg-gradient-to-t from-white/80 via-white/30 to-transparent"></div>
    
    <div class="floating-icon top-[12%] left-[6%] text-7xl opacity-10" style="animation-delay: 0.3s;">📚</div>
    <div class="floating-icon top-[22%] right-[8%] text-6xl opacity-10" style="animation-delay: 1.2s;">💡</div>
    <div class="floating-icon bottom-[18%] left-[10%] text-5xl opacity-10" style="animation-delay: 0.8s;">✏️</div>
    <div class="floating-icon bottom-[22%] right-[12%] text-6xl opacity-10" style="animation-delay: 2s;">🎒</div>
    <div class="floating-icon top-[38%] left-[4%] text-4xl opacity-08" style="animation-delay: 1.5s;">🧮</div>
    <div class="floating-icon top-[52%] right-[6%] text-4xl opacity-08" style="animation-delay: 0.6s;">🔬</div>
    <div class="floating-icon top-[68%] left-[15%] text-5xl opacity-10" style="animation-delay: 2.5s;">📐</div>
    <div class="floating-icon top-[8%] right-[18%] text-4xl opacity-08" style="animation-delay: 1.8s;">🌱</div>
    
    <div class="relative max-w-4xl mx-auto z-10">
        <div class="glass-effect rounded-[var(--border-radius-xl)] shadow-[var(--card-shadow)] overflow-hidden">
            <div class="bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white p-6 md:p-8 relative overflow-hidden header-glow">
                <div class="absolute inset-0 bg-gradient-to-r from-white/10 via-transparent to-white/10"></div>
                <div class="absolute top-0 left-0 w-32 h-32 bg-white/10 rounded-full blur-2xl -translate-x-1/2 -translate-y-1/2"></div>
                <div class="absolute bottom-0 right-0 w-40 h-40 bg-white/10 rounded-full blur-2xl translate-x-1/2 translate-y-1/2"></div>
                <div class="relative flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div class="w-14 h-14 md:w-16 md:h-16 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center float-animation" style="animation-delay: 0.5s;">
                            <span class="text-3xl md:text-4xl">🧠</span>
                        </div>
                        <div>
                            <h1 class="text-2xl md:text-4xl font-bold tracking-tight">题目解析AI</h1>

                        </div>
                    </div>
                    <button 
                        id="settings-btn"
                        class="bg-white/15 hover:bg-white/25 backdrop-blur-md border border-white/20 px-5 py-2.5 rounded-xl transition-all hover:scale-105 hover:shadow-lg hover:shadow-white/20"
                    >
                        ⚙️ 设置
                    </button>
                </div>
            </div>

            <div class="p-6 md:p-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div class="select-wrapper">
                        <label class="block text-gray-700 font-semibold mb-2">学科</label>
                        <select id="subject-select" class="w-full p-3.5 glass-card rounded-[var(--border-radius-md)] focus:border-indigo-400 focus:ring-2 focus:ring-indigo-300/50 transition-all appearance-none bg-white/50 cursor-pointer hover:bg-white/70">
                            <option value="auto">自动识别</option>
                            <option value="math">🧮 数学</option>
                            <option value="chinese">📖 语文</option>
                            <option value="english">🔤 英语</option>
                            <option value="physics">⚛️ 物理</option>
                            <option value="chemistry">🧪 化学</option>
                            <option value="biology">🧬 生物</option>
                            <option value="history">📜 历史</option>
                            <option value="geography">🌍 地理</option>
                            <option value="politics">⚖️ 政治</option>
                            <option value="science">🔬 科学</option>
                            <option value="programming">💻 编程</option>
                            <option value="economics">💰 经济</option>
                            <option value="art">🎨 艺术</option>
                            <option value="music">🎵 音乐</option>
                            <option value="sports">⚽ 体育</option>
                        </select>
                    </div>
                    <div class="select-wrapper">
                        <label class="block text-gray-700 font-semibold mb-2">题型</label>
                        <select id="type-select" class="w-full p-3.5 glass-card rounded-[var(--border-radius-md)] focus:border-indigo-400 focus:ring-2 focus:ring-indigo-300/50 transition-all appearance-none bg-white/50 cursor-pointer hover:bg-white/70">
                            <option value="auto">自动识别</option>
                            <option value="choice">📝 选择题</option>
                            <option value="multiple-choice">🔤 多选题</option>
                            <option value="fill-blank">✏️ 填空题</option>
                            <option value="true-false">✅ 判断题</option>
                            <option value="short-answer">📝 简答题</option>
                            <option value="calculation">🔢 计算题</option>
                            <option value="proof">📐 证明题</option>
                            <option value="essay">📄 作文题</option>
                            <option value="reading">📚 阅读理解</option>
                            <option value="translation">🌐 翻译题</option>
                            <option value="listening">👂 听力题</option>
                            <option value="experiment">🔬 实验题</option>
                            <option value="comprehensive">📊 综合题</option>
                            <option value="other">📋 其他</option>
                        </select>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 font-semibold mb-3">题目内容</label>
                    <textarea 
                        id="question-input"
                        class="w-full h-32 md:h-48 p-4 glass-card rounded-[var(--border-radius-md)] resize-none text-gray-700 text-base bg-white/50 textarea-focus"
                        placeholder="在这里输入题目内容，或者点击下方按钮上传图片..."
                    ></textarea>
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 font-semibold mb-3">图片上传（拍照搜题）</label>
                    <div class="flex flex-wrap gap-3">
                        <label class="btn-secondary text-white px-5 py-3 rounded-[var(--border-radius-md)] font-semibold flex items-center gap-2 cursor-pointer">

                            <input type="file" id="upload-input" accept="image/*" class="hidden">

                    </div>
                    <div id="image-preview" class="mt-4 hidden">
                        <img id="preview-img" class="max-h-48 rounded-[var(--border-radius-md)] border-2 border-indigo-200 shadow-lg" />
                        <div class="mt-3 flex gap-3">
                            <button id="ocr-btn" class="btn-primary text-white px-4 py-2 rounded-[var(--border-radius-sm)] font-semibold text-sm flex items-center gap-1.5">
                                <span>🔍</span>
                                <span>识别图片内容</span>
                            </button>
                            <button id="remove-img-btn" class="text-sm text-indigo-500 hover:text-indigo-600 font-medium flex items-center gap-1 transition-colors px-4 py-2 rounded-[var(--border-radius-sm)] hover:bg-indigo-50">
                                <span>🗑️</span>
                                <span>移除图片</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="flex flex-wrap gap-3 mb-6">
                    <button 
                        id="analyze-btn"
                        class="btn-primary text-white px-9 py-3 rounded-[var(--border-radius-md)] font-semibold flex items-center gap-2 text-base"
                    >
                        <span>🚀</span>
                        <span>开始解析</span>
                    </button>
                    <button 
                        id="clear-btn"
                        class="bg-white/70 text-gray-700 px-7 py-3 rounded-[var(--border-radius-md)] font-semibold hover:bg-white/90 hover:shadow-lg hover:shadow-gray-200/50 transition-all border border-white/50"
                    >
                        清空内容
                    </button>
                </div>

                <div id="output-section" class="hidden">
                    <div class="glass-card rounded-[var(--border-radius-lg)] overflow-hidden shadow-xl shadow-purple-500/10">

                                id="copy-btn"

                    </div>
                </div>
            </div>

            <div class="bg-white/40 px-6 py-4 text-center text-gray-600 text-sm border-t border-white/30">
                <p>题目解析AI · 支持全学科全题型 · 拍照搜题</p>
            </div>
        </div>
    </div>

            </div>
            <div class="flex gap-3">
                <button id="save-settings-btn" class="flex-1 btn-primary text-white py-3 rounded-[var(--border-radius-sm)] font-semibold">

                </button>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_API_KEY = 'sk-d01317a829dd4a9a8b7724a311639910';
        
        const API_CONFIG = {

            function compressImage(imageDataUrl) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        
                        const maxWidth = 1024;
                        const maxHeight = 1024;
                        let width = img.width;
                        let height = img.height;
                        
                        if (width > maxWidth) {
                            height = (height * maxWidth) / width;
                            width = maxWidth;
                        }
                        if (height > maxHeight) {
                            width = (width * maxHeight) / height;
                            height = maxHeight;
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        const compressed = canvas.toDataURL('image/jpeg', 0.7);
                        resolve(compressed);
                    };
                    img.onerror = () => reject(new Error('图片加载失败'));
                    img.src = imageDataUrl;
                });
            }

            function preprocessImage(imageDataUrl) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);
                        
                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const data = imageData.data;
                        
                        for (let i = 0; i < data.length; i += 4) {
                            const r = data[i];
                            const g = data[i + 1];
                            const b = data[i + 2];
                            
                            const gray = 0.299 * r + 0.587 * g + 0.114 * b;
                            
                            let threshold = 180;
                            
                            if (gray > threshold) {
                                data[i] = 255;
                                data[i + 1] = 255;
                                data[i + 2] = 255;
                            } else {
                                data[i] = 0;
                                data[i + 1] = 0;
                                data[i + 2] = 0;
                            }
                        }
                        
                        ctx.putImageData(imageData, 0, 0);
                        resolve(canvas.toDataURL('image/png'));
                    };
                    img.onerror = () => reject(new Error('图片加载失败'));
                    img.src = imageDataUrl;
                });
            }

            function handleImageUpload(e) {
                const file = e.target.files[0];
                if (file) {

                    reader.onload = function(event) {

                        previewImg.src = currentImageBase64;
                        imagePreview.classList.remove('hidden');

                    reader.readAsDataURL(file);
                }

            analyzeBtn.addEventListener('click', async () => {
                const question = questionInput.value.trim();
                
                if (!question && !currentImageBase64) {
                    alert('请输入题目内容或上传图片');
                    return;
                }

                const apiKey = localStorage.getItem('ai_analyzer_api_key') || DEFAULT_API_KEY;

                analyzeBtn.disabled = true;
                analyzeBtn.innerHTML = '<span>⏳</span><span>解析中...</span>';
                
                outputSection.classList.remove('hidden');
                outputContent.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-12 text-gray-500">
                        <div class="w-12 h-12 border-4 border-gray-200 border-t-indigo-500 rounded-full spinner mb-4"></div>
                        <p>AI正在分析中，请稍候...</p>
                    </div>
                `;

                try {
                    const subject = subjectSelect.value;
                    const questionType = typeSelect.value;
                    const prompt = generatePrompt(question, subject, questionType);

                    const messages = [{ role: 'user', content: prompt }];
                    
                    if (currentImageBase64) {
                        messages[0].content = [
                            { type: 'text', text: prompt },
                            { type: 'image_url', image_url: { url: currentImageBase64 } }
                        ];
                    }

                    const provider = localStorage.getItem('ai_analyzer_api_provider') || 'deepseek';
                    const config = API_CONFIG[provider] || API_CONFIG.deepseek;
                    const apiUrl = provider === 'custom' 
                        ? localStorage.getItem('ai_analyzer_api_url') || config.baseUrl
                        : config.baseUrl;
                    const model = currentImageBase64 && config.supportsImage ? config.visionModel : config.model;

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: model,
                            messages: messages,
                            temperature: 0.7,
                            max_tokens: 3000,
                            stream: true
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error?.message || `HTTP错误: ${response.status}`);
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    outputContent.innerHTML = '<div class="analysis-content"></div>';
                    const analysisDiv = outputContent.querySelector('.analysis-content');
                    let fullText = '';
                    
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        
                        const chunk = decoder.decode(value);
                        const lines = chunk.split('\n').filter(line => line.trim());
                        
                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                const data = line.slice(6);
                                if (data === '[DONE]') continue;
                                
                                try {
                                    const parsed = JSON.parse(data);
                                    const text = parsed.choices[0]?.delta?.content || '';
                                    fullText += text;
                                    analysisDiv.innerHTML = marked.parse(fullText);
                                    renderMathInElement(analysisDiv, {
                                        delimiters: [
                                            {left: '$$', right: '$$', display: true},
                                            {left: '$', right: '$', display: false},
                                            {left: '\\(', right: '\\)', display: false},
                                            {left: '\\[', right: '\\]', display: true}
                                        ],
                                        throwOnError: false
                                    });
                                    analysisDiv.scrollTop = analysisDiv.scrollHeight;
                                } catch (e) {
                                    console.error('解析流式数据失败:', e);
                                }
                            }
                        }
                    }
                } catch (error) {
                    console.error('请求失败:', error);
                    outputContent.innerHTML = `<p class="text-red-500">解析失败：${error.message}</p>`;
                } finally {
                    analyzeBtn.disabled = false;
                    analyzeBtn.innerHTML = '<span>🚀</span><span>开始解析</span>';
                }
            });

            clearBtn.addEventListener('click', () => {
                questionInput.value = '';
                currentImageBase64 = null;
                imagePreview.classList.add('hidden');
                cameraInput.value = '';
                uploadInput.value = '';
                outputSection.classList.add('hidden');
                questionInput.focus();
            });

            copyBtn.addEventListener('click', async () => {
                const text = outputContent.innerText;
                
                try {
                    await navigator.clipboard.writeText(text);
                    const originalText = copyBtn.innerHTML;
                    copyBtn.innerHTML = '<span>✅</span><span>已复制</span>';
                    
                    setTimeout(() => {
                        copyBtn.innerHTML = originalText;
                    }, 2000);
                } catch (error) {
                    console.error('复制失败:', error);
                    alert('复制失败，请手动复制');
                }
            });

            function generatePrompt(question, subject, questionType) {
                let subjectInfo = '';
                let typeInfo = '';
                
                if (subject !== 'auto' && SUBJECT_CONFIG[subject]) {
                    subjectInfo = `学科：${SUBJECT_CONFIG[subject].name}，${SUBJECT_CONFIG[subject].tips}`;
                }
                
                if (questionType !== 'auto' && TYPE_CONFIG[questionType]) {
                    typeInfo = `题型：${TYPE_CONFIG[questionType].name}，${TYPE_CONFIG[questionType].tips}`;
                }

                return `请帮我详细解析这道题目：

${question || '[图片中的题目]'}

${subjectInfo ? `\n${subjectInfo}` : ''}
${typeInfo ? `\n${typeInfo}` : ''}

请按照以下结构进行解析：
1. **题目类型**：判断这是选择题、填空题、简答题、计算题还是其他类型
2. **核心考点**：分析题目考察的知识点
3. **解题思路**：给出解决这道题目的步骤和方法
4. **答案解析**：如果题目有答案，请给出详细解析
5. **易错点提醒**：指出解题过程中容易出错的地方
6. **举一反三**：提供类似的题目或拓展思路

请用中文详细回答，确保逻辑清晰、易于理解，使用Markdown格式输出。`;
            }
        });
