<style>
:root { --bg-primary:#0f1117; --bg-secondary:#1a1d28; --bg-card:#21242f; --bg-card-hover:#282c3a; --border:#2e3348; --border-light:#3a3f58; --text-primary:#e8eaf0; --text-secondary:#9a9eb8; --text-muted:#6b6f88; --accent:#f59e0b; --accent-glow:rgba(245,158,11,0.3); --accent-secondary:#10b981; --accent-tertiary:#6366f1; --danger:#ef4444; --success:#22c55e; --radius:12px; --radius-sm:8px; --radius-lg:16px; --shadow:0 4px 24px rgba(0,0,0,0.3); --shadow-lg:0 8px 40px rgba(0,0,0,0.4); --font-display:'ZCOOL QingKe HuangYou',sans-serif; --font-body:'Noto Sans SC',sans-serif; --transition:all 0.3s cubic-bezier(0.4,0,0.2,1); }
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
html { font-size:16px; }
body { font-family:var(--font-body); background:var(--bg-primary); color:var(--text-primary); min-height:100vh; overflow-x:hidden; }
::-webkit-scrollbar { width:6px; } ::-webkit-scrollbar-track { background:transparent; } ::-webkit-scrollbar-thumb { background:var(--border-light); border-radius:3px; }

.bg-atmosphere { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.bg-atmosphere::before { content:''; position:absolute; width:600px; height:600px; background:radial-gradient(circle, rgba(245,158,11,0.06) 0%, transparent 70%); top:-200px; right:-200px; animation:floatBlob 20s ease-in-out infinite; }
.bg-atmosphere::after { content:''; position:absolute; width:500px; height:500px; background:radial-gradient(circle, rgba(236,72,153,0.04) 0%, transparent 70%); bottom:-150px; left:-150px; animation:floatBlob 25s ease-in-out infinite reverse; }
@keyframes floatBlob { 0%,100% { transform:translate(0,0) scale(1); } 33% { transform:translate(30px,-20px) scale(1.05); } 66% { transform:translate(-20px,15px) scale(0.95); } }
.noise-overlay { position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.03; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E"); }

.navbar { position:fixed; top:0; left:0; right:0; z-index:100; background:rgba(15,17,23,0.85); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); padding:0 20px; height:60px; display:flex; align-items:center; justify-content:space-between; }
.navbar-brand { display:flex; align-items:center; gap:10px; }
.navbar-brand .logo { width:36px; height:36px; background:linear-gradient(135deg, var(--accent), #f97316); border-radius:10px; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:18px; color:#fff; font-weight:700; box-shadow:0 2px 12px var(--accent-glow); }
.navbar-brand .brand-text { font-family:var(--font-display); font-size:20px; color:var(--text-primary); letter-spacing:2px; }
.navbar-brand .brand-sub { font-size:11px; color:var(--text-muted); font-weight:300; letter-spacing:1px; }
.navbar-tools { display:flex; align-items:center; gap:6px; }
.nav-btn { background:var(--bg-card); border:1px solid var(--border); color:var(--text-secondary); padding:7px 12px; border-radius:var(--radius-sm); cursor:pointer; font-size:12px; font-family:var(--font-body); display:flex; align-items:center; gap:5px; transition:var(--transition); }
.nav-btn:hover { background:var(--bg-card-hover); color:var(--text-primary); border-color:var(--border-light); }
.nav-btn i { font-size:13px; }
.nav-btn.accent { background:rgba(245,158,11,0.12); border-color:rgba(245,158,11,0.3); color:var(--accent); }
.nav-btn.accent:hover { background:rgba(245,158,11,0.2); }
.user-info { display:flex; align-items:center; gap:8px; padding-left:10px; border-left:1px solid var(--border); margin-left:6px; }
.user-avatar { width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg, var(--accent-secondary), var(--accent-tertiary)); display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; font-weight:700; }
.user-coins { display:flex; align-items:center; gap:4px; font-size:12px; color:var(--accent); font-weight:500; }

.app-container { position:relative; z-index:1; padding-top:60px; min-height:100vh; }

.scene-selector { position:fixed; inset:0; z-index:200; background:var(--bg-primary); display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:1; transition:opacity 0.6s ease; }
.scene-selector.hidden { opacity:0; pointer-events:none; }
.scene-selector .welcome-title { font-family:var(--font-display); font-size:48px; color:var(--text-primary); margin-bottom:8px; letter-spacing:4px; animation:fadeUp 0.8s ease; }
.scene-selector .welcome-sub { font-size:14px; color:var(--text-muted); margin-bottom:40px; animation:fadeUp 0.8s ease 0.1s both; }
@keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
.theme-tabs { display:flex; gap:8px; margin-bottom:28px; animation:fadeUp 0.8s ease 0.2s both; }
.theme-tab { padding:10px 24px; border-radius:100px; border:1px solid var(--border); background:var(--bg-card); color:var(--text-secondary); cursor:pointer; font-family:var(--font-body); font-size:14px; transition:var(--transition); }
.theme-tab.active { background:linear-gradient(135deg, var(--accent), #f97316); border-color:transparent; color:#fff; box-shadow:0 4px 20px var(--accent-glow); }
.theme-tab:hover:not(.active) { background:var(--bg-card-hover); border-color:var(--border-light); }
.scene-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; max-width:840px; padding:0 20px; animation:fadeUp 0.8s ease 0.3s both; }
.scene-card { position:relative; border-radius:var(--radius-lg); overflow:hidden; cursor:pointer; border:2px solid transparent; transition:var(--transition); aspect-ratio:4/3; }
.scene-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-lg); border-color:var(--accent); }
.scene-card.selected { border-color:var(--accent); box-shadow:0 0 30px var(--accent-glow); }
.scene-card .scene-overlay { position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 60%); display:flex; flex-direction:column; justify-content:flex-end; padding:14px; }
.scene-card .scene-name { font-size:14px; font-weight:600; color:#fff; margin-bottom:3px; }
.scene-card .scene-desc { font-size:11px; color:rgba(255,255,255,0.65); }
.scene-card .scene-price { position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.55); backdrop-filter:blur(8px); padding:3px 8px; border-radius:100px; font-size:11px; color:var(--accent); display:flex; align-items:center; gap:3px; }
.scene-card .scene-price.locked { color:var(--text-muted); }
.enter-btn { margin-top:28px; padding:12px 40px; background:linear-gradient(135deg, var(--accent), #f97316); border:none; border-radius:100px; color:#fff; font-size:15px; font-weight:600; font-family:var(--font-body); cursor:pointer; box-shadow:0 4px 24px var(--accent-glow); animation:fadeUp 0.8s ease 0.4s both; }
.enter-btn:hover { transform:translateY(-2px); box-shadow:0 8px 32px rgba(245,158,11,0.4); }
.enter-btn:disabled { opacity:0.4; cursor:not-allowed; transform:none; box-shadow:none; }

.work-area { display:flex; height:calc(100vh - 60px); }
.left-panel { flex:1; display:flex; flex-direction:column; min-width:0; position:relative; }
.left-panel.collapsed { flex:0 0 52px; }

.office-viewport { flex:1; position:relative; overflow:hidden; background:var(--bg-secondary); min-height:300px; }
.office-viewport canvas { display:block; width:100% !important; height:100% !important; }
.office-viewport .desk-overlay { position:absolute; bottom:0; left:0; right:0; height:35%; background:linear-gradient(to top, rgba(15,17,23,0.9), transparent); display:flex; align-items:flex-end; justify-content:center; padding-bottom:20px; pointer-events:none; }
.desk-status { text-align:center; }
.desk-status .desk-label { font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:2px; margin-bottom:3px; }
.desk-status .desk-name { font-family:var(--font-display); font-size:18px; color:var(--text-primary); }
.scene-hint { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); font-size:11px; color:var(--text-muted); background:rgba(0,0,0,0.45); padding:5px 12px; border-radius:100px; pointer-events:none; backdrop-filter:blur(8px); z-index:10; }

.online-users { position:absolute; top:12px; right:12px; display:flex; align-items:center; z-index:10; }
.online-avatar { width:28px; height:28px; border-radius:50%; border:2px solid var(--bg-primary); margin-left:-7px; display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff; font-weight:600; position:relative; cursor:pointer; transition:var(--transition); }
.online-avatar:hover { transform:scale(1.15); z-index:2; }
.online-avatar .status-dot { position:absolute; bottom:-1px; right:-1px; width:8px; height:8px; background:var(--success); border:2px solid var(--bg-primary); border-radius:50%; }
.online-avatar .status-dot.away { background:var(--accent); }
.online-count { margin-left:5px; font-size:11px; color:var(--text-muted); }

.bubble-area { position:absolute; top:50px; left:12px; right:12px; display:flex; flex-direction:column; gap:6px; pointer-events:none; z-index:10; }
.bubble { display:inline-flex; align-items:center; gap:6px; background:rgba(0,0,0,0.45); backdrop-filter:blur(12px); padding:6px 12px; border-radius:14px; border-top-left-radius:3px; max-width:240px; animation:bubbleIn 0.4s ease; pointer-events:auto; }
@keyframes bubbleIn { from { opacity:0; transform:translateY(10px) scale(0.95); } to { opacity:1; transform:translateY(0) scale(1); } }
.bubble .bubble-avatar { width:22px; height:22px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:9px; color:#fff; font-weight:700; }
.bubble .bubble-text { font-size:12px; color:rgba(255,255,255,0.85); line-height:1.4; }
.bubble .bubble-name { font-size:10px; color:var(--accent); font-weight:500; margin-bottom:1px; }
.bubble .bubble-fade { animation:bubbleFade 8s ease forwards; }
@keyframes bubbleFade { 0%,70% { opacity:1; } 100% { opacity:0; transform:translateY(-8px); } }

.timer-section { background:var(--bg-card); border-top:1px solid var(--border); padding:20px 24px; display:flex; flex-direction:column; align-items:center; gap:12px; }
.work-status-indicator { display:flex; align-items:center; gap:6px; }
.status-dot { width:8px; height:8px; border-radius:50%; background:var(--text-muted); transition:var(--transition); }
.status-dot.active { background:var(--success); box-shadow:0 0 8px rgba(34,197,94,0.5); animation:pulse 2s ease infinite; }
@keyframes pulse { 0%,100% { box-shadow:0 0 8px rgba(34,197,94,0.5); } 50% { box-shadow:0 0 16px rgba(34,197,94,0.8); } }
.status-text { font-size:12px; color:var(--text-muted); letter-spacing:1px; }
.status-text.active { color:var(--success); }
.timer-display { font-size:52px; font-weight:900; color:var(--text-primary); font-variant-numeric:tabular-nums; letter-spacing:3px; line-height:1; }
.timer-display .timer-seconds { font-size:28px; color:var(--text-muted); font-weight:400; }
.work-schedule { display:flex; gap:24px; align-items:center; }
.schedule-item { text-align:center; }
.schedule-label { font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:3px; }
.schedule-time { font-size:14px; font-weight:600; color:var(--text-secondary); }
.schedule-divider { color:var(--border-light); font-size:16px; }
.timer-controls { display:flex; gap:10px; }
.timer-btn { padding:9px 24px; border-radius:100px; border:1px solid var(--border); background:var(--bg-card-hover); color:var(--text-secondary); font-size:13px; font-family:var(--font-body); cursor:pointer; transition:var(--transition); display:flex; align-items:center; gap:5px; }
.timer-btn:hover { border-color:var(--border-light); color:var(--text-primary); }
.timer-btn.primary { background:linear-gradient(135deg, var(--accent), #f97316); border:none; color:#fff; font-weight:600; box-shadow:0 4px 16px var(--accent-glow); }
.timer-btn.primary:hover { box-shadow:0 6px 24px rgba(245,158,11,0.4); transform:translateY(-1px); }
.timer-btn.danger { background:rgba(239,68,68,0.15); border-color:var(--danger); color:var(--danger); }
.earned-coins { font-size:11px; color:var(--text-muted); display:flex; align-items:center; gap:4px; }
.earned-coins i { color:var(--accent); }

.panel-toggle { position:absolute; top:50%; right:-1px; transform:translateY(-50%); width:18px; height:44px; background:var(--bg-card); border:1px solid var(--border); border-left:none; border-radius:0 var(--radius-sm) var(--radius-sm) 0; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:9px; z-index:5; }
.panel-toggle:hover { background:var(--bg-card-hover); color:var(--text-primary); }

.right-panel { width:360px; background:var(--bg-card); border-left:1px solid var(--border); display:flex; flex-direction:column; position:relative; }
.right-panel.collapsed { width:0; border-left:none; overflow:hidden; }
.right-tabs { display:flex; border-bottom:1px solid var(--border); padding:0 4px; }
.right-tab { flex:1; padding:12px 0; text-align:center; font-size:12px; color:var(--text-muted); cursor:pointer; transition:var(--transition); border-bottom:2px solid transparent; font-weight:500; }
.right-tab:hover { color:var(--text-secondary); }
.right-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.right-tab i { margin-right:5px; }
.tab-content { flex:1; overflow-y:auto; padding:16px; }
.tab-pane { display:none; }
.tab-pane.active { display:block; }

.todo-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.todo-header h3 { font-size:15px; font-weight:600; }
.todo-add-btn { width:28px; height:28px; border-radius:50%; border:1px dashed var(--border-light); background:transparent; color:var(--text-muted); cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; }
.todo-add-btn:hover { border-color:var(--accent); color:var(--accent); background:rgba(245,158,11,0.08); }
.todo-input-area { margin-bottom:14px; display:none; }
.todo-input-area.show { display:block; }
.todo-input { width:100%; padding:9px 12px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg-secondary); color:var(--text-primary); font-size:13px; font-family:var(--font-body); outline:none; }
.todo-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(245,158,11,0.1); }
.todo-priority { display:flex; gap:5px; margin-top:6px; }
.priority-chip { padding:3px 10px; border-radius:100px; font-size:10px; border:1px solid var(--border); background:transparent; color:var(--text-muted); cursor:pointer; font-family:var(--font-body); }
.priority-chip.active-high { background:rgba(239,68,68,0.15); border-color:var(--danger); color:var(--danger); }
.priority-chip.active-mid { background:rgba(245,158,11,0.15); border-color:var(--accent); color:var(--accent); }
.priority-chip.active-low { background:rgba(16,185,129,0.15); border-color:var(--accent-secondary); color:var(--accent-secondary); }
.todo-list { display:flex; flex-direction:column; gap:6px; }
.todo-item { display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:var(--radius-sm); background:var(--bg-secondary); border:1px solid var(--border); cursor:pointer; }
.todo-item:hover { border-color:var(--border-light); background:var(--bg-card-hover); }
.todo-item.completed { opacity:0.5; }
.todo-item.completed .todo-text { text-decoration:line-through; }
.todo-checkbox { width:18px; height:18px; border-radius:50%; border:2px solid var(--border-light); flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer; color:transparent; font-size:9px; }
.todo-checkbox.checked { background:var(--accent-secondary); border-color:var(--accent-secondary); color:#fff; }
.todo-text { flex:1; font-size:13px; line-height:1.4; }
.todo-tag { padding:2px 6px; border-radius:100px; font-size:9px; font-weight:500; }
.tag-high { background:rgba(239,68,68,0.15); color:var(--danger); }
.tag-mid { background:rgba(245,158,11,0.15); color:var(--accent); }
.tag-low { background:rgba(16,185,129,0.15); color:var(--accent-secondary); }
.todo-delete { color:var(--text-muted); cursor:pointer; font-size:11px; opacity:0; padding:3px; }
.todo-item:hover .todo-delete { opacity:1; }

.notes-toolbar { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
.note-tool-btn { padding:5px 10px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg-secondary); color:var(--text-muted); cursor:pointer; font-size:12px; font-family:var(--font-body); }
.note-tool-btn:hover { background:var(--bg-card-hover); color:var(--text-secondary); }
.note-tool-btn.active { background:rgba(99,102,241,0.15); border-color:var(--accent-tertiary); color:var(--accent-tertiary); }
.notes-editor { width:100%; min-height:260px; padding:14px; border-radius:var(--radius); border:1px solid var(--border); background:var(--bg-secondary); color:var(--text-primary); font-size:13px; font-family:var(--font-body); line-height:1.7; outline:none; resize:vertical; }
.notes-editor:focus { border-color:var(--accent-tertiary); box-shadow:0 0 0 3px rgba(99,102,241,0.1); }
.notes-saved-indicator { display:flex; align-items:center; gap:5px; margin-top:6px; font-size:11px; color:var(--text-muted); }

.diary-header { margin-bottom:14px; }
.diary-header h3 { font-size:15px; font-weight:600; margin-bottom:3px; }
.diary-date { font-size:11px; color:var(--text-muted); }
.diary-editor { width:100%; min-height:180px; padding:14px; border-radius:var(--radius); border:1px solid var(--border); background:var(--bg-secondary); color:var(--text-primary); font-size:13px; font-family:var(--font-body); line-height:1.7; outline:none; resize:vertical; }
.diary-editor:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(245,158,11,0.1); }
.diary-stats { display:flex; gap:12px; margin-top:14px; padding:10px; border-radius:var(--radius-sm); background:var(--bg-secondary); border:1px solid var(--border); }
.diary-stat { text-align:center; flex:1; }
.diary-stat-value { font-size:18px; font-weight:700; color:var(--accent); }
.diary-stat-label { font-size:10px; color:var(--text-muted); margin-top:2px; }

.modal-overlay { position:fixed; inset:0; z-index:300; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.3s ease; }
.modal-overlay.show { opacity:1; pointer-events:auto; }
.modal { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:28px; width:440px; max-width:90vw; box-shadow:var(--shadow-lg); transform:translateY(20px); transition:transform 0.3s ease; }
.modal-overlay.show .modal { transform:translateY(0); }
.modal h2 { font-size:17px; font-weight:600; margin-bottom:20px; }
.form-group { margin-bottom:16px; }
.form-label { display:block; font-size:12px; color:var(--text-secondary); margin-bottom:6px; font-weight:500; }
.form-input { width:100%; padding:9px 12px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg-secondary); color:var(--text-primary); font-size:13px; font-family:var(--font-body); outline:none; }
.form-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(245,158,11,0.1); }
.form-row { display:flex; gap:10px; }
.form-row .form-group { flex:1; }
.modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:24px; }
.modal-btn { padding:9px 20px; border-radius:var(--radius-sm); font-size:13px; font-family:var(--font-body); cursor:pointer; border:1px solid var(--border); background:var(--bg-card-hover); color:var(--text-secondary); }
.modal-btn:hover { background:var(--bg-card); color:var(--text-primary); }
.modal-btn.primary { background:linear-gradient(135deg, var(--accent), #f97316); border:none; color:#fff; font-weight:600; }

.shop-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; max-height:360px; overflow-y:auto; }
.shop-item, .decor-item { padding:14px; border-radius:var(--radius); border:1px solid var(--border); background:var(--bg-secondary); text-align:center; cursor:pointer; transition:var(--transition); }
.shop-item:hover, .decor-item:hover { border-color:var(--accent); background:var(--bg-card-hover); }
.shop-item .shop-icon, .decor-item .decor-icon { font-size:28px; margin-bottom:6px; }
.shop-item .shop-name, .decor-item .decor-name { font-size:12px; font-weight:500; margin-bottom:3px; }
.shop-item .shop-price, .decor-item .decor-price { font-size:11px; color:var(--accent); display:flex; align-items:center; justify-content:center; gap:3px; }
.shop-item.owned, .decor-item.owned { opacity:0.5; border-color:var(--accent-secondary); }
.shop-item.owned .shop-price, .decor-item.owned .decor-price { color:var(--accent-secondary); }

<!-- Shop Modal -->
<div class="modal-overlay" id="shopModal">

</div>

<!-- Decorate Modal -->
<div class="modal-overlay" id="decorateModal">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let scene3d, camera3d, renderer3d, controls3d, animId;
let deskGroup, lampLight, particleSystem;
let currentThemeConfig = null;
const decorMeshes = {};

const themeConfigs = {
  office: { bgColor:0x2a2520, deskColor:0x9b7f5e, chairColor:0x6c5043, floorColor:0x24201a, ambientIntensity:0.55, lampColor:0xffcc77, lampIntensity:2.8, monitorColor:0x1a1a2e, wallColor:0x3a3530, accentColor:0x7b6b5f, particleColor:0xffcc88, chairStyle:'modern', rugColor:0x5a4f45 },
  study: { bgColor:0x282218, deskColor:0x7d5c43, chairColor:0x5e4430, floorColor:0x221f18, ambientIntensity:0.5, lampColor:0xffbb66, lampIntensity:3.0, monitorColor:0x1f2937, wallColor:0x433a32, accentColor:0x6d5e4e, particleColor:0x99ddbb, chairStyle:'wooden', rugColor:0x4d4238 },
};

const decorItems = [
  { id:'cozy_lamp', name:'温馨小夜灯', icon:'🌙', price:15, desc:'柔和暖光，守护专注时光', emoji:'🌙' },
  { id:'succulent', name:'多肉盆栽', icon:'🪴', price:10, desc:'桌边一抹绿意，治愈心情', emoji:'🪴' },
  { id:'photo_frame', name:'木质相框', icon:'🖼️', price:20, desc:'记录美好瞬间，温暖陪伴', emoji:'🖼️' },
  { id:'headphone_stand', name:'耳机支架', icon:'🎧', price:15, desc:'整齐收纳，桌面更清爽', emoji:'🎧' },
  { id:'mini_calendar', name:'迷你挂历', icon:'📅', price:8, desc:'标记重要日子，规划每一天', emoji:'📅' },
  { id:'snack_jar', name:'零食罐', icon:'🍪', price:5, desc:'小零食补充能量', emoji:'🍪' },
  { id:'area_rug', name:'暖色地毯', icon:'🧶', price:25, desc:'脚下温暖，专注更安心', emoji:'🧶' },
  { id:'fairy_lights', name:'星星串灯', icon:'✨', price:30, desc:'营造梦幻氛围，温馨加倍', emoji:'✨' },
  { id:'plush_cushion', name:'毛绒靠垫', icon:'🧸', price:20, desc:'柔软支撑，久坐不累', emoji:'🧸' },
  { id:'aroma_candle', name:'香薰蜡烛', icon:'🕯️', price:12, desc:'淡淡香气，放松心情', emoji:'🕯️' },
];

function initThreeJS(container) {
  const w=container.clientWidth, h=container.clientHeight;
  scene3d=new THREE.Scene();
  scene3d.fog=new THREE.FogExp2(0x0f1117,0.015);
  camera3d=new THREE.PerspectiveCamera(42,w/h,0.1,100);
  camera3d.position.set(3.5,3,4.5);
  renderer3d=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer3d.setSize(w,h); renderer3d.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer3d.shadowMap.enabled=true; renderer3d.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer3d.toneMapping=THREE.ACESFilmicToneMapping; renderer3d.toneMappingExposure=1.5;
  container.appendChild(renderer3d.domElement);
  controls3d=new OrbitControls(camera3d,renderer3d.domElement);
  controls3d.enableDamping=true; controls3d.dampingFactor=0.05;
  controls3d.minDistance=2; controls3d.maxDistance=9;
  controls3d.maxPolarAngle=Math.PI/2.05;
  controls3d.target.set(0,0.7,0); controls3d.enablePan=false;
  window.addEventListener('resize',()=>{ if(!renderer3d)return; const cw=container.clientWidth,ch=container.clientHeight; camera3d.aspect=cw/ch; camera3d.updateProjectionMatrix(); renderer3d.setSize(cw,ch); });
}

function buildScene(c) {
  while(scene3d.children.length>0) scene3d.remove(scene3d.children[0]);
  for(const k in decorMeshes) { if(decorMeshes[k]) { scene3d.remove(decorMeshes[k]); decorMeshes[k]=null; } }

  scene3d.add(new THREE.AmbientLight(0xffeedd,c.ambientIntensity));
  // Hemisphere light for natural fill
  scene3d.add(new THREE.HemisphereLight(0xffeedd,0x2a2018,0.45));
  // Main warm directional light
  const envLight=new THREE.DirectionalLight(0xffe8d0,0.6);
  envLight.position.set(-3,6,-3); envLight.castShadow=true;
  envLight.shadow.mapSize.set(1024,1024); envLight.shadow.camera.near=0.5; envLight.shadow.camera.far=20;
  scene3d.add(envLight);
  // Fill light from opposite side
  const fillLight=new THREE.DirectionalLight(0xdde4ff,0.2);
  fillLight.position.set(4,5,4); scene3d.add(fillLight);
  // Global room glow
  const roomGlow=new THREE.PointLight(0xffddaa,0.35,10);
  roomGlow.position.set(0,3.5,0); scene3d.add(roomGlow);

  scene3d.background=new THREE.Color(c.bgColor);

  // Floor with rug area
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:c.floorColor,roughness:0.92}));
  floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene3d.add(floor);

  // Warm area rug (under desk)
  const rug=new THREE.Mesh(new THREE.PlaneGeometry(3.2,2),new THREE.MeshStandardMaterial({color:c.rugColor,roughness:0.95}));
  rug.rotation.x=-Math.PI/2; rug.position.set(0,0.005,0.2); rug.receiveShadow=true; scene3d.add(rug);

  // Walls
  const wallMat=new THREE.MeshStandardMaterial({color:c.wallColor,roughness:0.95});
  const backWall=new THREE.Mesh(new THREE.PlaneGeometry(20,10),wallMat);
  backWall.position.set(0,5,-5.5); backWall.receiveShadow=true; scene3d.add(backWall);
  const sideWall=new THREE.Mesh(new THREE.PlaneGeometry(20,10),wallMat);
  sideWall.position.set(-6,5,0); sideWall.rotation.y=Math.PI/2; sideWall.receiveShadow=true; scene3d.add(sideWall);

  // Window frame on back wall
  const frameMat=new THREE.MeshStandardMaterial({color:0x3d3228,roughness:0.6});
  const windowGroup=new THREE.Group();
  const wTop=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.08,0.06),frameMat); wTop.position.set(0,3.2,-5.47); windowGroup.add(wTop);
  const wBot=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.08,0.06),frameMat); wBot.position.set(0,1.6,-5.47); windowGroup.add(wBot);
  const wL=new THREE.Mesh(new THREE.BoxGeometry(0.06,1.6,0.06),frameMat); wL.position.set(-1.07,2.4,-5.47); windowGroup.add(wL);
  const wR=new THREE.Mesh(new THREE.BoxGeometry(0.06,1.6,0.06),frameMat); wR.position.set(1.07,2.4,-5.47); windowGroup.add(wR);
  const wMid=new THREE.Mesh(new THREE.BoxGeometry(0.04,1.6,0.04),frameMat); wMid.position.set(0,2.4,-5.47); windowGroup.add(wMid);
  // Window light glow
  const winGlow=new THREE.Mesh(new THREE.PlaneGeometry(2.1,1.55),new THREE.MeshBasicMaterial({color:0x4a5a6a,transparent:true,opacity:0.3}));
  winGlow.position.set(0,2.4,-5.46); windowGroup.add(winGlow);
  scene3d.add(windowGroup);

  // Moonlight from window
  const moonLight=new THREE.DirectionalLight(0xb8d4ff,0.25);
  moonLight.position.set(0,4,-8); scene3d.add(moonLight);
  // Window glow light
  const windowGlow=new THREE.PointLight(0xcce0ff,0.3,4);
  windowGlow.position.set(0,2.5,-5.3); scene3d.add(windowGlow);

  deskGroup=new THREE.Group();
  const desktopMat=new THREE.MeshStandardMaterial({color:c.deskColor,roughness:0.35,metalness:0.05});
  const legMat=new THREE.MeshStandardMaterial({color:c.accentColor,roughness:0.3,metalness:0.5});

  // Desktop
  const desktop=new THREE.Mesh(new THREE.BoxGeometry(2.6,0.07,1.3),desktopMat);
  desktop.position.y=1.0; desktop.castShadow=true; desktop.receiveShadow=true; deskGroup.add(desktop);

  // Legs
  [[-1.15,0.55,0.55],[1.15,0.55,0.55],[-1.15,0.55,-0.55],[1.15,0.55,-0.55]].forEach(([x,y,z])=>{
    const leg=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.02,1,8),legMat);
    leg.position.set(x,y,z); leg.castShadow=true; deskGroup.add(leg);
  });

  // Monitor
  const standMat2=new THREE.MeshStandardMaterial({color:0x3a3228,roughness:0.3,metalness:0.6});
  const standBase=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.12,0.025,24),standMat2);
  standBase.position.set(0,1.05,-0.25); deskGroup.add(standBase);
  const standNeck=new THREE.Mesh(new THREE.BoxGeometry(0.035,0.22,0.018),standMat2);
  standNeck.position.set(0,1.16,-0.25); deskGroup.add(standNeck);
  const screenFrame=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.5,0.025),new THREE.MeshStandardMaterial({color:c.monitorColor,roughness:0.2,metalness:0.8}));
  screenFrame.position.set(0,1.32,-0.25); screenFrame.castShadow=true; deskGroup.add(screenFrame);
  const screenGlow=new THREE.Mesh(new THREE.PlaneGeometry(0.75,0.45),new THREE.MeshStandardMaterial({color:0x6a8aaa,emissive:0x3a5a7a,emissiveIntensity:0.6,roughness:0.1}));
  screenGlow.position.set(0,1.32,-0.236); deskGroup.add(screenGlow);
  const screenLt=new THREE.PointLight(0xaaddff,0.4,2.5);
  screenLt.position.set(0,1.32,0.15); deskGroup.add(screenLt);

  // Keyboard
  const kb=new THREE.Mesh(new THREE.BoxGeometry(0.65,0.018,0.2),new THREE.MeshStandardMaterial({color:0x2c2824,roughness:0.5}));
  kb.position.set(0,1.015,0.12); kb.castShadow=true; deskGroup.add(kb);
  // Mouse
  const mouseM=new THREE.Mesh(new THREE.SphereGeometry(0.03,12,12),new THREE.MeshStandardMaterial({color:0x1a1816,roughness:0.3}));
  mouseM.scale.set(1,0.7,1.3); mouseM.position.set(0.45,1.02,0.12); deskGroup.add(mouseM);

  // Coffee cup with heart steam
  const cup=new THREE.Mesh(new THREE.CylinderGeometry(0.038,0.032,0.08,16),new THREE.MeshStandardMaterial({color:0xe8ddd0,roughness:0.6}));
  cup.position.set(0.85,1.045,-0.12); cup.castShadow=true; deskGroup.add(cup);
  const coffee=new THREE.Mesh(new THREE.CircleGeometry(0.03,16),new THREE.MeshStandardMaterial({color:0x4a3020,roughness:0.8}));
  coffee.rotation.x=-Math.PI/2; coffee.position.set(0.85,1.087,-0.12); deskGroup.add(coffee);
  // Steam hearts
  for(let i=0;i<3;i++){
    const steam=new THREE.Mesh(new THREE.SphereGeometry(0.007+i*0.002,8,8),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.12}));
    steam.position.set(0.85+(Math.random()-0.5)*0.015,1.12+i*0.025,-0.12+(Math.random()-0.5)*0.015);
    steam.userData={initialY:steam.position.y,phase:Math.random()*Math.PI*2};
    deskGroup.add(steam);
  }

  // Desk lamp (cozy style)
  const lampBase=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.065,0.02,16),standMat2);
  lampBase.position.set(-0.9,1.02,-0.3); deskGroup.add(lampBase);
  const arm1=new THREE.Mesh(new THREE.CylinderGeometry(0.01,0.01,0.3,8),standMat2);
  arm1.position.set(-0.9,1.17,-0.3); arm1.rotation.z=-0.25; deskGroup.add(arm1);

// ===== DECORATION BUILDER =====
function rebuildDecorations() {
  const c = currentThemeConfig;
  if (!c || !scene3d) return;
  for (const id of state.ownedDecor) {
    if (decorMeshes[id]) { scene3d.remove(decorMeshes[id]); decorMeshes[id]=null; }
    const mesh = createDecorMesh(id, c);
    if (mesh) { scene3d.add(mesh); decorMeshes[id]=mesh; }
  }
}

    case 'mini_calendar':{

      const red=new THREE.MeshStandardMaterial({color:0xc44,roughness:0.8});
      for(let i=0;i<3;i++)for(let j=0;j<3;j++){const dot=new THREE.Mesh(new THREE.SphereGeometry(0.006,6,6),red); dot.position.set(-1.17+j*0.02,1.03+i*0.02,0.255); g.add(dot);}
      break;}
    case 'snack_jar':{
      const jar=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.03,0.07,16),new THREE.MeshStandardMaterial({color:0xeeddcc,roughness:0.3,transparent:true,opacity:0.7}));
      jar.position.set(0.7,1.04,0.35); g.add(jar);
      for(let i=0;i<4;i++){const cookie=new THREE.Mesh(new THREE.SphereGeometry(0.008,6,6),new THREE.MeshStandardMaterial({color:0xc8956c,roughness:0.9})); cookie.position.set(0.7+(Math.random()-0.5)*0.02,1.03+i*0.012,0.35+(Math.random()-0.5)*0.02); g.add(cookie);}
      break;}
    case 'area_rug':{

      rug2.rotation.x=-Math.PI/2; rug2.position.set(0,0.008,0.3); rug2.receiveShadow=true; g.add(rug2);
      const rugBorder=new THREE.Mesh(new THREE.PlaneGeometry(2.7,2.0),new THREE.MeshStandardMaterial({color:0x6b4226,roughness:0.95}));

    case 'fairy_lights':{

  return g;
}

function animate() {
  animId=requestAnimationFrame(animate);
  if(controls3d)controls3d.update();
  if(particleSystem?.userData?.velocities){
    const pos=particleSystem.geometry.attributes.position.array;
    const v=particleSystem.userData.velocities;
    for(let i=0;i<v.length;i++){pos[i*3]+=v[i].x; pos[i*3+1]+=v[i].y; pos[i*3+2]+=v[i].z; if(pos[i*3+1]>5)pos[i*3+1]=0;}
    particleSystem.geometry.attributes.position.needsUpdate=true;
  }
  if(deskGroup){
    deskGroup.children.forEach(ch=>{
      if(ch.userData?.initialY){ch.position.y=ch.userData.initialY+Math.sin(Date.now()*0.001+ch.userData.phase)*0.008; if(ch.material?.opacity)ch.material.opacity=0.1+Math.sin(Date.now()*0.002+ch.userData.phase)*0.04;}
    });
  }
  if(lampLight)lampLight.intensity=currentThemeConfig.lampIntensity+Math.sin(Date.now()*0.002)*0.08;
  // Animate clock hands
  if(window._clockGroup?.userData?.minHand){
    const now=new Date();
    const mins=now.getMinutes()+now.getSeconds()/60;
    const hrs=(now.getHours()%12)+mins/60;
    window._clockGroup.userData.minHand.rotation.z=-mins*(Math.PI/30);
    if(window._clockGroup.userData.hourHand)window._clockGroup.userData.hourHand.rotation.z=-hrs*(Math.PI/6);
  }
  // Flicker candles
  for(const k in decorMeshes){if(decorMeshes[k]){decorMeshes[k].children.forEach(ch=>{if(ch.isPointLight&&ch.color.r>0.8&&ch.color.g<0.7)ch.intensity=0.3+Math.sin(Date.now()*0.005+Math.random())*0.15;});}}
  if(renderer3d&&scene3d&&camera3d)renderer3d.render(scene3d,camera3d);
}

function startBubbleSimulation(){bubbleInterval=setInterval(()=>{if(Math.random()>0.6)return;const u=onlineUsers[Math.floor(Math.random()*onlineUsers.length)];const m=bubbleMessages[Math.floor(Math.random()*bubbleMessages.length)];const area=document.getElementById('bubbleArea');const b=document.createElement('div');b.className='bubble bubble-fade';b.innerHTML=`<div class="bubble-avatar" style="background:${u.color};">${u.name[0]}</div><div><div class="bubble-name">${u.name}</div><div class="bubble-text">${m}</div></div>`;area.appendChild(b);setTimeout(()=>b.remove(),8500);if(area.children.length>5)area.children[0].remove();},8000);}

function startTimer(){state.timerRunning=true;state.timerInterval=setInterval(()=>{state.timerSeconds++;updateTimerDisplay();if(state.timerSeconds%60===0){state.coins++;state.earnedCoinsSession++;updateCoins();}},1000);document.getElementById('timerBtn').innerHTML='<i class="fas fa-pause"></i> <span>暂停</span>';document.getElementById('timerBtn').classList.remove('primary');document.getElementById('timerBtn').classList.add('danger');document.getElementById('statusDot').classList.add('active');document.getElementById('statusText').classList.add('active');document.getElementById('statusText').textContent='专注中...';}

// ===== DECORATE SYSTEM =====
function renderDecorGrid() {
  document.getElementById('decorGrid').innerHTML = decorItems.map(d => {
    const owned = state.ownedDecor.includes(d.id);
    return `<div class="decor-item ${owned ? 'owned' : ''}" onclick="${owned ? `toggleDecorPreview('${d.id}')` : `purchaseDecor('${d.id}')`}">
      <div class="decor-icon">${d.icon}</div>
      <div class="decor-name">${d.name}</div>
      <div class="decor-price">${owned ? '<i class="fas fa-check-circle"></i> 已拥有' : `<i class="fas fa-coins"></i> ${d.price}`}</div>
      <div class="decor-desc">${d.desc}</div>
    </div>`;
  }).join('');
}
window.toggleDecorPreview = function(id) {
  const d = decorItems.find(x => x.id === id);
  if (!d) return;
  const preview = document.getElementById('decorPreview');
  document.getElementById('decorPreviewIcon').textContent = d.icon;
  document.getElementById('decorPreviewName').textContent = d.name;
  document.getElementById('decorPreviewDesc').textContent = d.desc + (state.ownedDecor.includes(id) ? '（已布置）' : '');
  preview.style.display = 'flex';
};
window.purchaseDecor = function(id) {
  const item = decorItems.find(d => d.id === id);
  if (!item || state.ownedDecor.includes(id)) return;
  if (state.coins < item.price) { alert('积分不足，继续专注赚取积分吧！'); return; }
  if (confirm(`花费 ${item.price} 积分购买「${item.name}」？\n${item.desc}`)) {
    state.coins -= item.price;
    state.ownedDecor.push(id);
    updateCoins();
    renderDecorGrid();
    toggleDecorPreview(id);
    // Add to 3D scene immediately
    if (currentThemeConfig && scene3d) {
      const mesh = createDecorMesh(id, currentThemeConfig);
      if (mesh) { scene3d.add(mesh); decorMeshes[id] = mesh; }
    }
    saveLocalData();
  }
};
