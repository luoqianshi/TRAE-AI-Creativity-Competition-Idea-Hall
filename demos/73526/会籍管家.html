<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>会籍管家 - 会员到期提醒助手</title>
  <style>
    :root {
      --bg-primary: #f8fafc;
      --bg-card: #fff;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --accent-main: #6366f1;
      --accent-warm: #f97316;
      --accent-success: #10b981;
      --accent-danger: #ef4444;
      --border-light: #e2e8f0;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
      --radius-md: 12px;
      --radius-lg: 16px;
      --transition: all 0.25s ease;
    }

    .dark-theme {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --accent-main: #818cf8;
      --accent-warm: #fb923c;
      --accent-success: #34d399;
      --accent-danger: #f87171;
      --border-light: #334155;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 16px;
      transition: var(--transition);
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 32px;
      padding-top: 20px;
    }

    .logo {
      font-size: 48px;
      margin-bottom: 12px;
    }

    h1 {
      font-weight: 700;
      font-size: 32px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, var(--accent-main), var(--accent-warm));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      font-size: 16px;
      color: var(--text-secondary);
      max-width: 480px;
      margin: 0 auto;
    }

    /* Stats Bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-item {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
    }

    .stat-number {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .stat-number.danger { color: var(--accent-danger); }
    .stat-number.warning { color: var(--accent-warm); }
    .stat-number.success { color: var(--accent-success); }

    .stat-label {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* Add Section */
    .add-section {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
    }

    .section-title {
      font-weight: 600;
      font-size: 18px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.flex-2 {
      grid-column: span 1;
    }

    .form-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .form-input, .form-select {
      padding: 12px 14px;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      font-size: 15px;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: var(--transition);
      width: 100%;
    }

    .form-input:focus, .form-select:focus {
      outline: none;
      border-color: var(--accent-main);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .add-btn {
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--accent-main), #8b5cf6);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-size: 15px;
      white-space: nowrap;
    }

    .add-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    /* Filter Tabs */
    .filter-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter-tab {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
    }

    .filter-tab.active {
      background: var(--accent-main);
      color: white;
      border-color: var(--accent-main);
    }

    .filter-tab:hover:not(.active) {
      border-color: var(--accent-main);
      color: var(--accent-main);
    }

    /* Members List */
    .members-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .member-card {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
      transition: var(--transition);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .member-card:hover {
      box-shadow: var(--shadow-md);
    }

    .member-card.expired {
      border-left: 4px solid var(--accent-danger);
    }

    .member-card.expiring {
      border-left: 4px solid var(--accent-warm);
    }

    .member-card.normal {
      border-left: 4px solid var(--accent-success);
    }

    .member-info {
      flex: 1;
    }

    .member-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .member-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
    }

    .dark-theme .member-icon {
      background: linear-gradient(135deg, #1e3a5f, #1e40af);
    }

    .member-name {
      font-weight: 600;
      font-size: 17px;
    }

    .member-meta {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: var(--text-secondary);
      margin-left: 52px;
    }

    .member-meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .expire-badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .expire-badge.danger {
      background: rgba(239, 68, 68, 0.1);
      color: var(--accent-danger);
    }

    .expire-badge.warning {
      background: rgba(249, 115, 22, 0.1);
      color: var(--accent-warm);
    }

    .expire-badge.success {
      background: rgba(16, 185, 129, 0.1);
      color: var(--accent-success);
    }

    .member-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border-light);
      background: var(--bg-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      color: var(--text-secondary);
    }

    .action-btn:hover {
      border-color: var(--accent-main);
      color: var(--accent-main);
    }

    .action-btn.delete:hover {
      border-color: var(--accent-danger);
      color: var(--accent-danger);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-icon {
      font-size: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-text {
      font-size: 16px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition);
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 24px;
      max-width: 400px;
      width: 90%;
      transform: scale(0.9);
      transition: var(--transition);
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .modal-content {
      margin-bottom: 20px;
      color: var(--text-secondary);
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .modal-btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }

    .modal-btn.cancel {
      background: var(--bg-primary);
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
    }

    .modal-btn.confirm {
      background: var(--accent-danger);
      border: none;
      color: white;
    }

    .modal-btn:hover {
      transform: translateY(-1px);
    }

    /* Theme Toggle */
    .theme-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-md);
      z-index: 100;
      transition: var(--transition);
    }

    .theme-toggle:hover {
      transform: scale(1.1);
    }

    .theme-icon {
      width: 22px;
      height: 22px;
      fill: var(--text-primary);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 80px;
      right: 24px;
      background: var(--accent-success);
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      transform: translateY(20px);
      opacity: 0;
      transition: var(--transition);
      z-index: 1001;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr 1fr;
      }

      .form-grid .form-group:last-child {
        grid-column: span 2;
      }

      .add-btn {
        width: 100%;
      }

      .stats-bar {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .member-card {
        flex-direction: column;
        align-items: flex-start;
      }

      .member-actions {
        width: 100%;
        justify-content: flex-end;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--border-light);
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 26px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-grid .form-group:last-child {
        grid-column: span 1;
      }

      .member-meta {
        flex-direction: column;
        gap: 4px;
        margin-left: 0;
        margin-top: 8px;
      }
    }

    /* Accessibility */
    *:focus-visible {
      outline: 2px solid var(--accent-main);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">🎫</div>
      <h1>会籍管家</h1>
      <p class="subtitle">统一管理所有会员到期时间，智能提醒，不再错过续费或优惠</p>
    </header>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-number danger" id="expired-count">0</div>
        <div class="stat-label">已过期</div>
      </div>
      <div class="stat-item">
        <div class="stat-number warning" id="expiring-count">0</div>
        <div class="stat-label">即将到期（7天内）</div>
      </div>
      <div class="stat-item">
        <div class="stat-number success" id="active-count">0</div>
        <div class="stat-label">正常</div>
      </div>
    </div>

    <!-- Add Section -->
    <section class="add-section">
      <h2 class="section-title">➕ 添加会员</h2>
      <div class="form-grid">
        <div class="form-group flex-2">
          <label class="form-label">会员名称</label>
          <input type="text" class="form-input" id="member-name" placeholder="如：爱奇艺会员" autocomplete="off" />
        </div>
        <div class="form-group">
          <label class="form-label">到期日期</label>
          <input type="date" class="form-input" id="member-date" />
        </div>
        <div class="form-group">
          <label class="form-label">提醒方式</label>
          <select class="form-select" id="member-reminder">
            <option value="3">提前3天</option>
            <option value="7" selected>提前7天</option>
            <option value="14">提前14天</option>
            <option value="30">提前30天</option>
          </select>
        </div>
        <button class="add-btn" id="add-btn">添加</button>
      </div>
    </section>

    <!-- Filter Tabs -->
    <div class="filter-tabs">
      <div class="filter-tab active" data-filter="all">全部</div>
      <div class="filter-tab" data-filter="expired">已过期</div>
      <div class="filter-tab" data-filter="expiring">即将到期</div>
      <div class="filter-tab" data-filter="normal">正常</div>
    </div>

    <!-- Members List -->
    <div class="members-list" id="members-list">
      <!-- Empty State -->
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">📋</div>
        <div class="empty-text">暂无会员记录，点击上方"添加"开始管理吧～</div>
      </div>
    </div>
  </div>

  <!-- Delete Modal -->
  <div class="modal-overlay" id="delete-modal">
    <div class="modal">
      <div class="modal-title">确认删除</div>
      <div class="modal-content">确定要删除这个会员记录吗？此操作无法撤销。</div>
      <div class="modal-actions">
        <button class="modal-btn cancel" id="cancel-delete">取消</button>
        <button class="modal-btn confirm" id="confirm-delete">删除</button>
      </div>
    </div>
  </div>

  <!-- Theme Toggle -->
  <button class="theme-toggle" id="theme-toggle" aria-label="切换深色/浅色模式">
    <svg class="theme-icon" viewBox="0 0 24 24" id="theme-icon">
      <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>
    </svg>
  </button>

  <!-- Toast -->
  <div class="toast" id="toast">操作成功</div>

  <script>
    // 数据存储
    let members = JSON.parse(localStorage.getItem('members') || '[]');
    let deleteTargetId = null;

    // DOM 元素
    const membersList = document.getElementById('members-list');
    const emptyState = document.getElementById('empty-state');
    const addBtn = document.getElementById('add-btn');
    const nameInput = document.getElementById('member-name');
    const dateInput = document.getElementById('member-date');
    const reminderSelect = document.getElementById('member-reminder');
    const filterTabs = document.querySelectorAll('.filter-tab');
    const deleteModal = document.getElementById('delete-modal');
    const cancelDeleteBtn = document.getElementById('cancel-delete');
    const confirmDeleteBtn = document.getElementById('confirm-delete');
    const toast = document.getElementById('toast');

    // 主题切换
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const body = document.body;

    const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
      body.classList.add('dark-theme');
      updateThemeIcon(true);
    }

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-theme');
      const isDark = body.classList.contains('dark-theme');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateThemeIcon(isDark);
    });

    function updateThemeIcon(isDark) {
      themeIcon.innerHTML = isDark
        ? '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>'
        : '<path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>';
    }

    // 显示提示
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // 计算会员状态
    function getMemberStatus(expireDate) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const expire = new Date(expireDate);
      expire.setHours(0, 0, 0, 0);
      const diffDays = Math.ceil((expire - today) / (1000 * 60 * 60 * 24));

      if (diffDays < 0) return { status: 'expired', text: '已过期', class: 'danger' };
      if (diffDays <= 7) return { status: 'expiring', text: `${diffDays}天后到期`, class: 'warning' };
      return { status: 'normal', text: `${diffDays}天后到期`, class: 'success' };
    }

    // 更新统计
    function updateStats() {
      let expired = 0, expiring = 0, active = 0;
      members.forEach(m => {
        const { status } = getMemberStatus(m.date);
        if (status === 'expired') expired++;
        else if (status === 'expiring') expiring++;
        else active++;
      });
      document.getElementById('expired-count').textContent = expired;
      document.getElementById('expiring-count').textContent = expiring;
      document.getElementById('active-count').textContent = active;
    }

    // 渲染会员列表
    function renderMembers(filter = 'all') {
      const filtered = members.filter(m => {
        if (filter === 'all') return true;
        return getMemberStatus(m.date).status === filter;
      });

      if (filtered.length === 0) {
        membersList.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📋</div>
            <div class="empty-text">${filter === 'all' ? '暂无会员记录，点击上方"添加"开始管理吧～' : '该分类下暂无会员记录'}</div>
          </div>
        `;
        return;
      }

      membersList.innerHTML = filtered.map(m => {
        const { text, class: badgeClass, status } = getMemberStatus(m.date);
        const cardClass = status;
        return `
          <div class="member-card ${cardClass}" data-id="${m.id}">
            <div class="member-info">
              <div class="member-header">
                <div class="member-icon">${getIcon(m.name)}</div>
                <div class="member-name">${m.name}</div>
                <span class="expire-badge ${badgeClass}">${text}</span>
              </div>
              <div class="member-meta">
                <div class="member-meta-item">📅 到期：${formatDate(m.date)}</div>
                <div class="member-meta-item">🔔 提醒：提前${m.reminder}天</div>
              </div>
            </div>
            <div class="member-actions">
              <button class="action-btn edit" title="编辑" onclick="editMember('${m.id}')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
              </button>
              <button class="action-btn delete" title="删除" onclick="showDeleteModal('${m.id}')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="3 6 5 6 21 6"/>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // 获取图标
    function getIcon(name) {
      const icons = {
        '爱奇艺': '🎬', '优酷': '📺', '腾讯': '🎥', 'B站': '📺', '哔哩': '📺',
        '网易云': '🎵', 'QQ音乐': '🎵', '酷狗': '🎵', '虾米': '🎵',
        '百度网盘': '💾', '阿里云': '☁️', 'iCloud': '☁️', 'OneDrive': '☁️',
        '京东': '🛒', '淘宝': '🛒', '拼多多': '🛒',
        '微信': '💬', 'QQ': '💬',
        'Microsoft': '💻', 'Adobe': '🎨', 'Figma': '🎨', 'Notion': '📝',
        'Spotify': '🎵', 'Netflix': '🎬', 'YouTube': '📺'
      };
      for (const key in icons) {
        if (name.toLowerCase().includes(key.toLowerCase())) return icons[key];
      }
      return '🎫';
    }

    // 格式化日期
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    // 添加会员
    addBtn.addEventListener('click', () => {
      const name = nameInput.value.trim();
      const date = dateInput.value;
      const reminder = reminderSelect.value;

      if (!name) {
        showToast('请输入会员名称');
        return;
      }
      if (!date) {
        showToast('请选择到期日期');
        return;
      }

      const member = {
        id: Date.now().toString(),
        name,
        date,
        reminder: parseInt(reminder)
      };

      members.push(member);
      saveMembers();
      renderMembers(getCurrentFilter());
      updateStats();
      showToast('添加成功');

      nameInput.value = '';
      dateInput.value = '';
    });

    // 获取当前筛选
    function getCurrentFilter() {
      const activeTab = document.querySelector('.filter-tab.active');
      return activeTab ? activeTab.dataset.filter : 'all';
    }

    // 筛选切换
    filterTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        filterTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        renderMembers(tab.dataset.filter);
      });
    });

    // 编辑会员
    function editMember(id) {
      const member = members.find(m => m.id === id);
      if (!member) return;

      nameInput.value = member.name;
      dateInput.value = member.date;
      reminderSelect.value = member.reminder;

      // 删除旧记录，添加时会创建新的
      members = members.filter(m => m.id !== id);
      saveMembers();
      renderMembers(getCurrentFilter());
      updateStats();

      nameInput.focus();
      showToast('已加载到编辑区，修改后点击添加保存');
    }

    // 显示删除确认
    function showDeleteModal(id) {
      deleteTargetId = id;
      deleteModal.classList.add('active');
    }

    // 取消删除
    cancelDeleteBtn.addEventListener('click', () => {
      deleteModal.classList.remove('active');
      deleteTargetId = null;
    });

    // 确认删除
    confirmDeleteBtn.addEventListener('click', () => {
      if (deleteTargetId) {
        members = members.filter(m => m.id !== deleteTargetId);
        saveMembers();
        renderMembers(getCurrentFilter());
        updateStats();
        showToast('删除成功');
      }
      deleteModal.classList.remove('active');
      deleteTargetId = null;
    });

    // 保存到本地存储
    function saveMembers() {
      localStorage.setItem('members', JSON.stringify(members));
    }

    // 初始化
    renderMembers();
    updateStats();

    // 设置默认日期为30天后
    const defaultDate = new Date();
    defaultDate.setDate(defaultDate.getDate() + 30);
    dateInput.value = defaultDate.toISOString().split('T')[0];
  </script>
</body>
</html>
