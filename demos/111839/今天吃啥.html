<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃啥 - 选择困难症救星</title>
    <style>
        :root {
            --bg: #FFF8F0;
            --card: #FFFFFF;
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #FFD166;
            --text: #3D2C1E;
            --text-light: #8B7B6B;
            --text-lighter: #B5A595;
            --border: #F0E8DE;
            --shadow-sm: 0 2px 8px rgba(61, 44, 30, 0.05);
            --shadow-md: 0 6px 20px rgba(61, 44, 30, 0.10);
            --shadow-lg: 0 12px 32px rgba(61, 44, 30, 0.14);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --transition: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #efe8de;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 手机外壳 */
        .phone-frame {
            width: 390px;
            height: 740px;
            background: #2a2a2a;
            border-radius: 40px;
            padding: 10px;
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.3),
                0 0 0 2px #333,
                0 0 0 4px #2a2a2a;
            position: relative;
        }
        .phone-notch {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 24px;
            background: #2a2a2a;
            border-radius: 0 0 16px 16px;
            z-index: 20;
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            background: var(--bg);
            border-radius: 30px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 状态栏 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px 6px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.4px;
        }
        .status-time {
            font-size: 13px;
            font-weight: 700;
        }
        .status-icons {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
        }
        .battery {
            width: 20px;
            height: 9px;
            border: 1.5px solid var(--text);
            border-radius: 2px;
            padding: 1.5px;
            display: inline-flex;
            margin-left: 2px;
            position: relative;
        }
        .battery::after {
            content: '';
            position: absolute;
            right: -3px;
            top: 50%;
            transform: translateY(-50%);
            width: 2px;
            height: 4px;
            background: var(--text);
            border-radius: 0 1px 1px 0;
        }
        .battery-fill {
            display: block;
            height: 100%;
            background: var(--text);
            border-radius: 1px;
            width: 80%;
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 20px 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* 标题 */
        .header {
            text-align: center;
            margin-bottom: 4px;
        }
        .header .icon-row {
            font-size: 36px;
            animation: floatHeader 3s ease-in-out infinite;
            display: inline-block;
        }
        @keyframes floatHeader {
            0%,
            100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-6px);
            }
            60% {
                transform: translateY(-2px);
            }
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 1px;
            margin-top: 2px;
        }
        .header .subtitle {
            font-size: 12px;
            color: var(--text-light);
            letter-spacing: 1px;
        }

        /* 食物动画展示区 */
        .food-display {
            width: 140px;
            height: 140px;
            background: var(--card);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 16px 0;
            box-shadow: var(--shadow-md);
            position: relative;
            transition: transform 0.3s var(--transition);
        }
        .food-display.shaking {
            animation: shakeDish 0.8s var(--transition);
        }
        @keyframes shakeDish {
            0%,
            100% {
                transform: rotate(0);
            }
            15% {
                transform: rotate(-12deg) scale(1.04);
            }
            30% {
                transform: rotate(10deg) scale(1.02);
            }
            45% {
                transform: rotate(-8deg);
            }
            60% {
                transform: rotate(6deg);
            }
            75% {
                transform: rotate(-3deg);
            }
            90% {
                transform: rotate(1deg);
            }
        }
        .food-display .emoji {
            font-size: 64px;
            transition: all 0.15s var(--transition);
            line-height: 1;
        }
        .food-display .emoji.spinning {
            animation: spinCycle 0.9s var(--transition);
        }
        @keyframes spinCycle {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            25% {
                transform: scale(0.7);
                opacity: 0.5;
            }
            50% {
                transform: scale(0.6);
                opacity: 0.3;
            }
            75% {
                transform: scale(0.8);
                opacity: 0.7;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .food-display .dot-pattern {
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--secondary);
            border-radius: 50%;
            opacity: 0.6;
            animation: orbit 3s linear infinite;
        }
        .dot-pattern:nth-child(2) {
            width: 8px;
            height: 8px;
            animation-delay: -1s;
            animation-duration: 3.5s;
        }
        .dot-pattern:nth-child(3) {
            width: 6px;
            height: 6px;
            animation-delay: -2s;
            animation-duration: 2.8s;
        }
        @keyframes orbit {
            0% {
                transform: rotate(0deg) translateX(55px) rotate(0deg);
            }
            100% {
                transform: rotate(360deg) translateX(55px) rotate(-360deg);
            }
        }

        /* 结果展示区 */
        .result-area {
            text-align: center;
            min-height: 56px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            transition: all 0.3s var(--transition);
        }
        .result-text {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.5px;
            transition: all 0.3s var(--transition);
        }
        .result-text.pop {
            animation: popIn 0.5s var(--transition);
        }
        @keyframes popIn {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }
            60% {
                transform: scale(1.15);
            }
            80% {
                transform: scale(0.95);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .result-sub {
            font-size: 13px;
            color: var(--text-light);
            margin-top: 4px;
            letter-spacing: 0.5px;
        }
        .result-placeholder {
            font-size: 14px;
            color: var(--text-lighter);
            letter-spacing: 1px;
        }

        /* 核心按钮 */
        .btn-main {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 28px rgba(255, 107, 53, 0.35);
            transition: all 0.25s var(--transition);
            position: relative;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .btn-main:hover {
            background: var(--primary-dark);
            box-shadow: 0 12px 34px rgba(255, 107, 53, 0.45);
            transform: translateY(-3px);
        }
        .btn-main:active {
            transform: scale(0.92);
            box-shadow: 0 4px 16px rgba(255, 107, 53, 0.25);
            transition: all 0.1s var(--transition);
        }
        .btn-main .btn-emoji {
            display: block;
            font-size: 40px;
            margin-bottom: 2px;
            animation: btnBounce 2s ease-in-out infinite;
        }
        @keyframes btnBounce {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }
        .btn-main .btn-label {
            font-size: 16px;
            letter-spacing: 2px;
        }

        /* 底部操作 */
        .bottom-actions {
            display: flex;
            gap: 12px;
            margin-top: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-sm {
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            border: 1.5px solid var(--border);
            background: var(--card);
            color: var(--text);
            transition: all 0.2s var(--transition);
            font-family: inherit;
            white-space: nowrap;
        }
        .btn-sm:hover {
            border-color: #d5c8b5;
            background: #fefaf5;
            transform: translateY(-1px);
        }
        .btn-sm:active {
            transform: scale(0.95);
            background: #fef5eb;
        }
        .btn-sm.accent {
            background: #fff5eb;
            border-color: #ffccaa;
            color: #d06830;
            font-weight: 600;
        }

        /* 历史记录小标签 */
        .history-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 8px;
            max-width: 280px;
        }
        .history-tag {
            font-size: 11px;
            padding: 5px 10px;
            background: #fefaf5;
            border-radius: 12px;
            color: var(--text-light);
            letter-spacing: 0.3px;
            border: 1px solid #f0e8de;
            animation: fadeInTag 0.4s var(--transition);
        }
        @keyframes fadeInTag {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .history-label {
            font-size: 10px;
            color: var(--text-lighter);
            letter-spacing: 1px;
            text-align: center;
            margin-top: 6px;
        }

        /* 菜单编辑弹窗 */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 30;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s var(--transition);
            border-radius: 30px;
            overflow: hidden;
        }
        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .menu-panel {
            width: 100%;
            max-height: 65%;
            background: #fff;
            border-radius: 20px 20px 0 0;
            padding: 20px 20px 30px;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.35s var(--transition);
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.12);
        }
        .overlay.active .menu-panel {
            transform: translateY(0);
        }
        .menu-panel h3 {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
            text-align: center;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }
        .menu-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
            justify-content: center;
        }
        .menu-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            background: #fefaf5;
            border-radius: 18px;
            font-size: 13px;
            color: var(--text);
            border: 1px solid #f0e8de;
            cursor: default;
            letter-spacing: 0.3px;
            transition: all 0.2s var(--transition);
        }
        .menu-item .delete-btn {
            cursor: pointer;
            font-size: 14px;
            color: #c0b0a0;
            margin-left: 2px;
            padding: 2px 4px;
            border-radius: 50%;
            transition: all 0.2s;
            line-height: 1;
        }
        .menu-item .delete-btn:hover {
            color: #e05540;
            background: #fff0ed;
        }
        .add-row {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
        }
        .add-row input {
            flex: 1;
            max-width: 180px;
            padding: 10px 14px;
            border-radius: 18px;
            border: 1.5px solid var(--border);
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: border 0.2s;
            letter-spacing: 0.5px;
        }
        .add-row input:focus {
            border-color: #ffbb88;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.06);
        }
        .add-row button {
            padding: 10px 16px;
            border-radius: 18px;
            background: var(--primary);
            color: #fff;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            letter-spacing: 0.5px;
            font-family: inherit;
            transition: all 0.2s;
        }
        .add-row button:hover {
            background: var(--primary-dark);
        }
        .btn-reset-menu {
            display: block;
            margin: 12px auto 0;
            padding: 8px 16px;
            border-radius: 14px;
            background: transparent;
            border: 1px solid #e0d5c8;
            color: var(--text-light);
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }
        .btn-reset-menu:hover {
            background: #fefaf5;
            border-color: #d0c0ad;
        }
        .close-panel {
            position: absolute;
            top: 10px;
            right: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #f5f0ea;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .close-panel:hover {
            background: #ebe3d8;
            color: var(--text);
        }

        /* 响应式 */
        @media (max-width: 440px) {
            body {
                padding: 0;
                align-items: flex-start;
            }
            .phone-frame {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                padding: 0;
                box-shadow: none;
                background: transparent;
            }
            .phone-notch {
                display: none;
            }
            .phone-screen {
                border-radius: 0;
                height: 100vh;
            }
            .overlay {
                border-radius: 0;
            }
            .btn-main {
                width: 140px;
                height: 140px;
                font-size: 17px;
            }
            .btn-main .btn-emoji {
                font-size: 34px;
            }
            .food-display {
                width: 120px;
                height: 120px;
                margin: 10px 0;
            }
            .food-display .emoji {
                font-size: 52px;
            }
            @keyframes orbit {
                0% {
                    transform: rotate(0deg) translateX(46px) rotate(0deg);
                }
                100% {
                    transform: rotate(360deg) translateX(46px) rotate(-360deg);
                }
            }
        }
    </style>
</head>
<body>

    <!-- 手机外壳 -->
    <div class="phone-frame">
        <div class="phone-notch"></div>
        <div class="phone-screen" id="phoneScreen">
            <!-- 状态栏 -->
            <div class="status-bar">
                <span class="status-time" id="statusTime">12:00</span>
                <span class="status-icons">
                    <span>WiFi</span>
                    <span class="battery"><span class="battery-fill"></span></span>
                </span>
            </div>

            <!-- 主内容 -->
            <div class="main-content">
                <!-- 标题 -->
                <div class="header">
                    <span class="icon-row">🍽️</span>
                    <h1>今天吃啥</h1>
                    <p class="subtitle">选择困难症 · 一键拯救</p>
                </div>

                <!-- 食物动画展示区 -->
                <div class="food-display" id="foodDisplay">
                    <span class="dot-pattern"></span>
                    <span class="dot-pattern"></span>
                    <span class="dot-pattern"></span>
                    <span class="emoji" id="foodEmoji">🤔</span>
                </div>

                <!-- 结果展示 -->
                <div class="result-area" id="resultArea">
                    <span class="result-placeholder" id="resultPlaceholder">点下方按钮，帮你做决定 👇</span>
                    <span class="result-text" id="resultText" style="display:none;"></span>
                    <span class="result-sub" id="resultSub" style="display:none;"></span>
                </div>

                <!-- 核心按钮 -->
                <button class="btn-main" id="btnMain" onclick="pickFood()">
                    <span class="btn-emoji">🎲</span>
                    <span class="btn-label">吃 啥</span>
                </button>

                <!-- 历史记录 -->
                <p class="history-label" id="historyLabel" style="display:none;">今天抽过的</p>
                <div class="history-tags" id="historyTags"></div>

                <!-- 底部操作 -->
                <div class="bottom-actions">
                    <button class="btn-sm" onclick="pickFood()">🔄 再抽一次</button>
                    <button class="btn-sm accent" onclick="openMenu()">📋 我的菜单</button>
                </div>
            </div>

            <!-- 菜单编辑弹窗 -->
            <div class="overlay" id="overlay">
                <div class="menu-panel" id="menuPanel">
                    <button class="close-panel" onclick="closeMenu()">✕</button>
                    <h3>📋 我的菜单</h3>
                    <div class="menu-list" id="menuList"></div>
                    <div class="add-row">
                        <input type="text" id="addInput" placeholder="添加食物，如：寿司🍣" maxlength="20">
                        <button onclick="addFood()">添加</button>
                    </div>
                    <button class="btn-reset-menu" onclick="resetMenu()">恢复默认菜单</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============ 默认菜单 ============
        const DEFAULT_MENU = [
            '🍚 米饭炒菜',
            '🍜 面条',
            '🍕 披萨',
            '🍔 汉堡',
            '🥗 沙拉',
            '🍱 日料',
            '🌮 塔可',
            '🥟 饺子',
            '🍲 火锅',
            '🍗 炸鸡',
            '🍝 意面',
            '🥘 炖菜',
            '🍙 饭团',
            '🥪 三明治',
            '🍢 烧烤',
        ];

        // ============ 状态 ============
        let menu = JSON.parse(localStorage.getItem('eatwhat_menu') || JSON.stringify(DEFAULT_MENU));
        let todayHistory = JSON.parse(localStorage.getItem('eatwhat_history') || '[]');
        const todayStr = new Date().toDateString();
        const savedDate = localStorage.getItem('eatwhat_date');

        // 跨天清空历史
        if (savedDate !== todayStr) {
            todayHistory = [];
            localStorage.setItem('eatwhat_date', todayStr);
            localStorage.setItem('eatwhat_history', JSON.stringify(todayHistory));
        }

        let isAnimating = false;
        const funnyComments = [
            '就它了，别犹豫！',
            '命运的选择 ✨',
            '胃说：这个可以！',
            '今日份的缘分～',
            '听它的，没错！',
            '安排上了！',
            '冲！就现在！',
            '这个真的不错诶',
            '恭喜你，就是它了',
            '别想了，吃这个！',
        ];

        // ============ DOM元素 ============
        const foodDisplay = document.getElementById('foodDisplay');
        const foodEmoji = document.getElementById('foodEmoji');
        const resultPlaceholder = document.getElementById('resultPlaceholder');
        const resultText = document.getElementById('resultText');
        const resultSub = document.getElementById('resultSub');
        const historyTags = document.getElementById('historyTags');
        const historyLabel = document.getElementById('historyLabel');
        const btnMain = document.getElementById('btnMain');
        const overlay = document.getElementById('overlay');
        const menuList = document.getElementById('menuList');
        const addInput = document.getElementById('addInput');
        const statusTime = document.getElementById('statusTime');

        // ============ 更新时间 ============
        function updateTime() {
            const now = new Date();
            statusTime.textContent = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString()
                .padStart(2, '0');
        }
        updateTime();
        setInterval(updateTime, 30000);

        // ============ 抽取食物 ============
        function pickFood() {
            if (isAnimating) return;
            if (menu.length === 0) {
                showTempResult('😅', '菜单空了，去添加点吃的吧～');
                return;
            }
            isAnimating = true;

            // 隐藏之前的结果
            resultText.style.display = 'none';
            resultSub.style.display = 'none';
            resultPlaceholder.style.display = 'block';
            resultPlaceholder.textContent = '正在帮你挑……';

            // 抖动盘子
            foodDisplay.classList.add('shaking');
            foodEmoji.classList.add('spinning');

            // 快速轮播emoji
            let spinCount = 0;
            const maxSpins = 14;
            let spinSpeed = 60;
            const spinInterval = setInterval(() => {
                const randomItem = menu[Math.floor(Math.random() * menu.length)];
                const emoji = extractEmoji(randomItem);
                foodEmoji.textContent = emoji;
                spinCount++;
                if (spinCount >= maxSpins) {
                    clearInterval(spinInterval);
                    // 最终结果
                    const finalItem = menu[Math.floor(Math.random() * menu.length)];
                    const finalEmoji = extractEmoji(finalItem);
                    foodEmoji.textContent = finalEmoji;
                    foodEmoji.classList.remove('spinning');
                    foodDisplay.classList.remove('shaking');

                    // 显示结果
                    showResult(finalItem);
                    addToHistory(finalItem);
                    isAnimating = false;
                }
                // 逐渐减速
                if (spinCount > 8) spinSpeed += 15;
            }, spinSpeed);

            // 按钮反馈
            btnMain.style.transform = 'scale(0.9)';
            setTimeout(() => {
                btnMain.style.transform = '';
            }, 150);
        }

        // ============ 提取emoji ============
        function extractEmoji(item) {
            const match = item.match(/[\p{Emoji}]/u);
            return match ? match[0] : '🍽️';
        }

        // ============ 显示结果 ============
        function showResult(item) {
            resultPlaceholder.style.display = 'none';
            resultText.style.display = 'block';
            resultSub.style.display = 'block';
            resultText.textContent = '👉 ' + item;
            resultSub.textContent = funnyComments[Math.floor(Math.random() * funnyComments.length)];
            resultText.classList.remove('pop');
            void resultText.offsetWidth;
            resultText.classList.add('pop');
        }

        function showTempResult(emoji, msg) {
            resultPlaceholder.style.display = 'none';
            resultText.style.display = 'block';
            resultSub.style.display = 'block';
            resultText.textContent = emoji + ' ' + msg;
            resultSub.textContent = '';
            resultText.classList.remove('pop');
            void resultText.offsetWidth;
            resultText.classList.add('pop');
        }

        // ============ 历史记录 ============
        function addToHistory(item) {
            todayHistory.unshift(item);
            if (todayHistory.length > 8) todayHistory = todayHistory.slice(0, 8);
            localStorage.setItem('eatwhat_history', JSON.stringify(todayHistory));
            renderHistory();
        }

        function renderHistory() {
            historyTags.innerHTML = '';
            if (todayHistory.length > 0) {
                historyLabel.style.display = 'block';
                todayHistory.forEach((item, i) => {
                    const tag = document.createElement('span');
                    tag.className = 'history-tag';
                    tag.textContent = item;
                    tag.style.animationDelay = (i * 0.05) + 's';
                    historyTags.appendChild(tag);
                });
            } else {
                historyLabel.style.display = 'none';
            }
        }

        // ============ 菜单管理 ============
        function openMenu() {
            overlay.classList.add('active');
            renderMenu();
            setTimeout(() => {
                addInput.focus();
            }, 400);
        }

        function closeMenu() {
            overlay.classList.remove('active');
            addInput.value = '';
        }

        function renderMenu() {
            menuList.innerHTML = '';
            menu.forEach((item, index) => {
                const span = document.createElement('span');
                span.className = 'menu-item';
                span.innerHTML = item + ' <span class="delete-btn" onclick="deleteFood(' + index +
                    ', event)">×</span>';
                menuList.appendChild(span);
            });
        }

        function deleteFood(index, event) {
            event.stopPropagation();
            if (menu.length <= 1) {
                showTempResult('😅', '至少留一个选项吧～');
                return;
            }
            menu.splice(index, 1);
            saveMenu();
            renderMenu();
            if (menu.length === 0) {
                showTempResult('😅', '菜单空了，快添加吃的！');
            }
        }

        function addFood() {
            const val = addInput.value.trim();
            if (!val) return;
            if (menu.includes(val)) {
                showTempResult('🤔', '这个已经在菜单里啦～');
                addInput.value = '';
                return;
            }
            menu.push(val);
            saveMenu();
            renderMenu();
            addInput.value = '';
            addInput.focus();
        }

        function resetMenu() {
            menu = [...DEFAULT_MENU];
            saveMenu();
            renderMenu();
            showTempResult('✅', '菜单已恢复默认');
        }

        function saveMenu() {
            localStorage.setItem('eatwhat_menu', JSON.stringify(menu));
        }

        // ============ 键盘事件 ============
        addInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addFood();
            }
        });

        // 点击遮罩关闭
        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) {
                closeMenu();
            }
        });

        // ============ 初始渲染 ============
        renderHistory();
        renderMenu();

        // 如果今天有历史，显示最后一次结果
        if (todayHistory.length > 0) {
            showResult(todayHistory[0]);
            const emoji = extractEmoji(todayHistory[0]);
            foodEmoji.textContent = emoji;
        }

        console.log('🍽️ 「今天吃啥」- 选择困难症救星');
        console.log('   菜单数量：' + menu.length + ' 项');
        console.log('   今天已抽：' + todayHistory.length + ' 次');
        console.log('   点击大按钮开始，或按回车键添加菜单项 🎲');
    </script>
</body>
</html>
