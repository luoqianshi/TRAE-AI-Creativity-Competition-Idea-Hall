<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>节气厨房</title>
<style>
/* === 全局重置 === */
*{margin:0;padding:0;box-sizing:border-box}
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;600&display=swap');

body{
  font-family:'Noto Serif SC','SimSun',serif;
  background:#1a1a2e;
  color:#f5f5f5;
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#4a6741 0%,#7fa07a 15%,#c47830 30%,#e8a04c 45%,#8b5a2b 60%,#c9a96e 75%,#6b7b8c 90%,#4a5a6b 100%);
  opacity:0.15;
  z-index:0;
}
body::after{
  content:'';
  position:fixed;
  inset:0;
  background:radial-gradient(ellipse at center,transparent 0%,rgba(0,0,0,0.4) 100%);
  z-index:0;
  pointer-events:none;
}

.header{position:relative;z-index:1;text-align:center;padding:50px 20px 20px}
.header h1{
  font-family:'ZCOOL XiaoWei','楷体',serif;
  font-size:48px;
  background:linear-gradient(135deg,#e8d5b8,#c9a96e,#8b5a2b);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  letter-spacing:8px;
  margin-bottom:10px;
}
.header .subtitle{font-family:'ZCOOL XiaoWei',serif;font-size:18px;color:#c9a96e;letter-spacing:3px}
.track-badge{
  display:inline-block;
  margin-top:15px;
  padding:6px 20px;
  background:rgba(139,90,43,0.2);
  border:1px solid rgba(201,169,110,0.4);
  border-radius:20px;
  font-size:13px;
  color:#e8d5b8;
  letter-spacing:2px;
}

.main-area{
  position:relative;z-index:1;
  max-width:1200px;margin:20px auto;padding:20px;
  display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:start;
}

.wheel-section{display:flex;flex-direction:column;align-items:center}
.wheel-container{position:relative;width:400px;height:400px;margin:20px 0}
.wheel{position:absolute;inset:0;border-radius:50%;transition:transform 0.8s cubic-bezier(0.4,0,0.2,1);cursor:grab}
.wheel.dragging{cursor:grabbing;transition:none}
.wheel-outer-ring{
  position:absolute;inset:-15px;
  border:2px dashed rgba(201,169,110,0.3);
  border-radius:50%;
  animation:rotate 60s linear infinite;
}
@keyframes rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.wheel-center{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:140px;height:140px;
  background:radial-gradient(circle,rgba(139,90,43,0.3),rgba(26,26,46,0.8));
  border:2px solid rgba(201,169,110,0.4);
  border-radius:50%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:5;
  box-shadow:0 0 30px rgba(201,169,110,0.2);
}
.wheel-center .term-name{font-family:'ZCOOL XiaoWei',serif;font-size:28px;color:#e8d5b8;margin-bottom:5px}
.wheel-center .term-season{font-size:12px;color:#c9a96e;letter-spacing:2px}

.term-sector{
  position:absolute;width:50%;height:50%;top:0;left:0;
  transform-origin:bottom right;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all 0.3s;
}
.term-sector .term-label{
  position:absolute;
  font-family:'ZCOOL XiaoWei',serif;
  font-size:16px;color:#e8d5b8;
  white-space:nowrap;transition:all 0.3s;
}
.term-sector:hover .term-label{color:#ffd700;font-size:18px;text-shadow:0 0 10px rgba(255,215,0,0.5)}
.term-sector.active .term-label{color:#ffd700;font-size:20px;text-shadow:0 0 15px rgba(255,215,0,0.6)}

.wheel-controls{display:flex;gap:15px;margin-top:10px}
.wheel-btn{
  width:44px;height:44px;border-radius:50%;
  background:rgba(139,90,43,0.3);
  border:1px solid rgba(201,169,110,0.4);
  color:#e8d5b8;font-size:20px;cursor:pointer;
  transition:all 0.3s;
  display:flex;align-items:center;justify-content:center;
}
.wheel-btn:hover{background:rgba(139,90,43,0.5);transform:scale(1.1)}

.info-panel{display:flex;flex-direction:column;gap:15px}
.panel-title{
  font-family:'ZCOOL XiaoWei',serif;
  font-size:24px;color:#e8d5b8;letter-spacing:2px;
  padding-bottom:10px;
  border-bottom:1px solid rgba(201,169,110,0.2);
}

.ingredient-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ingredient-card{perspective:600px;height:100px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform 0.6s;transform-style:preserve-3d}
.ingredient-card.flipped .card-inner{transform:rotateY(180deg)}
.card-front,.card-back{
  position:absolute;inset:0;
  backface-visibility:hidden;
  border-radius:12px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:10px;
}
.card-front{
  background:linear-gradient(135deg,rgba(139,90,43,0.3),rgba(201,169,110,0.15));
  border:1px solid rgba(201,169,110,0.3);
}
.card-back{
  background:linear-gradient(135deg,rgba(201,169,110,0.3),rgba(139,90,43,0.2));
  border:1px solid rgba(201,169,110,0.4);
  transform:rotateY(180deg);
}
.card-emoji{font-size:32px;margin-bottom:5px}
.card-name{font-size:13px;color:#e8d5b8}
.card-desc{font-size:11px;color:#c9a96e;text-align:center;line-height:1.4}

.recipe-card{
  background:linear-gradient(135deg,rgba(139,90,43,0.25),rgba(201,169,110,0.1));
  border:1px solid rgba(201,169,110,0.25);
  border-radius:15px;padding:20px;position:relative;
}
.recipe-card h4{font-family:'ZCOOL XiaoWei',serif;font-size:20px;color:#ffd700;margin-bottom:10px}
.recipe-card .recipe-desc{font-size:13px;color:#c9a96e;line-height:1.7;margin-bottom:10px}
.recipe-card .recipe-tags{display:flex;flex-wrap:wrap;gap:6px}
.recipe-tag{padding:3px 10px;background:rgba(201,169,110,0.15);border-radius:12px;font-size:11px;color:#e8d5b8}

.constitution-box{background:rgba(26,26,46,0.5);border:1px solid rgba(201,169,110,0.2);border-radius:15px;padding:15px}
.constitution-box select{
  width:100%;padding:8px 12px;
  background:rgba(139,90,43,0.2);
  border:1px solid rgba(201,169,110,0.3);
  color:#e8d5b8;font-size:13px;outline:none;
  border-radius:8px;cursor:pointer;
}
.constitution-box select option{background:#1a1a2e;color:#e8d5b8}
.constitution-tip{margin-top:10px;font-size:12px;color:#c9a96e;line-height:1.6}

.info-section{
  position:relative;z-index:1;
  max-width:1200px;margin:30px auto;padding:0 20px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:20px;
}
.info-card{
  background:linear-gradient(135deg,rgba(139,90,43,0.15),rgba(26,26,46,0.5));
  border:1px solid rgba(201,169,110,0.2);
  border-radius:15px;padding:25px;transition:all 0.3s;
}
.info-card:hover{border-color:rgba(201,169,110,0.4);transform:translateY(-3px)}
.info-card h3{font-family:'ZCOOL XiaoWei',serif;font-size:20px;color:#c9a96e;margin-bottom:12px;letter-spacing:2px}
.info-card p{font-size:13px;color:#e8d5b8;line-height:1.8}
.info-card .tag-list{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.info-card .tag{padding:3px 10px;background:rgba(201,169,110,0.1);border-radius:12px;font-size:11px;color:#c9a96e}

.footer{position:relative;z-index:1;text-align:center;padding:30px;color:rgba(201,169,110,0.4);font-size:12px}

@media(max-width:768px){
  .main-area{grid-template-columns:1fr}
  .info-section{grid-template-columns:1fr}
  .wheel-container{width:300px;height:300px}
  .header h1{font-size:32px}
}
</style>
</head>
<body>
<header class="header">
<h1>节气厨房</h1>
<p class="subtitle">—— 顺时而食，应季而养 ——</p>
</header>
<main class="main-area">
<section class="wheel-section">
<div class="wheel-container">
<div class="wheel-outer-ring"></div>
<div class="wheel" id="wheel"></div>
<div class="wheel-center">
<div class="term-name" id="termName">小暑</div>
<div class="term-season" id="termSeason">夏 · 第11节气</div>
</div>
</div>
<div class="wheel-controls">
<button class="wheel-btn" onclick="rotateWheel(-1)">←</button>
<button class="wheel-btn" onclick="rotateWheel(1)">→</button>
</div>
</section>
<section class="info-panel">
<h2 class="panel-title">应季食材</h2>
<div class="ingredient-grid" id="ingredientGrid"></div>
<h2 class="panel-title">节气食谱</h2>
<div class="recipe-card" id="recipeCard">
<h4 id="recipeName">荷叶冬瓜汤</h4>
<p class="recipe-desc" id="recipeDesc">清热解暑，利尿消肿。小暑时节湿气重，冬瓜利水，荷叶清香，是消夏良品。</p>
<div class="recipe-tags" id="recipeTags">
<span class="recipe-tag">清热</span>
<span class="recipe-tag">解暑</span>
<span class="recipe-tag">利湿</span>
</div>
</div>
<h2 class="panel-title">体质定制</h2>
<div class="constitution-box">
<select id="constitutionSelect" onchange="updateConstitution()">
<option value="平和">平和体质 - 阴阳调和</option>
<option value="气虚">气虚体质 - 易疲乏</option>
<option value="阳虚">阳虚体质 - 怕冷</option>
<option value="阴虚">阴虚体质 - 易口干</option>
<option value="湿热">湿热体质 - 易长痘</option>
</select>
<p class="constitution-tip" id="constitutionTip">小暑时节，平和体质宜清淡饮食，适量食用瓜果，避免过于寒凉。</p>
</div>
</section>
</main>
<script>

const terms = [
  {name:'立春',season:'春',idx:1,ingredients:[{e:'🌱',n:'春笋',d:'清热化痰'},{e:'🥬',n:'韭菜',d:'温中补阳'},{e:'🌿',n:'香菜',d:'发汗透疹'}],recipe:{name:'春笋炒韭菜',desc:'立春时节，春笋鲜嫩，韭菜补阳。二者同炒，寓意迎春纳福，是立春传统美食。',tags:['补阳','清热','迎春']}},
  {name:'雨水',season:'春',idx:2,ingredients:[{e:'🥗',n:'荠菜',d:'凉血止血'},{e:'🍯',n:'蜂蜜',d:'润肠通便'},{e:'🫐',n:'桑葚',d:'滋阴补血'}],recipe:{name:'荠菜蜂蜜茶',desc:'雨水时节湿气渐重，荠菜清热利湿，蜂蜜润燥，适合初春饮用。',tags:['利湿','润燥','清热']}},
  {name:'惊蛰',season:'春',idx:3,ingredients:[{e:'🍐',n:'梨',d:'润肺止咳'},{e:'🥚',n:'鸡蛋',d:'滋阴润燥'},{e:'🧄',n:'蒜苗',d:'杀菌防感'}],recipe:{name:'冰糖炖雪梨',desc:'惊蛰万物复苏，梨润肺止咳，预防春燥。加入冰糖枸杞，滋阴养肺。',tags:['润肺','止咳','滋阴']}},

  {name:'小雪',season:'冬',idx:20,ingredients:[{e:'🥬',n:'白菜',d:'清热解毒'},{e:'🫘',n:'黑豆',d:'补肾活血'},{e:'🥓',n:'腊肉',d:'补充能量'}],recipe:{name:'黑豆白菜汤',desc:'小雪天气寒冷，黑豆补肾，白菜清内热。荤素搭配，平衡营养。',tags:['补肾','清热','平衡']}},
  {name:'大雪',season:'冬',idx:21,ingredients:[{e:'🥩',n:'牛肉',d:'补中益气'},{e:'🍠',n:'山药',d:'健脾补肺'},{e:'🫚',n:'生姜',d:'温中散寒'}],recipe:{name:'山药牛肉粥',desc:'大雪严寒，山药健脾，牛肉补气。煮粥温补，养胃暖身。',tags:['健脾','补气','温补']}},
  {name:'冬至',season:'冬',idx:22,ingredients:[{e:'🥟',n:'饺子',d:'补气养身'},{e:'🫘',n:'赤豆',d:'利水消肿'},{e:'🍯',n:'蜂蜜',d:'润肠通便'}],recipe:{name:'赤豆糯米饭',desc:'冬至吃饺子，赤豆祛湿。糯米温补，是冬至传统食俗。',tags:['温补','祛湿','养身']}},
  {name:'小寒',season:'冬',idx:23,ingredients:[{e:'🥣',n:'八宝粥',d:'补气养血'},{e:'🐔',n:'鸡肉',d:'温中益气'},{e:'🌰',n:'板栗',d:'健脾养胃'}],recipe:{name:'板栗炖鸡',desc:'小寒最冷时节，鸡肉温补，板栗健脾。炖汤暖身，补充能量。',tags:['温补','健脾','暖身']}},
  {name:'大寒',season:'冬',idx:24,ingredients:[{e:'🥩',n:'羊肉',d:'温补壮阳'},{e:'🥬',n:'萝卜',d:'下气消食'},{e:'🍵',n:'红枣茶',d:'补中益气'}],recipe:{name:'萝卜羊肉汤',desc:'大寒迎春，羊肉温补，萝卜消食。一碗热汤，驱散冬日严寒。',tags:['温补','消食','驱寒']}},
];

let currentTermIdx = 10;
let wheelRotation = 0;

// === 初始化轮盘 ===
function initWheel(){
  const wheel = document.getElementById('wheel');
  wheel.innerHTML = '';
  terms.forEach((t,i)=>{
    const sector = document.createElement('div');
    sector.className = 'term-sector' + (i===currentTermIdx ? ' active' : '');
    const angle = i * 15;
    sector.style.transformOrigin = 'bottom right';
    sector.style.transform = 'rotate(' + angle + 'deg)';
    sector.innerHTML = '<span class="term-label" style="position:absolute;top:35px;left:25px;transform:rotate(' + (angle>180?angle-360:angle) + 'deg)">' + t.name + '</span>';
    sector.onclick = function(){ selectTerm(i); };
    wheel.appendChild(sector);
  });
  updateTermDisplay();
}

// === 选中节气 ===
function selectTerm(idx){
  currentTermIdx = idx;
  wheelRotation = -idx * 15;
  document.getElementById('wheel').style.transform = 'rotate(' + wheelRotation + 'deg)';
  document.querySelectorAll('.term-sector').forEach(function(s,i){
    if(i===idx) s.classList.add('active');
    else s.classList.remove('active');
  });
  updateTermDisplay();
}

// === 旋转轮盘 ===
function rotateWheel(dir){
  currentTermIdx = (currentTermIdx + dir + 24) % 24;
  selectTerm(currentTermIdx);
}

// === 更新节气显示 ===
function updateTermDisplay(){
  var t = terms[currentTermIdx];
  document.getElementById('termName').textContent = t.name;
  document.getElementById('termSeason').textContent = t.season + ' · 第' + t.idx + '节气';
  
  var grid = document.getElementById('ingredientGrid');
  grid.innerHTML = '';
  t.ingredients.forEach(function(ing){
    var card = document.createElement('div');
    card.className = 'ingredient-card';
    card.onclick = function(){ card.classList.toggle('flipped'); };
    card.innerHTML = 
      '<div class="card-inner">' +
        '<div class="card-front">' +
          '<div class="card-emoji">' + ing.e + '</div>' +
          '<div class="card-name">' + ing.n + '</div>' +
        '</div>' +
        '<div class="card-back">' +
          '<div class="card-desc">' + ing.d + '</div>' +
        '</div>' +
      '</div>';
    grid.appendChild(card);
  });

  document.getElementById('recipeName').textContent = t.recipe.name;
  document.getElementById('recipeDesc').textContent = t.recipe.desc;
  document.getElementById('recipeTags').innerHTML = t.recipe.tags.map(function(tag){
    return '<span class="recipe-tag">' + tag + '</span>';
  }).join('');

  updateConstitution();
}

// === 体质定制 ===
function updateConstitution(){
  var type = document.getElementById('constitutionSelect').value;
  var t = terms[currentTermIdx];
  var tips = {
    '平和': t.name + '时节，平和体质宜清淡饮食，适量食用应季食材，保持阴阳平衡。',
    '气虚': t.name + '时节，气虚体质宜温补，可多食山药、红枣等补气食材，避免生冷。',
    '阳虚': t.name + '时节，阳虚体质怕冷，宜食温热食物，如羊肉、生姜，忌寒凉。',
    '阴虚': t.name + '时节，阴虚体质易口干，宜食滋阴润燥之品，如银耳、百合、梨。',
    '湿热': t.name + '时节，湿热体质易长痘，宜清热利湿，多食薏米、冬瓜，少油腻。'
  };
  document.getElementById('constitutionTip').textContent = tips[type];
}

// === 拖拽旋转 ===
var isDragging = false;
var startAngle = 0;
var wheel = document.getElementById('wheel');

wheel.addEventListener('mousedown', function(e){
  isDragging = true;
  wheel.classList.add('dragging');
  var rect = wheel.getBoundingClientRect();
  var cx = rect.left + rect.width/2;
  var cy = rect.top + rect.height/2;
  startAngle = Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI - wheelRotation;
});

document.addEventListener('mousemove', function(e){
  if(!isDragging) return;
  var rect = wheel.getBoundingClientRect();
  var cx = rect.left + rect.width/2;
  var cy = rect.top + rect.height/2;
  var angle = Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI;
  wheelRotation = angle - startAngle;
  wheel.style.transform = 'rotate(' + wheelRotation + 'deg)';
});

document.addEventListener('mouseup', function(){
  if(!isDragging) return;
  isDragging = false;
  wheel.classList.remove('dragging');
  var snapped = Math.round(wheelRotation / 15) * 15;
  var idx = ((Math.round(-snapped / 15)) % 24 + 24) % 24;
  selectTerm(idx);
});

// === 初始化 ===
initWheel();
</script>
