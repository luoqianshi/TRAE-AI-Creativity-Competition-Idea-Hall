<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文献智拆 - 科研文献结构化精读助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 自定义滚动条样式 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* 加载动画 */
        .loading-dot {
            animation: loading 1.4s infinite ease-in-out both;
        }
        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes loading {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">
    <!-- 顶部导航栏 -->
    <header class="bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                </div>
                <h1 class="text-xl font-bold text-slate-800">文献智拆</h1>
                <span class="text-xs text-slate-500 bg-slate-100 px-2 py-0.5 rounded">科研文献结构化精读助手</span>
            </div>
            <div class="flex items-center gap-4 text-sm text-slate-600">
                <span>使用指南</span>
                <span>反馈建议</span>
            </div>
        </div>
    </header>

    <!-- 主体内容区 -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-6 flex gap-6">
        <!-- 左侧：文献输入区 -->
        <section class="w-2/5 flex flex-col gap-4">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex-1 flex flex-col">
                <h2 class="text-lg font-semibold text-slate-800 mb-3">文献输入</h2>
                <p class="text-sm text-slate-500 mb-4">粘贴文献摘要/正文内容，或上传文本文件，一键拆解核心信息</p>
                
                <textarea 
                    id="paperInput"
                    class="flex-1 w-full border border-slate-200 rounded-lg p-3 text-sm text-slate-700 resize-none focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent custom-scrollbar"
                    placeholder="请粘贴文献摘要或正文片段...&#10;&#10;示例：针对工业设备故障诊断中异构工况下数据分布差异导致模型泛化性差的问题，本文提出一种个性化联邦学习方法，通过注意力机制提取域不变特征，结合个性化适配层实现不同工况下的故障分类。在公开数据集上的实验表明，该方法相比基线模型准确率提升了8.7%，同时保护了设备数据隐私。"
                    rows="18"
                ></textarea>

                <div class="mt-4 flex items-center gap-3">
                    <label class="flex-1 flex items-center justify-center gap-2 py-2.5 border border-dashed border-slate-300 rounded-lg text-sm text-slate-500 cursor-pointer hover:bg-slate-50 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                        </svg>
                        上传文本/PDF文件
                        <input type="file" class="hidden" accept=".txt,.pdf">
                    </label>
                </div>

                <div class="mt-4 flex gap-3">
                    <button 
                        id="analyzeBtn"
                        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                        </svg>
                        开始智能拆解
                    </button>
                    <button 
                        id="clearBtn"
                        class="px-4 py-2.5 border border-slate-200 text-slate-600 rounded-lg hover:bg-slate-50 transition-colors"
                    >
                        清空
                    </button>
                </div>
            </div>
        </section>

        <!-- 右侧：结果展示区 -->
        <section class="w-3/5 flex flex-col gap-4">
            <div class="flex items-center justify-between">
                <h2 class="text-lg font-semibold text-slate-800">拆解结果</h2>
                <div class="text-xs text-slate-500">标准四维度结构化输出</div>
            </div>

            <div id="resultContainer" class="flex-1 flex flex-col gap-4">
                <!-- 空状态 -->
                <div id="emptyState" class="flex-1 bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col items-center justify-center text-slate-400 p-10">
                    <svg class="w-16 h-16 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    <p class="text-sm">输入文献内容后，点击「开始智能拆解」</p>
                    <p class="text-xs mt-1">将自动生成结构化的文献核心信息</p>
                </div>

                <!-- 加载状态 -->
                <div id="loadingState" class="hidden flex-1 bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col items-center justify-center p-10">
                    <div class="flex gap-1 mb-4">
                        <div class="w-2 h-2 bg-blue-600 rounded-full loading-dot"></div>
                        <div class="w-2 h-2 bg-blue-600 rounded-full loading-dot"></div>
                        <div class="w-2 h-2 bg-blue-600 rounded-full loading-dot"></div>
                    </div>
                    <p class="text-sm text-slate-500">正在分析文献逻辑，提取核心信息...</p>
                </div>

                <!-- 结果卡片 -->
                <div id="resultCards" class="hidden flex flex-col gap-4 h-full overflow-y-auto custom-scrollbar pr-1">
                    <!-- 卡片1：研究背景与问题 -->
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                        <div class="flex items-center gap-2 mb-3">
                            <div class="w-1.5 h-5 bg-blue-600 rounded-full"></div>
                            <h3 class="font-semibold text-slate-800">研究背景与问题</h3>
                        </div>
                        <p id="res1" class="text-sm text-slate-600 leading-relaxed"></p>
                    </div>

                    <!-- 卡片2：核心创新点 -->
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                        <div class="flex items-center gap-2 mb-3">
                            <div class="w-1.5 h-5 bg-emerald-600 rounded-full"></div>
                            <h3 class="font-semibold text-slate-800">核心创新点</h3>
                        </div>
                        <div id="res2" class="text-sm text-slate-600 leading-relaxed"></div>
                    </div>

                    <!-- 卡片3：实验方法与结论 -->
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                        <div class="flex items-center gap-2 mb-3">
                            <div class="w-1.5 h-5 bg-amber-600 rounded-full"></div>
                            <h3 class="font-semibold text-slate-800">实验方法与结论</h3>
                        </div>
                        <p id="res3" class="text-sm text-slate-600 leading-relaxed"></p>
                    </div>

                    <!-- 卡片4：研究局限与展望 -->
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                        <div class="flex items-center gap-2 mb-3">
                            <div class="w-1.5 h-5 bg-rose-600 rounded-full"></div>
                            <h3 class="font-semibold text-slate-800">研究局限与展望</h3>
                        </div>
                        <p id="res4" class="text-sm text-slate-600 leading-relaxed"></p>
                    </div>
                </div>
            </div>

            <!-- 底部操作栏 -->
            <div id="actionBar" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex items-center justify-between">
                <div class="text-xs text-slate-500">拆解完成，可进行后续操作</div>
                <div class="flex gap-3">
                    <button class="flex items-center gap-1.5 px-4 py-2 text-sm border border-slate-200 text-slate-600 rounded-lg hover:bg-slate-50 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                        </svg>
                        多篇对比
                    </button>
                    <button class="flex items-center gap-1.5 px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        导出笔记
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="border-t border-slate-200 bg-white py-3">
        <div class="max-w-7xl mx-auto px-6 text-center text-xs text-slate-400">
            文献智拆 · TRAE AI创造力大赛参赛作品
        </div>
    </footer>

    <script>
        const analyzeBtn = document.getElementById('analyzeBtn');
        const clearBtn = document.getElementById('clearBtn');
        const paperInput = document.getElementById('paperInput');
        const emptyState = document.getElementById('emptyState');
        const loadingState = document.getElementById('loadingState');
        const resultCards = document.getElementById('resultCards');
        const actionBar = document.getElementById('actionBar');

        // 示例拆解结果（联邦故障诊断方向）
        const demoResult = {
            background: "工业设备故障诊断是保障工业生产安全与效率的核心环节，但实际生产中设备运行工况复杂多变，不同工况下采集的故障数据存在显著的分布差异（域偏移问题），导致单一诊断模型在异构工况下泛化性能大幅下降。同时，工业场景中设备数据涉及企业生产隐私，难以集中多设备数据进行联合训练，传统集中式深度学习方法面临数据孤岛与隐私合规的双重挑战。",
            innovation: [
                "提出一种基于注意力机制的域不变特征提取模块，自动挖掘不同工况下共享的故障本质特征，弱化工况相关的冗余信息，缓解域偏移带来的性能衰减。",
                "设计个性化联邦适配层，在联邦学习框架下为每个工况设备保留专属分类头，既实现全局故障知识的共享，又兼顾不同工况的个性化差异。",
                "引入梯度裁剪与差分隐私机制，在联邦训练过程中保护设备本地数据隐私，满足工业数据安全合规要求。"
            ],
            conclusion: "方法在CWRU轴承故障公开数据集的3种异构工况下进行验证，对比FedAvg、DANN等5种基线方法，平均故障诊断准确率提升8.7%，在工况差异最大的场景下准确率提升可达12.3%。同时模型训练收敛速度提升15%，通信开销降低约20%，验证了方法在异构工况下的有效性与工程实用性。",
            limitation: "当前研究仅在轴承故障数据集上进行验证，对于齿轮、电机等更多类型工业设备的适配性有待进一步验证；极端小样本工况下的个性化适配效果仍有提升空间。未来工作将扩展多设备多故障类型的通用诊断框架，并结合小样本学习进一步优化少数据工况下的诊断性能。"
        };

        // 点击拆解按钮
        analyzeBtn.addEventListener('click', () => {
            const content = paperInput.value.trim();
            if (!content) {
                alert('请先输入文献内容');
                return;
            }

            // 切换加载状态
            emptyState.classList.add('hidden');
            resultCards.classList.add('hidden');
            actionBar.classList.add('hidden');
            loadingState.classList.remove('hidden');

            // 模拟AI分析过程
            setTimeout(() => {
                // 填充结果内容
                document.getElementById('res1').textContent = demoResult.background;
                
                const innovationHtml = demoResult.innovation.map(item => 
                    `<div class="flex gap-2 mb-2 last:mb-0">
                        <span class="text-emerald-600 font-bold mt-0.5">•</span>
                        <span>${item}</span>
                    </div>`
                ).join('');
                document.getElementById('res2').innerHTML = innovationHtml;

                document.getElementById('res3').textContent = demoResult.conclusion;
                document.getElementById('res4').textContent = demoResult.limitation;

                // 展示结果
                loadingState.classList.add('hidden');
                resultCards.classList.remove('hidden');
                actionBar.classList.remove('hidden');
            }, 1800);
        });

        // 清空按钮
        clearBtn.addEventListener('click', () => {
            paperInput.value = '';
            resultCards.classList.add('hidden');
            actionBar.classList.add('hidden');
            loadingState.classList.add('hidden');
            emptyState.classList.remove('hidden');
        });
    </script>
</body>
</html>
