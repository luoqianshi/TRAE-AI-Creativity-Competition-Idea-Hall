<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>爸妈的向导卡 - 微信语音通话</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#07C160',
            'brand-dark': '#06ad56',
            'brand-light': '#E8F8EE',
            alipay: '#1677FF',
            amap: '#0091FF'
          },
          fontFamily: {
            sans: ['PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dom-to-image-more@3.3.6/dist/dom-to-image-more.min.js"></script>
  <style>
    .step-arrow-down {
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 18px solid #07C160;
      margin: 12px auto;
      animation: bounceDown 1.5s infinite;
    }
    
    .step-arrow-right {
      width: 0;
      height: 0;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-left: 16px solid #07C160;
      animation: bounceRight 1.5s infinite;
    }
    
    @keyframes bounceDown {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }
    
    @keyframes bounceRight {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(6px); }
    }
    
    .step-card {
      transition: all 0.3s ease;
    }
    
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

    @media print {
      .no-print { display: none !important; }
      .print-area { display: block !important; }
      body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
    .print-area { display: none; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans" x-data="guideCardApp()" x-init="init()">

  <!-- 配置界面（打印时隐藏） -->
  <div class="no-print">
  
  <!-- 顶部导航 -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-[1600px] mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-brand rounded-xl flex items-center justify-center text-white text-2xl shadow-lg">
          🎴
        </div>
        <div>
          <h1 class="text-2xl font-bold text-gray-900">爸妈的向导卡</h1>
          <p class="text-sm text-gray-500">一卡一步，照着做就会</p>
        </div>
      </div>
      <div class="text-sm text-gray-500 hidden md:block">
        TRAE AI 创造力大赛 · 社会公益 · 智慧助老
      </div>
    </div>
  </header>

  <!-- 主体内容 -->
  <main class="max-w-[1600px] mx-auto w-full p-6">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- 左侧：应用分类 -->
      <div class="lg:col-span-2">
        <div class="bg-white rounded-2xl shadow-sm p-4 sticky top-24">
          <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4">应用</h2>
          <div class="space-y-2">
            <template x-for="(app, id) in apps" :key="id">
              <button 
                @click="selectApp(id)"
                class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200"
                :class="selectedAppId === id ? 'bg-brand/10 text-brand ring-2 ring-brand/30' : 'hover:bg-gray-50 text-gray-700'"
              >
                <span class="text-2xl" x-text="app.icon"></span>
                <span class="font-medium" x-text="app.name"></span>
              </button>
            </template>
          </div>
        </div>
      </div>

      <!-- 中间：场景选择 -->
      <div class="lg:col-span-3">
        <div class="bg-white rounded-2xl shadow-sm p-5 sticky top-24">
          <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4">场景</h2>
          <div class="space-y-2">
            <template x-for="(scenario, id) in currentApp.scenarios" :key="id">
              <button
                @click="selectScenario(id)"
                class="w-full px-4 py-3.5 rounded-xl border-2 text-left transition-all duration-200 flex items-center justify-between"
                :class="selectedScenarioId === id ? 'border-brand bg-brand/5 text-brand' : 'border-gray-100 hover:border-gray-300 hover:bg-gray-50'"
              >
                <span class="font-semibold" x-text="scenario.name"></span>
                <span 
                  class="text-xs px-2 py-1 rounded-full font-medium"
                  :class="scenario.status === 'active' ? 'bg-brand text-white' : 'bg-gray-100 text-gray-500'"
                  x-text="scenario.status === 'active' ? '已上线' : '待实现'"
                ></span>
              </button>
            </template>
          </div>
          
          <div class="mt-5 p-3 bg-blue-50 border border-blue-100 rounded-xl">
            <p class="text-xs text-blue-700 leading-relaxed">
              💡 当前仅"微信 → 语音通话"完整实现，其他场景将陆续上线。
            </p>
          </div>
        </div>
      </div>

      <!-- 右侧：预览区 -->
      <div class="lg:col-span-7">
        <div class="bg-white rounded-2xl shadow-sm p-6 min-h-[600px]">
          
          <!-- 标题和操作按钮 -->
          <div class="flex items-center justify-between mb-6">
            <div>
              <div class="flex items-center gap-2 text-sm text-gray-500 mb-1">
                <span x-text="currentApp.icon"></span>
                <span x-text="currentApp.name"></span>
                <span>/</span>
                <span x-text="currentScenario?.name"></span>
              </div>
              <h2 class="text-2xl font-bold text-gray-900" x-text="isActive ? '跟着步骤做' : '功能待实现'"></h2>
            </div>
            <div x-show="isActive" class="flex gap-2">
              <button 
                @click="exportFlow()" 
                class="px-4 py-2 bg-brand text-white rounded-lg font-medium hover:bg-brand-dark transition-colors shadow-sm"
              >
                💾 导出 PNG
              </button>
              <button 
                @click="preparePrint()" 
                class="px-4 py-2 border-2 border-gray-300 text-gray-700 rounded-lg font-medium hover:border-gray-400 transition-colors"
              >
                🖨️ 打印
              </button>
            </div>
          </div>

          <!-- 已实现：步骤流程图 -->
          <template x-if="isActive">
            <div id="flow-preview" class="bg-gray-50 rounded-2xl p-6 border border-gray-200">
              <div class="text-center mb-5">
                <div class="inline-block px-5 py-2 bg-white rounded-full shadow-sm border border-gray-200">
                  <span class="text-brand font-bold text-lg" x-text="`${currentApp.name} · ${currentScenario?.name}`"></span>
                </div>
              </div>
              
              <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 relative">
                <template x-for="(step, index) in (currentScenario?.steps || [])" :key="index">
                  <div class="relative">
                    <!-- 步骤卡片 -->
                    <div class="step-card bg-white rounded-2xl border-2 border-brand shadow-lg overflow-hidden h-full">
                      <div class="px-4 py-3 border-b border-gray-100 bg-brand-light flex items-center gap-3">
                        <div 
                          class="w-8 h-8 rounded-full flex items-center justify-center text-white font-bold text-sm shadow-sm"
                          :style="`background-color: ${currentApp.color}`"
                          x-text="index + 1"
                        ></div>
                        <h3 class="text-lg font-bold text-gray-900" x-text="step.title"></h3>
                      </div>
                      <div class="p-4">
                        <div class="aspect-[4/3] rounded-xl overflow-hidden bg-gray-50 border border-gray-200 flex items-center justify-center mb-3" x-html="step.svg"></div>
                        <p class="text-base text-gray-700 leading-relaxed" x-text="step.desc"></p>
                      </div>
                    </div>
                    
                    <!-- 桌面端横向箭头：非第3列且非最后一个 -->
                    <div 
                      x-show="index % 3 !== 2 && index < (currentScenario?.steps?.length || 0) - 1" 
                      class="hidden lg:block absolute -right-2 top-1/2 transform -translate-y-1/2 translate-x-1/2 z-10"
                    >
                      <div class="step-arrow-right"></div>
                    </div>
                    
                    <!-- 桌面端向下箭头：第3列且非最后一个 -->
                    <div 
                      x-show="index % 3 === 2 && index < (currentScenario?.steps?.length || 0) - 1" 
                      class="hidden lg:block absolute left-1/2 -bottom-2 transform -translate-x-1/2 translate-y-1/2 z-10"
                    >
                      <div class="step-arrow-down"></div>
                    </div>
                    
                    <!-- 移动端向下箭头 -->
                    <div 
                      x-show="index < (currentScenario?.steps?.length || 0) - 1" 
                      class="lg:hidden flex justify-center my-3"
                    >
                      <div class="step-arrow-down"></div>
                    </div>
                  </div>
                </template>
              </div>
              
              <div class="mt-6 text-center text-sm text-gray-500">
                按顺序从左到右、从上到下操作，即可完成任务
              </div>
            </div>
          </template>

          <!-- 待实现提示 -->
          <template x-if="!isActive">
            <div class="flex flex-col items-center justify-center py-16 text-center">
              <div class="text-6xl mb-4">🚧</div>
              <h3 class="text-2xl font-bold text-gray-800 mb-2">
                「<span x-text="currentApp.name"></span> · <span x-text="currentScenario?.name"></span>」正在开发中
              </h3>
              <p class="text-gray-500 max-w-md mb-6">
                该功能将参照真实 App 界面，为老人提供一步一图的操作指引。敬请期待！
              </p>
              <div class="bg-yellow-50 border border-yellow-200 rounded-xl p-4 max-w-md">
                <p class="text-sm text-yellow-800">
                  当前可体验：<span class="font-bold text-brand">微信 → 语音通话</span>
                </p>
              </div>
            </div>
          </template>
          
        </div>
      </div>
    </div>
  </main>
  </div>
  <!-- /配置界面 -->

  <!-- 打印区域（屏幕时隐藏，打印时显示） -->
  <div class="print-area">
    <div class="p-8">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-gray-900" x-text="`${currentApp.name} · ${currentScenario?.name}`"></h1>
        <p class="text-gray-500 mt-1">爸妈的向导卡 · 一卡一步照着做</p>
      </div>
      <div id="print-flow" class="max-w-4xl mx-auto"></div>
      <div class="text-center text-sm text-gray-400 mt-8">
        打印后贴在老人容易看到的地方
      </div>
    </div>
  </div>

  <script>
    // 微信语音通话步骤配图（SVG 模拟真实 App 界面）
    const SVG_OPEN_WECHAT = `<svg viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
      <rect x="0" y="0" width="240" height="180" fill="#f5f5f5"/>
      <text x="120" y="30" text-anchor="middle" font-size="14" fill="#999">手机桌面</text>
      <rect x="85" y="50" width="70" height="90" rx="16" fill="#fff" stroke="#ddd" stroke-width="2"/>
      <circle cx="120" cy="85" r="24" fill="#07C160"/>
      <ellipse cx="108" cy="82" rx="8" ry="6" fill="#fff"/>
      <ellipse cx="132" cy="82" rx="8" ry="6" fill="#fff"/>
      <circle cx="112" cy="82" r="2" fill="#07C160"/>
      <circle cx="128" cy="82" r="2" fill="#07C160"/>
      <path d="M105 95 Q120 105 135 95" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text x="120" y="130" text-anchor="middle" font-size="12" fill="#333">微信</text>
      <circle cx="165" cy="55" r="10" fill="#ff4d4f"/>
      <text x="165" y="59" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">3</text>
    </svg>`;

    const SVG_CHAT_LIST = `<svg viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
      <rect x="0" y="0" width="240" height="180" fill="#ededed"/>
      <rect x="0" y="0" width="240" height="40" fill="#ededed"/>
      <text x="120" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">微信</text>
      <rect x="10" y="48" width="220" height="52" rx="8" fill="#fff"/>
      <circle cx="42" cy="74" r="18" fill="#ffe4b5"/>
      <text x="42" y="79" text-anchor="middle" font-size="14">👧</text>
      <text x="72" y="68" font-size="14" font-weight="bold" fill="#333">女儿</text>
      <text x="72" y="88" font-size="12" fill="#999">晚上回来吃饭吗？</text>
      <text x="210" y="66" text-anchor="end" font-size="11" fill="#999">10:23</text>
      <rect x="10" y="106" width="220" height="52" rx="8" fill="#fff" opacity="0.6"/>
      <circle cx="42" cy="132" r="18" fill="#d4edda"/>
      <text x="42" y="137" text-anchor="middle" font-size="14">👦</text>
      <text x="72" y="126" font-size="14" font-weight="bold" fill="#666">儿子</text>
      <text x="72" y="146" font-size="12" fill="#999">周末回家</text>
      <rect x="10" y="48" width="220" height="52" rx="8" fill="none" stroke="#07C160" stroke-width="3"/>
    </svg>`;

    const SVG_CHAT_WINDOW = `<svg viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
      <rect x="0" y="0" width="240" height="180" fill="#ededed"/>
      <rect x="0" y="0" width="240" height="42" fill="#ededed"/>
      <text x="120" y="27" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">女儿</text>
      <rect x="10" y="55" width="160" height="38" rx="6" fill="#fff"/>
      <text x="22" y="79" font-size="13" fill="#333">晚上回来吃饭吗？</text>
      <rect x="70" y="105" width="160" height="38" rx="6" fill="#95ec69"/>
      <text x="82" y="129" font-size="13" fill="#333">回的，我大概 6 点到</text>
      <rect x="0" y="142" width="240" height="38" fill="#f7f7f7"/>
      <rect x="12" y="150" width="180" height="24" rx="4" fill="#fff" stroke="#ddd"/>
      <text x="22" y="166" font-size="12" fill="#999">说点什么...</text>
      <circle cx="212" cy="162" r="14" fill="#fff" stroke="#999" stroke-width="1.5"/>
      <rect x="205" y="161" width="14" height="2" fill="#666"/>
      <rect x="211" y="155" width="2" height="14" fill="#666"/>
      <circle cx="212" cy="162" r="18" fill="none" stroke="#07C160" stroke-width="3"/>
    </svg>`;

    const SVG_CALL_MENU = `<svg viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
      <rect x="0" y="0" width="240" height="180" fill="rgba(0,0,0,0.45)"/>
      <rect x="0" y="100" width="240" height="80" fill="#fff" rx="16"/>
      <line x1="0" y1="135" x2="240" y2="135" stroke="#eee"/>
      <line x1="80" y1="100" x2="80" y2="180" stroke="#eee"/>
      <line x1="160" y1="100" x2="160" y2="180" stroke="#eee"/>
      <text x="40" y="125" text-anchor="middle" font-size="11" fill="#666">相册</text>
      <text x="40" y="165" text-anchor="middle" font-size="11" fill="#666">拍摄</text>
      <text x="120" y="125" text-anchor="middle" font-size="11" fill="#666">位置</text>
      <text x="120" y="165" text-anchor="middle" font-size="11" fill="#666">红包</text>
      <text x="200" y="125" text-anchor="middle" font-size="11" fill="#666">文件</text>
      <rect x="170" y="142" width="60" height="34" rx="8" fill="#07C160"/>
      <text x="200" y="165" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">视频通话</text>
    </svg>`;

    const SVG_VOICE_CALL = `<svg viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
      <rect x="0" y="0" width="240" height="180" fill="rgba(0,0,0,0.5)"/>
      <rect x="40" y="35" width="160" height="110" rx="16" fill="#fff"/>
      <text x="120" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">选择通话方式</text>
      <rect x="55" y="80" width="55" height="50" rx="10" fill="#f5f5f5" stroke="#07C160" stroke-width="2"/>
      <text x="82" y="110" text-anchor="middle" font-size="22">📞</text>
      <text x="82" y="128" text-anchor="middle" font-size="11" fill="#07C160" font-weight="bold">语音通话</text>
      <rect x="130" y="80" width="55" height="50" rx="10" fill="#f5f5f5"/>
      <text x="157" y="110" text-anchor="middle" font-size="22">📹</text>
      <text x="157" y="128" text-anchor="middle" font-size="11" fill="#666">视频通话</text>
    </svg>`;

    // 应用与场景数据
    const APP_LIBRARY = {
      wechat: {
        id: 'wechat',
        name: '微信',
        icon: '💬',
        color: '#07C160',
        scenarios: {
          voice_call: {
            id: 'voice_call',
            name: '语音通话',
            status: 'active',
            steps: [
              {
                title: '打开微信',
                svg: SVG_OPEN_WECHAT,
                desc: '在手机桌面找到绿色图标的"微信"，用手指点一下打开。如果有红色数字角标，不用管它。'
              },
              {
                title: '找到要通话的人',
                svg: SVG_CHAT_LIST,
                desc: '在聊天列表里，找到你想通话的人（例如"女儿"），点一下进入聊天窗口。'
              },
              {
                title: '点击右下角"+"号',
                svg: SVG_CHAT_WINDOW,
                desc: '在聊天窗口的右下角，有一个"+"号按钮，用手指点一下。'
              },
              {
                title: '选择"视频通话"',
                svg: SVG_CALL_MENU,
                desc: '在弹出来的菜单里，找到并点击"视频通话"这个选项。'
              },
              {
                title: '选择"语音通话"',
                svg: SVG_VOICE_CALL,
                desc: '点击"语音通话"，然后把手机放到耳边，等待对方接听即可。'
              }
            ]
          },
          voice_msg: { id: 'voice_msg', name: '发送语音消息', status: 'pending' },
          video_call: { id: 'video_call', name: '视频通话', status: 'pending' },
          pay: { id: 'pay', name: '扫码支付', status: 'pending' },
          taxi: { id: 'taxi', name: '微信打车', status: 'pending' }
        }
      },
      alipay: {
        id: 'alipay',
        name: '支付宝',
        icon: '🔵',
        color: '#1677FF',
        scenarios: {
          pay: { id: 'pay', name: '扫码付款', status: 'pending' },
          health: { id: 'health', name: '出示健康码', status: 'pending' }
        }
      },
      phone: {
        id: 'phone',
        name: '手机系统',
        icon: '📱',
        color: '#333333',
        scenarios: {
          flashlight: { id: 'flashlight', name: '打开手电筒', status: 'pending' },
          volume: { id: 'volume', name: '调大音量', status: 'pending' },
          call: { id: 'call', name: '打电话', status: 'pending' }
        }
      },
      amap: {
        id: 'amap',
        name: '高德地图',
        icon: '🗺️',
        color: '#0091FF',
        scenarios: {
          taxi: { id: 'taxi', name: '打车回家', status: 'pending' }
        }
      }
    };

    function guideCardApp() {
      return {
        selectedAppId: 'wechat',
        selectedScenarioId: 'voice_call',

        init() {
          // 初始化时若当前场景无效，回退到当前应用的第一个场景
          if (!this.currentApp.scenarios[this.selectedScenarioId]) {
            this.selectedScenarioId = Object.keys(this.currentApp.scenarios)[0];
          }
        },

        get apps() { return APP_LIBRARY; },
        get currentApp() { return APP_LIBRARY[this.selectedAppId]; },
        get currentScenario() { 
          return this.currentApp.scenarios[this.selectedScenarioId] || this.currentApp.scenarios[Object.keys(this.currentApp.scenarios)[0]]; 
        },
        get isActive() { return this.currentScenario && this.currentScenario.status === 'active'; },

        selectApp(appId) {
          this.selectedAppId = appId;
          const scenarios = Object.keys(APP_LIBRARY[appId].scenarios);
          const active = scenarios.find(id => APP_LIBRARY[appId].scenarios[id].status === 'active');
          this.selectedScenarioId = active || scenarios[0];
        },

        selectScenario(scenarioId) {
          this.selectedScenarioId = scenarioId;
        },

        async exportFlow() {
          const node = document.getElementById('flow-preview');
          try {
            const dataUrl = await domtoimage.toPng(node, { 
              quality: 0.95, 
              bgcolor: '#ffffff',
              scale: 2
            });
            const link = document.createElement('a');
            link.download = `爸妈的向导卡-${this.currentApp.name}-${this.currentScenario?.name || '流程图'}.png`;
            link.href = dataUrl;
            link.click();
          } catch (err) {
            console.error('导出失败:', err);
            alert('导出图片失败，请重试');
          }
        },

        preparePrint() {
          const source = document.getElementById('flow-preview');
          const target = document.getElementById('print-flow');
          
          if (source && target) {
            const clone = source.cloneNode(true);
            clone.removeAttribute('id');
            target.innerHTML = '';
            target.appendChild(clone);
          }
          
          setTimeout(() => window.print(), 100);
        }
      }
    }
  </script>
</body>
