<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeReview AI - 代码错题与知识沉淀助手</title>
    <style>
        :root {
            --bg-primary: #0f1117;
            --bg-secondary: #161822;
            --bg-tertiary: #1c1f2e;
            --bg-card: #1e2133;
            --bg-input: #141725;
            --border: #2a2d3d;
            --border-active: #4f5bff;
            --text-primary: #e8eaf0;
            --text-secondary: #a0a5bb;
            --text-muted: #6b7089;
            --accent: #4f5bff;
            --accent-glow: rgba(79, 91, 255, 0.25);
            --accent-light: #7b83ff;
            --success: #34d399;
            --success-bg: rgba(52, 211, 153, 0.12);
            --warning: #fbbf24;
            --warning-bg: rgba(251, 191, 36, 0.12);
            --error: #f87171;
            --error-bg: rgba(248, 113, 113, 0.12);
            --info: #60a5fa;
            --info-bg: rgba(96, 165, 250, 0.12);
            --tag-js: #f7df1e;
            --tag-py: #3776ab;
            --tag-ts: #3178c6;
            --tag-java: #f89820;
            --tag-go: #00add8;
            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.45);
            --shadow-glow: 0 0 24px var(--accent-glow);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --font-mono: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
            --font-sans: 'Inter', 'SF Pro Display', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
            letter-spacing: 0.01em;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ============ SIDEBAR ============ */
        .sidebar {
            width: 240px;
            min-width: 240px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px 14px;
            gap: 6px;
            z-index: 10;
            user-select: none;
        }
        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px 20px;
            margin-bottom: 6px;
        }
        .sidebar-logo .logo-icon {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: var(--shadow-glow);
            flex-shrink: 0;
        }
        .sidebar-logo .logo-text {
            font-weight: 700;
            font-size: 15px;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            white-space: nowrap;
        }
        .sidebar-logo .logo-sub {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.03em;
        }
        .nav-section {
            margin-top: 8px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            padding: 0 10px;
            font-weight: 600;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-secondary);
            font-size: 13.5px;
            font-weight: 500;
            position: relative;
            text-decoration: none;
        }
        .nav-item:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }
        .nav-item.active {
            background: var(--bg-tertiary);
            color: #fff;
            font-weight: 600;
            box-shadow: inset 3px 0 0 var(--accent);
        }
        .nav-item .nav-icon {
            font-size: 17px;
            width: 22px;
            text-align: center;
            flex-shrink: 0;
        }
        .nav-item .nav-badge {
            margin-left: auto;
            background: var(--accent);
            color: #fff;
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 10px;
            font-weight: 600;
            min-width: 20px;
            text-align: center;
        }
        .sidebar-footer {
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .sidebar-footer .storage-info {
            font-size: 10px;
            color: var(--text-muted);
            padding: 4px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .storage-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.4;
            }
        }

        /* ============ MAIN ============ */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .topbar {
            height: 52px;
            min-height: 52px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 16px;
            z-index: 5;
        }
        .topbar-title {
            font-weight: 600;
            font-size: 15px;
            letter-spacing: -0.01em;
        }
        .topbar-breadcrumb {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .topbar-actions {
            margin-left: auto;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .btn {
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-sans);
            white-space: nowrap;
        }
        .btn:hover {
            border-color: var(--border-active);
            background: var(--bg-card);
        }
        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-weight: 600;
            box-shadow: var(--shadow-glow);
        }
        .btn-primary:hover {
            background: var(--accent-light);
            border-color: var(--accent-light);
            box-shadow: 0 0 32px var(--accent-glow);
        }
        .btn-sm {
            padding: 5px 10px;
            font-size: 11px;
            border-radius: 6px;
        }
        .btn-xs {
            padding: 3px 8px;
            font-size: 10px;
            border-radius: 5px;
        }
        .btn-icon {
            width: 34px;
            height: 34px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }
        .content-area::-webkit-scrollbar {
            width: 5px;
        }
        .content-area::-webkit-scrollbar-track {
            background: transparent;
        }
        .content-area::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        /* ============ CARDS & PANELS ============ */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px 22px;
            transition: var(--transition);
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .card-title {
            font-weight: 600;
            font-size: 14px;
            letter-spacing: -0.01em;
        }
        .card-subtitle {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ============ GRID LAYOUTS ============ */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }
        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }
        @media (max-width: 1100px) {
            .grid-4 {
                grid-template-columns: repeat(2, 1fr);
            }
            .grid-3 {
                grid-template-columns: repeat(2, 1fr);
            }
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        /* ============ STAT CARDS ============ */
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: var(--transition);
            cursor: pointer;
        }
        .stat-card:hover {
            border-color: var(--border-active);
            box-shadow: var(--shadow);
        }
        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .stat-icon.blue {
            background: var(--info-bg);
            color: var(--info);
        }
        .stat-icon.green {
            background: var(--success-bg);
            color: var(--success);
        }
        .stat-icon.amber {
            background: var(--warning-bg);
            color: var(--warning);
        }
        .stat-icon.red {
            background: var(--error-bg);
            color: var(--error);
        }
        .stat-info .stat-value {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1;
        }
        .stat-info .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* ============ CODE INPUT ============ */
        .code-input-area {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--text-primary);
            padding: 16px;
            width: 100%;
            resize: vertical;
            min-height: 140px;
            line-height: 1.6;
            transition: var(--transition);
            outline: none;
        }
        .code-input-area:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .code-input-area::placeholder {
            color: var(--text-muted);
            font-family: var(--font-sans);
            font-size: 12px;
        }
        .input-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 160px;
        }
        .input-group label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .input-group select,
        .input-group input {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            padding: 9px 12px;
            font-size: 13px;
            font-family: var(--font-sans);
            outline: none;
            transition: var(--transition);
        }
        .input-group select:focus,
        .input-group input:focus {
            border-color: var(--accent);
        }

        /* ============ ANALYSIS RESULT ============ */
        .analysis-block {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            animation: fadeInUp 0.4s ease;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .analysis-block .error-type-tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.02em;
            margin-right: 6px;
        }
        .tag-syntax {
            background: var(--error-bg);
            color: var(--error);
        }
        .tag-type {
            background: var(--warning-bg);
            color: var(--warning);
        }
        .tag-logic {
            background: var(--info-bg);
            color: var(--info);
        }
        .tag-runtime {
            background: rgba(139, 92, 246, 0.15);
            color: #a78bfa;
        }
        .knowledge-tag {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            margin: 3px 4px;
        }
        .knowledge-tag:hover {
            border-color: var(--accent);
            color: var(--accent-light);
            background: var(--accent-glow);
        }
        .knowledge-tag.primary {
            border-color: var(--accent);
            color: var(--accent-light);
            font-weight: 600;
        }

        /* ============ MISTAKE LIST ============ */
        .mistake-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 18px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }
        .mistake-item:hover {
            border-color: var(--border-active);
            box-shadow: var(--shadow);
        }
        .mistake-item .mistake-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .mistake-item .mistake-info {
            flex: 1;
            min-width: 0;
        }
        .mistake-item .mistake-title {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 3px;
        }
        .mistake-item .mistake-code {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            background: var(--bg-input);
            padding: 2px 6px;
            border-radius: 3px;
            display: inline-block;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .mistake-item .mistake-meta {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* ============ KNOWLEDGE CARD ============ */
        .knowledge-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 18px;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
        }
        .knowledge-card:hover {
            border-color: var(--border-active);
            box-shadow: var(--shadow);
        }
        .knowledge-card .k-level {
            position: absolute;
            top: 14px;
            right: 14px;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 10px;
        }
        .level-mastered {
            background: var(--success-bg);
            color: var(--success);
        }
        .level-learning {
            background: var(--warning-bg);
            color: var(--warning);
        }
        .level-new {
            background: var(--info-bg);
            color: var(--info);
        }

        /* ============ REVIEW NOTE ============ */
        .review-note {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            position: relative;
        }
        .review-note .rn-date {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 0.03em;
        }
        .review-note .rn-content {
            margin-top: 10px;
            font-size: 13px;
            line-height: 1.7;
            color: var(--text-secondary);
        }
        .review-note .rn-content .highlight {
            background: var(--accent-glow);
            padding: 1px 4px;
            border-radius: 2px;
            color: var(--accent-light);
            font-weight: 500;
        }
        .review-note .rn-code-block {
            background: var(--bg-input);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            font-family: var(--font-mono);
            font-size: 12px;
            margin: 10px 0;
            overflow-x: auto;
            white-space: pre-wrap;
            color: #c9d1d9;
            border: 1px solid var(--border);
        }

        /* ============ TOAST ============ */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 12px 18px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            animation: slideInRight 0.3s ease;
            box-shadow: var(--shadow-lg);
            color: #fff;
            max-width: 380px;
        }
        .toast.success {
            background: #059669;
        }
        .toast.info {
            background: #3b82f6;
        }
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(60px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ============ MODAL ============ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 28px;
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }
        .modal h3 {
            margin-bottom: 16px;
            font-size: 17px;
        }
        .modal .close-btn {
            float: right;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 22px;
            padding: 0 4px;
            line-height: 1;
        }
        .modal .close-btn:hover {
            color: #fff;
        }

        /* ============ EMPTY STATE ============ */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }
        .empty-state .empty-icon {
            font-size: 56px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        .empty-state p {
            font-size: 13px;
        }

        /* ============ TABS ============ */
        .tabs {
            display: flex;
            gap: 2px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }
        .tab {
            padding: 9px 18px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
            transition: var(--transition);
            user-select: none;
        }
        .tab:hover {
            color: var(--text-primary);
        }
        .tab.active {
            color: #fff;
            border-bottom-color: var(--accent);
            font-weight: 600;
        }

        /* ============ LOADING ============ */
        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 6px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
                min-width: 60px;
                padding: 12px 6px;
            }
            .sidebar .logo-text,
            .sidebar .logo-sub,
            .sidebar .nav-section,
            .sidebar .nav-item span:not(.nav-icon),
            .sidebar .nav-badge,
            .sidebar-footer .storage-info span {
                display: none;
            }
            .sidebar-logo {
                justify-content: center;
                padding: 6px 0 16px;
            }
            .sidebar-logo .logo-icon {
                margin: 0;
            }
            .nav-item {
                justify-content: center;
                padding: 10px;
            }
            .nav-item .nav-icon {
                margin: 0;
                font-size: 19px;
            }
            .content-area {
                padding: 14px;
            }
            .grid-2,
            .grid-3,
            .grid-4 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- ==================== SIDEBAR ==================== -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon">🧠</div>
            <div>
                <div class="logo-text">CodeReview AI</div>
                <div class="logo-sub">错题与知识沉淀</div>
            </div>
        </div>
        <div class="nav-section">主菜单</div>
        <div class="nav-item active" data-view="dashboard">
            <span class="nav-icon">📊</span> 学习仪表盘
        </div>
        <div class="nav-item" data-view="capture">
            <span class="nav-icon">🎯</span> 录入错题
            <span class="nav-badge" id="badge-new">NEW</span>
        </div>
        <div class="nav-item" data-view="mistakes">
            <span class="nav-icon">📋</span> 错题本
            <span class="nav-badge" id="badge-mistake-count">0</span>
        </div>
        <div class="nav-section" style="margin-top:12px;">知识管理</div>
        <div class="nav-item" data-view="knowledge">
            <span class="nav-icon">📚</span> 知识库
        </div>
        <div class="nav-item" data-view="review">
            <span class="nav-icon">📝</span> 复盘笔记
            <span class="nav-badge" id="badge-review-count">0</span>
        </div>
        <div class="sidebar-footer">
            <div class="storage-info">
                <span class="storage-dot"></span>
                <span>本地存储已激活</span>
            </div>
            <div class="nav-item" data-view="export-all" style="font-size:12px;">
                <span class="nav-icon">📤</span> 导出全部数据
            </div>
        </div>
    </aside>

    <!-- ==================== MAIN ==================== -->
    <div class="main">
        <!-- TOPBAR -->
        <div class="topbar">
            <span class="topbar-title" id="topbar-title">📊 学习仪表盘</span>
            <span class="topbar-breadcrumb" id="topbar-breadcrumb">/ 概览</span>
            <div class="topbar-actions">
                <button class="btn btn-sm" onclick="clearAllData()" title="清空本地数据">🗑️ 重置</button>
                <button class="btn btn-sm" onclick="loadDemoData()" title="加载演示数据">✨ 演示数据</button>
                <button class="btn btn-primary btn-sm" onclick="navigateTo('capture')">+ 录入错题</button>
            </div>
        </div>

        <!-- CONTENT AREA -->
        <div class="content-area" id="content-area">
            <!-- Dynamic content rendered by JS -->
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toast-container"></div>

    <!-- MODAL (hidden) -->
    <div class="modal-overlay" id="modal-overlay" style="display:none;">
        <div class="modal" id="modal-content"></div>
    </div>

    <script>
        // ==================== DATA STORE ====================
        const STORAGE_KEY = 'codereview_ai_data';

        function getStore() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                try { return JSON.parse(raw); } catch (e) { return defaultStore(); }
            }
            return defaultStore();
        }

        function defaultStore() {
            return {
                mistakes: [], // { id, title, code, errorMsg, language, errorType, knowledgeIds, fixDescription, createdAt, reviewed }
                knowledge: [], // { id, name, category, level, description, relatedMistakeIds, createdAt }
                reviewNotes: [], // { id, title, content, relatedMistakeIds, createdAt }
            };
        }

        function saveStore(store) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
        }

        function generateId() {
            return 'id_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
        }

        // ==================== NAVIGATION ====================
        let currentView = 'dashboard';

        function navigateTo(view) {
            currentView = view;
            document.querySelectorAll('.nav-item[data-view]').forEach(el => el.classList.remove('active'));
            const navItem = document.querySelector(`.nav-item[data-view="${view}"]`);
            if (navItem) navItem.classList.add('active');
            renderView(view);
            updateTopbar(view);
            updateBadges();
        }

        function updateTopbar(view) {
            const titles = {
                dashboard: { title: '📊 学习仪表盘', breadcrumb: '/ 概览' },
                capture: { title: '🎯 录入错题', breadcrumb: '/ 错题录入 & AI 分析' },
                mistakes: { title: '📋 错题本', breadcrumb: '/ 全部错题记录' },
                knowledge: { title: '📚 知识库', breadcrumb: '/ 知识点沉淀' },
                review: { title: '📝 复盘笔记', breadcrumb: '/ 结构化复盘' },
                'export-all': { title: '📤 导出数据', breadcrumb: '/ 导出' },
            };
            const t = titles[view] || titles['dashboard'];
            document.getElementById('topbar-title').textContent = t.title;
            document.getElementById('topbar-breadcrumb').textContent = t.breadcrumb;
        }

        function updateBadges() {
            const store = getStore();
            const mc = store.mistakes.length;
            const rc = store.reviewNotes.length;
            document.getElementById('badge-mistake-count').textContent = mc;
            document.getElementById('badge-review-count').textContent = rc;
            document.getElementById('badge-new').style.display = mc === 0 ? 'inline-block' : 'none';
        }

        // ==================== RENDER VIEWS ====================
        function renderView(view) {
            const container = document.getElementById('content-area');
            container.innerHTML = '';
            switch (view) {
                case 'dashboard':
                    renderDashboard(container);
                    break;
                case 'capture':
                    renderCapture(container);
                    break;
                case 'mistakes':
                    renderMistakes(container);
                    break;
                case 'knowledge':
                    renderKnowledge(container);
                    break;
                case 'review':
                    renderReview(container);
                    break;
                case 'export-all':
                    renderExport(container);
                    break;
                default:
                    renderDashboard(container);
            }
            container.scrollTop = 0;
        }

        // ==================== DASHBOARD ====================
        function renderDashboard(container) {
            const store = getStore();
            const totalMistakes = store.mistakes.length;
            const reviewedMistakes = store.mistakes.filter(m => m.reviewed).length;
            const totalKnowledge = store.knowledge.length;
            const totalReviewNotes = store.reviewNotes.length;
            const recentMistakes = [...store.mistakes].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(
                0, 5);
            const recentNotes = [...store.reviewNotes].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0,
                3);

            container.innerHTML = `
                <div class="grid-4">
                    <div class="stat-card" onclick="navigateTo('mistakes')">
                        <div class="stat-icon blue">📋</div>
                        <div class="stat-info"><div class="stat-value">${totalMistakes}</div><div class="stat-label">错题总数</div></div>
                    </div>
                    <div class="stat-card" onclick="navigateTo('mistakes')">
                        <div class="stat-icon green">✅</div>
                        <div class="stat-info"><div class="stat-value">${reviewedMistakes}</div><div class="stat-label">已复盘错题</div></div>
                    </div>
                    <div class="stat-card" onclick="navigateTo('knowledge')">
                        <div class="stat-icon amber">📚</div>
                        <div class="stat-info"><div class="stat-value">${totalKnowledge}</div><div class="stat-label">知识点</div></div>
                    </div>
                    <div class="stat-card" onclick="navigateTo('review')">
                        <div class="stat-icon red">📝</div>
                        <div class="stat-info"><div class="stat-value">${totalReviewNotes}</div><div class="stat-label">复盘笔记</div></div>
                    </div>
                </div>
                <div class="grid-2">
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">🕐 最近错题</span>
                            <button class="btn btn-xs" onclick="navigateTo('mistakes')">查看全部 →</button>
                        </div>
                        ${recentMistakes.length === 0 ? '<div class="empty-state"><div class="empty-icon">📭</div><p>暂无错题记录，去录入第一道错题吧</p></div>' :
                            recentMistakes.map(m => `
                                <div class="mistake-item" style="margin-bottom:8px;" onclick="navigateTo('mistakes')">
                                    <div class="mistake-icon" style="background:${m.errorType==='syntax'?'var(--error-bg)':m.errorType==='type'?'var(--warning-bg)':'var(--info-bg)'}">${m.errorType==='syntax'?'💥':m.errorType==='type'?'⚠️':'🔍'}</div>
                                    <div class="mistake-info">
                                        <div class="mistake-title">${escapeHtml(m.title)}</div>
                                        <span class="mistake-code">${escapeHtml(m.code?.substring(0,50) || '')}${(m.code?.length||0)>50?'...':''}</span>
                                        <div class="mistake-meta"><span>${m.language}</span><span>${formatDate(m.createdAt)}</span>${m.reviewed?'<span style="color:var(--success)">✓ 已复盘</span>':''}</div>
                                    </div>
                                </div>
                            `).join('')
                        }
                    </div>
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">📝 最新复盘笔记</span>
                            <button class="btn btn-xs" onclick="navigateTo('review')">查看全部 →</button>
                        </div>
                        ${recentNotes.length === 0 ? '<div class="empty-state"><div class="empty-icon">📖</div><p>暂无复盘笔记</p></div>' :
                            recentNotes.map(n => `
                                <div class="review-note" style="margin-bottom:8px;padding:14px;">
                                    <div class="rn-date">${formatDate(n.createdAt)}</div>
                                    <div style="font-weight:600;font-size:13px;">${escapeHtml(n.title)}</div>
                                    <div class="rn-content" style="font-size:11px;margin-top:4px;">${escapeHtml(n.content?.substring(0,100) || '')}...</div>
                                </div>
                            `).join('')
                        }
                    </div>
                </div>
            `;
        }

        // ==================== CAPTURE (录入错题) ====================
        function renderCapture(container) {
            container.innerHTML = `
                <div class="card" id="capture-card">
                    <div class="card-header">
                        <span class="card-title">🎯 录入代码错题</span>
                        <span class="card-subtitle">粘贴代码与错误信息，AI 将自动分析</span>
                    </div>
                    <div class="input-row" style="margin-bottom:12px;">
                        <div class="input-group" style="max-width:160px;">
                            <label>编程语言</label>
                            <select id="capture-language">
                                <option value="JavaScript">JavaScript</option>
                                <option value="TypeScript">TypeScript</option>
                                <option value="Python">Python</option>
                                <option value="Java">Java</option>
                                <option value="Go">Go</option>
                                <option value="Rust">Rust</option>
                                <option value="C++">C++</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>错题标题</label>
                            <input type="text" id="capture-title" placeholder="例如：数组越界导致运行时崩溃">
                        </div>
                    </div>
                    <div class="grid-2" style="margin-bottom:12px;">
                        <div class="input-group">
                            <label>📝 代码片段（出错代码）</label>
                            <textarea class="code-input-area" id="capture-code" placeholder="粘贴出错的代码片段...&#10;例如：&#10;const arr = [1,2,3];&#10;console.log(arr[5]);" style="min-height:130px;"></textarea>
                        </div>
                        <div class="input-group">
                            <label>🚨 错误信息 / 报错内容</label>
                            <textarea class="code-input-area" id="capture-error" placeholder="粘贴报错信息...&#10;例如：&#10;TypeError: Cannot read properties of undefined (reading 'length')" style="min-height:130px;"></textarea>
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="runAIAnalysis()" id="btn-analyze">
                        🔬 AI 智能分析
                    </button>
                    <div id="analysis-result-container" style="margin-top:16px;"></div>
                </div>
            `;
            // Reset the analysis result
            window._pendingAnalysis = null;
        }

        function runAIAnalysis() {
            const title = document.getElementById('capture-title').value.trim();
            const code = document.getElementById('capture-code').value.trim();
            const errorMsg = document.getElementById('capture-error').value.trim();
            const language = document.getElementById('capture-language').value;

            if (!code && !errorMsg) {
                showToast('请至少粘贴代码片段或错误信息', 'info');
                return;
            }
            if (!title) {
                document.getElementById('capture-title').value = '未命名错题 - ' + new Date().toLocaleDateString();
            }

            const btn = document.getElementById('btn-analyze');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> AI 分析中...';

            // Simulate AI analysis with delay
            setTimeout(() => {
                const analysis = performMockAnalysis(code, errorMsg, language);
                window._pendingAnalysis = { title: title || document.getElementById('capture-title').value,
                    code, errorMsg, language, analysis };
                renderAnalysisResult(analysis);
                btn.disabled = false;
                btn.innerHTML = '🔬 AI 智能分析';
                showToast('✅ AI 分析完成！请查看结果并保存', 'success');
            }, 1200 + Math.random() * 800);
        }

        function performMockAnalysis(code, errorMsg, language) {
            const combined = (code + ' ' + errorMsg).toLowerCase();
            let errorType = 'runtime';
            let errorTypeLabel = '运行时错误';
            let tagClass = 'tag-runtime';
            let fixDescription = '';
            let knowledgeMatches = [];

            // Detect error patterns
            if (combined.includes('syntax') || combined.includes('unexpected token') || combined.includes('missing') ||
                combined.includes('unterminated') || combined.includes('invalid') && combined.includes('syntax')) {
                errorType = 'syntax';
                errorTypeLabel = '语法错误';
                tagClass = 'tag-syntax';
                fixDescription = '检查代码语法，确保括号匹配、分号正确、字符串引号闭合。建议使用 IDE 的语法高亮和自动格式化功能辅助排查。';
                knowledgeMatches = ['基础语法规则', '括号匹配与闭合', '语句终止符使用'];
            } else if (combined.includes('typeerror') || combined.includes('type error') || combined.includes('cannot read') ||
                combined.includes('undefined') || combined.includes('null') || combined.includes('is not a function')) {
                errorType = 'type';
                errorTypeLabel = '类型错误';
                tagClass = 'tag-type';
                fixDescription = '在访问对象属性或调用方法前，添加空值检查（可选链操作符 `?.` 或条件判断）。确保变量已正确初始化。';
                knowledgeMatches = ['空值安全处理', '可选链操作符', '类型判断与守卫', '变量初始化最佳实践'];
            } else if (combined.includes('out of bounds') || combined.includes('index') || combined.includes('range') ||
                combined.includes('length')) {
                errorType = 'runtime';
                errorTypeLabel = '越界/范围错误';
                tagClass = 'tag-runtime';
                fixDescription = '访问数组或字符串索引前，验证索引是否在有效范围内（0 到 length-1）。使用边界检查或 try-catch 包裹。';
                knowledgeMatches = ['数组边界检查', '索引安全访问', '防御性编程'];
            } else if (combined.includes('promise') || combined.includes('async') || combined.includes('await') || combined
                .includes('then')) {
                errorType = 'logic';
                errorTypeLabel = '异步逻辑错误';
                tagClass = 'tag-logic';
                fixDescription = '确保 Promise 链正确使用 async/await 或 .then/.catch，不要忘记处理 rejected 状态。使用 try-catch 包裹 await 调用。';
                knowledgeMatches = ['Promise 异步处理', 'async/await 模式', '错误冒泡与捕获'];
            } else if (combined.includes('referenceerror') || combined.includes('is not defined') || combined.includes(
                    'undeclared')) {
                errorType = 'syntax';
                errorTypeLabel = '引用错误';
                tagClass = 'tag-syntax';
                fixDescription = '变量在使用前需先声明（let/const/var）。检查变量名拼写、作用域以及导入语句是否正确。';
                knowledgeMatches = ['变量声明与作用域', '模块导入导出', 'TDZ 暂时性死区'];
            } else {
                fixDescription = '根据错误信息定位出问题的代码行，检查逻辑流程。建议添加调试日志或使用断点调试工具逐步排查。';
                knowledgeMatches = ['调试技巧', '日志输出策略', '断点调试方法'];
            }

            // Add language-specific knowledge
            if (language === 'JavaScript' || language === 'TypeScript') {
                knowledgeMatches.push('JS 常见陷阱', '严格模式');
            } else if (language === 'Python') {
                knowledgeMatches.push('Python 缩进规则', 'Python 类型提示');
            } else if (language === 'Java') {
                knowledgeMatches.push('Java 异常体系', '空指针处理');
            }

            return {
                errorType,
                errorTypeLabel,
                tagClass,
                fixDescription,
                knowledgeMatches: [...new Set(knowledgeMatches)].slice(0, 6),
                confidence: Math.floor(75 + Math.random() * 22),
            };
        }

        function renderAnalysisResult(analysis) {
            const container = document.getElementById('analysis-result-container');
            container.innerHTML = `
                <div class="analysis-block">
                    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;">
                        <span class="error-type-tag ${analysis.tagClass}">${analysis.errorTypeLabel}</span>
                        <span style="font-size:12px;color:var(--text-muted);">置信度：<strong>${analysis.confidence}%</strong></span>
                        <span style="font-size:12px;color:var(--success);">🤖 AI 分析完成</span>
                    </div>
                    <div style="margin-bottom:12px;">
                        <strong style="font-size:13px;">🔧 修复建议：</strong>
                        <p style="font-size:13px;color:var(--text-secondary);margin-top:4px;line-height:1.6;">${analysis.fixDescription}</p>
                    </div>
                    <div style="margin-bottom:12px;">
                        <strong style="font-size:13px;">📚 关联知识点：</strong>
                        <div style="margin-top:6px;">
                            ${analysis.knowledgeMatches.map(k => `<span class="knowledge-tag primary">${k}</span>`).join('')}
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="saveAnalyzedMistake()">
                        💾 保存到错题本 & 沉淀知识
                    </button>
                    <button class="btn" style="margin-left:8px;" onclick="document.getElementById('analysis-result-container').innerHTML='';window._pendingAnalysis=null;">
                        取消
                    </button>
                </div>
            `;
        }

        function saveAnalyzedMistake() {
            if (!window._pendingAnalysis) {
                showToast('请先进行 AI 分析', 'info');
                return;
            }
            const p = window._pendingAnalysis;
            const store = getStore();
            const mistakeId = generateId();
            const knowledgeIds = [];

            // Create knowledge items for matched knowledge points
            p.analysis.knowledgeMatches.forEach(kName => {
                let existing = store.knowledge.find(k => k.name.toLowerCase() === kName.toLowerCase());
                if (!existing) {
                    const kid = generateId();
                    store.knowledge.push({
                        id: kid,
                        name: kName,
                        category: p.language,
                        level: 'new',
                        description: `与错题「${p.title}」关联的知识点`,
                        relatedMistakeIds: [mistakeId],
                        createdAt: new Date().toISOString(),
                    });
                    knowledgeIds.push(kid);
                } else {
                    if (!existing.relatedMistakeIds.includes(mistakeId)) {
                        existing.relatedMistakeIds.push(mistakeId);
                    }
                    knowledgeIds.push(existing.id);
                }
            });

            // Create the mistake record
            store.mistakes.push({
                id: mistakeId,
                title: p.title,
                code: p.code,
                errorMsg: p.errorMsg,
                language: p.language,
                errorType: p.analysis.errorType,
                knowledgeIds: knowledgeIds,
                fixDescription: p.analysis.fixDescription,
                createdAt: new Date().toISOString(),
                reviewed: false,
            });

            // Auto-generate a review note
            const reviewNoteId = generateId();
            store.reviewNotes.push({
                id: reviewNoteId,
                title: `复盘：${p.title}`,
                content: generateReviewContent(p),
                relatedMistakeIds: [mistakeId],
                createdAt: new Date().toISOString(),
            });

            saveStore(store);
            window._pendingAnalysis = null;
            document.getElementById('analysis-result-container').innerHTML = '';
            // Clear inputs
            document.getElementById('capture-title').value = '';
            document.getElementById('capture-code').value = '';
            document.getElementById('capture-error').value = '';
            updateBadges();
            showToast('✅ 错题已保存，知识点已沉淀，复盘笔记已自动生成！', 'success');
            // Refresh if on capture view
            if (currentView === 'capture') {
                renderView('capture');
            }
        }

        function generateReviewContent(p) {
            return `## 错误复盘

        **错误类型**：${p.analysis.errorTypeLabel}
        **编程语言**：${p.language}
        **出错代码**：
        \`\`\`
        ${p.code || '(未提供代码)'}
        \`\`\`
        **错误信息**：${p.errorMsg || '(未提供)'}

        ## 根因分析
        ${p.analysis.fixDescription}

        ## 关联知识点
        ${p.analysis.knowledgeMatches.map(k => `- ${k}`).join('\n')}

        ## 避免再次踩坑
        1. 在编写类似代码时注意检查边界条件和空值
        2. 使用 IDE 的静态检查工具提前发现问题
        3. 编写单元测试覆盖该场景

        *本笔记由 CodeReview AI 自动生成于 ${new Date().toLocaleString()}*`;
        }

        // ==================== MISTAKES LIST ====================
        function renderMistakes(container) {
            const store = getStore();
            const mistakes = [...store.mistakes].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            const filterOptions = ['全部', '语法错误', '类型错误', '逻辑错误', '运行时错误', '已复盘', '未复盘'];

            container.innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <span class="card-title">📋 错题本（共 ${mistakes.length} 条）</span>
                        <div style="display:flex;gap:6px;flex-wrap:wrap;" id="mistake-filters">
                            ${filterOptions.map(f => `<button class="btn btn-xs filter-btn" data-filter="${f}">${f}</button>`).join('')}
                        </div>
                    </div>
                    <div id="mistake-list">
                        ${mistakes.length === 0 ? '<div class="empty-state"><div class="empty-icon">📭</div><p>错题本为空，去录入错题吧</p></div>' :
                            mistakes.map(m => renderMistakeItem(m)).join('')
                        }
                    </div>
                </div>
            `;

            // Filter functionality
            container.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    container.querySelectorAll('.filter-btn').forEach(b => b.style.background = '');
                    btn.style.background = 'var(--accent)';
                    btn.style.color = '#fff';
                    btn.style.borderColor = 'var(--accent)';
                    const filter = btn.dataset.filter;
                    const filtered = filterMistakes(mistakes, filter);
                    document.getElementById('mistake-list').innerHTML = filtered.length === 0 ?
                        '<div class="empty-state"><div class="empty-icon">📭</div><p>无匹配结果</p></div>' :
                        filtered.map(m => renderMistakeItem(m)).join('');
                });
            });
        }

        function filterMistakes(mistakes, filter) {
            switch (filter) {
                case '语法错误':
                    return mistakes.filter(m => m.errorType === 'syntax');
                case '类型错误':
                    return mistakes.filter(m => m.errorType === 'type');
                case '逻辑错误':
                    return mistakes.filter(m => m.errorType === 'logic');
                case '运行时错误':
                    return mistakes.filter(m => m.errorType === 'runtime');
                case '已复盘':
                    return mistakes.filter(m => m.reviewed);
                case '未复盘':
                    return mistakes.filter(m => !m.reviewed);
                default:
                    return mistakes;
            }
        }

        function renderMistakeItem(m) {
            const iconMap = { syntax: '💥', type: '⚠️', logic: '🔍', runtime: '⚡' };
            const bgMap = { syntax: 'var(--error-bg)', type: 'var(--warning-bg)', logic: 'var(--info-bg)',
                runtime: 'rgba(139,92,246,0.15)' };
            return `
                <div class="mistake-item" style="margin-bottom:8px;" onclick="showMistakeDetail('${m.id}')">
                    <div class="mistake-icon" style="background:${bgMap[m.errorType]||bgMap['runtime']}">${iconMap[m.errorType]||'⚡'}</div>
                    <div class="mistake-info">
                        <div class="mistake-title">${escapeHtml(m.title)} ${m.reviewed?'<span style="color:var(--success);font-size:10px;">✅ 已复盘</span>':''}</div>
                        <span class="mistake-code">${escapeHtml(m.code?.substring(0,60) || '(无代码)')}</span>
                        <div class="mistake-meta">
                            <span>${m.language}</span>
                            <span>${formatDate(m.createdAt)}</span>
                            <span style="color:var(--accent-light);cursor:pointer;" onclick="event.stopPropagation();toggleReview('${m.id}')">${m.reviewed?'标记未复盘':'标记已复盘'}</span>
                            <span style="color:var(--error);cursor:pointer;" onclick="event.stopPropagation();deleteMistake('${m.id}')">🗑️ 删除</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function showMistakeDetail(id) {
            const store = getStore();
            const m = store.mistakes.find(x => x.id === id);
            if (!m) return;
            const relatedKnowledge = store.knowledge.filter(k => m.knowledgeIds.includes(k.id));
            const modal = document.getElementById('modal-content');
            modal.innerHTML = `
                <button class="close-btn" onclick="closeModal()">✕</button>
                <h3>📋 ${escapeHtml(m.title)}</h3>
                <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
                    <span class="error-type-tag ${m.errorType==='syntax'?'tag-syntax':m.errorType==='type'?'tag-type':m.errorType==='logic'?'tag-logic':'tag-runtime'}">${m.errorType}</span>
                    <span style="font-size:11px;color:var(--text-muted);">${m.language} · ${formatDate(m.createdAt)}</span>
                </div>
                <div style="margin-bottom:10px;"><strong>代码片段：</strong>
                    <div class="rn-code-block">${escapeHtml(m.code || '(无)')}</div>
                </div>
                <div style="margin-bottom:10px;"><strong>错误信息：</strong>
                    <div class="rn-code-block" style="color:var(--error);">${escapeHtml(m.errorMsg || '(无)')}</div>
                </div>
                <div style="margin-bottom:10px;"><strong>修复建议：</strong>
                    <p style="font-size:13px;color:var(--text-secondary);">${escapeHtml(m.fixDescription || '暂无')}</p>
                </div>
                <div><strong>关联知识点：</strong>
                    <div style="margin-top:4px;">${relatedKnowledge.length>0?relatedKnowledge.map(k=>`<span class="knowledge-tag primary">${escapeHtml(k.name)}</span>`).join(''):'<span style="color:var(--text-muted);font-size:12px;">无</span>'}</div>
                </div>
            `;
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function toggleReview(id) {
            const store = getStore();
            const m = store.mistakes.find(x => x.id === id);
            if (m) {
                m.reviewed = !m.reviewed;
                saveStore(store);
                updateBadges();
                if (currentView === 'mistakes') renderView('mistakes');
                if (currentView === 'dashboard') renderView('dashboard');
                showToast(m.reviewed ? '✅ 已标记为已复盘' : '↩️ 已标记为未复盘', 'info');
            }
        }

        function deleteMistake(id) {
            if (!confirm('确定删除这条错题吗？关联的知识点和笔记不会被删除。')) return;
            const store = getStore();
            store.mistakes = store.mistakes.filter(x => x.id !== id);
            // Clean up references
            store.knowledge.forEach(k => {
                k.relatedMistakeIds = k.relatedMistakeIds.filter(mid => mid !== id);
            });
            store.reviewNotes.forEach(n => {
                n.relatedMistakeIds = n.relatedMistakeIds.filter(mid => mid !== id);
            });
            saveStore(store);
            updateBadges();
            if (currentView === 'mistakes') renderView('mistakes');
            if (currentView === 'dashboard') renderView('dashboard');
            showToast('🗑️ 错题已删除', 'info');
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        // ==================== KNOWLEDGE ====================
        function renderKnowledge(container) {
            const store = getStore();
            const knowledge = store.knowledge;
            const categories = [...new Set(knowledge.map(k => k.category))];

            container.innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <span class="card-title">📚 知识库（共 ${knowledge.length} 个知识点）</span>
                        <button class="btn btn-sm" onclick="addManualKnowledge()">+ 手动添加</button>
                    </div>
                    ${categories.length === 0 ? '<div class="empty-state"><div class="empty-icon">📖</div><p>知识库为空，录入错题后将自动沉淀知识点</p></div>' : ''}
                    ${categories.map(cat => {
                        const catKnowledge = knowledge.filter(k => k.category === cat);
                        return `
                            <div style="margin-bottom:16px;">
                                <h4 style="font-size:13px;margin-bottom:8px;color:var(--text-secondary);">📁 ${escapeHtml(cat)} (${catKnowledge.length})</h4>
                                <div style="display:flex;flex-wrap:wrap;gap:8px;">
                                    ${catKnowledge.map(k => `
                                        <div class="knowledge-card" style="min-width:200px;flex:1;" onclick="showKnowledgeDetail('${k.id}')">
                                            <span class="k-level ${k.level==='mastered'?'level-mastered':k.level==='learning'?'level-learning':'level-new'}">${k.level==='mastered'?'已掌握':k.level==='learning'?'学习中':'新接触'}</span>
                                            <div style="font-weight:600;font-size:13px;margin-bottom:3px;">${escapeHtml(k.name)}</div>
                                            <div style="font-size:11px;color:var(--text-muted);">${escapeHtml(k.description?.substring(0,50) || '')}</div>
                                            <div style="font-size:10px;color:var(--text-muted);margin-top:4px;">关联 ${k.relatedMistakeIds?.length || 0} 道错题</div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function showKnowledgeDetail(id) {
            const store = getStore();
            const k = store.knowledge.find(x => x.id === id);
            if (!k) return;
            const relatedMistakes = store.mistakes.filter(m => k.relatedMistakeIds.includes(m.id));
            const modal = document.getElementById('modal-content');
            modal.innerHTML = `
                <button class="close-btn" onclick="closeModal()">✕</button>
                <h3>📚 ${escapeHtml(k.name)}</h3>
                <div style="display:flex;gap:8px;margin-bottom:12px;">
                    <span>分类：${escapeHtml(k.category)}</span>
                    <span class="k-level ${k.level==='mastered'?'level-mastered':k.level==='learning'?'level-learning':'level-new'}">${k.level==='mastered'?'已掌握':k.level==='learning'?'学习中':'新接触'}</span>
                </div>
                <p style="font-size:13px;color:var(--text-secondary);margin-bottom:12px;">${escapeHtml(k.description || '暂无描述')}</p>
                <div>
                    <strong>关联错题：</strong>
                    ${relatedMistakes.length === 0 ? '<p style="color:var(--text-muted);font-size:12px;">无关联错题</p>' :
                        relatedMistakes.map(m => `<div class="mistake-item" style="margin:6px 0;padding:10px;font-size:12px;" onclick="closeModal();navigateTo('mistakes')">📋 ${escapeHtml(m.title)}</div>`).join('')
                    }
                </div>
                <button class="btn btn-sm" style="margin-top:10px;" onclick="cycleKnowledgeLevel('${k.id}');closeModal();">🔄 切换掌握程度</button>
                <button class="btn btn-sm" style="margin-top:10px;margin-left:6px;color:var(--error);" onclick="deleteKnowledge('${k.id}');closeModal();">🗑️ 删除</button>
            `;
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function cycleKnowledgeLevel(id) {
            const store = getStore();
            const k = store.knowledge.find(x => x.id === id);
            if (k) {
                const levels = ['new', 'learning', 'mastered'];
                const idx = levels.indexOf(k.level);
                k.level = levels[(idx + 1) % 3];
                saveStore(store);
                if (currentView === 'knowledge') renderView('knowledge');
                showToast('🔄 掌握程度已更新', 'info');
            }
        }

        function deleteKnowledge(id) {
            if (!confirm('确定删除该知识点吗？')) return;
            const store = getStore();
            store.knowledge = store.knowledge.filter(x => x.id !== id);
            store.mistakes.forEach(m => {
                m.knowledgeIds = m.knowledgeIds.filter(kid => kid !== id);
            });
            saveStore(store);
            updateBadges();
            if (currentView === 'knowledge') renderView('knowledge');
            showToast('🗑️ 知识点已删除', 'info');
        }

        function addManualKnowledge() {
            const name = prompt('请输入知识点名称：');
            if (!name || !name.trim()) return;
            const category = prompt('请输入分类（如 JavaScript、Python 等）：') || '通用';
            const store = getStore();
            store.knowledge.push({
                id: generateId(),
                name: name.trim(),
                category: category.trim(),
                level: 'new',
                description: '手动添加的知识点',
                relatedMistakeIds: [],
                createdAt: new Date().toISOString(),
            });
            saveStore(store);
            updateBadges();
            if (currentView === 'knowledge') renderView('knowledge');
            showToast('✅ 知识点已添加', 'success');
        }

        // ==================== REVIEW NOTES ====================
        function renderReview(container) {
            const store = getStore();
            const notes = [...store.reviewNotes].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

            container.innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <span class="card-title">📝 复盘笔记（共 ${notes.length} 篇）</span>
                        <button class="btn btn-sm" onclick="generateManualReview()">+ 手动生成笔记</button>
                    </div>
                    ${notes.length === 0 ? '<div class="empty-state"><div class="empty-icon">📖</div><p>暂无复盘笔记，录入错题后将自动生成</p></div>' :
                        notes.map(n => `
                            <div class="review-note" style="margin-bottom:12px;">
                                <div style="display:flex;justify-content:space-between;align-items:center;">
                                    <strong>${escapeHtml(n.title)}</strong>
                                    <span class="rn-date">${formatDate(n.createdAt)}</span>
                                </div>
                                <div class="rn-content">${formatReviewContent(n.content)}</div>
                                <div style="margin-top:8px;display:flex;gap:6px;">
                                    <button class="btn btn-xs" onclick="viewReviewDetail('${n.id}')">📖 展开</button>
                                    <button class="btn btn-xs" style="color:var(--error);" onclick="deleteReview('${n.id}')">🗑️ 删除</button>
                                </div>
                            </div>
                        `).join('')
                    }
                </div>
            `;
        }

        function formatReviewContent(content) {
            if (!content) return '';
            // Simple markdown-like formatting
            return escapeHtml(content.substring(0, 200))
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/```([\s\S]*?)```/g, '<div class="rn-code-block">$1</div>')
                .replace(/\n/g, '<br>');
        }

        function viewReviewDetail(id) {
            const store = getStore();
            const n = store.reviewNotes.find(x => x.id === id);
            if (!n) return;
            const modal = document.getElementById('modal-content');
            modal.innerHTML = `
                <button class="close-btn" onclick="closeModal()">✕</button>
                <h3>📝 ${escapeHtml(n.title)}</h3>
                <span class="rn-date">${formatDate(n.createdAt)}</span>
                <div class="rn-content" style="margin-top:12px;white-space:pre-wrap;">${escapeHtml(n.content || '')}</div>
                <button class="btn btn-sm" style="margin-top:12px;" onclick="closeModal()">关闭</button>
            `;
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function deleteReview(id) {
            if (!confirm('确定删除该复盘笔记吗？')) return;
            const store = getStore();
            store.reviewNotes = store.reviewNotes.filter(x => x.id !== id);
            saveStore(store);
            updateBadges();
            if (currentView === 'review') renderView('review');
            showToast('🗑️ 笔记已删除', 'info');
        }

        function generateManualReview() {
            const store = getStore();
            if (store.mistakes.length === 0) {
                showToast('请先录入错题', 'info');
                return;
            }
            const title = prompt('请输入笔记标题：') || '手动复盘笔记';
            const content = prompt('请输入笔记内容（支持 Markdown）：') || '（空笔记）';
            store.reviewNotes.push({
                id: generateId(),
                title,
                content,
                relatedMistakeIds: [],
                createdAt: new Date().toISOString(),
            });
            saveStore(store);
            updateBadges();
            if (currentView === 'review') renderView('review');
            showToast('✅ 笔记已生成', 'success');
        }

        // ==================== EXPORT ====================
        function renderExport(container) {
            const store = getStore();
            const exportData = JSON.stringify(store, null, 2);
            container.innerHTML = `
                <div class="card">
                    <div class="card-header"><span class="card-title">📤 导出全部数据</span></div>
                    <p style="font-size:13px;color:var(--text-secondary);margin-bottom:12px;">导出包含所有错题、知识点和复盘笔记的 JSON 文件，可用于备份或迁移。</p>
                    <div class="rn-code-block" style="max-height:400px;overflow-y:auto;">${escapeHtml(exportData)}</div>
                    <div style="margin-top:12px;display:flex;gap:8px;">
                        <button class="btn btn-primary" onclick="downloadExport()">📥 下载 JSON 文件</button>
                        <button class="btn" onclick="copyExport()">📋 复制到剪贴板</button>
                    </div>
                </div>
            `;
        }

        function downloadExport() {
            const store = getStore();
            const blob = new Blob([JSON.stringify(store, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `codereview-ai-backup-${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('✅ 导出成功！', 'success');
        }

        function copyExport() {
            const store = getStore();
            navigator.clipboard.writeText(JSON.stringify(store, null, 2)).then(() => {
                showToast('✅ 已复制到剪贴板', 'success');
            }).catch(() => showToast('复制失败，请手动复制', 'info'));
        }

        // ==================== UTILS ====================
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatDate(isoStr) {
            if (!isoStr) return '';
            const d = new Date(isoStr);
            return d.toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' }) + ' ' +
                d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function clearAllData() {
            if (confirm('⚠️ 确定要清空所有本地数据吗？此操作不可恢复！')) {
                localStorage.removeItem(STORAGE_KEY);
                updateBadges();
                renderView(currentView);
                showToast('🗑️ 所有数据已清空', 'info');
            }
        }

        function loadDemoData() {
            if (!confirm('加载演示数据将覆盖现有数据，确定继续吗？')) return;
            const demoStore = {
                mistakes: [
                    { id: 'demo_m1', title: '数组越界访问导致崩溃', code: 'const arr = [1,2,3];\nconsole.log(arr[5].toString());',
                        errorMsg: 'TypeError: Cannot read properties of undefined (reading \'toString\')',
                        language: 'JavaScript', errorType: 'type', knowledgeIds: ['demo_k1', 'demo_k2'],
                        fixDescription: '在访问数组索引前验证索引范围，使用 arr.length 检查边界。',
                        createdAt: new Date(Date.now() - 86400000 * 3).toISOString(), reviewed: true },
                    { id: 'demo_m2', title: 'Promise 未处理 rejection', code: 'fetch(url)\n  .then(res => res.json())\n  .then(data => process(data));',
                        errorMsg: 'UnhandledPromiseRejectionWarning: TypeError: Failed to fetch',
                        language: 'JavaScript', errorType: 'logic', knowledgeIds: ['demo_k3'],
                        fixDescription: '添加 .catch() 处理 Promise rejection，或使用 try-catch 包裹 async/await。',
                        createdAt: new Date(Date.now() - 86400000 * 2).toISOString(), reviewed: false },
                    { id: 'demo_m3', title: 'Python 缩进混用导致 IndentationError',
                        code: 'def foo():\n    print("hello")\n\tprint("world")', errorMsg: 'IndentationError: unexpected indent',
                        language: 'Python', errorType: 'syntax', knowledgeIds: ['demo_k4'],
                        fixDescription: '统一使用空格（推荐4个空格）或制表符，不要混用。',
                        createdAt: new Date(Date.now() - 86400000).toISOString(), reviewed: false },
                ],
                knowledge: [
                    { id: 'demo_k1', name: '数组边界检查', category: 'JavaScript', level: 'learning',
                        description: '访问数组元素前验证索引在 0 到 length-1 范围内', relatedMistakeIds: ['demo_m1'],
                        createdAt: new Date().toISOString() },
                    { id: 'demo_k2', name: '空值安全处理', category: 'JavaScript', level: 'new',
                        description: '使用可选链操作符或条件判断避免访问 undefined/null 的属性',
                        relatedMistakeIds: ['demo_m1'], createdAt: new Date().toISOString() },
                    { id: 'demo_k3', name: 'Promise 异步处理', category: 'JavaScript', level: 'learning',
                        description: '正确处理 Promise 的 resolved 和 rejected 状态', relatedMistakeIds: ['demo_m2'],
                        createdAt: new Date().toISOString() },
                    { id: 'demo_k4', name: 'Python 缩进规则', category: 'Python', level: 'mastered',
                        description: 'Python 使用缩进定义代码块，必须保持一致', relatedMistakeIds: ['demo_m3'],
                        createdAt: new Date().toISOString() },
                ],
                reviewNotes: [
                    { id: 'demo_r1', title: '复盘：数组越界访问导致崩溃',
                        content: '## 错误复盘\n\n**错误类型**：类型错误\n**根因**：访问了不存在的数组索引\n\n## 避免再次踩坑\n1. 访问数组前检查索引范围\n2. 使用可选链操作符\n3. 编写防御性代码',
                        relatedMistakeIds: ['demo_m1'], createdAt: new Date(Date.now() - 86400000 * 2).toISOString() },
                ],
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(demoStore));
            updateBadges();
            renderView(currentView);
            showToast('✨ 演示数据已加载！包含3道错题、4个知识点、1篇笔记', 'success');
        }

        // ==================== INIT ====================
        function init() {
            // Sidebar navigation
            document.querySelectorAll('.nav-item[data-view]').forEach(item => {
                item.addEventListener('click', (e) => {
                    const view = item.dataset.view;
                    if (view) navigateTo(view);
                });
            });

            // Close modal on overlay click
            document.getElementById('modal-overlay').addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });

            // Keyboard shortcut to close modal
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeModal();
            });

            updateBadges();
            renderView('dashboard');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
