function validDate(d) { return d instanceof Date && Number.isFinite(d.getTime()); }
function localDay(d) { d = d || new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function today() { return localDay(new Date()); }
function iso(d) {
  d = localDay(validDate(d) ? d : today());
  var y = d.getFullYear();
  var m = String(d.getMonth()+1).padStart(2,"0");
  var da = String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+da;
}
function parseDate(v, f) {
  f = f || today();
  if (v instanceof Date) return validDate(v) ? v : f;
  if (!v) return f;
  var p = new Date(v+"T00:00:00");
  return validDate(p) ? p : f;
}
function fmtDate(d, loc) {
  d = validDate(d) ? d : today();
  if (loc === "zh-CN") return new Intl.DateTimeFormat("zh-CN", {year:"numeric",month:"long",day:"numeric"}).format(d);
  return new Intl.DateTimeFormat("en-US", {month:"short",day:"numeric",year:"numeric"}).format(d);
}
function normDur(d, f) {
  if (f === undefined) f = MIN_D;
  var p = Number(d);
  if (!Number.isFinite(p) || p <= 0) return f;
  return Math.min(MAX_D, Math.max(MIN_D, Math.floor(p)));
}
function addDays(date, days) {
  /* plain calendar arithmetic: add N days without applying business-level
     duration limits (MAX_D). normDur would clamp to 3650 and break long-term
     cards that span many renewal cycles (dur * cycleCount can exceed 3650). */
  var d = Number(days);
  if (!Number.isFinite(d)) d = 0;
  var n = new Date(localDay(validDate(date) ? date : today()));
  n.setDate(n.getDate() + Math.floor(d));
  return n;
}
function expiryFor(card, bd) {
  bd = bd || today();
  var start = localDay(parseDate(card && card.startDate));
  var dur = normDur(card && card.durationDays, MIN_D);
  var fe = addDays(start, dur);
  if (!card || !card.longTerm) return fe;
  var b = localDay(validDate(bd) ? bd : today());
  var el = Math.floor((b - start) / MS_DAY);
  if (el < dur) return fe;
  var cc = Math.floor(el / dur);
  var ne = addDays(start, dur * cc);
  return ne <= b ? addDays(ne, dur) : ne;
}
function renewalBaseDate(card, bd) {
  var cur = expiryFor(card, bd);
  var base = localDay(validDate(bd) ? bd : today());
  return cur > base ? cur : base;
}
function rawDaysLeft(card, bd) {
  bd = bd || today();
  var e = expiryFor(card, bd);
  var b = localDay(validDate(bd) ? bd : today());
  return Math.ceil((e - b) / MS_DAY);
}
function daysLeft(card, bd) {
  bd = bd || today();
  var e = expiryFor(card, bd);
  var b = localDay(validDate(bd) ? bd : today());
  return Math.max(0, Math.ceil((e - b) / MS_DAY));
}
function riskMeta(card, bd, t) {
  bd = bd || today();
  var e = expiryFor(card, bd);
  var b = localDay(validDate(bd) ? bd : today());
  var rawLeft = Math.ceil((e - b) / MS_DAY);
  var left = Math.max(0, rawLeft);
  if (rawLeft < 0) return { key:"expired", rank:0, label:t.riskExpired || "Expired", color:"#ef8a76", bg:"var(--danger-bg)" };
  if (card && card.longTerm) return { key:"long", rank:5, label:t.riskLong || t.longTerm, color:"#a9c38b", bg:"var(--emerald-bg)" };
  if (left <= 3) return { key:"danger", rank:1, label:t.riskDanger || "High Risk", color:"#ef8a76", bg:"var(--danger-bg)" };
  if (left <= 7) return { key:"warn", rank:2, label:t.riskWarn || "Expiring", color:"#e5a084", bg:"var(--amber-bg)" };
  if (left <= 30) return { key:"watch", rank:3, label:t.riskWatch || "Watch", color:"#cc785c", bg:"var(--sky-light)" };
  return { key:"safe", rank:4, label:t.riskSafe || "Safe", color:"#a9c38b", bg:"var(--emerald-bg)" };
}

/* ======== CARD QUERY & REMINDER SELECTION ======== */
function filterCards(cards, q, af, bd, thresh, tf, sortBy) {
  thresh = thresh || 30;
  bd = bd || today();
  tf = tf || "all";
  sortBy = sortBy || "risk";
  q = q.trim().toLowerCase();
  var mapped = cards.map(function(c,i) {
    var rawLeft = rawDaysLeft(c, bd);
    return { card:c, index:i, left:Math.max(0, rawLeft), rawLeft:rawLeft, risk:riskMeta(c,bd,{}) };
  });
  var filtered = mapped.filter(function(o) {
    var c = o.card;
    if (!(af === "all" || (af === "expiring" && o.rawLeft >= 0 && o.rawLeft <= thresh) || (af === "longTerm" && c.longTerm))) return false;
    if (!(tf === "all" || (Array.isArray(c.tags) && c.tags.indexOf(tf) !== -1))) return false;
    if (!q) return true;
    var s = [c.carrier, c.country, ccode(c.country), c.plan, c.phone, c.note].filter(Boolean).join(" ").toLowerCase();
    return s.indexOf(q) !== -1;
  });
  if (sortBy === "expiry") {
    filtered.sort(function(a,b) { return a.rawLeft - b.rawLeft || a.index - b.index; });
  } else if (sortBy === "carrier") {
    filtered.sort(function(a,b) {
      var ca = String(a.card.carrier || "").toLowerCase();
      var cb = String(b.card.carrier || "").toLowerCase();
      return ca < cb ? -1 : ca > cb ? 1 : a.index - b.index;
    });
  } else if (sortBy === "created") {
    filtered.sort(function(a,b) {
      var da = a.card.createdAt || "";
      var db = b.card.createdAt || "";
      if (da < db) return 1;
      if (da > db) return -1;
      return a.index - b.index;
    });
  } else {
    filtered.sort(function(a,b) { return a.risk.rank - b.risk.rank || a.left - b.left || a.index - b.index; });
  }
  return filtered.map(function(o) { return o.card; });
}
function expiringSoonCards(cards, bd, thresh) {
  bd = bd || today();
  thresh = thresh || 30;
  return cards.map(function(c) {
    return { card:c, left:rawDaysLeft(c, bd) };
  }).filter(function(o) {
    return o.left >= 0 && o.left <= thresh;
  });
}

/* ======== CLIPBOARD HELPERS ======== */
async function safeCopy(text) {
  var v = String(text || "");
  if (!v) return { ok:false };
  try {
    if (typeof navigator !== "undefined" && navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(v);
      return { ok:true };
    }
  } catch(e) {}
  try {
    var ta = document.createElement("textarea");
    ta.value = v;
    ta.style.cssText = "position:fixed;left:-9999px;top:-9999px;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, v.length);
    var ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return { ok:ok };
  } catch(e) { return { ok:false }; }
}

function normalizeUrl(v) {

  if (s.indexOf("http://") === 0 || s.indexOf("https://") === 0) return s;
  if (/^[\w.-]+\.[a-z]{2,}(?:[/:?#].*)?$/i.test(s)) return "https://" + s;
  return "";
}
function normalizeImported(v, bd) {

  var seenIds = {};

function normalizeReminderDays(v) {
  var src = Array.isArray(v) ? v : String(v || "").split(",");
  var seen = {}, out = [];
  src.forEach(function(x) {
    var n = Math.floor(Number(String(x).trim()));
    if (Number.isFinite(n) && n >= 0 && n <= 365 && !seen[n]) { seen[n] = true; out.push(n); }

  out.sort(function(a,b) { return b - a; });

/* ======== CALENDAR EXPORT ENGINE ======== */
function icsEscape(v) {
  return String(v || "").replace(/\\/g,"\\\\").replace(/\r?\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");
}
function utf8Len(v) {
  v = String(v || "");
  if (typeof TextEncoder !== "undefined") return new TextEncoder().encode(v).length;
  return unescape(encodeURIComponent(v)).length;
}
function icsFold(line) {
  line = String(line || "");
  var result = "", chunk = "", chunkBytes = 0;
  for (var i = 0; i < line.length; i++) {
    var ch = line.charAt(i);
    var code = line.charCodeAt(i);
    if (code >= 0xD800 && code <= 0xDBFF && i + 1 < line.length) ch += line.charAt(++i);
    var chBytes = utf8Len(ch);
    if (chunk && chunkBytes + chBytes > 75) {
      result += (result ? "\r\n " : "") + chunk;
      chunk = ch;
      chunkBytes = chBytes;
    } else {
      chunk += ch;
      chunkBytes += chBytes;
    }
  }
  return result + (result && chunk ? "\r\n " : "") + chunk;
}
function icsUtcStamp(d) {
  d = d || new Date();
  var y = d.getUTCFullYear();
  var m = String(d.getUTCMonth()+1).padStart(2,"0");
  var da = String(d.getUTCDate()).padStart(2,"0");
  var h = String(d.getUTCHours()).padStart(2,"0");
  var mi = String(d.getUTCMinutes()).padStart(2,"0");
  var s = String(d.getUTCSeconds()).padStart(2,"0");
  return y + m + da + "T" + h + mi + s + "Z";
}
function genIcs(cards) {
  var now = icsUtcStamp();
  var lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ESIMremind//EN"];
  cards.forEach(function(c) {
    var exp = expiryFor(c);
    if (!validDate(exp)) return;
    var ds = iso(exp).replace(/-/g,"");
    var uid = "esim-" + c.id + "@esimremind";
    var desc = "Plan: " + (c.plan || "") + "\nPhone: " + (c.phone || "") + "\nCarrier: " + (c.carrier || "");
    lines.push("BEGIN:VEVENT");
    lines.push("UID:" + uid);
    lines.push("DTSTAMP:" + now);
    lines.push("DTSTART;VALUE=DATE:" + ds);
    lines.push("DTEND;VALUE=DATE:" + iso(addDays(exp, 1)).replace(/-/g, ""));
    lines.push("SUMMARY:" + icsEscape("eSIM Renewal - " + (c.carrier || "Unknown")));
    lines.push("DESCRIPTION:" + icsEscape(desc));
    lines.push("END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  return lines.map(icsFold).join("\r\n");
}
function downloadIcs(cards) {
  var blob = new Blob([genIcs(cards)], { type:"text/calendar;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "esim-renewals.ics";
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function DataManagementPage(p) {
  var t = p.t;
  var fileRef = useRef(null);
  var bkState = useState(function() { return loadBackups(); });
  var backups = bkState[0];
  var setBackups = bkState[1];
  var handleImport = useCallback(async function(e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    try {
      var text = await file.text();

    var out = [], errors = [];
    if (!src.length) errors.push(lang === "zh" ? "根内容必须是规则数组" : "Root must be a rule array");
    src.slice(0, 80).forEach(function(rule, i) {
      var row = i + 1;
      if (!rule || typeof rule !== "object") { errors.push("#" + row + ": " + (lang === "zh" ? "不是对象" : "not an object")); return; }
      var keys = Array.isArray(rule.keys) ? rule.keys : String(rule.keys || "").split(",");
      keys = keys.map(function(k) { return String(k || "").trim(); }).filter(Boolean);
      var dial = String(rule.dial || "").replace(/^\+/, "").trim();
      var days = Number(rule.days || 180);
      if (!keys.length) errors.push("#" + row + ": keys " + (lang === "zh" ? "不能为空" : "is required"));
      if (!/^\d{1,5}$/.test(dial)) errors.push("#" + row + ": dial " + (lang === "zh" ? "必须是 1-5 位数字" : "must be 1-5 digits"));
      if (!Number.isFinite(days) || days < 1 || days > 3650) errors.push("#" + row + ": days " + (lang === "zh" ? "必须是 1-3650" : "must be 1-3650"));
      if (rule.url && String(rule.url).indexOf("http://") !== 0 && String(rule.url).indexOf("https://") !== 0) errors.push("#" + row + ": url " + (lang === "zh" ? "必须以 http:// 或 https:// 开头" : "must start with http:// or https://"));
      if (keys.length && /^\d{1,5}$/.test(dial) && Number.isFinite(days) && days >= 1 && days <= 3650) {
        out.push(normalizeRule({ id:rule.id, keys:keys, dial:dial, days:days, url:rule.url || "", note:rule.note || "" }, i));
      }

              icon:h(I.CalendarDays, { size:20 }), tone:"amber",
              active:af==="expiring",
              onClick:function() { setAf("expiring"); } }),
            h(StatCard, { label:t.longTermCards, value:ltc, mobile:isMobile,
              icon:h(I.Check, { size:20 }), tone:"emerald",
              active:af==="longTerm",
              onClick:function() { setAf("longTerm"); } }),
            h(StatCard, { label:t.nextReminder, mobile:isMobile,

              caption:nc ? nc.carrier : undefined,
              icon:h(I.Bell, { size:20 }), tone:"sky",
              active:sid === (nc && nc.id) && af === "all",
              onClick:function() { setAf("all"); if (nc) { setSid(nc.id); if (isMobile) setDetailOpen(true); } } })
          ),

          /* Tag filters */
          h("section", { className:"panel", style:{ display:page !== "home" ? "none" : "block", padding:"8px 14px" } },
            h("div", { style:{ display:"flex", alignItems:"center", gap:8, overflowX:"auto", whiteSpace:"nowrap", scrollbarWidth:"none" } },

          },
            h("div", { className:"panel", style:{ padding:isMobile?14:20 } },
              h("div", { style:{ marginBottom:16, display:"flex",
                alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:10 }
              },
                h("div", null,
                  h("h3", { style:{ fontSize:20, fontWeight:700, color:"var(--text)" } }, t.cards),
                  h("p", { style:{ fontSize:14, color:"var(--muted)" } }, fc.length + " " + t.cards)

                h("div", { style:{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" } },
                  h("span", { style:{ fontSize:11, fontWeight:600, color:"var(--muted)", textTransform:"uppercase", letterSpacing:".05em" } }, t.sortBy),
                  ["risk","expiry","carrier","created"].map(function(opt) {
                    var active = sortBy === opt;
                    var label = t["sort" + opt.charAt(0).toUpperCase() + opt.slice(1)] || opt;
                    return h("button", { key:opt, type:"button", onClick:function() { setSortBy(opt); },
                      style:{ height:28, padding:"0 10px", borderRadius:999, border:"1px solid " + (active ? "rgba(59,130,246,.55)" : "var(--btn-border)"),
                        background:active ? "var(--sky-light)" : "var(--btn-bg)", color:active ? "var(--sky-bg)" : "var(--btn-text)",
                        cursor:"pointer", fontSize:11, fontWeight:active?700:500, whiteSpace:"nowrap" }
                    }, label);
                  }),
                  (isFiltered || sortBy !== "risk") ? h("button", { type:"button", onClick:clearFilters, style:{ height:40,
                    padding:"0 16px", borderRadius:12, border:"1px solid var(--btn-border)",
                    background:"var(--btn-bg)", cursor:"pointer", fontSize:14, fontWeight:600,
                    color:"var(--btn-text)", display:"inline-flex", alignItems:"center", gap:8 }
                  }, h(I.ListFilter, { size:16 }), " ", t.clearFilters) : null
                )
              ),
              h("div", { style:{ display:"grid", gap:16,
                gridTemplateColumns: winW >= C.BREAKPOINT_WIDE_GRID ? "1fr 1fr" : "1fr" }
              },
                fc.length === 0
                  ? h(EmptyState, { cards:cards, t:t, openAdd:openAdd, clearFilters:clearFilters })
                  : fc.map(function(card) {
                      return h(EsimCard, {
                        key:card.id, card:card, t:t, selected:sc && sc.id === card.id,
                        todayDate:td, hiddenPhones:hidden,
                        onSelect:function() { setSid(card.id); if (isMobile) setDetailOpen(true); },
                        onEdit:function() { setModal({ type:"edit", card:Object.assign({}, card) }); },
                        onDelete:function() { deleteCard(card.id); }
                      });
                    })
              )
            ),
            !isMobile ? h(DetailPanel, {
              card:sc, t:t, todayDate:td, hiddenPhones:hidden,
              setHiddenPhones:setHidden,
              onEdit:function() {
                if (sc) setModal({ type:"edit", card:Object.assign({}, sc) });
              },
              onCopyPhone:copyPhone,
              onRenew:renewCard
            }) : null
          )
        ),
        !sidebarVisible ? h("nav", { style:{ position:"fixed", left:16, right:16, bottom:"calc(14px + env(safe-area-inset-bottom))", zIndex:120,
          display:"grid", gridTemplateColumns:"repeat(2, 1fr)", gap:6, padding:"8px 8px calc(8px + env(safe-area-inset-bottom))",
          borderRadius:18, border:"1px solid var(--panel-border)", background:"var(--panel-bg)",
          boxShadow:"0 18px 48px rgba(0,0,0,.28)" } },
          [["home", t.home, I.Home], ["settings", t.settings, I.Settings]].map(function(item) {
            var active = page === item[0];
            var label = ({"home":lang==="zh"?"首页":"Home","settings":lang==="zh"?"设置":"Settings"})[item[0]] || item[1];
            var Icon = item[2];
            return h("button", { key:item[0], type:"button", onClick:function() { setDetailOpen(false); setPage(item[0]); },
              style:{ height:48, borderRadius:13, border:"1px solid " + (active ? "rgba(59,130,246,.45)" : "transparent"),
                background:active ? "rgba(59,130,246,.10)" : "transparent", color:active ? "#3b82f6" : "var(--muted)",
                display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:3,
                fontSize:11, fontWeight:700, cursor:"pointer" } },
              h(Icon, { size:16 }), h("span", { style:{ maxWidth:"100%", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" } }, label)
            );
          })
        ) : null,
        isMobile && page === "home" ? h("button", { type:"button", onClick:openAdd,
          style:{ position:"fixed", right:22, bottom:"calc(92px + env(safe-area-inset-bottom))", zIndex:130,
            width:58, height:58, borderRadius:999, border:"none", cursor:"pointer",
            background:"var(--sky-bg)", color:"#fffaf5", display:"grid", placeItems:"center",
            boxShadow:"0 18px 42px rgba(59,130,246,.36)" }
        }, h(I.CirclePlus, { size:26 })) : null
      ),

      isMobile && detailOpen && sc ? h("div", { onClick:function() { setDetailOpen(false); },
        style:{ position:"fixed", inset:0, zIndex:140, background:"rgba(0,0,0,.42)",
          display:"flex", alignItems:"flex-end", justifyContent:"center" }
      },
        h("div", { onClick:function(e) { e.stopPropagation(); },
          style:{ width:"100%", maxHeight:"calc(100vh - 54px)", overflowY:"auto",
            borderRadius:"24px 24px 0 0", background:"var(--panel-bg)",
            border:"1px solid var(--panel-border)", boxShadow:"0 -24px 70px rgba(0,0,0,.35)",
            padding:"10px 12px calc(18px + env(safe-area-inset-bottom))" }
        },
          h("div", { style:{ position:"sticky", top:0, zIndex:2, display:"flex", alignItems:"center",
            padding:"4px 16px 10px", background:"var(--panel-bg)" } },
            h("span", { style:{ flex:1 } }),
            h("button", { type:"button", onClick:function() { setDetailOpen(false); },
              style:{ width:54, height:5, borderRadius:999, border:"none", background:"var(--muted)", opacity:.35, cursor:"pointer" },
              "aria-label":t.close }),
            h("span", { style:{ flex:1, display:"flex", justifyContent:"flex-end" } },
              h("button", { type:"button", onClick:function() { setDetailOpen(false); },
                style:{ width:32, height:32, display:"grid", placeItems:"center", borderRadius:999,
                  border:"1px solid var(--btn-border)", background:"var(--btn-bg)", cursor:"pointer", color:"var(--btn-text)" }
              }, h(I.X, { size:16 }))
            )
          ),
          h(DetailPanel, {
            card:sc, t:t, todayDate:td, hiddenPhones:hidden, sheetMode:true,
            setHiddenPhones:setHidden,
            onEdit:function() { if (sc) { setDetailOpen(false); setModal({ type:"edit", card:Object.assign({}, sc) }); } },
            onCopyPhone:copyPhone,
            onRenew:renewCard
          })
        )
      ) : null,

      /* Toast & Modals */
      toast ? h(ToastItem, { key:toast.id, state:toast, onDismiss:function() { setToast(null); } }) : null,
      modal && modal.type === "edit"
        ? h(EditModal, {
            key:"edit-" + (modal.card ? modal.card.id : Date.now()),
            t:t, sheet:modal, onClose:function() { setModal(null); },
            saveCard:saveCard, lang:lang
          })
        : null
    )
  );
}

/* ======== ERROR BOUNDARY (ES5 class component) ======== */
var ErrorBoundary = function(props) {
  React.Component.call(this, props);
  this.state = { hasError:false, error:null };
};
ErrorBoundary.prototype = Object.create(React.Component.prototype);
ErrorBoundary.prototype.constructor = ErrorBoundary;
ErrorBoundary.getDerivedStateFromError = function(error) {
  return { hasError:true, error:error };
};
ErrorBoundary.prototype.render = function() {
  if (this.state.hasError) {
    return h("div", { style:{ padding:40, textAlign:"center", color:"#ef4444", fontFamily:"sans-serif" } },
      h("h2", { style:{ fontSize:24, fontWeight:700, marginBottom:16 } }, "Something went wrong"),
      h("pre", { style:{ textAlign:"left", maxWidth:600, margin:"20px auto", background:"#1a1a1a", padding:20, borderRadius:12, overflow:"auto", fontSize:13, color:"#e5e7eb" } },
        this.state.error && this.state.error.message ? this.state.error.message : "Unknown error"
      ),
      h("button", {
        onClick:function() { this.setState({ hasError:false, error:null }); }.bind(this),
        style:{ marginTop:16, padding:"10px 20px", borderRadius:12, border:"none", background:"#3b82f6", color:"white", cursor:"pointer", fontSize:14, fontWeight:600 }
      }, "Try again")
    );
  }
  return this.props.children;
};

/* ======== MOUNT ======== */
try {
  applyTheme(loadTheme());
  var root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(
    h(ErrorBoundary, null,
      h(PickerProvider, null, h(App))
    )
  );
} catch(e) {
  var rootEl = document.getElementById("root");
  var wrap = document.createElement("div");
  wrap.style.cssText = "padding:40px;text-align:center;color:#ef4444;font-family:sans-serif";
  var title = document.createElement("h2");
  title.textContent = "Error";
  var pre = document.createElement("pre");
  pre.style.cssText = "text-align:left;max-width:600px;margin:20px auto;background:#1a1a1a;padding:20px;border-radius:12px;overflow:auto";
  pre.textContent = e && e.message ? e.message : "Syntax error - check browser console (F12) for details";
  wrap.appendChild(title);
  wrap.appendChild(pre);
  rootEl.textContent = "";
  rootEl.appendChild(wrap);
  console.error("Mount error:", e);
}
</script>
