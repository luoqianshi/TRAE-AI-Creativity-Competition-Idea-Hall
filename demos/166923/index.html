<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>走起 - 周末引力</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ==================== 导航栏 ==================== -->
  <nav id="navbar" class="hidden">
    <div class="nav-left">
      <button id="back-btn" class="icon-btn hidden">←</button>
    </div>
    <div class="nav-title">走起</div>
    <div class="nav-right">
      <button class="icon-btn" onclick="showPage('home')">⌂</button>
    </div>
  </nav>

  <!-- ==================== 首页 ==================== -->
  <section id="page-home" class="page active">
    <div class="home-bg"></div>
    <div class="home-content">
      <div class="logo-area">
        <div class="logo-mark">走起</div>
        <h1 class="slogan">周末去哪？<br>AI 帮你 3 秒决定</h1>
        <p class="sub-slogan">过滤广告 · 真实体验 · 实时可用</p>
      </div>

      <div class="input-area">
        <div class="inspiration-input-wrap">
          <input type="text" id="inspiration-input" placeholder="告诉我，你现在想干嘛？" autocomplete="off">
          <button id="search-btn" class="btn-primary">生成方案</button>
        </div>
        <div class="quick-tags">
          <span class="quick-tag" data-text="想和朋友聚聚，吃点好的">🍻 朋友小聚</span>
          <span class="quick-tag" data-text="想一个人静静，找个地方发呆">☕ 独处放空</span>
          <span class="quick-tag" data-text="带娃出门，希望能轻松一点">👶 亲子遛娃</span>
          <span class="quick-tag" data-text="第一次约会，想要浪漫一点">💕 浪漫约会</span>
          <span class="quick-tag" data-text="想运动一下，户外或者室内都行">🏃 运动健身</span>
          <span class="quick-tag" data-text="来上海旅游，想体验本地生活">🎒 游客探索</span>
        </div>
      </div>

      <div class="mode-selector">
        <div class="mode-title">选择你的模式</div>
        <div class="mode-grid">
          <div class="mode-card active" data-mode="friends">
            <div class="mode-icon">🍻</div>
            <div class="mode-name">朋友聚会</div>
          </div>
          <div class="mode-card" data-mode="alone">
            <div class="mode-icon">☕</div>
            <div class="mode-name">一个人</div>
          </div>
          <div class="mode-card" data-mode="family">
            <div class="mode-icon">👨‍👩‍👧</div>
            <div class="mode-name">亲子遛娃</div>
          </div>
          <div class="mode-card" data-mode="date">
            <div class="mode-icon">💕</div>
            <div class="mode-name">约会</div>
          </div>
        </div>
      </div>

      <div class="home-footer">
        <div class="trust-badge">
          <span class="dot green"></span> 基于 12,000+ 条真实用户内容
        </div>
      </div>
    </div>
  </section>

  <!-- ==================== 加载页 ==================== -->
  <section id="page-loading" class="page">
    <div class="loading-content">
      <div class="ai-orb">
        <div class="orb-ring"></div>
        <div class="orb-core"></div>
      </div>
      <div class="loading-text">AI 正在为你规划…</div>
      <div class="loading-steps">
        <div class="l-step" id="l-step1">分析你的偏好</div>
        <div class="l-step" id="l-step2">过滤广告内容</div>
        <div class="l-step" id="l-step3">匹配实时数据</div>
        <div class="l-step" id="l-step4">生成专属方案</div>
      </div>
    </div>
  </section>

  <!-- ==================== 结果页 ==================== -->
  <section id="page-results" class="page">
    <div class="results-header">
      <div class="results-title">为你找到 <strong>3</strong> 个方案</div>
      <div class="results-meta">基于真实用户内容 · 实时数据校验</div>
    </div>
    <div class="results-list" id="results-list"></div>
  </section>

  <!-- ==================== 详情页 ==================== -->
  <section id="page-detail" class="page">
    <div id="detail-content"></div>
  </section>

  <!-- ==================== 真实度报告弹窗 ==================== -->
  <div id="auth-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <div class="modal-header">
        <h3>真实度分析报告</h3>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>
      <div id="auth-modal-body"></div>
    </div>
  </div>

</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
