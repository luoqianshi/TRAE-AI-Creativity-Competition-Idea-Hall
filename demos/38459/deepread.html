<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DeepRead · 读到看不懂的地方,划一下就讲清楚</title>
<meta name="description" content="本地优先的自学阅读器。导入 PDF、网页或 Markdown,划词即得生动讲解:文字、交互演示、类比、逐步拆解、延伸阅读。讲解按页留存,随时回看。数据在你自己的机器上。" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ 设计令牌:暖色单色 + 克制的语义色(对齐 HyperDeck)============ */
:root{
  --paper:#FBFBFA; --paper-2:#F7F6F3; --white:#FFFFFF;
  --ink:#1A1714; --ink-2:#2F2B27; --muted:#7A7268; --faint:#A8A096;
  --line:#EAE7E1; --line-2:#E2DED7;
  /* 五种讲法的语义色(成对 bg/ink),只在"讲法"语境出现 */
  --green-bg:#EBF1EA; --green-ink:#3C6240;
  --blue-bg:#E6F0F6;  --blue-ink:#2A6585;
  --amber-bg:#F8F0DC; --amber-ink:#8A6209;
  --violet-bg:#EEE9F6;--violet-ink:#5E468F;
  --rose-bg:#FBEAE7;  --rose-ink:#9F3B2D;
  --serif:'Newsreader','Songti SC','Noto Serif SC',Georgia,serif;
  --sans:'Instrument Sans','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --maxw:1080px; --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
a{color:inherit;text-decoration:none}
::selection{background:var(--ink);color:var(--paper)}
.ambient{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(58% 48% at 80% 6%, rgba(42,101,133,.045), transparent 70%),
  radial-gradient(52% 42% at 10% 32%, rgba(159,59,45,.028), transparent 70%)}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}
section{padding:112px 0}
.eyebrow{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);display:inline-flex;align-items:center;gap:9px}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--line-2)}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.02em;line-height:1.08}
h2{font-size:clamp(30px,4.6vw,50px)}
h3{font-size:21px;letter-spacing:-.01em}
em{font-style:italic;color:var(--blue-ink)}
.lead{font-size:19px;color:var(--ink-2);line-height:1.62;max-width:62ch}
.muted{color:var(--muted)}
.shead{max-width:64ch}
.shead h2{margin-top:18px}
.shead .lead{margin-top:18px}

.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-size:15px;font-weight:500;
  padding:12px 20px;border-radius:7px;border:1px solid transparent;cursor:pointer;
  transition:transform .18s var(--ease),background .2s,border-color .2s,color .2s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-primary:hover{background:#332e29}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn-ghost:hover{background:var(--paper-2);border-color:var(--faint)}
.btn .ic{width:17px;height:17px}
.tag{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;font-weight:500;
  letter-spacing:.06em;text-transform:uppercase;padding:4px 11px;border-radius:9999px}
.tag .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.t-green{background:var(--green-bg);color:var(--green-ink)} .t-blue{background:var(--blue-bg);color:var(--blue-ink)}
.t-amber{background:var(--amber-bg);color:var(--amber-ink)} .t-violet{background:var(--violet-bg);color:var(--violet-ink)}
.t-rose{background:var(--rose-bg);color:var(--rose-ink)}

/* ============ 导航 ============ */
.nav{position:sticky;top:0;z-index:50;background:rgba(251,251,250,.78);backdrop-filter:saturate(140%) blur(12px);
  border-bottom:1px solid transparent;transition:border-color .3s}
.nav.scrolled{border-bottom-color:var(--line)}
.nav-in{max-width:var(--maxw);margin:0 auto;padding:0 28px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:22px;letter-spacing:-.02em}
.brand .mk{width:24px;height:24px}
.nav-links{display:flex;align-items:center;gap:28px}
.nav-links a{font-size:14.5px;color:var(--muted);transition:color .2s}
.nav-links a:hover{color:var(--ink)}
.nav-cta{display:flex;align-items:center;gap:10px}
.lang{font-family:var(--mono);font-size:12px;font-weight:500;border:1px solid var(--line-2);background:var(--white);
  color:var(--ink-2);border-radius:7px;height:38px;padding:0 12px;cursor:pointer;transition:border-color .2s}
.lang:hover{border-color:var(--faint)}
@media(max-width:820px){.nav-links{display:none}}

/* ============ HERO ============ */
.hero{padding:84px 0 56px;text-align:center}
.hero .eyebrow{justify-content:center}
.hero h1{font-size:clamp(40px,6.6vw,76px);line-height:1.04;letter-spacing:-.035em;margin-top:22px}
.hero .lead{margin:24px auto 0;text-align:center;font-size:20px;max-width:54ch}
.hero-cta{margin-top:32px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.hero-meta{margin-top:24px;font-family:var(--mono);font-size:12px;color:var(--faint);
  display:flex;gap:8px 20px;justify-content:center;flex-wrap:wrap}
.hero-meta span{display:inline-flex;align-items:center;gap:7px}
.hero-meta .gd{width:5px;height:5px;border-radius:50%;background:var(--green-ink)}

/* ---- 真实可交互的窗口(非假截图)---- */
.window{margin:60px auto 0;max-width:980px;border:1px solid var(--line-2);border-radius:13px;overflow:hidden;
  background:var(--white);box-shadow:0 1px 2px rgba(0,0,0,.03),0 26px 60px -30px rgba(26,23,20,.28)}
.win-bar{display:flex;align-items:center;gap:13px;height:44px;padding:0 16px;background:var(--paper-2);border-bottom:1px solid var(--line)}
.win-dots{display:flex;gap:7px}.win-dots i{width:11px;height:11px;border-radius:50%;background:#D6D1C8;display:block}
.win-url{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.win-url svg{width:13px;height:13px;color:var(--blue-ink)}
.win-body{position:relative;padding:34px 36px 30px;text-align:left}
.demo-read{font-family:var(--serif);font-size:21px;line-height:1.95;color:var(--ink)}
.hl{cursor:pointer;border-bottom:2px solid var(--blue-ink);padding-bottom:1px;
  background:linear-gradient(var(--blue-bg),var(--blue-bg)) no-repeat;background-size:100% 0;background-position:0 100%;
  transition:background-size .25s}
.hl:hover{background-size:100% 100%}
.demo-hint{margin-top:18px;font-family:var(--mono);font-size:12px;color:var(--faint);display:flex;align-items:center;gap:7px}
.demo-hint svg{width:14px;height:14px}
.sel-pill{position:absolute;z-index:8;transform:translate(-50%,-118%);background:var(--ink);color:var(--paper);border:0;
  border-radius:9999px;padding:8px 15px;font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;
  box-shadow:0 10px 30px rgba(26,23,20,.3);display:none;align-items:center;gap:7px;white-space:nowrap}
.sel-pill::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--ink)}
.sel-pill svg{width:14px;height:14px}
.ex-card{border-top:1px solid var(--line);background:var(--paper-2);padding:22px 36px 26px;display:none}
.ex-card.show{display:block;animation:rise .5s var(--ease)}
@media(prefers-reduced-motion:reduce){.ex-card.show{animation:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ex-h{font-family:var(--serif);font-size:21px;margin:13px 0 9px;letter-spacing:-.01em}
.ex-b{color:var(--ink-2);font-size:15.5px;line-height:1.7}
.ex-svg{margin-top:16px;width:100%;height:120px;display:block}

/* ============ 能力条 ============ */
.strip{padding:34px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper-2)}
.strip-in{display:flex;align-items:center;justify-content:center;gap:14px 34px;flex-wrap:wrap;
  font-family:var(--mono);font-size:12.5px;color:var(--muted);letter-spacing:.02em}
.strip-in .lbl{color:var(--faint);text-transform:uppercase;letter-spacing:.14em;font-size:11px}
.strip-in b{color:var(--ink-2);font-weight:500;display:inline-flex;align-items:center;gap:7px}
.strip-in b svg{width:15px;height:15px;color:var(--muted)}

/* ============ 理念(2 栏)============ */
.shift{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:50px}
.scard{border:1px solid var(--line);border-radius:13px;background:var(--white);padding:32px}
.scard .k{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue-ink)}
.scard h3{margin:14px 0 11px}
.scard p{font-size:15.5px;color:var(--muted);line-height:1.66}
.scard p+p{margin-top:11px}
.scard b{color:var(--ink-2);font-weight:600}
@media(max-width:760px){.shift{grid-template-columns:1fr}}

/* ============ 五种讲法(bento)============ */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:18px;margin-top:50px}
.card{border:1px solid var(--line);border-radius:13px;background:var(--white);padding:28px;transition:box-shadow .25s,border-color .25s,transform .25s}
.card:hover{box-shadow:0 2px 16px rgba(26,23,20,.06);border-color:var(--line-2);transform:translateY(-2px)}
.card h3{margin:13px 0 8px}
.card p{font-size:14.5px;color:var(--muted);line-height:1.62}
.card b{color:var(--ink-2);font-weight:600}
.c-6{grid-column:span 6}.c-3{grid-column:span 3}.c-2{grid-column:span 2}
.card.wide{display:flex;gap:34px;align-items:center}
.card.wide .ctext{flex:1}.card.wide .cside{flex:none;width:300px}
.card.wide .big-art{width:100%;height:130px}
@media(max-width:880px){.bento{grid-template-columns:repeat(2,1fr)}.c-6,.c-3,.c-2{grid-column:span 2}
  .card.wide{flex-direction:column;align-items:flex-start}.card.wide .cside{width:100%}}
@media(max-width:520px){.bento{grid-template-columns:1fr}.c-6,.c-3,.c-2{grid-column:span 1}}

/* ============ 阅读流(host 2 栏)============ */
.host{display:grid;grid-template-columns:1.02fr .98fr;gap:54px;align-items:center;margin-top:50px}
.host-feats{list-style:none;display:flex;flex-direction:column;gap:22px}
.host-feats li{display:flex;gap:15px}
.host-feats .hic{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--white);
  display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.host-feats .hic svg{width:19px;height:19px}
.host-feats h3{font-size:16.5px;font-family:var(--sans);font-weight:600;letter-spacing:0;margin-bottom:4px}
.host-feats p{font-size:14.5px;color:var(--muted);line-height:1.55}
/* 资料库可视化(真实生成的花纹封面)*/
.lib{border:1px solid var(--line-2);border-radius:13px;background:var(--paper-2);padding:22px;box-shadow:0 20px 50px -34px rgba(26,23,20,.3)}
.lib-h{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:16px}
.lib-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.libcard{background:var(--white);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.libcard svg{width:100%;height:104px;display:block;border-bottom:1px solid var(--line)}
.libcard .meta{padding:9px 11px}
.libcard .nm{font-size:12.5px;color:var(--ink-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.libcard .bd{margin-top:6px;display:inline-flex;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:9999px}
@media(max-width:820px){.host{grid-template-columns:1fr;gap:38px}}

/* ============ 本地(深色中心区)============ */
.tech{background:var(--ink);color:#EDE9E2}
.tech .eyebrow{color:#9C9488}.tech .eyebrow::before{background:#3A352F}
.tech h2{color:#FBFBFA}.tech .lead{color:#C3BCB1}
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:50px}
.node{border:1px solid #353029;border-radius:12px;padding:22px;background:#211D19;position:relative}
.node .ni{font-family:var(--mono);font-size:11px;color:#8B8377;letter-spacing:.1em}
.node .nt{font-family:var(--serif);font-size:19px;margin:9px 0 7px;color:#FBFBFA}
.node p{font-size:13px;color:#A49C90;line-height:1.5}
.node .arrow{position:absolute;right:-11px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#4A443C;z-index:2}
.node:last-child .arrow{display:none}
.tech-points{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:24px;margin-top:46px;align-items:end}
.tp{border-top:1px solid #35302A;padding-top:18px}
.tp .tpn{font-family:var(--serif);font-size:34px;color:#F4B9A8}
.tp h3{color:#FBFBFA;font-size:15px;margin:7px 0 5px;font-family:var(--sans);font-weight:600;letter-spacing:0}
.tp p{font-size:12.5px;color:#A49C90;line-height:1.5}
.codewrap{margin-top:14px;border:1px solid #35302A;border-radius:12px;overflow:hidden;background:#1E1A16}
.codewrap .ctab{display:flex;align-items:center;gap:9px;padding:11px 16px;border-bottom:1px solid #2C2722;font-family:var(--mono);font-size:12px;color:#8B8377}
.codewrap pre{font-family:var(--mono);font-size:13px;line-height:1.85;color:#CFC8BC;padding:18px;overflow-x:auto}
.codewrap pre .c{color:#6E665C}.codewrap pre .b{color:#9DBBD0}
@media(max-width:820px){.pipe{grid-template-columns:1fr 1fr}.node .arrow{display:none}.tech-points{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.pipe{grid-template-columns:1fr}.tech-points{grid-template-columns:1fr}}

/* ============ 对比表 ============ */
.tableC{margin-top:46px;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--white)}
.trow{display:grid;grid-template-columns:1.4fr 1fr 1fr;align-items:stretch}
.trow+.trow{border-top:1px solid var(--line)}
.tcell{padding:16px 22px;font-size:14.5px;display:flex;align-items:center;gap:9px}
.tcell.feat{color:var(--ink-2);font-weight:500}
.thead{background:var(--paper-2)}
.thead .tcell{padding:16px 22px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.col-dr{background:#F2F6F8;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.thead .col-dr{color:var(--blue-ink)}
.tcell .ti{width:17px;height:17px;flex:none}
.tcell.yes .ti{color:var(--green-ink)}
.tcell.no{color:var(--faint)}.tcell.no .ti{color:var(--faint)}
@media(max-width:680px){.tcell{padding:13px 13px;font-size:13px}.thead .tcell{padding:13px 13px}}

/* ============ 步骤 ============ */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:50px}
.step .sn{font-family:var(--mono);font-size:12px;color:var(--blue-ink);letter-spacing:.1em}
.step h3{font-size:18px;margin:11px 0 8px}
.step p{font-size:14px;color:var(--muted);line-height:1.55}
.step .bar{height:2px;background:var(--line);margin-bottom:18px;position:relative;border-radius:2px}
.step .bar::before{content:"";position:absolute;left:0;top:0;height:100%;width:26px;background:var(--ink);border-radius:2px}
@media(max-width:820px){.steps{grid-template-columns:1fr 1fr;gap:28px}}
@media(max-width:460px){.steps{grid-template-columns:1fr}}

/* ============ FAQ ============ */
.faq{max-width:760px;margin:46px auto 0}
.qa{border-bottom:1px solid var(--line)}
.qa button{width:100%;background:none;border:none;cursor:pointer;text-align:left;display:flex;align-items:center;
  justify-content:space-between;gap:20px;padding:23px 4px;font-family:var(--serif);font-size:19px;color:var(--ink);letter-spacing:-.01em}
.qa .pm{width:20px;height:20px;flex:none;color:var(--muted);transition:transform .3s var(--ease)}
.qa .ans{max-height:0;overflow:hidden;transition:max-height .4s var(--ease)}
.qa .ans-in{padding:0 4px 23px;font-size:15px;color:var(--muted);line-height:1.66;max-width:64ch}
.qa.open .pm{transform:rotate(45deg)}

/* ============ CTA ============ */
.cta{text-align:center}
.cta h2{font-size:clamp(34px,5.4vw,60px);letter-spacing:-.03em}
.cta .lead{margin:20px auto 0;text-align:center}
.cta-btns{margin-top:32px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.cta-note{margin-top:18px;font-family:var(--mono);font-size:12px;color:var(--faint)}

/* ============ 页脚 ============ */
footer{border-top:1px solid var(--line);padding:54px 0 60px}
.foot{display:flex;justify-content:space-between;gap:40px;flex-wrap:wrap}
.fcol{display:flex;flex-direction:column;gap:11px}
.fcol .ft{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.foot a{font-size:14.5px;color:var(--muted);transition:color .2s}.foot a:hover{color:var(--ink)}
.foot-brand{max-width:300px}.foot-brand .brand{margin-bottom:12px}
.foot-brand p{font-size:14px;color:var(--muted);line-height:1.55}
.foot-base{max-width:var(--maxw);margin:46px auto 0;padding:22px 28px 0;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;color:var(--faint)}

/* ============ 滚动揭示 ============ */
.reveal{opacity:0;transform:translateY(12px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="ambient"></div>

<!-- ============ 导航 ============ -->
<nav class="nav" id="nav">
  <div class="nav-in">
    <a class="brand" href="#top">
      <svg class="mk" viewBox="0 0 32 32" fill="none" aria-hidden="true"><defs><linearGradient id="og" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3E86AC"/><stop offset="1" stop-color="#1F4D67"/></linearGradient></defs><circle cx="16" cy="16" r="13" stroke="url(#og)" stroke-width="2.2"/><path d="M9 16c3-5 11-5 14 0" stroke="url(#og)" stroke-width="2.2" stroke-linecap="round"/><circle cx="16" cy="16" r="3.1" fill="url(#og)"/></svg>
      DeepRead
    </a>
    <div class="nav-links">
      <a href="#idea" data-i18n="nav.idea"></a>
      <a href="#modes" data-i18n="nav.modes"></a>
      <a href="#flow" data-i18n="nav.flow"></a>
      <a href="#local" data-i18n="nav.local"></a>
      <a href="#faq" data-i18n="nav.faq"></a>
    </div>
    <div class="nav-cta">
      <button class="lang" id="langBtn">EN</button>
      <a class="btn btn-ghost" href="https://github.com/0x-CryptoPriest/deepread" target="_blank" rel="noopener" data-i18n="nav.source"></a>
      <a class="btn btn-primary" href="https://github.com/0x-CryptoPriest/deepread" target="_blank" rel="noopener" data-i18n="nav.run"></a>
    </div>
  </div>
</nav>

<!-- ============ HERO ============ -->
<header class="hero" id="top">
  <div class="wrap">
    <span class="eyebrow reveal" data-i18n="hero.kicker"></span>
    <h1 class="reveal" data-i18n-html="hero.h1"></h1>

      svg.innerHTML=s;
    } else {

  }
  const page=$("#demoPage"), pill=$("#selPill"); let selKey=null;
  $("#demoText").addEventListener("mouseup",()=>setTimeout(()=>{
    const sel=window.getSelection(); const txt=(sel&&sel.toString()||"").trim();
    if(txt.length<2){ pill.style.display="none"; return; }
    const r=sel.getRangeAt(0).getBoundingClientRect(), pr=page.getBoundingClientRect();
    pill.style.left=(r.left-pr.left+r.width/2)+"px"; pill.style.top=(r.top-pr.top)+"px"; pill.style.display="inline-flex";
    const low=txt.toLowerCase();
    selKey=(low.includes("注意")||low.includes("attention"))?"attn":(low.includes("上下文")||low.includes("context"))?"ctx":"attn";
  },1));
  pill.addEventListener("click",()=>{ openExpl(selKey||"attn"); const s=window.getSelection&&window.getSelection(); s&&s.removeAllRanges&&s.removeAllRanges(); });
  document.addEventListener("mousedown",e=>{ if(!e.target.closest("#demoPage")) pill.style.display="none"; });

  /* FAQ 手风琴 */
  function renderFAQ(){
    const host=$("#faqList"); host.innerHTML="";
    FAQ[lang].forEach(([q,a])=>{
      const d=document.createElement("div"); d.className="qa";
      d.innerHTML=`<button><span>${q}</span><svg class="pm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button><div class="ans"><div class="ans-in">${a}</div></div>`;
      const btn=d.querySelector("button"), ans=d.querySelector(".ans");
      btn.addEventListener("click",()=>{ const open=d.classList.toggle("open");
        ans.style.maxHeight = open ? ans.scrollHeight+"px" : "0"; });
      host.appendChild(d);
    });
  }

  /* 真实生成的几何封面(产品本体花纹风格)*/
  function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  function cover(seed,hue){
    const S=120,N=5,c=S/N,r=mulberry(seed); const bg=`hsl(${hue} 30% 93%)`, fg=`hsl(${hue} 40% 42%)`;
    let s=`<svg viewBox="0 0 ${S} ${S}" xmlns="http://www.w3.org/2000/svg"><rect width="${S}" height="${S}" fill="${bg}"/>`;
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){const ox=x*c,oy=y*c;
      if(Math.floor(r()*2)===0){ s+=`<path d="M${ox} ${oy+c} A${c} ${c} 0 0 1 ${ox+c} ${oy}" stroke="${fg}" stroke-width="2" fill="none" opacity=".8"/><path d="M${ox} ${oy} A${c} ${c} 0 0 1 ${ox+c} ${oy+c}" stroke="${fg}" stroke-width="2" fill="none" opacity=".34"/>`; }
      else{ s+=`<path d="M${ox} ${oy} A${c} ${c} 0 0 0 ${ox+c} ${oy+c}" stroke="${fg}" stroke-width="2" fill="none" opacity=".8"/><path d="M${ox} ${oy+c} A${c} ${c} 0 0 0 ${ox+c} ${oy}" stroke="${fg}" stroke-width="2" fill="none" opacity=".34"/>`; }
    }
    return s+`</svg>`;
  }
  const LIB=[["transformer.pdf",14,"PDF","t-rose"],["arxiv.org/abs",202,"WEB","t-blue"],["notes.md",150,"MD","t-green"]];
  $("#libGrid").innerHTML = LIB.map(([nm,hue,bd,cls])=>
    `<div class="libcard">${cover(nm.length*7+hue,hue)}<div class="meta"><div class="nm">${nm}</div><span class="bd ${cls}">${bd}</span></div></div>`).join("");

  /* 滚动揭示 + 导航描边 */
  if(matchMedia("(prefers-reduced-motion:no-preference)").matches){
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.12});
    $$(".reveal").forEach(el=>io.observe(el));
  } else { $$(".reveal").forEach(el=>el.classList.add("in")); }
  const nav=$("#nav"); const onScroll=()=>nav.classList.toggle("scrolled",window.scrollY>8);
  addEventListener("scroll",onScroll,{passive:true}); onScroll();

  apply();
})();
</script>
</body>
</html>
