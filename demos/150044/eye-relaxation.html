<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌿 眼睛放松 - 绿色视觉休息</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

  :root {
    --green-dark: #1a4d2e;
    --green-mid: #2d8a56;
    --green-light: #4ade80;
    --green-pale: #bbf7d0;
    --green-bg: #0a1f14;
    --green-glow: #22c55e;
    --leaf-1: #16a34a;
    --leaf-2: #15803d;
    --leaf-3: #22c55e;
    --leaf-4: #4ade80;
    --accent: #86efac;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--green-bg);
    color: var(--green-pale);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    cursor: none;
  }

  /* === 全屏 Canvas 层 === */
  #mainCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }

  /* === 绿色植物 SVG 层 === */
  .plants-layer {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
    opacity: 0.35;
  }

  .plant-group {
    position: absolute;
    animation: plantSway 8s ease-in-out infinite;
  }

  @keyframes plantSway {
    0%, 100% { transform: rotate(-2deg) translateY(0); }
    25% { transform: rotate(1deg) translateY(-3px); }
    50% { transform: rotate(2deg) translateY(-1px); }
    75% { transform: rotate(-1deg) translateY(-4px); }
  }

  /* === 控制面板 === */
  .controls {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    gap: 16px;
    align-items: center;
    background: rgba(10, 31, 20, 0.7);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(74, 222, 128, 0.15);
    border-radius: 60px;
    padding: 12px 28px;
    opacity: 0;
    animation: fadeInUp 1s ease 0.5s forwards;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateX(-50%) translateY(20px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  .controls button {
    background: rgba(34, 197, 94, 0.15);
    border: 1px solid rgba(74, 222, 128, 0.25);
    color: var(--accent);
    padding: 10px 20px;
    border-radius: 40px;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    white-space: nowrap;
  }

  .controls button:hover {
    background: rgba(34, 197, 94, 0.3);
    border-color: rgba(74, 222, 128, 0.5);
    box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
  }

  .controls button.active {
    background: rgba(34, 197, 94, 0.4);
    border-color: var(--green-light);
    box-shadow: 0 0 25px rgba(34, 197, 94, 0.3);
  }

  /* === 呼吸引导 === */
  .breath-guide {
    position: fixed;
    bottom: 110px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    text-align: center;
    pointer-events: none;
  }

  .breath-circle {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 2px solid rgba(74, 222, 128, 0.3);
    margin: 0 auto 8px;
    animation: breathe 8s ease-in-out infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: rgba(134, 239, 172, 0.6);
    letter-spacing: 1px;
  }

  @keyframes breathe {
    0%, 100% {
      transform: scale(0.6);
      border-color: rgba(74, 222, 128, 0.15);
      background: rgba(34, 197, 94, 0.02);
    }
    25% {
      transform: scale(1);
      border-color: rgba(74, 222, 128, 0.4);
      background: rgba(34, 197, 94, 0.08);
    }
    50% {
      transform: scale(0.6);
      border-color: rgba(74, 222, 128, 0.15);
      background: rgba(34, 197, 94, 0.02);
    }
    75% {
      transform: scale(1);
      border-color: rgba(74, 222, 128, 0.4);
      background: rgba(34, 197, 94, 0.08);
    }
  }

  /* === 模式提示 === */
  .mode-label {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    font-size: 16px;
    font-weight: 300;
    letter-spacing: 4px;
    color: rgba(134, 239, 172, 0.5);
    text-transform: uppercase;
    opacity: 0;
    animation: fadeIn 1s ease 0.8s forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* === 时间显示 === */
  .timer-display {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    font-size: 13px;
    color: rgba(134, 239, 172, 0.3);
    letter-spacing: 2px;
    opacity: 0;
    animation: fadeIn 1s ease 1.2s forwards;
  }

  /* === 20-20-20 提示 === */
  .reminder-toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    z-index: 200;
    background: rgba(10, 31, 20, 0.9);
    backdrop-filter: blur(30px);
    border: 1px solid rgba(74, 222, 128, 0.3);
    border-radius: 24px;
    padding: 40px 60px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .reminder-toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    pointer-events: auto;
  }

  .reminder-toast h2 {
    font-size: 24px;
    font-weight: 300;
    color: var(--accent);
    margin-bottom: 12px;
    letter-spacing: 3px;
  }

  .reminder-toast p {
    font-size: 15px;
    color: rgba(134, 239, 172, 0.6);
    line-height: 1.8;
  }

  .reminder-toast .close-btn {
    margin-top: 24px;
    background: rgba(34, 197, 94, 0.2);
    border: 1px solid rgba(74, 222, 128, 0.3);
    color: var(--accent);
    padding: 10px 32px;
    border-radius: 40px;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s;
    pointer-events: auto;
  }

  .reminder-toast .close-btn:hover {
    background: rgba(34, 197, 94, 0.35);
  }

  /* === 速度指示 === */
  .speed-indicator {
    position: fixed;
    right: 30px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    opacity: 0;
    animation: fadeIn 1s ease 1.5s forwards;
  }

  .speed-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(74, 222, 128, 0.15);
    border: 1px solid rgba(74, 222, 128, 0.2);
    transition: all 0.3s;
    cursor: pointer;
  }

  .speed-dot:hover {
    background: rgba(74, 222, 128, 0.4);
    transform: scale(1.3);
  }

  .speed-dot.active {
    background: var(--green-light);
    box-shadow: 0 0 10px rgba(74, 222, 128, 0.4);
    transform: scale(1.2);
  }

  .speed-label {
    font-size: 10px;
    color: rgba(134, 239, 172, 0.3);
    writing-mode: vertical-rl;
    letter-spacing: 3px;
    margin-top: 8px;
  }

  /* === 鼠标光标 === */
  .cursor-glow {
    position: fixed;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(34, 197, 94, 0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 3;
    transform: translate(-50%, -50%);
    transition: left 0.1s, top 0.1s;
  }
</style>

<script>
// ============================
// 眼睛放松小程序 - 核心逻辑
// ============================

const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const cursorGlow = document.getElementById('cursorGlow');

let W, H;
let time = 0;
let currentMode = 'track';
let speed = 1;
let paused = false;
let startTime = Date.now();
let reminderInterval;
let mouseX = 0, mouseY = 0;

// 初始化画布尺寸
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// 鼠标追踪光晕
document.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  cursorGlow.style.left = e.clientX + 'px';
  cursorGlow.style.top = e.clientY + 'px';
});

// ============================
// 绿色粒子系统 - 萤火虫效果
// ============================
class Firefly {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.size = Math.random() * 3 + 1;
    this.speedX = (Math.random() - 0.5) * 0.5;
    this.speedY = (Math.random() - 0.5) * 0.3;
    this.opacity = Math.random() * 0.5;
    this.opacitySpeed = (Math.random() * 0.01) + 0.003;
    this.hue = 100 + Math.random() * 40; // 绿色色相范围
    this.pulse = Math.random() * Math.PI * 2;
  }
  update() {
    this.x += this.speedX * speed;
    this.y += this.speedY * speed;
    this.pulse += this.opacitySpeed * speed;
    this.opacity = (Math.sin(this.pulse) * 0.5 + 0.5) * 0.6;
    // 边界回绕
    if (this.x < -10) this.x = W + 10;
    if (this.x > W + 10) this.x = -10;
    if (this.y < -10) this.y = H + 10;
    if (this.y > H + 10) this.y = -10;
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, 70%, 60%, ${this.opacity})`;
    ctx.fill();
    // 光晕
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 4, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, 70%, 60%, ${this.opacity * 0.1})`;
    ctx.fill();
  }
}

const fireflies = Array.from({ length: 50 }, () => new Firefly());

// ============================
// 追踪轨迹生成器
// ============================

// 模式1: 科学水平追踪（眼科常用）
function getTrackPosition(t) {
  const centerX = W / 2;
  const centerY = H / 2;
  const rangeX = W * 0.35;
  const rangeY = H * 0.15;
  
  // 复合利萨如曲线 (Lissajous) - 眼科追踪常用
  const x = centerX + Math.sin(t * 0.8) * rangeX;
  const y = centerY + Math.sin(t * 1.3 + 0.5) * rangeY;
  return { x, y };
}

// 模式2: 8字追踪
function getFigure8Position(t) {
  const centerX = W / 2;
  const centerY = H / 2;
  const scale = Math.min(W, H) * 0.25;
  
  const x = centerX + Math.sin(t * 0.6) * scale;
  const y = centerY + Math.sin(t * 1.2) * scale * 0.5;
  return { x, y };
}

// 模式3: 螺旋
function getSpiralPosition(t) {
  const centerX = W / 2;
  const centerY = H / 2;
  const maxR = Math.min(W, H) * 0.3;
  
  // 呼吸式螺旋 - 交替扩展收缩
  const breathCycle = (Math.sin(t * 0.15) * 0.5 + 0.5); // 0~1
  const r = breathCycle * maxR;
  const angle = t * 0.8;
  
  const x = centerX + Math.cos(angle) * r;
  const y = centerY + Math.sin(angle) * r;
  return { x, y };
}

// 模式4: 波浪追踪
function getWavePosition(t) {
  const centerX = W / 2;
  const centerY = H / 2;
  const rangeX = W * 0.35;
  const rangeY = H * 0.2;
  
  const x = centerX + Math.sin(t * 0.5) * rangeX;
  const y = centerY + Math.sin(t * 1.7) * rangeY + Math.sin(t * 0.3) * rangeY * 0.5;
  return { x, y };
}

function getPosition(t) {
  switch (currentMode) {
    case 'track': return getTrackPosition(t);
    case 'figure8': return getFigure8Position(t);
    case 'spiral': return getSpiralPosition(t);
    case 'wave': return getWavePosition(t);
    default: return getTrackPosition(t);
  }
}

// ============================
// 轨迹绘制
// ============================
const trail = [];
const TRAIL_LENGTH = 120;

function drawTrail() {
  if (trail.length < 2) return;

  // 主轨迹
  for (let i = 1; i < trail.length; i++) {
    const progress = i / trail.length;
    const alpha = progress * 0.6;
    const width = progress * 6 + 1;

    ctx.beginPath();
    ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
    ctx.lineTo(trail[i].x, trail[i].y);
    ctx.strokeStyle = `hsla(145, 60%, 55%, ${alpha})`;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  // 当前位置光球
  const head = trail[trail.length - 1];
  
  // 外光晕
  const gradient = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, 40);
  gradient.addColorStop(0, 'rgba(74, 222, 128, 0.3)');
  gradient.addColorStop(0.5, 'rgba(34, 197, 94, 0.1)');
  gradient.addColorStop(1, 'rgba(34, 197, 94, 0)');
  ctx.beginPath();
  ctx.arc(head.x, head.y, 40, 0, Math.PI * 2);
  ctx.fillStyle = gradient;
  ctx.fill();

  // 内核
  const innerGrad = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, 8);
  innerGrad.addColorStop(0, 'rgba(187, 247, 208, 0.9)');
  innerGrad.addColorStop(0.6, 'rgba(74, 222, 128, 0.5)');
  innerGrad.addColorStop(1, 'rgba(34, 197, 94, 0)');
  ctx.beginPath();
  ctx.arc(head.x, head.y, 8, 0, Math.PI * 2);
  ctx.fillStyle = innerGrad;
  ctx.fill();
}

// ============================
// 背景网格（极淡）
// ============================
function drawBackgroundGrid() {
  ctx.strokeStyle = 'rgba(34, 197, 94, 0.03)';
  ctx.lineWidth = 1;
  const gridSize = 80;
  const offsetX = (time * 10 * speed) % gridSize;
  const offsetY = (time * 5 * speed) % gridSize;

  for (let x = -gridSize + offsetX; x < W + gridSize; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = -gridSize + offsetY; y < H + gridSize; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
}

// ============================
// 主循环
// ============================
function animate() {
  requestAnimationFrame(animate);

  if (paused) return;

  time += 0.016 * speed;

  // 清空画布（带淡出效果）
  ctx.fillStyle = 'rgba(10, 31, 20, 0.15)';
  ctx.fillRect(0, 0, W, H);

  // 绘制背景网格
  drawBackgroundGrid();

  // 更新和绘制萤火虫
  fireflies.forEach(f => {
    f.update();
    f.draw();
  });

  // 获取当前位置并更新轨迹
  const pos = getPosition(time);
  trail.push({ x: pos.x, y: pos.y });
  if (trail.length > TRAIL_LENGTH) trail.shift();

  // 绘制轨迹
  drawTrail();

  // 更新计时器
  updateTimer();
  
  // 更新呼吸文字
  updateBreathText();
}

// ============================
// 控制函数
// ============================
function setMode(mode) {
  currentMode = mode;
  trail.length = 0; // 清空轨迹

  // 更新按钮状态
  document.querySelectorAll('.controls button').forEach(btn => btn.classList.remove('active'));
  const modeNames = { track: 'btnTrack', figure8: 'btnFigure8', spiral: 'btnSpiral', wave: 'btnWave' };
  document.getElementById(modeNames[mode])?.classList.add('active');

  // 更新模式标签
  const labels = { track: '眼球追踪放松', figure8: '8字追踪放松', spiral: '螺旋注视放松', wave: '波浪舒缓放松' };
  document.getElementById('modeLabel').textContent = labels[mode];
}

function togglePause() {
  paused = !paused;
  const btn = document.getElementById('btnPause');
  btn.textContent = paused ? '▶ 继续' : '⏸ 暂停';
  btn.classList.toggle('active', paused);
}

function setSpeed(s) {
  speed = s;
  document.querySelectorAll('.speed-dot').forEach(dot => {
    dot.classList.toggle('active', parseFloat(dot.dataset.speed) === s);
  });
}

// 速度点击
document.querySelectorAll('.speed-dot').forEach(dot => {
  dot.addEventListener('click', () => setSpeed(parseFloat(dot.dataset.speed)));
});

// ============================
// 计时器
// ============================
function updateTimer() {
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const min = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const sec = String(elapsed % 60).padStart(2, '0');
  document.getElementById('timerDisplay').textContent = `已放松 ${min}:${sec}`;
}

// ============================
// 呼吸文字更新
// ============================
function updateBreathText() {
  const cycle = time % 8;
  const circle = document.getElementById('breathCircle');
  if (cycle < 2) {
    circle.textContent = '吸气';
  } else if (cycle < 4) {
    circle.textContent = '屏住';
  } else if (cycle < 6) {
    circle.textContent = '呼气';
  } else {
    circle.textContent = '放松';
  }
}

// ============================
// 20-20-20 定时提醒
// ============================
function startReminder() {
  reminderInterval = setInterval(() => {
    if (!paused) {
      document.getElementById('reminderToast').classList.add('show');
    }
  }, 20 * 60 * 1000); // 20分钟
}

function closeReminder() {
  document.getElementById('reminderToast').classList.remove('show');
}

// ============================
// 键盘快捷键
// ============================
document.addEventListener('keydown', (e) => {
  switch(e.key) {
    case ' ':
      e.preventDefault();
      togglePause();
      break;
    case '1': setMode('track'); break;
    case '2': setMode('figure8'); break;
    case '3': setMode('spiral'); break;
    case '4': setMode('wave'); break;
  }
});

// ============================
// 启动
// ============================
// 初始清屏
ctx.fillStyle = 'rgba(10, 31, 20, 1)';
ctx.fillRect(0, 0, W, H);

animate();
startReminder();

console.log('🌿 眼睛放松小程序已启动');
console.log('快捷键: 空格=暂停/继续, 1=追踪, 2=8字, 3=螺旋, 4=波浪');
</script>
