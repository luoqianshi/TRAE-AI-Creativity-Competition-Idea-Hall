<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>失败博物馆 - 允许一切发生</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap');
        
        :root {
            --paper-bg: #f5e6d3;
            --paper-dark: #d4c4a8;
            --ink: #5c4a3a;
            --accent: #8b7355;
            --warm: #e8d4b8;
            --shadow: rgba(92, 74, 58, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'ZCOOL KuaiLe', cursive;
            background: linear-gradient(135deg, var(--paper-bg) 0%, var(--warm) 100%);
            min-height: 100vh;
            color: var(--ink);
            overflow-x: hidden;
        }

        .paper-texture {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.3;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            z-index: 0;
        }

        header {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 20px;
            background: rgba(245, 230, 211, 0.8);
            border-bottom: 2px dashed var(--accent);
        }

        header h1 {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 2.5rem;
            color: var(--ink);
            margin-bottom: 5px;
        }

        header p {
            font-size: 1rem;
            color: var(--accent);
            font-style: italic;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 15px;
            background: rgba(245, 230, 211, 0.6);
            border-bottom: 1px solid var(--paper-dark);
            position: relative;
            z-index: 10;
        }

        .nav-tabs button {
            padding: 10px 25px;
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 1.1rem;
            background: transparent;
            border: 2px solid var(--accent);
            border-radius: 20px;
            color: var(--accent);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-tabs button:hover,
        .nav-tabs button.active {
            background: var(--accent);
            color: var(--paper-bg);
            transform: scale(1.05);
        }

        .content {
            position: relative;
            z-index: 10;
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .tab-panel {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .tab-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: rgba(255, 254, 252, 0.9);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px var(--shadow);
            border: 1px solid var(--paper-dark);
            margin-bottom: 30px;
        }

        .card-title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 1.8rem;
            color: var(--ink);
            margin-bottom: 20px;
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 20px;
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 1.1rem;
            background: rgba(245, 230, 211, 0.5);
            border: 2px dashed var(--accent);
            border-radius: 10px;
            resize: none;
            color: var(--ink);
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--ink);
            background: rgba(245, 230, 211, 0.8);
        }

        .btn-primary {
            display: block;
            width: 100%;
            padding: 15px;
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 1.3rem;
            background: linear-gradient(135deg, var(--accent), #a68b6a);
            border: none;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(139, 115, 85, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(139, 115, 85, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .result-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .result-modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .result-card {
            background: linear-gradient(135deg, var(--paper-bg), var(--warm));
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 3px solid var(--ink);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            animation: bounceIn 0.5s ease;
            position: relative;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.5); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .result-card::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border: 2px dashed var(--accent);
            border-radius: 25px;
        }

        .medal-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: spin 3s linear infinite;
        }

        .achievement-path {
            background: rgba(245, 230, 211, 0.5);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px dashed var(--accent);
        }

        .path-title {
            font-size: 1.2rem;
            color: var(--ink);
            margin-bottom: 15px;
            font-weight: bold;
        }

        .path-steps {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .step {
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            transition: all 0.3s ease;
            min-width: 120px;
        }

        .step.locked {
            opacity: 0.4;
            background: rgba(212, 196, 168, 0.5);
        }

        .step.unlocked {
            opacity: 1;
            background: rgba(232, 212, 184, 0.8);
            border: 2px solid var(--accent);
        }

        .step-icon {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .step-name {
            font-size: 0.8rem;
            color: var(--ink);
            word-break: break-word;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--paper-dark);
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--warm));
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .progress-text {
            font-size: 0.8rem;
            color: var(--accent);
            margin-top: 5px;
            text-align: right;
        }

        @keyframes spin {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        .medal-name {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 2rem;
            color: var(--ink);
            margin-bottom: 20px;
        }

        .comfort-text {
            font-size: 1.3rem;
            color: var(--accent);
            line-height: 1.8;
            margin-bottom: 30px;
            font-style: italic;
        }

        .btn-close {
            padding: 10px 30px;
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 1.1rem;
            background: var(--ink);
            color: var(--paper-bg);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-close:hover {
            transform: scale(1.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(245, 230, 211, 0.6);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            border: 2px dashed var(--accent);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            background: rgba(245, 230, 211, 0.9);
        }

        .stat-number {
            font-size: 3rem;
            font-weight: bold;
            color: var(--ink);
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 1rem;
            color: var(--accent);
        }

        .record-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .record-item {
            background: rgba(245, 230, 211, 0.5);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 5px solid var(--accent);
            transition: all 0.3s ease;
        }

        .record-item:hover {
            background: rgba(245, 230, 211, 0.8);
            transform: translateX(5px);
        }

        .record-date {
            font-size: 0.9rem;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .record-content {
            font-size: 1.1rem;
            color: var(--ink);
            margin-bottom: 10px;
        }

        .record-medal {
            display: inline-block;
            padding: 5px 15px;
            background: var(--warm);
            border-radius: 15px;
            font-size: 0.9rem;
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .museum-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .exhibit-card {
            background: rgba(255, 254, 252, 0.9);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid var(--paper-dark);
            box-shadow: 0 5px 20px var(--shadow);
            transition: all 0.3s ease;
            position: relative;
        }

        .exhibit-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 30px var(--shadow);
        }

        .exhibit-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--accent), var(--warm), var(--accent));
            border-radius: 15px 15px 0 0;
        }

        .exhibit-content {
            font-size: 1.1rem;
            color: var(--ink);
            margin-bottom: 20px;
            line-height: 1.6;
            min-height: 80px;
        }

        .exhibit-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .interaction-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 8px 15px;
            background: transparent;
            border: 2px solid var(--accent);
            border-radius: 20px;
            color: var(--accent);
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .interaction-btn:hover {
            background: var(--accent);
            color: var(--paper-bg);
            transform: scale(1.1);
        }

        .interaction-btn span {
            font-size: 1.2rem;
        }

        .exhibit-date {
            font-size: 0.8rem;
            color: var(--accent);
        }

        .music-control {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: var(--ink);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(92, 74, 58, 0.4);
            transition: all 0.3s ease;
            z-index: 100;
        }

        .music-control:hover {
            transform: scale(1.1);
        }

        .music-control span {
            font-size: 1.5rem;
            color: var(--paper-bg);
        }

        .music-control.playing span::before {
            content: '⏸';
        }

        .music-control.paused span::before {
            content: '🎵';
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: var(--accent);
            font-size: 0.9rem;
            margin-top: 50px;
            border-top: 1px dashed var(--accent);
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }
            
            .nav-tabs {
                flex-wrap: wrap;
                gap: 10px;
            }
            
            .nav-tabs button {
                padding: 8px 15px;
                font-size: 0.9rem;
            }
            
            .content {
                padding: 15px;
            }
            
            .card {
                padding: 20px;
            }
            
            .result-card {
                padding: 30px 20px;
            }
            
            .museum-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="paper-texture"></div>
    
    <header>
        <h1>失败博物馆</h1>
        <p>允许一切发生，也允许自己搞砸</p>
    </header>
    
    <nav class="nav-tabs">
        <button class="active" onclick="switchTab('record')">📝 记录搞砸</button>
        <button onclick="switchTab('profile')">📋 我的履历</button>
        <button onclick="switchTab('museum')">🏛️ 失败博物馆</button>
    </nav>
    
    <main class="content">
        <section id="record" class="tab-panel active">
            <div class="card">
                <h2 class="card-title">📝 记录今天的搞砸/摆烂</h2>
                <textarea id="recordInput" placeholder="今天又搞砸了什么？例如：&#10;「今天又把老板交代的事忘了」&#10;「减肥计划第三天，吃了顿火锅」&#10;「说好的早睡，结果刷手机到凌晨两点」"></textarea>
                <button class="btn-primary" onclick="submitRecord()">📤 扔进去</button>
            </div>
        </section>
        
        <section id="profile" class="tab-panel">
            <div class="card">
                <h2 class="card-title">📋 我的搞砸履历表</h2>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="statDays">0</div>
                        <div class="stat-label">累计摆烂天数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="statStreak">0</div>
                        <div class="stat-label">连续失败记录</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="statMedals">0</div>
                        <div class="stat-label">获得勋章数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="statSleep">0%</div>
                        <div class="stat-label">睡眠质量击败</div>
                    </div>
                </div>
                
                <div class="card-title" style="font-size: 1.5rem;">� 成就进阶路线</div>
                <div id="achievementPaths">
                </div>
                
                <div class="card-title" style="font-size: 1.5rem;">� 我的奇葩勋章墙</div>
                <div class="record-list" id="medalWall">
                    <p style="text-align: center; color: var(--accent);">还没有获得任何勋章，快去搞砸一件事吧！</p>
                </div>
                
                <div class="card-title" style="font-size: 1.5rem;">📜 搞砸记录</div>
                <div class="record-list" id="recordList">
                    <p style="text-align: center; color: var(--accent);">还没有记录，今天搞砸点什么吧！</p>
                </div>
            </div>
        </section>
        
        <section id="museum" class="tab-panel">
            <div class="card">
                <h2 class="card-title">🏛️ 失败博物馆 · 匿名共鸣</h2>
                <p style="text-align: center; color: var(--accent); margin-bottom: 20px;">在这里，你不是一个人</p>
                <div class="museum-grid" id="museumGrid">
                </div>
            </div>
        </section>
    </main>
    
    <div class="result-modal" id="resultModal">
        <div class="result-card">
            <div class="medal-icon">🏅</div>
            <div class="medal-name" id="medalName"></div>
            <div class="comfort-text" id="comfortText"></div>
            <button class="btn-close" onclick="closeModal()">太好了，我安心了</button>
        </div>
    </div>
    
    <div class="music-control paused" id="musicControl" onclick="toggleMusic()">
        <span></span>
    </div>
    
    <footer class="footer">
        <p>🌙 失败不是终点，而是勋章</p>
    </footer>

        function switchTab(tabId) {
            document.querySelectorAll('.nav-tabs button').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
            
            if (tabId === 'profile') {
                updateProfile();
            } else if (tabId === 'museum') {
                renderMuseum();
            }
        }

        function classifyContent(content) {
            for (const [category, path] of Object.entries(achievementPaths)) {
                for (const keyword of path.keywords) {
                    if (content.includes(keyword)) {
                        return category;
                    }
                }
            }
            return 'life';
        }

        function getComfortPhrase(category) {
            const phrases = comfortPhrases[category] || comfortPhrases.healing;
            return phrases[Math.floor(Math.random() * phrases.length)];
        }

        function getCurrentMedal(category) {
            const path = achievementPaths[category];
            const count = userStats[category] || 0;
            
            let currentStep = null;
            for (let i = path.steps.length - 1; i >= 0; i--) {
                if (count >= path.steps[i].threshold) {
                    currentStep = path.steps[i];
                    break;
                }
            }
            
            if (!currentStep && count >= 1) {
                currentStep = path.steps[0];
            }
            
            return currentStep || { name: "摆烂新手", icon: "🌱" };
        }

        function submitRecord() {
            const input = document.getElementById('recordInput');
            const content = input.value.trim();
            
            if (!content) {
                alert('请输入今天搞砸了什么~');
                return;
            }
            
            const category = classifyContent(content);
            const comfortPhrase = getComfortPhrase(category);
            
            userStats[category] = (userStats[category] || 0) + 1;
            userStats.total = (userStats.total || 0) + 1;
            
            const medal = getCurrentMedal(category);
            
            const newRecord = {
                id: Date.now(),
                content: content,
                date: new Date().toISOString().split('T')[0],
                medal: medal,
                category: category
            };
            
            userRecords.unshift(newRecord);
            
            if (!userMedals.find(m => m.name === medal.name)) {
                userMedals.push(medal);
            }
            
            checkUltimateAchievements();
            
            localStorage.setItem('userRecords', JSON.stringify(userRecords));
            localStorage.setItem('userMedals', JSON.stringify(userMedals));
            localStorage.setItem('userStats', JSON.stringify(userStats));

                id: Date.now(),
                content: content,
                date: new Date().toISOString().split('T')[0],
                hugs: 0,
                cheers: 0
            };
            
            exhibitData.unshift(newExhibit);
            localStorage.setItem('exhibitData', JSON.stringify(exhibitData));
            
            document.getElementById('medalName').innerHTML = `${medal.icon} ${medal.name}`;
            document.getElementById('comfortText').textContent = comfortPhrase;
            document.getElementById('resultModal').classList.add('show');
            
            input.value = '';
        }

        function checkUltimateAchievements() {
            let maxLevelCount = 0;
            for (const [category, path] of Object.entries(achievementPaths)) {
                const maxThreshold = path.steps[path.steps.length - 1].threshold;
                if ((userStats[category] || 0) >= maxThreshold) {
                    maxLevelCount++;
                }
            }
            
            if (maxLevelCount >= 3) {
                const nobel = { name: "摆烂界诺贝尔和平奖", icon: "🏆" };
                if (!userMedals.find(m => m.name === nobel.name)) {
                    userMedals.push(nobel);
                }

            if (maxLevelCount >= 4) {
                const selfHealing = { name: "自我和解终身成就奖", icon: "🌟" };
                if (!userMedals.find(m => m.name === selfHealing.name)) {
                    userMedals.push(selfHealing);
                }

            if (userStats.total >= 100) {
                const maxHuman = { name: "反向打卡·满级人类", icon: "💎" };
                if (!userMedals.find(m => m.name === maxHuman.name)) {
                    userMedals.push(maxHuman);
                }
            }
        }

            const days = userRecords.length;

            const sleepScore = Math.min(99, Math.floor(days * 3.5));

            document.getElementById('statStreak').textContent = streak;

            document.getElementById('statSleep').textContent = sleepScore + '%';
            
            renderAchievementPaths();
            renderMedalWall();
            renderRecordList();

        function renderAchievementPaths() {
            const container = document.getElementById('achievementPaths');
            
            let html = '';
            for (const [category, path] of Object.entries(achievementPaths)) {
                const count = userStats[category] || 0;
                const maxThreshold = path.steps[path.steps.length - 1].threshold;
                const progress = Math.min(100, (count / maxThreshold) * 100);
                
                html += `
                    <div class="achievement-path">
                        <div class="path-title">${path.icon} ${path.name}</div>
                        <div class="path-steps">
                `;
                
                path.steps.forEach((step, index) => {
                    const unlocked = count >= step.threshold;
                    html += `
                        <div class="step ${unlocked ? 'unlocked' : 'locked'}">
                            <div class="step-icon">${unlocked ? step.icon : '🔒'}</div>
                            <div class="step-name">${step.name}</div>
                            <div style="font-size: 0.7rem; color: var(--accent);">${step.threshold}次</div>
                        </div>
                    `;
                });
                
                html += `
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progress}%"></div>
                        </div>
                        <div class="progress-text">当前进度：${count}/${maxThreshold}次</div>
                    </div>
                `;
            }
            
            container.innerHTML = html;
        }

        function calculateStreak() {
            if (userRecords.length === 0) return 0;
            
            let streak = 1;
            const dates = userRecords.map(r => r.date).sort((a, b) => new Date(b) - new Date(a));
            
            for (let i = 0; i < dates.length - 1; i++) {
                const current = new Date(dates[i]);
                const next = new Date(dates[i + 1]);
                const diff = (current - next) / (1000 * 60 * 60 * 24);
                
                if (diff === 1) {
                    streak++;
                } else {
                    break;
                }
            }
            
            return streak;
        }

            const container = document.getElementById('medalWall');
            
            if (userMedals.length === 0) {

            const exhibit = exhibitData.find(e => e.id === id);
