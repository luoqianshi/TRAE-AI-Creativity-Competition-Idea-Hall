<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人脸分析 - 智能皮肤检测</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        const { useState, useEffect, useContext, createContext, createElement: e } = React;

        const skinIssuesData = [
            { id: 'pimple', name: '痘痘', severity: 'mild', description: '面部存在少量痘痘', suggestion: '保持面部清洁' },
            { id: 'blackhead', name: '黑头', severity: 'moderate', description: 'T区有明显黑头', suggestion: '定期使用清洁面膜' },
            { id: 'dark-circle', name: '黑眼圈', severity: 'mild', description: '眼下有轻微暗沉', suggestion: '保证充足睡眠' },
            { id: 'redness', name: '泛红', severity: 'mild', description: '面部有轻微泛红', suggestion: '使用温和护肤品' },
            { id: 'oil', name: '出油', severity: 'severe', description: '油脂分泌旺盛', suggestion: '使用控油产品' },
            { id: 'dull', name: '暗沉', severity: 'moderate', description: '肤色暗沉缺乏光泽', suggestion: '注意防晒' },
        ];

        const healthTipsData = [
            { id: 'qi-blood', title: '气血提示', description: '眼下暗沉可能与气血不足有关', suggestion: '建议多食用红枣等食物' },
            { id: 'spleen', title: '脾胃提示', description: '鼻翼泛红可能与脾胃功能有关', suggestion: '建议饮食规律' },
        ];

        const hairRecommendationsData = [
            { id: 'short', name: '清新短发', description: '清爽利落，适合日常通勤' },
            { id: 'long', name: '波浪长发', description: '优雅浪漫，增添女性魅力' },
            { id: 'bob', name: '波波头', description: '时尚百搭，修饰脸型' },
            { id: 'business', name: '商务短发', description: '干练专业，适合职场' },
        ];

        const faceShapeTypes = ['oval', 'round', 'square', 'heart', 'long'];

        function analyzeSkinFromImage(imageData, userSkinType) {
            const data = imageData.data;
            const width = imageData.width;
            const height = imageData.height;

            let totalBrightness = 0;
            let totalRedness = 0;
            let darkPixelCount = 0;
            let redPixelCount = 0;
            let shinyPixelCount = 0;
            let pixelCount = 0;

            let lipPixelCount = 0;
            let lipR = 0, lipG = 0, lipB = 0;
            let lipSaturation = 0;
            let lipBrightness = 0;

            let leftEyePixelCount = 0;
            let leftEyeBrightness = 0;
            let leftEyeDarkPixels = 0;
            let leftEyeContrast = 0;

            let rightEyePixelCount = 0;
            let rightEyeBrightness = 0;
            let rightEyeDarkPixels = 0;
            let rightEyeContrast = 0;

            let facePixelCount = 0;
            let faceR = 0, faceG = 0, faceB = 0;
            let faceBrightness = 0;
            let faceRedness = 0;
            let faceYellowness = 0;

            let yintangPixelCount = 0;
            let yintangR = 0, yintangG = 0, yintangB = 0;
            let yintangBrightness = 0;
            let yintangDarkPixels = 0;

            const faceCenterY = height * 0.65;
            const faceWidth = width * 0.25;
            const lipTop = faceCenterY - 15;
            const lipBottom = faceCenterY + 10;

            const leftEyeX = width * 0.38;
            const rightEyeX = width * 0.62;
            const eyeY = height * 0.42;
            const eyeWidth = width * 0.08;
            const eyeHeight = height * 0.06;

            const faceCenterX = width / 2;
            const faceAnalyzeTop = height * 0.3;
            const faceAnalyzeBottom = height * 0.6;
            const faceAnalyzeLeft = faceCenterX - width * 0.2;
            const faceAnalyzeRight = faceCenterX + width * 0.2;

            const yintangX = width / 2;
            const yintangY = height * 0.33;
            const yintangWidth = width * 0.1;
            const yintangHeight = height * 0.06;

            for (let y = 0; y < height; y += 4) {
                for (let x = 0; x < width; x += 4) {
                    const i = (y * width + x) * 4;
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];
                    const brightness = (r + g + b) / 3;

                    totalBrightness += brightness;

                    if (r > g * 1.15 && r > b * 1.1 && r > 120) {
                        redPixelCount++;
                        totalRedness += (r - Math.max(g, b)) / r;
                    }

                    if (brightness > 200 && r > 180 && g > 180 && b > 180) {
                        shinyPixelCount++;
                    }

                    if (brightness < 80) {
                        darkPixelCount++;
                    }

                    const centerX = width / 2;
                    const distFromCenter = Math.abs(x - centerX);
                    if (y >= lipTop && y <= lipBottom && distFromCenter < faceWidth) {
                        const isRed = r > 120 && r > g * 1.1 && r > b * 1.1;
                        const isPink = r > 150 && g > 100 && b > 100 && Math.abs(r - g) < 50 && Math.abs(r - b) < 50;
                        const maxC = Math.max(r, g, b);
                        const minC = Math.min(r, g, b);
                        const sat = maxC === 0 ? 0 : (maxC - minC) / maxC;
                        const bri = brightness / 255;
                        if (isRed || isPink) {
                            lipR += r;
                            lipG += g;
                            lipB += b;
                            lipSaturation += sat;
                            lipBrightness += bri;
                            lipPixelCount++;
                        }
                    }

                    if (Math.abs(x - leftEyeX) < eyeWidth && Math.abs(y - eyeY) < eyeHeight) {
                        leftEyeBrightness += brightness;
                        if (brightness < 60) leftEyeDarkPixels++;
                        leftEyePixelCount++;
                    }

                    if (Math.abs(x - rightEyeX) < eyeWidth && Math.abs(y - eyeY) < eyeHeight) {
                        rightEyeBrightness += brightness;
                        if (brightness < 60) rightEyeDarkPixels++;
                        rightEyePixelCount++;
                    }

                    if (y >= faceAnalyzeTop && y <= faceAnalyzeBottom && x >= faceAnalyzeLeft && x <= faceAnalyzeRight) {
                        const isSkin = r > 80 && g > 60 && b > 50 && r > g && g > b * 0.85;
                        if (isSkin && brightness > 50) {
                            faceR += r;
                            faceG += g;
                            faceB += b;
                            faceBrightness += brightness;
                            if (r > g * 1.1 && r > b * 1.1) faceRedness++;
                            if (r > 200 && g > 180 && b < 150) faceYellowness++;
                            facePixelCount++;
                        }
                    }

                    if (Math.abs(x - yintangX) < yintangWidth && Math.abs(y - yintangY) < yintangHeight) {
                        const isSkin = r > 80 && g > 60 && b > 50 && r > g && g > b * 0.85;
                        if (isSkin) {
                            yintangR += r;
                            yintangG += g;
                            yintangB += b;
                            yintangBrightness += brightness;
                            if (brightness < 100) yintangDarkPixels++;
                            yintangPixelCount++;
                        }
                    }

                    pixelCount++;
                }
            }

            let lipAnalysis = null;
            if (lipPixelCount > 0) {
                const avgLipR = lipR / lipPixelCount;
                const avgLipG = lipG / lipPixelCount;
                const avgLipB = lipB / lipPixelCount;
                const avgLipSat = lipSaturation / lipPixelCount;
                const avgLipBri = lipBrightness / lipPixelCount;

                let lipCondition = 'healthy';
                let lipDescription = '唇色红润';
                let lipSuggestion = '唇色健康，气血充足';
                let lipSeverity = 'mild';

                if (avgLipR < 120 || avgLipSat < 0.15) {
                    if (avgLipR < 100) {
                        lipCondition = 'blood-deficiency';
                        lipDescription = '唇色苍白或暗淡';
                        lipSuggestion = '唇色偏淡可能提示气血不足，建议多吃红枣、枸杞等补血食物';
                        lipSeverity = 'severe';
                    } else {
                        lipCondition = 'blood-deficiency-mild';
                        lipDescription = '唇色偏淡';
                        lipSuggestion = '唇色偏淡可能提示气血稍弱，建议注意营养均衡';
                        lipSeverity = 'mild';
                    }
                } else if (avgLipR > 180 && avgLipBri > 0.75) {
                    lipCondition = 'heat';
                    lipDescription = '唇色偏红';
                    lipSuggestion = '唇色偏红可能提示体内有热，建议清淡饮食，多喝水';
                    lipSeverity = 'mild';
                } else if (avgLipSat < 0.2 && avgLipBri > 0.6) {
                    lipCondition = 'qi-deficiency';
                    lipDescription = '唇色偏淡偏白';
                    lipSuggestion = '唇色偏淡可能提示气虚，建议适当运动，保证充足睡眠';
                    lipSeverity = 'mild';
                }

                lipAnalysis = {
                    condition: lipCondition,
                    description: lipDescription,
                    suggestion: lipSuggestion,
                    severity: lipSeverity,
                    avgR: Math.round(avgLipR),
                    avgG: Math.round(avgLipG),
                    avgB: Math.round(avgLipB),
                    saturation: Math.round(avgLipSat * 100),
                    brightness: Math.round(avgLipBri * 100)
                };
            }

            let eyeAnalysis = null;
            if (leftEyePixelCount > 10 && rightEyePixelCount > 10) {
                const avgLeftBrightness = leftEyeBrightness / leftEyePixelCount;
                const avgRightBrightness = rightEyeBrightness / rightEyePixelCount;
                const avgEyeBrightness = (avgLeftBrightness + avgRightBrightness) / 2;
                const leftDarkRatio = leftEyeDarkPixels / leftEyePixelCount;
                const rightDarkRatio = rightEyeDarkPixels / rightEyePixelCount;
                const avgDarkRatio = (leftDarkRatio + rightDarkRatio) / 2;

                let eyeCondition = 'bright';
                let eyeDescription = '眼睛有神';
                let eyeSuggestion = '眼神明亮，精神状态良好';
                let eyeSeverity = 'mild';

                if (avgEyeBrightness < 80 || avgDarkRatio > 0.4) {
                    eyeCondition = 'tired';
                    eyeDescription = '眼睛无神，有疲态';
                    eyeSuggestion = '眼神暗淡可能提示疲劳或睡眠不足，建议保证充足睡眠，适当休息眼睛';
                    eyeSeverity = 'moderate';
                } else if (avgEyeBrightness < 100 || avgDarkRatio > 0.25) {
                    eyeCondition = 'slightly-tired';
                    eyeDescription = '眼睛略显疲惫';
                    eyeSuggestion = '眼神稍显暗淡，建议注意用眼卫生，适当做眼保健操';
                    eyeSeverity = 'mild';
                }

                eyeAnalysis = {
                    condition: eyeCondition,
                    description: eyeDescription,
                    suggestion: eyeSuggestion,
                    severity: eyeSeverity,
                    avgBrightness: Math.round(avgEyeBrightness),
                    darkRatio: Math.round(avgDarkRatio * 100)
                };
            }

            let faceColorAnalysis = null;
            if (facePixelCount > 50) {
                const avgFaceR = faceR / facePixelCount;
                const avgFaceG = faceG / facePixelCount;
                const avgFaceB = faceB / facePixelCount;
                const avgFaceBrightness = faceBrightness / facePixelCount;
                const rednessRatio = faceRedness / facePixelCount;
                const yellownessRatio = faceYellowness / facePixelCount;

                let faceCondition = 'healthy';
                let faceDescription = '面色红润有光泽';
                let faceSuggestion = '面色健康，气血充足';
                let faceSeverity = 'mild';

                if (avgFaceBrightness > 180 && rednessRatio > 0.3) {
                    faceCondition = 'flushed';
                    faceDescription = '面色偏红';
                    faceSuggestion = '面色偏红可能提示体内有热或肝火旺，建议清淡饮食，保持心情舒畅';
                    faceSeverity = 'moderate';
                } else if (avgFaceBrightness < 100) {
                    faceCondition = 'pale';
                    faceDescription = '面色苍白';
                    faceSuggestion = '面色苍白可能提示气血不足，建议多吃补血食物，如红枣、桂圆、黑芝麻等';
                    faceSeverity = 'severe';
                } else if (avgFaceBrightness < 130 && rednessRatio < 0.1) {
                    faceCondition = 'qi-deficiency';
                    faceDescription = '面色偏白无华';
                    faceSuggestion = '面色偏白可能提示气虚或血虚，建议注意营养均衡，适当运动';
                    faceSeverity = 'moderate';
                } else if (yellownessRatio > 0.1) {
                    faceCondition = 'yellow';
                    faceDescription = '面色偏黄';
                    faceSuggestion = '面色偏黄可能提示脾虚或湿气重，建议健脾祛湿，饮食规律';
                    faceSeverity = 'moderate';
                }

                faceColorAnalysis = {
                    condition: faceCondition,
                    description: faceDescription,
                    suggestion: faceSuggestion,
                    severity: faceSeverity,
                    avgR: Math.round(avgFaceR),
                    avgG: Math.round(avgFaceG),
                    avgB: Math.round(avgFaceB),
                    brightness: Math.round(avgFaceBrightness),
                    rednessRatio: Math.round(rednessRatio * 100),
                    yellownessRatio: Math.round(yellownessRatio * 100)
                };
            }

            let yintangAnalysis = null;
            if (yintangPixelCount > 20) {
                const avgYintangBrightness = yintangBrightness / yintangPixelCount;
                const avgYintangR = yintangR / yintangPixelCount;
                const avgYintangG = yintangG / yintangPixelCount;
                const avgYintangB = yintangB / yintangPixelCount;
                const darkRatio = yintangDarkPixels / yintangPixelCount;

                let yintangCondition = 'bright';
                let yintangDescription = '印堂明亮';
                let yintangSuggestion = '印堂光亮，气血顺畅，精神状态良好';
                let yintangSeverity = 'mild';

                if (darkRatio > 0.3 || avgYintangBrightness < 90) {
                    yintangCondition = 'dark';
                    yintangDescription = '印堂发暗';
                    yintangSuggestion = '印堂发暗可能提示气血不畅或压力过大，建议放松心情，保证睡眠，适当运动';
                    yintangSeverity = 'severe';
                } else if (darkRatio > 0.15 || avgYintangBrightness < 110) {
                    yintangCondition = 'slightly-dull';
                    yintangDescription = '印堂稍暗';
                    yintangSuggestion = '印堂稍显暗淡，建议注意休息，减轻压力，保持心情愉悦';
                    yintangSeverity = 'moderate';
                } else if (avgYintangR > avgYintangG * 1.1 && avgYintangR > 150) {
                    yintangCondition = 'red';
                    yintangDescription = '印堂发红';
                    yintangSuggestion = '印堂发红可能提示心火较旺，建议清淡饮食，保持心情平和';
                    yintangSeverity = 'moderate';
                }

                yintangAnalysis = {
                    condition: yintangCondition,
                    description: yintangDescription,
                    suggestion: yintangSuggestion,
                    severity: yintangSeverity,
                    brightness: Math.round(avgYintangBrightness),
                    darkRatio: Math.round(darkRatio * 100),
                    avgR: Math.round(avgYintangR),
                    avgG: Math.round(avgYintangG),
                    avgB: Math.round(avgYintangB)
                };
            }

            const avgBrightness = totalBrightness / pixelCount;
            const rednessRatio = redPixelCount / pixelCount;
            const shinyRatio = shinyPixelCount / pixelCount;
            const darkRatio = darkPixelCount / pixelCount;

            const issues = [];
            let overallScore = 85;

            if (userSkinType === 'oily' || shinyRatio > 0.05) {
                const severity = shinyRatio > 0.12 ? 'severe' : shinyRatio > 0.07 ? 'moderate' : 'mild';
                const descText = severity === 'severe' ? '油脂分泌旺盛' : severity === 'moderate' ? 'T区出油明显' : '有轻微出油';
                const sugText = severity === 'severe' ? '建议使用控油护肤产品，注意清洁' : '建议使用清爽型护肤品';
                issues.push({
                    id: 'oil',
                    name: '出油',
                    severity: severity,
                    description: '面部' + descText,
                    suggestion: sugText
                });
                if (severity === 'severe') overallScore -= 10;
                else if (severity === 'moderate') overallScore -= 5;
            }

            if (rednessRatio > 0.08) {
                const severity = rednessRatio > 0.18 ? 'severe' : rednessRatio > 0.12 ? 'moderate' : 'mild';
                const descText = severity === 'severe' ? '泛红明显' : severity === 'moderate' ? '有明显泛红' : '轻微泛红';
                issues.push({
                    id: 'redness',
                    name: '泛红',
                    severity: severity,
                    description: '面部' + descText,
                    suggestion: '建议使用温和舒缓的护肤品，避免刺激'
                });
                if (severity === 'severe') overallScore -= 8;
                else if (severity === 'moderate') overallScore -= 4;
            }

            if (darkRatio > 0.06) {
                const severity = darkRatio > 0.12 ? 'severe' : darkRatio > 0.09 ? 'moderate' : 'mild';
                const descText = severity === 'severe' ? '暗沉明显' : '有暗沉';
                issues.push({
                    id: 'dark-circle',
                    name: '黑眼圈/暗沉',
                    severity: severity,
                    description: '眼部/面部' + descText,
                    suggestion: '建议保证充足睡眠，使用提亮产品'
                });
                if (severity === 'severe') overallScore -= 7;
                else if (severity === 'moderate') overallScore -= 3;
            }

            if (avgBrightness < 130) {
                const severity = avgBrightness < 100 ? 'moderate' : 'mild';
                issues.push({
                    id: 'dull',
                    name: '肤色暗沉',
                    severity: severity,
                    description: '肤色整体偏暗，缺乏光泽',
                    suggestion: '建议注意防晒，使用提亮肤色的产品'
                });
                overallScore -= 5;
            }

            if (userSkinType === 'oily' && shinyRatio > 0.08) {
                const severity = shinyRatio > 0.15 ? 'moderate' : 'mild';
                issues.push({
                    id: 'blackhead',
                    name: '黑头',
                    severity: severity,
                    description: 'T区可能存在黑头问题',
                    suggestion: '建议定期使用清洁面膜，注意毛孔清洁'
                });
                overallScore -= 3;
            }

            if (rednessRatio > 0.05 && userSkinType === 'oily') {
                const severity = rednessRatio > 0.1 ? 'moderate' : 'mild';
                issues.push({
                    id: 'pimple',
                    name: '痘痘',
                    severity: severity,
                    description: '可能存在痘痘或痘印问题',
                    suggestion: '建议保持面部清洁，使用祛痘产品'
                });
                overallScore -= 4;
            }

            overallScore = Math.max(60, Math.min(98, overallScore));

            const faceShapeIndex = Math.floor((avgBrightness + rednessRatio * 100) % faceShapeTypes.length);
            const faceShape = faceShapeTypes[faceShapeIndex];

            const filteredHair = hairRecommendationsData.filter(function(h) {
                if (faceShape === 'round') return h.id !== 'bob';
                if (faceShape === 'square') return h.id !== 'short';
                return true;
            });

            const healthTips = [];
            if (darkRatio > 0.08) {
                healthTips.push({
                    id: 'sleep',
                    title: '作息提示',
                    description: '眼部暗沉可能与睡眠不足有关',
                    suggestion: '建议每天保证7-8小时睡眠'
                });
            }
            if (rednessRatio > 0.1) {
                healthTips.push({
                    id: 'diet',
                    title: '饮食提示',
                    description: '面部泛红可能与饮食刺激有关',
                    suggestion: '建议减少辛辣刺激食物，饮食清淡'
                });
            }
            if (shinyRatio > 0.1) {
                healthTips.push({
                    id: 'water',
                    title: '补水提示',
                    description: '出油多可能是水油失衡的表现',
                    suggestion: '建议多喝水，注意皮肤补水'
                });
            }
            if (healthTips.length === 0) {
                healthTips.push(healthTipsData[0]);
            }

            return {
                overallScore: Math.round(overallScore),
                issues: issues.length > 0 ? issues : [skinIssuesData[3]],
                healthTips: healthTips,
                hairRecommendations: filteredHair.slice(0, 3),
                faceShape: faceShape,
                lipAnalysis: lipAnalysis,
                eyeAnalysis: eyeAnalysis,
                faceColorAnalysis: faceColorAnalysis,
                yintangAnalysis: yintangAnalysis,
                analysisDetails: {
                    brightness: Math.round(avgBrightness),
                    redness: Math.round(rednessRatio * 1000) / 10,
                    oiliness: Math.round(shinyRatio * 1000) / 10,
                    darkAreas: Math.round(darkRatio * 1000) / 10
                }
            };
        }

        const AppContext = createContext();

        function AppProvider({ children }) {
            const [state, setState] = useState(function() {
                const saved = localStorage.getItem('faceAnalysisApp');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    return {
                        currentUser: parsed.currentUser || null,
                        users: parsed.users || [],
                        currentStyle: parsed.currentStyle || 'neutral',
                        scanHistory: parsed.scanHistory || []
                    };
                }
                return { currentUser: null, users: [], currentStyle: 'neutral', scanHistory: [] };
            });

            useEffect(function() {
                localStorage.setItem('faceAnalysisApp', JSON.stringify(state));
            }, [state]);

            const registerUser = function(username, password, gender, skinType) {
                const exists = state.users.find(function(u) { return u.username === username; });
                if (exists) {
                    return { success: false, message: '用户名已存在' };
                }
                const newUser = {
                    username: username,
                    password: password,
                    gender: gender,
                    skinType: skinType,
                    createdAt: new Date().toISOString()
                };
                const newUsers = [...state.users, newUser];
                setState(function(prev) {
                    return {
                        ...prev,
                        users: newUsers,
                        currentUser: newUser,
                        currentStyle: gender === 'female' ? 'cute' : 'neutral'
                    };
                });
                return { success: true, message: '注册成功' };
            };

            const loginUser = function(username, password) {
                const user = state.users.find(function(u) { return u.username === username; });
                if (!user) {
                    return { success: false, message: '用户不存在' };
                }
                if (user.password !== password) {
                    return { success: false, message: '密码错误' };
                }
                setState(function(prev) {
                    return {
                        ...prev,
                        currentUser: user,
                        currentStyle: user.gender === 'female' ? 'cute' : 'neutral'
                    };
                });
                return { success: true, message: '登录成功' };
            };

            const logoutUser = function() {
                setState(function(prev) {
                    return { ...prev, currentUser: null };
                });
            };

            const updateUserInfo = function(userInfo) {
                setState(function(prev) {
                    if (!prev.currentUser) return prev;
                    const updatedUser = { ...prev.currentUser, ...userInfo };
                    const updatedUsers = prev.users.map(function(u) {
                        return u.username === updatedUser.username ? updatedUser : u;
                    });
                    return {
                        ...prev,
                        currentUser: updatedUser,
                        users: updatedUsers,
                        currentStyle: updatedUser.gender === 'female' ? 'cute' : prev.currentStyle
                    };
                });
            };

                                    e('h4', { className: 'font-medium text-gray-700' }, tip.title),
                                    e('p', { className: 'text-sm text-gray-600' }, tip.description),
                                    e('p', { className: 'text-sm text-green-600 mt-1' }, '建议：' + tip.suggestion)
                                )
                            );
                        })
                    ),
                    e('p', { className: 'text-xs text-gray-400 mt-3 text-center' }, '免责声明：以上提示仅供参考，不能替代专业医疗诊断')
                ),
                e('div', { className: cardStyle + ' p-4' },
                    e('h3', { className: 'font-medium text-gray-700 mb-3' }, '💇 发型推荐'),
                    e('div', { className: 'grid grid-cols-3 gap-3' },
                        latestRecord.hairRecommendations.map(function(hair) {
                            return e('div', { key: hair.id, className: 'bg-gray-50 rounded-xl p-3 text-center' },
                                e('div', { className: 'w-full h-16 bg-gradient-to-br from-pink-100 to-purple-100 rounded-lg flex items-center justify-center mb-2' }, e('span', { className: 'text-3xl' }, '💇')),
                                e('h4', { className: 'font-medium text-gray-700 text-sm' }, hair.name)
                            );
                        })
                    )
                ),
                e('div', { className: 'fixed bottom-4 left-4 right-4 flex gap-4' },
                    e('button', { onClick: function() { onNavigate('home'); }, className: 'flex-1 bg-white text-gray-700 border border-gray-200 rounded-full py-3 font-medium' }, '返回首页'),
                    e('button', { onClick: function() { onNavigate('history'); }, className: 'flex-1 text-white rounded-full py-3 font-medium ' + btnStyle }, '查看历史')
                )
            );
        }

        function History({ onNavigate }) {
            const { state } = useApp();
            const isCute = state.currentStyle === 'cute';

            const bgStyle = isCute ? 'bg-gradient-to-br from-pink-100 via-purple-50 to-pink-50' : 'bg-gradient-to-br from-gray-50 via-slate-50 to-gray-100';
            const cardStyle = isCute ? 'bg-white/80 rounded-2xl shadow-lg border-pink-100' : 'bg-white/80 rounded-xl shadow-md border-gray-100';

            const getScoreColor = function(score) { return score >= 85 ? 'text-green-500' : score >= 70 ? 'text-yellow-500' : 'text-red-500'; };

            const emptyState = e('div', { className: 'text-center py-12' },
                e('div', { className: 'w-20 h-20 mx-auto mb-4 rounded-full flex items-center justify-center ' + (isCute ? 'bg-pink-200' : 'bg-gray-200') }, e('span', { className: 'text-4xl' }, '📅')),
                e('h3', { className: 'text-lg font-semibold text-gray-700 mb-2' }, '暂无检测记录'),
                e('p', { className: 'text-gray-500 mb-4' }, '点击按钮开始第一次检测'),
                e('button', { onClick: function() { onNavigate('home'); }, className: 'px-6 py-2 text-white rounded-full ' + (isCute ? 'bg-gradient-to-r from-pink-400 to-purple-400' : 'bg-gradient-to-r from-gray-500 to-slate-500') }, '开始检测')
            );

            const historyList = e('div', { className: 'space-y-3' },
                state.scanHistory.map(function(record) {
                    const avatarContent = record.photo
                        ? e('img', { src: record.photo, alt: '照片', className: 'w-full h-full object-cover' })
                        : e('div', { className: 'text-center' },
                            e('div', { className: 'text-2xl font-bold ' + getScoreColor(record.skinResult.overallScore) }, record.skinResult.overallScore),
                            e('div', { className: 'text-xs text-gray-500' }, '分')
                        );
                    return e('div', { key: record.id, className: cardStyle, onClick: function() { onNavigate('result'); } },
                        e('div', { className: 'flex items-center gap-4 p-4' },
                            e('div', { className: 'w-16 h-16 rounded-full overflow-hidden flex items-center justify-center ' + (isCute ? 'bg-gradient-to-br from-pink-200 to-purple-200' : 'bg-gray-200') }, avatarContent),
                            e('div', { className: 'flex-1' },
                                e('p', { className: 'text-sm text-gray-500' }, record.date),
                                e('div', { className: 'flex gap-2 mt-2' },
                                    record.skinResult.issues.slice(0, 2).map(function(issue) {
                                        return e('span', { key: issue.id, className: 'text-xs px-2 py-1 bg-gray-100 text-gray-600 rounded-full' }, issue.name);
                                    })
                                )
                            ),
                            e('button', { className: 'p-2 rounded-full ' + (isCute ? 'bg-pink-100 text-pink-600' : 'bg-gray-100 text-gray-600') }, '❤️')
                        )
                    );
                })
            );

            return e('div', { className: 'min-h-screen ' + bgStyle + ' p-4' },
                e('header', { className: 'flex items-center gap-4 mb-6' },
                    e('button', { onClick: function() { onNavigate('home'); }, className: 'p-2 rounded-full ' + (isCute ? 'bg-pink-100 text-pink-600' : 'bg-gray-100 text-gray-600') }, '←'),
                    e('h1', { className: 'text-lg font-bold ' + (isCute ? 'text-pink-600' : 'text-gray-700') }, '历史记录')
                ),
                state.scanHistory.length === 0 ? emptyState : historyList
            );
        }

        function Profile({ onNavigate, onLogout }) {
            const { state, setStyle } = useApp();
            const isCute = state.currentStyle === 'cute';

            const bgStyle = isCute ? 'bg-gradient-to-br from-pink-100 via-purple-50 to-pink-50' : 'bg-gradient-to-br from-gray-50 via-slate-50 to-gray-100';
            const btnStyle = isCute ? 'bg-gradient-to-r from-pink-400 to-purple-400' : 'bg-gradient-to-r from-gray-500 to-slate-500';
            const cardStyle = isCute ? 'bg-white/80 rounded-2xl shadow-lg border-pink-100' : 'bg-white/80 rounded-xl shadow-md border-gray-100';

            const menuItems = [
                { icon: '⚙️', label: '账号设置', desc: '管理您的账户信息' },
                { icon: '🔒', label: '隐私设置', desc: '管理数据权限和隐私' },
                { icon: '❓', label: '帮助中心', desc: '常见问题解答' }
            ];

            const genderText = state.currentUser && state.currentUser.gender === 'male' ? '男性' : '女性';
            const skinText = state.currentUser ? (state.currentUser.skinType === 'dry' ? '干性皮肤' : state.currentUser.skinType === 'oily' ? '油性皮肤' : '混合性皮肤') : '';
            const username = state.currentUser ? state.currentUser.username : '用户昵称';

            const handleLogout = function() {
                if (confirm('确定要退出登录吗？')) {
                    onLogout();
                }
            };

            return e('div', { className: 'min-h-screen ' + bgStyle + ' p-4 pb-24' },
                e('header', { className: 'flex items-center gap-4 mb-6' },
                    e('button', { onClick: function() { onNavigate('home'); }, className: 'p-2 rounded-full ' + (isCute ? 'bg-pink-100 text-pink-600' : 'bg-gray-100 text-gray-600') }, '←'),
                    e('h1', { className: 'text-lg font-bold ' + (isCute ? 'text-pink-600' : 'text-gray-700') }, '个人中心')
                ),
                e('div', { className: cardStyle + ' p-6 mb-6' },
                    e('div', { className: 'flex items-center gap-4' },
                        e('div', { className: 'w-16 h-16 rounded-full flex items-center justify-center ' + (isCute ? 'bg-gradient-to-br from-pink-200 to-purple-200' : 'bg-gray-200') }, e('span', { className: 'text-3xl' }, '👤')),
                        e('div', { className: 'flex-1' },
                            e('h2', { className: 'font-semibold text-gray-700' }, username),
                            e('p', { className: 'text-sm text-gray-500' }, genderText + ' · ' + skinText)
                        )
                    )
                ),
                e('div', { className: cardStyle + ' p-4 mb-4' },
                    e('div', { className: 'flex items-center justify-between' },
                        e('div', { className: 'flex items-center gap-3' },
                            e('div', { className: 'w-10 h-10 rounded-xl flex items-center justify-center ' + (isCute ? 'bg-pink-100' : 'bg-gray-100') }, e('span', null, '🎨')),
                            e('div', null,
                                e('h3', { className: 'font-medium text-gray-700' }, '界面风格'),
                                e('p', { className: 'text-sm text-gray-500' }, isCute ? '可爱活泼风格' : '简约中性风格')
                            )
                        ),
                        e('button', { onClick: function() { setStyle(isCute ? 'neutral' : 'cute'); }, className: 'px-4 py-2 rounded-full ' + (isCute ? 'bg-gradient-to-r from-pink-400 to-purple-400 text-white' : 'bg-gray-500 text-white') }, isCute ? '🌙' : '☀️')
                    )
                ),
                e('div', { className: cardStyle + ' overflow-hidden mb-4' },
                    menuItems.map(function(item, index) {
                        const borderStyle = index < 2 ? { borderBottom: '1px solid #f3f4f6' } : {};
                        return e('button', { key: item.label, className: 'w-full flex items-center gap-3 p-4 hover:bg-gray-50', style: borderStyle },
                            e('span', { className: 'text-2xl' }, item.icon),
                            e('div', { className: 'flex-1 text-left' },
                                e('h3', { className: 'font-medium text-gray-700' }, item.label),
                                e('p', { className: 'text-sm text-gray-500' }, item.desc)
                            ),
                            e('span', { className: 'text-gray-400' }, '›')
                        );
                    })
                ),
                e('div', { className: 'fixed bottom-4 left-4 right-4' },
                    e('button', { onClick: handleLogout, className: 'w-full flex items-center justify-center gap-2 py-3 bg-red-500 text-white rounded-full' }, '🚪 退出登录')
                )
            );
        }

        function App() {
            const [currentPage, setCurrentPage] = useState('login');
            const { state, logoutUser } = useApp();

            useEffect(function() {
                if (state.currentUser) {
                    setCurrentPage('home');
                } else {
                    setCurrentPage('login');
                }
            }, [state.currentUser]);

            const navigate = function(page) { setCurrentPage(page); window.scrollTo(0, 0); };

            const handleLogout = function() {
                logoutUser();
                navigate('login');
            };

            switch (currentPage) {
                case 'login': return e(Login, { onNavigate: navigate, onComplete: function() { navigate('home'); } });
                case 'register': return e(Register, { onNavigate: navigate, onComplete: function() { navigate('home'); } });
                case 'home': return e(Home, { onNavigate: navigate });
                case 'upload': return e(PhotoUpload, { onNavigate: navigate, onComplete: function() { navigate('result'); } });
                case 'result': return e(Result, { onNavigate: navigate });
                case 'history': return e(History, { onNavigate: navigate });
                case 'profile': return e(Profile, { onNavigate: navigate, onLogout: handleLogout });
                default: return e(Login, { onNavigate: navigate, onComplete: function() { navigate('home'); } });
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(e(AppProvider, null, e(App)));
    </script>
</body>
</html>
