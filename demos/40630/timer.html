<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>专注计时 - AI 智伴</title>
    <style>
        :root {
            --primary: #6C5CE7;
            --primary-light: #A29BFE;
            --accent: #FD79A8;
            --success: #00B894;
            --warning: #FDCB6E;
            --danger: #E17055;
            --bg: #F8F9FE;
            --card: #FFFFFF;
            --text: #2D3436;
            --text-light: #636E72;
            --shadow: 0 4px 20px rgba(108, 92, 231, 0.08);
            --radius: 20px;
            --radius-sm: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            padding-bottom: 100px;
            -webkit-font-smoothing: antialiased;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #FDCB6E 0%, #E17055 100%);
            padding: 24px 20px 28px;
            border-radius: 0 0 30px 30px;
            color: #fff;
            position: relative;
        }
        .header-back {
            font-size: 24px; cursor: pointer;
            display: inline-block; margin-bottom: 8px;
            text-decoration: none; color: #fff;
        }
        .header-title { font-size: 20px; font-weight: 700; }
        .header-subtitle { font-size: 13px; opacity: 0.85; margin-top: 4px; }

        /* Timer Circle */
        .timer-section {
            display: flex; flex-direction: column;
            align-items: center; padding: 30px 20px;
        }
        .timer-circle {
            width: 220px; height: 220px;
            border-radius: 50%;
            background: conic-gradient(var(--primary) 0deg, #F0F0F0 0deg);
            display: flex; align-items: center; justify-content: center;
            position: relative;
            box-shadow: 0 8px 32px rgba(108, 92, 231, 0.15);
            transition: background 0.3s;
        }
        .timer-circle.running {
            background: conic-gradient(var(--success) 0deg, #F0F0F0 0deg);
        }
        .timer-inner {
            width: 180px; height: 180px;
            background: #fff;
            border-radius: 50%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        .timer-display {
            font-size: 48px; font-weight: 700;
            color: var(--text); letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
            font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
        }
        .timer-label {
            font-size: 13px; color: var(--text-light);
            margin-top: 4px;
        }

        /* Timer Controls */
        .timer-controls {
            display: flex; gap: 16px;
            margin-top: 24px;
        }
        .btn {
            padding: 12px 32px;
            border-radius: 25px;
            font-size: 15px; font-weight: 700;
            border: none; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-start {
            background: linear-gradient(135deg, #6C5CE7, #A29BFE);
            color: #fff; box-shadow: 0 4px 16px rgba(108, 92, 231, 0.3);
        }
        .btn-pause {
            background: linear-gradient(135deg, #FDCB6E, #E17055);
            color: #fff; box-shadow: 0 4px 16px rgba(225, 112, 85, 0.3);
        }
        .btn-reset {
            background: #F0F0F0; color: var(--text);
        }

        /* Preset Times */
        .section { padding: 0 20px; margin-top: 22px; }
        .section-title {
            font-size: 17px; font-weight: 700;
            margin-bottom: 14px;
            display: flex; align-items: center; gap: 8px;
        }
        .section-title::before {
            content: '';
            width: 4px; height: 18px;
            background: var(--warning);
            border-radius: 2px;
        }
        .preset-row {
            display: flex; gap: 10px;
        }
        .preset-btn {
            flex: 1; padding: 14px 8px;
            background: var(--card);
            border-radius: var(--radius-sm);
            text-align: center;
            box-shadow: var(--shadow);
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .preset-btn:hover, .preset-btn.active {
            border-color: var(--primary);
            background: #F0F4FF;
        }
        .preset-btn:active { transform: scale(0.95); }
        .preset-time { font-size: 20px; font-weight: 700; color: var(--primary); }
        .preset-label { font-size: 11px; color: var(--text-light); margin-top: 4px; }

        /* Task Selector */
        .task-selector {
            background: var(--card);
            border-radius: var(--radius-sm);
            padding: 16px;
            box-shadow: var(--shadow);
            display: flex; align-items: center; gap: 12px;
            cursor: pointer;
        }
        .task-select-icon { font-size: 28px; }
        .task-select-info { flex: 1; }
        .task-select-name { font-size: 14px; font-weight: 600; }
        .task-select-desc { font-size: 12px; color: var(--text-light); margin-top: 2px; }
        .task-select-arrow { color: #ccc; font-size: 20px; }

        /* Today's Focus Stats */
        .focus-stats {
            display: flex; gap: 10px;
        }
        .focus-stat {
            flex: 1;
            background: var(--card);
            border-radius: var(--radius-sm);
            padding: 16px 12px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .focus-stat-icon { font-size: 24px; margin-bottom: 4px; }
        .focus-stat-value { font-size: 20px; font-weight: 700; color: var(--primary); }
        .focus-stat-label { font-size: 11px; color: var(--text-light); margin-top: 2px; }

        /* Tips */
        .focus-tip {
            background: linear-gradient(135deg, #FFF9E6 0%, #FFF5F8 100%);
            border-radius: var(--radius);
            padding: 16px 18px;
            border: 1.5px solid rgba(253, 203, 110, 0.2);
            display: flex; gap: 10px;
            align-items: flex-start;
        }
        .focus-tip-icon { font-size: 28px; flex-shrink: 0; }
        .focus-tip-text { font-size: 13px; color: var(--text-light); line-height: 1.6; }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 100%; max-width: 480px;
            background: var(--card);
            display: flex;
            padding: 8px 0 env(safe-area-inset-bottom, 8px);
            box-shadow: 0 -2px 20px rgba(0,0,0,0.06);
            border-radius: 20px 20px 0 0;
            z-index: 100;
        }
        .nav-item {
            flex: 1; text-align: center;
            padding: 8px 0;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-light);
            font-size: 11px;
        }
        .nav-item.active { color: var(--primary); }
        .nav-item-icon { font-size: 22px; display: block; margin-bottom: 2px; }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <a href="index.html" class="header-back">←</a>
        <div class="header-title">⏰ 专注计时</div>
        <div class="header-subtitle">培养孩子自主时间管理能力</div>
    </div>

    <!-- Timer -->
    <div class="timer-section">
        <div class="timer-circle" id="timerCircle">
            <div class="timer-inner">
                <div class="timer-display" id="timerDisplay">25:00</div>
                <div class="timer-label" id="timerLabel">准备开始</div>
            </div>
        </div>
        <div class="timer-controls">
            <button class="btn btn-reset" id="btnReset" onclick="resetTimer()">↺ 重置</button>
            <button class="btn btn-start" id="btnStart" onclick="toggleTimer()">▶ 开始专注</button>
        </div>
    </div>

    <!-- Preset -->
    <div class="section">
        <div class="section-title">快速选择时长</div>
        <div class="preset-row">
            <div class="preset-btn active" onclick="setPreset(15, this)">
                <div class="preset-time">15</div>
                <div class="preset-label">分钟 · 短专注</div>
            </div>
            <div class="preset-btn" onclick="setPreset(25, this)">
                <div class="preset-time">25</div>
                <div class="preset-label">分钟 · 标准</div>
            </div>
            <div class="preset-btn" onclick="setPreset(30, this)">
                <div class="preset-time">30</div>
                <div class="preset-label">分钟 · 长专注</div>
            </div>
            <div class="preset-btn" onclick="setPreset(45, this)">
                <div class="preset-time">45</div>
                <div class="preset-label">分钟 · 课堂</div>
            </div>
        </div>
    </div>

    <!-- Current Task -->
    <div class="section">
        <div class="section-title">当前任务</div>
        <div class="task-selector">
            <div class="task-select-icon">📐</div>
            <div class="task-select-info">
                <div class="task-select-name">数学 · 分数加减法巩固</div>
                <div class="task-select-desc">5道专项练习题 · 课内巩固</div>
            </div>
            <div class="task-select-arrow">›</div>
        </div>
    </div>

    <!-- Today's Stats -->
    <div class="section">
        <div class="section-title">今日专注统计</div>
        <div class="focus-stats">
            <div class="focus-stat">
                <div class="focus-stat-icon">🔥</div>
                <div class="focus-stat-value">3</div>
                <div class="focus-stat-label">专注次数</div>
            </div>
            <div class="focus-stat">
                <div class="focus-stat-icon">⏱️</div>
                <div class="focus-stat-value">45min</div>
                <div class="focus-stat-label">总专注时长</div>
            </div>
            <div class="focus-stat">
                <div class="focus-stat-icon">⭐</div>
                <div class="focus-stat-value">90%</div>
                <div class="focus-stat-label">专注效率</div>
            </div>
        </div>
    </div>

    <!-- Tip -->
    <div class="section">
        <div class="focus-tip">
            <div class="focus-tip-icon">💡</div>
            <div class="focus-tip-text">
                <strong>番茄工作法小贴士：</strong>每专注 25 分钟休息 5 分钟，能有效提升学习效率。完成 4 个番茄钟后，奖励一次 15 分钟的长休息哦！
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-item-icon">🏠</span>首页
        </a>
        <a href="diagnosis.html" class="nav-item">
            <span class="nav-item-icon">🔍</span>诊断
        </a>
        <a href="planner.html" class="nav-item">
            <span class="nav-item-icon">📋</span>规划
        </a>
        <a href="timer.html" class="nav-item active">
            <span class="nav-item-icon">⏰</span>专注
        </a>
        <a href="report.html" class="nav-item">
            <span class="nav-item-icon">📊</span>报告
        </a>
    </nav>

    <script>
        let totalSeconds = 25 * 60;
        let remainingSeconds = totalSeconds;
        let timerInterval = null;
        let isRunning = false;

        function updateDisplay() {
            const mins = Math.floor(remainingSeconds / 60);
            const secs = remainingSeconds % 60;
            document.getElementById('timerDisplay').textContent =
                String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');

            const progress = ((totalSeconds - remainingSeconds) / totalSeconds) * 360;
            const circle = document.getElementById('timerCircle');
            if (isRunning) {
                circle.style.background = `conic-gradient(#00B894 ${progress}deg, #F0F0F0 ${progress}deg)`;
            } else {
                circle.style.background = `conic-gradient(#6C5CE7 ${progress}deg, #F0F0F0 ${progress}deg)`;
            }
        }

        function toggleTimer() {
            const btn = document.getElementById('btnStart');
            const label = document.getElementById('timerLabel');
            const circle = document.getElementById('timerCircle');

            if (isRunning) {
                clearInterval(timerInterval);
                isRunning = false;
                btn.textContent = '▶ 继续专注';
                btn.className = 'btn btn-start';
                label.textContent = '已暂停';
            } else {
                if (remainingSeconds <= 0) {
                    remainingSeconds = totalSeconds;
                    updateDisplay();
                }
                isRunning = true;
                btn.textContent = '⏸ 暂停';
                btn.className = 'btn btn-pause';
                label.textContent = '专注中...';
                circle.classList.add('running');

                timerInterval = setInterval(() => {
                    remainingSeconds--;
                    updateDisplay();
                    if (remainingSeconds <= 0) {
                        clearInterval(timerInterval);
                        isRunning = false;
                        btn.textContent = '▶ 开始专注';
                        btn.className = 'btn btn-start';
                        label.textContent = '🎉 完成！太棒了！';
                        circle.classList.remove('running');
                        circle.style.background = 'conic-gradient(#00B894 360deg, #F0F0F0 360deg)';
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            remainingSeconds = totalSeconds;
            const btn = document.getElementById('btnStart');
            btn.textContent = '▶ 开始专注';
            btn.className = 'btn btn-start';
            document.getElementById('timerLabel').textContent = '准备开始';
            document.getElementById('timerCircle').classList.remove('running');
            updateDisplay();
        }

        function setPreset(minutes, el) {
            document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            totalSeconds = minutes * 60;
            resetTimer();
        }

        updateDisplay();
    </script>
</body>
</html>
