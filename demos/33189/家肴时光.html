<div class="phone">

  <!-- Header -->
  <div class="header">

      </div>

        <div class="family-detail">
          <div class="family-name">幸福小厨 · 陈家</div>

        <span class="icon">🍽️</span>

      </div>

    </div>

      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" placeholder="搜索食材名称…" id="inventorySearch" oninput="filterInventory()">

        <span class="icon">📦</span>

        <span class="icon">🛒</span>

      </div>

      </div>

        <span class="icon">📖</span>

      </div>

      </div>

      <span class="tab-label">点菜</span>

    <div class="tab-item" data-tab="inventory" onclick="switchTab('inventory')">

      <span class="tab-label">库存</span>

      <span class="tab-label">采购</span>
    </div>
    <div class="tab-item" data-tab="recipes" onclick="switchTab('recipes')">

/* ===== Data ===== */

const inventory = [

  { id: 4, name: '西兰花', emoji: '🥦', qty: '1颗', buyDate: '2026-06-14', expiry: '2026-06-19' },
  { id: 5, name: '土豆', emoji: '🥔', qty: '4个', buyDate: '2026-06-10', expiry: '2026-06-25' },
  { id: 6, name: '大米', emoji: '🍚', qty: '5kg', buyDate: '2026-06-01', expiry: '2026-12-01' },
  { id: 7, name: '酱油', emoji: '🍾', qty: '1瓶', buyDate: '2026-05-20', expiry: '2027-05-20' },
  { id: 8, name: '牛奶', emoji: '🥛', qty: '2盒', buyDate: '2026-06-16', expiry: '2026-06-19' },

  { id: 2, name: '青椒', qty: '4个', note: '', checked: false },
  { id: 3, name: '生姜', qty: '1块', note: '', checked: false },
  { id: 4, name: '生抽', qty: '1瓶', note: '快用完了', checked: false },
  { id: 5, name: '面粉', qty: '2kg', note: '周末包饺子', checked: false },

const recipes = [
  {
    id: 1,
    name: '妈妈牌红烧肉',
    emoji: '🍖',
    author: '妈妈',
    authorEmoji: '👩‍🍳',
    tags: [{ text: '妈妈的味道', cls: 'warm' }, { text: '过年必备', cls: 'love' }],
    steps: '1. 五花肉切块，冷水下锅焯水去血沫；2. 热锅凉油，放入冰糖小火炒出糖色；3. 下肉块翻炒上色，加入葱姜八角；4. 加料酒、生抽、老抽翻炒均匀；5. 加入没过肉的热水，大火烧开转小火炖1小时；6. 大火收汁，汤汁浓稠即可出锅。',
    tips: '炒糖色要用小火，看到冒小泡立刻下肉；炖的时候水要一次加足，中途尽量不加水。',
    story: '这道红烧肉是妈妈的拿手菜，从我记事起，每逢过年过节桌上必定有它。妈妈说这是外婆教她的，外婆说是外婆的妈妈教的。肥而不腻，入口即化，每次吃到这个味道，就像是回到了小时候围着灶台等开饭的日子。',
    expanded: false
  },
  {
    id: 2,
    name: '爸爸的秘制烤鱼',
    emoji: '🐟',
    author: '爸爸',
    authorEmoji: '👨‍🍳',
    tags: [{ text: '爸爸招牌', cls: 'warm' }, { text: '周末限定', cls: 'love' }],
    steps: '1. 鲈鱼洗净，两面划花刀，用料酒、盐、姜片腌制30分钟；2. 烤箱预热200度，烤盘铺锡纸刷油；3. 鱼身刷一层薄油，撒孜然粉、辣椒粉；4. 入烤箱中层烤20分钟；5. 取出撒葱花、香菜，淋上热油激发香味。',
    tips: '鱼一定要新鲜，烤之前要把表面水分擦干，这样烤出来皮才脆。烤箱温度和时间根据自家烤箱脾气调整。',
    story: '爸爸平时不怎么下厨，但烤鱼是他的"独门绝技"。每个周末，只要爸爸说"今天烤鱼"，全家人都特别开心。他说这是他在部队跟炊事班学的，改良成了我们家的口味。外焦里嫩，香辣过瘾。',
    expanded: false
  },
  {
    id: 3,
    name: '奶奶的酸菜饺子',
    emoji: '🥟',
    author: '奶奶',
    authorEmoji: '👵',
    tags: [{ text: '祖传手艺', cls: 'warm' }, { text: '团圆必备', cls: 'love' }],
    steps: '1. 面粉加温水揉成光滑面团，醒面30分钟；2. 酸菜洗净挤干切碎，五花肉剁成肉馅；3. 肉馅加葱姜末、盐、生抽、花椒粉、香油拌匀；4. 加入酸菜碎搅拌均匀；5. 擀皮包饺子，水开下锅煮至浮起即可。',
    tips: '酸菜一定要挤干水分，不然馅料太湿不好包。肉馅最好手剁，口感比机器绞的好很多。醒面时间要够，面皮才筋道。',
    story: '奶奶是东北人，酸菜饺子是她的看家本领。每年冬至，奶奶都会早早起来和面、剁馅，一包就是好几盘。她说：\"饺子就是团圆的味道，一家人围在一起吃饺子，比什么都香。\"现在奶奶年纪大了，这个手艺传给了妈妈，但每次吃到这个味道，还是会想起奶奶在厨房忙碌的身影。',
    expanded: false
  },
];

/* ===== State ===== */
let dishLikes = {};
let shoppingChecked = {};
let recipeExpanded = {};

/* ===== Init ===== */
function init() {
  dishes.forEach(d => { dishLikes[d.id] = d.likes; });
  shoppingItems.forEach(s => { shoppingChecked[s.id] = s.checked; });
  renderDishes();
  renderInventory();
  renderShopping();
  renderRecipes();
}

/* ===== Tab Switch ===== */
function switchTab(tab) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));

  document.getElementById('panel-' + tab).classList.add('active');
  document.querySelector('.tab-item[data-tab="' + tab + '"]').classList.add('active');

  document.getElementById('content').scrollTop = 0;
}

/* ===== Render Dishes ===== */
function renderDishes() {
  const container = document.getElementById('dishList');
  container.innerHTML = dishes.map(d => {
    const liked = dishLikes[d.id] > d.likes;
    const count = dishLikes[d.id];
    return `
      <div class="dish-card">
        <div class="dish-img" style="background: linear-gradient(135deg, #FFE8D6, #FFDCC3);">${d.emoji}</div>
        <div class="dish-info">
          <div class="dish-name">${d.name}</div>
          <div class="dish-tags">
            ${d.tags.map(t => `<span class="dish-tag">${t}</span>`).join('')}
          </div>
          <div class="dish-meta">⏱ ${d.time}</div>
        </div>
        <div class="dish-action">
          <button class="btn-want${liked ? ' liked' : ''}" onclick="toggleLike(${d.id})">
            ${liked ? '❤️ 已点' : '🤍 我想吃'}
          </button>
          <span class="like-count">${count} 人想吃</span>
        </div>
      </div>
    `;
  }).join('');
}

function toggleLike(id) {
  if (dishLikes[id] > dishes.find(d => d.id === id).likes) {
    dishLikes[id]--;
  } else {
    dishLikes[id]++;
  }
  renderDishes();
}

function submitOrder() {
  showToast('✅', '已通知主厨', '妈妈已收到你的点菜需求，今晚好好吃饭哦～');
}

/* ===== Render Inventory ===== */
function renderInventory(filter = '') {
  const container = document.getElementById('inventoryGrid');
  const today = new Date(2026, 5, 18); // June 18, 2026
  let items = inventory;
  if (filter) {
    items = inventory.filter(i => i.name.includes(filter));
  }
  container.innerHTML = items.map(i => {
    const expDate = new Date(i.expiry);
    const daysLeft = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
    const expiring = daysLeft <= 3;
    return `
      <div class="inventory-card${expiring ? ' expiring' : ''}">
        <span class="expiry-badge">⚠️ 建议尽快食用</span>
        <div class="ing-icon">${i.emoji}</div>
        <div class="ing-name">${i.name}</div>
        <div class="ing-qty">${i.qty}</div>
        <div class="ing-date">📅 ${i.buyDate} 购入 · 保质至 ${i.expiry}</div>
      </div>
    `;
  }).join('');
}

function filterInventory() {
  const query = document.getElementById('inventorySearch').value.trim();
  renderInventory(query);
}

/* ===== Render Shopping ===== */
function renderShopping() {
  const listContainer = document.getElementById('shoppingList');
  listContainer.innerHTML = shoppingItems.map(s => `
    <div class="shopping-item${shoppingChecked[s.id] ? ' checked' : ''}">
      <div class="si-check" onclick="toggleShopping(${s.id})">${shoppingChecked[s.id] ? '✓' : ''}</div>
      <div class="si-info">
        <div class="si-name">${s.name}</div>
        ${s.note ? `<div class="si-note">${s.note}</div>` : ''}
      </div>
      <div class="si-qty">${s.qty}</div>
    </div>
  `).join('');

  const pending = shoppingItems.filter(s => !shoppingChecked[s.id]).length;
  document.getElementById('shoppingSummary').innerHTML = `
    <div class="count">📋 共 <strong>${pending}</strong> 项待采购</div>
    <button class="btn-quick-add" onclick="quickAddAll()">✅ 一键已购</button>
  `;
}

function toggleShopping(id) {
  shoppingChecked[id] = !shoppingChecked[id];
  renderShopping();
}

function quickAddAll() {
  const pending = shoppingItems.filter(s => !shoppingChecked[s.id]);
  if (pending.length === 0) {
    showToast('🎉', '全部已采购', '清单已清空，家庭库存满满当当！');
    return;
  }
  pending.forEach(s => { shoppingChecked[s.id] = true; });
  renderShopping();
  showToast('✅', '已一键标记', `已将 ${pending.length} 项标记为已采购`);
}

/* ===== Render Recipes ===== */
function renderRecipes() {
  const container = document.getElementById('recipeList');
  container.innerHTML = recipes.map(r => {
    const isExpanded = recipeExpanded[r.id] || false;
    return `
      <div class="recipe-card${isExpanded ? ' expanded' : ''}" id="recipe-${r.id}">
        <div class="recipe-header" onclick="toggleRecipe(${r.id})">
          <div class="recipe-img">${r.emoji}</div>
          <div class="recipe-info">
            <div class="recipe-name">${r.name}</div>
            <div class="recipe-meta">
              <span class="recipe-author">
                <span class="ra-avatar">${r.authorEmoji}</span>
                ${r.author}
              </span>
            </div>
          </div>
          <span class="recipe-arrow">▼</span>
        </div>
        <div class="recipe-tags">
          ${r.tags.map(t => `<span class="recipe-tag ${t.cls}">${t.text}</span>`).join('')}
        </div>
        <div class="recipe-expand">
          <div class="re-section">
            <div class="re-label">👨‍🍳 做法步骤</div>
            <div class="re-text">${r.steps.replace(/\n/g, '<br>')}</div>
          </div>
          <div class="re-section">
            <div class="re-label">🔥 火候要点</div>
            <div class="re-text">${r.tips}</div>
          </div>
          <div class="re-section">
            <div class="re-label">💬 背后的故事</div>
            <div class="re-text">${r.story}</div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function toggleRecipe(id) {
  recipeExpanded[id] = !recipeExpanded[id];
  renderRecipes();
}

function uploadRecipe() {
  showToast('📤', '功能预告', '上传菜谱功能即将上线，敬请期待！');
}

/* ===== Toast ===== */
function showToast(icon, msg, sub) {
  const overlay = document.createElement('div');
  overlay.className = 'toast-overlay';
  overlay.innerHTML = `
    <div class="toast-card">
      <div class="toast-icon">${icon}</div>
      <div class="toast-msg">${msg}</div>
      <div class="toast-sub">${sub}</div>
      <button class="toast-btn" onclick="this.closest('.toast-overlay').remove()">知道了</button>
    </div>
  `;
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) overlay.remove();
  });
  document.getElementById('toastContainer').appendChild(overlay);
}

/* ===== Start ===== */
init();
</script>
