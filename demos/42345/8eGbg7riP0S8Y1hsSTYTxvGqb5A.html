<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日日程本 - 网页版</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <h1>每日日程本</h1>
            <button id="weekViewBtn" class="btn btn-secondary">周视图</button>
        </header>

        <!-- 日期选择栏 -->
        <div class="date-bar">
            <button id="prevWeekBtn" class="nav-btn">&lt;</button>
            <div class="week-dates" id="weekDates">
                <!-- 动态生成一周日期 -->
            </div>
            <button id="nextWeekBtn" class="nav-btn">&gt;</button>
            <button id="datePickerBtn" class="date-picker-btn" title="选择日期">&#128197;</button>
            <input type="date" id="datePicker" class="date-picker" style="display: none;">
        </div>

        <!-- 日程列表 -->
        <div class="schedule-list" id="scheduleList">
            <div class="empty-state">
                <p>这一天还没有日程任务</p>
                <p>点击下方 + 添加新日程</p>
            </div>
        </div>

        <!-- 添加/编辑日程弹窗 -->
        <div class="modal" id="modal">
            <div class="modal-content">
                <span class="close-btn" id="closeModal">&times;</span>
                <h2 id="modalTitle">添加日程</h2>
                
                <div class="form-group">
                    <label>标题 *</label>
                    <input type="text" id="titleInput" placeholder="输入日程标题" required>
                </div>

                <div class="form-group">
                    <label>描述</label>
                    <textarea id="descInput" placeholder="输入日程描述（可选）" rows="3"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>时间 *</label>
                        <input type="time" id="timeInput" required>
                    </div>
                    <div class="form-group">
                        <label>频率</label>
                        <select id="repeatSelect">
                            <option value="0">仅一次</option>
                            <option value="1">每天</option>
                            <option value="2">每周</option>
                            <option value="3">仅本周</option>
                        </select>
                    </div>
                </div>

                <!-- 每周频率选择 -->
                <div id="weekDaysGroup" class="form-group" style="display: none;">
                    <label>选择周期：</label>
                    <div class="week-days">
                        <label><input type="checkbox" class="week-day" value="1"> 周一</label>
                        <label><input type="checkbox" class="week-day" value="2"> 周二</label>
                        <label><input type="checkbox" class="week-day" value="3"> 周三</label>
                        <label><input type="checkbox" class="week-day" value="4"> 周四</label>
                        <label><input type="checkbox" class="week-day" value="5"> 周五</label>
                        <label><input type="checkbox" class="week-day" value="6"> 周六</label>
                        <label><input type="checkbox" class="week-day" value="7"> 周日</label>
                    </div>
                </div>

                <!-- 日期范围选择（仅本周使用） -->
                <div id="dateRangeGroup" class="form-group" style="display: none;">
                    <label>选择周：</label>
                    <div class="date-range">
                        <input type="date" id="startDateInput" class="date-input" onchange="onStartDateChange(event)">
                        <span class="date-separator">至</span>
                        <input type="date" id="endDateInput" class="date-input" onchange="onEndDateChange(event)">
                    </div>
                    <div class="week-days" style="margin-top: 15px;">
                        <label>选择天数：</label>
                        <label><input type="checkbox" class="week-day" value="1"> 周一</label>
                        <label><input type="checkbox" class="week-day" value="2"> 周二</label>
                        <label><input type="checkbox" class="week-day" value="3"> 周三</label>
                        <label><input type="checkbox" class="week-day" value="4"> 周四</label>
                        <label><input type="checkbox" class="week-day" value="5"> 周五</label>
                        <label><input type="checkbox" class="week-day" value="6"> 周六</label>
                        <label><input type="checkbox" class="week-day" value="7"> 周日</label>
                    </div>
                </div>

                <div class="modal-actions">
                    <button id="saveBtn" class="btn btn-primary">保存</button>
                    <button id="deleteBtn" class="btn btn-danger" style="display: none;">删除</button>
                    <button id="cancelBtn" class="btn btn-secondary">取消</button>
                </div>
            </div>
        </div>

        <!-- 删除选项弹窗 -->
        <div class="modal" id="deleteModal">
            <div class="modal-content">
                <h2>删除方式</h2>
                <p>请选择删除方式：</p>
                <div class="modal-actions">
                    <button id="deleteAllBtn" class="btn btn-danger">删除所有</button>
                    <button id="deleteTodayBtn" class="btn btn-warning">仅跳过今日</button>
                    <button id="cancelDeleteBtn" class="btn btn-secondary">取消</button>
                </div>
            </div>
        </div>

        <!-- 周视图 -->
        <div class="week-view" id="weekView" style="display: none;">
            <div class="week-header">
                <button id="weekViewPrevBtn" class="nav-btn">&lt; 上一周</button>
                <span id="weekTitle"></span>
                <button id="weekViewNextBtn" class="nav-btn">下一周 &gt;</button>
            </div>
            <table class="week-table">
                <thead>
                    <tr>
                        <th>时间</th>
                        <th id="day1">周一</th>
                        <th id="day2">周二</th>
                        <th id="day3">周三</th>
                        <th id="day4">周四</th>
                        <th id="day5">周五</th>
                        <th id="day6">周六</th>
                        <th id="day7">周日</th>
                    </tr>
                </thead>
                <tbody id="weekTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
