<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="全网热搜聚合 - 汇聚30+平台热点">
<meta name="theme-color" content="#ff6b35">
<title>热榜聚合 · 全网热点一览</title>
<style>
:root {
  --bg: #0a0a0f; --bg-grad: #0d0d14;
  --surface: #14141c; --surface-2: #1a1a24; --surface-hover: #20202c;
  --border: #25252f; --border-light: #2f2f3a;
  --text: #e8e8f0; --text-secondary: #9a9aab; --text-muted: #5a5a68;
  --accent: #ff6b35; --accent-soft: rgba(255,107,53,.12); --accent-glow: rgba(255,107,53,.25);
  --rank-1: #ff6b35; --rank-2: #ffa940; --rank-3: #ffc53d;
  --green: #52c41a; --blue: #1890ff; --red: #ff4d4f; --gold: #fadb14;
  --shadow: 0 4px 24px rgba(0,0,0,.4); --radius: 14px; --radius-sm: 8px;
  --transition: .2s cubic-bezier(.4,0,.2,1);
  --font: -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','WenQuanYi Micro Hei',sans-serif;
  --mono: 'SF Mono','JetBrains Mono','Fira Code',Consolas,monospace;
}
[data-theme="light"] {
  --bg: #f5f5f8; --bg-grad: #eeeef4;
  --surface: #ffffff; --surface-2: #f8f8fc; --surface-hover: #f0f0f6;
  --border: #e4e4ec; --border-light: #dcdce4;
  --text: #1a1a25; --text-secondary: #5a5a68; --text-muted: #999;
  --accent: #ff5722; --accent-soft: rgba(255,87,34,.08); --accent-glow: rgba(255,87,34,.2);
  --shadow: 0 2px 16px rgba(0,0,0,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse 80% 50% at 50% -10%,var(--accent-soft),transparent);pointer-events:none}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--border-light)}

/* Header */
.header{position:sticky;top:0;z-index:100;background:rgba(10,10,15,.8);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--border);transition:background .3s,border-color .3s}
[data-theme="light"] .header{background:rgba(245,245,248,.85)}
.header-inner{max-width:1600px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;letter-spacing:-.5px;white-space:nowrap}
.logo-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#ff9558);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 14px var(--accent-glow)}
.logo-text span{color:var(--accent)}
.search-wrap{flex:1;max-width:480px;position:relative}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text-muted);pointer-events:none}
.search{width:100%;height:40px;padding:0 16px 0 42px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;outline:none;transition:var(--transition)}
.search::placeholder{color:var(--text-muted)}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.header-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--border);color:var(--text-secondary);transition:var(--transition);position:relative}
.icon-btn:hover{background:var(--surface-hover);color:var(--text);border-color:var(--border-light)}
.icon-btn:active{transform:scale(.95)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.active{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.icon-btn .badge-dot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--accent);display:none}
.icon-btn .badge-dot.show{display:block}

/* Stats */
.stats-bar{max-width:1600px;margin:0 auto;padding:16px 24px 0;display:flex;align-items:center;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--text-secondary)}
.stat-item{display:flex;align-items:center;gap:6px}
.stat-num{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.stat-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.source-tag{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:600}
.source-primary{background:rgba(82,196,26,.12);color:var(--green)}
.source-fallback{background:rgba(24,144,255,.12);color:var(--blue)}
.source-cache{background:rgba(250,219,20,.12);color:var(--gold)}

/* Categories */
.categories{max-width:1600px;margin:0 auto;padding:12px 24px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;align-items:center}
.categories::-webkit-scrollbar{display:none}
.cat-tab{padding:7px 16px;border-radius:20px;font-size:14px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--text-secondary);white-space:nowrap;transition:var(--transition);display:flex;align-items:center;gap:6px}
.cat-tab:hover{color:var(--text);border-color:var(--border-light)}
.cat-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 12px var(--accent-glow)}
.cat-count{font-size:12px;opacity:.7;font-variant-numeric:tabular-nums}

/* Toolbar */
.toolbar{max-width:1600px;margin:0 auto;padding:0 24px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tool-btn{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--text-secondary);transition:var(--transition);display:flex;align-items:center;gap:4px}
.tool-btn:hover{color:var(--text);border-color:var(--border-light)}
.tool-btn.active{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.tool-btn svg{width:14px;height:14px}
.tool-spacer{flex:1}

/* Grid */
.main{max-width:1600px;margin:0 auto;padding:0 24px 48px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}
@media(max-width:840px){.grid{grid-template-columns:1fr}}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:var(--transition);animation:cardIn .4s ease backwards}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card:hover{border-color:var(--border-light);box-shadow:var(--shadow)}
.card-header{padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.card-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;flex-shrink:0}
.card-info{flex:1;min-width:0}
.card-name{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-type{font-size:11px;color:var(--text-muted);font-weight:500}
.card-badge{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.card-src{font-size:10px;padding:2px 6px;border-radius:3px;font-weight:600;flex-shrink:0}
.card-body{flex:1}
.card-footer{padding:10px 16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-muted)}
.card-expand{color:var(--accent);font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;transition:var(--transition)}
.card-expand:hover{opacity:.8}

/* Item */
.item{display:flex;align-items:flex-start;gap:10px;padding:8px 16px;cursor:pointer;transition:var(--transition);border-bottom:1px solid transparent;position:relative}
.item:hover{background:var(--surface-hover)}
.item:last-child{border-bottom:none}
.item.read{opacity:.5}
.item.read .item-title{color:var(--text-muted)}
.item-rank{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;background:var(--surface-2);color:var(--text-muted);font-variant-numeric:tabular-nums}
.item-rank.r1{background:var(--accent);color:#fff}
.item-rank.r2{background:var(--rank-2);color:#fff}
.item-rank.r3{background:var(--rank-3);color:#fff}
.item-content{flex:1;min-width:0}
.item-title{font-size:14px;line-height:1.5;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:var(--transition)}
.item:hover .item-title{color:var(--accent)}
.item-desc{font-size:12px;color:var(--text-muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-meta{display:flex;align-items:center;gap:8px;flex-shrink:0}
.item-hot{font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.item-hot svg{width:12px;height:12px}
.item-time{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.item-new{font-size:10px;padding:1px 5px;border-radius:3px;background:var(--red);color:#fff;font-weight:700;flex-shrink:0;animation:newPulse 2s ease infinite}
@keyframes newPulse{0%,100%{opacity:1}50%{opacity:.6}}
.item-star{width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:4px;transition:var(--transition);opacity:0}
.item:hover .item-star{opacity:.5}
.item-star:hover{opacity:1!important;background:var(--surface-2)}
.item-star.active{opacity:1;color:var(--gold)}
.item-star svg{width:15px;height:15px}

/* Skeleton */
.skeleton-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.skeleton-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.skeleton-icon{width:36px;height:36px;border-radius:9px}
.skeleton-line{height:14px;border-radius:4px}
.skeleton-item{padding:8px 16px;display:flex;align-items:center;gap:10px}
.skeleton-rank{width:22px;height:22px;border-radius:6px}
.skeleton-text{flex:1;height:14px;border-radius:4px}
.shimmer{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-hover) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Error */
.card-error{padding:32px 16px;text-align:center;color:var(--text-muted);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:8px}
.card-error svg{width:32px;height:32px;opacity:.4}
.card-retry{margin-top:4px;padding:6px 16px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;transition:var(--transition)}
.card-retry:hover{background:var(--accent);color:#fff}

/* Settings */
.overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.show{opacity:1;pointer-events:auto}
.settings{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.95);z-index:201;width:90%;max-width:520px;max-height:85vh;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;opacity:0;pointer-events:none;transition:all .3s;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.settings.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.settings h2{font-size:18px;margin-bottom:20px}
.settings-close{position:absolute;top:16px;right:16px}
.setting-group{margin-bottom:20px}
.setting-label{font-size:13px;color:var(--text-secondary);margin-bottom:8px;display:block;font-weight:600}
.setting-input{width:100%;height:38px;padding:0 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;transition:var(--transition)}
.setting-input:focus{border-color:var(--accent)}
.setting-row{display:flex;align-items:center;justify-content:space-between}
.toggle{width:44px;height:24px;border-radius:12px;background:var(--border);position:relative;transition:var(--transition);cursor:pointer}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:var(--transition)}
.toggle.on::after{left:22px}
.settings-actions{display:flex;gap:12px;margin-top:24px}
.btn{flex:1;height:40px;border-radius:8px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:var(--transition)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-secondary{background:var(--surface-2);color:var(--text-secondary);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--surface-hover);color:var(--text)}

/* Toast */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(80px);z-index:300;padding:12px 24px;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:14px;box-shadow:var(--shadow);opacity:0;transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Refresh bar */
.refresh-bar{max-width:1600px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted)}
.refresh-progress{flex:1;height:2px;background:var(--border);border-radius:1px;overflow:hidden}
.refresh-fill{height:100%;background:var(--accent);width:0%;transition:width .1s linear}

/* Bookmarks view */
.bookmark-item{display:flex;align-items:flex-start;gap:12px;padding:10px 16px;cursor:pointer;transition:var(--transition);border-bottom:1px solid var(--border)}
.bookmark-item:hover{background:var(--surface-hover)}
.bookmark-item:last-child{border-bottom:none}
.bm-platform{font-size:11px;padding:2px 8px;border-radius:4px;color:#fff;font-weight:600;flex-shrink:0;white-space:nowrap}
.bm-content{flex:1;min-width:0}
.bm-title{font-size:14px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm-meta{font-size:12px;color:var(--text-muted);margin-top:2px}
.bm-remove{width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:4px;color:var(--text-muted);transition:var(--transition);opacity:0}
.bookmark-item:hover .bm-remove{opacity:1}
.bm-remove:hover{color:var(--red);background:var(--surface-2)}
.bm-remove svg{width:14px;height:14px}
.empty-state{text-align:center;padding:64px 24px;color:var(--text-muted)}
.empty-state svg{width:48px;height:48px;opacity:.3;margin-bottom:16px}
.empty-state h3{font-size:16px;color:var(--text-secondary);margin-bottom:8px;font-weight:600}
.empty-state p{font-size:14px}

@media(max-width:640px){
  .header-inner{padding:0 16px;gap:10px}
  .logo-text{display:none}
  .stats-bar,.categories,.main,.refresh-bar,.toolbar{padding-left:16px;padding-right:16px}
  .search{font-size:16px}
  .tool-btn span{display:none}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">🔥</div>
      <div class="logo-text">热榜<span>聚合</span></div>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input class="search" id="search" placeholder="搜索全网热点…" autocomplete="off">
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btnBookmark" title="收藏 (B)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
        <span class="badge-dot" id="bookmarkDot"></span>
      </button>
      <button class="icon-btn" id="btnRefresh" title="刷新 (R)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
      </button>
      <button class="icon-btn" id="btnAutoRefresh" title="自动刷新">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      </button>
      <button class="icon-btn" id="btnTheme" title="切换主题">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
      <button class="icon-btn" id="btnSettings" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="refresh-bar" id="refreshBar" style="display:none">
  <span id="refreshText">刷新中…</span>
  <div class="refresh-progress"><div class="refresh-fill" id="refreshFill"></div></div>
</div>

<div class="stats-bar" id="statsBar">
  <div class="stat-item"><span class="stat-dot"></span> <span class="stat-num" id="statPlatforms">0</span> 个平台</div>
  <div class="stat-item"><span class="stat-num" id="statItems">0</span> 条热点</div>
  <div class="stat-item">更新于 <span id="statTime">--</span></div>
  <div class="stat-item" id="statSource" style="display:none"></div>
</div>

<nav class="categories" id="categories"></nav>

<div class="toolbar" id="toolbar">
  <button class="tool-btn" id="btnSort" title="排序">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
    <span id="sortLabel">默认排序</span>
  </button>
  <button class="tool-btn" id="btnUnread" title="只看未读">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    <span>只看未读</span>
  </button>
  <button class="tool-btn" id="btnExpandAll" title="展开/收起全部">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h16M4 15h16"/></svg>
    <span>展开全部</span>
  </button>
  <div class="tool-spacer"></div>
  <button class="tool-btn" id="btnExport" title="导出收藏">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
    <span>导出收藏</span>
  </button>
  <button class="tool-btn" id="btnClearRead" title="清除已读记录">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
    <span>清除已读</span>
  </button>
</div>

<main class="main">
  <div class="grid" id="grid"></div>
</main>

// ===== Utils =====
function fmtHot(hot) {
  if (!hot && hot !== 0) return '';
  if (typeof hot === 'string') return hot;
  if (hot >= 1e8) return (hot/1e8).toFixed(1)+'亿';
  if (hot >= 1e4) return (hot/1e4).toFixed(1)+'万';
  return String(hot);
}
function fmtTime(ts) {
  if (!ts) return '--';
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
}
function fmtRelative(ts) {
  if (!ts) return '';
  const diff = Date.now() - ts;
  if (diff < 0) return '';
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff/60000)+'分钟前';
  if (diff < 86400000) return Math.floor(diff/3600000)+'小时前';
  return Math.floor(diff/86400000)+'天前';
}
function showToast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}
function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function itemKey(platformId, title) { return platformId + ':' + title; }
function isBookmarked(platformId, title) {

function isRead(key) { return state.readItems.includes(key); }
function isNew(key) { return state.showNew && !state.seenItems.includes(key); }

// ===== API: multi-source fetch with failover =====
async function fetchFromSource(source, platformId) {
  const base = state.apiBases[source.t];
  if (!base) throw new Error('No API base for ' + source.t);
  let url;
  if (source.t === 'dailyhot') {
    url = `${base}/${source.p}`;
  } else {
    url = `${base}?type=${source.p}`;
  }
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    return normalizeData(json, source.t, platformId);
  } finally { clearTimeout(timer); }
}

function normalizeData(json, sourceType, platformId) {
  if (sourceType === 'dailyhot') {
    if (json.code !== 200) throw new Error('API code ' + json.code);
    if (!json.data || json.data.length === 0) throw new Error('Empty data');
    return {
      name: json.title || json.name || platformId,
      type: json.type || '',
      total: json.total || json.data.length,
      updateTime: json.updateTime || Date.now(),
      items: json.data.map(it => ({
        id: it.id || String(it.title),
        title: it.title || '',
        desc: it.desc && it.desc !== '-' ? it.desc : '',
        hot: it.hot || 0,
        url: it.url || it.mobileUrl || '',
        mobileUrl: it.mobileUrl || it.url || '',
        timestamp: it.timestamp || null,
      })),
    };
  } else { // guiguiya
    if (!json.success) throw new Error(json.message || 'API error');
    if (!json.data || json.data.length === 0) throw new Error('Empty data');
    return {
      name: json.title || platformId,
      type: json.subtitle || '',
      total: json.total || json.data.length,
      updateTime: json.update_time ? new Date(json.update_time).getTime() : Date.now(),
      items: json.data.map(it => ({
        id: String(it.index),
        title: it.title || '',
        desc: '',
        hot: it.hot || '',
        url: it.url || it.mobilUrl || '',
        mobileUrl: it.mobilUrl || it.url || '',
        timestamp: null,
      })),
    };
  }
}

async function fetchPlatform(platform) {
  let lastErr;
  for (const source of platform.sources) {
    try {
      const result = await fetchFromSource(source, platform.id);
      if (result && result.items.length > 0) {
        // Cache it
        const cacheKey = 'cache_' + platform.id;
        localStorage.setItem(cacheKey, JSON.stringify({ data: result, ts: Date.now() }));
        return { ok: true, data: result, source: source.t };
      }
    } catch (e) { lastErr = e; }
  }
  // Try cache
  const cacheKey = 'cache_' + platform.id;
  try {
    const cached = JSON.parse(localStorage.getItem(cacheKey));
    if (cached && cached.data) {
      return { ok: true, data: cached.data, source: 'cache', cacheTs: cached.ts };
    }
  } catch(e){}
  return { ok: false, error: lastErr ? lastErr.message : '所有源均不可用' };
}

async function parallelLimit(items, fn, limit = 6, onProgress) {
  const results = new Array(items.length);
  let next = 0, done = 0;
  async function worker() {
    while (next < items.length) {
      const idx = next++;
      try { results[idx] = await fn(items[idx], idx); }
      catch(e) { results[idx] = { ok:false, error:e }; }
      done++;
      if (onProgress) onProgress(done, items.length);
    }
  }
  await Promise.all(Array.from({length: Math.min(limit, items.length)}, () => worker()));
  return results;
}

// ===== Load all =====
async function loadAll() {
  if (state.loading) return;
  state.loading = true;
  const btn = $('btnRefresh');
  btn.style.opacity = '.6'; btn.style.pointerEvents = 'none';
  $('refreshBar').style.display = 'flex';
  $('refreshFill').style.width = '0%';
  $('refreshText').textContent = '刷新中…';
  renderSkeletons();

  const targets = getFilteredPlatforms();
  const results = await parallelLimit(targets, fetchPlatform, 6, (done, total) => {
    $('refreshFill').style.width = (done/total*100)+'%';
    $('refreshText').textContent = `刷新中… ${done}/${total}`;
  });

  let srcCounts = { dailyhot:0, guiguiya:0, cache:0 };
  targets.forEach((p, i) => {
    const r = results[i];
    if (r && r.ok) {
      state.data[p.id] = r.data;
      state.sources[p.id] = r.source;
      delete state.errors[p.id];
      if (srcCounts[r.source] !== undefined) srcCounts[r.source]++;
    } else {
      state.errors[p.id] = (r && r.error) ? r.error : '未知错误';
    }
  });

  // Update seen items for NEW detection
  const currentKeys = [];
  for (const pid in state.data) {
    for (const it of state.data[pid].items) {
      currentKeys.push(itemKey(pid, it.title));
    }
  }
  // Mark current items as seen (for next load's NEW detection)
  const newSeen = new Set(state.seenItems);
  for (const k of currentKeys) newSeen.add(k);
  state.seenItems = Array.from(newSeen);
  saveSeenItems();

  $('refreshBar').style.display = 'none';
  btn.style.opacity = '1'; btn.style.pointerEvents = 'auto';
  state.loading = false;
  updateStats(srcCounts);
  renderGrid();
  showToast('数据已更新');
}

function getFilteredPlatforms() {
  if (state.category === 'all') return PLATFORMS;
  return PLATFORMS.filter(p => p.cat === state.category);
}

      </div>
      ${Array.from({length:6},()=>`<div class="skeleton-item"><div class="skeleton-rank shimmer"></div><div class="skeleton-text shimmer" style="width:${60+Math.random()*30}%"></div></div>`).join('')}
    </div>`).join('');
}

function renderGrid() {
  if (state.category === 'bookmarks') { renderBookmarks(); return; }

  const list = getFilteredPlatforms();
  const q = state.search.trim().toLowerCase();

  grid.innerHTML = list.map((p, i) => {
    const data = state.data[p.id];
    const err = state.errors[p.id];
    const src = state.sources[p.id];

    // Source badge
    let srcBadge = '';
    if (src === 'dailyhot') srcBadge = '<span class="card-src source-primary">主源</span>';
    else if (src === 'guiguiya') srcBadge = '<span class="card-src source-fallback">备用</span>';
    else if (src === 'cache') srcBadge = '<span class="card-src source-cache">缓存</span>';

    if (err) {
      return `<div class="card" style="animation-delay:${i*30}ms">
        <div class="card-header">
          <div class="card-icon" style="background:${p.color}">${p.abbr}</div>
          <div class="card-info"><div class="card-name">${p.name}</div><div class="card-type">${p.type}</div></div>
        </div>
        <div class="card-error">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          <div>加载失败 · ${escapeHtml(err)}</div>
          <button class="card-retry" onclick="retryPlatform('${p.id}')">重试</button>
        </div></div>`;
    }

    if (!data || !data.items) {
      return `<div class="card" style="animation-delay:${i*30}ms">
        <div class="card-header">
          <div class="card-icon" style="background:${p.color}">${p.abbr}</div>
          <div class="card-info"><div class="card-name">${p.name}</div><div class="card-type">${p.type}</div></div>
        </div>
        <div class="card-error"><div class="shimmer" style="width:40px;height:40px;border-radius:50%"></div><div>加载中…</div></div></div>`;
    }

    let items = data.items.slice();
    if (q) {
      items = items.filter(it => (it.title||'').toLowerCase().includes(q) || (it.desc||'').toLowerCase().includes(q));
    }
    if (state.onlyUnread) {
      items = items.filter(it => !isRead(itemKey(p.id, it.title)));
    }

    // Sort
    if (state.sortMode === 'hot') {
      items.sort((a,b) => {
        const ha = typeof a.hot === 'number' ? a.hot : parseFloat(String(a.hot).replace(/[^\d.]/g,'')) || 0;
        const hb = typeof b.hot === 'number' ? b.hot : parseFloat(String(b.hot).replace(/[^\d.]/g,'')) || 0;
        return hb - ha;
      });
    } else if (state.sortMode === 'time') {
      items.sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
    }

    const isExpanded = state.expanded.has(p.id);
    const displayCount = isExpanded ? items.length : Math.min(state.limit, items.length);
    const displayItems = items.slice(0, displayCount);

    const itemsHtml = displayItems.length > 0 ? displayItems.map((it, idx) => {
      const rank = idx + 1;
      const rankClass = rank <= 3 ? `r${rank}` : '';
      const key = itemKey(p.id, it.title);
      const readClass = isRead(key) ? 'read' : '';
      const newBadge = isNew(key) ? '<span class="item-new">NEW</span>' : '';
      const hot = (state.showHot && it.hot) ? `<div class="item-hot"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5.67s.74 2.65.74 4.8c0 2.06-1.35 3.73-3.41 3.73-2.07 0-3.63-1.67-3.63-3.73l.03-.36C5.21 7.51 4 10.62 4 14c0 4.42 3.58 8 8 8s8-3.58 8-8C20 8.61 17.41 3.8 13.5.67z"/></svg>${fmtHot(it.hot)}</div>` : '';
      const time = it.timestamp ? `<span class="item-time">${fmtRelative(it.timestamp)}</span>` : '';
      const starActive = isBookmarked(p.id, it.title) ? 'active' : '';
      const desc = it.desc && it.desc !== '-' ? `<div class="item-desc">${escapeHtml(it.desc)}</div>` : '';
      return `<div class="item ${readClass}" data-url="${escapeHtml(it.url||it.mobileUrl||p.link)}" data-pid="${p.id}" data-title="${escapeHtml(it.title)}">
        <div class="item-rank ${rankClass}">${rank}</div>
        <div class="item-content">
          <div class="item-title">${escapeHtml(it.title)} ${newBadge}</div>
          ${desc}
        </div>
        <div class="item-meta">${time}${hot}
          <div class="item-star ${starActive}" data-pid="${p.id}" data-title="${escapeHtml(it.title)}" data-url="${escapeHtml(it.url||it.mobileUrl||'')}" data-hot="${escapeHtml(fmtHot(it.hot))}">
            <svg viewBox="0 0 24 24" fill="${starActive?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
          </div>
        </div>
      </div>`;
    }).join('') : `<div class="card-error" style="padding:24px"><div>暂无数据</div></div>`;

    const expandBtn = items.length > state.limit
      ? `<span class="card-expand" onclick="toggleExpand('${p.id}')">${isExpanded ? '收起' : `展开全部 ${items.length} 条`}</span>` : '';

    return `<div class="card" style="animation-delay:${i*30}ms">
      <div class="card-header">
        <div class="card-icon" style="background:${p.color}">${p.abbr}</div>
        <div class="card-info">
          <div class="card-name">${p.name} <span class="card-badge">${data.type||p.type}</span></div>
          <div class="card-type">${items.length} 条 · ${p.link.replace('https://','').replace('http://','').split('/')[0]}</div>
        </div>
        ${srcBadge}
      </div>
      <div class="card-body">${itemsHtml}</div>
      <div class="card-footer">
        <a href="${p.link}" target="_blank" style="color:var(--text-muted)">访问 ${p.name} →</a>
        ${expandBtn}
      </div>
    </div>`;
  }).join('');

  // Bind item events
  grid.querySelectorAll('.item').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('.item-star')) return;
      const url = el.dataset.url;
      const pid = el.dataset.pid;
      const title = el.dataset.title;
      // Mark as read
      const key = itemKey(pid, title);
      if (!state.readItems.includes(key)) {
        state.readItems.push(key);
        if (state.readItems.length > 3000) state.readItems = state.readItems.slice(-3000);
        saveReadItems();
      }
      el.classList.add('read');
      window.open(url, '_blank');
    });
  });

  grid.querySelectorAll('.item-star').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const pid = el.dataset.pid;
      const title = el.dataset.title;
      toggleBookmark(pid, title, el.dataset.url, el.dataset.hot);
      el.classList.toggle('active');
      el.querySelector('svg').setAttribute('fill', el.classList.contains('active') ? 'currentColor' : 'none');
    });
  });
}

function renderBookmarks() {
  if (state.bookmarks.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
      <h3>还没有收藏</h3>
      <p>点击热点条目右侧的星标即可收藏</p>
    </div>`;
    return;
  }

  let bms = state.bookmarks.slice().reverse();
  if (state.search.trim()) {
    const q = state.search.trim().toLowerCase();
    bms = bms.filter(b => b.title.toLowerCase().includes(q));
  }

  if (bms.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><h3>未找到匹配的收藏</h3></div>`;
    return;
  }

  // Group by platform
  const grouped = {};
  bms.forEach(b => {
    if (!grouped[b.platform]) grouped[b.platform] = [];
    grouped[b.platform].push(b);
  });

  grid.innerHTML = Object.entries(grouped).map(([pid, items]) => {
    const p = PLATFORMS.find(x => x.id === pid);
    if (!p) return '';
    return `<div class="card">
      <div class="card-header">
        <div class="card-icon" style="background:${p.color}">${p.abbr}</div>
        <div class="card-info"><div class="card-name">${p.name}</div><div class="card-type">${items.length} 条收藏</div></div>
      </div>
      <div class="card-body">
        ${items.map(b => `<div class="bookmark-item" data-url="${escapeHtml(b.url)}">
          <div class="bm-platform" style="background:${p.color}">${p.abbr}</div>
          <div class="bm-content">
            <div class="bm-title">${escapeHtml(b.title)}</div>
            <div class="bm-meta">${b.hot||''} · 收藏于 ${fmtRelative(b.savedAt)}</div>
          </div>
          <div class="bm-remove" data-pid="${pid}" data-title="${escapeHtml(b.title)}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </div>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.bookmark-item').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('.bm-remove')) return;
      window.open(el.dataset.url, '_blank');
    });
  });
  grid.querySelectorAll('.bm-remove').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      removeBookmark(el.dataset.pid, el.dataset.title);
      renderBookmarks();
      updateBookmarkDot();
    });
  });
}

function toggleBookmark(pid, title, url, hot) {
  const idx = state.bookmarks.findIndex(b => b.platform === pid && b.title === title);
  if (idx >= 0) {
    state.bookmarks.splice(idx, 1);
    showToast('已取消收藏');
  } else {
    state.bookmarks.push({ platform: pid, title, url, hot, savedAt: Date.now() });
    showToast('已收藏');
  }
  saveBookmarks();
}

function removeBookmark(pid, title) {
  state.bookmarks = state.bookmarks.filter(b => !(b.platform === pid && b.title === title));
  saveBookmarks();
}

function toggleExpand(id) {
  if (state.expanded.has(id)) state.expanded.delete(id);
  else state.expanded.add(id);
  renderGrid();
}

async function retryPlatform(id) {
  const p = PLATFORMS.find(x => x.id === id);
  if (!p) return;
  showToast('正在重试 ' + p.name + '…');
  const r = await fetchPlatform(p);
  if (r.ok) {
    state.data[id] = r.data;
    state.sources[id] = r.source;
    delete state.errors[id];
    renderGrid();
    updateStats();
  } else {
    showToast('重试失败: ' + r.error);
  }
}

function updateStats(srcCounts) {
  let platforms = 0, items = 0;
  for (const id in state.data) {
    if (state.data[id] && state.data[id].items) {
      platforms++; items += state.data[id].items.length;
    }
  }
  $('statPlatforms').textContent = platforms;
  $('statItems').textContent = items;
  $('statTime').textContent = fmtTime(Date.now());

  if (srcCounts) {
    const parts = [];
    if (srcCounts.dailyhot) parts.push(`<span class="source-tag source-primary">主源 ${srcCounts.dailyhot}</span>`);
    if (srcCounts.guiguiya) parts.push(`<span class="source-tag source-fallback">备用 ${srcCounts.guiguiya}</span>`);
    if (srcCounts.cache) parts.push(`<span class="source-tag source-cache">缓存 ${srcCounts.cache}</span>`);
    const el = $('statSource');
    el.innerHTML = parts.join(' ');
    el.style.display = parts.length > 0 ? 'flex' : 'none';
  }
}

// ===== Categories =====
function renderCategories() {
  const container = $('categories');
  container.innerHTML = CATEGORIES.map(c => {
    let count;
    if (c.id === 'all') count = PLATFORMS.length;
    else if (c.id === 'bookmarks') count = state.bookmarks.length;
    else count = PLATFORMS.filter(p => p.cat === c.id).length;
    return `<button class="cat-tab ${c.id === state.category ? 'active' : ''}" data-cat="${c.id}">${c.name}<span class="cat-count">${count}</span></button>`;
  }).join('');
  container.querySelectorAll('.cat-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      state.category = tab.dataset.cat;
      renderCategories();
      if (state.category === 'bookmarks') renderBookmarks();
      else renderGrid();
    });
  });
}

// ===== Auto refresh =====
function setupAutoRefresh() {
  if (state.autoTimer) clearInterval(state.autoTimer);
  if (state.autoRefresh) {
    state.autoTimer = setInterval(() => { if (state.category !== 'bookmarks') loadAll(); }, 5*60*1000);
    $('btnAutoRefresh').classList.add('active');
  } else {
    $('btnAutoRefresh').classList.remove('active');
  }
}

// ===== Settings =====
function openSettings() {
  $('apiInput').value = state.apiBases.dailyhot;
  $('apiInput2').value = state.apiBases.guiguiya;
  $('limitInput').value = state.limit;
  $('autoToggle').classList.toggle('on', state.autoRefresh);
  $('hotToggle').classList.toggle('on', state.showHot);
  $('newToggle').classList.toggle('on', state.showNew);
  $('overlay').classList.add('show');
  $('settingsPanel').classList.add('show');
}
function closeSettings() {
  $('overlay').classList.remove('show');
  $('settingsPanel').classList.remove('show');
}

// ===== Export =====
function exportBookmarks() {
  if (state.bookmarks.length === 0) { showToast('暂无收藏可导出'); return; }
  const blob = new Blob([JSON.stringify(state.bookmarks, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `hotnews-bookmarks-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`已导出 ${state.bookmarks.length} 条收藏`);
}

// ===== Events =====
$('btnRefresh').addEventListener('click', loadAll);
$('btnTheme').addEventListener('click', toggleTheme);
$('btnBookmark').addEventListener('click', () => {
  state.category = 'bookmarks';
  renderCategories();
  renderBookmarks();
});
$('btnAutoRefresh').addEventListener('click', () => {
  state.autoRefresh = !state.autoRefresh;
  localStorage.setItem('autoRefresh', state.autoRefresh);
  setupAutoRefresh();
  showToast(state.autoRefresh ? '已开启自动刷新' : '已关闭自动刷新');
});
$('btnSettings').addEventListener('click', openSettings);
$('settingsClose').addEventListener('click', closeSettings);
$('overlay').addEventListener('click', closeSettings);
$('settingsCancel').addEventListener('click', closeSettings);
$('settingsSave').addEventListener('click', () => {
  state.apiBases.dailyhot = $('apiInput').value.trim().replace(/\/+$/,'') || 'https://hot.uf4te.cn';
  state.apiBases.guiguiya = $('apiInput2').value.trim().replace(/\/+$/,'') || 'https://api.guiguiya.com/api/hotlist';
  state.limit = Math.max(3, Math.min(50, parseInt($('limitInput').value) || 10));
  state.autoRefresh = $('autoToggle').classList.contains('on');
  state.showHot = $('hotToggle').classList.contains('on');
  state.showNew = $('newToggle').classList.contains('on');
  localStorage.setItem('apiBases', JSON.stringify(state.apiBases));
  localStorage.setItem('limit', state.limit);
  localStorage.setItem('autoRefresh', state.autoRefresh);
  localStorage.setItem('showHot', state.showHot);
  localStorage.setItem('showNew', state.showNew);
  closeSettings();
  setupAutoRefresh();
  showToast('设置已保存');
  loadAll();
});
$('autoToggle').addEventListener('click', () => $('autoToggle').classList.toggle('on'));
$('hotToggle').addEventListener('click', () => $('hotToggle').classList.toggle('on'));
$('newToggle').addEventListener('click', () => $('newToggle').classList.toggle('on'));

$('btnSort').addEventListener('click', () => {
  const modes = ['default', 'hot', 'time'];
  const labels = { default:'默认排序', hot:'按热度', time:'按时间' };
  const idx = modes.indexOf(state.sortMode);
  state.sortMode = modes[(idx + 1) % modes.length];
  localStorage.setItem('sortMode', state.sortMode);
  $('sortLabel').textContent = labels[state.sortMode];
  $('btnSort').classList.toggle('active', state.sortMode !== 'default');
  renderGrid();
});

$('btnUnread').addEventListener('click', () => {
  state.onlyUnread = !state.onlyUnread;
  $('btnUnread').classList.toggle('active', state.onlyUnread);
  renderGrid();
});

$('btnExpandAll').addEventListener('click', () => {
  const list = getFilteredPlatforms();
  const allExpanded = list.every(p => state.expanded.has(p.id));
  if (allExpanded) {
    list.forEach(p => state.expanded.delete(p.id));
    $('btnExpandAll').querySelector('span').textContent = '展开全部';
  } else {
    list.forEach(p => state.expanded.add(p.id));
    $('btnExpandAll').querySelector('span').textContent = '收起全部';
  }
  renderGrid();
});

$('btnExport').addEventListener('click', exportBookmarks);

$('btnClearRead').addEventListener('click', () => {
  state.readItems = [];
  saveReadItems();
  renderGrid();
  showToast('已清除已读记录');
});

let searchTimer;
searchInput.addEventListener('input', () => {
  state.search = searchInput.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    if (state.category === 'bookmarks') renderBookmarks();
    else renderGrid();
  }, 150);
});

document.addEventListener('keydown', e => {
  if (e.key === 'r' && !e.ctrlKey && !e.metaKey && document.activeElement !== searchInput) loadAll();
  if (e.key === 'b' && !e.ctrlKey && !e.metaKey && document.activeElement !== searchInput) {
    state.category = state.category === 'bookmarks' ? 'all' : 'bookmarks';
    renderCategories();
    if (state.category === 'bookmarks') renderBookmarks(); else renderGrid();
  }
  if ((e.ctrlKey||e.metaKey) && e.key === 'k') { e.preventDefault(); searchInput.focus(); }
  if (e.key === 'Escape') {
    closeSettings();
    if (document.activeElement === searchInput) {
      searchInput.value = ''; state.search = '';
      if (state.category === 'bookmarks') renderBookmarks(); else renderGrid();
      searchInput.blur();
    }
  }
});

// ===== Init =====
applyTheme();
updateBookmarkDot();
renderCategories();
setupAutoRefresh();
// Show cached data immediately if available
(function showCachedFirst() {
  for (const p of PLATFORMS) {
    try {
      const cached = JSON.parse(localStorage.getItem('cache_' + p.id));
      if (cached && cached.data) {
        state.data[p.id] = cached.data;
        state.sources[p.id] = 'cache';
      }
    } catch(e){}
  }
  if (Object.keys(state.data).length > 0) {
    updateStats();
    renderGrid();
  }
})();
loadAll();
</script>
</body>
</html>
