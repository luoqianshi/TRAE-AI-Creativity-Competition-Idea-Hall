<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>万象山海 | 神话游戏</title>
    <link rel="icon" href="麒麟与DND文字组合图案.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1c1c1c;
            --ink-light: #3a3a3a;
            --vermilion: #a52a2a;
            --vermilion-light: #c94c4c;
            --gold: #b8860b;
            --gold-light: #d4a547;
            --paper: #faf8f3;
            --paper-dark: #f0ebe0;
            --cyan: #4a6b6b;
            --shadow: rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif SC', 'Songti SC', serif;
            background-color: var(--paper);
            color: var(--ink);
            line-height: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 背景装饰 */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-decoration::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center, transparent 0%, var(--paper) 70%);
        }

        .concentric-circle {
            position: absolute;
            border: 1px solid var(--gold);
            border-radius: 50%;
            opacity: 0.12;
        }

        .circle-group {
            position: absolute;
        }

        .circle-group-1 {
            width: 350px;
            height: 350px;
            top: 5%;
            left: 3%;
        }

        .circle-group-2 {
            width: 280px;
            height: 280px;
            top: 18%;
            right: 5%;
        }

        .circle-group-3 {
            width: 320px;
            height: 320px;
            bottom: 10%;
            left: 10%;
        }

        .circle-group-4 {
            width: 220px;
            height: 220px;
            bottom: 20%;
            right: 15%;
        }

        .ring {
            position: absolute;
            border: 1px solid var(--gold);
            border-radius: 50%;
            opacity: 0.15;
            box-sizing: border-box;
        }

        .ring-1 {
            width: 100%;
            height: 100%;
            border-width: 2px;
            clip-path: polygon(0 0, 100% 0, 100% 70%, 0 85%);
        }

        .ring-2 {
            width: 85%;
            height: 85%;
            top: 7.5%;
            left: 7.5%;
            clip-path: polygon(20% 0, 100% 0, 100% 100%, 0 100%, 0 30%);
        }

        .ring-3 {
            width: 70%;
            height: 70%;
            top: 15%;
            left: 15%;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 40% 100%, 30% 0);
        }

        .ring-4 {
            width: 55%;
            height: 55%;
            top: 22.5%;
            left: 22.5%;
        }

        .ring-5 {
            width: 40%;
            height: 40%;
            top: 30%;
            left: 30%;
            clip-path: polygon(50% 0, 100% 0, 100% 60%, 0 60%, 0 20%);
        }

        /* 主内容 */
        .main-content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
        }

        .title-wrapper {
            margin-bottom: 3rem;
        }

        .main-title {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 0.3em;
            color: var(--ink);
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px var(--shadow);
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--gold);
            letter-spacing: 0.5em;
            font-weight: 500;
        }

        .seal {
            display: inline-block;
            width: 60px;
            height: 60px;
            border: 3px solid var(--vermilion);
            border-radius: 8px;
            color: var(--vermilion);
            font-size: 1.5rem;
            line-height: 54px;
            margin: 2rem 0;
        }

        .desc {
            font-size: 1.1rem;
            color: var(--ink-light);
            max-width: 600px;
            margin: 0 auto 3rem;
            line-height: 2.2;
        }

        /* 按钮 */
        .button-group {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .nav-button {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            padding: 1.2rem 2.5rem;
            background: white;
            border: 2px solid var(--gold);
            color: var(--ink);
            text-decoration: none;
            font-size: 1.1rem;
            letter-spacing: 0.15em;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .nav-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(184, 134, 11, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .nav-button:hover::before {
            left: 100%;
        }

        .nav-button:hover {
            border-color: var(--vermilion);
            color: var(--vermilion);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px var(--shadow);
        }

        .nav-button .icon {
            font-size: 1.3rem;
        }

        /* 页脚 */
        footer {
            position: relative;
            z-index: 1;
            padding: 2rem;
            text-align: center;
            color: var(--ink-light);
            font-size: 0.9rem;
            letter-spacing: 0.1em;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .main-title {
                font-size: 2.5rem;
                letter-spacing: 0.2em;
            }

            .subtitle {
                font-size: 1rem;
                letter-spacing: 0.3em;
            }

            .desc {
                font-size: 1rem;
                padding: 0 1rem;
            }

            .button-group {
                flex-direction: column;
                gap: 1rem;
            }

            .nav-button {
                padding: 1rem 2rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- 背景装饰 -->
    <div class="bg-decoration">
        <div class="circle-group circle-group-1">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="ring ring-3"></div>
            <div class="ring ring-4"></div>
            <div class="ring ring-5"></div>
        </div>
        <div class="circle-group circle-group-2">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="ring ring-3"></div>
            <div class="ring ring-4"></div>
            <div class="ring ring-5"></div>
        </div>
        <div class="circle-group circle-group-3">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="ring ring-3"></div>
            <div class="ring ring-4"></div>
            <div class="ring ring-5"></div>
        </div>
        <div class="circle-group circle-group-4">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="ring ring-3"></div>
            <div class="ring ring-4"></div>
            <div class="ring ring-5"></div>
        </div>
    </div>

    <!-- 主内容 -->
    <main class="main-content">
        <div class="title-wrapper">
            <h1 class="main-title">万象山海</h1>
            <p class="subtitle">读神话 · 知古今</p>
        </div>

        <div class="seal">神</div>

        <p class="desc">
            神话者，先民智慧之所聚也。<br>
            然典籍繁多，文字艰深，图像稀少。<br>
            今以此为舟，载神话而行，使众人皆可亲历其境。
        </p>

        <div class="button-group">
            <a href="origin.html" class="nav-button">
                <span>缘起</span>
            </a>
            <a href="function.html" class="nav-button">
                <span>万事之要</span>
            </a>
            <a href="game.html" class="nav-button">
                <span>游之概览</span>
            </a>
        </div>
    </main>

    <!-- 页脚 -->
    <footer>
        万象山海 · 神话之游
    </footer>
</body>
</html>
