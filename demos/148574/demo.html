<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园闲置好物流转平台</title>
<style>
:root {
    --primary: #4CAF50;
    --light: #f1f8e9;
    --gray: #e0e0e0;
    --dark: #333;
}
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft YaHei", sans-serif;
}
body {
    background-color: var(--light);
    padding: 24px;
    color: var(--dark);
}
.container {
    max-width: 1200px;
    margin: 0 auto;
}
header {
    text-align: center;
    margin-bottom: 30px;
}
header h1 {
    color: var(--primary);
    margin-bottom: 8px;
    font-size: 26px;
}
.main-layout {
    display: grid;
    grid-template-columns: 350px 1fr;
    gap: 24px;
}
@media (max-width:768px) {
    .main-layout {
        grid-template-columns: 1fr;
    }
}
.card {
    background: #fff;
    border-radius: 16px;
    padding: 22px;
    box-shadow: 0 3px 12px rgba(76,175,80,0.15);
    margin-bottom: 20px;
}
.card-title {
    font-size: 18px;
    color: var(--primary);
    margin-bottom: 16px;
    font-weight: 600;
}
input, textarea, select {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--gray);
    border-radius: 10px;
    margin-bottom: 12px;
    font-size: 14px;
}
textarea {
    min-height: 90px;
    resize: none;
}
button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
}
.btn-primary {
    background: var(--primary);
    color: white;
}
.btn-delete {
    background: #f44336;
    color: white;
    margin-top: 6px;
}
.filter-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}
.item-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px;
}
.item-card {
    background: white;
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.item-card h3 {
    font-size: 16px;
    margin-bottom: 6px;
}
.item-tag {
    display: inline-block;
    background: var(--light);
    color: var(--primary);
    padding: 3px 7px;
    border-radius: 5px;
    font-size: 12px;
    margin-bottom: 8px;
}
.empty-tip {
    text-align: center;
    color: #999;
    padding: 50px 0;
}
</style>
</head>
<body>
<div class="container">
    <header>
        <h1>校园闲置好物流转平台</h1>
        <p>教材循环｜宿舍好物｜公益捐赠｜绿色校园</p>
    </header>
    <div class="main-layout">
        <!-- 发布表单 -->
        <div>
            <div class="card">
                <div class="card-title">发布闲置物品</div>
                <input id="itemName" placeholder="物品名称（例：大学教材、宿舍台灯）">
                <select id="itemCategory">
                    <option value="教材教辅">教材教辅</option>
                    <option value="宿舍用品">宿舍用品</option>
                    <option value="家电数码">家电数码</option>
                    <option value="衣物杂货">衣物杂货</option>
                    <option value="公益捐赠">公益捐赠</option>
                </select>
                <textarea id="itemDesc" placeholder="物品详情、成色、自提地点、价格/是否免费"></textarea>
                <button class="btn-primary" onclick="publishItem()">发布信息</button>
            </div>
        </div>
        <!-- 物品展示 -->
        <div>
            <div class="card">
                <div class="card-title">校园闲置集市</div>
                <div class="filter-bar">
                    <select id="filterCategory" onchange="renderItems()">
                        <option value="">全部分类</option>
                        <option value="教材教辅">教材教辅</option>
                        <option value="宿舍用品">宿舍用品</option>
                        <option value="家电数码">家电数码</option>
                        <option value="衣物杂货">衣物杂货</option>
                        <option value="公益捐赠">公益捐赠</option>
                    </select>
                </div>
                <div id="itemListWrap">
                    <div class="empty-tip">暂无闲置信息，快来发布第一条吧</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const STORAGE_KEY = "campusSecondHandData";
let itemList = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

// 保存本地
function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(itemList));
}

// 渲染列表
function renderItems() {
    const wrap = document.getElementById("itemListWrap");
    const filterCat = document.getElementById("filterCategory").value;
    let showList = itemList;
    if(filterCat) {
        showList = itemList.filter(i => i.category === filterCat);
    }
    if(showList.length === 0) {
        wrap.innerHTML = `<div class="empty-tip">暂无匹配信息</div>`;
        return;
    }
    let html = `<div class="item-grid">`;
    showList.forEach((item, idx) => {
        html += `
        <div class="item-card">
            <span class="item-tag">${item.category}</span>
            <h3>${item.name}</h3>
            <p>${item.desc}</p>
            <p style="font-size:12px;color:#777;margin:8px 0">${item.time}</p>
            <button class="btn-delete" onclick="deleteItem(${idx})">删除</button>
        </div>`;
    });
    html += `</div>`;
    wrap.innerHTML = html;
}

// 发布
function publishItem() {
    const name = document.getElementById("itemName").value.trim();
    const category = document.getElementById("itemCategory").value;
    const desc = document.getElementById("itemDesc").value.trim();
    if(!name) {
        alert("请填写物品名称");
        return;
    }
    const newItem = {
        name,
        category,
        desc,
        time: new Date().toLocaleString()
    };
    itemList.unshift(newItem);
    saveData();
    renderItems();
    //清空输入
    document.getElementById("itemName").value = "";
    document.getElementById("itemDesc").value = "";
}

// 删除
function deleteItem(idx) {
    if(confirm("确认删除本条信息？")) {
        itemList.splice(idx,1);
        saveData();
        renderItems();
    }
}

//初始化渲染
renderItems();
</script>
</body>
</html>
