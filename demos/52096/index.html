<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高中生 Todo 清单</title>
  <style>
    :root {
      --bg: #f5efe3;
      --paper: rgba(255, 250, 242, 0.88);
      --panel: rgba(255, 255, 255, 0.72);
      --ink: #22303c;
      --subtle: #61707d;
      --accent: #ff8a5b;
      --accent-deep: #e16132;
      --line: rgba(34, 48, 60, 0.12);
      --math: #6b7cff;
      --chinese: #ff6f91;
      --english: #28b39a;
      --science: #8e63d7;
      --done: #96a3af;
      --shadow: 0 18px 50px rgba(78, 63, 46, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(255, 190, 140, 0.75), transparent 28%),
        radial-gradient(circle at right 10% top 15%, rgba(107, 124, 255, 0.24), transparent 25%),
        linear-gradient(135deg, #f7f2e8 0%, #efe6d6 45%, #f5efe3 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.28;
      background-image:
        linear-gradient(to bottom, transparent 0 41px, rgba(97, 112, 125, 0.08) 41px 42px),
        linear-gradient(to right, transparent 0 63px, rgba(97, 112, 125, 0.04) 63px 64px);
      background-size: 100% 42px, 64px 100%;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 28px auto;
      display: grid;
      grid-template-columns: 1.05fr 1.4fr;
      gap: 22px;
      position: relative;
      z-index: 1;
    }

    .panel {
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 28px;
      background: var(--paper);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      overflow: hidden;
    }

    .panel::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,0.25), transparent 30%);
    }

    .hero {
      padding: 30px;
      min-height: 100%;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 138, 91, 0.12);
      color: var(--accent-deep);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .title {
      margin: 20px 0 10px;
      font-family: "STKaiti", "KaiTi", "Songti SC", serif;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 0.98;
      letter-spacing: 0.02em;
    }

    .hero p {
      margin: 0;
      max-width: 500px;
      font-size: 16px;
      line-height: 1.8;
      color: var(--subtle);
    }

    .date-card {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 28px;
      padding: 22px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(34, 48, 60, 0.95), rgba(59, 79, 96, 0.92));
      color: #fff8f1;
    }

    .date-main {
      font-size: clamp(34px, 4vw, 52px);
      font-weight: 800;
      line-height: 1;
    }

    .date-side {
      text-align: right;
      color: rgba(255, 248, 241, 0.74);
      font-size: 14px;
      line-height: 1.8;
    }

    .stats {
      margin-top: 22px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .stat {
      padding: 18px;
      border-radius: 22px;
      background: var(--panel);
      border: 1px solid rgba(34, 48, 60, 0.08);
    }

    .stat small {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--subtle);
      letter-spacing: 0.08em;
    }

    .stat strong {
      font-size: 28px;
      font-weight: 800;
    }

    .subjects {
      margin-top: 22px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .subject-chip {
      padding: 12px 14px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.1);
    }

    .subject-chip.math { background: linear-gradient(135deg, #6b7cff, #8391ff); }
    .subject-chip.chinese { background: linear-gradient(135deg, #ff6f91, #ff8b73); }
    .subject-chip.english { background: linear-gradient(135deg, #28b39a, #4cc6b1); }
    .subject-chip.science { background: linear-gradient(135deg, #8e63d7, #a77dee); }

    .workspace {
      padding: 26px;
      display: grid;
      gap: 18px;
    }

    .toolbar,
    .composer,
    .todo-list {
      position: relative;
      z-index: 1;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }

    .toolbar h2 {
      margin: 0;
      font-size: 28px;
      font-family: "STSong", "Songti SC", serif;
      font-weight: 700;
    }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-btn {
      border: none;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(34, 48, 60, 0.06);
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .filter-btn:hover,
    .filter-btn.active {
      transform: translateY(-1px);
      background: rgba(255, 138, 91, 0.18);
      color: var(--accent-deep);
    }

    .composer {
      padding: 18px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255,255,255,0.82), rgba(255,255,255,0.6));
      border: 1px solid var(--line);
      display: grid;
      gap: 14px;
    }

    .composer-grid {
      display: grid;
      grid-template-columns: 1.4fr 0.9fr 0.8fr 0.8fr auto;
      gap: 12px;
    }

    input,
    select {
      width: 100%;
      padding: 14px 14px;
      border-radius: 16px;
      border: 1px solid rgba(34, 48, 60, 0.12);
      background: rgba(255, 255, 255, 0.85);
      color: var(--ink);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus,
    select:focus {
      border-color: rgba(255, 138, 91, 0.8);
      box-shadow: 0 0 0 4px rgba(255, 138, 91, 0.12);
    }

    .add-btn {
      border: none;
      padding: 0 20px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: white;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 14px 26px rgba(225, 97, 50, 0.26);
    }

    .tips {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--subtle);
    }

    .todo-list {
      display: grid;
      gap: 14px;
    }

    .todo-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 16px;
      align-items: start;
      padding: 18px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(34, 48, 60, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .todo-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(34, 48, 60, 0.08);
    }

    .todo-item.done {
      opacity: 0.72;
      background: rgba(234, 238, 241, 0.8);
    }

    .toggle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid rgba(34, 48, 60, 0.16);
      background: transparent;
      margin-top: 5px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
    }

    .todo-item.done .toggle {
      background: linear-gradient(135deg, #79bf8f, #59a874);
      border-color: transparent;
    }

    .todo-item.done .toggle::after {
      content: "";
      position: absolute;
      left: 6px;
      top: 2px;
      width: 7px;
      height: 12px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .todo-content h3 {
      margin: 0;
      font-size: 18px;
      line-height: 1.5;
    }

    .todo-item.done .todo-content h3 {
      text-decoration: line-through;
      color: var(--done);
    }

    .todo-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(34, 48, 60, 0.06);
      color: var(--subtle);
    }

    .tag.subject-math { color: var(--math); background: rgba(107, 124, 255, 0.12); }
    .tag.subject-chinese { color: var(--chinese); background: rgba(255, 111, 145, 0.12); }
    .tag.subject-english { color: var(--english); background: rgba(40, 179, 154, 0.12); }
    .tag.subject-science { color: var(--science); background: rgba(142, 99, 215, 0.12); }
    .tag.subject-other { color: #8a6a4c; background: rgba(138, 106, 76, 0.12); }

    .priority-high { color: #e16132; background: rgba(225, 97, 50, 0.13); }
    .priority-medium { color: #b4821f; background: rgba(180, 130, 31, 0.12); }
    .priority-low { color: #547487; background: rgba(84, 116, 135, 0.12); }

    .todo-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .delete-btn {
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: rgba(34, 48, 60, 0.06);
      color: var(--ink);
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .delete-btn:hover {
      background: rgba(225, 97, 50, 0.14);
      color: var(--accent-deep);
    }

    .empty {
      padding: 30px 20px;
      border-radius: 24px;
      text-align: center;
      border: 1px dashed rgba(34, 48, 60, 0.16);
      color: var(--subtle);
      background: rgba(255, 255, 255, 0.48);
    }

    @media (max-width: 980px) {
      .page {
        grid-template-columns: 1fr;
      }

      .composer-grid {
        grid-template-columns: 1fr 1fr;
      }

      .add-btn {
        min-height: 52px;
      }
    }

    @media (max-width: 640px) {
      .page {
        width: min(100% - 18px, 100%);
        margin: 12px auto 20px;
      }

      .hero,
      .workspace {
        padding: 18px;
      }

      .composer-grid,
      .stats {
        grid-template-columns: 1fr;
      }

      .todo-item {
        grid-template-columns: auto 1fr;
      }

      .todo-actions {
        grid-column: 2;
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="panel hero">
      <span class="eyebrow">SCHOOL MODE / KEEP GOING</span>
      <h1 class="title">今天也把目标<br />一项项写清楚</h1>
      <p>
        面向高中生日常安排的待办单页。把作业、背诵、错题整理和考试复习拆成可执行的小任务，
        用更轻松的方式追踪每天的学习节奏。
      </p>

      <div class="date-card">
        <div>
          <div class="date-main" id="todayDate">06 / 30</div>
          <div>本周计划，稳步推进</div>
        </div>
        <div class="date-side" id="todayText">
          星期一<br />
          高效完成，不慌不忙
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <small>全部任务</small>
          <strong id="totalCount">0</strong>
        </div>
        <div class="stat">
          <small>已完成</small>
          <strong id="doneCount">0</strong>
        </div>
        <div class="stat">
          <small>紧急任务</small>
          <strong id="urgentCount">0</strong>
        </div>
      </div>

      <div class="subjects">
        <span class="subject-chip math">数学 / 刷题</span>
        <span class="subject-chip chinese">语文 / 背诵</span>
        <span class="subject-chip english">英语 / 单词</span>
        <span class="subject-chip science">理综 / 总结</span>
      </div>
    </section>

    <section class="panel workspace">
      <div class="toolbar">
        <h2>学习任务清单</h2>
        <div class="filters">
          <button class="filter-btn active" data-filter="all">全部</button>
          <button class="filter-btn" data-filter="today">今天截止</button>
          <button class="filter-btn" data-filter="urgent">高优先级</button>
          <button class="filter-btn" data-filter="open">未完成</button>
        </div>
      </div>

      <form class="composer" id="todoForm">
        <div class="composer-grid">
          <input id="taskInput" type="text" placeholder="例如：整理数学错题第 3 章" required />
          <select id="subjectInput" aria-label="学科">
            <option value="math">数学</option>
            <option value="chinese">语文</option>
            <option value="english">英语</option>
            <option value="science">理综</option>
            <option value="other">其他</option>
          </select>
          <select id="priorityInput" aria-label="优先级">
            <option value="high">高优先级</option>
            <option value="medium" selected>中优先级</option>
            <option value="low">低优先级</option>
          </select>
          <input id="deadlineInput" type="date" aria-label="截止日期" />
          <button class="add-btn" type="submit">添加任务</button>
        </div>
        <div class="tips">
          <span>建议把大任务拆成 20 到 40 分钟能完成的小目标。</span>
          <span>页面会自动保存到本地，下次打开仍然保留。</span>
        </div>
      </form>

      <section class="todo-list" id="todoList"></section>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "student_todo_single_page_v1";
    const todoList = document.getElementById("todoList");
    const todoForm = document.getElementById("todoForm");
    const taskInput = document.getElementById("taskInput");
    const subjectInput = document.getElementById("subjectInput");
    const priorityInput = document.getElementById("priorityInput");
    const deadlineInput = document.getElementById("deadlineInput");
    const totalCount = document.getElementById("totalCount");
    const doneCount = document.getElementById("doneCount");
    const urgentCount = document.getElementById("urgentCount");
    const todayDate = document.getElementById("todayDate");
    const todayText = document.getElementById("todayText");
    const filterButtons = document.querySelectorAll(".filter-btn");

    const subjectMap = {
      math: "数学",
      chinese: "语文",
      english: "英语",
      science: "理综",
      other: "其他"
    };

    const priorityMap = {
      high: "高优先级",
      medium: "中优先级",
      low: "低优先级"
    };

    let currentFilter = "all";
    let todos = loadTodos();

    function loadTodos() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          return JSON.parse(saved);
        } catch (error) {
          console.error("读取本地任务失败:", error);
        }
      }

      const today = formatDateValue(new Date());
      const tomorrow = formatDateValue(new Date(Date.now() + 24 * 60 * 60 * 1000));
      return [
        {
          id: crypto.randomUUID(),
          text: "完成数学模拟卷选择题订正",
          subject: "math",
          priority: "high",
          deadline: today,
          done: false
        },
        {
          id: crypto.randomUUID(),
          text: "背诵《劝学》重点段落并默写",
          subject: "chinese",
          priority: "medium",
          deadline: tomorrow,
          done: false
        },
        {
          id: crypto.randomUUID(),
          text: "复习英语高频短语并听写 30 个",
          subject: "english",
          priority: "low",
          deadline: "",
          done: true
        }
      ];
    }

    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function formatDateValue(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return year + "-" + month + "-" + day;
    }

    function formatHumanDate(value) {
      if (!value) return "未设置截止";
      const date = new Date(value + "T00:00:00");
      return date.toLocaleDateString("zh-CN", {
        month: "numeric",
        day: "numeric",
        weekday: "short"
      });
    }

    function renderHeaderDate() {
      const now = new Date();
      todayDate.textContent =
        String(now.getMonth() + 1).padStart(2, "0") + " / " + String(now.getDate()).padStart(2, "0");
      todayText.innerHTML = now.toLocaleDateString("zh-CN", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      }) + "<br />专注一点，进步就会更明显";
      deadlineInput.value = formatDateValue(now);
    }

    function applyFilter(items) {
      const today = formatDateValue(new Date());
      if (currentFilter === "today") {
        return items.filter((item) => item.deadline === today);
      }
      if (currentFilter === "urgent") {
        return items.filter((item) => item.priority === "high");
      }
      if (currentFilter === "open") {
        return items.filter((item) => !item.done);
      }
      return items;
    }

    function renderStats() {
      totalCount.textContent = String(todos.length);
      doneCount.textContent = String(todos.filter((item) => item.done).length);
      urgentCount.textContent = String(todos.filter((item) => item.priority === "high" && !item.done).length);
    }

    function renderTodos() {
      renderStats();
      const filtered = applyFilter(todos);

      if (!filtered.length) {
        todoList.innerHTML = '<div class="empty">当前筛选条件下没有任务，去添加一个新的小目标吧。</div>';
        return;
      }

      todoList.innerHTML = filtered
        .map((item) => {
          return `
            <article class="todo-item ${item.done ? "done" : ""}">
              <button class="toggle" data-action="toggle" data-id="${item.id}" aria-label="切换完成状态"></button>
              <div class="todo-content">
                <h3>${escapeHtml(item.text)}</h3>
                <div class="todo-meta">
                  <span class="tag subject-${item.subject}">${subjectMap[item.subject] || "其他"}</span>
                  <span class="tag priority-${item.priority}">${priorityMap[item.priority]}</span>
                  <span class="tag">${formatHumanDate(item.deadline)}</span>
                </div>
              </div>
              <div class="todo-actions">
                <button class="delete-btn" data-action="delete" data-id="${item.id}" aria-label="删除任务">×</button>
              </div>
            </article>
          `;
        })
        .join("");
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    todoForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = taskInput.value.trim();
      if (!text) return;

      todos.unshift({
        id: crypto.randomUUID(),
        text,
        subject: subjectInput.value,
        priority: priorityInput.value,
        deadline: deadlineInput.value,
        done: false
      });

      saveTodos();
      renderTodos();
      taskInput.value = "";
      priorityInput.value = "medium";
      taskInput.focus();
    });

    todoList.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      const id = button.dataset.id;
      const action = button.dataset.action;
      const target = todos.find((item) => item.id === id);
      if (!target) return;

      if (action === "toggle") {
        target.done = !target.done;
      }

      if (action === "delete") {
        todos = todos.filter((item) => item.id !== id);
      }

      saveTodos();
      renderTodos();
    });

    filterButtons.forEach((button) => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;
        filterButtons.forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        renderTodos();
      });
    });

    renderHeaderDate();
    saveTodos();
    renderTodos();
  </script>
</body>
</html>
