<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮生海 - 容纳一生的地方</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="bubble-bg">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="glow-orbs">
        <div class="glow-orb"></div>
        <div class="glow-orb"></div>
        <div class="glow-orb"></div>
    </div>

    <div class="grid-pattern"></div>

    <div class="floating-poetry">浮</div>
    <div class="floating-poetry">生</div>
    <div class="floating-poetry">若</div>
    <div class="floating-poetry">梦</div>

    <div class="particle-bg" id="particle-bg"></div>

    <div class="scroll-indicator">
        <div class="scroll-dot active"></div>
        <div class="scroll-dot"></div>
        <div class="scroll-dot"></div>
        <div class="scroll-dot"></div>
        <div class="scroll-dot"></div>
        <div class="scroll-dot"></div>
    </div>

    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="#hero" class="nav-logo">
                <div class="nav-logo-orb">浮</div>
                <span class="nav-logo-text">浮生海</span>
            </a>
            <ul class="nav-links" id="nav-links">
                <li><a href="#hero">首页</a></li>
                <li><a href="#intro">创意介绍</a></li>
                <li><a href="#users">目标用户</a></li>
                <li><a href="#features">核心功能</a></li>
                <li><a href="#philosophy">品牌理念</a></li>
                <li><a href="#value">价值意义</a></li>
            </ul>
            <div class="nav-toggle" id="nav-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <div class="container" id="main-container">
        <div id="module-header"></div>
        <div id="module-intro"></div>
        <div id="module-users"></div>
        <div id="module-features"></div>
        <div id="module-showcase"></div>
        <div id="module-philosophy"></div>
        <div id="module-value"></div>
        <div id="module-roadmap"></div>
        <div id="module-cta"></div>
        <div id="module-footer"></div>
    </div>

    <script>
        const modules = [
            { id: 'module-header', path: 'modules/01-header.html' },
            { id: 'module-intro', path: 'modules/02-intro.html' },
            { id: 'module-users', path: 'modules/03-users.html' },
            { id: 'module-features', path: 'modules/04-features.html' },
            { id: 'module-showcase', path: 'modules/05-showcase.html' },
            { id: 'module-philosophy', path: 'modules/06-philosophy.html' },
            { id: 'module-value', path: 'modules/07-value.html' },
            { id: 'module-roadmap', path: 'modules/08-roadmap.html' },
            { id: 'module-cta', path: 'modules/09-cta.html' },
            { id: 'module-footer', path: 'modules/10-footer.html' }
        ];

        async function loadModules() {
            const promises = modules.map(async (module) => {
                try {
                    const response = await fetch(module.path);
                    const html = await response.text();
                    const container = document.getElementById(module.id);
                    if (container) {
                        container.innerHTML = html;
                    }
                } catch (error) {
                    console.error('Failed to load module:', module.path, error);
                }
            });

            await Promise.all(promises);

            const mainScript = document.createElement('script');
            mainScript.src = 'js/main.js';
            mainScript.onload = function() {
                if (typeof init === 'function') {
                    init();
                }
            };
            document.body.appendChild(mainScript);
        }

        loadModules();
    </script>
</body>
</html>
