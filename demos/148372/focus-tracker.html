<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>静心追踪器 - 专注度记录工具</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
  <style>
    :root {
      --primary: #6366f1;
      --primary-light: #818cf8;
      --primary-dark: #4f46e5;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --border: #334155;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg-dark) 0%, #1e1b4b 100%);
      min-height: 100vh;
      color: var(--text-primary);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px 0;
    }

    header h1 {
      font-size: 2rem;
      background: linear-gradient(90deg, var(--primary-light), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.9rem;
    }

    .tab.active {
      background: var(--primary);
      color: white;
    }

    .tab:hover:not(.active) {
      background: var(--bg-input);
    }

    .card {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 20px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--primary);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .duration-input {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .duration-input input {
      flex: 1;
    }

    .duration-input span {
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    .tags-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--bg-input);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.85rem;
    }

    .tag.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .tag:hover {
      border-color: var(--primary-light);
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    .btn-secondary {
      background: var(--bg-input);
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      background: #475569;
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(167, 139, 250, 0.1) 100%);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      border: 1px solid rgba(99, 102, 241, 0.2);
    }

    .stat-card .value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary-light);
      margin-bottom: 5px;
    }

    .stat-card .label {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .calendar-cell {
      aspect-ratio: 1;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      cursor: pointer;
      transition: transform 0.2s ease;
      position: relative;
    }

    .calendar-cell:hover {
      transform: scale(1.1);
    }

    .calendar-cell.empty {
      background: transparent;
      cursor: default;
    }

    .calendar-cell.today {
      border: 2px solid var(--primary);
    }

    .calendar-cell.level-0 { background: #1e293b; }
    .calendar-cell.level-1 { background: #1e4d3d; }
    .calendar-cell.level-2 { background: #166534; }
    .calendar-cell.level-3 { background: #15803d; }
    .calendar-cell.level-4 { background: #16a34a; }
    .calendar-cell.level-5 { background: #22c55e; }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .calendar-header h3 {
      font-size: 1rem;
      color: var(--text-primary);
    }

    .calendar-header button {
      background: var(--bg-input);
      border: none;
      color: var(--text-primary);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .calendar-header button:hover {
      background: #475569;
    }

    .weekday-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 6px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .chart-container {
      position: relative;
      height: 300px;
      margin-top: 20px;
    }

    .record-list {
      max-height: 400px;
      overflow-y: auto;
    }

    .record-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      background: var(--bg-input);
      border-radius: 8px;
      margin-bottom: 10px;
      transition: background 0.3s ease;
    }

    .record-item:hover {
      background: #475569;
    }

    .record-item .left {
      flex: 1;
    }

    .record-item .date {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 5px;
    }

    .record-item .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .record-item .tag-small {
      padding: 2px 8px;
      background: rgba(99, 102, 241, 0.2);
      border-radius: 10px;
      font-size: 0.75rem;
      color: var(--primary-light);
    }

    .record-item .right {
      text-align: right;
      margin-left: 20px;
    }

    .record-item .duration {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--success);
    }

    .record-item .distractions {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .record-item .actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .record-item .actions button {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
    }

    .record-item .actions button:hover {
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      border: 1px solid var(--border);
    }

    .modal-content h3 {
      margin-bottom: 16px;
      color: var(--text-primary);
    }

    .modal-content p {
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    .modal-content .btn-group {
      justify-content: flex-end;
    }

    @media (max-width: 640px) {
      .container {
        padding: 15px;
      }

      header h1 {
        font-size: 1.5rem;
      }

      .card {
        padding: 16px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .record-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .record-item .right {
        margin-left: 0;
        margin-top: 10px;
        align-self: flex-end;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🧘 静心追踪器</h1>
      <p>记录每一天的专注时光，发现分心规律，提升自律能力</p>
    </header>

    <div class="tabs">
      <button class="tab active" onclick="showTab('entry')">📝 今日录入</button>
      <button class="tab" onclick="showTab('calendar')">📅 日历视图</button>
      <button class="tab" onclick="showTab('stats')">📊 数据统计</button>
      <button class="tab" onclick="showTab('history')">📜 历史记录</button>
    </div>

    <div id="tab-entry" class="tab-content">
      <div class="card">
        <h2>📝 今日专注记录</h2>
        <form id="entry-form" class="form-grid">
          <div class="form-group">
            <label>日期</label>
            <input type="date" id="entry-date" required>
          </div>
          <div class="form-group">
            <label>专注时长</label>
            <div class="duration-input">
              <input type="number" id="entry-duration" min="1" max="1440" placeholder="分钟" required>
              <span>分钟</span>
            </div>
          </div>
          <div class="form-group">
            <label>分心次数</label>
            <input type="number" id="entry-distractions" min="0" max="100" placeholder="次" required>
          </div>
          <div class="form-group">
            <label>分心原因（可多选）</label>
            <div class="tags-group" id="distraction-tags">
              <span class="tag" data-value="手机">📱 手机</span>
              <span class="tag" data-value="社交媒体">💬 社交媒体</span>
              <span class="tag" data-value="噪音">🔊 噪音</span>
              <span class="tag" data-value="疲劳">😴 疲劳</span>
              <span class="tag" data-value="环境干扰">🏠 环境干扰</span>
              <span class="tag" data-value="任务切换">🔄 任务切换</span>
              <span class="tag" data-value="拖延">🐢 拖延</span>
              <span class="tag" data-value="其他">📌 其他</span>
            </div>
          </div>
          <div class="form-group">
            <label>备注</label>
            <textarea id="entry-note" placeholder="记录今日心得或改进计划..."></textarea>
          </div>
        </form>
        <div class="btn-group">
          <button class="btn btn-primary" onclick="saveRecord()">保存记录</button>
          <button class="btn btn-secondary" onclick="resetForm()">重置表单</button>
        </div>
      </div>
    </div>

    <div id="tab-calendar" class="tab-content" style="display: none;">
      <div class="card">
        <div class="calendar-header">
          <button onclick="prevMonth()">◀</button>
          <h3 id="calendar-title"></h3>
          <button onclick="nextMonth()">▶</button>
        </div>
        <div class="weekday-row">
          <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
        <div style="margin-top: 15px; display: flex; align-items: center; gap: 10px; justify-content: center;">
          <span style="font-size: 0.8rem; color: var(--text-secondary);">少</span>
          <div class="calendar-cell level-0"></div>
          <div class="calendar-cell level-1"></div>
          <div class="calendar-cell level-2"></div>
          <div class="calendar-cell level-3"></div>
          <div class="calendar-cell level-4"></div>
          <div class="calendar-cell level-5"></div>
          <span style="font-size: 0.8rem; color: var(--text-secondary);">多</span>
        </div>
      </div>
    </div>

    <div id="tab-stats" class="tab-content" style="display: none;">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="value" id="stat-total-duration">0</div>
          <div class="label">累计专注时长（小时）</div>
        </div>
        <div class="stat-card">
          <div class="value" id="stat-avg-duration">0</div>
          <div class="label">日均专注时长（分钟）</div>
        </div>
        <div class="stat-card">
          <div class="value" id="stat-total-days">0</div>
          <div class="label">记录天数</div>
        </div>
        <div class="stat-card">
          <div class="value" id="stat-max-duration">0</div>
          <div class="label">单日最高（分钟）</div>
        </div>
      </div>

      <div class="card">
        <h2>📈 近7天专注趋势</h2>
        <div class="chart-container">
          <canvas id="trend-chart"></canvas>
        </div>
      </div>

      <div class="card">
        <h2>🥧 分心原因分布</h2>
        <div class="chart-container">
          <canvas id="distraction-chart"></canvas>
        </div>
      </div>

      <div class="card">
        <h2>⚙️ 数据管理</h2>
        <div class="btn-group">
          <button class="btn btn-secondary" onclick="exportData()">📥 导出数据</button>
          <button class="btn btn-danger" onclick="confirmClearData()">🗑️ 清除所有数据</button>
        </div>
      </div>
    </div>

    <div id="tab-history" class="tab-content" style="display: none;">
      <div class="card">
        <h2>📜 历史记录</h2>
        <div class="record-list" id="record-list"></div>
      </div>
    </div>
  </div>

  <div class="modal" id="confirm-modal">
    <div class="modal-content">
      <h3>确认操作</h3>
      <p id="modal-message">确定要执行此操作吗？</p>
      <div class="btn-group">
        <button class="btn btn-secondary" onclick="closeModal()">取消</button>
        <button class="btn btn-danger" onclick="clearAllData()">确定</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'focus_tracker_records';
    
    const distractionReasons = ['手机', '社交媒体', '噪音', '疲劳', '环境干扰', '任务切换', '拖延', '其他'];
    
    let records = [];
    let calendarMonth = dayjs();
    let trendChart = null;
    let distractionChart = null;

    function init() {
      loadRecords();
      document.getElementById('entry-date').value = dayjs().format('YYYY-MM-DD');
      initTags();
      renderCalendar();
      renderStats();
      renderHistory();
    }

    function loadRecords() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        records = JSON.parse(stored);
      }
    }

    function saveRecords() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function initTags() {
      const tagsContainer = document.getElementById('distraction-tags');
      tagsContainer.addEventListener('click', (e) => {
        if (e.target.classList.contains('tag')) {
          e.target.classList.toggle('active');
        }
      });
    }

    function getSelectedTags() {
      const tags = document.querySelectorAll('#distraction-tags .tag.active');
      return Array.from(tags).map(tag => tag.dataset.value);
    }

    function saveRecord() {
      const date = document.getElementById('entry-date').value;
      const duration = parseInt(document.getElementById('entry-duration').value);
      const distractions = parseInt(document.getElementById('entry-distractions').value);
      const reasons = getSelectedTags();
      const note = document.getElementById('entry-note').value;

      if (!date || isNaN(duration) || isNaN(distractions)) {
        alert('请填写完整信息');
        return;
      }

      const existingIndex = records.findIndex(r => r.date === date);
      const record = {
        date,
        duration,
        distractions,
        reasons,
        note,
        updatedAt: new Date().toISOString()
      };

      if (existingIndex >= 0) {
        records[existingIndex] = record;
      } else {
        records.push(record);
        records.sort((a, b) => new Date(b.date) - new Date(a.date));
      }

      saveRecords();
      resetForm();
      renderCalendar();
      renderStats();
      renderHistory();
      
      alert('记录保存成功！');
    }

    function resetForm() {
      document.getElementById('entry-date').value = dayjs().format('YYYY-MM-DD');
      document.getElementById('entry-duration').value = '';
      document.getElementById('entry-distractions').value = '';
      document.getElementById('entry-note').value = '';
      document.querySelectorAll('#distraction-tags .tag').forEach(tag => tag.classList.remove('active'));
    }

    function showTab(tabId) {
      document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
      document.querySelector(`.tab[onclick="showTab('${tabId}')"]`).classList.add('active');
      
      document.querySelectorAll('.tab-content').forEach(content => content.style.display = 'none');
      document.getElementById(`tab-${tabId}`).style.display = 'block';

      if (tabId === 'stats') {
        renderStats();
      } else if (tabId === 'calendar') {
        renderCalendar();
      } else if (tabId === 'history') {
        renderHistory();
      }
    }

    function renderCalendar() {
      const year = calendarMonth.year();
      const month = calendarMonth.month();
      
      document.getElementById('calendar-title').textContent = `${year}年${month + 1}月`;

      const firstDay = dayjs(new Date(year, month, 1));
      const lastDay = dayjs(new Date(year, month + 1, 0));
      const daysInMonth = lastDay.date();
      const startDay = firstDay.day();

      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      for (let i = 0; i < startDay; i++) {
        const cell = document.createElement('div');
        cell.className = 'calendar-cell empty';
        grid.appendChild(cell);
      }

      const today = dayjs().format('YYYY-MM-DD');

      for (let i = 1; i <= daysInMonth; i++) {
        const dateStr = dayjs(new Date(year, month, i)).format('YYYY-MM-DD');
        const record = records.find(r => r.date === dateStr);
        const duration = record ? record.duration : 0;
        
        const cell = document.createElement('div');
        cell.className = `calendar-cell ${getLevelClass(duration)}`;
        if (dateStr === today) {
          cell.classList.add('today');
        }
        cell.textContent = i;
        
        cell.addEventListener('click', () => {
          if (record) {
            alert(`日期: ${dateStr}\n专注时长: ${record.duration}分钟\n分心次数: ${record.distractions}次\n分心原因: ${record.reasons.join(', ')}\n备注: ${record.note || '无'}`);
          }
        });
        
        grid.appendChild(cell);
      }
    }

    function getLevelClass(duration) {
      if (duration === 0) return 'level-0';
      if (duration < 30) return 'level-1';
      if (duration < 60) return 'level-2';
      if (duration < 120) return 'level-3';
      if (duration < 180) return 'level-4';
      return 'level-5';
    }

    function prevMonth() {
      calendarMonth = calendarMonth.subtract(1, 'month');
      renderCalendar();
    }

    function nextMonth() {
      calendarMonth = calendarMonth.add(1, 'month');
      renderCalendar();
    }

    function renderStats() {
      if (records.length === 0) {
        document.getElementById('stat-total-duration').textContent = '0';
        document.getElementById('stat-avg-duration').textContent = '0';
        document.getElementById('stat-total-days').textContent = '0';
        document.getElementById('stat-max-duration').textContent = '0';
        return;
      }

      const totalDuration = records.reduce((sum, r) => sum + r.duration, 0);
      const avgDuration = Math.round(totalDuration / records.length);
      const maxDuration = Math.max(...records.map(r => r.duration));

      document.getElementById('stat-total-duration').textContent = (totalDuration / 60).toFixed(1);
      document.getElementById('stat-avg-duration').textContent = avgDuration;
      document.getElementById('stat-total-days').textContent = records.length;
      document.getElementById('stat-max-duration').textContent = maxDuration;

      renderTrendChart();
      renderDistractionChart();
    }

    function renderTrendChart() {
      const ctx = document.getElementById('trend-chart').getContext('2d');
      
      const last7Days = [];
      for (let i = 6; i >= 0; i--) {
        last7Days.push(dayjs().subtract(i, 'day').format('YYYY-MM-DD'));
      }

      const data = last7Days.map(date => {
        const record = records.find(r => r.date === date);
        return record ? record.duration : 0;
      });

      if (trendChart) {
        trendChart.destroy();
      }

      trendChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: last7Days.map(d => dayjs(d).format('MM-DD')),
          datasets: [{
            label: '专注时长（分钟）',
            data: data,
            backgroundColor: 'rgba(99, 102, 241, 0.6)',
            borderColor: 'rgba(99, 102, 241, 1)',
            borderWidth: 1,
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              beginAtZero: true,
              grid: { color: 'rgba(51, 65, 85, 0.5)' },
              ticks: { color: '#94a3b8' }
            },
            x: {
              grid: { display: false },
              ticks: { color: '#94a3b8' }
            }
          },
          plugins: {
            legend: {
              labels: { color: '#94a3b8' }
            }
          }
        }
      });
    }

    function renderDistractionChart() {
      const ctx = document.getElementById('distraction-chart').getContext('2d');
      
      const reasonCounts = {};
      records.forEach(record => {
        record.reasons.forEach(reason => {
          reasonCounts[reason] = (reasonCounts[reason] || 0) + 1;
        });
      });

      const labels = Object.keys(reasonCounts);
      const data = Object.values(reasonCounts);

      if (distractionChart) {
        distractionChart.destroy();
      }

      distractionChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            backgroundColor: [
              'rgba(99, 102, 241, 0.8)',
              'rgba(167, 139, 250, 0.8)',
              'rgba(59, 130, 246, 0.8)',
              'rgba(14, 165, 233, 0.8)',
              'rgba(20, 184, 166, 0.8)',
              'rgba(34, 197, 94, 0.8)',
              'rgba(234, 179, 8, 0.8)',
              'rgba(249, 115, 22, 0.8)'
            ],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              labels: { 
                color: '#94a3b8',
                padding: 20
              }
            }
          }
        }
      });
    }

    function renderHistory() {
      const list = document.getElementById('record-list');
      
      if (records.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <p>暂无记录，快去录入今天的专注数据吧！</p>
          </div>
        `;
        return;
      }

      list.innerHTML = records.map((record, index) => `
        <div class="record-item">
          <div class="left">
            <div class="date">${record.date} ${record.note ? '· ' + record.note : ''}</div>
            <div class="tags">
              ${record.reasons.map(r => `<span class="tag-small">${r}</span>`).join('')}
            </div>
          </div>
          <div class="right">
            <div class="duration">${record.duration}分钟</div>
            <div class="distractions">分心 ${record.distractions} 次</div>
            <div class="actions">
              <button onclick="deleteRecord(${index})">删除</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function deleteRecord(index) {
      if (confirm('确定要删除这条记录吗？')) {
        records.splice(index, 1);
        saveRecords();
        renderCalendar();
        renderStats();
        renderHistory();
      }
    }

    function exportData() {
      const dataStr = JSON.stringify(records, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `focus-tracker-backup-${dayjs().format('YYYY-MM-DD')}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function confirmClearData() {
      document.getElementById('modal-message').textContent = '确定要清除所有数据吗？此操作不可恢复！';
      document.getElementById('confirm-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('confirm-modal').classList.remove('active');
    }

    function clearAllData() {
      records = [];
      saveRecords();
      closeModal();
      renderCalendar();
      renderStats();
      renderHistory();
      alert('所有数据已清除');
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
