<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>北京681路公交车乘法口诀游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: SimSun, '宋体', serif;
            background: linear-gradient(135deg, #87CEEB 0%, #E0F7FA 50%, #81D4FA 100%);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .bg-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .cloud {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: floatCloud 20s infinite ease-in-out;
        }

        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50%;
        }

        .cloud-1 {
            width: 100px;
            height: 40px;
            top: 10%;
            left: -100px;
            animation-duration: 25s;
        }
        .cloud-1::before { width: 50px; height: 50px; top: -25px; left: 15px; }
        .cloud-1::after { width: 60px; height: 60px; top: -30px; left: 45px; }

        .cloud-2 {
            width: 80px;
            height: 30px;
            top: 25%;
            left: -80px;
            animation-duration: 30s;
            animation-delay: 5s;
        }
        .cloud-2::before { width: 40px; height: 40px; top: -20px; left: 10px; }
        .cloud-2::after { width: 45px; height: 45px; top: -22px; left: 35px; }

        .cloud-3 {
            width: 120px;
            height: 45px;
            top: 15%;
            left: -120px;
            animation-duration: 22s;
            animation-delay: 10s;
        }
        .cloud-3::before { width: 60px; height: 60px; top: -30px; left: 20px; }
        .cloud-3::after { width: 70px; height: 70px; top: -35px; left: 55px; }

        .sun {
            position: absolute;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #FFEB3B 0%, #FFC107 100%);
            border-radius: 50%;
            top: 5%;
            right: 10%;
            box-shadow: 0 0 60px #FFC107, 0 0 100px #FFEB3B;
            animation: pulseSun 4s infinite ease-in-out;
        }

        .bus-container {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 200px;
            z-index: 1;
        }

        .bus {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 150px;
            background: linear-gradient(180deg, #FF6B6B 0%, #EE5A5A 100%);
            border-radius: 20px 20px 5px 5px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: bounceBus 2s infinite ease-in-out;
        }

        .bus::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 20px;
            width: 280px;
            height: 30px;
            background: #FF6B6B;
            border-radius: 15px 15px 0 0;
        }

        .bus-window {
            position: absolute;
            top: -5px;
            left: 35px;
            width: 60px;
            height: 40px;
            background: #87CEEB;
            border-radius: 8px 8px 0 0;
            border: 3px solid #333;
        }

        .bus-window:nth-child(2) { left: 115px; }
        .bus-window:nth-child(3) { left: 195px; }
        .bus-window:nth-child(4) { left: 275px; }

        .bus-door {
            position: absolute;
            bottom: 0;
            right: 30px;
            width: 50px;
            height: 80px;
            background: #CC4444;
            border: 3px solid #333;
            border-radius: 0 0 5px 5px;
        }

        .bus-door-handle {
            position: absolute;
            top: 50%;
            left: 10px;
            width: 8px;
            height: 8px;
            background: #FFD700;
            border-radius: 50%;
        }

        .bus-headlight {
            position: absolute;
            bottom: 5px;
            width: 15px;
            height: 15px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 10px #FFD700;
        }

        .bus-headlight.left { left: 10px; }
        .bus-headlight.right { right: 80px; }

        .bus-wheel {
            position: absolute;
            bottom: -15px;
            width: 50px;
            height: 50px;
            background: #333;
            border-radius: 50%;
            border: 5px solid #555;
        }

        .bus-wheel::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: #444;
            border-radius: 50%;
        }

        .bus-wheel.left { left: 40px; }
        .bus-wheel.right { right: 60px; }

        .bus-number {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #FF6B6B;
            border: 3px solid #FF6B6B;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 50px;
            background: linear-gradient(180deg, #444 0%, #333 100%);
        }

        .road-line {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 6px;
            background: white;
            animation: roadLine 2s infinite linear;
        }

        .road-line:nth-child(2) { left: 10%; animation-delay: 0s; }
        .road-line:nth-child(3) { left: 25%; animation-delay: 0.5s; }
        .road-line:nth-child(4) { left: 40%; animation-delay: 1s; }
        .road-line:nth-child(5) { left: 55%; animation-delay: 1.5s; }
        .road-line:nth-child(6) { left: 70%; animation-delay: 0s; }
        .road-line:nth-child(7) { left: 85%; animation-delay: 0.5s; }

        .game-container {
            position: relative;
            z-index: 10;
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            padding-top: 80px;
            padding-bottom: 280px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .level-badge {
            display: inline-block;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            padding: 10px 30px;
            border-radius: 30px;
            font-size: 24px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
            margin-bottom: 15px;
        }

        .score-display {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
        }

        .score-item {
            background: white;
            padding: 10px 25px;
            border-radius: 20px;
            font-size: 18px;
            color: #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .question-card {
            background: white;
            border-radius: 25px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            margin-bottom: 30px;
            transition: transform 0.3s ease;
        }

        .question-card:hover {
            transform: translateY(-5px);
        }

        .question-text {
            font-size: 42px;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .question-highlight {
            color: #FF6B6B;
            font-size: 50px;
            font-weight: bold;
        }

        .play-button {
            display: inline-block;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .play-button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(76, 175, 80, 0.5);
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .option-btn {
            background: white;
            border: none;
            padding: 25px;
            border-radius: 20px;
            font-size: 32px;
            font-family: SimSun, '宋体', serif;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .option-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #FF6B6B, #FFD700, #4CAF50, #2196F3);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .option-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .option-btn:hover::before {
            transform: scaleX(1);
        }

        .option-btn.correct {
            background: linear-gradient(135deg, #81C784 0%, #4CAF50 100%);
            color: white;
            animation: correctPulse 0.5s ease;
        }

        .option-btn.wrong {
            background: linear-gradient(135deg, #EF9A9A 0%, #F44336 100%);
            color: white;
            animation: shake 0.5s ease;
        }

        .feedback-message {
            text-align: center;
            font-size: 28px;
            margin-bottom: 20px;
            min-height: 40px;
            animation: fadeIn 0.3s ease;
        }

        .feedback-correct {
            color: #4CAF50;
            text-shadow: 2px 2px 4px rgba(76, 175, 80, 0.3);
        }

        .feedback-wrong {
            color: #F44336;
            text-shadow: 2px 2px 4px rgba(244, 67, 54, 0.3);
        }

        .progress-bar {
            width: 100%;
            height: 15px;
            background: #E0E0E0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FF6B6B 0%, #FFD700 50%, #4CAF50 100%);
            transition: width 0.5s ease;
            border-radius: 10px;
        }

        .start-screen, .level-complete-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            animation: fadeIn 0.5s ease;
        }

        .start-screen h1, .level-complete-screen h1 {
            font-size: 48px;
            color: #FF6B6B;
            margin-bottom: 20px;
            text-align: center;
            padding: 0 20px;
        }

        .start-screen p, .level-complete-screen p {
            font-size: 24px;
            color: #666;
            margin-bottom: 40px;
            text-align: center;
            padding: 0 30px;
        }

        .start-btn, .next-level-btn {
            background: linear-gradient(135deg, #FF6B6B 0%, #EE5A5A 100%);
            color: white;
            padding: 20px 60px;
            border: none;
            border-radius: 50px;
            font-size: 28px;
            font-family: SimSun, '宋体', serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
        }

        .start-btn:hover, .next-level-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(255, 107, 107, 0.5);
        }

        .hidden {
            display: none !important;
        }

        .stars-container {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .star {
            font-size: 48px;
            color: #E0E0E0;
            transition: color 0.3s ease;
        }

        .star.filled {
            color: #FFD700;
            text-shadow: 0 0 20px #FFD700;
            animation: starPop 0.5s ease;
        }

        @keyframes floatCloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(100vw + 100px)); }
        }

        @keyframes pulseSun {
            0%, 100% { transform: scale(1); box-shadow: 0 0 60px #FFC107, 0 0 100px #FFEB3B; }
            50% { transform: scale(1.05); box-shadow: 0 0 80px #FFC107, 0 0 120px #FFEB3B; }
        }

        @keyframes bounceBus {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-5px); }
        }

        @keyframes roadLine {
            0% { transform: translateY(-50%) translateX(0); opacity: 1; }
            100% { transform: translateY(-50%) translateX(-50px); opacity: 0.5; }
        }

        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes starPop {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @media (max-width: 480px) {
            .bus {
                width: 260px;
                height: 120px;
            }
            
            .bus::before {
                width: 220px;
            }
            
            .bus-window {
                width: 45px;
                height: 30px;
            }
            
            .bus-window:nth-child(2) { left: 90px; }
            .bus-window:nth-child(3) { left: 155px; }
            .bus-window:nth-child(4) { left: 220px; }
            
            .question-text {
                font-size: 32px;
            }
            
            .question-highlight {
                font-size: 40px;
            }
            
            .option-btn {
                padding: 20px;
                font-size: 28px;
            }
            
            .start-screen h1, .level-complete-screen h1 {
                font-size: 36px;
            }
            
            .game-container {
                padding-top: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-elements">
        <div class="sun"></div>
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
        <div class="road">
            <div class="road-line"></div>
            <div class="road-line"></div>
            <div class="road-line"></div>
            <div class="road-line"></div>
            <div class="road-line"></div>
            <div class="road-line"></div>
        </div>
        <div class="bus-container">
            <div class="bus">
                <div class="bus-window"></div>
                <div class="bus-window"></div>
                <div class="bus-window"></div>
                <div class="bus-window"></div>
                <div class="bus-door">
                    <div class="bus-door-handle"></div>
                </div>
                <div class="bus-headlight left"></div>
                <div class="bus-headlight right"></div>
                <div class="bus-wheel left"></div>
                <div class="bus-wheel right"></div>
                <div class="bus-number">681</div>
            </div>
        </div>
    </div>

    <div class="start-screen" id="startScreen">
        <h1>🚌 681路乘法小课堂 🚌</h1>
        <p>跟着681路公交车一起学乘法口诀吧！<br>听题目，选答案，闯关成功有惊喜哦！</p>
        <button class="start-btn" onclick="startGame()">开始游戏</button>
    </div>

    <div class="level-complete-screen hidden" id="levelCompleteScreen">
        <h1>🎉 太棒啦！ 🎉</h1>
        <div class="stars-container" id="starsContainer">
            <span class="star">⭐</span>
            <span class="star">⭐</span>
            <span class="star">⭐</span>
        </div>
        <p id="levelCompleteMsg">棒棒哒，继续下一关吧！</p>
        <button class="next-level-btn" onclick="nextLevel()">下一关</button>
    </div>

    <div class="game-container hidden" id="gameContainer">
        <div class="header">
            <div class="level-badge">第 <span id="currentLevel">1</span> 关</div>
            <div class="score-display">
                <div class="score-item">✓ 正确: <span id="correctCount">0</span></div>
                <div class="score-item">✗ 错误: <span id="wrongCount">0</span></div>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>

        <div class="question-card">
            <div class="question-text" id="questionText">
                <span class="question-highlight" id="questionHighlight"></span>
            </div>
            <div class="play-button" onclick="speakQuestion()">🔊 再听一遍</div>
        </div>

        <div class="feedback-message" id="feedbackMessage"></div>

        <div class="options-grid" id="optionsGrid"></div>
    </div>

    <script>
        const CHINESE_NUMBERS = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
        const LEVELS = [
            { maxNum: 3, questionsPerLevel: 5 },
            { maxNum: 5, questionsPerLevel: 6 },
            { maxNum: 7, questionsPerLevel: 7 },
            { maxNum: 9, questionsPerLevel: 8 },
            { maxNum: 9, questionsPerLevel: 10 }
        ];

        let currentLevel = 0;
        let currentQuestionIndex = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let currentQuestion = null;
        let isAnswering = false;

        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameContainer').classList.remove('hidden');
            currentLevel = 0;
            startLevel();
        }

        function startLevel() {
            currentQuestionIndex = 0;
            correctCount = 0;
            wrongCount = 0;
            updateLevelDisplay();
            generateQuestion();
        }

        function updateLevelDisplay() {
            document.getElementById('currentLevel').textContent = currentLevel + 1;
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = wrongCount;
            updateProgress();
        }

        function updateProgress() {
            const totalQuestions = LEVELS[currentLevel].questionsPerLevel;
            const progress = ((currentQuestionIndex) / totalQuestions) * 100;
            document.getElementById('progressFill').style.width = `${progress}%`;
        }

        function generateQuestion() {
            const levelConfig = LEVELS[currentLevel];
            const num1 = Math.floor(Math.random() * levelConfig.maxNum) + 1;
            const num2 = Math.floor(Math.random() * levelConfig.maxNum) + 1;
            const answer = num1 * num2;

            let options = [answer];
            while (options.length < 4) {
                const fakeAnswer = Math.floor(Math.random() * (levelConfig.maxNum * levelConfig.maxNum)) + 1;
                if (!options.includes(fakeAnswer)) {
                    options.push(fakeAnswer);
                }
            }

            options.sort(() => Math.random() - 0.5);

            currentQuestion = { num1, num2, answer, options };
            displayQuestion();
            setTimeout(() => speakQuestion(), 500);
        }

        function displayQuestion() {
            isAnswering = false;
            document.getElementById('feedbackMessage').textContent = '';
            document.getElementById('feedbackMessage').className = 'feedback-message';

            const { num1, num2 } = currentQuestion;
            const chineseNum1 = CHINESE_NUMBERS[num1];
            const chineseNum2 = CHINESE_NUMBERS[num2];
            
            document.getElementById('questionHighlight').textContent = `${chineseNum1}${chineseNum2}得几？`;
            
            const optionsGrid = document.getElementById('optionsGrid');
            optionsGrid.innerHTML = '';
            
            currentQuestion.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(option, btn);
                optionsGrid.appendChild(btn);
            });
        }

        function speakQuestion() {
            const { num1, num2 } = currentQuestion;
            const chineseNum1 = CHINESE_NUMBERS[num1];
            const chineseNum2 = CHINESE_NUMBERS[num2];
            const text = `${chineseNum1}${chineseNum2}得几？`;
            speak(text);
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.95;
            utterance.pitch = 1.6;
            utterance.volume = 1;
            
            const voices = window.speechSynthesis.getVoices();
            let selectedVoice = null;
            
            for (let voice of voices) {
                if (voice.lang === 'zh-CN' && (voice.name.includes('Tingting') || voice.name.includes('Xiaoxiao') || voice.name.includes('Lili') || voice.name.includes('Yunxi') || voice.name.includes('Yunyang'))) {
                    selectedVoice = voice;
                    break;
                }
            }
            
            if (!selectedVoice) {
                for (let voice of voices) {
                    if (voice.lang === 'zh-CN') {
                        selectedVoice = voice;
                        break;
                    }
                }
            }
            
            if (!selectedVoice) {
                for (let voice of voices) {
                    if (voice.lang.includes('zh')) {
                        selectedVoice = voice;
                        break;
                    }
                }
            }
            
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }
            
            window.speechSynthesis.speak(utterance);
        }

        function checkAnswer(selected, btn) {
            if (isAnswering) return;
            isAnswering = true;

            const feedbackMessage = document.getElementById('feedbackMessage');

            if (selected === currentQuestion.answer) {
                btn.classList.add('correct');
                feedbackMessage.textContent = '你太棒啦！';
                feedbackMessage.className = 'feedback-message feedback-correct';
                correctCount++;
                speak('你太棒啦！');
            } else {
                btn.classList.add('wrong');
                feedbackMessage.textContent = '没关系，继续加油！';
                feedbackMessage.className = 'feedback-message feedback-wrong';
                wrongCount++;
                speak('没关系，继续加油！');
            }

            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = wrongCount;

            setTimeout(() => {
                nextQuestion();
            }, 1500);
        }

        function nextQuestion() {
            currentQuestionIndex++;
            updateProgress();

            const totalQuestions = LEVELS[currentLevel].questionsPerLevel;

            if (currentQuestionIndex >= totalQuestions) {
                completeLevel();
            } else {
                generateQuestion();
            }
        }

        function completeLevel() {
            document.getElementById('gameContainer').classList.add('hidden');
            document.getElementById('levelCompleteScreen').classList.remove('hidden');
            
            const stars = document.querySelectorAll('.star');
            stars.forEach(star => star.classList.remove('filled'));
            
            const accuracy = correctCount / (correctCount + wrongCount);
            if (accuracy >= 0.8) {
                stars[0].classList.add('filled');
                setTimeout(() => stars[1].classList.add('filled'), 300);
                setTimeout(() => stars[2].classList.add('filled'), 600);
            } else if (accuracy >= 0.5) {
                stars[0].classList.add('filled');
                setTimeout(() => stars[1].classList.add('filled'), 300);
            } else {
                stars[0].classList.add('filled');
            }

            speak('棒棒哒，继续下一关吧！');
        }

        function nextLevel() {
            currentLevel++;
            if (currentLevel >= LEVELS.length) {
                currentLevel = 0;
            }
            
            document.getElementById('levelCompleteScreen').classList.add('hidden');
            document.getElementById('gameContainer').classList.remove('hidden');
            startLevel();
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.speechSynthesis.getVoices();
        });
    </script>
</body>
</html>
