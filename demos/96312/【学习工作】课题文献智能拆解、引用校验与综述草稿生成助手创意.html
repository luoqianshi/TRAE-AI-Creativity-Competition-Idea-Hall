<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课题文献智能拆解助手</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-bg: #0a0e14;
            --secondary-bg: #111827;
            --card-bg: #1a2332;
            --card-hover: #232d42;
            --accent: #10b981;
            --accent-dark: #059669;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --success: #22c55e;
            --warning: #f97316;
            --danger: #ef4444;
            --border-color: #2d3748;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'IBM Plex Sans', sans-serif; background: var(--primary-bg); color: var(--text-primary); min-height: 100vh; }
        
        .header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem; background: var(--secondary-bg); border-bottom: 1px solid var(--border-color); }
        .header-title { font-size: 1.3rem; font-weight: 600; display: flex; align-items: center; gap: 0.75rem; }
        .header-title i { color: var(--accent); }
        .header-right { display: flex; gap: 1rem; }
        .btn { padding: 0.5rem 1rem; border: none; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: all 0.2s; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-dark); }
        .btn-secondary { background: var(--card-bg); color: var(--text-primary); border: 1px solid var(--border-color); }

        .main-container { display: grid; grid-template-columns: 350px 1fr 380px; gap: 1.5rem; padding: 1.5rem; max-width: 1900px; margin: 0 auto; }
        
        .panel { background: var(--secondary-bg); border-radius: 16px; border: 1px solid var(--border-color); overflow: hidden; }
        .panel-header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-color); }
        .panel-title { font-size: 0.95rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
        .panel-title i { color: var(--accent); font-size: 0.9rem; }
        .panel-body { padding: 1rem 1.25rem; }

        .upload-area { border: 2px dashed var(--border-color); border-radius: 12px; padding: 2rem; text-align: center; cursor: pointer; transition: all 0.3s; }
        .upload-area:hover, .upload-area.dragover { border-color: var(--accent); background: rgba(16, 185, 129, 0.05); }
        .upload-icon { font-size: 2.5rem; color: var(--accent); margin-bottom: 0.75rem; }
        .upload-text { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 0.5rem; }

        .tags-section { margin-top: 1rem; }
        .tags-header { display: flex; justify-content: space-between; margin-bottom: 0.75rem; font-size: 0.85rem; color: var(--text-secondary); }
        .tags-container { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .tag { padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.75rem; cursor: pointer; border: 1px solid var(--border-color); color: var(--text-secondary); transition: all 0.2s; }
        .tag.active { background: var(--accent); color: white; border-color: var(--accent); }
        .tag:hover { border-color: var(--accent); }

        .document-list { max-height: 500px; overflow-y: auto; }
        .document-card { padding: 0.75rem; border-radius: 10px; cursor: pointer; margin-bottom: 0.5rem; transition: all 0.2s; border: 1px solid transparent; }
        .document-card:hover { background: var(--card-hover); }
        .document-card.selected { background: rgba(16, 185, 129, 0.1); border-color: var(--accent); }
        .document-title { font-size: 0.85rem; font-weight: 500; margin-bottom: 0.4rem; color: var(--text-primary); }
        .document-meta { font-size: 0.7rem; color: var(--text-muted); display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .document-tags { margin-top: 0.3rem; display: flex; gap: 0.3rem; }
        .mini-tag { padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.6rem; background: var(--card-bg); color: var(--text-secondary); }

        .comparison-board { height: 100%; display: flex; flex-direction: column; }
        .board-header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-color); }
        .board-title { font-size: 0.95rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
        .board-title i { color: var(--accent); }
        .board-tabs { display: flex; gap: 0.5rem; }
        .board-tab { padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.75rem; cursor: pointer; background: var(--card-bg); color: var(--text-secondary); transition: all 0.2s; }
        .board-tab.active { background: var(--accent); color: white; }
        .board-content { flex: 1; padding: 1.25rem; overflow-y: auto; }

        .comparison-item { margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); }
        .comparison-question { font-size: 0.95rem; font-weight: 600; margin-bottom: 1rem; color: var(--text-primary); }
        .conclusion-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
        .conclusion-card { background: var(--card-bg); padding: 0.75rem; border-radius: 10px; }
        .conclusion-author { font-size: 0.75rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 0.3rem; }
        .conclusion-content { font-size: 0.8rem; color: var(--text-primary); line-height: 1.5; }
        .conclusion-tags { margin-top: 0.5rem; display: flex; gap: 0.3rem; }
        .conclusion-tag { padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.6rem; }
        .tag-support { background: rgba(34, 197, 94, 0.15); color: var(--success); }
        .tag-oppose { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        .tag-neutral { background: rgba(148, 163, 184, 0.15); color: var(--text-secondary); }
        .tag-controversy { background: rgba(249, 115, 22, 0.15); color: var(--warning); }
        .consensus-section { margin-top: 0.75rem; padding: 0.75rem; background: rgba(16, 185, 129, 0.05); border-radius: 8px; }
        .consensus-title { font-size: 0.75rem; font-weight: 600; color: var(--success); margin-bottom: 0.3rem; }
        .consensus-content { font-size: 0.8rem; color: var(--text-secondary); }

        .format-selector { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .format-btn { padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.75rem; cursor: pointer; background: var(--card-bg); color: var(--text-secondary); border: 1px solid var(--border-color); transition: all 0.2s; }
        .format-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .error-list { max-height: 200px; overflow-y: auto; }
        .error-item { padding: 0.75rem; background: var(--card-bg); border-radius: 8px; margin-bottom: 0.5rem; }
        .error-header { display: flex; justify-content: space-between; margin-bottom: 0.3rem; }
        .error-type { padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.65rem; font-weight: 500; }
        .error-type.format { background: rgba(249, 115, 22, 0.15); color: var(--warning); }
        .error-type.citation { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        .error-type.mismatch { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .error-location { font-size: 0.65rem; color: var(--text-muted); }
        .error-message { font-size: 0.8rem; color: var(--text-primary); margin-bottom: 0.3rem; }
        .error-suggestion { font-size: 0.7rem; color: var(--text-secondary); }

        .review-draft { margin-top: 1rem; }
        .draft-content { max-height: 400px; overflow-y: auto; }
        .draft-section { margin-bottom: 1rem; }
        .draft-section-title { font-size: 0.9rem; font-weight: 600; color: var(--accent); margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.3rem; }
        .draft-text { font-size: 0.8rem; color: var(--text-secondary); line-height: 1.7; }
        .citation-mark { display: inline-flex; align-items: center; gap: 0.15rem; padding: 0.1rem 0.3rem; background: rgba(16, 185, 129, 0.15); border-radius: 4px; font-size: 0.65rem; color: var(--accent); cursor: pointer; margin-left: 0.2rem; }

        .footer-stats { padding: 1.5rem; max-width: 1900px; margin: 0 auto; }
        .stats-header { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; color: var(--text-primary); }
        .stats-header i { color: var(--accent); }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
        .stat-card { background: var(--secondary-bg); padding: 1rem; border-radius: 12px; text-align: center; border: 1px solid var(--border-color); }
        .stat-icon { font-size: 1.5rem; color: var(--accent); margin-bottom: 0.5rem; }
        .stat-value { font-size: 1.6rem; font-weight: 700; color: var(--text-primary); }
        .stat-label { font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.3rem; }

        .education-section { background: var(--secondary-bg); padding: 1rem; border-radius: 12px; border: 1px solid var(--border-color); }
        .education-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .education-tab { padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.75rem; cursor: pointer; background: var(--card-bg); color: var(--text-secondary); transition: all 0.2s; }
        .education-tab.active { background: var(--accent); color: white; }
        .education-title { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.75rem; }
        .education-list { list-style: none; padding: 0; }
        .education-list li { font-size: 0.8rem; color: var(--text-secondary); padding: 0.3rem 0; padding-left: 1rem; position: relative; }
        .education-list li::before { content: '•'; position: absolute; left: 0; color: var(--accent); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--secondary-bg); border-radius: 16px; padding: 1.5rem; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; border: 1px solid var(--border-color); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border-color); }
        .modal-title { font-size: 1rem; font-weight: 600; color: var(--text-primary); }
        .modal-close { width: 30px; height: 30px; border-radius: 6px; background: var(--card-bg); border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); }
        .modal-content { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.7; }
        .modal-content p { margin-bottom: 0.5rem; }

        @media (max-width: 1200px) {
            .main-container { grid-template-columns: 1fr 1fr; }
            .right-panel { grid-column: 1 / -1; }
        }
        @media (max-width: 768px) {
            .main-container { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title"><i class="fa-solid fa-book-open"></i>课题文献智能拆解助手</div>
        <div class="header-right"><button class="btn btn-secondary">登录</button><button class="btn btn-primary">生成综述</button></div>
    </div>

    <div class="main-container">
        <div class="left-panel">
            <div class="panel">
                <div class="panel-header"><h3 class="panel-title"><i class="fa-solid fa-cloud-upload-alt"></i>文献上传</h3></div>
                <div class="panel-body">
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-icon"><i class="fa-solid fa-file-pdf"></i></div>
                        <div class="upload-text">拖拽文件到此处上传</div>
                        <div class="upload-text" style="font-size: 0.7rem;">支持 PDF、DOI 链接、知网导出条目</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header"><h3 class="panel-title"><i class="fa-solid fa-tags"></i>标签分类</h3></div>
                <div class="panel-body">
                    <div class="tags-section">
                        <div class="tags-header"><span>课题标签</span><span>6个标签</span></div>
                        <div class="tags-container">
                            <div class="tag active" data-tag="all">全部</div>
                            <div class="tag" data-tag="强相关">强相关</div>
                            <div class="tag" data-tag="背景资料">背景资料</div>
                            <div class="tag" data-tag="观点相悖">观点相悖</div>
                            <div class="tag" data-tag="实验方法">实验方法</div>
                            <div class="tag" data-tag="理论基础">理论基础</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header"><h3 class="panel-title"><i class="fa-solid fa-list-ul"></i>文献列表</h3><span style="font-size: 0.75rem; color: var(--text-muted);">20 篇</span></div>
                <div class="panel-body"><div class="document-list" id="documentList"></div></div>
            </div>
        </div>

        <div class="middle-panel">
            <div class="panel comparison-board">
                <div class="board-header">
                    <h3 class="board-title"><i class="fa-solid fa-code-compare"></i>观点对比看板</h3>
                    <div class="board-tabs">
                        <div class="board-tab active" data-tab="controversy">争议点</div>
                        <div class="board-tab" data-tab="consensus">共识</div>
                        <div class="board-tab" data-tab="all">全部</div>
                    </div>
                </div>
                <div class="board-content" id="comparisonContent"></div>
            </div>
        </div>

        <div class="right-panel">
            <div class="panel reference-check">
                <div class="panel-header"><h3 class="panel-title"><i class="fa-solid fa-check-circle"></i>参考文献校验</h3><span style="font-size: 0.75rem; color: var(--danger); font-weight: 600;">10 处错误</span></div>
                <div class="panel-body">
                    <div class="format-selector">
                        <div class="format-btn active" data-format="gbt">GB/T 7714</div>
                        <div class="format-btn" data-format="apa">APA</div>
                        <div class="format-btn" data-format="mla">MLA</div>
                    </div>
                    <div class="error-list" id="errorList"></div>
                </div>
            </div>

            <div class="panel review-draft">
                <div class="panel-header"><h3 class="panel-title"><i class="fa-solid fa-file-lines"></i>综述草稿</h3><button class="btn btn-secondary" style="padding: 0.3rem 0.6rem; font-size: 0.75rem;">编辑</button></div>
                <div class="panel-body"><div class="draft-content" id="draftContent"></div></div>
            </div>
        </div>
    </div>

    <div class="footer-stats">
        <h3 class="stats-header"><i class="fa-solid fa-chart-bar"></i>数据分析与适配说明</h3>
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-file-check"></i></div><div class="stat-value">20</div><div class="stat-label">已解析文献</div></div>
            <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-percent"></i></div><div class="stat-value">92%</div><div class="stat-label">文献利用率</div></div>
            <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-triangle-exclamation"></i></div><div class="stat-value">低</div><div class="stat-label">查重风险</div></div>
            <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-book-marked"></i></div><div class="stat-value">8</div><div class="stat-label">高价值文献</div></div>
            <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-check-circle"></i></div><div class="stat-value">10</div><div class="stat-label">格式错误修正</div></div>
            <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-link"></i></div><div class="stat-value">24</div><div class="stat-label">引用标记数</div></div>
            <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-lightbulb"></i></div><div class="stat-value">6</div><div class="stat-label">争议点分析</div></div>
            <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-users"></i></div><div class="stat-value">15</div><div class="stat-label">参与文献数</div></div>
        </div>

        <div class="education-section">
            <div class="education-tabs">
                <div class="education-tab active" data-edu="undergrad">本科结课</div>
                <div class="education-tab" data-edu="master">硕士开题</div>
                <div class="education-tab" data-edu="work">职场调研</div>
            </div>
            <div class="education-content" id="educationContent"></div>
        </div>
    </div>

    <div class="modal-overlay" id="documentModal">
        <div class="modal">
            <div class="modal-header"><h3 class="modal-title" id="modalTitle">文献详情</h3><div class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></div></div>
            <div class="modal-content" id="modalContent"></div>
            <div style="margin-top: 1rem; display: flex; justify-content: flex-end; gap: 0.5rem;">
                <button class="btn btn-secondary" onclick="closeModal()">关闭</button>
                <button class="btn btn-primary">查看全文</button>
            </div>
        </div>
    </div>

    <script>
        const documents = [
            { id: '1', title: '深度学习在自然语言处理中的应用研究', authors: ['张三', '李四'], year: 2024, source: '计算机学报', tags: ['强相关', '实验方法'], abstract: '研究深度学习技术在NLP领域的应用，提出基于Transformer的改进模型。', conclusions: ['深度学习模型表现优异', 'Transformer具有强特征提取能力'], stance: 'support' },
            { id: '2', title: '基于BERT的文本分类方法研究', authors: ['赵六', '孙七'], year: 2023, source: '软件学报', tags: ['强相关', '理论基础'], abstract: '提出基于BERT预训练模型的文本分类框架。', conclusions: ['BERT能捕获丰富语义', '微调策略影响性能'], stance: 'support' },
            { id: '3', title: '深度学习模型的泛化能力研究', authors: ['周八', '吴九'], year: 2024, source: '人工智能学报', tags: ['观点相悖', '理论基础'], abstract: '验证深度学习模型在分布外数据上泛化能力不足。', conclusions: ['泛化能力有限', '需要更鲁棒方法'], stance: 'oppose' },
            { id: '4', title: '自然语言处理技术发展综述', authors: ['郑十'], year: 2023, source: '中国科学', tags: ['背景资料'], abstract: '系统梳理NLP技术发展历程。', conclusions: ['NLP经历三个阶段', '深度学习是主流'], stance: 'neutral' },
            { id: '5', title: '大语言模型的伦理问题研究', authors: ['钱十一'], year: 2024, source: '科技导报', tags: ['背景资料'], abstract: '探讨大语言模型的伦理风险。', conclusions: ['存在伦理风险', '需建立监管机制'], stance: 'neutral' },
            { id: '6', title: '对比学习在NLP中的应用', authors: ['陈十三'], year: 2024, source: '计算机研究与发展', tags: ['实验方法'], abstract: '探索对比学习方法在NLP中的应用。', conclusions: ['对比学习提升泛化能力'], stance: 'support' },
            { id: '7', title: 'Attention机制的数学原理分析', authors: ['黄十四'], year: 2023, source: '数学学报', tags: ['理论基础'], abstract: '分析Transformer中Attention机制原理。', conclusions: ['Attention本质是加权求和'], stance: 'neutral' },
            { id: '8', title: '深度学习在医疗文本分析中的应用', authors: ['何十六'], year: 2024, source: '生物医学工程学报', tags: ['强相关'], abstract: '应用深度学习于医疗文本分析。', conclusions: ['在医疗领域有应用价值'], stance: 'support' },
            { id: '9', title: '传统机器学习方法的再思考', authors: ['梁十七'], year: 2023, source: '模式识别与人工智能', tags: ['观点相悖'], abstract: '重新评估传统机器学习方法。', conclusions: ['传统方法仍有优势'], stance: 'oppose' },
            { id: '10', title: '预训练语言模型的效率优化', authors: ['宋十九'], year: 2024, source: '计算机工程', tags: ['实验方法'], abstract: '提出模型压缩和加速方法。', conclusions: ['模型压缩提升效率'], stance: 'support' },
            { id: '11', title: '多模态自然语言处理研究进展', authors: ['许二十一'], year: 2024, source: '自动化学报', tags: ['背景资料'], abstract: '综述多模态NLP研究进展。', conclusions: ['多模态是未来方向'], stance: 'neutral' },
            { id: '12', title: '小样本学习方法综述', authors: ['杨二十二'], year: 2023, source: '智能系统学报', tags: ['背景资料'], abstract: '综述小样本学习方法。', conclusions: ['元学习是主流方法'], stance: 'neutral' },
            { id: '13', title: '知识图谱与NLP融合研究', authors: ['韩二十四'], year: 2024, source: '计算机学报', tags: ['强相关'], abstract: '研究知识图谱增强预训练模型。', conclusions: ['知识图谱增强推理能力'], stance: 'support' },
            { id: '14', title: '数据增强技术在NLP中的应用', authors: ['蒋二十六'], year: 2023, source: '计算机应用', tags: ['实验方法'], abstract: '研究数据增强技术。', conclusions: ['数据增强提升泛化'], stance: 'support' },
            { id: '15', title: '深度学习可解释性研究综述', authors: ['沈二十七'], year: 2024, source: '软件学报', tags: ['背景资料'], abstract: '综述可解释性研究。', conclusions: ['方法存在局限性'], stance: 'neutral' },
            { id: '16', title: '低资源语言处理方法研究', authors: ['秦二十九'], year: 2024, source: '中文信息学报', tags: ['强相关'], abstract: '提出跨语言迁移学习方法。', conclusions: ['迁移学习解决低资源问题'], stance: 'support' },
            { id: '17', title: '神经机器翻译最新进展', authors: ['尤三十'], year: 2023, source: '计算机研究与发展', tags: ['背景资料'], abstract: '综述神经机器翻译进展。', conclusions: ['已接近人类水平'], stance: 'neutral' },
            { id: '18', title: '文本生成模型评估方法研究', authors: ['何三十二'], year: 2024, source: '自动化学报', tags: ['实验方法'], abstract: '提出文本生成评估指标。', conclusions: ['提出综合评估指标'], stance: 'support' },
            { id: '19', title: '深度学习中的对抗训练方法', authors: ['吕三十三'], year: 2023, source: '人工智能学报', tags: ['实验方法'], abstract: '提出自适应对抗训练策略。', conclusions: ['对抗训练提升鲁棒性'], stance: 'support' },
            { id: '20', title: '自然语言推理方法研究', authors: ['张三十五'], year: 2024, source: '模式识别与人工智能', tags: ['强相关'], abstract: '提出基于图神经网络的推理模型。', conclusions: ['图神经网络提升推理性能'], stance: 'support' }
        ];

        const comparisonItems = [
            { id: 'c1', question: '深度学习是否已完全取代传统机器学习？', conclusions: [{ author: '张三等', year: 2024, content: '深度学习是主流方法', stance: 'support' }, { author: '梁十七', year: 2023, content: '传统方法仍有优势', stance: 'oppose' }], consensus: '深度学习是主流', controversy: '传统方法价值有争议' },
            { id: 'c2', question: 'Transformer架构是否最优？', conclusions: [{ author: '张三等', year: 2024, content: 'Transformer特征提取能力强', stance: 'support' }, { author: '黄十四', year: 2023, content: '多头Attention捕获多维语义', stance: 'support' }], consensus: 'Transformer是主流架构', controversy: '暂无明显争议' },
            { id: 'c3', question: '大语言模型是否存在伦理风险？', conclusions: [{ author: '钱十一', year: 2024, content: '存在偏见隐私风险', stance: 'support' }], consensus: '存在伦理风险', controversy: '风险程度有不同观点' },
            { id: 'c4', question: '模型压缩能否解决效率问题？', conclusions: [{ author: '宋十九', year: 2024, content: '压缩提升推理效率', stance: 'support' }], consensus: '压缩技术有效', controversy: '最佳策略有争议' },
            { id: 'c5', question: '少样本学习是否解决数据匮乏？', conclusions: [{ author: '陈十三', year: 2024, content: '对比学习效果好', stance: 'support' }, { author: '周八', year: 2024, content: '泛化能力仍有限', stance: 'oppose' }], consensus: '少样本学习有进展', controversy: '泛化能力有争议' },
            { id: 'c6', question: '知识图谱能否增强推理能力？', conclusions: [{ author: '韩二十四', year: 2024, content: '知识图谱增强推理', stance: 'support' }, { author: '张三十五', year: 2024, content: '图神经网络提升性能', stance: 'support' }], consensus: '知识图谱能增强推理', controversy: '可解释性有疑问' }
        ];

        const referenceErrors = [
            { id: 'e1', type: 'format', location: '文献[3]', message: '作者姓名格式错误', suggestion: '替换空格为逗号' },
            { id: 'e2', type: 'citation', location: '正文第3段', message: '引用标记[5]未找到对应条目', suggestion: '检查参考文献列表' },
            { id: 'e3', type: 'mismatch', location: '文献[7]', message: '年份与卷号位置颠倒', suggestion: '先写年份再写卷号' },
            { id: 'e4', type: 'format', location: '文献[10]', message: '页码格式错误', suggestion: '使用短横线' },
            { id: 'e5', type: 'citation', location: '正文第5段', message: '直接引用未加引号', suggestion: '添加双引号' },
            { id: 'e6', type: 'mismatch', location: '文献[13]', message: '作者顺序不一致', suggestion: '保持顺序一致' },
            { id: 'e7', type: 'format', location: '文献[15]', message: '期刊名未斜体', suggestion: '使用斜体格式' },
            { id: 'e8', type: 'citation', location: '正文第2段', message: '连续引用格式不规范', suggestion: '合并为[1-3]形式' },
            { id: 'e9', type: 'mismatch', location: '文献[18]', message: '卷号期号缺逗号', suggestion: '添加逗号' },
            { id: 'e10', type: 'format', location: '文献[20]', message: '文献类型标识缺失', suggestion: '添加[J]标识' }
        ];

        const reviewDraft = [
            { section: 'background', title: '研究背景', content: '自然语言处理技术飞速发展，深度学习方法改变了研究格局<span class="citation-mark" data-doc="4">[4]</span>。Transformer架构的提出带来突破性提升<span class="citation-mark" data-doc="1">[1]</span>。' },
            { section: 'achievements', title: '现有成果', content: '深度学习已成为主流，BERT预训练模型性能优异<span class="citation-mark" data-doc="2">[2]</span>。知识图谱融合研究取得进展<span class="citation-mark" data-doc="13">[13]</span>。' },
            { section: 'defects', title: '研究缺陷', content: '深度学习泛化能力有限<span class="citation-mark" data-doc="3">[3]</span>，伦理风险需重视<span class="citation-mark" data-doc="5">[5]</span>，可解释性不足<span class="citation-mark" data-doc="15">[15]</span>。' },
            { section: 'future', title: '未来方向', content: '提升模型鲁棒性<span class="citation-mark" data-doc="19">[19]</span>，发展模型压缩技术<span class="citation-mark" data-doc="10">[10]</span>，推进多模态NLP<span class="citation-mark" data-doc="11">[11]</span>。' }
        ];

        const educationContent = {
            undergrad: { title: '本科结课论文适配建议', list: ['引用10-15篇核心文献', '重点梳理研究背景', '使用GB/T 7714格式', '综述控制在2000-3000字'] },
            master: { title: '硕士开题报告适配建议', list: ['引用30-50篇文献', '深入分析研究现状', '选择APA或GB/T 7714格式', '综述控制在5000-8000字'] },
            work: { title: '职场调研报告适配建议', list: ['引用15-25篇文献', '关注技术趋势', '格式灵活选择', '综述控制在3000-5000字'] }
        };

        function renderDocumentList(filter = 'all') {
            const container = document.getElementById('documentList');
            const filtered = filter === 'all' ? documents : documents.filter(d => d.tags.includes(filter));
            container.innerHTML = filtered.map(doc => `
                <div class="document-card" data-id="${doc.id}" onclick="selectDocument('${doc.id}')">
                    <div class="document-title">${doc.title}</div>
                    <div class="document-meta"><span>${doc.authors.join(', ')}</span><span>${doc.year}</span><span>${doc.source}</span></div>
                    <div class="document-tags">${doc.tags.map(tag => `<span class="mini-tag">${tag}</span>`).join('')}</div>
                </div>
            `).join('');
        }

        function selectDocument(id) {
            const doc = documents.find(d => d.id === id);
            document.getElementById('modalTitle').textContent = doc.title;
            document.getElementById('modalContent').innerHTML = `
                <p><strong>作者：</strong>${doc.authors.join('、')}</p>
                <p><strong>来源：</strong>${doc.source}，${doc.year}年</p>
                <p><strong>标签：</strong>${doc.tags.join('、')}</p>
                <p><strong>摘要：</strong>${doc.abstract}</p>
                <p><strong>结论：</strong>${doc.conclusions.join('；')}</p>
            `;
            document.getElementById('documentModal').classList.add('active');
        }

        function closeModal() { document.getElementById('documentModal').classList.remove('active'); }

        function renderComparison(tab = 'controversy') {
            const container = document.getElementById('comparisonContent');
            let items = comparisonItems;
            if (tab === 'controversy') items = comparisonItems.filter(item => item.controversy && item.controversy.includes('争议'));
            else if (tab === 'consensus') items = comparisonItems.filter(item => item.consensus);
            container.innerHTML = items.map(item => `
                <div class="comparison-item">
                    <div class="comparison-question">${item.question}</div>
                    <div class="conclusion-cards">
                        ${item.conclusions.map(conc => `
                            <div class="conclusion-card">
                                <div class="conclusion-author">${conc.author}(${conc.year})</div>
                                <div class="conclusion-content">${conc.content}</div>
                                <div class="conclusion-tags">
                                    <span class="conclusion-tag tag-${conc.stance}">${conc.stance === 'support' ? '支持' : conc.stance === 'oppose' ? '反对' : '中立'}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="consensus-section">
                        <div class="consensus-title"><i class="fa-solid fa-check-circle"></i>学界共识</div>
                        <div class="consensus-content">${item.consensus}</div>
                    </div>
                </div>
            `).join('');
        }

        function renderReferenceErrors() {
            const container = document.getElementById('errorList');
            container.innerHTML = referenceErrors.map(error => `
                <div class="error-item">
                    <div class="error-header">
                        <span class="error-type ${error.type}">${error.type === 'format' ? '格式错误' : error.type === 'citation' ? '引用缺失' : '匹配错误'}</span>
                        <span class="error-location">${error.location}</span>
                    </div>
                    <div class="error-message">${error.message}</div>
                    <div class="error-suggestion"><i class="fa-solid fa-lightbulb"></i>${error.suggestion}</div>
                </div>
            `).join('');
        }

        function renderReviewDraft() {
            const container = document.getElementById('draftContent');
            container.innerHTML = reviewDraft.map(section => `
                <div class="draft-section">
                    <div class="draft-section-title"><i class="fa-solid fa-chevron-right"></i>${section.title}</div>
                    <div class="draft-text">${section.content}</div>
                </div>
            `).join('');
        }

        function renderEducationContent(type = 'undergrad') {
            const container = document.getElementById('educationContent');
            const content = educationContent[type];
            container.innerHTML = `
                <div class="education-title">${content.title}</div>
                <ul class="education-list">${content.list.map(item => `<li>${item}</li>`).join('')}</ul>
            `;
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderDocumentList();
            renderComparison();
            renderReferenceErrors();
            renderReviewDraft();
            renderEducationContent();

            document.querySelectorAll('.tag').forEach(tag => tag.addEventListener('click', function() {
                document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                renderDocumentList(this.dataset.tag);
            }));

            document.querySelectorAll('.board-tab').forEach(tab => tab.addEventListener('click', function() {
                document.querySelectorAll('.board-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                renderComparison(this.dataset.tab);
            }));

            document.querySelectorAll('.education-tab').forEach(tab => tab.addEventListener('click', function() {
                document.querySelectorAll('.education-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                renderEducationContent(this.dataset.edu);
            }));

            document.querySelector('.modal-overlay').addEventListener('click', (e) => {
                if (e.target === document.querySelector('.modal-overlay')) closeModal();
            });
        });
    </script>
</body>
</html>
