<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黄金地下王国</title>
    <link rel="stylesheet" href="style.css?v=45">
</head>
<body>
    <!-- 标题画面 -->
    <div id="title-screen" class="screen active">
        <div class="title-bg">
            <img src="assets/ui/login-screen/login-bg.png" alt="" class="title-bg-img">
        </div>
        <div class="title-content">
            <h1 class="game-title">
                <img src="assets/ui/login-screen/login-title.png" alt="黄金地下王国" class="title-logo-img">
            </h1>

            <div class="title-menu">
                <button class="title-btn selected" data-action="start-game" onclick="TitleScreen.click(0)">
                    <span class="btn-bg"><img src="assets/ui/login-screen/login-btn-selected.png" alt=""></span>
                    <span class="btn-label">
                        <img class="btn-text-gold" src="assets/ui/login-screen/text-start-gold.png" alt="开始游戏">
                        <img class="btn-text-teal" src="assets/ui/login-screen/text-start-teal.png" alt="开始游戏">
                    </span>
                </button>
                <button class="title-btn" data-action="restart" onclick="TitleScreen.click(1)">
                    <span class="btn-bg"><img src="assets/ui/login-screen/login-btn-default.png" alt=""></span>
                    <span class="btn-label">
                        <img class="btn-text-gold" src="assets/ui/login-screen/text-restart-gold.png" alt="重新开始">
                        <img class="btn-text-teal" src="assets/ui/login-screen/text-restart-teal.png" alt="重新开始">
                    </span>
                </button>
                <button class="title-btn" data-action="option" onclick="TitleScreen.click(2)">
                    <span class="btn-bg"><img src="assets/ui/login-screen/login-btn-default.png" alt=""></span>
                    <span class="btn-label">
                        <img class="btn-text-gold" src="assets/ui/login-screen/text-option-gold.png" alt="选项">
                        <img class="btn-text-teal" src="assets/ui/login-screen/text-option-teal.png" alt="选项">
                    </span>
                </button>
                <button class="title-btn" data-action="license" onclick="TitleScreen.click(3)">
                    <span class="btn-bg"><img src="assets/ui/login-screen/login-btn-default.png" alt=""></span>
                    <span class="btn-label">
                        <img class="btn-text-gold" src="assets/ui/login-screen/text-license-gold.png" alt="许可">
                        <img class="btn-text-teal" src="assets/ui/login-screen/text-license-teal.png" alt="许可">
                    </span>
                </button>
            </div>
        </div>
    </div>

    <!-- 冒险者公会画面 -->
    <div id="guild-screen" class="screen">
        <div class="guild-bg">
            <img src="assets/ui/guild/guild_bg.jpg" alt="" class="guild-bg-img">
            <div class="guild-bg-overlay"></div>
        </div>
        <div class="guild-content">
            <div class="guild-header">
                <h2 class="guild-title">冒险者公会</h2>
                <p class="guild-subtitle" id="guild-subtitle">登记人数 0/30</p>
            </div>
            <div class="guild-main" id="guild-main">
                <div class="guild-menu">
                    <button class="guild-btn" onclick="Guild.showPartyInfo()">📋 冒险者队伍信息</button>
                    <button class="guild-btn" onclick="Guild.showRegistration()">📝 冒险者登记</button>
                    <button class="guild-btn" onclick="Guild.showFormation()">⚔️ 冒险者队伍编队</button>
                    <button class="guild-btn" id="battle-meeting-btn" onclick="Guild.startBattleMeeting()">🧠 战斗会议</button>
                    <button class="guild-btn back" onclick="Guild.leave()">🚪 离开公会</button>
                </div>
            </div>
            <div class="guild-sub" id="guild-party-info" style="display:none;">
                <div class="guild-sub-header">
                    <h3>冒险者队伍信息</h3>
                    <button class="guild-back-btn" onclick="Guild.backToMain()">← 返回</button>
                </div>
                <div class="guild-party-list" id="guild-party-list"></div>
            </div>
            <div class="guild-sub" id="guild-registration" style="display:none;">
                <div class="guild-sub-header">
                    <h3>冒险者登记</h3>
                    <button class="guild-back-btn" onclick="Guild.backToMain()">← 返回</button>
                </div>
                <div class="reg-steps" id="reg-steps">
                    <div class="reg-step active" data-step="1">① 职业</div>
                    <div class="reg-step" data-step="2">② 外貌</div>
                    <div class="reg-step" data-step="3">③ 名称</div>
                    <div class="reg-step" data-step="4">④ 属性</div>
                    <div class="reg-step" data-step="5">⑤ 确认</div>
                </div>
                <div class="reg-step-content active" id="reg-step-1">
                    <div class="class-grid" id="reg-class-grid"></div>
                </div>
                <div class="reg-step-content" id="reg-step-2">
                    <div class="appearance-preview">
                        <img id="appearance-preview-img" src="" alt="外貌预览">
                    </div>
                    <div class="appearance-options" id="appearance-options"></div>
                </div>
                <div class="reg-step-content" id="reg-step-3">
                    <div class="name-input-panel">
                        <label>为冒险者命名：</label>
                        <input type="text" id="reg-char-name" maxlength="8" placeholder="输入名称...">
                        <button class="action-btn" onclick="Guild.randomName()">🎲 随机名称</button>
                    </div>
                </div>
                <div class="reg-step-content" id="reg-step-4">
                    <div class="stat-allocation" id="stat-allocation"></div>
                    <div class="stat-actions">
                        <span>剩余点数: <strong id="bonus-points">5</strong></span>
                        <button class="action-btn" onclick="Guild.autoAllocate()">自动分配</button>
                        <button class="action-btn" onclick="Guild.resetStats()">重置</button>
                    </div>
                </div>
                <div class="reg-step-content" id="reg-step-5">
                    <div class="confirm-card" id="confirm-card"></div>
                    <div class="confirm-actions">
                        <button class="action-btn back" onclick="Guild.regGoStep(4)">← 修改</button>
                        <button class="action-btn confirm" onclick="Guild.registerCharacter()">✅ 登记冒险者</button>
                    </div>
                </div>
            </div>
            <div class="reg-nav" id="reg-nav" style="display:none;">
                <button class="action-btn back" id="reg-prev-btn" onclick="Guild.regPrevStep()" style="display:none">← 上一步</button>
                <button class="action-btn confirm" id="reg-next-btn" onclick="Guild.regNextStep()">下一步 →</button>
            </div>
            <div class="guild-sub" id="guild-formation" style="display:none;">
                <div class="guild-sub-header">
                    <h3>冒险者队伍编队</h3>
                    <button class="guild-back-btn" onclick="Guild.backToMain()">← 返回</button>
                </div>
                <div class="guild-formation-content">
                    <div class="formation-party">
                        <h3>当前队伍 (<span id="formation-party-count">0</span>/5)</h3>
                        <div class="formation-slots" id="formation-slots"></div>
                    </div>
                    <div class="formation-warehouse">
                        <h3>冒险者仓库</h3>
                        <div class="roster-list formation-roster" id="formation-roster"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 城镇画面 -->
    <div id="town-screen" class="screen">
        <div class="town-bg">
            <img src="assets/ui/town/bg.jpg" alt="" class="town-bg-img">
            <div class="town-bg-overlay"></div>
        </div>
        <div class="town-content">
            <div class="town-header">
                <h2 class="town-title">艾特利亚镇</h2>
                <div class="party-status-bar" id="town-party-status"></div>
            </div>
            <div class="town-locations">
                <button class="location-btn btn-guild" onclick="Town.enterGuild()">
                    <div class="loc-btn-frame">
                        <img src="assets/ui/town/btn_guild.jpg" alt="" class="loc-btn-bg">
                        <div class="loc-btn-content">
                            <span class="loc-icon">⚔️</span>
                            <span class="loc-name">冒险者公会</span>
                            <span class="loc-desc">管理队伍成员</span>
                        </div>
                    </div>
                </button>
                <button class="location-btn btn-shop" onclick="Town.enterShop()">
                    <div class="loc-btn-frame">
                        <img src="assets/ui/town/btn_shop.jpg" alt="" class="loc-btn-bg">
                        <div class="loc-btn-content">
                            <span class="loc-icon">💰</span>
                            <span class="loc-name">道具商店</span>
                            <span class="loc-desc">购买装备和道具</span>
                        </div>
                    </div>
                </button>
                <button class="location-btn btn-inn" onclick="Town.enterInn()">
                    <div class="loc-btn-frame">
                        <img src="assets/ui/town/btn_inn.jpg" alt="" class="loc-btn-bg">
                        <div class="loc-btn-content">
                            <span class="loc-icon">🏨</span>
                            <span class="loc-name">旅馆</span>
                            <span class="loc-desc">休息恢复HP/TP和保存游戏</span>
                        </div>
                    </div>
                </button>
                <button class="location-btn btn-labyrinth" onclick="Town.enterLabyrinth()">
                    <div class="loc-btn-frame">
                        <img src="assets/ui/town/btn_labyrinth.jpg" alt="" class="loc-btn-bg">
                        <div class="loc-btn-content">
                            <span class="loc-icon">🌳</span>
                            <span class="loc-name">黄金地下王国</span>
                            <span class="loc-desc">进入迷宫探索</span>
                        </div>
                    </div>
                </button>
            </div>
        </div>
    </div>

    <!-- 迷宫探索画面 -->
    <div id="maze-screen" class="screen">
        <div class="maze-layout">
            <div class="maze-viewport" id="maze-viewport">
                <canvas id="viewport-canvas" width="640" height="480"></canvas>
                <!-- 整合的HUD信息（左上角） -->
                <div class="maze-hud-compact">
                    <span class="hud-floor-inline" id="hud-floor">B1F</span>
                    <span class="hud-divider">|</span>
                    <span class="hud-steps-inline" id="hud-steps">步数: 0</span>
                </div>
                <!-- 战斗日志（顶部，从楼层信息右侧开始） -->
                <div class="battle-log-bar" id="battle-log-bar">
                    <div class="log-line1" id="battle-log-line1"></div>
                    <div class="log-line2" id="battle-log-line2"></div>
                </div>
                <!-- 敌人显示区域（场景中央） -->
                <div class="battle-enemies" id="battle-enemies">
                    <!-- 动态生成敌人卡片 -->
                </div>
                <!-- 飘血显示层 -->
                <div class="damage-float-layer" id="damage-float-layer"></div>
                <!-- 遇敌雷达（左下角） -->
                <div class="encounter-radar" id="encounter-radar">
                    <div class="radar-ring"></div>
                    <div class="radar-dot" id="radar-dot"></div>
                </div>
                <div class="radar-label" id="radar-label">安全</div>
                <div class="encounter-alert" id="encounter-alert">
                    <span>⚠️ 遭遇敌人！</span>
                </div>
                <!-- 六方向控制 - 半透明叠加在场景上 -->
                <div class="direction-controls-6" id="direction-controls">
                    <div class="control-row">
                        <button class="dir-btn-6 turn-left" onclick="Maze.turnLeft()" title="左转">↺</button>
                        <button class="dir-btn-6 forward" onclick="Maze.moveForward()" title="前进">▲</button>
                        <button class="dir-btn-6 turn-right" onclick="Maze.turnRight()" title="右转">↻</button>
                    </div>
                    <div class="control-row">
                        <button class="dir-btn-6 strafe-left" onclick="Maze.strafeLeft()" title="左平移">◀</button>
                        <button class="dir-btn-6 backward" onclick="Maze.moveBackward()" title="后退">▼</button>
                        <button class="dir-btn-6 strafe-right" onclick="Maze.strafeRight()" title="右平移">▶</button>
                    </div>
                </div>
                <!-- 操作按钮 - 右下角 -->
                <div class="action-buttons">
                    <button class="action-btn" onclick="Maze.interact()">🔍 调查</button>
                    <button class="action-btn" onclick="ItemQuickUse.openItemPopup()">🎒 道具</button>
                    <button class="action-btn" onclick="Maze.openMenu()">📋 菜单</button>
                </div>
                <!-- 队伍状态面板（底部，交战时滑入） -->
                <div class="party-status-panel" id="party-status-panel">
                    <div class="party-container">
                        <div class="party-row front-row" id="party-front-row"></div>
                        <div class="party-row back-row" id="party-back-row"></div>
                    </div>
                </div>
            </div>
            <div class="map-panel">
                <!-- 大地图：已探索区域 -->
                <div class="big-map">
                    <div class="map-toolbar">
                        <button class="tool-btn active" data-tool="wall" onclick="MapEditor.setTool('wall')" title="墙壁">🧱</button>
                        <button class="tool-btn" data-tool="door" onclick="MapEditor.setTool('door')" title="门">🚪</button>
                        <button class="tool-btn" data-tool="event" onclick="MapEditor.setTool('event')" title="事件">⭐</button>
                        <button class="tool-btn" data-tool="note" onclick="MapEditor.setTool('note')" title="备注">📝</button>
                        <button class="tool-btn" data-tool="erase" onclick="MapEditor.setTool('erase')" title="擦除">🧹</button>
                    </div>
                    <div class="map-grid" id="big-map-grid"></div>
                </div>
                <!-- 小地图：周围5x5区域 -->
                <div class="small-map">
                    <div class="map-grid" id="small-map-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 道具快速使用弹窗 -->
    <div class="item-popup-overlay" id="item-popup-overlay" style="display:none">
        <div class="item-popup">
            <div class="item-popup-header">
                <span>🎒 道具</span>
                <button class="item-popup-close" onclick="ItemQuickUse.closeItemPopup()">✕</button>
            </div>
            <div class="item-popup-list" id="item-popup-list">
                <!-- 动态生成道具列表 -->
            </div>
        </div>
    </div>

    <!-- 战斗画面 -->
    <div id="battle-screen" class="screen">
        <div class="battle-layout">
            <div class="battle-header">
                <span class="battle-title">⚔️ 战斗进行中</span>
                <div class="battle-controls">
                    <select id="battle-speed" class="battle-speed-select" onchange="Battle.setBattleSpeed(this.value)">
                        <option value="1">⚡1x 正常</option>
                        <option value="2">⚡2x 快速</option>
                        <option value="4">⚡4x 极速</option>
                        <option value="0">⏭️ 跳过</option>
                    </select>
                </div>
            </div>
            <div class="battle-scene">
                <div class="enemy-display" id="enemy-display"></div>
                <div class="battle-effects" id="battle-effects"></div>
            </div>
            <div class="battle-ui">
                <div class="party-battle-status" id="party-battle-status"></div>
                <!-- 自动战斗：隐藏原有命令按钮 -->
                <div class="battle-commands auto-battle" id="battle-commands">
                    <div class="auto-battle-indicator" id="ai-decision-display"></div>
                </div>
                <div class="battle-log" id="battle-log"></div>
            </div>
        </div>
        <div class="skill-submenu" id="skill-submenu" style="display:none;">
            <h3>选择技能</h3>
            <div id="skill-list"></div>
            <button class="action-btn back" onclick="Battle.closeSkillMenu()">返回</button>
        </div>
    </div>

    <!-- 商店画面 -->
    <div id="shop-screen" class="screen">
        <div class="shop-layout">
            <div class="shop-header">
                <h2>🏪 道具商店</h2>
                <p>金币: <span id="shop-gold">0</span></p>
            </div>
            <div class="shop-tabs">
                <button class="tab-btn active" onclick="Shop.switchTab('items')">道具</button>
                <button class="tab-btn" onclick="Shop.switchTab('weapons')">武器</button>
                <button class="tab-btn" onclick="Shop.switchTab('armors')">防具</button>
            </div>
            <div class="shop-items" id="shop-items"></div>
            <div class="shop-actions">
                <button class="action-btn" onclick="Shop.buy()">购买</button>
                <button class="action-btn" onclick="Shop.sell()">出售</button>
                <button class="action-btn back" onclick="Shop.leave()">离开</button>
            </div>
        </div>
    </div>

    <!-- 菜单画面 -->
    <div id="menu-screen" class="screen">
        <div class="menu-layout">
            <div class="menu-header">
                <h2>📋 菜单</h2>
            </div>
            <div class="menu-options">
                <div class="menu-party-list" id="menu-party-list"></div>
                <div class="menu-buttons">
                    <button class="menu-opt" onclick="Menu.showStatus()">角色状态</button>
                    <button class="menu-opt" onclick="Menu.showInventory()">道具一览</button>
                    <button class="menu-opt" onclick="Menu.returnToMaze()">返回迷宫</button>
                    <button class="menu-opt danger" onclick="Menu.returnToTown()">返回城镇</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 角色状态全屏界面 -->
    <div id="character-status-screen" class="screen">
        <div class="char-status-layout">
            <div class="char-status-header">
                <button class="back-btn" onclick="Menu.closeStatusScreen()">← 返回</button>
                <h2 id="char-status-title">角色状态</h2>
            </div>
            <div class="char-status-main">
                <div class="char-portrait-large" id="char-portrait-container">
                    <img id="char-portrait-img" src="" alt="">
                </div>
                <div class="char-details">
                    <div class="char-basic-info">
                        <div class="char-name-row">
                            <span id="char-name" class="char-name"></span>
                            <span id="char-class" class="char-class"></span>
                        </div>
                        <div class="char-level-row">
                            <span id="char-level"></span>
                            <span id="char-exp"></span>
                        </div>
                    </div>
                    <div class="char-stats-section">
                        <h3>属性</h3>
                        <div class="stat-bars">
                            <div class="stat-row">
                                <span class="stat-label">HP</span>
                                <div class="stat-bar-wrap">
                                    <div class="stat-bar hp-bar" id="hp-bar"></div>
                                </div>
                                <span class="stat-value" id="hp-value"></span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label">TP</span>
                                <div class="stat-bar-wrap">
                                    <div class="stat-bar tp-bar" id="tp-bar"></div>
                                </div>
                                <span class="stat-value" id="tp-value"></span>
                            </div>
                        </div>
                        <div class="stat-grid">
                            <div class="stat-item"><span class="stat-label">攻击</span><span id="atk-value" class="stat-num"></span></div>
                            <div class="stat-item"><span class="stat-label">防御</span><span id="def-value" class="stat-num"></span></div>
                            <div class="stat-item"><span class="stat-label">速度</span><span id="spd-value" class="stat-num"></span></div>
                            <div class="stat-item"><span class="stat-label">幸运</span><span id="luk-value" class="stat-num"></span></div>
                        </div>
                    </div>
                    <div class="char-skills-section">
                        <h3>技能</h3>
                        <div id="char-skills" class="skills-list"></div>
                    </div>
                </div>
            </div>
            <div class="char-thumbnails" id="char-thumbnails"></div>
        </div>
    </div>

    <!-- 战斗会议AVG对话界面 -->
    <div id="battle-meeting-screen" class="screen">
        <div class="avg-layout">
            <!-- 背景层 -->
            <div class="avg-background"></div>
            
            <!-- 立绘层 - 左右两侧 -->
            <div class="avg-portraits-layer">
                <div class="avg-portrait-left" id="avg-portrait-left">
                    <img id="avg-portrait-left-img" src="" alt="" style="display:none;">
                </div>
                <div class="avg-portrait-right" id="avg-portrait-right">
                    <img id="avg-portrait-right-img" src="" alt="" style="display:none;">
                </div>
            </div>
            
            <!-- 对话框层 - 在底部，覆盖在立绘之上 -->
            <div class="avg-dialog-layer">
                <div class="avg-dialog-box">
                    <div class="avg-speaker" id="avg-speaker"></div>
                    <div class="avg-text" id="avg-text"></div>
                    <div class="avg-data-panel" id="avg-data-panel" style="display:none;"></div>
                    <div class="avg-indicator" id="avg-indicator">▼</div>
                </div>
                <div class="avg-controls">
                    <button class="avg-btn" id="avg-next-btn" onclick="BattleMeeting.nextDialog()">下一页 →</button>
                    <button class="avg-btn" id="avg-skip-btn" onclick="BattleMeeting.skipToEnd()">跳过对话</button>
                </div>
            </div>
        </div>
    </div>

    <!-- AI编辑器界面 -->
    <div id="ai-editor-screen" class="screen">
        <div class="ai-editor-layout">
            <div class="ai-editor-header">
                <button class="back-btn" onclick="AIEditor.close()">← 返回</button>
                <h2 id="ai-editor-title">AI战术编辑</h2>
                <div class="ai-editor-actions">
                    <button class="ai-editor-btn" onclick="AIEditor.resetConfig()">↩️ 重置</button>
                    <button class="ai-editor-btn save" onclick="AIEditor.saveConfig()">💾 保存</button>
                </div>
            </div>
            <div class="ai-editor-body">
                <div class="ai-editor-char-list" id="ai-editor-char-list"></div>
                <div class="ai-editor-main" id="ai-editor-main"></div>
            </div>
        </div>
    </div>

    <!-- 对话框/消息 -->
    <div id="dialog-box" class="dialog-box" style="display:none;">
        <div class="dialog-content" id="dialog-content"></div>
        <button class="dialog-close" onclick="Dialog.close()">确认</button>
    </div>

    <!-- 游戏结束画面 -->
    <div id="gameover-screen" class="screen">
        <div class="gameover-content">
            <h1>全灭...</h1>
            <p>你的队伍被迷宫中的怪物击败了...</p>
            <button class="menu-btn" onclick="Game.returnToTitle()">返回标题</button>
        </div>
    </div>

    <!-- 胜利画面 -->
