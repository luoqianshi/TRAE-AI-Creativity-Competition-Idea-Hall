<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>试卷识别与智能组卷 Demo</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="page">
    <header class="hero">
      <div>
        <p class="eyebrow">TRAE 创造力大赛 Demo</p>
        <h1>试卷识别 + 题库整理 + 智能组卷</h1>
        <p class="subtitle">左侧拖拽图片实时识别入库，右侧同步显示 OCR、一审、二审、JSON 入库进度，下方再按主题自动组卷并下载 Word。</p>
      </div>
      <div class="status-pill" id="current-stage">等待上传图片</div>
    </header>

    <section class="top-grid">
      <div class="card upload-card">
        <h2>拖拽试卷图片</h2>
        <label id="dropzone" class="dropzone">
          <input id="file-input" type="file" accept="image/*" hidden />
          <span>拖拽图片到这里，或点击上传</span>
          <small>支持 png / jpg / jpeg</small>
        </label>
        <button id="upload-btn" class="primary-btn">开始识别并入库</button>
        <p id="upload-result" class="hint"></p>
      </div>

      <div class="card flow-card">
        <h2>处理流程</h2>
        <div id="flow-steps" class="flow-steps">
          <div class="flow-step" data-stage="uploaded">已上传</div>
          <div class="flow-step" data-stage="ocr">OCR 识别</div>
          <div class="flow-step" data-stage="review_1">进入一审</div>
          <div class="flow-step" data-stage="review_2">进入二审</div>
          <div class="flow-step" data-stage="bank_done">组成 JSON 并入库</div>
          <div class="flow-step" data-stage="generate_done">生成 Word</div>
        </div>
        <div class="timeline">
          <h3>实时日志</h3>
          <ul id="history-list"></ul>
        </div>
      </div>
    </section>

    <section class="card generator-card">
      <h2>按主题智能出题</h2>
      <div class="form-grid">
        <label>
          <span>面向人群</span>
          <input id="audience" value="高中生物" />
        </label>
        <label>
          <span>出题主题</span>
          <input id="topic" value="遗传学" />
        </label>
        <label>
          <span>题型</span>
          <input id="question-type" value="选择题" />
        </label>
        <label>
          <span>数量</span>
          <input id="count" type="number" min="1" max="20" value="5" />
        </label>
      </div>
      <button id="generate-btn" class="primary-btn">开始出题并生成 Word</button>
      <div class="download-row">
        <a id="download-questions" class="download-btn disabled" href="#">下载题目 Word</a>
        <a id="download-answers" class="download-btn disabled" href="#">下载答案 Word</a>
      </div>
      <pre id="generate-result" class="result-box">等待组卷…</pre>
    </section>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
