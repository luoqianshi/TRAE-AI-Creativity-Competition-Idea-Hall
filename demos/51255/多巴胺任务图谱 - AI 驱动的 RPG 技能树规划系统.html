<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多巴胺任务图谱 | RPG 技能树规划系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            overflow: hidden;
        }
        .glow-text {
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.7), 0 0 20px rgba(168, 85, 247, 0.5);
        }
        .cyber-btn {
            background: linear-gradient(90deg, #3b82f6 0%, #8b5cf6 100%);
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }
        .cyber-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.6);
        }
        .cyber-btn:disabled {
            background: #475569;
            box-shadow: none;
            cursor: not-allowed;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #64748b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .loading-dots span {
            animation: blink 1.4s infinite both;
            font-size: 2rem;
        }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink {
            0%, 80%, 100% { opacity: 0; }
            40% { opacity: 1; }
        }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="p-6 border-b border-slate-800 z-10 bg-slate-900/80 backdrop-blur-md">
        <h1 class="text-3xl font-black mb-4 tracking-wider glow-text">⚔️ 多巴胺任务图谱</h1>
        <div class="flex gap-4">
            <input id="goalInput" type="text" placeholder="输入你的宏大目标，例如：三个月学会 React 开发小程序" 
                   class="flex-1 bg-slate-800/80 border border-slate-700 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 transition-colors text-lg">
            <button id="generateBtn" class="cyber-btn px-8 py-3 rounded-lg font-bold text-lg whitespace-nowrap">召唤 AI 智能体</button>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <div class="flex-1 relative p-4">
            <div id="loadingOverlay" class="absolute inset-0 bg-slate-900/90 z-20 flex-col items-center justify-center hidden">
                <div class="text-blue-400 font-bold mb-4 text-xl tracking-widest">AI 智能体正在推演技能树...</div>
                <div class="loading-dots text-blue-500">
                    <span>.</span><span>.</span><span>.</span>
                </div>
            </div>
            <div id="chartContainer" class="w-full h-full rounded-xl border border-slate-800 bg-slate-900/40"></div>
        </div>

        <aside class="w-96 border-l border-slate-800 p-6 overflow-y-auto bg-slate-900/60 backdrop-blur-sm">
            <div id="emptyState" class="h-full flex flex-col items-center justify-center text-slate-600 text-center">
                <div class="text-6xl mb-4">🌳</div>
                <p class="text-xl">等待任务生成...</p>
                <p class="text-sm mt-2">点击左侧节点查看详情<br>完成任务解锁后续节点</p>
            </div>

            <div id="nodeDetail" class="hidden">
                <div class="text-xs text-blue-400 font-bold tracking-widest mb-2">当前任务节点</div>
                <h2 id="nodeName" class="text-2xl font-bold mb-4 text-white"></h2>
                
                <div class="mb-6 p-4 bg-slate-800/50 rounded-lg border border-slate-700">
                    <div class="text-xs text-slate-500 mb-1 uppercase tracking-wider">任务描述</div>
                    <p id="nodeDesc" class="text-slate-300 text-sm leading-relaxed"></p>
                </div>

                <div class="mb-6">
                    <div class="text-xs text-slate-500 mb-2 uppercase tracking-wider">前置依赖</div>
                    <div id="nodeDeps" class="flex flex-wrap gap-2"></div>
                </div>

                <button id="completeBtn" class="w-full py-4 rounded-lg font-bold text-lg transition-all bg-gradient-to-r from-yellow-500 to-orange-500 text-white shadow-lg shadow-orange-500/30 hover:shadow-orange-500/60 hover:scale-[1.02]">
                    ✨ 点亮技能 (获取多巴胺)
                </button>
                
                <div id="lockedHint" class="hidden w-full py-4 rounded-lg font-bold text-lg text-center bg-slate-800 text-slate-500 border border-slate-700">
                    🔒 需先完成前置任务
                </div>
                <div id="completedHint" class="hidden w-full py-4 rounded-lg font-bold text-lg text-center bg-green-900/30 text-green-400 border border-green-800">
                    ✔️ 技能已掌握
                </div>
            </div>
        </aside>
    </main>

    <div id="toast" class="fixed top-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-lg shadow-2xl border border-slate-600 opacity-0 transition-opacity duration-300 z-50 pointer-events-none"></div>

    <script>
        let chart = null;
        let currentNodes = [];
        let currentLinks = [];
        let selectedNodeId = null;

        function mockAIGenerate(goal) {
            const baseNodes = [
                { id: '0', name: 'HTML/CSS 基础', desc: '掌握页面骨架与样式布局', deps: [] },
                { id: '1', name: 'JavaScript 基础', desc: '理解变量、函数、异步与 DOM 操作', deps: ['0'] },
                { id: '2', name: 'React 基础概念', desc: '组件化思想、JSX 语法、生命周期', deps: ['1'] },
                { id: '3', name: 'Hooks 深入', desc: 'useState, useEffect, useRef 等核心 Hooks', deps: ['2'] },
                { id: '4', name: '状态管理', desc: '学习 Zustand 或 Redux 管理全局状态', deps: ['2'] },
                { id: '5', name: '路由系统', desc: 'React Router 的配置与动态路由', deps: ['2'] },
                { id: '6', name: '小程序基础', desc: '了解小程序双线程模型与生命周期', deps: ['3'] },
                { id: '7', name: 'Taro 框架', desc: '使用 Taro 将 React 代码编译为小程序', deps: ['6', '5'] },
                { id: '8', name: '综合实战项目', desc: '从零开发一款完整的电商小程序', deps: ['7', '4'] }
            ];

            return {
                nodes: baseNodes.map(n => ({
                    id: n.id,
                    name: n.name,
                    desc: n.desc,
                    deps: n.deps,
                    status: n.deps.length === 0 ? 'unlocked' : 'locked'
                })),
                links: [
                    { source: '0', target: '1' },
                    { source: '1', target: '2' },
                    { source: '2', target: '3' },
                    { source: '2', target: '4' },
                    { source: '2', target: '5' },
                    { source: '3', target: '6' },
                    { source: '6', target: '7' },
                    { source: '5', target: '7' },
                    { source: '7', target: '8' },
                    { source: '4', target: '8' }
                ]
            };
        }

        function initChart() {
            const dom = document.getElementById('chartContainer');
            chart = echarts.init(dom);
            
            chart.on('click', function(params) {
                if (params.dataType === 'node') {
                    selectNode(params.data.id);
                }
            });

            window.addEventListener('resize', () => chart.resize());
        }

        function renderGraph() {
            if (!chart) return;

            const option = {
                tooltip: {
                    formatter: function (params) {
                        if (params.dataType === 'node') {
                            return `<b>${params.data.name}</b><br/>状态: ${getStatusText(params.data.status)}`;
                        }
                        return '';
                    },
                    backgroundColor: 'rgba(15, 23, 42, 0.9)',
                    borderColor: '#334155',
                    textStyle: { color: '#e2e8f0' }
                },
                series: [
                    {
                        type: 'graph',
                        layout: 'force',
                        roam: true,
                        draggable: true,
                        force: {
                            repulsion: 800,
                            edgeLength: [120, 200],
                            gravity: 0.1
                        },
                        label: {
                            show: true,
                            position: 'bottom',
                            color: '#cbd5e1',
                            fontSize: 14,
                            fontWeight: 'bold',
                            formatter: '{b}'
                        },
                        edgeSymbol: ['none', 'arrow'],
                        edgeSymbolSize: 8,
                        edgeLineStyle: {
                            color: '#475569',
                            width: 2,
                            curveness: 0.1
                        },
                        data: currentNodes.map(node => ({
                            id: node.id,
                            name: node.name,
                            symbolSize: node.status === 'completed' ? 60 : 50,
                            itemStyle: getNodeStyle(node.status),
                            category: node.status
                        })),
                        links: currentLinks.map(link => ({
                            source: link.source,
                            target: link.target,
                            lineStyle: {
                                color: getNodeById(link.target).status === 'locked' ? '#334155' : '#3b82f6',
                                width: 2
                            }
                        }))
                    }
                ]
            };

            chart.setOption(option, true);
        }

        function getNodeStyle(status) {
            switch (status) {
                case 'completed':
                    return { color: '#f59e0b', shadowBlur: 20, shadowColor: '#f59e0b', borderColor: '#fbbf24', borderWidth: 3 };
                case 'unlocked':
                    return { color: '#3b82f6', shadowBlur: 15, shadowColor: '#3b82f6', borderColor: '#60a5fa', borderWidth: 2 };
                case 'locked':
                    return { color: '#1e293b', borderColor: '#475569', borderWidth: 2, opacity: 0.6 };
            }
        }

        function getStatusText(status) {
            switch (status) {
                case 'completed': return '✅ 已完成';
                case 'unlocked': return '🔵 可挑战';
                case 'locked': return '🔒 未解锁';
            }
        }

        function selectNode(id) {
            selectedNodeId = id;
            const node = getNodeById(id);
            
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('nodeDetail').classList.remove('hidden');

            document.getElementById('nodeName').innerText = node.name;
            document.getElementById('nodeDesc').innerText = node.desc;

            const depsContainer = document.getElementById('nodeDeps');
            depsContainer.innerHTML = '';
            if (node.deps.length === 0) {
                depsContainer.innerHTML = '<span class="text-slate-500 text-sm">无 (起点任务)</span>';
            } else {
                node.deps.forEach(depId => {
                    const depNode = getNodeById(depId);
                    const tag = document.createElement('span');
                    tag.className = `text-xs px-2 py-1 rounded ${depNode.status === 'completed' ? 'bg-green-900/50 text-green-400 border border-green-800' : 'bg-red-900/50 text-red-400 border border-red-800'}`;
                    tag.innerText = `${depNode.name}`;
                    depsContainer.appendChild(tag);
                });
            }

            const completeBtn = document.getElementById('completeBtn');
            const lockedHint = document.getElementById('lockedHint');
            const completedHint = document.getElementById('completedHint');

            completeBtn.classList.add('hidden');
            lockedHint.classList.add('hidden');
            completedHint.classList.add('hidden');

            if (node.status === 'unlocked') {
                completeBtn.classList.remove('hidden');
            } else if (node.status === 'locked') {
                lockedHint.classList.remove('hidden');
            } else if (node.status === 'completed') {
                completedHint.classList.remove('hidden');
            }
        }

        function completeTask() {
            if (!selectedNodeId) return;
            const node = getNodeById(selectedNodeId);
            node.status = 'completed';

            currentLinks.forEach(link => {
                if (link.source === selectedNodeId) {
                    const nextNode = getNodeById(link.target);
                    if (nextNode.status === 'locked') {
                        const allDepsCompleted = nextNode.deps.every(depId => getNodeById(depId).status === 'completed');
                        if (allDepsCompleted) {
                            nextNode.status = 'unlocked';
                            showToast(`🚀 解锁新任务: ${nextNode.name}`);
                        }
                    }
                }
            });

            renderGraph();
            selectNode(selectedNodeId);
            showToast(`🎉 技能点亮成功！多巴胺 +100`);
        }

        function getNodeById(id) {
            return currentNodes.find(n => n.id === id);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2500);
        }

        document.getElementById('generateBtn').addEventListener('click', () => {
            const goal = document.getElementById('goalInput').value.trim();
            if (!goal) {
                showToast('请先输入你的目标！');
                return;
            }

            document.getElementById('loadingOverlay').classList.remove('hidden');
            document.getElementById('loadingOverlay').classList.add('flex');
            document.getElementById('generateBtn').disabled = true;

            setTimeout(() => {
                const result = mockAIGenerate(goal);
                currentNodes = result.nodes;
                currentLinks = result.links;
                
                renderGraph();
                
                document.getElementById('loadingOverlay').classList.add('hidden');
                document.getElementById('loadingOverlay').classList.remove('flex');
                document.getElementById('generateBtn').disabled = false;

                showToast('⚡ 技能树推演完成！开始你的冒险吧。');
                
                setTimeout(() => selectNode('0'), 500);
            }, 2000);
        });

        document.getElementById('completeBtn').addEventListener('click', completeTask);

        window.onload = () => {
            initChart();
        };
    </script>
</body>
</html>
