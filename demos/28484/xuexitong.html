<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习通自动答题系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 32px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
        }
        
        .tabs {
            display: flex;
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 20px;
        }
        
        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .tab.active {
            background: white;
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .tab:hover:not(.active) {
            background: rgba(255,255,255,0.1);
        }
        
        .content {
            display: none;
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .content.active {
            display: block;
        }
        
        .question-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .question-type {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .type-single { background: #e3f2fd; color: #1976d2; }
        .type-multiple { background: #e8f5e9; color: #388e3c; }
        .type-judge { background: #fff3e0; color: #f57c00; }
        
        .question-number {
            color: #666;
            font-size: 14px;
        }
        
        .question-text {
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 20px;
            color: #333;
        }
        
        .options {
            display: grid;
            gap: 12px;
        }
        
        .option {
            display: flex;
            align-items: flex-start;
            padding: 14px 18px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .option:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }
        
        .option.selected {
            border-color: #667eea;
            background: #e8eaf6;
        }
        
        .option.correct {
            border-color: #4caf50;
            background: #e8f5e9;
        }
        
        .option.wrong {
            border-color: #f44336;
            background: #ffebee;
        }
        
        .option.disabled {
            pointer-events: none;
        }
        
        .option-letter {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 14px;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }
        
        .option.selected .option-letter {
            background: #667eea;
            color: white;
        }
        
        .option.correct .option-letter {
            background: #4caf50;
            color: white;
        }
        
        .option.wrong .option-letter {
            background: #f44336;
            color: white;
        }
        
        .option-content {
            flex: 1;
            font-size: 15px;
            line-height: 1.6;
            color: #333;
        }
        
        .question-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-top: 20px;
        }
        
        .btn {
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }
        
        .btn-secondary {
            background: #e0e0e0;
            color: #666;
        }
        
        .btn-secondary:hover {
            background: #bdbdbd;
        }
        
        .btn-success {
            background: #4caf50;
            color: white;
        }
        
        .btn-success:hover {
            background: #43a047;
        }
        
        .btn-danger {
            background: #f44336;
            color: white;
        }
        
        .btn-danger:hover {
            background: #d32f2f;
        }
        
        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        
        .score-display {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        
        .score-item {
            text-align: center;
        }
        
        .score-value {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }
        
        .score-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        
        .result-card {
            text-align: center;
            padding: 40px;
        }
        
        .result-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        .result-title {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }
        
        .result-score {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 30px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .empty-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .empty-text {
            font-size: 16px;
        }
        
        .upload-section {
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-section:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
            color: #667eea;
        }
        
        .upload-text {
            font-size: 16px;
            color: #666;
        }
        
        .upload-hint {
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }
        
        .textarea-container {
            margin-bottom: 20px;
        }
        
        .textarea-container textarea {
            width: 100%;
            height: 200px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            font-size: 14px;
            font-family: monospace;
            resize: vertical;
            transition: border-color 0.3s;
        }
        
        .textarea-container textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .textarea-container label {
            display: block;
            margin-bottom: 10px;
            font-weight: 500;
            color: #333;
        }
        
        .analysis-section {
            background: #fff3e0;
            border-left: 4px solid #ff9800;
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-top: 15px;
            display: none;
        }
        
        .analysis-section.active {
            display: block;
        }
        
        .analysis-title {
            font-weight: 600;
            color: #e65100;
            margin-bottom: 8px;
        }
        
        .analysis-content {
            color: #5d4037;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .auto-answer-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4caf50 0%, #43a047 100%);
            color: white;
            border: none;
            font-size: 24px;
            box-shadow: 0 4px 20px rgba(76, 175, 80, 0.4);
            cursor: pointer;
            transition: all 0.3s;
            z-index: 100;
        }
        
        .auto-answer-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(76, 175, 80, 0.5);
        }
        
        .auto-answer-btn:active {
            transform: scale(0.95);
        }
        
        .timer {
            display: inline-block;
            padding: 8px 20px;
            background: #fff3e0;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            color: #f57c00;
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        
        .modal-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
        }
        
        .modal-content {
            color: #666;
            margin-bottom: 25px;
        }
        
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .badge {
            display: inline-block;
            padding: 2px 8px;
            background: #e0e0e0;
            border-radius: 4px;
            font-size: 12px;
            color: #666;
            margin-left: 10px;
        }
        
        .badge.success { background: #e8f5e9; color: #388e3c; }
        .badge.error { background: #ffebee; color: #c62828; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 学习通自动答题系统</h1>
            <p>智能答题 · 错题收集 · 高效学习</p>
        </div>
        
        <div class="tabs">
            <div class="tab active" data-tab="exam">📝 在线答题</div>
            <div class="tab" data-tab="upload">📤 导入题目</div>
            <div class="tab" data-tab="wrong">❌ 错题集</div>
            <div class="tab" data-tab="result">📊 答题记录</div>
        </div>
        
        <div class="content active" id="exam">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div class="timer" id="timer">⏱ 00:00</div>
                <div style="color: #666; font-size: 14px;">
                    第 <span id="current-question">1</span> / <span id="total-questions">0</span> 题
                </div>
            </div>
            
            <div id="question-container"></div>
            
            <div class="question-actions">
                <button class="btn btn-secondary" id="prev-btn" disabled>上一题</button>
                <button class="btn btn-primary" id="next-btn">下一题</button>
                <button class="btn btn-success" id="submit-btn" style="display: none;">提交试卷</button>
            </div>
        </div>
        
        <div class="content" id="upload">
            <h2 style="margin-bottom: 20px; color: #333;">导入题目</h2>
            
            <div class="textarea-container">
                <label>题目文本格式：</label>
                <textarea id="question-input" placeholder="请按以下格式输入题目：

1. 单选题示例：
【单选题】下列选项中正确的是？
A. 选项A
B. 选项B
C. 选项C
D. 选项D
答案：A

2. 多选题示例：
【多选题】以下哪些是正确的？
A. 选项A
B. 选项B
C. 选项C
D. 选项D
答案：AB

3. 判断题示例：
【判断题】这句话是正确的。
答案：对/错"></textarea>
            </div>
            
            <button class="btn btn-primary" style="width: 100%; padding: 14px;" id="parse-btn">解析题目</button>
            
            <div style="margin-top: 20px; padding: 15px; background: #e8f5e9; border-radius: 8px; display: none;" id="parse-result">
                <div style="font-weight: 600; color: #388e3c; margin-bottom: 8px;">✓ 解析成功！</div>
                <div style="color: #666; font-size: 14px;" id="parse-count"></div>
            </div>
            
            <div style="margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 12px;">
                <h3 style="margin-bottom: 15px; color: #333;">📖 内置题库</h3>
                <div style="font-size: 14px; color: #666; line-height: 1.6;">
                    系统已内置 <span style="color: #667eea; font-weight: 600;" id="built-in-count">0</span> 道题目，涵盖多学科知识。
                </div>
                <button class="btn btn-secondary" style="margin-top: 15px;" id="load-builtin">加载内置题库</button>
            </div>
        </div>
        
        <div class="content" id="wrong">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="color: #333;">错题集</h2>
                <button class="btn btn-danger btn-sm" id="clear-wrong" style="display: none;">清空错题</button>
            </div>
            
            <div id="wrong-list">
                <div class="empty-state">
                    <div class="empty-icon">📝</div>
                    <div class="empty-text">暂无错题，答题错误的题目会自动收集到这里</div>
                </div>
            </div>
        </div>
        
        <div class="content" id="result">
            <h2 style="margin-bottom: 20px; color: #333;">答题记录</h2>
            
            <div id="result-list">
                <div class="empty-state">
                    <div class="empty-icon">📊</div>
                    <div class="empty-text">暂无答题记录</div>
                </div>
            </div>
        </div>
    </div>
    
    <button class="auto-answer-btn" title="自动答题" id="auto-answer-btn">⚡</button>
    
    <div class="modal-overlay" id="result-modal">
        <div class="modal">
            <div class="result-icon" id="result-icon">🎉</div>
            <div class="result-title" id="result-title">答题完成！</div>
            <div class="result-score" id="result-score">0</div>
            <div class="score-display" style="background: #f8f9fa; margin: 0 -30px; margin-bottom: 20px; border-radius: 0;">
                <div class="score-item">
                    <div class="score-value" id="correct-count">0</div>
                    <div class="score-label">正确</div>
                </div>
                <div class="score-item">
                    <div class="score-value" id="wrong-count">0</div>
                    <div class="score-label">错误</div>
                </div>
                <div class="score-item">
                    <div class="score-value" id="time-taken">0</div>
                    <div class="score-label">用时</div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="close-modal">关闭</button>
                <button class="btn btn-primary" id="review-btn">查看错题</button>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal">
            <div class="modal-title">确认提交？</div>
            <div class="modal-content">您确定要提交试卷吗？提交后将无法修改答案。</div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="cancel-submit">取消</button>
                <button class="btn btn-primary" id="confirm-submit">确认提交</button>
            </div>
        </div>
    </div>
    
    <script>
        const builtInQuestions = [
            {
                id: 1,
                type: 'single',
                typeName: '单选题',
                question: '在计算机中，1KB等于多少字节？',
                options: ['1000', '1024', '512', '2048'],
                answer: 'B',
                analysis: '计算机存储单位中，1KB = 1024字节，这是二进制计算方式。'
            },
            {
                id: 2,
                type: 'single',
                typeName: '单选题',
                question: '下列哪个是Python的关键字？',
                options: ['function', 'def', 'var', 'int'],
                answer: 'B',
                analysis: 'def是Python中定义函数的关键字，function是JavaScript的关键字。'
            },
            {
                id: 3,
                type: 'single',
                typeName: '单选题',
                question: 'HTTP协议默认使用的端口号是？',
                options: ['21', '22', '80', '443'],
                answer: 'C',
                analysis: 'HTTP默认端口是80，HTTPS默认端口是443，FTP是21，SSH是22。'
            },
            {
                id: 4,
                type: 'single',
                typeName: '单选题',
                question: '以下哪个不是操作系统？',
                options: ['Windows', 'Linux', 'Microsoft Office', 'macOS'],
                answer: 'C',
                analysis: 'Microsoft Office是办公软件套件，不是操作系统。'
            },
            {
                id: 5,
                type: 'single',
                typeName: '单选题',
                question: 'CPU的中文全称是什么？',
                options: ['中央处理器', '内存储器', '外存储器', '输入设备'],
                answer: 'A',
                analysis: 'CPU是Central Processing Unit的缩写，中文名为中央处理器。'
            },
            {
                id: 6,
                type: 'multiple',
                typeName: '多选题',
                question: '以下哪些是常见的数据库管理系统？',
                options: ['MySQL', 'Oracle', 'SQL Server', 'Excel'],
                answer: 'ABC',
                analysis: 'MySQL、Oracle、SQL Server都是数据库管理系统，Excel是电子表格软件。'
            },
            {
                id: 7,
                type: 'multiple',
                typeName: '多选题',
                question: '以下哪些是面向对象的编程语言？',
                options: ['Java', 'Python', 'C', 'C++'],
                answer: 'ABD',
                analysis: 'Java、Python、C++都是面向对象编程语言，C是面向过程的语言。'
            },
            {
                id: 8,
                type: 'multiple',
                typeName: '多选题',
                question: '以下哪些是Web前端技术？',
                options: ['HTML', 'CSS', 'JavaScript', 'PHP'],
                answer: 'ABC',
                analysis: 'HTML、CSS、JavaScript是前端三大核心技术，PHP是后端语言。'
            },
            {
                id: 9,
                type: 'judge',
                typeName: '判断题',
                question: 'Python是一种编译型语言。',
                options: ['对', '错'],
                answer: 'B',
                analysis: 'Python是解释型语言，不需要编译成机器码即可运行。'
            },
            {
                id: 10,
                type: 'judge',
                typeName: '判断题',
                question: 'TCP协议是面向连接的可靠传输协议。',
                options: ['对', '错'],
                answer: 'A',
                analysis: 'TCP（传输控制协议）是面向连接的，提供可靠的、有序的数据传输。'
            },
            {
                id: 11,
                type: 'judge',
                typeName: '判断题',
                question: 'HTML是一种编程语言。',
                options: ['对', '错'],
                answer: 'B',
                analysis: 'HTML是标记语言，不是编程语言，用于描述网页结构。'
            },
            {
                id: 12,
                type: 'single',
                typeName: '单选题',
                question: '在HTML中，以下哪个标签用于定义表格？',
                options: ['<table>', '<tr>', '<td>', '<th>'],
                answer: 'A',
                analysis: '<table>标签定义表格，<tr>定义行，<td>定义单元格，<th>定义表头。'
            },
            {
                id: 13,
                type: 'single',
                typeName: '单选题',
                question: 'CSS中，哪个属性用于设置元素的背景颜色？',
                options: ['color', 'background-color', 'bgcolor', 'background'],
                answer: 'B',
                analysis: 'background-color属性专门用于设置背景颜色，background是复合属性。'
            },
            {
                id: 14,
                type: 'multiple',
                typeName: '多选题',
                question: '以下哪些是JavaScript的数据类型？',
                options: ['string', 'number', 'boolean', 'array'],
                answer: 'ABC',
                analysis: 'string、number、boolean是JavaScript的基本数据类型，array是对象类型。'
            },
            {
                id: 15,
                type: 'single',
                typeName: '单选题',
                question: '以下哪个方法可以在数组末尾添加元素？',
                options: ['push()', 'pop()', 'shift()', 'unshift()'],
                answer: 'A',
                analysis: 'push()方法在数组末尾添加元素，pop()删除末尾元素，shift()删除开头元素，unshift()在开头添加。'
            }
        ];
        
        let questions = [];
        let currentIndex = 0;
        let userAnswers = {};
        let wrongQuestions = [];
        let examHistory = [];
        let timerInterval = null;
        let startTime = 0;
        
        function init() {
            loadWrongQuestions();
            loadExamHistory();
            updateBuiltInCount();
            bindEvents();
        }
        
        function bindEvents() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                    document.getElementById(this.dataset.tab).classList.add('active');
                    
                    if (this.dataset.tab === 'wrong') {
                        renderWrongList();
                    } else if (this.dataset.tab === 'result') {
                        renderResultList();
                    }
                });
            });
            
            document.getElementById('parse-btn').addEventListener('click', parseQuestions);
            document.getElementById('load-builtin').addEventListener('click', loadBuiltInQuestions);
            document.getElementById('prev-btn').addEventListener('click', prevQuestion);
            document.getElementById('next-btn').addEventListener('click', nextQuestion);
            document.getElementById('submit-btn').addEventListener('click', showConfirmModal);
            document.getElementById('auto-answer-btn').addEventListener('click', autoAnswer);
            document.getElementById('clear-wrong').addEventListener('click', clearWrongQuestions);
            document.getElementById('close-modal').addEventListener('click', closeModal);
            document.getElementById('review-btn').addEventListener('click', reviewWrong);
            document.getElementById('cancel-submit').addEventListener('click', closeConfirmModal);
            document.getElementById('confirm-submit').addEventListener('click', submitExam);
        }
        
        function updateBuiltInCount() {
            document.getElementById('built-in-count').textContent = builtInQuestions.length;
        }
        
        function loadBuiltInQuestions() {
            questions = JSON.parse(JSON.stringify(builtInQuestions));
            startExam();
            switchTab('exam');
        }
        
        function parseQuestions() {
            const input = document.getElementById('question-input').value.trim();
            if (!input) {
                alert('请输入题目内容');
                return;
            }
            
            const parsed = parseQuestionText(input);
            if (parsed.length > 0) {
                questions = parsed;
                document.getElementById('parse-result').style.display = 'block';
                document.getElementById('parse-count').textContent = `成功解析 ${parsed.length} 道题目，已准备就绪！`;
                setTimeout(() => {
                    startExam();
                    switchTab('exam');
                }, 1000);
            } else {
                alert('未能解析到题目，请检查格式是否正确');
            }
        }
        
        function parseQuestionText(text) {
            const result = [];
            const lines = text.split('\n').map(line => line.trim()).filter(line => line);
            
            let currentQuestion = null;
            let currentOptions = [];
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                
                if (line.startsWith('【单选题】')) {
                    if (currentQuestion) result.push(currentQuestion);
                    currentQuestion = {
                        id: result.length + 1,
                        type: 'single',
                        typeName: '单选题',
                        question: line.replace('【单选题】', ''),
                        options: [],
                        answer: '',
                        analysis: ''
                    };
                    currentOptions = [];
                } else if (line.startsWith('【多选题】')) {
                    if (currentQuestion) result.push(currentQuestion);
                    currentQuestion = {
                        id: result.length + 1,
                        type: 'multiple',
                        typeName: '多选题',
                        question: line.replace('【多选题】', ''),
                        options: [],
                        answer: '',
                        analysis: ''
                    };
                    currentOptions = [];
                } else if (line.startsWith('【判断题】')) {
                    if (currentQuestion) result.push(currentQuestion);
                    currentQuestion = {
                        id: result.length + 1,
                        type: 'judge',
                        typeName: '判断题',
                        question: line.replace('【判断题】', ''),
                        options: ['对', '错'],
                        answer: '',
                        analysis: ''
                    };
                    currentOptions = [];
                } else if (/^[A-D]、/.test(line) || /^[A-D]\./.test(line) || /^[A-D]\s/.test(line)) {
                    if (currentQuestion) {
                        const optionText = line.replace(/^[A-D][、.\s]/, '');
                        currentQuestion.options.push(optionText);
                    }
                } else if (line.startsWith('答案：')) {
                    if (currentQuestion) {
                        let answer = line.replace('答案：', '').trim();
                        if (answer === '对') answer = 'A';
                        if (answer === '错') answer = 'B';
                        currentQuestion.answer = answer.toUpperCase();
                    }
                } else if (line.startsWith('解析：') || line.startsWith('分析：')) {
                    if (currentQuestion) {
                        currentQuestion.analysis = line.replace(/^(解析|分析)：/, '').trim();
                    }
                }
            }
            
            if (currentQuestion) result.push(currentQuestion);
            return result;
        }
        
        function startExam() {
            currentIndex = 0;
            userAnswers = {};
            startTime = Date.now();
            startTimer();
            renderQuestion();
            updateProgress();
            document.getElementById('submit-btn').style.display = 'none';
            document.getElementById('next-btn').style.display = 'inline-block';
        }
        
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);
        }
        
        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            document.getElementById('timer').textContent = `⏱ ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
        
        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }
        
        function renderQuestion() {
            if (questions.length === 0) {
                document.getElementById('question-container').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📚</div>
                        <div class="empty-text">暂无题目，请先导入题目或加载内置题库</div>
                    </div>
                `;
                return;
            }
            
            const q = questions[currentIndex];
            const options = q.options.map((opt, idx) => {
                const letter = String.fromCharCode(65 + idx);
                const isSelected = userAnswers[q.id] && userAnswers[q.id].includes(letter);
                return `
                    <div class="option ${isSelected ? 'selected' : ''}" data-option="${letter}">
                        <div class="option-letter">${letter}</div>
                        <div class="option-content">${opt}</div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('question-container').innerHTML = `
                <div class="question-card">
                    <div class="question-header">
                        <span class="question-type type-${q.type}">${q.typeName}</span>
                        <span class="question-number">题目 ${currentIndex + 1}</span>
                    </div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">${options}</div>
                    <div class="analysis-section" id="analysis-${q.id}">
                        <div class="analysis-title">💡 解析</div>
                        <div class="analysis-content">${q.analysis || '暂无解析'}</div>
                    </div>
                </div>
            `;
            
            document.querySelectorAll('.option').forEach(opt => {
                opt.addEventListener('click', selectOption);
            });
            
            updateNavButtons();
        }
        
        function selectOption(e) {
            const option = e.currentTarget;
            const q = questions[currentIndex];
            const selectedLetter = option.dataset.option;
            
            if (q.type === 'single' || q.type === 'judge') {
                document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
                option.classList.add('selected');
                userAnswers[q.id] = selectedLetter;
            } else {
                if (option.classList.contains('selected')) {
                    option.classList.remove('selected');
                    const current = userAnswers[q.id] || '';
                    userAnswers[q.id] = current.replace(selectedLetter, '');
                } else {
                    option.classList.add('selected');
                    userAnswers[q.id] = (userAnswers[q.id] || '') + selectedLetter;
                }
            }
        }
        
        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
                updateProgress();
            }
        }
        
        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
                updateProgress();
            } else {
                showConfirmModal();
            }
        }
        
        function updateNavButtons() {
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            
            if (currentIndex === questions.length - 1) {
                document.getElementById('next-btn').style.display = 'none';
                document.getElementById('submit-btn').style.display = 'inline-block';
            } else {
                document.getElementById('next-btn').style.display = 'inline-block';
                document.getElementById('submit-btn').style.display = 'none';
            }
        }
        
        function updateProgress() {
            const progress = ((currentIndex + 1) / questions.length) * 100;
            document.getElementById('progress-fill').style.width = `${progress}%`;
            document.getElementById('current-question').textContent = currentIndex + 1;
            document.getElementById('total-questions').textContent = questions.length;
        }
        
        function showConfirmModal() {
            document.getElementById('confirm-modal').classList.add('active');
        }
        
        function closeConfirmModal() {
            document.getElementById('confirm-modal').classList.remove('active');
        }
        
        function submitExam() {
            closeConfirmModal();
            stopTimer();
            
            let correct = 0;
            let wrong = 0;
            const newWrong = [];
            
            questions.forEach(q => {
                const userAnswer = userAnswers[q.id] || '';
                if (userAnswer === q.answer) {
                    correct++;
                } else {
                    wrong++;
                    if (!wrongQuestions.find(w => w.id === q.id)) {
                        newWrong.push({
                            ...q,
                            userAnswer: userAnswer || '未作答',
                            timestamp: Date.now()
                        });
                    }
                }
            });
            
            wrongQuestions = [...wrongQuestions, ...newWrong];
            saveWrongQuestions();
            
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            const timeStr = minutes > 0 ? `${minutes}分${seconds}秒` : `${seconds}秒`;
            
            const record = {
                id: Date.now(),
                total: questions.length,
                correct,
                wrong,
                score: Math.round((correct / questions.length) * 100),
                time: timeStr,
                timestamp: Date.now()
            };
            
            examHistory.unshift(record);
            if (examHistory.length > 20) examHistory.pop();
            saveExamHistory();
            
            document.getElementById('correct-count').textContent = correct;
            document.getElementById('wrong-count').textContent = wrong;
            document.getElementById('time-taken').textContent = timeStr;
            document.getElementById('result-score').textContent = `${record.score}分`;
            document.getElementById('result-icon').textContent = record.score >= 60 ? '🎉' : '💪';
            document.getElementById('result-title').textContent = record.score >= 60 ? '答题完成！' : '继续加油！';
            document.getElementById('result-modal').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('result-modal').classList.remove('active');
        }
        
        function reviewWrong() {
            closeModal();
            switchTab('wrong');
        }
        
        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelector(`[data-tab="${tabId}"]`).classList.add('active');
            document.getElementById(tabId).classList.add('active');
            
            if (tabId === 'wrong') {
                renderWrongList();
            }
        }
        
        function autoAnswer() {
            if (questions.length === 0) {
                alert('暂无题目，请先导入题目');
                return;
            }
            
            questions.forEach(q => {
                userAnswers[q.id] = q.answer;
            });
            
            renderQuestion();
            updateProgress();
            alert('已自动填写所有答案！');
        }
        
        function saveWrongQuestions() {
            localStorage.setItem('wrongQuestions', JSON.stringify(wrongQuestions));
        }
        
        function loadWrongQuestions() {
            const saved = localStorage.getItem('wrongQuestions');
            if (saved) {
                wrongQuestions = JSON.parse(saved);
            }
        }
        
        function clearWrongQuestions() {
            if (confirm('确定要清空所有错题吗？')) {
                wrongQuestions = [];
                saveWrongQuestions();
                renderWrongList();
            }
        }
        
        function renderWrongList() {
            if (wrongQuestions.length === 0) {
                document.getElementById('wrong-list').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📝</div>
                        <div class="empty-text">暂无错题，答题错误的题目会自动收集到这里</div>
                    </div>
                `;
                document.getElementById('clear-wrong').style.display = 'none';
                return;
            }
            
            document.getElementById('clear-wrong').style.display = 'inline-block';
            
            const list = wrongQuestions.map(q => `
                <div class="question-card">
                    <div class="question-header">
                        <span class="question-type type-${q.type}">${q.typeName}</span>
                        <span class="badge error">答错</span>
                    </div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">
                        ${q.options.map((opt, idx) => {
                            const letter = String.fromCharCode(65 + idx);
                            const isCorrect = q.answer.includes(letter);
                            const isUserAnswer = q.userAnswer && q.userAnswer.includes(letter);
                            return `
                                <div class="option disabled ${isCorrect ? 'correct' : ''} ${isUserAnswer && !isCorrect ? 'wrong' : ''}">
                                    <div class="option-letter">${letter}</div>
                                    <div class="option-content">${opt}</div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                    <div style="margin-top: 15px; padding: 12px; background: #fff3e0; border-radius: 8px; font-size: 14px;">
                        <div style="color: #c62828; margin-bottom: 5px;">您的答案：${q.userAnswer || '未作答'}</div>
                        <div style="color: #388e3c;">正确答案：${q.answer}</div>
                    </div>
                    <div class="analysis-section active">
                        <div class="analysis-title">💡 解析</div>
                        <div class="analysis-content">${q.analysis || '暂无解析'}</div>
                    </div>
                </div>
            `).join('');
            
            document.getElementById('wrong-list').innerHTML = list;
        }
        
        function saveExamHistory() {
            localStorage.setItem('examHistory', JSON.stringify(examHistory));
        }
        
        function loadExamHistory() {
            const saved = localStorage.getItem('examHistory');
            if (saved) {
                examHistory = JSON.parse(saved);
            }
        }
        
        function renderResultList() {
            if (examHistory.length === 0) {
                document.getElementById('result-list').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📊</div>
                        <div class="empty-text">暂无答题记录</div>
                    </div>
                `;
                return;
            }
            
            const list = examHistory.map(record => {
                const date = new Date(record.timestamp);
                const dateStr = `${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${date.getMinutes().toString().padStart(2, '0')}`;
                const isPass = record.score >= 60;
                
                return `
                    <div class="question-card" style="border-left-color: ${isPass ? '#4caf50' : '#f44336'}">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                            <span style="font-weight: 600; color: #333;">${dateStr}</span>
                            <span class="badge ${isPass ? 'success' : 'error'}">${isPass ? '及格' : '未及格'}</span>
                        </div>
                        <div class="score-display" style="background: #fff; margin: 0;">
                            <div class="score-item">
                                <div class="score-value" style="font-size: 28px;">${record.score}</div>
                                <div class="score-label">得分</div>
                            </div>
                            <div class="score-item">
                                <div class="score-value" style="font-size: 28px; color: #4caf50;">${record.correct}</div>
                                <div class="score-label">正确</div>
                            </div>
                            <div class="score-item">
                                <div class="score-value" style="font-size: 28px; color: #f44336;">${record.wrong}</div>
                                <div class="score-label">错误</div>
                            </div>
                            <div class="score-item">
                                <div class="score-value" style="font-size: 28px; color: #666;">${record.time}</div>
                                <div class="score-label">用时</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('result-list').innerHTML = list;
        }
        
        init();
    </script>
</body>
</html>
