<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadFlow - 网页文本结构化卡片生成器</title>

  <!-- Tailwind CSS v3 CDN -->
  <script src="https://cdn.tailwindcss.com">
  </script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js">
  </script>

  <!-- Tailwind 自定义配置 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
              950: '#1e1b4b',
            },
            surface: {
              50: '#f8fafc',
              100: '#f1f5f9',
              200: '#e2e8f0',
              300: '#cbd5e1',
              400: '#94a3b8',
              500: '#64748b',
              600: '#475569',
              700: '#334155',
              800: '#1e293b',
              900: '#0f172a',
              950: '#020617',
            }
          },
          fontFamily: {
            sans: ['"Inter"', '"Noto Sans SC"', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', '"Fira Code"', 'monospace'],
          },
          animation: {
            'fade-in': 'fadeIn 0.4s ease-out',
            'slide-up': 'slideUp 0.5s ease-out',
            'slide-right': 'slideRight 0.4s ease-out',
            'pulse-glow': 'pulseGlow 2s ease-in-out infinite',
            'float': 'float 3s ease-in-out infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(8px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(24px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            slideRight: {
              '0%': { opacity: '0', transform: 'translateX(-16px)' },
              '100%': { opacity: '1', transform: 'translateX(0)' },
            },
            pulseGlow: {
              '0%, 100%': { boxShadow: '0 0 8px rgba(99, 102, 241, 0.3)' },
              '50%': { boxShadow: '0 0 20px rgba(99, 102, 241, 0.6)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-6px)' },
            },
          }
        }
      }
    }
  </script>

  <!-- 自定义 CSS：3D 翻牌 & 全局样式 -->
  <style>
    /* ========== 全局基础 ========== */
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 背景装饰 */
    .bg-grid {
      background-image:
        linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* ========== 滚动条美化 ========== */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.3);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.5); }

    /* ========== 3D 翻牌核心 ========== */
    .card-scene {
      perspective: 1200px;
      width: 100%;
      max-width: 440px;
      height: 300px;
      margin: 0 auto;
    }

    .card-body {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      cursor: pointer;
    }

    .card-body.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow-y: auto;
    }

    .card-front {
      background: linear-gradient(135deg, #1e293b 0%, #1a1f3a 100%);
      border: 1px solid rgba(99, 102, 241, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(99, 102, 241, 0.1) inset;
    }

    .card-back {
      background: linear-gradient(135deg, #1a1f3a 0%, #1e1b4b 100%);
      border: 1px solid rgba(129, 140, 248, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(129, 140, 248, 0.15) inset;
      transform: rotateY(180deg);
    }

    /* 卡片悬停微动 */
    .card-scene:hover .card-body:not(.flipped) {
      transform: translateY(-4px);
    }
    .card-scene:hover .card-body.flipped {
      transform: rotateY(180deg) translateY(-4px);
    }

    .card-body:not(.flipped) {
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
    }

    /* 卡片光晕 */
    .card-front::before, .card-back::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 50%);
      pointer-events: none;
    }

    /* ========== 评价按钮动效 ========== */
    .eval-btn {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    .eval-btn:hover {
      transform: translateY(-2px) scale(1.03);
    }
    .eval-btn:active {
      transform: translateY(0) scale(0.97);
    }
    .eval-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255,255,255,0.15) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .eval-btn:hover::after { opacity: 1; }

    /* ========== 按钮通用动效 ========== */
    .btn-hover {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-hover:hover {
      transform: translateY(-1px) scale(1.02);
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
    }
    .btn-hover:active {
      transform: translateY(0) scale(0.97);
    }

    /* ========== 大纲树 ========== */
    .outline-item {
      transition: all 0.2s ease;
      cursor: pointer;
      border-left: 2px solid transparent;
      padding: 8px 12px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 2px;
    }
    .outline-item:hover {
      background: rgba(99, 102, 241, 0.08);
      border-left-color: rgba(99, 102, 241, 0.4);
    }
    .outline-item.active {
      background: rgba(99, 102, 241, 0.15);
      border-left-color: #818cf8;
      color: #c7d2fe;
    }

    /* ========== 进度条 ========== */
    .progress-bar {
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ========== Toast 提示 ========== */
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      z-index: 9999;
      animation: slideInToast 0.35s ease-out;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      pointer-events: none;
    }
    @keyframes slideInToast {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .toast-success { background: #065f46; color: #a7f3d0; border: 1px solid #059669; }
    .toast-info { background: #1e3a5f; color: #bfdbfe; border: 1px solid #3b82f6; }

    /* ========== Textarea 样式 ========== */
    textarea::placeholder { color: #64748b; }
    textarea:focus { outline: none; }

    /* ========== 标签徽章动画 ========== */
    .status-badge {
      transition: all 0.3s ease;
    }
  </style>
</head>
<body class="bg-grid">

  <!-- ==================== 顶部导航栏 ==================== -->

  <!-- ==================== 主体：左右分栏 ==================== -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6">
    <div class="flex flex-col lg:flex-row gap-6 min-h-[calc(100vh-140px)]">

      <!-- ====== 左侧栏：内容解析区 ====== -->

支持中文、英文混合文本，系统将自动分段并生成记忆卡片。

  <!-- ==================== Toast 容器 ==================== -->
  <div id="toastContainer"></div>

  <!-- ==================== 核心 JavaScript ==================== -->
  <script>
    (function() {
      'use strict';

      // ============================================================
      //  模块 0：工具函数
      // ============================================================
      const $ = (sel) => document.querySelector(sel);
      const $$ = (sel) => document.querySelectorAll(sel);

      /** 显示 Toast 提示 */
      function showToast(message, type = 'info') {
        const container = $('#toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transition = 'opacity 0.3s ease';
          setTimeout(() => toast.remove(), 300);
        }, 2000);
      }

      /** 下载文件（UTF-8 编码） */
      function downloadFile(filename, content, mimeType = 'text/plain') {
        const blob = new Blob(['\uFEFF' + content], { type: `${mimeType};charset=utf-8` });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      // ============================================================
      //  模块 1：模拟数据集 (Mock Data)
      // ============================================================
      const MOCK_DATA = [
        {
          title: '什么是 JavaScript 闭包？',
          content: '闭包（Closure）是指函数能够记住并访问其词法作用域，即使该函数在其词法作用域之外执行。闭包是 JavaScript 中最重要的概念之一，它使得数据私有化、函数工厂、模块模式等高级编程模式成为可能。核心原理是：当一个函数被创建时，它会保留对其外部作用域中变量的引用。'
        },
        {
          title: 'RESTful API 设计核心原则',
          content: 'RESTful API 设计遵循六大核心原则：统一接口（Uniform Interface）、无状态（Statelessness）、可缓存（Cacheable）、分层系统（Layered System）、按需代码（Code on Demand，可选）、客户端-服务器分离（Client-Server Separation）。资源使用名词复数形式命名，操作通过 HTTP 方法（GET/POST/PUT/DELETE）表示，状态码（200/201/400/404/500）准确传达结果。'
        },
        {
          title: 'CSS Grid 与 Flexbox 的区别',
          content: 'CSS Grid 是二维布局系统，同时控制行和列，适合页面级整体布局；Flexbox 是一维布局系统，沿主轴或交叉轴单方向排列，适合组件内部的对齐和分布。Grid 使用 grid-template-columns/rows 定义网格轨道，Flexbox 使用 flex-direction 控制排列方向。实际开发中两者常组合使用：Grid 做页面骨架，Flexbox 做局部组件排列。'
        },
        {
          title: '什么是深度学习中的反向传播？',

      // ============================================================
      //  模块 2：文本解析器（模拟 AI 智能解析）
      // ============================================================
      const Parser = {
        /**
         * 解析文本为卡片数组
         * @param {string} rawText - 原始文本
         * @returns {Array<{title: string, content: string}>}
         */
        parse(rawText) {
          const text = rawText.trim();
          if (!text) return [];

          // 按双换行或单换行分段
          let paragraphs = text
            .split(/\n{2,}/)
            .map(p => p.replace(/\n/g, ' ').trim())
            .filter(p => p.length > 5); // 过滤过短段落

          // 如果段落太少，尝试按单换行再分
          if (paragraphs.length < 2) {
            paragraphs = text
              .split(/\n/)
              .map(p => p.trim())
              .filter(p => p.length > 5);
          }

          // 如果仍然太少，按句号分句
          if (paragraphs.length < 2) {
            paragraphs = text
              .split(/[。！？.!?]/)
              .map(p => p.trim())
              .filter(p => p.length > 3);
          }

          // 转换为卡片格式：前20字作为标题（问题），整段作为内容（答案）
          return paragraphs.map((para, index) => {
            let title = '';
            // 尝试提取第一句话作为标题
            const firstSentence = para.match(/^(.{10,25})[，,。！？.!?\s]/);
            if (firstSentence) {
              title = firstSentence[1].trim();
            } else {
              title = para.length > 25 ? para.substring(0, 20) + '...' : para;
            }
            return {
              id: `card-${index}`,
              title: title,
              content: para,
              status: 'pending', // pending | easy | fuzzy | hard
            };
          });
        },

        /**
         * 从卡片数组生成大纲树结构
         * @param {Array} cards
         * @returns {Array} 大纲节点
         */
        generateOutline(cards) {
          return cards.map((card, index) => ({
            id: card.id,
            index: index,
            title: card.title,
            level: 1,
            status: card.status,
          }));
        },
      };

      // ============================================================
      //  模块 3：ReadFlow 主应用
      // ============================================================
      class ReadFlowApp {
        constructor() {
          this.cards = [];
          this.currentIndex = 0;
          this.isFlipped = false;

          this.initDOM();
          this.bindEvents();
          this.renderIcons();
        }

        // ---- DOM 引用 ----
        initDOM() {
          this.els = {
            textInput: $('#textInput'),
            btnParse: $('#btnParse'),
            inputArea: $('#inputArea'),
            outlineArea: $('#outlineArea'),
            outlineTree: $('#outlineTree'),
            cardCount: $('#cardCount'),
            emptyState: $('#emptyState'),
            cardContent: $('#cardContent'),
            cardScene: $('#cardScene'),
            cardBody: $('#cardBody'),
            cardFrontText: $('#cardFrontText'),
            cardBackText: $('#cardBackText'),
            progressText: $('#progressText'),
            progressFill: $('#progressFill'),
            completionLabel: $('#completionLabel'),
            cardIndicator: $('#cardIndicator'),
            btnPrevCard: $('#btnPrevCard'),
            btnNextCard: $('#btnNextCard'),
            statEasy: $('#statEasy'),
            statFuzzy: $('#statFuzzy'),
            statHard: $('#statHard'),
            statRemaining: $('#statRemaining'),
            btnClear: $('#btnClear'),
            btnExport: $('#btnExport'),
            exportMenu: $('#exportMenu'),
          };
        }

        // ---- 事件绑定 ----
        bindEvents() {
          // 解析按钮
          this.els.btnParse.addEventListener('click', () => this.handleParse());

          // 卡片点击翻转
          this.els.cardBody.addEventListener('click', () => this.toggleCard());

          // 导航按钮
          this.els.btnPrevCard.addEventListener('click', () => this.navigateTo(this.currentIndex - 1));
          this.els.btnNextCard.addEventListener('click', () => this.navigateTo(this.currentIndex + 1));

          // 评价按钮
          $$('.eval-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
              e.stopPropagation();
              const evalType = btn.dataset.eval;
              this.evaluateCard(evalType);
            });
          });

          // 清空按钮
          this.els.btnClear.addEventListener('click', () => this.handleClear());

          // 导出按钮
          this.els.btnExport.addEventListener('click', (e) => {
            e.stopPropagation();
            this.els.exportMenu.classList.toggle('hidden');
          });
          document.addEventListener('click', (e) => {
            if (!e.target.closest('#exportDropdown')) {
              this.els.exportMenu.classList.add('hidden');
            }
          });
          $$('#exportMenu button[data-export]').forEach(btn => {
            btn.addEventListener('click', () => {
              const type = btn.dataset.export;
              if (type === 'html') this.exportHTML();
              if (type === 'markdown') this.exportMarkdown();
              this.els.exportMenu.classList.add('hidden');
            });
          });

          // 键盘快捷键
          document.addEventListener('keydown', (e) => {
            if (this.cards.length === 0) return;
            // 如果焦点在输入框内，不触发快捷键
            if (document.activeElement === this.els.textInput) return;

            switch (e.key) {
              case 'ArrowLeft':
                e.preventDefault();
                this.navigateTo(this.currentIndex - 1);
                break;
              case 'ArrowRight':
                e.preventDefault();
                this.navigateTo(this.currentIndex + 1);
                break;
              case ' ':
                e.preventDefault();
                this.toggleCard();
                break;
              case '1':
                e.preventDefault();
                this.evaluateCard('easy');
                break;
              case '2':
                e.preventDefault();
                this.evaluateCard('fuzzy');
                break;
              case '3':
                e.preventDefault();
                this.evaluateCard('hard');
                break;
            }
          });
        }

        // ---- 渲染 Lucide 图标 ----
        renderIcons() {
          if (typeof lucide !== 'undefined') {
            lucide.createIcons();
          }
        }

        // ---- 核心：解析文本 ----
        handleParse() {
          let rawText = this.els.textInput.value.trim();

          // 如果为空，加载模拟数据
          if (!rawText) {
            rawText = MOCK_DATA.map(item => `${item.title}\n${item.content}`).join('\n\n');
            this.els.textInput.value = rawText;
            showToast('已加载示例数据，共 ' + MOCK_DATA.length + ' 条卡片', 'info');
          }

          // 解析文本
          this.cards = Parser.parse(rawText);
          if (this.cards.length === 0) {
            showToast('未能解析出有效内容，请检查文本格式', 'info');
            return;
          }

          this.currentIndex = 0;
          this.isFlipped = false;

          // 切换界面状态
          this.els.inputArea.classList.add('hidden');
          this.els.outlineArea.classList.remove('hidden');
          this.els.emptyState.classList.add('hidden');
          this.els.cardContent.classList.remove('hidden');

          // 渲染大纲和卡片
          this.renderOutline();
          this.renderCard();
          this.updateStats();

          showToast(`成功解析 ${this.cards.length} 张记忆卡片`, 'success');
        }

        // ---- 渲染大纲树 ----
        renderOutline() {
          const outline = Parser.generateOutline(this.cards);
          this.els.cardCount.textContent = `共 ${outline.length} 张卡片`;

          let html = '';
          outline.forEach((node) => {
            const statusIcon = {
              easy: '<span class="text-emerald-400">●</span>',
              fuzzy: '<span class="text-amber-400">●</span>',
              hard: '<span class="text-red-400">●</span>',
              pending: '<span class="text-surface-600">○</span>',
            }[node.status] || '<span class="text-surface-600">○</span>';

            html += `
              <div class="outline-item flex items-center gap-2.5 ${node.index === this.currentIndex ? 'active' : ''}"
                   data-card-index="${node.index}">
                <span class="text-xs flex-shrink-0">${statusIcon}</span>
                <span class="text-sm text-surface-300 truncate flex-1">${this.escapeHTML(node.title)}</span>
                <span class="text-xs text-surface-600 font-mono flex-shrink-0">#${node.index + 1}</span>
              </div>
            `;
          });

          this.els.outlineTree.innerHTML = html;

          // 大纲节点点击事件
          this.els.outlineTree.querySelectorAll('.outline-item').forEach(item => {
            item.addEventListener('click', () => {
              const index = parseInt(item.dataset.cardIndex, 10);
              this.navigateTo(index);
            });
          });
        }

        // ---- 渲染当前卡片 ----
        renderCard() {
          if (this.cards.length === 0) return;
          const card = this.cards[this.currentIndex];
          if (!card) return;

          // 重置翻转状态
          this.isFlipped = false;
          this.els.cardBody.classList.remove('flipped');

          // 更新文本
          this.els.cardFrontText.textContent = card.title;
          this.els.cardBackText.textContent = card.content;

          // 触发重排后更新翻转（确保动画重置）
          void this.els.cardBody.offsetWidth;

          // 更新进度
          this.els.progressText.textContent = `${this.currentIndex + 1} / ${this.cards.length}`;
          this.els.cardIndicator.textContent = `${this.currentIndex + 1} / ${this.cards.length}`;
          const progress = ((this.currentIndex + 1) / this.cards.length) * 100;
          this.els.progressFill.style.width = progress + '%';

          // 完成度标签
          const reviewed = this.cards.filter(c => c.status !== 'pending').length;
          if (reviewed === this.cards.length) {
            this.els.completionLabel.textContent = '全部完成 ';
          } else if (reviewed > 0) {
            this.els.completionLabel.textContent = `已复习 ${reviewed} 张`;
          } else {
            this.els.completionLabel.textContent = '';
          }

          // 导航按钮状态
          this.els.btnPrevCard.disabled = this.currentIndex <= 0;
          this.els.btnNextCard.disabled = this.currentIndex >= this.cards.length - 1;

          // 更新大纲高亮
          this.updateOutlineHighlight();
        }

        // ---- 卡片翻转 ----
        toggleCard() {
          if (this.cards.length === 0) return;
          this.isFlipped = !this.isFlipped;
          this.els.cardBody.classList.toggle('flipped', this.isFlipped);
        }

        // ---- 导航到指定卡片 ----
        navigateTo(index) {
          if (index < 0 || index >= this.cards.length) return;
          this.currentIndex = index;
          this.renderCard();
        }

        // ---- 评价卡片 ----
        evaluateCard(type) {
          if (this.cards.length === 0) return;
          const card = this.cards[this.currentIndex];
          card.status = type;
          this.updateStats();

          // 自动跳到下一张
          if (this.currentIndex < this.cards.length - 1) {
            // 添加短暂延迟，让用户看到评价反馈
            setTimeout(() => {
              this.navigateTo(this.currentIndex + 1);
            }, 150);
          } else {
            // 最后一张，更新显示
            this.renderCard();
            this.renderOutline();
            showToast('全部卡片已复习完毕！', 'success');
          }

          // 更新大纲
          this.renderOutline();
        }

        // ---- 更新复习统计 ----
        updateStats() {
          const stats = { easy: 0, fuzzy: 0, hard: 0, pending: 0 };
          this.cards.forEach(c => {
            if (stats.hasOwnProperty(c.status)) stats[c.status]++;
            else stats.pending++;
          });

          this.els.statEasy.textContent = stats.easy;
          this.els.statFuzzy.textContent = stats.fuzzy;
          this.els.statHard.textContent = stats.hard;
          this.els.statRemaining.textContent = `剩余 ${stats.pending}`;
        }

        // ---- 更新大纲高亮 ----
        updateOutlineHighlight() {
          const items = this.els.outlineTree.querySelectorAll('.outline-item');
          items.forEach((item, i) => {
            item.classList.toggle('active', i === this.currentIndex);
          });
        }

        // ---- 清空 ----
        handleClear() {
          this.cards = [];
          this.currentIndex = 0;
          this.isFlipped = false;

          this.els.textInput.value = '';
          this.els.inputArea.classList.remove('hidden');
          this.els.outlineArea.classList.add('hidden');
          this.els.emptyState.classList.remove('hidden');
          this.els.cardContent.classList.add('hidden');

          showToast('已清空所有内容', 'info');
        }

        // ---- 导出为 HTML ----
        exportHTML() {
          if (this.cards.length === 0) {
            showToast('暂无卡片数据可导出', 'info');
            return;
          }

          const cardHTML = this.cards.map((card, i) => {
            const statusLabel = {
              easy: '已掌握',
              fuzzy: '有点模糊',
              hard: '需要复习',
              pending: '未复习',
            }[card.status] || '未复习';

            const statusColor = {
              easy: '#10b981',
              fuzzy: '#f59e0b',
              hard: '#ef4444',
              pending: '#64748b',
            }[card.status] || '#64748b';

            return `
            <div class="card" style="
              background: #1e293b;
              border: 1px solid #334155;
              border-radius: 16px;
              padding: 24px;
              margin-bottom: 16px;
              break-inside: avoid;
            ">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                <span style="font-size:12px;color:#818cf8;">卡片 #${i + 1}</span>
                <span style="font-size:12px;color:${statusColor};background:${statusColor}22;padding:2px 10px;border-radius:12px;">${statusLabel}</span>
              </div>
              <h3 style="color:#e2e8f0;font-size:16px;margin-bottom:8px;font-weight:600;">${this.escapeHTML(card.title)}</h3>
              <p style="color:#94a3b8;font-size:14px;line-height:1.7;">${this.escapeHTML(card.content)}</p>
            </div>`;
          }).join('\n');

          const html = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadFlow - 记忆卡片</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 40px 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { text-align: center; font-size: 24px; margin-bottom: 8px; color: #f1f5f9; }
    .subtitle { text-align: center; font-size: 14px; color: #64748b; margin-bottom: 32px; }
  </style>
</head>
<body>
  <h1>ReadFlow 记忆卡片</h1>
  <p class="subtitle">共 ${this.cards.length} 张卡片 · 导出时间：${new Date().toLocaleString('zh-CN')}</p>
  ${cardHTML}
</body>
</html>`;

          downloadFile('ReadFlow-记忆卡片.html', html, 'text/html');
          showToast('HTML 文件已导出', 'success');
        }

        // ---- 导出为 Markdown ----
        exportMarkdown() {
          if (this.cards.length === 0) {
            showToast('暂无卡片数据可导出', 'info');
            return;
          }

          const now = new Date().toLocaleString('zh-CN');
          let md = `# ReadFlow 记忆卡片\n\n`;
          md += `> 共 **${this.cards.length}** 张卡片 | 导出时间：${now}\n\n`;
          md += `---\n\n`;

          // 大纲
          md += `## 目录\n\n`;
          this.cards.forEach((card, i) => {
            md += `${i + 1}. [${card.title}](#card-${i + 1})\n`;
          });
          md += `\n---\n\n`;

          // 卡片内容
          this.cards.forEach((card, i) => {
            const statusLabel = {
              easy: '已掌握',
              fuzzy: '有点模糊',
              hard: '需要复习',
              pending: '未复习',
            }[card.status] || '未复习';

            md += `## <a id="card-${i + 1}"></a>卡片 ${i + 1}：${card.title}\n\n`;
            md += `**状态：** ${statusLabel}\n\n`;
            md += `**问题 / 核心概念：**\n\n> ${card.title}\n\n`;
            md += `**详细解释 / 答案：**\n\n${card.content}\n\n`;
            md += `---\n\n`;
          });

          downloadFile('ReadFlow-记忆卡片.md', md, 'text/markdown');
          showToast('Markdown 文件已导出', 'success');
        }

        // ---- HTML 转义 ----
        escapeHTML(str) {
          const div = document.createElement('div');
          div.textContent = str;
          return div.innerHTML;
        }
      }

      // ============================================================
      //  启动应用
      // ============================================================
      document.addEventListener('DOMContentLoaded', () => {
        window.readFlowApp = new ReadFlowApp();
      });

    })();
  </script>
</body>
</html>
