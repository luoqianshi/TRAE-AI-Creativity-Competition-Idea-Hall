                {

                {

                    date: "2022-04-10"
                }
            ]
        };

        // ==================== 第二部分：AI匹配逻辑 ====================
        
        // 关键词权重配置
        const keywordWeights = {
            budget: {
                keywords: ["预算", "价格", "租金", "便宜", "实惠", "元", "块", "钱"],
                weight: 3
            },
            nearSubway: {
                keywords: ["地铁", "地铁口", "地铁站", "近地铁", "离地铁近", "通勤方便"],
                weight: 2
            },
            quiet: {
                keywords: ["安静", "隔音好", "不吵", "无噪音", "静谧", "宁静"],
                weight: 2
            },
            petFriendly: {
                keywords: ["养宠", "宠物", "猫", "狗", "养猫", "养狗", "可养宠"],
                weight: 2
            },
            goodLight: {
                keywords: ["采光", "阳光", "亮堂", "明亮", "采光好", "阳光好"],
                weight: 2
            },
            appliances: {
                keywords: ["家电", "空调", "洗衣机", "冰箱", "热水器", "家电齐全", "家电新"],
                weight: 1
            }
        };

        // 解析用户自然语言需求
        function parseUserNeeds(input) {
            const needs = {
                budget: null,
                nearSubway: false,
                quiet: false,
                petFriendly: false,
                goodLight: false,
                appliances: []
            };

            // 提取预算
            const budgetMatch = input.match(/(\d+)(?:元|块|钱)?(?:左右|以内|以下)?/);
            if (budgetMatch) {
                needs.budget = parseInt(budgetMatch[1]);
            }

            // 检查其他需求关键词
            if (keywordWeights.nearSubway.keywords.some(kw => input.includes(kw))) {
                needs.nearSubway = true;
            }
            if (keywordWeights.quiet.keywords.some(kw => input.includes(kw))) {
                needs.quiet = true;
            }
            if (keywordWeights.petFriendly.keywords.some(kw => input.includes(kw))) {
                needs.petFriendly = true;
            }
            if (keywordWeights.goodLight.keywords.some(kw => input.includes(kw))) {
                needs.goodLight = true;
            }

            // 提取家电需求
            const applianceKeywords = ["空调", "洗衣机", "冰箱", "热水器", "电视", "微波炉", "烤箱"];
            applianceKeywords.forEach(app => {
                if (input.includes(app)) {
                    needs.appliances.push(app);
                }
            });

            return needs;
        }

        // 计算房源匹配分数
        function calculateMatchScore(house, needs) {
            let score = 60; // 基础分
            let matchDetails = [];

            // 预算匹配（最重要）
            if (needs.budget) {
                const budgetDiff = Math.abs(house.rent - needs.budget);
                if (budgetDiff <= 200) {
                    score += 20;
                    matchDetails.push("预算完美匹配");
                } else if (budgetDiff <= 500) {
                    score += 15;
                    matchDetails.push("预算接近");
                } else if (budgetDiff <= 1000) {
                    score += 10;
                    matchDetails.push("预算略高");
                } else if (house.rent < needs.budget) {
                    score += 15;
                    matchDetails.push("低于预算");
                }
            }

            // 地铁需求
            if (needs.nearSubway && house.features.nearSubway) {
                score += 10;
                matchDetails.push("近地铁");
            }

            // 安静需求
            if (needs.quiet && house.features.quiet) {
                score += 8;
                matchDetails.push("环境安静");
            }

            // 养宠需求
            if (needs.petFriendly && house.features.petFriendly) {
                score += 8;
                matchDetails.push("可养宠");
            }

            // 采光需求
            if (needs.goodLight && house.features.goodLight) {
                score += 8;
                matchDetails.push("采光好");
            }

            // 家电匹配
            if (needs.appliances.length > 0) {
                const matchedAppliances = needs.appliances.filter(app => 
                    house.features.appliances.includes(app)
                );
                if (matchedAppliances.length > 0) {
                    score += matchedAppliances.length * 3;
                    matchDetails.push(`家电匹配: ${matchedAppliances.join("、")}`);
                }
            }

            return {
                score: Math.min(score, 100),
                details: matchDetails
            };
        }

        // AI匹配房源主函数
        function matchHouses(userInput) {
            const needs = parseUserNeeds(userInput);
            const results = [];

            housesData.forEach(house => {
                const matchResult = calculateMatchScore(house, needs);
                if (matchResult.score >= 60) {
                    results.push({
                        ...house,
                        matchScore: matchResult.score,
                        matchDetails: matchResult.details
                    });
                }
            });

            // 按匹配分数排序
            results.sort((a, b) => b.matchScore - a.matchScore);

            return results.slice(0, 6); // 返回前6个匹配结果
        }

        // ==================== 第三部分：溯源分析逻辑 ====================
        
        // 情感分析关键词
        const sentimentKeywords = {
            negative: ["漏水", "渗水", "吵", "噪音", "老化", "旧", "坏", "差", "难", "慢", "遗憾", "慎选", "不推荐", "隔音差", "扯皮", "故障", "小", "远", "贵"],
            positive: ["好", "棒", "满意", "推荐", "新", "干净", "安静", "方便", "nice", "舒适", "宽敞", "明亮", "齐全", "快"]
        };

        // 分析评价情感倾向
        function analyzeSentiment(text) {
            let negativeCount = 0;
            let positiveCount = 0;

            sentimentKeywords.negative.forEach(kw => {
                if (text.includes(kw)) negativeCount++;
            });

            sentimentKeywords.positive.forEach(kw => {
                if (text.includes(kw)) positiveCount++;
            });

            if (negativeCount > positiveCount) return "negative";
            if (positiveCount > negativeCount) return "positive";
            return "neutral";
        }

        // 提取风险点
        function extractRisks(reviews) {
            const risks = [];
            const riskKeywords = {
                "漏水/渗水": ["漏水", "渗水", "水管", "卫生间漏水"],
                "噪音问题": ["吵", "噪音", "隔音差", "听到", "声音"],
                "家电老化": ["老化", "旧", "坏", "故障", "制冷效果"],
                "房东沟通": ["难沟通", "扯皮", "态度", "响应慢", "处理慢"],
                "采光不足": ["采光差", "暗", "白天开灯", "光线"],
                "空间狭小": ["小", "拥挤", "空间小"]
            };

            reviews.forEach(review => {
                Object.keys(riskKeywords).forEach(risk => {
                    if (riskKeywords[risk].some(kw => review.content.includes(kw))) {
                        if (!risks.includes(risk)) {
                            risks.push(risk);
                        }
                    }
                });
            });

            return risks;
        }

        // 提取优势点
        function extractAdvantages(reviews) {
            const advantages = [];
            const advantageKeywords = {
                "采光好": ["采光好", "亮堂", "明亮", "阳光"],
                "交通便利": ["地铁近", "地铁", "通勤方便", "交通方便"],
                "环境安静": ["安静", "隔音好", "无噪音"],
                "家电齐全": ["家电齐全", "家电新", "家电"],
                "房东nice": ["房东好", "nice", "态度好", "响应快"],
                "可养宠物": ["养宠", "养猫", "养狗", "宠物"]
            };

            reviews.forEach(review => {
                Object.keys(advantageKeywords).forEach(adv => {
                    if (advantageKeywords[adv].some(kw => review.content.includes(kw))) {
                        if (!advantages.includes(adv)) {
                            advantages.push(adv);
                        }
                    }
                });
            });

            return advantages;
        }

        // 生成房源溯源报告
        function generateTraceReport(houseId) {
            const house = housesData.find(h => h.id === houseId);
            if (!house) return null;

            const reviews = reviewsData[houseId] || [];
            const risks = extractRisks(reviews);
            const advantages = extractAdvantages(reviews);

            // 计算平均评分
            const avgRating = reviews.length > 0 
                ? (reviews.reduce((sum, r) => sum + r.rating, 0) / reviews.length).toFixed(1)
                : 0;

            return {
                house: house,
                reviews: reviews,
                risks: risks,
                advantages: advantages,
                avgRating: avgRating,
                totalReviews: reviews.length
            };
        }

        // ==================== 第四部分：页面渲染函数 ====================
        
        // 渲染房源卡片
        function renderHouseCard(house) {
            const scoreColor = house.matchScore >= 80 ? "green" : 
                              house.matchScore >= 70 ? "blue" : "yellow";
            
            return `
                <div class="bg-white rounded-lg card-shadow p-4 hover:shadow-lg transition-shadow">
                    <div class="flex justify-between items-start mb-3">
                        <h4 class="font-bold text-gray-800">${house.title}</h4>
                        <span class="bg-${scoreColor}-100 text-${scoreColor}-800 text-xs px-2 py-1 rounded-full font-medium">
                            匹配度 ${house.matchScore}%
                        </span>
                    </div>
                    <div class="space-y-2 text-sm text-gray-600">
                        <div class="flex items-center">
                            <span class="text-lg mr-2">💰</span>
                            <span class="font-medium text-red-500">¥${house.rent}/月</span>
                        </div>
                        <div class="flex items-center">
                            <span class="text-lg mr-2">📍</span>
                            <span>${house.area}</span>
                        </div>
                        <div class="flex items-center">
                            <span class="text-lg mr-2">🏠</span>
                            <span>${house.layout} · ${house.size}</span>
                        </div>
                        <div class="flex flex-wrap gap-1 mt-2">
                            ${house.tags.map(tag => `
                                <span class="bg-blue-50 text-blue-600 text-xs px-2 py-1 rounded">${tag}</span>
                            `).join('')}
                        </div>
                        ${house.matchDetails.length > 0 ? `
                            <div class="mt-3 pt-3 border-t border-gray-200">
                                <p class="text-xs text-gray-500 mb-1">匹配亮点：</p>
                                <div class="flex flex-wrap gap-1">
                                    ${house.matchDetails.map(detail => `
                                        <span class="bg-green-50 text-green-600 text-xs px-2 py-1 rounded">${detail}</span>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                        <button 
                            onclick="quickTrace('${house.id}')"
                            class="w-full mt-3 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm py-2 px-3 rounded transition-colors"
                        >
                            查看溯源档案
                        </button>
                    </div>
                </div>
            `;
        }

        // 渲染评价卡片
        function renderReviewCard(review) {
            const sentiment = analyzeSentiment(review.content);
            const sentimentConfig = {
                positive: { bg: "bg-green-50", border: "border-green-200", icon: "✅" },
                negative: { bg: "bg-red-50", border: "border-red-200", icon: "⚠️" },
                neutral: { bg: "bg-gray-50", border: "border-gray-200", icon: "ℹ️" }
            };
            const config = sentimentConfig[sentiment];

            const stars = "⭐".repeat(review.rating);

            return `
                <div class="${config.bg} ${config.border} border-l-4 rounded p-4 mb-3">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <span class="font-medium text-gray-800">${review.tenant}</span>
                            <span class="text-sm text-gray-500 ml-2">${review.duration}</span>
                        </div>
                        <div class="flex items-center">
                            <span class="text-sm">${stars}</span>
                            <span class="ml-2">${config.icon}</span>
                        </div>
                    </div>
                    <p class="text-sm text-gray-700 leading-relaxed">${review.content}</p>
                    <p class="text-xs text-gray-400 mt-2">评价时间：${review.date}</p>
                </div>
            `;
        }

        // 渲染溯源报告
        function renderTraceReport(report) {
            // 房源基本信息
            const houseInfoHtml = `
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <h4 class="text-lg font-bold text-gray-800 mb-2">${report.house.title}</h4>
                        <div class="space-y-2 text-sm">
                            <div class="flex items-center">
                                <span class="text-lg mr-2">🏷️</span>
                                <span>房源编号：<span class="font-medium">${report.house.id}</span></span>
                            </div>
                            <div class="flex items-center">
                                <span class="text-lg mr-2">💰</span>
                                <span>租金：<span class="font-bold text-red-500">¥${report.house.rent}/月</span></span>
                            </div>
                            <div class="flex items-center">
                                <span class="text-lg mr-2">📍</span>
                                <span>位置：${report.house.area}</span>
                            </div>
                        </div>
                    </div>
                    <div>
                        <div class="space-y-2 text-sm">
                            <div class="flex items-center">
                                <span class="text-lg mr-2">🏠</span>
                                <span>户型：${report.house.layout}</span>
                            </div>
                            <div class="flex items-center">
                                <span class="text-lg mr-2">📐</span>
                                <span>面积：${report.house.size}</span>
                            </div>
                            <div class="flex items-center">
                                <span class="text-lg mr-2">⭐</span>
                                <span>平均评分：<span class="font-bold text-yellow-600">${report.avgRating}/5</span></span>
                            </div>
                            <div class="flex items-center">
                                <span class="text-lg mr-2">💬</span>
                                <span>历史评价：<span class="font-medium">${report.totalReviews}条</span></span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="mt-4 flex flex-wrap gap-2">
                    ${report.house.tags.map(tag => `
                        <span class="bg-blue-100 text-blue-700 text-xs px-3 py-1 rounded-full">${tag}</span>
                    `).join('')}
                </div>
            `;

            // AI风险总结
            const aiSummaryHtml = `
                <div class="grid md:grid-cols-2 gap-4">
                    ${report.risks.length > 0 ? `
                        <div class="bg-red-50 border border-red-200 rounded-lg p-4">
                            <h5 class="font-bold text-red-700 mb-3 flex items-center">
                                <span class="mr-2">⚠️</span>
                                风险提示
                            </h5>
                            <div class="space-y-2">
                                ${report.risks.map(risk => `
                                    <div class="flex items-center bg-white rounded p-2 risk-tag">
                                        <span class="w-2 h-2 bg-red-500 rounded-full mr-2"></span>
                                        <span class="text-sm text-red-700">${risk}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : `
                        <div class="bg-green-50 border border-green-200 rounded-lg p-4">
                            <h5 class="font-bold text-green-700 mb-3 flex items-center">
                                <span class="mr-2">✅</span>
                                风险提示
                            </h5>
                            <p class="text-sm text-green-700">暂无明显风险</p>
                        </div>
                    `}
                    
                    ${report.advantages.length > 0 ? `
                        <div class="bg-green-50 border border-green-200 rounded-lg p-4">
                            <h5 class="font-bold text-green-700 mb-3 flex items-center">
                                <span class="mr-2">✨</span>
                                优势亮点
                            </h5>
                            <div class="space-y-2">
                                ${report.advantages.map(adv => `
                                    <div class="flex items-center bg-white rounded p-2">
                                        <span class="w-2 h-2 bg-green-500 rounded-full mr-2"></span>
                                        <span class="text-sm text-green-700">${adv}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
                
                <div class="mt-4 bg-blue-50 border border-blue-200 rounded-lg p-4">
                    <h5 class="font-bold text-blue-700 mb-2 flex items-center">
                        <span class="mr-2">💡</span>
                        AI综合建议
                    </h5>
                    <p class="text-sm text-blue-700 leading-relaxed">
                        ${generateAISuggestion(report)}
                    </p>
                </div>
            `;

            // 评价列表
            const reviewsHtml = report.reviews.map(review => renderReviewCard(review)).join('');

            return {
                houseInfo: houseInfoHtml,
                aiSummary: aiSummaryHtml,
                reviews: reviewsHtml
            };
        }

        // 生成AI建议
        function generateAISuggestion(report) {
            let suggestion = `该房源共收集${report.totalReviews}条前租客评价，平均评分${report.avgRating}分。`;

            if (report.risks.length > 0) {
                suggestion += `需注意：${report.risks.join("、")}等问题。`;
            }

            if (report.advantages.length > 0) {
                suggestion += `优势：${report.advantages.join("、")}。`;
            }

            if (parseFloat(report.avgRating) >= 4) {
                suggestion += "整体评价较好，推荐考虑。";
            } else if (parseFloat(report.avgRating) >= 3) {
                suggestion += "评价中等，建议实地看房后再决定。";
            } else {
                suggestion += "评价偏低，建议谨慎考虑或实地考察。";
            }

            return suggestion;
        }

        // ==================== 第五部分：事件处理函数 ====================
        
        // AI匹配房源
        function handleAIMatch() {
            const input = document.getElementById('aiInput').value.trim();
            
            if (!input) {
                alert('请输入您的租房需求');
                return;
            }

            const matchedHouses = matchHouses(input);
            
            if (matchedHouses.length === 0) {
                alert('未找到匹配的房源，请尝试其他需求描述');
                return;
            }

            // 渲染结果
            const resultsContainer = document.getElementById('aiResultsContent');
            resultsContainer.innerHTML = matchedHouses.map(house => renderHouseCard(house)).join('');

            // 显示结果区域
            document.getElementById('aiResults').classList.remove('hidden');
            document.getElementById('traceReport').classList.add('hidden');

            // 滚动到结果区域
            document.getElementById('aiResults').scrollIntoView({ behavior: 'smooth' });
        }

        // 溯源查询
        function handleTraceQuery() {
            const houseId = document.getElementById('houseIdInput').value.trim().toUpperCase();
            
            if (!houseId) {
                alert('请输入房源编号');
                return;
            }

            const report = generateTraceReport(houseId);
            
            if (!report) {
                alert('未找到该房源，请检查房源编号');
                return;
            }

            const reportHtml = renderTraceReport(report);

            // 渲染报告
            document.getElementById('houseInfo').innerHTML = reportHtml.houseInfo;
            document.getElementById('aiSummaryContent').innerHTML = reportHtml.aiSummary;
            document.getElementById('reviewsContent').innerHTML = reportHtml.reviews;

            // 显示报告区域
            document.getElementById('traceReport').classList.remove('hidden');
            document.getElementById('aiResults').classList.add('hidden');

            // 滚动到报告区域
            document.getElementById('traceReport').scrollIntoView({ behavior: 'smooth' });
        }

        // 快速溯源查询（从房源卡片点击）
        function quickTrace(houseId) {
            document.getElementById('houseIdInput').value = houseId;
            handleTraceQuery();
        }

        // 页面加载完成后的初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('租安心AI Demo 已加载完成');
            console.log('内置房源数量：', housesData.length);
            console.log('内置评价数量：', Object.keys(reviewsData).length);
        });
    </script>
