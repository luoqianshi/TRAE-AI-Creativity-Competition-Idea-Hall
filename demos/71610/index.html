<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天后留言板 - 给未来的自己</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #ff6b9d;
            --secondary-color: #c084fc;
            --accent-color: #fbbf24;
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --border-color: rgba(255, 107, 157, 0.2);
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .hero-section {
            position: relative;
            padding: 60px 20px;
            text-align: center;
            overflow: hidden;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: -50%;
            width: 200%;
            height: 100%;
            background: radial-gradient(circle at 30% 50%, rgba(255, 107, 157, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 70% 50%, rgba(192, 132, 252, 0.1) 0%, transparent 50%);
            animation: float 10s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .hero-title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 4rem;
            color: var(--primary-color);
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
            text-shadow: 2px 2px 4px rgba(255, 107, 157, 0.3);
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 32px;
            position: relative;
            z-index: 1;
        }

        .hero-decoration {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .decoration-item {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-color);
            animation: bounce 2s ease-in-out infinite;
        }

        .decoration-item:nth-child(2) { animation-delay: 0.2s; }
        .decoration-item:nth-child(3) { animation-delay: 0.4s; }
        .decoration-item:nth-child(4) { animation-delay: 0.6s; }
        .decoration-item:nth-child(5) { animation-delay: 0.8s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .section {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 32px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05), 0 2px 10px rgba(0, 0, 0, 0.02);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .section:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08), 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        .section-title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 32px;
            background: linear-gradient(to bottom, var(--primary-color), var(--secondary-color));
            border-radius: 2px;
        }

        .intro-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
        }

        .intro-card {
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.05) 0%, rgba(192, 132, 252, 0.05) 100%);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .intro-card:hover {
            transform: translateY(-8px) rotate(1deg);
        }

        .intro-icon {
            font-size: 2.5rem;
            margin-bottom: 16px;
            display: inline-block;
        }

        .intro-card h3 {
            font-size: 1.25rem;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .intro-card p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .task-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
        }

        .task-input-area {
            background: linear-gradient(135deg, #fdf2f8 0%, #fae8ff 100%);
            border-radius: 20px;
            padding: 32px;
        }

        .task-input-area h3 {
            font-size: 1.4rem;
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .task-input-area h3::before {
            content: '✨';
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(255, 107, 157, 0.2);
            border-radius: 12px;
            font-family: 'Noto Serif SC', serif;
            font-size: 1rem;
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.8);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            resize: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(255, 107, 157, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 30px;
            font-family: 'Noto Serif SC', serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .task-list {
            background: linear-gradient(135deg, #f0fdf4 0%, #ecfeff 100%);
            border-radius: 20px;
            padding: 32px;
        }

        .task-list h3 {
            font-size: 1.4rem;
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .task-list h3::before {
            content: '📋';
        }

        .task-items {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .task-item {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 107, 157, 0.1);
        }

        .task-item:hover {
            background: rgba(255, 255, 255, 1);
            border-color: rgba(255, 107, 157, 0.3);
        }

        .task-item.completed {
            background: rgba(250, 250, 250, 0.8);
            opacity: 0.7;
        }

        .task-item.completed .task-content {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .checkbox {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--primary-color);
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            margin-top: 2px;
        }

        .checkbox:hover {
            background: rgba(255, 107, 157, 0.1);
        }

        .checkbox.checked {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        .checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .task-content {
            flex: 1;
            min-width: 0;
        }

        .task-content h4 {
            font-size: 1.1rem;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .task-content p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .task-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            gap: 12px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        .delete-btn:hover {
            opacity: 1;
            color: #ef4444;
        }

        .message-section {
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
            border-radius: 20px;
            padding: 32px;
        }

        .message-section h3 {
            font-size: 1.4rem;
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .message-section h3::before {
            content: '💌';
        }

        .message-board {
            max-height: 300px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .message-item {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border-left: 4px solid var(--accent-color);
            transition: transform 0.3s ease;
        }

        .message-item:hover {
            transform: translateX(4px);
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .message-header span:first-child {
            font-weight: 600;
            color: var(--text-primary);
        }

        .message-header span:last-child {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .message-content {
            font-size: 1rem;
            color: var(--text-primary);
            line-height: 1.7;
            font-style: italic;
        }

        .progress-section {
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.05) 0%, rgba(192, 132, 252, 0.05) 100%);
            border-radius: 16px;
            padding: 32px;
            text-align: center;
        }

        .progress-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: conic-gradient(var(--primary-color) 0%, var(--secondary-color) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            position: relative;
            animation: spin 3s linear infinite;
        }

        .progress-circle::before {
            content: '';
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: var(--card-bg);
        }

        .progress-text {
            position: relative;
            z-index: 1;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 2rem;
            color: var(--primary-color);
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .progress-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 24px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-item span:first-child {
            display: block;
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 4px;
        }

        .stat-item span:last-child {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .footer-heart {
            color: var(--primary-color);
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 2.5rem;
            }

            .hero-subtitle {
                font-size: 1rem;
            }

            .section {
                padding: 24px;
            }

            .section-title {
                font-size: 1.5rem;
            }

            .task-section {
                grid-template-columns: 1fr;
            }

            .progress-stats {
                gap: 20px;
            }

            .stat-item span:first-child {
                font-size: 1.5rem;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--secondary-color);
        }
    </style>
</head>
<body>
    <div class="hero-section">
        <h1 class="hero-title">天后留言板</h1>
        <p class="hero-subtitle">给自定义天后的自己留言，看看自己有没有按时按量完成任务</p>
        <div class="hero-decoration">
            <div class="decoration-item"></div>
            <div class="decoration-item"></div>
            <div class="decoration-item"></div>
            <div class="decoration-item"></div>
            <div class="decoration-item"></div>
        </div>
    </div>

    <div class="container">
        <div class="section">
            <h2 class="section-title">创意介绍</h2>
            <div class="intro-grid">
                <div class="intro-card">
                    <div class="intro-icon">🎯</div>
                    <h3>创意名称</h3>
                    <p>天后留言板 - 给未来的自己</p>
                </div>
                <div class="intro-card">
                    <div class="intro-icon">💡</div>
                    <h3>灵感来源</h3>
                    <p>每个人都有拖延症，与其等待别人督促，不如让未来的自己来鞭策现在的自己</p>
                </div>
                <div class="intro-card">
                    <div class="intro-icon">📱</div>
                    <h3>产品形态</h3>
                    <p>一个温馨的网页应用，让你给未来的自己留下任务和鼓励</p>
                </div>
                <div class="intro-card">
                    <div class="intro-icon">✨</div>
                    <h3>核心价值</h3>
                    <p>自我管理、时间规划、自我激励、持续进步</p>
                </div>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">任务管理</h2>
            <div class="task-section">
                <div class="task-input-area">
                    <h3>添加新任务</h3>
                    <div class="form-group">
                        <label>任务名称</label>
                        <input type="text" id="taskName" placeholder="例如：完成项目报告">
                    </div>
                    <div class="form-group">
                        <label>任务描述</label>
                        <textarea id="taskDesc" rows="3" placeholder="描述任务详情，给未来的自己一些提示..."></textarea>
                    </div>
                    <button class="btn" onclick="addTask()">
                        <span>➕</span> 添加任务
                    </button>
                </div>

                <div class="task-list">
                    <h3>任务列表</h3>
                    <div class="task-items" id="taskItems">
                    </div>
                </div>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">给未来的自己留言</h2>
            <div class="message-section">
                <h3>留言板</h3>
                <div class="form-group">
                    <textarea id="messageText" rows="4" placeholder="给未来的自己写点什么...你可以做到的！"></textarea>
                    <button class="btn" onclick="addMessage()">
                        <span>💌</span> 发送留言
                    </button>
                </div>
                <div class="message-board" id="messageBoard">
                </div>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">进度概览</h2>
            <div class="progress-section">
                <div class="progress-circle">
                    <div class="progress-text" id="progressText">0%</div>
                </div>
                <div class="progress-stats">
                    <div class="stat-item">
                        <span id="totalTasks">0</span>
                        <span>总任务</span>
                    </div>
                    <div class="stat-item">
                        <span id="completedTasks">0</span>
                        <span>已完成</span>
                    </div>
                    <div class="stat-item">
                        <span id="messageCount">0</span>
                        <span>留言数</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>💪 每一天都是进步的机会 <span class="footer-heart">❤️</span></p>
        <p>天后留言板 - 给自定义天后的自己留言</p>
    </div>

    <script>
        let tasks = [];
        let messages = [];

        function addTask() {
            const name = document.getElementById('taskName').value;
            const desc = document.getElementById('taskDesc').value;
            
            if (!name.trim()) {
                alert('请输入任务名称');
                return;
            }

            const task = {
                id: Date.now(),
                name,
                desc,
                completed: false,
                createdAt: new Date().toLocaleString('zh-CN')
            };

            tasks.push(task);
            renderTasks();
            updateProgress();

            document.getElementById('taskName').value = '';
            document.getElementById('taskDesc').value = '';
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                renderTasks();
                updateProgress();
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            renderTasks();
            updateProgress();
        }

        function renderTasks() {
            const container = document.getElementById('taskItems');
            
            if (tasks.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">还没有任务，添加一个吧！</p>';
                return;
            }

            container.innerHTML = tasks.map(task => `
                <div class="task-item ${task.completed ? 'completed' : ''}">
                    <div class="checkbox ${task.completed ? 'checked' : ''}" onclick="toggleTask(${task.id})"></div>
                    <div class="task-content">
                        <h4>${task.name}</h4>
                        ${task.desc ? `<p>${task.desc}</p>` : ''}
                        <div class="task-meta">
                            <span>${task.createdAt}</span>
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteTask(${task.id})">✕</button>
                </div>
            `).join('');
        }

        function addMessage() {
            const text = document.getElementById('messageText').value;
            
            if (!text.trim()) {
                alert('请输入留言内容');
                return;
            }

            const message = {
                id: Date.now(),
                text,
                createdAt: new Date().toLocaleString('zh-CN')
            };

            messages.push(message);
            renderMessages();
            updateProgress();

            document.getElementById('messageText').value = '';
        }

        function renderMessages() {
            const container = document.getElementById('messageBoard');
            
            if (messages.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">还没有留言，给未来的自己写点什么吧！</p>';
                return;
            }

            container.innerHTML = messages.map(message => `
                <div class="message-item">
                    <div class="message-header">
                        <span>给未来的自己</span>
                        <span>${message.createdAt}</span>
                    </div>
                    <div class="message-content">${message.text}</div>
                </div>
            `).join('');

            container.scrollTop = container.scrollHeight;
        }

        function updateProgress() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const progress = total > 0 ? Math.round((completed / total) * 100) : 0;

            document.getElementById('progressText').textContent = `${progress}%`;
            document.getElementById('totalTasks').textContent = total;
            document.getElementById('completedTasks').textContent = completed;
            document.getElementById('messageCount').textContent = messages.length;
        }

        renderTasks();
        renderMessages();
        updateProgress();
    </script>
</body>
</html>
