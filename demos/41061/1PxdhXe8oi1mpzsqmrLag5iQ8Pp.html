<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>发送弹幕 - 幸运抽奖</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'deep-navy': '#0A1628',
            'navy-light': '#132744',
            'neon-gold': '#FFD700',
            'neon-blue': '#00D4FF',
            'neon-pink': '#FF006E',
            'neon-purple': '#8338EC',
          },
          fontFamily: {
            display: ['Orbitron', 'sans-serif'],
            body: ['Space Grotesk', 'sans-serif'],
          },
        }
      }
    }
  </script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #0A1628;
      color: white;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }
    
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .glass-strong {
      background: rgba(19, 39, 68, 0.9);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    
    .neon-text-blue {
      text-shadow: 0 0 10px rgba(0, 212, 255, 0.8), 0 0 20px rgba(0, 212, 255, 0.6), 0 0 40px rgba(0, 212, 255, 0.4);
    }
    
    .gradient-bg {
      background: linear-gradient(-45deg, #0A1628, #132744, #0A1628, #1a1a2e);
      background-size: 400% 400%;
      animation: gradient-shift 15s ease infinite;
    }
    
    @keyframes gradient-shift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    
    .particles-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    
    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(0, 212, 255, 0.6);
      border-radius: 50%;
      animation: float-particle 20s infinite linear;
    }
    
    @keyframes float-particle {
      0% { transform: translateY(100vh) translateX(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100vh) translateX(100px); opacity: 0; }
    }
    
    .btn-glow {
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    
    .btn-glow:active {
      transform: scale(0.98);
    }
    
    .color-btn.active {
      transform: scale(1.2);
      box-shadow: 0 0 15px currentColor;
    }
    
    .preset-btn:active {
      transform: scale(0.95);
    }
    
    .send-success {
      animation: success-pop 0.3s ease;
    }
    
    @keyframes success-pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body class="gradient-bg">
  
  <div id="particles" class="particles-bg"></div>
  
  <div class="relative z-10 min-h-screen flex flex-col">
    <header class="p-6 text-center">
      <div class="w-16 h-16 mx-auto mb-4 rounded-2xl flex items-center justify-center" style="background: linear-gradient(135deg, #00D4FF, #8338EC); box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);">
        <svg class="w-8 h-8 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-display font-bold text-white neon-text-blue">发送弹幕</h1>
      <p class="text-gray-400 text-sm mt-2">输入内容，点亮大屏</p>
    </header>
    
    <main class="flex-1 p-6">
      <div class="glass-strong rounded-2xl p-6 mb-6">
        <textarea
          id="danmaku-input"
          placeholder="说点什么吧..."
          maxlength="50"
          class="w-full h-32 bg-white/5 border border-white/10 rounded-xl p-4 text-white placeholder-gray-500 focus:outline-none focus:border-neon-blue/50 resize-none text-lg"
        ></textarea>
        <div class="flex justify-between items-center mt-2">
          <span id="char-count" class="text-xs text-gray-500">0/50</span>
        </div>
      </div>
      
      <div class="glass rounded-xl p-4 mb-6">
        <p class="text-sm text-gray-400 mb-3">选择颜色</p>
        <div class="flex gap-3 justify-center flex-wrap">
          <button onclick="setColor('#FFD700')" class="color-btn active w-10 h-10 rounded-full transition-all" style="background: #FFD700;" data-color="#FFD700"></button>
          <button onclick="setColor('#00D4FF')" class="color-btn w-10 h-10 rounded-full transition-all" style="background: #00D4FF;" data-color="#00D4FF"></button>
          <button onclick="setColor('#FF006E')" class="color-btn w-10 h-10 rounded-full transition-all" style="background: #FF006E;" data-color="#FF006E"></button>
          <button onclick="setColor('#8338EC')" class="color-btn w-10 h-10 rounded-full transition-all" style="background: #8338EC;" data-color="#8338EC"></button>
          <button onclick="setColor('#00FF88')" class="color-btn w-10 h-10 rounded-full transition-all" style="background: #00FF88;" data-color="#00FF88"></button>
          <button onclick="setColor('#FF6B35')" class="color-btn w-10 h-10 rounded-full transition-all" style="background: #FF6B35;" data-color="#FF6B35"></button>
          <button onclick="setColor('#FFFFFF')" class="color-btn w-10 h-10 rounded-full transition-all border border-gray-600" style="background: #FFFFFF;" data-color="#FFFFFF"></button>
        </div>
      </div>
      
      <div class="glass rounded-xl p-4 mb-6">
        <p class="text-sm text-gray-400 mb-3">快捷弹幕</p>
        <div class="flex flex-wrap gap-2">
          <button onclick="setPreset('🎉 恭喜中奖！')" class="preset-btn px-4 py-2 bg-white/5 border border-white/10 rounded-full text-sm text-gray-300 hover:bg-white/10 hover:text-white transition-all">🎉 恭喜中奖！</button>
          <button onclick="setPreset('🔥 太精彩了！')" class="preset-btn px-4 py-2 bg-white/5 border border-white/10 rounded-full text-sm text-gray-300 hover:bg-white/10 hover:text-white transition-all">🔥 太精彩了！</button>
          <button onclick="setPreset('👏 好棒啊！')" class="preset-btn px-4 py-2 bg-white/5 border border-white/10 rounded-full text-sm text-gray-300 hover:bg-white/10 hover:text-white transition-all">👏 好棒啊！</button>
          <button onclick="setPreset('💪 加油加油！')" class="preset-btn px-4 py-2 bg-white/5 border border-white/10 rounded-full text-sm text-gray-300 hover:bg-white/10 hover:text-white transition-all">💪 加油加油！</button>
          <button onclick="setPreset('🎊 好期待！')" class="preset-btn px-4 py-2 bg-white/5 border border-white/10 rounded-full text-sm text-gray-300 hover:bg-white/10 hover:text-white transition-all">🎊 好期待！</button>
          <button onclick="setPreset('✨ 我也想要！')" class="preset-btn px-4 py-2 bg-white/5 border border-white/10 rounded-full text-sm text-gray-300 hover:bg-white/10 hover:text-white transition-all">✨ 我也想要！</button>
        </div>
      </div>
      
      <button
        id="send-btn"
        onclick="sendDanmaku()"
        class="btn-glow w-full py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 bg-gradient-to-r from-cyan-400 to-purple-500 text-white active:scale-[0.98] transition-all"
        style="box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);"
      >
        <svg id="send-icon" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
        <svg id="success-icon" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <span id="send-text">发送弹幕</span>
      </button>
    </main>
    
    <footer class="p-6 text-center">
      <p class="text-xs text-gray-600">发送的弹幕将显示在抽奖大屏上</p>
    </footer>
  </div>

  <script>
    let selectedColor = '#FFD700';
    
    function setColor(color) {
      selectedColor = color;
      document.querySelectorAll('.color-btn').forEach(btn => {
        if (btn.dataset.color === color) {
          btn.classList.add('active');
          btn.style.outline = '2px solid white';
          btn.style.outlineOffset = '2px';
        } else {
          btn.classList.remove('active');
          btn.style.outline = 'none';
        }
      });
    }
    
    function setPreset(text) {
      document.getElementById('danmaku-input').value = text;
      updateCharCount();
    }
    
    function updateCharCount() {
      const input = document.getElementById('danmaku-input');
      const count = document.getElementById('char-count');
      count.textContent = input.value.length + '/50';
    }
    
    document.getElementById('danmaku-input').addEventListener('input', updateCharCount);
    
    function sendDanmaku() {
      const input = document.getElementById('danmaku-input');
      const text = input.value.trim();
      
      if (!text) {
        input.focus();
        return;
      }
      
      const danmakuData = {
        id: Date.now().toString(36) + Math.random().toString(36).substr(2),
        text: text,
        color: selectedColor,
        timestamp: Date.now(),
      };
      
      try {
        const danmakus = JSON.parse(localStorage.getItem('lottery_danmaku_queue') || '[]');
        danmakus.push(danmakuData);
        localStorage.setItem('lottery_danmaku_queue', JSON.stringify(danmakus));
        
        const channel = new BroadcastChannel('lottery-danmaku');
        channel.postMessage(danmakuData);
        channel.close();
      } catch (e) {
        console.error('发送弹幕失败:', e);
      }
      
      const sendBtn = document.getElementById('send-btn');
      const sendIcon = document.getElementById('send-icon');
      const successIcon = document.getElementById('success-icon');
      const sendText = document.getElementById('send-text');
      
      sendIcon.classList.add('hidden');
      successIcon.classList.remove('hidden');
      sendText.textContent = '发送成功！';
      sendBtn.classList.add('send-success');
      
      input.value = '';
      updateCharCount();
      
      setTimeout(() => {
        sendIcon.classList.remove('hidden');
        successIcon.classList.add('hidden');
        sendText.textContent = '发送弹幕';
        sendBtn.classList.remove('send-success');
      }, 2000);
    }
    
    document.getElementById('danmaku-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendDanmaku();
      }
    });
    
    function createParticles() {
      const container = document.getElementById('particles');
      const count = 30;
      
      for (let i = 0; i < count; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 20 + 's';
        particle.style.animationDuration = (15 + Math.random() * 15) + 's';
        particle.style.opacity = (0.3 + Math.random() * 0.7).toString();
        const size = 1 + Math.random() * 2;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        container.appendChild(particle);
      }
    }
    
    window.onload = function() {
      createParticles();
      setColor('#FFD700');
    };
  </script>
</body>
</html>
