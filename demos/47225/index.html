<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>低多边形 - 革命熊猫</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #e8eaed; }
  canvas { display: block; }
</style>
</head>
<body>
<!-- 引入稳定版Three.js（UMD纯JS版本，无模块编译问题） -->
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// 场景初始化
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8eaed);
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.2, 4.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.BasicShadowMap; // 硬边阴影适配低多边形风格
document.body.appendChild(renderer.domElement);

// 交互控制器
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 2;
controls.maxDistance = 10;
controls.maxPolarAngle = Math.PI / 2 - 0.1;

// 低多边形材质工具函数：自动开启硬边平涂
function lowPolyMat(color) {
  return new THREE.MeshLambertMaterial({
    color: color,
    flatShading: true // 低多边形核心：面着色、硬边
  });
}

/* -------------------------- 1. 构建低模熊猫 -------------------------- */
const panda = new THREE.Group();
scene.add(panda);

// 身体（脏白色椭球）
const bodyGeo = new THREE.SphereGeometry(0.55, 12, 8);
const body = new THREE.Mesh(bodyGeo, lowPolyMat(0xf0e2d6));
body.scale.y = 1.3;
body.position.y = 0.7;
body.castShadow = true;
panda.add(body);

// 胸口黑毛
const chestGeo = new THREE.SphereGeometry(0.35, 10, 6);
const chest = new THREE.Mesh(chestGeo, lowPolyMat(0x1a1a1a));
chest.scale.y = 0.8;
chest.position.set(0, 1.0, 0.1);
panda.add(chest);

// 头（仰头姿态）
const headGeo = new THREE.SphereGeometry(0.4, 12, 8);
const head = new THREE.Mesh(headGeo, lowPolyMat(0xffffff));
head.position.y = 1.5;
head.rotation.x = 0.25; // 仰头
head.castShadow = true;
panda.add(head);

// 耳朵
const earGeo = new THREE.SphereGeometry(0.12, 8, 6);
const earL = new THREE.Mesh(earGeo, lowPolyMat(0x1a1a1a));
earL.position.set(-0.25, 1.85, 0);
const earR = earL.clone();
earR.position.x = 0.25;
panda.add(earL, earR);

// 黑眼圈
const eyePatchGeo = new THREE.SphereGeometry(0.11, 8, 6);
eyePatchGeo.scale(0.6, 1, 0.3);
const eyeL = new THREE.Mesh(eyePatchGeo, lowPolyMat(0x1a1a1a));
eyeL.position.set(-0.16, 1.52, 0.32);
const eyeR = eyeL.clone();
eyeR.position.x = 0.16;
panda.add(eyeL, eyeR);

// 鼻子
const noseGeo = new THREE.SphereGeometry(0.07, 6, 4);
const nose = new THREE.Mesh(noseGeo, lowPolyMat(0x1a1a1a));
nose.position.set(0, 1.42, 0.37);
panda.add(nose);

// 大张的嘴+牙齿
const mouthGeo = new THREE.BoxGeometry(0.2, 0.16, 0.06);
const mouth = new THREE.Mesh(mouthGeo, lowPolyMat(0x111111));
mouth.position.set(0, 1.26, 0.36);
const toothGeo = new THREE.BoxGeometry(0.04, 0.05, 0.03);
const toothL = new THREE.Mesh(toothGeo, lowPolyMat(0xffffff));
toothL.position.set(-0.05, 1.32, 0.39);
const toothR = toothL.clone();
toothR.position.x = 0.05;
panda.add(mouth, toothL, toothR);

// 脸颊棕褐色晒斑/污渍
const cheekGeo = new THREE.SphereGeometry(0.12, 8, 6);
cheekGeo.scale(1, 0.8, 0.3);
const cheekL = new THREE.Mesh(cheekGeo, lowPolyMat(0xd4a078));
cheekL.position.set(-0.3, 1.3, 0.25);
const cheekR = cheekL.clone();
cheekR.position.x = 0.3;
panda.add(cheekL, cheekR);

// 前肢（高高举起的姿势）
const armGeo = new THREE.CylinderGeometry(0.17, 0.15, 1.1, 6);
const armL = new THREE.Mesh(armGeo, lowPolyMat(0x1a1a1a)); // 观众视角右侧
armL.position.set(0.36, 1.1, 0.1);
armL.rotation.set(0.2, 0, 0.4);
armL.castShadow = true;
const armR = armL.clone(); // 观众视角左侧
armR.position.set(-0.36, 1.1, 0.1);
armR.rotation.set(0.2, 0, -0.5);
panda.add(armL, armR);

// 爪子指甲
const clawGeo = new THREE.ConeGeometry(0.02, 0.08, 4);
for(let i=0; i<3; i++){
  const clawL = new THREE.Mesh(clawGeo, lowPolyMat(0xe6c9a1));
  clawL.position.set(0.4 + i*0.03, 1.72 + i*0.02, 0.15);
  clawL.rotation.set(0, 0, -0.3 + i*0.15);
  const clawR = clawL.clone();
  clawR.position.set(-0.4 - i*0.03, 1.7 + i*0.02, 0.15);
  clawR.rotation.set(0, 0, 0.3 - i*0.15);
  panda.add(clawL, clawR);
}

// 后肢（蹲坐状态，大部分被遮挡）
const legGeo = new THREE.CylinderGeometry(0.2, 0.18, 0.6, 6);
const legL = new THREE.Mesh(legGeo, lowPolyMat(0x1a1a1a));
legL.position.set(0.25, 0.15, 0.2);
legL.rotation.set(-0.8, 0, 0.2);
const legR = legL.clone();
legR.position.x = -0.25;
legR.rotation.z = -0.2;
panda.add(legL, legR);

/* -------------------------- 2. 交叉农具 -------------------------- */
const tools = new THREE.Group();
scene.add(tools);

// 镰刀
const sickleHandleGeo = new THREE.CylinderGeometry(0.035, 0.04, 0.7, 6);
const sickleHandle = new THREE.Mesh(sickleHandleGeo, lowPolyMat(0x5a3921)); // 木柄
sickleHandle.position.set(-0.25, 1.75, 0.1);
sickleHandle.rotation.z = -0.6;
// 镰刀弯刃（用一段圆环实现月牙形）
const sickleBladeGeo = new THREE.TorusGeometry(0.3, 0.03, 4, 6, Math.PI * 0.7);
const sickleBlade = new THREE.Mesh(sickleBladeGeo, lowPolyMat(0x33363b));
sickleBlade.position.set(0.08, 2.15, 0.1);
sickleBlade.rotation.set(0, 0, 0.3);
tools.add(sickleHandle, sickleBlade);

// 鹤嘴镐
const pickHandleGeo = new THREE.CylinderGeometry(0.03, 0.03, 1.0, 6);
const pickHandle = new THREE.Mesh(pickHandleGeo, lowPolyMat(0x2d2f33)); // 金属柄
pickHandle.position.set(0.25, 1.8, 0.15);
pickHandle.rotation.z = 0.8;
// 镐尖
const pickPointGeo = new THREE.ConeGeometry(0.06, 0.2, 6);
const pickPoint = new THREE.Mesh(pickPointGeo, lowPolyMat(0x33363b));
pickPoint.position.set(-0.25, 2.3, 0.15);
pickPoint.rotation.z = -0.4;
// 镐锤端
const pickHammerGeo = new THREE.BoxGeometry(0.08, 0.08, 0.1);
const pickHammer = new THREE.Mesh(pickHammerGeo, lowPolyMat(0x33363b));
pickHammer.position.set(0.15, 1.85, 0.15);
tools.add(pickHandle, pickPoint, pickHammer);

/* -------------------------- 3. 干草、竹子细节 -------------------------- */
// 肚子上的草堆/竹屑
const strawColors = [0xd4bc6c, 0xb5a055, 0x9a8a4b, 0x87a852];
for(let i=0; i<28; i++){
  const strawLen = 0.15 + Math.random() * 0.3;
  const strawGeo = new THREE.CylinderGeometry(0.008 + Math.random()*0.01, 0.008, strawLen, 4);
  const straw = new THREE.Mesh(strawGeo, lowPolyMat(strawColors[Math.floor(Math.random()*strawColors.length)]));
  straw.position.set(
    (Math.random()-0.5)*0.6,
    0.3 + Math.random()*0.6,
    0.2 + Math.random()*0.25
  );
  straw.rotation.set(
    Math.random()*Math.PI,
    Math.random()*Math.PI,
    Math.random()*Math.PI
  );
  scene.add(straw);
}
// 下巴垂下来的草茎
const droopGrassGeo = new THREE.CylinderGeometry(0.007, 0.007, 0.35, 4);
const droopGrass1 = new THREE.Mesh(droopGrassGeo, lowPolyMat(0x87a852));
droopGrass1.position.set(0.02, 1.08, 0.35);
const droopGrass2 = droopGrass1.clone();
droopGrass2.position.x = 0.08;
scene.add(droopGrass1, droopGrass2);

// 右下角青竹段
const bambooGeo = new THREE.CylinderGeometry(0.035, 0.035, 0.6, 6);
for(let i=0; i<4; i++){
  const bamboo = new THREE.Mesh(bambooGeo, lowPolyMat(0x73a958));
  bamboo.position.set(
    0.9 + Math.random()*0.4,
    0.1 + Math.random()*0.3,
    0.1 + Math.random()*0.2
  );
  bamboo.rotation.set(
    Math.random()*0.5,
    Math.random()*Math.PI,
    -0.3 - Math.random()*0.5
  );
  bamboo.scale.y = 0.7 + Math.random()*0.8;
  bamboo.castShadow = true;
  scene.add(bamboo);
}

/* -------------------------- 4. 环境场景 -------------------------- */
// 地面草地
const groundGeo = new THREE.PlaneGeometry(12, 12, 8, 8);
const ground = new THREE.Mesh(groundGeo, lowPolyMat(0x88c266));
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.5;
ground.receiveShadow = true;
scene.add(ground);

// 身后原木栖架
const logGeo = new THREE.CylinderGeometry(0.15, 0.15, 4, 8);
const log = new THREE.Mesh(logGeo, lowPolyMat(0x66594f));
log.rotation.z = Math.PI/2;
log.position.set(0, 0.7, -0.3);
log.castShadow = true;
log.receiveShadow = true;
scene.add(log);

// 背景树木
function makeTree(x, z){
  const trunkGeo = new THREE.CylinderGeometry(0.12, 0.15, 3.5, 6);
  const trunk = new THREE.Mesh(trunkGeo, lowPolyMat(0x6b5639));
  trunk.position.set(x, 1.25, z);
  trunk.castShadow = true;
  // 低模树叶簇
  for(let i=0; i<4; i++){
    const leafGeo = new THREE.SphereGeometry(0.3 + Math.random()*0.2, 6, 4);
    const leaf = new THREE.Mesh(leafGeo, lowPolyMat(0x528a4a));
    leaf.position.set(
      x + (Math.random()-0.5)*0.4,
      3 + Math.random()*0.4,
      z + (Math.random()-0.5)*0.4
    );
    scene.add(leaf);
  }
  scene.add(trunk);
}
makeTree(-1.6, -2.1);
makeTree(1.4, -2.3);

// 左上角前景树叶
for(let i=0; i<5; i++){
  const foreLeafGeo = new THREE.SphereGeometry(0.2 + Math.random()*0.2, 5, 4);
  const foreLeaf = new THREE.Mesh(foreLeafGeo, lowPolyMat(0x2d5c28));
  foreLeaf.position.set(
    -1.6 + Math.random()*1.1,
    2.2 + Math.random()*0.7,
    1.1
  );
  scene.add(foreLeaf);
}

// 远景围墙
const wallGeo = new THREE.PlaneGeometry(14, 9);
const wall = new THREE.Mesh(wallGeo, lowPolyMat(0xe8eaed));
wall.position.set(0, 1, -3.5);
scene.add(wall);

/* -------------------------- 灯光 -------------------------- */
const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(-2.5, 3.5, 2);
sun.castShadow = true;
sun.shadow.camera.left = -4;
sun.shadow.camera.right = 4;
sun.shadow.camera.top = 4;
sun.shadow.camera.bottom = -1;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

// 窗口自适应
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
})

// 渲染循环
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
