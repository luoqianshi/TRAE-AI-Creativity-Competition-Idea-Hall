<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">太极智学</div>
      <nav class="main-nav">
        <a href="./taiji-learning-proposal.html">招式学习</a>
        <a href="./community.html" class="active">社区广场</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-title">
      <h1>太极社区</h1>
      <p>上传练习视频、观摩拳友动作、互相交流心得</p>
    </div>

    <div class="tabs">
      <button class="tab-btn" data-tab="teach">专业教学</button>
      <button class="tab-btn active" data-tab="square">视频广场</button>
      <button class="tab-btn" data-tab="upload">上传视频</button>
      <button class="tab-btn" data-tab="chat">聊天室</button>
    </div>

    <!-- 专业教学 -->
    <section id="panel-teach" class="panel">
      <div class="teach-section">
        <h2>专业太极教学视频</h2>
        <div class="teach-stage">
          <iframe id="taiji-video" src="" allowfullscreen></iframe>
          <div class="teach-stage-hint">点击视频右下角可全屏</div>
          <div class="teach-breath-hint" id="video-breath-hint">自然呼吸 · 起势</div>
        </div>

        <div class="teach-controls">
          <div class="teach-control-group">
            <label>选择招式</label>
            <div class="teach-btn-row">
              <button class="active" onclick="setPoseVideo('wuji', this)">起势</button>
              <button onclick="setPoseVideo('yemafenzong', this)">野马分鬃</button>
              <button onclick="setPoseVideo('baiheliangchi', this)">白鹤亮翅</button>
              <button onclick="setPoseVideo('louxi_aobu', this)">搂膝拗步</button>
              <button onclick="setPoseVideo('shouhuipipa', this)">手挥琵琶</button>
              <button onclick="setPoseVideo('lanquewei', this)">揽雀尾</button>
              <button onclick="setPoseVideo('yunshou', this)">云手</button>
              <button onclick="setPoseVideo('danbian', this)">单鞭</button>
            </div>
          </div>
          <div class="teach-control-group">
            <label>切换视角</label>
            <div class="teach-btn-row">
              <button class="active" onclick="setViewVideo('front', this)">正面</button>
              <button onclick="setViewVideo('back', this)">背面</button>
            </div>
          </div>
          <div class="teach-control-group">
            <label>循环播放</label>
            <div class="teach-btn-row">
              <button class="active" onclick="toggleLoop(this)">循环当前招式</button>
            </div>
          </div>
        </div>

        <div class="teach-info" id="video-pose-info">
          <h4>起势 · 无极式</h4>
          <p>两脚平行、松肩沉肘、意守丹田。作为二十四式的开端，起势帮助练习者调身、调息、调心，进入太极状态。</p>
        </div>
      </div>
    </section>

    <!-- 视频广场 -->
    <section id="panel-square" class="panel active">
      <div class="card">
        <h2>最新动态</h2>
        <div id="video-grid" class="video-grid">
          <!-- JS 填充 -->
        </div>
      </div>
    </section>

    <!-- 上传视频 -->
    <section id="panel-upload" class="panel">
      <div class="card">
        <h2>上传练习视频</h2>
        <div class="form-row">
          <label for="video-file">选择视频文件</label>
          <input type="file" id="video-file" accept="video/*">
          <div class="hint">演示环境限制：单个视频建议不超过 5MB，刷新页面后仍可播放。</div>
        </div>
        <div class="form-row">
          <label for="video-title">标题</label>
          <input type="text" id="video-title" placeholder="例如：二十四式起势练习">
        </div>
        <div class="form-row">
          <label for="video-author">你的昵称</label>
          <input type="text" id="video-author" placeholder="例如：太极小白">
        </div>
        <div class="form-row">
          <label for="video-desc">描述</label>
          <textarea id="video-desc" placeholder="说说你练习的招式、遇到的问题或想请教的地方..."></textarea>
        </div>
        <button class="primary" id="upload-btn">发布视频</button>
        <div id="upload-status" class="hint"></div>
      </div>

    <!-- 聊天室 -->
    <section id="panel-chat" class="panel">
      <div class="card">
        <h2>拳友聊天室</h2>
        <div class="chat-container">
          <div id="chat-messages" class="chat-messages">
            <!-- JS 填充 -->
          </div>
          <div class="chat-input-row">
            <input type="text" id="chat-nickname" placeholder="昵称" style="max-width:120px">
            <input type="text" id="chat-input" placeholder="输入消息，按回车发送">
            <button class="primary" id="chat-send">发送</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 视频播放弹窗 -->
  <div id="video-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-title">视频播放</h3>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <video id="modal-video" controls autoplay></video>
      </div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      // ===== 标签切换 =====
      const tabBtns = document.querySelectorAll('.tab-btn');
      const panels = document.querySelectorAll('.panel');
      tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const tab = btn.dataset.tab;
          tabBtns.forEach(b => b.classList.remove('active'));
          panels.forEach(p => p.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('panel-' + tab).classList.add('active');
          if (tab === 'square') renderVideos();
          if (tab === 'chat') renderChat();
        });
      });

      // ===== 本地存储封装 =====
      const DB_KEY_VIDEOS = 'taiji_community_videos';
      const DB_KEY_CHAT = 'taiji_community_chat';

      function loadVideos() {
        try { return JSON.parse(localStorage.getItem(DB_KEY_VIDEOS)) || []; }
        catch (e) { return []; }
      }
      function saveVideos(videos) {
        localStorage.setItem(DB_KEY_VIDEOS, JSON.stringify(videos));
      }
      function loadChat() {
        try { return JSON.parse(localStorage.getItem(DB_KEY_CHAT)) || []; }
        catch (e) { return []; }
      }
      function saveChat(messages) {
        localStorage.setItem(DB_KEY_CHAT, JSON.stringify(messages));
      }

      // 初始示例视频（仅封面与提示，不含真实文件）
      function initDemoVideos() {
        const videos = loadVideos();
        if (videos.length === 0) {
          saveVideos([
            {
              id: 'demo-1',
              title: '示例：起势练习',
              author: '社区助教',
              desc: '这是一个示例卡片。上传你的练习视频后，会显示在广场中。',
              createdAt: Date.now() - 86400000,
              isDemo: true
            },
            {
              id: 'demo-2',
              title: '示例：云手慢练',
              author: '太极爱好者',
              desc: '点击卡片可播放你上传的视频。演示环境的视频保存在浏览器本地。',
              createdAt: Date.now() - 43200000,
              isDemo: true
            }
          ]);
        }
      }
      initDemoVideos();

      // ===== 视频广场 =====
      function formatTime(ts) {
        const d = new Date(ts);
        return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      }

      function renderVideos() {
        const grid = document.getElementById('video-grid');
        const videos = loadVideos().sort((a, b) => b.createdAt - a.createdAt);
        if (videos.length === 0) {
          grid.innerHTML = '<div class="empty-state"><p>暂无视频，快去上传你的第一段练习吧！</p></div>';
          return;
        }
        grid.innerHTML = videos.map(v => `
          <div class="video-card" data-id="${v.id}">
            <div class="video-thumb">
              ${v.thumb ? '<img src="' + v.thumb + '" alt="封面">' : ''}
              <div class="play-icon"></div>
            </div>
            <div class="video-info">
              <div class="video-title" title="${escapeHtml(v.title)}">${escapeHtml(v.title)}</div>
              <div class="video-meta">
                <span>${escapeHtml(v.author || '匿名拳友')}</span>
                <span>${formatTime(v.createdAt)}</span>
              </div>
              <div class="video-desc">${escapeHtml(v.desc || '')}</div>
            </div>
          </div>
        `).join('');

        grid.querySelectorAll('.video-card').forEach(card => {
          card.addEventListener('click', () => playVideo(card.dataset.id));
        });
      }

      function playVideo(id) {
        const videos = loadVideos();
        const v = videos.find(x => x.id === id);
        if (!v) return;
        const modal = document.getElementById('video-modal');
        const videoEl = document.getElementById('modal-video');
        const titleEl = document.getElementById('modal-title');
        titleEl.textContent = v.title;
        if (v.isDemo) {
          videoEl.removeAttribute('src');
          videoEl.poster = '';
          videoEl.innerHTML = '<p style="color:#fff;text-align:center;padding:3rem 1rem">这是示例卡片，暂无真实视频。请在“上传视频”标签页发布你的练习视频。</p>';
          modal.classList.add('active');
          return;
        }
        if (!v.dataUrl) {
          alert('视频数据未找到');
          return;
        }
        videoEl.innerHTML = '';
        videoEl.src = v.dataUrl;
        modal.classList.add('active');
        videoEl.play().catch(() => {});
      }

      document.getElementById('modal-close').addEventListener('click', closeModal);
      document.getElementById('video-modal').addEventListener('click', e => {
        if (e.target.id === 'video-modal') closeModal();
      });
      function closeModal() {
        const modal = document.getElementById('video-modal');
        const videoEl = document.getElementById('modal-video');
        modal.classList.remove('active');
        videoEl.pause();
        videoEl.src = '';
        videoEl.innerHTML = '';
      }

      // ===== 上传视频 =====
      const uploadBtn = document.getElementById('upload-btn');
      const fileInput = document.getElementById('video-file');
      const titleInput = document.getElementById('video-title');
      const authorInput = document.getElementById('video-author');
      const descInput = document.getElementById('video-desc');
      const statusEl = document.getElementById('upload-status');

      uploadBtn.addEventListener('click', () => {
        const file = fileInput.files[0];
        if (!file) {
          statusEl.textContent = '请先选择一个视频文件';
          statusEl.className = 'hint warn';
          return;
        }
        if (file.size > 5 * 1024 * 1024) {
          statusEl.textContent = '视频超过 5MB，演示环境无法存储，请选择更小的文件';
          statusEl.className = 'hint warn';
          return;
        }
        const title = titleInput.value.trim() || file.name;
        const author = authorInput.value.trim() || '匿名拳友';
        const desc = descInput.value.trim();

        uploadBtn.disabled = true;
        statusEl.textContent = '正在读取视频，请稍候...';
        statusEl.className = 'hint';

        const reader = new FileReader();
        reader.onload = function(e) {
          const dataUrl = e.target.result;
          // 提取首帧作为封面
          captureThumb(dataUrl, function(thumb) {
            const videos = loadVideos();
            videos.push({
              id: 'v-' + Date.now(),
              title: title,
              author: author,
              desc: desc,
              dataUrl: dataUrl,
              thumb: thumb,
              createdAt: Date.now(),
              isDemo: false
            });
            saveVideos(videos);
            statusEl.textContent = '上传成功！已保存到本地，可在“视频广场”查看。';
            statusEl.className = 'hint';
            fileInput.value = '';
            titleInput.value = '';
            descInput.value = '';
            uploadBtn.disabled = false;
          });
        };
        reader.onerror = function() {
          statusEl.textContent = '读取视频失败，请重试';
          statusEl.className = 'hint warn';
          uploadBtn.disabled = false;
        };
        reader.readAsDataURL(file);
      });

      function captureThumb(dataUrl, callback) {
        const video = document.createElement('video');
        video.src = dataUrl;
        video.muted = true;
        video.playsInline = true;
        video.addEventListener('loadeddata', function() {
          video.currentTime = 0.5;
        });
        video.addEventListener('seeked', function() {
          const canvas = document.createElement('canvas');
          canvas.width = 320;
          canvas.height = 200;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          try {
            callback(canvas.toDataURL('image/jpeg', 0.7));
          } catch (err) {
            callback(null);
          }
        });
        video.addEventListener('error', function() {
          callback(null);
        });
        video.load();
      }

      // ===== 聊天室 =====
      const chatMessages = document.getElementById('chat-messages');
      const chatInput = document.getElementById('chat-input');
      const chatNickname = document.getElementById('chat-nickname');
      const chatSend = document.getElementById('chat-send');

      function renderChat() {
        const messages = loadChat();
        if (messages.length === 0) {
          chatMessages.innerHTML = '<div class="empty-state"><p>还没有消息，打个招呼吧！</p></div>';
          return;
        }
        const me = chatNickname.value.trim() || '我';
        chatMessages.innerHTML = messages.map(m => `
          <div class="chat-msg ${m.self ? 'self' : ''}">
            <div class="sender">${escapeHtml(m.nickname)} · ${formatTime(m.time)}</div>
            <div class="bubble">${escapeHtml(m.text)}</div>
          </div>
        `).join('');
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function sendChat() {
        const text = chatInput.value.trim();
        if (!text) return;
        const nickname = chatNickname.value.trim() || '匿名拳友';
        const messages = loadChat();
        messages.push({
          nickname: nickname,
          text: text,
          time: Date.now(),
          self: true
        });
        // 限制消息数量，避免 localStorage 爆掉
        if (messages.length > 200) messages.splice(0, messages.length - 200);
        saveChat(messages);
        chatInput.value = '';
        renderChat();
      }

      chatSend.addEventListener('click', sendChat);
      chatInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') sendChat();
      });
      chatNickname.addEventListener('change', renderChat);

      // ===== 工具函数 =====
      function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      // 初始化
      renderVideos();
      renderChat();
    })();
  </script>
  <script src="./assets/taiji-demo.js"></script>
</body>
</html>
