<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灵岛 LingDao - 可拖拽式工作学习分区导航</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-gradient: linear-gradient(135deg, #0ea5e9 0%, #0284c7 50%, #075985 100%);
      --accent-glow: rgba(14, 165, 233, 0.3);
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.06);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
    }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: linear-gradient(135deg, #020617 0%, #0f172a 40%, #1e293b 100%);
      min-height: 100vh;
      color: var(--text-primary);
      overflow-x: hidden;
    }

    .glass-effect {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
    }

    .header {
      padding: 28px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      animation: fadeInDown 0.8s ease-out;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: var(--primary-gradient);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px var(--accent-glow);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .logo-icon:hover {
      transform: scale(1.05) rotate(5deg);
      box-shadow: 0 12px 40px var(--accent-glow);
    }

    .logo-text {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 0%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .logo-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: -2px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .search-container {
      flex: 1;
      max-width: 480px;
      margin: 0 48px;
      position: relative;
    }

    .search-box {
      width: 100%;
      padding: 14px 24px 14px 48px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-primary);
      font-size: 14px;
      font-family: 'Noto Sans SC', sans-serif;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .search-box:focus {
      outline: none;
      border-color: rgba(14, 165, 233, 0.4);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-box::placeholder {
      color: var(--text-muted);
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 18px;
      height: 18px;
    }

    .add-btn {
      padding: 14px 28px;
      border-radius: 16px;
      background: var(--primary-gradient);
      color: white;
      border: none;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Noto Sans SC', sans-serif;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .add-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px var(--accent-glow);
    }

    .scene-switcher {
      padding: 24px 48px;
      display: flex;
      gap: 16px;
      border-bottom: 1px solid var(--card-border);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .scene-switcher::-webkit-scrollbar {
      display: none;
    }

    .scene-tab {
      padding: 12px 32px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      font-family: 'Noto Sans SC', sans-serif;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .scene-tab:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      transform: translateY(-1px);
    }

    .scene-tab.active {
      background: rgba(14, 165, 233, 0.15);
      color: #bae6fd;
      border-color: rgba(14, 165, 233, 0.3);
      box-shadow: 0 0 20px rgba(14, 165, 233, 0.1);
    }

    .main-content {
      padding: 48px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 28px;
      max-width: 1500px;
      margin: 0 auto;
    }

    .zone-card {
      border-radius: 24px;
      padding: 28px;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: grab;
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.01));
      border: 1px solid var(--card-border);
    }

    .zone-card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .zone-card:active {
      cursor: grabbing;
    }

    .zone-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      border-radius: 24px 24px 0 0;
    }

    .zone-card::after {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .zone-card:hover::after {
      opacity: 1;
    }

    .drag-handle {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      opacity: 0;
      transition: all 0.3s ease;
      cursor: grab;
    }

    .zone-card:hover .drag-handle {
      opacity: 1;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .zone-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .zone-title {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .zone-icon-wrapper {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      transition: transform 0.3s ease;
    }

    .zone-card:hover .zone-icon-wrapper {
      transform: scale(1.1);
    }

    .zone-name {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }

    .zone-count {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .zone-actions {
      display: flex;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .zone-card:hover .zone-actions {
      opacity: 1;
    }

    .action-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .links-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .link-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 20px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      border: 1px solid transparent;
    }

    .link-item::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 16px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .link-item:hover::before {
      opacity: 1;
    }

    .link-item:hover {
      background: rgba(255, 255, 255, 0.06);
      transform: translateY(-4px) scale(1.02);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .link-icon-wrapper {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      transition: transform 0.3s ease;
    }

    .link-item:hover .link-icon-wrapper {
      transform: scale(1.1);
    }

    .link-name {
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
    }

    .link-add {
      background: rgba(255, 255, 255, 0.01);
      border: 2px dashed var(--card-border);
      color: var(--text-muted);
      font-size: 22px;
    }

    .link-add:hover {
      background: rgba(14, 165, 233, 0.08);
      border-color: rgba(14, 165, 233, 0.3);
      color: #0ea5e9;
      transform: translateY(-2px);
    }

    .link-add .link-icon-wrapper {
      background: transparent;
    }

    .zone-card.work::before { background: linear-gradient(90deg, #3b82f6, #60a5fa, #93c5fd); }
    .zone-card.study::before { background: linear-gradient(90deg, #10b981, #34d399, #6ee7b7); }
    .zone-card.creative::before { background: linear-gradient(90deg, #8b5cf6, #a78bfa, #c4b5fd); }
    .zone-card.public-good::before { background: linear-gradient(90deg, #ef4444, #f87171, #fca5a5); }

    .zone-icon-wrapper.work { background: linear-gradient(135deg, #3b82f6, #1d4ed8); box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3); }
    .zone-icon-wrapper.study { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3); }
    .zone-icon-wrapper.creative { background: linear-gradient(135deg, #8b5cf6, #7c3aed); box-shadow: 0 4px 16px rgba(139, 92, 246, 0.3); }
    .zone-icon-wrapper.public-good { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 4px 16px rgba(239, 68, 68, 0.3); }

    .link-icon-wrapper.jira { background: linear-gradient(135deg, #0052cc, #003399); }
    .link-icon-wrapper.notion { background: linear-gradient(135deg, #000000, #333333); }
    .link-icon-wrapper.mail { background: linear-gradient(135deg, #ea4335, #c23321); }
    .link-icon-wrapper.calendar { background: linear-gradient(135deg, #fbbc05, #f59e0b); }
    .link-icon-wrapper.slack { background: linear-gradient(135deg, #4a154b, #3a0f3a); }
    .link-icon-wrapper.coursera { background: linear-gradient(135deg, #1f75c4, #16539e); }
    .link-icon-wrapper.leetcode { background: linear-gradient(135deg, #fe7a16, #d96000); }
    .link-icon-wrapper.github { background: linear-gradient(135deg, #333333, #1a1a1a); }
    .link-icon-wrapper.medium { background: linear-gradient(135deg, #00ab6c, #008a55); }
    .link-icon-wrapper.figma { background: linear-gradient(135deg, #f24e1e, #e54000); }
    .link-icon-wrapper.photoshop { background: linear-gradient(135deg, #00c8ff, #0077b6); }
    .link-icon-wrapper.eco { background: linear-gradient(135deg, #22c55e, #16a34a); }
    .link-icon-wrapper.volunteer { background: linear-gradient(135deg, #ec4899, #db2777); }
    .link-icon-wrapper.donate { background: linear-gradient(135deg, #f59e0b, #d97706); }

    .footer {
      padding: 32px 48px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      border-top: 1px solid var(--card-border);
      margin-top: 48px;
      animation: fadeInUp 0.8s ease-out 0.5s both;
    }

    .floating-add {
      position: fixed;
      bottom: 48px;
      right: 48px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--primary-gradient);
      color: white;
      border: none;
      font-size: 28px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 32px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .floating-add:hover {
      transform: translateY(-6px) scale(1.1);
      box-shadow: 0 16px 48px var(--accent-glow);
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .zone-card:nth-child(1) { animation: slideIn 0.6s ease-out 0.1s both; }
    .zone-card:nth-child(2) { animation: slideIn 0.6s ease-out 0.2s both; }
    .zone-card:nth-child(3) { animation: slideIn 0.6s ease-out 0.3s both; }
    .zone-card:nth-child(4) { animation: slideIn 0.6s ease-out 0.4s both; }

    .link-item { animation: fadeInUp 0.4s ease-out both; }
    .link-item:nth-child(1) { animation-delay: 0.2s; }
    .link-item:nth-child(2) { animation-delay: 0.25s; }
    .link-item:nth-child(3) { animation-delay: 0.3s; }
    .link-item:nth-child(4) { animation-delay: 0.35s; }
    .link-item:nth-child(5) { animation-delay: 0.4s; }
    .link-item:nth-child(6) { animation-delay: 0.45s; }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        gap: 20px;
        padding: 20px;
      }

      .search-container {
        width: 100%;
        margin: 0;
      }

      .scene-switcher {
        padding: 16px;
        gap: 12px;
      }

      .main-content {
        padding: 20px;
        grid-template-columns: 1fr;
      }

      .links-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .floating-add {
        bottom: 24px;
        right: 24px;
        width: 56px;
        height: 56px;
        font-size: 24px;
      }

      .footer {
        padding: 24px 20px;
      }
    }

    @media (max-width: 480px) {
      .links-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .zone-card {
        padding: 20px;
      }

      .zone-name {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <header class="header glass-effect">
    <div class="logo">
      <div class="logo-icon">
        <i data-lucide="island" width="24" height="24"></i>
      </div>
      <div>
        <div class="logo-text">灵岛 LingDao</div>
        <div class="logo-subtitle">Personal Navigation</div>
      </div>
    </div>
    
    <div class="search-container">
      <i data-lucide="search" class="search-icon"></i>
      <input type="text" class="search-box" placeholder="搜索工具、链接..." />
    </div>

    <button class="add-btn">
      <i data-lucide="plus" width="18" height="18"></i>
      <span>添加分区</span>
    </button>
  </header>

  <div class="scene-switcher">
    <button class="scene-tab active">全部</button>
    <button class="scene-tab">工作工具</button>
    <button class="scene-tab">学习平台</button>
    <button class="scene-tab">创意设计</button>
    <button class="scene-tab">公益行动</button>
  </div>

  <main class="main-content">
    <div class="zone-card work">
      <div class="drag-handle">
        <i data-lucide="grip-vertical" width="14" height="14"></i>
      </div>
      <div class="zone-header">
        <div class="zone-title">
          <div class="zone-icon-wrapper work">
            <i data-lucide="briefcase" width="20" height="20"></i>
          </div>
          <div>
            <div class="zone-name">工作工具</div>
            <div class="zone-count">6 个链接</div>
          </div>
        </div>
        <div class="zone-actions">
          <button class="action-btn"><i data-lucide="edit-2" width="14" height="14"></i></button>
          <button class="action-btn"><i data-lucide="trash-2" width="14" height="14"></i></button>
        </div>
      </div>
      <div class="links-grid">
        <div class="link-item">
          <div class="link-icon-wrapper jira">
            <i data-lucide="ticket" width="16" height="16"></i>
          </div>
          <div class="link-name">Jira</div>
        </div>
        <div class="link-item">
          <div class="link-icon-wrapper notion">
            <i data-lucide="file-text" width="16" height="16"></i>
          </div>
          <div class="link-name">Notion</div>
        </div>
        <div class="link-item">
          <div class="link-icon-wrapper mail">
            <i data-lucide="mail" width="16" height="16"></i>
          </div>
          <div class="link-name">邮箱</div>
        </div>
        <div class="link-item">
          <div class="link-icon-wrapper calendar">
            <i data-lucide="calendar" width="16" height="16"></i>
          </div>
          <div class="link-name">日程</div>
        </div>
        <div class="link-item">
          <div class="link-icon-wrapper slack">
            <i data-lucide="message-circle" width="16" height="16"></i>
          </div>
          <div class="link-name">Slack</div>
        </div>
        <div class="link-item link-add">
          <div class="link-icon-wrapper"><i data-lucide="plus" width="18" height="18"></i></div>
        </div>
      </div>
    </div>

    <div class="zone-card study">
      <div class="drag-handle">
        <i data-lucide="grip-vertical" width="14" height="14"></i>
      </div>
      <div class="zone-header">
        <div class="zone-title">
          <div class="zone-icon-wrapper study">
            <i data-lucide="book-open" width="20" height="20"></i>
          </div>
          <div>
            <div class="zone-name">学习平台</div>
            <div class="zone-count">4 个链接</div>
          </div>
        </div>
        <div class="zone-actions">
          <button class="action-btn"><i data-lucide="edit-2" width="14" height="14"></i></button>
          <button class="action-btn"><i data-lucide="trash-2" width="14" height="14"></i></button>
        </div>
      </div>
      <div class="links-grid">
        <div class="link-item">
          <div class="link-icon-wrapper coursera">
            <i data-lucide="graduation-cap" width="16" height="16"></i>
          </div>
          <div class="link-name">Coursera</div>
        </div>
        <div class="link-item">
          <div class="link-icon-wrapper leetcode">
            <i data-lucide="code" width="16" height="16"></i>
          </div>
          <div class="link-name">LeetCode</div>
        </div>
        <div class="link-item">
          <div class="link-icon-wrapper github">
            <i data-lucide="github" width="16" height="16"></i>
          </div>
          <div class="link-name">GitHub</div>
        </div>
        <div class="link-item">
          <div class="link-icon-wrapper medium">
            <i data-lucide="pen-tool" width="16" height="16"></i>
          </div>
          <div class="link-name">Medium</div>
        </div>
        <div class="link-item link-add">
          <div class="link-icon-wrapper"><i data-lucide="plus" width="18" height="18"></i></div>
        </div>
        <div class="link-item link-add">
          <div class="link-icon-wrapper"><i data-lucide="plus" width="18" height="18"></i></div>
        </div>
      </div>
    </div>

    <div class="zone-card creative">
      <div class="drag-handle">
        <i data-lucide="grip-vertical" width="14" height="14"></i>
      </div>
      <div class="zone-header">
        <div class="zone-title">
          <div class="zone-icon-wrapper creative">
            <i data-lucide="palette" width="20" height="20"></i>
          </div>
          <div>
            <div class="zone-name">创意设计</div>
            <div class="zone-count">2 个链接</div>
          </div>
        </div>
        <div class="zone-actions">
