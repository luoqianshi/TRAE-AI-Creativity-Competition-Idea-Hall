:root {
  /* ── Brand Primary ── */
  --brand-primary: #1B3A5C;
  --brand-primary-light: #2A5A8C;
  --brand-primary-lighter: #3A7AB8;
  --brand-primary-dark: #0F2440;

  --brand-primary-100: rgba(27, 58, 92, 0.10);
  --brand-primary-200: rgba(27, 58, 92, 0.20);

  /* ── Backgrounds ── */
  --bg-base: #F0F2F5;
  --bg-surface: #FFFFFF;
  --bg-elevated: #FFFFFF;
  --bg-sidebar: #0F2440;
  --bg-sidebar-hover: rgba(255, 255, 255, 0.08);
  --bg-sidebar-active: rgba(42, 90, 140, 0.50);
  --bg-topbar: #FFFFFF;
  --bg-card: #FFFFFF;
  --bg-card-hover: #F7F9FB;
  --bg-input: #F5F7FA;
  --bg-overlay: rgba(15, 36, 64, 0.45);

  /* ── Text ── */
  --text-primary: #1A2332;
  --text-secondary: #5A6B7F;
  --text-tertiary: #8A97A8;
  --text-inverse: #FFFFFF;
  --text-sidebar: rgba(255, 255, 255, 0.70);
  --text-sidebar-active: #FFFFFF;
  --text-link: #2A5A8C;

  /* ── Borders ── */
  --border-default: #E4E8EE;
  --border-light: #F0F2F5;
  --border-strong: #C8D1DC;
  --border-card: #E4E8EE;

  /* ── State Colors ── */
  --state-success: #1B8C5A;
  --state-success-bg: rgba(27, 140, 90, 0.08);
  --state-warning: #D4880F;
  --state-warning-bg: rgba(212, 136, 15, 0.08);
  --state-error: #C0392B;
  --state-error-bg: rgba(192, 57, 43, 0.08);
  --state-info: #2A5A8C;
  --state-info-bg: rgba(42, 90, 140, 0.08);

  /* ── Risk Level Colors ── */
  --risk-high: #C0392B;
  --risk-high-bg: rgba(192, 57, 43, 0.10);
  --risk-warning: #D4880F;
  --risk-warning-bg: rgba(212, 136, 15, 0.10);
  --risk-normal: #1B8C5A;
  --risk-normal-bg: rgba(27, 140, 90, 0.10);

  /* ── Shadows ── */
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.08);
  --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.10);
  --shadow-overlay: 0 8px 32px rgba(0, 0, 0, 0.16);

  /* ── Radius ── */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* ── Spacing ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* ── Typography ── */
  --font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "SF Mono", "Cascadia Code", "Consolas", monospace;
  --font-size-xs: 12px;
  --font-size-sm: 13px;
  --font-size-base: 14px;
  --font-size-md: 15px;
  --font-size-lg: 16px;
  --font-size-xl: 18px;
  --font-size-2xl: 20px;
  --font-size-3xl: 24px;
  --font-size-4xl: 28px;
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.75;

  /* ── Layout ── */
  --sidebar-width: 220px;
  --topbar-height: 56px;
  --content-max-width: 1440px;

  /* ── Transitions ── */
  --transition-fast: 150ms ease;
  --transition-base: 200ms ease;
  --transition-slow: 300ms ease;
}

    <style>
    /* ── Desktop wrapper ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      font-family: var(--font-family);
      background: var(--bg-base);
      overflow: auto;
    }

    .desktop-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--space-8);
      position: relative;
    }

    /* ── Back link ── */
    .back-link {
      position: absolute;
      top: var(--space-6);
      left: var(--space-6);
      font-size: var(--font-size-sm);
      color: var(--text-link);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: var(--space-1);
      transition: color var(--transition-fast);
    }
    .back-link:hover { color: var(--brand-primary-lighter); text-decoration: underline; }

    /* ── Phone frame ── */
    .phone-frame {
      width: 390px;
      height: 844px;
      border-radius: 40px;
      border: 8px solid #1A2332;
      background: #F0F2F5;
      box-shadow:
        0 0 0 2px #2A3A4A,
        0 20px 60px rgba(0,0,0,0.25),
        0 4px 16px rgba(0,0,0,0.12),
        inset 0 0 0 2px rgba(255,255,255,0.05);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* Notch */
    .phone-notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 34px;
      background: #1A2332;
      border-radius: 0 0 20px 20px;
      z-index: 10;
    }
    .phone-notch::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 6px;
      background: #2A3A4A;
      border-radius: 3px;
    }

    /* ── Phone inner content area ── */
    .phone-content {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      background: #F0F2F5;
      position: relative;
    }
    .phone-content::-webkit-scrollbar { width: 0; }

    /* ── Status bar ── */
    .status-bar {
      height: 50px;
      padding: 14px 20px 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-surface);
      position: sticky;
      top: 0;
      z-index: 5;
      flex-shrink: 0;
    }
    .status-left {
      font-size: 15px;
      font-weight: var(--font-weight-semibold);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-right {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .status-icons {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    /* Mini program capsule button */
    .mp-capsule {
      display: flex;
      align-items: center;
      gap: 1px;
      background: #F0F2F5;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 16px;
      padding: 2px 2px;
      margin-left: 8px;
    }
    .mp-capsule-btn {
      width: 28px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      cursor: pointer;
    }
    .mp-capsule-btn:hover { background: rgba(0,0,0,0.06); }
    .mp-capsule-dots { font-size: 14px; color: #5A6B7F; letter-spacing: 1px; }
    .mp-capsule-close { font-size: 14px; color: #5A6B7F; }
    .mp-capsule-divider { width: 1px; height: 16px; background: rgba(0,0,0,0.15); }

    /* ── App header ── */
    .app-header {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-light);
      position: relative;
      flex-shrink: 0;
    }
    .app-header-title {
      font-size: 17px;
      font-weight: var(--font-weight-semibold);
      color: var(--text-primary);
    }
    .app-header-back {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: var(--radius-full);
    }
    .app-header-back:hover { background: rgba(0,0,0,0.04); }

    /* ── Scrollable body ── */
    .app-body {
      flex: 1;
      padding: var(--space-4);
      padding-bottom: 70px;
      overflow-y: auto;
    }
    .app-body::-webkit-scrollbar { width: 0; }

    /* ── Quick actions grid ── */
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-3);
      margin-bottom: var(--space-4);
    }
    .quick-action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-2);
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: box-shadow var(--transition-fast);
    }
    .quick-action-item:hover { box-shadow: var(--shadow-sm); }
    .quick-action-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .quick-action-icon.blue { background: rgba(42, 90, 140, 0.12); }
    .quick-action-icon.green { background: rgba(27, 140, 90, 0.12); }
    .quick-action-icon.orange { background: rgba(212, 136, 15, 0.12); }
    .quick-action-icon.purple { background: rgba(108, 92, 168, 0.12); }
    .quick-action-icon.red { background: rgba(192, 57, 43, 0.10); position: relative; }
    .quick-action-icon.gray { background: rgba(90, 107, 127, 0.10); }
    .quick-action-label {
      font-size: var(--font-size-xs);
      color: var(--text-primary);
      text-align: center;
      line-height: 1.3;
    }
    .badge-dot {
      position: absolute;
      top: -2px;
      right: -2px;
      min-width: 16px;
      height: 16px;
      background: var(--state-error);
      color: #fff;
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }

    /* ── Section card ── */
    .section-card {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-4);
      box-shadow: var(--shadow-xs);
    }
    .section-header {
      font-size: var(--font-size-md);
      font-weight: var(--font-weight-semibold);
      color: var(--text-primary);
      margin-bottom: var(--space-3);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .section-header-more {
      font-size: var(--font-size-xs);
      color: var(--text-tertiary);
      font-weight: var(--font-weight-normal);
      cursor: pointer;
    }

    /* ── Task items ── */
    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--border-light);
    }
    .task-item:last-child { border-bottom: none; }
    .task-info {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .task-dot {
      width: 8px;
      height: 8px;
      border-radius: var(--radius-full);
      flex-shrink: 0;
    }
    .task-dot.blue { background: var(--state-info); }
    .task-dot.yellow { background: var(--state-warning); }
    .task-dot.green { background: var(--state-success); }
    .task-name {
      font-size: var(--font-size-sm);
      color: var(--text-primary);
    }
    .task-status {
      font-size: 11px;
      font-weight: var(--font-weight-medium);
      padding: 2px 8px;
      border-radius: var(--radius-full);
      flex-shrink: 0;
    }
    .task-status.progress { background: var(--state-info-bg); color: var(--state-info); }
    .task-status.pending { background: var(--state-warning-bg); color: var(--state-warning); }
    .task-status.done { background: var(--state-success-bg); color: var(--state-success); }

    /* ── Alert items ── */
    .alert-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3);
      margin-bottom: var(--space-2);
      background: var(--risk-high-bg);
      border-radius: var(--radius-md);
      border-left: 3px solid var(--risk-high);
    }
    .alert-item:last-child { margin-bottom: 0; border-left-color: var(--risk-warning); background: var(--risk-warning-bg); }
    .alert-icon { flex-shrink: 0; font-size: 16px; }
    .alert-text {
      flex: 1;
      font-size: var(--font-size-sm);
      color: var(--text-primary);
      line-height: 1.4;
    }
    .alert-time {
      font-size: 11px;
      color: var(--text-tertiary);
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* ── Bottom tab bar ── */
    .tab-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-default);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 4px 0 12px 0;
      z-index: 5;
      flex-shrink: 0;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      flex: 1;
      padding: 4px 0;
    }
    .tab-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tab-label {
      font-size: 10px;
      color: var(--text-tertiary);
    }
    .tab-item.active .tab-label { color: var(--brand-primary-light); font-weight: var(--font-weight-medium); }

    /* ── Phone label ── */
    .phone-label {
      margin-top: var(--space-6);
      font-size: var(--font-size-sm);
      color: var(--text-tertiary);
      text-align: center;
    }
  </style>
</body>
</html>
