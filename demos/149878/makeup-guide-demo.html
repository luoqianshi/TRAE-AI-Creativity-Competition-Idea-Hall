            <option value="2">最多缺 2 个</option>

  <script>
    const defaultTools = [

    const looks = [
      {

        styles: ["自然", "高级"],
        occasions: ["通勤", "约会"],
        faces: ["鹅蛋脸", "圆脸", "方脸", "长脸", "菱形脸"],
        tones: ["暖调", "中性调"],

      },
      {
        name: "低饱和甜妹妆",
        styles: ["甜美", "自然"],
        occasions: ["约会", "拍照"],
        faces: ["圆脸", "鹅蛋脸", "菱形脸"],

        difficulty: "中等",

        steps: ["底妆保持轻薄，重点修饰黑眼圈。", "粉色眼影少量铺在眼皮中央。", "腮红横向扫在眼下和鼻尖。", "唇釉点涂后用手指晕开。"]
      },
      {
        name: "清冷消肿眼妆",
        styles: ["清冷", "高级"],
        occasions: ["通勤", "拍照"],
        faces: ["长脸", "菱形脸", "鹅蛋脸"],
        tones: ["冷调", "中性调"],
        difficulty: "中等",
        time: "16 分钟",
        required: ["粉底液", "灰棕色眼影", "睫毛夹", "睫毛膏", "裸色口红"],
        steps: ["底妆选择半哑光质感。", "灰棕色眼影加深眼尾，压低肿胀感。", "夹翘睫毛后刷一层睫毛膏。", "裸色口红弱化唇部存在感。"]
      },
      {
        name: "复古浓颜聚会妆",
        styles: ["浓颜", "高级"],
        occasions: ["聚会", "拍照"],
        faces: ["方脸", "鹅蛋脸", "长脸"],
        tones: ["暖调", "冷调", "中性调"],
        difficulty: "进阶",
        time: "28 分钟",
        required: ["粉底液", "修容", "高光", "黑色眼线笔", "红棕色口红", "散粉"],
        steps: ["底妆提高遮瑕度，保持干净边界。", "修容加强颧骨和下颌线。", "眼线顺着眼尾拉长。", "高光点在鼻梁和颧骨。", "红棕色口红勾勒清晰唇线。"]
      },
      {
        name: "奶茶温柔约会妆",
        styles: ["甜美", "自然", "高级"],
        occasions: ["约会", "通勤"],
        faces: ["鹅蛋脸", "圆脸", "长脸"],

      }
    ];

    let tools = JSON.parse(localStorage.getItem("makeupTools") || "null") || defaultTools.slice();

    const els = {
      tabs: document.querySelectorAll(".tab"),
      sections: document.querySelectorAll(".section"),
      photoInput: document.getElementById("photoInput"),
      photoBox: document.getElementById("photoBox"),
      faceShape: document.getElementById("faceShape"),
      skinTone: document.getElementById("skinTone"),
      style: document.getElementById("style"),
      occasion: document.getElementById("occasion"),
      toolCategory: document.getElementById("toolCategory"),
      toolName: document.getElementById("toolName"),
      addTool: document.getElementById("addTool"),
      resetTools: document.getElementById("resetTools"),
      toolChips: document.getElementById("toolChips"),
      maxMissing: document.getElementById("maxMissing"),
      difficulty: document.getElementById("difficulty"),
      fillExample: document.getElementById("fillExample"),
      clearAll: document.getElementById("clearAll"),
      profileText: document.getElementById("profileText"),
      profileChips: document.getElementById("profileChips"),
      results: document.getElementById("results"),
      phoneScore: document.getElementById("phoneScore"),
      phoneLook: document.getElementById("phoneLook"),
      phoneMeta: document.getElementById("phoneMeta"),
      phoneTools: document.getElementById("phoneTools"),
      modal: document.getElementById("modal"),
      modalTitle: document.getElementById("modalTitle"),
      modalDesc: document.getElementById("modalDesc"),
      modalSteps: document.getElementById("modalSteps"),
      modalTools: document.getElementById("modalTools"),
      jumpTutorial: document.getElementById("jumpTutorial"),
      closeModal: document.getElementById("closeModal")
    };

    function profile() {
      return {
        faceShape: els.faceShape.value,
        skinTone: els.skinTone.value,
        style: els.style.value,
        occasion: els.occasion.value,
        maxMissing: Number(els.maxMissing.value),
        difficulty: els.difficulty.value
      };
    }

    function saveTools() {
      localStorage.setItem("makeupTools", JSON.stringify(tools));
    }

    function toolNames() {
      return tools.map(t => t.name.trim()).filter(Boolean);
    }

    function scoreLook(look, p) {
      const owned = toolNames();
      const missing = look.required.filter(item => !owned.includes(item));
      const toolScore = Math.round(((look.required.length - missing.length) / look.required.length) * 50);
      const styleScore = look.styles.includes(p.style) ? 18 : 6;
      const occasionScore = look.occasions.includes(p.occasion) ? 14 : 4;
      const faceScore = look.faces.includes(p.faceShape) ? 10 : 4;
      const toneScore = look.tones.includes(p.skinTone) ? 8 : 3;
      return {
        ...look,
        score: Math.min(100, toolScore + styleScore + occasionScore + faceScore + toneScore),
        missing,
        owned: look.required.filter(item => owned.includes(item)),
        toolRate: Math.round(((look.required.length - missing.length) / look.required.length) * 100)
      };
    }

    function tutorialUrl(look) {
      return "https://search.bilibili.com/all?keyword=" + encodeURIComponent(look.name + " 化妆教程");
    }

    function renderTools() {
      els.toolChips.innerHTML = "";
      if (!tools.length) {
        els.toolChips.innerHTML = '<div class="empty">还没有添加工具</div>';
        return;
      }
      tools.forEach((tool, index) => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.innerHTML = `<b>${tool.category}</b>${tool.name}<button title="删除">×</button>`;
        chip.querySelector("button").addEventListener("click", () => {
          tools.splice(index, 1);
          saveTools();
          render();
        });
        els.toolChips.appendChild(chip);
      });
    }

    function renderProfile(p) {
      els.profileText.textContent = `当前档案：${p.faceShape}、${p.skinTone}肤色、偏好${p.style}风格，使用场景为${p.occasion}。`;
      els.profileChips.innerHTML = "";
      [p.faceShape, p.skinTone, p.style, p.occasion, `允许缺 ${p.maxMissing === 99 ? "不限" : p.maxMissing} 个工具`, p.difficulty].forEach(item => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = item;
        els.profileChips.appendChild(chip);
      });
      els.phoneTools.textContent = toolNames().slice(0, 5).join(" / ") || "暂无工具";
    }

    function renderResults() {
      const p = profile();
      let ranked = looks
        .map(look => scoreLook(look, p))
        .filter(look => look.missing.length <= p.maxMissing)
        .filter(look => p.difficulty === "全部" || look.difficulty === p.difficulty)
        .sort((a, b) => b.score - a.score);

      els.results.innerHTML = "";
      if (!ranked.length) {
        els.results.innerHTML = '<div class="empty">暂时没有符合条件的妆容。可以放宽“允许缺少工具数量”，或添加更多化妆工具。</div>';
        els.phoneLook.textContent = "暂无匹配推荐";
        els.phoneMeta.textContent = "请放宽筛选或补充工具";
        els.phoneScore.textContent = "0%";
        return;
      }

      const top = ranked[0];
      els.phoneLook.textContent = top.name;
      els.phoneMeta.textContent = `适配 ${top.score}% / 工具 ${top.toolRate}% / ${top.time}`;
      els.phoneScore.textContent = `${top.score}%`;

      ranked.forEach(look => {
        const card = document.createElement("article");
        card.className = "result-card";
        card.innerHTML = `
          <div class="result-head">
            <div>
              <h3>${look.name}</h3>
              <p class="sub">${look.time} · ${look.difficulty} · 工具匹配 ${look.toolRate}%</p>
            </div>
            <div class="score">${look.score}</div>
          </div>
          <div class="progress"><span style="width:${look.score}%"></span></div>
          <div class="meta">
            ${look.styles.map(s => `<span>${s}</span>`).join("")}
            ${look.occasions.map(s => `<span>${s}</span>`).join("")}
          </div>
          <ul class="list">
            <li class="ok">已有工具：${look.owned.length ? look.owned.join("、") : "暂无"}</li>
            <li class="${look.missing.length ? "missing" : "ok"}">缺少工具：${look.missing.length ? look.missing.join("、") : "无，可直接尝试"}</li>
          </ul>
          <div class="row">
            <button data-action="steps">查看步骤</button>
            <button class="secondary" data-action="jump">跳转教程</button>
          </div>
        `;
        card.querySelector('[data-action="steps"]').addEventListener("click", () => openTutorial(look));
        card.querySelector('[data-action="jump"]').addEventListener("click", () => {
          window.open(tutorialUrl(look), "_blank", "noopener");
        });
        els.results.appendChild(card);
      });
    }

    function openTutorial(look) {
      els.modalTitle.textContent = look.name;
      els.modalDesc.textContent = `${look.time} · ${look.difficulty} · 工具匹配 ${look.toolRate}%`;
      els.modalSteps.innerHTML = look.steps.map(step => `<li>${step}</li>`).join("");
      els.modalTools.innerHTML = `
        <span class="ok">已有：${look.owned.length ? look.owned.join("、") : "暂无"}</span><br>
        <span class="${look.missing.length ? "missing" : "ok"}">缺少：${look.missing.length ? look.missing.join("、") : "无"}</span>
      `;
      els.jumpTutorial.onclick = () => window.open(tutorialUrl(look), "_blank", "noopener");
      els.modal.classList.add("show");
    }

    function render() {
      const p = profile();
      renderTools();
      renderProfile(p);
      renderResults();
    }

    els.tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        els.tabs.forEach(t => t.classList.remove("active"));
        els.sections.forEach(s => s.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById(tab.dataset.tab).classList.add("active");
      });
    });

    els.photoInput.addEventListener("change", event => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        els.photoBox.innerHTML = `<img src="${reader.result}" alt="自拍预览">`;
      };
      reader.readAsDataURL(file);
    });

    els.addTool.addEventListener("click", () => {
      const name = els.toolName.value.trim();
      if (!name) {
        alert("请先输入工具名称");
        return;
      }
      tools.push({ category: els.toolCategory.value, name });
      els.toolName.value = "";
      saveTools();
      render();
    });

    els.resetTools.addEventListener("click", () => {
      tools = defaultTools.slice();
      saveTools();
      render();
    });

    els.fillExample.addEventListener("click", () => {
      els.faceShape.value = "鹅蛋脸";
      els.skinTone.value = "暖调";
      els.style.value = "自然";
      els.occasion.value = "通勤";
      els.maxMissing.value = "1";
      els.difficulty.value = "全部";
      tools = defaultTools.slice();
      saveTools();
      render();
    });

    els.clearAll.addEventListener("click", () => {
      tools = [];
      saveTools();
      render();
    });

    [els.faceShape, els.skinTone, els.style, els.occasion, els.maxMissing, els.difficulty].forEach(el => {
      el.addEventListener("change", render);
    });

    els.closeModal.addEventListener("click", () => els.modal.classList.remove("show"));
    els.modal.addEventListener("click", event => {
      if (event.target === els.modal) els.modal.classList.remove("show");
    });

    render();
  </script>
</body>
</html>
