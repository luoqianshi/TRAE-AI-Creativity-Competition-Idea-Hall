<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>村务数据管理系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #2c7a4a;
  --primary-dark: #1e5c36;
  --primary-light: #e8f5e9;
  --secondary: #f57c00;
  --danger: #c62828;
  --warning: #f9a825;
  --info: #1565c0;
  --bg: #f0f2f5;
  --card-bg: #fff;
  --text: #333;
  --text-light: #666;
  --border: #ddd;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --radius: 8px;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
.header {
  background: var(--primary);
  color: white;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  position: sticky;
  top: 0;
  z-index: 100;
}
.header h1 { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.header .subtitle { font-size: 13px; opacity: 0.9; margin-top: 2px; }
.header-actions { display: flex; gap: 10px; }
.container { display: flex; min-height: calc(100vh - 64px); }
.sidebar {
  width: 220px;
  background: var(--card-bg);
  border-right: 1px solid var(--border);
  padding: 16px 0;
  flex-shrink: 0;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  cursor: pointer;
  transition: all 0.2s;
  border-left: 3px solid transparent;
  font-size: 14px;
}
.nav-item:hover { background: var(--primary-light); color: var(--primary); }
.nav-item.active { background: var(--primary-light); color: var(--primary); border-left-color: var(--primary); font-weight: 600; }
.nav-icon { width: 22px; text-align: center; font-size: 16px; }
.main-content { flex: 1; padding: 20px; overflow-y: auto; }
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
  margin-bottom: 20px;
}
.card-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--primary-light);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.2s;
  white-space: nowrap;
}
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-secondary { background: #e3f2fd; color: var(--info); }
.btn-secondary:hover { background: #bbdefb; }
.btn-warning { background: #fff3e0; color: var(--secondary); }
.btn-warning:hover { background: #ffe0b2; }
.btn-danger { background: #ffebee; color: var(--danger); }
.btn-danger:hover { background: #ffcdd2; }
.btn-success { background: var(--primary-light); color: var(--primary-dark); }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.toolbar {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  align-items: center;
}
.search-box {
  display: flex;
  gap: 8px;
  flex: 1;
  min-width: 280px;
}
.search-box input, .form-input, .form-select {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
}
.search-box input:focus, .form-input:focus, .form-select:focus { border-color: var(--primary); }
.search-box input { flex: 1; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; }
th {
  background: #f8f9fa;
  font-weight: 600;
  color: var(--text-light);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
tr:hover { background: #fafafa; }
.table-actions { display: flex; gap: 6px; }
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 500;
}
.badge-success { background: var(--primary-light); color: var(--primary-dark); }
.badge-warning { background: #fff3e0; color: var(--secondary); }
.badge-danger { background: #ffebee; color: var(--danger); }
.badge-info { background: #e3f2fd; color: var(--info); }
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.45);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: white;
  border-radius: var(--radius);
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  width: 100%;
  max-width: 700px;
  max-height: 90vh;
  overflow-y: auto;
  animation: modalSlide 0.25s ease;
}
@keyframes modalSlide {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}
.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-header h3 { font-size: 16px; }
.modal-close { cursor: pointer; font-size: 20px; color: var(--text-light); background: none; border: none; }
.modal-close:hover { color: var(--danger); }
.modal-body { padding: 20px; }
.modal-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}
.form-row { display: flex; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
.form-group { flex: 1; min-width: 200px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-light); margin-bottom: 4px; }
.form-group .required::after { content: " *"; color: var(--danger); }
.form-input, .form-select { width: 100%; }
.form-hint { font-size: 11px; color: #999; margin-top: 4px; }
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  text-align: center;
  border-top: 3px solid var(--primary);
}
.stat-card.orange { border-top-color: var(--secondary); }
.stat-card.blue { border-top-color: var(--info); }
.stat-card.red { border-top-color: var(--danger); }
.stat-value { font-size: 28px; font-weight: 700; color: var(--primary); margin: 6px 0; }
.stat-card.orange .stat-value { color: var(--secondary); }
.stat-card.blue .stat-value { color: var(--info); }
.stat-card.red .stat-value { color: var(--danger); }
.stat-label { font-size: 12px; color: var(--text-light); }
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-light);
}
.empty-state-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-top: 16px;
}
.page-btn {
  padding: 5px 12px;
  border: 1px solid var(--border);
  background: white;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
}
.page-btn:hover { background: var(--primary-light); }
.page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
.page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 16px; }
.tab {
  padding: 10px 18px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: all 0.2s;
}
.tab:hover { color: var(--primary); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.tab-content { display: none; }
.tab-content.active { display: block; }
.import-area {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 40px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  background: #fafafa;
}
.import-area:hover { border-color: var(--primary); background: var(--primary-light); }
.import-area.dragover { border-color: var(--primary); background: var(--primary-light); }
.report-section { margin-bottom: 24px; }
.report-table { margin-top: 12px; }
.toast-container {
  position: fixed;
  top: 80px;
  right: 20px;
  z-index: 300;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  padding: 12px 18px;
  border-radius: var(--radius);
  color: white;
  font-size: 13px;
  box-shadow: var(--shadow);
  animation: toastSlide 0.3s ease;
  max-width: 320px;
}
@keyframes toastSlide {
  from { opacity: 0; transform: translateX(100%); }
  to { opacity: 1; transform: translateX(0); }
}
.toast-success { background: var(--primary); }
.toast-error { background: var(--danger); }
.toast-warning { background: var(--secondary); }
.linkage-info {
  background: #e3f2fd;
  border-left: 3px solid var(--info);
  padding: 10px 14px;
  border-radius: 0 var(--radius) var(--radius) 0;
  font-size: 12px;
  color: var(--info);
  margin-bottom: 14px;
}
.dashboard-welcome {
  background: var(--primary);
  color: white;
  padding: 30px;
  border-radius: var(--radius);
  margin-bottom: 20px;
}
.dashboard-welcome h2 { font-size: 22px; margin-bottom: 8px; }
.dashboard-welcome p { opacity: 0.9; font-size: 14px; }
.quick-actions {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
  margin-bottom: 20px;
}
.quick-action-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid transparent;
}
.quick-action-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); border-color: var(--primary); }
.quick-action-icon { font-size: 28px; margin-bottom: 8px; }
.quick-action-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.quick-action-desc { font-size: 12px; color: var(--text-light); }
.global-search-result { cursor: pointer; }
.global-search-result:hover { background: var(--primary-light) !important; }
.tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; margin-right: 4px; }
.recent-logs { font-size: 12px; }
.log-item { padding: 8px 0; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; }
.log-time { color: #999; font-size: 11px; }
@media (max-width: 768px) {
  .sidebar { width: 60px; }
  .nav-item span { display: none; }
  .nav-item { justify-content: center; padding: 12px; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .form-row { flex-direction: column; gap: 10px; }
  .search-box { min-width: auto; width: 100%; }
}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>🏘️ 村务数据管理系统</h1>
    <div class="subtitle">一库统管 · 智能检索 · 快捷报表 · 数据联动</div>
  </div>
  <div class="header-actions">
    <button class="btn btn-secondary btn-sm" onclick="app.showBackup()">💾 数据备份</button>
    <button class="btn btn-warning btn-sm" onclick="app.showRestore()">📂 数据恢复</button>
  </div>
</div>

<div class="container">
  <div class="sidebar">
    <div class="nav-item active" data-page="dashboard" onclick="app.navigate('dashboard')">
      <span class="nav-icon">📊</span><span>数据总览</span>

    <div class="nav-item" data-page="residents" onclick="app.navigate('residents')">
      <span class="nav-icon">👥</span><span>户籍信息</span>

    <div class="nav-item" data-page="poverty" onclick="app.navigate('poverty')">

    </div>
    <div class="nav-item" data-page="dibao" onclick="app.navigate('dibao')">

    </div>
    <div class="nav-item" data-page="disabled" onclick="app.navigate('disabled')">

    <div class="nav-item" data-page="farmland" onclick="app.navigate('farmland')">

    </div>
    <div class="nav-item" data-page="insurance" onclick="app.navigate('insurance')">

    </div>
    <div class="nav-item" data-page="search" onclick="app.navigate('search')">
      <span class="nav-icon">🔍</span><span>智能检索</span>
    </div>
    <div class="nav-item" data-page="reports" onclick="app.navigate('reports')">
      <span class="nav-icon">📈</span><span>统计报表</span>

    <div class="nav-item" data-page="import" onclick="app.navigate('import')">

    <div class="nav-item" data-page="logs" onclick="app.navigate('logs')">
      <span class="nav-icon">📝</span><span>操作日志</span>

  </div>

  <div class="main-content" id="mainContent">
    <!-- Dynamic content -->
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h3 id="modalTitle">标题</h3>
      <button class="modal-close" onclick="app.closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<script>
// ==================== IndexedDB 数据库管理 ====================
class Database {
  constructor() {
    this.db = null;
    this.dbName = 'VillageDataDB';
    this.version = 1;
  }

  async init() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(this.dbName, this.version);
      request.onerror = () => reject(request.error);
      request.onsuccess = () => { this.db = request.result; resolve(); };
      request.onupgradeneeded = (event) => {
        const db = event.target.result;
        // 居民/户籍表
        if (!db.objectStoreNames.contains('residents')) {
          const store = db.createObjectStore('residents', { keyPath: 'id', autoIncrement: true });
          store.createIndex('name', 'name', { unique: false });
          store.createIndex('idCard', 'idCard', { unique: true });
          store.createIndex('villageGroup', 'villageGroup', { unique: false });
          store.createIndex('phone', 'phone', { unique: false });
        }
        // 脱贫户/监测户
        if (!db.objectStoreNames.contains('poverty')) {
          const store = db.createObjectStore('poverty', { keyPath: 'id', autoIncrement: true });
          store.createIndex('residentId', 'residentId', { unique: false });
          store.createIndex('householdType', 'householdType', { unique: false });
          store.createIndex('povertyStatus', 'povertyStatus', { unique: false });
        }
        // 低保特困
        if (!db.objectStoreNames.contains('dibao')) {
          const store = db.createObjectStore('dibao', { keyPath: 'id', autoIncrement: true });
          store.createIndex('residentId', 'residentId', { unique: false });
          store.createIndex('type', 'type', { unique: false });
        }
        // 残疾人
        if (!db.objectStoreNames.contains('disabled')) {
          const store = db.createObjectStore('disabled', { keyPath: 'id', autoIncrement: true });
          store.createIndex('residentId', 'residentId', { unique: false });
          store.createIndex('disabilityLevel', 'disabilityLevel', { unique: false });
        }
        // 耕地补贴
        if (!db.objectStoreNames.contains('farmland')) {
          const store = db.createObjectStore('farmland', { keyPath: 'id', autoIncrement: true });
          store.createIndex('residentId', 'residentId', { unique: false });
          store.createIndex('year', 'year', { unique: false });
        }
        // 医保社保
        if (!db.objectStoreNames.contains('insurance')) {
          const store = db.createObjectStore('insurance', { keyPath: 'id', autoIncrement: true });
          store.createIndex('residentId', 'residentId', { unique: false });
          store.createIndex('type', 'type', { unique: false });
        }
        // 操作日志
        if (!db.objectStoreNames.contains('logs')) {
          const store = db.createObjectStore('logs', { keyPath: 'id', autoIncrement: true });
          store.createIndex('time', 'time', { unique: false });
          store.createIndex('module', 'module', { unique: false });
        }
      };
    });
  }

  async getAll(storeName) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(storeName, 'readonly');
      const store = tx.objectStore(storeName);
      const request = store.getAll();
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async getById(storeName, id) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(storeName, 'readonly');
      const request = tx.objectStore(storeName).get(id);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async add(storeName, data) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(storeName, 'readwrite');
      const request = tx.objectStore(storeName).add(data);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async put(storeName, data) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(storeName, 'readwrite');
      const request = tx.objectStore(storeName).put(data);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async delete(storeName, id) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(storeName, 'readwrite');
      const request = tx.objectStore(storeName).delete(id);
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  }

  async clear(storeName) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(storeName, 'readwrite');
      const request = tx.objectStore(storeName).clear();
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  }

  async queryByIndex(storeName, indexName, value) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(storeName, 'readonly');
      const index = tx.objectStore(storeName).index(indexName);
      const request = index.getAll(value);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async exportAll() {
    const data = {};
    const stores = ['residents', 'poverty', 'dibao', 'disabled', 'farmland', 'insurance', 'logs'];
    for (const store of stores) {
      data[store] = await this.getAll(store);
    }
    return data;
  }

  async importAll(data) {
    const stores = ['residents', 'poverty', 'dibao', 'disabled', 'farmland', 'insurance', 'logs'];
    for (const store of stores) {
      await this.clear(store);
      if (data[store] && Array.isArray(data[store])) {
        for (const item of data[store]) {
          const { id, ...rest } = item;
          await this.add(store, rest);
        }
      }
    }
  }
}

const db = new Database();

// ==================== 应用主类 ====================
class App {
  constructor() {
    this.currentPage = 'dashboard';
    this.pageSize = 15;
    this.currentPageNum = 1;
    this.currentData = [];
    this.currentStore = '';
    this.currentSearch = '';
    this.residentMap = new Map();
  }

  async init() {
    await db.init();
    this.navigate('dashboard');
    this.showToast('系统初始化完成，欢迎使用村务数据管理系统', 'success');
  }

  navigate(page) {
    this.currentPage = page;
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.querySelector(`.nav-item[data-page="${page}"]`)?.classList.add('active');
    this.currentPageNum = 1;
    this.currentSearch = '';

    switch(page) {
      case 'dashboard': this.renderDashboard(); break;
      case 'residents': this.renderList('residents'); break;
      case 'poverty': this.renderList('poverty'); break;
      case 'dibao': this.renderList('dibao'); break;
      case 'disabled': this.renderList('disabled'); break;
      case 'farmland': this.renderList('farmland'); break;
      case 'insurance': this.renderList('insurance'); break;
      case 'search': this.renderSearch(); break;
      case 'reports': this.renderReports(); break;
      case 'import': this.renderImport(); break;
      case 'logs': this.renderLogs(); break;
    }
  }

  // ==================== 数据总览 ====================
  async renderDashboard() {
    const [residents, poverty, dibao, disabled, farmland, insurance] = await Promise.all([
      db.getAll('residents'), db.getAll('poverty'), db.getAll('dibao'),
      db.getAll('disabled'), db.getAll('farmland'), db.getAll('insurance')
    ]);

    const totalSubsidy = farmland.reduce((s, i) => s + (parseFloat(i.subsidyAmount) || 0), 0);
    const totalInsurance = insurance.reduce((s, i) => s + (parseFloat(i.amount) || 0), 0);

    document.getElementById('mainContent').innerHTML = `
      <div class="dashboard-welcome">
        <h2>👋 欢迎使用村务数据管理系统</h2>

    // 关联姓名
    if (cfg.needResidentName) {
      const residents = await db.getAll('residents');
      this.residentMap = new Map(residents.map(r => [r.id, r]));
      data = data.map(item => ({
        ...item,
        residentName: this.residentMap.get(item.residentId)?.name || '未知'
      }));
    }

    this.currentData = data;

    // 搜索过滤
    if (this.currentSearch) {
      const s = this.currentSearch.toLowerCase();
      data = data.filter(item => cfg.searchFields.some(f => String(item[f] || '').toLowerCase().includes(s)));
    }

    const total = data.length;
    const totalPages = Math.ceil(total / this.pageSize) || 1;
    const start = (this.currentPageNum - 1) * this.pageSize;
    const pageData = data.slice(start, start + this.pageSize);

    let html = `
      <div class="card">
        <div class="card-title">
          <span>${cfg.icon} ${cfg.title}</span>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-primary btn-sm" onclick="app.showForm('${storeName}')">➕ 新增</button>
            <button class="btn btn-secondary btn-sm" onclick="app.exportStore('${storeName}')">📤 导出</button>
          </div>
        </div>
        <div class="toolbar">
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="输入关键词搜索..." value="${this.currentSearch}" onkeydown="if(event.key==='Enter')app.doSearch()">
            <button class="btn btn-primary btn-sm" onclick="app.doSearch()">🔍 搜索</button>
            <button class="btn btn-sm" onclick="app.clearSearch()">清空</button>
          </div>
          <span style="color:#999;font-size:12px;">共 ${total} 条记录</span>
        </div>
    `;

    if (pageData.length === 0) {
      html += `<div class="empty-state"><div class="empty-state-icon">📭</div><p>暂无数据</p></div>`;
    } else {
      html += `<table><thead><tr>${cfg.colNames.map(c => `<th>${c}</th>`).join('')}<th style="width:120px;text-align:center;">操作</th></tr></thead><tbody>`;
      for (const item of pageData) {
        html += `<tr>`;
        for (const col of cfg.columns) {
          let val = item[col];
          if (col === 'gender') val = val === '男' ? '<span class="badge badge-info">男</span>' : '<span class="badge badge-warning">女</span>';
          else if (col === 'isRemoved') val = val === '是' ? '<span class="badge badge-success">已消除</span>' : '<span class="badge badge-warning">否</span>';
          else if (col === 'paymentStatus') {
            val = val === '已发放' || val === '正常缴费' ? '<span class="badge badge-success">'+val+'</span>' :
                  val === '待发放' || val === '断缴' ? '<span class="badge badge-warning">'+val+'</span>' :
                  '<span class="badge badge-danger">'+val+'</span>';
          }
          else if (col === 'povertyStatus') {
            val = val === '已消除风险' ? '<span class="badge badge-success">已消除</span>' :
                  val === '未消除风险' ? '<span class="badge badge-danger">未消除</span>' :
                  '<span class="badge badge-warning">'+val+'</span>';
          }
          else if (col === 'status') {
            val = val === '正常缴费' ? '<span class="badge badge-success">正常</span>' :
                  val === '断缴' ? '<span class="badge badge-danger">断缴</span>' :
                  '<span class="badge badge-warning">'+val+'</span>';
          }
          else val = val !== undefined && val !== null && val !== '' ? val : '-';
          html += `<td>${val}</td>`;
        }
        html += `<td class="table-actions" style="justify-content:center;">
          <button class="btn btn-sm btn-secondary" onclick="app.showForm('${storeName}', ${item.id})">编辑</button>
          <button class="btn btn-sm btn-danger" onclick="app.deleteItem('${storeName}', ${item.id})">删除</button>
        </td></tr>`;
      }
      html += `</tbody></table>`;

      // 分页
      if (totalPages > 1) {
        html += `<div class="pagination">`;
        html += `<button class="page-btn" ${this.currentPageNum===1?'disabled':''} onclick="app.goPage(${this.currentPageNum-1})">上一页</button>`;
        for (let i = 1; i <= totalPages; i++) {
          if (i === 1 || i === totalPages || (i >= this.currentPageNum - 1 && i <= this.currentPageNum + 1)) {
            html += `<button class="page-btn ${i===this.currentPageNum?'active':''}" onclick="app.goPage(${i})">${i}</button>`;
          } else if (i === this.currentPageNum - 2 || i === this.currentPageNum + 2) {
            html += `<span style="color:#999;">...</span>`;
          }
        }
        html += `<button class="page-btn" ${this.currentPageNum===totalPages?'disabled':''} onclick="app.goPage(${this.currentPageNum+1})">下一页</button>`;
        html += `</div>`;
      }
    }

    html += `</div>`;
    document.getElementById('mainContent').innerHTML = html;
  }

  doSearch() {
    this.currentSearch = document.getElementById('searchInput')?.value || '';
    this.currentPageNum = 1;
    this.renderList(this.currentStore);
  }

  clearSearch() {
    this.currentSearch = '';
    this.currentPageNum = 1;
    this.renderList(this.currentStore);
  }

  goPage(p) {
    this.currentPageNum = p;
    this.renderList(this.currentStore);
  }

    const configs = {
      residents: ['name','idCard','gender','birthDate','villageGroup','address','phone','education','politicalStatus','householdId','relationToHead','remark'],
      poverty: ['residentId','householdType','povertyStatus','identificationDate','riskType','assistanceMeasures','annualIncome','isRemoved','removalDate','remark'],
      dibao: ['residentId','type','level','startDate','monthlyAmount','familySize','remark'],
      disabled: ['residentId','disabilityType','disabilityLevel','certificateNo','startDate','careLevel','subsidies','remark'],
      farmland: ['residentId','areaMu','subsidyAmount','year','paymentStatus','paymentDate','remark'],
      insurance: ['residentId','type','status','paymentYear','amount','paymentDate','remark']
    };

    const data = {};
    for (const key of configs[storeName]) {
      const el = document.getElementById(`field_${key}`);
      data[key] = el ? el.value : '';
    }

    // 校验
    if (storeName === 'residents') {
      if (!data.name || !data.idCard || !data.villageGroup) { this.showToast('请填写必填项', 'error'); return; }
      // 身份证号唯一性校验
      const existing = await db.getAll('residents');
      const dup = existing.find(r => r.idCard === data.idCard && r.id !== editId);
      if (dup) { this.showToast('该身份证号已存在', 'error'); return; }
    } else {
      if (!data.residentId) { this.showToast('请选择关联村民', 'error'); return; }
    }

    data.updatedAt = new Date().toISOString();
    if (editId) {
      data.id = editId;
      await db.put(storeName, data);
      this.showToast('修改成功', 'success');
      this.addLog('修改', `${this.getStoreLabel(storeName)} ID=${editId}`);
    } else {
      data.createdAt = data.updatedAt;
      const newId = await db.add(storeName, data);
      this.showToast('新增成功', 'success');
      this.addLog('新增', `${this.getStoreLabel(storeName)} ID=${newId}`);
    }

    this.closeModal();
    this.renderList(storeName);
  }

  async doGlobalSearch() {
    const keyword = document.getElementById('globalSearchInput').value.trim().toLowerCase();
    if (!keyword) { this.showToast('请输入搜索关键词', 'warning'); return; }

    const [residents, poverty, dibao, disabled, farmland, insurance] = await Promise.all([
      db.getAll('residents'), db.getAll('poverty'), db.getAll('dibao'),
      db.getAll('disabled'), db.getAll('farmland'), db.getAll('insurance')
    ]);

    const rMap = new Map(residents.map(r => [r.id, r]));
    const results = [];

    // 户籍搜索
    for (const r of residents) {
      if ([r.name, r.idCard, r.villageGroup, r.phone, r.address].some(v => String(v || '').toLowerCase().includes(keyword))) {
        results.push({ type: '户籍', name: r.name, idCard: r.idCard, detail: `${r.villageGroup} | ${r.gender || ''} | ${r.phone || ''}`, data: r, store: 'residents' });
      }
    }

    // 其他表搜索（关联姓名）
    const searchLinked = (list, label, store, extraFields) => {
      for (const item of list) {
        const resident = rMap.get(item.residentId);
        const name = resident?.name || '';
        const idCard = resident?.idCard || '';
        if ([name, idCard, ...extraFields.map(k => item[k])].some(v => String(v || '').toLowerCase().includes(keyword))) {
          results.push({ type: label, name, idCard, detail: extraFields.map(k => item[k]).filter(Boolean).join(' | '), data: item, store });
        }
      }
    };

    searchLinked(poverty, '脱贫/监测户', 'poverty', ['householdType', 'povertyStatus', 'riskType']);
    searchLinked(dibao, '低保特困', 'dibao', ['type', 'level']);
    searchLinked(disabled, '残疾人', 'disabled', ['disabilityType', 'disabilityLevel']);
    searchLinked(farmland, '耕地补贴', 'farmland', ['year', 'paymentStatus']);
    searchLinked(insurance, '医保社保', 'insurance', ['type', 'status', 'paymentYear']);

    let html = `<p style="color:#666;margin-bottom:12px;">找到 <strong>${results.length}</strong> 条相关记录</p>`;
    if (results.length === 0) {
      html += `<div class="empty-state"><div class="empty-state-icon">🔍</div><p>未找到匹配记录</p></div>`;
    } else {
      html += `<table><thead><tr><th>数据类型</th><th>姓名</th><th>身份证号</th><th>详细信息</th><th style="width:80px;">操作</th></tr></thead><tbody>`;
      for (const r of results) {
        html += `<tr class="global-search-result" onclick="app.navigate('${r.store}')">
          <td><span class="badge badge-info">${r.type}</span></td>
          <td><strong>${r.name || '-'}</strong></td>
          <td>${r.idCard || '-'}</td>
          <td>${r.detail || '-'}</td>
          <td><button class="btn btn-sm btn-secondary" onclick="event.stopPropagation();app.showForm('${r.store}', ${r.data.id})">查看</button></td>
        </tr>`;
      }
      html += `</tbody></table>`;
    }

    document.getElementById('globalSearchResults').innerHTML = html;
  }

  async processCsv(file, storeName) {
    const text = await file.text();
    const lines = text.trim().split('\n');
    if (lines.length < 2) { this.showToast('CSV文件格式不正确', 'error'); return; }

    const headers = this.parseCsvLine(lines[0]);
    const residents = await db.getAll('residents');
    const residentByIdCard = new Map(residents.map(r => [r.idCard, r]));

    let success = 0, fail = 0, errors = [];

    for (let i = 1; i < lines.length; i++) {
      const cols = this.parseCsvLine(lines[i]);
      const row = {};
      headers.forEach((h, idx) => row[h.trim()] = cols[idx]?.trim() || '');

      try {
        const data = {};
        // 根据store映射字段
        const fieldMap = {
          residents: { name:'name', idCard:'idCard', gender:'gender', birthDate:'birthDate', villageGroup:'villageGroup', address:'address', phone:'phone', education:'education', politicalStatus:'politicalStatus', householdId:'householdId', relationToHead:'relationToHead', remark:'remark' },
          poverty: { residentId:'residentId', householdType:'householdType', povertyStatus:'povertyStatus', identificationDate:'identificationDate', riskType:'riskType', assistanceMeasures:'assistanceMeasures', annualIncome:'annualIncome', isRemoved:'isRemoved', removalDate:'removalDate', remark:'remark' },
          dibao: { residentId:'residentId', type:'type', level:'level', startDate:'startDate', monthlyAmount:'monthlyAmount', familySize:'familySize', remark:'remark' },
          disabled: { residentId:'residentId', disabilityType:'disabilityType', disabilityLevel:'disabilityLevel', certificateNo:'certificateNo', startDate:'startDate', careLevel:'careLevel', subsidies:'subsidies', remark:'remark' },
          farmland: { residentId:'residentId', areaMu:'areaMu', subsidyAmount:'subsidyAmount', year:'year', paymentStatus:'paymentStatus', paymentDate:'paymentDate', remark:'remark' },
          insurance: { residentId:'residentId', type:'type', status:'status', paymentYear:'paymentYear', amount:'amount', paymentDate:'paymentDate', remark:'remark' }
        };

        const map = fieldMap[storeName];
        for (const [csvKey, dbKey] of Object.entries(map)) {
          // 处理residentId：如果是身份证号，查找对应resident
          if (dbKey === 'residentId' && row[csvKey]) {
            const r = residentByIdCard.get(row[csvKey]);
            if (r) data[dbKey] = r.id;
            else { throw new Error(`第${i+1}行：身份证号 ${row[csvKey]} 不存在`); }
          } else {
            data[dbKey] = row[csvKey] || '';
          }
        }

        // 校验
        if (storeName === 'residents') {
          if (!data.name || !data.idCard) throw new Error('姓名和身份证号为必填');
          if (residentByIdCard.has(data.idCard)) throw new Error(`身份证号 ${data.idCard} 已存在`);
        } else {
          if (!data.residentId) throw new Error('无法关联村民');
        }

        data.createdAt = data.updatedAt = new Date().toISOString();
        await db.add(storeName, data);
        success++;
      } catch (err) {
        fail++;
        errors.push(`第${i+1}行: ${err.message}`);
      }
    }

    // 显示结果
    const resultDiv = document.getElementById(`importResult_${storeName}`);
    let html = `<div style="margin-top:16px;padding:14px;border-radius:8px;background:${fail===0?'#e8f5e9':'#fff3e0'};">`;
    html += `<p style="font-weight:600;">导入结果：成功 <span style="color:var(--primary);">${success}</span> 条，失败 <span style="color:${fail>0?'var(--danger)':'#999'};">${fail}</span> 条</p>`;
    if (errors.length > 0) {
      html += `<details style="margin-top:8px;"><summary style="cursor:pointer;font-size:12px;color:var(--secondary);">查看错误详情 (${errors.length}条)</summary><div style="margin-top:8px;font-size:11px;color:var(--danger);max-height:200px;overflow-y:auto;">${errors.map(e => `<div>${e}</div>`).join('')}</div></details>`;
    }
    html += `</div>`;
    resultDiv.innerHTML = html;

    this.addLog('批量导入', `${this.getStoreLabel(storeName)} 成功${success}条，失败${fail}条`);
    if (success > 0) this.showToast(`成功导入 ${success} 条记录`, 'success');
  }

  parseCsvLine(line) {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') {
        inQuotes = !inQuotes;
      } else if (c === ',' && !inQuotes) {
        result.push(current.trim());
        current = '';
      } else {
        current += c;
      }
    }
    result.push(current.trim());
    return result;
  }

      disabled: { headers: ['村民ID','残疾类别','等级','证号','发证日期','照护等级','补贴','备注'], keys: ['residentId','disabilityType','disabilityLevel','certificateNo','startDate','careLevel','subsidies','remark'] },
      farmland: { headers: ['村民ID','面积(亩)','金额','年度','状态','发放日期','备注'], keys: ['residentId','areaMu','subsidyAmount','year','paymentStatus','paymentDate','remark'] },
      insurance: { headers: ['村民ID','类型','状态','年度','金额','缴费日期','备注'], keys: ['residentId','type','status','paymentYear','amount','paymentDate','remark'] }
    };
    const cfg = configs[storeName];
    let csv = cfg.headers.join(',') + '\n';
    for (const item of data) {
      csv += cfg.keys.map(k => `"${(item[k] || '').toString().replace(/"/g, '""')}"`).join(',') + '\n';
    }
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${storeName}_export_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    this.showToast('导出成功', 'success');
    this.addLog('导出', `导出${this.getStoreLabel(storeName)} ${data.length}条`);
  }

  async exportReport() {
    const [residents, poverty, dibao, disabled, farmland, insurance] = await Promise.all([
      db.getAll('residents'), db.getAll('poverty'), db.getAll('dibao'),
      db.getAll('disabled'), db.getAll('farmland'), db.getAll('insurance')
    ]);

    let csv = '统计报表\n\n';
    csv += `户籍人口总数,${residents.length}\n`;
    csv += `脱贫/监测户,${poverty.length}\n`;
    csv += `低保特困,${dibao.length}\n`;
    csv += `残疾人,${disabled.length}\n`;
    csv += `耕地补贴记录,${farmland.length}\n`;
    csv += `医保社保记录,${insurance.length}\n\n`;

    const addSection = (title, items, key) => {
      const stats = {};
      items.forEach(i => { stats[i[key]] = (stats[i[key]] || 0) + 1; });
      csv += `${title}\n`;
      Object.entries(stats).forEach(([k, v]) => { csv += `${k || '未填写'},${v}\n`; });
      csv += '\n';
    };

    addSection('性别分布', residents, 'gender');
    addSection('村民小组分布', residents, 'villageGroup');
    addSection('脱贫户类型', poverty, 'householdType');
    addSection('低保类型', dibao, 'type');
    addSection('残疾等级', disabled, 'disabilityLevel');

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `report_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    this.showToast('报表导出成功', 'success');
  }

  // ==================== 数据备份/恢复 ====================
  async showBackup() {
    const data = await db.exportAll();
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `village_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    this.showToast('数据备份已下载', 'success');
    this.addLog('数据备份', '导出全量备份文件');
  }

  showRestore() {
    document.getElementById('modalTitle').textContent = '📂 数据恢复';
    document.getElementById('modalBody').innerHTML = `
      <p style="margin-bottom:12px;">请选择之前备份的JSON文件进行恢复。<strong style="color:var(--danger);">注意：恢复将覆盖当前所有数据！</strong></p>
      <input type="file" id="restoreFile" accept=".json" class="form-input">
    `;
    document.getElementById('modalFooter').innerHTML = `
      <button class="btn" onclick="app.closeModal()">取消</button>
      <button class="btn btn-danger" onclick="app.doRestore()">确认恢复</button>
    `;
    this.openModal();
  }

  async doRestore() {
    const file = document.getElementById('restoreFile').files[0];
    if (!file) { this.showToast('请选择备份文件', 'warning'); return; }

    try {
      const text = await file.text();
      const data = JSON.parse(text);
      await db.importAll(data);
      this.closeModal();
      this.showToast('数据恢复成功', 'success');
      this.addLog('数据恢复', '从备份文件恢复数据');
      this.navigate('dashboard');
    } catch (err) {
      this.showToast('恢复失败：' + err.message, 'error');
    }
  }

  // ==================== 操作日志 ====================
  async renderLogs() {
    const logs = await db.getAll('logs');
    logs.sort((a, b) => new Date(b.time) - new Date(a.time));

    let html = `
      <div class="card">
        <div class="card-title">
          <span>📝 操作日志</span>
          <button class="btn btn-danger btn-sm" onclick="app.clearLogs()">清空日志</button>
        </div>
        <div class="recent-logs">
    `;

    if (logs.length === 0) {
      html += `<div class="empty-state"><div class="empty-state-icon">📝</div><p>暂无操作记录</p></div>`;
    } else {
      for (const log of logs.slice(0, 200)) {
        const time = new Date(log.time).toLocaleString('zh-CN');
        html += `<div class="log-item"><div><span class="badge badge-info">${log.action}</span> ${log.detail}</div><div class="log-time">${time}</div></div>`;
      }
    }
    html += `</div></div>`;
    document.getElementById('mainContent').innerHTML = html;
  }

  async addLog(action, detail) {
    try {
      await db.add('logs', { action, detail, time: new Date().toISOString(), module: this.currentPage });
    } catch (e) {}
  }

  async clearLogs() {
    if (!confirm('确定要清空所有操作日志吗？')) return;
    await db.clear('logs');
    this.showToast('日志已清空', 'success');
    this.renderLogs();
  }

  // ==================== 通用UI ====================
  openModal() { document.getElementById('modalOverlay').classList.add('active'); }
  closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }

  showToast(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(() => { toast.remove(); }, 3000);
  }
}

const app = new App();
app.init();

// 点击modal外部关闭
document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modalOverlay')) app.closeModal();
});
</script>
</body>
</html>
