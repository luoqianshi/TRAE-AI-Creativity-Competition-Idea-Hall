<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>实验快记</title>
  <style>
    :root {
      --bg-primary: #f9fbff;
      --bg-card: #ffffff;
      --text-primary: #2d3748;
      --text-secondary: #6b7280;
      --accent: #4f46e5;
      --accent-light: #a5b4fc;
      --border: #e2e8f0;
      --shadow: 0 2px 8px rgba(148, 163, 184, 0.1);
      --radius: 12px;
      --transition: all 0.25s ease;
    }

    .dark-theme {
      --bg-primary: #1a1f2e;
      --bg-card: #252d41;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --accent: #818cf8;
      --accent-light: #4f46e5;
      --border: #334155;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 16px;
      transition: var(--transition);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      padding: 12px 0;
    }

    h1 {
      font-weight: 700;
      font-size: 1.8rem;
      margin-bottom: 4px;
      background: linear-gradient(90deg, var(--accent), #818cf8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      padding: 10px 16px;
      border-radius: var(--radius);
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      font-size: 0.85rem;
    }

    .time-display {
      font-weight: 600;
      color: var(--accent);
    }

    .mode-tag {
      background: var(--accent-light);
      color: white;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .input-section {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }

    .section-title {
      font-weight: 600;
      margin-bottom: 16px;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: "🎤";
      font-size: 1.1rem;
    }

    .voice-input {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .voice-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: var(--accent);
      color: white;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 1.4rem;
      transition: var(--transition);
      box-shadow: 0 2px 6px rgba(79, 70, 229, 0.2);
    }

    .voice-btn:hover {
      transform: scale(1.05);
      background: #4338ca;
    }

    .voice-sample {
      background: #f1f5f9;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.9rem;
      color: var(--text-secondary);
      border-left: 3px solid var(--accent);
      margin-top: 8px;
      display: none;
    }

    .voice-btn.active + .voice-sample,
    .voice-btn:focus + .voice-sample {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .param-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-top: 24px;
    }

    @media (min-width: 768px) {
      .param-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .param-item {
      background: #f8fafc;
      border-radius: var(--radius);
      padding: 14px;
      border: 1px solid var(--border);
      transition: var(--transition);
    }

    .param-item:hover {
      border-color: var(--accent-light);
      transform: translateY(-2px);
    }

    .param-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .param-label::before {
      content: attr(data-icon);
      font-size: 1rem;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .slider {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      background: #e2e8f0;
      border-radius: 3px;
      outline: none;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 2px 4px rgba(79, 70, 229, 0.3);
    }

    .slider-value {
      min-width: 48px;
      text-align: center;
      font-weight: 600;
      color: var(--accent);
      font-size: 0.9rem;
    }

    .preview-section {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .preview-title {
      font-weight: 600;
      margin-bottom: 16px;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .preview-title::before {
      content: "📝";
      font-size: 1.1rem;
    }

    .preview-content {
      background: #f8fafc;
      border-radius: 8px;
      padding: 16px;
      font-size: 0.95rem;
      line-height: 1.7;
      border-left: 3px solid var(--accent);
    }

    .preview-field {
      margin-bottom: 12px;
    }

    .preview-label {
      display: inline-block;
      width: 100px;
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.9rem;
    }

    .preview-value {
      color: var(--text-primary);
      font-weight: 500;
    }

    .theme-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
      z-index: 100;
      transition: var(--transition);
      font-size: 1.2rem;
    }

    .theme-toggle:hover {
      transform: scale(1.1);
      background: #4338ca;
    }

    footer {
      text-align: center;
      margin-top: 32px;
      padding: 16px;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      h1 {
        font-size: 1.6rem;
      }
      .status-bar {
        flex-direction: column;
        gap: 8px;
        text-align: center;
      }
      .param-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>实验快记</h1>
      <p class="subtitle">语音口述 → 自动结构化 → 一键导出</p>
    </header>

    <div class="status-bar">
      <span class="time-display" id="current-time">2024-06-12 15:42</span>
      <span class="mode-tag">语音速记模式</span>
    </div>

    <section class="input-section">
      <h2 class="section-title">口述实验过程</h2>
      <div class="voice-input">
        <button class="voice-btn" id="voice-btn" aria-label="模拟语音输入">🎤</button>
        <div class="voice-sample">
          “今天做了大肠杆菌转化，加了10μL质粒，37℃摇床2h，菌落偏少”
        </div>
      </div>

      <h2 class="section-title" style="margin-top: 32px;">补全关键参数</h2>
      <div class="param-grid">
        <div class="param-item">
          <div class="param-label" data-icon="⏱️">离心时间</div>
          <div class="slider-container">
            <input type="range" min="1" max="30" value="10" class="slider" id="centrifuge-time">
            <span class="slider-value" id="centrifuge-value">10 min</span>
          </div>
        </div>
        <div class="param-item">
          <div class="param-label" data-icon="🌡️">培养温度</div>
          <div class="slider-container">
            <input type="range" min="4" max="45" value="37" class="slider" id="temp-slider">
            <span class="slider-value" id="temp-value">37 ℃</span>
          </div>
        </div>
        <div class="param-item">
          <div class="param-label" data-icon="💧">环境湿度</div>
          <div class="slider-container">
            <input type="range" min="30" max="85" value="60" class="slider" id="humidity-slider">
            <span class="slider-value" id="humidity-value">60 %</span>
          </div>
        </div>
      </div>
    </section>

    <section class="preview-section">
      <h2 class="preview-title">结构化日志预览</h2>
      <div class="preview-content">
        <div class="preview-field">
          <span class="preview-label">时间戳：</span>
          <span class="preview-value" id="preview-time">2024-06-12 15:42</span>
        </div>
        <div class="preview-field">
          <span class="preview-label">实验类型：</span>
          <span class="preview-value">大肠杆菌转化</span>
        </div>
        <div class="preview-field">
          <span class="preview-label">关键变量：</span>
          <span class="preview-value">质粒用量 10μL｜离心时间 10 min｜培养温度 37 ℃｜环境湿度 60 %</span>
        </div>
        <div class="preview-field">
          <span class="preview-label">观察结论：</span>
          <span class="preview-value">菌落偏少，建议复查质粒浓度与热激时间</span>
        </div>
      </div>
    </section>

    <footer>
      <p>轻量记录 · 科研新人友好 · 支持导出为 Word / Markdown</p>
    </footer>
  </div>

  <button class="theme-toggle" id="theme-toggle" aria-label="切换深色/浅色主题">☀️</button>

  <script>
    // 初始化时间
    function updateTime() {
      const now = new Date();
      const formatted = now.toLocaleString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
      document.getElementById('current-time').textContent = formatted;
      document.getElementById('preview-time').textContent = formatted;
    }
    updateTime();
    setInterval(updateTime, 60000);

    // 主题切换
    const themeToggle = document.getElementById('theme-toggle');
    const body = document.body;

    if (localStorage.getItem('theme') === 'dark') {
      body.classList.add('dark-theme');
      themeToggle.innerHTML = '🌙';
    }

    themeToggle.addEventListener('click', () => {
      if (body.classList.contains('dark-theme')) {
        body.classList.remove('dark-theme');
        localStorage.setItem('theme', 'light');
        themeToggle.innerHTML = '☀️';
      } else {
        body.classList.add('dark-theme');
        localStorage.setItem('theme', 'dark');
        themeToggle.innerHTML = '🌙';
      }
    });

    // 语音模拟按钮
    const voiceBtn = document.getElementById('voice-btn');
    const voiceSample = document.querySelector('.voice-sample');

    voiceBtn.addEventListener('click', () => {
      voiceBtn.classList.toggle('active');
      if (voiceBtn.classList.contains('active')) {
        voiceBtn.innerHTML = '✅';
        setTimeout(() => {
          voiceBtn.innerHTML = '🎤';
          voiceBtn.classList.remove('active');
        }, 1500);
      }
    });

    // 滑块联动预览
    const centrifugeSlider = document.getElementById('centrifuge-time');
    const centrifugeValue = document.getElementById('centrifuge-value');
    const tempSlider = document.getElementById('temp-slider');
    const tempValue = document.getElementById('temp-value');
    const humiditySlider = document.getElementById('humidity-slider');
    const humidityValue = document.getElementById('humidity-value');

    centrifugeSlider.addEventListener('input', () => {
      centrifugeValue.textContent = centrifugeSlider.value + ' min';
      updatePreview();
    });

    tempSlider.addEventListener('input', () => {
      tempValue.textContent = tempSlider.value + ' ℃';
      updatePreview();
    });

    humiditySlider.addEventListener('input', () => {
      humidityValue.textContent = humiditySlider.value + ' %';
      updatePreview();
    });

    function updatePreview() {
      const time = centrifugeSlider.value;
      const temp = tempSlider.value;
      const hum = humiditySlider.value;
      const varsEl = document.querySelector('.preview-value:nth-child(3)');
      varsEl.textContent = `质粒用量 10μL｜离心时间 ${time} min｜培养温度 ${temp} ℃｜环境湿度 ${hum} %`;
    }
  </script>
</body>
</html>
