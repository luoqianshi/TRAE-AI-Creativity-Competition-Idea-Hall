  background: var(--accent2-light);
  color: var(--accent2);
  animation: correctPulse 0.5s ease;
}
.quiz-option.wrong {
  border-color: var(--accent);
  background: var(--accent-light);
  color: var(--accent);
  animation: shake 0.4s ease;
}

@keyframes correctPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.02); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}

.quiz-result {
  text-align: center;
  padding: 20px;
  border-radius: var(--radius);
  margin-top: 16px;
  font-weight: 700;
  font-size: 16px;
  display: none;
}
.quiz-result.show { display: block; animation: fadeInUp 0.3s ease; }
.quiz-result.success { background: var(--accent2-light); color: var(--accent2); }
.quiz-result.fail { background: var(--accent-light); color: var(--accent); }

/* Phase 4: WRITE */
.write-instructions {
  font-size: 14px;
  color: var(--text2);
  margin-bottom: 16px;
  text-align: center;
}

.canvas-container {
  display: flex;
  justify-content: center;
  margin-bottom: 16px;
}

#writeCanvas {
  width: 280px;
  height: 280px;
  border-radius: var(--radius);
  border: 2px solid var(--border);
  background: var(--card);
  cursor: crosshair;
  touch-action: none;
}

.write-mode-toggle {
  display: flex;
  gap: 0;
  justify-content: center;
  margin-bottom: 16px;
  background: var(--bg2);
  border-radius: 30px;
  padding: 3px;
  border: 1.5px solid var(--border);
  max-width: 300px;
  margin-left: auto;
  margin-right: auto;
}

.write-mode-btn {
  flex: 1;
  padding: 10px 16px;
  border: none;
  border-radius: 28px;
  background: transparent;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  transition: all 0.25s;
}

.write-mode-btn.active {
  background: var(--card);
  color: var(--accent);
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.write-mode-btn:hover:not(.active) {
  color: var(--text);
}

.write-mode-subtitle {
  text-align: center;
  font-size: 13px;
  color: var(--text2);
  margin-bottom: 12px;
  font-style: italic;
}

.write-buttons {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

.write-btn {
  padding: 12px 20px;
  border-radius: 30px;
  border: 2px solid var(--border);
  background: var(--card);
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.2s;
}
.write-btn:hover { border-color: var(--accent); }
.write-btn:active { transform: scale(0.95); }
.write-btn.primary {
  background: linear-gradient(135deg, var(--accent2), #4E9B70);
  color: #fff;
  border-color: var(--accent2);
}
.write-btn.primary:hover { box-shadow: 0 4px 12px rgba(58,124,92,0.3); }

/* Progress bar */
.progress-bar-container {
  padding: 0 20px 16px;
}
.progress-bar {
  width: 100%;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), #E8854A);
  border-radius: 3px;
  transition: width 0.5s ease;
}

/* Color variations for theme cards */
.theme-bg-fire { background: #FFF0E8; }
.theme-bg-person { background: #EDE8FF; }
.theme-bg-animal { background: #E8F5E8; }
.theme-bg-object { background: #E8F0FF; }
.theme-bg-combined { background: var(--gold-light); }

/* Scrollbar styling */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Phase 5: PRONUNCIATION PRACTICE */
.pronounce-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 28px 24px;
  border: 2px solid var(--border);
  text-align: center;
  margin-bottom: 20px;
}

.pronounce-big-char {
  font-size: 80px;
  font-weight: 700;
  color: var(--text);

}

.pronounce-pinyin {
  font-size: 28px;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 4px;
}

.pronounce-meaning {
  font-size: 16px;
  color: var(--text2);
  margin-bottom: 20px;
}

.pronounce-listen-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 24px;
  border-radius: 30px;
  border: 2px solid var(--accent);
  background: var(--accent-light);
  color: var(--accent);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 20px;
}

.pronounce-listen-btn:hover {
  background: var(--accent);
  color: white;
  transform: translateY(-1px);
}

.pronounce-listen-btn:active {
  transform: scale(0.97);
}

/* 录音按钮 */
.record-section {
  margin: 24px 0;
}

.record-btn-container {
  display: flex;
  justify-content: center;
  margin-bottom: 16px;
}

.record-btn {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: 4px solid var(--accent);
  background: var(--card);
  color: var(--accent);
  font-size: 32px;
  cursor: pointer;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.record-btn:hover:not(:disabled) {
  background: var(--accent-light);
  transform: scale(1.05);
}

.record-btn.recording {
  background: #ff4757;
  border-color: #ff4757;
  color: white;
  animation: pulse 1.2s infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.4); }
  50% { box-shadow: 0 0 0 15px rgba(255, 71, 87, 0); }
}

.record-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.record-hint {
  text-align: center;
  font-size: 14px;
  color: var(--text2);
  margin-bottom: 8px;
}

.record-status {
  text-align: center;
  font-size: 13px;
  color: var(--accent);
  font-weight: 600;
  min-height: 20px;
}

/* 评分结果 */
.pronounce-result {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  border: 2px solid var(--border);
  margin-top: 16px;
  text-align: center;
  animation: fadeInUp 0.4s ease;
}

.pronounce-score-ring {
  width: 100px;
  height: 100px;
  margin: 0 auto 12px;
  position: relative;
}

.score-circle-bg {
  fill: none;
  stroke: var(--border);
  stroke-width: 8;
}

.score-circle-fill {
  fill: none;
  stroke: var(--accent2);
  stroke-width: 8;
  stroke-linecap: round;
  transform: rotate(-90deg);
  transform-origin: center;
  transition: stroke-dashoffset 1s ease;
}

.score-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 28px;
  font-weight: 700;
  color: var(--accent2);
}

.pronounce-result-label {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}

.pronounce-result-feedback {
  font-size: 13px;
  color: var(--text2);
  line-height: 1.5;
}

.pronounce-result-heard {
  background: var(--bg2);
  border-radius: 8px;
  padding: 10px 14px;
  margin: 12px 0;
  font-size: 14px;
  color: var(--text);
}

.pronounce-result-heard strong {
  color: var(--accent);
}

/* 练习次数 */
.attempt-count {
  text-align: center;
  font-size: 13px;
  color: var(--text2);
  margin-top: 12px;
}

.attempt-count span {
  color: var(--accent);
  font-weight: 600;
}

/* 词语发音练习列表 */
.word-practice-list {
  margin-top: 16px;
}

.word-practice-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--card);
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border);
  margin-bottom: 8px;
  transition: all 0.2s;
}

.word-practice-item:hover {
  border-color: var(--accent);
}

.word-practice-info {
  text-align: left;
}

.word-practice-char {
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
  font-family: 'KaiTi', 'STKaiti', serif;
}

.word-practice-pinyin {
  font-size: 12px;
  color: var(--text2);
}

.word-practice-actions {
  display: flex;
  gap: 6px;
}

.word-practice-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  background: var(--bg2);
  color: var(--text2);
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.word-practice-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-light);
}

.word-practice-btn.success {
  border-color: var(--accent2);
  color: var(--accent2);
  background: var(--accent2-light);
}

/* 浏览器不支持提示 */

  font-size: 14px;
  margin: 16px 0;
}

.speech-unsupported strong {
  display: block;
  margin-bottom: 4px;
  font-size: 15px;
}

// ========== STATE ==========
let currentScreen = 'homeScreen';
let currentTheme = null;
let currentLesson = null;
let currentPhase = 0;

let quizAnswered = false;

// ========== SCREEN NAVIGATION ==========
function showScreen(screenId) {
  const current = document.querySelector('.screen.active');
  if (current) {
    current.classList.remove('active');
    current.style.display = 'none';
  }
  const next = document.getElementById(screenId);
  if (next) {
    next.style.display = 'block';
    next.classList.add('active');
    currentScreen = screenId;
    window.scrollTo(0, 0);
  }
}

// ========== INITIALIZATION ==========
function init() {
  renderThemeGrid();
  renderHSKList();
}

// ========== THEME GRID ==========
function renderThemeGrid() {
  const grid = document.getElementById('themeGrid');
  grid.innerHTML = themes.map(t => `
    <div class="theme-card" onclick="openTheme('${t.id}')">
      <div class="theme-emoji ${t.bg}">${t.emoji}</div>
      <div class="theme-info">
        <div class="theme-name">${t.name}</div>
        <div class="theme-zh">${t.zh}</div>
        <div class="theme-chars">${t.chars.join(' ')}</div>
      </div>
      <div class="theme-arrow">&#8250;</div>
    </div>
  `).join('');
}

function openTheme(themeId) {
  const theme = themes.find(t => t.id === themeId);
  if (!theme) return;
  currentTheme = theme;
  document.getElementById('charListTitle').textContent = theme.name;
  document.getElementById('charListSubtitle').textContent = theme.zh + ' — Tap a character to begin';

  const grid = document.getElementById('charGrid');
  grid.innerHTML = theme.chars.map(c => {
    const data = charData[c];
    if (!data) return '';
    return `
      <div class="char-item" onclick="startLesson('${c}')">
        <div class="char-item-zh">${data.char}</div>
        <div class="char-item-pinyin">${data.pinyin}</div>
        <div class="char-item-meaning">${data.meaning}</div>
      </div>
    `;
  }).join('');

  previousScreen = 'starterScreen';
  showScreen('charListScreen');
}

function toggleHSK(idx) {
  const card = document.getElementById('hskCard' + idx);

  document.querySelectorAll('.hsk-card.expanded').forEach(c => {
    if (c.id !== 'hskCard' + idx) c.classList.remove('expanded');
  });
  card.classList.toggle('expanded');

// ========== LESSON ENGINE ==========
function startLesson(char) {
  const data = charData[char];
  if (!data) return;
  currentLesson = data;
  currentPhase = 0;
  quizAnswered = false;

  document.getElementById('lessonCharBadge').textContent = data.char + ' ' + data.pinyin;
  updatePhaseIndicator();
  renderPhase();
  previousScreen = currentScreen;
  showScreen('lessonScreen');
}

function exitLesson() {
  showScreen(previousScreen);
}

function updatePhaseIndicator() {
  for (let i = 1; i <= 4; i++) {
    const dot = document.getElementById('pd' + i);
    dot.className = 'phase-dot';
    if (i < currentPhase + 1) dot.classList.add('completed');
    if (i === currentPhase + 1) dot.classList.add('active');
  }
  const fill = document.getElementById('progressFill');
  fill.style.width = ((currentPhase + 1) * 20) + '%';
}

function renderPhase() {
  const content = document.getElementById('lessonContent');
  const d = currentLesson;

  if (currentPhase === 0) {
    renderDiscoverPhase(content, d);
  } else if (currentPhase === 1) {
    renderUnderstandPhase(content, d);
  } else if (currentPhase === 2) {
    renderPlayPhase(content, d);
  } else if (currentPhase === 3) {
    renderWritePhase(content, d);
  } else if (currentPhase === 4) {
    renderPronouncePhase(content, d);
  }

  updatePhaseIndicator();
}

// ----- PHASE 1: DISCOVER -----

      <div class="evo-stage" id="evoStage${i}">

        <div class="evo-label">${d.evoLabels[i]}</div>

  }).join('');

  container.innerHTML = `
    <div class="phase-section active">
      <div class="phase-title">Phase 1 of 5</div>
      <div class="phase-subtitle">Discover the origin of ${d.char}</div>
      <div class="evolution-track">${evoHTML}</div>
      <div class="audio-btn-row">
        <button class="audio-btn" onclick="speakChar('${d.char}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          Listen: ${d.pinyin}
        </button>

      <div class="phase-nav-bar">
        <button class="next-btn accent" onclick="nextPhase()">Continue to Understanding &#8250;</button>
      </div>
    </div>
  `;

  // 女声朗读英文起源故事
  if (window.autoStoryTimer) clearTimeout(window.autoStoryTimer);
  window.autoStoryTimer = setTimeout(() => {
    speakEnglish(d.story, false); // false = 女声
  }, 1500);

  // Animate evolution stages sequentially
  d.evolution.forEach((_, i) => {
    setTimeout(() => {
      const stage = document.getElementById('evoStage' + i);
      if (stage) stage.classList.add('highlight');

// 估算文本朗读时长（毫秒）
function estimateDuration(text) {
  if (!text) return 0;
  // 英文约每秒 2.5 个词，中文约每秒 3 个字
  const words = text.split(/\s+/).filter(w => w.length > 0).length;
  return words * 400 + 500; // 每个词 400ms + 缓冲
}

// 依次朗读相关词语（男女生交替）
async function speakRelatedWordsSequentially(words) {
  for (let i = 0; i < words.length; i++) {
    const word = words[i];
    const useMale = i % 2 === 0; // 第1、3...个用男声，第2、4...个用女声
    const text = `${word.char}. ${word.pinyin}. ${word.meaning}.`;
    
    // 等待一小段间隔
    await new Promise(resolve => setTimeout(resolve, 300));
    
    try {
      await speakEnglish(text, useMale);
      // 等待播放完成
      await new Promise(resolve => setTimeout(resolve, estimateDuration(text) + 200));
    } catch (e) {
      console.warn('Word speech error:', e);
    }
  }
}

function checkAnswer(selected, correct) {
  if (quizAnswered) return;
  quizAnswered = true;

  const options = document.querySelectorAll('.quiz-option');
  options.forEach((opt, i) => {
    opt.style.pointerEvents = 'none';
    if (i === correct) opt.classList.add('correct');
    if (i === selected && selected !== correct) opt.classList.add('wrong');
  });

  const result = document.getElementById('quizResult');
  let resultText = '';
  if (selected === correct) {
    result.className = 'quiz-result show success';
    resultText = 'Correct! Well done!';
    result.innerHTML = '&#10004; ' + resultText;
  } else {
    result.className = 'quiz-result show fail';
    resultText = 'Not quite. The correct answer is: ' + currentLesson.quiz.options[correct];
    result.innerHTML = '&#10008; ' + resultText;
  }

  document.getElementById('quizNextBtn').style.display = 'block';
  
  // 互动后朗读结果
  setTimeout(() => {
    speakEnglish(resultText, selected === correct);
  }, 600);
}

function setWriteMode(mode) {
  writeMode = mode;
  document.getElementById('btnTrace').classList.toggle('active', mode === 'trace');
  document.getElementById('btnFree').classList.toggle('active', mode === 'free');
  const hint = document.getElementById('writeModeHint');
  if (mode === 'trace') {
    hint.textContent = 'Trace over the standard 楷体 (Kǎi) character as a guide';
  } else {
    hint.textContent = 'Write the character freely from memory';
  }
  clearCanvas();
}

function initCanvas() {
  const canvas = document.getElementById('writeCanvas');
  if (!canvas) return;
  canvasCtx = canvas.getContext('2d');
  drawing = false;

  // Mouse events
  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDraw);
  canvas.addEventListener('mouseleave', stopDraw);

  // Touch events
  canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
  canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
  canvas.addEventListener('touchend', stopDraw);

  drawGrid();
}

function drawGrid() {
  const canvas = document.getElementById('writeCanvas');
  if (!canvas || !canvasCtx) return;
  const ctx = canvasCtx;
  const w = canvas.width;
  const h = canvas.height;

  ctx.clearRect(0, 0, w, h);

  // 米字格底纹（楷体练习标准格线）
  ctx.strokeStyle = '#E8E2DA';
  ctx.lineWidth = 0.5;
  ctx.setLineDash([4, 4]);

  // 十字
  ctx.beginPath();
  ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h);
  ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2);
  ctx.stroke();

  // 对角线
  ctx.strokeStyle = '#EDE8E0';
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(w, h);
  ctx.moveTo(w, 0); ctx.lineTo(0, h);
  ctx.stroke();

  ctx.setLineDash([]);

  // 临摹模式：自动显示楷体参考字
  if (writeMode === 'trace' && currentLesson) {
    drawKaiReference(ctx, w, h);
  }
}

function drawKaiReference(ctx, w, h) {
  if (!currentLesson) return;

  // 使用 Noto Serif SC（宋体/楷体风格）显示参考字
  ctx.save();

  // 浅色填充 - 临摹底字
  ctx.fillStyle = 'rgba(200, 90, 58, 0.12)';
  ctx.font = '170px "Noto Serif SC", "SimKai", "KaiTi", "STKaiti", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(currentLesson.char, w / 2, h / 2 + 8);

  // 描边轮廓 - 更清晰的笔画边界
  ctx.strokeStyle = 'rgba(200, 90, 58, 0.35)';
  ctx.lineWidth = 1.5;
  ctx.font = '170px "Noto Serif SC", "SimKai", "KaiTi", "STKaiti", serif';
  ctx.strokeText(currentLesson.char, w / 2, h / 2 + 8);

  ctx.restore();
}

function getCanvasPos(e) {
  const canvas = document.getElementById('writeCanvas');
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
}

function startDraw(e) {
  drawing = true;
  const pos = getCanvasPos(e);
  canvasCtx.beginPath();
  canvasCtx.moveTo(pos.x, pos.y);
}

function draw(e) {
  if (!drawing) return;
  const pos = getCanvasPos(e);
  canvasCtx.lineTo(pos.x, pos.y);
  canvasCtx.strokeStyle = '#2D2A26';
  canvasCtx.lineWidth = 6;
  canvasCtx.lineCap = 'round';
  canvasCtx.lineJoin = 'round';
  canvasCtx.stroke();
}

function stopDraw() {
  drawing = false;
}

function handleTouchStart(e) {
  e.preventDefault();
  const touch = e.touches[0];
  const mouseEvent = { clientX: touch.clientX, clientY: touch.clientY };
  startDraw(mouseEvent);
}

function handleTouchMove(e) {
  e.preventDefault();
  const touch = e.touches[0];
  const mouseEvent = { clientX: touch.clientX, clientY: touch.clientY };
  draw(mouseEvent);
}

function clearCanvas() {
  drawGrid();
}

// ----- PHASE 5: PRONUNCIATION PRACTICE -----
let pronunciationAttempts = 0;
let bestScore = 0;
let recognition = null;
let isListening = false;
let currentPronounceTarget = '';
let wordPracticeStatus = {};

// 检测浏览器是否支持语音识别
function isSpeechRecognitionSupported() {
  return 'SpeechRecognition' in window || 'webkitSpeechRecognition' in window;
}

// 初始化语音识别
function initSpeechRecognition() {
  if (!isSpeechRecognitionSupported()) return null;
  
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recog = new SpeechRecognition();
  recog.lang = 'zh-CN';
  recog.continuous = false;
  recog.interimResults = false;
  recog.maxAlternatives = 5;
  
  return recog;
}

// 计算发音相似度评分
function calculatePronunciationScore(target, heard) {
  if (!heard || heard.length === 0) return 0;
  
  // 移除标点符号和空格
  const cleanTarget = target.replace(/[，。！？、\s]/g, '');
  const cleanHeard = heard.replace(/[，。！？、\s]/g, '');
  
  if (cleanHeard.length === 0) return 0;
  
  // 完全匹配
  if (cleanTarget === cleanHeard) return 100;
  
  // 检查目标字是否在识别结果中（单字情况）
  if (cleanTarget.length === 1) {
    if (cleanHeard.includes(cleanTarget)) return 90;
    // 检查同音字近似匹配
    return 30;
  }
  
  // 多字情况：计算字符匹配率
  let matchCount = 0;
  for (let char of cleanTarget) {
    if (cleanHeard.includes(char)) {
      matchCount++;
    }
  }
  
  const ratio = matchCount / cleanTarget.length;
  return Math.round(ratio * 80 + (cleanHeard.length >= cleanTarget.length ? 5 : 0));
}

// 获取评分等级和反馈
function getScoreFeedback(score) {
  if (score >= 90) {
    return { level: 'Excellent!', emoji: '🌟', color: '#4CAF50', tip: '发音非常标准！继续保持～' };
  } else if (score >= 75) {
    return { level: 'Great!', emoji: '👍', color: '#8BC34A', tip: '发音很不错，再练习几次会更棒！' };
  } else if (score >= 60) {
    return { level: 'Good', emoji: '😊', color: '#FFC107', tip: '基本正确，注意声调可以更标准。' };
  } else if (score >= 40) {
    return { level: 'Keep trying', emoji: '💪', color: '#FF9800', tip: '再听一遍标准发音，然后试试吧！' };
  } else {
    return { level: 'Try again', emoji: '🔄', color: '#f44336', tip: '先多听几遍标准发音，注意口型哦。' };
  }
}

      ${!supported ? `
        <div class="speech-unsupported">
          <strong>⚠️ 浏览器不支持语音识别</strong>
          请使用 Chrome、Edge 或 Safari 浏览器体验发音检测功能。

// 切换录音状态
function toggleRecording() {
  if (isListening) {
    stopRecording();
  } else {
    startRecording();
  }
}

// 开始录音
function startRecording() {
  if (!isSpeechRecognitionSupported()) return;
  
  if (!recognition) {
    recognition = initSpeechRecognition();
  }
  
  isListening = true;
  const btn = document.getElementById('recordBtn');
  const status = document.getElementById('recordStatus');
  
  if (btn) {
    btn.classList.add('recording');
    btn.innerHTML = '⏹';
  }
  if (status) {
    status.textContent = '正在听...请读出这个字';
  }
  
  // 停止当前正在播放的音频
  if (window.speechSynthesis) {
    window.speechSynthesis.cancel();
  }
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }
  
  try {
    recognition.onresult = function(event) {
      const results = event.results[0];
      let bestTranscript = '';
      let bestConfidence = 0;
      
      // 遍历所有备选结果，找最接近的
      for (let i = 0; i < results.length; i++) {
        const transcript = results[i].transcript;
        const confidence = results[i].confidence || 0;
        const score = calculatePronunciationScore(currentPronounceTarget, transcript);
        if (score > bestConfidence) {
          bestConfidence = score;
          bestTranscript = transcript;
        }
      }
      
      // 如果第一个结果置信度最高，用第一个
      if (results[0].confidence > 0.5) {
        bestTranscript = results[0].transcript;
      }
      
      handleRecognitionResult(bestTranscript);
    };
    
    recognition.onerror = function(event) {
      console.error('Speech recognition error:', event.error);
      stopRecording();
      const status = document.getElementById('recordStatus');
      if (status) {
        if (event.error === 'no-speech') {
          status.textContent = '没听到声音，请大声一点再试～';
        } else if (event.error === 'not-allowed') {
          status.textContent = '请允许麦克风权限后再试';
        } else {
          status.textContent = '识别出错了，请重试';
        }
      }
    };
    
    recognition.onend = function() {
      if (isListening) {
        stopRecording();
      }
    };
    
    recognition.start();
  } catch (e) {
    console.error('Failed to start recognition:', e);
    isListening = false;
    if (btn) {
      btn.classList.remove('recording');
      btn.innerHTML = '🎤';
    }
    if (status) {
      status.textContent = '启动失败，请刷新页面重试';
    }
  }
}

// 停止录音
function stopRecording() {
  isListening = false;
  const btn = document.getElementById('recordBtn');
  const status = document.getElementById('recordStatus');
  
  if (btn) {
    btn.classList.remove('recording');
    btn.innerHTML = '🎤';
  }
  
  if (recognition) {
    try {
      recognition.stop();
    } catch (e) { /* ignore */ }
  }
}

// 处理识别结果
function handleRecognitionResult(transcript) {
  pronunciationAttempts++;
  
  const score = calculatePronunciationScore(currentPronounceTarget, transcript);
  if (score > bestScore) {
    bestScore = score;
  }
  
  const feedback = getScoreFeedback(score);
  
  // 显示结果
  const resultDiv = document.getElementById('pronounceResult');
  const scoreText = document.getElementById('scoreText');
  const scoreCircle = document.getElementById('scoreCircle');
  const resultLabel = document.getElementById('resultLabel');
  const heardContent = document.getElementById('heardContent');
  const resultFeedback = document.getElementById('resultFeedback');
  const attemptCount = document.getElementById('attemptCount');
  const bestScoreText = document.getElementById('bestScoreText');
  const status = document.getElementById('recordStatus');
  
  if (resultDiv) resultDiv.style.display = 'block';
  if (scoreText) scoreText.textContent = score;
  if (resultLabel) {
    resultLabel.textContent = feedback.emoji + ' ' + feedback.level;
    resultLabel.style.color = feedback.color;
  }
  if (heardContent) heardContent.textContent = transcript;
  if (resultFeedback) resultFeedback.textContent = feedback.tip;
  if (attemptCount) attemptCount.textContent = pronunciationAttempts;
  if (bestScoreText) bestScoreText.textContent = bestScore;
  if (status) status.textContent = '再来一次？点击麦克风继续练习';
  
  // 动画显示分数圆环
  if (scoreCircle) {
    const circumference = 2 * Math.PI * 42; // 263.89
    const offset = circumference - (score / 100) * circumference;
    scoreCircle.style.strokeDashoffset = offset;
    scoreCircle.style.stroke = feedback.color;
  }
  
  // 高分时播放成功音效（使用TTS播放鼓励语）
  if (score >= 80) {
    setTimeout(() => {
      speakEnglish('Excellent! Well done!', true);
    }, 500);
  }
}

// ========== SPEECH SYNTHESIS ==========
const TTS_SERVER = '/api';
let ttsServerAvailable = false;
let currentAudio = null;

// 检测 TTS 服务器是否可用
async function checkTTSServer() {
  try {
    const res = await fetch(TTS_SERVER + '/health', { signal: AbortSignal.timeout(2000) });
    if (res.ok) {
      ttsServerAvailable = true;
      console.log('🎙️ TTS Server connected (edge-tts Neural Voice)');
      return;
    }
  } catch (e) { /* server not available */ }
  ttsServerAvailable = false;
  console.log('⚠️ TTS Server unavailable, falling back to browser TTS');
}

async function speakChar(chineseCharText) {
  if (!chineseCharText) return;

  // 停止当前播放
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }

  if (ttsServerAvailable) {
    try {
      await speakWithEdgeTTS(chineseCharText);
      return;
    } catch (e) {
      console.warn('Edge TTS failed, falling back:', e);
    }
  }

  // 降级到浏览器 Web Speech API
  speakWithBrowserTTS(chineseCharText);
}

// ========== VOICE SETTINGS ==========
let chineseVoice = 'zh-CN-XiaoxiaoNeural';
let chineseRate = '+15%';

// 高质量：edge-tts Neural Voice
async function speakWithEdgeTTS(text) {
  const res = await fetch(TTS_SERVER + '/tts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      text: text,
      voice: chineseVoice,
      rate: chineseRate
    })
  });
  if (!res.ok) throw new Error('TTS server error');
  const blob = await res.blob();
  currentAudio = new Audio(URL.createObjectURL(blob));
  currentAudio.play();
}

// 备选：浏览器 Web Speech API（质量较低）
function speakWithBrowserTTS(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'zh-CN';
  utterance.rate = 0.85;
  utterance.pitch = 1.0;

  // 尝试选择最佳中文voice
  const voices = window.speechSynthesis.getVoices();
  const zhVoice = voices.find(v =>
    v.lang.startsWith('zh') && (v.name.includes('Neural') || v.name.includes('Online') || v.name.includes('Google'))
  ) || voices.find(v => v.lang.startsWith('zh-CN'));
  if (zhVoice) utterance.voice = zhVoice;

  window.speechSynthesis.speak(utterance);
}

// ========== SPEAK ENGLISH (Alternating Male/Female) ==========
const FEMALE_VOICE = 'en-US-JennyNeural';
const MALE_VOICE = 'en-US-GuyNeural';

async function speakEnglish(text, useMaleVoice) {
  if (!text) return;

  // 停止当前播放
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (window.speechSynthesis) { window.speechSynthesis.cancel(); }

  const voice = useMaleVoice ? MALE_VOICE : FEMALE_VOICE;
  // 谢尔顿式俏皮感：语速更快
  const rate = useMaleVoice ? '+20%' : '+15%';

  if (ttsServerAvailable) {
    try {
      await speakTextWithEdgeTTS(text, voice, rate);
      return;
    } catch (e) {
      console.warn('Edge TTS English failed, falling back:', e);
    }
  }

  // 降级到浏览器 TTS 英语
  await speakEnglishWithBrowserTTS(text);
}

// 兼容旧的 speakStory 调用
async function speakStory() {
  if (!currentLesson || !currentLesson.culturalStory) return;
  await speakEnglish(currentLesson.culturalStory, true); // Phase 2 用男声
}

async function speakTextWithEdgeTTS(text, voice, rate) {
  const res = await fetch('/api/tts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: text, voice: voice, rate: rate })
  });
  if (!res.ok) throw new Error('TTS server error');
  const blob = await res.blob();
  currentAudio = new Audio(URL.createObjectURL(blob));
  
  return new Promise((resolve, reject) => {
    currentAudio.onended = () => resolve();
    currentAudio.onerror = () => reject(new Error('Audio play error'));
    currentAudio.play().catch(reject);
  });
}

function speakEnglishWithBrowserTTS(text) {
  return new Promise((resolve) => {
    if (!('speechSynthesis' in window)) {
      resolve();
      return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.95;
    utterance.pitch = 1.0;

    const voices = window.speechSynthesis.getVoices();
    const enVoice = voices.find(v =>
      v.lang.startsWith('en') && (v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Microsoft'))
    ) || voices.find(v => v.lang.startsWith('en'));
    if (enVoice) utterance.voice = enVoice;

    utterance.onend = () => resolve();
    utterance.onerror = () => resolve(); // 出错也resolve，不阻塞后续
    
    window.speechSynthesis.speak(utterance);
  });
}
