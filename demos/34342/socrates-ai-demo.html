<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>苏格拉底AI - 你的个人思辨教练</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .phone-frame {
            width: 375px;
            height: 812px;
            background: #fff;
            border-radius: 40px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.15), 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            border: 8px solid #1a1a1a;
        }

        .status-bar {
            height: 44px;
            background: #4A90E2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            color: white;
            font-size: 14px;
            font-weight: 600;
        }

        .header {
            background: linear-gradient(135deg, #4A90E2 0%, #5BA3F5 100%);
            padding: 20px;
            color: white;
            text-align: center;
        }

        .header h1 {
            font-size: 22px;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .chat-container {
            height: calc(100% - 180px);
            overflow-y: auto;
            padding: 16px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
            align-items: flex-start;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            margin-right: 10px;
        }

        .ai-avatar {
            background: linear-gradient(135deg, #4A90E2, #5BA3F5);
        }

        .user-avatar {
            background: linear-gradient(135deg, #FF6B6B, #FF8E8E);
            margin-left: 10px;
            margin-right: 0;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .bubble {
            max-width: 240px;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .ai-bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .user-bubble {
            background: linear-gradient(135deg, #4A90E2, #5BA3F5);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 12px 16px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .input-area {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 12px 16px;
            border-top: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            border: none;
            background: #f5f5f5;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
        }

        .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4A90E2, #5BA3F5);
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .topic-chip {
            display: inline-block;
            padding: 6px 14px;
            background: #e3f2fd;
            color: #4A90E2;
            border-radius: 16px;
            font-size: 13px;
            margin: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .topic-chip:hover {
            background: #4A90E2;
            color: white;
        }

        .topic-suggestions {
            padding: 12px 16px;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .topic-suggestions p {
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 3px;
            background: #e0e0e0;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4A90E2, #5BA3F5);
            width: 30%;
            transition: width 0.5s ease;
        }

        .feature-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: rgba(74, 144, 226, 0.1);
            color: #4A90E2;
            border-radius: 12px;
            font-size: 11px;
            margin-top: 8px;
        }

        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 134px;
            height: 5px;
            background: #1a1a1a;
            border-radius: 3px;
        }

        .demo-label {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: #4A90E2;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="demo-label">产品交互演示</div>
        
        <div class="status-bar">
            <span>9:41</span>
            <span>苏格拉底AI</span>
            <span>100%</span>
        </div>

        <div class="header">
            <h1>苏格拉底AI</h1>
            <p>不给你答案，只给你问题</p>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>

        <div class="topic-suggestions">
            <p>推荐思辨主题</p>
            <span class="topic-chip" onclick="selectTopic('区块链技术')">区块链技术</span>
            <span class="topic-chip" onclick="selectTopic('人工智能伦理')">人工智能伦理</span>
            <span class="topic-chip" onclick="selectTopic('量子力学')">量子力学</span>
            <span class="topic-chip" onclick="selectTopic('存在主义')">存在主义</span>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message">
                <div class="avatar ai-avatar">🦉</div>
                <div class="bubble ai-bubble">
                    你好！我是你的思辨教练苏格拉底。请告诉我你想深入探索什么主题？我会通过提问引导你自己发现答案。
                    <div class="feature-badge">💡 苏格拉底式学习</div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="输入你想学习的主题..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>

        <div class="home-indicator"></div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const progress = document.getElementById('progress');
        let step = 0;
        let currentTopic = '';

        const socraticQuestions = {
            '区块链技术': [
                '你认为区块链最核心的创新是什么？',
                '为什么"去中心化"如此重要？它解决了什么问题？',
                '如果没有第三方机构验证，如何确保交易的可信度？',
                '你能想到现实生活中哪些场景最需要这种技术吗？'
            ],
            '人工智能伦理': [
                '当AI做出错误决策时，谁应该承担责任？',
                '隐私和便利之间，你认为平衡点在哪里？',
                '如果AI比人类更"聪明"，我们应该听从它的建议吗？'
            ],
            '量子力学': [
                '为什么经典物理无法解释微观世界的现象？',
                '"观测"为什么会改变量子系统的状态？',
                '量子纠缠是否意味着信息可以超光速传播？'
            ],
            '存在主义': [
                '如果生命没有预设的意义，这意味着什么？',
                '自由是礼物还是负担？',
                '你如何选择自己的价值观？'
            ]
        };

        const defaultQuestions = [
            '这是一个很有趣的主题！你目前对这个主题了解多少？',
            '你认为这个领域最核心的概念是什么？',
            '它与你已知的其他知识有什么联系？',
            '如果让你向一个10岁孩子解释，你会怎么说？',
            '这个知识如何改变你看待世界的方式？'
        ];

        function selectTopic(topic) {
            userInput.value = topic;
            sendMessage();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            if (step === 0) {
                currentTopic = text;
            }

            // 添加用户消息
            addMessage(text, 'user');
            userInput.value = '';

            // 显示AI正在输入
            showTyping();

            // 模拟AI回复
            setTimeout(() => {
                removeTyping();
                const reply = getAIReply(text);
                addMessage(reply, 'ai');
                step++;
                updateProgress();
            }, 1500);
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const avatar = document.createElement('div');
            avatar.className = `avatar ${sender === 'ai' ? 'ai-avatar' : 'user-avatar'}`;
            avatar.textContent = sender === 'ai' ? '🦉' : '👤';

            const bubble = document.createElement('div');
            bubble.className = `bubble ${sender === 'ai' ? 'ai-bubble' : 'user-bubble'}`;
            bubble.textContent = text;

            if (sender === 'user') {
                messageDiv.appendChild(bubble);
                messageDiv.appendChild(avatar);
            } else {
                messageDiv.appendChild(avatar);
                messageDiv.appendChild(bubble);
            }

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message typing';
            typingDiv.id = 'typing';
            typingDiv.innerHTML = `
                <div class="avatar ai-avatar">🦉</div>
                <div class="bubble ai-bubble typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById('typing');
            if (typing) typing.remove();
        }

        function getAIReply(userText) {
            const questions = socraticQuestions[currentTopic] || defaultQuestions;
            
            if (step === 0) {
                return `很好！让我们深入探索「${currentTopic}」。在开始学习之前，我想先问你：你最初为什么对这个主题感兴趣？`;
            }
            
            if (step <= questions.length) {
                return questions[step - 1];
            }
            
            return `非常棒！通过这一系列的思考，你对「${currentTopic}」已经有了更深入的理解。记住，真正的知识来自于你自己的思考，而不是别人的答案。要继续探索其他主题吗？`;
        }

        function updateProgress() {
            const progressPercent = Math.min(30 + step * 15, 100);
            progress.style.width = progressPercent + '%';
        }
    </script>
</body>
</html>
