<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>理智持仓</title>
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
    <!-- 首页 -->
    <div id="home-page" class="page active">
        <div class="page-content">
            <!-- 表单区域 -->
            <div class="form-container">
                <h2 class="form-title">理智持仓</h2>
                <form id="fund-form" novalidate>
                    <div class="form-item">
                        <label for="fund-code">基金编码 <span class="required">*</span></label>
                        <input type="text" id="fund-code" placeholder="请输入基金编码">
                        <div class="error-message"></div>
                    </div>

                    <div class="form-item">
                        <label for="base-price">定投基准金额 <span class="required">*</span></label>
                        <input type="number" id="base-price" placeholder="请输入整数金额" step="1" value="100">
                        <div class="error-message"></div>
                    </div>

                    <div class="form-item">
                        <label for="cost-price">持仓成本价 <span class="required">*</span></label>
                        <input type="number" id="cost-price" placeholder="请输入成本价" step="0.0001">
                        <div class="error-message"></div>
                    </div>

                    <div class="form-item hidden">
                        <label for="net-value">当前价格 <span class="required">*</span></label>
                        <input type="number" id="net-value" placeholder="请输入当前价格" step="0.0001">
                        <div class="error-message"></div>
                    </div>

                    <div class="form-item hidden">
                        <label for="daily-change">价格波动 <span class="required">*</span></label>
                        <input type="number" id="daily-change" placeholder="请输入价格波动" step="0.01">
                        <div class="error-message"></div>
                    </div>

                    <div class="form-item">
                        <label for="shares">持有份额 <span class="required">*</span></label>
                        <input type="number" id="shares" placeholder="请输入持有份额" step="0.01">
                        <div class="error-message"></div>
                    </div>

                    <button type="submit" class="submit-btn">提交</button>
                </form>
            </div>

            <!-- 公告区域 -->
            <div class="notice-container">
                <div class="notice-title">使用说明</div>
                <div class="notice-content" id="notice-content">
                    加载中...
                </div>
            </div>
        </div>
    </div>

    <!-- 我的页面 -->
    <div id="mine-page" class="page">
        <div class="page-content">
            <!-- 用户信息区域 -->
            <div class="user-section" id="user-section">
                <!-- 未登录状态 -->
                <div id="not-login" class="login-prompt">
                    <button class="login-btn" onclick="showLoginPage()">立即登录</button>
                </div>

                <!-- 已登录状态 -->
                <div id="logged-in" class="user-info" style="display: none;">
                    <div class="user-number">账号：<span id="user-code"></span></div>
                    <div class="expire-date"><span id="member-level"></span>截至使用日期：<span id="expire-date">2026年6月5日</span></div>
                </div>
            </div>

            <!-- 二维码区域 -->

        </div>
    </div>

    <!-- 登录页面 -->
    <div id="login-page" class="page">
        <div class="page-content">
            <div class="login-container">
                <!-- 登录表单 -->
                <div id="login-form-container">
                    <h2 class="login-title">用户登录</h2>
                    <form id="login-form" novalidate>
                        <div class="form-item">
                            <label for="username">账户</label>
                            <input type="text" id="username" placeholder="请输入账户">
                            <div class="error-message"></div>
                        </div>

                        <div class="form-item">
                            <label for="password">密码</label>
                            <input type="password" id="password" placeholder="请输入密码">
                            <div class="error-message"></div>
                        </div>

                        <button type="submit" class="login-submit-btn">登录</button>
                        <button type="button" class="register-toggle-btn" onclick="showRegisterForm()">去注册</button>
                        <button type="button" class="back-btn" onclick="showMinePage()">返回</button>
                    </form>
                </div>

                <!-- 注册表单 -->
                <div id="register-form-container" style="display: none;">
                    <h2 class="login-title">用户注册</h2>
                    <form id="register-form" novalidate>
                        <div class="form-item">
                            <label for="inviter">邀请人</label>
                            <input type="text" id="inviter" placeholder="双方各得10天X1会员">
                            <div class="error-message"></div>
                        </div>

                        <div class="form-item">
                            <label for="reg-username">账号 <span class="required">*</span></label>
                            <input type="text" id="reg-username" placeholder="请输入账号">
                            <div class="error-message"></div>
                        </div>

                        <div class="form-item">
                            <label for="reg-password">密码 <span class="required">*</span></label>
                            <input type="password" id="reg-password" placeholder="请输入密码">
                            <div class="error-message"></div>
                        </div>

                        <div class="form-item">
                            <label for="confirm-password">确认密码 <span class="required">*</span></label>
                            <input type="password" id="confirm-password" placeholder="请再次输入密码">
                            <div class="error-message"></div>
                        </div>

                        <button type="submit" class="login-submit-btn">注册</button>
                        <button type="button" class="register-toggle-btn" onclick="showLoginForm()">去登录</button>
                        <button type="button" class="back-btn" onclick="showMinePage()">返回</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 结果弹窗 -->
    <div id="result-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>操作建议</h3>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- 动态内容 -->
            </div>
            <div class="modal-footer">
                <button class="confirm-btn" onclick="closeModal()">确定</button>
            </div>
        </div>
    </div>

    <!-- 底部Tab导航 -->
    <div class="tab-bar">
        <div class="tab-item active" data-page="home" onclick="switchTab('home')">
            <div class="tab-icon">🏠</div>
            <div class="tab-label">首页</div>
        </div>
        <div class="tab-item" data-page="mine" onclick="switchTab('mine')">
            <div class="tab-icon">👤</div>
            <div class="tab-label">我的</div>
        </div>
    </div>

    <script src="js/config.js?v=1"></script>
    <script src="js/utils.js?v=2"></script>
    <script src="js/app.js?v=3"></script>
</body>
</html>
