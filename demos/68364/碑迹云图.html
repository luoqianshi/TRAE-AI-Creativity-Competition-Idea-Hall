<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>碑迹云图 - 石刻题记智能整理与3D人文展示系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'STSong', 'SimSun', 'Noto Serif SC', serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; color: #d4d4d4; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 36px; color: #c9a227; margin-bottom: 10px; text-shadow: 0 0 20px rgba(201, 162, 39, 0.3); }
        .header p { font-size: 16px; color: #a0a0a0; }
        
        .main-tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
        .tab-btn { padding: 12px 30px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #d4d4d4; cursor: pointer; transition: all 0.3s; font-size: 14px; }
        .tab-btn.active { background: rgba(201, 162, 39, 0.2); border-color: #c9a227; color: #c9a227; }
        .tab-btn:hover { background: rgba(255,255,255,0.1); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; }
        
        .card-3d { perspective: 1000px; }
        .card-inner { position: relative; width: 100%; height: 350px; transition: transform 0.8s; transform-style: preserve-3d; cursor: pointer; }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; overflow: hidden; }
        .card-front { background: linear-gradient(145deg, #2a2a4a, #1f1f3a); border: 2px solid rgba(201, 162, 39, 0.3); }
        .card-back { background: linear-gradient(145deg, #1f1f3a, #1a1a2e); border: 2px solid rgba(201, 162, 39, 0.2); transform: rotateY(180deg); }
        
        .card-header { background: rgba(201, 162, 39, 0.1); padding: 15px; text-align: center; border-bottom: 1px solid rgba(201, 162, 39, 0.2); }
        .card-header h3 { color: #c9a227; font-size: 18px; }
        .card-header .type-tag { display: inline-block; background: rgba(201, 162, 39, 0.2); padding: 4px 12px; border-radius: 15px; font-size: 12px; color: #c9a227; margin-top: 8px; }
        
        .card-body { padding: 20px; }
        .card-body .stone-image { width: 100%; height: 180px; background: linear-gradient(180deg, #3a3a5a, #2a2a4a); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 48px; margin-bottom: 15px; }
        .card-body .inscription { font-size: 14px; line-height: 1.8; color: #b0b0b0; text-align: center; }
        
        .card-back .card-body { padding: 20px; }
        .detail-row { display: flex; margin-bottom: 12px; }
        .detail-label { width: 80px; color: #888; font-size: 13px; }
        .detail-value { flex: 1; color: #d4d4d4; font-size: 13px; }
        
        .relation-section { margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); }
        .relation-section h4 { color: #c9a227; font-size: 14px; margin-bottom: 10px; }
        .relation-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .relation-tag { background: rgba(201, 162, 39, 0.15); padding: 4px 10px; border-radius: 4px; font-size: 12px; color: #c9a227; cursor: pointer; transition: background 0.3s; }
        .relation-tag:hover { background: rgba(201, 162, 39, 0.3); }
        
        .network-container { height: 600px; background: rgba(0,0,0,0.3); border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .network-title { text-align: center; padding: 20px; color: #c9a227; font-size: 20px; }
        
        .family-tree-container { padding: 20px; }
        .family-tree { display: flex; flex-direction: column; align-items: center; }
        .tree-node { background: linear-gradient(145deg, #2a2a4a, #1f1f3a); border: 1px solid rgba(201, 162, 39, 0.3); border-radius: 8px; padding: 15px 30px; text-align: center; margin-bottom: 30px; position: relative; }
        .tree-node::after { content: ''; position: absolute; bottom: -30px; left: 50%; width: 2px; height: 30px; background: rgba(201, 162, 39, 0.3); }
        .tree-node:last-child::after { display: none; }
        .tree-node .name { color: #c9a227; font-size: 18px; font-weight: bold; }
        .tree-node .info { color: #888; font-size: 12px; margin-top: 5px; }
        .tree-branch { display: flex; gap: 40px; }
        .tree-connection { position: absolute; top: -30px; left: 50%; width: 2px; height: 30px; background: rgba(201, 162, 39, 0.3); }
        
        .donation-section { background: rgba(0,0,0,0.2); border-radius: 12px; padding: 25px; }
        .donation-section h3 { color: #c9a227; margin-bottom: 20px; font-size: 20px; }
        .donation-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .donation-item { background: rgba(255,255,255,0.03); border-radius: 8px; padding: 20px; border-left: 3px solid #c9a227; }
        .donation-item .donor { color: #c9a227; font-size: 16px; font-weight: bold; }
        .donation-item .amount { color: #4ade80; font-size: 24px; margin: 10px 0; }
        .donation-item .desc { color: #888; font-size: 13px; line-height: 1.6; }
        
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: rgba(201, 162, 39, 0.1); border-radius: 12px; padding: 25px; text-align: center; border: 1px solid rgba(201, 162, 39, 0.2); }
        .stat-card .number { font-size: 36px; color: #c9a227; font-weight: bold; }
        .stat-card .label { font-size: 14px; color: #888; margin-top: 8px; }
        
        @keyframes glow { 0%, 100% { box-shadow: 0 0 20px rgba(201, 162, 39, 0.3); } 50% { box-shadow: 0 0 40px rgba(201, 162, 39, 0.5); } }
        .card-inner:not(.flipped):hover .card-front { animation: glow 2s infinite; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📜 碑迹云图</h1>
            <p>石刻题记智能整理与3D人文展示系统 | 挖掘历史痕迹，传承文化记忆</p>
        </div>
        
        <div class="stats-row">
            <div class="stat-card">
                <div class="number">128</div>

        <div class="main-tabs">

            <button class="tab-btn" onclick="switchTab('family')">👨‍👩‍👧‍👦 家族谱系</button>
            <button class="tab-btn" onclick="switchTab('donation')">💝 公益捐赠</button>
        </div>
        
        <div id="stones" class="tab-content active">
            <div class="cards-grid" id="stonesGrid"></div>
        </div>
        
        <div id="network" class="tab-content">
            <div class="network-title">人物-地名-家族关联图谱</div>
            <div class="network-container">
                <svg id="networkSvg" width="100%" height="100%" viewBox="0 0 1200 550"></svg>
            </div>
        </div>
        
        <div id="family" class="tab-content">
            <div class="family-tree-container">
                <h3 style="color:#c9a227; text-align:center; margin-bottom:30px; font-size:24px;">陈氏家族世系图谱</h3>

            </div>
        </div>
        
        <div id="donation" class="tab-content">
            <div class="donation-section">
                <h3>💝 公益捐赠记录</h3>
                <div class="donation-list" id="donationList"></div>
            </div>
        </div>
    </div>

    <script>
        const stonesData = [
            {

                person: "张载",
                family: "横渠张氏",
                related: ["横渠书院", "关学", "理学"]
            },
            {
                id: 3,
                title: "岳氏墓碑",
                type: "墓碑",
                location: "河南汤阴",
                year: "南宋绍兴三十二年",
                image: "🪦",
                inscription: "宋岳鄂王墓\n绍兴三十二年立\n忠烈武穆岳飞\n字鹏举，相州汤阴人\n精忠报国，威震敌胆\n含冤而死，千古流芳",
                person: "岳飞",
                family: "岳氏家族",
                related: ["岳家军", "精忠报国", "杭州岳庙"]
            },
            {
                id: 4,
                title: "王羲之兰亭序碑",
                type: "碑刻",
                location: "浙江绍兴",
                year: "东晋永和九年",
                image: "✍️",
                inscription: "永和九年，岁在癸丑\n暮春之初，会于会稽山阴之兰亭\n修禊事也。群贤毕至，少长咸集\n此地有崇山峻岭，茂林修竹\n又有清流激湍，映带左右\n引以为流觞曲水，列坐其次",
                person: "王羲之",
                family: "琅琊王氏",

            },
            {
                id: 5,
                title: "范仲淹岳阳楼记碑",
                type: "碑刻",
                location: "湖南岳阳",
                year: "北宋庆历六年",
                image: "🏯",
                inscription: "庆历四年春，滕子京谪守巴陵郡\n越明年，政通人和，百废俱兴\n乃重修岳阳楼，增其旧制\n刻唐贤今人诗赋于其上\n属予作文以记之\n不以物喜，不以己悲",
                person: "范仲淹",
                family: "范氏家族",

            },

                person: "林则徐",
                family: "侯官林氏",
                related: ["虎门销烟", "鸦片战争", "广东"]
            },
            {
                id: 7,
                title: "朱熹白鹿洞书院碑",
                type: "书院碑",
                location: "江西九江",
                year: "南宋淳熙六年",
                image: "📚",
                inscription: "白鹿洞书院重建记\n淳熙六年，朱熹知南康军\n访白鹿洞遗址，慨然兴复\n订立学规，讲学授徒\n为天下书院之楷模\n博学之，审问之\n慎思之，明辨之，笃行之",
                person: "朱熹",
                family: "新安朱氏",
                related: ["白鹿洞书院", "程朱理学", "南康"]
            },
            {
                id: 8,
                title: "孙中山纪念碑",
                type: "纪念碑",
                location: "广东广州",
                year: "民国十八年",
                image: "🗿",
                inscription: "总理孙中山先生纪念碑\n民国十八年一月十八日奠基\n先生致力于国民革命凡四十年\n其目的在求中国之自由平等\n积四十年之经验\n深知欲达到此目的\n必须唤起民众",
                person: "孙中山",
                family: "翠亨孙氏",
                related: ["辛亥革命", "三民主义", "黄埔军校"]
            }
        ];
        
        const familyData = {
            name: "陈延璋",
            title: "入闽始祖",
            year: "唐光启年间",
            children: [
                {
                    name: "陈守仁",
                    title: "二世祖",
                    year: "五代",
                    children: [
                        { name: "陈德明", title: "三世祖", year: "北宋", children: [] },
                        { name: "陈德辉", title: "三世祖", year: "北宋", children: [
                            { name: "陈文翰", title: "四世祖", year: "南宋", children: [
                                { name: "陈嘉庚", title: "华侨领袖", year: "1874-1961", children: [] }
                            ]}
                        ]}
                    ]
                },
                {
                    name: "陈守信",
                    title: "二世祖",
                    year: "五代",
                    children: [
                        { name: "陈德华", title: "三世祖", year: "北宋", children: [] }
                    ]
                }
            ]
        };
        
        const donationData = [
            { donor: "陈嘉庚基金会", amount: "¥500,000", desc: "捐赠用于陈氏宗祠修缮及文化传承项目，包括碑刻保护、族谱整理等" },
            { donor: "张载研究会", amount: "¥280,000", desc: "资助横渠书院重建及张载思想研究，支持石刻题记数字化保护" },
            { donor: "岳氏宗亲会", amount: "¥200,000", desc: "捐赠岳氏家族墓地修缮基金，保护历史墓碑及相关文物" },
            { donor: "王羲之书法研究会", amount: "¥150,000", desc: "支持兰亭序碑数字化复原及书法文化推广活动" },
            { donor: "范仲淹文化促进会", amount: "¥120,000", desc: "资助岳阳楼碑刻保护及范仲淹思想研究项目" },
            { donor: "林则徐纪念馆", amount: "¥100,000", desc: "捐赠用于虎门销烟遗址保护及禁毒教育宣传" }
        ];
        
        const networkNodes = [
            { id: 'chen', label: '陈延璋', type: 'person', x: 300, y: 275 },
            { id: 'jiageng', label: '陈嘉庚', type: 'person', x: 500, y: 180 },
            { id: 'quanzhou', label: '泉州', type: 'location', x: 400, y: 350 },
            { id: 'chenzongci', label: '陈氏宗祠', type: 'place', x: 300, y: 450 },
            { id: 'zhangzai', label: '张载', type: 'person', x: 700, y: 150 },
            { id: 'hengqu', label: '横渠书院', type: 'place', x: 850, y: 250 },
            { id: 'shaanxi', label: '陕西眉县', type: 'location', x: 750, y: 350 },
            { id: 'yuefei', label: '岳飞', type: 'person', x: 900, y: 450 },
            { id: 'tangyin', label: '河南汤阴', type: 'location', x: 950, y: 350 },
            { id: 'wangxizhi', label: '王羲之', type: 'person', x: 150, y: 150 },
            { id: 'lan亭', label: '兰亭', type: 'place', x: 250, y: 80 },
            { id: 'shaoxing', label: '浙江绍兴', type: 'location', x: 100, y: 250 },
            { id: 'fanzhongyan', label: '范仲淹', type: 'person', x: 500, y: 450 },
            { id: 'yueyang', label: '岳阳楼', type: 'place', x: 600, y: 380 },
            { id: 'hunanan', label: '湖南岳阳', type: 'location', x: 450, y: 520 },
            { id: 'linzexu', label: '林则徐', type: 'person', x: 800, y: 500 },
            { id: 'humen', label: '虎门', type: 'place', x: 950, y: 520 },
            { id: 'guangdong', label: '广东东莞', type: 'location', x: 700, y: 520 }
        ];
        
        const networkLinks = [
            { source: 'chen', target: 'jiageng' },
            { source: 'chen', target: 'quanzhou' },
            { source: 'chen', target: 'chenzongci' },
            { source: 'jiageng', target: 'chenzongci' },
            { source: 'zhangzai', target: 'hengqu' },
            { source: 'zhangzai', target: 'shaanxi' },
            { source: 'hengqu', target: 'shaanxi' },
            { source: 'yuefei', target: 'tangyin' },
            { source: 'wangxizhi', target: 'lan亭' },
            { source: 'wangxizhi', target: 'shaoxing' },
            { source: 'lan亭', target: 'shaoxing' },
            { source: 'fanzhongyan', target: 'yueyang' },
            { source: 'fanzhongyan', target: 'hunanan' },
            { source: 'yueyang', target: 'hunanan' },
            { source: 'linzexu', target: 'humen' },
            { source: 'linzexu', target: 'guangdong' },
            { source: 'humen', target: 'guangdong' }
        ];
        
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }
        
        function renderStones() {
            const grid = document.getElementById('stonesGrid');
            grid.innerHTML = stonesData.map(stone => `
                <div class="card-3d">
                    <div class="card-inner" onclick="this.classList.toggle('flipped')">
                        <div class="card-front">
                            <div class="card-header">
                                <h3>${stone.title}</h3>
                                <span class="type-tag">${stone.type}</span>
                            </div>
                            <div class="card-body">
                                <div class="stone-image">${stone.image}</div>
                                <div class="inscription">${stone.inscription.substring(0, 80)}...</div>
                            </div>
                        </div>
                        <div class="card-back">
                            <div class="card-header">
                                <h3>${stone.title}</h3>
                                <span class="type-tag">详情</span>
                            </div>
                            <div class="card-body">
                                <div class="detail-row">
                                    <span class="detail-label">位置</span>
                                    <span class="detail-value">${stone.location}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">年代</span>
                                    <span class="detail-value">${stone.year}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">相关人物</span>
                                    <span class="detail-value">${stone.person}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">所属家族</span>
                                    <span class="detail-value">${stone.family}</span>
                                </div>
                                <div class="relation-section">
                                    <h4>关联信息</h4>
                                    <div class="relation-tags">
                                        ${stone.related.map(r => `<span class="relation-tag">${r}</span>`).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function renderNetwork() {
            const svg = document.getElementById('networkSvg');
            let html = '';
            
            networkLinks.forEach(link => {
                const source = networkNodes.find(n => n.id === link.source);
                const target = networkNodes.find(n => n.id === link.target);
                html += `<line x1="${source.x}" y1="${source.y}" x2="${target.x}" y2="${target.y}" stroke="rgba(201,162,39,0.3)" stroke-width="2"/>`;
            });
            
            networkNodes.forEach(node => {
                const color = node.type === 'person' ? '#c9a227' : node.type === 'location' ? '#4ade80' : '#60a5fa';
                html += `
                    <circle cx="${node.x}" cy="${node.y}" r="25" fill="rgba(42,42,74,0.8)" stroke="${color}" stroke-width="2"/>
                    <text x="${node.x}" y="${node.y + 6}" text-anchor="middle" fill="${color}" font-size="12">${node.label}</text>
                    <circle cx="${node.x}" cy="${node.y}" r="25" fill="transparent" class="node-hover" style="cursor:pointer;" onclick="showNodeInfo('${node.id}')"/>
                `;
            });
            
            svg.innerHTML = html;
        }
        
        function showNodeInfo(nodeId) {
            const node = networkNodes.find(n => n.id === nodeId);
            alert(`节点信息：\n名称：${node.label}\n类型：${node.type === 'person' ? '历史人物' : node.type === 'location' ? '地名' : '场所'}`);
        }
        
        function renderFamilyTree(node, level = 0) {
            if (!node) return '';
            
            let html = `<div class="tree-node" style="margin-left: ${level * 60}px;">`;
            html += `<div class="name">${node.name}</div>`;
            html += `<div class="info">${node.title} · ${node.year}</div>`;
            html += '</div>';
            
            if (node.children && node.children.length > 0) {
                html += '<div class="tree-branch">';
                node.children.forEach(child => {
                    html += renderFamilyTree(child, level + 1);
                });
                html += '</div>';
            }
            
            return html;
        }
        
        function renderDonations() {
            const list = document.getElementById('donationList');
            list.innerHTML = donationData.map(d => `
                <div class="donation-item">
                    <div class="donor">${d.donor}</div>
                    <div class="amount">${d.amount}</div>
                    <div class="desc">${d.desc}</div>
                </div>
            `).join('');
        }
        
        renderStones();
        renderNetwork();
        document.getElementById('familyTree').innerHTML = renderFamilyTree(familyData);
        renderDonations();
    </script>
</body>
</html>
