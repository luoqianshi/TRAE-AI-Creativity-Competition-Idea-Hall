<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首页 - 忆安昇光学扫码出入库系统</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
    }

    .welcome-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      color: white;
    }

    .welcome-card h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .welcome-card p {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 15px;
    }

    .welcome-pending {
      display: flex;
      gap: 15px;
    }

    .welcome-pending-item {
      flex: 1;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .welcome-pending-value {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .welcome-pending-label {
      font-size: 12px;
      opacity: 0.9;
    }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .quick-action-item {
      background-color: #fff;
      border-radius: 12px;
      padding: 20px 10px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .quick-action-item:active {
      transform: scale(0.96);
    }

    .quick-action-icon {
      width: 45px;
      height: 45px;
      margin: 0 auto 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .icon-scan {
      background-color: #e6f7ff;
      color: #1890ff;
    }

    .icon-warehouse {
      background-color: #f6ffed;
      color: #52c41a;
    }

    .icon-inventory {
      background-color: #fff7e6;
      color: #fa8c16;
    }

    .quick-action-title {
      font-size: 13px;
      font-weight: 500;
      color: #333;
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
      color: #333;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: '';
      width: 4px;
      height: 14px;
      background-color: #1890ff;
      border-radius: 2px;
    }

    .pending-card {
      background-color: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pending-card:active {
      background-color: #f9f9f9;
    }

    .pending-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .pending-title {
      font-size: 15px;
      font-weight: 600;
      color: #333;
    }

    .pending-count {
      background-color: #ff4d4f;
      color: white;
      padding: 2px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 500;
    }

    .pending-content {
      display: flex;
      gap: 15px;
    }

    .pending-item {
      flex: 1;
      text-align: center;
      padding: 15px;
      background-color: #fafafa;
      border-radius: 8px;
    }

    .pending-item-value {
      font-size: 24px;
      font-weight: 600;
      color: #1890ff;
      margin-bottom: 5px;
    }

    .pending-item-label {
      font-size: 12px;
      color: #999;
    }

    .menu-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      display: none;
      justify-content: flex-end;
    }

    .menu-modal.show {
      display: flex;
    }

    .safe-pwd-input {
      width: 100%;
      padding: 12px;
      border: 1px solid #e8e8e8;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
      text-align: center;
      letter-spacing: 4px;
      -webkit-text-security: disc;
      text-security: disc;
    }

    .safe-pwd-input:focus {
      border-color: #1890ff;
      outline: none;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: #fff;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-size: 16px;
      color: #333;
      margin: 0;
    }

    .modal-body {
      padding: 20px;
    }

    .modal-footer {
      padding: 12px 20px;
      border-top: 1px solid #f0f0f0;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #d9d9d9;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-default {
      background: #fff;
      color: #666;
    }

    .btn-default:hover {
      background: #f5f5f5;
    }

    .btn-primary {
      background: #1890ff;
      color: #fff;
      border-color: #1890ff;
    }

    .btn-primary:hover {
      background: #40a9ff;
    }

    .menu-content {
      width: 70%;
      max-width: 300px;
      background-color: #fff;
      height: 100%;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    .menu-header {
      padding: 20px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .menu-user-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 22px;
    }

    .menu-user-info {
      flex: 1;
    }

    .menu-user-name {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }

    .menu-user-role {
      font-size: 13px;
      color: #999;
    }

    .menu-list {
      padding: 10px 0;
    }

    .menu-item {
      display: flex;
      align-items: center;
      padding: 15px 20px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .menu-item:hover {
      background-color: #f5f5f5;
    }

    .menu-item-icon {
      width: 24px;
      height: 24px;
      margin-right: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .menu-item-text {
      flex: 1;
      font-size: 15px;
      color: #333;
    }

    .menu-item-arrow {
      width: 12px;
      height: 12px;
      border-right: 2px solid #ccc;
      border-bottom: 2px solid #ccc;
      transform: rotate(-45deg);
    }

    .menu-divider {
      height: 1px;
      background-color: #f0f0f0;
      margin: 10px 0;
    }

    .logout-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      margin: 20px;
      background-color: #fff2f0;
      color: #ff4d4f;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
    }

    .logout-btn:hover {
      background-color: #ffccc7;
    }

    .purchase-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      display: none;
      align-items: flex-end;
    }

    .purchase-modal.show {
      display: flex;
    }

    .purchase-content {
      width: 100%;
      background-color: #fff;
      border-radius: 16px 16px 0 0;
      padding: 20px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .purchase-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 15px;
      text-align: center;
    }

    .purchase-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .purchase-item {
      background-color: #f8f9fa;
      border-radius: 12px;
      padding: 20px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .purchase-item:active {
      transform: scale(0.96);
    }

    .purchase-icon {
      width: 40px;
      height: 40px;
      margin: 0 auto 10px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .purchase-icon-apply {
      background-color: #e6f7ff;
      color: #1890ff;
    }

    .purchase-icon-audit {
      background-color: #f6ffed;
      color: #52c41a;
    }

    .purchase-icon-progress {
      background-color: #fff7e6;
      color: #fa8c16;
    }

    .purchase-icon-receive {
      background-color: #f9f0ff;
      color: #722ed1;
    }

    .purchase-icon-records {
      background-color: #fff2f0;
      color: #ff4d4f;
    }

    .purchase-icon-detail {
      background-color: #e6fffb;
      color: #13c2c2;
    }

    .purchase-title-text {
      font-size: 13px;
      color: #333;
    }

    .close-btn {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      background-color: #f5f5f5;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      color: #666;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="page-container">
    <div class="page-header">
      <div class="header">
        <div style="display: flex; align-items: center; gap: 10px;">
          <img src="/images/LOGO.png" alt="LOGO" style="height: 32px; width: auto; max-height: 40px; object-fit: contain; mix-blend-mode: multiply;">
          <h1>忆安昇数字化系统</h1>
        </div>
        <div class="user-info" id="userInfo">
          <button id="menuBtn" style="background: none; border: none; cursor: pointer; font-size: 22px; padding: 5px 8px; color: #333;">☰</button>
        </div>
      </div>
    </div>

    <div class="page-content">
      <div class="welcome-card">
        <h2 id="welcomeText">欢迎回来</h2>
        <p id="currentTime"></p>
        <div class="welcome-pending">
          <div class="welcome-pending-item" id="pendingApprovalItem" onclick="goToPendingApproval()">
            <div class="welcome-pending-value" id="pendingValue">0</div>
            <div class="welcome-pending-label" id="pendingLabel">待审批申请</div>
          </div>
          <div class="welcome-pending-item" id="purchasePendingItem" style="display: none;" onclick="goToPendingPurchase()">
            <div class="welcome-pending-value" id="pendingPurchaseValue">0</div>
            <div class="welcome-pending-label">待采购申请</div>
          </div>
        </div>
      </div>

      <div class="quick-actions">
        <div class="quick-action-item" onclick="goToScan()">
          <div class="quick-action-icon icon-scan">📷</div>
          <div class="quick-action-title">扫码出入库</div>
        </div>
        <div class="quick-action-item" onclick="goToWarehouse()">
          <div class="quick-action-icon icon-warehouse">🏠</div>
          <div class="quick-action-title">仓库管理</div>
        </div>
        <div class="quick-action-item" onclick="goToInventory()">
          <div class="quick-action-icon icon-inventory">📊</div>
          <div class="quick-action-title">库存管理</div>
        </div>
      </div>

      

      <div class="section-title">功能菜单</div>
      <div class="grid-container">
        <div class="grid-item" onclick="showPurchaseModal()">
          <div class="grid-item-icon" style="background-color: #e6f7ff;">📋</div>
          <div class="grid-item-title">采购管理</div>
        </div>
        <div class="grid-item" id="gridStaffItem" onclick="goToStaff()">
          <div class="grid-item-icon" style="background-color: #f6ffed;">👥</div>
          <div class="grid-item-title">人员管理</div>
        </div>
        <div class="grid-item" onclick="goToLogs()">
          <div class="grid-item-icon" style="background-color: #fff7e6;">📝</div>
          <div class="grid-item-title">操作日志</div>
        </div>
        <div class="grid-item" id="gridPasswordItem" onclick="goToPassword()">
          <div class="grid-item-icon" style="background-color: #f9f0ff;">🔐</div>
          <div class="grid-item-title">密码管理</div>
        </div>
        <div class="grid-item" onclick="goToBorrowTool()">
          <div class="grid-item-icon" style="background-color: #fff7e6;">🔧</div>
          <div class="grid-item-title">工具借用</div>
        </div>
        <div class="grid-item" onclick="goToAiDiagnosis()">
          <div class="grid-item-icon" style="background-color: #e6f7ff;">🤖</div>
          <div class="grid-item-title">AI排障</div>
        </div>
      </div>
    </div>

    <div class="menu-modal" id="menuModal">
      <div class="menu-content">
        <div class="menu-header">
          <div class="menu-user-avatar" id="menuAvatar">👤</div>
          <div class="menu-user-info">
            <div class="menu-user-name" id="menuUserName">用户</div>
            <div class="menu-user-role" id="menuUserRole">普通用户</div>
          </div>
        </div>
        <div class="menu-list">
          <div class="menu-item" onclick="goToScan(); closeMenu();">
            <div class="menu-item-icon">📷</div>
            <span class="menu-item-text">扫码出入库</span>
            <div class="menu-item-arrow"></div>
          </div>
          <div class="menu-item" onclick="goToWarehouse(); closeMenu();">
            <div class="menu-item-icon">🏠</div>
            <span class="menu-item-text">仓库管理</span>
            <div class="menu-item-arrow"></div>
          </div>
          <div class="menu-item" onclick="goToInventory(); closeMenu();">
            <div class="menu-item-icon">📊</div>
            <span class="menu-item-text">库存管理</span>
            <div class="menu-item-arrow"></div>
          </div>
          <div class="menu-divider"></div>
          <div class="menu-item" id="menuStaffItem" onclick="goToStaffModal(); closeMenu();">
            <div class="menu-item-icon">👥</div>
            <span class="menu-item-text">人员管理</span>
            <div class="menu-item-arrow"></div>
          </div>
          <div class="menu-item" onclick="goToLogs(); closeMenu();">
            <div class="menu-item-icon">📝</div>
            <span class="menu-item-text">操作日志</span>
            <div class="menu-item-arrow"></div>
          </div>
          <div class="menu-item" id="menuPasswordItem" onclick="goToPasswordModal(); closeMenu();">
            <div class="menu-item-icon">🔐</div>
            <span class="menu-item-text">密码管理</span>
            <div class="menu-item-arrow"></div>
          </div>
          <div class="menu-item" id="menuApprovalCategoryItem" onclick="goToApprovalCategoryModal(); closeMenu();">
            <div class="menu-item-icon">⚙️</div>
            <span class="menu-item-text">审批类别</span>
            <div class="menu-item-arrow"></div>
          </div>
        </div>
        <div class="menu-item" onclick="goToPasswordModal(); closeMenu();" style="border-top:1px solid #f0f0f0;margin-top:8px;padding-top:16px;">
          <div class="menu-item-icon">🔑</div>
          <span class="menu-item-text">修改密码</span>
          <div class="menu-item-arrow"></div>
        </div>
        <div class="menu-item" onclick="goToCertDownload(); closeMenu();">
          <div class="menu-item-icon">🔐</div>
          <span class="menu-item-text">证书下载</span>
          <div class="menu-item-arrow"></div>
        </div>
        <div class="menu-item" id="menuDbManageItem" onclick="goToDbManage(); closeMenu();">
          <div class="menu-item-icon">🗄️</div>
          <span class="menu-item-text">数据库管理</span>
          <div class="menu-item-arrow"></div>
        </div>
        <div class="logout-btn" onclick="doLogout()">退出登录</div>
      </div>
    </div>

    <div class="purchase-modal" id="purchaseModal">
      <div class="purchase-content">
        <div class="purchase-title">采购管理</div>
        <div class="purchase-grid">
          <div class="purchase-item" onclick="goToPurchaseApply(); closePurchaseModal();">
            <div class="purchase-icon purchase-icon-apply">📝</div>
            <div class="purchase-title-text">采购申请</div>
          </div>
          <div class="purchase-item" id="purchaseAuditItem" onclick="goToPurchaseAudit(); closePurchaseModal();">
            <div class="purchase-icon purchase-icon-audit">✅</div>
            <div class="purchase-title-text">采购审批</div>
          </div>
          <div class="purchase-item" onclick="goToApprovalProgress(); closePurchaseModal();">
            <div class="purchase-icon purchase-icon-detail">&#x1F50D;</div>
            <div class="purchase-title-text">审批进度</div>
          </div>
          <div class="purchase-item" onclick="goToPurchaseProgress(); closePurchaseModal();">
            <div class="purchase-icon purchase-icon-progress">&#x1F4C8;</div>
            <div class="purchase-title-text">采购进度</div>
          </div>
          <div class="purchase-item" onclick="goToPurchaseReceive(); closePurchaseModal();">
            <div class="purchase-icon purchase-icon-receive">&#x1F4E6;</div>
            <div class="purchase-title-text">请购领用</div>
          </div>
          <div class="purchase-item" onclick="goToReceiveRecords(); closePurchaseModal();">
            <div class="purchase-icon purchase-icon-records">&#x1F4CB;</div>
            <div class="purchase-title-text">领用记录</div>
          </div>
        </div>
        <button class="close-btn" onclick="closePurchaseModal()">关闭</button>
      </div>
    </div>

    <div class="modal-overlay" id="safePasswordModal" style="display:none;">
      <div class="modal-content" style="max-width:380px;">
        <div class="modal-header">
          <h3>验证管理员密码</h3>
        </div>
        <div class="modal-body">
          <div style="margin-top:10px;">
            <input type="password" id="safePasswordInput" class="safe-pwd-input" placeholder="输入安全密码" maxlength="6">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-default" onclick="closeSafePasswordModal()">取消</button>
          <button class="btn btn-primary" onclick="confirmSafePassword()">确定</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/wx.js"></script>
  <script>
    const app = getApp();
    let loginUser = null;
    let pendingSafePasswordCallback = null;

    document.addEventListener('DOMContentLoaded', function() {
      checkLogin();
      updateCurrentTime();
      setInterval(updateCurrentTime, 60000);
      
      document.getElementById('menuBtn').addEventListener('click', toggleMenu);
    });

    function hasAuditPermission() {
      if (!loginUser) return false;
      if (loginUser.name === '管理员') return true;
      return loginUser.hasPurchaseAuditPermission === true || loginUser.hasPurchaseAuditPermission === 1;
    }

    function hasPurchaserPermission() {
      if (!loginUser) return false;
      if (loginUser.name === '管理员') return true;
      return loginUser.isPurchaser === true || loginUser.isPurchaser === 1;
    }

    function isAdmin() {
      return loginUser && loginUser.name === '管理员';
    }

    function isApproverMe(ap) {
      if (!ap || !loginUser) return false;
      if (ap._id && loginUser._id && ap._id === loginUser._id) return true;
      if (ap.name && loginUser.name && ap.name === loginUser.name) return true;
      return false;
    }

    function checkLogin() {
      loginUser = wx.getStorageSync('loginUser');
      if (!loginUser) {
        window.location.href = '/pages/login.html';
        return;
      }
      app.globalData.loginUser = loginUser;
      
      document.getElementById('menuAvatar').textContent = loginUser.name.charAt(0);
      document.getElementById('menuUserName').textContent = loginUser.name;
      document.getElementById('menuUserRole').textContent = loginUser.isPurchaser ? '采购人员' : '普通用户';
      document.getElementById('welcomeText').textContent = `欢迎回来，${loginUser.name}`;
      
      const isPurchaserUser = hasPurchaserPermission();
      const hasAuditPerm = hasAuditPermission();
      const canSeeAudit = isPurchaserUser || hasAuditPerm;

      if (!canSeeAudit) {
        const auditItem = document.getElementById('purchaseAuditItem');
        if (auditItem) auditItem.style.display = 'none';
      }

      if (!isAdmin()) {
        const gridStaff = document.getElementById('gridStaffItem');
        if (gridStaff) gridStaff.style.display = 'none';
        const gridPwd = document.getElementById('gridPasswordItem');
        if (gridPwd) gridPwd.style.display = 'none';
        const menuStaff = document.getElementById('menuStaffItem');
        if (menuStaff) menuStaff.style.display = 'none';
        const menuPwd = document.getElementById('menuPasswordItem');
        if (menuPwd) menuPwd.style.display = 'none';
        const menuCat = document.getElementById('menuApprovalCategoryItem');
        if (menuCat) menuCat.style.display = 'none';
      }

      if (loginUser.name !== '管理员') {
        const menuDb = document.getElementById('menuDbManageItem');
        if (menuDb) menuDb.style.display = 'none';
      }
      
      if (isPurchaserUser) {
        document.getElementById('purchasePendingItem').style.display = 'block';
      }
      
      if (canSeeAudit) {
        getPendingApprovalCount();
      } else {
        document.getElementById('pendingLabel').textContent = '待请购领用';
        getPendingReceiveCount();
      }
      if (isPurchaserUser) {
        getPendingPurchaseCount();
      }
    }

    function updateCurrentTime() {

      const options = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };

    }

    function getPendingApprovalCount() {
      if (!hasAuditPermission()) {
        document.getElementById('pendingValue').textContent = 0;
        return;
      }

      wx.cloud.callFunction({
        name: 'dbOperation',
        data: {
          action: 'get',
          collection: 'approval_categories'
        }
      }).then(catRes => {
        const categories = (catRes.success && catRes.data) ? catRes.data : [];
        wx.cloud.callFunction({
          name: 'dbOperation',
          data: {
            action: 'get',
            collection: 'purchase_apply',
            where: { auditStatus: 0 }
          }
        }).then(purchaseRes => {
          const pendingPurchases = (purchaseRes.success && purchaseRes.data) ? purchaseRes.data : [];
          const approverCategories = categories.filter(cat => {
            let catApprovers = cat.approvers || [];
            if (typeof catApprovers === 'string') {
              try { catApprovers = JSON.parse(catApprovers); } catch(e) { catApprovers = []; }
            }
            return Array.isArray(catApprovers) && catApprovers.some(ap => isApproverMe(ap));
          });
          const categoryIds = approverCategories.map(cat => cat._id);
          let count = 0;

          if (loginUser.name === '管理员' || categoryIds.length === 0) {
            count = pendingPurchases.length;
          } else {
            count = pendingPurchases.filter(item => {
              if (!categoryIds.includes(item.categoryId)) return false;
              let approverList = item.approverList || [];
              if (typeof approverList === 'string') {
                try { approverList = JSON.parse(approverList); } catch(e) { approverList = []; }
              }
              if (!Array.isArray(approverList) || approverList.length === 0) return true;
              for (let i = 0; i < approverList.length; i++) {
                if (isApproverMe(approverList[i])) {
                  let prevAllApproved = true;
                  for (let j = 0; j < i; j++) {
                    if (approverList[j].status !== 1) { prevAllApproved = false; break; }
                  }
                  return prevAllApproved && approverList[i].status === 0;
                }
              }
              return false;
            }).length;
          }

          document.getElementById('pendingValue').textContent = count;
        }).catch(err => {
          console.error('获取待审批申请失败', err);
        });
      }).catch(err => {
        console.error('获取审批类别失败', err);
      });
    }

    function getPendingPurchaseCount() {
      wx.cloud.callFunction({
        name: 'dbOperation',
        data: {
          action: 'get',
          collection: 'purchase_apply',
          where: { auditStatus: 1 }
        }
      }).then(res => {
        let allList = (res.success && res.data) ? res.data : [];
        if (!hasPurchaserPermission()) {
          allList = allList.filter(item => item.applicant === loginUser.name);
        }
        let count = 0;
        allList.forEach(item => {
          const ml = getMatList(item);
          ml.forEach(m => {
            const ps = (m.purchaseStatus !== undefined && m.purchaseStatus !== null) ? m.purchaseStatus : (item.purchaseStatus || 0);
            if (ps === 0) {
              count++;
            }
          });
        });
        document.getElementById('pendingPurchaseValue').textContent = count;
      }).catch(err => {
        console.error('获取待采购数量失败', err);
      });
    }

    function getMatList(item) {
      let ml = item.materialList;
      if (typeof ml === 'string') {
        try { ml = JSON.parse(ml); } catch(e) { ml = null; }
      }
      if (Array.isArray(ml) && ml.length > 0) return ml;
      return [{
        materialName: item.materialName || '',
        materialSpec: item.materialSpec || '',
        num: item.num || 0,
        unitPrice: item.unitPrice || '',
        amount: item.amount || '',
        purchaseStatus: item.purchaseStatus,
        isReceived: item.isReceived,
        purchaseDate: item.purchaseDate,
        expectedInDate: item.expectedInDate,
        expressNo: item.expressNo,
        purchaseRemark: item.purchaseRemark,
        buyLink: item.buyLink || '',
        uploadImages: item.uploadImages || []
      }];
    }

    function getPendingReceiveCount() {
      wx.cloud.callFunction({
        name: 'dbOperation',
        data: {
          action: 'get',
          collection: 'purchase_apply',
          where: { auditStatus: 1 }
        }
      }).then(res => {
        const allList = (res.success && res.data) ? res.data : [];
        const myList = allList.filter(item => item.applicant === loginUser.name);
        let count = 0;
        myList.forEach(item => {
          const ml = getMatList(item);
          ml.forEach(m => {
            const ps = (m.purchaseStatus !== undefined && m.purchaseStatus !== null) ? m.purchaseStatus : item.purchaseStatus;
            const ir = m.isReceived === true || m.isReceived === 1;
            if (ps === 1 && !ir) {
              count++;
            }
          });
        });
        document.getElementById('pendingValue').textContent = count;
      }).catch(err => {
        console.error('获取待请购领用数量失败', err);
      });
    }

    function verifySafePassword(successCallback) {
      pendingSafePasswordCallback = successCallback;
      document.getElementById('safePasswordInput').value = '';
      document.getElementById('safePasswordModal').style.display = 'flex';
      setTimeout(function() { document.getElementById('safePasswordInput').focus(); }, 300);
    }

    function closeSafePasswordModal() {
      document.getElementById('safePasswordModal').style.display = 'none';
      pendingSafePasswordCallback = null;
    }

    function confirmSafePassword() {
      const inputPwd = document.getElementById('safePasswordInput').value.trim();
      console.log('confirmSafePassword called, inputPwd:', inputPwd);
      if (!inputPwd) {
        wx.showToast({ title: '请输入安全密码', icon: 'none' });
        return;
      }

      wx.cloud.callFunction({
        name: 'dbOperation',
        data: {
          action: 'get',
          collection: 'system_config',
          where: { _id: 'safe_password' }
        }
      }).then(res => {
        console.log('API response:', res);
        if (res.success && res.data && res.data.length > 0) {
          const safePwd = res.data[0].password;
          console.log('Stored password:', safePwd, 'Input:', inputPwd);
          console.log('Comparison result:', inputPwd === safePwd);
          if (inputPwd === safePwd) {
            const callback = pendingSafePasswordCallback;
            closeSafePasswordModal();
            if (typeof callback === 'function') {
              callback();
            }
          } else {
            wx.showToast({ title: '安全密码错误', icon: 'none' });
          }
        } else {
          console.log('No password found, initializing...');
          wx.showModal({
            title: '提示',
            content: '未找到安全密码，已自动初始化默认密码：123456',
            showCancel: false
          }).then(() => {
            wx.cloud.callFunction({
              name: 'dbOperation',
              data: {
                action: 'update',
                collection: 'system_config',
                docId: 'safe_password',
                data: {
                  password: '123456',
                  updateTime: new Date().toISOString(),
                  operator: app.globalData.openid || '未知用户'
                }
              }
            }).then(() => {
              if (inputPwd === '123456') {
                const callback = pendingSafePasswordCallback;
                closeSafePasswordModal();
                if (typeof callback === 'function') {
                  callback();
                }
              } else {
                wx.showToast({ title: '初始密码为123456，请重新输入', icon: 'none' });
              }
            });
          });
        }
      }).catch(err => {
        console.error('验证安全密码失败，详细错误：', err);
        wx.showToast({ title: '验证密码失败，请重试', icon: 'none' });
      });
    }
