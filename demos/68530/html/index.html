<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>速记碎片本</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/lucide.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 font-sans">
  <header class="fixed top-0 left-0 right-0 bg-white/90 backdrop-blur-md shadow-sm z-40">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-green-500 rounded-lg flex items-center justify-center">
          <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
        </div>
        <h1 class="text-xl font-bold text-gray-800">速记碎片本</h1>
      </div>
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input 
          type="text" 
          id="searchInput"
          placeholder="搜索笔记..." 
          class="pl-10 pr-4 py-2 w-48 sm:w-64 bg-gray-100 border-0 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 transition-all"
        >
      </div>
    </div>
    <div class="overflow-x-auto scrollbar-hide px-4 pb-3">
      <div class="flex gap-2" id="tagList">
        <button class="tag-btn active px-4 py-1.5 rounded-full text-sm font-medium bg-green-500 text-white transition-all whitespace-nowrap">
          全部
        </button>
      </div>
    </div>
  </header>

  <main class="pt-28 pb-24 px-4">
    <div class="max-w-6xl mx-auto">
      <div id="notesContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      </div>
      <div id="emptyState" class="hidden flex flex-col items-center justify-center py-20 text-gray-400">
        <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mb-4">
          <i data-lucide="lightbulb" class="w-10 h-10 text-gray-300"></i>
        </div>
        <p class="text-lg">还没有笔记</p>
        <p class="text-sm mt-1">点击右下角按钮记录你的第一个灵感</p>
      </div>
    </div>
  </main>

  <button 
    id="addBtn"
    class="fixed right-6 bottom-6 w-14 h-14 bg-green-500 hover:bg-green-600 text-white rounded-full shadow-lg hover:shadow-xl flex items-center justify-center transition-all hover:scale-110 active:scale-95 z-40"
    aria-label="新建笔记"
  >
    <i data-lucide="plus" class="w-7 h-7"></i>
  </button>

  <div id="noteModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-lg shadow-2xl transform transition-all scale-95 opacity-0" id="modalContent">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
        <h2 class="text-lg font-semibold text-gray-800" id="modalTitle">新建笔记</h2>
        <button id="closeModal" class="p-1 hover:bg-gray-100 rounded-full transition-colors">
          <i data-lucide="x" class="w-5 h-5 text-gray-500"></i>
        </button>
      </div>
      <div class="p-6">
        <textarea 
          id="noteContent"
          placeholder="记录你的灵感..." 
          class="w-full h-40 p-4 bg-gray-50 border-0 rounded-xl text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500/20 resize-none text-base leading-relaxed"
        ></textarea>
        <div class="mt-4">
          <div class="flex items-center gap-2 mb-2">
            <i data-lucide="tag" class="w-4 h-4 text-gray-400"></i>
            <span class="text-sm text-gray-500">标签</span>
          </div>
          <div class="flex flex-wrap gap-2 mb-3" id="modalTags"></div>
          <div class="flex gap-2">
            <input 
              type="text" 
              id="tagInput"
              placeholder="添加标签..." 
              class="flex-1 px-3 py-2 bg-gray-50 border-0 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20"
            >
            <button id="addTagBtn" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-sm font-medium transition-colors">
              添加
            </button>
          </div>
        </div>
        <div class="mt-4">
          <div class="flex items-center gap-2 mb-2">
            <i data-lucide="image" class="w-4 h-4 text-gray-400"></i>
            <span class="text-sm text-gray-500">截图</span>
          </div>
          <label class="flex items-center gap-2 px-4 py-3 bg-gray-50 hover:bg-gray-100 rounded-lg cursor-pointer transition-colors">
            <i data-lucide="upload" class="w-4 h-4 text-gray-500"></i>
            <span class="text-sm text-gray-600">上传图片</span>
            <input type="file" id="imageUpload" accept="image/*" class="hidden">
          </label>
          <div id="imagePreview" class="mt-2 hidden">
            <img id="previewImg" src="" alt="预览" class="max-h-40 rounded-lg object-contain">
            <button id="removeImage" class="mt-2 text-sm text-red-500 hover:text-red-600">移除图片</button>
          </div>
        </div>
      </div>
      <div class="flex gap-3 px-6 py-4 border-t border-gray-100">
        <button id="deleteBtn" class="flex-1 px-4 py-2.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl text-sm font-medium transition-colors hidden">
          删除
        </button>
        <button id="saveBtn" class="flex-1 px-4 py-2.5 bg-green-500 hover:bg-green-600 text-white rounded-xl text-sm font-medium transition-colors">
          保存
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
