<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喜缘 - 婚礼社交破冰平台</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #f48fb1 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景装饰 */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
            animation: float 20s infinite ease-in-out;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -50%;
            left: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
            animation: float 25s infinite ease-in-out reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* 页面切换 */
        .page {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 头部 */
        .header {
            text-align: center;
            padding: 50px 30px;
            background: linear-gradient(135deg, #ec407a 0%, #d81b60 50%, #c2185b 100%);
            color: white;
            border-radius: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(194, 24, 91, 0.4);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 50%);
            animation: rotate 30s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .header-content {
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.3em;
            opacity: 0.95;
            font-weight: 300;
        }

        /* 卡片容器 */
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 50px rgba(194, 24, 91, 0.15);
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #ec407a, #d81b60, #c2185b);
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #c2185b;
            font-weight: 600;
            font-size: 1.1em;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid rgba(194, 24, 91, 0.2);
            border-radius: 15px;
            font-size: 1em;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #ec407a;
            box-shadow: 0 0 0 4px rgba(236, 64, 122, 0.1);
            background: white;
        }

        /* 照片上传 */
        .photo-upload {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .photo-box {
            width: 120px;
            height: 120px;
            border: 3px dashed #ec407a;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(252, 228, 236, 0.5);
            position: relative;
            overflow: hidden;
        }

        .photo-box:hover {
            background: rgba(252, 228, 236, 0.8);
            border-color: #d81b60;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(194, 24, 91, 0.2);
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 17px;
        }

        .photo-box .placeholder {
            color: #ec407a;
            font-size: 3em;
            font-weight: 300;
        }

        /* 按钮 */
        .btn {
            padding: 18px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
            text-align: center;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ec407a 0%, #d81b60 50%, #c2185b 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(194, 24, 91, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(194, 24, 91, 0.4);
        }

        .btn-secondary {
            background: rgba(252, 228, 236, 0.8);
            color: #c2185b;
            border: 2px solid #ec407a;
        }

        .btn-secondary:hover {
            background: rgba(252, 228, 236, 1);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(194, 24, 91, 0.2);
        }

        .btn-full {
            width: 100%;
        }

        .btn-sm {
            padding: 12px 25px;
            font-size: 0.95em;
        }

        /* 问答页面 */
        .quiz-container {
            background: rgba(252, 228, 236, 0.3);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 25px;
        }

        .quiz-question {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(194, 24, 91, 0.1);
        }

        .quiz-question h3 {
            color: #c2185b;
            margin-bottom: 25px;
            font-size: 1.4em;
            font-weight: 600;
        }

        .quiz-options {
            display: grid;
            gap: 12px;
        }

        .quiz-option {
            padding: 18px 25px;
            background: rgba(252, 228, 236, 0.5);
            border: 2px solid rgba(194, 24, 91, 0.2);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.05em;
        }

        .quiz-option:hover {
            border-color: #ec407a;
            background: rgba(252, 228, 236, 0.8);
            transform: translateX(5px);
        }

        .quiz-option.selected {
            border-color: #ec407a;
            background: linear-gradient(135deg, #ec407a 0%, #d81b60 100%);
            color: white;
            box-shadow: 0 5px 20px rgba(194, 24, 91, 0.3);
            transform: translateX(5px);
        }

        /* 进度条 */
        .progress {
            background: rgba(252, 228, 236, 0.5);
            height: 10px;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ec407a, #d81b60, #c2185b);
            transition: width 0.5s ease;
            border-radius: 10px;
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            from { transform: translateX(-100%); }
            to { transform: translateX(100%); }
        }

        /* 用户卡片 */
        .user-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 20px;
            transition: all 0.4s ease;
            box-shadow: 0 10px 40px rgba(194, 24, 91, 0.15);
            position: relative;
            overflow: hidden;
        }

        .user-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ec407a, #d81b60, #c2185b);
        }

        .user-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(194, 24, 91, 0.25);
        }

        .user-photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ec407a;
            float: left;
            margin-right: 20px;
            box-shadow: 0 5px 20px rgba(194, 24, 91, 0.3);
            transition: all 0.3s ease;
        }

        .user-card:hover .user-photo {
            transform: scale(1.05);
            border-color: #d81b60;
        }

        .user-info {
            overflow: hidden;
        }

        .user-name {
            color: #c2185b;
            font-size: 1.4em;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .user-age {
            color: #666;
            font-size: 1em;
            margin-bottom: 12px;
            font-weight: 300;
        }

        .user-tags {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .tag {
            background: linear-gradient(135deg, rgba(252, 228, 236, 0.8), rgba(248, 187, 208, 0.8));
            color: #c2185b;
            padding: 8px 15px;
            border-radius: 25px;
            font-size: 0.9em;
            font-weight: 500;
            border: 1px solid rgba(194, 24, 91, 0.2);
            transition: all 0.3s ease;
        }

        .tag:hover {
            background: linear-gradient(135deg, #ec407a, #d81b60);
            color: white;
            transform: translateY(-2px);
        }

        .user-description {
            color: #666;
            font-size: 1.05em;
            margin-bottom: 20px;
            line-height: 1.7;
            font-weight: 300;
        }

        .user-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }

        /* 推荐标签 */
        .recommendation-badge {
            background: linear-gradient(135deg, #4caf50, #66bb6a);
            color: white;
            padding: 8px 15px;
            border-radius: 25px;
            font-size: 0.9em;
            display: inline-block;
            margin-bottom: 12px;
            font-weight: 500;
            box-shadow: 0 3px 10px rgba(76, 175, 80, 0.3);
        }

        .cross-wedding-badge {
            background: linear-gradient(135deg, #9c27b0, #ba68c8);
            color: white;
            padding: 8px 15px;
            border-radius: 25px;
            font-size: 0.9em;
            display: inline-block;
            margin-bottom: 12px;
            font-weight: 500;
            box-shadow: 0 3px 10px rgba(156, 39, 176, 0.3);
        }

        /* 隐藏的微信号 */
        .hidden-info {
            color: #999;
            font-size: 0.95em;
            margin-top: 15px;
            font-weight: 300;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hidden-info::before {
            content: '🔒';
            font-size: 1.2em;
        }

        /* 匹配成功 */
        .match-success {
            text-align: center;
            padding: 50px;
        }

        .match-icon {
            font-size: 6em;
            color: #ec407a;
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .match-title {
            color: #c2185b;
            font-size: 2.5em;
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .match-user {
            background: rgba(252, 228, 236, 0.5);
            padding: 30px;
            border-radius: 25px;
            margin-bottom: 30px;
            display: inline-block;
            box-shadow: 0 10px 40px rgba(194, 24, 91, 0.2);
        }

        .match-user img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #ec407a;
            margin-bottom: 15px;
            box-shadow: 0 5px 20px rgba(194, 24, 91, 0.3);
        }

        .match-user h4 {
            color: #c2185b;
            font-size: 1.5em;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .wechat-id {
            background: linear-gradient(135deg, #ec407a 0%, #d81b60 50%, #c2185b 100%);
            color: white;
            padding: 20px 35px;
            border-radius: 25px;
            font-size: 1.3em;
            display: inline-block;
            margin-bottom: 25px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(194, 24, 91, 0.4);
            letter-spacing: 1px;
        }

        /* 画像展示 */
        .profile-display {
            text-align: center;
            padding: 40px;
            background: rgba(252, 228, 236, 0.3);
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(194, 24, 91, 0.15);
        }

        .profile-icon {
            font-size: 4em;
            color: #ec407a;
            margin-bottom: 25px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .profile-name {
            color: #c2185b;
            font-size: 1.8em;
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .profile-tags {
            margin-bottom: 25px;
        }

        .profile-description {
            color: #666;
            font-size: 1.15em;
            line-height: 1.8;
            font-weight: 300;
        }

        /* 欢迎页 */
        .welcome-content {
            text-align: center;
            padding: 60px 40px;
        }

        .welcome-icon {
            font-size: 5em;
            color: #ec407a;
            margin-bottom: 30px;
            animation: floatIcon 3s infinite ease-in-out;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .welcome-title {
            color: #c2185b;
            font-size: 2.5em;
            margin-bottom: 25px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .welcome-text {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 40px;
            line-height: 1.8;
            font-weight: 300;
        }

        /* 筛选按钮组 */
        .filter-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #ec407a, #d81b60);
            color: white;
            box-shadow: 0 5px 20px rgba(194, 24, 91, 0.3);
        }

        /* 通知 */
        .notification {
            position: fixed;
            top: 30px;
            right: 30px;
            background: linear-gradient(135deg, #ec407a 0%, #d81b60 100%);
            color: white;
            padding: 20px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(194, 24, 91, 0.5);
            z-index: 1000;
            animation: slideIn 0.5s ease-out;
            font-size: 1.1em;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%) scale(0.8);
                opacity: 0;
            }
            to {
                transform: translateX(0) scale(1);
                opacity: 1;
            }
        }

        /* 标题 */
        .page-title {
            color: #c2185b;
            font-size: 2em;
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: 1px;
            position: relative;
            padding-bottom: 15px;
        }

        .page-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, #ec407a, #d81b60);
            border-radius: 2px;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 2.5em;
            }

            .card {
                padding: 25px;
            }

            .user-photo {
                width: 80px;
                height: 80px;
            }

            .photo-box {
                width: 100px;
                height: 100px;
            }

            .welcome-icon {
                font-size: 4em;
            }

            .welcome-title {
                font-size: 2em;
            }

            .match-icon {
                font-size: 5em;
            }

            .match-title {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div class="header-content">
                <h1>喜缘</h1>
                <p>婚礼专属社交破冰平台</p>
            </div>
        </div>

        <!-- 页面1：欢迎页 -->
        <div id="page-welcome" class="page active">
            <div class="card">
                <div class="welcome-content">
                    <div class="welcome-icon">💑</div>
                    <h2 class="welcome-title">欢迎来到婚礼社交破冰平台</h2>
                    <p class="welcome-text">
                        在这里，你可以认识志同道合的朋友<br>
                        双向匹配，保护隐私，轻松破冰
                    </p>
                    <button class="btn btn-primary btn-full" onclick="showPage('page-register')">
                        开始登记信息
                    </button>
                </div>
            </div>
        </div>

        <!-- 页面2：信息登记 -->
        <div id="page-register" class="page">
            <div class="card">
                <h2 class="page-title">填写基本信息</h2>

                <div class="form-group">
                    <label>性别</label>
                    <select id="gender">
                        <option value="">请选择</option>
                        <option value="male">男</option>
                        <option value="female">女</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>年龄</label>
                    <input type="number" id="age" placeholder="请输入年龄" min="18" max="60">
                </div>

                <div class="form-group">
                    <label>职业</label>
                    <input type="text" id="occupation" placeholder="请输入职业">
                </div>

                <div class="form-group">
                    <label>微信号</label>
                    <input type="text" id="wechat" placeholder="请输入微信号（匹配成功后对方可见）">
                </div>

                <div class="form-group">
                    <label>上传照片（最多3张）</label>
                    <div class="photo-upload">
                        <div class="photo-box" onclick="uploadPhoto(0)">
                            <span class="placeholder">+</span>
                        </div>
                        <div class="photo-box" onclick="uploadPhoto(1)">
                            <span class="placeholder">+</span>
                        </div>
                        <div class="photo-box" onclick="uploadPhoto(2)">
                            <span class="placeholder">+</span>
                        </div>
                    </div>
                </div>

                <button class="btn btn-primary btn-full" onclick="showPage('page-quiz')">
                    下一步：完成趣味问答
                </button>
            </div>
        </div>

        <!-- 页面3：趣味问答 -->
        <div id="page-quiz" class="page">
            <div class="card">
                <h2 class="page-title">趣味问答</h2>
                <p style="color: #666; margin-bottom: 25px; font-size: 1.1em; font-weight: 300;">回答这些问题，让我们更好地了解你</p>

                <div class="progress">
                    <div class="progress-bar" id="quiz-progress" style="width: 0%"></div>
                </div>

                <div class="quiz-container" id="quiz-container"></div>

                <button class="btn btn-primary btn-full" id="quiz-next-btn" onclick="nextQuestion()" style="display: none;">
                    下一题
                </button>

                <button class="btn btn-primary btn-full" id="quiz-complete-btn" onclick="completeQuiz()" style="display: none;">
                    完成问答，生成画像
                </button>
            </div>
        </div>

        <!-- 页面4：画像展示 -->
        <div id="page-profile" class="page">
            <div class="card">
                <h2 class="page-title">你的个人画像</h2>

                <div class="profile-display">
                    <div class="profile-icon">✨</div>
                    <h3 class="profile-name" id="profile-name"></h3>
                    <div class="profile-tags" id="profile-tags"></div>
                    <p class="profile-description" id="profile-description"></p>
                </div>

                <button class="btn btn-primary btn-full" onclick="showPage('page-users')" style="margin-top: 25px;">
                    开始认识其他人
                </button>
            </div>
        </div>

        <!-- 页面5：用户列表 -->
        <div id="page-users" class="page">
            <div class="card">
                <h2 class="page-title">认识新朋友</h2>

                <div class="filter-buttons">
                    <button class="btn btn-secondary filter-btn active" onclick="filterUsers('all')">
                        全部
                    </button>
                    <button class="btn btn-secondary filter-btn" onclick="filterUsers('recommend')">
                        智能推荐
                    </button>
                    <button class="btn btn-secondary filter-btn" onclick="filterUsers('cross')">
                        跨婚礼推荐
                    </button>
                </div>

                <div id="users-list"></div>
            </div>
        </div>

        <!-- 页面6：匹配成功 -->
        <div id="page-match" class="page">
            <div class="card">
                <div class="match-success">
                    <div class="match-icon">🎉</div>
                    <h2 class="match-title">匹配成功！</h2>
                    <p style="color: #666; margin-bottom: 35px; font-size: 1.2em; font-weight: 300;">你们都选择了"想认识"对方</p>

                    <div class="match-user" id="match-user-info">
                        <!-- 匹配用户信息 -->
                    </div>

                    <div style="margin-bottom: 35px;">
                        <p style="color: #666; margin-bottom: 15px; font-size: 1.1em; font-weight: 300;">对方微信号：</p>
                        <div class="wechat-id" id="match-wechat"></div>
                    </div>

                    <button class="btn btn-primary" onclick="showPage('page-users')">
                        继续认识其他人
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 模拟数据
        const quizQuestions = [
            {
                question: "周末你更喜欢？",
                options: ["在家宅着追剧", "和朋友聚会聊天", "户外运动探险", "学习充电提升自己"]
            },
            {
                question: "对于爱情，你更看重？",
                options: ["三观一致", "兴趣相投", "外貌气质", "经济条件"]
            },
            {
                question: "你理想的约会方式是？",
                options: ["浪漫晚餐", "户外旅行", "看电影逛街", "在家做饭"]
            },
            {
                question: "遇到喜欢的人，你会？",
                options: ["主动出击", "等待对方先开口", "通过朋友介绍", "默默关注"]
            },
            {
                question: "你更喜欢的性格类型？",
                options: ["温柔体贴", "幽默风趣", "独立自主", "热情开朗"]
            }
        ];

        const mockUsers = [
            {
                id: 1,
                name: "小美",
                age: 26,
                occupation: "设计师",
                photo: "https://via.placeholder.com/100x100/ec407a/ffffff?text=小美",
                tags: ["温柔体贴", "喜欢旅行", "美食达人"],
                description: "一个喜欢在周末探索城市美食的文艺青年，期待遇见同样热爱生活的你",
                wechat: "xiaomei_design",
                type: "recommend",
                matchScore: 95
            },
            {
                id: 2,
                name: "小杰",
                age: 28,
                occupation: "程序员",
                photo: "https://via.placeholder.com/100x100/d81b60/ffffff?text=小杰",
                tags: ["幽默风趣", "电影爱好者", "健身达人"],
                description: "热爱编程和健身的理工男，希望能找到一个可以一起看电影、聊人生的朋友",
                wechat: "xiaojie_code",
                type: "all",
                matchScore: 80
            },
            {
                id: 3,
                name: "小琳",
                age: 25,
                occupation: "教师",
                photo: "https://via.placeholder.com/100x100/c2185b/ffffff?text=小琳",
                tags: ["温柔体贴", "喜欢阅读", "瑜伽爱好者"],
                description: "喜欢安静的生活方式，热爱阅读和瑜伽，期待遇见一个有内涵的灵魂",
                wechat: "xiaolin_teacher",
                type: "cross",
                crossWedding: "新娘小李的朋友的婚礼",
                matchScore: 88
            },
            {
                id: 4,
                name: "小宇",
                age: 27,
                occupation: "产品经理",
                photo: "https://via.placeholder.com/100x100/ec407a/ffffff?text=小宇",
                tags: ["独立自主", "喜欢旅行", "摄影爱好者"],
                description: "热爱探索世界的产品经理，希望能找到一个可以一起背包旅行的伙伴",
                wechat: "xiaoyu_pm",
                type: "recommend",
                matchScore: 92
            },
            {
                id: 5,
                name: "小婷",
                age: 24,
                occupation: "护士",
                photo: "https://via.placeholder.com/100x100/d81b60/ffffff?text=小婷",
                tags: ["热情开朗", "喜欢运动", "美食达人"],
                description: "阳光开朗的护士小姐姐，热爱运动和美食，期待遇见一个可以一起跑步、品尝美食的朋友",
                wechat: "xiaoting_nurse",
                type: "all",
                matchScore: 75
            }
        ];

        // 用户数据
        let currentUser = {
            photos: [],
            quizAnswers: []
        };

        let currentQuestionIndex = 0;
        let likedUsers = [];

        // 页面切换
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');

            // 特殊页面处理
            if (pageId === 'page-quiz') {
                startQuiz();
            } else if (pageId === 'page-profile') {
                generateProfile();
            } else if (pageId === 'page-users') {
                displayUsers('all');
            }
        }

        // 照片上传（模拟）
        function uploadPhoto(index) {
            const photoBox = document.querySelectorAll('.photo-box')[index];
            const placeholder = photoBox.querySelector('.placeholder');

            // 模拟上传
            const colors = ['ec407a', 'd81b60', 'c2185b'];
            const img = document.createElement('img');
            img.src = `https://via.placeholder.com/120x120/${colors[index]}/ffffff?text=照片${index + 1}`;
            photoBox.appendChild(img);
            if (placeholder) placeholder.remove();

            currentUser.photos.push(img.src);
        }

        // 开始问答
        function startQuiz() {
            currentQuestionIndex = 0;
            displayQuestion(0);
        }

        // 显示问题
        function displayQuestion(index) {
            const container = document.getElementById('quiz-container');
            const question = quizQuestions[index];

            container.innerHTML = `
                <div class="quiz-question">
                    <h3>${index + 1}. ${question.question}</h3>
                    <div class="quiz-options">
                        ${question.options.map((opt, i) => `
                            <div class="quiz-option" onclick="selectOption(${index}, ${i})">
                                ${opt}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            // 更新进度条
            const progress = ((index + 1) / quizQuestions.length) * 100;
            document.getElementById('quiz-progress').style.width = `${progress}%`;

            // 显示/隐藏按钮
            document.getElementById('quiz-next-btn').style.display = 'none';
            document.getElementById('quiz-complete-btn').style.display = 'none';
        }

        // 选择选项
        function selectOption(questionIndex, optionIndex) {
            const options = document.querySelectorAll('.quiz-option');
            options.forEach(opt => opt.classList.remove('selected'));
            options[optionIndex].classList.add('selected');

            currentUser.quizAnswers[questionIndex] = optionIndex;

            // 显示下一步按钮
            if (questionIndex < quizQuestions.length - 1) {
                document.getElementById('quiz-next-btn').style.display = 'block';
            } else {
                document.getElementById('quiz-complete-btn').style.display = 'block';
            }
        }

        // 下一题
        function nextQuestion() {
            currentQuestionIndex++;
            displayQuestion(currentQuestionIndex);
        }

        // 完成问答
        function completeQuiz() {
            showPage('page-profile');
        }

        // 生成画像
        function generateProfile() {
            const age = document.getElementById('age').value || 25;
            const occupation = document.getElementById('occupation').value || '职场人士';

            // 基于问答答案生成画像
            const tags = [];
            const answers = currentUser.quizAnswers;

            // 问题1：周末偏好
            if (answers[0] === 0) tags.push("宅家达人");
            else if (answers[0] === 1) tags.push("社交达人");
            else if (answers[0] === 2) tags.push("运动达人");
            else if (answers[0] === 3) tags.push("学习达人");

            // 问题2：爱情观
            if (answers[1] === 0) tags.push("三观一致");
            else if (answers[1] === 1) tags.push("兴趣相投");
            else if (answers[1] === 2) tags.push("外貌气质");
            else if (answers[1] === 3) tags.push("经济条件");

            // 问题3：约会方式
            if (answers[2] === 0) tags.push("浪漫晚餐");
            else if (answers[2] === 1) tags.push("喜欢旅行");
            else if (answers[2] === 2) tags.push("电影爱好者");
            else if (answers[2] === 3) tags.push("美食达人");

            // 问题4：主动性
            if (answers[3] === 0) tags.push("主动出击");
            else if (answers[3] === 1) tags.push("温柔体贴");
            else if (answers[3] === 2) tags.push("朋友介绍");
            else if (answers[3] === 3) tags.push("默默关注");

            // 问题5：性格类型
            if (answers[4] === 0) tags.push("温柔体贴");
            else if (answers[4] === 1) tags.push("幽默风趣");
            else if (answers[4] === 2) tags.push("独立自主");
            else if (answers[4] === 3) tags.push("热情开朗");

            // 生成描述
            const descriptions = [
                "一个热爱生活、期待遇见志同道合的朋友",
                "喜欢安静的生活方式，希望能找到一个可以一起聊人生的朋友",
                "热爱探索世界，期待遇见一个可以一起旅行的伙伴",
                "阳光开朗，期待遇见一个可以一起分享生活的朋友"
            ];

            const description = descriptions[Math.floor(Math.random() * descriptions.length)];

            // 显示画像
            document.getElementById('profile-name').textContent = `${age}岁的${occupation}`;
            document.getElementById('profile-tags').innerHTML = tags.map(tag =>
                `<span class="tag">${tag}</span>`
            ).join('');
            document.getElementById('profile-description').textContent = description;
        }

        // 显示用户列表
        function displayUsers(filter) {
            const container = document.getElementById('users-list');
            let users = mockUsers;

            // 更新筛选按钮状态
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            if (filter === 'recommend') {
                users = mockUsers.filter(u => u.type === 'recommend');
            } else if (filter === 'cross') {
                users = mockUsers.filter(u => u.type === 'cross');
            }

            container.innerHTML = users.map(user => `
                <div class="user-card">
                    <img src="${user.photo}" alt="${user.name}" class="user-photo">
                    <div class="user-info">
                        <div class="user-name">${user.name}</div>
                        <div class="user-age">${user.age}岁 · ${user.occupation}</div>

                        ${user.type === 'recommend' ? `<div class="recommendation-badge">推荐认识 · 匹配度${user.matchScore}%</div>` : ''}
                        ${user.type === 'cross' ? `<div class="cross-wedding-badge">${user.crossWedding}</div>` : ''}

                        <div class="user-tags">
                            ${user.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>

                        <div class="user-description">${user.description}</div>

                        <div class="hidden-info">匹配成功后可查看联系方式</div>

                        <div class="user-actions">
                            <button class="btn btn-primary btn-sm" onclick="likeUser(${user.id})">
                                想认识
                            </button>
                            <button class="btn btn-secondary btn-sm" onclick="skipUser(${user.id})">
                                下一个
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 筛选用户
        function filterUsers(filter) {
            displayUsers(filter);
        }

        // 想认识用户
        function likeUser(userId) {
            const user = mockUsers.find(u => u.id === userId);

            // 模拟匹配成功（随机）
            const matched = Math.random() > 0.3;

            if (matched) {
                likedUsers.push(userId);

                // 显示匹配成功页面
                showPage('page-match');

                document.getElementById('match-user-info').innerHTML = `
                    <img src="${user.photo}" alt="${user.name}">
                    <h4>${user.name}</h4>
                    <p style="color: #666; font-weight: 300;">${user.age}岁 · ${user.occupation}</p>
                    <div style="margin-top: 15px;">
                        ${user.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                `;

                document.getElementById('match-wechat').textContent = user.wechat;

                // 显示通知
                showNotification(`🎉 匹配成功！${user.name}也想认识你`);
            } else {
                showNotification(`已表达意向，等待${user.name}的回应`);
            }
        }

        // 跳过用户
        function skipUser(userId) {
            showNotification('已跳过');
        }

        // 显示通知
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // 初始化
        showPage('page-welcome');
    </script>
</body>
</html>
