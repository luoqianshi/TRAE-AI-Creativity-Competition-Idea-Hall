<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>应急管理系统 - 隐患排查与防灾科普</title>
    <style>
        :root {
            --color-primary: #1a5fb4;
            --color-primary-light: #2d7dd2;
            --color-primary-dark: #154a94;
            --color-danger: #c01c28;
            --color-danger-light: #dc2626;
            --color-danger-dark: #a01620;
            --color-risk-red: #dc2626;
            --color-risk-orange: #ea580c;
            --color-risk-yellow: #ca8a04;
            --color-risk-blue: #2563eb;
            --color-gray-50: #f9fafb;
            --color-gray-100: #f3f4f6;
            --color-gray-200: #e5e7eb;
            --color-gray-300: #d1d5db;
            --color-gray-400: #9ca3af;
            --color-gray-500: #6b7280;
            --color-gray-600: #4b5563;
            --color-gray-700: #374151;
            --color-gray-800: #1f2937;
            --color-gray-900: #111827;
            --color-white: #ffffff;
            --font-family-base: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --spacing-2xl: 48px;
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
            --transition-fast: 150ms ease-in-out;
            --transition-normal: 250ms ease-in-out;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family-base);
            background-color: var(--color-gray-50);
            color: var(--color-gray-800);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--spacing-md);
        }

        header {
            background-color: var(--color-primary);
            color: var(--color-white);
            padding: var(--spacing-md) 0;
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background-color: var(--color-danger);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .nav-tabs {
            display: flex;
            gap: var(--spacing-xs);
        }

        .nav-tab {
            padding: var(--spacing-sm) var(--spacing-lg);
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: var(--radius-md);
            transition: var(--transition-normal);
        }

        .nav-tab:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--color-white);
        }

        .nav-tab.active {
            background-color: var(--color-danger);
            color: var(--color-white);
        }

        main {
            padding: var(--spacing-xl) 0;
        }

        .module-panel {
            display: none;
        }

        .module-panel.active {
            display: block;
        }

        .panel-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-sm);
            border-bottom: 2px solid var(--color-primary);
        }

        .card {
            background-color: var(--color-white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }

        .card-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--color-gray-800);
            margin-bottom: var(--spacing-md);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .card-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background-color: var(--color-danger);
            border-radius: var(--radius-sm);
        }

        .upload-area {
            border: 2px dashed var(--color-gray-300);
            border-radius: var(--radius-lg);
            padding: var(--spacing-2xl);
            text-align: center;
            cursor: pointer;
            transition: var(--transition-normal);
            background-color: var(--color-gray-50);
            position: relative;
        }

        .upload-area:hover {
            border-color: var(--color-primary);
            background-color: rgba(26, 95, 180, 0.05);
        }

        .upload-area.dragover {
            border-color: var(--color-danger);
            background-color: rgba(192, 28, 40, 0.05);
        }

        .upload-icon {
            font-size: 3rem;
            color: var(--color-gray-400);
            margin-bottom: var(--spacing-md);
        }

        .upload-text {
            font-size: 0.95rem;
            color: var(--color-gray-500);
            margin-bottom: var(--spacing-sm);
        }

        .upload-hint {
            font-size: 0.8rem;
            color: var(--color-gray-400);
        }

        #fileInput {
            display: none;
        }

        .preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: var(--radius-md);
            margin-top: var(--spacing-md);
            display: none;
        }

        .preview-image.show {
            display: block;
        }

        .form-group {
            margin-bottom: var(--spacing-md);
        }

        .form-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--color-gray-700);
            margin-bottom: var(--spacing-sm);
        }

        .form-input {
            width: 100%;
            padding: var(--spacing-sm) var(--spacing-md);
            border: 1px solid var(--color-gray-300);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            transition: var(--transition-fast);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(26, 95, 180, 0.1);
        }

        .form-textarea {
            width: 100%;
            padding: var(--spacing-sm) var(--spacing-md);
            border: 1px solid var(--color-gray-300);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            min-height: 120px;
            resize: vertical;
            transition: var(--transition-fast);
        }

        .form-textarea:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(26, 95, 180, 0.1);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-sm) var(--spacing-lg);
            border: none;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-normal);
            gap: var(--spacing-sm);
        }

        .btn-primary {
            background-color: var(--color-primary);
            color: var(--color-white);
        }

        .btn-primary:hover {
            background-color: var(--color-primary-dark);
        }

        .btn-danger {
            background-color: var(--color-danger);
            color: var(--color-white);
        }

        .btn-danger:hover {
            background-color: var(--color-danger-dark);
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--color-primary);
            color: var(--color-primary);
        }

        .btn-outline:hover {
            background-color: rgba(26, 95, 180, 0.1);
        }

        .btn-sm {
            padding: var(--spacing-xs) var(--spacing-md);
            font-size: 0.8rem;
        }

        .risk-badge {
            display: inline-block;
            padding: var(--spacing-xs) var(--spacing-md);
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .risk-red {
            background-color: rgba(220, 38, 38, 0.1);
            color: var(--color-risk-red);
        }

        .risk-orange {
            background-color: rgba(234, 88, 12, 0.1);
            color: var(--color-risk-orange);
        }

        .risk-yellow {
            background-color: rgba(202, 138, 4, 0.1);
            color: var(--color-risk-yellow);
        }

        .risk-blue {
            background-color: rgba(37, 99, 235, 0.1);
            color: var(--color-risk-blue);
        }

        .result-section {
            margin-top: var(--spacing-lg);
            padding: var(--spacing-md);
            background-color: var(--color-gray-50);
            border-radius: var(--radius-md);
        }

        .result-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--color-gray-700);
            margin-bottom: var(--spacing-sm);
        }

        .result-content {
            font-size: 0.9rem;
            color: var(--color-gray-600);
            line-height: 1.8;
        }

        .document-preview {
            background-color: var(--color-white);
            border: 1px solid var(--color-gray-200);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            margin-top: var(--spacing-md);
            font-size: 0.9rem;
            line-height: 1.8;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }

        .table-wrapper {
            overflow-x: auto;
            margin-top: var(--spacing-md);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        th, td {
            padding: var(--spacing-sm) var(--spacing-md);
            text-align: left;
            border-bottom: 1px solid var(--color-gray-200);
        }

        th {
            background-color: var(--color-gray-100);
            font-weight: 600;
            color: var(--color-gray-700);
        }

        tr:hover {
            background-color: var(--color-gray-50);
        }

        .chart-container {
            height: 250px;
            margin-top: var(--spacing-md);
        }

        .btn-group {
            display: flex;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
            margin-top: var(--spacing-md);
        }

        .select-wrapper {
            position: relative;
        }

        .form-select {
            appearance: none;
            width: 100%;
            padding: var(--spacing-sm) var(--spacing-lg) var(--spacing-sm) var(--spacing-md);
            border: 1px solid var(--color-gray-300);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            background-color: var(--color-white);
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .form-select:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(26, 95, 180, 0.1);
        }

        .select-wrapper::after {
            content: '▼';
            position: absolute;
            right: var(--spacing-md);
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.6rem;
            color: var(--color-gray-400);
            pointer-events: none;
        }

        .radio-group {
            display: flex;
            gap: var(--spacing-lg);
            flex-wrap: wrap;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--color-gray-600);
        }

        .radio-label input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: var(--color-primary);
        }

        .toggle-switch {
            display: inline-flex;
            background-color: var(--color-gray-200);
            border-radius: var(--radius-md);
            padding: var(--spacing-xs);
        }

        .toggle-option {
            padding: var(--spacing-sm) var(--spacing-lg);
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-normal);
        }

        .toggle-option.active {
            background-color: var(--color-white);
            color: var(--color-primary);
            box-shadow: var(--shadow-sm);
        }

        .content-output {
            background-color: var(--color-gray-50);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            margin-top: var(--spacing-md);
            min-height: 200px;
            font-size: 0.9rem;
            line-height: 1.8;
            color: var(--color-gray-700);
        }

        .content-output h3 {
            color: var(--color-primary);
            margin-bottom: var(--spacing-md);
            font-size: 1.1rem;
        }

        .content-output ul, .content-output ol {
            padding-left: var(--spacing-xl);
            margin-bottom: var(--spacing-md);
        }

        .content-output li {
            margin-bottom: var(--spacing-sm);
        }

        .badge-list {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-md);
        }

        @media (max-width: 767px) {
            header .container {
                flex-direction: column;
                gap: var(--spacing-md);
            }

            .logo {
                font-size: 1.1rem;
            }

            .nav-tab {
                padding: var(--spacing-sm) var(--spacing-md);
                font-size: 0.85rem;
            }

            .panel-title {
                font-size: 1.25rem;
            }

            .card {
                padding: var(--spacing-md);
            }

            .upload-area {
                padding: var(--spacing-lg);
            }

            .btn-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .radio-group {
                flex-direction: column;
                gap: var(--spacing-md);
            }

            .toggle-option {
                padding: var(--spacing-sm) var(--spacing-md);
                font-size: 0.8rem;
            }
        }

        @media (min-width: 768px) {
            .grid-2 {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: var(--spacing-lg);
            }

            .grid-3 {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: var(--spacing-lg);
            }
        }

        .print-only {
            display: none;
        }

        @media print {
            header, .btn-group, .nav-tabs, .upload-area, .form-group:not(.print-show) {
                display: none !important;
            }

            .print-only {
                display: block;
            }

            .document-preview {
                border: none;
                box-shadow: none;
                max-height: none;
                overflow: visible;
            }

            body {
                background-color: var(--color-white);
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <span class="logo-icon">🚨</span>
                <span>应急管理系统</span>
            </div>
            <nav class="nav-tabs">
                <button class="nav-tab active" data-tab="hazard">隐患排查</button>
                <button class="nav-tab" data-tab="science">防灾科普</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <section id="hazard-panel" class="module-panel active">
            <h1 class="panel-title">隐患排查模块</h1>

            <div class="card">
                <h2 class="card-title">图片上传与风险识别</h2>
                <div class="upload-area" id="uploadArea">
                    <input type="file" id="fileInput" accept="image/*">
                    <div class="upload-icon">📷</div>
                    <div class="upload-text">点击或拖拽上传现场隐患照片</div>
                    <div class="upload-hint">支持 JPG、PNG 格式，最大 10MB</div>
                    <img id="previewImg" class="preview-image" alt="预览">
                </div>

                <div class="form-group" style="margin-top: var(--spacing-md);">
                    <label class="form-label">隐患描述（选填，帮助更准确识别）</label>
                    <input type="text" id="hazardDesc" class="form-input" placeholder="例如：楼道堆放杂物、电线老化、灭火器过期...">
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" id="identifyBtn">识别风险</button>
                    <button class="btn btn-outline" id="clearUploadBtn">清空</button>
                </div>

                <div id="identifyResult" style="display: none;">
                    <div class="result-section">
                        <div class="result-title">识别结果</div>
                        <div style="display: flex; align-items: center; gap: var(--spacing-md); margin-bottom: var(--spacing-sm);">
                            <span id="riskLevelBadge" class="risk-badge"></span>
                            <span id="hazardType" style="font-weight: 600; color: var(--color-gray-800);"></span>
                        </div>
                        <div class="result-content" id="riskDesc"></div>
                    </div>

                    <div class="result-section">
                        <div class="result-title">匹配法规</div>
                        <div class="result-content" id="regulation"></div>
                    </div>

                    <div class="result-section">
                        <div class="result-title">整改建议</div>
                        <div class="result-content" id="rectification"></div>
                    </div>

                    <div class="btn-group" style="margin-top: var(--spacing-md);">
                        <button class="btn btn-danger" id="generateDocBtn">一键生成整改通知书</button>
                        <button class="btn btn-primary" id="viewScienceBtn">🔍 查看配套科普</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2 class="card-title">整改文书区</h2>
                <div id="documentArea" style="display: none;">
                    <div class="document-preview" id="docPreview"></div>
                    <div class="btn-group">
                        <button class="btn btn-primary" id="copyDocBtn">📋 复制内容</button>
                        <button class="btn btn-outline" id="printDocBtn">🖨️ 打印</button>
                    </div>
                </div>
                <div id="docPlaceholder" style="text-align: center; padding: var(--spacing-2xl); color: var(--color-gray-400);">
                    <div style="font-size: 2rem; margin-bottom: var(--spacing-md);">📄</div>
                    <div>请先识别隐患并生成整改通知书</div>
                </div>
            </div>

            <div class="card">
                <h2 class="card-title">台账录入面板</h2>
                <div class="grid-2" style="gap: var(--spacing-md);">
                    <div class="form-group">
                        <label class="form-label">隐患位置</label>
                        <input type="text" id="recordLocation" class="form-input" placeholder="例如：3号楼2单元楼道">
                    </div>
                    <div class="form-group">
                        <label class="form-label">风险等级</label>
                        <select id="recordRisk" class="form-select">
                            <option value="red">🔴 红色（重大隐患）</option>
                            <option value="orange">🟠 橙色（较大隐患）</option>
                            <option value="yellow">🟡 黄色（一般隐患）</option>
                            <option value="blue">🔵 蓝色（低风险）</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">隐患类型</label>
                        <input type="text" id="recordType" class="form-input" placeholder="例如：消防通道堵塞">
                    </div>
                    <div class="form-group">
                        <label class="form-label">责任人</label>
                        <input type="text" id="recordResponsible" class="form-input" placeholder="责任人姓名">
                    </div>
                    <div class="form-group">
                        <label class="form-label">整改期限</label>
                        <input type="date" id="recordDeadline" class="form-input">
                    </div>
                    <div class="form-group">
                        <label class="form-label">整改状态</label>
                        <select id="recordStatus" class="form-select">
                            <option value="pending">待整改</option>
                            <option value="processing">整改中</option>
                            <option value="completed">已完成</option>
                        </select>
                    </div>
                </div>
                <button class="btn btn-primary" id="addRecordBtn">添加到台账</button>

                <div class="table-wrapper" style="margin-top: var(--spacing-lg);">
                    <table>
                        <thead>
                            <tr>
                                <th>位置</th>
                                <th>类型</th>
                                <th>风险等级</th>
                                <th>责任人</th>
                                <th>整改期限</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="recordTableBody"></tbody>
                    </table>
                </div>

                <div class="chart-container">
                    <canvas id="riskChart"></canvas>
                </div>
            </div>
        </section>

        <section id="science-panel" class="module-panel">
            <h1 class="panel-title">防灾科普模块</h1>

            <div class="card">
                <h2 class="card-title">科普内容查询</h2>
                
                <div class="form-group">
                    <label class="form-label">灾害类型</label>
                    <div class="select-wrapper">
                        <select id="disasterSelect" class="form-select">
                            <option value="earthquake">地震</option>
                            <option value="fire">高层电动车火灾</option>
                            <option value="landslide">贵州山体滑坡</option>
                            <option value="flood">城市洪涝</option>
                            <option value="gas">燃气泄漏</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">输出类型</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="outputType" value="poster" checked>
                            科普海报文案
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="outputType" value="speech">
                            社区宣讲稿
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="outputType" value="broadcast">
                            小区广播稿
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="outputType" value="supplies">
                            家庭应急物资清单
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">目标人群</label>
                    <div class="toggle-switch">
                        <div class="toggle-option active" data-audience="elderly">👴 老年简易版</div>
                        <div class="toggle-option" data-audience="children">👶 校园儿童版</div>
                    </div>

        function initNavigation() {

            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');
            const previewImg = document.getElementById('previewImg');
            const clearBtn = document.getElementById('clearUploadBtn');

            uploadArea.addEventListener('click', function() {
                fileInput.click();
            });

            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                this.classList.add('dragover');
            });

            uploadArea.addEventListener('dragleave', function(e) {
                e.preventDefault();
                this.classList.remove('dragover');
            });

            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                this.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    handleFile(files[0]);
                }
            });

            fileInput.addEventListener('change', function(e) {
                if (this.files.length > 0) {
                    handleFile(this.files[0]);
                }
            });

            clearBtn.addEventListener('click', function() {
                fileInput.value = '';
                previewImg.classList.remove('show');
                previewImg.src = '';
                document.getElementById('identifyResult').style.display = 'none';

        function initRecordManagement() {
            const addBtn = document.getElementById('addRecordBtn');

            addBtn.addEventListener('click', function() {
                const location = document.getElementById('recordLocation').value.trim();
                const risk = document.getElementById('recordRisk').value;
                const type = document.getElementById('recordType').value.trim();
                const responsible = document.getElementById('recordResponsible').value.trim();
                const deadline = document.getElementById('recordDeadline').value;
                const status = document.getElementById('recordStatus').value;

                if (!location || !type || !responsible) {
                    alert('请填写完整的台账信息');
                    return;
                }

                const record = {
                    id: Date.now(),
                    location,
                    risk,
                    type,
                    responsible,
                    deadline,
                    status
                };

                records.push(record);
                renderRecords();
                updateChart();

                document.getElementById('recordLocation').value = '';
                document.getElementById('recordType').value = '';
                document.getElementById('recordResponsible').value = '';
                document.getElementById('recordDeadline').value = '';
                document.getElementById('recordStatus').value = 'pending';
            });
        }

        function renderRecords() {
            const tbody = document.getElementById('recordTableBody');
            tbody.innerHTML = '';

            const riskLabels = {
                red: '🔴 红色',
                orange: '🟠 橙色',
                yellow: '🟡 黄色',
                blue: '🔵 蓝色'
            };

            const statusLabels = {
                pending: '待整改',
                processing: '整改中',
                completed: '已完成'
            };

            records.forEach(record => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${record.location}</td>
                    <td>${record.type}</td>
                    <td>${riskLabels[record.risk]}</td>
                    <td>${record.responsible}</td>
                    <td>${record.deadline || '-'}</td>
                    <td>${statusLabels[record.status]}</td>
                    <td>
                        <button class="btn btn-sm btn-outline" onclick="deleteRecord(${record.id})">删除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.deleteRecord = function(id) {
            records = records.filter(r => r.id !== id);
            renderRecords();
            updateChart();
        };

        function initChart() {
            requestAnimationFrame(function() {
                updateChart();
                window.addEventListener('resize', updateChart);
            });
        }

        function updateChart() {
            const canvas = document.getElementById('riskChart');
            const ctx = canvas.getContext('2d');
            
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            
            const width = rect.width;
            const height = rect.height;
            
            ctx.clearRect(0, 0, width, height);
            
            const counts = { red: 0, orange: 0, yellow: 0, blue: 0 };
            records.forEach(r => {
                counts[r.risk]++;
            });
            
            const data = [counts.red, counts.orange, counts.yellow, counts.blue];
            const labels = ['红色', '橙色', '黄色', '蓝色'];
            const colors = ['#dc2626', '#ea580c', '#ca8a04', '#2563eb'];
            
            const maxValue = Math.max(...data, 1);
            const padding = { top: 20, right: 20, bottom: 40, left: 40 };
            const chartWidth = width - padding.left - padding.right;
            const chartHeight = height - padding.top - padding.bottom;
            
            ctx.strokeStyle = '#e5e7eb';
            ctx.lineWidth = 1;
            const gridCount = 5;
            for (let i = 0; i <= gridCount; i++) {
                const y = padding.top + (chartHeight / gridCount) * i;
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(width - padding.right, y);
                ctx.stroke();
                
                const value = Math.round(maxValue - (maxValue / gridCount) * i);
                ctx.fillStyle = '#6b7280';
                ctx.font = '11px sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(value.toString(), padding.left - 8, y + 4);
            }
            
            const barWidth = (chartWidth / data.length) * 0.6;
            const barGap = (chartWidth / data.length) * 0.4 / 2;
            
            data.forEach((value, index) => {
                const x = padding.left + (chartWidth / data.length) * index + barGap;
                const barHeight = (value / maxValue) * chartHeight;
                const y = padding.top + chartHeight - barHeight;
                
                ctx.fillStyle = colors[index];
                ctx.beginPath();
                ctx.roundRect(x, y, barWidth, barHeight, 4);
                ctx.fill();
                
                ctx.fillStyle = '#374151';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(labels[index], x + barWidth / 2, height - 15);
                
                if (value > 0) {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(value.toString(), x + barWidth / 2, y + 20);
                }
            });
            
            ctx.fillStyle = '#1f2937';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('风险等级统计', width / 2, 16);
        }
        
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            this.beginPath();
            this.moveTo(x + r, y);
            this.arcTo(x + w, y, x + w, y + h, r);
            this.arcTo(x + w, y + h, x, y + h, r);
            this.arcTo(x, y + h, x, y, r);
            this.arcTo(x, y, x + w, y, r);
            this.closePath();
            return this;
        };

        function initScienceModule() {
            const disasterSelect = document.getElementById('disasterSelect');
            const outputRadios = document.querySelectorAll('input[name="outputType"]');
            const audienceToggles = document.querySelectorAll('.toggle-option');
            const generateBtn = document.getElementById('generateScienceBtn');

            audienceToggles.forEach(toggle => {
                toggle.addEventListener('click', function() {
                    audienceToggles.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                });
            });

            generateBtn.addEventListener('click', function() {
                const disaster = disasterSelect.value;
                const outputType = document.querySelector('input[name="outputType"]:checked').value;
                const audience = document.querySelector('.toggle-option.active').dataset.audience;

                generateScienceContent(disaster, outputType, audience);
            });
        }

        function generateScienceContent(disaster, outputType, audience) {
            const content = scienceKnowledgeBase[disaster][outputType][audience];
            const outputDiv = document.getElementById('scienceOutput');

            outputDiv.innerHTML = content.replace(/\n/g, '<br>');
        }

        function switchToScience(disasterType) {
            const tabs = document.querySelectorAll('.nav-tab');
            const panels = document.querySelectorAll('.module-panel');

            tabs.forEach(t => t.classList.remove('active'));
            panels.forEach(p => p.classList.remove('active'));

            document.querySelector('[data-tab="science"]').classList.add('active');
            document.getElementById('science-panel').classList.add('active');

            document.getElementById('disasterSelect').value = disasterType;

            const outputType = document.querySelector('input[name="outputType"]:checked').value;
            const audience = document.querySelector('.toggle-option.active').dataset.audience;
            generateScienceContent(disasterType, outputType, audience);
        }
