/* ============================================================================
 * §B · 基础工具
 * ============================================================================ */

const BOM = '﻿';

function childByName(parent, localName) {
  if (!parent) return null;
  return Array.from(parent.children).find(el => el.localName === localName) || null;
}

function attr(el, name, fallback = '') {
  return el && el.hasAttribute(name) ? el.getAttribute(name) : fallback;
}

function numberAttr(el, name) {
  if (!el || !el.hasAttribute(name)) return null;   //! 必须先判 hasAttribute；Number('') === 0 会把缺失误判为 0
  const v = Number(el.getAttribute(name));
  return Number.isFinite(v) ? v : null;
}

function arrayBufferToBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

function decodeBase64Utf8(base64) {
  const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}

function snakeToCamel(s) {
  return s.replace(/_([a-z])/g, (_, c) => c.toUpperCase());
}

function camelToSnake(s) {
  return s.replace(/[A-Z]/g, c => '_' + c.toLowerCase());
}

//! 哪些 result 字段从 XML 走 numberAttr（其余字段一律 attr→string）

  'accuracyScore', 'emotionScore', 'standardScore', 'syllScore', 'gwpp',
]);

//! 字符串型字段的默认 fallback：缺 attr 时不能给空串（会破坏诊断短路逻辑：syl.dpMessage !== '0'、syl.recNodeType !== 'paper' 等）

//! werrMsg/serrMsg/syllAccent 三字段 06.md L432/L451-452 + 07.md L451/L500-501 明示「缺省按 '0' 处理」；
//! 缺 default 时落空串 ''，会让 ① decodeBitmask(parseInt('',10)) = NaN 让所有未带属性 word 误判
//!                          ② 06.md §3 短路 syll.serrMsg !== '0' 对 '' 永真 → 让正常词都标"音节读错"
//! 06 demo 当前 §3 短路代码用 `if (syl.serrMsg && syl.serrMsg !== '0')` 隐式守卫意外挡住误判；下游若改写为契约直白 `if (syl.serrMsg !== '0')` 会立刻引爆
const STRING_FIELD_DEFAULTS = {
  dpMessage:   '0',
  perrMsg:     '0',
  perrLevel:   '0',
  recNodeType: 'paper',
  werrMsg:     '0',
  serrMsg:     '0',
  syllAccent:  '0',
};

//! schema-driven 字段提取器：按 camelFields 列表从 XML 元素抽属性
//  · NUMERIC_SCORE_FIELDS 走 numberAttr（缺 attr 返回 null，禁误判为 0）
//  · 其他字段走 attr（fallback 优先取 STRING_FIELD_DEFAULTS，否则 ''）
//  · 'index' 字段 D.5.2 修正（2026-05-09 · 追改本冻结 demo）：
//    优先 attr(el, 'index')（XML 引擎权威标号 · 与 globalIndex 类型一致字符串）
//    XML 没 index 属性时 fallback String(idx)
//    都没则不创建 key（让 G3 双向 keys 集合断言抓未传参漏传）
//    旧实现 obj.index = idx 数组下标会写入 undefined → JSON.stringify 省略 + Object.keys 仍含 → G3 假阳性通过 → 静默 bug
function extractByCamelFields(el, camelFields, idx) {
  const obj = {};
  for (const camel of camelFields) {
    if (camel === 'index') {
      if (el.hasAttribute('index')) {
        obj.index = attr(el, 'index');           //! XML 权威标号
      } else if (idx !== undefined) {
        obj.index = String(idx);                 //! 数组下标 fallback（字符串化保持类型一致）
      }
      continue;
    }
    const snake = camelToSnake(camel);
    if (NUMERIC_SCORE_FIELDS.has(camel)) {
      obj[camel] = numberAttr(el, snake);
    } else {
      obj[camel] = attr(el, snake, STRING_FIELD_DEFAULTS[camel] ?? '');
    }
  }
  return obj;
}

  const host = 'ise-api.xfyun.cn';
  const path = '/v2/open-ise';
  const date = new Date().toGMTString();
  const signOrigin = `host: ${host}\ndate: ${date}\nGET ${path} HTTP/1.1`;
  const enc = new TextEncoder();
  const ck = await crypto.subtle.importKey('raw', enc.encode(apiSecret),
    { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', ck, enc.encode(signOrigin));
  const sigB64 = btoa(String.fromCharCode(...new Uint8Array(sig)));
  const auth = `api_key="${apiKey}", algorithm="hmac-sha256", headers="host date request-line", signature="${sigB64}"`;
  return `wss://${host}${path}?authorization=${encodeURIComponent(btoa(auth))}`
       + `&date=${encodeURIComponent(date)}&host=${host}`;
}

/* ============================================================================
 * §D · 音频管线（重采样 + 1280B 切帧）
 *      AudioContext 多返回 44.1k/48k 而非请求的 16k → 必须 Worker 内重采样
 * ============================================================================ */

const WORKER_CODE = `
var frameBuffer = [], frameSize = 0, fromRate = 0, toRate = 0;
function resample(input, fr, tr) {
  if (fr === tr) return input;
  var ratio = fr / tr, len = Math.ceil(input.length / ratio);
  var out = new Float32Array(len);
  for (var i = 0; i < len; i++) {
    var pos = i * ratio, idx = Math.floor(pos), frac = pos - idx;
    var next = Math.min(idx + 1, input.length - 1);
    out[i] = input[idx] * (1 - frac) + input[next] * frac;
  }
  return out;
}
function toInt16(buf) {
  var ab = new ArrayBuffer(buf.length * 2), view = new DataView(ab);
  for (var i = 0; i < buf.length; i++) {
    var s = Math.max(-1, Math.min(1, buf[i]));
    view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return ab;
}
self.onmessage = function(e) {
  var msg = e.data;
  if (msg.type === 'init') {
    fromRate = msg.data.fromSampleRate; toRate = msg.data.toSampleRate;
    frameSize = msg.data.frameSize; frameBuffer = [];
    console.log('[Worker] 初始化: 采样率 ' + fromRate + ' -> ' + toRate + ', 帧大小: ' + frameSize);
  } else if (msg.type === 'message') {
    //! 检查输入数据是否有效
    if (!msg.data || msg.data.length === 0) {
      console.warn('[Worker] 收到空音频数据');
      return;
    }
    var resampled = resample(msg.data, fromRate, toRate);
    //! 检查重采样结果是否有效
    if (!resampled || resampled.length === 0) {
      console.warn('[Worker] 重采样结果为空');
      return;
    }
    var int16 = new Int16Array(toInt16(resampled));
    for (var i = 0; i < int16.length; i++) frameBuffer.push(int16[i]);

    //! 发送完整的 1280 字节帧（640 个 Int16 样本）
    var samplesPerFrame = frameSize / 2; // 640 样本 = 1280 字节
    while (frameBuffer.length >= samplesPerFrame) {
      var frame = new Int16Array(frameBuffer.splice(0, samplesPerFrame));
      self.postMessage({ frameBuffer: frame.buffer, isLastFrame: false });
    }
  } else if (msg.type === 'stop') {
    console.log('[Worker] 停止录音, 剩余缓冲区: ' + frameBuffer.length + ' 样本');
    if (frameBuffer.length > 0) {
      var frame = new Int16Array(frameBuffer);
      self.postMessage({ frameBuffer: frame.buffer, isLastFrame: true });
    } else {
      //! 即使缓冲区为空，也要发送结束帧
      self.postMessage({ frameBuffer: new ArrayBuffer(0), isLastFrame: true });
    }
    frameBuffer = [];
  }
};`;

let _audioCtx = null, _mediaStream = null, _scriptNode = null, _recWorker = null;

async function startRecording(onFrame) {
  _mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const source = _audioCtx.createMediaStreamSource(_mediaStream);

  const blob = new Blob([WORKER_CODE], { type: 'application/javascript' });
  const url = URL.createObjectURL(blob);
  _recWorker = new Worker(url);
  URL.revokeObjectURL(url);
  _recWorker.postMessage({ type: 'init',
    data: { frameSize: 1280, toSampleRate: 16000, fromSampleRate: _audioCtx.sampleRate } });

  //! 添加调试日志
  console.log(`[startRecording] 音频上下文采样率: ${_audioCtx.sampleRate}Hz, 目标采样率: 16000Hz`);
  _recWorker.onmessage = e => onFrame(e.data.frameBuffer, e.data.isLastFrame);

  //! 使用 1280 样本的缓冲区，对应 40ms 的音频数据（16000Hz * 0.04s = 640 样本，但 ScriptProcessor 需要 2 的幂次）
  //! 实际使用 2048 作为缓冲区大小，Worker 会内部缓冲并切分成 1280 字节的帧
  _scriptNode = _audioCtx.createScriptProcessor(2048, 1, 1);
  _scriptNode.onaudioprocess = e => {
    const channelData = e.inputBuffer.getChannelData(0);
    //! 检查音频数据是否有效
    if (channelData && channelData.length > 0) {
      //! 计算音频数据的平均音量，用于调试
      let sum = 0;
      for (let i = 0; i < channelData.length; i++) {
        sum += Math.abs(channelData[i]);
      }
      const avgVolume = sum / channelData.length;
      if (avgVolume > 0.001) {
        console.log(`[onaudioprocess] 音频数据: ${channelData.length} 样本, 平均音量: ${avgVolume.toFixed(4)}`);
      }
      _recWorker.postMessage({ type: 'message', data: channelData });
    } else {
      console.warn('[onaudioprocess] 收到空音频数据');
    }
  };
  source.connect(_scriptNode);
  _scriptNode.connect(_audioCtx.destination);   //! 不可省：部分浏览器不接 destination 不触发 onaudioprocess
}

function stopRecording() {
  if (_scriptNode) { _scriptNode.disconnect(); _scriptNode = null; }
  if (_mediaStream) { _mediaStream.getTracks().forEach(t => t.stop()); _mediaStream = null; }
  if (_audioCtx && _audioCtx.state !== 'closed') { _audioCtx.close(); _audioCtx = null; }
  //! Worker stop 异步；尾帧 aus=4/status=2 此时还没离开 Worker，禁止在此处或调用方立刻 ws.close()
  if (_recWorker) _recWorker.postMessage({ type: 'stop' });
}

/* ============================================================================
 * §E · WebSocket 状态机
 *      关闭点 A（正常评测唯一）：onmessage 收到 data.status === 2 后关
 *      关闭点 B（取消/超时）   ：尾帧 ws.send() 完成 + bufferedAmount === 0 后关
 *      严禁：stopRecording() 后立刻 ws.close()
 *      严禁：正常链路发完尾帧立刻 ws.close()
 * ============================================================================ */

let _firstAudioFrame = true;
let _tailFrameSent = false;
let _closeAfterTail = false;
let _ws = null;

function sendAudioFrame(ws, frameBuffer, isLastFrame) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    console.warn('[sendAudioFrame] WebSocket 未连接，跳过发送');
    return false;
  }

  //! 检查音频数据是否为空
  if (!frameBuffer || frameBuffer.byteLength === 0) {
    if (isLastFrame) {
      //! 最后一帧为空也要发送结束标记
      _tailFrameSent = true;
    }
    console.warn('[sendAudioFrame] 音频数据为空，跳过发送');
    return false;
  }

  //! 检查音频帧大小：必须是 1280 字节（640 个 Int16 样本）
  //! 最后一帧可以小于 1280 字节
  if (!isLastFrame && frameBuffer.byteLength !== 1280) {
    console.warn(`[sendAudioFrame] 音频帧大小异常: ${frameBuffer.byteLength} 字节，期望 1280 字节`);
    //! 如果数据有效但大小不对，仍然尝试发送
  }

  const aus = isLastFrame ? 4 : (_firstAudioFrame ? 1 : 2);   //! 完整 1→2→4，首帧不能漏
  const status = isLastFrame ? 2 : 1;
  _firstAudioFrame = false;

  try {
    const base64Data = arrayBufferToBase64(frameBuffer);
    if (!base64Data || base64Data.length === 0) {
      console.warn('[sendAudioFrame] Base64编码结果为空');
      return false;
    }

    const payload = {
      business: { cmd: 'auw', aus, aue: 'raw' },
      data: { status, data: base64Data }   // 裸 PCM，无 WAV 头
    };

    console.log(`[sendAudioFrame] 发送音频帧: ${frameBuffer.byteLength} 字节, aus=${aus}, status=${status}, base64长度=${base64Data.length}`);

    ws.send(JSON.stringify(payload));

    if (isLastFrame) {
      _tailFrameSent = true;
      if (_closeAfterTail) closeWhenBufferedAmountDrains(ws);    //! 仅取消/超时；正常链路绝不进
    }
    return true;
  } catch (e) {
    console.error('[sendAudioFrame] 发送音频帧失败:', e);
    return false;
  }
}

function closeWhenBufferedAmountDrains(ws) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  if (ws.bufferedAmount === 0) { ws.close(); return; }
  setTimeout(() => closeWhenBufferedAmountDrains(ws), 20);
}

/* ============================================================================
 * §F · 业务装配（题型差分区）
 *      阶段 D 替换边界：
 *        ① TEXT_BUILDER 块：textBuilder 函数体
 *        ② XML_EXTRACTOR 块：xmlExtractor 函数体 + 全部 parser helper（parseSentence/parseWord/parseSyllable/parsePhone/summarizeWord/phoneProblem）+ 中文诊断码字典（PERR_MESSAGE_LABEL/MONO_TONE_LABEL）
 *      buildBusiness 是 schema 驱动的通用层，不替换
 *      ⚠️ helper 必须随 xmlExtractor 一起替换：
 *         · 自由题 08/10/11/12/13 的 <word> 无 syll/phone 子层，且 sentence 无 beg_pos/end_pos → 默认 helper 会输出冗余 `symbol:''/syllables:[]/begPos:''` 字段，违反精确字段集断言
 *         · 英文 05/06/07 朗读类用的是 werr_msg/syll_score/serr_msg/gwpp 等完全不同字段集（默认 helper 读 dp_message/perr_msg/is_yun/mono_tone 中文专用字段）
 *         · 中文诊断码字典 PERR_MESSAGE_LABEL/MONO_TONE_LABEL 仅 01-04 适用；英文题替换体须自带 WERR_MSG_BITS/SERR_MSG_BITS/GWPP_THRESHOLDS；自由题替换体此整段删除
 * ============================================================================ */

/* === TEXT_BUILDER START === */
//! 阶段 D.2 起：textBuilder 改为按 SCHEMA.textBuilder 字符串名 dispatch（G1 契约 · 不在函数体写死归一化规则）
//  每个 builder 必须返回 BOM + 已归一化的字符串；BOM 漏掉不报错但分数显著偏低
//  阶段 D 替换边界：生成器只在产物里保留对应题型的 builder 函数（其他可删，避免冗余）
const TEXT_BUILDER_REGISTRY = {
  // 01/02 中文字/词：BOM + 英文逗号→中文逗号 + 顿号→中文逗号（避免引擎报 10163）
  cn_unit_csv(formData) {
    const promptText = formData.promptText ?? SCHEMA.defaults.promptText;
    const normalized = String(promptText)
      .replace(/^﻿/, '')
      .replace(/,/g, '，')
      .replace(/、/g, '，')
      .replace(/，+/g, '，')
      .replace(/^，|，$/g, '')
      .trim();
    return BOM + normalized;
  },

  // 03 中文句子：BOM + 多句保留所有结构标点
  //! ⚠️ 与 01/02/04 相反——03 顿号「、」是切句结构标点，必须保留（03.md L184 反模式明令「不要动 `、`」）
  //  归一化仅限英文逗号→中文逗号；句末 。？！ 全部保留供引擎自切句
  cn_sentence_lines(formData) {
    const promptText = formData.promptText ?? SCHEMA.defaults.promptText;
    const normalized = String(promptText)
      .replace(/^﻿/, '')
      .replace(/,/g, '，')
      .trim();
    return BOM + normalized;
  },

  // 04 中文篇章：BOM + 篇章正文（归一化顿号 与 01/02 同）
  //! 04.md L173-174 normalizePromptText 实测把顿号归一化为中文逗号（与 03 相反）
  cn_chapter(formData) {
    const promptText = formData.promptText ?? SCHEMA.defaults.promptText;
    const normalized = String(promptText)
      .replace(/^﻿/, '')
      .replace(/,/g, '，')
      .replace(/、/g, '，')
      .trim();
    return BOM + normalized;
  },

  // 05 英文单词：BOM + `[word]\n` 节标头 + 英文/中文逗号/顿号/分号/空白 → 换行
  //! 漏 [word] 节标头会触发 48195；用户粘贴的 [word] 头会被先剥离再统一在外层重加（避免重复）
  //  05.md §2.1 normalizePromptText 一次性归一英文 + 中文 + 顿号 + 空白
  en_word_section(formData) {
    const promptText = formData.promptText ?? SCHEMA.defaults.promptText;
    const normalized = String(promptText)
      .replace(/^﻿/, '')
      .replace(/^\[word\]\s*/i, '')
      .split(/[\n,，、;；\s]+/)
      .map(s => s.trim())
      .filter(Boolean)
      .join('\n');
    return BOM + '[word]\n' + normalized;
  },

  // 06/07 英文句子/篇章：BOM + `[content]\n` 节标头 + 保留全部原文标点
  //! 06.md L141-145 / 07.md L153-160 normalize 实测仅做剥 BOM、剥已有 [content] 头、trim
  //  ⚠️ 不归一化任何标点（句号/问号/感叹号是引擎切句标点）、不替用户切句、不压空格
  //  漏 [content] 头会触发 48195（英文缺特殊标记）
  en_chapter_section(formData) {
    const promptText = formData.promptText ?? SCHEMA.defaults.promptText;
    const normalized = String(promptText)
      .replace(/^﻿/, '')
      .replace(/^\[content\]\s*/i, '')
      .trim();
    return BOM + '[content]\n' + normalized;
  },
};

function textBuilder(formData) {
  const fn = TEXT_BUILDER_REGISTRY[SCHEMA.textBuilder];
  if (typeof fn !== 'function') {
    throw new Error(`未注册的 textBuilder: '${SCHEMA.textBuilder}'`);
  }
  return fn(formData);
}
/* === TEXT_BUILDER END === */

function buildBusiness(formData) {
  const business = {
    sub: 'ise',
    ent: SCHEMA.protocol.ent,
    category: SCHEMA.protocol.category,
    cmd: 'ssb',
    aue: 'raw',
    auf: 'audio/L16;rate=16000',
    tte: 'utf-8',
    rstcd: 'utf8',
    ttp_skip: true,
    text: textBuilder(formData),
  };
  //! 协议参数 per-schema 白名单：英文 05-13 schema.allowedParams=[] 时即便 formData 误传 group/grade/check_type 也不会带上
  const allowed = SCHEMA.protocol.allowedParams || [];
  let group = null;
  if (allowed.includes('group')) {
    group = formData.group ?? SCHEMA.defaults.group;
    if (group) business.group = group;
  }
  if (allowed.includes('grade')) {
    const grade = formData.grade ?? SCHEMA.defaults.grade;
    if (grade && group === 'pupil') business.grade = grade;   //! grade 仅 pupil 时发送（仅 03/04 适用）
  }
  if (allowed.includes('check_type')) {
    const checkType = formData.checkType ?? SCHEMA.defaults.checkType;
    if (checkType) business.check_type = checkType;
  }
  return business;
}

function xmlExtractor(rootEl, formData) {
  /* === XML_EXTRACTOR START === */
  //! formData 透传给提取器：03/04 (groupAwareScoreMasking=true) 按 formData.group 显式屏蔽 accuracy/emotion
  //  成人 XML 也返回 accuracy_score/emotion_score=0，必须按 group 显式置 null（禁按 v>0 隐式过滤）
  const result = { paper: {}, sentences: [] };

  for (const f of SCHEMA.xmlConfig.paperFields) {
    result.paper[snakeToCamel(f)] = numberAttr(rootEl, f);
  }

  //! pupilExtraFields · 仅 03/04 (groupAwareScoreMasking=true) 启用
  //  group=pupil → 读真实值；非 pupil → 显式 null（XML 也返回但恒 0，禁按 v>0 隐式过滤）
  if (SCHEMA.xmlConfig.flags?.groupAwareScoreMasking && SCHEMA.xmlConfig.pupilExtraFields) {
    const isPupil = formData?.group === 'pupil';
    for (const f of SCHEMA.xmlConfig.pupilExtraFields) {
      result.paper[snakeToCamel(f)] = isPupil ? numberAttr(rootEl, f) : null;
    }
  }

  //! 13 题 paper 通用字段（基于 13 份 md fixture 实测核验 · A.15 修订 2026-05-08）：
  //   ✅ content / begPos / endPos / isRejected / exceptInfo —— 13 题真共享，所有 md 实测均有
  //   ⚠️ timeLen —— 仅中文 01-04 paper 实测有 time_len 属性；英文 05/06/07 与自由题 08-13
  //                引擎不返回（三份英文 md grep `time_len` 全 0 处 + B 模式自由题题级也无）
  //                → 加 SCHEMA 守卫，与 G3 source of truth 闭环（schema 声明 timeLen 才提取，
  //                  避免 result.paper 多吐 timeLen='' 让 G3 双向 keys 断言"形式通过"陷阱）
  result.paper.content    = attr(rootEl, 'content');
  result.paper.begPos     = attr(rootEl, 'beg_pos');
  result.paper.endPos     = attr(rootEl, 'end_pos');
  if (SCHEMA.resultSchema.paper.fields.includes('timeLen')) {
    result.paper.timeLen  = attr(rootEl, 'time_len');
  }
  result.paper.isRejected = attr(rootEl, 'is_rejected', 'false') === 'true';
  result.paper.exceptInfo = attr(rootEl, 'except_info', '0');

  if (SCHEMA.xmlConfig.sentenceLevel?.has) {
    //! G1 schema-driven：parseSentence/Word/Syllable/Phone 按 resultSchema.children[].fields 提取
    //  禁止在 helper 函数体内写死字段名（中文专属 perr_msg / 英文专属 gwpp 不能强加给对方）
    const sentSchema = SCHEMA.resultSchema?.children?.find(c => c.name === 'sentences');
    result.sentences = Array.from(rootEl.children)
      .filter(el => el.localName === 'sentence')
      .map((el, idx) => parseSentence(el, idx, sentSchema))
      .filter(Boolean);
  }
  return result;
  // ↓ XML_EXTRACTOR 块 END marker 在最末（PERR/MONO_TONE 字典之后）
  //   阶段 D 替换时连同所有 parser helper + 中文诊断码字典一并替换
}

//! G1 契约：sub-layer parser 全部按 schema.fields 驱动提取，禁止写死中文专属字段名
//  04 中文 phone 与 05/06/07 英文 phone 字段集完全不同，靠 schema 数据驱动避免函数体歧义
//  perr_level_msg → perrLevel 是缩写（schema 字段定义 §设计原则 4 G2 缩写细则）
function parseSentence(sentEl, idx, sentSchema) {
  const wordEls = Array.from(sentEl.children).filter(el => el.localName === 'word');
  //! 06/07 英文朗读：<word content="sil"|"fil"> 是静音/噪音占位，按 content 正向过滤；中文 01-04 不启用此 flag（中文走 syll 层 rec_node_type 反向过滤）
  const filterSilFil = SCHEMA.xmlConfig.flags?.filterWordBySilFilContent;
  const wordsKept = filterSilFil
    ? wordEls.filter(el => attr(el, 'content') !== 'sil' && attr(el, 'content') !== 'fil')
    : wordEls;
  //! 仅 06/07：当原本有 word 但全被 sil/fil 过滤时丢弃整句；其他题型保留空 word[]（允许 03/04 pupil fixture 仅含题级数据）
  if (filterSilFil && wordEls.length > 0 && wordsKept.length === 0) return null;

  const sent = extractByCamelFields(sentEl, sentSchema?.fields || ['index', 'content', 'begPos', 'endPos'], idx);
  const wordSchema = sentSchema?.children?.find(c => c.name === 'words');
  //! D.5.2 修复（追改 · 2026-05-09）：传入 i 作 word.index fallback —— XML attr 才是主来源（与 D.5.1 底座一致）
  sent.words = wordsKept.map((el, i) => parseWord(el, wordSchema, i));    //! 02/03/04/06/07 多 word 流；01 单字数组长度=1
  return sent;
}

//! D.5.2：加 idx 参数作 word.index fallback（XML 没 index 属性时启用）。XML attr 才是主来源 —— 引擎权威句内序号
function parseWord(wordEl, wordSchema, idx) {
  //! 02/03/04 拼音渲染请勿直接读 word.symbol：会出现 le5/lai7 类轻声后缀；权威拼音从 syllables[].symbol 中 recNodeType==='paper' 的 syll 聚合
  const word = extractByCamelFields(wordEl, wordSchema?.fields || ['content', 'symbol', 'begPos', 'endPos'], idx);
  const syllSchema = wordSchema?.children?.find(c => c.name === 'syllables');
  word.syllables = Array.from(wordEl.children)
    .filter(el => el.localName === 'syll')
    .map(el => parseSyllable(el, syllSchema));
  return word;
}

function parseSyllable(syllEl, syllSchema) {
  const syl = extractByCamelFields(syllEl, syllSchema?.fields || ['content', 'symbol', 'dpMessage', 'recNodeType']);
  const phoneSchema = syllSchema?.children?.find(c => c.name === 'phones');
  syl.phones = Array.from(syllEl.children)
    .filter(el => el.localName === 'phone')
    .map(phoneEl => parsePhone(phoneEl, syllEl, phoneSchema));
  return syl;
}

function parsePhone(phoneEl, syllEl, phoneSchema) {
  const fields = phoneSchema?.fields
    || ['content', 'dpMessage', 'perrMsg', 'perrLevel', 'isYun', 'monoTone', 'recNodeType', 'begPos', 'endPos', 'timeLen'];
  const phone = extractByCamelFields(phoneEl, fields);
  //! recNodeType 继承：phone 偶发缺 attr 时回落到 syll（避免被强制识别为 'paper' 而漏过反向过滤）
  if (fields.includes('recNodeType') && !phoneEl.hasAttribute('rec_node_type') && syllEl?.hasAttribute('rec_node_type')) {
    phone.recNodeType = attr(syllEl, 'rec_node_type', 'paper');
  }
  return phone;
}

//! 字级诊断聚合（英文版）：word.werr_msg 位掩码 + 内部 syll.serr_msg 位掩码 → 标签数组
//  与中文 summarizeWord 的差异：英文 word 自身带 werrMsg + 内部 syll 带 serrMsg（位掩码）；不走 dp 优先短路（英文无 perr 污染问题）
function summarizeWord(word) {
  const labels = [];
  // word 层 werr_msg：意群停顿/连读/重读/句末调
  if (word.werrMsg && word.werrMsg !== '0') {
    for (const lbl of decodeBitmask(word.werrMsg, WERR_MSG_BITS)) labels.push(lbl);
  }
  // word 层 dp_message：漏读/增读/回读/替换
  if (word.dpMessage && word.dpMessage !== '0') {
    labels.push(DP_MESSAGE_LABEL[word.dpMessage] || `dp=${word.dpMessage}`);
  }
  // syll 层 serr_msg：读错/该重读未重
  for (const syl of (word.syllables || [])) {
    for (const lbl of syllProblem(syl)) labels.push(lbl);
  }
  return { wrong: labels.length > 0, labels: Array.from(new Set(labels)) };
}

function syllProblem(syl) {
  const labels = [];
  if (syl.serrMsg && syl.serrMsg !== '0') {
    for (const lbl of decodeBitmask(syl.serrMsg, SERR_MSG_BITS)) labels.push(lbl);
  }
  //! syll_score === 0 ≠ 漏读（漏读看 word.dp_message=16）；不在此抛 0 分标签
  return labels;
}

/* ----------------------------------------------------------------------------
 * §F.5 · 英文朗读题适配块（05/06/07 适用）
 *        从中文 PERR_MESSAGE_LABEL/MONO_TONE_LABEL 替换而来；按 §3.0 治理决策表 ②' 题型差分块
 *          · 仅 N 题共用诊断字典：进 demo §F 替换块自带，禁进 13 题公共区
 *          · WERR_MSG_BITS / SERR_MSG_BITS：位掩码字典（按位 & 拆解；未知位保留 raw `bit=N` 兜底）
 *          · GWPP_THRESHOLDS / gwppLevel：gwpp 负数刻度分档（仅 UI 染色参考；非官方评分）
 *          · decodeBitmask：通用位掩码解码工具（05.md §0 反模式明令对未知位保留 raw fallback）
 * ---------------------------------------------------------------------------- */

const WERR_MSG_BITS = {                  // word.werr_msg 位字典
  256:  '意群停顿未停',
  512:  '连读未连',
  2048: '该重读未重',
  4096: '句末升降调错',
};

const SERR_MSG_BITS = {                  // syll.serr_msg 位字典；2049 = 2048 | 1
  1:    '读错',
  2048: '该重读未重',
};

//! gwpp 负数刻度分档（非官方阈值；06.md L48 标"约 -10 ~ 0" §4.5 实测低至 -8.16，越接近 0 越标准）
//  05/06/07 共用阈值；句子题动态范围比单词题大，bad 区间会更频繁出现
const GWPP_THRESHOLDS = {
  good:   -1.0,    // gwpp >= -1.0  → good
  medium: -2.5,    // -2.5 <= gwpp < -1.0 → medium
  // 否则 → bad
};

//! 位掩码解码：raw 数字 → 标签数组；未知位保留 `bit=N` 兜底
//  05.md §0 反模式明令：实跑 goodbye werr_msg=8192 未列，必须保留 raw fallback
function decodeBitmask(raw, dict) {
  const n = Number(raw) || 0;
  if (n === 0) return [];
  const labels = [];
  let remaining = n;
  for (const bit of Object.keys(dict).map(Number).sort((a, b) => b - a)) {
    if ((remaining & bit) === bit) {
      labels.push(dict[bit]);
      remaining &= ~bit;
    }
  }
  for (let bit = 1; bit <= remaining; bit <<= 1) {
    if (remaining & bit) labels.push(`bit=${bit}`);
  }
  return labels;
}

//! gwpp → 'good' | 'medium' | 'bad'（仅 UI 染色参考）
function gwppLevel(g) {
  const v = Number(g);
  if (!Number.isFinite(v)) return 'unknown';
  if (v >= GWPP_THRESHOLDS.good)   return 'good';
  if (v >= GWPP_THRESHOLDS.medium) return 'medium';
  return 'bad';
}

/* ============================================================================
 * §G' · 业务派生逻辑注册表（按 SCHEMA.businessLogic 字符串名调用）
 *      引擎不返回的客户端业务派生：09 答对/答错连续匹配、08 关键词软命中、07 dp=32 增读折叠等
 *      签名统一：(result, formData) => result（必须返回新 result，不可原地改）
 *      阶段 D 由生成器替换：把题型用到的函数体注入此对象
 * ============================================================================ */

const BUSINESS_LOGIC_REGISTRY = {
  // 07 en_read_chapter：同 global_index 的 dp=32（增读）+ dp=0（正常）按 global_index 单 key 合并，dp=32 折叠到 extraReadings
  // merge_dp32_by_global_index: (result, formData) => { ...; return result; },

  // 08 simple_expression：关键词命中 = 业务侧软匹配（引擎不返回单词分；按 ASR content 与 keywords 软匹配）
  // keyword_soft_hit: (result, formData) => { ...; return result; },

  // 09 read_choice：答对/答错 = ASR free_choice.content × keywords 任一连续匹配
  // keyword_contiguous_match: (result, formData) => { ...; return result; },
};

/* ============================================================================
 * §H · 状态机 + 事件总线
 *      states: idle | connecting | recording | scoring | done | error
 *      events: recording | result | rejected | except | error
 * ============================================================================ */

const _listeners = {};
let _state = 'idle';
let _formData = {};
let _recordingStartedAt = 0;

function emit(event, payload) {
  (_listeners[event] || []).forEach(cb => {
    try { cb(payload); } catch (e) { console.error('[QuizEngine] listener error', e); }
  });
}

function on(event, cb) {
  if (typeof cb !== 'function') return;
  (_listeners[event] = _listeners[event] || []).push(cb);
}

function setState(next) {
  _state = next;
  emit('state', next);
}

function getState() { return _state; }

function resetSessionFlags() {
  _firstAudioFrame = true;
  _tailFrameSent = false;
  _closeAfterTail = false;
  _ws = null;
}

/* ============================================================================
 * §I · 主流程：start / stop / cancel
 * ============================================================================ */

async function start(formData) {
  if (_state === 'connecting' || _state === 'recording' || _state === 'scoring') {
    throw new Error(`不能在 ${_state} 状态下 start`);
  }
  _formData = formData || {};
  //! 把 SCHEMA.defaults 推断后的 group 回写到 _formData，使 xmlExtractor 能拿到（03/04 cn 句/篇 accuracyScore/emotionScore null 哨兵架构依赖此值）
  //  英文 05-13 schema.protocol.allowedParams 不含 group → 不进此分支；中文 01-04 必进
  if (SCHEMA.protocol.allowedParams?.includes('group')) {
    _formData.group = _formData.group ?? SCHEMA.defaults.group;
  }
  resetSessionFlags();
  setState('connecting');

  let url;
  try {
    url = await getWebSocketUrl(ENGINE_CONFIG.apiKey, ENGINE_CONFIG.apiSecret);
  } catch (e) {
    setState('error');
    emit('error', { code: 'sign_failed', message: '签名失败：' + (e?.message || e) });
    return;
  }

  const ws = new WebSocket(url);
  _ws = ws;

  ws.onopen = async () => {
    try {
      // ① 业务首帧：携带 business + text，不含音频
      const initFrame = {
        common:   { app_id: ENGINE_CONFIG.appId },
        business: buildBusiness(_formData),
        data:     { status: 0 },
      };
      console.log('[ws.onopen] 发送业务首帧:', JSON.stringify(initFrame));
      ws.send(JSON.stringify(initFrame));

      // 等待一小段时间确保服务器准备好接收音频
      await new Promise(resolve => setTimeout(resolve, 100));

      // ② 录音 + 逐帧发送（录音内部会自动发首帧 aus:1）
      _recordingStartedAt = Date.now();
      setState('recording');

      let frameCount = 0;
      await startRecording((buf, isLast) => {
        frameCount++;
        if (frameCount <= 3) {
          console.log(`[ws.onopen] 收到音频帧 #${frameCount}: ${buf.byteLength} 字节, isLast=${isLast}`);
        }
        const sent = sendAudioFrame(ws, buf, isLast);
        if (frameCount <= 3) {
          console.log(`[ws.onopen] 音频帧 #${frameCount} 发送结果: ${sent}`);
        }
        emit('recording', {
          isLastFrame: isLast,
          elapsedMs:   Date.now() - _recordingStartedAt,
        });
      });
    } catch (e) {
      setState('error');
      emit('error', { code: 'mic_or_send_failed', message: e?.message || String(e) });
      try { ws.close(); } catch {}
    }
  };

  ws.onmessage = e => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }

    if (msg.code !== 0) {
      // 顶层错误码 → 触发取消/超时收尾
      const label = ENGINE_ERROR_LABEL[msg.code] || `未知错误 (code=${msg.code})`;
      setState('error');
      emit('error', { code: msg.code, message: msg.message || label });
      _closeAfterTail = true;
      if (!_tailFrameSent) stopRecording();
      else closeWhenBufferedAmountDrains(ws);
      return;
    }

    if (msg.data?.data) {
      try {
        const xml = decodeBase64Utf8(msg.data.data);
        const doc = new DOMParser().parseFromString(xml, 'text/xml');
        if (doc.querySelector('parsererror')) throw new Error('XML 解析失败');

        // 按 SCHEMA.xmlConfig.drillPath 逐层下钻；元素可为字符串（按 localName）或
        //   {childByIndex, expectedTag}（A'/C 模式：内层 tag 与 category 错位时按位置取，再校验 tag）
        let node = doc.documentElement;
        for (const step of SCHEMA.xmlConfig.drillPath) {
          if (typeof step === 'string') {
            node = childByName(node, step);
            if (!node) throw new Error(`drillPath 未找到节点：${step}`);
          } else if (step && typeof step === 'object') {
            const child = node?.children?.[step.childByIndex];
            if (!child) throw new Error(`drillPath 索引越界：children[${step.childByIndex}]`);
            if (step.expectedTag && child.localName !== step.expectedTag) {
              throw new Error(`drillPath tag 不匹配：期望 ${step.expectedTag}，实际 ${child.localName}`);
            }
            node = child;
          } else {
            throw new Error(`drillPath 步骤格式错误：${JSON.stringify(step)}`);
          }
        }
        let result = xmlExtractor(node, _formData);                       //! let：businessLogic hook 可能整体替换 result（如 09 答对、07 增读折叠）

        if (result.paper.isRejected) {
          emit('rejected', { paper: result.paper });
        } else if (result.paper.exceptInfo && result.paper.exceptInfo !== '0') {
          emit('except', {
            code:  result.paper.exceptInfo,
            label: EXCEPT_INFO_LABEL[result.paper.exceptInfo] || '未知异常',
            paper: result.paper,
          });
        } else {
          //! 业务派生逻辑 hook（07 增读折叠 / 08 关键词命中 / 09 答对算法等引擎不返回的客户端逻辑）
          if (SCHEMA.businessLogic) {
            const businessFn = BUSINESS_LOGIC_REGISTRY[SCHEMA.businessLogic];
            if (typeof businessFn === 'function') {
              try { result = businessFn(result, _formData); }
              catch (bizErr) { console.error('[QuizEngine] businessLogic 执行失败', bizErr); }
            } else {
              console.warn(`[QuizEngine] BUSINESS_LOGIC_REGISTRY 未注册：${SCHEMA.businessLogic}`);
            }
          }
          emit('result', result);
        }
      } catch (parseErr) {
        setState('error');   //! 解析失败必须流转状态，否则 UI 卡在 scoring 不动
        emit('error', { code: 'parse_failed', message: parseErr?.message || String(parseErr) });
      }
    }

    //! 关闭点 A · 正常评测唯一关闭点
    if (msg.data?.status === 2) {
      setState('done');
      try { ws.close(); } catch {}
    }
  };

  ws.onerror = () => {
    setState('error');
    emit('error', { code: 'ws_error', message: 'WebSocket 错误' });
  };

  ws.onclose = () => {
    if (_state === 'recording' || _state === 'scoring' || _state === 'connecting') {
      // 异常关闭：可能 ws_error / 网络中断
      setState('error');
    }
    if (_recWorker) {
      try { _recWorker.terminate(); } catch {}
      _recWorker = null;
    }
  };
}

function stop() {
  if (_state !== 'recording') return;
  setState('scoring');
  //! 正常提交：只停录音让 Worker flush 尾帧；ws 继续等服务端 data.status === 2
  stopRecording();
}

function cancel() {
  if (_state === 'idle' || _state === 'done' || _state === 'error') return;
  //! 取消有 3 种状态机情形，都要处理：
  //   ① connecting：ws 在建但还没 onopen；首帧都没发，直接关
  //   ② recording：还在录音；停录音 + 走尾帧关闭点 B
  //   ③ scoring（已停录音、尾帧已发）：等 bufferedAmount 归零后关
  if (_state === 'connecting') {
    if (_ws) try { _ws.close(); } catch {}
    setState('idle');
    return;
  }
  _closeAfterTail = true;
  if (_state === 'recording') {
    setState('scoring');
    stopRecording();
  } else if (_tailFrameSent && _ws?.readyState === WebSocket.OPEN) {
    closeWhenBufferedAmountDrains(_ws);
  }
}

if (typeof location !== 'undefined' &&

  }
  on('result',    p => appendLog('result',    p));
  on('rejected',  p => appendLog('rejected',  p));
  on('except',    p => appendLog('except',    p));
  on('error',     p => appendLog('error',     p));
  on('recording', p => { /* 高频事件，不入 log */ });

  /* --------------------------------------------------------------------------
   * §J.2 · fixture 离线回放区
   *        按 SCHEMA.fixtures 中存在的 key 动态生成按钮
   *        ⚠️ 禁止写死 ['sample','rejected','except']——09 有 wrong 键、03/04 有 sample 子键
   * -------------------------------------------------------------------------- */

  if (SCHEMA.fixtures && Object.keys(SCHEMA.fixtures).length > 0) {

/* --------------------------------------------------------------------------
 * §J.3 · fixture 回放引擎
 *        fetch XML → drillPath 下钻 → xmlExtractor → 按 key 分流断言
 * -------------------------------------------------------------------------- */

async function replayFixture(key, path, appendLog) {
  appendLog('fixture:load', { key, path });
  try {
    const resp = await fetch(path);
    if (!resp.ok) throw new Error(`HTTP ${resp.status} — ${path}`);
    const xml = await resp.text();
    //! 03/04 sample.{adult,pupil} 子键直接作为 formData.group 传入 xmlExtractor
    //  使 groupAwareScoreMasking 能在离线回放时正确触发 accuracy/emotion 屏蔽
    const subKey = key.split('.')[1];
    const fixtureFormData = subKey ? { group: subKey } : {};
    const result = parseFixtureXml(xml, fixtureFormData);
    const assertion = assertFixture(key, result);
    appendLog(`fixture:${key}`, { result, assertion });
    return { key, result, assertion };
  } catch (err) {
    const msg = `fixture:${key} 加载失败 — ${err.message}`;
    appendLog('fixture:error', { key, error: msg });
    return { key, result: null, assertion: { pass: false, reason: msg } };
  }
}

function parseFixtureXml(xml, formData) {
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  if (doc.querySelector('parsererror')) throw new Error('XML 解析失败');

  // 按 SCHEMA.xmlConfig.drillPath 逐层下钻（与主流程 §I 一致）
  let node = doc.documentElement;
  for (const step of SCHEMA.xmlConfig.drillPath) {
    if (typeof step === 'string') {
      node = childByName(node, step);
      if (!node) throw new Error(`drillPath 未找到节点：${step}`);
    } else if (step && typeof step === 'object') {
      const child = node?.children?.[step.childByIndex];
      if (!child) throw new Error(`drillPath 索引越界：children[${step.childByIndex}]`);
      if (step.expectedTag && child.localName !== step.expectedTag) {
        throw new Error(`drillPath tag 不匹配：期望 ${step.expectedTag}，实际 ${child.localName}`);
      }
      node = child;
    }
  }

  // 复用底座的 xmlExtractor；formData 由 replayFixture 按 fixture 子键推断（含 group）
  return xmlExtractor(node, formData || _formData || {});
}

/* --------------------------------------------------------------------------
 * §J.4 · 断言层（按 fixture key 分流）
 *        sample   → 验证 result 字段齐全
 *        rejected → 验证 paper.isRejected === true
 *        except   → 验证 paper.exceptInfo !== '0'
 *        wrong    → 验证有分数但业务侧判错（09 专用）
 * -------------------------------------------------------------------------- */

//! G3 双向 keys 集合断言工具（契约见字段定义.md §8 G3）
//  parser 输出对象 keys 必须等于 schema 期望集合（无多余 + 无缺失），守门 schema/parser 漂移
//  expectedKeysFor 推导：fields + pupilExtraFields（仅 paper 层 + groupAwareScoreMasking 启用）+ 子层 children.name
function setEqual(a, b) {
  if (a.length !== b.length) return false;
  const setB = new Set(b);
  return a.every(x => setB.has(x));
}

function expectedKeysFor(schemaNode, opts = {}) {
  const keys = [...(schemaNode.fields || [])];
  //! pupilExtraFields 仅 paper 层 + groupAwareScoreMasking=true 启用（03/04 cn 句/篇）
  if (opts.isPaper && SCHEMA.xmlConfig.flags?.groupAwareScoreMasking) {
    for (const f of SCHEMA.xmlConfig.pupilExtraFields || []) keys.push(snakeToCamel(f));
  }
  //! 子层数组 key（如 sentence 上的 'words'、word 上的 'syllables'）
  for (const child of schemaNode.children || []) keys.push(child.name);
  return keys;
}

//! 递归校验 children 各层首项 keys 集合（paper-only fixture 容忍：空数组跳过）
function checkChildrenKeys(parentObj, parentSchema, path, checks) {
  for (const childSchema of parentSchema.children || []) {
    const arr = parentObj[childSchema.name];
    if (!arr?.length) continue;   //! paper-only 容忍（03/04 sample.pupil 仅含题级数据）
    const item = arr[0];
    const actualKeys = Object.keys(item);
    const expectedKeys = expectedKeysFor(childSchema);
    if (!setEqual(actualKeys, expectedKeys)) {
      const extra = actualKeys.filter(k => !expectedKeys.includes(k));
      const missing = expectedKeys.filter(k => !actualKeys.includes(k));
      checks.push(`${path}.${childSchema.name}[0] keys 不匹配 · 多余[${extra.join(',')}] 缺失[${missing.join(',')}]`);
    }
    checkChildrenKeys(item, childSchema, `${path}.${childSchema.name}[0]`, checks);
  }
}

function assertFixture(key, result) {
  // 按 key 基名分流（去掉 .adult / .pupil 等子键后缀）
  const baseKey = key.split('.')[0];
  const subKey  = key.split('.')[1];   // 'adult' / 'pupil' / undefined

  if (baseKey === 'sample') {
    // 正常出分：paper 字段齐全 + 分数有值
    const checks = [];
    if (!result.paper) checks.push('paper 缺失');
    for (const f of SCHEMA.xmlConfig.paperFields) {
      const camel = snakeToCamel(f);
      if (result.paper[camel] === null || result.paper[camel] === undefined) {
        checks.push(`paper.${camel} 缺失`);
      }
    }

    //! G3 · pupilExtraFields 双向断言（仅 03/04 groupAwareScoreMasking=true 时启用）
    //  · sample.pupil → 期望真实数值（accuracy/emotion 非 null）
    //  · sample.adult / sample.youth → 期望显式 null（成人 XML 也返回 0，必须屏蔽）
    if (SCHEMA.xmlConfig.flags?.groupAwareScoreMasking && SCHEMA.xmlConfig.pupilExtraFields) {
      const expectsPupilValues = subKey === 'pupil';
      for (const f of SCHEMA.xmlConfig.pupilExtraFields) {
        const camel = snakeToCamel(f);
        const v = result.paper[camel];
        if (expectsPupilValues) {
          if (v === null || v === undefined) {
            checks.push(`paper.${camel} (${subKey}) 应有真实值，实际 ${v}`);
          }
        } else {
          if (v !== null) {
            checks.push(`paper.${camel} (${subKey || 'no-subkey'}) 应被屏蔽为 null，实际 ${v}`);
          }
        }
      }
    }

    if (result.paper.isRejected) checks.push('paper.isRejected 不应为 true');
    if (result.paper.exceptInfo && result.paper.exceptInfo !== '0') {
      checks.push(`paper.exceptInfo 应为 '0'，实际 '${result.paper.exceptInfo}'`);
    }
    // 验证子层结构（如果 schema 声明有 sentences）
    if (SCHEMA.xmlConfig.sentenceLevel?.has) {
      if (!result.sentences || !result.sentences.length) {
        checks.push('sentences 数组为空');
      } else {
        //! 找首个含 words 的 sentence；若全部 words=[] 视为合法 paper-only fixture（03/04 sample.pupil 仅留题级字段）跳过子层检查
        const s0 = result.sentences.find(s => s.words?.length > 0);
        if (s0) {
          if (SCHEMA.xmlConfig.wordLevel?.hasSyllables) {
            if (!s0.words[0].syllables || !s0.words[0].syllables.length) {
              checks.push('words[0].syllables 为空');
            }
          }
          if (SCHEMA.xmlConfig.wordLevel?.hasPhones && s0.words[0].syllables?.[0]) {
            // 过滤非 paper 的 syll（如 silv）再检查 phones
            const paperSyll = s0.words[0].syllables.find(sy =>
              !SCHEMA.xmlConfig.flags?.filterSyllByRecNodeType || sy.recNodeType === 'paper'
            );
            if (paperSyll && (!paperSyll.phones || !paperSyll.phones.length)) {
              checks.push('paper syll 下 phones 为空');
            }
          }
        }
      }
    }

    //! G3 双向 keys 集合断言（契约见字段定义.md §8 G3）
    //  paper 层：Object.keys(result.paper) 必须等于 resultSchema.paper.fields + pupilExtraFields(若启用)
    //  子层递归：sentences/words/syllables/phones 各层首项 keys 必须等于 schema 声明
    //  违例情形：parser 多吐字段（如误加 foobar）/ 漏掉 schema 声明字段 / schema 漂移
    const actualPaperKeys = Object.keys(result.paper);
    const expectedPaperKeys = expectedKeysFor(SCHEMA.resultSchema.paper, { isPaper: true });
    if (!setEqual(actualPaperKeys, expectedPaperKeys)) {
      const extra = actualPaperKeys.filter(k => !expectedPaperKeys.includes(k));
      const missing = expectedPaperKeys.filter(k => !actualPaperKeys.includes(k));
      checks.push(`paper keys 不匹配 · 多余[${extra.join(',')}] 缺失[${missing.join(',')}]`);
    }
    checkChildrenKeys(result, { children: SCHEMA.resultSchema.children || [] }, 'result', checks);

    return { pass: checks.length === 0, checks };
  }

  if (baseKey === 'rejected') {
    // 引擎拒识：isRejected 必须为 true
    if (!result.paper) return { pass: false, checks: ['paper 缺失'] };
    const ok = result.paper.isRejected === true;
    return { pass: ok, checks: ok ? [] : [`paper.isRejected 应为 true，实际 ${result.paper.isRejected}`] };
  }

  if (baseKey === 'except') {
    // 异常：exceptInfo 不为 '0'
    if (!result.paper) return { pass: false, checks: ['paper 缺失'] };
    const ok = result.paper.exceptInfo && result.paper.exceptInfo !== '0';
    return { pass: ok, checks: ok ? [] : [`paper.exceptInfo 应非 '0'，实际 '${result.paper.exceptInfo}'`] };
  }

  if (baseKey === 'wrong') {
    // 业务侧判错（09 专用）：有分数但 businessLogic 判定答错
    if (!result.paper) return { pass: false, checks: ['paper 缺失'] };
    const checks = [];
    // wrong fixture 应该有分数（不是 rejected/except）
    if (result.paper.isRejected) checks.push('wrong fixture 不应为 rejected');
    if (result.paper.exceptInfo && result.paper.exceptInfo !== '0') {
      checks.push(`wrong fixture exceptInfo 应为 '0'，实际 '${result.paper.exceptInfo}'`);
    }
    return { pass: checks.length === 0, checks };
  }

  // 未知 key 类型
  return { pass: true, checks: [`未知 fixture key '${key}'，跳过断言`] };
}

/* --------------------------------------------------------------------------
 * §J.5 · runAssertions()  聚合所有 fixture 的断言结果
 * -------------------------------------------------------------------------- */

async function runAssertions(appendLog) {
  if (!SCHEMA.fixtures) {
    appendLog('assertions', { pass: false, message: 'SCHEMA.fixtures 未定义' });
    return;
  }

  const results = [];

  //! 按 SCHEMA.fixtures 存在的 key 动态加载（禁止写死列表）
  for (const fixtureKey of Object.keys(SCHEMA.fixtures)) {
    const path = SCHEMA.fixtures[fixtureKey];
    if (typeof path === 'object' && path !== null) {
      // 03/04 sample.{adult,pupil} 子键
      for (const subKey of Object.keys(path)) {
        const r = await replayFixture(`${fixtureKey}.${subKey}`, path[subKey], appendLog);
        results.push(r);
      }
    } else {
      const r = await replayFixture(fixtureKey, path, appendLog);
      results.push(r);
    }
  }

  const allPass = results.every(r => r.assertion.pass);
  const summary = {
    pass: allPass,
    total: results.length,
    passed: results.filter(r => r.assertion.pass).length,
    failed: results.filter(r => !r.assertion.pass).map(r => ({
      key: r.key,
      checks: r.assertion.checks || [r.assertion.reason],
    })),
  };

  appendLog('assertions:summary', summary);
  return summary;
}

/* ============================================================================
 * §K · 公共 API
 * ============================================================================ */

window.QuizEngine = {
  start, stop, cancel, getState, on,
  schema: {
    id:           SCHEMA.id,
    displayName:  SCHEMA.displayName,
    category:     SCHEMA.protocol.category,
    ent:          SCHEMA.protocol.ent,
    paperFields:  SCHEMA.xmlConfig.paperFields.map(snakeToCamel),   //! 对外 API 用驼峰，与 result.paper 字段命名一致；XML 解析层用下划线名留在 SCHEMA.xmlConfig.paperFields，不暴露
    resultSchema: SCHEMA.resultSchema,            //! 下游 AI 看这里就知道 result 事件 payload 长什么样（递归 children 结构）
    vocab:        SCHEMA.vocab,                   //! UI 显示文案必须从这里取（术语锁定）
  },
};

})();
</script>

      <div class="no-selection">

<script>
(function() {
  const SENTENCES = [
    "Hello! I'm Mike Black.",
    "Hi! My name is Wu Binbin.",
    "Nice to meet you.",
    "Nice to meet you too.",
    "Oh no!",
    "It's OK, Chen Jie.",
    "Hey, Sarah! We can share.",
    "Thanks, Sarah. / Thank you, Chen Jie.",
    "I listen with care.",
    "I am nice to my friends."
  ];

  let currentIdx = -1;
  const scoreStore = {};
  let studentName = '';
  let studentClass = '';

  window.handleLogin = function() {
    const nameInput = document.getElementById('studentName');
    const classSelect = document.getElementById('studentClass');
    const nameError = document.getElementById('nameError');
    const classError = document.getElementById('classError');
    let valid = true;

    nameError.classList.remove('show');
    classError.classList.remove('show');

    if (!nameInput.value.trim()) {
      nameError.classList.add('show');
      valid = false;
    }
    if (!classSelect.value) {
      classError.classList.add('show');
      valid = false;
    }
    if (!valid) return;

    studentName = nameInput.value.trim();
    studentClass = classSelect.value;
    document.getElementById('loginOverlay').classList.add('hidden');
  };

  function showBanner(message, type) {
    const banner = document.getElementById('submitBanner');
    banner.textContent = message;
    banner.className = 'submit-banner ' + type;
    setTimeout(() => { banner.className = 'submit-banner'; }, 3000);
  }

  function formatWordDetail(word) {
    if (!word || !word.syllables) return null;
    const phones = [];
    let ipa = '';
    word.syllables.forEach(syl => {
      if (!syl.phones) return;
      syl.phones.forEach(phone => {
        if (!phone.content || phone.content === 'sil' || phone.content === 'fil') return;
        const raw = (phone.content || '').toLowerCase();
        const ipaChar = PHONEME_MAP[raw] || phone.content || '';
        const gwpp = parseFloat(phone.gwpp) || 0;
        let levelText = '优';
        if (gwpp < -2.5) levelText = '差，需注意发音';
        else if (gwpp < -1.0) levelText = '弱，需加强练习';
        phones.push({ ipa: ipaChar, level: levelText, gwpp });
        ipa += ipaChar;
      });
    });
    const score = word.totalScore !== null && word.totalScore !== undefined ? word.totalScore : '--';
    const hasIssue = score !== '--' && (score < 60 || phones.some(p => p.gwpp < -1.0));
    const prefix = hasIssue ? '⚠️' : '✅';
    const phoneStr = phones.map(p => `/${p.ipa}/ (${p.level})`).join(' ');
    return `${prefix} [${word.content}] ${score}分  - 发音拆解：${phoneStr}`;
  }

  async function submitResults() {
    const testedCount = Object.keys(scoreStore).length;
    if (testedCount === 0) return;

    const allWords = [];
    for (let i = 0; i < SENTENCES.length; i++) {
      const sc = scoreStore[i];
      if (sc && sc.words) {
        sc.words.forEach(w => allWords.push(formatWordDetail(w)));
      }
    }
    const wordDetails = allWords.filter(Boolean).join('\n');

    const lastIdx = Math.max(...Object.keys(scoreStore).map(Number));
    const paper = scoreStore[lastIdx] || {};

    const payload = {
      name: studentName,
      className: studentClass,
      unit: 'Unit 1',
      totalScore: paper.totalScore,
      accuracyScore: paper.accuracyScore,
      standardScore: paper.standardScore,
      fluencyScore: paper.fluencyScore,
      integrityScore: paper.integrityScore,
      wordDetails: wordDetails,
      testedCount: testedCount,
      totalCount: SENTENCES.length,
      submitTime: new Date().toLocaleString('zh-CN'),
    };

    try {
      const resp = await fetch('https://quickform.cn/api/46ibabfsug', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (resp.ok) {
        showBanner('✅ 测评结果提交成功！', 'success');
      } else {
        showBanner('❌ 提交失败，请重试', 'fail');
      }
    } catch (e) {
      showBanner('❌ 网络错误，提交失败', 'fail');
    }
  }

  function toPercentScore(value) {
    if (value === null || value === undefined) return null;
    const num = Number(value);
    if (!Number.isFinite(num)) return null;
    const maxVal = 5.0;
    if (num <= maxVal && num > 0) return Math.round(num * 20);
    if (num <= 10 && num > maxVal) return Math.round(num * 10);
    return Math.round(num);
  }

  function renderSentenceList() {
    const list = document.getElementById('sentenceList');
    list.innerHTML = SENTENCES.map((s, i) => {
      const isActive = i === currentIdx;
      const hasScore = scoreStore[i] !== undefined;
      const cls = ['sentence-item'];
      if (isActive) cls.push('active');
      if (hasScore) cls.push('tested');
      let miniScore = '';
      if (hasScore) {
        const sc = scoreStore[i].totalScore;
        const low = sc !== null && sc < 60;
        miniScore = `<span class="sentence-mini-score ${low ? 'low' : ''}">${sc !== null ? sc : '--'}分</span>`;
      }
      return `<div class="${cls.join(' ')}" data-idx="${i}" onclick="selectSentence(${i})">
        <span class="sentence-num">${i + 1}</span>
        <span class="sentence-text">${s}</span>
        ${miniScore}
      </div>`;
    }).join('');
  }

  function renderEvalArea() {
    const area = document.getElementById('evalArea');
    if (currentIdx < 0) {
      area.innerHTML = `<div class="no-selection"><div class="icon">👈</div><p>请点击左侧句子开始测评</p></div>`;
      return;
    }

    const sentence = SENTENCES[currentIdx];
    const stored = scoreStore[currentIdx];

    area.innerHTML = `
      <div class="current-sentence-box">
        <div class="current-sentence-label">当前句子 #${currentIdx + 1}</div>
        <div class="current-sentence-text">${sentence}</div>
      </div>
      <div class="controls">
        <button class="btn btn-start" id="startBtn" onclick="handleStart()">
          <span>🎤</span><span>开始录音</span>
        </button>
        <button class="btn btn-stop" id="stopBtn" onclick="handleStop()" disabled>
          <span>⏹️</span><span>停止录音</span>
        </button>
        <button class="btn btn-cancel" id="cancelBtn" onclick="handleCancel()" disabled>
          <span>❌</span><span>取消</span>
        </button>
      </div>
      <div class="audio-visualizer" id="audioVisualizer">
        <div class="audio-bar"></div><div class="audio-bar"></div><div class="audio-bar"></div>
        <div class="audio-bar"></div><div class="audio-bar"></div><div class="audio-bar"></div>
        <div class="audio-bar"></div>
      </div>
      <div class="status-indicator">
        <div class="status-badge" id="statusBadge"><span>💡</span><span id="statusText">准备就绪</span></div>
      </div>
      <div class="results-area" id="resultsArea">
        ${stored ? renderResults(stored) : ''}
      </div>
    `;
  }

  function renderResults(data) {
    const p = data;
    let html = `<div class="score-overview"><h3>评分结果</h3><div class="score-row">`;
    html += renderScoreCard('总分', p.totalScore);
    html += renderScoreCard('准确度', p.accuracyScore);
    html += renderScoreCard('标准度', p.standardScore);
    html += renderScoreCard('流利度', p.fluencyScore);
    html += renderScoreCard('完整度', p.integrityScore);
    html += `</div></div>`;

    if (p.words && p.words.length > 0) {
      html += `<div class="words-section"><h3>单词详情</h3><div class="words-grid">`;
      html += p.words.map(w => renderWordCard(w)).join('');
      html += `</div></div>`;
    }
    return html;
  }

  function renderScoreCard(label, value) {
    const v = value !== null && value !== undefined ? value : '--';
    return `<div class="score-card"><div class="score-card-value">${v}</div><div class="score-card-label">${label}</div></div>`;
  }

  const PHONEME_MAP = {
    'aa': 'ɑː', 'ae': 'æ', 'ah': 'ʌ', 'ao': 'ɔː', 'ar': 'eə',
    'aw': 'aʊ', 'ax': 'ə', 'ay': 'aɪ', 'eh': 'e', 'er': 'ɜː',
    'ey': 'eɪ', 'ih': 'ɪ', 'ir': 'ɪə', 'iy': 'iː', 'oo': 'ɒ',
    'ow': 'əʊ', 'oy': 'ɒɪ', 'uh': 'ʊ', 'uw': 'uː', 'ur': 'ʊə',
    'b': 'b', 'ch': 'tʃ', 'd': 'd', 'dh': 'ð', 'f': 'f',
    'g': 'g', 'hh': 'h', 'jh': 'dʒ', 'k': 'k', 'l': 'l',
    'm': 'm', 'n': 'n', 'ng': 'ŋ', 'p': 'p', 'r': 'r',
    's': 's', 'sh': 'ʃ', 't': 't', 'th': 'θ', 'v': 'v',
    'w': 'w', 'y': 'j', 'z': 'z', 'zh': 'ʒ',
    'dr': 'dr', 'dz': 'dz', 'tr': 'tr', 'ts': 'ts'
  };

  function getWordIPA(word) {
    if (!word.syllables || word.syllables.length === 0) return '';
    let ipa = '';
    word.syllables.forEach(syl => {
      if (!syl.phones || syl.phones.length === 0) return;
      let sylIpa = syl.phones.map(phone => {
        if (!phone.content || phone.content === 'sil' || phone.content === 'fil') return '';
        const raw = phone.content.toLowerCase();
        return PHONEME_MAP[raw] || phone.content;
      }).join('');
      if (sylIpa) {
        if (syl.syllAccent === '1') ipa += 'ˈ' + sylIpa;
        else if (syl.syllAccent === '2') ipa += 'ˌ' + sylIpa;
        else ipa += sylIpa;
      }
    });
    return ipa ? `/${ipa}/` : '';
  }

  function renderWordCard(word) {
    const hasError = word.totalScore === 0 || (word.dpMessage && word.dpMessage !== '0');
    const diagnostics = getWordDiagnostics(word);
    const ipa = getWordIPA(word);
    let html = `<div class="word-card ${hasError ? 'has-error' : ''}">`;
    html += `<div class="word-header"><div class="word-content">${word.content || ''}${ipa ? `<div class="word-ipa">${ipa}</div>` : ''}</div>`;
    const ws = word.totalScore !== null && word.totalScore !== undefined ? word.totalScore : '--';
    html += `<div class="word-score ${ws !== '--' && ws < 60 ? 'low' : ''}">${ws}分</div></div>`;
    if (diagnostics.length > 0) {
      html += `<div class="word-diagnostics">${diagnostics.map(d => `<span class="diagnostic-tag">${d}</span>`).join('')}</div>`;
    }
    if (word.syllables && word.syllables.length > 0) {
      html += `<div class="phones-list">`;
      word.syllables.forEach(syl => {
        if (syl.phones && syl.phones.length > 0) {
          syl.phones.forEach(phone => {
            const gwpp = parseFloat(phone.gwpp) || 0;
            let level = 'good';
            if (gwpp < -2.5) level = 'bad';
            else if (gwpp < -1.0) level = 'medium';
            const raw = (phone.content || '').toLowerCase();
            const display = PHONEME_MAP[raw] || phone.content || '';
            html += `<span class="phone-chip ${level}" title="gwpp: ${gwpp.toFixed(2)}">${display}</span>`;
          });
        }
      });
      html += `</div>`;
    }
    html += `</div>`;
    return html;
  }

  function getWordDiagnostics(word) {
    const diagnostics = [];
    if (word.dpMessage && word.dpMessage !== '0') {
      const dpLabels = { '16': '漏读', '32': '增读', '64': '回读', '128': '替换' };
      diagnostics.push(dpLabels[word.dpMessage] || `异常(${word.dpMessage})`);
    }
    if (word.werrMsg && word.werrMsg !== '0') {
      const werrBits = { '256': '意群停顿未停', '512': '连读未连', '2048': '该重读未重', '4096': '句末升降调错' };
      const n = parseInt(word.werrMsg) || 0;
      for (const [bit, label] of Object.entries(werrBits)) {
        if ((n & parseInt(bit)) !== 0) diagnostics.push(label);
      }
    }
    return diagnostics;
  }

  function updateStatus(state) {
    const badge = document.getElementById('statusBadge');
    const text = document.getElementById('statusText');
    const viz = document.getElementById('audioVisualizer');
    if (!badge || !text) return;

    badge.className = 'status-badge';
    let icon = '💡', label = '准备就绪';
    switch (state) {
      case 'connecting': icon = '🔗'; label = '连接中...'; break;
      case 'recording':
        icon = '🎤'; label = '正在录音...';
        badge.classList.add('recording');
        if (viz) viz.classList.add('active');
        break;
      case 'scoring':
        icon = '⏳'; label = '评分中...';
        badge.classList.add('scoring');
        if (viz) viz.classList.remove('active');
        break;
      case 'done':
        icon = '✅'; label = '评测完成';
        badge.classList.add('done');
        if (viz) viz.classList.remove('active');
        break;
      case 'error':
        icon = '❌'; label = '评测出错';
        badge.classList.add('error');
        if (viz) viz.classList.remove('active');
        break;
    }
    badge.innerHTML = `<span>${icon}</span><span>${label}</span>`;
  }

  function updateButtons(state) {
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    if (startBtn) startBtn.disabled = state !== 'idle';
    if (stopBtn) stopBtn.disabled = state !== 'recording';
    if (cancelBtn) cancelBtn.disabled = state === 'idle' || state === 'done' || state === 'error';
  }

  window.selectSentence = function(idx) {
    if (window.QuizEngine && window.QuizEngine.getState() === 'recording') return;
    if (window.QuizEngine && window.QuizEngine.getState() === 'scoring') return;
    currentIdx = idx;
    renderSentenceList();
    renderEvalArea();
  };

  window.handleStart = async function() {
    if (currentIdx < 0) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      stream.getTracks().forEach(track => track.stop());
    } catch (err) {
      alert('无法访问麦克风，请检查麦克风权限设置');
      return;
    }
    const sentence = SENTENCES[currentIdx];
    window.QuizEngine.start({ promptText: sentence });
  };

  window.handleStop = function() {
    window.QuizEngine.stop();
  };

  window.handleCancel = function() {
    window.QuizEngine.cancel();
  };

  window.QuizEngine.on('state', function(state) {
    updateButtons(state);
    updateStatus(state);
  });

  window.QuizEngine.on('result', function(result) {
    if (currentIdx < 0) return;
    const paper = result.paper;
    const percentPaper = {
      totalScore: toPercentScore(paper.totalScore),
      accuracyScore: toPercentScore(paper.accuracyScore),
      standardScore: toPercentScore(paper.standardScore),
      fluencyScore: toPercentScore(paper.fluencyScore),
      integrityScore: toPercentScore(paper.integrityScore),
      words: (result.sentences && result.sentences.length > 0) ? result.sentences.flatMap(s => s.words || []).map(w => ({
        ...w,
        totalScore: toPercentScore(w.totalScore),
        syllables: (w.syllables || []).map(syl => ({
          ...syl,
          syllScore: toPercentScore(syl.syllScore)
        }))
      })) : []
    };
    scoreStore[currentIdx] = percentPaper;
    renderSentenceList();
    const resultsArea = document.getElementById('resultsArea');
    if (resultsArea) resultsArea.innerHTML = renderResults(percentPaper);
    submitResults();
  });

  window.QuizEngine.on('error', function(error) {
    const resultsArea = document.getElementById('resultsArea');
    if (resultsArea) {
      resultsArea.innerHTML = `<div class="error-message"><h3>评测失败</h3><p>${error.message || '未知错误'}</p></div>`;
    }
  });

  window.QuizEngine.on('rejected', function() {
    const resultsArea = document.getElementById('resultsArea');
    if (resultsArea) {
      resultsArea.innerHTML = `<div class="error-message"><h3>评测被拒绝</h3><p>引擎无法识别，请重试</p></div>`;
    }
  });

  window.QuizEngine.on('except', function(data) {
    const exceptLabels = {
      '28673': '无语音或音量过小',
      '28676': '乱说',
      '28680': '信噪比低',
      '28689': '无音频输入',
      '28690': '音量过大'
    };
    const resultsArea = document.getElementById('resultsArea');
    if (resultsArea) {
      resultsArea.innerHTML = `<div class="error-message"><h3>评测异常</h3><p>${exceptLabels[data.code] || data.label || '未知异常'}</p></div>`;
    }
  });

  renderSentenceList();
  renderEvalArea();
})();
</script>
</body>
</html>
