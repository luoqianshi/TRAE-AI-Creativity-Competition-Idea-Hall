<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择支付方式 - MBTI测试</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #8A4D9E 0%, #F26B5C 100%);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        
        .payment-container {
            max-width: 400px;
            margin: 0 auto;
        }
        
        .payment-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .payment-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(45deg, #FFE5B4, #F8BBD9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .payment-subtitle {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .product-info {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .product-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .product-desc {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 15px;
        }
        
        .product-price {
            font-size: 32px;
            font-weight: 700;
            color: #FFE5B4;
            text-align: center;
        }
        
        .payment-methods {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
        }
        
        .methods-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .payment-method {
            display: flex;
            align-items: center;
            padding: 20px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid transparent;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .payment-method:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .payment-method.selected {
            background: rgba(255, 255, 255, 0.2);
            border-color: #FFE5B4;
        }
        
        .method-icon {
            width: 50px;
            height: 50px;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
        }
        
        .method-info {
            flex: 1;
        }
        
        .method-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .method-desc {
            font-size: 14px;
            opacity: 0.8;
        }
        
        .method-radio {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .payment-method.selected .method-radio {
            border-color: #FFE5B4;
            background: #FFE5B4;
        }
        
        .method-radio::after {
            content: '';
            width: 10px;
            height: 10px;
            background: transparent;
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        
        .payment-method.selected .method-radio::after {
            background: #8A4D9E;
        }
        
        .pay-button {
            background: linear-gradient(45deg, #FF6B6B, #FF8E53);
            border: none;
            color: white;
            font-size: 18px;
            font-weight: 600;
            padding: 15px 40px;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            margin: 20px 0;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(255, 107, 107, 0.3);
        }
        
        .pay-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(255, 107, 107, 0.4);
        }
        
        .pay-button:active {
            transform: translateY(0);
        }
        
        .pay-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .back-button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 14px;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        
        .back-button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }
            
            .payment-title {
                font-size: 24px;
            }
            
            .product-price {
                font-size: 28px;
            }
            
            .payment-method {
                padding: 15px;
            }
            
            .method-icon {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="payment-container">
        <div class="payment-header">
            <h1 class="payment-title">选择支付方式</h1>
            <p class="payment-subtitle">请选择您偏好的支付方式</p>
        </div>
        
        <div class="product-info">
            <div class="product-name">MBTI完整报告</div>
            <div class="product-desc">解锁10个深度分析模块，包含职业建议、爱情指导等</div>
            <div class="product-price">¥29.8</div>
        </div>
        
        <div class="payment-methods">
            <h3 class="methods-title">支付方式</h3>
            
            <div class="payment-method" data-method="wechat">
                <div class="method-icon">💚</div>
                <div class="method-info">
                    <div class="method-name">微信支付</div>
                    <div class="method-desc">使用微信扫码支付</div>
                </div>
                <div class="method-radio"></div>
            </div>
            
            <div class="payment-method" data-method="alipay">
                <div class="method-icon">💙</div>
                <div class="method-info">
                    <div class="method-name">支付宝</div>
                    <div class="method-desc">使用支付宝扫码支付</div>
                </div>
                <div class="method-radio"></div>
            </div>
        </div>
        
        <button class="pay-button" id="payButton" disabled onclick="processPayment()">
            确认支付 ¥29.8
        </button>
        
        <button class="back-button" onclick="goBack()">
            返回结果页面
        </button>
    </div>
    
    <script>
        let selectedPaymentMethod = null;
        
        // 初始化支付方式选择
        document.addEventListener('DOMContentLoaded', function() {
            initPaymentMethodSelection();
        });
        
        function initPaymentMethodSelection() {
            const paymentMethods = document.querySelectorAll('.payment-method');
            
            paymentMethods.forEach(method => {
                method.addEventListener('click', function() {
                    // 移除所有选中状态
                    paymentMethods.forEach(m => m.classList.remove('selected'));
                    
                    // 添加选中状态
                    this.classList.add('selected');
                    selectedPaymentMethod = this.dataset.method;
                    
                    // 启用支付按钮
                    const payButton = document.getElementById('payButton');
                    payButton.disabled = false;
                    payButton.textContent = `确认支付 ¥29.8`;
                });
            });
        }
        
        function processPayment() {
            if (!selectedPaymentMethod) {
                alert('请选择支付方式');
                return;
            }
            
            // 显示加载状态
            const payButton = document.getElementById('payButton');
            payButton.disabled = true;
            payButton.innerHTML = `
                <span class="loading-spinner"></span>
                正在跳转支付...
            `;
            
            // 添加加载动画样式
            const style = document.createElement('style');
            style.textContent = `
                .loading-spinner {
                    display: inline-block;
                    width: 16px;
                    height: 16px;
                    border: 2px solid rgba(255, 255, 255, 0.3);
                    border-radius: 50%;
                    border-top-color: white;
                    animation: spin 1s ease-in-out infinite;
                    margin-right: 8px;
                }
                
                @keyframes spin {
                    to { transform: rotate(360deg); }
                }
            `;
            document.head.appendChild(style);
            
            // 跳转到支付处理页面
            setTimeout(() => {
                window.location.href = `payment-processing.html?method=${selectedPaymentMethod}`;
            }, 1000);
        }
        
        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
