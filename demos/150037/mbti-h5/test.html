<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI十六人格测试 | 在线测试</title>
    <meta name="description" content="MBTI十六人格在线测试页面，基于荣格心理学理论的专业性格分析">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/test.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="test-page">
    <!-- 顶部导航 -->
    <header class="test-header">
        <div class="container">
            <div class="header-content">
                <button class="back-btn" onclick="goBack()">
                    <svg width="20" height="20" viewBox="0 0 20 20" class="back-icon">
                        <path d="M12 4l-6 6 6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    返回
                </button>
                <h1 class="test-title">MBTI人格测试</h1>
                <div class="progress-info">
                    <span id="currentQuestion">1</span> / <span id="totalQuestions">10</span>
                </div>
            </div>
        </div>
    </header>

    <!-- 进度条 -->
    <div class="progress-container">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <!-- 测试内容 -->
    <main class="test-content">
        <div class="container">
            <!-- 题目容器 -->
            <div class="question-container" id="questionContainer">
                <!-- 题目将通过JavaScript动态加载 -->
            </div>

            <!-- 导航按钮 -->
            <div class="navigation">
                <button class="nav-btn prev-btn" id="prevBtn" onclick="previousQuestion()" disabled>
                    <svg width="16" height="16" viewBox="0 0 16 16" class="nav-icon">
                        <path d="M8 4l-4 4 4 4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    上一题
                </button>
                
                <button class="nav-btn next-btn" id="nextBtn">
                    下一题
                    <svg width="16" height="16" viewBox="0 0 16 16" class="nav-icon">
                        <path d="M8 4l4 4-4 4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>

            <!-- 完成按钮 -->
            <div class="complete-section" id="completeSection" style="display: none;">
                <button class="complete-btn" onclick="submitTest()">
                    完成测试，查看结果
                </button>
            </div>
        </div>
    </main>

    <!-- 结果页面 -->
    <div class="results-page" id="resultsPage" style="display: none;">
        <div class="container">
            <div class="results-content">
                <div class="result-header">
                    <h2>您的MBTI人格类型</h2>
                    <div class="result-type" id="resultType">
                        <!-- 结果类型将通过JavaScript动态更新 -->
                    </div>
                </div>
                
                <div class="result-description" id="resultDescription">
                    <!-- 结果描述将通过JavaScript动态更新 -->
                </div>
                
                <div class="result-actions">
                    <button class="retest-btn" onclick="restartTest()">
                        重新测试
                    </button>
                    <button class="share-btn" onclick="shareResult()">
                        分享结果
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/test.js"></script>
</body>
</html>
