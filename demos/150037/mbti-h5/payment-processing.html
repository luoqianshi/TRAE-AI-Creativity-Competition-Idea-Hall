<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付处理中 - MBTI测试</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #8A4D9E 0%, #F26B5C 100%);
            min-height: 100vh;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .processing-container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        
        .processing-header {
            margin-bottom: 40px;
        }
        
        .processing-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }
        
        .processing-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #FFE5B4, #F8BBD9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .processing-subtitle {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 30px;
        }
        
        .payment-details {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            margin: 30px 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .payment-method {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .method-icon {
            width: 40px;
            height: 40px;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        
        .method-name {
            font-size: 18px;
            font-weight: 600;
        }
        
        .payment-amount {
            font-size: 36px;
            font-weight: 700;
            color: #FFE5B4;
            margin-bottom: 10px;
        }
        
        .payment-note {
            font-size: 14px;
            opacity: 0.8;
        }
        
        .loading-animation {
            margin: 30px 0;
        }
        
        .loading-dots {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        
        .loading-dot {
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: loadingDot 1.4s ease-in-out infinite;
        }
        
        .loading-dot:nth-child(1) { animation-delay: 0s; }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes loadingDot {
            0%, 80%, 100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        .status-message {
            font-size: 16px;
            margin: 20px 0;
            opacity: 0.9;
        }
        
        .progress-steps {
            margin: 30px 0;
        }
        
        .step {
            display: flex;
            align-items: center;
            margin: 15px 0;
            font-size: 14px;
        }
        
        .step-icon {
            width: 24px;
            height: 24px;
            margin-right: 15px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .step.completed .step-icon {
            background: #4CAF50;
            color: white;
        }
        
        .step.active .step-icon {
            background: #FFE5B4;
            color: #8A4D9E;
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        .step-text {
            opacity: 0.8;
        }
        
        .step.completed .step-text {
            opacity: 1;
        }
        
        .step.active .step-text {
            opacity: 1;
            font-weight: 600;
        }
        
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }
            
            .processing-title {
                font-size: 24px;
            }
            
            .payment-amount {
                font-size: 32px;
            }
            
            .processing-icon {
                width: 60px;
                height: 60px;
                font-size: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="processing-container">
        <div class="processing-header">
            <div class="processing-icon" id="paymentIcon">💳</div>
            <h1 class="processing-title">支付完成请等待</h1>
            <p class="processing-subtitle">正在验证支付并解锁您的专属报告</p>
        </div>
        
        <div class="payment-details">
            <div class="payment-method">
                <div class="method-icon" id="methodIcon">💚</div>
                <div class="method-name" id="methodName">微信支付</div>
            </div>
            <div class="payment-amount">¥29.8</div>
            <div class="payment-note">一次性付费，永久使用</div>
        </div>
        
        <div class="loading-animation">
            <div class="loading-dots">
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
            </div>
        </div>
        
        <div class="status-message" id="statusMessage">
            正在处理您的支付，请稍候...
        </div>
        
        <div class="progress-steps">
            <div class="step active" id="step1">
                <div class="step-icon">1</div>
                <div class="step-text">验证支付信息</div>
            </div>
            <div class="step" id="step2">
                <div class="step-icon">2</div>
                <div class="step-text">解锁专属内容</div>
            </div>
            <div class="step" id="step3">
                <div class="step-icon">3</div>
                <div class="step-text">生成完整报告</div>
            </div>
        </div>
    </div>
    
    <script>
        // 获取URL参数
        const urlParams = new URLSearchParams(window.location.search);
        const paymentMethod = urlParams.get('method') || 'wechat';
        
        // 初始化支付信息显示
        document.addEventListener('DOMContentLoaded', function() {
            initPaymentMethodDisplay();
            startProcessingFlow();
        });
        
        function initPaymentMethodDisplay() {
            const methodIcon = document.getElementById('methodIcon');
            const methodName = document.getElementById('methodName');
            const paymentIcon = document.getElementById('paymentIcon');
            
            if (paymentMethod === 'wechat') {
                methodIcon.textContent = '💚';
                methodName.textContent = '微信支付';
                paymentIcon.textContent = '💳';
            } else if (paymentMethod === 'alipay') {
                methodIcon.textContent = '💙';
                methodName.textContent = '支付宝';
                paymentIcon.textContent = '💳';
            }
        }
        
        function startProcessingFlow() {
            // 步骤1: 验证支付信息 (0-3秒)
            setTimeout(() => {
                updateStep(1, 'completed', '✅ 支付验证成功');
                updateStep(2, 'active', '正在解锁专属内容...');
                document.getElementById('statusMessage').textContent = '支付验证成功，正在解锁您的专属内容...';
            }, 3000);
            
            // 步骤2: 解锁专属内容 (3-6秒)
            setTimeout(() => {
                updateStep(2, 'completed', '✅ 内容解锁成功');
                updateStep(3, 'active', '正在生成完整报告...');
                document.getElementById('statusMessage').textContent = '内容解锁成功，正在为您生成完整报告...';
            }, 6000);
            
            // 步骤3: 生成完整报告 (6-8秒)
            setTimeout(() => {
                updateStep(3, 'completed', '✅ 报告生成完成');
                document.getElementById('statusMessage').textContent = '支付完成！正在跳转到完整报告...';
                showSuccessAndRedirect();
            }, 8000);
        }
        
        function updateStep(stepNumber, status, text) {
            const step = document.getElementById(`step${stepNumber}`);
            const stepText = step.querySelector('.step-text');
            
            // 移除所有状态类
            step.classList.remove('completed', 'active');
            
            // 添加新状态类
            step.classList.add(status);
            
            // 更新文本
            stepText.textContent = text;
        }
        
        function showSuccessAndRedirect() {
            // 显示成功状态
            const processingIcon = document.getElementById('paymentIcon');
            const processingTitle = document.querySelector('.processing-title');
            const statusMessage = document.getElementById('statusMessage');
            
            processingIcon.textContent = '✅';
            processingTitle.textContent = '支付成功！';
            statusMessage.textContent = '您的专属MBTI完整报告已解锁！';
            
            // 延迟跳转到完整结果页面
            setTimeout(() => {
                window.location.href = 'complete-result.html';
            }, 2000);
        }
        
        // 防止页面刷新
        window.addEventListener('beforeunload', function(e) {
            e.preventDefault();
            e.returnValue = '支付正在处理中，确定要离开吗？';
        });
    </script>
</body>
</html>
