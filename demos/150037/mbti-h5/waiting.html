<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专属测试报告生成中... - MBTI十六人格测试</title>
    <meta name="description" content="MBTI测试报告正在生成中，请稍候">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/waiting.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="waiting-page">
    <!-- 移动端浏览器头部 -->
    <header class="mobile-header">
        <div class="container">
            <div class="header-content">
                <button class="back-btn" onclick="goBack()">
                    <svg width="20" height="20" viewBox="0 0 20 20" class="back-icon">
                        <path d="M12 4l-6 6 6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    返回
                </button>
                <h1 class="page-title">测试报告</h1>
            </div>
        </div>
    </header>

    <!-- 主要内容区域 -->
    <main class="waiting-content">
        <div class="container">
            <!-- 英雄插图区域 -->
            <section class="hero-section">
                <div class="hero-image">
                    <img src="images/waiting_hero.jpg" alt="分析师在工作场景" class="hero-img">
                </div>
            </section>

            <!-- 主标题 -->
            <section class="title-section">
                <h2 class="main-title">
                    专属测试报告生成中
                    <span class="dots" id="dots">...</span>
                </h2>
                <p class="subtitle">请稍候，我们正在为您的测试报告生成</p>
            </section>

            <!-- 进度卡片区域 -->
            <section class="progress-section">
                <!-- 三个标签 -->
                <div class="tags">
                    <div class="tag" id="tag1">
                        <span class="tag-icon">👤</span>
                        <span class="tag-text">性格类型</span>
                    </div>
                    <div class="tag" id="tag2">
                        <span class="tag-icon">❤️</span>
                        <span class="tag-text">爱情分析</span>
                    </div>
                    <div class="tag" id="tag3">
                        <span class="tag-icon">💼</span>
                        <span class="tag-text">职业性格</span>
                    </div>
                </div>

                <!-- 具体进度条列表 -->
                <div class="progress-list">
                    <div class="progress-item" id="progress1">
                        <div class="progress-icon">
                            <svg width="20" height="20" viewBox="0 0 20 20" class="icon">
                                <circle cx="10" cy="10" r="8" stroke="#8a6d9e" stroke-width="2" fill="none"/>
                                <path d="M10 4v6l4 2" stroke="#8a6d9e" stroke-width="2" fill="none" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <span class="progress-text">正在生成十六人格测试维度计分</span>
                        <div class="progress-bar">
                            <div class="progress-fill" id="fill1"></div>
                        </div>
                    </div>

                    <div class="progress-item" id="progress2">
                        <div class="progress-icon">
                            <svg width="20" height="20" viewBox="0 0 20 20" class="icon">
                                <circle cx="10" cy="10" r="8" stroke="#8a6d9e" stroke-width="2" fill="none"/>
                                <path d="M10 4v6l4 2" stroke="#8a6d9e" stroke-width="2" fill="none" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <span class="progress-text">正在生成MBTI十六性格类型</span>
                        <div class="progress-bar">
                            <div class="progress-fill" id="fill2"></div>
                        </div>
                    </div>

                    <div class="progress-item" id="progress3">
                        <div class="progress-icon">
                            <svg width="20" height="20" viewBox="0 0 20 20" class="icon">
                                <circle cx="10" cy="10" r="8" stroke="#8a6d9e" stroke-width="2" fill="none"/>
                                <path d="M10 4v6l4 2" stroke="#8a6d9e" stroke-width="2" fill="none" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <span class="progress-text">正在生成对应特点、行为风格</span>
                        <div class="progress-bar">
                            <div class="progress-fill" id="fill3"></div>
                        </div>
                    </div>

                    <div class="progress-item" id="progress4">
                        <div class="progress-icon">
                            <svg width="20" height="20" viewBox="0 0 20 20" class="icon">
                                <circle cx="10" cy="10" r="8" stroke="#8a6d9e" stroke-width="2" fill="none"/>
                                <path d="M10 4v6l4 2" stroke="#8a6d9e" stroke-width="2" fill="none" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <span class="progress-text">正在生成性格优势和提升空间</span>
                        <div class="progress-bar">
                            <div class="progress-fill" id="fill4"></div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- 底部场景插图 -->
    <section class="bottom-scenes">
        <div class="scenes-image">
            <img src="images/waiting_scenes.jpg" alt="不同性格类型的人物场景" class="scenes-img">
        </div>
    </section>

    <script src="js/waiting.js"></script>
</body>
</html>
