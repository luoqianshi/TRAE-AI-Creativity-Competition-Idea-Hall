<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解锁完整报告 - MBTI测试</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #8A4D9E 0%, #F26B5C 100%);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        
        .pay-container {
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
        }
        
        .pay-header {
            margin-bottom: 40px;
        }
        
        .pay-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(45deg, #FFE5B4, #F8BBD9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .pay-subtitle {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .price-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            margin: 30px 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .price {
            font-size: 48px;
            font-weight: 700;
            color: #FFE5B4;
            margin-bottom: 10px;
        }
        
        .price-note {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 20px;
        }
        
        .pay-features {
            text-align: left;
            margin: 20px 0;
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            margin: 10px 0;
            font-size: 16px;
        }
        
        .feature-icon {
            margin-right: 12px;
            font-size: 18px;
        }
        
        .pay-btn {
            background: linear-gradient(45deg, #FF6B6B, #FF8E53);
            border: none;
            color: white;
            font-size: 18px;
            font-weight: 600;
            padding: 15px 40px;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            margin: 20px 0;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(255, 107, 107, 0.3);
        }
        
        .pay-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(255, 107, 107, 0.4);
        }
        
        .pay-btn:active {
            transform: translateY(0);
        }
        
        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 14px;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
        }
        
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .coming-soon {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            font-size: 14px;
            opacity: 0.8;
        }
        
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }
            
            .pay-title {
                font-size: 24px;
            }
            
            .price {
                font-size: 40px;
            }
            
            .price-card {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="pay-container">
        <div class="pay-header">
            <h1 class="pay-title">解锁完整报告</h1>
            <p class="pay-subtitle">解锁您的专属MBTI人格分析报告</p>
        </div>
        
        <div class="price-card">
            <div class="price">¥29.8</div>
            <div class="price-note">一次性付费，永久使用</div>
            
            <div class="pay-features">
                <div class="feature-item">
                    <span class="feature-icon">✅</span>
                    <span>10个深度分析模块</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">✅</span>
                    <span>个性化职业建议</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">✅</span>
                    <span>详细爱情指导</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">✅</span>
                    <span>性格提升方案</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">✅</span>
                    <span>专属PDF报告</span>
                </div>
            </div>
            
            <button class="pay-btn" onclick="showComingSoon()">立即解锁</button>
            
            <div class="coming-soon">
                💳 支付系统开发中，敬请期待
            </div>
            
            <button class="back-btn" onclick="goBack()">返回结果页面</button>
        </div>
    </div>
    
    <script>
        function showComingSoon() {
            alert('支付系统开发中，敬请期待！\n\n您可以：\n• 截图保存当前结果\n• 关注我们获取更多资讯\n• 稍后再试');
        }
        
        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
