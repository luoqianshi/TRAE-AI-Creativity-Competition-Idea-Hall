  </div>
  <div class="status" id="clockDisplay">系统运行中 · Day 0</div>
</nav>

<div class="main-layout">

  <!-- Left: Fridge Interior -->
  <div class="fridge-view">
    <div class="view-header">
      <h2>冰箱内部视图</h2>
      <span class="badge badge-safe" id="fridgeStatusBadge">运行正常</span>
    </div>

    <div class="time-control">
      <button class="time-btn" onclick="advanceDays(-1)">-1天</button>
      <button class="time-btn" onclick="advanceDays(1)">+1天</button>
      <button class="time-btn" onclick="advanceDays(3)">+3天</button>
      <button class="time-btn" onclick="advanceDays(7)">+7天</button>
      <span class="time-display" id="dayDisplay">模拟时间: 第 0 天</span>
    </div>

    <div class="fridge-body" id="fridgeBody">
      <div class="laser-flash" id="laserFlash"></div>

      <!-- Laser Module -->
      <div class="laser-module">
        <div class="laser-housing">
          <div class="laser-dot" id="laserDot"></div>
          <div class="laser-dot"></div>
        </div>
        <div class="laser-beam" id="laserBeam"></div>
        <div class="laser-label">LASER MODULE</div>
      </div>

      <!-- Shelf 1 -->
      <div class="shelf" id="shelf-1">
        <span class="shelf-label">冷藏层 1 · 乳制品</span>
      </div>

      <!-- Shelf 2 -->
      <div class="shelf" id="shelf-2">
        <span class="shelf-label">冷藏层 2 · 肉类/蛋类</span>
      </div>

      <!-- Shelf 3 -->
      <div class="shelf" id="shelf-3">
        <span class="shelf-label">冷藏层 3 · 蔬菜水果</span>

      <!-- Shelf 4 -->
      <div class="shelf" id="shelf-4">
        <span class="shelf-label">冷藏层 4 · 饮品/调料</span>
      </div>
    </div>
  </div>

  <!-- Right: E-Ink Display -->

    <div class="eink-header">
      <h2>食材保鲜监控</h2>
      <div class="subtitle" id="einkDate">2026-06-23 08:00</div>
    </div>

    <div class="eink-stats">
      <div class="stat-card stat-safe">
        <div class="num" id="statSafe">0</div>
        <div class="label">安全</div>
      </div>
      <div class="stat-card stat-warn">
        <div class="num" id="statWarn">0</div>
        <div class="label">临期</div>
      </div>
      <div class="stat-card stat-danger">
        <div class="num" id="statDanger">0</div>
        <div class="label">过期</div>
      </div>
    </div>

    <div class="eink-list" id="einkList">

    </div>

      Fridge Laser Labeler v1.0 · TRAE Work Prototype

        <div class="opt-name">牛奶</div>
      </div>

        <div class="opt-name">鸡蛋</div>
      </div>

      </div>

      </div>
    </div>
    <div class="shelf-selector">
      <label>放置层架</label>
      <select id="shelfSelect">
        <option value="1">冷藏层 1 · 乳制品</option>
        <option value="2">冷藏层 2 · 肉类/蛋类</option>
        <option value="3">冷藏层 3 · 蔬菜水果</option>
        <option value="4">冷藏层 4 · 饮品/调料</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="confirmAddFood()">确认放入</button>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script>
(function() {
  // ===== Data =====
  var foodDB = {
    milk:    { emoji: '🥛', name: '鲜牛奶', shelf: 7 },
    egg:     { emoji: '🥚', name: '鸡蛋', shelf: 21 },
    steak:   { emoji: '🥩', name: '牛排', shelf: 4 },
    chicken: { emoji: '🍗', name: '鸡肉', shelf: 3 },
    spinach: { emoji: '🥬', name: '菠菜', shelf: 5 },
    apple:   { emoji: '🍎', name: '苹果', shelf: 14 },
    yogurt:  { emoji: '🫙', name: '酸奶', shelf: 14 },
    juice:   { emoji: '🧃', name: '果汁', shelf: 10 }
  };

  var foodItems = [];
  var nextId = 1;
  var currentDay = 0;
  var selectedFoodType = null;

  // ===== Init with sample data =====
  function init() {
    addFoodDirect('milk', 1);
    addFoodDirect('egg', 2);
    addFoodDirect('steak', 2);
    addFoodDirect('spinach', 3);
    addFoodDirect('apple', 3);
    addFoodDirect('yogurt', 1);
    addFoodDirect('juice', 4);
    renderAll();
  }

  function addFoodDirect(type, shelfNum) {
    var info = foodDB[type];
    foodItems.push({
      id: nextId++,
      type: type,
      emoji: info.emoji,
      name: info.name,
      shelf: shelfNum,
      addedDay: currentDay,
      expiryDays: info.shelf,
      expiryDay: currentDay + info.shelf
    });
  }

  // ===== Rendering =====
  function renderAll() {
    renderShelves();
    renderEinkList();
    renderStats();
    updateClock();
  }

  function getRemaining(item) {
    return item.expiryDay - currentDay;
  }

  function getStatus(item) {
    var rem = getRemaining(item);
    if (rem <= 0) return 'danger';
    if (rem <= 3) return 'warn';
    return 'safe';
  }

  function renderShelves() {
    for (var s = 1; s <= 4; s++) {
      var shelfEl = document.getElementById('shelf-' + s);
      var items = foodItems.filter(function(f) { return f.shelf === s; });
      var html = '<span class="shelf-label">' + shelfEl.querySelector('.shelf-label').textContent + '</span>';

      if (items.length === 0) {
        html += '<div class="empty-shelf">空层架 · 点击下方 + 添加食材</div>';
      } else {
        items.forEach(function(item) {
          var status = getStatus(item);
          var rem = getRemaining(item);
          var tagText = rem <= 0 ? '☠ 过期' : '剩' + rem + '天';
          var tagClass = 'tag-' + status;
          html += '<div class="food-item" data-id="' + item.id + '" onclick="selectFridgeItem(' + item.id + ')">';
          html += '<button class="remove-btn" onclick="event.stopPropagation();removeFood(' + item.id + ')">x</button>';
          html += '<span class="emoji">' + item.emoji + '</span>';
          html += '<div class="name">' + item.name + '</div>';
          html += '<span class="tag ' + tagClass + '">' + tagText + '</span>';
          html += '</div>';
        });
      }

      // Add button on shelf 1 only (or any shelf)
      html += '<div class="add-food-btn" onclick="openModal(' + s + ')">';
      html += '<span class="plus">+</span>';
      html += '<span>添加</span>';
      html += '</div>';

      shelfEl.innerHTML = html;
    }
  }

  function renderEinkList() {
    var listEl = document.getElementById('einkList');
    var sorted = foodItems.slice().sort(function(a, b) { return getRemaining(a) - getRemaining(b); });

    if (sorted.length === 0) {
      listEl.innerHTML = '<div style="text-align:center;padding:2rem;color:#94a3b8;font-size:0.8rem;">冰箱为空<br>请添加食材</div>';
      return;
    }

    var html = '';
    sorted.forEach(function(item) {
      var status = getStatus(item);
      var rem = getRemaining(item);
      var countdownText = rem <= 0 ? '已过期' : '剩余';
      var countdownNum = rem <= 0 ? '☠' + Math.abs(rem) + '天' : rem + '天';
      var dateStr = formatDate(item.addedDay) + ' 放入';

      html += '<div class="eink-item status-' + status + '" onclick="selectFridgeItem(' + item.id + ')">';
      html += '<span class="item-emoji">' + item.emoji + '</span>';
      html += '<div class="item-info">';
      html += '<div class="item-name">' + item.name + '</div>';
      html += '<div class="item-date">' + dateStr + ' · 保质' + item.expiryDays + '天</div>';
      html += '</div>';
      html += '<div class="item-countdown">';
      html += '<div class="countdown-num">' + countdownNum + '</div>';
      html += '<div class="countdown-text">' + countdownText + '</div>';
      html += '</div>';
      html += '</div>';
    });

    listEl.innerHTML = html;
  }

  function renderStats() {
    var safe = 0, warn = 0, danger = 0;
    foodItems.forEach(function(item) {
      var s = getStatus(item);
      if (s === 'safe') safe++;
      else if (s === 'warn') warn++;
      else danger++;
    });
    document.getElementById('statSafe').textContent = safe;
    document.getElementById('statWarn').textContent = warn;
    document.getElementById('statDanger').textContent = danger;

    var badge = document.getElementById('fridgeStatusBadge');
    if (danger > 0) {
      badge.textContent = danger + ' 件过期';
      badge.className = 'badge badge-danger';
    } else if (warn > 0) {
      badge.textContent = warn + ' 件临期';
      badge.className = 'badge badge-warn';
    } else {
      badge.textContent = '运行正常';
      badge.className = 'badge badge-safe';
    }
  }

  function updateClock() {
    var baseDate = new Date(2026, 5, 23);
    var simDate = new Date(baseDate.getTime() + currentDay * 86400000);
    var dateStr = simDate.getFullYear() + '-' +
      String(simDate.getMonth() + 1).padStart(2, '0') + '-' +
      String(simDate.getDate()).padStart(2, '0') + ' 08:00';
    document.getElementById('einkDate').textContent = dateStr;
    document.getElementById('clockDisplay').textContent = '系统运行中 · Day ' + currentDay;
    document.getElementById('dayDisplay').textContent = '模拟时间: 第 ' + currentDay + ' 天';
  }

  function formatDate(day) {
    var baseDate = new Date(2026, 5, 23);
    var d = new Date(baseDate.getTime() + day * 86400000);
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  // ===== Actions =====
  window.openModal = function(shelfNum) {
    document.getElementById('shelfSelect').value = shelfNum;
    selectedFoodType = null;
    document.querySelectorAll('.food-option').forEach(function(el) { el.classList.remove('selected'); });
    document.getElementById('addModal').classList.add('show');
  };

  window.closeModal = function() {
    document.getElementById('addModal').classList.remove('show');
  };

  window.selectFood = function(el) {
    document.querySelectorAll('.food-option').forEach(function(opt) { opt.classList.remove('selected'); });
    el.classList.add('selected');
    selectedFoodType = el.getAttribute('data-food');
  };

  window.confirmAddFood = function() {
    if (!selectedFoodType) {
      showToast('请先选择食材类型', '⚠️');
      return;
    }
    var shelfNum = parseInt(document.getElementById('shelfSelect').value);
    addFoodDirect(selectedFoodType, shelfNum);

    // Laser animation
    triggerLaser();

    var info = foodDB[selectedFoodType];
    showToast('激光打标完成！' + info.emoji + ' ' + info.name + ' 已标记，保质 ' + info.shelf + ' 天', '✅');

    closeModal();
    renderAll();
  };

  window.removeFood = function(id) {
    var item = foodItems.find(function(f) { return f.id === id; });
    foodItems = foodItems.filter(function(f) { return f.id !== id; });
    if (item) {
      showToast(item.emoji + ' ' + item.name + ' 已从冰箱移除', '🗑');
    }
    renderAll();
  };

  window.selectFridgeItem = function(id) {
    var item = foodItems.find(function(f) { return f.id === id; });
    if (!item) return;
    var rem = getRemaining(item);
    var status = getStatus(item);
    var statusText = rem <= 0 ? '已过期 ' + Math.abs(rem) + ' 天' : '剩余 ' + rem + ' 天';
    showToast(item.emoji + ' ' + item.name + ' · ' + statusText + ' · 保质期 ' + item.expiryDays + ' 天', status === 'danger' ? '☠️' : status === 'warn' ? '⚠️' : '✅');
  };

  window.advanceDays = function(days) {
    currentDay += days;
    if (currentDay < 0) currentDay = 0;

    // Check for newly expired items
    foodItems.forEach(function(item) {
      var rem = getRemaining(item);
      if (rem === 0 && days > 0) {
        setTimeout(function() {
          showToast(item.emoji + ' ' + item.name + ' 已过期！标签变为红色骷髅头', '☠️');
        }, 300);
      } else if (rem === 3 && days > 0) {
        setTimeout(function() {
          showToast(item.emoji + ' ' + item.name + ' 即将在3天后过期，墨水屏闪烁提醒中', '⚠️');
        }, 200);
      }
    });

    renderAll();
  };

  // ===== Laser Animation =====
  function triggerLaser() {
    var dot = document.getElementById('laserDot');
    var beam = document.getElementById('laserBeam');
    var flash = document.getElementById('laserFlash');

    dot.classList.add('active');
    beam.classList.add('active');
    flash.classList.add('active');

    setTimeout(function() {
      dot.classList.remove('active');
      beam.classList.remove('active');
      flash.classList.remove('active');
    }, 800);
  }

  // ===== Toast =====
  function showToast(msg, icon) {
    var container = document.getElementById('toastContainer');
    var toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = '<span class="toast-icon">' + icon + '</span><span>' + msg + '</span>';
    container.appendChild(toast);

    setTimeout(function() {
      toast.classList.add('toast-out');
      setTimeout(function() {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      }, 300);
    }, 3000);
  }

  // ===== Start =====
  init();
})();
</script>

</body>
</html>
