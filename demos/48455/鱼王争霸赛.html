<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鱼王争霸赛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(to bottom, #1a4d7a 0%, #0d2f4a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        #gameContainer {
            position: relative;
            border: 4px solid #4a9eff;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(74, 158, 255, 0.5);
            background: linear-gradient(to bottom, #0f4c75 0%, #1b262c 100%);
        }

        #gameCanvas {
            display: block;
            background: linear-gradient(to bottom, #0f4c75 0%, #1b262c 100%);
            border-radius: 6px;
        }

        #gameUI {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 30px;
            border-radius: 25px;
        }

        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            border-radius: 6px;
        }

        #gameOverScreen {
            display: none;
        }

        #startScreen h2, #gameOverScreen h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #4a9eff;
        }

        .control-info {
            background: rgba(74, 158, 255, 0.2);
            padding: 15px 25px;
            border-radius: 10px;
            margin: 10px 0;
            border: 2px solid #4a9eff;
        }

        .control-info h3 {
            color: #4a9eff;
            margin-bottom: 10px;
        }

        .control-info p {
            margin: 5px 0;
            font-size: 1.1em;
        }

        button {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 1.3em;
            background: #4a9eff;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        button:hover {
            background: #6db3ff;
            transform: scale(1.05);
        }

        #playerSelect {
            margin: 20px 0;
            font-size: 1.2em;
        }

        #playerSelect select {
            padding: 10px;
            font-size: 1em;
            margin-left: 10px;
            border-radius: 5px;
            border: 2px solid #4a9eff;
            background: rgba(255, 255, 255, 0.9);
        }

        .winner {
            font-size: 1.5em;
            color: #ffd700;
            margin: 20px 0;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .instructions {
            font-size: 0.9em;
            color: #ccc;
            margin-top: 20px;
            text-align: center;
            max-width: 500px;
        }
    </style>
</head>
<body>
    <h1>🐟 鱼王争霸赛 🐟</h1>
    
    <div id="gameContainer">
        <canvas id="gameCanvas" width="900" height="600"></canvas>
        
        <div id="gameUI">
            <div>总分: <span id="totalScore">0</span></div>
        </div>

        <div id="startScreen">
            <h2>欢迎来到鱼王争霸赛!</h2>
            
            <div id="playerSelect">
                <label for="playerCount">选择玩家人数: </label>
                <select id="playerCount">
                    <option value="1">1 人</option>
                    <option value="2">2 人</option>
                    <option value="3" selected>3 人</option>
                </select>
            </div>

            <div class="control-info">
                <h3>🎮 操作说明</h3>
                <p><strong style="color: #ff6b6b;">玩家1:</strong> W/A/S/D 控制移动</p>
                <p><strong style="color: #4ecdc4;">玩家2:</strong> 方向键 ↑/←/↓/→ 控制移动</p>
                <p><strong style="color: #ffe66d;">玩家3:</strong> I/J/K/L 控制移动</p>
            </div>

            <div class="control-info">
                <h3>📋 游戏规则</h3>
                <p>• 吃掉比你小的鱼可以变大并得分</p>
                <p>• 被比你大的鱼吃掉会被淘汰</p>
                <p>• 吃掉AI鱼或其他玩家都可以成长</p>
                <p>• 最后存活或得分最高者获胜!</p>
            </div>

            <button onclick="startGame()">开始游戏</button>

            <p class="instructions">提示: 游戏中按 ESC 暂停, 按 R 重新开始</p>
        </div>

        <div id="gameOverScreen">
            <h2>游戏结束!</h2>
            <div class="winner" id="winnerText"></div>
            <div id="finalScores"></div>
            <button onclick="restartGame()">再来一局</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 游戏状态
        let gameRunning = false;
        let gamePaused = false;
        let playerCount = 3;
        let players = [];
        let aiFishes = [];
        let bubbles = [];
        let animationId = null;

        // 玩家配置
        const playerConfigs = [
            { color: '#ff6b6b', name: '玩家1', keys: { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD' } },
            { color: '#4ecdc4', name: '玩家2', keys: { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' } },
            { color: '#ffe66d', name: '玩家3', keys: { up: 'KeyI', down: 'KeyK', left: 'KeyJ', right: 'KeyL' } }
        ];

        // 按键状态
        const keys = {};

        // 鱼类
        class Fish {
            constructor(x, y, size, color, isPlayer = false, playerIndex = -1, fishType = 'normal') {
                this.x = x;
                this.y = y;
                this.size = size;
                this.baseSpeed = isPlayer ? 3 : 0.8; // 降低AI速度
                this.speed = this.baseSpeed;
                this.color = color;
                this.isPlayer = isPlayer;
                this.playerIndex = playerIndex;
                this.score = 0;
                this.alive = true;
                this.direction = 1; // 1: 右, -1: 左
                this.vx = 0;
                this.vy = 0;
                this.tailAngle = 0;
                this.tailSpeed = 0.1; // 减慢尾巴摆动
                this.fishType = fishType;
                
                // AI属性
                if (!isPlayer) {
                    this.vx = (Math.random() - 0.5) * this.speed * 2;
                    this.vy = (Math.random() - 0.5) * this.speed * 2;
                    this.changeDirectionTimer = 0;
                    this.changeDirectionInterval = Math.random() * 200 + 100; // 更慢的方向改变
                }
            }

            update() {
                if (!this.alive) return;

                // 尾巴摆动
                this.tailAngle = Math.sin(Date.now() * this.tailSpeed * 0.01) * 0.3;

                if (this.isPlayer) {
                    this.handlePlayerInput();
                } else {
                    this.handleAI();
                }

                // 边界检测
                const margin = this.size * 12 + 20;
                if (this.x < margin) {
                    this.x = margin;
                    if (!this.isPlayer) this.vx *= -1;
                }
                if (this.x > canvas.width - margin) {
                    this.x = canvas.width - margin;
                    if (!this.isPlayer) this.vx *= -1;
                }
                if (this.y < margin) {
                    this.y = margin;
                    if (!this.isPlayer) this.vy *= -1;
                }
                if (this.y > canvas.height - margin) {
                    this.y = canvas.height - margin;
                    if (!this.isPlayer) this.vy *= -1;
                }

                // 更新方向
                if (this.vx !== 0) {
                    this.direction = this.vx > 0 ? 1 : -1;
                }
            }

            handlePlayerInput() {
                const config = playerConfigs[this.playerIndex];
                const acceleration = 0.3; // 降低加速度
                const maxSpeed = this.baseSpeed + this.size * 0.05; // 降低速度成长

                this.vx *= 0.95;
                this.vy *= 0.95;

                if (keys[config.keys.up]) {
                    this.vy -= acceleration;
                }
                if (keys[config.keys.down]) {
                    this.vy += acceleration;
                }
                if (keys[config.keys.left]) {
                    this.vx -= acceleration;
                }
                if (keys[config.keys.right]) {
                    this.vx += acceleration;
                }

                // 限制速度
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > maxSpeed) {
                    this.vx = (this.vx / speed) * maxSpeed;
                    this.vy = (this.vy / speed) * maxSpeed;
                }

                this.x += this.vx;
                this.y += this.vy;
            }

            handleAI() {
                this.changeDirectionTimer++;
                if (this.changeDirectionTimer > this.changeDirectionInterval) {
                    this.vx += (Math.random() - 0.5) * 0.5; // 降低方向变化幅度
                    this.vy += (Math.random() - 0.5) * 0.5;
                    this.changeDirectionTimer = 0;
                    this.changeDirectionInterval = Math.random() * 300 + 150; // 更慢的方向改变
                }

                // 限制速度
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                const maxSpeed = this.baseSpeed;
                if (speed > maxSpeed) {
                    this.vx = (this.vx / speed) * maxSpeed;
                    this.vy = (this.vy / speed) * maxSpeed;
                }

                // 躲避更大的玩家
                players.forEach(player => {
                    if (player.alive && player.size > this.size) {
                        const dx = this.x - player.x;
                        const dy = this.y - player.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 150) { // 减小躲避范围
                            this.vx += (dx / dist) * 0.2; // 降低躲避力度
                            this.vy += (dy / dist) * 0.2;
                        }
                    }
                });

                this.x += this.vx;
                this.y += this.vy;
            }

            draw() {
                if (!this.alive) return;

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.direction, 1);

                const s = this.size * 12; // 减小基础大小

                // 根据鱼类型绘制不同的鱼
                if (this.fishType === 'round') {
                    // 圆形小丑鱼
                    ctx.beginPath();
                    ctx.fillStyle = this.color;
                    ctx.ellipse(0, 0, s, s * 0.8, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 白色条纹
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = s * 0.15;
                    ctx.beginPath();
                    ctx.moveTo(-s * 0.3, -s * 0.6);
                    ctx.lineTo(-s * 0.3, s * 0.6);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(s * 0.2, -s * 0.6);
                    ctx.lineTo(s * 0.2, s * 0.6);
                    ctx.stroke();
                    
                    // 尾巴
                    ctx.save();
                    ctx.translate(-s * 0.9, 0);
                    ctx.rotate(this.tailAngle);
                    ctx.beginPath();
                    ctx.fillStyle = this.color;
                    ctx.moveTo(0, 0);
                    ctx.lineTo(-s * 0.5, -s * 0.35);
                    ctx.lineTo(-s * 0.5, s * 0.35);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                    
                } else if (this.fishType === 'puffer') {
                    // 河豚 - 圆滚滚的
                    ctx.beginPath();
                    ctx.fillStyle = this.color;
                    ctx.arc(0, 0, s * 1.1, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 小刺
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = 1;
                    for (let i = 0; i < 12; i++) {
                        const angle = (i / 12) * Math.PI * 2;
                        ctx.beginPath();
                        ctx.moveTo(Math.cos(angle) * s * 0.9, Math.sin(angle) * s * 0.9);
                        ctx.lineTo(Math.cos(angle) * s * 1.3, Math.sin(angle) * s * 1.3);
                        ctx.stroke();
                    }
                    
                    // 尾巴（很小）
                    ctx.save();
                    ctx.translate(-s * 1.0, 0);
                    ctx.rotate(this.tailAngle);
                    ctx.beginPath();
                    ctx.fillStyle = this.color;
                    ctx.moveTo(0, 0);
                    ctx.lineTo(-s * 0.3, -s * 0.2);
                    ctx.lineTo(-s * 0.3, s * 0.2);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                    
                } else if (this.fishType === 'goldfish') {
                    // 金鱼 - 大尾巴
                    ctx.beginPath();
                    ctx.fillStyle = this.color;
                    ctx.ellipse(0, 0, s * 0.8, s * 0.6, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 大尾巴
                    ctx.save();
                    ctx.translate(-s * 0.6, 0);
                    ctx.rotate(this.tailAngle);
                    ctx.beginPath();
                    ctx.fillStyle = this.color;
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(-s * 0.8, -s * 0.6, -s * 0.6, -s * 0.8);
                    ctx.quadraticCurveTo(-s * 0.4, 0, -s * 0.6, s * 0.8);
                    ctx.quadraticCurveTo(-s * 0.8, s * 0.6, 0, 0);
                    ctx.fill();
                    ctx.restore();
                    
                    // 头顶泡泡
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.beginPath();
                    ctx.arc(s * 0.1, -s * 0.5, s * 0.25, 0, Math.PI * 2);
                    ctx.fill();
                    
                } else if (this.fishType === 'shark') {
                    // 鲨鱼 - 大型鱼
                    ctx.beginPath();
                    ctx.fillStyle = this.color;
                    ctx.moveTo(s * 1.2, 0);
                    ctx.quadraticCurveTo(s * 0.5, -s * 0.7, -s * 0.8, -s * 0.3);
                    ctx.quadraticCurveTo(-s * 1.2, 0, -s * 0.8, s * 0.3);
                    ctx.quadraticCurveTo(s * 0.5, s * 0.7, s * 1.2, 0);
                    ctx.fill();
                    
                    // 背鳍
                    ctx.beginPath();
                    ctx.moveTo(0, -s * 0.5);
                    ctx.lineTo(-s * 0.3, -s * 1.0);
                    ctx.lineTo(-s * 0.5, -s * 0.5);
                    ctx.fill();
                    
                    // 尾巴
                    ctx.save();
                    ctx.translate(-s * 1.0, 0);
                    ctx.rotate(this.tailAngle);
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(-s * 0.6, -s * 0.4);
                    ctx.lineTo(-s * 0.3, 0);
                    ctx.lineTo(-s * 0.6, s * 0.4);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                    
                    // 凶猛的眼睛
                    ctx.fillStyle = '#ff0000';
                    ctx.beginPath();
                    ctx.arc(s * 0.6, -s * 0.15, s * 0.15, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(s * 0.65, -s * 0.15, s * 0.08, 0, Math.PI * 2);
                    ctx.fill();
                    
                } else if (this.fishType === 'butterfly') {
                    // 蝴蝶鱼 - 扁平
                    ctx.beginPath();
                    ctx.fillStyle = this.color;
                    ctx.ellipse(0, 0, s, s * 0.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 黑色条纹
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = s * 0.1;
                    ctx.beginPath();
                    ctx.moveTo(-s * 0.3, -s * 0.4);
                    ctx.lineTo(-s * 0.3, s * 0.4);
                    ctx.moveTo(s * 0.3, -s * 0.4);
                    ctx.lineTo(s * 0.3, s * 0.4);
                    ctx.stroke();
                    
                    // 尾巴
                    ctx.save();
                    ctx.translate(-s * 0.9, 0);
                    ctx.rotate(this.tailAngle);
                    ctx.beginPath();
                    ctx.fillStyle = this.color;
                    ctx.moveTo(0, 0);
                    ctx.lineTo(-s * 0.4, -s * 0.3);
                    ctx.lineTo(-s * 0.4, s * 0.3);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                    
                } else if (this.fishType === 'seahorse') {
                    // 海马 - 独特形状
                    ctx.beginPath();
                    ctx.fillStyle = this.color;
                    ctx.moveTo(0, -s * 1.2);
                    ctx.quadraticCurveTo(s * 0.8, -s * 1.0, s * 0.6, -s * 0.6);
                    ctx.quadraticCurveTo(s * 0.8, 0, s * 0.4, s * 0.3);
                    ctx.quadraticCurveTo(0, s * 0.8, -s * 0.4, s * 0.3);
                    ctx.quadraticCurveTo(-s * 0.6, 0, -s * 0.4, -s * 0.3);
                    ctx.quadraticCurveTo(0, -s * 0.8, 0, -s * 1.2);
                    ctx.fill();
                    
                    // 眼睛
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(s * 0.2, -s * 0.8, s * 0.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(s * 0.25, -s * 0.8, s * 0.1, 0, Math.PI * 2);
                    ctx.fill();
                    
                } else if (this.fishType === 'eel') {
                    // 鳗鱼 - 长条形
                    ctx.beginPath();
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = s * 0.6;
                    ctx.lineCap = 'round';
                    ctx.moveTo(-s * 1.5, 0);
                    ctx.quadraticCurveTo(-s * 0.5, Math.sin(this.tailAngle * 2) * s * 0.3, s * 0.5, 0);
                    ctx.stroke();
                    
                    // 头
                    ctx.beginPath();
                    ctx.fillStyle = this.color;
                    ctx.arc(s * 0.6, 0, s * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    
                } else {
                    // 普通鱼（默认）
                    // 鱼身主体
                    ctx.beginPath();
                    ctx.fillStyle = this.color;
                    ctx.ellipse(0, 0, s, s * 0.6, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // 尾巴
                    ctx.save();
                    ctx.translate(-s * 0.8, 0);
                    ctx.rotate(this.tailAngle);
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(-s * 0.6, -s * 0.4);
                    ctx.lineTo(-s * 0.6, s * 0.4);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();

                    // 背鳍
                    ctx.beginPath();
                    ctx.moveTo(-s * 0.2, -s * 0.5);
                    ctx.quadraticCurveTo(s * 0.2, -s * 0.9, s * 0.5, -s * 0.5);
                    ctx.fill();
                }

                // 所有鱼都画眼睛（除了海马和鳗鱼已经画过的）
                if (this.fishType !== 'seahorse' && this.fishType !== 'eel') {
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(s * 0.4, -s * 0.15, s * 0.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(s * 0.45, -s * 0.15, s * 0.1, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();

                // 玩家标识
                if (this.isPlayer) {
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 14px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`P${this.playerIndex + 1}`, this.x, this.y - s - 10);
                }
            }

            canEat(other) {
                if (!other.alive) return false;
                const dx = this.x - other.x;
                const dy = this.y - other.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const collisionDist = (this.size + other.size) * 10; // 减小碰撞距离
                return dist < collisionDist && this.size > other.size * 0.85; // 更严格的体型要求
            }
        }

        // 气泡类
        class Bubble {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 20;
                this.radius = Math.random() * 5 + 2;
                this.speed = Math.random() * 2 + 1;
                this.wobble = Math.random() * Math.PI * 2;
            }

            update() {
                this.y -= this.speed;
                this.wobble += 0.05;
                this.x += Math.sin(this.wobble) * 0.5;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.fill();
            }
        }

        // 初始化游戏
        function initGame() {
            players = [];
            aiFishes = [];
            bubbles = [];
            gameRunning = false;
            gamePaused = false;

            // 创建玩家
            for (let i = 0; i < playerCount; i++) {
                const x = 150 + i * 250;
                const y = canvas.height / 2;
                players.push(new Fish(x, y, 0.8, playerConfigs[i].color, true, i)); // 减小初始大小到0.8
            }

            // 创建AI鱼群
            spawnAIFishes(25); // 减少AI鱼数量

            // 创建气泡
            for (let i = 0; i < 20; i++) {
                const bubble = new Bubble();
                bubble.y = Math.random() * canvas.height;
                bubbles.push(bubble);
            }

            updateUI();
        }

        // 生成AI鱼群
        function spawnAIFishes(count) {
            // 多种鱼类型和颜色配置
            const fishTypes = [
                { type: 'normal', colors: ['#ff6b6b', '#4ecdc4', '#ffe66d', '#95e1d3', '#a8d8ea'] },
                { type: 'round', colors: ['#ff8c42', '#ffd166', '#06d6a0'] }, // 小丑鱼
                { type: 'puffer', colors: ['#b8e0d2', '#d6eadf', '#f0f3bd'] }, // 河豚
                { type: 'goldfish', colors: ['#ff9f1c', '#e71d36', '#2ec4b6'] }, // 金鱼
                { type: 'shark', colors: ['#6c757d', '#495057'] }, // 鲨鱼
                { type: 'butterfly', colors: ['#ffc300', '#f8f9fa', '#ff5733'] }, // 蝴蝶鱼
                { type: 'seahorse', colors: ['#ffd700', '#ff69b4', '#20b2aa'] }, // 海马
                { type: 'eel', colors: ['#708090', '#778899', '#b0c4de'] } // 鳗鱼
            ];
            
            for (let i = 0; i < count; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const size = Math.random() * 1.2 + 0.3; // 减小AI鱼大小范围
                
                // 随机选择鱼类型和颜色
                const typeConfig = fishTypes[Math.floor(Math.random() * fishTypes.length)];
                const color = typeConfig.colors[Math.floor(Math.random() * typeConfig.colors.length)];
                
                aiFishes.push(new Fish(x, y, size, color, false, -1, typeConfig.type));
            }
        }

        // 游戏主循环
        function gameLoop() {
            if (!gameRunning) return;

            if (!gamePaused) {
                update();
                draw();
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        // 更新游戏状态
        function update() {
            // 更新玩家
            players.forEach(player => player.update());

            // 更新AI鱼
            aiFishes.forEach(ai => ai.update());

            // 更新气泡
            bubbles.forEach(bubble => bubble.update());
            bubbles = bubbles.filter(b => b.y > -20);
            if (Math.random() < 0.05) {
                bubbles.push(new Bubble());
            }

            // 碰撞检测 - 玩家吃AI鱼（降低升级速度）
            players.forEach(player => {
                if (!player.alive) return;
                aiFishes.forEach((ai, index) => {
                    if (player.canEat(ai)) {
                        player.size += ai.size * 0.05; // 大幅降低成长速度
                        player.score += Math.floor(ai.size * 5); // 减少得分
                        aiFishes.splice(index, 1);
                        
                        // 补充新的AI鱼（降低补充频率）
                        if (Math.random() < 0.3) {
                            spawnAIFishes(1);
                        }
                    }
                });
            });

            // 玩家之间碰撞检测（降低升级速度）
            for (let i = 0; i < players.length; i++) {
                for (let j = i + 1; j < players.length; j++) {
                    const p1 = players[i];
                    const p2 = players[j];
                    
                    if (!p1.alive || !p2.alive) continue;

                    if (p1.canEat(p2)) {
                        p1.size += p2.size * 0.1; // 大幅降低成长速度
                        p1.score += Math.floor(p2.size * 10);
                        p2.alive = false;
                    } else if (p2.canEat(p1)) {
                        p2.size += p1.size * 0.1;
                        p2.score += Math.floor(p1.size * 10);
                        p1.alive = false;
                    }
                }
            }

            updateUI();
            checkGameOver();
        }

        // 绘制游戏画面
        function draw() {
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制背景
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0f4c75');
            gradient.addColorStop(1, '#1b262c');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制气泡
            bubbles.forEach(bubble => bubble.draw());

            // 绘制AI鱼
            aiFishes.forEach(ai => ai.draw());

            // 绘制玩家
            players.forEach(player => player.draw());
        }

        // 更新UI
        function updateUI() {
            // 计算所有存活玩家的总分
            const totalScore = players.reduce((sum, player) => sum + player.score, 0);
            document.getElementById('totalScore').textContent = totalScore;
        }

        // 检查游戏结束
        function checkGameOver() {
            const alivePlayers = players.filter(p => p.alive);
            
            // 单人模式：AI鱼太少时结束
            if (playerCount === 1 && aiFishes.length < 3) {
                endGame();
                return;
            }

            // 多人模式：只剩一个玩家或全部玩家死亡
            if (playerCount > 1 && alivePlayers.length <= 1) {
                endGame();
                return;
            }
        }

        // 游戏结束
        function endGame() {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            
            document.getElementById('gameOverScreen').style.display = 'flex';
            
            // 显示最终得分
            const sortedPlayers = [...players].sort((a, b) => b.score - a.score);
            let scoresHTML = '<div class="control-info"><h3>最终排名</h3>';
            sortedPlayers.forEach((player, index) => {
                const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : '🥉';
                scoresHTML += `<p>${medal} ${playerConfigs[player.playerIndex].name}: ${player.score}分 (大小: ${player.size.toFixed(1)})</p>`;
            });
            scoresHTML += '</div>';
            document.getElementById('finalScores').innerHTML = scoresHTML;
            
            const winner = sortedPlayers[0];
            document.getElementById('winnerText').textContent = `🏆 ${playerConfigs[winner.playerIndex].name} 获胜! 🏆`;
        }

        // 开始游戏
        function startGame() {
            playerCount = parseInt(document.getElementById('playerCount').value);
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameOverScreen').style.display = 'none';
            initGame();
            gameRunning = true;
            gameLoop();
        }

        // 重新开始游戏
        function restartGame() {
            document.getElementById('gameOverScreen').style.display = 'none';
            initGame();
            gameRunning = true;
            gameLoop();
        }

        // 键盘事件监听
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            
            if (e.code === 'Escape') {
                gamePaused = !gamePaused;
            }
            
            if (e.code === 'KeyR') {
                if (gameRunning) {
                    restartGame();
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // 初始化
        initGame();
    </script>
</body>
