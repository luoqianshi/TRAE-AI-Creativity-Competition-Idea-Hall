<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轻食智算 - AI减脂餐热量管控工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card-shadow { box-shadow: 0 2px 12px rgba(80,180,120,0.15); }
        .green-gradient { background: linear-gradient(135deg,#34d399,#10b981); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">
    <div class="max-w-3xl mx-auto">
        <!-- 头部标题 -->
        <div class="green-gradient text-white rounded-xl p-6 mb-6 card-shadow">
            <h1 class="text-2xl md:text-3xl font-bold">轻食智算 · AI减脂餐热量管控工具</h1>
            <p class="mt-2 opacity-90">自动计算基础代谢 | 食材热量统计 | AI智能配餐推荐</p>
        </div>

        <!-- 个人基础数据模块 -->
        <div class="bg-white rounded-xl p-6 mb-6 card-shadow">
            <h2 class="text-lg font-semibold text-emerald-700 mb-4">一、填写个人身体数据</h2>
            <div class="grid md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-gray-600 mb-1">性别</label>
                    <select id="gender" class="w-full border border-gray-200 rounded-lg p-2">
                        <option value="male">男</option>
                        <option value="female">女</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1">年龄(岁)</label>
                    <input type="number" id="age" placeholder="25" class="w-full border border-gray-200 rounded-lg p-2">
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1">身高(cm)</label>
                    <input type="number" id="height" placeholder="165" class="w-full border border-gray-200 rounded-lg p-2">
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1">当前体重(kg)</label>
                    <input type="number" id="weight" placeholder="58" class="w-full border border-gray-200 rounded-lg p-2">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm text-gray-600 mb-1">日常活动量</label>
                    <select id="activity" class="w-full border border-gray-200 rounded-lg p-2">
                        <option value="1.2">久坐办公（几乎无运动）</option>
                        <option value="1.375">轻度活动（每周1-3次轻运动）</option>
                        <option value="1.55">中度活动（每周3-5次运动）</option>
                        <option value="1.725">高强度活动（每周6-7次训练）</option>
                    </select>
                </div>
            </div>
            <button onclick="calcBaseCal()" class="w-full mt-4 green-gradient text-white py-2 rounded-lg font-medium">计算每日减脂推荐热量</button>
            <div id="baseResult" class="mt-4 hidden p-4 bg-emerald-50 rounded-lg"></div>
        </div>

        <!-- 食材热量勾选模块 -->
        <div class="bg-white rounded-xl p-6 mb-6 card-shadow">
            <h2 class="text-lg font-semibold text-emerald-700 mb-4">二、勾选今日食用食材（自动汇总热量）</h2>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-3 text-sm">
                <label class="flex items-center gap-2 p-2 bg-gray-50 rounded"><input type="checkbox" data-kcal="116" class="food">米饭100g</label>
                <label class="flex items-center gap-2 p-2 bg-gray-50 rounded"><input type="checkbox" data-kcal="36" class="food">西兰花100g</label>
                <label class="flex items-center gap-2 p-2 bg-gray-50 rounded"><input type="checkbox" data-kcal="165" class="food">鸡胸肉100g</label>
                <label class="flex items-center gap-2 p-2 bg-gray-50 rounded"><input type="checkbox" data-kcal="80" class="food">鸡蛋1个</label>
                <label class="flex items-center gap-2 p-2 bg-gray-50 rounded"><input type="checkbox" data-kcal="52" class="food">苹果1个</label>
                <label class="flex items-center gap-2 p-2 bg-gray-50 rounded"><input type="checkbox" data-kcal="130" class="food">红薯100g</label>
                <label class="flex items-center gap-2 p-2 bg-gray-50 rounded"><input type="checkbox" data-kcal="28" class="food">生菜100g</label>
                <label class="flex items-center gap-2 p-2 bg-gray-50 rounded"><input type="checkbox" data-kcal="143" class="food">牛肉100g</label>
                <label class="flex items-center gap-2 p-2 bg-gray-50 rounded"><input type="checkbox" data-kcal="70" class="food">无糖酸奶100g</label>
            </div>
            <div class="mt-4 flex gap-3">
                <button onclick="sumFoodCal()" class="flex-1 bg-gray-700 text-white py-2 rounded-lg">汇总今日摄入热量</button>
                <button onclick="clearFood()" class="flex-1 bg-gray-300 py-2 rounded-lg">清空选择</button>
            </div>
            <div id="foodResult" class="mt-4 hidden p-4 bg-gray-100 rounded-lg"></div>
        </div>

        <!-- AI减脂餐方案输出 -->
        <div class="bg-white rounded-xl p-6 card-shadow">
            <h2 class="text-lg font-semibold text-emerald-700 mb-4">三、AI一键生成均衡减脂餐方案</h2>
            <button onclick="getAIMeal()" class="w-full green-gradient text-white py-2 rounded-lg font-medium">生成适配你的一日三餐减脂食谱</button>
            <div id="aiMealBox" class="mt-4 hidden p-4 bg-green-50 rounded-lg whitespace-pre-line"></div>
        </div>

        <div class="text-center text-gray-400 text-sm mt-6">
            TRAE Work Auto模式生成创意产物 · AI减脂餐控制计算工具
        </div>
    </div>

    <script>
        // 1. 计算基础代谢与减脂热量缺口
        function calcBaseCal(){
            const g = document.getElementById('gender').value;
            const age = Number(document.getElementById('age').value);
            const h = Number(document.getElementById('height').value);
            const w = Number(document.getElementById('weight').value);
            const act = Number(document.getElementById('activity').value);
            if(!age||!h||!w){alert('请完整填写身体数据');return;}
            let bmr;
            if(g==='male') bmr = 88.362 + 13.397*w + 4.799*h - 5.677*age;
            else bmr = 447.593 + 9.247*w + 3.098*h - 4.330*age;
            const tdee = bmr * act;
            const loseCal = tdee - 400; // 标准减脂400大卡缺口
            const box = document.getElementById('baseResult');
            box.classList.remove('hidden');
            box.innerHTML = `
                <p class="font-medium">你的基础代谢BMR：${bmr.toFixed(0)} kcal/天</p>
                <p class="font-medium">每日总消耗TDEE：${tdee.toFixed(0)} kcal/天</p>
                <p class="text-emerald-600 font-bold mt-1">减脂推荐每日摄入：${loseCal.toFixed(0)} kcal（400大卡健康热量缺口）</p>
            `;
        }

        // 2. 食材热量汇总
        function sumFoodCal(){
            let total = 0;
            document.querySelectorAll('.food:checked').forEach(item=>{
                total += Number(item.dataset.kcal);
            })
            const box = document.getElementById('foodResult');
            box.classList.remove('hidden');
            box.innerHTML = `<p class="font-medium">今日已选食材总热量：<span class="text-red-500 text-lg">${total}</span> 千卡</p>`;
        }
        function clearFood(){
            document.querySelectorAll('.food').forEach(i=>i.checked=false);
            document.getElementById('foodResult').classList.add('hidden');
        }

        // 3. AI生成减脂餐方案
        function getAIMeal(){
            const box = document.getElementById('aiMealBox');
            box.classList.remove('hidden');
            box.innerHTML = `【AI智能一日减脂配餐方案】
早餐（高蛋白低GI）
无糖酸奶200g + 水煮鸡蛋1个 + 小苹果1个
热量合计：约200大卡

午餐（优质碳水+瘦肉+大量蔬菜）
杂粮红薯100g + 香煎鸡胸肉100g + 清炒西兰花200g
热量合计：约320大卡

晚餐（少碳水，侧重蛋白蔬菜）
清炒瘦牛肉80g + 生菜沙拉150g（无沙拉酱）
热量合计：约180大卡

全天总参考热量：700大卡，可根据自身推荐值增减主食分量，保证蛋白质足量，油脂少油烹饪。`;
        }
    </script>
</body>
</html>
