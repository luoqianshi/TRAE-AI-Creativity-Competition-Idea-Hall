<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宝宝成长记 - 社区</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="page-container">
    <header>
      <div class="header-top">
        <button class="action-btn" onclick="navigateTo('../index.html')">←</button>
        <div>
          <div class="baby-name">社区交流</div>
          <div class="baby-age">同月龄圈子 · 树洞倾诉</div>
        </div>
        <button class="action-btn" onclick="openPostModal()">✏️</button>
      </div>
    </header>
    
    <main>
      <div class="tab-bar">
        <div class="tab-item active" onclick="switchCommunityTab('community')">👶 同月龄圈</div>
        <div class="tab-item" onclick="switchCommunityTab('treehole')">🌳 树洞</div>
      </div>
      
      <div id="community-section">
        <div style="display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px;">
          <button class="tab-item active" onclick="filterByMonth('12个月')">12个月</button>
          <button class="tab-item" onclick="filterByMonth('11个月')">11个月</button>
          <button class="tab-item" onclick="filterByMonth('13个月')">13个月</button>
          <button class="tab-item" onclick="filterByMonth('10个月')">10个月</button>
          <button class="tab-item" onclick="filterByMonth('9个月')">9个月</button>
        </div>
        <div id="community-posts"></div>
      </div>
      
      <div id="treehole-section" style="display: none;">
        <div style="background: linear-gradient(135deg, #4A5568, #2D3748); border-radius: 20px; padding: 20px; margin-bottom: 20px; color: white;">
          <div style="font-size: 16px; font-weight: bold; margin-bottom: 8px;">🌳 树洞</div>
          <div style="font-size: 13px; opacity: 0.9;">在这里，你可以匿名倾诉所有的烦恼和压力。没有人认识你，只有温暖和理解。</div>
        </div>
        <div id="treehole-posts"></div>
      </div>
    </main>
    
    <nav class="nav-bar">
      <div class="nav-item" data-page="../index.html">
        <div class="nav-item-icon">🏠</div>
        <div class="nav-item-label">首页</div>
      </div>
      <div class="nav-item" data-page="record.html">
        <div class="nav-item-icon">📝</div>
        <div class="nav-item-label">记录</div>
      </div>
      <div class="nav-item active">
        <div class="nav-item-icon">💬</div>
        <div class="nav-item-label">社区</div>
      </div>
      <div class="nav-item" data-page="analysis.html">
        <div class="nav-item-icon">📊</div>
        <div class="nav-item-label">分析</div>
      </div>
      <div class="nav-item" data-page="vaccine.html">
        <div class="nav-item-icon">💉</div>
        <div class="nav-item-label">疫苗</div>
      </div>
    </nav>
  </div>
  
  <div class="modal-overlay" id="post-modal" style="display: none;">
    <div class="modal-content">
      <button class="close-btn" onclick="closePostModal()">×</button>
      <div class="modal-title">✏️ 发布帖子</div>
      <div style="margin-top: 20px;">
        <div class="form-group">
          <label class="form-label">选择板块</label>
          <select class="form-select" id="post-type">
            <option value="community">同月龄圈</option>
            <option value="treehole">树洞（匿名）</option>
          </select>
        </div>
        <div class="form-group" id="month-group-select">
          <label class="form-label">选择月龄</label>
          <select class="form-select" id="post-month">
            <option value="12个月">12个月</option>
            <option value="11个月">11个月</option>
            <option value="13个月">13个月</option>
            <option value="10个月">10个月</option>
            <option value="9个月">9个月</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">添加标签</label>
          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button class="tab-item" onclick="toggleTag('亲测有效')" style="padding: 6px 12px;">亲测有效</button>
            <button class="tab-item" onclick="toggleTag('辅食')" style="padding: 6px 12px;">辅食</button>
            <button class="tab-item" onclick="toggleTag('睡眠')" style="padding: 6px 12px;">睡眠</button>
            <button class="tab-item" onclick="toggleTag('出牙')" style="padding: 6px 12px;">出牙</button>
            <button class="tab-item" onclick="toggleTag('湿疹')" style="padding: 6px 12px;">湿疹</button>
            <button class="tab-item" onclick="toggleTag('学步')" style="padding: 6px 12px;">学步</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">内容</label>
          <textarea class="form-input" id="post-content" placeholder="分享你的经验或心情..." rows="5"></textarea>
        </div>
        <button class="form-btn" onclick="publishPost()">发布</button>
      </div>
    </div>
  </div>
  
  <script src="../data/mock.js"></script>
  <script src="../script.js"></script>
  <script>
    let selectedTags = [];
    
    function switchCommunityTab(tab) {
      document.querySelectorAll('.tab-bar .tab-item').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('community-section').style.display = tab === 'community' ? 'block' : 'none';
      document.getElementById('treehole-section').style.display = tab === 'treehole' ? 'block' : 'none';
    }
    
    function filterByMonth(month) {
      document.querySelectorAll('#community-section .tab-item').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      const posts = loadData('communityPosts') || [];
      const filtered = posts.filter(p => p.type === 'community' && p.monthGroup === month);
      const container = document.getElementById('community-posts');
      container.innerHTML = filtered.length > 0 ? filtered.map(post => createPostHTML(post)).join('') : 
        '<div style="text-align: center; padding: 40px; color: #999;">暂无该月龄的帖子</div>';
    }
    
    function createPostHTML(post) {
      return `
        <div class="post-card">
          <div class="post-header">
            <div class="post-author">
              <div class="post-avatar">${post.type === 'treehole' ? '🕵️' : '👩'}</div>
              <span class="post-author-name">${post.author}</span>
            </div>
            <span class="post-time">${post.time}</span>
          </div>
          ${post.monthGroup ? `<div class="post-tags">
            <span class="post-tag">${post.monthGroup}</span>
            ${post.tags.map(tag => `<span class="post-tag ${tag === '亲测有效' ? 'valid' : ''}">${tag}</span>`).join('')}
          </div>` : ''}
          <div class="post-content">${post.content}</div>
          <div class="post-actions">
            <span class="post-action">❤️ ${post.likes}</span>
            <span class="post-action">💬 ${post.comments}</span>
          </div>
        </div>
      `;
    }
    
    function openPostModal() {
      document.getElementById('post-modal').style.display = 'flex';
      selectedTags = [];
    }
    
    function closePostModal() {
      document.getElementById('post-modal').style.display = 'none';
    }
    
    function toggleTag(tag) {
      const index = selectedTags.indexOf(tag);
      if (index === -1) {
        selectedTags.push(tag);
        event.target.classList.add('active');
      } else {
        selectedTags.splice(index, 1);
        event.target.classList.remove('active');
      }
    }
    
    document.getElementById('post-type').addEventListener('change', function() {
      document.getElementById('month-group-select').style.display = this.value === 'community' ? 'block' : 'none';
    });
    
    function publishPost() {
      const type = document.getElementById('post-type').value;
      const content = document.getElementById('post-content').value;
      if (!content.trim()) {
        showToast('请输入内容');
        return;
      }
      
      const posts = loadData('communityPosts') || [];
      posts.unshift({
        id: `post_${Date.now()}`,
        type,
        monthGroup: type === 'community' ? document.getElementById('post-month').value : null,
        tags: type === 'community' ? selectedTags : [],
        content,
        author: type === 'treehole' ? '匿名' : '甜甜妈',
        time: new Date().toLocaleString('zh-CN'),
        likes: 0,
        comments: 0
      });
      saveData('communityPosts', posts);
      closePostModal();
      document.getElementById('post-content').value = '';
      showToast('发布成功');
      loadCommunityPosts();
      loadTreeholePosts();
    }
  </script>
</body>
</html>
