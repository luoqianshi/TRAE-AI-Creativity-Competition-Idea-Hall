<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宝宝成长记 - 家庭组</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="page-container">
    <header>
      <div class="header-top">
        <button class="action-btn" onclick="navigateTo('../index.html')">←</button>
        <div>
          <div class="baby-name">幸福小家</div>
          <div class="baby-age">3位成员 · 实时同步</div>
        </div>
        <button class="action-btn" onclick="openInviteModal()">➕</button>
      </div>
    </header>
    
    <main>
      <div class="section-title">👨‍👩‍👧 家庭成员</div>
      <div id="family-members"></div>
      
      <div class="section-title">📜 活动日志</div>
      <div id="family-timeline"></div>
      
      <div class="section-title">⚙️ 家庭设置</div>
      <div class="form-card">
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #eee;">
          <span>数据同步</span>
          <div class="switch-btn active"></div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #eee;">
          <span>共享提醒</span>
          <div class="switch-btn active"></div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 15px 0;">
          <span>共享照片</span>
          <div class="switch-btn"></div>
        </div>
      </div>
    </main>
    
    <nav class="nav-bar">
      <div class="nav-item" data-page="../index.html">
        <div class="nav-item-icon">🏠</div>
        <div class="nav-item-label">首页</div>
      </div>
      <div class="nav-item" data-page="record.html">
        <div class="nav-item-icon">📝</div>
        <div class="nav-item-label">记录</div>
      </div>
      <div class="nav-item" data-page="community.html">
        <div class="nav-item-icon">💬</div>
        <div class="nav-item-label">社区</div>
      </div>
      <div class="nav-item" data-page="analysis.html">
        <div class="nav-item-icon">📊</div>
        <div class="nav-item-label">分析</div>
      </div>
      <div class="nav-item" data-page="vaccine.html">
        <div class="nav-item-icon">💉</div>
        <div class="nav-item-label">疫苗</div>
      </div>
    </nav>
  </div>
  
  <div class="modal-overlay" id="invite-modal" style="display: none;">
    <div class="modal-content">
      <button class="close-btn" onclick="closeInviteModal()">×</button>
      <div class="modal-title">👨‍👩‍👧 邀请家人</div>
      <div style="margin-top: 20px;">
        <div class="form-group">
          <label class="form-label">选择角色</label>
          <select class="form-select" id="invite-role">
            <option value="爸爸">爸爸</option>
            <option value="妈妈">妈妈</option>
            <option value="奶奶">奶奶</option>
            <option value="爷爷">爷爷</option>
            <option value="姥姥">姥姥</option>
            <option value="姥爷">姥爷</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">邀请方式</label>
          <div style="display: flex; gap: 10px;">
            <button class="form-btn" style="flex: 1;" onclick="inviteFamily()">📱 发送邀请</button>
            <button class="form-btn" style="flex: 1;" onclick="copyInviteLink()">🔗 复制链接</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="../data/mock.js"></script>
  <script src="../script.js"></script>
  <script>
    function openInviteModal() {
      document.getElementById('invite-modal').style.display = 'flex';
    }
    
    function closeInviteModal() {
      document.getElementById('invite-modal').style.display = 'none';
    }
    
    function inviteFamily() {
      const role = document.getElementById('invite-role').value;
      const family = loadData('family');
      const avatars = {
        '爸爸': '👨',
        '妈妈': '👩',
        '奶奶': '👵',
        '爷爷': '👴',
        '姥姥': '👵',
        '姥爷': '👴'
      };
      
      family.members.push({
        id: `user_${Date.now()}`,
        name: role,
        role: 'member',
        avatar: avatars[role] || '👤'
      });
      saveData('family', family);
      closeInviteModal();
      showToast(`已邀请${role}加入家庭组`);
      loadFamilyMembers();
    }
    
    function copyInviteLink() {
      const dummy = document.createElement('input');
      document.body.appendChild(dummy);
      dummy.value = 'https://babyrecord.com/invite/family_001';
      dummy.select();
      document.execCommand('copy');
      document.body.removeChild(dummy);
      showToast('邀请链接已复制');
    }
  </script>
</body>
</html>
