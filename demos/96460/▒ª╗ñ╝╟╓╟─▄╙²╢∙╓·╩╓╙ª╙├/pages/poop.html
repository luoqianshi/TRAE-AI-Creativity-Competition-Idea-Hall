<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宝宝成长记 - 大便识别</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="page-container">
    <header>
      <div class="header-top">
        <button class="action-btn" onclick="navigateTo('../index.html')">←</button>
        <div>
          <div class="baby-name">大便识别</div>
          <div class="baby-age">AI辅助分析 · 护理提示</div>
        </div>
        <div class="action-btn">?</div>
      </div>
    </header>
    
    <main>
      <div class="form-card" style="text-align: center;">
        <div style="width: 200px; height: 200px; border: 3px dashed #FFB6C1; border-radius: 20px; margin: 0 auto 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;" onclick="triggerCamera()">
          <div style="font-size: 60px; margin-bottom: 10px;">📷</div>
          <div style="font-size: 14px; color: #666;">点击拍照或上传</div>
        </div>
        <input type="file" id="poop-image" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
        <button class="form-btn" onclick="triggerCamera()">📸 拍照识别</button>
      </div>
      
      <div id="analysis-result" style="display: none;">
        <div class="form-card">
          <div style="text-align: center; margin-bottom: 20px;">
            <div style="width: 150px; height: 150px; border-radius: 15px; background: #FFF8F0; margin: 0 auto; overflow: hidden;">
              <img id="preview-image" src="" alt="大便照片" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
          </div>
          
          <div class="section-title">📊 AI分析结果</div>
          
          <div style="display: flex; justify-content: space-around; margin: 20px 0;">
            <div style="text-align: center;">
              <div style="font-size: 24px; margin-bottom: 5px;">🟡</div>
              <div style="font-size: 14px; font-weight: bold;">黄色</div>
              <div style="font-size: 12px; color: #999;">颜色</div>
            </div>
            <div style="text-align: center;">
              <div style="font-size: 24px; margin-bottom: 5px;">☁️</div>
              <div style="font-size: 14px; font-weight: bold;">软便</div>
              <div style="font-size: 12px; color: #999;">性状</div>
            </div>
            <div style="text-align: center;">
              <div style="font-size: 24px; margin-bottom: 5px;">✅</div>
              <div style="font-size: 14px; font-weight: bold;">正常</div>
              <div style="font-size: 12px; color: #999;">状态</div>
            </div>
          </div>
          
          <div class="section-title">💡 护理提示</div>
          <div style="background: #90EE9020; border-radius: 15px; padding: 15px; font-size: 14px; color: #228B22;">
            大便颜色和性状都很正常，宝宝消化吸收良好。继续保持当前的喂养方式即可。
          </div>
          
          <button class="form-btn" style="margin-top: 20px;" onclick="savePoopRecord()">💾 保存记录</button>
        </div>
      </div>
      
      <div class="section-title">📝 近期记录</div>
      <div id="excretion-records"></div>
    </main>
    
    <nav class="nav-bar">
      <div class="nav-item" data-page="../index.html">
        <div class="nav-item-icon">🏠</div>
        <div class="nav-item-label">首页</div>
      </div>
      <div class="nav-item" data-page="record.html">
        <div class="nav-item-icon">📝</div>
        <div class="nav-item-label">记录</div>
      </div>
      <div class="nav-item" data-page="community.html">
        <div class="nav-item-icon">💬</div>
        <div class="nav-item-label">社区</div>
      </div>
      <div class="nav-item" data-page="analysis.html">
        <div class="nav-item-icon">📊</div>
        <div class="nav-item-label">分析</div>
      </div>
      <div class="nav-item" data-page="vaccine.html">
        <div class="nav-item-icon">💉</div>
        <div class="nav-item-label">疫苗</div>
      </div>
    </nav>
  </div>
  
  <script src="../data/mock.js"></script>
  <script src="../script.js"></script>
  <script>
    function triggerCamera() {
      document.getElementById('poop-image').click();
    }
    
    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('preview-image').src = e.target.result;
          document.getElementById('analysis-result').style.display = 'block';
          showToast('AI分析完成');
        };
        reader.readAsDataURL(file);
      }
    }
    
    function savePoopRecord() {
      addExcretionRecord('poop', '黄色', '软便');
      showToast('已保存大便记录');
      loadExcretionRecords();
    }
  </script>
</body>
</html>
