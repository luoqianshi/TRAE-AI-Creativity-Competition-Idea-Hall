<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宝宝成长记 - AI分析</title>
  <link rel="stylesheet" href="../style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="page-container">
    <header>
      <div class="header-top">
        <button class="action-btn" onclick="navigateTo('../index.html')">←</button>
        <div>
          <div class="baby-name">AI分析</div>
          <div class="baby-age">生长趋势 · 智能解读</div>
        </div>
        <div class="action-btn">⚙️</div>
      </div>
    </header>
    
    <main>
      <div class="tab-bar">
        <div class="tab-item active" onclick="switchChartTab('weight')">⚖️ 体重</div>
        <div class="tab-item" onclick="switchChartTab('height')">📏 身高</div>
        <div class="tab-item" onclick="switchChartTab('sleep')">😴 睡眠</div>
        <div class="tab-item" onclick="switchChartTab('feed')">🍼 奶量</div>
      </div>
      
      <div class="chart-container">
        <canvas id="main-chart"></canvas>
      </div>
      
      <div class="section-title">💡 AI智能解读</div>
      <div id="insights-list"></div>
      
      <div class="section-title">📊 本周数据概览</div>
      <div class="report-section">
        <div class="report-grid">
          <div class="report-item">
            <div class="report-item-value">680ml</div>
            <div class="report-item-label">日均奶量</div>
          </div>
          <div class="report-item">
            <div class="report-item-value">10h</div>
            <div class="report-item-label">日均睡眠</div>
          </div>
          <div class="report-item">
            <div class="report-item-value">3次</div>
            <div class="report-item-label">日均大便</div>
          </div>
          <div class="report-item">
            <div class="report-item-value">8次</div>
            <div class="report-item-label">日均小便</div>
          </div>
        </div>
      </div>
    </main>
    
    <nav class="nav-bar">
      <div class="nav-item" data-page="../index.html">
        <div class="nav-item-icon">🏠</div>
        <div class="nav-item-label">首页</div>
      </div>
      <div class="nav-item" data-page="record.html">
        <div class="nav-item-icon">📝</div>
        <div class="nav-item-label">记录</div>
      </div>
      <div class="nav-item" data-page="community.html">
        <div class="nav-item-icon">💬</div>
        <div class="nav-item-label">社区</div>
      </div>
      <div class="nav-item active">
        <div class="nav-item-icon">📊</div>
        <div class="nav-item-label">分析</div>
      </div>
      <div class="nav-item" data-page="vaccine.html">
        <div class="nav-item-icon">💉</div>
        <div class="nav-item-label">疫苗</div>
      </div>
    </nav>
  </div>
  
  <script src="../data/mock.js"></script>
  <script src="../script.js"></script>
  <script>
    let currentChart = null;
    
    function switchChartTab(type) {
      document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      renderChart(type);
    }
    
    function renderChart(type) {
      const ctx = document.getElementById('main-chart');
      if (currentChart) {
        currentChart.destroy();
      }
      
      const aiAnalysis = loadData('aiAnalysis');
      if (!aiAnalysis) return;
      
      let data, label, borderColor, bgColor, chartType;
      
      switch(type) {
        case 'weight':
          data = aiAnalysis.weightTrend;
          label = '体重 (kg)';
          borderColor = '#FFB6C1';
          bgColor = 'rgba(255, 182, 193, 0.1)';
          chartType = 'line';
          break;
        case 'height':
          data = aiAnalysis.heightTrend;
          label = '身高 (cm)';
          borderColor = '#ADD8E6';
          bgColor = 'rgba(173, 216, 230, 0.1)';
          chartType = 'line';
          break;
        case 'sleep':
          data = aiAnalysis.sleepTrend;
          label = '睡眠时长 (分钟)';
          borderColor = '#9370DB';
          bgColor = '#9370DB';
          chartType = 'bar';
          break;
        case 'feed':
          data = aiAnalysis.feedTrend;
          label = '奶量 (ml)';
          borderColor = '#FFA500';
          bgColor = '#FFA500';
          chartType = 'bar';
          break;
      }
      
      currentChart = new Chart(ctx, {
        type: chartType,
        data: {
          labels: data.map(d => d.date),
          datasets: [{
            label,
            data: data.map(d => d.value),
            borderColor,
            backgroundColor: chartType === 'line' ? bgColor : bgColor,
            tension: 0.4,
            fill: chartType === 'line',
            borderRadius: chartType === 'bar' ? 8 : 0
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: { beginAtZero: false }
          }
        }
      });
    }
    
    document.addEventListener('DOMContentLoaded', () => {
      renderChart('weight');
      loadInsights();
    });
  </script>
</body>
</html>
