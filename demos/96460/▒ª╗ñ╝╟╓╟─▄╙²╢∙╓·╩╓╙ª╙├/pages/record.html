<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宝宝成长记 - 记录中心</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="page-container">
    <header>
      <div class="header-top">
        <button class="action-btn" onclick="navigateTo('../index.html')">←</button>
        <div>
          <div class="baby-name">小糯米</div>
          <div class="baby-age">12个月</div>
        </div>
        <div class="action-btn">⋮</div>
      </div>
    </header>
    
    <main>
      <div class="tab-bar">
        <div class="tab-item active" onclick="switchTab('feed')">🍼 喂奶</div>
        <div class="tab-item" onclick="switchTab('excretion')">💩 排泄</div>
        <div class="tab-item" onclick="switchTab('sleep')">😴 睡眠</div>
        <div class="tab-item" onclick="switchTab('growth')">📏 生长</div>
        <div class="tab-item" onclick="switchTab('temp')">🌡️ 体温</div>
        <div class="tab-item" onclick="switchTab('medication')">💊 用药</div>
        <div class="tab-item" onclick="switchTab('milestone')">🎯 里程碑</div>
      </div>
      
      <div id="feed-tab" class="tab-content">
        <div class="form-card">
          <div class="form-group">
            <label class="form-label">喂奶类型</label>
            <div style="display: flex; gap: 10px;">
              <button class="form-btn" style="flex: 1;" onclick="addFeedRecord('breast', 'left', 15)">🍼 亲喂左侧</button>
              <button class="form-btn" style="flex: 1;" onclick="addFeedRecord('breast', 'right', 15)">🍼 亲喂右侧</button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">瓶喂奶量 (ml)</label>
            <input type="number" class="form-input" id="bottle-amount" placeholder="输入奶量">
            <button class="form-btn" onclick="addBottleFeed()">🥤 记录瓶喂</button>
          </div>
        </div>
        <div class="section-title">📝 喂奶记录</div>
        <div id="feed-records"></div>
      </div>
      
      <div id="excretion-tab" class="tab-content" style="display: none;">
        <div class="form-card">
          <div class="form-group">
            <label class="form-label">大便颜色</label>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
              <button class="tab-item" onclick="addExcretionRecord('poop', '黄色', 'soft')" style="padding: 8px 12px;">🟡 黄色</button>
              <button class="tab-item" onclick="addExcretionRecord('poop', '绿色', 'soft')" style="padding: 8px 12px;">🟢 绿色</button>
              <button class="tab-item" onclick="addExcretionRecord('poop', '棕色', 'normal')" style="padding: 8px 12px;">🟤 棕色</button>
              <button class="tab-item" onclick="addExcretionRecord('poop', '白色', 'hard')" style="padding: 8px 12px;">⚪ 白色</button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">大便性状</label>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
              <button class="tab-item" onclick="addExcretionRecord('poop', '黄色', '水样')" style="padding: 8px 12px;">💧 水样</button>
              <button class="tab-item" onclick="addExcretionRecord('poop', '黄色', '稀便')" style="padding: 8px 12px;">💦 稀便</button>
              <button class="tab-item" onclick="addExcretionRecord('poop', '黄色', '软便')" style="padding: 8px 12px;">☁️ 软便</button>
              <button class="tab-item" onclick="addExcretionRecord('poop', '黄色', '正常')" style="padding: 8px 12px;">✅ 正常</button>
              <button class="tab-item" onclick="addExcretionRecord('poop', '黄色', '干硬')" style="padding: 8px 12px;">🪨 干硬</button>
            </div>
          </div>
          <button class="form-btn" onclick="addExcretionRecord('urine', null, null)">💧 记录小便</button>
        </div>
        <div class="section-title">📝 排泄记录</div>
        <div id="excretion-records"></div>
      </div>
      
      <div id="sleep-tab" class="tab-content" style="display: none;">
        <div class="form-card">
          <div class="form-group">
            <label class="form-label">睡眠质量</label>
            <div style="display: flex; gap: 10px;">
              <button class="tab-item" onclick="addSleepRecordWithQuality('good')" style="flex: 1;">😊 好</button>
              <button class="tab-item" onclick="addSleepRecordWithQuality('normal')" style="flex: 1;">😐 一般</button>
              <button class="tab-item" onclick="addSleepRecordWithQuality('poor')" style="flex: 1;">😫 差</button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">睡眠时长 (分钟)</label>
            <input type="number" class="form-input" id="sleep-duration" placeholder="输入时长">
            <button class="form-btn" onclick="addSleepRecordWithDuration()">😴 记录睡眠</button>
          </div>
        </div>
        <div class="section-title">📝 睡眠记录</div>
        <div id="sleep-records"></div>
      </div>
      
      <div id="growth-tab" class="tab-content" style="display: none;">
        <div class="form-card">
          <div class="form-group">
            <label class="form-label">身高 (cm)</label>
            <input type="number" class="form-input" id="growth-height" placeholder="输入身高">
          </div>
          <div class="form-group">
            <label class="form-label">体重 (kg)</label>
            <input type="number" class="form-input" id="growth-weight" placeholder="输入体重">
          </div>
          <div class="form-group">
            <label class="form-label">头围 (cm)</label>
            <input type="number" class="form-input" id="growth-head" placeholder="输入头围">
          </div>
          <button class="form-btn" onclick="addGrowthRecord()">📏 记录生长</button>
        </div>
        <div class="section-title">📝 生长记录</div>
        <div id="growth-records"></div>
      </div>
      
      <div id="temp-tab" class="tab-content" style="display: none;">
        <div class="form-card">
          <div class="form-group">
            <label class="form-label">体温 (°C)</label>
            <input type="number" step="0.1" class="form-input" id="temp-value" placeholder="输入体温">
            <button class="form-btn" onclick="addTemperatureRecord(parseFloat(document.getElementById('temp-value').value) || 36.5)">🌡️ 记录体温</button>
          </div>
        </div>
        <div class="section-title">📝 体温记录</div>
        <div id="temp-records"></div>
      </div>
      
      <div id="medication-tab" class="tab-content" style="display: none;">
        <div class="form-card">
          <div class="form-group">
            <label class="form-label">药品名称</label>
            <input type="text" class="form-input" id="med-name" placeholder="输入药品名称">
          </div>
          <div class="form-group">
            <label class="form-label">剂量</label>
            <input type="text" class="form-input" id="med-dose" placeholder="输入剂量">
          </div>
          <div class="form-group">
            <label class="form-label">备注</label>
            <textarea class="form-input" id="med-note" placeholder="输入备注" rows="3"></textarea>
          </div>
          <button class="form-btn" onclick="addMedicationRecord()">💊 记录用药</button>
        </div>
      </div>
      
      <div id="milestone-tab" class="tab-content" style="display: none;">
        <div class="form-card">
          <div class="form-group">
            <label class="form-label">选择里程碑</label>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
              <button class="tab-item" onclick="addMilestone('翻身')" style="padding: 8px 12px;">🤸 翻身</button>
              <button class="tab-item" onclick="addMilestone('独坐')" style="padding: 8px 12px;">🧘 独坐</button>
              <button class="tab-item" onclick="addMilestone('爬行')" style="padding: 8px 12px;">🐢 爬行</button>
              <button class="tab-item" onclick="addMilestone('站立')" style="padding: 8px 12px;">🧍 站立</button>
              <button class="tab-item" onclick="addMilestone('走路')" style="padding: 8px 12px;">🚶 走路</button>
              <button class="tab-item" onclick="addMilestone('长牙')" style="padding: 8px 12px;">🦷 长牙</button>
              <button class="tab-item" onclick="addMilestone('说话')" style="padding: 8px 12px;">🗣️ 说话</button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">自定义里程碑</label>
            <input type="text" class="form-input" id="milestone-custom" placeholder="输入里程碑名称">
            <button class="form-btn" onclick="addMilestone(document.getElementById('milestone-custom').value)">🎯 记录里程碑</button>
          </div>
        </div>
        <div class="section-title">🎯 已达成里程碑</div>
        <div id="milestone-records"></div>
      </div>
    </main>
    
    <nav class="nav-bar">
      <div class="nav-item" data-page="../index.html">
        <div class="nav-item-icon">🏠</div>
        <div class="nav-item-label">首页</div>
      </div>
      <div class="nav-item active">
        <div class="nav-item-icon">📝</div>
        <div class="nav-item-label">记录</div>
      </div>
      <div class="nav-item" data-page="community.html">
        <div class="nav-item-icon">💬</div>
        <div class="nav-item-label">社区</div>
      </div>
      <div class="nav-item" data-page="analysis.html">
        <div class="nav-item-icon">📊</div>
        <div class="nav-item-label">分析</div>
      </div>
      <div class="nav-item" data-page="vaccine.html">
        <div class="nav-item-icon">💉</div>
        <div class="nav-item-label">疫苗</div>
      </div>
    </nav>
  </div>
  
  <script src="../data/mock.js"></script>
  <script src="../script.js"></script>
  <script>
    function switchTab(tabName) {
      document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
      event.target.classList.add('active');
      document.getElementById(tabName + '-tab').style.display = 'block';
      if (tabName === 'milestone') loadMilestoneRecords();
    }
    
    function addBottleFeed() {
      const amount = parseInt(document.getElementById('bottle-amount').value) || 150;
      addFeedRecord('bottle', null, amount);
      document.getElementById('bottle-amount').value = '';
      showToast('已记录瓶喂');
      loadFeedRecords();
    }
    
    function addSleepRecordWithQuality(quality) {
      const records = loadData('sleepRecords') || [];
      records.unshift({
        id: `sleep_${Date.now()}`,
        startTime: new Date().toLocaleString('zh-CN'),
        endTime: new Date(Date.now() + 90 * 60000).toLocaleString('zh-CN'),
        quality,
        duration: 90,
        user: '妈妈'
      });
      saveData('sleepRecords', records);
      showToast('已记录睡眠');
      loadSleepRecords();
    }
    
    function addSleepRecordWithDuration() {
      const duration = parseInt(document.getElementById('sleep-duration').value) || 90;
      const records = loadData('sleepRecords') || [];
      records.unshift({
        id: `sleep_${Date.now()}`,
        startTime: new Date().toLocaleString('zh-CN'),
        endTime: new Date(Date.now() + duration * 60000).toLocaleString('zh-CN'),
        quality: 'good',
        duration,
        user: '妈妈'
      });
      saveData('sleepRecords', records);
      document.getElementById('sleep-duration').value = '';
      showToast('已记录睡眠');
      loadSleepRecords();
    }
    
    function addGrowthRecord() {
      const height = parseFloat(document.getElementById('growth-height').value) || 75;
      const weight = parseFloat(document.getElementById('growth-weight').value) || 9.2;
      const head = parseFloat(document.getElementById('growth-head').value) || 46;
      const records = loadData('growthRecords') || [];
      records.unshift({
        id: `growth_${Date.now()}`,
        date: new Date().toISOString().split('T')[0],
        height,
        weight,
        headCircumference: head
      });
      saveData('growthRecords', records);
      document.getElementById('growth-height').value = '';
      document.getElementById('growth-weight').value = '';
      document.getElementById('growth-head').value = '';
      showToast('已记录生长数据');
      loadGrowthRecords();
    }
    
    function addMedicationRecord() {
      const name = document.getElementById('med-name').value || '退烧药';
      const dose = document.getElementById('med-dose').value || '5ml';
      const note = document.getElementById('med-note').value || '';
      const records = loadData('medicationRecords') || [];
      records.unshift({
        id: `med_${Date.now()}`,
        name,
        dose,
        time: new Date().toLocaleString('zh-CN'),
        note
      });
      saveData('medicationRecords', records);
      document.getElementById('med-name').value = '';
      document.getElementById('med-dose').value = '';
      document.getElementById('med-note').value = '';
      showToast('已记录用药');
    }
    
    function addMilestone(name) {
      if (!name) return;
      const records = loadData('milestoneRecords') || [];
      records.unshift({
        id: `milestone_${Date.now()}`,
        name,
        date: new Date().toISOString().split('T')[0]
      });
      saveData('milestoneRecords', records);
      document.getElementById('milestone-custom').value = '';
      showToast(`🎉 恭喜！${name}达成！`);
      loadMilestoneRecords();
    }
    
    function loadMilestoneRecords() {
      const records = loadData('milestoneRecords') || [];
      const container = document.getElementById('milestone-records');
      if (container) {
        container.innerHTML = records.map(record => `
          <div class="record-card">
            <div class="record-header">
              <span class="record-type">🎯 ${record.name}</span>
              <span class="record-time">${record.date}</span>
            </div>
          </div>
        `).join('');
      }
    }
    
    function loadTempRecords() {
      const records = loadData('temperatureRecords') || [];
      const container = document.getElementById('temp-records');
      if (container) {
        container.innerHTML = records.slice(0, 10).map(record => `
          <div class="record-card">
            <div class="record-header">
              <span class="record-type">🌡️ 体温</span>
              <span class="record-time">${record.time}</span>
            </div>
            <div class="record-detail">${record.value}°C</div>
          </div>
        `).join('');
      }
    }
    
    document.addEventListener('DOMContentLoaded', () => {
      loadTempRecords();
    });
  </script>
</body>
</html>
