<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宝宝成长记 - 妈妈关怀</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="page-container">
    <header>
      <div class="header-top">
        <button class="action-btn" onclick="navigateTo('../index.html')">←</button>
        <div>
          <div class="baby-name">妈妈关怀</div>
          <div class="baby-age">自我记录 · 身心康复</div>
        </div>
        <div class="action-btn">💕</div>
      </div>
    </header>
    
    <main>
      <div class="mom-section">
        <div class="section-title">😊 今日心情</div>
        <div id="mom-mood"></div>
      </div>
      
      <div class="mom-section">
        <div class="section-title">💧 恶露恢复</div>
        <div style="display: flex; gap: 10px;">
          <button class="tab-item" onclick="recordLochia('少量', '白色')">少量 · 白色</button>
          <button class="tab-item" onclick="recordLochia('中量', '黄色')">中量 · 黄色</button>
          <button class="tab-item" onclick="recordLochia('少量', '褐色')">少量 · 褐色</button>
        </div>
      </div>
      
      <div class="mom-section">
        <div class="section-title">💦 饮水量</div>
        <div class="form-group">
          <input type="number" class="form-input" id="water-amount" placeholder="今日饮水量 (ml)">
          <button class="form-btn" onclick="recordWater()">💧 记录饮水量</button>
        </div>
      </div>
      
      <div class="mom-section">
        <div class="section-title">🏋️ 盆底肌训练</div>
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
          <button class="tab-item" onclick="recordPelvic(2, 10)">2组 × 10次</button>
          <button class="tab-item" onclick="recordPelvic(3, 15)">3组 × 15次</button>
          <button class="tab-item" onclick="recordPelvic(4, 20)">4组 × 20次</button>
        </div>
        <div style="background: #FFF8F0; border-radius: 15px; padding: 15px;">
          <div style="font-size: 14px; font-weight: bold; margin-bottom: 10px;">💡 训练提示</div>
          <div style="font-size: 13px; color: #666; line-height: 1.6;">
            吸气时放松盆底肌，呼气时收缩盆底肌，保持收缩5-10秒后放松。每天坚持训练，有助于恢复盆底肌功能。
          </div>
        </div>
      </div>
      
      <div class="mom-section">
        <div class="section-title">📝 心情日记</div>
        <textarea class="form-input" id="mom-diary" placeholder="记录今天的心情和感受..." rows="4"></textarea>
        <button class="form-btn" style="margin-top: 10px;" onclick="saveDiary()">💾 保存日记</button>
      </div>
      
      <div class="mom-section">
        <div class="section-title">💞 关爱提醒</div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <div style="background: #FFB6C120; border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 10px;">
            <div style="font-size: 20px;">😴</div>
            <div>
              <div style="font-size: 14px; font-weight: 500;">好好休息</div>
              <div style="font-size: 12px; color: #999;">今天已经照顾宝宝很辛苦了，记得抽空休息</div>
            </div>
          </div>
          <div style="background: #ADD8E620; border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 10px;">
            <div style="font-size: 20px;">💦</div>
            <div>
              <div style="font-size: 14px; font-weight: 500;">补充水分</div>
              <div style="font-size: 12px; color: #999;">哺乳期每天建议饮水1500-2000ml</div>
            </div>
          </div>
          <div style="background: #90EE9020; border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 10px;">
            <div style="font-size: 20px;">🧘</div>
            <div>
              <div style="font-size: 14px; font-weight: 500;">放松身心</div>
              <div style="font-size: 12px; color: #999;">每天给自己留10分钟，做一些喜欢的事</div>
            </div>
          </div>
        </div>
      </div>
    </main>
    
    <nav class="nav-bar">
      <div class="nav-item" data-page="../index.html">
        <div class="nav-item-icon">🏠</div>
        <div class="nav-item-label">首页</div>
      </div>
      <div class="nav-item" data-page="record.html">
        <div class="nav-item-icon">📝</div>
        <div class="nav-item-label">记录</div>
      </div>
      <div class="nav-item" data-page="community.html">
        <div class="nav-item-icon">💬</div>
        <div class="nav-item-label">社区</div>
      </div>
      <div class="nav-item" data-page="analysis.html">
        <div class="nav-item-icon">📊</div>
        <div class="nav-item-label">分析</div>
      </div>
      <div class="nav-item" data-page="vaccine.html">
        <div class="nav-item-icon">💉</div>
        <div class="nav-item-label">疫苗</div>
      </div>
    </nav>
  </div>
  
  <script src="../data/mock.js"></script>
  <script src="../script.js"></script>
  <script>
    function recordLochia(amount, color) {
      const records = loadData('momRecords') || { lochia: [] };
      records.lochia.unshift({
        id: `loch_${Date.now()}`,
        date: new Date().toISOString().split('T')[0],
        amount,
        color
      });
      saveData('momRecords', records);
      showToast('已记录恶露情况');
    }
    
    function recordWater() {
      const amount = parseInt(document.getElementById('water-amount').value) || 800;
      const records = loadData('momRecords') || { waterIntake: [] };
      records.waterIntake.unshift({
        id: `water_${Date.now()}`,
        date: new Date().toISOString().split('T')[0],
        amount
      });
      saveData('momRecords', records);
      document.getElementById('water-amount').value = '';
      showToast('已记录饮水量');
    }
    
    function recordPelvic(sets, reps) {
      const records = loadData('momRecords') || { pelvicFloor: [] };
      records.pelvicFloor.unshift({
        id: `pelvic_${Date.now()}`,
        date: new Date().toISOString().split('T')[0],
        sets,
        reps
      });
      saveData('momRecords', records);
      showToast(`已记录盆底肌训练 (${sets}组 × ${reps}次)`);
    }
    
    function saveDiary() {
      const content = document.getElementById('mom-diary').value;
      if (!content.trim()) {
        showToast('请输入内容');
        return;
      }
      const records = loadData('momRecords') || { diary: [] };
      records.diary.unshift({
        id: `diary_${Date.now()}`,
        date: new Date().toLocaleString('zh-CN'),
        content
      });
      saveData('momRecords', records);
      document.getElementById('mom-diary').value = '';
      showToast('日记已保存');
    }
  </script>
</body>
</html>
