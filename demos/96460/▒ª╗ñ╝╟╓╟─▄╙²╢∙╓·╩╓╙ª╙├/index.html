<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>宝宝成长记 - 首页</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="page-container">
    <header>
      <div class="header-top">
        <div class="baby-info">
          <div class="baby-avatar">👶</div>
          <div>
            <div class="baby-name">小糯米</div>
            <div class="baby-age">12个月</div>
          </div>
        </div>
        <div class="header-actions">
          <button class="action-btn" onclick="navigateTo('pages/report.html')">📋</button>
          <button class="action-btn" onclick="navigateTo('pages/family.html')">👨‍👩‍👧</button>
        </div>
      </div>
      <div class="status-cards">
        <div class="status-card">
          <div class="status-card-icon">🍼</div>
          <div class="status-card-value">4小时前</div>
          <div class="status-card-label">上次喂奶</div>
        </div>
        <div class="status-card">
          <div class="status-card-icon">😴</div>
          <div class="status-card-value">10小时</div>
          <div class="status-card-label">今日睡眠</div>
        </div>
        <div class="status-card">
          <div class="status-card-icon">⚖️</div>
          <div class="status-card-value">9.2kg</div>
          <div class="status-card-label">体重</div>
        </div>
      </div>
    </header>
    
    <main>
      <div class="quick-actions">
        <div class="action-item" onclick="navigateTo('pages/record.html#feed')">
          <div class="action-item-icon feed">🍼</div>
          <div class="action-item-label">喂奶</div>
        </div>
        <div class="action-item" onclick="navigateTo('pages/poop.html')">
          <div class="action-item-icon poop">💩</div>
          <div class="action-item-label">大便</div>
        </div>
        <div class="action-item" onclick="navigateTo('pages/record.html#sleep')">
          <div class="action-item-icon sleep">😴</div>
          <div class="action-item-label">睡眠</div>
        </div>
        <div class="action-item" onclick="navigateTo('pages/record.html#growth')">
          <div class="action-item-icon growth">📏</div>
          <div class="action-item-label">生长</div>
        </div>
        <div class="action-item" onclick="navigateTo('pages/record.html#temp')">
          <div class="action-item-icon temp">🌡️</div>
          <div class="action-item-label">体温</div>
        </div>
        <div class="action-item" onclick="navigateTo('pages/record.html#medication')">
          <div class="action-item-icon medication">💊</div>
          <div class="action-item-label">用药</div>
        </div>
        <div class="action-item" onclick="navigateTo('pages/record.html#milestone')">
          <div class="action-item-icon milestone">🎯</div>
          <div class="action-item-label">里程碑</div>
        </div>
        <div class="action-item" onclick="navigateTo('pages/mom.html')">
          <div class="action-item-icon photo">👩</div>
          <div class="action-item-label">妈妈</div>
        </div>
      </div>
      
      <div class="reminder-section">
        <div class="section-title">📌 今日提醒</div>
        <div class="reminder-list" id="reminder-list"></div>
      </div>
      
      <div class="recent-activity">
        <div class="section-title">📝 家庭动态</div>
        <div class="activity-list" id="activity-list"></div>
      </div>
    </main>
    
    <button class="voice-btn" id="voice-btn">🎤</button>
    
    <nav class="nav-bar">
      <div class="nav-item active">
        <div class="nav-item-icon">🏠</div>
        <div class="nav-item-label">首页</div>
      </div>
      <div class="nav-item" data-page="pages/record.html">
        <div class="nav-item-icon">📝</div>
        <div class="nav-item-label">记录</div>
      </div>
      <div class="nav-item" data-page="pages/community.html">
        <div class="nav-item-icon">💬</div>
        <div class="nav-item-label">社区</div>
      </div>
      <div class="nav-item" data-page="pages/analysis.html">
        <div class="nav-item-icon">📊</div>
        <div class="nav-item-label">分析</div>
      </div>
      <div class="nav-item" data-page="pages/vaccine.html">
        <div class="nav-item-icon">💉</div>
        <div class="nav-item-label">疫苗</div>
      </div>
    </nav>
  </div>
  
  <div class="modal-overlay" id="voice-modal" style="display: none;">
    <div class="modal-content">
      <button class="close-btn" id="close-voice-modal">×</button>
      <div class="modal-title">🎤 语音助手</div>
      <div style="text-align: center; padding: 20px;">
        <div id="voice-result" style="font-size: 16px; color: #666;">正在听...</div>
        <div style="margin-top: 20px; font-size: 12px; color: #999;">
          试试说："记录母乳左侧15分钟"<br>
          "宝宝拉了，黄色稀便"<br>
          "开始哄睡"
        </div>
      </div>
    </div>
  </div>
  
  <script src="data/mock.js"></script>
  <script src="script.js"></script>
</body>
</html>
