<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

header {
  text-align: center;
  padding: 40px 0;
  color: white;
}

header h1 {
  font-size: 36px;
  margin-bottom: 10px;
  font-weight: 700;
}

header p {
  font-size: 16px;
  opacity: 0.9;
}

.role-section {
  background: white;
  border-radius: 20px;
  padding: 30px;
  margin-bottom: 30px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.1);
}

.role-section h2 {
  font-size: 20px;
  margin-bottom: 20px;
  color: #333;
  display: flex;
  align-items: center;
  gap: 10px;
}

.role-section h2 i {
  color: #667eea;
}

.roles {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 20px;
}

.role-card {
  background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
  border-radius: 16px;
  padding: 24px 16px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s ease;
  border: 3px solid transparent;
}

.role-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
}

.role-card.active {
  border-color: #667eea;
  background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
}

.role-card .icon {
  width: 60px;
  height: 60px;
  margin: 0 auto 12px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
}

.role-card.active .icon {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
}

.role-card .role-name {
  font-size: 16px;
  font-weight: 600;
  color: #333;
}

.role-card .role-desc {
  font-size: 12px;
  color: #666;
  margin-top: 4px;
}

.categories-section {
  background: white;
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.1);
}

.categories-section h2 {
  font-size: 20px;
  margin-bottom: 20px;
  color: #333;
  display: flex;
  align-items: center;
  gap: 10px;
}

.categories-section h2 i {
  color: #667eea;
}

.categories {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 25px;
}

.category-btn {
  padding: 10px 20px;
  border: 2px solid #e0e0e0;
  border-radius: 25px;
  background: white;
  color: #666;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.category-btn:hover {
  border-color: #667eea;
  color: #667eea;
}

.category-btn.active {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  border-color: transparent;
  color: white;
}

.links-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.link-card {
  background: #f8f9fa;
  border-radius: 12px;
  padding: 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.link-card:hover {
  background: #e0e7ff;
  transform: translateX(5px);
}

.link-card .favicon {
  width: 48px;
  height: 48px;
  border-radius: 10px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: white;
  flex-shrink: 0;
}

.link-card .link-info {
  flex: 1;
  min-width: 0;
}

.link-card .link-title {
  font-size: 15px;
  font-weight: 600;
  color: #333;
  margin-bottom: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.link-card .link-desc {
  font-size: 12px;
  color: #888;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.link-card .arrow {
  color: #ccc;
  font-size: 14px;
  transition: all 0.3s ease;
}

.link-card:hover .arrow {
  color: #667eea;
  transform: translateX(5px);
}

footer {
  text-align: center;
  padding: 30px 0;
  color: white;
  font-size: 14px;
  opacity: 0.8;
}

footer p {
  margin-bottom: 5px;
}

footer a {
  color: white;
  text-decoration: underline;
}

@media (max-width: 768px) {
  header h1 {
    font-size: 28px;
  }
  
  .roles {
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 15px;
  }
  
  .role-card .icon {
    width: 50px;
    height: 50px;
    font-size: 24px;
  }
  
  .links-grid {
    grid-template-columns: 1fr;
  }
  
  .role-section, .categories-section {
    padding: 20px;
  }
}
</style>

let currentRole = "programmer";
let currentCategory = "全部";

function renderCategories() {
  const categoriesContainer = document.getElementById("categories");
  const data = navData[currentRole];
  
  let html = '<button class="category-btn active" data-category="全部">全部</button>';
  data.categories.forEach(cat => {
    html += `<button class="category-btn" data-category="${cat}">${cat}</button>`;
  });
  
  categoriesContainer.innerHTML = html;
  
  categoriesContainer.querySelectorAll(".category-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      categoriesContainer.querySelectorAll(".category-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentCategory = btn.dataset.category;
      renderLinks();
    });
  });
}

function renderLinks() {
  const linksGrid = document.getElementById("linksGrid");
  const data = navData[currentRole];
  
  let allLinks = [];
  if (currentCategory === "全部") {
    Object.values(data.links).forEach(links => {
      allLinks = allLinks.concat(links);
    });
  } else {
    allLinks = data.links[currentCategory] || [];
  }
  
  let html = "";
  allLinks.forEach(link => {
    html += `
      <div class="link-card" onclick="window.open('${link.url}', '_blank')">
        <div class="favicon"><i class="${link.icon}"></i></div>
        <div class="link-info">
          <div class="link-title">${link.title}</div>
          <div class="link-desc">${link.desc}</div>
        </div>
        <div class="arrow"><i class="fa-solid fa-arrow-right"></i></div>
      </div>
    `;
  });
  
  linksGrid.innerHTML = html;
}

document.querySelectorAll(".role-card").forEach(card => {
  card.addEventListener("click", () => {
    document.querySelectorAll(".role-card").forEach(c => c.classList.remove("active"));
    card.classList.add("active");
    currentRole = card.dataset.role;
    currentCategory = "全部";
    renderCategories();
    renderLinks();
  });
});

renderCategories();
renderLinks();
</script>
