<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>错题伴侣 · 创意原型</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .phone {
      width: 375px;
      background: white;
      border-radius: 44px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.12);
      overflow: hidden;
      position: relative;
      padding: 20px 16px 30px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1e293b;
    }
    .header span {
      background: #eef2ff;
      color: #4f46e5;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 600;
    }
    .upload-card {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      border-radius: 24px;
      padding: 20px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .upload-card:hover { transform: scale(1.02); }
    .upload-card .icon {
      font-size: 38px;
      background: rgba(255,255,255,0.2);
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
    }
    .upload-text h3 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .upload-text p {
      font-size: 13px;
      opacity: 0.85;
    }
    .section-title {
      font-size: 17px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
    }
    .section-title .badge {
      background: #e0e7ff;
      color: #4338ca;
      font-size: 12px;
      margin-left: 8px;
      padding: 2px 10px;
      border-radius: 12px;
    }
    .wrong-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 28px;
    }
    .wrong-item {
      background: #f8fafc;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      align-items: center;
      border: 1px solid #e2e8f0;
    }
    .subject-tag {
      width: 44px;
      height: 44px;
      background: #dbeafe;
      color: #1e40af;
      font-weight: 700;
      font-size: 16px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 14px;
    }
    .wrong-info { flex: 1; }
    .wrong-info .q-title {
      font-weight: 600;
      font-size: 15px;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .wrong-info .q-meta {
      font-size: 12px;
      color: #64748b;
    }
    .ai-suggest {
      background: #fef9c3;
      border-radius: 20px;
      padding: 16px;
      margin-top: 8px;
      border: 1px solid #fde047;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .ai-suggest .ai-text {
      font-size: 14px;
      font-weight: 600;
      color: #854d0e;
    }
    .ai-suggest .ai-btn {
      background: white;
      border: none;
      padding: 8px 16px;
      border-radius: 30px;
      font-weight: 600;
      color: #b45309;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
    }
    .nav-item {
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
    }
    .nav-item.active { color: #4f46e5; font-weight: 600; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="header">
      <h1>📘 错题伴侣</h1>
      <span>学习工作</span>
    </div>

    <!-- 核心功能：拍照录题入口 -->
    <div class="upload-card" onclick="alert('模拟拍照录入：AI将自动识别题目、学科与知识点，生成错题卡片。')">
      <div class="upload-text">
        <h3>📷 拍照录入错题</h3>
        <p>AI 自动识别 · 归类 · 匹配举一反三</p>
      </div>
      <div class="icon">➕</div>
    </div>

    <div class="section-title">
      最近错题 <span class="badge">AI 已整理</span>
    </div>

    <!-- 错题卡片列表 -->
    <div class="wrong-list">
      <div class="wrong-item">
        <div class="subject-tag">数</div>
        <div class="wrong-info">
          <div class="q-title">二次函数对称轴与区间最值</div>
          <div class="q-meta">2026-07-03 · 模考卷T12</div>
        </div>
      </div>
      <div class="wrong-item">
        <div class="subject-tag">英</div>
        <div class="wrong-info">
          <div class="q-title">定语从句 that / which 辨析</div>
          <div class="q-meta">2026-07-02 · 阅读理解摘录</div>
        </div>
      </div>
    </div>

    <!-- 举一反三推荐 -->
    <div class="ai-suggest">
      <span class="ai-text">✨ AI 为你准备了 3 道同类变式题</span>
      <button class="ai-btn" onclick="alert('进入举一反三练习：题目条件变化但知识点相同，帮你真正吃透。')">去练习</button>
    </div>

    <div class="bottom-nav">
      <div class="nav-item active">🏠 错题本</div>
      <div class="nav-item">📊 学情</div>
      <div class="nav-item">👤 我的</div>
    </div>
  </div>
</body>
</html>
