<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>味觉实验室 · 智能食谱平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #E8652D;
    --orange-light: #F5A623;
    --orange-dark: #C94D1A;
    --olive: #5A7A3A;
    --olive-light: #7A9A5A;
    --cream: #FFF8F0;
    --cream-dark: #F5EDE0;
    --dark: #2D2D2D;
    --dark-soft: #4A4A4A;
    --gray: #8A8A8A;
    --gray-light: #D0C8BC;
    --white: #FFFFFF;
    --shadow: 0 8px 32px rgba(0,0,0,0.08);
    --shadow-hover: 0 16px 48px rgba(0,0,0,0.12);
    --radius: 16px;
    --radius-sm: 10px;
    --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', 'Noto Serif SC', -apple-system, sans-serif;
    background: var(--cream);
    color: var(--dark);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(232, 101, 45, 0.06) 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 80% 90%, rgba(90, 122, 58, 0.04) 0%, transparent 60%),
      repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(232, 101, 45, 0.01) 40px, rgba(232, 101, 45, 0.01) 41px);
    pointer-events: none;
    z-index: 0;
  }

  .app { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 0 24px 80px; }

  /* ─── Header ─── */
  .header {
    padding: 40px 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    border-bottom: 2px solid var(--cream-dark);
  }

  .header-brand { display: flex; align-items: center; gap: 16px; }

  .header-logo {
    width: 52px; height: 52px;
    background: linear-gradient(135deg, var(--orange), var(--orange-light));
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    box-shadow: 0 4px 16px rgba(232, 101, 45, 0.3);
  }

  .header-title h1 {
    font-family: 'Playfair Display', 'Noto Serif SC', serif;
    font-size: 28px; font-weight: 700;
    color: var(--dark); letter-spacing: -0.5px;
  }

  .header-title p {
    font-size: 13px; color: var(--gray);
    font-weight: 400; letter-spacing: 1px; margin-top: 2px;
  }

  .header-stats { display: flex; align-items: center; gap: 24px; }

  .stat-item { text-align: center; }
  .stat-item .num {
    font-family: 'Playfair Display', serif;
    font-size: 24px; font-weight: 700;
    color: var(--orange); display: block; line-height: 1;
  }
  .stat-item .label { font-size: 11px; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; }

  /* ─── 选中的食材标签区 ─── */
  .selected-bar {
    padding: 20px 0 8px;
    display: none; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .selected-bar.visible { display: flex; }

  .selected-bar-label {
    font-size: 13px; font-weight: 500; color: var(--dark-soft);
    margin-right: 4px; white-space: nowrap;
  }

  .selected-tag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px 6px 12px; background: var(--white);
    border: 1.5px solid var(--orange); border-radius: 999px;
    font-size: 13px; color: var(--orange); font-weight: 500;
    cursor: pointer; transition: var(--transition);
    animation: tagIn 0.3s ease;
  }
  .selected-tag:hover { background: var(--orange); color: var(--white); }
  .selected-tag .remove { font-size: 14px; line-height: 1; }

  @keyframes tagIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .clear-all-btn {
    padding: 6px 16px; background: transparent;
    border: 1px solid var(--gray-light); border-radius: 999px;
    font-size: 12px; color: var(--gray); cursor: pointer;
    transition: var(--transition); margin-left: 4px;
  }
  .clear-all-btn:hover { border-color: var(--orange); color: var(--orange); }

  /* ─── 食材分类导航 ─── */
  .category-nav {
    display: flex; gap: 8px; padding: 24px 0 16px;
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .category-nav::-webkit-scrollbar { display: none; }

  .category-btn {
    padding: 8px 20px; background: var(--white);
    border: 1.5px solid var(--gray-light); border-radius: 999px;
    font-size: 13px; font-weight: 500; color: var(--dark-soft);
    cursor: pointer; transition: var(--transition); white-space: nowrap; font-family: inherit;
  }
  .category-btn:hover { border-color: var(--orange-light); color: var(--orange); }
  .category-btn.active {
    background: var(--orange); border-color: var(--orange);
    color: var(--white); box-shadow: 0 4px 12px rgba(232, 101, 45, 0.3);
  }

  /* ─── 食材网格 ─── */
  .ingredients-section { margin-bottom: 40px; }

  .section-label {
    font-size: 13px; font-weight: 500; color: var(--gray);
    text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px;
  }

  .ingredients-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 12px;
  }

  .ingredient-card {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 16px 8px 12px; background: var(--white);
    border: 2px solid transparent; border-radius: var(--radius-sm);
    cursor: pointer; transition: var(--transition);
    position: relative; box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    user-select: none;
  }
  .ingredient-card:hover {
    transform: translateY(-3px); box-shadow: var(--shadow);
    border-color: var(--cream-dark);
  }
  .ingredient-card.selected {
    border-color: var(--orange);
    background: linear-gradient(135deg, #FFF5EE, var(--white));
    box-shadow: 0 4px 16px rgba(232, 101, 45, 0.15);
  }
  .ingredient-card .emoji { font-size: 32px; line-height: 1; transition: var(--transition); }
  .ingredient-card.selected .emoji { transform: scale(1.15); }
  .ingredient-card .name { font-size: 12px; font-weight: 500; color: var(--dark-soft); text-align: center; }

  .ingredient-card .check {
    position: absolute; top: 6px; right: 6px;
    width: 20px; height: 20px; background: var(--orange); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--white); font-size: 11px;
    opacity: 0; transform: scale(0.5); transition: var(--transition);
  }
  .ingredient-card.selected .check { opacity: 1; transform: scale(1); }

  /* 食材关联食谱数量角标 */
  .ingredient-card .recipe-count {
    position: absolute; bottom: 4px; right: 6px;
    font-size: 10px; color: var(--gray);
    background: var(--cream); padding: 0 5px;
    border-radius: 6px; line-height: 16px;
  }

  /* ─── 食谱结果区 ─── */
  .recipes-section { margin-top: 8px; }

  .recipes-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
  }
  .recipes-header h2 {
    font-family: 'Playfair Display', 'Noto Serif SC', serif;
    font-size: 22px; font-weight: 600; color: var(--dark);
  }
  .recipes-header .count { font-size: 14px; color: var(--gray); font-weight: 400; }
  .recipes-header .count strong { color: var(--orange); font-weight: 600; }

  .empty-state {
    text-align: center; padding: 60px 20px;
    background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .empty-state .icon { font-size: 56px; margin-bottom: 16px; display: block; }
  .empty-state h3 { font-family: 'Noto Serif SC', serif; font-size: 18px; color: var(--dark); margin-bottom: 8px; }
  .empty-state p { font-size: 14px; color: var(--gray); max-width: 400px; margin: 0 auto; line-height: 1.6; }

  /* 匹配等级区 */
  .match-tier { margin-bottom: 28px; }

  .match-tier-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px;
  }

  .match-tier-header .tier-icon { font-size: 20px; }
  .match-tier-header .tier-label {
    font-family: 'Noto Serif SC', serif;
    font-size: 16px; font-weight: 600; color: var(--dark);
  }
  .match-tier-header .tier-count {
    font-size: 13px; color: var(--gray);
    background: var(--cream-dark); padding: 2px 10px;
    border-radius: 999px;
  }

  .match-tier-header .tier-line {
    flex: 1; height: 1px; background: var(--cream-dark);
  }

  /* ─── 食谱卡片 ─── */
  .recipes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
  }

  .recipe-card {
    background: var(--white); border-radius: var(--radius);
    overflow: hidden; box-shadow: var(--shadow);
    cursor: pointer; transition: var(--transition);
    animation: cardIn 0.5s ease both;
  }
  .recipe-card:hover {
    transform: translateY(-6px); box-shadow: var(--shadow-hover);
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .recipe-card-image {
    height: 170px; background-size: cover; background-position: center;
    position: relative; display: flex; align-items: flex-end; padding: 14px;
  }

  .recipe-card-image .overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.6));
  }

  .recipe-card-image .match-badge {
    position: relative; z-index: 1;
    background: rgba(255,255,255,0.9); backdrop-filter: blur(4px);
    padding: 4px 12px; border-radius: 999px;
    font-size: 12px; font-weight: 600; color: var(--orange);
  }

  .recipe-card-image .match-badge.perfect {
    background: linear-gradient(135deg, #FFD700, #FFA500);
    color: #5A3A00;
  }

  .recipe-card-image .time-badge {
    position: relative; z-index: 1;
    background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
    padding: 4px 12px; border-radius: 999px;
    font-size: 12px; color: var(--white); margin-left: auto;
    display: flex; align-items: center; gap: 4px;
  }

  .recipe-card-body { padding: 16px 18px 18px; }

  .recipe-card-body h3 {
    font-family: 'Noto Serif SC', serif;
    font-size: 18px; font-weight: 600; color: var(--dark); margin-bottom: 6px;
  }

  .recipe-card-body .desc {
    font-size: 13px; color: var(--gray); line-height: 1.5; margin-bottom: 10px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .recipe-card-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  .recipe-card-meta .difficulty {
    padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 500;
  }
  .difficulty.easy { background: #E8F5E9; color: #2E7D32; }
  .difficulty.medium { background: #FFF3E0; color: #E65100; }
  .difficulty.hard { background: #FFEBEE; color: #C62828; }

  .recipe-card-meta .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .recipe-card-meta .tags span {
    padding: 2px 8px; background: var(--cream);
    border-radius: 4px; font-size: 11px; color: var(--dark-soft);
  }

  /* 食材匹配进度条 */
  .match-progress {
    margin-top: 10px; padding-top: 10px;
    border-top: 1px solid var(--cream-dark);
  }

  .match-progress .progress-bar {
    height: 6px; background: var(--cream-dark);
    border-radius: 3px; overflow: hidden; margin-bottom: 6px;
  }

  .match-progress .progress-bar .fill {
    height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--orange-light), var(--orange));
    transition: width 0.6s ease;
  }

  .match-progress .progress-text {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: var(--gray);
  }

  .match-progress .progress-text .missing {
    color: var(--orange); cursor: pointer;
    border-bottom: 1px dashed var(--orange); font-weight: 500;
  }
  .match-progress .progress-text .missing:hover { opacity: 0.7; }

  .matched-ingredients {
    display: flex; gap: 3px; flex-wrap: wrap; margin-top: 4px;
  }
  .matched-ingredients span { font-size: 16px; opacity: 0.4; transition: var(--transition); }
  .matched-ingredients span.matched { opacity: 1; }
  .matched-ingredients span.missing-item { opacity: 0.3; filter: grayscale(1); }

  /* ─── 食谱详情弹窗 ─── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); backdrop-filter: blur(8px);
    z-index: 1000; display: none; align-items: center; justify-content: center;
    padding: 24px; animation: fadeIn 0.3s ease;
  }
  .modal-overlay.open { display: flex; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: var(--white); border-radius: 20px;
    max-width: 720px; width: 100%; max-height: 90vh;
    overflow-y: auto; box-shadow: 0 24px 80px rgba(0,0,0,0.2);
    animation: modalSlide 0.4s ease; position: relative;
  }

  @keyframes modalSlide {
    from { transform: translateY(30px) scale(0.97); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }

  .modal-close {
    position: absolute; top: 16px; right: 16px;
    width: 36px; height: 36px; background: rgba(0,0,0,0.4);
    backdrop-filter: blur(4px); border: none; border-radius: 50%;
    color: var(--white); font-size: 18px; cursor: pointer;
    transition: var(--transition); z-index: 10;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { background: rgba(0,0,0,0.6); transform: rotate(90deg); }

  .modal-image {
    height: 240px; background-size: cover; background-position: center; position: relative;
  }
  .modal-image .overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.5));
  }
  .modal-image .modal-meta {
    position: absolute; bottom: 16px; left: 24px; right: 24px;
    display: flex; gap: 12px; z-index: 1;
  }
  .modal-image .modal-meta span {
    padding: 4px 14px; background: rgba(255,255,255,0.9);
    backdrop-filter: blur(4px); border-radius: 999px; font-size: 13px; color: var(--dark);
  }

  .modal-body { padding: 28px 32px 32px; }

  .modal-body h2 {
    font-family: 'Playfair Display', 'Noto Serif SC', serif;
    font-size: 26px; font-weight: 700; color: var(--dark); margin-bottom: 8px;
  }
  .modal-body .subtitle {
    font-size: 14px; color: var(--gray); line-height: 1.6; margin-bottom: 20px;
  }

  .modal-section { margin-bottom: 24px; }

  .modal-section h4 {
    font-family: 'Noto Serif SC', serif;
    font-size: 15px; font-weight: 600; color: var(--dark);
    margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
  }
  .modal-section h4::after { content: ''; flex: 1; height: 1px; background: var(--cream-dark); }

  .ingredient-list {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px; list-style: none;
  }

  .ingredient-list li {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: var(--cream);
    border-radius: 8px; font-size: 13px; color: var(--dark-soft);
    transition: var(--transition);
  }
  .ingredient-list li .amount { color: var(--orange); font-weight: 500; margin-left: auto; }

  .ingredient-list li .add-btn {
    width: 22px; height: 22px; min-width: 22px;
    background: var(--gray-light); border: none; border-radius: 50%;
    color: var(--white); font-size: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: var(--transition);
  }
  .ingredient-list li .add-btn:hover { background: var(--orange); transform: scale(1.1); }

  .step-list { list-style: none; counter-reset: step; }

  .step-list li {
    counter-increment: step;
    display: flex; gap: 16px; padding: 14px 0;
    border-bottom: 1px solid var(--cream-dark);
  }
  .step-list li:last-child { border-bottom: none; }

  .step-list li::before {
    content: counter(step);
    width: 28px; height: 28px; min-width: 28px;
    background: linear-gradient(135deg, var(--orange), var(--orange-light));
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    color: var(--white); font-size: 13px; font-weight: 600;
  }

  .step-list li .step-content {
    font-size: 14px; line-height: 1.7; color: var(--dark-soft); padding-top: 3px;
  }

  .modal::-webkit-scrollbar { width: 6px; }
  .modal::-webkit-scrollbar-track { background: transparent; }
  .modal::-webkit-scrollbar-thumb { background: var(--gray-light); border-radius: 3px; }

  /* ─── 响应式 ─── */
  @media (max-width: 768px) {
    .app { padding: 0 16px 60px; }
    .header { padding: 24px 0 20px; }
    .header-title h1 { font-size: 22px; }
    .header-logo { width: 44px; height: 44px; font-size: 22px; }
    .header-stats { gap: 16px; }
    .stat-item .num { font-size: 20px; }
    .ingredients-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; }
    .ingredient-card { padding: 12px 6px 10px; }
    .ingredient-card .emoji { font-size: 26px; }
    .recipes-grid { grid-template-columns: 1fr; }
    .modal-body { padding: 20px; }
    .ingredient-list { grid-template-columns: 1fr; }
    .modal-image { height: 180px; }
  }

  @media (max-width: 480px) {
    .header { flex-direction: column; align-items: flex-start; }
    .header-stats { width: 100%; justify-content: space-around; }
    .ingredients-grid { grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; }
    .ingredient-card { padding: 10px 4px 8px; }
    .ingredient-card .emoji { font-size: 22px; }
    .ingredient-card .name { font-size: 11px; }
    .recipes-grid { grid-template-columns: 1fr; }
    .recipe-card-image { height: 150px; }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <header class="header">
    <div class="header-brand">
      <div class="header-logo">🍳</div>
      <div class="header-title">
        <h1>味觉实验室</h1>
        <p>FLAVOR LAB · 智能食谱平台</p>
      </div>
    </div>
    <div class="header-stats">
      <div class="stat-item">
        <span class="num" id="ingredientCount">32</span>
        <span class="label">食材</span>
      </div>
      <div class="stat-item">
        <span class="num" id="recipeCount">22</span>
        <span class="label">食谱</span>
      </div>
    </div>
  </header>

  <!-- 已选食材标签 -->
  <div class="selected-bar" id="selectedBar">
    <span class="selected-bar-label">已选食材：</span>
    <div id="selectedTags"></div>
    <button class="clear-all-btn" onclick="clearAll()">清空全部</button>
  </div>

  <!-- 分类 -->
  <div class="category-nav" id="categoryNav"></div>

  <!-- 食材网格 -->
  <div class="ingredients-section">
    <div class="section-label">点击食材开始选择 · 可多选</div>
    <div class="ingredients-grid" id="ingredientsGrid"></div>
  </div>

  <!-- 食谱结果 -->
  <div class="recipes-section">
    <div class="recipes-header">
      <h2>推荐食谱</h2>
      <span class="count" id="recipeCountDisplay">共 <strong>22</strong> 道食谱</span>
    </div>
    <div id="recipesContainer"></div>
  </div>
</div>

<!-- 详情弹窗 -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalContent" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-image" id="modalImage">
      <div class="overlay"></div>
      <div class="modal-meta" id="modalMeta"></div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
  // ─── 数据 ───
  const CATEGORIES = [
    { id: 'all', label: '全部' },
    { id: 'vegetable', label: '🥬 蔬菜' },
    { id: 'meat', label: '🥩 肉类' },
    { id: 'seafood', label: '🦐 海鲜' },
    { id: 'egg_dairy', label: '🥚 蛋奶豆' },
    { id: 'spice', label: '🧂 调味品' },
    { id: 'staple', label: '🍚 主食' },
  ];

  const INGREDIENTS = [
    { id: 1, name: '番茄', emoji: '🍅', category: 'vegetable' },
    { id: 2, name: '土豆', emoji: '🥔', category: 'vegetable' },
    { id: 3, name: '胡萝卜', emoji: '🥕', category: 'vegetable' },
    { id: 4, name: '洋葱', emoji: '🧅', category: 'vegetable' },

      ingredientIds: [14, 32, 24, 26, 27],
      ingredientAmounts: { 14: '300g', 32: '200g', 24: '3勺', 26: '3片', 27: '3瓣' },
      steps: [
        '五花肉切块，粉条提前用温水泡软。',
        '热锅倒油，放入肉块煸炒至出油。',
        '加入姜片、蒜末、酱油翻炒上色，倒入足量热水。',
        '大火烧开转小火炖30分钟。',
        '加入泡软的粉条继续炖10分钟，加盐调味，收汁即可。'
      ]
    },
    {
      id: 21, name: '蒜蓉空心菜', description: '翠绿鲜嫩，蒜香浓郁，简单又快手的家常素菜。',
      cookTime: '8分钟', difficulty: 'easy', tags: ['素菜', '快手'],
      image: '🌿🧄',
      ingredientIds: [27],
      ingredientAmounts: { 27: '5瓣' },
      steps: [
        '空心菜洗净摘成段，蒜切末。',
        '热锅倒油，放入一半蒜末爆香。',
        '放入空心菜大火快炒至变软。',
        '加盐和剩余蒜末翻炒均匀。',
        '出锅前淋少许香油即可。'
      ]
    },
    {
      id: 22, name: '干煸四季豆', description: '外皮焦香，内里鲜嫩，麻辣鲜香让人停不下筷。',
      cookTime: '20分钟', difficulty: 'medium', tags: ['川菜', '下饭'],
      image: '🫘🌶️',
      ingredientIds: [14, 28, 27, 24],
      ingredientAmounts: { 14: '100g', 28: '4个', 27: '4瓣', 24: '1勺' },
      steps: [
        '四季豆去筋洗净，掰成小段，沥干水分。',
        '热锅多油，放入四季豆中小火煸炒至表皮起皱变软，盛出。',
        '锅中留底油，放入肉末炒散，加入蒜末和辣椒碎炒香。',
        '倒回四季豆，加酱油和盐调味。',
        '大火翻炒均匀，撒上花椒粉即可出锅。'
      ]
    },
  ];

  // ─── 状态 ───
  let selectedIngredients = new Set();
  let activeCategory = 'all';

  // 预计算每个食材关联的食谱数量
  const ingredientRecipeCount = {};
  INGREDIENTS.forEach(ing => {
    ingredientRecipeCount[ing.id] = RECIPES.filter(r => r.ingredientIds.includes(ing.id)).length;
  });

  // ─── 渲染函数 ───
  function renderCategories() {
    const nav = document.getElementById('categoryNav');
    nav.innerHTML = CATEGORIES.map(c =>
      `<button class="category-btn ${c.id === activeCategory ? 'active' : ''}" onclick="setCategory('${c.id}')">${c.label}</button>`
    ).join('');
  }

  function renderIngredients() {
    const grid = document.getElementById('ingredientsGrid');
    const filtered = activeCategory === 'all'
      ? INGREDIENTS
      : INGREDIENTS.filter(i => i.category === activeCategory);

    grid.innerHTML = filtered.map(i => {
      const recipeCount = ingredientRecipeCount[i.id] || 0;
      return `
      <div class="ingredient-card ${selectedIngredients.has(i.id) ? 'selected' : ''}" onclick="toggleIngredient(${i.id})">
        <div class="check">✓</div>
        <span class="emoji">${i.emoji}</span>
        <span class="name">${i.name}</span>
        <span class="recipe-count">${recipeCount}道</span>
      </div>
    `}).join('');
  }

  function renderSelectedBar() {
    const bar = document.getElementById('selectedBar');
    const container = document.getElementById('selectedTags');
    if (selectedIngredients.size === 0) {
      bar.classList.remove('visible');
      return;
    }
    bar.classList.add('visible');
    container.innerHTML = Array.from(selectedIngredients).map(id => {
      const ing = INGREDIENTS.find(i => i.id === id);
      return `<span class="selected-tag" onclick="toggleIngredient(${id})">${ing.emoji} ${ing.name} <span class="remove">✕</span></span>`;
    }).join('');
  }

  function renderRecipes() {
    const container = document.getElementById('recipesContainer');
    const countDisplay = document.getElementById('recipeCountDisplay');

    if (selectedIngredients.size === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <span class="icon">🍽️</span>
          <h3>选择食材，开始探索美食</h3>
          <p>点击上方食材卡片，选择你冰箱里有的食材，系统将为你智能匹配最合适的食谱。选得越多，匹配越准！</p>
        </div>
      `;
      countDisplay.innerHTML = '共 <strong>22</strong> 道食谱，选择食材开始匹配';
      return;
    }

    // 计算每个食谱的匹配情况
    const scored = RECIPES.map(r => {
      const required = r.ingredientIds;
      const matched = required.filter(id => selectedIngredients.has(id));
      const score = matched.length / required.length;
      const missing = required.filter(id => !selectedIngredients.has(id));
      return { ...r, score, matched, missing, matchedCount: matched.length, totalCount: required.length };
    }).filter(r => r.score >= 0.4).sort((a, b) => b.score - a.score || a.totalCount - b.totalCount);

    if (scored.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <span class="icon">🔍</span>
          <h3>暂无匹配食谱</h3>
          <p>当前选择的食材组合没有找到合适的食谱，试试选择更多食材吧！</p>
        </div>
      `;
      countDisplay.innerHTML = '共 <strong>0</strong> 道匹配食谱';
      return;
    }

    countDisplay.innerHTML = `已匹配 <strong>${scored.length}</strong> 道食谱`;

    // 分组：完美匹配（100%）、高度匹配（≥60%）、部分匹配（≥40%）
    const perfect = scored.filter(r => r.score >= 1);
    const high = scored.filter(r => r.score >= 0.6 && r.score < 1);
    const partial = scored.filter(r => r.score >= 0.4 && r.score < 0.6);

    let html = '';

    if (perfect.length > 0) {
      html += renderTier('perfect', '🎯 完美匹配', '食材齐全，直接开做！', perfect);
    }
    if (high.length > 0) {
      html += renderTier('high', '🔥 高度匹配', '差一点点就能做', high);
    }
    if (partial.length > 0) {
      html += renderTier('partial', '💡 部分匹配', '还需补充一些食材', partial);
    }

    container.innerHTML = html;
  }

  function renderTier(tierId, label, hint, recipes) {
    return `
      <div class="match-tier">
        <div class="match-tier-header">
          <span class="tier-icon">${label.split(' ')[0]}</span>
          <span class="tier-label">${label.split(' ').slice(1).join(' ')}</span>
          <span class="tier-count">${recipes.length}道</span>
          <span class="tier-line"></span>
        </div>
        <div class="recipes-grid">
          ${recipes.map((r, idx) => renderRecipeCard(r, idx)).join('')}
        </div>
      </div>
    `;
  }

  function renderRecipeCard(r, idx) {
    const matchPercent = Math.round(r.score * 100);
    const matchBadgeClass = r.score >= 1 ? 'match-badge perfect' : 'match-badge';
    const matchIcon = r.score >= 1 ? '⭐' : r.score >= 0.6 ? '🔥' : '💡';

    // 缺失食材名称
    const missingNames = r.missing.map(id => {
      const ing = INGREDIENTS.find(i => i.id === id);
      return ing ? ing.name : '';
    }).filter(Boolean);

    return `
      <div class="recipe-card" onclick="openRecipe(${r.id})" style="animation-delay: ${idx * 0.04}s">
        <div class="recipe-card-image" style="background: linear-gradient(135deg, ${getGradient(r.id)});">
          <div class="overlay"></div>
          <span class="${matchBadgeClass}">${matchIcon} ${matchPercent}%</span>
          <span class="time-badge">⏱ ${r.cookTime}</span>
        </div>
        <div class="recipe-card-body">
          <h3>${r.name}</h3>
          <p class="desc">${r.description}</p>
          <div class="recipe-card-meta">
            <span class="difficulty ${r.difficulty}">${r.difficulty === 'easy' ? '简单' : r.difficulty === 'medium' ? '中等' : '高级'}</span>
            <div class="tags">
              ${r.tags.map(t => `<span>${t}</span>`).join('')}
            </div>
          </div>
          <div class="match-progress">
            <div class="progress-bar">
              <div class="fill" style="width: ${matchPercent}%"></div>
            </div>
            <div class="progress-text">
              <span>已匹配 ${r.matchedCount}/${r.totalCount} 种食材</span>
              ${r.missing.length > 0 ? `<span class="missing" onclick="event.stopPropagation(); addMissingIngredients([${r.missing.join(',')}])">+ 添加缺少食材</span>` : '<span style="color: var(--olive);">✓ 食材齐全</span>'}
            </div>
            <div class="matched-ingredients">
              ${r.ingredientIds.map(id => {
                const ing = INGREDIENTS.find(i => i.id === id);
                const isMissing = !selectedIngredients.has(id);
                return `<span class="${isMissing ? 'missing-item' : 'matched'}" title="${ing.name}${isMissing ? ' (缺少)' : ''}">${ing.emoji}</span>`;
              }).join('')}
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function getGradient(id) {
    const gradients = [
      'FF6B35,F7C59F', 'F2C14E,F78154', '4B8B3B,8CB369',
      'BC4A3C,E89B6E', '2E6B51,5DA07A', 'D45113,F9A03F',
      '6B2D5C,C75B7A', '3A6B8C,7EB5D6', 'A6332E,D9826B',
      '4A6B3A,8AAF6B', 'C1442A,E8946A', '2D5E3B,6B9E6B',
      'D4462A,F4A261', '3E5A2A,7A9A5A', 'B23A2A,DC8A6A',
      '5A3A2A,9A7A5A', 'D45A2A,F4B26A', '2A5A4A,6A9A7A',
      'C44A2A,E8A06A', '3A5A3A,7A9A5A', 'D44A2A,F0A86A',
      '2A4A3A,6A8A5A'
    ];
    const colors = gradients[id % gradients.length].split(',');
    return `#${colors[0]}, #${colors[1]}`;
  }

  // ─── 交互函数 ───
  function toggleIngredient(id) {
    if (selectedIngredients.has(id)) {
      selectedIngredients.delete(id);
    } else {
      selectedIngredients.add(id);
    }
    renderIngredients();
    renderSelectedBar();
    renderRecipes();
  }

  function setCategory(cat) {
    activeCategory = cat;
    renderCategories();
    renderIngredients();
    document.querySelector('.ingredients-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function clearAll() {
    selectedIngredients.clear();
    renderIngredients();
    renderSelectedBar();
    renderRecipes();
  }

  // 一键添加缺失食材
  function addMissingIngredients(ids) {
    ids.forEach(id => selectedIngredients.add(id));
    renderIngredients();
    renderSelectedBar();
    renderRecipes();
  }

  function openRecipe(id) {
    const r = RECIPES.find(rec => rec.id === id);
    if (!r) return;

    const overlay = document.getElementById('modalOverlay');
    const image = document.getElementById('modalImage');
    const body = document.getElementById('modalBody');

    image.style.background = `linear-gradient(135deg, ${getGradient(r.id)})`;
    image.innerHTML = `
      <div class="overlay"></div>
      <div class="modal-meta" id="modalMeta">
        <span>⏱ ${r.cookTime}</span>
        <span>${r.difficulty === 'easy' ? '简单' : r.difficulty === 'medium' ? '中等' : '高级'}</span>
        <span>${r.image}</span>
      </div>
    `;

    const matchedCount = r.ingredientIds.filter(id => selectedIngredients.has(id)).length;
    const matchPercent = Math.round((matchedCount / r.ingredientIds.length) * 100);

    body.innerHTML = `
      <h2>${r.name}</h2>
      <p class="subtitle">${r.description}</p>

      <div class="modal-section">
        <h4>📝 食材清单</h4>
        <ul class="ingredient-list">
          ${r.ingredientIds.map(id => {
            const ing = INGREDIENTS.find(i => i.id === id);
            const amount = r.ingredientAmounts[id] || '适量';
            const isSelected = selectedIngredients.has(id);
            return `<li style="${isSelected ? 'border-left: 3px solid var(--orange);' : 'opacity:0.6; border-left: 3px solid var(--gray-light);'}">
              <span>${ing.emoji} ${ing.name}</span>
              <span class="amount">${amount}</span>
              ${!isSelected ? `<button class="add-btn" onclick="event.stopPropagation(); toggleIngredient(${id}); closeModal();" title="添加此食材">+</button>` : ''}
            </li>`;
          }).join('')}
        </ul>
        <p style="margin-top: 8px; font-size: 12px; color: var(--gray);">
          已拥有 ${matchedCount}/${r.ingredientIds.length} 种食材 · 匹配度 ${matchPercent}%
        </p>
      </div>

      <div class="modal-section">
        <h4>👩‍🍳 做法步骤</h4>
        <ol class="step-list">
          ${r.steps.map(s => `<li><span class="step-content">${s}</span></li>`).join('')}
        </ol>
      </div>
    `;

    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal(e) {
    if (e && e.target !== document.getElementById('modalOverlay') && e.target !== e.currentTarget) return;
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      document.getElementById('modalOverlay').classList.remove('open');
      document.body.style.overflow = '';
    }
  });

  // ─── 初始化 ───
  renderCategories();
  renderIngredients();
  renderRecipes();
  document.getElementById('ingredientCount').textContent = INGREDIENTS.length;
  document.getElementById('recipeCount').textContent = RECIPES.length;
</script>
</body>
</html>
