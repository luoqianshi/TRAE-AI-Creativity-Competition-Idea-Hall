<!DOCTYPE html>
<html lang="en" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>统计页</title>
    <style id="theme-vars">
/* ============================================
   自由派 (FreeLance Hub) — Brand Design Tokens
   Based on UI Design Specification v1.0
   ============================================ */

:root {
  /* ── Brand Primary ── */
  --color-primary: #4F6EF7;
  --color-primary-light: #EEF1FE;
  --color-primary-dark: #3A54D4;

  /* ── Semantic State Colors ── */
  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* ── Neutral Colors (Light Mode) ── */
  --color-text-primary: #1A1A2E;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-disabled: #D1D5DB;
  --color-bg: #F8F9FC;
  --color-surface: #FFFFFF;
  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;

  /* ── Neutral Colors (Dark Mode) ── */
  --color-text-primary-dark: #F3F4F6;
  --color-text-secondary-dark: #9CA3AF;
  --color-text-tertiary-dark: #6B7280;
  --color-bg-dark: #111827;
  --color-surface-dark: #1F2937;
  --color-border-dark: #374151;

  /* ── Project Type Default Color ── */
  --color-type-default: #D1D5DB;
  --color-type-default-dark: #4B5563;

  /* ── Typography Scale ── */
  --font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
  --font-size-h1: 24px;
  --font-size-h2: 20px;
  --font-size-h3: 17px;
  --font-size-body: 15px;
  --font-size-body-small: 13px;
  --font-size-caption: 11px;
  --font-size-number-large: 28px;
  --font-size-number-medium: 20px;
  --font-size-number-small: 15px;
  --line-height-h1: 32px;
  --line-height-h2: 28px;
  --line-height-h3: 24px;
  --line-height-body: 22px;
  --line-height-body-small: 18px;
  --line-height-caption: 16px;
  --line-height-number-large: 36px;
  --line-height-number-medium: 28px;
  --font-weight-bold: 700;
  --font-weight-semibold: 600;
  --font-weight-medium: 500;
  --font-weight-regular: 400;

  /* ── Spacing System (4px base) ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;

  /* ── Radius Scale ── */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 999px;

  /* ── Shadow System ── */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  --shadow-xl: 0 16px 48px rgba(0,0,0,0.16);

  /* ── Layout Constants ── */
  --nav-height: 44px;
  --tab-bar-height: 49px;
  --tab-bar-safe-area: 34px;
  --page-padding-x: 16px;
  --card-padding: 16px;
  --card-gap: 12px;
  --calendar-cell-min-height: 72px;
  --color-bar-height: 18px;
  --color-bar-radius: 4px;
  --progress-bar-height: 4px;
}

/* ── Dark Mode ── */
html.dark {
  --color-text-primary: var(--color-text-primary-dark);
  --color-text-secondary: var(--color-text-secondary-dark);
  --color-text-tertiary: var(--color-text-tertiary-dark);
  --color-bg: var(--color-bg-dark);
  --color-surface: var(--color-surface-dark);
  --color-border: var(--color-border-dark);
  --color-border-light: var(--color-border-dark);
  --color-type-default: var(--color-type-default-dark);
}

/* ── Typography Classes ── */
.text-h1 { font-size: var(--font-size-h1); font-weight: var(--font-weight-bold); line-height: var(--line-height-h1); }
.text-h2 { font-size: var(--font-size-h2); font-weight: var(--font-weight-semibold); line-height: var(--line-height-h2); }
.text-h3 { font-size: var(--font-size-h3); font-weight: var(--font-weight-semibold); line-height: var(--line-height-h3); }
.text-body { font-size: var(--font-size-body); font-weight: var(--font-weight-regular); line-height: var(--line-height-body); }
.text-body-small { font-size: var(--font-size-body-small); font-weight: var(--font-weight-regular); line-height: var(--line-height-body-small); }
.text-caption { font-size: var(--font-size-caption); font-weight: var(--font-weight-regular); line-height: var(--line-height-caption); }
.text-number-large { font-size: var(--font-size-number-large); font-weight: var(--font-weight-bold); line-height: var(--line-height-number-large); }
.text-number-medium { font-size: var(--font-size-number-medium); font-weight: var(--font-weight-semibold); line-height: var(--line-height-number-medium); }
.text-number-small { font-size: var(--font-size-number-small); font-weight: var(--font-weight-medium); line-height: var(--line-height-number-small); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">

    <!-- ── Navigation Bar ── -->
    <header class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-4" style="height:var(--nav-height);background:var(--color-surface);border-bottom:1px solid var(--color-border-light);max-width:375px;margin:0 auto;">
      <div class="w-9 flex items-center justify-start"></div>
      <h1 class="text-h3" style="color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%;text-align:center;">统计</h1>
      <div class="w-9 flex items-center justify-end">
        <button class="flex items-center gap-0.5" style="font-size:15px;color:var(--color-text-secondary);" data-dom-id="year-selector" aria-label="选择年份">
          <span>2025年</span>
          <i data-lucide="chevron-down" style="width:14px;height:14px;"></i>
        </button>
      </div>
    </header>

    <!-- ── Main Content Area ── -->
    <main style="background:var(--color-bg);padding-top:var(--nav-height);padding-bottom:calc(var(--tab-bar-height) + var(--tab-bar-safe-area));min-height:100vh;">

      <!-- ── Summary Cards ── -->
      <section class="px-4 pt-4" style="display:grid;grid-template-columns:1fr 1fr;gap:var(--card-gap);">
        <!-- 总收入 -->
        <div class="flex flex-col" style="background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:var(--card-padding);">
          <span class="text-body-small" style="color:var(--color-text-secondary);">总收入</span>
          <span class="text-number-large whitespace-nowrap" style="color:var(--color-primary);">¥35,000</span>
        </div>
        <!-- 已收款 -->
        <div class="flex flex-col" style="background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:var(--card-padding);">
          <span class="text-body-small" style="color:var(--color-text-secondary);">已收款</span>
          <span class="text-number-large whitespace-nowrap" style="color:var(--state-success);">¥20,000</span>
        </div>
        <!-- 未收款 -->
        <div class="flex flex-col" style="background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:var(--card-padding);">
          <span class="text-body-small" style="color:var(--color-text-secondary);">未收款</span>
          <span class="text-number-large whitespace-nowrap" style="color:var(--state-warning);">¥15,000</span>
        </div>
        <!-- 总支出 -->
        <div class="flex flex-col" style="background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:var(--card-padding);">
          <span class="text-body-small" style="color:var(--color-text-secondary);">总支出</span>
          <span class="text-number-large whitespace-nowrap" style="color:var(--state-error);">¥5,500</span>
        </div>
        <!-- 总利润 (full width) -->
        <div class="flex flex-col" style="background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:var(--card-padding);grid-column:1/-1;">
          <span class="text-body-small" style="color:var(--color-text-secondary);">总利润</span>
          <span class="text-number-large whitespace-nowrap" style="color:var(--state-success);">¥29,500</span>
        </div>
      </section>

      <!-- ── Monthly Income Bar Chart ── -->
      <section class="px-4 pt-5">
        <h2 class="text-h3" style="color:var(--color-text-primary);margin-bottom:var(--space-3);">月度收入趋势</h2>
        <div style="background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:var(--card-padding);">
          <div style="height:200px;position:relative;display:flex;flex-direction:column;">
            <!-- Grid lines -->
            <div style="position:absolute;top:0;left:0;right:0;bottom:24px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;">
              <div style="border-bottom:1px dashed var(--color-border-light);"></div>
              <div style="border-bottom:1px dashed var(--color-border-light);"></div>
              <div style="border-bottom:1px dashed var(--color-border-light);"></div>
              <div style="border-bottom:1px dashed var(--color-border-light);"></div>
              <div style="border-bottom:1px dashed var(--color-border-light);"></div>
            </div>
            <!-- Bars -->
            <div style="flex:1;display:flex;align-items:flex-end;gap:6px;padding:0 2px;">
              <div class="flex-1 flex flex-col items-center justify-end" style="height:100%;">
                <div style="width:100%;border-radius:4px 4px 0 0;background:color-mix(in srgb, var(--color-primary) 80%, transparent);height:15.4%;" data-dom-id="bar-jan"></div>
              </div>
              <div class="flex-1 flex flex-col items-center justify-end" style="height:100%;">
                <div style="width:100%;border-radius:4px 4px 0 0;background:color-mix(in srgb, var(--color-primary) 80%, transparent);height:23.1%;" data-dom-id="bar-feb"></div>
              </div>
              <div class="flex-1 flex flex-col items-center justify-end" style="height:100%;">
                <div style="width:100%;border-radius:4px 4px 0 0;background:color-mix(in srgb, var(--color-primary) 80%, transparent);height:38.5%;" data-dom-id="bar-mar"></div>
              </div>
              <div class="flex-1 flex flex-col items-center justify-end" style="height:100%;">
                <div style="width:100%;border-radius:4px 4px 0 0;background:color-mix(in srgb, var(--color-primary) 80%, transparent);height:30.8%;" data-dom-id="bar-apr"></div>
              </div>
              <div class="flex-1 flex flex-col items-center justify-end" style="height:100%;">
                <div style="width:100%;border-radius:4px 4px 0 0;background:var(--color-primary);height:61.5%;" data-dom-id="bar-may"></div>
              </div>
              <div class="flex-1 flex flex-col items-center justify-end" style="height:100%;">
                <div style="width:100%;border-radius:4px 4px 0 0;background:var(--color-primary);height:100%;" data-dom-id="bar-jun"></div>
              </div>
              <div class="flex-1 flex flex-col items-center justify-end" style="height:100%;">
                <div style="width:100%;border-radius:4px 4px 0 0;background:color-mix(in srgb, var(--color-primary) 80%, transparent);height:0%;" data-dom-id="bar-jul"></div>
              </div>
              <div class="flex-1 flex flex-col items-center justify-end" style="height:100%;">
                <div style="width:100%;border-radius:4px 4px 0 0;background:color-mix(in srgb, var(--color-primary) 80%, transparent);height:0%;" data-dom-id="bar-aug"></div>
              </div>
              <div class="flex-1 flex flex-col items-center justify-end" style="height:100%;">
                <div style="width:100%;border-radius:4px 4px 0 0;background:color-mix(in srgb, var(--color-primary) 80%, transparent);height:0%;" data-dom-id="bar-sep"></div>
              </div>
              <div class="flex-1 flex flex-col items-center justify-end" style="height:100%;">
                <div style="width:100%;border-radius:4px 4px 0 0;background:color-mix(in srgb, var(--color-primary) 80%, transparent);height:0%;" data-dom-id="bar-oct"></div>
              </div>
              <div class="flex-1 flex flex-col items-center justify-end" style="height:100%;">
                <div style="width:100%;border-radius:4px 4px 0 0;background:color-mix(in srgb, var(--color-primary) 80%, transparent);height:0%;" data-dom-id="bar-nov"></div>
              </div>
              <div class="flex-1 flex flex-col items-center justify-end" style="height:100%;">
                <div style="width:100%;border-radius:4px 4px 0 0;background:color-mix(in srgb, var(--color-primary) 80%, transparent);height:0%;" data-dom-id="bar-dec"></div>
              </div>
            </div>
            <!-- X-axis labels -->
            <div style="display:flex;gap:6px;padding:6px 2px 0;">
              <span class="flex-1 text-center text-caption" style="color:var(--color-text-tertiary);">1月</span>
              <span class="flex-1 text-center text-caption" style="color:var(--color-text-tertiary);">2月</span>
              <span class="flex-1 text-center text-caption" style="color:var(--color-text-tertiary);">3月</span>
              <span class="flex-1 text-center text-caption" style="color:var(--color-text-tertiary);">4月</span>
              <span class="flex-1 text-center text-caption" style="color:var(--color-text-tertiary);">5月</span>
              <span class="flex-1 text-center text-caption" style="color:var(--color-text-tertiary);">6月</span>
              <span class="flex-1 text-center text-caption" style="color:var(--color-text-tertiary);">7月</span>
              <span class="flex-1 text-center text-caption" style="color:var(--color-text-tertiary);">8月</span>
              <span class="flex-1 text-center text-caption" style="color:var(--color-text-tertiary);">9月</span>
              <span class="flex-1 text-center text-caption" style="color:var(--color-text-tertiary);">10月</span>
              <span class="flex-1 text-center text-caption" style="color:var(--color-text-tertiary);">11月</span>
              <span class="flex-1 text-center text-caption" style="color:var(--color-text-tertiary);">12月</span>
            </div>
          </div>
        </div>
      </section>

      <!-- ── Project Type Pie Chart ── -->
      <section class="px-4 pt-5">
        <h2 class="text-h3" style="color:var(--color-text-primary);margin-bottom:var(--space-3);">项目类型收入分布</h2>
        <div style="background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:var(--card-padding);">
          <!-- Pie chart -->
          <div class="flex justify-center" style="padding:8px 0 16px;">
            <div style="width:160px;height:160px;border-radius:50%;background:conic-gradient(var(--state-success) 0deg 162deg, var(--state-info) 162deg 288deg, #F97316 288deg 360deg);" data-dom-id="pie-chart"></div>
          </div>
          <!-- Legend -->
          <div class="flex flex-col" style="gap:12px;">
            <div class="flex items-center" style="gap:8px;">
              <span style="width:8px;height:8px;border-radius:50%;background:var(--state-success);flex-shrink:0;"></span>
              <span class="text-body-small flex-1" style="color:var(--color-text-secondary);">设计</span>
              <span class="text-body-small" style="color:var(--color-text-primary);font-weight:var(--font-weight-medium);">¥15,750</span>
              <span class="text-caption" style="color:var(--color-text-tertiary);">45%</span>
            </div>
            <div class="flex items-center" style="gap:8px;">
              <span style="width:8px;height:8px;border-radius:50%;background:var(--state-info);flex-shrink:0;"></span>
              <span class="text-body-small flex-1" style="color:var(--color-text-secondary);">开发</span>
              <span class="text-body-small" style="color:var(--color-text-primary);font-weight:var(--font-weight-medium);">¥12,250</span>
              <span class="text-caption" style="color:var(--color-text-tertiary);">35%</span>
            </div>
            <div class="flex items-center" style="gap:8px;">
              <span style="width:8px;height:8px;border-radius:50%;background:#F97316;flex-shrink:0;"></span>
              <span class="text-body-small flex-1" style="color:var(--color-text-secondary);">咨询</span>
              <span class="text-body-small" style="color:var(--color-text-primary);font-weight:var(--font-weight-medium);">¥7,000</span>
              <span class="text-caption" style="color:var(--color-text-tertiary);">20%</span>
            </div>
          </div>
        </div>
      </section>

      <!-- ── Project Revenue Ranking ── -->
      <section class="px-4 pt-5 pb-4">
        <h2 class="text-h3" style="color:var(--color-text-primary);margin-bottom:var(--space-3);">项目收入排名</h2>
        <div style="background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:0;">
          <!-- Item 1 -->
          <div class="flex items-center" style="height:48px;padding:0 var(--card-padding);border-bottom:1px solid var(--color-border-light);">
            <span class="text-body" style="color:var(--color-primary);font-weight:var(--font-weight-semibold);width:20px;flex-shrink:0;">1</span>
            <span class="text-body flex-1 min-w-0 truncate" style="color:var(--color-text-primary);padding-left:var(--space-3);">APP界面设计</span>
            <span class="text-body whitespace-nowrap" style="color:var(--color-text-primary);font-weight:var(--font-weight-medium);">¥15,000</span>
          </div>
          <!-- Item 2 -->
          <div class="flex items-center" style="height:48px;padding:0 var(--card-padding);border-bottom:1px solid var(--color-border-light);">
            <span class="text-body" style="color:var(--color-primary);font-weight:var(--font-weight-semibold);width:20px;flex-shrink:0;">2</span>
            <span class="text-body flex-1 min-w-0 truncate" style="color:var(--color-text-primary);padding-left:var(--space-3);">官网改版设计</span>
            <span class="text-body whitespace-nowrap" style="color:var(--color-text-primary);font-weight:var(--font-weight-medium);">¥8,000</span>
          </div>
          <!-- Item 3 -->
          <div class="flex items-center" style="height:48px;padding:0 var(--card-padding);">
            <span class="text-body" style="color:var(--color-primary);font-weight:var(--font-weight-semibold);width:20px;flex-shrink:0;">3</span>
            <span class="text-body flex-1 min-w-0 truncate" style="color:var(--color-text-primary);padding-left:var(--space-3);">Logo设计</span>
            <span class="text-body whitespace-nowrap" style="color:var(--color-text-primary);font-weight:var(--font-weight-medium);">¥2,000</span>
          </div>
        </div>
      </section>

    </main>

    <!-- ── Bottom Tab Bar ── -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 flex items-start" style="height:var(--tab-bar-height);padding-bottom:var(--tab-bar-safe-area);background:var(--color-surface);border-top:1px solid var(--color-border-light);max-width:375px;margin:0 auto;">

      <!-- Tab: 日历 (Calendar) -->
      <a href="calendar.html" class="flex flex-col items-center justify-center flex-1" style="gap:2px;color:var(--color-text-tertiary);" data-dom-id="tab-calendar">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;">
          <rect x="3" y="4" width="18" height="18" rx="4"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span style="font-size:var(--font-size-caption);color:var(--color-text-tertiary);">日历</span>
      </a>

      <!-- Tab: 列表 (List) -->
      <a href="list.html" class="flex flex-col items-center justify-center flex-1" style="gap:2px;color:var(--color-text-tertiary);" data-dom-id="tab-list">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;">
          <rect x="3" y="3" width="18" height="18" rx="4"/>
          <line x1="8" y1="8" x2="16" y2="8"/>
          <line x1="8" y1="12" x2="16" y2="12"/>
          <line x1="8" y1="16" x2="13" y2="16"/>
        </svg>
        <span style="font-size:var(--font-size-caption);color:var(--color-text-tertiary);">列表</span>
      </a>

      <!-- Tab: 统计 (Stats) — ACTIVE -->
      <a href="stats.html" class="flex flex-col items-center justify-center flex-1" style="gap:2px;" data-dom-id="tab-stats">
        <svg viewBox="0 0 24 24" fill="var(--color-primary)" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;">
          <rect x="3" y="3" width="18" height="18" rx="4"/>
