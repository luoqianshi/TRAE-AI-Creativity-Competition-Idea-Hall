<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>列表页</title>
    <style id="theme-vars">
/* ============================================
   自由派 (FreeLance Hub) — Brand Design Tokens
   Based on UI Design Specification v1.0
   ============================================ */

:root {
  /* ── Brand Primary ── */
  --color-primary: #4F6EF7;
  --color-primary-light: #EEF1FE;
  --color-primary-dark: #3A54D4;

  /* ── Semantic State Colors ── */
  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* ── Neutral Colors (Light Mode) ── */
  --color-text-primary: #1A1A2E;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-disabled: #D1D5DB;
  --color-bg: #F8F9FC;
  --color-surface: #FFFFFF;
  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;

  /* ── Neutral Colors (Dark Mode) ── */
  --color-text-primary-dark: #F3F4F6;
  --color-text-secondary-dark: #9CA3AF;
  --color-text-tertiary-dark: #6B7280;
  --color-bg-dark: #111827;
  --color-surface-dark: #1F2937;
  --color-border-dark: #374151;

  /* ── Project Type Default Color ── */
  --color-type-default: #D1D5DB;
  --color-type-default-dark: #4B5563;

  /* ── Typography Scale ── */
  --font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
  --font-size-h1: 24px;
  --font-size-h2: 20px;
  --font-size-h3: 17px;
  --font-size-body: 15px;
  --font-size-body-small: 13px;
  --font-size-caption: 11px;
  --font-size-number-large: 28px;
  --font-size-number-medium: 20px;
  --font-size-number-small: 15px;
  --line-height-h1: 32px;
  --line-height-h2: 28px;
  --line-height-h3: 24px;
  --line-height-body: 22px;
  --line-height-body-small: 18px;
  --line-height-caption: 16px;
  --line-height-number-large: 36px;
  --line-height-number-medium: 28px;
  --font-weight-bold: 700;
  --font-weight-semibold: 600;
  --font-weight-medium: 500;
  --font-weight-regular: 400;

  /* ── Spacing System (4px base) ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;

  /* ── Radius Scale ── */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 999px;

  /* ── Shadow System ── */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  --shadow-xl: 0 16px 48px rgba(0,0,0,0.16);

  /* ── Layout Constants ── */
  --nav-height: 44px;
  --tab-bar-height: 49px;
  --tab-bar-safe-area: 34px;
  --page-padding-x: 16px;
  --card-padding: 16px;
  --card-gap: 12px;
  --calendar-cell-min-height: 72px;
  --color-bar-height: 18px;
  --color-bar-radius: 4px;
  --progress-bar-height: 4px;
}

/* ── Dark Mode ── */
html.dark {
  --color-text-primary: var(--color-text-primary-dark);
  --color-text-secondary: var(--color-text-secondary-dark);
  --color-text-tertiary: var(--color-text-tertiary-dark);
  --color-bg: var(--color-bg-dark);
  --color-surface: var(--color-surface-dark);
  --color-border: var(--color-border-dark);
  --color-border-light: var(--color-border-dark);
  --color-type-default: var(--color-type-default-dark);
}

/* ── Typography Classes ── */
.text-h1 { font-size: var(--font-size-h1); font-weight: var(--font-weight-bold); line-height: var(--line-height-h1); }
.text-h2 { font-size: var(--font-size-h2); font-weight: var(--font-weight-semibold); line-height: var(--line-height-h2); }
.text-h3 { font-size: var(--font-size-h3); font-weight: var(--font-weight-semibold); line-height: var(--line-height-h3); }
.text-body { font-size: var(--font-size-body); font-weight: var(--font-weight-regular); line-height: var(--line-height-body); }
.text-body-small { font-size: var(--font-size-body-small); font-weight: var(--font-weight-regular); line-height: var(--line-height-body-small); }
.text-caption { font-size: var(--font-size-caption); font-weight: var(--font-weight-regular); line-height: var(--line-height-caption); }
.text-number-large { font-size: var(--font-size-number-large); font-weight: var(--font-weight-bold); line-height: var(--line-height-number-large); }
.text-number-medium { font-size: var(--font-size-number-medium); font-weight: var(--font-weight-semibold); line-height: var(--line-height-number-medium); }
.text-number-small { font-size: var(--font-size-number-small); font-weight: var(--font-weight-medium); line-height: var(--line-height-number-small); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen" style="background:var(--color-bg); padding-top:var(--nav-height); padding-bottom:calc(var(--tab-bar-height) + var(--tab-bar-safe-area) + 68px);">

      <!-- ── Navigation Bar ── -->
      <header class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-4" style="height:var(--nav-height); background:var(--color-surface); border-bottom:1px solid var(--color-border-light);">
        <h1 class="text-h3 truncate" style="color:var(--color-text-primary);">列表</h1>
        <div class="flex items-center gap-1" style="font-size:15px; color:var(--color-text-secondary); cursor:pointer;">
          <span>月度</span>
          <span style="font-size:12px;">▾</span>
        </div>
      </header>

      <!-- ── Search Bar ── -->
      <div class="px-4 pt-3 pb-1">
        <div class="relative flex items-center" style="height:40px; background:var(--color-bg); border-radius:var(--radius-full);">
          <i data-lucide="search" class="absolute left-3" style="width:16px; height:16px; color:var(--color-text-tertiary);"></i>
          <input type="text" placeholder="搜索项目或日程..." class="w-full bg-transparent outline-none" style="padding-left:36px; padding-right:16px; font-size:15px; color:var(--color-text-primary);" readonly>
        </div>
      </div>

      <!-- ── Project Cards ── -->
      <div class="px-4 pt-2 flex flex-col gap-3">

        <!-- Card 1: 官网改版设计 -->
        <div class="rounded-lg p-4 cursor-pointer" style="background:var(--color-surface); box-shadow:var(--shadow-sm); border-radius:var(--radius-lg);" data-dom-id="project-card-click">
          <!-- Title Row -->
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2 min-w-0">
              <span class="shrink-0" style="width:10px; height:10px; border-radius:50%; background:#22C55E;"></span>
              <span class="text-h3 truncate" style="color:var(--color-text-primary);">官网改版设计</span>
            </div>
            <span class="shrink-0" style="color:var(--color-text-tertiary); font-size:20px;">›</span>
          </div>
          <!-- Customer -->
          <p class="mt-1" style="font-size:13px; color:var(--color-text-secondary);">客户：XX科技</p>
          <!-- Amount Grid 2×2 -->
          <div class="grid grid-cols-2 gap-3 mt-3">
            <div class="rounded-lg p-3" style="background:var(--color-bg); border-radius:var(--radius-md);">
              <span class="text-caption" style="color:var(--color-text-tertiary);">项目金额</span>
              <div class="text-number-medium whitespace-nowrap" style="color:var(--color-text-primary);">¥8,000</div>
            </div>
            <div class="rounded-lg p-3" style="background:var(--color-bg); border-radius:var(--radius-md);">
              <span class="text-caption" style="color:var(--color-text-tertiary);">项目支出</span>
              <div class="text-number-medium whitespace-nowrap" style="color:var(--color-text-primary);">¥2,000</div>
            </div>
            <div class="rounded-lg p-3" style="background:var(--color-bg); border-radius:var(--radius-md);">
              <span class="text-caption" style="color:var(--color-text-tertiary);">利润</span>
              <div class="text-number-medium whitespace-nowrap" style="color:#22C55E;">¥6,000</div>
            </div>
            <div class="rounded-lg p-3" style="background:var(--color-bg); border-radius:var(--radius-md);">
              <span class="text-caption" style="color:var(--color-text-tertiary);">已收/未收</span>
              <div class="text-number-small whitespace-nowrap" style="color:var(--color-text-secondary);">5k/3k</div>
            </div>
          </div>
          <!-- Date Range -->
          <p class="mt-3" style="font-size:13px; color:var(--color-text-secondary);">6月12日 - 6月28日 (共8天)</p>
          <!-- Progress Bar -->
          <div class="flex items-center gap-2 mt-2">
            <div class="flex-1" style="height:4px; background:var(--color-border-light); border-radius:var(--radius-full); overflow:hidden;">
              <div style="width:80%; height:100%; background:var(--color-primary); border-radius:var(--radius-full);"></div>
            </div>
            <span class="text-caption shrink-0" style="color:var(--color-text-secondary);">80%</span>
          </div>
        </div>

        <!-- Card 2: APP界面设计 -->
        <div class="rounded-lg p-4 cursor-pointer" style="background:var(--color-surface); box-shadow:var(--shadow-sm); border-radius:var(--radius-lg);" data-dom-id="project-card-click">
          <!-- Title Row -->
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2 min-w-0">
              <span class="shrink-0" style="width:10px; height:10px; border-radius:50%; background:#3B82F6;"></span>
              <span class="text-h3 truncate" style="color:var(--color-text-primary);">APP界面设计</span>
            </div>
            <span class="shrink-0" style="color:var(--color-text-tertiary); font-size:20px;">›</span>
          </div>
          <!-- Customer -->
          <p class="mt-1" style="font-size:13px; color:var(--color-text-secondary);">客户：YY网络</p>
          <!-- Amount Grid 2×2 -->
          <div class="grid grid-cols-2 gap-3 mt-3">
            <div class="rounded-lg p-3" style="background:var(--color-bg); border-radius:var(--radius-md);">
              <span class="text-caption" style="color:var(--color-text-tertiary);">项目金额</span>
              <div class="text-number-medium whitespace-nowrap" style="color:var(--color-text-primary);">¥15,000</div>
            </div>
            <div class="rounded-lg p-3" style="background:var(--color-bg); border-radius:var(--radius-md);">
              <span class="text-caption" style="color:var(--color-text-tertiary);">项目支出</span>
              <div class="text-number-medium whitespace-nowrap" style="color:var(--color-text-primary);">¥500</div>
            </div>
            <div class="rounded-lg p-3" style="background:var(--color-bg); border-radius:var(--radius-md);">
              <span class="text-caption" style="color:var(--color-text-tertiary);">利润</span>
              <div class="text-number-medium whitespace-nowrap" style="color:#22C55E;">¥14,500</div>
            </div>
            <div class="rounded-lg p-3" style="background:var(--color-bg); border-radius:var(--radius-md);">
              <span class="text-caption" style="color:var(--color-text-tertiary);">已收/未收</span>
              <div class="text-number-small whitespace-nowrap" style="color:var(--color-text-secondary);">0/15k</div>
            </div>
          </div>
          <!-- Date Range -->
          <p class="mt-3" style="font-size:13px; color:var(--color-text-secondary);">6月15日 - 6月30日 (共12天)</p>
          <!-- Progress Bar -->
          <div class="flex items-center gap-2 mt-2">
            <div class="flex-1" style="height:4px; background:var(--color-border-light); border-radius:var(--radius-full); overflow:hidden;">
              <div style="width:35%; height:100%; background:var(--color-primary); border-radius:var(--radius-full);"></div>
            </div>
            <span class="text-caption shrink-0" style="color:var(--color-text-secondary);">35%</span>
          </div>
        </div>

        <!-- Card 3: Logo设计 -->
        <div class="rounded-lg p-4 cursor-pointer" style="background:var(--color-surface); box-shadow:var(--shadow-sm); border-radius:var(--radius-lg);" data-dom-id="project-card-click">
          <!-- Title Row -->
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2 min-w-0">
              <span class="shrink-0" style="width:10px; height:10px; border-radius:50%; background:#F97316;"></span>
              <span class="text-h3 truncate" style="color:var(--color-text-primary);">Logo设计</span>
            </div>
            <span class="shrink-0" style="color:var(--color-text-tertiary); font-size:20px;">›</span>
          </div>
          <!-- Customer -->
          <p class="mt-1" style="font-size:13px; color:var(--color-text-secondary);">客户：ZZ咨询</p>
          <!-- Amount Grid 2×2 -->
          <div class="grid grid-cols-2 gap-3 mt-3">
            <div class="rounded-lg p-3" style="background:var(--color-bg); border-radius:var(--radius-md);">
              <span class="text-caption" style="color:var(--color-text-tertiary);">项目金额</span>
              <div class="text-number-medium whitespace-nowrap" style="color:var(--color-text-primary);">¥2,000</div>
            </div>
            <div class="rounded-lg p-3" style="background:var(--color-bg); border-radius:var(--radius-md);">
              <span class="text-caption" style="color:var(--color-text-tertiary);">项目支出</span>
              <div class="text-number-medium whitespace-nowrap" style="color:var(--color-text-primary);">¥0</div>
            </div>
            <div class="rounded-lg p-3" style="background:var(--color-bg); border-radius:var(--radius-md);">
              <span class="text-caption" style="color:var(--color-text-tertiary);">利润</span>
              <div class="text-number-medium whitespace-nowrap" style="color:#22C55E;">¥2,000</div>
            </div>
            <div class="rounded-lg p-3" style="background:var(--color-bg); border-radius:var(--radius-md);">
              <span class="text-caption" style="color:var(--color-text-tertiary);">已收/未收</span>
              <div class="text-number-small whitespace-nowrap" style="color:#22C55E;">已收¥2,000 | 已结清 ✓</div>
            </div>
          </div>
          <!-- Date Range -->
          <p class="mt-3" style="font-size:13px; color:var(--color-text-secondary);">6月20日 (共1天)</p>
        </div>

      </div>

      <!-- ── Fixed Bottom Button: 新建项目 ── -->
      <div class="fixed left-0 right-0 z-40 px-4" style="bottom:calc(var(--tab-bar-height) + var(--tab-bar-safe-area) + 8px);">
        <button class="w-full flex items-center justify-center" style="height:48px; background:var(--color-primary); color:var(--color-surface); font-size:15px; font-weight:var(--font-weight-semibold); border-radius:var(--radius-lg); border:none; cursor:pointer;" data-dom-id="btn-create-project">
          新建项目
        </button>
      </div>

      <!-- ── Bottom Tab Bar ── -->
      <nav class="fixed bottom-0 left-0 right-0 z-50 flex items-start" style="height:var(--tab-bar-height); padding-bottom:var(--tab-bar-safe-area); background:var(--color-surface); border-top:1px solid var(--color-border-light);">

        <!-- Tab: 日历 -->
        <a href="calendar.html" class="flex flex-col items-center justify-center flex-1 gap-0.5" style="color:var(--color-text-tertiary);" data-dom-id="tab-calendar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px; height:20px;">
            <rect x="3" y="4" width="18" height="18" rx="4"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <span style="font-size:var(--font-size-caption);">日历</span>
        </a>

        <!-- Tab: 列表 (Active) -->
        <a href="list.html" class="flex flex-col items-center justify-center flex-1 gap-0.5" style="color:var(--color-primary);" data-dom-id="tab-list">
          <svg viewBox="0 0 24 24" fill="var(--color-primary)" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px; height:20px;">
            <rect x="3" y="3" width="18" height="18" rx="4"/>
            <line x1="8" y1="8" x2="16" y2="8" stroke="var(--color-surface)" stroke-width="2"/>
            <line x1="8" y1="12" x2="16" y2="12" stroke="var(--color-surface)" stroke-width="2"/>
            <line x1="8" y1="16" x2="13" y2="16" stroke="var(--color-surface)" stroke-width="2"/>
          </svg>
          <span style="font-size:var(--font-size-caption); color:var(--color-primary);">列表</span>
        </a>

        <!-- Tab: 统计 -->
        <a href="stats.html" class="flex flex-col items-center justify-center flex-1 gap-0.5" style="color:var(--color-text-tertiary);" data-dom-id="tab-stats">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px; height:20px;">
            <rect x="3" y="3" width="18" height="18" rx="4"/>
            <rect x="7" y="13" width="3" height="5" rx="1"/>
            <rect x="11" y="9" width="3" height="9" rx="1"/>
            <rect x="15" y="6" width="3" height="12" rx="1"/>
          </svg>
          <span style="font-size:var(--font-size-caption);">统计</span>
        </a>

        <!-- Tab: 设置 -->
        <a href="settings.html" class="flex flex-col items-center justify-center flex-1 gap-0.5" style="color:var(--color-text-tertiary);" data-dom-id="tab-settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px; height:20px;">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1.08z"/>
          </svg>
          <span style="font-size:var(--font-size-caption);">设置</span>
        </a>

      </nav>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
