<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled</title>
    <style id="theme-vars">
/* ============================================
   自由派 (FreeLance Hub) — Brand Design Tokens
   Based on UI Design Specification v1.0
   ============================================ */

:root {
  /* ── Brand Primary ── */
  --color-primary: #4F6EF7;
  --color-primary-light: #EEF1FE;
  --color-primary-dark: #3A54D4;

  /* ── Semantic State Colors ── */
  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* ── Neutral Colors (Light Mode) ── */
  --color-text-primary: #1A1A2E;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-disabled: #D1D5DB;
  --color-bg: #F8F9FC;
  --color-surface: #FFFFFF;
  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;

  /* ── Neutral Colors (Dark Mode) ── */
  --color-text-primary-dark: #F3F4F6;
  --color-text-secondary-dark: #9CA3AF;
  --color-text-tertiary-dark: #6B7280;
  --color-bg-dark: #111827;
  --color-surface-dark: #1F2937;
  --color-border-dark: #374151;

  /* ── Project Type Default Color ── */
  --color-type-default: #D1D5DB;
  --color-type-default-dark: #4B5563;

  /* ── Typography Scale ── */
  --font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
  --font-size-h1: 24px;
  --font-size-h2: 20px;
  --font-size-h3: 17px;
  --font-size-body: 15px;
  --font-size-body-small: 13px;
  --font-size-caption: 11px;
  --font-size-number-large: 28px;
  --font-size-number-medium: 20px;
  --font-size-number-small: 15px;
  --line-height-h1: 32px;
  --line-height-h2: 28px;
  --line-height-h3: 24px;
  --line-height-body: 22px;
  --line-height-body-small: 18px;
  --line-height-caption: 16px;
  --line-height-number-large: 36px;
  --line-height-number-medium: 28px;
  --font-weight-bold: 700;
  --font-weight-semibold: 600;
  --font-weight-medium: 500;
  --font-weight-regular: 400;

  /* ── Spacing System (4px base) ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;

  /* ── Radius Scale ── */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 999px;

  /* ── Shadow System ── */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  --shadow-xl: 0 16px 48px rgba(0,0,0,0.16);

  /* ── Layout Constants ── */
  --nav-height: 44px;
  --tab-bar-height: 49px;
  --tab-bar-safe-area: 34px;
  --page-padding-x: 16px;
  --card-padding: 16px;
  --card-gap: 12px;
  --calendar-cell-min-height: 72px;
  --color-bar-height: 18px;
  --color-bar-radius: 4px;
  --progress-bar-height: 4px;
}

/* ── Dark Mode ── */
html.dark {
  --color-text-primary: var(--color-text-primary-dark);
  --color-text-secondary: var(--color-text-secondary-dark);
  --color-text-tertiary: var(--color-text-tertiary-dark);
  --color-bg: var(--color-bg-dark);
  --color-surface: var(--color-surface-dark);
  --color-border: var(--color-border-dark);
  --color-border-light: var(--color-border-dark);
  --color-type-default: var(--color-type-default-dark);
}

/* ── Typography Classes ── */
.text-h1 { font-size: var(--font-size-h1); font-weight: var(--font-weight-bold); line-height: var(--line-height-h1); }
.text-h2 { font-size: var(--font-size-h2); font-weight: var(--font-weight-semibold); line-height: var(--line-height-h2); }
.text-h3 { font-size: var(--font-size-h3); font-weight: var(--font-weight-semibold); line-height: var(--line-height-h3); }
.text-body { font-size: var(--font-size-body); font-weight: var(--font-weight-regular); line-height: var(--line-height-body); }
.text-body-small { font-size: var(--font-size-body-small); font-weight: var(--font-weight-regular); line-height: var(--line-height-body-small); }
.text-caption { font-size: var(--font-size-caption); font-weight: var(--font-weight-regular); line-height: var(--line-height-caption); }
.text-number-large { font-size: var(--font-size-number-large); font-weight: var(--font-weight-bold); line-height: var(--line-height-number-large); }
.text-number-medium { font-size: var(--font-size-number-medium); font-weight: var(--font-weight-semibold); line-height: var(--line-height-number-medium); }
.text-number-small { font-size: var(--font-size-number-small); font-weight: var(--font-weight-medium); line-height: var(--line-height-number-small); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen" style="background: var(--color-bg);">
        <!-- Navigation Bar -->
        <header class="sticky top-0 z-30 flex items-center justify-between px-4" style="height: var(--nav-height); background: var(--color-surface); border-bottom: 1px solid var(--color-border-light);">
            <button class="text-body" style="color: var(--color-text-secondary); background: none; border: none; cursor: pointer; padding: 0;" data-dom-id="btn-cancel">取消</button>
            <h1 class="text-h3" style="color: var(--color-text-primary); margin: 0;">新建项目</h1>
            <button class="text-body" style="color: var(--color-primary); font-weight: var(--font-weight-semibold); background: none; border: none; cursor: pointer; padding: 0;" data-dom-id="btn-save-project">保存</button>
        </header>

        <!-- Scrollable Form Content -->
        <div class="px-4 pb-6" style="padding-top: var(--space-4); padding-bottom: var(--space-6);">

            <!-- Section: 项目信息 -->
            <section class="mb-3" style="background: var(--color-surface); border-radius: var(--radius-lg); padding: var(--card-padding);">
                <!-- 项目名称 -->
                <div class="mb-3">
                    <label class="block text-body mb-1" style="color: var(--color-text-primary); font-size: var(--font-size-body);">项目名称<span style="color: var(--state-error);">*</span></label>
                    <input type="text" placeholder="输入项目名称" class="w-full outline-none" style="height: 44px; background: var(--color-bg); border-radius: var(--radius-md); border: 1px solid var(--color-border); padding: 0 var(--space-4); font-size: var(--font-size-body); color: var(--color-text-primary);" data-dom-id="input-project-name">
                </div>
                <!-- 客户名称 -->
                <div class="mb-3">
                    <label class="block text-body mb-1" style="color: var(--color-text-primary); font-size: var(--font-size-body);">客户名称</label>
                    <input type="text" placeholder="输入或选择客户" class="w-full outline-none" style="height: 44px; background: var(--color-bg); border-radius: var(--radius-md); border: 1px solid var(--color-border); padding: 0 var(--space-4); font-size: var(--font-size-body); color: var(--color-text-primary);" data-dom-id="input-client-name">
                </div>
                <!-- 项目类型 -->
                <div>
                    <label class="block text-body mb-1" style="color: var(--color-text-primary); font-size: var(--font-size-body);">项目类型</label>
                    <div class="relative">
                        <select class="w-full outline-none appearance-none" style="height: 44px; background: var(--color-bg); border-radius: var(--radius-md); border: 1px solid var(--color-border); padding: 0 var(--space-10) 0 var(--space-4); font-size: var(--font-size-body); color: var(--color-text-tertiary);" data-dom-id="select-project-type">
                            <option value="" disabled selected>选择类型</option>
                        </select>
                        <i data-lucide="chevron-down" class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none" style="width: 16px; height: 16px; color: var(--color-text-tertiary);"></i>
                    </div>
                    <!-- Type Color Dots -->
                    <div class="flex items-center gap-3 mt-3" style="gap: 12px;" data-dom-id="type-color-dots">
                        <span class="shrink-0 rounded-full" style="width: 8px; height: 8px; background: #22C55E;"></span>
                        <span class="shrink-0 rounded-full" style="width: 8px; height: 8px; background: #3B82F6;"></span>
                        <span class="shrink-0 rounded-full" style="width: 8px; height: 8px; background: #F97316;"></span>
                        <span class="shrink-0 rounded-full" style="width: 8px; height: 8px; background: #8B5CF6;"></span>
                        <span class="shrink-0 rounded-full" style="width: 8px; height: 8px; background: #EF4444;"></span>
                        <span class="shrink-0 rounded-full" style="width: 8px; height: 8px; background: #14B8A6;"></span>
                    </div>
                </div>
            </section>

            <!-- Section: 金额信息 -->
            <section class="mb-3" style="background: var(--color-surface); border-radius: var(--radius-lg); padding: var(--card-padding);">
                <!-- 项目金额 -->
                <div class="mb-3">
                    <label class="block text-body mb-1" style="color: var(--color-text-primary); font-size: var(--font-size-body);">项目金额</label>
                    <div class="flex items-center w-full" style="height: 44px; background: var(--color-bg); border-radius: var(--radius-md); border: 1px solid var(--color-border); padding: 0 var(--space-4); overflow: hidden;">
                        <span class="text-body shrink-0" style="color: var(--color-text-secondary); margin-right: var(--space-2);">¥</span>
                        <input type="number" placeholder="0.00" class="flex-1 outline-none bg-transparent" style="font-size: var(--font-size-body); color: var(--color-text-primary); border: none; padding: 0; min-width: 0;" data-dom-id="input-project-amount">
                    </div>
                </div>
                <!-- 项目支出 -->
                <div class="mb-3">
                    <label class="block text-body mb-1" style="color: var(--color-text-primary); font-size: var(--font-size-body);">项目支出</label>
                    <div class="flex items-center w-full" style="height: 44px; background: var(--color-bg); border-radius: var(--radius-md); border: 1px solid var(--color-border); padding: 0 var(--space-4); overflow: hidden;">
                        <span class="text-body shrink-0" style="color: var(--color-text-secondary); margin-right: var(--space-2);">¥</span>
                        <input type="number" placeholder="0.00" class="flex-1 outline-none bg-transparent" style="font-size: var(--font-size-body); color: var(--color-text-primary); border: none; padding: 0; min-width: 0;" data-dom-id="input-project-expense">
                    </div>
                </div>
                <!-- 项目利润 -->
                <div class="mb-3">
                    <label class="block text-body mb-1" style="color: var(--color-text-primary); font-size: var(--font-size-body);">项目利润</label>
                    <div class="flex items-center w-full" style="height: 44px; background: var(--color-bg); border-radius: var(--radius-md); border: 1px solid var(--color-border); padding: 0 var(--space-4);">
                        <span class="text-body shrink-0" style="color: var(--color-text-tertiary); margin-right: var(--space-2);">¥自动计算</span>
                        <span class="text-body shrink-0" style="color: var(--state-success); font-weight: var(--font-weight-bold);">¥6,000</span>
                    </div>
                </div>
                <!-- 已收金额 -->
                <div>
                    <label class="block text-body mb-1" style="color: var(--color-text-primary); font-size: var(--font-size-body);">已收金额</label>
                    <div class="flex items-center w-full" style="height: 44px; background: var(--color-bg); border-radius: var(--radius-md); border: 1px solid var(--color-border); padding: 0 var(--space-4); overflow: hidden;">
                        <span class="text-body shrink-0" style="color: var(--color-text-secondary); margin-right: var(--space-2);">¥</span>
                        <input type="number" placeholder="0.00" class="flex-1 outline-none bg-transparent" style="font-size: var(--font-size-body); color: var(--color-text-primary); border: none; padding: 0; min-width: 0;" data-dom-id="input-received-amount">
                    </div>
                </div>
            </section>

            <!-- Section: 日程日期 -->
            <section class="mb-3" style="background: var(--color-surface); border-radius: var(--radius-lg); padding: var(--card-padding);">
                <h2 class="text-h3 mb-3" style="color: var(--color-text-primary); font-size: var(--font-size-body); font-weight: var(--font-weight-semibold);">日程日期</h2>
                <!-- Date Row 1 -->
                <div class="flex items-center" style="height: 48px; border-bottom: 1px solid var(--color-border-light);" data-dom-id="date-row-1">
                    <div class="shrink-0 flex items-center justify-center" style="width: 20px; height: 20px; border-radius: 4px; background: var(--color-primary); margin-right: var(--space-3);">
                        <i data-lucide="check" style="width: 12px; height: 12px; color: #FFFFFF;"></i>
                    </div>
                    <span class="text-body" style="color: var(--color-text-primary); margin-right: var(--space-3);">6月12日</span>
                    <span class="text-body-small" style="color: var(--color-text-tertiary);">09:00-18:00</span>
                </div>
                <!-- Date Row 2 -->
                <div class="flex items-center" style="height: 48px; border-bottom: 1px solid var(--color-border-light);" data-dom-id="date-row-2">
                    <div class="shrink-0 flex items-center justify-center" style="width: 20px; height: 20px; border-radius: 4px; background: var(--color-primary); margin-right: var(--space-3);">
                        <i data-lucide="check" style="width: 12px; height: 12px; color: #FFFFFF;"></i>
                    </div>
                    <span class="text-body" style="color: var(--color-text-primary); margin-right: var(--space-3);">6月13日</span>
                    <span class="text-body-small" style="color: var(--color-text-tertiary);">09:00-18:00</span>
                </div>
                <!-- Date Row 3 -->
                <div class="flex items-center" style="height: 48px;" data-dom-id="date-row-3">
                    <div class="shrink-0 flex items-center justify-center" style="width: 20px; height: 20px; border-radius: 4px; background: var(--color-primary); margin-right: var(--space-3);">
                        <i data-lucide="check" style="width: 12px; height: 12px; color: #FFFFFF;"></i>
                    </div>
                    <span class="text-body" style="color: var(--color-text-primary); margin-right: var(--space-3);">6月16日</span>
                    <span class="text-body-small" style="color: var(--color-text-tertiary);">14:00-18:00</span>
                </div>
                <!-- Add Date Button -->
                <button class="text-body" style="color: var(--color-primary); background: none; border: none; cursor: pointer; padding-top: var(--space-3); font-size: var(--font-size-body);" data-dom-id="btn-add-date">+ 添加日期</button>
            </section>

            <!-- Section: 备注 -->
            <section class="mb-3" style="background: var(--color-surface); border-radius: var(--radius-lg); padding: var(--card-padding);">
                <textarea placeholder="添加备注..." class="w-full outline-none resize-none" style="height: 80px; background: var(--color-bg); border-radius: var(--radius-md); border: 1px solid var(--color-border); padding: var(--space-3) var(--space-4); font-size: var(--font-size-body); color: var(--color-text-primary);" data-dom-id="textarea-notes"></textarea>
            </section>

        </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
