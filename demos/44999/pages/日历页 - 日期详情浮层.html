<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日历页 - 日期详情浮层</title>
    <style id="theme-vars">
/* ============================================
   自由派 (FreeLance Hub) — Brand Design Tokens
   Based on UI Design Specification v1.0
   ============================================ */

:root {
  /* ── Brand Primary ── */
  --color-primary: #4F6EF7;
  --color-primary-light: #EEF1FE;
  --color-primary-dark: #3A54D4;

  /* ── Semantic State Colors ── */
  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* ── Neutral Colors (Light Mode) ── */
  --color-text-primary: #1A1A2E;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-disabled: #D1D5DB;
  --color-bg: #F8F9FC;
  --color-surface: #FFFFFF;
  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;

  /* ── Neutral Colors (Dark Mode) ── */
  --color-text-primary-dark: #F3F4F6;
  --color-text-secondary-dark: #9CA3AF;
  --color-text-tertiary-dark: #6B7280;
  --color-bg-dark: #111827;
  --color-surface-dark: #1F2937;
  --color-border-dark: #374151;

  /* ── Project Type Default Color ── */
  --color-type-default: #D1D5DB;
  --color-type-default-dark: #4B5563;

  /* ── Typography Scale ── */
  --font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
  --font-size-h1: 24px;
  --font-size-h2: 20px;
  --font-size-h3: 17px;
  --font-size-body: 15px;
  --font-size-body-small: 13px;
  --font-size-caption: 11px;
  --font-size-number-large: 28px;
  --font-size-number-medium: 20px;
  --font-size-number-small: 15px;
  --line-height-h1: 32px;
  --line-height-h2: 28px;
  --line-height-h3: 24px;
  --line-height-body: 22px;
  --line-height-body-small: 18px;
  --line-height-caption: 16px;
  --line-height-number-large: 36px;
  --line-height-number-medium: 28px;
  --font-weight-bold: 700;
  --font-weight-semibold: 600;
  --font-weight-medium: 500;
  --font-weight-regular: 400;

  /* ── Spacing System (4px base) ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;

  /* ── Radius Scale ── */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 999px;

  /* ── Shadow System ── */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  --shadow-xl: 0 16px 48px rgba(0,0,0,0.16);

  /* ── Layout Constants ── */
  --nav-height: 44px;
  --tab-bar-height: 49px;
  --tab-bar-safe-area: 34px;
  --page-padding-x: 16px;
  --card-padding: 16px;
  --card-gap: 12px;
  --calendar-cell-min-height: 72px;
  --color-bar-height: 18px;
  --color-bar-radius: 4px;
  --progress-bar-height: 4px;
}

/* ── Dark Mode ── */
html.dark {
  --color-text-primary: var(--color-text-primary-dark);
  --color-text-secondary: var(--color-text-secondary-dark);
  --color-text-tertiary: var(--color-text-tertiary-dark);
  --color-bg: var(--color-bg-dark);
  --color-surface: var(--color-surface-dark);
  --color-border: var(--color-border-dark);
  --color-border-light: var(--color-border-dark);
  --color-type-default: var(--color-type-default-dark);
}

/* ── Typography Classes ── */
.text-h1 { font-size: var(--font-size-h1); font-weight: var(--font-weight-bold); line-height: var(--line-height-h1); }
.text-h2 { font-size: var(--font-size-h2); font-weight: var(--font-weight-semibold); line-height: var(--line-height-h2); }
.text-h3 { font-size: var(--font-size-h3); font-weight: var(--font-weight-semibold); line-height: var(--line-height-h3); }
.text-body { font-size: var(--font-size-body); font-weight: var(--font-weight-regular); line-height: var(--line-height-body); }
.text-body-small { font-size: var(--font-size-body-small); font-weight: var(--font-weight-regular); line-height: var(--line-height-body-small); }
.text-caption { font-size: var(--font-size-caption); font-weight: var(--font-weight-regular); line-height: var(--line-height-caption); }
.text-number-large { font-size: var(--font-size-number-large); font-weight: var(--font-weight-bold); line-height: var(--line-height-number-large); }
.text-number-medium { font-size: var(--font-size-number-medium); font-weight: var(--font-weight-semibold); line-height: var(--line-height-number-medium); }
.text-number-small { font-size: var(--font-size-number-small); font-weight: var(--font-weight-medium); line-height: var(--line-height-number-small); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="relative min-h-screen" style="background:var(--color-bg);">

      <!-- ═══════════════════════════════════════════
           Dimmed Calendar Background (visual context)
           ═══════════════════════════════════════════ -->
      <div class="pointer-events-none select-none" style="opacity:0.35;">

        <!-- Nav Bar -->
        <header class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-4" style="height:var(--nav-height);background:var(--color-surface);border-bottom:1px solid var(--color-border-light);max-width:375px;margin:0 auto;">
          <div class="flex items-center justify-start" style="width:36px;"></div>
          <h1 class="text-h3 truncate" style="color:var(--color-text-primary);max-width:60%;text-align:center;">自由派</h1>
          <div class="flex items-center justify-end" style="width:36px;"></div>
        </header>

        <!-- Calendar Grid (ghosted) -->
        <div style="padding-top:var(--nav-height);padding:0 var(--page-padding-x);">
          <!-- Month header -->
          <div class="flex items-center justify-between py-3">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="var(--color-text-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 15L7.5 10L12.5 5"/></svg>
            <span class="text-h3" style="color:var(--color-text-primary);">2025年6月</span>
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="var(--color-text-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 5L12.5 10L7.5 15"/></svg>
          </div>
          <!-- Weekday headers -->
          <div class="grid grid-cols-7 text-center">
            <span class="text-caption" style="color:var(--color-text-tertiary);padding:4px 0;">日</span>
            <span class="text-caption" style="color:var(--color-text-tertiary);padding:4px 0;">一</span>
            <span class="text-caption" style="color:var(--color-text-tertiary);padding:4px 0;">二</span>
            <span class="text-caption" style="color:var(--color-text-tertiary);padding:4px 0;">三</span>
            <span class="text-caption" style="color:var(--color-text-tertiary);padding:4px 0;">四</span>
            <span class="text-caption" style="color:var(--color-text-tertiary);padding:4px 0;">五</span>
            <span class="text-caption" style="color:var(--color-text-tertiary);padding:4px 0;">六</span>
          </div>
          <!-- Calendar cells (June 2025 starts on Sunday) -->
          <div class="grid grid-cols-7 text-center gap-y-1">
            <!-- Row 1: Jun 1 (Sun) - Jun 7 (Sat) -->
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">1</span></div>
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">2</span></div>
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">3</span></div>
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">4</span></div>
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">5</span></div>
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">6</span></div>
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">7</span></div>
            <!-- Row 2: Jun 8 - Jun 14 -->
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">8</span></div>
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">9</span></div>
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">10</span></div>
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">11</span></div>
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">12</span></div>
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">13</span></div>
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">14</span></div>
            <!-- Row 3: Jun 15 - Jun 21 -->
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">15</span></div>
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">16</span></div>
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">17</span></div>
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">18</span></div>
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">19</span></div>
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">20</span></div>
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">21</span></div>
            <!-- Row 4: Jun 22 - Jun 28 (23 is Monday, highlighted) -->
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">22</span></div>
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-surface);width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-full);background:var(--color-primary);font-weight:var(--font-weight-medium);">23</span></div>
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">24</span></div>
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">25</span></div>
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">26</span></div>
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">27</span></div>
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">28</span></div>
            <!-- Row 5: Jun 29 - Jun 30 -->
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">29</span></div>
            <div class="flex flex-col items-center py-1"><span class="text-body-small" style="color:var(--color-text-primary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;">30</span></div>
          </div>
        </div>
      </div>

      <!-- ═══════════════════════════════════════════
           Semi-transparent Backdrop Overlay
           ═══════════════════════════════════════════ -->
      <div class="fixed inset-0 z-40" style="background:rgba(0,0,0,0.4);" data-dom-id="sheet-backdrop"></div>

      <!-- ═══════════════════════════════════════════
           Bottom Sheet
           ═══════════════════════════════════════════ -->
      <div class="fixed bottom-0 left-0 right-0 z-50 flex flex-col" style="max-width:375px;margin:0 auto;max-height:60vh;background:var(--color-surface);border-radius:var(--radius-xl) var(--radius-xl) 0 0;box-shadow:var(--shadow-lg);">

        <!-- Drag Handle -->
        <div class="flex justify-center pt-3 pb-1">
          <div style="width:36px;height:4px;border-radius:var(--radius-full);background:var(--color-border);"></div>
        </div>

        <!-- Sheet Title -->
        <div class="px-4 pt-3 pb-2">
          <h2 class="text-h3" style="color:var(--color-text-primary);">6月23日 周一</h2>
        </div>

        <!-- Schedule List -->
        <div class="flex-1 overflow-y-auto px-4" style="padding-bottom:var(--space-3);">

          <!-- Schedule Item 1 -->
          <div class="flex items-start gap-3" style="background:var(--color-bg);border-radius:var(--radius-md);padding:12px var(--space-4);" data-dom-id="sheet-schedule-item">
            <div class="shrink-0 mt-1" style="width:8px;height:8px;border-radius:var(--radius-full);background:#22C55E;"></div>
            <div class="flex-1 min-w-0">
              <p class="text-body truncate" style="color:var(--color-text-primary);font-weight:var(--font-weight-medium);">官网改版设计</p>
              <p class="text-body-small truncate" style="color:var(--color-text-secondary);margin-top:2px;">XX科技  ¥8,000  09:00-18:00</p>
            </div>
          </div>

          <!-- Schedule Item 2 -->
          <div class="flex items-start gap-3 mt-3" style="background:var(--color-bg);border-radius:var(--radius-md);padding:12px var(--space-4);" data-dom-id="sheet-schedule-item">
            <div class="shrink-0 mt-1" style="width:8px;height:8px;border-radius:var(--radius-full);background:#3B82F6;"></div>
            <div class="flex-1 min-w-0">
              <p class="text-body truncate" style="color:var(--color-text-primary);font-weight:var(--font-weight-medium);">APP界面设计</p>
              <p class="text-body-small truncate" style="color:var(--color-text-secondary);margin-top:2px;">YY网络  ¥15,000  14:00-18:00</p>
            </div>
          </div>

        </div>

        <!-- Bottom Action -->
        <div class="flex justify-center pb-4 pt-2">
          <button class="inline-flex items-center justify-center whitespace-nowrap" style="font-size:var(--font-size-body);font-weight:var(--font-weight-medium);color:var(--color-primary);background:none;border:none;padding:var(--space-3) var(--space-4);cursor:pointer;" data-dom-id="sheet-add-schedule">添加日程</button>
        </div>

      </div>

      <!-- ═══════════════════════════════════════════
           Bottom Tab Bar
           ═══════════════════════════════════════════ -->
      <nav class="fixed bottom-0 left-0 right-0 z-30 flex items-start" style="max-width:375px;margin:0 auto;height:var(--tab-bar-height);padding-bottom:var(--tab-bar-safe-area);background:var(--color-surface);border-top:1px solid var(--color-border-light);">

        <!-- Tab: 日历 (active) -->
        <a href="calendar.html" class="flex flex-col items-center justify-center flex-1 gap-0.5" style="color:var(--color-primary);" data-dom-id="tab-calendar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--color-primary)" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="4"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
            <circle cx="12" cy="16" r="1.5" fill="var(--color-surface)" stroke="var(--color-surface)"/>
          </svg>
          <span style="font-size:var(--font-size-caption);">日历</span>
        </a>

        <!-- Tab: 列表 -->
        <a href="list.html" class="flex flex-col items-center justify-center flex-1 gap-0.5" style="color:var(--color-text-tertiary);" data-dom-id="tab-list">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="4"/>
            <line x1="8" y1="8" x2="16" y2="8"/>
            <line x1="8" y1="12" x2="16" y2="12"/>
            <line x1="8" y1="16" x2="13" y2="16"/>
          </svg>
          <span style="font-size:var(--font-size-caption);">列表</span>
        </a>

        <!-- Tab: 统计 -->
        <a href="stats.html" class="flex flex-col items-center justify-center flex-1 gap-0.5" style="color:var(--color-text-tertiary);" data-dom-id="tab-stats">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="4"/>
            <rect x="7" y="13" width="3" height="5" rx="1"/>
            <rect x="11" y="9" width="3" height="9" rx="1"/>
            <rect x="15" y="6" width="3" height="12" rx="1"/>
          </svg>
          <span style="font-size:var(--font-size-caption);">统计</span>
        </a>

        <!-- Tab: 设置 -->
        <a href="settings.html" class="flex flex-col items-center justify-center flex-1 gap-0.5" style="color:var(--color-text-tertiary);" data-dom-id="tab-settings">
