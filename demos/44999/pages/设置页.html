<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置页</title>
    <style id="theme-vars">
/* ============================================
   自由派 (FreeLance Hub) — Brand Design Tokens
   Based on UI Design Specification v1.0
   ============================================ */

:root {
  /* ── Brand Primary ── */
  --color-primary: #4F6EF7;
  --color-primary-light: #EEF1FE;
  --color-primary-dark: #3A54D4;

  /* ── Semantic State Colors ── */
  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* ── Neutral Colors (Light Mode) ── */
  --color-text-primary: #1A1A2E;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-disabled: #D1D5DB;
  --color-bg: #F8F9FC;
  --color-surface: #FFFFFF;
  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;

  /* ── Neutral Colors (Dark Mode) ── */
  --color-text-primary-dark: #F3F4F6;
  --color-text-secondary-dark: #9CA3AF;
  --color-text-tertiary-dark: #6B7280;
  --color-bg-dark: #111827;
  --color-surface-dark: #1F2937;
  --color-border-dark: #374151;

  /* ── Project Type Default Color ── */
  --color-type-default: #D1D5DB;
  --color-type-default-dark: #4B5563;

  /* ── Typography Scale ── */
  --font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
  --font-size-h1: 24px;
  --font-size-h2: 20px;
  --font-size-h3: 17px;
  --font-size-body: 15px;
  --font-size-body-small: 13px;
  --font-size-caption: 11px;
  --font-size-number-large: 28px;
  --font-size-number-medium: 20px;
  --font-size-number-small: 15px;
  --line-height-h1: 32px;
  --line-height-h2: 28px;
  --line-height-h3: 24px;
  --line-height-body: 22px;
  --line-height-body-small: 18px;
  --line-height-caption: 16px;
  --line-height-number-large: 36px;
  --line-height-number-medium: 28px;
  --font-weight-bold: 700;
  --font-weight-semibold: 600;
  --font-weight-medium: 500;
  --font-weight-regular: 400;

  /* ── Spacing System (4px base) ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;

  /* ── Radius Scale ── */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 999px;

  /* ── Shadow System ── */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  --shadow-xl: 0 16px 48px rgba(0,0,0,0.16);

  /* ── Layout Constants ── */
  --nav-height: 44px;
  --tab-bar-height: 49px;
  --tab-bar-safe-area: 34px;
  --page-padding-x: 16px;
  --card-padding: 16px;
  --card-gap: 12px;
  --calendar-cell-min-height: 72px;
  --color-bar-height: 18px;
  --color-bar-radius: 4px;
  --progress-bar-height: 4px;
}

/* ── Dark Mode ── */
html.dark {
  --color-text-primary: var(--color-text-primary-dark);
  --color-text-secondary: var(--color-text-secondary-dark);
  --color-text-tertiary: var(--color-text-tertiary-dark);
  --color-bg: var(--color-bg-dark);
  --color-surface: var(--color-surface-dark);
  --color-border: var(--color-border-dark);
  --color-border-light: var(--color-border-dark);
  --color-type-default: var(--color-type-default-dark);
}

/* ── Typography Classes ── */
.text-h1 { font-size: var(--font-size-h1); font-weight: var(--font-weight-bold); line-height: var(--line-height-h1); }
.text-h2 { font-size: var(--font-size-h2); font-weight: var(--font-weight-semibold); line-height: var(--line-height-h2); }
.text-h3 { font-size: var(--font-size-h3); font-weight: var(--font-weight-semibold); line-height: var(--line-height-h3); }
.text-body { font-size: var(--font-size-body); font-weight: var(--font-weight-regular); line-height: var(--line-height-body); }
.text-body-small { font-size: var(--font-size-body-small); font-weight: var(--font-weight-regular); line-height: var(--line-height-body-small); }
.text-caption { font-size: var(--font-size-caption); font-weight: var(--font-weight-regular); line-height: var(--line-height-caption); }
.text-number-large { font-size: var(--font-size-number-large); font-weight: var(--font-weight-bold); line-height: var(--line-height-number-large); }
.text-number-medium { font-size: var(--font-size-number-medium); font-weight: var(--font-weight-semibold); line-height: var(--line-height-number-medium); }
.text-number-small { font-size: var(--font-size-number-small); font-weight: var(--font-weight-medium); line-height: var(--line-height-number-small); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="font-family: var(--font-family);">

    <!-- ── Navigation Bar ── -->
    <header class="fixed top-0 left-0 right-0 z-50 flex items-center justify-center" style="height: var(--nav-height); background: var(--color-surface); border-bottom: 1px solid var(--color-border-light); max-width: 375px; margin: 0 auto;">
      <h1 class="text-h3" style="color: var(--color-text-primary); white-space: nowrap;">设置</h1>
    </header>

    <!-- ── Main Content Area ── -->
    <main style="background: var(--color-bg); padding-top: var(--nav-height); padding-bottom: calc(var(--tab-bar-height) + var(--tab-bar-safe-area)); min-height: 100vh;">

      <!-- ════════════════════════════════════════
           Group 1: 日历显示设置
           ════════════════════════════════════════ -->
      <div style="margin-top: 24px; margin-bottom: 8px; padding-left: 16px; padding-right: 16px;">
        <p style="font-size: var(--font-size-body-small); font-weight: var(--font-weight-medium); color: var(--color-text-secondary);">日历显示设置</p>
      </div>
      <div style="margin-left: 16px; margin-right: 16px; background: var(--color-surface); border-radius: var(--radius-lg);">
        <div class="flex items-center justify-between" style="height: 48px; padding-left: 16px; padding-right: 16px; border-bottom: 1px solid var(--color-border-light);">
          <div class="min-w-0 flex-1">
            <p class="truncate" style="font-size: var(--font-size-body); font-weight: var(--font-weight-regular); color: var(--color-text-primary);">日历日格显示信息</p>
            <p class="truncate" style="font-size: var(--font-size-body-small); color: var(--color-text-tertiary); margin-top: 2px;">已选：项目名称 + 项目金额</p>
          </div>
          <div class="shrink-0 flex items-center gap-1" style="margin-left: 8px;">
            <span style="font-size: var(--font-size-body-small); color: var(--color-text-tertiary);">编辑</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>
      </div>

      <!-- ════════════════════════════════════════
           Group 2: 项目类型管理
           ════════════════════════════════════════ -->
      <div style="margin-top: 24px; margin-bottom: 8px; padding-left: 16px; padding-right: 16px;">
        <p style="font-size: var(--font-size-body-small); font-weight: var(--font-weight-medium); color: var(--color-text-secondary);">项目类型管理</p>
      </div>
      <div style="margin-left: 16px; margin-right: 16px; background: var(--color-surface); border-radius: var(--radius-lg);">
        <div class="flex items-center justify-between" style="height: 48px; padding-left: 16px; padding-right: 16px;">
          <p class="truncate" style="font-size: var(--font-size-body); font-weight: var(--font-weight-regular); color: var(--color-text-primary);">项目类型管理</p>
          <div class="shrink-0 flex items-center gap-1" style="margin-left: 8px;">
            <span style="font-size: var(--font-size-body-small); color: var(--color-text-tertiary);">编辑</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>
        <!-- Type tag preview row -->
        <div class="flex flex-wrap gap-2" style="padding: 0 16px 12px;">
          <span class="inline-flex items-center justify-center whitespace-nowrap" style="font-size: var(--font-size-body-small); font-weight: var(--font-weight-medium); color: #22C55E; background: rgba(34,197,94,0.15); border-radius: var(--radius-full); padding: 4px 10px;">设计</span>
          <span class="inline-flex items-center justify-center whitespace-nowrap" style="font-size: var(--font-size-body-small); font-weight: var(--font-weight-medium); color: #3B82F6; background: rgba(59,130,246,0.15); border-radius: var(--radius-full); padding: 4px 10px;">开发</span>
          <span class="inline-flex items-center justify-center whitespace-nowrap" style="font-size: var(--font-size-body-small); font-weight: var(--font-weight-medium); color: #F97316; background: rgba(249,115,22,0.15); border-radius: var(--radius-full); padding: 4px 10px;">咨询</span>
          <span class="inline-flex items-center justify-center whitespace-nowrap" style="font-size: var(--font-size-body-small); font-weight: var(--font-weight-medium); color: #8B5CF6; background: rgba(139,92,246,0.15); border-radius: var(--radius-full); padding: 4px 10px;">写作</span>
          <span class="inline-flex items-center justify-center whitespace-nowrap" style="font-size: var(--font-size-body-small); font-weight: var(--font-weight-medium); color: #EF4444; background: rgba(239,68,68,0.15); border-radius: var(--radius-full); padding: 4px 10px;">培训</span>
        </div>
      </div>

      <!-- ════════════════════════════════════════
           Group 3: 客户管理
           ════════════════════════════════════════ -->
      <div style="margin-top: 24px; margin-bottom: 8px; padding-left: 16px; padding-right: 16px;">
        <p style="font-size: var(--font-size-body-small); font-weight: var(--font-weight-medium); color: var(--color-text-secondary);">客户管理</p>
      </div>
      <div style="margin-left: 16px; margin-right: 16px; background: var(--color-surface); border-radius: var(--radius-lg);">
        <div class="flex items-center justify-between" style="height: 48px; padding-left: 16px; padding-right: 16px;">
          <div class="min-w-0 flex-1">
            <p class="truncate" style="font-size: var(--font-size-body); font-weight: var(--font-weight-regular); color: var(--color-text-primary);">客户管理</p>
            <p class="truncate" style="font-size: var(--font-size-body-small); color: var(--color-text-tertiary); margin-top: 2px;">已关联 8 位客户</p>
          </div>
          <div class="shrink-0 flex items-center gap-1" style="margin-left: 8px;">
            <span style="font-size: var(--font-size-body-small); color: var(--color-text-tertiary);">编辑</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>
      </div>

      <!-- ════════════════════════════════════════
           Group 4: 数据管理
           ════════════════════════════════════════ -->
      <div style="margin-top: 24px; margin-bottom: 8px; padding-left: 16px; padding-right: 16px;">
        <p style="font-size: var(--font-size-body-small); font-weight: var(--font-weight-medium); color: var(--color-text-secondary);">数据管理</p>
      </div>
      <div style="margin-left: 16px; margin-right: 16px; background: var(--color-surface); border-radius: var(--radius-lg);">
        <div class="flex items-center justify-between" style="height: 48px; padding-left: 16px; padding-right: 16px; border-bottom: 1px solid var(--color-border-light);">
          <p class="truncate" style="font-size: var(--font-size-body); font-weight: var(--font-weight-regular); color: var(--color-text-primary);">导出数据 (CSV)</p>
          <div class="shrink-0 flex items-center gap-1" style="margin-left: 8px;">
            <span style="font-size: var(--font-size-body-small); color: var(--color-text-tertiary);">导出</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>
        <div class="flex items-center justify-between" style="height: 48px; padding-left: 16px; padding-right: 16px; border-bottom: 1px solid var(--color-border-light);">
          <p class="truncate" style="font-size: var(--font-size-body); font-weight: var(--font-weight-regular); color: var(--color-text-primary);">本地备份</p>
          <div class="shrink-0 flex items-center gap-1" style="margin-left: 8px;">
            <span style="font-size: var(--font-size-body-small); color: var(--color-text-tertiary);">备份</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>
        <div class="flex items-center justify-between" style="height: 48px; padding-left: 16px; padding-right: 16px;">
          <p class="truncate" style="font-size: var(--font-size-body); font-weight: var(--font-weight-regular); color: var(--color-text-primary);">从备份恢复</p>
          <div class="shrink-0 flex items-center gap-1" style="margin-left: 8px;">
            <span style="font-size: var(--font-size-body-small); color: var(--color-text-tertiary);">恢复</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>
      </div>

      <!-- ════════════════════════════════════════
           Group 5: 通用设置
           ════════════════════════════════════════ -->
      <div style="margin-top: 24px; margin-bottom: 8px; padding-left: 16px; padding-right: 16px;">
        <p style="font-size: var(--font-size-body-small); font-weight: var(--font-weight-medium); color: var(--color-text-secondary);">通用设置</p>
      </div>
      <div style="margin-left: 16px; margin-right: 16px; background: var(--color-surface); border-radius: var(--radius-lg);">
        <div class="flex items-center justify-between" style="height: 48px; padding-left: 16px; padding-right: 16px; border-bottom: 1px solid var(--color-border-light);">
          <p class="truncate" style="font-size: var(--font-size-body); font-weight: var(--font-weight-regular); color: var(--color-text-primary);">默认视图：月度</p>
          <div class="shrink-0" style="margin-left: 8px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>
        <div class="flex items-center justify-between" style="height: 48px; padding-left: 16px; padding-right: 16px; border-bottom: 1px solid var(--color-border-light);">
          <p class="truncate" style="font-size: var(--font-size-body); font-weight: var(--font-weight-regular); color: var(--color-text-primary);">每周起始日：周一</p>
          <div class="shrink-0" style="margin-left: 8px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>
        <div class="flex items-center justify-between" style="height: 48px; padding-left: 16px; padding-right: 16px; border-bottom: 1px solid var(--color-border-light);">
          <p class="truncate" style="font-size: var(--font-size-body); font-weight: var(--font-weight-regular); color: var(--color-text-primary);">货币单位：¥</p>
          <div class="shrink-0" style="margin-left: 8px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>
        <div class="flex items-center justify-between" style="height: 48px; padding-left: 16px; padding-right: 16px; border-bottom: 1px solid var(--color-border-light);">
          <p class="truncate" style="font-size: var(--font-size-body); font-weight: var(--font-weight-regular); color: var(--color-text-primary);">深色模式：跟随系统</p>
          <!-- Toggle switch (ON state) -->
          <div class="shrink-0" style="margin-left: 8px;">
            <div class="inline-flex items-center" style="width: 51px; height: 31px; border-radius: var(--radius-full); background: var(--color-primary); padding: 2px; cursor: pointer;" data-dom-id="toggle-dark-mode">
              <div style="width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; box-shadow: var(--shadow-sm); margin-left: auto; transition: margin 0.2s;"></div>
            </div>
          </div>
        </div>
        <div class="flex items-center justify-between" style="height: 48px; padding-left: 16px; padding-right: 16px;">
          <p class="truncate" style="font-size: var(--font-size-body); font-weight: var(--font-weight-regular); color: var(--color-text-primary);">语言：简体中文</p>
          <div class="shrink-0" style="margin-left: 8px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>
      </div>

      <!-- ════════════════════════════════════════
           Group 6: 关于
           ════════════════════════════════════════ -->
      <div style="margin-top: 24px; margin-bottom: 8px; padding-left: 16px; padding-right: 16px;">
        <p style="font-size: var(--font-size-body-small); font-weight: var(--font-weight-medium); color: var(--color-text-secondary);">关于</p>
      </div>
      <div style="margin-left: 16px; margin-right: 16px; margin-bottom: 24px; background: var(--color-surface); border-radius: var(--radius-lg);">
        <div class="flex items-center" style="height: 48px; padding-left: 16px; padding-right: 16px; border-bottom: 1px solid var(--color-border-light);">
          <p class="truncate" style="font-size: var(--font-size-body); font-weight: var(--font-weight-regular); color: var(--color-text-primary);">版本 1.0.0</p>
        </div>
        <div class="flex items-center justify-between" style="height: 48px; padding-left: 16px; padding-right: 16px;">
          <p class="truncate" style="font-size: var(--font-size-body); font-weight: var(--font-weight-regular); color: var(--color-text-primary);">隐私政策 | 用户协议</p>
          <div class="shrink-0" style="margin-left: 8px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>
      </div>

    </main>

    <!-- ── Bottom Tab Bar ── -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 flex items-start" style="height: var(--tab-bar-height); padding-bottom: var(--tab-bar-safe-area); background: var(--color-surface); border-top: 1px solid var(--color-border-light); max-width: 375px; margin: 0 auto;">

      <!-- Tab: 日历 -->
      <a href="calendar.html" class="flex flex-col items-center justify-center flex-1 gap-0.5" style="text-decoration: none;" data-dom-id="tab-calendar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="4"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span style="font-size: var(--font-size-caption); color: var(--color-text-tertiary);">日历</span>
      </a>

      <!-- Tab: 列表 -->
      <a href="list.html" class="flex flex-col items-center justify-center flex-1 gap-0.5" style="text-decoration: none;" data-dom-id="tab-list">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="4"/>
