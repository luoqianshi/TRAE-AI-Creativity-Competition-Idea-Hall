<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目详情页</title>
    <style id="theme-vars">
/* ============================================
   自由派 (FreeLance Hub) — Brand Design Tokens
   Based on UI Design Specification v1.0
   ============================================ */

:root {
  /* ── Brand Primary ── */
  --color-primary: #4F6EF7;
  --color-primary-light: #EEF1FE;
  --color-primary-dark: #3A54D4;

  /* ── Semantic State Colors ── */
  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* ── Neutral Colors (Light Mode) ── */
  --color-text-primary: #1A1A2E;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-disabled: #D1D5DB;
  --color-bg: #F8F9FC;
  --color-surface: #FFFFFF;
  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;

  /* ── Neutral Colors (Dark Mode) ── */
  --color-text-primary-dark: #F3F4F6;
  --color-text-secondary-dark: #9CA3AF;
  --color-text-tertiary-dark: #6B7280;
  --color-bg-dark: #111827;
  --color-surface-dark: #1F2937;
  --color-border-dark: #374151;

  /* ── Project Type Default Color ── */
  --color-type-default: #D1D5DB;
  --color-type-default-dark: #4B5563;

  /* ── Typography Scale ── */
  --font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
  --font-size-h1: 24px;
  --font-size-h2: 20px;
  --font-size-h3: 17px;
  --font-size-body: 15px;
  --font-size-body-small: 13px;
  --font-size-caption: 11px;
  --font-size-number-large: 28px;
  --font-size-number-medium: 20px;
  --font-size-number-small: 15px;
  --line-height-h1: 32px;
  --line-height-h2: 28px;
  --line-height-h3: 24px;
  --line-height-body: 22px;
  --line-height-body-small: 18px;
  --line-height-caption: 16px;
  --line-height-number-large: 36px;
  --line-height-number-medium: 28px;
  --font-weight-bold: 700;
  --font-weight-semibold: 600;
  --font-weight-medium: 500;
  --font-weight-regular: 400;

  /* ── Spacing System (4px base) ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;

  /* ── Radius Scale ── */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 999px;

  /* ── Shadow System ── */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  --shadow-xl: 0 16px 48px rgba(0,0,0,0.16);

  /* ── Layout Constants ── */
  --nav-height: 44px;
  --tab-bar-height: 49px;
  --tab-bar-safe-area: 34px;
  --page-padding-x: 16px;
  --card-padding: 16px;
  --card-gap: 12px;
  --calendar-cell-min-height: 72px;
  --color-bar-height: 18px;
  --color-bar-radius: 4px;
  --progress-bar-height: 4px;
}

/* ── Dark Mode ── */
html.dark {
  --color-text-primary: var(--color-text-primary-dark);
  --color-text-secondary: var(--color-text-secondary-dark);
  --color-text-tertiary: var(--color-text-tertiary-dark);
  --color-bg: var(--color-bg-dark);
  --color-surface: var(--color-surface-dark);
  --color-border: var(--color-border-dark);
  --color-border-light: var(--color-border-dark);
  --color-type-default: var(--color-type-default-dark);
}

/* ── Typography Classes ── */
.text-h1 { font-size: var(--font-size-h1); font-weight: var(--font-weight-bold); line-height: var(--line-height-h1); }
.text-h2 { font-size: var(--font-size-h2); font-weight: var(--font-weight-semibold); line-height: var(--line-height-h2); }
.text-h3 { font-size: var(--font-size-h3); font-weight: var(--font-weight-semibold); line-height: var(--line-height-h3); }
.text-body { font-size: var(--font-size-body); font-weight: var(--font-weight-regular); line-height: var(--line-height-body); }
.text-body-small { font-size: var(--font-size-body-small); font-weight: var(--font-weight-regular); line-height: var(--line-height-body-small); }
.text-caption { font-size: var(--font-size-caption); font-weight: var(--font-weight-regular); line-height: var(--line-height-caption); }
.text-number-large { font-size: var(--font-size-number-large); font-weight: var(--font-weight-bold); line-height: var(--line-height-number-large); }
.text-number-medium { font-size: var(--font-size-number-medium); font-weight: var(--font-weight-semibold); line-height: var(--line-height-number-medium); }
.text-number-small { font-size: var(--font-size-number-small); font-weight: var(--font-weight-medium); line-height: var(--line-height-number-small); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen" style="background: var(--color-bg); padding-bottom: 120px;">

      <!-- Navigation Bar -->
      <header class="sticky top-0 z-30 flex items-center justify-between px-4" style="height: var(--nav-height); background: var(--color-surface);">
        <button data-dom-id="btn-back" class="inline-flex items-center justify-center" style="width: 32px; height: 32px; color: var(--color-text-secondary);" aria-label="返回">
          <i data-lucide="chevron-left" style="width: 20px; height: 20px;"></i>
        </button>
        <h1 class="text-h3 truncate" style="color: var(--color-text-primary);">项目详情</h1>
        <button data-dom-id="btn-edit-project" class="text-body-small" style="color: var(--color-primary); font-weight: var(--font-weight-medium);">编辑</button>
      </header>

      <!-- Project Info Card -->
      <section class="mx-4 mt-4" style="background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: var(--card-padding);">
        <!-- Project Title -->
        <div class="flex items-center gap-2">
          <span class="shrink-0" style="width: 10px; height: 10px; border-radius: 50%; background: var(--state-success);"></span>
          <h2 class="text-h2 truncate" style="color: var(--color-text-primary);">官网改版设计</h2>
        </div>

        <!-- Info Rows -->
        <div class="mt-3 flex flex-col gap-2">
          <p class="text-body-small" style="color: var(--color-text-secondary);">客户：XX科技</p>
          <p class="text-body-small" style="color: var(--color-text-secondary);">类型：设计</p>
          <p class="text-body-small" style="color: var(--color-text-secondary);">项目金额：¥8,000</p>
          <p class="text-body-small" style="color: var(--color-text-secondary);">项目支出：¥2,000</p>
          <p class="text-body-small" style="color: var(--state-success); font-weight: var(--font-weight-bold);">利润：¥6,000</p>
          <p class="text-body-small" style="color: var(--color-text-secondary);">已收：¥5,000 | 未收：¥3,000</p>
        </div>

        <!-- Date Range -->
        <p class="mt-3 text-body-small" style="color: var(--color-text-secondary);">6月12日 - 6月28日 (共8天)</p>

        <!-- Progress Bar -->
        <div class="mt-3 flex items-center gap-2">
          <div class="flex-1" style="height: var(--progress-bar-height); background: var(--color-border-light); border-radius: var(--radius-full); overflow: hidden;">
            <div style="width: 80%; height: 100%; background: var(--color-primary); border-radius: var(--radius-full);"></div>
          </div>
          <span class="text-caption shrink-0" style="color: var(--color-text-secondary);">80%</span>
        </div>

        <!-- Divider -->
        <div class="my-3" style="height: 1px; background: var(--color-border-light);"></div>

        <!-- Notes -->
        <p class="text-body" style="color: var(--color-text-secondary);">客户要求首页突出品牌调性，内页注重内容阅读体验</p>
      </section>

      <!-- Schedule Dates Section -->
      <section class="mt-4 px-4">
        <h2 class="text-h3 mb-3" style="color: var(--color-text-primary);">日程安排</h2>
        <div style="background: var(--color-surface); border-radius: var(--radius-lg); overflow: hidden;">

          <!-- Schedule Item 1 -->
          <div class="flex items-center justify-between" style="height: 56px; padding: 0 var(--card-padding); border-bottom: 1px solid var(--color-border-light); border-left: 3px solid var(--state-success);">
            <span class="text-body" style="color: var(--color-text-primary); font-weight: var(--font-weight-medium);">6月12日 周四</span>
            <span class="text-body-small shrink-0" style="color: var(--color-text-secondary);">09:00 - 18:00</span>
          </div>

          <!-- Schedule Item 2 -->
          <div class="flex items-center justify-between" style="height: 56px; padding: 0 var(--card-padding); border-bottom: 1px solid var(--color-border-light); border-left: 3px solid var(--state-success);">
            <span class="text-body" style="color: var(--color-text-primary); font-weight: var(--font-weight-medium);">6月13日 周五</span>
            <span class="text-body-small shrink-0" style="color: var(--color-text-secondary);">09:00 - 18:00</span>
          </div>

          <!-- Schedule Item 3 -->
          <div class="flex items-center justify-between" style="height: 56px; padding: 0 var(--card-padding); border-bottom: 1px solid var(--color-border-light); border-left: 3px solid var(--state-success);">
            <span class="text-body" style="color: var(--color-text-primary); font-weight: var(--font-weight-medium);">6月16日 周一</span>
            <span class="text-body-small shrink-0" style="color: var(--color-text-secondary);">14:00 - 18:00</span>
          </div>

          <!-- Schedule Item 4 -->
          <div class="flex items-center justify-between" style="height: 56px; padding: 0 var(--card-padding); border-bottom: 1px solid var(--color-border-light); border-left: 3px solid var(--state-success);">
            <span class="text-body" style="color: var(--color-text-primary); font-weight: var(--font-weight-medium);">6月23日 周一</span>
            <span class="text-body-small shrink-0" style="color: var(--color-text-secondary);">09:00 - 18:00</span>
          </div>

          <!-- Schedule Item 5 -->
          <div class="flex items-center justify-between" style="height: 56px; padding: 0 var(--card-padding); border-left: 3px solid var(--state-success);">
            <span class="text-body" style="color: var(--color-text-primary); font-weight: var(--font-weight-medium);">6月28日 周六</span>
            <span class="text-body-small shrink-0" style="color: var(--color-text-secondary);">09:00 - 18:00</span>
          </div>

        </div>
      </section>

    </main>

    <!-- Fixed Bottom Action Menu -->
    <div class="fixed bottom-0 left-0 right-0 z-40" style="background: var(--color-surface); box-shadow: var(--shadow-lg); border-radius: var(--radius-xl) var(--radius-xl) 0 0;">
      <div class="flex items-center gap-3" style="padding: var(--card-padding);">
        <button data-dom-id="btn-add-schedule" class="flex-1 flex items-center justify-center" style="height: 44px; border: 1px solid var(--color-primary); border-radius: var(--radius-md); color: var(--color-primary); font-size: var(--font-size-body); font-weight: var(--font-weight-medium);">添加日程</button>
        <button data-dom-id="btn-delete-project" class="shrink-0" style="color: var(--state-error); font-size: var(--font-size-body); font-weight: var(--font-weight-medium);">删除项目</button>
      </div>
      <div style="height: var(--tab-bar-safe-area);"></div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
