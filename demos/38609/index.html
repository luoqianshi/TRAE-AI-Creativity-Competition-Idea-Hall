<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ToiletGo - 一键找厕所</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- 首页 -->
        <div class="page active" id="home-page">
            <div class="header">
                <div class="location-bar">
                    <i class="fas fa-location-dot"></i>
                    <span id="current-location">正在定位...</span>
                </div>
            </div>
            
            <div class="hero-section">
                <h1 class="app-title">ToiletGo</h1>
                <p class="app-subtitle">一键解决你的"内急"难题</p>
                <button class="find-btn" id="find-btn">
                    <i class="fas fa-toilet"></i>
                    找附近厕所
                </button>
            </div>
            
            <div class="quick-filters">
                <div class="filter-group">
                    <span class="filter-label">类型</span>
                    <div class="filter-options">
                        <button class="filter-btn active" data-filter="type" data-value="all">全部</button>
                        <button class="filter-btn" data-filter="type" data-value="public">公共</button>
                        <button class="filter-btn" data-filter="type" data-value="mall">商场</button>
                        <button class="filter-btn" data-filter="type" data-value="subway">地铁</button>
                        <button class="filter-btn" data-filter="type" data-value="shared">共享</button>
                    </div>
                </div>
                
                <div class="filter-group">
                    <span class="filter-label">时间</span>
                    <div class="filter-options">
                        <button class="filter-btn active" data-filter="hours" data-value="all">全部</button>
                        <button class="filter-btn" data-filter="hours" data-value="24h">24小时</button>
                    </div>
                </div>
                
                <div class="filter-group">
                    <span class="filter-label">设施</span>
                    <div class="filter-options">
                        <button class="filter-btn" data-filter="facility" data-value="baby">母婴室</button>
                        <button class="filter-btn" data-filter="facility" data-value="accessible">无障碍</button>
                        <button class="filter-btn" data-filter="facility" data-value="tissue">卫生纸</button>
                        <button class="filter-btn" data-filter="facility" data-value="pad">卫生巾</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 结果页 -->
        <div class="page" id="results-page">
            <div class="results-header">
                <button class="back-btn" id="back-btn">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <h2>附近厕所</h2>
                <span class="results-count" id="results-count">0个结果</span>
            </div>
            
            <div class="active-filters" id="active-filters"></div>
            
            <div class="results-list" id="results-list"></div>
        </div>
        
        <!-- 详情页 -->
        <div class="page" id="detail-page">
            <div class="detail-header">
                <button class="back-btn" id="detail-back-btn">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <h2>厕所详情</h2>
            </div>
            
            <div class="detail-content" id="detail-content"></div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
