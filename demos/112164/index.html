<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文献阅读助手 - 首页</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
</head>
<body>
  <header class="header">
    <div class="header-content">
      <a href="index.html" class="logo">
        <div class="logo-icon">文</div>
        <div class="logo-text">文献阅读助手</div>
      </a>
      <nav class="nav">
        <a href="index.html" class="nav-link active">文献库</a>
        <a href="citations.html" class="nav-link">引用管理</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">我的文献库</h1>
    <p class="page-subtitle">上传文献，轻松阅读，一键生成精确到页码的引用</p>

    <section class="upload-section">
      <div class="upload-zone" id="uploadZone">
        <div class="upload-icon">📄</div>
        <div class="upload-text">拖拽文件到此处，或点击上传</div>
        <button class="btn btn-primary" id="uploadBtn">选择文件</button>
        <div class="upload-hint">支持 TXT、PDF 格式</div>
      </div>
      <input type="file" id="fileInput" accept=".txt,.pdf" style="display: none;">
    </section>

    <div class="search-bar">
      <input type="text" class="search-input" id="searchInput" placeholder="搜索文献标题或作者...">
      <button class="btn btn-primary" id="searchBtn">搜索</button>
    </div>

    <div class="section-header">
      <h2 class="section-title">已上传文献</h2>
      <span class="document-count" id="documentCount">0 篇文献</span>
    </div>

    <div class="document-grid" id="documentGrid">
      <div class="empty-state" id="emptyState">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <p>暂无文献，点击上方上传区域添加第一篇文献</p>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">补充文献信息</h3>
        <button class="modal-close" id="closeModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">文献标题 *</label>
          <input type="text" class="form-input" id="docTitle" placeholder="例如：中国历史研究">
        </div>
        <div class="form-group">
          <label class="form-label">作者</label>
          <input type="text" class="form-input" id="docAuthor" placeholder="例如：张三">
        </div>
        <div class="form-group">
          <label class="form-label">出版社 / 期刊</label>
          <input type="text" class="form-input" id="docPublisher" placeholder="例如：中华书局">
        </div>
        <div class="form-group">
          <label class="form-label">出版年份</label>
          <input type="text" class="form-input" id="docYear" placeholder="例如：2020">
        </div>
        <div class="form-group">
          <label class="form-label">文献类型</label>
          <select class="form-select" id="docType">
            <option value="book">著作</option>
            <option value="paper">论文</option>
            <option value="article">文章</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelBtn">取消</button>
        <button class="btn btn-primary" id="saveDocBtn">保存并阅读</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
