<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>“智学”AI 全科学习伴侣 - 创意概念演示</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .demo-container { background: #ffffff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); padding: 40px; max-width: 800px; width: 100%; text-align: center; border-top: 6px solid #22c55e; }
        h1 { color: #1f2937; font-size: 28px; margin-bottom: 8px; }
        .subtitle { color: #6b7280; font-size: 16px; margin-bottom: 30px; }
        .feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; text-align: left; }
        .feature-card { background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; transition: transform 0.2s; }
        .feature-card:hover { transform: translateY(-2px); border-color: #22c55e; }
        .feature-card h3 { margin: 0 0 10px 0; font-size: 16px; color: #0f172a; }
        .feature-card p { margin: 0; font-size: 14px; color: #475569; line-height: 1.5; }
        .input-group { background: #f1f5f9; border-radius: 30px; padding: 8px 8px 8px 20px; display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .input-group input { border: none; background: transparent; flex: 1; outline: none; font-size: 14px; color: #334155; }
        .input-group button { background: #22c55e; color: white; border: none; padding: 10px 24px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .input-group button:hover { background: #16a34a; }
        .footer-note { margin-top: 30px; font-size: 12px; color: #94a3b8; border-top: 1px solid #e2e8f0; padding-top: 15px; }
    </style>
</head>
<body>
    <div class="demo-container">
        <h1>📚 “智学” AI 全科学习伴侣</h1>
        <p class="subtitle">你的专属智能学习规划师 · 让学习事半功倍</p>
        
        <div class="feature-grid">
            <div class="feature-card">
                <h3>💡 智能问答 & 解析</h3>
                <p>拍照上传或文字输入难题，AI 提供分步详细解析与相关知识点，不仅给答案，更教思路。</p>
            </div>
            <div class="feature-card">
                <h3>🗺️ 个性化学习规划</h3>
                <p>根据你的摸底测验和薄弱环节，AI 自动生成专属的月度/周度学习计划与背诵表。</p>
            </div>
            <div class="feature-card">
                <h3>📝 错题本 & 举一反三</h3>
                <p>自动收集错题并归类，智能推送同类型变式题，彻底堵住知识漏洞。</p>
            </div>
        </div>

        <div class="input-group">
            <input type="text" placeholder="输入你的学习难题，或点击右侧开始体验...">
            <button>开始智能学习</button>
        </div>

        <div class="footer-note">
            * 此页面为“智学”AI全科学习伴侣概念演示，用于大赛创意展示。
        </div>
    </div>
</body>
</html>
