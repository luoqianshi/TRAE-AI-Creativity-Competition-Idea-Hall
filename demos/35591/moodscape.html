<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  --bg-primary: #1a1a2e;
  --bg-secondary: #16213e;
  --text-primary: #ffffff;
  --text-secondary: rgba(255,255,255,0.7);
  --accent: #e94560;
  --glass-bg: rgba(255,255,255,0.1);
  --glass-border: rgba(255,255,255,0.2);
  --glow: rgba(233,69,96,0.4);
  --transition-speed: 0.6s;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}
h1,h2,h3,.serif { font-family: 'Noto Serif SC', serif; }

/* Page transitions */
.page {
  position: fixed; top:0; left:0; width:100%; height:100%;
  opacity: 0; pointer-events: none;
  transition: opacity var(--transition-speed) ease, transform var(--transition-speed) ease;
  transform: scale(0.98);
  z-index: 1;
}
.page.active {
  opacity: 1; pointer-events: all; transform: scale(1); z-index: 10;
}

/* Glassmorphism card */
.glass-card {
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

/* Input glow */
.glow-input:focus {
  box-shadow: 0 0 20px var(--glow), 0 0 40px rgba(233,69,96,0.2);
  border-color: var(--accent) !important;
  outline: none;
}

/* Button styles */
.btn-glow {
  position: relative;
  overflow: hidden;
  transition: all 0.3s ease;
}
.btn-glow::before {
  content: '';
  position: absolute; top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);
  opacity: 0; transition: opacity 0.3s;
}
.btn-glow:hover::before { opacity: 1; }
.btn-glow:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(233,69,96,0.4); }
.btn-glow:active { transform: translateY(0); }

/* Emotion tags */
.emotion-tag {
  padding: 8px 20px;
  border-radius: 50px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.05);
  color: rgba(255,255,255,0.8);
  cursor: pointer;
  transition: all 0.3s ease;
  font-size: 14px;
  white-space: nowrap;
}
.emotion-tag:hover, .emotion-tag.selected {
  background: rgba(233,69,96,0.3);
  border-color: var(--accent);
  color: #fff;
  transform: scale(1.05);
}

/* Canvas */
#weatherCanvas {
  position: fixed; top:0; left:0; width:100%; height:100%; z-index:0;
}

/* Weather overlay text */
.weather-overlay {
  position: relative; z-index: 2;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  height: 100%; padding: 20px;
  text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}

/* Calendar */
.cal-day {
  width: 44px; height: 44px;
  border-radius: 12px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font-size: 12px;
  transition: all 0.3s;
  cursor: default;
}
.cal-day.has-data {
  background: rgba(255,255,255,0.1);
  cursor: pointer;
}
.cal-day.has-data:hover {
  background: rgba(255,255,255,0.2);
  transform: scale(1.1);
}

/* Loading animation */
@keyframes float {
  0%,100% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
}
@keyframes fadeInUp {
  from { opacity:0; transform: translateY(30px); }
  to { opacity:1; transform: translateY(0); }
}
@keyframes pulse-glow {
  0%,100% { box-shadow: 0 0 20px var(--glow); }
  50% { box-shadow: 0 0 40px var(--glow), 0 0 60px rgba(233,69,96,0.2); }
}
.animate-float { animation: float 3s ease-in-out infinite; }
.animate-fade-in { animation: fadeInUp 0.8s ease forwards; }
.animate-pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

/* Theme colors for each weather */
[data-weather="sunny"] { --bg-primary:#87CEEB; --bg-secondary:#4A90D9; --accent:#FFD700; --glow:rgba(255,215,0,0.4); }
[data-weather="rainy"] { --bg-primary:#4A5568; --bg-secondary:#2D3748; --accent:#7FB3D8; --glow:rgba(127,179,216,0.4); }
[data-weather="storm"] { --bg-primary:#1a1a2e; --bg-secondary:#0f0f1a; --accent:#FF6B35; --glow:rgba(255,107,53,0.4); }
[data-weather="snow"] { --bg-primary:#1B2838; --bg-secondary:#0F1923; --accent:#B8D4E3; --glow:rgba(184,212,227,0.4); }
[data-weather="rainbow"] { --bg-primary:#6CB4EE; --bg-secondary:#87CEEB; --accent:#FF69B4; --glow:rgba(255,105,180,0.4); }
[data-weather="fog"] { --bg-primary:#C8D6D0; --bg-secondary:#A8BDB0; --accent:#8FBC8F; --glow:rgba(143,188,143,0.4); }
[data-weather="blossom"] { --bg-primary:#FFE4E1; --bg-secondary:#FFB6C1; --accent:#FF69B4; --glow:rgba(255,105,180,0.4); }
[data-weather="aurora"] { --bg-primary:#0B0C2A; --bg-secondary:#1A1B4B; --accent:#00FF88; --glow:rgba(0,255,136,0.4); }

/* Toast */
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: rgba(0,0,0,0.8); color: #fff; padding: 12px 28px;
  border-radius: 50px; font-size: 14px; z-index: 9999;
  transition: transform 0.4s ease; backdrop-filter: blur(10px);
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* Responsive */
@media (max-width: 640px) {
  .glass-card { border-radius: 16px; }
  .emotion-tag { padding: 6px 14px; font-size: 12px; }
}
</style>
</head>

// ===================== PAGE NAVIGATION =====================
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  currentPage = id;
  if (id === 'homePage') {
    startHomeBg();
    stopWeather();
  } else if (id === 'weatherPage') {
    stopHomeBg();
    startWeather();
  } else if (id === 'calendarPage') {
    stopHomeBg();
    stopWeather();
    renderCalendar();

}

// ===================== HOME BACKGROUND =====================
let homeAnimFrame = null;
let homeClouds = [];

function initHomeClouds() {
  homeClouds = [];
  for (let i = 0; i < 8; i++) {
    homeClouds.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight * 0.6,
      w: 120 + Math.random() * 200,
      h: 40 + Math.random() * 60,
      speed: 0.15 + Math.random() * 0.3,
      opacity: 0.03 + Math.random() * 0.06
    });
  }
}

function drawHomeBg() {
  const canvas = document.getElementById('homeBgCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  // Gradient background
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#1a1a2e');
  grad.addColorStop(0.5, '#16213e');
  grad.addColorStop(1, '#0f3460');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Stars
  if (!drawHomeBg._stars) {
    drawHomeBg._stars = [];
    for (let i = 0; i < 80; i++) {
      drawHomeBg._stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height * 0.7,
        r: 0.5 + Math.random() * 1.5,
        twinkle: Math.random() * Math.PI * 2,
        speed: 0.01 + Math.random() * 0.03
      });
    }
  }
  drawHomeBg._stars.forEach(s => {
    s.twinkle += s.speed;
    const alpha = 0.3 + Math.sin(s.twinkle) * 0.3;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  });

  // Clouds
  homeClouds.forEach(c => {
    c.x += c.speed;
    if (c.x > canvas.width + c.w) c.x = -c.w;
    ctx.save();
    ctx.globalAlpha = c.opacity;
    ctx.fillStyle = '#fff';
    // Draw cloud shape with multiple ellipses
    drawCloud(ctx, c.x, c.y, c.w, c.h);
    ctx.restore();
  });

  homeAnimFrame = requestAnimationFrame(drawHomeBg);
}

function drawCloud(ctx, x, y, w, h) {
  ctx.beginPath();
  ctx.ellipse(x, y, w * 0.5, h * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x - w * 0.25, y + h * 0.1, w * 0.35, h * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x + w * 0.25, y + h * 0.05, w * 0.3, h * 0.35, 0, 0, Math.PI * 2);
  ctx.fill();
}

function startHomeBg() {
  if (homeAnimFrame) return;
  initHomeClouds();
  drawHomeBg._stars = null;
  drawHomeBg();
}
function stopHomeBg() {
  if (homeAnimFrame) { cancelAnimationFrame(homeAnimFrame); homeAnimFrame = null; }
}

// ===================== EMOTION ANALYSIS =====================
function analyzeEmotion(text) {
  if (!text || text.trim() === '') return { emotion: '平静', intensity: 0.5 };
  let scores = {};
  let maxScore = 0;
  let topEmotion = '平静';

  // Negative context detector: if text contains negation words, penalize positive emotions
  const negationWords = ['不','没','别','莫','非','无','未','勿','难','失','差','糟','恨','厌','怕','愁','苦','烦','怒','哭','败','错','漏','缺','漏','弃','拒','否'];
  const hasNegContext = negationWords.some(w => text.includes(w));

  for (const [emotion, keywords] of Object.entries(SENTIMENT_DICT)) {
    let score = 0;
    keywords.forEach(kw => {
      // Use word boundary matching for single-char keywords to avoid false matches
      const regex = kw.length === 1
        ? new RegExp(kw + '[^\\w]|' + kw + '$', 'g')
        : new RegExp(kw, 'g');
      const matches = text.match(regex);
      if (matches) score += matches.length;
    });
    // Penalize positive emotions in negative context
    if (hasNegContext && (emotion === '开心' || emotion === '期待' || emotion === '感恩')) {
      score *= 0.3;
    }
    // Boost negative emotions in negative context
    if (hasNegContext && (emotion === '悲伤' || emotion === '愤怒' || emotion === '焦虑' || emotion === '疲惫')) {
      score *= 1.5;
    }
    scores[emotion] = score;
    if (score > maxScore) {
      maxScore = score;
      topEmotion = emotion;
    }
  }

  // If all scores are 0, use negative context to infer
  if (maxScore === 0 && hasNegContext) {
    topEmotion = '焦虑';
    maxScore = 1;
  }

  const intensity = Math.min(1, maxScore / 5);
  return { emotion: topEmotion, intensity: Math.max(0.3, intensity) };
}

function getQuote(emotion) {
  const list = QUOTES[emotion] || QUOTES['平静'];
  return list[Math.floor(Math.random() * list.length)];
}

// ===================== WEATHER RENDERER =====================
let weatherCanvas, weatherCtx;
let W, H;

function initWeatherCanvas() {
  weatherCanvas = document.getElementById('weatherCanvas');
  weatherCtx = weatherCanvas.getContext('2d');
  resizeWeatherCanvas();
}

function resizeWeatherCanvas() {
  W = window.innerWidth;
  H = window.innerHeight;
  weatherCanvas.width = W;
  weatherCanvas.height = H;
}

function startWeather() {
  initWeatherCanvas();
  particles = [];
  clouds = [];
  lightningTimer = 0;
  lightningFlash = 0;
  initParticles();
  renderWeather();
}

function stopWeather() {
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
}

function initParticles() {
  particles = [];
  const w = currentWeather;

  if (w === 'rainy' || w === 'storm') {
    const count = w === 'storm' ? 300 : 150;
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        speed: 8 + Math.random() * (w === 'storm' ? 15 : 8),
        length: 15 + Math.random() * 20,
        opacity: 0.2 + Math.random() * 0.5
      });
    }
  }

  if (w === 'snow') {
    for (let i = 0; i < 120; i++) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 1 + Math.random() * 4,
        speed: 0.5 + Math.random() * 2,
        wind: Math.random() * 0.5 - 0.25,
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: 0.01 + Math.random() * 0.03,
        opacity: 0.3 + Math.random() * 0.7
      });
    }
  }

  if (w === 'sunny') {
    for (let i = 0; i < 50; i++) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 1 + Math.random() * 3,
        speed: 0.2 + Math.random() * 0.5,
        opacity: 0.1 + Math.random() * 0.4,
        drift: Math.random() * Math.PI * 2
      });
    }
  }

  if (w === 'blossom') {
    for (let i = 0; i < 60; i++) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 4 + Math.random() * 8,
        speed: 0.5 + Math.random() * 1.5,
        wind: 0.3 + Math.random() * 0.8,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: 0.01 + Math.random() * 0.03,
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: 0.02 + Math.random() * 0.02,
        opacity: 0.3 + Math.random() * 0.6,
        color: ['#FFB7C5','#FF69B4','#FFC0CB','#FFD1DC','#FF91A4'][Math.floor(Math.random()*5)]
      });
    }
  }

  if (w === 'aurora') {
    for (let i = 0; i < 100; i++) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.5,
        r: 0.5 + Math.random() * 1.5,
        twinkle: Math.random() * Math.PI * 2,
        speed: 0.01 + Math.random() * 0.03
      });
    }
  }

  if (w === 'fog') {
    for (let i = 0; i < 15; i++) {
      particles.push({
        x: Math.random() * W,
        y: H * 0.3 + Math.random() * H * 0.5,
        w: 200 + Math.random() * 400,
        h: 80 + Math.random() * 120,
        speed: 0.2 + Math.random() * 0.5,
        opacity: 0.03 + Math.random() * 0.06
      });
    }
  }

  if (w === 'rainbow') {
    for (let i = 0; i < 40; i++) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 1 + Math.random() * 2,
        speed: 0.3 + Math.random() * 0.5,
        opacity: 0.2 + Math.random() * 0.4,
        drift: Math.random() * Math.PI * 2
      });
    }
  }

  // Clouds for applicable weathers
  if (['sunny','rainy','storm','rainbow','fog'].includes(w)) {
    const cloudCount = w === 'storm' ? 6 : w === 'rainy' ? 5 : 4;
    for (let i = 0; i < cloudCount; i++) {
      clouds.push({
        x: Math.random() * W * 1.5 - W * 0.25,
        y: 30 + Math.random() * H * 0.25,
        w: 150 + Math.random() * 250,
        h: 50 + Math.random() * 60,
        speed: 0.1 + Math.random() * 0.3,
        opacity: w === 'storm' ? 0.15 + Math.random() * 0.2 :
                 w === 'rainy' ? 0.1 + Math.random() * 0.15 :
                 0.15 + Math.random() * 0.25
      });
    }
  }
}

let _time = 0;

function renderWeather() {
  _time += 0.016;
  const ctx = weatherCtx;
  const w = currentWeather;

  // Background
  drawWeatherBg(ctx, w);

  // Specific weather elements
  switch(w) {
    case 'sunny': drawSunny(ctx); break;
    case 'rainy': drawRain(ctx); break;
    case 'storm': drawStorm(ctx); break;
    case 'snow': drawSnow(ctx); break;
    case 'rainbow': drawRainbow(ctx); break;
    case 'fog': drawFog(ctx); break;
    case 'blossom': drawBlossom(ctx); break;
    case 'aurora': drawAurora(ctx); break;
  }

  // Clouds
  if (clouds.length > 0) {
    clouds.forEach(c => {
      c.x += c.speed;
      if (c.x > W + c.w) c.x = -c.w;
      ctx.save();
      ctx.globalAlpha = c.opacity;
      const cloudColor = w === 'storm' ? '#2a2a3e' : w === 'rainy' ? '#6b7b8d' : '#ffffff';
      ctx.fillStyle = cloudColor;
      drawCloud(ctx, c.x, c.y, c.w, c.h);
      ctx.restore();
    });
  }

  animFrame = requestAnimationFrame(renderWeather);
}

function drawWeatherBg(ctx, w) {
  const cfg = WEATHER_CONFIG[w];
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, cfg.bgTop);
  grad.addColorStop(1, cfg.bgBot);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

// ---- SUNNY ----
function drawSunny(ctx) {
  // Sun
  const sunX = W * 0.75, sunY = H * 0.2, sunR = Math.min(W, H) * 0.08;
  // Glow
  const glow = ctx.createRadialGradient(sunX, sunY, sunR * 0.5, sunX, sunY, sunR * 4);
  glow.addColorStop(0, 'rgba(255,223,100,0.4)');
  glow.addColorStop(0.5, 'rgba(255,200,50,0.1)');
  glow.addColorStop(1, 'rgba(255,200,50,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // Sun rays
  ctx.save();
  ctx.translate(sunX, sunY);
  ctx.rotate(_time * 0.1);
  for (let i = 0; i < 12; i++) {
    ctx.rotate(Math.PI / 6);
    ctx.beginPath();
    ctx.moveTo(0, sunR + 10);
    ctx.lineTo(-4, sunR + 30 + Math.sin(_time * 2 + i) * 10);
    ctx.lineTo(4, sunR + 30 + Math.sin(_time * 2 + i) * 10);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,220,100,0.3)';
    ctx.fill();
  }
  ctx.restore();

  // Sun body
  const sunGrad = ctx.createRadialGradient(sunX - sunR*0.2, sunY - sunR*0.2, 0, sunX, sunY, sunR);
  sunGrad.addColorStop(0, '#FFF8DC');
  sunGrad.addColorStop(0.7, '#FFD700');
  sunGrad.addColorStop(1, '#FFA500');
  ctx.beginPath();
  ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
  ctx.fillStyle = sunGrad;
  ctx.fill();

  // Light particles
  particles.forEach(p => {
    p.drift += 0.01;
    p.y -= p.speed;
    p.x += Math.sin(p.drift) * 0.3;
    if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,230,150,${p.opacity})`;
    ctx.fill();
  });
}

// ---- RAIN ----
function drawRain(ctx) {
  particles.forEach(p => {
    p.y += p.speed;
    p.x += 1;
    if (p.y > H) {
      p.y = -p.length;
      p.x = Math.random() * W;
      // Ripple
      drawRipple(ctx, p.x, H - 5 - Math.random() * 20);
    }
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + 1, p.y + p.length);
    ctx.strokeStyle = `rgba(174,194,224,${p.opacity})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  });
}

function drawRipple(ctx, x, y) {
  ctx.beginPath();
  ctx.ellipse(x, y, 8, 3, 0, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(174,194,224,0.3)';
  ctx.lineWidth = 0.5;
  ctx.stroke();
}

// ---- STORM ----
function drawStorm(ctx) {
  // Heavy rain
  particles.forEach(p => {
    p.y += p.speed;
    p.x += 3;
    if (p.y > H) { p.y = -p.length; p.x = Math.random() * W; }
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + 3, p.y + p.length);
    ctx.strokeStyle = `rgba(200,210,230,${p.opacity})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });

  // Lightning
  lightningTimer++;
  if (lightningTimer > 120 + Math.random() * 180) {
    lightningFlash = 1;
    lightningTimer = 0;
    drawLightning(ctx, W * 0.2 + Math.random() * W * 0.6, 0);
  }
  if (lightningFlash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${lightningFlash * 0.15})`;
    ctx.fillRect(0, 0, W, H);
    lightningFlash -= 0.05;
  }
}

function drawLightning(ctx, x, y) {
  ctx.beginPath();
  ctx.moveTo(x, y);
  let cx = x, cy = y;
  const segments = 8 + Math.floor(Math.random() * 6);
  for (let i = 0; i < segments; i++) {
    cx += (Math.random() - 0.5) * 60;
    cy += H / segments * (0.8 + Math.random() * 0.4);
    ctx.lineTo(cx, cy);
    // Branch
    if (Math.random() > 0.6) {
      ctx.moveTo(cx, cy);
      const bx = cx + (Math.random() - 0.5) * 80;
      const by = cy + 30 + Math.random() * 50;
      ctx.lineTo(bx, by);
      ctx.moveTo(cx, cy);
    }
  }
  ctx.strokeStyle = 'rgba(255,255,220,0.9)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 6;
  ctx.stroke();
}

// ---- SNOW ----
function drawSnow(ctx) {
  // Moon
  const moonX = W * 0.8, moonY = H * 0.15, moonR = Math.min(W,H) * 0.06;
  const moonGlow = ctx.createRadialGradient(moonX, moonY, moonR * 0.5, moonX, moonY, moonR * 3);
  moonGlow.addColorStop(0, 'rgba(200,220,255,0.2)');
  moonGlow.addColorStop(1, 'rgba(200,220,255,0)');
  ctx.fillStyle = moonGlow;
  ctx.fillRect(0, 0, W, H);

  ctx.beginPath();
  ctx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
  ctx.fillStyle = '#E8E8F0';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(moonX - moonR * 0.3, moonY - moonR * 0.1, moonR * 0.85, 0, Math.PI * 2);
  ctx.fillStyle = '#D0D0E0';
  ctx.fill();

  // Snowflakes
  particles.forEach(p => {
    p.wobble += p.wobbleSpeed;
    p.y += p.speed;
    p.x += p.wind + Math.sin(p.wobble) * 0.8;
    if (p.y > H + 10) { p.y = -10; p.x = Math.random() * W; }
    if (p.x > W + 10) p.x = -10;
    if (p.x < -10) p.x = W + 10;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${p.opacity})`;
    ctx.fill();
  });
}

// ---- RAINBOW ----
function drawRainbow(ctx) {
  // Rainbow arc
  const colors = ['#FF0000','#FF7F00','#FFFF00','#00FF00','#0000FF','#4B0082','#9400D3'];
  const cx = W * 0.5, cy = H * 1.1;
  const baseR = Math.min(W, H) * 0.7;

  ctx.save();
  ctx.globalAlpha = 0.5;
  colors.forEach((color, i) => {
    ctx.beginPath();
    ctx.arc(cx, cy, baseR - i * 8, Math.PI, 0);
    ctx.strokeStyle = color;
    ctx.lineWidth = 8;
    ctx.stroke();
  });
  ctx.restore();

  // Soft light particles
  particles.forEach(p => {
    p.drift += 0.008;
    p.y -= p.speed;
    p.x += Math.sin(p.drift) * 0.5;
    if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${p.opacity})`;
    ctx.fill();
  });

  // Sun peeking
  const sunX = W * 0.2, sunY = H * 0.15, sunR = 40;
  const sg = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 2);
  sg.addColorStop(0, 'rgba(255,230,150,0.6)');
  sg.addColorStop(1, 'rgba(255,230,150,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(0, 0, W * 0.5, H * 0.4);
}

// ---- FOG ----
function drawFog(ctx) {
  // Soft light from top
  const topGlow = ctx.createRadialGradient(W*0.5, -H*0.1, 0, W*0.5, -H*0.1, H*0.8);
  topGlow.addColorStop(0, 'rgba(255,248,220,0.15)');
  topGlow.addColorStop(1, 'rgba(255,248,220,0)');
  ctx.fillStyle = topGlow;
  ctx.fillRect(0, 0, W, H);

  // Fog layers
  particles.forEach(p => {
    p.x += p.speed;
    if (p.x > W + p.w) p.x = -p.w;
    ctx.save();
    ctx.globalAlpha = p.opacity;
    const fg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.w * 0.5);
    fg.addColorStop(0, 'rgba(200,210,200,0.5)');
    fg.addColorStop(1, 'rgba(200,210,200,0)');
    ctx.fillStyle = fg;
    ctx.fillRect(p.x - p.w * 0.5, p.y - p.h * 0.5, p.w, p.h);
    ctx.restore();
  });
}

// ---- BLOSSOM ----
function drawBlossom(ctx) {
  // Warm sunlight
  const sunGlow = ctx.createRadialGradient(W*0.7, H*0.1, 0, W*0.7, H*0.1, H*0.6);
  sunGlow.addColorStop(0, 'rgba(255,240,200,0.3)');
  sunGlow.addColorStop(1, 'rgba(255,240,200,0)');
  ctx.fillStyle = sunGlow;
  ctx.fillRect(0, 0, W, H);

  // Petals
  particles.forEach(p => {
    p.wobble += p.wobbleSpeed;
    p.y += p.speed;
    p.x += p.wind + Math.sin(p.wobble) * 1.5;
    p.rotation += p.rotSpeed;
    if (p.y > H + 20) { p.y = -20; p.x = Math.random() * W; }
    if (p.x > W + 20) p.x = -20;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation);
    ctx.globalAlpha = p.opacity;
    // Draw petal shape
    ctx.beginPath();
    ctx.ellipse(0, 0, p.r, p.r * 0.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
    // Petal vein
    ctx.beginPath();
    ctx.moveTo(-p.r * 0.6, 0);
    ctx.lineTo(p.r * 0.6, 0);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
    ctx.restore();
  });
}

// ---- AURORA ----
function drawAurora(ctx) {
  // Stars
  particles.forEach(p => {
    p.twinkle += p.speed;
    const alpha = 0.3 + Math.sin(p.twinkle) * 0.4;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${Math.max(0, alpha)})`;
    ctx.fill();
  });

  // Aurora bands
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (let band = 0; band < 5; band++) {
    ctx.beginPath();
    const baseY = H * 0.15 + band * 40;
    ctx.moveTo(0, baseY);
    for (let x = 0; x <= W; x += 10) {
      const y = baseY + Math.sin(x * 0.003 + _time * (0.3 + band * 0.1) + band) * (30 + band * 10)
                + Math.sin(x * 0.007 + _time * 0.5) * 15;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, baseY + 80);
    for (let x = W; x >= 0; x -= 10) {
      const y = baseY + 60 + Math.sin(x * 0.003 + _time * (0.3 + band * 0.1) + band + 1) * (20 + band * 8);
      ctx.lineTo(x, y);
    }
    ctx.closePath();

    const colors = [
      ['rgba(0,255,136,0.08)','rgba(0,200,100,0.02)'],
      ['rgba(0,200,255,0.06)','rgba(0,150,200,0.02)'],
      ['rgba(100,0,255,0.06)','rgba(80,0,200,0.02)'],
      ['rgba(0,255,200,0.05)','rgba(0,200,150,0.01)'],
      ['rgba(150,50,255,0.04)','rgba(100,30,200,0.01)']
    ];
    const ag = ctx.createLinearGradient(0, baseY, 0, baseY + 80);
    ag.addColorStop(0, colors[band][0]);
    ag.addColorStop(1, colors[band][1]);
    ctx.fillStyle = ag;
    ctx.fill();
  }
  ctx.restore();
}

// ===================== SAVE POSTCARD =====================
function savePostcard() {
  const canvas = document.getElementById('weatherCanvas');
  // Create offscreen canvas with text overlay
  const offCanvas = document.createElement('canvas');
  offCanvas.width = W;
  offCanvas.height = H;
  const offCtx = offCanvas.getContext('2d');

  // Draw weather scene
  offCtx.drawImage(canvas, 0, 0);

  // Add text overlay
  const cfg = WEATHER_CONFIG[currentWeather];
  const quote = document.getElementById('weatherQuote').textContent;
  const timeStr = document.getElementById('weatherTime').textContent;

  // Semi-transparent overlay at bottom
  offCtx.fillStyle = 'rgba(0,0,0,0.3)';
  offCtx.fillRect(0, H * 0.6, W, H * 0.4);

  // Emoji
  offCtx.font = '48px serif';
  offCtx.textAlign = 'center';
  offCtx.fillText(cfg.emoji, W/2, H * 0.68);

  // Title
  offCtx.font = 'bold 24px "Noto Serif SC", serif';
  offCtx.fillStyle = '#ffffff';
  offCtx.fillText(cfg.label, W/2, H * 0.76);

  // Quote
  offCtx.font = '14px "Noto Sans SC", sans-serif';
  offCtx.fillStyle = 'rgba(255,255,255,0.8)';
  wrapText(offCtx, quote, W/2, H * 0.82, W * 0.7, 22);

  // Time
  offCtx.font = '11px "Noto Sans SC", sans-serif';
  offCtx.fillStyle = 'rgba(255,255,255,0.5)';
  offCtx.fillText(timeStr, W/2, H * 0.92);

  // Branding
  offCtx.font = '10px "Noto Sans SC", sans-serif';
  offCtx.fillStyle = 'rgba(255,255,255,0.3)';
  offCtx.fillText('情绪气象台 MoodScape', W/2, H * 0.96);

  // Download
  const link = document.createElement('a');
  link.download = `moodscape_${currentWeather}_${Date.now()}.png`;
  link.href = offCanvas.toDataURL('image/png');
  link.click();
  showToast('明信片已保存');
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const chars = text.split('');
  let line = '';
  let ty = y;
  for (let i = 0; i < chars.length; i++) {
    const testLine = line + chars[i];
    const metrics = ctx.measureText(testLine);
    if (metrics.width > maxWidth && line.length > 0) {
      ctx.fillText(line, x, ty);
      line = chars[i];
      ty += lineHeight;
    } else {
      line = testLine;
    }
  }
  ctx.fillText(line, x, ty);
}

// ===================== TOAST =====================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ===================== CALENDAR =====================
function getRecords() {
  try { return JSON.parse(localStorage.getItem('moodscape_records') || '{}'); }
  catch { return {}; }
}

function saveRecord(emotion, weather, quote, text) {
  const records = getRecords();
  const today = new Date().toISOString().split('T')[0];
  records[today] = { emotion, weather, quote, text, time: Date.now() };
  localStorage.setItem('moodscape_records', JSON.stringify(records));
}

function renderCalendar() {
  const grid = document.getElementById('calGrid');
  const stats = document.getElementById('calStats');
  const detail = document.getElementById('calDetail');
  const records = getRecords();

  grid.innerHTML = '';
  const today = new Date();
  const days = [];

  for (let i = 6; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key = d.toISOString().split('T')[0];
    const record = records[key];
    const dayNames = ['日','一','二','三','四','五','六'];
    const dayEl = document.createElement('div');
    dayEl.className = `cal-day ${record ? 'has-data' : ''}`;
    dayEl.innerHTML = `
      <span class="text-white/40 text-[10px]">${dayNames[d.getDay()]}</span>
      <span class="text-white/80 text-sm font-medium">${d.getDate()}</span>
      <span class="text-lg">${record ? WEATHER_CONFIG[record.weather]?.emoji || '🌤️' : ''}</span>
    `;
    if (record) {
      dayEl.addEventListener('click', () => {
        detail.innerHTML = `
          <div class="text-center">
            <div class="text-4xl mb-2">${WEATHER_CONFIG[record.weather]?.emoji || '🌤️'}</div>
            <h3 class="serif text-lg font-bold mb-1">${record.emotion}</h3>
            <p class="text-white/60 text-sm mb-2">${record.quote}</p>
            ${record.text ? `<p class="text-white/40 text-xs italic">"${record.text}"</p>` : ''}
          </div>
        `;
      });
    }
    days.push(dayEl);
    grid.appendChild(dayEl);
  }

  // Stats
  const weekRecords = Object.entries(records).filter(([k]) => {
    const d = new Date(k);
    const weekAgo = new Date(today);
    weekAgo.setDate(weekAgo.getDate() - 6);
    return d >= weekAgo;
  });

  if (weekRecords.length === 0) {
    stats.innerHTML = '<p class="text-white/40 text-sm text-center">本周还没有记录，去记录你的心情吧</p>';
    return;
  }

  // Count emotions
  const emotionCounts = {};
  weekRecords.forEach(([, r]) => {
    emotionCounts[r.emotion] = (emotionCounts[r.emotion] || 0) + 1;
  });

  const sorted = Object.entries(emotionCounts).sort((a,b) => b[1] - a[1]);
  const maxCount = sorted[0][1];

  stats.innerHTML = sorted.map(([emotion, count]) => {
    const weather = EMOTION_TAG_MAP[emotion] || 'sunny';
    const pct = (count / maxCount) * 100;
    return `
      <div class="flex items-center gap-3">
        <span class="text-lg">${WEATHER_CONFIG[weather]?.emoji}</span>
        <span class="text-white/70 text-sm w-12">${emotion}</span>
        <div class="flex-1 h-2 bg-white/10 rounded-full overflow-hidden">
          <div class="h-full rounded-full transition-all duration-500" style="width:${pct}%; background: linear-gradient(90deg, ${WEATHER_CONFIG[weather]?.bgTop}, ${WEATHER_CONFIG[weather]?.bgBot})"></div>
        </div>
        <span class="text-white/40 text-xs w-6 text-right">${count}天</span>
      </div>
    `;
  }).join('');
}

// ===================== GENERATE WEATHER =====================
function generateWeather() {
  const text = document.getElementById('moodInput').value.trim();
  const selectedTag = document.querySelector('.emotion-tag.selected');

  let emotion, intensity;
  if (selectedTag) {
    emotion = selectedTag.dataset.emotion;
    intensity = 0.7;
  } else if (text) {
    const result = analyzeEmotion(text);
    emotion = result.emotion;
    intensity = result.intensity;
  } else {
    showToast('请输入你的心情或选择一个情绪标签');
    return;
  }

  currentEmotion = emotion;
  currentWeather = EMOTION_TAG_MAP[emotion] || 'sunny';
  const quote = getQuote(emotion);
  const cfg = WEATHER_CONFIG[currentWeather];

  // Update UI
  document.body.setAttribute('data-weather', currentWeather);
  document.getElementById('weatherEmoji').textContent = cfg.emoji;
  document.getElementById('weatherTitle').textContent = cfg.label;
  document.getElementById('weatherQuote').textContent = quote;

  const now = new Date();
  const timeStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  document.getElementById('weatherTime').textContent = timeStr;

  // Save record
  saveRecord(emotion, currentWeather, quote, text);

  // Navigate
  showPage('weatherPage');
}

// ===================== EVENT LISTENERS =====================
document.addEventListener('DOMContentLoaded', () => {
  startHomeBg();

  // Emotion tags
  document.querySelectorAll('.emotion-tag').forEach(tag => {
    tag.addEventListener('click', () => {
      document.querySelectorAll('.emotion-tag').forEach(t => t.classList.remove('selected'));
      tag.classList.add('selected');
      document.getElementById('moodInput').value = '';
    });
  });

  // Input clears tag selection
  document.getElementById('moodInput').addEventListener('input', () => {
    document.querySelectorAll('.emotion-tag').forEach(t => t.classList.remove('selected'));
  });

  // Generate
  document.getElementById('generateBtn').addEventListener('click', generateWeather);

  // Weather page buttons
  document.getElementById('saveBtn').addEventListener('click', savePostcard);
  document.getElementById('regenerateBtn').addEventListener('click', () => {
    const quote = getQuote(currentEmotion);
    document.getElementById('weatherQuote').textContent = quote;
    showToast('已重新生成文案');
  });
  document.getElementById('backBtn').addEventListener('click', () => showPage('homePage'));

  // Calendar navigation
  document.getElementById('goCalendarBtn').addEventListener('click', () => showPage('calendarPage'));
  document.getElementById('calBackBtn').addEventListener('click', () => showPage('homePage'));

  // Resize
  window.addEventListener('resize', () => {
    if (currentPage === 'weatherPage') {
      resizeWeatherCanvas();
      initParticles();
    }
    if (currentPage === 'homePage') {
      drawHomeBg._stars = null;
    }
  });

  // Enter key to generate
  document.getElementById('moodInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      generateWeather();
    }
  });
});
