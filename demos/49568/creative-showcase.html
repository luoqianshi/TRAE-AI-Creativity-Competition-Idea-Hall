<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>饭搭子 · 随机匹配饭友</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #fdf6f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .phone-frame {
      max-width: 390px;
      width: 100%;
      background: #ffffff;
      border-radius: 44px;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      height: 780px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 头部 */
    .header {
      padding: 18px 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border-bottom: 1px solid #f5e6dc;
    }

    .logo {
      font-weight: 700;
      font-size: 20px;
      color: #d97746;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .location {
      background: #fef3e9;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 13px;
      color: #b45309;
      font-weight: 500;
    }

    /* 主内容 */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 匹配卡片 */
    .match-card {
      background: linear-gradient(135deg, #ffedd5, #fff7ed);
      border-radius: 28px;
      padding: 24px 20px;
      text-align: center;
      border: 1px solid #ffe4cc;
      box-shadow: 0 8px 18px rgba(217, 119, 70, 0.08);
    }

    .match-emoji {
      font-size: 48px;
      margin-bottom: 6px;
    }

    .match-title {
      font-size: 20px;
      font-weight: 700;
      color: #7c2d12;
      margin: 8px 0 4px;
    }

    .match-sub {
      color: #9a5d3a;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .btn-match {
      background: #ea580c;
      border: none;
      color: white;
      font-weight: 700;
      font-size: 17px;
      padding: 14px 32px;
      border-radius: 40px;
      width: 100%;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 8px 16px rgba(234, 88, 12, 0.25);
    }

    .btn-match:active {
      background: #c2410c;
      transform: scale(0.97);
    }

    /* 偏好标签 */
    .pref-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 12px 0 6px;
    }

    .tag {
      background: white;
      border: 1px solid #fed7aa;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 13px;
      color: #9a3412;
      font-weight: 500;
    }

    .tag.active {
      background: #ea580c;
      color: white;
      border-color: #ea580c;
    }

    /* 用户卡片列表 */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 17px;
      color: #431407;
    }

    .user-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #fff;
      border: 1px solid #fde0ce;
      border-radius: 22px;
      padding: 14px 16px;
      transition: 0.15s;
    }

    .user-card:active {
      background: #fffaf5;
      border-color: #fdba74;
    }

    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #fed7aa;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #9a3412;
    }

    .user-info {
      flex: 1;
    }

    .user-name {
      font-weight: 650;
      font-size: 16px;
      color: #431407;
    }

    .user-detail {
      font-size: 13px;
      color: #9a5d3a;
      margin-top: 2px;
    }

    .match-score {
      background: #fef3e9;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: #c2410c;
    }

    .invite-btn {
      background: transparent;
      border: 1px solid #fdba74;
      color: #c2410c;
      font-weight: 600;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.2s;
    }

    .invite-btn:active {
      background: #fff7ed;
    }

    /* 底部导航 */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      padding: 10px 18px 18px;
      background: white;
      border-top: 1px solid #fde0ce;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #b08968;
      font-size: 11px;
      font-weight: 500;
    }

    .nav-item.active {
      color: #ea580c;
      font-weight: 600;
    }

    .nav-icon {
      font-size: 22px;
    }

    /* 匹配中弹窗 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-box {
      background: white;
      border-radius: 32px;
      padding: 28px 24px;
      text-align: center;
      width: 280px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    .hidden {
      display: none !important;
    }

    .spinner {
      font-size: 40px;
      animation: spin 1.2s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <!-- 头部 -->
    <div class="header">
      <div class="logo">🍚 饭搭子</div>
      <div class="location">📍 静安寺附近</div>
    </div>

    <!-- 主要内容 -->
    <div class="main-content" id="mainPage">
      <!-- 匹配核心卡片 -->
      <div class="match-card">
        <div class="match-emoji">🥢</div>
        <div class="match-title">今天想和谁一起吃饭？</div>
        <div class="match-sub">随机匹配一位口味相近的饭友</div>
        
        <div class="pref-tags" id="foodTags">
          <span class="tag" data-type="🌶️川菜">🌶️ 川菜</span>
          <span class="tag active" data-type="🍣日料">🍣 日料</span>
          <span class="tag" data-type="🍜面食">🍜 面食</span>
          <span class="tag" data-type="🥗轻食">🥗 轻食</span>
        </div>

        <button class="btn-match" id="startMatchBtn">
          ✨ 立即匹配饭友
        </button>
      </div>

      <!-- 附近也想吃饭的人 -->
      <div class="section-header">
        <span>🔍 附近也在找饭友</span>
        <span style="font-size:13px; color:#c2410c;">更多</span>
      </div>

      <div class="user-list" id="userList">
        <!-- JS动态生成 -->
      </div>

      <!-- 拼桌优惠提示 -->
      <div style="background:#fff7ed; border-radius:20px; padding:14px; font-size:13px; color:#9a3412; display:flex; align-items:center; gap:10px;">
        <span style="font-size:20px;">🎉</span> 附近“一乐拉面”拼桌享8折，已有2组正在拼
      </div>
    </div>

    <!-- 匹配中弹窗 -->
    <div class="modal-overlay hidden" id="matchingModal">
      <div class="modal-box">
        <div class="spinner">🍥</div>
        <div style="font-size:18px; font-weight:700; margin:12px 0 6px;">正在为你寻找饭友...</div>
        <div style="color:#9a5d3a; font-size:14px;">匹配口味相近的小伙伴</div>
        <button id="cancelMatchBtn" style="margin-top:18px; background:#fef3e9; border:none; padding:10px 24px; border-radius:30px; color:#c2410c; font-weight:600;">取消</button>
      </div>
    </div>

    <!-- 匹配成功弹窗 -->
    <div class="modal-overlay hidden" id="successModal">
      <div class="modal-box">
        <div style="font-size:48px;">🎉</div>
        <div style="font-size:20px; font-weight:700; margin:8px 0;">匹配成功！</div>
        <div style="color:#431407;">小琳 也想吃🍣日料</div>
        <div style="font-size:13px; color:#9a5d3a; margin:8px 0;">距离你300米 · 口味相似度92%</div>
        <button id="chatNowBtn" style="background:#ea580c; border:none; color:white; padding:12px 30px; border-radius:30px; font-weight:700; margin-top:10px; width:100%;">开始聊天约饭</button>
        <button id="closeSuccessBtn" style="background:transparent; border:none; color:#9a5d3a; margin-top:8px;">稍后再说</button>
      </div>
    </div>

    <!-- 底部导航 -->
    <div class="bottom-nav">
      <div class="nav-item active" id="navDiscover">
        <span class="nav-icon">🧭</span>
        <span>发现</span>
      </div>
      <div class="nav-item" id="navMessages">
        <span class="nav-icon">💬</span>
        <span>消息</span>
      </div>
      <div class="nav-item" id="navOrders">
        <span class="nav-icon">📋</span>
        <span>订单</span>
      </div>
      <div class="nav-item" id="navMe">
        <span class="nav-icon">👤</span>
        <span>我的</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // 初始用户列表
      const users = [
        { name: '小琳', food: '🍣日料', distance: '300m', score: 92, avatar: '👩🏻' },
        { name: '阿杰', food: '🌶️川菜', distance: '500m', score: 85, avatar: '🧑🏻' },
        { name: 'Mia', food: '🥗轻食', distance: '600m', score: 78, avatar: '👩🏼' },
        { name: '大刘', food: '🍜面食', distance: '800m', score: 81, avatar: '👨🏻' }
      ];

      const userListEl = document.getElementById('userList');
      const foodTags = document.querySelectorAll('#foodTags .tag');
      const startMatchBtn = document.getElementById('startMatchBtn');
      const matchingModal = document.getElementById('matchingModal');
      const successModal = document.getElementById('successModal');
      const cancelMatchBtn = document.getElementById('cancelMatchBtn');
      const chatNowBtn = document.getElementById('chatNowBtn');
      const closeSuccessBtn = document.getElementById('closeSuccessBtn');

      let activeFood = '🍣日料';
      let matchTimer = null;

      // 渲染用户列表
      function renderUsers() {
        if (!userListEl) return;
        let html = '';
        users.forEach(u => {
          html += `
            <div class="user-card">
              <div class="avatar">${u.avatar}</div>
              <div class="user-info">
                <div class="user-name">${u.name}</div>
                <div class="user-detail">想吃${u.food} · ${u.distance}</div>
              </div>
              <span class="match-score">${u.score}%匹配</span>
              <button class="invite-btn">约饭</button>
            </div>
          `;
        });
        userListEl.innerHTML = html;
      }

      // 食物标签切换
      foodTags.forEach(tag => {
        tag.addEventListener('click', function() {
          foodTags.forEach(t => t.classList.remove('active'));
          this.classList.add('active');
          activeFood = this.getAttribute('data-type');
        });
      });

      // 开始匹配
      startMatchBtn.addEventListener('click', () => {
        matchingModal.classList.remove('hidden');
        // 模拟匹配过程，2.5秒后显示成功
        matchTimer = setTimeout(() => {
          matchingModal.classList.add('hidden');
          successModal.classList.remove('hidden');
        }, 2500);
      });

      // 取消匹配
      cancelMatchBtn.addEventListener('click', () => {
        clearTimeout(matchTimer);
        matchingModal.classList.add('hidden');
      });

      // 匹配成功后的操作
      chatNowBtn.addEventListener('click', () => {
        alert('跳转到聊天界面（Demo模拟）');
        successModal.classList.add('hidden');
      });

      closeSuccessBtn.addEventListener('click', () => {
        successModal.classList.add('hidden');
      });

      // 底部导航简单交互
      document.getElementById('navDiscover').addEventListener('click', () => alert('当前在发现页'));
      document.getElementById('navMessages').addEventListener('click', () => alert('消息页面'));
      document.getElementById('navOrders').addEventListener('click', () => alert('拼桌订单'));
      document.getElementById('navMe').addEventListener('click', () => alert('个人中心'));

      // 初始化
      renderUsers();
    })();
  </script>
</body>
</html>
