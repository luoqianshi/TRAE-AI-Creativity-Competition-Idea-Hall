<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: '#030213',
        foreground: '#030213',
        card: '#ffffff',

        destructive: '#d4183d',
        success: '#16A34A',
        'input-bg': '#f3f3f5',

<style>
:root {
  --primary: #030213;
  --background: #ffffff;
  --foreground: #030213;
  --card: #ffffff;
  --muted: #ececf0;
  --muted-foreground: #717182;
  --border: rgba(0, 0, 0, 0.1);
  --accent: #e9ebef;
  --destructive: #d4183d;
  --success: #16A34A;
  --input-bg: #f3f3f5;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--background);
  color: var(--foreground);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Typography */
.h1 { font-size: 24px; line-height: 32px; font-weight: 600; }
.h2 { font-size: 20px; line-height: 28px; font-weight: 600; }
.h3 { font-size: 16px; line-height: 24px; font-weight: 600; }
.body-l { font-size: 15px; line-height: 22px; font-weight: 400; }
.body-m { font-size: 14px; line-height: 20px; font-weight: 400; }
.body-s { font-size: 13px; line-height: 18px; font-weight: 400; }
.caption { font-size: 12px; line-height: 16px; font-weight: 400; }

/* View transitions */
.view-section {
  display: none;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.view-section.active {
  display: flex;
  opacity: 1;
}

/* Typing indicator */
.typing-indicator span {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--muted-foreground);
  margin: 0 2px;
  animation: typing 1.4s infinite;
}
.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typing {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* Chat message animation */
.chat-msg {
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.4s ease, transform 0.4s ease;
}
.chat-msg.show {
  opacity: 1;
  transform: translateY(0);
}

/* Scrollbar */
.chat-scroll::-webkit-scrollbar { width: 4px; }
.chat-scroll::-webkit-scrollbar-track { background: transparent; }
.chat-scroll::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }

/* Nav tab active indicator */
.nav-tab {
  position: relative;
  transition: color 0.2s ease;
}
.nav-tab::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--primary);
  transform: scaleX(0);
  transition: transform 0.2s ease;
}
.nav-tab.active::after {
  transform: scaleX(1);
}

/* Login tab */
.login-tab {
  transition: color 0.2s ease, border-color 0.2s ease;
  border-bottom: 2px solid transparent;
}
.login-tab.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
}

/* Slot badge */
.slot-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 12px;
  line-height: 16px;
}
.slot-pending {
  background: #f3f3f5;
  color: #717182;
}
.slot-filled {
  background: #f0fdf4;
  color: #16A34A;
}

/* Quick action button */
.quick-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 12px;
  border-radius: 6px;
  border: 1px solid rgba(0,0,0,0.1);
  background: #ffffff;
  font-size: 13px;
  line-height: 18px;
  color: var(--foreground);
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.quick-btn:hover {
  background: var(--muted);
  border-color: rgba(0,0,0,0.15);
}

/* Price card */
.price-card {
  background: #FAFAFA;
  border: 1px solid #E5E5E5;
  border-radius: 12px;
  padding: 16px;
}

/* Quotation card */
.quote-card {
  background: #FAFAFA;
  border: 1px solid #E5E5E5;
  border-radius: 12px;
  padding: 16px;
}

/* Bar chart animation */
.bar-animate {
  transition: height 0.6s ease;
}
</style>
</head>

<script>
// ==================== VIEW SWITCHING ====================
let currentView = 'login';
let chatAutoplayDone = false;
let priceAutoplayDone = false;
let quoteAutoplayDone = false;

function switchView(viewName) {
  // Hide all views
  document.querySelectorAll('.view-section').forEach(v => {
    v.classList.remove('active');
  });
  // Show target view
  const target = document.getElementById('view-' + viewName);
  if (target) {
    target.classList.add('active');
  }
  // Update nav tabs
  document.querySelectorAll('.nav-tab').forEach(tab => {
    if (tab.dataset.tab === viewName) {
      tab.classList.add('active');
      tab.style.color = 'var(--primary)';
    } else {
      tab.classList.remove('active');
      tab.style.color = 'var(--muted-foreground)';
    }
  });
  currentView = viewName;

  // Trigger autoplay for views
  if (viewName === 'chat' && !chatAutoplayDone) {
    setTimeout(() => autoplayChat(), 400);
  }
  if (viewName === 'price' && !priceAutoplayDone) {
    setTimeout(() => autoplayPrice(), 400);
  }
  if (viewName === 'quote' && !quoteAutoplayDone) {
    setTimeout(() => autoplayQuote(), 400);
  }
}

// ==================== LOGIN TAB SWITCHING ====================
function switchLoginTab(tab) {
  document.querySelectorAll('.login-tab').forEach(t => {
    if (t.dataset.loginTab === tab) {
      t.classList.add('active');
      t.style.color = 'var(--primary)';
    } else {
      t.classList.remove('active');
      t.style.color = 'var(--muted-foreground)';
    }
  });
  if (tab === 'password') {
    document.getElementById('login-password').classList.remove('hidden');
    document.getElementById('login-code').classList.add('hidden');
  } else {
    document.getElementById('login-password').classList.add('hidden');
    document.getElementById('login-code').classList.remove('hidden');
  }
}

function createAIBubble(content) {
  return `
    <div class="chat-msg flex gap-2 max-w-[85%]">
      <div class="w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0" style="background: var(--primary);">

        <div class="text-[14px] leading-[20px]" style="color: var(--foreground);">${content}</div>
      </div>
    </div>`;
}

function createUserBubble(text) {
  return `
    <div class="chat-msg flex justify-end">
      <div class="rounded-[20px] rounded-tr-[4px] px-3.5 py-2.5 max-w-[80%]" style="background: var(--primary);">
        <div class="text-[14px] leading-[20px] text-white">${text}</div>
      </div>
    </div>`;
}

function createTypingIndicator() {
  return `
    <div class="chat-msg flex gap-2" id="typing-indicator">
      <div class="w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0" style="background: var(--primary);">
        <i class="fa-solid fa-robot text-white" style="font-size: 10px;"></i>
      </div>
      <div class="rounded-[20px] rounded-tl-[4px] px-4 py-3" style="background: var(--ai-bubble); border: 1px solid rgba(0,0,0,0.06);">
        <div class="typing-indicator"><span></span><span></span><span></span></div>
      </div>
    </div>`;
}

function addMessage(containerId, html, delay) {
  return new Promise(resolve => {
    setTimeout(() => {
      const container = document.getElementById(containerId);
      // Remove typing indicator if present
      const typing = container.querySelector('#typing-indicator');
      if (typing) typing.remove();
      container.insertAdjacentHTML('beforeend', html);
      const msg = container.lastElementChild;
      container.scrollTop = container.scrollHeight;
      requestAnimationFrame(() => {
        msg.classList.add('show');
        setTimeout(resolve, 200);
      });
    }, delay);
  });
}

function showTyping(containerId, delay) {
  return new Promise(resolve => {
    setTimeout(() => {
      const container = document.getElementById(containerId);
      container.insertAdjacentHTML('beforeend', createTypingIndicator());
      const typing = container.querySelector('#typing-indicator');
      if (typing) {
        typing.classList.add('show');
      }
      container.scrollTop = container.scrollHeight;
      setTimeout(resolve, 600);
    }, delay);
  });
}
