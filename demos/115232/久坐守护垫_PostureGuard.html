<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>久坐守护垫 PostureGuard · 硬件交互原型</title>
<style>
  :root{
    --bg:#0b0f17; --panel:#141a2b; --line:#26304d;
    --brand:#ffb15a; --brand2:#ff7a7a; --ok:#4ee6a8; --warn:#ffcf5a;
    --text:#f2f4ff; --muted:#93a0c4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:radial-gradient(900px 480px at 15% -5%,#2a1c10 0,transparent 60%),var(--bg);
    color:var(--text);min-height:100vh}
  .wrap{max-width:1080px;margin:0 auto;padding:38px 22px 60px}
  .badge{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#1a0e00;font-weight:700;padding:6px 14px;border-radius:999px;font-size:13px}
  h1{font-size:34px;margin:14px 0 4px}
  h1 span{color:var(--brand)}
  .lead{color:var(--muted);margin-bottom:26px}
  .grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
  .panel h3{font-size:15px;margin-bottom:12px;color:var(--muted);letter-spacing:.5px}
  canvas{width:100%;border-radius:12px;background:#0a0f1c;display:block;cursor:crosshair}
  .alert{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:14px;display:none}
  .alert.show{display:block}
  .alert.bad{background:#3a1414;border:1px solid var(--brand2);color:#ffb3b3}
  .alert.warn{background:#332a10;border:1px solid var(--warn);color:#ffe6a3}
  .alert.ok{background:#10331f;border:1px solid var(--ok);color:#a7f0cf}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .stat{background:#0e1428;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .stat .v{font-size:20px;font-weight:800;color:var(--brand)}
  .stat .k{font-size:12px;color:var(--muted);margin-top:2px}
  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .b{padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:#0e1428;color:var(--text);cursor:pointer;font-size:13px;transition:.15s}
  .b:hover{border-color:var(--brand);transform:translateY(-1px)}
  .b.primary{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#1a0e00;border:none;font-weight:700}
  .hint{color:var(--muted);font-size:13px;line-height:1.7;margin-top:6px}
  .score{font-size:46px;font-weight:800;text-align:center;margin-top:6px}
  @media(max-width:840px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <span class="badge">硬件交互赛道 · TRAE Work 原型</span>
  <h1>久坐守护垫 <span>PostureGuard</span></h1>
  <div class="lead">坐姿 + 久坐检测坐垫 · 在下方“坐垫压力视图”里移动鼠标模拟身体重心，系统实时判断坐姿是否端正、久坐是否超时，并给出震动提醒（此处用提示条代替）。</div>

  <div class="grid">
    <div class="panel">
      <h3>① 坐垫压力 / 重心传感器视图（俯视）</h3>
      <canvas id="mat" width="520" height="320"></canvas>
      <div class="hint">鼠标代表你的身体重心：<b>居中</b>＝端正，<b>偏上</b>＝前倾含胸，<b>偏左/右</b>＝侧歪。也可点下方按钮模拟姿态。</div>
      <div class="btns">
        <button class="b" data-p="center">🟢 端正坐姿</button>
        <button class="b" data-p="front">🔴 前倾含胸</button>
        <button class="b" data-p="left">🟠 向左歪</button>
        <button class="b" data-p="right">🟠 向右歪</button>
      </div>
      <div class="alert" id="alert"></div>
    </div>

    <div class="panel">
      <h3>② 实时健康面板</h3>
      <div class="score" id="score">100</div>
      <div class="hint" style="text-align:center;margin-top:0">坐姿健康分（越高越好）</div>
      <div class="stats">
        <div class="stat"><div class="v" id="sPosture">端正</div><div class="k">当前姿态</div></div>
        <div class="stat"><div class="v" id="sTime">00:00</div><div class="k">久坐时长</div></div>
        <div class="stat"><div class="v" id="sVib">—</div><div class="k">震动提醒</div></div>
      </div>
      <div class="btns">
        <button class="b primary" id="startBtn">▶ 开始久坐计时</button>
        <button class="b" id="resetBtn">↺ 重置</button>
      </div>
      <div class="hint" style="margin-top:14px">
        坐垫内置柔性压力阵列 + 陀螺仪，本地计算不上传；久坐超 45 分钟自动震动，保护腰椎与颈椎。
      </div>
    </div>
  </div>
</div>

<script>
const cv = document.getElementById('mat');
const ctx = cv.getContext('2d');
const scoreEl = document.getElementById('score');
const alertEl = document.getElementById('alert');
const sPosture = document.getElementById('sPosture');
const sTime = document.getElementById('sTime');
const sVib = document.getElementById('sVib');

let center = { x:cv.width/2, y:cv.height/2 };   // 身体重心
let posture = 'center';
let sitting = 0;            // 秒
let timerOn = false;
let lastTs = 0;

function setAlert(type, msg){
  alertEl.className = 'alert show ' + type;
  alertEl.textContent = msg;
}
function evaluate(){
  const dx = center.x - cv.width/2;
  const dy = center.y - cv.height/2;
  let score = 100, label = '端正', type='ok', msg='✅ 坐姿端正，继续保持。';
  if(dy < -40){ score = 55; label='前倾含胸'; type='bad'; msg='🚨 检测到前倾含胸！请挺胸收腹，屏幕抬高至视线平齐。'; }
  else if(dx < -45){ score = 70; label='向左歪'; type='warn'; msg='⚠️ 身体向左歪斜，双脚踩实、双肩放平。'; }
  else if(dx > 45){ score = 70; label='向右歪'; type='warn'; msg='⚠️ 身体向右歪斜，调整重心到正中。'; }
  else if(Math.abs(dx)>20 || Math.abs(dy)>20){ score = 88; label='轻微偏移'; type='ok'; msg='✅ 姿态基本端正，可再居中一点。'; }
  if(sitting > 45*60){ score = Math.min(score, 40); type='bad'; msg='🚨 已久坐超过 45 分钟！请起身活动 3–5 分钟。'; }
  scoreEl.textContent = score;
  scoreEl.style.color = score>=85? 'var(--ok)' : score>=65? 'var(--warn)' : 'var(--brand2)';
  sPosture.textContent = label;
  setAlert(type, msg);
  sVib.textContent = (type==='bad')? '震动中' : (type==='warn'? '轻震':'待机');
  return label;
}
function draw(){
  ctx.fillStyle='#0a0f1c'; ctx.fillRect(0,0,cv.width,cv.height);
  // 坐垫轮廓
  ctx.strokeStyle='#2a3450'; ctx.lineWidth=2;
  ctx.strokeRect(60,40,cv.width-120,cv.height-80);
  ctx.fillStyle='#10182b'; ctx.fillRect(60,40,cv.width-120,cv.height-80);
  // 压力热力（以重心为中心）
  const g = ctx.createRadialGradient(center.x,center.y,5,center.x,center.y,120);
  const col = posture==='front'? 'rgba(255,122,122,.55)' : posture.startsWith('left')||posture==='right'? 'rgba(255,207,90,.5)' : 'rgba(78,230,168,.5)';
  g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(60,40,cv.width-120,cv.height-80);
  // 重心点
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(center.x,center.y,7,0,7); ctx.fill();
  ctx.strokeStyle='#5ad1ff'; ctx.beginPath(); ctx.arc(center.x,center.y,14,0,7); ctx.stroke();
  // 中线参考
  ctx.strokeStyle='rgba(90,209,255,.25)'; ctx.setLineDash([5,5]);
  ctx.beginPath(); ctx.moveTo(cv.width/2,40); ctx.lineTo(cv.width/2,cv.height-40); ctx.stroke();
  ctx.setLineDash([]);
  requestAnimationFrame(draw);
}
function fmt(s){ const m=Math.floor(s/60), ss=s%60; return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }
function loop(ts){
  if(timerOn){
    if(!lastTs) lastTs=ts;
    sitting += (ts-lastTs)/1000; lastTs=ts;
    sTime.textContent = fmt(Math.floor(sitting));
    evaluate();
  }
  requestAnimationFrame(loop);
}
cv.addEventListener('mousemove', e=>{
  const r = cv.getBoundingClientRect();
  center.x = (e.clientX-r.left)/r.width*cv.width;
  center.y = (e.clientY-r.top)/r.height*cv.height;
  const dx=center.x-cv.width/2, dy=center.y-cv.height/2;
  posture = dy<-40? 'front' : dx<-45? 'left' : dx>45? 'right' : 'center';
  evaluate();
});
document.querySelectorAll('.b[data-p]').forEach(b=> b.addEventListener('click', ()=>{
  const p=b.dataset.p; posture=p;
  if(p==='center') center={x:cv.width/2,y:cv.height/2};
  else if(p==='front') center={x:cv.width/2,y:cv.height/2-70};
  else if(p==='left') center={x:cv.width/2-70,y:cv.height/2};
  else if(p==='right') center={x:cv.width/2+70,y:cv.height/2};
  evaluate();
}));
document.getElementById('startBtn').addEventListener('click', ()=>{
  timerOn=!timerOn; lastTs=0;
  document.getElementById('startBtn').textContent = timerOn? '⏸ 暂停计时':'▶ 开始久坐计时';
});
document.getElementById('resetBtn').addEventListener('click', ()=>{
  sitting=0; sTime.textContent='00:00'; timerOn=false; lastTs=0;
  document.getElementById('startBtn').textContent='▶ 开始久坐计时';
  posture='center'; center={x:cv.width/2,y:cv.height/2}; evaluate();
});
evaluate(); draw(); requestAnimationFrame(loop);
</script>
</body>
</html>
