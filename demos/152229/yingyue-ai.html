// ============================
// 工具函数
// ============================
function getTomorrow() {
  const d = new Date(); d.setDate(d.getDate() + 1);
  return d.toISOString().split("T")[0];
}
function addHour(t) { if (!t) return "12:00"; const [h, m] = t.split(":").map(Number); return String((h + 1) % 24).padStart(2, "0") + ":" + String(m).padStart(2, "0"); }
function addMinutes(t, min) { const [h, m] = t.split(":").map(Number); const total = h * 60 + m + min; return String(Math.floor(total / 60) % 24).padStart(2, "0") + ":" + String(total % 60).padStart(2, "0"); }
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
function toUTC(d, t) { const local = new Date(d + "T" + t + ":00+08:00"); return local.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, ""); }

// ============================
// ICS 生成
// ============================
function generateICS(event) {
  const uid = "yingyue-" + Date.now() + "@app";
  const now = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const start = event.allDay ? event.date.replace(/-/g, "") + "T000000" : toUTC(event.date, event.startTime);
  const end = event.allDay ? (() => { const d = new Date(event.date); d.setDate(d.getDate() + 1); return d.toISOString().split("T")[0].replace(/-/g, "") + "T000000"; })() : toUTC(event.date, event.endTime || addHour(event.startTime));
  const lines = [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//应约AI//CN","BEGIN:VEVENT",
    "UID:" + uid, "DTSTAMP:" + now, "DTSTART:" + start, "DTEND:" + end,
    "SUMMARY:" + (event.title || "日程"),
  ];
  if (event.location) lines.push("LOCATION:" + event.location);
  if (event.notes) lines.push("DESCRIPTION:" + event.notes);
  if (event.reminderMinutes > 0) {
    lines.push("BEGIN:VALARM", "TRIGGER:-PT" + event.reminderMinutes + "M", "ACTION:DISPLAY", "DESCRIPTION:提醒: " + (event.title || "日程"), "END:VALARM");
  }
  lines.push("END:VEVENT","END:VCALENDAR");
  return lines.join("\r\n");
}

function downloadICS(event) {
  const ics = generateICS(event);
  const blob = new Blob([ics], {type:"text/calendar;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = (event.title||"event")+".ics";
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

// ============================
// 日历添加
// ============================
async function addToCalendar(event) {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const isMac = /Macintosh/.test(navigator.userAgent);
  const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  const canShare = typeof navigator.share === "function" && typeof navigator.canShare === "function";
  const ics = generateICS(event);

  // 1) macOS / iOS — data URL 直接调起 Calendar.app
  if (isMac || isIOS) {
    try {
      const bytes = new TextEncoder().encode(ics);
      const bin = Array.from(bytes, b => String.fromCharCode(b)).join("");
      const url = "data:text/calendar;charset=utf-8;base64," + btoa(bin);
      // 用隐藏 iframe 加载，避免 file:// 下 location.href 可能被阻止
      const iframe = document.createElement("iframe");
      iframe.style.display = "none";
      iframe.src = url;
      document.body.appendChild(iframe);
      // 2秒后清理 iframe
      setTimeout(() => { document.body.removeChild(iframe); }, 2000);
      // 同时也尝试 window.location 作为备选
      setTimeout(() => { window.location.href = url; }, 300);
      return { status: "handoff", message: "已调起系统日历，请确认保存" };
    } catch {}
  }

  // 2) Web Share
  if (canShare) {
    try {
      const f = new File([ics], (event.title||"event")+".ics", {type:"text/calendar"});
      if (navigator.canShare({files:[f]})) {
        await navigator.share({title:event.title||"日程",text:event.title||"",files:[f]});
        return { status: "handoff", message: "已调起系统分享，请选择添加到日历" };
      }
    } catch {}
  }

  // 3) Google Calendar
  if (!isMobile) {
    const params = new URLSearchParams();
    params.set("action","TEMPLATE"); params.set("text",event.title||"日程");
    if (event.location) params.set("location",event.location);
    params.set("ctz","Asia/Shanghai");
    if (event.allDay) {
      const s = event.date.replace(/-/g,""); const d = new Date(event.date); d.setDate(d.getDate()+1);
      params.set("dates", s + "/" + d.toISOString().split("T")[0].replace(/-/g,""));
    } else if (event.startTime) {
      const s = toUTC(event.date, event.startTime); const e = toUTC(event.date, event.endTime || addHour(event.startTime));
      params.set("dates", s + "/" + e);
    }
    window.open("https://calendar.google.com/calendar/render?" + params.toString(), "_blank", "noopener,noreferrer");
    return { status: "handoff", message: "已打开 Google Calendar，请确认添加" };
  }

  // 4) Fallback
  downloadICS(event);
  return { status: "handoff", message: "已生成日历文件，请用系统日历打开导入" };
}

// Mock 分析器
// ============================
async function mockAnalyze(input) {
  const { mode, text, scenario: reqScenario, relationship, tone, disclosureLevel } = input;
  await delay(1200);
  const rid = "mock-" + Date.now();

  let effective = mode;
  if (mode === "auto") {
    if (/必须|说过.*次|能不能/.test(text)) effective = "propriety";
    else if (/迟到|晚到|取消|请假|改约|临时|去不了/.test(text)) effective = "change";
    else effective = "schedule";
  }

  if (effective === "propriety") return mockPropriety(rid, relationship, tone);
  if (effective === "change") return mockChange(rid, text, reqScenario, relationship, tone, disclosureLevel);
  return mockSchedule(rid, text);
}

function mockSchedule(rid, text) {
  const tomorrow = getTomorrow();
  let title = "新建日程", date = tomorrow, startTime = "15:00", location = null, participants = [], reminder = 30, reminderSrc = "default", ambig = [], needConfirm = false, origTime = null;

  const pMatch = text.match(/和([^\s讨开会面聊见]{1,10})/);
  if (pMatch && pMatch[1]) { participants = [pMatch[1].trim()]; title = "与" + pMatch[1].trim() + "见面"; }
  if (/讨论项目/.test(text)) title = "讨论项目";
  if (/开会|会议/.test(text)) { title = "会议"; if (participants.length) title = "与" + participants[0] + "开会"; }
  if (/明天/.test(text)) { origTime = "明天"; date = tomorrow; }
  if (/今天/.test(text)) { date = new Date().toISOString().split("T")[0]; origTime = origTime || "今天"; }
  if (/下午三点|下午3点|15点|15:00/.test(text)) { startTime = "15:00"; origTime = (origTime||"") + "下午三点"; }
  if (/上午十点|上午10点|10:00/.test(text)) { startTime = "10:00"; origTime = (origTime||"") + "上午十点"; }
  if (/公司二楼/.test(text)) location = "公司二楼";
  if (/提前半小时|提前30分钟/.test(text)) { reminder = 30; reminderSrc = "user"; }
  if (/提前一小时|提前60分钟/.test(text)) { reminder = 60; reminderSrc = "user"; }
  if (/月底|下个月|找个时间|改天|有空/.test(text)) { date = null; startTime = null; ambig.push("具体日期未明确"); needConfirm = true; }
  if (/聊一下|见个面/.test(text) && !startTime) { if (!ambig.includes("具体时间未明确")) ambig.push("具体时间未明确"); needConfirm = true; }

  return {
    requestId: rid, primaryIntent: "schedule",
    intentReason: needConfirm ? "输入包含模糊的时间描述，识别为日程安排，但部分信息需要确认。" : "输入包含明确的时间、人物和事件描述，识别为日程安排。",
    schedule: { title, originalTimeText: origTime, date, startTime, endTime: startTime ? addHour(startTime) : null, allDay: !startTime, location, participants, reminderMinutes: reminder, reminderSource: reminderSrc, notes: null, confidence: needConfirm ? 0.5 : 0.9, ambiguities: ambig, needsConfirmation: needConfirm },
    propriety: null, communication: null, warnings: [],
  };
}

function mockPropriety(rid, _rel, _tone) {
  return {
    requestId: rid, primaryIntent: "propriety_check",
    intentReason: "输入文本带有命令语气和催促色彩，识别为得体性检查请求。",
    schedule: null,
    propriety: {
      overall: "high_risk",
      summary: "这段话带有较强的命令语气和催促感，可能让对方感到不被尊重和有压力。",
      scores: { clarity: 75, respect: 30, responsibility: 40, pressureRisk: 85 },
      riskPoints: [

function mockChange(rid, text, scenario, _rel, _tone, _disclosure) {
  const s = scenario || "late";
  let concerns = [], feelings = [], suggestions = [], replies = [];

  if (s === "late") {
    concerns = ["会不会影响后续安排", "具体晚多久", "是否需要调整会议内容"];
    feelings = ["有些着急", "担心计划被打乱"];
    suggestions = ["尽快通知对方", "提供预计到达时间", "如有影响提前说明"];
    const lateMin = /十五分钟|15分钟|15min/i.test(text) ? 15 : 30;
    const origT = /十点|10点|10:00/.test(text) ? "10:00" : null;
    const newT = origT ? addMinutes(origT, lateMin) : "稍后";
    replies = [
      { type: "direct", content: "抱歉通知您，我预计晚到约" + lateMin + "分钟，" + newT + "到，给您添麻烦了。" },
      { type: "gentle", content: "非常抱歉，路上出了点临时状况，我可能要晚到大约" + lateMin + "分钟，预计" + newT + "能到。真的很抱歉给您带来不便，如果这个时间对您不方便，我们可以调整一下。感谢您的理解。" },
      { type: "detailed", content: "您好，非常抱歉通知您一个突发情况。我前往见面的路上遇到了临时状况，目前需要调整出行方式。根据当前情况，预计我会" + newT + "到达，大约晚到" + lateMin + "分钟。这个延迟可能会压缩我们原来的时间，如果这影响到您后面的安排，我们可以适当延长或者另外约时间补上。再次为这个突发状况道歉，感谢您的耐心和配合。" },
    ];
  } else if (s === "reschedule") {
    concerns = ["新时间是否合适", "会不会影响其他安排"]; feelings = ["需要调整计划", "有些不便"];
    suggestions = ["提供多个备选时间", "说明改约原因", "确认新时间"];
    replies = [
      { type: "direct", content: "抱歉，原计划的时间我这边临时有事，想改约到其他时间，您看什么时候方便？" },
      { type: "gentle", content: "实在不好意思，我这边临时有个安排冲突了，想跟您商量一下改个时间。您看明天下午或者后天上午哪个时间对您更方便？给您添麻烦了，非常抱歉。" },
      { type: "detailed", content: "您好，非常抱歉打扰您。我这边临时接到一个紧急安排，和我们原定的时间冲突了，想跟您商量一下改约的事。我这边明天下午两点到四点、后天上午十点到十二点都有空，您看哪个时间对您比较方便？如果这两个时间都不合适，也请您告诉我您方便的时间段，我来配合您。再次为这次临时调整道歉，感谢您的理解。" },
    ];
  } else if (s === "cancel") {
    concerns = ["为什么取消", "后续安排怎么办"]; feelings = ["失望", "计划被打乱"];
    suggestions = ["说明原因", "提供补救方案", "表达歉意"];
    replies = [
      { type: "direct", content: "抱歉通知您，原定的见面我这边需要取消，改天再约，实在不好意思。" },
      { type: "gentle", content: "非常抱歉，我这边临时出了点情况，原定的见面可能需要取消了。真的很不好意思给您带来不便，等我这边处理好之后第一时间再跟您约时间，您看可以吗？" },
      { type: "detailed", content: "您好，非常抱歉地通知您，我这边出现了临时的紧急情况，原定的见面需要取消了。真的非常抱歉给您带来不便，也很遗憾这次没能见上面。等我这边的事情处理妥当之后，我会第一时间主动联系您，重新约一个时间。如果您有什么需要我配合的，请随时告诉我。再次为这次临时取消道歉，感谢您的理解。" },
    ];
  } else {
    concerns = ["请假期间工作怎么办", "需要多久"]; feelings = ["需要安排替代方案", "担心工作进度"];
    suggestions = ["说明工作交接", "给出大致时间", "保持联系"];
    const priv = /不想说|不方便说|个人原因/.test(text);
    replies = [
      { type: "direct", content: priv ? "您好，明天我因个人事务需要请假一天，工作已经安排妥当，给您添麻烦了。" : "您好，明天我因家中有事需要请假一天，工作已经安排交接，给您添麻烦了。" },
      { type: "gentle", content: priv ? "领导您好，想跟您请个假，明天我有一些个人事务需要处理，需要请假一天。工作上的事情我已经做了安排，紧急的事情可以联系我。给您添麻烦了，非常抱歉。" : "领导您好，想跟您请个假，明天家中有事需要我处理，想请一天假。工作上我已经做好了安排，紧急的事情可以随时联系我。给您添麻烦了，非常抱歉。" },
      { type: "detailed", content: priv ? "领导您好，打扰了。想跟您申请明天请假一天，因为有一些个人事务需要亲自处理。工作方面我已经做了安排：日常事务已经交接给同事了，紧急的事情可以随时电话联系我。如果有什么重要事项需要我提前处理的，也请您告诉我，我会在今天安排好。给团队添麻烦了，非常抱歉，感谢您的理解。" : "领导您好，打扰了。想跟您申请明天请假一天，因为家里有件事情需要我亲自去处理一下。工作方面我已经做了安排：日常事务已经跟同事交接好了，紧急的事情可以随时电话联系我。如果有什么重要事项需要我提前处理的，也请您告诉我，我会在今天下班前安排妥当。给团队添麻烦了，非常抱歉，感谢您的理解。" },
    ];
  }

  const st = { late: "迟到", reschedule: "改约", cancel: "取消", leave: "请假" };
  return {
    requestId: rid, primaryIntent: s,
    intentReason: "输入涉及" + (st[s]||s) + "场景，识别为变动沟通请求。",
    schedule: null, propriety: null,
    communication: { scenario: s, likelyConcerns: concerns, possibleFeelings: feelings, missingInformation: [], suggestedActions: suggestions, replies, updatedSchedule: null },
    warnings: [],
  };
}

const STORAGE_KEY = "yingyue-history-v1";
function getHistory() { try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : []; } catch { return []; } }
function addHistory(e) { try { const h = getHistory(); const u = [e, ...h].slice(0, 10); localStorage.setItem(STORAGE_KEY, JSON.stringify(u)); return u; } catch { return getHistory(); } }
function removeHistory(id) { try { const h = getHistory(); const u = h.filter(e => e.id !== id); localStorage.setItem(STORAGE_KEY, JSON.stringify(u)); return u; } catch { return getHistory(); } }
function clearHistory_() { try { localStorage.removeItem(STORAGE_KEY); return []; } catch { return getHistory(); } }

    <div className="bg-white border border-gray-200 rounded-xl p-4 space-y-4 animate-fade-in">
      <div className="flex items-center justify-between">
        <h3 className="font-semibold text-gray-900 flex items-center gap-2"><Icons.MessageSquareHeart className="w-4 h-4 text-indigo-600" />得体性分析</h3>
        <span className={"px-3 py-1 text-sm font-medium rounded-full border " + ol.color}>{ol.text}</span>
      </div>
      <p className="text-sm text-gray-700">{analysis.summary}</p>
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <ScoreBar label="清晰度" value={analysis.scores.clarity} />
        <ScoreBar label="尊重度" value={analysis.scores.respect} />
        <ScoreBar label="责任感" value={analysis.scores.responsibility} />
        <ScoreBar label="压迫风险" value={analysis.scores.pressureRisk} inverted />
      </div>
      {analysis.riskPoints.length > 0 && (
        <div><h4 className="text-sm font-medium text-gray-800 mb-2">风险措辞</h4>
          <div className="space-y-2">{analysis.riskPoints.map((rp, i) => (
            <div key={i} className="bg-red-50 border border-red-100 rounded-lg p-3">
              <p className="text-sm font-medium text-red-800">&ldquo;{rp.quote}&rdquo;</p>
              <p className="text-sm text-red-600 mt-1">{rp.reason}</p>
              <p className="text-sm text-green-700 mt-1">建议: {rp.suggestion}</p>
            </div>
          ))}</div>
        </div>
      )}
      {analysis.possibleFeelings.length > 0 && (
        <div><h4 className="text-sm font-medium text-gray-800 mb-1">对方可能的感受</h4>
          <div className="flex flex-wrap gap-2">{analysis.possibleFeelings.map((f, i) => <span key={i} className="px-2.5 py-1 text-sm bg-gray-100 text-gray-700 rounded-full">{f}</span>)}</div>
        </div>
      )}
      {analysis.recommendedRewrite && (
        <div><h4 className="text-sm font-medium text-gray-800 mb-1">推荐改写</h4><CopyableText text={analysis.recommendedRewrite} /></div>
      )}
    </div>
  );
}

// ReplyVariants
function ReplyCard({ reply }) {
  const [copied, setCopied] = useState(false);
  const meta = VARIANT_META[reply.type];
  const IconComp = Icons[meta.icon];
  return (
    <div className="bg-white border border-gray-200 rounded-xl p-4 flex flex-col">
      <div className="flex items-center gap-2 mb-2">
        <span className="text-indigo-600"><IconComp className="w-4 h-4" /></span>
        <span className="font-medium text-gray-900">{meta.label}</span>
        <span className="text-xs text-gray-400 ml-auto">{meta.desc}</span>
      </div>
      <div className="flex-1"><p className="text-sm text-gray-700 leading-relaxed whitespace-pre-wrap">{reply.content}</p></div>
      <div className="flex items-center justify-between mt-3 pt-3 border-t border-gray-100">
        <span className="text-xs text-gray-400">{reply.content.length} 字</span>
        <button onClick={() => { navigator.clipboard.writeText(reply.content); setCopied(true); setTimeout(() => setCopied(false), 2000); }}
          className="flex items-center gap-1 px-3 py-1.5 text-sm text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors">
          {copied ? <><Icons.Check className="w-3.5 h-3.5 text-green-500" /><span className="text-green-600">已复制</span></> : <><Icons.Copy className="w-3.5 h-3.5" /><span>复制</span></>}
        </button>
      </div>
    </div>
  );
}
function ReplyVariants({ replies, onRegen }) {
  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h3 className="font-semibold text-gray-900">回复方案</h3>
        {onRegen && <button onClick={onRegen} className="text-sm text-indigo-600 hover:text-indigo-800">重新生成</button>}
      </div>
      <div className="hidden md:grid md:grid-cols-3 gap-3">{replies.map(r => <ReplyCard key={r.type} reply={r} />)}</div>
      <div className="md:hidden space-y-3">{replies.map(r => <ReplyCard key={r.type} reply={r} />)}</div>
    </div>
  );
}

// ChangeForm
function ChangeForm({ communication, onRegen }) {
  const { scenario, likelyConcerns, possibleFeelings, missingInformation, suggestedActions, replies } = communication;
  return (
    <div className="space-y-4 animate-fade-in">
      <div className="flex items-center gap-2">
        <span className="px-3 py-1 text-sm font-medium bg-indigo-50 text-indigo-700 rounded-full border border-indigo-200">{SCENARIO_LABELS[scenario]}</span>
      </div>
      <div className="bg-white border border-gray-200 rounded-xl p-4 space-y-3">
        {likelyConcerns.length > 0 && <Section icon={<Icons.Brain className="w-4 h-4 text-blue-500" />} title="对方可能关心的问题" items={likelyConcerns} />}
        {possibleFeelings.length > 0 && <Section icon={<Icons.ChevronRight className="w-4 h-4 text-purple-500" />} title="对方可能的感受" items={possibleFeelings} />}
        {missingInformation.length > 0 && (
          <div className="bg-amber-50 border border-amber-200 rounded-lg p-3">
            <p className="text-sm font-medium text-amber-800 flex items-center gap-1.5"><Icons.AlertTriangle className="w-4 h-4" />缺失的信息</p>
            <ul className="mt-1 space-y-0.5">{missingInformation.map((item, i) => <li key={i} className="text-sm text-amber-700">- {item}</li>)}</ul>
          </div>
        )}
        {suggestedActions.length > 0 && (
          <div><h4 className="text-sm font-medium text-gray-800 mb-1.5">建议补救动作</h4>
            <div className="flex flex-wrap gap-2">{suggestedActions.map((a, i) => <span key={i} className="px-2.5 py-1 text-sm bg-indigo-50 text-indigo-700 rounded-full">{a}</span>)}</div>
          </div>
        )}
      </div>
      <ReplyVariants replies={replies} onRegen={onRegen} />
    </div>
  );
}
function Section({ icon, title, items }) {
  return (
    <div><h4 className="text-sm font-medium text-gray-800 mb-1.5 flex items-center gap-1.5">{icon}{title}</h4>
      <ul className="space-y-1">{items.map((item, i) => <li key={i} className="text-sm text-gray-600 flex items-start gap-1.5"><span className="text-gray-400 mt-0.5">&bull;</span>{item}</li>)}</ul>
    </div>
  );
}

// IntentBadge
function IntentBadge({ response }) {
  return (
    <div className="bg-white border border-gray-200 rounded-xl p-4 space-y-2 animate-fade-in">
      <div className="flex items-center gap-2"><Icons.Sparkles className="w-4 h-4 text-indigo-600" /><span className="text-sm font-medium text-gray-700">识别意图</span>
        <span className="px-2.5 py-0.5 text-xs font-medium bg-indigo-50 text-indigo-700 rounded-full">{INTENT_LABELS[response.primaryIntent] || "未知"}</span>
      </div>
      <p className="text-sm text-gray-600">{response.intentReason}</p>
      {response.warnings?.length > 0 && (
        <div className="flex items-start gap-1.5 text-sm text-amber-600"><Icons.AlertTriangle className="w-4 h-4 flex-shrink-0 mt-0.5" />
          <ul className="space-y-0.5">{response.warnings.map((w, i) => <li key={i}>{w}</li>)}</ul>
        </div>
      )}
    </div>
  );
}

// Loading
function LoadingResult() {
  return (
    <div className="flex flex-col items-center justify-center py-12 space-y-4">
      <div className="relative"><Icons.Sparkles className="w-8 h-8 text-indigo-600 animate-pulse" /><div className="absolute inset-0 w-8 h-8 bg-indigo-200 rounded-full animate-ping opacity-20"></div></div>
      <p className="text-sm text-gray-500">AI 正在分析中...</p>
    </div>
  );
}

// Error
function ErrorResult({ message, onRetry }) {
  return (
    <div className="flex flex-col items-center justify-center py-12 space-y-4 text-center">
      <div className="w-12 h-12 rounded-full bg-red-50 flex items-center justify-center"><Icons.AlertCircle className="w-6 h-6 text-red-500" /></div>
      <p className="text-sm text-red-600 max-w-sm">{message}</p>
      {onRetry && <button onClick={onRetry} className="flex items-center gap-2 px-4 py-2 text-sm text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors"><Icons.RefreshCw className="w-4 h-4" />重试</button>}
    </div>
  );
}

// HistoryDrawer
function HistoryDrawer({ open, entries, onClose, onReload, onDelete, onClear }) {
  const [confirm, setConfirm] = useState(false);
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50">
      <div className="absolute inset-0 bg-black/40" onClick={onClose} />
      <div className="absolute right-0 top-0 bottom-0 w-full max-w-md bg-white shadow-xl flex flex-col">
        <div className="flex items-center justify-between px-4 py-3 border-b border-gray-100">
          <h2 className="font-semibold text-gray-900">历史记录</h2>
          <div className="flex items-center gap-2">
            {entries.length > 0 && (
              <button onClick={() => { if (confirm) { onClear(); setConfirm(false); } else { setConfirm(true); setTimeout(() => setConfirm(false), 3000); } }}
                className={"text-sm px-2 py-1 rounded-lg transition-colors " + (confirm ? "text-white bg-red-500" : "text-gray-500 hover:text-red-600 hover:bg-red-50")}>
                {confirm ? "确认清空" : "清空"}
              </button>
            )}
            <button onClick={onClose} className="p-1.5 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition-colors"><Icons.X className="w-5 h-5" /></button>
          </div>
        </div>
        <div className="flex-1 overflow-y-auto scrollbar-thin">
          {entries.length === 0 ? (
            <div className="flex flex-col items-center justify-center h-full text-gray-400"><Icons.Clock className="w-8 h-8 mb-2" /><p className="text-sm">暂无历史记录</p></div>
          ) : (
            <div className="divide-y divide-gray-100">{entries.map(entry => (
              <div key={entry.id} className="px-4 py-3 hover:bg-gray-50 transition-colors">
                <div className="flex items-start justify-between gap-2">
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 mb-1">
                      <span className="text-xs text-gray-500">{new Date(entry.timestamp).toLocaleString("zh-CN", {month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})}</span>
                      <span className="text-xs px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded-full">{INTENT_LABELS[entry.response.primaryIntent] || "未知"}</span>
                    </div>
                    <p className="text-sm text-gray-700 line-clamp-2">{entry.inputText}</p>
                  </div>
                  <div className="flex items-center gap-1 flex-shrink-0">
                    <button onClick={() => onReload(entry)} className="p-1.5 text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors"><Icons.RotateCw className="w-4 h-4" /></button>
                    <button onClick={() => onDelete(entry.id)} className="p-1.5 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors"><Icons.Trash2 className="w-4 h-4" /></button>
                  </div>
                </div>
              </div>
            ))}</div>
          )}
        </div>
      </div>
    </div>
  );
}

// ============================
// 主应用
// ============================
function App() {
  const [mode, setMode] = useState("auto");
  const [rel, setRel] = useState("unspecified");
  const [tone, setTone] = useState("natural");
  const [scenario, setScenario] = useState("late");
  const [disclosure, setDisclosure] = useState("brief");
  const [inputText, setInputText] = useState("");
  const [view, setView] = useState({type: "idle"});
  const [historyOpen, setHistoryOpen] = useState(false);
  const [history, setHistory] = useState([]);

  useEffect(() => { setHistory(getHistory()); }, []);

  const loading = view.type === "loading";

  const handleAnalyze = useCallback(async (text) => {
    setInputText(text);
    setView({type: "loading"});
    try {
      const body = { mode, text, relationship: rel, tone, scenario: mode === "change" ? scenario : null, disclosureLevel: mode === "change" ? disclosure : null, clientContext: { currentDateTime: new Date().toISOString(), timezone: "Asia/Shanghai", locale: "zh-CN" } };
      const response = await mockAnalyze(body);
      setView({type: "success", response});
      const entry = { id: "h-" + Date.now() + "-" + Math.random().toString(36).slice(2,6), timestamp: new Date().toISOString(), mode, inputText: text, response };
      const updated = addHistory(entry);
      setHistory(updated);
    } catch (err) {
      setView({type: "error", message: err.message || "分析过程中出现错误"});
    }
  }, [mode, rel, tone, scenario, disclosure]);

  const handleFill = useCallback((text) => {
    setInputText(text);
    if (/必须|说过|能不能/.test(text)) setMode("propriety");
    else if (/迟到|晚到|取消|请假|改约|临时/.test(text)) setMode("change");
    else setMode("auto");
  }, []);

  const handleRegen = useCallback(() => { if (inputText) handleAnalyze(inputText); }, [inputText, handleAnalyze]);

  const handleReload = useCallback((entry) => {
    setHistoryOpen(false);
    setInputText(entry.inputText);
    setMode(entry.mode);
    setView({type: "success", response: entry.response});
  }, []);

  const handleDelete = useCallback((id) => { setHistory(removeHistory(id)); }, []);
  const handleClear = useCallback(() => { setHistory(clearHistory_()); }, []);

  return (
    <div className="min-h-screen flex flex-col">
      <AppHeader onOpen={() => setHistoryOpen(true)} />
      <main className="flex-1 w-full max-w-3xl mx-auto px-4 sm:px-6 py-6 space-y-6">
        <ModeSwitcher mode={mode} onChange={setMode} />
        {mode === "propriety" && <ProprietyOptions relationship={rel} tone={tone} onRel={setRel} onTone={setTone} />}
        {mode === "change" && <ChangeOptions relationship={rel} scenario={scenario} tone={tone} disclosure={disclosure} onRel={setRel} onScenario={setScenario} onTone={setTone} onDisc={setDisclosure} />}
        <InputComposer mode={mode} onAnalyze={handleAnalyze} loading={loading} />
        {view.type === "idle" && <ExamplePrompts onFill={handleFill} disabled={loading} />}
        {view.type === "loading" && <LoadingResult />}
        {view.type === "error" && <ErrorResult message={view.message} onRetry={handleRegen} />}
        {view.type === "success" && (
          <div className="space-y-4">
            {mode === "auto" && <IntentBadge response={view.response} />}
            {view.response.schedule && <ScheduleCard event={view.response.schedule} />}
            {view.response.propriety && <ProprietyPanel analysis={view.response.propriety} />}
            {view.response.communication && <ChangeForm communication={view.response.communication} onRegen={handleRegen} />}
          </div>
        )}
      </main>
      <footer className="w-full text-center py-4 text-xs text-gray-400 border-t border-gray-100">应约 AI &mdash; TRAE AI 创造力大赛参赛作品</footer>
      <HistoryDrawer open={historyOpen} entries={history} onClose={() => setHistoryOpen(false)} onReload={handleReload} onDelete={handleDelete} onClear={handleClear} />
    </div>
  );
}

// ============================
// 渲染
// ============================
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
