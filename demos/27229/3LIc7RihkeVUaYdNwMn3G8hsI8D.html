<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能学习提醒助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
                                                                                                                    t-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        header p {
            opacity: 0.9;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        
        .card h2 {
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .card h2::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        .input-group input,
        .input-group textarea,
        .input-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        
        .input-group input:focus,
        .input-group textarea:focus,
        .input-group select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .input-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-right: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button.secondary {
            background: #e0e0e0;
            color: #555;
        }
        
        button.secondary:hover {
            background: #d0d0d0;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .reminder-list {
            margin-top: 20px;
        }
        
        .reminder-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            position: relative;
            transition: all 0.3s ease;
        }
        
        .reminder-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .reminder-item.completed {
            opacity: 0.6;
            border-left-color: #28a745;
        }
        
        .reminder-item.completed h3 {
            text-decoration: line-through;
            color: #888;
        }
        
        .reminder-item h3 {
            color: #333;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }
        
        .reminder-item p {
            color: #666;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        
        .reminder-item .meta {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
            color: #888;
        }
        
        .reminder-item .actions {
            position: absolute;
            right: 20px;
            top: 20px;
            display: flex;
            gap: 10px;
        }
        
        .reminder-item .actions button {
            padding: 8px 16px;
            font-size: 0.85rem;
        }
        
        .tag {
            display: inline-block;
            padding: 4px 12px;
            background: #e8f4fd;
            color: #17a2b8;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-right: 8px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .stat-card .number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-card .label {
            color: #888;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        
        @media (max-width: 600px) {
            .stats {
                grid-template-columns: 1fr;
            }
            
            .reminder-item .actions {
                position: static;
                margin-top: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 智能学习提醒助手</h1>
            <p>高效管理您的学习任务与时间</p>
        </header>
        
        <div class="stats">
            <div class="stat-card">
                <div class="number" id="totalCount">0</div>
                <div class="label">总提醒</div>
            </div>
            <div class="stat-card">
                <div class="number" id="pendingCount">0</div>
                <div class="label">待完成</div>
            </div>
            <div class="stat-card">
                <div class="number" id="completedCount">0</div>
                <div class="label">已完成</div>
            </div>
        </div>
        
        <div class="card">
            <h2>添加新提醒</h2>
            <div class="input-group">
                <label for="title">提醒标题</label>
                <input type="text" id="title" placeholder="例如：完成数学作业">
            </div>
            <div class="input-group">
                <label for="description">详细描述</label>
                <textarea id="description" placeholder="添加更多细节..."></textarea>
            </div>
            <div class="input-group">
                <label for="category">分类标签</label>
                <select id="category">
                    <option value="学习">学习</option>
                    <option value="工作">工作</option>
                    <option value="生活">生活</option>
                    <option value="健康">健康</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="input-group">
                <label for="dueDate">截止日期</label>
                <input type="datetime-local" id="dueDate">
            </div>
            <button onclick="addReminder()">添加提醒</button>
            <button class="secondary" onclick="clearForm()">清空</button>
        </div>
        
        <div class="card">
            <h2>提醒列表</h2>
            <div class="reminder-list" id="reminderList">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
                    </svg>
                    <p>暂无提醒，添加一个开始吧！</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let reminders = [];
        
        function loadReminders() {
            const saved = localStorage.getItem('reminders');
            if (saved) {
                reminders = JSON.parse(saved);
            }
            renderReminders();
            updateStats();
        }
        
        function saveReminders() {
            localStorage.setItem('reminders', JSON.stringify(reminders));
        }
        
        function addReminder() {
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const category = document.getElementById('category').value;
            const dueDate = document.getElementById('dueDate').value;
            
            if (!title.trim()) {
                alert('请输入提醒标题');
                return;
            }
            
            const reminder = {
                id: Date.now(),
                title,
                description,
                category,
                dueDate,
                completed: false,
                createdAt: new Date().toISOString()
            };
            
            reminders.unshift(reminder);
            saveReminders();
            renderReminders();
            updateStats();
            clearForm();
        }
        
        function clearForm() {
            document.getElementById('title').value = '';
            document.getElementById('description').value = '';
            document.getElementById('category').value = '学习';
            document.getElementById('dueDate').value = '';
        }
        
        function toggleComplete(id) {
            const reminder = reminders.find(r => r.id === id);
            if (reminder) {
                reminder.completed = !reminder.completed;
                saveReminders();
                renderReminders();
                updateStats();
            }
        }
        
        function deleteReminder(id) {
            if (confirm('确定要删除这个提醒吗？')) {
                reminders = reminders.filter(r => r.id !== id);
                saveReminders();
                renderReminders();
                updateStats();
            }
        }
        
        function formatDate(dateStr) {
            if (!dateStr) return '无截止日期';
            const date = new Date(dateStr);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        
        function renderReminders() {
            const list = document.getElementById('reminderList');
            
            if (reminders.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
                        </svg>
                        <p>暂无提醒，添加一个开始吧！</p>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = reminders.map(reminder => `
                <div class="reminder-item ${reminder.completed ? 'completed' : ''}">
                    <h3>${reminder.title}</h3>
                    ${reminder.description ? `<p>${reminder.description}</p>` : ''}
                    <div class="meta">
                        <span class="tag">${reminder.category}</span>
                        <span>📅 ${formatDate(reminder.dueDate)}</span>
                    </div>
                    <div class="actions">
                        <button onclick="toggleComplete(${reminder.id})">
                            ${reminder.completed ? '撤销' : '完成'}
                        </button>
                        <button class="secondary" onclick="deleteReminder(${reminder.id})">删除</button>
                    </div>
                </div>
            `).join('');
        }
        
        function updateStats() {
            const total = reminders.length;
            const completed = reminders.filter(r => r.completed).length;
            const pending = total - completed;
            
            document.getElementById('totalCount').textContent = total;
            document.getElementById('pendingCount').textContent = pending;
            document.getElementById('completedCount').textContent = completed;
        }
        
        document.addEventListener('DOMContentLoaded', loadReminders);
    </script>
</body>
</html>
