<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>零食雷达 - 宿舍楼内匿名共享零食地图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0f0f23;
            min-height: 100vh;
            color: #e8e8e8;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, #0f0f23 0%, #1a1a3e 50%, #16213e 100%);
        }

        /* 顶部 */
        .header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10;
        }
        .header .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4em;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }
        .header .logo-text h1 {
            font-size: 1.2em;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .logo-text p {
            font-size: 0.7em;
            color: #888;
        }
        .header .user-badge {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            cursor: pointer;
        }

        /* 雷达扫描区 */
        .radar-section {
            position: relative;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .radar-bg {
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .radar-bg::before {
            content: '';
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.06);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .radar-bg::after {
            content: '';
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.04);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .radar-sweep {
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(102, 126, 234, 0.15) 60deg, transparent 120deg);
            animation: radarSweep 3s linear infinite;
        }
        @keyframes radarSweep {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .radar-center {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.4);
            z-index: 5;
        }
        .radar-dot {
            position: absolute;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 3;
            animation: radarPulse 2s ease-in-out infinite;
        }
        .radar-dot:hover { transform: scale(1.3); z-index: 10; }
        @keyframes radarPulse {
            0%, 100% { box-shadow: 0 0 5px currentColor; }
            50% { box-shadow: 0 0 15px currentColor, 0 0 30px currentColor; }
        }
        .radar-dot .dot-label {
            position: absolute;
            bottom: -18px;
            white-space: nowrap;
            font-size: 0.65em;
            color: rgba(255,255,255,0.7);
            background: rgba(0,0,0,0.6);
            padding: 2px 6px;
            border-radius: 4px;
        }
        .radar-scan-btn {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 24px;
            border-radius: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s;
        }
        .radar-scan-btn:active { transform: translateX(-50%) scale(0.95); }

        /* 分类筛选 */
        .category-bar {
            display: flex;
            gap: 8px;
            padding: 0 20px;
            margin-bottom: 12px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .category-bar::-webkit-scrollbar { display: none; }
        .category-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #aaa;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .category-btn.active {
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
        }

        /* 零食列表 */
        .snack-list {
            flex: 1;
            padding: 0 20px;
            overflow-y: auto;
            padding-bottom: 80px;
        }
        .snack-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.3s;
            cursor: pointer;
        }
        .snack-card:hover {
            background: rgba(255,255,255,0.08);
            transform: translateX(4px);
        }
        .snack-card:active { transform: scale(0.98); }
        .snack-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .snack-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8em;
            flex-shrink: 0;
        }
        .snack-info { flex: 1; }
        .snack-info h3 {
            font-size: 1em;
            font-weight: 600;
            color: #e8e8e8;
            margin-bottom: 2px;
        }
        .snack-info .snack-meta {
            font-size: 0.75em;
            color: #888;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .snack-info .snack-meta span {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .distance-badge {
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 0.7em;
            font-weight: 600;
            white-space: nowrap;
        }
        .distance-badge.near {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
        }
        .distance-badge.mid {
            background: rgba(250, 204, 21, 0.15);
            color: #facc15;
        }
        .distance-badge.far {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
        }
        .snack-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .snack-tag {
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 0.7em;
            background: rgba(255,255,255,0.06);
            color: #999;
        }
        .snack-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .snack-want {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8em;
            color: #aaa;
        }
        .snack-action {
            padding: 8px 18px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 0.8em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .snack-action:active { transform: scale(0.95); }

        /* 底部导航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: rgba(15, 15, 35, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 20px;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 6px 16px;
            border-radius: 12px;
            transition: all 0.3s;
        }
        .nav-item.active .nav-icon { color: #ff6b6b; }
        .nav-item.active .nav-label { color: #ff6b6b; }
        .nav-item:hover { background: rgba(255,255,255,0.05); }
        .nav-icon { font-size: 1.4em; color: #666; transition: color 0.3s; }
        .nav-label { font-size: 0.65em; color: #666; transition: color 0.3s; }

        /* 发布弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            align-items: flex-end;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            width: 100%;
            max-width: 480px;
            background: #1a1a3e;
            border-radius: 24px 24px 0 0;
            padding: 24px 20px 30px;
            animation: modalUp 0.3s ease-out;
        }
        @keyframes modalUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h2 {
            font-size: 1.2em;
            color: #e8e8e8;
        }
        .modal-close {
            font-size: 1.5em;
            color: #888;
            cursor: pointer;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 0.85em;
            color: #aaa;
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #e8e8e8;
            font-size: 0.95em;
            outline: none;
            transition: all 0.3s;
        }
        .form-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .form-input::placeholder { color: #666; }
        .emoji-picker {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .emoji-option {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.2s;
        }
        .emoji-option:hover { background: rgba(255,255,255,0.1); }
        .emoji-option.selected {
            border-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            color: white;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }
        .submit-btn:active { transform: scale(0.98); }

        /* Toast */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(20, 20, 40, 0.95);
            color: white;
            padding: 16px 28px;
            border-radius: 14px;
            font-size: 0.95em;
            z-index: 300;
            transition: all 0.3s;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        .toast.show { transform: translate(-50%, -50%) scale(1); }

        /* 交换弹窗 */
        .exchange-modal .exchange-code {
            text-align: center;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            margin: 16px 0;
        }
        .exchange-code .code-display {
            font-size: 2em;
            font-weight: 700;
            letter-spacing: 8px;
            color: #feca57;
            margin: 10px 0;
        }
        .exchange-code p {
            font-size: 0.8em;
            color: #888;
            line-height: 1.6;
        }

        /* 响应式 */
        @media (max-width: 380px) {
            .radar-section { height: 240px; }
            .radar-bg, .radar-sweep { width: 220px; height: 220px; }
            .snack-icon { width: 40px; height: 40px; font-size: 1.4em; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 顶部 -->
        <div class="header">
            <div class="logo">
                <div class="logo-icon">🍿</div>
                <div class="logo-text">
                    <h1>零食雷达</h1>
                    <p>宿舍楼内匿名共享</p>
                </div>
            </div>
            <div class="user-badge" onclick="showToast('个人中心功能开发中')">👤</div>
        </div>

        <!-- 雷达扫描区 -->
        <div class="radar-section">
            <div class="radar-bg"></div>
            <div class="radar-sweep"></div>
            <div class="radar-center">📡</div>
            <!-- 雷达上的零食点 -->
            <div class="radar-dot" style="top: 25%; left: 30%; background: rgba(255,107,107,0.3); color: #ff6b6b;" onclick="showSnackDetail('薯片')">
                🥔
                <span class="dot-label">3楼 薯片</span>
            </div>
            <div class="radar-dot" style="top: 35%; right: 25%; background: rgba(254,202,87,0.3); color: #feca57; animation-delay: 0.5s;" onclick="showSnackDetail('泡面')">
                🍜
                <span class="dot-label">2楼 泡面</span>
            </div>
            <div class="radar-dot" style="bottom: 30%; left: 20%; background: rgba(129,230,217,0.3); color: #81e6d9; animation-delay: 1s;" onclick="showSnackDetail('饼干')">
                🍪
                <span class="dot-label">4楼 饼干</span>
            </div>
            <div class="radar-dot" style="bottom: 25%; right: 30%; background: rgba(196,181,253,0.3); color: #c4b5fd; animation-delay: 1.5s;" onclick="showSnackDetail('巧克力')">
                🍫
                <span class="dot-label">3楼 巧克力</span>
            </div>
            <button class="radar-scan-btn" onclick="scanRadar()">🔍 扫描附近零食</button>
        </div>

        <!-- 分类筛选 -->
        <div class="category-bar">
            <div class="category-btn active" onclick="filterCategory(this, 'all')">🔥 全部</div>
            <div class="category-btn" onclick="filterCategory(this, 'savory')">🧂 咸口</div>
            <div class="category-btn" onclick="filterCategory(this, 'sweet')">🍬 甜口</div>
            <div class="category-btn" onclick="filterCategory(this, 'instant')">🍜 速食</div>
            <div class="category-btn" onclick="filterCategory(this, 'drink')">🥤 饮品</div>
        </div>

        <!-- 零食列表 -->
        <div class="snack-list" id="snackList">
            <!-- 动态生成 -->
        </div>
    </div>

    <!-- 底部导航 -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab(this, 'map')">
            <div class="nav-icon">🗺️</div>
            <div class="nav-label">地图</div>
        </div>
        <div class="nav-item" onclick="openPublishModal()">
            <div class="nav-icon">➕</div>
            <div class="nav-label">发布</div>
        </div>
        <div class="nav-item" onclick="showToast('消息功能开发中')">
            <div class="nav-icon">💬</div>
            <div class="nav-label">消息</div>
        </div>
        <div class="nav-item" onclick="showToast('我的库存功能开发中')">
            <div class="nav-icon">📦</div>
            <div class="nav-label">库存</div>
        </div>
    </div>

    <!-- 发布弹窗 -->
    <div class="modal-overlay" id="publishModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📦 发布我的零食</h2>
                <span class="modal-close" onclick="closeModal('publishModal')">&times;</span>
            </div>
            <div class="form-group">
                <label>选择零食类型</label>
                <div class="emoji-picker">
                    <div class="emoji-option selected" onclick="selectEmoji(this)">🥔</div>
                    <div class="emoji-option" onclick="selectEmoji(this)">🍜</div>
                    <div class="emoji-option" onclick="selectEmoji(this)">🍪</div>
                    <div class="emoji-option" onclick="selectEmoji(this)">🍫</div>
                    <div class="emoji-option" onclick="selectEmoji(this)">🥤</div>
                    <div class="emoji-option" onclick="selectEmoji(this)">🍬</div>
                    <div class="emoji-option" onclick="selectEmoji(this)">🥜</div>
                    <div class="emoji-option" onclick="selectEmoji(this)">🍞</div>
                </div>
            </div>
            <div class="form-group">
                <label>零食名称</label>
                <input type="text" class="form-input" placeholder="例如：乐事原味薯片" id="snackName">
            </div>
            <div class="form-group">
                <label>宿舍号（匿名显示）</label>
                <input type="text" class="form-input" placeholder="例如：3-205" id="dormNumber">
            </div>
            <div class="form-group">
                <label>想换什么（可选）</label>
                <input type="text" class="form-input" placeholder="例如：想换可乐或辣条" id="wantExchange">
            </div>
            <button class="submit-btn" onclick="publishSnack()">✨ 发布到雷达</button>
        </div>
    </div>

    <!-- 交换弹窗 -->
    <div class="modal-overlay exchange-modal" id="exchangeModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🤝 发起交换</h2>
                <span class="modal-close" onclick="closeModal('exchangeModal')">&times;</span>
            </div>
            <div class="exchange-code">
                <p>你的交换暗号</p>
                <div class="code-display" id="exchangeCode">薯片换可乐</div>
                <p>敲门时说这个暗号<br>对方就知道是你啦</p>
            </div>
            <button class="submit-btn" onclick="confirmExchange()">✅ 确认交换</button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>

            {
                id: 6,
                icon: '🥜',
                name: '三只松鼠每日坚果',
                category: 'savory',
                dorm: '3-308',
                distance: '同层',
                distanceType: 'near',
                quantity: '6小包',
                want: '想换水果或酸奶',
                tags: ['咸口', '健康'],
                time: '15分钟前',
                color: 'linear-gradient(135deg, #fdcb6e, #e17055)'
            },
            {
                id: 7,
                icon: '🍬',
                name: '旺仔牛奶糖',
                category: 'sweet',
                dorm: '2-105',
                distance: '下楼',
                distanceType: 'mid',
                quantity: '1袋',
                want: '随便换什么都行',
                tags: ['甜口', '糖果'],
                time: '2小时前',
                color: 'linear-gradient(135deg, #ff7675, #d63031)'
            },
            {
                id: 8,
                icon: '🍞',
                name: '桃李切片面包',
                category: 'sweet',
                dorm: '4-215',
                distance: '上楼',
                distanceType: 'mid',
                quantity: '半袋',
                want: '想换果酱或花生酱',
                tags: ['甜口', '面包'],
                time: '45分钟前',
                color: 'linear-gradient(135deg, #ffeaa7, #fdcb6e)'
            }
        ];

        let currentFilter = 'all';

        // ===== 渲染零食列表 =====
        function renderSnacks(filter = 'all') {
            const list = document.getElementById('snackList');
            const filtered = filter === 'all' ? snacks : snacks.filter(s => s.category === filter);
            
            list.innerHTML = filtered.map(snack => `
                <div class="snack-card" onclick="showSnackDetail('${snack.name}')">
                    <div class="snack-header">
                        <div class="snack-icon" style="background: ${snack.color}20;">${snack.icon}</div>
                        <div class="snack-info">
                            <h3>${snack.name}</h3>
                            <div class="snack-meta">
                                <span>🏠 ${snack.dorm}</span>
                                <span>📦 ${snack.quantity}</span>
                                <span>⏰ ${snack.time}</span>
                            </div>
                        </div>
                        <div class="distance-badge ${snack.distanceType}">${snack.distance}</div>
                    </div>
                    <div class="snack-tags">
                        ${snack.tags.map(t => `<span class="snack-tag">${t}</span>`).join('')}
                    </div>
                    <div class="snack-footer">
                        <div class="snack-want">
                            <span>💭</span> ${snack.want}
                        </div>
                        <button class="snack-action" onclick="event.stopPropagation(); openExchange('${snack.name}')">🤝 交换</button>
                    </div>
                </div>
            `).join('');
        }

        // ===== 分类筛选 =====
        function filterCategory(btn, category) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = category;
            renderSnacks(category);
        }

        // ===== 雷达扫描 =====
        function scanRadar() {
            showToast('🔍 雷达扫描中...');
            const dots = document.querySelectorAll('.radar-dot');
            dots.forEach((dot, i) => {
                dot.style.opacity = '0';
                setTimeout(() => {
                    dot.style.opacity = '1';
                }, i * 200 + 500);
            });
            setTimeout(() => {
                showToast(`✅ 扫描完成！发现 ${snacks.length} 个零食点`);
            }, 1500);
        }

        // ===== 显示零食详情 =====
        function showSnackDetail(name) {
            showToast(`📍 ${name}\n点击"交换"按钮发起交换`);
        }

        // ===== 打开交换弹窗 =====
        function openExchange(snackName) {
            document.getElementById('exchangeCode').textContent = `我有${snackName}，想跟你换`;
            document.getElementById('exchangeModal').classList.add('active');
        }

        // ===== 确认交换 =====
        function confirmExchange() {
            closeModal('exchangeModal');
            showToast('✅ 交换请求已发送！\n对方同意后会收到通知');
        }

        // ===== 发布弹窗 =====
        function openPublishModal() {
            document.getElementById('publishModal').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function selectEmoji(el) {
            document.querySelectorAll('.emoji-option').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
        }

        function publishSnack() {
            const name = document.getElementById('snackName').value;
            const dorm = document.getElementById('dormNumber').value;
            const want = document.getElementById('wantExchange').value;
            
            if (!name || !dorm) {
                showToast('⚠️ 请填写零食名称和宿舍号');
                return;
            }
            
            closeModal('publishModal');
            showToast(`✨ 发布成功！\n${name} 已显示在雷达上`);
            
            // 清空表单
            document.getElementById('snackName').value = '';
            document.getElementById('dormNumber').value = '';
            document.getElementById('wantExchange').value = '';
        }

        // ===== 切换标签 =====
        function switchTab(el, tab) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
        }

        // ===== Toast =====
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerHTML = message.replace(/\n/g, '<br>');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ===== 点击遮罩关闭弹窗 =====
        document.querySelectorAll('.modal-overlay').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            });
        });

        // ===== 初始化 =====
        function init() {
            renderSnacks();
            setTimeout(() => {
                showToast('👋 欢迎来到零食雷达！\n点击"扫描"发现附近零食');
            }, 500);
        }

        init();
    </script>
</body>
</html>
