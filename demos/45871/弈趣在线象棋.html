<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>弈趣在线象棋</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .header { text-align: center; margin-bottom: 20px; color: #fff; }
        .header h1 {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(90deg, #f39c12, #e74c3c, #9b59b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        .header p { font-size: 1rem; color: #bdc3c7; }
        .game-container { display: flex; gap: 30px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
        .board-container {
            background: linear-gradient(145deg, #deb887, #d2a66e);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        canvas {
            display: block;
            cursor: pointer;
        }
        .sidebar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            width: 280px;
            color: #fff;
        }
        .section { margin-bottom: 20px; }
        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 2px solid #3b82f6;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
        .btn-secondary { background: linear-gradient(135deg, #f39c12, #e67e22); color: #fff; }
        .btn-secondary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4); }
        .btn-danger { background: linear-gradient(135deg, #e74c3c, #c0392b); color: #fff; }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4); }
        .btn-sm { padding: 8px; font-size: 0.9rem; margin-bottom: 5px; }
        .status-bar { background: rgba(0, 0, 0, 0.3); padding: 15px; border-radius: 8px; text-align: center; }
        .current-player { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; }
        .player-red { color: #e74c3c; }
        .player-black { color: #2c3e50; text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }
        .game-info { font-size: 0.9rem; color: #bdc3c7; margin-top: 10px; }
        .captured-pieces { display: flex; flex-wrap: wrap; gap: 5px; min-height: 50px; padding: 10px; background: rgba(0, 0, 0, 0.2); border-radius: 8px; }
        .captured-piece { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; }
        .captured-piece.red { background: #e74c3c; color: #fff; }
        .captured-piece.black { background: #2c3e50; color: #fff; }
        .rules-panel { max-height: 220px; overflow-y: auto; padding: 10px; background: rgba(0, 0, 0, 0.2); border-radius: 8px; font-size: 0.85rem; line-height: 1.6; color: #bdc3c7; }
        .rules-panel h4 { color: #f39c12; margin-bottom: 8px; font-size: 0.95rem; }
        .rules-panel ul { padding-left: 20px; margin: 5px 0; }
        .rules-panel li { margin-bottom: 5px; }
        .level-select { display: flex; gap: 10px; margin-top: 10px; }
        .level-btn {
            flex: 1; padding: 8px; border: 2px solid transparent; border-radius: 6px;
            background: rgba(255, 255, 255, 0.1); color: #fff; cursor: pointer;
            transition: all 0.3s; font-size: 0.85rem;
        }
        .level-btn.active { border-color: #3b82f6; background: rgba(59, 130, 246, 0.3); }
        .level-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .message-box {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9); padding: 30px; border-radius: 12px;
            text-align: center; z-index: 1000; display: none;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        .message-box.show { display: block; }
        .message-box h2 { font-size: 1.5rem; margin-bottom: 15px; color: #f39c12; }
        .message-box p { font-size: 1rem; color: #bdc3c7; margin-bottom: 20px; }
        .message-box .btn { margin: 0 10px; width: auto; padding: 10px 25px; }
        .footer { margin-top: 30px; text-align: center; color: #7f8c8d; font-size: 0.85rem; }
        @media (max-width: 768px) {
            .game-container { flex-direction: column; align-items: center; }
            .sidebar { width: 100%; max-width: 400px; }
            .header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>弈趣在线象棋</h1>
        <p>轻量化、无广告、操作简洁的在线象棋体验</p>
    </div>

    <div class="game-container">
        <div class="board-container">
            <canvas id="board" width="460" height="520"></canvas>
        </div>

        <div class="sidebar">
            <div class="section">
                <div class="section-title">游戏控制</div>
                <button class="btn btn-primary" onclick="startGame('pvp')">双人对战</button>
                <button class="btn btn-secondary" onclick="startGame('pve')">人机对战</button>
                <button class="btn btn-danger" onclick="resetGame()">重新开始</button>
                <button class="btn btn-sm" onclick="undoMove()" id="undoBtn" disabled>悔棋</button>
            </div>

            <div class="section" id="aiLevelSection" style="display: none;">
                <div class="section-title">AI难度</div>
                <div class="level-select">
                    <button class="level-btn active" onclick="setAILevel('easy')">简单</button>
                    <button class="level-btn" onclick="setAILevel('medium')">中等</button>
                    <button class="level-btn" onclick="setAILevel('hard')">困难</button>
                </div>
            </div>

            <div class="section">
                <div class="section-title">游戏状态</div>
                <div class="status-bar">
                    <div class="current-player" id="currentPlayer">红方执棋</div>
                    <div class="game-info" id="gameInfo">请选择棋子</div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">被吃棋子</div>
                <div class="captured-pieces" id="capturedRed"></div>
                <div style="margin-top: 5px; font-size: 0.8rem; color: #bdc3c7;">红方被吃</div>
                <div class="captured-pieces" id="capturedBlack" style="margin-top: 10px;"></div>
                <div style="margin-top: 5px; font-size: 0.8rem; color: #bdc3c7;">黑方被吃</div>
            </div>

            <div class="section">
                <div class="section-title">棋规提示</div>
                <div class="rules-panel">
                    <h4>基本规则</h4>
                    <ul>
                        <li><strong>帅/将：</strong>九宫格内移动，不能与对方将帅对面</li>
                        <li><strong>士：</strong>九宫格内沿斜线走一步</li>
                        <li><strong>象：</strong>走田字，不能过河</li>
                        <li><strong>马：</strong>走日字，别马腿</li>
                        <li><strong>车：</strong>直线行走，不限步数</li>
                        <li><strong>炮：</strong>直线行走，吃子需隔一子</li>
                        <li><strong>兵/卒：</strong>未过河只能前进，过河可左右移动</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <div class="message-box" id="messageBox">
        <h2 id="messageTitle">游戏结束</h2>
        <p id="messageContent">红方获胜！</p>
        <button class="btn btn-primary" onclick="closeMessage(); resetGame();">再来一局</button>
        <button class="btn btn-secondary" onclick="closeMessage();">关闭</button>
    </div>

    <div class="footer">
        <p>弈趣在线象棋 - 传承国粹，乐在棋中</p>
    </div>

    <script>
        const PIECE_TYPES = { KING:'帅', GUARD:'士', ELEPHANT:'象', HORSE:'马', CHARIOT:'车', CANNON:'炮', SOLDIER:'兵' };
        const BLACK_PIECE_TYPES = { KING:'将', GUARD:'士', ELEPHANT:'象', HORSE:'马', CHARIOT:'车', CANNON:'炮', SOLDIER:'卒' };
        const PIECE_VALUES = { king:1000, chariot:90, cannon:45, horse:40, elephant:20, guard:20, soldier:10 };

        const canvas = document.getElementById('board');
        const ctx = canvas.getContext('2d');
        
        let board = [];
        let currentPlayer = 'red';
        let selectedPiece = null;
        let gameMode = 'pvp';
        let aiLevel = 'easy';
        let capturedRed = [];
        let capturedBlack = [];
        let isGameOver = false;
        let moveHistory = [];
        let animatingPiece = null;

        const CELL_SIZE = 50;
        const PADDING = 30;
        const BOARD_WIDTH = 9;
        const BOARD_HEIGHT = 10;

        const initialBoard = [
            ['chariot','horse','elephant','guard','king','guard','elephant','horse','chariot'],
            ['','','','','','','','',''],
            ['','cannon','','','','','','cannon',''],
            ['soldier','','soldier','','soldier','','soldier','','soldier'],
            ['','','','','','','','',''],
            ['','','','','','','','',''],
            ['soldier','','soldier','','soldier','','soldier','','soldier'],
            ['','cannon','','','','','','cannon',''],
            ['','','','','','','','',''],
            ['chariot','horse','elephant','guard','king','guard','elephant','horse','chariot']
        ];

        function initBoard() {
            board = [];
            for(let r=0; r<10; r++) {
                board[r] = [];
                for(let c=0; c<9; c++) {
                    const type = initialBoard[r][c];
                    board[r][c] = type ? { type, color: r<5 ? 'red' : 'black' } : null;
                }
            }
            drawBoard();
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#deb887';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#5d4037';
            ctx.lineWidth = 2;
            
            for(let r=0; r<BOARD_HEIGHT; r++) {
                const y = PADDING + r * CELL_SIZE;
                ctx.beginPath();
                ctx.moveTo(PADDING, y);
                ctx.lineTo(PADDING + (BOARD_WIDTH-1) * CELL_SIZE, y);
                ctx.stroke();
            }
            
            for(let c=0; c<BOARD_WIDTH; c++) {
                const x = PADDING + c * CELL_SIZE;
                ctx.beginPath();
                ctx.moveTo(x, PADDING);
                ctx.lineTo(x, PADDING + (BOARD_HEIGHT-1) * CELL_SIZE);
                ctx.stroke();
            }
            
            drawPalaceDiagonals();
            drawRiver();
            drawPieces();
            
            if(selectedPiece) {
                drawValidMoves();
                highlightSelected();
            }
        }

        function drawPalaceDiagonals() {
            ctx.strokeStyle = '#5d4037';
            ctx.lineWidth = 2;
            
            // Red palace (top)
            ctx.beginPath();
            ctx.moveTo(PADDING + 3*CELL_SIZE, PADDING);
            ctx.lineTo(PADDING + 5*CELL_SIZE, PADDING + 2*CELL_SIZE);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(PADDING + 5*CELL_SIZE, PADDING);
            ctx.lineTo(PADDING + 3*CELL_SIZE, PADDING + 2*CELL_SIZE);
            ctx.stroke();
            
            // Black palace (bottom)
            ctx.beginPath();
            ctx.moveTo(PADDING + 3*CELL_SIZE, PADDING + 7*CELL_SIZE);
            ctx.lineTo(PADDING + 5*CELL_SIZE, PADDING + 9*CELL_SIZE);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(PADDING + 5*CELL_SIZE, PADDING + 7*CELL_SIZE);
            ctx.lineTo(PADDING + 3*CELL_SIZE, PADDING + 9*CELL_SIZE);
            ctx.stroke();
        }

        function drawRiver() {
            const y = PADDING + 4*CELL_SIZE + CELL_SIZE/2;
            
            ctx.beginPath();
            ctx.moveTo(PADDING, y);
            ctx.lineTo(PADDING + (BOARD_WIDTH-1)*CELL_SIZE, y);
            ctx.strokeStyle = '#5d4037';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.font = 'bold 24px "Microsoft YaHei"';
            ctx.fillStyle = 'rgba(93, 64, 55, 0.6)';
            ctx.textAlign = 'center';
            ctx.fillText('楚河', PADDING + 1.5*CELL_SIZE, y);
            ctx.fillText('汉界', PADDING + 7.5*CELL_SIZE, y);
        }

        function drawPieces() {
            for(let r=0; r<10; r++) {
                for(let c=0; c<9; c++) {
                    const piece = board[r][c];
                    if(piece) {
                        drawPiece(r, c, piece);
                    }
                }
            }
        }

        function drawPiece(row, col, piece) {
            const x = PADDING + col * CELL_SIZE;
            const y = PADDING + row * CELL_SIZE;
            const radius = 22;
            
            const isRed = piece.color === 'red';
            const gradient = ctx.createRadialGradient(x-3, y-3, 0, x, y, radius);
            
            if(isRed) {
                gradient.addColorStop(0, '#ff6b6b');
                gradient.addColorStop(1, '#c0392b');
            } else {
                gradient.addColorStop(0, '#4a5568');
                gradient.addColorStop(1, '#1a252f');
            }
            
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI*2);
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.strokeStyle = isRed ? '#8b0000' : '#000';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.font = 'bold 22px "Microsoft YaHei"';
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(isRed ? PIECE_TYPES[piece.type.toUpperCase()] : BLACK_PIECE_TYPES[piece.type.toUpperCase()], x, y);
        }

        function drawValidMoves() {
            const validMoves = getValidMoves(selectedPiece.row, selectedPiece.col);
            for(const move of validMoves) {
                const x = PADDING + move.col * CELL_SIZE;
                const y = PADDING + move.row * CELL_SIZE;
                
                ctx.beginPath();
                ctx.arc(x, y, 8, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(34, 197, 94, 0.6)';
                ctx.fill();
            }
        }

        function highlightSelected() {
            const x = PADDING + selectedPiece.col * CELL_SIZE;
            const y = PADDING + selectedPiece.row * CELL_SIZE;
            
            ctx.beginPath();
            ctx.arc(x, y, 26, 0, Math.PI*2);
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function getValidMoves(row, col) {
            const moves = [];
            const piece = board[row][col];
            if(!piece) return moves;
            
            for(let r=0; r<10; r++) {
                for(let c=0; c<9; c++) {
                    if(isValidMove(row, col, r, c)) {
                        moves.push({ row: r, col: c });
                    }
                }
            }
            return moves;
        }

        canvas.addEventListener('click', (e) => {
            if(isGameOver || animatingPiece) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const col = Math.round((x - PADDING) / CELL_SIZE);
            const row = Math.round((y - PADDING) / CELL_SIZE);
            
            if(row < 0 || row >= 10 || col < 0 || col >= 9) return;
            
            handleCellClick(row, col);
        });

        function handleCellClick(row, col) {
            const piece = board[row][col];
            
            if(selectedPiece) {
                const { row: sr, col: sc } = selectedPiece;
                if(row === sr && col === sc) {
                    selectedPiece = null;
                    drawBoard();
                    updateGameInfo('请选择棋子');
                    return;
                }
                
                if(piece && piece.color === currentPlayer) {
                    selectedPiece = { row, col };
                    drawBoard();
                    updateGameInfo(`已选择 ${currentPlayer === 'red' ? '红方' : '黑方'}${getPieceName(piece.type)}`);
                    return;
                }
                
                if(isValidMove(sr, sc, row, col)) {
                    makeMove(sr, sc, row, col);
                } else {
                    selectedPiece = null;
                    drawBoard();
                    if(piece && piece.color === currentPlayer) {
                        selectedPiece = { row, col };
                        drawBoard();
                        updateGameInfo(`已选择 ${currentPlayer === 'red' ? '红方' : '黑方'}${getPieceName(piece.type)}`);
                    }
                }
            } else if(piece && piece.color === currentPlayer) {
                selectedPiece = { row, col };
                drawBoard();
                updateGameInfo(`已选择 ${currentPlayer === 'red' ? '红方' : '黑方'}${getPieceName(piece.type)}`);
            }
        }

        function isValidMove(fromRow, fromCol, toRow, toCol) {
            if(fromRow === toRow && fromCol === toCol) return false;
            
            const piece = board[fromRow][fromCol];
            if(!piece) return false;
            
            const target = board[toRow][toCol];
            if(target && target.color === piece.color) return false;
            
            if(!validatePieceMove(piece, fromRow, fromCol, toRow, toCol)) return false;
            
            if(!wouldBeSafeAfterMove(fromRow, fromCol, toRow, toCol)) return false;
            
            return true;
        }

        function validatePieceMove(piece, fromRow, fromCol, toRow, toCol) {
            switch(piece.type) {
                case 'king': return isValidKingMove(piece, fromRow, fromCol, toRow, toCol);
                case 'guard': return isValidGuardMove(piece, fromRow, fromCol, toRow, toCol);
                case 'elephant': return isValidElephantMove(piece, fromRow, fromCol, toRow, toCol);
                case 'horse': return isValidHorseMove(fromRow, fromCol, toRow, toCol);
                case 'chariot': return isValidChariotMove(fromRow, fromCol, toRow, toCol);
                case 'cannon': return isValidCannonMove(fromRow, fromCol, toRow, toCol);
                case 'soldier': return isValidSoldierMove(piece, fromRow, fromCol, toRow, toCol);
                default: return false;
            }
        }

        function isValidKingMove(piece, fromRow, fromCol, toRow, toCol) {
            const isRed = piece.color === 'red';
            const minRow = isRed ? 0 : 7;
            const maxRow = isRed ? 2 : 9;
            
            if(toRow < minRow || toRow > maxRow || toCol < 3 || toCol > 5) return false;
            
            const rd = Math.abs(toRow - fromRow);
            const cd = Math.abs(toCol - fromCol);
            if(!((rd === 1 && cd === 0) || (rd === 0 && cd === 1))) return false;
            
            if(!wouldBeSafeAfterMove(fromRow, fromCol, toRow, toCol)) return false;
            
            if(canFlyingGeneral(toRow, toCol, piece.color)) return false;
            
            return true;
        }

        function isValidGuardMove(piece, fromRow, fromCol, toRow, toCol) {
            const isRed = piece.color === 'red';
            const minRow = isRed ? 0 : 7;
            const maxRow = isRed ? 2 : 9;
            
            if(toRow < minRow || toRow > maxRow || toCol < 3 || toCol > 5) return false;
            
            const rd = Math.abs(toRow - fromRow);
            const cd = Math.abs(toCol - fromCol);
            return rd === 1 && cd === 1;
        }

        function isValidElephantMove(fromRow, fromCol, toRow, toCol) {
            const piece = board[fromRow][fromCol];
            const isRed = piece.color === 'red';
            const riverRow = isRed ? 5 : 4;
            if(isRed && toRow >= riverRow) return false;
            if(!isRed && toRow < riverRow) return false;
            
            const rd = Math.abs(toRow - fromRow);
            const cd = Math.abs(toCol - fromCol);
            if(rd !== 2 || cd !== 2) return false;
            
            const mr = (fromRow + toRow) / 2;
            const mc = (fromCol + toCol) / 2;
            return board[mr][mc] === null;
        }

        function isValidHorseMove(fromRow, fromCol, toRow, toCol) {
            const rd = Math.abs(toRow - fromRow);
            const cd = Math.abs(toCol - fromCol);
            
            if(!((rd === 2 && cd === 1) || (rd === 1 && cd === 2))) return false;
            
            if(rd === 2) {
                const mr = fromRow + (toRow > fromRow ? 1 : -1);
                if(board[mr][fromCol] !== null) return false;
            } else {
                const mc = fromCol + (toCol > fromCol ? 1 : -1);
                if(board[fromRow][mc] !== null) return false;
            }
            
            return true;
        }

        function isValidChariotMove(fromRow, fromCol, toRow, toCol) {
            if(fromRow !== toRow && fromCol !== toCol) return false;
            
            if(fromRow === toRow) {
                const minC = Math.min(fromCol, toCol);
                const maxC = Math.max(fromCol, toCol);
                for(let c=minC+1; c<maxC; c++) {
                    if(board[fromRow][c] !== null) return false;
                }
            } else {
                const minR = Math.min(fromRow, toRow);
                const maxR = Math.max(fromRow, toRow);
                for(let r=minR+1; r<maxR; r++) {
                    if(board[r][fromCol] !== null) return false;
                }
            }
            
            return true;
        }

        function isValidCannonMove(fromRow, fromCol, toRow, toCol) {
            if(fromRow !== toRow && fromCol !== toCol) return false;
            
            let obs = 0;
            if(fromRow === toRow) {
                const minC = Math.min(fromCol, toCol);
                const maxC = Math.max(fromCol, toCol);
                for(let c=minC+1; c<maxC; c++) {
                    if(board[fromRow][c] !== null) obs++;
                }
            } else {
                const minR = Math.min(fromRow, toRow);
                const maxR = Math.max(fromRow, toRow);
                for(let r=minR+1; r<maxR; r++) {
                    if(board[r][fromCol] !== null) obs++;
                }
            }
            
            const target = board[toRow][toCol];
            return target ? obs === 1 : obs === 0;
        }

        function isValidSoldierMove(piece, fromRow, fromCol, toRow, toCol) {
            const isRed = piece.color === 'red';
            const dir = isRed ? 1 : -1;
            const crossed = isRed ? fromRow >= 5 : fromRow <= 4;
            
            const rd = toRow - fromRow;
            const cd = Math.abs(toCol - fromCol);
            
            if(crossed && cd === 1 && rd === 0) return true;
            
            return rd === dir && cd === 0;
        }

        function wouldBeSafeAfterMove(fromRow, fromCol, toRow, toCol) {
            const tempBoard = JSON.parse(JSON.stringify(board));
            tempBoard[toRow][toCol] = tempBoard[fromRow][fromCol];
            tempBoard[fromRow][fromCol] = null;
            
            const kingPos = findKing(tempBoard, currentPlayer);
            if(!kingPos) return false;
            
            return !isKingUnderAttack(tempBoard, kingPos.row, kingPos.col, currentPlayer);
        }

        function findKing(b, color) {
            for(let r=0; r<10; r++) {
                for(let c=0; c<9; c++) {
                    if(b[r][c] && b[r][c].type === 'king' && b[r][c].color === color) {
                        return { row: r, col: c };
                    }
                }
            }
            return null;
        }

        function isKingUnderAttack(b, kingRow, kingCol, kingColor) {
            const opponent = kingColor === 'red' ? 'black' : 'red';
            
            for(let r=0; r<10; r++) {
                for(let c=0; c<9; c++) {
                    const piece = b[r][c];
                    if(piece && piece.color === opponent) {
                        if(canAttackKing(b, r, c, kingRow, kingCol)) {
                            return true;
                        }
                    }
                }
            }
            
            if(canFlyingGeneral(kingRow, kingCol, kingColor)) {
                return true;
            }
            
            return false;
        }

        function canAttackKing(b, fromRow, fromCol, kingRow, kingCol) {
            const piece = b[fromRow][fromCol];
            
            switch(piece.type) {
                case 'chariot':
                    if(fromRow !== kingRow && fromCol !== kingCol) return false;
                    if(fromRow === kingRow) {
                        const minC = Math.min(fromCol, kingCol);
                        const maxC = Math.max(fromCol, kingCol);
                        for(let c=minC+1; c<maxC; c++) {
                            if(b[fromRow][c] !== null) return false;
                        }
                    } else {
                        const minR = Math.min(fromRow, kingRow);
                        const maxR = Math.max(fromRow, kingRow);
                        for(let r=minR+1; r<maxR; r++) {
                            if(b[r][fromCol] !== null) return false;
                        }
                    }
                    return true;
                
                case 'cannon':
                    if(fromRow !== kingRow && fromCol !== kingCol) return false;
                    let obs = 0;
                    if(fromRow === kingRow) {
                        const minC = Math.min(fromCol, kingCol);
                        const maxC = Math.max(fromCol, kingCol);
                        for(let c=minC+1; c<maxC; c++) {
                            if(b[fromRow][c] !== null) obs++;
                        }
                    } else {
                        const minR = Math.min(fromRow, kingRow);
                        const maxR = Math.max(fromRow, kingRow);
                        for(let r=minR+1; r<maxR; r++) {
                            if(b[r][fromCol] !== null) obs++;
                        }
                    }
                    return obs === 1;
                
                case 'horse':
                    const rd = Math.abs(fromRow - kingRow);
                    const cd = Math.abs(fromCol - kingCol);
                    if(!((rd === 2 && cd === 1) || (rd === 1 && cd === 2))) return false;
                    if(rd === 2) {
                        const mr = fromRow + (kingRow > fromRow ? 1 : -1);
                        if(b[mr][fromCol] !== null) return false;
                    } else {
                        const mc = fromCol + (kingCol > fromCol ? 1 : -1);
                        if(b[fromRow][mc] !== null) return false;
                    }
                    return true;
                
                case 'soldier':
                    const isRed = piece.color === 'red';
                    const dir = isRed ? 1 : -1;
                    if(Math.abs(fromRow - kingRow) + Math.abs(fromCol - kingCol) === 1) {
                        if(isRed) {
                            return kingRow >= fromRow;
                        } else {
                            return kingRow <= fromRow;
                        }
                    }
                    return false;
                
                case 'guard':
                    const grd = Math.abs(fromRow - kingRow);
                    const gcd = Math.abs(fromCol - kingCol);
                    return grd === 1 && gcd === 1;
                
                default: return false;
            }
        }

        function canFlyingGeneral(kingRow, kingCol, kingColor) {
            const opponent = kingColor === 'red' ? 'black' : 'red';
            const oppKing = findKing(board, opponent);
            
            if(!oppKing || oppKing.col !== kingCol) return false;
            
            const minR = Math.min(kingRow, oppKing.row);
            const maxR = Math.max(kingRow, oppKing.row);
            
            for(let r=minR+1; r<maxR; r++) {
                if(board[r][kingCol] !== null) return false;
            }
            
            return true;
        }

        function makeMove(fromRow, fromCol, toRow, toCol) {
            const piece = board[fromRow][fromCol];
            const target = board[toRow][toCol];
            
            moveHistory.push({
                fromRow, fromCol, toRow, toCol,
                piece: JSON.parse(JSON.stringify(piece)),
                captured: target ? JSON.parse(JSON.stringify(target)) : null
            });
            
            if(target) {
                if(target.color === 'red') capturedRed.push(target.type);
                else capturedBlack.push(target.type);
                updateCapturedPieces();
            }
            
            board[toRow][toCol] = piece;
            board[fromRow][fromCol] = null;
            
            selectedPiece = null;
            drawBoard();
            
            currentPlayer = currentPlayer === 'red' ? 'black' : 'red';
            updateCurrentPlayer();
            updateGameInfo('请选择棋子');
            document.getElementById('undoBtn').disabled = false;
            
            checkGameOver();
            
            if(!isGameOver && gameMode === 'pve' && currentPlayer === 'black') {
                setTimeout(aiMove, 600);
            }
        }

        function undoMove() {
            if(moveHistory.length === 0 || isGameOver || animatingPiece) return;
            
            const lastMove = moveHistory.pop();
            board[lastMove.fromRow][lastMove.fromCol] = lastMove.piece;
            board[lastMove.toRow][lastMove.toCol] = lastMove.captured;
            
            if(lastMove.captured) {
                if(lastMove.captured.color === 'red') {
                    capturedRed.pop();
                } else {
                    capturedBlack.pop();
                }
                updateCapturedPieces();
            }
            
            currentPlayer = currentPlayer === 'red' ? 'black' : 'red';
            selectedPiece = null;
            drawBoard();
            updateCurrentPlayer();
            updateGameInfo('请选择棋子');
            
            if(moveHistory.length === 0) {
                document.getElementById('undoBtn').disabled = true;
            }
        }

        function checkGameOver() {
            const kingPos = findKing(board, currentPlayer);
            
            if(!kingPos) {
                gameOver(currentPlayer === 'red' ? '黑方' : '红方');
                return;
            }
            
            if(isKingUnderAttack(board, kingPos.row, kingPos.col, currentPlayer)) {
                updateGameInfo(`${currentPlayer === 'red' ? '红方' : '黑方'}被将军！`);
                
                if(!hasValidMoves(currentPlayer)) {
                    gameOver(currentPlayer === 'red' ? '黑方' : '红方');
                }
            }
        }

        function hasValidMoves(color) {
            for(let r=0; r<10; r++) {
                for(let c=0; c<9; c++) {
                    const piece = board[r][c];
                    if(piece && piece.color === color) {
                        const moves = getValidMoves(r, c);
                        if(moves.length > 0) return true;
                    }
                }
            }
            return false;
        }

        function gameOver(winner) {
            isGameOver = true;
            showMessage('游戏结束', `${winner}获胜！`);
        }

        function aiMove() {
            if(isGameOver) return;
            
            let moves = [];
            for(let r=0; r<10; r++) {
                for(let c=0; c<9; c++) {
                    const piece = board[r][c];
                    if(piece && piece.color === 'black') {
                        for(let tr=0; tr<10; tr++) {
                            for(let tc=0; tc<9; tc++) {
                                if(isValidMove(r, c, tr, tc)) {
                                    moves.push({ fromRow: r, fromCol: c, toRow: tr, toCol: tc });
                                }
                            }
                        }
                    }
                }
            }
            
            if(moves.length === 0) {
                gameOver('红方');
                return;
            }
            
            let selectedMove;
            if(aiLevel === 'easy') {
                selectedMove = moves[Math.floor(Math.random() * moves.length)];
            } else {
                const depth = aiLevel === 'medium' ? 2 : 3;
                selectedMove = minimax(board, depth, -Infinity, Infinity, true).move;
            }
            
            if(!selectedMove) selectedMove = moves[0];
            
            animatingPiece = {
                fromRow: selectedMove.fromRow,
                fromCol: selectedMove.fromCol,
                toRow: selectedMove.toRow,
                toCol: selectedMove.toCol,
                progress: 0
            };
            
            animatePiece();
        }

        function minimax(b, depth, alpha, beta, isMaximizing) {
            if(depth === 0 || isTerminal(b)) {
                return { score: evaluateBoard(b) };
            }
            
            if(isMaximizing) {
                let maxScore = -Infinity;
                let bestMove = null;
                
                const moves = getAllMoves(b, 'black');
                for(const move of moves) {
                    const newBoard = applyMove(b, move);
                    const result = minimax(newBoard, depth-1, alpha, beta, false);
                    
                    if(result.score > maxScore) {
                        maxScore = result.score;
                        bestMove = move;
                    }
                    
                    alpha = Math.max(alpha, result.score);
                    if(beta <= alpha) break;
                }
                
                return { score: maxScore, move: bestMove };
            } else {
                let minScore = Infinity;
                
                const moves = getAllMoves(b, 'red');
                for(const move of moves) {
                    const newBoard = applyMove(b, move);
                    const result = minimax(newBoard, depth-1, alpha, beta, true);
                    
                    minScore = Math.min(minScore, result.score);
                    beta = Math.min(beta, result.score);
                    if(beta <= alpha) break;
                }
                
                return { score: minScore };
            }
        }

        function isTerminal(b) {
            return !findKing(b, 'red') || !findKing(b, 'black');
        }

        function evaluateBoard(b) {
            let score = 0;
            
            for(let r=0; r<10; r++) {
                for(let c=0; c<9; c++) {
                    const piece = b[r][c];
                    if(piece) {
                        const value = PIECE_VALUES[piece.type] || 0;
                        const multiplier = piece.color === 'black' ? 1 : -1;
                        
                        score += multiplier * value;
                        
                        if(piece.type === 'soldier') {
                            const isRed = piece.color === 'red';
                            const progress = isRed ? r / 9 : (9 - r) / 9;
                            score += multiplier * progress * 5;
                        }
                    }
                }
            }
            
            return score;
        }

        function getAllMoves(b, color) {
            const moves = [];
            for(let r=0; r<10; r++) {
                for(let c=0; c<9; c++) {
                    const piece = b[r][c];
                    if(piece && piece.color === color) {
                        for(let tr=0; tr<10; tr++) {
                            for(let tc=0; tc<9; tc++) {
                                if(isValidMoveInBoard(b, r, c, tr, tc)) {
                                    moves.push({ fromRow: r, fromCol: c, toRow: tr, toCol: tc });
                                }
                            }
                        }
                    }
                }
            }
            return moves;
        }

        function isValidMoveInBoard(b, fromRow, fromCol, toRow, toCol) {
            if(fromRow === toRow && fromCol === toCol) return false;
            
            const piece = b[fromRow][fromCol];
            if(!piece) return false;
            
            const target = b[toRow][toCol];
            if(target && target.color === piece.color) return false;
            
            return validatePieceMove(piece, fromRow, fromCol, toRow, toCol);
        }

        function applyMove(b, move) {
            const newBoard = JSON.parse(JSON.stringify(b));
            newBoard[move.toRow][move.toCol] = newBoard[move.fromRow][move.fromCol];
            newBoard[move.fromRow][move.fromCol] = null;
            return newBoard;
        }

        function animatePiece() {
            if(!animatingPiece) return;
            
            const p = animatingPiece;
            p.progress += 0.08;
            
            if(p.progress >= 1) {
                makeMove(p.fromRow, p.fromCol, p.toRow, p.toCol);
                animatingPiece = null;
                return;
            }
            
            drawBoard();
            
            const startX = PADDING + p.fromCol * CELL_SIZE;
            const startY = PADDING + p.fromRow * CELL_SIZE;
            const endX = PADDING + p.toCol * CELL_SIZE;
            const endY = PADDING + p.toRow * CELL_SIZE;
            
            const x = startX + (endX - startX) * easeOutQuad(p.progress);
            const y = startY + (endY - startY) * easeOutQuad(p.progress);
            
            const piece = board[p.fromRow][p.fromCol];
            const radius = 22;
            const isRed = piece.color === 'red';
            
            const gradient = ctx.createRadialGradient(x-3, y-3, 0, x, y, radius);
            if(isRed) {
                gradient.addColorStop(0, '#ff6b6b');
                gradient.addColorStop(1, '#c0392b');
            } else {
                gradient.addColorStop(0, '#4a5568');
                gradient.addColorStop(1, '#1a252f');
            }
            
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI*2);
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.strokeStyle = isRed ? '#8b0000' : '#000';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.font = 'bold 22px "Microsoft YaHei"';
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(isRed ? PIECE_TYPES[piece.type.toUpperCase()] : BLACK_PIECE_TYPES[piece.type.toUpperCase()], x, y);
            
            requestAnimationFrame(animatePiece);
        }

        function easeOutQuad(t) {
            return t * (2 - t);
        }

        function updateCapturedPieces() {
            const redContainer = document.getElementById('capturedRed');
            const blackContainer = document.getElementById('capturedBlack');
            
            redContainer.innerHTML = capturedRed.map(type => 
                `<div class="captured-piece black">${BLACK_PIECE_TYPES[type.toUpperCase()]}</div>`
            ).join('');
            
            blackContainer.innerHTML = capturedBlack.map(type => 
                `<div class="captured-piece red">${PIECE_TYPES[type.toUpperCase()]}</div>`
            ).join('');
        }

        function updateCurrentPlayer() {
            const el = document.getElementById('currentPlayer');
            el.textContent = `${currentPlayer === 'red' ? '红方' : '黑方'}执棋`;
            el.className = `current-player player-${currentPlayer}`;
        }

        function updateGameInfo(info) {
            document.getElementById('gameInfo').textContent = info;
        }

        function getPieceName(type) {
            return PIECE_TYPES[type.toUpperCase()];
        }

        function showMessage(title, content) {
            document.getElementById('messageTitle').textContent = title;
            document.getElementById('messageContent').textContent = content;
            document.getElementById('messageBox').classList.add('show');
        }

        function closeMessage() {
            document.getElementById('messageBox').classList.remove('show');
        }

        function startGame(mode) {
            gameMode = mode;
            document.getElementById('aiLevelSection').style.display = mode === 'pve' ? 'block' : 'none';
            resetGame();
        }

        function setAILevel(level) {
            aiLevel = level;
            document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function resetGame() {
            isGameOver = false;
            currentPlayer = 'red';
            selectedPiece = null;
            capturedRed = [];
            capturedBlack = [];
            moveHistory = [];
            animatingPiece = null;
            initBoard();
            updateCurrentPlayer();
            updateGameInfo('请选择棋子');
            updateCapturedPieces();
            closeMessage();
            document.getElementById('undoBtn').disabled = true;
        }

        initBoard();
    </script>
