<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel 双表比对工具</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 40px;
        }
        h1 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 8px;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 32px;
            font-size: 14px;
        }
        .upload-section {
            display: flex;
            gap: 20px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }
        .upload-box {
            flex: 1;
            min-width: 280px;
            border: 2px dashed #cbd5e1;
            border-radius: 10px;
            padding: 28px;
            text-align: center;
            transition: border-color 0.2s, background 0.2s;
            background: #fafbfc;
            position: relative;
        }
        .upload-box:hover {
            border-color: #2563eb;
            background: #f0f5ff;
        }
        .upload-box.dragover {
            border-color: #2563eb;
            background: #e8f0fe;
        }
        .upload-box .icon {
            font-size: 40px;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        .upload-box .label {
            font-size: 15px;
            color: #475569;
            margin-bottom: 14px;
            font-weight: 500;
        }
        .upload-box input[type="file"] {
            display: none;
        }
        .upload-btn {
            display: inline-block;
            padding: 10px 24px;
            background: #2563eb;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
            border: none;
        }
        .upload-btn:hover {
            background: #1d4ed8;
        }
        .file-info {
            margin-top: 14px;
            font-size: 13px;
            color: #64748b;
            line-height: 1.6;
            text-align: left;
            display: none;
        }
        .file-info.visible {
            display: block;
        }
        .file-info .filename {
            color: #1e293b;
            font-weight: 600;
            word-break: break-all;
        }
        .config-section {
            background: #f8fafc;
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 32px;
        }
        .config-title {
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 18px;
        }
        .config-row {
            display: flex;
            gap: 20px;
            margin-bottom: 18px;
            flex-wrap: wrap;
            align-items: center;
        }
        .config-row:last-child {
            margin-bottom: 0;
        }
        .config-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .config-item label {
            font-size: 13px;
            color: #475569;
            font-weight: 500;
        }
        .config-item select {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            min-width: 180px;
            background: #fff;
            color: #334155;
            cursor: pointer;
        }
        .config-item select:disabled {
            background: #e2e8f0;
            cursor: not-allowed;
        }
        .radio-group {
            display: flex;
            gap: 16px;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #334155;
            cursor: pointer;
            font-weight: 400;
        }
        .radio-group input[type="radio"] {
            width: 16px;
            height: 16px;
            accent-color: #2563eb;
            cursor: pointer;
        }
        .checkbox-group {
            display: flex;
            gap: 20px;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #334155;
            cursor: pointer;
        }
        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #2563eb;
            cursor: pointer;
        }
        .hidden {
            display: none !important;
        }
        .action-section {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            align-items: center;
        }
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-primary {
            background: #2563eb;
            color: #fff;
        }
        .btn-primary:hover:not(:disabled) {
            background: #1d4ed8;
        }
        .btn-success {
            background: #16a34a;
            color: #fff;
        }
        .btn-success:hover:not(:disabled) {
            background: #15803d;
        }
        .status {
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }
        .status.visible {
            display: block;
        }
        .status.success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }
        .status.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }
        .status.info {
            background: #e0f2fe;
            color: #075985;
            border: 1px solid #7dd3fc;
        }
        .result-section {
            margin-top: 10px;
        }
        .result-title {
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 10px;
        }
        .preview-table-wrap {
            overflow-x: auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }
        .preview-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .preview-table th,
        .preview-table td {
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            text-align: left;
            white-space: nowrap;
        }
        .preview-table th {
            background: #f1f5f9;
            color: #475569;
            font-weight: 600;
            position: sticky;
            top: 0;
        }
        .preview-table tr:nth-child(even) {
            background: #f8fafc;
        }
        .preview-table tr:hover {
            background: #f0f5ff;
        }
        .preview-note {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 8px;
        }
        .no-data {
            text-align: center;
            color: #94a3b8;
            padding: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Excel 双表比对工具</h1>
        <div class="subtitle">上传两个 Excel 文件，选择比对字段和模式，快速合并结果</div>

        <div class="upload-section">
            <div class="upload-box" id="dropA">
                <div class="icon">&#128193;</div>
                <div class="label">上传 Excel 表 A</div>
                <label class="upload-btn">
                    选择文件
                    <input type="file" id="fileA" accept=".xlsx,.xls,.csv">
                </label>
                <div class="file-info" id="infoA"></div>
            </div>
            <div class="upload-box" id="dropB">
                <div class="icon">&#128193;</div>
                <div class="label">上传 Excel 表 B</div>
                <label class="upload-btn">
                    选择文件
                    <input type="file" id="fileB" accept=".xlsx,.xls,.csv">
                </label>
                <div class="file-info" id="infoB"></div>
            </div>
        </div>

        <div class="config-section">
            <div class="config-title">比对配置</div>
            <div class="config-row">
                <div class="config-item">
                    <label for="fieldA">表 A 比对字段</label>
                    <select id="fieldA" disabled>
                        <option value="">请先上传文件</option>
                    </select>
                </div>
                <div class="config-item">
                    <label for="fieldB">表 B 比对字段</label>
                    <select id="fieldB" disabled>
                        <option value="">请先上传文件</option>
                    </select>
                </div>
            </div>
            <div class="config-row">
                <div class="config-item">
                    <label>比对模式</label>
                    <div class="radio-group">
                        <label><input type="radio" name="mode" value="same" checked> 相同值</label>
                        <label><input type="radio" name="mode" value="diff"> 不同值</label>
                    </div>
                </div>
            </div>
            <div class="config-row">
                <div class="config-item">
                    <label>其他选项</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" id="ignoreCase"> 忽略大小写</label>
                        <label id="baseBLabel" class="hidden"><input type="checkbox" id="baseIsB"> 以表 B 为基准</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="action-section">
            <button class="btn btn-primary" id="btnCompare" disabled>开始比对</button>
            <button class="btn btn-success" id="btnDownload" disabled>下载结果 Excel</button>
        </div>

        <div class="status" id="status"></div>

        <div class="result-section">
            <div class="result-title">结果预览 <span id="resultCount"></span></div>
            <div class="preview-table-wrap" id="previewWrap">
                <div class="no-data">请先上传文件并进行比对</div>
            </div>
            <div class="preview-note" id="previewNote"></div>
        </div>
    </div>

    <script>
        // ========== 全局变量 ==========
        let dataA = null;   // { headers: [...], rows: [[...], ...] }
        let dataB = null;
        let resultData = null; // { headers: [...], rows: [[...], ...] }

        // ========== DOM 元素 ==========
        const fileInputA = document.getElementById('fileA');
        const fileInputB = document.getElementById('fileB');
        const infoA = document.getElementById('infoA');
        const infoB = document.getElementById('infoB');
        const selectFieldA = document.getElementById('fieldA');
        const selectFieldB = document.getElementById('fieldB');
        const radioModes = document.getElementsByName('mode');
        const checkIgnoreCase = document.getElementById('ignoreCase');
        const checkBaseIsB = document.getElementById('baseIsB');
        const labelBaseB = document.getElementById('baseBLabel');
        const btnCompare = document.getElementById('btnCompare');
        const btnDownload = document.getElementById('btnDownload');
        const statusEl = document.getElementById('status');
        const previewWrap = document.getElementById('previewWrap');
        const resultCount = document.getElementById('resultCount');
        const previewNote = document.getElementById('previewNote');

        // ========== 文件拖拽支持 ==========
        function setupDrop(dropId, inputId) {
            const drop = document.getElementById(dropId);
            const input = document.getElementById(inputId);
            drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('dragover'); });
            drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
            drop.addEventListener('drop', e => {
                e.preventDefault();
                drop.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    input.files = files;
                    input.dispatchEvent(new Event('change'));
                }
            });
        }
        setupDrop('dropA', 'fileA');
        setupDrop('dropB', 'fileB');

        // ========== 工具函数 ==========
        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            const str = String(text);
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showStatus(msg, type) {
            statusEl.textContent = msg;
            statusEl.className = 'status visible ' + (type || 'info');
        }

        function hideStatus() {
            statusEl.className = 'status';
        }

        function readExcel(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[sheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
                    if (!json || json.length === 0) {
                        callback(new Error('工作表为空'), null);
                        return;
                    }
                    const headers = json[0].map(h => String(h === undefined || h === null ? '' : h).trim());
                    const rows = json.slice(1).filter(r => r.some(c => c !== '' && c !== null && c !== undefined));
                    callback(null, { headers, rows });
                } catch (err) {
                    callback(err, null);
                }
            };
            reader.onerror = function() {
                callback(new Error('文件读取失败'), null);
            };
            reader.readAsArrayBuffer(file);
        }

        function updateFileInfo(elementId, filename, data) {
            const el = document.getElementById(elementId);
            if (!data) {
                el.innerHTML = '';
                el.classList.remove('visible');
                return;
            }
            el.innerHTML = '<div class="filename">' + escapeHtml(filename) + '</div>' +
                '<div>字段数：' + data.headers.length + ' &nbsp;|&nbsp; 数据行数：' + data.rows.length + '</div>' +
                '<div>字段：' + escapeHtml(data.headers.join('、')) + '</div>';
            el.classList.add('visible');
        }

        function updateFieldSelect(selectId, headers) {
            const sel = document.getElementById(selectId);
            sel.innerHTML = '';
            if (!headers || headers.length === 0) {
                sel.disabled = true;
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = '请先上传文件';
                sel.appendChild(opt);
                return;
            }
            sel.disabled = false;
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = '请选择字段';
            sel.appendChild(placeholder);
            headers.forEach(function(h) {
                const opt = document.createElement('option');
                opt.value = h;
                opt.textContent = h;
                sel.appendChild(opt);
            });
        }

        function checkCanCompare() {
            const canCompare = dataA && dataB &&
                selectFieldA.value &&
                selectFieldB.value;
            btnCompare.disabled = !canCompare;
        }

        // ========== 文件上传事件 ==========
        fileInputA.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            dataA = null;
            updateFileInfo('infoA', '', null);
            updateFieldSelect('fieldA', []);
            hideStatus();
            showStatus('正在解析表 A...', 'info');
            readExcel(file, function(err, result) {
                if (err) {
                    showStatus('表 A 解析失败：' + err.message, 'error');
                    return;
                }
                dataA = result;
                updateFileInfo('infoA', file.name, dataA);
                updateFieldSelect('fieldA', dataA.headers);
                hideStatus();
                checkCanCompare();
            });
        });

        fileInputB.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            dataB = null;
            updateFileInfo('infoB', '', null);
            updateFieldSelect('fieldB', []);
            hideStatus();
            showStatus('正在解析表 B...', 'info');
            readExcel(file, function(err, result) {
                if (err) {
                    showStatus('表 B 解析失败：' + err.message, 'error');
                    return;
                }
                dataB = result;
                updateFileInfo('infoB', file.name, dataB);
                updateFieldSelect('fieldB', dataB.headers);
                hideStatus();
                checkCanCompare();
            });
        });

        // ========== 配置变更事件 ==========
        selectFieldA.addEventListener('change', checkCanCompare);
        selectFieldB.addEventListener('change', checkCanCompare);

        Array.from(radioModes).forEach(function(radio) {
            radio.addEventListener('change', function() {
                if (radio.value === 'diff') {
                    labelBaseB.classList.remove('hidden');
                } else {
                    labelBaseB.classList.add('hidden');
                    checkBaseIsB.checked = false;
                }
            });
        });

        // ========== 比对引擎 ==========
        function compareData() {
            if (!dataA || !dataB) {
                showStatus('请先上传两个文件', 'error');
                return;
            }
            const fieldA = selectFieldA.value;
            const fieldB = selectFieldB.value;
            if (!fieldA || !fieldB) {
                showStatus('请选择比对字段', 'error');
                return;
            }

            const mode = document.querySelector('input[name="mode"]:checked').value;
            const ignoreCase = checkIgnoreCase.checked;
            const baseIsB = checkBaseIsB.checked;

            const idxA = dataA.headers.indexOf(fieldA);
            const idxB = dataB.headers.indexOf(fieldB);
            if (idxA === -1 || idxB === -1) {
                showStatus('字段索引异常', 'error');
                return;
            }

            const headersA = dataA.headers.map(function(h) { return 'A_' + h; });
            const headersB = dataB.headers.map(function(h) { return 'B_' + h; });
            const outHeaders = headersA.concat(headersB);
            const outRows = [];

            function normalize(val) {
                if (val === null || val === undefined) return '';
                let s = String(val).trim();
                if (ignoreCase) s = s.toLowerCase();
                return s;
            }

            if (mode === 'same') {
                // 相同值：构建B表索引，遍历A做笛卡尔积合并
                const bMap = {};
                dataB.rows.forEach(function(row) {
                    const key = normalize(row[idxB]);
                    if (!bMap[key]) bMap[key] = [];
                    bMap[key].push(row);
                });
                dataA.rows.forEach(function(rowA) {
                    const key = normalize(rowA[idxA]);
                    const matches = bMap[key];
                    if (matches && matches.length > 0) {
                        matches.forEach(function(rowB) {
                            outRows.push(rowA.concat(rowB));
                        });
                    }
                });
            } else {
                // 不同值：以基准表为准，找出另一表中没有匹配的行
                const baseData = baseIsB ? dataB : dataA;
                const otherData = baseIsB ? dataA : dataB;
                const baseIdx = baseIsB ? idxB : idxA;
                const otherIdx = baseIsB ? idxA : idxB;
                const basePrefix = baseIsB ? 'B_' : 'A_';
                const otherPrefix = baseIsB ? 'A_' : 'B_';

                const otherSet = {};
                otherData.rows.forEach(function(row) {
                    otherSet[normalize(row[otherIdx])] = true;
                });

                baseData.rows.forEach(function(row) {
                    const key = normalize(row[baseIdx]);
                    if (!otherSet[key]) {
                        if (baseIsB) {
                            // 基准是B，缺少A匹配 -> 空A行 + B行
                            const emptyA = dataA.headers.map(function() { return ''; });
                            outRows.push(emptyA.concat(row));
                        } else {
                            // 基准是A，缺少B匹配 -> A行 + 空B行
                            const emptyB = dataB.headers.map(function() { return ''; });
                            outRows.push(row.concat(emptyB));
                        }
                    }
                });
            }

            resultData = { headers: outHeaders, rows: outRows };
            renderPreview(resultData);
            btnDownload.disabled = outRows.length === 0;
            showStatus('比对完成，共 ' + outRows.length + ' 行结果', 'success');
        }

        function renderPreview(data) {
            if (!data || data.rows.length === 0) {
                previewWrap.innerHTML = '<div class="no-data">无结果数据</div>';
                resultCount.textContent = '';
                previewNote.textContent = '';
                return;
            }
            const maxRows = 20;
            const displayRows = data.rows.slice(0, maxRows);
            let html = '<table class="preview-table"><thead><tr>';
            data.headers.forEach(function(h) {
                html += '<th>' + escapeHtml(h) + '</th>';
            });
            html += '</tr></thead><tbody>';
            displayRows.forEach(function(row) {
                html += '<tr>';
                row.forEach(function(cell) {
                    html += '<td>' + escapeHtml(cell) + '</td>';
                });
                html += '</tr>';
            });
            html += '</tbody></table>';
            previewWrap.innerHTML = html;
            resultCount.textContent = '(共 ' + data.rows.length + ' 行)';
            if (data.rows.length > maxRows) {
                previewNote.textContent = '仅显示前 ' + maxRows + ' 行，导出文件将包含全部数据。';
            } else {
                previewNote.textContent = '';
            }
        }

        btnCompare.addEventListener('click', compareData);

        // ========== Excel 导出 ==========
        btnDownload.addEventListener('click', function() {
            if (!resultData || resultData.rows.length === 0) {
                showStatus('没有可导出的数据', 'error');
                return;
            }
            try {
                const aoa = [resultData.headers].concat(resultData.rows);
                const ws = XLSX.utils.aoa_to_sheet(aoa);

                // 自动计算列宽
                const colWidths = resultData.headers.map(function(_, ci) {
                    let max = 10;
                    for (let ri = 0; ri < Math.min(aoa.length, 1000); ri++) {
                        const cell = aoa[ri][ci];
                        const len = String(cell === null || cell === undefined ? '' : cell).length;
                        if (len > max) max = len;
                    }
                    return { wch: Math.min(max + 2, 50) };
                });
                ws['!cols'] = colWidths;

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, '比对结果');
                const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
                XLSX.writeFile(wb, '比对结果_' + dateStr + '.xlsx');
                showStatus('导出成功', 'success');
            } catch (err) {
                showStatus('导出失败：' + err.message, 'error');
            }
        });
    </script>
</body>
</html>
