<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心情便利店</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --mm-bg: #f5f0eb;
    --mm-surface: #ffffff;
    --mm-primary: #ff8c42;
    --mm-primary-light: #ffb07a;
    --mm-secondary: #6c5ce7;
    --mm-text: #2d3436;
    --mm-text-muted: #636e72;
    --mm-border: #e0d6cc;
    --mm-radius: 16px;
    --mm-radius-sm: 10px;
    --mm-sunny: #f9ca24;
    --mm-cloudy: #74b9ff;
    --mm-overcast: #b2bec3;
    --mm-rainy: #0984e3;
    --mm-stormy: #6c5ce7;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--mm-bg);
    color: var(--mm-text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
  }
  .mm-container {
    max-width: 480px;
    width: 100%;
    margin: 0 auto;
  }
  .mm-step { display: none; }
  .mm-step.active { display: block; }

  /* Welcome */
  .mm-welcome {
    text-align: center;
    padding: 40px 20px;
  }
  .mm-logo {
    font-size: 64px;
    margin-bottom: 16px;
  }
  .mm-welcome h1 {
    font-size: 28px;
    font-weight: 700;
    color: var(--mm-primary);
    margin-bottom: 12px;
  }
  .mm-welcome .tagline {
    font-size: 16px;
    color: var(--mm-text-muted);
    margin-bottom: 32px;
    line-height: 1.6;
  }
  .mm-store-icon {
    width: 120px;
    height: 120px;
    margin: 0 auto 24px;
    background: var(--mm-surface);
    border-radius: var(--mm-radius);
    border: 3px dashed var(--mm-border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
  }
  .mm-features {
    display: flex;
    gap: 12px;
    margin: 24px 0 32px;
  }
  .mm-feature {
    flex: 1;
    background: var(--mm-surface);
    border-radius: var(--mm-radius-sm);
    padding: 16px 12px;
    text-align: center;
  }
  .mm-feature .icon { font-size: 24px; margin-bottom: 8px; }
  .mm-feature .label { font-size: 12px; color: var(--mm-text-muted); }

  /* Buttons */
  .mm-btn {
    display: inline-block;
    padding: 14px 32px;
    background: var(--mm-primary);
    color: #fff;
    border: none;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
  }
  .mm-btn:hover { background: var(--mm-primary-light); transform: translateY(-2px); }
  .mm-btn:active { transform: translateY(0); }
  .mm-btn-secondary {
    background: var(--mm-surface);
    color: var(--mm-primary);
    border: 2px solid var(--mm-primary);
  }
  .mm-btn-secondary:hover { background: var(--mm-primary); color: #fff; }
  .mm-btn-small {
    padding: 10px 20px;
    font-size: 14px;
  }

  /* Quiz */
  .mm-quiz-header {
    background: var(--mm-surface);
    border-radius: var(--mm-radius) var(--mm-radius) 0 0;
    padding: 20px 24px 16px;
    margin-bottom: 0;
  }
  .mm-progress-bar {
    height: 8px;
    background: var(--mm-border);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 12px;
  }
  .mm-progress-fill {
    height: 100%;
    background: var(--mm-primary);
    border-radius: 4px;
    transition: width 0.3s ease;
  }
  .mm-progress-text {
    font-size: 13px;
    color: var(--mm-text-muted);
    margin-bottom: 4px;
  }
  .mm-question-card {
    background: var(--mm-surface);
    border-radius: 0 0 var(--mm-radius) var(--mm-radius);
    padding: 24px;
    margin-bottom: 20px;
  }
  .mm-question-icon {
    font-size: 40px;
    text-align: center;
    margin-bottom: 16px;
  }
  .mm-question-text {
    font-size: 18px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 24px;
    line-height: 1.5;
  }
  .mm-options {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .mm-option {
    padding: 14px 16px;
    background: var(--mm-bg);
    border: 2px solid transparent;
    border-radius: var(--mm-radius-sm);
    cursor: pointer;
    transition: all 0.2s;
    font-size: 15px;
    text-align: left;
  }
  .mm-option:hover {
    border-color: var(--mm-primary-light);
    background: #fff5ee;
  }
  .mm-option.selected {
    border-color: var(--mm-primary);
    background: #fff0e0;
  }

  /* Result */
  .mm-result-card {
    background: var(--mm-surface);
    border-radius: var(--mm-radius);
    padding: 32px 24px;
    text-align: center;
    margin-bottom: 20px;
  }
  .mm-weather-icon {
    font-size: 72px;
    margin-bottom: 16px;
  }
  .mm-level-name {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .mm-level-desc {
    font-size: 15px;
    color: var(--mm-text-muted);
    line-height: 1.6;
    margin-bottom: 20px;
  }
  .mm-meter {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin: 20px 0;
  }
  .mm-meter-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--mm-border);
    transition: all 0.3s;
  }
  .mm-meter-dot.filled { transform: scale(1.1); }

  /* Shop */
  .mm-shop-header {
    background: var(--mm-surface);
    border-radius: var(--mm-radius) var(--mm-radius) 0 0;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .mm-shop-header h2 {
    font-size: 20px;
    font-weight: 700;
  }
  .mm-shop-header .icon { font-size: 28px; }
  .mm-shop-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 16px 24px 24px;
    background: var(--mm-surface);
    border-radius: 0 0 var(--mm-radius) var(--mm-radius);
  }
  .mm-product {
    background: var(--mm-bg);
    border-radius: var(--mm-radius-sm);
    padding: 16px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    border: 2px solid transparent;
  }
  .mm-product:hover {
    border-color: var(--mm-primary-light);
    transform: translateY(-2px);
  }
  .mm-product .icon { font-size: 32px; margin-bottom: 8px; }
  .mm-product .name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .mm-product .tag {
    font-size: 11px;
    color: var(--mm-text-muted);
    background: var(--mm-surface);
    padding: 2px 8px;
    border-radius: 20px;
    display: inline-block;
  }

  /* Product Detail Modal */
  .mm-modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    justify-content: center;
    align-items: flex-end;
  }
  .mm-modal-overlay.show { display: flex; }
  .mm-modal {
    background: var(--mm-surface);
    border-radius: var(--mm-radius) var(--mm-radius) 0 0;
    padding: 24px;
    width: 100%;
    max-width: 480px;
    max-height: 80vh;
    overflow-y: auto;
    animation: mm-slide-up 0.3s ease;
  }
  @keyframes mm-slide-up {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .mm-modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .mm-modal-header h3 { font-size: 18px; }
  .mm-modal-close {
    width: 32px; height: 32px;
    border: none; background: var(--mm-bg);
    border-radius: 50%; cursor: pointer;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  .mm-modal-content { font-size: 15px; line-height: 1.8; color: var(--mm-text); }
  .mm-modal-content .step-list { list-style: none; padding: 0; }
  .mm-modal-content .step-list li {
    padding: 12px 0;
    border-bottom: 1px solid var(--mm-border);
    display: flex;
    gap: 12px;
  }
  .mm-modal-content .step-list li:last-child { border-bottom: none; }
  .mm-modal-content .step-num {
    width: 24px; height: 24px;
    background: var(--mm-primary);
    color: #fff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
    flex-shrink: 0;
  }
  .mm-modal-content .step-text { font-size: 14px; }

  /* Breathing Animation */
  .mm-breathing-circle {
    width: 120px; height: 120px;
    border-radius: 50%;
    background: var(--mm-primary-light);
    margin: 20px auto;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 14px; font-weight: 600;
  }
  .mm-breathing-circle.inhale {
    animation: mm-breathe-in 4s ease-in-out forwards;
  }
  .mm-breathing-circle.hold {
    animation: none;
  }
  .mm-breathing-circle.exhale {
    animation: mm-breathe-out 4s ease-in-out forwards;
  }
  @keyframes mm-breathe-in {
    from { transform: scale(0.8); }
    to { transform: scale(1.2); }
  }
  @keyframes mm-breathe-out {
    from { transform: scale(1.2); }
    to { transform: scale(0.8); }
  }

  /* Responsive */
  @media (max-width: 400px) {
    .mm-features { flex-direction: column; }
    .mm-shop-grid { grid-template-columns: 1fr; }
    .mm-welcome h1 { font-size: 24px; }
  }
</style>

<div class="mm-container">
  <!-- Step 1: Welcome -->
  <div id="step-welcome" class="mm-step active">
    <div class="mm-welcome">
      <div class="mm-store-icon">🏪</div>
      <h1>心情便利店</h1>
      <p class="tagline">测测你今天的心情怎么样？<br>帮你挑一个解压小工具~</p>
      <div class="mm-features">
        <div class="mm-feature">
          <div class="icon">📝</div>
          <div class="label">趣味答题</div>
        </div>
        <div class="mm-feature">
          <div class="icon">🌤️</div>
          <div class="label">心情天气</div>
        </div>
        <div class="mm-feature">
          <div class="icon">🎁</div>
          <div class="label">解压好物</div>
        </div>
      </div>
      <button class="mm-btn" onclick="startQuiz()">开始逛 🛒</button>
    </div>
  </div>

  <!-- Step 2: Quiz -->
  <div id="step-quiz" class="mm-step">
    <div class="mm-quiz-header">
      <div class="mm-progress-text">第 <span id="q-current">1</span> / <span id="q-total">10</span> 题</div>
      <div class="mm-progress-bar">
        <div class="mm-progress-fill" id="q-progress" style="width: 10%"></div>
      </div>
    </div>
    <div class="mm-question-card">
      <div class="mm-question-icon" id="q-icon">📚</div>
      <div class="mm-question-text" id="q-text">加载中...</div>
      <div class="mm-options" id="q-options"></div>
    </div>
  </div>

  <!-- Step 3: Result -->
  <div id="step-result" class="mm-step">
    <div class="mm-result-card">
      <div class="mm-weather-icon" id="r-icon">☀️</div>
      <div class="mm-level-name" id="r-name">晴天</div>
      <div class="mm-level-desc" id="r-desc">你今天心情不错！</div>
      <div class="mm-meter" id="r-meter"></div>
      <p style="font-size: 14px; color: var(--mm-text-muted); margin-bottom: 20px;">去便利店挑个专属解压工具吧</p>
      <button class="mm-btn" onclick="showShop()">逛便利店 🏪</button>
    </div>
  </div>

  <!-- Step 4: Shop -->
  <div id="step-shop" class="mm-step">
    <div class="mm-shop-header">
      <span class="icon">🏪</span>
      <h2>解压便利店</h2>
    </div>
    <div class="mm-shop-grid" id="shop-grid"></div>
    <div style="text-align: center; padding: 20px;">
      <button class="mm-btn mm-btn-secondary mm-btn-small" onclick="restart()">重新测试 🔄</button>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="mm-modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="mm-modal" onclick="event.stopPropagation()">
    <div class="mm-modal-header">
      <h3 id="modal-title">标题</h3>
      <button class="mm-modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="mm-modal-content" id="modal-content"></div>
  </div>
</div>

<script>
(function() {
  // Questions data
  var questions = [
    {
      icon: '📚',
      text: '明天有一场重要考试/汇报，今晚你的状态是？',

  var currentQ = 0;
  var totalScore = 0;
  var currentLevel = 0;

  window.startQuiz = function() {
    currentQ = 0;
    totalScore = 0;
    showStep('step-quiz');
    renderQuestion();
  };

  function showStep(id) {
    var steps = document.querySelectorAll('.mm-step');
    for (var i = 0; i < steps.length; i++) {
      steps[i].classList.remove('active');
    }
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
  }

  function renderQuestion() {
    var q = questions[currentQ];
    document.getElementById('q-current').textContent = currentQ + 1;
    document.getElementById('q-total').textContent = questions.length;
    document.getElementById('q-progress').style.width = ((currentQ + 1) / questions.length * 100) + '%';
    document.getElementById('q-icon').textContent = q.icon;
    document.getElementById('q-text').textContent = q.text;
    var html = '';
    for (var i = 0; i < q.options.length; i++) {
      html += '<div class="mm-option" onclick="selectOption(this, ' + q.options[i].score + ')">' + q.options[i].text + '</div>';
    }
    document.getElementById('q-options').innerHTML = html;
  }

  window.selectOption = function(el, score) {
    var options = document.querySelectorAll('.mm-option');
    for (var i = 0; i < options.length; i++) {
      options[i].classList.remove('selected');
    }
    el.classList.add('selected');
    totalScore += score;
    currentQ++;
    setTimeout(function() {
      if (currentQ < questions.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }, 400);
  };

  function showResult() {
    var level = levels[0];
    var levelIndex = 1;
    for (var i = levels.length - 1; i >= 0; i--) {
      if (totalScore >= levels[i].min && totalScore <= levels[i].max) {
        level = levels[i];
        levelIndex = 5 - i;
        break;
      }
    }
    currentLevel = levelIndex;

    document.getElementById('r-icon').textContent = level.icon;
    document.getElementById('r-name').textContent = level.name;
    document.getElementById('r-desc').textContent = level.desc;
    document.getElementById('r-name').style.color = level.color;

    // Meter
    var meterHtml = '';
    for (var j = 1; j <= 5; j++) {
      var filled = j <= (5 - levelIndex + 1) ? '' : '';
      var color = j <= (5 - levelIndex + 1) ? level.color : 'var(--mm-border)';
      meterHtml += '<div class="mm-meter-dot filled" style="background:' + color + '"></div>';
    }
    document.getElementById('r-meter').innerHTML = meterHtml;

    showStep('step-result');
  }

  window.showShop = function() {
    renderShop();
    showStep('step-shop');
  };

  function renderShop() {
    var products = shopProducts[currentLevel];
    var html = '';
    for (var i = 0; i < products.length; i++) {
      html += '<div class="mm-product" onclick="openProduct(' + i + ')">';
      html += '<div class="icon">' + products[i].icon + '</div>';
      html += '<div class="name">' + products[i].name + '</div>';
      html += '<span class="tag">' + products[i].tag + '</span>';
      html += '</div>';
    }
    document.getElementById('shop-grid').innerHTML = html;
  }

  window.openProduct = function(idx) {
    var products = shopProducts[currentLevel];
    var p = products[idx];
    document.getElementById('modal-title').textContent = p.icon + ' ' + p.name;
    var content = '<p style="margin-bottom:16px;color:var(--mm-text-muted)">' + p.tag + '</p>';
    content += '<ol class="step-list">';
    for (var i = 0; i < p.steps.length; i++) {
      content += '<li><span class="step-num">' + (i + 1) + '</span><span class="step-text">' + p.steps[i] + '</span></li>';
    }
    content += '</ol>';
    document.getElementById('modal-content').innerHTML = content;
    document.getElementById('modal').classList.add('show');
  };

  window.closeModal = function(e) {
    if (e && e.target !== document.getElementById('modal')) return;
    document.getElementById('modal').classList.remove('show');
  };

  window.restart = function() {
    currentQ = 0;
    totalScore = 0;
    currentLevel = 0;
    showStep('step-welcome');
  };
})();
</script>
