<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线图片压缩工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        
        .upload-area {
            border: 2px dashed #007bff;
            border-radius: 10px;
            padding: 50px;
            text-align: center;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-area:hover {
            background: #f8f9fa;
        }
        
        .upload-area.dragover {
            background: #e3f2fd;
            border-color: #0056b3;
        }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        
        .control-group {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 10px;
            color: #555;
            font-weight: 500;
        }
        
        .control-group input[type="range"] {
            width: 100%;
        }
        
        .preview {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        
        .preview-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .preview-box img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 5px;
        }
        
        .stats {
            margin-top: 10px;
            color: #666;
        }
        
        .compress-btn {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 30px auto;
            padding: 15px 30px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .compress-btn:hover {
            background: #0056b3;
        }
        
        .compress-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .download-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .loading.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖼️ 在线图片压缩工具</h1>
        
        <!-- 上传区域 -->
        <div class="upload-area" id="uploadArea">
            <p>拖拽图片到此处，或点击选择文件</p>
            <p style="color: #999; margin-top: 10px;">支持 JPG、PNG、GIF、WebP 格式</p>
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
        </div>
        
        <!-- 控制参数 -->
        <div class="controls" id="controls" style="display: none;">
            <div class="control-group">
                <label>压缩质量: <span id="qualityValue">85</span>%</label>
                <input type="range" id="quality" min="1" max="100" value="85">
            </div>
            
            <div class="control-group">
                <label>最大宽度: <span id="widthValue">1920</span>px</label>
                <input type="range" id="maxWidth" min="100" max="4000" value="1920" step="100">
            </div>
            
            <div class="control-group">
                <label>最大高度: <span id="heightValue">1080</span>px</label>
                <input type="range" id="maxHeight" min="100" max="4000" value="1080" step="100">
            </div>
        </div>
        
        <!-- 压缩按钮 -->
        <button class="compress-btn" id="compressBtn" style="display: none;">
            开始压缩
        </button>
        
        <!-- 加载提示 -->
        <div class="loading" id="loading">
            <p>⏳ 正在压缩图片，请稍候...</p>
        </div>
        
        <!-- 预览区域 -->
        <div class="preview" id="preview" style="display: none;">
            <div class="preview-box">
                <h3>原始图片</h3>
                <img id="originalImage" src="" alt="原始图片">
                <div class="stats" id="originalStats"></div>
            </div>
            
            <div class="preview-box">
                <h3>压缩后图片</h3>
                <img id="compressedImage" src="" alt="压缩图片">
                <div class="stats" id="compressedStats"></div>
                <a href="#" class="download-btn" id="downloadBtn" download="compressed.jpg">
                    下载压缩图片
                </a>
            </div>
        </div>
    </div>

    <script>
        class ImageCompressor {
            constructor() {
                this.originalFile = null;
                this.originalBase64 = null;
                
                this.bindEvents();
            }
            
            bindEvents() {
                const uploadArea = document.getElementById('uploadArea');
                const fileInput = document.getElementById('fileInput');
                const compressBtn = document.getElementById('compressBtn');
                
                // 点击上传
                uploadArea.addEventListener('click', () => fileInput.click());
                
                // 文件选择
                fileInput.addEventListener('change', (e) => {
                    if (e.target.files.length > 0) {
                        this.handleFile(e.target.files[0]);
                    }
                });
                
                // 拖拽上传
                uploadArea.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    uploadArea.classList.add('dragover');
                });
                
                uploadArea.addEventListener('dragleave', () => {
                    uploadArea.classList.remove('dragover');
                });
                
                uploadArea.addEventListener('drop', (e) => {
                    e.preventDefault();
                    uploadArea.classList.remove('dragover');
                    
                    if (e.dataTransfer.files.length > 0) {
                        this.handleFile(e.dataTransfer.files[0]);
                    }
                });
                
                // 参数调整
                document.getElementById('quality').addEventListener('input', (e) => {
                    document.getElementById('qualityValue').textContent = e.target.value;
                });
                
                document.getElementById('maxWidth').addEventListener('input', (e) => {
                    document.getElementById('widthValue').textContent = e.target.value;
                });
                
                document.getElementById('maxHeight').addEventListener('input', (e) => {
                    document.getElementById('heightValue').textContent = e.target.value;
                });
                
                // 压缩按钮
                compressBtn.addEventListener('click', () => {
                    this.compressImage();
                });
            }
            
            async handleFile(file) {
                // 验证文件类型
                if (!file.type.startsWith('image/')) {
                    alert('请选择图片文件');
                    return;
                }
                
                this.originalFile = file;
                
                // 读取为 Base64
                const reader = new FileReader();
                reader.onload = (e) => {
                    this.originalBase64 = e.target.result;
                    
                    // 显示预览
                    document.getElementById('originalImage').src = e.target.result;
                    document.getElementById('originalStats').innerHTML = 
                        `大小: ${(file.size / 1024).toFixed(2)} KB`;
                    
                    // 显示控制区域
                    document.getElementById('controls').style.display = 'grid';
                    document.getElementById('compressBtn').style.display = 'block';
                    document.getElementById('preview').style.display = 'grid';
                };
                reader.readAsDataURL(file);
            }
            
            async compressImage_Fwq() {
                const loading = document.getElementById('loading');
                const compressBtn = document.getElementById('compressBtn');
                
                loading.classList.add('show');
                compressBtn.disabled = true;
                
                try {
                    const quality = document.getElementById('quality').value;
                    const maxWidth = document.getElementById('maxWidth').value;
                    const maxHeight = document.getElementById('maxHeight').value;
                    
                    // 发送到后端压缩
                    const response = await fetch('/api/compress.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            image: this.originalBase64,
                            quality: parseInt(quality),
                            maxWidth: parseInt(maxWidth),
                            maxHeight: parseInt(maxHeight)
                        })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        // 显示压缩结果
                        document.getElementById('compressedImage').src = result.image;
                        document.getElementById('compressedStats').innerHTML = 
                            `大小: ${(result.compressedSize / 1024).toFixed(2)} KB<br>` +
                            `压缩率: ${result.compressionRatio}%<br>` +
                            `尺寸: ${result.width} × ${result.height}`;
                        
                        // 设置下载链接
                        const downloadBtn = document.getElementById('downloadBtn');
                        downloadBtn.href = result.image;
                        downloadBtn.download = `compressed_${Date.now()}.jpg`;
                        
                    } else {
                        alert('压缩失败: ' + result.error);
                    }
                    
                } catch (error) {
                    alert('请求失败: ' + error.message);
                } finally {
                    loading.classList.remove('show');
                    compressBtn.disabled = false;
                }
            }

            async compressImage() {
                const loading = document.getElementById('loading');
                const compressBtn = document.getElementById('compressBtn');
                
                loading.classList.add('show');
                compressBtn.disabled = true;
                
                try {
                    const quality = parseInt(document.getElementById('quality').value) / 100;
                    const maxWidth = parseInt(document.getElementById('maxWidth').value);
                    const maxHeight = parseInt(document.getElementById('maxHeight').value);
                    
                    // 使用 Canvas 进行前端压缩
                    const compressedBlob = await this.compressWithCanvas(
                        this.originalFile, 
                        quality, 
                        maxWidth, 
                        maxHeight
                    );
                    
                    // 计算压缩信息
                    const originalSize = this.originalFile.size;
                    const compressedSize = compressedBlob.size;
                    const compressionRatio = ((1 - compressedSize / originalSize) * 100).toFixed(2);
                    
                    // 读取压缩后的图片用于显示
                    const compressedUrl = URL.createObjectURL(compressedBlob);
                    
                    // 显示压缩结果
                    document.getElementById('compressedImage').src = compressedUrl;
                    document.getElementById('compressedStats').innerHTML = 
                        `大小: ${(compressedSize / 1024).toFixed(2)} KB<br>` +
                        `压缩率: ${compressionRatio}%`;
                    
                    // 设置下载链接
                    const downloadBtn = document.getElementById('downloadBtn');
                    downloadBtn.href = compressedUrl;
                    downloadBtn.download = `compressed_${Date.now()}.jpg`;
                    
                } catch (error) {
                    alert('压缩失败: ' + error.message);
                    console.error(error);
                } finally {
                    loading.classList.remove('show');
                    compressBtn.disabled = false;
                }
            }

            compressWithCanvas(file, quality, maxWidth, maxHeight) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    
                    reader.onload = function(e) {
                        const img = new Image();
                        
                        img.onload = function() {
                            // 创建 Canvas
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            
                            // 计算新尺寸
                            let width = img.width;
                            let height = img.height;
                            
                            if (width > maxWidth || height > maxHeight) {
                                const ratio = Math.min(maxWidth / width, maxHeight / height);
                                width = Math.round(width * ratio);
                                height = Math.round(height * ratio);
                            }
                            
                            canvas.width = width;
                            canvas.height = height;
                            
                            // 绘制图片
                            ctx.drawImage(img, 0, 0, width, height);
                            
                            // 导出为 Blob
                            canvas.toBlob((blob) => {
                                if (blob) {
                                    resolve(blob);
                                } else {
                                    reject(new Error('Canvas 导出失败'));
                                }
                            }, 'image/jpeg', quality);
                        };
                        
                        img.onerror = () => reject(new Error('图片加载失败'));
                        img.src = e.target.result;
                    };
                    
                    reader.onerror = () => reject(new Error('文件读取失败'));
                    reader.readAsDataURL(file);
                });
            }
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            new ImageCompressor();
        });
    </script>
</body>
</html>
