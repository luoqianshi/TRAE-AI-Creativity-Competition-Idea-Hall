<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CapDesign — Pattern Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ========== VARIABLES ========== */
:root{
  --ink:#141414;
  --yellow:#FFDE59;
  --app-bg:#F0EEE9;
  --outer-bg:#DCD9D2;
  --surface:#FFFFFF;
  --specimen:#F4F2EC;
  --coral:#FF6B6B;
  --blue:#4D96FF;
  --green:#6BCB77;
  --purple:#C77DFF;
  --ui-purple:#5B5BD6;
  --shadow-sm:3px 3px 0 var(--ink);
  --shadow-md:5px 5px 0 var(--ink);
  --shadow-lg:7px 7px 0 var(--ink);
  --shadow-xl:8px 8px 0 var(--ink);
  --border:3px solid var(--ink);
  --radius:18px;
  --radius-lg:24px;
  --font:'Archivo',Arial Black,Helvetica,system-ui,sans-serif;
}

/* ========== RESET ========== */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--outer-bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

/* ========== BROWSER FRAME ========== */
.browser-shell{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:1360px;height:860px;
  max-width:96vw;max-height:94vh;
  background:var(--app-bg);
  border:var(--border);
  border-radius:14px;
  box-shadow:var(--shadow-xl);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.browser-bar{
  background:#2A2A2A;
  padding:10px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:var(--border);
  flex-shrink:0;
  height:46px;
}
.browser-dots{display:flex;gap:8px}
.browser-dot{width:13px;height:13px;border-radius:50%;border:2px solid rgba(0,0,0,.2)}
.browser-dot.red{background:#FF5F57}
.browser-dot.yellow{background:#FEBC2E}
.browser-dot.green{background:#28C840}
.browser-tab{
  background:var(--surface);
  color:var(--ink);
  padding:5px 16px;
  border-radius:8px 8px 0 0;
  font-size:12px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:4px;
}
.browser-tab-close{font-size:14px;opacity:.4}
.browser-url{
  flex:1;
  background:#1A1A1A;
  color:#999;
  border:2px solid #444;
  border-radius:6px;
  padding:6px 14px;
  font-size:12px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:8px;
}
.browser-url-icon{width:12px;height:12px;fill:#999}
.browser-url span{color:#ccc}

.app-container{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  position:relative;
  background:var(--app-bg);
}

/* ========== NAVIGATION ========== */
.navbar{
  height:70px;
  background:var(--surface);
  border-bottom:var(--border);
  display:flex;
  align-items:center;
  padding:0 28px;
  gap:20px;
  position:sticky;
  top:0;
  z-index:100;
}
.logo{display:flex;align-items:center;gap:10px}
.logo-squares{position:relative;width:32px;height:32px}
.logo-sq{
  position:absolute;
  width:22px;height:22px;
  border:2.5px solid var(--ink);
  border-radius:5px;
}
.logo-sq.y{background:var(--yellow);top:0;left:0;transform:rotate(-8deg)}
.logo-sq.c{background:var(--coral);bottom:0;right:0;transform:rotate(6deg)}
.logo-text{font-size:18px;font-weight:900;letter-spacing:-.5px}

.nav-pills{display:flex;gap:8px}
.nav-pill{
  padding:8px 18px;
  border:var(--border);
  border-radius:999px;
  font-size:12px;
  font-weight:900;
  letter-spacing:.5px;
  background:var(--surface);
  transition:transform .12s;
}
.nav-pill.active{background:var(--ink);color:var(--surface)}
.nav-pill:active{transform:scale(.96)}

.nav-spacer{flex:1}

.scan-btn{
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 18px;
  background:var(--ink);
  color:var(--surface);
  border:var(--border);
  border-radius:999px;
  font-size:12px;
  font-weight:900;
  letter-spacing:.5px;
  transition:transform .12s,background .15s;
}
.scan-btn.scanning{background:var(--yellow);color:var(--ink)}
.scan-btn:active{transform:scale(.96)}
.scan-icon{
  width:16px;height:16px;
  border:2px solid currentColor;
  border-radius:50%;
  position:relative;
}
.scan-icon::after{
  content:'';
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:6px;height:6px;
  border-radius:50%;
  background:currentColor;
}

.streak-badge{
  background:var(--yellow);
  border:var(--border);
  padding:6px 12px;
  border-radius:8px;
  font-size:11px;
  font-weight:900;
  letter-spacing:.5px;
  transform:rotate(-4deg);
  box-shadow:var(--shadow-sm);
  white-space:nowrap;
}
.count-badge{
  background:var(--ink);
  color:var(--yellow);
  border:2.5px solid var(--ink);
  padding:5px 10px;
  border-radius:8px;
  font-size:12px;
  font-weight:900;
}

/* ========== PAGE WRAPPER ========== */
.page{
  padding:28px;
  animation:pageIn .28s ease-out;
}
@keyframes pageIn{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}

/* ========== BUTTONS ========== */
.btn{
  padding:11px 22px;
  border:var(--border);
  border-radius:999px;
  font-size:13px;
  font-weight:900;
  letter-spacing:.5px;
  transition:transform .12s;
  display:inline-flex;
  align-items:center;
  gap:8px;
  box-shadow:var(--shadow-sm);
}
.btn:active{transform:scale(.96)}
.btn-dark{background:var(--ink);color:var(--surface)}
.btn-yellow{background:var(--yellow);color:var(--ink)}
.btn-white{background:var(--surface);color:var(--ink)}
.btn-coral{background:var(--coral);color:var(--ink)}
.btn-green{background:var(--green);color:var(--ink)}
.btn-lg{padding:14px 28px;font-size:14px}

/* ========== WELCOME PAGE ========== */
.welcome-page{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:calc(860px - 46px);
  padding:40px 28px;
  text-align:center;
}
.welcome-badge{
  background:var(--ink);
  color:var(--yellow);
  border:var(--border);
  padding:8px 18px;
  border-radius:8px;
  font-size:13px;
  font-weight:900;
  letter-spacing:1px;
  transform:rotate(-3deg);
  box-shadow:var(--shadow-sm);
  margin-bottom:24px;
}
.welcome-title{
  font-size:52px;
  font-weight:900;
  line-height:.98;
  letter-spacing:-2px;
  max-width:780px;
  margin-bottom:18px;
  text-transform:uppercase;
}
.welcome-desc{
  font-size:16px;
  font-weight:600;
  max-width:560px;
  line-height:1.5;
  margin-bottom:36px;
  color:#333;
}
.welcome-steps{
  display:flex;
  gap:20px;
  margin-bottom:36px;
  flex-wrap:wrap;
  justify-content:center;
}
.step-card{
  width:250px;
  background:var(--surface);
  border:var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow-md);
  padding:20px;
  text-align:left;
  position:relative;
}
.step-num{
  position:absolute;
  top:-12px;left:-12px;
  width:32px;height:32px;
  background:var(--yellow);
  border:var(--border);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:900;
  box-shadow:var(--shadow-sm);
}
.step-visual{
  height:100px;
  background:var(--specimen);
  border:2.5px solid var(--ink);
  border-radius:12px;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
}
.step-title{
  font-size:15px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.3px;
  margin-bottom:6px;
}
.step-desc{font-size:13px;font-weight:600;line-height:1.4;color:#444}
.welcome-ctas{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

/* Welcome step visuals */
.scan-area-demo{
  width:80%;
  height:70px;
  background:var(--ink);
  border-radius:8px;
  position:relative;
  overflow:hidden;
}
.scan-area-demo::before{
  content:'';
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:24px;height:24px;
  border:2.5px solid var(--yellow);
  border-radius:50%;
}
.scan-line-demo{
  position:absolute;
  top:0;left:0;right:0;
  height:2px;
  background:var(--yellow);
  animation:scanMove 1.6s linear infinite;
}
@keyframes scanMove{
  0%{top:10%}
  50%{top:80%}
  100%{top:10%}
}
.demo-segmented{
  display:flex;
  background:var(--surface);
  border:2.5px solid var(--ink);
  border-radius:8px;
  overflow:hidden;
}
.demo-seg{padding:8px 14px;font-size:11px;font-weight:800}
.demo-seg.active{background:var(--ink);color:var(--surface)}
.demo-mini-cards{display:flex;gap:6px;flex-wrap:wrap}
.demo-mini-card{
  width:42px;height:52px;
  background:var(--surface);
  border:2px solid var(--ink);
  border-radius:6px;
  box-shadow:2px 2px 0 var(--ink);
}
.demo-mini-card:nth-child(1){transform:rotate(-2deg);background:var(--yellow)}
.demo-mini-card:nth-child(2){transform:rotate(1deg);background:var(--coral)}
.demo-mini-card:nth-child(3){transform:rotate(-1deg);background:var(--blue)}
.demo-mini-card:nth-child(4){transform:rotate(2deg);background:var(--green)}

/* ========== CARDS / LIBRARY PAGE ========== */
.cards-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  margin-bottom:20px;
  flex-wrap:wrap;
}
.cards-title-block h1{
  font-size:42px;
  font-weight:900;
  letter-spacing:-1.5px;
  text-transform:uppercase;
  line-height:1;
}
.cards-title-block p{
  font-size:14px;
  font-weight:600;
  color:#555;
  margin-top:6px;
}
.search-box{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--surface);
  border:var(--border);
  border-radius:999px;
  padding:8px 16px;
  box-shadow:var(--shadow-sm);
  min-width:260px;
}
.search-box svg{width:16px;height:16px;flex-shrink:0}
.search-box input{
  border:none;
  outline:none;
  font-size:13px;
  font-weight:600;
  width:100%;
  background:transparent;
}

.category-bar{
  display:flex;
  gap:8px;
  margin-bottom:16px;
  flex-wrap:wrap;
}
.cat-pill{
  padding:7px 16px;
  border:var(--border);
  border-radius:999px;
  font-size:11px;
  font-weight:900;
  letter-spacing:.5px;
  background:var(--surface);
  transition:transform .12s;
}
.cat-pill.active{background:var(--ink);color:var(--surface)}
.cat-pill:active{transform:scale(.96)}

.review-banner{
  background:var(--ink);
  color:var(--surface);
  border:var(--border);
  border-radius:14px;
  padding:16px 20px;
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:20px;
  box-shadow:var(--shadow-md);
}
.review-banner-badge{
  background:var(--coral);
  color:var(--ink);
  border:2.5px solid var(--ink);
  padding:5px 12px;
  border-radius:8px;
  font-size:12px;
  font-weight:900;
  transform:rotate(-4deg);
  flex-shrink:0;
}
.review-banner-text{flex:1;font-size:14px;font-weight:600}
.review-banner-arrow{
  background:var(--yellow);
  color:var(--ink);
  border:2.5px solid var(--yellow);
  width:36px;height:36px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:900;
  flex-shrink:0;
}

.cards-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.pattern-card{
  background:var(--surface);
  border:var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow-md);
  overflow:hidden;
  cursor:pointer;
  transition:transform .15s,box-shadow .15s;
  position:relative;
}
.pattern-card:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.pattern-card:nth-child(even){transform:rotate(.5deg)}
.pattern-card:nth-child(odd){transform:rotate(-.5deg)}
.pattern-card:nth-child(even):hover{transform:rotate(.5deg) translate(-2px,-2px)}
.pattern-card:nth-child(odd):hover{transform:rotate(-.5deg) translate(-2px,-2px)}
.pattern-card.new-card{animation:cardDrop .5s ease-out}
@keyframes cardDrop{
  from{opacity:0;transform:translateY(-20px) rotate(-3deg) scale(.9)}
  to{opacity:1}
}

.card-specimen{
  height:120px;
  background:var(--specimen);
  border-bottom:2.5px solid var(--ink);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  position:relative;
  overflow:hidden;
}
.card-body{padding:12px 14px}
.card-name{
  font-size:16px;
  font-weight:900;
  margin-bottom:8px;
  text-transform:capitalize;
}
.card-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.card-number{font-size:12px;font-weight:800;color:#888}
.new-sticker{
  position:absolute;
  top:8px;right:8px;
  background:var(--yellow);
  border:2.5px solid var(--ink);
  padding:3px 8px;
  border-radius:6px;
  font-size:10px;
  font-weight:900;
  transform:rotate(8deg);
  box-shadow:2px 2px 0 var(--ink);
  z-index:2;
}

/* Category badges */
.cat-badge{
  padding:3px 10px;
  border:2.5px solid var(--ink);
  border-radius:999px;
  font-size:10px;
  font-weight:900;
  letter-spacing:.5px;
}
.cat-badge.NAV{background:var(--coral);color:var(--ink)}
.cat-badge.INPUT{background:var(--blue);color:var(--surface)}
.cat-badge.BOX{background:var(--green);color:var(--ink)}
.cat-badge.FX{background:var(--purple);color:var(--ink)}

/* Empty state */
.empty-state{
  grid-column:1/-1;
  text-align:center;
  padding:60px 20px;
}
.empty-state h3{font-size:22px;font-weight:900;margin-bottom:8px;text-transform:uppercase}
.empty-state p{font-size:14px;font-weight:600;color:#666;margin-bottom:20px}

/* ========== SPECIMENS (CSS-drawn UI patterns) ========== */
.spec-segmented{
  display:flex;
  background:var(--surface);
  border:2.5px solid var(--ink);
  border-radius:8px;
  overflow:hidden;
}
.spec-segmented .seg{
  padding:10px 18px;
  font-size:12px;
  font-weight:800;
  border-right:2.5px solid var(--ink);
}
.spec-segmented .seg:last-child{border-right:none}
.spec-segmented .seg.active{background:var(--ink);color:var(--surface)}

.spec-tabbar{
  width:100%;
  background:var(--surface);
  border:2.5px solid var(--ink);
  border-radius:10px;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
}
.spec-tabbar .tab{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}
.spec-tabbar .tab-icon{
  width:20px;height:20px;
  border:2.5px solid var(--ink);
  border-radius:5px;
}
.spec-tabbar .tab.active .tab-icon{background:var(--coral)}
.spec-tabbar .tab-label{
  font-size:8px;font-weight:800;
}
.spec-tabbar .tab.active .tab-label{color:var(--coral)}

.spec-toggle{
  width:60px;height:34px;
  background:var(--green);
  border:2.5px solid var(--ink);
  border-radius:999px;
  position:relative;
}
.spec-toggle::after{
  content:'';
  position:absolute;
  top:2px;right:2px;
  width:24px;height:24px;
  background:var(--surface);
  border:2.5px solid var(--ink);
  border-radius:50%;
}

.spec-search{
  width:90%;
  background:var(--surface);
  border:2.5px solid var(--ink);
  border-radius:999px;
  padding:8px 16px;
  display:flex;
  align-items:center;
  gap:8px;
}
.spec-search svg{width:14px;height:14px}
.spec-search span{font-size:12px;font-weight:600;color:#999}

.spec-bottomsheet{
  width:100%;height:100%;
  position:relative;
  background:var(--specimen);
}
.spec-bottomsheet .sheet-bg{
  position:absolute;
  top:0;left:0;right:0;
  height:50%;
  background:var(--ui-purple);
  opacity:.15;
}
.spec-bottomsheet .sheet{
  position:absolute;
  bottom:0;left:0;right:0;
  background:var(--surface);
  border:2.5px solid var(--ink);
  border-radius:14px 14px 0 0;
  padding:12px;
}
.spec-bottomsheet .sheet-handle{
  width:36px;height:4px;
  background:var(--ink);
  border-radius:2px;
  margin:0 auto 10px;
}
.spec-bottomsheet .sheet-line{
  height:8px;
  background:var(--specimen);
  border-radius:4px;
  margin-bottom:6px;
}
.spec-bottomsheet .sheet-line.short{width:60%}

.spec-stepper{
  display:flex;
  align-items:center;
  background:var(--surface);
  border:2.5px solid var(--ink);
  border-radius:10px;
  overflow:hidden;
}
.spec-stepper .step-btn{
  width:36px;height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:900;
  border:none;
}
.spec-stepper .step-btn:first-child{border-right:2.5px solid var(--ink)}
.spec-stepper .step-btn:last-child{border-left:2.5px solid var(--ink);background:var(--purple)}
.spec-stepper .step-val{
  padding:0 16px;
  font-size:16px;
  font-weight:900;
}

/* Large specimen (detail/share) */
.specimen-lg{
  height:220px;
  background:var(--specimen);
  border:2.5px solid var(--ink);
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  position:relative;
  overflow:hidden;
}
.specimen-lg .spec-segmented .seg{padding:14px 24px;font-size:14px}
.specimen-lg .spec-tabbar{max-width:280px}
.specimen-lg .spec-tabbar .tab-icon{width:26px;height:26px}
.specimen-lg .spec-tabbar .tab-label{font-size:10px}
.specimen-lg .spec-toggle{width:80px;height:44px}
.specimen-lg .spec-toggle::after{width:32px;height:32px}
.specimen-lg .spec-search{padding:10px 20px}
.specimen-lg .spec-search svg{width:18px;height:18px}
.specimen-lg .spec-search span{font-size:14px}
.specimen-lg .spec-stepper .step-btn{width:48px;height:48px;font-size:22px}
.specimen-lg .spec-stepper .step-val{padding:0 20px;font-size:20px}

/* ========== SCAN PAGE ========== */
.scan-page{padding:28px}
.scan-header{margin-bottom:24px}
.scan-header h1{
  font-size:38px;
  font-weight:900;
  letter-spacing:-1px;
  text-transform:uppercase;
  line-height:1;
  margin-bottom:10px;
}
.scan-header p{font-size:14px;font-weight:600;color:#555;max-width:600px;line-height:1.5}

.upload-zone{
  width:660px;
  max-width:100%;
  height:340px;
  margin:0 auto;
  background:#FFFBEC;
  border:3px dashed var(--ink);
  border-radius:var(--radius-lg);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  position:relative;
  cursor:pointer;
  transition:background .2s;
}
.upload-zone.dragover{background:var(--yellow)}
.upload-zone.has-image{padding:0;border-style:solid;cursor:default}

/* Corner markers */
.scan-corner{
  position:absolute;
  width:28px;height:28px;
  border:3px solid var(--ink);
}
.scan-corner.tl{top:14px;left:14px;border-right:none;border-bottom:none}
.scan-corner.tr{top:14px;right:14px;border-left:none;border-bottom:none}
.scan-corner.bl{bottom:14px;left:14px;border-right:none;border-top:none}
.scan-corner.br{bottom:14px;right:14px;border-left:none;border-top:none}

.upload-circle{
  width:64px;height:64px;
  background:var(--yellow);
  border:var(--border);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:var(--shadow-sm);
}
.upload-circle svg{width:28px;height:28px}
.upload-main-text{font-size:20px;font-weight:900;text-transform:uppercase}
.upload-sub-text{font-size:13px;font-weight:600;color:#666}
.upload-format{font-size:11px;font-weight:800;color:#999;letter-spacing:.5px}

.sample-link{
  text-align:center;
  margin-top:16px;
}
.sample-link button{
  font-size:13px;
  font-weight:800;
  text-decoration:underline;
  color:var(--ink);
}

/* Scanning state */
.scanning-overlay{
  position:absolute;
  inset:0;
  background:rgba(255,251,236,.95);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
  border-radius:var(--radius-lg);
}
.scan-status{font-size:18px;font-weight:900;text-transform:uppercase;letter-spacing:1px}
.scan-progress-bar{
  width:70%;
  height:12px;
  background:var(--surface);
  border:2.5px solid var(--ink);
  border-radius:999px;
  overflow:hidden;
}
.scan-progress-fill{
  height:100%;
  background:var(--yellow);
  border-right:2.5px solid var(--ink);
  transition:width .3s;
  width:0;
}
.scan-line{
  position:absolute;
  left:0;right:0;
  height:3px;
  background:var(--yellow);
  border-top:1.5px solid var(--ink);
  border-bottom:1.5px solid var(--ink);
  animation:scanLineMove 1.6s ease-in-out infinite;
}
@keyframes scanLineMove{
  0%{top:5%}
  50%{top:90%}
  100%{top:5%}
}

/* Fail state */
.scan-fail{
  position:absolute;
  inset:0;
  background:rgba(255,251,236,.95);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  border-radius:var(--radius-lg);
  text-align:center;
  padding:30px;
}
.fail-badge{
  background:var(--coral);
  color:var(--ink);
  border:var(--border);
  padding:8px 18px;
  border-radius:8px;
  font-size:14px;
  font-weight:900;
  transform:rotate(-3deg);
  box-shadow:var(--shadow-sm);
}
.fail-text{font-size:15px;font-weight:600;max-width:380px;line-height:1.5}
.fail-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* Image preview */
.upload-preview{
  width:100%;height:100%;
  object-fit:contain;
  border-radius:var(--radius-lg);
}

/* ========== RESULT PAGE ========== */
.result-page{padding:28px}
.result-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:24px;
  gap:16px;
  flex-wrap:wrap;
}
.result-header h1{
  font-size:32px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:-.5px;
}
.match-badge{
  background:var(--ink);
  color:var(--yellow);
  border:var(--border);
  padding:8px 16px;
  border-radius:8px;
  font-size:16px;
  font-weight:900;
  transform:rotate(-3deg);
  box-shadow:var(--shadow-sm);
}

.result-grid{
  display:grid;
  grid-template-columns:380px 1fr;
  gap:28px;
}

.polaroid-card{
  background:var(--surface);
  border:var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow-lg);
  padding:18px;
  position:relative;
}
.polaroid-image{
  width:100%;
  aspect-ratio:4/3;
  background:var(--specimen);
  border:2.5px solid var(--ink);
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  margin-bottom:14px;
}
.polaroid-image img{width:100%;height:100%;object-fit:cover}
.polaroid-label{
  text-align:center;
  font-size:12px;
  font-weight:900;
  letter-spacing:1px;
  color:#888;
  text-transform:uppercase;
}
.polaroid-sticker{
  position:absolute;
  top:-10px;right:-10px;
  background:var(--yellow);
  border:2.5px solid var(--ink);
  padding:5px 12px;
  border-radius:8px;
  font-size:12px;
  font-weight:900;
  transform:rotate(8deg);
  box-shadow:var(--shadow-sm);
}
.polaroid-sticker.hmm{background:var(--coral)}
.polaroid-sticker.fixed{background:var(--green)}

.result-info h2{
  font-size:32px;
  font-weight:900;
  text-transform:capitalize;
  margin-bottom:8px;
}
.result-meta{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
  flex-wrap:wrap;
}
.pronunciation{
  font-size:14px;
  font-weight:600;
  color:#666;
  font-style:italic;
}
.noun-tag{
  font-size:10px;
  font-weight:900;
  padding:3px 8px;
  border:2px solid var(--ink);
  border-radius:4px;
  background:var(--specimen);
}

.def-card{
  background:var(--surface);
  border:var(--border);
  border-radius:14px;
  box-shadow:var(--shadow-sm);
  padding:18px;
  margin-bottom:20px;
}
.def-label{
  font-size:10px;
  font-weight:900;
  letter-spacing:1px;
  color:#999;
  margin-bottom:6px;
  text-transform:uppercase;
}
.def-text{font-size:15px;font-weight:600;line-height:1.5}

.inks-section{margin-bottom:24px}
.inks-row{display:flex;gap:12px}
.ink-dot{
  width:44px;height:44px;
  border:2.5px solid var(--ink);
  border-radius:50%;
  box-shadow:var(--shadow-sm);
}

.result-actions{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.not-it-link{
  font-size:12px;
  font-weight:800;
  text-decoration:underline;
  color:#666;
  margin-top:4px;
}

/* ========== MODAL ========== */
.modal-overlay{
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:rgba(20,20,20,.4);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1000;
  animation:fadeIn .2s;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--surface);
  border:var(--border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-xl);
  padding:28px;
  max-width:520px;
  width:90%;
  animation:modalIn .25s ease-out;
}
@keyframes modalIn{
  from{opacity:0;transform:scale(.9)}
  to{opacity:1;transform:scale(1)}
}
.modal h3{
  font-size:24px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:18px;
  text-align:center;
  letter-spacing:-.5px;
}
.candidate-list{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.candidate-card{
  background:var(--yellow);
  border:var(--border);
  border-radius:12px;
  box-shadow:var(--shadow-sm);
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
  transition:transform .12s;
}
.candidate-card:active{transform:scale(.97)}
.candidate-name{font-size:15px;font-weight:900;text-transform:capitalize}
.candidate-match{font-size:14px;font-weight:900}
.modal-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* Delete confirmation modal */
.delete-modal{text-align:center}
.delete-modal .modal-icon{
  width:56px;height:56px;
  background:var(--coral);
  border:var(--border);
  border-radius:50%;
  margin:0 auto 16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  box-shadow:var(--shadow-sm);
}

/* ========== TOAST ========== */
.toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:var(--ink);
  color:var(--yellow);
  border:var(--border);
  padding:12px 24px;
  border-radius:999px;
  font-size:13px;
  font-weight:900;
  letter-spacing:.5px;
  box-shadow:var(--shadow-md);
  z-index:2000;
  animation:toastIn .3s ease-out;
}
@keyframes toastIn{
  from{opacity:0;transform:translate(-50%,20px)}
  to{opacity:1;transform:translate(-50%,0)}
}

/* ========== CARD DETAIL PAGE ========== */
.detail-page{padding:28px}
.detail-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:24px;
  gap:16px;
}
.back-link{
  font-size:14px;
  font-weight:900;
  text-transform:uppercase;
  display:flex;
  align-items:center;
  gap:6px;
}
.detail-number{font-size:14px;font-weight:800;color:#888}

.detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:28px;
}
.detail-left{display:flex;flex-direction:column;gap:20px}
.detail-specimen-card{
  background:var(--surface);
  border:var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow-md);
  padding:20px;
  position:relative;
}
.learning-badge{
  position:absolute;
  top:-12px;left:-12px;
  background:var(--blue);
  color:var(--surface);
  border:var(--border);
  padding:5px 12px;
  border-radius:8px;
  font-size:11px;
  font-weight:900;
  transform:rotate(-5deg);
  box-shadow:var(--shadow-sm);
}
.also-spotted{margin-top:16px}
.also-spotted-label{
  font-size:10px;
  font-weight:900;
  letter-spacing:1px;
  color:#888;
  margin-bottom:10px;
  text-transform:uppercase;
}
.spotted-row{display:flex;gap:10px;align-items:center}
.spotted-thumb{
  width:70px;height:52px;
  background:var(--specimen);
  border:2.5px solid var(--ink);
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.spotted-more{font-size:12px;font-weight:800;color:#888}

.detail-right{display:flex;flex-direction:column;gap:18px}
.detail-title-row{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
.detail-title-row h2{
  font-size:30px;
  font-weight:900;
  text-transform:capitalize;
}
.review-info{
  background:var(--specimen);
  border:2.5px solid var(--ink);
  border-radius:10px;
  padding:10px 14px;
  font-size:12px;
  font-weight:800;
  display:inline-block;
}
.related-tags{display:flex;gap:8px;flex-wrap:wrap}
.related-tag{
  padding:6px 12px;
  background:var(--surface);
  border:2.5px solid var(--ink);
  border-radius:999px;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
  transition:transform .12s;
}
.related-tag:active{transform:scale(.95)}

.notes-section{
  background:var(--surface);
  border:var(--border);
  border-radius:14px;
  box-shadow:var(--shadow-sm);
  padding:18px;
}
.notes-label{
  font-size:10px;
  font-weight:900;
  letter-spacing:1px;
  color:#888;
  margin-bottom:10px;
  text-transform:uppercase;
}
.notes-textarea{
  width:100%;
  min-height:80px;
  border:2.5px solid var(--ink);
  border-radius:10px;
  padding:12px;
  font-size:14px;
  font-weight:600;
  resize:vertical;
  outline:none;
  font-family:var(--font);
}
.notes-actions{display:flex;gap:8px;margin-top:10px}

/* ========== SHARE PAGE ========== */
.share-page{padding:28px}
.share-grid{
  display:grid;
  grid-template-columns:340px 1fr;
  gap:32px;
  align-items:start;
}
.share-card{
  background:var(--yellow);
  border:var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow-lg);
  padding:24px;
  aspect-ratio:3/4;
  display:flex;
  flex-direction:column;
  position:relative;
  transform:rotate(-1deg);
}
.share-card-specimen{
  background:var(--surface);
  border:2.5px solid var(--ink);
  border-radius:12px;
  height:160px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:16px;
}
.share-card-name{
  font-size:24px;
  font-weight:900;
  text-transform:capitalize;
  margin-bottom:6px;
}
.share-card-cat{margin-bottom:14px}
.share-card-def{
  font-size:13px;
  font-weight:600;
  line-height:1.4;
  margin-bottom:16px;
  flex:1;
}
.share-card-inks{display:flex;gap:8px;margin-bottom:16px}
.share-card-ink{
  width:28px;height:28px;
  border:2.5px solid var(--ink);
  border-radius:50%;
}
.share-card-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-top:2.5px solid var(--ink);
  padding-top:12px;
}
.share-card-num{font-size:12px;font-weight:900}
.share-card-brand{
  background:var(--ink);
  color:var(--yellow);
  padding:3px 10px;
  border-radius:6px;
  font-size:11px;
  font-weight:900;
  letter-spacing:.5px;
}

.share-right h2{
  font-size:32px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:10px;
}
.share-right p{font-size:14px;font-weight:600;color:#555;margin-bottom:24px;line-height:1.5}
.share-actions{display:flex;flex-direction:column;gap:12px;align-items:flex-start}

/* Share modal */
.share-modal{text-align:center}
.share-options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.share-option{
  background:var(--surface);
  border:var(--border);
  border-radius:12px;
  box-shadow:var(--shadow-sm);
  padding:18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  cursor:pointer;
  transition:transform .12s;
}
.share-option:active{transform:scale(.96)}
.share-option-icon{
  width:40px;height:40px;
  background:var(--yellow);
  border:2.5px solid var(--ink);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:900;
}
.share-option-label{font-size:12px;font-weight:900;text-transform:uppercase}

/* ========== REVIEW PAGE ========== */
.review-page{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:calc(860px - 46px - 70px);
  padding:28px;
}
.review-header{
  text-align:center;
  margin-bottom:24px;
}
.review-header h1{
  font-size:32px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:-.5px;
  margin-bottom:10px;
}
.review-progress-text{font-size:14px;font-weight:800;color:#666;margin-bottom:12px}
.review-progress-bar{
  display:flex;
  gap:8px;
  justify-content:center;
}
.progress-pill{
  width:60px;height:8px;
  background:var(--surface);
  border:2.5px solid var(--ink);
  border-radius:999px;
}
.progress-pill.done{background:var(--green)}
.progress-pill.current{background:var(--yellow)}

.review-card{
  width:440px;
  max-width:100%;
  background:var(--surface);
  border:var(--border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);
  padding:28px;
  text-align:center;
}
.review-specimen{
  height:200px;
  background:var(--specimen);
  border:2.5px solid var(--ink);
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:20px;
}
.review-question{
  font-size:18px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:20px;
}
.review-answer{
  display:none;
  text-align:left;
  margin-bottom:20px;
}
.review-answer.show{display:block;animation:pageIn .3s}
.review-answer-name{
  font-size:24px;
  font-weight:900;
  text-transform:capitalize;
  margin-bottom:8px;
}
.review-answer-def{
  font-size:14px;
  font-weight:600;
  line-height:1.5;
  color:#444;
}
.review-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

.review-complete{
  text-align:center;
  display:none;
}
.review-complete.show{display:block;animation:pageIn .3s}
.complete-badge{
  background:var(--green);
  color:var(--ink);
  border:var(--border);
  padding:12px 24px;
  border-radius:12px;
  font-size:22px;
  font-weight:900;
  transform:rotate(-3deg);
  box-shadow:var(--shadow-md);
  display:inline-block;
  margin-bottom:20px;
}
.complete-text{font-size:16px;font-weight:600;margin-bottom:24px;color:#444}

/* ========== STATS PAGE ========== */
.stats-page{padding:28px}
.stats-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:24px;
  gap:16px;
  flex-wrap:wrap;
}
.stats-header h1{
  font-size:38px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:-1px;
}
.streak-display{
  background:var(--yellow);
  border:var(--border);
  padding:8px 16px;
  border-radius:8px;
  font-size:14px;
  font-weight:900;
  transform:rotate(-3deg);
  box-shadow:var(--shadow-sm);
}

.stats-row1{
  display:grid;
  grid-template-columns:1.5fr 1fr 1fr 1fr;
  gap:16px;
  margin-bottom:28px;
}
.stat-card{
  border:var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow-md);
  padding:20px;
  text-align:center;
}
.stat-card.dark{background:var(--ink);color:var(--yellow)}
.stat-card.white{background:var(--surface)}
.stat-card .stat-num{
  font-size:36px;
  font-weight:900;
  line-height:1;
  margin-bottom:6px;
}
.stat-card .stat-label{
  font-size:11px;
  font-weight:900;
  letter-spacing:.5px;
  text-transform:uppercase;
}
.stat-card.due .stat-num{color:var(--coral)}

.stats-row2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:24px;
}
.stats-section{
  background:var(--surface);
  border:var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow-md);
  padding:22px;
}
.stats-section h3{
  font-size:16px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:16px;
  letter-spacing:.3px;
}
.family-bar{margin-bottom:14px}
.family-bar-header{
  display:flex;
  justify-content:space-between;
  margin-bottom:6px;
}
.family-name{font-size:13px;font-weight:900}
.family-count{font-size:12px;font-weight:800;color:#888}
.family-track{
  height:14px;
  background:var(--specimen);
  border:2.5px solid var(--ink);
  border-radius:999px;
  overflow:hidden;
}
.family-fill{
  height:100%;
  border-right:2.5px solid var(--ink);
  transition:width .5s ease-out;
}
.family-fill.NAV{background:var(--coral)}
.family-fill.INPUT{background:var(--blue)}
.family-fill.BOX{background:var(--green)}
.family-fill.FX{background:var(--purple)}

.recent-list{display:flex;flex-direction:column;gap:10px}
.recent-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 14px;
  background:var(--specimen);
  border:2.5px solid var(--ink);
  border-radius:10px;
  cursor:pointer;
  transition:transform .12s;
}
.recent-item:active{transform:scale(.98)}
.recent-name{font-size:14px;font-weight:900;text-transform:capitalize}
.recent-date{font-size:12px;font-weight:700;color:#888}

/* File-it animation */
.filing-animation{
  position:fixed;
  z-index:1500;
  pointer-events:none;
  animation:fileFly .6s ease-in forwards;
}
@keyframes fileFly{
  0%{transform:scale(1) rotate(0);opacity:1}
  100%{transform:scale(.2) translate(400px,-300px) rotate(15deg);opacity:0}
}

/* ========== RESPONSIVE ========== */
@media(max-width:1180px){
  .browser-shell{
    width:100vw;height:100vh;
    max-width:none;max-height:none;
    border-radius:0;border:none;
    box-shadow:none;
    top:0;left:0;
    transform:none;
  }
  body{overflow:auto}
}

@media(max-width:1024px){
  .cards-grid{grid-template-columns:repeat(3,1fr)}
  .result-grid{grid-template-columns:340px 1fr}
  .stats-row1{grid-template-columns:1fr 1fr}
}

@media(max-width:768px){
  .navbar{padding:0 16px;gap:10px;overflow-x:auto}
  .nav-pills{flex-shrink:0}
  .streak-badge,.count-badge{display:none}
  .page{padding:16px}
  .cards-grid{grid-template-columns:repeat(2,1fr)}
  .result-grid,.detail-grid,.share-grid,.stats-row2{grid-template-columns:1fr}
  .share-card{max-width:340px;margin:0 auto}
  .welcome-title{font-size:36px}
  .scan-header h1{font-size:28px}
  .upload-zone{height:280px}
  .review-card{padding:20px}
  .review-specimen{height:160px}
}

@media(max-width:480px){

    </div>
    <div class="browser-url">
      <svg class="browser-url-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93C7.05 19.44 4 16.08 4 12c0-.61.08-1.21.21-1.78L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41C17.93 5.78 20 8.65 20 12c0 2.08-.81 3.98-2.1 5.39z"/></svg>
      <span id="urlDisplay">capdesign.app/welcome</span>
    </div>
  </div>
  <div class="app-container" id="appContainer">
    <div id="app"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ========== DATA ========== */
const PATTERNS = {
  'segmented': {
    id:'segmented', num:'#048', name:'Segmented control', cat:'NAV',
    pron:'seg-MEN-ted con-TROLE', pos:'noun',
    def:'A row of equal buttons where exactly one wins at a time. Best for 2–5 flat views of the same thing — never for actions.',
    inks:['#FFDE59','#141414','#FFFFFF'],
    related:['Tab bar','Toggle switch','Radio group']
  },
  'tabbar': {
    id:'tabbar', num:'#047', name:'Tab bar', cat:'NAV',
    pron:'tab BAR', pos:'noun',
    def:'The app\'s whole map in one strip — three to five destinations, always visible, never scrolling away.',
    inks:['#FF6B6B','#141414','#FFFFFF'],
    related:['Segmented control','Bottom navigation','Hamburger menu']
  },
  'toggle': {
    id:'toggle', num:'#046', name:'Toggle switch', cat:'INPUT',
    pron:'TOG-ul SWISH', pos:'noun',
    def:'An instant on/off for a single setting. If the change doesn\'t take effect immediately, it should be a checkbox instead.',
    inks:['#6BCB77','#141414','#FFFFFF'],
    related:['Checkbox','Radio button','Stepper']
  },
  'search': {
    id:'search', num:'#045', name:'Search field', cat:'INPUT',
    pron:'SERCH FEELD', pos:'noun',
    def:'A pill-shaped prompt for queries. The little magnifier is one of the few icons everyone reads instantly.',
    inks:['#4D96FF','#141414','#FFFFFF'],
    related:['Input field','Filter chip','Autocomplete']
  },
  'bottomsheet': {
    id:'bottomsheet', num:'#044', name:'Bottom sheet', cat:'BOX',
    pron:'BOT-um SHEET', pos:'noun',
    def:'A card that slides up over the screen for a quick sub-task while keeping the parent visible.',
    inks:['#5B5BD6','#FFFFFF','#F4F2EC'],
    related:['Modal','Dialog','Action sheet']
  },
  'stepper': {
    id:'stepper', num:'#043', name:'Stepper', cat:'INPUT',
    pron:'STEP-er', pos:'noun',
    def:'Two buttons joined at the hip for small, precise adjustments — quantities, copies, guests.',
    inks:['#C77DFF','#141414','#FFFFFF'],
    related:['Slider','Number input','Toggle switch']
  }
};

const PATTERN_LIST = Object.values(PATTERNS);
const CANDIDATES = ['segmented','tabbar','toggle','search','bottomsheet','stepper'];

/* ========== STATE ========== */
let state = {
  route:'welcome',
  savedCards:[],          // array of {id, patternId, savedAt, note, reviewDue, mastered, isNew}
  searchQuery:'',
  category:'ALL',
  currentScan:null,       // {imageData, patternId, confidence, status}
  currentCardId:null,
  reviewIndex:0,
  reviewRevealed:false,
  reviewDone:false,
  scanSampleIndex:0,
  fixedResult:false,
};

/* ========== STORAGE ========== */
const STORAGE_KEY='capdesign_data';
function loadData(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      const d=JSON.parse(raw);
      state.savedCards=d.savedCards||[];
      if(d.firstVisit===false) state.route='cards';
    }
  }catch(e){}
}
function saveData(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify({
    savedCards:state.savedCards,
    firstVisit:false,
  }));
}

/* ========== ROUTING ========== */
const ROUTES={
  'welcome':'capdesign.app/welcome',
  'cards':'capdesign.app/cards',
  'scan':'capdesign.app/scan',
  'result':'capdesign.app/scan/result',
  'detail':'capdesign.app/cards/',
  'share':'capdesign.app/cards/',
  'review':'capdesign.app/review',
  'stats':'capdesign.app/stats',
};

function navigate(route,cardId){
  state.route=route;
  if(cardId!==undefined) state.currentCardId=cardId;
  render();
  updateURL();
  document.getElementById('appContainer').scrollTop=0;
}

function updateURL(){
  const el=document.getElementById('urlDisplay');
  let url='capdesign.app/';
  switch(state.route){
    case 'welcome': url='capdesign.app/welcome'; break;
    case 'cards': url='capdesign.app/cards'; break;
    case 'scan': url='capdesign.app/scan'; break;
    case 'result': url='capdesign.app/scan/result'; break;
    case 'detail': url='capdesign.app/cards/'+(state.currentCardId||'segmented'); break;
    case 'share': url='capdesign.app/cards/'+(state.currentCardId||'segmented')+'/share'; break;
    case 'review': url='capdesign.app/review'; break;
    case 'stats': url='capdesign.app/stats'; break;
  }
  el.textContent=url;
}

/* ========== HELPERS ========== */
function $(sel){return document.querySelector(sel)}
function el(tag,cls,html){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(html!==undefined)e.innerHTML=html;
  return e;
}
function toast(msg){
  const root=document.getElementById('toastRoot');
  root.innerHTML='';
  const t=el('div','toast',msg);
  root.appendChild(t);
  setTimeout(()=>{if(t.parentNode)t.remove()},2200);
}
function getCard(id){
  return state.savedCards.find(c=>c.id===id);
}
function getPattern(id){
  return PATTERNS[id];
}
function savedCount(){return state.savedCards.length}
function dueCount(){
  const now=Date.now();
  return state.savedCards.filter(c=>c.reviewDue && c.reviewDue<=now).length;
}
function masteredCount(){return state.savedCards.filter(c=>c.mastered).length}

/* ========== SPECIMEN RENDERER ========== */
function renderSpecimen(patternId,large){
  const lg=large?'specimen-lg':'';
  switch(patternId){
    case 'segmented':
      return `<div class="${lg}"><div class="spec-segmented"><div class="seg active">List</div><div class="seg">Grid</div><div class="seg">Map</div></div></div>`;
    case 'tabbar':
      return `<div class="${lg}"><div class="spec-tabbar"><div class="tab active"><div class="tab-icon"></div><div class="tab-label">Home</div></div><div class="tab"><div class="tab-icon"></div><div class="tab-label">Search</div></div><div class="tab"><div class="tab-icon"></div><div class="tab-label">Profile</div></div></div></div>`;
    case 'toggle':
      return `<div class="${lg}"><div class="spec-toggle"></div></div>`;
    case 'search':
      return `<div class="${lg}"><div class="spec-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span>Search…</span></div></div>`;
    case 'bottomsheet':
      return `<div class="${lg}"><div class="spec-bottomsheet"><div class="sheet-bg"></div><div class="sheet"><div class="sheet-handle"></div><div class="sheet-line"></div><div class="sheet-line short"></div></div></div></div>`;
    case 'stepper':
      return `<div class="${lg}"><div class="spec-stepper"><div class="step-btn">−</div><div class="step-val">2</div><div class="step-btn">+</div></div></div>`;
    default:
      return `<div class="${lg}"></div>`;
  }
}

function renderSpecimenCard(patternId){
  switch(patternId){
    case 'segmented':
      return '<div class="spec-segmented"><div class="seg active">List</div><div class="seg">Grid</div><div class="seg">Map</div></div>';
    case 'tabbar':
      return '<div class="spec-tabbar"><div class="tab active"><div class="tab-icon"></div><div class="tab-label">Home</div></div><div class="tab"><div class="tab-icon"></div><div class="tab-label">Search</div></div><div class="tab"><div class="tab-icon"></div><div class="tab-label">Profile</div></div></div>';
    case 'toggle':
      return '<div class="spec-toggle"></div>';
    case 'search':
      return '<div class="spec-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span>Search…</span></div>';
    case 'bottomsheet':
      return '<div class="spec-bottomsheet"><div class="sheet-bg"></div><div class="sheet"><div class="sheet-handle"></div><div class="sheet-line"></div><div class="sheet-line short"></div></div></div>';
    case 'stepper':
      return '<div class="spec-stepper"><div class="step-btn">−</div><div class="step-val">2</div><div class="step-btn">+</div></div>';
    default:return '';
  }
}

/* ========== NAVBAR ========== */
function renderNavbar(){
  if(state.route==='welcome')return '';
  const isScan=state.route==='scan'||state.route==='result';
  return `
    <nav class="navbar">
      <div class="logo" onclick="navigate('cards')" style="cursor:pointer">
        <div class="logo-squares">
          <div class="logo-sq y"></div>
          <div class="logo-sq c"></div>
        </div>
        <div class="logo-text">CAPDESIGN</div>
      </div>
      <div class="nav-pills">
        <button class="nav-pill ${state.route==='cards'||state.route==='detail'||state.route==='share'?'active':''}" onclick="navigate('cards')">CARDS</button>
        <button class="nav-pill ${state.route==='review'?'active':''}" onclick="navigate('review')">REVIEW</button>
        <button class="nav-pill ${state.route==='stats'?'active':''}" onclick="navigate('stats')">STATS</button>
      </div>
      <div class="nav-spacer"></div>
      <button class="scan-btn ${isScan?'scanning':''}" onclick="navigate('scan')">
        <div class="scan-icon"></div>
        SCAN A SHOT
      </button>
      <div class="streak-badge">6 DAY STREAK!</div>
      <div class="count-badge">×${savedCount()}</div>
    </nav>
  `;
}

/* ========== WELCOME PAGE ========== */
function renderWelcome(){
  return `
    <div class="welcome-page">
      <div class="welcome-badge">CAPDESIGN</div>
      <h1 class="welcome-title">CATCH THE DESIGNS ALL AROUND YOU</h1>
      <p class="welcome-desc">See an interface you can't name? Drop in a screenshot — CapDesign tells you what it's called, what it's for, and files it in your library.</p>
      <div class="welcome-steps">
        <div class="step-card">
          <div class="step-num">1</div>
          <div class="step-visual">
            <div class="scan-area-demo">
              <div class="scan-line-demo"></div>
            </div>
          </div>
          <div class="step-title">DROP A SCREENSHOT</div>
          <div class="step-desc">Any interface — app, site, dashboard.</div>
        </div>
        <div class="step-card">
          <div class="step-num">2</div>
          <div class="step-visual">
            <div class="demo-segmented">
              <div class="seg active">List</div>
              <div class="seg">Grid</div>
            </div>
          </div>
          <div class="step-title">LEARN ITS REAL NAME</div>
          <div class="step-desc">The proper term, what it's for, its inks.</div>
        </div>
        <div class="step-card">
          <div class="step-num">3</div>
          <div class="step-visual">
            <div class="demo-mini-cards">
              <div class="demo-mini-card"></div>
              <div class="demo-mini-card"></div>
              <div class="demo-mini-card"></div>
              <div class="demo-mini-card"></div>
            </div>
          </div>
          <div class="step-title">KEEP WHAT YOU CATCH</div>
          <div class="step-desc">Filed by family in your library.</div>
        </div>
      </div>
      <div class="welcome-ctas">
        <button class="btn btn-dark btn-lg" onclick="navigate('scan')">SCAN MY FIRST SHOT</button>
        <button class="btn btn-yellow btn-lg" onclick="navigate('cards')">BROWSE THE LIBRARY</button>
      </div>
    </div>
  `;
}

/* ========== CARDS / LIBRARY PAGE ========== */
function renderCards(){
  const due=dueCount();
  let cards=[...state.savedCards].sort((a,b)=>b.savedAt-a.savedAt);
  
  // Filter by category
  if(state.category!=='ALL'){
    cards=cards.filter(c=>getPattern(c.patternId).cat===state.category);
  }
  // Filter by search
  if(state.searchQuery){
    const q=state.searchQuery.toLowerCase();
    cards=cards.filter(c=>{
      const p=getPattern(c.patternId);
      return p.name.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q);
    });
  }

  let cardsHTML='';
  if(cards.length===0){
    const hasCards=savedCount()>0;
    cardsHTML=`
      <div class="empty-state">
        <h3>${hasCards?'NO MATCHES':'NO CARDS YET'}</h3>
        <p>${hasCards?'Try a different search or category.':'Scan a screenshot to catch your first pattern.'}</p>
        <button class="btn btn-yellow" onclick="navigate('scan')">SCAN A SHOT</button>
      </div>
    `;
  }else{
    cardsHTML=cards.map((c,i)=>{
      const p=getPattern(c.patternId);
      const showNew=c.isNew;
      return `
        <div class="pattern-card ${showNew?'new-card':''}" onclick="navigate('detail','${c.id}')">
          ${showNew?'<div class="new-sticker">NEW!</div>':''}
          <div class="card-specimen">${renderSpecimenCard(c.patternId)}</div>
          <div class="card-body">
            <div class="card-name">${p.name}</div>
            <div class="card-footer">
              <div class="cat-badge ${p.cat}">${p.cat}</div>
              <div class="card-number">${p.num}</div>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  return `
    <div class="page">
      <div class="cards-header">
        <div class="cards-title-block">
          <h1>YOUR CARDS</h1>
          <p>${savedCount()} patterns caught · filed by family</p>
        </div>
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" placeholder="find a pattern…" value="${state.searchQuery}" oninput="onSearch(this.value)">
        </div>
      </div>
      <div class="category-bar">
        ${['ALL','NAV','INPUT','BOX','FX'].map(cat=>`
          <button class="cat-pill ${state.category===cat?'active':''}" onclick="setCategory('${cat}')">${cat}</button>
        `).join('')}
      </div>
      ${due>0?`
        <div class="review-banner" onclick="navigate('review')" style="cursor:pointer">
          <div class="review-banner-badge">${due} DUE</div>
          <div class="review-banner-text">${due===1?'One card is':due+' cards are'} ready for review — keep the names sharp.</div>
          <div class="review-banner-arrow">→</div>
        </div>
      `:''}
      <div class="cards-grid">${cardsHTML}</div>
    </div>
  `;
}

function onSearch(val){
  state.searchQuery=val;
  // Re-render only the grid area
  const grid=document.querySelector('.cards-grid');
  if(grid){
    // re-render full page to update empty state too
    render();
    // Restore focus
    const input=document.querySelector('.search-box input');
    if(input){input.focus();input.setSelectionRange(val.length,val.length)}
  }
}

function setCategory(cat){
  state.category=cat;
  render();
}

/* ========== SCAN PAGE ========== */
function renderScan(){
  return `
    <div class="page scan-page">
      <div class="scan-header">
        <h1>DROP IN A SCREENSHOT</h1>
        <p>Spotted an interface you can't name? Drop a screenshot below — CapDesign reads the pixels and tells you what it is.</p>
      </div>
      <div class="upload-zone" id="uploadZone" onclick="triggerFileInput()">
        <div class="scan-corner tl"></div>
        <div class="scan-corner tr"></div>
        <div class="scan-corner bl"></div>
        <div class="scan-corner br"></div>
        <div class="upload-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 16V4M12 4l-5 5M12 4l5 5M5 20h14"/></svg>
        </div>
        <div class="upload-main-text">Drop it right here</div>
        <div class="upload-sub-text">click to browse · or paste from clipboard</div>
        <div class="upload-format">PNG · JPG · up to 20MB</div>
      </div>
      <div class="sample-link">
        <button onclick="trySample()">try a sample</button>
      </div>
      <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFileSelect(event)">
    </div>
  `;
}

function triggerFileInput(){
  const zone=document.getElementById('uploadZone');
  if(zone&&(zone.classList.contains('has-image')||zone.querySelector('.scanning-overlay')||zone.querySelector('.scan-fail')))return;
  document.getElementById('fileInput').click();
}

function handleFileSelect(e){
  const file=e.target.files[0];
  if(file)processFile(file);
}

function processFile(file){
  if(!file.type.startsWith('image/')){
    toast('NOT AN IMAGE — TRY AGAIN');
    return;
  }
  const reader=new FileReader();
  reader.onload=(e)=>{
    startScan(e.target.result);
  };
  reader.readAsDataURL(file);
}

function setupDragDrop(){
  setTimeout(()=>{
    const zone=document.getElementById('uploadZone');
    if(!zone)return;
    zone.addEventListener('dragover',(e)=>{
      e.preventDefault();
      zone.classList.add('dragover');
    });
    zone.addEventListener('dragleave',()=>{
      zone.classList.remove('dragover');
    });
    zone.addEventListener('drop',(e)=>{
      e.preventDefault();
      zone.classList.remove('dragover');
      const file=e.dataTransfer.files[0];
      if(file)processFile(file);
    });
  },50);
}

function setupPaste(){
  document.addEventListener('paste',(e)=>{
    if(state.route!=='scan')return;
    const items=e.clipboardData.items;
    for(let item of items){
      if(item.type.startsWith('image/')){
        const file=item.getAsFile();
        if(file)processFile(file);
        break;
      }
    }
  });
}

function trySample(){
  const results=['success','lowconf','fail'];
  const resultType=results[state.scanSampleIndex%3];
  state.scanSampleIndex++;
  
  // Use a CSS-rendered sample as the "image"
  startScan(null,resultType);
}

function startScan(imageData,forcedResult){
  const zone=document.getElementById('uploadZone');
  if(!zone)return;
  
  // Show image preview if we have one
  let previewHTML='';
  if(imageData){
    zone.classList.add('has-image');
    zone.innerHTML=`<img class="upload-preview" src="${imageData}">`;
  }
  
  // Show scanning overlay
  const overlay=el('div','scanning-overlay');
  overlay.innerHTML=`
    <div class="scan-line"></div>
    <div class="scan-status" id="scanStatus">READING THE PIXELS…</div>
    <div class="scan-progress-bar"><div class="scan-progress-fill" id="progressFill"></div></div>
  `;
  zone.appendChild(overlay);
  
  const statuses=['READING THE PIXELS…','MATCHING PATTERNS…','ALMOST GOT IT…'];
  let step=0;
  const statusEl=overlay.querySelector('#scanStatus');
  const fillEl=overlay.querySelector('#progressFill');
  
  const interval=setInterval(()=>{
    step++;
    if(step<3){
      statusEl.textContent=statuses[step];
      fillEl.style.width=((step+1)/3*100)+'%';
    }
  },500);
  
  setTimeout(()=>{
    clearInterval(interval);
    fillEl.style.width='100%';
    
    // Determine result
    let resultType=forcedResult;
    if(!resultType){
      // Random for real uploads: 70% success, 20% lowconf, 10% fail
      const r=Math.random();
      resultType=r<0.7?'success':r<0.9?'lowconf':'fail';
    }
    
    if(resultType==='fail'){
      showScanFail(zone,imageData);
    }else{
      // Pick a pattern
      const patternId=CANDIDATES[Math.floor(Math.random()*CANDIDATES.length)];
      const confidence=resultType==='success'?0.98:0.62;
      state.currentScan={
        imageData:imageData,
        patternId:patternId,
        confidence:confidence,
        status:resultType,
      };
      state.fixedResult=false;
      navigate('result');
    }
  },1600);
}

function showScanFail(zone,imageData){
  zone.innerHTML=`
    <img class="upload-preview" src="${imageData||''}" style="${imageData?'':'display:none'}">
    <div class="scan-fail">
      <div class="fail-badge">NO CATCH!</div>
      <div class="fail-text">Couldn't isolate a single pattern. Try cropping tighter to one UI element — less noise, more signal.</div>
      <div class="fail-actions">
        <button class="btn btn-dark" onclick="navigate('scan')">TRY ANOTHER SHOT</button>
        <button class="btn btn-white" onclick="navigate('cards')">browse my cards instead</button>
      </div>
    </div>
  `;
}

/* ========== RESULT PAGE ========== */
function renderResult(){
  if(!state.currentScan){
    return '<div class="page"><p>No scan in progress. <button class="btn btn-yellow" onclick="navigate(\'scan\')">SCAN A SHOT</button></p></div>';
  }
  const scan=state.currentScan;
  const p=getPattern(scan.patternId);
  const confPct=Math.round(scan.confidence*100);
  const isLow=scan.status==='lowconf';
  const isFixed=state.fixedResult;
  
  let sticker='';
  if(isFixed)sticker='<div class="polaroid-sticker fixed">FIXED!</div>';
  else if(isLow)sticker='<div class="polaroid-sticker hmm">HMM…</div>';
  else sticker='<div class="polaroid-sticker">NEW!</div>';
  
  return `
    <div class="page result-page">
      <div class="result-header">
        <h1>FRESH CATCH · SPECIMEN ${p.num}</h1>
        <div class="match-badge">${confPct}% MATCH</div>
      </div>
      <div class="result-grid">
        <div class="polaroid-card">
          ${sticker}
          <div class="polaroid-image">
            ${scan.imageData?`<img src="${scan.imageData}">`:`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center">${renderSpecimenCard(scan.patternId)}</div>`}
          </div>
          <div class="polaroid-label">YOUR UPLOAD</div>
        </div>
        <div class="result-info">
          <h2>${p.name}</h2>
          <div class="result-meta">
            <div class="cat-badge ${p.cat}">${p.cat}</div>
            <div class="pronunciation">/${p.pron}/</div>
            <div class="noun-tag">${p.pos}</div>
          </div>
          <div class="def-card">
            <div class="def-label">DEFINITION</div>
            <div class="def-text">${p.def}</div>
          </div>
          <div class="inks-section">
            <div class="def-label" style="margin-bottom:10px">INKS FOUND</div>
            <div class="inks-row">
              ${p.inks.map(c=>`<div class="ink-dot" style="background:${c}"></div>`).join('')}
            </div>
          </div>
          <div class="result-actions">
            <button class="btn btn-dark btn-lg" onclick="fileCard()">FILE IT → ${p.cat}</button>
            <button class="not-it-link" onclick="openNotItModal()">NOT IT?</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function openNotItModal(){
  const scan=state.currentScan;
  if(!scan)return;
  const current=scan.patternId;
  // Get 3 candidates that aren't current
  const others=CANDIDATES.filter(id=>id!==current);
  const picks=others.sort(()=>Math.random()-0.5).slice(0,3);
  
  const root=document.getElementById('modalRoot');
  root.innerHTML=`
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <h3>WHAT IS IT, THEN?</h3>
        <div class="candidate-list">
          ${picks.map(id=>{
            const p=getPattern(id);
            const pct=Math.floor(50+Math.random()*40);
            return `
              <div class="candidate-card" onclick="selectCandidate('${id}')">
                <div class="candidate-name">${p.name}</div>
                <div class="candidate-match">${pct}%</div>
              </div>
            `;
          }).join('')}
        </div>
        <div class="modal-actions">
          <button class="btn btn-white" onclick="closeModal()">CANCEL</button>
        </div>
      </div>
    </div>
  `;
}

function selectCandidate(patternId){
  state.currentScan.patternId=patternId;
  state.currentScan.confidence=0.85;
  state.fixedResult=true;
  closeModal();
  render();
  toast('YOU FIXED IT');
}

function closeModal(e){
  if(e&&e.target!==e.currentTarget)return;
  document.getElementById('modalRoot').innerHTML='';
}

function fileCard(){
  const scan=state.currentScan;
  if(!scan)return;
  const p=getPattern(scan.patternId);
  
  // Create fly animation
  const flyEl=el('div','filing-animation');
  flyEl.style.cssText=`
    top:50%;left:50%;
    width:200px;height:120px;
    background:var(--surface);
    border:var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow-md);
    display:flex;
    align-items:center;
    justify-content:center;
    transform:translate(-50%,-50%);
  `;
  flyEl.innerHTML=renderSpecimenCard(scan.patternId);
  document.body.appendChild(flyEl);
  
  setTimeout(()=>{
    flyEl.remove();
    // Save card
    const cardId='card_'+Date.now();
    state.savedCards.push({
      id:cardId,
      patternId:scan.patternId,
      savedAt:Date.now(),
      note:'',
      reviewDue:Date.now()+3*86400000, // 3 days
      mastered:false,
      isNew:true,
    });
    // Remove isNew from previous cards
    state.savedCards.forEach(c=>{
      if(c.id!==cardId)c.isNew=false;
    });
    saveData();
    state.currentScan=null;
    navigate('cards');
    toast('FILED IN '+p.cat);
  },600);
}

/* ========== CARD DETAIL PAGE ========== */
function renderDetail(){
  const card=getCard(state.currentCardId);
  if(!card){
    return '<div class="page"><p>Card not found. <button class="btn btn-yellow" onclick="navigate(\'cards\')">BACK TO CARDS</button></p></div>';
  }
  const p=getPattern(card.patternId);
  const reviewDate=new Date(card.reviewDue);
  const reviewText=reviewDate<=new Date()?'DUE NOW':`NEXT REVIEW · ${reviewDate.toLocaleDateString('en-US',{weekday:'long'}).toUpperCase()}`;
  
  return `
    <div class="page detail-page">
      <div class="detail-header">
        <button class="back-link" onclick="navigate('cards')">‹ ALL CARDS</button>
        <div class="detail-number">${p.num}</div>
        <button class="btn btn-white" onclick="navigate('share','${card.id}')">SHARE CARD</button>
      </div>
      <div class="detail-grid">
        <div class="detail-left">
          <div class="detail-specimen-card">
            <div class="learning-badge">LEARNING</div>
            ${renderSpecimen(p.id,true)}
            <div class="also-spotted">
              <div class="also-spotted-label">ALSO SPOTTED IN</div>
              <div class="spotted-row">
                <div class="spotted-thumb">${renderSpecimenCard('search')}</div>
                <div class="spotted-thumb">${renderSpecimenCard('stepper')}</div>
                <div class="spotted-more">+3 MORE</div>
              </div>
            </div>
          </div>
        </div>
        <div class="detail-right">
          <div class="detail-title-row">
            <h2>${p.name}</h2>
            <div class="cat-badge ${p.cat}">${p.cat}</div>
          </div>
          <div class="pronunciation">/${p.pron}/ · ${p.pos}</div>
          <div class="review-info">${reviewText}</div>
          <div class="def-card">
            <div class="def-label">DEFINITION</div>
            <div class="def-text">${p.def}</div>
          </div>
          <div class="inks-section">
            <div class="def-label" style="margin-bottom:10px">INKS</div>
            <div class="inks-row">
              ${p.inks.map(c=>`<div class="ink-dot" style="background:${c}"></div>`).join('')}
            </div>
          </div>
          <div>
            <div class="def-label" style="margin-bottom:10px">RELATED</div>
            <div class="related-tags">
              ${p.related.map(r=>`<div class="related-tag" onclick="toast('${r} — not in library yet')">${r}</div>`).join('')}
            </div>
          </div>
          <div class="notes-section">
            <div class="notes-label">YOUR NOTE</div>
            <textarea class="notes-textarea" id="noteArea" placeholder="Add a thought about this pattern…" oninput="updateNote(this.value)">${card.note||''}</textarea>
            <div class="notes-actions">
              <button class="btn btn-dark" onclick="saveNote()">SAVE NOTE</button>
              <button class="btn btn-white" onclick="document.getElementById('noteArea').value='';updateNote('')">CLEAR</button>
            </div>
          </div>
          <button class="btn btn-coral" onclick="confirmRelease()">RELEASE THIS CARD →</button>
        </div>
      </div>
    </div>
  `;
}

function updateNote(val){
  const card=getCard(state.currentCardId);
  if(card)card.note=val;
}

function saveNote(){
  const card=getCard(state.currentCardId);
  if(card){
    saveData();
    toast('NOTE SAVED');
  }
}

function confirmRelease(){
  const card=getCard(state.currentCardId);
  if(!card)return;
  const p=getPattern(card.patternId);
  const root=document.getElementById('modalRoot');
  root.innerHTML=`
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal delete-modal" onclick="event.stopPropagation()">
        <div class="modal-icon">!</div>
        <h3>RELEASE ${p.name.toUpperCase()}?</h3>
        <p style="font-size:14px;font-weight:600;color:#555;margin-bottom:20px;line-height:1.5">It goes back into the wild. Your note goes with it.</p>
        <div class="modal-actions">
          <button class="btn btn-coral" onclick="releaseCard()">RELEASE IT</button>
          <button class="btn btn-white" onclick="closeModal()">keep it</button>
        </div>
      </div>
    </div>
  `;
}

function releaseCard(){
  state.savedCards=state.savedCards.filter(c=>c.id!==state.currentCardId);
  saveData();
  closeModal();
  navigate('cards');
  toast('CARD RELEASED');
}

/* ========== SHARE PAGE ========== */
function renderShare(){
  const card=getCard(state.currentCardId);
  if(!card){
    return '<div class="page"><p>Card not found. <button class="btn btn-yellow" onclick="navigate(\'cards\')">BACK TO CARDS</button></p></div>';
  }
  const p=getPattern(card.patternId);
  const date=new Date(card.savedAt).toLocaleDateString('en-US',{month:'short',day:'numeric'});
  
  return `
    <div class="page share-page">
      <div class="share-grid">
        <div class="share-card" id="shareCard">
          <div class="share-card-specimen">${renderSpecimenCard(p.id)}</div>
          <div class="share-card-name">${p.name}</div>
          <div class="share-card-cat"><div class="cat-badge ${p.cat}">${p.cat}</div></div>
          <div class="share-card-def">${p.def}</div>
          <div class="share-card-inks">
            ${p.inks.map(c=>`<div class="share-card-ink" style="background:${c}"></div>`).join('')}
          </div>
          <div class="share-card-footer">
            <div class="share-card-num">${p.num} · ${date.toUpperCase()}</div>
            <div class="share-card-brand">CAPDESIGN</div>
          </div>
        </div>
        <div class="share-right">
          <h2>SHARE YOUR CATCH</h2>
          <p>Send this pattern card to a teammate, post it to your design channel, or download it for your collection.</p>
          <div class="share-actions">
            <button class="btn btn-dark btn-lg" onclick="openShareModal()">SHARE IT</button>
            <button class="btn btn-white" onclick="copyLink()">or copy link</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function copyLink(){
  const url='capdesign.app/cards/'+state.currentCardId;
  navigator.clipboard?.writeText(url).catch(()=>{});
  toast('LINK COPIED');
}

function openShareModal(){
  const root=document.getElementById('modalRoot');
  root.innerHTML=`
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal share-modal" onclick="event.stopPropagation()">
        <h3>SHARE IT</h3>
        <div class="share-options">
          <div class="share-option" onclick="shareAction('copy')">
            <div class="share-option-icon">L</div>
            <div class="share-option-label">COPY LINK</div>
          </div>
          <div class="share-option" onclick="shareAction('download')">
            <div class="share-option-icon">D</div>
            <div class="share-option-label">DOWNLOAD</div>
          </div>
          <div class="share-option" onclick="shareAction('post')">
            <div class="share-option-icon">P</div>
            <div class="share-option-label">POST</div>
          </div>
          <div class="share-option" onclick="shareAction('more')">
            <div class="share-option-icon">+</div>
            <div class="share-option-label">MORE</div>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-white" onclick="closeModal()">CLOSE</button>
        </div>
      </div>
    </div>
  `;
}

function shareAction(action){
  const card=getCard(state.currentCardId);
  if(!card)return;
  const p=getPattern(card.patternId);
  
  switch(action){
    case 'copy':
      navigator.clipboard?.writeText('capdesign.app/cards/'+card.id).catch(()=>{});
      toast('LINK COPIED');
      break;
    case 'download':
      downloadShareCard(p,card);
      toast('DOWNLOADING…');
      break;
    case 'post':
      toast('POSTED TO YOUR FEED');
      break;
    case 'more':
      toast('OPENING SHARE SHEET…');
      break;
  }
  closeModal();
}

function downloadShareCard(p,card){
  const date=new Date(card.savedAt).toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const svg=`
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <rect width="600" height="800" fill="#FFDE59" stroke="#141414" stroke-width="3" rx="24"/>
  <rect x="40" y="40" width="520" height="240" fill="#FFFFFF" stroke="#141414" stroke-width="3" rx="16"/>
  <text x="300" y="170" text-anchor="middle" font-family="Arial Black,Helvetica,sans-serif" font-size="20" font-weight="900">${p.name}</text>
  <rect x="40" y="310" width="120" height="32" fill="${p.cat==='NAV'?'#FF6B6B':p.cat==='INPUT'?'#4D96FF':p.cat==='BOX'?'#6BCB77':'#C77DFF'}" stroke="#141414" stroke-width="2.5" rx="999"/>
  <text x="100" y="331" text-anchor="middle" font-family="Arial Black" font-size="12" font-weight="900">${p.cat}</text>
  <text x="40" y="390" font-family="Helvetica" font-size="14" font-weight="600">
    <tspan x="40" dy="0">${p.def.substring(0,60)}</tspan>
    <tspan x="40" dy="20">${p.def.substring(60,120)}</tspan>
    <tspan x="40" dy="20">${p.def.substring(120,180)}</tspan>
  </text>
  <circle cx="60" cy="480" r="22" fill="${p.inks[0]}" stroke="#141414" stroke-width="2.5"/>
  <circle cx="110" cy="480" r="22" fill="${p.inks[1]}" stroke="#141414" stroke-width="2.5"/>
  <circle cx="160" cy="480" r="22" fill="${p.inks[2]}" stroke="#141414" stroke-width="2.5"/>
  <line x1="40" y1="720" x2="560" y2="720" stroke="#141414" stroke-width="2.5"/>
  <text x="40" y="750" font-family="Arial Black" font-size="14" font-weight="900">${p.num} · ${date.toUpperCase()}</text>
  <rect x="440" y="730" width="120" height="28" fill="#141414" rx="6"/>
  <text x="500" y="749" text-anchor="middle" font-family="Arial Black" font-size="12" font-weight="900" fill="#FFDE59">CAPDESIGN</text>
</svg>`;
  const blob=new Blob([svg],{type:'image/svg+xml'});
