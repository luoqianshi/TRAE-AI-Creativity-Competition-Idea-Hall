}

/* ========== REVIEW PAGE ========== */
function renderReview(){
  const dueCards=state.savedCards.filter(c=>c.reviewDue && c.reviewDue<=Date.now());
  const queue=dueCards.length>0?dueCards:state.savedCards.slice(0,3);
  
  if(queue.length===0){
    return `
      <div class="page review-page">
        <div class="review-header">
          <h1>REVIEW SESSION</h1>
        </div>
        <div class="review-card">
          <p style="font-size:16px;font-weight:600;margin-bottom:20px">No cards to review right now. Scan some screenshots to build your library!</p>
          <button class="btn btn-yellow" onclick="navigate('scan')">SCAN A SHOT</button>
        </div>
      </div>
    `;
  }
  
  if(state.reviewDone){
    return `
      <div class="page review-page">
        <div class="review-complete show">
          <div class="complete-badge">ALL CAUGHT UP!</div>
          <div class="complete-text">Nice work — these ${queue.length} come back in 3 days.</div>
          <button class="btn btn-dark btn-lg" onclick="finishReview()">BACK TO CARDS</button>
        </div>
      </div>
    `;
  }
  
  const current=queue[Math.min(state.reviewIndex,queue.length-1)];
  const p=getPattern(current.patternId);
  const total=queue.length;
  const idx=state.reviewIndex+1;
  
  return `
    <div class="page review-page">
      <div class="review-header">
        <h1>REVIEW SESSION</h1>
        <div class="review-progress-text">${idx}/${total}</div>
        <div class="review-progress-bar">
          ${queue.map((_,i)=>{
            const cls=i<state.reviewIndex?'done':i===state.reviewIndex?'current':'';
            return `<div class="progress-pill ${cls}"></div>`;
          }).join('')}
        </div>
      </div>
      <div class="review-card">
        <div class="review-specimen">${renderSpecimenCard(p.id)}</div>
        <div class="review-question">WHAT'S THIS ONE CALLED?</div>
        <div class="review-answer ${state.reviewRevealed?'show':''}">
          <div class="review-answer-name">${p.name}</div>
          <div class="review-answer-def">${p.def}</div>
        </div>
        <div class="review-actions">
          ${state.reviewRevealed?`
            <button class="btn btn-white" onclick="reviewAnswer('again')">AGAIN</button>
            <button class="btn btn-green" onclick="reviewAnswer('gotit')">GOT IT!</button>
          `:`
            <button class="btn btn-dark btn-lg" onclick="revealReview()">REVEAL ANSWER</button>
            <button class="not-it-link" onclick="reviewAnswer('skip')">skip — resurface later</button>
          `}
        </div>
      </div>
    </div>
  `;
}

function revealReview(){
  state.reviewRevealed=true;
  render();
}

function reviewAnswer(action){
  const dueCards=state.savedCards.filter(c=>c.reviewDue && c.reviewDue<=Date.now());
  const queue=dueCards.length>0?dueCards:state.savedCards.slice(0,3);
  const current=queue[state.reviewIndex];
  
  if(current){
    if(action==='gotit'){
      current.reviewDue=Date.now()+3*86400000;
      current.mastered=true;
    }else if(action==='again'){
      current.reviewDue=Date.now()+3600000; // 1 hour
    }
    // skip: leave reviewDue as is
    saveData();
  }
  
  state.reviewIndex++;
  state.reviewRevealed=false;
  
  if(state.reviewIndex>=queue.length){
    state.reviewDone=true;
  }
  render();
}

function finishReview(){
  state.reviewIndex=0;
  state.reviewRevealed=false;
  state.reviewDone=false;
  navigate('cards');
}

/* ========== STATS PAGE ========== */
function renderStats(){
  const total=savedCount();
  const mastered=masteredCount();
  const due=dueCount();
  const families=['NAV','INPUT','BOX','FX'];
  const familyCounts=families.map(f=>{
    const count=state.savedCards.filter(c=>getPattern(c.patternId).cat===f).length;
    return {family:f,count};
  });
  const maxCount=Math.max(...familyCounts.map(f=>f.count),1);
  
  const recent=[...state.savedCards].sort((a,b)=>b.savedAt-a.savedAt).slice(0,5);
  
  return `
    <div class="page stats-page">
      <div class="stats-header">
        <h1>YOUR COLLECTION</h1>
        <div class="streak-display">6 DAY STREAK!</div>
      </div>
      <div class="stats-row1">
        <div class="stat-card dark">
          <div class="stat-num">${total}</div>
          <div class="stat-label">CARDS COLLECTED</div>
        </div>
        <div class="stat-card white">
          <div class="stat-num">${mastered}</div>
          <div class="stat-label">MASTERED</div>
        </div>
        <div class="stat-card white due">
          <div class="stat-num">${due}</div>
          <div class="stat-label">DUE TODAY</div>
        </div>
        <div class="stat-card white">
          <div class="stat-num">${families.length}</div>
          <div class="stat-label">FAMILIES</div>
        </div>
      </div>
      <div class="stats-row2">
        <div class="stats-section">
          <h3>BY FAMILY</h3>
          ${familyCounts.map(fc=>`
            <div class="family-bar">
              <div class="family-bar-header">
                <div class="family-name">${fc.family}</div>
                <div class="family-count">${fc.count}</div>
              </div>
              <div class="family-track">
                <div class="family-fill ${fc.family}" style="width:${(fc.count/maxCount*100)}%"></div>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="stats-section">
          <h3>RECENTLY LEARNED</h3>
          <div class="recent-list">
            ${recent.length===0?'<div style="font-size:14px;color:#888;padding:20px;text-align:center">No cards yet.</div>':recent.map(c=>{
              const p=getPattern(c.patternId);
              const date=new Date(c.savedAt).toLocaleDateString('en-US',{month:'short',day:'numeric'});
              return `<div class="recent-item" onclick="navigate('detail','${c.id}')">
                <div class="recent-name">${p.name}</div>
                <div class="recent-date">${date}</div>
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>
      ${due>0?`
        <div class="review-banner" onclick="navigate('review')" style="cursor:pointer;margin-top:24px">
          <div class="review-banner-badge">${due} DUE</div>
          <div class="review-banner-text">${due===1?'One card is':due+' cards are'} ready for review — keep the names sharp.</div>
          <div class="review-banner-arrow">→</div>
        </div>
      `:''}
    </div>
  `;
}

/* ========== MAIN RENDER ========== */
function render(){
  const app=document.getElementById('app');
  let content='';
  switch(state.route){
    case 'welcome':content=renderWelcome();break;
    case 'cards':content=renderCards();break;
    case 'scan':content=renderScan();break;
    case 'result':content=renderResult();break;
    case 'detail':content=renderDetail();break;
    case 'share':content=renderShare();break;
    case 'review':content=renderReview();break;
    case 'stats':content=renderStats();break;
    default:content=renderWelcome();
  }
  app.innerHTML=renderNavbar()+content;
  
  // Setup page-specific handlers
  if(state.route==='scan'){
    setupDragDrop();
  }
}

/* ========== INIT ========== */
function init(){
  loadData();
  
  // Seed sample cards if first visit
  if(state.savedCards.length===0 && !localStorage.getItem(STORAGE_KEY)){
    const now=Date.now();
    state.savedCards=[
      {id:'card_048',patternId:'segmented',savedAt:now-86400000,note:'',reviewDue:now+2*86400000,mastered:false,isNew:false},
      {id:'card_047',patternId:'tabbar',savedAt:now-2*86400000,note:'',reviewDue:now-3600000,mastered:false,isNew:false},
      {id:'card_046',patternId:'toggle',savedAt:now-3*86400000,note:'',reviewDue:now-7200000,mastered:true,isNew:false},
      {id:'card_045',patternId:'search',savedAt:now-4*86400000,note:'',reviewDue:now+5*86400000,mastered:false,isNew:false},
      {id:'card_044',patternId:'bottomsheet',savedAt:now-5*86400000,note:'',reviewDue:now+86400000,mastered:false,isNew:false},
      {id:'card_043',patternId:'stepper',savedAt:now-6*86400000,note:'',reviewDue:now-10800000,mastered:false,isNew:false},
    ];
    saveData();
  }
  
  setupPaste();
  render();
  updateURL();
}

init();
</script>
