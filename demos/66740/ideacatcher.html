<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵感碎片捕手 - IdeaCatcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0a1a;
            --bg-card: #1a1a2e;
            --bg-input: #16213e;
            --accent-purple: #9d4edd;
            --accent-blue: #4cc9f0;
            --accent-pink: #f72585;
            --accent-green: #43e97b;
            --accent-orange: #fa709a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            opacity: 0.6;
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: 0.2;
            }
            50% {
                opacity: 0.8;
            }
            25% {
                transform: translateY(-50px) translateX(20px);
            }
            75% {
                transform: translateY(50px) translateX(-20px);
            }
        }

        .capture-effect {
            position: fixed;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--accent-purple);
            animation: capture 0.8s ease-out forwards;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes capture {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            50% {
                transform: scale(1.5);
                opacity: 0.5;
            }
            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .input-section {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(157, 78, 221, 0.15);
            margin-bottom: 40px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .input-section:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 50px rgba(157, 78, 221, 0.2);
        }

        .input-wrapper {
            position: relative;
        }

        #idea-input {
            width: 100%;
            height: 120px;
            background: var(--bg-input);
            border: 2px solid rgba(157, 78, 221, 0.3);
            border-radius: 15px;
            padding: 20px 60px 20px 20px;
            color: var(--text-primary);
            font-size: 1.1rem;
            resize: none;
            outline: none;
            transition: border-color 0.3s ease;
        }

        #idea-input:focus {
            border-color: var(--accent-purple);
        }

        #idea-input::placeholder {
            color: var(--text-secondary);
        }

        .input-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(157, 78, 221, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--accent-blue);
            color: var(--accent-blue);
        }

        .btn-secondary:hover {
            background: rgba(76, 201, 240, 0.1);
        }

        .btn-recording {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(247, 37, 133, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(247, 37, 133, 0);
            }
        }

        .filter-section {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tag-btn {
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            background: var(--bg-card);
            color: var(--text-secondary);
        }

        .tag-btn.active {
            color: white;
            border-color: currentColor;
        }

        .tag-btn[data-tag="工作"] { color: var(--accent-blue); }
        .tag-btn[data-tag="学习"] { color: var(--accent-green); }
        .tag-btn[data-tag="创意"] { color: var(--accent-purple); }
        .tag-btn[data-tag="生活"] { color: var(--accent-orange); }
        .tag-btn[data-tag="技术"] { color: var(--accent-pink); }
        .tag-btn[data-tag="未分类"] { color: var(--text-secondary); }

        .tag-btn:hover {
            transform: translateY(-1px);
        }

        .ideas-grid {
            display: grid;
            gap: 20px;
        }

        .idea-card {
            background: var(--bg-card);
            border-radius: 15px;
            padding: 25px;
            border-left: 4px solid var(--accent-purple);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .idea-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .idea-card.work { border-left-color: var(--accent-blue); }
        .idea-card.study { border-left-color: var(--accent-green); }
        .idea-card.creative { border-left-color: var(--accent-purple); }
        .idea-card.life { border-left-color: var(--accent-orange); }
        .idea-card.tech { border-left-color: var(--accent-pink); }
        .idea-card.uncategorized { border-left-color: #666; }

        .idea-content {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 15px;
            color: var(--text-primary);
        }

        .idea-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .idea-tags {
            display: flex;
            gap: 8px;
        }

        .idea-tag {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .idea-tag.work { background: rgba(76, 201, 240, 0.2); color: var(--accent-blue); }
        .idea-tag.study { background: rgba(67, 233, 123, 0.2); color: var(--accent-green); }
        .idea-tag.creative { background: rgba(157, 78, 221, 0.2); color: var(--accent-purple); }
        .idea-tag.life { background: rgba(250, 112, 154, 0.2); color: var(--accent-orange); }
        .idea-tag.tech { background: rgba(247, 37, 133, 0.2); color: var(--accent-pink); }
        .idea-tag.uncategorized { background: rgba(100, 100, 100, 0.2); color: var(--text-secondary); }

        .idea-time {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 5px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            color: var(--accent-pink);
            background: rgba(247, 37, 133, 0.1);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 1rem;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px 20px;
            background: var(--bg-card);
            border-radius: 10px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .input-section {
                padding: 20px;
            }

            .btn {
                padding: 10px 18px;
                font-size: 0.9rem;
            }

            .stats-bar {
                flex-wrap: wrap;
                gap: 15px;
            }

            .stat-item {
                flex: 1;
                min-width: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <div class="header">
            <h1>灵感碎片捕手</h1>
            <p>IdeaCatcher - 捕捉每一个闪现的灵感</p>
        </div>

        <div class="input-section">
            <div class="input-wrapper">
                <textarea id="idea-input" placeholder="在这里输入你的灵感..." autofocus></textarea>
            </div>
            <div class="input-actions">
                <button class="btn btn-secondary" id="voice-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" x2="12" y1="19" y2="23"/>
                        <line x1="8" x2="16" y1="23" y2="23"/>
                    </svg>
                    <span>语音输入</span>
                </button>
                <button class="btn btn-primary" id="submit-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                        <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                    <span>捕获灵感</span>
                </button>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-number" id="total-count">0</div>
                <div class="stat-label">总灵感</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="today-count">0</div>
                <div class="stat-label">今日捕获</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="category-count">0</div>
                <div class="stat-label">已分类</div>
            </div>
        </div>

        <div class="filter-section">
            <button class="tag-btn active" data-tag="all">全部</button>
            <button class="tag-btn" data-tag="工作">工作</button>
            <button class="tag-btn" data-tag="学习">学习</button>
            <button class="tag-btn" data-tag="创意">创意</button>
            <button class="tag-btn" data-tag="生活">生活</button>
            <button class="tag-btn" data-tag="技术">技术</button>
            <button class="tag-btn" data-tag="未分类">未分类</button>
        </div>

        <div class="ideas-grid" id="ideas-grid">
            <div class="empty-state">
                <h3>还没有灵感碎片</h3>
                <p>在上方输入框中捕捉你的第一个灵感吧</p>
            </div>
        </div>
    </div>

    <script>
        const AI_TAG_ENGINE = {
            工作: ['工作', '会议', '项目', '任务', '报告', '客户', '方案', '进度', '团队', '协作', 'deadline', 'meeting', 'project', 'task', 'report', 'client'],
            学习: ['学习', '课程', '考试', '论文', '读书', '笔记', '知识', '研究', '作业', '复习', 'learn', 'study', 'course', 'exam', 'paper', 'book', 'knowledge'],
            创意: ['创意', '想法', '灵感', '设计', '方案', '创新', '点子', '构思', '创作', '艺术', 'creative', 'idea', 'design', 'inspiration', 'art', 'innovation'],
            生活: ['生活', '旅行', '美食', '健身', '购物', '电影', '音乐', '周末', '家人', '朋友', 'life', 'travel', 'food', 'fitness', 'movie', 'music', 'weekend'],
            技术: ['技术', '编程', '代码', '开发', 'API', '框架', '算法', '前端', '后端', '数据库', 'tech', 'code', 'program', 'api', 'framework', 'algorithm', 'frontend', 'backend']
        };

        function generateTags(text) {
            const tags = [];
            const lowerText = text.toLowerCase();
            
            for (const [tag, keywords] of Object.entries(AI_TAG_ENGINE)) {
                for (const keyword of keywords) {
                    if (lowerText.includes(keyword.toLowerCase())) {
                        tags.push(tag);
                        break;
                    }
                }
            }
            
            return tags.length > 0 ? tags.slice(0, 3) : ['未分类'];
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return `${Math.floor(diff / 60000)}分钟前`;
            if (diff < 86400000) return `${Math.floor(diff / 3600000)}小时前`;
            
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const hour = date.getHours().toString().padStart(2, '0');
            const minute = date.getMinutes().toString().padStart(2, '0');
            
            return `${month}月${day}日 ${hour}:${minute}`;
        }

        function getTagClass(tag) {
            const classMap = {
                '工作': 'work',
                '学习': 'study',
                '创意': 'creative',
                '生活': 'life',
                '技术': 'tech',
                '未分类': 'uncategorized'
            };
            return classMap[tag] || 'uncategorized';
        }

        function createParticles() {
            const container = document.getElementById('particles');
            const colors = ['#9d4edd', '#4cc9f0', '#f72585', '#43e97b', '#fa709a'];
            
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.animationDelay = `${Math.random() * 15}s`;
                particle.style.animationDuration = `${10 + Math.random() * 10}s`;
                particle.style.width = `${2 + Math.random() * 4}px`;
                particle.style.height = particle.style.width;
                container.appendChild(particle);
            }
        }

        function showCaptureEffect(x, y) {
            const effect = document.createElement('div');
            effect.className = 'capture-effect';
            effect.style.left = `${x - 50}px`;
            effect.style.top = `${y - 50}px`;
            document.body.appendChild(effect);
            
            setTimeout(() => {
                effect.remove();
            }, 800);
        }

        function renderIdeas(filterTag = 'all') {
            const ideas = JSON.parse(localStorage.getItem('ideas') || '[]');
            const grid = document.getElementById('ideas-grid');
            
            const filteredIdeas = filterTag === 'all' 
                ? ideas 
                : ideas.filter(idea => idea.tags.includes(filterTag));
            
            updateStats(ideas);
            
            if (filteredIdeas.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <h3>${filterTag === 'all' ? '还没有灵感碎片' : '该分类下暂无灵感'}</h3>
                        <p>${filterTag === 'all' ? '在上方输入框中捕捉你的第一个灵感吧' : '尝试切换其他分类查看'}</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = filteredIdeas.map(idea => `
                <div class="idea-card ${getTagClass(idea.tags[0])}">
                    <div class="idea-content">${idea.content}</div>
                    <div class="idea-footer">
                        <div class="idea-tags">
                            ${idea.tags.map(tag => `<span class="idea-tag ${getTagClass(tag)}">${tag}</span>`).join('')}
                        </div>
                        <div class="idea-time">${formatTime(idea.timestamp)}</div>
                        <button class="delete-btn" onclick="deleteIdea(${idea.id})">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 6h18"/>
                                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                            </svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function updateStats(ideas) {
            document.getElementById('total-count').textContent = ideas.length;
            
            const today = new Date().setHours(0, 0, 0, 0);
            const todayIdeas = ideas.filter(idea => idea.timestamp >= today);
            document.getElementById('today-count').textContent = todayIdeas.length;
            
            const categorized = ideas.filter(idea => !idea.tags.includes('未分类'));
            document.getElementById('category-count').textContent = categorized.length;
        }

        function addIdea(content) {
            if (!content.trim()) return;
            
            const ideas = JSON.parse(localStorage.getItem('ideas') || '[]');
            const newIdea = {
                id: Date.now(),
                content: content.trim(),
                tags: generateTags(content),
                timestamp: Date.now()
            };
            
            ideas.unshift(newIdea);
            localStorage.setItem('ideas', JSON.stringify(ideas));
            
            const submitBtn = document.getElementById('submit-btn');
            const rect = submitBtn.getBoundingClientRect();
            showCaptureEffect(rect.left + rect.width / 2, rect.top + rect.height / 2);
            
            document.getElementById('idea-input').value = '';
            renderIdeas();
        }

        window.deleteIdea = function(id) {
            const ideas = JSON.parse(localStorage.getItem('ideas') || '[]');
            const filtered = ideas.filter(idea => idea.id !== id);
            localStorage.setItem('ideas', JSON.stringify(filtered));
            renderIdeas();
        };

        function initSpeechRecognition() {
            const voiceBtn = document.getElementById('voice-btn');
            const input = document.getElementById('idea-input');
            
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                voiceBtn.style.opacity = '0.5';
                voiceBtn.style.cursor = 'not-allowed';
                voiceBtn.title = '您的浏览器不支持语音输入';
                return;
            }
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'zh-CN';
            
            let isRecording = false;
            
            voiceBtn.addEventListener('click', () => {
                if (!isRecording) {
                    recognition.start();
                    isRecording = true;
                    voiceBtn.classList.add('btn-recording');
                    voiceBtn.querySelector('span').textContent = '正在录音...';
                } else {
                    recognition.stop();
                    isRecording = false;
                    voiceBtn.classList.remove('btn-recording');
                    voiceBtn.querySelector('span').textContent = '语音输入';
                }
            });
            
            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                
                input.value = finalTranscript + interimTranscript;
            };
            
            recognition.onend = () => {
                isRecording = false;
                voiceBtn.classList.remove('btn-recording');
                voiceBtn.querySelector('span').textContent = '语音输入';
            };
            
            recognition.onerror = (event) => {
                console.error('语音识别错误:', event.error);
                isRecording = false;
                voiceBtn.classList.remove('btn-recording');
                voiceBtn.querySelector('span').textContent = '语音输入';
            };
        }

        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
            
            const submitBtn = document.getElementById('submit-btn');
            const input = document.getElementById('idea-input');
            
            submitBtn.addEventListener('click', () => {
                addIdea(input.value);
            });
            
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    addIdea(input.value);
                }
            });
            
            document.querySelectorAll('.tag-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderIdeas(btn.dataset.tag);
                });
            });
            
            initSpeechRecognition();
            renderIdeas();
        });
    </script>
</body>
</html>
