<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时光胶囊 — 写给未来的信</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #11111a;
    --surface-2: #1a1a28;
    --text: #e8e6f0;
    --text-dim: #8a87a0;
    --accent: #f0c674;
    --accent-2: #b294bb;
    --border: rgba(240,198,116,0.15);
    --shadow: rgba(0,0,0,0.6);
    --particle-start: #f0c674;
    --particle-end: #8a87a0;
    --font-display: 'Noto Serif SC', 'Songti SC', serif;
    --font-body: 'Noto Sans SC', 'PingFang SC', sans-serif;
  }
  [data-theme="light"] {
    --bg: #f5f3ee;
    --surface: #ffffff;
    --surface-2: #f0ece4;
    --text: #2a2a30;
    --text-dim: #7a7780;
    --accent: #c4953a;
    --accent-2: #8b6fa8;
    --border: rgba(196,149,58,0.25);
    --shadow: rgba(0,0,0,0.08);
    --particle-start: #c4953a;
    --particle-end: #8b6fa8;
  }
  [data-theme="cyber"] {
    --bg: #050510;
    --surface: #0a0a1a;
    --surface-2: #101030;
    --text: #00ffcc;
    --text-dim: #008866;
    --accent: #ff00ff;
    --accent-2: #00ccff;
    --border: rgba(0,255,204,0.2);
    --shadow: rgba(0,255,204,0.1);
    --particle-start: #00ffcc;
    --particle-end: #ff00ff;
    --font-display: 'Courier New', monospace;
    --font-body: 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    overflow-x: hidden;
  }
  #bg-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }
  .container {
    position: relative;
    z-index: 1;
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 20px;
    min-height: 100vh;
  }
  header {
    text-align: center;
    margin-bottom: 40px;
  }
  header h1 {
    font-family: var(--font-display);
    font-size: 2.4rem;
    letter-spacing: 0.15em;
    color: var(--accent);
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(240,198,116,0.2);
  }
  header p {
    color: var(--text-dim);
    font-size: 0.95rem;
    letter-spacing: 0.05em;
  }
  .theme-switcher {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 30px;
  }
  .theme-btn {
    padding: 6px 16px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.3s;
  }
  .theme-btn:hover, .theme-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 12px rgba(240,198,116,0.15);
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 24px;
    box-shadow: 0 8px 32px var(--shadow);
    backdrop-filter: blur(8px);
  }
  .card h2 {
    font-family: var(--font-display);
    font-size: 1.2rem;
    color: var(--accent);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .form-group {
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 8px;
    letter-spacing: 0.03em;
  }
  input[type="text"],
  input[type="password"],
  input[type="datetime-local"],
  textarea {
    width: 100%;
    padding: 12px 14px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  input:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(240,198,116,0.1);
  }
  textarea {
    min-height: 180px;
    resize: vertical;
    line-height: 1.7;
  }
  .hint {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 6px;
  }
  .row {
    display: flex;
    gap: 16px;
  }
  .row .form-group {
    flex: 1;
  }
  .checkbox-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  .checkbox-wrap input {
    width: 18px; height: 18px;
    accent-color: var(--accent);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 32px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.3s;
    letter-spacing: 0.05em;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(240,198,116,0.3);
  }
  .btn-secondary {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover {
    background: var(--surface);
    box-shadow: 0 4px 16px var(--shadow);
  }
  .actions {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    flex-wrap: wrap;
  }
  .result-area {
    display: none;
    margin-top: 24px;
    padding: 20px;
    background: var(--surface-2);
    border-radius: 12px;
    border: 1px dashed var(--border);
    text-align: center;
  }
  .result-area.show { display: block; }
  #qrcode {
    margin: 16px auto;
    padding: 12px;
    background: #fff;
    border-radius: 8px;
    display: inline-block;
  }
  .link-box {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .link-box input {
    flex: 1;
    font-size: 0.8rem;
  }
  .countdown-wrap {
    text-align: center;
    padding: 60px 20px;
  }
  .countdown-wrap h2 {
    font-family: var(--font-display);
    font-size: 1.8rem;
    color: var(--accent);
    margin-bottom: 30px;
  }
  .countdown {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }
  .countdown-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 24px;
    min-width: 80px;
  }
  .countdown-item .num {
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .countdown-item .label {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .capsule-icon {
    width: 120px;
    height: 120px;
    margin: 0 auto 30px;
    position: relative;
  }
  .capsule-icon svg {
    width: 100%; height: 100%;
    filter: drop-shadow(0 0 20px rgba(240,198,116,0.2));
  }
  .letter-content {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    margin-top: 20px;
    line-height: 1.8;
  }
  .letter-content h1, .letter-content h2, .letter-content h3 {
    font-family: var(--font-display);
    color: var(--accent);
    margin: 1.2em 0 0.6em;
  }
  .letter-content p { margin-bottom: 1em; }
  .letter-content blockquote {
    border-left: 3px solid var(--accent);
    padding-left: 16px;
    color: var(--text-dim);
    margin: 1em 0;
  }
  .letter-content ul, .letter-content ol {
    margin-left: 1.5em;
    margin-bottom: 1em;
  }
  .letter-content code {
    background: var(--surface-2);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.9em;
  }
  .letter-content pre {
    background: var(--surface-2);
    padding: 16px;
    border-radius: 8px;
    overflow-x: auto;
    margin-bottom: 1em;
  }
  .letter-meta {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-bottom: 20px;
  }
  .capsule-list {
    list-style: none;
  }
  .capsule-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    background: var(--surface-2);
    border-radius: 10px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
    transition: transform 0.2s;
  }
  .capsule-list li:hover {
    transform: translateX(4px);
  }
  .capsule-list .capsule-title {
    font-weight: 600;
    color: var(--text);
  }
  .capsule-list .capsule-date {
    font-size: 0.8rem;
    color: var(--text-dim);
  }
  .capsule-list .capsule-actions {
    display: flex;
    gap: 8px;
  }
  .capsule-list .capsule-actions button {
    padding: 6px 12px;
    font-size: 0.75rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s;
  }
  .capsule-list .capsule-actions button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .hidden { display: none !important; }
  .fade-in {
    animation: fadeIn 0.8s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .pulse {
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .shimmer {
    background: linear-gradient(90deg, transparent, rgba(240,198,116,0.1), transparent);
    background-size: 200% 100%;
    animation: shimmer 2s infinite;
  }
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  @media (max-width: 600px) {
    header h1 { font-size: 1.8rem; }
    .countdown-item { padding: 14px 16px; min-width: 60px; }
    .countdown-item .num { font-size: 1.8rem; }
    .row { flex-direction: column; }
  }
</style>
</head>
<body data-theme="dark">
<canvas id="bg-canvas"></canvas>

<div class="container">
  <header>
    <h1>时光胶囊</h1>
    <p>写给未来的信，到期自动开启</p>
  </header>

  <div class="theme-switcher">
    <button class="theme-btn active" data-theme="dark">深邃</button>
    <button class="theme-btn" data-theme="light">素雅</button>
    <button class="theme-btn" data-theme="cyber">赛博</button>
  </div>

  <!-- 写信页 -->
  <div id="write-page" class="card">
    <h2><span>✉️</span> 写一封信给未来</h2>
    <div class="form-group">
      <label>标题</label>
      <input type="text" id="letter-title" placeholder="给一年后的自己...">
    </div>
    <div class="form-group">
      <label>正文（支持 Markdown）</label>
      <textarea id="letter-body" placeholder="写下你想对未来自己说的话...

- 今年的愿望
- 此刻的心情
- 想记住的事
- 对未来的期许"></textarea>
      <div class="hint">支持 **粗体**、*斜体*、- 列表、> 引用、代码块等 Markdown 语法</div>
    </div>
    <div class="row">
      <div class="form-group">
        <label>开启时间</label>
        <input type="datetime-local" id="open-time">
      </div>
      <div class="form-group">
        <label>密码（可选）</label>
        <input type="password" id="letter-password" placeholder="留空则不加密">
      </div>
    </div>
    <div class="form-group">
      <label class="checkbox-wrap">
        <input type="checkbox" id="save-local" checked>
        <span>保存到本地索引（同一浏览器可管理）</span>
      </label>
    </div>
    <div class="actions">
      <button class="btn" id="btn-generate">生成时光胶囊</button>
    </div>
    <div class="result-area" id="result-area">
      <p style="color: var(--accent); font-weight: 600;">胶囊已生成！</p>
      <div id="qrcode"></div>
      <div class="link-box">
        <input type="text" id="capsule-link" readonly>
        <button class="btn btn-secondary" id="btn-copy">复制链接</button>
      </div>
      <p class="hint">链接包含加密内容，可收藏、分享或印刷在贺卡上</p>
    </div>
  </div>

  <!-- 等待态 / 开启态 -->
  <div id="view-page" class="hidden">
    <div id="waiting-state" class="countdown-wrap">
      <div class="capsule-icon">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="50" cy="50" rx="20" ry="35" stroke="var(--accent)" stroke-width="2" fill="none"/>
          <ellipse cx="50" cy="50" rx="20" ry="35" stroke="var(--accent-2)" stroke-width="1" fill="none" opacity="0.5" transform="rotate(60 50 50)"/>
          <ellipse cx="50" cy="50" rx="20" ry="35" stroke="var(--accent)" stroke-width="1" fill="none" opacity="0.3" transform="rotate(120 50 50)"/>
          <circle cx="50" cy="50" r="8" fill="var(--accent)" opacity="0.8">
            <animate attributeName="r" values="8;12;8" dur="3s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
          </circle>
        </svg>
      </div>
      <h2>时光胶囊尚未开启</h2>
      <div class="countdown" id="countdown">
        <div class="countdown-item"><div class="num" id="cd-days">00</div><div class="label">天</div></div>
        <div class="countdown-item"><div class="num" id="cd-hours">00</div><div class="label">时</div></div>
        <div class="countdown-item"><div class="num" id="cd-minutes">00</div><div class="label">分</div></div>
        <div class="countdown-item"><div class="num" id="cd-seconds">00</div><div class="label">秒</div></div>
      </div>
      <p class="hint" id="open-at-text"></p>
      <div id="password-input-area" class="hidden" style="margin-top: 20px;">
        <input type="password" id="view-password" placeholder="请输入密码" style="max-width: 280px;">
        <button class="btn" id="btn-unlock" style="margin-top: 12px;">立即解锁</button>
      </div>
    </div>

    <div id="opened-state" class="hidden fade-in">
      <div class="letter-meta" id="letter-meta"></div>
      <div class="letter-content" id="letter-content"></div>
      <div class="actions" style="justify-content: center;">
        <button class="btn btn-secondary" id="btn-export-img">导出为图片</button>
        <button class="btn btn-secondary" id="btn-export-pdf">导出为 PDF</button>
        <button class="btn btn-secondary" id="btn-new">写新信件</button>
      </div>
    </div>
  </div>

  <!-- 本地索引 -->
  <div id="index-page" class="card">
    <h2><span>📦</span> 我的胶囊</h2>
    <ul class="capsule-list" id="capsule-list">
      <li style="justify-content:center; color: var(--text-dim);">暂无胶囊，写一封给未来的信吧</li>
    </ul>
  </div>
</div>

<script>
/* ========== 内联 marked.js (精简版) ========== */
const marked = (function(){
  const escape = (html) => html.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  function parse(src){
    src = src.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
    let out = '', inCode = false, codeLang = '';
    const lines = src.split('\n');
    let i = 0;
    while(i < lines.length){
      let line = lines[i];
      if(line.startsWith('```')){
        if(!inCode){ inCode = true; codeLang = line.slice(3).trim(); i++; continue; }
        else { inCode = false; out += '</code></pre>\n'; i++; continue; }
      }
      if(inCode){ out += escape(line) + '\n'; i++; continue; }
      if(line.trim() === ''){ out += '\n'; i++; continue; }
      // heading
      if(/^#{1,6}\s/.test(line)){
        const level = line.match(/^(#{1,6})\s/)[1].length;
        out += `<h${level}>${inline(line.slice(level+1))}</h${level}>\n`;
        i++; continue;
      }
      // blockquote
      if(line.startsWith('> ')){
        let q = '';
        while(i < lines.length && lines[i].startsWith('> ')){ q += lines[i].slice(2) + ' '; i++; }
        out += `<blockquote>${inline(q.trim())}</blockquote>\n`;
        continue;
      }
      // ul
      if(/^[-*+]\s/.test(line)){
        out += '<ul>\n';
        while(i < lines.length && /^[-*+]\s/.test(lines[i])){
          out += `<li>${inline(lines[i].slice(2))}</li>\n`; i++;
        }
        out += '</ul>\n';
        continue;
      }
      // ol
      if(/^\d+\.\s/.test(line)){
        out += '<ol>\n';
        while(i < lines.length && /^\d+\.\s/.test(lines[i])){
          out += `<li>${inline(lines[i].replace(/^\d+\.\s/,''))}</li>\n`; i++;
        }
        out += '</ol>\n';
        continue;
      }
      // hr
      if(/^-{3,}$/.test(line.trim()) || /^\*{3,}$/.test(line.trim())){
        out += '<hr>\n'; i++; continue;
      }
      // p
      out += `<p>${inline(line)}</p>\n`;
      i++;
    }
    if(inCode) out += '</code></pre>\n';
    return out;
  }
  function inline(text){
    return text
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/~~([^~]+)~~/g, '<del>$1</del>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  }
  return { parse };
})();

/* ========== 内联 QRCode.js (精简版) ========== */
const QRCode = (function(){
  function createCanvas(text, size){
    const typeNumber = getTypeNumber(text);
    const qrcode = QRCodeModel(typeNumber, 2);
    qrcode.addData(text);
    qrcode.make();
    const cellSize = Math.floor(size / qrcode.getModuleCount());
    const margin = Math.floor((size - cellSize * qrcode.getModuleCount()) / 2);
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,size,size);
    ctx.fillStyle = '#000';
    for(let r=0;r<qrcode.getModuleCount();r++){
      for(let c=0;c<qrcode.getModuleCount();c++){
        if(qrcode.isDark(r,c)) ctx.fillRect(margin+c*cellSize, margin+r*cellSize, cellSize, cellSize);
      }
    }
    return canvas;
  }
  function getTypeNumber(text){
    for(let type=1; type<=40; type++){
      if(getMaxLength(type) >= text.length) return type;
    }
    return 40;
  }
  function getMaxLength(type){
    const capacities = [0,152,272,440,640,864,1088,1248,1552,1856,2192,2592,2960,3424,3688,4184,4712,5176,5768,6360,6888,7456,8048,8752,9392,10208,10960,11744,12248,13048,13880,14744,15640,16568,17528,18448,19472,20528,21616,22496,23648];
    return capacities[type] || 23648;
  }
  // Minimal QR model implementation
  function QRCodeModel(typeNumber, errorCorrectionLevel){
    const _modules = [];
    let _moduleCount = 0;
    const _dataList = [];
    const _dataCache = null;
    function addData(data){ _dataList.push({getData:function(){return data;},getLength:function(){return data.length;}}); }
    function isDark(row, col){ return _modules[row][col]; }
    function getModuleCount(){ return _moduleCount; }
    function make(){ _moduleCount = typeNumber * 4 + 17; _modules.length = 0; for(let i=0;i<_moduleCount;i++){ _modules[i]=[]; for(let j=0;j<_moduleCount;j++) _modules[i][j]=false; } setupPositionProbePattern(0,0); setupPositionProbePattern(_moduleCount-7,0); setupPositionProbePattern(0,_moduleCount-7); setupTimingPattern(); const data = _dataList[0].getData(); let bitIndex = 0; for(let col=_moduleCount-1; col>0; col-=2){ if(col===6) col--; for(let row=0; row<_moduleCount; row++){ for(let c=0; c<2; c++){ const x = col - c; let y = row; if((col+1)%4===0) y = _moduleCount - 1 - row; if(y>=0 && y<_moduleCount && x>=0 && x<_moduleCount && !_modules[y][x]){ _modules[y][x] = (bitIndex < data.length*8) ? ((data.charCodeAt(bitIndex>>3) >> (7-(bitIndex&7))) & 1) === 1 : false; bitIndex++; } } } } }
    function setupPositionProbePattern(row, col){ for(let r=-1;r<=7;r++){ if(row+r<0 || _moduleCount<=row+r) continue; for(let c=-1;c<=7;c++){ if(col+c<0 || _moduleCount<=col+c) continue; _modules[row+r][col+c] = (0<=r && r<=6 && (c===0 || c===6)) || (0<=c && c<=6 && (r===0 || r===6)) || (2<=r && r<=4 && 2<=c && c<=4); } } }
    function setupTimingPattern(){ for(let i=8;i<_moduleCount-8;i++){ _modules[6][i] = i%2===0; _modules[i][6] = i%2===0; } }
    return {addData, isDark, getModuleCount, make};
  }
  return { createCanvas };
})();

/* ========== 加密工具 ========== */
const CRYPTO = {
  async deriveKey(password, salt){
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:100000, hash:'SHA-256'}, keyMaterial, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
  },
  async encrypt(text, password){
    const enc = new TextEncoder();
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await this.deriveKey(password, salt);
    const ciphertext = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(text));
    return {ciphertext: new Uint8Array(ciphertext), salt, iv};
  },
  async decrypt(ciphertext, password, salt, iv){
    const key = await this.deriveKey(password, salt);
    const plaintext = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ciphertext);
    return new TextDecoder().decode(plaintext);
  }
};

/* ========== Base64URL ========== */
const B64U = {
  encode(buf){ return btoa(String.fromCharCode(...buf)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); },
  decode(str){ str += new Array(5 - str.length % 4).join('='); str = str.replace(/\-/g,'+').replace(/\_/g,'/'); return Uint8Array.from(atob(str), c=>c.charCodeAt(0)); }
};

/* ========== 状态管理 ========== */
const state = {
  capsules: JSON.parse(localStorage.getItem('timeCapsules') || '[]')
};

/* ========== DOM 元素 ========== */
const $ = id => document.getElementById(id);
const writePage = $('write-page');
const viewPage = $('view-page');
const indexPage = $('index-page');

const openedState = $('opened-state');

/* ========== 初始化 ========== */
function init(){
  // 主题切换
  document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.body.setAttribute('data-theme', btn.dataset.theme);
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      localStorage.setItem('tcTheme', btn.dataset.theme);
    });
  });
  const savedTheme = localStorage.getItem('tcTheme') || 'dark';
  document.body.setAttribute('data-theme', savedTheme);
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.theme === savedTheme));

  // 默认开启时间：明天同一时刻
  const tomorrow = new Date(Date.now() + 86400000);
  tomorrow.setMinutes(tomorrow.getMinutes() - tomorrow.getTimezoneOffset());
  $('open-time').value = tomorrow.toISOString().slice(0,16);

  renderIndex();
  initParticles();

  // 检查 URL hash
  if(location.hash.length > 1){
    writePage.classList.add('hidden');
    indexPage.classList.add('hidden');
    viewPage.classList.remove('hidden');
    loadCapsuleFromHash();
  }
}

/* ========== 生成胶囊 ========== */
$('btn-generate').addEventListener('click', async () => {
  const title = $('letter-title').value.trim();
  const body = $('letter-body').value;
  const openTime = new Date($('open-time').value).getTime();
  const password = $('letter-password').value;
  const saveLocal = $('save-local').checked;

  if(!title || !body || !openTime){
    alert('请填写标题、正文和开启时间');
    return;
  }
  if(openTime <= Date.now()){
    alert('开启时间必须在未来');
    return;
  }

  const payload = JSON.stringify({t:title, b:body, o:openTime, v:1});
  let cipher, salt, iv;

  if(password){
    const enc = await CRYPTO.encrypt(payload, password);
    cipher = enc.ciphertext; salt = enc.salt; iv = enc.iv;
  } else {
    // 无密码：简单 XOR 混淆（非真正加密，仅防明文）
    const key = crypto.getRandomValues(new Uint8Array(32));
    const data = new TextEncoder().encode(payload);
    cipher = new Uint8Array(data.length);
    for(let i=0;i<data.length;i++) cipher[i] = data[i] ^ key[i%32];
    salt = key; iv = new Uint8Array(12);
  }

  const hashObj = {c:B64U.encode(cipher), s:B64U.encode(salt), i:B64U.encode(iv), o:openTime, p:!!password, v:1};
  const hashStr = '#' + btoa(JSON.stringify(hashObj)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  const link = location.origin + location.pathname + hashStr;

  // 显示结果
  resultArea.classList.add('show');
  $('capsule-link').value = link;

  // 二维码
  const qr = QRCode.createCanvas(link, 180);
  $('qrcode').innerHTML = '';
  $('qrcode').appendChild(qr);

  // 保存到本地
  if(saveLocal){
    state.capsules.unshift({title, openTime, link, createdAt:Date.now()});
    localStorage.setItem('timeCapsules', JSON.stringify(state.capsules));
    renderIndex();
  }
});

$('btn-copy').addEventListener('click', () => {
  $('capsule-link').select();
  document.execCommand('copy');
  $('btn-copy').textContent = '已复制';
  setTimeout(() => $('btn-copy').textContent = '复制链接', 2000);
});

/* ========== 从 hash 加载胶囊 ========== */
async function loadCapsuleFromHash(){
  try {
    const hash = location.hash.slice(1);
    const json = atob(hash.replace(/\-/g,'+').replace(/\_/g,'/') + new Array(5 - hash.length % 4).join('='));
    const obj = JSON.parse(json);
    const cipher = B64U.decode(obj.c);
    const salt = B64U.decode(obj.s);
    const iv = B64U.decode(obj.i);
    const openTime = obj.o;
    const hasPassword = obj.p;

    const updateCountdown = () => {
      const now = Date.now();
      const diff = openTime - now;
      if(diff <= 0){
        clearInterval(timer);
        showOpened(cipher, salt, iv, hasPassword, obj);
        return;
      }
      const days = Math.floor(diff / 86400000);
      const hours = Math.floor((diff % 86400000) / 3600000);
      const minutes = Math.floor((diff % 3600000) / 60000);
      const seconds = Math.floor((diff % 60000) / 1000);
      $('cd-days').textContent = String(days).padStart(2,'0');
      $('cd-hours').textContent = String(hours).padStart(2,'0');
      $('cd-minutes').textContent = String(minutes).padStart(2,'0');
      $('cd-seconds').textContent = String(seconds).padStart(2,'0');
    };

    $('open-at-text').textContent = '开启时间：' + new Date(openTime).toLocaleString('zh-CN');

    // 如果已过期
    if(Date.now() >= openTime){
      showOpened(cipher, salt, iv, hasPassword, obj);
      return;
    }

    updateCountdown();
    const timer = setInterval(updateCountdown, 1000);

    // 密码输入
    if(hasPassword){
      $('password-input-area').classList.remove('hidden');
      $('btn-unlock').addEventListener('click', async () => {
        const pwd = $('view-password').value;
        if(!pwd) return;
        try {
          await tryDecrypt(cipher, salt, iv, pwd, obj);
        } catch(e){
          alert('密码错误');
        }
      });
    }
  } catch(e){
    alert('胶囊链接无效或已损坏');
    location.hash = '';
    location.reload();
  }
}

async function showOpened(cipher, salt, iv, hasPassword, obj){
  waitingState.classList.add('hidden');
  openedState.classList.remove('hidden');

  if(hasPassword){
    $('password-input-area').classList.remove('hidden');
    $('btn-unlock').addEventListener('click', async () => {
      const pwd = $('view-password').value;
      if(!pwd) return;
      try {
        await tryDecrypt(cipher, salt, iv, pwd, obj);
      } catch(e){
        alert('密码错误');
      }
    });
    // 等待用户输入密码
    return;
  }

  await tryDecrypt(cipher, salt, iv, null, obj);
}

async function tryDecrypt(cipher, salt, iv, password, obj){
  let plaintext;
  if(password){
    plaintext = await CRYPTO.decrypt(cipher, password, salt, iv);
  } else {
    const key = salt;
    const data = new Uint8Array(cipher.length);
    for(let i=0;i<cipher.length;i++) data[i] = cipher[i] ^ key[i%32];
    plaintext = new TextDecoder().decode(data);
  }
  const payload = JSON.parse(plaintext);

  $('letter-meta').innerHTML = `<h2 style="font-size:1.6rem; margin-bottom:8px;">${escapeHtml(payload.t)}</h2><p>原定开启：${new Date(payload.o).toLocaleString('zh-CN')} · 实际开启：${new Date().toLocaleString('zh-CN')}</p>`;
  $('letter-content').innerHTML = marked.parse(payload.b);

  waitingState.classList.add('hidden');
  openedState.classList.remove('hidden');
}

function escapeHtml(text){
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

/* ========== 本地索引 ========== */
function renderIndex(){
  const list = $('capsule-list');
  if(!state.capsules.length){
    list.innerHTML = '<li style="justify-content:center; color: var(--text-dim);">暂无胶囊，写一封给未来的信吧</li>';
    return;
  }
  list.innerHTML = state.capsules.map((cap, idx) => {
    const isOpen = Date.now() >= cap.openTime;
    return `<li>
      <div>
        <div class="capsule-title">${escapeHtml(cap.title)} ${isOpen ? '<span style="color:var(--accent)">✓ 已可开启</span>' : ''}</div>
        <div class="capsule-date">${new Date(cap.openTime).toLocaleString('zh-CN')}</div>
      </div>
      <div class="capsule-actions">
        <button onclick="openCapsuleLink(${idx})">打开</button>
        <button onclick="copyCapsuleLink(${idx})">复制</button>
        <button onclick="deleteCapsule(${idx})">删除</button>
      </div>
    </li>`;
  }).join('');
}

window.openCapsuleLink = function(idx){
  location.href = state.capsules[idx].link;
};
window.copyCapsuleLink = function(idx){
  const input = document.createElement('input');
  input.value = state.capsules[idx].link;
  document.body.appendChild(input);
  input.select();
  document.execCommand('copy');
  document.body.removeChild(input);
  alert('链接已复制');
};
window.deleteCapsule = function(idx){
  if(!confirm('确定删除这个胶囊？')) return;
  state.capsules.splice(idx, 1);
  localStorage.setItem('timeCapsules', JSON.stringify(state.capsules));
  renderIndex();
};

$('btn-export-pdf').addEventListener('click', () => {
  const content = $('letter-content');
  html2canvas(content).then(canvas => {
    const imgData = canvas.toDataURL('image/png');
    const pdf = new jsPDF('p', 'mm', 'a4');
    const imgWidth = 190;
    const pageHeight = 297;
    const imgHeight = canvas.height * imgWidth / canvas.width;
    let heightLeft = imgHeight;
    let position = 10;
    pdf.addImage(imgData, 'PNG', 10, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while(heightLeft > 0){
      position = heightLeft - imgHeight + 10;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 10, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
    pdf.save('时光胶囊.pdf');
  });
});

});

/* ========== 粒子背景 ========== */
function initParticles(){
  const canvas = $('bg-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let w, h;

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for(let i=0;i<60;i++){
    particles.push({
      x: Math.random()*w, y: Math.random()*h,
      r: Math.random()*2+0.5,
      vx: (Math.random()-0.5)*0.3,
      vy: (Math.random()-0.5)*0.3,
      life: Math.random()*Math.PI*2
    });
  }

  function draw(){
    ctx.clearRect(0,0,w,h);
    const theme = document.body.getAttribute('data-theme') || 'dark';
    const startColor = getComputedStyle(document.body).getPropertyValue('--particle-start').trim();
    const endColor = getComputedStyle(document.body).getPropertyValue('--particle-end').trim();

    particles.forEach((p,i) => {
      p.x += p.vx; p.y += p.vy; p.life += 0.01;
      if(p.x<0) p.x=w; if(p.x>w) p.x=0;
      if(p.y<0) p.y=h; if(p.y>h) p.y=0;
      const alpha = 0.3 + Math.sin(p.life)*0.2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = i%2===0 ? hexToRgba(startColor, alpha) : hexToRgba(endColor, alpha);
      ctx.fill();
    });

    // 连线
    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < 120){
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = hexToRgba(startColor, 0.05 * (1 - dist/120));
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
}

function hexToRgba(hex, alpha){
  if(hex.startsWith('#')){
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${alpha})`;
  }
  if(hex.startsWith('rgb')){
    return hex.replace(')', `, ${alpha})`).replace('rgb', 'rgba');
  }
  return hex;
}

/* ========== 内联 html2canvas + jsPDF ========== */
const html2canvas = (function(){
  return function(el){
    return new Promise(resolve => {
      const rect = el.getBoundingClientRect();
      const canvas = document.createElement('canvas');
      canvas.width = rect.width * 2;
      canvas.height = rect.height * 2;
      const ctx = canvas.getContext('2d');
      ctx.scale(2,2);
      const clone = el.cloneNode(true);
      const style = window.getComputedStyle(el);
      clone.style.width = rect.width + 'px';
      clone.style.height = rect.height + 'px';
      clone.style.position = 'absolute';
      clone.style.left = '-9999px';
      clone.style.top = '0';
      clone.style.background = style.backgroundColor;
      clone.style.color = style.color;
      clone.style.fontFamily = style.fontFamily;
      clone.style.fontSize = style.fontSize;
      clone.style.lineHeight = style.lineHeight;
      clone.style.padding = style.padding;
      clone.style.border = style.border;
      clone.style.borderRadius = style.borderRadius;
      document.body.appendChild(clone);
      // 简化渲染：用 foreignObject 方案
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${rect.width}" height="${rect.height}"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml">${clone.outerHTML}</div></foreignObject></svg>`;
      const img = new Image();
      img.onload = () => {
        ctx.drawImage(img, 0, 0, rect.width, rect.height);
        document.body.removeChild(clone);
        resolve(canvas);
      };
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    });
  };
})();

const jsPDF = (function(){
  function JsPDF(orientation, unit, format){
    this.pages = [];
    this.currentPage = {lines: [], images: []};
    this.orientation = orientation || 'p';
    this.unit = unit || 'mm';
    this.format = format || 'a4';
    this.pageWidth = this.format === 'a4' ? 210 : 210;
    this.pageHeight = this.format === 'a4' ? 297 : 297;
  }
  JsPDF.prototype.addPage = function(){
    this.pages.push(this.currentPage);
    this.currentPage = {lines: [], images: []};
  };
  JsPDF.prototype.addImage = function(imgData, type, x, y, w, h){
    this.currentPage.images.push({imgData, x, y, w, h});
  };
  JsPDF.prototype.save = function(filename){
    this.pages.push(this.currentPage);
    // 生成简单 PDF（简化版，实际用 blob URL 下载图片代替）
    const canvas = document.createElement('canvas');
    canvas.width = 794; canvas.height = 1123;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
    this.pages.forEach((page, pi) => {
      page.images.forEach(img => {
        const image = new Image();
        image.src = img.imgData;
        ctx.drawImage(image, img.x*3.78, (pi*1123)+img.y*3.78, img.w*3.78, img.h*3.78);
      });
    });
    const a = document.createElement('a');
    a.download = filename;
    a.href = canvas.toDataURL();
    a.click();
  };
  return JsPDF;
})();
