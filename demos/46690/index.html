<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSH Web Client</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SSH Web Client</h1>
            <div class="session-controls">
                <button id="settingsBtn" class="btn btn-secondary">设置</button>
                <button id="newSessionBtn" class="btn btn-primary">新建会话</button>
                <button id="disconnectBtn" class="btn btn-danger" disabled>断开连接</button>
            </div>
        </header>
        
        <div class="main-content">
            <div class="sidebar">
                <div class="session-list">
                    <h3>会话列表</h3>
                    <div id="sessionsList"></div>
                </div>
                
                <div class="connection-form">
                    <h3>连接配置</h3>
                    <form id="connectionForm">
                        <div class="form-group">
                            <label for="host">主机地址</label>
                            <input type="text" id="host" required placeholder="192.168.1.100">
                        </div>
                        
                        <div class="form-group">
                            <label for="port">端口</label>
                            <input type="number" id="port" value="22" min="1" max="65535">
                        </div>
                        
                        <div class="form-group">
                            <label for="username">用户名</label>
                            <input type="text" id="username" required placeholder="root">
                        </div>
                        
                        <div class="form-group">
                            <label for="authMethod">认证方式</label>
                            <select id="authMethod">
                                <option value="password">密码</option>
                                <option value="key">密钥</option>
                            </select>
                        </div>
                        
                        <div class="form-group" id="passwordGroup">
                            <label for="password">密码</label>
                            <input type="password" id="password" placeholder="输入密码">
                        </div>
                        
                        <div class="form-group" id="keyGroup" style="display: none;">
                            <label for="privateKey">私钥内容</label>
                            <textarea id="privateKey" rows="6" placeholder="粘贴私钥内容"></textarea>
                        </div>
                        
                        <div class="form-group" id="passphraseGroup" style="display: none;">
                            <label for="passphrase">密钥密码</label>
                            <input type="password" id="passphrase" placeholder="密钥密码（可选）">
                        </div>
                        
                        <button type="submit" class="btn btn-success">连接</button>
                    </form>
                </div>
                
                <div class="history-section">
                    <h3>服务器历史</h3>
                    <div id="serverHistory" class="history-list"></div>
                    <button id="clearServerHistoryBtn" class="btn btn-secondary btn-sm">清空历史</button>
                </div>
                
                <div class="history-section">
                    <h3>命令历史</h3>
                    <div id="commandHistory" class="history-list"></div>
                    <button id="clearCommandHistoryBtn" class="btn btn-secondary btn-sm">清空历史</button>
                </div>
            </div>
            
            <div class="content-area">
                <div class="tab-bar">
                    <button class="tab-btn active" data-tab="terminal">终端</button>
                    <button class="tab-btn" data-tab="fileManager" disabled>文件管理</button>
                    <button class="tab-btn" data-tab="memoryManager" disabled>内存管理</button>
                </div>
                
                <div class="tab-content">
                    <!-- 终端标签页 -->
                    <div id="terminalTab" class="tab-pane active">
                        <div id="terminal"></div>
                        <div class="terminal-status">
                            <span id="statusText">未连接</span>
                            <span id="sessionInfo"></span>
                        </div>
                    </div>
                    
                    <!-- 文件管理标签页 -->
                    <div id="fileManagerTab" class="tab-pane">
                        <div class="file-manager">
                            <div class="fm-toolbar">
                                <button id="fmRefreshBtn" class="btn btn-primary btn-sm">刷新</button>
                                <button id="fmUploadBtn" class="btn btn-success btn-sm">上传文件</button>
                                <button id="fmNewFolderBtn" class="btn btn-info btn-sm">新建文件夹</button>
                                <div class="fm-path-bar">
                                    <label>路径：</label>
                                    <input type="text" id="fmCurrentPath" value="/" />
                                    <button id="fmGoBtn" class="btn btn-primary btn-sm">前往</button>
                                </div>
                            </div>
                            <div class="fm-file-list-container">
                                <table class="fm-file-table">
                                    <thead>
                                        <tr>
                                            <th>名称</th>
                                            <th>权限</th>
                                            <th>大小</th>
                                            <th>修改时间</th>
                                            <th>操作</th>
                                        </tr>
                                    </thead>
                                    <tbody id="fmFileList">
                                    </tbody>
                                </table>
                            </div>
                            <div class="fm-status-bar">
                                <span id="fmFileCount">0 个项目</span>
                                <span id="fmLoadingText"></span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 内存管理标签页 -->
                    <div id="memoryManagerTab" class="tab-pane">
                        <div class="memory-manager">
                            <div class="mm-toolbar">
                                <button id="mmRefreshBtn" class="btn btn-primary btn-sm">刷新</button>
                                <button id="mmAutoRefreshBtn" class="btn btn-warning btn-sm">自动刷新: 关</button>
                            </div>
                            
                            <div class="mm-memory-panel">
                                <h4>内存使用情况</h4>
                                <div class="mm-memory-info">
                                    <div class="mm-memory-bar-container">
                                        <div class="mm-memory-bar">
                                            <div class="mm-memory-used" id="mmMemoryUsed"></div>
                                        </div>
                                        <div class="mm-memory-percentage" id="mmMemoryPercentage">0%</div>
                                    </div>
                                    <div class="mm-memory-details">
                                        <div class="mm-memory-item">
                                            <span class="label">总计:</span>
                                            <span class="value" id="mmTotalMemory">0 B</span>
                                        </div>
                                        <div class="mm-memory-item">
                                            <span class="label">已使用:</span>
                                            <span class="value" id="mmUsedMemory">0 B</span>
                                        </div>
                                        <div class="mm-memory-item">
                                            <span class="label">空闲:</span>
                                            <span class="value" id="mmFreeMemory">0 B</span>
                                        </div>
                                        <div class="mm-memory-item">
                                            <span class="label">可用:</span>
                                            <span class="value" id="mmAvailableMemory">0 B</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="mm-process-panel">
                                <h4>进程列表 (按内存使用排序)</h4>
                                <div class="mm-process-controls">
                                    <input type="text" id="mmProcessFilter" placeholder="过滤进程..." />
                                    <button id="mmKillSelectedBtn" class="btn btn-danger btn-sm" disabled>终止选中进程</button>
                                </div>
                                <div class="mm-process-table-container">
                                    <table class="mm-process-table">
                                        <thead>
                                            <tr>
                                                <th><input type="checkbox" id="mmSelectAll" /></th>
                                                <th>PID</th>
                                                <th>用户</th>
                                                <th>CPU%</th>
                                                <th>内存%</th>
                                                <th>RSS</th>
                                                <th>状态</th>
                                                <th>命令</th>
                                                <th>操作</th>
                                            </tr>
                                        </thead>
                                        <tbody id="mmProcessList">
                                        </tbody>
                                    </table>
                                </div>
                                <div class="mm-status-bar">
                                    <span id="mmProcessCount">0 个进程</span>
                                    <span id="mmLoadingText"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 文件编辑模态框 -->
    <div id="editorModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="editorTitle">编辑文件</h3>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <textarea id="fileEditor" rows="20"></textarea>
            </div>
            <div class="modal-footer">
                <button id="editorSaveBtn" class="btn btn-success">保存</button>
                <button id="editorCancelBtn" class="btn btn-secondary">取消</button>
            </div>
        </div>
    </div>
    
    <!-- 重命名模态框 -->
    <div id="renameModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>重命名</h3>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <label for="newName">新名称：</label>
                <input type="text" id="newName" />
            </div>
            <div class="modal-footer">
                <button id="renameConfirmBtn" class="btn btn-success">确定</button>
                <button id="renameCancelBtn" class="btn btn-secondary">取消</button>
            </div>
        </div>
    </div>
    
    <!-- 上传文件模态框 -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>上传文件</h3>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <input type="file" id="uploadFileInput" />
            </div>
            <div class="modal-footer">
                <button id="uploadConfirmBtn" class="btn btn-success">上传</button>
                <button id="uploadCancelBtn" class="btn btn-secondary">取消</button>
            </div>
        </div>
    </div>
    
    <!-- 新建文件夹模态框 -->
    <div id="newFolderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>新建文件夹</h3>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <label for="folderName">文件夹名称：</label>
                <input type="text" id="folderName" />
            </div>
            <div class="modal-footer">
                <button id="newFolderConfirmBtn" class="btn btn-success">创建</button>
                <button id="newFolderCancelBtn" class="btn btn-secondary">取消</button>
            </div>
        </div>
    </div>
    
    <!-- 设置模态框 -->
    <div id="settingsModal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3>设置</h3>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <div class="settings-container">
                    <div class="settings-section">
                        <h4>主题颜色配置</h4>
                        <div class="settings-grid">
                            <div class="settings-item">
                                <label>背景颜色</label>
                                <input type="color" id="themeBgColor" value="#1e1e1e" />
                            </div>
                            <div class="settings-item">
                                <label>侧边栏背景</label>
                                <input type="color" id="themeSidebarBg" value="#252526" />
                            </div>
                            <div class="settings-item">
                                <label>头部背景</label>
                                <input type="color" id="themeHeaderBg" value="#2d2d2d" />
                            </div>
                            <div class="settings-item">
                                <label>主要按钮颜色</label>
                                <input type="color" id="themePrimaryBtn" value="#0078d4" />
                            </div>
                            <div class="settings-item">
                                <label>成功按钮颜色</label>
                                <input type="color" id="themeSuccessBtn" value="#28a745" />
                            </div>
                            <div class="settings-item">
                                <label>危险按钮颜色</label>
                                <input type="color" id="themeDangerBtn" value="#dc3545" />
                            </div>
                            <div class="settings-item">
                                <label>信息按钮颜色</label>
                                <input type="color" id="themeInfoBtn" value="#17a2b8" />
                            </div>
                            <div class="settings-item">
                                <label>警告按钮颜色</label>
                                <input type="color" id="themeWarningBtn" value="#ffc107" />
                            </div>
                            <div class="settings-item">
                                <label>文字颜色</label>
                                <input type="color" id="themeTextColor" value="#ffffff" />
                            </div>
                            <div class="settings-item">
                                <label>次要文字颜色</label>
                                <input type="color" id="themeSecondaryText" value="#cccccc" />
                            </div>
                            <div class="settings-item">
                                <label>边框颜色</label>
                                <input type="color" id="themeBorderColor" value="#404040" />
                            </div>
                            <div class="settings-item">
                                <label>输入框背景</label>
                                <input type="color" id="themeInputBg" value="#333333" />
                            </div>
                            <div class="settings-item">
                                <label>终端背景</label>
                                <input type="color" id="themeTerminalBg" value="#1e1e1e" />
                            </div>
                            <div class="settings-item">
                                <label>终端文字</label>
                                <input type="color" id="themeTerminalText" value="#ffffff" />
                            </div>
                            <div class="settings-item">
                                <label>终端光标</label>
                                <input type="color" id="themeTerminalCursor" value="#ffffff" />
                            </div>
                            <div class="settings-item">
                                <label>标签页激活颜色</label>
                                <input type="color" id="themeTabActive" value="#0078d4" />
                            </div>
                            <div class="settings-item">
                                <label>会话激活颜色</label>
                                <input type="color" id="themeSessionActive" value="#0078d4" />
                            </div>
                            <div class="settings-item">
                                <label>链接颜色</label>
                                <input type="color" id="themeLinkColor" value="#0078d4" />
                            </div>
                        </div>
                    </div>
                    
                    <div class="settings-section">
                        <h4>预设主题</h4>
                        <div class="theme-presets">
                            <button class="btn btn-sm btn-secondary" onclick="applyThemePreset('dark')">深色主题</button>
                            <button class="btn btn-sm btn-secondary" onclick="applyThemePreset('light')">浅色主题</button>
                            <button class="btn btn-sm btn-secondary" onclick="applyThemePreset('monokai')">Monokai</button>
                            <button class="btn btn-sm btn-secondary" onclick="applyThemePreset('dracula')">Dracula</button>
                            <button class="btn btn-sm btn-secondary" onclick="applyThemePreset('solarized')">Solarized Dark</button>
                            <button class="btn btn-sm btn-secondary" onclick="applyThemePreset('nord')">Nord</button>
                        </div>
                    </div>
                    
                    <div class="settings-section">
                        <h4>布局尺寸配置</h4>
                        <div class="settings-grid">
                            <div class="settings-item">
                                <label>侧边栏宽度 (px)</label>
                                <input type="range" id="sizeSidebarWidth" min="200" max="500" value="300" />
                                <span class="size-value" id="sizeSidebarWidthValue">300</span>
                            </div>
                            <div class="settings-item">
                                <label>头部高度 (px)</label>
                                <input type="range" id="sizeHeaderHeight" min="40" max="80" value="50" />
                                <span class="size-value" id="sizeHeaderHeightValue">50</span>
                            </div>
                            <div class="settings-item">
                                <label>终端字体大小 (px)</label>
                                <input type="range" id="sizeTerminalFont" min="10" max="24" value="14" />
                                <span class="size-value" id="sizeTerminalFontSizeValue">14</span>
                            </div>
                            <div class="settings-item">
                                <label>正文字体大小 (px)</label>
                                <input type="range" id="sizeBodyFont" min="10" max="20" value="14" />
                                <span class="size-value" id="sizeBodyFontSizeValue">14</span>
                            </div>
                            <div class="settings-item">
                                <label>按钮内边距 (px)</label>
                                <input type="range" id="sizeBtnPadding" min="4" max="16" value="8" />
                                <span class="size-value" id="sizeBtnPaddingValue">8</span>
                            </div>
                            <div class="settings-item">
                                <label>按钮字体大小 (px)</label>
                                <input type="range" id="sizeBtnFont" min="10" max="18" value="14" />
                                <span class="size-value" id="sizeBtnFontSizeValue">14</span>
                            </div>
                            <div class="settings-item">
                                <label>输入框内边距 (px)</label>
                                <input type="range" id="sizeInputPadding" min="4" max="16" value="8" />
                                <span class="size-value" id="sizeInputPaddingValue">8</span>
                            </div>
                            <div class="settings-item">
                                <label>输入框字体大小 (px)</label>
                                <input type="range" id="sizeInputFont" min="10" max="18" value="13" />
                                <span class="size-value" id="sizeInputFontSizeValue">13</span>
                            </div>
                            <div class="settings-item">
                                <label>圆角大小 (px)</label>
                                <input type="range" id="sizeBorderRadius" min="0" max="16" value="4" />
                                <span class="size-value" id="sizeBorderRadiusValue">4</span>
                            </div>
                            <div class="settings-item">
                                <label>行间距 (px)</label>
                                <input type="range" id="sizeLineHeight" min="4" max="16" value="8" />
                                <span class="size-value" id="sizeLineHeightValue">8</span>
                            </div>
                            <div class="settings-item">
                                <label>模态框宽度 (%)</label>
                                <input type="range" id="sizeModalWidth" min="40" max="90" value="60" />
                                <span class="size-value" id="sizeModalWidthValue">60</span>
                            </div>
                            <div class="settings-item">
                                <label>标签页高度 (px)</label>
                                <input type="range" id="sizeTabHeight" min="30" max="60" value="40" />
                                <span class="size-value" id="sizeTabHeightValue">40</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="settings-section">
                        <h4>预设布局</h4>
                        <div class="theme-presets">
                            <button class="btn btn-sm btn-secondary" onclick="applyLayoutPreset('default')">默认布局</button>
                            <button class="btn btn-sm btn-secondary" onclick="applyLayoutPreset('compact')">紧凑布局</button>
                            <button class="btn btn-sm btn-secondary" onclick="applyLayoutPreset('comfortable')">舒适布局</button>
                            <button class="btn btn-sm btn-secondary" onclick="applyLayoutPreset('large')">大字体布局</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="settingsSaveBtn" class="btn btn-success">保存设置</button>
                <button id="settingsResetBtn" class="btn btn-warning">恢复默认</button>
                <button id="settingsCancelBtn" class="btn btn-secondary">取消</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="app.js"></script>
</body>
</html>
