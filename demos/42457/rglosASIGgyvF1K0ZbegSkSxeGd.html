<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老友菜谱 - 冰箱剩菜智能料理助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF8C42;
            --primary-light: #FFB074;
            --secondary: #FFD19A;
            --bg: #FFF8F0;
            --card: #FFFFFF;
            --text: #5D4037;
            --text-light: #8D6E63;
            --success: #66BB6A;
            --shadow: rgba(255, 140, 66, 0.15);
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #FFF8F0 0%, #FFE8D6 50%, #FFD9C0 100%);
            min-height: 100vh;
            color: var(--text);
            line-height: 1.8;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 0.8s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 2.8rem;
            color: var(--primary);
            margin-bottom: 15px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(255, 140, 66, 0.2);
        }

        .subtitle {
            font-size: 1.3rem;
            color: var(--text-light);
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 1.1rem;
            color: var(--text-light);
            opacity: 0.8;
        }

        .main-card {
            background: var(--card);
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px var(--shadow);
            margin-bottom: 40px;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-title {
            font-size: 1.6rem;
            color: var(--primary);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title span {
            font-size: 2rem;
        }

        .input-area {
            margin-bottom: 35px;
        }

        .input-hint {
            font-size: 1.1rem;
            color: var(--text-light);
            margin-bottom: 20px;
            text-align: center;
        }

        .ingredients-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 25px;
            background: linear-gradient(135deg, #FFF5EE 0%, #FFE8D6 100%);
            border-radius: 20px;
            min-height: 80px;
            margin-bottom: 20px;
            border: 2px dashed var(--secondary);
        }

        .ingredient-tag {
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 1.2rem;
            animation: popIn 0.3s ease-out;
            box-shadow: 0 4px 15px rgba(255, 140, 66, 0.3);
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .ingredient-tag .remove {
            cursor: pointer;
            font-size: 1.4rem;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .ingredient-tag .remove:hover {
            opacity: 1;
        }

        .input-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 18px 25px;
            font-size: 1.3rem;
            border: 3px solid var(--secondary);
            border-radius: 15px;
            outline: none;
            transition: all 0.3s ease;
            background: white;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(255, 140, 66, 0.2);
        }

        input[type="text"]::placeholder {
            color: #BCAAA4;
        }

        .btn {
            padding: 18px 40px;
            font-size: 1.3rem;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, #FF7B2E 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(255, 140, 66, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(255, 140, 66, 0.5);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--success) 0%, #4CAF50 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(102, 187, 106, 0.4);
        }

        .btn-secondary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(102, 187, 106, 0.5);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .quick-add {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .quick-btn {
            background: white;
            border: 2px solid var(--secondary);
            color: var(--text);
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            background: var(--secondary);
            border-color: var(--primary);
            transform: scale(1.05);
        }

        .results-section {
            display: none;
            animation: fadeInUp 0.6s ease-out;
        }

        .results-section.active {
            display: block;
        }

        .results-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .results-title {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .results-count {
            color: var(--text-light);
            font-size: 1.1rem;
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .recipe-card {
            background: var(--card);
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 10px 40px var(--shadow);
            transition: all 0.4s ease;
            animation: fadeInUp 0.5s ease-out both;
        }

        .recipe-card:nth-child(1) { animation-delay: 0.1s; }
        .recipe-card:nth-child(2) { animation-delay: 0.2s; }
        .recipe-card:nth-child(3) { animation-delay: 0.3s; }
        .recipe-card:nth-child(4) { animation-delay: 0.4s; }

        .recipe-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(255, 140, 66, 0.25);
        }

        .recipe-image {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            position: relative;
            overflow: hidden;
        }

        .recipe-image.breakfast { background: linear-gradient(135deg, #FFE0B2, #FFCC80); }
        .recipe-image.lunch { background: linear-gradient(135deg, #C8E6C9, #A5D6A7); }
        .recipe-image.dinner { background: linear-gradient(135deg, #BBDEFB, #90CAF9); }
        .recipe-image.snack { background: linear-gradient(135deg, #F8BBD9, #F48FB1); }

        .recipe-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.95);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: var(--text);
        }

        .recipe-content {
            padding: 25px;
        }

        .recipe-name {
            font-size: 1.5rem;
            color: var(--text);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .recipe-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .meta-item span {
            font-size: 1.2rem;
        }

        .recipe-ingredients {
            margin-bottom: 15px;
        }

        .recipe-ingredients-title {
            font-size: 1rem;
            color: var(--text-light);
            margin-bottom: 8px;
        }

        .recipe-ingredients-list {
            font-size: 1rem;
            color: var(--text);
            line-height: 1.6;
        }

        .recipe-steps {
            background: #FFF8F5;
            padding: 15px;
            border-radius: 15px;
        }

        .recipe-steps-title {
            font-size: 1rem;
            color: var(--primary);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .recipe-steps-list {
            font-size: 0.95rem;
            color: var(--text);
            line-height: 1.7;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            font-size: 100px;
            margin-bottom: 25px;
            opacity: 0.6;
        }

        .empty-text {
            font-size: 1.3rem;
            color: var(--text-light);
        }

        .footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
            font-size: 1rem;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
        }

        .tips {
            background: linear-gradient(135deg, #E8F5E9, #C8E6C9);
            border-radius: 20px;
            padding: 25px 30px;
            margin-top: 30px;
            border-left: 5px solid var(--success);
        }

        .tips-title {
            font-size: 1.2rem;
            color: var(--success);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tips-content {
            font-size: 1.05rem;
            color: var(--text);
            line-height: 1.8;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }

            .main-card {
                padding: 30px 20px;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .input-row {
                flex-direction: column;
            }

            .recipe-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🍳</div>
            <h1>老友菜谱</h1>
            <p class="subtitle">冰箱剩菜智能料理助手</p>
            <p class="tagline">告诉小助手冰箱里有什么，为您推荐简单又美味的菜谱</p>
        </header>

        <div class="main-card">

                    <button class="quick-btn" onclick="addIngredientQuick('醋')">🍶 醋</button>

                    <button class="quick-btn" onclick="addIngredientQuick('蒜')">🧄 蒜</button>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" onclick="findRecipes()" id="findBtn">
                    <span>🔍</span>
                    <span>帮我找菜谱</span>

                    <span>🗑️</span>

        </div>

        <div class="results-section" id="resultsSection">
            <div class="results-header">
                <h2 class="results-title">🎉 为您推荐这些菜谱</h2>

            </div>

            <div class="recipe-grid" id="recipeGrid">

        </div>

        function addIngredient() {
            const input = document.getElementById('ingredientInput');
            const value = input.value.trim();
            if (value) {
                addIngredientToList(value);
                input.value = '';
                input.focus();
            }
        }

        function addIngredientQuick(name) {
            addIngredientToList(name);
        }

        function addIngredientToList(name) {
            if (ingredients.has(name)) return;

            ingredients.add(name);
            updateDisplay();
        }

        function removeIngredient(name) {
            ingredients.delete(name);
            updateDisplay();
        }

        function clearAll() {
            ingredients.clear();
            updateDisplay();
            document.getElementById('resultsSection').classList.remove('active');
        }

        function updateDisplay() {
            const container = document.getElementById('ingredientsContainer');

            if (ingredients.size === 0) {
                container.innerHTML = '<span style="color: var(--text-light); font-size: 1.1rem; align-self: center;">点击下方按钮添加食材 👇</span>';
                return;
            }

            container.innerHTML = '';
            ingredients.forEach(item => {
                const tag = document.createElement('div');
                tag.className = 'ingredient-tag';
                tag.innerHTML = `<span>${item}</span><span class="remove" onclick="removeIngredient('${item}')">×</span>`;
                container.appendChild(tag);
            });
        }

        function findRecipes() {
            if (ingredients.size === 0) {
                alert('请先添加食材！');
                return;
            }

            const ingredientList = Array.from(ingredients);
            currentRecipes = recipeDatabase
                .map(recipe => {
                    let score = 0;
                    const matched = recipe.ingredients.filter(ing =>
                        ingredientList.some(userIng =>
                            ing.includes(userIng) || userIng.includes(ing)
                        )
                    );
                    score = Math.round((matched.length / recipe.ingredients.length) * 100);
                    return { ...recipe, matchScore: score, matched };
                })
                .filter(recipe => recipe.matchScore >= 40)
                .sort((a, b) => b.matchScore - a.matchScore)
                .slice(0, 6);

            displayResults();
        }

        function displayResults() {
            const section = document.getElementById('resultsSection');
            const grid = document.getElementById('recipeGrid');
            const count = document.getElementById('resultsCount');

            if (currentRecipes.length === 0) {
                count.textContent = '没有找到匹配的菜谱，请尝试添加更多常见食材';
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <div class="empty-icon">🤔</div>
                        <p class="empty-text">没有找到匹配的菜谱</p>
                        <p class="empty-text">试试添加：鸡蛋、西红柿、青菜、豆腐等常见食材</p>
                    </div>
                `;
            } else {
                count.textContent = `为您找到 ${currentRecipes.length} 道美味菜谱`;

                grid.innerHTML = currentRecipes.map(recipe => `
                    <div class="recipe-card">
                        <div class="recipe-image ${recipe.type}">
                            ${recipe.emoji}
                            <div class="recipe-badge">匹配度 ${recipe.matchScore}%</div>
                        </div>
                        <div class="recipe-content">
                            <h3 class="recipe-name">${recipe.name}</h3>
                            <div class="recipe-meta">
                                <div class="meta-item"><span>⏱️</span>${recipe.time}</div>
                                <div class="meta-item"><span>👨‍🍳</span>${recipe.difficulty}</div>
                            </div>
                            <div class="recipe-ingredients">
                                <div class="recipe-ingredients-title">🥗 可用食材：</div>
                                <div class="recipe-ingredients-list">${recipe.ingredients.join('、')}</div>
                            </div>
                            <div class="recipe-steps">
                                <div class="recipe-steps-title">📝 做法：</div>
                                <div class="recipe-steps-list">${recipe.steps.replace(/\n/g, '<br>')}</div>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            section.classList.add('active');
            section.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        document.getElementById('ingredientInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addIngredient();
            }
        });

        updateDisplay();
    </script>
