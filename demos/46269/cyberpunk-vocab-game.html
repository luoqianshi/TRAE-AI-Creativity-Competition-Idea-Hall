    box-shadow: 0 0 30px rgba(0,0,0,0.6);
  }
  #translation-popup.show { opacity: 1; }
  #translation-popup .word-en {

var GAME = (function() {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var stageEl = document.getElementById('stage');
  var popupEl = document.getElementById('translation-popup');
  var popupEn = document.getElementById('popup-en');
  var popupCn = document.getElementById('popup-cn');
  var btnCet4 = document.getElementById('btn-cet4');
  var btnCet6 = document.getElementById('btn-cet6');
  var configLabel = document.getElementById('config-label');

  var W, H, cx, cy;

  var config = {
    enFontSize: 26,
    cnFontSize: 24,
    popupDuration: 1800
  };
  var popupTimer = null;

  var currentLevel = 'cet4';
  var wordBank = CET4_WORDS;
  var usedWords = {};
  var currentWord = null;

  function getRandomWord() {
    var words = wordBank;
    var available = [];
    for (var i = 0; i < words.length; i++) {
      if (!usedWords[words[i].w.toLowerCase()]) available.push(i);
    }
    if (available.length === 0) { usedWords = {}; available = []; for (var j = 0; j < words.length; j++) available.push(j); }
    var idx = available[Math.floor(Math.random() * available.length)];
    return words[idx];
  }

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cx = W / 2;
    cy = H / 2;
  }
  resize();
  window.addEventListener('resize', resize);

  function lerp(a, b, t) { return a + (b - a) * t; }

  function randomGauss(mean, stdev) {
    var u = 1 - Math.random();
    var v = Math.random();
    var z = Math.sqrt(-2 * Math.log(u || 0.0001)) * Math.cos(2 * Math.PI * v);
    return z * stdev + mean;
  }

  function hsl(h, s, l, a) {
    if (a === undefined) a = 1;
    return 'hsla(' + h + ',' + s + '%,' + l + '%,' + a + ')';
  }

  var score = 0;
  var nodes = [];
  var INITIAL_NODES = 30;
  var MAX_NODES = 150;
  var SEGMENTS_PER_FOOD = 8;
  var EAT_DIST = 60;

  var mouseX = cx;
  var mouseY = cy;
  var dragonX = cx;
  var dragonY = cy;

  document.addEventListener('mousemove', function(e) {
    mouseX = e.clientX;
    mouseY = e.clientY;
  });

  for (var i = 0; i < INITIAL_NODES; i++) {
    nodes.push({ x: cx, y: cy });
  }

  var food = { x: 0, y: 0, hue: 0 };
  function respawnFood() {
    food.x = 100 + Math.random() * (W - 200);
    food.y = 100 + Math.random() * (H - 200);
    food.hue = Math.random() * 360;
    currentWord = getRandomWord();
    usedWords[currentWord.w.toLowerCase()] = true;
  }
  respawnFood();

  var stages = [
    { name: 'HATCHLING', hue: 180, speed: 0.35, threshold: 0 },
    { name: 'NEON SERPENT', hue: 270, speed: 0.42, threshold: 100 },
    { name: 'PHANTOM WYRM', hue: 30, speed: 0.50, threshold: 250 },
    { name: 'VOID DRAGON', hue: -1, speed: 0.58, threshold: 450 }
  ];

  var currentStage = 0;
  var globalHue = 180;
  var targetHue = 180;

  var explosionParticles = [];
  var shockwaves = [];
  var shakeFrames = 0;

  function getStage(pts) {
    for (var s = stages.length - 1; s >= 0; s--) {
      if (pts >= stages[s].threshold) return s;
    }
    return 0;
  }

  function showTranslation(word, translation) {
    popupEn.textContent = word;
    popupCn.textContent = translation;
    popupEn.style.fontSize = config.enFontSize + 'px';
    popupCn.style.fontSize = config.cnFontSize + 'px';
    popupEl.classList.add('show');
    if (popupTimer) clearTimeout(popupTimer);
    popupTimer = setTimeout(function() {
      popupEl.classList.remove('show');
    }, config.popupDuration);
  }

  function spawnExplosion(x, y) {
    for (var i = 0; i < 40; i++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = 3 + Math.random() * 6;
      explosionParticles.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        radius: 1.5 + Math.random() * 3,
        alpha: 1,
        decay: 0.01 + Math.random() * 0.03,
        hue: food.hue + Math.random() * 60 - 30
      });
    }
    shockwaves.push({ x: x, y: y, radius: 0, alpha: 1, hue: food.hue });
    shakeFrames = 10;
  }

  function updateExplosionParticles() {
    for (var i = explosionParticles.length - 1; i >= 0; i--) {
      var p = explosionParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.alpha -= p.decay;
      if (p.alpha <= 0) explosionParticles.splice(i, 1);
    }
  }

  function updateShockwaves() {
    for (var i = shockwaves.length - 1; i >= 0; i--) {
      var sw = shockwaves[i];
      sw.radius += 8;
      sw.alpha = 1 - (sw.radius / 180);
      if (sw.alpha <= 0) shockwaves.splice(i, 1);
    }
  }

  function drawBackground() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(4, 6, 15, 0.85)';
    ctx.fillRect(0, 0, W, H);
  }

  function drawDragon() {
    if (nodes.length < 2) return;
    var total = nodes.length;
    for (var i = 0; i < total - 1; i++) {
      var a = nodes[i];
      var b = nodes[i + 1];
      var ratio = i / total;
      var hue = (globalHue + i * 0.8) % 360;
      var w = ratio * 12 + 2;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = hsl(hue, 100, 55);
      ctx.lineWidth = w;
      ctx.shadowColor = hsl(hue, 100, 55, 0.8);
      ctx.shadowBlur = 20;
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }

  function drawStardust() {
    var total = nodes.length;
    var dustRadius = 18 + score * 0.08;
    if (dustRadius > 55) dustRadius = 55;
    for (var i = 0; i < total; i += 2) {
      var n = nodes[i];
      var ratio = i / total;
      var strength = Math.sin(ratio * Math.PI);
      for (var j = 0; j < 8; j++) {
        var dx = randomGauss(0, dustRadius * strength);
        var dy = randomGauss(0, dustRadius * strength);
        var px = n.x + dx;
        var py = n.y + dy;
        var hue = (globalHue + i * 0.8 + Math.random() * 30) % 360;
        ctx.beginPath();
        ctx.arc(px, py, 1 + Math.random() * 1.5, 0, Math.PI * 2);
        ctx.fillStyle = hsl(hue, 80, 70, 0.3 + Math.random() * 0.3);
        ctx.shadowColor = hsl(hue, 80, 60, 0.5);
        ctx.shadowBlur = 6;
        ctx.fill();
      }
      ctx.shadowBlur = 0;
    }
  }

  function drawHead() {
    var head = nodes[0];
    if (nodes.length < 2) return;
    var next = nodes[1];
    var angle = Math.atan2(head.y - next.y, head.x - next.x);
    ctx.beginPath();
    ctx.arc(head.x, head.y, 15, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 25;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2.5;
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 12;
    var hornAngle1 = angle - 2.4;
    ctx.beginPath();
    ctx.moveTo(head.x, head.y);
    ctx.lineTo(head.x + Math.cos(hornAngle1) * 40, head.y + Math.sin(hornAngle1) * 40);
    ctx.stroke();
    var hornAngle2 = angle + 2.4;
    ctx.beginPath();
    ctx.moveTo(head.x, head.y);
    ctx.lineTo(head.x + Math.cos(hornAngle2) * 40, head.y + Math.sin(hornAngle2) * 40);
    ctx.stroke();
    ctx.shadowBlur = 0;
    var eyeDist = 8;
    var eyeAngle1 = angle - 0.6;
    var eyeAngle2 = angle + 0.6;
    ctx.beginPath();
    ctx.arc(head.x + Math.cos(eyeAngle1) * eyeDist, head.y + Math.sin(eyeAngle1) * eyeDist, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(head.x + Math.cos(eyeAngle2) * eyeDist, head.y + Math.sin(eyeAngle2) * eyeDist, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(head.x + Math.cos(eyeAngle1) * eyeDist, head.y + Math.sin(eyeAngle1) * eyeDist, 1.5, 0, Math.PI * 2);
    ctx.fillStyle = '#000';
    ctx.shadowBlur = 0;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(head.x + Math.cos(eyeAngle2) * eyeDist, head.y + Math.sin(eyeAngle2) * eyeDist, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawTailExhaust() {
    if (nodes.length < 2) return;
    var dist = Math.hypot(mouseX - dragonX, mouseY - dragonY);
    if (dist <= 8) return;
    var tail = nodes[nodes.length - 1];
    var beforeTail = nodes[nodes.length - 2];
    var tailAngle = Math.atan2(tail.y - beforeTail.y, tail.x - beforeTail.x);
    var sprayAngle = tailAngle + Math.PI;
    for (var i = 0; i < 3; i++) {
      var spread = (Math.random() - 0.5) * 1.2;
      var a = sprayAngle + spread;
      var speed = 1 + Math.random() * 3;
      var px = tail.x + Math.cos(a) * speed;
      var py = tail.y + Math.sin(a) * speed;
      ctx.beginPath();
      ctx.arc(px, py, 1 + Math.random() * 2, 0, Math.PI * 2);
      ctx.fillStyle = hsl(globalHue, 90, 60, 0.6);
      ctx.shadowColor = hsl(globalHue, 90, 50, 0.7);
      ctx.shadowBlur = 8;
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  function drawFood() {
    var pulse = Math.sin(Date.now() / 100) * 6;
    var radius = 10 + pulse;
    ctx.beginPath();
    ctx.arc(food.x, food.y, radius, 0, Math.PI * 2);
    ctx.strokeStyle = hsl(food.hue, 100, 60);
    ctx.lineWidth = 4;
    ctx.shadowColor = hsl(food.hue, 100, 55, 0.9);
    ctx.shadowBlur = 25;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(food.x, food.y, 7, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 10;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(currentWord.w, food.x, food.y - 32);
    ctx.shadowBlur = 0;
    ctx.textAlign = 'start';
  }

  function drawExplosionParticles() {
    for (var i = 0; i < explosionParticles.length; i++) {
      var p = explosionParticles[i];
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = hsl(p.hue, 100, 65, p.alpha);
      ctx.shadowColor = hsl(p.hue, 100, 55, p.alpha);
      ctx.shadowBlur = 8;
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  function drawShockwaves() {
    for (var i = 0; i < shockwaves.length; i++) {
      var sw = shockwaves[i];
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
      ctx.strokeStyle = hsl(sw.hue, 100, 70, sw.alpha);
      ctx.lineWidth = 6;
      ctx.shadowColor = hsl(sw.hue, 100, 60, sw.alpha * 0.8);
      ctx.shadowBlur = 18;
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }

  function drawCursor() {
    ctx.beginPath();
    ctx.arc(mouseX, mouseY, 6, 0, Math.PI * 2);
    ctx.strokeStyle = hsl(globalHue, 100, 80);
    ctx.lineWidth = 2;
    ctx.shadowColor = hsl(globalHue, 100, 60, 0.9);
    ctx.shadowBlur = 16;
    ctx.stroke();
    var cLen = 10;
    ctx.beginPath();
    ctx.moveTo(mouseX - cLen, mouseY);
    ctx.lineTo(mouseX - 3, mouseY);
    ctx.moveTo(mouseX + 3, mouseY);
    ctx.lineTo(mouseX + cLen, mouseY);
    ctx.moveTo(mouseX, mouseY - cLen);
    ctx.lineTo(mouseX, mouseY - 3);
    ctx.moveTo(mouseX, mouseY + 3);
    ctx.lineTo(mouseX, mouseY + cLen);
    ctx.strokeStyle = hsl(globalHue, 100, 80);
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(mouseX, mouseY, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function update() {
    dragonX = lerp(dragonX, mouseX, stages[currentStage].speed);
    dragonY = lerp(dragonY, mouseY, stages[currentStage].speed);

    var targetLen = INITIAL_NODES + Math.floor(score / 10) * SEGMENTS_PER_FOOD;
    if (targetLen > MAX_NODES) targetLen = MAX_NODES;

    if (nodes.length < targetLen) {
      var last = nodes[nodes.length - 1];
      nodes.push({ x: last.x, y: last.y });
    } else if (nodes.length > targetLen) {
      nodes.pop();
    }

    nodes.unshift({ x: dragonX, y: dragonY });
    nodes.pop();

    var headDist = Math.hypot(dragonX - food.x, dragonY - food.y);
    if (headDist < EAT_DIST) {
      score += 10;
      scoreEl.textContent = 'SCORE: ' + score;
      showTranslation(currentWord.w, currentWord.t);
      spawnExplosion(food.x, food.y);
      respawnFood();

      var newStage = getStage(score);
      if (newStage !== currentStage) {
        currentStage = newStage;
        stageEl.textContent = 'STAGE: ' + stages[currentStage].name;
      }
    }

    var s = stages[currentStage];
    if (s.hue < 0) {
      targetHue = (Date.now() / 20) % 360;
    } else {
      targetHue = s.hue;
    }
    globalHue = lerp(globalHue, targetHue, 0.1);

    var uiColor = hsl(globalHue, 100, 70);
    scoreEl.style.color = uiColor;
    scoreEl.style.textShadow = '0 0 12px ' + hsl(globalHue, 100, 55, 0.9) + ', 0 0 40px ' + hsl(globalHue, 100, 50, 0.5);
    stageEl.style.color = hsl(globalHue, 100, 60);
    stageEl.style.textShadow = '0 0 8px ' + hsl(globalHue, 100, 50, 0.8);

    updateExplosionParticles();
    updateShockwaves();
  }

  function render() {
    ctx.save();
    var shakeX = 0, shakeY = 0;
    if (shakeFrames > 0) {
      var intensity = shakeFrames * 1.2;
      shakeX = (Math.random() - 0.5) * intensity;
      shakeY = (Math.random() - 0.5) * intensity;
      shakeFrames--;
      ctx.translate(shakeX, shakeY);
    }
    drawBackground();
    ctx.globalCompositeOperation = 'lighter';
    drawDragon();
    drawStardust();
    drawTailExhaust();
    drawExplosionParticles();
    drawShockwaves();
    drawFood();
    drawHead();
    drawCursor();
    ctx.restore();
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  loop();

  return {
    switchLevel: function(level) {
      currentLevel = level;
      if (level === 'cet4') {
        wordBank = CET4_WORDS;
        btnCet4.classList.add('active');
        btnCet6.classList.remove('active');
      } else {
        wordBank = CET6_WORDS;
        btnCet6.classList.add('active');
        btnCet4.classList.remove('active');
      }
      usedWords = {};
      score = 0;
      currentStage = 0;
      scoreEl.textContent = 'SCORE: 0';
      stageEl.textContent = 'STAGE: HATCHLING';
      nodes = [];
      for (var i = 0; i < INITIAL_NODES; i++) { nodes.push({ x: cx, y: cy }); }
      dragonX = cx; dragonY = cy;
      respawnFood();
    },
    updateConfig: function() {
      config.enFontSize = parseInt(document.getElementById('en-font-size').value);
      config.cnFontSize = parseInt(document.getElementById('cn-font-size').value);
      config.popupDuration = parseInt(document.getElementById('popup-duration').value);
      document.getElementById('en-font-val').textContent = config.enFontSize + 'px';
      document.getElementById('cn-font-val').textContent = config.cnFontSize + 'px';
      document.getElementById('duration-val').textContent = (config.popupDuration / 1000).toFixed(1) + 's';
    }
  };
})();

window.switchLevel = function(lvl) { GAME.switchLevel(lvl); };
window.updateConfig = function() { GAME.updateConfig(); };

(function updateUIColors() {
  var enSize = document.getElementById('en-font-size');
  var cnSize = document.getElementById('cn-font-size');
  var duration = document.getElementById('popup-duration');
  var lbl = document.getElementById('config-label');
  var lvlBtns = document.querySelectorAll('.lvl-btn');
  setInterval(function() {
    var hue = ((Date.now() / 20) % 360);
    var c = 'hsla(' + hue + ',100%,65%,1)';
    lbl.style.color = c;
    lbl.style.textShadow = '0 0 8px ' + c;
    for (var i = 0; i < lvlBtns.length; i++) {
      lvlBtns[i].style.color = c;
      lvlBtns[i].style.borderColor = c;
      lvlBtns[i].style.textShadow = '0 0 6px ' + c;
    }
  }, 200);
})();
</script>
