<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>织忆 · 认知花园</title>
<style>
:root {
  --font-scale: 1;
  --bg: #F7F4EE;
  --bg2: #EDE7DA;
  --ink: #1F1B16;
  --ink2: #3D362E;
  --muted: #7A7064;
  --rule: #D5CCBC;
  --rule2: #C5B8A4;
  --accent: #4A7C4A;
  --accent-d: #2D5A2C;
  --accent-l: #DDE9DD;
  --accent2: #B86B4C;
  --accent2-l: #F2E0D6;
  --accent3: #3D6FA8;
  --accent3-l: #D5E2F0;
  --warn: #B8860B;
  --warn-l: #F5EDD5;
  --danger: #C75B5B;
  --danger-l: #F8E0E0;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: calc(16px * var(--font-scale)); }
html.elderly-mode { font-size: calc(20px * var(--font-scale)); }
body {
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;
  background: var(--bg);
  color: var(--ink);
  overflow: hidden;
  height: 100vh;
  -webkit-font-smoothing: antialiased;
}
#app { display: flex; flex-direction: column; height: 100vh; }

/* Header */
.header {
  background: var(--accent-d);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  height: 56px;
  flex-shrink: 0;
  gap: 12px;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.header-logo {
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(255,255,255,0.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.header-title { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.02em; }
.header-sub { font-size: 0.8rem; opacity: 0.7; margin-left: 4px; }
.header-right { display: flex; align-items: center; gap: 10px; }
.view-switcher {
  display: flex; gap: 2px; background: rgba(0,0,0,0.2);
  border-radius: 100px; padding: 3px;
}
.view-btn {
  padding: 6px 16px; border: none; border-radius: 100px;
  background: transparent; color: rgba(255,255,255,0.6);
  font-size: 0.85rem; font-weight: 500; cursor: pointer;
  transition: all 0.2s;
}
.view-btn.active { background: #fff; color: var(--accent-d); font-weight: 700; }
.view-btn:hover:not(.active) { color: #fff; background: rgba(255,255,255,0.1); }
.font-scale {
  display: flex; gap: 2px; background: rgba(0,0,0,0.2);
  border-radius: 100px; padding: 3px;
}
.font-scale button {
  width: 30px; height: 30px; border: none; border-radius: 50%;
  background: transparent; color: rgba(255,255,255,0.8);
  font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
}
.font-scale button.active { background: #fff; color: var(--accent-d); }
.font-scale button:hover:not(.active) { background: rgba(255,255,255,0.15); color: #fff; }
.day-badge {
  background: rgba(255,255,255,0.12); border-radius: 100px;
  padding: 5px 14px; font-size: 0.8rem; font-weight: 600;
}

/* Main layout */
.main { flex: 1; display: flex; overflow: hidden; }
.panel-left { width: 260px; background: var(--bg); overflow-y: auto; border-right: 1px solid var(--rule); flex-shrink: 0; }
.panel-right { width: 280px; background: var(--bg); overflow-y: auto; border-left: 1px solid var(--rule); flex-shrink: 0; }
.canvas-wrap { flex: 1; background: var(--bg2); position: relative; overflow: hidden; }
.mode-elderly .panel-left { width: 280px; }
.mode-elderly .panel-right { width: 300px; }

/* Panel sections */
.panel-section { padding: 16px; }
.panel-title {
  font-size: 0.7rem; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.1em;
  margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
}
.panel-title::before { content: ''; width: 3px; height: 12px; background: var(--accent); border-radius: 2px; }

/* Voice card */
.voice-card { background: #fff; border-radius: 10px; padding: 14px; border: 1px solid var(--rule); }
.voice-textarea {
  width: 100%; border: 1px solid var(--rule); border-radius: 8px;
  padding: 10px; font-size: 0.9rem; resize: vertical; min-height: 72px;
  font-family: inherit; color: var(--ink); background: var(--bg); line-height: 1.5;
  transition: border-color 0.2s;
}
.voice-textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-l); }
.voice-actions { display: flex; gap: 8px; margin-top: 10px; }
.btn-primary {
  flex: 1; padding: 10px; border: none; border-radius: 8px;
  background: var(--accent); color: #fff; font-size: 0.85rem; font-weight: 600;
  cursor: pointer; transition: background 0.2s;
}
.btn-primary:hover { background: var(--accent-d); }
.btn-secondary {
  padding: 10px 14px; border: 1px solid var(--rule); border-radius: 8px;
  background: #fff; color: var(--ink2); font-size: 0.85rem; cursor: pointer;
  transition: all 0.2s;
}
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
.nlp-result {
  margin-top: 10px; padding: 10px; background: var(--accent-l);
  border-radius: 8px; border: 1px solid rgba(74,124,74,0.2);
  font-size: 0.8rem; line-height: 1.6; display: none;
}
.nlp-result.show { display: block; }
.nlp-result-title { font-weight: 700; color: var(--accent-d); margin-bottom: 4px; font-size: 0.75rem; }

/* Node palette */
.palette-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.palette-btn {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  border: 1px solid var(--rule); border-radius: 8px; background: #fff;
  cursor: pointer; font-size: 0.85rem; transition: all 0.2s;
}
.palette-btn:hover { border-color: var(--muted); background: var(--bg2); }
.palette-icon {
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: #fff; font-weight: 700; flex-shrink: 0;
}

/* Edge list */
.edge-list { display: flex; flex-direction: column; gap: 6px; }
.edge-btn {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  border: 1px solid var(--rule); border-radius: 8px; background: #fff;
  cursor: pointer; font-size: 0.85rem; transition: all 0.2s;
}
.edge-btn:hover { border-color: var(--muted); background: var(--bg2); }
.edge-btn.active { border-color: var(--accent); background: var(--accent-l); }
.edge-line { width: 32px; height: 0; flex-shrink: 0; }

/* Canvas */
.canvas-bg {
  position: absolute; inset: 0; opacity: 0.5; pointer-events: none;
  background-image: linear-gradient(rgba(213,204,188,0.15) 1px, transparent 1px), linear-gradient(90deg, rgba(213,204,188,0.15) 1px, transparent 1px);
  background-size: 40px 40px;
}
.canvas-svg { width: 100%; height: 100%; display: block; }
.canvas-overlay {
  position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
  background: rgba(31,27,22,0.75); color: #fff; padding: 6px 16px;
  border-radius: 100px; font-size: 0.75rem; pointer-events: none; white-space: nowrap;
}
.canvas-toolbar { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; }
.mode-btn {
  padding: 6px 14px; border: 1px solid var(--rule2); border-radius: 100px;
  background: #fff; cursor: pointer; font-size: 0.75rem; color: var(--muted);
  transition: all 0.2s;
}
.mode-btn:hover { color: var(--ink2); border-color: var(--muted); }
.mode-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* Health card */
.health-card {
  background: var(--accent-d); color: #fff; border-radius: 10px;
  padding: 20px; text-align: center; margin-bottom: 16px;
}
.health-num { font-size: 3rem; font-weight: 800; line-height: 1; }
.health-label { font-size: 0.7rem; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px; }

/* Metric rows */
.metric-row { margin-bottom: 14px; }
.metric-header { display: flex; align-items: center; justify-content: space-between; }
.metric-name { font-size: 0.85rem; font-weight: 600; color: var(--ink2); }
.metric-desc { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
.metric-val { font-size: 1.1rem; font-weight: 700; }
.metric-bar { height: 5px; background: var(--rule); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.metric-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.4s; }
.metric-delta { font-size: 0.7rem; font-weight: 600; }
.metric-delta.up { color: var(--accent); }
.metric-delta.down { color: var(--danger); }
.metric-delta.flat { color: var(--muted); }

/* Alert */
.alert-card {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px;
  border-radius: 8px; font-size: 0.85rem; border: 1px solid;
}
.alert-card.ok { background: var(--accent-l); border-color: rgba(74,124,74,0.2); }

/* Timeline */
.timeline {
  background: var(--bg2); display: flex; align-items: center;
  padding: 10px 20px; gap: 10px; overflow-x: auto;
  border-top: 1px solid var(--rule); flex-shrink: 0;
}
.timeline-label {
  font-size: 0.7rem; color: var(--muted); text-transform: uppercase;
  letter-spacing: 0.08em; font-weight: 700; white-space: nowrap; margin-right: 6px;
}
.day-card {
  flex-shrink: 0; width: 72px; height: 80px; border-radius: 8px;
  border: 1px solid var(--rule); background: #fff; cursor: pointer;
  transition: all 0.2s; position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.day-card:hover { border-color: var(--muted); background: var(--bg); }
.day-card.active { border: 2px solid var(--accent); background: var(--accent-l); }
.day-card.warn { border-color: var(--warn); background: var(--warn-l); }
.day-card.danger { border-color: var(--danger); background: var(--danger-l); }
.day-card-num { font-size: 0.85rem; font-weight: 700; }
.day-card-label { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }
.day-card-dot {
  position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%;
}
.day-card-dot.ok { background: var(--accent); }
.day-card-dot.warn { background: var(--warn); }
.day-card-dot.danger { background: var(--danger); }

/* Doctor metrics grid */
.doc-metric-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.doc-metric {
  background: #fff; border-radius: 8px; padding: 12px 10px;
  border: 1px solid var(--rule); text-align: center;
}
.doc-metric-name { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; margin-bottom: 4px; }
.doc-metric-val { font-size: 1.2rem; font-weight: 800; color: var(--ink); }

/* Iso card */
.iso-card { background: #fff; border-radius: 8px; padding: 16px; border: 1px solid var(--rule); text-align: center; margin-bottom: 16px; }
.iso-num { font-size: 2rem; font-weight: 800; }
.iso-desc { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }

/* Family stats */
.fam-hero { background: var(--accent-d); color: #fff; border-radius: 10px; padding: 24px; text-align: center; margin-bottom: 16px; }
.fam-hero-num { font-size: 3rem; font-weight: 800; }
.fam-hero-label { font-size: 0.7rem; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px; }
.fam-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.fam-stat { background: #fff; border-radius: 8px; padding: 12px; text-align: center; border: 1px solid var(--rule); }
.fam-stat-num { font-size: 1.5rem; font-weight: 700; }
.fam-stat-label { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--rule2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }

.hidden { display: none !important; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function() {
'use strict';

// ============ STATE ============
var state = {
  view: 'elderly',
  currentDay: 0,
  fontScale: 1,
  nodes: [],
  edges: [],
  nodeIdCounter: 0,
  selectedNode: null,
  selectedEdgeType: 'emotion',
  daySnapshots: {},
  baselineMetrics: null,
  dragging: null,
  dragOffset: { x: 0, y: 0 },
  animRunning: false,
  animFrame: 0,
  convergeCount: 0,
};

var SVG_W = 800, SVG_H = 600;

var NODE_TYPES = {
  person: { color: '#4A7C4A', label: '人物', icon: '人' },
  place:  { color: '#B86B4C', label: '地点', icon: '地' },
  event:  { color: '#3D6FA8', label: '事件', icon: '事' },
  item:   { color: '#7B5394', label: '物品', icon: '物' },
  self:   { color: '#2D5A2C', label: '自我', icon: '我' },
  anon:   { color: '#B8860B', label: '匿名', icon: '?' },
};
var EDGE_TYPES = {
  emotion: { color: '#4A7C4A', width: 3, dash: 'none', label: '情感' },
  time:    { color: '#3D6FA8', width: 2, dash: '6,3', label: '时间' },
  space:   { color: '#B86B4C', width: 2, dash: '2,3', label: '空间' },
  custom:  { color: '#837A6E', width: 1.5, dash: 'none', label: '关联' },
};

var LEXICON = {
  person: ['老张','老王','老李','张医生','王阿姨','孙子','孙女','儿子','女儿','老伴','邻居','朋友','医生','护士'],
  place:  ['菜市场','超市','公园','医院','药店','客厅','厨房','广场','花园','银行','家','学校','门口','院子'],
  event:  ['打太极','晨练','买菜','看病','吃药','吃饭','散步','聊天','下棋','看报纸','看电视','做饭','复诊','量血压','浇花','锻炼','回家','出门'],
  item:   ['太极剑','血压计','购物袋','保温杯','老花镜','收音机','药盒','手机','钥匙','眼镜','茶杯','拐杖','报纸','菜','药','钱包'],
};
var ALL_WORDS = [];
Object.keys(LEXICON).forEach(function(type) {
  LEXICON[type].forEach(function(w) { ALL_WORDS.push({ word: w, type: type }); });
});
ALL_WORDS.sort(function(a, b) { return b.word.length - a.word.length; });

var NODE_FEATURES = {
  '老张': { type: 'person', features: ['打太极', '穿红衣服', '公园'] },
  '老王': { type: 'person', features: ['下棋', '戴眼镜'] },
  '张医生': { type: 'person', features: ['量血压', '医院', '白大褂'] },
  '王阿姨': { type: 'person', features: ['买菜', '菜市场'] },
  '老伴': { type: 'person', features: ['做饭', '家', '陪'] },
};

var SCENARIOS = [
  { day: 1, label: '建立基准', status: 'ok', text: '今天在公园碰见老张，我们一起打太极，然后去超市买了菜，回家做了饭' },
  { day: 2, label: '基准完善', status: 'ok', text: '早上在家吃了药，老伴陪我去医院看张医生，量了血压，然后去药店买了药' },
  { day: 3, label: '正常波动', status: 'ok', text: '下午在客厅看报纸，孙子来看我，我们一起聊天看电视，很开心' },
  { day: 4, label: '正常生活', status: 'ok', text: '今天去菜市场买菜，碰见邻居王阿姨，聊了一会儿天，然后回家做饭' },
  { day: 5, label: '首个偏移', status: 'warn', text: '早上在公园晨练，老张没来，我一个人打了太极剑，然后回家做饭' },
  { day: 6, label: '匿名节点', status: 'warn', text: '今天在公园碰见那个打太极的、穿红衣服的，我们一起聊了天，然后去超市' },
  { day: 7, label: '关系错置', status: 'danger', text: '今天去医院碰见老张，他在打太极，然后我们一起去药房买药' },
];

// ============ NLP ============
function fmmSegment(text) {
  var result = [], i = 0;
  while (i < text.length) {
    var matched = false;
    for (var j = Math.min(6, text.length - i); j >= 2; j--) {
      var sub = text.substring(i, i + j);
      for (var k = 0; k < ALL_WORDS.length; k++) {
        if (ALL_WORDS[k].word === sub) {
          result.push({ word: sub, type: ALL_WORDS[k].type });
          i += j; matched = true; break;
        }
      }
      if (matched) break;
    }
    if (!matched) i++;
  }
  return result;
}

function matchAnon(features) {
  var best = null, bestScore = 0;
  Object.keys(NODE_FEATURES).forEach(function(name) {
    var info = NODE_FEATURES[name];
    if (info.type !== 'person') return;
    var score = 0, total = info.features.length;
    features.forEach(function(f) {
      info.features.forEach(function(ref) {
        if (f.indexOf(ref) >= 0 || ref.indexOf(f) >= 0) score++;
      });
    });
    var conf = total > 0 ? score / total : 0;
    if (conf > bestScore) { bestScore = conf; best = { label: name, confidence: Math.round(conf * 100) }; }
  });
  return bestScore >= 0.3 ? best : null;
}

function parseText(text) {
  var tokens = fmmSegment(text);
  var ent = { persons: [], places: [], events: [], items: [] };
  tokens.forEach(function(t) {
    var cat = t.type + 's';
    if (ent[cat] && ent[cat].indexOf(t.word) < 0) ent[cat].push(t.word);
  });

  var anonNode = null;
  var anonMatch = text.match(/那个(.+?)的(?=[，。！？]|$)/) || text.match(/那个(.+)的/);
  if (anonMatch && ent.persons.length === 0) {
    var features = anonMatch[1].split(/[、，和]/).map(function(f) { return f.replace(/的/g, '').trim(); }).filter(function(f) { return f.length > 0; });
    var matched = matchAnon(features);
    if (matched) {
      anonNode = addNode('?X', 'anon');
      anonNode.matchedTo = matched.label;
      anonNode.matchConfidence = matched.confidence;
    }
  }

  var selfNode = getSelfNode();
  ['persons','places','events','items'].forEach(function(cat) {
    var typeKey = cat.substring(0, cat.length - 1);
    ent[cat].forEach(function(word) {
      if (!findNode(word, typeKey)) addNode(word, typeKey);
    });
  });

  // Relations via patterns
  var relations = [];
  var m;
  if (m = text.match(/在(.+?)(碰见|遇见|遇到|碰到)(.+?)(?:，|。|然后|一起)/)) {
    var p1 = ent.places.find(function(p) { return m[1].indexOf(p) >= 0; });
    var p2 = ent.persons.find(function(p) { return m[3].indexOf(p) >= 0; });
    if (p1 && p2) relations.push({ type: 'space', from: p2, to: p1 });
  }
  if (m = text.match(/一起(.+?)(?:，|。|然后|去|回)/)) {
    var ev = ent.events.find(function(e) { return m[1].indexOf(e) >= 0; });
    var ps = ent.persons[0];
    if (ps && ev) relations.push({ type: 'emotion', from: ps, to: ev });
  }
  if (text.match(/然后|之后|接着/) && ent.events.length >= 2) {
    relations.push({ type: 'time', from: ent.events[0], to: ent.events[1] });
  }
  if (m = text.match(/去(.+?)(?:买|取|拿)(了)?(.+?)(?:，|。|然后|回家)/)) {
    var pl = ent.places.find(function(p) { return m[1].indexOf(p) >= 0; });
    var it = ent.items.find(function(p) { return m[3].indexOf(p) >= 0; });
    if (pl) relations.push({ type: 'space', from: 'SELF', to: pl });
    if (it) relations.push({ type: 'custom', from: 'SELF', to: it });
  }
  if (m = text.match(/(.+?)陪(我|他|她)?去(.+?)(?:看|买|量|复诊|检查)/)) {
    var pp = ent.persons.find(function(p) { return m[1].indexOf(p) >= 0; });
    var pl2 = ent.places.find(function(p) { return m[3].indexOf(p) >= 0; });
    if (pp) relations.push({ type: 'emotion', from: 'SELF', to: pp });
    if (pp && pl2) relations.push({ type: 'space', from: pp, to: pl2 });
  }
  if (m = text.match(/在(.+?)(打|做|看|吃|聊|下|散|浇|听|读|买|锻炼|休息|起床)/)) {
    var pl3 = ent.places.find(function(p) { return m[1].indexOf(p) >= 0; });
    var ev3 = ent.events.find(function(e) { return m[0].indexOf(e) >= 0; });
    if (pl3 && ev3) relations.push({ type: 'space', from: ev3, to: pl3 });
  }

  relations.forEach(function(rel) {
    var fn = rel.from === 'SELF' ? selfNode : findNode(rel.from);
    var tn = rel.to === 'SELF' ? selfNode : findNode(rel.to);
    if (fn && tn) addEdge(fn.id, tn.id, rel.type);
  });

  // Self-centered connections
  ent.persons.forEach(function(p) { var n = findNode(p, 'person'); if (n) addEdge(selfNode.id, n.id, 'emotion'); });
  ent.events.forEach(function(e) { var n = findNode(e, 'event'); if (n) addEdge(selfNode.id, n.id, 'time'); });
  ent.places.forEach(function(p) { var n = findNode(p, 'place'); if (n) addEdge(selfNode.id, n.id, 'space'); });
  ent.items.forEach(function(i) { var n = findNode(i, 'item'); if (n) addEdge(selfNode.id, n.id, 'custom'); });

  if (anonNode) {
    ent.events.forEach(function(e) { var n = findNode(e, 'event'); if (n) addEdge(anonNode.id, n.id, 'emotion'); });
    ent.places.forEach(function(p) { var n = findNode(p, 'place'); if (n) addEdge(anonNode.id, n.id, 'space'); });
    addEdge(selfNode.id, anonNode.id, 'emotion');
  }

  return { tokens: tokens, relations: relations, anonNode: anonNode };
}

// ============ GRAPH ============
function addNode(label, type, x, y) {
  var id = state.nodeIdCounter++;
  var angle = Math.random() * Math.PI * 2;
  var dist = 150 + Math.random() * 200;
  var node = {
    id: id, label: label, type: type,
    x: x != null ? x : SVG_W / 2 + Math.cos(angle) * dist,
    y: y != null ? y : SVG_H / 2 + Math.sin(angle) * dist,
    vx: 0, vy: 0,
    radius: type === 'self' ? 28 : type === 'anon' ? 22 : 20,
    isAnon: type === 'anon',
    matchedTo: null,
    matchConfidence: 0,
    fixed: false,
  };
  state.nodes.push(node);
  return node;
}

function findNode(label, type) {
  for (var i = 0; i < state.nodes.length; i++) {
    var n = state.nodes[i];
    if (n.label === label && (!type || n.type === type)) return n;
  }
  return null;
}

function getSelfNode() {
  var self = findNode('我', 'self');
  if (!self) self = addNode('我', 'self', SVG_W / 2, SVG_H / 2);
  return self;
}

function addEdge(fromId, toId, type, weight) {
  if (fromId === toId) return;
  for (var i = 0; i < state.edges.length; i++) {
    var e = state.edges[i];
    if ((e.from === fromId && e.to === toId) || (e.from === toId && e.to === fromId)) return;
  }
  state.edges.push({ from: fromId, to: toId, type: type, weight: weight || 1 });
}

function computeMetrics() {
  var nodes = state.nodes, edges = state.edges;
  var n = nodes.length, e = edges.length;
  if (n === 0) return null;

  var adj = {};
  nodes.forEach(function(nd) { adj[nd.id] = []; });
  edges.forEach(function(ed) {
    if (!adj[ed.from]) adj[ed.from] = [];
    if (!adj[ed.to]) adj[ed.to] = [];
    adj[ed.from].push(ed.to);
    adj[ed.to].push(ed.from);
  });

  // Connectivity
  var visited = {}, components = 0, maxComp = 0;
  nodes.forEach(function(nd) {
    if (visited[nd.id]) return;
    components++;
    var stack = [nd.id], size = 0;
    while (stack.length) {
      var id = stack.pop();
      if (visited[id]) continue;
      visited[id] = true; size++;
      (adj[id] || []).forEach(function(nid) { if (!visited[nid]) stack.push(nid); });
    }
    if (size > maxComp) maxComp = size;
  });
  var connectivity = maxComp / n;

  // Degrees
  var degrees = nodes.map(function(nd) { return (adj[nd.id] || []).length; });
  var avgDeg = degrees.reduce(function(a, b) { return a + b; }, 0) / n;

  // Clustering
  var ccList = [];
  nodes.forEach(function(nd) {
    var neigh = adj[nd.id] || [];
    var k = neigh.length;
    if (k < 2) return;
    var tri = 0;
    for (var i = 0; i < k; i++)
      for (var j = i + 1; j < k; j++)
        if ((adj[neigh[i]] || []).indexOf(neigh[j]) >= 0) tri++;
    ccList.push((2 * tri) / (k * (k - 1)));
  });
  var clustering = ccList.length > 0 ? ccList.reduce(function(a, b) { return a + b; }, 0) / ccList.length : 0;

  // Centrality
  var selfNode = nodes.find(function(nd) { return nd.type === 'self'; });
  var selfDeg = selfNode ? (adj[selfNode.id] || []).length : 0;
  var centrality = n > 1 ? selfDeg / (n - 1) : 0;

  // Entropy
  var typeCounts = {};
  edges.forEach(function(ed) { typeCounts[ed.type] = (typeCounts[ed.type] || 0) + 1; });
  var entropy = 0;
  Object.keys(typeCounts).forEach(function(k) {
    var p = typeCounts[k] / e;
    entropy -= p * Math.log2(p);
  });
  var entropyNorm = e > 0 ? entropy / Math.log2(4) : 0;

  // Density
  var density = n > 1 ? (2 * e) / (n * (n - 1)) : 0;

  // Shortest paths (BFS from each node)
  var sumDist = 0, distCount = 0, effSum = 0;
  nodes.forEach(function(src) {
    var d = {};
    nodes.forEach(function(nd) { d[nd.id] = Infinity; });
    d[src.id] = 0;
    var q = [src.id], qi = 0;
    while (qi < q.length) {
      var u = q[qi++];
      (adj[u] || []).forEach(function(v) {
        if (d[v] === Infinity) { d[v] = d[u] + 1; q.push(v); }
      });
    }
    nodes.forEach(function(nd) {
      if (d[nd.id] !== Infinity && d[nd.id] > 0) {
        sumDist += d[nd.id]; distCount++;
        effSum += 1 / d[nd.id];
      }
    });
  });
  var avgPathLen = distCount > 0 ? sumDist / distCount : 0;
  var globalEff = n > 1 ? effSum / (n * (n - 1)) : 0;

  // Small-world
  var randCC = avgDeg > 1 ? avgDeg / n : 0;
  var randPL = avgDeg > 0 ? Math.log(n) / Math.log(avgDeg) : 0;
  var smallWorld = (randCC > 0 && randPL > 0) ? (clustering / randCC) / (avgPathLen / randPL) : 0;

  return {
    connectivity: connectivity,
    clustering: clustering,
    centrality: centrality,
    entropy: entropyNorm,
    density: density,
    avgPathLen: avgPathLen,
    globalEff: globalEff,
    smallWorld: smallWorld,
    nodeCount: n,
    edgeCount: e,
    anonCount: nodes.filter(function(nd) { return nd.isAnon; }).length,
  };
}

function computeHealth(m) {
  if (!m) return 0;
  var s = m.connectivity * 0.2 + m.clustering * 0.15 + m.centrality * 0.15 +
          m.entropy * 0.1 + m.density * 0.1 + m.globalEff * 0.15 +
          Math.min(m.smallWorld, 2) * 0.5 * 0.15;
  return Math.round(Math.min(100, s * 100));
}

// ============ FORCE LAYOUT ============
function tickLayout() {
  var nodes = state.nodes, edges = state.edges;
  if (nodes.length === 0) return;
  var maxV = 0;

  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    n.vx *= 0.94; n.vy *= 0.94;
  }

  // Repulsion (Coulomb-like)
  for (var i = 0; i < nodes.length; i++) {
    for (var j = i + 1; j < nodes.length; j++) {
      var dx = nodes[j].x - nodes[i].x;
      var dy = nodes[j].y - nodes[i].y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 1) { dist = 1; dx = Math.random() - 0.5; dy = Math.random() - 0.5; }
      var force = 28000 / (dist * dist);
      var fx = (dx / dist) * force, fy = (dy / dist) * force;
      nodes[i].vx -= fx; nodes[i].vy -= fy;
      nodes[j].vx += fx; nodes[j].vy += fy;
    }
  }

  // Collision resolution
  for (var i = 0; i < nodes.length; i++) {
    for (var j = i + 1; j < nodes.length; j++) {
      var dx = nodes[j].x - nodes[i].x;
      var dy = nodes[j].y - nodes[i].y;
      var dist = Math.sqrt(dx * dx + dy * dy) || 1;
      var minDist = nodes[i].radius + nodes[j].radius + 12;
      if (dist < minDist) {
        var overlap = (minDist - dist) * 0.5;
        var ox = (dx / dist) * overlap;
        var oy = (dy / dist) * overlap;
        if (!nodes[i].fixed) { nodes[i].x -= ox; nodes[i].y -= oy; }
        if (!nodes[j].fixed) { nodes[j].x += ox; nodes[j].y += oy; }
      }
    }
  }

  // Attraction (spring)
  edges.forEach(function(e) {
    var a = null, b = null;
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].id === e.from) a = nodes[i];
      if (nodes[i].id === e.to) b = nodes[i];
    }
    if (!a || !b) return;
    var dx = b.x - a.x, dy = b.y - a.y;
    var dist = Math.sqrt(dx * dx + dy * dy) || 1;
    var targetDist = 180;
    var force = (dist - targetDist) * 0.03;
    var fx = (dx / dist) * force, fy = (dy / dist) * force;
    a.vx += fx; a.vy += fy;
    b.vx -= fx; b.vy -= fy;
  });

  // Center gravity
  nodes.forEach(function(n) {
    n.vx += (SVG_W / 2 - n.x) * 0.001;
    n.vy += (SVG_H / 2 - n.y) * 0.001;
  });

  // Apply
  var pad = 70;
  nodes.forEach(function(n) {
    if (n.fixed) return;
    n.x += n.vx; n.y += n.vy;
    n.x = Math.max(pad, Math.min(SVG_W - pad, n.x));
    n.y = Math.max(pad, Math.min(SVG_H - pad, n.y));
    var v = Math.sqrt(n.vx * n.vx + n.vy * n.vy);
    if (v > maxV) maxV = v;
  });

  // Convergence check
  if (maxV < 0.15) {
    state.convergeCount++;
    if (state.convergeCount > 60) {
      stopAnimation();
    }
  } else {
    state.convergeCount = 0;
  }
}

function startAnimation() {
  if (state.animRunning) return;
  state.animRunning = true;
  state.convergeCount = 0;
  function loop() {
    if (!state.animRunning) return;
    tickLayout();
    renderCanvas();
    state.animFrame = requestAnimationFrame(loop);
  }
  state.animFrame = requestAnimationFrame(loop);
}

function stopAnimation() {
  state.animRunning = false;
  if (state.animFrame) cancelAnimationFrame(state.animFrame);
}

// ============ RENDER ============
function el(tag, attrs, children) {
  var e = document.createElement(tag);
  if (attrs) {
    Object.keys(attrs).forEach(function(k) {
      if (k === 'style' && typeof attrs[k] === 'object') {
        Object.assign(e.style, attrs[k]);
      } else if (k === 'className') {
        e.className = attrs[k];
      } else if (k.indexOf('on') === 0) {
        e.addEventListener(k.substring(2).toLowerCase(), attrs[k]);
      } else {
        e.setAttribute(k, attrs[k]);
      }
    });
  }
  if (children) {
    if (typeof children === 'string') e.textContent = children;
    else if (Array.isArray(children)) children.forEach(function(c) {
      if (typeof c === 'string') e.appendChild(document.createTextNode(c));
      else if (c) e.appendChild(c);
    });
  }
  return e;
}

function updateSVGDimensions() {
  var wrap = document.getElementById('canvas-wrap');
  if (!wrap) return;
  var rect = wrap.getBoundingClientRect();
  if (rect.width > 50 && rect.height > 50) {
    SVG_W = Math.round(rect.width);
    SVG_H = Math.round(rect.height);
    var svg = document.getElementById('canvas-svg');
    if (svg) {
      svg.setAttribute('viewBox', '0 0 ' + SVG_W + ' ' + SVG_H);
    }
  }
}

function renderCanvas() {
  var existing = document.getElementById('canvas-wrap');
  if (existing) {
    updateSVGDimensions();
    // Only update SVG content
    updateSVG(existing);
    return existing;
  }
  var wrap = el('div', { className: 'canvas-wrap', id: 'canvas-wrap' });
  wrap.appendChild(el('div', { className: 'canvas-bg' }));

  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 ' + SVG_W + ' ' + SVG_H);
  svg.setAttribute('class', 'canvas-svg');
  svg.setAttribute('id', 'canvas-svg');
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  svg.addEventListener('click', handleSvgClick);
  svg.addEventListener('mousemove', handleMouseMove);
  svg.addEventListener('mouseup', handleMouseUp);
  svg.addEventListener('mouseleave', handleMouseUp);
  wrap.appendChild(svg);

  // Update dimensions after DOM insertion
  setTimeout(function() {
    updateSVGDimensions();
    if (state.nodes.length > 0) startAnimation();
  }, 50);

  // Toolbar
  var toolbar = el('div', { className: 'canvas-toolbar' });
  toolbar.appendChild(el('button', { className: 'mode-btn active' }, '织网模式'));
  toolbar.appendChild(el('button', { className: 'mode-btn' }, '基准对比'));
  wrap.appendChild(toolbar);

  wrap.appendChild(el('div', { className: 'canvas-overlay' }, '点击空白添加节点 · 拖拽移动 · 选中后点击另一节点连线'));

  // Handle window resize
  window.addEventListener('resize', function() {
    updateSVGDimensions();
    if (state.nodes.length > 0) startAnimation();
  });

  return wrap;
}

function updateSVG(wrap) {
  var svg = document.getElementById('canvas-svg');
  if (!svg) return;
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  var scale = state.view === 'elderly' ? 1.3 : 1;

  // Edges
  state.edges.forEach(function(edge, i) {
    var from = null, to = null;
    for (var j = 0; j < state.nodes.length; j++) {
      if (state.nodes[j].id === edge.from) from = state.nodes[j];
      if (state.nodes[j].id === edge.to) to = state.nodes[j];
    }
    if (!from || !to) return;
    var et = EDGE_TYPES[edge.type];
    var isSel = state.selectedNode && (edge.from === state.selectedNode.id || edge.to === state.selectedNode.id);
    var lineOpacity = isSel ? 1 : (state.selectedNode ? 0.15 : 0.6);
    var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', from.x);
    line.setAttribute('y1', from.y);
    line.setAttribute('x2', to.x);
    line.setAttribute('y2', to.y);
    line.setAttribute('stroke', et.color);
    line.setAttribute('stroke-width', et.width * scale * (isSel ? 1.5 : 1));
    line.setAttribute('stroke-dasharray', et.dash);
    line.setAttribute('opacity', lineOpacity);
    svg.appendChild(line);

    // Edge label
    if (lineOpacity > 0.3) {
      var mx = (from.x + to.x) / 2;
      var my = (from.y + to.y) / 2;
      var labelText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      labelText.setAttribute('x', mx);
      labelText.setAttribute('y', my - 4);
      labelText.setAttribute('text-anchor', 'middle');
      labelText.setAttribute('fill', et.color);
      labelText.setAttribute('font-size', 9 * scale);
      labelText.setAttribute('font-weight', '600');
      labelText.setAttribute('opacity', lineOpacity * 0.8);
      labelText.setAttribute('pointer-events', 'none');
      labelText.textContent = et.label;
      svg.appendChild(labelText);
    }
  });

  // Nodes
  state.nodes.forEach(function(node) {
    var nt = NODE_TYPES[node.type];
    var isSel = state.selectedNode && state.selectedNode.id === node.id;
    var isDim = state.selectedNode && state.selectedNode.id !== node.id &&
      !state.edges.some(function(e) {
        return (e.from === state.selectedNode.id && e.to === node.id) ||
               (e.to === state.selectedNode.id && e.from === node.id);
      });
    var r = node.radius * scale;

    var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('transform', 'translate(' + node.x + ',' + node.y + ')');
    g.style.cursor = 'pointer';

    // Selection halo
    if (isSel) {
      var halo = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      halo.setAttribute('r', r + 8);
      halo.setAttribute('fill', 'none');
      halo.setAttribute('stroke', nt.color);
      halo.setAttribute('stroke-width', 2);
      halo.setAttribute('opacity', 0.4);
      g.appendChild(halo);
    }

    var circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('r', r);
    circle.setAttribute('fill', nt.color);
    circle.setAttribute('stroke', '#fff');
    circle.setAttribute('stroke-width', 2);
    circle.setAttribute('opacity', isDim ? 0.25 : 1);
    g.appendChild(circle);

    // Icon text inside circle
    var icon = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    icon.setAttribute('text-anchor', 'middle');
    icon.setAttribute('dominant-baseline', 'central');
    icon.setAttribute('fill', '#fff');
    icon.setAttribute('font-size', (node.type === 'self' ? 16 : 13) * scale);
    icon.setAttribute('font-weight', '700');
    icon.setAttribute('opacity', isDim ? 0.25 : 1);
    icon.setAttribute('pointer-events', 'none');
    icon.textContent = nt.icon || node.label.charAt(0);
    g.appendChild(icon);

    // Label below circle
    var labelText = node.label.length > 5 ? node.label.substring(0, 4) + '…' : node.label;
    var labelBg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    var labelW = labelText.length * 12 * scale + 10;
    labelBg.setAttribute('x', -labelW / 2);
    labelBg.setAttribute('y', r + 4);
    labelBg.setAttribute('width', labelW);
    labelBg.setAttribute('height', 18 * scale);
    labelBg.setAttribute('rx', 4);
    labelBg.setAttribute('fill', '#fff');
    labelBg.setAttribute('stroke', nt.color);
    labelBg.setAttribute('stroke-width', 1);
    labelBg.setAttribute('opacity', isDim ? 0.25 : 0.95);
    labelBg.setAttribute('pointer-events', 'none');
    g.appendChild(labelBg);

    var label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    label.setAttribute('text-anchor', 'middle');
    label.setAttribute('dominant-baseline', 'central');
    label.setAttribute('y', r + 4 + 9 * scale);
    label.setAttribute('fill', nt.color);
    label.setAttribute('font-size', 11 * scale);
    label.setAttribute('font-weight', '600');
    label.setAttribute('opacity', isDim ? 0.25 : 1);
    label.setAttribute('pointer-events', 'none');
    label.textContent = labelText;
    g.appendChild(label);

    if (node.isAnon && node.matchedTo) {
      var t2 = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t2.setAttribute('y', r + 12);
      t2.setAttribute('text-anchor', 'middle');
      t2.setAttribute('fill', nt.color);
      t2.setAttribute('font-size', 8 * scale);
      t2.setAttribute('font-weight', '600');
      t2.textContent = '→' + node.matchedTo;
      g.appendChild(t2);
    }

    g.addEventListener('mousedown', function(e) { handleNodeMouseDown(e, node); });
    g.addEventListener('click', function(e) { handleNodeClick(e, node); });
    svg.appendChild(g);
  });
}

function renderRightPanel() {
  var panel = el('div', { className: 'panel-right' });
  var section = el('div', { className: 'panel-section' });
  var m = computeMetrics();
  var health = computeHealth(m);

  if (state.view === 'family') {
    section.appendChild(el('div', { className: 'panel-title' }, '网络结构指标'));
    if (m) {
      var items = [
        { name: '记忆网密度', val: (m.density * 100).toFixed(1) + '%', desc: '实际连接/最大可能' },
        { name: '最大连通度', val: Math.round(m.connectivity * 100) + '%', desc: '最大连通子图占比' },
        { name: '聚类系数', val: Math.round(m.clustering * 100) + '%', desc: '局部三角关系密度' },
        { name: '平均路径长度', val: m.avgPathLen.toFixed(2), desc: '信息传递效率' },
        { name: '小世界系数σ', val: m.smallWorld.toFixed(2), desc: '整合/分离平衡' },
      ];
      items.forEach(function(it) {
        section.appendChild(el('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 0', borderBottom: '1px solid var(--rule)' } }, [
          el('div', {}, [
            el('div', { style: { fontSize: '0.85rem', fontWeight: '600' } }, it.name),
            el('div', { style: { fontSize: '0.7rem', color: 'var(--muted)' } }, it.desc),
          ]),
          el('div', { style: { fontSize: '1.2rem', fontWeight: '800' } }, it.val),
        ]));
      });
    }
    panel.appendChild(section);
    return panel;
  }

  if (state.view === 'doctor') {
    section.appendChild(el('div', { className: 'panel-title' }, '拓扑同构分析'));
    section.appendChild(el('div', { className: 'iso-card' }, [
      el('div', { className: 'iso-num' }, '100%'),
      el('div', { className: 'iso-desc' }, '拓扑结构高度一致，网络形态稳定'),
    ]));
    section.appendChild(el('div', { className: 'panel-title', style: { marginTop: '16px' } }, '结构偏移预警'));
    section.appendChild(el('div', { className: 'alert-card ok' }, [
      el('span', { style: { fontSize: '1.2rem' } }, '✓'),
      el('div', {}, [
        el('div', { style: { fontSize: '0.85rem', fontWeight: '600' } }, '网络结构正常'),
        el('div', { style: { fontSize: '0.7rem', color: 'var(--muted)' } }, '与基准图拓扑一致，无偏移信号'),
      ]),
    ]));
    panel.appendChild(section);
    return panel;
  }

  // Elderly
  section.appendChild(el('div', { className: 'health-card' }, [
    el('div', { className: 'health-num' }, String(health)),
    el('div', { className: 'health-label' }, '记忆网健康度'),
  ]));
  section.appendChild(el('div', { className: 'panel-title' }, '今日记忆状态'));

  if (m) {
    var metrics = [
      { name: '网络连通度', desc: '最大连通子图占比', val: m.connectivity },
      { name: '聚类系数', desc: '局部三角关系密度', val: m.clustering },
      { name: '自我中心度', desc: '"我"节点度数占比', val: m.centrality },
      { name: '时序熵', desc: '关系类型多样性', val: m.entropy },
    ];
    metrics.forEach(function(mt) {
      var row = el('div', { className: 'metric-row' });
      row.appendChild(el('div', { className: 'metric-header' }, [
        el('div', {}, [
          el('div', { className: 'metric-name' }, mt.name),
          el('div', { className: 'metric-desc' }, mt.desc),
        ]),
        el('div', { style: { textAlign: 'right' } }, [
          el('div', { className: 'metric-val' }, Math.round(mt.val * 100) + '%'),
        ]),
      ]));
      row.appendChild(el('div', { className: 'metric-bar' }, [
        el('div', { className: 'metric-bar-fill', style: { width: Math.min(100, mt.val * 100) + '%' } }),
      ]));
      section.appendChild(row);
    });
  }

  section.appendChild(el('div', { className: 'alert-card ok', style: { marginTop: '8px' } }, [
    el('span', { style: { fontSize: '1.2rem' } }, '✓'),
    el('div', { style: { fontSize: '0.85rem' } }, '今天记忆网络很好，继续保持'),
  ]));

  panel.appendChild(section);
  return panel;
}

function renderTimeline() {
  var tl = el('div', { className: 'timeline' });
  tl.appendChild(el('span', { className: 'timeline-label' }, '时序网络'));
  SCENARIOS.forEach(function(s) {
    var card = el('button', {
      className: 'day-card' +
        (state.currentDay === s.day - 1 ? ' active' : '') +
        (s.status === 'warn' ? ' warn' : '') +
        (s.status === 'danger' ? ' danger' : ''),
      onclick: function() { state.currentDay = s.day - 1; render(); }
    }, [
      el('span', { className: 'day-card-num' }, 'D' + s.day),
      el('span', { className: 'day-card-label' }, s.label.substring(0, 2)),
      el('span', { className: 'day-card-dot ' + s.status }),
    ]);
    tl.appendChild(card);
  });
  return tl;
}

// ============ INTERACTION ============
function switchView(view) {
  state.view = view;
  document.documentElement.classList.toggle('elderly-mode', view === 'elderly');
  document.body.classList.toggle('mode-elderly', view === 'elderly');
  render();
}

function setFontScale(s) {
  state.fontScale = s;
  document.documentElement.style.setProperty('--font-scale', String(s));
  render();
}

function handleSvgClick(e) {
  if (state.dragging !== null) return;
  if (e.target.tagName === 'circle' || e.target.tagName === 'text' || e.target.tagName === 'g') return;
  var svg = document.getElementById('canvas-svg');
  if (!svg) return;
  var rect = svg.getBoundingClientRect();
  var x = (e.clientX - rect.left) * (SVG_W / rect.width);
  var y = (e.clientY - rect.top) * (SVG_H / rect.height);
  if (state.selectedNode) {
    state.selectedNode = null;
    renderCanvas();
    return;
  }
  // Click empty space: add node with selected type
  var type = state.selectedEdgeType === 'emotion' ? 'person' : state.selectedEdgeType === 'space' ? 'place' : state.selectedEdgeType === 'time' ? 'event' : 'item';
  addNode('新节点', type, x, y);
  startAnimation();
  renderRightPanelOnly();
}

function handleNodeMouseDown(e, node) {
  e.stopPropagation();
  state.dragging = node.id;
  var svg = document.getElementById('canvas-svg');
  var rect = svg.getBoundingClientRect();
  state.dragOffset = {
    x: (e.clientX - rect.left) * (SVG_W / rect.width) - node.x,
    y: (e.clientY - rect.top) * (SVG_H / rect.height) - node.y,
  };
  node.fixed = true;
  stopAnimation();
}

function handleMouseMove(e) {
  if (state.dragging === null) return;
  var svg = document.getElementById('canvas-svg');
  if (!svg) return;
  var rect = svg.getBoundingClientRect();
  var x = (e.clientX - rect.left) * (SVG_W / rect.width) - state.dragOffset.x;
  var y = (e.clientY - rect.top) * (SVG_H / rect.height) - state.dragOffset.y;
  for (var i = 0; i < state.nodes.length; i++) {
    if (state.nodes[i].id === state.dragging) {
      state.nodes[i].x = Math.max(40, Math.min(SVG_W - 40, x));
      state.nodes[i].y = Math.max(40, Math.min(SVG_H - 40, y));
      break;
    }
  }
  renderCanvas();
}

function handleMouseUp() {
  if (state.dragging !== null) {
    for (var i = 0; i < state.nodes.length; i++) {
      if (state.nodes[i].id === state.dragging) {
        state.nodes[i].fixed = false;
        break;
      }
    }
    state.dragging = null;
    startAnimation();
  }
}

function handleNodeClick(e, node) {
  e.stopPropagation();
  if (state.selectedNode && state.selectedNode.id !== node.id) {
    addEdge(state.selectedNode.id, node.id, state.selectedEdgeType);
    state.selectedNode = null;
    startAnimation();
    renderRightPanelOnly();
  } else {
    state.selectedNode = (state.selectedNode && state.selectedNode.id === node.id) ? null : node;
    renderCanvas();
  }
}

function renderRightPanelOnly() {
  var old = document.querySelector('.panel-right');
  if (old) {
    var newPanel = renderRightPanel();
    old.parentNode.replaceChild(newPanel, old);
  }
}

// ============ INIT ============
function init() {
  document.documentElement.classList.add('elderly-mode');
  document.body.classList.add('mode-elderly');
  document.documentElement.style.setProperty('--font-scale', '1');
  getSelfNode();
  render();
  startAnimation();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
