      var pages = document.querySelectorAll('.page');
      pages.forEach(function(p) { p.classList.remove('active'); });
      document.getElementById(pageId).classList.add('active');

      /* Update nav */
      var navItems = document.querySelectorAll('.nav-item');
      navItems.forEach(function(n) { n.classList.remove('active'); });
      var navMap = { 'page-home': 0, 'page-discover': 2, 'page-profile': 3 };
      if (navMap[pageId] !== undefined) {
        navItems[navMap[pageId]].classList.add('active');
      }

      /* Hide bottom nav on product/write pages */
      var bottomNav = document.getElementById('bottomNav');
      if (pageId === 'page-product' || pageId === 'page-write') {
        bottomNav.style.display = 'none';
      } else {
        bottomNav.style.display = 'flex';
      }

      keys.forEach(function(key) {
        var p = products[key];
        html += '<div class="demo-barcode-item" onclick="openProduct(\'' + key + '\')">' +
          '<div class="emoji">' + p.emoji + '</div>' +
          '<div class="info">' +
          '<div class="name">' + p.name + '</div>' +
          '<div class="code">' + key + '</div>' +
          '</div></div>';
      });
      list.innerHTML = html;
    }

    /* ===== BARCODE SEARCH ===== */
    function handleBarcodeSearch() {
      var input = document.getElementById('barcodeInput').value.trim();
      if (!input) {
        showToast('请输入条形码');
        return;
      }
      if (products[input]) {
        openProduct(input);
      } else {
        showToast('未找到该商品，请尝试 Demo 商品');
      }
    }

    /* ===== PRODUCT DETAIL ===== */
    function openProduct(barcode) {
      currentProduct = products[barcode];
      if (!currentProduct) return;

      previousPage = document.querySelector('.page.active').id;

      /* Product card */
      var card = document.getElementById('productCard');
      card.innerHTML =
        '<div class="product-icon">' + currentProduct.emoji + '</div>' +
        '<h2>' + currentProduct.name + '</h2>' +
        '<div class="barcode">条形码: ' + currentProduct.barcode + '</div>' +
        '<div class="product-stats">' +
        '<div class="product-stat"><div class="num">' + currentProduct.reviews.length + '</div><div class="label">评价数</div></div>' +
        '<div class="product-stat"><div class="num">' + currentProduct.tags.length + '</div><div class="label">标签数</div></div>' +
        '<div class="product-stat"><div class="num">' + getAvgRating(currentProduct) + '</div><div class="label">平均评分</div></div>' +
        '</div>';

      /* Tag cloud */
      var tagCloud = document.getElementById('tagCloud');
      var tagHtml = '';
      currentProduct.tags.forEach(function(t) {
        tagHtml += '<span class="tag-item ' + t.type + '">' + t.text + ' <span class="count">' + t.count + '</span></span>';
      });
      tagCloud.innerHTML = tagHtml;

      /* Reviews */
      document.getElementById('reviewCount').textContent = currentProduct.reviews.length + ' 条';
      renderReviews();

      showPage('page-product');
    }

    function getAvgRating(product) {
      var sum = 0;
      product.reviews.forEach(function(r) { sum += r.rating; });
      return (sum / product.reviews.length).toFixed(1);
    }

    function renderReviews() {
      var list = document.getElementById('reviewList');
      var html = '';
      currentProduct.reviews.forEach(function(r, i) {
        var tagHtml = r.tags.map(function(t) {
          var type = isPositiveTag(t) ? 'positive' : 'negative';
          return '<span class="rtag ' + type + '">' + t + '</span>';
        }).join('');

        var starsHtml = '';
        for (var s = 0; s < 5; s++) {
          if (s < r.rating) {
            starsHtml += '<svg viewBox="0 0 24 24" width="14" height="14"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="#fdcb6e"/></svg>';
          } else {
            starsHtml += '<svg viewBox="0 0 24 24" width="14" height="14"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="#dfe6e9"/></svg>';
          }
        }

        html += '<div class="review-item">' +
          '<div class="review-header">' +
          '<div class="review-avatar">' + r.avatar + '</div>' +
          '<div class="review-meta"><div class="name">' + r.user + '</div><div class="time">' + r.time + '</div></div>' +
          '</div>' +
          '<div style="display:flex;align-items:center;gap:4px;margin-bottom:6px;">' + starsHtml + '</div>' +
          '<div class="review-tags">' + tagHtml + '</div>' +
          '<div class="review-text">' + r.text + '</div>' +
          '<div class="review-actions">' +
          '<div class="review-action" onclick="toggleLike(this, ' + i + ')">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>' +
          '<span>' + r.likes + '</span></div>' +
          '<div class="review-action" onclick="showToast(\'评论功能开发中\')">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' +
          '<span>回复</span></div>' +
          '</div></div>';
      });
      list.innerHTML = html;
    }

    function isPositiveTag(tag) {
      var negativeTags = ['不推荐', '有点淡', '有点咸', '有点贵', '价格贵', '不健康', '和普通没区别', '容易碎', '有点甜'];
      return negativeTags.indexOf(tag) === -1;
    }

    function toggleLike(el, index) {
      var review = currentProduct.reviews[index];
      if (el.classList.contains('liked')) {
        el.classList.remove('liked');
        review.likes--;
      } else {
        el.classList.add('liked');
        review.likes++;
      }
      el.querySelector('span').textContent = review.likes;
    }

    /* ===== WRITE REVIEW ===== */
    function openWriteReview() {
      if (!currentUser) {
        pendingWriteReview = true;
        showLoginModal();
        return;
      }
      selectedRating = 0;
      selectedTags = [];
      document.getElementById('reviewTextarea').value = '';
      document.getElementById('charCount').textContent = '0/50';
      document.getElementById('charCount').classList.remove('over');

      /* Product preview */
      var preview = document.getElementById('writeProductPreview');
      preview.innerHTML =
        '<div class="emoji">' + currentProduct.emoji + '</div>' +
        '<div class="info"><div class="name">' + currentProduct.name + '</div><div class="code">' + currentProduct.barcode + '</div></div>';

      /* Rating stars */
      renderRatingStars();

      /* Tag selector */
      var selector = document.getElementById('tagSelector');
      var allTags = currentProduct.tags.map(function(t) { return t.text; });
      /* Add some extra tags */
      var extraTags = ['回购', '推荐', '一般', '失望'];
      extraTags.forEach(function(t) {
        if (allTags.indexOf(t) === -1) allTags.push(t);
      });
      var tagHtml = '';
      allTags.forEach(function(t) {
        tagHtml += '<div class="tag-option" onclick="toggleTag(this, \'' + t + '\')">' + t + '</div>';
      });
      selector.innerHTML = tagHtml;

      showPage('page-write');
    }

    function renderRatingStars() {
      var container = document.getElementById('ratingStars');
      var html = '';
      for (var i = 1; i <= 5; i++) {
        var fillClass = i <= selectedRating ? 'star-fill' : 'star-empty';
        html += '<div class="rating-star" onclick="setRating(' + i + ')">' +
          '<svg viewBox="0 0 24 24"><polygon class="' + fillClass + '" points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>' +
          '</div>';
      }
      container.innerHTML = html;
    }

    function setRating(rating) {
      selectedRating = rating;
      renderRatingStars();
    }

    function toggleTag(el, tag) {
      var idx = selectedTags.indexOf(tag);
      if (idx === -1) {
        if (selectedTags.length >= 3) {
          showToast('最多选择3个标签');
          return;
        }
        selectedTags.push(tag);
        el.classList.add('selected');
      } else {
        selectedTags.splice(idx, 1);
        el.classList.remove('selected');
      }
    }

    function updateCharCount() {
      var textarea = document.getElementById('reviewTextarea');
      var count = textarea.value.length;
      var counter = document.getElementById('charCount');
      counter.textContent = count + '/50';
      if (count > 50) {
        counter.classList.add('over');
      } else {
        counter.classList.remove('over');
      }
    }

    function submitReview() {
      if (selectedRating === 0) {
        showToast('请选择评分');
        return;
      }
      if (selectedTags.length === 0) {
        showToast('请至少选择一个标签');
        return;
      }
      var text = document.getElementById('reviewTextarea').value.trim();
      if (!text) {
        showToast('请写一段短评');
        return;
      }
      if (text.length > 50) {
        showToast('评价不能超过50字');
        return;
      }

      /* Add review to product */
      var newReview = {
        user: currentUser,
        avatar: currentUser.charAt(0).toUpperCase(),
        time: '刚刚',
        rating: selectedRating,
        tags: selectedTags.slice(),
        text: text,
        likes: 0
      };
      currentProduct.reviews.unshift(newReview);

      /* Update tag counts */
      selectedTags.forEach(function(tag) {
        var found = false;
        currentProduct.tags.forEach(function(t) {
          if (t.text === tag) { t.count++; found = true; }
        });
        if (!found) {
          currentProduct.tags.push({ text: tag, count: 1, type: isPositiveTag(tag) ? 'positive' : 'negative' });
        }
      });

      /* Sort tags by count */
      currentProduct.tags.sort(function(a, b) { return b.count - a.count; });

      /* Update profile */
      document.getElementById('profileReviewCount').textContent =
        parseInt(document.getElementById('profileReviewCount').textContent) + 1;

      showToast('评价发布成功！');
      closeWriteReview();

      /* Refresh product page */
      openProduct(currentProduct.barcode);
    }

    function closeWriteReview() {
      showPage('page-product');
    }

    /* ===== DISCOVER ===== */
    function renderDiscoverList() {
      var list = document.getElementById('discoverList');
      var html = '';
      var keys = Object.keys(products);
      keys.forEach(function(key) {
        var p = products[key];
        var latestReview = p.reviews[0];
        html += '<div class="discover-item" onclick="openProduct(\'' + key + '\')">' +
          '<div class="emoji">' + p.emoji + '</div>' +
          '<div class="info">' +
          '<h4>' + p.name + '</h4>' +
          '<p>' + (latestReview ? latestReview.text : '') + '</p>' +
          '<div class="meta">' +
          '<span>' + p.reviews.length + ' 条评价</span>' +
          '<span>' + (latestReview ? latestReview.user : '') + '</span>' +
          '</div></div></div>';
      });
      list.innerHTML = html;
    }

    function switchDiscoverTab(el, type) {
      document.querySelectorAll('.discover-tab').forEach(function(t) { t.classList.remove('active'); });
      el.classList.add('active');
      if (type === 'new') {
        showToast('最新排序已应用');
      } else if (type === 'nearby') {
        showToast('附近功能需要定位权限');
      }
    }

    /* ===== LOGIN ===== */
    function showLoginModal() {
      document.getElementById('loginModal').classList.add('active');
    }

    function closeLoginModal() {
      document.getElementById('loginModal').classList.remove('active');
    }

    function handleLogin() {
      var nickname = document.getElementById('loginNickname').value.trim();
      if (!nickname) {
        showToast('请输入昵称');
        return;
      }
      currentUser = nickname;
      document.getElementById('profileName').textContent = nickname;
      document.getElementById('profileBio').textContent = '已发表 ' + document.getElementById('profileReviewCount').textContent + ' 条评价';
      document.getElementById('profileAvatar').textContent = nickname.charAt(0).toUpperCase();
      closeLoginModal();
      showToast('登录成功，欢迎 ' + nickname + '！');
      if (pendingWriteReview) {
        pendingWriteReview = false;
        openWriteReview();
      }
    }

    /* ===== TOAST ===== */
    function showToast(msg) {
      var toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(function() {
        toast.classList.remove('show');
      }, 2000);
    }

    /* ===== START ===== */
    init();
  </script>
</body>
</html>
