<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三餐食记 - 项目宣传海报</title>
    <style>
        :root {
            --primary: #FF9F43;
            --primary-light: #FFEAA7;
            --primary-soft: #FFF5E6;
            --accent: #54A0FF;
            --accent-soft: #E8F4FD;
            --success: #5CD85C;
            --success-soft: #E8F8E8;
            --bg: #FFFFFF;
            --card-bg: #FAFAFA;
            --text: #2D3436;
            --text-secondary: #636E72;
            --text-light: #B2BEC3;
            --border: #E8ECEF;
            --shadow: 0 4px 24px rgba(255, 159, 67, 0.08);
            --radius: 16px;
            --font-sans: 'PingFang SC', 'Helvetica Neue', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: linear-gradient(180deg, #FFF9F0 0%, #FFFFFF 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            color: var(--text);
        }

        .poster {
            width: 100%;
            max-width: 600px;
            background: var(--bg);
            border-radius: 24px;
            box-shadow: 0 8px 40px rgba(255, 159, 67, 0.12);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, #FFB85F 100%);
            padding: 48px 32px;
            text-align: center;
            position: relative;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
            box-shadow: 0 4px 20px rgba(255, 159, 67, 0.3);
            position: relative;
            z-index: 1;
        }

        .title {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }

        .subtitle {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 400;
            line-height: 1.6;
            position: relative;
            z-index: 1;
        }

        .features {
            padding: 32px;
        }

        .features-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 24px;
            text-align: center;
        }

        .feature-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 16px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .feature-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
            border-color: var(--border);
        }

        .feature-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .feature-icon.tag {
            background: var(--primary-soft);
        }

        .feature-icon.rec {
            background: var(--accent-soft);
        }

        .feature-icon.stat {
            background: var(--success-soft);
        }

        .feature-content {
            flex: 1;
        }

        .feature-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
        }

        .feature-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .stats-bar {
            display: flex;
            gap: 16px;
            padding: 0 32px;
        }

        .stat-item {
            flex: 1;
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-light);
        }

        .footer {
            padding: 24px 32px 32px;
            text-align: center;
        }

        .footer-line {
            width: 40px;
            height: 3px;
            background: var(--border);
            border-radius: 2px;
            margin: 0 auto 16px;
        }

        .footer-text {
            font-size: 12px;
            color: var(--text-light);
            line-height: 1.6;
        }

        .footer-text strong {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .decor {
            position: relative;
            padding: 16px 32px;
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .decor span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary-light);
            opacity: 0.5;
        }

        .decor span:nth-child(1),
        .decor span:nth-child(7) {
            opacity: 0.3;
        }

        .decor span:nth-child(3),
        .decor span:nth-child(5) {
            opacity: 0.7;
        }

        .decor span:nth-child(4) {
            width: 8px;
            height: 8px;
            opacity: 1;
            background: var(--primary);
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 12px;
            }
            
            .header {
                padding: 32px 20px;
            }
            
            .title {
                font-size: 26px;
            }
            
            .subtitle {
                font-size: 13px;
            }
            
            .features {
                padding: 24px 20px;
            }
            
            .feature-card {
                padding: 16px 20px;
            }
            
            .stats-bar {
                padding: 0 20px;
            }
            
            .stat-value {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="poster">
        <div class="header">
            <div class="logo">🍽️</div>
            <h1 class="title">三餐食记</h1>
            <p class="subtitle">发现美味，顺便健康</p>
        </div>

        <div class="decor">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="features">
            <h2 class="features-title">✨ 产品亮点</h2>
            
            <div class="feature-card">
                <div class="feature-icon tag">🏷️</div>
                <div class="feature-content">
                    <h3 class="feature-title">自定义忌口、荤素口味标签</h3>
                    <p class="feature-desc">灵活设置个人饮食偏好，标注忌口食材、辣度偏好，让推荐更贴心</p>
                </div>
            </div>

            <div class="feature-card">
                <div class="feature-icon rec">🎯</div>
                <div class="feature-content">
                    <h3 class="feature-title">智能匹配食堂菜品推荐</h3>
                    <p class="feature-desc">基于口味偏好智能筛选，每日推荐最适合你的食堂美食</p>
                </div>
            </div>

            <div class="feature-card">
                <div class="feature-icon stat">📊</div>
                <div class="feature-content">
                    <h3 class="feature-title">极简三餐记录+基础热量统计</h3>
                    <p class="feature-desc">一键记录每日饮食，自动计算热量摄入，轻松关注健康</p>
                </div>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value">📱</div>
                <div class="stat-label">轻量便捷</div>
            </div>
            <div class="stat-item">
                <div class="stat-value">🎯</div>
                <div class="stat-label">精准推荐</div>
            </div>
            <div class="stat-item">
                <div class="stat-value">📅</div>
                <div class="stat-label">持续记录</div>
            </div>
        </div>

        <div class="footer">
            <div class="footer-line"></div>
            <p class="footer-text">面向在校大学生的食堂个性化美食推荐 + 轻量饮食记录工具</p>
            <p class="footer-text" style="margin-top: 8px;"><strong>课程实践项目</strong> · 用于论坛项目报名海报</p>
        </div>
    </div>
</body>
</html>
