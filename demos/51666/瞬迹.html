<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>瞬迹 - AI影像检索与同机位对比</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #0D0D0F;
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 414px;
            min-width: 375px;
            background-color: #1E1E2E;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 414px;
            min-width: 375px;
            height: 88px;
            padding-top: 44px;
            padding-left: 16px;
            padding-right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 30, 46, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .navbar-title {
            font-size: 24px;
            font-weight: 700;
            color: #F5A623;
            letter-spacing: 2px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #3A3A4A;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .user-avatar:hover {
            background-color: #4A4A5A;
        }

        .main-content {
            padding-top: 88px;
            padding-bottom: 80px;
        }

        .hero-section {
            padding: 24px 16px;
            text-align: center;
        }

        .slogan {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .search-container {
            position: relative;
            margin-bottom: 16px;
        }

        .search-box {
            width: 100%;
            height: 48px;
            border-radius: 24px;
            background-color: #2A2A3E;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding-left: 20px;
            padding-right: 70px;
            font-size: 15px;
            color: #FFFFFF;
            outline: none;
            transition: all 0.3s;
        }

        .search-box::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .search-box:focus {
            border-color: #F5A623;
            background-color: #2E2E42;
            box-shadow: 0 0 20px rgba(245, 166, 35, 0.15);
        }

        .camera-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #F5A623;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .camera-btn:hover {
            transform: translateY(-50%) scale(1.05);
            box-shadow: 0 4px 12px rgba(245, 166, 35, 0.4);
        }

        .filter-tags {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .filter-tag {
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            background-color: #2A2A3E;
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid transparent;
        }

        .filter-tag.active {
            background-color: rgba(245, 166, 35, 0.15);
            color: #F5A623;
            border-color: rgba(245, 166, 35, 0.3);
        }

        .photos-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px 12px;
        }

        .photos-count {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
        }

        .smart-sort-btn {
            padding: 6px 16px;
            border-radius: 12px;
            font-size: 12px;
            background-color: rgba(245, 166, 35, 0.15);
            color: #F5A623;
            border: 1px solid rgba(245, 166, 35, 0.3);
            cursor: pointer;
            transition: all 0.2s;
        }

        .smart-sort-btn:hover {
            background-color: rgba(245, 166, 35, 0.25);
        }

        .photos-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            padding: 0 16px;
        }

        .photo-card {
            position: relative;
            aspect-ratio: 3/4;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .photo-card:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            padding: 12px;
            padding-bottom: 16px;
        }

        .photo-location {
            font-size: 11px;
            color: #F5A623;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .photo-date {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.7);
        }

        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 414px;
            min-width: 375px;
            height: 70px;
            background-color: rgba(30, 30, 46, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 100;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s;
            color: rgba(255, 255, 255, 0.4);
            font-size: 10px;
        }

        .tab-item.active {
            color: #F5A623;
        }

        .tab-icon {
            font-size: 22px;
        }

        .compare-overlay {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%) translateY(100%);
            width: 100%;
            max-width: 414px;
            min-width: 375px;
            height: 100%;
            background-color: #1E1E2E;
            z-index: 200;
            display: flex;
            flex-direction: column;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }

        .compare-overlay.active {
            transform: translateX(-50%) translateY(0);
        }

        .compare-header {
            height: 88px;
            padding-top: 44px;
            padding-left: 16px;
            padding-right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 30, 46, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .compare-title {
            font-size: 18px;
            font-weight: 600;
        }

        .close-btn {
            font-size: 24px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.6);
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #FFFFFF;
        }

        .compare-images-container {
            position: relative;
            width: 100%;
            height: 400px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .compare-image-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .compare-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .compare-image-right {
            clip-path: inset(0 0 0 50%);
        }

        .compare-slider {
            position: absolute;
            top: 0;
            left: 50%;
            width: 4px;
            height: 100%;
            background-color: #F5A623;
            transform: translateX(-50%);
            cursor: ew-resize;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slider-handle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #F5A623;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            box-shadow: 0 2px 12px rgba(245, 166, 35, 0.5);
        }

        .compare-labels {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            z-index: 20;
        }

        .compare-label {
            padding: 6px 12px;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            font-size: 12px;
            color: #FFFFFF;
        }

        .compare-empty-state {
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 100%;
            background-color: #2A2A3E;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .compare-empty-icon {
            font-size: 48px;
            color: rgba(255, 255, 255, 0.2);
        }

        .compare-empty-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            padding: 0 20px;
        }

        .select-album-btn {
            padding: 10px 24px;
            border-radius: 20px;
            background-color: #F5A623;
            color: #1E1E2E;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .select-album-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(245, 166, 35, 0.4);
        }

        .params-card {
            margin: 0 16px 16px;
            background-color: #2A2A3E;
            border-radius: 16px;
            padding: 20px;
        }

        .params-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #FFFFFF;
        }

        .params-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .param-item {
            background-color: #1E1E2E;
            border-radius: 12px;
            padding: 16px;
        }

        .param-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 8px;
        }

        .param-value {
            font-size: 20px;
            font-weight: 700;
            color: #F5A623;
        }

        .param-value-text {
            font-size: 14px;
            color: #FFFFFF;
            font-weight: 400;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 300;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: #2A2A3E;
            border-radius: 16px;
            padding: 24px;
            width: 80%;
            max-width: 320px;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-icon {
            font-size: 40px;
            margin-bottom: 12px;
            color: #F5A623;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .modal-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 20px;
        }

        .modal-btn {
            padding: 10px 32px;
            border-radius: 20px;
            background-color: #F5A623;
            color: #1E1E2E;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background-color: rgba(0, 0, 0, 0.85);
            color: #FFFFFF;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 400;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .toast.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        @media (max-width: 375px) {
            .app-container {
                min-width: 320px;
            }

            .navbar, .tab-bar {
                min-width: 320px;
            }

            .compare-overlay {
                min-width: 320px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <nav class="navbar">
            <div class="navbar-title">瞬迹</div>
            <div class="user-avatar">👤</div>
        </nav>

        <main class="main-content">
            <section class="hero-section">
                <p class="slogan">用AI唤醒每一段光影记忆</p>
                <div class="search-container">
                    <input type="text" class="search-box" placeholder="搜索地点、内容或人物...">
                    <div class="camera-btn" onclick="showCameraModal()">📷</div>
                </div>
                <div class="filter-tags">
                    <div class="filter-tag active" onclick="toggleFilter(this)">地点</div>
                    <div class="filter-tag" onclick="toggleFilter(this)">时间</div>
                    <div class="filter-tag" onclick="toggleFilter(this)">内容</div>
                </div>
            </section>

            <section class="photos-section">
                <div class="photos-header">
                    <span class="photos-count">共 1,284 张</span>
                    <button class="smart-sort-btn" onclick="showSmartSortToast()">智能整理</button>
                </div>
                <div class="photos-grid" id="photosGrid"></div>
            </section>
        </main>

        <nav class="tab-bar">
            <div class="tab-item active" onclick="switchTab(this)">
                <span class="tab-icon">🏠</span>
                <span>首页</span>
            </div>
            <div class="tab-item" onclick="switchTab(this)">
                <span class="tab-icon">📁</span>
                <span>相册</span>
            </div>
            <div class="tab-item" onclick="switchTab(this)">
                <span class="tab-icon">↔️</span>
                <span>对比</span>
            </div>
            <div class="tab-item" onclick="switchTab(this)">
                <span class="tab-icon">👤</span>
                <span>我的</span>
            </div>
        </nav>

        <div class="compare-overlay" id="compareOverlay">
            <div class="compare-header">
                <div class="compare-title">同机位对比</div>
                <div class="close-btn" onclick="closeCompare()">✕</div>
            </div>

            <div class="compare-images-container" id="compareContainer">
                <div class="compare-image-wrapper" id="compareLeft">
                    <img src="" id="compareLeftImg">
                </div>
                <div class="compare-image-wrapper compare-image-right" id="compareRight">
                    <img src="" id="compareRightImg">
                </div>
                <div class="compare-empty-state" id="compareEmpty">
                    <span class="compare-empty-icon">📷</span>
                    <p class="compare-empty-text">请选择历史照片进行对比</p>
                    <button class="select-album-btn" onclick="showAlbumSelection()">从相册选择</button>
                </div>
                <div class="compare-slider" id="compareSlider">
                    <div class="slider-handle">⇆</div>
                </div>
                <div class="compare-labels">
                    <span class="compare-label">当前照片</span>
                    <span class="compare-label">历史照片</span>
                </div>
            </div>

            <div class="params-card" id="paramsCard">
                <div class="params-title">AI 分析结果</div>
                <div class="params-grid">
                    <div class="param-item">
                        <div class="param-label">构图重合度</div>
                        <div class="param-value" id="paramSimilarity">--%</div>
                    </div>
                    <div class="param-item">
                        <div class="param-label">曝光差异</div>
                        <div class="param-value" id="paramExposure">-- EV</div>
                    </div>
                    <div class="param-item">
                        <div class="param-label">色调对比</div>
                        <div class="param-value param-value-text" id="paramTone">--</div>
                    </div>
                    <div class="param-item">
                        <div class="param-label">时间跨度</div>
                        <div class="param-value param-value-text" id="paramTime">--</div>
                    </div>
                </div>
            </div>

            <div class="photos-grid" id="selectionGrid" style="display: none; padding-bottom: 20px;"></div>
        </div>

        <div class="modal-overlay" id="cameraModal">
            <div class="modal-content">
                <div class="modal-icon">📸</div>
                <div class="modal-title">现场拍照比对</div>
                <div class="modal-text">准备拍摄当前场景，正在识别机位...</div>
                <button class="modal-btn" onclick="closeModal('cameraModal')">知道了</button>
            </div>
        </div>

        <div class="toast" id="toast"></div>
    </div>

    <script>
        const photosData = [
            { id: 1, imageUrl: 'https://picsum.photos/seed/p1/400/533', location: '青海翡翠湖', date: '2024-07-15', tags: ['湖泊', '风景'] },
            { id: 2, imageUrl: 'https://picsum.photos/seed/p2/400/533', location: '上海外滩', date: '2024-05-20', tags: ['城市', '夜景'] },
            { id: 3, imageUrl: 'https://picsum.photos/seed/p3/400/533', location: '北京故宫', date: '2024-04-10', tags: ['古建筑', '历史'] },
            { id: 4, imageUrl: 'https://picsum.photos/seed/p4/400/533', location: '杭州西湖', date: '2024-06-08', tags: ['湖泊', '园林'] },
            { id: 5, imageUrl: 'https://picsum.photos/seed/p5/400/533', location: '云南洱海', date: '2023-12-25', tags: ['湖泊', '自然风光'] },
            { id: 6, imageUrl: 'https://picsum.photos/seed/p6/400/533', location: '西藏布达拉宫', date: '2024-08-01', tags: ['建筑', '宗教'] },
            { id: 7, imageUrl: 'https://picsum.photos/seed/p7/400/533', location: '成都宽窄巷子', date: '2024-03-15', tags: ['人文', '美食'] },
            { id: 8, imageUrl: 'https://picsum.photos/seed/p8/400/533', location: '西安兵马俑', date: '2024-01-20', tags: ['历史', '古迹'] },
            { id: 9, imageUrl: 'https://picsum.photos/seed/p9/400/533', location: '青岛栈桥', date: '2024-06-28', tags: ['海洋', '城市'] },
            { id: 10, imageUrl: 'https://picsum.photos/seed/p10/400/533', location: '苏州园林', date: '2024-04-28', tags: ['园林', '古建筑'] },
            { id: 11, imageUrl: 'https://picsum.photos/seed/p11/400/533', location: '三亚亚龙湾', date: '2023-11-12', tags: ['海滩', '度假'] },
            { id: 12, imageUrl: 'https://picsum.photos/seed/p12/400/533', location: '重庆洪崖洞', date: '2024-02-14', tags: ['夜景', '城市'] },
            { id: 13, imageUrl: 'https://picsum.photos/seed/p13/400/533', location: '桂林山水', date: '2024-05-05', tags: ['山水', '自然风光'] },
            { id: 14, imageUrl: 'https://picsum.photos/seed/p14/400/533', location: '张家界天门山', date: '2024-07-30', tags: ['山景', '自然风光'] },
            { id: 15, imageUrl: 'https://picsum.photos/seed/p15/400/533', location: '厦门鼓浪屿', date: '2024-03-28', tags: ['海岛', '人文'] },
            { id: 16, imageUrl: 'https://picsum.photos/seed/p16/400/533', location: '武汉黄鹤楼', date: '2024-04-05', tags: ['古建筑', '历史'] }
        ];

        let selectedPhoto = null;
        let comparePhoto = null;
        let isDragging = false;

        function renderPhotosGrid(containerId, onClickHandler) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            photosData.forEach(photo => {
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.onclick = () => onClickHandler(photo);
                card.innerHTML = `
                    <img src="${photo.imageUrl}" alt="${photo.location}">
                    <div class="photo-overlay">
                        <div class="photo-location">📍 ${photo.location}</div>
                        <div class="photo-date">📅 ${photo.date}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleFilter(element) {
            document.querySelectorAll('.filter-tag').forEach(tag => {
                tag.classList.remove('active');
            });
            element.classList.add('active');
            showToast(`已切换到「${element.textContent}」筛选`);
        }

        function switchTab(element) {
            document.querySelectorAll('.tab-item').forEach(tab => {
                tab.classList.remove('active');
            });
            element.classList.add('active');
            const tabNames = ['首页', '相册', '对比', '我的'];
            const tabs = document.querySelectorAll('.tab-item');
            tabs.forEach((tab, index) => {
                if (tab === element) {
                    showToast(`已切换到「${tabNames[index]}」`);
                }
            });
        }

        function showCameraModal() {
            document.getElementById('cameraModal').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function showSmartSortToast() {
            showToast('正在扫描本地相册...');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('active');
            setTimeout(() => {
                toast.classList.remove('active');
            }, 2000);
        }

        function openCompare(photo) {
            selectedPhoto = photo;
            comparePhoto = null;
            const overlay = document.getElementById('compareOverlay');
            const leftImg = document.getElementById('compareLeftImg');
            const rightImg = document.getElementById('compareRightImg');
            const emptyState = document.getElementById('compareEmpty');
            const rightWrapper = document.getElementById('compareRight');
            const slider = document.getElementById('compareSlider');
            const paramsCard = document.getElementById('paramsCard');

            leftImg.src = photo.imageUrl;
            rightImg.src = '';
            emptyState.style.display = 'flex';
            rightWrapper.style.clipPath = 'inset(0 0 0 50%)';
            slider.style.left = '50%';
            paramsCard.style.opacity = '0.5';

            overlay.classList.add('active');
        }

        function closeCompare() {
            document.getElementById('compareOverlay').classList.remove('active');
            document.getElementById('selectionGrid').style.display = 'none';
            selectedPhoto = null;
            comparePhoto = null;
        }

        function showAlbumSelection() {
            const selectionGrid = document.getElementById('selectionGrid');
            selectionGrid.style.display = 'grid';
            renderPhotosGrid('selectionGrid', selectComparePhoto);
            showToast('请选择一张照片进行对比');
        }

        function selectComparePhoto(photo) {
            if (photo.id === selectedPhoto.id) {
                showToast('请选择不同的照片进行对比');
                return;
            }
            comparePhoto = photo;
            const rightImg = document.getElementById('compareRightImg');
            const emptyState = document.getElementById('compareEmpty');
            const paramsCard = document.getElementById('paramsCard');

            rightImg.src = photo.imageUrl;
            emptyState.style.display = 'none';

            calculateParams();
            paramsCard.style.opacity = '1';

            document.getElementById('selectionGrid').style.display = 'none';
            showToast('已选择对比照片，拖动滑块查看差异');
        }

        function calculateParams() {
            if (!selectedPhoto || !comparePhoto) return;

            const similarity = Math.floor(Math.random() * 30) + 70;
            const exposure = (Math.random() * 4 - 2).toFixed(1);
            const tones = ['左侧偏暖，右侧偏冷', '左侧偏冷，右侧偏暖', '左侧偏亮，右侧偏暗', '左侧偏暗，右侧偏亮', '色调相近'];
            const tone = tones[Math.floor(Math.random() * tones.length)];

            const date1 = new Date(selectedPhoto.date);
            const date2 = new Date(comparePhoto.date);
            const diffTime = Math.abs(date2 - date1);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            const years = Math.floor(diffDays / 365);
            const months = Math.floor((diffDays % 365) / 30);

            let timeSpan = '';
            if (years > 0 && months > 0) {
                timeSpan = `相隔${years}年${months}月`;
            } else if (years > 0) {
                timeSpan = `相隔${years}年`;
            } else if (months > 0) {
                timeSpan = `相隔${months}月`;
            } else {
                timeSpan = `相隔${diffDays}天`;
            }

            document.getElementById('paramSimilarity').textContent = `${similarity}%`;
            document.getElementById('paramExposure').textContent = `${exposure} EV`;
            document.getElementById('paramTone').textContent = tone;
            document.getElementById('paramTime').textContent = timeSpan;
        }

        function initSlider() {
            const container = document.getElementById('compareContainer');
            const slider = document.getElementById('compareSlider');
            const rightWrapper = document.getElementById('compareRight');

            slider.addEventListener('mousedown', startDrag);
            slider.addEventListener('touchstart', startDrag);

            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', drag);

            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);

            function startDrag(e) {
                isDragging = true;
                e.preventDefault();
            }

            function drag(e) {
                if (!isDragging) return;

                const rect = container.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                let x = clientX - rect.left;
                const percentage = Math.max(0, Math.min(100, (x / rect.width) * 100));

                slider.style.left = `${percentage}%`;
                rightWrapper.style.clipPath = `inset(0 0 0 ${percentage}%)`;
            }

            function endDrag() {
                isDragging = false;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderPhotosGrid('photosGrid', openCompare);
            initSlider();
        });
    </script>
</body>
</html>
