<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartWriter v0.1.0 — 本地 AI 写作助手</title>
<style>
/* ============================================================
   0. CSS Variables — Design Tokens (Apple-inspired)
   ============================================================ */
:root {
  /* Brand */
  --brand: #007aff;
  --brand-hover: #0056b3;
  --brand-light: rgba(0,122,255,0.08);
  --brand-lighter: rgba(0,122,255,0.04);
  /* Backgrounds */
  --bg-primary: #f2f2f7;
  --bg-card: #ffffff;
  --bg-elevated: #ffffff;
  --bg-sidebar: #f9f9fb;
  --bg-input: #ffffff;
  --bg-hover: rgba(0,0,0,0.04);
  --bg-active: rgba(0,0,0,0.08);
  /* Text */
  --text-primary: #1d1d1f;
  --text-secondary: #6e6e73;
  --text-muted: #8e8e93;
  --text-inverse: #ffffff;
  /* Borders */
  --border-primary: #e5e5ea;
  --border-light: #f0f0f2;
  --border-focus: var(--brand);
  /* Semantic */
  --success: #34c759;
  --success-bg: rgba(52,199,89,0.1);
  --error: #ff3b30;
  --error-bg: rgba(255,59,48,0.1);
  --warning: #ff9500;
  --warning-bg: rgba(255,149,0,0.1);
  /* Diff */
  --diff-add-bg: rgba(52,199,89,0.15);
  --diff-add-border: var(--success);
  --diff-del-bg: rgba(255,59,48,0.12);
  --diff-del-border: var(--error);
  --diff-del-text: var(--error);
  /* Shadows */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
  --shadow-float: 0 6px 20px rgba(0,0,0,0.15);
  /* Spacing */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  /* Layout */
  --sidebar-width: 240px;
  --header-height: 48px;
  /* Transitions */
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 350ms ease;
  /* Typography */
  --font-sans: -apple-system, 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', sans-serif;
  --font-serif: Georgia, 'Noto Serif SC', 'Songti SC', serif;
  --font-mono: 'SF Mono', 'Menlo', 'Monaco', monospace;
}

/* Dark mode tokens */
[data-theme="dark"] {
  --brand: #0a84ff;
  --brand-hover: #409cff;
  --brand-light: rgba(10,132,255,0.15);
  --brand-lighter: rgba(10,132,255,0.08);
  --bg-primary: #1c1c1e;
  --bg-card: #2c2c2e;
  --bg-elevated: #2c2c2e;
  --bg-sidebar: #1c1c1e;
  --bg-input: #3a3a3c;
  --bg-hover: rgba(255,255,255,0.06);
  --bg-active: rgba(255,255,255,0.1);
  --text-primary: #f5f5f7;
  --text-secondary: #a1a1a6;
  --text-muted: #8e8e93;
  --text-inverse: #1d1d1f;
  --border-primary: #38383a;
  --border-light: #2c2c2e;
  --border-focus: var(--brand);
  --success: #30d158;
  --success-bg: rgba(48,209,88,0.15);
  --error: #ff453a;
  --error-bg: rgba(255,69,58,0.15);
  --warning: #ff9f0a;
  --warning-bg: rgba(255,159,10,0.15);
  --diff-add-bg: rgba(48,209,88,0.18);
  --diff-del-bg: rgba(255,69,58,0.15);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.4);
  --shadow-float: 0 6px 20px rgba(0,0,0,0.5);
}

/* ============================================================
   1. Reset & Base
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; width: 100%; overflow: hidden;
  font-family: var(--font-sans);
  font-size: 14px; line-height: 1.5;
  color: var(--text-primary);
  background: var(--bg-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; font-size: inherit; }
input, textarea, select { font-family: inherit; font-size: inherit; color: var(--text-primary); }
a { color: var(--brand); text-decoration: none; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 3px; opacity: 0.4; }
::selection { background: var(--brand-light); }

/* ============================================================
   2. Layout — Three Column Grid
   ============================================================ */
#app {
  display: grid;
  grid-template-columns: var(--sidebar-width) 1fr 1.3fr;
  height: 100vh; width: 100vw;
  overflow: hidden;
}
#app.draft-collapsed {
  grid-template-columns: var(--sidebar-width) 1fr 0fr;
}
#app.draft-collapsed .draft-panel { overflow: hidden; opacity: 0; pointer-events: none; }
#app.draft-collapsed .draft-panel * { visibility: hidden; }

/* ============================================================
   3. Sidebar — Left Column
   ============================================================ */
.sidebar {
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border-primary);
  display: flex; flex-direction: column;
  overflow: hidden;
  z-index: 10;
}
.sidebar-header {
  padding: 12px 14px 8px;
  border-bottom: 1px solid var(--border-light);
  flex-shrink: 0;
}
.sidebar-brand {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.sidebar-brand .logo {
  display: flex; align-items: center; gap: 8px;
  font-weight: 700; font-size: 15px;
}
.sidebar-brand .logo svg { width: 22px; height: 22px; }
.btn-new-task {
  display: flex; align-items: center; gap: 4px;
  padding: 5px 10px; border-radius: var(--radius-sm);
  background: var(--brand); color: var(--text-inverse);
  font-size: 12px; font-weight: 600;
  transition: background var(--transition-fast);
}
.btn-new-task:hover { background: var(--brand-hover); }
.btn-new-task svg { width: 14px; height: 14px; }
.search-box {
  position: relative;
}
.search-box input {
  width: 100%; padding: 7px 10px 7px 30px;
  background: var(--bg-input); border: 1px solid var(--border-primary);
  border-radius: var(--radius-sm); outline: none;
  color: var(--text-primary);
  transition: border-color var(--transition-fast);
}
.search-box input:focus { border-color: var(--brand); }
.search-box input::placeholder { color: var(--text-muted); }
.search-box svg {
  position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
  width: 14px; height: 14px; color: var(--text-muted);
}

/* Sidebar Nav */
.sidebar-nav {
  flex: 1; overflow-y: auto; padding: 6px 0;
}
.nav-section { padding: 4px 12px; }
.nav-section-title {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  color: var(--text-muted); letter-spacing: 0.5px;
  padding: 6px 8px 4px; user-select: none;
}
.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: var(--radius-sm);
  cursor: pointer; transition: background var(--transition-fast);
  font-size: 13px; user-select: none;
}
.nav-item:hover { background: var(--bg-hover); }
.nav-item.active { background: var(--brand-light); color: var(--brand); font-weight: 600; }
.nav-item svg { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.7; }
.nav-item.active svg { opacity: 1; }
.nav-item .badge {
  margin-left: auto; padding: 1px 6px;
  background: var(--bg-active); border-radius: 10px;
  font-size: 11px; color: var(--text-secondary);
}

/* Collection tree */
.tree-item {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 10px; border-radius: var(--radius-sm);
  cursor: pointer; font-size: 13px;
  transition: background var(--transition-fast);
  user-select: none;
}
.tree-item:hover { background: var(--bg-hover); }
.tree-item.active { background: var(--brand-light); color: var(--brand); font-weight: 600; }
.tree-item svg { width: 14px; height: 14px; flex-shrink: 0; }
.tree-toggle {
  width: 16px; height: 16px; display: flex; align-items: center; justify-content: center;
  transition: transform var(--transition-fast);
}
.tree-toggle.open { transform: rotate(90deg); }
.tree-children {
  margin-left: 16px; overflow: hidden;
  transition: max-height var(--transition-normal);
}
.tree-children.collapsed { max-height: 0 !important; }
.tree-child {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 10px; border-radius: var(--radius-sm);
  cursor: pointer; font-size: 12.5px;
  color: var(--text-secondary);
  transition: background var(--transition-fast);
}
.tree-child:hover { background: var(--bg-hover); }
.tree-child.active { background: var(--brand-light); color: var(--brand); }
.tree-child svg { width: 12px; height: 12px; }

/* Sidebar Footer */
.sidebar-footer {
  padding: 10px 14px;
  border-top: 1px solid var(--border-light);
  flex-shrink: 0;
}
.sidebar-footer .workspace-name {
  font-size: 12px; font-weight: 500; color: var(--text-secondary);
  display: flex; align-items: center; gap: 6px;
}
.sidebar-footer .version {
  font-size: 11px; color: var(--text-muted); margin-top: 2px;
}

/* ============================================================
   4. Middle Column — Collaboration Flow
   ============================================================ */
.collab-panel {
  display: flex; flex-direction: column;
  background: var(--bg-primary);
  border-right: 1px solid var(--border-primary);
  overflow: hidden;
}
.collab-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border-light);
  flex-shrink: 0; min-height: 48px;
}
.collab-header-left {
  display: flex; align-items: center; gap: 10px;
}
.collab-task-name {
  font-weight: 600; font-size: 14px;
}
.genre-badge {
  padding: 2px 8px; border-radius: 10px;
  font-size: 11px; font-weight: 500;
  background: var(--brand-light); color: var(--brand);
}
.collab-header-right {
  display: flex; align-items: center; gap: 8px;
}
.theme-toggle {
  width: 32px; height: 32px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  transition: background var(--transition-fast);
}
.theme-toggle:hover { background: var(--bg-hover); }
.theme-toggle svg { width: 18px; height: 18px; }

/* Message Flow */
.message-flow {
  flex: 1; overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 16px;
}
.message {
  display: flex; gap: 10px; max-width: 95%;
}
.message.user { align-self: flex-end; flex-direction: row-reverse; }
.message .avatar {
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600; flex-shrink: 0;
}
.message.assistant .avatar { background: var(--bg-active); color: var(--text-secondary); }
.message.user .avatar { background: var(--brand); color: var(--text-inverse); }
.message .bubble {
  padding: 10px 14px; border-radius: var(--radius-lg);
  font-size: 13.5px; line-height: 1.6;
}
.message.assistant .bubble { background: var(--bg-card); border: 1px solid var(--border-light); }
.message.user .bubble { background: var(--brand); color: var(--text-inverse); }
.message-actions {
  display: flex; gap: 4px; margin-top: 6px;
}
.message-action {
  width: 28px; height: 28px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  transition: background var(--transition-fast);
}
.message-action:hover { background: var(--bg-hover); }
.message-action svg { width: 14px; height: 14px; color: var(--text-muted); }
.message-time {
  font-size: 11px; color: var(--text-muted); margin-left: auto;
  align-self: center;
}

/* Tool progress inline */
.tool-progress {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px; margin-top: 6px;
  background: var(--bg-hover); border-radius: var(--radius-sm);
  font-size: 12px; color: var(--text-secondary);
}
.tool-progress .spinner {
  width: 14px; height: 14px;
  border: 2px solid var(--border-primary);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
.tool-progress .check { color: var(--success); }
@keyframes spin { to { transform: rotate(360deg); } }

/* Inline Approval Card */
.inline-card {
  margin-top: 8px; padding: 14px;
  background: var(--bg-card); border: 1px solid var(--border-primary);
  border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
}
.inline-card-title {
  font-weight: 600; font-size: 13px; margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.inline-card-title svg { width: 16px; height: 16px; color: var(--warning); }
.inline-card-body {
  font-size: 12.5px; color: var(--text-secondary); margin-bottom: 10px;
  line-height: 1.5;
}
.inline-card-actions {
  display: flex; gap: 8px; flex-wrap: wrap;
}
.btn-sm {
  padding: 5px 12px; border-radius: var(--radius-sm);
  font-size: 12px; font-weight: 500;
  transition: all var(--transition-fast);
}
.btn-primary { background: var(--brand); color: var(--text-inverse); }
.btn-primary:hover { background: var(--brand-hover); }
.btn-secondary { background: var(--bg-hover); color: var(--text-primary); }
.btn-secondary:hover { background: var(--bg-active); }
.btn-danger { background: var(--error-bg); color: var(--error); }
.btn-danger:hover { background: var(--error); color: var(--text-inverse); }

/* Inline Clarification Card */
.clarify-card {
  margin-top: 8px; padding: 14px;
  background: var(--bg-card); border: 1px solid var(--border-primary);
  border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
}
.clarify-question {
  font-weight: 500; font-size: 13px; margin-bottom: 8px;
}
.clarify-options {
  display: flex; flex-direction: column; gap: 4px;
  margin-bottom: 8px;
}
.clarify-option {
  padding: 6px 10px; border-radius: var(--radius-sm);
  border: 1px solid var(--border-primary); cursor: pointer;
  font-size: 12.5px; transition: all var(--transition-fast);
  display: flex; align-items: center; gap: 8px;
}
.clarify-option:hover { border-color: var(--brand); background: var(--brand-lighter); }
.clarify-option.selected { border-color: var(--brand); background: var(--brand-light); }
.clarify-option .radio {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid var(--border-primary); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.clarify-option.selected .radio { border-color: var(--brand); }
.clarify-option.selected .radio::after {
  content: ''; width: 8px; height: 8px; border-radius: 50%;
  background: var(--brand);
}
.clarify-other {
  width: 100%; padding: 6px 10px;
  border: 1px solid var(--border-primary); border-radius: var(--radius-sm);
  background: var(--bg-input); outline: none; font-size: 12.5px;
  margin-top: 4px;
}
.clarify-other:focus { border-color: var(--brand); }

/* File Card */
.file-card {
  margin-top: 8px; padding: 12px;
  background: var(--bg-card); border: 1px solid var(--border-primary);
  border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
  display: flex; align-items: center; gap: 10px;
  cursor: pointer; transition: box-shadow var(--transition-fast);
}
.file-card:hover { box-shadow: var(--shadow-md); }
.file-card-icon {
  width: 36px; height: 36px; border-radius: var(--radius-sm);
  background: var(--brand-light); color: var(--brand);
  display: flex; align-items: center; justify-content: center;
}
.file-card-icon svg { width: 18px; height: 18px; }
.file-card-info { flex: 1; }
.file-card-name { font-size: 13px; font-weight: 500; }
.file-card-meta { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
.file-card-action {
  padding: 4px 10px; border-radius: var(--radius-sm);
  background: var(--bg-hover); font-size: 11px; font-weight: 500;
  transition: background var(--transition-fast);
}
.file-card-action:hover { background: var(--bg-active); }

/* Streaming controls */
.stream-controls {
  display: flex; gap: 6px; margin-top: 8px;
}
.btn-stop {
  padding: 5px 12px; border-radius: var(--radius-sm);
  background: var(--error-bg); color: var(--error);
  font-size: 12px; font-weight: 500;
  display: flex; align-items: center; gap: 4px;
  transition: all var(--transition-fast);
}
.btn-stop:hover { background: var(--error); color: var(--text-inverse); }
.btn-stop svg { width: 12px; height: 12px; }

/* Plan Card */
.plan-card {
  margin-top: 8px; padding: 16px;
  background: var(--bg-card); border: 1px solid var(--border-primary);
  border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
}
.plan-card h4 {
  font-size: 14px; font-weight: 600; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.plan-card h4 svg { width: 16px; height: 16px; color: var(--brand); }
.plan-section { margin-bottom: 10px; }
.plan-section-label {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  color: var(--text-muted); letter-spacing: 0.5px; margin-bottom: 4px;
}
.plan-section-content {
  font-size: 13px; color: var(--text-secondary); line-height: 1.5;
  padding-left: 8px;
}
.plan-steps {
  list-style: none; padding: 0;
}
.plan-steps li {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 0; font-size: 13px;
}
.plan-steps li .step-icon {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid var(--border-primary);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 10px; color: var(--text-muted);
}
.plan-steps li.done .step-icon { border-color: var(--success); background: var(--success); color: white; }
.plan-steps li.current .step-icon { border-color: var(--brand); color: var(--brand); }
.plan-card-actions {
  display: flex; gap: 8px; margin-top: 12px;
  padding-top: 12px; border-top: 1px solid var(--border-light);
}

/* ============================================================
   5. Input Area
   ============================================================ */
.input-area {
  padding: 12px 16px;
  border-top: 1px solid var(--border-light);
  flex-shrink: 0;
  background: var(--bg-primary);
}
.input-wrapper {
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-lg);
  background: var(--bg-card);
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}
.input-wrapper:focus-within {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--brand-light);
}
.input-top {
  padding: 10px 12px 4px;
}
.input-top textarea {
  width: 100%; border: none; outline: none; resize: none;
  background: transparent; font-size: 13.5px; line-height: 1.5;
  min-height: 20px; max-height: 120px;
  color: var(--text-primary);
}
.input-top textarea::placeholder { color: var(--text-muted); }
.input-bottom {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 8px 8px 10px;
}
.input-left { display: flex; align-items: center; gap: 6px; }
.input-right { display: flex; align-items: center; gap: 8px; }
.input-btn {
  width: 30px; height: 30px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  transition: background var(--transition-fast);
}
.input-btn:hover { background: var(--bg-hover); }
.input-btn svg { width: 16px; height: 16px; color: var(--text-muted); }
.model-select {
  padding: 4px 8px; border-radius: var(--radius-sm);
  border: 1px solid var(--border-primary);
  background: var(--bg-input); font-size: 12px;
  outline: none; cursor: pointer;
}
.cost-estimate {
  font-size: 11px; color: var(--text-muted);
  position: relative; cursor: help;
}
.cost-tooltip {
  display: none; position: absolute; bottom: 100%; right: 0;
  padding: 6px 10px; background: var(--bg-elevated);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-sm); box-shadow: var(--shadow-md);
  font-size: 11px; color: var(--text-secondary);
  white-space: nowrap; z-index: 100;
  margin-bottom: 4px;
}
.cost-estimate:hover .cost-tooltip { display: block; }
.btn-send {
  width: 32px; height: 32px; border-radius: var(--radius-sm);
  background: var(--brand); color: var(--text-inverse);
  display: flex; align-items: center; justify-content: center;
  transition: background var(--transition-fast);
}
.btn-send:hover { background: var(--brand-hover); }
.btn-send svg { width: 16px; height: 16px; }

/* Command Menu */
.command-menu {
  position: absolute; bottom: 100%; left: 8px; right: 8px;
  background: var(--bg-elevated); border: 1px solid var(--border-primary);
  border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
  max-height: 320px; overflow-y: auto; z-index: 50;
  margin-bottom: 6px; display: none;
}
.command-menu.show { display: block; }
.command-menu-header {
  padding: 8px 12px; font-size: 11px; font-weight: 600;
  color: var(--text-muted); text-transform: uppercase;
  letter-spacing: 0.5px; border-bottom: 1px solid var(--border-light);
}
.command-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; cursor: pointer;
  transition: background var(--transition-fast);
}
.command-item:hover, .command-item.active { background: var(--brand-light); }
.command-item-left { display: flex; align-items: center; gap: 10px; }
.command-item-name {
  font-size: 13px; font-weight: 500;
  font-family: var(--font-mono);
}
.command-item-desc { font-size: 12px; color: var(--text-secondary); }

/* ============================================================
   6. Draft Panel — Right Column (Manuscript Workspace)
   ============================================================ */
.draft-panel {
  display: flex; flex-direction: column;
  background: var(--bg-card);
  overflow: hidden;
  transition: opacity var(--transition-normal);
}
.draft-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border-light);
  flex-shrink: 0; min-height: 48px;
}
.draft-toolbar-left {
  display: flex; align-items: center; gap: 10px; flex: 1;
}
.draft-title {
  font-weight: 600; font-size: 14px;
  background: none; border: none; outline: none;
  color: var(--text-primary); padding: 2px 6px;
  border-radius: var(--radius-sm);
  min-width: 100px;
}
.draft-title:focus { background: var(--bg-hover); }
.draft-toolbar-center {
  display: flex; align-items: center; gap: 6px;
}
.view-toggle {
  display: flex; align-items: center;
  border: 1px solid var(--border-primary); border-radius: var(--radius-sm);
  overflow: hidden;
}
.view-toggle button {
  padding: 4px 10px; font-size: 12px;
  transition: background var(--transition-fast);
}
.view-toggle button.active { background: var(--brand); color: var(--text-inverse); }
.view-toggle button:not(.active):hover { background: var(--bg-hover); }
.word-count {
  font-size: 12px; color: var(--text-muted); padding: 0 8px;
}
.draft-toolbar-right {
  display: flex; align-items: center; gap: 6px;
}
.btn-toolbar {
  padding: 5px 10px; border-radius: var(--radius-sm);
  font-size: 12px; font-weight: 500;
  display: flex; align-items: center; gap: 4px;
  transition: all var(--transition-fast);
  border: 1px solid var(--border-primary);
}
.btn-toolbar:hover { background: var(--bg-hover); }
.btn-toolbar svg { width: 14px; height: 14px; }
.btn-toolbar.primary { background: var(--brand); color: var(--text-inverse); border-color: var(--brand); }
.btn-toolbar.primary:hover { background: var(--brand-hover); }
.btn-collapse {
  width: 30px; height: 30px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  transition: background var(--transition-fast);
  margin-left: 4px;
}
.btn-collapse:hover { background: var(--bg-hover); }
.btn-collapse svg { width: 16px; height: 16px; color: var(--text-muted); }

/* Draft Content */
.draft-content {
  flex: 1; overflow-y: auto; padding: 24px 28px;
  font-family: var(--font-serif);
  font-size: 15.5px; line-height: 1.85;
  color: var(--text-primary);
}
.draft-content h1, .draft-content h2, .draft-content h3 {
  font-family: var(--font-sans); font-weight: 700;
  margin: 20px 0 10px; color: var(--text-primary);
}
.draft-content h1 { font-size: 22px; }
.draft-content h2 { font-size: 18px; }
.draft-content h3 { font-size: 16px; }
.draft-content p { margin-bottom: 14px; }
.draft-content .diff-add {
  background: var(--diff-add-bg); border-left: 3px solid var(--diff-add-border);
  padding: 2px 6px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  display: inline;
}
.draft-content .diff-del {
  background: var(--diff-del-bg); color: var(--diff-del-text);
  text-decoration: line-through;
  padding: 2px 6px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  display: inline;
}

/* Markdown source view */
.draft-content.markdown-view {
  font-family: var(--font-mono);
  font-size: 13px; line-height: 1.6;
}

/* Diff floating bar */
.diff-bar {
  display: none;
  align-items: center; justify-content: center; gap: 8px;
  padding: 8px 16px;
  background: var(--warning-bg); border-bottom: 1px solid var(--warning);
  flex-shrink: 0;
  animation: slideDown 0.3s ease;
}
.diff-bar.show { display: flex; }
.diff-bar-label { font-size: 12px; font-weight: 600; color: var(--warning); margin-right: auto; }
.diff-bar-actions { display: flex; gap: 6px; }
.btn-diff {
  padding: 4px 10px; border-radius: var(--radius-sm);
  font-size: 12px; font-weight: 500;
  transition: all var(--transition-fast);
}
.btn-diff.accept { background: var(--success); color: white; }
.btn-diff.accept:hover { opacity: 0.9; }
.btn-diff.reject { background: var(--bg-card); border: 1px solid var(--border-primary); }
.btn-diff.reject:hover { background: var(--bg-hover); }
.btn-diff.partial { background: var(--brand); color: white; }
@keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }

/* Text Selection Float Bar */
.text-float-bar {
  position: fixed; display: none;
  background: var(--bg-elevated); border: 1px solid var(--border-primary);
  border-radius: var(--radius-md); box-shadow: var(--shadow-float);
  padding: 4px; z-index: 100;
  animation: fadeInUp 0.15s ease;
}
.text-float-bar.show { display: flex; gap: 2px; }
.text-float-btn {
  padding: 6px 12px; border-radius: var(--radius-sm);
  font-size: 12px; font-weight: 500; white-space: nowrap;
  transition: background var(--transition-fast);
}
.text-float-btn:hover { background: var(--brand-light); color: var(--brand); }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* Reflection Bar */
.reflection-bar {
  padding: 10px 16px;
  border-top: 1px solid var(--border-light);
  flex-shrink: 0;
  background: var(--bg-card);
}
.reflection-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.reflection-title {
  font-size: 12px; font-weight: 600; color: var(--text-secondary);
  display: flex; align-items: center; gap: 6px;
}
.reflection-title svg { width: 14px; height: 14px; }
.reflection-status {
  font-size: 11px; color: var(--text-muted);
}
.reflection-items {
  display: flex; gap: 12px;
}
.reflection-item {
  display: flex; align-items: center; gap: 4px;
  font-size: 12px; color: var(--text-secondary);
  padding: 4px 8px; border-radius: var(--radius-sm);
  background: var(--bg-hover);
  transition: all var(--transition-normal);
}
.reflection-item.pass { background: var(--success-bg); color: var(--success); }
.reflection-item.pending svg { opacity: 0.3; }
.reflection-item svg { width: 14px; height: 14px; }

/* ============================================================
   7. Profile View (in Draft Panel)
   ============================================================ */
.profile-view {
  display: none;
  flex-direction: column;
  height: 100%;
}
.profile-view.show {
  display: flex;
}
.profile-view .draft-content {
  font-family: var(--font-sans);
  font-size: 14px;
  padding: 20px 24px;
}
.profile-section {
  margin-bottom: 20px;
}
.profile-section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.profile-section-title {
  font-weight: 700; font-size: 15px;
  display: flex; align-items: center; gap: 8px;
}
.profile-section-title svg { width: 16px; height: 16px; color: var(--brand); }
.profile-priority-hint {
  font-size: 11px; color: var(--text-muted);
  padding: 4px 8px; background: var(--bg-hover);
  border-radius: var(--radius-sm);
}
.profile-item {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 10px; border-radius: var(--radius-sm);
  border: 1px solid var(--border-light);
  margin-bottom: 6px;
  transition: border-color var(--transition-fast);
}
.profile-item:hover { border-color: var(--border-primary); }
.profile-item-label {
  font-size: 11px; font-weight: 600; color: var(--text-muted);
  min-width: 70px; flex-shrink: 0;
  padding-top: 2px;
}
.profile-item-content {
  flex: 1; font-size: 13px; line-height: 1.5;
}
.profile-item-content[contenteditable="true"] {
  outline: none; border-radius: 4px; padding: 2px 4px;
  transition: background var(--transition-fast);
}
.profile-item-content[contenteditable="true"]:focus {
  background: var(--brand-lighter);
}
.profile-item-delete {
  width: 22px; height: 22px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: all var(--transition-fast);
  flex-shrink: 0;
}
.profile-item:hover .profile-item-delete { opacity: 1; }
.profile-item-delete:hover { background: var(--error-bg); color: var(--error); }
.profile-item-delete svg { width: 12px; height: 12px; }
.profile-add-btn {
  padding: 6px 12px; border-radius: var(--radius-sm);
  border: 1px dashed var(--border-primary);
  font-size: 12px; color: var(--text-muted);
  transition: all var(--transition-fast);
  width: 100%; text-align: center;
}
.profile-add-btn:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-lighter); }
.profile-tabs {
  display: flex; gap: 2px;
  border-bottom: 1px solid var(--border-light);
  margin-bottom: 14px;
}
.profile-tab {
  padding: 8px 14px; font-size: 13px; font-weight: 500;
  border-bottom: 2px solid transparent;
  color: var(--text-secondary);
  transition: all var(--transition-fast);
}
.profile-tab:hover { color: var(--text-primary); }
.profile-tab.active { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }

/* ============================================================
   8. Onboarding Overlay
   ============================================================ */
.onboarding-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--bg-primary);
  display: flex; align-items: center; justify-content: center;
}
.onboarding-overlay.hidden { display: none; }
.onboarding-card {
  width: 520px; max-width: 90vw;
  background: var(--bg-card);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg);
  padding: 40px;
  text-align: center;
}
.onboarding-logo {
  width: 48px; height: 48px; margin: 0 auto 16px;
  color: var(--brand);
}
.onboarding-logo svg { width: 100%; height: 100%; }
.onboarding-card h2 {
  font-size: 22px; font-weight: 700; margin-bottom: 6px;
}
.onboarding-card .subtitle {
  font-size: 14px; color: var(--text-secondary); margin-bottom: 28px;
}
.onboarding-steps { margin-bottom: 28px; }
.onboarding-step {
  display: none;
  text-align: left;
}
.onboarding-step.active { display: block; }
.onboarding-step h3 {
  font-size: 16px; font-weight: 600; margin-bottom: 4px;
}
.onboarding-step p {
  font-size: 13px; color: var(--text-secondary); margin-bottom: 16px;
}
.onboarding-step-indicator {
  display: flex; justify-content: center; gap: 6px; margin-bottom: 20px;
}
.step-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--border-primary);
  transition: background var(--transition-fast);
}
.step-dot.active { background: var(--brand); width: 20px; border-radius: 4px; }
.step-dot.done { background: var(--success); }

/* Onboarding step content */
.workspace-path-input {
  width: 100%; padding: 10px 12px;
  border: 1px solid var(--border-primary); border-radius: var(--radius-sm);
  background: var(--bg-input); font-size: 13px;
  outline: none; margin-bottom: 10px;
}
.workspace-path-input:focus { border-color: var(--brand); }
.btn-browse {
  padding: 8px 16px; border-radius: var(--radius-sm);
  background: var(--bg-hover); font-size: 13px;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background var(--transition-fast);
}
.btn-browse:hover { background: var(--bg-active); }
.drag-upload-zone {
  border: 2px dashed var(--border-primary);
  border-radius: var(--radius-md);
  padding: 30px; text-align: center;
  cursor: pointer; transition: all var(--transition-fast);
  margin-bottom: 12px;
}
.drag-upload-zone:hover { border-color: var(--brand); background: var(--brand-lighter); }
.drag-upload-zone svg { width: 36px; height: 36px; color: var(--text-muted); margin-bottom: 8px; }
.drag-upload-zone p { font-size: 13px; color: var(--text-secondary); }
.seed-file-list { margin-top: 8px; }
.seed-file-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: var(--radius-sm);
  background: var(--bg-hover); margin-bottom: 4px;
  font-size: 13px;
}
.seed-file-item svg { width: 16px; height: 16px; color: var(--success); }
.analysis-animation {
  text-align: center; padding: 30px 0;
}
.analysis-spinner {
  width: 40px; height: 40px; margin: 0 auto 16px;
  border: 3px solid var(--border-primary);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
.analysis-progress-text {
  font-size: 14px; color: var(--text-secondary);
}
.analysis-detail {
  font-size: 12px; color: var(--text-muted); margin-top: 6px;
}
.profile-preview-list { margin-top: 10px; text-align: left; }
.profile-preview-item {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 10px; border-radius: var(--radius-sm);
  border: 1px solid var(--border-light); margin-bottom: 4px;
  font-size: 13px;
}
.profile-preview-label {
  font-size: 11px; font-weight: 600; color: var(--text-muted);
  min-width: 80px;
}

/* Onboarding buttons */
.onboarding-actions {
  display: flex; justify-content: space-between; align-items: center;
}
.btn-skip {
  font-size: 13px; color: var(--text-muted);
  padding: 8px 16px;
  transition: color var(--transition-fast);
}
.btn-skip:hover { color: var(--text-primary); }
.btn-onboarding-next {
  padding: 8px 24px; border-radius: var(--radius-sm);
  background: var(--brand); color: var(--text-inverse);
  font-size: 13px; font-weight: 600;
  transition: background var(--transition-fast);
}
.btn-onboarding-next:hover { background: var(--brand-hover); }
.btn-onboarding-next:disabled { opacity: 0.5; cursor: not-allowed; }

/* ============================================================
   9. Toast
   ============================================================ */
.toast-container {
  position: fixed; top: 16px; right: 16px; z-index: 2000;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  padding: 12px 16px; border-radius: var(--radius-md);
  background: var(--bg-elevated); border: 1px solid var(--border-primary);
  box-shadow: var(--shadow-lg);
  font-size: 13px;
  display: flex; align-items: center; gap: 10px;
  animation: toastIn 0.3s ease;
  max-width: 360px;
}
.toast.success svg { color: var(--success); }
.toast.info svg { color: var(--brand); }
.toast.warning svg { color: var(--warning); }
.toast svg { width: 16px; height: 16px; flex-shrink: 0; }
.toast-action {
  margin-left: auto; padding: 3px 10px;
  border-radius: var(--radius-sm); font-size: 12px; font-weight: 500;
  background: var(--brand); color: var(--text-inverse);
  white-space: nowrap; transition: background var(--transition-fast);
}
.toast-action:hover { background: var(--brand-hover); }
@keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

/* ============================================================
   10. Export/Publish Dropdown
   ============================================================ */
.dropdown {
  position: relative;
}
.dropdown-menu {
  position: absolute; top: 100%; right: 0;
  background: var(--bg-elevated); border: 1px solid var(--border-primary);
  border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
  min-width: 180px; z-index: 50;
  padding: 4px; display: none;
}
.dropdown-menu.show { display: block; }
.dropdown-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: var(--radius-sm);
  cursor: pointer; font-size: 13px;
  transition: background var(--transition-fast);
}
.dropdown-item:hover { background: var(--bg-hover); }
.dropdown-item svg { width: 16px; height: 16px; color: var(--text-muted); }

/* ============================================================
   11. Typing cursor animation
   ============================================================ */
.typing-cursor {
  display: inline-block; width: 2px; height: 1em;
  background: var(--brand); margin-left: 2px;
  animation: blink 0.8s step-end infinite;
  vertical-align: text-bottom;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

/* ============================================================
   12. Empty state
   ============================================================ */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px 20px; text-align: center;
  color: var(--text-muted); flex: 1;
}
.empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.4; }
.empty-state h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; color: var(--text-secondary); }
.empty-state p { font-size: 13px; }

/* ============================================================
   13. Animations & Transitions (Extended)
   ============================================================ */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
@keyframes bounceIn {
  0% { opacity: 0; transform: scale(0.3); }
  50% { opacity: 1; transform: scale(1.05); }
  70% { transform: scale(0.9); }
  100% { transform: scale(1); }
}
@keyframes progressFill { from { width: 0; } to { width: 100%; } }

.animate-fadeIn { animation: fadeIn 0.3s ease; }
.animate-slideUp { animation: slideUp 0.3s ease; }
.animate-scaleIn { animation: scaleIn 0.2s ease; }
.animate-bounceIn { animation: bounceIn 0.5s ease; }

/* Loading shimmer effect */
.shimmer {
  background: linear-gradient(90deg, var(--bg-hover) 25%, var(--bg-active) 50%, var(--bg-hover) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s ease-in-out infinite;
  border-radius: var(--radius-sm);
}

/* Progress bar */
.progress-bar {
  width: 100%; height: 4px; background: var(--border-light);
  border-radius: 2px; overflow: hidden;
}
.progress-bar-fill {
  height: 100%; background: var(--brand);
  border-radius: 2px; transition: width var(--transition-normal);
  animation: progressFill 2s ease;
}

/* Tooltip generic */
.tooltip {
  position: relative;
}
.tooltip::after {
  content: attr(data-tooltip);
  position: absolute; bottom: 100%; left: 50%;
  transform: translateX(-50%); padding: 4px 8px;
  background: var(--bg-elevated); border: 1px solid var(--border-primary);
  border-radius: var(--radius-sm); box-shadow: var(--shadow-sm);
  font-size: 11px; color: var(--text-secondary);
  white-space: nowrap; z-index: 100;
  opacity: 0; pointer-events: none;
  transition: opacity var(--transition-fast);
  margin-bottom: 4px;
}
.tooltip:hover::after { opacity: 1; }

/* ============================================================
   14. Markdown Preview Styles (for rendered markdown)
   ============================================================ */
.draft-content.markdown-rendered blockquote {
  border-left: 3px solid var(--brand);
  padding-left: 16px; margin: 12px 0;
  color: var(--text-secondary); font-style: italic;
}
.draft-content.markdown-rendered code {
  font-family: var(--font-mono);
  background: var(--bg-hover); padding: 2px 6px;
  border-radius: 4px; font-size: 0.9em;
}
.draft-content.markdown-rendered pre {
  background: var(--bg-hover); padding: 12px 16px;
  border-radius: var(--radius-md); overflow-x: auto;
  margin: 12px 0; font-size: 13px; line-height: 1.5;
}
.draft-content.markdown-rendered pre code {
  background: none; padding: 0;
}
.draft-content.markdown-rendered ul, .draft-content.markdown-rendered ol {
  padding-left: 24px; margin: 8px 0;
}
.draft-content.markdown-rendered li {
  margin: 4px 0;
}
.draft-content.markdown-rendered strong { font-weight: 700; }
.draft-content.markdown-rendered em { font-style: italic; }
.draft-content.markdown-rendered a { color: var(--brand); text-decoration: underline; }

/* ============================================================
   15. Context Menu & Popover
   ============================================================ */
.context-menu {
  position: fixed; z-index: 500;
  background: var(--bg-elevated); border: 1px solid var(--border-primary);
  border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
  min-width: 160px; padding: 4px;
  animation: scaleIn 0.15s ease;
}
.context-menu-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: var(--radius-sm);
  cursor: pointer; font-size: 13px;
  transition: background var(--transition-fast);
}
.context-menu-item:hover { background: var(--bg-hover); }
.context-menu-item svg { width: 14px; height: 14px; color: var(--text-muted); }
.context-menu-sep {
  height: 1px; background: var(--border-light);
  margin: 4px 0;
}
.context-menu-item.danger { color: var(--error); }
.context-menu-item.danger svg { color: var(--error); }

/* ============================================================
   16. Keyboard Shortcut Badge
   ============================================================ */
.kbd {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 20px; height: 20px; padding: 0 5px;
  background: var(--bg-hover); border: 1px solid var(--border-primary);
  border-radius: 4px; font-size: 11px;
  font-family: var(--font-sans); color: var(--text-muted);
  box-shadow: 0 1px 0 var(--border-primary);
}

/* ============================================================
   17. Status Indicators
   ============================================================ */
.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  display: inline-block; flex-shrink: 0;
}
.status-dot.online { background: var(--success); box-shadow: 0 0 0 2px var(--success-bg); }
.status-dot.offline { background: var(--text-muted); }
.status-dot.busy { background: var(--warning); box-shadow: 0 0 0 2px var(--warning-bg); }
.status-dot.error { background: var(--error); box-shadow: 0 0 0 2px var(--error-bg); }

.status-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 12px;
  font-size: 11px; font-weight: 500;
}
.status-badge.success { background: var(--success-bg); color: var(--success); }
.status-badge.warning { background: var(--warning-bg); color: var(--warning); }
.status-badge.error { background: var(--error-bg); color: var(--error); }
.status-badge.info { background: var(--brand-light); color: var(--brand); }

/* ============================================================
   18. Modal (for future use, minimal)
   ============================================================ */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 800;
  background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.2s ease;
}
.modal-backdrop.hidden { display: none; }
.modal {
  background: var(--bg-card); border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg); max-width: 480px; width: 90%;
  padding: 24px; animation: scaleIn 0.2s ease;
}
.modal h3 { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
.modal p { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 16px; }
.modal-actions {
  display: flex; justify-content: flex-end; gap: 8px;
}

/* ============================================================
   19. Scrollbar Enhancements (Webkit)
   ============================================================ */
.message-flow::-webkit-scrollbar { width: 5px; }
.message-flow::-webkit-scrollbar-thumb { background: var(--border-primary); border-radius: 3px; }
.message-flow::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
.sidebar-nav::-webkit-scrollbar { width: 4px; }
.sidebar-nav::-webkit-scrollbar-thumb { background: transparent; }
.sidebar-nav:hover::-webkit-scrollbar-thumb { background: var(--border-primary); border-radius: 2px; }
.draft-content::-webkit-scrollbar { width: 5px; }
.draft-content::-webkit-scrollbar-thumb { background: var(--border-primary); border-radius: 3px; }

/* ============================================================
   20. Print Styles
   ============================================================ */
@media print {
  .sidebar, .collab-panel, .diff-bar, .reflection-bar,
  .draft-toolbar, .text-float-bar, .toast-container,
  .onboarding-overlay { display: none !important; }
  #app { display: block !important; }
  .draft-panel { width: 100% !important; border: none !important; }
  .draft-content { padding: 0 !important; font-size: 12pt !important; }
}

/* ============================================================
   21. Reduced Motion
   ============================================================ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ============================================================
   22. Responsive (Tablet / Narrow)
   ============================================================ */
@media (max-width: 1024px) {
  #app { grid-template-columns: 200px 1fr 1fr; }
}
@media (max-width: 768px) {
  #app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .sidebar { display: none; }
  .draft-panel { display: none; }
  .draft-panel.force-show { display: flex; position: fixed; inset: 0; z-index: 500; }
}

/* ============================================================
   23. Focus Visible
   ============================================================ */
:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}
button:focus:not(:focus-visible),
input:focus:not(:focus-visible),
textarea:focus:not(:focus-visible),
select:focus:not(:focus-visible) {
  outline: none;
}

/* ============================================================
   24. Misc Utility Classes
   ============================================================ */
.text-brand { color: var(--brand); }
.text-success { color: var(--success); }
.text-error { color: var(--error); }
.text-warning { color: var(--warning); }
.text-muted { color: var(--text-muted); }
.text-secondary { color: var(--text-secondary); }
.text-center { text-align: center; }
.text-right { text-align: right; }
.text-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.font-serif { font-family: var(--font-serif); }
.font-mono { font-family: var(--font-mono); }
.font-bold { font-weight: 700; }
.font-medium { font-weight: 500; }
.mt-0 { margin-top: 0; }

.mt-8 { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.mt-16 { margin-top: 16px; }
.mb-8 { margin-bottom: 8px; }
.mb-12 { margin-bottom: 12px; }
.mb-16 { margin-bottom: 16px; }
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-4 { gap: 4px; }
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.w-full { width: 100%; }
.overflow-hidden { overflow: hidden; }
.relative { position: relative; }
.opacity-0 { opacity: 0; }
.opacity-50 { opacity: 0.5; }
.pointer-events-none { pointer-events: none; }

<p>最近在整理过去一年的设计项目时，我发现自己反复回到同一个话题：简约。这并不是什么新概念——从 Dieter Rams 的「好的设计是尽可能少的设计」到 Apple 的设计哲学，简约已经被讨论了几十年。但每当我以为理解了它，又会在某个项目中重新发现它的复杂性。</p>

<p class="editable-segment" data-seg-id="seg-1">简约不是简单的减少元素，而是一种更深层的思考方式。它要求我们在做每一个设计决策的时候，都要问自己：这个元素是否真正为用户提供了价值？如果没有，那就大胆地移除它。</p>

<p>一个有趣的观察：最简约的界面往往需要最多的设计迭代。我们在做「笔记应用」改版的时候，最初的想法是把所有功能都摆在首页——搜索、分类、标签、最近编辑，一个都不能少。结果用户反馈说找不到重点，信息过载。最终我们只保留了核心的编辑入口和最近三条笔记，反而让用户觉得「什么都能找到」。</p>

<p>留白不是「空」，是呼吸。这个道理说起来简单，但实践起来非常反直觉。尤其是在产品评审的时候，总有人会指着一大片空白问：「这里能不能再塞点什么？」我的经验是，留白需要被当成一种设计元素来对待，它和文字、图片一样，承载着信息——节奏、层次、重点。</p>

<p>克制是一种能力，不是限制。在设计系统里，克制意味着控制颜色数量、字号层级、组件变体。每增加一个变体，就增加一份维护成本和认知负担。我曾经见过一个设计系统有 47 种按钮样式，每种还有 hover、active、disabled 三个状态——那不是系统，是迷宫。</p>

<p>简约设计最终指向的不是视觉风格，而是一种态度：对用户的尊重。尊重他们的时间、注意力和认知负荷。每一次不必要的设计，都是在消耗用户的耐心。</p>

<h2>写在后面</h2>

<p>写完这篇短文，我自己也重新审视了手头正在做的项目。确实有几个地方的「克制」还不够——比如设置页面里那个 47 种按钮的设计系统，虽然夸张了点，但也不算太离谱。简化设计系统这件事，说起来容易做起来难，因为它不只是视觉层面的删减，还涉及到团队共识、历史包袱和迁移成本。</p>

<p>但至少，简约给了我一个方向感。每当我犹豫要不要加一个新功能、新按钮、新页面的时候，我会停下来问自己那句老话：这东西真的在为用户创造价值吗？</p>

<p>如果答案不是确定的「是」，那就先别加。</p>

<blockquote>「好的设计是尽可能少的设计。」—— Dieter Rams</blockquote>`
};

function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }
function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k, v]) => {
    if (k === 'className') e.className = v;
    else if (k === 'innerHTML') e.innerHTML = v;
    else if (k === 'textContent') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else e.setAttribute(k, v);
  });
  children.flat().forEach(c => { if (typeof c === 'string') e.appendChild(document.createTextNode(c)); else if (c) e.appendChild(c); });
  return e;
}

function showToast(message, type = 'info', actionLabel, actionFn) {
  const container = $('#toast-container');
  const icons = {
    success: '<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 8l2 2 3.5-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    info: '<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5"/><path d="M8 7v4M8 5v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
    warning: '<svg viewBox="0 0 16 16" fill="none"><path d="M8 2L1.5 13h13L8 2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 6.5v3M8 11.5v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>'
  };
  const t = el('div', { className: `toast ${type}` });
  t.innerHTML = icons[type] || icons.info;
  t.appendChild(document.createTextNode(' ' + message));
  if (actionLabel) {
    const btn = el('button', { className: 'toast-action', textContent: actionLabel, onClick: actionFn });
    t.appendChild(btn);
  }
  container.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(20px)'; t.style.transition = 'all 0.3s ease'; setTimeout(() => t.remove(), 300); }, 4000);
}

function formatTime() {
  const d = new Date();
  return `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
}

function getWordCount(text) {
  const plain = text.replace(/<[^>]*>/g, '').replace(/\s+/g, '');
  return plain.length;
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

  $('#analysis-detail').textContent = i18n.onboard.analysisDetail;
  $('#step4-title').textContent = i18n.onboard.step4Title;
  $('#step4-desc').textContent = i18n.onboard.step4Desc;
  $('#btn-skip').textContent = i18n.onboard.skip;
  $('#btn-next').textContent = i18n.onboard.next;

  renderStepDots();
  renderSeedFiles();

  // Bind button events
  $('#btn-skip').addEventListener('click', skipOnboarding);

  $('#btn-next').addEventListener('click', () => {
    const step = state.onboardingStep;
    if (step === 1) {
      const path = $('#workspace-path').value.trim();
      if (!path) {
        $('#workspace-path').style.borderColor = 'var(--error)';
        $('#workspace-path').focus();
        return;
      }
      state.workspacePath = path;
      setOnboardingStep(2);
    } else if (step === 2) {
      setOnboardingStep(3);
    } else if (step === 3) {
      // disabled during analysis, no-op
    } else if (step === 4) {
      completeOnboarding();
    }
  });

  $('#btn-browse').addEventListener('click', () => {
    $('#workspace-path').value = '~/Documents/SmartWriter';
    $('#workspace-path').style.borderColor = 'var(--border-primary)';
  });

  $('#workspace-path').addEventListener('input', () => {
    $('#workspace-path').style.borderColor = 'var(--border-primary)';
  });

  // Seed upload zone click
  const uploadZone = $('#upload-zone');
  if (uploadZone) {
    uploadZone.addEventListener('click', () => {
      // Simulate adding a seed file
      uploadZone.classList.add('uploading');
      setTimeout(() => {
        uploadZone.classList.remove('uploading');
        renderSeedFiles(); // re-render to show files
      }, 500);
    });
  }
}

function renderStepDots() {
  const dots = $('#step-dots');
  dots.innerHTML = '';
  for (let i = 1; i <= 4; i++) {
    const dot = el('div', { className: `step-dot${i === state.onboardingStep ? ' active' : ''}${i < state.onboardingStep ? ' done' : ''}` });
    dots.appendChild(dot);
  }
}

function setOnboardingStep(step) {
  state.onboardingStep = step;
  $$('.onboarding-step').forEach(s => s.classList.remove('active'));
  $(`.onboarding-step[data-step="${step}"]`).classList.add('active');
  renderStepDots();
  const nextBtn = $('#btn-next');
  if (step === 3) {
    nextBtn.disabled = true;
    nextBtn.textContent = i18n.onboard.analysisText;
    simulateAnalysis();
  } else if (step === 4) {
    nextBtn.disabled = false;
    nextBtn.textContent = i18n.onboard.done;
    renderProfilePreview();
  } else if (step === 1) {
    nextBtn.textContent = i18n.onboard.next;
    nextBtn.disabled = false;
  } else {
    nextBtn.textContent = i18n.onboard.next;
    nextBtn.disabled = false;
  }
}

function simulateAnalysis() {
  const details = [
    '提取用词频率分布...',
    '分析句式结构偏好...',
    '识别价值观关键词...',
    '构建初始画像模型...'
  ];
  let idx = 0;
  const interval = setInterval(() => {
    if (idx < details.length) {
      $('#analysis-detail').textContent = details[idx];
      idx++;
    } else {
      clearInterval(interval);
      $('#analysis-text').textContent = '画像生成完成！';

}

// ============================================================
// JavaScript — Streaming Simulation
// ============================================================
function simulateStream(text, onDone) {
  state.isStreaming = true;
  state.streamAbort = false;
  const { msg, bubble, right } = addMessageToFlow('assistant', '');
  bubble.innerHTML = '<span class="typing-cursor"></span>';

  // Add stop controls
  const controls = el('div', { className: 'stream-controls' });
  controls.innerHTML = `
    <button class="btn-stop" id="btn-stop-stream">
      <svg viewBox="0 0 12 12" fill="currentColor"><rect x="2" y="2" width="8" height="8" rx="1.5"/></svg>
      ${i18n.chat.stop}
    </button>
  `;
  right.appendChild(controls);
  $('#btn-stop-stream').addEventListener('click', () => { state.streamAbort = true; });

  let idx = 0;
  let displayed = '';
  const interval = setInterval(() => {
    if (state.streamAbort) {
      clearInterval(interval);
      controls.remove();
      state.isStreaming = false;
      bubble.innerHTML = escapeHtml(displayed).replace(/\n/g, '<br>');
      if (onDone) onDone(displayed, true);
      return;
    }
    if (idx < text.length) {
      // Output 1-3 chars at a time for natural feel
      const chunk = text.substring(idx, idx + Math.floor(Math.random() * 3) + 1);
      displayed += chunk;
      idx += chunk.length;
      bubble.innerHTML = escapeHtml(displayed).replace(/\n/g, '<br>') + '<span class="typing-cursor"></span>';
      $('#message-flow').scrollTop = $('#message-flow').scrollHeight;
    } else {
      clearInterval(interval);
      bubble.innerHTML = escapeHtml(displayed).replace(/\n/g, '<br>');
      controls.remove();
      state.isStreaming = false;
      if (onDone) onDone(displayed, false);
    }
  }, 30);
}

function simulateToolProgress(container, startText, doneText, duration) {
  return new Promise(resolve => {
    const prog = el('div', { className: 'tool-progress' });
    prog.innerHTML = `<div class="spinner"></div><span>${startText}</span>`;
    container.appendChild(prog);
    setTimeout(() => {
      prog.innerHTML = `<span class="check">✓</span><span>${doneText}</span>`;
      resolve();
    }, duration);
  });
}

// ============================================================
// JavaScript — Diff Operations
// ============================================================
function showDiff(segId, original, modified) {
  state.currentDiff = { segId, original, modified };
  const seg = $(`[data-seg-id="${segId}"]`);
  if (!seg) return;
  // Generate diff inline
  seg.innerHTML = createDiffHTML(original, modified);
  seg.classList.add('diff-active');
  // Show diff bar
  const diffBar = $('#diff-bar');
  diffBar.classList.add('show');
  // Open draft if collapsed
  if ($('#app').classList.contains('draft-collapsed')) {
    $('#app').classList.remove('draft-collapsed');
  }
}

function createDiffHTML(original, modified) {
  // Simple word-level diff visualization
  const origWords = original.split('');
  const modWords = modified.split('');
  let result = '';
  let i = 0, j = 0;
  // Simple approach: show deletions then additions
  result += `<span class="diff-del">${escapeHtml(original)}</span>`;
  result += `<span class="diff-add">${escapeHtml(modified)}</span>`;
  return result;
}

function acceptDiffAll() {
  if (!state.currentDiff) return;
  const { segId, modified } = state.currentDiff;
  const seg = $(`[data-seg-id="${segId}"]`);
  if (seg) {
    seg.innerHTML = escapeHtml(modified);
    seg.classList.remove('diff-active');
    // Update state content
    state.draftContent = $('#draft-content').innerHTML;
    updateWordCount();
  }
  hideDiffBar();
  state.currentDiff = null;
  showToast(i18n.toast.profileSaved, 'success');
}

function rejectDiff() {
  if (!state.currentDiff) return;
  const { segId, original } = state.currentDiff;
  const seg = $(`[data-seg-id="${segId}"]`);
  if (seg) {
    seg.innerHTML = escapeHtml(original);
    seg.classList.remove('diff-active');
  }
  hideDiffBar();
  state.currentDiff = null;
}

function hideDiffBar() {
  $('#diff-bar').classList.remove('show');
}

function acceptDiffPartial() {
  if (!state.currentDiff) return;
  const { segId, modified } = state.currentDiff;
  const seg = $(`[data-seg-id="${segId}"]`);
  if (seg) {
    // In a real app this would allow individual diff hunk selection
    // For prototype, accept all with a toast explaining
    seg.innerHTML = escapeHtml(modified);
    seg.classList.remove('diff-active');
    state.draftContent = $('#draft-content').innerHTML;
    updateWordCount();
  }
  hideDiffBar();
  state.currentDiff = null;
  showToast('已逐处采纳修改', 'success');
}

// JavaScript — Command Menu
// ============================================================
function initCommandMenu() {
  $('#cmd-menu-header').textContent = '命令';
  renderCommandList();
  $('#chat-input').placeholder = i18n.chat.inputPlaceholder;
}

function renderCommandList() {
  const list = $('#cmd-list');
  list.innerHTML = '';
  const filtered = i18n.commands.filter(c => c.name.includes(state.commandFilter));
  filtered.forEach((cmd, idx) => {
    const item = el('div', {
      className: 'command-item' + (idx === state.commandIndex ? ' active' : ''),
      innerHTML: `
        <div class="command-item-left">
          <span class="command-item-name">${cmd.name}</span>
        </div>
        <span class="command-item-desc">${cmd.desc}</span>
      `
    });
    item.addEventListener('click', () => executeCommand(cmd.name));
    item.addEventListener('mouseenter', () => {
      state.commandIndex = idx;
      $$('.command-item').forEach(c => c.classList.remove('active'));
      item.classList.add('active');
    });
    list.appendChild(item);
  });
}

function toggleCommandMenu(show) {
  const menu = $('#command-menu');
  state.commandMenuOpen = show;
  if (show) {
    state.commandFilter = '';
    state.commandIndex = 0;
    renderCommandList();
    menu.classList.add('show');
  } else {
    menu.classList.remove('show');
  }
}

function executeCommand(cmdName) {
  toggleCommandMenu(false);
  $('#chat-input').value = '';
  switch (cmdName) {
    case '/polish': handlePolish(); break;
    case '/expand': handleExpand(); break;
    case '/restructure': handleRestructure(); break;
    case '/restyle': handleRestyle(); break;
    case '/research': handleResearch(); break;
    case '/xhs_style': handleXhsStyle(); break;
    case '/plan': handlePlan(); break;
    case '/export': handleExport(); break;
    case '/publish': handlePublish(); break;
    case '/profile': showProfileView(); break;
  }
}

  const stepTexts = [
    '好的，我来撰写引言部分。简约这个话题已经被讨论了几十年，但我想从一个更个人化的角度切入——为什么每当我以为理解了简约，又会在新项目中重新发现它的复杂性。',
    '开始写核心论述一：减法思维。简约不是简单的减少元素，而是一种更深层的思考方式。真正的简约要求我们在每个设计决策面前都追问：这个元素是否真正为用户创造了价值？',
    '撰写核心论述二：留白的力量。留白不是「空」，是呼吸。这个道理说起来简单，但实践起来非常反直觉。留白需要被当成一种设计元素来对待。',
    '撰写核心论述三：克制的美学。克制是一种能力，不是限制。在设计系统里，克制意味着控制颜色数量、字号层级、组件变体。',
    '撰写案例分析部分：Dieter Rams 的十个原则。从 Rams 的设计哲学出发，结合实际项目经验，分析简约如何在产品中落地。',
    '撰写结语：简约设计最终指向的不是视觉风格，而是一种态度——对用户的尊重。'
  ];

  simulateStream(stepTexts[idx] || `正在撰写：${step}`, (displayed, aborted) => {
    if (aborted) return;
    // Mark step as done
    state.planSteps[idx].done = true;
    if (idx + 1 < state.planSteps.length) {
      state.planCurrentStep = idx + 1;
    }
    addPlanToSidebar();
    // Show diff in draft for the relevant segment
    if (idx === 0) {
      const newIntro = '最近在整理过去一年的设计项目时，我发现自己反复回到同一个话题：简约。这并不是什么新概念——从 Dieter Rams 的「好的设计是尽可能少的设计」到 Apple 的设计哲学，简约已经被讨论了几十年。但每当我以为理解了它，又会在某个项目中重新发现它的魅力和复杂性。也许这就是简约最有趣的地方：它看似简单，实则深不可测。';
      showDiff(null, null, null);
      // Direct update for plan steps
      showToast(`步骤 ${idx + 1} 完成`, 'success');
      if (idx + 1 < state.planSteps.length) {
        showToast(`下一步：${state.planSteps[idx + 1].text}`, 'info');
      }
    } else {
      showToast(`步骤 ${idx + 1} 完成`, 'success');
      if (idx + 1 < state.planSteps.length) {
        showToast(`下一步：${state.planSteps[idx + 1].text}`, 'info');
      } else {
        showToast('所有计划步骤已完成！', 'success');
        state.planActive = false;
      }
    }
  });
}

function handleExport() {
  const menu = $('#export-menu');
  if (menu.classList.contains('show')) {
    menu.classList.remove('show');
    return;
  }
  menu.innerHTML = '';
  Object.entries(i18n.draft.exportMenu).forEach(([key, label]) => {
    const item = el('div', { className: 'dropdown-item', textContent: label });
    item.addEventListener('click', () => {
      menu.classList.remove('show');
      simulateExport(key, label);

}

function createProfileItem(item) {
  const div = el('div', { className: 'profile-item', 'data-id': item.id });
  const labelSpan = el('span', { className: 'profile-item-label', textContent: item.label });
  const contentSpan = el('span', {
    className: 'profile-item-content',
    contentEditable: 'true',
    innerHTML: item.content
  });
  contentSpan.addEventListener('blur', () => {
    const newContent = contentSpan.textContent.trim();
    // Update state
    let found = state.globalProfile.values.find(v => v.id === item.id);
    if (found) found.content = newContent;
    found = state.globalProfile.taboos.find(v => v.id === item.id);
    if (found) found.content = newContent;
    Object.values(state.genreProfiles).forEach(items => {
      const fi = items.find(v => v.id === item.id);
      if (fi) fi.content = newContent;
    });
    // Show toast with rewrite option
    showToast(i18n.profile.updated, 'info', i18n.profile.yes, () => {
      triggerProfileRestyle();
    });
  });
  const deleteBtn = el('button', { className: 'profile-item-delete' });
  deleteBtn.innerHTML = '<svg viewBox="0 0 12 12" fill="none"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
  deleteBtn.addEventListener('click', () => {
    div.remove();
    state.globalProfile.values = state.globalProfile.values.filter(v => v.id !== item.id);
    state.globalProfile.taboos = state.globalProfile.taboos.filter(v => v.id !== item.id);
    Object.keys(state.genreProfiles).forEach(k => {
      state.genreProfiles[k] = state.genreProfiles[k].filter(v => v.id !== item.id);
    });
  });
  div.appendChild(labelSpan);
  div.appendChild(contentSpan);
  div.appendChild(deleteBtn);
  return div;
}

function renderGenreItems() {
  const container = $('#genre-profile-items');
  if (!container) return;
  container.innerHTML = '';
  const items = state.genreProfiles[state.currentGenreTab] || [];
  items.forEach(item => container.appendChild(createProfileItem(item)));
  const addBtn = el('button', { className: 'profile-add-btn', textContent: i18n.profile.addItem });
  addBtn.addEventListener('click', () => {
    const newItem = { id: 'e' + Date.now(), label: '新条目', content: '点击编辑内容' };
    state.genreProfiles[state.currentGenreTab].push(newItem);
    renderGenreItems();
  });
  container.appendChild(addBtn);
}

      });

function handleTextSelection() {
  const selection = window.getSelection();
  const selectedText = selection.toString().trim();
  const floatBar = $('#text-float-bar');

  if (selectedText.length > 0 && $('#draft-content').contains(selection.anchorNode)) {
    state.selectedText = selectedText;
    const rect = selection.getRangeAt(0).getBoundingClientRect();
    floatBar.style.top = (rect.top - 44) + 'px';
    floatBar.style.left = (rect.left + rect.width / 2 - 160) + 'px';
    floatBar.classList.add('show');
  } else {
    floatBar.classList.remove('show');
  }
}

// ============================================================
// JavaScript — Event Bindings
// ============================================================
function bindEvents() {
  // Onboarding
  $('#btn-next').addEventListener('click', () => {
    if (state.onboardingStep < 4) {
      setOnboardingStep(state.onboardingStep + 1);
    } else if (state.onboardingStep === 4) {
      completeOnboarding();
    }
  });
  $('#btn-skip').addEventListener('click', skipOnboarding);
  $('#btn-browse').addEventListener('click', () => {
    showToast('目录选择已模拟完成', 'info');
  });
  $('#upload-zone').addEventListener('click', () => {
    showToast('文件上传已模拟完成', 'info');
  });

  // Theme toggle
  $('#theme-toggle').addEventListener('click', () => {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    const next = current === 'light' ? 'dark' : 'light';
    html.setAttribute('data-theme', next);
    state.theme = next;
    updateThemeIcon();
  });

  // Send message
  $('#btn-send').addEventListener('click', handleSend);
  $('#chat-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (state.commandMenuOpen) {
        const items = $$('.command-item');
        if (items[state.commandIndex]) items[state.commandIndex].click();
        return;
      }
      handleSend();
    }
    // Command menu keyboard nav
    if (state.commandMenuOpen) {
      const filtered = i18n.commands.filter(c => c.name.includes(state.commandFilter));
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        state.commandIndex = Math.min(state.commandIndex + 1, filtered.length - 1);
        renderCommandList();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        state.commandIndex = Math.max(state.commandIndex - 1, 0);
        renderCommandList();
      } else if (e.key === 'Escape') {
        toggleCommandMenu(false);
        $('#chat-input').value = '';
      }
    }
  });
  $('#chat-input').addEventListener('input', (e) => {
    const val = e.target.value;
    if (val.startsWith('/')) {
      state.commandFilter = val.substring(1);
      state.commandIndex = 0;
      if (!state.commandMenuOpen) toggleCommandMenu(true);
      renderCommandList();
    } else if (state.commandMenuOpen) {
      toggleCommandMenu(false);
    }
  });

  // Draft collapse
  $('#btn-collapse-draft').addEventListener('click', () => {
    $('#app').classList.add('draft-collapsed');
    state.showDraft = false;
  });

  // Expand draft button (hidden until collapsed)
  // Add expand trigger in collab header
  const expandBtn = el('button', {
    className: 'theme-toggle',
    title: '展开稿件',
    innerHTML: '<svg viewBox="0 0 18 18" fill="none"><path d="M12 3l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 8h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
    onClick: () => {
      $('#app').classList.remove('draft-collapsed');
      state.showDraft = true;
    }
  });
  $('.collab-header-right').insertBefore(expandBtn, $('#theme-toggle'));

  // View toggle
  $$('#view-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      $$('#view-toggle button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.draftMode = btn.dataset.view;
      const content = $('#draft-content');
      if (state.draftMode === 'markdown') {
        content.classList.add('markdown-view');
        content.textContent = state.draftContent
          .replace(/<h1>(.*?)<\/h1>/g, '# $1\n\n')
          .replace(/<h2>(.*?)<\/h2>/g, '## $1\n\n')
          .replace(/<h3>(.*?)<\/h3>/g, '### $1\n\n')
          .replace(/<p[^>]*>/g, '')
          .replace(/<\/p>/g, '\n\n')
          .replace(/<[^>]*>/g, '')
          .trim();
      } else {
        content.classList.remove('markdown-view');
        content.innerHTML = state.draftContent;
      }
    });
  });

  // Diff bar actions
  $('#diff-accept-all').addEventListener('click', acceptDiffAll);
  $('#diff-reject').addEventListener('click', rejectDiff);
  $('#diff-accept-partial').addEventListener('click', acceptDiffPartial);

  // Export button
  $('#btn-export').addEventListener('click', handleExport);
  $('#btn-publish').addEventListener('click', handlePublish);

  // Profile nav
  $('#nav-profile').addEventListener('click', () => {
    if (state.currentView === 'profile') {
      hideProfileView();
    } else {
      showProfileView();
    }
  });
  $('#btn-back-to-draft').addEventListener('click', hideProfileView);

  // Text selection float bar
  $('#float-polish').textContent = '润色';
  $('#float-expand').textContent = '扩写';
  $('#float-restructure').textContent = '重构';
  $('#float-ask').textContent = '提问';
  document.addEventListener('mouseup', handleTextSelection);

  $$('#text-float-bar .text-float-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      $('#text-float-bar').classList.remove('show');
      const action = btn.dataset.action;
      if (!state.selectedText) return;
      switch (action) {
        case 'polish':
          addMessageToFlow('user', `润色选中内容：${state.selectedText.substring(0, 30)}...`);
          simulateStream('好的，我来润色你选中的这段文字。', (d, a) => {
            if (a) return;
            showDiff('seg-1', i18n.samplePolishOriginal, i18n.samplePolishNew);
          });
          break;
        case 'expand':
          addMessageToFlow('user', `扩写选中内容：${state.selectedText.substring(0, 30)}...`);
          simulateStream('好的，我来扩写你选中的这段文字。', (d, a) => {
            if (a) return;
            showToast('扩写完成，预览已呈现在右侧稿件中', 'success');
          });
          break;
        case 'restructure':
          addMessageToFlow('user', `重构选中内容：${state.selectedText.substring(0, 30)}...`);
          simulateStream('好的，我来重构你选中的这段文字。', (d, a) => {
            if (a) return;
            showToast('重构完成，预览已呈现在右侧稿件中', 'success');
          });
          break;
        case 'ask':
          addMessageToFlow('user', `关于选中内容提问：${state.selectedText.substring(0, 30)}...`);
          simulateStream('你选中的这段提到了简约设计的核心理念。你希望我具体解释哪个方面？比如：1) 如何在实践中判断一个元素是否有价值 2) 减法思维与留白的关系 3) 有哪些经典案例可以参考？', (d, a) => {});
          break;
      }
      window.getSelection().removeAllRanges();
    });
  });

  // Model select change cost estimate
  $('#model-select').addEventListener('change', () => {
    const model = $('#model-select').value;
    const cost = model === 'opus' ? '$0.08' : '$0.03';
    $('#cost-value').textContent = cost + ' 预估';
  });

  // Cost tooltip
  $('#cost-tooltip-text').textContent = i18n.chat.costTooltip;

  // Close dropdowns on outside click
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.dropdown')) {
      $$('.dropdown-menu').forEach(m => m.classList.remove('show'));
    }
  });

  // New task button
  $('#btn-new-task').addEventListener('click', () => {
    showToast('新任务创建已模拟', 'info');
  });

  // Nav items
  $('#nav-artifacts').addEventListener('click', () => {
    showToast('Artifacts 面板开发中', 'info');
  });
  $('#nav-settings').addEventListener('click', () => {
    showToast('设置面板开发中', 'info');
  });
}

// ============================================================
// JavaScript — Generic Send Handler
// ============================================================
function handleSend() {
  const input = $('#chat-input');
  const text = input.value.trim();
  if (!text || state.isStreaming) return;

  // Check if it's a command
  if (text.startsWith('/')) {
    const cmdName = text.split(' ')[0];
    if (i18n.commands.find(c => c.name === cmdName)) {
      executeCommand(cmdName);
      return;
    }
  }

  addMessageToFlow('user', text);

  // If text contains certain keywords, simulate relevant response
  if (text.includes('改写') || text.includes('重写')) {
    showClarificationCard();
    return;
  }

  if (text.includes('画像') || text.includes('风格')) {
    simulateStream('你当前的写作画像显示你偏好口语化、短句为主的表达方式。最新的画像更新包括了更具体的「避免互联网黑话」禁忌规则。是否需要我根据画像调整稿件风格？', (d, a) => {});
    return;
  }

  // Default response
  const responses = [
    '收到！让我看看你的稿件，思考一下怎么处理这个请求。',
    '好的，我来分析一下当前稿件的内容，然后给出建议。',
    '明白了，让我先检索一下相关的素材和上下文。',
  ];
  const resp = responses[Math.floor(Math.random() * responses.length)];
  simulateStream(resp, (displayed, aborted) => {
    if (aborted) return;
    const { msg } = addMessageToFlow('assistant', '');
    const right = msg.querySelector('.bubble').parentElement;
    simulateToolProgress(right, i18n.tool.grepStart, i18n.tool.grepDone, 1500).then(() => {
      msg.querySelector('.bubble').innerHTML = displayed + '<br><br>分析完成。你可以在右侧稿件中选中文字，使用浮起工具条进行操作，或者输入 / 查看更多命令。';
    });
  });

  input.value = '';
}

// ============================================================
// JavaScript — Event Protocol Dispatcher
// Simulates the event protocol for future SSE integration.
// All simulated events go through dispatchEvent() so that
// swapping in real SSE is a drop-in replacement.
// ============================================================
const eventHandlers = {
  text_delta: [],
  tool_start: [],
  tool_result: [],
  ask_question: [],
  approval_request: [],
  todo_update: [],
  status: [],
  done: [],
  draft_patch: [],
  patch_accepted: [],
  reflection_step: [],
};

function onEvent(eventName, handler) {
  if (eventHandlers[eventName]) {
    eventHandlers[eventName].push(handler);
  }
}

function emitEvent(eventName, payload) {
  if (eventHandlers[eventName]) {
    eventHandlers[eventName].forEach(handler => {
      try { handler(payload); } catch (e) { console.error(`Event handler error [${eventName}]:`, e); }
    });
  }
}

// Register default event handlers for UI updates
onEvent('text_delta', (payload) => {
  // Handled by simulateStream directly for now
  // In real SSE, this would update the streaming bubble
});

onEvent('tool_start', (payload) => {
  // Show inline tool progress
  const flow = $('#message-flow');
  const lastMsg = flow.querySelector('.message.assistant:last-child .bubble');
  if (lastMsg) {
    const right = lastMsg.parentElement;
    const prog = el('div', { className: 'tool-progress', id: 'tool-progress-' + payload.id });
    prog.innerHTML = `<div class="spinner"></div><span>${payload.text}</span>`;
    right.appendChild(prog);
  }
});

onEvent('tool_result', (payload) => {
  const prog = $(`#tool-progress-${payload.id}`);
  if (prog) {
    prog.innerHTML = `<span class="check">✓</span><span>${payload.text}</span>`;
  }
});

onEvent('draft_patch', (payload) => {
  showDiff(payload.segId, payload.original, payload.modified);
});

onEvent('patch_accepted', () => {
  showToast(i18n.toast.profileSaved, 'success');
});

onEvent('reflection_step', (payload) => {
  state.reflectionStatus[payload.index] = payload.passed;
  renderReflectionBar();
});

onEvent('todo_update', (payload) => {
  if (state.planSteps[payload.index]) {
    state.planSteps[payload.index].done = payload.done;
    addPlanToSidebar();
  }
});

onEvent('status', (payload) => {
  // Could update a global status indicator
});

onEvent('done', () => {
  state.isStreaming = false;
});

// ============================================================
// JavaScript — Auto-resize Textarea
// ============================================================
function autoResizeTextarea(textarea) {
  textarea.style.height = 'auto';
  const newHeight = Math.min(textarea.scrollHeight, 120);
  textarea.style.height = newHeight + 'px';
}

// Apply auto-resize after init
const chatInput = $('#chat-input');
if (chatInput) {
  chatInput.addEventListener('input', () => autoResizeTextarea(chatInput));
  chatInput.addEventListener('focus', () => autoResizeTextarea(chatInput));
}

// ============================================================
// JavaScript — Keyboard Shortcuts
// ============================================================
document.addEventListener('keydown', (e) => {
  // Cmd/Ctrl + K: Focus search
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    $('#search-input')?.focus();
  }
  // Cmd/Ctrl + /: Focus input with command menu
  if ((e.metaKey || e.ctrlKey) && e.key === '/') {
    e.preventDefault();
    $('#chat-input')?.focus();
    $('#chat-input').value = '/';
    toggleCommandMenu(true);
  }
  // Cmd/Ctrl + B: Toggle sidebar (future)
  // Cmd/Ctrl + D: Toggle draft panel
  if ((e.metaKey || e.ctrlKey) && e.key === 'd') {
    e.preventDefault();
    if ($('#app').classList.contains('draft-collapsed')) {
      $('#app').classList.remove('draft-collapsed');
      state.showDraft = true;
    } else {
      $('#app').classList.add('draft-collapsed');
      state.showDraft = false;
    }
  }
  // Escape: Close modals, menus, float bar
  if (e.key === 'Escape') {
    if (state.commandMenuOpen) {
      toggleCommandMenu(false);
      $('#chat-input').value = '';
    }
    $('#text-float-bar').classList.remove('show');
    $$('.dropdown-menu').forEach(m => m.classList.remove('show'));
    window.getSelection().removeAllRanges();
  }
});
