<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日期周数计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 520px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 36px;
        }

        .header .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            color: #a0aec0;
        }

        .date-section {
            margin-bottom: 24px;
        }

        .date-section .section-title {
            font-size: 15px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .date-section .section-title .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot.start {
            background: #48bb78;
        }

        .dot.end {
            background: #ed8936;
        }

        .date-inputs {
            display: flex;
            gap: 10px;
        }

        .date-inputs .input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .date-inputs label {
            font-size: 12px;
            color: #a0aec0;
            font-weight: 500;
        }

        .date-inputs input,
        .date-inputs select {
            width: 100%;
            padding: 12px 10px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            text-align: center;
            color: #2d3748;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #f7fafc;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        .date-inputs input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
            background: #ffffff;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
        }

        .divider .line {
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .divider .arrow {
            font-size: 20px;
            color: #a0aec0;
        }

        .btn-calculate {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            margin-bottom: 24px;
        }

        .btn-calculate:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-calculate:active {
            transform: translateY(0);
        }

        .result {
            display: none;
            background: #f7fafc;
            border-radius: 14px;
            padding: 24px;
            text-align: center;
        }

        .result.show {
            display: block;
            animation: fadeInUp 0.4s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result .big-number {
            font-size: 56px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .result .big-unit {
            font-size: 20px;
            font-weight: 600;
            color: #4a5568;
            margin-left: 4px;
        }

        .result .detail {
            margin-top: 12px;
            font-size: 14px;
            color: #718096;
            line-height: 1.8;
        }

        .result .detail span {
            font-weight: 600;
            color: #4a5568;
        }

        .error-msg {
            display: none;
            background: #fff5f5;
            border: 1px solid #fc8181;
            border-radius: 10px;
            padding: 12px 16px;
            color: #c53030;
            font-size: 14px;
            margin-bottom: 16px;
            text-align: center;
        }

        .error-msg.show {
            display: block;
        }

        .footer-note {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #cbd5e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon">📅</div>
            <h1>日期周数计算器</h1>
            <p>输入起止日期，自动计算间隔周数</p>
        </div>

        <div id="errorMsg" class="error-msg"></div>

        <!-- 开始日期 -->
        <div class="date-section">
            <div class="section-title">
                <span class="dot start"></span> 开始日期
            </div>
            <div class="date-inputs">
                <div class="input-group">
                    <label>年</label>
                    <input type="number" id="startYear" placeholder="2026" min="1900" max="2100" value="2026">
                </div>
                <div class="input-group">
                    <label>月</label>
                    <input type="number" id="startMonth" placeholder="1" min="1" max="12" value="1">
                </div>
                <div class="input-group">
                    <label>日</label>
                    <input type="number" id="startDay" placeholder="1" min="1" max="31" value="1">
                </div>
            </div>
        </div>

        <!-- 分隔线 -->
        <div class="divider">
            <span class="line"></span>
            <span class="arrow">⬇</span>
            <span class="line"></span>
        </div>

        <!-- 结束日期 -->
        <div class="date-section">
            <div class="section-title">
                <span class="dot end"></span> 结束日期
            </div>
            <div class="date-inputs">
                <div class="input-group">
                    <label>年</label>
                    <input type="number" id="endYear" placeholder="2026" min="1900" max="2100" value="2026">
                </div>
                <div class="input-group">
                    <label>月</label>
                    <input type="number" id="endMonth" placeholder="6" min="1" max="12" value="6">
                </div>
                <div class="input-group">
                    <label>日</label>
                    <input type="number" id="endDay" placeholder="17" min="1" max="31" value="17">
                </div>
            </div>
        </div>

        <div style="margin-top: 24px;">
            <button class="btn-calculate" onclick="calculate()">计算周数</button>
        </div>

        <!-- 结果区域 -->
        <div id="result" class="result">
            <div>
                <span class="big-number" id="weeksNum">--</span>
                <span class="big-unit">周</span>
            </div>
            <div class="detail" id="detailText"></div>
        </div>

        <div class="footer-note">
            支持 1900年 – 2100年 的日期范围
        </div>
    </div>

    <script>
        function isValidDate(year, month, day) {
            if (isNaN(year) || isNaN(month) || isNaN(day)) return false;
            if (month < 1 || month > 12) return false;
            if (day < 1) return false;

            const daysInMonth = new Date(year, month, 0).getDate();
            return day <= daysInMonth;
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.add('show');
            document.getElementById('result').classList.remove('show');
        }

        function hideError() {
            document.getElementById('errorMsg').classList.remove('show');
        }

        function calculate() {
            hideError();

            const sy = parseInt(document.getElementById('startYear').value);
            const sm = parseInt(document.getElementById('startMonth').value);
            const sd = parseInt(document.getElementById('startDay').value);
            const ey = parseInt(document.getElementById('endYear').value);
            const em = parseInt(document.getElementById('endMonth').value);
            const ed = parseInt(document.getElementById('endDay').value);

            if (!isValidDate(sy, sm, sd)) {
                showError('开始日期无效，请检查年月日是否填写正确。');
                return;
            }
            if (!isValidDate(ey, em, ed)) {
                showError('结束日期无效，请检查年月日是否填写正确。');
                return;
            }

            const startDate = new Date(sy, sm - 1, sd);
            const endDate = new Date(ey, em - 1, ed);

            if (endDate < startDate) {
                showError('结束日期不能早于开始日期，请重新填写。');
                return;
            }

            const diffMs = endDate.getTime() - startDate.getTime();
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            const totalWeeks = Math.floor(diffDays / 7);
            const remainDays = diffDays % 7;

            // 格式化日期显示
            const fmt = (y, m, d) => `${y}年${m}月${d}日`;

            document.getElementById('weeksNum').textContent = totalWeeks;

            let detail = `${fmt(sy, sm, sd)} → ${fmt(ey, em, ed)}`;
            detail += `<br>共 <span>${diffDays}</span> 天`;
            if (totalWeeks > 0) {
                detail += `，即 <span>${totalWeeks}</span> 周`;
                if (remainDays > 0) {
                    detail += ` 零 <span>${remainDays}</span> 天`;
                }
            } else {
                if (remainDays > 0) {
                    detail += `，不足1周（<span>${remainDays}</span> 天）`;
                } else {
                    detail += `（同一天）`;
                }
            }
            detail += `</span>`;

            document.getElementById('detailText').innerHTML = detail;
            document.getElementById('result').classList.add('show');
        }

        // 页面加载时自动计算一次默认值
        window.addEventListener('DOMContentLoaded', function () {
            // 设置默认结束日期为今天
            const today = new Date();
            document.getElementById('endYear').value = today.getFullYear();
            document.getElementById('endMonth').value = today.getMonth() + 1;
            document.getElementById('endDay').value = today.getDate();
            calculate();
        });

        // 回车键触发计算
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                calculate();
            }
        });
    </script>
</body>
</html>
