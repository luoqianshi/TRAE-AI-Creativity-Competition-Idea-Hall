<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AI塔罗 · 心情日记</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,500;14..32,700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #0b0a0c;
            font-family: "Inter", sans-serif;
            padding: 12px;
            background-image: radial-gradient(circle at 20% 20%, #1a1525, #08070a 80%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 20px;
        }
        .app {
            max-width: 480px;
            width: 100%;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 40px;
            padding: 20px 16px 24px;
            border: 1px solid rgba(255,215,150,0.06);
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }
        .app::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 40% 30%, var(--glow, rgba(160,120,220,0.10)), transparent 60%);
            transition: background 1.2s ease;
            pointer-events: none;
            z-index: 0;
        }
        .app > * { position: relative; z-index: 2; }

        /* 头部 */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .brand { font-family: "Playfair Display", serif; font-size: 20px; font-weight: 600; background: linear-gradient(135deg, #f0e0d0, #c8b09a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px; }
        .date-badge { font-size: 11px; color: #7a6a5c; background: rgba(255,215,150,0.05); padding: 4px 14px; border-radius: 40px; border: 1px solid rgba(255,215,150,0.05); }

        /* Tab 切换 */
        .tabs { display: flex; gap: 4px; margin: 8px 0 14px; background: rgba(0,0,0,0.2); border-radius: 30px; padding: 4px; }
        .tab { flex: 1; padding: 8px 0; text-align: center; border-radius: 26px; font-size: 12px; color: #6a5f54; cursor: pointer; transition: 0.3s; border: none; background: transparent; letter-spacing: 0.5px; }
        .tab.active { background: rgba(210,180,140,0.08); color: #ecd5c0; box-shadow: 0 2px 12px rgba(0,0,0,0.2); }
        .tab:hover { color: #b09880; }

        .panel { display: none; animation: fadeUp 0.4s ease; }
        .panel.active { display: block; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        /* ===== 面板1: 今日占卜 ===== */
        .mood-section { margin: 4px 0 12px; }
        .mood-label { font-size: 11px; color: #5a4f44; letter-spacing: 1px; margin-bottom: 8px; }
        .mood-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .mood-btn {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,215,150,0.04);
            border-radius: 40px;
            padding: 8px 0;
            text-align: center;
            cursor: pointer;
            transition: 0.25s;
            font-size: 20px;
        }
        .mood-btn:hover { background: rgba(255,215,150,0.04); border-color: rgba(255,215,150,0.08); }
        .mood-btn.active { background: rgba(210,180,140,0.08); border-color: rgba(210,180,140,0.15); box-shadow: 0 0 20px rgba(210,180,140,0.05); }
        .mood-btn .mood-label-sm { display: block; font-size: 9px; color: #6a5f54; margin-top: 2px; }

        .canvas-section { margin: 10px 0 12px; }
        .canvas-label { display: flex; justify-content: space-between; font-size: 10px; color: #5a4f44; margin-bottom: 4px; }
        .canvas-wrapper { background: rgba(0,0,0,0.4); border-radius: 20px; border: 1px solid rgba(255,215,150,0.04); overflow: hidden; touch-action: none; }
        #drawCanvas { display: block; width: 100%; height: 150px; cursor: crosshair; touch-action: none; background: radial-gradient(ellipse at center, #14101c, #0b0a0c); }

        .action-row { display: flex; gap: 6px; margin: 10px 0; flex-wrap: wrap; }
        .action-row .btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,215,150,0.04);
            color: #b09880;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.25s;
            letter-spacing: 0.5px;
            flex: 1;
            min-width: 60px;
            text-align: center;
        }
        .action-row .btn:hover { background: rgba(255,215,150,0.05); border-color: rgba(255,215,150,0.1); }
        .action-row .btn:active { transform: scale(0.94); }
        .action-row .btn.primary { background: rgba(210,180,140,0.06); border-color: rgba(210,180,140,0.08); color: #ecd5c0; }
        .action-row .btn.primary:hover { background: rgba(210,180,140,0.10); }

        /* 今日结果 */
        .today-result { margin: 12px 0 4px; padding: 16px; background: rgba(255,255,255,0.02); border-radius: 24px; border: 1px solid rgba(255,215,150,0.04); display: none; }
        .today-result.show { display: block; }
        .today-result .result-title { font-family: "Playfair Display", serif; font-size: 20px; color: #ecd5c0; text-align: center; letter-spacing: 1px; }
        .today-result .result-sub { text-align: center; font-size: 11px; color: #6a5f54; letter-spacing: 2px; margin: 2px 0 8px; }
        .today-result .result-reading { font-size: 13px; line-height: 1.7; color: #c8b8a8; text-align: center; padding: 0 4px; font-weight: 300; }
        .today-result .divider { width: 40px; height: 1px; background: linear-gradient(90deg, transparent, rgba(210,180,140,0.15), transparent); margin: 12px auto; }
        .today-result .quote { font-size: 14px; color: #d4b08a; text-align: center; font-style: italic; padding: 8px 12px; background: rgba(210,180,140,0.03); border-radius: 16px; border-left: 2px solid rgba(210,180,140,0.08); }
        .today-result .quote .author { font-size: 10px; color: #6a5f54; font-style: normal; display: block; margin-top: 4px; letter-spacing: 1px; }

        /* ===== 面板2: 月度日历 ===== */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .calendar-header .month { font-size: 16px; color: #ecd5c0; font-family: "Playfair Display", serif; letter-spacing: 2px; }
        .calendar-header .nav-btn { background: none; border: 1px solid rgba(255,215,150,0.04); color: #6a5f54; padding: 4px 14px; border-radius: 30px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .calendar-header .nav-btn:hover { border-color: rgba(255,215,150,0.1); color: #b09880; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .calendar-grid .day-name { font-size: 9px; color: #4a3f36; text-align: center; padding: 4px 0; letter-spacing: 1px; text-transform: uppercase; }
        .calendar-grid .day-cell {
            aspect-ratio: 1/1;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #4a3f36;
            background: rgba(255,255,255,0.01);
            border: 1px solid rgba(255,255,255,0.02);
            transition: 0.2s;
            cursor: default;
            position: relative;
            min-height: 36px;
        }
        .calendar-grid .day-cell.today { border-color: rgba(210,180,140,0.15); }
        .calendar-grid .day-cell.has-entry { background: rgba(210,180,140,0.04); border-color: rgba(210,180,140,0.06); }
        .calendar-grid .day-cell .day-symbol { font-size: 16px; line-height: 1; }
        .calendar-grid .day-cell .day-number { font-size: 10px; color: #5a4f44; position: absolute; top: 2px; right: 4px; }
        .calendar-grid .day-cell .day-mood { font-size: 14px; }
        .calendar-grid .day-cell.empty { opacity: 0.2; }

        /* ===== 面板3: 统计 ===== */
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 8px 0; }
        .stats-card { background: rgba(255,255,255,0.02); border-radius: 20px; padding: 14px; text-align: center; border: 1px solid rgba(255,215,150,0.03); }
        .stats-card .num { font-size: 28px; font-weight: 600; color: #ecd5c0; font-family: "Playfair Display", serif; }
        .stats-card .label { font-size: 10px; color: #5a4f44; letter-spacing: 1px; margin-top: 2px; }
        .mood-distribution { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
        .mood-distribution .mood-bar { text-align: center; }
        .mood-distribution .mood-bar .bar { height: 4px; border-radius: 4px; background: rgba(255,255,255,0.04); margin-top: 4px; overflow: hidden; }
        .mood-distribution .mood-bar .bar .fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; background: linear-gradient(90deg, #d4b08a, #c8b09a); width: 0%; }
        .mood-distribution .mood-bar .emoji { font-size: 18px; }
        .mood-distribution .mood-bar .count { font-size: 10px; color: #5a4f44; }

        /* 底部状态 */
        .footer-bar { margin-top: 14px; padding: 6px 12px; background: rgba(0,0,0,0.15); border-radius: 40px; border: 1px solid rgba(255,255,255,0.02); display: flex; justify-content: space-between; align-items: center; }
        .footer-bar .streak { font-size: 10px; color: #5a4f44; letter-spacing: 1px; }
        .footer-bar .streak strong { color: #d4b08a; }
        .footer-bar .status { display: flex; align-items: center; gap: 6px; font-size: 10px; color: #5a4f44; }

        /* 响应式 */
        @media (max-width: 420px) {
            .app { padding: 14px 10px 18px; }
            #drawCanvas { height: 120px; }
            .mood-btn { font-size: 16px; padding: 6px 0; }
            .calendar-grid .day-cell { min-height: 28px; }
            .calendar-grid .day-cell .day-symbol { font-size: 13px; }
            .stats-card .num { font-size: 22px; }
        }
    </style>
</head>
<body>

<div class="app" id="app">
    <!-- 头部 -->
    <div class="header">
        <span class="brand">✦ 镜像日记</span>
        <span class="date-badge" id="todayDate"></span>
    </div>

    <!-- Tab -->
    <div class="tabs">
        <button class="tab active" data-tab="tab1" onclick="switchTab('tab1')">✦ 今日</button>
        <button class="tab" data-tab="tab2" onclick="switchTab('tab2')">📅 日历</button>
        <button class="tab" data-tab="tab3" onclick="switchTab('tab3')">📊 统计</button>
    </div>

    <!-- ===== TAB 1: 今日占卜 ===== -->
    <div class="panel active" id="tab1">
        <!-- 心情选择 -->
        <div class="mood-section">
            <div class="mood-label">◈ 今天的心情是？</div>
            <div class="mood-grid">
                <div class="mood-btn" data-mood="happy" onclick="selectMood('happy')">
                    😊 <span class="mood-label-sm">开心</span>
                </div>
                <div class="mood-btn" data-mood="calm" onclick="selectMood('calm')">
                    😐 <span class="mood-label-sm">平静</span>
                </div>
                <div class="mood-btn" data-mood="sad" onclick="selectMood('sad')">
                    😔 <span class="mood-label-sm">低落</span>
                </div>
                <div class="mood-btn" data-mood="excited" onclick="selectMood('excited')">
                    🔥 <span class="mood-label-sm">激动</span>
                </div>
                <div class="mood-btn" data-mood="tired" onclick="selectMood('tired')">
                    😴 <span class="mood-label-sm">疲惫</span>
                </div>
            </div>
        </div>

        <!-- 画布 -->
        <div class="canvas-section">
            <div class="canvas-label">
                <span>✧ 绘制你的能量符号</span>
                <span id="strokeCount">笔触: 0</span>
            </div>
            <div class="canvas-wrapper">
                <canvas id="drawCanvas" width="800" height="300"></canvas>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="action-row">
            <button class="btn" onclick="clearCanvas()">✕ 清除</button>
            <button class="btn primary" onclick="drawToday()">✦ 今日占卜</button>
            <button class="btn" onclick="randomDraw()">🎲 随机一笔</button>
        </div>

        <!-- 今日结果 -->
        <div class="today-result" id="todayResult">
            <div class="result-title" id="resultTitle">静夜</div>
            <div class="result-sub" id="resultSub">正位 · 内省</div>
            <div class="result-reading" id="resultReading">你正站在一片宁静的湖边，月光将你的影子拉长。</div>
            <div class="divider"></div>
            <div class="quote" id="resultQuote">
                “夜晚是思考的沃土”
                <span class="author">—— 荣格</span>
            </div>
        </div>
    </div>

    <!-- ===== TAB 2: 日历 ===== -->
    <div class="panel" id="tab2">
        <div class="calendar-header">
            <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
            <span class="month" id="calendarMonth">2026年6月</span>
            <button class="nav-btn" onclick="changeMonth(1)">›</button>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
        <div style="margin-top:12px;font-size:10px;color:#4a3f36;text-align:center;letter-spacing:1px;">
            <span>● 有记录</span> &nbsp;&nbsp; <span style="color:#6a5f54;">○ 无记录</span>
        </div>
    </div>

    <!-- ===== TAB 3: 统计 ===== -->
    <div class="panel" id="tab3">
        <div class="stats-grid">
            <div class="stats-card">
                <div class="num" id="statDays">0</div>
                <div class="label">本月打卡天数</div>
            </div>
            <div class="stats-card">
                <div class="num" id="statStreak">0</div>
                <div class="label">当前连续天数</div>
            </div>
        </div>
        <div style="margin-top:8px;font-size:11px;color:#5a4f44;letter-spacing:1px;text-align:center;">本月心情分布</div>
        <div class="mood-distribution" id="moodDistribution"></div>
    </div>

    <!-- 底部 -->
    <div class="footer-bar">
        <span class="streak">🔥 连续 <strong id="footerStreak">0</strong> 天</span>
        <span class="status">✦ <span id="footerStatus">今日未打卡</span></span>
    </div>
</div>

<script>
    // ============================================================
    //  数据层
    // ============================================================
    const MOOD_EMOJI = { happy:'😊', calm:'😐', sad:'😔', excited:'🔥', tired:'😴' };
    const MOOD_NAMES = { happy:'开心', calm:'平静', sad:'低落', excited:'激动', tired:'疲惫' };

    // 名言库 (按心情)
    const QUOTES = {
        happy: [
            ['快乐是生命的意义所在', '亚里士多德'],
            ['微笑是灵魂的语言', '特蕾莎修女'],
            ['幸福不是拥有的多，而是计较的少', '林肯'],
            ['阳光照亮每一个角落', '梵高'],
            ['今天，我选择喜悦', '佚名']
        ],
        calm: [
            ['平静是内心的力量', '老子'],
            ['在宁静中，一切皆有可能', '艾克哈特·托勒'],
            ['静水流深，人稳致远', '古谚'],
            ['心若不动，风又奈何', '慧能'],
            ['平和是最高贵的品格', '塞涅卡']
        ],
        sad: [
            ['黑夜是黎明的前奏', '马丁·路德·金'],
            ['悲伤教会我们珍惜快乐', 'C.S.路易斯'],
            ['伤口是阳光照进来的地方', '鲁米'],
            ['每一次低谷都是向上的准备', '尼采'],
            ['允许自己悲伤，也是爱自己', '佚名']
        ],
        excited: [
            ['激情是创造的火种', '贝多芬'],
            ['勇敢追逐心中的火焰', '歌德'],
            ['生命在于燃烧', '巴勃罗·聂鲁达'],
            ['热情是成功的引擎', '爱默生'],
            ['今天，我要点燃世界', '佚名']
        ],
        tired: [
            ['休息是为了走更远的路', '非洲谚语'],
            ['温柔地对待自己的疲惫', '一行禅师'],
            ['睡眠是大自然赐予的礼物', '莎士比亚'],
            ['充电是为了更好的出发', '佚名'],
            ['倾听身体的声音', '希波克拉底']
        ]
    };

    // 牌库
    const CARD_DB = [
        { sym:'🌙', title:'静夜', subs:['逆位 · 沉淀','正位 · 安宁'] },
        { sym:'☀️', title:'日光', subs:['正位 · 明朗','逆位 · 遮蔽'] },
        { sym:'⭐', title:'星辰', subs:['正位 · 指引','逆位 · 迷茫'] },
        { sym:'🌿', title:'林语', subs:['正位 · 生长','逆位 · 停滞'] },
        { sym:'🔥', title:'烈焰', subs:['正位 · 突破','逆位 · 压抑'] },
        { sym:'💧', title:'深泉', subs:['正位 · 流动','逆位 · 阻塞'] },
        { sym:'🌀', title:'旋涡', subs:['无位 · 混沌','正位 · 整合'] },
        { sym:'🌸', title:'绽放', subs:['正位 · 喜悦','逆位 · 凋零'] },
        { sym:'🌊', title:'潮汐', subs:['正位 · 冲刷','逆位 · 滞留'] },
        { sym:'⚡', title:'雷霆', subs:['正位 · 觉醒','逆位 · 逃避'] },
        { sym:'🌹', title:'荆棘', subs:['逆位 · 缠缚','正位 · 守护'] },
        { sym:'🍃', title:'新生', subs:['正位 · 萌芽','逆位 · 迟滞'] }
    ];

    // ============================================================
    //  存储层 (localStorage)
    // ============================================================
    function getStore() {
        try {
            const raw = localStorage.getItem('tarot_diary');
            if (raw) return JSON.parse(raw);
        } catch(e) {}
        return { entries: {} }; // key: "2026-06-18", value: { mood, cardIdx, subIdx, symbol, title, sub, reading, quote, author }
    }

    function saveStore(store) {
        localStorage.setItem('tarot_diary', JSON.stringify(store));
    }

    function getTodayKey() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function getMonthKey(year, month) {
        return `${year}-${String(month+1).padStart(2,'0')}`;
    }

    // ============================================================
    //  状态
    // ============================================================
    let selectedMood = null;
    let strokeCount = 0;
    let hasDrawn = false;
    let todayEntry = null; // 今日是否已打卡
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();

    // ============================================================
    //  Canvas
    // ============================================================
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false, lastX=0, lastY=0;

    function initCanvas() {
        canvas.width = 800;
        canvas.height = 300;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
    }
    initCanvas();

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        if (clientX == null) return { x:0, y:0 };
        return {
            x: (clientX - rect.left) * (800 / rect.width),
            y: (clientY - rect.top) * (300 / rect.height)
        };
    }

    function startDraw(e) {
        e.preventDefault();
        isDrawing = true;
        const pos = getPos(e);
        lastX = pos.x; lastY = pos.y;
        ctx.beginPath();
        ctx.arc(lastX, lastY, 3, 0, Math.PI*2);
        ctx.fillStyle = '#d4b08a';
        ctx.fill();
        strokeCount++;
        updateStroke();
        hasDrawn = true;
        hideResult();
    }

    function moveDraw(e) {
        e.preventDefault();
        if (!isDrawing) return;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(pos.x, pos.y);
        ctx.strokeStyle = '#d4b08a';
        ctx.lineWidth = 4;
        ctx.shadowColor = 'rgba(210,180,140,0.12)';
        ctx.shadowBlur = 10;
        ctx.stroke();
        ctx.shadowBlur = 0;
        lastX = pos.x; lastY = pos.y;
        strokeCount++;
        updateStroke();
        hasDrawn = true;
        hideResult();
    }

    function endDraw() { isDrawing = false; }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', moveDraw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('mouseleave', endDraw);
    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', moveDraw, { passive: false });
    canvas.addEventListener('touchend', endDraw, { passive: false });

    function updateStroke() {
        document.getElementById('strokeCount').innerText = `笔触: ${strokeCount}`;
    }

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        strokeCount = 0;
        hasDrawn = false;
        updateStroke();
        hideResult();
    }

    function randomDraw() {
        for (let i=0; i<40; i++) {
            const x = Math.random() * canvas.width;
            const y = Math.random() * canvas.height;
            ctx.beginPath();
            ctx.arc(x, y, 2 + Math.random()*4, 0, Math.PI*2);
            ctx.fillStyle = '#d4b08a';
            ctx.fill();
            if (Math.random() > 0.5) {
                const x2 = Math.random() * canvas.width;
                const y2 = Math.random() * canvas.height;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = '#d4b08a';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            strokeCount++;
        }
        hasDrawn = true;
        updateStroke();
        hideResult();
    }

    function hideResult() {
        document.getElementById('todayResult').classList.remove('show');
    }

    // ============================================================
    //  心情选择
    // ============================================================
    function selectMood(mood) {
        selectedMood = mood;
        document.querySelectorAll('.mood-btn').forEach(el => {
            el.classList.toggle('active', el.dataset.mood === mood);
        });
        hideResult();
        // 检查今日是否已打卡
        checkTodayEntry();
    }

    function checkTodayEntry() {
        const store = getStore();
        const key = getTodayKey();
        if (store.entries[key]) {
            todayEntry = store.entries[key];
            document.getElementById('footerStatus').innerText = '✅ 今日已打卡';
            // 显示结果
            showResult(todayEntry);
        } else {
            todayEntry = null;
            document.getElementById('footerStatus').innerText = '今日未打卡';
        }
        updateFooter();
    }

    // ============================================================
    //  占卜核心
    // ============================================================
    function drawToday() {
        if (!selectedMood) {
            alert('请先选择今天的心情 ✦');
            return;
        }
        if (strokeCount < 2) {
            alert('再多画几笔吧，让AI感受你的能量 ✦');
            return;
        }

        const store = getStore();
        const key = getTodayKey();
        if (store.entries[key]) {
            alert('今天已经打卡过了！去「日历」查看吧 ✦');
            showResult(store.entries[key]);
            return;
        }

        // 生成卡牌 (基于笔触和心情)
        const seed = (strokeCount * 13 + Object.keys(MOOD_EMOJI).indexOf(selectedMood) * 7) % CARD_DB.length;
        const card = CARD_DB[seed];
        const subIdx = strokeCount % 2;
        const sub = card.subs[subIdx];

        // 名言
        const quotePool = QUOTES[selectedMood] || QUOTES.calm;
        const qIdx = (strokeCount + seed) % quotePool.length;
        const [quoteText, quoteAuthor] = quotePool[qIdx];

        // 阅读文本
        const readings = [
            '过去的经历正在沉淀为智慧，此刻的你拥有清晰的目光。',
            '你与内心的连接正在加深，倾听身体的声音。',
            '顺其自然，让事情如其所示地发展。',
            '混乱中藏着新的秩序，耐心等待。',
            '快乐不需要理由，今天允许自己轻松。',
            '突破就在眼前，再勇敢一点点。',
            '新的开始往往藏在不起眼的地方。',
            '你是自己命运的书写者。'
        ];
        const reading = readings[(strokeCount + seed) % readings.length];

        const entry = {
            mood: selectedMood,
            cardIdx: seed,
            subIdx: subIdx,
            symbol: card.sym,
            title: card.title,
            sub: sub,
            reading: reading,
            quote: quoteText,
            author: quoteAuthor,
            date: key
        };

        // 保存
        store.entries[key] = entry;
        saveStore(store);
        todayEntry = entry;

        // 显示结果
        showResult(entry);
        document.getElementById('footerStatus').innerText = '✅ 今日已打卡';
        updateFooter();
        updateCalendar();
        updateStats();

        // 光晕反馈
        document.getElementById('app').style.setProperty('--glow', 'rgba(210,180,140,0.15)');
    }

    function showResult(entry) {
        const el = document.getElementById('todayResult');
        document.getElementById('resultTitle').innerText = entry.symbol + ' ' + entry.title;
        document.getElementById('resultSub').innerText = entry.sub;
        document.getElementById('resultReading').innerText = entry.reading;
        document.getElementById('resultQuote').innerHTML = `“${entry.quote}” <span class="author">—— ${entry.author}</span>`;
        el.classList.add('show');
    }

    // ============================================================
    //  日历
    // ============================================================
    function renderCalendar(year, month) {
        const grid = document.getElementById('calendarGrid');
        const store = getStore();
        const monthKey = getMonthKey(year, month);
        const daysInMonth = new Date(year, month+1, 0).getDate();
        const firstDay = new Date(year, month, 1).getDay();

        document.getElementById('calendarMonth').innerText = `${year}年${month+1}月`;

        let html = '';
        const dayNames = ['日','一','二','三','四','五','六'];
        dayNames.forEach(d => {
            html += `<div class="day-name">${d}</div>`;
        });

        for (let i=0; i<firstDay; i++) {
            html += `<div class="day-cell empty"></div>`;
        }

        const todayKey = getTodayKey();
        for (let d=1; d<=daysInMonth; d++) {
            const key = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const entry = store.entries[key];
            const isToday = key === todayKey;

            let cls = 'day-cell';
            if (isToday) cls += ' today';
            if (entry) cls += ' has-entry';

            let content = `<span class="day-number">${d}</span>`;
            if (entry) {
                content += `<span class="day-mood">${MOOD_EMOJI[entry.mood] || '✦'}</span>`;
                content += `<span class="day-symbol">${entry.symbol || ''}</span>`;
            } else {
                content += `<span style="font-size:10px;color:#2a2520;">·</span>`;
            }

            html += `<div class="${cls}">${content}</div>`;
        }

        grid.innerHTML = html;
        updateFooter();
    }

    function changeMonth(delta) {
        currentMonth += delta;
        if (currentMonth < 0) { currentMonth = 11; currentYear--; }
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        renderCalendar(currentYear, currentMonth);
    }

    function updateCalendar() {
        renderCalendar(currentYear, currentMonth);
    }

    // ============================================================
    //  统计
    // ============================================================
    function updateStats() {
        const store = getStore();
        const monthKey = getMonthKey(currentYear, currentMonth);
        const entries = Object.keys(store.entries)
            .filter(k => k.startsWith(monthKey))
            .map(k => store.entries[k]);

        document.getElementById('statDays').innerText = entries.length;

        // 连续天数
        let streak = 0;
        const today = new Date();
        const todayStr = getTodayKey();
        for (let i=0; i<365; i++) {
            const d = new Date(today);
            d.setDate(d.getDate() - i);
            const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            if (store.entries[key]) {
                streak++;
            } else if (i > 0) {
                break;
            } else {
                // 今天没打卡，连续为0
                if (i === 0) streak = 0;
            }
        }
        document.getElementById('statStreak').innerText = streak;
        document.getElementById('footerStreak').innerText = streak;

        // 心情分布
        const dist = { happy:0, calm:0, sad:0, excited:0, tired:0 };
        entries.forEach(e => { if (dist[e.mood] !== undefined) dist[e.mood]++; });
        const total = entries.length || 1;
        const container = document.getElementById('moodDistribution');
        let html = '';
        Object.keys(dist).forEach(key => {
            const pct = Math.round(dist[key] / total * 100);
            html += `
                <div class="mood-bar">
                    <div class="emoji">${MOOD_EMOJI[key]}</div>
                    <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
                    <div class="count">${dist[key]}</div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    // ============================================================
    //  Tab 切换
    // ============================================================
    function switchTab(tabId) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        document.querySelector(`.tab[data-tab="${tabId}"]`).classList.add('active');
        if (tabId === 'tab2') updateCalendar();
        if (tabId === 'tab3') updateStats();
    }

    // ============================================================
    //  底部
    // ============================================================
    function updateFooter() {
        const store = getStore();
        let streak = 0;
        const today = new Date();
        for (let i=0; i<365; i++) {
            const d = new Date(today);
            d.setDate(d.getDate() - i);
            const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            if (store.entries[key]) {
                streak++;
            } else if (i > 0) {
                break;
            } else {
                streak = 0;
            }
        }
        document.getElementById('footerStreak').innerText = streak;
        const key = getTodayKey();
        if (store.entries[key]) {
            document.getElementById('footerStatus').innerText = '✅ 今日已打卡';
        } else {
            document.getElementById('footerStatus').innerText = '今日未打卡';
        }
    }

    // ============================================================
    //  初始化
    // ============================================================
    function init() {
        document.getElementById('todayDate').innerText = getTodayKey();
        checkTodayEntry();
        renderCalendar(currentYear, currentMonth);
        updateStats();
        updateFooter();

        // 如果今天已有记录，显示它
        const store = getStore();
        const key = getTodayKey();
        if (store.entries[key]) {
            showResult(store.entries[key]);
            // 自动选中对应心情
            const mood = store.entries[key].mood;
            if (mood) {
                selectedMood = mood;
                document.querySelectorAll('.mood-btn').forEach(el => {
                    el.classList.toggle('active', el.dataset.mood === mood);
                });
            }
        }
    }

    init();
</script>
