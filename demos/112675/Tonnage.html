<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tonnage - 健身仪表盘</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
            --green: #10b981;
            --yellow: #f59e0b;
            --red: #ef4444;
            --blue: #3b82f6;
            --purple: #8b5cf6;
            --gold: #fbbf24;
            --radius: 16px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, var(--green), var(--blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; transition: all 0.2s; display: flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--green); color: var(--bg); }
        .btn-primary:hover { background: #059669; transform: translateY(-1px); }
        .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { background: #334155; }
        .btn-danger { background: var(--red); color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-small { padding: 5px 10px; font-size: 0.875rem; }
        .banner { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; animation: fadeIn 0.5s; }
        .banner-info { background: rgba(59, 130, 246, 0.15); border-left: 4px solid var(--blue); }
        .banner-warning { background: rgba(245, 158, 11, 0.15); border-left: 4px solid var(--yellow); }
        .banner-danger { background: rgba(239, 68, 68, 0.15); border-left: 4px solid var(--red); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .card { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .card-header { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
        .card-value { font-size: 2rem; font-weight: 700; color: var(--text); }
        .card-subvalue { font-size: 0.875rem; color: var(--green); margin-top: 4px; }
        .card-subvalue.negative { color: var(--red); }
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
        .section-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.875rem; color: var(--text-muted); margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.875rem; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--green); }
        .form-group textarea { resize: vertical; min-height: 60px; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .checkbox-group input[type="checkbox"] { width: auto; accent-color: var(--green); }
        .exercise-row { display: grid; grid-template-columns: 1fr 80px 80px 60px 80px 40px; gap: 8px; margin-bottom: 8px; align-items: center; }
        @media (max-width: 600px) { .exercise-row { grid-template-columns: 1fr; } }
        .exercise-row input, .exercise-row select { padding: 8px; font-size: 0.875rem; }
        .btn-remove { background: none; border: none; color: var(--red); cursor: pointer; padding: 8px; font-size: 1rem; }
        .logs-list { background: var(--bg); border-radius: 8px; padding: 12px; margin-bottom: 16px; max-height: 200px; overflow-y: auto; }
        .log-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid var(--border); font-size: 0.875rem; }
        .log-item:last-child { border-bottom: none; }
        .log-volume { color: var(--green); font-weight: 500; }
        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-bottom: 20px; }
        @media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }
        .chart-container { background: var(--card); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border); }
        .chart-title { font-size: 1rem; font-weight: 600; margin-bottom: 16px; }
        .chart-wrapper { position: relative; height: 250px; }
        .mini-chart-wrapper { position: relative; height: 100px; margin-top: 16px; }
        .logs-container { background: var(--card); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border); }
        .logs-filters { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; align-items: center; }
        .logs-filters input, .logs-filters select { padding: 8px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.875rem; }
        .session-group { border-bottom: 1px solid var(--border); margin-bottom: 12px; }
        .session-group:last-child { border-bottom: none; }
        .session-header { display: flex; justify-content: space-between; align-items: center; padding: 12px; cursor: pointer; background: var(--bg); border-radius: 8px; }
        .session-header:hover { background: #1e293b; }
        .session-header-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .session-date { font-weight: 600; }
        .session-bodyweight { font-size: 0.875rem; color: var(--text-muted); }
        .session-note { font-size: 0.875rem; color: var(--text-muted); font-style: italic; }
        .session-total-volume { font-weight: 600; color: var(--green); }
        .session-actions { display: flex; gap: 8px; }
        .session-content { padding: 12px; padding-left: 32px; animation: slideDown 0.3s; }
        @keyframes slideDown { from { opacity: 0; max-height: 0; } to { opacity: 1; max-height: 500px; } }
        .session-content.hidden { display: none; }
        .session-exercise { display: flex; justify-content: space-between; align-items: center; padding: 8px; background: rgba(30, 41, 59, 0.5); border-radius: 6px; margin-bottom: 4px; }
        .session-exercise-name { font-weight: 500; }
        .session-exercise-detail { font-size: 0.75rem; color: var(--text-muted); }
        .session-exercise-1rm { font-size: 0.75rem; color: var(--gold); }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 1000; animation: fadeIn 0.2s; }
        .modal { background: var(--card); border-radius: var(--radius); padding: 24px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border); animation: slideUp 0.3s; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
        .modal-title { font-size: 1.25rem; font-weight: 600; }
        .modal-close { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; line-height: 1; }
        .modal-close:hover { color: var(--text); }
        .modal-footer { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--border); }
        .badge-deload { background: rgba(59, 130, 246, 0.1); color: var(--blue); padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; margin-left: 8px; }
        .badge-platform { background: rgba(239, 68, 68, 0.1); color: var(--red); padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; }
        .period-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 500; margin-left: 8px; }
        .period-accumulation { background: rgba(16, 185, 129, 0.2); color: var(--green); }
        .period-deload { background: rgba(59, 130, 246, 0.2); color: var(--blue); }
        .balance-indicator { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 20px; font-size: 0.875rem; font-weight: 500; }
        .balance-good { background: rgba(16, 185, 129, 0.2); color: var(--green); }
        .balance-warning { background: rgba(245, 158, 11, 0.2); color: var(--yellow); }
        .balance-danger { background: rgba(239, 68, 68, 0.2); color: var(--red); }
        .training-level-info, .cycle-info { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
        .settings-danger-zone { padding: 16px; background: rgba(239, 68, 68, 0.05); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 8px; margin-bottom: 16px; text-align: center; }
        .danger-zone-hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 8px; }
        .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Tonnage</h1>
            <button class="btn btn-secondary" id="btn-settings">⚙️ 设置</button>
        </header>
        <div id="banner-container"></div>
        <div class="cards-grid" id="cards-container"></div>
        <div class="main-grid">
            <div class="card">
                <h2 class="section-title">📝 录入训练记录</h2>
                <form id="session-form">
                    <div class="form-group">
                        <label for="session-date">日期</label>
                        <input type="date" id="session-date" required>
                    </div>
                    <div class="form-group">
                        <label for="session-bodyweight">体重 (kg) <span style="color: var(--text-muted); font-size: 0.75rem;">(留空使用最近记录)</span></label>
                        <input type="number" id="session-bodyweight" step="0.1" placeholder="留空自动填充">
                    </div>
                    <div class="form-group">
                        <label for="session-note">备注</label>
                        <textarea id="session-note" placeholder="记录训练感受、状态等"></textarea>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="session-is-deload">
                        <label for="session-is-deload">📉 减载/异常日</label>
                    </div>
                    <hr style="margin: 16px 0; border-color: var(--border);">
                    <h3 style="font-size: 1rem; margin-bottom: 12px;">动作列表</h3>
                    <div id="exercise-forms"></div>
                    <button type="button" class="btn btn-secondary btn-small" id="btn-add-exercise" style="margin-bottom: 16px;">+ 添加动作</button>
                    <div class="logs-list" id="session-logs-preview"></div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">保存记录</button>
                </form>
            </div>
            <div class="card">
                <h2 class="section-title">📈 容量趋势</h2>
                <div class="chart-container" style="padding: 0; border-radius: var(--radius); overflow: hidden;">
                    <div class="chart-wrapper" id="volume-chart-wrapper"></div>
                    <div class="mini-chart-wrapper" id="bodyweight-chart-wrapper"></div>
                </div>
            </div>
        </div>
        <div class="charts-grid" id="charts-container"></div>
        <div class="logs-container">
            <h2 class="section-title">📋 训练日志</h2>
            <div class="logs-filters">
                <input type="text" id="filter-search" placeholder="搜索备注...">
                <select id="filter-exercise">
                    <option value="">所有动作</option>
                </select>
                <select id="filter-type">
                    <option value="">所有类型</option>
                    <option value="push">推</option>
                    <option value="pull">拉</option>
                    <option value="legs">腿</option>
                </select>
            </div>
            <div id="logs-list"></div>
        </div>
    </div>

    <div class="modal-overlay hidden" id="settings-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">⚙️ 设置</h2>
                <button class="modal-close" id="btn-close-settings">&times;</button>
            </div>
            <form id="settings-form">
                <div class="form-group">
                    <label for="setting-default-bodyweight">默认体重 (kg)</label>
                    <input type="number" id="setting-default-bodyweight" step="0.1" required>
                </div>
                <div class="form-group">
                    <label for="setting-cycle-length">周期长度 (周)</label>
                    <input type="number" id="setting-cycle-length" min="3" max="6" required>
                    <div class="cycle-info">建议3-6周，每周期最后一周为减载周</div>
                </div>
                <div class="form-group">
                    <label for="setting-start-date">开始日期</label>
                    <input type="date" id="setting-start-date" required>
                </div>
                <div class="form-group">
                    <label for="setting-training-level">训练水平</label>
                    <select id="setting-training-level" required>
                        <option value="novice">新手 (保护期6月，阈值2%)</option>
                        <option value="intermediate">中级 (保护期3月，阈值3%)</option>
                        <option value="advanced">高级 (保护期0，阈值5%)</option>
                    </select>
                    <div class="training-level-info" id="training-level-info"></div>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="setting-balance-enabled">
                    <label for="setting-balance-enabled">显示前后链平衡指标</label>
                </div>
                <div class="settings-danger-zone">
                    <button type="button" class="btn btn-danger btn-small" id="btn-clear-data">🗑️ 清空所有数据</button>
                    <div class="danger-zone-hint">此操作将删除所有训练记录，不可撤销</div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="btn-cancel-settings">取消</button>
                    <button type="submit" class="btn btn-primary">保存设置</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay hidden" id="edit-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">✏️ 编辑记录</h2>
                <button class="modal-close" id="btn-close-edit">&times;</button>
            </div>
            <form id="edit-form">
                <input type="hidden" id="edit-session-id">
                <div class="form-group">
                    <label for="edit-date">日期</label>
                    <input type="date" id="edit-date" required>
                </div>
                <div class="form-group">
                    <label for="edit-bodyweight">体重 (kg)</label>
                    <input type="number" id="edit-bodyweight" step="0.1">
                </div>
                <div class="form-group">
                    <label for="edit-note">备注</label>
                    <textarea id="edit-note"></textarea>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="edit-is-deload">
                    <label for="edit-is-deload">📉 减载/异常日</label>
                </div>
                <hr style="margin: 16px 0; border-color: var(--border);">
                <h3 style="font-size: 1rem; margin-bottom: 12px;">动作列表</h3>
                <div id="edit-exercise-forms"></div>
                <button type="button" class="btn btn-secondary btn-small" id="btn-add-edit-exercise" style="margin-bottom: 16px;">+ 添加动作</button>
                <div class="logs-list" id="edit-logs-preview"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" id="btn-delete-session">删除记录</button>
                    <button type="button" class="btn btn-secondary" id="btn-cancel-edit">取消</button>
                    <button type="submit" class="btn btn-primary">保存修改</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const ExerciseMeta = {
            push: ['bench_press', 'incline_bench', 'overhead_press', 'dips'],
            pull: ['barbell_row', 'pull_up', 'assisted_pull_up', 'weighted_pull_up', 'deadlift', 'face_pull'],
            legs: ['squat', 'leg_press', 'romanian_dl'],
            names: {
                bench_press: '卧推', incline_bench: '上斜卧推', overhead_press: '推举', dips: '双杠臂屈伸',
                barbell_row: '杠铃划船', pull_up: '引体向上(自重)', assisted_pull_up: '引体向上(辅助)',
                weighted_pull_up: '引体向上(负重)', deadlift: '硬拉', face_pull: '面拉',
                squat: '深蹲', leg_press: '腿举', romanian_dl: '罗马尼亚硬拉'
            }
        };

        const VolumeCalc = {
            calculate: (mode, weight, reps, bodyWeight) => {
                let effectiveWeight = weight;
                switch(mode) {
                    case 'bodyweight': effectiveWeight = bodyWeight; break;
                    case 'assisted': effectiveWeight = Math.max(0, bodyWeight - weight); break;
                    case 'weighted_bw': effectiveWeight = bodyWeight + weight; break;
                }
                return Math.round(effectiveWeight * reps);
            },
            getMode: (exercise) => {
                if (exercise === 'pull_up') return 'bodyweight';
                if (exercise === 'assisted_pull_up') return 'assisted';
                if (exercise === 'weighted_pull_up') return 'weighted_bw';
                return 'weighted';
            }
        };

        const OneRMCalc = {
            calculate: (weight, reps) => Math.round(weight * (1 + reps / 30))
        };

        const WeeklyAgg = {
            getWeekKey: (date) => {
                const d = new Date(date);
                const day = d.getDay();
                const diff = d.getDate() - day + (day === 0 ? -6 : 1);
                const monday = new Date(d.setDate(diff));
                return `${monday.getFullYear()}-${String(monday.getMonth()+1).padStart(2,'0')}-${String(monday.getDate()).padStart(2,'0')}`;
            },
            aggregate: (sessions) => {
                const weekMap = {};
                sessions.forEach(session => {
                    if (session.isDeload) return;
                    const weekKey = WeeklyAgg.getWeekKey(session.date);
                    if (!weekMap[weekKey]) weekMap[weekKey] = { weekKey, total: 0, push: 0, pull: 0, legs: 0, trainingDays: new Set() };
                    weekMap[weekKey].trainingDays.add(new Date(session.date).toDateString());
                    session.logs.forEach(log => {
                        if (ExerciseMeta.push.includes(log.exercise)) weekMap[weekKey].push += log.volume;
                        else if (ExerciseMeta.pull.includes(log.exercise)) weekMap[weekKey].pull += log.volume;
                        else if (ExerciseMeta.legs.includes(log.exercise)) weekMap[weekKey].legs += log.volume;
                        weekMap[weekKey].total += log.volume;
                    });
                });
                return Object.values(weekMap).map(w => ({ ...w, trainingDays: w.trainingDays.size })).sort((a,b) => new Date(a.weekKey) - new Date(b.weekKey));
            }
        };

        const Periodization = {
            getPeriod: (date, startDate, cycleLength) => {
                const start = new Date(startDate);
                const current = new Date(date);
                const diffWeeks = Math.floor((current - start) / (1000 * 60 * 60 * 24 * 7));
                if (diffWeeks < 0) return null;
                const cycleIndex = Math.floor(diffWeeks / cycleLength);
                const weekInCycle = diffWeeks % cycleLength;
                return { cycle: cycleIndex + 1, weekInCycle: weekInCycle + 1, isDeload: weekInCycle === cycleLength - 1 };
            }
        };

        const PlateauDetect = {
            config: {
                novice: { protectionMonths: 6, threshold: 0.02, consecutivePeriods: 2 },
                intermediate: { protectionMonths: 3, threshold: 0.03, consecutivePeriods: 2 },
                advanced: { protectionMonths: 0, threshold: 0.05, consecutivePeriods: 3 }
            },
            detect: (sessions, settings) => {
                const config = PlateauDetect.config[settings.trainingLevel];
                const protectionEndDate = new Date();
                protectionEndDate.setMonth(protectionEndDate.getMonth() - config.protectionMonths);
                const exercisePeaks = {};
                sessions.forEach(session => {
                    if (new Date(session.date) < protectionEndDate) return;
                    const period = Periodization.getPeriod(session.date, settings.startDate, settings.cycleLength);
                    if (!period) return;
                    session.logs.forEach(log => {
                        if (!exercisePeaks[log.exercise]) exercisePeaks[log.exercise] = {};
                        if (!exercisePeaks[log.exercise][period.cycle] || log.volume > exercisePeaks[log.exercise][period.cycle]) {
                            exercisePeaks[log.exercise][period.cycle] = log.volume;
                        }
                    });
                });
                const plateaus = [];
                Object.entries(exercisePeaks).forEach(([exercise, peaks]) => {
                    const cycles = Object.keys(peaks).map(Number).sort((a,b) => a-b);
                    if (cycles.length < config.consecutivePeriods) return;
                    let consecutiveCount = 0;
                    for (let i = 1; i < cycles.length; i++) {
                        const growth = (peaks[cycles[i]] - peaks[cycles[i-1]]) / peaks[cycles[i-1]];
                        if (growth < config.threshold) {
                            if (++consecutiveCount >= config.consecutivePeriods) {
                                plateaus.push({ exercise, exerciseName: ExerciseMeta.names[exercise] || exercise, growth: growth * 100 });
                                break;
                            }
                        } else consecutiveCount = 0;
                    }
                });
                return plateaus;
            }
        };

        const BalanceCalc = {
            calculate: (sessions) => {
                let pushVolume = 0, pullVolume = 0;
                sessions.forEach(session => {
                    session.logs.forEach(log => {
                        if (VolumeCalc.getMode(log.exercise) !== 'weighted') return;
                        if (ExerciseMeta.push.includes(log.exercise)) pushVolume += log.volume;
                        else if (ExerciseMeta.pull.includes(log.exercise)) pullVolume += log.volume;
                    });
                });
                return pullVolume === 0 ? null : { pushVolume, pullVolume, ratio: pushVolume / pullVolume };
            },
            getStatus: (ratio) => {
                if (ratio >= 0.8 && ratio <= 1.2) return { status: 'good', text: '平衡', color: 'green' };
                if (ratio >= 0.6 && ratio <= 1.5) return { status: 'warning', text: '轻微失衡', color: 'yellow' };
                return { status: 'danger', text: '严重失衡', color: 'red' };
            }
        };

        const Store = {
            STORAGE_KEY_SETTINGS: 'tonnage_settings',
            STORAGE_KEY_SESSIONS: 'tonnage_sessions',
            getSettings: () => {
                const stored = localStorage.getItem(Store.STORAGE_KEY_SETTINGS);
                if (stored) return JSON.parse(stored);
                return { defaultBodyWeight: 70, cycleLength: 4, startDate: new Date(Date.now() - 14*7*24*60*60*1000).toISOString().split('T')[0], trainingLevel: 'intermediate', balanceEnabled: true };
            },
            saveSettings: (settings) => localStorage.setItem(Store.STORAGE_KEY_SETTINGS, JSON.stringify(settings)),
            getSessions: () => {
                const stored = localStorage.getItem(Store.STORAGE_KEY_SESSIONS);
                return stored ? JSON.parse(stored) : [];
            },
            saveSessions: (sessions) => localStorage.setItem(Store.STORAGE_KEY_SESSIONS, JSON.stringify(sessions)),
            clearAll: () => { localStorage.removeItem(Store.STORAGE_KEY_SETTINGS); localStorage.removeItem(Store.STORAGE_KEY_SESSIONS); }
        };

        const DemoData = {
            generateSimple: () => {
                const now = new Date();
                const sessions = [];
                let bw = 70;
                const createSession = (dayOffset, exercises, isDeload = false, note = '') => {
                    const date = new Date(now);
                    date.setDate(date.getDate() - dayOffset);
                    const logs = exercises.map((ex, idx) => {
                        const mode = VolumeCalc.getMode(ex.name);
                        const volume = VolumeCalc.calculate(mode, ex.weight, ex.sets * ex.reps, bw);
                        const estimated1RM = OneRMCalc.calculate(mode === 'bodyweight' ? bw : ex.weight, ex.reps);
                        return { id: `log-${dayOffset}-${idx}`, exercise: ex.name, mode, weight: ex.weight, sets: ex.sets, reps: ex.reps, volume, estimated1RM };
                    });
                    sessions.push({ id: `session-${dayOffset}`, date: date.toISOString().split('T')[0], bodyWeight: bw, note, isDeload, logs });
                };
                createSession(0, [{ name: 'bench_press', weight: 60, sets: 4, reps: 8 }, { name: 'overhead_press', weight: 35, sets: 4, reps: 10 }], false, '今日训练');
                createSession(2, [{ name: 'deadlift', weight: 80, sets: 3, reps: 6 }, { name: 'barbell_row', weight: 50, sets: 4, reps: 8 }], false, '硬拉日');
                createSession(4, [{ name: 'squat', weight: 70, sets: 4, reps: 8 }, { name: 'leg_press', weight: 120, sets: 3, reps: 12 }], false, '腿部日');
                bw = 70.5;
                createSession(6, [{ name: 'bench_press', weight: 62, sets: 4, reps: 8 }, { name: 'incline_bench', weight: 42, sets: 3, reps: 10 }], false, '推日进阶');
                createSession(8, [{ name: 'pull_up', weight: 0, sets: 4, reps: 6 }, { name: 'assisted_pull_up', weight: 10, sets: 3, reps: 8 }], false, '引体混合');
                createSession(10, [{ name: 'squat', weight: 72, sets: 4, reps: 8 }, { name: 'romanian_dl', weight: 45, sets: 3, reps: 10 }], false, '腿部进阶');
                bw = 71;
                createSession(12, [{ name: 'bench_press', weight: 65, sets: 4, reps: 8 }, { name: 'dips', weight: 0, sets: 3, reps: 12 }], false, '推日高峰');
                createSession(14, [{ name: 'weighted_pull_up', weight: 5, sets: 3, reps: 5 }, { name: 'deadlift', weight: 85, sets: 3, reps: 5 }], false, '负重引体');
                createSession(16, [{ name: 'squat', weight: 35, sets: 3, reps: 10 }, { name: 'leg_press', weight: 60, sets: 2, reps: 15 }], true, '减载周');
                bw = 71.5;
                createSession(18, [{ name: 'bench_press', weight: 64, sets: 4, reps: 8 }, { name: 'overhead_press', weight: 36, sets: 4, reps: 10 }], false, '恢复期');
                createSession(20, [{ name: 'barbell_row', weight: 52, sets: 4, reps: 8 }, { name: 'face_pull', weight: 20, sets: 3, reps: 12 }], false, '划船日');
                createSession(22, [{ name: 'bench_press', weight: 64, sets: 4, reps: 8 }], false, '平台期触发-卧推持平');
                return sessions;
            },
            generate: () => {
                return DemoData.generateSimple();
            }
        };

        let settings = Store.getSettings();
        let sessions = Store.getSessions();
        let charts = {};

        const Utils = {
            generateId: () => `id-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
            getBodyWeight: (session, sessionsList) => {
                if (session.bodyWeight) return session.bodyWeight;
                const prevSessions = sessionsList.filter(s => new Date(s.date) < new Date(session.date)).sort((a,b) => new Date(b.date) - new Date(a.date));
                for (const s of prevSessions) if (s.bodyWeight) return s.bodyWeight;
                return settings.defaultBodyWeight;
            },
            getAllExercises: () => [...ExerciseMeta.push, ...ExerciseMeta.pull, ...ExerciseMeta.legs]
        };

        const Renderer = {
            renderBanner: () => {
                const container = document.getElementById('banner-container');
                container.innerHTML = '';
                const hasDemoData = sessions.some(s => s.id.startsWith('session-'));
                if (hasDemoData && sessions.length > 0) {
                    container.innerHTML += `<div class="banner banner-info"><span>💡 已加载示例数据，可删除单个记录或在设置中清空数据重新开始</span><button class="btn btn-small btn-secondary" onclick="Renderer.dismissBanner(this)">关闭</button></div>`;
                }
                const plateaus = PlateauDetect.detect(sessions, settings);
                if (plateaus.length > 0) {
                    const worst = plateaus.reduce((a, b) => a.growth < b.growth ? a : b);
                    const levelConfig = PlateauDetect.config[settings.trainingLevel];
                    container.innerHTML += `<div class="banner banner-danger"><span>⚠️ <span class="badge-platform">平台期</span> ${worst.exerciseName}连续${levelConfig.consecutivePeriods}周期增长低于${(levelConfig.threshold*100).toFixed(0)}%，建议调整训练计划</span></div>`;
                }
            },
            dismissBanner: (btn) => {
                const banner = btn.closest('.banner');
                if (banner) banner.remove();
            },
            renderCards: () => {
                const container = document.getElementById('cards-container');
                const weeklyData = WeeklyAgg.aggregate(sessions);
                const thisWeekKey = WeeklyAgg.getWeekKey(new Date());
                const lastWeekKey = WeeklyAgg.getWeekKey(new Date(Date.now() - 7*24*60*60*1000));
                const thisWeek = weeklyData.find(w => w.weekKey === thisWeekKey) || { total: 0, trainingDays: 0 };
                const lastWeek = weeklyData.find(w => w.weekKey === lastWeekKey) || { total: 0, trainingDays: 0 };
                const volChange = lastWeek.total > 0 ? ((thisWeek.total - lastWeek.total) / lastWeek.total * 100).toFixed(1) : 0;
                const daysChange = lastWeek.trainingDays > 0 ? ((thisWeek.trainingDays - lastWeek.trainingDays) / lastWeek.trainingDays * 100).toFixed(1) : 0;
                let bench1RM = 0, squat1RM = 0;
                sessions.forEach(s => s.logs.forEach(l => {
                    if (l.exercise === 'bench_press' && l.estimated1RM > bench1RM) bench1RM = l.estimated1RM;
                    if (l.exercise === 'squat' && l.estimated1RM > squat1RM) squat1RM = l.estimated1RM;
                }));
                let balanceHtml = '';
                if (settings.balanceEnabled) {
                    const balance = BalanceCalc.calculate(sessions);
                    if (balance) {
                        const status = BalanceCalc.getStatus(balance.ratio);
                        balanceHtml = `<div class="card"><div class="card-header">前后链平衡</div><div class="card-value" style="font-size:1.5rem;">${balance.ratio.toFixed(2)}</div><div class="balance-indicator balance-${status.status}">${status.text}</div></div>`;
                    }
                }
                container.innerHTML = `
                    <div class="card"><div class="card-header">本周总容量</div><div class="card-value">${thisWeek.total.toLocaleString()}</div><div class="card-subvalue ${volChange < 0 ? 'negative' : ''}">${volChange >= 0 ? '+' : ''}${volChange}% (环比)</div></div>
                    <div class="card"><div class="card-header">本周训练天数</div><div class="card-value">${thisWeek.trainingDays}</div><div class="card-subvalue ${daysChange < 0 ? 'negative' : ''}">${daysChange >= 0 ? '+' : ''}${daysChange}% (环比)</div></div>
                    <div class="card"><div class="card-header">卧推 1RM</div><div class="card-value">${bench1RM} <span style="font-size:1rem;color:var(--text-muted);">kg</span></div></div>
                    <div class="card"><div class="card-header">深蹲 1RM</div><div class="card-value">${squat1RM} <span style="font-size:1rem;color:var(--text-muted);">kg</span></div></div>
                    ${balanceHtml}
                `;
            },
            renderExerciseForm: (container, logs) => {
                container.innerHTML = '';
                if (!logs || logs.length === 0) logs = [{ id: Utils.generateId(), exercise: '', mode: 'weighted', weight: '', sets: '', reps: '' }];
                logs.forEach((log, index) => {
                    const row = document.createElement('div');
                    row.className = 'exercise-row';
                    const isBodyweight = VolumeCalc.getMode(log.exercise) === 'bodyweight';
                    row.innerHTML = `<select class="log-exercise" data-index="${index}" required>
                        <option value="">选择动作</option>
                        <optgroup label="推">${ExerciseMeta.push.map(e => `<option value="${e}" ${log.exercise === e ? 'selected' : ''}>${ExerciseMeta.names[e]}</option>`).join('')}</optgroup>
                        <optgroup label="拉">${ExerciseMeta.pull.map(e => `<option value="${e}" ${log.exercise === e ? 'selected' : ''}>${ExerciseMeta.names[e]}</option>`).join('')}</optgroup>
                        <optgroup label="腿">${ExerciseMeta.legs.map(e => `<option value="${e}" ${log.exercise === e ? 'selected' : ''}>${ExerciseMeta.names[e]}</option>`).join('')}</optgroup>
                    </select>
                    <input type="number" class="log-weight" data-index="${index}" placeholder="重量" value="${log.weight}" ${isBodyweight ? 'disabled' : ''}>
                    ${isBodyweight ? '<input type="hidden" value="bodyweight">' : `<select class="log-mode" data-index="${index}"><option value="weighted" ${log.mode === 'weighted' ? 'selected' : ''}>负重</option><option value="assisted" ${log.mode === 'assisted' ? 'selected' : ''}>辅助</option><option value="weighted_bw" ${log.mode === 'weighted_bw' ? 'selected' : ''}>负重自重</option></select>`}
                    <input type="number" class="log-sets" data-index="${index}" placeholder="组数" value="${log.sets}" min="1" required>
                    <input type="text" class="log-reps" data-index="${index}" placeholder="次数" value="${log.reps}" required>
                    <button type="button" class="btn-remove" data-index="${index}">×</button>`;
                    container.appendChild(row);
                });
                container.querySelectorAll('.log-exercise').forEach(select => {
                    select.addEventListener('change', e => {
                        const index = e.target.dataset.index;
                        const mode = VolumeCalc.getMode(e.target.value);
                        const weightInput = container.querySelector(`.log-weight[data-index="${index}"]`);
                        const modeSelect = container.querySelector(`.log-mode[data-index="${index}"]`);
                        if (mode === 'bodyweight') {
                            weightInput.disabled = true;
                            weightInput.value = '';
                            if (modeSelect) { modeSelect.remove(); }
                            const hidden = document.createElement('input');
                            hidden.type = 'hidden';
                            hidden.value = 'bodyweight';
                            container.querySelectorAll('.exercise-row')[index].appendChild(hidden);
                        } else {
                            weightInput.disabled = false;
                            if (!modeSelect) {
                                const sel = document.createElement('select');
                                sel.className = 'log-mode';
                                sel.dataset.index = index;
                                sel.innerHTML = `<option value="weighted">负重</option><option value="assisted">辅助</option><option value="weighted_bw">负重自重</option>`;
                                sel.value = mode;
                                container.querySelectorAll('.exercise-row')[index].insertBefore(sel, container.querySelectorAll('.exercise-row')[index].querySelector('.log-sets'));
                            } else modeSelect.value = mode;
                        }
                    });
                });
                container.querySelectorAll('.btn-remove').forEach(btn => {
                    btn.addEventListener('click', e => {
                        const index = e.target.dataset.index;
                        const rows = container.querySelectorAll('.exercise-row');
                        if (rows.length > 1) rows[index].remove();
                    });
                });
            },
            renderCharts: () => {
                Renderer.renderVolumeChart();
                Renderer.renderBodyWeightChart();
                Renderer.renderStrengthChart();
                Renderer.renderExerciseVolumeChart();
                Renderer.renderBalanceChart();
            },
            renderVolumeChart: () => {
                charts.volume?.destroy();
                const canvas = document.createElement('canvas');
                canvas.id = 'volume-chart';
                document.getElementById('volume-chart-wrapper').innerHTML = '';
                document.getElementById('volume-chart-wrapper').appendChild(canvas);
                const weeklyData = WeeklyAgg.aggregate(sessions);
                const labels = weeklyData.map(w => { const d = new Date(w.weekKey); return `${d.getMonth()+1}/${d.getDate()}`; });
                const totalData = weeklyData.map(w => w.total);
                const maxVolume = Math.max(...totalData);
                const pointColors = totalData.map(v => v === maxVolume ? '#fbbf24' : 'rgba(251, 191, 36, 0.3)');
                const periodColors = weeklyData.map(w => {
                    const period = Periodization.getPeriod(w.weekKey, settings.startDate, settings.cycleLength);
                    return period?.isDeload ? 'rgba(59, 130, 246, 0.1)' : 'rgba(16, 185, 129, 0.05)';
                });
                charts.volume = new Chart(canvas, {
                    type: 'line',
                    data: {
                        labels,
                        datasets: [
                            { label: '总容量', data: totalData, borderColor: '#10b981', backgroundColor: 'rgba(16, 185, 129, 0.1)', fill: true, tension: 0.4, pointBackgroundColor: pointColors, pointBorderColor: pointColors, pointRadius: 5 },
                            { label: '推', data: weeklyData.map(w => w.push), borderColor: '#ef4444', borderDash: [5,5], backgroundColor: 'transparent', tension: 0.4, pointRadius: 0 },
                            { label: '拉', data: weeklyData.map(w => w.pull), borderColor: '#3b82f6', borderDash: [5,5], backgroundColor: 'transparent', tension: 0.4, pointRadius: 0 }
                        ]
                    },
                    plugins: [{
                        id: 'periodBackground',
                        beforeDraw: (chart) => {
                            const ctx = chart.ctx;
                            const xAxis = chart.scales.x;
                            const yAxis = chart.scales.y;
                            periodColors.forEach((color, i) => {
                                const x1 = xAxis.getPixelForValue(i - 0.5);
                                const x2 = xAxis.getPixelForValue(i + 0.5);
                                ctx.fillStyle = color;
                                ctx.fillRect(x1, yAxis.top, x2 - x1, yAxis.bottom - yAxis.top);
                            });
                        }
                    }],
                    options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: { color: 'rgba(51,65,85,0.5)' }, ticks: { color: '#94a3b8' } }, y: { grid: { color: 'rgba(51,65,85,0.5)' }, ticks: { color: '#94a3b8' } } }, plugins: { legend: { labels: { color: '#f1f5f9' } }, tooltip: { backgroundColor: '#1e293b', titleColor: '#f1f5f9', bodyColor: '#94a3b8' } } }
                });
            },
            renderBodyWeightChart: () => {
                charts.bodyweight?.destroy();
                const canvas = document.createElement('canvas');
                canvas.id = 'bodyweight-chart';
                document.getElementById('bodyweight-chart-wrapper').innerHTML = '';
                document.getElementById('bodyweight-chart-wrapper').appendChild(canvas);
                const data = sessions.filter(s => s.bodyWeight).sort((a,b) => new Date(a.date) - new Date(b.date));
                charts.bodyweight = new Chart(canvas, {
                    type: 'line',
                    data: { labels: data.map(s => { const d = new Date(s.date); return `${d.getMonth()+1}/${d.getDate()}`; }), datasets: [{ label: '体重 (kg)', data: data.map(s => s.bodyWeight), borderColor: '#8b5cf6', backgroundColor: 'rgba(139,92,246,0.1)', fill: true, tension: 0.4, pointRadius: 3 }] },
                    options: { responsive: true, maintainAspectRatio: false, scales: { x: { display: false }, y: { grid: { display: false }, ticks: { color: '#94a3b8', maxTicksLimit: 4 } } }, plugins: { legend: { display: false }, tooltip: { backgroundColor: '#1e293b', titleColor: '#f1f5f9', bodyColor: '#94a3b8' } } }
                });
            },
            renderStrengthChart: () => {
                const existing = document.getElementById('strength-chart-wrapper');
                if (existing) existing.remove();
                const wrapper = document.createElement('div');
                wrapper.className = 'chart-container';
                wrapper.id = 'strength-chart-wrapper';
                wrapper.innerHTML = '<div class="chart-title">💪 强度趋势 (1RM)</div><div class="chart-wrapper" id="strength-chart-inner"></div>';
                document.getElementById('charts-container').appendChild(wrapper);
                const canvas = document.createElement('canvas');
                canvas.id = 'strength-chart';
                document.getElementById('strength-chart-inner').appendChild(canvas);
                const exercise1RM = {};
                const dates = [...new Set(sessions.map(s => new Date(s.date).toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' })))];
                sessions.forEach(s => s.logs.forEach(l => { if (!exercise1RM[l.exercise]) exercise1RM[l.exercise] = {}; exercise1RM[l.exercise][s.date] = l.estimated1RM; }));
                const mainExercises = ['bench_press', 'squat', 'deadlift', 'overhead_press', 'barbell_row'];
                const colors = ['#10b981', '#f59e0b', '#ef4444', '#3b82f6', '#8b5cf6'];
                charts.strength = new Chart(canvas, {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: mainExercises.map((ex, i) => ({
                            label: ExerciseMeta.names[ex] || ex,
                            data: dates.map(dateStr => {
                                const s = sessions.find(s => new Date(s.date).toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' }) === dateStr);
                                return s ? (exercise1RM[ex]?.[s.date] || null) : null;
                            }),
                            borderColor: colors[i],
                            backgroundColor: 'transparent',
                            tension: 0.3,
                            pointRadius: 4,
                            spanGaps: true
                        }))
                    },
                    options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: { color: 'rgba(51,65,85,0.5)' }, ticks: { color: '#94a3b8', maxTicksLimit: 8 } }, y: { grid: { color: 'rgba(51,65,85,0.5)' }, ticks: { color: '#94a3b8' } } }, plugins: { legend: { labels: { color: '#f1f5f9' } }, tooltip: { backgroundColor: '#1e293b', titleColor: '#f1f5f9', bodyColor: '#94a3b8' } } }
                });
            },
            renderExerciseVolumeChart: () => {
                const existing = document.getElementById('exercise-volume-chart-wrapper');
                if (existing) existing.remove();
                const wrapper = document.createElement('div');
                wrapper.className = 'chart-container';
                wrapper.id = 'exercise-volume-chart-wrapper';
                wrapper.innerHTML = '<div class="chart-title">📊 动作容量分布</div><div class="chart-wrapper" id="exercise-volume-chart-inner"></div>';
                document.getElementById('charts-container').appendChild(wrapper);
                const canvas = document.createElement('canvas');
                canvas.id = 'exercise-volume-chart';
                document.getElementById('exercise-volume-chart-inner').appendChild(canvas);
                const exerciseVolume = {};
                sessions.forEach(s => s.logs.forEach(l => { exerciseVolume[l.exercise] = (exerciseVolume[l.exercise] || 0) + l.volume; }));
                const sorted = Object.entries(exerciseVolume).sort((a,b) => b[1] - a[1]).slice(0, 8);
                charts.exerciseVolume = new Chart(canvas, {
                    type: 'bar',
                    data: { labels: sorted.map(([ex]) => ExerciseMeta.names[ex] || ex), datasets: [{ data: sorted.map(([,v]) => v), backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16'], borderRadius: 6 }] },
                    options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: { display: false }, ticks: { color: '#94a3b8' } }, y: { grid: { color: 'rgba(51,65,85,0.5)' }, ticks: { color: '#94a3b8' } } }, plugins: { legend: { display: false }, tooltip: { backgroundColor: '#1e293b', titleColor: '#f1f5f9', bodyColor: '#94a3b8' } } }
                });
            },
            renderBalanceChart: () => {
                const existing = document.getElementById('balance-chart-wrapper');
                if (existing) existing.remove();
                if (!settings.balanceEnabled) return;
                const wrapper = document.createElement('div');
                wrapper.className = 'chart-container';
                wrapper.id = 'balance-chart-wrapper';
                wrapper.innerHTML = '<div class="chart-title">⚖️ 前后链平衡趋势</div><div class="chart-wrapper" id="balance-chart-inner"></div>';
                document.getElementById('charts-container').appendChild(wrapper);
                const canvas = document.createElement('canvas');
                canvas.id = 'balance-chart';
                document.getElementById('balance-chart-inner').appendChild(canvas);
                const weeklyData = WeeklyAgg.aggregate(sessions);
                const labels = weeklyData.map(w => { const d = new Date(w.weekKey); return `${d.getMonth()+1}/${d.getDate()}`; });
                charts.balance = new Chart(canvas, {
                    type: 'line',
                    data: {
                        labels,
                        datasets: [
                            { label: '推', data: weeklyData.map(w => w.push), borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,0.1)', fill: true, tension: 0.4 },
                            { label: '拉', data: weeklyData.map(w => w.pull), borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.1)', fill: true, tension: 0.4 }
                        ]
                    },
                    options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: { color: 'rgba(51,65,85,0.5)' }, ticks: { color: '#94a3b8', maxTicksLimit: 8 } }, y: { grid: { color: 'rgba(51,65,85,0.5)' }, ticks: { color: '#94a3b8' } } }, plugins: { legend: { labels: { color: '#f1f5f9' } }, tooltip: { backgroundColor: '#1e293b', titleColor: '#f1f5f9', bodyColor: '#94a3b8' } } }
                });
            },
            renderLogsList: () => {
                const container = document.getElementById('logs-list');
                const search = document.getElementById('filter-search').value.toLowerCase();
                const exerciseFilter = document.getElementById('filter-exercise').value;
                const typeFilter = document.getElementById('filter-type').value;
                let filtered = sessions.filter(s => {
                    if (search && !s.note.toLowerCase().includes(search)) return false;
                    if (exerciseFilter && !s.logs.some(l => l.exercise === exerciseFilter)) return false;
                    if (typeFilter && !s.logs.some(l => ExerciseMeta[typeFilter].includes(l.exercise))) return false;
                    return true;
                }).sort((a,b) => new Date(b.date) - new Date(a.date));
                if (filtered.length === 0) { container.innerHTML = '<div class="empty-state"><h3>暂无训练记录</h3><p>开始录入你的第一条训练记录吧！</p></div>'; return; }
                container.innerHTML = filtered.map(session => {
                    const period = Periodization.getPeriod(session.date, settings.startDate, settings.cycleLength);
                    const totalVolume = session.logs.reduce((sum, l) => sum + l.volume, 0);
                    const bodyWeight = Utils.getBodyWeight(session, sessions);
                    return `<div class="session-group">
                        <div class="session-header" onclick="Renderer.toggleSession('${session.id}')">
                            <div class="session-header-left">
                                <span class="session-date">${session.date}</span>
                                <span class="session-bodyweight">${bodyWeight}kg</span>
                                ${session.note ? `<span class="session-note">${session.note}</span>` : ''}
                                ${session.isDeload ? '<span class="badge-deload">减载</span>' : ''}
                                ${period ? `<span class="period-badge ${period.isDeload ? 'period-deload' : 'period-accumulation'}">周期${period.cycle}-${period.weekInCycle}</span>` : ''}
                            </div>
                            <div style="display:flex;align-items:center;gap:12px;">
                                <span class="session-total-volume">${totalVolume.toLocaleString()}</span>
                                <div class="session-actions">
                                    <button class="btn btn-small btn-secondary" onclick="event.stopPropagation(); App.openEditModal('${session.id}')">✏️</button>
                                    <button class="btn btn-small btn-danger" onclick="event.stopPropagation(); App.deleteSession('${session.id}')">🗑️</button>
                                </div>
                            </div>
                        </div>
                        <div class="session-content hidden" id="session-content-${session.id}">
                            ${session.logs.map(l => `<div class="session-exercise"><div class="session-exercise-info"><div class="session-exercise-name">${ExerciseMeta.names[l.exercise] || l.exercise}</div><div class="session-exercise-detail">${l.sets}组×${l.reps}次 ${l.weight ? l.weight+'kg' : ''}</div></div><div style="text-align:right;"><div class="session-exercise-volume">${l.volume}</div><div class="session-exercise-1rm">1RM: ${l.estimated1RM}kg</div></div></div>`).join('')}
                        </div>
                    </div>`;
                }).join('');
            },
            toggleSession: (sessionId) => {
                const content = document.getElementById('session-content-'+sessionId);
                if (content) content.classList.toggle('hidden');
            }
        };

        const App = {
            init: () => {
                if (sessions.length === 0) {
                    sessions = DemoData.generate();
                    Store.saveSessions(sessions);
                }
                document.getElementById('session-date').valueAsDate = new Date();
                Renderer.renderExerciseForm(document.getElementById('exercise-forms'));
                App.bindEvents();
                App.renderAll();
                const exerciseSelect = document.getElementById('filter-exercise');
                Utils.getAllExercises().forEach(ex => { const opt = document.createElement('option'); opt.value = ex; opt.textContent = ExerciseMeta.names[ex] || ex; exerciseSelect.appendChild(opt); });
            },
            bindEvents: () => {
                document.getElementById('btn-settings').addEventListener('click', App.openSettingsModal);
                document.getElementById('btn-close-settings').addEventListener('click', App.closeSettingsModal);
                document.getElementById('btn-cancel-settings').addEventListener('click', App.closeSettingsModal);
                document.getElementById('settings-form').addEventListener('submit', App.saveSettings);
                document.getElementById('btn-clear-data').addEventListener('click', App.clearData);
                document.getElementById('btn-add-exercise').addEventListener('click', () => Renderer.renderExerciseForm(document.getElementById('exercise-forms'), App.getFormLogs()));
                document.getElementById('session-form').addEventListener('submit', App.saveSession);
                document.getElementById('filter-search').addEventListener('input', Renderer.renderLogsList);
                document.getElementById('filter-exercise').addEventListener('change', Renderer.renderLogsList);
                document.getElementById('filter-type').addEventListener('change', Renderer.renderLogsList);
                document.getElementById('btn-close-edit').addEventListener('click', App.closeEditModal);
                document.getElementById('btn-cancel-edit').addEventListener('click', App.closeEditModal);
                document.getElementById('btn-add-edit-exercise').addEventListener('click', () => Renderer.renderExerciseForm(document.getElementById('edit-exercise-forms'), App.getEditFormLogs()));
                document.getElementById('edit-form').addEventListener('submit', App.saveEditSession);
                document.getElementById('btn-delete-session').addEventListener('click', App.deleteSessionConfirm);
                document.getElementById('setting-training-level').addEventListener('change', App.updateTrainingLevelInfo);
                App.updateTrainingLevelInfo();
            },
            updateTrainingLevelInfo: () => {
                const level = document.getElementById('setting-training-level').value;
                const config = PlateauDetect.config[level];
                document.getElementById('training-level-info').textContent = '保护期'+config.protectionMonths+'个月，容量增长阈值'+(config.threshold*100).toFixed(0)+'%,连续'+config.consecutivePeriods+'周期未达标触发平台期';
            },
            renderAll: () => { Renderer.renderBanner(); Renderer.renderCards(); Renderer.renderCharts(); Renderer.renderLogsList(); },
            getFormLogs: (containerId) => {
                const container = document.getElementById(containerId || 'exercise-forms');
                const rows = container.querySelectorAll('.exercise-row');
                const logs = [];
                rows.forEach(row => {
                    const exercise = row.querySelector('.log-exercise')?.value;
                    const weight = parseFloat(row.querySelector('.log-weight')?.value) || 0;
                    const mode = row.querySelector('.log-mode')?.value || row.querySelector('input[type="hidden"]')?.value || 'weighted';
                    const sets = parseInt(row.querySelector('.log-sets')?.value) || 0;
                    const repsInput = row.querySelector('.log-reps')?.value || '';
                    const repsList = repsInput.split(',').map(r => parseInt(r.trim())).filter(r => !isNaN(r));
                    const totalReps = repsList.length > 0 ? repsList.reduce((a, b) => a + b, 0) : 0;
                    const avgReps = repsList.length > 0 ? Math.round(totalReps / repsList.length) : 0;
                    if (exercise && sets > 0 && totalReps > 0) logs.push({ id: Utils.generateId(), exercise, mode, weight, sets, reps: avgReps, totalReps, volume: 0, estimated1RM: 0 });
                });
                return logs;
            },
            getEditFormLogs: () => App.getFormLogs('edit-exercise-forms'),
            saveSession: (e) => {
                e.preventDefault();
                const date = document.getElementById('session-date').value;
                const bodyWeight = parseFloat(document.getElementById('session-bodyweight').value) || null;
                const note = document.getElementById('session-note').value;
                const isDeload = document.getElementById('session-is-deload').checked;
                const logs = App.getFormLogs();
                if (logs.length === 0) { alert('请至少添加一个动作'); return; }
                const effectiveBodyWeight = bodyWeight || Utils.getBodyWeight({ date, bodyWeight: null }, sessions);
                const processedLogs = logs.map(log => {
                    const volume = VolumeCalc.calculate(log.mode, log.weight, log.totalReps, effectiveBodyWeight);
                    const estimated1RM = OneRMCalc.calculate(log.mode === 'bodyweight' ? effectiveBodyWeight : log.weight, log.reps);
                    return { ...log, volume, estimated1RM };
                });
                sessions.push({ id: Utils.generateId(), date, bodyWeight, note, isDeload, logs: processedLogs });
                sessions.sort((a,b) => new Date(a.date) - new Date(b.date));
                Store.saveSessions(sessions);
                document.getElementById('session-form').reset();
                document.getElementById('session-date').valueAsDate = new Date();
                Renderer.renderExerciseForm(document.getElementById('exercise-forms'));
                App.renderAll();
            },
            openSettingsModal: () => {
                document.getElementById('setting-default-bodyweight').value = settings.defaultBodyWeight;
                document.getElementById('setting-cycle-length').value = settings.cycleLength;
                document.getElementById('setting-start-date').value = settings.startDate;
                document.getElementById('setting-training-level').value = settings.trainingLevel;
                document.getElementById('setting-balance-enabled').checked = settings.balanceEnabled;
                document.getElementById('settings-modal').classList.remove('hidden');
            },
            closeSettingsModal: () => document.getElementById('settings-modal').classList.add('hidden'),
            saveSettings: (e) => {
                e.preventDefault();
                const newSettings = {
                    defaultBodyWeight: parseFloat(document.getElementById('setting-default-bodyweight').value),
                    cycleLength: parseInt(document.getElementById('setting-cycle-length').value),
                    startDate: document.getElementById('setting-start-date').value,
                    trainingLevel: document.getElementById('setting-training-level').value,
                    balanceEnabled: document.getElementById('setting-balance-enabled').checked
                };
                if (newSettings.cycleLength !== settings.cycleLength || newSettings.startDate !== settings.startDate) {
                    if (!confirm('修改周期长度或开始日期将重新计算周期划分，确定继续？')) return;
                }
                settings = newSettings;
                Store.saveSettings(settings);
                App.closeSettingsModal();
                App.renderAll();
            },
            clearData: () => {
                if (confirm('确定清空所有数据？此操作不可撤销。')) {
                    Store.clearAll();
                    settings = Store.getSettings();
                    sessions = DemoData.generate();
                    Store.saveSessions(sessions);
                    App.renderAll();
                }
            },
            openEditModal: (sessionId) => {
                const session = sessions.find(s => s.id === sessionId);
                if (!session) return;
                document.getElementById('edit-session-id').value = session.id;
                document.getElementById('edit-date').value = session.date;
                document.getElementById('edit-bodyweight').value = session.bodyWeight || '';
                document.getElementById('edit-note').value = session.note;
                document.getElementById('edit-is-deload').checked = session.isDeload;
                Renderer.renderExerciseForm(document.getElementById('edit-exercise-forms'), session.logs);
                document.getElementById('edit-modal').classList.remove('hidden');
            },
            closeEditModal: () => document.getElementById('edit-modal').classList.add('hidden'),
            saveEditSession: (e) => {
                e.preventDefault();
                const sessionId = document.getElementById('edit-session-id').value;
                const sessionIndex = sessions.findIndex(s => s.id === sessionId);
                if (sessionIndex === -1) return;
                const date = document.getElementById('edit-date').value;
                const bodyWeight = parseFloat(document.getElementById('edit-bodyweight').value) || null;
                const note = document.getElementById('edit-note').value;
                const isDeload = document.getElementById('edit-is-deload').checked;
                const logs = App.getEditFormLogs();
                if (logs.length === 0) { alert('请至少保留一个动作'); return; }
                const effectiveBodyWeight = bodyWeight || Utils.getBodyWeight({ date, bodyWeight: null }, sessions);
                const processedLogs = logs.map(log => {
                    const volume = VolumeCalc.calculate(log.mode, log.weight, log.totalReps, effectiveBodyWeight);
                    const estimated1RM = OneRMCalc.calculate(log.mode === 'bodyweight' ? effectiveBodyWeight : log.weight, log.reps);
                    return { ...log, volume, estimated1RM };
                });
                sessions[sessionIndex] = { id: sessionId, date, bodyWeight, note, isDeload, logs: processedLogs };
                sessions.sort((a,b) => new Date(a.date) - new Date(b.date));
                Store.saveSessions(sessions);
                App.closeEditModal();
                App.renderAll();
            },
            deleteSessionConfirm: () => App.deleteSession(document.getElementById('edit-session-id').value),
            deleteSession: (sessionId) => {
                if (confirm('确定删除这条训练记录？')) {
                    sessions = sessions.filter(s => s.id !== sessionId);
                    Store.saveSessions(sessions);
                    App.closeEditModal();
                    App.renderAll();
                }
            }
        };

        document.addEventListener('DOMContentLoaded', App.init);
    </script>
</body>
</html>
