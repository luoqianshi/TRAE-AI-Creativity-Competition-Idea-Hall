<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <meta name="theme-color" content="#0F9D58" />
  <title>静途 · AI 全民共建运动路线</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="app-shell">
    <div class="app-container">

      <!-- 顶部 Hero -->
      <div class="hero">
        <div class="hero-inner">
          <div class="hero-brand">
            <span class="hero-brand-main">静途</span>
            <span class="hero-brand-sub">JING · TU</span>
          </div>
          <div class="hero-slogan">找到更安静、更安全的城市运动路线</div>
          <div class="hero-badges">
            <span class="hero-badge">🌿 低车流</span>
            <span class="hero-badge">🌙 分时段</span>
            <span class="hero-badge">🤖 AI 推荐</span>
          </div>
        </div>
      </div>

      <div class="page-wrap">

        <!-- 目标里程 -->
        <div class="card">
          <div class="section-title">目标里程</div>
          <div class="option-row" id="distanceRow">
            <span class="option-item active" data-value="3">3km</span>
            <span class="option-item active" data-value="5">5km</span>
            <span class="option-item" data-value="8">8km</span>
            <span class="option-item" data-value="10">10km</span>
          </div>
          <div class="custom-distance">
            <span class="text-muted text-small">自定义：</span>
            <input class="field-input" id="customDistance" placeholder="例如 4.5" />
            <span class="text-muted text-small">km</span>
          </div>
        </div>

        <!-- 运动类型 -->
        <div class="card">
          <div class="section-title">运动类型</div>
          <div class="option-row" id="sportRow">
            <span class="option-item" data-value="散步">散步</span>
            <span class="option-item active" data-value="慢跑">慢跑</span>
            <span class="option-item" data-value="骑行">骑行</span>
          </div>
        </div>

        <!-- 时段 -->
        <div class="card">
          <div class="section-title">运动时段</div>
          <div class="option-row" id="timeRow">
            <span class="option-item" data-value="早间">早间</span>
            <span class="option-item" data-value="白天">白天</span>
            <span class="option-item active" data-value="夜间">夜间</span>
          </div>
        </div>

        <!-- 偏好 -->
        <div class="card">
          <div class="section-title">我的偏好</div>
          <div class="option-row" id="priorityRow">
            <span class="option-item active" data-value="安静优先">安静优先</span>
            <span class="option-item" data-value="安全优先">安全优先</span>
            <span class="option-item" data-value="风景优先">风景优先</span>
            <span class="option-item" data-value="运动适配优先">运动适配优先</span>
          </div>
        </div>

        <!-- 当前选择摘要 -->
        <div class="summary">
          <span class="summary-label">当前选择：</span>
          <span class="summary-text" id="summaryText">夜间慢跑 5km · 安静优先</span>
        </div>

        <!-- AI 生成按钮 -->
        <button class="btn-primary" id="btnGenerate">✨ AI 生成路线</button>

        <!-- 底部快捷入口 -->
        <div class="quick-row">
          <div class="quick-item" id="btnUpload">
            <span class="quick-emoji">📮</span>上传私藏路线
          </div>
          <div class="quick-item" id="btnIntro">
            <span class="quick-emoji">💡</span>关于"全民共建"
          </div>
        </div>

        <div class="footer-note">
          静途 · AI 创造力大赛初赛作品 · H5 演示版<br />
          <a href="javascript:void(0)" id="btnReset">【重置演示数据】</a>
        </div>

      </div>
    </div>
  </div>

  <script src="assets/mockRoutes.js"></script>
  <script src="assets/recommend.js"></script>
  <script src="assets/app.js"></script>
  <script>
    // ---- 首页状态 ----
    const state = {
      distanceKm: 5,
      sport: '慢跑',
      timeSlot: '夜间',
      priority: '安静优先'
    };

    // 单选工具
    function setSingleChoice(rowId, key) {
      const row = document.getElementById(rowId);
      row.addEventListener('click', (e) => {
        const t = e.target.closest('.option-item');
        if (!t) return;
        row.querySelectorAll('.option-item').forEach(el => el.classList.remove('active'));
        t.classList.add('active');
        state[key] = t.dataset.value;
        if (key === 'distanceKm') {
          // 清除自定义输入
          document.getElementById('customDistance').value = '';
          state.distanceKm = parseFloat(t.dataset.value);
        }
        updateSummary();
      });
    }

    function updateSummary() {
      const text = `${state.timeSlot}${state.sport} ${state.distanceKm}km · ${state.priority}`;
      document.getElementById('summaryText').textContent = text;
    }

    setSingleChoice('distanceRow', 'distanceKm');
    setSingleChoice('sportRow', 'sport');
    setSingleChoice('timeRow', 'timeSlot');
    setSingleChoice('priorityRow', 'priority');

    // 自定义里程
    document.getElementById('customDistance').addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      if (!isNaN(v) && v > 0) {
        document.querySelectorAll('#distanceRow .option-item').forEach(el => el.classList.remove('active'));
        state.distanceKm = v;
        updateSummary();
      }
    });

    // AI 生成
    document.getElementById('btnGenerate').addEventListener('click', () => {
      App.setPreference(state);
      const url = App.buildUrl('recommend.html', {
        d: state.distanceKm,
        s: state.sport,
        t: state.timeSlot,
        p: state.priority
      });
      window.location.href = url;
    });

    document.getElementById('btnUpload').addEventListener('click', () => {
      window.location.href = 'upload.html';
    });

    document.getElementById('btnIntro').addEventListener('click', () => {
      App.modal({
        title: '关于"全民共建"',
        content: '静途的每条路线推荐都由大家的上报共同改进。你给一条路线打"无路灯"，其他用户夜间看到它时，AI 会自动降低它的安全推荐分。当你上传一条私藏路线，它也会进入全国路线池被推荐。',
        confirmText: '我懂了'
      });
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      MockRoutes.resetAll();
      App.toast('演示数据已重置');
    });
  </script>
</body>
</html>
