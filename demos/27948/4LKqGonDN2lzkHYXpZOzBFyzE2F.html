<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ClassAI - AI班级管理系统</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --primary: #4F6EF7;
    --primary-light: #6B85F9;
    --primary-dark: #3A56E0;
    --primary-bg: #EEF2FF;
    --bg: #F5F7FA;
    --card: #FFFFFF;
    --text: #1A2138;
    --text-secondary: #6B7280;
    --text-tertiary: #9CA3AF;
    --border: #EEF0F4;
    --red: #F87171;
    --red-bg: #FEF2F2;
    --green: #34D399;
    --green-bg: #ECFDF5;
    --yellow: #FBBF24;
    --yellow-bg: #FFFBEB;
    --gray: #9CA3AF;
    --gray-bg: #F3F4F6;
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.04);
    --shadow: 0 4px 16px rgba(16, 24, 40, 0.06);
    --shadow-lg: 0 12px 32px rgba(79, 110, 247, 0.18);
  }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: #E8ECF2;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #DDE3F0 0%, #E8ECF2 50%, #DDE5F5 100%);
  }

  /* 手机外壳 */
  .phone {
    width: 430px;
    height: 932px;
    max-height: 100vh;
    background: var(--bg);
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(30, 41, 90, 0.25), 0 0 0 1px rgba(0,0,0,0.04);
    border-radius: 0;
  }

  @media (max-width: 470px) {
    body { background: var(--bg); }
    .phone {
      width: 100vw;
      height: 100vh;
      max-height: 100vh;
      box-shadow: none;
    }
  }

  /* 状态栏 */
  .status-bar {
    height: 44px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    background: var(--card);
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    position: relative;
    z-index: 10;
  }
  .status-bar .time { letter-spacing: 0.5px; }
  .status-bar .icons { display: flex; align-items: center; gap: 6px; }
  .status-bar .icons svg { width: 16px; height: 11px; }

  /* 顶部标题栏 */
  .top-bar {
    height: 52px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 9;
  }
  .top-bar .title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .top-bar .title .logo-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--primary);
    box-shadow: 0 0 0 4px var(--primary-bg);
  }
  .top-bar .right-action {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-secondary);
  }

  /* 内容区 */
  .content {
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  .panel {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    opacity: 0;
    visibility: hidden;
    transform: translateX(8px);
    transition: opacity .28s ease, transform .28s ease, visibility .28s;
    padding-bottom: 96px;
  }
  .panel.active {
    opacity: 1;
    visibility: visible;
    transform: translateX(0);
  }
  .panel::-webkit-scrollbar { width: 0; }

  /* ============ Tab 1: AI 助手 ============ */
  #panel-chat {
    display: flex;
    flex-direction: column;
    padding-bottom: 0;
    overflow: hidden;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px 8px;
    background: var(--bg);
  }
  .chat-messages::-webkit-scrollbar { width: 0; }

  .msg {
    display: flex;
    margin-bottom: 14px;
    animation: msgIn .35s cubic-bezier(.21,.6,.35,1) both;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user { justify-content: flex-end; }
  .msg .avatar {
    width: 36px; height: 36px;
    border-radius: 10px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    color: #fff;
  }
  .msg.ai .avatar {
    background: linear-gradient(135deg, var(--primary) 0%, #7B5CF5 100%);
    margin-right: 10px;
    box-shadow: 0 4px 10px rgba(79,110,247,.3);
  }
  .msg.user .avatar {
    background: linear-gradient(135deg, #FF8A65 0%, #FF6E40 100%);
    margin-left: 10px;
    order: 2;
  }
  .msg .bubble {
    max-width: 76%;
    padding: 11px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.6;
    word-break: break-word;
    white-space: pre-wrap;
    box-shadow: var(--shadow-sm);
  }
  .msg.ai .bubble {
    background: var(--card);
    color: var(--text);
    border-top-left-radius: 4px;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: #fff;
    border-top-right-radius: 4px;
  }
  .msg .bubble .confirm-line { color: var(--primary); font-weight: 600; }
  .msg .bubble .detail-line { color: var(--text-secondary); font-size: 13px; }
  .msg .bubble .strong { font-weight: 600; color: var(--text); }

  .thinking {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 2px;
  }
  .thinking .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--primary);
    opacity: .4;
    animation: blink 1.2s infinite;
  }
  .thinking .dot:nth-child(2) { animation-delay: .2s; }
  .thinking .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes blink {
    0%, 60%, 100% { opacity: .35; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-3px); }
  }

  /* 快捷按钮 */
  .quick-bar {
    display: flex;
    gap: 8px;
    padding: 10px 14px 6px;
    overflow-x: auto;
    background: var(--card);
    border-top: 1px solid var(--border);
  }
  .quick-bar::-webkit-scrollbar { display: none; }
  .quick-btn {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 20px;
    background: var(--primary-bg);
    color: var(--primary);
    font-size: 12.5px;
    font-weight: 500;
    border: 1px solid transparent;
    transition: all .2s;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .quick-btn:active { transform: scale(.95); background: #E0E7FF; }
  .quick-btn .icon { font-size: 13px; }

  /* 输入区 */
  .chat-input {
    flex-shrink: 0;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 10px 14px 14px;
    background: var(--card);
    border-top: 1px solid var(--border);
  }
  .chat-input textarea {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    max-height: 80px;
    min-height: 40px;
    line-height: 1.4;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color .2s;
  }
  .chat-input textarea:focus { border-color: var(--primary); background: #fff; }
  .send-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: #fff;
    border: none;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(79,110,247,.35);
    transition: transform .15s;
  }
  .send-btn:active { transform: scale(.9); }
  .send-btn:disabled { opacity: .5; box-shadow: none; }
  .send-btn svg { width: 18px; height: 18px; }

  /* ============ Tab 2: 行为记录 ============ */
  .filter-bar {
    display: flex;
    gap: 8px;
    padding: 14px 16px 10px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .filter-tab {
    padding: 6px 16px;
    border-radius: 18px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    background: var(--gray-bg);
    transition: all .2s;
  }
  .filter-tab.active {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 3px 8px rgba(79,110,247,.3);
  }

  .record-list { padding: 14px 14px 8px; }
  .record-card {
    background: var(--card);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    animation: cardIn .4s cubic-bezier(.21,.6,.35,1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .record-card .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .record-card .student {
    display: flex; align-items: center; gap: 10px;
  }
  .record-card .avatar-sm {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, #A5B4FC 0%, #818CF8 100%);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
  }
  .record-card .name { font-size: 15px; font-weight: 600; color: var(--text); }
  .tag {
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11.5px;
    font-weight: 600;
  }
  .tag.red { background: var(--red-bg); color: var(--red); }
  .tag.green { background: var(--green-bg); color: #059669; }
  .tag.gray { background: var(--gray-bg); color: var(--gray); }
  .tag.yellow { background: var(--yellow-bg); color: #D97706; }

  .record-card .detail {
    font-size: 13.5px;
    color: var(--text-secondary);
    line-height: 1.55;
    margin: 6px 0 10px;
  }
  .record-card .meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-tertiary);
    margin-bottom: 8px;
  }
  .record-card .meta .time { display: flex; align-items: center; gap: 4px; }
  .confidence {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px;
  }
  .confidence .label { color: var(--text-tertiary); }
  .confidence .bar {
    flex: 1;
    height: 5px;
    background: var(--gray-bg);
    border-radius: 3px;
    overflow: hidden;
    max-width: 100px;
  }
  .confidence .fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary) 0%, var(--primary-light) 100%);
    border-radius: 3px;
    transition: width .8s ease;
  }
  .confidence .val { color: var(--primary); font-weight: 600; }

  /* ============ Tab 3: 请假管理 ============ */
  .stats-row {
    display: flex;
    gap: 10px;
    padding: 16px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  .stat-mini {
    flex: 1;
    border-radius: 14px;
    padding: 12px 10px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .stat-mini.yellow { background: linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 100%); }
  .stat-mini.green { background: linear-gradient(135deg, #ECFDF5 0%, #D1FAE5 100%); }
  .stat-mini.gray { background: linear-gradient(135deg, #F3F4F6 0%, #E5E7EB 100%); }
  .stat-mini .num {
    font-size: 22px;
    font-weight: 800;
    line-height: 1.1;
  }
  .stat-mini.yellow .num { color: #D97706; }
  .stat-mini.green .num { color: #059669; }
  .stat-mini.gray .num { color: #6B7280; }
  .stat-mini .lbl {
    font-size: 11.5px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  .leave-list { padding: 14px; }
  .leave-card {
    background: var(--card);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    animation: cardIn .4s cubic-bezier(.21,.6,.35,1) both;
  }
  .leave-card .head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .leave-card .student { display: flex; align-items: center; gap: 10px; }
  .leave-card .avatar-sm {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
  }
  .leave-card .name { font-size: 15px; font-weight: 600; }
  .leave-card .type-row {
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .leave-card .type-badge {
    padding: 2px 8px;
    border-radius: 8px;
    background: var(--primary-bg);
    color: var(--primary);
    font-size: 11.5px;
    font-weight: 600;
  }
  .leave-card .time-range {
    color: var(--text-secondary);
    font-size: 13px;
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 6px;
  }
  .leave-card .reason {
    font-size: 13.5px;
    color: var(--text);
    line-height: 1.5;
    padding: 8px 10px;
    background: var(--bg);
    border-radius: 8px;
    margin-bottom: 4px;
  }
  .leave-card .actions {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  .leave-card .act-btn {
    flex: 1;
    padding: 8px 0;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 600;
    border: none;
    transition: all .2s;
  }
  .leave-card .act-btn.approve {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 3px 8px rgba(79,110,247,.25);
  }
  .leave-card .act-btn.reject {
    background: var(--bg);
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .leave-card .act-btn:active { transform: scale(.97); }
  .leave-card .status-text {
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 0;
    border-radius: 8px;
    margin-top: 4px;
  }
  .leave-card .status-text.approved { color: #059669; background: var(--green-bg); }
  .leave-card .status-text.rejected { color: var(--red); background: var(--red-bg); }
  .leave-card .status-text.canceled { color: var(--gray); background: var(--gray-bg); }

  /* ============ Tab 4: 工作台 ============ */
  .welcome-card {
    margin: 16px;
    padding: 20px;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--primary) 0%, #6D5DF5 100%);
    color: #fff;
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 28px rgba(79,110,247,.3);
  }
  .welcome-card::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 140px; height: 140px;
    border-radius: 50%;
    background: rgba(255,255,255,.12);
  }
  .welcome-card::after {
    content: '';
    position: absolute;
    bottom: -50px; right: 30px;
    width: 90px; height: 90px;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
  }
  .welcome-card .greet { font-size: 13px; opacity: .85; margin-bottom: 4px; position: relative; }
  .welcome-card .title { font-size: 22px; font-weight: 800; position: relative; }
  .welcome-card .sub { font-size: 13px; opacity: .85; margin-top: 6px; position: relative; }

  .section-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    padding: 4px 16px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .section-title .more { font-size: 12px; color: var(--text-tertiary); font-weight: 400; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    padding: 0 16px 8px;
  }
  .stat-card {
    background: var(--card);
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .stat-card .icon-circle {
    width: 34px; height: 34px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    margin-bottom: 8px;
  }
  .stat-card .num {
    font-size: 24px;
    font-weight: 800;
    color: var(--text);
    line-height: 1;
  }
  .stat-card .lbl {
    font-size: 12.5px;
    color: var(--text-secondary);
    margin-top: 4px;
  }
  .stat-card .trend {
    position: absolute;
    top: 14px; right: 14px;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 6px;
  }
  .stat-card .trend.up { color: #059669; background: var(--green-bg); }
  .stat-card .trend.down { color: var(--red); background: var(--red-bg); }

  .ai-stat-card {
    margin: 8px 16px 4px;
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .ai-stat-card .head {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 14px;
  }
  .ai-stat-card .head .badge {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--primary) 0%, #7B5CF5 100%);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .ai-stat-card .head .t { font-size: 14px; font-weight: 700; }
  .ai-stat-card .head .month { margin-left: auto; font-size: 12px; color: var(--text-tertiary); }
  .ai-stat-card .row {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-bottom: 12px;
  }
  .ai-stat-card .row:last-child { margin-bottom: 0; }
  .ai-stat-card .row .v { font-size: 20px; font-weight: 800; color: var(--text); }
  .ai-stat-card .row .v .unit { font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-left: 2px; }
  .ai-stat-card .row .l { font-size: 12.5px; color: var(--text-secondary); }
  .ai-stat-card .progress {
    height: 6px;
    background: var(--gray-bg);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 6px;
  }
  .ai-stat-card .progress .pf {
    height: 100%;
    background: linear-gradient(90deg, var(--primary) 0%, #7B5CF5 100%);
    border-radius: 4px;
  }

  .quick-actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 0 16px 8px;
  }
  .qa-item {
    background: var(--card);
    border-radius: 14px;
    padding: 14px 8px;
    text-align: center;
    box-shadow: var(--shadow);
    transition: transform .15s;
  }
  .qa-item:active { transform: scale(.95); }
  .qa-item .ic {
    width: 40px; height: 40px;
    border-radius: 12px;
    margin: 0 auto 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .qa-item .ic.blue { background: var(--primary-bg); color: var(--primary); }
  .qa-item .ic.green { background: var(--green-bg); color: #059669; }
  .qa-item .ic.yellow { background: var(--yellow-bg); color: #D97706; }
  .qa-item .lbl { font-size: 12.5px; color: var(--text); font-weight: 500; }

  /* ============ 底部 Tab 栏 ============ */
  .tab-bar {
    height: 72px;
    flex-shrink: 0;
    display: flex;
    background: var(--card);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom, 0);
    position: relative;
    z-index: 20;
    box-shadow: 0 -4px 20px rgba(16,24,40,.04);
  }
  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    color: var(--text-tertiary);
    transition: color .2s;
    position: relative;
  }
  .tab-item .ic {
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    transition: transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .tab-item .ic svg { width: 22px; height: 22px; }
  .tab-item .lbl {
    font-size: 10.5px;
    font-weight: 500;
  }
  .tab-item.active { color: var(--primary); }
  .tab-item.active .ic { transform: translateY(-2px) scale(1.1); }
  .tab-item.active::before {
    content: '';
    position: absolute;

<script>
(function(){
  'use strict';

  // ============ Mock 数据 ============
  var initialMessages = [
    { role: 'ai', text: '你好，王老师 👋 我是 ClassAI 助手，可以帮你快速记录学生行为、处理请假申请。\n\n试试对我说："张涵今天早读迟到，8:05才到教室"' },

    { role: 'ai', text: '✅ 已创建 1 条行为记录\n• 张涵：已关联\n事件类型：违纪\n发生时间：2026-06-17 08:05\n详情：早读迟到，8:05才到教室\n置信度：95%' },

  var recordsData = [
    { student: '张涵', avatar: '张', type: '违纪', detail: '早读迟到，8:05才到教室', time: '2026-06-17 08:05', confidence: 95 },
    { student: '李明', avatar: '李', type: '表扬', detail: '主动打扫教室卫生，整理图书角', time: '2026-06-16 16:30', confidence: 98 },
    { student: '王思雨', avatar: '王', type: '违纪', detail: '上课玩手机，被巡课老师发现', time: '2026-06-16 10:20', confidence: 92 },
    { student: '陈晓', avatar: '陈', type: '表扬', detail: '数学月考满分，主动帮助同学解题', time: '2026-06-15 14:00', confidence: 99 },
    { student: '赵磊', avatar: '赵', type: '其他', detail: '早退请假去医院复查', time: '2026-06-15 09:15', confidence: 88 },
    { student: '刘洋', avatar: '刘', type: '违纪', detail: '课间在走廊追逐打闹，影响秩序', time: '2026-06-14 10:05', confidence: 90 }
  ];

  var leaveData = [
    { id: 1, student: '李明', avatar: '李', status: 'pending', type: '病假', range: '2026-06-17 08:00 至 2026-06-18 18:00', reason: '发烧需要去医院，医生建议休息一天观察' },
    { id: 2, student: '赵磊', avatar: '赵', status: 'pending', type: '事假', range: '2026-06-17 14:00 至 2026-06-17 17:00', reason: '家中临时有事，需提前离校处理' },
    { id: 3, student: '孙佳', avatar: '孙', status: 'pending', type: '病假', range: '2026-06-18 08:00 至 2026-06-19 18:00', reason: '感冒发烧，需在家休养' },
    { id: 4, student: '周婷', avatar: '周', status: 'approved', type: '事假', range: '2026-06-15 08:00 至 2026-06-15 12:00', reason: '参加市级书法比赛' },
    { id: 5, student: '吴昊', avatar: '吴', status: 'approved', type: '病假', range: '2026-06-14 08:00 至 2026-06-15 18:00', reason: '肠胃炎，医生建议休息两天' },
    { id: 6, student: '张涵', avatar: '张', status: 'canceled', type: '病假', range: '2026-06-17 08:00 至 2026-06-18 18:00', reason: '发烧请假，已于 14:30 销假返校' },
    { id: 7, student: '郑欣', avatar: '郑', status: 'canceled', type: '事假', range: '2026-06-13 08:00 至 2026-06-13 17:00', reason: '家中有事，后改期处理已销假' }
  ];

  // ============ 工具函数 ============
  function $(s, ctx){ return (ctx||document).querySelector(s); }
  function $all(s, ctx){ return Array.prototype.slice.call((ctx||document).querySelectorAll(s)); }
  function esc(str){ return String(str).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // ============ Tab 切换 ============
  var tabTitles = { chat: 'ClassAI 助手', record: '行为记录', leave: '请假管理', work: '工作台' };
  $all('.tab-item').forEach(function(tab){
    tab.addEventListener('click', function(){
      var name = tab.getAttribute('data-tab');
      $all('.tab-item').forEach(function(t){ t.classList.remove('active'); });
      tab.classList.add('active');
      $all('.panel').forEach(function(p){ p.classList.remove('active'); });
      $('#panel-' + name).classList.add('active');
      $('#topTitle').textContent = tabTitles[name];
    });
  });

  // ============ Tab 1: AI 助手 ============
  var chatMessages = $('#chatMessages');
  var chatInput = $('#chatInput');
  var sendBtn = $('#sendBtn');
  var messages = initialMessages.slice();
  var isThinking = false;

  function renderMessages(){
    chatMessages.innerHTML = '';
    messages.forEach(function(m){
      var div = document.createElement('div');
      div.className = 'msg ' + m.role;
      var avatar = m.role === 'ai' ? 'AI' : '我';
      div.innerHTML = '<div class="avatar">' + avatar + '</div>' +
        '<div class="bubble">' + formatBubble(m.text) + '</div>';
      chatMessages.appendChild(div);
    });
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function formatBubble(text){
    // 高亮 ✅ 开头的确认行
    return esc(text).replace(/^✅.+$/gm, function(line){
      return '<span class="confirm-line">' + line + '</span>';
    });
  }

  function appendMessage(m){
    messages.push(m);
    var div = document.createElement('div');
    div.className = 'msg ' + m.role;
    var avatar = m.role === 'ai' ? 'AI' : '我';
    div.innerHTML = '<div class="avatar">' + avatar + '</div>' +
      '<div class="bubble">' + formatBubble(m.text) + '</div>';
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function showThinking(){
    var div = document.createElement('div');
    div.className = 'msg ai';
    div.id = 'thinkingMsg';
    div.innerHTML = '<div class="avatar">AI</div>' +
      '<div class="bubble"><div class="thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>';
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }
  function removeThinking(){
    var t = $('#thinkingMsg');
    if (t) t.remove();
  }

  // AI 意图识别（关键词匹配）
  function aiReply(input){
    var txt = input.toLowerCase();
    var now = new Date();
    var pad = function(n){ return n < 10 ? '0' + n : '' + n; };
    var today = '2026-06-17';
    var timeStr = pad(now.getHours()) + ':' + pad(now.getMinutes());

    // 销假
    if (/(返校|销假|回来|回校)/.test(txt)) {
      var stu = extractName(input) || '该学生';
      return '✅ 已处理 1 个销假申请\n• ' + stu + '：已销假\n销假时间：' + today + ' ' + timeStr;
    }
    // 请假
    if (/(请假|病假|事假|发烧|生病|不舒服|去医院|家里有事)/.test(txt)) {
      var stu2 = extractName(input) || '该学生';
      var isSick = /(病假|发烧|生病|不舒服|去医院|感冒|咳嗽)/.test(txt);
      var type = isSick ? '病假' : '事假';
      var reason = extractReason(input) || (isSick ? '身体不适需要就医' : '个人事务');
      return '✅ 已创建 1 条请假申请\n• ' + stu2 + '：已关联\n请假类型：' + type + '\n时间：' + today + ' 08:00 至 ' + today + ' 18:00\n原因：' + reason;
    }
    // 行为记录
    if (/(迟到|早退|违纪|表扬|玩手机|打扫|打闹|作弊|旷课|说话|睡觉)/.test(txt)) {
      var stu3 = extractName(input) || '该学生';
      var isPraise = /(表扬|表现好|满分|主动|优秀)/.test(txt);
      var etype = isPraise ? '表扬' : '违纪';
      var conf = 88 + Math.floor(Math.random() * 11);
      return '✅ 已创建 1 条行为记录\n• ' + stu3 + '：已关联\n事件类型：' + etype + '\n发生时间：' + today + ' ' + timeStr + '\n详情：' + input + '\n置信度：' + conf + '%';
    }
    // 帮助
    if (/(帮助|怎么|如何|格式|示例)/.test(txt)) {
      return '💡 我可以帮你处理以下事务：\n\n1️⃣ 行为记录\n示例："张涵今天早读迟到，8:05才到教室"\n关键词：迟到、早退、违纪、表扬、玩手机、打扫\n\n2️⃣ 请假申请\n示例："李明生病请假，今天到明天，发烧需要去医院"\n关键词：请假、病假、事假、发烧、生病\n\n3️⃣ 销假处理\n示例："张涵已返校"\n关键词：返校、销假、回来';
    }
    // 默认引导
    return '🤔 我还没完全理解您的需求。您可以尝试：\n\n• 记录学生行为："张涵迟到"\n• 处理请假："李明病假"\n• 销假："张涵已返校"\n\n或点击下方「帮助」查看完整格式说明。';
  }

  // 简单提取学生姓名（取前 2-3 个中文字符）
  function extractName(input){
    var m = input.match(/([\u4e00-\u9fa5]{2,3})(?:今天|生病|请假|迟到|早退|已|返校|销假|发烧|同学)/);
    if (m) return m[1];
    var m2 = input.match(/^([\u4e00-\u9fa5]{2,3})/);
    if (m2) return m2[1];
    return null;
  }
  function extractReason(input){
    var m = input.match(/(?:因为|原因是|，)(.+)/);
    if (m) return m[1].trim();
    // 取"请假"后的内容
    var m2 = input.match(/请假[，,]?\s*(.+)/);
    if (m2) return m2[1].trim();
    return null;
  }

  function sendMessage(){
    if (isThinking) return;
    var text = chatInput.value.trim();
    if (!text) return;
    appendMessage({ role: 'user', text: text });
    chatInput.value = '';
    autoResize();
    isThinking = true;
    sendBtn.disabled = true;
    showThinking();
    setTimeout(function(){
      removeThinking();
      var reply = aiReply(text);
      appendMessage({ role: 'ai', text: reply });
      isThinking = false;
      sendBtn.disabled = false;
    }, 900 + Math.random() * 600);
  }

  sendBtn.addEventListener('click', sendMessage);
  chatInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function autoResize(){
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 80) + 'px';
  }
  chatInput.addEventListener('input', autoResize);

  // 快捷按钮
  $all('.quick-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var type = btn.getAttribute('data-quick');
      var text = '';
      if (type === 'leave') {
        text = '李明生病请假，今天到明天，发烧需要去医院';
      } else if (type === 'record') {
        text = '张涵今天早读迟到，8:05才到教室';
      } else if (type === 'help') {
        text = '帮助';
      }
      chatInput.value = text;
      autoResize();
      chatInput.focus();
    });
  });

  renderMessages();

  // ============ Tab 2: 行为记录 ============
  var currentFilter = 'all';
  function renderRecords(){
    var list = $('#recordList');
    var data = currentFilter === 'all' ? recordsData : recordsData.filter(function(r){ return r.type === currentFilter; });
    if (!data.length) {
      list.innerHTML = '<div class="empty">暂无相关记录</div>';
      return;
    }
    list.innerHTML = data.map(function(r, i){
      var tagClass = r.type === '违纪' ? 'red' : (r.type === '表扬' ? 'green' : 'gray');
      return '<div class="record-card" style="animation-delay:' + (i * 0.05) + 's;">' +
        '<div class="head">' +
          '<div class="student">' +
            '<div class="avatar-sm">' + esc(r.avatar) + '</div>' +
            '<div class="name">' + esc(r.student) + '</div>' +
          '</div>' +
          '<div class="tag ' + tagClass + '">' + esc(r.type) + '</div>' +
        '</div>' +
        '<div class="detail">' + esc(r.detail) + '</div>' +
        '<div class="meta">' +
          '<div class="time">🕐 ' + esc(r.time) + '</div>' +
        '</div>' +
        '<div class="confidence">' +
          '<span class="label">AI 置信度</span>' +
          '<div class="bar"><div class="fill" style="width:' + r.confidence + '%;"></div></div>' +
          '<span class="val">' + r.confidence + '%</span>' +
        '</div>' +
      '</div>';
    }).join('');
  }
  $all('.filter-tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      $all('.filter-tab').forEach(function(t){ t.classList.remove('active'); });
      tab.classList.add('active');
      currentFilter = tab.getAttribute('data-filter');
      renderRecords();
    });
  });
  renderRecords();

  // ============ Tab 3: 请假管理 ============
  function renderLeaves(){
    var list = $('#leaveList');
    list.innerHTML = leaveData.map(function(l, i){
      var statusTag = '';
      var actions = '';
      if (l.status === 'pending') {
        statusTag = '<div class="tag yellow">待审批</div>';
        actions = '<div class="actions">' +
          '<button class="act-btn reject" data-act="reject" data-id="' + l.id + '">驳回</button>' +
          '<button class="act-btn approve" data-act="approve" data-id="' + l.id + '">批准</button>' +
        '</div>';
      } else if (l.status === 'approved') {
        statusTag = '<div class="tag green">已批准</div>';
        actions = '<div class="status-text approved">✓ 已批准</div>';
      } else if (l.status === 'rejected') {
        statusTag = '<div class="tag red">已驳回</div>';
        actions = '<div class="status-text rejected">已驳回</div>';
      } else if (l.status === 'canceled') {
        statusTag = '<div class="tag gray">已销假</div>';
        actions = '<div class="status-text canceled">已销假</div>';
      }
      return '<div class="leave-card" style="animation-delay:' + (i * 0.05) + 's;">' +
        '<div class="head">' +
          '<div class="student">' +
            '<div class="avatar-sm">' + esc(l.avatar) + '</div>' +
            '<div class="name">' + esc(l.student) + '</div>' +
          '</div>' +
          statusTag +
        '</div>' +
        '<div class="type-row"><span class="type-badge">' + esc(l.type) + '</span></div>' +
        '<div class="time-range">🕐 ' + esc(l.range) + '</div>' +
        '<div class="reason">' + esc(l.reason) + '</div>' +
        actions +
      '</div>';
    }).join('');

    // 绑定按钮
    $all('.act-btn', list).forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = parseInt(btn.getAttribute('data-id'), 10);
        var act = btn.getAttribute('data-act');
        var item = leaveData.filter(function(x){ return x.id === id; })[0];
        if (!item) return;
        if (act === 'approve') {
          item.status = 'approved';
        } else {
          item.status = 'rejected';
        }
        updateLeaveStats();
        renderLeaves();
      });
    });
  }
  function updateLeaveStats(){
    var pending = leaveData.filter(function(l){ return l.status === 'pending'; }).length;
    var approved = leaveData.filter(function(l){ return l.status === 'approved'; }).length;
    var canceled = leaveData.filter(function(l){ return l.status === 'canceled'; }).length;
    $('#statPending').textContent = pending;
    $('#statApproved').textContent = approved;
    $('#statCanceled').textContent = canceled;
  }
  renderLeaves();

})();
</script>
</body>
</html>
