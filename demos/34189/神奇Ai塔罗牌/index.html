<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI塔罗牌 - 神秘占卜</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- 阶段1: 问题输入 -->
        <div id="input-phase" class="phase active">
            <h1 class="title">✨ AI塔罗牌 ✨</h1>
            <p class="subtitle">开启你的神秘之旅</p>
            
            <div class="question-section">
                <label for="question-input" class="question-label">请输入你的问题：</label>
                <textarea 
                    id="question-input" 
                    class="question-input" 
                    placeholder="例如：我最近的财运如何？"
                    rows="3"
                ></textarea>
                <div class="suggested-questions" id="suggested-questions">
                    <div class="suggested-title">参考问题</div>
                    <div class="suggested-list" id="suggested-list">
                        <span class="suggested-item suggested-loading">正在为你生成...</span>
                    </div>
                </div>
                <button id="submit-question" class="btn btn-image">
                    <img src="images/LiJiTaLuo.png" alt="立即塔罗">
                </button>
            </div>
        </div>

        <!-- 阶段2: 卡片选择 -->
        <div id="selection-phase" class="phase">
            <div class="question-display">
                <p class="question-text">你的问题：<span id="display-question"></span></p>
            </div>

            <h2 class="phase-title">请选择1张卡片</h2>
            
            <div class="cards-container" id="cards-container">
                <!-- 5张卡片将通过JS动态生成 -->
            </div>

            <div class="selection-info">
                <p>已选择: <span id="selected-count">0</span>/1</p>
            </div>

            <button id="reveal-btn" class="btn btn-image btn-disabled" disabled>
                <img src="images/QueDing.png" alt="确定">
            </button>
        </div>

        <!-- 阶段3: 结果展示 -->
        <div id="result-phase" class="phase">
            <h2 class="result-title">占卜结果</h2>
            
            <div class="result-wrapper">
                <div class="result-left">
                    <div class="question-display">
                        <p class="question-text">你的问题：<span id="final-question"></span></p>
                    </div>

                    <div class="result-card-container" id="result-card-container">
                        <!-- 结果卡片将通过JS动态生成 -->
                    </div>
                </div>

                <div class="result-right">
                    <div class="ai-explanation" id="ai-explanation">
                        <h3>AI解读</h3>
                        <div class="explanation-content" id="explanation-content"></div>
                    </div>
                </div>
            </div>

            <button id="restart-btn" class="btn btn-secondary">
                重新占卜
            </button>
        </div>

        <!-- 阶段4: 历史记录 -->
        <div id="history-phase" class="phase">
            <h2 class="result-title">今日占卜记录</h2>
            <p class="history-subtitle">你今日的占卜次数已用完，明天再来试试吧～</p>
            <div class="history-container" id="history-container">
                <!-- 历史记录将通过JS动态生成 -->
            </div>
            <button id="restart-btn-history" class="btn btn-secondary">
                重新开始
            </button>
        </div>
    </div>

    <script src="assets/tarot-decoder.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
