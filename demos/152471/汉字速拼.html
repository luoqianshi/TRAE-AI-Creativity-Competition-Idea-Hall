<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汉字速拼 —— 中文转拼音工具</title>
    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.18.5/dist/index.js" onerror="document.getElementById('loadError').style.display='block'"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-primary: #1E293B;
            --text-secondary: #64748B;
            --border-color: #E2E8F0;
            --success-color: #10B981;
            --warning-color: #F59E0B;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px 30px;
            background: linear-gradient(135deg, var(--primary-color) 0%, #7C3AED 100%);
            border-radius: 16px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(79, 70, 229, 0.3);
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .card-header .icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background-color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
        }

        .card-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
            background-color: #F8FAFC;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .preview-area {
            min-height: 200px;
            padding: 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            line-height: 2;
            background-color: #F8FAFC;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .preview-area .char-item {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            margin: 4px;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: background-color 0.2s;
            position: relative;
        }

        .preview-area .char-item:hover {
            background-color: #E0E7FF;
        }

        .preview-area .char-item .char {
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .preview-area .char-item .pinyin {
            font-size: 0.9rem;
            color: var(--primary-color);
            text-align: center;
        }

        .preview-area .char-item.has-options .pinyin {
            text-decoration: underline;
            color: var(--warning-color);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        label {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        select, button {
            padding: 10px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
        }

        select:focus, button:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            font-weight: 500;
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background-color: white;
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        button.secondary:hover {
            background-color: var(--bg-color);
        }

        button.success {
            background-color: var(--success-color);
            border-color: var(--success-color);
        }

        button.success:hover {
            background-color: #059669;
        }

        .tone-options {
            display: flex;
            gap: 8px;
        }

        .tone-option {
            padding: 8px 14px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            background-color: white;
        }

        .tone-option.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .tone-option:hover {
            border-color: var(--primary-color);
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 24px;
        }

        .stats {
            display: flex;
            gap: 24px;
            margin-bottom: 16px;
            padding: 12px;
            background-color: #F1F5F9;
            border-radius: 8px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-item .stat-value {
            font-weight: 700;
            color: var(--primary-color);
            font-size: 1.1rem;
        }

        .stat-item .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            z-index: 100;
            min-width: 120px;
            overflow: hidden;
            margin-top: 4px;
        }

        .dropdown-menu button {
            display: block;
            width: 100%;
            padding: 10px 14px;
            text-align: left;
            border: none;
            background: none;
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: background-color 0.2s;
        }

        .dropdown-menu button:hover {
            background-color: #F1F5F9;
            color: var(--primary-color);
        }

        .dropdown-menu button.active {
            background-color: #E0E7FF;
            color: var(--primary-color);
            font-weight: 500;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-secondary);
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.95rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
        }

        .footer {
            text-align: center;
            padding: 24px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .sample-text {
            margin-top: 12px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .sample-text span {
            cursor: pointer;
            color: var(--primary-color);
            text-decoration: underline;
        }

        .sample-text span:hover {
            color: var(--primary-hover);
        }

        .load-error {
            display: none;
            background-color: #FEF2F2;
            border: 1px solid #FECACA;
            color: #DC2626;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>汉字速拼</h1>
            <p>中文转拼音工具 —— 智能多音字识别，一键批量导出</p>
        </header>

        <div id="loadError" class="load-error">
            <strong>⚠️ 拼音库加载失败</strong>
            <p>请检查网络连接，或刷新页面重试。</p>
        </div>

        <div class="controls">
            <div class="tone-options">
                <div class="tone-option active" data-tone="symbol">声调符号</div>
                <div class="tone-option" data-tone="num">数字声调</div>
                <div class="tone-option" data-tone="none">无声调</div>
            </div>
            <div class="control-group">
                <label>分隔符:</label>
                <select id="separator">
                    <option value=" ">空格</option>
                    <option value="-">连字符</option>
                    <option value=",">逗号</option>
                    <option value="|">竖线</option>
                    <option value="">无</option>
                </select>
            </div>
            <div class="control-group">
                <label>样式:</label>
                <select id="style">
                    <option value="char-pinyin">字+拼音</option>
                    <option value="pinyin-only">仅拼音</option>
                    <option value="char-with-pinyin">字(拼音)</option>
                </select>
            </div>
        </div>

        <div class="main-content">
            <div class="card">
                <div class="card-header">
                    <div class="icon">✏️</div>
                    <h2>输入文字</h2>
                </div>
                <textarea id="inputText" placeholder="请输入需要转换的中文文字...&#10;&#10;示例：&#10;春眠不觉晓，处处闻啼鸟。&#10;白日依山尽，黄河入海流。"></textarea>
                <div class="sample-text">快速体验：点击使用示例文本 <span id="useSample">📝 加载示例</span></div>
            </div>

            <div class="card">
                <div class="card-header">
                    <div class="icon">📊</div>
                    <h2>拼音预览</h2>
                </div>
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-value" id="charCount">0</span>
                        <span class="stat-label">汉字数</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="pinyinCount">0</span>
                        <span class="stat-label">拼音数</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="polyCount">0</span>
                        <span class="stat-label">多音字</span>
                    </div>
                </div>
                <div class="preview-area" id="previewArea">
                    <div class="empty-state">
                        <div class="icon">📄</div>
                        <div>请在左侧输入文字</div>
                        <div>点击多音字可手动选择读音</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <button id="copyBtn">📋 复制拼音</button>
            <button id="copyFullBtn">📋 复制完整内容</button>
            <button id="exportTxtBtn">📥 导出TXT</button>
            <button id="exportCsvBtn">📥 导出CSV</button>
            <button id="clearBtn" class="secondary">🗑️ 清空内容</button>
        </div>

        <div class="footer">
            <p>汉字速拼 · 智能中文转拼音工具 | 支持多音字识别、声调切换、批量导出</p>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let pinyinPro = null;

        function loadPinyinPro() {
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/pinyin-pro@3.18.5/dist/index.js';
            script.onload = () => {
                pinyinPro = window.pinyinPro;
                initApp();
            };
            script.onerror = () => {
                document.getElementById('loadError').style.display = 'block';
            };
            document.head.appendChild(script);
        }

        function initApp() {
            const inputText = document.getElementById('inputText');
            const previewArea = document.getElementById('previewArea');
            const charCount = document.getElementById('charCount');
            const pinyinCount = document.getElementById('pinyinCount');
            const polyCount = document.getElementById('polyCount');
            const copyBtn = document.getElementById('copyBtn');
            const copyFullBtn = document.getElementById('copyFullBtn');
            const exportTxtBtn = document.getElementById('exportTxtBtn');
            const exportCsvBtn = document.getElementById('exportCsvBtn');
            const clearBtn = document.getElementById('clearBtn');
            const separatorSelect = document.getElementById('separator');
            const styleSelect = document.getElementById('style');
            const toneOptions = document.querySelectorAll('.tone-option');
            const useSample = document.getElementById('useSample');
            const toast = document.getElementById('toast');

            let currentTone = 'symbol';
            let customPinyins = {};

            const sampleText = `春眠不觉晓，处处闻啼鸟。
白日依山尽，黄河入海流。
床前明月光，疑是地上霜。
举头望明月，低头思故乡。

行万里路，读万卷书。
重要的事情说三遍。
长(cháng)江长江，我是黄河。`;

            useSample.addEventListener('click', () => {
                inputText.value = sampleText;
                convertText();
            });

            toneOptions.forEach(option => {
                option.addEventListener('click', () => {
                    toneOptions.forEach(opt => opt.classList.remove('active'));
                    option.classList.add('active');
                    currentTone = option.dataset.tone;
                    convertText();
                });
            });

            separatorSelect.addEventListener('change', convertText);
            styleSelect.addEventListener('change', convertText);

            inputText.addEventListener('input', convertText);

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function getToneType() {
            switch (currentTone) {
                case 'symbol': return 'symbol';
                case 'num': return 'num';
                case 'none': return 'none';
                default: return 'symbol';
            }
        }

        function getPinyinOptions() {
            return {
                toneType: getToneType(),
                type: 'string',
                nonZh: 'consecutive',
                polyphone: true
            };
        }

        function hasMultipleOptions(char) {
            try {
                const result = pinyinPro.polyphonic(char);
                if (Array.isArray(result) && result.length > 0) {
                    const pinyins = result[0].split(' ');
                    return pinyins.length > 1;
                }
                return false;
            } catch {
                return false;
            }
        }

        function getAllPinyinOptions(char) {
            try {
                const result = pinyinPro.polyphonic(char);
                if (Array.isArray(result) && result.length > 0) {
                    return result[0].split(' ');
                }
                return [];
            } catch {
                return [];
            }
        }

        function convertText() {
            const text = inputText.value;
            if (!text.trim()) {
                previewArea.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📄</div>
                        <div>请在左侧输入文字</div>
                        <div>点击多音字可手动选择读音</div>
                    </div>
                `;
                charCount.textContent = '0';
                pinyinCount.textContent = '0';
                polyCount.textContent = '0';
                customPinyins = {};
                return;
            }

            const options = getPinyinOptions();
            const style = styleSelect.value;
            const separator = separatorSelect.value;

            let html = '';
            let charNum = 0;
            let pinyinNum = 0;
            let polyNum = 0;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];

                if (/[\u4e00-\u9fa5]/.test(char)) {
                    charNum++;
                    let pinyin;

                    if (customPinyins[`${char}-${i}`]) {
                        pinyin = customPinyins[`${char}-${i}`];
                    } else {
                        try {
                            pinyin = pinyinPro.pinyin(char, options);
                        } catch {
                            pinyin = char;
                        }
                    }

                    pinyinNum++;
                    const hasOptions = hasMultipleOptions(char);
                    if (hasOptions) polyNum++;

                    const optionsList = hasOptions ? getAllPinyinOptions(char) : [];

                    if (style === 'char-pinyin') {
                        html += `<span class="char-item ${hasOptions ? 'has-options' : ''}" data-index="${i}" data-char="${char}">`;
                        html += `<span class="char">${char}</span>`;
                        html += `<span class="pinyin">${pinyin}</span>`;
                        if (hasOptions) {
                            html += `<div class="dropdown-menu" style="display:none;">`;
                            optionsList.forEach(opt => {
                                html += `<button data-pinyin="${opt}" ${opt === pinyin ? 'class="active"' : ''}>${opt}</button>`;
                            });
                            html += `</div>`;
                        }
                        html += `</span>`;
                    } else if (style === 'pinyin-only') {
                        html += `<span>${pinyin}${separator}</span>`;
                    } else {
                        html += `<span>${char}(${pinyin})${separator}</span>`;
                    }
                } else if (char === '\n') {
                    html += '<br>';
                } else {
                    if (style === 'pinyin-only') {
                        html += `<span>${char}</span>`;
                    } else {
                        html += `<span style="margin:4px;">${char}</span>`;
                    }
                }
            }

            previewArea.innerHTML = html;
            charCount.textContent = charNum;
            pinyinCount.textContent = pinyinNum;
            polyCount.textContent = polyNum;

            attachDropdownEvents();
        }

        function attachDropdownEvents() {
            const charItems = document.querySelectorAll('.char-item');
            
            charItems.forEach(item => {
                item.removeEventListener('click', toggleDropdown);
                item.addEventListener('click', toggleDropdown);
                
                const dropdown = item.querySelector('.dropdown-menu');
                if (dropdown) {
                    const buttons = dropdown.querySelectorAll('button');
                    buttons.forEach(btn => {
                        btn.removeEventListener('click', handlePinyinSelect);
                        btn.addEventListener('click', handlePinyinSelect);
                    });
                }
            });

            document.removeEventListener('click', closeDropdowns);
            document.addEventListener('click', closeDropdowns);
        }

        function toggleDropdown(e) {
            e.stopPropagation();
            const dropdown = this.querySelector('.dropdown-menu');
            if (dropdown) {
                document.querySelectorAll('.dropdown-menu').forEach(d => {
                    if (d !== dropdown) d.style.display = 'none';
                });
                dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
            }
        }

        function handlePinyinSelect(e) {
            e.stopPropagation();
            const btn = e.target;
            const pinyin = btn.dataset.pinyin;
            const charItem = btn.closest('.char-item');
            const index = charItem.dataset.index;
            const char = charItem.dataset.char;
            const dropdown = charItem.querySelector('.dropdown-menu');
            
            customPinyins[`${char}-${index}`] = pinyin;
            
            charItem.querySelector('.pinyin').textContent = pinyin;
            dropdown.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            dropdown.style.display = 'none';
        }

        function closeDropdowns(e) {
            if (!e.target.closest('.char-item')) {
                document.querySelectorAll('.dropdown-menu').forEach(d => {
                    d.style.display = 'none';
                });
            }
        }

        function getPlainPinyin() {
            const text = inputText.value;
            const options = getPinyinOptions();
            const separator = separatorSelect.value;
            let result = '';

            for (let i = 0; i < text.length; i++) {
                const char = text[i];

                if (/[\u4e00-\u9fa5]/.test(char)) {
                    let pinyin = customPinyins[`${char}-${i}`] || pinyinPro.pinyin(char, options);
                    result += pinyin + separator;
                } else {
                    result += char;
                }
            }

            return result;
        }

        function getFullText() {
            const text = inputText.value;
            const options = getPinyinOptions();
            const separator = separatorSelect.value;
            let result = '';

            for (let i = 0; i < text.length; i++) {
                const char = text[i];

                if (/[\u4e00-\u9fa5]/.test(char)) {
                    let pinyin = customPinyins[`${char}-${i}`] || pinyinPro.pinyin(char, options);
                    result += `${char}(${pinyin})${separator}`;
                } else {
                    result += char;
                }
            }

            return result;
        }

        copyBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(getPlainPinyin());
                showToast('拼音已复制到剪贴板');
            } catch {
                showToast('复制失败，请手动复制');
            }
        });

        copyFullBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(getFullText());
                showToast('完整内容已复制到剪贴板');
            } catch {
                showToast('复制失败，请手动复制');
            }
        });

        exportTxtBtn.addEventListener('click', () => {
            const content = getPlainPinyin();
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `拼音转换结果_${new Date().toLocaleDateString()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('TXT文件已导出');
        });

        exportCsvBtn.addEventListener('click', () => {
            const text = inputText.value;
            const options = getPinyinOptions();
            let csv = '汉字,拼音\n';

            for (let i = 0; i < text.length; i++) {
                const char = text[i];

                if (/[\u4e00-\u9fa5]/.test(char)) {
                    let pinyin = customPinyins[`${char}-${i}`] || pinyinPro.pinyin(char, options);
                    csv += `${char},${pinyin}\n`;
                }
            }

            const blob = new Blob([`\uFEFF${csv}`], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `拼音转换结果_${new Date().toLocaleDateString()}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('CSV文件已导出');
        });

        clearBtn.addEventListener('click', () => {
            inputText.value = '';
            customPinyins = {};
            convertText();
            showToast('内容已清空');
        });

        inputText.focus();
        }

        loadPinyinPro();
    </script>
</body>
</html>
