<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI合同审查助手 - 让每个人都能看懂合同</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; background: #f5f7fa; min-height: 100vh; }
        .container { max-width: 1000px; margin: 0 auto; background: white; min-height: 100vh; box-shadow: 0 0 30px rgba(0,0,0,0.05); }
        
        .header { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); padding: 40px 30px; text-align: center; }
        .logo { font-size: 64px; margin-bottom: 15px; }
        .title { font-size: 36px; color: white; font-weight: bold; margin-bottom: 10px; }
        .subtitle { font-size: 18px; color: rgba(255,255,255,0.8); }
        
        .main-content { padding: 30px; }
        
        .section { margin-bottom: 30px; }
        .section-title { font-size: 24px; color: #333; font-weight: bold; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .section-icon { font-size: 28px; }
        
        .upload-area { border: 3px dashed #ddd; border-radius: 16px; padding: 40px; text-align: center; cursor: pointer; transition: all 0.3s; background: #fafafa; }
        .upload-area:hover { border-color: #2a5298; background: #f0f4f8; }
        .upload-icon { font-size: 64px; margin-bottom: 20px; color: #999; }
        .upload-text { font-size: 22px; color: #666; margin-bottom: 15px; }
        .upload-btn { display: inline-block; padding: 15px 30px; background: #2a5298; color: white; border-radius: 8px; font-size: 18px; cursor: pointer; }
        
        .template-selector { display: flex; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
        .template-btn { flex: 1; min-width: 200px; padding: 20px; border: 2px solid #ddd; border-radius: 12px; cursor: pointer; transition: all 0.3s; text-align: center; background: white; }
        .template-btn:hover { border-color: #2a5298; background: #f0f4f8; }
        .template-icon { font-size: 32px; margin-bottom: 10px; }
        .template-name { font-size: 18px; font-weight: bold; color: #333; }
        
        .scan-progress { display: none; padding: 30px; background: #f8f9fa; border-radius: 12px; }
        .progress-bar { height: 10px; background: #e9ecef; border-radius: 5px; overflow: hidden; margin-bottom: 20px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #2a5298, #6dd5ed); width: 0%; transition: width 0.5s; }
        .scan-status { font-size: 20px; color: #666; text-align: center; }
        .scan-dots { animation: dot 1s infinite; }
        @keyframes dot { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        
        .contract-content { background: white; border: 1px solid #ddd; border-radius: 12px; padding: 25px; margin-bottom: 20px; }
        .contract-title { font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 25px; color: #333; }
        .contract-text { font-size: 18px; line-height: 2; color: #444; }
        .risk-highlight-red { background: #ffebee; border-left: 4px solid #f44336; padding: 8px 12px; margin: 8px 0; border-radius: 4px; }
        .risk-highlight-yellow { background: #fff8e1; border-left: 4px solid #ff9800; padding: 8px 12px; margin: 8px 0; border-radius: 4px; }
        .risk-highlight-green { background: #e8f5e9; border-left: 4px solid #4caf50; padding: 8px 12px; margin: 8px 0; border-radius: 4px; }
        
        .risk-card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .risk-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .risk-title { font-size: 20px; font-weight: bold; color: #333; }
        .risk-level { padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; }
        .level-high { background: #ffebee; color: #f44336; }
        .level-medium { background: #fff8e1; color: #ff9800; }
        .level-low { background: #e8f5e9; color: #4caf50; }
        .risk-desc { font-size: 16px; color: #666; margin-bottom: 10px; }
        .risk-suggest { font-size: 16px; color: #2a5298; font-weight: bold; }
        
        .report-box { background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); border-radius: 16px; padding: 30px; border: 2px solid #dee2e6; }
        .report-title { font-size: 28px; font-weight: bold; text-align: center; margin-bottom: 25px; color: #333; }
        .report-summary { display: flex; justify-content: space-around; margin-bottom: 30px; }
        .summary-item { text-align: center; }
        .summary-number { font-size: 48px; font-weight: bold; color: #2a5298; }
        .summary-label { font-size: 18px; color: #666; margin-top: 5px; }
        
        .btn { padding: 15px 30px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: #2a5298; color: white; }
        .btn-primary:hover { background: #1e3c72; }
        
        .footer { background: #333; color: white; text-align: center; padding: 25px; font-size: 16px; }
        
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">📋</div>
            <div class="title">AI合同审查助手</div>
            <div class="subtitle">让每个人都能看懂合同，远离法律陷阱</div>
        </div>

        <div class="main-content">
            <div class="section">
                <div class="section-title">
                    <span class="section-icon">📁</span>
                    上传合同文件
                </div>
                
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <div class="upload-icon">📄</div>
                    <div class="upload-text">点击上传合同文件（支持PDF、Word、TXT）</div>
                    <div class="upload-btn">选择文件</div>
                    <input type="file" id="fileInput" style="display:none">
                </div>
                
                <div class="template-selector">
                    <div class="template-btn" onclick="selectTemplate('rental')">
                        <div class="template-icon">🏠</div>
                        <div class="template-name">租房合同</div>
                    </div>
                    <div class="template-btn" onclick="selectTemplate('employment')">
                        <div class="template-icon">💼</div>
                        <div class="template-name">劳动合同</div>
                    </div>
                    <div class="template-btn" onclick="selectTemplate('purchase')">
                        <div class="template-icon">🏠</div>
                        <div class="template-name">购房合同</div>
                    </div>
                </div>
            </div>

            <div class="scan-progress" id="scanProgress">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="scan-status">AI正在扫描合同<span class="scan-dots">.</span></div>
            </div>

            <div class="section hidden" id="contractSection">
                <div class="section-title">
                    <span class="section-icon">📝</span>
                    合同原文（风险已标注）
                </div>
                <div class="contract-content" id="contractContent"></div>
            </div>

            <div class="section hidden" id="riskSection">
                <div class="section-title">
                    <span class="section-icon">⚠️</span>
                    风险条款分析
                </div>
                <div id="riskList"></div>
            </div>

            <div class="section hidden" id="reportSection">
                <div class="report-box">
                    <div class="report-title">📊 合同审查报告</div>
                    <div class="report-summary">
                        <div class="summary-item">
                            <div class="summary-number" id="totalClauses">0</div>
                            <div class="summary-label">合同条款数</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-number" id="highRisk">0</div>
                            <div class="summary-label">高风险条款</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-number" id="mediumRisk">0</div>
                            <div class="summary-label">中风险条款</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-number" id="lowRisk">0</div>
                            <div class="summary-label">低风险条款</div>
                        </div>
                    </div>
                    <div style="text-align:center;">
                        <button class="btn btn-primary" onclick="downloadReport()">下载完整报告</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            📋 AI合同审查助手 - TRAE AI创造力大赛参赛作品
        </div>
    </div>

    <script>
        const templates = {
            rental: {
                title: "房屋租赁合同",
                content: `甲方（出租方）：张三
乙方（承租方）：李四

第一条 租赁房屋
甲方将位于北京市朝阳区XX街道XX小区XX号楼XX室的房屋出租给乙方使用。

第二条 租赁期限
租赁期限为1年，自2024年1月1日至2024年12月31日。
<risk type="medium">租赁期满后，乙方需提前30天通知甲方是否续租，否则视为自动续租一年。</risk>

第三条 租金及支付方式
月租金为人民币3000元，按季度支付。
<risk type="high">乙方逾期支付租金超过7天，甲方有权单方面解除合同，并扣除全部押金。</risk>

第四条 押金
乙方需支付押金人民币6000元，租赁期满后无违约行为全额退还。
<risk type="low">押金退还时间为租赁期满后15个工作日内。</risk>

第五条 房屋使用
乙方不得擅自改变房屋结构，不得从事违法活动。

第六条 违约责任
<risk type="high">任何一方违约，需支付对方违约金为年租金的200%。</risk>

第七条 争议解决
本合同争议由甲方所在地法院管辖。`,
                risks: [
                    { level: "high", title: "违约金过高", desc: "合同第六条约定违约金为年租金的200%，远超实际损失，可能被法院认定为过高而调整。", suggest: "建议将违约金调整为年租金的20%-30%。" },
                    { level: "high", title: "逾期解除条款过严", desc: "逾期支付租金仅7天即有权解除合同，时间过短，不利于承租人。", suggest: "建议将逾期期限延长至15-30天。" },
                    { level: "medium", title: "自动续租条款", desc: "租赁期满未通知即自动续租一年，可能导致承租人被动续租。", suggest: "建议删除自动续租条款，改为双方另行协商。" },
                    { level: "low", title: "押金退还时间", desc: "15个工作日的退还期限略长，建议缩短至7个工作日。", suggest: "建议修改为7个工作日内退还。" }
                ]
            },
            employment: {
                title: "劳动合同",
                content: `甲方（用人单位）：XX科技有限公司
乙方（劳动者）：王五

第一条 合同期限
本合同为固定期限劳动合同，期限为3年，自2024年1月1日至2027年12月31日。

第二条 工作岗位
乙方担任软件开发工程师岗位，工作地点为北京市。
<risk type="medium">甲方有权根据业务需要调整乙方工作岗位和工作地点。</risk>

第三条 工作时间
实行标准工时制度，每日工作8小时，每周工作5天。
<risk type="high">乙方需无条件服从甲方的加班安排，加班不计付加班费。</risk>

第四条 劳动报酬
月工资为人民币15000元，其中基本工资8000元，绩效工资7000元。
<risk type="medium">绩效工资由甲方根据考核结果决定，乙方无异议。</risk>

第五条 社会保险
甲方按照国家规定为乙方缴纳社会保险。

第六条 保密义务
<risk type="high">乙方在职期间及离职后5年内不得从事与甲方同类业务。</risk>

第七条 违约责任
乙方提前解除合同需支付违约金10万元。`,
                risks: [
                    { level: "high", title: "竞业限制期限过长", desc: "离职后5年竞业限制远超法定最长2年期限，条款无效。", suggest: "建议将竞业限制期限改为2年，并约定竞业限制补偿金。" },
                    { level: "high", title: "无偿加班条款", desc: "要求无条件加班且不计付加班费，违反劳动法规定。", suggest: "删除该条款，加班应按规定支付加班费。" },
                    { level: "high", title: "违约金过高", desc: "提前解除合同需支付10万元违约金，不符合法律规定。", suggest: "删除违约金条款，或约定合理的服务期。" },
                    { level: "medium", title: "岗位调整权过大", desc: "甲方有权单方面调整岗位和地点，可能侵害劳动者权益。", suggest: "岗位调整应协商一致，或明确调整范围。" },
                    { level: "medium", title: "绩效工资无标准", desc: "绩效工资完全由甲方决定，缺乏明确考核标准。", suggest: "应明确绩效考核标准和发放条件。" }
                ]
            },
            purchase: {
                title: "房屋买卖合同",
                content: `甲方（卖方）：赵六
乙方（买方）：孙七

第一条 房屋基本情况
甲方将位于北京市海淀区XX路XX号XX小区XX号楼XX室的房屋出售给乙方。

第二条 房屋价款
房屋总价款为人民币500万元，乙方需在签订合同当日支付定金100万元。
<risk type="high">定金金额超过合同总价款的20%。</risk>

第三条 付款方式
乙方需在2024年6月30日前支付全部房款。
<risk type="medium">未约定逾期付款的违约责任。</risk>

第四条 房屋交付
甲方需在收到全部房款后30日内交付房屋。
<risk type="low">未约定房屋交付的具体标准和验收方式。</risk>

第五条 产权过户
<risk type="high">产权过户费用全部由乙方承担。</risk>

第六条 违约责任
<risk type="high">任何一方违约，需支付对方房屋总价款的30%作为违约金。</risk>

第七条 补充协议
本合同未尽事宜，由双方另行签订补充协议。`,
                risks: [
                    { level: "high", title: "定金比例过高", desc: "定金100万元超过总价款500万元的20%（100万元），超过部分不产生定金效力。", suggest: "建议将定金调整为总价款的20%即100万元。" },
                    { level: "high", title: "过户费用承担", desc: "全部过户费用由买方承担不符合惯例，通常买卖双方各自承担。", suggest: "建议约定双方各自承担法定税费。" },
                    { level: "high", title: "违约金过高", desc: "30%的违约金可能被法院认定为过高。", suggest: "建议调整为10%-20%。" },
                    { level: "medium", title: "逾期付款责任缺失", desc: "未约定买方逾期付款的违约责任，卖方权益缺乏保障。", suggest: "应添加逾期付款的违约金条款。" },
                    { level: "low", title: "交付标准不明确", desc: "未约定房屋交付的具体标准和验收方式。", suggest: "应明确房屋交付时的状态和验收流程。" }
                ]
            }
        };

        function selectTemplate(type) {
            const template = templates[type];
            if (!template) return;
            
            document.getElementById('scanProgress').style.display = 'block';
            document.getElementById('contractSection').classList.add('hidden');
            document.getElementById('riskSection').classList.add('hidden');
            document.getElementById('reportSection').classList.add('hidden');
            
            let progress = 0;
            const progressFill = document.getElementById('progressFill');
            const scanStatus = document.querySelector('.scan-status');
            
            const interval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress > 100) progress = 100;
                progressFill.style.width = progress + '%';
                
                if (progress < 30) scanStatus.innerHTML = 'AI正在扫描合同.';
                else if (progress < 60) scanStatus.innerHTML = 'AI正在分析条款..';
                else if (progress < 90) scanStatus.innerHTML = 'AI正在生成报告...';
                else scanStatus.innerHTML = '审查完成！';
                
                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        renderContract(template);
                        renderRisks(template.risks);
                        renderReport(template.risks);
                        document.getElementById('scanProgress').style.display = 'none';
                        document.getElementById('contractSection').classList.remove('hidden');
                        document.getElementById('riskSection').classList.remove('hidden');
                        document.getElementById('reportSection').classList.remove('hidden');
                    }, 500);
                }
            }, 300);
        }

        function renderContract(template) {
            let content = `<div class="contract-title">${template.title}</div><div class="contract-text">`;
            const lines = template.content.split('\n');
            
            lines.forEach(line => {
                if (line.includes('<risk')) {
                    const match = line.match(/<risk type="(.*?)">(.*?)<\/risk>/);
                    if (match) {
                        const type = match[1];
                        const text = match[2];
                        let className = '';
                        if (type === 'high') className = 'risk-highlight-red';
                        else if (type === 'medium') className = 'risk-highlight-yellow';
                        else className = 'risk-highlight-green';
                        content += `<div class="${className}">${text}</div>`;
                    }
                } else {
                    content += `<p>${line}</p>`;
                }
            });
            
            content += '</div>';
            document.getElementById('contractContent').innerHTML = content;
        }

        function renderRisks(risks) {
            let html = '';
            risks.forEach(risk => {
                let levelClass = '';
                let levelText = '';
                if (risk.level === 'high') { levelClass = 'level-high'; levelText = '高风险'; }
                else if (risk.level === 'medium') { levelClass = 'level-medium'; levelText = '中风险'; }
                else { levelClass = 'level-low'; levelText = '低风险'; }
                
                html += `
                    <div class="risk-card">
                        <div class="risk-header">
                            <div class="risk-title">${risk.title}</div>
                            <div class="risk-level ${levelClass}">${levelText}</div>
                        </div>
                        <div class="risk-desc">${risk.desc}</div>
                        <div class="risk-suggest">💡 修改建议：${risk.suggest}</div>
                    </div>
                `;
            });
            document.getElementById('riskList').innerHTML = html;
        }

        function renderReport(risks) {
            const high = risks.filter(r => r.level === 'high').length;
            const medium = risks.filter(r => r.level === 'medium').length;
            const low = risks.filter(r => r.level === 'low').length;
            const total = risks.length;
            
            document.getElementById('totalClauses').innerText = total;
            document.getElementById('highRisk').innerText = high;
            document.getElementById('mediumRisk').innerText = medium;
            document.getElementById('lowRisk').innerText = low;
        }

        function downloadReport() {
            alert('报告已生成！\n\n实际应用中将下载完整的PDF审查报告。');
        }
    </script>
</body>
</html>
