<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能导盲助手 - 视障辅助导航系统</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-section">
                <span class="logo-icon">👁️</span>
                <h1 class="app-title">智能导盲助手</h1>
            </div>
            <div class="status-bar">
                <div class="status-item">
                    <span class="status-label">系统状态</span>
                    <span class="status-value" id="systemStatus">就绪</span>
                </div>
                <div class="status-item">
                    <span class="status-label">GPS信号</span>
                    <span class="status-value" id="gpsStatus">良好</span>
                </div>
                <div class="status-item">
                    <span class="status-label">电池电量</span>
                    <span class="status-value" id="batteryLevel">85%</span>
                </div>
            </div>
        </header>

        <main class="main-content">
            <section class="panel road-recognition-panel">
                <div class="panel-header">
                    <span class="panel-icon">📹</span>
                    <h2 class="panel-title">道路识别</h2>
                </div>
                <div class="camera-view">
                    <canvas id="cameraCanvas" width="640" height="480"></canvas>
                    <div class="camera-overlay">
                        <div class="crosshair">
                            <div class="crosshair-h"></div>
                            <div class="crosshair-v"></div>
                        </div>
                        <div class="detection-box" id="detectionBox"></div>
                    </div>
                    <div class="camera-status">
                        <span class="recording-indicator"></span>
                        <span>实时识别中</span>
                    </div>
                </div>
                <div class="recognition-results" id="recognitionResults">
                    <h3>识别结果</h3>
                    <div class="result-list" id="resultList"></div>
                </div>
            </section>

            <section class="panel direction-guide-panel">
                <div class="panel-header">
                    <span class="panel-icon">🧭</span>
                    <h2 class="panel-title">方向指引</h2>
                </div>
                
                <div class="compass-container">
                    <div class="compass">
                        <div class="compass-ring">
                            <div class="compass-marks">
                                <div class="mark north"></div>
                                <div class="mark east"></div>
                                <div class="mark south"></div>
                                <div class="mark west"></div>
                                <div class="mark ne"></div>
                                <div class="mark se"></div>
                                <div class="mark sw"></div>
                                <div class="mark nw"></div>
                            </div>
                            <div class="compass-inner-ring"></div>
                            <div class="compass-degree-markers">
                                <span class="degree">N</span>
                                <span class="degree">E</span>
                                <span class="degree">S</span>
                                <span class="degree">W</span>
                            </div>
                            <div class="joystick-area" id="joystickArea">
                                <div class="joystick-handle" id="joystickHandle"></div>
                            </div>
                            <div class="compass-center"></div>
                        </div>
                        <div class="direction-label" id="directionLabel">前方</div>
                    </div>
                </div>

                <div class="current-instruction">
                    <div class="instruction-icon" id="instructionIcon">⬆️</div>
                    <div class="instruction-text" id="instructionText">准备开始导航</div>
                </div>

                <div class="navigation-info">
                    <div class="info-item">
                        <span class="info-label">下一个转向点</span>
                        <span class="info-value" id="nextTurnDistance">--</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">总剩余距离</span>
                        <span class="info-value" id="totalDistance">--</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">预计到达</span>
                        <span class="info-value" id="eta">--</span>
                    </div>
                </div>

                <div class="obstacle-warning" id="obstacleWarning">
                    <span class="warning-icon">⚠️</span>
                    <span class="warning-text" id="warningText">检测中...</span>
                </div>
            </section>

            <section class="panel route-planning-panel">
                <div class="panel-header">
                    <span class="panel-icon">🗺️</span>
                    <h2 class="panel-title">路线规划</h2>
                </div>
                
                <div class="map-container">
                    <canvas id="mapCanvas" width="320" height="320"></canvas>
                    <div class="map-legend">
                        <div class="legend-item">
                            <span class="legend-color user"></span>
                            <span>当前位置</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-color destination"></span>
                            <span>目的地</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-color ideal-path"></span>
                            <span>规划路径</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-color actual-path"></span>
                            <span>实际路径</span>
                        </div>
                    </div>
                </div>

                <div class="control-panel">
                    <div class="voice-controls">
                        <button class="control-btn voice-btn" id="voiceToggle">
                            <span>🗣️</span>
                            <span>语音播报</span>
                        </button>
                        <button class="control-btn repeat-btn" id="repeatBtn">
                            <span>🔄</span>
                            <span>重复指令</span>
                        </button>
                    </div>
                    <div class="voice-status" id="voiceStatus">语音播报已关闭</div>
                </div>

                <div class="demo-controls">
                    <button class="demo-btn start-btn" id="startBtn">开始演示</button>
                    <button class="demo-btn pause-btn" id="pauseBtn">暂停</button>
                    <button class="demo-btn reset-btn" id="resetBtn">重置</button>
                </div>

                <div class="scenario-selector">
                    <label>选择场景:</label>
                    <select id="scenarioSelect">
                        <option value="street">街道行走</option>
                        <option value="crosswalk">人行横道</option>
                        <option value="obstacle">障碍物避让</option>
                        <option value="stairs">楼梯检测</option>
                        <option value="intersection">路口导航</option>
                    </select>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <div class="voice-history" id="voiceHistory">
                <h3>语音播报历史</h3>
                <div class="history-list" id="historyList"></div>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
