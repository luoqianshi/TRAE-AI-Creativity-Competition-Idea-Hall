<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PurifyDrop - 净化之滴</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; overflow: hidden; font-family: 'Microsoft YaHei', sans-serif; }
        #game-container { position: relative; width: 100vw; height: 100vh; }
        canvas { display: block; }

        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, #0d0d1a 0%, #1a1a2e 50%, #16213e 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; transition: opacity 0.8s ease;
        }
        #start-screen.hide { opacity: 0; pointer-events: none; }
        #start-title {
            font-size: 56px; font-weight: bold; color: #00ffff;
            text-shadow: 0 0 30px rgba(0,255,255,0.8), 0 0 60px rgba(0,255,255,0.4);
            margin-bottom: 20px; animation: glow 2s ease-in-out infinite;
        }
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 30px rgba(0,255,255,0.8), 0 0 60px rgba(0,255,255,0.4); }
            50% { text-shadow: 0 0 50px rgba(0,255,255,1), 0 0 80px rgba(0,255,255,0.6); }
        }
        #start-subtitle { font-size: 22px; color: rgba(255,255,255,0.7); margin-bottom: 50px; }
        #start-btn {
            padding: 16px 70px; font-size: 26px; font-weight: bold; color: #0a0a0f;
            background: linear-gradient(135deg, #00cccc 0%, #00ffff 50%, #00ffcc 100%);
            border: none; border-radius: 50px; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 0 30px rgba(0,255,255,0.5);
        }
        #start-btn:hover { transform: scale(1.05); box-shadow: 0 0 50px rgba(0,255,255,0.8); }
        .float-item {
            position: absolute; font-size: 32px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(15deg); }
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; opacity: 0; transition: opacity 0.8s ease;
        }
        #ui-layer.show { opacity: 1; }

        #header {
            position: absolute; top: 20px; left: 20px; right: 130px;
            display: flex; justify-content: space-between; align-items: center; gap: 15px;
            z-index: 50;
        }
        .info-box {
            background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 20px;
            font-size: 16px; font-weight: bold; border: 2px solid;
        }
        #purify-count { color: #00ffff; border-color: rgba(0,255,255,0.5); text-shadow: 0 0 10px rgba(0,255,255,0.8); }
        #city-name { color: #ffcc00; border-color: rgba(255,200,0,0.5); text-shadow: 0 0 10px rgba(255,200,0,0.8); }
        #progress-container {
            flex: 1; height: 24px; background: rgba(0,0,0,0.7);
            border-radius: 12px; overflow: hidden; border: 2px solid rgba(0,255,255,0.5);
            position: relative;
        }
        #purify-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #00cccc 0%, #00ffff 50%, #00ffcc 100%);
            transition: width 0.3s ease; box-shadow: 0 0 15px rgba(0,255,255,0.7);
        }
        #progress-label {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-size: 13px; font-weight: bold; text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }

        #tutorial {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.8); font-size: 16px;
            background: rgba(0,0,0,0.5); padding: 10px 30px; border-radius: 20px;
            animation: fadeInOut 3s ease-in-out infinite; z-index: 50;
        }
        @keyframes fadeInOut { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        #rain-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; opacity: 0; transition: opacity 0.5s ease;
        }
        #rain-overlay.show { opacity: 1; }

        #city-glow {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, rgba(100,255,200,0.2) 0%, transparent 70%);
            opacity: 0; transition: opacity 1s ease; pointer-events: none;
        }
        #city-glow.show { opacity: 1; }

        #game-buttons {
            position: absolute; top: 20px; right: 20px;
            display: flex; gap: 10px; z-index: 60;
            pointer-events: auto;
        }
        .game-btn {
            width: 44px; height: 44px;
            background: rgba(0,0,0,0.7);
            border: 2px solid rgba(0,255,255,0.5);
            border-radius: 50%;
            color: #00ffff;
            font-size: 18px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease;
            text-shadow: 0 0 10px rgba(0,255,255,0.8);
        }
        .game-btn:hover {
            background: rgba(0,255,255,0.2);
            box-shadow: 0 0 20px rgba(0,255,255,0.5);
            transform: scale(1.1);
        }
        .game-btn:active {
            transform: scale(0.95);
        }
        #exit-btn {
            border-color: rgba(255,100,100,0.5);
            color: #ff6666;
            text-shadow: 0 0 10px rgba(255,100,100,0.8);
        }
        #exit-btn:hover {
            background: rgba(255,100,100,0.2);
            box-shadow: 0 0 20px rgba(255,100,100,0.5);
        }

        #pause-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }
        #pause-overlay.show {
            opacity: 1; pointer-events: auto;
        }
        #pause-title {
            font-size: 48px; font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 20px rgba(0,255,255,0.8);
            margin-bottom: 40px;
        }
        .pause-btn {
            padding: 15px 50px;
            font-size: 20px; font-weight: bold;
            background: rgba(0,0,0,0.8);
            border: 3px solid;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
        }
        #resume-btn {
            color: #00ffff; border-color: #00ffff;
            text-shadow: 0 0 10px rgba(0,255,255,0.8);
        }
        #resume-btn:hover {
            background: rgba(0,255,255,0.2);
            box-shadow: 0 0 30px rgba(0,255,255,0.5);
        }
        #quit-btn {
            color: #ff6666; border-color: #ff6666;
            text-shadow: 0 0 10px rgba(255,100,100,0.8);
        }
        #quit-btn:hover {
            background: rgba(255,100,100,0.2);
            box-shadow: 0 0 30px rgba(255,100,100,0.5);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>

        <div id="start-screen">
            <div id="start-title">PurifyDrop</div>
            <div id="start-subtitle">净化被污染的城市街区</div>
            <button id="start-btn" onclick="startGame()">开始净化</button>
        </div>

        <div id="ui-layer">
            <div id="header">
                <div class="info-box" id="purify-count">净化次数: 0</div>
                <div class="info-box" id="city-name">上海</div>
                <div id="progress-container">
                    <div id="purify-bar"></div>
                    <div id="progress-label">净化指数</div>
                </div>
            </div>
            <div id="game-buttons">
                <button class="game-btn" id="pause-btn" onclick="togglePause()">⏸</button>
                <button class="game-btn" id="exit-btn" onclick="exitGame()">✕</button>
            </div>
            <div id="tutorial">拖动水滴吞噬污染物</div>
            <div id="rain-overlay"></div>
            <div id="city-glow"></div>
            <div id="pause-overlay">
                <div id="pause-title">游戏暂停</div>
                <button class="pause-btn" id="resume-btn" onclick="togglePause()">继续游戏</button>
                <button class="pause-btn" id="quit-btn" onclick="exitGame()">退出游戏</button>
            </div>
        </div>
    </div>

    <script>
    var canvas = document.getElementById('game-canvas');
    var ctx = canvas.getContext('2d');

    var startScreen = document.getElementById('start-screen');
    var uiLayer = document.getElementById('ui-layer');
    var purifyBar = document.getElementById('purify-bar');
    var purifyCount = document.getElementById('purify-count');
    var cityName = document.getElementById('city-name');
    var rainOverlay = document.getElementById('rain-overlay');
    var cityGlow = document.getElementById('city-glow');
    var pauseOverlay = document.getElementById('pause-overlay');
    var pauseBtn = document.getElementById('pause-btn');

    var width = 0, height = 0;
    var audioCtx = null;
    var BASE_TRASH = 20;

    var game = {
        level: 0,
        count: 0,
        trashEaten: 0,
        trashTarget: 20,
        exploding: false,
        raining: false,
        rebuilding: false,
        rebuildTimer: 0,
        playing: false,
        paused: false
    };

    var drop = {
        x: 0, y: 0, tx: 0, ty: 0,
        radius: 15, maxR: 80,
        bright: 0.5,
        vx: 0, vy: 0,
        trail: [],
        eating: false,
        eatT: 0,
        mouthOpen: 0
    };

    var pollutants = [];
    var rainP = [];
    var stars = [];
    var explodeP = [];
    var bright = 0;
    var time = 0;
    var cityIdx = 0;

    var noiseOscs = [];
    var noiseGain = null;
    var noiseTimer = null;

    var CITIES = [
        { name: '上海', hasWater: true, build: drawShanghai },
        { name: '北京', hasWater: false, build: drawBeijing },
        { name: '天津', hasWater: true, build: drawTianjin },
        { name: '重庆', hasWater: true, build: drawChongqing },
        { name: '陕西', hasWater: false, build: drawShaanxi },
        { name: '山西', hasWater: false, build: drawShanxi },
        { name: '广州', hasWater: true, build: drawGuangzhou },
        { name: '深圳', hasWater: true, build: drawShenzhen }
    ];

    var POLLUTANTS = [
        { emoji: '🥤', size: 38, spd: 1.2, pts: 8 },
        { emoji: '🍟', size: 36, spd: 1.0, pts: 7 },
        { emoji: '🥡', size: 40, spd: 0.9, pts: 9 },
        { emoji: '🚮', size: 42, spd: 1.1, pts: 10 },
        { emoji: '💨', size: 36, spd: 1.4, pts: 6 },
        { emoji: '♨️', size: 34, spd: 1.5, pts: 5 },
        { emoji: '🔊', size: 38, spd: 1.3, pts: 12, noise: true },
        { emoji: '🔉', size: 36, spd: 1.2, pts: 10, noise: true },
        { emoji: '🍦', size: 34, spd: 1.1, pts: 6 },
        { emoji: '🍾', size: 38, spd: 1.0, pts: 8 }
    ];

    function initFloatItems() {
        var emojis = ['🥤','🍟','🥡','🚮','💨','♨️','🔊','🔉','🍦','🍾'];
        for (var i = 0; i < 25; i++) {
            var el = document.createElement('div');
            el.className = 'float-item';
            el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            el.style.left = Math.random() * 100 + '%';
            el.style.top = Math.random() * 100 + '%';
            el.style.animationDelay = Math.random() * 3 + 's';
            el.style.fontSize = (25 + Math.random() * 25) + 'px';
            startScreen.appendChild(el);
        }
    }

    function startGame() {
        startScreen.classList.add('hide');
        uiLayer.classList.add('show');
        game.playing = true;
        game.paused = false;
        setTimeout(function() {
            startScreen.style.display = 'none';
            for (var i = 0; i < 15; i++) spawnPollutant();
        }, 800);
    }

    function togglePause() {
        if (!game.playing || game.exploding || game.raining) return;
        
        game.paused = !game.paused;
        if (game.paused) {
            pauseOverlay.classList.add('show');
            pauseBtn.textContent = '▶';
            if (audioCtx) audioCtx.suspend();
        } else {
            pauseOverlay.classList.remove('show');
            pauseBtn.textContent = '⏸';
            if (audioCtx) audioCtx.resume();
        }
    }

    function exitGame() {
        game.playing = false;
        game.paused = false;
        game.exploding = false;
        game.raining = false;
        game.rebuilding = false;
        game.trashEaten = 0;
        game.trashTarget = 20;
        game.level = 0;
        game.count = 0;
        
        pauseOverlay.classList.remove('show');
        uiLayer.classList.remove('show');
        startScreen.style.display = 'flex';
        startScreen.classList.remove('hide');
        
        pollutants = [];
        rainP = [];
        explodeP = [];
        bright = 0;
        cityIdx = 0;
        cityName.textContent = CITIES[cityIdx].name;
        purifyCount.textContent = '净化次数: 0';
        updateProgress();
        
        drop.x = width / 2;
        drop.y = height / 2;
        drop.tx = width / 2;
        drop.ty = height / 2;
        drop.radius = 15;
        drop.bright = 0.5;
        drop.vx = 0;
        drop.vy = 0;
        drop.trail = [];
        drop.eating = false;
        drop.eatT = 0;
        drop.mouthOpen = 0;
        
        stopNoise();
        if (audioCtx) audioCtx.resume();
        rainOverlay.classList.remove('show');
        cityGlow.classList.remove('show');
    }

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        drop.x = width / 2;
        drop.y = height / 2;
        drop.tx = width / 2;
        drop.ty = height / 2;
        initStars();
    }

    function initStars() {
        stars = [];
        for (var i = 0; i < 120; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height * 0.5,
                s: Math.random() * 2 + 0.5,
                t: Math.random() * Math.PI * 2,
                spd: 0.02 + Math.random() * 0.03
            });
        }
    }

    function initAudio() {
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch(e) {
            console.warn('Audio not supported');
        }
    }

    function playPop() {
        if (!audioCtx) return;
        var o = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        o.type = 'sine';
        o.connect(g);
        g.connect(audioCtx.destination);
        o.frequency.setValueAtTime(600 + Math.random() * 200, audioCtx.currentTime);
        o.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.15);
        g.gain.setValueAtTime(0.2, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        o.start();
        o.stop(audioCtx.currentTime + 0.15);
    }

    function playRain() {
        if (!audioCtx) return;
        var bufSize = audioCtx.sampleRate * 2;
        var buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
        var data = buf.getChannelData(0);
        for (var i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * 0.08;
        var src = audioCtx.createBufferSource();
        src.buffer = buf;
        var f = audioCtx.createBiquadFilter();
        f.type = 'lowpass';
        f.frequency.value = 1000;
        var g = audioCtx.createGain();
        g.gain.setValueAtTime(0, audioCtx.currentTime);
        g.gain.linearRampToValueAtTime(0.25, audioCtx.currentTime + 0.5);
        g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 2.5);
        src.connect(f);
        f.connect(g);
        g.connect(audioCtx.destination);
        src.start();
    }

    function playWin() {
        if (!audioCtx) return;
        var notes = [523.25, 659.25, 783.99, 1046.50];
        for (var i = 0; i < notes.length; i++) {
            (function(freq, delay) {
                setTimeout(function() {
                    var o = audioCtx.createOscillator();
                    var g = audioCtx.createGain();
                    o.type = 'sine';
                    o.frequency.value = freq;
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    g.gain.setValueAtTime(0, audioCtx.currentTime);
                    g.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.02);
                    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    o.start();
                    o.stop(audioCtx.currentTime + 0.1);
                }, delay);
            })(notes[i], i * 80);
        }
    }

    function startNoise() {
        if (!audioCtx || noiseGain) return;
        noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0, audioCtx.currentTime);
        noiseGain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 0.4);
        noiseGain.connect(audioCtx.destination);

        var bufSize = audioCtx.sampleRate * 2;
        var buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
        var data = buf.getChannelData(0);
        for (var i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * 0.3;

        for (var i = 0; i < 4; i++) {
            var src = audioCtx.createBufferSource();
            src.buffer = buf;
            src.loop = true;
            var f = audioCtx.createBiquadFilter();
            f.type = 'bandpass';
            f.frequency.value = 300 + i * 200;
            f.Q.value = 0.8;
            src.connect(f);
            f.connect(noiseGain);
            src.start();
            noiseOscs.push(src);
        }

        noiseTimer = setInterval(function() {
            if (!audioCtx || !noiseGain) return;
            if (Math.random() > 0.7) {
                var o = audioCtx.createOscillator();
                var g = audioCtx.createGain();
                o.type = 'sawtooth';
                o.frequency.setValueAtTime(200 + Math.random() * 100, audioCtx.currentTime);
                o.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.12);
                o.connect(g);
                g.connect(noiseGain);
                g.gain.setValueAtTime(0, audioCtx.currentTime);
                g.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.02);
                g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                o.start();
                o.stop(audioCtx.currentTime + 0.12);
            }
            if (Math.random() > 0.5) {
                var o2 = audioCtx.createOscillator();
                var g2 = audioCtx.createGain();
                o2.type = 'square';
                o2.frequency.setValueAtTime(80 + Math.random() * 40, audioCtx.currentTime);
                o2.frequency.linearRampToValueAtTime(60 + Math.random() * 20, audioCtx.currentTime + 0.25);
                o2.connect(g2);
                g2.connect(noiseGain);
                g2.gain.setValueAtTime(0, audioCtx.currentTime);
                g2.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.04);
                g2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                o2.start();
                o2.stop(audioCtx.currentTime + 0.25);
            }
        }, 500);
    }

    function stopNoise() {
        if (!noiseGain) return;
        noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        if (noiseTimer) { clearInterval(noiseTimer); noiseTimer = null; }
        setTimeout(function() {
            for (var i = 0; i < noiseOscs.length; i++) {
                try { noiseOscs[i].stop(); } catch(e) {}
            }
            noiseOscs = [];
            noiseGain = null;
        }, 300);
    }

    function spawnPollutant() {
        if (game.raining) return;
        var t = POLLUTANTS[Math.floor(Math.random() * POLLUTANTS.length)];
        var m = 80;
        var x = m + Math.random() * (width - m * 2);
        var y = m + Math.random() * (height - m * 2);
        var makeNoise = t.noise && Math.random() > 0.5;
        pollutants.push({
            x: x, y: y,
            size: t.size,
            emoji: t.emoji,
            pts: t.pts,
            isNoise: makeNoise,
            vx: (Math.random() - 0.5) * t.spd,
            vy: (Math.random() - 0.5) * t.spd,
            rot: Math.random() * Math.PI * 2,
            rotSpd: (Math.random() - 0.5) * 0.03,
            bnc: Math.random() * Math.PI * 2,
            bncSpd: 0.03 + Math.random() * 0.04
        });
    }

    function drawBg() {
        time += 0.02;

        var sky = ctx.createLinearGradient(0, 0, 0, height);
        sky.addColorStop(0, lerpColor('#020208', '#0a1a3a', bright));
        sky.addColorStop(0.2, lerpColor('#050515', '#15254a', bright));
        sky.addColorStop(0.5, lerpColor('#0a0a20', '#25355a', bright));
        sky.addColorStop(0.8, lerpColor('#0f0f25', '#35456a', bright));
        sky.addColorStop(1, lerpColor('#151530', '#45557a', bright));
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, width, height);

        for (var i = 0; i < stars.length; i++) {
            var s = stars[i];
            s.t += s.spd;
            var a = 0.2 + Math.sin(s.t) * 0.5;
            var size = s.s * (0.8 + Math.sin(s.t * 2) * 0.2);
            ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
            ctx.beginPath();
            ctx.arc(s.x, s.y, size, 0, Math.PI * 2);
            ctx.fill();

            if (a > 0.8) {
                var glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, size * 3);
                glow.addColorStop(0, 'rgba(255,255,255,' + (a * 0.2) + ')');
                glow.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(s.x, s.y, size * 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        var mx = width * 0.85;
        var my = height * 0.15;
        var mg = ctx.createRadialGradient(mx, my, 0, mx, my, 120);
        mg.addColorStop(0, 'rgba(255,255,220,0.25)');
        mg.addColorStop(0.3, 'rgba(255,255,200,0.1)');
        mg.addColorStop(1, 'rgba(255,255,200,0)');
        ctx.fillStyle = mg;
        ctx.beginPath();
        ctx.arc(mx, my, 120, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#FFFDE7';
        ctx.beginPath();
        ctx.arc(mx, my, 30, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#FFF8DC';
        ctx.beginPath();
        ctx.arc(mx - 8, my - 5, 8, 0, Math.PI * 2);
        ctx.fill();

        for (var i = 0; i < 5; i++) {
            var cloudY = height * (0.1 + i * 0.15);
            var cloudX = (time * 20 + i * 150) % (width + 200) - 100;
            drawCloud(cloudX, cloudY, 0.3 + bright * 0.2, 60 + i * 20);
        }

        ctx.fillStyle = lerpColor('#080815', '#152540', bright);
        ctx.beginPath();
        ctx.moveTo(0, height * 0.68);
        for (var x = 0; x <= width; x += 50) {
            ctx.lineTo(x, height * 0.68 - Math.sin(x * 0.01) * 20 - Math.sin(x * 0.005 + time) * 10);
        }
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.closePath();
        ctx.fill();

        var gy = height * 0.7;
        CITIES[cityIdx].build(gy);

        if (CITIES[cityIdx].hasWater) {
            var wy = gy + 15;
            var wg = ctx.createLinearGradient(0, wy, 0, height);
            wg.addColorStop(0, lerpColor('#051020', '#152545', bright));
            wg.addColorStop(0.5, lerpColor('#081525', '#182848', bright));
            wg.addColorStop(1, lerpColor('#030815', '#101830', bright));
            ctx.fillStyle = wg;
            ctx.fillRect(0, wy, width, height - wy);

            ctx.strokeStyle = 'rgba(200,230,255,' + (0.03 + bright * 0.08) + ')';
            ctx.lineWidth = 1;
            for (var i = 0; i < 30; i++) {
                var wx = (i * width / 30 + time * 20) % (width + 100) - 50;
                ctx.beginPath();
                ctx.moveTo(wx, wy + 20);
                ctx.bezierCurveTo(wx + 20, wy + 12, wx + 40, wy + 28, wx + 60, wy + 20);
                ctx.stroke();
            }

            for (var i = 0; i < 30; i++) {
                var rx = (i * width / 30 + time * 15) % width;
                var ry = wy + 30 + Math.sin(time * 2 + i) * 15;
                ctx.fillStyle = 'rgba(200,220,255,' + (0.05 + bright * 0.1) + ')';
                ctx.beginPath();
                ctx.arc(rx, ry, 1.5 + Math.sin(time * 3 + i * 0.5) * 0.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        drawCityLights(gy);
    }

        ctx.fillStyle = 'rgba(100,110,130,' + alpha + ')';
        ctx.beginPath();
        ctx.arc(x, y, size * 0.4, 0, Math.PI * 2);
        ctx.arc(x + size * 0.3, y - size * 0.1, size * 0.35, 0, Math.PI * 2);
        ctx.arc(x + size * 0.6, y, size * 0.3, 0, Math.PI * 2);
        ctx.arc(x - size * 0.2, y + size * 0.05, size * 0.25, 0, Math.PI * 2);
        ctx.fill();
    }

                ctx.fill();

                    ctx.beginPath();

                }
            }
        }
        ctx.globalAlpha = 1;

    function lerpColor(c1, c2, f) {
        if (f <= 0) return c1;
        if (f >= 1) return c2;
        var r1 = parseInt(c1.slice(1,3), 16);
        var g1 = parseInt(c1.slice(3,5), 16);
        var b1 = parseInt(c1.slice(5,7), 16);
        var r2 = parseInt(c2.slice(1,3), 16);
        var g2 = parseInt(c2.slice(3,5), 16);
        var b2 = parseInt(c2.slice(5,7), 16);
        var r = Math.round(r1 + (r2 - r1) * f);
        var g = Math.round(g1 + (g2 - g1) * f);
        var b = Math.round(b1 + (b2 - b1) * f);
        return '#' + r.toString(16).padStart(2,'0') + g.toString(16).padStart(2,'0') + b.toString(16).padStart(2,'0');
    }

    function drawDrop() {
        if (!game.paused) {
            if (drop.eating) {
                drop.eatT -= 0.05;
                drop.mouthOpen = Math.sin(drop.eatT * Math.PI) * 0.8;
                if (drop.eatT <= 0) {
                    drop.eating = false;
                    drop.mouthOpen = 0;
                }
            }

            var iner = drop.radius / drop.maxR * 0.3 + 0.7;
            drop.vx = (drop.tx - drop.x) * 0.1 * iner;
            drop.vy = (drop.ty - drop.y) * 0.1 * iner;
            drop.x += drop.vx;
            drop.y += drop.vy;

            drop.x = Math.max(drop.radius, Math.min(width - drop.radius, drop.x));
            drop.y = Math.max(drop.radius, Math.min(height - drop.radius, drop.y));

            drop.trail.push({ x: drop.x, y: drop.y, r: drop.radius });
            if (drop.trail.length > 8) drop.trail.shift();
        }

        for (var i = 0; i < drop.trail.length; i++) {
            var p = drop.trail[i];
            var a = (i / drop.trail.length) * 0.35 * drop.bright;
            var s = (i / drop.trail.length) * p.r * 0.7;
            var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, s);
            g.addColorStop(0, 'rgba(100,255,255,' + a + ')');
            g.addColorStop(1, 'rgba(100,255,255,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(p.x, p.y, s, 0, Math.PI * 2);
            ctx.fill();
        }

        var gs = drop.radius * 3;
        var gg = ctx.createRadialGradient(drop.x, drop.y, 0, drop.x, drop.y, gs);
        gg.addColorStop(0, 'rgba(0,255,255,' + (0.35 * drop.bright) + ')');
        gg.addColorStop(0.5, 'rgba(0,200,255,' + (0.15 * drop.bright) + ')');
        gg.addColorStop(1, 'rgba(0,150,255,0)');
        ctx.fillStyle = gg;
        ctx.beginPath();
        ctx.arc(drop.x, drop.y, gs, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.translate(drop.x, drop.y);

        var bg = ctx.createRadialGradient(-drop.radius*0.2, -drop.radius*0.2, 0, 0, 0, drop.radius);
        bg.addColorStop(0, 'rgba(230,255,255,' + (0.98 * drop.bright) + ')');
        bg.addColorStop(0.3, 'rgba(150,255,255,' + (0.9 * drop.bright) + ')');
        bg.addColorStop(0.6, 'rgba(80,220,255,' + (0.8 * drop.bright) + ')');
        bg.addColorStop(1, 'rgba(40,180,220,' + (0.7 * drop.bright) + ')');
        ctx.fillStyle = bg;
        ctx.beginPath();
        ctx.arc(0, 0, drop.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,255,' + (0.5 * drop.bright) + ')';
        ctx.lineWidth = 3;
        ctx.stroke();

        var eo = drop.radius * 0.32;
        var es = drop.radius * 0.22;

        ctx.fillStyle = '#1a1a3a';
        ctx.beginPath();
        ctx.arc(-eo, -drop.radius*0.1, es, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(eo, -drop.radius*0.1, es, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(-eo - es*0.25, -drop.radius*0.15, es*0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(eo - es*0.25, -drop.radius*0.15, es*0.35, 0, Math.PI * 2);
        ctx.fill();

        var my = drop.radius * 0.25;
        var mw = drop.radius * 0.35;
        var mh = drop.radius * (0.12 + drop.mouthOpen * 0.25);

        ctx.fillStyle = '#FF6B6B';
        ctx.beginPath();
        if (drop.eating && drop.mouthOpen > 0.1) {
            ctx.ellipse(0, my, mw * (1 + drop.mouthOpen * 0.3), mh * 2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#CC4444';
            ctx.beginPath();
            ctx.ellipse(0, my, mw * 0.6 * (1 + drop.mouthOpen * 0.2), mh * 1.3, 0, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.ellipse(0, my, mw, mh, 0, Math.PI, 0);
            ctx.fill();
        }

        ctx.fillStyle = 'rgba(255,150,150,' + (0.5 * drop.bright) + ')';
        ctx.beginPath();
        ctx.ellipse(-drop.radius*0.45, drop.radius*0.1, drop.radius*0.12, drop.radius*0.08, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(drop.radius*0.45, drop.radius*0.1, drop.radius*0.12, drop.radius*0.08, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,' + (0.7 * drop.bright) + ')';
        ctx.beginPath();
        ctx.ellipse(-drop.radius*0.25, -drop.radius*0.35, drop.radius*0.15, drop.radius*0.1, -0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(drop.radius*0.2, -drop.radius*0.4, drop.radius*0.1, drop.radius*0.06, -0.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    function drawPollutants() {
        var hasNoise = false;

        for (var i = 0; i < pollutants.length; i++) {
            var p = pollutants[i];
            
            if (!game.paused) {
                p.x += p.vx;
                p.y += p.vy;
                p.rot += p.rotSpd;
                p.bnc += p.bncSpd;
                p.y += Math.sin(p.bnc) * 4;

                if (p.x < 50) { p.x = 50; p.vx = Math.abs(p.vx); }
                if (p.x > width - 50) { p.x = width - 50; p.vx = -Math.abs(p.vx); }
                if (p.y < 50) { p.y = 50; p.vy = Math.abs(p.vy); }
                if (p.y > height - 50) { p.y = height - 50; p.vy = -Math.abs(p.vy); }
            }

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(Math.sin(p.bnc * 0.5) * 0.2);
            var sc = 1 + Math.sin(p.bnc) * 0.12;
            ctx.scale(sc, sc);

            ctx.font = p.size + 'px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            if (p.isNoise) {
                ctx.shadowColor = 'rgba(255,80,80,0.9)';
                ctx.shadowBlur = 20;
                hasNoise = true;
            } else if (p.emoji === '💨' || p.emoji === '♨️') {
                ctx.shadowColor = 'rgba(150,150,150,0.6)';
                ctx.shadowBlur = 15;
            } else {
                ctx.shadowColor = 'rgba(0,0,0,0.6)';
                ctx.shadowBlur = 8;
            }

            ctx.fillText(p.emoji, 0, 0);
            ctx.restore();
        }

        if (hasNoise) {
            startNoise();
        } else {
            stopNoise();
        }
    }

    function drawRain() {
        for (var i = 0; i < rainP.length; i++) {
            var p = rainP[i];
            p.y += p.spd;
            ctx.strokeStyle = 'rgba(200,255,255,' + p.a + ')';
            ctx.lineWidth = p.w || 1.5;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y - p.len);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
            if (p.y > height) {
                p.y = -p.len;
                p.x = Math.random() * width;
            }
        }
    }

    function drawExplode() {
        for (var i = explodeP.length - 1; i >= 0; i--) {
            var p = explodeP[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += p.gravity;
            p.radius *= p.shrink;
            p.alpha *= 0.98;

            if (p.radius < 0.5 || p.alpha < 0.05) {
                explodeP.splice(i, 1);
                continue;
            }

            var gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
            gradient.addColorStop(0, p.color + Math.floor(p.alpha * 255).toString(16).padStart(2, '0'));
            gradient.addColorStop(0.5, p.color + Math.floor(p.alpha * 128).toString(16).padStart(2, '0'));
            gradient.addColorStop(1, 'rgba(0,255,255,0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function checkCollisions() {
        if (game.exploding || game.paused || game.raining || game.rebuilding) return;

        var range = drop.radius * 1.5;
        var newList = [];

        for (var i = 0; i < pollutants.length; i++) {
            var p = pollutants[i];
            var dx = p.x - drop.x;
            var dy = p.y - drop.y;
            var dist = Math.sqrt(dx*dx + dy*dy);

            if (dist < range) {
                drop.eating = true;
                drop.eatT = 1;
                drop.mouthOpen = 1;

                var grow = p.size * 0.5;
                drop.radius = Math.min(drop.maxR, drop.radius + grow * 0.2);
                drop.bright = Math.min(1, drop.bright + 0.04);
                game.trashEaten++;
                game.level = game.trashEaten / game.trashTarget;

                if (p.type === 'noise') {
                    stopNoise();
                }

                playPop();
                createEatFx(p.x, p.y);
            } else {
                newList.push(p);
            }
        }
        pollutants = newList;

        updateProgress();

        if (game.trashEaten >= game.trashTarget && !game.exploding) {
            triggerExplode();
        }
    }

    function createEatFx(x, y) {
        for (var i = 0; i < 12; i++) {
            rainP.push({
                x: x, y: y,
                spd: 5 + Math.random() * 8,
                len: 12 + Math.random() * 18,
                a: 0.8 + Math.random() * 0.2,
                w: 1.5 + Math.random()
            });
        }
    }

    function triggerExplode() {
        game.exploding = true;
        explodeP = [];

        for (var i = 0; i < 120; i++) {
            var angle = (Math.PI * 2 / 120) * i + Math.random() * 0.3;
            var speed = 3 + Math.random() * 8;
            explodeP.push({
                x: drop.x,
                y: drop.y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                radius: 3 + Math.random() * 8,
                alpha: 0.9 + Math.random() * 0.1,
                color: Math.random() > 0.5 ? '#00ffff' : '#00ffcc',
                gravity: 0.15 + Math.random() * 0.1,
                shrink: 0.96 + Math.random() * 0.02
            });
        }

        for (var i = 0; i < 40; i++) {
            var angle = Math.random() * Math.PI * 2;
            var speed = 1 + Math.random() * 3;
            explodeP.push({
                x: drop.x,
                y: drop.y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                radius: 8 + Math.random() * 12,
                alpha: 0.6 + Math.random() * 0.3,
                color: '#88ffff',
                gravity: 0.1,
                shrink: 0.95 + Math.random() * 0.03
            });
        }

        setTimeout(function() {
            game.exploding = false;
            game.raining = true;
            rainOverlay.classList.add('show');
            cityGlow.classList.add('show');
            playRain();
            playWin();
            bright = 1;

            for (var i = 0; i < 250; i++) {
                rainP.push({
                    x: Math.random() * width,
                    y: -20 - Math.random() * height,
                    spd: 18 + Math.random() * 30,
                    len: 30 + Math.random() * 50,
                    a: 0.5 + Math.random() * 0.5,
                    w: 2 + Math.random()
                });
            }

            for (var i = 0; i < pollutants.length; i++) {
                pollutants[i].vx *= 5;
                pollutants[i].vy += 10;
            }

            setTimeout(function() {
                pollutants = [];

                setTimeout(function() {
                    game.raining = false;
                    game.rebuilding = true;
                    game.rebuildTimer = 0;
                    rainOverlay.classList.remove('show');
                    cityGlow.classList.remove('show');
                    rainP = [];
                    explodeP = [];
                    bright = 0;

                    game.count++;
                    purifyCount.textContent = '净化次数: ' + game.count;

                    game.trashTarget += 20;
                    game.trashEaten = 0;

                    cityIdx = (cityIdx + 1) % CITIES.length;
                    cityName.textContent = CITIES[cityIdx].name;

                    drop.x = width / 2;
                    drop.y = height / 2;
                    drop.tx = width / 2;
                    drop.ty = height / 2;
                    drop.radius = 15;
                    drop.bright = 0.5;
                    drop.vx = 0;
                    drop.vy = 0;
                    drop.trail = [];
                    drop.eating = false;
                    drop.eatT = 0;
                    drop.mouthOpen = 0;
                    game.level = 0;
                    updateProgress();

                    setTimeout(function() {
                        game.rebuilding = false;
                    }, 4000);
                }, 1500);
            }, 2000);
        }, 600);
    }

    function updateProgress() {
        var pct = Math.min(100, (game.trashEaten / game.trashTarget) * 100);
        purifyBar.style.width = pct + '%';
        document.getElementById('progress-label').textContent = 
            '净化进度: ' + game.trashEaten + ' / ' + game.trashTarget + ' 个';
        if (game.trashEaten >= game.trashTarget) {
            purifyBar.style.background = 'linear-gradient(90deg, #ffcc00 0%, #ffff00 50%, #ff9900 100%)';
            purifyBar.style.boxShadow = '0 0 25px rgba(255,255,0,0.9)';
        } else {
            purifyBar.style.background = 'linear-gradient(90deg, #00cccc 0%, #00ffff 50%, #00ffcc 100%)';
            purifyBar.style.boxShadow = '0 0 15px rgba(0,255,255,0.7)';
        }
    }

    function handleInput(e) {
        if (!game.playing) return;
        var rect = canvas.getBoundingClientRect();
        var cx, cy;
        if (e.touches) {
            cx = e.touches[0].clientX;
            cy = e.touches[0].clientY;
        } else {
            cx = e.clientX;
            cy = e.clientY;
        }
        drop.tx = cx - rect.left;
        drop.ty = cy - rect.top;
        if (!audioCtx) initAudio();
    }

    function loop() {
        ctx.clearRect(0, 0, width, height);
        drawBg();

        if (!game.paused) {
            if (!game.raining) {
                drawPollutants();
                if (game.rebuilding) {
                    game.rebuildTimer += 0.016;
                    var rate = Math.min(0.4, game.rebuildTimer * 0.15);
                    if (Math.random() < rate * 0.08) spawnPollutant();
                } else {
                    if (pollutants.length < 12 + game.count * 2) {
                        if (Math.random() < 0.02) spawnPollutant();
                    }
                }
            }

            drawRain();
            drawExplode();

            if (!game.exploding && !game.raining) {
                drawDrop();
            }

            checkCollisions();
        } else {
            drawPollutants();
            drawRain();
            drawExplode();
            if (!game.exploding && !game.raining) {
                drawDrop();
            }
        }

        requestAnimationFrame(loop);
    }

    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', handleInput);
    window.addEventListener('touchmove', function(e) { e.preventDefault(); handleInput(e); }, { passive: false });

    window.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' || e.key === ' ') {
            e.preventDefault();
            togglePause();
        }
    });

    window.onload = function() {
        initFloatItems();
        resize();
        loop();
    };
    </script>
</body>
</html>
