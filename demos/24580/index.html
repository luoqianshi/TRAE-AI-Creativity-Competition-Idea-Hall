<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI短线猎手 - 智能股票分析</title>
    <style>
/* ========================================
   AI 短线猎手 - 科技风深色主题样式
   ======================================== */

/* CSS Variables */
:root {
    --bg-primary: #05080f;
    --bg-secondary: #0a1628;
    --bg-card: #0d1a2d;
    --bg-card-hover: #122035;
    --accent: #00d4ff;
    --accent-dim: rgba(0, 212, 255, 0.15);
    --accent-glow: rgba(0, 212, 255, 0.4);
    --up: #ff3b5c;
    --up-bg: rgba(255, 59, 92, 0.12);
    --down: #00e676;
    --down-bg: rgba(0, 230, 118, 0.12);
    --neutral: #8b9dc3;
    --text-primary: #ffffff;
    --text-secondary: #8892a6;
    --text-muted: #5a6377;
    --border: rgba(0, 212, 255, 0.1);
    --border-hover: rgba(0, 212, 255, 0.25);
    --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.4);
    --glow-accent: 0 0 20px rgba(0, 212, 255, 0.3);
    --font-display: 'Orbitron', 'Noto Sans SC', sans-serif;
    --font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    --transition-fast: 0.2s ease;
    --transition-normal: 0.3s ease;
    --transition-slow: 0.5s ease;
    --spacing-xs: 8px;
    --spacing-sm: 12px;
    --spacing-md: 16px;
    --spacing-lg: 24px;
    --spacing-xl: 32px;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 24px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
    font-family: var(--font-body);
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
}

.app-container { max-width: 750px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 80px; }

.scanline {
    position: fixed; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: scanline 4s linear infinite; opacity: 0.3; z-index: 1000; pointer-events: none;
}
@keyframes scanline { 0% { top: 0; } 100% { top: 100vh; } }

.app-header {
    background: linear-gradient(180deg, var(--bg-secondary) 0%, transparent 100%);
    padding: var(--spacing-lg); position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
}

.header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-md); }
.market-status { display: flex; align-items: center; gap: var(--spacing-xs); }

.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--neutral); transition: var(--transition-normal); }
.status-dot.active { background: var(--up); box-shadow: 0 0 8px var(--up); animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.2); } }

.status-text { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
.current-time { font-family: var(--font-display); font-size: 0.875rem; color: var(--accent); letter-spacing: 1px; }

.app-title {
    font-family: var(--font-display); font-size: 1.75rem; font-weight: 700; color: var(--text-primary);
    display: flex; align-items: center; gap: var(--spacing-sm); margin-bottom: var(--spacing-xs);
}

.title-icon { font-size: 1.5rem; animation: flicker 2s ease-in-out infinite; }
@keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

.app-subtitle { font-size: 0.875rem; color: var(--text-secondary); letter-spacing: 2px; }
.main-content { padding: var(--spacing-md); position: relative; z-index: 1; }

.card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: var(--spacing-lg); margin-bottom: var(--spacing-lg); position: relative; overflow: hidden;
    transition: var(--transition-normal); animation: fadeInUp 0.5s ease forwards;
}

.card:nth-child(1) { animation-delay: 0.1s; }
.card:nth-child(2) { animation-delay: 0.2s; }
.card:nth-child(3) { animation-delay: 0.3s; }
.card:nth-child(4) { animation-delay: 0.4s; }
.card:nth-child(5) { animation-delay: 0.5s; }
.card:nth-child(6) { animation-delay: 0.6s; }

@keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.5;
}

.card:hover { border-color: var(--border-hover); box-shadow: var(--glow-accent); }

.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-lg); }

.card-title {
    font-family: var(--font-display); font-size: 1rem; font-weight: 500; color: var(--text-primary);
    display: flex; align-items: center; gap: var(--spacing-sm);
}

.title-decoration { width: 4px; height: 16px; background: var(--accent); border-radius: 2px; box-shadow: var(--glow-accent); }
.title-decoration.ai { background: linear-gradient(180deg, var(--accent), #0099cc); }
.title-decoration.strategy { background: linear-gradient(180deg, #ffa502, #ff6b35); }

.more-btn {
    background: transparent; border: none; color: var(--accent); font-size: 0.75rem;
    cursor: pointer; transition: var(--transition-fast); padding: var(--spacing-xs) var(--spacing-sm); border-radius: var(--radius-sm);
}
.more-btn:hover { background: var(--accent-dim); }

.signal-badge { background: var(--up-bg); color: var(--up); padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 500; }
.update-time { font-size: 0.75rem; color: var(--text-muted); }

.indices-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--spacing-md); }

.index-item {
    background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: var(--spacing-md); text-align: center; transition: var(--transition-normal); position: relative; overflow: hidden;
}

.index-item::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(135deg, transparent 40%, rgba(0, 212, 255, 0.05) 100%); pointer-events: none;
}

.index-item:hover { border-color: var(--accent); transform: translateY(-2px); }
.index-name { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 4px; }
.index-code { font-size: 0.625rem; color: var(--text-muted); font-family: var(--font-display); letter-spacing: 1px; }
.index-price { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; color: var(--text-primary); margin: 8px 0; }
.index-change { font-size: 0.75rem; font-weight: 500; }
.index-change.up { color: var(--up); }
.index-change.down { color: var(--down); }

.stocks-list { display: flex; flex-direction: column; gap: var(--spacing-md); }

.stock-item {
    background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: var(--spacing-md); display: flex; align-items: center; gap: var(--spacing-md);
    transition: var(--transition-normal); cursor: pointer;
}

.stock-item:hover { background: var(--bg-card-hover); border-color: var(--border-hover); transform: translateX(4px); }
.stock-item:active { transform: scale(0.98); }

.stock-info { flex: 1; min-width: 0; }
.stock-name { font-size: 1rem; font-weight: 500; color: var(--text-primary); margin-bottom: 2px; }
.stock-code { font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-display); letter-spacing: 0.5px; }

.stock-price-section { text-align: right; min-width: 90px; }
.stock-price { font-family: var(--font-display); font-size: 1rem; font-weight: 600; color: var(--text-primary); display: block; }
.stock-change { font-size: 0.75rem; font-weight: 500; display: block; margin-top: 2px; }
.stock-change.up { color: var(--up); }
.stock-change.down { color: var(--down); }

.watchlist-btn {
    width: 36px; height: 36px; background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 1.125rem; cursor: pointer; transition: var(--transition-fast); color: var(--text-muted);
}
.watchlist-btn:hover { border-color: var(--accent); color: var(--accent); }
.watchlist-btn.active { color: #ffd700; border-color: #ffd700; background: rgba(255, 215, 0, 0.1); }

.signals-list { display: flex; flex-direction: column; gap: var(--spacing-sm); }

.signal-item {
    background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: var(--spacing-md); display: flex; align-items: center; gap: var(--spacing-md);
    transition: var(--transition-normal);
}

.signal-item:hover { border-color: var(--border-hover); }

.signal-type {
    padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px; min-width: 56px; text-align: center;
}

.signal-type.buy { background: var(--down-bg); color: var(--down); box-shadow: 0 0 10px rgba(0, 230, 118, 0.2); }
.signal-type.sell { background: var(--up-bg); color: var(--up); box-shadow: 0 0 10px rgba(255, 59, 92, 0.2); }
.signal-type.alert { background: rgba(255, 165, 2, 0.12); color: #ffa502; box-shadow: 0 0 10px rgba(255, 165, 2, 0.2); }

.signal-content { flex: 1; }
.signal-stock { font-size: 0.9375rem; font-weight: 500; color: var(--text-primary); display: block; }
.signal-desc { font-size: 0.75rem; color: var(--text-secondary); margin-top: 2px; }

.signal-info { text-align: right; }
.signal-time { font-size: 0.75rem; color: var(--text-muted); display: block; }
.signal-price { font-family: var(--font-display); font-size: 0.875rem; color: var(--text-primary); font-weight: 500; }

.recommendations-list { display: flex; flex-direction: column; gap: var(--spacing-lg); }

.recommendation-item {
    background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: var(--spacing-lg); position: relative; overflow: hidden; transition: var(--transition-normal);
}

.recommendation-item::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--accent); }
.recommendation-item:hover { border-color: var(--border-hover); }

.rec-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: var(--spacing-md); }
.rec-stock-info { display: flex; align-items: center; gap: var(--spacing-sm); }
.rec-stock-name { font-size: 1.125rem; font-weight: 600; color: var(--text-primary); }
.rec-stock-code { font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-display); }

.rec-rating { padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
.rec-rating.strong-buy { background: var(--up-bg); color: var(--up); }
.rec-rating.buy { background: var(--down-bg); color: var(--down); }
.rec-rating.hold { background: var(--accent-dim); color: var(--accent); }
.rec-rating.cautious { background: rgba(255, 165, 2, 0.12); color: #ffa502; }

.rec-price-section { display: flex; align-items: center; gap: var(--spacing-md); margin-bottom: var(--spacing-md); }
.rec-price { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; color: var(--text-primary); }
.rec-change { font-size: 0.875rem; font-weight: 500; }
.rec-change.up { color: var(--up); }
.rec-change.down { color: var(--down); }

.confidence-section { flex: 1; }
.confidence-label { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 4px; display: flex; justify-content: space-between; }
.confidence-value { color: var(--accent); font-weight: 600; }

.confidence-bar { height: 6px; background: var(--bg-card); border-radius: 3px; overflow: hidden; }
.confidence-fill { height: 100%; border-radius: 3px; transition: width 1s ease; }
.confidence-fill.strong-buy { background: var(--up); }
.confidence-fill.buy { background: var(--down); }
.confidence-fill.hold { background: var(--accent); }
.confidence-fill.cautious { background: #ffa502; }

.rec-analysis {
    font-size: 0.875rem; color: var(--text-secondary); line-height: 1.7;
    margin-bottom: var(--spacing-md); padding: var(--spacing-md);
    background: var(--bg-card); border-radius: var(--radius-md); border-left: 2px solid var(--accent);
}

.rec-factors { display: flex; flex-wrap: wrap; gap: var(--spacing-xs); margin-bottom: var(--spacing-md); }
.factor-tag { background: var(--accent-dim); color: var(--accent); padding: 4px 12px; border-radius: 16px; font-size: 0.75rem; font-weight: 500; }

.rec-actions {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: var(--spacing-md); border-top: 1px solid var(--border);
}

.target-price { font-size: 0.875rem; color: #ffa502; }
.target-price strong { font-family: var(--font-display); font-size: 1.125rem; }

.btn-group { display: flex; gap: var(--spacing-sm); }

.btn {
    padding: 8px 20px; border-radius: 20px; font-size: 0.875rem; font-weight: 500;
    cursor: pointer; transition: var(--transition-fast); border: none; outline: none;
}

.btn-primary {
    background: linear-gradient(135deg, var(--accent), #0099cc);
    color: var(--bg-primary); box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4); }
.btn-primary:active { transform: scale(0.98); }

.btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
.btn-outline:hover { background: var(--accent-dim); }
.btn-outline.active { background: var(--accent); color: var(--bg-primary); }

.news-list { display: flex; flex-direction: column; gap: var(--spacing-md); }

.news-item {
    background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: var(--spacing-md); transition: var(--transition-normal); cursor: pointer;
}

.news-item:hover { border-color: var(--border-hover); background: var(--bg-card-hover); }

.news-header { display: flex; align-items: center; gap: var(--spacing-sm); margin-bottom: var(--spacing-xs); }

.news-tag {
    padding: 2px 10px; border-radius: 12px; font-size: 0.625rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px;
}

.news-tag.hot { background: var(--up-bg); color: var(--up); }
.news-tag.important { background: rgba(255, 165, 2, 0.12); color: #ffa502; }
.news-tag.tech { background: var(--accent-dim); color: var(--accent); }
.news-tag.consume { background: rgba(156, 39, 176, 0.12); color: #ce93d8; }
.news-tag.ai { background: rgba(233, 30, 99, 0.12); color: #f48fb1; }

.news-title { font-size: 0.9375rem; color: var(--text-primary); line-height: 1.5; margin-bottom: var(--spacing-xs); }
.news-meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); }

.strategy-card { background: linear-gradient(135deg, var(--bg-card) 0%, rgba(0, 212, 255, 0.05) 100%); }
.strategy-content { display: flex; gap: var(--spacing-lg); margin-bottom: var(--spacing-lg); }
.strategy-icon { font-size: 2.5rem; flex-shrink: 0; }

.strategy-text { flex: 1; }
.strategy-title { font-size: 1rem; font-weight: 600; color: var(--text-primary); margin-bottom: var(--spacing-xs); }
.strategy-desc { font-size: 0.875rem; color: var(--text-secondary); line-height: 1.7; }

.strategy-stats {
    display: flex; justify-content: space-around; padding-top: var(--spacing-lg);
    border-top: 1px solid var(--border);
}

.strategy-stat { text-align: center; }
.strategy-stat .stat-label { font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 4px; }
.strategy-stat .stat-value { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; color: var(--text-primary); }
.strategy-stat .stat-value.opportunity { color: var(--down); }

.tab-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(10, 22, 40, 0.95); backdrop-filter: blur(20px);
    border-top: 1px solid var(--border); display: flex; justify-content: space-around;
    padding: 8px 0; padding-bottom: max(8px, env(safe-area-inset-bottom)); z-index: 1000;
}

.tab-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 8px 16px; border-radius: var(--radius-md); transition: var(--transition-fast);
    cursor: pointer; color: var(--text-muted);
}

.tab-item:hover { color: var(--text-secondary); }
.tab-item.active { color: var(--accent); }
.tab-item.active .tab-icon { transform: scale(1.1); }

.tab-icon { font-size: 1.5rem; transition: var(--transition-fast); }
.tab-text { font-size: 0.625rem; font-weight: 500; letter-spacing: 0.5px; }

.toast {
    position: fixed; top: 100px; left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--bg-card); border: 1px solid var(--accent); border-radius: var(--radius-md);
    padding: 12px 24px; box-shadow: var(--glow-accent);
    opacity: 0; visibility: hidden; transition: var(--transition-normal); z-index: 2000;
}

.toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
.toast-content { color: var(--text-primary); font-size: 0.875rem; }

@media (max-width: 480px) {
    .app-header { padding: var(--spacing-md); }
    .app-title { font-size: 1.5rem; }
    .card { padding: var(--spacing-md); }
    .indices-grid { gap: var(--spacing-sm); }
    .rec-actions { flex-direction: column; gap: var(--spacing-md); }
    .btn-group { width: 100%; }
    .btn { flex: 1; }
}
    </style>

<body>
    <div class="app-container">
        <!-- 扫描线效果 -->
        <div class="scanline"></div>
        
        <!-- 头部区域 -->
        <header class="app-header">
            <div class="header-top">
                <div class="market-status">
                    <span class="status-dot" id="statusDot"></span>
                    <span class="status-text" id="statusText">加载中...</span>
                </div>
                <div class="current-time" id="currentTime">--:--:--</div>
            </div>
            <div class="header-content">
                <div class="logo-section">
                    <h1 class="app-title">
                        <span class="title-icon">⚡</span>
                        AI短线猎手
                    </h1>
                    <p class="app-subtitle">智能分析 · 精准捕捉 · 稳健收益</p>
                </div>
            </div>
        </header>

        <!-- 主要内容区域 -->
        <main class="main-content">
            <!-- 大盘指数 -->
            <section class="card market-indices">
                <div class="card-header">
                    <h2 class="card-title">
                        <span class="title-decoration"></span>
                        大盘指数
                    </h2>
                    <span class="update-time" id="updateTime">更新时间: --:--</span>
                </div>
                <div class="indices-grid" id="indicesGrid">
                    <!-- 动态生成 -->
                </div>
            </section>

            <!-- 热门股票 -->
            <section class="card hot-stocks">
                <div class="card-header">
                    <h2 class="card-title">
                        <span class="title-decoration"></span>
                        热门股票
                    </h2>
                    <button class="more-btn">查看更多 →</button>
                </div>
                <div class="stocks-list" id="stocksList">
                    <!-- 动态生成 -->
                </div>
            </section>

            <!-- AI信号 -->
            <section class="card ai-signals">
                <div class="card-header">
                    <h2 class="card-title">
                        <span class="title-decoration ai"></span>
                        AI信号提醒
                    </h2>
                    <div class="signal-badge">
                        <span id="signalCount">0</span> 条新信号
                    </div>
                </div>
                <div class="signals-list" id="signalsList">
                    <!-- 动态生成 -->
                </div>
            </section>

            <!-- AI推荐 -->
            <section class="card ai-recommendations">
                <div class="card-header">
                    <h2 class="card-title">
                        <span class="title-decoration ai"></span>
                        AI智能推荐
                    </h2>
                </div>
                <div class="recommendations-list" id="recommendationsList">
                    <!-- 动态生成 -->
                </div>
            </section>

            <!-- 财经资讯 -->
            <section class="card market-news">
                <div class="card-header">
                    <h2 class="card-title">
                        <span class="title-decoration"></span>
                        财经资讯
                    </h2>
                    <button class="more-btn">更多资讯 →</button>
                </div>
                <div class="news-list" id="newsList">
                    <!-- 动态生成 -->
                </div>
            </section>

            <!-- 策略卡片 -->
            <section class="card strategy-card">
                <div class="card-header">
                    <h2 class="card-title">
                        <span class="title-decoration strategy"></span>
                        今日策略
                    </h2>
                </div>
                <div class="strategy-content">
                    <div class="strategy-icon">🎯</div>
                    <div class="strategy-text">
                        <h3 class="strategy-title">AI短线策略建议</h3>
                        <p class="strategy-desc" id="strategyDesc">
                            正在分析市场数据...
                        </p>
                    </div>
                </div>
                <div class="strategy-stats">
                    <div class="strategy-stat">
                        <span class="stat-label">情绪指数</span>
                        <span class="stat-value" id="sentimentValue">--</span>
                    </div>
                    <div class="strategy-stat">
                        <span class="stat-label">波动指数</span>
                        <span class="stat-value" id="volatilityValue">--</span>
                    </div>
                    <div class="strategy-stat">
                        <span class="stat-label">机会评级</span>
                        <span class="stat-value opportunity" id="opportunityLevel">--</span>
                    </div>
                </div>
            </section>
        </main>

        <!-- 底部导航 -->
        <nav class="tab-bar">
            <div class="tab-item active" data-tab="market">
                <div class="tab-icon">📊</div>
                <span class="tab-text">行情</span>
            </div>
            <div class="tab-item" data-tab="ai">
                <div class="tab-icon">🤖</div>
                <span class="tab-text">AI分析</span>
            </div>
            <div class="tab-item" data-tab="watchlist">
                <div class="tab-icon">⭐</div>
                <span class="tab-text">自选</span>
            </div>
            <div class="tab-item" data-tab="profile">
                <div class="tab-icon">👤</div>
                <span class="tab-text">我的</span>
            </div>
        </nav>

        <!-- Toast提示 -->
        <div class="toast" id="toast">
            <span class="toast-content"></span>
        </div>
    </div>

    <script>
const marketIndices = [
    { name: '上证指数', code: '000001', price: 3256.42, change: 1.25, changePercent: 0.04 },
    { name: '深证成指', code: '399001', price: 10587.63, change: -23.45, changePercent: -0.22 },
    { name: '创业板指', code: '399006', price: 2187.35, change: 15.67, changePercent: 0.72 },
    { name: '科创50', code: '000688', price: 1023.89, change: 8.92, changePercent: 0.88 }
];

const hotStocks = [
    { code: '600519', name: '贵州茅台', price: 1688.00, change: 28.50, changePercent: 1.72 },
    { code: '000858', name: '五粮液', price: 148.50, change: -2.30, changePercent: -1.53 },
    { code: '601318', name: '中国平安', price: 48.92, change: 0.85, changePercent: 1.77 },
    { code: '002594', name: '比亚迪', price: 256.80, change: 12.30, changePercent: 5.02 },
    { code: '300750', name: '宁德时代', price: 218.50, change: 5.60, changePercent: 2.63 },
    { code: '601899', name: '紫金矿业', price: 15.23, change: -0.35, changePercent: -2.25 }
];

const tradingSignals = [
    { type: 'buy', code: '002594', name: '比亚迪', time: '10:35', signal: '金叉买入', price: 245.50 },
    { type: 'buy', code: '300750', name: '宁德时代', time: '10:58', signal: '突破买入', price: 215.00 },
    { type: 'alert', code: '601318', name: '中国平安', time: '11:12', signal: '成交量异常', price: 48.20 },
    { type: 'sell', code: '000858', name: '五粮液', time: '11:25', signal: '死叉卖出', price: 150.80 }
];

const aiRecommendations = [
    { code: '002594', name: '比亚迪', price: 256.80, change: 12.30, changePercent: 5.02, rating: '强烈买入', ratingClass: 'strong-buy', confidence: 92, targetPrice: 320.00, analysis: 'AI分析显示，该股近期资金持续流入，技术面形成金叉信号，预计未来30天内上涨概率达85%。建议关注新能源汽车板块整体表现。', factors: ['资金流入', '技术金叉', '政策利好', '业绩预增'] },
    { code: '300750', name: '宁德时代', price: 218.50, change: 5.60, changePercent: 2.63, rating: '买入', ratingClass: 'buy', confidence: 85, targetPrice: 260.00, analysis: 'AI模型预测，锂电池行业需求持续增长，公司订单充足，盈利能力稳步提升。短期目标价260元。', factors: ['行业景气', '订单增长', '技术领先', '估值合理'] },
    { code: '600519', name: '贵州茅台', price: 1688.00, change: 28.50, changePercent: 1.72, rating: '持有', ratingClass: 'hold', confidence: 78, targetPrice: 1750.00, analysis: 'AI综合分析显示，白酒板块整体稳健，公司基本面良好，但短期涨幅较大，建议观望等待回调机会。', factors: ['基本面稳健', '估值较高', '消费复苏', '分红稳定'] },
    { code: '000858', name: '五粮液', price: 148.50, change: -2.30, changePercent: -1.53, rating: '谨慎', ratingClass: 'cautious', confidence: 65, targetPrice: 140.00, analysis: 'AI监测到近期资金流出明显，技术指标走弱，建议暂时观望，等待企稳信号出现。', factors: ['资金流出', '技术走弱', '短期承压', '等待时机'] }
];

const newsList = [
    { title: '新能源汽车销量创新高，比亚迪领跑市场', source: '东方财富', time: '10分钟前', tag: '热门', tagClass: 'hot' },
    { title: '央行宣布降准0.5个百分点，释放长期资金1万亿', source: '证券时报', time: '30分钟前', tag: '重磅', tagClass: 'important' },
    { title: '宁德时代发布新型电池技术，续航里程突破1000公里', source: '同花顺', time: '1小时前', tag: '科技', tagClass: 'tech' },
    { title: '白酒板块集体走强，贵州茅台再创年内新高', source: '新浪财经', time: '2小时前', tag: '消费', tagClass: 'consume' },
    { title: 'AI概念股持续火爆，多只个股涨停', source: '每日经济新闻', time: '3小时前', tag: 'AI', tagClass: 'ai' }
];

const strategyData = { sentiment: 72, volatility: 45, opportunity: '高', description: '今日市场整体偏暖，建议关注新能源、半导体板块。AI模型显示，市场情绪指数为72，处于偏乐观区间。' };
let watchlist = [];

function formatPrice(price) { return price.toFixed(2); }
function formatChange(change) { const prefix = change >= 0 ? '+' : ''; return prefix + change.toFixed(2); }
function formatPercent(percent) { const prefix = percent >= 0 ? '+' : ''; return prefix + percent.toFixed(2) + '%'; }
function getTrendClass(change) { if (change > 0) return 'up'; if (change < 0) return 'down'; return ''; }
function getSignalTypeLabel(type) { const types = { buy: '买入', sell: '卖出', alert: '预警' }; return types[type] || type; }

function isInWatchlist(code) { return watchlist.some(item => item.code === code); }
function addToWatchlist(stock) { if (!isInWatchlist(stock.code)) { watchlist.push(stock); saveWatchlist(); return true; } return false; }
function removeFromWatchlist(code) { watchlist = watchlist.filter(item => item.code !== code); saveWatchlist(); }
function saveWatchlist() { try { localStorage.setItem('aiStockHunter_watchlist', JSON.stringify(watchlist)); } catch (e) { console.warn('无法保存自选股:', e); } }
function loadWatchlist() { try { const saved = localStorage.getItem('aiStockHunter_watchlist'); if (saved) { watchlist = JSON.parse(saved); } } catch (e) { console.warn('无法加载自选股:', e); } }

function showToast(message, duration = 2000) {
    const toast = document.getElementById('toast');
    const content = toast.querySelector('.toast-content');
    content.textContent = message;
    toast.classList.add('show');
    setTimeout(() => { toast.classList.remove('show'); }, duration);
}

function renderIndices() {
    const grid = document.getElementById('indicesGrid');
    grid.innerHTML = marketIndices.map(index => `<div class="index-item"><div class="index-name">${index.name}</div><div class="index-code">${index.code}</div><div class="index-price">${formatPrice(index.price)}</div><div class="index-change ${getTrendClass(index.change)}">${formatChange(index.change)} (${formatPercent(index.changePercent)})</div></div>`).join('');
}

function renderStocks() {
    const list = document.getElementById('stocksList');
    list.innerHTML = hotStocks.map(stock => {
        const isWatched = isInWatchlist(stock.code);
        return `<div class="stock-item" data-code="${stock.code}"><div class="stock-info"><div class="stock-name">${stock.name}</div><div class="stock-code">${stock.code}</div></div><div class="stock-price-section"><span class="stock-price">${formatPrice(stock.price)}</span><span class="stock-change ${getTrendClass(stock.change)}">${formatPercent(stock.changePercent)}</span></div><button class="watchlist-btn ${isWatched ? 'active' : ''}" data-code="${stock.code}" onclick="toggleWatchlist(event, '${stock.code}')">${isWatched ? '★' : '☆'}</button></div>`;
    }).join('');
}

function renderSignals() {
    const list = document.getElementById('signalsList');
    document.getElementById('signalCount').textContent = tradingSignals.length;
    list.innerHTML = tradingSignals.map(signal => `<div class="signal-item"><span class="signal-type ${signal.type}">${getSignalTypeLabel(signal.type)}</span><div class="signal-content"><span class="signal-stock">${signal.name}</span><span class="signal-desc">${signal.signal}</span></div><div class="signal-info"><span class="signal-time">${signal.time}</span><span class="signal-price">¥${formatPrice(signal.price)}</span></div></div>`).join('');
}

function renderRecommendations() {
    const list = document.getElementById('recommendationsList');
    list.innerHTML = aiRecommendations.map(rec => {
        const isWatched = isInWatchlist(rec.code);
        return `<div class="recommendation-item"><div class="rec-header"><div class="rec-stock-info"><span class="rec-stock-name">${rec.name}</span><span class="rec-stock-code">${rec.code}</span></div><span class="rec-rating ${rec.ratingClass}">${rec.rating}</span></div><div class="rec-price-section"><span class="rec-price ${getTrendClass(rec.change)}">¥${formatPrice(rec.price)}</span><span class="rec-change ${getTrendClass(rec.change)}">${formatPercent(rec.changePercent)}</span><div class="confidence-section"><div class="confidence-label"><span>置信度</span><span class="confidence-value">${rec.confidence}%</span></div><div class="confidence-bar"><div class="confidence-fill ${rec.ratingClass}" style="width: ${rec.confidence}%"></div></div></div></div><div class="rec-analysis">${rec.analysis}</div><div class="rec-factors">${rec.factors.map(f => `<span class="factor-tag">${f}</span>`).join('')}</div><div class="rec-actions"><span class="target-price">目标价: <strong>¥${formatPrice(rec.targetPrice)}</strong></span><div class="btn-group"><button class="btn btn-outline ${isWatched ? 'active' : ''}" onclick="toggleWatchlist(event, '${rec.code}', '${rec.name}', ${rec.price}, ${rec.change}, ${rec.changePercent})">${isWatched ? '已自选' : '+ 自选'}</button><button class="btn btn-primary" onclick="viewDetail('${rec.name}')">查看详情</button></div></div></div>`;
    }).join('');
}

function renderNews() {
    const list = document.getElementById('newsList');
    list.innerHTML = newsList.map(news => `<div class="news-item"><div class="news-header">${news.tag ? `<span class="news-tag ${news.tagClass}">${news.tag}</span>` : ''}</div><div class="news-title">${news.title}</div><div class="news-meta"><span>${news.source}</span><span>${news.time}</span></div></div>`).join('');
}

function renderStrategy() {
    document.getElementById('strategyDesc').textContent = strategyData.description;
    document.getElementById('sentimentValue').textContent = strategyData.sentiment;
    document.getElementById('volatilityValue').textContent = strategyData.volatility;
    document.getElementById('opportunityLevel').textContent = strategyData.opportunity;
}

function toggleWatchlist(event, code, name, price, change, changePercent) {
    event.stopPropagation();
    const stock = name ? { code, name, price, change, changePercent } : hotStocks.find(s => s.code === code);
    if (isInWatchlist(code)) {
        removeFromWatchlist(code);
        showToast(`已从自选移除 ${stock.name}`);
    } else {
        addToWatchlist(stock);
        showToast(`已添加 ${stock.name} 到自选`);
    }
    renderStocks();
    renderRecommendations();
}

function viewDetail(name) { showToast(`查看 ${name} 详情`); }

function updateTime() {
    const now = new Date();
    document.getElementById('currentTime').textContent = now.toLocaleTimeString('zh-CN');
    const updateTimeStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    const updateTimeEl = document.getElementById('updateTime');
    if (updateTimeEl) { updateTimeEl.textContent = `更新时间: ${updateTimeStr}`; }
    const hours = now.getHours();
    const minutes = now.getMinutes();
    const isOpen = (hours >= 9 && hours < 11) || (hours === 11 && minutes <= 30) || (hours >= 13 && hours < 15);
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    if (isOpen) { statusDot.classList.add('active'); statusText.textContent = '交易中'; }
    else { statusDot.classList.remove('active'); statusText.textContent = '已收盘'; }
}

function initTabs() {
    const tabItems = document.querySelectorAll('.tab-item');
    tabItems.forEach(item => {
        item.addEventListener('click', () => {
            tabItems.forEach(t => t.classList.remove('active'));
            item.classList.add('active');
            const tab = item.dataset.tab;
            const names = { market: '行情', ai: 'AI分析', watchlist: '自选', profile: '我的' };
            showToast(`切换到${names[tab] || tab}`);
        });
    });
}

function init() {
    loadWatchlist();
    renderIndices();
    renderStocks();
    renderSignals();
    renderRecommendations();
    renderNews();
    renderStrategy();
    updateTime();
    setInterval(updateTime, 1000);
    initTabs();
    
    document.querySelectorAll('.stock-item').forEach(item => {
        item.addEventListener('click', (e) => {
            if (!e.target.classList.contains('watchlist-btn')) {
                const code = item.dataset.code;
                const stock = hotStocks.find(s => s.code === code);
                if (stock) { showToast(`查看 ${stock.name} 详情`); }
            }
        });
    });
    
    document.querySelectorAll('.news-item').forEach(item => {
        item.addEventListener('click', () => { showToast('加载新闻详情...'); });
    });
    
    console.log('AI 短线猎手初始化完成');
}

if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); }
else { init(); }
    </script>
</body>
</html>
