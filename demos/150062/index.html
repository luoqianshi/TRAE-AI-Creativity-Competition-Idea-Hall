<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>星语树洞 - 把烦恼交给星星</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/pages/home.css">
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
</head>
<body>
  <div class="page-container" id="home-page">
    <div class="stars-container" id="stars-container"></div>
    <div class="clouds-container" id="clouds-container"></div>
    
    <header class="header">
      <h1 class="title">星语树洞</h1>
      <p class="subtitle">把烦恼交给星星</p>
    </header>
    
    <main class="main-content">
      <div class="cards-grid" id="cards-grid">
        <div class="feature-card glass-card" data-page="tree-hole">
          <div class="card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <path d="M8 12h8"/>
              <path d="M8 8h8"/>
            </svg>
          </div>
          <h3 class="card-title">树洞日记</h3>
          <p class="card-description">写下你的烦恼，让星星带走它们</p>
        </div>
        
        <div class="feature-card glass-card" data-page="white-noise">
          <div class="card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 18V5l12-2v13"/>
              <circle cx="6" cy="18" r="3"/>
              <circle cx="18" cy="16" r="3"/>
            </svg>
          </div>
          <h3 class="card-title">白噪音空间</h3>
          <p class="card-description">雨声、篝火、海浪，治愈你的心灵</p>
        </div>
        
        <div class="feature-card glass-card" data-page="breath">
          <div class="card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 8v4"/>
              <path d="M12 16h.01"/>
            </svg>
          </div>
          <h3 class="card-title">呼吸引导</h3>
          <p class="card-description">4-7-8呼吸法，平复你的情绪</p>
        </div>
        
        <div class="feature-card glass-card" data-page="gallery">
          <div class="card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="M21 15l-5-5L5 21"/>
            </svg>
          </div>
          <h3 class="card-title">治愈画廊</h3>
          <p class="card-description">欣赏治愈系风景，放松身心</p>
        </div>
      </div>
    </main>
    
    <footer class="footer">
      <div class="mood-check-btn glass-card" data-page="mood-check">
        <div class="mood-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
          </svg>
        </div>
        <span class="mood-text">情绪打卡</span>
      </div>
      
      <div class="animal-decoration" id="animal-decoration">
        <div class="cat">
          <div class="cat-face">
            <div class="cat-ear cat-ear-left"></div>
            <div class="cat-ear cat-ear-right"></div>
            <div class="cat-eye cat-eye-left"></div>
            <div class="cat-eye cat-eye-right"></div>
            <div class="cat-nose"></div>
            <div class="cat-mouth"></div>
            <div class="cat-whisker cat-whisker-left"></div>
            <div class="cat-whisker cat-whisker-right"></div>
          </div>
        </div>
      </div>
    </footer>
  </div>
  
  <script src="scripts/pages/home.js"></script>
</body>
</html>
