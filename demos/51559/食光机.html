    this.foodCategory = 'all';
    this._tipTags = ['general'];
    this._quoteShown = [];
    this.init();
  }

  App.prototype.init = function() {
    // ===== 个人数据初始化：首次加载本版本时清空所有用户数据，确保初始为空状态 =====
    // 通过版本标记避免重复清空；如需再次重置，修改 APP_VERSION 即可
    var INIT_FLAG = 'sgj_data_init_v_' + APP_VERSION;
    if (!localStorage.getItem(INIT_FLAG)) {
      try {
        localStorage.removeItem(STORAGE_KEY);        // 餐食记录
        localStorage.removeItem(PROFILE_KEY);        // 个人资料
        localStorage.removeItem(BADGE_KEY);          // 成就徽章
        localStorage.removeItem(FEEDBACK_KEY);       // 反馈记录
        localStorage.removeItem(FOOD_REQUEST_KEY);   // 食物申请
        localStorage.removeItem(DEV_LOG_KEY);        // 开发者日志
        localStorage.removeItem('sgj_themes_tried'); // 主题试用记录
        // 重置主题为裁纸（初始主题），忽略历史偏好
        localStorage.removeItem('sgj_theme');
        localStorage.removeItem('sgj_mode');
        localStorage.setItem(INIT_FLAG, '1');
      } catch (e) {}
    }
    ThemeManager.init();
    this.meals = StorageManager.getMeals();
    this._updateExistingMealRisks();
    this._updateTimeInput();
    this.bindEvents();
    this.renderFoodCards();
    this.render();
    this._updateProfile();
    this.renderFeedbackList();
    this.renderFoodRequestList();
    this._initApplyFoodBtn();
    this._initDevLogPanel();
    this._initThemeUI();
    this._initProfileEditor();
    this.renderBadges();
    this.renderHistoryList();
    this._initHistoryActions();
    this._checkBadges();
    this._renderQuotes(true);
    // 倒计时每分钟刷新
    var _self = this;
    setInterval(function() { _self._refreshCountdowns(); }, 60000);
    // 名句每10秒切换一条
    setInterval(function() { _self._renderQuotes(false); }, 10000);
  };

  // 根据当前 tipTags 筛选并切换名句，每10秒一条，带淡入淡出
  App.prototype._renderQuotes = function(immediate) {
    var el = document.getElementById('quotesText');
    var tlEl = document.getElementById('timelineQuote');
    if (!el && !tlEl) return;
    // 按 tipTags 优先筛选匹配的名句
    var matched = [], general = [];
    var tags = this._tipTags || ['general'];
    for (var i = 0; i < FOOD_QUOTES.length; i++) {
      var q = FOOD_QUOTES[i];
      var hit = false;
      for (var j = 0; j < q.tags.length; j++) {
        if (tags.indexOf(q.tags[j]) !== -1) { hit = true; break; }
      }
      if (hit) matched.push(i);
      if (q.tags.indexOf('general') !== -1) general.push(i);
    }
    var pool = matched.length >= 3 ? matched : matched.concat(general);
    if (pool.length === 0) pool = general;
    var available = [];
    for (var k = 0; k < pool.length; k++) {
      if (this._quoteShown.indexOf(pool[k]) === -1) available.push(pool[k]);
    }
    if (available.length === 0) { this._quoteShown = []; available = pool.slice(); }
    var nextIdx = available[Math.floor(Math.random() * available.length)];
    this._quoteShown.push(nextIdx);
    if (this._quoteShown.length > Math.ceil(pool.length * 0.6)) this._quoteShown.shift();
    var next = FOOD_QUOTES[nextIdx];

    function applyTo(nodeText, nodeAuthor) {
      if (!nodeText || !nodeAuthor) return;
      nodeText.textContent = next.text;
      nodeAuthor.textContent = '— ' + next.author;
    }

    function setText(node, val) {
      if (node) node.textContent = val;
    }

    if (immediate) {
      var qt = el && el.querySelector('.q-text');
      var qa = el && el.querySelector('.q-author');
      if (el && !qt) { el.innerHTML = '<span class="q-text"></span><span class="q-author"></span>'; qt = el.querySelector('.q-text'); qa = el.querySelector('.q-author'); }
      setText(qt, next.text); setText(qa, '— ' + next.author);
      if (tlEl) { var tqt = tlEl.querySelector('.q-text'); var tqa = tlEl.querySelector('.q-author'); setText(tqt, next.text); setText(tqa, '— ' + next.author); }
    } else {
      var doUpdate = function() {
        var qt2 = el && el.querySelector('.q-text');
        var qa2 = el && el.querySelector('.q-author');
        if (el && !qt2) { el.innerHTML = '<span class="q-text"></span><span class="q-author"></span>'; qt2 = el.querySelector('.q-text'); qa2 = el.querySelector('.q-author'); }
        setText(qt2, next.text); setText(qa2, '— ' + next.author);
        if (el) el.classList.remove('fade-out');
        if (tlEl) { var tqt2 = tlEl.querySelector('.q-text'); var tqa2 = tlEl.querySelector('.q-author'); setText(tqt2, next.text); setText(tqa2, '— ' + next.author); }
      };
      if (el) {
        el.classList.add('fade-out');
        setTimeout(doUpdate, 400);
      } else {
        doUpdate();
      }
    }
  };

  App.prototype._refreshCountdowns = function() {
    var nodes = document.querySelectorAll('.c-countdown');
    if (!nodes.length) return;
    var now = Date.now();
    nodes.forEach(function(el) {
      var edibleAt = parseInt(el.dataset.edibleAt, 10);
      var remain = edibleAt - now;
      if (remain <= 0) {
        var parent = el.parentNode;
        var done = document.createElement('span');
        done.className = 'c-countdone';
        done.textContent = '✅ 可食用';
        parent.replaceChild(done, el);
      } else {
        var hh = Math.floor(remain / 3600000);
        var mm = Math.floor((remain % 3600000) / 60000);
        el.textContent = '⏳ 还需 ' + hh + 'h' + mm + 'm 可食';
      }
    });
  };

  App.prototype._initThemeUI = function() {
    var self = this;
    // 主题选择
    var themeGrid = document.getElementById('themeGrid');
    if (themeGrid) {
      themeGrid.querySelectorAll('.theme-option').forEach(function(opt) {
        if (opt.dataset.themeValue === ThemeManager.theme) opt.classList.add('active');
        else opt.classList.remove('active');
        opt.addEventListener('click', function() {
          SoundManager.play('theme');
          themeGrid.querySelectorAll('.theme-option').forEach(function(o) { o.classList.remove('active'); });
          opt.classList.add('active');
          ThemeManager.setTheme(opt.dataset.themeValue);
          // 记录尝试过的主题（用于勋章）
          try {
            var tried = JSON.parse(localStorage.getItem('sgj_themes_tried') || '[]');
            if (tried.indexOf(opt.dataset.themeValue) === -1) {
              tried.push(opt.dataset.themeValue);
              localStorage.setItem('sgj_themes_tried', JSON.stringify(tried));
            }
          } catch (e) {}
          self._checkBadges();
        });
      });
    }
    // 模式切换：事件委托，更稳定兼容手机端
    var modeToggle = document.getElementById('modeToggle');
    if (modeToggle) {
      // 初始化 active 状态
      modeToggle.querySelectorAll('.mode-btn').forEach(function(btn) {
        if (btn.dataset.modeValue === ThemeManager.mode) btn.classList.add('active');
        else btn.classList.remove('active');
      });
      Logger.log('ModeUI.bind', 'found ' + modeToggle.querySelectorAll('.mode-btn').length + ' buttons, current=' + ThemeManager.mode);
      modeToggle.addEventListener('click', function(e) {
        Logger.log('ModeUI.click', 'target=' + (e.target && e.target.tagName) + ' text=' + (e.target && e.target.textContent));
        var btn = e.target.closest('.mode-btn');
        if (!btn) {
          Logger.log('ModeUI.click', 'no .mode-btn matched', 'warn');
          return;
        }
        if (!modeToggle.contains(btn)) return;
        var val = btn.dataset.modeValue;
        Logger.log('ModeUI.click', 'btn data-mode-value=' + val, 'ok');
        SoundManager.play('toggle');
        modeToggle.querySelectorAll('.mode-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        ThemeManager.setMode(val);
      });
      // 监听 mode 变化后再次校验 active 状态
      var verifyActive = function() {
        var matched = false;
        modeToggle.querySelectorAll('.mode-btn').forEach(function(btn) {
          var isMatch = btn.dataset.modeValue === ThemeManager.mode;
          btn.classList.toggle('active', isMatch);
          if (isMatch) matched = true;
        });
        Logger.log('ModeUI.verify', 'matched=' + matched + ' mode=' + ThemeManager.mode);
      };
      setTimeout(verifyActive, 0);
    } else {
      Logger.log('ModeUI.bind', '#modeToggle not found!', 'error');
    }
    // 音效开关
    var soundToggle = document.getElementById('soundToggle');
    var soundToggleItem = document.getElementById('soundToggleItem');
    if (soundToggle) {
      if (ThemeManager.soundEnabled) soundToggle.classList.add('active');
      else soundToggle.classList.remove('active');
      soundToggleItem.addEventListener('click', function() {
        var enabled = ThemeManager.toggleSound();
        soundToggle.classList.toggle('active', enabled);
        if (enabled) SoundManager.play('toggle');
      });
    }
    // 系统颜色变化监听
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
        if (ThemeManager.mode === 'system') ThemeManager.apply();
      });
    }
  };

  App.prototype._updateTimeInput = function() {
    // 重置为"现在"状态：清空自定义时间，timeText 显示"现在"
    this._customTime = '';
    var timeText = document.getElementById('timeText');
    if (timeText) timeText.textContent = '现在';
  };

  // 获取当前生效的时间字符串（优先自定义时间，否则实时现在）
  App.prototype._getCurrentTimeStr = function() {
    if (this._customTime) return this._customTime;
    var now = new Date();
    return String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  };

  App.prototype._parseTime = function(timeStr) {
    var parts = timeStr.split(':');
    var d = new Date();
    d.setHours(parseInt(parts[0], 10) || 0);
    d.setMinutes(parseInt(parts[1], 10) || 0);
    d.setSeconds(0); d.setMilliseconds(0);
    return d;
  };

  App.prototype.bindEvents = function() {
    var self = this;
    var recordBtn = document.getElementById('recordBtn');
    var foodInput = document.getElementById('foodInput');
    var bottomNav = document.querySelector('.bottom-nav-inner');
    var searchInput = document.getElementById('searchInput');
    var timeText = document.getElementById('timeText');

    recordBtn.addEventListener('click', function() { SoundManager.play('record'); self.handleRecord(); });

    foodInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') self.handleRecord(); });

    // 首字母搜索自动补全
    var foodSuggest = document.getElementById('foodSuggest');
    var _sgIndex = -1;
    var _sgItems = [];
    function _renderSuggest(list) {
      if (!foodSuggest) return;
      foodSuggest.innerHTML = '';
      _sgItems = list;
      _sgIndex = -1;
      if (!list.length) {
        var empty = document.createElement('div');
        empty.className = 'food-suggest-empty';
        empty.textContent = '暂无匹配食物';
        foodSuggest.appendChild(empty);
        foodSuggest.classList.add('active');
        return;
      }
      list.forEach(function(item, i) {
        var row = document.createElement('div');
        row.className = 'food-suggest-item';
        row.innerHTML =
          '<span class="s-emoji">' + item.emoji + '</span>' +
          '<span class="s-name">' + item.name + '</span>' +
          (item.pinyin ? '<span class="s-pinyin">' + item.pinyin.toUpperCase() + '</span>' : '');
        row.addEventListener('mousedown', function(ev) {
          ev.preventDefault();
          foodInput.value = item.name;
          foodSuggest.classList.remove('active');
          SoundManager.play('click');
          foodInput.focus();
        });
        foodSuggest.appendChild(row);
      });
      foodSuggest.classList.add('active');
    }
    if (foodInput && foodSuggest) {
      var foodInputClear = document.getElementById('foodInputClear');
      foodInput.addEventListener('input', function() {
        var v = foodInput.value;
        if (foodInputClear) foodInputClear.classList.toggle('visible', !!v);
        if (!v || !v.trim()) { foodSuggest.classList.remove('active'); return; }
        var list = matchFoodSuggestions(v);
        if (list.length) _renderSuggest(list);
        else foodSuggest.classList.remove('active');
      });
      if (foodInputClear) {
        foodInputClear.addEventListener('click', function() {
          foodInput.value = '';
          foodInputClear.classList.remove('visible');
          foodSuggest.classList.remove('active');
          SoundManager.play('click');
          foodInput.focus();
        });
      }
      foodInput.addEventListener('keydown', function(e) {
        if (!foodSuggest.classList.contains('active')) return;
        var rows = foodSuggest.querySelectorAll('.food-suggest-item');
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          _sgIndex = Math.min(_sgIndex + 1, rows.length - 1);
          rows.forEach(function(r, i) { r.classList.toggle('selected', i === _sgIndex); });
          if (rows[_sgIndex]) rows[_sgIndex].scrollIntoView({ block: 'nearest' });
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          _sgIndex = Math.max(_sgIndex - 1, 0);
          rows.forEach(function(r, i) { r.classList.toggle('selected', i === _sgIndex); });
          if (rows[_sgIndex]) rows[_sgIndex].scrollIntoView({ block: 'nearest' });
        } else if (e.key === 'Enter' && _sgIndex >= 0 && _sgItems[_sgIndex]) {
          e.preventDefault();
          foodInput.value = _sgItems[_sgIndex].name;
          foodSuggest.classList.remove('active');
          SoundManager.play('click');
        } else if (e.key === 'Escape') {
          foodSuggest.classList.remove('active');
        }
      });
      foodInput.addEventListener('blur', function() {
        setTimeout(function() { if (foodSuggest) foodSuggest.classList.remove('active'); }, 180);
      });
    }

    var timeChip = document.getElementById('timeChip');
    if (timeChip) {
      timeChip.addEventListener('click', function() {
        SoundManager.play('click');
        var initial = self._customTime || self._getCurrentTimeStr();
        TimePicker.open(initial, function(val) {
          self._customTime = val;
          if (timeText) timeText.textContent = val;
        });
      });
    }

    var groupTabs = document.getElementById('groupTabs');
    if (groupTabs) {
      groupTabs.addEventListener('click', function(e) {
        var target = e.target.closest('.group-tab');
        if (!target) return;
        SoundManager.play('toggle');
        self.currentGroup = target.dataset.group;
        groupTabs.querySelectorAll('.group-tab').forEach(function(tab) { tab.classList.remove('active'); });
        target.classList.add('active');
        self.renderTimeline();
      });
    }

    // 可折叠卡片（反馈卡片等）
    document.querySelectorAll('.collapsible-card .settings-card-title').forEach(function(title) {
      title.addEventListener('click', function() {
        SoundManager.play('toggle');
        title.closest('.collapsible-card').classList.toggle('collapsed');
      });
    });

    bottomNav.addEventListener('click', function(e) {
      var target = e.target.closest('.nav-item');
      if (!target) return;
      SoundManager.play('nav');
      self.switchPage(target.dataset.page);
    });

    searchInput.addEventListener('input', function(e) {
      self.searchKeyword = e.target.value.trim();
      var searchInputClear = document.getElementById('searchInputClear');
      if (searchInputClear) searchInputClear.classList.toggle('visible', !!e.target.value);
      self.renderFoodCards();
    });
    var searchInputClear = document.getElementById('searchInputClear');
    if (searchInputClear) {
      searchInputClear.addEventListener('click', function() {
        searchInput.value = '';
        self.searchKeyword = '';
        searchInputClear.classList.remove('visible');
        SoundManager.play('click');
        self.renderFoodCards();
        searchInput.focus();
      });
    }

    var filterTabs = document.getElementById('filterTabs');
    if (filterTabs) {
      filterTabs.addEventListener('click', function(e) {
        var tab = e.target.closest('.filter-tab');
        if (!tab) return;
        SoundManager.play('toggle');
        self.foodCategory = tab.dataset.cat;
        filterTabs.querySelectorAll('.filter-tab').forEach(function(t) { t.classList.remove('active'); });
        tab.classList.add('active');
        self.renderFoodCards();
      });
    }

    // 设置项
    document.querySelectorAll('.settings-item[data-action]').forEach(function(item) {
      item.addEventListener('click', function() {
        SoundManager.play('click');
        var action = item.dataset.action;
        var titles = { stats: '饮食统计', advice: '饮食建议', about: '关于食光机' };
        self._showToast(titles[action] + ' 暂未开放');
      });
    });
  };

  App.prototype.switchPage = function(page) {
    this.currentPage = page;
    document.querySelectorAll('.nav-item').forEach(function(item) { item.classList.toggle('active', item.dataset.page === page); });
    document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
    var pageEl = document.getElementById('page-' + page);
    if (pageEl) pageEl.classList.add('active');
    if (page === 'home') this._updateTimeInput();
    if (page === 'query') {
      // 切换到查询页时重新渲染，确保字母表 padding-bottom 按真实视口高度计算
      this.renderFoodCards();
    }
    if (page === 'profile') {
      this._updateProfile();
      this.renderFeedbackList();
      this.renderBadges();
      this.renderHistoryList();
      this._checkBadges();
    }
  };

  // ========== 记录饮食 ==========
  App.prototype.handleRecord = function() {
    var input = document.getElementById('foodInput');
    var name = input.value.trim();
    if (!name) { input.focus(); return; }
    if (!isKnownFood(name)) {
      SoundManager.play('delete');
      this._showToast('不在食物库内，无法记录');
      input.focus();
      return;
    }

    var timeStr = this._getCurrentTimeStr();
    var recordTime = this._parseTime(timeStr);

    var tentativeMeal = new MealBuilder().setName(name).setTime(recordTime).build();
    var result = checkMealConflicts(tentativeMeal, this.meals);

    if (result.safe) {
      this._addMeal(tentativeMeal, 'none', []);
    } else {
      this._showWarningModal(tentativeMeal, result.conflicts);
    }
  };

  App.prototype._showWarningModal = function(meal, conflicts) {
    var self = this;
    var topConflict = conflicts[0];
    var diffStr = formatDiffTime(topConflict.diffHours);
    var riskLevel = topConflict.remainingHours > topConflict.rule.gap * 0.5 ? 'danger' : 'warning';

    new ModalBuilder()
      .setType(riskLevel)
      .setIcon(riskLevel === 'danger' ? '🚨' : '⚠️')
      .setTitle(diffStr + '前你吃了' + topConflict.otherFood)
      .setConflictDetail(topConflict.otherFood, meal.name, topConflict.rule.reason)
      .setCountdown(topConflict.remainingHours)
      .addButtons([
        { text: '放弃', className: 'btn-cancel', onClick: function() { document.getElementById('foodInput').focus(); } },
        { text: '仍要吃', className: 'btn-confirm', onClick: function() {
          var conflictInfos = conflicts.map(function(c) { return { otherFood: c.otherFood, rule: c.rule, diffHours: c.diffHours }; });
          self._addMeal(meal, riskLevel, conflictInfos);
        }}
      ])
      .show();
  };

  App.prototype._addMeal = function(meal, riskLevel, conflicts) {
    var finalMeal = new MealBuilder().setName(meal.name).setTime(new Date(meal.time)).setRisk(riskLevel, conflicts).build();
    this.meals.push(finalMeal);
    StorageManager.saveMeal(finalMeal);
    var input = document.getElementById('foodInput');
    input.value = '';
    this._updateTimeInput();
    input.focus();
    this._updateExistingMealRisks();
    this.render();
    this.renderHistoryList();
    this._updateProfile();
    this._checkBadges();
  };

  App.prototype._updateExistingMealRisks = function() {
    var self = this;
    this.meals.forEach(function(meal, idx) {
      var otherMeals = self.meals.filter(function(m, i) { return i !== idx; });
      var result = checkMealConflicts(meal, otherMeals);
      if (!result.safe) {
        var maxRisk = 'warning';
        for (var i = 0; i < result.conflicts.length; i++) {
          if (result.conflicts[i].remainingHours > result.conflicts[i].rule.gap * 0.5) { maxRisk = 'danger'; break; }
        }
        meal.riskLevel = maxRisk;
        meal.riskConflicts = result.conflicts.map(function(c) { return { otherFood: c.otherFood, rule: c.rule, diffHours: c.diffHours }; });
        StorageManager.updateMeal(meal);
      } else {
        if (meal.riskLevel !== 'none') { meal.riskLevel = 'none'; meal.riskConflicts = []; StorageManager.updateMeal(meal); }
      }
    });
  };

  App.prototype.handleDelete = function(id) {
    StorageManager.deleteMeal(id);
    this.meals = this.meals.filter(function(m) { return m.id !== id; });
    this._updateExistingMealRisks();
    this.render();
    this.renderHistoryList();
    this._updateProfile();
    this._checkBadges();
  };

  // ========== Toast ==========
  App.prototype._showToast = function(msg) {
    var toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(function() { toast.classList.add('show'); }, 10);
    setTimeout(function() {
      toast.classList.remove('show');
      setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
    }, 2500);
  };

  // ========== 渲染 ==========
  App.prototype.render = function() {
    this.renderScore();
    this.renderTimeline();
  };

  App.prototype.renderScore = function() {
    var today = getTodayStr();
    var todayMeals = this.meals.filter(function(m) { return m.date === today || (m.time && m.time.substr(0, 10) === today); });
    var calculator = new ScoreCalculator(todayMeals);
    var result = calculator.calculate();
    this.animateScore(document.getElementById('scoreValue'), result.score);
    document.getElementById('scoreBarFill').style.width = result.score + '%';
    // 更新名句匹配标签，若标签变化则立即刷新一条相关名句
    var newTags = result.tipTags || ['general'];
    var tagsChanged = JSON.stringify(this._tipTags) !== JSON.stringify(newTags);
    this._tipTags = newTags;
    if (tagsChanged) this._renderQuotes(false);
  };

  App.prototype.animateScore = function(element, target) {
    var current = parseInt(element.textContent) || 0;
    var diff = target - current;
    var duration = 600;
    var startTime = performance.now();
    function update(now) {
      var elapsed = now - startTime;
      var progress = Math.min(elapsed / duration, 1);
      var eased = 1 - Math.pow(1 - progress, 3);
      element.textContent = Math.round(current + diff * eased);
      if (progress < 1) requestAnimationFrame(update);
    }
    requestAnimationFrame(update);
  };

  // ========== 时间线渲染 ==========
  App.prototype.renderTimeline = function() {
    var timelineEl = document.getElementById('timeline');
    var today = getTodayStr();
    var filteredMeals = this.meals.filter(function(m) { return m.date === today || (m.time && m.time.substr(0, 10) === today); });
    filteredMeals.sort(function(a, b) { return new Date(a.time) - new Date(b.time); });
    timelineEl.innerHTML = '';

    if (filteredMeals.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = '<div class="empty-emoji">🥗</div><div>今日尚无记录，添加第一餐</div>';
      timelineEl.appendChild(empty);
      return;
    }

    var self = this;
    filteredMeals.forEach(function(meal) {
      var item = new TimelineItemBuilder()
        .setEmoji(meal.emoji)
        .setName(meal.name)
        .setTime(meal.time)
        .setRiskLevel(meal.riskLevel || 'none', meal.riskConflicts || [])

        .setFeedbackHandler(function() { self._showFeedback(meal.emoji + ' ' + meal.name + '（' + meal.time + '）'); })

  App.prototype._editMeal = function(meal, newName, newTimeStr) {
    if (!isKnownFood(newName)) {
      this._showToast('不在食物库内，无法修改');
      return;
    }
    var parsedTime = this._parseTime(newTimeStr);
    var updatedMeal = new MealBuilder()
      .setName(newName)
      .setTime(parsedTime)
      .setId(meal.id)
      .setRisk(meal.riskLevel, meal.riskConflicts)
      .build();
    var idx = this.meals.findIndex(function(m) { return m.id === meal.id; });
    if (idx !== -1) {
      this.meals[idx] = updatedMeal;
      StorageManager.updateMeal(updatedMeal);

      this.render();
      this.renderHistoryList();
      this._timeEdited = true;
      this._checkBadges();
    }

    card.appendChild(title);

    targetEl.className = 'feedback-target';
    targetEl.innerHTML = '反馈对象：<b>' + targetText + '</b>';
    card.appendChild(targetEl);
    var textarea = document.createElement('textarea');
    textarea.className = 'feedback-textarea';
    textarea.placeholder = '请描述该信息存在的问题（如相克关系有误、描述不准确等）…';
    card.appendChild(textarea);
    var btnBox = document.createElement('div');
    btnBox.className = 'modal-buttons';

    cancelBtn.textContent = '取消';
    var submitBtn = document.createElement('button');
    submitBtn.className = 'modal-btn btn-confirm';
    submitBtn.textContent = '提交反馈';
    btnBox.appendChild(cancelBtn);
    btnBox.appendChild(submitBtn);
    card.appendChild(btnBox);
    overlay.appendChild(card);
    document.body.appendChild(overlay);

    function close() { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }
    overlay.addEventListener('click', function(e) { if (e.target === overlay) close(); });
    cancelBtn.addEventListener('click', function() { SoundManager.play('click'); close(); });
    submitBtn.addEventListener('click', function() {
      var content = textarea.value.trim();
      if (!content) { textarea.focus(); return; }
      SoundManager.play('record');
      var record = FeedbackManager.add(targetText, content);
      close();
      self._showToast('反馈已提交，审核回执稍后生成');
      self.renderFeedbackList();
      self._checkBadges();
      // 模拟异步审核：3 秒后生成回执
      setTimeout(function() {

  // 开发者日志面板
  App.prototype._initDevLogPanel = function() {
    // 兜底复制：iOS/安卓友好的临时 textarea + Selection + execCommand
    function fallbackCopy(text, btn, count) {
      var ta = null;
      var prevActive = document.activeElement;
      var sel = window.getSelection();
      var savedRanges = [];
      // 保存用户当前选区，复制后恢复
      for (var i = 0; i < sel.rangeCount; i++) savedRanges.push(sel.getRangeAt(i));
      try {
        ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        // 足够大以确保全部内容可选；移出视野避免遮挡
        ta.style.position = 'fixed';
        ta.style.left = '0';
        ta.style.top = '0';
        ta.style.width = '1px';
        ta.style.height = '1px';
        ta.style.padding = '0';
        ta.style.border = 'none';
        ta.style.opacity = '0.01';
        ta.style.fontSize = '12px';
        document.body.appendChild(ta);
        ta.focus();
        // 双重全选：setSelectionRange + Selection API
        ta.select();
        ta.setSelectionRange(0, text.length);
        var range = document.createRange();
        range.selectNodeContents(ta);
        sel.removeAllRanges();
        sel.addRange(range);
        ta.setSelectionRange(0, text.length);
        var ok = document.execCommand('copy');
        if (!ok) {
          try { ok = document.execCommand('copy'); } catch (e2) {}
        }
        // 恢复用户选区
        sel.removeAllRanges();
        for (var r = 0; r < savedRanges.length; r++) sel.addRange(savedRanges[r]);
        document.body.removeChild(ta);
        ta = null;
        if (prevActive && prevActive.focus) prevActive.focus();
        btn.textContent = ok ? ('✓ 已复制 ' + count + ' 条') : '✗ 复制失败';
      } catch (e) {
        if (ta && ta.parentNode) { try { document.body.removeChild(ta); } catch (e2) {} }
        btn.textContent = '✗ 复制失败';
      }
      setTimeout(function() { btn.textContent = '📋 复制日志'; }, 1500);
    }
    var listEl = document.getElementById('devLogList');
    var copyBtn = document.getElementById('devLogCopy');
    var clearBtn = document.getElementById('devLogClear');
    if (!listEl) return;
    // 渲染日志（卡片展开时触发）
    var render = function() {
      var logs = Logger.getAll();
      if (logs.length === 0) {
        listEl.innerHTML = '<div class="feedback-empty">暂无日志</div>';
        return;
      }
      listEl.innerHTML = logs.map(function(l) {
        return '<div class="dev-log-item">' +
          '<span class="dev-log-time">' + l.ts + '</span>' +
          '<span class="dev-log-tag ' + (l.level || 'info') + '">' + (l.tag || '') + '</span>' +
          (l.msg || '') +
        '</div>';
      }).join('');
    };
    // 卡片展开时刷新
    var card = document.getElementById('devLogCard');
    if (card) {
      var title = card.querySelector('.settings-card-title');
      if (title) {
        title.addEventListener('click', function() {
          setTimeout(render, 50);
        });
      }
    }
    if (copyBtn) {
      copyBtn.addEventListener('click', function() {
        var logs = Logger.getAll();
        var text = logs.map(function(l) {
          return l.ts + ' [' + l.tag + '] ' + l.msg;
        }).join('\n');
        Logger.log('CopyLog', 'start, length=' + text.length + ' logs=' + logs.length);
        var done = false;
        var finish = function(result) {
          if (done) return; done = true;
          Logger.log('CopyLog', 'result=' + result);
          render(); // 复制后刷新日志列表，让用户看到 CopyLog 条目
        };
        // clipboard API 仅在 https 下尝试；file:// 直接走 fallback
        if (navigator.clipboard && navigator.clipboard.writeText && location.protocol === 'https:') {
          var timer = setTimeout(function() {
            if (!done) { Logger.log('CopyLog', 'clipboard timeout, fallback'); fallbackCopy(text, copyBtn, logs.length); finish('fallback-after-timeout'); }
          }, 300);
          navigator.clipboard.writeText(text).then(function() {
            clearTimeout(timer);
            copyBtn.textContent = '✓ 已复制 ' + logs.length + ' 条';
            setTimeout(function() { copyBtn.textContent = '📋 复制日志'; }, 1500);
            finish('clipboard-api-ok');
          }).catch(function(e) {
            clearTimeout(timer);
            Logger.log('CopyLog', 'clipboard API fail: ' + e + ', fallback');
            fallbackCopy(text, copyBtn, logs.length);
            finish('fallback-after-fail');
          });
        } else {
          Logger.log('CopyLog', 'use fallback (protocol=' + location.protocol + ')');
          fallbackCopy(text, copyBtn, logs.length);
          finish('fallback-direct');
        }
      });
    }
    if (clearBtn) {
      clearBtn.addEventListener('click', function() {
        if (confirm('清空所有开发者日志？')) {
          Logger.clear();
          render();
        }
      });
    }
    render();
  };

  // ========== 查询页：食物卡片 ==========
  App.prototype.renderFoodCards = function() {
    var listEl = document.getElementById('rulesList');
    var alphaBar = document.getElementById('alphaBar');
    var scrollContainer = document.querySelector('.query-scroll');
    var keyword = this.searchKeyword.toLowerCase();
    var category = this.foodCategory || 'all';

    // 收集所有食物及其相克关系（仅 gap > 0，按 other 去重）
    var allFoods = {};
    foodRules.forEach(function(rule) {
      if (rule.gap === 0) return; // 跳过可同食规则
      if (!allFoods[rule.a]) allFoods[rule.a] = [];
      if (!allFoods[rule.b]) allFoods[rule.b] = [];
      var listA = allFoods[rule.a];
      if (!listA.some(function(c) { return c.other === rule.b; })) {
        listA.push({ other: rule.b, rule: rule });
      }
      var listB = allFoods[rule.b];
      if (!listB.some(function(c) { return c.other === rule.a; })) {
        listB.push({ other: rule.a, rule: rule });
      }
    });

    var foodNames = Object.keys(allFoods);
    if (category !== 'all') {
      foodNames = foodNames.filter(function(name) { return getFoodCategory(name) === category; });
    }
    if (keyword) {
      foodNames = foodNames.filter(function(name) {
        // 名称包含匹配
        if (name.toLowerCase().indexOf(keyword) !== -1) return true;
        // 首字母匹配（如输入 "jd" 匹配 "鸡蛋"）
        var ini = getFoodInitial(name).toLowerCase();
        if (ini === keyword) return true;
        // 多首字母匹配（如输入 "jd" 匹配首字母 j + 第二字拼音首字母 d）
        var pinyinInit = (FOOD_PINYIN_INIT[name] || '').toLowerCase();
        if (pinyinInit && pinyinInit.indexOf(keyword) === 0) return true;
        return false;
      });
    }
    // 按拼音首字母分组排序
    foodNames.sort(function(a, b) {
      var ia = getFoodInitial(a), ib = getFoodInitial(b);
      if (ia !== ib) return ia.localeCompare(ib);
      return a.localeCompare(b, 'zh');
    });
    listEl.innerHTML = '';

    if (foodNames.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = '<div class="empty-emoji">🔍</div><div>没有找到相关食物信息</div>';
      listEl.appendChild(empty);
      if (alphaBar) alphaBar.innerHTML = '';
      return;
    }

    var self = this;
    var groups = {};
    var order = [];
    foodNames.forEach(function(name) {
      var ini = getFoodInitial(name);
      if (!groups[ini]) { groups[ini] = []; order.push(ini); }
      groups[ini].push(name);
    });

    order.forEach(function(ini) {
      // 保留锚点 div 供字母点击定位，但不显示文字
      var head = document.createElement('div');
      head.className = 'food-letter-head';
      head.id = 'letter-' + ini;
      head.setAttribute('aria-hidden', 'true');
      listEl.appendChild(head);
      groups[ini].forEach(function(foodName) {
        var card = self._buildFoodCard(foodName, allFoods[foodName]);
        listEl.appendChild(card);
      });
    });

    // 渲染字母表
    if (alphaBar) {
      alphaBar.innerHTML = '';
      order.forEach(function(ini) {
        var letter = document.createElement('div');
        letter.className = 'alpha-letter';
        letter.textContent = ini;
        letter.addEventListener('click', function() {
          SoundManager.play('click');
          if (navigator.vibrate) navigator.vibrate(10);
          var target = document.getElementById('letter-' + ini);
          if (!target || !scrollContainer) return;
          // 用 getBoundingClientRect 计算相对偏移，确保精准对齐到容器顶部
          var containerRect = scrollContainer.getBoundingClientRect();
          var targetRect = target.getBoundingClientRect();
          var delta = targetRect.top - containerRect.top;
          var nextTop = scrollContainer.scrollTop + delta;
          // 容器顶部预留小间距，避免标题贴边
          nextTop = Math.max(0, nextTop - 4);
          scrollContainer.scrollTop = nextTop;
          // 高亮当前字母
          alphaBar.querySelectorAll('.alpha-letter').forEach(function(el) { el.classList.remove('active'); });
          letter.classList.add('active');
        });
        alphaBar.appendChild(letter);
      });

      // Mac Dock 风格：滑动时根据触摸位置动态缩放邻近字母
      var letters = alphaBar.querySelectorAll('.alpha-letter');
      var clearScales = function() {
        letters.forEach(function(el) {
          el.classList.remove('scale-l', 'scale-s');
        });
      };
      var updateScales = function(clientY) {
        var nearest = null, nearestDist = Infinity;
        letters.forEach(function(el) {
          var rect = el.getBoundingClientRect();
          var cy = rect.top + rect.height / 2;
          var d = Math.abs(clientY - cy);
          if (d < nearestDist) { nearestDist = d; nearest = el; }
        });
        if (!nearest) return;
        // 字母切换时轻震动
        if (nearest !== alphaBar._lastNear) {
          alphaBar._lastNear = nearest;
          if (navigator.vibrate) navigator.vibrate(5);
        }
        clearScales();
        // 中心字母大缩放，相邻字母小缩放
        nearest.classList.add('scale-l');
        var prev = nearest.previousElementSibling;
        var next = nearest.nextElementSibling;
        if (prev && prev.classList.contains('alpha-letter')) prev.classList.add('scale-s');
        if (next && next.classList.contains('alpha-letter')) next.classList.add('scale-s');
      };
      alphaBar._updateScales = updateScales;
      alphaBar._clearScales = clearScales;

      // 触摸滑动：实时缩放
      alphaBar.addEventListener('touchmove', function(e) {
        var touch = e.touches[0];
        if (!touch) return;
        updateScales(touch.clientY);
      }, { passive: true });
      alphaBar.addEventListener('touchend', function() {
        // 滑动结束后短暂保留效果，再清空
        setTimeout(clearScales, 300);
      }, { passive: true });
      alphaBar.addEventListener('touchcancel', clearScales, { passive: true });

      // 鼠标移动（桌面端）：实时缩放
      alphaBar.addEventListener('mousemove', function(e) {
        updateScales(e.clientY);
      });
      alphaBar.addEventListener('mouseleave', clearScales);
    }
    // 动态设置列表底部 padding = 滚动容器视口高度 + 缓冲，
    // 确保点击任意字母（包括最后一个 Z）都能让对应卡片滚到容器顶部
    if (scrollContainer && listEl) {
      var updatePad = function() {
        var h = scrollContainer.clientHeight;
        if (h > 0) listEl.style.paddingBottom = (h + 40) + 'px';
      };
      updatePad();
      // 布局稳定后再次校准，避免页面切换瞬间测得 0
      setTimeout(updatePad, 60);
    }
  };

  App.prototype._buildFoodCard = function(foodName, conflicts) {
    var self = this;
    var card = document.createElement('div');
    card.className = 'food-card';

    var emoji = getFoodEmoji(foodName);
    var desc = FOOD_INFO[foodName] || '点击查看相克信息';

    var header = document.createElement('div');
    header.className = 'food-card-header';
    header.innerHTML =
      '<span class="food-card-emoji">' + emoji + '</span>' +
      '<div class="food-card-info"><div class="food-card-name">' + foodName + '</div>' +
      '<div class="food-card-desc">' + desc + '</div></div>' +
      '<span class="food-card-arrow">▼</span>';

    var body = document.createElement('div');
    body.className = 'food-card-body';
    var bodyScroll = document.createElement('div');
    bodyScroll.className = 'food-card-body-scroll';

    var bodyTitle = document.createElement('div');
    bodyTitle.className = 'food-card-body-title';
    bodyTitle.textContent = '相克食物（共 ' + conflicts.length + ' 种）';
    bodyScroll.appendChild(bodyTitle);

    conflicts.forEach(function(c) {
      var item = document.createElement('div');
      item.className = 'conflict-item';
      var otherEmoji = getFoodEmoji(c.other);
      item.innerHTML =
        '<span class="conflict-emoji">' + otherEmoji + '</span>' +
        '<div class="conflict-info"><div class="conflict-name">' + c.other +
        ' <span class="conflict-gap">间隔 ' + c.rule.gap + 'h</span></div>' +
        '<div class="conflict-reason">' + c.rule.reason + '</div></div>';
      bodyScroll.appendChild(item);
    });

    // 反馈链接
    var feedback = document.createElement('div');
    feedback.className = 'feedback-link';
    feedback.textContent = '💬 信息有误？点此反馈';
    feedback.addEventListener('click', function(e) {
      e.stopPropagation();
      self._showFeedback(emoji + ' ' + foodName + ' 相克关系');
    });
    bodyScroll.appendChild(feedback);

    body.appendChild(bodyScroll);
    card.appendChild(header);
    card.appendChild(body);

    header.addEventListener('click', function() {
      SoundManager.play('expand');
      var wasExpanded = card.classList.contains('expanded');
      var listEl = document.getElementById('rulesList');
      listEl.querySelectorAll('.food-card.expanded').forEach(function(c) { c.classList.remove('expanded'); });
      if (!wasExpanded) card.classList.add('expanded');
    });

    return card;
  };

  // ========== 用户页 ==========
  App.prototype._updateProfile = function() {
    var profileDesc = document.getElementById('profileDesc');
    if (profileDesc) profileDesc.textContent = '已记录 ' + this.meals.length + ' 餐';
    var profile = ProfileManager.get();
    var avatarEl = document.getElementById('profileAvatar');
    var nameEl = document.getElementById('profileName');
    if (avatarEl) avatarEl.textContent = profile.avatar;
    if (nameEl) nameEl.textContent = profile.name;
  };

  // 头像/昵称编辑
  App.prototype._initProfileEditor = function() {
    var self = this;
    var avatarEl = document.getElementById('profileAvatar');
    var nameEl = document.getElementById('profileName');
    var avatars = ['😊','😋','🤤','🥑','🍔','🍕','🍜','🍣','🍰','🥗','🍎','🥕','🍳','🍲','🥘','🍱','🍇','🍓','🥦','🧀'];
    if (avatarEl) {
      avatarEl.addEventListener('click', function() {
        SoundManager.play('click');
        var current = ProfileManager.get();
        var html = '<div class="avatar-picker-grid" style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:10px;">';
        avatars.forEach(function(a) {
          html += '<div class="avatar-option" data-avatar="' + a + '" style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--input-bg);border-radius:50%;cursor:pointer;border:2px solid ' + (a === current.avatar ? 'var(--accent)' : 'transparent') + ';">' + a + '</div>';
        });
        html += '</div>';
        ModalBuilder.show({
          title: '选择头像',
          contentHTML: html,
          actions: [{ text: '关闭', onClick: function() { ModalBuilder.hide(); } }]
        });
        document.querySelectorAll('.avatar-option').forEach(function(opt) {
          opt.addEventListener('click', function() {
            SoundManager.play('toggle');
            var p = ProfileManager.get();
            p.avatar = opt.dataset.avatar;
            ProfileManager.save(p);
            self._updateProfile();
            ModalBuilder.hide();
          });
        });
      });
    }
    if (nameEl) {
      nameEl.addEventListener('click', function() {
        SoundManager.play('click');
        var current = ProfileManager.get();
        var html = '<div style="padding:14px;">' +
          '<input type="text" id="nameInputField" value="' + current.name + '" maxlength="12" ' +
          'style="width:100%;padding:12px;border:var(--border-width) solid var(--input-border);border-radius:var(--radius);font-size:16px;background:var(--input-bg);color:var(--text);font-family:var(--font-special);outline:none;" placeholder="输入昵称">' +
          '</div>';
        ModalBuilder.show({
          title: '修改昵称',
          contentHTML: html,
          actions: [
            { text: '取消', onClick: function() { ModalBuilder.hide(); } },
            { text: '保存', primary: true, onClick: function() {
              var input = document.getElementById('nameInputField');
              var val = input.value.trim();
              if (!val) { input.focus(); return; }
              var p = ProfileManager.get();
              p.name = val;
              ProfileManager.save(p);
              self._updateProfile();
              ModalBuilder.hide();
            } }
          ]
        });
        setTimeout(function() {
          var inp = document.getElementById('nameInputField');
          if (inp) { inp.focus(); inp.select(); }
        }, 100);
      });
    }
  };

  // 勋章渲染
  App.prototype.renderBadges = function() {
    var grid = document.getElementById('badgeGrid');
    var summary = document.getElementById('badgeSummary');
    if (!grid) return;
    var unlocked = BadgeSystem.getUnlocked();
    if (summary) summary.textContent = '已解锁 ' + unlocked.length + ' / ' + BadgeSystem.defs.length;
    grid.innerHTML = '';
    BadgeSystem.defs.forEach(function(def) {
      var isUnlocked = unlocked.indexOf(def.id) !== -1;
      var item = document.createElement('div');
      item.className = 'badge-item ' + (isUnlocked ? 'unlocked' : 'locked');
      item.innerHTML = '<div class="badge-icon-wrap"><span class="badge-icon">' + def.icon + '</span></div><div class="badge-name">' + def.name + '</div>';
      item.title = def.name + '：' + def.desc;
      item.addEventListener('click', function() {
        SoundManager.play('click');
        ModalBuilder.show({
          title: def.icon + ' ' + def.name,
          contentHTML: '<div style="padding:16px;text-align:center;font-size:14px;color:var(--text-secondary);">' + def.desc + '</div>' +
            '<div style="text-align:center;padding:0 0 12px;font-size:12px;color:var(--text-muted);">状态：' + (isUnlocked ? '✅ 已解锁' : '🔒 未解锁') + '</div>',
          actions: [{ text: '知道了', primary: true, onClick: function() { ModalBuilder.hide(); } }]
        });
      });
      grid.appendChild(item);
    });
  };

  // 检查勋章解锁
  App.prototype._checkBadges = function() {
    var themesTried = [];
    try {
      var raw = JSON.parse(localStorage.getItem('sgj_themes_tried') || '[]');
      themesTried = raw;
    } catch (e) {}
    var newly = BadgeSystem.checkAndUnlock({
      meals: this.meals,
      feedback: FeedbackManager.getAll(),
      profile: ProfileManager.get(),
      themesTried: themesTried,
      timeEdited: this._timeEdited === true
    });
    if (newly.length > 0) {
      this.renderBadges();
      var self = this;
      newly.forEach(function(b, i) {
        setTimeout(function() {
          ModalBuilder.show({
            title: '🎉 解锁勋章！',
            contentHTML: '<div style="padding:20px;text-align:center;">' +
              '<div style="font-size:56px;margin-bottom:12px;">' + b.icon + '</div>' +
              '<div style="font-size:18px;font-weight:700;color:var(--accent);margin-bottom:6px;">' + b.name + '</div>' +
              '<div style="font-size:13px;color:var(--text-secondary);">' + b.desc + '</div>' +
              '</div>',
            actions: [{ text: '太棒了！', primary: true, onClick: function() { ModalBuilder.hide(); } }]
          });
        }, i * 600);
      });
    }
  };

  // 历史记录列表
  App.prototype.renderHistoryList = function() {
    var listEl = document.getElementById('historyList');
    if (!listEl) return;
    var allMeals = StorageManager.getAllMeals();
    if (allMeals.length === 0) {
      listEl.innerHTML = '<div class="history-empty">暂无历史记录</div>';
      return;
    }
    allMeals.sort(function(a, b) { return new Date(b.date + 'T' + b.time) - new Date(a.date + 'T' + a.time); });
    listEl.innerHTML = '';
    var self = this;
    allMeals.forEach(function(m) {
      var item = document.createElement('div');
      item.className = 'history-item';
      item.dataset.id = m.id;
      var riskTag = m.riskLevel && m.riskLevel !== 'none'
        ? '<span style="color:var(--danger);">· 相克</span>' : '<span style="color:var(--success);">· 安全</span>';
      item.innerHTML =
        '<div class="history-check" data-id="' + m.id + '"></div>' +
        '<div class="history-emoji">' + (m.emoji || '🍽️') + '</div>' +
        '<div class="history-info">' +
          '<div class="history-name">' + m.name + '</div>' +
          '<div class="history-meta">' + (m.date || '') + ' ' + m.time + ' ' + riskTag + '</div>' +
        '</div>';
      listEl.appendChild(item);
    });
    // 复选框切换
    listEl.querySelectorAll('.history-check').forEach(function(check) {
      check.addEventListener('click', function(e) {
        e.stopPropagation();
        SoundManager.play('click');
        check.classList.toggle('checked');
      });
    });
  };

  // 历史记录批量删除
  App.prototype._initHistoryActions = function() {
    var self = this;
    var selectAllBtn = document.getElementById('selectAllBtn');
    var deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
    var deleteAllBtn = document.getElementById('deleteAllBtn');
    if (selectAllBtn) {
      selectAllBtn.addEventListener('click', function() {
        SoundManager.play('toggle');
        var checks = document.querySelectorAll('.history-check');
        var allChecked = Array.prototype.every.call(checks, function(c) { return c.classList.contains('checked'); });
        checks.forEach(function(c) {
          if (allChecked) c.classList.remove('checked');
          else c.classList.add('checked');
        });
      });
    }
    if (deleteSelectedBtn) {
      deleteSelectedBtn.addEventListener('click', function() {
        var ids = Array.prototype.map.call(document.querySelectorAll('.history-check.checked'), function(c) { return c.dataset.id; });
        if (ids.length === 0) {
          ModalBuilder.show({
            title: '提示', contentHTML: '<div style="padding:20px;text-align:center;color:var(--text-muted);">请先勾选要删除的记录</div>',
            actions: [{ text: '知道了', primary: true, onClick: function() { ModalBuilder.hide(); } }]
          });
          return;
        }
        SoundManager.play('delete');
        ModalBuilder.show({
          title: '确认删除',
          contentHTML: '<div style="padding:20px;text-align:center;">确定删除选中的 ' + ids.length + ' 条记录吗？此操作不可撤销。</div>',
          actions: [
            { text: '取消', onClick: function() { ModalBuilder.hide(); } },
            { text: '删除', primary: true, onClick: function() {
              StorageManager.deleteManyMeals(ids);
              self.meals = StorageManager.getMeals();
              self.render();
              self.renderHistoryList();
              self._updateProfile();
              self._checkBadges();
              ModalBuilder.hide();
            } }
          ]
        });
      });
    }
    if (deleteAllBtn) {
      deleteAllBtn.addEventListener('click', function() {
        SoundManager.play('delete');
        ModalBuilder.show({
          title: '⚠️ 一键清空',
          contentHTML: '<div style="padding:20px;text-align:center;color:var(--danger);">将删除全部历史记录，此操作不可撤销！<br>确定继续吗？</div>',
          actions: [
            { text: '取消', onClick: function() { ModalBuilder.hide(); } },
            { text: '确认清空', primary: true, onClick: function() {
              StorageManager.clearAllMeals();
              self.meals = [];
              self.render();
              self.renderHistoryList();
              self._updateProfile();
              self._checkBadges();
              ModalBuilder.hide();
            } }
          ]
        });
      });
    }
  };

  // ========== 启动 ==========
  document.addEventListener('DOMContentLoaded', function() { new App(); });
})();
</script>
</body>
</html>
