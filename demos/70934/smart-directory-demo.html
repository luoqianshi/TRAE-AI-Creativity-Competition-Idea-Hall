// AI analysis result: virtual tree structure
var virtualTree = null;

// ============================================
// Render flat file list
// ============================================
function renderFlatFiles() {
  var container = document.getElementById('flatFileList');
  var html = '';
  sampleFiles.forEach(function(f) {
    html += '<div class="file-item" onclick="showPreview(\'' + f.id + '\')">' +
      '<span class="file-icon">' + f.icon + '</span>' +
      '<span class="file-name">' + f.name + '</span>' +
      '<span class="file-type">.' + f.type + '</span>' +
    '</div>';
  });
  container.innerHTML = html;
  document.getElementById('fileCount').textContent = sampleFiles.length + ' 个文件 · 全部混在一起';
}

// ============================================
// Build virtual tree from analysis
// ============================================
function buildVirtualTree() {
  var tree = {};
  sampleFiles.forEach(function(f) {
    if (!tree[f.project]) { tree[f.project] = {}; }
    if (!tree[f.project][f.stage]) { tree[f.project][f.stage] = []; }
    tree[f.project][f.stage].push(f);
  });
  return tree;
}

function renderTree(tree) {
  var container = document.getElementById('treeContainer');
  document.getElementById('treePlaceholder').style.display = 'none';
  var html = '<div class="tree-container">';
  var projectNames = Object.keys(tree);
  projectNames.forEach(function(proj, pi) {
    html += '<div class="tree-node">';
    html += '<div class="node-row" onclick="toggleNode(this)">' +
      '<span class="toggle expanded">▶</span>' +
      '<span class="node-icon">📁</span>' +
      '<span class="node-name" style="font-weight:700;">' + proj + '</span>' +
      '<span class="node-badge">' + countFiles(tree[proj]) + ' 文件</span>' +
    '</div>';
    html += '<div class="children">';
    var stages = Object.keys(tree[proj]);
    stages.forEach(function(stage) {
      html += '<div class="tree-node">';
      html += '<div class="node-row" onclick="toggleNode(this)">' +
        '<span class="toggle expanded">▶</span>' +
        '<span class="node-icon">📂</span>' +
        '<span class="node-name">' + stage + '</span>' +
        '<span class="node-badge">' + tree[proj][stage].length + '</span>' +
      '</div>';
      html += '<div class="children">';
      tree[proj][stage].forEach(function(f) {
        html += '<div class="tree-node">' +
          '<div class="node-row" onclick="showPreview(\'' + f.id + '\')">' +
            '<span class="toggle hidden">▶</span>' +
            '<span class="node-icon">' + f.icon + '</span>' +
            '<span class="node-name">' + f.name + '</span>' +
            '<span class="node-badge file">.' + f.type + '</span>' +
          '</div>' +
        '</div>';
      });
      html += '</div></div>';
    });
    html += '</div></div>';
  });
  html += '</div>';
  container.innerHTML = html;
  document.getElementById('treeStatus').textContent = projectNames.length + ' 个项目 · ' + sampleFiles.length + ' 个文件';
}

function countFiles(stages) {
  var count = 0;
  Object.keys(stages).forEach(function(s) { count += stages[s].length; });
  return count;
}

function toggleNode(row) {
  var toggle = row.querySelector('.toggle');
  if (toggle.classList.contains('hidden')) return;
  toggle.classList.toggle('expanded');
  var children = row.parentElement.querySelector('.children');
  if (children) {
    children.classList.toggle('collapsed');
  }
}

// ============================================
// File Preview
// ============================================
function showPreview(fileId) {
  var f = sampleFiles.find(function(x) { return x.id === fileId; });
  if (!f) return;

  // Find related files (same project)
  var related = sampleFiles.filter(function(x) {
    return x.project === f.project && x.id !== f.id;
  });

  var panel = document.getElementById('previewPanel');
  var body = document.getElementById('previewBody');

  var relatedHtml = '';
  related.forEach(function(r) {
    relatedHtml += '<div class="preview-rel" onclick="showPreview(\'' + r.id + '\')">' +
      r.icon + ' ' + r.name + ' <span style="color:var(--muted);font-size:0.7rem;">(' + r.stage + ')</span>' +
    '</div>';
  });

  var tagsHtml = '';
  f.tags.forEach(function(t) {
    tagsHtml += '<span class="preview-tag">' + t + '</span>';
  });

  body.innerHTML = '' +
    '<div class="preview-file-icon">' + f.icon + '</div>' +
    '<div class="preview-file-name">' + f.name + '</div>' +
    '<div class="preview-file-meta">📁 ' + f.project + ' · ' + f.stage + ' · .' + f.type + '</div>' +
    '<div class="preview-section">' +
      '<h4>🏷️ 关键词</h4>' +
      '<div class="preview-tags">' + tagsHtml + '</div>' +
    '</div>' +
    '<div class="preview-section">' +
      '<h4>📄 内容摘要</h4>' +
      '<div class="preview-content">' + f.content + '</div>' +
    '</div>' +
    (related.length > 0 ?
    '<div class="preview-section">' +
      '<h4>🔗 关联文件（同项目）</h4>' +
      '<div class="preview-relations">' + relatedHtml + '</div>' +
    '</div>' : '');

  panel.classList.add('open');
}

function closePreview() {
  document.getElementById('previewPanel').classList.remove('open');
}

// ============================================
// AI Analysis Animation
// ============================================
function startAnalysis() {
  var overlay = document.getElementById('analysisOverlay');
  var btn = document.getElementById('btnAnalyze');
  overlay.classList.remove('hidden');
  btn.disabled = true;

  var steps = [
    { el: document.getElementById('step1'), delay: 600 },
    { el: document.getElementById('step2'), delay: 1400 },
    { el: document.getElementById('step3'), delay: 2200 },
    { el: document.getElementById('step4'), delay: 3000 }
  ];

  // Reset all steps
  document.querySelectorAll('.analysis-card .step').forEach(function(s) {
    s.classList.remove('active', 'done');
    s.classList.add('pending');
  });
  document.getElementById('analysisTitle').textContent = 'AI 正在分析文件…';

  steps.forEach(function(s, i) {
    setTimeout(function() {
      // Mark previous as done
      if (i > 0) {
        steps[i-1].el.classList.remove('active');
        steps[i-1].el.classList.add('done');
      }
      // Mark current as active
      s.el.classList.remove('pending');
      s.el.classList.add('active');
    }, s.delay);
  });

  // Complete
  setTimeout(function() {
    steps[3].el.classList.remove('active');
    steps[3].el.classList.add('done');
    document.getElementById('analysisTitle').textContent = '分析完成！';
    document.getElementById('spinner').style.display = 'none';

    // Build and render tree
    virtualTree = buildVirtualTree();
    renderTree(virtualTree);

    // Close overlay after short delay
    setTimeout(function() {
      overlay.classList.add('hidden');
      btn.disabled = false;
      btn.textContent = '🔄 重新分析';
      document.getElementById('spinner').style.display = '';
      document.getElementById('infoBanner').innerHTML = '✅ <strong>分析完成！</strong>右侧展示了 AI 自动生成的虚拟目录树。点击文件查看详情，点击关联文件可跳转。';
    }, 800);
  }, 3800);
}

function resetDemo() {
  virtualTree = null;
  document.getElementById('treeContainer').innerHTML = '<div class="preview-placeholder" id="treePlaceholder"><div class="ph-icon">🤖</div><div>点击上方「开始 AI 分析」</div><div style="font-size:0.75rem;">AI 将自动识别文件内容并建立虚拟层级</div></div>';
  document.getElementById('treeStatus').textContent = '等待分析…';
  closePreview();
  document.getElementById('btnAnalyze').textContent = '✨ 开始 AI 分析';
  document.getElementById('btnAnalyze').disabled = false;
  document.getElementById('infoBanner').innerHTML = '💡 <strong>左侧</strong>是物理存储的扁平文件列表（所有文件混在一起） → 点击 <strong>「开始 AI 分析」</strong>查看 → <strong>右侧</strong>AI 自动生成的虚拟目录树';
}

// Init
// ============================================
renderFlatFiles();
</script>
