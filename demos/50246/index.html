<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 学习路径规划师 - 可体验 Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .hidden { display: none !important; }

        /* 欢迎页 */
        .welcome-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .welcome-header h1 {
            font-size: 32px;
            color: #1a1a2e;
            margin-bottom: 10px;
        }
        .welcome-header p {
            color: #666;
            font-size: 16px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        /* 加载页 */
        #loading-screen {
            text-align: center;
            padding: 60px 20px;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text {
            font-size: 18px;
            color: #555;
        }
        .loading-sub {
            font-size: 14px;
            color: #888;
            margin-top: 8px;
        }

        /* 结果页 */
        .result-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .result-header h2 {
            font-size: 26px;
            color: #1a1a2e;
            margin-bottom: 8px;
        }
        .result-meta {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .meta-tag {
            background: #f0edff;
            color: #5a4fcf;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
        }

        .progress-section {
            margin-bottom: 28px;
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: #555;
        }
        .progress-bar {
            width: 100%;
            height: 12px;
            background: #eee;
            border-radius: 6px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.5s ease;
        }

        .timeline {
            position: relative;
            padding-left: 30px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 0;
            bottom: 0;
            width: 3px;
            background: #e0e0e0;
        }
        .phase {
            position: relative;
            margin-bottom: 24px;
        }
        .phase-dot {
            position: absolute;
            left: -26px;
            top: 4px;
            width: 18px;
            height: 18px;
            background: #667eea;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 0 0 3px #667eea33;
        }
        .phase-title {
            font-size: 18px;
            font-weight: 700;
            color: #4a4a8a;
            margin-bottom: 6px;
        }
        .phase-desc {
            font-size: 14px;
            color: #777;
            margin-bottom: 12px;
        }
        .task-list {
            list-style: none;
        }
        .task-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 12px;
            background: #f9f9f9;
            border-radius: 10px;
            margin-bottom: 8px;
            transition: background 0.2s;
        }
        .task-item:hover { background: #f0edff; }
        .task-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            accent-color: #667eea;
            cursor: pointer;
        }
        .task-item label {
            flex: 1;
            font-size: 14px;
            color: #444;
            cursor: pointer;
        }
        .task-item.completed label {
            text-decoration: line-through;
            color: #999;
        }

        .resources {
            background: #f8f6ff;
            border-radius: 12px;
            padding: 20px;
            margin-top: 28px;
        }
        .resources h3 {
            font-size: 18px;
            color: #4a4a8a;
            margin-bottom: 14px;
        }
        .resource-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }
        .resource-card {
            background: #fff;
            border-radius: 10px;
            padding: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .resource-card h4 {
            font-size: 14px;
            color: #333;
            margin-bottom: 6px;
        }
        .resource-card p {
            font-size: 13px;
            color: #888;
        }

        .actions {
            margin-top: 28px;
            text-align: center;
        }
        .btn-secondary {
            background: #fff;
            color: #667eea;
            border: 2px solid #667eea;
            width: auto;
            padding: 10px 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- 欢迎页 / 输入表单 -->
            <div id="welcome-screen">
                <div class="welcome-header">
                    <h1>AI 学习路径规划师</h1>
                    <p>输入你的学习目标，AI 为你生成专属学习路径</p>
                </div>
                <form id="plan-form">
                    <div class="form-group">
                        <label for="goal">学习目标</label>
                        <input type="text" id="goal" placeholder="例如：3 个月学会 Python 数据分析" required>
                    </div>
                    <div class="form-group">
                        <label for="level">当前水平</label>
                        <select id="level" required>
                            <option value="zero">零基础</option>
                            <option value="beginner">入门（了解一些基础）</option>
                            <option value="intermediate">进阶（想系统提升）</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="time">每天可用时间</label>
                        <select id="time" required>
                            <option value="30m">30 分钟</option>
                            <option value="1h">1 小时</option>
                            <option value="2h" selected>2 小时</option>
                            <option value="3h+">3 小时以上</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="duration">学习周期</label>
                        <select id="duration" required>
                            <option value="1">1 个月</option>
                            <option value="3" selected>3 个月</option>
                            <option value="6">6 个月</option>
                        </select>
                    </div>
                    <button type="submit" class="btn">生成我的学习路径</button>
                </form>
            </div>

            <!-- 加载页 -->
            <div id="loading-screen" class="hidden">
                <div class="spinner"></div>
                <div class="loading-text">AI 正在分析你的学习目标…</div>
                <div class="loading-sub">正在拆解知识点 · 匹配学习资源 · 规划阶段任务</div>
            </div>

            <!-- 结果页 -->
            <div id="result-screen" class="hidden">
                <div class="result-header">
                    <h2 id="result-title">你的学习路径</h2>
                    <div class="result-meta">
                        <span class="meta-tag" id="meta-level">零基础</span>
                        <span class="meta-tag" id="meta-time">每天 2 小时</span>
                        <span class="meta-tag" id="meta-duration">3 个月</span>
                    </div>
                </div>

                <div class="progress-section">
                    <div class="progress-label">
                        <span>总体进度</span>
                        <span id="progress-text">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                </div>

                <div class="timeline" id="timeline"></div>

                <div class="resources">
                    <h3>推荐学习资源</h3>
                    <div class="resource-list" id="resource-list"></div>
                </div>

                <div class="actions">
                    <button class="btn btn-secondary" id="restart-btn">重新规划</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 领域模板数据
        const templates = {
            python: {
                keywords: ['python', 'py', '数据分析', '数据科学', '机器学习', '爬虫'],
                phases: [
                    { title: '第一阶段：Python 基础', desc: '掌握语法与核心数据结构', tasks: ['安装 Python 与开发环境', '学习变量、数据类型与控制流', '掌握列表、字典等数据结构', '完成 5 道基础编程练习题'] },
                    { title: '第二阶段：数据处理工具', desc: '学习 NumPy、Pandas 等核心库', tasks: ['NumPy 数组操作与向量化计算', 'Pandas 数据读取、清洗与筛选', '数据聚合、分组与透视表', '完成一个真实数据集清洗项目'] },
                    { title: '第三阶段：数据分析实战', desc: '通过项目强化分析能力', tasks: ['学习 Matplotlib / Seaborn 可视化', '完成一份数据分析报告', '尝试简单预测模型（Scikit-learn）', '整理个人作品集'] }
                ],
                resources: [
                    { title: '官方 Python 教程', desc: '系统学习 Python 语法' },
                    { title: 'Pandas 官方文档', desc: '数据处理权威参考' },
                    { title: 'Kaggle 数据集', desc: '免费真实数据练手' }
                ]
            },
            english: {
                keywords: ['英语', '雅思', '托福', '四六级', '口语', '雅思'],
                phases: [
                    { title: '第一阶段：词汇与语法', desc: '夯实语言基础', tasks: ['每日背诵 30 个核心词汇', '复习基础语法规则', '完成一篇短文精读', '记录并复习错题'] },
                    { title: '第二阶段：听说读写分项训练', desc: '针对考试/应用场景专项突破', tasks: ['听力精听 1 篇真题材料', '完成阅读 2 篇并总结', '写作练习 1 篇并修改', '口语话题练习 15 分钟'] },
                    { title: '第三阶段：模拟与冲刺', desc: '查漏补缺、稳定发挥', tasks: ['完成 1 套完整模拟题', '分析弱项并针对性训练', '整理高频表达与模板', '进行考前心态调整'] }
                ],
                resources: [
                    { title: '剑桥雅思真题', desc: '官方权威练习材料' },
                    { title: 'BBC Learning English', desc: '免费听力与阅读素材' },
                    { title: '词汇记忆 App', desc: '碎片化背单词工具' }
                ]
            },
            frontend: {
                keywords: ['前端', 'html', 'css', 'javascript', 'js', 'react', 'vue', 'web'],
                phases: [
                    { title: '第一阶段：HTML/CSS 基础', desc: '掌握页面结构与样式', tasks: ['学习 HTML 语义化标签', '掌握 CSS 布局（Flex/Grid）', '完成 3 个静态页面练习', '学习响应式设计基础'] },
                    { title: '第二阶段：JavaScript 核心', desc: '让页面具备交互能力', tasks: ['学习变量、函数、DOM 操作', '掌握事件处理与异步编程', '完成一个交互式网页小工具', '学习基础调试技巧'] },
                    { title: '第三阶段：框架与项目实战', desc: '用现代框架构建应用', tasks: ['选择 React 或 Vue 入门', '完成一个 Todo/天气等应用', '学习组件化与状态管理', '部署个人项目并整理作品集'] }
                ],
                resources: [
                    { title: 'MDN Web 文档', desc: '前端开发权威参考' },
                    { title: 'FreeCodeCamp', desc: '免费交互式编程课程' },
                    { title: 'GitHub 开源项目', desc: '学习优秀代码实践' }
                ]
            },
            default: {
                keywords: [],
                phases: [
                    { title: '第一阶段：基础认知', desc: '建立对领域的整体理解', tasks: ['梳理核心概念与术语', '找到 3 本经典入门资料', '完成第一章/第一节学习', '做一份概念笔记'] },
                    { title: '第二阶段：核心技能', desc: '深入学习关键知识与方法', tasks: ['分模块学习核心知识点', '完成配套练习或作业', '尝试用所学解决一个小问题', '总结知识框架图'] },
                    { title: '第三阶段：实战应用', desc: '通过项目巩固并输出成果', tasks: ['选择一个真实小项目', '独立完成项目设计与实现', '记录过程与遇到的问题', '整理输出为可展示作品'] }
                ],
                resources: [
                    { title: '行业经典书籍', desc: '系统建立知识体系' },
                    { title: '优质在线课程', desc: '跟随视频逐步学习' },
                    { title: '社区与论坛', desc: '遇到问题及时交流' }
                ]
            }
        };

        function detectField(goal) {
            const g = goal.toLowerCase();
            for (const key in templates) {
                if (key === 'default') continue;
                for (const kw of templates[key].keywords) {
                    if (g.includes(kw.toLowerCase())) return key;
                }
            }
            return 'default';
        }

        function getLevelText(level) {
            const map = { zero: '零基础', beginner: '入门', intermediate: '进阶' };
            return map[level] || level;
        }

        function getTimeText(time) {
            const map = { '30m': '30 分钟', '1h': '1 小时', '2h': '2 小时', '3h+': '3 小时以上' };
            return map[time] || time;
        }

        function getDurationText(duration) {
            return duration + ' 个月';
        }

        // 根据水平和周期调整任务描述
        function customizeTask(task, level, duration, time) {
            let prefix = '';
            if (level === 'zero') prefix = '（从基础开始）';
            if (level === 'intermediate') prefix = '（侧重进阶与实战）';
            if (duration === '1') prefix += '【加速版】';
            if (time === '30m') prefix += '【轻量任务】';
            return prefix ? prefix + ' ' + task : task;
        }

        const form = document.getElementById('plan-form');
        const welcomeScreen = document.getElementById('welcome-screen');
        const loadingScreen = document.getElementById('loading-screen');
        const resultScreen = document.getElementById('result-screen');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const goal = document.getElementById('goal').value;
            const level = document.getElementById('level').value;
            const time = document.getElementById('time').value;
            const duration = document.getElementById('duration').value;

            welcomeScreen.classList.add('hidden');
            loadingScreen.classList.remove('hidden');

            setTimeout(() => {
                generatePlan(goal, level, time, duration);
                loadingScreen.classList.add('hidden');
                resultScreen.classList.remove('hidden');
            }, 1800);
        });

        function generatePlan(goal, level, time, duration) {
            const field = detectField(goal);
            const template = templates[field];

            document.getElementById('result-title').textContent = goal + ' 学习路径';
            document.getElementById('meta-level').textContent = getLevelText(level);
            document.getElementById('meta-time').textContent = '每天 ' + getTimeText(time);
            document.getElementById('meta-duration').textContent = getDurationText(duration);

            const timeline = document.getElementById('timeline');
            timeline.innerHTML = '';

            template.phases.forEach((phase, idx) => {
                const phaseDiv = document.createElement('div');
                phaseDiv.className = 'phase';

                const dot = document.createElement('div');
                dot.className = 'phase-dot';

                const title = document.createElement('div');
                title.className = 'phase-title';
                title.textContent = phase.title;

                const desc = document.createElement('div');
                desc.className = 'phase-desc';
                desc.textContent = phase.desc;

                const ul = document.createElement('ul');
                ul.className = 'task-list';

                phase.tasks.forEach((task, tidx) => {
                    const li = document.createElement('li');
                    li.className = 'task-item';
                    const id = 'task-' + idx + '-' + tidx;
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.id = id;
                    checkbox.addEventListener('change', updateProgress);

                    const label = document.createElement('label');
                    label.htmlFor = id;
                    label.textContent = customizeTask(task, level, duration, time);

                    li.appendChild(checkbox);
                    li.appendChild(label);
                    ul.appendChild(li);
                });

                phaseDiv.appendChild(dot);
                phaseDiv.appendChild(title);
                phaseDiv.appendChild(desc);
                phaseDiv.appendChild(ul);
                timeline.appendChild(phaseDiv);
            });

            const resourceList = document.getElementById('resource-list');
            resourceList.innerHTML = '';
            template.resources.forEach(res => {
                const card = document.createElement('div');
                card.className = 'resource-card';
                card.innerHTML = '<h4>' + res.title + '</h4><p>' + res.desc + '</p>';
                resourceList.appendChild(card);
            });

            updateProgress();
        }

        function updateProgress() {
            const checkboxes = document.querySelectorAll('.task-item input[type="checkbox"]');
            const checked = document.querySelectorAll('.task-item input[type="checkbox"]:checked');
            const percent = checkboxes.length ? Math.round(checked.length / checkboxes.length * 100) : 0;

            document.getElementById('progress-text').textContent = percent + '%';
            document.getElementById('progress-fill').style.width = percent + '%';

            checkboxes.forEach(cb => {
                const li = cb.closest('.task-item');
                if (cb.checked) li.classList.add('completed');
                else li.classList.remove('completed');
            });
        }

        document.getElementById('restart-btn').addEventListener('click', function() {
            resultScreen.classList.add('hidden');
            welcomeScreen.classList.remove('hidden');
            form.reset();
        });
    </script>
</body>
</html>
