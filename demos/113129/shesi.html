<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社死急救箱</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{background:#f5f5f5;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:20px}
.container{width:100%;max-width:600px;background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08);overflow:hidden}
.header{background:#2d2d2d;color:#fff;padding:24px 20px;text-align:center}
.header h1{font-size:24px;margin-bottom:4px}
.header p{font-size:13px;color:#aaa}
.content{padding:20px}
.section{margin-bottom:20px}
.section-title{font-size:16px;font-weight:600;color:#333;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.scene-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.scene-btn{padding:14px 8px;border:2px solid #e8e8e8;border-radius:12px;background:#fff;cursor:pointer;text-align:center;transition:all .2s;font-size:13px;color:#555;line-height:1.4}
.scene-btn:hover{border-color:#ff6b6b;background:#fff5f5}
.scene-btn.active{border-color:#ff6b6b;background:#ff6b6b;color:#fff}
.scene-btn .icon{font-size:22px;display:block;margin-bottom:4px}
.textarea{width:100%;padding:14px;border:2px solid #e8e8e8;border-radius:12px;font-size:14px;resize:none;outline:none;transition:border-color .2s}
.textarea:focus{border-color:#ff6b6b}
.generate-btn{width:100%;padding:16px;background:#ff6b6b;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;transition:opacity .2s;margin-top:8px}
.generate-btn:hover{opacity:.9}
.generate-btn:disabled{background:#ccc;cursor:not-allowed}
.solution-card{background:#f9f9f9;border-radius:12px;padding:16px;margin-bottom:12px;border-left:4px solid #ff6b6b}
.solution-card.style-apology{border-left-color:#4ecdc4}
.solution-card.style-deflect{border-left-color:#45b7d1}
.solution-card.style-dead{border-left-color:#96ceb4}
.solution-tag{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;margin-bottom:8px}
.solution-tag.style-humor{background:#fff0f0;color:#ff6b6b}
.solution-tag.style-apology{background:#e8f8f5;color:#1abc9c}
.solution-tag.style-deflect{background:#e8f4fd;color:#3498db}
.solution-tag.style-dead{background:#f0f9f0;color:#27ae60}
.solution-text{font-size:14px;color:#333;line-height:1.7}
.danger-box{background:#fff3f3;border:1px solid #ffcdd2;border-radius:10px;padding:12px;margin-top:16px}
.danger-title{color:#c62828;font-size:13px;font-weight:600;margin-bottom:6px}
.danger-list{font-size:13px;color:#b71c1c;line-height:1.8}
.preplay-area{background:#fafafa;border-radius:12px;padding:16px;margin-top:16px}
.preplay-msg{display:flex;gap:10px;margin-bottom:10px}
.preplay-msg.ai{justify-content:flex-start}
.preplay-msg.user{justify-content:flex-end}
.preplay-bubble{max-width:75%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.6}
.preplay-msg.ai .preplay-bubble{background:#fff;border:1px solid #e0e0e0;color:#333;border-bottom-left-radius:4px}
.preplay-msg.user .preplay-bubble{background:#ff6b6b;color:#fff;border-bottom-right-radius:4px}
.preplay-input{display:flex;gap:8px;margin-top:10px}
.preplay-input input{flex:1;padding:10px 14px;border:2px solid #e8e8e8;border-radius:10px;font-size:13px;outline:none}
.preplay-input input:focus{border-color:#ff6b6b}
.preplay-input button{padding:10px 18px;background:#2d2d2d;color:#fff;border:none;border-radius:10px;font-size:13px;cursor:pointer}
.diary-entry{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:14px;margin-bottom:10px}
.diary-meta{font-size:12px;color:#999;margin-bottom:6px}
.diary-event{font-size:14px;color:#333;margin-bottom:8px}
.diary-result{font-size:13px;color:#666}
.hidden{display:none}
.nav{display:flex;border-bottom:1px solid #eee;margin-bottom:16px}
.nav-btn{flex:1;padding:12px;text-align:center;font-size:14px;color:#999;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;background:none;border:none}
.nav-btn.active{color:#ff6b6b;border-bottom-color:#ff6b6b;font-weight:600}
.page{display:none}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease}
.rating{display:flex;gap:8px;margin-top:8px}
.rating span{font-size:18px;cursor:pointer;opacity:.3;transition:opacity .2s}
.rating span.active{opacity:1}
.empty-state{text-align:center;padding:40px 20px;color:#999}
.empty-state .icon{font-size:48px;margin-bottom:12px}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>社死急救箱</h1>
<p>刚发生社死？5 分钟想好应对方案</p>
</div>
<div class="nav">
<button class="nav-btn active" onclick="showPage('home')">急救</button>
<button class="nav-btn" onclick="showPage('preplay')">预演</button>
<button class="nav-btn" onclick="showPage('diary')">日记</button>
</div>
<div class="content">
<div id="page-home" class="page active">
<div class="section">
<div class="section-title">1. 选择社死场景</div>
<div class="scene-grid">
<div class="scene-btn" data-scene="wrong-group" onclick="selectScene(this)">
<span class="icon">&#128172;</span>
发错群消息
</div>
<div class="scene-btn" data-scene="wrong-dress" onclick="selectScene(this)">
<span class="icon">&#128084;</span>
穿错场合
</div>
<div class="scene-btn" data-scene="wrong-speak" onclick="selectScene(this)">
<span class="icon">&#128562;</span>
说错话
</div>
<div class="scene-btn" data-scene="moments-fail" onclick="selectScene(this)">
<span class="icon">&#128247;</span>
朋友圈翻车
</div>
<div class="scene-btn" data-scene="called-out" onclick="selectScene(this)">
<span class="icon">&#127897;</span>
被点名不会
</div>
<div class="scene-btn" data-scene="other" onclick="selectScene(this)">
<span class="icon">&#128736;</span>
其他
</div>
</div>
</div>
<div class="section">
<div class="section-title">2. 描述发生了什么</div>
<textarea id="event-desc" class="textarea" rows="3" placeholder="例如：我把吐槽老板的消息误发到了工作大群，已经 3 分钟了..."></textarea>
</div>
<button id="generate-btn" class="generate-btn" onclick="generateSolution()" disabled>生成急救方案</button>
<div id="solutions-area" class="hidden" style="margin-top:20px">
<div class="section-title">3. 急救方案</div>
<div id="solutions-list"></div>
<div class="danger-box">
<div class="danger-title">&#9888; 这些话千万别说</div>
<div id="danger-list" class="danger-list"></div>
</div>
</div>
</div>
<div id="page-preplay" class="page">
<div class="section">
<div class="section-title">&#127922; 模拟对话预演</div>
<p style="font-size:13px;color:#999;margin-bottom:12px">AI 扮演对方，你练习回应。选择场景并输入事件后，在这里预演。</p>
<div id="preplay-content">
<div class="empty-state">
<div class="icon">&#127922;</div>
<p>先去"急救"页生成方案，再来这里预演</p>
</div>
</div>
</div>
</div>
<div id="page-diary" class="page">
<div class="section">
<div class="section-title">&#128220; 社死日记</div>
<p style="font-size:13px;color:#999;margin-bottom:12px">记录每次社死事件和处理效果，以后回看会发现成长轨迹。</p>
<div id="diary-list">
<div class="empty-state">
<div class="icon">&#128220;</div>
<p>还没有记录，快去急救一次吧</p>
</div>
</div>
</div>
</div>
</div>
</div>
<script>
let selectedScene='';
let currentSolutions=[];
let currentEvent='';
let preplayHistory=[];
let diaryEntries=JSON.parse(localStorage.getItem('shesiDiary')||'[]');
function selectScene(el){document.querySelectorAll('.scene-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');selectedScene=el.dataset.scene;document.getElementById('generate-btn').disabled=document.getElementById('event-desc').value.trim()===''}
}
document.getElementById('event-desc').addEventListener('input',function(){document.getElementById('generate-btn').disabled=selectedScene===''||this.value.trim()===''});
function showPage(page){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page-'+page).classList.add('active');document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');if(page==='diary')renderDiary()}
const templates={
'wrong-group':{
humor:'"抱歉各位，刚才那条是我家猫踩键盘发的，它似乎对KPI很有意见。"配合一个猫咪表情包效果更佳。',
apology:'"抱歉，我刚才发错群了，消息内容不适合发在这个群里，请大家忽略。"然后私聊相关人员解释。',
deflect:'"刚才那条是跟朋友吐槽另一个项目的，不小心发错群了，跟咱们组没关系哈。"快速把话题拉回工作。',
dead:'沉默 2 小时不回复。如果有人在群里@你，回复"刚才在开会"即可。时间是最好的解药。',
danger:['"我刚才说的是别人"——越解释越尴尬','连续发一堆消息试图刷屏掩盖','在群里公开道歉超过3次——每次提醒所有人看一次'],
scenario:'工作群里的同事'
},
'wrong-dress':{
humor:'"我今天是来体验'最随意员工'主题的，看来我赢了。"然后自然地融入，别一直扯衣服。',
apology:'"抱歉，我今天穿得不太合适，下次注意。"不需要过度解释，简单带过即可。',
deflect:'"刚从健身房过来/刚下飞机，来不及换衣服了。"找一个合理的临时借口。',
dead:'不说话，自然融入。穿错衣服这件事，你越在意别人越注意，你不在乎反而没人记得。',
danger:['"我觉得我这样穿挺好看的"——显得不尊重场合','全程缩在角落——反而更显眼','不断跟别人解释为什么穿错——每说一次就提醒一次'],
scenario:'饭局上的领导/客户'
},
'wrong-speak':{
humor:'"看来我的嘴今天有自己的想法，我替它跟大家道个歉。"用自嘲化解尴尬。',
apology:'"抱歉，我刚才说错了，我的意思是..."直接纠正，不要绕弯子。',
deflect:'"这个话题我可能了解不够，听听大家的看法。"把球抛出去，自己退出C位。',
dead:'沉默微笑，等话题自然过去。如果不是原则性错误，没必要死磕。',
danger:['"我不是那个意思"——越描越黑','"你们懂我意思吧"——把尴尬分摊给别人','强行找补 5 分钟——让尴尬持续发酵'],
scenario:'对话中的对方'
},
'moments-fail':{
humor:'评论区补一条："看来今天朋友圈是我一个人的独角戏，谢谢大家看我翻车。"',
apology:'秒删，重新发一条正确的。如果是带错图，补一条"上条图错了，这条才是"，越简单越好。',
deflect:'评论区引导："这条是专门测试谁不看朋友圈的，看来你们都很认真。"',
dead:'什么都不做。如果不是原则性错误，24 小时后没人记得。',
danger:['反复删除重发超过3次','在朋友圈发长文解释','给每个点赞的人私聊解释'],
scenario:'朋友圈的共同好友'
},
'called-out':{
humor:'"这个问题问得非常好，好到我需要再研究一下才能回答您。"',
apology:'"抱歉，这个数据/内容我目前没有准备，会后我查一下再同步给您。"诚实是最好的策略。',
deflect:'"这个问题XX可能更清楚，我补充一下我的想法..."把话题转移给更了解的人。',
dead:'"我需要一点时间整理思路。"然后沉默 10 秒，深呼吸，给出你能想到的最接近的答案。',
danger:['瞎编一个数据——风险极大','"这个不是我的负责范围"——显得推诿','沉默超过 30 秒——全场尴尬'],
scenario:'会议上的提问者'
},
'other':{
humor:'"看来今天我的运气值暂时欠费了，先赊账，改天补上。"',
apology:'"抱歉，刚才是我没注意/搞错了。"',
deflect:'"说到这个，最近有个相关的事..."找一个相关的话题岔开。',
dead:'微笑，不说话。很多时候尴尬来自于你急于解释。',
danger:['过度解释','把责任推给第三方','情绪化处理（生气/哭）'],
scenario:'现场的其他人'
}
};
function generateSolution(){const desc=document.getElementById('event-desc').value.trim();if(!selectedScene||!desc)return;currentEvent=desc;const t=templates[selectedScene]||templates['other'];currentSolutions=[{style:'humor',label:'幽默化解版',text:t.humor},{style:'apology',label:'真诚道歉版',text:t.apology},{style:'deflect',label:'转移话题版',text:t.deflect},{style:'dead',label:'装死策略版',text:t.dead}];const list=document.getElementById('solutions-list');list.innerHTML='';currentSolutions.forEach((s,i)=>{const div=document.createElement('div');div.className='solution-card style-'+s.style+' fade-in';div.style.animationDelay=i*0.1+'s';div.innerHTML='<div class="solution-tag style-'+s.style+'">'+s.label+'</div><div class="solution-text">'+s.text+'</div><div class="rating" data-idx="'+i+'"><span onclick="rate(this,1)">&#9733;</span><span onclick="rate(this,2)">&#9733;</span><span onclick="rate(this,3)">&#9733;</span><span onclick="rate(this,4)">&#9733;</span><span onclick="rate(this,5)">&#9733;</span></div>';list.appendChild(div)});const danger=document.getElementById('danger-list');danger.innerHTML=t.danger.map(d=>'&#10060; '+d).join('<br>');document.getElementById('solutions-area').classList.remove('hidden');initPreplay(t.scenario);saveToDiary(desc,currentSolutions)}
function rate(el,n){const stars=el.parentElement.querySelectorAll('span');stars.forEach((s,i)=>s.classList.toggle('active',i<n))}
function initPreplay(role){preplayHistory=[{from:'ai',text:'（你刚处理完社死事件，现在'+role+'正在看着你，等你回应...）'}];renderPreplay()}
function renderPreplay(){const c=document.getElementById('preplay-content');if(!currentEvent){c.innerHTML='<div class="empty-state"><div class="icon">&#127922;</div><p>先去"急救"页生成方案，再来这里预演</p></div>';return}c.innerHTML='<div class="preplay-area"><div id="preplay-msgs"></div><div class="preplay-input"><input type="text" id="preplay-input" placeholder="输入你的回应..." onkeypress="if(event.key===\'Enter\')sendPreplay()"><button onclick="sendPreplay()">发送</button></div></div>';const msgs=document.getElementById('preplay-msgs');preplayHistory.forEach(h=>{const div=document.createElement('div');div.className='preplay-msg '+h.from;div.innerHTML='<div class="preplay-bubble">'+h.text+'</div>';msgs.appendChild(div)});msgs.scrollTop=msgs.scrollHeight}
function sendPreplay(){const input=document.getElementById('preplay-input');const text=input.value.trim();if(!text)return;preplayHistory.push({from:'user',text:text});renderPreplayMessages();input.value='';const replies=['"嗯，我知道了。"（对方似乎接受了）','"没事，下次注意就好。"（态度缓和了）','"哈哈，你还挺会说的。"（气氛缓和了）','"..."（对方沉默了，但至少没再追问）','"行吧，那这个话题就过了。"（顺利翻篇）'];setTimeout(()=>{preplayHistory.push({from:'ai',text:replies[Math.floor(Math.random()*replies.length)]});renderPreplayMessages()},800)}
function renderPreplayMessages(){const msgs=document.getElementById('preplay-msgs');msgs.innerHTML='';preplayHistory.forEach(h=>{const div=document.createElement('div');div.className='preplay-msg '+h.from;div.innerHTML='<div class="preplay-bubble">'+h.text+'</div>';msgs.appendChild(div)});msgs.scrollTop=msgs.scrollHeight}
function saveToDiary(event,solutions){const entry={id:Date.now(),date:new Date().toLocaleString('zh-CN'),event:event,scene:selectedScene,solutions:solutions.map(s=>s.label)};diaryEntries.unshift(entry);localStorage.setItem('shesiDiary',JSON.stringify(diaryEntries))}
function renderDiary(){const list=document.getElementById('diary-list');if(diaryEntries.length===0){list.innerHTML='<div class="empty-state"><div class="icon">&#128220;</div><p>还没有记录，快去急救一次吧</p></div>';return}list.innerHTML='';diaryEntries.forEach(e=>{const div=document.createElement('div');div.className='diary-entry';div.innerHTML='<div class="diary-meta">'+e.date+'</div><div class="diary-event">'+e.event+'</div><div class="diary-result">已生成方案：'+e.solutions.join('、')+'</div>';list.appendChild(div)})}
</script>
</body>
</html>
