<!-- Generated by Trae Work -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A股上市公司新闻梳理系统</title>
  <style>
    :root {
      --bg: #0d1117;
      --bg2: #161b22;
      --bg3: #1c2333;
      --ink: #e6edf3;
      --muted: #8b949e;
      --rule: #30363d;
      --accent: #f0883e;
      --accent2: #58a6ff;
      --red: #f85149;
      --green: #3fb950;
      --card: #1a2030;
      --hover: #1f2937;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, var(--bg2) 0%, var(--bg3) 100%);
      border-bottom: 1px solid var(--rule);
      padding: 1.25rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--red));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: #fff;
    }

    .logo h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0.02em;
    }

    .logo .subtitle {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 400;
    }

    /* Stock Selector */
    .stock-selector {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .stock-selector label {
      font-size: 0.85rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .stock-select {
      background: var(--bg);
      border: 1px solid var(--rule);
      color: var(--ink);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
      min-width: 220px;
      transition: border-color 0.2s;
    }

    .stock-select:hover { border-color: var(--accent); }
    .stock-select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(240,136,62,0.15); }

    /* Main Layout */
    .main-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem 2rem;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 1.5rem;
      min-height: calc(100vh - 80px);
    }

    /* Stock Info Bar */
    .stock-info-bar {
      grid-column: 1 / -1;
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .stock-name-block {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
    }

    .stock-name-block .name {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .stock-name-block .code {
      font-size: 0.85rem;
      color: var(--muted);
      font-family: 'Courier New', monospace;
    }

    .stock-name-block .industry {
      font-size: 0.75rem;
      background: var(--bg3);
      color: var(--accent2);
      padding: 2px 8px;
      border-radius: 4px;
    }

    .price-stats {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .price-stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .price-stat .label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .price-stat .value {
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Courier New', monospace;
    }

    .price-stat .value.up { color: var(--red); }
    .price-stat .value.down { color: var(--green); }

    /* K-Line Chart Area */
    .chart-panel {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 10px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
    }

    .chart-panel .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .chart-panel .panel-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--ink);
    }

    .chart-panel .panel-hint {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .chart-container {
      flex: 1;
      min-height: 520px;
    }

    /* News Panel */
    .news-panel {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 200px);
      position: sticky;
      top: 100px;
    }

    .news-panel .panel-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .news-panel .panel-title {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .news-date-badge {
      font-size: 0.75rem;
      background: var(--bg3);
      color: var(--accent);
      padding: 3px 10px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
    }

    .news-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem;
    }

    .news-list::-webkit-scrollbar { width: 5px; }
    .news-list::-webkit-scrollbar-track { background: transparent; }
    .news-list::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }

    .news-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      text-align: center;
      padding: 2rem;
    }

    .news-empty .icon {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
      opacity: 0.4;
    }

    .news-empty .text {
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .news-item {
      background: var(--bg);
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      margin-bottom: 0.6rem;
      cursor: default;
      transition: border-color 0.2s, background 0.2s;
    }

    .news-item:hover {
      border-color: var(--accent);
      background: var(--hover);
    }

    .news-item .news-title {
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--ink);
      margin-bottom: 0.5rem;
    }

    .news-item .news-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .news-tag {
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 0.68rem;
      font-weight: 600;
    }

    .news-tag.positive {
      background: rgba(248,81,73,0.15);
      color: var(--red);
    }

    .news-tag.negative {
      background: rgba(63,185,80,0.15);
      color: var(--green);
    }

    .news-tag.neutral {
      background: rgba(139,148,158,0.15);
      color: var(--muted);
    }

    /* K-line day info tooltip area */
    .day-info {
      background: var(--bg3);
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.75rem;
      font-size: 0.8rem;
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .day-info .item {
      display: flex;
      gap: 0.35rem;
    }

    .day-info .item .lbl {
      color: var(--muted);
    }

    .day-info .item .val {
      font-weight: 600;
      font-family: 'Courier New', monospace;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .main-container {
        grid-template-columns: 1fr;
        padding: 1rem;
      }
      .news-panel {
        position: static;
        max-height: 500px;
      }
      .stock-info-bar {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.75rem;
      }
      .header-inner {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    /* Loading */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s;
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--rule);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loading">
    <div class="loading-spinner"></div>
  </div>

  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">A</div>
        <div>
          <h1>A股新闻梳理系统</h1>
          <div class="subtitle">K线联动 · 新闻回溯 · 一键查询</div>
        </div>
      </div>
      <div class="stock-selector">
        <label>选择股票：</label>
        <select class="stock-select" id="stockSelect">
          <option value="">-- 请选择 --</option>
        </select>
      </div>
    </div>
  </header>

  <div class="main-container">
    <!-- Stock Info Bar -->
    <div class="stock-info-bar" id="stockInfoBar" style="display:none;">
      <div class="stock-name-block">
        <span class="name" id="infoName">--</span>
        <span class="code" id="infoCode">--</span>
        <span class="industry" id="infoIndustry">--</span>
      </div>
      <div class="price-stats" id="priceStats">
        <div class="price-stat">
          <span class="label">最新价</span>
          <span class="value" id="infoClose">--</span>
        </div>
        <div class="price-stat">
          <span class="label">涨跌幅</span>
          <span class="value" id="infoChange">--</span>
        </div>
        <div class="price-stat">
          <span class="label">最高</span>
          <span class="value" id="infoHigh">--</span>
        </div>
        <div class="price-stat">
          <span class="label">最低</span>
          <span class="value" id="infoLow">--</span>
        </div>
        <div class="price-stat">
          <span class="label">成交量</span>
          <span class="value" id="infoVolume">--</span>
        </div>
      </div>
    </div>

    <!-- K-Line Chart -->
    <div class="chart-panel">
      <div class="panel-header">
        <span class="panel-title">历史K线走势</span>
        <span class="panel-hint">点击K线柱查看当日新闻</span>
      </div>
      <div class="chart-container" id="klineChart"></div>
    </div>

    <!-- News Panel -->
    <div class="news-panel">
      <div class="panel-header">
        <span class="panel-title">当日新闻</span>
        <span class="news-date-badge" id="newsDateBadge">请选择日期</span>
      </div>
      <div class="news-list" id="newsList">
        <div class="news-empty">
          <div class="icon">📰</div>
          <div class="text">请在左侧K线图中<br>点击某一天查看新闻</div>
        </div>
      </div>
    </div>
  </div>

  <script src="./_shared/js/echarts.min.js"></script>
  <script src="assets/charts.js"></script>
</body>
</html>
