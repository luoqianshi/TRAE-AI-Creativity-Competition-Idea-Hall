<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>婚宴统筹系统 - 张明远 & 林婉清</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--rose:#D4455A;--gold:#C9A96E;--white:#fff;--bg:#fdf6f0;--light-rose:#fce8ec;--light-gold:#f5edd9;--text:#333;--text-light:#888;--shadow:0 2px 12px rgba(0,0,0,0.1);--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
a{color:var(--rose);text-decoration:none}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px}
/* App Shell */
#app{max-width:100%;margin:0 auto;min-height:100vh}
.page{display:none;padding:20px;max-width:1200px;margin:0 auto;animation:fadeIn .3s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 24px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;user-select:none}
.btn:active{transform:scale(0.96)}
.btn-primary{background:var(--rose);color:#fff}
.btn-primary:hover{background:#c03a4e;box-shadow:0 4px 12px rgba(212,69,90,0.3)}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover{background:#b8945a;box-shadow:0 4px 12px rgba(201,169,110,0.3)}
.btn-outline{background:transparent;border:2px solid var(--rose);color:var(--rose)}
.btn-outline:hover{background:var(--rose);color:#fff}
.btn-ghost{background:rgba(212,69,90,0.1);color:var(--rose)}
.btn-ghost:hover{background:rgba(212,69,90,0.2)}
.btn-lg{padding:14px 36px;font-size:18px;border-radius:12px}
.btn-sm{padding:6px 14px;font-size:13px;border-radius:6px}
.btn-block{display:flex;width:100%}
.btn:disabled{opacity:0.5;cursor:not-allowed}
/* Cards */
.card{background:var(--white);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px;transition:transform .2s}
.card:hover{transform:translateY(-2px)}
.card-gold{border:2px solid var(--gold)}
.card-rose{border-left:4px solid var(--rose)}
/* Form */
input,select,textarea{padding:10px 14px;border:2px solid #e8e0d8;border-radius:8px;font-size:15px;outline:none;transition:border-color .2s;width:100%;background:var(--white)}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
input::placeholder{color:#bbb}
.form-group{margin-bottom:14px}
.form-group label{display:block;margin-bottom:4px;font-weight:600;font-size:14px;color:#666}
/* Badge */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-rose{background:var(--light-rose);color:var(--rose)}
.badge-gold{background:var(--light-gold);color:#a07a3a}
.badge-green{background:#e8f5e9;color:#2e7d32}
.badge-gray{background:#f0f0f0;color:#999}
/* Header */
.header{background:linear-gradient(135deg,var(--rose),#b83448);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,0.15)}
.header h2{font-size:18px;font-weight:700}
.header .role-tag{background:rgba(255,255,255,0.2);padding:4px 12px;border-radius:20px;font-size:12px}
.header .logout-btn{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;transition:all .2s}
.header .logout-btn:hover{background:rgba(255,255,255,0.25)}
/* Sidebar */
.sidebar-layout{display:flex;gap:0;min-height:calc(100vh - 56px)}
.sidebar{width:200px;background:var(--white);border-right:1px solid #eee;padding:12px 0;flex-shrink:0;overflow-y:auto}
.sidebar-item{display:flex;align-items:center;gap:8px;padding:10px 16px;cursor:pointer;font-size:14px;color:#555;transition:all .2s;border-left:3px solid transparent}
.sidebar-item:hover{background:var(--light-rose);color:var(--rose)}
.sidebar-item.active{background:var(--light-rose);color:var(--rose);border-left-color:var(--rose);font-weight:600}
.sidebar-content{flex:1;padding:20px;overflow-y:auto}
/* Stats Grid */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--white);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);text-align:center}
.stat-card .num{font-size:32px;font-weight:800;color:var(--rose);margin:8px 0}
.stat-card .label{font-size:14px;color:var(--text-light)}
.stat-card .sub{font-size:12px;color:#aaa;margin-top:4px}
/* Table */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
table th{background:var(--light-rose);color:var(--rose);padding:12px 14px;text-align:left;font-weight:600;white-space:nowrap}
table td{padding:10px 14px;border-bottom:1px solid #f0ece8;white-space:nowrap}
table tr:hover{background:#faf5f0}
/* Grid */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
/* Entrance Grid */
.entrance-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:20px}
.entrance-card{background:var(--white);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);text-align:center;cursor:pointer;transition:all .3s;border:2px solid transparent}
.entrance-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,0.12);border-color:var(--gold)}
.entrance-card .icon{font-size:48px;margin-bottom:12px}
.entrance-card .name{font-size:18px;font-weight:700;color:var(--rose)}
.entrance-card .desc{font-size:13px;color:var(--text-light);margin-top:6px}
/* Wedding Theme */
.wedding-hero{text-align:center;padding:40px 20px;position:relative}
.wedding-hero .shuangxi{font-size:80px;line-height:1;color:var(--rose);text-shadow:0 4px 20px rgba(212,69,90,0.3);margin-bottom:10px}
.wedding-hero .names{font-size:36px;font-weight:800;color:var(--rose);margin:10px 0}
.wedding-hero .date{font-size:18px;color:var(--gold);margin:8px 0}
.wedding-hero .countdown{font-size:16px;color:var(--text-light);margin-top:12px;background:var(--light-gold);display:inline-block;padding:8px 24px;border-radius:30px}
/* Timeline */
.timeline{position:relative;padding-left:30px}
.timeline::before{content:'';position:absolute;left:12px;top:0;bottom:0;width:2px;background:#e8e0d8}
.timeline-item{position:relative;padding:12px 0 12px 20px;margin-bottom:4px}
.timeline-item::before{content:'';position:absolute;left:-22px;top:18px;width:14px;height:14px;border-radius:50%;background:#e8e0d8;border:2px solid var(--white)}
.timeline-item.active::before{background:var(--rose);border-color:var(--gold);box-shadow:0 0 0 4px var(--light-rose)}
.timeline-item.done::before{background:var(--gold);border-color:var(--gold)}
.timeline-item .t-time{font-size:12px;color:var(--text-light)}
.timeline-item .t-title{font-size:15px;font-weight:600;margin:2px 0}
.timeline-item .t-desc{font-size:13px;color:var(--text-light)}
/* Table Layout */
.venue-layout{background:var(--white);border-radius:var(--radius);padding:30px;box-shadow:var(--shadow);position:relative;min-height:400px}
.stage{background:linear-gradient(135deg,var(--gold),#b8945a);color:#fff;text-align:center;padding:16px;border-radius:8px;font-size:20px;font-weight:700;margin-bottom:30px;letter-spacing:4px}
.tables-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:20px}
.table-node{width:120px;height:120px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;font-weight:600;border:3px solid var(--gold);background:var(--white);color:var(--text)}
.table-node:hover{transform:scale(1.08);box-shadow:0 4px 16px rgba(201,169,110,0.4)}
.table-node .tnum{font-size:22px;color:var(--rose)}
.table-node .tcount{font-size:12px;color:var(--text-light)}
/* Dish List */
.dish-row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid #f0ece8;transition:background .2s}
.dish-row:hover{background:var(--light-rose)}
.dish-row .d-order{width:30px;height:30px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.dish-row .d-name{flex:1;font-weight:600}
.dish-row .d-cat{font-size:12px;padding:2px 10px;border-radius:12px;background:var(--light-gold);color:#a07a3a}
.dish-row .d-status{font-size:12px;padding:2px 10px;border-radius:12px}
/* Photo Card */
.photo-card{background:linear-gradient(135deg,var(--light-rose),var(--light-gold));border-radius:var(--radius);padding:30px 20px;text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:all .3s;aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center}
.photo-card:hover{transform:scale(1.03);box-shadow:0 8px 24px rgba(0,0,0,0.15)}
.photo-card .p-emoji{font-size:48px;margin-bottom:8px}
.photo-card .p-label{font-size:13px;color:var(--text-light)}
.photo-card .p-badge{position:absolute;top:8px;right:8px}
.photo-wrap{position:relative}
/* Guest Card */
.guest-card{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--white);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,0.06);margin-bottom:8px;cursor:pointer;transition:all .2s}
.guest-card:hover{background:var(--light-rose)}
.guest-card .avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--gold));color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0}
/* Blessing */
.blessing-card{padding:16px;background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;border-left:4px solid var(--gold)}
.blessing-card .b-text{font-size:15px;line-height:1.6;margin-bottom:8px}
.blessing-card .b-from{font-size:13px;color:var(--text-light)}
/* Staff badge */
.staff-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600}
/* Fullscreen overlay */
.fullscreen-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px}
/* Waiter code input */
.code-input{font-size:48px;letter-spacing:16px;text-align:center;width:100%;max-width:400px;padding:20px;border:4px solid var(--gold);border-radius:16px;outline:none;font-weight:700;caret-color:var(--rose)}
.code-input:focus{border-color:var(--rose)}
/* Waiter step indicator */
.waiter-step{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:24px;background:var(--white);border-radius:12px;padding:12px 20px;box-shadow:var(--shadow)}
/* Shake animation */
@keyframes shake{0%,100%{transform:translateX(0)}10%,30%,50%,70%,90%{transform:translateX(-8px)}20%,40%,60%,80%{transform:translateX(8px)}}
.shake{animation:shake .5s ease-in-out}
/* Modal */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s}
.modal{background:var(--white);border-radius:var(--radius);padding:24px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.2)}
.modal h3{font-size:20px;margin-bottom:16px;color:var(--rose)}
/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--rose);color:#fff;padding:12px 28px;border-radius:8px;font-weight:600;z-index:99999;box-shadow:0 4px 20px rgba(0,0,0,0.2);animation:slideDown .3s ease;font-size:15px}
.toast.success{background:#2e7d32}
.toast.error{background:#c62828}
@keyframes slideDown{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
/* Search big */
.search-big{font-size:24px;padding:16px 20px;border-radius:12px;border:3px solid var(--gold);text-align:center;width:100%}
/* Flag */
.flag-pass{color:#2e7d32;font-weight:600}
.flag-pending{color:#e65100;font-weight:600}
/* Responsive */
@media(max-width:768px){
  .sidebar-layout{flex-direction:column}
  .sidebar{width:100%;display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid #eee;padding:8px}
  .sidebar-item{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;padding:8px 14px}
  .sidebar-item.active{border-left:none;border-bottom-color:var(--rose)}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .entrance-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .wedding-hero .names{font-size:26px}
  .wedding-hero .shuangxi{font-size:60px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .page{padding:12px}
  .sidebar-content{padding:12px}
  .table-node{width:90px;height:90px}
  .table-node .tnum{font-size:18px}
}
/* misc */
.text-center{text-align:center}
.text-rose{color:var(--rose)}
.text-gold{color:var(--gold)}
.mt-8{margin-top:8px}
.mt-16{margin-top:16px}
.mt-24{margin-top:24px}
.mb-16{margin-bottom:16px}
.flex-center{display:flex;align-items:center;justify-content:center}
.gap-8{gap:8px}
.gap-12{gap:12px}
.flex-wrap{display:flex;flex-wrap:wrap}
.pos-relative{position:relative}
.w-full{width:100%}
/* Carousel */
.carousel{width:100%;height:300px;border-radius:var(--radius);overflow:hidden;position:relative;background:linear-gradient(135deg,var(--light-rose),var(--light-gold))}
.carousel .slide{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:60px;opacity:0;transition:opacity .8s}
.carousel .slide.active{opacity:1}
/* Ring button */
.ring-btn{width:80px;height:80px;border-radius:50%;border:none;font-size:32px;cursor:pointer;transition:all .3s;box-shadow:0 4px 20px rgba(212,69,90,0.3)}
.ring-btn:hover{transform:scale(1.1)}
.ring-btn.ringing{background:var(--rose);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(212,69,90,0.4)}50%{box-shadow:0 0 0 20px rgba(212,69,90,0)}}
.ring-btn.idle{background:var(--gold);color:#fff;animation:none}
/* Watermark */
.watermark{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;background:repeating-linear-gradient(45deg,transparent,transparent 100px,rgba(212,69,90,0.03) 100px,rgba(212,69,90,0.03) 200px)}
/* Hidden */
.hidden{display:none!important}
</style>
</head>

function isDishServedAtTable(dishId, tableId) {
  return state.dishServing[`${tableId}_${dishId}`] || false;
}
function getTotalServedCount() {
  return Object.keys(state.dishServing).length;
}
function getTableServedCount(dishId) {
  return DATA.tables.filter(t => state.dishServing[`${t.id}_${dishId}`]).length;
}

// ============= ROUTER =============
function navigate(hash) {
  location.hash = hash;
}
function getHash() {
  return location.hash.slice(1) || 'home';
}

// ============= RENDER =============
let app = document.getElementById('app');

function render() {
  const hash = getHash();
  let html = '';
  if (hash === 'home') html = renderHome();
  else if (hash === 'host') html = renderHost();
  else if (hash === 'emcee') html = renderEmcee();
  else if (hash === 'photographer') html = renderPhotographer();
  else if (hash === 'usher') html = renderUsher();
  else if (hash === 'waiter') html = renderWaiter();
  else if (hash === 'staff') html = renderStaff();
  else if (hash === 'table/select') html = renderTableSelect();
  else if (hash.startsWith('table/')) html = renderTable(hash.split('/')[1]);
  else if (hash === 'guest') html = renderGuestLogin();
  else if (hash === 'guest/home') html = renderGuestHome();
  else html = renderHome();
  app.innerHTML = html;
  afterRender(hash);
}

function afterRender(hash) {
  // Bind nav clicks
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', e => {
      e.preventDefault();
      navigate(el.dataset.nav);
    });
  });
  // Bind modal close
  document.querySelectorAll('[data-close-modal]').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
    });
  });
  // Role-specific bindings
  if (hash === 'emcee') bindEmcee();
  else if (hash === 'photographer') bindPhotographer();
  else if (hash === 'usher') bindUsher();
  else if (hash === 'waiter') bindWaiter();
  else if (hash === 'staff') bindStaff();
  else if (hash === 'host') bindHost();
  else if (hash === 'guest') bindGuestLogin();
  else if (hash === 'guest/home') bindGuestHome();
  else if (hash.startsWith('table/')) bindTable(hash);
  else if (hash === 'table/select') bindTableSelect();
}

// ============= TOAST =============
function showToast(msg, type='info') {
  if (state.toastTimer) clearTimeout(state.toastTimer);
  let old = document.querySelector('.toast');
  if (old) old.remove();
  let t = document.createElement('div');
  t.className = 'toast' + (type === 'success' ? ' success' : type === 'error' ? ' error' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  state.toastTimer = setTimeout(() => { t.remove(); state.toastTimer = null; }, 2000);
}

// ============= MODAL =============
function showModal(html) {
  let overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal">${html}</div>`;
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  return overlay;
}

    if (idx === 3) { // 敬酒环节 - 上菜到6道
      DATA.tables.forEach(t => {
        state.dishes.slice(0, 6).forEach(d => { state.dishServing[`${t.id}_${d.id}`] = true; });
      });
    }
    if (idx === 4) {
      DATA.tables.forEach(t => {
        state.dishes.forEach(d => { state.dishServing[`${t.id}_${d.id}`] = true; });
      });
    }
    render();
    showToast(`已进入「${cer[idx].name}」环节`, 'success');
  }
}

        const tableCount = getTableServedCount(x.id);

        const isSelected = selDish && selDish.id === x.id;
        return `
        <div onclick="${allServed ? '' : `waiterSelectDish(${x.id})`}" style="padding:16px;border-radius:12px;cursor:${allServed ? 'not-allowed' : 'pointer'};background:${isSelected ? 'var(--light-rose)' : 'var(--white)'};border:2px solid ${isSelected ? 'var(--rose)' : allServed ? '#e8e0d8' : '#e8e0d8'};opacity:${allServed ? 0.5 : 1};transition:all .2s;text-align:center">
          <div style="font-weight:700;font-size:16px;color:${isSelected ? 'var(--rose)' : 'var(--text)'}">${x.order}. ${x.name}</div>
          <div style="font-size:13px;color:var(--text-light);margin-top:4px">${x.cat}</div>
          <div style="margin-top:8px;font-size:13px;font-weight:600;color:${allServed ? '#2e7d32' : '#e65100'}">已上 ${tableCount}/${totalTables}桌${allServed ? ' ✅' : ''}</div>
        </div>`;
      }).join('')}
    </div>` : ''}

    ${step === 'select_table' && selDish ? `
    <h3 style="color:var(--rose);margin-bottom:12px">🎯 选择上菜桌号 - ${selDish.name}</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-bottom:24px">
      ${allTables.map(t => {
        const served = isDishServedAtTable(selDish.id, t.id);
        const isSelected = selTable && selTable.id === t.id;
        return `
        <div onclick="${served ? '' : `waiterSelectTable('${t.id}')`}" style="padding:20px 12px;border-radius:12px;cursor:${served ? 'not-allowed' : 'pointer'};background:${isSelected ? 'var(--light-rose)' : 'var(--white)'};border:2px solid ${isSelected ? 'var(--rose)' : served ? '#e8e0d8' : 'var(--gold)'};opacity:${served ? 0.45 : 1};text-align:center;transition:all .2s">
          <div style="font-size:24px;font-weight:800;color:${isSelected ? 'var(--rose)' : served ? '#aaa' : 'var(--text)'}">${t.name}</div>
          <div style="font-size:13px;margin-top:6px;font-weight:600;color:${served ? '#2e7d32' : '#e65100'}">${served ? '✅ 已上' : '⏳ 待上'}</div>
        </div>`;
      }).join('')}
    </div>
    <button class="btn btn-ghost" onclick="waiterBack()">⬅ 返回选择菜品</button>` : ''}

    ${step === 'enter_code' && selDish && selTable ? `
    <h3 style="color:var(--rose);margin-bottom:8px">🔑 输入传菜码</h3>
    <div style="text-align:center;margin-bottom:8px;font-size:16px;color:var(--text-light)">
      菜品：<strong>${selDish.name}</strong> → 目标：<strong>${selTable.name}</strong>
    </div>
    <div class="card" style="text-align:center;padding:30px">
      <div style="font-size:14px;color:var(--text-light);margin-bottom:16px">请输入 ${selTable.name} 的6位传菜码</div>
      <input class="code-input" id="waiterCodeInput" type="number" pattern="[0-9]*" inputmode="numeric" maxlength="6" placeholder="______" style="font-size:48px;text-align:center;width:100%;max-width:300px;caret-color:var(--rose)" oninput="waiterCodeInput(this)">
      <div id="waiterCodeFeedback" style="margin-top:16px;min-height:60px"></div>
    </div>
    <button class="btn btn-ghost" style="margin-top:8px" onclick="waiterBack()">⬅ 返回选择桌号</button>` : ''}

    ${step === 'success' ? `
    <div style="text-align:center;padding:40px 20px">
      <div style="font-size:64px;margin-bottom:16px">✅</div>
      <div style="font-size:32px;font-weight:800;color:#2e7d32">上菜成功！</div>
      <div style="font-size:20px;color:var(--text);margin-top:12px">${selDish.name} → ${selTable.name}</div>
      <div style="font-size:14px;color:var(--text-light);margin-top:8px">2秒后自动返回...</div>
    </div>` : ''}

    ${step === 'fail' ? `
    <div style="text-align:center;padding:40px 20px">
      <div style="font-size:64px;margin-bottom:16px">❌</div>
      <div id="waiterErrorMsg" style="font-size:24px;font-weight:800;color:#c62828" class="shake">传菜码不匹配</div>

    <!-- Serving Records -->
    <div class="card" style="margin-top:24px">
      <h4 style="color:var(--rose);margin-bottom:12px">📝 本传菜员上菜记录</h4>

      <div style="max-height:200px;overflow-y:auto">
        ${state.waiterRecords.slice(-5).reverse().map(r => `
          <div style="display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #f0ece8;font-size:14px">
            <span><strong>${r.dishName}</strong> → ${r.tableName}</span>
            <span style="color:var(--text-light)">${r.time}</span>
          </div>
        `).join('')}
      </div>`}
    </div>
  </div>`;
}

function waiterSelectDish(dishId) {
  state.waiterSelectedDish = state.dishes.find(d => d.id === dishId);
  state.waiterSelectedTable = null;
  state.waiterStep = 'select_table';
  render();
}

function waiterSelectTable(tableId) {
  state.waiterSelectedTable = DATA.tables.find(t => t.id === tableId);
  state.waiterStep = 'enter_code';
  render();
  setTimeout(() => {
    const inp = document.getElementById('waiterCodeInput');
    if (inp) inp.focus();
  }, 100);
}

function waiterBack() {
  if (state.waiterStep === 'select_table') {
    state.waiterSelectedDish = null;
    state.waiterStep = 'select_dish';
  } else if (state.waiterStep === 'enter_code') {
    state.waiterSelectedTable = null;
    state.waiterStep = 'select_table';
  }
  render();
}

function waiterReset() {
  state.waiterStep = 'select_dish';
  state.waiterSelectedDish = null;
  state.waiterSelectedTable = null;
}

function bindWaiter() {
  const inp = document.getElementById('waiterCodeInput');
  if (inp) inp.focus();
}

function waiterCodeInput(el) {
  let val = el.value.replace(/\D/g, '').slice(0, 6);
  el.value = val;
  const fb = document.getElementById('waiterCodeFeedback');
  if (!fb) return;
  if (val.length === 6) {
    const dish = state.waiterSelectedDish;
    const table = state.waiterSelectedTable;
    if (!dish || !table) {
      fb.innerHTML = `<div style="font-size:20px;color:#c62828;font-weight:800" class="shake">⚠️ 请先选择菜品和桌号</div>`;
      setTimeout(() => { el.value = ''; fb.innerHTML = ''; }, 1500);
      return;
    }
    // Verify code matches table
    if (table.code !== val) {
      fb.innerHTML = `<div style="font-size:24px;color:#c62828;font-weight:800" class="shake">❌ 传菜码不匹配！</div>`;
      el.classList.add('shake');
      state.waiterStep = 'fail';
      render();
      setTimeout(() => {
        el.classList.remove('shake');
        el.value = '';
        fb.innerHTML = '';
        state.waiterStep = 'enter_code';
        render();
        setTimeout(() => {
          const inp2 = document.getElementById('waiterCodeInput');
          if (inp2) inp2.focus();
        }, 100);
      }, 1500);
      return;
    }
    // Check if dish already served at this table
    if (isDishServedAtTable(dish.id, table.id)) {
      fb.innerHTML = `<div style="font-size:24px;color:#c62828;font-weight:800" class="shake">❌ 该菜该桌已上过！</div>`;
      el.classList.add('shake');
      state.waiterStep = 'fail';
      render();
      setTimeout(() => {
        el.classList.remove('shake');
        el.value = '';
        fb.innerHTML = '';
        state.waiterStep = 'enter_code';
        state.waiterSelectedTable = null;
        render();
        setTimeout(() => {
          const inp2 = document.getElementById('waiterCodeInput');
          if (inp2) inp2.focus();
        }, 100);
      }, 1500);
      return;
    }
    // Success
    state.dishServing[`${table.id}_${dish.id}`] = true;
    state.waiterRecords.push({
      dishName: dish.name,
      tableName: table.name,
      time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
    });
    state.waiterStep = 'success';
    render();
    setTimeout(() => {
      waiterReset();
      render();
    }, 2000);
  } else {
    fb.innerHTML = '';
  }
}

function bindTable(hash) {
  // Carousel auto rotate
  const tid = hash.split('/')[1];

    const t = DATA.tables.find(x => x.id === tid);
    if (!t) { clearInterval(state.tableInterval); return; }
    state.tableCarouselIdx = ((state.tableCarouselIdx || 0) + 1) % 4;
    // Update carousel slides
    const slides = document.querySelectorAll('.slide');
    slides.forEach((s, i) => {
      s.classList.toggle('active', i === state.tableCarouselIdx);
    });
  }, 3000);
  // Auto return
  if (state.tableReturnTimer) clearTimeout(state.tableReturnTimer);
  state.tableReturnTimer = setTimeout(() => {
    navigate('home');
  }, 60000);
  // Reset auto return on interaction
  document.addEventListener('click', resetTableTimer, {once: false});
  function resetTableTimer() {
    if (state.tableReturnTimer) clearTimeout(state.tableReturnTimer);
    state.tableReturnTimer = setTimeout(() => {
      navigate('home');
    }, 60000);
  }
  document.addEventListener('click', resetTableTimer);
}

    return renderGuestHome();
  }
  return `
  <div class="page active" style="max-width:400px;margin:0 auto;padding-top:60px">
    <div style="text-align:center;margin-bottom:30px">
      <div style="font-size:60px">💌</div>
      <h2 style="color:var(--rose);margin-top:12px">宾客登录</h2>
      <p style="color:var(--text-light)">请输入您的信息</p>
    </div>
    <div class="card">
      <div class="form-group"><label>📱 手机号</label><input id="guestPhoneInput" placeholder="请输入您的手机号" onkeydown="if(event.key==='Enter')guestLogin()"></div>
      <div class="form-group"><label>🔐 密码</label><input id="guestPwdInput" type="password" placeholder="默认密码 1234" onkeydown="if(event.key==='Enter')guestLogin()"></div>
      <button class="btn btn-primary btn-lg btn-block mt-16" onclick="guestLogin()">登录</button>
    </div>
  </div>`;
}

function bindGuestLogin() {}

function guestLogin() {
  const phone = document.getElementById('guestPhoneInput')?.value || '';
  const pwd = document.getElementById('guestPwdInput')?.value || '';
  const g = state.guests.find(x => x.phone === phone && pwd === '1234');
  if (g) {
    state.guestLogin = g;
    render();
  } else {
    showToast('手机号或密码错误', 'error');
  }
}

function renderGuestHome() {
  const g = state.guestLogin;
  if (!g) return renderGuestLogin();
  const t = DATA.tables.find(x => x.id === g.table);
  const served = getTotalServedCount();
  const totalD = state.dishes.length * DATA.tables.length;
  const onlinePhotos = state.photos.filter(p => p.online);
  return `
  <div style="padding:20px;max-width:600px;margin:0 auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <div>
        <h2 style="color:var(--rose)">欢迎您，${g.name}</h2>
        <p style="color:var(--text-light);font-size:14px">${g.relation} · ${g.checked ? '✅ 已签到' : '⏳ 未签到'}</p>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="guestLogout()">退出</button>
    </div>
    <div class="card" style="text-align:center;margin-bottom:16px;background:linear-gradient(135deg,var(--light-rose),var(--light-gold))">
      <div style="font-size:18px;font-weight:700;color:var(--rose)">您的座位</div>
      <div style="font-size:32px;font-weight:800;margin:8px 0">${t?.name || '未知'}</div>
      <div style="font-size:16px;color:var(--text-light)">${g.seat}号座</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
      <div class="card" style="text-align:center;cursor:pointer;padding:20px 12px" onclick="showTableGuests('${g.table}')">
        <div style="font-size:32px">👥</div>
        <div style="font-weight:700;font-size:14px;margin-top:6px">本桌人员</div>
      </div>
      <div class="card" style="text-align:center;padding:20px 12px">
        <div style="font-size:32px">🍽️</div>
        <div style="font-weight:700;font-size:14px;margin-top:6px">菜品进度</div>
        <div style="background:#f0ece8;border-radius:8px;height:8px;margin-top:8px;overflow:hidden">
          <div style="height:100%;width:${totalD > 0 ? Math.round(served/totalD*100) : 0}%;background:linear-gradient(90deg,var(--gold),var(--rose));border-radius:8px"></div>
        </div>
        <div style="font-size:12px;color:var(--text-light);margin-top:4px">${served}/${totalD}</div>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <h4 style="color:var(--rose);margin-bottom:12px">🖼️ 照片墙</h4>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
        ${onlinePhotos.slice(0,8).map(p => `
          <div style="background:linear-gradient(135deg,var(--light-rose),var(--light-gold));border-radius:8px;padding:16px 8px;text-align:center;font-size:24px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center">
            <div>${p.emoji}</div>
            <div style="font-size:10px;color:var(--text-light);margin-top:4px">${p.label}</div>
          </div>
        `).join('')}
      </div>
    </div>
    <div class="card">
      <h4 style="color:var(--rose);margin-bottom:12px">💌 送祝福</h4>
      <div class="form-group">
        <textarea id="guestBlessingText" placeholder="写下您的祝福..." rows="3" style="resize:none"></textarea>
      </div>
      <button class="btn btn-gold btn-block" onclick="submitGuestBlessing()">提交祝福</button>
      <div style="margin-top:16px;max-height:200px;overflow-y:auto">
        ${state.blessings.filter(b => b.status === 'approved').map(b => `
          <div class="blessing-card" style="padding:10px;margin-bottom:6px">
            <div style="font-size:14px">"${b.text}"</div>
            <div style="font-size:12px;color:var(--text-light)">—— ${b.from}</div>
          </div>
        `).join('')}
      </div>
    </div>
  </div>`;
}

function bindGuestHome() {}

function guestLogout() {
  state.guestLogin = null;
  render();
}

function submitGuestBlessing() {
  const text = document.getElementById('guestBlessingText')?.value;
  if (!text || text.trim() === '') { showToast('请输入祝福语', 'error'); return; }
  const g = state.guestLogin;
  state.blessings.push({
    id: Date.now(),
    from: g.name,
    text: text.trim(),
    status: 'pending'
  });
  document.getElementById('guestBlessingText').value = '';
  render();
  showToast('祝福已提交，待审核', 'success');
}

// ============= INIT =============
window.addEventListener('hashchange', render);
window.addEventListener('load', () => {
  if (!location.hash) location.hash = 'home';
  render();
});
// Also capture initial hash
if (!location.hash) location.hash = 'home';
</script>
</body>
</html>
