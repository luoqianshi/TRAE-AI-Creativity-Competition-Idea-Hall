<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家物存 - 智能家庭物品收纳与过期管家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#5B8FF9',
                        primaryLight: '#E8F0FE',
                        success: '#52C41A',
                        warning: '#FAAD14',
                        danger: '#FF4D4F',
                        bg: '#F5F7FA',
                        card: '#FFFFFF',
                        text: '#333333',
                        textLight: '#999999',
                        border: '#E8E8E8'
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', 'Helvetica', 'Arial', 'sans-serif']
                    },
                    boxShadow: {
                        card: '0 2px 8px rgba(0, 0, 0, 0.06)',
                        modal: '0 10px 30px rgba(0, 0, 0, 0.15)'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F5F7FA;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .page-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .scroll-area {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .fade-enter {
            opacity: 0;
            transform: translateY(20px);
        }
        .fade-enter-active {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .modal-enter {
            opacity: 0;
        }
        .modal-enter-active {
            opacity: 1;
            transition: opacity 0.2s ease;
        }
        .modal-content-enter {
            transform: translateY(100%);
        }
        .modal-content-enter-active {
            transform: translateY(0);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .slide-left-enter {
            transform: translateX(100%);
        }
        .slide-left-enter-active {
            transform: translateX(0);
            transition: transform 0.3s ease;
        }
        .calendar-day.active {
            background: #5B8FF9;
            color: white;
        }
        .calendar-day.today {
            border: 2px solid #5B8FF9;
        }
        .calendar-day.has-expire {
            position: relative;
        }
        .calendar-day.has-expire::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #FF4D4F;
        }
        .category-tag {
            transition: all 0.2s;
        }
        .category-tag.active {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(91, 143, 249, 0.3);
        }
        .position-tree ul {
            list-style: none;
            padding-left: 16px;
        }
        .position-tree li {
            padding: 8px 0;
            position: relative;
        }
        .position-tree li::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 16px;
            width: 8px;
            height: 1px;
            background: #E8E8E8;
        }
        .position-tree li::after {
            content: '';
            position: absolute;
            left: -12px;
            top: 8px;
            width: 1px;
            height: 24px;
            background: #E8E8E8;
        }
        .position-tree li:last-child::after {
            height: 12px;
        }
    </style>
</head>
<body>
    <div id="app" class="page-container">
        <header class="bg-white px-4 py-3 flex items-center justify-between shadow-sm z-10">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center">
                    <i class="fa-solid fa-box-open text-white"></i>
                </div>
                <h1 class="text-lg font-bold text-text">家物存</h1>
            </div>
            <div class="flex items-center space-x-4">
                <button class="relative w-9 h-9 rounded-full flex items-center justify-center hover:bg-bg transition-colors">
                    <i class="fa-solid fa-bell text-textLight"></i>
                    <span class="absolute top-1 right-1 w-2 h-2 bg-danger rounded-full"></span>
                </button>
                <button onclick="showAddItem()" class="w-9 h-9 bg-primary rounded-full flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
        </header>

        <main class="scroll-area" id="main-content">
            <div id="page-home" class="p-4 space-y-4">
                <div class="relative">
                    <i class="fa-solid fa-search text-textLight absolute left-3 top-1/2 transform -translate-y-1/2"></i>
                    <input type="text" placeholder="搜索物品名称..." class="w-full bg-white pl-10 pr-4 py-3 rounded-xl shadow-card border-none outline-none text-text" oninput="handleSearch(this.value)">
                </div>

                <div class="flex items-center justify-between">
                    <h2 class="text-base font-semibold text-text">物品分类</h2>
                    <button onclick="showCategoryManage()" class="text-sm text-primary">管理</button>
                </div>
                <div class="flex space-x-3 overflow-x-auto hide-scrollbar pb-2" id="category-list">
                </div>

                <div class="flex items-center justify-between">
                    <h2 class="text-base font-semibold text-text">临期预警</h2>
                    <span class="text-xs text-danger bg-danger/10 px-2 py-1 rounded-full" id="expire-count">3件即将过期</span>
                </div>
                <div class="space-y-3" id="expire-list">
                </div>

                <div class="flex items-center justify-between">
                    <h2 class="text-base font-semibold text-text">全部物品</h2>
                    <select class="text-sm text-textLight bg-transparent outline-none" onchange="handleSortChange(this.value)">
                        <option value="time">按添加时间</option>
                        <option value="expire">按过期时间</option>
                        <option value="name">按名称</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3" id="item-grid">
                </div>
            </div>

            <div id="page-calendar" class="p-4 space-y-4" style="display: none;">
                <div class="bg-white rounded-xl shadow-card p-4">
                    <div class="flex items-center justify-between mb-4">
                        <button onclick="changeMonth(-1)" class="w-8 h-8 flex items-center justify-center text-textLight hover:text-primary transition-colors">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        <h2 class="text-lg font-bold text-text" id="calendar-title">2024年5月</h2>
                        <button onclick="changeMonth(1)" class="w-8 h-8 flex items-center justify-center text-textLight hover:text-primary transition-colors">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                    <div class="grid grid-cols-7 gap-1 mb-2">
                        <div class="text-center text-xs text-textLight py-2">日</div>
                        <div class="text-center text-xs text-textLight py-2">一</div>
                        <div class="text-center text-xs text-textLight py-2">二</div>
                        <div class="text-center text-xs text-textLight py-2">三</div>
                        <div class="text-center text-xs text-textLight py-2">四</div>
                        <div class="text-center text-xs text-textLight py-2">五</div>
                        <div class="text-center text-xs text-textLight py-2">六</div>
                    </div>
                    <div class="grid grid-cols-7 gap-1" id="calendar-grid">
                    </div>
                </div>

                <h2 class="text-base font-semibold text-text">当日物品</h2>
                <div class="space-y-3" id="calendar-items">
                    <div class="text-center py-8 text-textLight">
                        <i class="fa-solid fa-calendar-check text-4xl mb-2 opacity-50"></i>
                        <p>当天暂无过期物品</p>
                    </div>
                </div>
            </div>

            <div id="page-space" class="p-4 space-y-4" style="display: none;">
                <div class="bg-white rounded-xl shadow-card p-4">
                    <h2 class="text-base font-semibold text-text mb-4">我的家</h2>
                    <div class="position-tree" id="space-tree">
                    </div>
                </div>

                <div id="space-items" style="display: none;">
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="text-base font-semibold text-text" id="space-title">客厅 - 电视柜</h2>
                        <button onclick="backToSpace()" class="text-sm text-primary">返回</button>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                    </div>
                </div>
            </div>

            <div id="page-settings" class="p-4 space-y-4" style="display: none;">
                <div class="bg-white rounded-xl shadow-card overflow-hidden">
                    <div class="p-4 border-b border-border">
                        <h2 class="text-base font-semibold text-text">提醒设置</h2>
                    </div>
                    <div class="p-4">
                        <div class="flex items-center justify-between mb-4">
                            <span class="text-text">临期提醒</span>
                            <div class="flex space-x-2">
                                <button onclick="setRemindDays(3)" class="remind-btn px-3 py-1 text-sm rounded-full border border-border" data-days="3">3天</button>
                                <button onclick="setRemindDays(7)" class="remind-btn px-3 py-1 text-sm rounded-full border border-primary bg-primaryLight text-primary" data-days="7">7天</button>
                                <button onclick="setRemindDays(30)" class="remind-btn px-3 py-1 text-sm rounded-full border border-border" data-days="30">30天</button>
                            </div>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-text">每日提醒时间</span>
                            <div class="flex items-center space-x-2">
                                <select class="bg-bg rounded-lg px-3 py-2 text-sm outline-none border-none">
                                    <option>08:00</option>
                                    <option>09:00</option>
                                    <option>12:00</option>
                                    <option>18:00</option>
                                    <option>20:00</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-card overflow-hidden">
                    <div class="p-4 border-b border-border">
                        <h2 class="text-base font-semibold text-text">数据管理</h2>
                    </div>
                    <div class="p-4 space-y-3">
                        <div class="flex items-center justify-between py-2">
                            <span class="text-text">数据备份</span>
                            <button onclick="exportData()" class="text-sm text-primary">导出</button>
                        </div>
                        <div class="flex items-center justify-between py-2">
                            <span class="text-text">从文件导入</span>
                            <button onclick="importData()" class="text-sm text-primary">导入</button>
                        </div>
                        <div class="flex items-center justify-between py-2">
                            <span class="text-text">当前物品数量</span>
                            <span class="text-textLight" id="item-count">0件</span>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-card overflow-hidden">
                    <div class="p-4 border-b border-border">
                        <h2 class="text-base font-semibold text-text">关于</h2>
                    </div>
                    <div class="p-4 space-y-3">
                        <div class="flex items-center justify-between py-2">
                            <span class="text-text">版本号</span>
                            <span class="text-textLight">1.0.0</span>
                        </div>
                        <div class="flex items-center justify-between py-2">
                            <span class="text-text">用户协议</span>
                            <i class="fa-solid fa-chevron-right text-textLight"></i>
                        </div>
                        <div class="flex items-center justify-between py-2">
                            <span class="text-text">隐私政策</span>
                            <i class="fa-solid fa-chevron-right text-textLight"></i>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <nav class="bg-white border-t border-border safe-bottom z-10">
            <div class="flex justify-around items-center h-14">
                <button onclick="switchPage('home')" class="nav-btn flex flex-col items-center justify-center w-full h-full text-primary" data-page="home">
                    <i class="fa-solid fa-home text-lg mb-1"></i>
                    <span class="text-xs">首页</span>
                </button>
                <button onclick="switchPage('calendar')" class="nav-btn flex flex-col items-center justify-center w-full h-full text-textLight" data-page="calendar">
                    <i class="fa-solid fa-calendar-days text-lg mb-1"></i>
                    <span class="text-xs">日历</span>
                </button>
                <button onclick="switchPage('space')" class="nav-btn flex flex-col items-center justify-center w-full h-full text-textLight" data-page="space">
                    <i class="fa-solid fa-location-dot text-lg mb-1"></i>
                    <span class="text-xs">空间</span>
                </button>
                <button onclick="switchPage('settings')" class="nav-btn flex flex-col items-center justify-center w-full h-full text-textLight" data-page="settings">
                    <i class="fa-solid fa-user text-lg mb-1"></i>
                    <span class="text-xs">我的</span>
                </button>
            </div>
        </nav>

        <div id="modal-add" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end justify-center" onclick="closeModal('modal-add')">
            <div class="bg-white w-full rounded-t-2xl max-h-[90vh] overflow-y-auto modal-content-enter" onclick="event.stopPropagation()">
                <div class="sticky top-0 bg-white px-4 py-4 border-b border-border flex items-center justify-between z-10">
                    <h3 class="text-base font-bold text-text" id="modal-title">添加物品</h3>
                    <button onclick="closeModal('modal-add')" class="w-8 h-8 flex items-center justify-center text-textLight">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="p-4 space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-text mb-2">物品图片</label>
                        <div class="relative w-full h-32 bg-bg rounded-xl flex items-center justify-center overflow-hidden">
                            <img id="item-image" src="" alt="" class="absolute inset-0 w-full h-full object-cover" style="display: none;">
                            <div id="upload-area" class="flex flex-col items-center text-textLight">
                                <i class="fa-solid fa-camera text-3xl mb-2"></i>
                                <span class="text-sm">点击拍照或上传</span>
                            </div>
                            <input type="file" id="file-input" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" onchange="handleImageUpload(this)">
                            <button id="remove-image" onclick="removeImage()" class="absolute top-2 right-2 w-6 h-6 bg-black/50 rounded-full flex items-center justify-center text-white" style="display: none;">
                                <i class="fa-solid fa-xmark text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-text mb-2">物品名称</label>
                        <input type="text" id="item-name" placeholder="请输入物品名称" class="w-full bg-bg rounded-xl px-4 py-3 outline-none border-none">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-text mb-2">分类</label>
                        <div class="flex flex-wrap gap-2" id="modal-categories">
                        </div>
                        <input type="hidden" id="item-category">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-text mb-2">存放位置</label>
                        <div class="relative">
                            <input type="text" id="item-position" placeholder="点击选择位置" class="w-full bg-bg rounded-xl px-4 py-3 outline-none border-none cursor-pointer" onclick="showPositionPicker()" readonly>
                            <i class="fa-solid fa-chevron-right text-textLight absolute right-4 top-1/2 transform -translate-y-1/2"></i>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-text mb-2">购入日期</label>
                            <input type="date" id="item-purchase-date" class="w-full bg-bg rounded-xl px-4 py-3 outline-none border-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-text mb-2">过期日期</label>
                            <input type="date" id="item-expire-date" class="w-full bg-bg rounded-xl px-4 py-3 outline-none border-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-text mb-2">备注</label>
                        <textarea id="item-note" placeholder="添加备注信息..." class="w-full bg-bg rounded-xl px-4 py-3 outline-none border-none h-20 resize-none"></textarea>
                        <div class="flex items-center space-x-3 mt-2">
                            <span class="text-sm text-textLight">样式：</span>
                            <div class="flex items-center space-x-2">
                                <button onclick="setColor('text')" class="w-6 h-6 rounded-full bg-black" data-color="#000000" data-type="text"></button>
                                <button onclick="setColor('text')" class="w-6 h-6 rounded-full bg-red-500" data-color="#EF4444" data-type="text"></button>
                                <button onclick="setColor('text')" class="w-6 h-6 rounded-full bg-blue-500" data-color="#3B82F6" data-type="text"></button>
                                <button onclick="setColor('text')" class="w-6 h-6 rounded-full bg-green-500" data-color="#22C55E" data-type="text"></button>
                            </div>
                            <div class="flex items-center space-x-2 ml-2">
                                <button onclick="setColor('bg')" class="w-6 h-6 rounded-full bg-white border border-border" data-color="#FFFFFF" data-type="bg"></button>
                                <button onclick="setColor('bg')" class="w-6 h-6 rounded-full bg-yellow-100" data-color="#FEF3C7" data-type="bg"></button>
                                <button onclick="setColor('bg')" class="w-6 h-6 rounded-full bg-blue-100" data-color="#DBEAFE" data-type="bg"></button>
                                <button onclick="setColor('bg')" class="w-6 h-6 rounded-full bg-green-100" data-color="#D1FAE5" data-type="bg"></button>
                            </div>
                        </div>
                        <input type="hidden" id="item-text-color" value="#000000">
                        <input type="hidden" id="item-bg-color" value="#FFFFFF">
                    </div>

                    <button onclick="saveItem()" class="w-full bg-primary text-white py-3 rounded-xl font-medium mt-4">保存</button>
                </div>
            </div>
        </div>

        <div id="modal-position" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end justify-center" onclick="closeModal('modal-position')">
            <div class="bg-white w-full rounded-t-2xl max-h-[70vh] overflow-y-auto" onclick="event.stopPropagation()">
                <div class="sticky top-0 bg-white px-4 py-4 border-b border-border flex items-center justify-between">
                    <h3 class="text-base font-bold text-text">选择存放位置</h3>
                    <button onclick="closeModal('modal-position')" class="w-8 h-8 flex items-center justify-center text-textLight">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="p-4 space-y-2" id="position-list">
                </div>
            </div>
        </div>

        <div id="modal-category" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end justify-center" onclick="closeModal('modal-category')">
            <div class="bg-white w-full rounded-t-2xl max-h-[80vh] overflow-y-auto" onclick="event.stopPropagation()">
                <div class="sticky top-0 bg-white px-4 py-4 border-b border-border flex items-center justify-between">
                    <h3 class="text-base font-bold text-text">分类管理</h3>
                    <button onclick="closeModal('modal-category')" class="w-8 h-8 flex items-center justify-center text-textLight">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="p-4 space-y-3">
                    <div class="flex space-x-2">
                        <input type="text" id="new-category" placeholder="新分类名称" class="flex-1 bg-bg rounded-xl px-4 py-2 outline-none border-none">
                        <button onclick="addCategory()" class="bg-primary text-white px-4 py-2 rounded-xl text-sm">添加</button>
                    </div>
                    <div class="grid grid-cols-3 gap-2" id="manage-categories">
                    </div>
                </div>
            </div>
        </div>

        <div id="modal-item-detail" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end justify-center" onclick="closeModal('modal-item-detail')">
            <div class="bg-white w-full rounded-t-2xl max-h-[80vh] overflow-y-auto" onclick="event.stopPropagation()">
                <div class="relative h-48 bg-bg">
                    <img id="detail-image" src="" alt="" class="w-full h-full object-cover">
                    <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/60 to-transparent p-4">
                        <h3 class="text-white text-xl font-bold" id="detail-name"></h3>
                        <span class="text-white/80 text-sm" id="detail-category"></span>
                    </div>
                    <button onclick="closeModal('modal-item-detail')" class="absolute top-4 right-4 w-8 h-8 bg-black/50 rounded-full flex items-center justify-center text-white">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="p-4 space-y-4">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-primaryLight rounded-lg flex items-center justify-center">
                            <i class="fa-solid fa-location-dot text-primary"></i>
                        </div>
                        <div>
                            <p class="text-xs text-textLight">存放位置</p>
                            <p class="text-sm text-text" id="detail-position"></p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-primaryLight rounded-lg flex items-center justify-center">
                            <i class="fa-solid fa-calendar text-primary"></i>
                        </div>
                        <div>
                            <p class="text-xs text-textLight">购入日期</p>
                            <p class="text-sm text-text" id="detail-purchase"></p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-primaryLight rounded-lg flex items-center justify-center">
                            <i class="fa-solid fa-clock text-primary"></i>
                        </div>
                        <div>
                            <p class="text-xs text-textLight">过期日期</p>
                            <p class="text-sm text-text" id="detail-expire"></p>
                        </div>
                    </div>
                    <div>
                        <p class="text-xs text-textLight mb-2">备注</p>
                        <div class="bg-bg rounded-xl p-3" id="detail-note" style="color: #000000; background-color: #FFFFFF;"></div>
                    </div>
                    <div class="flex space-x-3 pt-2">
                        <button onclick="editItem()" class="flex-1 border border-primary text-primary py-3 rounded-xl font-medium">编辑</button>
                        <button onclick="deleteItem()" class="flex-1 border border-danger text-danger py-3 rounded-xl font-medium">删除</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let items = [];
        let categories = [

        function loadData() {
            const savedItems = localStorage.getItem('items');

            const savedRemindDays = localStorage.getItem('remindDays');
            
            if (savedItems) items = JSON.parse(savedItems);

                items = [
                    { id: 1, name: '生抽酱油', image: '', category: '食品', position: '厨房 - 吊柜 - 左侧', purchaseDate: '2024-03-15', expireDate: '2024-06-30', note: '海天品牌，味道鲜美', textColor: '#000000', bgColor: '#FFFFFF', createdAt: Date.now() },
                    { id: 2, name: '感冒药', image: '', category: '药品', position: '卧室 - 床头柜', purchaseDate: '2024-01-20', expireDate: '2024-05-20', note: '发烧时服用，一次1片', textColor: '#EF4444', bgColor: '#FEF3C7', createdAt: Date.now() },
                    { id: 3, name: '身份证', image: '', category: '证件', position: '书房 - 书桌 - 抽屉', purchaseDate: '2020-05-01', expireDate: '2030-05-01', note: '', textColor: '#000000', bgColor: '#FFFFFF', createdAt: Date.now() },
                    { id: 4, name: '螺丝刀套装', image: '', category: '工具', position: '客厅 - 储物柜', purchaseDate: '2023-10-01', expireDate: '', note: '包含多种规格', textColor: '#000000', bgColor: '#FFFFFF', createdAt: Date.now() },
                    { id: 5, name: '洗衣液', image: '', category: '日化', position: '卫生间 - 置物架', purchaseDate: '2024-04-01', expireDate: '2026-04-01', note: '', textColor: '#000000', bgColor: '#FFFFFF', createdAt: Date.now() },
                    { id: 6, name: '牛奶', image: '', category: '食品', position: '厨房 - 冰箱 - 上层', purchaseDate: '2024-05-10', expireDate: '2024-05-20', note: '每天早上喝', textColor: '#000000', bgColor: '#FFFFFF', createdAt: Date.now() }
                ];

            if (savedCategories) categories = JSON.parse(savedCategories);
            if (savedRemindDays) remindDays = parseInt(savedRemindDays);
            
            updateRemindButtons();

        function saveData() {
            localStorage.setItem('items', JSON.stringify(items));
            localStorage.setItem('categories', JSON.stringify(categories));

        }

        function updateRemindButtons() {
            document.querySelectorAll('.remind-btn').forEach(btn => {
                const days = parseInt(btn.dataset.days);
                if (days === remindDays) {
                    btn.classList.add('border-primary', 'bg-primaryLight', 'text-primary');
                    btn.classList.remove('border-border');
                } else {
                    btn.classList.remove('border-primary', 'bg-primaryLight', 'text-primary');
                    btn.classList.add('border-border');
                }
            });
        }

        function setRemindDays(days) {
            remindDays = days;
            updateRemindButtons();
            saveData();
            renderItems();
        }

        function switchPage(page) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.toggle('text-primary', btn.dataset.page === page);
                btn.classList.toggle('text-textLight', btn.dataset.page !== page);
            });
            document.querySelectorAll('[id^="page-"]').forEach(el => {
                el.style.display = el.id === `page-${page}` ? 'block' : 'none';
            });
            if (page === 'calendar') renderCalendar();
            if (page === 'space') {
                renderSpaceTree();
                document.getElementById('space-tree').parentElement.style.display = 'block';
                document.getElementById('space-items').style.display = 'none';
            }
        }

        function renderCategories() {
            const container = document.getElementById('category-list');
            let html = `<button onclick="filterByCategory('全部')" class="category-tag flex-shrink-0 px-4 py-2 rounded-full text-sm font-medium ${currentCategory === '全部' ? 'bg-primary text-white' : 'bg-white text-textLight border border-border'}">全部</button>`;
            
            categories.forEach(cat => {
                html += `<button onclick="filterByCategory('${cat.name}')" class="category-tag flex-shrink-0 px-4 py-2 rounded-full text-sm font-medium flex items-center space-x-1 ${currentCategory === cat.name ? 'text-white' : 'bg-white text-textLight border border-border'}" style="${currentCategory === cat.name ? `background: ${cat.color}` : ''}">
                    <i class="fa-solid ${cat.icon}"></i>
                    <span>${cat.name}</span>
                </button>`;
            });
            
            container.innerHTML = html;
        }

        function filterByCategory(category) {
            currentCategory = category;
            renderCategories();
            renderItems();
        }

        function handleSearch(keyword) {
            searchKeyword = keyword.toLowerCase();
            renderItems();
        }

        function handleSortChange(value) {
            sortBy = value;
            renderItems();
        }

        function getExpireStatus(expireDate) {
            if (!expireDate) return { status: 'no-expire', text: '无保质期', color: 'text-textLight' };
            
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const expire = new Date(expireDate);
            expire.setHours(0, 0, 0, 0);
            
            const diffTime = expire - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays < 0) return { status: 'expired', text: `已过期${Math.abs(diffDays)}天`, color: 'text-danger' };
            if (diffDays === 0) return { status: 'today', text: '今天过期', color: 'text-danger' };
            if (diffDays <= remindDays) return { status: 'warning', text: `${diffDays}天后过期`, color: 'text-warning' };
            return { status: 'safe', text: `${diffDays}天后过期`, color: 'text-success' };
        }

        function sortItems(list) {
            return [...list].sort((a, b) => {
                if (sortBy === 'time') return b.createdAt - a.createdAt;
                if (sortBy === 'expire') {
                    if (!a.expireDate) return 1;
                    if (!b.expireDate) return -1;
                    return new Date(a.expireDate) - new Date(b.expireDate);
                }
                return a.name.localeCompare(b.name);
            });
        }

        function getCategoryColor(categoryName) {
            const cat = categories.find(c => c.name === categoryName);
            return cat ? cat.color : '#999999';
        }

        function renderItems() {
            let filtered = items;
            
            if (currentCategory !== '全部') {
                filtered = filtered.filter(item => item.category === currentCategory);
            }
            
            if (searchKeyword) {
                filtered = filtered.filter(item => 
                    item.name.toLowerCase().includes(searchKeyword) ||
                    item.position.toLowerCase().includes(searchKeyword) ||
                    item.note.toLowerCase().includes(searchKeyword)
                );
            }
            
            filtered = sortItems(filtered);
            
            const expireList = document.getElementById('expire-list');
            const expireItems = filtered.filter(item => {
                const status = getExpireStatus(item.expireDate);
                return status.status === 'expired' || status.status === 'today' || status.status === 'warning';
            }).slice(0, 3);
            
            document.getElementById('expire-count').textContent = `${expireItems.length}件即将过期`;
            
            if (expireItems.length === 0) {
                expireList.innerHTML = `<div class="text-center py-6 text-textLight bg-white rounded-xl">
                    <i class="fa-solid fa-check-circle text-3xl mb-2 text-success"></i>
                    <p>太棒了！暂无临期物品</p>
                </div>`;
            } else {
                expireList.innerHTML = expireItems.map(item => {
                    const status = getExpireStatus(item.expireDate);
                    const catColor = getCategoryColor(item.category);
                    return `
                    <div class="bg-white rounded-xl p-3 flex items-center space-x-3 shadow-card" onclick="showItemDetail(${item.id})">
                        <div class="w-12 h-12 rounded-lg bg-bg flex items-center justify-center flex-shrink-0">
                            ${item.image ? `<img src="${item.image}" class="w-full h-full object-cover rounded-lg">` : `<i class="fa-solid fa-box text-textLight"></i>`}
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center space-x-2">
                                <h3 class="font-medium text-text truncate">${item.name}</h3>
                                <span class="text-xs px-2 py-0.5 rounded-full text-white" style="background: ${catColor}">${item.category}</span>
                            </div>
                            <p class="text-xs text-textLight truncate mt-1">${item.position}</p>
                        </div>
                        <span class="text-sm font-medium ${status.color}">${status.text}</span>
                    </div>
                    `;
                }).join('');
            }
            
            const grid = document.getElementById('item-grid');
            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-2 text-center py-12 text-textLight">
                    <i class="fa-solid fa-search text-4xl mb-3 opacity-50"></i>
                    <p>没有找到相关物品</p>
                </div>`;
            } else {
                grid.innerHTML = filtered.map(item => {
                    const status = getExpireStatus(item.expireDate);
                    const catColor = getCategoryColor(item.category);
                    return `
                    <div class="bg-white rounded-xl p-3 shadow-card" onclick="showItemDetail(${item.id})">
                        <div class="relative w-full h-24 rounded-lg bg-bg mb-3 overflow-hidden">
                            ${item.image ? `<img src="${item.image}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-box text-textLight absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-3xl"></i>`}
                            <span class="absolute top-2 right-2 text-xs px-2 py-0.5 rounded-full text-white" style="background: ${catColor}">${item.category}</span>
                        </div>
                        <h3 class="font-medium text-text text-sm mb-1 truncate">${item.name}</h3>
                        <p class="text-xs text-textLight mb-2 truncate">${item.position}</p>
                        <span class="text-xs font-medium ${status.color}">${status.text}</span>
                    </div>
                    `;
                }).join('');
            }
        }

        function showAddItem() {
            editingItemId = null;
            document.getElementById('modal-title').textContent = '添加物品';
            document.getElementById('item-name').value = '';
            document.getElementById('item-category').value = '';
            document.getElementById('item-position').value = '';
            document.getElementById('item-purchase-date').value = '';
            document.getElementById('item-expire-date').value = '';

            document.getElementById('item-text-color').value = '#000000';
            document.getElementById('item-bg-color').value = '#FFFFFF';
            removeImage();
            
            renderModalCategories();
            openModal('modal-add');

        function renderModalCategories() {
            const container = document.getElementById('modal-categories');
            container.innerHTML = categories.map(cat => `
                <button onclick="selectCategory('${cat.name}')" class="px-3 py-1.5 rounded-full text-sm border transition-all" id="modal-cat-${cat.name}" style="border-color: ${cat.color}; color: ${cat.color}">
                    ${cat.name}

        function selectCategory(name) {
            document.getElementById('item-category').value = name;
            document.querySelectorAll('#modal-categories button').forEach(btn => {
                btn.classList.remove('bg-primaryLight', 'border-primary');

        function showPositionPicker() {
            const container = document.getElementById('position-list');
            let html = '';

                const fullName = prefix ? `${prefix} - ${pos.name}` : pos.name;
                html += `<button onclick="selectPosition('${fullName}')" class="w-full text-left px-4 py-3 rounded-xl bg-bg hover:bg-primaryLight transition-colors">
                    <div class="flex items-center space-x-3">
                        <i class="fa-solid ${pos.icon || 'fa-folder'} text-textLight"></i>
                        <span class="text-text">${fullName}</span>
                    </div>

                if (pos.children && pos.children.length > 0) {
                    pos.children.forEach(child => renderPosition(child, fullName));
                }
            }
            
            positions.forEach(pos => renderPosition(pos));
            container.innerHTML = html;
            openModal('modal-position');

            document.getElementById('item-position').value = position;
            closeModal('modal-position');

        function handleImageUpload(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('item-image').src = e.target.result;
                    document.getElementById('item-image').style.display = 'block';
                    document.getElementById('upload-area').style.display = 'none';
                    document.getElementById('remove-image').style.display = 'flex';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function removeImage() {
            document.getElementById('item-image').src = '';
            document.getElementById('item-image').style.display = 'none';
            document.getElementById('upload-area').style.display = 'flex';
            document.getElementById('remove-image').style.display = 'none';
            document.getElementById('file-input').value = '';
        }

        function setColor(type) {
            const btn = event.target;
            const color = btn.dataset.color;
            if (type === 'text') {
                document.getElementById('item-text-color').value = color;
            } else {
                document.getElementById('item-bg-color').value = color;
            }
        }

        function saveItem() {
            const name = document.getElementById('item-name').value.trim();
            const category = document.getElementById('item-category').value;
            const position = document.getElementById('item-position').value;
            const purchaseDate = document.getElementById('item-purchase-date').value;
            const expireDate = document.getElementById('item-expire-date').value;
            const note = document.getElementById('item-note').value;
            const textColor = document.getElementById('item-text-color').value;
            const bgColor = document.getElementById('item-bg-color').value;
            const image = document.getElementById('item-image').src;
            
            if (!name) {
                alert('请输入物品名称');
                return;
            }
            if (!category) {
                alert('请选择分类');
                return;
            }
            if (!position) {
                alert('请选择存放位置');
                return;
            }
            
            const itemData = {
                name,
                category,
                position,
                purchaseDate,
                expireDate,
                note,
                textColor,
                bgColor,
                image: image || ''
            };
            
            if (editingItemId) {
                const index = items.findIndex(i => i.id === editingItemId);
                if (index !== -1) {
                    items[index] = { ...items[index], ...itemData };
                }
            } else {
                items.push({
                    ...itemData,
                    id: Date.now(),
                    createdAt: Date.now()
                });
            }
            
            saveData();
            closeModal('modal-add');
            renderItems();
            updateItemCount();
        }

        function showItemDetail(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;
            
            document.getElementById('detail-image').src = item.image || 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23999999" stroke-width="1.5"%3E%3Cpath d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/%3E%3C/svg%3E';
            document.getElementById('detail-name').textContent = item.name;
            document.getElementById('detail-category').textContent = item.category;
            document.getElementById('detail-position').textContent = item.position;
            document.getElementById('detail-purchase').textContent = item.purchaseDate || '未填写';
            document.getElementById('detail-expire').textContent = item.expireDate || '未填写';
            
            const noteEl = document.getElementById('detail-note');
            noteEl.textContent = item.note || '无备注';
            noteEl.style.color = item.textColor || '#000000';
            noteEl.style.backgroundColor = item.bgColor || '#FFFFFF';
            
            editingItemId = id;
            openModal('modal-item-detail');
        }

        function editItem() {
            const item = items.find(i => i.id === editingItemId);
            if (!item) return;
            
            closeModal('modal-item-detail');
            
            document.getElementById('modal-title').textContent = '编辑物品';
            document.getElementById('item-name').value = item.name;
            document.getElementById('item-category').value = item.category;
            document.getElementById('item-position').value = item.position;
            document.getElementById('item-purchase-date').value = item.purchaseDate;
            document.getElementById('item-expire-date').value = item.expireDate;
            document.getElementById('item-note').value = item.note;
            document.getElementById('item-text-color').value = item.textColor;
            document.getElementById('item-bg-color').value = item.bgColor;
            
            if (item.image) {
                document.getElementById('item-image').src = item.image;
                document.getElementById('item-image').style.display = 'block';
                document.getElementById('upload-area').style.display = 'none';
                document.getElementById('remove-image').style.display = 'flex';
            } else {
                removeImage();
            }
            
            renderModalCategories();
            if (item.category) {
                const selected = document.getElementById(`modal-cat-${item.category}`);
                if (selected) {
                    selected.classList.add('bg-primaryLight', 'border-primary');
                }
            }
            
            openModal('modal-add');
        }

        function deleteItem() {
            if (!confirm('确定要删除这件物品吗？')) return;
            
            items = items.filter(i => i.id !== editingItemId);
            saveData();
            closeModal('modal-item-detail');
            renderItems();
            updateItemCount();
        }

        function openModal(id) {
            const modal = document.getElementById(id);
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.classList.add('modal-enter-active');
                const content = modal.querySelector('[class*="modal-content"]');
                if (content) content.classList.add('modal-content-enter-active');
            }, 10);
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            modal.classList.remove('modal-enter-active');
            const content = modal.querySelector('[class*="modal-content"]');
            if (content) content.classList.remove('modal-content-enter-active');
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('calendar-title').textContent = `${year}年${month + 1}月`;
            
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDay = firstDay.getDay();
            const totalDays = lastDay.getDate();
            
            let html = '';
            
            for (let i = 0; i < startDay; i++) {
                html += '<div></div>';
            }
            
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            for (let i = 1; i <= totalDays; i++) {
                const date = new Date(year, month, i);
                const dateStr = date.toISOString().split('T')[0];
                const hasExpire = items.some(item => item.expireDate === dateStr);
                const isToday = date.getTime() === today.getTime();
                const isSelected = date.getDate() === currentDate.getDate();
                
                let classes = 'calendar-day h-12 flex items-center justify-center rounded-full text-sm cursor-pointer hover:bg-primaryLight transition-colors';
                if (isSelected) classes += ' active';
                if (isToday) classes += ' today';
                if (hasExpire) classes += ' has-expire';
                
                html += `<div class="${classes}" onclick="selectDate('${dateStr}')">${i}</div>`;
            }
            
            document.getElementById('calendar-grid').innerHTML = html;
            selectDate(currentDate.toISOString().split('T')[0]);
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        function selectDate(dateStr) {
            currentDate = new Date(dateStr);
            
            const dateItems = items.filter(item => item.expireDate === dateStr);
            
            const container = document.getElementById('calendar-items');
            if (dateItems.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-textLight">
                    <i class="fa-solid fa-calendar-check text-4xl mb-2 opacity-50"></i>
                    <p>当天暂无过期物品</p>
                </div>`;
            } else {
                container.innerHTML = dateItems.map(item => {
                    const catColor = getCategoryColor(item.category);
                    return `
                    <div class="bg-white rounded-xl p-3 flex items-center space-x-3 shadow-card" onclick="showItemDetail(${item.id})">
                        <div class="w-12 h-12 rounded-lg bg-bg flex items-center justify-center flex-shrink-0">
                            ${item.image ? `<img src="${item.image}" class="w-full h-full object-cover rounded-lg">` : `<i class="fa-solid fa-box text-textLight"></i>`}
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center space-x-2">
                                <h3 class="font-medium text-text truncate">${item.name}</h3>
                                <span class="text-xs px-2 py-0.5 rounded-full text-white" style="background: ${catColor}">${item.category}</span>
                            </div>
                            <p class="text-xs text-textLight truncate mt-1">${item.position}</p>
                        </div>
                        <span class="text-sm font-medium text-danger">今日过期</span>
                    </div>
                    `;
                }).join('');
            }
        }

        function renderSpaceTree() {
            const container = document.getElementById('space-tree');
            
            function renderNode(pos, level = 0) {
                const itemCount = items.filter(i => i.position.startsWith(pos.name) || i.position.includes(pos.name)).length;
                return `
                    <li>
                        <div class="flex items-center justify-between py-2 cursor-pointer hover:bg-bg rounded-lg px-2 transition-colors" onclick="showSpaceItems('${pos.name}')">
                            <div class="flex items-center space-x-2">
                                <i class="fa-solid ${pos.icon || 'fa-folder'} text-textLight"></i>
                                <span class="text-text">${pos.name}</span>
                            </div>
                            ${itemCount > 0 ? `<span class="text-xs text-textLight bg-bg px-2 py-1 rounded-full">${itemCount}</span>` : ''}
                        </div>
                        ${pos.children && pos.children.length > 0 ? `<ul>${pos.children.map(child => renderNode(child, level + 1)).join('')}</ul>` : ''}
                    </li>
                `;
            }
            
            container.innerHTML = `<ul>${positions.map(pos => renderNode(pos)).join('')}</ul>`;
        }

        function showSpaceItems(spaceName) {
            document.getElementById('space-tree').parentElement.style.display = 'none';
            document.getElementById('space-items').style.display = 'block';
            document.getElementById('space-title').textContent = spaceName;
            
            const spaceItems = items.filter(item => item.position.includes(spaceName));
            const container = document.querySelector('#space-items .grid');
            
            if (spaceItems.length === 0) {
                container.innerHTML = `<div class="col-span-2 text-center py-12 text-textLight">
                    <i class="fa-solid fa-box-open text-4xl mb-3 opacity-50"></i>
                    <p>该位置暂无物品</p>
                </div>`;
            } else {
                container.innerHTML = spaceItems.map(item => {
                    const status = getExpireStatus(item.expireDate);
                    const catColor = getCategoryColor(item.category);
                    return `
                    <div class="bg-white rounded-xl p-3 shadow-card" onclick="showItemDetail(${item.id})">
                        <div class="relative w-full h-24 rounded-lg bg-bg mb-3 overflow-hidden">
                            ${item.image ? `<img src="${item.image}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-box text-textLight absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-3xl"></i>`}
                            <span class="absolute top-2 right-2 text-xs px-2 py-0.5 rounded-full text-white" style="background: ${catColor}">${item.category}</span>
                        </div>
                        <h3 class="font-medium text-text text-sm mb-1 truncate">${item.name}</h3>
                        <span class="text-xs font-medium ${status.color}">${status.text}</span>
                    </div>
                    `;
                }).join('');
            }
        }

        function backToSpace() {
            document.getElementById('space-tree').parentElement.style.display = 'block';
            document.getElementById('space-items').style.display = 'none';
        }

        function showCategoryManage() {
            const container = document.getElementById('manage-categories');
            container.innerHTML = categories.map(cat => `
                <div class="bg-bg rounded-xl p-3 flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <div class="w-3 h-3 rounded-full" style="background: ${cat.color}"></div>
                        <span class="text-sm text-text">${cat.name}</span>
                    </div>
                    <button onclick="deleteCategory(${cat.id})" class="text-textLight hover:text-danger">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            `).join('');
            openModal('modal-category');
        }

        function addCategory() {
            const name = document.getElementById('new-category').value.trim();
            if (!name) {
                alert('请输入分类名称');
                return;
            }
            if (categories.some(c => c.name === name)) {
                alert('分类已存在');
                return;
            }
            
            const colors = ['#52C41A', '#FF4D4F', '#5B8FF9', '#FAAD14', '#722ED1', '#13C2C2', '#EB2F96', '#FA541C'];
            const icons = ['fa-utensils', 'fa-pill', 'fa-id-card', 'fa-wrench', 'fa-spray-can', 'fa-box', 'fa-coffee', 'fa-glass-water'];
            
            categories.push({
                id: Date.now(),
                name,
                color: colors[categories.length % colors.length],
                icon: icons[categories.length % icons.length]
            });
            
            saveData();
            document.getElementById('new-category').value = '';
            renderCategories();
            showCategoryManage();
        }

        function deleteCategory(id) {
            if (!confirm('确定要删除这个分类吗？')) return;
            categories = categories.filter(c => c.id !== id);
            saveData();
            renderCategories();
            showCategoryManage();
        }

        function updateItemCount() {
            document.getElementById('item-count').textContent = `${items.length}件`;
        }

        function exportData() {
            const dataStr = JSON.stringify(items, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `家物存备份_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            alert('备份已下载');
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (Array.isArray(imported)) {
                            items = imported;
                            saveData();
                            renderItems();
                            updateItemCount();
                            alert('导入成功');
                        } else {
                            alert('文件格式不正确');
                        }
                    } catch (error) {
                        alert('文件解析失败');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        init();
    </script>
</body>
</html>
