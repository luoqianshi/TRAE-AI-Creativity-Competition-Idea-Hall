      // 关闭颜色面板
      function closePicker() {
        if (_pickerEl && _pickerEl.parentNode) {
          _pickerEl.remove();
          _pickerEl = null;
        }
      }

      // 渲染颜色选择弹窗
      function showPicker() {
        const $btn = document.getElementById("btnCardTheme");
        const $card = document.getElementById("card");
        if (!$btn || !$card) return;

        // 如果已显示就隐藏
        if (_pickerEl && _pickerEl.parentNode) {
          closePicker();
          return;
        }

        const isTriple = isTripleUser();
        const canUseGoldFrame = hasGoldFrameLevel();
        const saved = normalizeChoice(getSaved());
        const currentIdx = currentLevelIndex();

        const availableStyles = getPracticeStyles()
          .map((s, i) => ({ ...s, idx: i }))
          .filter(s => s.idx >= MIN_THEME_IDX);
        const swatches = availableStyles.map((s) => {
          const i = s.idx;
          const isSelected = saved && saved.idx === i;
          const isLocked = !isTriple && i !== currentIdx;
          return `<div class="card-color-swatch ${isSelected ? "selected" : ""} ${isLocked ? "locked" : ""}" data-swatch-idx="${i}" title="${isLocked ? "三元后解锁" : Tasks.LEVELS[i]?.name || ""}" style="background:${s.bg}"></div>`;
        }).join("");

        _pickerEl = document.createElement("div");
        _pickerEl.className = "card-color-picker";
        _pickerEl.innerHTML = `
          <div class="ccp-title">${isTriple ? "选择任意等级颜色" : "当前等级颜色（三元后可自由选择）"}</div>
          <div class="card-color-swatch ${!saved ? "selected" : ""}" data-swatch-default="1" title="默认黑色" style="background:linear-gradient(135deg,#111827,#020617)"></div>
          ${swatches}
          <button class="card-gold-toggle ${getGoldFrame() ? "active" : ""} ${canUseGoldFrame ? "" : "locked"}" data-gold-toggle="1">
            <span>动态渐变金框</span><span>${canUseGoldFrame ? (getGoldFrame() ? "已开" : "关闭") : "探花解锁"}</span>
          </button>
        `;
        $card.appendChild(_pickerEl);

        // 点击色块
        _pickerEl.addEventListener("click", (e) => {
          const goldToggle = e.target.closest("[data-gold-toggle]");
          if (goldToggle) {
            if (!hasGoldFrameLevel()) {
              saveGoldFrame(false);
              applyGoldFrame(false);
              toast("达到 Lv.8 探花后可使用动态渐变金框");
              closePicker();
              return;
            }
            const next = !getGoldFrame();
            saveGoldFrame(next);
            applyGoldFrame(next);
            toast(next ? "动态金框已开启" : "动态金框已关闭");
            closePicker();
            return;
          }
          const swatch = e.target.closest(".card-color-swatch");
          if (swatch && swatch.dataset.swatchDefault === "1") {
            save(null);
            applyTheme(null);
            toast("已恢复默认练习框");
            closePicker();
            return;
          }
          if (!swatch || swatch.classList.contains("locked")) {
            if (swatch) toast("达到三元后可自由选择");
            return;
          }
          const idx = parseInt(swatch.dataset.swatchIdx);
          const savedNow = getSaved();
          // 如果点击已选中的，则取消主题
          if (savedNow && savedNow.idx === idx) {
            save(null);
            applyTheme(null);
            toast("练习框主题已关闭");
          } else {
            save({ idx });
            applyTheme({ idx });
            toast("练习框主题已更新");
          }
          closePicker();
        });
      }

      // 初始化：VIP 显示按钮并恢复已保存主题
      function init() {
        const $btn = document.getElementById("btnCardTheme");
        if (!$btn) return;

        if (!isVipUser()) {
          $btn.style.display = "none";
          applyTheme(null);
          applyGoldFrame(false);
          return;
        }
        $btn.style.display = "flex";
        if (!hasGoldFrameLevel() && getGoldFrame()) saveGoldFrame(false);
        applyGoldFrame(hasGoldFrameLevel() && getGoldFrame());

        // 恢复已保存主题
        const saved = normalizeChoice(getSaved());
        if (saved) {
          const idx = isTripleUser() ? saved.idx : currentLevelIndex();
          if (idx == null) {
            save(null);
            applyTheme(null);
          } else {
            const choice = { idx };
            save(choice);
            applyTheme(choice);
          }
        }

        // 点击按钮
        if (!$btn.dataset.themeBound) {
          $btn.dataset.themeBound = "1";
          $btn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (!isVipUser()) {
              toast("开通 VIP 后可使用练习框主题");
              return;
            }
            showPicker();
          });
        }

        // 点击页面其它地方关闭弹窗
        if (!document.body.dataset.cardThemeDocBound) {
          document.body.dataset.cardThemeDocBound = "1";
          document.addEventListener("click", (e) => {
            if (_pickerEl && !_pickerEl.contains(e.target) && e.target !== $btn) {
              _pickerEl.remove();
              _pickerEl = null;
            }
          });
        }
      }

      return { init, applyTheme };
    })();

    /* ========== 面板导航 ========== */
    const panels = ["panelPlan", "panelTasks", "panelMistakes", "panelBoard"];
    let _currentPanel = null;
    function showPanel(id) {
      // 隐藏所有面板
      panels.forEach(p => document.getElementById(p)?.classList.remove("show"));
      // 隐藏主练习区
      const app = document.querySelector(".app");
      const sidebar = document.getElementById("sidebar");
      const $topbarFixed = document.querySelector(".topbar-fixed");
      if (id) {
        document.getElementById(id)?.classList.add("show");
        _currentPanel = id;
        if (app) app.style.display = "none";
        // 非首页隐藏 topbar-fixed
        if ($topbarFixed) $topbarFixed.style.display = "none";
        // 渲染对应面板
        if (id === "panelPlan") renderPlanPanel();
        if (id === "panelTasks") renderTasksPanel();
        if (id === "panelMistakes") renderMistakesPanel();
        if (id === "panelBoard") renderBoardPanel();
      } else {
        _currentPanel = null;
        if (app) app.style.display = "";
        // 首页显示 topbar-fixed
        if ($topbarFixed) $topbarFixed.style.display = "";
        // 切换面板时触发 flush
        if (typeof Sync !== "undefined") Sync.scheduleFlush(5000);
      }
    }

    // 返回按钮
    document.querySelectorAll("[data-back]").forEach(btn => {
      btn.addEventListener("click", () => showPanel(null));
    });

    /* ========== 进度环 SVG ========== */
    function progressRingSVG(progress, size, label) {
      const r = (size - 8) / 2;
      const circ = 2 * Math.PI * r;
      const offset = circ * (1 - Math.max(0, Math.min(1, progress)));
      return `<div class="progress-ring" style="width:${size}px;height:${size}px">
        <svg width="${size}" height="${size}">
          <circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}" />
          <circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}"
            stroke-dasharray="${circ}" stroke-dashoffset="${offset}" />
        </svg>
        <span class="ring-text">${label || ""}</span>
      </div>`;
    }

    /* ========== 难度色块 ========== */
    function diffColor(d) {
      const colors = ["#16a34a", "#84cc16", "#f59e0b", "#f97316", "#dc2626"];
      return colors[Math.max(0, Math.min(4, Math.round(d) - 1))] || colors[0];
    }

    /* ========== 计划任务面板 ========== */
    async function renderPlanPanel() {
      const body = document.getElementById("panelPlanBody");
      if (!body) return;
      try {
      const dateEl = document.getElementById("planDate");
      if (dateEl) dateEl.innerHTML = `<span class="dot"></span>${utils.todayStr()}`;

      // 获取当前教材的状态统计
      const stats = _originalQuestions.length > 0
        ? await DailyPlanner.getStats(state.textbook, _originalQuestions)
        : { review: 0, learning: 0, new: 0, mistake: 0, total: 0 };
      const today = Tasks.getState().today || { done: 0, learnMs: 0 };
      const target = state.dailyGoal;
      const isCompleted = today.done >= target;
      const overDone = isCompleted ? today.done - target : 0;
      const reviewPct = target > 0 ? Math.min(1, today.done / target) : 0;
      const weekStats = await Tasks.getWeekStats();
      const weekDates = Object.keys(weekStats).sort();
      const maxDone = Math.max(1, ...weekDates.map(d => weekStats[d].done));
      const isVip = Vip.vipValidSync();

      // 今日进度主区域
      const progressMain = isCompleted
        ? `<div style="text-align:center;padding:20px 0">
            <div style="font-size:48px;margin-bottom:8px">🎉</div>

            <div style="font-size:14px;color:var(--muted);margin-top:4px">预估 ${target} 题 · 实际完成 ${today.done} 题${overDone > 0 ? ` · 超额 ${overDone} 题` : ""}</div>
            <div style="font-size:12px;color:var(--accent);margin-top:8px">仍可继续练习，成绩计入明日复习队列</div>

        : `<div style="display:flex;align-items:center;gap:20px;justify-content:center;padding:16px 0">
            <div style="text-align:center">
              ${progressRingSVG(reviewPct, 90, `${today.done}<span style="font-size:14px">/${target}</span>`)}
            </div>
            <div>
              <div style="font-size:18px;font-weight:700">今日学习进度</div>
              <div style="font-size:13px;color:var(--muted);margin-top:4px">预估 ${target} 题 · 已完成 ${today.done} 题</div>
              <div style="font-size:13px;color:var(--muted)">还差 ${Math.max(0, target - today.done)} 题达标</div>
            </div>
          </div>`;

      body.innerHTML = `
        ${progressMain}

        <div class="section-title"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg> 今日队列组成</div>
        <div class="stat-grid">
          <div class="stat-card"><div class="stat-val">${stats.review}</div><div class="stat-label">待复习</div></div>
          <div class="stat-card"><div class="stat-val">${stats.new}</div><div class="stat-label">新题</div></div>
          <div class="stat-card"><div class="stat-val">${stats.learning}</div><div class="stat-label">学习中</div></div>
          <div class="stat-card"><div class="stat-val">${stats.mistake}</div><div class="stat-label">错题复习</div></div>
        </div>

        <div class="section-title"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg> 近 7 天</div>
        <div class="bar-chart">
          ${weekDates.map(d => {
            const s = weekStats[d];
            const h = (s.done / maxDone) * 100;
            const label = d.slice(5);
            return `<div class="bar-col"><div class="bar-value">${s.done}题</div><div class="bar done" style="height:${h}%"></div><div class="bar-label">${label}</div></div>`;
          }).join("")}
        </div>

        ${isVip ? `<div class="section-title"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg> 30 天热力图</div><div class="heatmap" id="heatmapVIP"></div>` :
        `<div style="text-align:center;padding:16px;color:var(--muted);font-size:13px">开通 VIP 解锁 30 天热力图</div>`}

        <div class="section-title"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg> 复习提醒</div>
        <div class="task-item" style="cursor:pointer" id="planNotifyRow">
          <div class="task-info"><div class="task-name">每日提醒</div>
            <div class="task-progress-text" id="notifyStatus">${("Notification" in window) ? (Notification.permission === "granted" ? "已开启" : "点击开启通知") : "不支持通知"}</div>
          </div>
        </div>

        <button class="btn primary" style="width:100%;margin-top:16px" id="btnStartPractice">${isCompleted ? "继续练习 →" : "开始今日练习 →"}</button>

      const notifyRow = document.getElementById("planNotifyRow");
      if (notifyRow) notifyRow.addEventListener("click", async () => {

      const startBtn = document.getElementById("btnStartPractice");

          <div style="font-size:14px;margin-bottom:8px">数据加载失败</div>

          <button class="btn ghost" style="margin-top:12px" onclick="renderPlanPanel()">重试</button>

    /* ========== 错题笔记面板 ========== */

            const stateLabel = m.state === FSRS.State.New ? "新" : m.state === FSRS.State.Review ? (isDue ? "待复习" : "已安排") : "学习中";
            return `
            <div class="task-item" style="align-items:flex-start;padding:10px 12px">
              <div style="flex:1;min-width:0">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">

                  <span style="font-size:11px;padding:1px 8px;border-radius:999px;background:rgba(220,38,38,0.08);color:#b91c1c;border:1px solid rgba(220,38,38,0.15)">错 ${m.errorCount || 1} 次</span>
                  <span style="font-size:11px;padding:1px 8px;border-radius:999px;background:rgba(107,114,128,0.08);color:var(--muted);border:1px solid var(--rule)">${stateLabel}</span>

                <div style="font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.sentenceZh || ""}</div>
                <div style="font-size:11px;color:var(--rule);margin-top:2px">下次复习: ${dueDate}</div>
              </div>
              <button class="btn ghost" style="padding:4px 10px;font-size:12px;white-space:nowrap;flex-shrink:0" data-mword="${m.word}" data-mtb="${m.textbook}">去练习</button>
            </div>`;
          }).join("")}
        </div>
      `;

      // 绑定"去练习"按钮
      body.querySelectorAll("[data-mword]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const word = btn.dataset.mword;
          const tb = btn.dataset.mtb;
          // 找到包含该单词的句子
          const bank = QUESTION_BANK[tb] || [];
          const q = bank.find(item => item.words.includes(word));
          if (q) {
            // 切换教材并定位到该句子
            if (state.textbook !== tb) {
              await selectTextbook(tb);
            }
            const idx = QUESTIONS.findIndex(item => item.zh === q.zh);
            if (idx >= 0) {
              state.idx = idx;
              saveProgress();
              showPanel(null);
              renderQuestion();
            } else {
              toast("该句子不在今日计划中，已自动加入");
              QUESTIONS.push(q);
              state.idx = QUESTIONS.length - 1;
              saveProgress();
              showPanel(null);
              renderQuestion();
            }
          } else {
            toast("未找到包含该单词的句子");
          }
        });
      });
    }

      { tag: "AMETHYST",   bg: "linear-gradient(135deg,#f3e5f5 0%,#7b1fa2 100%)", border: "#6a1b9a", text: "#fff",    accent: "#ab47bc", icon: "👁️" },
      { tag: "DRAGON",     bg: "linear-gradient(135deg,#1a1a2e 0%,#16213e 40%,#e2b714 80%,#ffd700 100%)", border: "#ffd700", text: "#ffd700", accent: "#ff8c00", icon: "🐉" },
      { tag: "TRIPLE",     bg: "linear-gradient(135deg,#0f172a 0%,#4c1d95 35%,#7c2d12 68%,#facc15 100%)", border: "#facc15", text: "#fff7cc", accent: "#f97316", icon: "👑" },
    ];

    let _carouselLv = null; // 当前查看的等级（null = 自动跟随当前等级）

    function buildLevelCarousel() {
      const li = Tasks.getLevelInfo();
      const LEVELS = Tasks.LEVELS;
      const currentLv = li.lv;
      if (_carouselLv === null) _carouselLv = currentLv;
      const viewLv = _carouselLv;

      const isDark = document.documentElement.getAttribute("data-theme") === "dark";
      const labelBg = isDark ? "var(--bg2)" : "var(--ink)";
      const labelFg = isDark ? "var(--ink)" : "#fff";

      function renderCard(lvl, i) {
        const lv = i + 1;
        const s = LEVEL_CARD_STYLES[i] || LEVEL_CARD_STYLES[0];
        const isCurrent = lv === currentLv;
        const isPast = lv < currentLv;
        const isLocked = lv > currentLv;
        const progress = isCurrent ? Math.round(li.progress * 100) : (isPast ? 100 : 0);
        return `
          <div class="level-slide-card ${isCurrent?'lv-current':isPast?'lv-past':'lv-locked'}" data-lv="${lv}" style="
            flex:0 0 260px;width:260px;height:190px;
            scroll-snap-align:center;scroll-snap-stop:always;
            border:2.5px solid ${s.border};
            background:${s.bg};
            color:${s.text};
            border-radius:18px;padding:20px;
            position:relative;overflow:hidden;cursor:grab;
            ${isCurrent ? 'box-shadow:0 10px 34px rgba(0,0,0,.22);' : isLocked ? 'opacity:.62;filter:grayscale(.35);' : 'box-shadow:0 5px 18px rgba(0,0,0,.10);'}
          ">
            <div style="position:absolute;inset:auto -25px -35px auto;width:105px;height:105px;border-radius:50%;background:rgba(255,255,255,.16);filter:blur(1px)"></div>
            <div style="position:absolute;top:12px;right:14px;font-size:36px;line-height:1;opacity:.22">${s.icon}</div>
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
              <span style="font-size:10px;letter-spacing:2px;font-weight:800;text-transform:uppercase;opacity:.68;background:rgba(128,128,128,.16);padding:2px 8px;border-radius:4px">${s.tag}</span>
              <span style="font-size:12px;opacity:.58">Lv.${lv}</span>
            </div>
            <div style="font-size:28px;font-weight:800;letter-spacing:1px;line-height:1.2">${lvl.name}</div>
            <div style="font-size:12px;opacity:.74;margin-top:6px">${lvl.points > 0 ? lvl.points + ' 积分' : '起点'} · 解锁${lvl.unlock}</div>
            <div style="width:100%;height:5px;background:rgba(128,128,128,.22);border-radius:3px;margin-top:14px;overflow:hidden">
              <div style="width:${progress}%;height:100%;background:${s.text};border-radius:3px;transition:width .5s"></div>
            </div>
            <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:10px;opacity:.64">
              <span>${isCurrent ? li.points+' / '+li.nextBase : isPast ? '已达成' : '未解锁'}</span>
              <span>${progress}%</span>
            </div>
            ${isCurrent ? `<div style="position:absolute;top:10px;left:12px;font-size:9px;padding:2px 8px;border-radius:4px;background:${labelBg};color:${labelFg};font-weight:700">当前等级</div>` : ''}
          </div>`;
      }

      return `
        <div style="margin-bottom:16px;user-select:none" id="levelCarouselWrap">
          <div class="level-carousel-scroller" id="levelCarouselScroller" style="
            display:flex;gap:14px;align-items:center;
            overflow-x:auto;overflow-y:hidden;
            scroll-snap-type:x mandatory;scroll-behavior:smooth;
            -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
            scrollbar-width:none;perspective:900px;
            padding:12px max(16px,calc(50% - 130px)) 18px;
            cursor:grab;touch-action:pan-x pan-y;
          ">
            ${LEVELS.map((lvl, i) => renderCard(lvl, i)).join("")}
          </div>
          <div style="display:flex;justify-content:center;gap:4px;margin-top:10px">
            ${LEVELS.map((_, i) => `<div class="level-dot ${(i+1)===viewLv?'active':''}" style="width:${(i+1)===viewLv?'18px':'6px'};height:6px;border-radius:3px;background:${(i+1)===viewLv?(LEVEL_CARD_STYLES[i]||LEVEL_CARD_STYLES[0]).border:'var(--rule)'};opacity:${(i+1)===viewLv?'1':'.65'};transition:all .2s;cursor:pointer" data-dot="${i+1}"></div>`).join("")}
          </div>
          <div style="text-align:center;font-size:11px;color:var(--muted);margin-top:6px">横向滑动查看全部等级</div>
        </div>`;
    }

    // 等级卡片轨道：原生惯性滚动 + scroll-snap + 中心卡片动效
    document.addEventListener("click", (e) => {
      const wrap = e.target.closest("#levelCarouselWrap");
      if (!wrap) return;
      const dot = e.target.dataset?.dot;
      if (dot) {
        _carouselLv = parseInt(dot);
        const card = document.querySelector(`.level-slide-card[data-lv="${_carouselLv}"]`);
        if (card) card.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
        updateLevelDots();
      }
    });

    let _levelFxRaf = 0;
    let _levelDrag = null;
    function setupLevelCarousel() {
      const scroller = document.getElementById("levelCarouselScroller");
      if (!scroller) return;
      const target = Math.max(1, Math.min(Tasks.LEVELS.length, _carouselLv || Tasks.getLevel()));
      requestAnimationFrame(() => {
        const card = scroller.querySelector(`.level-slide-card[data-lv="${target}"]`);
        if (card) card.scrollIntoView({ behavior: "auto", inline: "center", block: "nearest" });
        updateLevelCardEffects();
      });
      scroller.addEventListener("scroll", () => {
        if (_levelFxRaf) return;
        _levelFxRaf = requestAnimationFrame(() => {
          _levelFxRaf = 0;
          updateLevelCardEffects();
        });
      }, { passive: true });

      scroller.addEventListener("pointerdown", (e) => {
        if (e.pointerType === "touch") return; // 手机使用浏览器原生惯性
        _levelDrag = { x: e.clientX, left: scroller.scrollLeft, lastX: e.clientX, lastT: performance.now(), vx: 0 };
        scroller.style.cursor = "grabbing";
        try { scroller.setPointerCapture(e.pointerId); } catch (err) {}
      });
      scroller.addEventListener("pointermove", (e) => {
        if (!_levelDrag || e.pointerType === "touch") return;
        e.preventDefault();
        const now = performance.now();
        const dx = e.clientX - _levelDrag.x;
        scroller.scrollLeft = _levelDrag.left - dx;
        const dt = Math.max(16, now - _levelDrag.lastT);
        _levelDrag.vx = (e.clientX - _levelDrag.lastX) / dt;
        _levelDrag.lastX = e.clientX;
        _levelDrag.lastT = now;
      });
      scroller.addEventListener("pointerup", () => finishLevelDrag(scroller));
      scroller.addEventListener("pointercancel", () => finishLevelDrag(scroller));
    }

    function finishLevelDrag(scroller) {
      if (!_levelDrag) return;
      const vx = _levelDrag.vx || 0;
      _levelDrag = null;
      scroller.style.cursor = "grab";
      if (Math.abs(vx) > 0.08) {
        scroller.scrollBy({ left: -vx * 420, behavior: "smooth" });
      }
      setTimeout(snapNearestLevelCard, 180);
    }

    function updateLevelCardEffects() {
      const scroller = document.getElementById("levelCarouselScroller");
      if (!scroller) return;
      const center = scroller.scrollLeft + scroller.clientWidth / 2;
      let nearest = null;
      let nearestDist = Infinity;
      scroller.querySelectorAll(".level-slide-card").forEach(card => {
        const cardCenter = card.offsetLeft + card.offsetWidth / 2;
        const dist = (cardCenter - center) / card.offsetWidth;
        const abs = Math.min(1.45, Math.abs(dist));
        const scale = 1 - Math.min(0.18, abs * 0.12);
        const rotate = Math.max(-12, Math.min(12, -dist * 7));
        const y = abs * 10;
        card.style.transform = `translateY(${y}px) scale(${scale}) rotateY(${rotate}deg)`;
        card.style.opacity = String(1 - Math.min(0.34, abs * 0.18));
        card.style.zIndex = String(100 - Math.round(abs * 20));
        if (Math.abs(cardCenter - center) < nearestDist) {
          nearestDist = Math.abs(cardCenter - center);
          nearest = card;
        }
      });
      if (nearest) {
        _carouselLv = parseInt(nearest.dataset.lv, 10);
        updateLevelDots();
      }
    }

    function updateLevelDots() {
      document.querySelectorAll("#levelCarouselWrap .level-dot").forEach(dot => {
        const active = parseInt(dot.dataset.dot, 10) === _carouselLv;
        const s = LEVEL_CARD_STYLES[_carouselLv - 1] || LEVEL_CARD_STYLES[0];
        dot.classList.toggle("active", active);
        dot.style.width = active ? "18px" : "6px";
        dot.style.opacity = active ? "1" : ".65";
        dot.style.background = active ? s.border : "var(--rule)";
      });
    }

    function snapNearestLevelCard() {
      const card = document.querySelector(`.level-slide-card[data-lv="${_carouselLv}"]`);
      if (card) card.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
    }

    function refreshCarousel() {
      const el = document.getElementById("levelCarouselWrap");
      if (el) {
        el.outerHTML = buildLevelCarousel();
        setupLevelCarousel();
      }
    }

    /* ========== 积分任务面板 ========== */
    function renderTasksPanel() {
      const body = document.getElementById("panelTasksBody");
      if (!body) return;
      try {
      const li = Tasks.getLevelInfo();
      const ts = Tasks.getState();
      const today = ts.today || { done: 0, streakCorrect: 0, learnMs: 0, signedIn: false, tasks: {} };
      const isVip = Vip.vipValidSync();
      const dg = state.dailyGoal || 30;

      // 辅助：渲染任务项
      function renderTaskItem(name, progress, target, done, reward) {
        const pct = target > 0 ? Math.min(1, progress / target) : (done ? 1 : 0);
        const rw = Math.round(reward * (isVip ? 1.5 : 1));
        return `<div class="task-item ${done ? "done" : ""}">
          <div class="task-check">${done ? "✓" : ""}</div>
          <div class="task-info"><div class="task-name">${name}</div>
            <div class="task-progress-text">${progress} / ${target}</div>
            <div class="task-progress-bar"><i style="width:${pct*100}%"></i></div>
          </div>
          <div class="task-reward ${isVip ? "vip" : ""}">+${rw}</div>
        </div>`;
      }

      // 日任务
      const dailyHTML = Tasks.DAILY_TASKS.map(t => {
        const st = today.tasks?.[t.id] || { progress: 0, done: false };
        const target = t.dynamicTarget ? dg : t.target;
        return renderTaskItem(t.name, st.progress, target, st.done, t.reward);
      }).join("");

      // 周任务
      const week = ts.week || { signedDays: 0, dailyDoneDays: 0, tasks: {} };
      const weeklyHTML = Tasks.WEEKLY_TASKS.map(t => {
        const st = week.tasks?.[t.id] || { progress: 0, done: false };
        const progress = t.kind === "weekSign" ? week.signedDays : week.dailyDoneDays;
        return renderTaskItem(t.name, progress, t.target, st.done, t.reward);
      }).join("");

      // 月任务
      const month = ts.month || { signedDays: 0, dailyDoneDays: 0, tasks: {} };
      const monthlyHTML = Tasks.MONTHLY_TASKS.map(t => {
        const st = month.tasks?.[t.id] || { progress: 0, done: false };
        const progress = t.kind === "monthSign" ? month.signedDays : month.dailyDoneDays;
        return renderTaskItem(t.name, progress, t.target, st.done, t.reward);
      }).join("");

      // 一次性任务
      const once = ts.once || {};
      const vipDone = isVip || once.beVip;
      const nickDone = (state.user && state.user.name) || once.setNick;
      const onceHTML = Tasks.ONCE_TASKS.map(t => {
        const done = t.id === "beVip" ? vipDone : nickDone;
        return renderTaskItem(t.name, done ? 1 : 0, 1, done, t.reward);
      }).join("");

      // 合并所有任务用于筛选
      const allTasks = [];
      Tasks.DAILY_TASKS.forEach(t => {
        const st = today.tasks?.[t.id] || { progress: 0, done: false };
        const target = t.dynamicTarget ? dg : t.target;
        allTasks.push({ html: renderTaskItem(t.name, st.progress, target, st.done, t.reward), done: st.done });
      });
      Tasks.WEEKLY_TASKS.forEach(t => {
        const st = week.tasks?.[t.id] || { progress: 0, done: false };
        const progress = t.kind === "weekSign" ? week.signedDays : week.dailyDoneDays;
        allTasks.push({ html: renderTaskItem(t.name, progress, t.target, st.done, t.reward), done: st.done });
      });
      Tasks.MONTHLY_TASKS.forEach(t => {
        const st = month.tasks?.[t.id] || { progress: 0, done: false };
        const progress = t.kind === "monthSign" ? month.signedDays : month.dailyDoneDays;
        allTasks.push({ html: renderTaskItem(t.name, progress, t.target, st.done, t.reward), done: st.done });
      });
      Tasks.ONCE_TASKS.forEach(t => {
        const done = t.id === "beVip" ? vipDone : nickDone;
        allTasks.push({ html: renderTaskItem(t.name, done ? 1 : 0, 1, done, t.reward), done });
      });

      body.innerHTML = `
        ${buildLevelCarousel()}
        <div class="section-title" style="margin-top:0"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> 签到</div>
        <button class="sign-btn ${today.signedIn ? "signed" : ""}" id="btnSignIn" ${today.signedIn ? "disabled" : ""}>
          ${today.signedIn ? `今日已签到 · 连续 ${ts.streak} 天` : "签到 +" + Math.round(30 * (isVip ? 1.5 : 1)) + " 积分"}
        </button>
        <div class="sub-tabs">
          <div class="sub-tab active" data-subtab="tasks">任务</div>
          <div class="sub-tab" data-subtab="stats">成就</div>
          <div class="sub-tab" data-subtab="rank">排行榜</div>
        </div>
        <div id="subtabContent">
          <div class="task-filter-bar" id="taskFilterBar" style="display:flex;gap:0;margin-bottom:12px;border-radius:10px;overflow:hidden;border:1px solid var(--rule)">
            <div class="task-filter active" data-filter="all" style="flex:1;text-align:center;padding:6px 0;font-size:13px;cursor:pointer;background:var(--accent);color:#fff;font-weight:600">全部</div>
            <div class="task-filter" data-filter="undone" style="flex:1;text-align:center;padding:6px 0;font-size:13px;cursor:pointer;background:var(--bg2);color:var(--muted)">未完成</div>
            <div class="task-filter" data-filter="done" style="flex:1;text-align:center;padding:6px 0;font-size:13px;cursor:pointer;background:var(--bg2);color:var(--muted)">已完成</div>
          </div>
          <div class="task-list" id="taskList">${allTasks.map(t => t.html).join("")}</div>
        </div>
      `;
      setupLevelCarousel();

      // 筛选事件
      body.querySelectorAll(".task-filter").forEach(f => {
        f.addEventListener("click", () => {
          body.querySelectorAll(".task-filter").forEach(x => {
            x.classList.remove("active");
            x.style.background = "var(--bg2)";
            x.style.color = "var(--muted)";
          });
          f.classList.add("active");
          f.style.background = "var(--accent)";
          f.style.color = "#fff";
          const filter = f.dataset.filter;
          const list = document.getElementById("taskList");
          if (!list) return;
          let filtered = allTasks;
          if (filter === "done") filtered = allTasks.filter(t => t.done);
          else if (filter === "undone") filtered = allTasks.filter(t => !t.done);
          list.innerHTML = filtered.map(t => t.html).join("");
        });
      });

      // 子tab切换
      body.querySelectorAll(".sub-tab").forEach(tab => {
        tab.addEventListener("click", () => {
          body.querySelectorAll(".sub-tab").forEach(t => t.classList.remove("active"));
          tab.classList.add("active");
          renderTasksSubtab(tab.dataset.subtab);
        });
      });
      // 签到
      const signBtn = document.getElementById("btnSignIn");
      if (signBtn) signBtn.addEventListener("click", () => {
        Tasks.signIn();
        renderTasksPanel();
      });
      } catch (err) {
        console.error("renderTasksPanel error:", err);
        body.innerHTML = `<div style="text-align:center;color:var(--muted);padding:40px 20px">
          <div style="font-size:14px;margin-bottom:8px">数据加载失败</div>
          <div style="font-size:12px;color:var(--rule)">${String(err).slice(0,100)}</div>
        </div>`;
      }
    }

    function LEVELS_NEXT(lv) {
      const next = Tasks.LEVELS[lv];
      return next ? next.unlock : "—";
    }

    const ACHIEVEMENT_CATALOG = [
      { id: "streak3", icon: "🥉", name: "初来咋到", desc: "连续签到 3 天" },
      { id: "streak7", icon: "🥈", name: "签到达人", desc: "连续签到 7 天" },
      { id: "streak30", icon: "🥇", name: "日常签到", desc: "连续签到 30 天" },
      { id: "streak100", icon: "🏆", name: "成为日常", desc: "连续签到 100 天" },
      { id: "ans100", icon: "🥉", name: "启动资金", desc: "累计答题 100 题" },
      { id: "ans500", icon: "🥈", name: "渐入佳境", desc: "累计答题 500 题" },
      { id: "ans1000", icon: "🥇", name: "何患无词", desc: "累计答题 1000 题" },
      { id: "ans5000", icon: "🏆", name: "登峰造极", desc: "累计答题 5000 题" },
      { id: "lv2", icon: "🥉", name: "进阶学者", desc: "等级达到 Lv.2" },
      { id: "lv3", icon: "🥈", name: "英语达人", desc: "等级达到 Lv.3" },
      { id: "lv5", icon: "🥇", name: "范进中举", desc: "等级达到 Lv.5" },
      { id: "lv10", icon: "🐉", name: "本科状元", desc: "等级达到 Lv.10" },
      { id: "lv11", icon: "👑", name: "连中三元", desc: "等级达到 Lv.11" },
      { id: "correct10", icon: "🥉", name: "一气呵成", desc: "连续答对 10 题" },
      { id: "correct50", icon: "🥈", name: "行云流水", desc: "连续答对 50 题" },
    ];

    function buildAchievements({ ts, li, totalAnswered, maxStreakCorrect }) {
      const checks = {
        streak3: () => ts.streak >= 3,
        streak7: () => ts.streak >= 7,
        streak30: () => ts.streak >= 30,
        streak100: () => ts.streak >= 100,
        ans100: () => totalAnswered >= 100,
        ans500: () => totalAnswered >= 500,
        ans1000: () => totalAnswered >= 1000,
        ans5000: () => totalAnswered >= 5000,
        lv2: () => li.lv >= 2,
        lv3: () => li.lv >= 3,
        lv5: () => li.lv >= 5,
        lv10: () => li.lv >= 10,
        lv11: () => li.lv >= 11,
        correct10: () => maxStreakCorrect >= 10,
        correct50: () => maxStreakCorrect >= 50,
      };
      return ACHIEVEMENT_CATALOG.map(a => ({ ...a, check: checks[a.id] || (() => false) }));
    }

    function getAchievementKey(user = state.user) {
      return "en_achievements_" + (user?.phone || "guest");
    }

    function getSavedAchievementIds(user = state.user) {
      try {
        return JSON.parse(localStorage.getItem(getAchievementKey(user)) || "[]");
      } catch (e) {
        return [];
      }
    }

    function getAchievementById(id) {
      return ACHIEVEMENT_CATALOG.find(a => a.id === id);
    }

    function getFeaturedAchievementIds(user = state.user) {
      const savedSet = new Set(getSavedAchievementIds(user));
      const raw = Array.isArray(user?.featuredAchievements) ? user.featuredAchievements : [];
      return raw.filter(id => savedSet.has(id)).slice(0, 4);
    }

    function renderFeaturedAchievements(user = state.user) {
      const ids = getFeaturedAchievementIds(user);
      if (ids.length === 0) return `<div class="profile-achievement-empty">还没有选择展示成就</div>`;
      return `<div class="profile-achievement-list">${ids.map(id => {
        const a = getAchievementById(id);
        if (!a) return "";
        return `<span class="profile-achievement-chip"><span class="icon">${a.icon}</span><span class="name">${a.name}</span></span>`;
      }).join("")}</div>`;
    }

    async function renderTasksSubtab(which) {
      const el = document.getElementById("subtabContent");
      if (!el) return;
      if (which === "tasks") {
        // 恢复默认的任务 tab 内容（重新调用 renderTasksPanel）
        renderTasksPanel();
        return;
      }
      if (which === "stats") {
        const ts = Tasks.getState();
        const li = Tasks.getLevelInfo();

        // 成就数据
        const allStats = await Storage.getAll("stats");
        const totalAnswered = allStats.reduce((s, st) => s + (st.done || 0), 0);
        const maxStreakCorrect = allStats.reduce((m, st) => Math.max(m, st.streakCorrect || 0), ts.today?.streakCorrect || 0);

        const achievements = buildAchievements({ ts, li, totalAnswered, maxStreakCorrect });
        const achievementKey = getAchievementKey();
        let savedAchievementIds = [];
        try {
          savedAchievementIds = JSON.parse(localStorage.getItem(achievementKey) || "[]");
        } catch (e) {
          savedAchievementIds = [];
        }
        const savedSet = new Set(savedAchievementIds);
        let newlyUnlockedCount = 0;
        achievements.forEach(a => {
          if (a.check() && !savedSet.has(a.id)) {
            savedSet.add(a.id);
            newlyUnlockedCount++;
          }
        });
        try {
          localStorage.setItem(achievementKey, JSON.stringify([...savedSet]));
        } catch (e) {}
        if (newlyUnlockedCount > 0) {
          const reward = newlyUnlockedCount * 25;
          Tasks.addPoints(reward);
          if (typeof showConfetti === "function") showConfetti();
          toast(`达成 ${newlyUnlockedCount} 个新成就，+${reward} 积分`);
        }
        const featuredIds = getFeaturedAchievementIds();

    async function renderHeatmap() {
      const el = document.getElementById("heatmapVIP");
      if (!el) return;
      const stats = await Storage.getAll("stats");
      const map = {};
      stats.forEach(s => { map[s.date] = s.done; });
      let html = "";
      for (let i = 29; i >= 0; i--) {
        const d = utils.todayStr(Date.now() - i * 864e5);
        const done = map[d] || 0;
        let cls = "";
        if (done >= 20) cls = "l4";
        else if (done >= 10) cls = "l3";
        else if (done >= 5) cls = "l2";
        else if (done >= 1) cls = "l1";
        html += `<div class="heatmap-cell ${cls}" title="${d}: ${done}题"></div>`;
      }
      el.innerHTML = html;
    }

    /* ========== Trello 看板面板 ========== */
    async function renderBoardPanel() {
      const body = document.getElementById("panelBoardBody");
      if (!body) return;
      try {
      const lv = Tasks.getLevel();
      const tb = state.textbook;
      const now = Date.now();

      // 构建当前教材的看板数据：从原始题目 + 缓存卡片状态
      const buckets = { new: [], learning: [], review: [], mastered: [] };
      const questions = _originalQuestions.length > 0 ? _originalQuestions : (QUESTION_BANK[tb] || []);

      for (const q of questions) {
        const qid = CardStore.makeQid(tb, q.zh);
        let card = Storage.Cache.getCard(qid);
        if (!card) {
          // 从 IndexedDB 读取
          card = await Storage.get("cards", qid);
          if (card) Storage.Cache.cards.set(qid, card);
        }
        if (!card) {
          // 没有记录 → 待学习
          buckets.new.push({ qid, zh: q.zh, state: FSRS.State.New, reps: 0, difficulty: 0 });
          continue;
        }
        // 有记录 → 按状态分桶
        if (card.state === FSRS.State.New) {
          // New 状态统一归入待学习（无论 reps 多少）
          buckets.new.push(card);
        } else if (card.state === FSRS.State.Learning || card.state === FSRS.State.Relearning) {
          buckets.learning.push(card);
        } else if (card.state === FSRS.State.Review) {
          // 已掌握：高稳定性、多次复习、无失误
          if (card.stability >= 30 && card.reps >= 3 && (card.lapses || 0) === 0) {
            buckets.mastered.push(card);
          }
          // 学习中：刚毕业的卡片（复习次数少或稳定性不足），放到学习中培养
          else if (card.reps < 3 || card.stability < 14) {
            buckets.learning.push(card);
          }
          // 待复习：已经比较熟练，等待到期复习
          else {
            buckets.review.push(card);
          }
        }
      }

      const cols = [
        { id: "new", name: "待学习", items: buckets.new, locked: false },
        { id: "learning", name: "学习中", items: buckets.learning, locked: false },
        { id: "review", name: "待复习", items: buckets.review, locked: false },
        { id: "mastered", name: "已掌握", items: buckets.mastered, locked: lv < 3 },
      ];
      body.innerHTML = `
        <div class="board-wrap">
          ${cols.map(col => `
            <div class="board-col ${col.locked ? "locked" : ""}" data-col="${col.id}">
              <div class="board-col-head">
                <span>${col.name}${col.locked ? ' <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>' : ""}</span>
                <span class="board-col-count">${col.items.length}</span>
              </div>
              <div class="board-col-body" data-col="${col.id}">
                ${col.locked ? `<div style="text-align:center;color:var(--muted);padding:20px;font-size:12px">Lv.3 学者解锁</div>` :
                  col.items.map(c => `
                    <div class="board-card" draggable="true" data-qid="${c.qid}" data-state="${c.state}">
                      <div class="board-card-zh">${c.zh || c.summary || "(无标题)"}</div>
                      <div class="board-card-meta">
                        <span class="board-card-diff" style="background:${diffColor(c.difficulty)}"></span>
                        <span>D${(c.difficulty||0).toFixed(1)}</span>
                        <span>reps ${c.reps||0}</span>
                        ${c.due && c.due > now ? `<span class="board-card-due">${utils.daysBetween(now, c.due)}天后</span>` : ""}
                      </div>
                    </div>
                  `).join("")}
              </div>
            </div>
          `).join("")}
        </div>
      `;
      // 拖拽
      setupBoardDragDrop();
      } catch (err) {
        console.error("renderBoardPanel error:", err);
        body.innerHTML = `<div style="text-align:center;color:var(--muted);padding:40px 20px">
          <div style="font-size:14px;margin-bottom:8px">数据加载失败</div>
          <div style="font-size:12px;color:var(--rule)">${String(err).slice(0,100)}</div>
        </div>`;
      }
    }

    function setupBoardDragDrop() {
      let dragQid = null, dragEl = null;
      document.querySelectorAll(".board-card").forEach(card => {
        card.addEventListener("dragstart", (e) => {
          dragQid = card.dataset.qid;
          dragEl = card;
          card.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
        });
        card.addEventListener("dragend", () => {
          card.classList.remove("dragging");
          document.querySelectorAll(".drag-over").forEach(el => el.classList.remove("drag-over"));
        });
      });
      document.querySelectorAll(".board-col-body").forEach(col => {
        col.addEventListener("dragover", (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          col.querySelectorAll(".board-card").forEach(c => c.classList.remove("drag-over"));
        });
        col.addEventListener("drop", async (e) => {
          e.preventDefault();
          if (!dragQid) return;
          const targetCol = col.dataset.col;
          const card = Storage.Cache.getCard(dragQid);
          if (!card) return;
          // 拖到"已掌握"触发 Easy 评级
          if (targetCol === "mastered") {
            const { card: newCard, log } = FSRS.next(card, Date.now(), FSRS.Rating.Easy);
            newCard.step = newCard.step || 0;
            await CardStore.upsert(newCard);
            await CardStore.addLog({ ...log, qid: dragQid, uid: state.user?.phone || "guest", elapsedMs: 0, correct: true, typoCount: 0 });
            toast("已标记为掌握");
          } else if (targetCol === "learning" && card.state === FSRS.State.New) {
            card.state = FSRS.State.Learning;
            card.step = 0;
            card.updated_at = Date.now();
            await CardStore.upsert(card);
          } else if (targetCol === "new") {
            // 拖回待学习：重置为新卡
            const empty = FSRS.createEmptyCard();
            Object.assign(card, empty, { qid: card.qid, uid: card.uid, textbook: card.textbook, zh: card.zh, unit: card.unit, lesson: card.lesson });
            await CardStore.upsert(card);
          }
          dragQid = null;
          dragEl = null;
          renderBoardPanel();
        });
      });
    }

    function generateAvatarSVG(name) {

      const color = colors[seed % colors.length];
      const letter = (name || "?")[0].toUpperCase();
      return `<svg viewBox="0 0 56 56" width="56" height="56" style="display:block">
        <circle cx="28" cy="28" r="28" fill="${color}"/>
        <text x="28" y="37" text-anchor="middle" fill="#fff" font-size="24" font-family="system-ui" font-weight="700">${letter}</text>

    }

    function renderUserAvatar(user) {

    function resizeAvatarImage(file, size = 160) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("读取图片失败"));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error("图片加载失败"));
          img.onload = () => {
            const canvas = document.createElement("canvas");
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext("2d");
            const side = Math.min(img.naturalWidth || img.width, img.naturalHeight || img.height);
            const sx = ((img.naturalWidth || img.width) - side) / 2;
            const sy = ((img.naturalHeight || img.height) - side) / 2;
            ctx.clearRect(0, 0, size, size);
            ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
            resolve(canvas.toDataURL("image/jpeg", 0.82));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function updateOnlineStatus() {

    /* ========== Sync 同步队列模块 ========== */
    const Sync = (function () {
      const FLUSH_BATCH = 20;      // 每批最多 20 条
      const FLUSH_INTERVAL = 30000; // 30 秒定时检查
      const DAILY_STAT_DEBOUNCE = 5000; // daily_stats 5 秒防抖
      let _flushing = false;
      let _flushTimer = null;
      let _dailyStatTimer = null;
      let _dailyStatDirty = false;
      let _pendingCount = 0;

      // 将操作入队到 IndexedDB sync_queue
      async function enqueue(collection, action, data, key) {
        try {
          const entry = {
            collection,
            action,    // create | update | delete
            data,
            key: key || null,
            created: Date.now(),
          };
          await Storage.put("sync_queue", entry);
          _pendingCount++;
          updateSyncIndicator();
          // 联网时立即尝试 flush
          if (navigator.onLine && !_flushing) {
            scheduleFlush(1000); // 1 秒延迟批量
          }
        } catch (e) {
          console.warn("[Sync] enqueue failed:", e);
        }
      }

      // daily_stats 防抖：本地先累加，延迟写入 sync_queue
      function markDailyStatDirty() {
        _dailyStatDirty = true;
        if (_dailyStatTimer) clearTimeout(_dailyStatTimer);
        _dailyStatTimer = setTimeout(async () => {
          if (!_dailyStatDirty) return;
          _dailyStatDirty = false;
          const ts = Tasks.getState();
          const today = ts.today || {};
          const date = today.date || utils.todayStr();
          await enqueue("daily_stats", "update", {
            uid: state.user?.phone || "guest",
            date,
            done: today.done || 0,
            correct: today.streakCorrect || 0,
            points: today.points || 0,
            learn_ms: today.learnMs || 0,
          }, date);
        }, DAILY_STAT_DEBOUNCE);
      }

      // 定时 flush
      function scheduleFlush(delay) {
        if (_flushTimer) clearTimeout(_flushTimer);
        _flushTimer = setTimeout(() => flush(), delay || FLUSH_INTERVAL);
      }

      // 批量 flush：从 sync_queue 读取并批量推送到服务器
      async function flush() {
        if (_flushing) return;
        if (!navigator.onLine) return;

        // 检查是否有 PocketBase 连接
        if (!window._pb) return;

        _flushing = true;
        try {
          const items = await Storage.getAll("sync_queue");
          if (!items || items.length === 0) {
            _flushing = false;
            return;
          }

          // 按时间排序
          items.sort((a, b) => (a.created || 0) - (b.created || 0));

          let successCount = 0;
          let failCount = 0;

          for (let i = 0; i < items.length; i += FLUSH_BATCH) {
            const batch = items.slice(i, i + FLUSH_BATCH);
            const results = await Promise.allSettled(
              batch.map(item => processItem(item))
            );

            for (let j = 0; j < results.length; j++) {
              if (results[j].status === "fulfilled" && results[j].value) {
                // 成功 → 从队列删除
                await Storage.delete("sync_queue", batch[j].id);
                successCount++;
              } else {
                failCount++;
                // 失败 → 停止后续批次
                break;
              }
            }

            if (failCount > 0) break; // 有失败就暂停
          }

          _pendingCount = Math.max(0, _pendingCount - successCount);
          updateSyncIndicator();

          if (successCount > 0) {
            console.log(`[Sync] flushed ${successCount} items`);
          }
          if (failCount > 0) {
            console.warn(`[Sync] ${failCount} items failed, will retry later`);
          }
        } catch (e) {
          console.error("[Sync] flush error:", e);
        } finally {
          _flushing = false;
        }
      }

      // 处理单条同步项
      async function processItem(item) {
        const pb = window._pb;
        if (!pb) return false;
        try {
          const col = pb.collection(item.collection);
          if (item.action === "create") {
            await col.create(item.data);
          } else if (item.action === "update") {
            if (item.key) {
              await col.update(item.key, item.data);
            } else {
              // 用 data 中的 id 或 qid 作为 key
              const key = item.data.id || item.data.qid || item.data.uid + "_" + item.data.date;
              if (key) await col.update(key, item.data);
              else await col.create(item.data);
            }
          } else if (item.action === "delete") {
            if (item.key) await col.delete(item.key);
          }
          return true;
        } catch (e) {
          console.warn(`[Sync] process ${item.collection}/${item.action} failed:`, e.message);
          return false;
        }
      }

      // 从服务器拉取更新（冲突解决）
      async function pull() {
        const pb = window._pb;
        if (!pb || !pb.authStore.isValid) return;

        try {
          // 拉取 leaderboard
          const lb = await pb.collection("leaderboard").getFullList(200, {
            sort: "-total_points",
          });
          if (lb && lb.length > 0) {
            localStorage.setItem("en_lb_cache", JSON.stringify({ data: lb, fetched: Date.now() }));
          }
        } catch (e) {
          console.warn("[Sync] pull failed:", e.message);
        }
      }

      // 更新 UI 指示器
      function updateSyncIndicator() {
        const el = document.getElementById("planDate");
        if (el) {
          if (_pendingCount > 0) {
            el.className = "sync-indicator pending";
            el.innerHTML = `<span class="dot"></span>${_pendingCount}条待同步`;
          } else {
            el.className = navigator.onLine ? "sync-indicator online" : "sync-indicator offline";
            el.innerHTML = `<span class="dot"></span>`;
          }
        }
      }

      // 初始化：恢复未完成的队列计数
      async function init() {
        try {
          const items = await Storage.getAll("sync_queue");
          _pendingCount = items ? items.length : 0;
          updateSyncIndicator();

          // 定时检查
          setInterval(() => {
            if (navigator.onLine && _pendingCount > 0) flush();
          }, FLUSH_INTERVAL);
        } catch (e) {
          console.warn("[Sync] init failed:", e);
        }
      }

      // 获取队列大小（UI 用）
      function getPendingCount() { return _pendingCount; }

      return { enqueue, markDailyStatDirty, flush, pull, init, scheduleFlush, getPendingCount };
    })();

    window.addEventListener("online", () => {
      toast("网络已恢复");
      Sync.flush();
    });
    window.addEventListener("offline", () => { toast("网络已断开，离线模式"); });
    // 页面关闭前强制 flush
    window.addEventListener("beforeunload", () => { Sync.flush(); });

    /* ========== 启动 ========== */
    (async function init() {
      await Storage.init();
      Tasks.init();
      window.Tasks = Tasks;
      // 当前账号成就全解锁
      (function() {
        const user = state.user || (() => {
          try { return JSON.parse(localStorage.getItem("en_user") || "null"); } catch (e) { return null; }
        })();
        const ids = ACHIEVEMENT_CATALOG.map(a => a.id);
        localStorage.setItem(getAchievementKey(user), JSON.stringify(ids));
        if (typeof toast === "function") toast("所有成就已解锁");
      })();
      // 一次性补偿：给当前账号加 5 万积分（按手机号防重复）
      (function() {
        const st = Tasks.getState();
        const phone = st?.user?.phone || 'guest';
        const key = '__bonus_50k_' + phone;
        if (!localStorage.getItem(key)) {
          Tasks.addPoints(50000);
          localStorage.setItem(key, '1');
          if (typeof toast === 'function') toast('系统补偿：+50000 积分');
        }
      })();
      Vip.init();
      Sync.init();
      // 触发 VIP 状态刷新
      bus.emit("vip-updated");
      // 初始化练习框主题
      CardTheme.init();
      // 异步加载当前学段题库后再渲染
      await initBank();
    })();
  </script>
