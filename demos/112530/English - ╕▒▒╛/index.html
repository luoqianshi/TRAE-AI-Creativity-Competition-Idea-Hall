    /* 单元课信息（card 外，左上角） */
    .source-tag {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.02em;
      padding: 0 0 6px 4px;
      pointer-events: none;
      flex-shrink: 0;
      align-self: flex-start;
      margin-bottom: 4px;
    }
    .source-tag:empty { display: none; }
    .chinese-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 8px 0 18px;
    }
    .chinese {
      font-size: 26px;
      font-weight: 600;
      line-height: 1.5;
      color: var(--ink);
      text-align: center;
    }
    .speak-sentence {
      flex-shrink: 0;
      color: var(--muted);
    }
    .speak-sentence:hover { color: var(--accent); }

    .btn {
      border: 1px solid var(--rule);
      background: var(--bg2);
      color: var(--ink);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: all .15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
      height: 36px;
      box-sizing: border-box;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    /* 移除按钮默认焦点黑框，保持视觉干净 */
    .btn:focus { outline: none; }
    .btn:focus-visible { outline: none; box-shadow: none; }
    .btn::-moz-focus-inner { border: 0; }
    .btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn.primary:hover { background: #1d4ed8; color: #fff; }
    .dark .btn.primary { background: #1a73e8; border-color: #1a73e8; }
    .dark .btn.primary:hover { background: #1765cc; }
    .btn.ghost { background: transparent; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn.active { border-color: var(--accent); color: var(--accent); background: rgba(37, 99, 235, 0.06); }
    /* 完成题目后"下一题"按钮闪烁高亮 */
    .btn.primary.pulse {
      animation: pulseGlow 1.2s ease-in-out infinite;
      background: var(--accent2);
      border-color: var(--accent2);
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.6); transform: scale(1); }
      50%      { box-shadow: 0 0 0 10px rgba(249, 115, 22, 0); transform: scale(1.04); }
    }

    /* 单词输入区 */
    .inputs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 18px 0 4px;
      margin-bottom: 0;
      justify-content: center;
    }
    /* 每个 word-cell 内部的语法标签 */
    .cell-grammar {
      display: none;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--bg2);
      border: 1px solid var(--rule);
      color: var(--ink);
      white-space: nowrap;
      line-height: 1.3;
      margin-top: 3px;
      animation: fadeIn .3s ease;
    }
    .inputs.show-analysis .word-cell.correct .cell-grammar { display: inline-block; }
    .cell-grammar.punct { display: none; }
    /* 角色颜色 */
    .cell-grammar.subject { background: rgba(37, 99, 235, 0.12); border-color: rgba(37, 99, 235, 0.3); color: #1d4ed8; }
    .cell-grammar.verb    { background: rgba(22, 163, 74, 0.12); border-color: rgba(22, 163, 74, 0.3); color: #15803d; }
    .cell-grammar.object  { background: rgba(249, 115, 22, 0.12); border-color: rgba(249, 115, 22, 0.3); color: #c2410c; }
    .cell-grammar.adj     { background: rgba(168, 85, 247, 0.12); border-color: rgba(168, 85, 247, 0.3); color: #7e22ce; }
    .cell-grammar.adv     { background: rgba(14, 165, 233, 0.12); border-color: rgba(14, 165, 233, 0.3); color: #0369a1; }
    .cell-grammar.det     { background: rgba(107, 114, 128, 0.1); border-color: rgba(107, 114, 128, 0.25); color: #4b5563; }
    .cell-grammar.noun    { background: rgba(217, 119, 6, 0.1); border-color: rgba(217, 119, 6, 0.25); color: #a16207; }
    .cell-grammar.prep    { background: rgba(139, 92, 246, 0.1); border-color: rgba(139, 92, 246, 0.25); color: #6d28d9; }
    .cell-grammar.conj    { background: rgba(20, 184, 166, 0.1); border-color: rgba(20, 184, 166, 0.25); color: #0f766e; }
    .cell-grammar.other   { background: rgba(107, 114, 128, 0.12); border-color: rgba(107, 114, 128, 0.3); color: #374151; }
    .word-cell {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      border: 0;
      border-bottom: 2px solid rgba(203, 213, 225, .9);
      border-radius: 0;
      background: transparent;
      transition: border-color .15s ease, transform .12s ease;
      position: relative;
      padding: 4px 2px 2px;
      flex: 0 0 auto;
      min-width: 32px;
    }
    .word-cell.correct {
      border-bottom-color: #34d399;
      padding-bottom: 6px;
    }
    /* 标点符号：去掉下划线，只显示符号本身 */
    .word-cell.punct {
      border-bottom: 0;
      padding: 4px 0 2px;
    }
    .word-cell.active {
      border-bottom-color: #60a5fa;
    }
    .word-cell.typed { border-bottom-color: #60a5fa; }
    .word-cell.wrong {
      border-bottom-color: #fb7185;
      animation: shake .35s ease;
    }
    /* 大小写错误：红色提示 */
    .word-cell.case-error {
      border-bottom-color: #fb7185;
      animation: shake .35s ease;
    }
    .word-cell .case-marker {
      display: none;
      position: absolute;
      top: -10px;
      right: -4px;
      padding: 1px 5px;
      font-size: 10px;
      color: #fff;
      background: var(--accent2);
      border-radius: 4px;
      font-weight: 600;
      letter-spacing: 0.04em;
      user-select: none;
    }
    .word-cell.case-error .case-marker { display: block; }
    /* 正确后显示元信息行：音标 + 朗读按钮 + 释义 */
    .word-cell .cell-meta {
      display: none;
    }
    .inputs.show-analysis .word-cell.correct .cell-meta {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
      height: 24px;
      line-height: 1;
    }
    .word-cell .cell-phonetic {
      font-size: 10px;
      color: var(--muted);
      font-family: "Lucida Sans Unicode", "Segoe UI", "Helvetica Neue", sans-serif;
      white-space: nowrap;
      line-height: 1;
      min-width: 24px;
      text-align: center;
    }
    .word-cell .cell-phonetic:empty {
      display: none;
    }
    .word-cell .cell-speak-btn {
      width: 20px;
      height: 20px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: all .15s ease;
    }
    .word-cell .cell-speak-btn:hover {
      background: rgba(37, 99, 235, 0.08);
      color: var(--accent);
    }
    .word-cell .cell-meaning {
      font-size: 10px;
      color: var(--ink);
      font-weight: 500;
      white-space: nowrap;
      line-height: 1;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .word-cell .cell-meaning:empty {
      display: none;
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    /* 英文字号通过 CSS 变量统一控制，方便在设置里调整 */
    :root {
      --en-font-size: 22px;
      --en-font-size-wide: 20px;
    }
    .word-cell input {
      border: 0;
      outline: 0;
      padding: 6px 2px 4px;
      font-size: var(--en-font-size);
      font-weight: 500;
      width: calc(var(--cell-chars, 6) * 1ch + 16px);
      min-width: 32px;
      background: transparent;
      color: var(--ink);
      text-align: center;
      font-family: "Segoe UI", "Helvetica Neue", "SF Pro Text", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0.01em;
      /* 强制关闭中文输入法（Chromium / Edge / Firefox / Safari 通用） */
      ime-mode: disabled;
      -webkit-ime-mode: disabled;
      -moz-ime-mode: disabled;
    }
    /* 完整单词提示时字号略小，便于放下完整单词 */
    .word-cell input.wide { font-size: var(--en-font-size-wide); }
    .word-cell .hint {
      display: none; /* 默认隐藏，按 Shift 才在当前焦点显示 */
      position: absolute;
      top: -42px;
      left: 50%;
      transform: translateX(-50%);
      padding: 3px 8px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.3;
      color: #fde047;
      background: rgba(249, 115, 22, 0.8);
      border: 1px solid rgba(249, 115, 22, 0.3);
      border-radius: 6px;
      white-space: nowrap;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      z-index: 5;
      text-align: center;
    }
    .word-cell .hint .hint-zh {
      display: block;
      font-size: 12px;
      font-weight: 400;
      color: #fff;
      opacity: 0.85;
      margin-top: 1px;
    }
    @keyframes hintPop {
      from { transform: translateX(-50%) translateY(-2px); opacity: 0; }
      to   { transform: translateX(-50%) translateY(0); opacity: 1; }
    }
    .word-cell .hint.show { display: block; }

    /* 提交区 */
    .submit-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      margin-top: 16px;
    }
    .hint-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      font-size: 13px;
      color: var(--muted);
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 8px;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      transition: all .15s ease;
    }
    .hint-btn:active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    kbd {
      display: inline-block;
      padding: 1px 6px;
      border: 1px solid var(--rule);
      border-bottom-width: 2px;
      border-radius: 4px;
      background: var(--bg);
      font-size: 12px;
      font-family: inherit;
    }

    /* 句式说明：默认文字显示，无特殊样式 */
    .structure {
      display: none;
      font-size: 14px;
      color: var(--ink);
      padding: 6px 0 14px;
      line-height: 1.6;
      text-align: center;
    }
    .structure.show { display: block; }

    /* 语法详解 */
    .grammar-notes {
      display: none;
      margin: 0 0 14px;
      padding: 12px 16px;
      background: rgba(37, 99, 235, 0.04);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      font-size: 13px;
      color: var(--ink);
      line-height: 1.7;
      text-align: left;
    }
    .grammar-notes.show { display: block; }
    .grammar-notes .gn-title {
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 6px;
      font-size: 13px;
    }
    .grammar-notes .gn-body {
      color: var(--muted);
    }
    .grammar-notes .gn-body strong {
      color: var(--ink);
      font-weight: 500;
    }

    /* topbar 右侧图标按钮（设置、登录） */
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .topbar-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      color: var(--muted);
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 8px;
      cursor: pointer;
      transition: all .15s ease;
    }
    .topbar-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .topbar-btn.logged-in {
      color: #07c160;
      border-color: #07c160;
    }

    /* 屏幕震动 */
    body.shake { animation: bodyShake .35s ease; }
    @keyframes bodyShake {
      0%,100% { transform: none; }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }

    /* 完成页 */
    .finish {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }
    .finish.show { display: block; }
    .finish h2 { margin: 8px 0; font-size: 22px; }
    .finish p { color: var(--muted); margin: 8px 0 20px; }

    /* 设置弹窗 */
    .modal-mask {
      position: fixed; inset: 0;
      background: rgba(31, 41, 55, 0.45);
      display: none;
      align-items: center; justify-content: center;
      z-index: 50;
      padding: 20px;
    }
    .modal-mask.show { display: flex; }
    .modal {
      background: var(--bg2);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      width: 100%;
      max-width: 480px;
      padding: 24px;
    }
    .modal h3 {
      margin: 0 0 4px;
      font-size: 18px;
    }
    .modal .sub {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 18px;
    }

    /* 手机号登录弹窗 */
    .phone-login {
      position: relative;
      text-align: center;
      padding: 36px 28px 24px;
      max-width: 380px;
    }
    .login-close {
      position: absolute;
      top: 12px; right: 16px;
      background: transparent;
      border: 0;
      font-size: 24px;
      color: var(--muted);
      cursor: pointer;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .login-close:hover { background: var(--rule); color: var(--ink); }
    .login-header { margin-bottom: 22px; }
    .login-logo {
      width: 56px; height: 56px;
      background: var(--accent);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .phone-login h3 {
      margin: 0 0 4px;
      font-size: 19px;
      color: var(--ink);
    }
    .login-sub {
      color: var(--muted);
      font-size: 13px;
    }
    /* 表单 */
    .login-form-area { text-align: left; }
    .form-item { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 13px;
      color: var(--ink);
      margin-bottom: 6px;
      font-weight: 500;
    }
    .input-wrap {
      display: flex;
      align-items: center;
      border: 1px solid var(--rule);
      border-radius: 10px;
      overflow: hidden;
      background: var(--bg);
      transition: border-color .15s ease;
    }
    .input-wrap:focus-within { border-color: var(--accent); }
    .input-prefix {
      padding: 0 12px;
      font-size: 14px;
      color: var(--muted);
      border-right: 1px solid var(--rule);
      line-height: 42px;
      height: 42px;
    }
    .form-input {
      flex: 1;
      border: 0;
      outline: 0;
      padding: 10px 12px;
      font-size: 15px;
      background: transparent;
      color: var(--ink);
      font-family: inherit;
      height: 42px;
    }
    .code-wrap .form-input { padding-right: 8px; }
    .code-btn {
      border: 0;
      border-left: 1px solid var(--rule);
      border-radius: 0;
      background: var(--bg2);
      color: var(--accent);
      font-size: 13px;
      padding: 0 12px;
      height: 42px;
      white-space: nowrap;
    }
    .code-btn:disabled { color: var(--muted); cursor: not-allowed; }
    .form-error {
      font-size: 12px;
      color: #ef4444;
      margin-top: 0;
      max-height: 0;
      overflow: hidden;
      transition: max-height .2s ease, margin-top .2s ease;
    }
    .form-error:not(:empty) {
      margin-top: 4px;
      max-height: 20px;
    }
    .form-hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    /* 登录成功 */
    .login-success {
      display: none;
      padding: 30px 0 10px;
    }
    .login-success.show { display: block; }
    .login-success.show ~ .login-form-area { display: none; }
    .success-icon {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 32px;
      line-height: 56px;
      margin: 0 auto 12px;
    }
    .success-text {
      font-size: 17px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 4px;
    }
    .success-user {
      font-size: 13px;
      color: var(--muted);
    }
    .login-foot {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      justify-content: center;
    }
    .phone-btn {
      background: var(--accent);
      border-color: var(--accent);
    }
    .phone-btn:hover { background: #1d4ed8; border-color: #1d4ed8; }
    .opt-group { display: flex; flex-direction: column; gap: 10px; }
    .opt {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      border: 1px solid var(--rule);
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
      transition: all .15s ease;
    }
    .opt:hover { border-color: var(--accent); }
    .opt input { margin-top: 3px; accent-color: var(--accent); }
    .opt .opt-title { font-weight: 600; font-size: 14px; }
    .opt .opt-desc  { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .opt.selected { border-color: var(--accent); background: rgba(37, 99, 235, 0.05); }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    /* 教材选择弹层：四级联动网格 */
    .book-modal { max-width: 420px; }
    .book-modal-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .book-modal .book-col {
      width: 100%;
      max-height: 180px;
      border: 1px solid var(--rule);
      border-radius: 8px;
      overflow: hidden;
    }
    .book-modal .book-col + .book-col { border-left: 1px solid var(--rule); }
    .book-modal .book-col-title {
      background: var(--bg);
      font-size: 12px;
      padding: 8px 10px;
    }
    .book-modal .book-col-list { max-height: 140px; }
    .book-modal .book-item { padding: 8px 10px; font-size: 13px; }

    /* 设置：字号滑块 */
    .setting-row {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px dashed var(--rule);
    }
    .setting-label {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--ink);
    }
    .setting-label span {
      color: var(--accent);
      font-weight: 700;
    }
    #fontSizeRange {
      width: 100%;
      accent-color: var(--accent);
      margin: 4px 0 10px;
    }
    .setting-presets {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .chip {
      padding: 4px 10px;
      border: 1px solid var(--rule);
      border-radius: 999px;
      background: var(--bg2);
      font-size: 12px;
      cursor: pointer;
      color: var(--ink);
      font-family: inherit;
      transition: all .15s ease;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .chip.active { border-color: var(--accent); background: rgba(37, 99, 235, 0.08); color: var(--accent); }

    @media (max-width: 640px) {
      :root {
        --en-font-size: 19px;
        --en-font-size-wide: 17px;
      }
      .chinese { font-size: 20px; }
      .card { padding: 20px; }
      .tag .word { font-size: 17px; }
    }

    /* ========== 面板统一样式 ========== */
    .panel {
      position: fixed; inset: 0; z-index: 40; background: var(--bg);
      overflow-y: auto; display: none; padding-bottom: 40px;
    }
    .panel.show { display: block; animation: slideUp .25s ease; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .panel-head {
      position: sticky; top: 0; z-index: 5; background: var(--bg2);
      border-bottom: 1px solid var(--rule); padding: 8px 16px;
      display: flex; align-items: center; gap: 10px;
    }
    .panel-head h2 { margin: 0; font-size: 18px; font-weight: 700; flex: 1; }
    .panel-back {
      width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--rule);
      background: var(--bg2); color: var(--ink); cursor: pointer; font-size: 18px;
      display: flex; align-items: center; justify-content: center; transition: all .15s ease;
    }
    .panel-back:hover { background: var(--rule); }
    .panel-body { padding: 16px; max-width: 960px; margin: 0 auto; }

    /* 在线/离线状态指示器 */
    .sync-indicator {
      display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted);
      white-space: nowrap; padding: 2px 6px; border-radius: 999px; background: var(--bg2);
      border: 1px solid var(--rule);
    }
    .sync-indicator .dot { width: 8px; height: 8px; border-radius: 50%; }
    .sync-indicator.online .dot { background: var(--success); }
    .sync-indicator.offline .dot { background: var(--muted); }
    .sync-indicator.pending .dot { background: var(--accent2); animation: pulse 1s infinite; }

    /* 进度环 */
    .progress-ring { display: inline-flex; align-items: center; justify-content: center; position: relative; }
    .progress-ring svg { transform: rotate(-90deg); }
    .progress-ring .ring-bg { fill: none; stroke: var(--rule); stroke-width: 6; }
    .progress-ring .ring-fg { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset .4s ease; }
    .progress-ring .ring-text { position: absolute; font-size: 13px; font-weight: 700; color: var(--ink); }

    /* 等级进度条 */
    .level-bar-wrap { background: var(--bg2); border: 1px solid var(--rule); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
    .level-bar-wrap .lvl-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .level-badge { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
    .level-carousel-scroller::-webkit-scrollbar { display: none; }
    .level-slide-card {
      will-change: transform, opacity, filter;
      transform-style: preserve-3d;
      transition: transform .18s ease-out, opacity .18s ease-out, filter .18s ease-out, box-shadow .18s ease-out;
    }
    .level-slide-card:active { cursor: grabbing; }
    .level-dot.active { width: 18px !important; opacity: 1 !important; }
    .lvl-points { font-size: 13px; color: var(--muted); }
    .lvl-bar { height: 8px; background: var(--rule); border-radius: 999px; overflow: hidden; }
    .lvl-bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 999px; transition: width .4s ease; }
    .streak-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--accent2); font-weight: 600; }

    /* 任务清单 */
    .task-list { display: flex; flex-direction: column; gap: 8px; }
    .task-item { display: flex; align-items: center; gap: 10px; background: var(--bg2); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; }
    .task-item.done { opacity: .55; }
    .task-item:not(.done) { background: var(--card); border-color: var(--accent); }
    .task-check { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--rule); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: transparent; transition: all .15s ease; }
    .task-item.done .task-check { background: var(--success); border-color: var(--success); color: #fff; }
    .task-item:not(.done) .task-check { border-color: var(--accent); background: var(--bg2); }
    .task-item:not(.done) .task-check::after { content: ""; }
    .task-info { flex: 1; min-width: 0; }
    .task-name { font-size: 14px; font-weight: 600; }
    .task-item:not(.done) .task-name { color: var(--ink); font-weight: 700; }
    .task-progress-text { font-size: 12px; color: var(--muted); }
    .task-item:not(.done) .task-progress-text { color: var(--ink); font-weight: 500; opacity: .78; }
    .task-progress-bar { height: 4px; background: var(--rule); border-radius: 999px; overflow: hidden; margin-top: 4px; }
    .task-progress-bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s ease; }
    .task-reward { font-size: 13px; font-weight: 700; color: var(--accent2); white-space: nowrap; }
    .task-item:not(.done) .task-reward { font-weight: 800; }
    .task-reward.vip { color: #b8860b; }

    /* 签到按钮 */
    .sign-btn { width: 100%; padding: 12px; border: none; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; transition: all .15s ease; }
    .sign-btn:disabled { opacity: .5; cursor: default; }
    .sign-btn.signed { background: var(--success); }

    /* 柱状图 */
    .bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding: 8px 0; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
    .bar-col .bar { width: 100%; max-width: 32px; border-radius: 6px 6px 0 0; transition: height .4s ease; min-height: 2px; }
    .bar-col .bar.done { background: var(--accent); }
    .bar-col .bar.correct { background: var(--success); margin-top: 2px; }
    .bar-col .bar-label { font-size: 11px; color: var(--muted); }
    .bar-col .bar-value { font-size: 10px; color: var(--ink); font-weight: 600; }

    /* 排行榜 */
    .rank-list { display: flex; flex-direction: column; gap: 4px; }
    .rank-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--bg2); border: 1px solid var(--rule); border-radius: 10px; }
    .rank-item.me { border-color: var(--accent); background: rgba(37,99,235,.05); }
    .rank-num { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; background: var(--rule); color: var(--muted); }
    .rank-avatar { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; flex-shrink: 0; border: 1px solid var(--rule); background: var(--card); cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; }
    .rank-avatar:hover { transform: scale(1.06); box-shadow: 0 0 0 2px rgba(37,99,235,.15); }
    .rank-avatar img, .rank-avatar svg { width: 100%; height: 100%; display: block; object-fit: cover; }
    .rank-item:nth-child(1) { position: relative; overflow: hidden; border: 2px solid rgba(250,204,21,.78); background: linear-gradient(135deg, rgba(250,204,21,.22), rgba(249,115,22,.12), var(--bg2)); box-shadow: 0 0 0 3px rgba(250,204,21,.12), 0 12px 28px rgba(250,204,21,.18); }
    .rank-item:nth-child(1)::after { content: ""; position: absolute; inset: -40% auto -40% -30%; width: 42px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.42), transparent); transform: rotate(24deg); animation: rankFirstShine 3s ease-in-out infinite; pointer-events: none; }
    @keyframes rankFirstShine { 0%,45% { left: -35%; opacity: 0; } 55% { opacity: 1; } 80%,100% { left: 120%; opacity: 0; } }
    .rank-profile-mask { position: fixed; inset: 0; z-index: 3000; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(15,23,42,.72); animation: fadeIn .18s ease; }
    .rank-profile-card { width: min(360px, 92vw); border: 3px solid rgba(37,99,235,.72); border-radius: 18px; background: linear-gradient(135deg,#111827,#1f2937); padding: 16px; box-shadow: 0 0 0 4px rgba(37,99,235,.18), 0 22px 60px rgba(15,23,42,.46); animation: popIn .18s ease; }
    .rank-profile-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .rank-profile-avatar { width: 54px; height: 54px; border-radius: 50%; overflow: hidden; flex-shrink: 0; border: 2px solid rgba(37,99,235,.22); background: var(--card); }
    .rank-profile-avatar img, .rank-profile-avatar svg { width: 100%; height: 100%; display: block; object-fit: cover; }
    .rank-profile-name { font-size: 17px; font-weight: 800; color: var(--ink); }
    .rank-profile-vip { display: inline-flex; align-items: center; gap: 2px; margin-left: 7px; padding: 0; background: none; border: 0; color: #facc15; font-size: 12px; font-weight: 950; letter-spacing: .08em; text-shadow: 0 0 8px rgba(250,204,21,.75), 0 0 18px rgba(249,115,22,.42); vertical-align: 2px; animation: rankVipTextGlow 1.8s ease-in-out infinite; }
    @keyframes rankVipTextGlow { 0%,100% { filter: brightness(1); transform: translateY(0); } 50% { filter: brightness(1.28); transform: translateY(-1px); } }
    .rank-profile-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .rank-profile-rank { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 999px; background: rgba(107,114,128,.16); color: var(--muted); font-weight: 700; }
    .rank-profile-rank.gold { background: linear-gradient(135deg,#facc15,#f59e0b); color: #5c3d00; box-shadow: 0 0 0 1px rgba(250,204,21,.35), 0 0 12px rgba(250,204,21,.35); }
    .rank-profile-rank.silver { background: linear-gradient(135deg,#f8fafc,#cbd5e1); color: #334155; box-shadow: 0 0 0 1px rgba(203,213,225,.5), 0 0 12px rgba(203,213,225,.32); }
    .rank-profile-rank.bronze { background: linear-gradient(135deg,#f7c59f,#b87333); color: #fff7ed; box-shadow: 0 0 0 1px rgba(184,115,51,.45), 0 0 12px rgba(184,115,51,.34); }
    .rank-profile-close { margin-left: auto; border: 0; background: rgba(255,255,255,.55); color: var(--muted); width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 24px; }
    .rank-profile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .rank-profile-stat { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 9px 10px; }
    .rank-profile-stat .label { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
    .rank-profile-stat .value { font-size: 15px; font-weight: 800; color: var(--accent); }
    .rank-profile-motto { margin: 0 0 12px; padding: 10px; border-radius: 12px; background: rgba(37,99,235,.07); border: 1px dashed rgba(37,99,235,.35); }
    .rank-profile-motto .label { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .rank-profile-motto textarea { width: 100%; min-height: 44px; resize: none; box-sizing: border-box; border: 1px solid var(--rule); border-radius: 10px; padding: 8px 10px; background: var(--card); color: var(--ink); font-size: 13px; line-height: 1.4; outline: none; }
    .rank-profile-motto textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37,99,235,.12); }
    .rank-profile-motto .motto-save { margin-top: 7px; padding: 5px 12px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; }
    .rank-profile-motto-text { font-size: 13px; color: var(--ink); line-height: 1.5; word-break: break-word; }
    .rank-profile-achievements { margin: 0 0 12px; padding: 10px; border-radius: 12px; background: rgba(250,204,21,.08); border: 1px solid rgba(250,204,21,.24); }
    .rank-profile-achievements .label { font-size: 11px; color: var(--muted); margin-bottom: 7px; }
    .profile-achievement-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
    .profile-achievement-chip { display: flex; align-items: center; justify-content: center; gap: 5px; width: 100%; height: 34px; box-sizing: border-box; padding: 0 8px; border-radius: 10px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); color: var(--ink); font-size: 12px; font-weight: 700; }
    .profile-achievement-chip .icon { font-size: 14px; flex-shrink: 0; }
    .profile-achievement-chip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .profile-achievement-empty { color: var(--muted); font-size: 12px; }
    .rank-item:nth-child(1) .rank-num { background: linear-gradient(135deg,#fff7ad,#facc15,#f59e0b); color: #5c3d00; box-shadow: 0 0 12px rgba(250,204,21,.55); border: 1px solid rgba(255,236,153,.8); }
    .rank-item:nth-child(2) .rank-num { background: #c0c0c0; color: #555; }
    .rank-item:nth-child(3) .rank-num { background: #cd7f32; color: #fff; }
    .rank-name { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 14px; font-weight: 600; }
    .rank-name-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank-level-badge { flex-shrink: 0; padding: 1px 6px; border-radius: 999px; background: rgba(37,99,235,.1); color: var(--accent); border: 1px solid rgba(37,99,235,.18); font-size: 11px; font-weight: 800; }
    .rank-points { font-size: 14px; font-weight: 700; color: var(--accent2); }
    .rank-tabs { display: flex; gap: 0; margin-bottom: 12px; border-radius: 10px; overflow: hidden; border: 1px solid var(--rule); }
    .rank-tab { flex: 1; text-align: center; padding: 8px 0; font-size: 13px; font-weight: 600; cursor: pointer; background: var(--bg2); color: var(--muted); transition: all .2s; }
    .rank-tab.active { background: var(--accent); color: #fff; }
    .rank-tab:not(.active):hover { background: var(--card); }

    /* Trello 看板 */
    .board-wrap { display: flex; gap: 12px; overflow-x: auto; padding: 12px 0; min-height: calc(100vh - 140px); }
    .board-col { flex: 0 0 220px; background: var(--bg2); border: 1px solid var(--rule); border-radius: 12px; display: flex; flex-direction: column; max-height: calc(100vh - 160px); }
    .board-col-head { padding: 10px 12px; border-bottom: 1px solid var(--rule); display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 700; }
    .board-col-count { font-size: 11px; color: var(--muted); background: var(--rule); padding: 2px 8px; border-radius: 999px; }
    .board-col-body { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
    .board-col.locked { opacity: .5; }
    .board-col.locked .board-col-body { pointer-events: none; }
    .board-card { background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; cursor: grab; transition: box-shadow .15s ease, border-color .15s ease; }
    .board-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .board-card.dragging { opacity: .5; cursor: grabbing; }
    .board-card.drag-over { border-color: var(--accent2); border-style: dashed; }
    .board-card-zh { font-size: 13px; line-height: 1.4; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .board-card-meta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
    .board-card-diff { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .board-card-due { margin-left: auto; }

    /* VIP 面板 */
    .vip-panel { max-width: 420px; margin: 0 auto; }
    #vipModal.vip-panel { position: relative; isolation: isolate; background: var(--bg2); border: 0; overflow: visible; }
    #vipModal.vip-panel::before { content: ""; position: absolute; inset: -3px; z-index: -1; border-radius: 19px; background: linear-gradient(120deg,#fff7ad,#facc15,#f59e0b,#fff7ad,#b45309,#facc15); background-size: 300% 300%; animation: vipModalGoldFlow 3s linear infinite; box-shadow: 0 0 18px rgba(250,204,21,.55), 0 0 36px rgba(245,158,11,.28); }
    #vipModal.vip-panel::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 16px; background: var(--bg2); }
    @keyframes vipModalGoldFlow { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
    .vip-status-card { background: linear-gradient(135deg, #1a1a2e, #16213e); color: #fff; border-radius: 16px; padding: 20px; margin-bottom: 16px; text-align: center; }
    .vip-status-card .vip-icon { font-size: 32px; }
    .vip-status-card .vip-title { font-size: 18px; font-weight: 700; margin: 6px 0; }
    .vip-status-card .vip-expire { font-size: 13px; color: rgba(255,255,255,.6); }
    .vip-plans { display: flex; gap: 10px; margin-bottom: 16px; }
    .vip-plan { flex: 1; border: 2px solid var(--rule); border-radius: 14px; padding: 16px 10px; text-align: center; cursor: pointer; transition: all .15s ease; position: relative; background: var(--card); }
    .vip-plan:hover { border-color: var(--accent); }
    .vip-plan.selected { border-color: #b8860b; background: #fff7d6; }
    .vip-plan.recommended::after { content: "推荐"; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: #b8860b; color: #fff; font-size: 10px; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
    .vip-plan-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .vip-plan-price { font-size: 22px; font-weight: 800; color: #b8860b; }
    .vip-plan-price small { font-size: 12px; font-weight: 400; color: var(--muted); }
    .vip-plan-discount { font-size: 11px; color: var(--accent2); margin-top: 2px; }
    .vip-benefits { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .vip-benefits-title { color: #ffd700; background: linear-gradient(135deg,#fff7ad 0%,#ffd700 35%,#f59e0b 70%,#fff7ad 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 10px rgba(255,215,0,.72), 0 0 22px rgba(245,158,11,.48), 0 0 34px rgba(250,204,21,.28); font-weight: 950; letter-spacing: .04em; }
    .vip-benefit { display: flex; align-items: center; gap: 6px; font-size: 13px; }
    .vip-benefit .check { color: var(--success); font-weight: 700; }
    .vip-benefit.locked { color: var(--muted); }
    .vip-benefit.locked .check { color: var(--rule); }
    .vip-pay-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; background: #1677ff; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; transition: opacity .15s ease; }
    #btnVipRenew, #btnVipPay { background: linear-gradient(135deg,#1a1a2e 0%,#16213e 40%,#e2b714 80%,#ffd700 100%); color: #fff7cc; border: 1px solid rgba(255,215,0,.78); box-shadow: 0 0 0 2px rgba(255,215,0,.12), 0 10px 24px rgba(226,183,20,.26); text-shadow: 0 1px 2px rgba(0,0,0,.45); }
    #btnVipRenew:hover, #btnVipPay:hover { filter: brightness(1.08); box-shadow: 0 0 0 2px rgba(255,215,0,.2), 0 12px 30px rgba(226,183,20,.34); }
    .vip-pay-btn:disabled { opacity: .5; }

    /* 升级引导弹窗 */
    .upgrade-guide { max-width: 360px; text-align: center; }
    .upgrade-guide h3 { font-size: 18px; margin: 0 0 8px; }
    .upgrade-guide .quota { font-size: 14px; color: var(--danger); margin-bottom: 14px; }
    .upgrade-guide .compare { display: flex; gap: 8px; margin-bottom: 16px; text-align: left; }
    .upgrade-guide .compare-col { flex: 1; border: 1px solid var(--rule); border-radius: 10px; padding: 12px; }
    .upgrade-guide .compare-col.vip { border-color: #b8860b; background: rgba(184,134,11,.05); }
    .upgrade-guide .compare-col h4 { margin: 0 0 8px; font-size: 13px; }
    .upgrade-guide .compare-col ul { margin: 0; padding-left: 16px; font-size: 12px; line-height: 1.8; color: var(--muted); }
    .upgrade-guide .compare-col.vip ul { color: var(--ink); }
    .upgrade-guide .actions { display: flex; flex-direction: column; gap: 8px; }

    /* 用户中心 */
    .user-center { max-width: 420px; margin: 0 auto; }
    .uc-profile { display: flex; align-items: center; gap: 14px; background: var(--bg2); border: 1px solid var(--rule); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
    .uc-avatar { width: 56px; height: 56px; border-radius: 50%; flex-shrink: 0; overflow: hidden; cursor: pointer; position: relative; border: 2px solid var(--rule); background: var(--card); }
    .uc-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .uc-avatar::after { content: "更换"; position: absolute; left: 0; right: 0; bottom: 0; padding: 2px 0; text-align: center; font-size: 10px; color: #fff; background: rgba(0,0,0,.48); opacity: 0; transition: opacity .15s ease; }
    .uc-avatar:hover::after { opacity: 1; }
    .uc-info { flex: 1; }
    .uc-name { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .uc-name .edit-btn { font-size: 12px; color: var(--accent); cursor: pointer; border: none; background: none; }
    .uc-phone { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .uc-motto { background: rgba(37,99,235,.06); border: 1px dashed rgba(37,99,235,.35); border-radius: 14px; padding: 12px; margin-bottom: 16px; }
    .uc-motto-title { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
    .uc-motto textarea { width: 100%; min-height: 46px; resize: none; box-sizing: border-box; border: 1px solid var(--rule); border-radius: 10px; padding: 8px 10px; background: var(--card); color: var(--ink); font-size: 13px; line-height: 1.4; outline: none; }
    .uc-motto textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37,99,235,.12); }
    .uc-motto-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 8px; }
    .uc-motto-hint { font-size: 11px; color: var(--muted); }
    .uc-motto-save { border: 0; border-radius: 999px; padding: 5px 12px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; }
    .uc-achievements { background: rgba(250,204,21,.06); border: 1px dashed rgba(250,204,21,.38); border-radius: 14px; padding: 12px; margin-bottom: 16px; }
    .uc-achievements-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 9px; }
    .uc-achievements-count { font-size: 11px; color: var(--accent); font-weight: 800; }
    .uc-achievements-hint { font-size: 11px; color: var(--muted); font-weight: 400; cursor: pointer; }
    .uc-achievements-hint:hover { color: var(--accent); }
    .uc-achievement-options { display: flex; flex-wrap: wrap; gap: 8px; }
    .uc-achievement-option { display: inline-flex; align-items: center; gap: 5px; max-width: 128px; border: 1px solid var(--rule); border-radius: 999px; padding: 5px 9px; background: var(--card); color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; }
    .uc-achievement-option.selected { border-color: rgba(250,204,21,.72); background: rgba(250,204,21,.14); color: var(--ink); box-shadow: 0 0 12px rgba(250,204,21,.15); }
    .uc-achievement-option .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .uc-achievements-empty { color: var(--muted); font-size: 12px; line-height: 1.6; }
    .uc-section { background: var(--bg2); border: 1px solid var(--rule); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
    .uc-section h4 { margin: 0 0 12px; font-size: 14px; color: var(--muted); }
    .uc-stat-row { display: flex; justify-content: space-between; font-size: 14px; padding: 6px 0; }
    .uc-stat-row .val { font-weight: 700; color: var(--accent); }
    .uc-logout { display: block; width: fit-content; margin: 0 auto; padding: 8px 0; background: none; border: 0; color: var(--muted); font-size: 14px; cursor: pointer; text-decoration: none; }
    .uc-logout:hover { text-decoration: underline; color: var(--danger); }

    /* 下载遮罩 */
    .download-overlay { text-align: center; max-width: 320px; }
    .download-overlay .dl-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .download-overlay .dl-sub { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
    .download-overlay .dl-bar { height: 10px; background: var(--rule); border-radius: 999px; overflow: hidden; margin-bottom: 8px; }
    .download-overlay .dl-bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 999px; transition: width .3s ease; }
    .download-overlay .dl-text { font-size: 13px; color: var(--muted); }

    /* 热力图 */
    .heatmap { display: grid; grid-template-columns: repeat(30, 1fr); gap: 3px; }
    .heatmap-cell { aspect-ratio: 1; border-radius: 3px; background: var(--rule); }
    .heatmap-cell.l1 { background: rgba(37,99,235,.25); }
    .heatmap-cell.l2 { background: rgba(37,99,235,.5); }
    .heatmap-cell.l3 { background: rgba(37,99,235,.75); }
    .heatmap-cell.l4 { background: var(--accent); }

    /* 面板 section 标题 */
    .section-title { font-size: 14px; font-weight: 700; color: var(--muted); margin: 16px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
    .section-title:first-child { margin-top: 0; }

    /* Toast 提示 */
    .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(31,41,55,.92); color: #fff; font-size: 14px; padding: 10px 20px; border-radius: 999px; z-index: 9999; opacity: 0; transition: opacity .3s ease, bottom .3s ease; pointer-events: none; }
    .toast.show { opacity: 1; bottom: 100px; }

    /* 子页切换 tab */
    .sub-tabs { display: flex; gap: 4px; margin-bottom: 16px; }
    .sub-tab { flex: 1; padding: 8px; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg2); font-size: 13px; cursor: pointer; text-align: center; transition: all .15s ease; }
    .sub-tab.active { border-color: var(--accent); color: var(--accent); background: rgba(37,99,235,.05); }

    /* 统计卡片 */
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
    .stat-card { background: var(--bg2); border: 1px solid var(--rule); border-radius: 12px; padding: 14px; text-align: center; }
    .stat-card .stat-val { font-size: 24px; font-weight: 800; color: var(--accent); }
    .stat-card .stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; }

    @media (max-width: 640px) {
      .board-wrap { gap: 8px; }
      .board-col { flex: 0 0 180px; }
      .vip-benefits { grid-template-columns: 1fr 1fr; }
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
      .panel-body { padding: 12px; }
      /* 移动端 VIP 套餐横排紧凑 */
      .vip-plans { gap: 6px; }
      .vip-plan { padding: 10px 4px; border-radius: 10px; }
      .vip-plan-name { font-size: 12px; }
      .vip-plan-price { font-size: 16px; }
      .vip-plan-price small { font-size: 10px; }
      .vip-plan-discount { font-size: 10px; }
    }
  </style>
</head>
<body>
  <!-- 右上角固定栏：进度条 + 教材选择 -->
  <div class="topbar-fixed">
    <!-- 教材选择抽屉（四级联动） -->
    <div class="book-select" id="bookSelect">

        <span id="bookLabel">初中人教版七年级上册</span>
        <svg class="book-caret" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>

          <div class="book-col-list"></div>

        <div class="book-col" id="colGrade">

          <div class="book-col-list"></div>

        <!-- 学期/内容列 -->

    </div>
    <!-- 设置和登录按钮（紧跟教材选择） -->
    <div class="topbar-actions" id="topbarActions">
      <button class="topbar-btn" id="btnTheme" title="切换主题" aria-label="切换主题">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="topbar-btn" id="btnSettings" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="topbar-btn" id="btnAuth" title="登录">
        <svg class="auth-icon-login" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        <span class="auth-label" style="display:none">登录</span>
      </button>
    </div>
  </div>

  <!-- 右侧侧边栏（默认折叠，仅图标） -->
  <nav class="sidebar" id="sidebar">
    <!-- 展开/折叠切换按钮 -->
    <button class="sidebar-toggle" id="sidebarToggle" title="展开/折叠">
      <svg class="icon-collapse" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      <svg class="icon-expand" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <!-- 开始练习（首页） -->
    <button class="sidebar-item" id="navHome" title="开始练习">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span class="sidebar-label">开始练习</span>
    </button>
    <!-- 教材选择（仅移动端底部菜单显示） -->
    <button class="sidebar-item sidebar-book-mobile" id="navBookMobile" title="教材选择" style="display:none">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span class="sidebar-label">教材</span>
    </button>
    <!-- 计划任务 -->
    <button class="sidebar-item" id="navPlan" title="计划任务">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></svg>
      <span class="sidebar-label">计划任务</span>
    </button>
    <!-- 积分任务 -->
    <button class="sidebar-item" id="navTasks" title="积分任务">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
      <span class="sidebar-label">积分任务</span>
    </button>
    <!-- Trello 看板 -->
    <button class="sidebar-item" id="navBoard" title="学习看板">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="11" rx="1"/></svg>
      <span class="sidebar-label">学习看板</span>
    </button>
    <!-- 错题笔记 -->
    <button class="sidebar-item" id="navMistakes" title="错题笔记">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      <span class="sidebar-label">错题笔记</span>
    </button>
    <!-- 分隔线 -->
    <div class="sidebar-divider"></div>
    <!-- VIP 充值 -->
    <button class="sidebar-item sidebar-vip" id="navVip" title="VIP充值">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7l4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7l-7.5 7.5L12 12l-2.5 2.5L2 7z"/><path d="M2 7l10 10 10-10"/></svg>
      <span class="sidebar-label">VIP充值</span>
    </button>
  </nav>

  <div class="app">
    <!-- 单元课信息（card 外，左上角） -->
    <div class="source-tag" id="sourceTag"></div>
    <!-- 主练习卡片 -->
    <main id="card" class="card">
      <button class="card-theme-btn" id="btnCardTheme" title="练习框主题" style="display:none">🎨</button>
      <!-- 中文句子 + 朗读按钮 -->
      <div class="chinese-row">
        <div class="chinese" id="chinese">加载中…</div>
        <button class="btn icon speak-sentence" id="btnPlay" title="朗读全文" aria-label="朗读全文">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        </button>
      </div>

      <div class="inputs" id="inputs" aria-label="请按顺序输入英文单词"></div>
      <!-- 句式说明：默认文字显示 -->
      <div class="structure" id="structure"></div>
      <!-- 语法详解：言简意赅指出语法、考试变种题等注意事项 -->
      <div class="grammar-notes" id="grammarNotes"></div>

      <div class="submit-row">
        <button class="btn hint-btn" id="btnHint" title="按住显示提示" aria-label="按住显示提示">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span>提示</span>
        </button>
        <button class="btn primary" id="btnNext" disabled>下一题 →</button>
      </div>
    </main>

    <!-- 结算 -->
    <section id="finish" class="card finish">
      <h2><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> 今日计划完成！</h2>
      <p id="finishText">你已经完成了今日计划的 30 道题。</p>
      <div id="finishStats" style="display:flex;gap:12px;justify-content:center;margin:12px 0;flex-wrap:wrap"></div>
      <div style="display:flex;gap:10px;justify-content:center">
        <button class="btn ghost" id="btnContinue">继续学习</button>
        <button class="btn primary" id="btnRestart">再来一轮</button>
      </div>
    </section>
  </div>

  <!-- 手机号登录弹窗 -->
  <div class="modal-mask" id="loginMask" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <div class="modal phone-login">
      <button class="login-close" id="loginClose" aria-label="关闭">×</button>
      <div class="login-header">
        <div class="login-logo">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
        </div>
      </div>
      <!-- 登录表单区 -->
      <div class="login-form-area" id="loginFormArea">
        <div class="form-item">
          <div class="input-wrap">
            <span class="input-prefix">+86</span>
            <input type="tel" id="phoneInput" class="form-input" placeholder="请输入手机号" maxlength="11" inputmode="numeric" />
          </div>
          <div class="form-error" id="phoneError"></div>
        </div>
        <div class="form-item">
          <div class="input-wrap code-wrap">
            <input type="text" id="codeInput" class="form-input" placeholder="请输入验证码" maxlength="6" inputmode="numeric" />
            <button type="button" class="btn code-btn" id="btnSendCode">获取验证码</button>
          </div>
          <div class="form-error" id="codeError"></div>
        </div>
      </div>
      <!-- 登录成功（隐藏表单区） -->
      <div class="login-success" id="loginSuccess">
        <div class="success-icon">✓</div>
        <div class="success-text">登录成功</div>
        <div class="success-user" id="successUser"></div>
      </div>
      <div class="login-foot">
        <button class="btn primary phone-btn" id="btnLoginSubmit">登录 / 注册</button>
      </div>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div class="modal-mask" id="modalMask" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <h3 id="modalTitle"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:6px"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> 设置</h3>
      <div class="sub">自定义提示方式、英文字号、朗读等行为。</div>

      <div class="opt-group" id="optGroup">
        <label class="opt" data-value="first">
          <input type="radio" name="hintMode" value="first" />
          <div>
            <div class="opt-title">首字母提示</div>
            <div class="opt-desc">按住 \ 键显示当前单词的首字母 + 长度，例如：<code>C·6</code>。</div>
          </div>
        </label>
        <label class="opt" data-value="full">
          <input type="radio" name="hintMode" value="full" checked />
          <div>
            <div class="opt-title">完整单词提示（默认）</div>
            <div class="opt-desc">按住 \ 键直接显示当前单词的完整答案。</div>
          </div>
        </label>
        <label class="opt" data-value="off">
          <input type="radio" name="hintMode" value="off" />
          <div>
            <div class="opt-title">关闭提示</div>
            <div class="opt-desc">按住 \ 键不显示任何提示（适合完全自测）。</div>
          </div>
        </label>
      </div>

      <div class="setting-row">
        <div class="setting-label">英文字号 <span id="fontSizeVal">34</span> px</div>
        <input type="range" id="fontSizeRange" min="14" max="36" step="1" value="34" />
        <div class="setting-presets">
          <button type="button" class="chip" data-fs="16">小</button>
          <button type="button" class="chip" data-fs="22">中（默认）</button>
          <button type="button" class="chip" data-fs="28">大</button>
          <button type="button" class="chip" data-fs="34">超大</button>
        </div>
      </div>

      <div class="setting-row">
        <div class="setting-label">每日目标句数 <span id="dailyGoalVal">50</span></div>
        <input type="range" id="dailyGoalRange" min="10" max="100" step="5" value="50" />
        <div class="setting-presets">
          <button type="button" class="chip" data-dg="10">10</button>
          <button type="button" class="chip" data-dg="20">20</button>
          <button type="button" class="chip" data-dg="30">30</button>
          <button type="button" class="chip" data-dg="50">50</button>
          <button type="button" class="chip" data-dg="100">100</button>
        </div>
      </div>

  <div class="modal-mask" id="downloadMask" role="dialog" aria-modal="true" style="display:none">
    <div class="modal download-overlay" id="downloadModal">
      <div class="dl-title">正在下载题库</div>
      <div class="dl-sub" id="dlSub"></div>
      <div class="dl-bar"><i id="dlFill" style="width:0%"></i></div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // 首帧渲染完成后移除 preload，恢复动画
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.documentElement.classList.remove("preload");
    }));
    /* ======================================================================
     * L0 · 核心工具层 utils
     * FNV-1a 哈希、日期计算、debounce、事件总线 bus
     * ===================================================================== */
    const utils = {
      fnv1aHex(str) {
        let h = 0x811c9dc5;
        for (let i = 0; i < str.length; i++) {
          h ^= str.charCodeAt(i);
          h = Math.imul(h, 0x01000193);
        }
        return (h >>> 0).toString(16).padStart(8, "0");
      },
      todayStr(d) {
        const dt = d ? new Date(d) : new Date();
        const y = dt.getFullYear();
        const m = String(dt.getMonth() + 1).padStart(2, "0");
        const day = String(dt.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      },
      daysBetween(a, b) {
        const da = new Date(utils.todayStr(a) + "T00:00:00");
        const db = new Date(utils.todayStr(b) + "T00:00:00");
        return Math.round((db - da) / 864e5);
      },
      clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); },
      debounce(fn, ms) {
        let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
      },
      fmtDate(ts) {
        const d = new Date(ts);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      },
      fmtRemain(ms) {
        const days = Math.ceil(ms / 864e5);
        if (days > 30) return `${Math.ceil(days / 30)} 个月`;
        if (days > 0) return `${days} 天`;
        const hrs = Math.ceil(ms / 36e5);
        return `${hrs} 小时`;
      },
    };

    // 极简事件总线
    const bus = {
      _h: {},
      on(evt, fn) { (this._h[evt] = this._h[evt] || []).push(fn); return this; },
      off(evt, fn) {
        if (this._h[evt]) this._h[evt] = this._h[evt].filter(f => f !== fn);
        return this;
      },
      emit(evt, data) {
        (this._h[evt] || []).forEach(fn => { try { fn(data); } catch (e) { console.warn("[bus]", evt, e); } });
        return this;
      },
    };

    // Toast 提示
    let _toastTimer = null;
    function toast(msg, ms) {
      const t = document.getElementById("toast");
      if (!t) return;
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => t.classList.remove("show"), ms || 2200);
    }

    /* ========== 全屏礼花特效 ========== */
    function showConfetti() {
      const canvas = document.getElementById("confettiCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      canvas.style.display = "block";
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ["#ff6b6b", "#feca57", "#48dbfb", "#ff9ff3", "#54a0ff", "#5f27cd", "#00d2d3", "#1dd1a1"];
      const particles = [];
      const count = 120;

      for (let i = 0; i < count; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2 + 50,
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 1.2) * 14 - 2,
          size: Math.random() * 6 + 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          decay: Math.random() * 0.015 + 0.008,
          gravity: 0.25,
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 10,
        });
      }

      let animId;
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let alive = 0;
        particles.forEach(p => {
          if (p.alpha <= 0) return;
          alive++;
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.alpha -= p.decay;
          p.rotation += p.rotationSpeed;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        });

        if (alive > 0) {
          animId = requestAnimationFrame(draw);
        } else {
          canvas.style.display = "none";
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      draw();
      // 3秒后强制停止
      setTimeout(() => {
        cancelAnimationFrame(animId);
        canvas.style.display = "none";
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }, 3500);

      window.addEventListener("resize", () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }, { once: true });
    }

    /* ======================================================================
     * L1 · FSRS v6 引擎层
     * 参数 w[21]、createEmptyCard、fsrs()、repeat()、next()、遗忘曲线
     * ===================================================================== */
    const FSRS = (function () {
      const DEFAULT_W = [
        0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001,
        1.8722, 0.1666, 0.796, 1.4835, 0.0614, 0.2629, 1.6483, 0.6014,
        1.8729, 0.5425, 0.0912, 0.0658, 0.1542
      ];
      const REQUEST_RETENTION = 0.9;
      const MAXIMUM_INTERVAL = 36500;
      const LEARNING_STEPS = [60, 600];       // 秒
      const RELEARNING_STEPS = [600];
      const Rating = { Again: 1, Hard: 2, Good: 3, Easy: 4 };
      const State = { New: 0, Learning: 1, Review: 2, Relearning: 3 };

      let w = [...DEFAULT_W];
      let factor = Math.pow(0.9, -1 / w[20]) - 1;

      function setW(newW) {
        if (!Array.isArray(newW) || newW.length !== 21) return false;
        w = [...newW];
        factor = Math.pow(REQUEST_RETENTION, -1 / w[20]) - 1;
        return true;
      }
      function getW() { return [...w]; }

      function forgettingCurve(elapsedDays, stability) {
        const s = Math.max(0.1, stability);
        const t = Math.max(0, elapsedDays);
        return Math.pow(1 + factor * t / s, -w[20]);
      }

      function initStability(r) { return Math.max(0.1, w[r - 1]); }
      function initDifficulty(r) { return utils.clamp(w[4] - Math.exp(w[5] * (r - 1)) + 1, 1, 10); }

      function nextDifficulty(d, r) {
        const nextD = d + (-w[6] * (r - 3)) * (10 - d) / 9;
        const meanD = w[7] * initDifficulty(4) + (1 - w[7]) * nextD;
        return utils.clamp(meanD, 1, 10);
      }

      function nextStabilityAfterRecall(d, s, r) {
        const hardPenalty = r === Rating.Hard ? w[15] : 1;
        const easyBonus = r === Rating.Easy ? w[16] : 1;
        const val = s * (Math.exp(w[8] * (11 - d)) * Math.pow(s, -w[9]) *
          (Math.exp(w[10] * (1 - r)) - 1) * hardPenalty * easyBonus + 1);
        return Math.max(0.1, isFinite(val) ? val : s);
      }

      function nextStabilityAfterForget(d, s, r) {
        const val = w[11] * Math.pow(d, -w[12]) * (Math.pow(s + 1, w[13]) - 1) * Math.exp(w[14] * (1 - r));
        return Math.max(0.1, isFinite(val) ? val : 0.1);
      }

      function nextStabilitySameDay(s, r) {
        const inc = Math.exp(w[17] * (r - 3 + w[18])) * Math.pow(s, -w[19]);
        return s * Math.max(inc, 1);
      }

      function nextInterval(s, r) {
        const ivl = s * (Math.pow(r, -1 / w[20]) - 1) / factor;
        return utils.clamp(Math.round(isFinite(ivl) ? ivl : 1), 1, MAXIMUM_INTERVAL);
      }

      function createEmptyCard(now) {
        const ts = now || Date.now();
        return {
          due: ts, stability: 0, difficulty: 0,
          elapsed_days: 0, scheduled_days: 0,
          reps: 0, lapses: 0, state: State.New,
          last_review: null, created_at: ts, updated_at: ts,
        };
      }

      // 核心：根据评级推进卡片状态
      function next(card, now, rating) {
        now = now || Date.now();
        const c = { ...card };
        const sameDay = c.last_review && utils.todayStr(c.last_review) === utils.todayStr(now);
        const elapsedDays = sameDay ? 0 : Math.max(0, utils.daysBetween(c.last_review || now, now));

        let newState = c.state;
        let newStability = c.stability;
        let newDifficulty = c.difficulty;
        let newInterval = 0;

        if (c.state === State.New) {
          // 新卡：用初始公式
          c.reps = 1;
          newStability = initStability(rating);
          newDifficulty = initDifficulty(rating);
          if (rating === Rating.Again) {
            newState = State.Learning;
            newInterval = 0; // 走 steps
          } else if (rating === Rating.Hard) {
            newState = State.Learning;
            newInterval = 0;
          } else {
            newState = State.Review;
            newInterval = nextInterval(newStability, REQUEST_RETENTION);
          }
        } else if (c.state === State.Learning || c.state === State.Relearning) {
          const steps = c.state === State.Learning ? LEARNING_STEPS : RELEARNING_STEPS;
          if (rating === Rating.Again) {
            newInterval = 0;
            c.step = 0;
          } else if (rating === Rating.Hard) {
            newInterval = 0;
            c.step = Math.min((c.step || 0) + 1, steps.length - 1);
          } else if (rating === Rating.Good) {
            if ((c.step || 0) >= steps.length - 1) {
              newState = State.Review;
              newStability = sameDay ? nextStabilitySameDay(c.stability, rating) : nextStabilityAfterRecall(c.difficulty, c.stability, REQUEST_RETENTION);
              newInterval = nextInterval(newStability, REQUEST_RETENTION);
            } else {
              c.step = (c.step || 0) + 1;
              newInterval = 0;
            }
          } else { // Easy
            newState = State.Review;
            newStability = sameDay ? nextStabilitySameDay(c.stability, rating) : nextStabilityAfterRecall(c.difficulty, c.stability, REQUEST_RETENTION);
            newDifficulty = nextDifficulty(c.difficulty, rating);
            newInterval = nextInterval(newStability, REQUEST_RETENTION);
          }
        } else { // Review
          newDifficulty = nextDifficulty(c.difficulty, rating);
          if (rating === Rating.Again) {
            newState = State.Relearning;
            newStability = nextStabilityAfterForget(newDifficulty, c.stability, REQUEST_RETENTION);
            c.lapses = (c.lapses || 0) + 1;
            newInterval = 0;
            c.step = 0;
          } else {
            if (sameDay) {
              newStability = nextStabilitySameDay(c.stability, rating);
            } else {
              newStability = nextStabilityAfterRecall(newDifficulty, c.stability, REQUEST_RETENTION);
            }
            newInterval = nextInterval(newStability, REQUEST_RETENTION);
          }
        }

        c.elapsed_days = elapsedDays;
        c.scheduled_days = newInterval;
        c.stability = newStability;
        c.difficulty = newDifficulty;
        c.state = newState;
        c.last_review = now;
        c.reps = (c.reps || 0) + (rating !== Rating.Again ? 1 : 0);
        c.due = newInterval === 0
          ? now + (c.state === State.Learning ? LEARNING_STEPS[c.step || 0] : c.state === State.Relearning ? RELEARNING_STEPS[0] : 60) * 1000
          : now + newInterval * 864e5;
        c.updated_at = now;

        const log = {
          rating, state: c.state,
          stability: c.stability, difficulty: c.difficulty,
          due: c.due, elapsed_days: elapsedDays,
          reviewed_at: now,
        };
        return { card: c, log };
      }

      return {
        DEFAULT_W, REQUEST_RETENTION, MAXIMUM_INTERVAL,
        Rating, State, setW, getW,
        forgettingCurve, createEmptyCard, next,
        getFactor: () => factor,
      };
    })();

    /* ======================================================================
     * L2 · 存储层 Storage
     * IndexedDB 封装、内存缓存、localStorage 降级
     * ===================================================================== */
    const Storage = (function () {
      const DB_NAME = "EnglishLearningDB";
      const DB_VERSION = 1;
      const useIndexedDB = "indexedDB" in window;
      let db = null;

      const stores = ["cards", "logs", "stats", "meta", "questions", "sync_queue"];

      function openDB() {
        return new Promise((resolve, reject) => {
          if (!useIndexedDB) { resolve(null); return; }
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const d = e.target.result;
            if (!d.objectStoreNames.contains("cards")) {
              const s = d.createObjectStore("cards", { keyPath: "qid" });
              s.createIndex("by_state", "state", { unique: false });
              s.createIndex("by_due", "due", { unique: false });
              s.createIndex("by_textbook", "textbook", { unique: false });
            }
            if (!d.objectStoreNames.contains("logs")) {
              const s = d.createObjectStore("logs", { keyPath: "id", autoIncrement: true });
              s.createIndex("by_qid", "qid", { unique: false });
              s.createIndex("by_date", "reviewedAt", { unique: false });
            }
            if (!d.objectStoreNames.contains("stats")) {
              d.createObjectStore("stats", { keyPath: "date" });
            }
            if (!d.objectStoreNames.contains("meta")) {
              d.createObjectStore("meta", { keyPath: "key" });
            }
            if (!d.objectStoreNames.contains("questions")) {
              const s = d.createObjectStore("questions", { keyPath: "id" });
              s.createIndex("by_textbook", "textbook", { unique: false });
              s.createIndex("by_textbook_unit", ["textbook", "unit"], { unique: false });
              s.createIndex("by_difficulty", "difficulty", { unique: false });
            }
            if (!d.objectStoreNames.contains("sync_queue")) {
              d.createObjectStore("sync_queue", { keyPath: "id", autoIncrement: true });
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => { console.warn("[Storage] IndexedDB open failed, using localStorage fallback"); resolve(null); };
        });
      }

      function tx(storeName, mode) {
        return db.transaction(storeName, mode).objectStore(storeName);
      }

      function getAll(storeName) {
        return new Promise((resolve) => {
          if (!db) { resolve([]); return; }
          const req = tx(storeName, "readonly").getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
      }
      function get(storeName, key) {
        return new Promise((resolve) => {
          if (!db) { resolve(null); return; }
          const req = tx(storeName, "readonly").get(key);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      }
      function put(storeName, val) {
        return new Promise((resolve) => {
          if (!db) { resolve(); return; }
          const req = tx(storeName, "readwrite").put(val);
          req.onsuccess = () => resolve();
          req.onerror = () => resolve();
        });
      }
      function bulkPut(storeName, vals) {
        return new Promise((resolve) => {
          if (!db || !vals.length) { resolve(); return; }
          const s = tx(storeName, "readwrite");
          vals.forEach(v => s.put(v));
          s.transaction.oncomplete = () => resolve();
          s.transaction.onerror = () => resolve();
        });
      }
      function del(storeName, key) {
        return new Promise((resolve) => {
          if (!db) { resolve(); return; }
          const req = tx(storeName, "readwrite").delete(key);
          req.onsuccess = () => resolve();
          req.onerror = () => resolve();
        });
      }
      function clearStore(storeName) {
        return new Promise((resolve) => {
          if (!db) { resolve(); return; }
          const req = tx(storeName, "readwrite").clear();
          req.onsuccess = () => resolve();
          req.onerror = () => resolve();
        });
      }
      function count(storeName) {
        return new Promise((resolve) => {
          if (!db) { resolve(0); return; }
          const req = tx(storeName, "readonly").count();
          req.onsuccess = () => resolve(req.result || 0);
          req.onerror = () => resolve(0);
        });
      }
      function getByIndex(storeName, indexName, value) {
        return new Promise((resolve) => {
          if (!db) { resolve([]); return; }
          const idx = tx(storeName, "readonly").index(indexName);
          const req = idx.getAll(value);
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
      }

      // 内存缓存
      const Cache = {
        cards: new Map(),
        cardsLoaded: false,
        logs: [],
        async init() {
          if (!db) return;
          const all = await getAll("cards");
          all.forEach(c => this.cards.set(c.qid, c));
          this.cardsLoaded = true;
        },
        getCard(qid) { return this.cards.get(qid); },
        async upsertCard(card) {
          this.cards.set(card.qid, card);
          if (db) await put("cards", card);
          else {
            try {
              const all = JSON.parse(localStorage.getItem("en_fsrs_cards") || "{}");
              all[card.qid] = card;
              localStorage.setItem("en_fsrs_cards", JSON.stringify(all));
            } catch (e) {}
          }
        },
      };

      async function init() {
        db = await openDB();
        if (db) {
          await Cache.init();
          // 请求持久化存储
          if (navigator.storage && navigator.storage.persist) {
            navigator.storage.persist().catch(() => {});
          }
        }
