    })();

    /* ======================================================================
     * L3 · 卡片仓库层 CardStore
     * 卡片 CRUD、按 due 查询、按 state 分桶、统计
     * ===================================================================== */
    const CardStore = (function () {
      function makeQid(textbook, zh) { return textbook + "#" + utils.fnv1aHex(zh); }

      async function get(qid) {
        return Storage.Cache.getCard(qid) || await Storage.get("cards", qid);
      }

      async function getOrCreate(qid, textbook, zh, unit, lesson) {
        let card = Storage.Cache.getCard(qid);
        if (card) return card;
        card = await Storage.get("cards", qid);
        if (card) { Storage.Cache.cards.set(qid, card); return card; }
        const empty = FSRS.createEmptyCard();
        card = { qid, uid: "guest", textbook, zh, unit, lesson, ...empty };
        return card;
      }

      async function upsert(card) {
        card.updated_at = Date.now();
        await Storage.Cache.upsertCard(card);
      }

      async function dueCount() {
        const now = Date.now();
        let n = 0;
        Storage.Cache.cards.forEach(c => {
          if (c.state === FSRS.State.Review && c.due <= now) n++;
        });
        return n;
      }

      async function dueList() {
        const now = Date.now();
        const list = [];
        Storage.Cache.cards.forEach(c => {
          if ((c.state === FSRS.State.Review || c.state === FSRS.State.Learning || c.state === FSRS.State.Relearning) && c.due <= now) {
            list.push(c);
          }
        });
        return list.sort((a, b) => a.due - b.due);
      }

      function byState() {
        const buckets = { new: [], learning: [], review: [], mastered: [] };
        const now = Date.now();
        Storage.Cache.cards.forEach(c => {
          if (c.state === FSRS.State.New && c.reps === 0) buckets.new.push(c);
          else if (c.state === FSRS.State.Learning || c.state === FSRS.State.Relearning) buckets.learning.push(c);
          else if (c.state === FSRS.State.Review) {
            if (c.stability >= 30 && c.reps >= 3 && (c.lapses || 0) === 0) buckets.mastered.push(c);
            else if (c.due <= now) buckets.review.push(c);
            else buckets.review.push(c); // 也算 review 列（待复习）
          }
        });
        return buckets;
      }

      function stats() {
        const b = byState();
        return {
          total: b.new.length + b.learning.length + b.review.length + b.mastered.length,
          new: b.new.length,
          learning: b.learning.length,
          review: b.review.length,
          mastered: b.mastered.length,
        };
      }

      async function addLog(log) {
        const entry = { ...log, reviewedAt: log.reviewed_at || Date.now() };
        if (Storage.useIndexedDB()) {
          await Storage.put("logs", entry);
        }
        Storage.Cache.logs.push(entry);
        if (Storage.Cache.logs.length > 5000) Storage.Cache.logs.shift();
      }

      async function getRecentLogs(days) {
        if (Storage.useIndexedDB()) {
          const all = await Storage.getAll("logs");
          const cutoff = Date.now() - days * 864e5;
          return all.filter(l => l.reviewedAt >= cutoff);
        }
        return Storage.Cache.logs;
      }

      return { makeQid, get, getOrCreate, upsert, dueCount, dueList, byState, stats, addLog, getRecentLogs };
    })();

    /* ======================================================================
     * L3b · 单词错题笔记 MistakeStore

     * ===================================================================== */
    const MistakeStore = (function () {
      function makeQid(word, textbook) { return "mistake#" + word + "#" + textbook; }

      async function get(qid) {
        return Storage.Cache.getCard(qid) || await Storage.get("cards", qid);
      }

      async function getOrCreate(word, textbook, unit, lesson, sentenceZh) {

        if (card) return card;
        card = await Storage.get("cards", qid);
        if (card) { Storage.Cache.cards.set(qid, card); return card; }
        const empty = FSRS.createEmptyCard();
        card = { qid, uid: "guest", word, textbook, unit, lesson, sentenceZh, errorCount: 0, ...empty };
        return card;
      }

      async function upsert(card) {
        card.updated_at = Date.now();
        await Storage.Cache.upsertCard(card);
      }

      async function recordError(word, textbook, unit, lesson, sentenceZh) {
        const card = await getOrCreate(word, textbook, unit, lesson, sentenceZh);
        card.errorCount = (card.errorCount || 0) + 1;
        card.lastErrorAt = Date.now();
        if (!card.firstErrorAt) card.firstErrorAt = Date.now();
        await upsert(card);
        return card;
      }

      async function recordReview(word, textbook, rating) {
        const qid = makeQid(word, textbook);
        let card = await get(qid);
        if (!card) return null;
        const { card: newCard, log } = FSRS.next(card, Date.now(), rating);
        await upsert(newCard);
        await CardStore.addLog({ ...log, qid, uid: state.user?.phone || "guest", word });
        return newCard;
      }

      function list(textbook) {
        const list = [];
        Storage.Cache.cards.forEach(c => {
          if (c.qid && c.qid.startsWith("mistake#")) {
            if (!textbook || c.textbook === textbook) list.push(c);
          }
        });
        return list.sort((a, b) => (b.lastErrorAt || 0) - (a.lastErrorAt || 0));
      }

      function dueList(textbook) {
        const now = Date.now();
        const list = [];
        Storage.Cache.cards.forEach(c => {
          if (!c.qid || !c.qid.startsWith("mistake#")) return;
          if (textbook && c.textbook !== textbook) return;
          if (c.due <= now) list.push(c);
        });
        return list.sort((a, b) => a.due - b.due);
      }

      function stats(textbook) {
        const s = { total: 0, due: 0, new: 0, learning: 0, review: 0, mastered: 0 };
        const now = Date.now();
        Storage.Cache.cards.forEach(c => {
          if (!c.qid || !c.qid.startsWith("mistake#")) return;
          if (textbook && c.textbook !== textbook) return;
          s.total++;
          if (c.state === FSRS.State.New && c.reps === 0) s.new++;
          else if (c.state === FSRS.State.Learning || c.state === FSRS.State.Relearning) s.learning++;
          else if (c.state === FSRS.State.Review) {
            if (c.due <= now) s.review++;
            else if (c.stability >= 21 && c.reps >= 3 && (c.lapses || 0) === 0) s.mastered++;
            else s.review++;
          }
          if (c.due <= now) s.due++;
        });
        return s;
      }

      return { makeQid, get, getOrCreate, upsert, recordError, recordReview, list, dueList, stats };
    })();

    /* ======================================================================
     * L4c · VIP 会员层 Vip（离线存根版，无 PocketBase 时本地验签）
     * ===================================================================== */
    const Vip = (function () {
      const FREE_DAILY_LIMIT = 10;
      const PLAN_PRICES = { month: 1800, quarter: 4500, year: 12800 };
      const PLAN_DURATIONS = { month: 30, quarter: 90, year: 365 };
      const PLAN_NAMES = { month: "月卡", quarter: "季卡", year: "年卡" };

      // HMAC 密钥（混淆：拆字节数组运行时拼接）
      const _k = [118,105,112,95,115,101,99,114,101,116,95,107,101,121,95,50,48,50,54];
      function getKey() { return _k.map(b => String.fromCharCode(b)).join(""); }

      async function hmacSha256Hex(keyStr, msgStr) {
        try {
          const enc = new TextEncoder();
          const keyData = enc.encode(keyStr);
          const msgData = enc.encode(msgStr);
          const cryptoKey = await crypto.subtle.importKey("raw", keyData, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
          const sig = await crypto.subtle.sign("HMAC", cryptoKey, msgData);
          return Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2, "0")).join("");
        } catch (e) { return ""; }
      }

      async function generateToken(payload) {
        const payloadB64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
        const sig = await hmacSha256Hex(getKey(), payloadB64);
        return `${payloadB64}.${sig}`;
      }

      async function verifyToken(token) {
        if (!token) return null;
        const parts = token.split(".");
        if (parts.length !== 2) return null;
        const [payloadB64, sig] = parts;
        if (!payloadB64 || !sig) return null;
        const expectedSig = await hmacSha256Hex(getKey(), payloadB64);
        if (expectedSig !== sig) return null; // 签名不符 → 伪造
        try {
          const payload = JSON.parse(decodeURIComponent(escape(atob(payloadB64))));
          if (payload.expire_at < Date.now()) return null;
          return payload;

      }

      let _cachedValid = null;
      let _cacheTime = 0;

      // 同步版本：用缓存值（热路径用）
      function vipValidSync() {
        if (isVipPhone()) return true;
        return _cachedValid === true;
      }

      async function vipValid() {
        // 缓存 30 秒
        if (_cachedValid !== null && Date.now() - _cacheTime < 30000) return _cachedValid;
        // 白名单用户直接永久 VIP
        if (isVipPhone()) {
          _cachedValid = true;
          _cacheTime = Date.now();
          return true;
        }
        const token = localStorage.getItem("en_vip_token");
        const payload = await verifyToken(token);
        let valid = false;
        if (payload) {
          // 防时间回拨
          const lastCheck = parseInt(localStorage.getItem("en_vip_lastcheck") || "0");
          const now = Date.now();
          if (now < lastCheck - 864e5) { valid = false; }
          else {
            localStorage.setItem("en_vip_lastcheck", String(Math.max(now, lastCheck)));
            valid = payload.expire_at > now;
          }
        }
        _cachedValid = valid;
        _cacheTime = Date.now();
        return valid;
      }

      // 激活 VIP（本地存根：无服务端时直接生成签名 Token）
      async function activateLocal(plan) {
        const days = PLAN_DURATIONS[plan] || 30;
        const now = Date.now();
        // 续费叠加
        const existing = await verifyToken(localStorage.getItem("en_vip_token"));
        const base = (existing && existing.expire_at > now) ? existing.expire_at : now;
        const expireAt = base + days * 864e5;
        const payload = { uid: state.user?.phone || "guest", level: "vip", plan, expire_at: expireAt };
        const token = await generateToken(payload);
        localStorage.setItem("en_vip_token", token);
        _cachedValid = null;
        bus.emit("vip-updated", { level: "vip", plan, expire_at: expireAt });
        toast(`${PLAN_NAMES[plan]}开通成功！`);
        return { token, expire_at: expireAt };

        if (!token) return { level: "free", plan: null, expire_at: 0 };
        // 同步解析（仅用于 UI 显示，验签由 vipValid 异步完成）
        try {
          const payloadB64 = token.split(".")[0];

          return payload;
        } catch (e) { return { level: "free", plan: null, expire_at: 0 }; }

    // 异步加载某册教材的题库（带缓存，已加载则跳过）
    function loadBookBank(textbookId) {
      if (!textbookId) return Promise.resolve(false);
      if (_loadedBooks.has(textbookId)) return Promise.resolve(true);
      // 检查是否已通过其他方式注入
      if (QUESTION_BANK[textbookId] && QUESTION_BANK[textbookId].length > 0) {
        _loadedBooks.add(textbookId);
        return Promise.resolve(true);
      }
      const varName = "BANK_" + textbookId;
      // 如果 window 上已有（如预加载），直接取用
      if (window[varName]) {
        QUESTION_BANK[textbookId] = window[varName];
        _loadedBooks.add(textbookId);
        return loadMeanings(textbookId);
      }
      return new Promise((resolve) => {
        const scriptId = "book-loader-" + textbookId;
        const old = document.getElementById(scriptId);
        if (old) old.remove();
        const script = document.createElement("script");
        script.id = scriptId;
        // 添加时间戳参数避免 Android 浏览器缓存导致 onload 不触发
        script.src = "banks/" + textbookId + ".js?t=" + Date.now();
        // 10 秒超时：Android 上 script.onload 可能不触发
        let resolved = false;
        const timeoutId = setTimeout(() => {
          if (!resolved) {
            resolved = true;
            console.warn("[loadBookBank] 加载超时(10s):", textbookId);
            resolve(false);
          }
        }, 10000);
        script.onload = () => {
          if (resolved) return;
          const bank = window[varName];
          if (bank && Array.isArray(bank)) {
            QUESTION_BANK[textbookId] = bank;
            _loadedBooks.add(textbookId);
            loadMeanings(textbookId).finally(() => {
              if (!resolved) {
                resolved = true;
                clearTimeout(timeoutId);
                resolve(true);
              }
            });
          } else {
            if (!resolved) {
              resolved = true;
              clearTimeout(timeoutId);
              console.warn("[loadBookBank] 脚本已加载但变量未定义:", varName);
              resolve(false);
            }
          }
        };
        script.onerror = () => {
          if (!resolved) {
            resolved = true;
            clearTimeout(timeoutId);
            console.warn("[loadBookBank] 脚本加载失败:", textbookId);
            resolve(false);
          }
        };
        document.head.appendChild(script);
      });
    }

    /* ======================================================================
     * 每日学习队列构建器
     * 根据 FSRS 状态分配：待复习 → 学习中 → 新题，穿插错题
     * ===================================================================== */
    const DailyPlanner = {
      // 为每道题获取/创建 FSRS 卡片（异步）
      async ensureCards(questions, textbook) {
        const cards = [];
        for (const q of questions) {
          const qid = CardStore.makeQid(textbook, q.zh);
          const card = await CardStore.getOrCreate(qid, textbook, q.zh, q.unit, q.lesson);
          cards.push({ q, card });
        }
        return cards;
      },

      // 找到包含指定单词的题目（优先原句）
      findQuestionForWord(word, textbook, originalQuestions, preferredZh) {
        // 优先找原句
        if (preferredZh) {
          const exact = originalQuestions.find(q => q.zh === preferredZh);
          if (exact) return exact;
        }
        // 再找包含该单词的任意句子
        return originalQuestions.find(q => q.words.includes(word));
      },

      // 构建每日队列
      async buildQueue(textbook, originalQuestions, goal) {
        goal = goal || state.dailyGoal || 30;
        const now = Date.now();

        // 1. 确保所有题目都有 FSRS 卡片
        const qCards = await this.ensureCards(originalQuestions, textbook);

        // 2. 按状态分桶
        const reviewDue = [];
        const learningDue = [];
        const newCards = [];

        qCards.forEach(({ q, card }) => {
          if (card.state === FSRS.State.Review && card.due <= now) {
            reviewDue.push(q);
          } else if ((card.state === FSRS.State.Learning || card.state === FSRS.State.Relearning) && card.due <= now) {
            learningDue.push(q);
          } else if (card.state === FSRS.State.New || card.reps === 0) {
            newCards.push(q);
          }
        });

        // 3. 获取到期的错题
        const mistakeDue = MistakeStore.dueList(textbook);
        const mistakeQuestions = [];
        for (const m of mistakeDue) {
          const mq = this.findQuestionForWord(m.word, textbook, originalQuestions, m.sentenceZh);
          if (mq && !mistakeQuestions.find(x => x.zh === mq.zh)) {
            // 标记为错题复习
            mq._isMistakeReview = true;
            mq._mistakeWord = m.word;
            mistakeQuestions.push(mq);
          }
        }

        // 4. 构建队列（优先级：复习 > 错题 > 学习中 > 新题）
        let queue = [];
        const used = new Set();

        function addUnique(list) {
          for (const q of list) {
            if (!used.has(q.zh)) {
              queue.push(q);
              used.add(q.zh);
            }
          }
        }

        addUnique(reviewDue);
        addUnique(mistakeQuestions);
        addUnique(learningDue);

        // 新题按单元+课的原始顺序排列（不打乱），保证学习连贯性
        const remaining = goal - queue.length;
        if (remaining > 0) {
          addUnique(newCards.slice(0, remaining));
        }

        return queue;
      },

      // 获取状态统计
      async getStats(textbook, originalQuestions) {
        const now = Date.now();
        let review = 0, learning = 0, newCount = 0;
        for (const q of originalQuestions) {
          const qid = CardStore.makeQid(textbook, q.zh);
          const card = await CardStore.getOrCreate(qid, textbook, q.zh, q.unit, q.lesson);
          if (card.state === FSRS.State.New || card.reps === 0) {
            newCount++;
          } else if (card.state === FSRS.State.Learning || card.state === FSRS.State.Relearning) {
            learning++;
          } else if (card.state === FSRS.State.Review) {
            if (card.stability >= 30 && card.reps >= 3 && (card.lapses || 0) === 0) {
              // 已掌握：与学习看板保持一致，不计入今日队列
            } else if (card.reps < 3 || card.stability < 14) {
              learning++;
            } else {
              review++;
            }
          }
        }
        const mistakeDueCount = MistakeStore.dueList(textbook).length;
        return {
          review,
          learning,
          new: newCount,
          mistake: mistakeDueCount,
          total: originalQuestions.length,
        };
      }

        _audioCtxUnlocked = true;
      } catch (e) {}
    }

    // === 音频播放权限解锁（移动端关键）===
    // 浏览器要求：必须在用户交互（click/touch）的同步调用栈中首次 play()
    // 因此 unlockAudio 必须是同步的，不能包在 Promise 里
    let _audioUnlocked = false;
    function unlockAudio() {
      if (_audioUnlocked) return;
      try {
        _ttsAudio.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
        _ttsAudio.play().catch(() => {});
        _audioUnlocked = true;
      } catch (e) {}
    }
    // 用户交互标志 — 用于判断是否可以自动播放（Chrome 自动播放策略）
    let _userInteracted = false;

    // 全局监听用户交互来解锁（once: true 避免重复触发警告）
    function _onUserInteraction() {
      _userInteracted = true;
      unlockAudio();
      ensureAudioCtx();
      // 同时解锁 speechSynthesis（Chrome 可能要求用户交互后才能播放）
      if (window.speechSynthesis) {
        try {
          if (window.speechSynthesis.suspended) {
            window.speechSynthesis.resume();
          }
        } catch (e) {}
      }
    }
    ['touchstart','touchend','click','keydown'].forEach(evt => {
      document.addEventListener(evt, _onUserInteraction, { once: true, passive: true });
    });

    // === TTS 引擎选择 ===
    let voices = [];
    function loadVoices() {
      if (window.speechSynthesis) {
        voices = window.speechSynthesis.getVoices() || [];
      }
    }
    if (window.speechSynthesis) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }
    function pickEnglishVoice() {
      if (!voices.length) return null;
      return voices.find(v => /en-(US|GB)/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang)) || null;
    }
    // === 播放语音 ===
    function speak(text, opts = {}) {
      // 同步解锁（必须在用户交互的同步调用栈中）
      unlockAudio();
      // 解锁 speechSynthesis（Chrome 自动播放策略）
      if (window.speechSynthesis) {
        try {
          if (window.speechSynthesis.suspended) {
            window.speechSynthesis.resume();
          }
        } catch (e) {}
      }
      _doSpeak(text, opts);
    }

    function _doSpeak(text, opts) {
      // 平台策略：
      // - iOS/PC：只用原生 speechSynthesis，失败后有道兜底（不走火山引擎，避免浪费 token）
      // - 安卓：直接走火山引擎 TTS，无延迟（跳过 native speechSynthesis）
      if (_isAndroid) {
        _speakTTS(text, opts);
      } else if (window.speechSynthesis) {
        _speakNativeWithFallback(text, opts);
      } else {
        _tryDirectSrc(text, opts);
      }
    }

    // 原生 speechSynthesis + 兜底切换
    // 安卓优化：记忆 native 引擎是否可用，连续失败 2 次后永久跳过，避免每次浪费 1 秒
    let _nativeFailCount = 0;
    const _NATIVE_MAX_FAIL = 2; // 连续失败次数阈值
    let _nativeDisabled = false; // 一旦禁用不再尝试

    function _speakNativeWithFallback(text, opts) {
      // 安卓上若 native 已被标记不可用，直接走音频源
      if (_isAndroid && _nativeDisabled) {
        _speakTTS(text, opts);
        return;
      }

      let fallbackTimer = null;
      let hasSpoken = false;
      const ss = window.speechSynthesis;

      function cleanup() {
        if (fallbackTimer) clearTimeout(fallbackTimer);
      }

      function markNativeFailed() {
        cleanup();
        if (_isAndroid) {
          _nativeFailCount++;
          if (_nativeFailCount >= _NATIVE_MAX_FAIL) {
            _nativeDisabled = true;
            console.log("[TTS] 安卓 native 连续失败 " + _NATIVE_MAX_FAIL + " 次，永久跳过");
          }
        }
      }

      const u = new SpeechSynthesisUtterance(text);
      const v = pickEnglishVoice();
      if (v) u.voice = v;
      u.lang = (v && v.lang) || "en-US";
      u.rate = opts.rate ?? 0.95;
      u.pitch = opts.pitch ?? 1;
      u.volume = opts.volume ?? 1;

      u.onstart = () => {
        hasSpoken = true;
        cleanup();
        // native 成功发声，重置失败计数
        if (_isAndroid) _nativeFailCount = 0;
      };
      u.onend = () => { cleanup(); };
      u.onerror = (e) => {
        // interrupted = 被 ss.cancel() 主动打断，不是错误，忽略
        if (e.error === "interrupted" || e.error === "canceled") {
          cleanup();
          return;
        }
        console.warn("[TTS] native error:", e.error);
        markNativeFailed();
        if (!hasSpoken) {
          if (_isAndroid) {
            console.log("[TTS] 安卓原生失败，切换火山引擎");
            _speakTTS(text, opts);
          } else {
            console.log("[TTS] 非安卓原生失败，切换有道兜底");
            _tryDirectSrc(text, opts);
          }
        }
      };

      if (ss.speaking || ss.pending) ss.cancel();
      ss.speak(u);

      // 安卓上 300ms 检测（原 1s 太慢），桌面保持 1s
      const fbDelay = _isAndroid ? 300 : 1000;
      fallbackTimer = setTimeout(() => {
        if (!hasSpoken) {
          if (_isAndroid) {
            console.log("[TTS] 安卓 native " + fbDelay + "ms 未发声，切换火山引擎");
            markNativeFailed();
            ss.cancel();
            _speakTTS(text, opts);
          } else {
            console.log("[TTS] 非安卓 native 1s 未发声，切换有道兜底");
            ss.cancel();
            _tryDirectSrc(text, opts);
          }
        }
      }, fbDelay);
    }

    // 火山引擎 TTS 代理（本地服务器中转，保护 Access Token）
    // 代理地址: http://<本机IP>:5000/tts?text=xxx
    const TTS_PROXY_PORT = 5000;
    function _getTTSProxyUrl() {
      // 使用当前页面host，确保局域网和本机都能访问
      return "http://" + window.location.hostname + ":" + TTS_PROXY_PORT + "/tts?text=";
    }

    // 本地 TTS 代理健康状态
    let _ttsProxyFailCount = 0;
    const _TTS_PROXY_MAX_FAIL = 2;
    let _ttsProxyUnavailable = false;

    function _speakTTS(text, opts) {
      console.log("[TTS] 火山引擎:", text.slice(0, 40));
      _ttsAudio.pause();
      _ttsAudio.currentTime = 0;

      // 若本地代理已被标记不可用，直接走有道（省掉 fetch 等待）
      if (_ttsProxyUnavailable) {
        console.log("[TTS] 本地代理已标记不可用，直接走有道");
        _tryDirectSrc(text, opts);
        return;
      }

      const proxyUrl = _getTTSProxyUrl() + encodeURIComponent(text);

      // fetch 5 秒超时，避免长时间挂起
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 5000);

      fetch(proxyUrl, { signal: controller.signal })
        .then(r => {
          clearTimeout(timeoutId);
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.blob();
        })
        .then(blob => {
          if (_ttsAudio._lastBlobUrl) URL.revokeObjectURL(_ttsAudio._lastBlobUrl);
          const blobUrl = URL.createObjectURL(blob);
          _ttsAudio._lastBlobUrl = blobUrl;
          _ttsAudio.src = blobUrl;
          _ttsAudio.volume = opts.volume ?? 1;
          console.log("[TTS] 火山引擎 blob 播放");
          // 成功时重置失败计数
          _ttsProxyFailCount = 0;
          _ttsAudio.play().catch(err => {
            console.warn("[TTS] 火山 play 失败:", err?.name, "→ 有道兜底");
            _tryDirectSrc(text, opts);
          });
        })
        .catch(err => {
          clearTimeout(timeoutId);
          console.warn("[TTS] 火山代理失败:", err?.message, "→ 有道兜底");
          _ttsProxyFailCount++;
          if (_ttsProxyFailCount >= _TTS_PROXY_MAX_FAIL) {
            _ttsProxyUnavailable = true;
            console.log("[TTS] 本地代理连续失败 " + _TTS_PROXY_MAX_FAIL + " 次，标记为不可用");
          }
          _tryDirectSrc(text, opts);
        });
    }

    // 有道 TTS 兜底（代理不可用时）
    function _tryDirectSrc(text, opts) {
      const youdaoUrl = "https://dict.youdao.com/dictvoice?audio=" + encodeURIComponent(text) + "&type=2";
      _ttsAudio.src = youdaoUrl;
      _ttsAudio.volume = opts.volume ?? 1;
      console.log("[TTS] 有道兜底:", youdaoUrl.slice(0, 50));
      _ttsAudio.play().catch(err => {
        console.warn("[TTS] 有道也失败:", err?.name);
        // 不再调用 beepBad() — TTS 播放失败不应触发输入错误提示音
      });
    }

    /* ========== 报警音 ========== */
    function beepBad() {
      try {
        ensureAudioCtx();
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        const ctx = audioCtx;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = "square";
        o.frequency.setValueAtTime(220, ctx.currentTime);
        o.frequency.linearRampToValueAtTime(160, ctx.currentTime + 0.18);
        g.gain.setValueAtTime(0.0001, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.22);
        o.connect(g).connect(ctx.destination);
        o.start();
        o.stop(ctx.currentTime + 0.24);
      } catch (e) {}
    }
    function beepOk() {
      try {
        ensureAudioCtx();
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        const ctx = audioCtx;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = "sine";
        o.frequency.setValueAtTime(660, ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.12);
        g.gain.setValueAtTime(0.0001, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.16);
        o.connect(g).connect(ctx.destination);
        o.start();
        o.stop(ctx.currentTime + 0.18);
      } catch (e) {}
    }
    // 大小写错误：单独的双音提示（中频+高频），与字母错误音区分
    function beepCase() {
      try {
        ensureAudioCtx();
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        const ctx = audioCtx;
        const t0 = ctx.currentTime;
        // 第一声
        const o1 = ctx.createOscillator();
        const g1 = ctx.createGain();
        o1.type = "triangle";
        o1.frequency.setValueAtTime(520, t0);
        g1.gain.setValueAtTime(0.0001, t0);
        g1.gain.exponentialRampToValueAtTime(0.2, t0 + 0.02);
        g1.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.12);
        o1.connect(g1).connect(ctx.destination);
        o1.start(t0);
        o1.stop(t0 + 0.14);
        // 第二声（高八度）— 提示"大小写"维度
        const o2 = ctx.createOscillator();
        const g2 = ctx.createGain();
        o2.type = "triangle";
        o2.frequency.setValueAtTime(780, t0 + 0.14);
        g2.gain.setValueAtTime(0.0001, t0 + 0.14);
        g2.gain.exponentialRampToValueAtTime(0.2, t0 + 0.16);
        g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.26);
        o2.connect(g2).connect(ctx.destination);
        o2.start(t0 + 0.14);
        o2.stop(t0 + 0.28);
      } catch (e) {}
    }

    /* ========== 题目渲染 ========== */
    let t0 = 0; // FSRS 作答计时起点
    let _answeredThisQuestion = false; // 防止重复提交
    function currentQuestion() { return QUESTIONS[state.idx]; }

    // 更新学习进度（进度条已移除，保留函数供调用）
    function updateProgress() {}

    function renderQuestion() {
      const q = currentQuestion();
      _answeredThisQuestion = false; // 重置防重复标志
      if (!q) {
        // 题库为空：显示空状态
        if (QUESTIONS.length === 0) {
          $chinese.textContent = "今日题库加载中或为空，请稍候或切换其他教材。";
        } else {
          $chinese.textContent = '已到达最后一题，点击"下一题"继续。';
        }
        $inputs.innerHTML = "";
        $inputs.classList.remove("show-analysis");
        $structure.classList.remove("show");
        $structure.textContent = "";
        const $gn = el("grammarNotes");
        $gn.classList.remove("show");
        $gn.innerHTML = "";
        const $btnNext = el("btnNext");
        $btnNext.classList.remove("pulse");
        $btnNext.disabled = true;
        $sourceTag.textContent = "";
        updateProgress();
        return;
      }
      $chinese.textContent = q.zh;
      // 显示教材来源 + 单元课信息 + 进度
      {
        const tbName = TEXTBOOK_MAP[state.textbook] || "";
        const ulName = (q.unit != null && q.lesson != null) ? `第${q.unit}单元 · 第${q.lesson}课` : "";
        const progress = `第 ${state.idx + 1}/${QUESTIONS.length} 题`;
        $sourceTag.textContent = [tbName, ulName, progress].filter(Boolean).join(" · ");
      }
      updateProgress();
      // FSRS 作答计时起点
      t0 = Date.now();
      bus.emit("render", { qid: CardStore.makeQid(state.textbook, q.zh) });
      // 先清除语法详解，答题后再显示
      const $gn0 = el("grammarNotes");
      $gn0.classList.remove("show");
      $gn0.innerHTML = "";

      $inputs.innerHTML = "";
      q.words.forEach((w, i) => {
        const isPunct = (q.tags[i] === "punct");
        // 标点符号不再渲染为输入框
        if (isPunct) return;
        const cell = document.createElement("div");
        cell.className = "word-cell";
        cell.dataset.index = i;
        // 同时保存标准答案（含大小写）和小写形式（用于宽松比较）
        cell.dataset.answer = w;
        cell.dataset.answerLc = w.toLowerCase();
        cell.dataset.phonetic = (q.phonetics && q.phonetics[i]) || "";
        // 根据单词长度设置 CSS 变量，控制输入框宽度
        const charCount = Math.max(1, w.length);
        cell.style.setProperty("--cell-chars", charCount);

        if (isPunct) {
          cell.classList.add("correct", "punct");
          cell.innerHTML = `<input disabled value="${w}" style="width:${Math.max(20, charCount * 12 + 8)}px;color:var(--muted);border:0;background:transparent;font-size:var(--en-font-size)" />`;
        } else {
          // 完整单词提示模式时字号略小，便于放下完整单词
          const wideClass = state.hintMode === "full" ? "wide" : "";
          cell.innerHTML = `
            <input type="text" class="${wideClass}" autocomplete="off" autocapitalize="off" spellcheck="false"
              autocorrect="off" inputmode="latin" lang="en"
              data-index="${i}" placeholder=" " />
            <span class="case-marker" title="大小写不正确">Aa</span>
            <span class="hint" data-hint="${i}"></span>
            <span class="cell-grammar" data-grammar="${i}"></span>
          `;
        }
        $inputs.appendChild(cell);
      });
      // 预加载当前题目各单词的中文释义
      preloadMeanings(q);

      $inputs.classList.remove("show-analysis");
      $structure.classList.remove("show");
      $structure.textContent = "";
      // 新题目：禁用"下一题"按钮并清除 pulse 高亮
      const $btnNext = el("btnNext");
      $btnNext.classList.remove("pulse");
      $btnNext.disabled = true;

      const first = $inputs.querySelector('input:not([disabled])');
      if (first) first.focus();
    }

    /* ========== 输入校验（严格大小写） ========== */
    function normalize(s) {
      return s.toLowerCase().replace(/[^a-z0-9']/g, "");
    }

    // 比较"已输入部分"与答案前缀是否一致（字母顺序层面）
    function prefixMatch(ans, val) {
      return ans.toLowerCase().startsWith(val.toLowerCase());
    }

    /**
     * 校验一个 word-cell 的当前输入，更新样式与状态：
     *   - 空输入：清除样式（灰色底线）
     *   - 前缀正确但未完成：typed（蓝色底线）
     *   - 完全匹配（含大小写）：correct（绿色底线），朗读两次并禁用
     *   - 字母顺序不对：wrong（红色底线）
     *   - 字母顺序对但大小写不对：case-error（橙色，带 Aa 标记）
     * 返回 true 表示当前状态有变化。
     */
    function checkCell(cell) {
      const input = cell.querySelector("input");
      if (!input || input.disabled) return false;
      const ans = cell.dataset.answer || "";
      const raw = input.value;
      const val = normalize(raw);
      const prev = cell.dataset.state || "";

      // 空输入 → 灰色底线（默认状态）
      if (!val) {
        cell.classList.remove("wrong", "case-error", "correct", "typed");
        cell.dataset.state = "";
        return prev !== "";
      }

      // 完全相等（含大小写）→ 绿色底线，朗读两次，禁用输入
      if (raw === ans) {
        cell.classList.remove("wrong", "case-error", "typed");
        cell.classList.add("correct");
        cell.dataset.state = "correct";
        // 拼写正确后朗读该单词两次
        speakWordTwice(ans);
        // 禁用输入框，防止修改已正确的单词
        input.disabled = true;
        // cell-meta 和 cell-grammar 延迟到整句完成后统一显示
        return prev !== "correct";
      }

      // 字母顺序不对（小写前缀不匹配）→ 红色底线
      if (!prefixMatch(ans, val)) {
        cell.classList.remove("case-error", "correct", "typed");
        cell.classList.add("wrong");
        cell.dataset.state = "wrong";
        cell.dataset.hadError = "1";
        return prev !== "wrong";
      }

      // 小写前缀匹配，但大小写不一致 → 红色底线
      if (!ans.startsWith(raw)) {
        cell.classList.remove("wrong", "correct", "typed");
        cell.classList.add("case-error");
        cell.dataset.state = "case-error";
        cell.dataset.hadCaseError = "1"; // 大小写错误单独标记，不计入错题笔记
        return prev !== "case-error";
      }

      // 前缀正确（含大小写）但未输入完成 → 蓝色底线
      cell.classList.remove("wrong", "case-error", "correct");
      cell.classList.add("typed");
      cell.dataset.state = "typed";
      return prev !== "typed";
    }

    /* 生成 word-cell 内联元信息行 HTML */
    function buildCellMeta(phonetic, word, meaning) {
      return `<div class="cell-meta">
        <span class="cell-phonetic">${phonetic}</span>
        <button class="cell-speak-btn" title="朗读 ${word}" aria-label="朗读 ${word}">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        </button>
        <span class="cell-meaning">${meaning}</span>
      </div>`;
    }
    /* 朗读单词两次，间隔 300ms（安卓上只朗读一遍，节约 token） */
    function speakWordTwice(word) {
      speak(word);
      if (!_isAndroid) {
        setTimeout(() => speak(word), 300);
      }
    }

    // 触发报警（按错误类型选择不同声音）
    function alertFor(cell) {
      const state = cell.dataset.state;
      if (state === "case-error") {
        beepCase();  // 单独的大小写报警音（短促中频）
      } else if (state === "wrong") {
        beepBad();
        flashBody();
      } else {
        beepOk();
      }
    }

    function allFilledCorrect() {
      const cells = $inputs.querySelectorAll(".word-cell");
      for (const c of cells) {
        // 标点 cell 无 input，跳过
        if (!c.querySelector("input")) continue;
        if (!c.classList.contains("correct")) return false;
      }
      return true;
    }

    function flashBody() {
      document.body.classList.remove("shake");
      void document.body.offsetWidth;
      document.body.classList.add("shake");
    }

    /* ========== 语法分析（直接在输入框下方显示） ========== */
    function revealAnalysis() {
      const q = currentQuestion();
      // 整句完成后统一显示 cell-grammar（语法标签）和 cell-meta（音标+朗读+释义）
      $inputs.classList.add("show-analysis");
      const inputCells = $inputs.querySelectorAll(".word-cell");
      inputCells.forEach((cell) => {
        const i = parseInt(cell.dataset.index, 10);
        const cls = q.tags[i] || "other";
        const isPunct = (cls === "punct");

        // 语法标签
        const gEl = cell.querySelector(".cell-grammar");
        if (gEl) {
          if (isPunct) {
            gEl.textContent = "";
            gEl.className = "cell-grammar punct";
          } else {
            const tagName = TAG_NAME[cls] || cls;
            gEl.textContent = tagName;
            gEl.className = `cell-grammar ${cls}`;
          }
        }

        // 音标+朗读+释义（未插入过才插入）
        if (!cell.querySelector(".cell-meta")) {
          const w = q.words[i];
          const phonetic = (q.phonetics && q.phonetics[i]) || "";
          const meaning = cell.dataset.meaning || "";
          cell.insertAdjacentHTML("beforeend", buildCellMeta(phonetic, w, meaning));

        if (m) {
          _meaningCache[word] = m;
          return m;
        }
      }
      // 再查本地映射表（高频词）
      if (_WORD_MAP[lc]) {
        _meaningCache[word] = _WORD_MAP[lc];
        return _WORD_MAP[lc];
      }
      try {
        const res = await fetch(
          `https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|zh-CN`
        );
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const text = data.responseData?.translatedText || "";
        const meaning = (text && text.toLowerCase() !== lc) ? text : "";
        _meaningCache[word] = meaning;
        return meaning;
      } catch (e) {
        _meaningCache[word] = "";
        return "";
      }
    }

    function applyShiftHint() {
      const show = state.hintDown && state.hintMode !== "off";
      const cells = $inputs.querySelectorAll(".word-cell");
      cells.forEach(c => {
        const hint = c.querySelector(".hint");
        if (!hint) return;
        hint.classList.remove("show");
      });
      if (!show) return;
      // 只在当前焦点输入框所在的 word-cell 上显示
      let cell = null;
      const ae = document.activeElement;
      if (ae && ae instanceof HTMLInputElement && !ae.disabled) {
        cell = ae.closest(".word-cell");
      }
      // Android 上触摸提示按钮可能导致焦点丢失，回退使用 _lastFocusedCell
      if (!cell) cell = _lastFocusedCell;
      if (!cell) return;
      const hint = cell.querySelector(".hint");
      if (!hint) return;
      const ans = cell.dataset.answer || "";
      if (!ans) return;
      const meaning = cell.dataset.meaning || "";
      const meaningHtml = meaning ? `<span class="hint-zh">${meaning}</span>` : "";
      if (state.hintMode === "first") {
        // 首字母 + 长度，使用真实大小写（如 "I·1"、"S·3"）
        const first = ans[0] || "?";
        const tail = ans.length > 1 ? `·${ans.length}` : "";
        hint.innerHTML = `${first}${tail}${meaningHtml}`;
      } else if (state.hintMode === "full") {
        // 完整单词提示：使用真实大小写（"She"、"coffee"、"Every"）
        hint.innerHTML = `${ans}${meaningHtml}`;
        // 完整单词提示时把输入框加宽
        const input = cell.querySelector("input");
        if (input) input.classList.add("wide");
      }
      hint.classList.add("show");
    }

     * 从源头上切断中文候选框的输入。
     *
     * 特别处理：拦截所有输入法切换快捷键
     *   - Shift 单独按下（Windows 中文 IME 默认切换键）
     *   - Ctrl+Space（中英文切换）
     *   - Ctrl+Shift（输入法切换）
     *   - Win+Space / Meta+Space（系统输入法切换）
     *   - Alt+Shift（部分系统输入法切换）
     * 对这些组合 preventDefault 阻止系统切换 IME，
     * 但不 stopPropagation，让 Shift 提示功能仍能正常工作。
     */
    $inputs.addEventListener("keydown", (e) => {
      const t = e.target;
      if (!(t instanceof HTMLInputElement) || t.disabled) return;

      // 情况 1：IME 正在合成中（拼音候选框已弹出）
      if (e.isComposing === true || e.keyCode === 229) {
        e.preventDefault();
        imeState.lastInputWasIme = true;
        if (isAndroid) {
          // Android 上键盘所有按键都经过此路径，不触发报警音，不阻止事件传播
          // 让 \ 键能到达 document 监听器触发提示
          // 不 stopPropagation，允许事件冒泡到 document
        } else {
          // 桌面端：阻止事件传播 + 弹出 IME 警告
          e.stopPropagation();
          const cell = t.closest(".word-cell");
          if (cell) {
            showImeWarn(cell, `🈲 输入法仍处于中文模式，已拦截。请将系统输入法切换为英文。`);
          }
        }
        return;
      }

      // 情况 2：key 是 "Process" 说明被 IME 拦截
      if (e.key === "Process" || e.key === "Unidentified") {
        if (!e.ctrlKey && !e.altKey && !e.metaKey) {
          e.preventDefault();
          return;
        }
      }

      // 情况 3：拦截输入法切换快捷键（仅 preventDefault，不 stopPropagation）
      // Shift 单独按下：Windows 中文 IME 默认用 Shift 切换中英文
      if (e.key === "Shift" && !e.ctrlKey && !e.altKey && !e.metaKey) {
        // 阻止系统切换输入法，但让事件继续传播给 document 的 Shift 提示监听器
        e.preventDefault();
        return; // 不阻止传播，document keydown 会收到并触发 applyShiftHint
      }
      // Ctrl+Space：中英文切换（Windows / macOS 都常用）
      if (e.key === " " && e.ctrlKey && !e.altKey && !e.metaKey) {
        e.preventDefault();
        return;
      }
      // Ctrl+Shift / Shift+Ctrl：切换输入法（顺序切换）
      if ((e.key === "Shift" && e.ctrlKey) || (e.key === "Control" && e.shiftKey)) {
        e.preventDefault();
        return;
      }
      // Alt+Shift / Shift+Alt：部分系统输入法切换
      if ((e.key === "Shift" && e.altKey) || (e.key === "Alt" && e.shiftKey)) {
        e.preventDefault();
        return;
      }
      // Meta+Space / Win+Space：Windows 系统输入法切换
      if (e.key === " " && e.metaKey) {
        e.preventDefault();
        return;
      }
      // Meta+Shift / Shift+Meta：macOS 输入法切换
      if ((e.key === "Shift" && e.metaKey) || (e.key === "Meta" && e.shiftKey)) {
        e.preventDefault();
        return;
      }
      // CapsLock：部分输入法用 CapsLock 切换中英文
      if (e.key === "CapsLock") {
        e.preventDefault();
        return;
      }

      // 情况 4：允许的可打印字符
      // 只放行 a-zA-Z ' 空格 Backspace Enter Tab 方向键 删除等
      const allowedMeta = ["Backspace","Enter","Tab","ArrowLeft","ArrowRight",
                          "ArrowUp","ArrowDown","Delete","Home","End"];
      if (e.ctrlKey || e.altKey || e.metaKey) {
        // 其他修饰键组合（如 Ctrl+C 复制）放行，不阻止
        return;
      }
      if (allowedMeta.includes(e.key)) return;               // 控制键放行
      if (/^[a-zA-Z'0-9]$/.test(e.key)) return;                  // 英文字母 / 数字 / 撇号 放行
      if (e.key === " ") return;                              // 空格放行

      // 其他字符（数字、中文、标点等）阻止
      e.preventDefault();
    }, true);  // 使用捕获阶段，确保在 IME 之前接到事件

    /* keyup 阶段也拦截 Shift：防止某些系统在 keyup 时触发 IME 切换
     * 同样不 stopPropagation，让 document 的 keyup 监听器收到事件清除提示
     */
    $inputs.addEventListener("keyup", (e) => {
      const t = e.target;
      if (!(t instanceof HTMLInputElement) || t.disabled) return;
      // Shift keyup：阻止系统切换 IME（Windows 中文输入法在 Shift keyup 时切换）
      if (e.key === "Shift" && !e.ctrlKey && !e.altKey && !e.metaKey) {
        e.preventDefault();
        // 不 return，让事件传播到 document 的 keyup 监听器（清除 Shift 提示）
      }
    }, true);

    $inputs.addEventListener("compositionstart", (e) => {
      imeState.composing = true;
      // 在 compositionstart 阶段 preventDefault，阻止 IME 启动
      // Android 上键盘弹出也会触发 compositionstart，但不触发报警音
      e.preventDefault();
      const t = e.target;
      if (t instanceof HTMLInputElement) {
        // 不强制清空 value，避免 Android 正常输入时被错误清除
        // 不调用 showImeWarn（Android 上键盘弹出就触发此事件，会引起误报）
      }
    }, true);
    $inputs.addEventListener("compositionupdate", (e) => {
      if (!imeState.composing) imeState.composing = true;
      const t = e.target;
      if (t instanceof HTMLInputElement) {
        const v = t.value;
        if (/[\u4e00-\u9fff\u3400-\u4dbf\uff00-\uffef]/.test(v)) {
          t.value = v.replace(/[\u4e00-\u9fff\u3400-\u4dbf\uff00-\uffef]/g, "");
          const cell = t.closest(".word-cell");
          if (cell) showImeWarn(cell);
        }
      }
    });
    $inputs.addEventListener("compositionend", (e) => {
      imeState.composing = false;
      const t = e.target;
      if (t instanceof HTMLInputElement) {
        const v = t.value;
        const cleaned = v.replace(/[^a-zA-Z'0-9\s]/g, "");
        if (cleaned !== v) {
          t.value = cleaned;
        }
        // composition 结束后必须重新校验输入（Android 上 composition 可能因键盘弹出而触发）
        const cell = t.closest(".word-cell");
        if (cell) {
          const changed = checkCell(cell);
          if (changed) alertFor(cell);
        }
      }
    });

    /* Focus 时主动尝试"唤醒"英文模式
     * 浏览器没有 API 直接切换系统 IME，但可以通过：
     *  1) 重新设置 value（触发部分浏览器重新评估输入上下文）
     *  2) select() + 设回（让浏览器知道是英文输入区）
     *  3) 显示提示，引导用户切换
     */
    $inputs.addEventListener("focusin", (e) => {
      const t = e.target;
      if (!(t instanceof HTMLInputElement) || t.disabled) return;
      // 重新设置 lang / inputmode 属性，部分浏览器会据此重新评估 IME
      t.setAttribute("lang", "en");
      t.setAttribute("inputmode", "latin");
      // 提示一次（仅当系统看起来还在中文 IME）
      // 不能检测系统 IME，所以只在第一次 focus 时给一次性提示
      if (!imeState.userWarnedOnce) {
        imeState.userWarnedOnce = false; // 不主动弹提示，避免打扰
      }
    });

    /* ========== 输入事件代理 ========== */
    $inputs.addEventListener("input", (e) => {
      const t = e.target;
      if (!(t instanceof HTMLInputElement)) return;
      const cell = t.closest(".word-cell");
      if (!cell) return;
      // 只接受字母 / 数字 / 撇号 / 空格（大小写保留，不强制改写）
      t.value = t.value.replace(/[^a-zA-Z'0-9\s]/g, "");
      // 若 IME 合成中触发的 input，不做校验（compositionend 时再处理）
      if (imeState.composing) return;

      const prev = cell.dataset.state || "";
      const changed = checkCell(cell);
      if (changed) {
        // 状态变化才报警，避免连续触发
        alertFor(cell);
      }
      // 焦点变化时（输入即焦点在自己）若 Shift 按住，刷新提示
      if (state.hintDown) applyShiftHint();

      // 完全匹配（含大小写）时才跳下一格
      if (cell.dataset.state === "correct") {
        if (allFilledCorrect()) {
          revealAnalysis();
        } else {
          const idx = parseInt(cell.dataset.index, 10);
          const next = $inputs.querySelector(`.word-cell[data-index="${idx + 1}"] input:not([disabled])`);
          if (next) {
            next.focus();
            // 焦点跳走时若 Shift 还按住，立即在新格上显示提示
            if (state.hintDown) applyShiftHint();
          }
        }
      }
    });

    // 焦点变化（点击/键盘切换）时刷新提示
    $inputs.addEventListener("focusin", (e) => {
      const t = e.target;
      if (t instanceof HTMLInputElement) {
        const cell = t.closest(".word-cell");
        if (cell) _lastFocusedCell = cell;
      }
      if (state.hintDown) applyShiftHint();
    });
    $inputs.addEventListener("focusout", () => {
      // 移出输入区立即清掉提示
      clearAllHints();
    });

    $inputs.addEventListener("keydown", (e) => {
      const t = e.target;
      if (!(t instanceof HTMLInputElement)) return;
      if (e.key === "Enter") {
        e.preventDefault();
        const idx = parseInt(t.closest(".word-cell").dataset.index, 10);
        const next = $inputs.querySelector(`.word-cell[data-index="${idx + 1}"] input:not([disabled])`)
                  || $inputs.querySelector(`.word-cell[data-index="${idx - 1}"] input:not([disabled])`);
        if (next) {
          next.focus();
          if (state.hintDown) applyShiftHint();
        }
      }
      if (e.key === "Backspace" && !t.value) {
        const idx = parseInt(t.closest(".word-cell").dataset.index, 10);
        const prev = $inputs.querySelector(`.word-cell[data-index="${idx - 1}"] input:not([disabled])`);
        if (prev) {
          e.preventDefault();
          prev.focus();
          if (state.hintDown) applyShiftHint();
        }
      }
    });

    /* ========== 按钮事件 ========== */
    function saveProgress() {
      try {
        const key = state.user && state.user.phone
          ? "en_progress_" + state.user.phone + "_" + state.textbook
          : "en_progress_guest_" + state.textbook;
        localStorage.setItem(key, String(state.idx));
      } catch (e) {}
    }
    function goNext() {
      // ===== VIP 额度闸门 =====
      bus.emit("next", { qid: state.idx });
      // 第一题完成后、未登录时弹出登录窗口
      if (state.idx === 0 && !state.user) {
        openLogin();
        return; // 阻止进入下一题，待登录后继续
      }
      // Free 用户超额度拦截
      if (Vip.isFreeLimitReached()) {
        showUpgradeGuide({ used: Tasks.getState().today.done, limit: Vip.FREE_DAILY_LIMIT });
        return;
      }
      if (state.idx >= QUESTIONS.length - 1) {
        // 最后一题：显示今日计划结算
        $card.style.display = "none";
        $finish.classList.add("show");
        $finishText.textContent = `你已经完成了今日计划的 ${QUESTIONS.length} 道题。`;
        // 显示今日统计
        const today = Tasks.getState().today || { done: 0, correct: 0 };
        const acc = today.done > 0 ? Math.round((today.correct / today.done) * 100) : 0;
        const fs = document.getElementById("finishStats");
        if (fs) {
          fs.innerHTML = `
            <span style="font-size:13px;color:var(--muted)">答题 ${today.done}</span>
            <span style="font-size:13px;color:var(--muted)">正确率 ${acc}%</span>
          `;
        }
        return;
      }
      state.idx++;
      saveProgress();
      renderQuestion();

      // 用户点击触发的，同步朗读（在交互调用栈中，Chrome 不会阻止）
      if (state.autoSpeak && _userInteracted) {
        const q = currentQuestion();
        if (q) {
          const sentence = q.words.join(" ").replace(/\s+([.,!?])/g, "$1");
          speak(sentence);
        }
      }
    }
    el("btnNext").addEventListener("click", goNext);

    /* ========== 手机号登录（首次登录即注册，永久保存） ========== */
    const $loginMask = el("loginMask");
    const $loginFormArea = el("loginFormArea");
    const $loginSuccess = el("loginSuccess");
    const $successUser = el("successUser");
    const $phoneInput = el("phoneInput");
    const $codeInput = el("codeInput");
    const $phoneError = el("phoneError");
    const $codeError = el("codeError");
    const $btnSendCode = el("btnSendCode");
    let loginTimer = null;
    let codeCountdown = 0;

    // 打开登录弹窗：重置为表单状态
    function openLogin() {
      $loginSuccess.classList.remove("show");
      $loginFormArea.style.display = "block";
      $phoneInput.value = "";
      $codeInput.value = "";
      $phoneError.textContent = "";
      $codeError.textContent = "";
      $btnSendCode.disabled = false;
      $btnSendCode.textContent = "获取验证码";
      codeCountdown = 0;
      // 关闭其他弹层
      $modal.classList.remove("show");
      $bookModalMask.classList.remove("show");
      $loginMask.classList.add("show");
      setTimeout(() => $phoneInput.focus(), 100);
    }
    function closeLogin() {
      $loginMask.classList.remove("show");
      if (loginTimer) { clearTimeout(loginTimer); loginTimer = null; }
    }
    // 手机号校验
    function isValidPhone(p) { return /^1[3-9]\d{9}$/.test(p); }
    // 发送验证码（演示版：倒计时 + 随机生成验证码填入）
    $btnSendCode.addEventListener("click", () => {
      const phone = $phoneInput.value.trim();
      if (!isValidPhone(phone)) {
        $phoneError.textContent = "请输入正确的 11 位手机号";
        return;
      }
      $phoneError.textContent = "";
      // 演示版：自动生成 6 位验证码并填入输入框
      const code = String(Math.floor(100000 + Math.random() * 900000));
      $codeInput.value = code;
      $codeError.textContent = "";
      // 倒计时
      codeCountdown = 60;
      $btnSendCode.disabled = true;
      const tick = () => {
        if (codeCountdown > 0) {
          $btnSendCode.textContent = `${codeCountdown}s 后重发`;
          codeCountdown--;
          loginTimer = setTimeout(tick, 1000);
        } else {
          $btnSendCode.disabled = false;
          $btnSendCode.textContent = "获取验证码";
        }
      };
      tick();
    });
    // 登录/注册提交
    function submitLogin() {
      const phone = $phoneInput.value.trim();
      const code = $codeInput.value.trim();
      // 校验
      if (!isValidPhone(phone)) {
        $phoneError.textContent = "请输入正确的 11 位手机号";
        return;
      }
      if (!/^\d{6}$/.test(code)) {
        $codeError.textContent = "请输入 6 位数字验证码";
        return;
      }
      $phoneError.textContent = "";
      $codeError.textContent = "";
      // 首次登录即注册：默认昵称不超过 7 个字
      const masked = createDefaultUserName(phone);
      state.user = { name: masked, phone: phone, avatar: "" };
      try {
        localStorage.setItem("en_user", JSON.stringify(state.user));
        saveUserNameRegistry(state.user);
      } catch (e) {}
      // 显示成功界面
      $loginFormArea.style.display = "none";
      $loginSuccess.classList.add("show");
      $successUser.textContent = state.user.avatar + " " + state.user.name;
      updateAuthBtn();
      loginTimer = setTimeout(() => {
        closeLogin();
        state.idx++;
        saveProgress();
        renderQuestion();
      }, 1200);
    }
    el("btnLoginSubmit").addEventListener("click", submitLogin);
    el("loginClose").addEventListener("click", closeLogin);
    $loginMask.addEventListener("click", (e) => {
      if (e.target === $loginMask) closeLogin();
    });
    // 回车提交
    $codeInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); submitLogin(); }
    });
    $phoneInput.addEventListener("input", () => {
      $phoneInput.value = $phoneInput.value.replace(/\D/g, "").slice(0, 11);
      $phoneError.textContent = "";
    });
    $codeInput.addEventListener("input", () => {
      $codeInput.value = $codeInput.value.replace(/\D/g, "").slice(0, 6);
      $codeError.textContent = "";
    });

    /* ========== 右侧侧边栏 展开/折叠 ========== */
    const $sidebar = el("sidebar");
    const $sidebarToggle = el("sidebarToggle");
    const $sidebarItems = $sidebar.querySelectorAll(".sidebar-item");
    let sidebarExpanded = false;

    $sidebarToggle.addEventListener("click", () => {
      sidebarExpanded = !sidebarExpanded;
      $sidebar.classList.toggle("expanded", sidebarExpanded);
    });
    // 点击外部折叠（仅桌面端）
    document.addEventListener("click", (e) => {
      if (window.innerWidth > 600 && sidebarExpanded && !$sidebar.contains(e.target)) {
        sidebarExpanded = false;
        $sidebar.classList.remove("expanded");
      }
    });
    // 菜单项点击高亮（预留面板切换）
    $sidebarItems.forEach(item => {
      item.addEventListener("click", () => {
        $sidebarItems.forEach(i => i.classList.remove("active"));
        item.classList.add("active");
      });
    });

    /* ========== 登录状态按钮 ========== */
    const $btnAuth = el("btnAuth");
    const $authLabel = $btnAuth.querySelector(".auth-label");
    const $authIcon = $btnAuth.querySelector("svg");

    function updateAuthBtn() {
      if (state.user) {
        $btnAuth.classList.add("logged-in");
        $btnAuth.title = "已登录：" + state.user.name + "（点击退出）";
        $authLabel.textContent = state.user.name;
        // 切换为退出图标
        $authIcon.innerHTML = '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>';
      } else {
        $btnAuth.classList.remove("logged-in");
        $btnAuth.title = "登录";
        $authLabel.textContent = "登录";
        // 切换为登录图标
        $authIcon.innerHTML = '<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>';
      }
    }

    function getUserNameRegistry() {
      try {
        return JSON.parse(localStorage.getItem("en_user_name_registry") || "{}");
      } catch (e) {
        return {};
      }
    }

    function saveUserNameRegistry(user) {
      if (!user || !user.phone || !user.name) return;
      try {
        const map = getUserNameRegistry();
        map[user.phone] = user.name;
        localStorage.setItem("en_user_name_registry", JSON.stringify(map));
      } catch (e) {}
    }

    function isUserNameTaken(name, phone) {
      const map = getUserNameRegistry();
      return Object.entries(map).some(([p, n]) => p !== phone && n === name);
    }

    function createDefaultUserName(phone) {
      const base = ("用户" + String(phone || "").slice(-4)).slice(0, 7);
      if (!isUserNameTaken(base, phone)) return base;
      for (let i = 1; i <= 99; i++) {
        const name = ("用户" + String(phone || "").slice(-3) + i).slice(0, 7);
        if (!isUserNameTaken(name, phone)) return name;
      }
      return ("用户" + Date.now()).slice(0, 7);
    }

    $btnAuth.addEventListener("click", () => {
      if (state.user) {
        // 已登录：打开用户中心
        renderUserCenter();
        document.getElementById("userCenterMask").classList.add("show");
      } else {
        // 未登录：打开登录弹窗
        openLogin();
      }
    });
    // 初始化按钮状态
    updateAuthBtn();

    el("btnRestart").addEventListener("click", () => {
      state.idx = 0;
      saveProgress();
      $card.style.display = "";
      $finish.classList.remove("show");
      renderQuestion();
    });
    // 继续学习：追加一批新题到当前队列
    el("btnContinue").addEventListener("click", async () => {
      const more = await DailyPlanner.buildQueue(state.textbook, _originalQuestions, state.dailyGoal);
      if (more.length > 0) {
        QUESTIONS = QUESTIONS.concat(more);
        state.idx++;
        saveProgress();
        $card.style.display = "";
        $finish.classList.remove("show");
        renderQuestion();
      } else {
        alert("该教材已没有更多新题！");
      }
    });

    /* ========== 设置弹窗 ========== */
    function openSettings() {
      // 同步单选状态
      const radios = $modal.querySelectorAll('input[name="hintMode"]');
      radios.forEach(r => { r.checked = (r.value === state.hintMode); });
      $modal.querySelectorAll(".opt").forEach(o => {
        o.classList.toggle("selected", o.dataset.value === state.hintMode);
      });
      // 同步字号滑块与 chip 高亮
      const range = el("fontSizeRange");
      const valEl = el("fontSizeVal");
      if (range) range.value = String(state.fontSize);
      if (valEl) valEl.textContent = String(state.fontSize);
      $modal.querySelectorAll(".chip").forEach(c => {
        c.classList.toggle("active", parseInt(c.dataset.fs, 10) === state.fontSize);
      });
      // 同步每日目标
      const dgRange = el("dailyGoalRange");
      const dgValEl = el("dailyGoalVal");
      if (dgRange) dgRange.value = String(state.dailyGoal);
      if (dgValEl) dgValEl.textContent = String(state.dailyGoal);
      $modal.querySelectorAll(".chip[data-dg]").forEach(c => {
        c.classList.toggle("active", parseInt(c.dataset.dg, 10) === state.dailyGoal);
      });
      // 关闭其他弹层
      $loginMask.classList.remove("show");
      $bookModalMask.classList.remove("show");
      $modal.classList.add("show");
    }
    function closeSettings() { $modal.classList.remove("show"); }

    /* ========== 教材选择抽屉（四级联动） ========== */
    const $bookSelect = el("bookSelect");
    const $btnBook = el("btnBook");
    const $bookDrawer = el("bookDrawer");
    const $bookLabel = el("bookLabel");

    // 从 textbook id 解析出 level/edition/grade/term
    function parseTextbookId(tid) {
      const parts = tid.split("_");
      return { levelId: parts[0], editionId: parts[1], gradeId: parts[2], termId: parts[3] };
    }

    // 当前联动选中状态
    const bookSel = { levelId: "ms", editionId: "pep", gradeId: "g1", termId: "a" };

    // 绑定学段列：同时渲染 drawer 和弹层
    function renderLevelCol() {
      const targets = [[$colLevel, $modalColLevel]];
      targets.forEach(([$col, $modalCol]) => {
        if (!$col || !$modalCol) return;
        [$col, $modalCol].forEach($c => {
          const $list = $c.querySelector(".book-col-list");
          $list.innerHTML = "";
          BOOK_TREE.forEach(seg => {
            const item = document.createElement("div");
            item.className = "book-item" + (seg.id === bookSel.levelId ? " active" : "");
            item.innerHTML = `<span>${seg.level}</span><span class="check">✓</span>`;
            item.addEventListener("click", () => {
              bookSel.levelId = seg.id;
              const firstEd = seg.editions[0];
              const firstGrade = seg.grades[0];
              bookSel.editionId = firstEd.id;
              bookSel.gradeId = firstGrade.id;
              bookSel.termId = firstGrade.terms[0].id;
              $colGrade.querySelector(".book-col-title").textContent = seg.colTitles.grade;
              $colTerm.querySelector(".book-col-title").textContent = seg.colTitles.term;
              $modalColGrade.querySelector(".book-col-title").textContent = seg.colTitles.grade;
              $modalColTerm.querySelector(".book-col-title").textContent = seg.colTitles.term;
              renderLevelCol();
              renderEditionCol();
              renderGradeCol();
              renderTermCol();
            });
            $list.appendChild(item);
          });
        });
      });
    }

    // 渲染版本列
    function renderEditionCol() {
      [$colEdition, $modalColEdition].forEach($c => {
        if (!$c) return;
        const $list = $c.querySelector(".book-col-list");
        $list.innerHTML = "";
        const seg = BOOK_TREE.find(s => s.id === bookSel.levelId);
        if (!seg) return;
        seg.editions.forEach(ed => {
          const item = document.createElement("div");
          item.className = "book-item" + (ed.id === bookSel.editionId ? " active" : "");
          item.innerHTML = `<span>${ed.name}</span><span class="check">✓</span>`;
          item.addEventListener("click", () => {
            bookSel.editionId = ed.id;
            renderEditionCol();
            renderTermCol();
          });
          $list.appendChild(item);
        });
      });
    }

    // 渲染年级列
    function renderGradeCol() {
      [$colGrade, $modalColGrade].forEach($c => {
        if (!$c) return;
        const $list = $c.querySelector(".book-col-list");
        $list.innerHTML = "";
        const seg = BOOK_TREE.find(s => s.id === bookSel.levelId);
        if (!seg) return;
        seg.grades.forEach(gr => {
          const item = document.createElement("div");
          item.className = "book-item" + (gr.id === bookSel.gradeId ? " active" : "");
          item.innerHTML = `<span>${gr.name}</span><span class="check">✓</span>`;
          item.addEventListener("click", () => {
            bookSel.gradeId = gr.id;
            bookSel.termId = gr.terms[0].id;
            renderGradeCol();
            renderTermCol();
          });
          $list.appendChild(item);
        });
      });
    }

    // 渲染学期列（桌面端选中即切换；弹层内仅高亮，确定后切换）
    function renderTermCol() {
      [$colTerm, $modalColTerm].forEach($c => {
        if (!$c) return;
        const isModal = ($c === $modalColTerm);
        const $list = $c.querySelector(".book-col-list");
        $list.innerHTML = "";
        const seg = BOOK_TREE.find(s => s.id === bookSel.levelId);
        if (!seg) return;
        const gr = seg.grades.find(g => g.id === bookSel.gradeId);
        if (!gr) return;
        gr.terms.forEach(tm => {
          const tid = `${seg.id}_${bookSel.editionId}_${gr.id}_${tm.id}`;
          const isActive = isModal
            ? (tm.id === bookSel.termId)
            : (tid === state.textbook);
          const item = document.createElement("div");
          item.className = "book-item" + (isActive ? " active" : "");
          item.innerHTML = `<span>${tm.name}</span><span class="check">✓</span>`;
          item.addEventListener("click", () => {
            if (isModal) {
              bookSel.termId = tm.id;
              renderTermCol();
            } else {
              selectTextbook(tid);
            }
          });
          $list.appendChild(item);
        });
      });
    }

    // 更新触发器显示文字
    function updateBookLabel() {
      $bookLabel.textContent = TEXTBOOK_MAP[state.textbook] || "未选择";
    }

    // 切换教材（异步：如该册未加载则先下载对应题库文件）
    async function selectTextbook(id) {
      if (!TEXTBOOK_MAP[id]) return;
      const parsed = parseTextbookId(id);
      bookSel.levelId = parsed.levelId;
      bookSel.editionId = parsed.editionId;
      bookSel.gradeId = parsed.gradeId;
      bookSel.termId = parsed.termId;
      state.textbook = id;
      state.idx = 0;
      // 恢复该教材的学习进度（每册独立保存）
      {
        const progressKey = state.user && state.user.phone
          ? "en_progress_" + state.user.phone + "_" + id
          : "en_progress_guest_" + id;
        const savedIdx = localStorage.getItem(progressKey);
        if (savedIdx != null) {
          const n = parseInt(savedIdx, 10);
          if (n >= 0) state.idx = n;
        }
      }
      saveProgress();
      try { localStorage.setItem("en_textbook", id); } catch (e) {}
      updateBookLabel();
      renderLevelCol();
      renderEditionCol();
      renderGradeCol();
      renderTermCol();
      closeBookDrawer();
      // 该册未加载则异步下载
      if (!_loadedBooks.has(id)) {
        const dm = document.getElementById("downloadMask");
        const dlSub = document.getElementById("dlSub");
        const dlFill = document.getElementById("dlFill");
        const dlText = document.getElementById("dlText");
        if (dm) {
          if (dlSub) dlSub.textContent = "正在加载该册题库...";
          if (dlFill) dlFill.style.width = "30%";
          if (dlText) dlText.textContent = id;
          dm.style.display = "flex";
        }
        await loadBookBank(id);
        if (dm) dm.style.display = "none";
      }
      _originalQuestions = QUESTION_BANK[id] || [];
      QUESTIONS = await DailyPlanner.buildQueue(id, _originalQuestions, state.dailyGoal);
      // 越界保护
      if (state.idx >= QUESTIONS.length) {
        state.idx = 0;
        saveProgress();
      }
      renderQuestion();
    }

    /* ======================================================================
     * L4b · 计划任务层 Planner + L5 · 看板层 Board + L7 · UI 统合层 Shell
     * ===================================================================== */
    const Planner = {
      async getDueList() { return await CardStore.dueList(); },
      async getDueCount() { return await CardStore.dueCount(); },
      async getNewCount() {
        const qid = CardStore.makeQid(state.textbook, "");
        let n = 0;
        Storage.Cache.cards.forEach(c => {
          if (c.state === FSRS.State.New && c.reps === 0 && c.textbook === state.textbook) n++;
        });
        // 未学过的新题 = 总题数 - 已有卡片数
        const totalQuestions = QUESTIONS.length;
        let learnedCount = 0;
        Storage.Cache.cards.forEach(c => {
          if (c.textbook === state.textbook) learnedCount++;
        });
        return Math.max(0, totalQuestions - learnedCount);
      },
      notificationPermission: "default",
      async requestNotification() {
        if (!("Notification" in window)) return false;
        const perm = await Notification.requestPermission();
        this.notificationPermission = perm;
        return perm === "granted";
      },
      scheduleReminder(time) {
        // 简化：每分钟检查一次是否到点
        if (this._timer) clearInterval(this._timer);
        if (!time) return;
        this._timer = setInterval(() => {
          if (Notification.permission !== "granted") return;
          const now = new Date();
          const [h, m] = time.split(":").map(Number);
          if (now.getHours() === h && now.getMinutes() === m) {
            CardStore.dueCount().then(n => {
              if (n > 0) new Notification("复习提醒", { body: `你有 ${n} 道题待复习，快来学习吧！` });
            });
          }
        }, 60000);
      },
    };

    /* ========== 练习框主题色 ========== */
    const CardTheme = (function () {
      const STORAGE_KEY = "en_card_theme";
      const GOLD_STORAGE_KEY = "en_card_gold_frame";
      const MIN_THEME_IDX = 3; // 练习框颜色从 Lv.4 童生开始，删除 Lv.1-Lv.3
      let _pickerEl = null;

      function getPracticeStyles() {
        return LEVEL_CARD_STYLES.map((s, i) => {
          const common = {
            muted: "rgba(255,255,255,.72)",
            panel: "rgba(15,23,42,.34)",
            btnBg: "rgba(15,23,42,.32)",
            btnHover: "rgba(15,23,42,.48)",
            primaryText: "#fff",
          };
          const overrides = {

            4: { ...common, bg: "linear-gradient(135deg,#3f3f46 0%,#71717a 58%,#d4d4d8 100%)", text: "#ffffff", muted: "rgba(255,255,255,.72)", accent: "#f4f4f5", border: "rgba(255,255,255,.28)", primary: "#52525b", primaryHover: "#3f3f46" }, // 秀才
            5: { ...common, bg: "linear-gradient(135deg,#064e3b 0%,#166534 55%,#22c55e 100%)", text: "#ecfdf5", muted: "rgba(236,253,245,.72)", accent: "#86efac", border: "rgba(236,253,245,.28)", primary: "#16a34a", primaryHover: "#15803d" }, // 举人
            6: { ...common, bg: "linear-gradient(135deg,#082f49 0%,#075985 55%,#38bdf8 100%)", text: "#e0f2fe", muted: "rgba(224,242,254,.72)", accent: "#7dd3fc", border: "rgba(224,242,254,.28)", primary: "#0284c7", primaryHover: "#0369a1" }, // 进士
            7: { ...common, bg: "linear-gradient(135deg,#4a0716 0%,#881337 52%,#be123c 100%)", text: "#fff7f7", muted: "rgba(255,247,247,.72)", accent: "#fda4af", border: "rgba(255,247,247,.28)", primary: "#be123c", primaryHover: "#9f1239" }, // 探花
            8: { ...common, bg: "linear-gradient(135deg,#2e1065 0%,#581c87 52%,#7e22ce 100%)", text: "#faf5ff", muted: "rgba(250,245,255,.72)", accent: "#d8b4fe", border: "rgba(250,245,255,.28)", primary: "#7e22ce", primaryHover: "#6b21a8" }, // 榜眼
            9: { ...common, text: "#fff7cc", muted: "rgba(255,247,204,.72)", accent: "#ffd700", border: "rgba(255,215,0,.38)", primary: "#d4a017", primaryHover: "#b8860b" }, // 状元
            10:{ ...common, text: "#fff7cc", muted: "rgba(255,247,204,.72)", accent: "#facc15", border: "rgba(250,204,21,.38)", primary: "#f97316", primaryHover: "#ea580c" }, // 三元
          };
          return { ...s, ...(overrides[i] || {}) };
        });
      }

      function getSaved() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); } catch (e) { return null; }
      }
      function save(choice) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(choice)); } catch (e) {}
      }
      function getGoldFrame() {
        try { return localStorage.getItem(GOLD_STORAGE_KEY) === "1"; } catch (e) { return false; }
      }
      function saveGoldFrame(enabled) {
        try { localStorage.setItem(GOLD_STORAGE_KEY, enabled ? "1" : "0"); } catch (e) {}
      }
      function applyGoldFrame(enabled) {
        const $card = document.getElementById("card");
        const $btn = document.getElementById("btnCardTheme");
        if (!$card) return;
        $card.classList.toggle("card-gold-frame", !!enabled);
        if ($btn) $btn.classList.toggle("active", !!enabled || !!normalizeChoice(getSaved()));
      }
      function isVipUser() {
        const info = Vip.getVipInfo();
        return info.level === "vip" && info.expire_at > Date.now();
      }
      function isTripleUser() {
        return Tasks.getLevelInfo().lv >= 11;
      }
      function hasGoldFrameLevel() {
        return Tasks.getLevelInfo().lv >= 8; // Lv.8 探花解锁动态渐变金框
      }

      // 获取当前等级对应的样式索引
      function currentLevelIndex() {
        const styles = getPracticeStyles();
        const idx = Tasks.getLevelInfo().lv - 1;
        if (idx < MIN_THEME_IDX) return null;
        return Math.min(idx, styles.length - 1);
      }

      function normalizeChoice(choice) {
        const styles = getPracticeStyles();
        if (!choice || typeof choice.idx !== "number") return null;
        if (choice.idx < MIN_THEME_IDX) return null;
        if (choice.idx >= styles.length) return null;
        return choice;
      }

      // 应用主题到练习框
      function applyTheme(choice) {
        const $card = document.getElementById("card");
        const $btn = document.getElementById("btnCardTheme");
        if (!$card) return;

        if (!choice) {
          // 关闭主题
          $card.style.background = "";
          $card.style.color = "";
          ["--practice-text","--practice-muted","--practice-accent","--practice-border","--practice-panel","--practice-btn-bg","--practice-btn-hover","--practice-btn-text","--practice-primary","--practice-primary-hover","--practice-primary-text"].forEach(k => $card.style.removeProperty(k));
          $card.classList.remove("card-themed");
          if ($btn) $btn.classList.toggle("active", getGoldFrame());
          // 移除装饰圆
          const deco = $card.querySelector(".card-theme-deco");
          if (deco) deco.remove();
          const icon = $card.querySelector(".card-theme-icon");
          if (icon) icon.remove();
          return;
        }

        choice = normalizeChoice(choice);
        if (!choice) {
          save(null);
          applyTheme(null);
          return;
        }
        const s = getPracticeStyles()[choice.idx];
        if (!s) return;

        $card.classList.add("card-themed");

          $card.insertBefore(deco, $card.firstChild);
