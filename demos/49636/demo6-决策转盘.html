<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>决策转盘 - 让命运替你做选择</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-primary: #0d0a1a;
    --bg-secondary: #1a1230;
    --bg-card: #231a3a;
    --gold: #d4a543;
    --gold-light: #f0d68a;
    --gold-dark: #a07828;
    --purple-deep: #2d1b4e;
    --purple-mid: #4a2d7a;
    --purple-light: #6b4c9a;
    --text-primary: #f0e6d3;
    --text-secondary: #b8a89a;
    --text-muted: #7a6e82;
    --border: #3a2a5a;
    --shadow-gold: rgba(212, 165, 67, 0.3);
  }

  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background atmosphere */
  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 30% 20%, rgba(74, 45, 122, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(212, 165, 67, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(45, 27, 78, 0.1) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    text-align: center;
    padding: 30px 0 20px;
  }

  header h1 {
    font-size: 2.8em;
    font-weight: 800;
    background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    letter-spacing: 6px;
    margin-bottom: 8px;
  }

  header p {
    font-size: 1.1em;
    color: var(--text-secondary);
    letter-spacing: 4px;
    font-weight: 300;
  }

  /* Main layout */
  .main-layout {
    display: flex;
    gap: 30px;
    margin-top: 20px;
    align-items: flex-start;
  }

  /* Wheel section */
  .wheel-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 0;
  }

  .wheel-container {
    position: relative;
    width: 420px;
    height: 420px;
    margin: 0 auto;
  }

  #wheelCanvas {
    width: 420px;
    height: 420px;
    filter: drop-shadow(0 0 20px rgba(212, 165, 67, 0.2));
    transition: filter 0.3s;
  }

  #wheelCanvas.spinning {
    filter: drop-shadow(0 0 40px rgba(212, 165, 67, 0.5))
            drop-shadow(0 0 80px rgba(212, 165, 67, 0.2));
  }

  /* Pointer */
  .pointer {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 40px solid var(--gold);
    z-index: 10;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
  }

  .pointer::after {
    content: '';
    position: absolute;
    top: -40px;
    left: -18px;
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 40px solid var(--gold-light);
    opacity: 0.3;
  }

  /* Center button */
  .center-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--gold-light), var(--gold), var(--gold-dark));
    border: 3px solid var(--gold-dark);
    color: var(--bg-primary);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2px;
    cursor: pointer;
    z-index: 10;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.3);
    transition: transform 0.2s, box-shadow 0.2s;
    line-height: 1.2;
  }

  .center-btn:hover:not(:disabled) {
    transform: translate(-50%, -50%) scale(1.08);
    box-shadow: 0 6px 25px var(--shadow-gold), inset 0 2px 4px rgba(255,255,255,0.3);
  }

  .center-btn:disabled {
    cursor: not-allowed;
    opacity: 0.7;
  }

  /* Spin button */
  .spin-btn {
    margin-top: 25px;
    padding: 14px 48px;
    font-size: 1.2em;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--bg-primary);
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 4px 20px var(--shadow-gold);
    transition: all 0.3s;
  }

  .spin-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(212, 165, 67, 0.5);
  }

  .spin-btn:active:not(:disabled) {
    transform: translateY(0);
  }

  .spin-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Side panel */
  .side-panel {
    width: 320px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .card-title {
    font-size: 1.05em;
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 15px;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-title::before {
    content: '';
    display: inline-block;
    width: 4px;
    height: 18px;
    background: var(--gold);
    border-radius: 2px;
  }

  /* Options editor */
  .option-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }

  .option-input-row input {
    flex: 1;
    padding: 10px 14px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-primary);
    font-size: 0.95em;
    outline: none;
    transition: border-color 0.3s;
  }

  .option-input-row input:focus {
    border-color: var(--gold);
  }

  .option-input-row input::placeholder {
    color: var(--text-muted);
  }

  .btn-add {
    padding: 10px 18px;
    background: var(--purple-mid);
    border: 1px solid var(--purple-light);
    border-radius: 10px;
    color: var(--text-primary);
    font-size: 0.95em;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .btn-add:hover {
    background: var(--purple-light);
  }

  .options-list {
    max-height: 240px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .options-list::-webkit-scrollbar {
    width: 4px;
  }

  .options-list::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 2px;
  }

  .option-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--bg-secondary);
    border-radius: 8px;
    border: 1px solid transparent;
    transition: all 0.2s;
    animation: slideIn 0.3s ease;
  }

  .option-item:hover {
    border-color: var(--border);
  }

  .option-color {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    margin-right: 10px;
    flex-shrink: 0;
  }

  .option-name {
    flex: 1;
    font-size: 0.9em;
  }

  .btn-delete {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 1.1em;
    padding: 2px 6px;
    border-radius: 4px;
    transition: all 0.2s;
  }

  .btn-delete:hover {
    color: #e05555;
    background: rgba(224, 85, 85, 0.1);
  }

  /* History */
  .history-list {
    max-height: 280px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .history-list::-webkit-scrollbar {
    width: 4px;
  }

  .history-list::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 2px;
  }

  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--bg-secondary);
    border-radius: 8px;
    animation: slideInRight 0.4s ease;
  }

  .history-result {
    font-weight: 600;
    color: var(--gold-light);
  }

  .history-time {
    font-size: 0.8em;
    color: var(--text-muted);
  }

  .empty-hint {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.9em;
    padding: 20px 0;
  }

  .btn-clear-history {
    margin-top: 10px;
    padding: 6px 14px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-muted);
    font-size: 0.8em;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-clear-history:hover {
    border-color: #e05555;
    color: #e05555;
  }

  /* Stats */
  .stats-bar {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    gap: 40px;
    padding: 20px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
  }

  .stat-item {
    text-align: center;
  }

  .stat-value {
    font-size: 2em;
    font-weight: 800;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .stat-label {
    font-size: 0.85em;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  /* Result overlay */
  .result-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  .result-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .result-card {
    background: var(--bg-card);
    border: 2px solid var(--gold);
    border-radius: 24px;
    padding: 40px 60px;
    text-align: center;
    transform: scale(0.5);
    transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 0 60px var(--shadow-gold), 0 20px 60px rgba(0,0,0,0.5);
  }

  .result-overlay.show .result-card {
    transform: scale(1);
  }

  .result-label {
    font-size: 1em;
    color: var(--text-secondary);
    letter-spacing: 4px;
    margin-bottom: 16px;
  }

  .result-text {
    font-size: 3em;
    font-weight: 800;
    background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 24px;
  }

  .result-close {
    padding: 10px 36px;
    background: var(--purple-mid);
    border: 1px solid var(--purple-light);
    border-radius: 50px;
    color: var(--text-primary);
    font-size: 1em;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 2px;
  }

  .result-close:hover {
    background: var(--purple-light);
  }

  /* Animations */
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* Responsive */
  @media (max-width: 860px) {
    .main-layout {
      flex-direction: column;
      align-items: center;
    }
    .side-panel {
      width: 100%;
      max-width: 420px;
    }
    .wheel-container {
      width: 340px;
      height: 340px;
    }
    #wheelCanvas {
      width: 340px;
      height: 340px;
    }
  }

  @media (max-width: 480px) {
    header h1 {
      font-size: 2em;
      letter-spacing: 3px;
    }
    .wheel-container {
      width: 300px;
      height: 300px;
    }
    #wheelCanvas {
      width: 300px;
      height: 300px;
    }
    .result-card {
      padding: 30px 30px;
    }
    .result-text {
      font-size: 2em;
    }
    .stats-bar {
      gap: 20px;
      flex-wrap: wrap;
    }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>决策转盘</h1>
    <p>让命运替你做选择</p>
  </header>

  <div class="main-layout">
    <div class="wheel-section">
      <div class="wheel-container">
        <canvas id="wheelCanvas" width="840" height="840"></canvas>
        <div class="pointer"></div>
        <button class="center-btn" id="centerBtn" onclick="spin()">转动</button>
      </div>
      <button class="spin-btn" id="spinBtn" onclick="spin()">转动命运</button>
    </div>

    <div class="side-panel">
      <div class="card">
        <div class="card-title">选项列表</div>
        <div class="option-input-row">
          <input type="text" id="newOption" placeholder="输入新选项..." maxlength="20" />
          <button class="btn-add" onclick="addOption()">添加</button>
        </div>
        <div class="options-list" id="optionsList"></div>
      </div>

      <div class="card">
        <div class="card-title">历史记录</div>
        <div class="history-list" id="historyList">
          <div class="empty-hint">尚无记录，转动转盘开始决策</div>
        </div>
        <button class="btn-clear-history" id="clearHistoryBtn" onclick="clearHistory()" style="display:none;">清空历史</button>
      </div>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-item">
      <div class="stat-value" id="totalDecisions">0</div>
      <div class="stat-label">已做决策</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="mostPicked">-</div>
      <div class="stat-label">最常被选中</div>
    </div>
  </div>
</div>

<!-- Result overlay -->
<div class="result-overlay" id="resultOverlay" onclick="closeResult(event)">
  <div class="result-card">
    <div class="result-label">命运的选择</div>
    <div class="result-text" id="resultText"></div>
    <button class="result-close" onclick="closeResult()">确认</button>
  </div>
</div>

<script>
  // ===== State =====
  const SECTOR_COLORS = [
    '#d4a543', '#7b4fbf', '#c75b39', '#3a9e8f', '#d46a8a',
    '#5a8fd4', '#8bc75b', '#d4885a', '#9a5ad4', '#5ad4b8',
    '#d45a5a', '#a0a43a', '#5a6ed4', '#d4a05a', '#6bd45a'
  ];

  let options = ['火锅', '烤肉', '寿司', '披萨', '沙拉', '面条'];
  let history = [];
  let isSpinning = false;
  let currentRotation = 0;

  // ===== Canvas =====
  const canvas = document.getElementById('wheelCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;
  const CX = W / 2;
  const CY = H / 2;
  const RADIUS = 370;

  function drawWheel(rotation) {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(rotation);

    const n = options.length;
    if (n === 0) {
      // Empty state
      ctx.beginPath();
      ctx.arc(0, 0, RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = '#231a3a';
      ctx.fill();
      ctx.strokeStyle = '#3a2a5a';
      ctx.lineWidth = 6;
      ctx.stroke();
      ctx.fillStyle = '#7a6e82';
      ctx.font = 'bold 32px "Segoe UI", "PingFang SC", "Microsoft YaHei"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('请添加选项', 0, 0);
      ctx.restore();
      drawOuterDecoration(rotation);
      return;
    }

    const arc = (Math.PI * 2) / n;

    // Draw sectors
    for (let i = 0; i < n; i++) {
      const startAngle = i * arc - Math.PI / 2;
      const endAngle = startAngle + arc;
      const color = SECTOR_COLORS[i % SECTOR_COLORS.length];

      // Sector fill with gradient
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, RADIUS - 20, startAngle, endAngle);
      ctx.closePath();

      const grad = ctx.createRadialGradient(0, 0, 30, 0, 0, RADIUS - 20);
      grad.addColorStop(0, lightenColor(color, 30));
      grad.addColorStop(1, color);
      ctx.fillStyle = grad;
      ctx.fill();

      // Sector border
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Text
      ctx.save();
      ctx.rotate(startAngle + arc / 2);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const textR = RADIUS * 0.58;
      const text = options[i];
      const fontSize = Math.min(36, Math.max(18, 280 / n));
      ctx.font = `bold ${fontSize}px "Segoe UI", "PingFang SC", "Microsoft YaHei"`;
      ctx.fillStyle = '#fff';
      ctx.shadowColor = 'rgba(0,0,0,0.6)';
      ctx.shadowBlur = 4;
      ctx.fillText(text.length > 6 ? text.substring(0, 5) + '..' : text, textR, 0);
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // Inner circle shadow
    ctx.beginPath();
    ctx.arc(0, 0, 60, 0, Math.PI * 2);
    const innerGrad = ctx.createRadialGradient(0, 0, 20, 0, 0, 60);
    innerGrad.addColorStop(0, '#1a1230');
    innerGrad.addColorStop(1, '#0d0a1a');
    ctx.fillStyle = innerGrad;
    ctx.fill();

    ctx.restore();

    // Outer decoration (doesn't rotate with wheel for visual effect)
    drawOuterDecoration(rotation);
  }

  function drawOuterDecoration(rotation) {
    ctx.save();
    ctx.translate(CX, CY);

    // Outer ring
    ctx.beginPath();
    ctx.arc(0, 0, RADIUS + 2, 0, Math.PI * 2);
    ctx.strokeStyle = '#d4a543';
    ctx.lineWidth = 8;
    ctx.stroke();

    // Second outer ring
    ctx.beginPath();
    ctx.arc(0, 0, RADIUS + 10, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(212, 165, 67, 0.3)';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Decorative dots
    const dotCount = 36;
    const dotRadius = RADIUS + 16;
    const pulseScale = isSpinning ? 1 + 0.15 * Math.sin(Date.now() / 200) : 1;
    for (let i = 0; i < dotCount; i++) {
      const angle = (i / dotCount) * Math.PI * 2 - Math.PI / 2;
      const x = Math.cos(angle) * dotRadius;
      const y = Math.sin(angle) * dotRadius;
      ctx.beginPath();
      ctx.arc(x, y, 4 * pulseScale, 0, Math.PI * 2);
      const dotBright = isSpinning
        ? 0.5 + 0.5 * Math.sin(Date.now() / 300 + i * 0.5)
        : 0.6;
      ctx.fillStyle = `rgba(240, 214, 138, ${dotBright})`;
      ctx.fill();
    }

    ctx.restore();
  }

  function lightenColor(hex, percent) {
    const num = parseInt(hex.slice(1), 16);
    const r = Math.min(255, (num >> 16) + percent);
    const g = Math.min(255, ((num >> 8) & 0x00FF) + percent);
    const b = Math.min(255, (num & 0x0000FF) + percent);
    return `rgb(${r},${g},${b})`;
  }

  // ===== Options =====
  function renderOptions() {
    const list = document.getElementById('optionsList');
    list.innerHTML = '';
    options.forEach((opt, i) => {
      const color = SECTOR_COLORS[i % SECTOR_COLORS.length];
      const item = document.createElement('div');
      item.className = 'option-item';
      item.innerHTML = `
        <span class="option-color" style="background:${color}"></span>
        <span class="option-name">${escapeHtml(opt)}</span>
        <button class="btn-delete" onclick="removeOption(${i})" title="删除">&times;</button>
      `;
      list.appendChild(item);
    });
    drawWheel(currentRotation);
  }

  function addOption() {
    const input = document.getElementById('newOption');
    const val = input.value.trim();
    if (!val) return;
    if (options.length >= 15) {
      input.style.borderColor = '#e05555';
      setTimeout(() => input.style.borderColor = '', 1500);
      return;
    }
    if (options.includes(val)) {
      input.style.borderColor = '#e05555';
      setTimeout(() => input.style.borderColor = '', 1500);
      return;
    }
    options.push(val);
    input.value = '';
    renderOptions();
    saveOptions();
  }

  function removeOption(index) {
    if (options.length <= 2) return; // Minimum 2 options
    options.splice(index, 1);
    renderOptions();
    saveOptions();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ===== Spin =====
  function spin() {
    if (isSpinning || options.length < 2) return;
    isSpinning = true;
    document.getElementById('spinBtn').disabled = true;
    document.getElementById('centerBtn').disabled = true;
    canvas.classList.add('spinning');

    const n = options.length;
    const arc = (Math.PI * 2) / n;

    // Random target
    const targetIndex = Math.floor(Math.random() * n);
    // Calculate the angle so that the pointer (top, -PI/2) lands in the middle of targetIndex's sector
    // Sector i goes from i*arc - PI/2 to (i+1)*arc - PI/2
    // Middle of sector: i*arc - PI/2 + arc/2
    // We need currentRotation + totalSpin ≡ -(i*arc + arc/2) (mod 2PI) for pointer at top
    const targetSectorMiddle = targetIndex * arc + arc / 2;
    const targetRemainder = (2 * Math.PI - targetSectorMiddle) % (2 * Math.PI);

    // Spin 3-5 full rotations + land on target
    const extraRotations = (3 + Math.random() * 2) * Math.PI * 2;
    const totalSpin = extraRotations + targetRemainder - (currentRotation % (2 * Math.PI));

    const startRotation = currentRotation;
    const endRotation = currentRotation + totalSpin;
    const duration = 4000 + Math.random() * 1000; // 4-5 seconds
    const startTime = performance.now();

    function animate(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);

      // Custom easing: cubic-bezier like, fast start, slow end
      const eased = 1 - Math.pow(1 - progress, 3.5);

      currentRotation = startRotation + totalSpin * eased;
      drawWheel(currentRotation);

      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        // Spin complete
        isSpinning = false;
        document.getElementById('spinBtn').disabled = false;
        document.getElementById('centerBtn').disabled = false;
        canvas.classList.remove('spinning');
        drawWheel(currentRotation);
        showResult(options[targetIndex]);
      }
    }

    requestAnimationFrame(animate);
  }

  // ===== Result =====
  function showResult(result) {
    document.getElementById('resultText').textContent = result;
    const overlay = document.getElementById('resultOverlay');
    overlay.classList.add('show');

    // Add to history
    const record = {
      result: result,
      time: new Date().toLocaleString('zh-CN')
    };
    history.unshift(record);
    if (history.length > 50) history.pop(); // Max 50 records
    saveHistory();
    renderHistory();
    updateStats();
  }

  function closeResult(e) {
    if (e && e.target !== e.currentTarget && !e.target.classList.contains('result-close')) return;
    document.getElementById('resultOverlay').classList.remove('show');
  }

  // ===== History =====
  function renderHistory() {
    const list = document.getElementById('historyList');
    const clearBtn = document.getElementById('clearHistoryBtn');

    if (history.length === 0) {
      list.innerHTML = '<div class="empty-hint">尚无记录，转动转盘开始决策</div>';
      clearBtn.style.display = 'none';
      return;
    }

    clearBtn.style.display = 'inline-block';
    list.innerHTML = '';
    history.forEach((record, i) => {
      const item = document.createElement('div');
      item.className = 'history-item';
      item.style.animationDelay = `${i * 0.05}s`;
      item.innerHTML = `
        <span class="history-result">${escapeHtml(record.result)}</span>
        <span class="history-time">${record.time}</span>
      `;
      list.appendChild(item);
    });
  }

  function clearHistory() {
    history = [];
    saveHistory();
    renderHistory();
    updateStats();
  }

  // ===== Stats =====
  function updateStats() {
    document.getElementById('totalDecisions').textContent = history.length;

    if (history.length === 0) {
      document.getElementById('mostPicked').textContent = '-';
      return;
    }

    const counts = {};
    history.forEach(r => {
      counts[r.result] = (counts[r.result] || 0) + 1;
    });

    let maxCount = 0;
    let maxItem = '-';
    Object.entries(counts).forEach(([item, count]) => {
      if (count > maxCount) {
        maxCount = count;
        maxItem = item;
      }
    });

    document.getElementById('mostPicked').textContent = maxItem;
  }

  // ===== Persistence =====
  function saveHistory() {
    try {
      localStorage.setItem('wheel_history', JSON.stringify(history));
    } catch (e) {}
  }

  function loadHistory() {
    try {
      const data = localStorage.getItem('wheel_history');
      if (data) history = JSON.parse(data);
    } catch (e) { history = []; }
  }

  function saveOptions() {
    try {
      localStorage.setItem('wheel_options', JSON.stringify(options));
    } catch (e) {}
  }

  function loadOptions() {
    try {
      const data = localStorage.getItem('wheel_options');
      if (data) {
        const loaded = JSON.parse(data);
        if (Array.isArray(loaded) && loaded.length >= 2) {
          options = loaded;
        }
      }
    } catch (e) {}
  }

  // ===== Init =====
  function init() {
    loadOptions();
    loadHistory();
    renderOptions();
    renderHistory();
    updateStats();

    // Enter key to add option
    document.getElementById('newOption').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addOption();
    });

    // Escape key to close result
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeResult();
    });

    // Subtle idle animation
    function idleAnimation() {
      if (!isSpinning) {
        drawWheel(currentRotation);
      }
      requestAnimationFrame(idleAnimation);
    }
    // We don't need continuous redraw when idle for performance
    // Only redraw on interaction. The dot pulse effect during spin is handled in the spin animation.
  }

  init();
</script>
</body>
</html>
