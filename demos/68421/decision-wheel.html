<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选择恐惧症理疗中心</title>
<style>
:root {
  --bg: #f2f2f7;
  --card: #fff;
  --text: #1d1d1f;
  --muted: #8e8e93;
  --accent: #ff3b30;
  --green: #34c759;
  --border: #e5e5ea;
  --radius: 14px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex; justify-content: center;
  padding: 32px 16px 60px;
  -webkit-font-smoothing: antialiased;
}

.app {
  width: 100%; max-width: 420px;
  display: flex; flex-direction: column; align-items: center; gap: 18px;
}

/* Header */
.header { text-align: center; }
.header h1 { font-size: 18px; font-weight: 700; letter-spacing: -.3px; }
.header .sub { font-size: 12px; color: var(--muted); margin-top: 3px; }

/* Wheel */
.wheel-wrapper { display: flex; justify-content: center; }
.wheel-container {
  position: relative; width: 260px; height: 260px;
}
canvas#wheel {
  width: 100%; height: 100%; border-radius: 50%;
  filter: drop-shadow(0 4px 16px rgba(0,0,0,.08));
}
.pointer {
  position: absolute; top: -6px; left: 50%; transform: translateX(-50%); z-index: 10;
  width: 0; height: 0;
  border-left: 10px solid transparent;
  border-right: 10px solid transparent;
  border-top: 20px solid var(--accent);
  filter: drop-shadow(0 1px 2px rgba(255,59,48,.25));
}
.pointer.bouncing { animation: bounce .1s ease-out 3; }
@keyframes bounce {
  0%,100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-4px); }
}
.btn-spin {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 5;
  width: 58px; height: 58px; border-radius: 50%; border: none;
  background: #1d1d1f; color: #fff;
  font-size: 14px; font-weight: 700; cursor: pointer;
  box-shadow: 0 3px 12px rgba(0,0,0,.15);
  transition: transform .15s, box-shadow .15s; letter-spacing: 1px;
}
.btn-spin:hover { transform: translate(-50%,-50%) scale(1.05); box-shadow: 0 5px 18px rgba(0,0,0,.22); }
.btn-spin:active { transform: translate(-50%,-50%) scale(.93); }
.btn-spin:disabled { opacity: .4; cursor: not-allowed; transform: translate(-50%,-50%) scale(1); }

/* Quick actions */
.quick-row {
  display: flex; gap: 10px; width: 100%;
}
.quick-row button {
  flex: 1; padding: 8px 0; border-radius: 10px;
  border: 1px solid var(--border); background: var(--card);
  color: var(--text); font-size: 12px; font-weight: 500; cursor: pointer;
  transition: all .12s;
}
.quick-row button:hover { background: #f5f5f7; }
.quick-row button:active { transform: scale(.96); }

/* Panel */
.panel {
  width: 100%; background: var(--card); border-radius: var(--radius);
  padding: 14px 16px; border: 1px solid var(--border);
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.panel-head .title { font-size: 13px; font-weight: 600; }
.panel-head .count { font-size: 12px; color: var(--muted); }

/* Option list */
.opt-list { display: flex; flex-direction: column; gap: 4px; max-height: 220px; overflow-y: auto; }
.opt-item {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg); border-radius: 8px; padding: 7px 10px;
  transition: background .15s;
}
.opt-item:hover { background: #e8e8ed; }
.opt-item .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.opt-item .name {
  flex: 1; font-size: 13px; font-weight: 500;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.opt-item .act {
  width: 22px; height: 22px; border-radius: 50%; border: none;
  font-size: 12px; cursor: pointer; display: flex; align-items: center;
  justify-content: center; transition: all .1s; flex-shrink: 0;
  background: transparent; color: var(--muted);
}
.opt-item .act:hover { background: #dcdce0; }
.opt-item .act-del:hover { color: var(--accent); }

/* Add row */
.add-row { display: flex; gap: 6px; margin-top: 10px; }
.add-row input {
  flex: 1; padding: 8px 12px; border-radius: 9px;
  border: 1px solid var(--border); background: var(--bg);
  color: var(--text); font-size: 13px; outline: none;
}
.add-row input:focus { border-color: #aaa; background: #fff; }
.add-row input::placeholder { color: var(--muted); }
.add-row button {
  padding: 8px 14px; border-radius: 9px; border: none;
  background: var(--text); color: #fff; font-weight: 600;
  font-size: 12px; cursor: pointer; transition: all .1s;
}
.add-row button:hover { background: #333; }
.add-row button:active { transform: scale(.95); }

/* Preset tags */
.presets { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 9px; }
.preset-tag {
  padding: 4px 12px; border-radius: 14px;
  border: 1px solid var(--border); background: var(--card);
  color: var(--muted); font-size: 11px; font-weight: 500; cursor: pointer;
  transition: all .12s;
}
.preset-tag:hover { border-color: #aaa; color: var(--text); background: var(--bg); }
.preset-tag.coin-tag {
  border-color: #ffe0e0; background: #fff5f5; color: var(--accent); font-weight: 600;
}
.preset-tag.coin-tag:hover { background: #ffeaea; border-color: #ffcccc; }

/* History section */
.history-section { width: 100%; }
.history-toggle-btn {
  width: 100%; padding: 10px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--card);
  color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer;
  text-align: center; transition: all .12s;
}
.history-toggle-btn:hover { background: #f5f5f7; }
.history-body {
  margin-top: 10px; background: var(--card); border-radius: var(--radius);
  border: 1px solid var(--border); padding: 12px 14px;
  display: none;
}
.history-body.open { display: block; }
.history-body .h-title {
  font-size: 12px; font-weight: 600; margin-bottom: 8px;
  display: flex; justify-content: space-between; align-items: center;
}
.h-list { display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; }
.h-item {
  display: flex; align-items: center; gap: 7px;
  font-size: 12px; padding: 5px 8px; border-radius: 6px; background: var(--bg);
}
.h-item .h-dot { width: 6px; height: 6px; border-radius: 50%; }
.h-item .h-name { flex: 1; font-weight: 500; }
.h-item .h-time { color: var(--muted); font-size: 10px; }
.no-data { color: var(--muted); font-size: 12px; text-align: center; padding: 6px 0; }

/* Result overlay */
.result-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.35);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  display: flex; justify-content: center; align-items: center;
  z-index: 100; opacity: 0; pointer-events: none; transition: opacity .2s;
}
.result-overlay.show { opacity: 1; pointer-events: auto; }
.result-card {
  background: var(--card); border-radius: 22px; padding: 32px 26px;
  text-align: center; max-width: 280px; width: 88%;
  box-shadow: 0 12px 40px rgba(0,0,0,.15);
  animation: popIn .3s cubic-bezier(.175,.885,.32,1.275);
}
@keyframes popIn {
  0% { transform: scale(.7); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.result-card .r-emoji { font-size: 48px; line-height: 1; }
.result-card .r-label {
  font-size: 24px; font-weight: 700; margin: 10px 0 2px;
}
.result-card .r-label.yes { color: var(--green); }
.result-card .r-label.no { color: var(--accent); }
.result-card .r-tip { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
.result-card button {
  border: none; padding: 9px 24px; border-radius: 20px;
  font-size: 13px; font-weight: 600; cursor: pointer; margin: 3px;
  transition: all .1s;
}
.result-card button:active { transform: scale(.95); }
.btn-retry { background: var(--text); color: #fff; }
.btn-share { background: var(--bg); color: var(--text); }
.btn-close { background: transparent; color: var(--muted); font-size: 11px; font-weight: 400; }

/* Confetti */
#confettiCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 150; }

/* Toast */
.toast {
  position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
  background: rgba(29,29,31,.92); backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: #fff; padding: 9px 18px; border-radius: 18px;
  font-size: 12px; font-weight: 500; z-index: 200;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.toast.show { opacity: 1; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,.1); border-radius: 2px; }

@media (max-width: 380px) {
  .wheel-container { width: 230px; height: 230px; }
  .btn-spin { width: 50px; height: 50px; font-size: 12px; }
}
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>选择恐惧症理疗中心</h1>
    <div class="sub">转一下，命运替你决定</div>
  </div>

  <!-- Wheel -->
  <div class="wheel-wrapper">
    <div class="wheel-container">
      <div class="pointer" id="pointer"></div>
      <canvas id="wheel" width="520" height="520"></canvas>
      <button class="btn-spin" id="btnSpin">转</button>
    </div>
  </div>

  <!-- Quick actions -->
  <div class="quick-row">
    <button id="btnQuickPick">⚡ 随手抽</button>
    <button id="btnShuffle">🔀 洗牌</button>
    <button id="btnUndo">↩ 撤回</button>
  </div>

  <!-- Options -->
  <div class="panel">
    <div class="panel-head">
      <span class="title">转盘选项</span>
      <span class="count" id="optCount">8 项</span>
    </div>
    <div class="opt-list" id="optList"></div>
    <div class="add-row">
      <input type="text" id="inputOption" placeholder="输入新选项..." maxlength="20">
      <button id="btnAdd">添加</button>
    </div>
    <div class="presets">
      <button class="preset-tag coin-tag" data-preset="coin">🪙 掷硬币</button>
      <button class="preset-tag" data-preset="food">🍜 吃啥</button>
      <button class="preset-tag" data-preset="drink">🥤 喝啥</button>
      <button class="preset-tag" data-preset="play">🎮 玩啥</button>
      <button class="preset-tag" data-preset="go">🚗 去哪</button>
      <button class="preset-tag" data-preset="movie">🎬 看啥</button>
      <button class="preset-tag" data-preset="shop">🛒 买啥</button>
      <button class="preset-tag" data-preset="sport">⚽ 运动</button>
      <button class="preset-tag" data-preset="mood">😴 周末</button>
      <button class="preset-tag" data-preset="random">🎲 真心话</button>
      <button class="preset-tag" data-preset="challenge">💪 大冒险</button>
    </div>
  </div>

  <!-- History -->
  <div class="history-section">
    <button class="history-toggle-btn" id="btnHistoryToggle">
      📜 决定历史 <span id="historyBadge">0</span> 条
    </button>
    <div class="history-body" id="historyBody">
      <div class="h-title">
        <span>最近决定</span>
        <button style="background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer" id="btnClearHistory">清空</button>
      </div>
      <div class="h-list" id="historyList"></div>
    </div>
  </div>
</div>

<!-- Result -->
<div class="result-overlay" id="resultOverlay">
  <div class="result-card">
    <div class="r-emoji" id="resultEmoji">🎉</div>
    <div class="r-label" id="resultLabel"></div>
    <div class="r-tip" id="resultTip"></div>
    <button class="btn-retry" id="btnRetry">再转一次</button>
    <button class="btn-share" id="btnShare">📋 复制</button>
    <br>
    <button class="btn-close" id="btnClose">关闭</button>
  </div>
</div>

<canvas id="confettiCanvas"></canvas>
<div class="toast" id="toast"></div>

<script>
(function() {
const CANVAS_SIZE = 520;
const COLORS = [
  '#ff6b6b','#ffd43b','#69db7c','#4dabf7','#ff922b',
  '#9775fa','#20c997','#f783ac','#339af0','#fab005',
  '#ff8787','#74c0fc','#63e6be','#e599f7','#ffa94d',
  '#38d9a9','#91a7ff','#ffc078','#da77f2','#69db7c',
];

// Special colors for coin mode
const COIN_COLORS = ['#34c759', '#ff3b30'];

const PRESETS = {
  coin: ['✓ 去做！', '✕ 不去！'],
  food: ['火锅','烤肉','麻辣烫','寿司','汉堡','披萨','螺蛳粉','沙县小吃','兰州拉面','黄焖鸡','盖浇饭'],
  drink: ['奶茶','咖啡','柠檬茶','可乐','酸奶','果汁','白开水','冰美式','苏打水'],
  play: ['王者荣耀','原神','刷抖音','看电影','睡觉','看小说','出门散步','拼乐高'],
  go: ['公园','商场','图书馆','电影院','海边','爬山','宅家','博物馆','游乐园'],
  movie: ['悬疑片','喜剧片','恐怖片','科幻片','爱情片','动画片','纪录片','动作片','随便'],
  shop: ['衣服','鞋子','包包','数码产品','零食','书','护肤品','不买了省钱'],
  sport: ['跑步','游泳','跳绳','瑜伽','骑行','打球','爬楼梯','躺平休息'],
  mood: ['大扫除','睡到自然醒','约朋友吃饭','一个人发呆','追剧一整天','CityWalk','去图书馆','学个新菜'],
  random: ['说一个秘密','打电话给妈妈','发一条朋友圈','夸一句旁边的人','唱一首歌','做10个俯卧撑','给某人发红包'],
  challenge: ['学猫叫三声','闭眼走10步','用方言念一段话','模仿一个明星','倒立10秒','一口气喝完一瓶水'],
};

const FORTUNES = [
  '天意如此，别犹豫了！','命运给出了答案 ✨','就是它了，冲！',
  '纠结终结者已上线','你与它的缘分到了','冥冥之中自有安排','运势在你这边 🍀',
];
const COIN_FORTUNES_YES = ['命运说：去！','天意让你冲 🔥','别犹豫了，上！','宇宙信号：Yes 🪐'];
const COIN_FORTUNES_NO = ['命运说：算了','天意让你苟住 🛌','别去了，躺平吧','宇宙信号：Pass 🌙'];

// Audio
let audioCtx = null;
function au() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(f, d, vol) {
  try { au(); const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination); o.type = 'triangle';
    o.frequency.setValueAtTime(f, audioCtx.currentTime);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
    o.start(); o.stop(audioCtx.currentTime + d);
  } catch(e) {}
}
function playTick() { beep(600 + Math.random() * 500, 0.05, 0.04); }
function playWin() { [523,659,784,1047].forEach((f,i) => beep(f, 0.2, 0.08)); }
function playCoinWin() { beep(1047, 0.35, 0.1); }

// State
const SK_O = 'dw_opt_v3', SK_H = 'dw_hist_v3';
let options = [], history = [];
let isSpinning = false, currentAngle = 0, animId = null, isCoinMode = false;

// DOM
const canvas = document.getElementById('wheel'), ctx = canvas.getContext('2d');
const pointer = document.getElementById('pointer'), btnSpin = document.getElementById('btnSpin');
const optList = document.getElementById('optList'), inputOption = document.getElementById('inputOption');
const btnAdd = document.getElementById('btnAdd'), historyList = document.getElementById('historyList');
const btnClearHistory = document.getElementById('btnClearHistory');
const resultOverlay = document.getElementById('resultOverlay');
const resultEmoji = document.getElementById('resultEmoji');
const resultLabel = document.getElementById('resultLabel');
const resultTip = document.getElementById('resultTip');
const btnRetry = document.getElementById('btnRetry'), btnShare = document.getElementById('btnShare');
const btnClose = document.getElementById('btnClose'), toast = document.getElementById('toast');
const optCount = document.getElementById('optCount'), historyBadge = document.getElementById('historyBadge');
const historyBody = document.getElementById('historyBody');

// Persist
function saveOpts() { localStorage.setItem(SK_O, JSON.stringify({ opts: options, coin: isCoinMode })); }
function loadOpts() {
  const r = localStorage.getItem(SK_O);
  if (r) { try { const d = JSON.parse(r); if (Array.isArray(d.opts) && d.opts.length) { options = d.opts; isCoinMode = !!d.coin; return; } } catch(e) {} }
  options = PRESETS.food.map(n => ({ name: n, weight: 1 }));
}
function saveHist() { localStorage.setItem(SK_H, JSON.stringify(history.slice(0, 50))); }
function loadHist() {
  const r = localStorage.getItem(SK_H);
  if (r) { try { const d = JSON.parse(r); if (Array.isArray(d)) history = d; } catch(e) {} }
}

// Drawing
function tw() { return options.reduce((s,o) => s + o.weight, 0); }

function drawWheel(angle) {
  const cx = CANVAS_SIZE/2, cy = CANVAS_SIZE/2, r = CANVAS_SIZE/2 - 10;
  ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

  if (options.length === 0) {
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.fillStyle = '#e5e5ea'; ctx.fill();
    ctx.fillStyle = '#999'; ctx.font = '600 20px -apple-system,"PingFang SC",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('请添加选项', cx, cy);
    return;
  }

  const twv = tw();
  let sa = angle - Math.PI/2;

  options.forEach((opt, i) => {
    const sl = (opt.weight / twv) * Math.PI*2;
    const ea = sa + sl;

    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, sa, ea); ctx.closePath();
    ctx.fillStyle = isCoinMode ? COIN_COLORS[i % 2] : COLORS[i % COLORS.length];
    ctx.fill();

    // Inner shadow
    const g = ctx.createRadialGradient(cx, cy, r*0.7, cx, cy, r);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.05)');
    ctx.fillStyle = g; ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2; ctx.stroke();

    // Text
    const ma = sa + sl/2, tr = r * 0.62;
    const tx = cx + Math.cos(ma) * tr, ty = cy + Math.sin(ma) * tr;
    ctx.save(); ctx.translate(tx, ty); ctx.rotate(ma + Math.PI/2);
    ctx.fillStyle = isCoinMode ? '#fff' : '#fff';
    ctx.font = isCoinMode ? 'bold 26px -apple-system,"PingFang SC",sans-serif' : '600 18px -apple-system,"PingFang SC",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,.12)'; ctx.shadowBlur = 2;
    let txt = opt.name;
    if (!isCoinMode) {
      const mw = r * 0.6;
      if (ctx.measureText(txt).width > mw) {
        while (txt.length > 1 && ctx.measureText(txt + '…').width > mw) txt = txt.slice(0,-1);
        txt += '…';
      }
    }
    ctx.fillText(txt, 0, 0);
    ctx.shadowBlur = 0; ctx.restore();
    sa = ea;
  });

  // Center
  const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 46);
  cg.addColorStop(0, '#fff'); cg.addColorStop(1, '#f0f0f2');
  ctx.beginPath(); ctx.arc(cx, cy, 44, 0, Math.PI*2);
  ctx.fillStyle = cg; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.05)'; ctx.lineWidth = 1.5; ctx.stroke();

  // Outer ring
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(0,0,0,.06)'; ctx.lineWidth = 3; ctx.stroke();
}

// Spin
function spin(idx) {
  if (isSpinning || options.length < 2) { if (options.length < 2) showToast('至少需要 2 个选项'); return; }
  isSpinning = true; btnSpin.disabled = true;
  const twv = tw();
  if (idx === undefined) { const rnd = Math.random(); let c = 0; for (let i = 0; i < options.length; i++) { c += options[i].weight/twv; if (rnd <= c) { idx = i; break; } } if (idx === undefined) idx = options.length - 1; }
  let ss = 0; for (let i = 0; i < idx; i++) ss += (options[i].weight/twv)*Math.PI*2;
  const sl = (options[idx].weight/twv)*Math.PI*2;
  const sc = ss + sl/2;
  const jitter = (Math.random() - 0.5) * sl * 0.5;
  const fs = isCoinMode ? 2 + Math.floor(Math.random() * 2) : 3 + Math.floor(Math.random() * 2);
  const ta = fs*Math.PI*2 + (Math.PI*2 - (sc + jitter));
  const startA = currentAngle;
  const dur = isCoinMode ? 1000 + Math.random()*400 : 1500 + Math.random()*600;
  const st = performance.now(); let lt = -1;

  function ease(t) { return 1 - Math.pow(1 - t, 4); }
  function anim(now) {
    const p = Math.min((now-st)/dur, 1);
    currentAngle = startA + (ta - startA) * ease(p);
    drawWheel(currentAngle);
    const ti = Math.floor((currentAngle % (Math.PI*2)) / (Math.PI*2 / options.length));
    if (ti !== lt && p < 0.88) { lt = ti; playTick(); }
    if (p < 1) { animId = requestAnimationFrame(anim); }
    else {
      currentAngle = ta; drawWheel(currentAngle);
      pointer.classList.add('bouncing'); setTimeout(() => pointer.classList.remove('bouncing'), 300);
      isCoinMode ? playCoinWin() : playWin(); launchConfetti();
      onWin(idx); isSpinning = false; btnSpin.disabled = false;
    }
  }
  animId = requestAnimationFrame(anim);
}

function quickPick() {
  if (isSpinning || options.length < 2) { if (options.length < 2) showToast('至少需要 2 个选项'); return; }
  isSpinning = true; btnSpin.disabled = true;
  const idx = Math.floor(Math.random() * options.length);
  spin(idx);
}

function onWin(idx) {
  const w = options[idx];
  const isYes = isCoinMode && idx === 0;
  const isNo = isCoinMode && idx === 1;

  history.unshift({ name: w.name, color: isCoinMode ? COIN_COLORS[idx] : COLORS[idx % COLORS.length], time: new Date().toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) });
  if (history.length > 50) history.pop();
  saveHist(); renderHist();

  if (isCoinMode) {
    resultEmoji.textContent = isYes ? '✅' : '❌';
    resultLabel.textContent = isYes ? '去做！' : '不去！';
    resultLabel.className = 'r-label ' + (isYes ? 'yes' : 'no');
    resultTip.textContent = (isYes ? COIN_FORTUNES_YES : COIN_FORTUNES_NO)[Math.floor(Math.random()*4)];
  } else {
    resultEmoji.textContent = ['🎉','🎊','✨','🌟','💫','🎯','🏆','🎲','🔥','👑','🍀','🎈'][Math.floor(Math.random()*12)];
    resultLabel.textContent = w.name;
    resultLabel.className = 'r-label';
    resultTip.textContent = FORTUNES[Math.floor(Math.random()*FORTUNES.length)];
  }
  resultOverlay.classList.add('show');
}

// Shuffle
function shuffleOpts() {
  if (options.length < 2) return;
  for (let i = options.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [options[i],options[j]] = [options[j],options[i]]; }
  saveOpts(); renderOpts(); drawWheel(currentAngle);
  showToast('🔀 已洗牌');
}

// Undo
function undo() {
  if (history.length === 0) { showToast('没有可撤回的决定'); return; }
  const last = history.shift();
  saveHist(); renderHist();
  showToast(`↩ 已撤回「${last.name}」`);
}

// Render
function renderOpts() {
  optList.innerHTML = '';
  if (options.length === 0) { optList.innerHTML = '<div class="no-data">还没有选项，在下方添加吧</div>'; }
  else {
    options.forEach((o, i) => {
      const d = document.createElement('div'); d.className = 'opt-item';
      d.innerHTML = `<span class="dot" style="background:${isCoinMode ? COIN_COLORS[i%2] : COLORS[i%COLORS.length]}"></span><span class="name">${esc(o.name)}</span><button class="act act-del" data-i="${i}">✕</button>`;
      optList.appendChild(d);
    });
    optList.querySelectorAll('.act-del').forEach(b => b.addEventListener('click', () => {
      options.splice(+b.dataset.i, 1); if (isCoinMode && options.length < 2) isCoinMode = false;
      saveOpts(); renderOpts(); drawWheel(currentAngle);
    }));

  }
  optCount.textContent = options.length + ' 项';
}

function renderHist() {
  historyList.innerHTML = '';
  if (history.length === 0) { historyList.innerHTML = '<div class="no-data">还没有做过决定</div>'; }
  else { history.forEach(h => { const d = document.createElement('div'); d.className = 'h-item'; d.innerHTML = `<span class="h-dot" style="background:${h.color}"></span><span class="h-name">${esc(h.name)}</span><span class="h-time">${h.time}</span>`; historyList.appendChild(d); }); }
  historyBadge.textContent = history.length;
}

function addOpt(name) {
  const t = name.trim(); if (!t) return;
  if (options.length >= 20) { showToast('最多 20 个选项'); return; }
  if (options.some(o => o.name === t)) { showToast('已存在'); return; }
  options.push({ name: t, weight: 1 });
  saveOpts(); renderOpts(); drawWheel(currentAngle);
}

function loadPreset(key) {
  const names = PRESETS[key]; if (!names) return;
  isCoinMode = (key === 'coin');
  options = names.map(n => ({ name: n, weight: 1 }));
  saveOpts(); renderOpts(); drawWheel(currentAngle);
  currentAngle = 0;
  const lb = {coin:'掷硬币',food:'吃啥',drink:'喝啥',play:'玩啥',go:'去哪',movie:'看啥',shop:'买啥',sport:'运动',mood:'周末',random:'真心话',challenge:'大冒险'};
  showToast(isCoinMode ? '🪙 硬币模式：转一下就知道该不该去！' : '已加载：' + lb[key]);
}

// Confetti
const cc = document.getElementById('confettiCanvas'), ccx = cc.getContext('2d');
let cp = [], crf = null;
function rszCc() { cc.width = innerWidth; cc.height = innerHeight; }
rszCc(); addEventListener('resize', rszCc);
function launchConfetti() {
  cp = []; const cs = ['#ff6b6b','#ffd43b','#69db7c','#4dabf7','#ff922b','#9775fa','#f783ac'];
  for (let i = 0; i < 60; i++) cp.push({ x: Math.random()*cc.width, y: -20-Math.random()*150, w: 5+Math.random()*7, h: 3+Math.random()*5, c: cs[Math.floor(Math.random()*cs.length)], vx: (Math.random()-.5)*3, vy: 1.5+Math.random()*3, rot: Math.random()*360, rv: (Math.random()-.5)*8, op: 1 });
  if (!crf) { function a() { ccx.clearRect(0,0,cc.width,cc.height); let al = false; cp.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.rot+=p.rv; p.op-=0.007; if(p.op>0&&p.y<cc.height+30) { al=true; ccx.save(); ccx.globalAlpha=p.op; ccx.translate(p.x,p.y); ccx.rotate(p.rot*Math.PI/180); ccx.fillStyle=p.c; ccx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ccx.restore(); } }); if(al) crf=requestAnimationFrame(a); else { crf=null; ccx.clearRect(0,0,cc.width,cc.height); } } crf=requestAnimationFrame(a); }
}

// Toast
let tt;
function showToast(m) { clearTimeout(tt); toast.textContent=m; toast.classList.add('show'); tt=setTimeout(()=>toast.classList.remove('show'),1600); }
function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
async function share() {
  const t = `🎯 选择恐惧症理疗中心：命运选择了「${resultLabel.textContent}」！${resultTip.textContent}`;
  try { await navigator.clipboard.writeText(t); showToast('✅ 已复制！'); } catch(e) { showToast('复制失败'); }
}

// History toggle
let histOpen = false;
document.getElementById('btnHistoryToggle').addEventListener('click', () => {
  histOpen = !histOpen;
  historyBody.classList.toggle('open', histOpen);
  if (histOpen) renderHist();
});

// Events
btnSpin.addEventListener('click', () => spin());
document.getElementById('btnQuickPick').addEventListener('click', quickPick);
document.getElementById('btnShuffle').addEventListener('click', shuffleOpts);
document.getElementById('btnUndo').addEventListener('click', undo);
btnAdd.addEventListener('click', () => { addOpt(inputOption.value); inputOption.value=''; inputOption.focus(); });
inputOption.addEventListener('keydown', e => { if (e.key==='Enter') { addOpt(inputOption.value); inputOption.value=''; } });
document.querySelectorAll('.preset-tag').forEach(b => b.addEventListener('click', () => loadPreset(b.dataset.preset)));
btnClearHistory.addEventListener('click', () => { history=[]; saveHist(); renderHist(); showToast('已清空'); });
btnRetry.addEventListener('click', () => { resultOverlay.classList.remove('show'); setTimeout(()=>spin(),250); });
btnShare.addEventListener('click', share);
btnClose.addEventListener('click', () => resultOverlay.classList.remove('show'));
resultOverlay.addEventListener('click', e => { if (e.target===resultOverlay) resultOverlay.classList.remove('show'); });
document.addEventListener('keydown', e => {
  if (e.key===' ' && !isSpinning && document.activeElement!==inputOption) { e.preventDefault(); spin(); }
});

// Init
loadOpts(); loadHist();
renderOpts(); renderHist();
drawWheel(currentAngle);
})();
</script>
</body>
</html>
