<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 课堂语音笔记助手 - 可体验 Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            min-height: 100vh;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 32px 16px;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.12);
        }
        .hidden { display: none !important; }

        h1 { font-size: 26px; color: #0a2540; margin-bottom: 6px; }
        .subtitle { color: #5a6b7b; font-size: 14px; margin-bottom: 20px; }

        .step-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 24px;
            position: relative;
        }
        .step-bar::before {
            content: '';
            position: absolute;
            top: 14px;
            left: 10%;
            right: 10%;
            height: 3px;
            background: #e0e0e0;
            z-index: 0;
        }
        .step {
            position: relative;
            z-index: 1;
            text-align: center;
            width: 20%;
        }
        .step-circle {
            width: 32px;
            height: 32px;
            background: #e0e0e0;
            color: #888;
            border-radius: 50%;
            margin: 0 auto 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.3s;
        }
        .step.active .step-circle {
            background: linear-gradient(135deg, #4facfe, #00c6fb);
            color: #fff;
        }
        .step-label { font-size: 12px; color: #888; }
        .step.active .step-label { color: #0a2540; font-weight: 600; }

        .panel {}
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444;
            font-size: 14px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #4facfe;
        }
        .form-group textarea { resize: vertical; min-height: 140px; }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #4facfe, #00c6fb);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 172, 254, 0.35);
        }
        .btn-block { width: 100%; }
        .btn-secondary {
            background: #f0f9ff;
            color: #0a2540;
            border: 1px solid #d0e8ff;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin: 24px 0 16px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 8px;
        }
        .tab {
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #666;
            transition: all 0.2s;
        }
        .tab.active {
            background: #e6f4ff;
            color: #0a2540;
            font-weight: 600;
        }

        .result-section {
            margin-bottom: 20px;
        }
        .result-section h3 {
            font-size: 16px;
            color: #0a2540;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .result-box {
            background: #f6fbff;
            border-radius: 12px;
            padding: 16px;
            font-size: 14px;
            color: #444;
        }

        .keypoint-list {
            list-style: none;
        }
        .keypoint-list li {
            padding: 10px 12px;
            background: #fff;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
            border-left: 3px solid #4facfe;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }
        .k-card {
            background: #fff;
            border-radius: 10px;
            padding: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .k-card h4 {
            font-size: 14px;
            color: #0a2540;
            margin-bottom: 6px;
        }
        .k-card p {
            font-size: 13px;
            color: #666;
        }

        .mindmap {
            background: #f6fbff;
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
        }
        .mindmap-node {
            background: #fff;
            border: 2px solid #4facfe;
            border-radius: 10px;
            padding: 10px 14px;
            display: inline-block;
            margin: 6px;
            font-size: 13px;
            color: #0a2540;
        }
        .mindmap-center {
            background: linear-gradient(135deg, #4facfe, #00c6fb);
            color: #fff;
            border: none;
            font-weight: 600;
        }

        .todo-list {
            list-style: none;
        }
        .todo-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: #fff;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .todo-list li input { accent-color: #4facfe; }

        .quiz-item {
            background: #fff;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .quiz-item p { font-size: 14px; margin-bottom: 8px; }
        .quiz-options label {
            display: block;
            padding: 8px 10px;
            margin-bottom: 6px;
            background: #f6fbff;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        .quiz-options label:hover { background: #e6f4ff; }
        .quiz-feedback {
            font-size: 13px;
            margin-top: 8px;
            font-weight: 600;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 5px solid #f0f0f0;
            border-top: 5px solid #4facfe;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .loading-text { text-align: center; color: #555; }
        .loading-sub { text-align: center; font-size: 13px; color: #888; margin-top: 6px; }

        .preset-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .preset-btns button {
            padding: 6px 12px;
            font-size: 12px;
            background: #f0f9ff;
            border: 1px solid #d0e8ff;
            border-radius: 6px;
            cursor: pointer;
            color: #0a2540;
        }
        .preset-btns button:hover { background: #e6f4ff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>AI 课堂语音笔记助手</h1>
            <p class="subtitle">语音转写 → AI 结构化 → 摘要 / 重点 / 卡片 / 导图 / 复习题</p>

            <div class="step-bar">
                <div class="step active" id="step1"><div class="step-circle">1</div><div class="step-label">输入内容</div></div>
                <div class="step" id="step2"><div class="step-circle">2</div><div class="step-label">AI 分析</div></div>
                <div class="step" id="step3"><div class="step-circle">3</div><div class="step-label">生成笔记</div></div>
                <div class="step" id="step4"><div class="step-circle">4</div><div class="step-label">复习巩固</div></div>
            </div>

            <!-- 输入页 -->
            <div id="input-panel">
                <div class="form-group">
                    <label>选择示例或输入课堂/会议转录文字</label>
                    <div class="preset-btns">
                        <button data-preset="meeting">项目会议示例</button>
                        <button data-preset="class">课堂讲解示例</button>
                        <button data-preset="lecture">学术报告示例</button>
                    </div>
                    <textarea id="transcript" placeholder="请粘贴课堂或会议的语音转录文字，AI 将自动生成结构化笔记..."></textarea>
                </div>
                <button class="btn btn-block" id="analyze-btn">开始 AI 分析</button>
            </div>

            <!-- 加载页 -->
            <div id="loading-panel" class="hidden">
                <div class="spinner"></div>
                <div class="loading-text">AI 正在分析语音内容…</div>
                <div class="loading-sub">提取摘要 · 识别重点 · 生成知识卡片 · 构建思维导图 · 创建复习题</div>
            </div>

            <!-- 结果页 -->
            <div id="result-panel" class="hidden">
                <div class="tabs">
                    <div class="tab active" data-tab="summary">摘要与重点</div>
                    <div class="tab" data-tab="cards">知识卡片</div>
                    <div class="tab" data-tab="mindmap">思维导图</div>
                    <div class="tab" data-tab="todo">待办与复习</div>
                </div>

                <div id="summary-tab" class="tab-panel">
                    <div class="result-section">
                        <h3>📝 一句话摘要</h3>
                        <div class="result-box" id="summary-box"></div>
                    </div>
                    <div class="result-section">
                        <h3>⭐ 核心要点</h3>
                        <ul class="keypoint-list" id="keypoints"></ul>
                    </div>
                </div>

                <div id="cards-tab" class="tab-panel hidden">
                    <div class="result-section">
                        <h3>🎴 关键概念卡片</h3>
                        <div class="card-grid" id="cards-box"></div>
                    </div>
                </div>

                <div id="mindmap-tab" class="tab-panel hidden">
                    <div class="result-section">
                        <h3>🧠 思维导图</h3>
                        <div class="mindmap" id="mindmap-box"></div>
                    </div>
                </div>

                <div id="todo-tab" class="tab-panel hidden">
                    <div class="result-section">
                        <h3>✅ 待办事项</h3>
                        <ul class="todo-list" id="todo-box"></ul>
                    </div>
                    <div class="result-section">
                        <h3>❓ 自测复习题</h3>
                        <div id="quiz-box"></div>
                    </div>
                </div>

                <div style="text-align:center;margin-top:24px;">
                    <button class="btn btn-secondary" id="restart-btn">重新分析</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const presets = {
            meeting: `今天的项目周会主要讨论了 Q3 产品迭代计划。产品经理小明提出，需要在 8 月底前完成用户反馈模块的上线，重点解决三个问题：反馈入口不明显、分类标签混乱、处理进度不可见。后端负责人李华说，API 接口预计在两周内完成，但需要前端提前确认字段格式。设计师王芳展示了新的交互原型，大家一致认为需要在移动端增加语音输入反馈的功能。最后，项目经理确认了下周的里程碑：完成需求评审、出技术方案、设计稿定稿。会议还提到，需要建立用户反馈的闭环机制，每条反馈都要有处理结果通知。`,
            class: `今天这节课我们讲牛顿第二定律。牛顿第二定律的公式是 F 等于 ma，其中 F 是物体所受的合外力，m 是物体的质量，a 是加速度。需要注意的是，力和加速度都是矢量，它们的方向相同。我们来看一个例子：一个质量为 2 千克的物体，受到 10 牛顿的水平拉力，忽略摩擦力，求它的加速度。根据 F=ma，a 等于 F 除以 m，也就是 10 除以 2，等于 5 米每二次方秒，方向与拉力方向相同。接下来大家要重点理解合外力的概念，以及质量是惯性大小的量度。课后请完成练习册第 12 页的第 3、5、7 题。`,
            lecture: `本次讲座主题是人工智能伦理。主讲人首先介绍了 AI 技术发展的三个阶段：规则系统、机器学习和大模型时代。随后重点讨论了三个伦理风险：第一是数据隐私，大模型训练需要海量数据，可能泄露个人信息；第二是算法偏见，训练数据的不平衡会导致模型对特定群体不公平；第三是就业替代，自动化可能影响低技能劳动者。主讲人强调，解决这些问题需要多方协作，包括政府监管、企业自律和公众教育。最后提出一个核心观点：技术应该服务于人，而不是让人适应技术。`
        };

        document.querySelectorAll('[data-preset]').forEach(btn => {
            btn.addEventListener('click', function() {
                document.getElementById('transcript').value = presets[this.dataset.preset];
            });
        });

        function setStep(n) {
            for (let i = 1; i <= 4; i++) {
                document.getElementById('step' + i).classList.toggle('active', i <= n);
            }
        }

        document.getElementById('analyze-btn').addEventListener('click', function() {
            const text = document.getElementById('transcript').value.trim();
            if (!text) {
                alert('请先输入课堂或会议转录文字');
                return;
            }

            document.getElementById('input-panel').classList.add('hidden');
            document.getElementById('loading-panel').classList.remove('hidden');
            setStep(2);

            setTimeout(() => {
                generateResult(text);
                document.getElementById('loading-panel').classList.add('hidden');
                document.getElementById('result-panel').classList.remove('hidden');
                setStep(4);
            }, 2000);
        });

        function generateResult(text) {
            const sentences = text.split(/[。；!！?？\n]+/).filter(s => s.trim().length > 5);
            const summary = sentences.length > 0 ? sentences[0] + '。' : text.substring(0, 80) + '…';

            // 摘要：取第一句 + 主题判断
            let finalSummary = summary;
            if (text.includes('项目') || text.includes('会议') || text.includes('里程碑')) {
                finalSummary = '本次会议围绕项目推进展开，明确了关键任务、负责人与时间节点，强调了闭环反馈机制。';
            } else if (text.includes('牛顿') || text.includes('公式') || text.includes('练习册')) {
                finalSummary = '本节课讲解牛顿第二定律 F=ma，强调力与加速度的矢量关系，并通过例题巩固应用方法。';
            } else if (text.includes('AI') || text.includes('人工智能') || text.includes('伦理')) {
                finalSummary = '本次讲座探讨人工智能伦理，重点关注数据隐私、算法偏见与就业替代三大风险及治理思路。';
            }
            document.getElementById('summary-box').textContent = finalSummary;

            // 核心要点
            const keypoints = [
                '主题/核心议题清晰，便于快速把握内容方向',
                '关键结论或行动项已提取，可直接进入执行或复习',
                '涉及多个相关概念/任务，需要结构化整理'
            ];
            // 根据文本长度和句子数生成更具体的要点
            const extraPoints = sentences.slice(1, 4).map(s => s.trim()).filter(s => s.length > 8);
            const allPoints = extraPoints.length >= 2 ? extraPoints.slice(0, 3) : keypoints;
            const ul = document.getElementById('keypoints');
            ul.innerHTML = '';
            allPoints.forEach(p => {
                const li = document.createElement('li');
                li.textContent = p + '。';
                ul.appendChild(li);
            });

            // 知识卡片
            const cards = [
                { title: '核心概念', content: extractKeyword(text) },
                { title: '关键数字/时间', content: extractNumbers(text) },
                { title: '主要角色/对象', content: extractEntities(text) },
                { title: '行动要求', content: extractActions(text) }
            ];
            const cardsBox = document.getElementById('cards-box');
            cardsBox.innerHTML = '';
            cards.forEach(c => {
                const div = document.createElement('div');
                div.className = 'k-card';
                div.innerHTML = '<h4>' + c.title + '</h4><p>' + c.content + '</p>';
                cardsBox.appendChild(div);
            });

            // 思维导图
            const mindmapBox = document.getElementById('mindmap-box');
            const center = document.createElement('div');
            center.className = 'mindmap-node mindmap-center';
            center.textContent = '核心主题';
            mindmapBox.innerHTML = '';
            mindmapBox.appendChild(center);
            const branches = ['摘要', '重点', '概念', '待办', '复习'];
            branches.forEach(b => {
                const node = document.createElement('div');
                node.className = 'mindmap-node';
                node.textContent = b;
                mindmapBox.appendChild(node);
            });

            // 待办
            const todos = generateTodos(text);
            const todoBox = document.getElementById('todo-box');
            todoBox.innerHTML = '';
            todos.forEach(t => {
                const li = document.createElement('li');
                li.innerHTML = '<input type="checkbox"> <span>' + t + '</span>';
                todoBox.appendChild(li);
            });

            // 复习题
            const quizBox = document.getElementById('quiz-box');
            quizBox.innerHTML = '';
            const quizzes = generateQuizzes(text);
            quizzes.forEach((q, idx) => {
                const div = document.createElement('div');
                div.className = 'quiz-item';
                div.innerHTML = '<p><strong>Q' + (idx + 1) + '.</strong> ' + q.question + '</p>' +
                    '<div class="quiz-options">' +
                        q.options.map((opt, i) => '<label><input type="radio" name="quiz' + idx + '" value="' + i + '"> ' + opt + '</label>').join('') +
                    '</div>' +
                    '<div class="quiz-feedback hidden" id="feedback' + idx + '"></div>';
                quizBox.appendChild(div);

                const radios = div.querySelectorAll('input[type="radio"]');
                radios.forEach(r => {
                    r.addEventListener('change', function() {
                        const fb = document.getElementById('feedback' + idx);
                        if (parseInt(this.value) === q.answer) {
                            fb.textContent = '✅ 回答正确！' + q.explanation;
                            fb.style.color = '#11998e';
                        } else {
                            fb.textContent = '❌ 再想想。' + q.explanation;
                            fb.style.color = '#e74c3c';
                        }
                        fb.classList.remove('hidden');
                    });
                });
            });
        }

        function extractKeyword(text) {
            if (text.includes('牛顿')) return '牛顿第二定律：F = ma';
            if (text.includes('AI') || text.includes('人工智能')) return '人工智能伦理';
            if (text.includes('项目')) return '项目迭代与反馈闭环';
            return '核心概念需结合上下文理解';
        }

        function extractNumbers(text) {
            const nums = text.match(/\d+[个月周天秒次页]*|[一二三四五六七八九十]+[个页]*/g);
            return nums ? nums.slice(0, 3).join('、') : '未提取到关键数字';
        }

        function extractEntities(text) {
            const names = text.match(/[\u4e00-\u9fa5]{2,4}(?=提出|说|展示|负责|确认|强调)/g);
            return names ? [...new Set(names)].slice(0, 3).join('、') : '主讲人/参会人员/相关对象';
        }

        function extractActions(text) {
            const actions = [];
            if (text.includes('完成')) actions.push('完成指定任务');
            if (text.includes('讨论')) actions.push('参与讨论并确认方案');
            if (text.includes('练习') || text.includes('题')) actions.push('完成课后练习');
            if (text.includes('评审')) actions.push('参加评审会议');
            if (actions.length === 0) actions.push('回顾并整理要点');
            return actions.join('、');
        }

        function generateTodos(text) {
            const todos = ['回顾今日生成的结构化笔记，补充个人理解'];
            if (text.includes('完成') || text.includes('任务')) todos.push('梳理会议/课程中的行动项并设置截止日期');
            if (text.includes('练习') || text.includes('题')) todos.push('完成课后练习并录入错题本复盘');
            if (text.includes('方案') || text.includes('设计')) todos.push('跟进方案/设计稿的评审与确认');
            if (text.includes('风险') || text.includes('问题')) todos.push('针对识别的风险制定应对措施');
            return todos.slice(0, 4);
        }

        function generateQuizzes(text) {
            if (text.includes('牛顿')) {
                return [
                    { question: '牛顿第二定律的公式是什么？', options: ['F = mv', 'F = ma', 'F = mg', 'F = m/a'], answer: 1, explanation: '牛顿第二定律：物体加速度与合外力成正比，与质量成反比，即 F = ma。' },
                    { question: '力和加速度的方向关系是？', options: ['相反', '垂直', '相同', '无关'], answer: 2, explanation: '合外力与加速度方向相同。' }
                ];
            }
            if (text.includes('AI') || text.includes('人工智能')) {
                return [
                    { question: '本次讲座提到的 AI 伦理风险不包括？', options: ['数据隐私', '算法偏见', '就业替代', '能源消耗'], answer: 3, explanation: '讲座重点讨论了数据隐私、算法偏见和就业替代三大风险。' },

                document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));

        });
