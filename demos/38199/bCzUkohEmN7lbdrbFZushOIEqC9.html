<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档树管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .left-panel {
            width: 30%;
            min-width: 250px;
            max-width: 400px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 16px;
            background: #1890ff;
            color: #fff;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header button {
            padding: 4px 12px;
            background: #fff;
            color: #1890ff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .panel-header button:hover {
            background: #f0f0f0;
        }

        .tree-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .tree-node {
            cursor: pointer;
            user-select: none;
        }

        .tree-node-content {
            display: flex;
            align-items: center;
            padding: 6px 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .tree-node-content:hover {
            background: #f0f0f0;
        }

        .tree-node-content.selected {
            background: #e6f7ff;
            color: #1890ff;
        }

        .tree-arrow {
            width: 16px;
            height: 16px;
            margin-right: 4px;
            transition: transform 0.2s;
        }

        .tree-arrow.expanded {
            transform: rotate(90deg);
        }

        .tree-arrow.hidden {
            visibility: hidden;
        }

        .tree-icon {
            width: 18px;
            height: 18px;
            margin-right: 6px;
        }

        .tree-label {
            font-size: 14px;
        }

        .tree-children {
            margin-left: 20px;
            display: none;
        }

        .tree-children.expanded {
            display: block;
        }

        .right-panel {
            flex: 1;
            background: #fff;
            display: flex;
            flex-direction: column;
        }

        .table-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background: #fafafa;
            font-weight: bold;
            color: #333;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .type-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .type-video { background: #fff1e6; color: #fa8c16; }
        .type-image { background: #e6f7ff; color: #1890ff; }
        .type-pdf { background: #fff1f0; color: #ff4d4f; }

        .action-btn {
            padding: 4px 8px;
            margin-right: 4px;
            border: 1px solid #d9d9d9;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .action-btn:hover {
            color: #1890ff;
            border-color: #1890ff;
        }

        .add-doc-panel {
            padding: 16px;
            background: #fafafa;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .add-btn {
            padding: 8px 16px;
            border: 1px dashed #d9d9d9;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .add-btn:hover {
            border-color: #1890ff;
            color: #1890ff;
        }

        .add-btn svg {
            width: 18px;
            height: 18px;
        }

        .preview-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .preview-modal.active {
            display: flex;
        }

        .preview-content {
            max-width: 90%;
            max-height: 90%;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
        }

        .preview-header {
            padding: 12px 16px;
            background: #333;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preview-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
        }

        .preview-body {
            padding: 16px;
            max-height: 80vh;
            overflow: auto;
        }

        .preview-body img {
            max-width: 100%;
            max-height: 70vh;
        }

        .preview-body video {
            max-width: 100%;
            max-height: 70vh;
        }

        .preview-body iframe {
            width: 800px;
            height: 600px;
            border: none;
        }

        .empty-tip {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-tip svg {
            width: 80px;
            height: 80px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .preview-btn {
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .preview-btn:hover {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.3);
        }

        .preview-btn-close {
            background: rgba(24, 144, 255, 0.3);
            border-color: rgba(24, 144, 255, 0.5);
        }

        .preview-btn-close:hover {
            background: rgba(24, 144, 255, 0.5);
            border-color: rgba(24, 144, 255, 0.7);
        }

        .file-preview-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 48px 64px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .file-preview-icon {
            margin-bottom: 24px;
        }

        .file-preview-icon svg {
            width: 96px;
            height: 96px;
        }

        .file-preview-title {
            font-size: 20px;
            color: #fff;
            margin-bottom: 8px;
        }

        .file-preview-meta {
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            margin-top: 16px;
        }

        .file-preview-meta span {
            margin: 0 12px;
        }

        .edit-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1001;
            justify-content: center;
            align-items: center;
        }

        .edit-modal.active {
            display: flex;
        }

        .edit-form {
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            width: 400px;
        }

        .edit-form h3 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #666;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #1890ff;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        .form-actions button {
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-cancel {
            background: #fff;
            border: 1px solid #d9d9d9;
            color: #666;
        }

        .btn-cancel:hover {
            color: #333;
            border-color: #333;
        }

        .btn-save {
            background: #1890ff;
            border: 1px solid #1890ff;
            color: #fff;
        }

        .btn-save:hover {
            background: #40a9ff;
            border-color: #40a9ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <div class="panel-header">
                <span>文档结构</span>
                <button onclick="addFolder()">+ 新建文件夹</button>
            </div>
            <div class="tree-container" id="treeContainer"></div>
        </div>

        <div class="right-panel">
            <div class="panel-header">
                <span id="currentNodeName">文档内容</span>
                <span id="docCount">共 0 条</span>
            </div>
            <div id="filePreviewContainer" style="display: none; flex: 1; flex-direction: column; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);">
                <div style="padding: 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center;">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <div id="previewFileIcon" style="width: 40px; height: 40px; border-radius: 8px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center;"></div>
                        <span id="previewFileName" style="color: #fff; font-size: 18px; font-weight: 500;"></span>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button class="preview-btn" onclick="previewCurrentFile()">预览</button>
                        <button class="preview-btn" onclick="downloadCurrentFile()">下载</button>
                        <button class="preview-btn" onclick="editCurrentFile()">编辑</button>
                        <button class="preview-btn" onclick="deleteCurrentFile()">删除</button>
                        <button class="preview-btn preview-btn-close" onclick="closeFilePreview()">关闭预览</button>
                    </div>
                </div>
                <div id="filePreviewArea" style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px;"></div>
            </div>
            <div id="folderViewContainer">
                <div class="search-bar" style="padding: 12px 16px; border-bottom: 1px solid #e0e0e0; display: flex; gap: 8px; align-items: center;">
                    <input type="text" id="searchInput" placeholder="搜索文档名称..." oninput="filterDocs()" style="flex: 1; padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px;">
                    <button onclick="filterDocs()" style="padding: 8px 16px; background: #fff; border: 1px solid #d9d9d9; border-radius: 4px; cursor: pointer; font-size: 14px;">搜索</button>
                    <button onclick="openAddDocModal()" style="padding: 8px 16px; background: #1890ff; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px;">+ 添加文档</button>
                </div>
                <div class="table-container">
                    <table id="docTable">
                        <thead>
                            <tr>
                                <th>文档名称</th>
                                <th>文档类型</th>
                                <th>上传时间</th>
                                <th>上传者</th>
                                <th>大小</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="docTableBody"></tbody>
                    </table>
                    <div class="empty-tip" id="emptyTip" style="display:none;">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-5-7l-3 3.72L9 13l-3 4h12l-4-5z"/></svg>
                        <p>请选择左侧树节点查看文档</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="preview-modal" id="previewModal">
        <div class="preview-content">
            <div class="preview-header">
                <span id="previewTitle">预览</span>
                <button class="preview-close" onclick="closePreview()">&times;</button>
            </div>
            <div class="preview-body" id="previewBody"></div>
        </div>
    </div>

    <div class="edit-modal" id="editModal">
        <div class="edit-form">
            <h3 id="editFormTitle">编辑文档</h3>
            <input type="hidden" id="editDocId">
            <div class="form-group">
                <label>文档名称</label>
                <input type="text" id="editDocName">
            </div>
            <div class="form-group">
                <label>文档类型</label>
                <select id="editDocType">
                    <option value="video">视频</option>
                    <option value="image">图片</option>
                    <option value="pdf">PDF</option>
                </select>
            </div>
            <div class="form-group">
                <label>上传者</label>
                <input type="text" id="editDocUploader">
            </div>
            <div class="form-group">
                <label>大小</label>
                <input type="text" id="editDocSize">
            </div>
            <div class="form-group">
                <label>上传文件</label>
                <input type="file" id="editDocFile" style="padding: 4px 0;">
            </div>
            <div class="form-actions">
                <button class="btn-cancel" onclick="closeEditModal()">取消</button>
                <button class="btn-save" onclick="saveDocEdit()">保存</button>
            </div>
        </div>
    </div>

    <div class="edit-modal" id="addDocModal">
        <div class="edit-form">
            <h3 id="addDocFormTitle">添加文档</h3>
            <input type="hidden" id="addDocId">
            <div class="form-group">
                <label>文档名称</label>
                <input type="text" id="addDocName">
            </div>
            <div class="form-group">
                <label>文档类型</label>
                <select id="addDocType">
                    <option value="video">视频</option>
                    <option value="image">图片</option>
                    <option value="pdf">PDF</option>
                </select>
            </div>
            <div class="form-group">
                <label>上传者</label>
                <input type="text" id="addDocUploader">
            </div>
            <div class="form-group">
                <label>上传文件</label>
                <input type="file" id="addDocFile" style="padding: 4px 0;">
            </div>
            <div class="form-actions">
                <button class="btn-cancel" onclick="closeAddDocModal()">取消</button>
                <button class="btn-save" onclick="saveAddDoc()">保存</button>
            </div>
        </div>
    </div>

    <script>
        const staticData = {

                                { id: 122, name: 'API接口文档.pdf', type: 'pdf', size: '1.5MB', uploader: '赵六', date: '2024-01-22' }
                            ]
                        },

                    ]
                },
                {

                                { id: 212, name: '培训现场照片.jpg', type: 'image', size: '3.2MB', uploader: 'HR小王', date: '2024-01-12' },

                            ]

        };

        let selectedNodeId = null;
        let currentDocs = [
            { id: 111, name: '用户调研报告.pdf', type: 'pdf', size: '2.4MB', uploader: '张三', date: '2024-01-15' },
            { id: 112, name: '功能原型图.png', type: 'image', size: '1.8MB', uploader: '李四', date: '2024-01-16' },
            { id: 121, name: '技术架构设计.pdf', type: 'pdf', size: '3.2MB', uploader: '王五', date: '2024-01-20' },
            { id: 122, name: 'API接口文档.pdf', type: 'pdf', size: '1.5MB', uploader: '赵六', date: '2024-01-22' },
            { id: 131, name: '产品介绍视频.mp4', type: 'video', size: '45MB', uploader: '市场部', date: '2024-02-01' },
            { id: 132, name: '使用教程视频.mp4', type: 'video', size: '120MB', uploader: '技术部', date: '2024-02-05' },
            { id: 211, name: '新员工手册.pdf', type: 'pdf', size: '5.6MB', uploader: 'HR小王', date: '2024-01-10' },
            { id: 212, name: '培训现场照片.jpg', type: 'image', size: '3.2MB', uploader: 'HR小王', date: '2024-01-12' },
            { id: 321, name: 'APP界面设计.png', type: 'image', size: '4.5MB', uploader: 'UI设计师', date: '2024-02-08' },
            { id: 322, name: '图标素材包.svg', type: 'image', size: '2.1MB', uploader: 'UI设计师', date: '2024-02-09' }
        ];
        let allDocs = [...currentDocs];
        let selectedFileNode = null;

        function renderTree(data, container, level = 0) {
            data.forEach(node => {
                if (node.type !== 'folder') return;

                const hasChildren = node.children && node.children.some(child => child.type === 'folder');
                const nodeDiv = document.createElement('div');
                nodeDiv.className = 'tree-node';
                nodeDiv.dataset.id = node.id;

                const icon = '<svg class="tree-icon" viewBox="0 0 24 24" fill="#1890ff"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>';

                nodeDiv.innerHTML = `
                    <div class="tree-node-content" onclick="selectNode(${node.id}, event)">
                        <svg class="tree-arrow ${hasChildren ? '' : 'hidden'}" onclick="toggleNode(this, event)">
                            <path d="M8 4l4 4-4 4" fill="none" stroke="#999" stroke-width="2"/>
                        </svg>
                        ${icon}
                        <span class="tree-label">${node.name}</span>
                    </div>
                    ${hasChildren ? `<div class="tree-children"></div>` : ''}
                `;

                container.appendChild(nodeDiv);

                if (hasChildren && node.children) {
                    const childrenContainer = nodeDiv.querySelector('.tree-children');
                    renderTree(node.children, childrenContainer, level + 1);
                }
            });
        }

        function getFileIcon(type) {
            const icons = {
                pdf: '<svg class="tree-icon" viewBox="0 0 24 24" fill="#ff4d4f"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8.5 7.5c0 .83-.67 1.5-1.5 1.5H9v2H7.5V7H10c.83 0 1.5.67 1.5 1.5v1zm5 2c0 .83-.67 1.5-1.5 1.5h-2.5V7H15c.83 0 1.5.67 1.5 1.5v3zm4-3H19v1h1.5V11H19v2h-1.5V7h3v1.5zM9 9.5h1v-1H9v1zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm10 5.5h1v-3h-1v3z"/></svg>',
                video: '<svg class="tree-icon" viewBox="0 0 24 24" fill="#fa8c16"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>',
                image: '<svg class="tree-icon" viewBox="0 0 24 24" fill="#1890ff"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>'
            };
            return icons[type] || icons.pdf;
        }

        function toggleNode(arrow, event) {
            event.stopPropagation();
            const children = arrow.parentElement.nextElementSibling;
            if (children && children.classList.contains('tree-children')) {
                arrow.classList.toggle('expanded');
                children.classList.toggle('expanded');
            }
        }

        function selectNode(id, event) {
            event.stopPropagation();
            document.querySelectorAll('.tree-node-content').forEach(el => el.classList.remove('selected'));
            event.currentTarget.classList.add('selected');
            selectedNodeId = id;

            const node = findNodeById(staticData.treeData, id);
            if (node) {
                if (node.type !== 'folder') {
                    selectedFileNode = node;
                    showFilePreview(node);
                } else {
                    selectedFileNode = null;
                    allDocs = (node.children || []).filter(doc => doc.type !== 'folder');
                    currentDocs = [...allDocs];
                    document.getElementById('currentNodeName').textContent = node.name;
                    document.getElementById('searchInput').value = '';
                    document.getElementById('filePreviewContainer').style.display = 'none';
                    document.getElementById('folderViewContainer').style.display = 'block';
                    renderTable();
                }
            }
        }

        function findNodeById(data, id) {
            for (const node of data) {
                if (node.id === id) return node;
                if (node.children) {
                    const found = findNodeById(node.children, id);
                    if (found) return found;
                }
            }
            return null;
        }

        function renderTable() {
            const tbody = document.getElementById('docTableBody');
            const emptyTip = document.getElementById('emptyTip');
            const addDocPanel = document.getElementById('addDocPanel');

            if (!selectedNodeId) {
                tbody.innerHTML = '';
                emptyTip.style.display = 'block';
                addDocPanel.style.display = 'none';
                document.getElementById('docCount').textContent = '共 0 条';
                return;
            }

            const node = findNodeById(staticData.treeData, selectedNodeId);
            if (node && node.type === 'folder') {
                const fileDocs = (node.children || []).filter(doc => doc.type !== 'folder');

                if (fileDocs.length === 0) {
                    tbody.innerHTML = '';
                    emptyTip.style.display = 'block';
                    emptyTip.querySelector('p').textContent = '该文件夹暂无文档，请添加';
                    document.getElementById('docCount').textContent = '共 0 条';
                    return;
                }

                emptyTip.style.display = 'none';
                document.getElementById('docCount').textContent = `共 ${fileDocs.length} 条`;

                tbody.innerHTML = fileDocs.map(doc => `
                    <tr>
                        <td>${doc.name}</td>
                        <td><span class="type-badge type-${doc.type}">${getTypeName(doc.type)}</span></td>
                        <td>${doc.date}</td>
                        <td>${doc.uploader}</td>
                        <td>${doc.size}</td>
                        <td>
                            <button class="action-btn" onclick="previewDoc('${doc.type}', '${doc.name}')">预览</button>
                            <button class="action-btn" onclick="downloadDoc('${doc.name}')">下载</button>
                            <button class="action-btn" onclick="editDoc(${doc.id})">编辑</button>
                            <button class="action-btn" onclick="deleteDoc(${doc.id})">删除</button>
                        </td>
                    </tr>
                `).join('');
            }
        }

        function filterDocs() {
            const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            const fileDocs = allDocs.filter(doc => doc.type !== 'folder');
            if (keyword) {
                currentDocs = fileDocs.filter(doc => doc.name.toLowerCase().includes(keyword));
            } else {
                currentDocs = [...fileDocs];
            }
            renderTable();
        }

        function getTypeName(type) {
            const types = { video: '视频', image: '图片', pdf: 'PDF' };
            return types[type] || '未知';
        }

        function showFilePreview(node) {
            document.getElementById('filePreviewContainer').style.display = 'flex';
            document.getElementById('folderViewContainer').style.display = 'none';

            const typeColors = { video: '#fa8c16', image: '#1890ff', pdf: '#ff4d4f' };
            const typeIcons = {
                video: '<svg width="96" height="96" viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>',
                image: '<svg width="96" height="96" viewBox="0 0 24 24" fill="currentColor"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>',
                pdf: '<svg width="96" height="96" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8.5 7.5c0 .83-.67 1.5-1.5 1.5H9v2H7.5V7H10c.83 0 1.5.67 1.5 1.5v1zm5 2c0 .83-.67 1.5-1.5 1.5h-2.5V7H15c.83 0 1.5.67 1.5 1.5v3zm4-3H19v1h1.5V11H19v2h-1.5V7h3v1.5zM9 9.5h1v-1H9v1zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm10 5.5h1v-3h-1v3z"/></svg>'
            };

            document.getElementById('previewFileName').textContent = node.name;
            document.getElementById('previewFileIcon').innerHTML = typeIcons[node.type] || '';
            document.getElementById('previewFileIcon').style.color = typeColors[node.type] || '#999';

            const typeNames = { video: '视频', image: '图片', pdf: 'PDF' };
            const previewArea = document.getElementById('filePreviewArea');
            previewArea.innerHTML = `
                <div class="file-preview-card">
                    <div class="file-preview-icon" style="color: ${typeColors[node.type] || '#999'};">
                        ${typeIcons[node.type] || ''}
                    </div>
                    <div class="file-preview-title">${node.name}</div>
                    <div style="color: ${typeColors[node.type] || '#999'}; font-size: 14px; margin-top: 4px;">${typeNames[node.type] || '未知'}文件</div>
                    <div class="file-preview-meta">
                        <span>大小: ${node.size}</span>
                        <span>|</span>
                        <span>上传者: ${node.uploader}</span>
                        <span>|</span>
                        <span>时间: ${node.date}</span>
                    </div>
                </div>
            `;
        }

        function previewCurrentFile() {
            if (!selectedFileNode) return;
            openPreview(selectedFileNode.name, selectedFileNode.type);
        }

        function downloadCurrentFile() {
            if (!selectedFileNode) return;
            alert(`下载功能: ${selectedFileNode.name}`);
        }

        function closeFilePreview() {
            selectedFileNode = null;
            document.getElementById('filePreviewContainer').style.display = 'none';
            document.getElementById('folderViewContainer').style.display = 'block';
            if (selectedNodeId) {
                const node = findNodeById(staticData.treeData, selectedNodeId);
                if (node && node.type === 'folder') {
                    renderTable();
                }
            }
        }

        function editCurrentFile() {
            if (!selectedFileNode) return;
            document.getElementById('editDocId').value = selectedFileNode.id;
            document.getElementById('editDocName').value = selectedFileNode.name;
            document.getElementById('editDocType').value = selectedFileNode.type;
            document.getElementById('editDocUploader').value = selectedFileNode.uploader;
            document.getElementById('editDocSize').value = selectedFileNode.size;
            document.getElementById('editFormTitle').textContent = '编辑文档';
            document.getElementById('editModal').classList.add('active');
        }

        function deleteCurrentFile() {
            if (!selectedFileNode) return;
            if (confirm('确定要删除这个文档吗？')) {
                deleteDocFromTree(selectedFileNode.id);
                closeFilePreview();
            }
        }

        function deleteDocFromTree(id) {
            function removeFromTree(nodes) {
                for (let i = 0; i < nodes.length; i++) {
                    if (nodes[i].id === id) {
                        nodes.splice(i, 1);
                        return true;
                    }
                    if (nodes[i].children && removeFromTree(nodes[i].children)) {
                        return true;
                    }
                }
                return false;
            }
            removeFromTree(staticData.treeData);
            if (selectedNodeId) {
                const node = findNodeById(staticData.treeData, selectedNodeId);
                if (node && node.type === 'folder') {
                    allDocs = node.children || [];
                    currentDocs = [...allDocs];
                    renderTable();
                }
            }
        }

        function previewDoc(type, name) {
            const modal = document.getElementById('previewModal');
            const title = document.getElementById('previewTitle');
            const body = document.getElementById('previewBody');

            title.textContent = name;

            if (type === 'image') {
                body.innerHTML = `<img src="https://via.placeholder.com/800x600?text=${encodeURIComponent(name)}" alt="${name}">`;
            } else if (type === 'video') {
                body.innerHTML = `<video controls src=""><source src="" type="video/mp4">您的浏览器不支持视频预览</video>`;
            } else if (type === 'pdf') {
                body.innerHTML = `<iframe src="https://via.placeholder.com/800x600?text=${encodeURIComponent(name)}"></iframe>`;
            }

            modal.classList.add('active');
        }

        function closePreview() {
            document.getElementById('previewModal').classList.remove('active');
        }

        function downloadDoc(name) {
            alert(`下载功能: ${name}`);
        }

        function editDoc(id) {
            const doc = currentDocs.find(d => d.id === id);
            if (doc) {
                document.getElementById('editDocId').value = doc.id;
                document.getElementById('editDocName').value = doc.name;
                document.getElementById('editDocType').value = doc.type;
                document.getElementById('editDocUploader').value = doc.uploader;
                document.getElementById('editDocSize').value = doc.size;
                document.getElementById('editFormTitle').textContent = '编辑文档';
                document.getElementById('editModal').classList.add('active');
            }
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        function saveDocEdit() {
            const id = parseInt(document.getElementById('editDocId').value);
            const name = document.getElementById('editDocName').value.trim();
            const type = document.getElementById('editDocType').value;
            const uploader = document.getElementById('editDocUploader').value.trim();
            const fileInput = document.getElementById('editDocFile');
            const file = fileInput.files[0];
            let size = document.getElementById('editDocSize').value.trim();

            if (!name) {
                alert('请输入文档名称');
                return;
            }

            if (file) {
                size = formatFileSize(file.size);
            }

            const docIndex = currentDocs.findIndex(d => d.id === id);
            if (docIndex !== -1) {
                currentDocs[docIndex] = { ...currentDocs[docIndex], name, type, uploader, size };
                const allIndex = allDocs.findIndex(d => d.id === id);
                if (allIndex !== -1) {
                    allDocs[allIndex] = { ...allDocs[allIndex], name, type, uploader, size };
                }
                renderTable();
            } else {
                updateNodeInTree(staticData.treeData, id, { name, type, uploader, size });
                if (selectedFileNode && selectedFileNode.id === id) {
                    selectedFileNode = { ...selectedFileNode, name, type, uploader, size };
                    document.getElementById('previewFileName').textContent = name;
                }
            }
            closeEditModal();
        }

        function updateNodeInTree(nodes, id, updates) {
            for (let node of nodes) {
                if (node.id === id) {
                    Object.assign(node, updates);
                    return true;
                }
                if (node.children && updateNodeInTree(node.children, id, updates)) {
                    return true;
                }
            }
            return false;
        }

        function deleteDoc(id) {
            if (confirm('确定要删除这个文档吗？')) {
                allDocs = allDocs.filter(doc => doc.id !== id);
                currentDocs = currentDocs.filter(doc => doc.id !== id);
                renderTable();
            }
        }

        function addDocument(type) {
            const types = { video: '视频', image: '图片', pdf: 'PDF' };
            const extensions = { video: 'mp4', image: 'png', pdf: 'pdf' };
            const name = prompt(`请输入${types[type]}文件名：`, `新文档.${extensions[type]}`);
            if (name) {
                const newDoc = {
                    id: Date.now(),
                    name: name,
                    type: type,
                    size: '0MB',
                    uploader: '当前用户',
                    date: new Date().toISOString().split('T')[0]
                };
                allDocs.push(newDoc);
                currentDocs.push(newDoc);
                renderTable();
            }
        }

        function openAddDocModal() {
            document.getElementById('addDocId').value = '';
            document.getElementById('addDocName').value = '';
            document.getElementById('addDocType').value = 'pdf';
            document.getElementById('addDocUploader').value = '当前用户';
            document.getElementById('addDocFile').value = '';
            document.getElementById('addDocFormTitle').textContent = '添加文档';
            document.getElementById('addDocModal').classList.add('active');
        }

        function closeAddDocModal() {
            document.getElementById('addDocModal').classList.remove('active');
        }

        function saveAddDoc() {
            const name = document.getElementById('addDocName').value.trim();
            const type = document.getElementById('addDocType').value;
            const uploader = document.getElementById('addDocUploader').value.trim();
            const fileInput = document.getElementById('addDocFile');
            const file = fileInput.files[0];

            if (!name) {
                alert('请输入文档名称');
                return;
            }

            const newDoc = {
                id: Date.now(),
                name: name,
                type: type,
                size: file ? formatFileSize(file.size) : '0MB',
                uploader: uploader || '当前用户',
                date: new Date().toISOString().split('T')[0]
            };

            allDocs.push(newDoc);
            currentDocs.push(newDoc);
            renderTable();
            closeAddDocModal();
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function addFolder() {
            const name = prompt('请输入文件夹名称：', '新建文件夹');
            if (name) {
                const newFolder = {
                    id: Date.now(),
                    name: name,
                    type: 'folder',
                    children: []
                };

                if (selectedNodeId) {
                    const selectedNode = findNodeById(staticData.treeData, selectedNodeId);
                    if (selectedNode) {
                        if (selectedNode.type !== 'folder') {
                            let parent = findParentNode(staticData.treeData, selectedNodeId);
                            if (parent) {
                                parent.children = parent.children || [];
                                parent.children.push(newFolder);
                            } else {
                                staticData.treeData.push(newFolder);
                            }
                        } else {
                            selectedNode.children = selectedNode.children || [];
                            selectedNode.children.push(newFolder);
                        }
                    } else {
                        staticData.treeData.push(newFolder);
                    }
                } else {
                    staticData.treeData.push(newFolder);
                }

                document.getElementById('treeContainer').innerHTML = '';
                renderTree(staticData.treeData, document.getElementById('treeContainer'));
                expandToNode(selectedNodeId);
            }
        }

        function findParentNode(nodes, childId) {
            for (const node of nodes) {
                if (node.children) {
                    for (const child of node.children) {
                        if (child.id === childId) {
                            return node;
                        }
                    }
                    const parent = findParentNode(node.children, childId);
                    if (parent) return parent;
                }
            }
            return null;
        }

        function expandToNode(nodeId) {
            if (!nodeId) return;
            const node = findNodeById(staticData.treeData, nodeId);
            if (!node) return;

            const parent = findParentNode(staticData.treeData, nodeId);
            if (parent) {
                const nodeElement = document.querySelector(`[data-id="${parent.id}"]`);
                if (nodeElement) {
                    const arrow = nodeElement.querySelector('.tree-arrow');
                    const children = nodeElement.querySelector('.tree-children');
                    if (arrow) arrow.classList.add('expanded');
                    if (children) children.classList.add('expanded');
                }
                expandToNode(parent.id);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderTree(staticData.treeData, document.getElementById('treeContainer'));
            document.querySelector('.tree-children')?.classList.add('expanded');
            document.querySelector('.tree-arrow')?.classList.add('expanded');
        });

        document.getElementById('previewModal').addEventListener('click', (e) => {
            if (e.target.id === 'previewModal') closePreview();
        });
    </script>
</body>
</html>
