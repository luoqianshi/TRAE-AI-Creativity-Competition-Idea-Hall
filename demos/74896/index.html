<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563EB;
            --primary-dark: #1D4ED8;
            --secondary: #10B981;
            --secondary-light: #34D399;
            --bg: #F0F9FF;
            --card-bg: #FFFFFF;
            --text: #1E293B;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --shadow: 0 4px 20px rgba(37, 99, 235, 0.1);
            --shadow-hover: 0 8px 30px rgba(37, 99, 235, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        .slide-in {
            animation: slideIn 0.5s ease-out forwards;
        }

        /* 页面容器 */
        .page {
            display: none;
            min-height: 100vh;
            padding: 20px;
        }

        .page.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 首页 */
        .hero {
            text-align: center;
            max-width: 600px;
            width: 100%;
            padding: 40px 20px;
        }

        .hero-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        .hero h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero .subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 40px;
        }

        .hero-features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .hero-feature {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }

        .hero-feature:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .hero-feature .icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .hero-feature .label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* 按钮 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }

        .btn-secondary {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-secondary:hover {
            background: var(--primary);
            color: white;
        }

        /* 评估页面 */
        .assessment-container {
            max-width: 600px;
            width: 100%;
            padding: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .question-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .question-number {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            text-align: center;
            line-height: 32px;
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        .question-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
        }

        .option:hover {
            border-color: var(--primary);
            background: #F0F9FF;
            transform: translateX(5px);
        }

        .option.selected {
            border-color: var(--primary);
            background: linear-gradient(135deg, #EFF6FF, #ECFDF5);
        }

        .option-icon {
            font-size: 24px;
            margin-right: 12px;
        }

        .option-text {
            font-size: 1rem;
            font-weight: 500;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        /* 加载动画 */
        .loading-container {
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }

        .loading-text {
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        /* 结果页面 */
        .results-container {
            max-width: 900px;
            width: 100%;
            padding: 20px;
        }

        .results-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .results-header h2 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .results-header p {
            color: var(--text-muted);
        }

        .result-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 30px;
        }

        .result-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .result-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
        }

        .result-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        .match-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .result-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .result-name {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .result-income {
            color: var(--secondary);
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 12px;
        }

        .result-reason {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        .result-steps {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .step-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .step-num {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            text-align: center;
            line-height: 24px;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .result-tools {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .tools-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .tool-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tool-tag {
            background: #F0F9FF;
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .card-hint {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 16px;
        }

        /* 方案页面 */
        .plan-container {
            max-width: 800px;
            width: 100%;
            padding: 20px;
        }

        .plan-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .plan-header h2 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .plan-header .plan-subtitle {
            color: var(--text-muted);
        }

        .week-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--primary);
        }

        .week-card:nth-child(2) { border-left-color: var(--secondary); }
        .week-card:nth-child(3) { border-left-color: #F59E0B; }
        .week-card:nth-child(4) { border-left-color: #8B5CF6; }

        .week-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .week-tasks {
            list-style: none;
        }

        .week-tasks li {
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .week-tasks li:last-child {
            border-bottom: none;
        }

        .task-check {
            width: 20px;
            height: 20px;
            border: 2px solid var(--secondary);
            border-radius: 4px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .resources-section {
            background: linear-gradient(135deg, #EFF6FF, #ECFDF5);
            border-radius: 16px;
            padding: 24px;
            margin-top: 30px;
        }

        .resources-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .resource-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .resource-item {
            background: white;
            padding: 12px 16px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .resource-icon {
            font-size: 20px;
        }

        .resource-name {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .back-btn {
            margin-top: 30px;
            text-align: center;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .hero h1 {
                font-size: 1.8rem;
            }

            .hero-features {
                grid-template-columns: 1fr;
            }

            .question-card {
                padding: 24px;
            }

            .result-cards {
                grid-template-columns: 1fr;
            }

            .btn {
                padding: 14px 28px;
                font-size: 1rem;
            }
        }
    </style>
</head>

                    { value: 'design', text: '设计/视频剪辑', icon: '🎨' },

                title: '你能接受的启动资金是多少？',
                options: [

                    { value: 'low', text: '200元以内', icon: '💵' },
                    { value: 'medium', text: '200-1000元', icon: '💴' },

                    { value: 'offline', text: '线下（需要出门）', icon: '🏃' },

                ]
            }
        ];

        let currentQuestion = 0;
        let answers = {};

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        function startAssessment() {
            currentQuestion = 0;
            answers = {};
            showPage('page-assessment');
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentQuestion];
            const container = document.getElementById('question-container');
            const progress = ((currentQuestion + 1) / questions.length) * 100;

            document.getElementById('progress-fill').style.width = progress + '%';

            let html = `
                <div class="question-card slide-in">
                    <div class="question-number">${currentQuestion + 1}</div>
                    <div class="question-title">${q.title}</div>
                    <div class="options">
            `;

            q.options.forEach(opt => {
                const selected = answers[q.id] === opt.value ? 'selected' : '';
                html += `
                    <div class="option ${selected}" onclick="selectOption('${q.id}', '${opt.value}')">
                        <span class="option-icon">${opt.icon}</span>
                        <span class="option-text">${opt.text}</span>
                    </div>
                `;
            });

            html += '</div></div>';
            container.innerHTML = html;

            document.getElementById('prev-btn').style.display = currentQuestion > 0 ? 'inline-flex' : 'none';
        }

        function selectOption(questionId, value) {
            answers[questionId] = value;

            // 更新选中样式
            document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
            event.currentTarget.classList.add('selected');

            // 延迟后进入下一题
            setTimeout(() => {
                if (currentQuestion < questions.length - 1) {
                    currentQuestion++;
                    renderQuestion();
                } else {
                    showLoading();
                }
            }, 400);
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function showLoading() {
            showPage('page-loading');
            setTimeout(() => {
                calculateResults();
                showPage('page-results');
            }, 2500);
        }

        function calculateResults() {
            // 匹配算法
            let scored = sideHustles.map(h => {
                let score = 0;

                // 时间匹配
                if (h.time === answers.time) score += 30;
                else if (answers.time === 'long') score += 20;
                else if (answers.time === 'medium' && h.time !== 'long') score += 20;

                // 技能匹配
                if (h.skill === answers.skill || answers.skill === 'none') score += 25;
                else if (answers.skill === 'programming' || answers.skill === 'sales') score += 10;

                // 资金匹配
                if (h.cost === answers.cost) score += 25;
                else if (answers.cost === 'zero' && h.cost === 'zero') score += 25;
                else if (answers.cost === 'low' && (h.cost === 'zero' || h.cost === 'low')) score += 20;

                // 线上偏好
                if (h.online && (answers.online === 'online' || answers.online === 'both')) score += 20;
                else if (!h.online && answers.online === 'offline') score += 20;
                else if (answers.online === 'both') score += 15;

                return { ...h, matchScore: score };
            });

            scored.sort((a, b) => b.matchScore - a.matchScore);
            const top3 = scored.slice(0, 3);

            // 渲染结果卡片
            const container = document.getElementById('result-cards');
            container.innerHTML = top3.map((h, i) => `
                <div class="result-card fade-in" onclick="showPlan('${h.id}')" style="animation-delay: ${i * 0.15}s">
                    <div class="match-badge">匹配度 ${h.matchScore}%</div>
                    <div class="result-icon">${h.icon}</div>
                    <div class="result-name">${h.name}</div>
                    <div class="result-income">${h.income}</div>
                    <div class="result-reason">${h.reason}</div>
                    <div class="result-steps">
                        ${h.steps.map((step, idx) => `
                            <div class="step-item">
                                <span class="step-num">${idx + 1}</span>
                                <span>${step}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="result-tools">
                        <div class="tools-label">所需工具</div>
                        <div class="tool-tags">
                            ${h.tools.map(t => `<span class="tool-tag">${t}</span>`).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function showPlan(hustleId) {
            const h = sideHustles.find(x => x.id === hustleId);
            if (!h) return;

            document.getElementById('plan-title').innerHTML = `${h.icon} ${h.name} - 30天执行计划`;
            document.getElementById('plan-subtitle').textContent = `预期收入：${h.income} | 投入时间：${h.time === 'short' ? '每天1小时内' : h.time === 'medium' ? '每天1-2小时' : '2小时以上'}`;

            const weeks = [
                { title: '第1周：搭建基础', emoji: '🏗️', tasks: h.plan.week1 },
                { title: '第2周：获取首单/首批内容', emoji: '🚀', tasks: h.plan.week2 },
                { title: '第3周：放大规模', emoji: '📈', tasks: h.plan.week3 },
                { title: '第4周：优化变现', emoji: '💎', tasks: h.plan.week4 }
            ];

            document.getElementById('plan-content').innerHTML = weeks.map((w, i) => `
                <div class="week-card fade-in" style="animation-delay: ${i * 0.1}s">
                    <div class="week-title">${w.emoji} ${w.title}</div>
                    <ul class="week-tasks">
                        ${w.tasks.map(t => `
                            <li>
                                <span class="task-check"></span>
                                <span>${t}</span>
                            </li>
                        `).join('')}
                    </ul>
                </div>
            `).join('') + `
                <div class="resources-section fade-in">
                    <div class="resources-title">📦 推荐工具与资源</div>
                    <div class="resource-list">
                        ${h.tools.map(t => `
                            <div class="resource-item">
                                <span class="resource-icon">🔧</span>
                                <span class="resource-name">${t}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            showPage('page-plan');
        }

        function backToResults() {
            showPage('page-results');
        }

        function restart() {
            answers = {};
            currentQuestion = 0;
            showPage('page-home');
        }
