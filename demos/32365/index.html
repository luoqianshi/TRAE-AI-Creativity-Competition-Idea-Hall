<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冰箱剩菜配菜谱 - 智能推荐</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>🧊 冰箱剩菜配菜谱</h1>
            <p class="subtitle">输入冰箱里的剩余食材，智能推荐美味菜谱</p>
        </header>

        <main class="main-content">
            <!-- 食材输入区域 -->
            <section class="ingredient-section">
                <h2>我的冰箱</h2>
                <div class="input-area">
                    <input type="text" id="ingredientInput" placeholder="输入食材名称（如：鸡蛋、西红柿）">
                    <button id="addBtn" class="btn btn-primary">添加</button>
                </div>
                <div class="preset-ingredients">
                    <p>常用食材：</p>
                    <div class="preset-list">
                        <button class="preset-btn" data-ingredient="鸡蛋">🥚 鸡蛋</button>
                        <button class="preset-btn" data-ingredient="西红柿">🍅 西红柿</button>
                        <button class="preset-btn" data-ingredient="土豆">🥔 土豆</button>
                        <button class="preset-btn" data-ingredient="青椒">🫑 青椒</button>
                        <button class="preset-btn" data-ingredient="豆腐">🧈 豆腐</button>
                        <button class="preset-btn" data-ingredient="白菜">🥬 白菜</button>
                        <button class="preset-btn" data-ingredient="胡萝卜">🥕 胡萝卜</button>
                        <button class="preset-btn" data-ingredient="猪肉">🥩 猪肉</button>
                        <button class="preset-btn" data-ingredient="米饭">🍚 米饭</button>
                        <button class="preset-btn" data-ingredient="面条">🍜 面条</button>
                        <button class="preset-btn" data-ingredient="大蒜">🧄 大蒜</button>
                        <button class="preset-btn" data-ingredient="葱">🧅 葱</button>
                    </div>
                </div>
                <div class="selected-ingredients">
                    <p>已选食材：</p>
                    <div id="selectedList" class="selected-list"></div>
                </div>
                <button id="recommendBtn" class="btn btn-recommend">🍳 获取菜谱推荐</button>
            </section>

            <!-- 菜谱推荐区域 -->
            <section class="recipe-section">
                <h2>推荐菜谱</h2>
                <div id="recipeList" class="recipe-list">
                    <div class="empty-state">
                        <p>请先添加冰箱里的食材，获取菜谱推荐</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- 菜谱详情弹窗 -->
        <div id="recipeModal" class="modal hidden">
            <div class="modal-content">
                <button class="modal-close">&times;</button>
                <div id="modalBody"></div>
            </div>
        </div>

        <footer class="app-footer">
            <p>冰箱剩菜配菜谱 - 让剩菜变成美味佳肴</p>
        </footer>
    </div>

    <script src="recipes.js"></script>
    <script src="app.js"></script>
</body>
</html>
