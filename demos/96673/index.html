<body>
    <div id="app"></div>

    <script>
        const monsters = ['史莱姆', '哥布林', '骷髅兵', '蝙蝠', '狼人', '石像鬼', '暗影刺客', '火焰精灵', '冰霜巨人', '恶魔领主'];
        const monsterEmojis = ['🟢', '👺', '💀', '🦇', '🐺', '🗿', '🥷', '🔥', '❄️', '👿'];

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function generateQuestion(level) {
            let operator;
            let num1, num2, answer, expression;
            const difficulty = Math.min(level, 10);

            if (difficulty <= 3) {
                const operators = ['+', '-'];
                operator = operators[getRandomInt(0, operators.length - 1)];
                if (operator === '+') {
                    num1 = getRandomInt(1, 50);
                    num2 = getRandomInt(1, 50);
                    answer = num1 + num2;
                    expression = `${num1} + ${num2}`;
                } else {
                    num1 = getRandomInt(10, 50);
                    num2 = getRandomInt(1, num1);
                    answer = num1 - num2;
                    expression = `${num1} - ${num2}`;
                }
            } else if (difficulty <= 6) {
                const operators = ['+', '-', '×'];
                operator = operators[getRandomInt(0, operators.length - 1)];
                if (operator === '+') {
                    num1 = getRandomInt(10, 99);
                    num2 = getRandomInt(10, 99);
                    answer = num1 + num2;
                    expression = `${num1} + ${num2}`;
                } else if (operator === '-') {
                    num1 = getRandomInt(20, 99);
                    num2 = getRandomInt(10, num1);
                    answer = num1 - num2;
                    expression = `${num1} - ${num2}`;
                } else {
                    num1 = getRandomInt(1, 12);
                    num2 = getRandomInt(1, 12);
                    answer = num1 * num2;
                    expression = `${num1} × ${num2}`;
                }
            } else {
                const operators = ['+', '-', '×', '÷'];
                operator = operators[getRandomInt(0, operators.length - 1)];
                if (operator === '+') {
                    num1 = getRandomInt(50, 200);
                    num2 = getRandomInt(50, 200);
                    answer = num1 + num2;
                    expression = `${num1} + ${num2}`;
                } else if (operator === '-') {
                    num1 = getRandomInt(100, 200);
                    num2 = getRandomInt(50, num1);
                    answer = num1 - num2;
                    expression = `${num1} - ${num2}`;
                } else if (operator === '×') {
                    num1 = getRandomInt(2, 20);
                    num2 = getRandomInt(2, 20);
                    answer = num1 * num2;
                    expression = `${num1} × ${num2}`;
                } else {
                    num2 = getRandomInt(2, 20);
                    answer = getRandomInt(1, 20);
                    num1 = num2 * answer;
                    expression = `${num1} ÷ ${num2}`;
                }
            }
            return { expression, answer, operator };
        }

        class GameStore {
            constructor() {
                this.loadState();
            }

            state = {
                level: 1,
                experience: 10,
                maxExperience: 50,
                health: 10,
                maxHealth: 10,
                attackPower: 3,
                timeLimit: 20,
                currentQuestion: null,
                questionsAnswered: 0,
                defeatedLevels: [],
                currentScreen: 'home'
            };

            listeners = [];

            subscribe(listener) {
                this.listeners.push(listener);
                return () => {
                    this.listeners = this.listeners.filter(l => l !== listener);
                };
            }

            notify() {
                this.saveState();
                this.listeners.forEach(listener => listener(this.state));
            }

            loadState() {
                try {
                    const saved = localStorage.getItem('math-knight-storage');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        Object.assign(this.state, parsed);
                    }
                } catch (e) {
                    console.error('Failed to load state:', e);
                }
            }

            saveState() {
                try {
                    localStorage.setItem('math-knight-storage', JSON.stringify(this.state));
                } catch (e) {
                    console.error('Failed to save state:', e);
                }
            }

            setCurrentScreen(screen) {
                this.state.currentScreen = screen;
                this.notify();
            }

            setLevel(level) {
                this.state.level = level;
                this.state.attackPower = 3 + (level - 1);
                this.state.timeLimit = 20 + Math.floor((level - 1) / 2) * 5;
                this.notify();
            }

            addExperience(exp) {
                this.state.experience += exp;
                if (this.state.experience >= this.state.maxExperience) {
                    this.checkLevelUp();
                }
                this.notify();
            }

            setHealth(health) {
                this.state.health = health;
                this.notify();
            }

            takeDamage() {
                this.state.health = Math.max(0, this.state.health - 1);
                if (this.state.health === 0) {
                    this.state.currentScreen = 'resurrect';
                }
                this.notify();
            }

            setCurrentQuestion(question) {
                this.state.currentQuestion = question;
                this.notify();
            }

            incrementQuestionsAnswered() {
                this.state.questionsAnswered++;
                this.notify();
            }

            resetQuestionsAnswered() {
                this.state.questionsAnswered = 0;
                this.notify();
            }

            addDefeatedLevel(level) {
                if (!this.state.defeatedLevels.includes(level)) {
                    this.state.defeatedLevels.push(level);
                }
                this.notify();
            }

            defeatMonster() {
                this.addDefeatedLevel(this.state.level);
                const newLevel = this.state.level + 1;
                this.setLevel(newLevel);
                this.addExperience(10);
                this.resetQuestionsAnswered();
                this.state.currentScreen = 'home';
                this.notify();
            }

            resurrect() {
                if (this.state.experience >= 100) {
                    this.state.experience -= 100;
                    this.state.health = this.state.maxHealth;
                    this.state.currentScreen = 'battle';
                    this.notify();
                    return true;
                }
                return false;
            }

            restartGame() {
                this.state = {
                    level: 1,
                    experience: 10,
                    maxExperience: 50,
                    health: 10,
                    maxHealth: 10,
                    attackPower: 3,
                    timeLimit: 20,
                    currentQuestion: null,
                    questionsAnswered: 0,
                    defeatedLevels: [],
                    currentScreen: 'home'
                };
                this.notify();
            }

            checkLevelUp() {
                if (this.state.experience >= this.state.maxExperience) {
                    this.state.maxExperience = Math.floor(this.state.maxExperience * 1.5);
                    this.state.maxHealth += 1;
                    this.state.health = this.state.maxHealth;
                    this.state.timeLimit += 5;
                    this.state.currentScreen = 'levelup';
                    this.notify();
                    return true;
                }
                return false;
            }
        }

        const gameStore = new GameStore();

        function HealthBar({ current, max }) {
            const percentage = (current / max) * 100;
            return `

                        <span class="font-medieval text-knight-gold text-lg">血量</span>
                    </div>
                    <div class="w-full max-w-200 h-6 bg-gray-800 rounded-full border-gold overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-red-600 to-red-400 transition-all duration-300" style="width: ${percentage}%"></div>
                    </div>
                    <div class="text-knight-light text-sm">${current} / ${max}</div>
                </div>
            `;
        }

        function ExpBar({ current, max }) {
            const percentage = Math.min((current / max) * 100, 100);
            return `
                <div class="flex flex-col items-center gap-2">
                    <div class="flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="#d4af37" stroke="#d4af37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                        <span class="font-medieval text-knight-gold text-lg">经验</span>
                    </div>
                    <div class="w-full max-w-200 h-6 bg-gray-800 rounded-full border-gold overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-yellow-600 to-yellow-400 transition-all duration-300" style="width: ${percentage}%"></div>
                    </div>
                    <div class="text-knight-light text-sm">${current} / ${max}</div>
                </div>
            `;
        }

        function GameMap({ currentLevel, defeatedLevels }) {
            const totalLevels = Math.max(currentLevel + 4, 10);
            let html = '<div class="bg-dark border-gold rounded-xl p-6">';
            html += '<h2 class="font-medieval text-xl text-knight-gold text-center mb-4">冒险地图</h2>';
            html += '<div class="flex flex-wrap justify-center gap-4">';
            
            for (let i = 0; i < totalLevels; i++) {
                const level = i + 1;
                const isDefeated = defeatedLevels.includes(level);
                const isCurrent = level === currentLevel;
                const monsterName = monsters[i % monsters.length];
                
                let bgClass = 'bg-gray-800/50 border-gray-600 hover:border-gray-500';
                if (isDefeated) bgClass = 'bg-green-900/50 border-green-500';
                if (isCurrent) bgClass = 'bg-knight-blue/50 border-gold animate-pulse box-shadow-gold';
                
                html += `
                    <div class="relative w-20 h-24 rounded-lg flex flex-col items-center justify-center border-2 ${bgClass} cursor-pointer transition-all duration-300">
                        ${isDefeated ? `
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                            <span class="text-xs text-green-400 mt-1">已击败</span>
                        ` : isCurrent ? `
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="9" x2="15" y1="15" y2="15"/></svg>
                            <span class="text-xs text-knight-gold mt-1">当前</span>
                        ` : `
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><line x1="21" x2="15" y1="17" y2="17"/><line x1="3" x2="9" y1="17" y2="17"/></svg>
                            <span class="text-xs text-gray-500 mt-1">待挑战</span>
                        `}
                        <div class="absolute -bottom-6 text-center w-full">
                            <span class="text-xs text-knight-light">${monsterName}</span>
                            <span class="text-xs text-knight-gold block">Lv.${level}</span>
                        </div>
                    </div>
                `;
            }
            
            html += '</div></div>';
            return html;
        }

        function HomePage({ state, onStartBattle }) {
            const expPercentage = Math.min((state.experience / state.maxExperience) * 100, 100);
            return `
                <div class="min-h-screen p-6">
                    <div class="container">
                        <div class="text-center mb-8">
                            <div class="text-6xl mb-4">⚔️</div>
                            <h1 class="font-medieval text-4xl text-knight-gold text-shadow-gold mb-2">数学骑士</h1>
                            <p class="text-knight-light">用数学的力量打败怪兽!</p>
                        </div>

                        <div class="grid grid-cols-2 grid-cols-md-4 gap-4 mb-8">
                            <div class="bg-dark border-gold rounded-xl p-4 text-center">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                                <div class="text-knight-light text-sm">当前关卡</div>
                                <div class="font-medieval text-2xl text-knight-gold">${state.level}</div>
                            </div>
                            
                            <div class="bg-dark border-gold rounded-xl p-4 text-center">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="#f87171" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                                <div class="text-knight-light text-sm">血量</div>
                                <div class="font-medieval text-2xl text-knight-gold">${state.health}/${state.maxHealth}</div>
                            </div>
                            
                            <div class="bg-dark border-gold rounded-xl p-4 text-center">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="#facc15" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                                <div class="text-knight-light text-sm">经验</div>
                                <div class="font-medieval text-2xl text-knight-gold">${state.experience}/${state.maxExperience}</div>
                                <div class="mt-2 h-2 bg-gray-700 rounded-full overflow-hidden">
                                    <div class="h-full bg-yellow-500" style="width: ${expPercentage}%"></div>
                                </div>
                            </div>
                            
                            <div class="bg-dark border-gold rounded-xl p-4 text-center">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
                                <div class="text-knight-light text-sm">击败怪兽</div>
                                <div class="font-medieval text-2xl text-knight-gold">${state.defeatedLevels.length}</div>
                            </div>
                        </div>

                        <div class="bg-dark border-gold rounded-xl p-4 mb-8">
                            <h2 class="font-medieval text-xl text-knight-gold text-center mb-4">当前属性</h2>
                            <div class="flex flex-wrap justify-center gap-6">
                                <div class="flex items-center gap-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="9" x2="15" y1="15" y2="15"/></svg>
                                    <span class="text-knight-light">攻击力: </span>
                                    <span class="font-medieval text-lg text-knight-gold">${state.attackPower} 题</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="#ef4444" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                                    <span class="text-knight-light">血量: </span>
                                    <span class="font-medieval text-lg text-knight-gold">${state.maxHealth}</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                                    <span class="text-knight-light">答题时间: </span>
                                    <span class="font-medieval text-lg text-knight-gold">${state.timeLimit}秒</span>
                                </div>
                            </div>
                        </div>

                        ${GameMap({ currentLevel: state.level, defeatedLevels: state.defeatedLevels })}

                        <div class="mt-8 flex justify-center">
                            <button onclick="${onStartBattle}" class="px-12 py-4 rounded-xl font-medieval text-2xl flex items-center gap-3 bg-gradient-gold text-knight-dark hover:scale-105 active:scale-95 transition-all duration-300 box-shadow-gold">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0d1b2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                开始战斗
                            </button>
                        </div>

                        <div class="mt-8 text-center text-knight-light text-sm">
                            <p>💡 提示: 答对题目获得5经验，答错或超时扣1滴血</p>
                            <p>📈 经验满后升级，血量+1，答题时间+5秒</p>
                            <p>💀 血量耗尽可消耗100经验复活</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function Timer({ timeLeft, totalTime }) {
            const percentage = (timeLeft / totalTime) * 100;
            const isUrgent = timeLeft <= 5;
            const colorClass = isUrgent ? 'text-red-400' : 'text-knight-gold';
            const bgClass = isUrgent ? 'from-red-600 to-red-400' : 'from-blue-600 to-blue-400';
            return `
                <div class="flex flex-col items-center gap-2">
                    <div class="flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${isUrgent ? '#f87171' : '#d4af37'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${isUrgent ? 'class="animate-pulse"' : ''}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        <span class="font-medieval text-lg ${colorClass}">剩余时间</span>
                    </div>
                    <div class="w-full max-w-200 h-4 bg-gray-800 rounded-full border-gold overflow-hidden">
                        <div class="h-full bg-gradient-to-r ${bgClass} transition-all duration-1000" style="width: ${percentage}%"></div>
                    </div>
                    <div class="text-2xl font-bold ${isUrgent ? 'text-red-400 text-shadow-red' : 'text-knight-light'}">${timeLeft}s</div>
                </div>
            `;
        }

        function QuestionPanel({ question, onAnswer, timeLeft }) {
            if (!question) return '';
            return `
                <div class="bg-dark border-gold rounded-xl p-6">
                    <div class="flex items-center justify-center gap-2 mb-6">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5a2.5 2.5 0 0 0-4.96-.46 2.5 2.5 0 0 0-1.98 3 2.5 2.5 0 0 0 .48 5.38 2.5 2.5 0 0 0 3.65 1.94A2.5 2.5 0 0 0 12 12.5a2.5 2.5 0 0 0 4.96.46 2.5 2.5 0 0 0 1.98-3 2.5 2.5 0 0 0-.48-5.38 2.5 2.5 0 0 0-3.65-1.94A2.5 2.5 0 0 0 12 4.5"/></svg>
                        <h2 class="font-medieval text-xl text-knight-gold">计算题挑战</h2>
                    </div>
                    
                    <div class="text-center mb-6">
                        <div class="text-5xl font-bold text-knight-light mb-4">${question.expression} = ?</div>
                    </div>
                    
                    <div class="flex items-center justify-center gap-4">
                        <input type="number" id="answer-input" class="w-32 h-14 text-2xl text-center font-bold rounded-lg border-gold bg-knight-blue/50 text-knight-light focus:border-yellow-400 outline-none" placeholder="?" onkeypress="if(event.key === 'Enter') document.getElementById('submit-btn').click()">
                        <button id="submit-btn" onclick="${onAnswer}" class="px-6 py-4 rounded-lg font-medieval text-lg flex items-center gap-2 bg-gradient-gold text-knight-dark hover:scale-105 active:scale-95 transition-all duration-300">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0d1b2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                            提交
                        </button>
                    </div>
                    
                    <div id="feedback" class="mt-4 text-center"></div>
                </div>
            `;
        }

        function MonsterCard({ level, questionsNeeded, questionsAnswered }) {
            const monsterName = monsters[(level - 1) % monsters.length];
            const monsterEmoji = monsterEmojis[(level - 1) % monsterEmojis.length];
            const progress = (questionsAnswered / questionsNeeded) * 100;
            return `
                <div class="bg-gradient-to-br from-red-900 to-knight-dark/80 backdrop-blur-sm border-red rounded-xl p-6 text-center">
                    <div class="relative">
                        <div class="text-8xl mb-4 animate-bounce">${monsterEmoji}</div>
                        <div class="absolute -top-2 -right-2 bg-red-600 text-white px-3 py-1 rounded-full text-sm font-bold">Lv.${level}</div>
                    </div>
                    
                    <h2 class="font-medieval text-2xl text-red-400 mb-2">${monsterName}</h2>
                    
                    <div class="flex items-center justify-center gap-2 mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><line x1="21" x2="15" y1="17" y2="17"/><line x1="3" x2="9" y1="17" y2="17"/></svg>
                        <span class="text-knight-light">需要击败</span>
                        <span class="font-medieval text-xl text-knight-gold">${questionsNeeded} 题</span>
                    </div>
                    
                    <div class="w-full max-w-250 mx-auto">
                        <div class="flex justify-between text-sm text-knight-light mb-1">
                            <span>击败进度</span>
                            <span>${questionsAnswered} / ${questionsNeeded}</span>
                        </div>
                        <div class="h-4 bg-gray-800 rounded-full border border-red-500 overflow-hidden">
                            <div class="h-full bg-gradient-to-r from-red-600 to-orange-500 transition-all duration-300" style="width: ${progress}%"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function BattlePage({ state, onAnswer, onDefeat, onTakeDamage, onGoHome }) {
            return `
                <div class="min-h-screen p-6">
                    <div class="container">
                        <div class="flex items-center justify-between mb-6">
                            <button onclick="${onGoHome}" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-dark border-gold text-knight-gold hover:bg-knight-blue/50 transition-all duration-300">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                                返回主页
                            </button>
                            
                            <div class="font-medieval text-2xl text-knight-gold">⚔️ 战斗中 ⚔️</div>
                            
                            <div class="w-32"></div>
                        </div>
                        
                        <div class="grid grid-cols-1 grid-cols-lg-2 gap-6">
                            ${MonsterCard({ level: state.level, questionsNeeded: state.attackPower, questionsAnswered: state.questionsAnswered })}
                            
                            <div class="flex flex-col gap-6">
                                <div id="timer-container"></div>
                                <div id="question-panel-container"></div>
                            </div>
                        </div>
                        
                        <div class="mt-6 text-center text-knight-light">
                            <p>击败怪兽需要答对 <span class="font-medieval text-knight-gold">${state.attackPower}</span> 道题目</p>
                            <p>已答对 <span class="font-medieval text-green-400">${state.questionsAnswered}</span> 道</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function ResurrectModal({ experience, onResurrect, onRestart }) {
            const canResurrect = experience >= 100;
            return `
                <div class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 animate-fade-in">
                    <div class="bg-gradient-to-br-red border-red rounded-xl p-8 max-w-md w-full mx-4 text-center box-shadow-red">
                        <div class="text-6xl mb-4">💀</div>
                        
                        <h2 class="font-medieval text-3xl text-red-400 mb-4">骑士阵亡!</h2>
                        
                        <p class="text-knight-light mb-6">你的骑士已经倒下了，但传奇永不消逝...</p>
                        
                        <div class="flex flex-col gap-4">
                            <button onclick="${onResurrect}" ${!canResurrect ? 'disabled' : ''} class="w-full py-4 rounded-lg font-medieval text-lg flex items-center justify-center gap-2 transition-all duration-300 ${canResurrect ? 'bg-gradient-green text-white hover:scale-105 active:scale-95' : 'bg-gray-700 text-gray-500 cursor-not-allowed'}">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                                消耗100经验复活
                            </button>
                            
                            <button onclick="${onRestart}" class="w-full py-4 rounded-lg font-medieval text-lg flex items-center justify-center gap-2 bg-gradient-gray text-white hover:scale-105 active:scale-95 transition-all duration-300">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                                重新开始
                            </button>
                        </div>
                        
                        <div class="mt-6 flex items-center justify-center gap-2 text-knight-light">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><line x1="21" x2="15" y1="17" y2="17"/><line x1="3" x2="9" y1="17" y2="17"/></svg>
                            <span>当前经验: </span>
                            <span class="font-medieval text-xl ${canResurrect ? 'text-green-400' : 'text-red-400'}">${experience}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function LevelUpModal({ onContinue }) {
            return `
                <div class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 animate-fade-in">
                    <div class="bg-gradient-to-br-blue border-gold rounded-xl p-8 max-w-md w-full mx-4 text-center box-shadow-gold">
                        <div class="text-6xl mb-4 animate-bounce">👑</div>
                        
                        <h2 class="font-medieval text-3xl text-knight-gold text-shadow-gold mb-4">升级成功!</h2>
                        
                        <p class="text-knight-light mb-6">恭喜你！你的骑士变得更强大了！</p>
                        
                        <div class="grid grid-cols-2 gap-4 mb-6">
                            <div class="bg-knight-dark/50 rounded-lg p-4">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="#ef4444" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                                <div class="text-knight-light text-sm">最大血量</div>
                                <div class="font-medieval text-xl text-knight-gold">+1</div>
                            </div>
                            
                            <div class="bg-knight-dark/50 rounded-lg p-4">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                <div class="text-knight-light text-sm">答题时间</div>
                                <div class="font-medieval text-xl text-knight-gold">+5秒</div>
                            </div>
                        </div>
                        
                        <div class="bg-knight-dark/50 rounded-lg p-4 mb-6">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="#facc15" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                            <div class="text-knight-light text-sm">下一级经验需求</div>
                            <div class="font-medieval text-xl text-knight-gold">+50%</div>
                        </div>
                        
                        <button onclick="${onContinue}" class="w-full py-4 rounded-lg font-medieval text-lg flex items-center justify-center gap-2 bg-gradient-gold text-knight-dark hover:scale-105 active:scale-95 transition-all duration-300">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0d1b2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5"/><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                            继续冒险
                        </button>
                    </div>
                </div>
            `;
        }

        let timerInterval = null;
        let currentTimeLeft = 20;

        function render(state) {
            const app = document.getElementById('app');
            
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            if (state.currentScreen === 'home') {
                app.innerHTML = HomePage({
                    state,
                    onStartBattle: 'startBattle()'
                });
            } else if (state.currentScreen === 'battle') {
                currentTimeLeft = state.timeLimit;
                app.innerHTML = BattlePage({
                    state,
                    onAnswer: 'handleBattleAnswer()',
                    onDefeat: 'handleDefeat()',
                    onTakeDamage: 'handleTakeDamage()',
                    onGoHome: 'goHome()'
                });
                
                gameStore.setCurrentQuestion(generateQuestion(state.level));
                
                timerInterval = setInterval(() => {
                    currentTimeLeft--;
                    updateTimer();
                    if (currentTimeLeft <= 0) {
                        clearInterval(timerInterval);
                        handleTakeDamage();
                    }
                }, 1000);
                
                updateTimer();
                updateQuestionPanel();
            } else if (state.currentScreen === 'resurrect') {
                app.innerHTML = ResurrectModal({
                    experience: state.experience,
                    onResurrect: 'handleResurrect()',
                    onRestart: 'handleRestart()'
                });
            } else if (state.currentScreen === 'levelup') {
                app.innerHTML = LevelUpModal({
                    onContinue: 'handleContinue()'
                });
            }
        }

        function updateTimer() {
            const container = document.getElementById('timer-container');
            if (container) {
                container.innerHTML = Timer({ timeLeft: currentTimeLeft, totalTime: gameStore.state.timeLimit });
            }
        }

        function updateQuestionPanel() {
            const container = document.getElementById('question-panel-container');
            if (container) {
                container.innerHTML = QuestionPanel({
                    question: gameStore.state.currentQuestion,
                    onAnswer: 'handleBattleAnswer()',
                    timeLeft: currentTimeLeft
                });
            }
        }

        function startBattle() {
            gameStore.setCurrentScreen('battle');
        }

        function goHome() {
            gameStore.setCurrentScreen('home');
        }

        function handleBattleAnswer() {
            const input = document.getElementById('answer-input');
            const feedback = document.getElementById('feedback');
            const question = gameStore.state.currentQuestion;
            
            if (!question || !input || input.value === '') return;
            
            const userNum = parseInt(input.value, 10);
            const isCorrect = userNum === question.answer;
            
            if (isCorrect) {
                feedback.innerHTML = `
                    <div class="flex items-center justify-center gap-2 text-green-400 animate-bounce-in">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        <span class="font-medieval text-lg">正确! +5经验</span>
                    </div>
                `;
                gameStore.addExperience(5);
                gameStore.incrementQuestionsAnswered();
                
                setTimeout(() => {
                    if (gameStore.state.questionsAnswered >= gameStore.state.attackPower) {
                        handleDefeat();
                    } else {
                        currentTimeLeft = gameStore.state.timeLimit;
                        gameStore.setCurrentQuestion(generateQuestion(gameStore.state.level));
                        updateTimer();
                        updateQuestionPanel();
                    }
                }, 500);
            } else {
                feedback.innerHTML = `
                    <div class="flex items-center justify-center gap-2 text-red-400 animate-bounce-in">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" x2="9" y1="9" y2="15"/><line x1="9" x2="15" y1="9" y2="15"/></svg>
                        <span class="font-medieval text-lg">错误! 正确答案是 ${question.answer}</span>
                    </div>
                `;
                handleTakeDamage();
            }
        }

        function handleDefeat() {
            gameStore.defeatMonster();
        }

        function handleTakeDamage() {
            gameStore.takeDamage();
            if (gameStore.state.health > 0) {
                currentTimeLeft = gameStore.state.timeLimit;
                gameStore.setCurrentQuestion(generateQuestion(gameStore.state.level));
                updateTimer();
                updateQuestionPanel();
            }
        }

        function handleResurrect() {
            gameStore.resurrect();
        }

        function handleRestart() {
            gameStore.restartGame();
        }

        function handleContinue() {
            gameStore.setCurrentScreen('home');
        }

        gameStore.subscribe(render);
        render(gameStore.state);
    </script>
</body>
</html>
