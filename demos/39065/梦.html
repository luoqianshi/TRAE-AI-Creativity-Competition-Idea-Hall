<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梦 · 一段只属于你的旅程</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #080818 0%, #160828 50%, #0a1828 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            color: #e8e0f5;
            overflow: hidden;
            position: relative;
        }

        /* 星空 */
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--dur) infinite ease-in-out;
            opacity: 0;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: var(--max-op); transform: scale(1); }
        }

        /* 氛围光球 */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: drift var(--dur) infinite ease-in-out alternate;
        }
        @keyframes drift {
            from { transform: translate(0, 0); }
            to { transform: translate(var(--tx), var(--ty)); }
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            width: 92%;
            max-width: 580px;
            text-align: center;
        }

        /* 屏幕通用 */
        .screen { display: none; animation: fadeUp 0.7s ease forwards; }
        .screen.active { display: block; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── 开始界面 ── */
        .game-title {
            font-size: clamp(4rem, 15vw, 6rem);
            font-weight: 200;
            letter-spacing: 1.2rem;
            color: #d4b0f5;
            text-shadow: 0 0 50px rgba(180,130,245,0.7), 0 0 100px rgba(180,130,245,0.3);
            animation: glow 3s ease-in-out infinite;
            margin-bottom: 0.4rem;
        }
        @keyframes glow {
            0%,100% { text-shadow: 0 0 40px rgba(180,130,245,0.6),0 0 80px rgba(180,130,245,0.25); }
            50% { text-shadow: 0 0 70px rgba(180,130,245,1),0 0 130px rgba(180,130,245,0.5); }
        }
        .game-sub {
            font-size: 0.85rem;
            color: rgba(220,210,240,0.5);
            letter-spacing: 0.4rem;
            margin-bottom: 2.8rem;
        }
        .game-desc {
            font-size: 0.9rem;
            line-height: 2;
            color: rgba(220,210,240,0.65);
            margin-bottom: 3rem;
        }

        /* ── 进度条 ── */
        .progress-wrap { width: 100%; height: 2px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-bottom: 2rem; overflow: hidden; }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6b4fa0, #c9a0f0);
            border-radius: 2px;
            width: 0%;
            transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
        }

        /* ── 故事面板 ── */
        .panel {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 20px;
            padding: 2.4rem 2rem;
            margin-bottom: 1.4rem;
        }
        .scene-meta {
            font-size: 0.72rem;
            color: rgba(180,130,245,0.5);
            letter-spacing: 0.2rem;
            margin-bottom: 0.8rem;
        }
        .scene-title {
            font-size: 1.05rem;
            color: #c9a0f0;
            font-weight: 500;
            margin-bottom: 1.2rem;
        }
        .scene-text {
            font-size: 0.93rem;
            line-height: 2.1;
            color: rgba(230,220,248,0.82);
        }

        /* ── 选项 ── */
        .choices { display: flex; flex-direction: column; gap: 0.9rem; }
        .choice-btn {
            background: rgba(107,79,160,0.15);
            border: 1px solid rgba(180,130,245,0.25);
            border-radius: 14px;
            padding: 1rem 1.4rem;
            color: #e8e0f5;
            font-size: 0.9rem;
            line-height: 1.7;
            cursor: pointer;
            text-align: left;
            transition: all 0.28s ease;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }
        .choice-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(180,130,245,0.15), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .choice-btn:hover { border-color: rgba(180,130,245,0.55); transform: translateX(5px); }
        .choice-btn:hover::before { opacity: 1; }
        .choice-mark { display: block; font-size: 0.7rem; color: rgba(180,130,245,0.7); margin-bottom: 0.3rem; letter-spacing: 0.1rem; }

        /* ── 主按钮 ── */
        .btn-main {
            background: linear-gradient(135deg, #6b4fa0, #9b78d4);
            border: none;
            border-radius: 50px;
            padding: 0.88rem 3rem;
            color: #fff;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 0.25rem;
            transition: all 0.28s ease;
            box-shadow: 0 4px 24px rgba(107,79,160,0.45);
        }
        .btn-main:hover { transform: translateY(-3px); box-shadow: 0 8px 32px rgba(107,79,160,0.65); }

        /* ── 结果界面 ── */
        .result-label { font-size: 0.72rem; color: rgba(180,130,245,0.55); letter-spacing: 0.2rem; margin-bottom: 0.7rem; }
        .result-type {
            font-size: 1.9rem;
            color: #c9a0f0;
            font-weight: 500;
            text-shadow: 0 0 30px rgba(180,130,245,0.5);
            margin-bottom: 0.4rem;
        }
        .result-icon { font-size: 2.8rem; margin: 1rem 0 0.5rem; filter: drop-shadow(0 0 12px rgba(180,130,245,0.6)); }
        .result-divider { width: 40px; height: 1px; background: rgba(180,130,245,0.4); margin: 1rem auto; }
        .result-desc {
            font-size: 0.88rem;
            line-height: 2.1;
            color: rgba(230,220,248,0.78);
            text-align: left;
        }
        .result-traits { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-top: 1.6rem; }
        .trait {
            background: rgba(107,79,160,0.28);
            border: 1px solid rgba(180,130,245,0.35);
            border-radius: 20px;
            padding: 0.28rem 0.85rem;
            font-size: 0.78rem;
            color: #c9a0f0;
        }
        .result-note { font-size: 0.78rem; color: rgba(220,210,240,0.35); margin-bottom: 1.6rem; line-height: 1.8; }
    </style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="orb" style="width:320px;height:320px;background:#3a0a7a;top:-120px;left:-120px;--dur:9s;--tx:40px;--ty:30px;opacity:0.35;"></div>
<div class="orb" style="width:240px;height:240px;background:#0a2a6a;bottom:-80px;right:-80px;--dur:12s;--tx:-30px;--ty:-40px;opacity:0.3;"></div>
<div class="orb" style="width:180px;height:180px;background:#7a0a4a;top:45%;left:55%;--dur:15s;--tx:-50px;--ty:20px;opacity:0.18;"></div>

<div class="container">

    <!-- 开始界面 -->
    <div class="screen active" id="s-title">
        <div class="game-title">梦</div>
        <div class="game-sub">一段只属于你的旅程</div>
        <p class="game-desc">
            这里没有输赢，没有正确答案。<br>
            只需跟着感觉，走完这段梦境。<br>
            最后，你会多认识自己一点点。
        </p>
        <button class="btn-main" onclick="startGame()">进入梦境</button>
    </div>

    <!-- 场景界面 -->
    <div class="screen" id="s-scene">
        <div class="progress-wrap"><div class="progress-fill" id="progress"></div></div>
        <div class="panel">
            <div class="scene-meta" id="meta"></div>
            <div class="scene-title" id="s-title-text"></div>
            <p class="scene-text" id="s-text"></p>
        </div>
        <div class="choices" id="choices"></div>
    </div>

    <!-- 结果界面 -->
    <div class="screen" id="s-result">
        <div class="panel">
            <div class="result-label">梦境告诉你</div>
            <div class="result-type" id="r-type"></div>
            <div class="result-icon" id="r-icon"></div>
            <div class="result-divider"></div>
            <div class="result-desc" id="r-desc"></div>
            <div class="result-traits" id="r-traits"></div>
        </div>
        <p class="result-note">这只是此刻的你。<br>下次做梦，也许会是另一个答案。</p>
        <button class="btn-main" onclick="restart()">再做一次梦</button>
    </div>

</div>

<script>
// 生成星星
(function() {
    const c = document.getElementById('stars');
    for (let i = 0; i < 130; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const size = Math.random() * 2.2 + 0.4;
        s.style.cssText = `width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--dur:${(Math.random()*4+2).toFixed(1)}s;--max-op:${(Math.random()*0.65+0.15).toFixed(2)};animation-delay:${(Math.random()*6).toFixed(1)}s;`;
        c.appendChild(s);
    }
})();

// ── 场景数据 ──
const scenes = [
    {
        title: "薄雾中的路口",
        text: "你在柔软的光雾中慢慢醒来，不知身在何处，却感到莫名安心。眼前出现了两条路——左边，深处闪烁着隐约的星光；右边，传来轻轻的流水声。",
        choices: [
            { text: "朝着星光走去，想看看那里藏着什么", t: "A" },
            { text: "循着水声走去，流水的方向总不会错", t: "B" }
        ]
    },
    {
        title: "意想不到的相遇",
        text: "走着走着，你发现一只小小的发光生物趴在路边的石头上。它抬起头望着你，眼里有某种说不清的东西——像是期待，又像是在问你什么。",
        choices: [
            { text: "蹲下来，试着跟它说话", t: "A" },
            { text: "轻轻摸了摸它，再继续往前", t: "B" }
        ]
    },
    {
        title: "会发光的小屋",
        text: "前方出现一座小屋，窗户透出温暖的橙黄色光，门虚掩着，缝隙里飘出一种你记得却说不清名字的气味。",
        choices: [
            { text: "直接推开门走进去", t: "A" },
            { text: "先在门口停留片刻，感受一下气氛", t: "B" }
        ]
    },
    {
        title: "桌上的两样东西",
        text: "屋里的桌上放着两样东西：一封没有署名的信，信封上写着「给你」；一本空白的日记本，旁边放着一支笔。",
        choices: [
            { text: "先拆开那封信看看", t: "A" },
            { text: "先拿起日记本，想写点什么", t: "B" }
        ]
    },
    {
        title: "窗外的雨",
        text: "突然，窗外下起了细雨。雨声很轻，打在叶子上，像有人在低声说话。屋后墙角放着一把旧伞。",
        choices: [
            { text: "撑起旧伞，出去走走", t: "A" },
            { text: "搬把椅子坐在窗边，静静听雨", t: "B" }
        ]
    },
    {
        title: "梦的尽头",
        text: "雨停了，天边出现一道淡淡的光晕。你感觉到了——梦快要结束了，那道光是醒来的方向。",
        choices: [
            { text: "想再多留一会儿，四处看看", t: "A" },
            { text: "微笑着，带着这段记忆走向那道光", t: "B" }
        ]
    }
];

// ── 结果数据 ──
const results = [
    {
        minA: 5,
        type: "自由的探索者",
        icon: "✦",
        desc: "你天生对未知充满好奇，总是朝着没走过的方向迈出第一步。在你眼里，世界是无数个等待打开的门，而不是需要绕开的陷阱。你享受相遇，也不怕冒险。这种能量让你的生命很有活力——有时候你自己可能都没意识到，你给身边的人带来了多少光。",
        traits: ["好奇心旺盛", "行动派", "开放", "充满活力"]
    },
    {
        minA: 3,
        type: "温暖的旅人",
        icon: "◈",
        desc: "你有探索的勇气，也懂得在途中驻足。你喜欢向外走，但不会忘了留意路边的细节——那只发光的小生物，那封信，那道雨后的光晕。你对人和情感有天然的感受力，总能在人群里感受到别人感受不到的温度。",
        traits: ["感受力强", "有温度", "勇敢又细腻", "重视关系"]
    },
    {
        minA: 1,
        type: "细腻的思考者",
        icon: "◇",
        desc: "你习惯在行动之前感受，在感受之后思考。你不是不勇敢，只是你的方式是先理解，再迈步。那些别人忽略的气氛、声音和细节，在你这里都会被好好收藏。你的内心比外表丰富得多，而那些安静的时刻，往往是你最有力量的时候。",
        traits: ["内省", "感受细腻", "沉稳", "有深度"]
    },
    {
        minA: 0,
        type: "内心的守望者",
        icon: "○",
        desc: "你有一颗安静而深邃的心。不是因为封闭，而是因为你清楚，最值得探索的地方往往在自己内部。你喜欢观察，喜欢感受，喜欢把体验慢慢消化成属于自己的理解。在喧嚣的世界里，你身上有一种稀缺的东西——宁静，和真正与自己相处的能力。",
        traits: ["独立内省", "善于倾听", "深思熟虑", "与自己和平"]
    }
];

// ── 游戏状态 ──
let cur = 0, scoreA = 0;

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const el = document.getElementById(id);
    el.style.animation = 'none';
    el.offsetHeight; // reflow
    el.style.animation = '';
    el.classList.add('active');
}

function startGame() {
    cur = 0; scoreA = 0;
    renderScene();
    showScreen('s-scene');
}

function renderScene() {
    const sc = scenes[cur];
    document.getElementById('meta').textContent = `场景 ${cur + 1} · ${scenes.length}`;
    document.getElementById('s-title-text').textContent = sc.title;
    document.getElementById('s-text').textContent = sc.text;
    document.getElementById('progress').style.width = `${(cur / scenes.length) * 100}%`;

    const box = document.getElementById('choices');
    box.innerHTML = '';
    sc.choices.forEach((ch, i) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerHTML = `<span class="choice-mark">${i === 0 ? '✧ 选择一' : '✦ 选择二'}</span>${ch.text}`;
        btn.onclick = () => pick(ch.t, btn);
        box.appendChild(btn);
    });
}

function pick(type, btnEl) {
    // 禁用所有按钮防止连点
    document.querySelectorAll('.choice-btn').forEach(b => b.style.pointerEvents = 'none');
    btnEl.style.background = 'rgba(107,79,160,0.4)';
    btnEl.style.borderColor = 'rgba(180,130,245,0.7)';

    if (type === 'A') scoreA++;
    cur++;

    setTimeout(() => {
        if (cur >= scenes.length) {
            document.getElementById('progress').style.width = '100%';
            setTimeout(showResult, 200);
        } else {
            renderScene();
        }
    }, 380);
}

function showResult() {
    const r = results.find(x => scoreA >= x.minA);
    document.getElementById('r-type').textContent = r.type;
    document.getElementById('r-icon').textContent = r.icon;
    document.getElementById('r-desc').textContent = r.desc;
    document.getElementById('r-traits').innerHTML = r.traits.map(t => `<span class="trait">${t}</span>`).join('');
    showScreen('s-result');
}

function restart() {
    showScreen('s-title');
}
</script>
</body>
</html>
