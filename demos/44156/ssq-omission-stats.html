<script>
// ===================== 全局数据 =====================
let ssqData = [];
let statsResult = null;

// ===================== 数据解析 =====================
function parseData(text) {
  const lines = text.trim().split(/\n/);
  const result = [];
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed) continue;
    // 尝试多种分隔符
    const parts = trimmed.split(/[,\s\t]+/).map(s => s.trim()).filter(s => s);
    if (parts.length >= 8) {
      const nums = parts.slice(-7).map(Number).filter(n => !isNaN(n));
      if (nums.length === 7) {
        const red = nums.slice(0, 6).sort((a, b) => a - b);
        const blue = nums[6];
        if (red.every(n => n >= 1 && n <= 33) && blue >= 1 && blue <= 16) {
          result.push({ period: parts[0] || String(result.length + 1), red, blue });
        }
      }
    }
  }
  return result.reverse(); // 从早到晚排列
}

// ===================== 核心统计逻辑 =====================
function analyzeData() {
  const text = document.getElementById('dataInput').value;
  if (!text.trim()) { alert('请先导入数据'); return; }
  ssqData = parseData(text);
  if (ssqData.length < 5) { alert('数据量过少，至少需要5期数据'); return; }

  statsResult = computeStats(ssqData);
  renderOverview(statsResult);
  renderDetail(statsResult);
  renderCharts(ssqData, statsResult);
  renderSuggestions(statsResult);

  ['overviewSection','detailSection','chartSection','suggestSection'].forEach(id =>
    document.getElementById(id).classList.remove('hidden')
  );
}

function computeStats(data) {
  const n = data.length;
  const latest = data[n - 1];

  // 1. 红球单号遗漏
  const redOmission = {};
  for (let num = 1; num <= 33; num++) {
    let miss = 0;
    for (let i = n - 1; i >= 0; i--) {
      if (data[i].red.includes(num)) break;
      miss++;
    }
    redOmission[num] = miss;
  }

  // 2. 蓝球遗漏
  const blueOmission = {};
  for (let num = 1; num <= 16; num++) {
    let miss = 0;
    for (let i = n - 1; i >= 0; i--) {
      if (data[i].blue === num) break;
      miss++;
    }
    blueOmission[num] = miss;
  }

  // 3. 大小比遗漏 (大号>=17)
  const sizeRatioOmission = {};
  const sizeRatios = ['0:6','1:5','2:4','3:3','4:2','5:1','6:0'];
  sizeRatios.forEach(r => sizeRatioOmission[r] = 0);
  for (let i = n - 1; i >= 0; i--) {
    const big = data[i].red.filter(x => x >= 17).length;
    const ratio = `${big}:${6 - big}`;
    if (sizeRatioOmission.hasOwnProperty(ratio) && sizeRatioOmission[ratio] === 0) {
      // 第一次遇到，继续找上次出现
      let miss = 0;
      for (let j = i - 1; j >= 0; j--) {
        const bj = data[j].red.filter(x => x >= 17).length;
        const rj = `${bj}:${6 - bj}`;
        if (rj === ratio) break;
        miss++;
      }
      sizeRatioOmission[ratio] = miss + 1;
    }
  }
  // 修正：重新计算
  sizeRatios.forEach(r => sizeRatioOmission[r] = 0);
  for (let ri = 0; ri < sizeRatios.length; ri++) {
    const r = sizeRatios[ri];
    let miss = 0;
    for (let i = n - 1; i >= 0; i--) {
      const big = data[i].red.filter(x => x >= 17).length;
      const ratio = `${big}:${6 - big}`;
      if (ratio === r) break;
      miss++;
    }
    sizeRatioOmission[r] = miss;
  }

  // 4. 奇偶比遗漏
  const oddEvenOmission = {};
  const oeRatios = ['0:6','1:5','2:4','3:3','4:2','5:1','6:0'];
  oeRatios.forEach(r => oddEvenOmission[r] = 0);
  for (let ri = 0; ri < oeRatios.length; ri++) {
    const r = oeRatios[ri];
    let miss = 0;
    for (let i = n - 1; i >= 0; i--) {
      const odd = data[i].red.filter(x => x % 2 === 1).length;
      const ratio = `${odd}:${6 - odd}`;
      if (ratio === r) break;
      miss++;
    }
    oddEvenOmission[r] = miss;
  }

  // 5. 和值范围遗漏
  const sumRanges = {
    '60以下': s => s < 60,
    '60-79': s => s >= 60 && s <= 79,
    '80-99': s => s >= 80 && s <= 99,
    '100-119': s => s >= 100 && s <= 119,
    '120-139': s => s >= 120 && s <= 139,
    '140以上': s => s >= 140
  };
  const sumOmission = {};
  Object.keys(sumRanges).forEach(k => sumOmission[k] = 0);
  for (const key of Object.keys(sumRanges)) {
    let miss = 0;
    for (let i = n - 1; i >= 0; i--) {
      const sum = data[i].red.reduce((a, b) => a + b, 0);
      if (sumRanges[key](sum)) break;
      miss++;
    }
    sumOmission[key] = miss;
  }

  // 6. 连号遗漏
  const hasConsecutive = (reds) => {
    for (let i = 0; i < reds.length - 1; i++) {
      if (reds[i + 1] - reds[i] === 1) return true;
    }
    return false;
  };
  let consecutiveMiss = 0;
  for (let i = n - 1; i >= 0; i--) {
    if (hasConsecutive(data[i].red)) break;
    consecutiveMiss++;
  }

  // 7. 区间分布遗漏 (1-11, 12-22, 23-33)
  const zoneOmission = { '一区偏多': 0, '二区偏多': 0, '三区偏多': 0, '均匀分布': 0 };
  const zoneKeys = Object.keys(zoneOmission);
  for (const key of zoneKeys) {
    let miss = 0;
    for (let i = n - 1; i >= 0; i--) {
      const r = data[i].red;
      const z1 = r.filter(x => x <= 11).length;
      const z2 = r.filter(x => x >= 12 && x <= 22).length;
      const z3 = r.filter(x => x >= 23).length;
      let matched = false;
      if (key === '一区偏多' && z1 >= 3) matched = true;
      if (key === '二区偏多' && z2 >= 3) matched = true;
      if (key === '三区偏多' && z3 >= 3) matched = true;
      if (key === '均匀分布' && z1 === 2 && z2 === 2 && z3 === 2) matched = true;
      if (matched) break;
      miss++;
    }
    zoneOmission[key] = miss;
  }

  // 8. 同尾号遗漏
  let sameTailMiss = 0;
  for (let i = n - 1; i >= 0; i--) {
    const tails = data[i].red.map(x => x % 10);
    const uniq = new Set(tails);
    if (tails.length !== uniq.size) break;
    sameTailMiss++;
  }

  // 9. 历史最大遗漏
  const redMaxOmission = {};
  for (let num = 1; num <= 33; num++) {
    let maxMiss = 0, curMiss = 0;
    for (let i = 0; i < n; i++) {
      if (data[i].red.includes(num)) {
        maxMiss = Math.max(maxMiss, curMiss);
        curMiss = 0;
      } else {
        curMiss++;
      }
    }
    redMaxOmission[num] = Math.max(maxMiss, curMiss);
  }

  const blueMaxOmission = {};
  for (let num = 1; num <= 16; num++) {
    let maxMiss = 0, curMiss = 0;
    for (let i = 0; i < n; i++) {
      if (data[i].blue === num) {
        maxMiss = Math.max(maxMiss, curMiss);
        curMiss = 0;
      } else {
        curMiss++;
      }
    }
    blueMaxOmission[num] = Math.max(maxMiss, curMiss);
  }

  return {
    totalPeriods: n,
    latest,
    redOmission,
    blueOmission,
    sizeRatioOmission,
    oddEvenOmission,
    sumOmission,
    consecutiveMiss,
    zoneOmission,
    sameTailMiss,
    redMaxOmission,
    blueMaxOmission
  };
}

// ===================== 渲染概览 =====================
function renderOverview(s) {
  const avgRedMiss = (Object.values(s.redOmission).reduce((a, b) => a + b, 0) / 33).toFixed(1);
  const avgBlueMiss = (Object.values(s.blueOmission).reduce((a, b) => a + b, 0) / 16).toFixed(1);
  const maxRed = Object.entries(s.redOmission).sort((a, b) => b[1] - a[1])[0];
  const maxBlue = Object.entries(s.blueOmission).sort((a, b) => b[1] - a[1])[0];

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="stat-value">${s.totalPeriods}</div><div class="stat-label">统计期数</div></div>
    <div class="stat-card"><div class="stat-value">${avgRedMiss}</div><div class="stat-label">红球平均遗漏</div></div>
    <div class="stat-card"><div class="stat-value">${avgBlueMiss}</div><div class="stat-label">蓝球平均遗漏</div></div>
    <div class="stat-card"><div class="stat-value" style="color:var(--accent2)">${maxRed[0]}</div><div class="stat-label">红球最大遗漏 ${maxRed[1]}期</div></div>
    <div class="stat-card"><div class="stat-value" style="color:var(--info)">${maxBlue[0]}</div><div class="stat-label">蓝球最大遗漏 ${maxBlue[1]}期</div></div>
    <div class="stat-card"><div class="stat-value" style="color:var(--success)">${s.consecutiveMiss}</div><div class="stat-label">连号遗漏期数</div></div>
  `;
}

// ===================== 渲染详细统计 =====================
function renderDetail(s) {
  const tabs = [
    { id: 'red', label: '红球遗漏' },
    { id: 'blue', label: '蓝球遗漏' },
    { id: 'size', label: '大小比' },
    { id: 'oddeven', label: '奇偶比' },
    { id: 'sum', label: '和值范围' },
    { id: 'zone', label: '区间分布' }
  ];

  const tabContainer = document.getElementById('statTabs');
  const panelContainer = document.getElementById('tabPanels');
  tabContainer.innerHTML = '';
  panelContainer.innerHTML = '';

  tabs.forEach((t, idx) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (idx === 0 ? ' active' : '');
    btn.textContent = t.label;
    btn.onclick = () => switchTab('stat', t.id);
    tabContainer.appendChild(btn);

    const panel = document.createElement('div');
    panel.className = 'tab-panel' + (idx === 0 ? ' active' : '');
    panel.id = `stat-panel-${t.id}`;
    panel.innerHTML = generateTable(t.id, s);
    panelContainer.appendChild(panel);
  });
}

function switchTab(group, id) {
  document.querySelectorAll(`#${group === 'stat' ? 'statTabs' : 'chartTabs'} .tab-btn`).forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll(`#${group === 'stat' ? 'tabPanels' : 'chartPanels'} .tab-panel`).forEach(p => p.classList.remove('active'));
  document.getElementById(`${group}-panel-${id}`).classList.add('active');
  if (group === 'chart') {
    setTimeout(() => {
      const chartDom = document.getElementById(`${group}-panel-${id}`).querySelector('[id^="chart-"]');
      if (chartDom && window.echarts) {
        const inst = echarts.getInstanceByDom(chartDom);
        if (inst) inst.resize();
      }
    }, 50);
  }
}

function generateTable(type, s) {
  let rows = '';
  const getClass = v => v >= 10 ? 'omission-high' : v >= 5 ? 'omission-mid' : 'omission-low';

  if (type === 'red') {
    for (let num = 1; num <= 33; num++) {
      const miss = s.redOmission[num];
      const maxMiss = s.redMaxOmission[num];
      rows += `<tr><td><span class="ball ball-red">${String(num).padStart(2, '0')}</span></td><td class="${getClass(miss)}">${miss}</td><td>${maxMiss}</td><td>${(miss / (maxMiss || 1) * 100).toFixed(1)}%</td></tr>`;
    }
    return `<div class="table-wrap"><table><thead><tr><th>号码</th><th>当前遗漏</th><th>历史最大</th><th>遗漏进度</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  if (type === 'blue') {
    for (let num = 1; num <= 16; num++) {
      const miss = s.blueOmission[num];
      const maxMiss = s.blueMaxOmission[num];
      rows += `<tr><td><span class="ball ball-blue">${String(num).padStart(2, '0')}</span></td><td class="${getClass(miss)}">${miss}</td><td>${maxMiss}</td><td>${(miss / (maxMiss || 1) * 100).toFixed(1)}%</td></tr>`;
    }
    return `<div class="table-wrap"><table><thead><tr><th>号码</th><th>当前遗漏</th><th>历史最大</th><th>遗漏进度</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  if (type === 'size') {
    Object.entries(s.sizeRatioOmission).forEach(([k, v]) => {
      rows += `<tr><td>${k}</td><td class="${getClass(v)}">${v}</td></tr>`;
    });
    return `<div class="table-wrap"><table><thead><tr><th>大小比</th><th>当前遗漏</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  if (type === 'oddeven') {
    Object.entries(s.oddEvenOmission).forEach(([k, v]) => {
      rows += `<tr><td>${k}</td><td class="${getClass(v)}">${v}</td></tr>`;
    });
    return `<div class="table-wrap"><table><thead><tr><th>奇偶比</th><th>当前遗漏</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  if (type === 'sum') {
    Object.entries(s.sumOmission).forEach(([k, v]) => {
      rows += `<tr><td>${k}</td><td class="${getClass(v)}">${v}</td></tr>`;
    });
    return `<div class="table-wrap"><table><thead><tr><th>和值范围</th><th>当前遗漏</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  if (type === 'zone') {
    Object.entries(s.zoneOmission).forEach(([k, v]) => {
      rows += `<tr><td>${k}</td><td class="${getClass(v)}">${v}</td></tr>`;
    });
    return `<div class="table-wrap"><table><thead><tr><th>区间分布</th><th>当前遗漏</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  return '';
}

// ===================== 渲染建议 =====================
function renderSuggestions(s) {
  // 红球推荐：遗漏>5的号码
  const hotRed = Object.entries(s.redOmission).filter(([_, v]) => v >= 5).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([k, _]) => k);
  const warmRed = Object.entries(s.redOmission).filter(([_, v]) => v >= 3 && v < 5).sort((a, b) => b[1] - a[1]).map(([k, _]) => k);

  // 蓝球推荐
  const hotBlue = Object.entries(s.blueOmission).filter(([_, v]) => v >= 5).sort((a, b) => b[1] - a[1]).map(([k, _]) => k);

  // 大小比推荐
  const sizeRec = Object.entries(s.sizeRatioOmission).sort((a, b) => a[1] - b[1]).slice(0, 3).map(([k, _]) => k);

  // 奇偶比推荐
  const oeRec = Object.entries(s.oddEvenOmission).sort((a, b) => a[1] - b[1]).slice(0, 3).map(([k, _]) => k);

  // 和值推荐
  const sumRec = Object.entries(s.sumOmission).sort((a, b) => a[1] - b[1]).slice(0, 3).map(([k, _]) => k);

  document.getElementById('suggestionGrid').innerHTML = `
    <div class="suggestion-card">
      <h4>红球重点关注（遗漏≥5）</h4>
      <div>${hotRed.map(x => `<span class="tag">${String(x).padStart(2,'0')}</span>`).join('')}</div>
      <div class="suggestion-desc">这些号码已多期未出，回补概率较高</div>
    </div>
    <div class="suggestion-card">
      <h4>红球次关注（遗漏3-4）</h4>
      <div>${warmRed.map(x => `<span class="tag tag-blue">${String(x).padStart(2,'0')}</span>`).join('')}</div>
      <div class="suggestion-desc">可适当搭配选择</div>
    </div>
    <div class="suggestion-card">
      <h4>蓝球重点关注</h4>
      <div>${hotBlue.length ? hotBlue.map(x => `<span class="tag">${String(x).padStart(2,'0')}</span>`).join('') : '<span class="tag tag-green">暂无高遗漏</span>'}</div>
      <div class="suggestion-desc">蓝球遗漏较高的号码</div>
    </div>
    <div class="suggestion-card">
      <h4>推荐大小比</h4>
      <div>${sizeRec.map(x => `<span class="tag">${x}</span>`).join('')}</div>
      <div class="suggestion-desc">按遗漏从小到大排序，靠前的近期可能出现</div>
    </div>
    <div class="suggestion-card">
      <h4>推荐奇偶比</h4>
      <div>${oeRec.map(x => `<span class="tag">${x}</span>`).join('')}</div>
      <div class="suggestion-desc">按遗漏从小到大排序</div>
    </div>
    <div class="suggestion-card">
      <h4>推荐和值范围</h4>
      <div>${sumRec.map(x => `<span class="tag">${x}</span>`).join('')}</div>
      <div class="suggestion-desc">和值遗漏较小的区间更值得关注</div>
    </div>
  `;
}

// ===================== 渲染图表 =====================
function renderCharts(data, s) {
  const tabs = [
    { id: 'redChart', label: '红球遗漏图' },
    { id: 'blueChart', label: '蓝球遗漏图' },
    { id: 'trendChart', label: '和值走势' }
  ];

  const tabContainer = document.getElementById('chartTabs');
  const panelContainer = document.getElementById('chartPanels');
  tabContainer.innerHTML = '';
  panelContainer.innerHTML = '';

  tabs.forEach((t, idx) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (idx === 0 ? ' active' : '');
    btn.textContent = t.label;
    btn.onclick = () => switchTab('chart', t.id);
    tabContainer.appendChild(btn);

    const panel = document.createElement('div');
    panel.className = 'tab-panel' + (idx === 0 ? ' active' : '');
    panel.id = `chart-panel-${t.id}`;
    panel.innerHTML = `
      <figure class="chart-figure">
        <figcaption>${t.label}</figcaption>
        <div id="chart-${t.id}" class="chart-container"></div>
      </figure>
    `;
    panelContainer.appendChild(panel);
  });

  // 触发图表初始化
  if (window.initSSQCharts) {
    setTimeout(() => window.initSSQCharts(data, s), 100);
  }
}
