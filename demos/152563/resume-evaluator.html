<div class="container">
  <header>
    <h1>简历智能评估系统</h1>
    <p>上传求职者简历，与招聘需求智能比对，快速生成匹配评估报告</p>
  </header>

  <!-- 基本信息 -->
  <div class="card">
    <div class="card-title">
      <span class="icon" style="background: var(--accent-light); color: var(--accent);">&#128100;</span>
      基本信息
    </div>
    <div class="form-grid">
      <div class="form-group half-width">
        <label>姓名 <span class="required">*</span></label>
        <input type="text" id="name" placeholder="请输入求职者姓名">
      </div>
      <div class="form-group half-width">
        <label>联系方式</label>
        <input type="text" id="contact" placeholder="手机 / 邮箱">
      </div>
      <div class="form-group half-width">
        <label>应聘岗位 <span class="required">*</span></label>
        <input type="text" id="position" placeholder="例如：前端开发工程师">
      </div>
    </div>
  </div>

  <div class="two-col">
    <!-- 招聘需求 -->
    <div class="card">
      <div class="card-title">
        <span class="icon" style="background: var(--accent2-light); color: var(--accent2);">&#128221;</span>
        招聘需求
      </div>
      <div class="form-group full-width">
        <label>岗位招聘要求 <span class="required">*</span></label>
        <textarea id="jobReq" placeholder="请填写招聘需求，包含技能要求、经验年限、学历要求、岗位职责等...

示例：
- 3年以上前端开发经验
- 精通 React / Vue 框架
- 熟悉 TypeScript
- 本科以上学历"></textarea>
      </div>
    </div>

    <!-- 简历 -->
    <div class="card">
      <div class="card-title">
        <span class="icon" style="background: #fef3c7; color: #d97706;">&#128196;</span>
        求职者简历
      </div>
      <div class="form-group full-width">
        <label>上传简历文件</label>
        <div class="upload-zone" id="uploadZone">
          <div class="upload-placeholder">
            <div class="upload-icon">&#128228;</div>
            <p>点击或拖拽文件到此处上传</p>
            <div class="upload-hint">支持 .txt / .pdf / .doc / .docx</div>
          </div>
          <div class="file-name" id="fileName"></div>
          <input type="file" id="fileInput" accept=".txt,.pdf,.doc,.docx" style="display:none">
        </div>
        <div class="or-divider">或</div>
        <label>直接粘贴简历内容 <span class="required">*</span></label>
        <textarea id="resumeText" placeholder="将简历内容直接粘贴到此处..."></textarea>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="analyzeBtn" onclick="startAnalyze()">
      <span>&#128269;</span> 开始评估
    </button>
  </div>

  <!-- 评估结果 -->

        <span class="icon" style="background: var(--accent-light); color: var(--accent);">&#127942;</span>
        评估结果

        <div class="score-card">

          <div class="score-value" id="scoreValue">0</div>
          <div class="score-desc" id="scoreDesc">--</div>
        </div>
        <div>
          <div class="detail-grid">
            <div class="detail-card">
              <h4><span style="color: var(--accent2);">&#9989;</span> 匹配项</h4>
              <div class="tag-list" id="matchList"></div>
            </div>
            <div class="detail-card">
              <h4><span style="color: var(--danger);">&#10060;</span> 缺失项</h4>
              <div class="tag-list" id="missList"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="card" style="margin-top: 1.5rem;">
        <div class="card-title">
          <span class="icon" style="background: #e0e7ff; color: #4338ca;">&#128200;</span>
          能力维度分析
        </div>
        <div id="radarChart" class="chart-container"></div>
      </div>

      <div class="conclusion-box">
        <h4>&#128161; 评估结论</h4>
        <p id="conclusionText"></p>
      </div>
    </div>

<script>
// PDF.js worker
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const fileName = document.getElementById('fileName');
const resumeText = document.getElementById('resumeText');

uploadZone.addEventListener('click', () => fileInput.click());

uploadZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  uploadZone.classList.add('dragover');
});

uploadZone.addEventListener('dragleave', () => {
  uploadZone.classList.remove('dragover');
});

uploadZone.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  const files = e.dataTransfer.files;
  if (files.length > 0) handleFile(files[0]);
});

fileInput.addEventListener('change', (e) => {
  if (e.target.files.length > 0) handleFile(e.target.files[0]);
});

async function handleFile(file) {
  uploadZone.classList.add('has-file');
  fileName.textContent = file.name;

  const ext = file.name.split('.').pop().toLowerCase();
  let text = '';

  try {
    if (ext === 'txt') {
      text = await file.text();
    } else if (ext === 'pdf') {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const pages = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        pages.push(content.items.map(item => item.str).join(' '));
      }
      text = pages.join('\n');
    } else if (ext === 'docx') {
      const arrayBuffer = await file.arrayBuffer();
      const result = await mammoth.extractRawText({ arrayBuffer });
      text = result.value;
    } else if (ext === 'doc') {
      text = '[.doc 格式暂不支持直接解析，请将简历另存为 .docx 或 .txt 后上传，或直接粘贴内容]';
    } else {
      text = '[不支持的文件格式]';
    }
  } catch (err) {
    text = '[文件解析失败，请直接粘贴简历内容]';
    console.error(err);
  }

  if (text && !text.startsWith('[')) {
    resumeText.value = text;
  }
}

// 分词与关键词提取
function extractKeywords(text) {
  const clean = text.toLowerCase()
    .replace(/[^\u4e00-\u9fa5a-zA-Z0-9+#\.\-]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();

  // 技能关键词库
  const skillPatterns = [
    // 编程语言
    'java','python','javascript','js','typescript','ts','go','golang','rust','c++','c#','php','ruby','swift','kotlin','dart',
    // 前端
    'react','vue','angular','svelte','jquery','html','css','sass','less','webpack','vite','next.js','nuxt.js','uni-app','flutter',
    // 后端
    'spring','springboot','django','flask','fastapi','express','nestjs','node.js','nodejs','laravel',
    // 数据库
    'mysql','postgresql','oracle','sqlserver','mongodb','redis','elasticsearch','sqlite','dynamodb','neo4j',
    // 大数据/AI
    'hadoop','spark','flink','kafka','tensorflow','pytorch','sklearn','pandas','numpy','matplotlib','opencv','nlp','机器学习','深度学习','大模型','llm',
    // 运维/云
    'docker','kubernetes','k8s','jenkins','git','github','gitlab','ci/cd','aws','azure','阿里云','腾讯云','linux','nginx',
    // 软技能
    '团队协作','沟通能力','项目管理','需求分析','文档编写','敏捷开发','scrum','英语','cet-4','cet-6',
    // 其他技术
    'restful','graphql','grpc','微服务','分布式','高并发','多线程','设计模式','mvc','mvvm','测试驱动','单元测试','自动化测试'
  ];

  // 经验年限模式
  const expPatterns = [
    /(\d+)\s*年(?:及)?以上/, /(\d+)\s*年.*?经验/, /(\d+)\+\s*年/,
    /至少\s*(\d+)\s*年/, /(\d+)\s*年\s*工作/, /经验\s*(\d+)\s*年/
  ];

  // 学历模式
  const eduPatterns = ['本科','硕士','博士','大专','研究生','985','211','双一流','计算机相关专业'];

  const foundSkills = [];
  skillPatterns.forEach(skill => {
    if (clean.includes(skill.toLowerCase())) {
      foundSkills.push(skill);
    }
  });

  let foundExp = null;
  for (const pattern of expPatterns) {
    const match = text.match(pattern);
    if (match) {
      foundExp = parseInt(match[1]);
      break;
    }
  }

  const foundEdu = eduPatterns.filter(e => text.includes(e));

  return { skills: foundSkills, exp: foundExp, edu: foundEdu, raw: clean };
}

function analyzeMatch(jobData, resumeData) {
  const matchSkills = [];
  const missSkills = [];

  jobData.skills.forEach(skill => {
    if (resumeData.skills.includes(skill)) {
      matchSkills.push(skill);
    } else {
      missSkills.push(skill);
    }
  });

  // 如果招聘需求没提取到技能，尝试从简历反过来找
  if (jobData.skills.length === 0 && resumeData.skills.length > 0) {
    resumeData.skills.forEach(skill => {
      matchSkills.push(skill);
    });
  }

  // 计算匹配度
  const totalReqs = jobData.skills.length + (jobData.exp ? 1 : 0) + jobData.edu.length;
  let matchedCount = matchSkills.length;

  // 经验匹配
  let expMatched = false;
  if (jobData.exp && resumeData.exp) {
    if (resumeData.exp >= jobData.exp) {
      matchedCount++;
      expMatched = true;
    }
  } else if (!jobData.exp) {
    matchedCount++;
    expMatched = true;
  }

  // 学历匹配
  let eduMatched = false;
  if (jobData.edu.length > 0) {
    const hasEdu = jobData.edu.some(e => resumeData.raw.includes(e));
    if (hasEdu) {
      matchedCount++;
      eduMatched = true;
    }
  } else {
    matchedCount++;
    eduMatched = true;
  }

  const score = totalReqs > 0 ? Math.round((matchedCount / (totalReqs || 1)) * 100) : 70;

  // 维度评分
  const skillScore = jobData.skills.length > 0
    ? Math.round((matchSkills.length / jobData.skills.length) * 100)
    : 60;
  const expScore = expMatched ? 100 : (resumeData.exp ? Math.round((resumeData.exp / (jobData.exp || 1)) * 100) : 0);
  const eduScore = eduMatched ? 100 : 50;

  // 额外维度（从文本推断）
  const hasProject = /项目|project|负责|主导|参与/.test(resumeData.raw);
  const projectScore = hasProject ? 90 : 40;

  const hasResponsibility = /负责|主导|带领|管理|协调|设计|开发|维护|优化/.test(resumeData.raw);
  const respScore = hasResponsibility ? 85 : 50;

  return {
    score,
    matchSkills,
    missSkills,
    skillScore,
    expScore,
    eduScore,
    projectScore,
    respScore,
    expMatched,
    eduMatched
  };
}

function generateConclusion(name, position, result, jobData) {
  let conclusion = '';
  const s = result.score;

  if (s >= 80) {
    conclusion = `求职者 <strong>${name}</strong> 与 <strong>${position}</strong> 岗位高度匹配。`;
    conclusion += ` 核心技能匹配度良好，已掌握 ${result.matchSkills.slice(0, 5).join('、')} 等关键技能。`;
    if (result.missSkills.length > 0) {
      conclusion += ` 建议在面试中进一步了解其对 ${result.missSkills.slice(0, 3).join('、')} 的熟悉程度。`;
    }
    conclusion += ` 综合评估：<strong style="color:var(--accent2)">建议优先安排面试</strong>。`;
  } else if (s >= 60) {
    conclusion = `求职者 <strong>${name}</strong> 与 <strong>${position}</strong> 岗位基本匹配，存在一定适配空间。`;
    conclusion += ` 已具备 ${result.matchSkills.slice(0, 4).join('、')} 等部分核心技能。`;
    if (result.missSkills.length > 0) {
      conclusion += ` 但缺少 ${result.missSkills.slice(0, 4).join('、')} 等要求，需评估其学习能力和成长潜力。`;
    }
    conclusion += ` 综合评估：<strong style="color:var(--warning)">建议进入面试环节进一步考察</strong>。`;
  } else {
    conclusion = `求职者 <strong>${name}</strong> 与 <strong>${position}</strong> 岗位匹配度较低。`;
    if (result.missSkills.length > 0) {
      conclusion += ` 缺失 ${result.missSkills.slice(0, 5).join('、')} 等较多关键要求。`;
    }
    conclusion += ` 综合评估：<strong style="color:var(--danger)">建议谨慎考虑或储备</strong>。`;
  }

  return conclusion;
}

let radarChart = null;

async function startAnalyze() {
  const name = document.getElementById('name').value.trim();
  const position = document.getElementById('position').value.trim();
  const jobReq = document.getElementById('jobReq').value.trim();
  const resume = document.getElementById('resumeText').value.trim();
  const btn = document.getElementById('analyzeBtn');

  if (!name || !position || !jobReq || !resume) {
    alert('请填写完整信息后再进行评估');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 分析中...';

  // 模拟分析延迟
  await new Promise(r => setTimeout(r, 800));

  const jobData = extractKeywords(jobReq);
  const resumeData = extractKeywords(resume);

  // 尝试从简历文本提取工作年限
  const expMatches = resume.match(/(\d{4})\s*年.*?至|(\d{4})\s*-\s*(\d{4}|至今)/g);
  if (expMatches && !resumeData.exp) {
    const years = expMatches.map(m => {
      const nums = m.match(/\d{4}/g);
      if (nums && nums.length >= 2) {
        const end = nums[1] === '至今' || nums[1] === '今' ? 2026 : parseInt(nums[1]);
        return end - parseInt(nums[0]);
      }
      return 0;
    });
    const totalExp = years.reduce((a, b) => a + b, 0);
    if (totalExp > 0) resumeData.exp = totalExp;
  }

  // 从纯文本中再找找年限描述
  if (!resumeData.exp) {
    const m = resume.match(/(\d+)\s*年.*?工作|工作.*?(\d+)\s*年|(\d+)\s*年.*?经验/);
    if (m) resumeData.exp = parseInt(m[1] || m[2] || m[3]);
  }

  const result = analyzeMatch(jobData, resumeData);

  // 显示结果
  document.getElementById('results').classList.add('show');

  // 分数动画
  animateScore(result.score);

  const descEl = document.getElementById('scoreDesc');
  if (result.score >= 80) {
    descEl.textContent = '高度匹配';
    descEl.className = 'score-desc excellent';
  } else if (result.score >= 60) {
    descEl.textContent = '基本匹配';
    descEl.className = 'score-desc good';
  } else {
    descEl.textContent = '匹配度低';
    descEl.className = 'score-desc poor';
  }

  // 匹配项/缺失项
  const matchList = document.getElementById('matchList');
  const missList = document.getElementById('missList');

  matchList.innerHTML = result.matchSkills.length > 0
    ? result.matchSkills.map(s => `<span class="tag tag-match">${s}</span>`).join('')
    : '<span style="color:var(--muted);font-size:0.85rem;">未检测到明显匹配项</span>';

  missList.innerHTML = result.missSkills.length > 0
    ? result.missSkills.map(s => `<span class="tag tag-miss">${s}</span>`).join('')
    : '<span style="color:var(--muted);font-size:0.85rem;">无缺失项</span>';

  // 结论
  document.getElementById('conclusionText').innerHTML = generateConclusion(name, position, result, jobData);

  // 雷达图
  renderRadar(result);

  btn.disabled = false;
  btn.innerHTML = '<span>&#128269;</span> 开始评估';

  // 滚动到结果
  document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
}

function animateScore(target) {
  const el = document.getElementById('scoreValue');
  let current = 0;
  const step = Math.max(1, Math.floor(target / 30));
  const timer = setInterval(() => {
    current += step;
    if (current >= target) {
      current = target;
      clearInterval(timer);
    }
    el.textContent = current + '%';
  }, 30);
}

function renderRadar(result) {
  const chartDom = document.getElementById('radarChart');
  if (radarChart) radarChart.dispose();
  radarChart = echarts.init(chartDom, null, { renderer: 'svg' });

  const option = {
    animation: false,
    tooltip: { trigger: 'item' },
    radar: {
      indicator: [
        { name: '技能匹配', max: 100 },
        { name: '经验年限', max: 100 },
        { name: '学历背景', max: 100 },
        { name: '项目经历', max: 100 },
        { name: '职责契合', max: 100 }
      ],
      shape: 'polygon',
      splitNumber: 4,
      axisName: { color: '#6b7280', fontSize: 13 },
      splitLine: { lineStyle: { color: '#e5e7eb' } },
      splitArea: {
        areaStyle: {
          color: ['rgba(37,99,235,0.02)', 'rgba(37,99,235,0.04)', 'rgba(37,99,235,0.06)', 'rgba(37,99,235,0.08)']
        }
      },
      axisLine: { lineStyle: { color: '#e5e7eb' } }
    },
    series: [{
      type: 'radar',
      data: [{
        value: [result.skillScore, result.expScore, result.eduScore, result.projectScore, result.respScore],
        name: '匹配度',
        areaStyle: { color: 'rgba(37, 99, 235, 0.2)' },
        lineStyle: { color: '#2563eb', width: 2 },
        itemStyle: { color: '#2563eb' },
        symbol: 'circle',
        symbolSize: 6
      }]
    }]
  };

  radarChart.setOption(option);
  window.addEventListener('resize', () => radarChart.resize());
}
</script>
