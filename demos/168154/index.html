    function isAPIConfigured() {
      const cfg = STATE.settings.apiConfig;
      return cfg && cfg.apiKey && cfg.baseUrl && cfg.model;
    }

    async function callLLM(prompt, options = {}) {
      if (!isAPIConfigured()) {
        return { ok: true, text: localLLMResponse(prompt, options.context), local: true, tokens: { input: estimateTokens(prompt), output: estimateTokens(localLLMResponse(prompt, options.context)) } };
      }
      try {
        const cfg = STATE.settings.apiConfig;
        const messages = options.messages || [{ role: 'user', content: prompt }];
        const resp = await fetch(cfg.baseUrl + '/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + cfg.apiKey
          },
          body: JSON.stringify({ model: cfg.model, messages })
        });
        if (!resp.ok) throw new Error('api error ' + resp.status);
        const data = await resp.json();
        const text = data.choices?.[0]?.message?.content || '';
        const inputTokens = data.usage?.prompt_tokens || estimateTokens(JSON.stringify(messages));
        const outputTokens = data.usage?.completion_tokens || estimateTokens(text);
        recordTokenUsage({ inputTokens, outputTokens });
        return { ok: true, text, local: false, tokens: { input: inputTokens, output: outputTokens }, model: data.model || cfg.model };
      } catch (e) {
        const text = localLLMResponse(prompt, options.context);
        return { ok: true, text, local: true, fallback: true, tokens: { input: estimateTokens(prompt), output: estimateTokens(text) } };
      }
    }

    function localLLMResponse(prompt, context) {
      const p = (prompt || '').toLowerCase();
      if (p.includes('总结') || p.includes('概括')) return '这是基于当前数据的简要总结：建议优先处理必回消息。';
      if (p.includes('回复') || p.includes('怎么回')) return '建议先确认对方意图，再给出简洁回复。';
      if (p.includes('重要')) return '根据标签和消息类型，todo 与 help 类消息通常优先级更高。';
      if (context && context.summary) return `关于「${context.summary}」，我可以帮你安排或起草回复。`;
      return '我理解了，你可以告诉我更多细节。';
    }

    function estimateTokens(text) {
      if (!text) return 0;
      // 粗略估算：英文 1 token ≈ 4 字符，中文 1 token ≈ 1 字
      const cn = (text.match(/[\u4e00-\u9fa5]/g) || []).length;
      const other = text.length - cn;
      return Math.ceil(cn + other / 4);
    }

    function recordTokenUsage({ inputTokens = 0, outputTokens = 0, cost = null }) {
      const date = new Date().toISOString().slice(0, 10);
      let usage = STATE.tokenUsage.find(u => u.date === date);
      if (!usage) {
        usage = { date, inputTokens: 0, outputTokens: 0, cost: 0 };
        STATE.tokenUsage.push(usage);
      }
      usage.inputTokens += inputTokens;
      usage.outputTokens += outputTokens;
      if (cost !== null) usage.cost += cost;
      else usage.cost += (inputTokens + outputTokens) * 0.000002; // 粗略费用
      storage.save('tokenUsage', STATE.tokenUsage);
      return usage;
    }

    function getTokenUsage(period) {
      const now = new Date();
      const today = now.toISOString().slice(0, 10);
      let startDate, endDate;
      if (period === 'daily') { startDate = today; endDate = today; }
      else if (period === 'weekly') {
        const d = new Date(now); d.setDate(d.getDate() - d.getDay() + (d.getDay() === 0 ? -6 : 1));
        startDate = d.toISOString().slice(0, 10);
        endDate = today;
      } else {
        startDate = today.slice(0, 7) + '-01';
        endDate = today;
      }
      return STATE.tokenUsage
        .filter(u => u.date >= startDate && u.date <= endDate)
        .reduce((sum, u) => ({ inputTokens: sum.inputTokens + u.inputTokens, outputTokens: sum.outputTokens + u.outputTokens, cost: sum.cost + u.cost }), { inputTokens: 0, outputTokens: 0, cost: 0 });
    }

    function appendQAHistory(role, content, model, tokens) {
      const entry = { id: id('qa'), role, content, timestamp: Date.now(), model: model || '', tokens: tokens || 0 };
      STATE.qaHistory.push(entry);
      storage.save('qaHistory', STATE.qaHistory);
      return entry;
    }

    function exportData() {
      const settings = JSON.parse(JSON.stringify(STATE.settings));
      if (settings.apiConfig && settings.apiConfig.apiKey) {
        settings.apiConfig.apiKey = '__REDACTED__';
      }
      const data = {
        version: CURRENT_SCHEMA_VERSION,
        exportedAt: Date.now(),
        messages: STATE.messages,
        contacts: STATE.contacts,
        tags: STATE.tags,
        settings,
        behaviorLogs: STATE.behaviorLogs,
        qaHistory: STATE.qaHistory,
        tokenUsage: STATE.tokenUsage
      };
      return JSON.stringify(data, null, 2);
    }

    function importData(json) {
      try {
        const data = JSON.parse(json);
        if (!data || typeof data !== 'object') return false;
        if (isArray(data.messages)) STATE.messages = data.messages;
        if (isArray(data.contacts)) STATE.contacts = data.contacts;
        if (isArray(data.tags)) STATE.tags = data.tags;
        if (data.settings && validateSettings(data.settings)) {
          STATE.settings = data.settings;
          if (STATE.settings.apiConfig && STATE.settings.apiConfig.apiKey === '__REDACTED__') {
            STATE.settings.apiConfig.apiKey = '';
          }
        }
        if (isArray(data.behaviorLogs)) STATE.behaviorLogs = data.behaviorLogs;
        if (isArray(data.qaHistory)) STATE.qaHistory = data.qaHistory;
        if (isArray(data.tokenUsage)) STATE.tokenUsage = data.tokenUsage;
        persist();
        storage.save('behavior', STATE.behaviorLogs);
        storage.save('qaHistory', STATE.qaHistory);
        storage.save('tokenUsage', STATE.tokenUsage);
        applyTheme(STATE.settings.theme);
        return true;
      } catch (e) {
        return false;
      }
    }

    function resetData() {
      if (!confirm('确定重置所有数据？此操作不可恢复。')) return;
      storage.clearAll();
      location.reload();
    }

    function applyTheme(theme) {
      const html = document.documentElement;
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = theme === 'dark' || (theme === 'system' && prefersDark);
      html.classList.toggle('dark', isDark);
      STATE.theme = isDark ? 'dark' : 'light';
      const sun = document.getElementById('theme-icon-sun');
      const moon = document.getElementById('theme-icon-moon');
      if (sun) sun.classList.toggle('hidden', isDark);
      if (moon) moon.classList.toggle('hidden', !isDark);
    }

    function saveTheme(theme) {
      STATE.settings.theme = theme;
      persist();
      applyTheme(theme);
    }

    function downloadExport() {
      const blob = new Blob([exportData()], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `xinzhan-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    /* ===== Phase 6a 测试 ===== */
    XINZHAN_TESTS.test('设置 Tab 占位渲染', () => {
      activeTab = 'settings';
      render();
      XINZHAN_TESTS.assert(leftContent.innerHTML.includes('设置'), 'settings left not rendered');
      XINZHAN_TESTS.assert(rightPanel.innerHTML.includes('设置'), 'settings right not rendered');
      activeTab = 'inbox';
      selectedId = null;
      render();
    });

    XINZHAN_TESTS.test('updateTag 修改标签默认动作', () => {
      const tag = STATE.tags.find(t => t.type === 'custom') || createTag('临时测试', 'custom', '#111111', 'can-defer');
      updateTag(tag.id, { defaultAction: 'must-reply' });
      const updated = STATE.tags.find(t => t.id === tag.id);
      XINZHAN_TESTS.assertEqual(updated.defaultAction, 'must-reply', 'tag action not updated');
      if (tag.name === '临时测试') deleteTag(tag.id);
    });

    XINZHAN_TESTS.test('修改类型默认动作同步到 settings', () => {
      const original = STATE.settings.typeDefaultActions.chat;
      STATE.settings.typeDefaultActions.chat = 'must-reply';
      persist();
      const loaded = storage.load('settings', null);
      XINZHAN_TESTS.assertEqual(loaded.typeDefaultActions.chat, 'must-reply', 'type action not persisted');
      STATE.settings.typeDefaultActions.chat = original;
      persist();
    });

    /* ===== Phase 6b 测试 ===== */
    XINZHAN_TESTS.test('isAPIConfigured 正确判断 API 配置', () => {
      const original = STATE.settings.apiConfig;
      STATE.settings.apiConfig = { provider: 'openai', baseUrl: 'https://api.openai.com/v1', apiKey: 'sk-test', model: 'gpt-4o-mini' };
      XINZHAN_TESTS.assert(isAPIConfigured(), 'api should be configured');
      STATE.settings.apiConfig = { provider: 'openai', baseUrl: '', apiKey: '', model: '' };
      XINZHAN_TESTS.assert(!isAPIConfigured(), 'api should not be configured');
      STATE.settings.apiConfig = original;
    });

    XINZHAN_TESTS.test('callLLM 未配置 API 时降级本地模板', async () => {
      const original = STATE.settings.apiConfig;
      STATE.settings.apiConfig = { provider: 'openai', baseUrl: '', apiKey: '', model: '' };
      const result = await callLLM('这条消息重要吗', { context: { summary: '测试' } });
      XINZHAN_TESTS.assert(result.ok && result.local, 'local fallback failed');
      XINZHAN_TESTS.assert(typeof result.text === 'string' && result.text.length > 0, 'local text empty');
      STATE.settings.apiConfig = original;
    });

    XINZHAN_TESTS.test('recordTokenUsage 累加当日用量', () => {
      const beforeLen = STATE.tokenUsage.length;
      recordTokenUsage({ inputTokens: 100, outputTokens: 50 });
      const today = STATE.tokenUsage.find(u => u.date === new Date().toISOString().slice(0, 10));
      XINZHAN_TESTS.assert(!!today, 'today usage not created');
      XINZHAN_TESTS.assert(today.inputTokens >= 100 && today.outputTokens >= 50, 'tokens not recorded');
      // 清理测试数据
      const idx = STATE.tokenUsage.findIndex(u => u.date === new Date().toISOString().slice(0, 10));
      if (STATE.tokenUsage.length > beforeLen && idx !== -1) STATE.tokenUsage.splice(idx, 1);
      storage.save('tokenUsage', STATE.tokenUsage);
    });

    XINZHAN_TESTS.test('exportData / importData 数据一致', () => {
      const exported = exportData();
      const parsed = JSON.parse(exported);
      XINZHAN_TESTS.assert(parsed.messages.length === STATE.messages.length, 'messages mismatch');
      XINZHAN_TESTS.assert(parsed.version === CURRENT_SCHEMA_VERSION, 'version mismatch');
    });

    XINZHAN_TESTS.test('applyTheme 切换 dark 类', () => {
      const html = document.documentElement;
      const originalTheme = STATE.settings.theme;
      applyTheme('dark');
      XINZHAN_TESTS.assert(html.classList.contains('dark'), 'dark class missing');
      applyTheme('light');
      XINZHAN_TESTS.assert(!html.classList.contains('dark'), 'dark class still present');
      saveTheme(originalTheme);
    });

    /* ===== Phase 7 测试 ===== */
    XINZHAN_TESTS.test('暗色模式覆盖 html 根元素', () => {
      applyTheme('dark');
      XINZHAN_TESTS.assert(document.documentElement.classList.contains('dark'), 'dark class not on html');
      applyTheme(STATE.settings.theme);
    });

    XINZHAN_TESTS.test('新导航容器存在且唯一', () => {
      const bottomNav = document.getElementById('bottom-nav');
      XINZHAN_TESTS.assert(!!bottomNav, 'bottom-nav missing');
      XINZHAN_TESTS.assert(document.querySelectorAll('.nav-item').length === 3, 'nav items count wrong');
    });

    XINZHAN_TESTS.test('正常操作不触发 console.error / console.warn', () => {
      const originalError = console.error;
      const originalWarn = console.warn;
      let called = false;
      const tracker = () => { called = true; };
      console.error = tracker;
      console.warn = tracker;
      try {
        getFilteredConversations();
        generateReportData('daily');
        renderConversationCard(STATE.messages[0]);
        render();
      } finally {
        console.error = originalError;
        console.warn = originalWarn;
      }
      XINZHAN_TESTS.assert(!called, 'console error/warn called during normal operations');
    });

    /* ===== Phase 3 / 数据安全与测试收尾 ===== */
    XINZHAN_TESTS.test('导出数据不包含明文 API Key', () => {
      const originalKey = STATE.settings.apiConfig.apiKey;
      STATE.settings.apiConfig.apiKey = 'sk-secret-12345';
      const exported = exportData();
      const parsed = JSON.parse(exported);
      XINZHAN_TESTS.assert(!exported.includes('sk-secret-12345'), 'exported raw api key');
      XINZHAN_TESTS.assertEqual(parsed.settings.apiConfig.apiKey, '__REDACTED__', 'api key not redacted');
      STATE.settings.apiConfig.apiKey = originalKey;
    });

    XINZHAN_TESTS.test('日报/周报/月报均有数据', () => {
      ['daily', 'weekly', 'monthly'].forEach(period => {
        const data = generateReportData(period);
        XINZHAN_TESTS.assert(data.total > 0, `${period} report has no data`);
      });
    });

    XINZHAN_TESTS.test('默认 Tab 为收件箱', () => {
      XINZHAN_TESTS.assert(activeTab === 'inbox', 'default tab not inbox');
      const inboxBtn = document.querySelector('.nav-item[data-tab="inbox"]');
      XINZHAN_TESTS.assert(inboxBtn && inboxBtn.classList.contains('text-clay'), 'inbox nav not active by default');
    });

    XINZHAN_TESTS.test('标记已回复会设置 replied 和 read', () => {
      const m = STATE.messages.find(x => !x.replied) || STATE.messages[0];
      m.replied = false;
      m.read = false;
      markMessageReplied(m.id);
      XINZHAN_TESTS.assert(m.replied, 'message not marked replied');
      XINZHAN_TESTS.assert(m.read, 'message not marked read');
    });

    XINZHAN_TESTS.test('详情页显示草稿预览', () => {
      const m = STATE.messages[0];
      const originalDraft = m.replyDraft;
      m.replyDraft = '这是一条测试草稿内容';
      openMessageDetail(m.id);
      const preview = document.getElementById('msg-detail-draft-preview');
      XINZHAN_TESTS.assert(!preview.classList.contains('hidden'), 'draft preview hidden');
      XINZHAN_TESTS.assert(preview.textContent.includes('这是一条测试草稿内容'), 'draft preview text missing');
      closeMessageDetail();
      m.replyDraft = originalDraft;
    });

    /* ===== 事件绑定（Phase 1 保留模态框与上下文菜单） ===== */
    const btnCloseDetail = document.getElementById('btn-close-detail');
    if (btnCloseDetail) btnCloseDetail.addEventListener('click', closeMessageDetail);
    const msgDetailModal = document.getElementById('msg-detail-modal');
    if (msgDetailModal) msgDetailModal.addEventListener('click', (e) => {
      if (e.target.id === 'msg-detail-modal') closeMessageDetail();
    });

    const btnDetailReply = document.getElementById('btn-detail-reply');
    if (btnDetailReply) btnDetailReply.addEventListener('click', toggleReplyEditor);
    const btnDetailDefer = document.getElementById('btn-detail-defer');
    if (btnDetailDefer) btnDetailDefer.addEventListener('click', () => {
      if (STATE.selectedMessageId) { deferMessage(STATE.selectedMessageId); closeMessageDetail(); }
    });
    const btnDetailReplied = document.getElementById('btn-detail-replied');
    if (btnDetailReplied) btnDetailReplied.addEventListener('click', () => {
      if (STATE.selectedMessageId) markMessageReplied(STATE.selectedMessageId);
    });
    const btnDetailArchive = document.getElementById('btn-detail-archive');
    if (btnDetailArchive) btnDetailArchive.addEventListener('click', () => {
      if (STATE.selectedMessageId) archiveMessage(STATE.selectedMessageId);
    });
    const btnDetailTags = document.getElementById('btn-detail-tags');
    if (btnDetailTags) btnDetailTags.addEventListener('click', toggleTagEditor);
    const btnAddDetailTag = document.getElementById('btn-add-detail-tag');
    if (btnAddDetailTag) btnAddDetailTag.addEventListener('click', addDetailTag);
    const btnSaveReplyDraft = document.getElementById('btn-save-reply-draft');
    if (btnSaveReplyDraft) btnSaveReplyDraft.addEventListener('click', saveReplyDraft);
    const btnAiWriteReply = document.getElementById('btn-ai-write-reply');
    if (btnAiWriteReply) btnAiWriteReply.addEventListener('click', aiWriteReply);

    const btnCloseAiChat = document.getElementById('btn-close-ai-chat');
    if (btnCloseAiChat) btnCloseAiChat.addEventListener('click', closeAIChat);
    const aiChatModal = document.getElementById('ai-chat-modal');
    if (aiChatModal) aiChatModal.addEventListener('click', (e) => {
      if (e.target.id === 'ai-chat-modal') closeAIChat();
    });
    const btnAiChatSend = document.getElementById('btn-ai-chat-send');
    if (btnAiChatSend) btnAiChatSend.addEventListener('click', sendAIChatMessage);
    const aiChatInput = document.getElementById('ai-chat-input');
    if (aiChatInput) aiChatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendAIChatMessage();
    });

    document.querySelectorAll('.context-item').forEach(btn => {
      btn.addEventListener('click', () => {
        const msgId = STATE.contextMenuMsgId;
        const action = btn.dataset.action;
        if (!msgId) return;
        if (action === 'reply') { openMessageDetail(msgId); toggleReplyEditor(); }
        else if (action === 'defer') { deferMessage(msgId); closeMessageDetail(); }
        else if (action === 'mark-replied') { markMessageReplied(msgId); }
        else if (action === 'archive') archiveMessage(msgId);
        else if (action === 'ignore') ignoreMessage(msgId);
        else if (action === 'tags') { openMessageDetail(msgId); toggleTagEditor(); }
        else if (action === 'ask-ai') openAIChat(msgId);
        else if (action === 'star') toggleStarContactByMsg(msgId);
        hideContextMenu();
      });
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#context-menu')) hideContextMenu();
    });

    // 启动测试与初始渲染
    document.addEventListener('DOMContentLoaded', () => {
      applyTheme(STATE.settings.theme);
      render();
      window.runXinzhanTests();
    });
  </script>
