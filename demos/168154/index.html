<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>信栈 Xinzhan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            paper: 'var(--color-paper)',
            card: 'var(--color-card)',
            ink: 'var(--color-ink)',
            'ink-muted': 'var(--color-ink-muted)',
            'ink-light': 'var(--color-ink-light)',
            clay: 'var(--color-clay)',
            ochre: 'var(--color-ochre)',
            'warm-gray': 'var(--color-warm-gray)',
            caramel: 'var(--color-caramel)',
            blush: 'var(--color-blush)',
          },
          fontFamily: {
            display: ['"Noto Serif SC"', 'serif'],
            body: ['"Noto Sans SC"', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-paper: #faf8f5;
      --color-card: #ffffff;
      --color-ink: #2d2a26;
      --color-ink-muted: #6b6560;
      --color-ink-light: #a39e98;
      --color-clay: #c17f59;
      --color-ochre: #b8734a;
      --color-warm-gray: #9a8f85;
      --color-caramel: #d4a574;
      --color-blush: #d9a79c;

      /* 兼容旧代码的别名变量（已映射到温暖编辑风色板） */
      --color-bg: var(--color-paper);
      --color-surface: var(--color-card);
      --color-surface-2: rgba(45, 42, 38, 0.05);
      --color-border: rgba(163, 158, 152, 0.15);
      --color-border-light: rgba(163, 158, 152, 0.10);
      --color-text: var(--color-ink);
      --color-text-muted: var(--color-ink-muted);
      --color-text-light: var(--color-ink-light);
      --color-primary: var(--color-clay);
      --color-primary-hover: var(--color-ochre);
      --color-primary-light: rgba(193, 127, 89, 0.15);
      --color-success: #10B981;
      --color-warning: #F59E0B;
      --color-danger: #DC2626;
      --color-info: var(--color-clay);

      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 2px rgba(45, 42, 38, 0.05);
      --shadow-md: 0 4px 12px rgba(45, 42, 38, 0.08);
      --header-height: 72px;
      --bottom-tab-height: 64px;
    }
    .dark {
      --color-paper: #1a1a1a;
      --color-card: #242424;
      --color-ink: #f5f2ed;
      --color-ink-muted: #a8a29e;
      --color-ink-light: #78716c;
      --color-clay: #a66b4a;
      --color-ochre: #8f5f3e;
      --color-warm-gray: #8a7f75;
      --color-caramel: #b8906a;
      --color-blush: #b88a80;

      --color-surface-2: rgba(255, 255, 255, 0.06);
      --color-border: rgba(255, 255, 255, 0.10);
      --color-border-light: rgba(255, 255, 255, 0.08);
      --color-primary-light: rgba(166, 107, 74, 0.20);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; }
    body {
      font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--color-paper);
      color: var(--color-ink);
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-conic-gradient(
        rgba(45, 42, 38, 0.015) 0% 25%,
        transparent 0% 50%
      ) 0 0 / 4px 4px;
      pointer-events: none;
      z-index: 0;
    }
    .dark body::before {
      background: repeating-conic-gradient(
        rgba(255, 255, 255, 0.015) 0% 25%,
        transparent 0% 50%
      ) 0 0 / 4px 4px;
    }

    #app { position: relative; z-index: 10; display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

    /* 左侧面板 */
    #left-panel { display: flex; flex-direction: column; width: 100%; background: var(--color-paper); border-color: rgba(163,158,152,0.10); }
    @media (min-width: 768px) {
      #left-panel { width: 340px; flex-shrink: 0; border-right-width: 1px; }
    }

    /* 右侧面板 */
    #right-panel { display: none; flex: 1; flex-direction: column; background: var(--color-paper); position: relative; z-index: 20; }
    @media (min-width: 768px) {
      #right-panel { display: flex; }
    }

    .mobile-hidden { display: none !important; }
    .mobile-open { display: flex !important; }

    .font-display { font-family: "Noto Serif SC", serif; }
    .line-clamp-1 {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.35s ease-out forwards; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-8px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }

    @media (min-width: 768px) {
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--color-caramel); border-radius: 3px; }
    }

    .glass {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 8px 32px rgba(45, 42, 38, 0.06);
    }
    .dark .glass {
      background: rgba(36, 36, 36, 0.68);
      border-color: rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    }
    .glass-strong {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.55);
    }
    .dark .glass-strong {
      background: rgba(40, 40, 40, 0.82);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .accent-strip {
      height: 3px;
      width: 100%;
      background: linear-gradient(90deg, var(--color-clay) 0%, var(--color-ochre) 35%, var(--color-caramel) 65%, var(--color-blush) 100%);
      opacity: 0.85;
    }
    .stat-divider {
      width: 1px;
      align-self: stretch;
      background: rgba(163, 158, 152, 0.2);
    }
    .dark .stat-divider { background: rgba(168, 162, 158, 0.15); }

    /* 会话行 */
    .conv-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      border-radius: 16px;
      background: var(--color-card);
      border: 1px solid var(--color-border-light);
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .conv-row:hover { border-color: rgba(193, 127, 89, 0.30); transform: translateX(2px); }
    .conv-row.selected { border-color: rgba(163, 158, 152, 0.20); box-shadow: var(--shadow-sm); transform: translateX(4px); }

    .conv-avatar-frame {
      width: 56px; height: 56px; border-radius: 12px;
      background: var(--color-paper);
      border: 1px solid rgba(163, 158, 152, 0.15);
      box-shadow: var(--shadow-sm);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .conv-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: "Noto Serif SC", serif;
      font-weight: 700;
      font-size: 16px;
      border: 1px solid rgba(163, 158, 152, 0.10);
    }
    .conv-status-dot {
      position: absolute;
      bottom: -2px; right: -2px;
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid var(--color-paper);
    }
    .conv-name { font-size: 15px; color: var(--color-ink); }
    .conv-name.unread { font-weight: 700; }
    .conv-name.read { font-weight: 600; }
    .conv-time { font-size: 11px; color: var(--color-ink-light); white-space: nowrap; }
    .conv-summary { font-size: 13px; line-height: 1.5; }
    .conv-summary.unread { color: var(--color-ink); }
    .conv-summary.read { color: var(--color-ink-muted); }
    .conv-unread-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 18px; height: 18px; padding: 0 5px;
      border-radius: 9px;
      font-size: 10px; font-weight: 700; color: white;
    }

    /* 筛选按钮 */
    .msg-filter {
      padding: 6px 14px;
      font-size: 12px; font-weight: 500;
      border-radius: 9999px;
      white-space: nowrap;
      background: var(--color-card);
      color: var(--color-ink-muted);
      border: 1px solid var(--color-border-light);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .msg-filter.active {
      background: var(--color-clay);
      color: #fff;
      border-color: var(--color-clay);
    }

    /* AI 悬浮按钮 */
    #ai-fab {
      position: fixed;
      right: 16px;
      bottom: calc(var(--bottom-tab-height) + 16px);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--color-clay), var(--color-ochre));
      color: white;
      border: none;
      box-shadow: 0 4px 14px rgba(193, 127, 89, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 30;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    #ai-fab:hover { transform: scale(1.05); box-shadow: 0 6px 18px rgba(193, 127, 89, 0.45); }
    #ai-fab:active { transform: scale(0.95); }
    #ai-fab svg { width: 24px; height: 24px; }
    @media (min-width: 768px) {
      #ai-fab { bottom: 24px; }
    }

    /* 模态框 */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 60;
      background: rgba(0,0,0,0.45); opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease; display: flex; align-items: flex-end; justify-content: center;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }

    .modal-sheet {
      width: 100%; max-width: 560px; max-height: 90vh;
      background: var(--color-card); border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      transform: translateY(100%); transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; flex-direction: column; overflow: hidden;
      border: 1px solid var(--color-border-light);
    }
    .modal-overlay.open .modal-sheet { transform: translateY(0); }

    @media (min-width: 768px) {
      .modal-overlay { align-items: center; }
      .modal-sheet { border-radius: var(--radius-lg); max-height: 85vh; }
    }

    .modal-header {
      padding: 16px; border-bottom: 1px solid var(--color-border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-body { flex: 1; overflow-y: auto; padding: 16px; }
    .modal-footer { padding: 12px 16px; border-top: 1px solid var(--color-border); display: flex; gap: 8px; }

    .detail-meta-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 13px; color: var(--color-ink-muted); }
    .detail-bubble {
      background: var(--color-surface-2); padding: 14px; border-radius: var(--radius-md);
      font-size: 15px; line-height: 1.6; color: var(--color-ink); margin-bottom: 16px;
    }

    /* 长按菜单 */
    #context-menu {
      position: fixed;
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      box-shadow: 0 10px 30px rgba(45,42,38,0.12);
      z-index: 70;
      padding: 4px 0;
      min-width: 160px;
      display: none;
    }
    #context-menu.open { display: block; }
    .context-item {
      width: 100%; text-align: left;
      padding: 8px 16px; font-size: 14px;
      color: var(--color-ink); background: transparent;
      cursor: pointer; transition: background 0.15s ease;
    }
    .context-item:hover { background: var(--color-surface-2); }

    /* AI 聊天消息 */
    .ai-msg { display: flex; gap: 8px; }
    .ai-msg.user { flex-direction: row-reverse; }
    .ai-msg-bubble {
      max-width: 80%; padding: 10px 14px; border-radius: var(--radius-md);
      font-size: 14px; line-height: 1.5;
    }
    .ai-msg.user .ai-msg-bubble { background: var(--color-clay); color: white; }
    .ai-msg.assistant .ai-msg-bubble { background: var(--color-surface-2); color: var(--color-ink); }

    /* 报告/总结页 */
    .report-group {
      background: var(--color-card);
      border: 1px solid var(--color-border-light);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .report-group-title {
      font-size: 12px; font-weight: 600;
      color: var(--color-ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 10px 16px 6px;
    }
    .report-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px;
      min-height: 44px;
      border-bottom: 1px solid var(--color-border-light);
    }
    .report-row:last-child { border-bottom: none; }
    .report-row-label { font-size: 15px; color: var(--color-ink); }
    .report-row-value { font-size: 15px; color: var(--color-ink-muted); }
    .report-chart { padding: 12px 16px 16px; }
    .report-chart + .report-row { border-top: 1px solid var(--color-border-light); }
    .report-tab {
      padding: 6px 14px;
      font-size: 12px; font-weight: 500;
      border-radius: 9999px;
      white-space: nowrap;
      background: var(--color-card);
      color: var(--color-ink-muted);
      border: 1px solid var(--color-border-light);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .report-tab.active { background: var(--color-clay); color: #fff; border-color: var(--color-clay); }
    .style-selector {
      display: flex; gap: 6px; padding: 8px 16px;
    }
    .style-selector button {
      flex: 1; font-size: 12px; padding: 5px 0;
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border-light);
      background: var(--color-surface-2);
      color: var(--color-ink-muted);
      cursor: pointer;
    }
    .style-selector button.active {
      background: var(--color-clay); color: #fff; border-color: var(--color-clay);
    }
    .plan-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px; background: var(--color-card);
      border-bottom: 1px solid var(--color-border-light);
    }
    .plan-item:last-child { border-bottom: none; }
    .plan-priority {
      width: 4px; border-radius: 2px; flex-shrink: 0; align-self: stretch;
    }
    .plan-priority.high { background: var(--color-danger); }
    .plan-priority.medium { background: var(--color-warning); }
    .plan-priority.low { background: var(--color-success); }

    /* 设置页 */
    .settings-section {
      background: var(--color-card); border: 1px solid var(--color-border-light);
      border-radius: var(--radius-lg); padding: 16px; margin-bottom: 16px;
    }
    .settings-section-title {
      font-size: 15px; font-weight: 600; color: var(--color-ink); margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .settings-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0; border-bottom: 1px solid var(--color-border-light);
    }
    .settings-item:last-child { border-bottom: none; }
    .settings-label { font-size: 14px; color: var(--color-ink); }
    .settings-desc { font-size: 12px; color: var(--color-ink-muted); margin-top: 2px; }

    .tag-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px; background: var(--color-surface-2); border-radius: var(--radius-md);
      margin-bottom: 8px; cursor: grab; transition: background 0.15s ease;
    }
    .tag-item.dragging { opacity: 0.5; }
    .tag-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .tag-name { flex: 1; font-size: 14px; color: var(--color-ink); }
    .tag-type {
      font-size: 11px; color: var(--color-ink-muted); padding: 2px 6px;
      background: var(--color-card); border-radius: 9999px;
    }
    .tag-action-select {
      padding: 4px 8px; font-size: 12px; border-radius: var(--radius-sm);
      border: 1px solid var(--color-border); background: var(--color-card);
      color: var(--color-ink);
    }
    .btn-icon {
      width: 28px; height: 28px; border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: none; color: var(--color-ink-muted);
      cursor: pointer;
    }
    .btn-icon:hover { background: var(--color-surface-2); color: var(--color-danger); }

    .impact-preview {
      font-size: 12px; color: var(--color-ink-muted); margin-top: 6px;
      padding: 8px; background: var(--color-surface-2); border-radius: var(--radius-sm);
    }

    .form-input {
      width: 100%; padding: 8px 12px; font-size: 14px;
      background: var(--color-surface-2); color: var(--color-ink);
      border: 1px solid var(--color-border); border-radius: var(--radius-md);
      outline: none;
    }
    .form-input:focus { border-color: var(--color-clay); }
    .form-select {
      padding: 8px 12px; font-size: 14px;
      background: var(--color-surface-2); color: var(--color-ink);
      border: 1px solid var(--color-border); border-radius: var(--radius-md);
      outline: none;
    }
    .form-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .btn-primary {
      padding: 8px 16px; font-size: 14px; font-weight: 500;
      background: var(--color-clay); color: white; border: none;
      border-radius: var(--radius-md); cursor: pointer;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary {
      padding: 8px 16px; font-size: 14px; font-weight: 500;
      background: var(--color-surface-2); color: var(--color-ink);
      border: 1px solid var(--color-border); border-radius: var(--radius-md);
      cursor: pointer;
    }
    .btn-danger {
      padding: 8px 16px; font-size: 14px; font-weight: 500;
      background: var(--color-danger); color: white; border: none;
      border-radius: var(--radius-md); cursor: pointer;
    }

    .progress-bar {
      height: 8px; background: var(--color-surface-2); border-radius: 9999px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: var(--color-clay); border-radius: 9999px;
      transition: width 0.3s ease;
    }
    .progress-fill.warning { background: var(--color-warning); }
    .progress-fill.danger { background: var(--color-danger); }

    .qa-item {
      padding: 10px; background: var(--color-surface-2); border-radius: var(--radius-md);
      font-size: 13px;
    }
    .qa-role { font-size: 11px; font-weight: 600; color: var(--color-clay); margin-bottom: 4px; }
    .qa-content { color: var(--color-ink); line-height: 1.4; }
    .qa-meta { font-size: 11px; color: var(--color-ink-muted); margin-top: 4px; }

    .icon-btn {
      width: 36px; height: 36px; border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: none; color: var(--color-ink-muted);
      cursor: pointer; transition: all 0.2s ease;
    }
    .icon-btn:hover { background: rgba(193, 127, 89, 0.10); color: var(--color-ink); }
  </style>
</head>
<body class="bg-paper text-ink antialiased h-screen overflow-hidden">
  <div id="app" class="relative z-10 flex h-full w-full">
    <aside id="left-panel" class="flex flex-col w-full md:w-[340px] md:shrink-0 bg-paper border-r border-ink-light/10 z-10">
      <header class="h-[72px] flex items-center justify-between px-6 border-b border-ink-light/10 glass-strong shrink-0">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg overflow-hidden shadow-md">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="w-full h-full">
              <defs>
                <linearGradient id="xz-bg" x1="0" y1="0" x2="512" y2="512">
                  <stop offset="0%" stop-color="#2563EB"/>
                  <stop offset="100%" stop-color="#1E3A8A"/>
                </linearGradient>
                <linearGradient id="xz-ring-out" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#60A5FA"/>
                  <stop offset="100%" stop-color="#2563EB"/>
                </linearGradient>
                <linearGradient id="xz-ring-mid" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#93C5FD"/>
                  <stop offset="100%" stop-color="#3B82F6"/>
                </linearGradient>
                <mask id="xz-mask">
                  <rect width="512" height="512" fill="white"/>
                  <rect x="170" y="154" width="180" height="120" rx="20" fill="black" transform="rotate(-12 260 214)"/>
                  <rect x="160" y="174" width="180" height="120" rx="20" fill="black" transform="rotate(-6 250 234)"/>
                  <rect x="150" y="194" width="180" height="120" rx="20" fill="black"/>
                </mask>
              </defs>
              <rect width="512" height="512" rx="120" fill="url(#xz-bg)"/>
              <g mask="url(#xz-mask)">

  <script>
    /* ===== 轻量测试框架 ===== */
    const XINZHAN_TESTS = {
      tests: [],
      test(name, fn) { this.tests.push({ name, fn }); },
      assert(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); },
      assertEqual(actual, expected, msg) {
        if (actual !== expected) throw new Error(`${msg || ''} expected ${expected}, got ${actual}`);
      },
      async run() {
        let passed = 0, failed = 0, failures = [];
        for (const t of this.tests) {
          try { await t.fn(); passed++; }
          catch (e) { failed++; failures.push(`${t.name}: ${e.message}`); }
        }
        const result = { passed, failed, failures };
        console.log(`Xinzhan Tests: ${passed} passed, ${failed} failed`);
        if (failed) console.error(failures.join('\n'));
        return result;
      }
    };
    window.runXinzhanTests = () => XINZHAN_TESTS.run();

    /* ===== Phase 1 布局与主题状态 ===== */
    let activeTab = 'inbox';
    let selectedId = null;

    const leftPanel = document.getElementById('left-panel');
    const rightPanel = document.getElementById('right-panel');
    const leftContent = document.getElementById('left-content');
    const bottomNav = document.getElementById('bottom-nav');

    function updateLayout() {
      const isMobile = window.innerWidth < 768;
      const mobileDetail = isMobile && (selectedId || activeTab !== 'inbox');
      if (mobileDetail) {
        leftPanel.classList.add('mobile-hidden');
        rightPanel.classList.add('mobile-open');
        bottomNav.classList.add('mobile-hidden');
      } else {
        leftPanel.classList.remove('mobile-hidden');
        rightPanel.classList.remove('mobile-open');
        bottomNav.classList.remove('mobile-hidden');
      }
    }

    function updateNav() {
      document.querySelectorAll('.nav-item').forEach(btn => {
        const isActive = btn.dataset.tab === activeTab;
        btn.classList.toggle('text-clay', isActive);
        btn.classList.toggle('text-ink-light', !isActive);
      });
    }

    function renderLeftPanel() {
      if (activeTab === 'inbox') {
        renderConversationList();
      } else if (activeTab === 'summary') {
        renderSummaryLeft();
      } else {
        renderSettingsLeft();
      }
    }

    function renderRightPanel() {
      if (activeTab === 'inbox') {
        renderConversationDetail();
      } else if (activeTab === 'summary') {
        renderSummaryRight();
      } else {
        renderSettingsRight();
      }
    }

    /* ===== Phase 2 / 收件箱列表 ===== */
    function renderConversationList() {
      const convs = typeof getFilteredConversations === 'function' ? getFilteredConversations() : STATE.messages;
      const unreadTotal = convs.filter(m => !m.read).length;
      const workCount = convs.filter(m => getCategory(m.contact, m.type) === 'work').length;
      const workPct = convs.length ? Math.round((workCount / convs.length) * 100) : 0;

      const searchHtml = `
        <div class="flex items-center gap-3 px-4 py-2.5 rounded-xl glass border border-ink-light/10 text-ink-muted focus-within:border-clay/40 focus-within:ring-1 focus-within:ring-clay/20">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
          </svg>
          <input type="text" placeholder="搜索消息、联系人" class="flex-1 bg-transparent outline-none text-sm text-ink placeholder-ink-light">
        </div>
      `;

      const diagnosisHtml = `
        <div class="mx-6 mt-5 mb-5 p-5 rounded-xl bg-card border border-ink-light/10 relative overflow-hidden animate-fade-in">
          <div class="absolute top-0 left-0 right-0 accent-strip"></div>
          <div class="flex items-center gap-2 mb-2 mt-1">
            <span class="w-2 h-2 rounded-full bg-clay"></span>
            <span class="text-[10px] font-bold uppercase tracking-wider text-clay">AI 诊断</span>
          </div>
          <p class="text-sm text-ink leading-snug font-medium">
            今日有 <span class="text-clay font-bold">${unreadTotal}</span> 条未读消息，其中工作类占 <span class="text-ochre font-bold">${workPct}%</span>。
          </p>
        </div>
      `;

      const rows = convs.map((m, i) => {
        const cat = getCategory(m.contact, m.type);
        const p = palette[cat];
        const isSelected = m.id === selectedId;
        const activeClass = isSelected
          ? 'border-ink-light/20 shadow-sm translate-x-1'
          : 'border-ink-light/10 hover:border-clay/30 hover:translate-x-0.5';
        const titleWeight = !m.read ? 'font-bold' : 'font-semibold';
        const unreadBadge = !m.read
          ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold text-white ${p.solid} shrink-0">1</span>`
          : '';
        return `
          <div data-id="${m.id}" class="conv-row mx-4 mb-2.5 p-3 rounded-xl border bg-card ${activeClass} cursor-pointer transition-all duration-250 animate-slide-in" style="animation-delay:${i * 40}ms">
            <div class="flex items-center gap-3">
              <div class="w-14 h-14 rounded-xl bg-paper border border-ink-light/15 shadow-sm flex items-center justify-center shrink-0">
                <div class="relative">
                  <div class="w-11 h-11 rounded-full ${p.bg} ${p.text} flex items-center justify-center font-display font-bold text-base border border-ink-light/10">${getAvatarInitial(m.contact)}</div>
                  <span class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 rounded-full border-2 border-paper ${p.solid}"></span>
                </div>
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex items-baseline justify-between gap-2 mb-1">
                  <h3 class="${titleWeight} text-[15px] text-ink truncate">${escapeHtml(m.contact)}</h3>
                  <time class="text-[11px] text-ink-light whitespace-nowrap">${formatTime(m.timestamp)}</time>
                </div>
                <p class="text-[13px] ${!m.read ? 'text-ink' : 'text-ink-muted'} line-clamp-1 leading-relaxed">${escapeHtml(m.summary)}</p>
              </div>
              ${unreadBadge}
            </div>
          </div>
        `;
      }).join('');

      leftContent.innerHTML = `
        <div class="px-6 py-4">${searchHtml}</div>
        ${diagnosisHtml}
        <div class="px-2 pb-4">${rows}</div>
      `;

      document.querySelectorAll('.conv-row').forEach(row => {
        row.addEventListener('click', () => {
          selectedId = row.dataset.id;
          render();
        });
      });
    }

    /* ===== Phase 2 / 消息详情 ===== */
    function renderConversationDetail() {
      const m = STATE.messages.find(x => x.id === selectedId);
      if (!m) {
        rightPanel.innerHTML = `
          <div class="flex-1 flex flex-col items-center justify-center text-ink-light animate-fade-in px-6">
            <div class="w-20 h-20 rounded-2xl bg-card border border-ink-light/10 flex items-center justify-center mb-6">
              <svg class="w-9 h-9 opacity-50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="3 15 12 6 21 15"/>
              </svg>
            </div>
            <p class="font-display text-2xl font-bold text-ink mb-2">选择左侧会话</p>
            <p class="text-sm text-ink-muted">查看详情、回复或让 AI 帮你总结</p>
          </div>
        `;
        return;
      }

      const cat = getCategory(m.contact, m.type);
      const p = palette[cat];
      const contact = STATE.contacts.find(c => c.name === m.contact);
      const unreadCount = STATE.messages.filter(x => x.contact === m.contact && !x.read && !x.archived).length;
      const historyCount = STATE.messages.filter(x => x.contact === m.contact).length;
      const lastReply = '2h';

      rightPanel.innerHTML = `
        <header class="h-[72px] flex items-center justify-between px-6 border-b border-ink-light/10 glass-strong shrink-0">
          <div class="flex items-center gap-4">
            <button class="md:hidden p-2 -ml-2 rounded-lg hover:bg-ink-light/10 text-ink-muted mr-2" onclick="goBackToInbox()">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/>
              </svg>
            </button>
            <div class="relative">
              <div class="w-11 h-11 rounded-full ${p.bg} ${p.text} flex items-center justify-center font-display font-bold text-lg">${getAvatarInitial(m.contact)}</div>
              <span class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 rounded-full border-2 border-paper ${p.solid}"></span>
            </div>
            <div>
              <h2 class="font-display font-bold text-xl leading-tight">${escapeHtml(m.contact)}</h2>
              <div class="flex items-center gap-2 mt-0.5">
                <span class="text-[11px] px-2 py-0.5 rounded-md ${p.bg} ${p.text} font-medium">${p.label}</span>
                <span class="text-[11px] text-ink-light">${formatTime(m.timestamp)}</span>
              </div>
            </div>
          </div>
          <div class="flex items-center gap-1">
            <button id="detail-archive" class="p-2 rounded-lg hover:bg-ink-light/10 text-ink-muted transition-colors duration-200" aria-label="归档">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
              </svg>
            </button>
            <button id="detail-more" class="p-2 rounded-lg hover:bg-ink-light/10 text-ink-muted transition-colors duration-200" aria-label="更多">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>
              </svg>
            </button>
          </div>

    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.toggle('dark');
      const theme = isDark ? 'dark' : 'light';
      localStorage.setItem('xinzhan-theme', theme);
      if (typeof STATE !== 'undefined' && STATE.settings) {
        STATE.settings.theme = theme;
        STATE.theme = theme;
        if (typeof persist === 'function') persist();
      }
      // 兼容旧图标
      const sun = document.getElementById('theme-icon-sun');
      const moon = document.getElementById('theme-icon-moon');
      if (sun) sun.classList.toggle('hidden', isDark);
      if (moon) moon.classList.toggle('hidden', !isDark);
      // 同步设置页开关
      const settingsTheme = document.getElementById('settings-theme');
      if (settingsTheme) {
        const dot = settingsTheme.querySelector('span');
        if (isDark) {
          settingsTheme.classList.remove('bg-ink-light/30');
          settingsTheme.classList.add('bg-gradient-to-r', 'from-clay', 'to-ochre');
          dot.classList.remove('left-1');
          dot.classList.add('right-1');
        } else {
          settingsTheme.classList.remove('bg-gradient-to-r', 'from-clay', 'to-ochre');
          settingsTheme.classList.add('bg-ink-light/30');
          dot.classList.remove('right-1');
          dot.classList.add('left-1');
        }

     * Message:    { id, raw, platform, platformName, type, contact, summary, replied, timestamp, deadline, archived, read, replyDraft }
     * Contact:    { id, name, platforms[], tags[], lastContact, isStarred, isArchived }

     * BehaviorLog:{ id, contactId, appKey, action, timestamp }
     * QAEntry:    { id, role, content, timestamp, model, tokens }
     * TokenUsage: { date, inputTokens, outputTokens, cost }
     */

    /* ===== 常量 ===== */
    const STORAGE_KEYS = {
      messages: 'xinzhan_v3_messages',
      contacts: 'xinzhan_v3_contacts',
      tags: 'xinzhan_v3_tags',
      settings: 'xinzhan_v3_settings',
      behavior: 'xinzhan_v3_behavior',
      qaHistory: 'xinzhan_v3_qa_history',
      tokenUsage: 'xinzhan_v3_token_usage'
    };

    const CURRENT_SCHEMA_VERSION = 1;

    const MSG_TYPES = {
      todo: { label: '待办', defaultAction: 'must-reply' },
      help: { label: '求助', defaultAction: 'must-reply' },
      notify: { label: '通知', defaultAction: 'can-defer' },
      promo: { label: '营销', defaultAction: 'can-archive' },
      chat: { label: '闲聊', defaultAction: 'can-defer' }
    };

    const ACTION_LABELS = {
      'must-reply': '必回',
      'can-defer': '稍后',
      'can-archive': '归档'
    };

    /* ===== Phase 2 / 分类色映射 ===== */
    const palette = {
      work: { bg: 'bg-clay/15', text: 'text-clay', solid: 'bg-clay', bar: 'priority-bar-work', label: '工作' },
      life: { bg: 'bg-ochre/15', text: 'text-ochre', solid: 'bg-ochre', bar: 'priority-bar-life', label: '生活' },
      social: { bg: 'bg-caramel/15', text: 'text-caramel', solid: 'bg-caramel', bar: 'priority-bar-social', label: '社交' },
      sub: { bg: 'bg-blush/15', text: 'text-blush', solid: 'bg-blush', bar: 'priority-bar-sub', label: '订阅' },
      sys: { bg: 'bg-warm-gray/15', text: 'text-warm-gray', solid: 'bg-warm-gray', bar: 'priority-bar-sys', label: '系统' },
    };

    function getCategory(contactName, type) {
      const name = (contactName || '').toLowerCase();
      const t = type || 'chat';
      // 工作类
      if (/老板|客户|项目|会议|财务|hr/.test(name) || t === 'todo' || t === 'help') return 'work';
      // 订阅类
      if (t === 'promo') return 'sub';
      // 系统类
      if (t === 'notify') return 'sys';
      // 社交类
      if (/朋友|同学|同事/.test(name)) return 'social';
      // 生活类
      if (t === 'chat') return 'life';
      // fallback
      if (t === 'todo' || t === 'help') return 'work';
      if (t === 'notify') return 'sys';
      if (t === 'promo') return 'sub';
      return 'life';
    }

    function getAvatarInitial(name) {
      if (!name) return '?';
      const clean = name.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '');
      return clean.charAt(0) || name.charAt(0) || '?';
    }

    /* ===== 工具函数 ===== */
    function uuid() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
      });
    }

    function id(prefix) { return prefix + '_' + uuid(); }

    /* ===== Storage 模块 ===== */
    const storage = {
      save(key, data) {
        localStorage.setItem(STORAGE_KEYS[key], JSON.stringify(data));
      },
      load(key, defaultValue) {
        try {
          const raw = localStorage.getItem(STORAGE_KEYS[key]);
          return raw ? JSON.parse(raw) : defaultValue;
        } catch (e) {
          return defaultValue;
        }
      },
      clear(key) {
        localStorage.removeItem(STORAGE_KEYS[key]);
      },
      clearAll() {
        Object.values(STORAGE_KEYS).forEach(k => localStorage.removeItem(k));
      }
    };

    /* ===== Validators ===== */
    function isNonEmptyString(v) { return typeof v === 'string' && v.length > 0; }
    function isNumber(v) { return typeof v === 'number' && !isNaN(v); }
    function isBoolean(v) { return typeof v === 'boolean'; }
    function isArray(v) { return Array.isArray(v); }

    function validateMessage(m) {
      if (!m || typeof m !== 'object') return false;
      if (!isNonEmptyString(m.id)) return false;
      if (!isNonEmptyString(m.contact)) return false;
      if (!isNonEmptyString(m.platform)) return false;
      if (!MSG_TYPES[m.type]) return false;
      if (!isNumber(m.timestamp)) return false;
      return true;
    }

    function validateContact(c) {
      if (!c || typeof c !== 'object') return false;
      if (!isNonEmptyString(c.id)) return false;
      if (!isNonEmptyString(c.name)) return false;
      if (!isArray(c.tags)) return false;
      if (!isArray(c.platforms)) return false;
      return true;
    }

    function validateTag(t) {
      if (!t || typeof t !== 'object') return false;
      if (!isNonEmptyString(t.id)) return false;
      if (!isNonEmptyString(t.name)) return false;
      if (!['relationship', 'importance', 'custom'].includes(t.type)) return false;
      if (!isNonEmptyString(t.color)) return false;
      if (!['must-reply', 'can-defer', 'can-archive'].includes(t.defaultAction)) return false;
      return true;
    }

    function validateSettings(s) {
      if (!s || typeof s !== 'object') return false;
      if (!isNumber(s.schemaVersion)) return false;
      if (!['light', 'dark', 'system'].includes(s.theme)) return false;
      if (!['concise', 'detailed', 'action', 'gentle'].includes(s.summaryStyle)) return false;
      if (!s.apiConfig || typeof s.apiConfig !== 'object') return false;
      if (!s.tokenBudget || typeof s.tokenBudget !== 'object') return false;
      if (!s.typeDefaultActions || typeof s.typeDefaultActions !== 'object') return false;
      return true;
    }

    function migrateSettings(settings) {
      if (!settings) settings = {};
      const v = settings.schemaVersion || 0;
      if (v < 1) {

      }
      return settings;
    }

    /* ===== 初始化 ===== */
    function initState() {
      let settings = storage.load('settings', null);
      settings = migrateSettings(settings);
      if (!validateSettings(settings)) {
        settings = getDefaultSettings();
      }

      let tags = storage.load('tags', null);
      if (!isArray(tags) || tags.length === 0 || !tags.every(validateTag)) {
        tags = getPresetTags();
        storage.save('tags', tags);
      }

      let messages = storage.load('messages', null);
      let contacts = storage.load('contacts', null);

      if (!isArray(messages) || messages.length === 0 || !messages.every(validateMessage)) {
        messages = getSampleMessages();
        storage.save('messages', messages);
      }

      if (!isArray(contacts) || contacts.length === 0 || !contacts.every(validateContact)) {
        contacts = getSampleContacts(tags);
        // 根据消息更新联系人平台和最后联系时间
        messages.forEach(m => {
          const c = contacts.find(c => c.name === m.contact);
          if (c) {
            if (!c.platforms.includes(m.platform)) c.platforms.push(m.platform);
            if (m.timestamp > c.lastContact) c.lastContact = m.timestamp;
          }
        });
        storage.save('contacts', contacts);
      }

      storage.save('settings', settings);

      return {
        messages,
        contacts,
        tags,
        settings,
        behaviorLogs: storage.load('behavior', []),
        qaHistory: storage.load('qaHistory', []),
        tokenUsage: storage.load('tokenUsage', [])
      };
    }

    /* ===== Phase 2 / 解析引擎 ===== */
    const TYPE_KEYWORDS = {
      todo: ['今晚', '明天', '后天', '大后天', '截止', '之前', '尽快', '点前', '发我', '交', '完成', '截止', 'deadline', 'due'],
      help: ['帮我', '能不能', '可以帮我', '求', '麻烦', '请问', '请教', '看下', '看看', '帮忙', '咨询'],
      notify: ['发货', '送达', '账单', '签收', '通知', '提醒', '已登录', '已注册', '已到达', '已出账', '已更新', '已发布'],
      promo: ['优惠', '折扣', '砍价', '促销', '中奖', '红包', '领券', '秒杀', '限时', '免单', '免费送', '立减', '满减'],
      chat: []
    };

    function extractContact(raw) {
      if (!raw || typeof raw !== 'string') return '未知';
      // 匹配 "联系人：内容" 或 "来自 联系人 的内容"
      const colonMatch = raw.match(/^([^：:\s]+)[：:]/);
      if (colonMatch) return colonMatch[1].trim();
      const fromMatch = raw.match(/来自\s+(\S+)/);
      if (fromMatch) return fromMatch[1].trim();
      return raw.split(/\s/)[0].trim() || '未知';
    }

    function classifyMessage(raw) {
      if (!raw || typeof raw !== 'string') return 'chat';
      const text = raw.toLowerCase();
      for (const [type, keywords] of Object.entries(TYPE_KEYWORDS)) {
        if (type === 'chat') continue;
        if (keywords.some(k => text.includes(k))) return type;
      }
      return 'chat';
    }

    function extractDeadline(raw) {
      if (!raw || typeof raw !== 'string') return null;
      const now = new Date();
      const text = raw;

      // 今晚/明天/后天/大后天
      if (/今晚/.test(text)) {
        const d = new Date(now); d.setHours(23, 59, 0, 0);
        return d.getTime();
      }
      if (/明天/.test(text)) {
        const d = new Date(now); d.setDate(d.getDate() + 1); d.setHours(18, 0, 0, 0);
        return d.getTime();
      }
      if (/后天/.test(text)) {
        const d = new Date(now); d.setDate(d.getDate() + 2); d.setHours(18, 0, 0, 0);
        return d.getTime();
      }
      if (/大后天/.test(text)) {
        const d = new Date(now); d.setDate(d.getDate() + 3); d.setHours(18, 0, 0, 0);
        return d.getTime();
      }

      // 数字点前，例如 9点前 / 下午3点前
      const hourMatch = text.match(/(?:晚上|下午|上午)?(\d{1,2})\s*点/);
      if (hourMatch) {
        let hour = parseInt(hourMatch[1], 10);
        if (/下午|晚上/.test(text) && hour < 12) hour += 12;
        const d = new Date(now);
        d.setHours(hour, 0, 0, 0);
        if (d.getTime() < now.getTime()) d.setDate(d.getDate() + 1);
        return d.getTime();
      }

      return null;
    }

    function ensureContact(message) {
      let contact = STATE.contacts.find(c => c.name === message.contact);
      if (!contact) {
        const tagMap = {};
        STATE.tags.forEach(t => tagMap[t.name] = t.id);
        contact = {
          id: id('contact'),
          name: message.contact,
          platforms: [message.platform],
          tags: [],
          lastContact: message.timestamp,
          isStarred: false,
          isArchived: false
        };
        STATE.contacts.push(contact);
      } else {
        if (!contact.platforms.includes(message.platform)) contact.platforms.push(message.platform);
        if (message.timestamp > contact.lastContact) contact.lastContact = message.timestamp;
      }
      return contact;
    }

    function parseMessage(raw, platform, platformName) {
      const contact = extractContact(raw);
      const type = classifyMessage(raw);
      const deadline = extractDeadline(raw);
      const summary = raw.replace(/^[^：:]+[：:]\s*/, '').trim() || raw;
      return {
        id: id('msg'),
        raw,
        platform,
        platformName: platformName || platform,
        type,
        contact,
        summary,
        replied: false,
        timestamp: Date.now(),
        deadline,
        archived: false,
        read: false,
        replyDraft: ''
      };
    }

    /* ===== 全局状态 ===== */
    const STATE = {
      currentView: 'messages',
      drawerOpen: false,
      theme: 'light',
      dailySummary: '',
      ...initState()
    };

    /* ===== Phase 3 / 标签与动作 ===== */
    function persist() {
      storage.save('messages', STATE.messages);
      storage.save('contacts', STATE.contacts);
      storage.save('tags', STATE.tags);
      storage.save('settings', STATE.settings);
    }

    function createTag(name, type, color, defaultAction) {
      if (!name || !type || !color || !defaultAction) return null;
      const tag = {
        id: id('tag'),
        name: name.trim(),
        type,
        color,
        defaultAction,
        isPreset: false
      };
      if (!validateTag(tag)) return null;
      if (STATE.tags.some(t => t.name === tag.name)) return null;
      STATE.tags.push(tag);
      persist();
      return tag;
    }

    function updateTag(tagId, updates) {
      const idx = STATE.tags.findIndex(t => t.id === tagId);
      if (idx === -1) return null;
      const updated = { ...STATE.tags[idx], ...updates };
      if (!validateTag(updated)) return null;
      STATE.tags[idx] = updated;
      persist();
      return updated;
    }

    function deleteTag(tagId) {
      const idx = STATE.tags.findIndex(t => t.id === tagId);
      if (idx === -1) return false;
      STATE.tags.splice(idx, 1);
      STATE.contacts.forEach(c => {
        c.tags = c.tags.filter(tid => tid !== tagId);
      });
      persist();
      return true;
    }

    function addTagToContact(contactId, tagId) {
      const contact = STATE.contacts.find(c => c.id === contactId);
      const tag = STATE.tags.find(t => t.id === tagId);
      if (!contact || !tag) return false;
      if (!contact.tags.includes(tagId)) {
        contact.tags.push(tagId);
        persist();
      }
      return true;
    }

    function removeTagFromContact(contactId, tagId) {
      const contact = STATE.contacts.find(c => c.id === contactId);
      if (!contact) return false;
      const before = contact.tags.length;
      contact.tags = contact.tags.filter(tid => tid !== tagId);
      if (contact.tags.length !== before) persist();
      return true;
    }

    function getContactTags(contact) {
      if (!contact || !isArray(contact.tags)) return [];
      return contact.tags
        .map(tid => STATE.tags.find(t => t.id === tid))
        .filter(Boolean)
        .sort((a, b) => {
          // 重要性类标签优先，关系类其次，自定义最后
          const order = { importance: 0, relationship: 1, custom: 2 };
          return (order[a.type] || 2) - (order[b.type] || 2);
        });
    }

    function computeImportance(contact) {
      // 重要性评分 1-10
      if (!contact) return 5;
      let score = 5;
      const tags = getContactTags(contact);
      tags.forEach(tag => {
        if (tag.type === 'importance') {
          if (tag.name === '必回') score += 3;
          else if (tag.name === '重要') score += 2;
          else if (tag.name === '一般') score += 0;
          else if (tag.name === '忽略') score -= 2;
        }
        if (tag.type === 'relationship') {
          if (['家人', '领导', '客户', '合作伙伴'].includes(tag.name)) score += 1;
        }
      });
      if (contact.isStarred) score += 1;
      if (contact.isArchived) score -= 2;
      return Math.max(1, Math.min(10, score));
    }

    function resolveAction(contact, messageType) {
      // 优先级：联系人标签的 defaultAction > 消息类型默认动作
      const tags = getContactTags(contact);
      if (tags.length > 0) {
        return tags[0].defaultAction;
      }
      return STATE.settings.typeDefaultActions[messageType] || MSG_TYPES[messageType]?.defaultAction || 'can-defer';
    }

    function previewTagImpact(tagId, action) {
      // 返回：如果给所有无标签联系人/特定联系人打这个标签，会影响多少条消息
      let affectedContacts = 0;
      let affectedMessages = 0;
      STATE.contacts.forEach(c => {
        if (!c.tags.includes(tagId)) {
          affectedContacts++;
          affectedMessages += STATE.messages.filter(m => m.contact === c.name && !m.archived).length;
        }
      });
      return { affectedContacts, affectedMessages, action };
    }

    function previewTypeActionImpact(type, action) {
      const count = STATE.messages.filter(m => m.type === type && !m.archived).length;
      return { affectedMessages: count, type, action };
    }

    /* ===== Phase 4a / 消息 Tab 只读层 ===== */
    STATE.messageFilter = 'all';
    STATE.messageSearch = '';
    STATE.selectedMessageId = null;

    function formatTime(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      const now = new Date();
      const isToday = d.toDateString() === now.toDateString();
      const pad = n => String(n).padStart(2, '0');
      if (isToday) return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
      const yesterday = new Date(now); yesterday.setDate(yesterday.getDate() - 1);
      if (d.toDateString() === yesterday.toDateString()) return '昨天';
      return `${d.getMonth() + 1}/${d.getDate()}`;
    }

    function formatFullTime(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    function getInitials(name) {
      if (!name) return '?';
      const chars = name.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '').slice(0, 2);
      if (!chars) return name.charAt(0) || '?';
      return chars;
    }

    function getAvatarColor(name) {
      const colors = ['#2563EB', '#7C3AED', '#DB2777', '#DC2626', '#EA580C', '#D97706', '#059669', '#0891B2'];
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return colors[Math.abs(hash) % colors.length];
    }

    function getUnreadCountByContact(name) {
      return STATE.messages.filter(m => m.contact === name && !m.read && !m.archived).length;
    }

    function compareConversations(a, b) {
      const ca = getContactByName(a.contact);
      const cb = getContactByName(b.contact);
      const starA = ca?.isStarred ? 1 : 0;
      const starB = cb?.isStarred ? 1 : 0;
      if (starA !== starB) return starB - starA;
      const impA = computeImportance(ca);
      const impB = computeImportance(cb);
      if (impA !== impB) return impB - impA;
      const unreadA = getUnreadCountByContact(a.contact);
      const unreadB = getUnreadCountByContact(b.contact);
      if (unreadA !== unreadB) return unreadB - unreadA;
      return b.timestamp - a.timestamp;
    }

    function getConversations() {
      // 按联系人聚合，取每个联系人最近一条消息；排序：置顶 > 重要性 > 未读 > 时间
      const map = new Map();
      STATE.messages.forEach(m => {
        if (!map.has(m.contact) || m.timestamp > map.get(m.contact).timestamp) {
          map.set(m.contact, m);
        }
      });
      return Array.from(map.values()).sort(compareConversations);
    }

    function getFilteredConversations() {
      let convs = getConversations();
      const search = STATE.messageSearch.trim().toLowerCase();
      const filter = STATE.messageFilter;

      if (search) {
        convs = convs.filter(m =>
          m.contact.toLowerCase().includes(search) ||
          m.summary.toLowerCase().includes(search) ||
          m.raw.toLowerCase().includes(search)
        );
      }

      if (filter === 'unread') {
        convs = convs.filter(m => !m.read);
      } else if (filter === 'archived') {
        convs = convs.filter(m => m.archived);
      } else if (filter === 'must-reply') {
        convs = convs.filter(m => resolveAction(STATE.contacts.find(c => c.name === m.contact), m.type) === 'must-reply');
      } else if (filter === 'deadline') {
        convs = convs.filter(m => m.deadline !== null);
      } else if (filter.startsWith('tag:')) {
        const tagName = filter.slice(4);
        convs = convs.filter(m => {
          const contact = STATE.contacts.find(c => c.name === m.contact);
          return contact && getContactTags(contact).some(t => t.name === tagName);
        });
      } else if (filter.startsWith('app:')) {
        const platform = filter.slice(4);
        convs = convs.filter(m => m.platform === platform);
      }

      return convs;
    }

    function renderConversationCard(m) {
      const contact = STATE.contacts.find(c => c.name === m.contact);
      const unreadCount = STATE.messages.filter(x => x.contact === m.contact && !x.read && !x.archived).length;

      return `
        <div class="msg-card" data-msg-id="${m.id}">
          <div class="msg-avatar" style="background:${getAvatarColor(m.contact)}">${getInitials(m.contact)}</div>
          <div class="msg-content">
            <div class="msg-header">
              <span class="msg-name">${escapeHtml(m.contact)}${contact?.isStarred ? ' <svg class="inline w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor" style="color:var(--color-warning)"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>' : ''}</span>
              <span class="msg-time">${formatTime(m.timestamp)}</span>
            </div>
            <p class="msg-summary">${escapeHtml(m.summary)}</p>
            <div class="msg-meta">
              ${unreadCount > 0 ? `<span class="msg-unread-dot">${unreadCount}</span>` : ''}
            </div>
          </div>
        </div>
      `;
    }

    function openMessageDetail(msgId) {
      const m = STATE.messages.find(x => x.id === msgId);

      document.getElementById('msg-detail-avatar').textContent = getInitials(m.contact);
      document.getElementById('msg-detail-avatar').style.background = getAvatarColor(m.contact);
      document.getElementById('msg-detail-title').textContent = m.contact;
      document.getElementById('msg-detail-subtitle').textContent = `${m.platformName || m.platform} · ${formatFullTime(m.timestamp)}`;

      document.getElementById('msg-detail-body').innerHTML = `
        <div class="detail-meta-row">
          <span class="msg-type">${escapeHtml(MSG_TYPES[m.type]?.label || m.type)}</span>
          <span class="msg-action ${action}">${escapeHtml(ACTION_LABELS[action] || action)}</span>
          ${tags.map(t => `<span class="msg-tag" style="color:${t.color};background:${t.color}15">${escapeHtml(t.name)}</span>`).join('')}
        </div>
        ${m.deadline ? `<div class="detail-meta-row" style="color:var(--color-danger)">Deadline: ${formatFullTime(m.deadline)}</div>` : ''}
        <div class="detail-bubble">${escapeHtml(m.raw)}</div>
        <div class="text-sm text-[var(--color-text-muted)]">摘要：${escapeHtml(m.summary)}</div>
      `;

      const draftPreview = document.getElementById('msg-detail-draft-preview');
      if (m.replyDraft) {
        draftPreview.textContent = '草稿：' + m.replyDraft;
        draftPreview.classList.remove('hidden');
      } else {
        draftPreview.classList.add('hidden');
      }

      markMessageRead(msgId);

      const modal = document.getElementById('msg-detail-modal');
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
    }

    function closeMessageDetail() {
      const modal = document.getElementById('msg-detail-modal');
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
      STATE.selectedMessageId = null;
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /* ===== Phase 4b / 消息 Tab 交互层 ===== */

    function simulateAIReply(message) {
      // 基于联系人标签组合 + 消息类型生成回复建议
      const contactName = message.contact;
      const contact = getContactByName(contactName);
      const tags = contact ? getContactTags(contact).map(t => t.name) : [];
      let isFamily = tags.includes('家人') || tags.includes('女朋友');
      let isLeader = tags.includes('领导');
      let isCustomer = tags.includes('客户');
      let isColleague = tags.includes('同事');

      // 降级：当联系人没有任何关系标签时，按常见称呼推断语气
      if (!isFamily && !isLeader && !isCustomer && !isColleague) {
        const name = contactName;
        if (['妈妈', '爸爸', '妈', '爸', '女朋友', '老婆', '老公', '家人'].some(k => name.includes(k))) isFamily = true;
        else if (['老板', '领导'].some(k => name.includes(k))) isLeader = true;
        else if (['客户'].some(k => name.includes(k))) isCustomer = true;
        else if (['同事'].some(k => name.includes(k))) isColleague = true;
      }

      if (isFamily) {
        if (message.type === 'todo') return `好的${contactName}，我记住了，放心～`;
        if (message.type === 'help') return `没问题${contactName}，我来看看怎么弄。`;
        if (message.type === 'notify') return `收到啦${contactName}。`;
        return `好的${contactName}。`;
      }
      if (isLeader) {
        if (message.type === 'todo') return `收到，${contactName}，我今晚 9 点前处理完。`;
        if (message.type === 'help') return `好的${contactName}，我尽快查看并反馈。`;
        if (message.type === 'notify') return `收到，谢谢${contactName}。`;
        return `好的${contactName}。`;
      }
      if (isCustomer) {
        if (message.type === 'todo') return `收到，${contactName}，我确认后今天内回复您。`;
        if (message.type === 'help') return `好的${contactName}，我来协助处理。`;
        if (message.type === 'notify') return `收到，感谢您的通知。`;
        return `好的${contactName}。`;
      }
      if (isColleague) {

        if (message.type === 'notify') return `收到。`;
        return `好的${contactName}。`;
      }
      if (message.type === 'todo') return `好的${contactName}，我会按时处理。`;
      if (message.type === 'help') return `没问题${contactName}，我来看一下。`;

    function generateAIResponse(question, context) {
      // 模拟 AI 问答；context 为 null 时表示全局问答
      const q = question.toLowerCase();
      if (!context) {
        if (q.includes('总结') || q.includes('概括')) {
          const data = generateReportData('daily');
          return generateAIInsight(data);
        }
        return '你可以问我「今天有什么消息总结」或「怎么回复某人」。';
      }
      if (q.includes('总结') || q.includes('概括')) return `这条消息来自${context.contact}，内容是「${context.summary}」，属于${MSG_TYPES[context.type]?.label || context.type}类型。`;
      if (q.includes('怎么回') || q.includes('回复')) return `建议回复：${simulateAIReply(context)}`;
      if (q.includes('重要')) return context.type === 'todo' || context.type === 'help' ? '这条消息比较重要，建议优先处理。' : '这条消息可以稍后处理。';

    }

    function logBehavior(action, data = {}) {
      const log = {
        id: id('log'),
        messageId: data.messageId || null,
        contactId: data.contactId || null,
        appKey: data.appKey || null,
        action,
        timestamp: Date.now(),
        duration: data.duration || 0
      };

      storage.save('behavior', STATE.behaviorLogs);
      return log;

    function getPeriodRange(period) {
      const now = new Date();
      const start = new Date(now);
      start.setHours(0, 0, 0, 0);
      const end = new Date(now);
      end.setHours(23, 59, 59, 999);

      if (period === 'weekly') {
        const day = start.getDay();
        const diff = start.getDate() - day + (day === 0 ? -6 : 1);
        start.setDate(diff);
      } else if (period === 'monthly') {
        start.setDate(1);
      }
      return { start: start.getTime(), end: end.getTime() };
    }

    function generateReportData(period) {
      const range = getPeriodRange(period);
      const messages = STATE.messages.filter(m => m.timestamp >= range.start && m.timestamp <= range.end);
      const logs = STATE.behaviorLogs.filter(l => l.timestamp >= range.start && l.timestamp <= range.end);

      const total = messages.length;
      const unread = messages.filter(m => !m.read).length;
      const archived = messages.filter(m => m.archived).length;
      const replied = messages.filter(m => m.replied).length;

      const byType = {};
      STATE.settings.typeDefaultActions && Object.keys(STATE.settings.typeDefaultActions).forEach(t => byType[t] = 0);
      messages.forEach(m => { byType[m.type] = (byType[m.type] || 0) + 1; });

      const byAction = { 'must-reply': 0, 'can-defer': 0, 'can-archive': 0 };
      messages.forEach(m => {
        const contact = getContactByName(m.contact);
        const action = resolveAction(contact, m.type);
        byAction[action] = (byAction[action] || 0) + 1;
      });

      const topContacts = {};
      messages.forEach(m => { topContacts[m.contact] = (topContacts[m.contact] || 0) + 1; });
      const topContactList = Object.entries(topContacts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 3)
        .map(([name, count]) => ({ name, count }));

      return { period, range, total, unread, archived, replied, byType, byAction, topContacts: topContactList, logs };
    }

    function renderDonutChart(data, colors) {
      const entries = Object.entries(data).filter(([, v]) => v > 0);
      if (entries.length === 0) return '<div class="text-sm text-[var(--color-text-muted)]">暂无数据</div>';
      const total = entries.reduce((sum, [, v]) => sum + v, 0);
      let accumulated = 0;
      const radius = 36;
      const circumference = 2 * Math.PI * radius;
      let svg = `<svg viewBox="0 0 100 100" class="w-32 h-32 mx-auto"><circle cx="50" cy="50" r="${radius}" fill="none" stroke="var(--color-border)" stroke-width="12"/>`;
      entries.forEach(([label, value], i) => {
        const dash = (value / total) * circumference;
        const offset = circumference - accumulated;
        svg += `<circle cx="50" cy="50" r="${radius}" fill="none" stroke="${colors[i % colors.length]}" stroke-width="12" stroke-dasharray="${dash} ${circumference - dash}" stroke-dashoffset="${offset}" transform="rotate(-90 50 50)"/>`;
        accumulated += dash;
      });
      svg += `<text x="50" y="54" text-anchor="middle" font-size="16" font-weight="700" fill="var(--color-text)">${total}</text></svg>`;
      svg += '<div class="flex flex-wrap justify-center gap-3 mt-3">' +
        entries.map(([label, value], i) => `<div class="flex items-center gap-1 text-xs text-[var(--color-text-muted)]"><span class="w-2 h-2 rounded-full" style="background:${colors[i % colors.length]}"></span>${escapeHtml(MSG_TYPES[label]?.label || label)} ${value}</div>`).join('') +
        '</div>';
      return svg;
    }

    function renderBarChart(data, colors) {
      const entries = Object.entries(data).filter(([, v]) => v > 0);
      if (entries.length === 0) return '<div class="text-sm text-[var(--color-text-muted)]">暂无数据</div>';
      const max = Math.max(...entries.map(([, v]) => v));
      return '<div class="space-y-2">' +
        entries.map(([label, value], i) => `
          <div class="flex items-center gap-3">
            <span class="w-12 text-xs text-[var(--color-text-muted)] text-right">${escapeHtml(ACTION_LABELS[label] || label)}</span>
            <div class="flex-1 h-2 bg-[var(--color-surface-2)] rounded-full overflow-hidden">
              <div class="h-full rounded-full" style="width:${(value / max) * 100}%;background:${colors[i % colors.length]}"></div>
            </div>
            <span class="w-6 text-xs text-[var(--color-text)] text-right">${value}</span>
          </div>
        `).join('') +
        '</div>';
    }

    function generateAIInsight(data, style = STATE.settings.summaryStyle || 'concise') {
      if (data.total === 0) return '这个周期还没有消息，保持轻松。';
      const mustReply = data.byAction['must-reply'] || 0;
      const topNames = data.topContacts.map(c => c.name).join('、');

      if (style === 'concise') {
        const lines = [`这个周期共有 ${data.total} 条消息。`];
        if (mustReply > 0) lines.push(`${mustReply} 条需优先回复。`);
        return lines.join(' ');
      }
      if (style === 'detailed') {
        const lines = [`这个周期共有 ${data.total} 条消息。`];
        if (data.unread > 0) lines.push(`其中 ${data.unread} 条未读，建议先处理，避免遗漏。`);
        if (mustReply > 0) lines.push(`需要回复的消息有 ${mustReply} 条，可优先安排。`);
        if (data.archived > 0) lines.push(`已归档 ${data.archived} 条。`);
        if (topNames) lines.push(`联系最频繁的是 ${topNames}。`);
        return lines.join(' ');
      }
      if (style === 'action') {
        const lines = [`这个周期共有 ${data.total} 条消息。`];
        if (mustReply > 0) lines.push(`建议先处理 ${mustReply} 条必回消息。`);
        if (data.unread > 0) lines.push(`接下来 30 分钟内清空 ${data.unread} 条未读。`);
        if (topNames) lines.push(`优先联系 ${topNames}。`);
        return lines.join(' ');
      }
      if (style === 'gentle') {
        const lines = [`这个周期收到了 ${data.total} 条消息。`];
        if (data.unread > 0) lines.push(`还有 ${data.unread} 条未读，慢慢来，一件一件处理就好。`);
        if (mustReply > 0) lines.push(`其中 ${mustReply} 条需要回复，不用着急。`);
        if (topNames) lines.push(`${topNames} 联系得比较频繁。`);
        return lines.join(' ');
      }
      return generateAIInsight(data, 'concise');
    }

    function generatePlan() {
      const now = Date.now();
      const candidates = STATE.messages
        .filter(m => !m.archived && !m.replied)
        .map(m => {
          const contact = getContactByName(m.contact);
          const action = resolveAction(contact, m.type);
          const importance = computeImportance(contact);
          return { m, contact, action, importance };
        })
        .sort((a, b) => {
          if (a.action === 'must-reply' && b.action !== 'must-reply') return -1;
          if (a.action !== 'must-reply' && b.action === 'must-reply') return 1;
          if ((a.m.deadline || Infinity) !== (b.m.deadline || Infinity)) return (a.m.deadline || Infinity) - (b.m.deadline || Infinity);
          return b.importance - a.importance;
        });

      return candidates.map(({ m, action, importance }) => ({
        messageId: m.id,
        contact: m.contact,
        summary: m.summary,
        action,
        priority: importance >= 8 ? 'high' : importance >= 5 ? 'medium' : 'low',
        reason: action === 'must-reply' ? '需要回复' : m.deadline && m.deadline < now + 86400000 ? '即将到期' : '建议处理'
      }));
    }
