<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>核心词汇分类配对教学游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .score-board {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
        }

        .score-item {
            background: rgba(255,255,255,0.2);
            padding: 15px 30px;
            border-radius: 15px;
            color: white;
            font-size: 1.2rem;
            backdrop-filter: blur(10px);
        }

        .game-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .word-section {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .section-title {
            text-align: center;
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .words-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .word-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 10px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            word-wrap: break-word;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .word-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .word-card.selected {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(245,87,108,0.4);
        }

        .word-card.matched {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chinese-card {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .chinese-card.selected {
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
        }

        .chinese-card.matched {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .feedback {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px 50px;
            border-radius: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            z-index: 1000;
            display: none;
            animation: popIn 0.3s ease;
        }

        .feedback.correct {
            color: #4caf50;
        }

        .feedback.wrong {
            color: #f44336;
        }

        @keyframes popIn {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 0;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        .btn-restart {
            display: block;
            margin: 0 auto;
            padding: 15px 40px;
            font-size: 1.2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .btn-restart:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 999;
        }

        .result-page {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            z-index: 1001;
            display: none;
            max-width: 90%;
        }

        .result-page h2 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 20px;
        }

        .result-score {
            font-size: 3rem;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .game-area {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .score-board {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 核心词汇配对游戏</h1>
            <div class="score-board">
                <div class="score-item">得分: <span id="score">0</span></div>
                <div class="score-item">完成: <span id="completed">0</span>/12</div>
            </div>
        </div>

        <div class="game-area">
            <div class="word-section">
                <div class="section-title">📚 英文词汇</div>
                <div class="words-container" id="english-words"></div>
            </div>
            <div class="word-section">
                <div class="section-title">📖 中文释义</div>
                <div class="words-container" id="chinese-words"></div>
            </div>
        </div>

        <button class="btn-restart" onclick="initGame()">🔄 重新开始</button>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="feedback" id="feedback"></div>

    <div class="result-page" id="result-page">
        <h2>🎉 恭喜完成！</h2>
        <div class="result-score">得分: <span id="final-score">0</span></div>
        <button class="btn-restart" onclick="showGame()">再玩一次</button>
    </div>

    <script>
        const wordData = [
            { en: 'responsible', zh: '有责任心的；负责的' },
            { en: 'safety', zh: '安全' },
            { en: 'quality', zh: '品质；质量' },
            { en: 'solve problems', zh: '解决问题' },
            { en: 'core skills', zh: '核心技能' },
            { en: 'traditional welding', zh: '传统焊接' },
            { en: 'smart welding', zh: '智能焊接' },
            { en: 'program robots', zh: '操控机器人；编写机器人程序' },
            { en: 'be good with technology', zh: '擅长运用技术' },
            { en: 'digital tools', zh: '数字化工具' },
            { en: 'never stop learning', zh: '持续学习；学无止境' },
            { en: 'career', zh: '职业；职业生涯' }
        ];

        let englishWords = [];
        let chineseWords = [];
        let score = 0;
        let completedCount = 0;
        let selectedIndex = -1;
        let selectedWord = '';

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function initGame() {
            englishWords = shuffleArray(wordData).map(item => ({ ...item, matched: false }));
            chineseWords = shuffleArray(wordData).map(item => ({ ...item, matched: false }));
            score = 0;
            completedCount = 0;
            selectedIndex = -1;
            selectedWord = '';

            updateScore();
            renderWords();
            document.getElementById('result-page').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }

        function renderWords() {
            const englishContainer = document.getElementById('english-words');
            const chineseContainer = document.getElementById('chinese-words');

            englishContainer.innerHTML = englishWords.map((word, index) => 
                `<div class="word-card ${word.matched ? 'matched' : ''} ${selectedIndex === index ? 'selected' : ''}" 
                     onclick="selectEnglish(${index})" 
                     data-en="${word.en}">
                    ${word.en}
                </div>`
            ).join('');

            chineseContainer.innerHTML = chineseWords.map((word, index) => 
                `<div class="word-card chinese-card ${word.matched ? 'matched' : ''}" 
                     onclick="selectChinese(${index})" 
                     data-en="${word.en}">
                    ${word.zh}
                </div>`
            ).join('');
        }

        function selectEnglish(index) {
            if (englishWords[index].matched) return;
            
            selectedIndex = index;
            selectedWord = englishWords[index].en;
            renderWords();
        }

        function selectChinese(index) {
            if (chineseWords[index].matched) return;
            
            if (selectedIndex === -1 || !selectedWord) {
                showFeedback('请先选择英文词汇', 'wrong');
                return;
            }

            if (chineseWords[index].en === selectedWord) {
                handleCorrect(index);
            } else {
                handleWrong();
            }
        }

        function handleCorrect(zhIndex) {
            showFeedback('太棒了！', 'correct');
            
            englishWords[selectedIndex].matched = true;
            chineseWords[zhIndex].matched = true;
            
            score += 10;
            completedCount++;
            selectedIndex = -1;
            selectedWord = '';

            updateScore();
            renderWords();

            if (completedCount === wordData.length) {
                setTimeout(showResult, 1000);
            }
        }

        function handleWrong() {
            showFeedback('再想想哦～', 'wrong');
            score = Math.max(0, score - 5);
            updateScore();
        }

        function showFeedback(text, type) {
            const feedback = document.getElementById('feedback');
            const overlay = document.getElementById('overlay');
            
            feedback.textContent = text;
            feedback.className = 'feedback ' + type;
            feedback.style.display = 'block';
            overlay.style.display = 'block';

            setTimeout(() => {
                feedback.style.display = 'none';
                overlay.style.display = 'none';
            }, 1000);
        }

        function updateScore() {
            document.getElementById('score').textContent = score;
            document.getElementById('completed').textContent = completedCount;
        }

        function showResult() {
            document.getElementById('final-score').textContent = score;
            document.getElementById('result-page').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function showGame() {
            initGame();
        }

        // 初始化游戏
        initGame();
    </script>
</body>
</html>
