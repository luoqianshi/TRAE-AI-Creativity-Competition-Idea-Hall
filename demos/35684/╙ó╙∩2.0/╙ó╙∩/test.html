<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            background: white;
            color: #667eea;
        }
        button:hover {
            transform: scale(1.1);
        }
        #output {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>🔧 测试页面</h1>
    <button onclick="testClick()">点击测试按钮</button>
    <button onclick="testAPI()">测试API</button>
    <button onclick="showPage('page1')">页面1</button>
    <button onclick="showPage('page2')">页面2</button>
    
    <div id="page1" class="page" style="display:block;">
        <h2>页面1内容</h2>
    </div>
    <div id="page2" class="page" style="display:none;">
        <h2>页面2内容</h2>
    </div>
    
    <div id="output"></div>

    <script>
        function testClick() {
            document.getElementById('output').innerHTML = '✓ 点击成功！时间: ' + new Date().toLocaleTimeString();
        }
        
        async function testAPI() {
            try {
                const response = await fetch('/api/check-admin');
                const data = await response.json();
                document.getElementById('output').innerHTML = '✓ API响应成功: ' + JSON.stringify(data);
            } catch (error) {
                document.getElementById('output').innerHTML = '✗ API失败: ' + error.message;
            }
        }
        
        function showPage(page) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById(page).style.display = 'block';
            document.getElementById('output').innerHTML = '✓ 切换到: ' + page;
        }
    </script>
</body>
</html>
