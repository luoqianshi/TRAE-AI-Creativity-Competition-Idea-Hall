<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>词汇配对游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.95);
            padding: 15px 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .time-display {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(102, 126, 234, 0.1);
            padding: 8px 15px;
            border-radius: 20px;
            color: #667eea;
            font-weight: 500;
        }

        .time-icon {
            font-size: 18px;
        }

        .time-text {
            font-size: 16px;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }

        .nav-btn {
            padding: 10px 25px;
            background: #f0f0f0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }

        .nav-btn:hover, .nav-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .username-input {
            padding: 8px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            width: 150px;
        }

        .admin-badge {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
        }

        /* 页面 */
        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* 关卡选择 */
        .levels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .level-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .level-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.2);
        }

        .level-card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .level-card p {
            color: #666;
            margin-bottom: 15px;
        }

        .level-stats {
            display: flex;
            justify-content: space-between;
            color: #888;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .level-actions {
            display: flex;
            gap: 10px;
        }

        .level-btn {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .level-btn.play-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .level-btn.rank-btn {
            background: #f0f0f0;
            color: #666;
        }

        .level-btn:hover {
            transform: scale(1.02);
        }

        /* 晃动动画 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        /* 游戏页面 */
        .game-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .timer {
            font-size: 2em;
            color: #f5576c;
            font-weight: bold;
        }

        .score {
            font-size: 2em;
            color: #667eea;
            font-weight: bold;
        }

        .game-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            max-height: 500px;
            overflow-y: auto;
        }

        .word-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .column-header {
            background: rgba(102, 126, 234, 0.1);
            padding: 12px 20px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .word-card {
            padding: 15px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-size: 16px;
        }

        .word-card:hover {
            transform: scale(1.05);
        }

        .word-card.selected {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            transform: scale(1.05);
        }

        .word-card.matched {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            text-align: center;
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: bold;
        }

        /* 排行榜 */
        .leaderboard-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .leaderboard-tabs {
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px 20px;
            background: #f0f0f0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
        }

        .leaderboard-table th, .leaderboard-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .leaderboard-table th {
            background: #f8f9fa;
            color: #667eea;
            font-weight: bold;
        }

        .rank-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 50%;
            font-weight: bold;
            color: white;
        }

        .delete-btn {
            padding: 6px 12px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            background: #c82333;
            transform: scale(1.05);
        }

        .rank-1 { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .rank-2 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .rank-3 { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }

        /* 我的页面 */
        .my-page {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .info-item {
            margin-bottom: 15px;
            font-size: 16px;
        }

        /* 弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #667eea;
        }

        .modal-content button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
        }

        .update-notice {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            color: #856404;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }
            
            .navbar-left {
                flex-direction: column;
                gap: 10px;
            }
            
            .time-display {
                width: 100%;
                justify-content: center;
            }
            
            h1 {
                font-size: 1.5em;
            }
            
            .game-grid {
                grid-template-columns: 1fr 1fr;
                gap: 15px;
                max-height: 70vh;
            }
            
            .word-card {
                padding: 10px 12px;
                font-size: 12px;
            }
            
            .word-column {
                gap: 8px;
            }
            
            .column-header {
                font-size: 14px;
                padding: 8px 12px;
            }
            
            .game-container {
                padding: 15px;
            }
            
            .game-header {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
            
            .timer, .score {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 物联网英语词汇配对游戏</h1>

        <div class="navbar">
            <div class="navbar-left">
                <div class="time-display" id="timeDisplay">
                    <span class="time-icon">🕐</span>
                    <span class="time-text" id="currentTime">加载中...</span>
                </div>
                <div class="nav-links">
                    <button class="nav-btn active" onclick="showPage('home')">🏠 首页</button>
                    <button class="nav-btn" onclick="showPage('leaderboard')">🏆 排行榜</button>
                    <button class="nav-btn" id="myBtn" onclick="showPage('my')">👤 我的</button>
                    <button class="nav-btn" id="adminBtn" onclick="showPage('admin')" style="display:none;">⚙️ 管理</button>
                    <button class="nav-btn refresh-btn" onclick="refreshPage()">🔄 刷新</button>
                </div>
            </div>
            <div class="user-info">
                <input type="text" class="username-input" id="usernameInput" placeholder="输入你的名字" maxlength="20">
                <button class="nav-btn" id="loginBtn" onclick="showLoginModal()">🔐 登录</button>
                <button class="nav-btn" id="logoutBtn" onclick="logout()" style="display:none;">🚪 登出</button>
                <span id="adminBadge" class="admin-badge" style="display:none;">管理员</span>
            </div>
        </div>

        <!-- 首页 -->
        <div id="homePage" class="page active">
            <div class="update-notice" id="updateNotice" style="display:none;">
                🔄 排行榜每分钟自动更新...
            </div>
            <div class="levels-grid" id="levelsGrid">
                <!-- 关卡将动态加载 -->
            </div>
        </div>

        <!-- 游戏页面 -->
        <div id="gamePage" class="page">
            <div class="game-container">
                <div class="game-header">
                    <div>
                        <h2 id="levelName">关卡名称</h2>
                        <p id="levelDesc">关卡描述</p>
                    </div>
                    <div style="text-align: right;">
                        <div class="timer" id="timer">08:00</div>
                        <div class="score">得分: <span id="score">0</span></div>
                    </div>
                </div>
                <div class="game-grid">
                    <div class="word-column">
                        <div class="column-header">English</div>
                        <div id="englishColumn">
                            <!-- 英文词汇 -->
                        </div>
                    </div>
                    <div class="word-column">
                        <div class="column-header">中文</div>
                        <div id="chineseColumn">
                            <!-- 中文释义 -->
                        </div>
                    </div>
                </div>
                <div class="message" id="gameMessage"></div>
                <div style="text-align: center; margin-top: 20px;">
                    <button class="nav-btn" onclick="showPage('home')">返回选择关卡</button>
                </div>
            </div>
        </div>

        <!-- 排行榜页面 -->
        <div id="leaderboardPage" class="page">
            <div class="leaderboard-section">
                <h2>🏆 排行榜</h2>
                <div class="leaderboard-tabs">
                    <button class="tab-btn active" onclick="showLeaderboard('total')">总排行榜</button>
                    <button class="tab-btn" onclick="showLeaderboard('all')">全部记录</button>
                    <button class="tab-btn" id="levelTab" style="display:none;" onclick="showLeaderboard('level')">当前关卡</button>
                </div>
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>排名</th>
                            <th>玩家</th>
                            <th>关卡</th>
                            <th>分数</th>
                            <th>时间</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <!-- 排行数据 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 我的页面 -->
        <div id="myPage" class="page">
            <div class="my-page">
                <h2>👤 我的信息</h2>
                <div class="info-item">
                    <strong>用户名:</strong> <span id="myUsername">未设置</span>
                </div>
                <div class="info-item">
                    <strong>IP地址:</strong> <span id="myIP">加载中...</span>
                </div>
                <div class="info-item">
                    <strong>管理员状态:</strong> <span id="myAdminStatus">检查中...</span>
                </div>
                <div id="adminControls" style="display:none; margin-top: 20px;">
                    <button class="nav-btn" onclick="showPage('admin')">⚙️ 进入管理页面</button>
                </div>
            </div>
        </div>

        <!-- 管理员页面 -->
        <div id="adminPage" class="page">
            <div class="game-container">
                <h2>⚙️ 添加新关卡</h2>
                <div style="margin-bottom: 15px;">
                    <label>关卡名称:</label>
                    <input type="text" id="levelNameInput" placeholder="例如：职业英语词汇" style="width:100%; padding:10px; border:2px solid #ddd; border-radius:8px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label>关卡描述:</label>
                    <input type="text" id="levelDescInput" placeholder="例如：职业相关英语词汇" style="width:100%; padding:10px; border:2px solid #ddd; border-radius:8px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label>时间限制（秒）:</label>
                    <input type="number" id="levelTimeInput" value="480" min="60" max="3600" style="width:150px; padding:10px; border:2px solid #ddd; border-radius:8px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label>词汇内容（分组格式）:</label>
                    <textarea id="levelWordsInput" placeholder="Group A 态度与责任&#10;1. responsible：有责任心的；负责的&#10;2. safety：安全&#10;3. quality：品质；质量&#10;&#10;Group B 知识与技能&#10;1. core skills：核心技能&#10;2. traditional welding：传统焊接" style="width:100%; height:200px; padding:10px; border:2px solid #ddd; border-radius:8px;"></textarea>
                </div>
                <button class="nav-btn" onclick="addLevel()">➕ 添加关卡</button>
            </div>

            <div class="game-container" style="margin-top: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>📋 关卡管理</h2>
                    <button class="nav-btn" onclick="loadAdminLevels()" style="font-size:14px; padding:8px 16px;">🔄 刷新</button>
                </div>
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>关卡名称</th>
                            <th>词汇数</th>
                            <th>时间限制</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="adminLevelsBody">
                        <!-- 数据 -->
                    </tbody>
                </table>
            </div>

            <div class="game-container" style="margin-top: 20px;">
                <h2>📊 用户得分记录</h2>
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>玩家</th>
                            <th>关卡</th>
                            <th>分数</th>
                            <th>IP地址</th>
                            <th>时间</th>
                        </tr>
                    </thead>
                    <tbody id="adminScoresBody">
                        <!-- 数据 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 游戏结束弹窗 -->
        <div class="modal" id="gameOverModal">
            <div class="modal-content">
                <h2 id="gameOverTitle">游戏结束!</h2>
                <p id="gameOverScore">你的得分: 0</p>
                <p id="gameOverMessage"></p>
                <button onclick="closeModal()">确定</button>
                <button onclick="restartGame()">再来一次</button>
            </div>
        </div>

        <!-- 登录弹窗 -->
        <div class="modal" id="loginModal">
            <div class="modal-content">
                <h2>🔐 用户登录</h2>
                <div style="margin-bottom: 20px;">
                    <label style="display:block; text-align:left; margin-bottom:5px;">用户名:</label>
                    <input type="text" id="loginUsername" placeholder="请输入用户名" style="width:100%; padding:10px; border:2px solid #ddd; border-radius:8px;">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display:block; text-align:left; margin-bottom:5px;">密码:</label>
                    <input type="password" id="loginPassword" placeholder="请输入密码" style="width:100%; padding:10px; border:2px solid #ddd; border-radius:8px;">
                </div>
                <div style="color:#666; font-size:12px; margin-bottom:15px; text-align:left;">
                    <p><strong>测试账号:</strong> user / user123</p>
                </div>
                <button onclick="login()">登录</button>
                <button onclick="closeLoginModal()">取消</button>
            </div>
        </div>

    </div>

    <script>
        let currentLevel = null;
        let selectedEnglish = null;
        let selectedChinese = null;
        let score = 0;
        let matchedPairs = 0;
        let totalPairs = 0;
        let timer = null;
        let timeLeft = 480;
        let isGameActive = false;
        let currentLeaderboardType = 'all';

        // 初始化
        window.onload = function() {
            console.log('页面加载完成');
            initApp();
        };

        async function initApp() {
            try {
                await loadLevels();
                await checkAdmin();
                startLeaderboardUpdate();
                
                const savedUsername = localStorage.getItem('username');
                if (savedUsername) {
                    document.getElementById('usernameInput').value = savedUsername;
                }
                
                document.getElementById('usernameInput').addEventListener('change', function() {
                    const username = this.value.trim() || '匿名用户';
                    localStorage.setItem('username', username);
                });
                
                updateTime();
                setInterval(updateTime, 1000);
            } catch (error) {
                console.error('初始化失败:', error);
            }
        }

        function updateTime() {
            const now = new Date();
            const beijingTime = new Date(now.toLocaleString("en-US", { timeZone: "Asia/Shanghai" }));
            
            const year = beijingTime.getFullYear();
            const month = String(beijingTime.getMonth() + 1).padStart(2, '0');
            const day = String(beijingTime.getDate()).padStart(2, '0');
            const hours = String(beijingTime.getHours()).padStart(2, '0');
            const minutes = String(beijingTime.getMinutes()).padStart(2, '0');
            const seconds = String(beijingTime.getSeconds()).padStart(2, '0');
            
            const timeString = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
            document.getElementById('currentTime').textContent = timeString;
        }

        async function loadLevels() {
            try {
                const response = await fetch('/api/levels');
                const levels = await response.json();
                displayLevels(levels);
            } catch (error) {
                console.error('加载关卡失败:', error);
            }
        }

        function displayLevels(levels) {
            const grid = document.getElementById('levelsGrid');
            grid.innerHTML = '';
            
            if (levels.length === 0) {
                grid.innerHTML = '<p style="color:white; text-align:center;">暂无关卡</p>';
                return;
            }
            
            levels.forEach(level => {
                const card = document.createElement('div');
                card.className = 'level-card';
                card.innerHTML = `
                    <h3>${level.name}</h3>
                    <p>${level.description}</p>
                    <div class="level-stats">
                        <span>⏱️ ${Math.floor(level.timeLimit / 60)}分钟</span>
                        <span>📝 ${level.words.length}个词汇</span>
                    </div>
                    <div class="level-actions">
                        <button class="level-btn play-btn" onclick="event.stopPropagation(); startGame(${level.id})">🎮 开始挑战</button>
                        <button class="level-btn rank-btn" onclick="event.stopPropagation(); viewLevelRanking(${level.id}, '${level.name}')">📊 排行榜</button>
                    </div>
                `;
                card.onclick = () => startGame(level.id);
                grid.appendChild(card);
            });
        }

        function viewLevelRanking(levelId, levelName) {
            currentLevel = { id: levelId, name: levelName };
            document.getElementById('levelTab').style.display = 'inline-block';
            showPage('leaderboard');
            showLeaderboard('level');
        }

        function startGame(levelId) {
            fetch(`/api/levels/${levelId}`)
                .then(response => response.json())
                .then(level => {
                    currentLevel = level;
                    initGame(level);
                    showPage('game');
                })
                .catch(error => console.error('加载关卡失败:', error));
        }

        function initGame(level) {
            document.getElementById('levelName').textContent = level.name;
            document.getElementById('levelDesc').textContent = level.description;
            
            score = 0;
            matchedPairs = 0;
            totalPairs = level.words.length;
            timeLeft = level.timeLimit;
            isGameActive = true;
            
            document.getElementById('score').textContent = score;
            document.getElementById('gameMessage').textContent = '';
            
            const englishWords = [...level.words].map(w => ({...w, type: 'english'}));
            const chineseWords = [...level.words].map(w => ({...w, type: 'chinese'}));
            
            shuffleArray(englishWords);
            shuffleArray(chineseWords);
            
            displayWords(englishWords, 'englishColumn');
            displayWords(chineseWords, 'chineseColumn');
            
            startTimer();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function displayWords(words, columnId) {
            const column = document.getElementById(columnId);
            column.innerHTML = '';
            
            words.forEach(word => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.dataset.id = word.english;
                card.textContent = word.type === 'english' ? word.english : word.chinese;
                card.onclick = () => selectWord(card, word.type);
                column.appendChild(card);
            });
        }

        function selectWord(card, type) {
            if (!isGameActive) return;
            
            if (card.classList.contains('matched')) return;
            
            if (type === 'english') {
                if (selectedEnglish) {
                    selectedEnglish.classList.remove('selected');
                }
                selectedEnglish = card;
                card.classList.add('selected');
            } else {
                if (selectedChinese) {
                    selectedChinese.classList.remove('selected');
                }
                selectedChinese = card;
                card.classList.add('selected');
            }
            
            checkMatch();
        }

        function checkMatch() {
            if (selectedEnglish && selectedChinese) {
                const englishId = selectedEnglish.dataset.id;
                const chineseCard = selectedChinese;
                
                fetch('/api/levels/' + currentLevel.id)
                    .then(response => response.json())
                    .then(level => {
                        const word = level.words.find(w => w.english === englishId);
                        if (word && chineseCard.textContent === word.chinese) {
                            selectedEnglish.classList.add('matched');
                            selectedChinese.classList.add('matched');
                            selectedEnglish.classList.remove('selected');
                            selectedChinese.classList.remove('selected');
                            
                            score += 10;
                            matchedPairs++;
                            
                            document.getElementById('score').textContent = score;
                            document.getElementById('gameMessage').textContent = '🎉 太棒了！配对成功！';
                            
                            setTimeout(() => {
                                document.getElementById('gameMessage').textContent = '';
                            }, 1500);
                            
                            if (matchedPairs === totalPairs) {
                                endGame(true);
                            }
                        } else {
                            score = Math.max(0, score - 5);
                            document.getElementById('score').textContent = score;
                            document.getElementById('gameMessage').textContent = '❌ 回答错误！';
                            
                            selectedEnglish.classList.add('shake');
                            selectedChinese.classList.add('shake');
                            selectedEnglish.classList.remove('selected');
                            selectedChinese.classList.remove('selected');
                            
                            setTimeout(() => {
                                selectedEnglish.classList.remove('shake');
                                selectedChinese.classList.remove('shake');
                                document.getElementById('gameMessage').textContent = '';
                            }, 500);
                        }
                        
                        selectedEnglish = null;
                        selectedChinese = null;
                    });
            }
        }

        function startTimer() {
            if (timer) clearInterval(timer);
            
            timer = setInterval(() => {
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                document.getElementById('timer').textContent = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeLeft <= 0) {
                    endGame(false);
                }
            }, 1000);
        }

        function endGame(completed) {
            isGameActive = false;
            if (timer) clearInterval(timer);
            
            const modal = document.getElementById('gameOverModal');
            document.getElementById('gameOverScore').textContent = `你的得分: ${score}`;
            document.getElementById('gameOverTitle').textContent = completed ? '🎉 恭喜通关!' : '⏰ 时间到!';
            document.getElementById('gameOverMessage').textContent = 
                completed ? '太厉害了!所有词汇都配对成功!' : `还有 ${totalPairs - matchedPairs} 个词汇没有配对`;
            
            modal.classList.add('active');
            
            saveScore();
        }

        function closeModal() {
            document.getElementById('gameOverModal').classList.remove('active');
            showPage('home');
        }

        function restartGame() {
            document.getElementById('gameOverModal').classList.remove('active');
            if (currentLevel) {
                startGame(currentLevel.id);
            }
        }

        async function saveScore() {
            const username = document.getElementById('usernameInput').value.trim() || '匿名用户';
            
            try {
                await fetch('/api/scores', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        levelId: currentLevel.id,
                        levelName: currentLevel.name,
                        score: score,
                        matchedPairs: matchedPairs,
                        totalPairs: totalPairs
                    })
                });
            } catch (error) {
                console.error('保存分数失败:', error);
            }
        }

        async function loadAdminLevels() {
            try {
                const response = await fetch('/api/levels');
                const levels = await response.json();
                displayAdminLevels(levels);
            } catch (error) {
                console.error('加载关卡列表失败:', error);
            }
        }

        function displayAdminLevels(levels) {
            const tbody = document.getElementById('adminLevelsBody');
            tbody.innerHTML = '';
            
            if (levels.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">暂无关卡</td></tr>';
                return;
            }
            
            levels.forEach(level => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${level.name}</td>
                    <td>${level.words.length}</td>
                    <td>${Math.floor(level.timeLimit / 60)}分钟</td>
                    <td>
                        <button class="delete-btn" onclick="deleteLevel(${level.id}, '${level.name}')">🗑️ 删除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function deleteLevel(levelId, levelName) {
            if (!confirm(`确定要删除关卡「${levelName}」吗？此操作不可撤销！`)) {
                return;
            }
            
            const token = localStorage.getItem('sessionToken');
            if (!token) {
                alert('请先登录!');
                showLoginModal();
                return;
            }
            
            try {
                const response = await fetch('/api/admin/levels', {
                    method: 'DELETE',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-session-token': token
                    },
                    body: JSON.stringify({ levelId })
                });
                
                const data = await response.json();
                if (data.success) {
                    alert('关卡删除成功!');
                    loadAdminLevels();
                    loadLevels();
                } else {
                    alert('删除失败: ' + (data.error || '未知错误'));
                }
            } catch (error) {
                alert('删除失败: ' + error.message);
            }
        }

        async function loadAdminScores() {
            const token = localStorage.getItem('sessionToken');
            if (!token) return;
            
            try {
                const response = await fetch('/api/admin/scores', {
                    headers: { 'x-session-token': token }
                });
                const scores = await response.json();
                displayAdminScores(scores);
            } catch (error) {
                console.error('加载得分记录失败:', error);
            }
        }

        function displayAdminScores(scores) {
            const tbody = document.getElementById('adminScoresBody');
            tbody.innerHTML = '';
            
            if (scores.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">暂无记录</td></tr>';
                return;
            }
            
            scores.forEach((score, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${score.username}</td>
                    <td>${score.levelName}</td>
                    <td>${score.score}</td>
                    <td>${score.ip}</td>
                    <td>${score.time}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function showPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(page + 'Page').classList.add('active');
            
            const btn = document.querySelector(`.nav-btn[onclick="showPage('${page}')"]`);
            if (btn) btn.classList.add('active');
            
            if (page === 'leaderboard') {
                showLeaderboard('total');
            }
            
            if (page === 'admin') {
                loadAdminLevels();
                loadAdminScores();
            }
        }

        async function refreshPage() {
            const refreshBtn = document.querySelector('.refresh-btn');
            refreshBtn.innerHTML = '⏳ 刷新中...';
            refreshBtn.disabled = true;
            
            try {
                const currentPage = document.querySelector('.page.active');
                if (currentPage.id === 'homePage') {
                    await loadLevels();
                } else if (currentPage.id === 'leaderboardPage') {
                    await showLeaderboard(currentLeaderboardType);
                } else if (currentPage.id === 'adminPage') {
                    await loadAdminLevels();
                    await loadAdminScores();
                } else if (currentPage.id === 'myPage') {
                    await checkAdminStatus();
                }
                
                await checkLoginStatus();
                
                alert('页面刷新成功！');
            } catch (error) {
                console.error('刷新失败:', error);
                alert('刷新失败: ' + error.message);
            } finally {
                refreshBtn.innerHTML = '🔄 刷新';
                refreshBtn.disabled = false;
            }
        }

        async function showLeaderboard(type) {
            currentLeaderboardType = type;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            const tabs = document.querySelectorAll('.tab-btn');
            if (type === 'total') {
                tabs[0].classList.add('active');
            } else if (type === 'all') {
                tabs[1].classList.add('active');
            } else {
                tabs[2].classList.add('active');
            }
            
            try {
                let url;
                if (type === 'total') {
                    url = '/api/scores/total';
                } else if (type === 'all') {
                    url = '/api/scores';
                } else {
                    url = `/api/scores?levelId=${currentLevel?.id || 1}`;
                }
                
                const response = await fetch(url);
                const scores = await response.json();
                
                if (type === 'total') {
                    displayTotalLeaderboard(scores);
                } else {
                    displayLeaderboard(scores);
                }
            } catch (error) {
                console.error('加载排行榜失败:', error);
            }
        }

        function displayTotalLeaderboard(scores) {
            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = '';
            
            if (scores.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">暂无记录</td></tr>';
                return;
            }
            
            scores.forEach((score, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="rank-badge rank-${index + 1 <= 3 ? index + 1 : ''}">${index + 1}</span></td>
                    <td>${score.username}</td>
                    <td>${score.levelCount}个关卡</td>
                    <td><strong>${score.totalScore}</strong></td>
                    <td>${score.latestTimeStr || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function displayLeaderboard(scores) {
            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = '';
            
            if (scores.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">暂无记录</td></tr>';
                return;
            }
            
            scores.forEach((score, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="rank-badge rank-${index + 1 <= 3 ? index + 1 : ''}">${index + 1}</span></td>
                    <td>${score.username}</td>
                    <td>${score.levelName}</td>
                    <td>${score.score}</td>
                    <td>${score.time || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function checkAdmin() {
            try {
                const response = await fetch('/api/check-admin');
                const data = await response.json();
                
                document.getElementById('myIP').textContent = data.ip;
                
                if (data.isAdmin) {
                    document.getElementById('adminBtn').style.display = 'inline-block';
                    document.getElementById('adminBadge').style.display = 'inline-block';
                    document.getElementById('adminControls').style.display = 'block';
                    document.getElementById('myAdminStatus').textContent = '✓ 管理员（IP识别）';
                    document.getElementById('myAdminStatus').style.color = '#28a745';
                } else {
                    document.getElementById('myAdminStatus').textContent = '✗ 普通用户';
                    document.getElementById('myAdminStatus').style.color = '#dc3545';
                }
                
                await checkLoginStatus();
            } catch (error) {
                console.error('检查管理员状态失败:', error);
            }
        }

        async function checkLoginStatus() {
            const token = localStorage.getItem('sessionToken');
            if (!token) return;
            
            try {
                const response = await fetch('/api/validate-session', {
                    headers: { 'x-session-token': token }
                });
                
                const data = await response.json();
                if (data.valid) {
                    updateLoginUI(data.isAdmin);
                } else {
                    localStorage.removeItem('sessionToken');
                    localStorage.removeItem('isAdmin');
                }
            } catch (error) {
                console.error('检查登录状态失败:', error);
            }
        }

        function updateLoginUI(isAdmin) {
            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'inline-block';
            
            if (isAdmin) {
                document.getElementById('adminBtn').style.display = 'inline-block';
                document.getElementById('adminBadge').style.display = 'inline-block';
                document.getElementById('adminControls').style.display = 'block';
                document.getElementById('myAdminStatus').textContent = '✓ 管理员（密码登录）';
                document.getElementById('myAdminStatus').style.color = '#28a745';
            } else {
                document.getElementById('myAdminStatus').textContent = '✓ 用户（密码登录）';
                document.getElementById('myAdminStatus').style.color = '#17a2b8';
            }
        }

        function showLoginModal() {
            document.getElementById('loginModal').classList.add('active');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('active');
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
        }

        async function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!username || !password) {
                alert('请输入用户名和密码!');
                return;
            }
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('sessionToken', data.token);
                    localStorage.setItem('isAdmin', String(data.isAdmin));
                    updateLoginUI(data.isAdmin);
                    closeLoginModal();
                    alert(data.message);
                } else {
                    alert(data.error || '登录失败');
                }
            } catch (error) {
                alert('登录失败: ' + error.message);
            }
        }

        async function logout() {
            const token = localStorage.getItem('sessionToken');
            if (token) {
                try {
                    await fetch('/api/logout', {
                        method: 'POST',
                        headers: { 'x-session-token': token }
                    });
                } catch (error) {
                    console.error('登出失败:', error);
                }
            }
            
            localStorage.removeItem('sessionToken');
            localStorage.removeItem('isAdmin');
            
            document.getElementById('loginBtn').style.display = 'inline-block';
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('adminBtn').style.display = 'none';
            document.getElementById('adminBadge').style.display = 'none';
            document.getElementById('adminControls').style.display = 'none';
            document.getElementById('myAdminStatus').textContent = '✗ 已登出';
            document.getElementById('myAdminStatus').style.color = '#dc3545';
            
            alert('已成功登出');
        }

        async function addLevel() {
            const name = document.getElementById('levelNameInput').value.trim();
            const description = document.getElementById('levelDescInput').value.trim();
            const timeLimit = parseInt(document.getElementById('levelTimeInput').value) || 480;
            const wordsText = document.getElementById('levelWordsInput').value.trim();
            
            if (!name || !description || !wordsText) {
                alert('请填写所有字段!');
                return;
            }
            
            const words = parseWordsText(wordsText);
            if (words.length === 0) {
                alert('词汇格式错误!');
                return;
            }
            
            const token = localStorage.getItem('sessionToken');
            if (!token) {
                alert('请先登录!');
                showLoginModal();
                return;
            }
            
            const headers = { 
                'Content-Type': 'application/json',
                'x-session-token': token
            };
            
            try {
                const response = await fetch('/api/levels', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ name, description, timeLimit, words })
                });
                
                const data = await response.json();
                if (data.success) {
                    alert('关卡添加成功!');
                    document.getElementById('levelNameInput').value = '';
                    document.getElementById('levelDescInput').value = '';
                    document.getElementById('levelWordsInput').value = '';
                    loadLevels();
                } else {
                    if (data.error === '需要管理员权限') {
                        alert('权限不足!请使用管理员账号登录。\n\n管理员账号: admin / admin123');
                        showLoginModal();
                    } else {
                        alert('添加失败: ' + (data.error || '未知错误'));
                    }
                }
            } catch (error) {
                alert('添加失败: ' + error.message);
            }
        }

        function parseWordsText(wordsText) {
            const words = [];
            const lines = wordsText.split('\n');
            let currentGroup = '';
            
            for (let line of lines) {
                line = line.trim();
                if (!line) continue;
                
                const groupMatch = line.match(/^Group\s+([A-Z])\s+(.+)$/);
                if (groupMatch) {
                    currentGroup = groupMatch[1] + ' ' + groupMatch[2];
                    continue;
                }
                
                const wordMatch = line.match(/^(\d+)\.\s*([^：:]+)[：:]\s*(.+)$/);
                if (wordMatch) {
                    words.push({
                        english: wordMatch[2].trim(),
                        chinese: wordMatch[3].trim(),
                        group: currentGroup
                    });
                }
            }
            
            return words;
        }

        function startLeaderboardUpdate() {
            document.getElementById('updateNotice').style.display = 'block';
            
            setInterval(async () => {
                if (document.getElementById('leaderboardPage').classList.contains('active')) {
                    await showLeaderboard(currentLeaderboardType);
                }
            }, 60000);
        }
    </script>
</body>
</html>
