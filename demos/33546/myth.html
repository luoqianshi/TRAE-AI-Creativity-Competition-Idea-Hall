<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梅花易数 - 八卦起卦</title>
    <style>
        :root {
            --ink-black: #0c0c0e;
            --ink-surface: rgba(20, 20, 22, 0.92);
            --gold-dim: #6b5b2e;
            --gold: #b89b4a;
            --gold-bright: #d4b86a;
            --gold-glow: rgba(184, 155, 74, 0.2);
            --cinnabar: #c45c48;
            --cinnabar-glow: rgba(196, 92, 72, 0.3);
            --text-muted: rgba(184, 155, 74, 0.5);
            --text-body: rgba(184, 155, 74, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'STKaiti', 'KaiTi', 'Microsoft YaHei', serif;
            background: var(--ink-black);
            color: var(--gold);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            padding: 2rem 0 1rem;
        }

        h1 {
            font-size: 3.2rem;
            color: var(--gold-bright);
            letter-spacing: 0.8rem;
            margin-bottom: 0.5rem;
            font-weight: bold;
            text-shadow: 0 0 60px var(--gold-glow), 0 2px 4px rgba(0,0,0,0.8);
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            letter-spacing: 0.5rem;
        }

        .card {
            background: var(--ink-surface);
            border: 1px solid rgba(184, 155, 74, 0.12);
            border-radius: 4px;
            padding: 2rem;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(184, 155, 74, 0.06);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
        }

        .card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(184, 155, 74, 0.08), transparent);
        }

        .section-title {
            font-size: 1.3rem;
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--gold-bright);
            position: relative;
            letter-spacing: 0.3rem;
            font-weight: normal;
        }

        .section-title::before,
        .section-title::after {
            content: '◆';
            margin: 0 1.2rem;
            opacity: 0.2;
            font-size: 0.5rem;
            vertical-align: middle;
        }

        .input-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            align-items: center;
        }

        .selector-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
        }

        .selector-group label {
            font-size: 0.95rem;
            color: var(--text-muted);
            letter-spacing: 0.15rem;
        }

        select {
            background: rgba(12, 12, 14, 0.95);
            border: 1px solid rgba(184, 155, 74, 0.2);
            color: var(--gold-bright);
            padding: 0.8rem 1.4rem;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
            text-align: center;
            font-family: inherit;
            letter-spacing: 0.1rem;
        }

        select:hover,
        select:focus {
            border-color: var(--gold);
            box-shadow: 0 0 20px var(--gold-glow);
            outline: none;
        }

        .number-generator {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .number-box {
            width: 85px;
            height: 85px;
            background: rgba(12, 12, 14, 0.8);
            border: 1px solid rgba(184, 155, 74, 0.15);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--gold-bright);
            transition: all 0.4s ease;
            position: relative;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.05rem;
        }

        .number-box::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border: 1px solid rgba(184, 155, 74, 0.06);
            border-radius: 2px;
            pointer-events: none;
        }

        .number-box.generating {
            animation: numberPulse 0.12s infinite;
        }

        @keyframes numberPulse {
            0%, 100% { transform: scale(1); border-color: rgba(184, 155, 74, 0.15); }
            50% { transform: scale(1.04); border-color: var(--gold); }
        }

        .number-box.ready {
            border-color: var(--gold);
            box-shadow: 0 0 25px var(--gold-glow), inset 0 0 15px rgba(184, 155, 74, 0.03);
        }

        .number-box.ready::before { opacity: 0; }

        .number-label {
            text-align: center;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            opacity: 0.45;
            letter-spacing: 0.1rem;
        }

        .btn {
            background: transparent;
            color: var(--gold-bright);
            border: 1px solid rgba(184, 155, 74, 0.25);
            padding: 1rem 3rem;
            font-size: 1.1rem;
            font-weight: normal;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.4s ease;
            letter-spacing: 0.3rem;
            position: relative;
            overflow: hidden;
            font-family: inherit;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(184, 155, 74, 0.06);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .btn:hover::before {
            opacity: 1;
        }

        .btn:hover {
            border-color: var(--gold);
            box-shadow: 0 0 24px var(--gold-glow);
        }

        .btn:active {
            border-color: var(--gold-bright);
        }

        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            border-color: rgba(184, 155, 74, 0.1);
            box-shadow: none;
        }

        .btn:disabled::before {
            display: none;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .bagua-container {
            display: flex;
            justify-content: center;
            padding: 2rem 0;
            perspective: 1000px;
        }

        .bagua-circle {
            width: 380px;
            height: 380px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bagua-ring-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 1px solid rgba(184, 155, 74, 0.18);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(184, 155, 74, 0.05), inset 0 0 50px rgba(184, 155, 74, 0.03);
        }

        .bagua-ring-middle {
            position: absolute;
            width: 78%;
            height: 78%;
            border: 1px dashed rgba(184, 155, 74, 0.1);
            border-radius: 50%;
        }

        .bagua-ring-inner {
            position: absolute;
            width: 58%;
            height: 58%;
            border: 1px solid rgba(184, 155, 74, 0.08);
            border-radius: 50%;
        }

        .bagua-center {
            position: absolute;
            width: 44px;
            height: 44px;
            background: transparent;
            border: 1px solid rgba(184, 155, 74, 0.15);
            border-radius: 50%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bagua-center::before {
            content: '☯';
            position: static;
            transform: none;
            font-size: 1.4rem;
            color: var(--gold);
            text-shadow: none;
        }

        .trigram-container {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: rotateBagua 4s ease-in-out;
            animation-fill-mode: forwards;
        }

        .trigram-container.rotating {
            animation: rotateBagua 4s ease-in-out infinite;
        }

        @keyframes rotateBagua {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .trigram {
            position: absolute;
            width: 56px;
            height: 56px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            transition: all 0.3s ease;
        }

        .trigram:hover {
            transform: scale(1.15);
        }

        .trigram-line {
            width: 42px;
            height: 5px;
            background: var(--gold);
            border-radius: 2px;
        }

        .trigram-line.broken {
            background: transparent;
            position: relative;
        }

        .trigram-line.broken::before,
        .trigram-line.broken::after {
            content: '';
            position: absolute;
            top: 0;
            width: 18px;
            height: 5px;
            background: var(--gold);
            border-radius: 2px;
        }

        .trigram-line.broken::before { left: 0; }
        .trigram-line.broken::after { right: 0; }

        .trigram-name {
            position: absolute;
            bottom: -26px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
            letter-spacing: 0.12rem;
        }

        .hexagram-display {
            text-align: center;
            z-index: 20;
            position: relative;
            margin-top: 0.6rem;
        }

        .hexagram-symbol {
            font-size: 4.5rem;
            line-height: 1.2;
            margin-bottom: 0.2rem;
        }

        .hexagram-lines {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            gap: 5px;
            margin: 0.8rem 0;
        }

        .hexagram-line {
            width: 130px;
            height: 9px;
            background: var(--gold);
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .hexagram-line.broken {
            background: transparent;
            position: relative;
        }

        .hexagram-line.broken::before,
        .hexagram-line.broken::after {
            content: '';
            position: absolute;
            top: 0;
            width: 56px;
            height: 9px;
            background: var(--gold);
            border-radius: 2px;
        }

        .hexagram-line.broken::before { left: 0; }
        .hexagram-line.broken::after { right: 0; }

        .hexagram-line.changing {
            background: var(--cinnabar) !important;
            animation: changingPulse 1.5s ease-in-out infinite;
        }

        .hexagram-line.changing::before,
        .hexagram-line.changing::after {
            background: var(--cinnabar) !important;
        }

        @keyframes changingPulse {
            0%, 100% { box-shadow: 0 0 4px var(--cinnabar-glow); }
            50% { box-shadow: 0 0 16px var(--cinnabar-glow), 0 0 28px rgba(196, 92, 72, 0.15); }
        }

        .hexagram-name {
            font-size: 1.8rem;
            color: var(--gold-bright);
            margin-top: 0.5rem;
            letter-spacing: 0.25rem;
        }

        .interpretation {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease;
        }

        .interpretation.show {
            opacity: 1;
            transform: translateY(0);
        }

        .interpretation h3 {
            font-size: 1.35rem;
            color: var(--gold-bright);
            margin-bottom: 1rem;
            text-align: center;
            letter-spacing: 0.18rem;
            font-weight: normal;
        }

        .interpretation p {
            line-height: 2;
            margin-bottom: 0.8rem;
            text-align: justify;
            font-size: 1rem;
            color: var(--text-body);
            text-indent: 2em;
        }

        .judgment {
            font-size: 1.05rem;
            padding: 1.2rem 1.2rem 1.2rem 2rem;
            background: rgba(184, 155, 74, 0.04);
            border-left: 2px solid var(--gold-dim);
            border-radius: 0 2px 2px 0;
            margin-bottom: 1.5rem;
            position: relative;
            text-indent: 0;
        }

        .judgment::before {
            content: '「';
            position: absolute;
            left: 0.4rem;
            top: 0.5rem;
            font-size: 1.3rem;
            color: var(--gold-dim);
            opacity: 0.4;
        }

        .changing-line-text {
            color: var(--cinnabar) !important;
            font-weight: bold;
            text-indent: 2em;
        }

        .changing-line-text::before {
            content: '→ ';
            font-size: 0.9rem;
        }

        .hidden {
            display: none !important;
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
                letter-spacing: 0.4rem;
            }

            .subtitle {
                font-size: 0.85rem;
                letter-spacing: 0.3rem;
            }

            .number-box {
                width: 70px;
                height: 70px;
                font-size: 1.7rem;
            }

            .bagua-circle {
                width: 280px;
                height: 280px;
            }

            .bagua-center {
                width: 36px;
                height: 36px;
            }

            .bagua-center::before {
                font-size: 1.1rem;
            }

            .trigram {
                width: 46px;
                height: 46px;
            }

            .trigram-line {
                width: 34px;
                height: 4px;
            }

            .trigram-line.broken::before,
            .trigram-line.broken::after {
                width: 14px;
                height: 4px;
            }

            .hexagram-symbol {
                font-size: 3.5rem;
            }

            .hexagram-line {
                width: 100px;
                height: 7px;
            }

            .hexagram-line.broken::before,
            .hexagram-line.broken::after {
                width: 43px;
                height: 7px;
            }

            .btn {
                padding: 0.9rem 2rem;
                font-size: 1rem;
            }
        }

        /* === 模式切换开关 === */\n        .mode-toggle-row {\n            display: flex;\n            align-items: center;\n            justify-content: center;\n            gap: 0.8rem;\n            margin-bottom: 1.2rem;\n        }\n\n        .mode-label {\n            font-size: 0.85rem;\n            opacity: 0.65;\n            letter-spacing: 0.08rem;\n            transition: opacity 0.3s ease;\n        }\n\n        .mode-label.active {\n            opacity: 1;\n            color: var(--gold-bright);\n        }\n\n        .toggle-switch {\n            position: relative;\n            display: inline-block;\n            width: 52px;\n            height: 28px;\n            cursor: pointer;\n        }\n\n        .toggle-switch input {\n            opacity: 0;\n            width: 0;\n            height: 0;\n        }\n\n        .toggle-slider {\n            position: absolute;\n            top: 0;\n            left: 0;\n            right: 0;\n            bottom: 0;\n            background: rgba(212, 175, 55, 0.2);\n            border: 1px solid rgba(212, 175, 55, 0.4);\n            border-radius: 28px;\n            transition: all 0.35s ease;\n        }\n\n        .toggle-slider::before {\n            content: '';\n            position: absolute;\n            height: 20px;\n            width: 20px;\n            left: 3px;\n            bottom: 3px;\n            background: var(--gold);\n            border-radius: 50%;\n            transition: all 0.35s ease;\n            box-shadow: 0 0 8px var(--gold-glow);\n        }\n\n        .toggle-switch input:checked + .toggle-slider {\n            background: rgba(212, 175, 55, 0.35);\n            border-color: var(--gold);\n        }\n\n        .toggle-switch input:checked + .toggle-slider::before {\n            transform: translateX(24px);\n        }\n\n        /* === 手动输入数字 === */\n        .number-input {\n            width: 80px;\n            height: 80px;\n            border-radius: 4px;\n            border: 1px solid rgba(184, 155, 74, 0.2);\n            background: rgba(12, 12, 14, 0.8);\n            color: var(--gold-bright);\n            font-size: 1.8rem;\n            text-align: center;\n            font-family: 'Courier New', monospace;\n            outline: none;\n            transition: all 0.3s ease;\n            letter-spacing: 0.05rem;\n        }\n\n        .number-input:hover {\n            border-color: var(--gold);\n        }\n\n        .number-input:focus {\n            border-color: var(--gold);\n            box-shadow: 0 0 20px var(--gold-glow);\n            background: rgba(20, 15, 5, 0.8);\n        }\n\n        .number-input::placeholder {\n            color: rgba(212, 175, 55, 0.25);\n            font-size: 0.8rem;\n            letter-spacing: 0.1rem;\n        }\n\n        .number-input::-webkit-inner-spin-button,\n        .number-input::-webkit-outer-spin-button {\n            -webkit-appearance: none;\n            margin: 0;\n        }\n\n        .number-input[type=number] {\n            -moz-appearance: textfield;\n        }\n\n        @media (max-width: 768px) {\n            .number-input {\n                width: 65px;\n                height: 65px;\n                font-size: 1.4rem;\n            }\n        }\n\n        /* === 数字串输入 === */
        .sub-mode-toggle-row {
            display: flex;
            justify-content: center;
            gap: 0;
            margin-bottom: 1.2rem;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.25);
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .sub-mode-btn {
            padding: 0.45rem 1.2rem;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            letter-spacing: 0.08rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .sub-mode-btn.active {
            background: rgba(212, 175, 55, 0.2);
            color: var(--gold-bright);
        }

        .sub-mode-btn:hover:not(.active) {
            color: rgba(255, 255, 255, 0.75);
        }

        .digit-string-input {
            width: 280px;
            padding: 0.8rem 1.2rem;
            border-radius: 14px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            background: rgba(10, 10, 15, 0.6);
            color: var(--gold-bright);
            font-size: 1.8rem;
            text-align: center;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.2rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .digit-string-input:hover {
            border-color: var(--gold);
        }

        .digit-string-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 20px var(--gold-glow);
            background: rgba(20, 15, 5, 0.8);
        }

        .digit-string-input::placeholder {
            color: rgba(212, 175, 55, 0.25);
            font-size: 0.9rem;
            letter-spacing: 0.1rem;
        }

        .digit-parse-preview {
            text-align: center;
            min-height: 1.5rem;
            margin-top: 0.6rem;
            font-size: 0.85rem;
            color: rgba(212, 175, 55, 0.6);
            letter-spacing: 0.05rem;
            transition: all 0.3s ease;
        }

        .digit-parse-preview.ready {
            color: var(--gold-bright);
        }

        @media (max-width: 768px) {
            .digit-string-input {
                width: 220px;
                font-size: 1.4rem;
                padding: 0.6rem 1rem;
            }
        }

        /* === 体用生克 / 变卦 / 互卦 样式 === */
        .three-gua-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.2rem;
            margin-top: 1.5rem;
        }

        .gua-mini-card {
            background: rgba(20, 20, 22, 0.8);
            border: 1px solid rgba(184, 155, 74, 0.12);
            border-radius: 4px;
            padding: 1.2rem 0.8rem;
            text-align: center;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .gua-mini-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
            opacity: 0.4;
        }

        .gua-mini-card:hover {
            border-color: var(--gold);
            box-shadow: 0 0 20px var(--gold-glow);
        }

        .gua-mini-card.primary {
            border-color: var(--gold);
            box-shadow: 0 0 20px var(--gold-glow);
        }

        .gua-mini-card.changing {
            border-color: var(--cinnabar);
            box-shadow: 0 0 16px var(--cinnabar-glow);
        }

        .gua-mini-card .mini-symbol {
            font-size: 2.2rem;
            margin-bottom: 0.3rem;
        }

        .gua-mini-card .mini-lines {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            gap: 3px;
            margin: 0.5rem 0;
        }

        .gua-mini-card .mini-line {
            width: 65px;
            height: 6px;
            background: var(--gold);
            border-radius: 2px;
        }

        .gua-mini-card .mini-line.broken {
            background: transparent;
            position: relative;
        }

        .gua-mini-card .mini-line.broken::before,
        .gua-mini-card .mini-line.broken::after {
            content: '';
            position: absolute;
            top: 0;
            width: 28px;
            height: 6px;
            background: var(--gold);
            border-radius: 2px;
        }

        .gua-mini-card .mini-line.broken::before { left: 0; }
        .gua-mini-card .mini-line.broken::after { right: 0; }

        .gua-mini-card .mini-line.changing {
            background: var(--cinnabar) !important;
            animation: changingPulse 1.5s ease-in-out infinite;
        }

        .gua-mini-card .mini-label {
            font-size: 0.8rem;
            opacity: 0.6;
            letter-spacing: 0.1rem;
        }

        .gua-mini-card .mini-name {
            font-size: 1rem;
            color: var(--gold-bright);
            letter-spacing: 0.1rem;
            margin-top: 0.3rem;
        }

        .tiyong-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
            margin-top: 1rem;
        }

        .tiyong-box {
            background: rgba(10, 10, 15, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 14px;
            padding: 1.2rem;
            text-align: center;
        }

        .tiyong-box.ti {
            border-color: var(--gold);
            box-shadow: 0 0 15px var(--gold-glow);
        }

        .tiyong-box.yong {
            border-color: rgba(184, 155, 74, 0.2);
            box-shadow: 0 0 15px var(--gold-glow);
        }

        .tiyong-label {
            font-size: 0.9rem;
            opacity: 0.7;
            letter-spacing: 0.15rem;
            margin-bottom: 0.5rem;
        }

        .tiyong-value {
            font-size: 1.3rem;
            color: var(--gold-bright);
            letter-spacing: 0.1rem;
        }

        .wuxing-badge {
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            letter-spacing: 0.1rem;
            margin: 0.3rem;
        }

        .wuxing-jin { border: 1px solid rgba(184, 155, 74, 0.3); background: transparent; color: var(--gold-bright); }
        .wuxing-mu { border: 1px solid rgba(76, 175, 80, 0.3); background: transparent; color: #66BB6A; }
        .wuxing-shui { border: 1px solid rgba(33, 150, 243, 0.3); background: transparent; color: #42A5F5; }
        .wuxing-huo { border: 1px solid rgba(196, 92, 72, 0.3); background: transparent; color: var(--cinnabar); }
        .wuxing-tu { border: 1px solid rgba(156, 108, 64, 0.3); background: transparent; color: #BCAAA4; }

        .shengke-result {
            text-align: center;
            padding: 1rem;
            margin-top: 1rem;
            font-size: 1.3rem;
            letter-spacing: 0.2rem;
            border-radius: 12px;
        }

        .shengke-result.ji {
            background: rgba(76, 175, 80, 0.06);
            border: 1px solid rgba(76, 175, 80, 0.2);
            color: #66BB6A;
        }

        .shengke-result.xiong {
            background: rgba(196, 92, 72, 0.06);
            border: 1px solid rgba(196, 92, 72, 0.2);
            color: var(--cinnabar);
        }

        .shengke-result.ping {
            background: rgba(184, 155, 74, 0.04);
            border: 1px solid rgba(184, 155, 74, 0.15);
            color: var(--gold);
        }

        @media (max-width: 768px) {
            .three-gua-row {
                grid-template-columns: repeat(3, 1fr);
                gap: 0.5rem;
            }
            .gua-mini-card .mini-line { width: 48px; height: 5px; }
            .gua-mini-card .mini-line.broken::before,
            .gua-mini-card .mini-line.broken::after { width: 20px; height: 5px; }
            .tiyong-container { grid-template-columns: 1fr 1fr; gap: 0.8rem; }
        }
    </style>
</head>
<body>
    <canvas id="canvas-bg"></canvas>

    <div class="container">
        <header>
            <h1>梅花易数</h1>
            <p class="subtitle">八卦起卦 · 知天达命</p>
        </header>

        <div id="input-phase">
            <div class="card">
                <h2 class="section-title">选择天干地支</h2>
                <div class="input-section">
                    <div class="selector-group">
                        <label>天干</label>
                        <select id="tiangan">
                            <option value="甲">甲</option>
                            <option value="乙">乙</option>
                            <option value="丙">丙</option>
                            <option value="丁">丁</option>
                            <option value="戊">戊</option>
                            <option value="己">己</option>
                            <option value="庚">庚</option>
                            <option value="辛">辛</option>
                            <option value="壬">壬</option>
                            <option value="癸">癸</option>
                        </select>
                    </div>
                    <div class="selector-group">
                        <label>地支</label>
                        <select id="dizhi">
                            <option value="子">子</option>
                            <option value="丑">丑</option>
                            <option value="寅">寅</option>
                            <option value="卯">卯</option>
                            <option value="辰">辰</option>
                            <option value="巳">巳</option>
                            <option value="午">午</option>
                            <option value="未">未</option>
                            <option value="申">申</option>
                            <option value="酉">酉</option>
                            <option value="戌">戌</option>
                            <option value="亥">亥</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2 class="section-title">生成天地人三才之数</h2>
                <div class="mode-toggle-row">
                    <span class="mode-label">自动生成</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="mode-toggle">
                        <span class="toggle-slider"></span>
                    </label>
                    <span class="mode-label">手动输入</span>
                </div>
                <div class="number-generator" id="auto-mode-area">
                    <div>
                        <div class="number-box" id="num1">-</div>
                        <div class="number-label">天数</div>
                    </div>
                    <div>
                        <div class="number-box" id="num2">-</div>
                        <div class="number-label">地数</div>
                    </div>
                    <div>
                        <div class="number-box" id="num3">-</div>
                        <div class="number-label">人数</div>
                    </div>
                </div>
                <div class="number-generator hidden" id="manual-mode-area">
                    <div class="sub-mode-toggle-row">
                        <button class="sub-mode-btn active" id="sub-mode-separate">三数独立</button>
                        <button class="sub-mode-btn" id="sub-mode-string">数字串</button>
                    </div>
                    <div class="number-generator" id="separate-inputs">
                        <div>
                            <input type="number" class="number-input" id="input1" min="1" max="999" placeholder="天数">
                            <div class="number-label">天数</div>
                        </div>
                        <div>
                            <input type="number" class="number-input" id="input2" min="1" max="999" placeholder="地数">
                            <div class="number-label">地数</div>
                        </div>
                        <div>
                            <input type="number" class="number-input" id="input3" min="1" max="999" placeholder="人数">
                            <div class="number-label">人数</div>
                        </div>
                    </div>
                    <div class="number-generator hidden" id="string-input-area">
                        <div class="digit-string-container">
                            <input type="text" class="digit-string-input" id="digit-string" maxlength="12" placeholder="如：1234 或 2024">
                            <div class="number-label">输入数字串</div>
                        </div>
                        <div class="digit-parse-preview" id="digit-preview"></div>
                    </div>
                </div>
                <div class="actions">
                    <button class="btn" id="generate-btn">生成数字</button>
                    <button class="btn" id="divinate-btn" disabled>开始起卦</button>
                </div>
            </div>
        </div>

        <div id="result-phase" class="hidden">
            <div class="card">
                <h2 class="section-title">所得之卦</h2>
                <div class="bagua-container">
                    <div class="bagua-circle">
                        <div class="bagua-ring-outer"></div>
                        <div class="bagua-ring-middle"></div>
                        <div class="bagua-ring-inner"></div>
                        <div class="bagua-center"></div>
                        <div class="trigram-container" id="trigram-container">
                        </div>
                        <div class="hexagram-display">
                            <div class="hexagram-symbol" id="hexagram-symbol">☯</div>
                            <div class="hexagram-lines" id="hexagram-lines"></div>
                            <div class="hexagram-name" id="hexagram-name"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card" id="three-gua-card" style="display:none;">
                <h2 class="section-title">三卦一览</h2>
                <div class="three-gua-row">
                    <div class="gua-mini-card primary" id="ben-gua-card">
                        <div class="mini-label">本卦（原卦）</div>
                        <div class="mini-symbol" id="ben-symbol">☯</div>
                        <div class="mini-lines" id="ben-lines"></div>
                        <div class="mini-name" id="ben-name"></div>
                    </div>
                    <div class="gua-mini-card" id="hu-gua-card">
                        <div class="mini-label">互卦</div>
                        <div class="mini-symbol" id="hu-symbol">☯</div>
                        <div class="mini-lines" id="hu-lines"></div>
                        <div class="mini-name" id="hu-name"></div>
                    </div>
                    <div class="gua-mini-card changing" id="bian-gua-card">
                        <div class="mini-label">变卦（之卦）</div>
                        <div class="mini-symbol" id="bian-symbol">☯</div>
                        <div class="mini-lines" id="bian-lines"></div>
                        <div class="mini-name" id="bian-name"></div>
                    </div>
                </div>
            </div>

            <div class="card" id="tiyong-card" style="display:none;">
                <h2 class="section-title">体用生克分析</h2>
                <div class="tiyong-container">
                    <div class="tiyong-box ti">
                        <div class="tiyong-label">体卦（自身）</div>
                        <div class="tiyong-value" id="ti-gua-value">-</div>
                        <div><span class="wuxing-badge" id="ti-wuxing">-</span></div>
                    </div>
                    <div class="tiyong-box yong">
                        <div class="tiyong-label">用卦（外事）</div>
                        <div class="tiyong-value" id="yong-gua-value">-</div>
                        <div><span class="wuxing-badge" id="yong-wuxing">-</span></div>
                    </div>
                </div>
                <div class="shengke-result" id="shengke-result"></div>
                <p class="judgment" id="shengke-detail" style="margin-top:1rem;"></p>
            </div>

            <div class="card interpretation" id="interpretation">
                <h3 id="gua-name"></h3>
                <p class="judgment" id="gua-judgment"></p>
                <h3>爻辞</h3>
                <div id="gua-lines"></div>
            </div>

            <div class="actions">
                <button class="btn" id="restart-btn">重新起卦</button>
            </div>
        </div>
    </div>

    <script>
        const TIANGAN = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
        const TIANGAN_NUM = { '甲': 1, '乙': 2, '丙': 3, '丁': 4, '戊': 5, '己': 6, '庚': 7, '辛': 8, '壬': 9, '癸': 10 };

        const DIZHI = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
        const DIZHI_NUM = { '子': 1, '丑': 2, '寅': 3, '卯': 4, '辰': 5, '巳': 6, '午': 7, '未': 8, '申': 9, '酉': 10, '戌': 11, '亥': 12 };

        // 八卦：含五行、自然象征、方位
        const BAGUA = [
            { name: '乾', symbol: '☰', lines: ['solid', 'solid', 'solid'], wuxing: '金', nature: '天', direction: '西北', num: 1 },
            { name: '兑', symbol: '☱', lines: ['solid', 'solid', 'broken'], wuxing: '金', nature: '泽', direction: '西', num: 2 },
            { name: '离', symbol: '☲', lines: ['solid', 'broken', 'solid'], wuxing: '火', nature: '火', direction: '南', num: 3 },
            { name: '震', symbol: '☳', lines: ['solid', 'broken', 'broken'], wuxing: '木', nature: '雷', direction: '东', num: 4 },
            { name: '巽', symbol: '☴', lines: ['broken', 'solid', 'solid'], wuxing: '木', nature: '风', direction: '东南', num: 5 },
            { name: '坎', symbol: '☵', lines: ['broken', 'solid', 'broken'], wuxing: '水', nature: '水', direction: '北', num: 6 },
            { name: '艮', symbol: '☶', lines: ['broken', 'broken', 'solid'], wuxing: '土', nature: '山', direction: '东北', num: 7 },
            { name: '坤', symbol: '☷', lines: ['broken', 'broken', 'broken'], wuxing: '土', nature: '地', direction: '西南', num: 8 }
        ];

        // 五行生克关系
        const WUXING_SHENG = { '木': '火', '火': '土', '土': '金', '金': '水', '水': '木' };
        const WUXING_KE = { '木': '土', '土': '水', '水': '火', '火': '金', '金': '木' };

        // 完整64卦数据
        const HEXAGRAMS = [
            { name: '乾为天', upper: '乾', lower: '乾', symbol: '䷀', judgment: '乾：元，亨，利，贞。', lines: ['初九：潜龙，勿用。','九二：见龙在田，利见大人。','九三：君子终日乾乾，夕惕若厉，无咎。','九四：或跃在渊，无咎。','九五：飞龙在天，利见大人。','上九：亢龙，有悔。'] },
            { name: '坤为地', upper: '坤', lower: '坤', symbol: '䷁', judgment: '坤：元，亨，利牝马之贞。君子有攸往，先迷后得主，利。西南得朋，东北丧朋。安贞吉。', lines: ['初六：履霜，坚冰至。','六二：直方大，不习无不利。','六三：含章可贞。或从王事，无成有终。','六四：括囊，无咎无誉。','六五：黄裳，元吉。','上六：龙战于野，其血玄黄。'] },
            { name: '水雷屯', upper: '坎', lower: '震', symbol: '䷂', judgment: '屯：元亨利贞。勿用有攸往，利建侯。', lines: ['初九：磐桓，利居贞，利建侯。','六二：屯如邅如，乘马班如。匪寇婚媾，女子贞不字，十年乃字。','六三：即鹿无虞，惟入于林中。君子几不如舍，往吝。','六四：乘马班如，求婚媾，往吉，无不利。','九五：屯其膏，小贞吉，大贞凶。','上六：乘马班如，泣血涟如。'] },
            { name: '山水蒙', upper: '艮', lower: '坎', symbol: '䷃', judgment: '蒙：亨。匪我求童蒙，童蒙求我。初筮告，再三渎，渎则不告。利贞。', lines: ['初六：发蒙，利用刑人，用说桎梏，以往吝。','九二：包蒙，吉。纳妇，吉。子克家。','六三：勿用取女，见金夫，不有躬，无攸利。','六四：困蒙，吝。','六五：童蒙，吉。','上九：击蒙，不利为寇，利御寇。'] },
            { name: '水天需', upper: '坎', lower: '乾', symbol: '䷄', judgment: '需：有孚，光亨贞吉。利涉大川。', lines: ['初九：需于郊，利用恒，无咎。','九二：需于沙，小有言，终吉。','九三：需于泥，致寇至。','六四：需于血，出自穴。','九五：需于酒食，贞吉。','上六：入于穴，有不速之客三人来，敬之终吉。'] },
            { name: '天水讼', upper: '乾', lower: '坎', symbol: '䷅', judgment: '讼：有孚，窒惕，中吉，终凶。利见大人，不利涉大川。', lines: ['初六：不永所事，小有言，终吉。','九二：不克讼，归而逋，其邑人三百户，无眚。','六三：食旧德，贞厉，终吉。或从王事，无成。','九四：不克讼，复即命渝，安贞吉。','九五：讼，元吉。','上九：或锡之鞶带，终朝三褫之。'] },
            { name: '地水师', upper: '坤', lower: '坎', symbol: '䷆', judgment: '师：贞，丈人吉，无咎。', lines: ['初六：师出以律，否臧凶。','九二：在师中，吉，无咎。王三锡命。','六三：师或舆尸，凶。','六四：师左次，无咎。','六五：田有禽，利执言，无咎。长子帅师，弟子舆尸，贞凶。','上六：大君有命，开国承家，小人勿用。'] },
            { name: '水地比', upper: '坎', lower: '坤', symbol: '䷇', judgment: '比：吉。原筮，元永贞，无咎。不宁方来，后夫凶。', lines: ['初六：有孚比之，无咎。有孚盈缶，终来有它，吉。','六二：比之自内，贞吉。','六三：比之匪人。','六四：外比之，贞吉。','九五：显比，王用三驱，失前禽，邑人不诫，吉。','上六：比之无首，凶。'] },
            { name: '风天小畜', upper: '巽', lower: '乾', symbol: '䷈', judgment: '小畜：亨。密云不雨，自我西郊。', lines: ['初九：复自道，何其咎？吉。','九二：牵复，吉。','九三：舆说辐，夫妻反目。','六四：有孚，血去惕出，无咎。','九五：有孚挛如，富以其邻。','上九：既雨既处，尚德载。妇贞厉。月几望，君子征凶。'] },
            { name: '天泽履', upper: '乾', lower: '兑', symbol: '䷉', judgment: '履：履虎尾，不咥人，亨。', lines: ['初九：素履，往无咎。','九二：履道坦坦，幽人贞吉。','六三：眇能视，跛能履。履虎尾，咥人凶。武人为于大君。','九四：履虎尾，愬愬终吉。','九五：夬履，贞厉。','上九：视履考祥，其旋元吉。'] },
            { name: '地天泰', upper: '坤', lower: '乾', symbol: '䷊', judgment: '泰：小往大来，吉亨。', lines: ['初九：拔茅茹，以其汇，征吉。','九二：包荒，用冯河，不遐遗，朋亡，得尚于中行。','九三：无平不陂，无往不复。艰贞无咎。勿恤其孚，于食有福。','六四：翩翩，不富以其邻，不戒以孚。','六五：帝乙归妹，以祉元吉。','上六：城复于隍，勿用师。自邑告命，贞吝。'] },
            { name: '天地否', upper: '乾', lower: '坤', symbol: '䷋', judgment: '否：否之匪人，不利君子贞。大往小来。', lines: ['初六：拔茅茹，以其汇，贞吉亨。','六二：包承，小人吉，大人否亨。','六三：包羞。','九四：有命无咎，畴离祉。','九五：休否，大人吉。其亡其亡，系于苞桑。','上九：倾否，先否后喜。'] },
            { name: '天火同人', upper: '乾', lower: '离', symbol: '䷌', judgment: '同人：同人于野，亨。利涉大川，利君子贞。', lines: ['初九：同人于门，无咎。','六二：同人于宗，吝。','九三：伏戎于莽，升其高陵，三岁不兴。','九四：乘其墉，弗克攻，吉。','九五：同人先号咷而后笑，大师克相遇。','上九：同人于郊，无悔。'] },
            { name: '火天大有', upper: '离', lower: '乾', symbol: '䷍', judgment: '大有：元亨。', lines: ['初九：无交害，匪咎，艰则无咎。','九二：大车以载，有攸往，无咎。','九三：公用亨于天子，小人弗克。','九四：匪其彭，无咎。','六五：厥孚交如，威如，吉。','上九：自天佑之，吉无不利。'] },
            { name: '地山谦', upper: '坤', lower: '艮', symbol: '䷎', judgment: '谦：亨，君子有终。', lines: ['初六：谦谦君子，用涉大川，吉。','六二：鸣谦，贞吉。','九三：劳谦君子，有终吉。','六四：无不利，撝谦。','六五：不富以其邻，利用侵伐，无不利。','上六：鸣谦，利用行师，征邑国。'] },
            { name: '雷地豫', upper: '震', lower: '坤', symbol: '䷏', judgment: '豫：利建侯行师。', lines: ['初六：鸣豫，凶。','六二：介于石，不终日，贞吉。','六三：盱豫悔，迟有悔。','九四：由豫，大有得。勿疑，朋盍簪。','六五：贞疾，恒不死。','上六：冥豫，成有渝，无咎。'] },
            { name: '泽雷随', upper: '兑', lower: '震', symbol: '䷐', judgment: '随：元亨利贞，无咎。', lines: ['初九：官有渝，贞吉。出门交有功。','六二：系小子，失丈夫。','六三：系丈夫，失小子。随有求得，利居贞。','九四：随有获，贞凶。有孚在道，以明，何咎？','九五：孚于嘉，吉。','上六：拘系之，乃从维之。王用亨于西山。'] },
            { name: '山风蛊', upper: '艮', lower: '巽', symbol: '䷑', judgment: '蛊：元亨，利涉大川。先甲三日，后甲三日。', lines: ['初六：干父之蛊，有子，考无咎。厉终吉。','九二：干母之蛊，不可贞。','九三：干父之蛊，小有悔，无大咎。','六四：裕父之蛊，往见吝。','六五：干父之蛊，用誉。','上九：不事王侯，高尚其事。'] },
            { name: '地泽临', upper: '坤', lower: '兑', symbol: '䷒', judgment: '临：元亨利贞。至于八月有凶。', lines: ['初九：咸临，贞吉。','九二：咸临，吉无不利。','六三：甘临，无攸利。既忧之，无咎。','六四：至临，无咎。','六五：知临，大君之宜，吉。','上六：敦临，吉无咎。'] },
            { name: '风地观', upper: '巽', lower: '坤', symbol: '䷓', judgment: '观：盥而不荐，有孚颙若。', lines: ['初六：童观，小人无咎，君子吝。','六二：窥观，利女贞。','六三：观我生，进退。','六四：观国之光，利用宾于王。','九五：观我生，君子无咎。','上九：观其生，君子无咎。'] },
            { name: '火雷噬嗑', upper: '离', lower: '震', symbol: '䷔', judgment: '噬嗑：亨，利用狱。', lines: ['初九：屦校灭趾，无咎。','六二：噬肤灭鼻，无咎。','六三：噬腊肉遇毒，小吝无咎。','九四：噬干胏，得金矢。利艰贞，吉。','六五：噬干肉，得黄金。贞厉无咎。','上九：何校灭耳，凶。'] },
            { name: '山火贲', upper: '艮', lower: '离', symbol: '䷕', judgment: '贲：亨，小利有攸往。', lines: ['初九：贲其趾，舍车而徒。','六二：贲其须。','九三：贲如濡如，永贞吉。','六四：贲如皤如，白马翰如。匪寇婚媾。','六五：贲于丘园，束帛戋戋。吝，终吉。','上九：白贲，无咎。'] },
            { name: '山地剥', upper: '艮', lower: '坤', symbol: '䷖', judgment: '剥：不利有攸往。', lines: ['初六：剥床以足，蔑贞凶。','六二：剥床以辨，蔑贞凶。','六三：剥之无咎。','六四：剥床以肤，凶。','六五：贯鱼，以宫人宠，无不利。','上九：硕果不食，君子得舆，小人剥庐。'] },
            { name: '地雷复', upper: '坤', lower: '震', symbol: '䷗', judgment: '复：亨。出入无疾，朋来无咎。反复其道，七日来复。利有攸往。', lines: ['初九：不远复，无祗悔，元吉。','六二：休复，吉。','六三：频复，厉无咎。','六四：中行独复。','六五：敦复，无悔。','上六：迷复，凶，有灾眚。用行师，终有大败，以其国君凶，至于十年不克征。'] },
            { name: '天雷无妄', upper: '乾', lower: '震', symbol: '䷘', judgment: '无妄：元亨利贞。其匪正有眚，不利有攸往。', lines: ['初九：无妄，往吉。','六二：不耕获，不菑畬，则利有攸往。','六三：无妄之灾，或系之牛。行人之得，邑人之灾。','九四：可贞无咎。','九五：无妄之疾，勿药有喜。','上九：无妄，行有眚，无攸利。'] },
            { name: '山天大畜', upper: '艮', lower: '乾', symbol: '䷙', judgment: '大畜：利贞。不家食吉。利涉大川。', lines: ['初九：有厉，利已。','九二：舆说輹。','九三：良马逐，利艰贞。曰闲舆卫，利有攸往。','六四：童牛之牿，元吉。','六五：豮豕之牙，吉。','上九：何天之衢，亨。'] },
            { name: '山雷颐', upper: '艮', lower: '震', symbol: '䷚', judgment: '颐：贞吉。观颐，自求口实。', lines: ['初九：舍尔灵龟，观我朵颐，凶。','六二：颠颐，拂经于丘颐，征凶。','六三：拂颐，贞凶。十年勿用，无攸利。','六四：颠颐，吉。虎视眈眈，其欲逐逐，无咎。','六五：拂经，居贞吉。不可涉大川。','上九：由颐，厉吉，利涉大川。'] },
            { name: '泽风大过', upper: '兑', lower: '巽', symbol: '䷛', judgment: '大过：栋桡，利有攸往，亨。', lines: ['初六：藉用白茅，无咎。','九二：枯杨生稊，老夫得其女妻，无不利。','九三：栋桡，凶。','九四：栋隆，吉。有它吝。','九五：枯杨生华，老妇得其士夫，无咎无誉。','上六：过涉灭顶，凶，无咎。'] },
            { name: '坎为水', upper: '坎', lower: '坎', symbol: '䷜', judgment: '习坎：有孚，维心亨，行有尚。', lines: ['初六：习坎，入于坎窞，凶。','九二：坎有险，求小得。','六三：来之坎坎，险且枕，入于坎窞，勿用。','六四：樽酒簋贰，用缶，纳约自牖，终无咎。','九五：坎不盈，祗既平，无咎。','上六：系用徽纆，置于丛棘，三岁不得，凶。'] },
            { name: '离为火', upper: '离', lower: '离', symbol: '䷝', judgment: '离：利贞，亨。畜牝牛，吉。', lines: ['初九：履错然，敬之无咎。','六二：黄离，元吉。','九三：日昃之离，不鼓缶而歌，则大耋之嗟，凶。','九四：突如其来如，焚如，死如，弃如。','六五：出涕沱若，戚嗟若，吉。','上九：王用出征，有嘉折首，获匪其丑，无咎。'] },
            { name: '泽山咸', upper: '兑', lower: '艮', symbol: '䷞', judgment: '咸：亨，利贞。取女吉。', lines: ['初六：咸其拇。','六二：咸其腓，凶，居吉。','九三：咸其股，执其随，往吝。','九四：贞吉悔亡。憧憧往来，朋从尔思。','九五：咸其脢，无悔。','上六：咸其辅颊舌。'] },
            { name: '雷风恒', upper: '震', lower: '巽', symbol: '䷟', judgment: '恒：亨，无咎，利贞。利有攸往。', lines: ['初六：浚恒，贞凶，无攸利。','九二：悔亡。','九三：不恒其德，或承之羞，贞吝。','九四：田无禽。','六五：恒其德，贞。妇人吉，夫子凶。','上六：振恒，凶。'] },
            { name: '天山遁', upper: '乾', lower: '艮', symbol: '䷠', judgment: '遁：亨，小利贞。', lines: ['初六：遁尾，厉。勿用有攸往。','六二：执之用黄牛之革，莫之胜说。','九三：系遁，有疾厉。畜臣妾吉。','九四：好遁，君子吉，小人否。','九五：嘉遁，贞吉。','上九：肥遁，无不利。'] },
            { name: '雷天大壮', upper: '震', lower: '乾', symbol: '䷡', judgment: '大壮：利贞。', lines: ['初九：壮于趾，征凶，有孚。','九二：贞吉。','九三：小人用壮，君子用罔，贞厉。羝羊触藩，羸其角。','九四：贞吉悔亡。藩决不羸，壮于大舆之輹。','六五：丧羊于易，无悔。','上六：羝羊触藩，不能退，不能遂，无攸利。艰则吉。'] },
            { name: '火地晋', upper: '离', lower: '坤', symbol: '䷢', judgment: '晋：康侯用锡马蕃庶，昼日三接。', lines: ['初六：晋如摧如，贞吉。罔孚，裕无咎。','六二：晋如愁如，贞吉。受兹介福，于其王母。','六三：众允，悔亡。','九四：晋如鼫鼠，贞厉。','六五：悔亡，失得勿恤，往吉，无不利。','上九：晋其角，维用伐邑。厉吉无咎，贞吝。'] },
            { name: '地火明夷', upper: '坤', lower: '离', symbol: '䷣', judgment: '明夷：利艰贞。', lines: ['初九：明夷于飞，垂其翼。君子于行，三日不食。有攸往，主人有言。','六二：明夷，夷于左股，用拯马壮，吉。','九三：明夷于南狩，得其大首，不可疾贞。','六四：入于左腹，获明夷之心，于出门庭。','六五：箕子之明夷，利贞。','上六：不明晦，初登于天，后入于地。'] },
            { name: '风火家人', upper: '巽', lower: '离', symbol: '䷤', judgment: '家人：利女贞。', lines: ['初九：闲有家，悔亡。','六二：无攸遂，在中馈，贞吉。','九三：家人嗃嗃，悔厉吉。妇子嘻嘻，终吝。','六四：富家，大吉。','九五：王假有家，勿恤吉。','上九：有孚威如，终吉。'] },
            { name: '火泽睽', upper: '离', lower: '兑', symbol: '䷥', judgment: '睽：小事吉。', lines: ['初九：悔亡。丧马勿逐，自复。见恶人无咎。','九二：遇主于巷，无咎。','六三：见舆曳，其牛掣。其人天且劓，无初有终。','九四：睽孤，遇元夫。交孚，厉无咎。','六五：悔亡，厥宗噬肤，往何咎？','上九：睽孤，见豕负涂，载鬼一车。先张之弧，后说之弧。匪寇婚媾。往遇雨则吉。'] },
            { name: '水山蹇', upper: '坎', lower: '艮', symbol: '䷦', judgment: '蹇：利西南，不利东北。利见大人，贞吉。', lines: ['初六：往蹇，来誉。','六二：王臣蹇蹇，匪躬之故。','九三：往蹇，来反。','六四：往蹇，来连。','九五：大蹇，朋来。','上六：往蹇，来硕，吉。利见大人。'] },
            { name: '雷水解', upper: '震', lower: '坎', symbol: '䷧', judgment: '解：利西南，无所往，其来复吉。有攸往，夙吉。', lines: ['初六：无咎。','九二：田获三狐，得黄矢，贞吉。','六三：负且乘，致寇至，贞吝。','九四：解而拇，朋至斯孚。','六五：君子维有解，吉。有孚于小人。','上六：公用射隼于高墉之上，获之无不利。'] },
            { name: '山泽损', upper: '艮', lower: '兑', symbol: '䷨', judgment: '损：有孚，元吉，无咎，可贞。利有攸往。曷之用？二簋可用享。', lines: ['初九：已事遄往，无咎，酌损之。','九二：利贞，征凶，弗损益之。','六三：三人行则损一人，一人行则得其友。','六四：损其疾，使遄有喜，无咎。','六五：或益之十朋之龟，弗克违，元吉。','上九：弗损益之，无咎。贞吉，利有攸往，得臣无家。'] },
            { name: '风雷益', upper: '巽', lower: '震', symbol: '䷩', judgment: '益：利有攸往，利涉大川。', lines: ['初九：利用为大作，元吉无咎。','六二：或益之十朋之龟，弗克违，永贞吉。王用享于帝吉。','六三：益之用凶事，无咎。有孚中行，告公用圭。','六四：中行，告公从。利用为依迁国。','九五：有孚惠心，勿问元吉。有孚惠我德。','上九：莫益之，或击之，立心勿恒，凶。'] },
            { name: '泽天夬', upper: '兑', lower: '乾', symbol: '䷪', judgment: '夬：扬于王庭，孚号有厉。告自邑，不利即戎。利有攸往。', lines: ['初九：壮于前趾，往不胜为咎。','九二：惕号，莫夜有戎，勿恤。','九三：壮于頄，有凶。君子夬夬，独行遇雨。若濡有愠，无咎。','九四：臀无肤，其行次且。牵羊悔亡，闻言不信。','九五：苋陆夬夬，中行无咎。','上六：无号，终有凶。'] },
            { name: '天风姤', upper: '乾', lower: '巽', symbol: '䷫', judgment: '姤：女壮，勿用取女。', lines: ['初六：系于金柅，贞吉。有攸往，见凶。羸豕孚蹢躅。','九二：包有鱼，无咎，不利宾。','九三：臀无肤，其行次且。厉，无大咎。','九四：包无鱼，起凶。','九五：以杞包瓜，含章，有陨自天。','上九：姤其角，吝，无咎。'] },
            { name: '泽地萃', upper: '兑', lower: '坤', symbol: '䷬', judgment: '萃：亨。王假有庙。利见大人，亨利贞。用大牲吉。利有攸往。', lines: ['初六：有孚不终，乃乱乃萃。若号，一握为笑，勿恤，往无咎。','六二：引吉，无咎。孚乃利用禴。','六三：萃如嗟如，无攸利。往无咎，小吝。','九四：大吉无咎。','九五：萃有位，无咎。匪孚，元永贞，悔亡。','上六：赍咨涕洟，无咎。'] },
            { name: '地风升', upper: '坤', lower: '巽', symbol: '䷭', judgment: '升：元亨，用见大人，勿恤。南征吉。', lines: ['初六：允升，大吉。','九二：孚乃利用禴，无咎。','九三：升虚邑。','六四：王用亨于岐山，吉无咎。','六五：贞吉，升阶。','上六：冥升，利于不息之贞。'] },
            { name: '泽水困', upper: '兑', lower: '坎', symbol: '䷮', judgment: '困：亨，贞，大人吉，无咎。有言不信。', lines: ['初六：臀困于株木，入于幽谷，三岁不觌。','九二：困于酒食，朱绂方来，利用享祀。征凶无咎。','六三：困于石，据于蒺藜。入于其宫，不见其妻，凶。','九四：来徐徐，困于金车，吝，有终。','九五：劓刖，困于赤绂，乃徐有说，利用祭祀。','上六：困于葛藟，于臲卼，曰动悔。有悔，征吉。'] },
            { name: '水风井', upper: '坎', lower: '巽', symbol: '䷯', judgment: '井：改邑不改井，无丧无得，往来井井。汔至亦未繘井，羸其瓶，凶。', lines: ['初六：井泥不食，旧井无禽。','九二：井谷射鲋，瓮敝漏。','九三：井渫不食，为我心恻。可用汲，王明并受其福。','六四：井甃无咎。','九五：井冽，寒泉食。','上六：井收勿幕，有孚元吉。'] },
            { name: '泽火革', upper: '兑', lower: '离', symbol: '䷰', judgment: '革：已日乃孚。元亨利贞，悔亡。', lines: ['初九：巩用黄牛之革。','六二：已日乃革之，征吉，无咎。','九三：征凶，贞厉。革言三就，有孚。','九四：悔亡，有孚改命，吉。','九五：大人虎变，未占有孚。','上六：君子豹变，小人革面。征凶，居贞吉。'] },
            { name: '火风鼎', upper: '离', lower: '巽', symbol: '䷱', judgment: '鼎：元吉，亨。', lines: ['初六：鼎颠趾，利出否。得妾以其子，无咎。','九二：鼎有实，我仇有疾，不我能即，吉。','九三：鼎耳革，其行塞，雉膏不食。方雨亏悔，终吉。','九四：鼎折足，覆公餗，其形渥，凶。','六五：鼎黄耳金铉，利贞。','上九：鼎玉铉，大吉，无不利。'] },
            { name: '震为雷', upper: '震', lower: '震', symbol: '䷲', judgment: '震：亨。震来虩虩，笑言哑哑。震惊百里，不丧匕鬯。', lines: ['初九：震来虩虩，后笑言哑哑，吉。','六二：震来厉，亿丧贝。跻于九陵，勿逐，七日得。','六三：震苏苏，震行无眚。','九四：震遂泥。','六五：震往来厉，亿无丧，有事。','上六：震索索，视矍矍，征凶。震不于其躬，于其邻，无咎。婚媾有言。'] },
            { name: '艮为山', upper: '艮', lower: '艮', symbol: '䷳', judgment: '艮：艮其背，不获其身。行其庭，不见其人。无咎。', lines: ['初六：艮其趾，无咎，利永贞。','六二：艮其腓，不拯其随，其心不快。','九三：艮其限，列其夤，厉薰心。','六四：艮其身，无咎。','六五：艮其辅，言有序，悔亡。','上九：敦艮，吉。'] },
            { name: '风山渐', upper: '巽', lower: '艮', symbol: '䷴', judgment: '渐：女归吉，利贞。', lines: ['初六：鸿渐于干，小子厉有言，无咎。','六二：鸿渐于磐，饮食衎衎，吉。','九三：鸿渐于陆，夫征不复，妇孕不育，凶。利御寇。','六四：鸿渐于木，或得其桷，无咎。','九五：鸿渐于陵，妇三岁不孕，终莫之胜，吉。','上九：鸿渐于逵，其羽可用为仪，吉。'] },
            { name: '雷泽归妹', upper: '震', lower: '兑', symbol: '䷵', judgment: '归妹：征凶，无攸利。', lines: ['初九：归妹以娣，跛能履，征吉。','九二：眇能视，利幽人之贞。','六三：归妹以须，反归以娣。','九四：归妹愆期，迟归有时。','六五：帝乙归妹，其君之袂不如其娣之袂良。月几望，吉。','上六：女承筐无实，士刲羊无血，无攸利。'] },
            { name: '雷火丰', upper: '震', lower: '离', symbol: '䷶', judgment: '丰：亨，王假之，勿忧，宜日中。', lines: ['初九：遇其配主，虽旬无咎，往有尚。','六二：丰其蔀，日中见斗，往得疑疾。有孚发若，吉。','九三：丰其沛，日中见沬。折其右肱，无咎。','九四：丰其蔀，日中见斗，遇其夷主，吉。','六五：来章，有庆誉，吉。','上六：丰其屋，蔀其家。窥其户，阒其无人，三岁不觌，凶。'] },
            { name: '火山旅', upper: '离', lower: '艮', symbol: '䷷', judgment: '旅：小亨，旅贞吉。', lines: ['初六：旅琐琐，斯其所取灾。','六二：旅即次，怀其资，得童仆贞。','九三：旅焚其次，丧其童仆，贞厉。','九四：旅于处，得其资斧，我心不快。','六五：射雉，一矢亡，终以誉命。','上九：鸟焚其巢，旅人先笑后号咷。丧牛于易，凶。'] },
            { name: '巽为风', upper: '巽', lower: '巽', symbol: '䷸', judgment: '巽：小亨，利有攸往，利见大人。', lines: ['初六：进退，利武人之贞。','九二：巽在床下，用史巫纷若，吉无咎。','九三：频巽，吝。','六四：悔亡，田获三品。','九五：贞吉悔亡，无不利。无初有终。先庚三日，后庚三日，吉。','上九：巽在床下，丧其资斧，贞凶。'] },
            { name: '兑为泽', upper: '兑', lower: '兑', symbol: '䷹', judgment: '兑：亨，利贞。', lines: ['初九：和兑，吉。','九二：孚兑，吉，悔亡。','六三：来兑，凶。','九四：商兑未宁，介疾有喜。','九五：孚于剥，有厉。','上六：引兑。'] },

        function initCanvasBg() {
            const canvas = document.getElementById('canvas-bg');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const particleCount = 80;

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 1.5 + 0.5,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    opacity: Math.random() * 0.3 + 0.08
                });
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 120) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(184, 155, 74, ${0.04 * (1 - dist / 120)})`;
                            ctx.stroke();
                        }
                    }
                }

                particles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(184, 155, 74, ${p.opacity})`;
                    ctx.fill();

                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                });

                requestAnimationFrame(draw);
            }

            draw();

            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        }

        function createTrigrams() {
            trigramContainer.innerHTML = '';
            const centerX = 190;
            const centerY = 190;
            const radius = 130;
            
            BAGUA.forEach((trigram, index) => {
                const angle = (index * 45 - 90) * Math.PI / 180;
                const x = centerX + radius * Math.cos(angle) - 30;
                const y = centerY + radius * Math.sin(angle) - 30;
                
                const trigramEl = document.createElement('div');
                trigramEl.className = 'trigram';
                trigramEl.style.left = `${x}px`;
                trigramEl.style.top = `${y}px`;
                
                trigram.lines.forEach(lineType => {
                    const line = document.createElement('div');
                    line.className = `trigram-line ${lineType}`;
                    trigramEl.appendChild(line);
                });
                
                const name = document.createElement('div');
                name.className = 'trigram-name';
                name.textContent = trigram.name;
                trigramEl.appendChild(name);
                
                trigramContainer.appendChild(trigramEl);
            });
        }

        // 根据上下卦名称精确查找卦象
        function findHexagram(upperName, lowerName) {
            const found = HEXAGRAMS.find(h => h.upper === upperName && h.lower === lowerName);
            return found || HEXAGRAMS[0];
        }

        // 计算互卦：二三四爻为下互卦，三四五爻为上互卦
        function getHugua(lowerTrigram, upperTrigram) {
            const allLines = [...lowerTrigram.lines, ...upperTrigram.lines];
            const huLowerLines = allLines.slice(1, 4);  // 2,3,4爻
            const huUpperLines = allLines.slice(2, 5);  // 3,4,5爻

            const huLower = BAGUA.find(g =>
                g.lines[0] === huLowerLines[0] &&
                g.lines[1] === huLowerLines[1] &&
                g.lines[2] === huLowerLines[2]
            ) || BAGUA[0];

            const huUpper = BAGUA.find(g =>
                g.lines[0] === huUpperLines[0] &&
                g.lines[1] === huUpperLines[1] &&
                g.lines[2] === huUpperLines[2]
            ) || BAGUA[0];

            return { lower: huLower, upper: huUpper, hexagram: findHexagram(huUpper.name, huLower.name) };
        }

        // 计算变卦：动爻所在的卦，爻变化后形成新卦
        function getBiangua(upperTrigram, lowerTrigram, changingLine) {
            const allLines = [...lowerTrigram.lines, ...upperTrigram.lines];

            // 动爻翻转（solid↔broken, 0-indexed）
            const flip = (t) => t === 'solid' ? 'broken' : 'solid';
            allLines[changingLine] = flip(allLines[changingLine]);

            const newLowerLines = allLines.slice(0, 3);
            const newUpperLines = allLines.slice(3, 6);

            const newLower = BAGUA.find(g =>
                g.lines[0] === newLowerLines[0] &&
                g.lines[1] === newLowerLines[1] &&
                g.lines[2] === newLowerLines[2]
            ) || BAGUA[0];

            const newUpper = BAGUA.find(g =>
                g.lines[0] === newUpperLines[0] &&
                g.lines[1] === newUpperLines[1] &&
                g.lines[2] === newUpperLines[2]
            ) || BAGUA[0];

            return {
                upper: newUpper, lower: newLower,
                hexagram: findHexagram(newUpper.name, newLower.name),
                changedUpper: changingLine >= 3,
                changedLower: changingLine < 3
            };
        }

        // 体用生克分析
        function tiyongAnalysis(upperTrigram, lowerTrigram, changingLine) {
            // 动爻在上卦(爻位4-6)，则体卦为下卦（不动），用卦为上卦（动）
            // 动爻在下卦(爻位0-2)，则体卦为上卦，用卦为下卦
            const tiGua = changingLine >= 3 ? lowerTrigram : upperTrigram;
            const yongGua = changingLine >= 3 ? upperTrigram : lowerTrigram;

            const tiWx = tiGua.wuxing;
            const yongWx = yongGua.wuxing;

            let relation = '';
            let result = '';
            let resultClass = 'ping';
            let detail = '';

            if (WUXING_SHENG[yongWx] === tiWx) {
                relation = `${yongWx}生${tiWx}`;
                result = '用生体 · 大吉';
                resultClass = 'ji';
                detail = `用卦${yongGua.name}(${yongWx})生体卦${tiGua.name}(${tiWx})。外事生助自身，谋事可成，百事顺利。`;
            } else if (WUXING_SHENG[tiWx] === yongWx) {
                relation = `${tiWx}生${yongWx}`;
                result = '体生用 · 小耗';
                resultClass = 'ping';
                detail = `体卦${tiGua.name}(${tiWx})生用卦${yongGua.name}(${yongWx})。自身耗散于外事，劳心费力，虽无大害亦无大利。`;
            } else if (WUXING_KE[yongWx] === tiWx) {
                relation = `${yongWx}克${tiWx}`;
                result = '用克体 · 大凶';
                resultClass = 'xiong';
                detail = `用卦${yongGua.name}(${yongWx})克体卦${tiGua.name}(${tiWx})。外事克制自身，所求难遂，需谨慎行事。`;
            } else if (WUXING_KE[tiWx] === yongWx) {
                relation = `${tiWx}克${yongWx}`;
                result = '体克用 · 小吉';
                resultClass = 'ji';
                detail = `体卦${tiGua.name}(${tiWx})克用卦${yongGua.name}(${yongWx})。自身克制外事，可得控制，事虽可成却费力。`;
            } else {
                relation = `${tiWx}与${yongWx}比和`;
                result = '体用比和 · 大吉';
                resultClass = 'ji';
                detail = `体卦${tiGua.name}(${tiWx})与用卦${yongGua.name}(${yongWx})五行相同，体用和谐，顺风顺水，诸事大利。`;
            }

            return { tiGua, yongGua, relation, result, resultClass, detail };
        }

        function divinate() {
            const tiangan = tianganSelect.value;
            const dizhi = dizhiSelect.value;
            const tNum = TIANGAN_NUM[tiangan];
            const dNum = DIZHI_NUM[dizhi];

            // 手动模式下直接从输入框取值
            let n1, n2, n3;
            if (stringMode) {
                const parsed = parseDigitString(digitString.value.trim());
                if (!parsed) return;
                n1 = parsed[0]; n2 = parsed[1]; n3 = parsed[2];
            } else if (manualMode) {
                n1 = parseInt(input1.value); n2 = parseInt(input2.value); n3 = parseInt(input3.value);
            } else {
                n1 = numbers[0]; n2 = numbers[1]; n3 = numbers[2];
            }

            // 梅花易数规则：余0→8(坤)，余1→1(乾)... 除6余0→第6爻
            const upperRem = (tNum + dNum + n1) % 8;
            const lowerRem = (tNum + dNum + n2) % 8;
            const changeRem = (tNum + dNum + n3) % 6;
            const upperIndex = upperRem === 0 ? 7 : upperRem - 1;
            const lowerIndex = lowerRem === 0 ? 7 : lowerRem - 1;
            const changingLine = changeRem === 0 ? 5 : changeRem - 1;

            const upperTrigram = BAGUA[upperIndex];
            const lowerTrigram = BAGUA[lowerIndex];

            // 精确查找卦象（按上下卦名称匹配）
            const hexagram = findHexagram(upperTrigram.name, lowerTrigram.name);

            // 计算互卦
            const hugua = getHugua(lowerTrigram, upperTrigram);

            // 计算变卦
            const biangua = getBiangua(upperTrigram, lowerTrigram, changingLine);

            // 体用生克分析
            const tiyong = tiyongAnalysis(upperTrigram, lowerTrigram, changingLine);

            inputPhase.classList.add('hidden');
            resultPhase.classList.remove('hidden');
            interpretation.classList.remove('show');
            document.getElementById('three-gua-card').style.display = 'block';
            document.getElementById('tiyong-card').style.display = 'block';

            trigramContainer.classList.add('rotating');

            setTimeout(() => {
                trigramContainer.classList.remove('rotating');
                displayResult(hexagram, hugua, biangua, tiyong, changingLine);
            }, 4000);
        }

        // 解析数字串 → [天数, 地数, 人数]
        function parseDigitString(str) {
            const digits = str.replace(/\D/g, '');
            const len = digits.length;
            if (len === 0) return null;

            let tian, di, ren;
            if (len === 1) {
                tian = parseInt(digits); di = tian; ren = tian;
            } else if (len === 2) {
                tian = parseInt(digits[0]); di = parseInt(digits[1]);
                ren = tian + di;
            } else if (len === 3) {
                tian = parseInt(digits[0]); di = parseInt(digits[1]); ren = parseInt(digits[2]);
            } else if (len === 4) {
                // 方法一：前两位上卦，后两位下卦，四位和求动爻
                tian = parseInt(digits.substring(0, 2));
                di = parseInt(digits.substring(2, 4));
                ren = parseInt(digits[0]) + parseInt(digits[1]) + parseInt(digits[2]) + parseInt(digits[3]);
            } else {
                // 5位以上：均分三组，每组求和
                const n = digits.length;
                const groupSize = Math.ceil(n / 3);
                const g1 = digits.substring(0, groupSize);
                const g2 = digits.substring(groupSize, groupSize * 2);
                const g3 = digits.substring(groupSize * 2);
                tian = g1.split('').reduce((s, c) => s + parseInt(c), 0);
                di = g2.split('').reduce((s, c) => s + parseInt(c), 0);
                ren = g3.split('').reduce((s, c) => s + parseInt(c), 0);
            }
            return [tian, di, ren, digits.length];
        }

        // 数字串输入实时预览
        function updateDigitPreview() {
            const val = digitString.value.trim();
            const parsed = parseDigitString(val);
            const previewEl = digitPreview;
            if (parsed && val.length >= 1) {
                previewEl.textContent = `→ 天数${parsed[0]}  地数${parsed[1]}  人数${parsed[2]}  (共${parsed[3]}位)`;
                previewEl.classList.add('ready');
                numbersGenerated = true;
            } else {
                previewEl.textContent = val.length > 0 ? '请输入数字' : '';
                previewEl.classList.remove('ready');
                numbersGenerated = false;
            }
            divinateBtn.disabled = !numbersGenerated;
        }

        // 子模式切换：三数独立 ↔ 数字串
        function switchSubMode(isString) {
            stringMode = isString;
            if (isString) {
                separateInputs.classList.add('hidden');
                stringInputArea.classList.remove('hidden');
                subModeSeparate.classList.remove('active');
                subModeString.classList.add('active');
                digitString.focus();
                numbersGenerated = false;
                digitPreview.textContent = '';
                digitPreview.classList.remove('ready');
            } else {
                stringInputArea.classList.add('hidden');
                separateInputs.classList.remove('hidden');
                subModeString.classList.remove('active');
                subModeSeparate.classList.add('active');
                numbersGenerated = false;
            }
            divinateBtn.disabled = true;
        }

        // 模式切换（自动 ↔ 手动）
        function switchMode() {
            manualMode = modeToggle.checked;
            if (manualMode) {
                autoModeArea.classList.add('hidden');
                manualModeArea.classList.remove('hidden');
                generateBtn.textContent = '确认输入';
                generateBtn.disabled = false;
                modeLabels[0].classList.remove('active');
                modeLabels[1].classList.add('active');
                // 重置子模式
                switchSubMode(false);
                subModeSeparate.classList.add('active');
                subModeString.classList.remove('active');
                separateInputs.classList.remove('hidden');
                stringInputArea.classList.add('hidden');
                numbersGenerated = false;
            } else {
                manualModeArea.classList.add('hidden');
                autoModeArea.classList.remove('hidden');
                generateBtn.textContent = '生成数字';
                modeLabels[0].classList.add('active');
                modeLabels[1].classList.remove('active');
                divinateBtn.disabled = !numbersGenerated;
            }
        }

        function validateInputs() {
            if (stringMode) {
                return parseDigitString(digitString.value.trim()) !== null;
            }
            const v1 = parseInt(input1.value);
            const v2 = parseInt(input2.value);
            const v3 = parseInt(input3.value);
            return !isNaN(v1) && v1 > 0 && !isNaN(v2) && v2 > 0 && !isNaN(v3) && v3 > 0;
        }

        function handleGenerateClick() {
            if (manualMode) {
                if (stringMode) {
                    const parsed = parseDigitString(digitString.value.trim());
                    if (!parsed) {
                        alert('请输入至少一位数字');
                        return;
                    }
                    numbers = [parsed[0], parsed[1], parsed[2]];
                    num1El.textContent = numbers[0];
                    num2El.textContent = numbers[1];
                    num3El.textContent = numbers[2];
                } else {
                    if (!validateInputs()) {
                        alert('请在天数、地数、人数中分别输入大于0的整数');
                        return;
                    }
                    numbers = [parseInt(input1.value), parseInt(input2.value), parseInt(input3.value)];
                    num1El.textContent = numbers[0];
                    num2El.textContent = numbers[1];
                    num3El.textContent = numbers[2];
                }
                [num1El, num2El, num3El].forEach(el => el.classList.add('ready'));
                numbersGenerated = true;
                divinateBtn.disabled = false;
            } else {
                animateNumbers();
            }
        }

        function handleInputChange() {
            if (stringMode) {
                updateDigitPreview();
            } else {
                divinateBtn.disabled = !validateInputs();
                numbersGenerated = validateInputs();
            }
        }

        initCanvasBg();
        createTrigrams();

        modeToggle.addEventListener('change', switchMode);
        subModeSeparate.addEventListener('click', () => switchSubMode(false));
        subModeString.addEventListener('click', () => switchSubMode(true));
        generateBtn.addEventListener('click', handleGenerateClick);
        divinateBtn.addEventListener('click', divinate);
        restartBtn.addEventListener('click', reset);
        input1.addEventListener('input', handleInputChange);
        input2.addEventListener('input', handleInputChange);
        input3.addEventListener('input', handleInputChange);
        digitString.addEventListener('input', handleInputChange);

        // 回车键快速起卦
        [input1, input2, input3].forEach(inp => {
            inp.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && validateInputs()) {
                    divinate();
                }
            });
        });
        digitString.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && validateInputs()) {
                divinate();
            }
        });
    </script>
</body>
</html>
