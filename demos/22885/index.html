<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>一隅 · AI 情绪疗愈</title>
<style>
:root{
  --ink:#3a3f4b; --ink-soft:#6b7280; --ink-faint:#9aa1ac;
  --paper:#f4f1ec; --paper-2:#ebe6df; --line:rgba(58,63,75,.08);
  --shadow:0 18px 50px -20px rgba(40,44,55,.35);
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font); color:var(--ink);
  background:#d9d4cc; display:flex; align-items:center; justify-content:center;
  min-height:100vh; padding:24px; -webkit-font-smoothing:antialiased;
}
/* phone frame */
.phone{
  position:relative; width:390px; height:844px; max-height:96vh;
  background:var(--paper); border-radius:46px; overflow:hidden;
  box-shadow:var(--shadow); display:flex; flex-direction:column;
}
.phone::before{ /* notch */
  content:""; position:absolute; top:14px; left:50%; transform:translateX(-50%);
  width:120px; height:26px; background:#1c1f26; border-radius:16px; z-index:50;
}
.statusbar{
  height:50px; flex:none; display:flex; align-items:center; justify-content:space-between;
  padding:0 30px; font-size:13px; font-weight:600; color:var(--ink); letter-spacing:.3px;
}
.screen{ flex:1; position:relative; overflow:hidden; }
.view{
  position:absolute; top:0; left:0; right:0; bottom:0; height:100%;
  display:flex; flex-direction:column;
  opacity:0; transform:translateX(20px); pointer-events:none;
  transition:opacity .5s ease, transform .5s ease;
}
.view.active{ opacity:1; transform:none; pointer-events:auto; }

/* ===== OPENING ===== */
#opening{ align-items:stretch; justify-content:space-between; text-align:center; padding:0 40px; position:relative;
  background:
    radial-gradient(120% 80% at 30% 20%, #eef0ef 0%, transparent 55%),
    radial-gradient(120% 90% at 80% 75%, #e7e1ef 0%, transparent 55%),
    linear-gradient(160deg,#f4f1ec,#ece7f1);
}
.op-hero{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.op-foot{ flex:none; display:flex; flex-direction:column; align-items:center; padding-bottom:56px; }

}
#opening > *{ position:relative; z-index:1; }
.brand-mark{
  width:96px; height:96px; border-radius:30px; margin-bottom:30px;
  background:linear-gradient(145deg,#cdd6e8,#e9d9e6 60%,#f0e7da);
  box-shadow:0 16px 40px -14px rgba(120,110,140,.55), inset 0 2px 6px rgba(255,255,255,.7);
  display:flex; align-items:center; justify-content:center; position:relative;
  animation:floaty 6s ease-in-out infinite;
}
.brand-mark span{ font-size:40px; font-weight:300; color:#5a5566; letter-spacing:2px; }
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.brand-name{ font-size:38px; font-weight:600; letter-spacing:8px; color:#4a4754; }
.brand-tag{ margin-top:14px; font-size:15px; color:var(--ink-soft); letter-spacing:1px; line-height:1.9; }
.enter-btn{
  margin-top:48px; padding:16px 44px; border:none; border-radius:40px;
  background:rgba(58,63,75,.9); color:#f4f1ec; font-size:16px; letter-spacing:3px;
  font-family:var(--font); cursor:pointer; transition:transform .25s, box-shadow .25s;
  box-shadow:0 12px 30px -10px rgba(40,44,55,.6);
}
.enter-btn:active{ transform:scale(.96); }
.enter-hint{ margin-top:20px; font-size:12px; color:var(--ink-faint); letter-spacing:2px; }

/* ===== CONFIDE ===== */
#confide{ padding:24px 26px; }
.head{ margin:8px 0 4px; }
.head h2{ font-size:24px; font-weight:600; color:#41404b; letter-spacing:1px; }
.head p{ margin-top:8px; font-size:13px; color:var(--ink-soft); line-height:1.8; }
.field{
  margin-top:22px; flex:none; background:#fff; border:1px solid var(--line);
  border-radius:22px; padding:18px; box-shadow:0 8px 24px -16px rgba(40,44,55,.4);
}
.field textarea{
  width:100%; min-height:150px; border:none; outline:none; resize:none;
  font-family:var(--font); font-size:16px; line-height:1.9; color:var(--ink);
  background:transparent;
}
.field textarea::placeholder{ color:var(--ink-faint); }
.chips-label{ margin:24px 0 12px; font-size:12px; color:var(--ink-faint); letter-spacing:2px; }
.chips{ display:flex; flex-wrap:wrap; gap:10px; }
.chip{
  padding:9px 16px; border-radius:30px; background:#fff; border:1px solid var(--line);
  font-size:13px; color:var(--ink-soft); cursor:pointer; transition:.2s;
}
.chip:active{ transform:scale(.95); background:var(--paper-2); }
.gen-btn{
  margin-top:auto; padding:17px; border:none; border-radius:24px; cursor:pointer;
  background:linear-gradient(135deg,#5a5566,#3a3f4b); color:#f4f1ec;
  font-size:16px; letter-spacing:4px; font-family:var(--font);
  box-shadow:0 14px 32px -12px rgba(40,44,55,.7); transition:transform .2s;
}
.gen-btn:active{ transform:scale(.97); }
.gen-btn:disabled{ opacity:.4; }
.back{
  position:absolute; top:14px; left:20px; width:38px; height:38px; z-index:20;
  border:none; border-radius:50%; background:rgba(255,255,255,.7); cursor:pointer;
  font-size:18px; color:var(--ink); display:flex; align-items:center; justify-content:center;
}

/* ===== GENERATING ===== */
#generating{ align-items:center; justify-content:center; text-align:center; gap:30px;
  background:linear-gradient(160deg,#f4f1ec,#e9e4ef); }
.orb{
  width:140px; height:140px; border-radius:50%;
  background:conic-gradient(from 0deg,#cdd6e8,#e9d9e6,#f0e7da,#cdd6e8);
  filter:blur(2px); animation:spin 3s linear infinite, pulse 2s ease-in-out infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.gen-text{ font-size:15px; color:var(--ink-soft); letter-spacing:2px; animation:fade 2s ease-in-out infinite; }
@keyframes fade{0%,100%{opacity:.4}50%{opacity:1}}

/* ===== RESULT (情绪色彩卡) ===== */
#result{ padding:24px 26px; align-items:center; overflow-y:auto; }
.result-date{ margin-top:26px; font-size:12px; color:var(--ink-faint); letter-spacing:3px; }
.mood-card{
  margin-top:18px; width:100%; aspect-ratio:3/4.1; border-radius:28px; position:relative;
  overflow:hidden; box-shadow:0 24px 60px -22px rgba(40,44,55,.55);
  display:flex; flex-direction:column; justify-content:flex-end; padding:30px;
  color:#fff;
}
.mood-card .grad{ position:absolute; inset:0; z-index:0; animation:flow 12s ease-in-out infinite; }
@keyframes flow{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.15) rotate(6deg)}}
.mood-card .veil{ position:absolute; inset:0; z-index:1;
  background:linear-gradient(to top,rgba(0,0,0,.34),transparent 55%); }
.mood-card .kw{ position:relative; z-index:2; font-size:13px; letter-spacing:5px;
  opacity:.9; margin-bottom:14px; }
.mood-card .poem{ position:relative; z-index:2; font-size:22px; line-height:1.95;
  font-weight:500; letter-spacing:1.5px; text-shadow:0 2px 12px rgba(0,0,0,.25); }
.mood-card .sig{ position:relative; z-index:2; margin-top:20px; font-size:12px;
  letter-spacing:2px; opacity:.75; }
.result-actions{ display:flex; gap:14px; margin-top:24px; width:100%; }
.act{
  flex:1; padding:15px; border-radius:18px; border:1px solid var(--line); cursor:pointer;
  font-family:var(--font); font-size:14px; letter-spacing:1px; transition:transform .2s;
}
.act:active{ transform:scale(.97); }
.act.ghost{ background:#fff; color:var(--ink-soft); }
.act.solid{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

/* ===== WALL (我的一隅) ===== */
#wall{ padding:24px 26px; }
.wall-head{ margin:30px 0 6px; }
.wall-head h2{ font-size:24px; font-weight:600; letter-spacing:1px; }
.wall-head p{ margin-top:8px; font-size:13px; color:var(--ink-soft); line-height:1.7; }
.grid{ margin-top:22px; display:grid; grid-template-columns:1fr 1fr; gap:14px;
  overflow-y:auto; padding-bottom:20px; align-content:start; }
.tile{ aspect-ratio:3/4; border-radius:18px; overflow:hidden; position:relative;
  box-shadow:0 12px 30px -16px rgba(40,44,55,.5); display:flex; flex-direction:column;
  justify-content:flex-end; padding:14px; color:#fff; cursor:pointer; }
.tile .g{ position:absolute; inset:0; z-index:0; }
.tile .t-kw{ position:relative; z-index:1; font-size:11px; letter-spacing:2px; opacity:.95;
  text-shadow:0 1px 6px rgba(0,0,0,.3); }
.tile .t-date{ position:relative; z-index:1; font-size:10px; opacity:.8; margin-top:4px; }
.tabbar{ flex:none; height:62px; display:flex; border-top:1px solid var(--line);
  background:rgba(244,241,236,.9); }
.tab{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; font-size:11px; color:var(--ink-faint); cursor:pointer; letter-spacing:1px; }
.tab.on{ color:var(--ink); font-weight:600; }
.tab i{ font-size:18px; font-style:normal; }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span>一隅</span><span>● ● ●</span></div>
  <div class="screen">

    <!-- OPENING -->
    <section class="view active" id="opening">
      <div class="op-hero">
        <div class="brand-mark"><span>隅</span></div>
        <h1 class="brand-name">一隅</h1>
        <p class="brand-tag">把说不清的心情<br>安放在一个温柔的角落</p>
      </div>
      <div class="op-foot">
        <button class="enter-btn" onclick="goto('confide')">今天，想说点什么</button>
        <p class="enter-hint">AI 会听懂你，并为你写下今天</p>
      </div>
    </section>

    <!-- CONFIDE -->
    <section class="view" id="confide">
      <button class="back" onclick="goto('opening')">‹</button>
      <div class="head" style="margin-top:30px">
        <h2>此刻，你心里在想什么</h2>
        <p>不用组织语言，想到什么写什么。<br>说完，我会把它变成一张只属于你的色彩诗签。</p>
      </div>
      <div class="field">
        <textarea id="moodInput" placeholder="比如：今天好像有点说不上来的累，事情一件接一件，连喘口气的空都没有……"></textarea>
      </div>
      <p class="chips-label">或者，从这里开始</p>
      <div class="chips" id="chips"></div>
      <button class="gen-btn" onclick="generate()">生成我的色彩</button>
    </section>

    <!-- GENERATING -->
    <section class="view" id="generating">
      <div class="orb"></div>
      <p class="gen-text" id="genText">正在读懂你的心情…</p>
    </section>

    <!-- RESULT -->
    <section class="view" id="result">
      <button class="back" onclick="goto('confide')">‹</button>
      <p class="result-date" id="rDate">2026 · 06 · 16</p>
      <div class="mood-card" id="moodCard">
        <div class="grad" id="rGrad"></div>
        <div class="veil"></div>
        <div class="kw" id="rKw">情绪</div>
        <div class="poem" id="rPoem">诗签</div>
        <div class="sig">— 一隅 · 为你写下今天</div>
      </div>
      <div class="result-actions">
        <button class="act ghost" onclick="goto('confide')">再写一张</button>
        <button class="act solid" onclick="saveAndWall()">收进我的一隅</button>
      </div>
    </section>

    <!-- WALL -->
    <section class="view" id="wall">
      <div class="wall-head">
        <h2>我的一隅</h2>
        <p id="wallSub">你已经安放了 4 种心情。<br>每一块颜色，都是某一天的你。</p>
      </div>
      <div class="grid" id="grid"></div>
    </section>

  </div>

  <!-- TABBAR -->
  <div class="tabbar">
    <div class="tab on" id="tab-confide" onclick="goto('confide')"><i>✎</i><span>倾诉</span></div>
    <div class="tab" id="tab-wall" onclick="openWall()"><i>❒</i><span>我的一隅</span></div>
  </div>
</div>
<script>
/* ============ 情绪引擎（Demo 用关键词模拟，正式版接 AI） ============ */
const MOODS = {
  anxious:{
    kw:["压力","焦虑","烦","累","崩溃","忙","急","乱","赶","催","失眠","睡不着","头疼"],
    label:"焦灼",
    grad:"radial-gradient(120% 100% at 30% 20%,#7b3b52,transparent 60%),radial-gradient(120% 120% at 75% 80%,#3a4a78,transparent 55%),linear-gradient(150deg,#5a2f48,#27345e)",
    poems:[
      "风把一切吹得太快，<br>而你，允许自己慢一拍。",
      "再满的杯子，<br>也能先放下一会儿。",
      "今天的乱，<br>不必今天就理清。"
    ]
  },
  calm:{
    kw:["还好","平静","放松","不错","安静","平淡","正常","稳","舒服"],
    label:"澄澈",
    grad:"radial-gradient(120% 100% at 30% 25%,#7fb3a3,transparent 60%),radial-gradient(120% 120% at 80% 80%,#9cc6c9,transparent 55%),linear-gradient(150deg,#6fa896,#acd0cf)",
    poems:[
      "没有大事发生，<br>本身就是一种温柔。",
      "水面很静，<br>你也可以这样待一会儿。",
      "平淡的今天，<br>正稳稳地接住你。"
    ]
  },
  low:{
    kw:["低落","难过","空","孤独","疲惫","委屈","想哭","没意思","丧","无力","失望"],
    label:"低回",
    grad:"radial-gradient(120% 100% at 35% 25%,#4b4668,transparent 60%),radial-gradient(120% 120% at 75% 80%,#2e3a52,transparent 55%),linear-gradient(160deg,#3b3556,#222b3f)",
    poems:[
      "天黑下来的时候，<br>你也在好好地，撑着。",
      "难过不必有理由，<br>它来了，我陪你坐一会儿。",
      "空一点没关系，<br>留白也是一种存在。"
    ]
  },
  happy:{
    kw:["开心","释然","轻松","期待","好","高兴","满足","幸福","顺","惊喜","美好","治愈"],
    label:"明朗",
    grad:"radial-gradient(120% 100% at 30% 20%,#f0b56a,transparent 60%),radial-gradient(120% 120% at 80% 80%,#e89aa6,transparent 55%),linear-gradient(150deg,#f2c07d,#e79bb0)",
    poems:[
      "今天的光，<br>值得你多停留一秒。",
      "好心情很轻，<br>但足以托起一整天。",
      "把这份明亮，<br>悄悄收进口袋里。"
    ]
  },
  default:{
    kw:[],
    label:"微光",
    grad:"radial-gradient(120% 100% at 30% 25%,#b7aec9,transparent 60%),radial-gradient(120% 120% at 80% 80%,#cdbfae,transparent 55%),linear-gradient(150deg,#a89fbe,#cabfb0)",
    poems:[
      "说不清的情绪，<br>也是一种真实的此刻。",
      "无论今天怎样，<br>你来过这里，就够了。",
      "把心交给颜色，<br>它替你说出口。"
    ]
  }
};

const CHIP_SAMPLES = ["最近压力很大","说不上来的烦","今天还不错","有点低落","好像被治愈了"];

function detect(text){
  if(!text || !text.trim()) return "default";
  let best="default", score=0;
  for(const key in MOODS){
    let s=0;
    for(const w of MOODS[key].kw){ if(text.includes(w)) s++; }
    if(s>score){ score=s; best=key; }
  }
  return best;
}
function pick(arr,seed){ return arr[Math.abs(seed)%arr.length]; }
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;} return h; }

/* ============ 视图切换 ============ */
function goto(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('tab-confide').classList.toggle('on', id==='confide'||id==='result'||id==='generating');
  document.getElementById('tab-wall').classList.toggle('on', id==='wall');
}

/* ============ 生成流程 ============ */
const GEN_STEPS=["正在读懂你的心情…","感受字里行间的温度…","为你调一种颜色…","写下今天的诗签…"];
let current=null;

function generate(){
  const text=document.getElementById('moodInput').value;
  const mood=detect(text);
  const m=MOODS[mood];
  const seed=hashStr(text||mood)+new Date().getDate();
  const poem=pick(m.poems,seed);
  current={mood,label:m.label,grad:m.grad,poem,date:fmtDate()};

  goto('generating');
  let i=0; const gt=document.getElementById('genText');
  gt.textContent=GEN_STEPS[0];
  const timer=setInterval(()=>{ i++; if(i<GEN_STEPS.length) gt.textContent=GEN_STEPS[i]; },650);
  setTimeout(()=>{
    clearInterval(timer);
    renderResult(current);
    goto('result');
  },2700);
}

function renderResult(c){
  document.getElementById('rDate').textContent=c.date.display;
  document.getElementById('rGrad').style.background=c.grad;
  document.getElementById('rKw').textContent="今日 · "+c.label;
  document.getElementById('rPoem').innerHTML=c.poem;
}

function fmtDate(){
  const d=new Date();
  const p=n=>String(n).padStart(2,'0');
  return { display:`${d.getFullYear()} · ${p(d.getMonth()+1)} · ${p(d.getDate())}`,
           short:`${p(d.getMonth()+1)}/${p(d.getDate())}` };
}

/* ============ 情绪墙 ============ */
let wall=[
  {label:"焦灼",grad:MOODS.anxious.grad,short:"06/12"},
  {label:"低回",grad:MOODS.low.grad,short:"06/13"},
  {label:"澄澈",grad:MOODS.calm.grad,short:"06/14"},
  {label:"明朗",grad:MOODS.happy.grad,short:"06/15"}
];

function saveAndWall(){
  if(current){ wall.push({label:current.label,grad:current.grad,short:current.date.short}); current=null; }
  openWall();
}
function openWall(){
  const grid=document.getElementById('grid');
  grid.innerHTML=wall.map(w=>`
    <div class="tile"><div class="g" style="background:${w.grad}"></div>
      <div class="t-kw">${w.label}</div><div class="t-date">${w.short}</div></div>`).join('');
  document.getElementById('wallSub').innerHTML=`你已经安放了 ${wall.length} 种心情。<br>每一块颜色，都是某一天的你。`;
  goto('wall');
}

/* ============ 初始化 ============ */
(function init(){
  document.getElementById('chips').innerHTML=
    CHIP_SAMPLES.map(s=>`<span class="chip" onclick="document.getElementById('moodInput').value='${s}'">${s}</span>`).join('');
})();
</script>
</body>
</html>
