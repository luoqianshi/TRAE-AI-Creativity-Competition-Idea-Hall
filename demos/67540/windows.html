<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>剪贴板历史管理器 - Windows Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .app {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .sync-btn, .clear-btn, .paste-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .sync-btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .sync-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .paste-btn {
      background: rgba(76, 175, 80, 0.8);
      color: white;
    }

    .paste-btn:hover {
      background: rgba(76, 175, 80, 1);
    }

    .clear-btn {
      background: rgba(255, 59, 48, 0.8);
      color: white;
    }

    .clear-btn:hover {
      background: rgba(255, 59, 48, 1);
    }

    .sync-panel {
      background: #f8f9fa;
      padding: 20px;
      border-bottom: 1px solid #e9ecef;
      display: flex;
      gap: 30px;
    }

    .sync-section {
      flex: 1;
    }

    .sync-section h3 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #333;
    }

    .sync-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 10px;
      outline: none;
      transition: border-color 0.2s;
    }

    .sync-input:focus {
      border-color: #667eea;
    }

    .sync-action-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .sync-action-btn:hover {
      background: #5a6fd6;
      transform: translateY(-1px);
    }

    .sync-info {
      margin-top: 10px;
      font-size: 13px;
      color: #28a745;
    }

    .search-container {
      position: relative;
      padding: 20px;
      border-bottom: 1px solid #e9ecef;
    }

    .search-input {
      width: 100%;
      padding: 12px 40px 12px 16px;
      border: 2px solid #e9ecef;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: #667eea;
    }

    .search-icon {
      position: absolute;
      right: 30px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
    }

    .history-list {
      max-height: 500px;
      overflow-y: auto;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #6c757d;
    }

    .empty-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }

    .empty-hint {
      font-size: 14px;
      margin-top: 8px;
      color: #adb5bd;
    }

    .history-item {
      display: flex;
      align-items: flex-start;
      padding: 16px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .history-item:hover {
      background-color: #f8f9fa;
    }

    .item-type {
      font-size: 24px;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .item-content {
      flex: 1;
      min-width: 0;
    }

    .text-preview {
      font-size: 14px;
      color: #333;
      line-height: 1.5;
      word-break: break-all;
    }

    .code-preview {
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 13px;
      background: #f4f4f4;
      padding: 8px 12px;
      border-radius: 6px;
      color: #333;
      overflow-x: auto;
    }

    .image-preview {
      max-width: 100px;
      max-height: 100px;
      border-radius: 8px;
      object-fit: cover;
    }

    .item-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      margin-left: 12px;
      flex-shrink: 0;
    }

    .item-time {
      font-size: 12px;
      color: #999;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ccc;
      font-size: 16px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .delete-btn:hover {
      background: #ff4757;
      color: white;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
    }

    @media (max-width: 600px) {
      .sync-panel {
        flex-direction: column;
      }
      
      .header {
        flex-direction: column;
        gap: 12px;
      }

      .header-actions {
        flex-wrap: wrap;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="title">📋 剪贴板历史管理器</h1>
      <div class="header-actions">
        <button class="paste-btn" onclick="loadClipboard()">
          📌 粘贴到历史
        </button>
        <button class="sync-btn" onclick="toggleSyncPanel()">
          🔗 同步设置
        </button>
        <button class="clear-btn" onclick="clearAll()">
          🗑️ 清空
        </button>
      </div>
    </header>

    <div id="syncPanel" style="display: none;" class="sync-panel">
      <div class="sync-section">
        <h3>开启同步服务</h3>
        <input type="password" placeholder="设置同步密码（至少4位）" class="sync-input" id="syncPassword" />
        <button class="sync-action-btn" onclick="startSync()">启动服务</button>
        <p id="syncStatus" class="sync-info"></p>
      </div>
      <div class="sync-section">
        <h3>连接其他设备</h3>
        <input type="text" placeholder="设备IP地址" class="sync-input" id="connectHost" />
        <input type="number" placeholder="端口" class="sync-input" id="connectPort" value="8080" />
        <input type="password" placeholder="同步密码" class="sync-input" id="connectPassword" />
        <button class="sync-action-btn" onclick="connectDevice()">连接</button>
      </div>
    </div>

    <div class="search-container">
      <input type="text" placeholder="搜索剪贴板历史..." class="search-input" id="searchInput" oninput="handleSearch()" />
      <span class="search-icon">🔍</span>
    </div>

    <div class="history-list" id="historyList">
      <div class="empty-state">
        <div class="empty-icon">📋</div>
        <p>暂无剪贴板记录</p>
        <p class="empty-hint">复制内容后会自动记录在这里</p>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
