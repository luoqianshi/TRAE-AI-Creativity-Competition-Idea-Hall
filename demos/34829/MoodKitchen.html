<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心情料理屋 MoodKitchen · 交互原型</title>
<style>
  :root{
    --bg:#1a1625; --card:#26203a; --card-hover:#322a4d; 
    --accent:#ff8fab; --accent2:#a78bfa;
    --text:#f5f3ff; --muted:#b8b3d0; --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,#1a1625,#2d1b3d 60%,#3d2a4d);
    color:var(--text);line-height:1.6;min-height:100vh;
    display:flex;justify-content:center;padding:20px}
  
  /* 手机外壳模拟 */
  .phone-frame{
    width:100%;max-width:420px;background:var(--bg);
    border-radius:30px;border:1px solid rgba(255,255,255,.08);
    overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5);
    display:flex;flex-direction:column;height:90vh;min-height:700px;
  }
  .header{
    padding:24px 20px 10px;text-align:center;
    background:linear-gradient(180deg,rgba(255,143,171,.1),transparent);
  }
  .header h1{font-size:22px;font-weight:800;
    background:linear-gradient(120deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  }
  .header p{font-size:12px;color:var(--muted);margin-top:4px}
  
  .content{flex:1;overflow-y:auto;padding:0 20px 20px;scroll-behavior:smooth}
  .content::-webkit-scrollbar{width:4px}
  .content::-webkit-scrollbar-thumb{background:var(--accent2);border-radius:2px}
  
  .section-title{font-size:14px;color:var(--muted);margin:24px 0 12px;display:flex;align-items:center;gap:6px}
  .section-title::before{content:"";width:4px;height:14px;background:var(--accent);border-radius:2px}
  
  /* 标签选择器 */
  .tag-group{display:flex;flex-wrap:wrap;gap:10px}
  .tag{
    padding:10px 16px;background:var(--card);border:1px solid transparent;
    border-radius:999px;font-size:14px;cursor:pointer;
    transition:all .3s ease;user-select:none;
  }
  .tag:hover{background:var(--card-hover);transform:translateY(-2px)}
  .tag.active{
    background:linear-gradient(120deg,var(--accent),var(--accent2));
    font-weight:600;box-shadow:0 4px 12px rgba(167,139,250,.3);
  }
  
  /* 生成按钮 */
  .btn-generate{
    width:100%;padding:16px;margin-top:30px;border:none;border-radius:12px;
    background:linear-gradient(120deg,var(--accent),var(--accent2));
    color:#fff;font-size:16px;font-weight:600;cursor:pointer;
    transition:all .3s ease;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-generate:hover{transform:scale(1.02);box-shadow:0 8px 20px rgba(255,143,171,.4)}
  .btn-generate:active{transform:scale(0.98)}
  .btn-generate.loading{background:var(--card);color:var(--muted);pointer-events:none}
  
  /* 结果展示区 */
  .result-area{
    margin-top:24px;max-height:0;overflow:hidden;transition:max-height .5s ease;
  }
  .result-area.show{max-height:1000px}
  
  .card{
    background:var(--card);border-radius:var(--radius);padding:18px;
    margin-bottom:14px;border:1px solid rgba(255,255,255,.06);
    animation:slideUp .5s ease backwards;
  }
  .card:nth-child(2){animation-delay:.1s}
  .card:nth-child(3){animation-delay:.2s}
  
  @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  
  .card h3{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .card ul{list-style:none}
  .card li{font-size:13px;color:var(--muted);margin:6px 0;padding-left:16px;position:relative}
  .card li::before{content:"•";position:absolute;left:0;color:var(--accent)}
  
  .recipe-title{color:var(--accent);font-weight:600;margin-bottom:8px;display:block}
  .song-name{color:var(--accent2)}
  
  /* 状态提示 */
  .hint{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;height:16px}
</style>
</head>
<body>

<div class="phone-frame">
  <div class="header">
    <h1>🍳 心情料理屋</h1>
    <p>让 AI 把你的情绪煮成可口的样子</p>
  </div>
  
  <div class="content">
    <!-- 步骤 1：情绪 -->
    <div class="section-title">你现在感觉怎样？</div>
    <div class="tag-group" id="moodGroup">
      <div class="tag" data-mood="疲惫">😔 疲惫</div>
      <div class="tag" data-mood="焦虑">😰 焦虑</div>
      <div class="tag" data-mood="低落">😞 低落</div>
      <div class="tag" data-mood="空虚">😶 空虚</div>
      <div class="tag" data-mood="想犒劳">🥳 想犒劳</div>
    </div>

    <!-- 步骤 2：食材 -->
    <div class="section-title">手边有什么食材？(可多选)</div>
    <div class="tag-group" id="ingredientGroup">
      <div class="tag" data-ing="鸡蛋">🥚 鸡蛋</div>
      <div class="tag" data-ing="番茄">🍅 番茄</div>
      <div class="tag" data-ing="牛奶">🥛 牛奶</div>
      <div class="tag" data-ing="面条">🍜 面条</div>
      <div class="tag" data-ing="香蕉">🍌 香蕉</div>
      <div class="tag" data-ing="面包">🍞 面包</div>
      <div class="tag" data-ing="巧克力">🍫 巧克力</div>
      <div class="tag" data-ing="鸡肉">🍗 鸡肉</div>
    </div>

    <div class="hint" id="hintText"></div>
    <button class="btn-generate" id="generateBtn" onclick="generatePlan()">
      ✨ 为我生成治愈方案
    </button>

    <!-- 结果区 -->
    <div class="result-area" id="resultArea">
      <!-- 动态渲染区 -->
    </div>
  </div>
</div>

<script>
  let selectedMood = null;
  let selectedIngredients = [];

  // 情绪选择（单选）
  document.getElementById('moodGroup').addEventListener('click', function(e) {
    if(e.target.classList.contains('tag')) {
      document.querySelectorAll('#moodGroup .tag').forEach(t => t.classList.remove('active'));
      e.target.classList.add('active');
      selectedMood = e.target.getAttribute('data-mood');
    }
  });

  // 食材选择（多选）
  document.getElementById('ingredientGroup').addEventListener('click', function(e) {
    if(e.target.classList.contains('tag')) {
      e.target.classList.toggle('active');
      let ing = e.target.getAttribute('data-ing');
      if(e.target.classList.contains('active')) {
        if(!selectedIngredients.includes(ing)) selectedIngredients.push(ing);
      } else {
        selectedIngredients = selectedIngredients.filter(i => i !== ing);
      }
    }
  });

  function generatePlan() {
    const hint = document.getElementById('hintText');
    const btn = document.getElementById('generateBtn');
    const resultArea = document.getElementById('resultArea');

    if(!selectedMood) {
      hint.innerText = "请先告诉我你现在的心情哦~";
      return;
    }
    if(selectedIngredients.length === 0) {
      hint.innerText = "选一下手边有的食材吧，哪怕只有一样~";
      return;
    }

    hint.innerText = "";
    btn.classList.add('loading');
    btn.innerHTML = "🤖 AI 正在为你调配温暖...";

    setTimeout(() => {
      // 模拟AI生成逻辑
      let recipe = generateRecipe(selectedMood, selectedIngredients);
      let music = generateMusic(selectedMood);
      let task = generateTask(selectedMood);

      resultArea.innerHTML = `
        <div class="card">
          <h3>🍲 今日治愈食谱</h3>
          <span class="recipe-title">${recipe.name}</span>
          <ul>
            ${recipe.desc.map(d => `<li>${d}</li>`).join('')}
          </ul>
        </div>
        <div class="card">
          <h3>🎶 氛围歌单</h3>
          <ul>
            <li>歌单主题：<span class="song-name">${music.theme}</span></li>
            <li>推荐曲目：${music.track}</li>
            <li>${music.reason}</li>
          </ul>
        </div>
        <div class="card">
          <h3>✨ 3分钟小任务</h3>
          <ul>
            <li>${task}</li>
          </ul>
        </div>
      `;

      resultArea.classList.add('show');
      btn.classList.remove('loading');
      btn.innerHTML = "🔄 换个心情重新生成";
      
      // 滚动到结果
      setTimeout(() => {
        resultArea.scrollIntoView({behavior: "smooth", block: "start"});
      }, 100);

    }, 1500);
  }

  // --- 模拟数据池 ---
  function generateRecipe(mood, ings) {
    let baseName = ings.includes('面条') ? '面' : (ings.includes('面包') ? '三明治' : '简餐');
    let name = `特调 ${mood} ${baseName}`;
    let desc = [];
    
    if(mood === '疲惫') desc.push('富含碳水与色氨酸，帮你快速回血。', '烹饪时间控制在15分钟内，减少负担。');
    else if(mood === '焦虑') desc.push('加入了舒缓神经的镁元素食材。', '口感温润，抚平急躁的味蕾。');
    else if(mood === '低落') desc.push('色彩丰富，酸甜口味唤醒多巴胺。', '热气腾腾，从胃暖到心里。');
    else if(mood === '空虚') desc.push('饱腹感强，填满胃也填满情绪。', '香气浓郁，让厨房充满烟火气。');
    else if(mood === '想犒劳') desc.push('用料扎实，这一顿只为自己开心。', '摆盘精致，仪式感拉满。');

    if(ings.includes('巧克力')) desc.push('加点巧克力，甜蜜因子瞬间释放。');
    return { name, desc };
  }

  function generateMusic(mood) {
    const map = {
      '疲惫': { theme: '深夜柔软Lo-fi', track: '《Slow Down》', reason: 'BPM 60，跟随心跳放缓' },
      '焦虑': { theme: '森林白噪音轻音乐', track: '《Breathe》', reason: '长笛与风声，转移紧绷神经' },
      '低落': { theme: '微醺爵士', track: '《Blue Moon》', reason: '慵懒萨克斯，允许自己今天不快乐' },
      '空虚': { theme: '治愈系华语', track: '《慢慢喜欢你》', reason: '温暖的叙事感陪伴你' },
      '想犒劳': { theme: '复古Disco', track: '《Dancing Queen》', reason: 'BPM 120，踩着节拍享受当下' }
    };
    return map[mood];
  }

  function generateTask(mood) {
    const tasks = {
      '疲惫': '关掉手机所有通知，定个15分钟的闹钟，闭眼趴一会或靠在沙发上放空。',
      '焦虑': '找一张纸，把脑子里所有担心的事写下来，然后把纸折起来放进抽屉。',
      '低落': '对着镜子笑一下，哪怕很假，保持10秒钟，感受肌肉的变化。',
      '空虚': '给一个很久没联系但关系很好的朋友发个表情包。',
      '想犒劳': '挑一部一直想看但没时间看的电影，准备好零食，现在就点开。'
    };
    return tasks[mood];
  }
</script>

</body>
</html>
