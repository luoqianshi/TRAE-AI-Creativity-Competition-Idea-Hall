<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微光信箱 · 深夜情绪树洞</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
:root{
  --night-deep:#0a0e27;--night-mid:#141b3d;--night-light:#1e2855;
  --glow-soft:#4a6fa5;--glow-warm:#e8a87c;--glow-pink:#c38d9e;
  --text-soft:#b8c4e8;--text-dim:#6b7a9e;--lantern:#ffd89b;
}
body{
  font-family:'Noto Sans SC',sans-serif;background:var(--night-deep);color:var(--text-soft);
  min-height:100vh;overflow-x:hidden;position:relative;
}
#starCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.container{position:relative;z-index:2;max-width:1000px;margin:0 auto;padding:30px 20px}

/* 飘浮灯笼 */
.lantern{position:fixed;width:30px;height:40px;z-index:1;pointer-events:none;opacity:0}
.lantern-body{
  width:30px;height:36px;background:radial-gradient(ellipse at center,var(--lantern),rgba(255,216,155,.3));
  border-radius:50%;box-shadow:0 0 20px rgba(255,216,155,.4);position:relative;
}
.lantern-body::before{content:'';position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:1px;height:8px;background:rgba(255,216,155,.5)}
.lantern-body::after{content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);width:6px;height:5px;background:rgba(255,216,155,.3);border-radius:0 0 3px 3px}

header{text-align:center;padding:30px 0 20px;position:relative;z-index:2}
header .moon{
  width:60px;height:60px;margin:0 auto 16px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff5e0,#e8d5a3);
  box-shadow:0 0 40px rgba(255,245,224,.3);position:relative;
}
header h1{font-family:'Ma Shan Zheng',cursive;font-size:2.5rem;color:var(--lantern);text-shadow:0 0 20px rgba(255,216,155,.4);letter-spacing:.1em}
header .subtitle{color:var(--text-dim);font-size:.95rem;margin-top:8px;font-weight:300;letter-spacing:.2em}

/* 时间显示 */
.time-display{text-align:center;margin:20px 0;font-weight:300;color:var(--text-dim)}
.time-display #clock{font-size:2rem;color:var(--glow-warm);letter-spacing:.1em}
.time-display .hint{font-size:.8rem;margin-top:5px}

/* 情绪选择 */
.mood-section{text-align:center;margin:30px 0}
.mood-section h3{font-family:'Ma Shan Zheng',cursive;font-size:1.3rem;color:var(--text-soft);margin-bottom:18px}
.mood-picker{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}
.mood-chip{
  padding:10px 22px;border-radius:30px;background:rgba(74,111,165,.15);border:1px solid rgba(74,111,165,.3);
  cursor:pointer;transition:all .3s;font-size:.9rem;color:var(--text-dim);
}
.mood-chip:hover{border-color:var(--glow-warm);color:var(--glow-warm);background:rgba(232,168,124,.1)}
.mood-chip.selected{background:var(--glow-warm);color:var(--night-deep);border-color:var(--glow-warm);box-shadow:0 0 20px rgba(232,168,124,.3)}

/* 信箱输入 */
.letter-box{
  background:rgba(20,27,61,.6);backdrop-filter:blur(12px);border-radius:20px;padding:30px;
  border:1px solid rgba(74,111,165,.2);margin:30px 0;box-shadow:0 8px 40px rgba(0,0,0,.3);
}
.letter-box textarea{
  width:100%;min-height:120px;background:transparent;border:none;outline:none;resize:vertical;
  color:var(--text-soft);font-family:inherit;font-size:1rem;line-height:1.8;
}
.letter-box textarea::placeholder{color:var(--text-dim);font-style:italic}
.letter-actions{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:16px;border-top:1px solid rgba(74,111,165,.2)}
.char-count{font-size:.8rem;color:var(--text-dim)}
.send-btn{
  padding:10px 30px;border-radius:30px;background:linear-gradient(135deg,var(--glow-warm),var(--glow-pink));
  border:none;color:#fff;cursor:pointer;font-size:.95rem;transition:all .3s;font-family:inherit;
}
.send-btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(232,168,124,.4)}
.send-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* 信件墙 */
.letters-wall{margin-top:40px}
.letters-wall h3{font-family:'Ma Shan Zheng',cursive;font-size:1.3rem;color:var(--text-soft);margin-bottom:20px;text-align:center}
.letters-container{display:flex;flex-direction:column;gap:16px}
.letter-card{
  background:rgba(30,40,85,.5);backdrop-filter:blur(8px);border-radius:16px;padding:20px 24px;
  border-left:3px solid var(--glow-soft);transition:all .3s;animation:float-in .6s ease;
}
.letter-card:hover{border-left-color:var(--glow-warm);transform:translateX(4px)}
@keyframes float-in{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.letter-mood{font-size:.75rem;color:var(--glow-pink);margin-bottom:8px}
.letter-text{font-size:.95rem;line-height:1.7;color:var(--text-soft)}
.letter-time{font-size:.75rem;color:var(--text-dim);margin-top:10px;text-align:right}
.letter-warmth{display:flex;align-items:center;gap:6px;margin-top:10px}
.warmth-btn{
  background:none;border:1px solid rgba(232,168,124,.3);border-radius:20px;padding:4px 12px;
  cursor:pointer;color:var(--glow-warm);font-size:.8rem;transition:all .2s;font-family:inherit;
}
.warmth-btn:hover,.warmth-btn.active{background:rgba(232,168,124,.15);border-color:var(--glow-warm)}

/* 回复 */
.reply-card{
  background:rgba(74,111,165,.1);border-radius:12px;padding:14px 18px;margin-top:12px;
  border-left:2px solid var(--glow-soft);font-size:.88rem;color:var(--text-dim);line-height:1.6;
}
.reply-card::before{content:'回 · ';color:var(--glow-soft);font-weight:700}

footer{text-align:center;padding:30px 0;color:var(--text-dim);font-size:.8rem}
footer span{color:var(--glow-warm)}
</style>
</head>
<body>
<canvas id="starCanvas"></canvas>

<div class="container">
  <header>
    <div class="moon"></div>
    <h1>微光信箱</h1>
    <p class="subtitle">深 夜 情 绪 树 洞</p>
  </header>

  <div class="time-display">
    <div id="clock">23:47</div>
    <div class="hint">夜深了，这里有人等你</div>
  </div>

  <div class="mood-section">
    <h3>今夜的你</h3>
    <div class="mood-picker" id="moodPicker">
      <div class="mood-chip">🌙 孤独</div>
      <div class="mood-chip">💫 焦虑</div>
      <div class="mood-chip">🌧 低落</div>
      <div class="mood-chip">🔥 愤怒</div>
      <div class="mood-chip">✨ 期待</div>
      <div class="mood-chip">🤗 感动</div>
      <div class="mood-chip">😶 迷茫</div>
      <div class="mood-chip">💝 温暖</div>
    </div>
  </div>

  <div class="letter-box">
    <textarea id="letterInput" placeholder="把心里的话放进信箱，没有人会知道是你..."></textarea>
    <div class="letter-actions">
      <span class="char-count" id="charCount">0 / 500</span>
      <button class="send-btn" id="sendBtn" disabled>放飞信件</button>
    </div>
  </div>

  <div class="letters-wall">
    <h3>— 信件漂流墙 —</h3>
    <div class="letters-container" id="lettersContainer"></div>
  </div>

  <footer>每一封信都会收到一束 <span>微光</span> 回应</footer>
</div>

<script>
// 星空背景
const canvas=document.getElementById('starCanvas');
const ctx=canvas.getContext('2d');
let stars=[],lanterns=[];
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
resize();addEventListener('resize',resize);

for(let i=0;i<120;i++){
  stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.5,a:Math.random(),speed:0.005+Math.random()*0.015});
}
for(let i=0;i<5;i++){
  lanterns.push({x:Math.random()*canvas.width,y:canvas.height+Math.random()*300,speed:0.3+Math.random()*0.5,size:0.5+Math.random()*0.5,a:0,phase:Math.random()*Math.PI*2});
}

function draw(){
  ctx.fillStyle='rgba(10,14,39,0.3)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  stars.forEach(s=>{
    s.a+=s.speed;if(s.a>1||s.a<0)s.speed*=-1;
    ctx.beginPath();ctx.arc(s.x,s.y,Math.max(0.1,s.r),0,Math.PI*2);
    ctx.fillStyle=`rgba(184,196,232,${s.a})`;ctx.fill();
  });
  lanterns.forEach(l=>{
    l.y-=l.speed;l.phase+=0.02;
    l.a=Math.min(1,l.a+0.005);
    if(l.y<-50){l.y=canvas.height+50;l.x=Math.random()*canvas.width}
    const x=l.x+Math.sin(l.phase)*15;
    const grad=ctx.createRadialGradient(x,l.y,0,x,l.y,25*l.size);
    grad.addColorStop(0,`rgba(255,216,155,${0.6*l.a})`);
    grad.addColorStop(1,'rgba(255,216,155,0)');
    ctx.fillStyle=grad;ctx.beginPath();ctx.arc(x,l.y,Math.max(0.1,25*l.size),0,Math.PI*2);ctx.fill();
  });
  requestAnimationFrame(draw);
}
draw();

// 时钟
function updateClock(){
  const now=new Date();const h=String(now.getHours()).padStart(2,'0');const m=String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent=`${h}:${m}`;
}
updateClock();setInterval(updateClock,1000);

// 情绪选择
let selectedMood='';
document.querySelectorAll('.mood-chip').forEach(chip=>{
  chip.addEventListener('click',function(){
    document.querySelectorAll('.mood-chip').forEach(c=>c.classList.remove('selected'));
    this.classList.add('selected');selectedMood=this.textContent.trim();checkReady();
  });
});

// 字数
const input=document.getElementById('letterInput');
const sendBtn=document.getElementById('sendBtn');
const charCount=document.getElementById('charCount');
input.addEventListener('input',function(){
  if(this.value.length>500)this.value=this.value.slice(0,500);
  charCount.textContent=`${this.value.length} / 500`;checkReady();
});
function checkReady(){sendBtn.disabled=!(selectedMood&&input.value.trim().length>0)}

// 回复语
const replies=[
  '此刻的孤独不是你的错，夜色只是放大了心里的声音。你值得被温柔对待。',
  '焦虑像一阵风，它来的时候挡不住，但它一定会走。深呼吸，你已经做得很好了。',
  '低落也没关系，情绪有起伏才是活着的证明。明天的阳光会等你。',
  '允许自己愤怒，但别让怒火烧到自己。你的感受很重要，说出来就已经是勇敢。',
  '期待本身就是一种力量，说明你心里还有光。继续走，美好的事正在路上。',
  '被感动的瞬间是生命最柔软的礼物，好好收藏这份温暖。',
  '迷茫说明你在思考，在路上的人才会迷路。停下来歇歇，方向会自己出现。',
  '温暖的人自带光芒，你散发的善意正在悄悄照亮别人。'
];

// 发送
sendBtn.addEventListener('click',function(){
  if(sendBtn.disabled)return;
  const letters=document.getElementById('lettersContainer');
  const card=document.createElement('div');
  card.className='letter-card';
  const reply=replies[Math.floor(Math.random()*replies.length)];
  const now=new Date();const time=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  card.innerHTML=`
    <div class="letter-mood">${selectedMood}</div>
    <div class="letter-text">${input.value.trim()}</div>
    <div class="letter-warmth">
      <button class="warmth-btn">🕯 送一束微光 <span>0</span></button>
    </div>
    <div class="reply-card">${reply}</div>
    <div class="letter-time">${time}</div>`;
  letters.insertBefore(card,letters.firstChild);
  input.value='';charCount.textContent='0 / 500';
  document.querySelectorAll('.mood-chip').forEach(c=>c.classList.remove('selected'));selectedMood='';
  sendBtn.disabled=true;bindWarmth();
});

// 初始信件
const initLetters=[
  {mood:'🌙 孤独',text:'搬来这个城市三个月了，周末不知道该找谁说话，还好有这个地方。',reply:'孤独是成长的必经路，你正在变得更独立。这封信，已经有人看到了。'},
  {mood:'✨ 期待',text:'明天面试，紧张到睡不着。不知道自己够不够好，但真的很想要这份工作。',reply:'紧张是因为在乎，这本身就是一种认真。去展现最真实的自己，你已经够好了。'},
  {mood:'🤗 感动',text:'今天地铁上有人给我让座，说了句"你看起来很累"。陌生人的一句关心让我红了眼眶。',reply:'这个世界比你以为的温柔。你被善意触碰过，也一定会在某天成为别人的那束微光。'},
];
const initContainer=document.getElementById('lettersContainer');
initLetters.forEach(l=>{
  const card=document.createElement('div');card.className='letter-card';
  card.innerHTML=`<div class="letter-mood">${l.mood}</div><div class="letter-text">${l.text}</div><div class="letter-warmth"><button class="warmth-btn">🕯 送一束微光 <span>${Math.floor(Math.random()*20)+3}</span></button></div><div class="reply-card">${l.reply}</div><div class="letter-time">${Math.floor(Math.random()*3)+22}:${String(Math.floor(Math.random()*60)).padStart(2,'0')}</div>`;
  initContainer.appendChild(card);
});
bindWarmth();

function bindWarmth(){
  document.querySelectorAll('.warmth-btn').forEach(btn=>{
    if(btn.dataset.bound)return;btn.dataset.bound='1';
    btn.addEventListener('click',function(){
      this.classList.add('active');
      const span=this.querySelector('span');
      span.textContent=parseInt(span.textContent)+1;
      this.innerHTML=`🕯 送一束微光 <span>${span.textContent}</span>`;
    });
  });
}
</script>
</body>
</html>
