<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 小红书爆款标题生成器</title>
    <style>
        /* ====== 页面整体样式 ====== */
        body {
            font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            margin: 0;
            padding: 30px 20px;
            min-height: 100vh;
        }

        /* ====== 主容器 ====== */
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        /* ====== 标题样式 ====== */
        h1 {
            text-align: center;
            color: #ff2442;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* ====== 输入区域样式 ====== */
        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
            font-size: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ffd4d4;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #ff2442;
        }

        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ffd4d4;
            border-radius: 10px;
            font-size: 15px;
            background: white;
            cursor: pointer;
        }

        /* ====== 按钮样式 ====== */
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff2442, #ff6b6b);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 36, 66, 0.4);
        }

        /* ====== 结果区域样式 ====== */
        .result-area {
            margin-top: 30px;
            padding: 20px;
            background: #fff5f5;
            border-radius: 15px;
            border: 2px dashed #ffcccc;
            display: none;
        }

        .result-title {
            font-weight: bold;
            color: #ff2442;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .title-item {
            background: white;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 15px;
            line-height: 1.6;
            cursor: pointer;
            border-left: 4px solid #ff2442;
            transition: background 0.2s;
        }

        .title-item:hover {
            background: #fff0f0;
        }

        .copy-tip {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 10px;
        }

        /* ====== 使用说明 ====== */
        .tips {
            margin-top: 25px;
            padding: 15px;
            background: #fffbeb;
            border-radius: 10px;
            font-size: 13px;
            color: #666;
            line-height: 1.8;
        }

        .tips strong {
            color: #ff2442;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ AI 小红书爆款标题生成器</h1>
        <p class="subtitle">输入主题，一键生成 5 个爆款标题</p>

        <div class="input-group">
            <label>📝 你的主题是什么？</label>
            <input type="text" id="topicInput" placeholder="例如：夏天如何减肥 / 新手学化妆 / 便宜好用的护肤品">
        </div>

        <div class="input-group">
            <label>🎯 你想要什么风格？</label>
            <select id="styleSelect">
                <option value="xihongshi">小红书爆款风</option>
                <option value="jiaoxue">教程干货风</option>
                <option value="zhongcao">种草安利风</option>
                <option value="qingxu">情绪共鸣风</option>
                <option value="dui">对比反差风</option>
            </select>
        </div>

        <button onclick="generateTitles()">🚀 开始生成爆款标题</button>

        <div class="result-area" id="resultArea">
            <div class="result-title">👇 为你生成的 5 个爆款标题（点击可复制）：</div>
            <div id="titleList"></div>
            <div class="copy-tip">💡 小提示：把最心动的标题稍作修改，就是你的专属爆款！</div>
        </div>

        <div class="tips">
            <strong>📖 使用说明：</strong><br>
            1. 输入你想写的主题（越具体越好）<br>
            2. 选择你想要的标题风格<br>
            3. 点击"开始生成"按钮<br>
            4. 点击生成的标题可以一键复制<br>
            5. 稍作修改后直接发布到小红书
        </div>
    </div>

    <script>
        // ====== 标题模板库 ======
        // 不同风格有不同的模板
        const templates = {
            xihongshi: [
                "姐妹们！这个{topic}真的绝了😭",
                "后悔没早知道！{topic}原来这么简单",
                "被问爆的{topic}，30秒学会！",
                "{topic}的终极指南｜新手必看💯",
                "天呐！这个{topic}方法也太好用了吧",
                "{topic}千万别再瞎做了！正确方法在这里👇",
                "终于找到！{topic}的正确打开方式",
                "一个被忽略的{topic}技巧，效果惊人",
                "{topic}我悟了！原来就这么简单",
                "救命🆘！这个{topic}也太香了吧"
            ],
            jiaoxue: [
                "{topic}从入门到精通，一篇就够了📚",
                "新手{topic}完全指南｜3个核心步骤",
                "{topic}避坑指南：这些雷千万别踩",
                "手把手教你{topic}｜0基础也能学会",
                "{topic}的5个黄金法则",
                "一篇搞懂{topic}｜超详细教程",
                "{topic}怎么做才对？看这篇就够了",
                "{topic}常见误区大揭秘🔍",
                "{topic}的底层逻辑，一次讲透",
                "小白必看！{topic}入门教程"
            ],
            zhongcao: [
                "这个{topic}也太好用了吧！闭眼入🛍️",
                "{topic}天花板！用一次就离不开",
                "私藏多年的{topic}好物分享",
                "{topic}界的隐藏王者，平价又好用",
                "回购N次！这个{topic}真的香",
                "{topic}好物清单｜闭眼入不踩雷",
                "这个{topic}我能吹一辈子！",
                "姐妹们冲！这个{topic}真的便宜又好用",
                "{topic}推荐｜用过都说好的宝藏",
                "相见恨晚！这个{topic}改变了我的生活"
            ],
            qingxu: [
                "关于{topic}，我想说几句真心话💭",
                "{topic}让我焦虑了很久，直到我想通了这件事",
                "为什么你{topic}总是没效果？因为你忽视了它",
                "{topic}这件事，别再骗自己了",
                "关于{topic}，我踩过的那些坑",
                "30岁才明白{topic}的真正意义",
                "{topic}让我学会了一个道理：慢就是快",
                "那些没人告诉你的{topic}真相",
                "{topic}这件事上，我浪费了太多时间",
                "关于{topic}，这是我最真诚的建议"
            ],
            dui: [
                "以前以为{topic}很难，后来发现全错了🤯",
                "{topic}：穷人思维 vs 富人思维差在哪里？",
                "我用3年搞懂的{topic}，你3分钟学会",
                "{topic}不是你想的那样！真相是…",
                "普通人VS高手：{topic}的差距在哪？",
                "{topic}：你以为的努力，可能全是瞎忙",
                "以前{topic}这样做，现在我完全反着来",
                "{topic}的两个极端｜你是哪一种？",
                "{topic}：大多数人都错了，正确做法是…",
                "为什么你{topic}没效果？原因很简单"
            ]
        };

        // ====== 生成标题的主函数 ======
        function generateTitles() {
            // 1. 获取用户输入
            const topic = document.getElementById('topicInput').value.trim();
            const style = document.getElementById('styleSelect').value;

            // 2. 检查输入是否为空
            if (!topic) {
                alert('请先输入你的主题哦😊');
                return;
            }

            // 3. 从模板库随机选 5 个
            const templateList = templates[style];
            const selectedTitles = [];
            const usedIndexes = new Set();

            while (selectedTitles.length < 5 && usedIndexes.size < templateList.length) {
                const randomIndex = Math.floor(Math.random() * templateList.length);
                if (!usedIndexes.has(randomIndex)) {
                    usedIndexes.add(randomIndex);
                    selectedTitles.push(templateList[randomIndex]);
                }
            }

            // 4. 把模板里的 {topic} 替换成用户输入
            const finalTitles = selectedTitles.map(t => t.replace(/{topic}/g, topic));

            // 5. 显示结果
            showResults(finalTitles);
        }

        // ====== 显示结果的函数 ======
        function showResults(titles) {
            const resultArea = document.getElementById('resultArea');
            const titleList = document.getElementById('titleList');

            // 清空之前的结果
            titleList.innerHTML = '';

            // 把每个标题做成一个可点击的元素
            titles.forEach((title, index) => {
                const item = document.createElement('div');
                item.className = 'title-item';
                item.textContent = (index + 1) + '. ' + title;

                // 点击时复制到剪贴板
                item.onclick = function() {
                    navigator.clipboard.writeText(title).then(() => {
                        const original = item.textContent;
                        item.textContent = '✅ 已复制！' + original.replace(/^\d+\.\s/, '');
                        setTimeout(() => {
                            item.textContent = original;
                        }, 1500);
                    });
                };

                titleList.appendChild(item);
            });

            // 显示结果区域
            resultArea.style.display = 'block';

            // 滚动到结果区域
            resultArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // ====== 回车键也能生成 ======
        document.getElementById('topicInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                generateTitles();
            }
        });
    </script>
</body>
</html>
