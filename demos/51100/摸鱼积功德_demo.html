<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>摸鱼积功德</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --gold: #d4a843; --gold-light: #f5d98a; --gold-dark: #a07830;
  --bg-dark: #1a1220; --bg-mid: #2a1f35; --bg-card: rgba(42,31,53,0.85);
  --text: #f0e6d3; --text-dim: #a89b8c; --accent: #e8c36a;
  --lotus-pink: #e8a0b4; --lotus-deep: #c06080;
}
@font-face { font-family: 'game'; src: local('PingFang SC'), local('Microsoft YaHei'), local('sans-serif'); }
body {
  font-family: 'game', sans-serif; background: var(--bg-dark); color: var(--text);
  min-height: 100vh; overflow-x: hidden; position: relative;
}
/* ====== 背景粒子 ====== */
#bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
/* ====== 主容器 ====== */
.app { position: relative; z-index: 1; max-width: 420px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
/* ====== 顶部状态栏 ====== */
.top-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 20px 8px; position: sticky; top: 0; z-index: 10;
  background: linear-gradient(180deg, var(--bg-dark) 60%, transparent);
}
.merit-display {
  display: flex; align-items: center; gap: 8px;
  background: linear-gradient(135deg, rgba(212,168,67,0.2), rgba(212,168,67,0.05));
  border: 1px solid rgba(212,168,67,0.3); border-radius: 20px; padding: 6px 16px;
}
.merit-icon { font-size: 20px; }
.merit-value { font-size: 20px; font-weight: 700; color: var(--gold-light); min-width: 60px; }
.merit-label { font-size: 11px; color: var(--text-dim); }
.rank-btn {
  background: var(--bg-card); border: 1px solid rgba(212,168,67,0.2);
  border-radius: 16px; padding: 6px 14px; color: var(--gold); font-size: 13px; cursor: pointer;
}
.rank-btn:hover { background: rgba(212,168,67,0.15); }
/* ====== 金身展示区 ====== */
.body-section { text-align: center; padding: 10px 20px 0; }
.body-title { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; letter-spacing: 2px; }
.body-name { font-size: 18px; font-weight: 700; color: var(--gold); margin-bottom: 2px; }
.body-level { font-size: 11px; color: var(--text-dim); }
/* ====== 金身佛像区域 ====== */
.buddha-area {
  position: relative; display: flex; justify-content: center; align-items: center;
  height: 220px; margin: 10px 0; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
}
.buddha-circle {
  width: 160px; height: 160px; border-radius: 50%; position: relative;
  display: flex; justify-content: center; align-items: center;
  background: radial-gradient(circle, rgba(212,168,67,0.15) 0%, transparent 70%);
  transition: transform 0.1s;
}
.buddha-circle:active { transform: scale(0.95); }
.buddha-glow {
  position: absolute; width: 200px; height: 200px; border-radius: 50%;
  background: radial-gradient(circle, rgba(212,168,67,0.12) 0%, transparent 70%);
  animation: pulse 3s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.15); opacity: 1; } }
.buddha-emoji { font-size: 80px; position: relative; z-index: 2; filter: drop-shadow(0 0 20px rgba(212,168,67,0.4)); transition: all 0.3s; }
.buddha-ring {
  position: absolute; width: 180px; height: 180px; border-radius: 50%;
  border: 1px solid rgba(212,168,67,0.15); animation: spin 20s linear infinite;
}
.buddha-ring::before, .buddha-ring::after {
  content: ''; position: absolute; width: 6px; height: 6px; border-radius: 50%;
  background: var(--gold); opacity: 0.4;
}
.buddha-ring::before { top: -3px; left: 50%; transform: translateX(-50%); }
.buddha-ring::after { bottom: -3px; left: 50%; transform: translateX(-50%); }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.click-hint { font-size: 12px; color: var(--text-dim); text-align: center; margin-top: -5px; opacity: 0.6; }
/* ====== 点击飘字 ====== */
.float-text {
  position: absolute; pointer-events: none; font-weight: 700; font-size: 22px;
  color: var(--gold-light); text-shadow: 0 0 10px rgba(212,168,67,0.6);
  animation: floatUp 1.2s ease-out forwards; z-index: 20;
}
@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(0.8); }
  30% { opacity: 1; transform: translateY(-30px) scale(1.2); }
  100% { opacity: 0; transform: translateY(-90px) scale(0.6); }
}
.crit-text { font-size: 30px; color: #ff6b6b; text-shadow: 0 0 15px rgba(255,107,107,0.6); }
/* ====== 花瓣粒子 ====== */
.petal {
  position: fixed; pointer-events: none; z-index: 15; font-size: 16px; opacity: 0;
  animation: petalFall 3s ease-in forwards;
}
@keyframes petalFall {
  0% { opacity: 0.9; transform: translateY(0) rotate(0deg) scale(1); }
  100% { opacity: 0; transform: translateY(200px) rotate(360deg) scale(0.3); }
}
/* ====== 进度条 ====== */
.progress-section { padding: 0 30px; margin-bottom: 12px; }
.progress-bar {
  height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; position: relative;
}
.progress-fill {
  height: 100%; border-radius: 4px; transition: width 0.5s ease;
  background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-light));
  box-shadow: 0 0 8px rgba(212,168,67,0.4);
}
.progress-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); margin-top: 4px; }
/* ====== 功能按钮区 ====== */
.action-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  padding: 0 20px; margin-bottom: 16px;
}
.action-btn {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: var(--bg-card); border: 1px solid rgba(212,168,67,0.15);
  border-radius: 14px; padding: 14px 8px; cursor: pointer; transition: all 0.2s;
  color: var(--text);
}
.action-btn:hover { border-color: rgba(212,168,67,0.4); background: rgba(212,168,67,0.08); transform: translateY(-2px); }
.action-btn:active { transform: translateY(0) scale(0.97); }
.action-btn .icon { font-size: 28px; }
.action-btn .label { font-size: 12px; color: var(--text-dim); }
.action-btn .cost { font-size: 10px; color: var(--gold); }
.action-btn.disabled { opacity: 0.4; pointer-events: none; }
/* ====== 杂念泡泡 ====== */
.distraction-bubble {
  position: fixed; z-index: 25; cursor: pointer; user-select: none;
  background: linear-gradient(135deg, rgba(80,50,80,0.9), rgba(60,30,60,0.95));
  border: 1px solid rgba(200,100,120,0.3); border-radius: 16px;
  padding: 10px 16px; font-size: 13px; color: #e8b0b0;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3); animation: bubbleIn 0.4s ease-out;
  display: flex; align-items: center; gap: 8px; max-width: 200px;
  -webkit-tap-highlight-color: transparent;
}
.distraction-bubble .d-icon { font-size: 20px; }
.distraction-bubble .d-reward { font-size: 10px; color: var(--gold); display: block; margin-top: 2px; }
@keyframes bubbleIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.bubble-pop { animation: pop 0.3s ease-out forwards; }
@keyframes pop { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }
/* ====== 底部Tab ====== */
.tab-bar {
  display: flex; justify-content: space-around; padding: 10px 0 20px;
  background: linear-gradient(0deg, var(--bg-dark) 70%, transparent);
  position: sticky; bottom: 0; margin-top: auto;
}
.tab-item {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  cursor: pointer; color: var(--text-dim); font-size: 10px; padding: 4px 12px;
  transition: color 0.2s;
}
.tab-item.active { color: var(--gold); }
.tab-item .tab-icon { font-size: 22px; }
/* ====== 弹窗 ====== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100;
  display: flex; justify-content: center; align-items: center;
  animation: fadeIn 0.2s; backdrop-filter: blur(4px);
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: linear-gradient(160deg, #2e2240, #1e1530);
  border: 1px solid rgba(212,168,67,0.25); border-radius: 20px;
  padding: 28px 24px; width: 90%; max-width: 360px; text-align: center;
  animation: modalIn 0.3s ease-out; position: relative;
}
@keyframes modalIn { from { transform: scale(0.8) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
.modal-close {
  position: absolute; top: 12px; right: 16px; font-size: 20px; color: var(--text-dim);
  cursor: pointer; background: none; border: none;
}
.modal h3 { color: var(--gold); font-size: 18px; margin-bottom: 16px; }
.modal p { font-size: 14px; line-height: 1.8; color: var(--text); margin-bottom: 12px; }
.modal .highlight { color: var(--gold-light); font-weight: 700; font-size: 24px; }
.modal-btn {
  background: linear-gradient(135deg, var(--gold-dark), var(--gold));
  color: #1a1220; border: none; border-radius: 12px; padding: 10px 30px;
  font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px;
  transition: transform 0.1s;
}
.modal-btn:hover { transform: scale(1.03); }
.modal-btn:active { transform: scale(0.97); }
/* ====== 福报签 ====== */
.fortune-card {
  background: linear-gradient(145deg, #3a2a1a, #2a1e14);
  border: 1px solid rgba(212,168,67,0.35); border-radius: 16px;
  padding: 24px 20px; margin: 12px 0; position: relative; overflow: hidden;
}
.fortune-card::before {
  content: ''; position: absolute; top: -20px; right: -20px;
  width: 80px; height: 80px; border-radius: 50%;
  background: radial-gradient(circle, rgba(212,168,67,0.15), transparent);
}
.fortune-type { font-size: 12px; color: var(--gold); letter-spacing: 3px; margin-bottom: 8px; }
.fortune-text { font-size: 20px; font-weight: 700; color: var(--gold-light); line-height: 1.6; margin-bottom: 8px; }
.fortune-desc { font-size: 13px; color: var(--text-dim); line-height: 1.6; }
/* ====== 榜单 ====== */
.rank-list { text-align: left; margin: 12px 0; }
.rank-item {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.rank-num { width: 24px; font-weight: 700; color: var(--gold); font-size: 16px; text-align: center; }
.rank-num.top1 { color: #ffd700; font-size: 20px; }
.rank-num.top2 { color: #c0c0c0; }
.rank-num.top3 { color: #cd7f32; }
.rank-avatar { font-size: 28px; }
.rank-info { flex: 1; }
.rank-name { font-size: 14px; }
.rank-merit { font-size: 11px; color: var(--text-dim); }
/* ====== 金身升级面板 ====== */
.upgrade-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
.upgrade-item {
  background: rgba(255,255,255,0.04); border: 1px solid rgba(212,168,67,0.1);
  border-radius: 12px; padding: 12px 8px; text-align: center; cursor: pointer;
  transition: all 0.2s;
}
.upgrade-item:hover { border-color: var(--gold); background: rgba(212,168,67,0.08); }
.upgrade-item.locked { opacity: 0.35; cursor: not-allowed; }
.upgrade-item.current { border-color: var(--gold); background: rgba(212,168,67,0.12); box-shadow: 0 0 12px rgba(212,168,67,0.2); }
.upgrade-item .u-emoji { font-size: 30px; display: block; margin-bottom: 4px; }
.upgrade-item .u-name { font-size: 12px; color: var(--text); }
.upgrade-item .u-cost { font-size: 10px; color: var(--gold); margin-top: 2px; }
/* ====== 奇遇通知 ====== */
.encounter-toast {
  position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 50;
  background: linear-gradient(135deg, rgba(212,168,67,0.9), rgba(160,120,48,0.95));
  color: #1a1220; padding: 12px 24px; border-radius: 14px; font-size: 14px; font-weight: 700;
  box-shadow: 0 4px 24px rgba(212,168,67,0.3); animation: toastIn 0.4s ease-out, toastOut 0.4s 2.6s ease-in forwards;
  white-space: nowrap;
}
@keyframes toastIn { from { transform: translateX(-50%) translateY(-30px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
@keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateX(-50%) translateY(-20px); } }
/* ====== Buff标签 ====== */
.buff-bar { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; padding: 0 20px; margin-bottom: 8px; }
.buff-tag {
  font-size: 10px; padding: 3px 10px; border-radius: 10px;
  background: rgba(212,168,67,0.12); border: 1px solid rgba(212,168,67,0.2); color: var(--gold);
}
/* ====== 离线收益弹窗 ====== */
.offline-reward .reward-num { font-size: 42px; font-weight: 700; color: var(--gold-light); margin: 10px 0; }
.offline-reward .reward-time { font-size: 12px; color: var(--text-dim); }
/* ====== 响应式 ====== */
@media (max-height: 700px) {
  .buddha-area { height: 180px; }
  .buddha-circle { width: 130px; height: 130px; }
  .buddha-emoji { font-size: 64px; }
  .buddha-glow { width: 170px; height: 170px; }
  .buddha-ring { width: 150px; height: 150px; }
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="app" id="app">
  <!-- 顶部状态栏 -->
  <div class="top-bar">
    <div class="merit-display">
      <span class="merit-icon">☸</span>
      <div>
        <div class="merit-value" id="meritDisplay">0</div>
        <div class="merit-label">功德</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="rank-btn" onclick="showRankModal()">🏆 榜单</button>
    </div>
  </div>

  <!-- Buff栏 -->
  <div class="buff-bar" id="buffBar"></div>

  <!-- 金身展示 -->
  <div class="body-section">
    <div class="body-title">— 当前金身 —</div>
    <div class="body-name" id="bodyName">凡人肉身</div>
    <div class="body-level" id="bodyLevel">品级一 · 点击收益 1~10</div>
  </div>

  <!-- 佛像点击区域 -->
  <div class="buddha-area" id="buddhaArea" onclick="handleClick(event)">
    <div class="buddha-glow"></div>
    <div class="buddha-ring"></div>
    <div class="buddha-circle">
      <div class="buddha-emoji" id="buddhaEmoji">🧘</div>
    </div>
  </div>
  <div class="click-hint">点击佛像 · 积攒功德</div>

  <!-- 升级进度 -->
  <div class="progress-section">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>
    <div class="progress-label">
      <span id="progressCurrent">0 / 100</span>
      <span id="progressNext">下一品级：初修</span>
    </div>
  </div>

  <!-- 功能按钮 -->
  <div class="action-grid">
    <div class="action-btn" onclick="showFortuneModal()">
      <span class="icon">🔮</span>
      <span class="label">福报签</span>
      <span class="cost">消耗 30 功德</span>
    </div>
    <div class="action-btn" onclick="showUpgradeModal()">
      <span class="icon">✨</span>
      <span class="label">金身升级</span>
      <span class="cost">消耗功德</span>
    </div>
    <div class="action-btn" onclick="showWishModal()">
      <span class="icon">🪷</span>
      <span class="label">许愿池</span>
      <span class="cost">消耗 50 功德</span>
    </div>
  </div>

  <!-- 底部Tab -->
  <div class="tab-bar">
    <div class="tab-item active" onclick="switchTab(this,'home')">
      <span class="tab-icon">🏠</span>
      <span>积功德</span>
    </div>
    <div class="tab-item" onclick="switchTab(this,'body')">
      <span class="tab-icon">🧘</span>
      <span>金身</span>
    </div>
    <div class="tab-item" onclick="switchTab(this,'rank')">
      <span class="tab-icon">🏆</span>
      <span>榜单</span>
    </div>
    <div class="tab-item" onclick="switchTab(this,'me')">
      <span class="tab-icon">👤</span>
      <span>我的</span>
    </div>
  </div>
</div>

  { name: '职场佛陀', avatar: '🤴', merit: 96300 },
  { name: '躺平罗汉', avatar: '🦸', merit: 72100 },
  { name: '静心居士', avatar: '👨‍💼', merit: 54800 },
  { name: '划水真人', avatar: '🧑‍💻', merit: 41200 },
  { name: '佛系打工', avatar: '👩‍💼', merit: 33500 },
  { name: '禅定摸鱼', avatar: '🧑‍🎨', merit: 21700 },
  { name: '善哉善哉', avatar: '👨‍🔬', merit: 15400 },
  { name: '功德无量', avatar: '👩‍🏫', merit: 8900 },
  { name: '初出茅庐', avatar: '🧑‍🎓', merit: 3200 },
];

// ==================== 游戏状态 ====================
let state = {
  merit: 0,
  totalMerit: 0,
  level: 0,
  clickCount: 0,
  lastOnline: Date.now(),
  fortuneUsedToday: false,
  encounterCooldown: 0,
  buffs: [],
};

// 从 localStorage 加载 (仅用于demo持久化)
function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem('moyu_game'));
    if (saved) {
      Object.assign(state, saved);
      // 离线收益
      const offlineMs = Date.now() - state.lastOnline;
      const offlineMin = Math.min(offlineMs / 60000, 480); // 最多8小时
      if (offlineMin > 1) {
        const lv = LEVELS[state.level];
        const avg = (lv.min + lv.max) / 2 * lv.buff;
        const offlineMerit = Math.floor(avg * offlineMin * 0.3); // 离线效率30%
        if (offlineMerit > 0) {
          setTimeout(() => showOfflineReward(offlineMerit, offlineMin), 500);
        }
      }
    }
  } catch(e) {}
}
function saveState() {
  state.lastOnline = Date.now();
  localStorage.setItem('moyu_game', JSON.stringify(state));
}

// ==================== 核心点击 ====================
function handleClick(e) {
  const lv = LEVELS[state.level];
  let base = Math.floor(Math.random() * (lv.max - lv.min + 1)) + lv.min;
  let isCrit = false;

  // 暴击检测 (焦虑免疫 10%几率双倍)
  if (lv.skill === '焦虑免疫' && Math.random() < 0.1) { base *= 2; isCrit = true; }
  // 摸鱼护体 8%几率三倍
  if (lv.skill === '摸鱼护体' && Math.random() < 0.08) { base *= 3; isCrit = true; }

  state.merit += base;
  state.totalMerit += base;
  state.clickCount++;
  state.encounterCooldown--;

  // 飘字
  const rect = document.getElementById('buddhaArea').getBoundingClientRect();
  const x = e.clientX || (rect.left + rect.width / 2);
  const y = e.clientY || (rect.top + rect.height / 2);
  spawnFloatText(x, y, `+${base}`, isCrit);
  spawnPetals(x, y, isCrit ? 5 : 2);

  // 随缘奇遇
  if (state.encounterCooldown <= 0 && Math.random() < 0.03) {
    triggerEncounter();
    state.encounterCooldown = 30;
  }

  updateUI();
  saveState();
}

function spawnFloatText(x, y, text, isCrit) {
  const el = document.createElement('div');
  el.className = 'float-text' + (isCrit ? ' crit-text' : '');
  el.textContent = isCrit ? text + ' 暴击!' : text;
  el.style.left = (x + (Math.random() - 0.5) * 40) + 'px';
  el.style.top = (y - 20) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1200);
}

function spawnPetals(x, y, count) {
  const petalEmojis = ['🌸', '🪷', '✨', '💫', '🌺'];
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'petal';
    el.textContent = petalEmojis[Math.floor(Math.random() * petalEmojis.length)];
    el.style.left = (x + (Math.random() - 0.5) * 80) + 'px';
    el.style.top = (y - 30 + (Math.random() - 0.5) * 30) + 'px';
    el.style.animationDelay = (Math.random() * 0.3) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }
}

// ==================== 随缘奇遇 ====================
function triggerEncounter() {
  const enc = ENCOUNTERS[Math.floor(Math.random() * ENCOUNTERS.length)];
  let reward = enc.reward;
  if (enc.type === 'double') {
    const lv = LEVELS[state.level];
    reward = (lv.min + lv.max) * 2;
  }
  state.merit += reward;
  state.totalMerit += reward;

  const toast = document.createElement('div');
  toast.className = 'encounter-toast';
  toast.textContent = `${enc.text} +${reward} 功德`;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3200);
  updateUI();
}

// ==================== 杂念泡泡 ====================
function spawnDistraction() {
  const d = DISTRACTIONS[Math.floor(Math.random() * DISTRACTIONS.length)];
  const el = document.createElement('div');
  el.className = 'distraction-bubble';
  const lv = LEVELS[state.level];
  const reward = Math.floor(d.reward * lv.buff);
  el.innerHTML = `<span class="d-icon">${d.icon}</span><div><span>${d.text}</span><span class="d-reward">消除 +${reward}</span></div>`;

  // 随机位置 (在可视区域内)
  const maxX = window.innerWidth - 220;
  const maxY = window.innerHeight - 100;
  el.style.left = Math.max(20, Math.floor(Math.random() * maxX)) + 'px';
  el.style.top = Math.max(100, Math.floor(Math.random() * (maxY - 200) + 100)) + 'px';

  el.onclick = function(e) {
    e.stopPropagation();
    state.merit += reward;
    state.totalMerit += reward;
    spawnFloatText(e.clientX, e.clientY, `+${reward}`, false);
    spawnPetals(e.clientX, e.clientY, 3);
    el.classList.add('bubble-pop');
    setTimeout(() => el.remove(), 300);
    updateUI();
    saveState();
  };

  document.body.appendChild(el);
  // 5秒后自动消失
  setTimeout(() => {
    if (el.parentNode) {
      el.classList.add('bubble-pop');
      setTimeout(() => el.remove(), 300);
    }
  }, 5000);
}

// ==================== UI更新 ====================
function updateUI() {
  const lv = LEVELS[state.level];
  document.getElementById('meritDisplay').textContent = formatNum(state.merit);
  document.getElementById('buddhaEmoji').textContent = lv.emoji;
  document.getElementById('bodyName').textContent = lv.name;

  const minD = Math.floor(lv.min * lv.buff);
  const maxD = Math.floor(lv.max * lv.buff);
  document.getElementById('bodyLevel').textContent = `${lv.title} · 点击收益 ${minD}~${maxD}`;

  // 进度条
  if (lv.next !== null) {
    const progress = Math.min(state.merit / lv.next * 100, 100);
    document.getElementById('progressFill').style.width = progress + '%';
    document.getElementById('progressCurrent').textContent = `${formatNum(state.merit)} / ${formatNum(lv.next)}`;
    document.getElementById('progressNext').textContent = `下一品级：${LEVELS[state.level + 1].name}`;
  } else {
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('progressCurrent').textContent = '已圆满';
    document.getElementById('progressNext').textContent = '真佛圆满 · 万法归一';
  }

  // Buff栏
  const buffBar = document.getElementById('buffBar');
  buffBar.innerHTML = '';
  if (lv.buff > 1) {
    buffBar.innerHTML += `<span class="buff-tag">功德 ×${lv.buff}</span>`;
  }
  if (lv.skill) {
    buffBar.innerHTML += `<span class="buff-tag">${lv.skill}</span>`;
  }
  if (state.clickCount > 0) {
    buffBar.innerHTML += `<span class="buff-tag">已点 ${state.clickCount} 次</span>`;
  }
}

function formatNum(n) {
  if (n >= 10000) return (n / 10000).toFixed(1) + '万';
  return n.toLocaleString();
}

// ==================== 弹窗 ====================
function closeModal() {
  const overlay = document.querySelector('.modal-overlay');
  if (overlay) overlay.remove();
}

function showFortuneModal() {
  if (state.merit < 30) { showToast('功德不足，继续积功德吧~'); return; }
  state.merit -= 30;
  const f = FORTUNES[Math.floor(Math.random() * FORTUNES.length)];
  const bonus = Math.floor(Math.random() * 30) + 10;
  state.merit += bonus;
  state.totalMerit += bonus;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
  overlay.innerHTML = `
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h3>🔮 每日福报签</h3>
      <div class="fortune-card">
        <div class="fortune-type">${f.type}</div>
        <div class="fortune-text">${f.text}</div>
        <div class="fortune-desc">${f.desc}</div>
      </div>
      <p style="font-size:13px;color:var(--gold);">求签附赠 +${bonus} 功德</p>
      <button class="modal-btn" onclick="closeModal()">收下了</button>
    </div>`;
  document.body.appendChild(overlay);
  updateUI();
  saveState();
}

function showUpgradeModal() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };

  let gridHTML = '';
  LEVELS.forEach((lv, i) => {
    const isCurrent = i === state.level;
    const isLocked = i > state.level;
    const isDone = i < state.level;
    let cls = isCurrent ? 'current' : (isLocked ? 'locked' : '');
    let costText = isDone ? '已解锁' : (i === 0 ? '初始' : `需 ${formatNum(lv.cost)} 功德`);
    if (isCurrent) costText = '当前';
    gridHTML += `<div class="upgrade-item ${cls}" onclick="${isLocked && i === state.level + 1 ? `tryUpgrade(${i})` : ''}">
      <span class="u-emoji">${lv.emoji}</span>
      <span class="u-name">${lv.name}</span>
      <span class="u-cost">${costText}</span>
    </div>`;
  });

  overlay.innerHTML = `
    <div class="modal" style="max-width:400px;">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h3>✨ 金身养成</h3>
      <p style="font-size:13px;color:var(--text-dim);margin-bottom:8px;">消耗功德提升金身品级，永久增强收益</p>
      <div class="upgrade-grid">${gridHTML}</div>
      ${state.level < LEVELS.length - 1 ? `<p style="font-size:12px;color:var(--text-dim);margin-top:8px;">下一级需要消耗功德，当前: ${formatNum(state.merit)}</p>` : '<p style="color:var(--gold);font-weight:700;">已达真佛圆满！</p>'}
    </div>`;
  document.body.appendChild(overlay);
}

function tryUpgrade(targetLevel) {
  const lv = LEVELS[targetLevel];
  if (state.merit < lv.cost) {
    showToast(`功德不足，还需要 ${formatNum(lv.cost - state.merit)} 功德`);
    return;
  }
  state.merit -= lv.cost;
  state.level = targetLevel;
  closeModal();
  showUpgradeSuccessModal(lv);
  updateUI();
  saveState();
}

function showUpgradeSuccessModal(lv) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
  overlay.innerHTML = `
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div style="font-size:64px;margin-bottom:12px;">${lv.emoji}</div>
      <h3>金身突破！</h3>
      <p style="font-size:20px;font-weight:700;color:var(--gold-light);margin:8px 0;">${lv.name}</p>
      <p>功德收益提升至 <span style="color:var(--gold);font-weight:700;">×${lv.buff}</span></p>
      ${lv.skill ? `<p>解锁技能：<span style="color:var(--gold);font-weight:700;">${lv.skill}</span></p>` : ''}
      <button class="modal-btn" onclick="closeModal()">善哉善哉</button>
    </div>`;
  document.body.appendChild(overlay);
  // 庆祝花瓣
  for (let i = 0; i < 15; i++) {
    setTimeout(() => {
      spawnPetals(
        window.innerWidth / 2 + (Math.random() - 0.5) * 200,
        window.innerHeight / 2 + (Math.random() - 0.5) * 100,
        2
      );
    }, i * 100);
  }
}

function showWishModal() {
  if (state.merit < 50) { showToast('功德不足，继续积功德吧~'); return; }
  state.merit -= 50;
  const wish = WISHES[Math.floor(Math.random() * WISHES.length)];

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
  overlay.innerHTML = `
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h3>🪷 功德许愿池</h3>
      <div class="fortune-card" style="border-color:rgba(160,120,200,0.3);">
        <div class="fortune-type" style="color:var(--lotus-pink);">虔诚许愿</div>
        <div class="fortune-text" style="font-size:24px;">愿${wish}</div>
        <div class="fortune-desc">功德已化为愿力，佛光普照，心想事成。</div>
      </div>
      <p style="font-size:12px;color:var(--text-dim);">消耗 50 功德</p>
      <button class="modal-btn" onclick="closeModal()">心诚则灵</button>
    </div>`;
  document.body.appendChild(overlay);
  updateUI();
  saveState();
}

function showRankModal() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };

  // 插入玩家到榜单
  let rankList = [...FAKE_RANK];
  const playerEntry = { name: '我（摸鱼人）', avatar: LEVELS[state.level].emoji, merit: state.totalMerit, isPlayer: true };
  rankList.push(playerEntry);
  rankList.sort((a, b) => b.merit - a.merit);

  let html = '';
  rankList.slice(0, 10).forEach((r, i) => {
    const numCls = i === 0 ? 'top1' : (i === 1 ? 'top2' : (i === 2 ? 'top3' : ''));
    const style = r.isPlayer ? 'background:rgba(212,168,67,0.1);border-radius:8px;' : '';
    html += `<div class="rank-item" style="${style}">
      <span class="rank-num ${numCls}">${i + 1}</span>
      <span class="rank-avatar">${r.avatar}</span>
      <div class="rank-info">
        <div class="rank-name">${r.name}</div>
        <div class="rank-merit">累计 ${formatNum(r.merit)} 功德</div>
      </div>
    </div>`;
  });

  overlay.innerHTML = `
    <div class="modal" style="max-width:400px;">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h3>🏆 金身修为榜</h3>
      <div class="rank-list">${html}</div>
    </div>`;
  document.body.appendChild(overlay);
}

function showOfflineReward(amount, minutes) {
  state.merit += amount;
  state.totalMerit += amount;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
  overlay.innerHTML = `
    <div class="modal offline-reward">
      <h3>🌙 离线攒功德</h3>
      <p style="font-size:13px;color:var(--text-dim);">你离开了 ${Math.floor(minutes)} 分钟</p>
      <div class="reward-num">+${formatNum(amount)}</div>
      <p class="reward-time">离线期间自动积攒的功德</p>
      <button class="modal-btn" onclick="closeModal()">一键收取</button>
    </div>`;
  document.body.appendChild(overlay);
  updateUI();
  saveState();
}

function showToast(text) {
  const toast = document.createElement('div');
  toast.className = 'encounter-toast';
  toast.textContent = text;
  toast.style.background = 'rgba(60,40,80,0.95)';
  toast.style.color = 'var(--text)';
  toast.style.border = '1px solid rgba(212,168,67,0.3)';
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// ==================== Tab切换(简单占位) ====================
function switchTab(el, tab) {
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  if (tab === 'rank') showRankModal();
  if (tab === 'body') showUpgradeModal();
  if (tab === 'me') {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
    const lv = LEVELS[state.level];
    overlay.innerHTML = `
      <div class="modal">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div style="font-size:60px;margin:8px 0;">${lv.emoji}</div>
        <h3>摸鱼人</h3>
        <p style="color:var(--gold);font-weight:700;">${lv.name}</p>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:16px 0;text-align:center;">
          <div><div style="font-size:20px;font-weight:700;color:var(--gold-light);">${formatNum(state.totalMerit)}</div><div style="font-size:11px;color:var(--text-dim);">累计功德</div></div>
          <div><div style="font-size:20px;font-weight:700;color:var(--gold-light);">${state.clickCount}</div><div style="font-size:11px;color:var(--text-dim);">点击次数</div></div>
          <div><div style="font-size:20px;font-weight:700;color:var(--gold-light);">×${lv.buff}</div><div style="font-size:11px;color:var(--text-dim);">收益倍率</div></div>
        </div>
        <p style="font-size:12px;color:var(--text-dim);">称号：${state.totalMerit > 10000 ? '摸鱼圣贤' : (state.totalMerit > 3000 ? '职场善人' : '静心打工人')}</p>
        <button class="modal-btn" onclick="closeModal()">阿弥陀佛</button>
      </div>`;
    document.body.appendChild(overlay);
  }
}

// ==================== 背景粒子 ====================
function initBgCanvas() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let w, h, particles = [];

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < 40; i++) {
    particles.push({
      x: Math.random() * w, y: Math.random() * h,
      r: Math.random() * 2 + 0.5,
      dx: (Math.random() - 0.5) * 0.3,
      dy: -Math.random() * 0.3 - 0.1,
      alpha: Math.random() * 0.3 + 0.1,
    });
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(212,168,67,${p.alpha})`;
      ctx.fill();
      p.x += p.dx; p.y += p.dy;
      if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
      if (p.x < -10 || p.x > w + 10) p.x = Math.random() * w;
    });
    requestAnimationFrame(draw);
  }
  draw();
}

// ==================== 初始化 ====================
function init() {
  loadState();
  updateUI();
  initBgCanvas();

  // 定时生成杂念泡泡
  setInterval(() => {
    if (Math.random() < 0.4) spawnDistraction();
  }, 8000);
  // 首个杂念延迟出现
  setTimeout(() => spawnDistraction(), 3000);

  // 随机奇遇
  setInterval(() => {
    if (Math.random() < 0.15) triggerEncounter();
  }, 30000);
}

init();
</script>
