<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动漫人格鉴定所</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #f97316;
            --primary-light: #fb923c;
            --accent: #06b6d4;
            --bg-dark: #0f0c1d;
            --bg-card: #1e1b33;
            --bg-card-hover: #2a2647;
            --text: #f3f0ff;
            --text-dim: #9b94b8;
            --gold: #fbbf24;
            --type1: #ef4444;
            --type2: #3b82f6;
            --type3: #10b981;
            --type4: #a855f7;
            --radius: 16px;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(249,115,22,0.08), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(6,182,212,0.08), transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(168,85,247,0.05), transparent 50%);
        }

        .page { display: none; position: relative; z-index: 1; min-height: 100vh; }
        .page.active { display: flex; flex-direction: column; align-items: center; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .page-inner { max-width: 480px; width: 100%; padding: 20px 16px 40px; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 14px 32px; border: none; border-radius: 30px; font-size: 16px;
            font-weight: 600; cursor: pointer; transition: all 0.25s ease; color: #fff;
        }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(249,115,22,0.4); }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: var(--primary); color: #fff; }
        .btn-sm { padding: 10px 20px; font-size: 13px; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        /* ===== 首页 ===== */
        #pageHome .page-inner { text-align: center; padding-top: 60px; }
        .home-logo { font-size: 72px; margin-bottom: 16px; animation: pulse 2s ease infinite; }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        .home-title {
            font-size: 30px; font-weight: 800; margin-bottom: 12px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .home-desc { color: var(--text-dim); font-size: 15px; line-height: 1.8; margin-bottom: 32px; }

        .feature-cards { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 32px; }
        .feature-card {
            background: var(--bg-card); border-radius: 12px; padding: 18px 8px; text-align: center;
        }
        .feature-card .fc-icon { font-size: 28px; margin-bottom: 6px; }
        .feature-card .fc-text { font-size: 11px; color: var(--text-dim); line-height: 1.4; }

        /* ===== 答题页 ===== */
        #pageQuiz .page-inner { padding-top: 30px; }
        .quiz-progress-bar {
            width: 100%; height: 6px; background: var(--bg-card); border-radius: 3px;
            margin-bottom: 8px; overflow: hidden;
        }
        .quiz-progress-fill {
            height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 3px; transition: width 0.4s ease;
        }
        .quiz-progress-text { text-align: center; font-size: 12px; color: var(--text-dim); margin-bottom: 24px; }

        .quiz-question {
            font-size: 20px; font-weight: 700; line-height: 1.6; margin-bottom: 24px; text-align: center;
        }
        .quiz-question .q-scene { font-size: 14px; color: var(--text-dim); font-weight: 400; margin-bottom: 8px; }

        .quiz-options { display: flex; flex-direction: column; gap: 12px; }
        .quiz-option {
            background: var(--bg-card); border-radius: 14px; padding: 18px 20px;
            cursor: pointer; transition: all 0.25s ease; border: 2px solid transparent;
            font-size: 15px; line-height: 1.5; display: flex; align-items: center; gap: 12px;
        }
        .quiz-option:hover { background: var(--bg-card-hover); transform: translateX(4px); }
        .quiz-option .opt-marker {
            width: 28px; height: 28px; border-radius: 50%; background: var(--bg-dark);
            display: flex; align-items: center; justify-content: center; font-size: 13px;
            font-weight: 700; color: var(--text-dim); flex-shrink: 0;
        }
        .quiz-option.selected { border-color: var(--primary); background: rgba(249,115,22,0.1); }
        .quiz-option.selected .opt-marker { background: var(--primary); color: #fff; }

        .quiz-nav { display: flex; justify-content: space-between; margin-top: 24px; }

        /* ===== 结果页 ===== */
        #pageResult .page-inner { padding-top: 30px; }
        .result-hero { text-align: center; margin-bottom: 24px; }
        .result-hero .hero-avatar {
            font-size: 80px; margin-bottom: 8px;
            animation: bounceIn 0.7s ease;
        }
        @keyframes bounceIn { 0% { transform: scale(0) rotate(-30deg); } 60% { transform: scale(1.2) rotate(10deg); } 100% { transform: scale(1) rotate(0); } }
        .result-hero .hero-label { font-size: 13px; color: var(--text-dim); margin-bottom: 4px; }
        .result-hero .hero-name { font-size: 26px; font-weight: 800; margin-bottom: 4px; }
        .result-hero .hero-anime { font-size: 14px; color: var(--text-dim); }

        .type-badge {
            display: inline-block; padding: 6px 18px; border-radius: 20px;
            font-size: 13px; font-weight: 600; margin: 12px auto 0;
        }

        .match-ring {
            width: 120px; height: 120px; margin: 0 auto 20px; position: relative;
        }
        .match-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .match-ring .track { fill: none; stroke: var(--bg-card); stroke-width: 7; }
        .match-ring .progress {
            fill: none; stroke-width: 7; stroke-linecap: round;
            transition: stroke-dashoffset 1.2s ease;
        }
        .match-ring .match-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            font-size: 28px; font-weight: 800;
        }
        .match-ring .match-label {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, calc(-50% + 24px));
            font-size: 11px; color: var(--text-dim);
        }

        .dim-radar { margin: 20px 0; }
        .dim-radar svg { width: 100%; max-width: 280px; display: block; margin: 0 auto; }

        .personality-desc {
            background: var(--bg-card); border-radius: var(--radius); padding: 20px; margin: 20px 0;
        }
        .personality-desc h3 { font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        .personality-desc p { font-size: 14px; line-height: 1.8; color: var(--text-dim); }

        .traits-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
        .trait-item {
            background: var(--bg-card); border-radius: 12px; padding: 14px; text-align: center;
        }
        .trait-item .ti-icon { font-size: 24px; margin-bottom: 4px; }
        .trait-item .ti-label { font-size: 11px; color: var(--text-dim); margin-bottom: 2px; }
        .trait-item .ti-value { font-size: 14px; font-weight: 600; }

        .compatible-section { margin: 20px 0; }
        .compatible-section h3 { font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        .compatible-list { display: flex; gap: 10px; flex-wrap: wrap; }
        .compatible-card {
            background: var(--bg-card); border-radius: 12px; padding: 12px 16px;
            display: flex; align-items: center; gap: 8px;
        }
        .compatible-card .cc-avatar { font-size: 24px; }
        .compatible-card .cc-info .cc-name { font-size: 13px; font-weight: 600; }
        .compatible-card .cc-info .cc-tag { font-size: 11px; color: var(--text-dim); }

        .result-actions { display: flex; gap: 12px; justify-content: center; margin-top: 28px; }

        /* ===== 分享弹窗 ===== */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.65); z-index: 100; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-card); border-radius: var(--radius); padding: 28px;
            max-width: 380px; width: 100%; text-align: center;
            animation: fadeIn 0.3s ease;
        }
        .modal h2 { font-size: 18px; margin-bottom: 16px; }
        .share-preview {
            background: var(--bg-dark); border-radius: 12px; padding: 20px;
            margin-bottom: 20px; text-align: left; font-size: 13px; line-height: 1.8;
        }
        .share-preview .sp-title {
            font-size: 16px; font-weight: 700; margin-bottom: 10px; text-align: center;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .modal-actions { display: flex; gap: 10px; justify-content: center; }

        .toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); color: #333; padding: 10px 24px;
            border-radius: 20px; font-size: 14px; font-weight: 500; z-index: 200;
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .toast.show { opacity: 1; }

        @media (max-width: 400px) {
            .home-title { font-size: 24px; }
            .quiz-question { font-size: 18px; }
        }
    </style>
</head>
<body>

<div class="bg-glow"></div>

<!-- ============ 首页 ============ -->
<div class="page active" id="pageHome">
    <div class="page-inner">
        <div class="home-logo">🎭</div>
        <h1 class="home-title">动漫人格鉴定所</h1>
        <p class="home-desc">
            8道趣味情境题<br>
            测出你的灵魂深处的动漫人格<br>
            你到底像哪个动漫角色？
        </p>
        <div class="feature-cards">
            <div class="feature-card">
                <div class="fc-icon">📝</div>
                <div class="fc-text">趣味<br>情境题</div>
            </div>
            <div class="feature-card">
                <div class="fc-icon">🎯</div>
                <div class="fc-text">精准<br>角色匹配</div>
            </div>
            <div class="feature-card">
                <div class="fc-icon">📤</div>
                <div class="fc-text">一键<br>分享</div>
            </div>
        </div>
        <button class="btn btn-primary" id="btnStart">开始鉴定</button>
    </div>
</div>

<!-- ============ 答题页 ============ -->
<div class="page" id="pageQuiz">
    <div class="page-inner">
        <div class="quiz-progress-bar">
            <div class="quiz-progress-fill" id="progressFill" style="width:0%"></div>
        </div>
        <div class="quiz-progress-text" id="progressText">第 1 / 8 题</div>

        <div class="quiz-question" id="quizQuestion"></div>
        <div class="quiz-options" id="quizOptions"></div>

        <div class="quiz-nav">
            <button class="btn btn-outline btn-sm" id="btnPrev" disabled>上一题</button>
            <button class="btn btn-primary btn-sm" id="btnNext" disabled>下一题</button>
        </div>
    </div>
</div>

<!-- ============ 结果页 ============ -->
<div class="page" id="pageResult">
    <div class="page-inner">
        <div class="result-hero">
            <div class="hero-avatar" id="heroAvatar"></div>
            <div class="hero-label">你的人格鉴定结果</div>
            <div class="hero-name" id="heroName"></div>
            <div class="hero-anime" id="heroAnime"></div>
            <div class="type-badge" id="typeBadge"></div>
        </div>

        <div class="match-ring">
            <svg viewBox="0 0 120 120">
                <circle class="track" cx="60" cy="60" r="52" />
                <circle class="progress" id="matchCircle" cx="60" cy="60" r="52"
                    stroke-dasharray="326.73" stroke-dashoffset="326.73" />
            </svg>
            <div class="match-text" id="matchText">0%</div>
            <div class="match-label">匹配度</div>
        </div>

        <div class="dim-radar" id="dimRadar"></div>

        <div class="personality-desc" id="personalityDesc"></div>

        <div class="traits-grid" id="traitsGrid"></div>

        <div class="compatible-section">
            <h3>💫 灵魂契合的角色</h3>
            <div class="compatible-list" id="compatibleList"></div>
        </div>

        <div class="result-actions">
            <button class="btn btn-outline btn-sm" id="btnShare">分享结果</button>
            <button class="btn btn-primary btn-sm" id="btnRetry">再测一次</button>
        </div>
    </div>
</div>

<!-- 分享弹窗 -->
<div class="modal-overlay" id="shareModal">
    <div class="modal">
        <h2>分享鉴定结果</h2>
        <div class="share-preview" id="sharePreview"></div>
        <div class="modal-actions">
            <button class="btn btn-primary btn-sm" id="btnCopyShare">复制文案</button>
            <button class="btn btn-outline btn-sm" id="btnCloseModal">关闭</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== 人格类型 =====
const TYPES = {
    passionate: { id:'passionate', name:'热血冒险型', color:'var(--type1)', desc:'天生充满热情与正义感，遇到困难从不退缩。你像太阳一样温暖身边的人，永远在追逐梦想的路上。团队中你是冲锋者，用行动感染他人。' },
    strategic:  { id:'strategic',  name:'冷静智慧型', color:'var(--type2)', desc:'理性思考，善于分析，总能在复杂局面中找到最优解。你不轻易表露情感，但内心有坚定的信念。面对挑战时，你靠脑力取胜。' },
    gentle:     { id:'gentle',     name:'治愈温柔型', color:'var(--type3)', desc:'温柔体贴，善于倾听，是朋友们最信赖的港湾。你不喜欢冲突，总是用善意化解矛盾。你的存在本身就是一种治愈的力量。' },
    independent:{ id:'independent', name:'独立强者型', color:'var(--type4)', desc:'独立自主，内心强大，习惯独自面对一切。你不需要他人的认可，有自己坚定的价值观。沉默寡言但实力惊人，关键时刻总能力挽狂澜。' },
};

// ===== 角色 =====
const CHARACTERS = [
    { id:'naruto',  name:'漩涡鸣人', avatar:'🦊', anime:'火影忍者',    type:'passionate',  traits:{ 热情:90, 勇气:85, 乐观:95, 坚持:88 } },
    { id:'luffy',   name:'蒙奇·D·路飞', avatar:'🏴‍☠️', anime:'海贼王',  type:'passionate',  traits:{ 热情:95, 勇气:92, 乐观:90, 坚持:85 } },
    { id:'conan',   name:'工藤新一', avatar:'🔍', anime:'名侦探柯南', type:'strategic',   traits:{ 智慧:95, 冷静:88, 观察:92, 正义:80 } },
    { id:'levi',    name:'利威尔',   avatar:'🗡️', anime:'进击的巨人', type:'strategic',   traits:{ 智慧:85, 冷静:95, 实力:92, 责任:88 } },
    { id:'totoro',  name:'龙猫',     avatar:'🐱', anime:'龙猫',       type:'gentle',      traits:{ 温柔:95, 治愈:95, 纯真:90, 安心:92 } },
    { id:'rem',     name:'蕾姆',     avatar:'💙', anime:'Re:Zero',    type:'gentle',      traits:{ 温柔:90, 忠诚:95, 善良:92, 勇敢:85 } },
    { id:'saitama', name:'埼玉',     avatar:'👊', anime:'一拳超人',   type:'independent', traits:{ 实力:100, 独立:90, 淡然:95, 正义:82 } },
    { id:'saber',   name:'Saber',    avatar:'⚔️', anime:'Fate',       type:'independent', traits:{ 实力:92, 独立:88, 荣耀:95, 责任:90 } },
];

// ===== 题目 =====
const QUESTIONS = [
    {
        scene: '清晨闹钟响了',
        question: '周末早晨被闹钟吵醒，你的第一反应是？',
        options: [
            { text: '立刻起床！新的一天充满了可能性', type:'passionate' },
            { text: '关掉闹钟，在脑中规划今天的时间安排', type:'strategic' },
            { text: '再赖一会儿床，享受被窝的温暖', type:'gentle' },
            { text: '直接关掉，想睡到几点就几点', type:'independent' },
        ]
    },
    {
        scene: '朋友遇到困难',
        question: '好朋友陷入困境来找你，你会？',
        options: [
            { text: '二话不说冲过去帮忙，干就完了', type:'passionate' },
            { text: '先了解情况，帮他分析最优解决方案', type:'strategic' },
            { text: '陪在他身边，听他倾诉，给他安慰', type:'gentle' },
            { text: '告诉他该怎么做，让他自己解决', type:'independent' },
        ]
    },
    {
        scene: '团队出现分歧',
        question: '团队合作时大家意见不统一，你倾向于？',
        options: [
            { text: '用热情感染大家，带领团队往前冲', type:'passionate' },
            { text: '列出利弊分析，用逻辑说服大家', type:'strategic' },
            { text: '居中调解，找到一个让大家都满意的方案', type:'gentle' },
            { text: '坚持自己的判断，按自己的方式做', type:'independent' },
        ]
    },
    {
        scene: '面对全新挑战',
        question: '遇到从没做过的困难任务，你的态度是？',
        options: [
            { text: '兴奋！越难越有意思，冲就对了', type:'passionate' },
            { text: '先研究方法论，制定详细计划再动手', type:'strategic' },
            { text: '找有经验的人请教，慢慢来不着急', type:'gentle' },
            { text: '独自摸索，相信自己能搞定', type:'independent' },
        ]
    },
    {
        scene: '社交聚会中',
        question: '在一群人的聚会中，你通常是？',
        options: [
            { text: '气氛担当，带动全场嗨起来', type:'passionate' },
            { text: '跟几个人深度聊天，聊感兴趣的话题', type:'strategic' },
            { text: '照顾每个人的感受，确保没人被冷落', type:'gentle' },
            { text: '找个安静的角落，待得不舒服就先走', type:'independent' },
        ]
    },
    {
        scene: '做了一个重要决定',
        question: '做重大决定时，你最看重什么？',
        options: [
            { text: '直觉和热情，跟着心走', type:'passionate' },
            { text: '数据和逻辑，理性分析利弊', type:'strategic' },
            { text: '会不会影响别人的感受', type:'gentle' },
            { text: '是否符合自己的原则和底线', type:'independent' },
        ]
    },
    {
        scene: '遭遇失败时',
        question: '努力了很久却失败了，你会？',
        options: [
            { text: '哭一场然后重新出发，下次一定行', type:'passionate' },
            { text: '复盘总结失败原因，找到改进点', type:'strategic' },
            { text: '找朋友倾诉，需要被安慰和鼓励', type:'gentle' },
            { text: '默默消化，不需要别人帮忙', type:'independent' },
        ]
    },
    {
        scene: '理想的生活状态',
        question: '你心目中最理想的生活状态是？',
        options: [
            { text: '每天都在追逐梦想，充满激情和冒险', type:'passionate' },
            { text: '一切井井有条，持续成长和进步', type:'strategic' },
            { text: '和爱的人在一起，平平淡淡才是真', type:'gentle' },
            { text: '自由自在，不受束缚地活出自己', type:'independent' },
        ]
    },
];

// ===== 状态 =====
let currentQ = 0;
let answers = []; // 每题选的type
let scores = { passionate:0, strategic:0, gentle:0, independent:0 };

// ===== 工具 =====
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    window.scrollTo(0, 0);
}

// ===== 答题逻辑 =====
function renderQuestion() {
    const q = QUESTIONS[currentQ];
    const progress = ((currentQ + 1) / QUESTIONS.length) * 100;

    document.getElementById('progressFill').style.width = progress + '%';
    document.getElementById('progressText').textContent = `第 ${currentQ + 1} / ${QUESTIONS.length} 题`;

    document.getElementById('quizQuestion').innerHTML =
        `<div class="q-scene">${q.scene}</div>${q.question}`;

    const container = document.getElementById('quizOptions');
    container.innerHTML = q.options.map((opt, i) => `
        <div class="quiz-option${answers[currentQ] === opt.type ? ' selected' : ''}" data-type="${opt.type}" data-idx="${i}">
            <div class="opt-marker">${String.fromCharCode(65 + i)}</div>
            <div>${opt.text}</div>
        </div>
    `).join('');

    container.querySelectorAll('.quiz-option').forEach(el => {
        el.addEventListener('click', () => {
            container.querySelectorAll('.quiz-option').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
            answers[currentQ] = el.dataset.type;
            document.getElementById('btnNext').disabled = false;
        });
    });

    // 按钮状态
    document.getElementById('btnPrev').disabled = currentQ === 0;
    const isLast = currentQ === QUESTIONS.length - 1;
    document.getElementById('btnNext').textContent = isLast ? '查看结果' : '下一题';
    document.getElementById('btnNext').disabled = !answers[currentQ];
}

function calcResult() {
    scores = { passionate:0, strategic:0, gentle:0, independent:0 };
    answers.forEach(a => { if (a) scores[a]++; });

    // 找最高分类型
    let winnerType = 'passionate';
    let maxScore = 0;
    Object.entries(scores).forEach(([type, s]) => {
        if (s > maxScore) { maxScore = s; winnerType = type; }
    });

    // 在该类型中找最匹配角色（取第一个）
    const matchChar = CHARACTERS.find(c => c.type === winnerType);
    const matchPercent = Math.round((maxScore / QUESTIONS.length) * 100);

    showResult(matchChar, winnerType, matchPercent);
}

// ===== 结果页 =====
function showResult(char, type, matchPercent) {
    const typeInfo = TYPES[type];

    // 头部
    document.getElementById('heroAvatar').textContent = char.avatar;
    document.getElementById('heroName').textContent = char.name;
    document.getElementById('heroAnime').textContent = '《' + char.anime + '》';
    const badge = document.getElementById('typeBadge');
    badge.textContent = typeInfo.name;
    badge.style.background = typeInfo.color + '22';
    badge.style.color = typeInfo.color;

    // 匹配度环
    const circumference = 2 * Math.PI * 52;
    const offset = circumference * (1 - matchPercent / 100);
    const circle = document.getElementById('matchCircle');
    circle.style.stroke = typeInfo.color;
    circle.style.strokeDasharray = circumference;
    circle.style.strokeDashoffset = circumference;
    requestAnimationFrame(() => { circle.style.strokeDashoffset = offset; });

    // 匹配度数字动画
    const matchEl = document.getElementById('matchText');
    matchEl.style.color = typeInfo.color;
    let cur = 0;
    const step = () => {
        cur += 2;
        if (cur > matchPercent) cur = matchPercent;
        matchEl.textContent = cur + '%';
        if (cur < matchPercent) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);

    // 雷达图
    drawRadar(char);

    // 人格描述
    document.getElementById('personalityDesc').innerHTML = `
        <h3>🧠 人格分析</h3>
        <p>${typeInfo.desc}</p>
    `;

    // 特质卡片
    document.getElementById('traitsGrid').innerHTML = Object.entries(char.traits).map(([k, v]) => `
        <div class="trait-item">
            <div class="ti-icon">${traitIcon(k)}</div>
            <div class="ti-label">${k}</div>
            <div class="ti-value" style="color:${typeInfo.color}">${v}</div>
        </div>
    `).join('');

    // 契合角色（同类型其他角色 + 1个不同类型）
    const compatible = CHARACTERS.filter(c => c.type === type && c.id !== char.id);
    const other = CHARACTERS.filter(c => c.type !== type);
    if (compatible.length > 0) {
        compatible.push(other[0]);
    } else {
        compatible.push(other[0], other[1]);
    }
    document.getElementById('compatibleList').innerHTML = compatible.slice(0, 3).map(c => `
        <div class="compatible-card">
            <div class="cc-avatar">${c.avatar}</div>
            <div class="cc-info">
                <div class="cc-name">${c.name}</div>
                <div class="cc-tag">${TYPES[c.type].name}</div>
            </div>
        </div>
    `).join('');

    showPage('pageResult');
}

function traitIcon(name) {
    const icons = { 热情:'🔥', 勇气:'⚡', 乐观:'☀️', 坚持:'💪', 智慧:'🧠', 冷静:'❄️',
        观察:'👁️', 正义:'⚖️', 实力:'💯', 责任:'🛡️', 温柔:'🌸', 治愈:'💚',
        纯真:'✨', 安心:'🫧', 忠诚:'💎', 善良:'🤍', 勇敢:'🏹', 独立:'🐺',
        淡然:'🍃', 荣耀:'👑' };
    return icons[name] || '⭐';
}

// ===== 雷达图 =====
function drawRadar(char) {
    const traits = Object.keys(char.traits);
    const values = Object.values(char.traits);
    const n = traits.length;
    const cx = 140, cy = 130, maxR = 90;

    // 多边形顶点
    const points = [];
    const labelPoints = [];
    for (let i = 0; i < n; i++) {
        const angle = (Math.PI * 2 / n) * i - Math.PI / 2;
        const r = (values[i] / 100) * maxR;
        points.push([cx + r * Math.cos(angle), cy + r * Math.sin(angle)]);
        labelPoints.push([cx + (maxR + 18) * Math.cos(angle), cy + (maxR + 18) * Math.sin(angle)]);
    }

    // 背景网格（3层）
    let gridSvg = '';
    for (let layer = 1; layer <= 3; layer++) {
        const lr = (maxR / 3) * layer;
        const lp = [];
        for (let i = 0; i < n; i++) {
            const angle = (Math.PI * 2 / n) * i - Math.PI / 2;
            lp.push(`${cx + lr * Math.cos(angle)},${cy + lr * Math.sin(angle)}`);
        }
        gridSvg += `<polygon points="${lp.join(' ')}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>`;
    }

    // 轴线
    let axesSvg = '';
    for (let i = 0; i < n; i++) {
        const angle = (Math.PI * 2 / n) * i - Math.PI / 2;
        axesSvg += `<line x1="${cx}" y1="${cy}" x2="${cx + maxR * Math.cos(angle)}" y2="${cy + maxR * Math.sin(angle)}" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>`;
    }

    // 数据多边形
    const polyPoints = points.map(p => p.join(',')).join(' ');
    const typeColor = TYPES[char.type].color;

    // 标签
    let labelsSvg = '';
    for (let i = 0; i < n; i++) {
        labelsSvg += `<text x="${labelPoints[i][0]}" y="${labelPoints[i][1]}" fill="var(--text-dim)" font-size="11" text-anchor="middle" dominant-baseline="middle">${traits[i]}</text>`;
    }

    document.getElementById('dimRadar').innerHTML = `
        <svg viewBox="0 0 280 260">
            ${gridSvg}
            ${axesSvg}
            <polygon points="${polyPoints}" fill="${typeColor}33" stroke="${typeColor}" stroke-width="2" stroke-linejoin="round"/>
            ${points.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${typeColor}"/>`).join('')}
            ${labelsSvg}
        </svg>
    `;
}

// ===== 分享 =====
function buildShareText() {
    const char = CHARACTERS.find(c => c.id === currentResultCharId);
    const typeInfo = TYPES[char.type];
    const traitLines = Object.entries(char.traits).map(([k,v]) => `${traitIcon(k)} ${k}：${v}`).join('\n');
    const scoreLines = Object.entries(scores).map(([k,v]) => `${TYPES[k].name}：${v}题`).join('  ');
    return `🎭 动漫人格鉴定所\n\n我的灵魂角色是——\n${char.avatar} ${char.name}《${char.anime}》\n🏷️ ${typeInfo.name}\n\n${traitLines}\n\n📊 各类型倾向：\n${scoreLines}\n\n来测测你最像哪个动漫角色吧！`;
}

let currentResultCharId = null;

// ===== 初始化 =====
function init() {
    document.getElementById('btnStart').addEventListener('click', () => {
        currentQ = 0;
        answers = [];
        showPage('pageQuiz');
        renderQuestion();
    });

    document.getElementById('btnNext').addEventListener('click', () => {
        if (currentQ < QUESTIONS.length - 1) {
            currentQ++;
            renderQuestion();
        } else {
            calcResult();
        }
    });

    document.getElementById('btnPrev').addEventListener('click', () => {
        if (currentQ > 0) {
            currentQ--;
            renderQuestion();
        }
    });

    document.getElementById('btnRetry').addEventListener('click', () => {
        currentQ = 0;
        answers = [];
        showPage('pageHome');
    });

    // 分享
    document.getElementById('btnShare').addEventListener('click', () => {
        const preview = document.getElementById('sharePreview');
        preview.innerHTML = `<div class="sp-title">🎭 动漫人格鉴定所</div>` +
            buildShareText().replace(/\n/g, '<br>');
        document.getElementById('shareModal').classList.add('active');
    });

    document.getElementById('btnCloseModal').addEventListener('click', () => {
        document.getElementById('shareModal').classList.remove('active');
    });

    document.getElementById('btnCopyShare').addEventListener('click', () => {
        const text = buildShareText();
        navigator.clipboard.writeText(text).then(() => {
            showToast('已复制到剪贴板！');
            document.getElementById('shareModal').classList.remove('active');
        }).catch(() => {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('已复制到剪贴板！');
            document.getElementById('shareModal').classList.remove('active');
        });
    });

    document.getElementById('shareModal').addEventListener('click', e => {
        if (e.target === e.currentTarget) e.currentTarget.classList.remove('active');
    });
}

// 重写 calcResult 以记录 charId
const _origCalc = calcResult;
calcResult = function() {
    scores = { passionate:0, strategic:0, gentle:0, independent:0 };
    answers.forEach(a => { if (a) scores[a]++; });
    let winnerType = 'passionate';
    let maxScore = 0;
    Object.entries(scores).forEach(([type, s]) => {
        if (s > maxScore) { maxScore = s; winnerType = type; }
    });
    const matchChar = CHARACTERS.find(c => c.type === winnerType);
    currentResultCharId = matchChar.id;
    const matchPercent = Math.round((maxScore / QUESTIONS.length) * 100);
    showResult(matchChar, winnerType, matchPercent);
};

document.addEventListener('DOMContentLoaded', init);
</script>
