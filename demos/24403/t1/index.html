<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D机械臂控制系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --accent-blue: #00d4ff;
            --accent-orange: #ff6b35;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --glass-bg: rgba(22, 33, 62, 0.7);
            --glass-border: rgba(0, 212, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .scene-container {
            flex: 0 0 70%;
            position: relative;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #0f0f1a 100%);
        }

        #canvas-container {
            width: 100%;
            height: 100%;
        }

        .title-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            font-family: 'Orbitron', sans-serif;
            z-index: 10;
        }

        .title-overlay h1 {
            font-size: 24px;
            color: var(--accent-blue);
            text-shadow: 0 0 20px var(--accent-blue);
            letter-spacing: 3px;
        }

        .title-overlay .subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 5px;
            letter-spacing: 2px;
        }

        .control-panel {
            flex: 0 0 30%;
            background: var(--bg-secondary);
            padding: 20px;
            overflow-y: auto;
            border-left: 1px solid var(--glass-border);
        }

        .panel-section {
            margin-bottom: 25px;
        }

        .panel-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: var(--accent-blue);
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--glass-border);
            letter-spacing: 2px;
        }

        .mode-switch {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 12px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-secondary);
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(0, 212, 255, 0.1));
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        .mode-btn:hover:not(.active) {
            border-color: var(--accent-blue);
            color: var(--text-primary);
        }

        .joint-control {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .joint-control:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
        }

        .joint-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .joint-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .joint-icon {
            width: 18px;
            height: 18px;
            fill: var(--accent-blue);
        }

        .joint-angle {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            color: var(--accent-orange);
            background: rgba(255, 107, 53, 0.15);
            padding: 3px 8px;
            border-radius: 4px;
        }

        .joint-range {
            font-size: 10px;
            color: var(--text-secondary);
            margin-left: 26px;
            margin-top: -4px;
            margin-bottom: 6px;
        }

        .slider-container {
            position: relative;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: linear-gradient(to right, var(--accent-blue) 0%, var(--accent-blue) var(--value), #333 var(--value), #333 100%);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--accent-blue);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-blue);
            transition: all 0.2s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 15px var(--accent-blue);
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--accent-blue);
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px var(--accent-blue);
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .preset-btn {
            padding: 14px 10px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .preset-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .preset-btn:hover::before {
            left: 100%;
        }

        .preset-btn:hover {
            border-color: var(--accent-blue);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.3);
        }

        .preset-btn:active {
            transform: translateY(0);
        }

        .preset-btn.highlight {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.3), rgba(0, 212, 255, 0.1));
            border-color: var(--accent-blue);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff00;
            animation: pulse 1.5s infinite;
        }

        .status-dot.auto {
            background: var(--accent-orange);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 5px currentColor; }
            50% { opacity: 0.5; box-shadow: 0 0 15px currentColor; }
        }

        .status-text {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid var(--glass-border);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 20px;
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-blue);
            letter-spacing: 3px;
        }

        .constraint-warning {
            font-size: 10px;
            color: #ff4444;
            margin-left: 4px;
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }
            .scene-container {
                flex: 0 0 50%;
            }
            .control-panel {
                flex: 0 0 50%;
                border-left: none;
                border-top: 1px solid var(--glass-border);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="scene-container">
            <div class="title-overlay">
                <h1>MECHANICAL ARM</h1>
                <div class="subtitle">6-DOF INDUSTRIAL ROBOT ARM</div>
            </div>
            <div id="canvas-container"></div>
            <div class="loading-overlay" id="loading">
                <div class="loading-spinner"></div>
                <div class="loading-text">LOADING...</div>
            </div>
        </div>
        <div class="control-panel">
            <div class="panel-section">
                <div class="panel-title">系统状态</div>
                <div class="status-indicator">
                    <div class="status-dot" id="statusDot"></div>
                    <span class="status-text" id="statusText">待机中</span>
                </div>
                <div class="mode-switch">
                    <button class="mode-btn active" id="manualBtn" onclick="setMode('manual')">手动控制</button>
                    <button class="mode-btn" id="autoBtn" onclick="setMode('auto')">自动演示</button>
                </div>
            </div>

            <div class="panel-section">
                <div class="panel-title">关节控制 <span style="color: var(--text-secondary); font-size: 10px;">(带约束限制)</span></div>

                <div class="joint-control" data-joint="shoulderRotation">
                    <div class="joint-label">
                        <span class="joint-name">
                            <svg class="joint-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><path d="M15.5 11c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zM8.5 11c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zM12 6c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6z"/></svg>
                            肩部旋转
                        </span>
                        <span class="joint-angle" id="shoulderRotationAngle">0°</span>
                    </div>
                    <div class="joint-range">范围: -90° ~ +90° (Y轴)</div>
                    <div class="slider-container">
                        <input type="range" id="shoulderRotation" min="-90" max="90" value="0" data-unit="°" oninput="updateJoint('shoulderRotation', this.value)">
                    </div>
                </div>

                <div class="joint-control" data-joint="shoulderPitch">
                    <div class="joint-label">
                        <span class="joint-name">
                            <svg class="joint-icon" viewBox="0 0 24 24"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>
                            肩部俯仰
                        </span>
                        <span class="joint-angle" id="shoulderPitchAngle">0°</span>
                    </div>
                    <div class="joint-range">范围: -30° ~ +120° (Z轴)</div>
                    <div class="slider-container">
                        <input type="range" id="shoulderPitch" min="-30" max="120" value="0" data-unit="°" oninput="updateJoint('shoulderPitch', this.value)">
                    </div>
                </div>

                <div class="joint-control" data-joint="elbowBend">
                    <div class="joint-label">
                        <span class="joint-name">
                            <svg class="joint-icon" viewBox="0 0 24 24"><path d="M21 3H3v18h18V3zM12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
                            肘部弯曲
                        </span>
                        <span class="joint-angle" id="elbowBendAngle">0°</span>
                    </div>
                    <div class="joint-range">范围: 0° ~ +150° (Z轴)</div>
                    <div class="slider-container">
                        <input type="range" id="elbowBend" min="0" max="150" value="0" data-unit="°" oninput="updateJoint('elbowBend', this.value)">
                    </div>
                </div>

                <div class="joint-control" data-joint="wristRotation">
                    <div class="joint-label">
                        <span class="joint-name">
                            <svg class="joint-icon" viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
                            腕部旋转
                        </span>
                        <span class="joint-angle" id="wristRotationAngle">0°</span>
                    </div>
                    <div class="joint-range">范围: -90° ~ +90° (Y轴)</div>
                    <div class="slider-container">
                        <input type="range" id="wristRotation" min="-90" max="90" value="0" data-unit="°" oninput="updateJoint('wristRotation', this.value)">
                    </div>
                </div>

                <div class="joint-control" data-joint="wristPitch">
                    <div class="joint-label">
                        <span class="joint-name">
                            <svg class="joint-icon" viewBox="0 0 24 24"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>
                            腕部俯仰
                        </span>
                        <span class="joint-angle" id="wristPitchAngle">0°</span>
                    </div>
                    <div class="joint-range">范围: -45° ~ +45° (Z轴)</div>
                    <div class="slider-container">
                        <input type="range" id="wristPitch" min="-45" max="45" value="0" data-unit="°" oninput="updateJoint('wristPitch', this.value)">
                    </div>
                </div>

                <div class="joint-control" data-joint="gripperOpen">
                    <div class="joint-label">
                        <span class="joint-name">
                            <svg class="joint-icon" viewBox="0 0 24 24"><path d="M9 3L5 6.99h3V14H5l4 3.99L13 14h-3V6.99h3L9 3zm7 14.01V10h-3v7.01h3z"/></svg>
                            夹爪开合
                        </span>
                        <span class="joint-angle" id="gripperOpenAngle">0°</span>
                    </div>
                    <div class="joint-range">范围: 0° ~ +45°</div>
                    <div class="slider-container">
                        <input type="range" id="gripperOpen" min="0" max="45" value="0" data-unit="°" oninput="updateJoint('gripperOpen', this.value)">
                    </div>
                </div>
            </div>

            <div class="panel-section">
                <div class="panel-title">预设动作</div>
                <div class="preset-grid">
                    <button class="preset-btn" onclick="setPreset('home')">归位</button>
                    <button class="preset-btn" onclick="setPreset('lift')">举起</button>
                    <button class="preset-btn" onclick="setPreset('extend')">伸展</button>
                    <button class="preset-btn" onclick="setPreset('grab')">抓取</button>
                    <button class="preset-btn" onclick="setPreset('lower')">下放</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <script>
        // 关节约束定义
        const JOINT_LIMITS = {
            shoulderRotation: { min: -90, max: 90 },
            shoulderPitch: { min: -30, max: 120 },
            elbowBend: { min: 0, max: 150 },
            wristRotation: { min: -90, max: 90 },
            wristPitch: { min: -45, max: 45 },
            gripperOpen: { min: 0, max: 45 }
        };

        let scene, camera, renderer, controls;
        let armGroup;
        let joints = {};
        let gripperLeft, gripperRight;
        let currentMode = 'manual';
        let autoDemoInterval = null;
        let currentPresetIndex = 0;

        const presets = {
            home: { shoulderRotation: 0, shoulderPitch: 0, elbowBend: 0, wristRotation: 0, wristPitch: 0, gripperOpen: 0 },
            lift: { shoulderRotation: 0, shoulderPitch: 90, elbowBend: 45, wristRotation: 0, wristPitch: 0, gripperOpen: 0 },
            extend: { shoulderRotation: 0, shoulderPitch: 30, elbowBend: 120, wristRotation: 0, wristPitch: 0, gripperOpen: 0 },
            grab: { shoulderRotation: 30, shoulderPitch: 60, elbowBend: 90, wristRotation: 0, wristPitch: 0, gripperOpen: 45 },
            lower: { shoulderRotation: 30, shoulderPitch: 30, elbowBend: 60, wristRotation: 0, wristPitch: 30, gripperOpen: 45 }
        };

        const presetOrder = ['home', 'lift', 'extend', 'grab', 'lower'];

        function init() {
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f0f1a);

            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.set(150, 150, 250);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 150;
            controls.maxDistance = 500;

            setupLights();
            createFloor();
            createArm();

            window.addEventListener('resize', onWindowResize);

            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 1000);

            animate();
        }

        function setupLights() {
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffffff, 1);
            mainLight.position.set(100, 200, 100);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.camera.near = 0.5;
            mainLight.shadow.camera.far = 500;
            mainLight.shadow.camera.left = -200;
            mainLight.shadow.camera.right = 200;
            mainLight.shadow.camera.top = 200;
            mainLight.shadow.camera.bottom = -200;
            scene.add(mainLight);

            const fillLight = new THREE.DirectionalLight(0x00d4ff, 0.3);
            fillLight.position.set(-100, 100, -100);
            scene.add(fillLight);

            const rimLight = new THREE.DirectionalLight(0xff6b35, 0.2);
            rimLight.position.set(0, 100, -150);
            scene.add(rimLight);

            const pointLight = new THREE.PointLight(0x00d4ff, 0.5, 300);
            pointLight.position.set(0, 150, 0);
            scene.add(pointLight);
        }

        function createFloor() {
            const floorGeometry = new THREE.PlaneGeometry(500, 500);
            const floorMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a1a2e,
                metalness: 0.8,
                roughness: 0.5
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -60;
            floor.receiveShadow = true;
            scene.add(floor);

            const gridHelper = new THREE.GridHelper(400, 40, 0x00d4ff, 0x16213e);
            gridHelper.position.y = -59;
            scene.add(gridHelper);
        }

        function createArm() {
            armGroup = new THREE.Group();
            armGroup.position.set(0, -30, 0);
            scene.add(armGroup);

            const bodyMaterial = new THREE.MeshStandardMaterial({
                color: 0x666666,
                metalness: 0.85,
                roughness: 0.25
            });

            const jointMaterial = new THREE.MeshStandardMaterial({
                color: 0x444444,
                metalness: 0.9,
                roughness: 0.2
            });

            const ledMaterial = new THREE.MeshStandardMaterial({
                color: 0x00d4ff,
                emissive: 0x00d4ff,
                emissiveIntensity: 0.8
            });

            // 底座
            const baseGeometry = new THREE.BoxGeometry(80, 30, 80);
            const base = new THREE.Mesh(baseGeometry, bodyMaterial);
            base.position.y = -35;
            base.castShadow = true;
            base.receiveShadow = true;
            armGroup.add(base);

            // 底座装饰
            const ringGeometry = new THREE.BoxGeometry(90, 8, 90);
            const ring = new THREE.Mesh(ringGeometry, jointMaterial);
            ring.position.y = -20;
            armGroup.add(ring);

            // 肩部旋转关节 (Y轴)
            joints.shoulderRotation = new THREE.Group();
            joints.shoulderRotation.position.y = -20;
            armGroup.add(joints.shoulderRotation);

            // 肩部底座
            const shoulderBaseGeometry = new THREE.BoxGeometry(50, 35, 50);
            const shoulderBase = new THREE.Mesh(shoulderBaseGeometry, bodyMaterial);
            shoulderBase.position.y = 17;
            shoulderBase.castShadow = true;
            joints.shoulderRotation.add(shoulderBase);

            // 肩部俯仰关节 (Z轴)
            joints.shoulderPitch = new THREE.Group();
            joints.shoulderPitch.position.y = 30;
            joints.shoulderRotation.add(joints.shoulderPitch);

            // 大臂
            const upperArmGeometry = new THREE.BoxGeometry(28, 120, 28);
            const upperArm = new THREE.Mesh(upperArmGeometry, bodyMaterial);
            upperArm.position.y = 60;
            upperArm.castShadow = true;
            joints.shoulderPitch.add(upperArm);

            // 肩部指示灯
            const ledGeometry = new THREE.CircleGeometry(5, 16);
            const led = new THREE.Mesh(ledGeometry, ledMaterial);
            led.position.set(15, 30, 0);
            led.rotation.y = Math.PI / 2;
            joints.shoulderRotation.add(led);

            // 肘部关节
            joints.elbowBend = new THREE.Group();
            joints.elbowBend.position.y = 120;
            joints.shoulderPitch.add(joints.elbowBend);

            // 肘部方形关节
            const elbowGeometry = new THREE.BoxGeometry(40, 40, 40);
            const elbow = new THREE.Mesh(elbowGeometry, jointMaterial);
            joints.elbowBend.add(elbow);

            // 小臂
            const forearmGeometry = new THREE.BoxGeometry(22, 100, 22);
            const forearm = new THREE.Mesh(forearmGeometry, bodyMaterial);
            forearm.position.y = 50;
            forearm.castShadow = true;
            joints.elbowBend.add(forearm);

            // 腕部旋转关节 (Y轴)
            joints.wristRotation = new THREE.Group();
            joints.wristRotation.position.y = 85;
            joints.elbowBend.add(joints.wristRotation);

            // 腕部方形关节
            const wristJointGeometry = new THREE.BoxGeometry(35, 35, 35);
            const wristJoint = new THREE.Mesh(wristJointGeometry, jointMaterial);
            joints.wristRotation.add(wristJoint);

            // 腕部俯仰关节 (Z轴)
            joints.wristPitch = new THREE.Group();
            joints.wristRotation.add(joints.wristPitch);

            // 腕部
            const wristGeometry = new THREE.BoxGeometry(30, 35, 30);
            const wrist = new THREE.Mesh(wristGeometry, jointMaterial);
            wrist.position.y = 17;
            wrist.castShadow = true;
            joints.wristPitch.add(wrist);

            // 夹爪底座
            const gripperBaseGeometry = new THREE.BoxGeometry(40, 18, 30);
            const gripperBase = new THREE.Mesh(gripperBaseGeometry, bodyMaterial);
            gripperBase.position.y = 35;
            joints.wristPitch.add(gripperBase);

            // 左夹爪
            joints.gripperOpen = new THREE.Group();
            joints.gripperOpen.position.y = 37;
            joints.wristPitch.add(joints.gripperOpen);

            gripperLeft = createGripper(bodyMaterial);
            gripperLeft.position.x = -12;
            joints.gripperOpen.add(gripperLeft);

            gripperRight = createGripper(bodyMaterial);
            gripperRight.position.x = 12;
            gripperRight.rotation.y = Math.PI;
            joints.gripperOpen.add(gripperRight);
        }

        function createGripper(material) {
            const gripperGroup = new THREE.Group();

            const fingerGeometry = new THREE.BoxGeometry(8, 45, 10);
            const finger = new THREE.Mesh(fingerGeometry, material);
            finger.position.y = 22;
            finger.castShadow = true;
            gripperGroup.add(finger);

            const tipGeometry = new THREE.BoxGeometry(10, 18, 12);
            const tip = new THREE.Mesh(tipGeometry, material);
            tip.position.y = 52;
            tip.castShadow = true;
            gripperGroup.add(tip);

            return gripperGroup;
        }

        // 约束校验函数
        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        // 更新关节角度
        function updateJoint(jointName, value) {
            if (currentMode === 'auto') return;

            const angle = parseInt(value);
            const limit = JOINT_LIMITS[jointName];
            const clampedAngle = clamp(angle, limit.min, limit.max);

            document.getElementById(`${jointName}Angle`).textContent = `${clampedAngle}°`;

            const slider = document.getElementById(jointName);
            const percentage = ((clampedAngle - limit.min) / (limit.max - limit.min)) * 100;
            slider.style.background = `linear-gradient(to right, #00d4ff 0%, #00d4ff ${percentage}%, #333 ${percentage}%, #333 100%)`;

            // 显示约束警告
            const warningElement = slider.parentElement.previousElementSibling;
            if (angle !== clampedAngle) {
                if (!warningElement.querySelector('.constraint-warning')) {
                    warningElement.innerHTML += '<span class="constraint-warning">已限制</span>';
                }
            } else {
                const warning = warningElement.querySelector('.constraint-warning');
                if (warning) warning.remove();
            }

            // 应用到3D模型
            animateJoint(jointName, clampedAngle);

            clearHighlightPresets();
        }

        function animateJoint(jointName, targetAngle) {
            const joint = joints[jointName];
            if (!joint) return;

            const rad = targetAngle * Math.PI / 180;

            new TWEEN.Tween({ angle: joint.rotation.z !== undefined ? joint.rotation.z : joint.rotation.y })
                .to({ angle: jointName.includes('Rotation') ? rad : rad }, 200)
                .easing(TWEEN.Easing.Quadratic.Out)
                .onUpdate((obj) => {
                    if (jointName.includes('Rotation')) {
                        joint.rotation.y = obj.angle;
                    } else {
                        joint.rotation.z = obj.angle;
                    }
                })
                .start();

            // 夹爪特殊处理
            if (jointName === 'gripperOpen') {
                const openAngle = targetAngle * Math.PI / 180;
                new TWEEN.Tween({ angle: 0 })
                    .to({ angle: openAngle }, 200)
                    .easing(TWEEN.Easing.Quadratic.Out)
                    .onUpdate((obj) => {
                        gripperLeft.rotation.z = obj.angle;
                        gripperRight.rotation.z = -obj.angle;
                    })
                    .start();
            }
        }

        function setPreset(presetName) {
            if (currentMode === 'auto') return;

            const preset = presets[presetName];
            if (!preset) return;

            clearHighlightPresets();
            event.target.classList.add('highlight');

            Object.keys(preset).forEach(jointName => {
                const angle = preset[jointName];
                const limit = JOINT_LIMITS[jointName];
                const clampedAngle = clamp(angle, limit.min, limit.max);

                document.getElementById(jointName).value = clampedAngle;
                document.getElementById(`${jointName}Angle`).textContent = `${clampedAngle}°`;

                const slider = document.getElementById(jointName);
                const percentage = ((clampedAngle - limit.min) / (limit.max - limit.min)) * 100;
                slider.style.background = `linear-gradient(to right, #00d4ff 0%, #00d4ff ${percentage}%, #333 ${percentage}%, #333 100%)`;

                animateJointTo(jointName, clampedAngle);
            });
        }

        function animateJointTo(jointName, targetAngle) {
            const joint = joints[jointName];
            if (!joint) return;

            const rad = targetAngle * Math.PI / 180;
            const currentRad = jointName.includes('Rotation') ? joint.rotation.y : joint.rotation.z;

            new TWEEN.Tween({ angle: currentRad })
                .to({ angle: rad }, 500)
                .easing(TWEEN.Easing.Quadratic.InOut)
                .onUpdate((obj) => {
                    if (jointName.includes('Rotation')) {
                        joint.rotation.y = obj.angle;
                    } else {
                        joint.rotation.z = obj.angle;
                    }
                })
                .start();

            // 夹爪特殊处理
            if (jointName === 'gripperOpen') {
                const openAngle = targetAngle * Math.PI / 180;
                new TWEEN.Tween({ angle: gripperLeft.rotation.z })
                    .to({ angle: openAngle }, 500)
                    .easing(TWEEN.Easing.Quadratic.InOut)
                    .onUpdate((obj) => {
                        gripperLeft.rotation.z = obj.angle;
                        gripperRight.rotation.z = -obj.angle;
                    })
                    .start();
            }
        }

        function clearHighlightPresets() {
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.classList.remove('highlight');
            });
        }

        function setMode(mode) {
            currentMode = mode;
            const manualBtn = document.getElementById('manualBtn');
            const autoBtn = document.getElementById('autoBtn');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            if (mode === 'manual') {
                manualBtn.classList.add('active');
                autoBtn.classList.remove('active');
                statusDot.classList.remove('auto');
                statusText.textContent = '手动控制模式';
                stopAutoDemo();

                document.querySelectorAll('.joint-control input').forEach(input => {
                    input.disabled = false;
                });
                document.querySelectorAll('.preset-btn').forEach(btn => {
                    btn.style.pointerEvents = 'auto';
                });
            } else {
                autoBtn.classList.add('active');
                manualBtn.classList.remove('active');
                statusDot.classList.add('auto');
                statusText.textContent = '自动演示模式';
                startAutoDemo();

                document.querySelectorAll('.joint-control input').forEach(input => {
                    input.disabled = true;
                });
                document.querySelectorAll('.preset-btn').forEach(btn => {
                    btn.style.pointerEvents = 'none';
                });
            }
        }

        function startAutoDemo() {
            if (autoDemoInterval) clearInterval(autoDemoInterval);
            runAutoDemo();
            autoDemoInterval = setInterval(runAutoDemo, 4000);
        }

        function stopAutoDemo() {
            if (autoDemoInterval) {
                clearInterval(autoDemoInterval);
                autoDemoInterval = null;
            }
        }

        function runAutoDemo() {
            const presetName = presetOrder[currentPresetIndex];
            const preset = presets[presetName];

            clearHighlightPresets();
            const presetBtns = document.querySelectorAll('.preset-btn');
            if (presetBtns[currentPresetIndex]) {
                presetBtns[currentPresetIndex].classList.add('highlight');
            }

            Object.keys(preset).forEach(jointName => {
                const angle = preset[jointName];
                animateJointTo(jointName, angle);
            });

            currentPresetIndex = (currentPresetIndex + 1) % presetOrder.length;
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update();
            controls.update();
            renderer.render(scene, camera);
        }

        // 初始化滑块背景
        document.querySelectorAll('input[type="range"]').forEach(slider => {
            const min = parseInt(slider.min);
            const max = parseInt(slider.max);
            const value = parseInt(slider.value);
            const percentage = ((value - min) / (max - min)) * 100;
            slider.style.background = `linear-gradient(to right, #00d4ff 0%, #00d4ff ${percentage}%, #333 ${percentage}%, #333 100%)`;
        });

        init();
    </script>
</body>
</html>
