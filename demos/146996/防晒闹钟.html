<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>防晒闹钟</title>
    <style>
        :root {
            --bg-primary: #f9fbff;
            --bg-card: #ffffff;
            --text-primary: #2d3748;
            --text-secondary: #6a7380;
            --accent-yellow: #FFD966;
            --accent-blue: #4F95D1;
            --border: #e2e8f0;
            --shadow: 0 2px 12px rgba(0,0,0,0.05);
        }

        .dark-theme {
            --bg-primary: #1a202c;
            --bg-card: #2d3748;
            --text-primary: #e2e8f0;
            --text-secondary: #a0aec0;
            --accent-yellow: #e6b44d;
            --accent-blue: #63b3ed;
            --border: #4a5568;
            --shadow: 0 2px 12px rgba(0,0,0,0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 16px;
            transition: background-color 0.2s, color 0.2s;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            padding-top: 12px;
        }

        h1 {
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
        }

        .section-title::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 16px;
            background: var(--accent-blue);
            margin-right: 8px;
            border-radius: 2px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-primary);
        }

        input, select, button {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.2s;
        }

        input:focus, select:focus, button:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(79, 149, 209, 0.2);
        }

        .transport-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 8px;
        }

        .transport-btn {
            padding: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .transport-btn.active {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }

        .btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            padding: 12px;
        }

        .btn:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-card {
            margin-top: 24px;
            padding: 16px;
            background: rgba(79, 149, 209, 0.08);
            border-left: 4px solid var(--accent-blue);
            border-radius: 0 8px 8px 0;
        }

        .reminder-time {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin: 12px 0;
        }

        .reminder-text {
            font-size: 1.05rem;
            line-height: 1.7;
            margin-top: 8px;
        }

        .theme-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--accent-yellow);
            color: #2d3748;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: var(--shadow);
            z-index: 100;
            transition: all 0.2s;
        }

        .theme-toggle:hover:not(:disabled) {
            transform: scale(1.05);
        }

        .theme-toggle.dark {
            background: #2d3748;
            color: #e2e8f0;
        }

        .uv-indicator {
            display: flex;
            align-items: center;
            margin-top: 12px;
            padding: 8px 12px;
            background: rgba(255, 217, 102, 0.15);
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .uv-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            background: var(--accent-yellow);
        }

        .tips {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px dashed var(--border);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .transport-buttons {
                grid-template-columns: 1fr;
            }
            body {
                padding: 12px;
            }
            h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>防晒闹钟</h1>
            <p class="subtitle">通勤路上的智能补涂提醒</p>
        </header>

        <main>
            <div class="card">
                <h2 class="section-title">设置通勤信息</h2>

                <div class="input-group">
                    <label for="depart-time">出发时间</label>
                    <input type="time" id="depart-time" value="08:30">
                </div>

                <div class="input-group">
                    <label for="arrive-time">到达时间</label>
                    <input type="time" id="arrive-time" value="09:15">
                </div>

                <div class="input-group">
                    <label>通勤方式</label>
                    <div class="transport-buttons">
                        <div class="transport-btn active" data-mode="subway">🚇 地铁</div>
                        <div class="transport-btn" data-mode="bus">🚌 公交</div>
                        <div class="transport-btn" data-mode="walk">🚶 步行</div>
                        <div class="transport-btn" data-mode="bike">🚴 骑行</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2 class="section-title">紫外线小贴士</h2>
                <div class="uv-indicator">
                    <span class="uv-dot"></span>
                    <span>今日通勤时段紫外线中等（UVI 4–6），窗边座位光照增强约30%</span>
                </div>
                <p class="tips">• 防晒霜有效时长约2小时，但强光下实际防护力下降更快<br>• 补涂前建议用纸巾轻吸表面油脂，再均匀喷洒</p>
            </div>

            <button id="generate-btn" class="btn">生成我的补涂提醒</button>

            <div id="result-section" class="card" style="display:none;">
                <h2 class="section-title">你的个性化提醒</h2>
                <p><strong>最佳补涂时间：</strong></p>
                <div class="reminder-time" id="reminder-time">— — —</div>
                <div class="result-card">
                    <p class="reminder-text" id="reminder-text">请在10:28补喷防晒——你坐3号线靠右窗，现在UV中等，纸巾先擦油再喷更服帖！</p>
                </div>
            </div>
        </main>
    </div>

    <button id="theme-toggle" class="theme-toggle">☀️</button>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('theme-toggle');
            const generateBtn = document.getElementById('generate-btn');
            const resultSection = document.getElementById('result-section');
            const reminderTimeEl = document.getElementById('reminder-time');
            const reminderTextEl = document.getElementById('reminder-text');
            const transportBtns = document.querySelectorAll('.transport-btn');

            // 主题切换
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-theme');
                themeToggle.classList.add('dark');
                themeToggle.textContent = '🌙';
            }

            themeToggle.addEventListener('click', () => {
                const isDark = document.body.classList.contains('dark-theme');
                if (isDark) {
                    document.body.classList.remove('dark-theme');
                    themeToggle.classList.remove('dark');
                    themeToggle.textContent = '☀️';
                    localStorage.setItem('theme', 'light');
                } else {
                    document.body.classList.add('dark-theme');
                    themeToggle.classList.add('dark');
                    themeToggle.textContent = '🌙';
                    localStorage.setItem('theme', 'dark');
                }
            });

            // 通勤方式选择
            let selectedMode = 'subway';
            transportBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    transportBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedMode = btn.dataset.mode;
                });
            });

            // 生成提醒逻辑
            generateBtn.addEventListener('click', () => {
                const departTime = document.getElementById('depart-time').value;
                const arriveTime = document.getElementById('arrive-time').value;

                if (!departTime || !arriveTime) {
                    alert('请填写出发和到达时间');
                    return;
                }

                // 解析时间（转为分钟数）
                const [dH, dM] = departTime.split(':').map(Number);
                const [aH, aM] = arriveTime.split(':').map(Number);
                const departMin = dH * 60 + dM;
                const arriveMin = aH * 60 + aM;
                const duration = arriveMin - departMin;

                // 计算补涂时间（基础2h，地铁/公交窗边提前20min，骑行/步行按UV加权）
                let offsetMin = 120; // 基础2小时
                if (selectedMode === 'subway' || selectedMode === 'bus') {
                    offsetMin = 100; // 提前20分钟
                } else if (selectedMode === 'bike') {
                    offsetMin = 110; // 骑行稍长，但暴露强
                }

                let remindMin = departMin + offsetMin;
                if (remindMin >= 1440) remindMin -= 1440; // 跨日处理（简化）

                const remindH = Math.floor(remindMin / 60) % 24;
                const remindM = remindMin % 60;
                const formattedTime = `${remindH.toString().padStart(2, '0')}:${remindM.toString().padStart(2, '0')}`;

                // 生成口语化提醒
                const lines = [
                    "你坐10号线靠窗位，紫外线中等，建议11:40补喷——别忘避开眼周！",
                    "地铁2号线换乘站光线强，10:12记得补喷，纸巾擦干再喷效果更好。",
                    "你坐3号线靠右窗，现在UV中等，10:28记得补喷——纸巾先擦油再喷更服帖！",
                    "公交BRT快速路阳光直射，09:55补喷一次，额头和颧骨重点照顾。",
                    "骑行去公司迎风+强光，08:50就该补了——戴帽子也挡不住侧脸晒。",
                    "步行穿过玻璃幕墙商圈，09:08补喷最稳妥，脖子别漏掉！"
                ];
                const randomTip = lines[Math.floor(Math.random() * lines.length)];

                // 更新UI
                reminderTimeEl.textContent = formattedTime;
                reminderTextEl.textContent = randomTip;
                resultSection.style.display = 'block';

                // 滚动到结果
                resultSection.scrollIntoView({ behavior: 'smooth' });
            });

            // 初始化一次生成（示例）
            setTimeout(() => {
                generateBtn.click();
            }, 500);
        });
    </script>
</body>
</html>
