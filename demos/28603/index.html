<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>easypick - 随机抽取器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    :root {
      --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --gold-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #ffd89b 100%);
      --dark-bg: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    }

    .page-container {
      min-height: 100vh;
      background: var(--dark-bg);
      background-attachment: fixed;
      position: relative;
      overflow-x: hidden;
    }

    .page-container::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(circle at 20% 80%, rgba(102, 126, 234, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(118, 75, 162, 0.3) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .floating-particles {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 10px;
      height: 10px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      animation: float 15s infinite ease-in-out;
    }

    .particle:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 20s; }
    .particle:nth-child(2) { left: 25%; animation-delay: 3s; animation-duration: 18s; }
    .particle:nth-child(3) { left: 40%; animation-delay: 6s; animation-duration: 22s; }
    .particle:nth-child(4) { left: 55%; animation-delay: 2s; animation-duration: 19s; }
    .particle:nth-child(5) { left: 70%; animation-delay: 5s; animation-duration: 21s; }
    .particle:nth-child(6) { left: 85%; animation-delay: 1s; animation-duration: 17s; }

    @keyframes float {
      0%, 100% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 0.6; transform: translateY(80vh) scale(1); }
      90% { opacity: 0.6; transform: translateY(10vh) scale(1); }
      100% { transform: translateY(-10vh) scale(0); opacity: 0; }
    }

    .header-bar {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    .header-bar .logo {
      font-size: 24px;
      font-weight: bold;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .main-content {
      padding: 30px 20px;
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .glass-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .team-card {
      padding: 25px;
    }

    .team-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .team-header .title {
      font-size: 20px;
      font-weight: bold;
      color: #fff;
    }

    .btn {
      padding: 10px 20px;
      font-size: 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: var(--primary-gradient);
      color: #fff;
    }

    .btn-warning {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: #fff;
    }

    .btn-danger {
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
      color: #fff;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .team-list {
      max-height: 400px;
      overflow-y: auto;
      padding-right: 10px;
    }

    .team-list::-webkit-scrollbar {
      width: 6px;
    }

    .team-list::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
    }

    .team-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .team-list::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .team-item {
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .team-item:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateX(5px);
    }

    .team-item.team-active {
      background: var(--primary-gradient);
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .team-item .team-name {
      color: #fff;
      font-size: 16px;
      font-weight: 500;
    }

    .team-item .team-count {
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
    }

    .team-item .team-actions {
      display: flex;
      gap: 8px;
    }

    .team-item .team-actions .btn {
      padding: 6px 12px;
      font-size: 12px;
    }

    .member-list-container {
      max-height: 110px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 12px;
    }

    .member-list-container::-webkit-scrollbar {
      width: 6px;
    }

    .member-list-container::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
    }

    .member-list-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .member-list-container::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .member-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.3s ease;
      text-align: center;
      word-break: break-word;
      min-width: 0;
    }

    .member-tag:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.05);
    }

    .extract-section {
      text-align: center;
      padding: 15px 30px;
    }

    .extract-options {
      margin-bottom: 15px;
    }

    .checkbox-wrapper {
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 25px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.3s ease;
      min-height: 44px;
      justify-content: center;
    }

    .checkbox-wrapper:hover:not(.disabled) {
      background: rgba(255, 255, 255, 0.1);
    }

    .checkbox-wrapper.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .checkbox-wrapper input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0 8px 0 0;
      accent-color: #667eea;
      cursor: pointer;
      flex-shrink: 0;
    }

    .checkbox-wrapper .checkbox-text {
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      user-select: none;
      white-space: nowrap;
    }

    .lock-icon {
      font-size: 12px;
      margin-right: 4px;
    }

    .extract-btn {
      padding: 18px 80px;
      font-size: 22px;
      font-weight: bold;
      border-radius: 50px;
      background: var(--primary-gradient);
      border: none;
      color: #fff;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
      position: relative;
      overflow: hidden;
    }

    .extract-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s ease;
    }

    .extract-btn:hover::before {
      left: 100%;
    }

    .extract-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(102, 126, 234, 0.5);
    }

    .extract-btn:active {
      transform: translateY(0);
    }

    .extract-btn:disabled {
      background: rgba(255, 255, 255, 0.2);
      box-shadow: none;
      cursor: not-allowed;
    }

    .extract-btn:disabled::before {
      display: none;
    }

    .pool-count {
      font-size: 14px;
      opacity: 0.8;
      margin-left: 5px;
    }

    .reset-btn {
      padding: 18px 40px;
      font-size: 18px;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-left: 15px;
    }

    .reset-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .extract-result-container {
      position: relative;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 30px 0;
    }

    .extract-result {
      position: relative;
      padding: 40px 60px;
      background: var(--gold-gradient);
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(245, 87, 108, 0.5), 0 0 80px rgba(245, 87, 108, 0.3);
      animation: resultPulse 2s ease-in-out infinite;
    }

    @keyframes resultPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 10px 40px rgba(245, 87, 108, 0.5), 0 0 80px rgba(245, 87, 108, 0.3);
      }
      50% {
        transform: scale(1.02);
        box-shadow: 0 15px 50px rgba(245, 87, 108, 0.6), 0 0 100px rgba(245, 87, 108, 0.4);
      }
    }

    .extract-result::before {
      content: '';
      position: absolute;
      top: -5px;
      left: -5px;
      right: -5px;
      bottom: -5px;
      background: var(--gold-gradient);
      border-radius: 25px;
      z-index: -1;
      filter: blur(20px);
      opacity: 0.6;
      animation: glowPulse 2s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    .extract-name {
      font-size: 56px;
      font-weight: bold;
      color: #fff;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
      animation: nameReveal 0.6s ease-out;
    }

    @keyframes nameReveal {
      0% { transform: scale(0) rotate(-20deg); opacity: 0; }
      60% { transform: scale(1.2) rotate(5deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .extract-animation-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .slot-machine {
      width: 300px;
      height: 120px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .slot-reel {
      font-size: 48px;
      font-weight: bold;
      color: #fff;
      animation: slotSpin 0.1s linear infinite;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }

    @keyframes slotSpin {
      0% { transform: translateY(-100%); opacity: 0.5; }
      50% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(100%); opacity: 0.5; }
    }

    .extract-history {
      margin-top: 30px;
      padding-top: 25px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .history-title {
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .history-item {
      display: inline-block;
      padding: 8px 18px;
      background: rgba(17, 153, 142, 0.3);
      border: 1px solid rgba(56, 239, 125, 0.3);
      border-radius: 25px;
      margin: 5px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.9);
      animation: historySlideIn 0.3s ease;
    }

    @keyframes historySlideIn {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255, 255, 255, 0.5);
    }

    .empty-state .icon {
      font-size: 64px;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .empty-state .text {
      font-size: 16px;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.hidden {
      display: none;
    }

    .hidden {
      display: none !important;
    }

    .modal {
      background: rgba(30, 30, 50, 0.95);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 30px;
      min-width: 400px;
      max-width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .modal-title {
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      font-size: 14px;
      color: #fff;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: rgba(102, 126, 234, 0.6);
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 150px;
    }

    .form-group .hint {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 8px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }

    .confirm-modal .modal {
      text-align: center;
    }

    .confirm-modal .modal-text {
      color: rgba(255, 255, 255, 0.8);
      font-size: 16px;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    @media (max-width: 768px) {
      .main-content {
        padding: 15px;
      }

      .team-card {
        padding: 15px;
      }

      .extract-name {
        font-size: 36px;
      }

      .extract-result {
        padding: 25px 40px;
      }

      .extract-btn {
        padding: 15px 50px;
        font-size: 18px;
      }

      .modal {
        min-width: auto;
        margin: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="page-container">
    <div class="floating-particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>

    <div class="header-bar">
      <div class="logo">easypick</div>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-secondary" onclick="exportData()">📤 导出数据</button>
        <button class="btn btn-secondary" onclick="document.getElementById('importFileInput').click()">📥 导入数据</button>
        <input type="file" id="importFileInput" accept=".json" style="display: none;" onchange="importData(event)">
      </div>
    </div>

    <div class="main-content">
      <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 20px;">
        <div class="glass-card team-card">
          <div class="team-header">
            <span class="title">📁 我的团队</span>
            <button class="btn btn-primary" onclick="showAddTeamModal()">✨ 创建团队</button>
          </div>

          <div id="teamListEmpty" class="empty-state">
            <div class="icon">📋</div>
            <div class="text">暂无团队，请创建</div>
          </div>

          <div id="teamListContainer" class="team-list" style="display: none;"></div>
        </div>

        <div class="glass-card team-card" id="teamDetail">
          <div class="empty-state">
            <div class="icon">🎯</div>
            <div class="text">请选择左侧团队或创建新团队</div>
          </div>
        </div>
      </div>
    </div>

    <div id="extractOverlay" class="extract-animation-overlay hidden" onclick="cancelExtract()">
      <div style="text-align: center;">
        <div class="slot-machine">
          <div id="slotReel" class="slot-reel">---</div>
        </div>
        <div style="color:#fff;margin-top:20px;text-align:center;">
          <div style="font-size:24px;margin-bottom:10px;">🎰 抽取中...</div>
          <div style="font-size:14px;opacity:0.7;">点击任意处取消</div>
        </div>
      </div>
    </div>

    <div id="addTeamModal" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-title">✨ 创建团队</div>
        <div class="form-group">
          <label>团队名称</label>
          <input type="text" id="teamNameInput" placeholder="请输入团队名称" maxlength="30">
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal('addTeamModal')">取消</button>
          <button class="btn btn-primary" onclick="submitAddTeam()">确定创建</button>
        </div>
      </div>
    </div>

    <div id="importModal" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-title">📥 导入成员</div>
        <div class="form-group">
          <label>成员列表</label>
          <textarea id="importNamesInput" placeholder="每行一个姓名，从Excel复制粘贴"></textarea>
        </div>
        <div class="hint">💡 提示：从Excel单列复制姓名，粘贴到上方文本框，会覆盖现有成员</div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal('importModal')">取消</button>
          <button class="btn btn-warning" onclick="submitImport()">导入覆盖</button>
        </div>
      </div>
    </div>

    <div id="welcomeModal" class="modal-overlay hidden">
      <div class="modal" style="max-width: 450px;">
        <div class="modal-title">👋 欢迎使用 easypick</div>
        <div style="color: rgba(255,255,255,0.8); line-height: 1.8; margin-bottom: 20px;">
          <p style="margin-bottom: 15px;">检测到您是首次使用或本地数据为空。</p>
          <p>如果您之前有导出过数据文件（<code>easypick_data.json</code>），可以点击"导入数据"恢复。</p>
          <p style="margin-top: 15px; color: rgba(255,255,255,0.6); font-size: 13px;">💡 提示：将数据文件与 index.html 放在同一目录下</p>
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="startFresh()">暂无数据</button>
          <button class="btn btn-primary" onclick="doImport()">📥 导入数据</button>
        </div>
      </div>
    </div>

    <div id="confirmModal" class="modal-overlay hidden confirm-modal">
      <div class="modal">
        <div class="modal-title" id="confirmTitle">确认</div>
        <div class="modal-text" id="confirmText"></div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal('confirmModal')">取消</button>
          <button class="btn btn-danger" id="confirmBtn" onclick="confirmAction()">确定</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let teams = [];
    let currentTeam = null;
    let extractHistory = [];
    let availableMembers = [];
    let allowDuplicate = false;
    let roundStarted = false;
    let isExtracting = false;
    let slotInterval = null;
    let audioContext = null;
    let currentConfirmCallback = null;

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function loadData() {
      const saved = localStorage.getItem('easypick_teams');
      if (saved) {
        teams = JSON.parse(saved);
      }
      renderTeamList();

      if (teams.length === 0) {
        document.getElementById('welcomeModal').classList.remove('hidden');
      }
    }

    function saveData() {
      localStorage.setItem('easypick_teams', JSON.stringify(teams));
    }

    function doImport() {
      document.getElementById('welcomeModal').classList.add('hidden');
      document.getElementById('importFileInput').click();
    }

    function startFresh() {
      document.getElementById('welcomeModal').classList.add('hidden');
    }

    function exportData() {
      const data = {
        version: 1,
        exportTime: new Date().toISOString(),
        teams: teams
      };
      const json = JSON.stringify(data, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'easypick_data.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (data && data.teams) {
            teams = data.teams;
            saveData();
            renderTeamList();
            if (teams.length > 0) {
              selectTeam(teams[0].id);
            }
            alert('导入成功！');
          } else {
            alert('无效的数据格式');
          }
        } catch (err) {
          alert('导入失败：' + err.message);
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function renderTeamList() {
      const emptyEl = document.getElementById('teamListEmpty');
      const containerEl = document.getElementById('teamListContainer');

      if (teams.length === 0) {
        emptyEl.style.display = 'block';
        containerEl.style.display = 'none';
        return;
      }

      emptyEl.style.display = 'none';
      containerEl.style.display = 'block';
      containerEl.innerHTML = teams.map(team => `
        <div class="team-item ${currentTeam && currentTeam.id === team.id ? 'team-active' : ''}" onclick="selectTeam('${team.id}')">
          <div>
            <div class="team-name">${team.name}</div>
            <div class="team-count">👥 ${team.members.length}人</div>
          </div>
          <div class="team-actions" onclick="event.stopPropagation()">
            <button class="btn btn-warning" onclick="showImportModal('${team.id}')">📥</button>
            <button class="btn btn-danger" onclick="deleteTeam('${team.id}')">🗑️</button>
          </div>
        </div>
      `).join('');
    }

    function selectTeam(id) {
      currentTeam = teams.find(t => t.id === id);
      if (!currentTeam) return;

      const savedSetting = localStorage.getItem('easypick_allowDuplicate_' + id);
      allowDuplicate = savedSetting === 'true';
      roundStarted = false;
      isExtracting = false;
      extractHistory = [];
      availableMembers = shuffleArray([...currentTeam.members]);

      renderTeamList();
      renderTeamDetail();
    }

    function renderTeamDetail() {
      const detailEl = document.getElementById('teamDetail');

      if (!currentTeam) {
        detailEl.innerHTML = `
          <div class="empty-state">
            <div class="icon">🎯</div>
            <div class="text">请选择左侧团队或创建新团队</div>
          </div>
        `;
        return;
      }

      const membersHtml = currentTeam.members.length > 0
        ? `<div class="member-list-container">
            ${currentTeam.members.map(m => `<div class="member-tag">${m.name}</div>`).join('')}
           </div>`
        : `<div class="empty-state" style="padding:30px;">
            <div class="icon">👥</div>
            <div class="text">暂无成员，请导入</div>
           </div>`;

      const poolCount = allowDuplicate ? currentTeam.members.length : availableMembers.length;

      detailEl.innerHTML = `
        <div class="team-header">
          <span class="title">🎯 ${currentTeam.name}</span>
          <div>
            <button class="btn btn-warning" onclick="showImportModal('${currentTeam.id}')">📥 导入成员</button>
            <button class="btn btn-danger" onclick="confirmDeleteTeam()">🗑️ 删除</button>
          </div>
        </div>

        ${membersHtml}

        <div class="extract-section">
          <div class="extract-options">
            <label class="checkbox-wrapper ${isExtracting ? 'disabled' : ''}" title="${isExtracting ? '抽取进行中，无法修改' : ''}">
              <input type="checkbox" id="allowDuplicateCheck" ${allowDuplicate ? 'checked' : ''} ${isExtracting ? 'disabled' : ''} onchange="toggleAllowDuplicate()">
              ${isExtracting ? '<span class="lock-icon">🔒</span>' : ''}
              <span class="checkbox-text">允许重复抽中</span>
            </label>
          </div>
          <button class="extract-btn" id="extractBtn" onclick="extract()" ${!currentTeam.members.length || isExtracting ? 'disabled' : ''}>
            🎰 ${isExtracting ? '抽取中...' : '开始抽取'}
            ${!isExtracting ? `<span class="pool-count">(${poolCount}人)</span>` : ''}
          </button>
          <button class="reset-btn" onclick="resetExtract()">
            🔄 重置抽取
          </button>
        </div>

        <div id="extractResultContainer" class="extract-result-container" style="display: ${extractHistory.length > 0 && !isExtracting ? 'flex' : 'none'};">
          <div class="extract-result">
            <div class="extract-name" id="extractResultName">🎉 ${extractHistory[extractHistory.length - 1] || ''}</div>
          </div>
        </div>

        <div id="extractHistoryContainer" class="extract-history" style="display: ${extractHistory.length > 0 ? 'block' : 'none'};">
          <div class="history-title">🏆 已抽取名单 (${extractHistory.length})</div>
          ${extractHistory.map((name, idx) => `<span class="history-item">${name}</span>`).join('')}
        </div>
      `;
    }

    function showAddTeamModal() {
      document.getElementById('teamNameInput').value = '';
      document.getElementById('addTeamModal').classList.remove('hidden');
      document.getElementById('teamNameInput').focus();
    }

    function submitAddTeam() {
      const name = document.getElementById('teamNameInput').value.trim();
      if (!name) {
        alert('请输入团队名称');
        return;
      }

      const team = {
        id: generateId(),
        name: name,
        members: [],
        createdAt: Date.now()
      };

      teams.push(team);
      saveData();
      selectTeam(team.id);
      renderTeamList();
      closeModal('addTeamModal');
    }

    function showImportModal(id) {
      if (currentTeam && currentTeam.id !== id) {
        selectTeam(id);
      }
      document.getElementById('importNamesInput').value = '';
      document.getElementById('importModal').classList.remove('hidden');
    }

    function submitImport() {
      const lines = document.getElementById('importNamesInput').value.split('\n');
      const names = [...new Set(lines.map(l => l.trim()).filter(l => l.length > 0))];

      if (names.length === 0) {
        alert('请输入成员姓名');
        return;
      }

      currentTeam.members = names.map(name => ({ id: generateId(), name: name }));
      saveData();
      availableMembers = shuffleArray([...currentTeam.members]);
      extractHistory = [];
      roundStarted = false;
      renderTeamList();
      renderTeamDetail();
      closeModal('importModal');
    }

    function confirmDeleteTeam() {
      showConfirm('删除确认', '确定要删除该团队吗？此操作不可恢复！', () => {
        teams = teams.filter(t => t.id !== currentTeam.id);
        saveData();
        currentTeam = null;
        extractHistory = [];
        availableMembers = [];
        renderTeamList();
        renderTeamDetail();
      });
    }

    function deleteTeam(id) {
      const team = teams.find(t => t.id === id);
      if (!team) return;

      showConfirm('删除确认', `确定要删除团队"${team.name}"吗？此操作不可恢复！`, () => {
        if (currentTeam && currentTeam.id === id) {
          currentTeam = null;
          extractHistory = [];
          availableMembers = [];
        }
        teams = teams.filter(t => t.id !== id);
        saveData();
        renderTeamList();
        renderTeamDetail();
      });
    }

    function toggleAllowDuplicate() {
      if (isExtracting) return;
      allowDuplicate = document.getElementById('allowDuplicateCheck').checked;
      localStorage.setItem('easypick_allowDuplicate_' + currentTeam.id, allowDuplicate);
      renderTeamDetail();
    }

    function initAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playTensionMusic() {
      if (!audioContext) return null;

      const startTime = audioContext.currentTime;
      const duration = 2.5;
      const masterGain = audioContext.createGain();
      masterGain.gain.value = 0.3;
      masterGain.connect(audioContext.destination);

      const musicType = Math.floor(Math.random() * 5);
      const nodes = [];

      if (musicType === 0) {
        for (let i = 0; i < 8; i++) {
          const t = startTime + i * 0.3;
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          osc.type = 'sawtooth';
          osc.frequency.value = 200 + i * 50;
          gain.gain.setValueAtTime(0, t);
          gain.gain.linearRampToValueAtTime(0.15, t + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
          osc.connect(gain);
          gain.connect(masterGain);
          osc.start(t);
          osc.stop(t + 0.3);
          nodes.push(osc);
        }
      } else if (musicType === 1) {
        const bassOsc = audioContext.createOscillator();
        const bassGain = audioContext.createGain();
        bassOsc.type = 'sine';
        bassOsc.frequency.value = 80;
        bassGain.gain.setValueAtTime(0.2, startTime);
        bassGain.gain.linearRampToValueAtTime(0.5, startTime + 2);
        bassOsc.connect(bassGain);
        bassGain.connect(masterGain);
        bassOsc.start(startTime);
        bassOsc.stop(startTime + duration);
        nodes.push(bassOsc);

        for (let i = 0; i < 10; i++) {
          const t = startTime + i * 0.25;
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          osc.type = 'triangle';
          osc.frequency.value = 300 + i * 30;
          gain.gain.setValueAtTime(0.08, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
          osc.connect(gain);
          gain.connect(masterGain);
          osc.start(t);
          osc.stop(t + 0.25);
          nodes.push(osc);
        }
      } else if (musicType === 2) {
        for (let i = 0; i < 16; i++) {
          const t = startTime + i * 0.15;
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          osc.type = 'square';
          osc.frequency.value = 150 + (i % 4) * 100;
          gain.gain.setValueAtTime(0.06, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
          osc.connect(gain);
          gain.connect(masterGain);
          osc.start(t);
          osc.stop(t + 0.15);
          nodes.push(osc);
        }
      } else if (musicType === 3) {
        [261.63, 329.63, 392.00, 523.25].forEach(freq => {
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0, startTime);
          gain.gain.linearRampToValueAtTime(0.12, startTime + 0.5);
          gain.gain.setValueAtTime(0.12, startTime + 1.5);
          gain.gain.linearRampToValueAtTime(0, startTime + 2.5);
          osc.connect(gain);
          gain.connect(masterGain);
          osc.start(startTime);
          osc.stop(startTime + duration);
          nodes.push(osc);
        });
      } else {
        for (let i = 0; i < 20; i++) {
          const t = startTime + i * 0.12;
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          osc.type = 'sawtooth';
          const noteIdx = [0, 2, 4, 5, 7, 9, 11, 12][i % 8];
          osc.frequency.value = 220 * Math.pow(2, noteIdx / 12);
          gain.gain.setValueAtTime(0.05, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
          osc.connect(gain);
          gain.connect(masterGain);
          osc.start(t);
          osc.stop(t + 0.12);
          nodes.push(osc);
        }
      }

      return { nodes, masterGain };
    }

    function stopMusic(musicObj) {
      if (!musicObj || !audioContext) return;
      if (musicObj.nodes) {
        musicObj.nodes.forEach(node => {
          try { node.stop(); } catch(e) {}
        });
      }
      if (musicObj.masterGain) {
        musicObj.masterGain.gain.linearRampToValueAtTime(0, audioContext.currentTime + 0.1);
      }
    }

    function playCelebrationMusic() {
      if (!audioContext) return;

      const startTime = audioContext.currentTime;
      const masterGain = audioContext.createGain();
      masterGain.gain.value = 0.35;
      masterGain.connect(audioContext.destination);

      const chordFreqs = [[523.25, 659.25, 783.99], [587.33, 739.99, 880.00], [659.25, 830.61, 987.77]];

      chordFreqs.forEach((chord, chordIdx) => {
        const chordTime = startTime + chordIdx * 0.15;
        chord.forEach(freq => {
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0, chordTime);
          gain.gain.linearRampToValueAtTime(0.2, chordTime + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.01, chordTime + 0.8);
          osc.connect(gain);
          gain.connect(masterGain);
          osc.start(chordTime);
          osc.stop(chordTime + 0.8);
        });
      });

      for (let i = 0; i < 5; i++) {
        const t = startTime + i * 0.1;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = 'sine';
        osc.frequency.value = 1000 + i * 200 + Math.random() * 500;
        gain.gain.setValueAtTime(0.08, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(t);
        osc.stop(t + 0.15);
      }

      setTimeout(() => {
        masterGain.gain.linearRampToValueAtTime(0, audioContext.currentTime + 0.3);
      }, 1500);
    }

    function extract() {
      if (!allowDuplicate && availableMembers.length === 0) {
        alert('已抽取完毕，请重置');
        return;
      }
      if (allowDuplicate && currentTeam.members.length === 0) {
        alert('暂无成员可抽取');
        return;
      }

      initAudio();
      isExtracting = true;
      roundStarted = true;

      const tensionMusic = playTensionMusic();

      const overlay = document.getElementById('extractOverlay');
      const slotReel = document.getElementById('slotReel');
      overlay.classList.remove('hidden');

      const spinDuration = 2000;
      const spinInterval = 80;
      const allMembers = allowDuplicate ? currentTeam.members : availableMembers;
      const allNames = allMembers.map(m => m.name);
      let elapsed = 0;

      slotInterval = setInterval(() => {
        const randomIdx = Math.floor(Math.random() * allNames.length);
        slotReel.textContent = allNames[randomIdx];
        elapsed += spinInterval;

        if (elapsed >= spinDuration) {
          clearInterval(slotInterval);
          slotInterval = null;

          const idx = Math.floor(Math.random() * allMembers.length);
          const member = allMembers[idx];

          if (allowDuplicate) {
            extractHistory.push(member.name);
          } else {
            const realIdx = availableMembers.findIndex(m => m.id === member.id);
            availableMembers.splice(realIdx, 1);
            extractHistory.push(member.name);
          }

          stopMusic(tensionMusic);
          overlay.classList.add('hidden');
          isExtracting = false;
          renderTeamDetail();

          setTimeout(() => {
            playCelebrationMusic();
          }, 100);
        }
      }, spinInterval);
    }

    function cancelExtract() {
      if (slotInterval) {
        clearInterval(slotInterval);
        slotInterval = null;
      }
      document.getElementById('extractOverlay').classList.add('hidden');
      isExtracting = false;
      renderTeamDetail();
    }

    function resetExtract() {
      if (roundStarted) {
        showConfirm('重置确认', '重置将清除当前所有抽取记录，确定要继续吗？', () => {
          availableMembers = shuffleArray([...currentTeam.members]);
          extractHistory = [];
          roundStarted = false;
          isExtracting = false;
          renderTeamDetail();
        });
      } else {
        availableMembers = shuffleArray([...currentTeam.members]);
        extractHistory = [];
        renderTeamDetail();
      }
    }

    function showConfirm(title, text, callback) {
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmText').textContent = text;
      currentConfirmCallback = callback;
      document.getElementById('confirmModal').classList.remove('hidden');
    }

    function confirmAction() {
      if (currentConfirmCallback) {
        currentConfirmCallback();
        currentConfirmCallback = null;
      }
      closeModal('confirmModal');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.querySelectorAll('.modal-overlay').forEach(m => {
          if (!m.classList.contains('hidden')) {
            m.classList.add('hidden');
          }
        });
        if (isExtracting) {
          cancelExtract();
        }
      }
    });

    loadData();
  </script>
</body>
</html>
