        }

        #game-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;

            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);

        }

        #game-header {

        }

            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);

            font-weight: normal;

        }

        #game-content {
            margin-bottom: 30px;
        }

            line-height: 1.8;
            margin-bottom: 30px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border-left: 4px solid #d4af37;
            min-height: 120px;
        }

        #options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            padding: 18px 24px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #d4af37 0%, #b8942c 100%);
            color: #1a1a2e;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .option-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.5);
            background: linear-gradient(135deg, #e4bf47 0%, #c8a43c 100%);
        }

        .option-btn:active {
            transform: translateY(-1px);
        }

        #game-footer {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        #ending-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            text-align: center;
        }

        #ending-title {
            font-size: 42px;
            margin-bottom: 25px;
            color: #d4af37;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.8);
        }

        #ending-description {
            font-size: 18px;
            line-height: 1.8;
            max-width: 600px;
            margin-bottom: 40px;
            color: rgba(255, 255, 255, 0.9);
        }

        #restart-btn {
            padding: 18px 40px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #d4af37 0%, #b8942c 100%);
            color: #1a1a2e;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
        }

        #restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.6);
        }

            }

            }

            }

            }

                font-size: 14px;
                padding: 15px 20px;
            }

            #ending-title {
                font-size: 32px;
            }

            #ending-description {
                font-size: 16px;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fadeIn {
            animation: fadeIn 0.5s ease;
        }

        }

        function loadGameState() {
            const savedState = localStorage.getItem('luxGameState');
            if (savedState) {
                gameState = JSON.parse(savedState);
            }
        }

        function saveGameState() {
            localStorage.setItem('luxGameState', JSON.stringify(gameState));
        }

        function updateGameTime() {
            setInterval(() => {
                gameState.gameTime = Math.floor((Date.now() - gameState.startTime) / 1000);
                const minutes = Math.floor(gameState.gameTime / 60).toString().padStart(2, '0');
                const seconds = (gameState.gameTime % 60).toString().padStart(2, '0');
                gameTimeElement.textContent = `${minutes}:${seconds}`;
            }, 1000);
        }

        function renderNode(nodeId) {
            const node = gameData.nodes[nodeId];
            if (!node) {
                if (nodeId.startsWith('ending')) {
                    showEnding(nodeId);
                    return;
                }
                return;
            }

            nodeTitle.textContent = node.title;
            storyText.textContent = node.text;
            storyText.classList.add('fadeIn');

            optionsContainer.innerHTML = '';

            node.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-btn fadeIn';
                button.textContent = option.text;
                button.style.animationDelay = `${index * 0.1}s`;
                button.addEventListener('click', () => handleOption(option));
                optionsContainer.appendChild(button);
            });

            gameState.currentNode = nodeId;
            saveGameState();
        }

        function handleOption(option) {
            gameState.choices.push(option.choice);
            renderNode(option.nextNode);
        }

        function handleKeyPress(e) {
            if (e.key >= '1' && e.key <= '3') {
                const optionIndex = parseInt(e.key) - 1;
                const options = gameData.nodes[gameState.currentNode].options;
                if (options && options[optionIndex]) {
                    handleOption(options[optionIndex]);
                }
            }
        }

        function showEnding(endingId) {
            const ending = gameData.endings[endingId];
            if (ending) {
                endingTitle.textContent = ending.title;
                endingDescription.textContent = ending.description;
                endingScreen.style.display = 'flex';
            }
        }

        function restartGame() {
            gameState = {
                currentNode: 1,
                choices: [],
                startTime: Date.now(),
                gameTime: 0
            };
            saveGameState();
            endingScreen.style.display = 'none';
            renderNode(gameState.currentNode);
        }

        initGame();
    </script>
</body>
</html>
