    function ProgressRing({ progress, size = 120, strokeWidth = 8 }) {
      const radius = (size - strokeWidth) / 2;
      const circumference = radius * 2 * Math.PI;
      const offset = circumference - (progress / 100) * circumference;
      return (
        <svg width={size} height={size} className="transform -rotate-90">
          <circle cx={size/2} cy={size/2} r={radius} stroke="#E8E0D4" strokeWidth={strokeWidth} fill="none" />
          <circle
            cx={size/2} cy={size/2} r={radius} stroke="#C4703F" strokeWidth={strokeWidth} fill="none"
            strokeDasharray={circumference} strokeDashoffset={offset}
            strokeLinecap="round" className="progress-ring-circle"
          />
        </svg>

                    💡 提示
                  </button>
                  <button
                    onClick={handleReview}

                    className="px-3 py-1.5 text-xs font-medium bg-blue-50 text-blue-700 rounded-lg hover:bg-blue-100 transition-colors btn-press disabled:opacity-50"

                  <button

                    className="px-3 py-1.5 text-xs font-medium bg-cm-accent text-white rounded-lg hover:bg-cm-accent-dark transition-colors btn-press disabled:opacity-50"

                    {isReviewing ? '提交中...' : '✅ 提交'}

                  <button
                    onClick={handleRun}
                    className="ml-auto px-3 py-1.5 text-xs font-medium bg-green-50 text-green-700 rounded-lg hover:bg-green-100 transition-colors btn-press"

                  rows={16}

                {output && (
                  <div className="border-t border-cm-border">
                    <div className="px-4 py-2 bg-cm-bg/50 text-xs text-cm-text-secondary font-medium">输出</div>
                    <pre className="p-4 text-sm font-mono text-cm-text bg-cm-bg/30 overflow-x-auto">{output}</pre>
                  </div>

              {/* 审查结果 */}
              {reviewResult && (
                <div className="bg-white rounded-2xl p-5 shadow-sm border border-cm-border space-y-4">
                  <div className="flex items-center justify-between">
                    <h4 className="font-semibold text-cm-text">代码审查结果</h4>
                    <div className={`text-2xl font-bold ${
                      reviewResult.score >= 80 ? 'text-green-600' : reviewResult.score >= 60 ? 'text-yellow-600' : 'text-red-600'
                    }`}>
                      {reviewResult.score}分
                    </div>
                  </div>
                  <p className="text-sm text-cm-text">{reviewResult.summary}</p>

                  {/* 问题列表 */}
                  <div className="space-y-2">
                    {reviewResult.issues.map((issue, i) => (
                      <div key={i} className={`p-3 rounded-xl text-sm ${
                        issue.severity === 'warning' ? 'bg-yellow-50 border border-yellow-200' : 'bg-blue-50 border border-blue-200'
                      }`}>
                        <div className="flex items-center gap-2 mb-1">
                          <span className={`text-xs font-medium px-2 py-0.5 rounded-full ${
                            issue.severity === 'warning' ? 'bg-yellow-200 text-yellow-800' : 'bg-blue-200 text-blue-800'
                          }`}>
                            {issue.severity === 'warning' ? '⚠️' : 'ℹ️'} {issue.category}
                          </span>
                        </div>
                        <p className="text-cm-text">{issue.description}</p>
                        <p className="text-cm-text-secondary mt-1">建议：<code className="bg-cm-bg px-1.5 py-0.5 rounded text-xs font-mono">{issue.suggestion}</code></p>
                      </div>
                    ))}
                  </div>

                  {/* 改进后代码 */}
                  <div>
                    <h5 className="text-sm font-medium text-cm-text mb-2">改进后代码</h5>
                    <CodeBlock language="python" content={reviewResult.improvedCode} caption="改进版" />
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* 底部导航 */}
          <div className="flex items-center justify-between mt-6 bg-white rounded-2xl p-4 shadow-sm border border-cm-border">
            <button className="px-5 py-2.5 bg-cm-bg text-cm-text rounded-xl text-sm font-medium hover:bg-cm-border transition-colors btn-press">
              ← 上一课
            </button>
            <button className="px-6 py-2.5 bg-green-500 text-white rounded-xl text-sm font-medium hover:bg-green-600 transition-colors btn-press">
              ✓ 标记完成
            </button>
            <button className="px-5 py-2.5 bg-cm-bg text-cm-text rounded-xl text-sm font-medium hover:bg-cm-border transition-colors btn-press">
              下一课 →
            </button>
          </div>
        </div>
      );
    }

    function AIChat() {
      const [messages, setMessages] = useState([
        { id: 1, role: 'ai', content: AI_REPLIES.default, time: new Date() }
      ]);
      const [input, setInput] = useState('');
      const [isTyping, setIsTyping] = useState(false);
      const [selectedModel, setSelectedModel] = useState('GPT-4');
      const messagesEndRef = useRef(null);

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      };

      useEffect(() => { scrollToBottom(); }, [messages]);

      const handleSend = async (text) => {
        const msgText = text || input.trim();
        if (!msgText) return;

        const userMsg = { id: Date.now(), role: 'user', content: msgText, time: new Date() };
        setMessages(prev => [...prev, userMsg]);
        setInput('');
        setIsTyping(true);

        await simulateLoading(1000);

        const aiReply = { id: Date.now() + 1, role: 'ai', content: getAIReply(msgText), time: new Date() };
        setMessages(prev => [...prev, aiReply]);
        setIsTyping(false);
      };

      const quickActions = [
        { label: "解释代码", prompt: "请帮我解释一段代码" },
        { label: "优化代码", prompt: "请帮我优化一段代码" },
        { label: "生成测试", prompt: "请帮我生成测试用例" },
        { label: "Debug帮助", prompt: "我遇到了一个bug，请帮我调试" }
      ];

      return (
        <div className="page-enter flex flex-col h-[calc(100vh-8rem)] md:h-[calc(100vh-4rem)]">
          {/* 顶部栏 */}
          <div className="bg-white rounded-2xl p-3 shadow-sm border border-cm-border mb-4 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <select
                value={selectedModel}
                onChange={e => setSelectedModel(e.target.value)}
                className="text-sm bg-cm-bg border border-cm-border rounded-lg px-3 py-1.5 text-cm-text focus:outline-none focus:border-cm-accent"
              >
                <option>GPT-4</option>
                <option>Claude 3</option>
                <option>Gemini Pro</option>
              </select>
            </div>
            <button
              onClick={() => setMessages([{ id: Date.now(), role: 'ai', content: AI_REPLIES.default, time: new Date() }])}
              className="text-sm text-cm-text-secondary hover:text-cm-accent transition-colors px-3 py-1.5 rounded-lg hover:bg-cm-bg"
            >
              ✨ 新对话
            </button>
          </div>

          {/* 消息列表 */}
          <div className="flex-1 overflow-y-auto space-y-4 mb-4 px-1">
            {messages.map(msg => (
              <div key={msg.id} className={`msg-enter flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                <div className={`max-w-[85%] md:max-w-[70%] rounded-2xl px-4 py-3 ${
                  msg.role === 'user'
                    ? 'bg-cm-accent text-white'
                    : 'bg-white border border-cm-border shadow-sm'
                }`}>
                  {msg.role === 'ai' && (
                    <div className="flex items-center gap-2 mb-2">
                      <span className="text-sm">🤖</span>
                      <span className="text-xs font-medium text-cm-accent">CodeMentor AI</span>
                    </div>
                  )}
                  <div className={`text-sm leading-relaxed whitespace-pre-wrap ${
                    msg.role === 'user' ? 'text-white' : 'text-cm-text'
                  }`}>
                    <span dangerouslySetInnerHTML={{ __html: renderMarkdown(msg.content) }} />
                  </div>
                </div>
              </div>
            ))}
            {isTyping && (
              <div className="flex justify-start msg-enter">
                <div className="bg-white border border-cm-border shadow-sm rounded-2xl px-4 py-3">
                  <div className="flex items-center gap-2">
                    <span className="text-sm">🤖</span>
                    <div className="flex gap-1">
                      <span className="w-2 h-2 bg-cm-accent rounded-full animate-pulse-soft" style={{ animationDelay: '0s' }}></span>
                      <span className="w-2 h-2 bg-cm-accent rounded-full animate-pulse-soft" style={{ animationDelay: '0.3s' }}></span>
                      <span className="w-2 h-2 bg-cm-accent rounded-full animate-pulse-soft" style={{ animationDelay: '0.6s' }}></span>
                    </div>
                  </div>
                </div>
              </div>
            )}
            <div ref={messagesEndRef} />
          </div>

          {/* 快捷操作 */}
          <div className="flex flex-wrap gap-2 mb-3">
            {quickActions.map((action, i) => (
              <button
                key={i}
                onClick={() => handleSend(action.prompt)}
                className="px-3 py-1.5 bg-white border border-cm-border rounded-lg text-xs text-cm-text-secondary hover:bg-cm-accent/5 hover:text-cm-accent hover:border-cm-accent/30 transition-all btn-press"
              >
                {action.label}
              </button>
            ))}
          </div>

          {/* 输入区 */}
          <div className="bg-white rounded-2xl border border-cm-border shadow-sm flex items-end gap-2 p-3">
            <textarea
              className="flex-1 resize-none border-none outline-none text-sm text-cm-text placeholder:text-cm-text-secondary/50 py-1"
              rows={2}
              placeholder="输入你的问题..."
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } }}
            />
            <button
              onClick={() => handleSend()}
              disabled={!input.trim() || isTyping}
              className={`px-4 py-2 rounded-xl text-sm font-medium transition-all btn-press ${
                input.trim() && !isTyping
                  ? 'bg-cm-accent text-white hover:bg-cm-accent-dark'
                  : 'bg-cm-bg text-cm-text-secondary cursor-not-allowed'
              }`}
            >
              发送
            </button>
          </div>
        </div>
      );
    }

    // ==================== 页面：ProjectAnalysis ====================

    function ProjectAnalysis() {
      const [hasProject, setHasProject] = useState(false);
      const [isLoading, setIsLoading] = useState(false);
      const [uploadedFiles, setUploadedFiles] = useState([]);
      const [isDragging, setIsDragging] = useState(false);
      const [activeTab, setActiveTab] = useState('roadmap');
      const [activePhase, setActivePhase] = useState(0);
      const fileInputRef = useRef(null);

      const handleFileSelect = (e) => {
        const files = Array.from(e.target.files || e.dataTransfer.files);
        if (files.length > 0) {
          setUploadedFiles(files);
        }
      };

      const handleDragOver = (e) => {
        e.preventDefault();
        setIsDragging(true);
      };

      const handleDragLeave = () => setIsDragging(false);

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        const files = Array.from(e.dataTransfer.files);
        if (files.length > 0) {
          setUploadedFiles(files);
        }
      };

      const handleStartLearning = async () => {
        if (uploadedFiles.length === 0) return;
        setIsLoading(true);
        await simulateLoading(2500);
        setHasProject(true);
        setIsLoading(false);
      };

      if (isLoading) {
        return <LoadingSpinner text="AI 正在分析项目，生成学习指南..." />;
      }

      if (!hasProject) {
        return (
          <div className="page-enter max-w-2xl mx-auto">
            <div className="text-center mb-8">
              <h2 className="font-serif text-2xl font-bold text-cm-text">项目研习</h2>
              <p className="text-cm-text-secondary mt-2">上传你的项目代码，AI 将为你生成专属的学习指南</p>
            </div>
            <div className="bg-white rounded-2xl p-6 shadow-sm border border-cm-border">
              <label className="block text-sm font-medium text-cm-text mb-3">上传项目</label>
              <div
                className={`border-2 border-dashed rounded-xl p-8 text-center transition-all cursor-pointer ${
                  isDragging
                    ? 'border-cm-accent bg-cm-accent/5'
                    : uploadedFiles.length > 0
                    ? 'border-green-400 bg-green-50'
                    : 'border-cm-border hover:border-cm-accent/50 hover:bg-cm-bg'
                }`}
                onDragOver={handleDragOver}
                onDragLeave={handleDragLeave}
                onDrop={handleDrop}
                onClick={() => fileInputRef.current?.click()}
              >
                {uploadedFiles.length > 0 ? (
                  <div>
                    <span className="text-4xl block mb-2">📂</span>
                    <p className="text-sm font-medium text-cm-text">已选择 {uploadedFiles.length} 个文件</p>
                    <div className="mt-3 max-h-32 overflow-y-auto text-left">
                      {uploadedFiles.slice(0, 10).map((f, i) => (
                        <div key={i} className="text-xs text-cm-text-secondary py-0.5 flex items-center gap-2">
                          <span>📄</span>
                          <span className="truncate">{f.webkitRelativePath || f.name}</span>
                        </div>
                      ))}
                      {uploadedFiles.length > 10 && (
                        <p className="text-xs text-cm-text-secondary py-0.5">...还有 {uploadedFiles.length - 10} 个文件</p>
                      )}
                    </div>
                    <p className="text-xs text-cm-text-secondary mt-2">点击重新选择</p>
                  </div>
                ) : (
                  <div>
                    <span className="text-5xl block mb-3">📁</span>
                    <p className="text-sm font-medium text-cm-text">拖拽项目文件夹到此处</p>
                    <p className="text-xs text-cm-text-secondary mt-1">或点击选择文件</p>
                    <p className="text-xs text-cm-border mt-2">支持上传整个项目目录</p>
                  </div>
                )}
              </div>
              <input
                ref={fileInputRef}
                type="file"
                webkitdirectory=""
                directory=""
                multiple
                onChange={handleFileSelect}
                className="hidden"
              />
              <button
                onClick={handleStartLearning}
                disabled={uploadedFiles.length === 0}
                className={`w-full mt-4 py-3 rounded-xl text-white font-semibold text-sm transition-all btn-press ${
                  uploadedFiles.length > 0
                    ? 'bg-cm-accent hover:bg-cm-accent-dark shadow-lg shadow-cm-accent/20'
                    : 'bg-cm-border cursor-not-allowed'
                }`}
              >
                � 开始研习
              </button>
            </div>
          </div>
        );
      }

      const data = PROJECT_LEARNING_GUIDE;
      const totalDays = data.learningRoadmap.reduce((sum, p) => sum + p.estimatedDays, 0);

      const tabs = [
        { id: 'roadmap', label: '学习路线' },
        { id: 'concepts', label: '核心概念' },
        { id: 'code', label: '代码导读' }
      ];

      return (
        <div className="page-enter space-y-6">
          {/* 项目头部 */}
          <div className="bg-white rounded-2xl p-6 shadow-sm border border-cm-border">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <h2 className="font-serif text-2xl font-bold text-cm-text">{data.projectName}</h2>
                <p className="text-sm text-cm-text-secondary mt-1">{data.architecture.pattern}</p>
              </div>
              <div className="flex items-center gap-3">
                <div className="flex items-center gap-2 bg-cm-accent/10 px-4 py-2 rounded-xl">
                  <span className="text-xl">📅</span>
                  <div>
                    <p className="text-xl font-bold text-cm-accent">{totalDays}</p>
                    <p className="text-xs text-cm-text-secondary">预计学习天数</p>
                  </div>
                </div>
                <button
                  onClick={() => { setHasProject(false); setUploadedFiles([]); }}
                  className="px-4 py-2 bg-cm-bg text-cm-text rounded-xl text-sm hover:bg-cm-border transition-colors btn-press"
                >
                  重新上传
                </button>
              </div>
            </div>
          </div>

          {/* 项目概述 */}
          <div className="bg-gradient-to-r from-cm-accent/5 to-cm-accent/10 rounded-2xl p-6 border border-cm-accent/20">
            <div className="flex items-start gap-3">
              <span className="text-2xl">🤖</span>
              <div>
                <h4 className="font-semibold text-cm-accent mb-1">AI 学习指南</h4>
                <p className="text-sm text-cm-text leading-relaxed">{data.summary}</p>
              </div>
            </div>
          </div>

          {/* 标签页 */}
          <div className="flex gap-1 bg-white rounded-xl p-1 shadow-sm border border-cm-border">
            {tabs.map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`flex-1 py-2.5 rounded-lg text-sm font-medium transition-all ${
                  activeTab === tab.id
                    ? 'bg-cm-accent text-white shadow-sm'
                    : 'text-cm-text-secondary hover:text-cm-text hover:bg-cm-bg'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </div>

          {/* 学习路线 */}
          {activeTab === 'roadmap' && (
            <div className="page-enter">
              <div className="flex flex-col lg:flex-row gap-4">
                <div className="lg:w-64 space-y-2">
                  {data.learningRoadmap.map((phase, i) => (
                    <button
                      key={i}
                      onClick={() => setActivePhase(i)}
                      className={`w-full text-left p-4 rounded-xl transition-all ${

                        <div className="min-w-0">

                            {phase.estimatedDays} 天

                        </div>
                      </div>
                    </button>
                  ))}

                  {data.learningRoadmap[activePhase] && (
                    <div className="space-y-5">
                      <div>
                        <div className="flex items-center gap-3 mb-3">

                      </div>

                        <h4 className="text-sm font-semibold text-cm-text mb-3">📚 知识点</h4>

                                {j + 1}

                              <span className="text-sm text-cm-text">{kp}</span>

                        <p className="text-sm text-green-800">
                          <span className="font-semibold">✏️ 实战任务：</span>
                          {data.learningRoadmap[activePhase].practicalTask}
                        </p>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* 核心概念 */}
          {activeTab === 'concepts' && (
            <div className="page-enter space-y-4">
              {data.keyConcepts.map((concept, i) => (
                <div key={i} className="bg-white rounded-2xl p-5 shadow-sm border border-cm-border card-hover">

                    <span className="w-10 h-10 rounded-xl bg-cm-accent/10 text-cm-accent flex items-center justify-center text-lg flex-shrink-0">

                      <p className="text-sm text-cm-text-secondary leading-relaxed">{concept.description}</p>
                      <div className="flex flex-wrap gap-1.5 mt-3">
                        {concept.relatedFiles.map((file, j) => (
                          <span key={j} className="text-xs bg-cm-bg text-cm-text-secondary px-2 py-1 rounded-md font-mono">
                            {file}
                          </span>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* 代码导读 */}
          {activeTab === 'code' && (
            <div className="page-enter space-y-4">
              {data.codeHighlights.map((file, i) => (
                <div key={i} className="bg-white rounded-2xl p-5 shadow-sm border border-cm-border card-hover">
                  <div className="flex items-start gap-4">
                    <span className="text-2xl flex-shrink-0 mt-0.5">📄</span>
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-3 mb-2">
                        <h4 className="font-mono text-sm font-medium text-cm-accent">{file.file}</h4>
                        <span className="text-xs bg-cm-accent/10 text-cm-accent px-2.5 py-0.5 rounded-full font-medium">
                          {file.role}
                        </span>
                      </div>
                      <p className="text-sm text-cm-text-secondary leading-relaxed mb-3">{file.description}</p>
                      <div className="bg-cm-bg rounded-xl p-3">
                        <p className="text-xs text-cm-text-secondary">
                          <span className="font-semibold text-cm-text">学习要点：</span>
                          {file.learningPoint}
                        </p>
                      </div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ==================== 页面：Settings ====================

    function Settings() {
      const [activeTab, setActiveTab] = useState('api');
      const [temperature, setTemperature] = useState(0.7);
      const [maxTokens, setMaxTokens] = useState(2048);
      const [dailyMinutes, setDailyMinutes] = useState(30);
      const [learningStyle, setLearningStyle] = useState('balanced');
      const [difficulty, setDifficulty] = useState('medium');
      const [theme, setTheme] = useState('light');
      const [accentColor, setAccentColor] = useState('#C4703F');
      const [editorFontSize, setEditorFontSize] = useState(14);
      const [showAddModel, setShowAddModel] = useState(false);

      const configuredModels = [
        { id: 1, name: 'GPT-4', provider: 'OpenAI', status: 'active' },
        { id: 2, name: 'Claude 3', provider: 'Anthropic', status: 'inactive' }
      ];

      const tabs = [
        { id: 'api', label: 'API 配置' },
        { id: 'model', label: '模型设置' },
        { id: 'learning', label: '学习偏好' },
        { id: 'appearance', label: '外观主题' }
      ];

      return (
        <div className="page-enter space-y-6">
          <h2 className="font-serif text-2xl font-bold text-cm-text">设置</h2>

          {/* 标签页 */}
          <div className="flex gap-1 bg-white rounded-xl p-1 shadow-sm border border-cm-border">
            {tabs.map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`flex-1 py-2.5 rounded-lg text-sm font-medium transition-all ${
                  activeTab === tab.id
                    ? 'bg-cm-accent text-white shadow-sm'
                    : 'text-cm-text-secondary hover:text-cm-text hover:bg-cm-bg'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </div>

          {/* API 配置 */}
          {activeTab === 'api' && (
            <div className="space-y-4 page-enter">
              <div className="bg-white rounded-2xl p-6 shadow-sm border border-cm-border">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="font-semibold text-cm-text">已配置模型</h3>
                  <button
                    onClick={() => setShowAddModel(true)}
                    className="px-4 py-2 bg-cm-accent text-white rounded-xl text-sm font-medium hover:bg-cm-accent-dark transition-colors btn-press"
                  >
                    + 添加模型
                  </button>
                </div>
                <div className="space-y-3">
                  {configuredModels.map(model => (
                    <div key={model.id} className="flex items-center justify-between p-4 bg-cm-bg rounded-xl">
                      <div className="flex items-center gap-3">
                        <div className={`w-3 h-3 rounded-full ${model.status === 'active' ? 'bg-green-500' : 'bg-gray-300'}`}></div>
                        <div>
                          <p className="text-sm font-medium text-cm-text">{model.name}</p>
                          <p className="text-xs text-cm-text-secondary">{model.provider}</p>
                        </div>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className={`text-xs px-2.5 py-1 rounded-full ${
                          model.status === 'active' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'
                        }`}>
                          {model.status === 'active' ? '已启用' : '未启用'}
                        </span>
                        <button className="text-cm-text-secondary hover:text-red-500 transition-colors text-sm">删除</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* 添加模型弹窗 */}
              {showAddModel && (
                <div className="fixed inset-0 bg-black/30 z-50 flex items-center justify-center p-4" onClick={() => setShowAddModel(false)}>
                  <div className="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl" onClick={e => e.stopPropagation()}>
                    <h3 className="font-semibold text-cm-text text-lg mb-4">添加模型</h3>
                    <div className="space-y-4">
                      <div>
                        <label className="block text-sm font-medium text-cm-text mb-1.5">模型名称</label>
                        <input type="text" placeholder="例如：GPT-4 Turbo" className="w-full border border-cm-border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-cm-accent" />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-cm-text mb-1.5">API 地址</label>
                        <input type="text" placeholder="https://api.example.com/v1" className="w-full border border-cm-border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-cm-accent" />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-cm-text mb-1.5">API Key</label>
                        <input type="password" placeholder="sk-..." className="w-full border border-cm-border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-cm-accent" />
                      </div>
                    </div>
                    <div className="flex gap-3 mt-6">
                      <button onClick={() => setShowAddModel(false)} className="flex-1 py-2.5 bg-cm-bg text-cm-text rounded-xl text-sm font-medium hover:bg-cm-border transition-colors">取消</button>
                      <button onClick={() => setShowAddModel(false)} className="flex-1 py-2.5 bg-cm-accent text-white rounded-xl text-sm font-medium hover:bg-cm-accent-dark transition-colors">确认添加</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* 模型设置 */}
          {activeTab === 'model' && (
            <div className="bg-white rounded-2xl p-6 shadow-sm border border-cm-border space-y-8 page-enter">
              <div>
                <div className="flex items-center justify-between mb-3">
                  <label className="text-sm font-medium text-cm-text">Temperature</label>
                  <span className="text-sm text-cm-accent font-mono font-medium">{temperature.toFixed(1)}</span>
                </div>
                <input
                  type="range" min="0" max="2" step="0.1" value={temperature}
                  onChange={e => setTemperature(parseFloat(e.target.value))}
                  className="w-full h-2 bg-cm-bg rounded-full appearance-none cursor-pointer accent-cm-accent"
                />
                <div className="flex justify-between text-xs text-cm-text-secondary mt-1">
                  <span>精确 (0)</span>
                  <span>创意 (2)</span>
                </div>
              </div>

              <div>
                <div className="flex items-center justify-between mb-3">
                  <label className="text-sm font-medium text-cm-text">Max Tokens</label>
                  <span className="text-sm text-cm-accent font-mono font-medium">{maxTokens}</span>
                </div>
                <input
                  type="range" min="256" max="8192" step="256" value={maxTokens}
                  onChange={e => setMaxTokens(parseInt(e.target.value))}
                  className="w-full h-2 bg-cm-bg rounded-full appearance-none cursor-pointer accent-cm-accent"
                />
                <div className="flex justify-between text-xs text-cm-text-secondary mt-1">
                  <span>256</span>
                  <span>8192</span>
                </div>
              </div>
            </div>
          )}

          {/* 学习偏好 */}
          {activeTab === 'learning' && (
            <div className="space-y-4 page-enter">
              <div className="bg-white rounded-2xl p-6 shadow-sm border border-cm-border">
                <label className="block text-sm font-medium text-cm-text mb-3">每日学习时长</label>
                <div className="flex flex-wrap gap-3">
                  {[15, 30, 60, 90, 120].map(min => (
                    <button
                      key={min}
                      onClick={() => setDailyMinutes(min)}
                      className={`px-5 py-2.5 rounded-xl text-sm font-medium transition-all btn-press ${
                        dailyMinutes === min ? 'bg-cm-accent text-white' : 'bg-cm-bg text-cm-text hover:bg-cm-accent/10'
                      }`}
                    >
                      {min} 分钟
                    </button>
                  ))}
                </div>
              </div>

              <div className="bg-white rounded-2xl p-6 shadow-sm border border-cm-border">
                <label className="block text-sm font-medium text-cm-text mb-3">学习风格</label>
                <div className="flex flex-wrap gap-3">
                  {[
                    { id: 'balanced', label: '均衡' },
                    { id: 'theory', label: '理论优先' },
                    { id: 'practice', label: '实战优先' }
                  ].map(style => (
                    <button
                      key={style.id}
                      onClick={() => setLearningStyle(style.id)}
                      className={`px-5 py-2.5 rounded-xl text-sm font-medium transition-all btn-press ${
                        learningStyle === style.id ? 'bg-cm-accent text-white' : 'bg-cm-bg text-cm-text hover:bg-cm-accent/10'
                      }`}
                    >
                      {style.label}
                    </button>
                  ))}
                </div>
              </div>

              <div className="bg-white rounded-2xl p-6 shadow-sm border border-cm-border">
                <label className="block text-sm font-medium text-cm-text mb-3">难度偏好</label>
                <div className="flex flex-wrap gap-3">
                  {[
                    { id: 'easy', label: '入门' },
                    { id: 'medium', label: '进阶' },
                    { id: 'hard', label: '挑战' }
                  ].map(d => (
                    <button
                      key={d.id}
                      onClick={() => setDifficulty(d.id)}
                      className={`px-5 py-2.5 rounded-xl text-sm font-medium transition-all btn-press ${
                        difficulty === d.id ? 'bg-cm-accent text-white' : 'bg-cm-bg text-cm-text hover:bg-cm-accent/10'
                      }`}
                    >
                      {d.label}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* 外观主题 */}
          {activeTab === 'appearance' && (
            <div className="space-y-4 page-enter">
              <div className="bg-white rounded-2xl p-6 shadow-sm border border-cm-border">
                <label className="block text-sm font-medium text-cm-text mb-3">主题模式</label>
                <div className="flex gap-3">
                  {[
                    { id: 'light', label: '☀️ 浅色' },
                    { id: 'dark', label: '🌙 深色' },
                    { id: 'auto', label: '🔄 跟随系统' }
                  ].map(t => (
                    <button
                      key={t.id}
                      onClick={() => setTheme(t.id)}
                      className={`px-5 py-2.5 rounded-xl text-sm font-medium transition-all btn-press ${
                        theme === t.id ? 'bg-cm-accent text-white' : 'bg-cm-bg text-cm-text hover:bg-cm-accent/10'
                      }`}
                    >
                      {t.label}
                    </button>
                  ))}
                </div>
              </div>

              <div className="bg-white rounded-2xl p-6 shadow-sm border border-cm-border">
                <label className="block text-sm font-medium text-cm-text mb-3">强调色</label>
                <div className="flex gap-3">
                  {[
                    { color: '#C4703F', label: '赤陶橙' },
                    { color: '#2D6A4F', label: '森林绿' },
                    { color: '#7B2D8E', label: '皇家紫' },
                    { color: '#1D4ED8', label: '宝石蓝' },
                    { color: '#DC2626', label: '中国红' }
                  ].map(c => (
                    <button
                      key={c.color}
                      onClick={() => setAccentColor(c.color)}
                      className={`w-10 h-10 rounded-xl transition-all btn-press ${
                        accentColor === c.color ? 'ring-2 ring-offset-2 ring-cm-accent scale-110' : ''
                      }`}
                      style={{ backgroundColor: c.color }}
                      title={c.label}
                    />
                  ))}
                </div>
              </div>

              <div className="bg-white rounded-2xl p-6 shadow-sm border border-cm-border">
                <div className="flex items-center justify-between mb-3">
                  <label className="text-sm font-medium text-cm-text">编辑器字体大小</label>
                  <span className="text-sm text-cm-accent font-mono font-medium">{editorFontSize}px</span>
                </div>
                <input
                  type="range" min="10" max="24" step="1" value={editorFontSize}
                  onChange={e => setEditorFontSize(parseInt(e.target.value))}
                  className="w-full h-2 bg-cm-bg rounded-full appearance-none cursor-pointer accent-cm-accent"
                />
                <div className="flex justify-between text-xs text-cm-text-secondary mt-1">
                  <span>10px</span>
                  <span>24px</span>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==================== 主应用 ====================

    function App() {
      const [currentPage, setCurrentPage] = useState('dashboard');
      const [showLesson, setShowLesson] = useState(false);

      const handleNavigate = (page) => {
        if (page === 'learning' && showLesson) {
          setCurrentPage('lesson');
        } else {
          setShowLesson(false);
          setCurrentPage(page);
        }
      };

      const handleNavigateToLesson = () => {
        setShowLesson(true);
        setCurrentPage('lesson');
      };

      const renderPage = () => {
        switch (currentPage) {
          case 'dashboard':
            return <Dashboard onNavigate={setCurrentPage} />;
          case 'learning':
            return <LearningPath onNavigateToLesson={handleNavigateToLesson} />;
          case 'lesson':
            return <DailyLesson onBack={() => setCurrentPage('learning')} />;
          case 'chat':
            return <AIChat />;
          case 'project':
            return <ProjectAnalysis />;
          case 'settings':
            return <Settings />;
          default:
            return <Dashboard onNavigate={setCurrentPage} />;
        }
      };

      return (
        <div className="min-h-screen bg-cm-bg">
          <Sidebar currentPage={currentPage} onNavigate={handleNavigate} />
          <MobileNav currentPage={currentPage} onNavigate={handleNavigate} />
          <main className="main-content md:ml-60 p-4 md:p-8">
            {renderPage()}
          </main>
        </div>
      );
    }

    // 渲染应用
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
