<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>特征论坛 - 木木志</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>" />
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
    <link rel="stylesheet" href="./src/site-layout.css?v=20260604r10" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#677D2C",
              secondary: "#96B640",
              accent: "#B6CE74",
              grayed: "#6B7354",
              negative: "#7D2C67",
              positive: "#2C7D42",
              warning: "#7D6A2C",
              info: "#2C677D",
            },
            fontFamily: {
              sans: ["Inter", "PingFang SC", "Microsoft YaHei", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      @layer utilities {
        .hero-gradient {
          @apply bg-gradient-to-r from-primary/90 to-primary;
        }
        .forum-category {
          @apply bg-white rounded-lg shadow-sm p-4 border-l-4 border-primary hover:shadow-md transition-shadow;
        }
        .post-item {
          @apply bg-white rounded-lg shadow-sm p-4 hover:shadow-md transition-all duration-200 cursor-pointer text-left w-full;
        }
        .btn-operation {
          @apply px-3 py-1 rounded text-sm font-medium transition-all duration-200;
        }
        .feature-tag {
          @apply inline-flex items-center px-2 py-1 bg-secondary/20 text-primary rounded-full text-sm mr-2 mb-2 cursor-pointer hover:bg-secondary/40 transition-colors;
        }
        .forum-composer-toolbar button:not(:disabled) {
          @apply text-gray-500 hover:text-primary transition-colors p-1.5 rounded hover:bg-gray-50;
        }
        .forum-composer-toolbar button:disabled {
          @apply text-gray-300 cursor-not-allowed p-1.5 rounded;
        }
        .forum-composer-dock #generalPostComposer {
          @apply shadow-[0_6px_20px_rgba(0,0,0,0.12)];
        }
        .forum-back-top {
          @apply fixed z-50 w-12 h-12 rounded-full bg-primary text-white shadow-lg flex items-center justify-center transition-all duration-200;
          right: 1.25rem;
          bottom: 1.25rem;
          opacity: 0;
          visibility: hidden;
          transform: translateY(12px);
          pointer-events: none;
        }
        .forum-back-top.is-visible {
          @apply opacity-100 visible;
          transform: translateY(0);
          pointer-events: auto;
        }
        .forum-back-top.is-gutter {
          right: auto;
          bottom: auto;
        }
        .forum-back-top:hover {
          @apply bg-primary/90 shadow-xl;
        }
      }
    </style>
  </head>
  <body class="bg-gray-50 font-sans">
    <div id="site-nav-root"></div>

    <section class="hero-gradient text-white py-10">
      <div class="site-container">
        <h2 class="text-3xl font-bold mb-2">特征论坛</h2>
        <p class="text-white/90">在木木志讨论、验证、共建植物特征，每一条发言都在帮助物种识别更精准</p>
      </div>
    </section>

    <main class="site-container py-8">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div id="forumMainCol" class="lg:col-span-8 space-y-4">
          <div class="bg-white rounded-lg shadow-sm p-3 flex flex-wrap gap-2 items-center justify-between">
            <div class="flex flex-wrap gap-2" id="forumFilterTabs">
              <button type="button" class="forum-tab px-3 py-1 bg-primary text-white rounded text-sm" data-mode="all">全部</button>
              <button type="button" class="forum-tab px-3 py-1 bg-gray-100 rounded text-sm hover:bg-gray-200" data-mode="latest">最新发布</button>
              <button type="button" class="forum-tab px-3 py-1 bg-gray-100 rounded text-sm hover:bg-gray-200" data-mode="hot">最热讨论</button>
              <button type="button" class="forum-tab px-3 py-1 bg-gray-100 rounded text-sm hover:bg-gray-200" data-mode="pending">待验证</button>
            </div>
          </div>

          <div id="forumSearchRow" class="bg-white rounded-lg shadow-sm p-3 flex flex-wrap gap-2 items-center">
            <input
              id="postKeywordInput"
              type="text"
              placeholder="输入关键字搜索帖子"
              class="flex-1 min-w-[12rem] border border-gray-200 rounded px-3 py-2 text-sm"
            />
            <button type="button" id="runKeywordSearchBtn" class="btn-operation bg-primary text-white hover:bg-primary/90 px-4 py-2">搜索</button>
            <button type="button" id="clearKeywordSearchBtn" class="btn-operation bg-gray-100 text-gray-700 hover:bg-gray-200 px-4 py-2">清空</button>
          </div>

          <div id="forumComposerDock" class="forum-composer-dock">
            <div id="generalPostComposer" class="bg-white rounded-lg border border-gray-200 overflow-hidden">
              <div class="p-4 flex gap-3 items-start">
                <div
                  id="composerAvatar"
                  class="w-10 h-10 rounded-full bg-secondary flex items-center justify-center text-primary font-bold shrink-0 text-sm overflow-hidden mt-0.5"
                >
                  友
                </div>
                <div class="flex-1 min-w-0 flex flex-col">
                  <input
                    id="generalPostTitleInput"
                    type="text"
                    maxlength="120"
                    placeholder="标题"
                    class="w-full border-0 outline-none text-sm font-medium text-gray-900 placeholder:text-gray-400 py-1 leading-snug border-b border-gray-100"
                  />
                  <textarea
                    id="generalPostInput"
                    rows="3"
                    placeholder="分享此刻的想法…"
                    class="w-full border-0 outline-none resize-none text-sm text-gray-800 placeholder:text-gray-400 min-h-[3.5rem] pt-2"
                  ></textarea>
                </div>
              </div>
              <div id="composerImagePreview" class="hidden px-4 pb-2 flex flex-wrap gap-2"></div>
              <div id="composerEmojiPanel" class="hidden px-4 pb-2 flex flex-wrap gap-1 border-t border-gray-100 pt-2"></div>
              <div class="px-4 py-3 flex items-center justify-between border-t border-gray-100 forum-composer-toolbar">
                <div class="flex items-center gap-1">
                  <button type="button" id="composerEmojiBtn" title="添加表情" aria-label="添加表情">
                    <i class="fa fa-smile-o text-lg"></i>
                  </button>
                  <button type="button" id="composerImageBtn" title="添加图片" aria-label="添加图片">
                    <i class="fa fa-picture-o text-lg"></i>
                  </button>
                  <input
                    type="file"
                    id="composerImageInput"
                    accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp"
                    multiple
                    class="hidden"
                  />
                </div>
                <button
                  type="button"
                  id="composerSubmitBtn"
                  class="btn-operation bg-primary !text-white hover:bg-primary/90 px-5 py-1.5 rounded-lg text-sm font-medium"
                >
                  发送
                </button>
              </div>
              <p id="composerError" class="hidden px-4 pb-3 text-sm text-red-600"></p>
            </div>
          </div>

          <div id="postsList" class="space-y-3"></div>

          <div class="text-center py-2">
            <button type="button" id="loadMorePostsBtn" class="btn-operation bg-primary/10 text-primary hover:bg-primary/20 px-6 py-2 rounded-lg">
              加载更多
            </button>
          </div>

          <div id="forumStatus" class="text-xs text-gray-500 px-1"></div>

          <section id="postCard" class="hidden bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-6 border-b border-gray-100 flex items-start justify-between gap-3">
              <div class="min-w-0 flex-1">
                <h3 id="postTitle" class="text-lg font-bold text-gray-800">帖子详情</h3>
                <div id="postHeaderMeta" class="mt-2 text-sm text-gray-500 flex flex-wrap gap-x-2 gap-y-1"></div>
                <div id="postReportActions" class="hidden mt-2 flex flex-wrap gap-3 text-xs"></div>
              </div>
              <button
                type="button"
                id="collapsePostBtn"
                class="shrink-0 text-sm px-3 py-1.5 rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50 hover:text-gray-800 transition-colors"
              >
                <i class="fa fa-chevron-up mr-1" aria-hidden="true"></i>收起帖子
              </button>
            </div>

            <div class="p-6 border-b border-gray-100">
              <div class="flex gap-4">
                <div
                  id="opAvatar"
                  class="w-12 h-12 rounded-full bg-secondary flex items-center justify-center text-primary font-bold shrink-0"
                >
                  认
                </div>
                <div class="min-w-0 flex-1">
                  <div class="flex flex-wrap items-baseline justify-between gap-2">
                    <div class="flex items-center gap-2">
                      <span id="opName" class="font-medium text-gray-800">楼主</span>
                      <span id="opLv" class="text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-600">Lv.8</span>
                    </div>
                    <span id="opTime" class="text-xs text-gray-500"></span>
                  </div>
                  <div class="mt-2 flex flex-wrap items-center gap-2">
                    <span id="opActionBadge" class="px-2 py-0.5 rounded-full text-xs font-medium bg-green-50 text-green-700">新增操作</span>
                    <span id="opScoreLine" class="text-sm text-gray-600">分值变化：+5（初始0→5）</span>
                  </div>
                  <p id="postContent" class="mt-3 text-gray-700 leading-relaxed whitespace-pre-wrap"></p>
                  <div id="opEvidence" class="mt-3 flex flex-wrap gap-2"></div>
                </div>
              </div>
            </div>

            <div id="commentsList"></div>

            <div class="p-6 space-y-4 border-t border-gray-100">
              <div>
                <label for="commentOnlyInput" class="block text-sm font-medium text-gray-700 mb-1">发表评论</label>
                <textarea
                  id="commentOnlyInput"
                  rows="3"
                  placeholder="写下你的评论…"
                  class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none"
                ></textarea>
                <div id="commentImagePreview" class="hidden flex flex-wrap gap-2 mt-2"></div>
                <div id="commentEmojiPanel" class="hidden flex flex-wrap gap-1 mt-2 p-2 bg-gray-50 rounded-lg border border-gray-100"></div>
                <div class="mt-2 flex flex-wrap items-center justify-between gap-2">
                  <div class="flex items-center gap-1 forum-composer-toolbar">
                    <button type="button" id="commentEmojiBtn" title="添加表情" aria-label="添加表情">
                      <i class="fa fa-smile-o text-lg"></i>
                    </button>
                    <button type="button" id="commentImageBtn" title="添加图片" aria-label="添加图片">
                      <i class="fa fa-picture-o text-lg"></i>
                    </button>
                    <input
                      type="file"
                      id="commentImageInput"
                      accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp"
                      multiple
                      class="hidden"
                    />
                  </div>
                  <div class="flex flex-wrap gap-2">
                    <button type="button" id="submitCommentOnlyBtn" class="btn-operation bg-primary text-white px-4 py-2 rounded-lg hover:bg-primary/90">
                      提交评论
                    </button>
                    <button type="button" id="submitSupportBtn" class="btn-operation bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
                      支持
                    </button>
                    <button type="button" id="submitOpposeBtn" class="btn-operation bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700">
                      反对
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>

        <aside class="lg:col-span-4">
          <div id="forumSidebarSticky" class="space-y-4 lg:sticky lg:top-[5.5rem] lg:z-20">
          <div class="forum-category">
            <h3 class="font-bold text-gray-800 mb-3"><i class="fa fa-th-list mr-1 text-primary"></i> 特征分类</h3>
            <div id="forumCategoryList" class="space-y-2 text-sm">
              <p class="text-gray-400">加载中…</p>
            </div>
          </div>

          <div class="forum-category">
            <h3 class="font-bold text-gray-800 mb-3"><i class="fa fa-bar-chart mr-1 text-primary"></i> 论坛统计</h3>
            <div class="grid grid-cols-2 gap-2 text-sm">
              <div class="text-center p-2 bg-gray-50 rounded">
                <div id="statUnconfirmedPosts" class="font-bold text-grayed">—</div>
                <div class="text-xs text-gray-500">未认定</div>
              </div>
              <div class="text-center p-2 bg-gray-50 rounded">
                <div id="statConfirmedPosts" class="font-bold text-positive">—</div>
                <div class="text-xs text-gray-500">已认定</div>
              </div>
              <div class="text-center p-2 bg-gray-50 rounded">
                <div id="statRejectedPosts" class="font-bold text-negative">—</div>
                <div class="text-xs text-gray-500">不可取</div>
              </div>
              <div class="text-center p-2 bg-gray-50 rounded">
                <div id="statNewPostsToday" class="font-bold text-primary">—</div>
                <div class="text-xs text-gray-500">今日新增帖子</div>
              </div>
            </div>
          </div>

          <div class="forum-category">
            <h3 class="font-bold text-gray-800 mb-3"><i class="fa fa-tags mr-1 text-primary"></i> 热门特征标签</h3>
            <div id="forumHotTags" class="flex flex-wrap gap-2">
              <p class="text-sm text-gray-400">加载中…</p>
            </div>
          </div>
          </div>
        </aside>
      </div>
    </main>

    <footer class="footer mt-10">
      <div class="site-container footer-inner">
        <div>
          <p>© 2026 木木志 版权所有</p>
          <p class="muted">本平台数据仅供科普研究使用，禁止商用</p>
        </div>
        <div class="footer-links">
          <a href="./legal.html#privacy-policy">隐私政策</a>
          <a href="./legal.html#user-agreement">用户协议</a>
        </div>
      </div>
    </footer>

    <div
      id="imageLightbox"
      class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/80 p-4"
      role="dialog"
      aria-modal="true"
    >
      <button type="button" class="absolute top-4 right-4 text-white text-3xl leading-none hover:opacity-80" id="lightboxClose" aria-label="关闭">
        ×
      </button>
      <img id="lightboxImg" alt="预览" class="max-w-full max-h-[90vh] rounded-lg shadow-lg" />
    </div>

    <div
      id="forumEvidenceOverlay"
      class="hidden fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black/50"
      role="dialog"
      aria-modal="true"
    >
      <div class="bg-white rounded-xl shadow-xl max-w-lg w-full max-h-[90vh] overflow-y-auto">
        <div class="px-5 py-4 border-b border-gray-100 flex items-start justify-between gap-3">
          <h4 id="forumEvidenceTitle" class="text-lg font-semibold text-gray-800">上传图片证据</h4>
          <button type="button" id="forumEvidenceCloseBtn" class="text-gray-400 hover:text-gray-600 text-xl leading-none" aria-label="关闭">
            &times;
          </button>
        </div>
        <div class="px-5 py-4">
          <p class="text-sm text-gray-600 mb-3">
            支持、反对须上传图片证据。仅支持 jpg / png / webp，最多 6 张，超大图片将自动压缩。
          </p>
          <input
            type="file"
            id="forumEvidenceInput"
            accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp"
            multiple
            class="block w-full text-sm text-gray-500 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-primary/10 file:text-primary"
          />
          <div id="forumEvidencePreview" class="flex flex-wrap gap-2 mt-3"></div>
          <label class="block mt-4 text-sm text-gray-600">
            <span class="block mb-1">说明（可选）</span>
            <textarea
              id="forumEvidenceNote"
              rows="2"
              class="w-full px-3 py-2 rounded-lg border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/25"
              placeholder="补充说明…"
            ></textarea>
          </label>
          <p id="forumEvidenceError" class="hidden mt-3 text-sm text-red-600"></p>
        </div>
        <div class="px-5 py-4 flex flex-wrap gap-2 justify-end border-t border-gray-100 bg-gray-50 rounded-b-xl">
          <button type="button" id="forumEvidenceCancelBtn" class="px-4 py-2 text-sm rounded-lg border border-gray-200 hover:bg-gray-100">
            取消
          </button>
          <button type="button" id="forumEvidenceSubmitBtn" class="px-4 py-2 text-sm rounded-lg bg-primary text-white hover:bg-primary/90">
            提交
          </button>
        </div>
      </div>
    </div>

    <button
      type="button"
      id="forumBackTopBtn"
      class="forum-back-top"
      aria-label="回到顶部"
      title="回到顶部"
    >
      <i class="fa fa-chevron-up text-lg" aria-hidden="true"></i>
    </button>

    <script type="module">
      import { initSiteNav } from "./src/site-nav.js";
      initSiteNav("forum");
    </script>
    <script type="module" src="./src/forum.js"></script>
  </body>
</html>
