<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>物种特征 - 木木志</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>" />
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
    <link rel="stylesheet" href="./src/site-layout.css?v=20260604r10" />
    <link rel="stylesheet" href="./src/styles.css?v=20260604r11" />
    <script src="./src/theme-colors.js?v=20260604r11"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: window.PLANTS_THEME.colors,
            fontFamily: window.PLANTS_THEME.fontFamily,
          },
        },
      };
    </script>
  </head>
  <body class="page-body font-sans">
    <div id="site-nav-root"></div>

    <section class="species-search-hero">
      <div class="site-container">
        <div class="max-w-2xl mx-auto text-center">
          <h1>物种搜索</h1>
          <p class="hero-desc">输入中文名或学名，检索物种特征与分类信息</p>
        </div>
        <div class="max-w-2xl mx-auto relative">
          <input
            type="text"
            id="speciesSearchInput"
            placeholder="搜索物种中文名、学名…"
            class="species-search-input"
          />
          <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-grayed" aria-hidden="true"></i>
          <button type="button" id="speciesSearchBtn" class="species-search-btn">搜索</button>
        </div>
        <ul id="speciesSuggestList" class="species-suggest-list hidden"></ul>
      </div>
    </section>

    <main class="site-container py-6">
      <div id="speciesEmpty" class="species-empty-card">
        <div class="species-empty-icon">
          <i class="fa fa-leaf" aria-hidden="true"></i>
        </div>
        <h2 class="species-empty-title">开始探索物种特征</h2>
        <p class="species-empty-desc">
          在上方搜索框输入物种名称，从下拉列表中选择，即可查看该物种的结构化特征与分类路径。
        </p>
      </div>

      <p id="pageError" class="hidden text-center text-negative py-8"></p>

      <div id="speciesMain" class="hidden">
        <div class="bg-white rounded-xl shadow-sm p-6 mb-6 border border-accent/20">
          <div class="flex flex-col md:flex-row gap-6">
            <div class="w-full md:w-64 h-48 rounded-lg overflow-hidden bg-brand-light shrink-0 border border-accent/20">
              <img id="speciesHeroImg" src="" alt="" class="w-full h-full object-cover" />
            </div>
            <div class="flex-1 min-w-0">
              <h2 id="speciesTitle" class="text-2xl font-bold text-primary mb-2">—</h2>
              <p id="speciesSubtitle" class="text-grayed mb-4">—</p>
              <div id="speciesTaxonomyPath" class="text-sm text-grayed/90 mb-4"></div>
              <div id="speciesFeatureNarrative" class="text-sm leading-7 text-brand-dark mb-4 space-y-3"></div>
              <div class="species-action-row">
                <button type="button" class="action-btn action-btn-primary" id="btnFavorite">
                  <i class="fa fa-star-o"></i> 收藏物种
                </button>
                <button type="button" class="action-btn action-btn-outline" id="btnShare">
                  <i class="fa fa-share"></i> 分享
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm p-6 border border-accent/20">
          <h3 class="text-xl font-bold text-brand-darker mb-2 pb-3 border-b border-accent/25">物种特征</h3>
          <div id="featureSections"></div>
        </div>
      </div>
    </main>

    <footer class="footer mt-10">
      <div class="container footer-inner">
        <div>
          <p>© 2026 木木志 版权所有</p>
          <p class="muted">本平台数据仅供科普研究使用，禁止商用</p>
        </div>
        <div class="footer-links">
          <a href="./legal.html#privacy-policy">隐私政策</a>
          <a href="./legal.html#user-agreement">用户协议</a>
        </div>
      </div>
    </footer>

    <script type="module" src="./src/species-result.js"></script>
  </body>
</html>
