      const postsData = [
        { id: 1, title: '如何区分垂丝海棠和西府海棠？', content: '垂丝海棠与西府海棠在花梗长度、花瓣形态、果实形状等方面存在明显差异。垂丝海棠花梗细长下垂，花瓣粉红色，果实梨形；西府海棠花梗较短，花粉红色至白色，果实圆形。本文整理了5个关键鉴别特征，欢迎补充。', author: '植物猎人', level: 8, time: '2026-06-17 10:23', replies: 32, views: 568, status: '已认定' },
        { id: 2, title: '樱花、桃花、杏花的快速区分指南', content: '春季赏花时，樱花、桃花、杏花常常让人混淆。通过花瓣形状、花梗长度、树干纹理等特征可以快速区分。樱花花瓣有缺口，花梗较长；桃花花瓣较圆，花梗极短；杏花单生，花瓣白色或淡粉。', author: '花间集', level: 5, time: '2026-06-16 18:45', replies: 45, views: 892, status: '已认定' },
        { id: 3, title: '讨论：月季与玫瑰的数字化特征定义', content: '市场上常将月季误称为玫瑰，从植物学角度，二者在叶片、刺、花型等方面有明确区别。月季叶片光滑，刺较少且扁平；玫瑰叶片皱褶，刺密集且细小。我们需要将这些特征数字化，建立可筛选的标准。', author: '园艺师小王', level: 6, time: '2026-06-16 14:12', replies: 28, views: 423, status: '待验证' },
        { id: 4, title: '银杏的雌雄株鉴别特征汇总', content: '银杏是雌雄异株植物，雌株结白果，雄株不结果。但如何通过营养器官在结果前鉴别雌雄？目前研究发现叶形、叶脉角度、芽体形态等存在一定差异，但准确性有限，期待更多数据支持。', author: '林科院小张', level: 9, time: '2026-06-15 09:30', replies: 56, views: 1205, status: '已认定' },
        { id: 5, title: '水杉与落羽杉的叶片特征对比', content: '水杉和落羽杉都是杉科落叶乔木，叶片形态相似。水杉叶片对生，落羽杉叶片互生；水杉叶片条形扁平，落羽杉叶片钻形。这些特征在幼苗期尤为明显，是快速鉴别的关键。', author: '湿地观察员', level: 4, time: '2026-06-14 16:20', replies: 19, views: 334, status: '待验证' },
        { id: 6, title: '紫藤的花色变异与品种识别', content: '紫藤常见花色有紫色、白色、粉红色等，不同品种在花序长度、开花时间、叶片形态上也有差异。日本紫藤花序较长，中国紫藤花序较短但花香更浓。如何建立标准化的特征描述体系？', author: '藤本爱好者', level: 7, time: '2026-06-13 11:08', replies: 23, views: 445, status: '已认定' },
      ];

      let currentPosts = [...postsData];
      let activePostId = null;

      function renderPosts(posts) {
        const list = document.getElementById('postsList');
        if (!posts.length) {
          list.innerHTML = '<div style="text-align:center;padding:2rem;color:#9ca3af;">暂无帖子</div>';
          return;
        }
        list.innerHTML = posts.map(post => `
          <div class="post-card" data-id="${post.id}">
            <div class="post-header">
              <h4 class="post-title">${post.title}</h4>
            </div>
            <p class="post-content">${post.content}</p>
            <div class="post-footer">
              <span><i class="fa fa-user"></i> ${post.author}</span>
              <span><i class="fa fa-comment"></i> ${post.replies}条回复</span>
              <span><i class="fa fa-eye"></i> ${post.views}次浏览</span>
              <span style="color: ${post.status === '已认定' ? '#059669' : post.status === '待验证' ? '#d97706' : '#6b7280'};">${post.status}</span>
            </div>
          </div>
        `).join('');

        list.querySelectorAll('.post-card').forEach(card => {
          card.addEventListener('click', function() {
            const id = parseInt(this.dataset.id);
            showPostDetail(id);
          });
        });
      }

      function showPostDetail(id) {
        const post = postsData.find(p => p.id === id);
        if (!post) return;
        activePostId = id;
        document.getElementById('postTitle').textContent = post.title;
        document.getElementById('postHeaderMeta').innerHTML = `<span>${post.author}</span> · <span>${post.time}</span> · <span style="color: ${post.status === '已认定' ? '#059669' : '#d97706'}">${post.status}</span>`;
        document.getElementById('opName').textContent = post.author;
        document.getElementById('opLv').textContent = 'Lv.' + post.level;
        document.getElementById('opTime').textContent = post.time;
        document.getElementById('postContent').textContent = post.content;
        document.getElementById('opAvatar').textContent = post.author.charAt(0);

        // Demo comments
        const comments = [
          { author: '植物小白', content: '非常有用的鉴别指南，收藏了！', time: '2026-06-17 11:05' },
          { author: '园林设计李工', content: '在实际工作中这些特征确实很实用，建议补充花期差异。', time: '2026-06-17 12:30' },
          { author: '山野行者', content: '我在野外观察到的现象与描述一致，支持这个特征定义。', time: '2026-06-17 14:15' },
        ];
        document.getElementById('commentsList').innerHTML = comments.map(c => `
          <div class="comment-item">
            <div class="comment-avatar">${c.author.charAt(0)}</div>
            <div class="comment-content">
              <div class="comment-author">${c.author}</div>
              <div class="comment-text">${c.content}</div>
              <div class="comment-time">${c.time}</div>
            </div>
          </div>
        `).join('');

        document.getElementById('postCard').style.display = 'block';
        document.getElementById('postCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      document.getElementById('collapsePostBtn').addEventListener('click', function() {
        document.getElementById('postCard').style.display = 'none';
        activePostId = null;
      });

      // Tabs
      document.querySelectorAll('.forum-tab').forEach(tab => {
        tab.addEventListener('click', function() {
          document.querySelectorAll('.forum-tab').forEach(t => t.classList.remove('active'));
          this.classList.add('active');
          const mode = this.dataset.mode;
          if (mode === 'all') currentPosts = [...postsData];
          else if (mode === 'latest') currentPosts = [...postsData].sort((a, b) => b.id - a.id);
          else if (mode === 'hot') currentPosts = [...postsData].sort((a, b) => b.views - a.views);
          else if (mode === 'pending') currentPosts = postsData.filter(p => p.status === '待验证');
          renderPosts(currentPosts);
        });
      });

      // Search
      document.getElementById('runKeywordSearchBtn').addEventListener('click', function() {
        const val = document.getElementById('postKeywordInput').value.trim().toLowerCase();
        if (!val) { currentPosts = [...postsData]; }
        else { currentPosts = postsData.filter(p => p.title.toLowerCase().includes(val) || p.content.toLowerCase().includes(val)); }
        renderPosts(currentPosts);
      });

      document.getElementById('clearKeywordSearchBtn').addEventListener('click', function() {
        document.getElementById('postKeywordInput').value = '';
        currentPosts = [...postsData];
        renderPosts(currentPosts);
      });

      // New post
      document.getElementById('composerSubmitBtn').addEventListener('click', function() {
        const title = document.getElementById('generalPostTitleInput').value.trim();
        const content = document.getElementById('generalPostInput').value.trim();
        const errorEl = document.getElementById('composerError');
        if (!title || !content) {
          errorEl.textContent = '请填写标题和内容';
          errorEl.style.display = 'block';
          return;
        }
        errorEl.style.display = 'none';
        const newPost = {
          id: postsData.length + 1,
          title, content,
          author: '我', level: 1,
          time: new Date().toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).replace(/\//g, '-'),
          replies: 0, views: 1, status: '待验证'
        };
        postsData.unshift(newPost);
        currentPosts = [...postsData];
        renderPosts(currentPosts);
        document.getElementById('generalPostTitleInput').value = '';
        document.getElementById('generalPostInput').value = '';
      });

      // Comment
      document.getElementById('submitCommentOnlyBtn').addEventListener('click', function() {
        const content = document.getElementById('commentOnlyInput').value.trim();
        if (!content || !activePostId) return;
        const post = postsData.find(p => p.id === activePostId);
        if (post) post.replies++;
        const commentHtml = `
          <div class="comment-item">
            <div class="comment-avatar">我</div>
            <div class="comment-content">
              <div class="comment-author">我</div>
              <div class="comment-text">${content}</div>
              <div class="comment-time">刚刚</div>
            </div>
          </div>
        `;
        document.getElementById('commentsList').insertAdjacentHTML('beforeend', commentHtml);
        document.getElementById('commentOnlyInput').value = '';
        renderPosts(currentPosts);
      });

      document.getElementById('submitSupportBtn').addEventListener('click', function() {
        if (!activePostId) return;
        alert('已提交支持！');
      });

      document.getElementById('submitOpposeBtn').addEventListener('click', function() {
        if (!activePostId) return;
        alert('已提交反对！');
      });

      // Load more
      document.getElementById('loadMorePostsBtn').addEventListener('click', function() {
        this.textContent = '没有更多内容了';
        this.disabled = true;
        this.style.opacity = '0.6';
      });

      // Back to top
      const backTopBtn = document.getElementById('forumBackTopBtn');
      window.addEventListener('scroll', function() {
        if (window.scrollY > 300) backTopBtn.classList.add('visible');
        else backTopBtn.classList.remove('visible');
      });
      backTopBtn.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      // Lightbox
      document.getElementById('lightboxClose').addEventListener('click', function() {
        document.getElementById('imageLightbox').classList.remove('active');
      });

      // Init
      renderPosts(currentPosts);
    </script>
  </body>
</html>
