      const searchInput = document.getElementById('speciesSearchInput');
      const suggestList = document.getElementById('speciesSuggestList');
      const speciesEmpty = document.getElementById('speciesEmpty');
      const speciesMain = document.getElementById('speciesMain');
      const pageError = document.getElementById('pageError');

      function showSpecies(name) {
        const data = speciesDB[name];
        if (!data) {
          pageError.textContent = '未找到物种：' + name;
          pageError.classList.remove('hidden');
          speciesEmpty.classList.add('hidden');
          speciesMain.style.display = 'none';
          return;
        }
        pageError.classList.add('hidden');
        speciesEmpty.classList.add('hidden');
        speciesMain.style.display = 'block';

        document.getElementById('speciesHeroImg').src = data.image;
        document.getElementById('speciesHeroImg').alt = name;
        document.getElementById('speciesTitle').textContent = name;
        document.getElementById('speciesSubtitle').textContent = data.latin + ' | ' + data.family;
        document.getElementById('speciesTaxonomyPath').innerHTML = data.taxonomy.split(' > ').map(t => `<span style="background:#f3f4f6;padding:0.125rem 0.5rem;border-radius:0.25rem;font-size:0.8rem;">${t}</span>`).join(' <span style="color:#9ca3af;">></span> ');
        document.getElementById('speciesFeatureNarrative').textContent = data.desc;

        const featureSections = document.getElementById('featureSections');
        featureSections.innerHTML = Object.entries(data.features).map(([sectionTitle, items]) => `
          <div class="feature-section">
            <h4 class="feature-section-title">${sectionTitle}</h4>
            <div class="feature-grid">
              ${items.map(item => `
                <div class="feature-item">
                  <span class="feature-label">${item.label}</span>
                  <span class="feature-value">${item.value}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `).join('');
      }

      // Search suggestions
      searchInput.addEventListener('input', function() {
        const val = this.value.trim();
        if (!val) { suggestList.classList.add('hidden'); return; }
        const matches = Object.keys(speciesDB).filter(name => name.includes(val));
        if (matches.length) {
          suggestList.innerHTML = matches.map(name => {
            const data = speciesDB[name];
            return `<li onclick="selectSpecies('${name}')">${name} <span style="color:#999;font-size:0.8rem;">${data.latin}</span></li>`;
          }).join('');
          suggestList.classList.remove('hidden');
        } else {
          suggestList.classList.add('hidden');
        }
      });

      function selectSpecies(name) {
        searchInput.value = name;
        suggestList.classList.add('hidden');
        showSpecies(name);
      }

      searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          const val = this.value.trim();
          if (val) showSpecies(val);
        }
      });

      document.getElementById('speciesSearchBtn').addEventListener('click', function() {
        const val = searchInput.value.trim();
        if (val) showSpecies(val);
      });

      document.addEventListener('click', function(e) {
        if (!e.target.closest('.species-search-wrap') && !e.target.closest('.species-suggest-list')) {
          suggestList.classList.add('hidden');
        }
      });

      // Buttons
      document.getElementById('btnFavorite').addEventListener('click', function() {
        alert('已收藏该物种！');
      });

      document.getElementById('btnShare').addEventListener('click', function() {
        alert('分享链接已复制到剪贴板！');
      });

      // Check URL param
      const urlParams = new URLSearchParams(window.location.search);
      const q = urlParams.get('q');
      if (q) {
        searchInput.value = q;
        showSpecies(q);
      }
    </script>
