<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵感捕手 - AI闪念胶囊</title>
    <style>
        :root {
            --bg-color: #f7f8fa;
            --card-bg: #ffffff;
            --primary: #5b8def;
            
            /* 浅色调分类 */
            --todo-bg: #fdeced; --todo-text: #d32f2f; --todo-border: #f5c6cb;
            --idea-bg: #e8f0fe; --idea-text: #1976d2; --idea-border: #c2dbff;
            --mood-bg: #fff8e1; --mood-text: #f57c00; --mood-border: #ffecb3;
            --daily-bg: #e8f5e9; --daily-text: #388e3c; --daily-border: #c8e6c9;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); margin: 0; padding: 0; display: flex; justify-content: center; height: 100vh; color: #333; }
        .app-container { width: 400px; background: var(--bg-color); height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        
        /* Header */
        .header { padding: 20px; background: var(--card-bg); text-align: center; border-bottom: 1px solid #f0f0f0; }
        .header h1 { margin: 0; font-size: 18px; font-weight: 600; color: #333; }
        .header p { margin: 4px 0 0; font-size: 12px; color: #999; }
        
        /* List */
        .list-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        
        /* Capsule Card */
        .capsule { background: var(--card-bg); border-radius: 12px; padding: 14px 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); transition: all 0.3s ease; }
        .capsule-loading { text-align: center; color: #999; font-size: 13px; }
        
        .capsule-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .tag { font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 10px; }
        .tag.t-todo { background: var(--todo-bg); color: var(--todo-text); }
        .tag.t-idea { background: var(--idea-bg); color: var(--idea-text); }
        .tag.t-mood { background: var(--mood-bg); color: var(--mood-text); }
        .tag.t-daily { background: var(--daily-bg); color: var(--daily-text); }
        
        .time { font-size: 11px; color: #aaa; }
        
        .capsule-body { font-size: 14px; color: #444; line-height: 1.6; margin-bottom: 8px; }
        
        .todo-card { background: var(--todo-bg); border: 1px solid var(--todo-border); border-radius: 8px; padding: 8px 12px; margin-top: 10px; font-size: 13px; color: var(--todo-text); display: flex; align-items: center; justify-content: space-between; }
        .add-btn { background: #fff; border: none; color: var(--todo-text); font-size: 12px; padding: 3px 8px; border-radius: 4px; cursor: pointer; border: 1px solid var(--todo-border); }

        /* Input Area */
        .input-area { background: var(--card-bg); padding: 12px 16px; border-top: 1px solid #f0f0f0; display: flex; align-items: center; gap: 10px; }
        .text-input { flex: 1; height: 36px; border: 1px solid #ddd; border-radius: 18px; padding: 0 15px; font-size: 14px; outline: none; transition: border-color 0.2s; background: #f9f9f9; }
        .text-input:focus { border-color: var(--primary); background: #fff; }
        .voice-btn { width: 36px; height: 36px; border: none; background: #f0f2f5; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
        .send-btn { height: 36px; padding: 0 16px; border: none; background: var(--primary); color: #fff; border-radius: 18px; cursor: pointer; font-size: 14px; font-weight: 500; }
        .send-btn:disabled { background: #aac4f5; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>💡 我的闪念</h1>
        <p>打字或语音，剩下的交给AI</p>
    </div>
    
    <div class="list-container" id="list">
        <!-- 预置胶囊：灵感类 -->
        <div class="capsule">
            <div class="capsule-header">
                <span class="tag t-idea">💡 灵感</span>
                <span class="time">刚刚</span>
            </div>
            <div class="capsule-body">可以做一个连接独居老人和社区志愿者的跑腿App，解决最后一公里配送问题。</div>
        </div>

        <!-- 预置胶囊：待办类 -->
        <div class="capsule">
            <div class="capsule-header">
                <span class="tag t-todo">🔴 待办</span>
                <span class="time">10分钟前</span>
            </div>
            <div class="capsule-body">明天下午三点前，把第三季度财报发给老板。</div>
            <div class="todo-card">
                <span>⏰ 明天 15:00 | 发送财报给老板</span>
                <button class="add-btn">+日历</button>
            </div>
        </div>

        <!-- 预置胶囊：情绪类 -->
        <div class="capsule">
            <div class="capsule-header">
                <span class="tag t-mood">🌟 情绪</span>
                <span class="time">昨天</span>
            </div>
            <div class="capsule-body">今天又失眠了，最近压力比较大，感觉事情总是做不完。</div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" class="text-input" id="inputText" placeholder="输入你的想法..." oninput="toggleSendBtn()">
        <button class="voice-btn" onclick="simulateVoice()">🎙️</button>
        <button class="send-btn" id="sendBtn" onclick="addCapsule()" disabled>发送</button>
    </div>
</div>

<script>
    function toggleSendBtn() {
        const input = document.getElementById('inputText');
        document.getElementById('sendBtn').disabled = input.value.trim() === '';
    }

    function simulateVoice() {
        document.getElementById('inputText').value = "周末去参加线下AI极客黑客松找几个搭子";
        toggleSendBtn();
    }

    function addCapsule() {
        const input = document.getElementById('inputText');
        const text = input.value.trim();
        if (!text) return;

        const list = document.getElementById('list');
        
        // 1. 插入加载中状态
        const loadingEl = document.createElement('div');
        loadingEl.className = 'capsule capsule-loading';
        loadingEl.innerHTML = 'AI 正在润色与分类中...';
        list.insertBefore(loadingEl, list.firstChild);
        
        input.value = '';
        toggleSendBtn();

        // 2. 模拟 AI 处理过程
        setTimeout(() => {
            loadingEl.remove();
            
            // 简单模拟 AI 分类逻辑
            let category = 'daily';
            let tagText = '🍃 日常';
            let tagClass = 't-daily';
            let extraHtml = '';

            if (text.includes('明天') || text.includes('买') || text.includes('发') || text.includes('记得')) {
                category = 'todo'; tagText = '🔴 待办'; tagClass = 't-todo';
                extraHtml = `<div class="todo-card"><span>⏰ 已提取待办事项</span><button class="add-btn">+日历</button></div>`;
            } else if (text.includes('想法') || text.includes('做一个') || text.includes('黑客松')) {
                category = 'idea'; tagText = '💡 灵感'; tagClass = 't-idea';
            } else if (text.includes('累') || text.includes('压力') || text.includes('失眠')) {
                category = 'mood'; tagText = '🌟 情绪'; tagClass = 't-mood';
            }

            const newCapsule = document.createElement('div');
            newCapsule.className = 'capsule';
            newCapsule.style.opacity = '0';
            newCapsule.style.transform = 'translateY(-10px)';
            newCapsule.innerHTML = `
                <div class="capsule-header">
                    <span class="tag ${tagClass}">${tagText}</span>
                    <span class="time">刚刚</span>
                </div>
                <div class="capsule-body">${text}</div>
                ${extraHtml}
            `;
            list.insertBefore(newCapsule, list.firstChild);
            
            // 动画淡入
            setTimeout(() => {
                newCapsule.style.transition = 'all 0.3s ease';
                newCapsule.style.opacity = '1';
                newCapsule.style.transform = 'translateY(0)';
            }, 50);
        }, 1200);
    }
</script>

</body>
</html>
