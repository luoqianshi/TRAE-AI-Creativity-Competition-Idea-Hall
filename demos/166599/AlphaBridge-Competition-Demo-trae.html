      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
    }

    .trae-signature {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 120;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 30px;
      padding: 6px 10px;
      border: 1px solid var(--line, rgba(0, 0, 0, .18));
      border-radius: 999px;
      background: rgba(255, 253, 247, .90);
      color: var(--ink, #111);
      box-shadow: 0 12px 34px rgba(20, 22, 18, .14);
      backdrop-filter: blur(14px);
      font: 800 10px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
      pointer-events: none;
    }
    .trae-signature::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--lime, var(--amber-2, var(--green, #00d66b)));
      box-shadow: 0 0 0 4px rgba(0, 214, 107, .13);
      content: "";
    }
    @media (max-width: 580px) {
      .trae-signature { right: 12px; bottom: 12px; }
    }
  </style>
</head>
<body>
  <div class="trae-signature" aria-label="trae signature">trae</div>
  <a class="skip-link" href="#demoContent">跳到演示内容</a>
  <div class="app">
    <aside class="rail" aria-label="演示步骤">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">A</div>
        <div><strong>AlphaBridge</strong><small>AI Research Workbench</small></div>
      </div>
      <nav id="stageNav" class="stage-nav" aria-label="60 到 90 秒演示主线"></nav>
      <div class="rail-note"><strong>演示说明</strong><br />本页离线运行。所有公司、分数与行情数字均为脱敏演示场景，不连接实时市场。</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="top-title">
          <strong id="topTitle">比赛交互 Demo</strong>
          <span id="topSubtitle">交易之前，先完成一份可信、可复查的研究</span>
        </div>
        <div class="top-actions">
          <span class="demo-badge"><span aria-hidden="true">●</span><span class="wide-label">脱敏演示数据 · </span>非实时</span>
          <button id="resetTop" class="ghost" type="button">重置</button>
        </div>
      </header>
      <div class="progress-line" aria-hidden="true"><span id="progressBar"></span></div>
      <section id="demoContent" class="content" tabindex="-1" aria-live="polite"></section>
    </main>
  </div>

  <nav id="mobileStage" class="mobile-stage" aria-label="移动端演示步骤"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      const stages = [
        { key: "intro", label: "定位", short: "定位", time: "0–8 秒" },
        { key: "discovery", label: "发现机会", short: "发现", time: "8–23 秒" },
        { key: "candidates", label: "候选承接", short: "候选", time: "23–36 秒" },
        { key: "research", label: "个股研究", short: "研究", time: "36–52 秒" },
        { key: "committee", label: "风险 / 投委会", short: "反证", time: "52–67 秒" },
        { key: "tracking", label: "持续跟踪", short: "跟踪", time: "67–80 秒" },
        { key: "vision", label: "未来愿景", short: "未来", time: "80–90 秒" }
      ];

      const state = {
        step: 0,
        market: "us",
        showDataDetail: false,
        selectedCandidate: "NVDA",
        researchMode: "综合",
        committeeRole: "judge",
        verifications: new Set(),
        digestGenerated: false
      };

      const marketCopy = {
        us: { name: "美股", regime: "风险偏好温和", score: "64", coverage: "86%", note: "趋势与板块扩散提供有限确认；仍需核对主题证据。" },
        hk: { name: "港股", regime: "观察中", score: "—", coverage: "62%", note: "板块数据可用；独立市场状态模型仍属于未来工作。" },
        a: { name: "A 股", regime: "观察中", score: "—", coverage: "58%", note: "行业数据可用；不借用美股模型生成完整结论。" }
      };

      const committee = {
        bull: {
          badge: "规则化多角色流程 · 多方",
          title: "增长线索值得继续研究",
          points: ["演示场景中，收入与利润趋势保持韧性。", "产业链需求与产品迭代形成相互验证。", "技术结构尚未破坏中期研究主线。"],
          evidence: "证据要求：需要官方财务、产业验证与连续价格数据共同支撑。"
        },
        bear: {
          badge: "规则化多角色流程 · 空方",
          title: "估值与兑现节奏是最大反证",
          points: ["高预期意味着任何增速放缓都会放大估值压力。", "主题拥挤可能让价格先于基本面透支。", "演示财务数据不能代替官方披露。"],
          evidence: "反证条件：下一期盈利兑现、毛利率变化与同业竞争需要优先核对。"
        },
        judge: {
          badge: "规则化多角色流程 · 裁决",
          title: "继续研究，先补证据，不给买卖结论",
          points: ["共识：产业趋势存在，但单一指标不足以形成结论。", "分歧：增长能否持续消化当前预期。", "下一步：核对官方财务与客户集中度，再更新 Living Thesis。"],
          evidence: "裁决只生成研究优先级与复查任务，不生成买入、卖出、仓位或收益承诺。"
        }
      };

      const researchModes = {
        "综合": { score: 78, text: "估值、技术、证据与反证共同决定研究优先级。" },
        "长线": { score: 81, text: "更重视盈利质量、护城河和长期假设。" },
        "短线": { score: 69, text: "只观察价格结构和事件节奏，不输出交易动作。" },
        "估值": { score: 72, text: "演示财务仅用于界面说明，真实估值必须通过数据门。" },
        "量价": { score: 74, text: "把量价变化作为研究事实，不推断主力意图。" },
        "黄金分割": { score: 65, text: "仅作结构观察工具，不作为独立结论。" }
      };

      const el = (id) => document.getElementById(id);

      function renderNav() {
        el("stageNav").innerHTML = stages.map((item, index) => `
          <button class="stage-button ${index === state.step ? "active" : ""} ${index < state.step ? "done" : ""}" type="button" data-step="${index}" ${index === state.step ? "aria-current=\"step\"" : ""}>
            <span class="stage-number">${index < state.step ? "✓" : index + 1}</span>
            <span class="stage-copy"><span>${item.label}</span><small>${item.time}</small></span>
          </button>`).join("");
        el("mobileStage").innerHTML = stages.map((item, index) => `
          <button type="button" data-step="${index}" class="${index === state.step ? "active" : ""}" ${index === state.step ? "aria-current=\"step\"" : ""}>${index < state.step ? "✓" : index + 1}<br>${item.short}</button>`).join("");
      }

      function shell(title, subtitle, body, options = {}) {
        const index = state.step;
        return `
          <article class="screen" aria-labelledby="screenTitle">
            <header class="screen-head">
              <div><p class="eyebrow">${options.eyebrow || `Step ${index + 1} · ${stages[index].label}`}</p><h2 id="screenTitle">${title}</h2><p class="lede">${subtitle}</p></div>
              <span class="screen-time">建议讲解 ${stages[index].time}</span>
            </header>
            ${body}
            <footer class="footer-actions">
              <p class="legal">所有公司、分数、价格与事件均为脱敏演示场景，不连接实时市场，不构成投资建议，也不承诺收益或胜率。</p>
              <div>
                ${index > 0 ? '<button class="secondary" type="button" data-action="prev">上一步</button>' : ''}
                ${index < stages.length - 1 ? `<button class="primary" type="button" data-action="next">${options.nextLabel || "继续演示"} →</button>` : '<button class="primary" type="button" data-action="reset">重新演示</button>'}
              </div>
            </footer>
          </article>`;
      }

      function introScreen() {
        return `
          <article class="screen hero" aria-labelledby="screenTitle">
            <div>
              <p class="eyebrow">TRAE AI 创造力大赛 · 学习工作</p>
              <h1 id="screenTitle">一个会给出证据，<br>也会<em>反驳你</em>的 AI 投研工作台</h1>
              <p class="lede">AlphaBridge 把“今天研究什么、为什么、还缺什么、下一步做什么”串成可复查的个人研究流程。它不是荐股软件，也不替用户做交易决策。</p>
              <div class="hero-actions">
                <button class="primary" type="button" data-action="next">开始 90 秒演示 →</button>
                <button class="secondary" type="button" data-action="jump" data-step="3">直接看个股研究</button>
              </div>
              <p class="fine" style="margin-top:16px">离线单文件 Demo · 无外部依赖 · 键盘可操作</p>
            </div>
            <div class="hero-card" aria-label="产品主流程">
              <p class="eyebrow" style="color:#ffd36b">Research before action</p>
              <div class="hero-flow">
                <div class="flow-row"><span class="flow-icon">1</span><div><strong>发现机会</strong><small>市场、板块、主题与资料状态</small></div></div>
                <div class="flow-row"><span class="flow-icon">2</span><div><strong>研究与反证</strong><small>估值、技术、多空与证据缺口</small></div></div>
                <div class="flow-row"><span class="flow-icon">3</span><div><strong>持续跟踪</strong><small>Living Thesis、复查任务与组合日报</small></div></div>
              </div>
            </div>
          </article>`;
      }

      function discoveryScreen() {
        const market = marketCopy[state.market];
        const body = `
          <div class="market-tabs" role="group" aria-label="选择市场演示场景">
            ${[["us","美股"],["hk","港股"],["a","A 股"]].map(([key, label]) => `<button type="button" class="chip ${state.market === key ? "active" : ""}" data-market="${key}" aria-pressed="${state.market === key}">${label}</button>`).join("")}
          </div>
          <div class="grid grid-4" style="margin-top:16px">
            <section class="card"><div class="card-head"><div><h3>${market.name}市场环境</h3><p>演示观察篮子</p></div><span class="status-badge ${state.market === "us" ? "good" : "warn"}">${state.market === "us" ? "有限可用" : "降级展示"}</span></div><div class="metric">${market.score}<small>/100</small></div><p class="fine">${market.regime}</p></section>
            <section class="card"><div class="card-head"><div><h3>资料覆盖</h3><p>来源、时点、完整度</p></div><button class="ghost" type="button" data-action="data-detail" aria-expanded="${state.showDataDetail}">查看状态</button></div><div class="metric">${market.coverage}</div><div class="bar"><span style="width:${market.coverage}"></span></div></section>
            <section class="card"><div class="card-head"><div><h3>当前结论</h3><p>研究优先级，不是涨跌预测</p></div></div><strong>${market.note}</strong></section>
            <section class="card"><div class="card-head"><div><h3>数据纪律</h3><p>缺失时不补假分</p></div></div><div class="data-gate"><div class="gate-row"><span class="dot"></span><span>行情与技术</span><b>演示可用</b></div><div class="gate-row"><span class="dot amber"></span><span>官方财务</span><b>需核对</b></div><div class="gate-row"><span class="dot amber"></span><span>主题关系</span><b>待补证</b></div></div></section>
          </div>
          ${state.showDataDetail ? '<div class="data-detail" role="status"><strong>数据状态示例：</strong>“演示可用”只说明这套脱敏场景可以继续走流程；正式产品会区分实时、缓存、样例、占位、超时和缺失，并展示来源与观察时间。</div>' : ''}
          <div class="grid grid-2" style="margin-top:16px">
            <section class="card span-2">
              <div class="card-head"><div><h3>板块变化 · 等面积排名热力格</h3><p>颜色表示演示强弱，面积不代表市值</p></div><span class="status-badge info">脱敏场景</span></div>
              <div class="heatmap">
                <div class="heat up-3"><span>半导体</span><strong>+2.8%</strong></div><div class="heat up-2"><span>软件</span><strong>+1.9%</strong></div><div class="heat up-2"><span>通信</span><strong>+1.5%</strong></div><div class="heat up-1"><span>工业</span><strong>+0.7%</strong></div><div class="heat up-1"><span>医疗</span><strong>+0.3%</strong></div><div class="heat down"><span>公用事业</span><strong>−0.8%</strong></div>
              </div>
            </section>
            <section class="card theme-card">
              <div class="card-head"><div><h3>今日研究焦点 · AI 算力链</h3><p>状态：正在增强</p></div><span class="status-badge warn">证据 2/3</span></div>
              <div class="theme-score"><div class="score-orb"><span>72</span></div><div><strong>值得优先研究</strong><p class="fine">不是上涨概率，不是买入信号</p></div></div>
              <ul class="theme-points"><li>板块扩散与候选动量形成有限确认</li><li>基本面兑现需要官方财务补证</li><li>拥挤度上升，是必须保留的反证</li></ul>
              <button class="primary" type="button" data-action="next" style="margin-top:16px">展开产业链与候选 →</button>
            </section>
            <section class="card">
              <div class="card-head"><div><h3>为什么值得研究？</h3><p>每个问题都带处理路径</p></div></div>
              <p><strong>触发变化：</strong>演示场景中的行业扩散增强。</p><p><strong>还缺什么：</strong>官方订单、财务兑现和客户集中度。</p><p><strong>下一步：</strong>进入候选，建立补证任务。</p>
            </section>
          </div>`;
        return shell("今天值得研究什么？", "先给研究问题，再把市场、板块、主题和数据缺口展开。用户看到的是研究优先级，而不是交易信号。", body, { nextLabel: "查看候选" });
      }

      function candidatesScreen() {
        const candidates = [
          { symbol:"NVDA", name:"NVIDIA", relation:"核心算力", technical:84, fundamental:76, evidence:"2/3", state:"selected" },
          { symbol:"TSM", name:"台积电", relation:"先进制造", technical:79, fundamental:82, evidence:"3/3" },
          { symbol:"MSFT", name:"Microsoft", relation:"云端需求", technical:71, fundamental:80, evidence:"2/3" }
        ];
        const list = candidates.map((c) => `
          <button type="button" class="candidate ${state.selectedCandidate === c.symbol ? "selected" : ""}" data-candidate="${c.symbol}" aria-pressed="${state.selectedCandidate === c.symbol}">
            <span class="candidate-name"><span class="ticker">${c.symbol.slice(0,3)}</span><span><strong>${c.name}</strong><small>${c.symbol} · ${c.relation}</small></span></span>
            <span class="candidate-cell"><small>技术与行情</small><span>${c.technical}</span></span>
            <span class="candidate-cell"><small>基本面</small><span>${c.fundamental}</span></span>
            <span class="candidate-cell"><small>证据覆盖</small><span>${c.evidence}</span></span>
            <span class="candidate-cell"><small>估值资格</small><span>待核对</span></span>
            <span class="candidate-chevron" aria-hidden="true">›</span>
          </button>`).join("");
        const body = `
          <div class="grid grid-2">
            <section class="card">
              <div class="card-head"><div><h3>产业链传导</h3><p>点击候选承接到个股研究</p></div><span class="status-badge info">演示映射</span></div>
              <div class="chain"><div class="chain-node"><strong>上游</strong><br><small>先进制造</small></div><div class="chain-node"><strong>核心</strong><br><small>算力芯片</small></div><div class="chain-node"><strong>下游</strong><br><small>云端应用</small></div></div>
            </section>
            <section class="card">
              <div class="card-head"><div><h3>候选资格门</h3><p>不让缺失资料变成完整结论</p></div></div>
              <div class="data-gate"><div class="gate-row"><span class="dot"></span><span>技术与行情分</span><b>可展示</b></div><div class="gate-row"><span class="dot amber"></span><span>财务估值</span><b>待官方数据</b></div><div class="gate-row"><span class="dot"></span><span>主题关系</span><b>产业验证</b></div></div>
            </section>
          </div>
          <section class="card" style="margin-top:16px">
            <div class="card-head"><div><h3>候选研究队列</h3><p>分数为脱敏演示场景；只用于说明交互</p></div><span class="status-badge warn">已选 ${state.selectedCandidate}</span></div>
            <div class="candidate-list">${list}</div>
          </section>`;
        return shell("从主题走到可复查的候选", "候选不只给一个总分，而是拆开技术、基本面、估值资格和证据覆盖；资料不足时明确暂停。", body, { nextLabel: `研究 ${state.selectedCandidate}` });
      }

      function researchScreen() {
        const mode = researchModes[state.researchMode];
        const body = `
          <div class="chips" role="group" aria-label="切换研究模式">
            ${Object.keys(researchModes).map((name) => `<button type="button" class="chip ${state.researchMode === name ? "active" : ""}" data-mode="${name}" aria-pressed="${state.researchMode === name}">${name}</button>`).join("")}
          </div>
          <div class="cockpit" style="margin-top:16px">
            <section class="thesis">
              <div class="card-head"><div><p class="eyebrow">Living Thesis · v1.3 演示</p><h3>NVIDIA · NVDA</h3></div><span class="status-badge warn">资料待补</span></div>
              <blockquote>AI 基础设施需求仍是核心研究主线，但估值与兑现节奏要求我们主动寻找反证。</blockquote>
              <p>${mode.text}</p>
              <div class="score-grid" aria-label="研究维度演示分数">
                <div class="score-cell"><strong>${mode.score}</strong><span>${state.researchMode}研究分</span></div>
                <div class="score-cell"><strong>72</strong><span>估值解释力</span></div>
                <div class="score-cell"><strong>84</strong><span>技术位置</span></div>
                <div class="score-cell"><strong>74</strong><span>量价结构</span></div>
                <div class="score-cell"><strong>68</strong><span>数据门 / 反证</span></div>
              </div>
              <p class="fine" style="margin-top:13px">以上均为脱敏演示分数，不是实时数据、目标价或上涨概率。</p>
            </section>
            <aside class="grid">
              <section class="card"><div class="card-head"><div><h3>数据门</h3><p>关键数字由计算流程处理</p></div></div><div class="data-gate"><div class="gate-row"><span class="dot"></span><span>价格历史</span><b>演示齐全</b></div><div class="gate-row"><span class="dot amber"></span><span>官方财务</span><b>需核对</b></div><div class="gate-row"><span class="dot"></span><span>反面证据</span><b>已建任务</b></div></div></section>
              <section class="card"><div class="card-head"><div><h3>下一步</h3><p>研究动作，不是交易动作</p></div></div><strong>核对订单兑现、毛利率趋势和客户集中度。</strong></section>
            </aside>
          </div>
          <div class="grid grid-3" style="margin-top:16px">
            <section class="card"><span class="micro-badge good">支撑证据</span><h3 style="margin-top:10px">产业需求仍有韧性</h3><p class="fine">需要官方数据与产业验证共同确认。</p></section>
            <section class="card"><span class="micro-badge risk">最大反证</span><h3 style="margin-top:10px">增长不及高预期</h3><p class="fine">若兑现放缓，当前研究主线将被削弱。</p></section>
            <section class="card"><span class="micro-badge info">研究记忆</span><h3 style="margin-top:10px">结论可版本化</h3><p class="fine">保留当时的证据、假设和复查条件。</p></section>
          </div>`;
        return shell("把一次报告变成研究驾驶舱", "同一标的可以切换研究视角，但分数口径、数据门、支撑证据与最大反证始终可追溯。", body, { nextLabel: "打开投委会" });
      }

      function committeeScreen() {
        const role = committee[state.committeeRole];
        const body = `
          <div class="grid grid-2" style="margin-bottom:16px">
            <section class="card"><div class="card-head"><div><h3>最大风险</h3><p>先讲可能错在哪里</p></div><span class="status-badge risk">高优先级</span></div><strong>盈利兑现速度低于市场预期。</strong><p class="fine">影响：估值解释力下降，Living Thesis 进入“需复查”。</p></section>
            <section class="card"><div class="card-head"><div><h3>待补证据</h3><p>不完整就不装作完整</p></div><span class="status-badge warn">2 项</span></div><strong>官方财务口径 · 客户集中度变化</strong><p class="fine">恢复条件：来源、时点和字段完整度通过数据门。</p></section>
          </div>
          <section class="committee" aria-label="多角色研究流程">
            <div class="role-tabs" role="tablist" aria-label="选择研究角色">
              <button class="role-button ${state.committeeRole === "bull" ? "active" : ""}" type="button" role="tab" aria-selected="${state.committeeRole === "bull"}" data-role="bull"><strong>多方研究员</strong><small>整理支撑证据</small></button>
              <button class="role-button ${state.committeeRole === "bear" ? "active" : ""}" type="button" role="tab" aria-selected="${state.committeeRole === "bear"}" data-role="bear"><strong>空方研究员</strong><small>主动寻找反证</small></button>
              <button class="role-button ${state.committeeRole === "judge" ? "active" : ""}" type="button" role="tab" aria-selected="${state.committeeRole === "judge"}" data-role="judge"><strong>裁决流程</strong><small>形成下一步任务</small></button>
            </div>
            <div class="role-output" role="tabpanel">
              <span class="status-badge">${role.badge}</span>
              <h3>${role.title}</h3>
              <ul>${role.points.map((point) => `<li>${point}</li>`).join("")}</ul>
              <p class="evidence-line">${role.evidence}</p>
            </div>
          </section>
          <div class="data-detail"><strong>能力边界：</strong>这里演示的是规则化的多角色研究与反证流程，不是多个自治大模型在后台自行交易或实时协作。正式 AI 追问需单独配置模型服务。</div>`;
        return shell("不只给结论，还要组织反方", "多方、空方与裁决把证据、反证和待验证问题放在同一张研究桌上；裁决只生成研究动作。", body, { nextLabel: "加入持续跟踪" });
      }

      function trackingScreen() {
        const checks = [
          { id:"margin", level:"需关注", cls:"risk", title:"毛利率假设需要复查", text:"关联研究主线：增长质量能否持续。" },
          { id:"technical", level:"留意", cls:"warn", title:"技术结构接近观察区间", text:"只触发复查，不生成卖出建议。" },
          { id:"evidence", level:"留意", cls:"warn", title:"官方证据仍有缺口", text:"补齐来源后重新计算估值资格。" }
        ];
        const list = checks.map((item) => `
          <div class="review-item"><span class="status-badge ${item.cls}">${item.level}</span><div><strong>${item.title}</strong><p>${item.text}</p></div><button class="check-button ${state.verifications.has(item.id) ? "done" : ""}" type="button" data-verify="${item.id}">${state.verifications.has(item.id) ? "✓ 已记录" : "让系统求证"}</button></div>`).join("");
        const body = `
          <div class="grid grid-3">
            <section class="card"><div class="card-head"><div><h3>当前跟踪</h3><p>脱敏演示组合</p></div></div><div class="metric">3<small> 个对象</small></div></section>
            <section class="card"><div class="card-head"><div><h3>今日需关注</h3><p>研究任务分级</p></div></div><div class="metric" style="color:var(--red)">1<small> 项</small></div></section>
            <section class="card"><div class="card-head"><div><h3>主线健康度</h3><p>不是收益评分</p></div></div><div class="metric">68<small>/100</small></div></section>
          </div>
          <div class="grid grid-2" style="margin-top:16px">
            <section class="card"><div class="card-head"><div><h3>今日 review</h3><p>发生了什么 · 关联什么假设 · 下一步做什么</p></div><span class="status-badge info">收盘后演示</span></div><div class="review-list">${list}</div></section>
            <section class="card">
              <div class="card-head"><div><h3>组合日报</h3><p>把复查动作沉淀成研究记忆</p></div><span class="status-badge ${state.digestGenerated ? "good" : "warn"}">${state.digestGenerated ? "已生成" : "待生成"}</span></div>
              ${state.digestGenerated ? `
                <div class="data-detail" role="status"><strong>日报摘要：</strong><br>NVDA：需核对毛利率与官方财务。<br>TSM：研究主线稳定，继续跟踪产能兑现。<br>MSFT：等待云业务增速的下一次验证。</div>
                <p class="fine" style="margin-top:12px">日报仅陈述事实与研究动作；此处为离线脱敏演示内容。</p>` : `
                <p>生成后会汇总：持仓/自选对象、热点事件、研究主线健康度、待验证证据和明日关注。</p>
                <button class="primary" type="button" data-action="digest">生成脱敏组合日报</button>`}
            </section>
          </div>`;
        return shell("研究不是一次性报告", "把候选加入持续跟踪后，价格结构、反面证据和用户规则只触发“再研究一次”，并沉淀为组合日报。", body, { nextLabel: "查看未来愿景" });
      }

      function visionScreen() {
        const body = `
          <div class="paper" aria-label="AlphaBridge 脱敏演示组合日报">
            <header class="paper-head"><p class="eyebrow">Demo Digest · Offline</p><h2>组合研究日报</h2><p class="lede">从“发现一个线索”到“持续维护一套判断”，AlphaBridge 让个人投资者拥有可复查的研究纪律。</p></header>
            <section class="paper-section"><div class="paper-row"><div><strong>今日结论</strong><p>1 项主线需复查，2 项继续观察；所有结果均为脱敏演示场景。</p></div><span class="status-badge warn">研究动作 3</span></div></section>
            <section class="paper-section"><div class="paper-row"><div><strong>最大反证</strong><p>增长兑现节奏可能低于高预期；需先核对官方财务与产业证据。</p></div><span class="status-badge risk">优先补证</span></div></section>
            <section class="paper-section"><div class="paper-row"><div><strong>明日关注</strong><p>更新 Living Thesis，而不是追逐新的单向结论。</p></div><span class="status-badge good">可持续</span></div></section>
          </div>
          <header class="screen-head" style="margin-top:34px"><div><p class="eyebrow">Future · 明确属于下一阶段</p><h2>今天服务个人研究，未来让证据链更深</h2><p class="lede">下面均为未来方向，不是当前 Demo 已完成能力。</p></div></header>
          <div class="grid grid-3">
            <section class="card future-card"><span class="future-label">未来能力</span><h3>真实事件自动发现</h3><p>接入官方事件与 SEC/XBRL 等证据，追踪触发变化、产业传导、反证和失效条件。</p></section>
            <section class="card future-card"><span class="future-label">未来能力</span><h3>三市场独立模型与验证</h3><p>完善 A 股、港股独立市场模型，并建立 point-in-time 快照、样本外验证和版本化校准。</p></section>
            <section class="card future-card"><span class="future-label">未来能力</span><h3>更长期的个人研究记忆</h3><p>持续识别哪些假设增强、削弱或失效，让系统更懂用户的研究纪律，而不是替用户做决定。</p></section>
          </div>`;
        return shell("让每一次判断都有来路，也有复查节点", "AlphaBridge 的价值不是给出更响亮的答案，而是把证据、反证、数据缺口和后续行动组织成长期可维护的研究流程。", body, { eyebrow: "完成 · 约 90 秒" });
      }

      const screens = [introScreen, discoveryScreen, candidatesScreen, researchScreen, committeeScreen, trackingScreen, visionScreen];

      function render(options = {}) {
        renderNav();
        el("progressBar").style.width = `${(state.step / (stages.length - 1)) * 100}%`;
        el("topTitle").textContent = state.step === 0 ? "比赛交互 Demo" : stages[state.step].label;
        el("topSubtitle").textContent = stages[state.step].time + " · 脱敏演示场景";
        el("demoContent").innerHTML = screens[state.step]();
        if (options.focus !== false) {
          el("demoContent").focus({ preventScroll: true });
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      }

      function goTo(step) {
        const next = Math.max(0, Math.min(stages.length - 1, Number(step)));
        state.step = next;
        render();
      }

      function reset() {
        state.step = 0;
        state.market = "us";
        state.showDataDetail = false;
        state.selectedCandidate = "NVDA";
        state.researchMode = "综合";
        state.committeeRole = "judge";
        state.verifications.clear();
        state.digestGenerated = false;
        render();
        notify("演示已重置");
      }

      let toastTimer;
      function notify(message) {
        const toast = el("toast");
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
      }

      function handleClick(event) {
        const target = event.target.closest("button");
        if (!target) return;
        if (target.dataset.step !== undefined) return goTo(target.dataset.step);
        if (target.dataset.market) { state.market = target.dataset.market; state.showDataDetail = false; render({ focus:false }); return; }
        if (target.dataset.candidate) { state.selectedCandidate = target.dataset.candidate; render({ focus:false }); notify(`已选择 ${state.selectedCandidate}`); return; }
        if (target.dataset.mode) { state.researchMode = target.dataset.mode; render({ focus:false }); notify(`已切换到${state.researchMode}模式`); return; }
        if (target.dataset.role) { state.committeeRole = target.dataset.role; render({ focus:false }); return; }
        if (target.dataset.verify) { state.verifications.add(target.dataset.verify); render({ focus:false }); notify("已记录一项复查结果"); return; }

        const action = target.dataset.action;
        if (action === "next") goTo(state.step + 1);
        if (action === "prev") goTo(state.step - 1);
        if (action === "jump") goTo(target.dataset.step || 0);
        if (action === "reset") reset();
        if (action === "data-detail") { state.showDataDetail = !state.showDataDetail; render({ focus:false }); }
        if (action === "digest") { state.digestGenerated = true; render({ focus:false }); notify("脱敏组合日报已生成"); }
      }

      document.addEventListener("click", handleClick);
      el("resetTop").addEventListener("click", reset);
      document.addEventListener("keydown", (event) => {
        if (event.altKey && event.key === "ArrowRight") { event.preventDefault(); goTo(state.step + 1); }
        if (event.altKey && event.key === "ArrowLeft") { event.preventDefault(); goTo(state.step - 1); }
        if (event.key.toLowerCase() === "r" && event.altKey) { event.preventDefault(); reset(); }
      });

      render({ focus:false });
    })();
  </script>
</body>
</html>
