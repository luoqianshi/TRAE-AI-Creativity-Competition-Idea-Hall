<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>习惯养成宝 - 让好习惯陪你遇见更好的自己</title>
  <style>
    :root {
      --primary-50: #f8fafc;
      --primary-100: #f1f5f9;
      --primary-200: #e2e8f0;
      --primary-300: #cbd5e1;
      --primary-400: #94a3b8;
      --primary-500: #64748b;
      --primary-600: #475569;
      --primary-700: #334155;
      --primary-800: #1e293b;
      --primary-900: #0f172a;
      
      --accent-50: #f5f3ff;
      --accent-100: #ede9fe;
      --accent-200: #ddd6fe;
      --accent-300: #c4b5fd;
      --accent-400: #a78bfa;
      --accent-500: #8b5cf6;
      --accent-600: #7c3aed;
      --accent-700: #6d28d9;
      --accent-800: #5b21b6;
      --accent-900: #4c1d95;
      
      --success-500: #22c55e;
      --warning-500: #f59e0b;
      --error-500: #ef4444;
      
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.08), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.05);
      
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: var(--font-sans);
      background: linear-gradient(135deg, var(--primary-50) 0%, var(--primary-100) 100%);
      color: var(--primary-800);
      min-height: 100vh;
    }
    
    .container { max-width: 900px; margin: 0 auto; padding: 24px; }
    
    header {
      background: white;
      border-radius: var(--radius-xl);
      padding: 28px 32px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-md);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    
    .logo-area { display: flex; align-items: center; gap: 12px; }
    
    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent-500) 0%, var(--accent-600) 100%);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
    }
    
    .logo-text h1 { font-size: 1.3rem; color: var(--primary-800); }
    .logo-text p { font-size: 0.8rem; color: var(--primary-500); }
    
    .user-stats {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    
    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 16px;
      background: var(--primary-50);
      border-radius: var(--radius-md);
      min-width: 80px;
    }
    
    .stat-label { font-size: 0.75rem; color: var(--primary-500); margin-bottom: 2px; }
    .stat-value { font-size: 1.1rem; font-weight: 600; color: var(--primary-800); }
    .stat-value.points { color: var(--accent-500); }
    .stat-value.level { color: var(--warning-500); }
    
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      background: white;
      padding: 6px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }
    
    .tab-btn {
      flex: 1;
      padding: 12px 24px;
      border: none;
      background: transparent;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--primary-500);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent-500) 0%, var(--accent-600) 100%);
      color: white;
      box-shadow: var(--shadow-md);
    }
    
    .tab-btn:hover:not(.active) { background: var(--primary-50); }
    
    .content-area { min-height: 400px; }
    
    .goals-section { }
    
    .goals-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .section-title { font-size: 1.1rem; font-weight: 600; color: var(--primary-700); }
    .add-btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, var(--accent-500) 0%, var(--accent-600) 100%);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .add-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
    
    .goals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    
    .goal-card {
      background: white;
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border-left: 4px solid var(--accent-500);
    }
    
    .goal-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    
    .goal-card.completed { border-left-color: var(--success-500); }
    
    .goal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    
    .goal-icon {
      width: 36px;
      height: 36px;
      background: var(--accent-100);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }
    
    .goal-card.completed .goal-icon { background: #dcfce7; }
    
    .goal-title { font-size: 0.95rem; font-weight: 600; color: var(--primary-800); }
    .goal-info { font-size: 0.8rem; color: var(--primary-500); margin-top: 4px; }
    
    .delete-btn {
      width: 24px;
      height: 24px;
      border: none;
      background: var(--primary-100);
      border-radius: var(--radius-sm);
      color: var(--primary-400);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    
    .goal-card:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { background: var(--error-500); color: white; }
    
    .progress-area { margin-bottom: 16px; }
    
    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--primary-500);
      margin-bottom: 6px;
    }
    
    .progress-bar {
      height: 8px;
      background: var(--primary-100);
      border-radius: 4px;
      overflow: hidden;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-400) 0%, var(--accent-500) 100%);
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    
    .goal-card.completed .progress-fill {
      background: linear-gradient(90deg, var(--success-500) 0%, #16a34a 100%);
    }
    
    .streak-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: #fef3c7;
      color: #92400e;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 500;
      margin-bottom: 12px;
    }
    
    .action-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .action-btn.checkin {
      background: linear-gradient(135deg, var(--accent-500) 0%, var(--accent-600) 100%);
      color: white;
    }
    
    .action-btn.checkin:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
    
    .action-btn.completed {
      background: var(--success-500);
      color: white;
      cursor: default;
    }
    
    .reward-preview {
      font-size: 0.75rem;
      color: var(--primary-400);
      margin-top: 8px;
      text-align: center;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }
    
    .empty-icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.5; }
    .empty-title { font-size: 1rem; font-weight: 600; color: var(--primary-700); margin-bottom: 8px; }
    .empty-desc { font-size: 0.85rem; color: var(--primary-500); }
    
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    
    .modal-overlay.active { opacity: 1; visibility: visible; }
    
    .modal {
      background: white;
      border-radius: var(--radius-xl);
      padding: 32px;
      width: 90%;
      max-width: 480px;
      transform: translateY(20px);
      transition: transform 0.3s ease;
    }
    
    .modal-overlay.active .modal { transform: translateY(0); }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    
    .modal-title { font-size: 1.2rem; font-weight: 600; color: var(--primary-800); }
    
    .modal-close {
      width: 32px;
      height: 32px;
      border: none;
      background: var(--primary-100);
      border-radius: var(--radius-sm);
      color: var(--primary-500);
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .modal-close:hover { background: var(--primary-200); }
    
    .form-group { margin-bottom: 16px; }
    
    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--primary-700);
      margin-bottom: 6px;
    }
    
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--primary-200);
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      color: var(--primary-800);
      background: var(--primary-50);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--accent-400);
      box-shadow: 0 0 0 3px var(--accent-100);
    }
    
    .form-textarea { min-height: 80px; resize: vertical; }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    
    .form-hint { font-size: 0.75rem; color: var(--primary-400); margin-top: 4px; }
    
    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    
    .modal-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .modal-btn.primary {
      background: linear-gradient(135deg, var(--accent-500) 0%, var(--accent-600) 100%);
      color: white;
    }
    
    .modal-btn.primary:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
    
    .modal-btn.secondary {
      background: var(--primary-100);
      color: var(--primary-600);
    }
    
    .modal-btn.secondary:hover { background: var(--primary-200); }
    
    .rewards-section { }
    
    .rewards-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .rewards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }
    
    .reward-card {
      background: white;
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }
    
    .reward-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    
    .reward-card.locked { opacity: 0.6; }
    
    .lock-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }
    
    .reward-icon {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin: 0 auto 12px;
    }
    
    .reward-title { font-size: 0.95rem; font-weight: 600; color: var(--primary-800); margin-bottom: 4px; }
    .reward-cost {
      font-size: 0.85rem;
      color: var(--warning-500);
      font-weight: 500;
      margin-bottom: 12px;
    }
    
    .claim-btn {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .claim-btn.available {
      background: linear-gradient(135deg, var(--accent-500) 0%, var(--accent-600) 100%);
      color: white;
    }
    
    .claim-btn.available:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
    
    .claim-btn.disabled {
      background: var(--primary-100);
      color: var(--primary-400);
      cursor: not-allowed;
    }
    
    .celebration-modal { text-align: center; }
    
    .celebration-icon {
      font-size: 4rem;
      margin-bottom: 16px;
      animation: bounce 0.6s ease;
    }
    
    .celebration-title {
      font-size: 1.4rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-500) 0%, var(--accent-600) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    
    .celebration-desc { font-size: 0.95rem; color: var(--primary-600); margin-bottom: 20px; }
    
    .celebration-points {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: var(--accent-50);
      border-radius: var(--radius-lg);
      margin-bottom: 24px;
    }
    
    .celebration-points .points-icon { font-size: 1.5rem; }
    .celebration-points .points-text { font-size: 0.9rem; color: var(--primary-600); }
    .celebration-points .points-value { font-size: 1.4rem; font-weight: 700; color: var(--accent-600); }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    .checkin-modal .progress-display {
      text-align: center;
      padding: 20px;
      background: var(--primary-50);
      border-radius: var(--radius-lg);
      margin-bottom: 20px;
    }
    
    .checkin-modal .progress-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: conic-gradient(var(--accent-500) var(--progress), var(--primary-200) 0);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      position: relative;
    }
    
    .checkin-modal .progress-circle::before {
      content: '';
      position: absolute;
      width: 64px;
      height: 64px;
      background: white;
      border-radius: 50%;
    }
    
    .checkin-modal .progress-percent {
      position: relative;
      z-index: 1;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary-800);
    }
    
    .checkin-modal .progress-text { font-size: 0.85rem; color: var(--primary-500); }
    
    .stats-section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    
    .stat-card {
      background: white;
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      text-align: center;
    }
    
    .stat-card .stat-icon { font-size: 2rem; margin-bottom: 8px; }
    .stat-card .stat-num { font-size: 1.5rem; font-weight: 700; color: var(--primary-800); margin-bottom: 4px; }
    .stat-card .stat-name { font-size: 0.85rem; color: var(--primary-500); }
    
    @media (max-width: 640px) {
      header { flex-direction: column; text-align: center; }
      .user-stats { width: 100%; justify-content: space-around; }
      .form-row { grid-template-columns: 1fr; }
      .goals-grid { grid-template-columns: 1fr; }
      .rewards-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-area">
        <div class="logo-icon">✦</div>
        <div class="logo-text">
          <h1>习惯养成宝</h1>
          <p>让好习惯陪你遇见更好的自己</p>
        </div>
      </div>
      <div class="user-stats">
        <div class="stat-item">
          <span class="stat-label">积分</span>
          <span class="stat-value points" id="userPoints">120</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">等级</span>
          <span class="stat-value level" id="userLevel">LV.3</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">经验</span>
          <span class="stat-value" id="userExp">65%</span>
        </div>
      </div>
    </header>
    
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('goals')">🎯 我的目标</button>
      <button class="tab-btn" onclick="switchTab('rewards')">🎁 奖励商城</button>
      <button class="tab-btn" onclick="switchTab('stats')">📊 数据统计</button>
    </div>
    
    <div class="content-area">
      <div id="goalsTab" class="goals-section">
        <div class="goals-header">
          <span class="section-title">今日目标</span>
          <button class="add-btn" onclick="openCreateModal()">+ 新目标</button>
        </div>
        <div class="goals-grid" id="goalsGrid">
        </div>
      </div>
      
      <div id="rewardsTab" class="rewards-section" style="display: none;">
        <div class="rewards-header">
          <span class="section-title">奖励商城</span>
          <span style="font-size: 0.9rem; color: var(--accent-600); font-weight: 500;">当前积分: <span id="rewardPoints">120</span></span>
        </div>
        <div class="rewards-grid" id="rewardsGrid">
        </div>
      </div>
      
      <div id="statsTab" class="stats-section" style="display: none;">
        <div class="stat-card">
          <div class="stat-icon">🔥</div>
          <div class="stat-num" id="totalStreak">15</div>
          <div class="stat-name">最长连续打卡</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">✅</div>
          <div class="stat-num" id="completedGoals">8</div>
          <div class="stat-name">已完成目标</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🎯</div>
          <div class="stat-num" id="totalGoals">12</div>
          <div class="stat-name">总目标数</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🎁</div>
          <div class="stat-num" id="claimedRewards">3</div>
          <div class="stat-name">已兑换奖励</div>
        </div>
      </div>
    </div>
  </div>
  
  <div class="modal-overlay" id="createModal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">创建新目标</span>
        <button class="modal-close" onclick="closeModal('createModal')">✕</button>
      </div>
      <form id="createForm" onsubmit="handleCreateGoal(event)">
        <div class="form-group">
          <label class="form-label">目标名称</label>
          <input type="text" class="form-input" id="goalName" placeholder="例如：每天阅读30页" required>
        </div>
        <div class="form-group">
          <label class="form-label">目标类型</label>
          <select class="form-select" id="goalType" onchange="updateUnitOptions()">
            <option value="count">次数型（如：阅读页数）</option>
            <option value="duration">时长型（如：运动分钟）</option>
            <option value="value">数值型（如：体重目标）</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">目标值</label>
            <input type="number" class="form-input" id="goalTarget" placeholder="30" required min="1">
          </div>
          <div class="form-group">
            <label class="form-label">单位</label>
            <select class="form-select" id="goalUnit">
              <option value="页">页</option>
              <option value="次">次</option>
              <option value="个">个</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">周期</label>
          <select class="form-select" id="goalPeriod">
            <option value="daily">每天</option>
            <option value="weekly">每周</option>
            <option value="monthly">每月</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">奖励内容</label>
          <input type="text" class="form-input" id="goalReward" placeholder="例如：吃一顿大餐" required>
        </div>
        <div class="form-group">
          <label class="form-label">奖励积分</label>
          <input type="number" class="form-input" id="goalRewardPoints" placeholder="10" required min="1">
        </div>
        <div class="form-group">
          <label class="form-label">图标</label>
          <div style="display: flex; gap: 8px;">
            <button type="button" class="icon-option" onclick="selectIcon('📚')" style="width: 40px; height: 40px; border: 2px solid var(--accent-400); border-radius: var(--radius-md); font-size: 1.2rem; background: var(--accent-50); cursor: pointer;" data-icon="📚">📚</button>
            <button type="button" class="icon-option" onclick="selectIcon('🏃')" style="width: 40px; height: 40px; border: 1px solid var(--primary-200); border-radius: var(--radius-md); font-size: 1.2rem; background: white; cursor: pointer;" data-icon="🏃">🏃</button>
            <button type="button" class="icon-option" onclick="selectIcon('💧')" style="width: 40px; height: 40px; border: 1px solid var(--primary-200); border-radius: var(--radius-md); font-size: 1.2rem; background: white; cursor: pointer;" data-icon="💧">💧</button>
            <button type="button" class="icon-option" onclick="selectIcon('🌅')" style="width: 40px; height: 40px; border: 1px solid var(--primary-200); border-radius: var(--radius-md); font-size: 1.2rem; background: white; cursor: pointer;" data-icon="🌅">🌅</button>
            <button type="button" class="icon-option" onclick="selectIcon('💪')" style="width: 40px; height: 40px; border: 1px solid var(--primary-200); border-radius: var(--radius-md); font-size: 1.2rem; background: white; cursor: pointer;" data-icon="💪">💪</button>
            <button type="button" class="icon-option" onclick="selectIcon('🎯')" style="width: 40px; height: 40px; border: 1px solid var(--primary-200); border-radius: var(--radius-md); font-size: 1.2rem; background: white; cursor: pointer;" data-icon="🎯">🎯</button>
          </div>
          <input type="hidden" id="goalIcon" value="📚">
        </div>
        <div class="modal-actions">
          <button type="button" class="modal-btn secondary" onclick="closeModal('createModal')">取消</button>
          <button type="submit" class="modal-btn primary">创建目标</button>
        </div>
      </form>
    </div>
  </div>
  
  <div class="modal-overlay" id="checkinModal">
    <div class="modal checkin-modal">
      <div class="modal-header">
        <span class="modal-title">今日打卡</span>
        <button class="modal-close" onclick="closeModal('checkinModal')">✕</button>
      </div>
      <div class="progress-display">
        <div class="progress-circle" style="--progress: 60%">
          <span class="progress-percent" id="checkinPercent">60%</span>
        </div>
        <div class="progress-text" id="checkinProgressText">已完成 6/10 页</div>
      </div>
      <form id="checkinForm" onsubmit="handleCheckIn(event)">
        <div class="form-group">
          <label class="form-label">今日完成量</label>
          <input type="number" class="form-input" id="checkinValue" placeholder="输入今日完成数量" required min="1">
          <span class="form-hint" id="checkinUnit">单位：页</span>
        </div>
        <div class="form-group">
          <label class="form-label">备注（可选）</label>
          <textarea class="form-textarea" id="checkinNote" placeholder="记录今天的心情或感受..."></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="modal-btn secondary" onclick="closeModal('checkinModal')">取消</button>
          <button type="submit" class="modal-btn primary">确认打卡</button>
        </div>
      </form>
    </div>
  </div>
  
  <div class="modal-overlay" id="celebrationModal">
    <div class="modal celebration-modal">
      <div class="celebration-icon">🎉</div>
      <div class="celebration-title">恭喜达成目标！</div>
      <div class="celebration-desc" id="celebrationGoalName">你完成了「每天阅读30页」目标</div>
      <div class="celebration-points">
        <span class="points-icon">⭐</span>
        <div>
          <div class="points-text">获得奖励积分</div>
          <div class="points-value" id="celebrationPoints">+10</div>
        </div>
      </div>
      <div style="font-size: 0.85rem; color: var(--primary-500); margin-bottom: 24px;" id="celebrationReward">奖励：吃一顿大餐</div>
      <button class="modal-btn primary" onclick="closeModal('celebrationModal')">太棒了！</button>
    </div>
  </div>
  
  <div class="modal-overlay" id="claimModal">
    <div class="modal" style="text-align: center;">
      <div class="modal-header" style="justify-content: center;">
        <span class="modal-title">确认兑换</span>
      </div>
      <div style="font-size: 1.5rem; margin: 20px 0;" id="claimIcon">🎁</div>
      <div style="font-size: 1.1rem; font-weight: 600; color: var(--primary-800); margin-bottom: 8px;" id="claimName">吃大餐</div>
      <div style="font-size: 0.9rem; color: var(--warning-500); margin-bottom: 20px;">需要消耗 <span id="claimCost">50</span> 积分</div>
      <div style="font-size: 0.85rem; color: var(--primary-500); margin-bottom: 24px;">当前积分：<span id="claimCurrentPoints">120</span></div>
      <div class="modal-actions">
        <button class="modal-btn secondary" onclick="closeModal('claimModal')">取消</button>
        <button class="modal-btn primary" onclick="confirmClaim()">确认兑换</button>
      </div>
    </div>
  </div>
  
  <script>
    let goals = [
      { id: '1', name: '每天阅读', type: 'count', target: 30, current: 18, unit: '页', period: 'daily', reward: '吃一顿大餐', rewardPoints: 10, icon: '📚', streak: 5, completed: false, lastCheckIn: null },
      { id: '2', name: '运动健身', type: 'duration', target: 60, current: 60, unit: '分钟', period: 'daily', reward: '买新衣服', rewardPoints: 15, icon: '🏃', streak: 8, completed: true, lastCheckIn: '2026-06-30' },
      { id: '3', name: '早起打卡', type: 'count', target: 1, current: 0, unit: '次', period: 'daily', reward: '喝奶茶', rewardPoints: 5, icon: '🌅', streak: 3, completed: false, lastCheckIn: null },
      { id: '4', name: '每日喝水', type: 'count', target: 8, current: 5, unit: '杯', period: 'daily', reward: '看电影', rewardPoints: 8, icon: '💧', streak: 12, completed: false, lastCheckIn: null },
    ];
    
    let rewards = [
      { id: '1', name: '吃大餐', cost: 50, icon: '🍔', unlocked: true },
      { id: '2', name: '买新衣服', cost: 100, icon: '👕', unlocked: true },
      { id: '3', name: '看电影', cost: 30, icon: '🎬', unlocked: true },
      { id: '4', name: '喝奶茶', cost: 15, icon: '🧋', unlocked: true },
      { id: '5', name: '买书籍', cost: 40, icon: '📖', unlocked: true },
      { id: '6', name: '游戏充值', cost: 80, icon: '🎮', unlocked: false },
      { id: '7', name: '旅行基金', cost: 500, icon: '✈️', unlocked: false },
      { id: '8', name: '数码产品', cost: 1000, icon: '📱', unlocked: false },
    ];
    
    let user = { points: 120, level: 3, exp: 65, streak: 15, completedGoals: 8, totalGoals: 12, claimedRewards: 3 };
    let currentGoalId = null;
    let currentRewardId = null;
    let selectedIcon = '📚';
    
    function init() {
      renderGoals();
      renderRewards();
      updateUserStats();
    }
    
    function updateUserStats() {
      document.getElementById('userPoints').textContent = user.points;
      document.getElementById('userLevel').textContent = `LV.${user.level}`;
      document.getElementById('userExp').textContent = `${user.exp}%`;
      document.getElementById('rewardPoints').textContent = user.points;
      document.getElementById('totalStreak').textContent = user.streak;
      document.getElementById('completedGoals').textContent = user.completedGoals;
      document.getElementById('totalGoals').textContent = user.totalGoals;
      document.getElementById('claimedRewards').textContent = user.claimedRewards;
    }
    
    function renderGoals() {
      const grid = document.getElementById('goalsGrid');
      if (goals.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📝</div>
            <div class="empty-title">还没有目标</div>
            <div class="empty-desc">点击上方「新目标」按钮，创建你的第一个习惯目标吧！</div>
          </div>
        `;
        return;
      }
      
      grid.innerHTML = goals.map(goal => {
        const progress = Math.min(100, Math.round((goal.current / goal.target) * 100));
        const isCompleted = progress >= 100;
        const today = new Date().toISOString().split('T')[0];
        const hasCheckedIn = goal.lastCheckIn === today;
        
        return `
          <div class="goal-card ${isCompleted ? 'completed' : ''}">
            <div class="goal-header">
              <div>
                <div class="goal-icon">${goal.icon}</div>
                <div class="goal-title">${goal.name}</div>
                <div class="goal-info">${goal.period === 'daily' ? '每天' : goal.period === 'weekly' ? '每周' : '每月'} · ${goal.target}${goal.unit}</div>
              </div>
              <button class="delete-btn" onclick="deleteGoal('${goal.id}')">✕</button>
            </div>
            ${goal.streak > 0 ? `<div class="streak-badge">🔥 ${goal.streak}天</div>` : ''}
            <div class="progress-area">
              <div class="progress-info">
                <span>进度</span>
                <span>${goal.current}/${goal.target}${goal.unit}</span>
              </div>
              <div class="progress-bar">
                <div class="progress-fill" style="width: ${progress}%"></div>
              </div>
            </div>
            ${isCompleted || hasCheckedIn ? 
              `<button class="action-btn completed">✓ 今日已完成</button>` : 
              `<button class="action-btn checkin" onclick="openCheckinModal('${goal.id}')">打卡 +${goal.rewardPoints}积分</button>`
            }
            <div class="reward-preview">达成奖励：${goal.reward}</div>
          </div>
        `;
      }).join('');
    }
    
    function renderRewards() {
      const grid = document.getElementById('rewardsGrid');
      grid.innerHTML = rewards.map(reward => {
        const canAfford = user.points >= reward.cost;
        return `
          <div class="reward-card ${!reward.unlocked ? 'locked' : ''}">
            ${!reward.unlocked ? '<div class="lock-overlay">🔒</div>' : ''}
            <div class="reward-icon">${reward.icon}</div>
            <div class="reward-title">${reward.name}</div>
            <div class="reward-cost">${reward.cost} 积分</div>
            <button class="claim-btn ${reward.unlocked && canAfford ? 'available' : 'disabled'}" onclick="${reward.unlocked && canAfford ? `openClaimModal('${reward.id}')` : ''}">
              ${!reward.unlocked ? '未解锁' : canAfford ? '立即兑换' : '积分不足'}
            </button>
          </div>
        `;
      }).join('');
    }
    
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      
      document.getElementById('goalsTab').style.display = tabName === 'goals' ? 'block' : 'none';
      document.getElementById('rewardsTab').style.display = tabName === 'rewards' ? 'block' : 'none';
      document.getElementById('statsTab').style.display = tabName === 'stats' ? 'grid' : 'none';
    }
    
    function openCreateModal() {
      document.getElementById('createModal').classList.add('active');
      document.getElementById('createForm').reset();
      selectIcon('📚');
    }
    
    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }
    
    function updateUnitOptions() {
      const type = document.getElementById('goalType').value;
      const select = document.getElementById('goalUnit');
      if (type === 'count') {
        select.innerHTML = '<option value="页">页</option><option value="次">次</option><option value="个">个</option><option value="杯">杯</option>';
      } else if (type === 'duration') {
        select.innerHTML = '<option value="分钟">分钟</option><option value="小时">小时</option><option value="秒">秒</option>';
      } else {
        select.innerHTML = '<option value="kg">kg</option><option value="cm">cm</option><option value="元">元</option>';
      }
    }
    
    function selectIcon(icon) {
      selectedIcon = icon;
      document.getElementById('goalIcon').value = icon;
      document.querySelectorAll('.icon-option').forEach(opt => {
        opt.style.borderColor = opt.dataset.icon === icon ? 'var(--accent-400)' : 'var(--primary-200)';
        opt.style.background = opt.dataset.icon === icon ? 'var(--accent-50)' : 'white';
      });
    }
    
    function handleCreateGoal(e) {
      e.preventDefault();
      const newGoal = {
        id: Date.now().toString(),
        name: document.getElementById('goalName').value,
        type: document.getElementById('goalType').value,
        target: parseInt(document.getElementById('goalTarget').value),
        current: 0,
        unit: document.getElementById('goalUnit').value,
        period: document.getElementById('goalPeriod').value,
        reward: document.getElementById('goalReward').value,
        rewardPoints: parseInt(document.getElementById('goalRewardPoints').value),
        icon: document.getElementById('goalIcon').value,
        streak: 0,
        completed: false,
        lastCheckIn: null
      };
      goals.unshift(newGoal);
      user.totalGoals++;
      renderGoals();
      updateUserStats();
      closeModal('createModal');
    }
    
    function deleteGoal(id) {
      if (confirm('确定要删除这个目标吗？')) {
        goals = goals.filter(g => g.id !== id);
        renderGoals();
      }
    }
    
    function openCheckinModal(id) {
      currentGoalId = id;
      const goal = goals.find(g => g.id === id);
      const progress = Math.min(100, Math.round((goal.current / goal.target) * 100));
      
      document.getElementById('checkinPercent').textContent = `${progress}%`;
      document.getElementById('checkinProgressText').textContent = `已完成 ${goal.current}/${goal.target}${goal.unit}`;
      document.getElementById('checkinUnit').textContent = `单位：${goal.unit}`;
      document.getElementById('checkinForm').reset();
      document.getElementById('checkinModal').classList.add('active');
    }
    
    function handleCheckIn(e) {
      e.preventDefault();
      const value = parseInt(document.getElementById('checkinValue').value);
      const note = document.getElementById('checkinNote').value;
      const goal = goals.find(g => g.id === currentGoalId);
      
      goal.current += value;
      goal.lastCheckIn = new Date().toISOString().split('T')[0];
      goal.streak++;
      
      const isCompleted = goal.current >= goal.target;
      if (isCompleted && !goal.completed) {
        goal.completed = true;
        user.points += goal.rewardPoints;
        user.completedGoals++;
        user.exp = Math.min(100, user.exp + 10);
        if (user.exp >= 100) {
          user.level++;
          user.exp = 0;
        }
        
        document.getElementById('celebrationGoalName').textContent = `你完成了「${goal.name}」目标`;
        document.getElementById('celebrationPoints').textContent = `+${goal.rewardPoints}`;
        document.getElementById('celebrationReward').textContent = `奖励：${goal.reward}`;
        
        closeModal('checkinModal');
        setTimeout(() => {
          document.getElementById('celebrationModal').classList.add('active');
        }, 300);
      } else {
        closeModal('checkinModal');
      }
      
      renderGoals();
      updateUserStats();
      renderRewards();
    }
    
    function openClaimModal(id) {
      currentRewardId = id;
      const reward = rewards.find(r => r.id === id);
      document.getElementById('claimIcon').textContent = reward.icon;
      document.getElementById('claimName').textContent = reward.name;
      document.getElementById('claimCost').textContent = reward.cost;
      document.getElementById('claimCurrentPoints').textContent = user.points;
      document.getElementById('claimModal').classList.add('active');
    }
    
    function confirmClaim() {
      const reward = rewards.find(r => r.id === currentRewardId);
      user.points -= reward.cost;
      user.claimedRewards++;
      
      closeModal('claimModal');
      updateUserStats();
      renderRewards();
      
      alert(`恭喜你！成功兑换「${reward.name}」！`);
    }
    
    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('modal-overlay')) {
        e.target.classList.remove('active');
      }
    });
    
    init();
  </script>
</body>
</html>
