<body>
  <div class="phone-frame">

    <!-- ======== SPLASH SCREEN ======== -->
    <div class="screen active" id="splash-screen">
      <img src="assets/avatar_ai_tutor.jpg" alt="AI Tutor" class="hero-img">
      <h1>TalkMate</h1>
      <p class="tagline">AI 驱动的英语口语练习伙伴</p>
      <button class="start-btn" onclick="goTo('onboarding-screen')">开始练习</button>
    </div>

    <!-- ======== ONBOARDING SCREEN ======== -->
    <div class="screen" id="onboarding-screen">
      <div class="onboarding-scrollable">
        <div class="onboarding-header">
          <h2>选择对话场景</h2>
          <p>搜索或浏览场景，开始英语对话练习</p>
        </div>
        <div class="scene-search">
          <input type="text" id="scene-search-input" placeholder="搜索场景，如：面试、旅行..." oninput="filterScenes()">
        </div>
        <div class="category-tabs" id="category-tabs">
          <button class="cat-tab selected" data-cat="all">全部</button>
          <button class="cat-tab" data-cat="daily">日常</button>
          <button class="cat-tab" data-cat="travel">旅行</button>
          <button class="cat-tab" data-cat="work">职场</button>
          <button class="cat-tab" data-cat="study">学习</button>
          <button class="cat-tab" data-cat="social">社交</button>
          <button class="cat-tab" data-cat="life">生活</button>
          <button class="cat-tab" data-cat="fun">娱乐</button>
        </div>
        <div class="hot-picks" id="hot-picks">
          <div class="hot-picks-label">
            <span>🔥 热门推荐</span>
            <span class="swipe-hint">› 左右滑动</span>
          </div>
          <div class="hot-picks-wrap">
            <div class="hot-picks-scroll" id="hot-picks-scroll"></div>
            <div class="hot-picks-fade"></div>
          </div>
        </div>
        <div class="scene-list" id="scene-list">
          <div class="scene-list-header">全部场景 <span id="scene-count">0 个场景</span></div>
          <div id="scene-list-body"></div>
        </div>
      </div>
      <div class="onboarding-footer">
        <div class="difficulty-select">
          <label>选择难度</label>
          <div class="difficulty-btns">
            <button class="diff-btn" data-level="beginner">初级</button>
            <button class="diff-btn selected" data-level="intermediate">中级</button>
            <button class="diff-btn" data-level="advanced">高级</button>
          </div>
        </div>
        <button class="begin-btn" id="begin-btn" onclick="startChat()">开始对话</button>
      </div>
    </div>

    <!-- ======== CHAT SCREEN ======== -->
    <div class="screen" id="chat-screen">
      <div class="chat-header">
        <button class="back-btn" onclick="goTo('onboarding-screen')">‹</button>
        <img src="assets/avatar_ai_tutor.jpg" alt="AI Tutor" class="avatar">
        <div class="tutor-info">
          <h3>Emma</h3>
          <div class="status">在线</div>
        </div>
        <div class="header-actions">
          <button id="translate-toggle" onclick="toggleTranslate()" title="翻译">🌐</button>
          <button onclick="toggleCorrPanel()" title="纠错记录">📝</button>
          <button onclick="goTo('stats-screen')" title="学习报告">📊</button>
        </div>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="scroll-hint" id="scroll-hint" onclick="scrollToBottom()">↓</div>
      <div class="chat-input-area">
        <div class="quick-replies" id="quick-replies"></div>
        <div class="input-row">
          <button class="mic-btn" id="mic-btn" onclick="toggleMic()">🎤</button>
          <textarea id="msg-input" rows="1" placeholder="输入英语消息..." onkeydown="handleKeydown(event)"></textarea>
          <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
        </div>
      </div>
      <div class="overlay" id="overlay" onclick="toggleCorrPanel()"></div>
      <div class="corr-panel" id="corr-panel">
        <div class="corr-panel-header">
          <h4>📝 纠错记录</h4>
          <button class="close-panel" onclick="toggleCorrPanel()">✕</button>
        </div>
        <div class="corr-panel-body" id="corr-panel-body"></div>
      </div>
      <div class="toast" id="toast"></div>
    </div>

    <!-- ======== STATS SCREEN ======== -->
    <div class="screen" id="stats-screen">
      <div class="screen-content">

      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      input.rows = 1;

      // Count words
      text.split(/\s+/).forEach(w => userWords.add(w.toLowerCase().replace(/[^a-z]/g, '')));
      messageCount++;

      // Check for corrections
      const corrections = checkCorrections(text);
      const now = new Date().toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
      correctionCount += corrections.length;
      corrections.forEach(c => { c.time = now; correctionHistory.push(c); });

      // Add user message
      const translation = translateEnabled ? translateToCN(text) : '';
      addMessage('user', text, translation, corrections);

      // Update corrections panel
      updateCorrPanel();

      // Simulate AI typing and response
      showTyping();
      setTimeout(() => {
        hideTyping();
        const response = generateAIResponse(text);
        addMessage('ai', response.text, response.cn);
      }, 1200 + Math.random() * 1000);
    }

    function checkCorrections(text) {
      const corrections = [];
      const lower = text.toLowerCase();

      // 1. 形容词修饰错误（中式表达）
      if (lower.match(/\bvery much (good|happy|nice|tired|busy|great|bad|sad|excited|boring)\b/)) {
        corrections.push({ type: 'grammar', original: text, fixed: text.replace(/very much/i, 'very'), explain: "修饰形容词用 very，very much 通常修饰动词。" });
      }

      // 2. 介词搭配错误
      if (lower.match(/\b(good in|good on|interested on|good with)\b/)) {
        corrections.push({ type: 'grammar', original: text, fixed: text.replace(/good in/i, 'good at').replace(/good on/i, 'good at').replace(/interested on/i, 'interested in').replace(/good with/i, 'good at'), explain: "be good at / be interested in 是固定搭配。" });
      }

      // 3. 时态错误：yesterday/today/last week 等时间词 + 现在时
      if (lower.match(/\b(yesterday|last (week|month|year)|ago)\b/) && lower.match(/\b(go|eat|see|do|make|take|have|is|am|are)\b(?!\s*(been|done|gone|made|taken))/)) {
        const tenseFixes = { go: 'went', eat: 'ate', see: 'saw', do: 'did', make: 'made', take: 'took', have: 'had', is: 'was', am: 'was', are: 'were' };
        let fixed = text;
        for (const [present, past] of Object.entries(tenseFixes)) {
          const re = new RegExp(`\\b${present}\\b`, 'i');
          if (lower.match(re)) { fixed = fixed.replace(re, past); break; }
        }
        corrections.push({ type: 'grammar', original: text, fixed: fixed, explain: "描述过去发生的事情，动词需用过去式。" });
      }

      // 4. 第三人称单数遗漏
      if (lower.match(/\b(she|he|it)\s+(go|do|have|make|take|eat|watch|play|study|work|live|like|want|need|love|hate)\b(?!\s*(to|been|done|gone|made|taken|eaten|watched|played|studied|worked|lived|liked|wanted|needed|loved|hated))/)) {
        const sFixes = { go: 'goes', do: 'does', have: 'has', make: 'makes', take: 'takes', eat: 'eats', watch: 'watches', play: 'plays', study: 'studies', work: 'works', live: 'lives', like: 'likes', want: 'wants', need: 'needs', love: 'loves', hate: 'hates' };
        let fixed = text;
        for (const [base, third] of Object.entries(sFixes)) {
          const re = new RegExp(`\\b(she|he|it)\\s+${base}\\b`, 'i');
          if (lower.match(re)) { fixed = fixed.replace(new RegExp(`\\b${base}\\b`, 'i'), third); break; }
        }
        corrections.push({ type: 'grammar', original: text, fixed: fixed, explain: "第三人称单数作主语时，一般现在时的动词要加 -s/-es。" });
      }

      // 5. 情态动词后接原形
      if (lower.match(/\b(can|could|will|would|should|must|may|might)\s+\w+(s|es|ed|ing)\b/)) {
        const modalFixes = { goes: 'go', does: 'do', has: 'have', makes: 'make', takes: 'take', eats: 'eat', watches: 'watch', plays: 'play', studies: 'study', works: 'work', lives: 'live', likes: 'like', wants: 'want', needs: 'need', loves: 'love', hated: 'hate', went: 'go', did: 'do', made: 'make', took: 'take', ate: 'eat', saw: 'see', was: 'be', were: 'be', had: 'have', going: 'go', doing: 'do', making: 'make', taking: 'take', eating: 'eat', watching: 'watch', playing: 'play', studying: 'study', working: 'work', living: 'live', liking: 'like', wanting: 'want', needing: 'need', loving: 'love', hating: 'hate' };
        let fixed = text;
        for (const [wrong, right] of Object.entries(modalFixes)) {
          const re = new RegExp(`\\b(can|could|will|would|should|must|may|might)\\s+${wrong}\\b`, 'i');
          if (lower.match(re)) { fixed = fixed.replace(new RegExp(`\\b${wrong}\\b`, 'i'), right); break; }
        }
        corrections.push({ type: 'grammar', original: text, fixed: fixed, explain: "情态动词后必须接动词原形。" });
      }

      // 6. 冠词遗漏（常见中式英语）
      if (lower.match(/\b(i am|he is|she is|it is|you are|we are|they are)\s+(student|teacher|doctor|engineer|developer|worker|driver|nurse|artist|writer|player)\b/)) {
        corrections.push({ type: 'grammar', original: text, fixed: text.replace(/(student|teacher|doctor|engineer|developer|worker|driver|nurse|artist|writer|player)/i, 'a $1'), explain: "单数可数名词前通常需要加冠词 a/an。" });
      }

      // 7. 虚拟语气 were
      if (lower.match(/\bif i (was|were)\b/)) {
        corrections.push({ type: 'grammar', original: text, fixed: text.replace(/if i was/i, 'If I were').replace(/if i were/i, 'If I were'), explain: "虚拟语气中，if 从句的 be 动词统一用 were。" });
      }

      // 8. since/for 混淆
      if (lower.match(/\b(since|for)\s+\d+\s+(years|months|weeks|days|hours|minutes)/)) {
        if (lower.match(/\bsince\s+\d+\s+(years|months|weeks|days|hours|minutes)/)) {
          corrections.push({ type: 'grammar', original: text, fixed: text.replace(/since/i, 'for'), explain: "表示持续时间段用 for，since 后接具体时间点。" });
        }
      }

      // 9. there is/are 混淆
      if (lower.match(/\bthere is\s+\d*\s*(books|students|people|apples|cars|dogs|cats|friends|teachers)\b/)) {
        corrections.push({ type: 'grammar', original: text, fixed: text.replace(/there is/i, 'There are'), explain: "there be 句型中，be 动词需与后面的名词保持数的一致。" });
      }

      // 10. 用词升级建议（表达优化）
      const wordUpgrades = {
        'very good': { better: 'excellent', explain: "excellent 比 very good 更地道、更高级。" },
        'very bad': { better: 'terrible', explain: "terrible 比 very bad 表达更强烈。" },
        'very happy': { better: 'delighted', explain: "delighted 是 very happy 的优雅替代表达。" },
        'very tired': { better: 'exhausted', explain: "exhausted 比 very tired 更能表达精疲力尽。" },
        'very big': { better: 'enormous', explain: "enormous 是 very big 的升级表达。" },
        'very small': { better: 'tiny', explain: "tiny 比 very small 更生动形象。" },
        'very beautiful': { better: 'gorgeous', explain: "gorgeous 是 very beautiful 的高级替换。" },
        'very important': { better: 'crucial', explain: "crucial 强调重要性，比 very important 更有力。" }
      };
      for (const [simple, upgrade] of Object.entries(wordUpgrades)) {
        const re = new RegExp(`\\b${simple}\\b`, 'i');
        if (lower.match(re)) {
          corrections.push({ type: 'vocab', original: text, fixed: text.replace(re, upgrade.better), explain: upgrade.explain });
          break;
        }
      }

      return corrections;
    }

        'go': '去', 'come': '来', 'see': '看见', 'feel': '感觉',
        'my': '我的', 'your': '你的', 'his': '他的', 'her': '她的',
        'this': '这个', 'that': '那个', 'here': '这里', 'there': '那里',
        'yes': '是的', 'no': '不', 'not': '不', 'can': '能', 'will': '将会',

      };
      const words = text.toLowerCase().split(/\s+/);

    function generateAIResponse(userText) {
      // Simple context-aware response selection
      const lower = userText.toLowerCase();
      if (lower.includes('tired') || lower.includes('busy') || lower.includes('stress')) {
        return { text: "I understand. Make sure to take some time to rest and relax.", cn: "我理解。一定要抽时间休息放松一下。" };
      }
      if (lower.includes('love') || lower.includes('like') || lower.includes('enjoy')) {
        return { text: "It's wonderful to have something you're passionate about!", cn: "有热爱的事物真是太好了！" };
      }
      if (lower.includes('not') || lower.includes('no') || lower.includes('never')) {
        return { text: "That's okay! Everyone has different experiences and preferences.", cn: "没关系！每个人都有不同的经历和喜好。" };
      }
      const r = aiResponses[Math.floor(Math.random() * aiResponses.length)];
      return r;
    }

    function addMessage(sender, text, translation, corrections) {
      const container = document.getElementById('chat-messages');
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${sender}`;

      let corrHTML = '';
      if (corrections && corrections.length > 0) {
        corrections.forEach(c => {
          corrHTML += `<div class="correction-box ${c.type}">
            <div class="corr-title">${c.type === 'grammar' ? '⚠️ 语法纠正' : '📌 词汇纠正'}</div>
            <div><span class="corr-original">${escapeHtml(c.original)}</span> → <span class="corr-fixed">${escapeHtml(c.fixed)}</span></div>
            <div class="corr-explain">${c.explain}</div>
          </div>`;
        });
      }

      let transHTML = '';
      if (translation && translateEnabled) {
        transHTML = `<div class="translation">${escapeHtml(translation)}</div>`;
      }

      msgDiv.innerHTML = `
        <img src="assets/avatar_ai_tutor.jpg" alt="" class="msg-avatar">
        <div class="msg-bubble">
          <div>${escapeHtml(text)}</div>
          ${transHTML}
          ${sender === 'user' ? corrHTML : ''}
        </div>
      `;

      container.appendChild(msgDiv);
      scrollToBottom();

      // Show scroll hint if not at bottom
      setTimeout(() => {
        const hint = document.getElementById('scroll-hint');
        if (container.scrollTop + container.clientHeight < container.scrollHeight - 50) {
          hint.classList.add('show');
        }
      }, 100);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function showTyping() {
      const container = document.getElementById('chat-messages');
      const typingDiv = document.createElement('div');
      typingDiv.className = 'msg ai';
      typingDiv.id = 'typing-indicator';
      typingDiv.innerHTML = `
        <img src="assets/avatar_ai_tutor.jpg" alt="" class="msg-avatar">
        <div class="typing"><span></span><span></span><span></span></div>
      `;
      container.appendChild(typingDiv);
      scrollToBottom();
    }

    function hideTyping() {
      const t = document.getElementById('typing-indicator');
      if (t) t.remove();
    }

    function scrollToBottom() {
      const container = document.getElementById('chat-messages');
      container.scrollTop = container.scrollHeight;
      document.getElementById('scroll-hint').classList.remove('show');
    }

    // Scroll listener for hint
    document.getElementById('chat-messages').addEventListener('scroll', function() {
      const hint = document.getElementById('scroll-hint');
      if (this.scrollTop + this.clientHeight >= this.scrollHeight - 20) {
        hint.classList.remove('show');
      }
    });

    // Auto-resize textarea
    document.getElementById('msg-input').addEventListener('input', function() {
      this.rows = 1;
      const rows = Math.min(5, Math.ceil(this.scrollHeight / 24));
      this.rows = rows;
    });

    // ================= TRANSLATION =================
    function toggleTranslate() {
      translateEnabled = !translateEnabled;
      const btn = document.getElementById('translate-toggle');
      btn.classList.toggle('active', translateEnabled);
      showToast(translateEnabled ? '翻译已开启' : '翻译已关闭');

      // Toggle existing translations
      document.querySelectorAll('.translation').forEach(el => {
        el.style.display = translateEnabled ? 'block' : 'none';
      });
    }
    document.getElementById('translate-toggle').classList.add('active');

    // ================= CORRECTIONS PANEL =================
    function toggleCorrPanel() {
      const panel = document.getElementById('corr-panel');
      const overlay = document.getElementById('overlay');
      panel.classList.toggle('open');
      overlay.classList.toggle('show');
    }

    function updateCorrPanel() {
      const body = document.getElementById('corr-panel-body');
      if (correctionHistory.length === 0) {
        body.innerHTML = '<p style="text-align:center;color:var(--muted);padding:20px;">暂无纠错记录，继续加油！💪</p>';
        return;
      }
      body.innerHTML = correctionHistory.map((c, i) => `
        <div class="corr-item ${c.type}">
          <div class="corr-item-header">
            <span class="corr-tag">${c.type === 'grammar' ? '语法' : '词汇'}</span>
            <span class="corr-time">${c.time || ''}</span>
          </div>
          <div style="font-size:13px;line-height:1.5;">
            <div><span style="text-decoration:line-through;opacity:0.6">${escapeHtml(c.original)}</span></div>
            <div style="font-weight:600;margin-top:2px">→ ${escapeHtml(c.fixed)}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:4px">${c.explain}</div>
          </div>
        </div>
      `).join('');
    }

    // ================= MIC (SIMULATED) =================
    function toggleMic() {
      const btn = document.getElementById('mic-btn');
      isRecording = !isRecording;
      btn.classList.toggle('recording', isRecording);
      if (isRecording) {
        showToast('正在聆听...请说话');
        setTimeout(() => {
          isRecording = false;
          btn.classList.remove('recording');
          const samples = ["I went to the park yesterday.", "I really enjoy reading books.", "My favorite movie is Inception.", "I am learning English every day."];
          const text = samples[Math.floor(Math.random() * samples.length)];
          document.getElementById('msg-input').value = text;
          showToast('识别完成');
        }, 2500);
      }
    }

    // ================= STATS =================
    function updateStats() {
      document.getElementById('stat-messages').textContent = messageCount;
      document.getElementById('stat-words').textContent = userWords.size;
      document.getElementById('stat-corrections').textContent = correctionCount;
      const accuracy = messageCount > 0 ? Math.max(0, Math.round(100 - (correctionCount / messageCount) * 30)) : 0;
      document.getElementById('stat-accuracy').textContent = accuracy + '%';

      const vocabScore = Math.min(100, userWords.size * 5);
      const grammarScore = Math.min(100, Math.max(40, 100 - correctionCount * 8));
      const fluencyScore = Math.min(100, messageCount * 12);

      document.getElementById('prog-vocab').style.width = vocabScore + '%';
      document.getElementById('prog-vocab-val').textContent = vocabScore + '%';
      document.getElementById('prog-grammar').style.width = grammarScore + '%';
      document.getElementById('prog-grammar-val').textContent = grammarScore + '%';
      document.getElementById('prog-fluency').style.width = fluencyScore + '%';
      document.getElementById('prog-fluency-val').textContent = fluencyScore + '%';
    }

    // ================= TOAST =================
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    correctionCount = correctionHistory.length;
    updateCorrPanel();
  </script>
