<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>独居老人生活节拍器</title>
    <style>
        :root {
            --primary: #4A90D9;
            --primary-light: #6BA3E0;
            --primary-dark: #3A7BC8;
            --accent: #F5A623;
            --accent-light: #FFB84D;
            --success: #52C41A;
            --warning: #FAAD14;
            --danger: #FF4D4F;
            --bg: #F5F7FA;
            --card-bg: #FFFFFF;
            --text-primary: #1A1A1A;
            --text-secondary: #666666;
            --text-tertiary: #999999;
            --border: #E8E8E8;
            --shadow: 0 2px 12px rgba(74, 144, 217, 0.08);
            --shadow-hover: 0 4px 16px rgba(74, 144, 217, 0.15);
            --radius: 16px;
            --radius-sm: 8px;
            --safe-area-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app {
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--bg);
            position: relative;
            padding-bottom: calc(70px + var(--safe-area-bottom));
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            padding: 20px 20px 60px;
            position: relative;
            border-radius: 0 0 30px 30px;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 4px 12px rgba(245, 166, 35, 0.4);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-title svg {
            width: 24px;
            height: 24px;
        }

        .header-time {
            font-size: 12px;
            opacity: 0.9;
        }

        .header-greeting {
            font-size: 14px;
            opacity: 0.85;
        }

        /* Main Content */
        .content {
            padding: 0 16px;
            margin-top: 10px;
        }

        /* Page containers */
        .page {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Card */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            transition: box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: var(--shadow-hover);
        }

        /* Elder Card */
        .elder-card {
            background: linear-gradient(135deg, #FFFFFF 0%, #F8FBFF 100%);
            border: 1px solid rgba(74, 144, 217, 0.1);
            position: relative;
            overflow: hidden;
        }

        .elder-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }

        .elder-info {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .elder-avatar {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 4px 12px rgba(74, 144, 217, 0.3);
        }

        .elder-details {
            flex: 1;
        }

        .elder-name {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .elder-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .elder-status.normal {
            background: rgba(82, 196, 26, 0.1);
            color: var(--success);
        }

        .elder-status.warning {
            background: rgba(250, 173, 20, 0.1);
            color: var(--warning);
        }

        .elder-status.critical {
            background: rgba(255, 77, 79, 0.1);
            color: var(--danger);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .elder-meta {
            display: flex;
            justify-content: space-between;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .meta-item {
            text-align: center;
        }

        .meta-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }

        .meta-label {
            font-size: 11px;
            color: var(--text-tertiary);
            margin-top: 2px;
        }

        /* Rhythm Display */
        .rhythm-section {
            padding: 24px 20px;
        }

        .rhythm-card {
            background: linear-gradient(135deg, #FFFFFF 0%, #F0F7FF 100%);
            border: 1px solid rgba(74, 144, 217, 0.15);
        }

        .rhythm-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .rhythm-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rhythm-badge {
            padding: 4px 10px;
            background: rgba(74, 144, 217, 0.1);
            color: var(--primary);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .rhythm-circle {
            width: 160px;
            height: 160px;
            margin: 0 auto 24px;
            position: relative;
        }

        .rhythm-circle svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .rhythm-bg {
            fill: none;
            stroke: #E8F0F8;
            stroke-width: 12;
        }

        .rhythm-progress {
            fill: none;
            stroke: url(#rhythmGradient);
            stroke-width: 12;
            stroke-linecap: round;
            stroke-dasharray: 440;
            stroke-dashoffset: 110;
            transition: stroke-dashoffset 1s ease;
        }

        .rhythm-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .rhythm-value {
            font-size: 42px;
            font-weight: 700;
            color: var(--primary);
            line-height: 1;
        }

        .rhythm-label {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 4px;
        }

        .rhythm-tips {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: rgba(82, 196, 26, 0.08);
            border-radius: var(--radius-sm);
            color: var(--success);
            font-size: 13px;
        }

        /* Quick Actions */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            background: var(--bg);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn:active {
            transform: scale(0.98);
            background: #E8ECF0;
        }

        .action-btn.primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
        }

        .action-btn.accent {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            color: white;
        }

        /* Timeline */
        .timeline {
            position: relative;
            padding-left: 24px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 7px;
            top: 8px;
            bottom: 8px;
            width: 2px;
            background: linear-gradient(180deg, var(--primary), var(--accent));
            border-radius: 2px;
        }

        .timeline-item {
            position: relative;
            padding-bottom: 20px;
        }

        .timeline-item:last-child {
            padding-bottom: 0;
        }

        .timeline-dot {
            position: absolute;
            left: -24px;
            top: 4px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 3px solid var(--primary);
            z-index: 1;
        }

        .timeline-dot.water {
            border-color: #52C41A;
        }

        .timeline-dot.electric {
            border-color: var(--accent);
        }

        .timeline-time {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-bottom: 4px;
        }

        .timeline-content {
            font-size: 14px;
            color: var(--text-primary);
        }

        .timeline-desc {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* Alert List */
        .alert-card {
            border-left: 4px solid var(--warning);
        }

        .alert-card.critical {
            border-left-color: var(--danger);
        }

        .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .alert-type {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .alert-type.timeout {
            background: rgba(250, 173, 20, 0.1);
            color: var(--warning);
        }

        .alert-type.unusual {
            background: rgba(255, 77, 79, 0.1);
            color: var(--danger);
        }

        .alert-time {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .alert-message {
            font-size: 15px;
            color: var(--text-primary);
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .alert-actions {
            display: flex;
            gap: 8px;
        }

        .alert-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .alert-btn.primary {
            background: var(--primary);
            color: white;
        }

        .alert-btn.secondary {
            background: var(--bg);
            color: var(--text-primary);
        }

        /* Profile */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: var(--radius);
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .profile-avatar {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .profile-info h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .profile-info p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .menu-list {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-item:active {
            background: var(--bg);
        }

        .menu-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 14px;
            font-size: 20px;
        }

        .menu-icon.blue {
            background: rgba(74, 144, 217, 0.1);
            color: var(--primary);
        }

        .menu-icon.orange {
            background: rgba(245, 166, 35, 0.1);
            color: var(--accent);
        }

        .menu-icon.green {
            background: rgba(82, 196, 26, 0.1);
            color: var(--success);
        }

        .menu-icon.red {
            background: rgba(255, 77, 79, 0.1);
            color: var(--danger);
        }

        .menu-text {
            flex: 1;
            font-size: 15px;
            color: var(--text-primary);
        }

        .menu-arrow {
            color: var(--text-tertiary);
            font-size: 14px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .empty-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .empty-desc {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* Bottom Navigation */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            padding-bottom: calc(8px + var(--safe-area-bottom));
            box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.06);
            border-radius: 20px 20px 0 0;
            z-index: 100;
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-icon {
            font-size: 22px;
            margin-bottom: 2px;
            transition: transform 0.2s ease;
        }

        .tab-text {
            font-size: 11px;
            color: var(--text-tertiary);
            transition: color 0.2s ease;
        }

        .tab-item.active .tab-icon {
            transform: scale(1.1);
        }

        .tab-item.active .tab-text {
            color: var(--primary);
            font-weight: 600;
        }

        /* Section Title */
        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Responsive */
        @media (max-width: 380px) {
            .header {
                padding: 16px 16px 50px;
            }

            .elder-avatar {
                width: 56px;
                height: 56px;
                font-size: 28px;
            }

            .rhythm-circle {
                width: 140px;
                height: 140px;
            }

            .rhythm-value {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="header-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    </svg>
                    生活节拍器
                </div>
                <div class="header-time" id="currentTime"></div>
            </div>
            <div class="header-greeting" id="greeting">守护每一天，安心每一刻</div>
        </header>

        <!-- Content -->
        <div class="content">
            <!-- Home Page -->
            <div class="page active" id="pageHome">
                <!-- Elder Card -->
                <div class="card elder-card" style="margin-top: 10px;">
                    <div class="elder-info">
                        <div class="elder-avatar">👴</div>
                        <div class="elder-details">
                            <div class="elder-name" id="elderName">张爷爷</div>
                            <span class="elder-status normal" id="elderStatus">
                                <span class="status-dot"></span>
                                今日正常
                            </span>
                        </div>
                    </div>
                    <div class="elder-meta">
                        <div class="meta-item">
                            <div class="meta-value" id="todayEvents">12</div>
                            <div class="meta-label">今日活动</div>
                        </div>
                        <div class="meta-item">
                            <div class="meta-value" id="lastActivity">10:30</div>
                            <div class="meta-label">最近活动</div>
                        </div>
                        <div class="meta-item">
                            <div class="meta-value" id="deviceStatus">在线</div>
                            <div class="meta-label">设备状态</div>
                        </div>
                    </div>
                </div>

                <!-- Rhythm Circle -->
                <div class="card rhythm-card rhythm-section">
                    <div class="rhythm-header">
                        <div class="rhythm-title">
                            <span>📊</span>
                            今日生活节拍
                        </div>
                        <span class="rhythm-badge">正常</span>
                    </div>
                    <div class="rhythm-circle">
                        <svg viewBox="0 0 160 160">
                            <defs>
                                <linearGradient id="rhythmGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" stop-color="#4A90D9"/>
                                    <stop offset="100%" stop-color="#F5A623"/>
                                </linearGradient>
                            </defs>
                            <circle class="rhythm-bg" cx="80" cy="80" r="70"/>
                            <circle class="rhythm-progress" cx="80" cy="80" r="70" id="rhythmProgress"/>
                        </svg>
                        <div class="rhythm-center">
                            <div class="rhythm-value" id="rhythmPercent">75%</div>
                            <div class="rhythm-label">节拍完成度</div>
                        </div>
                    </div>
                    <div class="rhythm-tips">
                        <span>✓</span>
                        生活节奏正常，保持良好的作息习惯
                    </div>
                    <div class="quick-actions">
                        <button class="action-btn primary" onclick="switchTab('detail')">
                            <span>📋</span> 查看详情
                        </button>
                        <button class="action-btn accent" onclick="window.location.href='tel:123456789'">
                            <span>📞</span> 一键呼叫
                        </button>
                    </div>
                </div>
            </div>

            <!-- Detail Page -->
            <div class="page" id="pageDetail">
                <div class="card" style="margin-top: 10px;">
                    <div class="section-title">
                        <span>📅</span>
                        今日活动时间线
                    </div>
                    <div class="timeline" id="timeline">
                        <!-- Timeline items will be populated by JS -->
                    </div>
                </div>

                <div class="card">
                    <div class="section-title">
                        <span>📈</span>
                        本周活动统计
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: flex-end; height: 120px; padding: 10px 0;">
                        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
                            <div style="width: 32px; background: linear-gradient(180deg, var(--primary), var(--primary-light)); border-radius: 4px; height: 60px;"></div>
                            <span style="font-size: 11px; color: var(--text-tertiary);">周一</span>
                        </div>
                        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
                            <div style="width: 32px; background: linear-gradient(180deg, var(--primary), var(--primary-light)); border-radius: 4px; height: 75px;"></div>
                            <span style="font-size: 11px; color: var(--text-tertiary);">周二</span>
                        </div>
                        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
                            <div style="width: 32px; background: linear-gradient(180deg, var(--primary), var(--primary-light)); border-radius: 4px; height: 50px;"></div>
                            <span style="font-size: 11px; color: var(--text-tertiary);">周三</span>
                        </div>
                        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
                            <div style="width: 32px; background: linear-gradient(180deg, var(--primary), var(--primary-light)); border-radius: 4px; height: 85px;"></div>
                            <span style="font-size: 11px; color: var(--text-tertiary);">周四</span>
                        </div>
                        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
                            <div style="width: 32px; background: linear-gradient(180deg, var(--primary), var(--primary-light)); border-radius: 4px; height: 70px;"></div>
                            <span style="font-size: 11px; color: var(--text-tertiary);">周五</span>
                        </div>
                        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
                            <div style="width: 32px; background: linear-gradient(180deg, var(--accent), var(--accent-light)); border-radius: 4px; height: 90px;"></div>
                            <span style="font-size: 11px; color: var(--text-tertiary);">周六</span>
                        </div>
                        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
                            <div style="width: 32px; background: linear-gradient(180deg, var(--primary), var(--primary-light)); border-radius: 4px; height: 65px; opacity: 0.5;"></div>
                            <span style="font-size: 11px; color: var(--primary); font-weight: 600;">今天</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Alert Page -->
            <div class="page" id="pageAlert">
                <div style="margin-top: 10px;">
                    <div class="section-title" style="padding: 0 4px;">
                        <span>🔔</span>
                        提醒记录
                    </div>
                    <div id="alertList">
                        <!-- Alert items will be populated by JS -->
                    </div>
                </div>
            </div>

            <!-- Profile Page -->
            <div class="page" id="pageProfile">
                <div class="profile-header" style="margin-top: 10px;">
                    <div class="profile-avatar">👤</div>
                    <div class="profile-info">
                        <h2>李女士</h2>
                        <p>张爷爷的女儿</p>
                    </div>
                </div>

                <div class="menu-list">
                    <div class="menu-item">
                        <div class="menu-icon blue">👴</div>
                        <span class="menu-text">管理关注成员</span>
                        <span class="menu-arrow">›</span>
                    </div>
                    <div class="menu-item">
                        <div class="menu-icon orange">📱</div>
                        <span class="menu-text">设备管理</span>
                        <span class="menu-arrow">›</span>
                    </div>
                    <div class="menu-item">
                        <div class="menu-icon green">👥</div>
                        <span class="menu-text">紧急联系人</span>
                        <span class="menu-arrow">›</span>
                    </div>
                    <div class="menu-item">
                        <div class="menu-icon blue">🔔</div>
                        <span class="menu-text">提醒设置</span>
                        <span class="menu-arrow">›</span>
                    </div>
                    <div class="menu-item">
                        <div class="menu-icon red">❓</div>
                        <span class="menu-text">帮助与反馈</span>
                        <span class="menu-arrow">›</span>
                    </div>
                </div>

                <div style="text-align: center; margin-top: 30px; padding: 20px;">
                    <p style="font-size: 12px; color: var(--text-tertiary);">独居老人生活节拍器 v1.0</p>
                    <p style="font-size: 11px; color: var(--text-tertiary); margin-top: 4px;">守护每一天，安心每一刻</p>
                </div>
            </div>
        </div>

        <!-- Tab Bar -->
        <nav class="tab-bar">
            <div class="tab-item active" data-page="home" onclick="switchTab('home')">
                <span class="tab-icon">🏠</span>
                <span class="tab-text">首页</span>
            </div>
            <div class="tab-item" data-page="detail" onclick="switchTab('detail')">
                <span class="tab-icon">📋</span>
                <span class="tab-text">详情</span>
            </div>
            <div class="tab-item" data-page="alert" onclick="switchTab('alert')">
                <span class="tab-icon">🔔</span>
                <span class="tab-text">提醒</span>
            </div>
            <div class="tab-item" data-page="profile" onclick="switchTab('profile')">
                <span class="tab-icon">👤</span>
                <span class="tab-text">我的</span>
            </div>
        </nav>
    </div>

    <script>
        // 模拟数据
        const mockData = {
            elder: {
                id: 'elder_001',
                name: '张爷爷',
                avatar: '👴',
                todayStatus: 'normal',
                lastActivity: '10:30',
                todayEvents: 12,
                bindingDevice: 'A123'
            },
            timeline: [
                { time: '06:30', type: 'electric', content: '卧室灯开启', desc: '起床洗漱' },
                { time: '06:45', type: 'water', content: '卫生间用水', desc: '洗漱用水' },
                { time: '07:20', type: 'water', content: '厨房用水', desc: '准备早餐' },
                { time: '07:35', type: 'electric', content: '电饭煲启动', desc: '煮粥' },
                { time: '08:10', type: 'water', content: '厨房用水', desc: '洗碗' },
                { time: '08:30', type: 'electric', content: '客厅灯开启', desc: '客厅活动' },
                { time: '09:15', type: 'water', content: '卫生间用水', desc: '如厕' },
                { time: '10:00', type: 'electric', content: '电视开启', desc: '观看新闻' },
                { time: '10:30', type: 'water', content: '厨房用水', desc: '烧水' }
            ],
            alerts: [
                {
                    id: 'alert_001',
                    type: 'timeout',
                    message: '上午10点未检测到日常用水活动，系统已发送静默提醒给家人。',
                    time: '10:05',
                    status: 'pending'
                },
                {
                    id: 'alert_002',
                    type: 'unusual',
                    message: '检测到下午用水行为异常，持续时间较长，已升级通知社区志愿者。',
                    time: '昨天 15:30',
                    status: 'handled'
                }
            ]
        };

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            updateTime();
            setInterval(updateTime, 60000);
            renderTimeline();
            renderAlerts();
            loadFromStorage();
        });

        // 更新时间
        function updateTime() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('currentTime').textContent = `${hours}:${minutes}`;

            // 更新问候语
            let greeting = '守护每一天，安心每一刻';
            if (hours >= 5 && hours < 12) {
                greeting = '早上好，美好的一天从守护开始';
            } else if (hours >= 12 && hours < 18) {
                greeting = '下午好，持续守护中';
            } else if (hours >= 18 && hours < 22) {
                greeting = '晚上好，愿您安心入眠';
            } else {
                greeting = '夜深了，有我守护';
            }
            document.getElementById('greeting').textContent = greeting;
        }

        // 渲染时间线
        function renderTimeline() {
            const container = document.getElementById('timeline');
            container.innerHTML = mockData.timeline.map(item => `
                <div class="timeline-item">
                    <div class="timeline-dot ${item.type}"></div>
                    <div class="timeline-time">${item.time}</div>
                    <div class="timeline-content">${item.content}</div>
                    <div class="timeline-desc">${item.desc}</div>
                </div>
            `).join('');
        }

        // 渲染提醒列表
        function renderAlerts() {
            const container = document.getElementById('alertList');
            if (mockData.alerts.length === 0) {
                container.innerHTML = `
                    <div class="card empty-state">
                        <div class="empty-icon">🎉</div>
                        <div class="empty-title">一切正常</div>
                        <div class="empty-desc">暂无异常提醒，继续保持</div>
                    </div>
                `;
                return;
            }
            container.innerHTML = mockData.alerts.map(alert => `
                <div class="card alert-card ${alert.type === 'unusual' ? 'critical' : ''}">
                    <div class="alert-header">
                        <span class="alert-type ${alert.type}">
                            ${alert.type === 'timeout' ? '⏰ 超时提醒' : '⚠️ 异常提醒'}
                        </span>
                        <span class="alert-time">${alert.time}</span>
                    </div>
                    <div class="alert-message">${alert.message}</div>
                    <div class="alert-actions">
                        <button class="alert-btn secondary" onclick="handleAlert('${alert.id}')">
                            ${alert.status === 'pending' ? '查看详情' : '已处理'}
                        </button>
                        <button class="alert-btn primary" onclick="window.location.href='tel:123456789'">
                            联系老人
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 处理提醒
        function handleAlert(alertId) {
            const alert = mockData.alerts.find(a => a.id === alertId);
            if (alert && alert.status === 'pending') {
                alert.status = 'handled';
                renderAlerts();
                saveToStorage();
            }
        }

        // 切换标签页
        function switchTab(page) {
            // 隐藏所有页面
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            // 显示目标页面
            document.getElementById('page' + page.charAt(0).toUpperCase() + page.slice(1)).classList.add('active');
            // 更新标签状态
            document.querySelectorAll('.tab-item').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.page === page);
            });
        }

        // 本地存储
        function saveToStorage() {
            localStorage.setItem('rhythmData', JSON.stringify(mockData));
        }

        function loadFromStorage() {
            const saved = localStorage.getItem('rhythmData');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    // 可以用保存的数据更新UI
                } catch (e) {
                    console.log('数据格式错误，使用默认数据');
                }
            }
        }
    </script>
</body>
</html>
