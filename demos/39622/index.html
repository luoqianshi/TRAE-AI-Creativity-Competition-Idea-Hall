        // Initialize App
        function init() {
            loadData();
            checkNewDay();
            updateStreak();
            applyTheme();
            renderCategories();
            renderCardsList();
            updateProgress();
            updateStatsDashboard();
            displayRandomCard();
            initCharts();
            
            // Add keyboard event listener
            document.addEventListener('keydown', handleKeyboard);
        }

        // Load Data from localStorage
        function loadData() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                appData = JSON.parse(stored);
                // Ensure all cards have the new properties
                appData.cards.forEach(card => {
                    if (card.interval === undefined) card.interval = 1;
                    if (card.ease === undefined) card.ease = 2.5;
                    if (card.nextReview === undefined) card.nextReview = Date.now();
                });
            } else {
                appData.cards = [...SAMPLE_CARDS];
                saveData();
            }
        }

        // Save Data to localStorage
        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        }

        // Check if it's a new day
        function checkNewDay() {
            const today = new Date().toDateString();
            if (appData.lastStudyDate !== today) {
                appData.todayProgress = 0;
                appData.lastStudyDate = today;
                saveData();
            }
        }

        // Update streak
        function updateStreak() {
            const today = new Date().toDateString();
            const yesterday = new Date(Date.now() - 86400000).toDateString();

            if (appData.lastActiveDate === today) {
                return;
            } else if (appData.lastActiveDate === yesterday) {
                appData.streakDays++;
            } else if (appData.lastActiveDate !== today) {
                if (appData.lastActiveDate !== null) {
                    appData.streakDays = 1;
                } else {
                    appData.streakDays = 1;
                }
            }
            appData.lastActiveDate = today;
            saveData();
        }

        // Theme toggle
        function toggleTheme() {
            appData.theme = appData.theme === 'dark' ? 'light' : 'dark';
            applyTheme();
            saveData();
            showToast('主题已切换', 'info');
        }

        function applyTheme() {
            document.documentElement.setAttribute('data-theme', appData.theme);
        }

        // Tab switching
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.includes(tab === 'learn' ? '学习' : '统计'));
            });
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.toggle('active', content.id === `tab-${tab}`);
            });
            if (tab === 'stats') {
                updateCharts();
            }
        }

        // Smart Review Toggle
        function toggleSmartReview() {
            appData.smartReviewEnabled = !appData.smartReviewEnabled;
            document.getElementById('smartReviewToggle').classList.toggle('active', appData.smartReviewEnabled);
            saveData();
            showToast(appData.smartReviewEnabled ? '智能复习模式已开启' : '智能复习模式已关闭', 'info');

            // Re-sort cards if smart review is enabled
            if (appData.smartReviewEnabled) {
                sortCardsForReview();
            }
        }

        // Sort cards based on SM-2 algorithm priority
        function sortCardsForReview() {
            const now = Date.now();
            filteredCards.sort((a, b) => {
                // Cards due for review come first
                const aDue = a.nextReview - now;
                const bDue = b.nextReview - now;

                // Overdue cards first
                if (aDue < 0 && bDue < 0) {
                    // More overdue cards first
                    return aDue - bDue;
                } else if (aDue < 0) {
                    return -1;
                } else if (bDue < 0) {
                    return 1;
                }

                // Not mastered cards come before mastered
                if (!a.mastered && b.mastered) return -1;
                if (a.mastered && !b.mastered) return 1;

                // Lower interval cards come first
                return a.interval - b.interval;
            });
        }

        // SM-2 Algorithm implementation
        function updateCardSchedule(card, quality) {
            // quality: 0-2 = fail (needs review), 3-5 = pass

            if (quality < 3) {
                // Failed - reset
                card.interval = 1;
                card.mastered = false;
            } else {
                // Passed
                if (card.interval === 1) {
                    card.interval = 6;
                } else {
                    card.interval = Math.round(card.interval * card.ease);
                }

                // Update ease factor
                card.ease = Math.max(1.3, card.ease + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02)));

                // Mastered if interval > 21 days
                card.mastered = card.interval > 21;
            }

            // Set next review time
            card.nextReview = Date.now() + card.interval * 24 * 60 * 60 * 1000;
            card.reviewCount++;
        }

        // Render Categories
        function renderCategories() {
            const container = document.getElementById('categoriesList');
            container.innerHTML = `
                <div class="category-tag active" data-category="全部" onclick="filterByCategory('全部')">
                    全部 <span class="category-count">${appData.cards.length}</span>
                </div>
                ${appData.categories.map(cat => {
                    const count = appData.cards.filter(c => c.category === cat).length;
                    const mastered = appData.cards.filter(c => c.category === cat && c.mastered).length;
                    return `
                        <div class="category-tag" data-category="${cat}" onclick="filterByCategory('${cat}')">
                            ${cat} <span class="category-count">${mastered}/${count}</span>
                        </div>
                    `;
                }).join('')}
            `;

            // Update category select in modal
            const select = document.getElementById('cardCategoryInput');
            select.innerHTML = appData.categories.map(cat =>
                `<option value="${cat}">${cat}</option>`
            ).join('');
        }

        // Filter by Category
        function filterByCategory(category) {
            // Update active state
            document.querySelectorAll('.category-tag').forEach(tag => {
                tag.classList.toggle('active', tag.dataset.category === category);
            });

            // Filter cards
            if (category === '全部') {
                filteredCards = [...appData.cards];
            } else {
                filteredCards = appData.cards.filter(c => c.category === category);
            }

            // Apply smart sorting if enabled
            if (appData.smartReviewEnabled) {
                sortCardsForReview();
            }

            currentCardIndex = 0;
            isFlipped = false;
            document.getElementById('flashcard').classList.remove('flipped');
            displayCurrentCard();
        }

        // Display Random Card
        function displayRandomCard() {
            filteredCards = [...appData.cards];

            // Apply smart sorting if enabled
            if (appData.smartReviewEnabled) {
                sortCardsForReview();
            }

            if (filteredCards.length > 0) {
                currentCardIndex = 0;
                displayCurrentCard();
            }
        }

        // Start Challenge Mode - random card selection
        function startChallengeMode() {
            if (appData.cards.length === 0) {
                showToast('请先添加卡片', 'info');
                return;
            }
            
            // Exit challenge mode if already in it
            if (isChallengeMode) {
                exitChallengeMode();
                return;
            }
            
            // Enable challenge mode
            isChallengeMode = true;
            
            // Hide category filter and select all cards
            filteredCards = [...appData.cards];
            
            // Pick a random card
            currentCardIndex = Math.floor(Math.random() * filteredCards.length);
            
            // Reset flip state
            isFlipped = false;
            document.getElementById('flashcard').classList.remove('flipped');
            
            // Show challenge badge
            document.getElementById('challengeBadge').style.display = 'block';
            
            // Update hint
            document.getElementById('cardHint').innerHTML = '<span>🎯</span> 这是随机挑战！翻转看看';
            
            // Change challenge button text
            document.querySelector('.challenge-btn').innerHTML = '<span>✕</span> 退出挑战';
            
            // Display the random card
            displayCurrentCard();
            
            showToast('🎲 随机挑战开始！', 'success');
        }

        // Exit Challenge Mode
        function exitChallengeMode() {
            isChallengeMode = false;
            
            // Hide challenge badge
            document.getElementById('challengeBadge').style.display = 'none';
            
            // Reset hint
            document.getElementById('cardHint').innerHTML = '<span>👆</span> 点击翻转查看答案';
            
            // Change challenge button text back
            document.querySelector('.challenge-btn').innerHTML = '<span>🎲</span> 随机挑战';
            
            // Return to normal mode
            displayRandomCard();
        }

        // Display Current Card
        function displayCurrentCard() {
            const flashcard = document.getElementById('flashcard');
            const front = document.getElementById('cardFront');
            const back = document.getElementById('cardBack');
            const category = document.getElementById('cardCategory');
            const reviewActions = document.getElementById('reviewActions');

            if (filteredCards.length === 0) {
                front.textContent = '暂无卡片';
                back.textContent = '点击"添加卡片"创建新卡片开始学习';
                category.textContent = '-';
                reviewActions.style.display = 'none';
                return;
            }

            const card = filteredCards[currentCardIndex];
            front.textContent = card.front;
            back.textContent = card.back;
            category.textContent = card.category;
            reviewActions.style.display = 'flex';

            // Reset flip state with animation
            if (isFlipped) {
                flashcard.classList.remove('flipped');
                isFlipped = false;
            }

            // Add slide animation
            flashcard.classList.remove('flashcard-front');
            void flashcard.offsetWidth; // Trigger reflow
            flashcard.querySelector('.flashcard-front').classList.add('flashcard-front');
        }

        // Flip Card
        function flipCard() {
            const flashcard = document.getElementById('flashcard');
            flashcard.classList.toggle('flipped');
            isFlipped = !isFlipped;
            playFlipSound();
        }

        // Mark as Remembered (quality 4 - good)
        function markAsRemembered() {
            if (filteredCards.length === 0) return;

            const card = filteredCards[currentCardIndex];
            updateCardSchedule(card, 4);

            appData.todayProgress++;
            appData.totalLearnedCards++;
            saveData();
            updateProgress();
            updateStatsDashboard();
            showToast('太棒了！已记住', 'success');
            playSuccessSound();

            // In challenge mode, show next random card
            if (isChallengeMode) {
                showNextChallengeCard();
            } else {
                // Animate the card
                animateCardTransition();
            }
        }

        // Mark for Review (quality 2 - again)
        function markForReview() {
            if (filteredCards.length === 0) return;

            const card = filteredCards[currentCardIndex];
            updateCardSchedule(card, 2);

            saveData();
            updateStatsDashboard();
            showToast('再看看，加入复习队列', 'info');
            playReviewSound();

            // In challenge mode, show next random card
            if (isChallengeMode) {
                showNextChallengeCard();
            } else {
                animateCardTransition();
            }
        }

        // Show next random card in challenge mode
        function showNextChallengeCard() {
            const flashcard = document.getElementById('flashcard');
            flashcard.style.opacity = '0';
            flashcard.style.transform = 'scale(0.95)';

            setTimeout(() => {
                // Remove current card from list
                filteredCards.splice(currentCardIndex, 1);
                
                // Check if there are cards left
                if (filteredCards.length === 0) {
                    showToast('🎉 挑战完成！所有卡片都复习了一遍！', 'success');
                    exitChallengeMode();
                    return;
                }
                
                // Pick a new random card
                currentCardIndex = Math.floor(Math.random() * filteredCards.length);
                
                // Reset flip state
                isFlipped = false;
                flashcard.classList.remove('flipped');
                
                // Display the new card
                displayCurrentCard();
                
                // Animate in
                flashcard.style.opacity = '1';
                flashcard.style.transform = 'scale(1)';
            }, 200);
        }

        function animateCardTransition() {
            const flashcard = document.getElementById('flashcard');
            flashcard.style.opacity = '0';
            flashcard.style.transform = 'scale(0.95)';

            setTimeout(() => {
                moveToNextCard();
                flashcard.style.opacity = '1';
                flashcard.style.transform = 'scale(1)';
            }, 200);
        }

        // Move to Next Card
        function moveToNextCard() {
            // Remove current card from filtered list
            filteredCards.splice(currentCardIndex, 1);

            // Apply smart sorting if enabled
            if (appData.smartReviewEnabled && filteredCards.length > 0) {
                sortCardsForReview();
            }

            if (filteredCards.length === 0) {
                displayCurrentCard();
                showToast('🎉 今日任务完成！', 'success');
            } else {
                if (currentCardIndex >= filteredCards.length) {
                    currentCardIndex = 0;
                }
                isFlipped = false;
                document.getElementById('flashcard').classList.remove('flipped');
                displayCurrentCard();
            }

            renderCategories();
        }

        // Update Progress
        function updateProgress() {
            const progress = Math.min(appData.todayProgress / appData.dailyGoal, 1);
            const circumference = 326.73;
            const offset = circumference * (1 - progress);

            document.getElementById('progressRing').style.strokeDashoffset = offset;
            document.getElementById('progressCount').textContent = appData.todayProgress;
            document.getElementById('dailyGoalInput').value = appData.dailyGoal;
        }

        // Update Stats Dashboard
        function updateStatsDashboard() {
            document.getElementById('streakDays').textContent = appData.streakDays;
            document.getElementById('totalLearned').textContent = appData.totalLearnedCards;

            const total = appData.cards.length;
            const mastered = appData.cards.filter(c => c.mastered).length;
            const rate = total > 0 ? Math.round((mastered / total) * 100) : 0;
            document.getElementById('masterRate').textContent = rate + '%';

            // Due cards (cards that need review)
            const now = Date.now();
            const dueCards = appData.cards.filter(c => c.nextReview <= now).length;
            document.getElementById('dueCards').textContent = dueCards;

            // Stats tab
            document.getElementById('statsTotalCards').textContent = total;
            document.getElementById('statsMastered').textContent = mastered;
            document.getElementById('statsReviewing').textContent = total - mastered;
            document.getElementById('statsTotalReviews').textContent = appData.cards.reduce((sum, c) => sum + c.reviewCount, 0);
        }

        // Update Daily Goal
        function updateDailyGoal() {
            const input = document.getElementById('dailyGoalInput');
            const value = parseInt(input.value);
            if (value > 0 && value <= 100) {
                appData.dailyGoal = value;
                saveData();
                updateProgress();
                showToast('每日目标已更新', 'info');
            }
        }

        // Render Cards List
        function renderCardsList() {
            const grid = document.getElementById('cardsGrid');

            if (appData.cards.length === 0) {
                grid.innerHTML = `
                    <div class="flashcard-empty">
                        <div class="flashcard-empty-icon">📝</div>
                        <p class="flashcard-empty-text">还没有任何卡片</p>
                        <button class="btn btn-primary" onclick="openAddCardModal()">创建第一张卡片</button>
                    </div>
                `;
                return;
            }

            grid.innerHTML = appData.cards.map(card => `
                <div class="card-item" id="card-${card.id}" onclick="viewCard(${card.id})">
                    <span class="card-item-category">${card.category}</span>
                    <div class="card-item-front">${card.front}</div>
                    <div class="card-item-back">${card.back}</div>
                    <div class="card-item-actions" onclick="event.stopPropagation()">
                        <button class="btn btn-ghost btn-icon" onclick="editCard(${card.id})" title="编辑">✏️</button>
                        <button class="btn btn-ghost btn-icon" onclick="confirmDeleteCard(${card.id})" title="删除">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        // View Card
        function viewCard(id) {
            const card = appData.cards.find(c => c.id === id);
            if (card) {
                filteredCards = [card];
                currentCardIndex = 0;
                isFlipped = false;
                document.getElementById('flashcard').classList.remove('flipped');
                displayCurrentCard();
                window.scrollTo({ top: 0, behavior: 'smooth' });
                switchTab('learn');
            }
        }

        // Add Card
        function handleAddCard(event) {
            event.preventDefault();

            const front = document.getElementById('cardFrontInput').value.trim();
            const back = document.getElementById('cardBackInput').value.trim();
            const category = document.getElementById('cardCategoryInput').value;

            if (!front || !back) {
                showToast('请填写完整信息', 'error');
                return;
            }

            const newCard = {
                id: Date.now(),
                front,
                back,
                category,
                mastered: false,
                reviewCount: 0,
                nextReview: Date.now(),
                interval: 1,
                ease: 2.5
            };

            appData.cards.push(newCard);
            saveData();
            renderCategories();
            renderCardsList();
            updateProgress();
            updateStatsDashboard();
            updateCharts();
            closeModal('addCardModal');
            document.getElementById('addCardForm').reset();
            showToast('🎉 卡片添加成功！', 'success');
        }

        // Edit Card
        function editCard(id) {
            const card = appData.cards.find(c => c.id === id);
            if (!card) return;

            document.getElementById('cardFrontInput').value = card.front;
            document.getElementById('cardBackInput').value = card.back;
            document.getElementById('cardCategoryInput').value = card.category;

            // Mark for deletion after edit
            appData.cards = appData.cards.filter(c => c.id !== id);
            saveData();

            openAddCardModal();
            showToast('编辑卡片信息后保存', 'info');
        }

        // Confirm Delete Card
        function confirmDeleteCard(id) {
            showConfirmDialog(
                '删除卡片',
                '确定要删除这张卡片吗？此操作不可撤销。',
                () => deleteCard(id)
            );
        }

        // Delete Card
        function deleteCard(id) {
            const cardElement = document.getElementById(`card-${id}`);
            if (cardElement) {
                cardElement.classList.add('deleting');
                setTimeout(() => {
                    appData.cards = appData.cards.filter(c => c.id !== id);
                    saveData();
                    renderCategories();
                    renderCardsList();
                    updateProgress();
                    updateStatsDashboard();
                    updateCharts();
                    showToast('卡片已删除', 'success');
                }, 300);
            }
        }

        // Add Category
        function addCategory() {
            const input = document.getElementById('newCategoryInput');
            const name = input.value.trim();

            if (!name) {
                showToast('请输入分类名称', 'error');
                return;
            }

            if (appData.categories.includes(name)) {
                showToast('该分类已存在', 'error');
                return;
            }

            appData.categories.push(name);
            saveData();
            renderCategories();
            updateCharts();
            input.value = '';
            showToast('✨ 分类添加成功！', 'success');
        }

        // Handle Category Keypress
        function handleCategoryKeypress(event) {
            if (event.key === 'Enter') {
                addCategory();
            }
        }

        // Modal Functions
        function openAddCardModal() {
            document.getElementById('addCardModal').classList.add('active');
        }

        function openSettingsModal() {
            document.getElementById('settingsModal').classList.add('active');
            document.getElementById('settingsGoalInput').value = appData.dailyGoal;
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // Close modal on overlay click
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    overlay.classList.remove('active');
                }
            });
        });

        // Save Settings
        function saveSettings() {
            const goal = parseInt(document.getElementById('settingsGoalInput').value);
            if (goal > 0 && goal <= 100) {
                appData.dailyGoal = goal;
                saveData();
                updateProgress();
                closeModal('settingsModal');
                showToast('⚙️ 设置已保存', 'success');
            }
        }

        // Confirm Dialog
        function showConfirmDialog(title, message, callback) {
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmMessage').textContent = message;
            confirmCallback = callback;
            document.getElementById('confirmModal').classList.add('active');
        }

        function confirmAction() {
            if (confirmCallback) {
                confirmCallback();
            }
            closeModal('confirmModal');
            confirmCallback = null;
        }

        // Confirm Clear Data
        function confirmClearData() {
            showConfirmDialog(
                '清除所有数据',
                '确定要清除所有数据吗？包括所有卡片、分类和统计数据。此操作不可恢复！',
                () => {
                    localStorage.removeItem(STORAGE_KEY);
                    location.reload();
                }
            );
        }

        // Export Data
        function exportData() {
            const dataStr = JSON.stringify(appData, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `flashcard-backup-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('📤 数据已导出', 'success');
        }

        // Import Data
        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (imported.cards && imported.categories) {
                            appData = imported;
                            saveData();
                            renderCategories();
                            renderCardsList();
                            updateProgress();
                            updateStatsDashboard();
                            updateCharts();
                            showToast('📥 数据导入成功！', 'success');
                            closeModal('settingsModal');
                        } else {
                            showToast('数据格式不正确', 'error');
                        }
                    } catch (err) {
                        showToast('导入失败：' + err.message, 'error');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // Initialize Charts
        function initCharts() {
            const chartColors = {
                primary: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#6366f1',
                success: getComputedStyle(document.documentElement).getPropertyValue('--success').trim() || '#22c55e',
                warning: getComputedStyle(document.documentElement).getPropertyValue('--warning').trim() || '#f59e0b',
                text: getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim() || '#a0a0a0'
            };

            Chart.defaults.color = chartColors.text;
            Chart.defaults.font.family = "'Inter', 'Noto Sans SC', system-ui, sans-serif";

            // Category Pie Chart
            const pieCtx = document.getElementById('categoryPieChart');
            if (pieCtx) {
                charts.pie = new Chart(pieCtx, {
                    type: 'pie',
                    data: {
                        labels: [],
                        datasets: [{
                            data: [],
                            backgroundColor: ['#6366f1', '#8b5cf6', '#ec4899', '#f59e0b', '#22c55e', '#06b6d4'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'right',
                                labels: {
                                    padding: 15,
                                    usePointStyle: true
                                }
                            }
                        }
                    }
                });
            }

            // Category Bar Chart
            const barCtx = document.getElementById('categoryBarChart');
            if (barCtx) {
                charts.bar = new Chart(barCtx, {
                    type: 'bar',
                    data: {
                        labels: [],
                        datasets: [
                            {
                                label: '已掌握',
                                data: [],
                                backgroundColor: '#22c55e'
                            },
                            {
                                label: '学习中',
                                data: [],
                                backgroundColor: '#f59e0b'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: { stacked: true },
                            y: { stacked: true, beginAtZero: true }
                        },
                        plugins: {
                            legend: {
                                position: 'top',
                                labels: {
                                    usePointStyle: true
                                }
                            }
                        }
                    }
                });
            }

            // Mastery Doughnut Chart
            const doughnutCtx = document.getElementById('masteryDoughnutChart');
            if (doughnutCtx) {
                charts.doughnut = new Chart(doughnutCtx, {
                    type: 'doughnut',
                    data: {
                        labels: ['已掌握', '学习中', '新卡片'],
                        datasets: [{
                            data: [0, 0, 0],
                            backgroundColor: ['#22c55e', '#f59e0b', '#6366f1'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '60%',
                        plugins: {
                            legend: {
                                position: 'right',
                                labels: {
                                    padding: 15,
                                    usePointStyle: true
                                }
                            }
                        }
                    }
                });
            }

            updateCharts();
        }

        // Update Charts
        function updateCharts() {
            if (!charts.pie || !charts.bar || !charts.doughnut) return;

            // Update colors based on current theme
            const textColor = appData.theme === 'dark' ? '#a0a0a0' : '#6e6e73';
            Chart.defaults.color = textColor;

            // Category Pie Chart
            const categoryData = {};
            appData.categories.forEach(cat => {
                categoryData[cat] = appData.cards.filter(c => c.category === cat).length;
            });

            charts.pie.data.labels = Object.keys(categoryData);
            charts.pie.data.datasets[0].data = Object.values(categoryData);
            charts.pie.update();

            // Category Bar Chart
            charts.bar.data.labels = appData.categories;
            charts.bar.data.datasets[0].data = appData.categories.map(cat =>
                appData.cards.filter(c => c.category === cat && c.mastered).length
            );
            charts.bar.data.datasets[1].data = appData.categories.map(cat =>
                appData.cards.filter(c => c.category === cat && !c.mastered && c.reviewCount > 0).length
            );
            charts.bar.update();

            // Mastery Doughnut Chart
            const mastered = appData.cards.filter(c => c.mastered).length;
            const learning = appData.cards.filter(c => !c.mastered && c.reviewCount > 0).length;
            const newCards = appData.cards.filter(c => c.reviewCount === 0).length;

            charts.doughnut.data.datasets[0].data = [mastered, learning, newCards];
            charts.doughnut.update();
        }

        // Show Toast
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;

            const icon = type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ';
            toast.innerHTML = `
                <span style="font-weight: bold;">${icon}</span>
                <span>${message}</span>
            `;

            container.appendChild(toast);

            // Remove after 3 seconds
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s ease forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
