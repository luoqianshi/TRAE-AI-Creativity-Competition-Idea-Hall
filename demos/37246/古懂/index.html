<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古懂 - AI 古籍智能解读</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 手机模拟器外框 -->
    <div class="phone-wrapper">
        <div class="phone-frame">
            <!-- 顶部标题栏 -->
            <header class="app-header">
                <h1 class="app-title">古懂</h1>
                <p class="app-subtitle">AI 古籍智能解读</p>
            </header>

            <!-- Tab 导航 -->
            <nav class="tab-nav">
                <button class="tab-btn active" data-tab="tab1">📖 古籍解读</button>
                <button class="tab-btn" data-tab="tab2">🆕 古文今写</button>
                <button class="tab-btn" data-tab="tab3">📚 古籍库</button>
                <button class="tab-btn" data-tab="tab4">🏷️ 我的收藏</button>
            </nav>

            <!-- 主内容区域 -->
            <main class="main-content">
                <!-- Tab1: 古籍解读 -->
                <section id="tab1" class="tab-content active">
                    <div class="input-section">
                        <textarea id="inputText" placeholder="粘贴古文内容，或点击下方示例..." rows="3"></textarea>
                        <div class="example-buttons">
                            <button class="example-btn" data-text="学而时习之">试试点我：学而时习之</button>
                            <button class="example-btn" data-text="鱼我所欲也">鱼我所欲也</button>
                            <button class="example-btn" data-text="道可道非常道">道可道非常道</button>
                        </div>
                        <button id="analyzeBtn" class="primary-btn">解读</button>
                    </div>

                    <!-- 卷轴加载动画 -->
                    <div id="scrollAnimation" class="scroll-animation hidden">
                        <div class="scroll-container">
                            <div class="scroll-left"></div>
                            <div class="scroll-content">
                                <p id="loadingText" class="loading-text">正在翻阅《论语》…</p>
                            </div>
                            <div class="scroll-right"></div>
                        </div>
                    </div>

                    <!-- 解读结果 -->
                    <div id="resultCard" class="result-card hidden">
                        <div class="result-section">
                            <h3>📜 原文</h3>
                            <p id="originalText" class="original-text"></p>
                        </div>
                        <div class="result-section">
                            <h3>📝 逐句翻译</h3>
                            <p id="translationText"></p>
                        </div>
                        <div class="result-section">
                            <h3>🔍 重点字词注释</h3>
                            <div id="annotationsList" class="annotations-list"></div>
                        </div>
                        <div class="result-section">
                            <h3>📖 背景故事</h3>
                            <p id="backgroundText"></p>
                        </div>
                        <div class="result-section">
                            <h3>✨ 古文今写</h3>
                            <p id="modernText" class="modern-text"></p>
                        </div>
                        <div class="result-section">
                            <h3>🌍 现代人场景举例</h3>
                            <div id="scenariosList" class="scenarios-list"></div>
                        </div>
                        <button id="favoriteBtn" class="favorite-btn">⭐ 收藏</button>
                    </div>
                </section>

                <!-- Tab2: 古文今写 -->
                <section id="tab2" class="tab-content">
                    <div class="today-recommend">
                        <h3>📌 今日推荐</h3>
                        <div id="todayContent" class="today-content"></div>
                    </div>
                    <div class="input-section">
                        <textarea id="modernInput" placeholder="输入古文，我来用现代语言讲述..." rows="3"></textarea>
                        <button id="modernBtn" class="primary-btn">今写</button>
                    </div>
                    <!-- 笔墨书写动画 -->
                    <div id="writingAnimation" class="writing-animation hidden">
                        <p class="writing-text">AI 正在琢磨怎么讲这个故事…</p>
                        <div class="brush-strokes"></div>
                    </div>
                    <!-- 便签纸结果 -->
                    <div id="noteResult" class="note-result hidden">
                        <div class="note-paper">
                            <p id="noteContent" class="note-content"></p>
                            <p id="noteScenario" class="note-scenario"></p>
                        </div>
                    </div>
                </section>

                <!-- Tab3: 古籍库 -->
                <section id="tab3" class="tab-content">
                    <div id="booksList" class="books-list"></div>
                </section>

                <!-- Tab4: 我的收藏 -->
                <section id="tab4" class="tab-content">
                    <div class="favorites-header">
                        <h3>我的收藏</h3>
                        <span id="favoriteCount" class="favorite-count">0 条收藏</span>
                    </div>
                    <div id="favoritesList" class="favorites-list"></div>
                </section>
            </main>

            <!-- 底部 -->
            <footer class="app-footer">
                <p>由 TRAE 驱动</p>
            </footer>
        </div>
    </div>

    <!-- 注释弹窗 -->
    <div id="annotationPopup" class="annotation-popup hidden">
        <div class="popup-content">
            <p id="popupAnnotation"></p>
            <button class="close-popup" onclick="closeAnnotationPopup()">关闭</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
