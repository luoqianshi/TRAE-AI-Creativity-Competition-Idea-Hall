<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>越韵新声 · 非遗故事化讲解器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root {
    --cinnabar: #B8322C;
    --cinnabar-dark: #8B2420;
    --cinnabar-light: #D4503A;
    --ink: #1A1A1A;
    --ink-soft: #3D3D3D;
    --paper: #F5EFE3;
    --paper-warm: #EDE5D0;
    --paper-dark: #E5DCC5;
    --gold: #C9A961;
    --gold-light: #D4B878;
    --gold-dark: #A68B3F;
    --jade: #5B8C6A;
    --rose: #C77B8A;
    --shadow: rgba(184, 50, 44, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Serif SC', serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.8;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(ellipse at 15% 20%, rgba(199, 123, 138, 0.07) 0%, transparent 45%),
      radial-gradient(ellipse at 85% 80%, rgba(201, 169, 97, 0.08) 0%, transparent 45%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%231A1A1A' fill-opacity='1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1320px;
    margin: 0 auto;
    padding: 40px 32px 80px;
  }

  /* ====== 顶栏 ====== */
  .hero {
    text-align: center;
    padding: 40px 0 48px;
    opacity: 0;
    animation: fadeUp 1s ease forwards;
    animation-delay: 0.1s;
  }

  .hero-seal {
    display: inline-block;
    background: var(--cinnabar);
    color: var(--paper);
    padding: 6px 22px;
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 14px;
    letter-spacing: 5px;
    margin-bottom: 24px;
    position: relative;
    box-shadow: 2px 2px 0 var(--gold-dark);
  }

  .hero-seal::before,
  .hero-seal::after {
    content: '◆';
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 8px;
    color: var(--gold-light);
  }
  .hero-seal::before { left: 8px; }
  .hero-seal::after { right: 8px; }

  .hero h1 {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: clamp(52px, 9vw, 96px);
    font-weight: 400;
    color: var(--ink);
    letter-spacing: 14px;
    margin-bottom: 16px;
    position: relative;
    display: inline-block;
    text-shadow: 3px 3px 0 rgba(184, 50, 44, 0.1);
  }

  .hero h1 .accent {
    color: var(--cinnabar);
    position: relative;
    display: inline-block;
    animation: glow 3s ease-in-out infinite;
  }

  @keyframes glow {
    0%, 100% { text-shadow: 0 0 8px rgba(184, 50, 44, 0.3); }
    50% { text-shadow: 0 0 20px rgba(184, 50, 44, 0.5); }
  }

  .hero-subtitle {
    font-size: 20px;
    color: var(--ink-soft);
    letter-spacing: 8px;
    margin-bottom: 20px;
    font-family: 'ZCOOL XiaoWei', serif;
  }

  .hero-tagline {
    font-size: 15px;
    color: var(--cinnabar-dark);
    font-style: italic;
    letter-spacing: 3px;
    margin-top: 8px;
  }

  .decor-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin: 20px 0 24px;
  }
  .decor-line span {
    width: 80px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold-dark), transparent);
  }
  .decor-line i {
    color: var(--gold-dark);
    font-style: normal;
    font-size: 16px;
  }

  .hero-shadow-figures {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 20px;
    height: 100px;
    opacity: 0.85;
  }

  .hero-shadow-figures svg {
    height: 100%;
    animation: float 4s ease-in-out infinite;
  }
  .hero-shadow-figures svg:nth-child(2) { animation-delay: 0.5s; }
  .hero-shadow-figures svg:nth-child(3) { animation-delay: 1s; }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-6px) rotate(1deg); }
  }

  /* ====== 主内容区 ====== */
  .main-grid {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 48px;
    opacity: 0;
    animation: fadeUp 1s ease forwards;
    animation-delay: 0.3s;
  }

  .opera-list {
    position: sticky;
    top: 40px;
    align-self: start;
  }

  .opera-list-title {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 22px;
    color: var(--cinnabar);
    margin-bottom: 24px;
    padding-bottom: 14px;
    border-bottom: 2px solid var(--cinnabar);
    letter-spacing: 5px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .opera-list-title::before {
    content: '';
    display: inline-block;
    width: 5px;
    height: 22px;
    background: var(--cinnabar);
  }

  .opera-item {
    padding: 20px 22px;
    margin-bottom: 10px;
    background: var(--paper-warm);
    border-left: 4px solid transparent;
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }

  .opera-item::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(184, 50, 44, 0.1), transparent 70%);
    opacity: 0;
    transition: opacity 0.35s;
  }

  .opera-item:hover {
    border-left-color: var(--cinnabar);
    transform: translateX(6px);
    box-shadow: -4px 0 20px var(--shadow);
  }
  .opera-item:hover::before { opacity: 1; }

  .opera-item.active {
    background: linear-gradient(135deg, rgba(184, 50, 44, 0.15), transparent 70%);
    border-left-color: var(--cinnabar);
    transform: translateX(6px);
    box-shadow: -4px 0 20px var(--shadow);
  }
  .opera-item.active::before { opacity: 1; }

  .opera-item-name {
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
    position: relative;
    z-index: 1;
    margin-bottom: 4px;
  }

  .opera-item-meta {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 4px;
    letter-spacing: 1px;
    position: relative;
    z-index: 1;
  }

  .opera-item-tag {
    display: inline-block;
    font-size: 11px;
    padding: 3px 10px;
    background: var(--cinnabar);
    color: var(--paper);
    margin-right: 4px;
    margin-top: 10px;
    position: relative;
    z-index: 1;
    letter-spacing: 1px;
  }

  .display-area {
    min-height: 700px;
  }

  .display-card {
    background: rgba(255, 253, 247, 0.88);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(201, 169, 97, 0.35);
    padding: 52px 52px 60px;
    position: relative;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards;
    box-shadow: 0 8px 40px rgba(184, 50, 44, 0.06);
  }

  .display-card::before {
    content: '';
    position: absolute;
    top: 14px;
    left: 14px;
    right: 14px;
    bottom: 14px;
    border: 1px solid rgba(201, 169, 97, 0.5);
    pointer-events: none;
  }

  .corner-deco {
    position: absolute;
    width: 44px;
    height: 44px;
    border-color: var(--cinnabar);
  }
  .corner-deco.tl { top: 26px; left: 26px; border-top: 2px solid; border-left: 2px solid; }
  .corner-deco.tr { top: 26px; right: 26px; border-top: 2px solid; border-right: 2px solid; }
  .corner-deco.bl { bottom: 26px; left: 26px; border-bottom: 2px solid; border-left: 2px solid; }
  .corner-deco.br { bottom: 26px; right: 26px; border-bottom: 2px solid; border-right: 2px solid; }

  .opera-header {
    text-align: center;
    margin-bottom: 48px;
    padding-bottom: 32px;
    border-bottom: 1px dashed var(--gold);
    position: relative;
  }

  .opera-type {
    display: inline-block;
    font-size: 13px;
    color: var(--cinnabar);
    letter-spacing: 5px;
    margin-bottom: 14px;
    padding: 5px 20px;
    border: 1px solid var(--cinnabar);
    background: rgba(184, 50, 44, 0.05);
  }

  .opera-title {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 48px;
    font-weight: 400;
    color: var(--ink);
    letter-spacing: 10px;
    margin-bottom: 10px;
    position: relative;
  }

  .opera-origin {
    font-size: 14px;
    color: var(--ink-soft);
    letter-spacing: 3px;
  }

  .story-content p:first-child::first-letter {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 64px;
    float: left;
    line-height: 1;
    padding: 4px 12px 0 0;
    color: var(--cinnabar);
    font-weight: 400;
  }

  .section {
    margin-bottom: 48px;
  }

  .section-title {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 22px;
    font-weight: 700;
    color: var(--cinnabar);
    margin-bottom: 24px;
    letter-spacing: 4px;
    position: relative;
    padding-left: 4px;
  }

  .section-title-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    background: var(--cinnabar);
    color: var(--paper);
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 20px;
    box-shadow: 3px 3px 0 var(--gold);
  }

  .section-title-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, var(--gold), transparent);
    margin-left: 8px;
  }

  .story-content {
    font-size: 16px;
    line-height: 2.1;
    color: var(--ink);
    text-indent: 2em;
    text-align: justify;
    padding: 0 8px;
  }

  .story-content p {
    margin-bottom: 18px;
  }

  .story-highlight {
    color: var(--cinnabar);
    font-weight: 700;
    border-bottom: 1px dashed var(--cinnabar);
    padding-bottom: 1px;
  }

  .story-scene {
    display: block;
    text-align: center;
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 18px;
    color: var(--cinnabar-dark);
    letter-spacing: 4px;
    margin: 24px 0;
    text-indent: 0;
    position: relative;
  }
  .story-scene::before,
  .story-scene::after {
    content: '———';
    color: var(--gold);
    margin: 0 12px;
    letter-spacing: 0;
  }

  .character-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
  }

  .character-card {
    background: var(--paper-warm);
    padding: 24px 16px 20px;
    text-align: center;
    border-bottom: 4px solid var(--gold);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .character-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(to right, var(--cinnabar), var(--gold), var(--cinnabar));
    transform: scaleX(0);
    transition: transform 0.4s;
  }

  .character-card:hover {
    transform: translateY(-6px);
    border-bottom-color: var(--cinnabar);
    box-shadow: 0 12px 32px var(--shadow);
  }
  .character-card:hover::before { transform: scaleX(1); }

  .character-silhouette {
    width: 100%;
    height: 160px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .character-silhouette::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 12px;
    background: radial-gradient(ellipse, rgba(26, 26, 26, 0.15), transparent);
    border-radius: 50%;
  }

  .character-silhouette svg {
    height: 100%;
    width: auto;
    filter: drop-shadow(2px 4px 6px rgba(184, 50, 44, 0.2));
    transition: transform 0.4s ease;
  }

  .character-card:hover .character-silhouette svg {
    transform: scale(1.08) rotate(-1deg);
  }

  .character-name {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 22px;
    font-weight: 400;
    color: var(--ink);
    margin-bottom: 6px;
    letter-spacing: 3px;
  }

  .character-role {
    font-size: 13px;
    color: var(--cinnabar);
    margin-bottom: 10px;
    padding: 2px 12px;
    display: inline-block;
    border: 1px solid var(--cinnabar);
    letter-spacing: 1px;
  }

  .character-desc {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.7;
    padding: 0 4px;
  }

  .facts-list {
    list-style: none;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
  }

  .fact-item {
    display: flex;
    gap: 14px;
    padding: 20px;
    background: var(--paper-warm);
    border-bottom: 3px solid transparent;
    transition: all 0.35s;
    cursor: pointer;
    position: relative;
  }

  .fact-item:hover {
    border-bottom-color: var(--cinnabar);
    transform: translateY(-3px);
    box-shadow: 0 8px 24px var(--shadow);
  }

  .fact-num {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    background: var(--cinnabar);
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 18px;
    font-weight: 400;
    box-shadow: 2px 2px 0 var(--gold);
  }

  .fact-content {
    flex: 1;
  }

  .fact-title {
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 8px;
    font-size: 15px;
  }

  .fact-desc {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.8;
  }

  .craft-steps {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  .craft-step {
    flex: 1;
    min-width: 120px;
    text-align: center;
    padding: 20px 12px;
    background: linear-gradient(180deg, var(--paper-warm) 0%, var(--paper-dark) 100%);
    position: relative;
    transition: all 0.3s;
    cursor: pointer;
  }

  .craft-step:hover {
    transform: translateY(-4px);
    background: linear-gradient(180deg, rgba(184, 50, 44, 0.1) 0%, var(--paper-warm) 100%);
  }

  .craft-step-icon {
    width: 48px;
    height: 48px;
    margin: 0 auto 10px;
    background: var(--cinnabar);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--paper);
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 20px;
    box-shadow: 0 4px 12px var(--shadow);
  }

  .craft-step-name {
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 4px;
  }

  .craft-step-desc {
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  .craft-arrow {
    display: flex;
    align-items: center;
    color: var(--gold-dark);
    font-size: 20px;
    min-width: 20px;
    justify-content: center;
  }

  .quote-box {
    background: linear-gradient(135deg, rgba(184, 50, 44, 0.1), rgba(201, 169, 97, 0.08));
    border-left: 5px solid var(--cinnabar);
    padding: 36px 44px;
    position: relative;
    text-align: center;
  }

  .quote-mark {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 72px;
    color: var(--cinnabar);
    opacity: 0.15;
    position: absolute;
    top: 12px;
    left: 24px;
    line-height: 1;
  }

  .quote-mark.close {
    top: auto;
    bottom: 12px;
    left: auto;
    right: 24px;
    transform: rotate(180deg);
  }

  .quote-text {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 28px;
    color: var(--ink);
    letter-spacing: 5px;
    line-height: 2;
    position: relative;
    z-index: 1;
    font-weight: 400;
  }

  .quote-source {
    margin-top: 20px;
    font-size: 14px;
    color: var(--cinnabar-dark);
    letter-spacing: 3px;
  }

  .footer-info {
    text-align: center;
    margin-top: 64px;
    padding-top: 32px;
    border-top: 1px solid rgba(201, 169, 97, 0.4);
    opacity: 0;
    animation: fadeUp 1s ease forwards;
    animation-delay: 0.5s;
  }

  .footer-info p {
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 2px;
    margin-bottom: 10px;
  }

  .footer-info .brand {
    color: var(--cinnabar);
    font-weight: 700;
  }

  .tech-tag {
    display: inline-block;
    margin: 5px;
    padding: 5px 14px;
    font-size: 12px;
    background: var(--paper-warm);
    color: var(--ink-soft);
    border: 1px solid rgba(201, 169, 97, 0.5);
    letter-spacing: 1px;
    transition: all 0.3s;
  }

  .tech-tag:hover {
    background: var(--cinnabar);
    color: var(--paper);
    border-color: var(--cinnabar);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(28px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 960px) {
    .main-grid {
      grid-template-columns: 1fr;
    }
    .opera-list {
      position: static;
    }
    .display-card {
      padding: 36px 24px;
    }
    .opera-title {
      font-size: 36px;
      letter-spacing: 4px;
    }
    .facts-list {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 600px) {
    .container { padding: 24px 16px 60px; }
    .hero h1 { letter-spacing: 8px; }
    .hero-subtitle { letter-spacing: 4px; font-size: 16px; }
    .quote-text { font-size: 20px; letter-spacing: 3px; }
    .character-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<!-- SVG 越剧人物定义 -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- 祝英台（女装，粉色水袖） -->
    <symbol id="sil-zhuyingtai" viewBox="0 0 100 200">
      <g stroke="#1A1A1A" stroke-width="0.6">
        <!-- 头 -->
        <ellipse cx="50" cy="32" rx="16" ry="20" fill="#F5DCD0"/>
        <!-- 包头/凤冠 -->
        <path d="M30 18 Q50 4 70 18 L72 22 Q50 14 28 22 Z" fill="#C77B8A"/>
        <path d="M34 12 Q50 0 66 12 L64 18 Q50 10 36 18 Z" fill="#C9A961"/>
        <circle cx="50" cy="8" r="4" fill="#B8322C"/>
        <path d="M28 18 L26 26 L32 24 Z" fill="#C9A961"/>
        <path d="M72 18 L74 26 L68 24 Z" fill="#C9A961"/>
        <!-- 眉眼 -->
        <path d="M40 28 Q43 26 46 28" stroke="#1A1A1A" fill="none" stroke-width="1.2"/>
        <path d="M54 28 Q57 26 60 28" stroke="#1A1A1A" fill="none" stroke-width="1.2"/>
        <circle cx="43" cy="30" r="1.5" fill="#1A1A1A"/>
        <circle cx="57" cy="30" r="1.5" fill="#1A1A1A"/>
        <path d="M47 38 Q50 40 53 38" stroke="#B8322C" fill="none" stroke-width="1"/>
        <ellipse cx="50" cy="36" rx="2" ry="1" fill="#D4503A" opacity="0.4"/>
        <!-- 水袖上扬 -->
        <path d="M28 50 Q5 70 0 110 L10 112 Q15 80 36 56 Z" fill="#F5DCD0" opacity="0.85"/>
        <path d="M72 50 Q95 70 100 110 L90 112 Q85 80 64 56 Z" fill="#F5DCD0" opacity="0.85"/>
        <!-- 身子（对襟褙子） -->
        <path d="M30 50 L20 180 L80 180 L70 50 Q50 46 30 50 Z" fill="#C77B8A"/>
        <path d="M42 56 L40 175 L60 175 L58 56 Z" fill="#F5EFE3" opacity="0.4"/>
        <!-- 腰带 -->
        <path d="M28 90 L28 100 L72 100 L72 90 Z" fill="#C9A961"/>
        <circle cx="50" cy="95" r="4" fill="#B8322C"/>

        '祥林嫂心中惶恐，听信柳妈的话，去土地庙捐了一条门槛，说是替自己赎罪，让千人踏万人跨，便可洗清罪孽。她省吃俭用攒了一年工钱，换来一条柏木门槛，恭恭敬敬捐在庙前。',
        '是年冬祭，祥林嫂满怀欢喜，去取祭祀的器皿。鲁四老爷一声大喝：「<span class="story-highlight">祥林嫂，你放着罢！</span>」祥林嫂如遭雷击，站在原地不动——她明白，那条门槛白捐了，她依然是"不洁之人"。',
        '从那以后，祥林嫂的眼神渐渐黯淡了。她见人就说：「我真傻，真的。我单知道下雪的时候野兽在山坳里没有食吃，会到村里来；我不知道春天也会有……」起初人们还同情，后来听烦了，便厌烦她。再后来，连笑都懒得笑了。',
        '终于有一年冬天，鲁镇家家户户忙着"祝福"迎新年，鞭炮声声，红烛高照。祥林嫂却倒在雪地里，手里还攥着那只阿毛的小鞋。雪花纷纷扬扬，盖在她身上，渐渐看不出人形。',
        '后人有诗叹曰：「<span class="story-highlight">捐尽门槛赎不清，二婚寡妇罪何名。祝福声中死寒雪，鲁迅笔下最无情</span>。」越剧《祥林嫂》自1946年由袁雪芬首演，开越剧改革先河，让越剧从才子佳人走向现实人生，是中国戏曲史上的一座丰碑。'
      ],
      characters: [
        { name: '祥林嫂', role: '女主角 · 苦命寡妇', svg: 'sil-xianglinsao', desc: '卫家山童养媳，逃婚到鲁镇做工。二嫁贺老六，夫死子亡，再回鲁镇被嫌"晦气"。捐门槛赎罪不成，最终冻死雪夜' },
        { name: '贺老六', role: '第二任丈夫 · 山里汉子', svg: 'sil-helaoliu', desc: '深山猎户，老实憨厚。花钱娶了祥林嫂，待她不薄。生下阿毛后染伤寒病逝，留下祥林嫂孤儿寡母' },
        { name: '鲁四老爷', role: '地主 · 乡绅', svg: 'sil-lusilaoye', desc: '鲁镇乡绅，讲理学，讲礼教。嫌祥林嫂"二婚寡妇"晦气，不许她碰祭祀器皿。一句"你放着罢"，断了祥林嫂最后的精神支柱' },
        { name: '柳 妈', role: '佣人 · 善意害人', svg: 'sil-liuma', desc: '鲁家佣人，善谈鬼神。一番"伤风败俗要下地狱"的话，吓坏祥林嫂，劝她去捐门槛赎罪。本是好心，却害了祥林嫂' },
        { name: '阿 毛', role: '孩子 · 无辜者', svg: 'sil-amao', desc: '祥林嫂与贺老六之子，天真可爱。春天被狼叼走，只剩一只小鞋。他的死是祥林嫂一生的痛，也是她反复念叨的故事' }
      ],
      facts: [
        { title: '《祥林嫂》是越剧改革的标志？', desc: '1946年，袁雪芬主演的《祥林嫂》在上海首演，开越剧改编现代文学名著之先河。从此越剧不再只演才子佳人，开始关注现实人生，被誉为"新越剧"的里程碑。' },
        { title: '"祝福"是什么？', desc: '"祝福"是绍兴旧俗，年终祭祀天地神明、祈求来年福气的仪式。鲁迅以《祝福》为题，写祥林嫂在"祝福"声中冻死——别人祈福，她却死了，是讽刺也是悲悯。' },
        { title: '什么是越剧"袁派"？', desc: '袁派由袁雪芬创立，唱腔质朴醇厚，长于抒情。袁雪芬是越剧改革第一人，主张"清白做人，认真演戏"。她主演的《祥林嫂》《西厢记》《梁山伯与祝英台》都是越剧经典。' },
        { title: '"门槛"为什么能赎罪？', desc: '旧时迷信，认为寡妇再嫁是"伤风败俗"，死后会被阎王锯成两半分给两个丈夫。柳妈告诉祥林嫂：去土地庙捐一条门槛，让千人踏万人跨，便可"赎罪"。这是封建礼教对女性的双重迫害。' },
        { title: '越剧为什么能演鲁迅？', desc: '越剧风格婉约柔美，本不适合演鲁迅的冷峻。但越剧擅长"做功"——细腻的心理刻画、水袖身段表达内心挣扎，恰好能演绎祥林嫂的"无声之痛"。这种反差造就了越剧《祥林嫂》的独特魅力。' }

      craft: true,
      quote: '我真傻，真的。我单知道下雪的时候野兽会到村里来',
      quoteSource: '—— 祥林嫂 · 祝福'
    }
  ];

  const craftSteps = [
    { name: '吊嗓', icon: '嗓', desc: '每日清晨吊嗓练声，开嗓定型' },
    { name: '学唱', icon: '唱', desc: '依流派学唱腔，袁范傅徐王各成一家' },
    { name: '念白', icon: '念', desc: '嵊州官话念白，字正腔圆' },
    { name: '做功', icon: '做', desc: '身段眼神表情，细腻传神' },
    { name: '水袖', icon: '袖', desc: '抛接抖翻，三米水袖如行云流水' },
    { name: '贴片', icon: '妆', desc: '额头贴片子，勒头化妆' },
    { name: '扮戏', icon: '扮', desc: '穿戴戏服凤冠，正式登场' }
  ];

  const display = document.getElementById('display');

  function render(opera) {
    display.style.opacity = '0';
    setTimeout(() => {
      let craftHtml = '';
      if (opera.craft) {
        craftHtml = `
          <div class="section">
            <div class="section-title">
              <span class="section-title-icon">艺</span>
              越剧四功 · 七步登台
              <span class="section-title-line"></span>
            </div>
            <div class="craft-steps">
              ${craftSteps.map((s, i) => `
                <div class="craft-step">
                  <div class="craft-step-icon">${s.icon}</div>
                  <div class="craft-step-name">${i + 1}. ${s.name}</div>
                  <div class="craft-step-desc">${s.desc}</div>
                </div>
                ${i < craftSteps.length - 1 ? '<div class="craft-arrow">›</div>' : ''}
              `).join('')}
            </div>
          </div>
        `;
      }

      display.innerHTML = `
        <div class="display-card">
          <div class="corner-deco tl"></div>
          <div class="corner-deco tr"></div>
          <div class="corner-deco bl"></div>
          <div class="corner-deco br"></div>

          <div class="opera-header">
            <div class="opera-type">${opera.type}</div>
            <h2 class="opera-title">${opera.title}</h2>
            <div class="opera-origin">${opera.origin}</div>
          </div>

          <div class="section">
            <div class="section-title">
              <span class="section-title-icon">叙</span>
              故事讲解
              <span class="section-title-line"></span>
            </div>
            <div class="story-content">
              ${opera.story.map(p => '<p>' + p + '</p>').join('')}
            </div>
          </div>

          <div class="section">
            <div class="section-title">
              <span class="section-title-icon">谱</span>
              人物图谱
              <span class="section-title-line"></span>
            </div>
            <div class="character-grid">
              ${opera.characters.map(c => `
                <div class="character-card">
                  <div class="character-silhouette">
                    <svg viewBox="0 0 100 200"><use href="#${c.svg}"/></svg>
                  </div>
                  <div class="character-name">${c.name}</div>
                  <div class="character-role">${c.role}</div>
                  <div class="character-desc">${c.desc}</div>
                </div>
              `).join('')}
            </div>
          </div>

          ${craftHtml}

          <div class="section">
            <div class="section-title">
              <span class="section-title-icon">趣</span>
              非遗冷知识
              <span class="section-title-line"></span>
            </div>
            <ul class="facts-list">
              ${opera.facts.map((f, i) => `
                <li class="fact-item">
                  <div class="fact-num">${i + 1}</div>
                  <div class="fact-content">
                    <div class="fact-title">${f.title}</div>
                    <div class="fact-desc">${f.desc}</div>
                  </div>
                </li>
              `).join('')}
            </ul>
          </div>

          <div class="section">
            <div class="section-title">
              <span class="section-title-icon">句</span>
              金句流传
              <span class="section-title-line"></span>
            </div>
            <div class="quote-box">
              <div class="quote-mark">"</div>
              <div class="quote-mark close">"</div>
              <div class="quote-text">${opera.quote}</div>
              <div class="quote-source">${opera.quoteSource}</div>
            </div>
          </div>

        </div>
      `;
      display.style.animation = 'none';
      display.offsetHeight;
      display.style.animation = 'fadeUp 0.6s ease forwards';
    }, 250);
  }

  document.querySelectorAll('.opera-item').forEach((item, index) => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.opera-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      render(operas[index]);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  render(operas[0]);
</script>

</body>
</html>
