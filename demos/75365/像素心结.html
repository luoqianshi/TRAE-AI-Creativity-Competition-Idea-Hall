var bgmAudio=null;
var bgmFadeInterval=null;
function playBGM(){if(bgmAudio){try{bgmAudio.pause();}catch(e){}}
try{bgmAudio=new Audio(BGM_DATA_URI);bgmAudio.loop=true;bgmAudio.volume=0.35;bgmAudio.play().catch(function(){});}catch(e){}}
function stopBGM(fadeOut){if(!bgmAudio)return;if(fadeOut){if(bgmFadeInterval)clearInterval(bgmFadeInterval);
bgmFadeInterval=setInterval(function(){bgmAudio.volume=Math.max(0,bgmAudio.volume-0.02);if(bgmAudio.volume<=0){clearInterval(bgmFadeInterval);bgmAudio.pause();bgmAudio=null;}},100);}
else{bgmAudio.pause();bgmAudio=null;}}

var EmotionSystem={
  create: function(initial) {
    var s = {trust:initial.trust||50, defense:initial.defense||50, openness:initial.openness||50};
    return {
      state: s,
      applyChange: function(c) {
        if(c.trust) s.trust = Math.max(0, Math.min(100, s.trust + (c.trust||0)));
        if(c.defense) s.defense = Math.max(0, Math.min(100, s.defense + (c.defense||0)));
        if(c.openness) s.openness = Math.max(0, Math.min(100, s.openness + (c.openness||0)));
      },
      getState: function() { return {trust:s.trust, defense:s.defense, openness:s.openness}; },
      checkCondition: function(cond) {
        var m = String(cond).match(/^(\w+)([><=]+)(\d+)$/);
        if(!m) return false;
        var v = s[m[1]];
        if(v === undefined) return false;
        var n = parseInt(m[3]);
        switch(m[2]) {
          case '>': return v > n;
          case '<': return v < n;
          case '>=': return v >= n;
          case '<=': return v <= n;
          case '==': return v === n;
        }
        return false;
      }
    };
  }
};
var KeywordCollector={
  create: function() {
    var kw = {}, col = {};
    return {
      registerKeyword: function(id, text, cat) { kw[id] = {text:text, category:cat}; },
      collect: function(id) { if(kw[id]) col[id] = kw[id]; },
      getCollected: function() { return JSON.parse(JSON.stringify(col)); },
      reset: function() { col = {}; },
      getAll: function() { return JSON.parse(JSON.stringify(kw)); }
    };
  }
};
var DialogueManager={
  create: function(script) {
    return {
      script: script,
      currentNode: 'start',
      history: [],
      getCurrentNode: function() { return this.script.lines[this.currentNode] || null; },
      advanceTo: function(nid) { this.history.push(this.currentNode); this.currentNode = nid; },
      isAtEnd: function() { var n = this.getCurrentNode(); return n && n.next === 'end'; },
      isChoiceNode: function() { var n = this.getCurrentNode(); return n && n.choices && n.choices.length > 0; }
    };
  }
};

var STORY_INTROS={'001_difficulty':'末班地铁。车厢空荡荡的，冷白色灯光照在每一个疲惫的脸上。你的手机亮了。','001_healing':'便利店的自动门打开，暖光倾泻而出。关东煮的热气模糊了玻璃。','002_difficulty':'年夜饭桌上摆满了菜。筷子碰到碗碟的声音，比任何对话都响。','002_healing':'浴室的灯管发出嗡嗡声。镜子上蒙着雾。你终于可以不用笑了。','003_difficulty':'出租屋的灯泡又坏了。这是第三天。你盯着天花板，假装在看星星。','003_healing':'被子的重量刚刚好。像是整个世界都被挡在外面了。','004_difficulty':'会议室的空调很冷。PPT翻到第23页，你已经不记得自己什么时候开始走神的。','004_healing':'楼梯间的窗户开了一条缝，风灌进来。这里没有监控，没有信号，只有你。','005_difficulty':'咖啡馆的角落，雨打在窗户上。隔壁桌的情侣在吵架。你搅动着眼前的美式。','005_healing':'抽屉被拉开的声音。里面有一半是前男友的痕迹，一半是你假装遗忘的证据。','006_difficulty':'健身房的镜子里，你看到一个肌肉线条分明的陌生人。你认出了自己。','006_healing':'健身房的浴室。水蒸气弥漫。这里的镜子比训练区的更大。','007_difficulty':'凌晨两点，出租屋的天花板开始漏水。一滴一滴，像是有人在敲打时间。','007_healing':'旧书店的气味：灰尘、纸张、还有被遗忘的时间。','008_difficulty':'候诊大厅的白光让人无处藏身。叫号屏上的数字跳动，每一跳都像是倒计时。','008_healing':'医院厕所的镜子。灯管嗡嗡作响，像是心脏的节拍器。','009_difficulty':'周六的人民公园被太阳烤得发烫。树荫下密密麻麻排满了雨伞，每把伞下都撑着一张A4纸。','009_healing':'清晨的公园没有相亲角的热闹。只有几个遛狗的老人，和一条被露水打湿的长椅。','010_difficulty':'机场到达口的自动门开了又关，像你的人生——到了又没完全到。到达屏上的航班号不断跳动。','010_healing':'便利店的灯永远亮着。24小时不打烊，像这个城市唯一不会抛弃你的东西。','011_difficulty':'宠物医院的消毒水味道让你想起小时候住院。笼子里的猫在看你，眼神像在说：别怕。','011_healing':'清晨的公园，空气里有泥土和青草的味道。有人在遛狗，有人在做操。没有人问你今天怎么样。','012_difficulty':'理发店的镜子太多。每一面都照着你不同的角度，但都不是你想成为的那个。','012_healing':'旧书店的气味：灰尘、纸张、还有被遗忘的时间。书架是唯一不会评判你的地方。','013_difficulty':'餐厅等位区的椅子发出咯吱声。你接过号牌：47号。四十七。你伦敦宿舍的门牌号也是47。','013_healing':'抽屉被拉开的声音。行李箱里的东西还没拆——因为拆开就意味着承认回不去了。','014_difficulty':'年夜饭桌上摆满了菜。你妈给你夹了一块你不爱吃的红烧肉。你没有说不要。','014_healing':'浴室的灯管发出嗡嗡声。镜子上的雾气模糊了你的轮廓。你终于可以不用笑了。','015_difficulty':'出租屋的天花板有一条裂缝。你盯着它看了一个小时，假装在思考人生。','015_healing':'被子的重量刚刚好。像是整个世界都被挡在外面了。你闭上眼睛，世界安静了。','016_difficulty':'楼梯间的灯坏了两盏，只剩最后那一盏还在闪。你停在五楼，不想上去。','016_healing':'手机朋友圈刷到了老同学的消息。三十年前的工友发了张全家福，你看了三遍。','017_difficulty':'旧书店的门铃叮当作响。书架被分成了男性文学和女性文学两排。你站在中间的过道上。','017_healing':'清晨的公园，阳光从树叶间漏下来。没有人问你是什么性别。湖水映着天空。','018_difficulty':'宠物医院里弥漫着消毒水的味道。你的猫躺在检查台上，尾巴无力地垂着。','018_healing':'回到出租屋，床上还残留着猫的体温。枕头旁边有猫毛。你伸手摸了摸，又缩回来。','019_difficulty':'走廊的声控灯坏了，你摸黑走完最后二十米。钥匙插进锁孔的声音格外响亮。','019_healing':'便利店的自动门打开。深夜里只有你和收银员。货架上的东西整齐得让人安心。','02 class DialogueScene extends Phaser.Scene{constructor(){super('DialogueScene');}create(){var self=this;var charId=GameState.currentCharacterId;var sceneType=GameState.currentSceneType;
var ch=CHARACTER_REGISTRY[charId];var theme=ch.theme;var bgKey=SCENE_BG_MAP[charId+'_'+sceneType]||'subway_bg';
var scriptKey=charId+'_'+sceneType;var script=DIALOGUE_SCRIPTS[scriptKey]||{lines:{start:{text:'...',next:'end'}}};
GameState.dialogueManager=DialogueManager.create(script);self.cameras.main.setBackgroundColor(theme.bg);self.cameras.main.fadeIn(400);
self.add.image(320,120,bgKey).setDisplaySize(640,240);
var charImg=self.add.image(80,180,'char_'+charId).setScale(1.5).setAlpha(0.8);
var panelGfx=self.add.graphics();panelGfx.fillStyle(0x000000,0.85);panelGfx.fillRect(0,240,640,120);
panelGfx.lineStyle(1,parseInt(theme.primary.replace('#','0x')),0.5);panelGfx.lineBetween(20,242,620,242);
var speakerTxt=self.add.text(30,248,'',{fontFamily:'Zpix',fontSize:'12px',color:theme.speakerColor});
var dialogueTxt=self.add.text(30,268,'',{fontFamily:'Zpix',fontSize:'12px',color:'#e0e0e0',wordWrap:{width:580}});
var choiceContainer=self.add.container(0,0).setDepth(5);self.choiceContainer=choiceContainer;self.dialogueTxt=dialogueTxt;self.speakerTxt=speakerTxt;
var typeTimer=null;self.typeTimer=typeTimer;self.isTyping=false;self.fullDisplayText='';self.displayedText='';self.endNodePending=false;
self.showCurrentNode=function(){var node=GameState.dialogueManager.getCurrentNode();if(!node)return;
if(GameState.dialogueManager.isAtEnd()){if(node.text){self.typewrite(node.text);self.endNodePending=true;}else{self.finishScene();}return;}
speakerTxt.setText(ch.name);
if(node.speaker)speakerTxt.setText(node.speaker);
if(GameState.dialogueManager.isChoiceNode()){dialogueTxt.setText(node.text);self.showChoices(node.choices);}else{self.typewrite(node.text);}};
self.typewrite=function(text){self.fullDisplayText=text;self.displayedText='';self.isTyping=true;charIdx=0;
if(self.typeTimer)self.typeTimer.remove();
self.typeTimer=self.time.addEvent({delay:50,callback:function(){if(charIdx<self.fullDisplayText.length){self.displayedText+=self.fullDisplayText[charIdx];dialogueTxt.setText(self.displayedText);charIdx++;}else{self.isTyping=false;}},loop:true});};
self.showChoices=function(choices){if(self.typeTimer)self.typeTimer.remove();
choiceContainer.removeAll(true);var startY=250;choices.forEach(function(ch2,i){
var unlocked=!ch2.unlock||GameState.emotionSystem.checkCondition(ch2.unlock);
var choiceBg=self.add.graphics();choiceBg.fillStyle(unlocked?parseInt(theme.primary.replace('#','0x')):0x333333,0.6);choiceBg.fillRect(80,startY+i*28,480,24);
choiceBg.lineStyle(1,parseInt(theme.accent.replace('#','0x')),unlocked?0.8:0.3);choiceBg.strokeRect(80,startY+i*28,480,24);
var choiceText=self.add.text(100,startY+i*28+4,ch2.text+(unlocked?'':' [需解锁]'),{fontFamily:'Zpix',fontSize:'11px',color:unlocked?'#ffffff':'#666666'});

hitZone.on('pointerout',function(){choiceBg.clear();choiceBg.fillStyle(parseInt(theme.primary.replace('#','0x')),0.6);choiceBg.fillRect(80,startY+i*28,480,24);choiceBg.lineStyle(1,parseInt(theme.accent.replace('#','0x')),0.8);choiceBg.strokeRect(80,startY+i*28,480,24);});
hitZone.on('pointerdown',function(){self.selectChoice(ch2);});}
choiceContainer.add([choiceBg,choiceText,hitZone]);});};
self.selectChoice=function(choice){if(choice.emotion)GameState.emotionSystem.applyChange(choice.emotion);
if(choice.loopKey)trackCycleChoice(charId,choice.loopKey);if(choice.specialKey)GameState.specialChoices[charId]=choice.specialKey;
GameState.dialogueManager.advanceTo(choice.next);self.showCurrentNode();};
self.finishScene=function(){GameState.completedScenes[charId][sceneType]=true;
if(!GameState.savedEmotionState)GameState.savedEmotionState=GameState.emotionSystem.getState();
if(sceneType==='difficulty'&&checkHealingUnlock(charId)){self.scene.start('HealingIntroScene');}else{self.scene.start('EndingScene');}};

self.showCurrentNode();}}

var DIALOGUE_SCRIPTS={"001_difficulty":{"lines":{"start":{"text":"深夜11:47，末班地铁的灯光忽明忽暗。","next":"d1"},"d1":{"text":"车厢里只剩下你和对面那个戴着耳机的男人。","next":"d2"},"d2":{"text":"手机震动——是母亲的消息。","next":"interact1"},"interact1":{"text":"母亲的语音消息在深夜里显得格外刺耳。","choices":[{"text":"已读不回","next":"i1_a","emotion":{"defense":10},"loopKey":"ignore_mom"},{"text":"转文字不回复","next":"i1_b","emotion":{"defense":5}},{"text":"回复\"嗯\"","next":"i1_c","emotion":{"defense":-5,"trust":5}}]},"i1_a":{"text":"对话框安静了。你的心也是。","next":"i1_a2"},"i1_a2":{"text":"他把耳机摘下一只，似乎想说什么，又戴了回去。","next":"t1"},"i1_b":{"text":"屏幕上跳出一行字，你看了三遍，没有回复。","next":"i1_b2"},"i1_b2":{"text":"窗外的隧道灯光一条条掠过，像某种沉默的密码。","next":"t1"},"i1_c":{"text":"一个字的回复，在深夜里显得重若千斤。","next":"i1_c2"},"i1_c2":{"text":"他微微偏头，也许在看你。也许没有。","next":"t1"},"t1":{"text":"到站了又没到站，地铁在两个站之间停了一会儿。","next":"t2"},"t2":{"text":"对面的乘客不知什么时候睡着了，头一点一点地往下栽。","next":"interact2"},"interact2":{"text":"他的头快倒到你肩膀上了。","choices":[{"text":"不敢动","next":"i2_a","emotion":{"defense":5}},{"text":"迅速躲开","next":"i2_b","emotion":{"defense":8}},{"text":"让他靠","next":"i2_c","emotion":{"trust":10,"defense":-5}}]},"i2_a":{"text":"你僵在那里，连呼吸都放轻了。","next":"i2_a2"},"i2_a2":{"text":"这种小心翼翼，是你在别的地方学来的习惯。","next":"t3"},"i2_b":{"text":"你往旁边挪了挪，动作很轻，像在做亏心事。","next":"i2_b2"},"i2_b2":{"text":"他歪了一下，又靠回了自己的方向。你的座位宽了一寸。","next":"t3"},"i2_c":{"text":"你把肩膀稳住，尽量不让自己显得突兀。","next":"i2_c2"},"i2_c2":{"text":"他好像做了一个梦，眉头松了松。","next":"t3"},"t3":{"text":"车窗上映出你的脸，和对面座位上某件文化衫的倒影。","next":"t4"},"t4":{"text":"那件T恤上印着一行字，你努力辨认着。","next":"interact3"},"interact3":{"text":"玻璃倒影里，你隐约看清了那行字。","choices":[{"text":"这是谁？","next":"i3_a","emotion":{"openness":5}},{"text":"移开视线","next":"i3_b","emotion":{"defense":5}},{"text":"拍照发朋友圈","next":"i3_c","emotion":{"openness":10,"trust":5}}]},"i3_a":{"text":"你看清了——是一件乐队周边。你曾经也买过同款。","next":"i3_a2"},"i3_a2":{"text":"有些记忆就是这样，在你以为忘记的时候突然出现。","next":"cl1"},"i3_b":{"text":"窗外的黑暗像一面墙，你选择不去翻越。","next":"i3_b2"},"i3_b2":{"text":"但这面墙，其实很薄。","next":"cl1"},"i3_c":{"text":"你犹豫了一下，还是按下了快门。","next":"i3_c2"}, :5,"defense":-5}},{"text":"找充电宝","next":"i2_c","emotion":{"defense":5}}]},"i2_a":{"text":"你翻遍枕头下面，抽屉里，床头柜上。没有充电器。","next":"i2_a2"},"i2_a2":{"text":"世界忽然变得很大，大到你不认识。","next":"t3"},"i2_b":{"text":"你放下手机，发现没有它的世界，其实也还行。","next":"i2_b2"},"i2_b2":{"text":"至少没有人能在凌晨两点找到你。","next":"t3"},"i2_c":{"text":"你找到了充电宝，插上。手机屏幕亮了。","next":"i2_c2"},"i2_c2":{"text":"三十七条未读消息。你选择先充电，不选择先看。","next":"t3"},"t3":{"text":"隔壁传来炒菜的声音，油烟味从门缝里飘了进来。","next":"t4"},"t4":{"text":"你已经三天没正经吃过饭了。","next":"interact3"},"interact3":{"text":"隔壁的饭菜香让你肚子叫了一声。","choices":[{"text":"点外卖","next":"i3_a","emotion":{"defense":5}},{"text":"煮泡面","next":"i3_b","emotion":{"openness":5}},{"text":"敲门蹭饭","next":"i3_c","emotion":{"openness":10,"trust":10}}]},"i3_a":{"text":"你打开外卖APP，划了十分钟，关掉了。","next":"i3_a2"},"i3_a2":{"text":"选择困难不是因为选项多，而是因为什么都不想要。","next":"cl1"},"i3_b":{"text":"你烧了水，泡了一碗面。","next":"i3_b2"},"i3_b2":{"text":"热汤入胃的那一刻，你感觉身体里有什么东西解冻了。","next":"cl1"},"i3_c":{"text":"你走到隔壁门口，犹豫了三十秒，敲了门。","next":"i3_c2"},"i3_c2":{"text":"开门的是大姐：\"怎么了？\" \"你做的什么，好香。\" 她笑了。","next":"cl1"},"cl1":{"text":"吃完之后你躺回床上，被子还是那床被子。","next":"cl2"},"cl2":{"text":"但你好像比刚才暖了一点。也许是因为胃里有东西了。","next":"end_n"},"end_n":{"text":"有时候，活着就是一碗泡面的距离。","next":"end"}}},"004_difficulty":{"lines":{"start":{"text":"会议室的空调开得很足，冷得像冬天。","next":"d1"},"d1":{"text":"你坐在角落的位置，这是你来这个公司三年养成的习惯。","next":"d2"},"d2":{"text":"领导开始说话了。","next":"interact1"},"interact1":{"text":"\"这个方案谁记录一下？\" 领导的目光扫过全场。","choices":[{"text":"沉默服从","next":"i1_a","emotion":{"defense":10},"loopKey":"silent_obey"},{"text":"我正在思考","next":"i1_b","emotion":{"openness":10,"defense":5}},{"text":"为什么总是我？","next":"i1_c","emotion":{"openness":15,"defense":-5}}]},"i1_a":{"text":"你打开了文档，开始打字。手指在键盘上很熟练。","next":"i1_a2"},"i1_a2":{"text":"你是全组记录最快的人。因为沉默的人总是最细心的。","next":"t1"},"i1_b":{"text":"领导愣了一下。\"思考？有什么想法说出来。\"","next":"i1_b2"},"i1_b2":{"text":"你张了张嘴，但声音没有出来。只是打了一行字在文档里。","next":"t1"},"i1_c":{"text":"会议室安静了三秒。领导皱了皱眉。","next":"i1_c2"},"i1_c2":{"text":"\"行，小王你记。\" 你不是小王，但没有人纠正。","next":"t1"},"t1":{"text":"同事在做汇报。PPT上写着你的方案。","next":"t2"},"t2":{"text":"领导说\"做得不错\"。同事笑着说\"谢谢\"。","next":"interact2"},"interact2":{"text":"那个方案，每一个字都是你写的。","choices":[{"text":"微笑","next":"i2_a","emotion":{"defense":10}},{"text":"那是我的","next":"i2_b","emotion":{"openness":15,"defense":5}},{"text":"去厕所","next":"i2_c","emotion":{"defense":5}}]},"i2_a":{"text":"你笑了笑。这个笑已经练了三年，比真笑还像。","next":"i2_a2"},"i2_a2":{"text":"会后同事请你喝了杯咖啡，说\"辛苦了\"。你说是。","next":"t3"},"i2_b":{"text":"你站起来，声音比预期大：\"这部分核心策略是我设计的。\"","next":"i2_b2"},"i2_b2":{"text":"领导看了你一眼。同事的脸僵了一下。你坐了下来。","next":"t3"},"i2_c":{"text":"你起身去了厕所，在隔间里坐了十五分钟。","next":"i2_c2"},"i2_c2":{"text":"出来的时候，会议已经结束。PPT被保存了，作者栏写着别人的名字。","next":"t3"},"t3":{"text":"下午又开会。翻页笔没电了。","next":"t4"},"t4":{"text":"领导的手在空中比划，PPT停在第三页。","next":"interact3"},"interact3":{"text":"翻页笔没电了，全场在等你解决这个问题。","choices":[{"text":"借同事的","next":"i3_a","emotion":{"defense":5}},{"text":"用手比划","next":"i3_b","emotion":{"openness":10}},{"text":"让会议结束","next":"i3_c","emotion":{"openness":10,"defense":5}}]},"i3_a":{"text":"你从口袋里掏出了自己的充电翻页笔。","next":"i3_a2"},"i3_a2":{"text":"\"给。\" 你没有看领导，也没有看同事。只是递了过去。","next":"cl1"},"i3_b":{"text":"你站起来，走到屏幕前，用手指着：\"翻到下一页有人吗？\"","next":"i3_b2"},"i3_b2":{"text":"全场的目光从PPT转移到了你身上。你忽然觉得自己很高。","next":"cl1"},"i3_c":{"text":"\"要不今天先到这里？\" 没有人说话，但也没有人反对。","next":"i3_c2"},"i3_c2":{"text":"散会的时候，你听见有人小声说\"终于\"。","next":"cl1"},"cl1":{"text":"你走出会议室，走廊的窗户开着，夏天的风吹进来。","next":"cl2"},"cl2":{"text":"你深吸一口气。楼梯间的门就在不远处。","next":"end_n"},"end_n":{"text":"愤怒不是因为力量不够，是因为出口被堵住了。","next":"end"}}},"004_healing":{"lines":{"start":{"text":"楼梯间是这栋楼里唯一安静的地方。","next":"d1"},"d1":{"text":"保洁阿姨坐在台阶上，手里夹着一根烟。","next":"d2"},"d2":{"text":"她看见你，没有躲。你看见她，也没有走。","next":"interact1"},"interact1":{"text":"阿姨吐出一口烟，眯着眼看你。","choices":[{"text":"举报","next":"i1_a","emotion":{"defense":10}},{"text":"借火","next":"i1_b","emotion":{"openness":10,"trust":10}},{"text":"沉默","next":"i1_c","emotion":{"trust":5}}]},"i1_a":{"text":"你在心里想了想，算了。有些规矩，不是用来执行的。","next":"i1_a2"},"i1_a2":{"text":"你只是走过去，什么都没说。","next" ]},"i2_a":{"text":"……","next":"t2"},"i2_b":{"text":"……","next":"t2"},"i2_c":{"text":"……","next":"t2"},"t2":{"text":"天花板在漏水。一滴一滴，落在床脚的盆里。","next":"interact3"},"interact3":{"text":"天花板传来滴水声。一开始你以为是雨。然后你记起来这是顶层。","choices":[{"text":"报修","next":"i3_a","emotion":{"defense":5}},{"text":"接盆","next":"i3_b","emotion":{"defense":5}},{"text":"欣赏","next":"i3_c","emotion":{"openness":15,"trust":10},"specialKey":"appreciated"}]},"i3_a":{"text":"……","next":"cl1"},"i3_b":{"text":"……","next":"cl1"},"i3_c":{"text":"……","next":"cl1"},"cl1":{"text":"你闭上了眼睛。也许明天会修好天花板。也许不会。","next":"cl2"},"cl2":{"text":"躺平不是放弃。是找到了自己的频率。","next":"end_n"},"end_n":{"next":"end"}}},"007_healing":{"lines":{"start":{"text":"巷子尽头的旧书店，招牌掉了一半。","next":"d1"},"d1":{"text":"\"旧时光书屋\"——你每次经过都会看一眼。","next":"interact1"},"interact1":{"text":"今天你推开了那扇门。铃铛响了一声。","choices":[{"text":"卖掉","next":"i1_a","emotion":{"defense":5}},{"text":"阅读","next":"i1_b","emotion":{"openness":10,"trust":5}},{"text":"当书签","next":"i1_c","emotion":{"openness":5}}]},"i1_a":{"text":"……","next":"t1"},"i1_b":{"text":"……","next":"t1"},"i1_c":{"text":"……","next":"t1"},"t1":{"text":"书店老板从柜台后面探出头来。","next":"interact2"},"interact2":{"text":"\"找什么呢？\" 老板的语气像在问天气。","choices":[{"text":"找自己","next":"i2_a","emotion":{"openness":15,"trust":10}},{"text":"随便看看","next":"i2_b","emotion":{"defense":5}},{"text":"我不找","next":"i2_c","emotion":{"trust":5,"openness":10}}]},"i2_a":{"text":"……","next":"t2"},"i2_b":{"text":"……","next":"t2"},"i2_c":{"text":"……","next":"t2"},"t2":{"text":"这排书在旧书店里显得格格不入。","next":"interact3"},"interact3":{"text":"书架最上面，有一排成功学书籍。金色封面，烫金字体。","choices":[{"text":"嘲笑","next":"i3_a","emotion":{"openness":5}},{"text":"阅读","next":"i3_b","emotion":{"defense":5}},{"text":"移动","next":"i3_c","emotion":{"openness":15,"trust":5}}]},"i3_a":{"text":"……","next":"cl1"},"i3_b":{"text":"……","next":"cl1"},"i3_c":{"text":"……","next":"cl1"},"cl1":{"text":"巷子里的路灯亮了，你踩着自己的影子往回走。","next":"cl2"},"cl2":{"text":"你什么都没买。但你带走了一个念头——也许不找，也是一种找到。","next":"end_n"},"end_n":{"next":"end"}}},"008_difficulty":{"lines":{"start":{"text":"医院候诊区的白光刺眼。","next":"d1"},"d1":{"text":"雪在外面飘，你在里面等。叫号屏上的数字跳得很慢。","next":"interact1"},"interact1":{"text":"\"前面还有15人。\" 你看了看手机，又放下了。","choices":[{"text":"继续工作","next":"i1_a","emotion":{"defense":10}},{"text":"闭眼休息","next":"i1_b","emotion":{"trust":10,"defense":-5},"specialKey":"rested"},{"text":"去楼梯间","next":"i1_c","emotion":{"openness":5}}]},"i1_a":{"text":"……","next":"t1"},"i1_b":{"text":"……","next":"t1"},"i1_c":{"text":"……","next":"t1"},"t1":{"text":"旁边座位的大姐凑过来。","next":"interact2"},"interact2":{"text":"\"姑娘，你什么病啊？看你坐了好久了。\"","choices":[{"text":"详细解释","next":"i2_a","emotion":{"defense":5}},{"text":"小毛病","next":"i2_b","emotion":{"defense":5}},{"text":"您呢？","next":"i2_c","emotion":{"openness":5,"trust":5}}]},"i2_a":{"text":"……","next":"t2"},"i2_b":{"text":"……","next":"t2"},"i2_c":{"text":"……","next":"t2"},"t2":{"text":"虽然还没叫到你，但你的名字已经在脑子里响了。","next":"interact3"},"interact3":{"text":"叫号屏跳了。\"请XXX到三号诊室。\" 不是你。但你心跳加速了。","choices":[{"text":"紧张","next":"i3_a","emotion":{"defense":10}},{"text":"松了一口气","next":"i3_b","emotion":{"trust":5}},{"text":"假装没听见","next":"i3_c","emotion":{"defense":5}}]},"i3_a":{"text":"……","next":"cl1"},"i3_b":{"text":"……","next":"cl1"},"i3_c":{"text":"……","next":"cl1"},"cl1":{"text":"你把外套裹紧了。走廊尽头的厕所灯在闪。","next":"cl2"},"cl2":{"text":"在医院里，等待是一种治疗。但副作用很大。","next":"end_n"},"end_n":{"next":"end"}}},"008_healing":{"lines":{"start":{"text":"医院洗手间的灯很白，白得像手术室。","next":"d1"},"d1":{"text":"你洗了手，抬头看镜子。镜子上有雾气。","next":"interact1"},"interact1":{"text":"医院的热水总是很烫，雾气很快就爬满了镜面。","choices":[{"text":"擦掉","next":"i1_a","emotion":{"trust":5}},{"text":"画笑脸","next":"i1_b","emotion":{"openness":10}},{"text":"写\"对不起\"","next":"i1_c","emotion":{"defense":10}}]},"i1_a":{"text":"……","next":"t1"},"i1_b":{"text":"……","next":"t1"},"i1_c":{"text":"……","next":"t1"},"t1":{"text":"洗手台上有一个药盒。不知道谁留下的。你认出了那个药名。","next":"interact2"},"interact2":{"text":"药盒就在水龙头旁边。","choices":[{"text":"数药片","next":"i2_a","emotion":{"defense":5}},{"text":"扔掉过期药","next":"i2_b","emotion":{"openness":5}},{"text":"拍照设提醒","next":"i2_c","emotion":{"trust":5,"openness":5}}]},"i2_a":{"text":"……","next":"t2"},"i2_b":{"text":"……","next":"t2"},"i2_c":{"text":"……","next":"t2"},"t2":{"text":"或者那不是心跳。是医院设备的声音。你分不清了。","next":"interact3"},"interact3":{"text":"洗手间很安静。你听见了自己的心跳声。","choices":[{"text":"加速","next":"i3_a","emotion":{"defense":10}},{"text":"深呼吸","next":"i3_b","emotion":{"trust":10,"defense":-10}},{"text":"哭泣","next":"i3_c","emotion":{"trust":10,"openness":5}}]},"i3_a":{"text":"……","next":"cl1"},"i3_b":{"text":"……","next":"cl1"},"i3_c":{"text":"……","next":"cl1"},"cl1":{"text":"你推开洗手间的门，走廊里有人在叫号。也许是你的名字。","next":"cl2"},"cl2":{"text":"身体不是叛徒。它一直在说，只是你以前没有听。","next":"end_n"},"end_n":{"next":"end"}}},'009_difficulty':{lines:{'start':{text:'场景开始。你深吸一口气，准备面对这一切。',next:'d1'},'d1':{text:'周围的一切都很熟悉，又很陌生。你不确定自己属于这里。',next:'d2'},'d2':{text:'手机震了一下。你犹豫着要不要看。',next:'interact1'},'interact1':{text:'屏幕亮着，一条消息等着你回复。',choices:[{text:'已读不回',next:'i1_a',emotion:{defense:5}},{text:'认真回复',next:'i1_b',emotion:{trust:5,defense:-5}},{text:'关掉屏幕',next:'i1_c',emotion:{defense:8}}]},'i1_a':{text:'对话框安静了。你的心也是。',next:'t1'},'i1_b':{text:'你回了几个字。不多，但够了。',next:'t1'},'i1_c':{text:'屏幕暗下去。世界好像也跟着暗了一点。',next:'t1'},'t1':{text:'远处传来一阵声响。你抬起头。',next:'interact2'},'interact2':{text:'有人走近了。你下意识地调整了一下表情。',choices:[{text:'微笑应对',next:'i2_a',emotion:{defense:5},loopKey:'auto_smile'},{text:'保持平静',next:'i2_b',emotion:{openness:5}},{text:'自然反应',next:'i2_c',emotion:{trust:5,openness:3}}]},'i2_a':{text:'微笑是你最熟练的表情。你甚至分不清真假了。',next:'t2'},'i2_b':{text:'对面的人愣了一下，然后也放松了表情。',next:'t2'},'i2_c':{text:'你们的目光碰了一下，又各自移开。',next:'t2'},'t2':{text:'时间在流逝。你感到了一种说不清的压力。',next:'interact3'},'interact3':{text:'又到了一个需要做选择的时刻。',choices:[{text:'逃避',next:'i3_a',emotion:{defense:8}},{text:'面对',next:'i3_b',emotion:{openness:8,trust:5}},{text:'观察',next:'i3_c',emotion:{trust:3,openness:5}}]},'i3_a':{text:'你转身走了。背后什么声音都没有。',next:'cl1'},'i3_b':{text:'你深吸一口气，走上了前。心跳很快，但脚步没有停。',next:'cl1'},'i3_c':{text:'你站在原地，看着一切发生。有时候旁观也是一种勇气。',next:'cl1'},'cl1':{text:'场景渐渐安静下来。',next:'cl2'},'cl2':{text:'你知道今天结束了。但明天还会再来。',next:'end_n'},'end_n':{text:'你低下头，发现手心出了一层薄汗。',next:'end'}}},'009_healing':{lines:{'start':{text:'你来到了一个新的地方。空气不一样了。',next:'d1'},'d1':{text:'这里没有人在看你。你终于可以不用表演了。',next:'interact1'},'interact1':{text:'一阵微风吹过来，带着一丝暖意。',choices:[{text:'闭上眼睛',next:'i1_a',emotion:{trust:5,defense:-5}},{text:'环顾四周',next:'i1_b',emotion:{openness:5}},{text:'发呆',next:'i1_c',emotion:{defense:5}}]},'i1_a':{text:'闭上眼睛的时候，世界变得很安静。你听见了自己的呼吸。',next:'t1'},'i1_b':{text:'你看到了一些以前没注意到的东西。光线、灰尘、还有角落里的安静。',next:'t1'},'i1_c':{text:'发呆也是一种休息。你允许自己停下来。',next:'t1'},'t1':{text:'时间在这里变慢了。你第一次感受到了时间的存在。',next:'interact2'},'interact2':{text:'你看到了什么让你触动的东西。',choices:[{text:'走近看',next:'i2_a',emotion:{trust:8,openness:5}},{text:'拍照',next:'i2_b',emotion:{openness:5}},{text:'走开',next:'i2_c',emotion:{defense:5}}]},'i2_a':{text:'你走近了一些。那个东西比你想象的更有意义。',next:'t2'},'i2_b':{text:'你存下了这张照片。不是为了发朋友圈，是为了自己。',next:'t2'},'i2_c':{text:'你走开了。但你回头看了一眼。',next:'t2'},'t2':{text:'你做了一个以前不会做的决定。',next:'interact3'},'interact3':{text:'一个声音在问你——你还好吗？',choices:[{text:'说实话',next:'i3_a',emotion:{trust:10,defense:-8}},{text:'还好',next:'i3_b',emotion:{defense:5}},{text:'沉默',next:'i3_c',emotion:{trust:3}}]},'i3_a':{text:'你说了实话。声音在颤抖，但你说了。说出来之后，天空好像亮了一点。',next:'cl1'},'i3_b':{text:'还好——这两个字你说了太多次了。但今天，你几乎相信了。',next:'cl1'},'i3_c':{text:'沉默也是一种回答。对方似乎懂了。',next:'cl1'},'cl1':{text:'你感觉到有什么东西在变化。很慢，但确实在变。',next:'cl2'},'cl2':{text:'也许治愈不是一瞬间的事。但此刻，你比刚才好了一点点。',next:'end_n'},'end_n':{text:'你抬起头。天还没有完全黑。',next:'end'}}},'010_difficulty':{lines:{'start':{text:'自习室的日光灯嗡嗡作响。你面前摊着第五本考研英语。',next:'d1'},'d1':{text:'书页上的笔记有些是三年前写的。三年了。',next:'d2'},'d2':{text:'手机亮了。研友群——"今年大纲又改了。"',next:'interact1'},'interact1':{text:'三年。每年大纲都在提醒你：去年可能白准备了。',choices:[{text:'看看变化',next:'i1_a',emotion:{openness: 5, trust: 3}},{text:'关掉手机',next:'i1_b',emotion:{defense: 8}},{text:'群内回"没事"',next:'i1_c',emotion:{defense: 5, loopKey: 'brave'}}]},'i1_a':{text:'多了两章。三年累计新增十
