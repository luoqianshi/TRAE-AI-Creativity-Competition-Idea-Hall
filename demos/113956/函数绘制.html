<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>函数绘图器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-grad-1: #eef2ff;
            --bg-grad-2: #f8faff;
            --bg-grad-3: #ffffff;
            --grid-minor: rgba(0,0,0,0.04);
            --grid-major: rgba(0,0,0,0.07);
            --axis: #475569;
            --axis-label: #64748b;
            --origin-dot: #3B82F6;
            --panel-bg: rgba(255,255,255,0.72);
            --panel-border: rgba(255,255,255,0.4);
            --panel-text: #1e293b;
            --panel-text-sec: #334155;
            --panel-input-bg: rgba(255,255,255,0.8);
            --panel-input-border: #e2e8f0;
            --panel-input-focus: #3B82F6;
            --focus-shadow: rgba(59,130,246,0.15);
            --error-color: #EF4444;
            --error-shadow: rgba(239,68,68,0.15);
            --toolbar-bg: rgba(255,255,255,0.75);
            --toolbar-text: #475569;
            --toolbar-btn-hover: rgba(255,255,255,0.95);
            --toolbar-btn-shadow: rgba(0,0,0,0.06);
            --coord-bg: rgba(255,255,255,0.75);
            --coord-text: #475569;
            --coord-border: rgba(255,255,255,0.4);
            --label-bg: rgba(255,255,255,0.9);
            --label-shadow: rgba(0,0,0,0.1);
            --divider: rgba(0,0,0,0.06);
            --item-hover: rgba(59,130,246,0.06);
            --btn-hover-bg: rgba(0,0,0,0.05);
            --btn-hover-bg2: rgba(0,0,0,0.1);
            --placeholder: #94a3b8;
            --scrollbar: rgba(0,0,0,0.1);
            --trace-inner: #ffffff;
        }
        body.dark {
            --bg-grad-1: #0f172a;
            --bg-grad-2: #1e293b;
            --bg-grad-3: #0f172a;
            --grid-minor: rgba(255,255,255,0.04);
            --grid-major: rgba(255,255,255,0.08);
            --axis: rgba(255,255,255,0.5);
            --axis-label: rgba(255,255,255,0.45);
            --origin-dot: #3B82F6;
            --panel-bg: rgba(30,41,59,0.85);
            --panel-border: rgba(255,255,255,0.1);
            --panel-text: #f1f5f9;
            --panel-text-sec: #cbd5e1;
            --panel-input-bg: rgba(15,23,42,0.6);
            --panel-input-border: rgba(255,255,255,0.15);
            --panel-input-focus: #60A5FA;
            --focus-shadow: rgba(96,165,250,0.2);
            --error-color: #F87171;
            --error-shadow: rgba(248,113,113,0.2);
            --toolbar-bg: rgba(30,41,59,0.85);
            --toolbar-text: #cbd5e1;
            --toolbar-btn-hover: rgba(51,65,85,0.95);
            --toolbar-btn-shadow: rgba(0,0,0,0.3);
            --coord-bg: rgba(30,41,59,0.85);
            --coord-text: #cbd5e1;
            --coord-border: rgba(255,255,255,0.1);
            --label-bg: rgba(15,23,42,0.85);
            --label-shadow: rgba(0,0,0,0.4);
            --divider: rgba(255,255,255,0.08);
            --item-hover: rgba(96,165,250,0.1);
            --btn-hover-bg: rgba(255,255,255,0.1);
            --btn-hover-bg2: rgba(255,255,255,0.15);
            --placeholder: rgba(148,163,184,0.5);
            --scrollbar: rgba(255,255,255,0.15);
            --trace-inner: #0f172a;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            cursor: grab;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            transition: background-color 0.25s ease;
        }

        body.grabbing {
            cursor: grabbing !important;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: radial-gradient(ellipse at 30% 20%, var(--bg-grad-1) 0%, var(--bg-grad-2) 50%, var(--bg-grad-3) 100%);
            transition: background 0.3s ease;
        }

        #plotCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }

        #expressionPanel {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 320px;
            max-height: calc(100vh - 40px);
            overflow: hidden;
            background: var(--panel-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-radius: 16px;
            border: 1px solid var(--panel-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
            padding: 24px 20px;
            z-index: 10;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.25s ease, border-color 0.25s ease;
        }

        #expressionPanel h2 {
            margin: 0 0 12px 0;
            font-size: 18px;
            font-weight: 600;
            color: var(--panel-text);
            padding-right: 40px;
        }

        .panel-divider {
            height: 1px;
            background: var(--divider);
            margin-bottom: 12px;
        }

        #exprInput {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--panel-input-border);
            border-radius: 10px;
            font-size: 15px;
            background: var(--panel-input-bg);
            color: var(--panel-text);
            outline: none;
            box-sizing: border-box;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        #exprInput::placeholder {
            color: var(--placeholder);
        }

        #exprInput:focus {
            border-color: var(--panel-input-focus);
            box-shadow: 0 0 0 3px var(--focus-shadow);
        }

        #exprInput.error {
            border-color: var(--error-color) !important;
            box-shadow: 0 0 0 3px var(--error-shadow) !important;
        }

        #exprInput.error.shake {
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        #errorMsg {
            color: var(--error-color);
            font-size: 12px;
            margin-top: 6px;
            min-height: 16px;
            padding-left: 2px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        #errorMsg.visible {
            opacity: 1;
        }

        #exprList {
            max-height: calc(100vh - 200px);
            overflow-y: auto;
            margin-top: 8px;
        }

        #exprList::-webkit-scrollbar {
            width: 4px;
        }

        #exprList::-webkit-scrollbar-thumb {
            background: var(--scrollbar);
            border-radius: 2px;
        }

        .expr-item {
            display: flex;
            align-items: center;
            height: 40px;
            gap: 8px;
            border-radius: 8px;
            padding: 0 8px;
            transition: background 0.15s;
            cursor: default;
        }

        .expr-item:hover {
            background: var(--item-hover);
        }

        .expr-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .expr-text {
            font-size: 14px;
            color: var(--panel-text-sec);
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .expr-btn {
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 6px;
            opacity: 0.5;
            font-size: 14px;
            transition: opacity 0.15s, background 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--coord-text);
        }

        .expr-btn:hover {
            opacity: 1;
            background: var(--btn-hover-bg);
        }

        .expr-btn.hidden {
            opacity: 0.3;
        }

        .expr-btn.delete {
            color: var(--error-color);
        }

        .expr-btn.delete:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .expr-item.fade-in {
            animation: fadeIn 0.2s ease-out;
        }

        .empty-hint {
            text-align: center;
            color: var(--panel-text-sec);
            opacity: 0.5;
            padding: 40px 0;
            font-size: 14px;
            pointer-events: none;
        }

        #toolbar {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }

        #toolbar button {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--toolbar-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 4px 12px var(--toolbar-btn-shadow);
            border: 1px solid var(--coord-border);
            font-size: 18px;
            cursor: pointer;
            color: var(--toolbar-text);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease, background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }

        #toolbar button:hover {
            background: var(--toolbar-btn-hover);
            transform: scale(1.08);
        }

        #toolbar button:active {
            transform: scale(0.92);
        }

        #coordDisplay {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--coord-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 10px;
            padding: 10px 16px;
            border: 1px solid var(--coord-border);
            box-shadow: 0 4px 12px var(--toolbar-btn-shadow);
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            color: var(--coord-text);
            z-index: 10;
            transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
        }

        body.panel-collapsed #expressionPanel {
            transform: translateX(calc(-100% - 30px));
        }

        #panelToggle {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: var(--btn-hover-bg);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--coord-text);
            transition: all 0.15s;
            z-index: 11;
            font-family: system-ui, sans-serif;
        }
        #panelToggle:hover {
            background: var(--btn-hover-bg2);
        }

        #panelExpand {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--toolbar-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 4px 12px var(--toolbar-btn-shadow);
            border: 1px solid var(--coord-border);
            font-size: 18px;
            cursor: pointer;
            color: var(--toolbar-text);
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease, background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
            z-index: 10;
        }
        #panelExpand:hover {
            background: var(--toolbar-btn-hover);
            transform: scale(1.08);
        }
        body.panel-collapsed #panelExpand {
            display: flex;
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <canvas id="plotCanvas"></canvas>
    
    <div id="expressionPanel">
        <button id="panelToggle" title="收起面板">«</button>
        <h2>函数表达式</h2>
        <div class="panel-divider"></div>
        <input id="exprInput" type="text" placeholder="输入函数，如 y = x^2">
        <div id="errorMsg"></div>
        <div id="exprList"></div>
    </div>
    <button id="panelExpand" title="展开面板">»</button>

    <div id="toolbar">
        <button id="resetBtn" title="重置视图">⌂</button>
        <button id="zoomInBtn" title="放大">+</button>
        <button id="zoomOutBtn" title="缩小">−</button>
        <button id="themeToggle" title="切换深色模式">☾</button>
    </div>

    <div id="coordDisplay">x: 0.00, y: 0.00</div>

    <script>
        const canvas = document.getElementById('plotCanvas');
        const ctx = canvas.getContext('2d');
        const exprInput = document.getElementById('exprInput');
        const exprList = document.getElementById('exprList');
        const errorMsg = document.getElementById('errorMsg');
        let dpr = window.devicePixelRatio || 1;
        let isInitialized = false;
        let isDark = false;
        let jsColors = {};
        const colors = ['#3B82F6', '#EF4444', '#22C55E', '#A855F7', '#F97316', '#06B6D4'];
        let functions = [];
        let nextId = 1;
        let errorTimeout = null;
        let undoStack = [];
        let redoStack = [];
        const MAX_HISTORY = 50;

        function updateCanvasColors() {
            const cs = getComputedStyle(document.body);
            jsColors.gridMinor = cs.getPropertyValue('--grid-minor').trim();
            jsColors.gridMajor = cs.getPropertyValue('--grid-major').trim();
            jsColors.axis = cs.getPropertyValue('--axis').trim();
            jsColors.axisLabel = cs.getPropertyValue('--axis-label').trim();
            jsColors.originDot = cs.getPropertyValue('--origin-dot').trim();
            jsColors.labelBg = cs.getPropertyValue('--label-bg').trim();
            jsColors.labelShadow = cs.getPropertyValue('--label-shadow').trim();
            jsColors.traceInner = cs.getPropertyValue('--trace-inner').trim();
            jsColors.curveGlow = isDark ? 12 : 8;
        }

        function addFunction(expr) {
            const result = parse(expr);
            if (result.error) return { error: result.error };
            const fn = {
                id: nextId++,
                expr: expr.replace(/^[yY]\s*=\s*/, ''),
                fn: result.evaluate,
                color: colors[functions.length % colors.length],
                visible: true
            };
            functions.push(fn);
            return { error: null, fn };
        }
        function removeFunction(id) {
            functions = functions.filter(f => f.id !== id);
            if (pinnedPoint && pinnedPoint.fnId === id) {
                pinnedPoint = null;
            }
        }
        function toggleFunction(id) {
            const f = functions.find(f => f.id === id);
            if (f) {
                f.visible = !f.visible;
                if (!f.visible && pinnedPoint && pinnedPoint.fnId === id) {
                    pinnedPoint = null;
                }
            }
        }

        function trimHistory() {
            while (undoStack.length > MAX_HISTORY) {
                undoStack.shift();
            }
        }

        function doAdd(expr) {
            const result = addFunction(expr);
            if (!result.error) {
                undoStack.push({type:'add', id: result.fn.id, expr: result.fn.expr, color: result.fn.color});
                redoStack = [];
                trimHistory();
            }
            return result;
        }

        function doRemove(id) {
            const index = functions.findIndex(f => f.id === id);
            if (index === -1) return;
            const f = functions[index];
            undoStack.push({type:'remove', expr: f.expr, color: f.color, visible: f.visible, id: f.id, index});
            redoStack = [];
            removeFunction(id);
            trimHistory();
        }

        function doToggle(id) {
            undoStack.push({type:'toggle', id});
            redoStack = [];
            toggleFunction(id);
            trimHistory();
        }

        function undo() {
            if (undoStack.length === 0) return;
            const action = undoStack.pop();
            if (action.type === 'add') {
                removeFunction(action.id);
                redoStack.push({type:'add', expr: action.expr, color: action.color});
            } else if (action.type === 'remove') {
                const result = parse(action.expr);
                if (!result.error) {
                    const fn = {
                        id: action.id,
                        expr: action.expr,
                        fn: result.evaluate,
                        color: action.color,
                        visible: action.visible
                    };
                    functions.splice(action.index, 0, fn);
                    if (nextId <= action.id) nextId = action.id + 1;
                    redoStack.push({type:'remove', expr: action.expr, color: action.color, visible: action.visible, id: action.id, index: action.index});
                }
            } else if (action.type === 'toggle') {
                toggleFunction(action.id);
                redoStack.push({type:'toggle', id: action.id});
            }
            renderExprList();
            if (pinnedPoint) {
                const f = functions.find(f => f.id === pinnedPoint.fnId);
                if (!f || !f.visible) pinnedPoint = null;
            }
        }

        function redo() {
            if (redoStack.length === 0) return;
            const action = redoStack.pop();
            if (action.type === 'add') {
                const result = addFunction(action.expr);
                if (!result.error) {
                    result.fn.color = action.color;
                    undoStack.push({type:'add', id: result.fn.id, expr: result.fn.expr, color: result.fn.color});
                    trimHistory();
                }
            } else if (action.type === 'remove') {
                removeFunction(action.id);
                undoStack.push({type:'remove', expr: action.expr, color: action.color, visible: action.visible, id: action.id, index: action.index});
                trimHistory();
            } else if (action.type === 'toggle') {
                toggleFunction(action.id);
                undoStack.push({type:'toggle', id: action.id});
                trimHistory();
            }
            renderExprList();
            if (pinnedPoint) {
                const f = functions.find(f => f.id === pinnedPoint.fnId);
                if (!f || !f.visible) pinnedPoint = null;
            }
        }

        let view = {
            centerX: 0,
            centerY: 0,
            scale: 1
        };

        let animStart = null;
        let animTarget = null;
        let isAnimating = false;

        function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
        }

        function animateViewTo(targetCX, targetCY, targetScale, duration) {
            if (duration === undefined) duration = 250;
            const minScale = window.innerWidth / 1000;
            const maxScale = window.innerWidth / 0.02;
            targetScale = Math.max(minScale, Math.min(maxScale, targetScale));
            animStart = {
                cx: view.centerX,
                cy: view.centerY,
                scale: view.scale,
                time: performance.now()
            };
            animTarget = { cx: targetCX, cy: targetCY, scale: targetScale, duration };
            isAnimating = true;
        }

        function cancelAnimation() {
            isAnimating = false;
            animStart = null;
            animTarget = null;
        }

        function niceStep(range, targetSteps) {
            const rough = range / targetSteps;
            const pow = Math.pow(10, Math.floor(Math.log10(rough)));
            const norm = rough / pow;
            let nice;
            if (norm < 1.5) nice = 1;
            else if (norm < 3) nice = 2;
            else if (norm < 7) nice = 5;
            else nice = 10;
            return nice * pow;
        }

        function formatNumber(num) {
            if (num === 0) return '0';
            if (Math.abs(num) >= 10000 || (Math.abs(num) < 0.01 && num !== 0)) {
                return num.toExponential(1);
            }
            return parseFloat(num.toPrecision(6)).toString();
        }

        function parse(input) {
            let str = input.trim();
            str = str.replace(/\s+/g, '');
            
            const yEqualsMatch = str.match(/^[yY]=(.*)$/);
            if (yEqualsMatch) {
                str = yEqualsMatch[1];
            }
            
            const tokens = [];
            let pos = 0;
            
            const functions = ['sin', 'cos', 'tan', 'asin', 'acos', 'atan', 'sqrt', 'abs', 'ln', 'log', 'exp', 'floor', 'ceil', 'round'];
            const constants = ['pi', 'e'];
            
            while (pos < str.length) {
                const ch = str[pos];
                
                if ((ch >= '0' && ch <= '9') || ch === '.') {
                    let num = '';
                    let hasDot = false;
                    while (pos < str.length && ((str[pos] >= '0' && str[pos] <= '9') || (str[pos] === '.' && !hasDot))) {
                        if (str[pos] === '.') hasDot = true;
                        num += str[pos];
                        pos++;
                    }
                    tokens.push({ type: 'number', value: parseFloat(num), pos: pos - num.length });
                    continue;
                }
                
                if ((ch >= 'a' && ch <= 'z') || (ch >= 'A' && ch <= 'Z')) {
                    let ident = '';
                    while (pos < str.length && ((str[pos] >= 'a' && str[pos] <= 'z') || (str[pos] >= 'A' && str[pos] <= 'Z'))) {
                        ident += str[pos].toLowerCase();
                        pos++;
                    }
                    if (ident === 'x') {
                        tokens.push({ type: 'x', pos: pos - 1 });
                    } else if (constants.includes(ident)) {
                        tokens.push({ type: 'constant', value: ident, pos: pos - ident.length });
                    } else if (functions.includes(ident)) {
                        tokens.push({ type: 'function', value: ident, pos: pos - ident.length });
                    } else {
                        return { error: `Unknown identifier '${ident}' at position ${pos - ident.length}` };
                    }
                    continue;
                }
                
                if ('+-*/^()'.includes(ch)) {
                    tokens.push({ type: 'op', value: ch, pos });
                    pos++;
                    continue;
                }
                
                return { error: `Unexpected character '${ch}' at position ${pos}` };
            }
            
            const processed = [];
            for (let i = 0; i < tokens.length; i++) {
                const tok = tokens[i];
                processed.push(tok);
                
                if (i < tokens.length - 1) {
                    const next = tokens[i + 1];
                    const currIsEnd = (tok.type === 'number' || tok.type === 'x' || tok.type === 'constant' || (tok.type === 'op' && tok.value === ')'));
                    const nextIsStart = (next.type === 'number' || next.type === 'x' || next.type === 'constant' || next.type === 'function' || (next.type === 'op' && next.value === '('));
                    
                    if (currIsEnd && nextIsStart) {
                        processed.push({ type: 'op', value: '*', pos: tok.pos, implicit: true });
                    }
                }
            }
            
            let tokenIndex = 0;
            
            function peek() {
                return processed[tokenIndex] || { type: 'eof' };
            }
            
            function consume() {
                return processed[tokenIndex++];
            }
            
            function expect(type, value) {
                const tok = peek();
                if (tok.type !== type || (value !== undefined && tok.value !== value)) {
                    throw { error: `Expected ${value || type} at position ${tok.pos}` };
                }
                return consume();
            }
            
            function parseExpr() {
                let left = parseTerm();
                while (peek().type === 'op' && (peek().value === '+' || peek().value === '-')) {
                    const op = consume().value;
                    const right = parseTerm();
                    if (op === '+') {
                        const l = left;
                        left = x => l(x) + right(x);
                    } else {
                        const l = left;
                        left = x => l(x) - right(x);
                    }
                }
                return left;
            }
            
            function parseTerm() {
                let left = parseFactor();
                while (peek().type === 'op' && (peek().value === '*' || peek().value === '/')) {
                    const op = consume().value;
                    const right = parseFactor();
                    if (op === '*') {
                        const l = left;
                        left = x => l(x) * right(x);
                    } else {
                        const l = left;
                        left = x => l(x) / right(x);
                    }
                }
                return left;
            }
            
            function parseFactor() {
                const base = parseUnary();
                if (peek().type === 'op' && peek().value === '^') {
                    consume();
                    const exp = parseFactor();
                    const b = base;
                    return x => Math.pow(b(x), exp(x));
                }
                return base;
            }
            
            function parseUnary() {
                if (peek().type === 'op' && peek().value === '+') {
                    consume();
                    return parseUnary();
                }
                if (peek().type === 'op' && peek().value === '-') {
                    consume();
                    const operand = parseUnary();
                    return x => -operand(x);
                }
                return parseCall();
            }
            
            function parseCall() {
                if (peek().type === 'function') {
                    const fnTok = consume();
                    expect('op', '(');
                    const arg = parseExpr();
                    expect('op', ')');
                    const fnMap = {
                        sin: Math.sin,
                        cos: Math.cos,
                        tan: Math.tan,
                        asin: Math.asin,
                        acos: Math.acos,
                        atan: Math.atan,
                        sqrt: Math.sqrt,
                        abs: Math.abs,
                        ln: Math.log,
                        log: Math.log10,
                        exp: Math.exp,
                        floor: Math.floor,
                        ceil: Math.ceil,
                        round: Math.round
                    };
                    const fn = fnMap[fnTok.value];
                    return x => fn(arg(x));
                }
                return parseAtom();
            }
            
            function parseAtom() {
                const tok = peek();
                if (tok.type === 'number') {
                    consume();
                    const val = tok.value;
                    return x => val;
                }
                if (tok.type === 'x') {
                    consume();
                    return x => x;
                }
                if (tok.type === 'constant') {
                    consume();
                    if (tok.value === 'pi') return x => Math.PI;
                    if (tok.value === 'e') return x => Math.E;
                }
                if (tok.type === 'op' && tok.value === '(') {
                    consume();
                    const inner = parseExpr();
                    expect('op', ')');
                    return inner;
                }
                throw { error: `Unexpected token at position ${tok.pos}` };
            }
            
            try {
                const evaluator = parseExpr();
                if (peek().type !== 'eof') {
                    return { error: `Unexpected token at position ${peek().pos}` };
                }
                return {
                    evaluate: function(x) {
                        try {
                            const result = evaluator(x);
                            if (typeof result !== 'number' || !isFinite(result)) {
                                return NaN;
                            }
                            return result;
                        } catch (e) {
                            return NaN;
                        }
                    },
                    error: null
                };
            } catch (e) {
                return { error: e.error };
            }
        }

        function resizeCanvas() {
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            view.scale = window.innerWidth / 20;
            if (!isInitialized) {
                view.centerY = 0;
            }
        }

        function worldToScreen(wx, wy) {
            return {
                sx: window.innerWidth / 2 + (wx - view.centerX) * view.scale,
                sy: window.innerHeight / 2 - (wy - view.centerY) * view.scale
            };
        }

        function screenToWorld(sx, sy) {
            return {
                wx: (sx - window.innerWidth / 2) / view.scale + view.centerX,
                wy: -(sy - window.innerHeight / 2) / view.scale + view.centerY
            };
        }

        function render() {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

            const visibleLeft = screenToWorld(0, 0).wx;
            const visibleRight = screenToWorld(window.innerWidth, 0).wx;
            const visibleTop = screenToWorld(0, 0).wy;
            const visibleBottom = screenToWorld(0, window.innerHeight).wy;

            const xRange = visibleRight - visibleLeft;
            const yRange = visibleTop - visibleBottom;

            const majorStepX = niceStep(xRange, 10);
            const majorStepY = niceStep(yRange, 10);
            const minorStepX = majorStepX / 5;
            const minorStepY = majorStepY / 5;

            ctx.save();
            ctx.strokeStyle = jsColors.gridMinor;
            ctx.lineWidth = 1;
            ctx.beginPath();

            let startX = Math.floor(visibleLeft / minorStepX) * minorStepX;
            for (let x = startX; x <= visibleRight; x += minorStepX) {
                const screen = worldToScreen(x, 0);
                ctx.moveTo(screen.sx, 0);
                ctx.lineTo(screen.sx, window.innerHeight);
            }

            let startY = Math.floor(visibleBottom / minorStepY) * minorStepY;
            for (let y = startY; y <= visibleTop; y += minorStepY) {
                const screen = worldToScreen(0, y);
                ctx.moveTo(0, screen.sy);
                ctx.lineTo(window.innerWidth, screen.sy);
            }
            ctx.stroke();
            ctx.restore();

            ctx.save();
            ctx.strokeStyle = jsColors.gridMajor;
            ctx.lineWidth = 1;
            ctx.beginPath();

            startX = Math.floor(visibleLeft / majorStepX) * majorStepX;
            for (let x = startX; x <= visibleRight; x += majorStepX) {
                const screen = worldToScreen(x, 0);
                ctx.moveTo(screen.sx, 0);
                ctx.lineTo(screen.sx, window.innerHeight);
            }

            startY = Math.floor(visibleBottom / majorStepY) * majorStepY;
            for (let y = startY; y <= visibleTop; y += majorStepY) {
                const screen = worldToScreen(0, y);
                ctx.moveTo(0, screen.sy);
                ctx.lineTo(window.innerWidth, screen.sy);
            }
            ctx.stroke();
            ctx.restore();

            const origin = worldToScreen(0, 0);
            const xAxisOnScreen = origin.sy >= 0 && origin.sy <= window.innerHeight;
            const yAxisOnScreen = origin.sx >= 0 && origin.sx <= window.innerWidth;

            ctx.save();
            ctx.strokeStyle = jsColors.axis;
            ctx.lineWidth = 1.5;
            ctx.lineCap = 'round';

            let axisY = xAxisOnScreen ? origin.sy : window.innerHeight;
            ctx.beginPath();
            ctx.moveTo(0, axisY);
            ctx.lineTo(window.innerWidth - 10, axisY);
            ctx.stroke();

            let axisX = yAxisOnScreen ? origin.sx : 0;
            ctx.beginPath();
            ctx.moveTo(axisX, 0);
            ctx.lineTo(axisX, window.innerHeight - 10);
            ctx.stroke();

            ctx.fillStyle = jsColors.axis;
            ctx.beginPath();
            ctx.moveTo(window.innerWidth, axisY);
            ctx.lineTo(window.innerWidth - 10, axisY - 5);
            ctx.lineTo(window.innerWidth - 10, axisY + 5);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(axisX, 0);
            ctx.lineTo(axisX - 5, 10);
            ctx.lineTo(axisX + 5, 10);
            ctx.closePath();
            ctx.fill();

            ctx.restore();

            ctx.save();
            ctx.font = '12px system-ui, -apple-system, sans-serif';
            ctx.fillStyle = jsColors.axisLabel;

            const labelOffsetX = xAxisOnScreen ? origin.sy + 16 : window.innerHeight - 8;
            const labelOffsetY = yAxisOnScreen ? origin.sx - 8 : 8;

            startX = Math.floor(visibleLeft / majorStepX) * majorStepX;
            for (let x = startX; x <= visibleRight; x += majorStepX) {
                if (Math.abs(x) < majorStepX * 0.0001) continue;
                const screen = worldToScreen(x, 0);
                if (screen.sx < 20 || screen.sx > window.innerWidth - 20) continue;
                const label = formatNumber(x);
                const metrics = ctx.measureText(label);
                ctx.fillText(label, screen.sx - metrics.width / 2, labelOffsetX);
            }

            startY = Math.floor(visibleBottom / majorStepY) * majorStepY;
            for (let y = startY; y <= visibleTop; y += majorStepY) {
                if (Math.abs(y) < majorStepY * 0.0001) continue;
                const screen = worldToScreen(0, y);
                if (screen.sy < 30 || screen.sy > window.innerHeight - 30) continue;
                const label = formatNumber(y);
                const metrics = ctx.measureText(label);
                ctx.fillText(label, labelOffsetY - metrics.width, screen.sy + 4);
            }

            if (xAxisOnScreen && yAxisOnScreen) {
                if (origin.sx >= 20 && origin.sx <= window.innerWidth - 20 &&
                    origin.sy >= 30 && origin.sy <= window.innerHeight - 30) {
                    ctx.fillText('0', origin.sx - 12, origin.sy + 16);
                }
            }

            ctx.restore();

            const sampleCount = Math.ceil(window.innerWidth * 2);
            const dx = (visibleRight - visibleLeft) / sampleCount;
            const allCurves = [];

            for (const f of functions) {
                if (!f.visible) continue;
                let pathSegments = [];
                let currentSegment = [];
                let prevScreen = null;

                for (let i = 0; i <= sampleCount; i++) {
                    const wx = visibleLeft + i * dx;
                    const wy = f.fn(wx);
                    const isValid = isFinite(wy) && !isNaN(wy);
                    let shouldBreak = !isValid;

                    const screen = worldToScreen(wx, wy);

                    if (isValid && prevScreen !== null) {
                        if (Math.abs(screen.sy - prevScreen.sy) > window.innerHeight * 1.2) {
                            shouldBreak = true;
                        }
                    }

                    if (shouldBreak) {
                        if (currentSegment.length > 0) {
                            pathSegments.push(currentSegment);
                            currentSegment = [];
                        }
                        prevScreen = isValid ? screen : null;
                        continue;
                    }

                    currentSegment.push({ sx: screen.sx, sy: screen.sy });
                    prevScreen = screen;
                }

                if (currentSegment.length > 0) {
                    pathSegments.push(currentSegment);
                }

                allCurves.push({ segments: pathSegments, color: f.color });
            }

            function strokeSegments(segments, width, blur, color) {
                ctx.lineWidth = width;
                ctx.shadowBlur = blur;
                ctx.shadowColor = color;
                ctx.strokeStyle = color;
                ctx.beginPath();
                for (const seg of segments) {
                    if (seg.length === 0) continue;
                    ctx.moveTo(seg[0].sx, seg[0].sy);
                    for (let i = 1; i < seg.length; i++) {
                        ctx.lineTo(seg[i].sx, seg[i].sy);
                    }
                }
                ctx.stroke();
            }

            ctx.save();
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            for (const curve of allCurves) {
                strokeSegments(curve.segments, 5, jsColors.curveGlow, curve.color);
            }
            for (const curve of allCurves) {
                strokeSegments(curve.segments, 2.5, 0, curve.color);
            }
            ctx.restore();

            ctx.save();
            ctx.font = 'italic 14px "SF Mono","Fira Code",monospace';
            const labelPadding = 4;
            const labelRadius = 4;
            const usedYRegions = [];
            for (const f of functions) {
                if (!f.visible) continue;
                let labelWx = visibleLeft + 0.88 * (visibleRight - visibleLeft);
                let labelWy = f.fn(labelWx);
                let labelScreen = worldToScreen(labelWx, labelWy);
                let found = isFinite(labelWy) && !isNaN(labelWy) && labelScreen.sy >= 0 && labelScreen.sy <= window.innerHeight;
                if (!found) {
                    const scanDx = (visibleRight - visibleLeft) / 200;
                    for (let scanX = labelWx - scanDx; scanX >= visibleLeft; scanX -= scanDx) {
                        const wy = f.fn(scanX);
                        const sc = worldToScreen(scanX, wy);
                        if (isFinite(wy) && !isNaN(wy) && sc.sy >= 0 && sc.sy <= window.innerHeight) {
                            labelWx = scanX;
                            labelWy = wy;
                            labelScreen = sc;
                            found = true;
                            break;
                        }
                    }
                }
                if (!found) continue;
                const text = 'y = ' + f.expr;
                const metrics = ctx.measureText(text);
                const textW = metrics.width;
                const textH = 14;
                let boxX = labelScreen.sx + 8;
                let boxY = labelScreen.sy - 6 - textH - labelPadding * 2;
                const boxW = textW + labelPadding * 2;
                const boxH = textH + labelPadding * 2;
                if (boxX + boxW > window.innerWidth - 5) boxX = window.innerWidth - 5 - boxW;
                if (boxX < 5) boxX = 5;
                if (boxY < 5) boxY = 5;
                let placed = false;
                for (let attempt = 0; attempt < 50 && !placed; attempt++) {
                    let overlap = false;
                    for (const region of usedYRegions) {
                        if (boxX < region.x + region.w && boxX + boxW > region.x &&
                            boxY < region.y + region.h && boxY + boxH > region.y) {
                            overlap = true;
                            boxY = region.y + region.h + 2;
                            break;
                        }
                    }
                    if (!overlap) {
                        placed = true;
                    }
                }
                if (boxY + boxH > window.innerHeight - 5) {
                    boxY = window.innerHeight - 5 - boxH;
                }
                usedYRegions.push({ x: boxX, y: boxY, w: boxW, h: boxH });
                ctx.fillStyle = jsColors.labelBg;
                ctx.beginPath();
                ctx.moveTo(boxX + labelRadius, boxY);
                ctx.lineTo(boxX + boxW - labelRadius, boxY);
                ctx.quadraticCurveTo(boxX + boxW, boxY, boxX + boxW, boxY + labelRadius);
                ctx.lineTo(boxX + boxW, boxY + boxH - labelRadius);
                ctx.quadraticCurveTo(boxX + boxW, boxY + boxH, boxX + boxW - labelRadius, boxY + boxH);
                ctx.lineTo(boxX + labelRadius, boxY + boxH);
                ctx.quadraticCurveTo(boxX, boxY + boxH, boxX, boxY + boxH - labelRadius);
                ctx.lineTo(boxX, boxY + labelRadius);
                ctx.quadraticCurveTo(boxX, boxY, boxX + labelRadius, boxY);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = f.color;
                ctx.fillText(text, boxX + labelPadding, boxY + labelPadding + 11);
            }
            ctx.restore();

            traceTarget = null;
            if (!pinnedPoint && !isDragging && mousePresent) {
                const mouseWorld = screenToWorld(mouseX, mouseY);
                const mwX = mouseWorld.wx;
                let minDist = Infinity;
                let bestTarget = null;
                for (const f of functions) {
                    if (!f.visible) continue;
                    const mouseWY = f.fn(mwX);
                    if (!isFinite(mouseWY) || isNaN(mouseWY)) continue;
                    const traceScreen = worldToScreen(mwX, mouseWY);
                    if (traceScreen.sy < -500 || traceScreen.sy > window.innerHeight + 500) continue;
                    const dist = Math.abs(mouseY - traceScreen.sy);
                    if (dist < 30 && dist < minDist) {
                        minDist = dist;
                        bestTarget = {
                            wx: mwX,
                            wy: mouseWY,
                            sx: traceScreen.sx,
                            sy: traceScreen.sy,
                            color: f.color
                        };
                    }
                }
                traceTarget = bestTarget;
            }

            if (traceTarget) {
                ctx.save();

                ctx.shadowColor = traceTarget.color + '80';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(traceTarget.sx, traceTarget.sy, 8, 0, Math.PI * 2);
                ctx.fillStyle = jsColors.traceInner;
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.beginPath();
                ctx.arc(traceTarget.sx, traceTarget.sy, 8, 0, Math.PI * 2);
                ctx.strokeStyle = traceTarget.color;
                ctx.lineWidth = 3;
                ctx.stroke();

                const labelText = `(${traceTarget.wx.toFixed(2)}, ${traceTarget.wy.toFixed(2)})`;
                ctx.font = '12px "SF Mono", "Fira Code", "Consolas", monospace';
                const metrics = ctx.measureText(labelText);
                const labelPaddingX = 8;
                const labelPaddingY = 4;
                const labelWidth = metrics.width + labelPaddingX * 2;
                const labelHeight = 12 + labelPaddingY * 2;

                let labelX = traceTarget.sx - labelWidth / 2;
                let labelY = traceTarget.sy - 20 - labelHeight;
                if (!panelCollapsed && traceTarget.sx < 360) {
                    labelX = traceTarget.sx + 16;
                    labelY = traceTarget.sy - labelHeight / 2;
                } else if (traceTarget.sx > window.innerWidth - labelWidth - 20) {
                    labelX = traceTarget.sx - labelWidth - 16;
                    labelY = traceTarget.sy - labelHeight / 2;
                }
                if (labelY < 5) {
                    labelY = traceTarget.sy + 20;
                }
                if (labelY + labelHeight > window.innerHeight - 5) {
                    labelY = traceTarget.sy - labelHeight - 20;
                }
                if (labelX < 5) labelX = 5;
                if (labelX + labelWidth > window.innerWidth - 5) labelX = window.innerWidth - 5 - labelWidth;

                ctx.fillStyle = jsColors.labelBg;
                ctx.shadowColor = jsColors.labelShadow;
                ctx.shadowBlur = 8;
                ctx.shadowOffsetY = 2;
                ctx.beginPath();
                const radius = 6;
                ctx.moveTo(labelX + radius, labelY);
                ctx.lineTo(labelX + labelWidth - radius, labelY);
                ctx.quadraticCurveTo(labelX + labelWidth, labelY, labelX + labelWidth, labelY + radius);
                ctx.lineTo(labelX + labelWidth, labelY + labelHeight - radius);
                ctx.quadraticCurveTo(labelX + labelWidth, labelY + labelHeight, labelX + labelWidth - radius, labelY + labelHeight);
                ctx.lineTo(labelX + radius, labelY + labelHeight);
                ctx.quadraticCurveTo(labelX, labelY + labelHeight, labelX, labelY + labelHeight - radius);
                ctx.lineTo(labelX, labelY + radius);
                ctx.quadraticCurveTo(labelX, labelY, labelX + radius, labelY);
                ctx.closePath();
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;
                ctx.fillStyle = traceTarget.color;
                ctx.fillText(labelText, labelX + labelPaddingX, labelY + labelPaddingY + 10);

                ctx.restore();
            }

            if (pinnedPoint) {
                const pinnedScreen = worldToScreen(pinnedPoint.wx, pinnedPoint.wy);
                pinnedPoint.sx = pinnedScreen.sx;
                pinnedPoint.sy = pinnedScreen.sy;

                ctx.save();

                ctx.shadowColor = pinnedPoint.color + '80';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(pinnedPoint.sx, pinnedPoint.sy, 10, 0, Math.PI * 2);
                ctx.fillStyle = jsColors.traceInner;
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.beginPath();
                ctx.arc(pinnedPoint.sx, pinnedPoint.sy, 4, 0, Math.PI * 2);
                ctx.fillStyle = pinnedPoint.color;
                ctx.fill();

                const labelText = `(${pinnedPoint.wx.toFixed(2)}, ${pinnedPoint.wy.toFixed(2)})`;
                ctx.font = '13px "SF Mono", "Fira Code", "Consolas", monospace';
                const metrics = ctx.measureText(labelText);
                const labelPaddingX = 10;
                const labelPaddingY = 5;
                const labelWidth = metrics.width + labelPaddingX * 2;
                const labelHeight = 13 + labelPaddingY * 2;

                let labelX = pinnedPoint.sx - labelWidth / 2;
                let labelY = pinnedPoint.sy - 20 - labelHeight;
                if (!panelCollapsed && pinnedPoint.sx < 360) {
                    labelX = pinnedPoint.sx + 16;
                    labelY = pinnedPoint.sy - labelHeight / 2;
                } else if (pinnedPoint.sx > window.innerWidth - labelWidth - 20) {
                    labelX = pinnedPoint.sx - labelWidth - 16;
                    labelY = pinnedPoint.sy - labelHeight / 2;
                }
                if (labelY < 5) {
                    labelY = pinnedPoint.sy + 20;
                }
                if (labelY + labelHeight > window.innerHeight - 5) {
                    labelY = pinnedPoint.sy - labelHeight - 20;
                }
                if (labelX < 5) labelX = 5;
                if (labelX + labelWidth > window.innerWidth - 5) labelX = window.innerWidth - 5 - labelWidth;

                ctx.fillStyle = jsColors.labelBg;
                ctx.shadowColor = jsColors.labelShadow;
                ctx.shadowBlur = 8;
                ctx.shadowOffsetY = 2;
                ctx.beginPath();
                const radius = 6;
                ctx.moveTo(labelX + radius, labelY);
                ctx.lineTo(labelX + labelWidth - radius, labelY);
                ctx.quadraticCurveTo(labelX + labelWidth, labelY, labelX + labelWidth, labelY + radius);
                ctx.lineTo(labelX + labelWidth, labelY + labelHeight - radius);
                ctx.quadraticCurveTo(labelX + labelWidth, labelY + labelHeight, labelX + labelWidth - radius, labelY + labelHeight);
                ctx.lineTo(labelX + radius, labelY + labelHeight);
                ctx.quadraticCurveTo(labelX, labelY + labelHeight, labelX, labelY + labelHeight - radius);
                ctx.lineTo(labelX, labelY + radius);
                ctx.quadraticCurveTo(labelX, labelY, labelX + radius, labelY);
                ctx.closePath();
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;
                ctx.fillStyle = pinnedPoint.color;
                ctx.fillText(labelText, labelX + labelPaddingX, labelY + labelPaddingY + 11);

                ctx.restore();
            }

            ctx.beginPath();
            ctx.fillStyle = jsColors.originDot;
            ctx.arc(origin.sx, origin.sy, 4, 0, Math.PI * 2);
            ctx.fill();

            if (pinnedPoint) {
                coordDisplay.textContent = `x: ${pinnedPoint.wx.toFixed(2)}, y: ${pinnedPoint.wy.toFixed(2)}`;
                coordDisplay.style.color = pinnedPoint.color;
            } else if (traceTarget) {
                coordDisplay.textContent = `x: ${traceTarget.wx.toFixed(2)}, y: ${traceTarget.wy.toFixed(2)}`;
                coordDisplay.style.color = traceTarget.color;
            } else if (mousePresent) {
                const mw = screenToWorld(mouseX, mouseY);
                coordDisplay.textContent = `x: ${mw.wx.toFixed(2)}, y: ${mw.wy.toFixed(2)}`;
                coordDisplay.style.color = '';
            } else {
                coordDisplay.textContent = 'x: 0.00, y: 0.00';
                coordDisplay.style.color = '';
            }
        }

        function loop() {
            if (isAnimating && animStart && animTarget) {
                const elapsed = performance.now() - animStart.time;
                const t = Math.min(1, elapsed / animTarget.duration);
                const ease = easeOutCubic(t);
                view.centerX = animStart.cx + (animTarget.cx - animStart.cx) * ease;
                view.centerY = animStart.cy + (animTarget.cy - animStart.cy) * ease;
                view.scale = animStart.scale + (animTarget.scale - animStart.scale) * ease;
                if (t >= 1) {
                    isAnimating = false;
                    animStart = null;
                    animTarget = null;
                }
            }
            render();
            requestAnimationFrame(loop);
        }

        function renderExprList() {
            exprList.innerHTML = '';
            if (functions.length === 0) {
                const hint = document.createElement('div');
                hint.className = 'empty-hint';
                hint.textContent = '输入函数开始绘图';
                exprList.appendChild(hint);
                return;
            }
            functions.forEach(f => {
                const item = document.createElement('div');
                item.className = 'expr-item fade-in';

                const dot = document.createElement('div');
                dot.className = 'expr-color';
                dot.style.background = f.color;

                const text = document.createElement('div');
                text.className = 'expr-text';
                text.textContent = 'y = ' + f.expr;

                const visBtn = document.createElement('button');
                visBtn.className = 'expr-btn' + (f.visible ? '' : ' hidden');
                visBtn.innerHTML = f.visible 
                    ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'
                    : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
                visBtn.title = f.visible ? '隐藏' : '显示';
                visBtn.onclick = (e) => { e.stopPropagation(); doToggle(f.id); renderExprList(); };

                const delBtn = document.createElement('button');
                delBtn.className = 'expr-btn delete';
                delBtn.textContent = '×';
                delBtn.title = '删除';
                delBtn.onclick = (e) => { e.stopPropagation(); doRemove(f.id); renderExprList(); };

                item.appendChild(dot);
                item.appendChild(text);
                item.appendChild(visBtn);
                item.appendChild(delBtn);
                exprList.appendChild(item);
            });
        }

        exprInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const value = exprInput.value.trim();
                if (value === '') return;
                const result = doAdd(value);
                if (result.error) {
                    exprInput.classList.add('error', 'shake');
                    setTimeout(() => exprInput.classList.remove('shake'), 300);
                    errorMsg.textContent = result.error;
                    errorMsg.classList.add('visible');
                    if (errorTimeout) clearTimeout(errorTimeout);
                    errorTimeout = setTimeout(() => errorMsg.classList.remove('visible'), 3000);
                } else {
                    exprInput.classList.remove('error', 'shake');
                    exprInput.value = '';
                    errorMsg.classList.remove('visible');
                    if (errorTimeout) { clearTimeout(errorTimeout); errorTimeout = null; }
                    renderExprList();
                    setTimeout(() => exprList.scrollTop = exprList.scrollHeight, 50);
                }
            }
        });

        exprInput.addEventListener('input', function() {
            exprInput.classList.remove('error');
            errorMsg.classList.remove('visible');
        });

        exprInput.addEventListener('animationend', function() {
            exprInput.classList.remove('shake');
        });

        const resetBtn = document.getElementById('resetBtn');
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const themeToggle = document.getElementById('themeToggle');
        const coordDisplay = document.getElementById('coordDisplay');
        const panelToggle = document.getElementById('panelToggle');
        const panelExpand = document.getElementById('panelExpand');

        let panelCollapsed = false;
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let dragStartCenterX = 0;
        let dragStartCenterY = 0;
        let mouseX = 0;
        let mouseY = 0;
        let mousePresent = false;
        let traceTarget = null;
        let pinnedPoint = null;
        let clickStartX = 0;
        let clickStartY = 0;

        let touchState = null;

        function togglePanel() {
            panelCollapsed = !panelCollapsed;
            document.body.classList.toggle('panel-collapsed', panelCollapsed);
        }

        panelToggle.addEventListener('click', togglePanel);
        panelExpand.addEventListener('click', togglePanel);

        window.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
                if (document.activeElement === exprInput) return;
                e.preventDefault();
                undo();
            } else if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) {
                if (document.activeElement === exprInput) return;
                e.preventDefault();
                redo();
            } else if (e.key === 'Escape') {
                if (document.activeElement === exprInput) {
                    exprInput.blur();
                    return;
                }
                togglePanel();
            }
        });

        function zoomAt(sx, sy, factor) {
            if (isAnimating) cancelAnimation();
            const world = screenToWorld(sx, sy);
            view.scale *= factor;
            const minScale = window.innerWidth / 1000;
            const maxScale = window.innerWidth / 0.02;
            view.scale = Math.max(minScale, Math.min(maxScale, view.scale));
            const newWorld = screenToWorld(sx, sy);
            view.centerX += world.wx - newWorld.wx;
            view.centerY += world.wy - newWorld.wy;
        }

        window.addEventListener('wheel', function(e) {
            if (e.target.closest('#exprInput, #exprList')) return;
            e.preventDefault();
            const mx = e.clientX;
            const my = e.clientY;
            const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
            zoomAt(mx, my, factor);
        }, { passive: false });

        canvas.addEventListener('mousedown', function(e) {
            if (e.button !== 0) return;
            if (e.target.closest('#expressionPanel, #toolbar, #coordDisplay')) return;
            clickStartX = e.clientX;
            clickStartY = e.clientY;
            if (isAnimating) cancelAnimation();
            exprInput.blur();
            isDragging = true;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            dragStartCenterX = view.centerX;
            dragStartCenterY = view.centerY;
            document.body.classList.add('grabbing');
        });

        window.addEventListener('mousemove', function(e) {
            mouseX = e.clientX;
            mouseY = e.clientY;
            mousePresent = true;

            if (!isDragging) return;
            const dx = e.clientX - dragStartX;
            const dy = e.clientY - dragStartY;
            view.centerX = dragStartCenterX - dx / view.scale;
            view.centerY = dragStartCenterY + dy / view.scale;
        });

        function stopDrag() {
            isDragging = false;
            document.body.classList.remove('grabbing');
        }

        window.addEventListener('mouseup', stopDrag);
        canvas.addEventListener('mouseleave', stopDrag);
        document.addEventListener('mouseleave', function() { mousePresent = false; });

        canvas.addEventListener('click', function(e) {
            if (e.target.closest('#expressionPanel, #toolbar, #coordDisplay')) return;
            const dx = e.clientX - clickStartX;
            const dy = e.clientY - clickStartY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > 5) return;

            const clickWorld = screenToWorld(e.clientX, e.clientY);
            const cwX = clickWorld.wx;
            let minDist = Infinity;
            let bestTarget = null;
            for (const f of functions) {
                if (!f.visible) continue;
                const clickWY = f.fn(cwX);
                if (!isFinite(clickWY) || isNaN(clickWY)) continue;
                const traceScreen = worldToScreen(cwX, clickWY);
                if (traceScreen.sy < -500 || traceScreen.sy > window.innerHeight + 500) continue;
                const d = Math.abs(e.clientY - traceScreen.sy);
                if (d < minDist) {
                    minDist = d;
                    if (d < 25) {
                        bestTarget = {
                            wx: cwX,
                            wy: clickWY,
                            sx: traceScreen.sx,
                            sy: traceScreen.sy,
                            color: f.color,
                            fnId: f.id
                        };
                    }
                }
            }
            if (bestTarget) {
                pinnedPoint = bestTarget;
            } else if (minDist > 30) {
                pinnedPoint = null;
            }
        });

        zoomInBtn.addEventListener('click', function() {
            animateViewTo(view.centerX, view.centerY, view.scale * 1.4, 200);
        });

        zoomOutBtn.addEventListener('click', function() {
            animateViewTo(view.centerX, view.centerY, view.scale / 1.4, 200);
        });

        resetBtn.addEventListener('click', function() {
            animateViewTo(0, 0, window.innerWidth / 20);
            pinnedPoint = null;
            coordDisplay.textContent = 'x: 0.00, y: 0.00';
            coordDisplay.style.color = '';
        });

        themeToggle.addEventListener('click', function() {
            isDark = !isDark;
            document.body.classList.toggle('dark', isDark);
            themeToggle.textContent = isDark ? '☀' : '☾';
            themeToggle.title = isDark ? '切换浅色模式' : '切换深色模式';
            updateCanvasColors();
            const bg = document.querySelector('.bg-gradient');
            if (isDark) {
                bg.style.background = 'radial-gradient(ellipse at 30% 20%, #0f172a 0%, #1e293b 50%, #0f172a 100%)';
            } else {
                bg.style.background = 'radial-gradient(ellipse at 30% 20%, #eef2ff 0%, #f8faff 50%, #ffffff 100%)';
            }
        });

        function getTouchDistance(t1, t2) {
            const dx = t2.clientX - t1.clientX;
            const dy = t2.clientY - t1.clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function getTouchMidpoint(t1, t2) {
            return {
                x: (t1.clientX + t2.clientX) / 2,
                y: (t1.clientY + t2.clientY) / 2
            };
        }

        canvas.addEventListener('touchstart', function(e) {
            e.preventDefault();
            if (e.target.closest('#expressionPanel, #toolbar, #coordDisplay')) return;

            if (e.touches.length === 1) {
                isDragging = true;
                dragStartX = e.touches[0].clientX;
                dragStartY = e.touches[0].clientY;
                dragStartCenterX = view.centerX;
                dragStartCenterY = view.centerY;
                touchState = null;
            } else if (e.touches.length === 2) {
                isDragging = false;
                touchState = {
                    t1: { x: e.touches[0].clientX, y: e.touches[0].clientY },
                    t2: { x: e.touches[1].clientX, y: e.touches[1].clientY }
                };
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', function(e) {
            e.preventDefault();

            if (e.touches.length === 1 && isDragging && !touchState) {
                const dx = e.touches[0].clientX - dragStartX;
                const dy = e.touches[0].clientY - dragStartY;
                view.centerX = dragStartCenterX - dx / view.scale;
                view.centerY = dragStartCenterY + dy / view.scale;
            } else if (e.touches.length === 2 && touchState) {
                const t1 = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                const t2 = { x: e.touches[1].clientX, y: e.touches[1].clientY };

                const prevDist = getTouchDistance(touchState.t1, touchState.t2);
                const currDist = getTouchDistance(t1, t2);

                const prevMid = getTouchMidpoint(touchState.t1, touchState.t2);
                const currMid = getTouchMidpoint(t1, t2);

                const factor = currDist / prevDist;

                const anchorWorld = screenToWorld(prevMid.x, prevMid.y);
                view.scale *= factor;
                const minScale = window.innerWidth / 1000;
                const maxScale = window.innerWidth / 0.02;
                view.scale = Math.max(minScale, Math.min(maxScale, view.scale));
                const newAnchorWorld = screenToWorld(currMid.x, currMid.y);
                view.centerX += anchorWorld.wx - newAnchorWorld.wx;
                view.centerY += anchorWorld.wy - newAnchorWorld.wy;

                touchState.t1 = t1;
                touchState.t2 = t2;
            }
        }, { passive: false });

        canvas.addEventListener('touchend', function(e) {
            if (e.touches.length === 0) {
                isDragging = false;
                touchState = null;
            } else if (e.touches.length === 1) {
                touchState = null;
                isDragging = true;
                dragStartX = e.touches[0].clientX;
                dragStartY = e.touches[0].clientY;
                dragStartCenterX = view.centerX;
                dragStartCenterY = view.centerY;
            }
        });

        doAdd('y=x^2');

        resizeCanvas();
        updateCanvasColors();
        isInitialized = true;
        renderExprList();
        loop();

        setTimeout(() => exprInput.focus(), 100);

        window.addEventListener('resize', resizeCanvas);
    </script>
</body>
</html>
