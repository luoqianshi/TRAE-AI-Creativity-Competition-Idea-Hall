<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人AI知识助理 - 首次引导</title>
    <style id="theme-vars">
/* ============================================
   Personal AI Knowledge Assistant
   Brand Design Tokens — colors_and_type.css
   ============================================ */

/* ── Brand Prefix ── */
:root {
  /* ── Color System ── */
  /* Primary — warm sky blue for friendly, approachable AI feel */
  --color-primary: #4A9BD9;
  --color-primary-hover: #3A88C5;
  --color-primary-light: #E8F4FC;
  --color-primary-lighter: #F0F8FF;
  --color-primary-subtle: #D6ECFA;
  --color-primary-dark: #2E7AB3;

  /* Semantic State Colors */
  --state-success: #34C77B;
  --state-warning: #F5A623;
  --state-error: #E74C5E;
  --state-info: #4A9BD9;

  /* Neutrals — soft warm grays */
  --color-bg: #F7F9FC;
  --color-bg-alt: #FFFFFF;
  --color-bg-elevated: #FFFFFF;
  --color-bg-inset: #EEF2F7;
  --color-bg-hover: #F0F4F8;
  --color-bg-active: #E6EDF4;

  --color-border: #DDE4EE;
  --color-border-light: #E8EDF3;
  --color-border-subtle: #F0F3F7;

  --color-text-primary: #2C3A4B;
  --color-text-secondary: #5A6B7E;
  --color-text-tertiary: #8C99A8;
  --color-text-inverse: #FFFFFF;
  --color-text-link: #4A9BD9;

  /* ── Radius Scale ── */
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* ── Typography ── */
  --font-family-base: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-family-display: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;

  --font-size-xs: 11px;
  --font-size-sm: 13px;
  --font-size-base: 14px;
  --font-size-md: 15px;
  --font-size-lg: 18px;
  --font-size-xl: 22px;
  --font-size-2xl: 28px;
  --font-size-3xl: 36px;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.7;

  /* ── Spacing Scale ── */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: 48px;
  --space-3xl: 64px;

  /* ── Shadows (static alpha ≤ 0.05; floating layers may go deeper) ── */
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.05);
  --shadow-float: 0 12px 32px rgba(0, 0, 0, 0.12);

  /* ── Transitions ── */
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 350ms ease;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>
  <div class="app-shell">

    <!-- ═══════════════ LEFT SIDEBAR ═══════════════ -->
    <aside class="sidebar-left">
      <!-- Logo -->
      <div class="logo-area">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <span style="font-size: var(--font-size-lg); font-weight: var(--font-weight-bold); color: var(--color-text-primary);">我的知识助理</span>
      </div>

      <!-- Search -->
      <div class="search-bar">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" placeholder="搜索文件或文件夹..." />
      </div>

      <!-- Upload -->
      <button class="upload-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        上传文件
      </button>
      <div class="drop-hint">拖拽文件到此处上传</div>

      <!-- Empty state area -->
      <div class="sidebar-empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.5;">
          <path d="M3 7V17C3 18.1046 3.89543 19 5 19H19C20.1046 19 21 18.1046 21 17V9C21 7.89543 20.1046 7 19 7H13L11 5H5C3.89543 5 3 5.89543 3 7Z"/>
        </svg>
        <div class="sidebar-empty-text">
          📂 点击上方"上传文件"或拖拽文件到此处，开始建立你的专属知识库。
        </div>
        <div class="sidebar-empty-sub">支持 .txt, .md, .pdf, .docx 格式</div>
      </div>
    </aside>

    <!-- ═══════════════ CENTER MAIN AREA ═══════════════ -->
    <main class="main-center">
      <!-- Top bar -->
      <div class="top-bar">
        <img class="avatar" src="assets/ai-assistant-avatar.jpg" alt="AI助理头像" />
        <div class="ai-info">
          <div class="ai-name">我的AI助理</div>
          <div class="ai-tagline">你的专属知识管家</div>
          <div class="ai-status">
            <span class="status-dot"></span>
            <span>在线</span>
          </div>
        </div>
        <button class="settings-btn" title="设置">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
        </button>
      </div>

      <!-- Chat area -->
      <div class="chat-area">
        <div class="guide-card">
          <img class="guide-avatar" src="assets/ai-assistant-avatar.jpg" alt="AI助理" />
          <div class="guide-title">欢迎使用你的AI知识助理！</div>
          <div class="guide-body">我可以帮你整理、总结和分析你的个人文档。只需三步，即可开始：</div>

          <!-- Step 1 -->
          <div class="guide-step">
            <div class="step-badge">1</div>
            <div class="step-content">
              <div class="step-title">上传文件</div>
              <div class="step-desc">将你的文档拖拽到左侧面板或点击上传按钮</div>
            </div>
          </div>

          <!-- Step 2 -->
          <div class="guide-step">
            <div class="step-badge">2</div>
            <div class="step-content">
              <div class="step-title">建立知识库</div>
              <div class="step-desc">文件会自动整理到你的个人知识库中</div>
            </div>
          </div>

          <!-- Step 3 -->
          <div class="guide-step">
            <div class="step-badge">3</div>
            <div class="step-content">
              <div class="step-title">开始提问</div>
              <div class="step-desc">向我提问任何关于你文件的问题</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Input area -->
      <div class="input-area">
        <div class="input-wrapper disabled">
          <input type="text" placeholder="上传文件后即可开始提问..." disabled />
          <button class="attach-btn" title="添加附件" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
            </svg>
          </button>
          <button class="send-btn disabled" title="发送" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
        <div class="input-hint">按 Enter 发送</div>
      </div>
    </main>

    <!-- ═══════════════ RIGHT PANEL ═══════════════ -->
    <aside class="sidebar-right">
      <div class="right-header">
        <h2>AI 生成内容</h2>
        <select class="filter-select">
          <option>全部</option>
          <option>已完成</option>
          <option>生成中</option>
        </select>
      </div>

      <div class="right-content">
        <div class="right-empty-state">
          <!-- Document with sparkle illustration -->
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.35;">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="9" y1="15" x2="15" y2="15"/>
          </svg>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--color-primary)" stroke="none" style="position:relative; margin-top:-48px; margin-left:36px; opacity:0.4;">
            <path d="M12 2L13.09 8.26L20 9L13.09 9.74L12 16L10.91 9.74L4 9L10.91 8.26L12 2Z"/>
          </svg>
          <div class="right-empty-title">还没有生成内容</div>
          <div class="right-empty-desc">上传文件后，AI 将自动为你生成分析报告和知识总结</div>
        </div>
      </div>
    </aside>
  </div>

  <!-- ═══════════════ FLOATING ACTION BUTTON ═══════════════ -->
  <button class="fab" title="快速提问">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
      <line x1="9" y1="9" x2="15" y2="9"/>
      <line x1="12" y1="6" x2="12" y2="12"/>
    </svg>
    <span class="fab-tooltip">快速提问</span>
  </button>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font-family-base);
      font-size: var(--font-size-base);
      color: var(--color-text-primary);
      background: var(--color-bg);
      line-height: var(--line-height-normal);
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: var(--radius-full); }
    ::-webkit-scrollbar-thumb:hover { background: var(--color-text-tertiary); }

    /* Layout */
    .app-shell { display: flex; height: 100vh; width: 100vw; }

    /* Left Sidebar */
    .sidebar-left {
      width: 268px;
      min-width: 268px;
      background: var(--color-bg-inset);
      border-right: 1px solid var(--color-border-light);
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .sidebar-left .logo-area {
      padding: var(--space-lg) var(--space-md) var(--space-md);
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }
    .sidebar-left .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .sidebar-left .search-bar {
      margin: var(--space-sm) var(--space-md);
      position: relative;
    }
    .sidebar-left .search-bar input {
      width: 100%;
      height: 36px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-full);
      padding: 0 var(--space-md) 0 36px;
      background: var(--color-bg-alt);
      font-size: var(--font-size-sm);
      color: var(--color-text-primary);
      outline: none;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }
    .sidebar-left .search-bar input::placeholder { color: var(--color-text-tertiary); }
    .sidebar-left .search-bar input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(74, 155, 217, 0.15);
    }
    .sidebar-left .search-bar .search-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--color-text-tertiary);
    }
    .upload-btn {
      margin: var(--space-sm) var(--space-md);
      height: 40px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
      color: var(--color-text-inverse);
      border: none;
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: opacity var(--transition-fast), transform var(--transition-fast);
      box-shadow: var(--shadow-sm);
    }
    .upload-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .upload-btn:active { transform: translateY(0); }
    .drop-hint {
      text-align: center;
      font-size: var(--font-size-xs);
      color: var(--color-text-tertiary);
      margin: var(--space-xs) 0 var(--space-sm);
    }

    /* Sidebar empty state */
    .sidebar-empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl) var(--space-lg);
      text-align: center;
    }
    .sidebar-empty-text {
      margin-top: var(--space-md);
      font-size: var(--font-size-sm);
      color: var(--color-text-tertiary);
      line-height: var(--line-height-relaxed);
      max-width: 220px;
    }
    .sidebar-empty-sub {
      margin-top: var(--space-sm);
      font-size: var(--font-size-xs);
      color: var(--color-text-tertiary);
      opacity: 0.7;
    }

    /* Center Main Area */
    .main-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--color-bg);
      height: 100%;
    }
    .top-bar {
      height: 60px;
      border-bottom: 1px solid var(--color-border-light);
      background: var(--color-bg-alt);
      display: flex; align-items: center;
      padding: 0 var(--space-lg);
      gap: var(--space-sm);
      flex-shrink: 0;
    }
    .top-bar .avatar {
      width: 36px; height: 36px;
      border-radius: var(--radius-full);
      object-fit: cover;
      border: 2px solid var(--color-primary-light);
    }
    .top-bar .ai-info { flex: 1; }
    .top-bar .ai-name {
      font-weight: var(--font-weight-semibold);
      font-size: var(--font-size-md);
    }
    .top-bar .ai-tagline {
      font-size: var(--font-size-xs);
      font-style: italic;
      color: var(--color-text-tertiary);
      margin-top: -1px;
    }
    .top-bar .ai-status {
      font-size: var(--font-size-xs);
      color: var(--state-success);
      display: flex; align-items: center; gap: 4px;
    }
    .top-bar .ai-status .status-dot {
      width: 6px; height: 6px;
      background: var(--state-success);
      border-radius: 50%;
      display: inline-block;
    }
    .top-bar .settings-btn {
      width: 34px; height: 34px;
      border: none; background: transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--color-text-tertiary);
      transition: background var(--transition-fast), color var(--transition-fast);
    }
    .top-bar .settings-btn:hover { background: var(--color-bg-hover); color: var(--color-text-secondary); }

    /* Chat area */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-lg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Guide card */
    .guide-card {
      max-width: 520px;
      width: 100%;
      background: var(--color-bg-alt);
      border: 1px solid var(--color-border-light);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .guide-card .guide-avatar {
      width: 64px; height: 64px;
      border-radius: var(--radius-full);
      object-fit: cover;
      border: 3px solid var(--color-primary-light);
      margin-bottom: var(--space-md);
    }
    .guide-card .guide-title {
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-bold);
      color: var(--color-text-primary);
      margin-bottom: var(--space-sm);
    }
    .guide-card .guide-body {
      font-size: var(--font-size-base);
      color: var(--color-text-secondary);
      line-height: var(--line-height-relaxed);
      margin-bottom: var(--space-lg);
    }

    /* Guide steps */
    .guide-step {
      display: flex;
      align-items: flex-start;
      gap: var(--space-md);
      text-align: left;
      width: 100%;
      padding: var(--space-md) 0;
      border-bottom: 1px solid var(--color-border-subtle);
    }
    .guide-step:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .guide-step .step-badge {
      width: 36px; height: 36px;
      min-width: 36px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
      color: var(--color-text-inverse);
      border-radius: var(--radius-full);
      display: flex; align-items: center; justify-content: center;
      font-size: var(--font-size-md);
      font-weight: var(--font-weight-bold);
    }
    .guide-step .step-content {
      flex: 1;
      padding-top: 2px;
    }
    .guide-step .step-title {
      font-size: var(--font-size-md);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
      margin-bottom: 2px;
    }
    .guide-step .step-desc {
      font-size: var(--font-size-sm);
      color: var(--color-text-tertiary);
      line-height: var(--line-height-normal);
    }

    /* Input area */
    .input-area {
      padding: var(--space-md) var(--space-lg) var(--space-lg);
      background: var(--color-bg-alt);
      border-top: 1px solid var(--color-border-light);
      flex-shrink: 0;
    }
    .input-wrapper {
      display: flex; align-items: center; gap: var(--space-sm);
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 6px 6px 6px var(--space-md);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }
    .input-wrapper:focus-within {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(74, 155, 217, 0.15);
    }
    .input-wrapper.disabled {
      opacity: 0.6;
      pointer-events: none;
    }
    .input-wrapper input {
      flex: 1;
      border: none; background: transparent;
      font-size: var(--font-size-base);
      color: var(--color-text-primary);
      outline: none;
      font-family: var(--font-family-base);
    }
    .input-wrapper input::placeholder { color: var(--color-text-tertiary); }
    .input-wrapper input:disabled { cursor: not-allowed; }
    .input-wrapper .attach-btn {
      width: 34px; height: 34px;
      border: none; background: transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--color-text-tertiary);
      transition: background var(--transition-fast), color var(--transition-fast);
      flex-shrink: 0;
    }
    .input-wrapper .attach-btn:hover { background: var(--color-bg-hover); color: var(--color-text-secondary); }
    .input-wrapper .attach-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .input-wrapper .send-btn {
      width: 36px; height: 36px;
      border: none;
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
      border-radius: var(--radius-full);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--color-text-inverse);
      flex-shrink: 0;
      transition: opacity var(--transition-fast), transform var(--transition-fast);
      box-shadow: var(--shadow-sm);
    }
    .input-wrapper .send-btn:hover { opacity: 0.9; transform: scale(1.05); }
    .input-wrapper .send-btn:active { transform: scale(1); }
    .input-wrapper .send-btn.disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }
    .input-hint {
      text-align: right;
      font-size: var(--font-size-xs);
      color: var(--color-text-tertiary);
      margin-top: var(--space-xs);
      padding-right: var(--space-xs);
    }

    /* Right Panel */
    .sidebar-right {
      width: 330px;
      min-width: 330px;
      background: var(--color-bg-alt);
      border-left: 1px solid var(--color-border-light);
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .right-header {
      padding: var(--space-md) var(--space-lg);
      border-bottom: 1px solid var(--color-border-light);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .right-header h2 {
      font-size: var(--font-size-md);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
    }
    .right-header .filter-select {
      font-size: var(--font-size-xs);
      color: var(--color-text-secondary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: 4px 8px;
      background: var(--color-bg);
      cursor: pointer;
      outline: none;
      font-family: var(--font-family-base);
    }
    .right-content {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-md) var(--space-lg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Right empty state */
    .right-empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: var(--space-xl) 0;
    }
    .right-empty-title {
      margin-top: var(--space-md);
      font-size: var(--font-size-md);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-secondary);
    }
    .right-empty-desc {
      margin-top: var(--space-sm);
      font-size: var(--font-size-sm);
      color: var(--color-text-tertiary);
      max-width: 240px;
      line-height: var(--line-height-relaxed);
    }

    /* Floating Action Button */
    .fab {
      position: fixed;
      bottom: 28px;
      right: 28px;
      width: 52px; height: 52px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
      border-radius: var(--radius-full);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-float);
      border: none;
      z-index: 100;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
    }
    .fab:hover {
      transform: scale(1.1);
      box-shadow: 0 16px 40px rgba(74, 155, 217, 0.35);
    }
    .fab:active { transform: scale(1.05); }
    .fab-tooltip {
      position: absolute;
      right: 62px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--color-text-primary);
      color: var(--color-text-inverse);
      font-size: var(--font-size-xs);
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-fast);
    }
    .fab-tooltip::after {
      content: '';
      position: absolute;
      right: -5px;
      top: 50%;
      transform: translateY(-50%);
      border: 5px solid transparent;
      border-left-color: var(--color-text-primary);
      border-right: none;
    }
    .fab:hover .fab-tooltip { opacity: 1; }
  </style>
</body>
</html>
