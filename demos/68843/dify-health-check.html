<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dify 配置体检中心</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
  .container{max-width:900px;margin:0 auto;padding:40px 20px}
  h1{font-size:28px;text-align:center;margin-bottom:8px;background:linear-gradient(135deg,#3b82f6,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .subtitle{text-align:center;color:#94a3b8;font-size:14px;margin-bottom:40px}
  .section{background:#1e293b;border-radius:12px;padding:24px;margin-bottom:20px;border:1px solid #334155}
  .section h2{font-size:16px;margin-bottom:16px;color:#38bdf8}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .field label{display:block;font-size:12px;color:#94a3b8;margin-bottom:4px}
  .field input,.field select{width:100%;padding:10px 12px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:14px;font-family:monospace}
  .field input:focus{outline:none;border-color:#3b82f6}
  .btn{display:block;width:100%;padding:14px;background:linear-gradient(135deg,#3b82f6,#06b6d4);border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;margin:24px 0;transition:opacity .2s}
  .btn:hover{opacity:.9}
  .results{display:none}
  .results.show{display:block}
  .score-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-bottom:24px}
  .score-card{background:#0f172a;border-radius:10px;padding:16px;text-align:center;border:1px solid #334155}
  .score-card .icon{font-size:24px;margin-bottom:6px}
  .score-card .name{font-size:11px;color:#94a3b8;margin-bottom:4px}
  .score-card .status{font-size:13px;font-weight:bold}
  .status-red{color:#ef4444}.status-yellow{color:#eab308}.status-green{color:#22c55e}
  .warnings{margin-top:16px}
  .warning{padding:12px 16px;border-radius:8px;margin-bottom:8px;font-size:13px;display:flex;align-items:flex-start;gap:8px}
  .warning.red{background:#7f1d1d33;border:1px solid #7f1d1d;color:#fca5a5}
  .warning.yellow{background:#713f1233;border:1px solid #713f12;color:#fde047}
  .warning .badge{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:bold;white-space:nowrap}
  .badge.red{background:#dc2626;color:#fff}.badge.yellow{background:#ca8a04;color:#000}
  .recommend{margin-top:20px;padding:20px;background:#0c4a6e33;border:1px solid #0c4a6e;border-radius:10px}
  .recommend h3{font-size:14px;color:#38bdf8;margin-bottom:12px}
  .recommend ul{list-style:none}
  .recommend li{font-size:13px;color:#cbd5e1;padding:4px 0}
  .recommend li::before{content:"→ ";color:#38bdf8;font-family:monospace}
  .quick-fill{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
  .quick-fill button{padding:8px 16px;background:#1e293b;border:1px solid #334155;border-radius:20px;color:#94a3b8;cursor:pointer;font-size:12px}
  .quick-fill button:hover{background:#334155;color:#e2e8f0}
</style>
</head>
<body>
<div class="container">
  <h1>🔬 Dify 配置体检中心</h1>
  <p class="subtitle">粘贴你的配置参数，一键诊断 6 层瓶颈</p>

  <div class="quick-fill">
    <button onclick="fillDefault()">📋 填入默认配置</button>
    <button onclick="fillProd4C()">🖥️ 填入 4核8G 示例</button>
    <button onclick="fillProd8C()">🖥️ 填入 8核16G 示例</button>
  </div>

  <div class="section">
    <h2>⚙️ 核心配置参数</h2>
    <div class="grid">
      <div class="field"><label>SERVER_WORKER_AMOUNT</label><input id="swa" type="number" placeholder="默认 1"></div>
      <div class="field"><label>SERVER_WORKER_CONNECTIONS</label><input id="swc" type="number" placeholder="默认 10"></div>
      <div class="field"><label>GRAPH_ENGINE_MIN_WORKERS</label><input id="gem" type="number" placeholder="默认 3"></div>
      <div class="field"><label>MAX_PARALLEL_LIMIT</label><input id="mpl" type="number" placeholder="默认 10"></div>
      <div class="field"><label>CELERY_WORKER_AMOUNT</label><input id="cwa" type="number" placeholder="默认 4"></div>
      <div class="field"><label>TENANT_ISOLATED_TASK_CONCURRENCY</label><input id="titc" type="number" placeholder="默认 1"></div>
      <div class="field"><label>SQLALCHEMY_POOL_SIZE</label><input id="sps" type="number" placeholder="默认 30"></div>
      <div class="field"><label>APP_MAX_ACTIVE_REQUESTS</label><input id="amar" type="number" placeholder="默认 0(无限制)"></div>
      <div class="field"><label>MODEL_RPM_LIMIT</label><input id="mrpm" type="number" placeholder="你的Key RPM"></div>
    </div>
  </div>

  <button class="btn" onclick="diagnose()">🔍 一键诊断</button>

  <div class="results" id="results">
    <div class="section">
      <h2>📊 健康度评分</h2>
      <div class="score-grid" id="scoreGrid"></div>
    </div>
    <div class="section" id="warningsSection" style="display:none">
      <h2>⚠️ 发现的问题</h2>
      <div class="warnings" id="warnings"></div>
    </div>
    <div class="recommend" id="recommend">
      <h3>💡 优化建议</h3>
      <ul id="recList"></ul>
    </div>
    <p style="text-align:center;color:#64748b;font-size:12px;margin-top:16px">
      ⚠️ 本工具提供诊断建议，生产环境请在测试后应用。完整配置方案请关注「辉的技术笔记」。
    </p>
  </div>
</div>

<script>
function getVal(id){return parseInt(document.getElementById(id).value)||0}

function fillDefault(){
  document.getElementById('swa').value=1
  document.getElementById('swc').value=10
  document.getElementById('gem').value=3
  document.getElementById('mpl').value=10
  document.getElementById('cwa').value=4
  document.getElementById('titc').value=1
  document.getElementById('sps').value=30
  document.getElementById('amar').value=0
  document.getElementById('mrpm').value=60
}

function fillProd4C(){
  document.getElementById('swa').value=2
  document.getElementById('swc').value=50
  document.getElementById('gem').value=5
  document.getElementById('mpl').value=20
  document.getElementById('cwa').value=4
  document.getElementById('titc').value=3
  document.getElementById('sps').value=50
  document.getElementById('amar').value=30
  document.getElementById('mrpm').value=200
}

function fillProd8C(){
  document.getElementById('swa').value=4
  document.getElementById('swc').value=100
  document.getElementById('gem').value=8
  document.getElementById('mpl').value=50
  document.getElementById('cwa').value=8
  document.getElementById('titc').value=5
  document.getElementById('sps').value=80
  document.getElementById('amar').value=50
  document.getElementById('mrpm').value=500
}

function diagnose(){
  const swa=getVal('swa'),swc=getVal('swc'),gem=getVal('gem')
  const mpl=getVal('mpl'),cwa=getVal('cwa'),titc=getVal('titc')
  const sps=getVal('sps'),amar=getVal('amar'),mrpm=getVal('mrpm')

  const layers=[
    {name:'HTTP接入层',icon:'🌐',status:swa>=2?'green':swa===1?'yellow':'red',
     detail:swa<2?'Worker太少，gevent模式建议2-4':swa>4?'Worker过多，gevent无需多开':'健康'},
    {name:'HTTP连接数',icon:'🔌',status:swc>=50?'green':swc>=20?'yellow':'red',
     detail:swc<20?'连接数不足，建议≥50':swc>150?'连接数偏高，注意数据库联动':'健康'},
    {name:'工作流并行',icon:'⚡',status:gem>=5?'green':gem>=3?'yellow':'red',
     detail:gem<5?'并行能力弱，建议≥5':mpl<gem?'MAX_PARALLEL_LIMIT小于Worker数':'健康'},
    {name:'Celery异步',icon:'📦',status:cwa>=4?'green':cwa>=2?'yellow':'red',
     detail:cwa<4?'Worker不足':titc===1&&getVal('gem')>3?'注意TENANT_ISOLATED限制':'健康'},
    {name:'过载保护',icon:'🛡️',status:amar>=30?'green':amar>0?'yellow':'red',
     detail:amar===0?'无过载保护！高风险':amar<10?'保护阈值过低':'健康'},
    {name:'数据库连接池',icon:'🗄️',status:sps>=50?'green':sps>=30?'yellow':'red',
     detail:sps<50?'连接池偏小，建议≥50':swa*swc+cwa>sps+10?'连接池不够用，需调大':'健康'}
  ]

  let html=''
  layers.forEach(l=>{
    const cls=l.status==='green'?'status-green':l.status==='yellow'?'status-yellow':'status-red'
    const emoji=l.status==='green'?'✅':l.status==='yellow'?'⚠️':'🔴'
    html+=`<div class="score-card"><div class="icon">${l.icon}</div><div class="name">${l.name}</div><div class="${cls}">${emoji} ${l.detail}</div></div>`
  })
  document.getElementById('scoreGrid').innerHTML=html

  // Warnings
  const warnings=[]
  if(swa===1) warnings.push({level:'red',text:'HTTP Worker 为默认值 1，单进程无法应对多用户并发。gevent 模式下建议设为 2-4。'})
  if(swc===10) warnings.push({level:'yellow',text:'HTTP 连接数仅 10，这是并发瓶颈。建议调至 50-100。'})
  if(swa>4) warnings.push({level:'yellow',text:`你开了 ${swa} 个 Worker，但 gevent 协程模式通常 2-4 个就够。多余的 Worker 会白白吃掉数据库连接。`})
  if(gem<=1) warnings.push({level:'red',text:`GraphEngine 仅有 ${gem} 个 Worker，工作流并行节点会退化为串行执行！`})
  if(mpl<gem) warnings.push({level:'yellow',text:`MAX_PARALLEL_LIMIT(${mpl}) < Worker数(${gem})，并行分支上限卡脖子。`})
  if(titc===1) warnings.push({level:'yellow',text:'TENANT_ISOLATED_TASK_CONCURRENCY=1，多知识库场景下索引任务串行排队。'})
  if(amar===0) warnings.push({level:'red',text:'APP_MAX_ACTIVE_REQUESTS=0（无上限），突发流量会直接打崩服务。建议设 30-50。'})
  if(sps<50) warnings.push({level:'yellow',text:`数据库连接池仅 ${sps}，当 API Worker(${swa})×连接数(${swc})+Celery(${cwa}) 超过连接池时，会出现连接超时。`})
  if(mrpm<100) warnings.push({level:'yellow',text:`模型 Key RPM 仅 ${mrpm}，多用户并发时极易触发 429。建议多 Key 负载均衡。`})

  const warnDiv=document.getElementById('warnings')
  if(warnings.length>0){
    document.getElementById('warningsSection').style.display='block'
    warnDiv.innerHTML=warnings.map(w=>`<div class="warning ${w.level}"><span class="badge ${w.level}">${w.level==='red'?'严重':'注意'}</span>${w.text}</div>`).join('')
  }else{
    document.getElementById('warningsSection').style.display='none'
  }

  // Recommendations
  const recs=[]
  if(swa<2||swc<20) recs.push('调高 HTTP 层配置：gevent 模式设 SERVER_WORKER_AMOUNT=2-4，SERVER_WORKER_CONNECTIONS=50-100')
  if(gem<5||mpl<gem) recs.push(`调高 GraphEngine：GRAPH_ENGINE_MIN_WORKERS≥5，MAX_PARALLEL_LIMIT≥${Math.max(mpl,gem,20)}`)
  if(titc===1) recs.push('调高 TENANT_ISOLATED_TASK_CONCURRENCY=3-5（多知识库场景）')
  if(amar===0) recs.push('设置 APP_MAX_ACTIVE_REQUESTS=30-50，防止突发流量打崩服务')
  if(sps<50||swa*swc+cwa>sps+10) recs.push(`数据库连接池建议 SQLALCHEMY_POOL_SIZE≥${Math.max(50,swa*swc+cwa+20)}，同步检查 POSTGRES_MAX_CONNECTIONS`)
  if(mrpm<100) recs.push('模型 Key RPM 不足，建议配置 LiteLLM 多 Key 负载均衡（详见系列文章）')
  const greenCount=layers.filter(l=>l.status==='green').length
  const redCount=layers.filter(l=>l.status==='red').length
  recs.push(`总评：${greenCount}/6 项健康，${redCount} 项高危。${redCount===0?'配置总体合理！':redCount>=2?'建议尽快修复高危项。':'修复 1 个高危项后可达到生产级。'}`)

  document.getElementById('recList').innerHTML=recs.map(r=>`<li>${r}</li>`).join('')
  document.getElementById('results').classList.add('show')
}
</script>
</body>
</html>
