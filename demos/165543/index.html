<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记事簿 - 记录每一件事</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #f8fafc;
            --bg-card: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.03);
            --radius: 12px;
            --radius-sm: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .app-container {
            max-width: 960px;
            margin: 0 auto;
            padding: 20px 16px 80px;
        }

        /* Header */
        .app-header {
            text-align: center;
            padding: 32px 0 24px;
        }

        .app-header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }

        .app-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Stats Cards */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .stat-card .stat-number {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 4px;
        }

        .stat-card .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .stat-card.total .stat-number { color: var(--primary); }
        .stat-card.done .stat-number { color: var(--success); }
        .stat-card.pending .stat-number { color: var(--warning); }
        .stat-card.rate .stat-number { color: #a855f7; }

        /* Tabs */
        .tabs {
            display: flex;
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 4px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            color: var(--text);
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Add Event Form */
        .add-form {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            color: var(--text);
            background: #fafbfc;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
            background: white;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .form-row-full {
            margin-bottom: 12px;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 8px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            background: #e2e8f0;
            color: var(--text);
        }

        .btn-danger {
            background: #fee2e2;
            color: var(--danger);
        }

        .btn-danger:hover {
            background: #fecaca;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 13px;
        }

        .btn-icon {
            padding: 6px;
            background: transparent;
            color: var(--text-muted);
            border-radius: 6px;
        }

        .btn-icon:hover {
            background: #f1f5f9;
            color: var(--text);
        }

        /* Event List */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .list-title {
            font-size: 16px;
            font-weight: 600;
        }

        .filter-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .filter-chip {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-chip:hover {
            border-color: var(--primary-light);
            color: var(--primary);
        }

        .filter-chip.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .event-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .event-item {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            display: flex;
            gap: 14px;
            align-items: flex-start;
            transition: all 0.2s;
            border-left: 4px solid transparent;
        }

        .event-item:hover {
            box-shadow: var(--shadow-md);
        }

        .event-item.completed {
            opacity: 0.6;
        }

        .event-item.completed .event-title {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .event-item.priority-high { border-left-color: var(--danger); }
        .event-item.priority-medium { border-left-color: var(--warning); }
        .event-item.priority-low { border-left-color: var(--success); }

        .event-checkbox {
            margin-top: 2px;
            flex-shrink: 0;
        }

        .custom-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--border);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            background: white;
        }

        .custom-checkbox:hover {
            border-color: var(--primary-light);
        }

        .custom-checkbox.checked {
            background: var(--success);
            border-color: var(--success);
        }

        .custom-checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 13px;
            font-weight: bold;
        }

        .event-content {
            flex: 1;
            min-width: 0;
        }

        .event-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .event-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .event-meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .event-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .tag-category {
            background: #eef2ff;
            color: var(--primary);
        }

        .tag-date {
            color: var(--text-muted);
            font-size: 12px;
        }

        .tag-overdue {
            background: #fee2e2;
            color: var(--danger);
        }

        .event-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }

        .empty-state .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* Date Picker Section */
        .date-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
            background: var(--bg-card);
            padding: 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .date-nav button {
            width: 36px;
            height: 36px;
            border: 1px solid var(--border);
            background: white;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 16px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .date-nav button:hover {
            background: #f1f5f9;
            color: var(--text);
        }

        .date-nav .current-date {
            font-size: 16px;
            font-weight: 600;
            min-width: 160px;
            text-align: center;
        }

        .date-nav input[type="date"] {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            cursor: pointer;
        }

        /* Calendar */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 20px;
            background: var(--bg-card);
            padding: 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .calendar-header {
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            padding: 8px 0;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            font-size: 13px;
        }

        .calendar-day:hover {
            background: #f1f5f9;
        }

        .calendar-day.other-month {
            color: var(--text-muted);
            opacity: 0.4;
        }

        .calendar-day.today {
            background: #eef2ff;
            color: var(--primary);
            font-weight: 600;
        }

        .calendar-day.selected {
            background: var(--primary);
            color: white;
        }

        .calendar-day .day-dot {
            position: absolute;
            bottom: 4px;
            display: flex;
            gap: 2px;
        }

        .calendar-day .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--success);
        }

        .calendar-day .dot.pending {
            background: var(--warning);
        }

        .calendar-day.selected .dot {
            background: white;
        }

        /* Charts */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .chart-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .chart-card.full {
            grid-column: 1 / -1;
        }

        .chart-card h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text);
        }

        .chart-container {
            position: relative;
            height: 240px;
        }

        .chart-card.full .chart-container {
            height: 280px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
            padding: 20px;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-card);
            border-radius: var(--radius);
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            transform: translateY(20px);
            transition: transform 0.2s;
        }

        .modal-overlay.show .modal {
            transform: translateY(0);
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-muted);
            padding: 4px;
        }

        .modal-close:hover {
            color: var(--text);
        }

        .modal-body {
            padding: 20px;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: var(--bg-card);
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
            border-left: 4px solid var(--primary);
        }

        .toast.success { border-left-color: var(--success); }
        .toast.warning { border-left-color: var(--warning); }
        .toast.error { border-left-color: var(--danger); }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Category colors */
        .cat-work { background: #dbeafe; color: #2563eb; }
        .cat-life { background: #dcfce7; color: #16a34a; }
        .cat-study { background: #fef3c7; color: #d97706; }
        .cat-health { background: #fce7f3; color: #db2777; }
        .cat-other { background: #f1f5f9; color: #64748b; }

        /* Responsive */
        @media (max-width: 640px) {
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            .app-header h1 {
                font-size: 24px;
            }

            .event-meta {
                gap: 8px;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1>✨ 记事簿</h1>
            <p>记录每一件事，让想法不再溜走</p>
        </header>

        <!-- Stats -->
        <div class="stats-row">
            <div class="stat-card total">
                <div class="stat-number" id="statTotal">0</div>
                <div class="stat-label">总事件</div>
            </div>
            <div class="stat-card done">
                <div class="stat-number" id="statDone">0</div>
                <div class="stat-label">已完成</div>
            </div>
            <div class="stat-card pending">
                <div class="stat-number" id="statPending">0</div>
                <div class="stat-label">待完成</div>
            </div>
            <div class="stat-card rate">
                <div class="stat-number" id="statRate">0%</div>
                <div class="stat-label">完成率</div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="today">今日</button>
            <button class="tab-btn" data-tab="all">全部</button>
            <button class="tab-btn" data-tab="calendar">日历</button>
            <button class="tab-btn" data-tab="stats">统计</button>
        </div>

        <!-- Tab: Today -->
        <div class="tab-content active" id="tab-today">
            <!-- Add Form -->
            <div class="add-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>事件标题</label>
                        <input type="text" id="eventTitle" placeholder="要做什么？" maxlength="100">
                    </div>
                    <div class="form-group">
                        <label>分类</label>
                        <select id="eventCategory">
                            <option value="work">工作</option>
                            <option value="life">生活</option>
                            <option value="study">学习</option>
                            <option value="health">健康</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>优先级</label>
                        <select id="eventPriority">
                            <option value="low">普通</option>
                            <option value="medium">重要</option>
                            <option value="high">紧急</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>日期</label>
                        <input type="date" id="eventDate">
                    </div>
                    <div class="form-group">
                        <label>提醒时间</label>
                        <input type="time" id="eventTime">
                    </div>
                    <div class="form-group">
                        <label style="visibility: hidden">操作</label>
                        <button class="btn btn-primary" id="addBtn" onclick="addEvent()">+ 添加事件</button>
                    </div>
                </div>
                <div class="form-row-full">
                    <div class="form-group">
                        <label>备注（可选）</label>
                        <textarea id="eventDesc" placeholder="补充细节..." maxlength="500"></textarea>
                    </div>
                </div>
            </div>

            <div class="list-header">
                <div class="list-title" id="todayTitle">今日待办</div>
            </div>
            <div class="filter-bar">
                <span class="filter-chip active" data-filter="all" onclick="filterEvents('all', 'today')">全部</span>
                <span class="filter-chip" data-filter="pending" onclick="filterEvents('pending', 'today')">待完成</span>
                <span class="filter-chip" data-filter="done" onclick="filterEvents('done', 'today')">已完成</span>
            </div>
            <div class="event-list" id="todayList"></div>
        </div>

        <!-- Tab: All -->
        <div class="tab-content" id="tab-all">
            <div class="filter-bar">
                <span class="filter-chip active" data-filter="all" onclick="filterEvents('all', 'all')">全部</span>
                <span class="filter-chip" data-filter="pending" onclick="filterEvents('pending', 'all')">待完成</span>
                <span class="filter-chip" data-filter="done" onclick="filterEvents('done', 'all')">已完成</span>
                <span class="filter-chip" data-filter="work" onclick="filterEvents('work', 'all')">工作</span>
                <span class="filter-chip" data-filter="life" onclick="filterEvents('life', 'all')">生活</span>
                <span class="filter-chip" data-filter="study" onclick="filterEvents('study', 'all')">学习</span>
                <span class="filter-chip" data-filter="health" onclick="filterEvents('health', 'all')">健康</span>
            </div>
            <div class="event-list" id="allList"></div>
        </div>

        <!-- Tab: Calendar -->
        <div class="tab-content" id="tab-calendar">
            <div class="date-nav">
                <button onclick="changeMonth(-1)">‹</button>
                <div class="current-date" id="calendarMonth">2026年7月</div>
                <button onclick="changeMonth(1)">›</button>
                <input type="date" id="calendarDatePicker" onchange="jumpToDate()">
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
            <div class="list-header">
                <div class="list-title" id="selectedDateTitle">选择日期查看事件</div>
            </div>
            <div class="event-list" id="calendarDayList"></div>
        </div>

        <!-- Tab: Stats -->
        <div class="tab-content" id="tab-stats">
            <div class="charts-grid">
                <div class="chart-card">
                    <h3>完成率趋势（近7天）</h3>
                    <div class="chart-container">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>
                <div class="chart-card">
                    <h3>分类占比</h3>
                    <div class="chart-container">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>
                <div class="chart-card full">
                    <h3>月度完成热力图</h3>
                    <div class="chart-container">
                        <canvas id="heatmapChart"></canvas>
                    </div>
                </div>
                <div class="chart-card">
                    <h3>优先级分布</h3>
                    <div class="chart-container">
                        <canvas id="priorityChart"></canvas>
                    </div>
                </div>
                <div class="chart-card">
                    <h3>连续记录</h3>
                    <div class="chart-container" style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;">
                        <div style="font-size:48px;font-weight:700;color:var(--primary);" id="streakDays">0</div>
                        <div style="color:var(--text-secondary);font-size:14px;">天连续记录</div>
                        <div style="color:var(--text-muted);font-size:12px;margin-top:8px;">最长记录：<span id="maxStreak">0</span> 天</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-header">
                <h2>编辑事件</h2>
                <button class="modal-close" onclick="closeEditModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group" style="margin-bottom:12px;">
                    <label>事件标题</label>
                    <input type="text" id="editTitle" maxlength="100">
                </div>
                <div class="form-row" style="margin-bottom:12px;">
                    <div class="form-group">
                        <label>分类</label>
                        <select id="editCategory">
                            <option value="work">工作</option>
                            <option value="life">生活</option>
                            <option value="study">学习</option>
                            <option value="health">健康</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>优先级</label>
                        <select id="editPriority">
                            <option value="low">普通</option>
                            <option value="medium">重要</option>
                            <option value="high">紧急</option>
                        </select>
                    </div>
                </div>
                <div class="form-row" style="margin-bottom:12px;">
                    <div class="form-group">
                        <label>日期</label>
                        <input type="date" id="editDate">
                    </div>
                    <div class="form-group">
                        <label>提醒时间</label>
                        <input type="time" id="editTime">
                    </div>
                </div>
                <div class="form-group" style="margin-bottom:16px;">
                    <label>备注</label>
                    <textarea id="editDesc" maxlength="500" rows="3"></textarea>
                </div>
                <div class="form-actions">
                    <button class="btn btn-danger btn-sm" onclick="deleteEvent()">删除</button>
                    <button class="btn btn-secondary btn-sm" onclick="closeEditModal()">取消</button>
                    <button class="btn btn-primary btn-sm" onclick="saveEdit()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ==================== Data Layer ====================
        const STORAGE_KEY = 'jianshibu_events';
        const CATEGORY_MAP = {
            work: '工作',
            life: '生活',
            study: '学习',
            health: '健康',
            other: '其他'
        };
        const PRIORITY_MAP = {
            high: '紧急',
            medium: '重要',
            low: '普通'
        };

        let events = [];
        let currentFilter = 'all';
        let currentTab = 'today';
        let editingId = null;
        let calendarDate = new Date();
        let selectedDate = null;
        let charts = {};

        function loadEvents() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                events = data ? JSON.parse(data) : [];
            } catch (e) {
                events = [];
            }
        }

        function saveEvents() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        // ==================== Event CRUD ====================
        function addEvent() {
            const title = document.getElementById('eventTitle').value.trim();
            if (!title) {
                showToast('请输入事件标题', 'warning');
                return;
            }

            const event = {
                id: generateId(),
                title: title,
                desc: document.getElementById('eventDesc').value.trim(),
                category: document.getElementById('eventCategory').value,
                priority: document.getElementById('eventPriority').value,
                date: document.getElementById('eventDate').value || formatDate(new Date()),
                time: document.getElementById('eventTime').value,
                completed: false,
                createdAt: new Date().toISOString(),
                notified: false
            };

            events.unshift(event);
            saveEvents();
            renderAll();
            scheduleNotification(event);

            // Clear form
            document.getElementById('eventTitle').value = '';
            document.getElementById('eventDesc').value = '';
            document.getElementById('eventTime').value = '';

            showToast('事件已添加', 'success');
        }

        function toggleComplete(id) {
            const event = events.find(e => e.id === id);
            if (event) {
                event.completed = !event.completed;
                event.completedAt = event.completed ? new Date().toISOString() : null;
                saveEvents();
                renderAll();
                showToast(event.completed ? '已完成 ✓' : '已恢复', 'success');
            }
        }

        function openEditModal(id) {
            const event = events.find(e => e.id === id);
            if (!event) return;

            editingId = id;
            document.getElementById('editTitle').value = event.title;
            document.getElementById('editCategory').value = event.category;
            document.getElementById('editPriority').value = event.priority;
            document.getElementById('editDate').value = event.date;
            document.getElementById('editTime').value = event.time || '';
            document.getElementById('editDesc').value = event.desc || '';

            document.getElementById('editModal').classList.add('show');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
            editingId = null;
        }

        function saveEdit() {
            if (!editingId) return;

            const event = events.find(e => e.id === editingId);
            if (!event) return;

            const title = document.getElementById('editTitle').value.trim();
            if (!title) {
                showToast('请输入事件标题', 'warning');
                return;
            }

            event.title = title;
            event.category = document.getElementById('editCategory').value;
            event.priority = document.getElementById('editPriority').value;
            event.date = document.getElementById('editDate').value;
            event.time = document.getElementById('editTime').value;
            event.desc = document.getElementById('editDesc').value.trim();
            event.notified = false; // Reset notification on time change

            saveEvents();
            renderAll();
            scheduleNotification(event);
            closeEditModal();
            showToast('已保存修改', 'success');
        }

        function deleteEvent() {
            if (!editingId) return;
            if (!confirm('确定要删除这个事件吗？')) return;

            events = events.filter(e => e.id !== editingId);
            saveEvents();
            renderAll();
            closeEditModal();
            showToast('已删除', 'success');
        }

        // ==================== Filtering ====================
        function filterEvents(filter, tab) {
            currentFilter = filter;
            if (tab === 'today') {
                document.querySelectorAll('#tab-today .filter-chip').forEach(c => {
                    c.classList.toggle('active', c.dataset.filter === filter);
                });
            } else {
                document.querySelectorAll('#tab-all .filter-chip').forEach(c => {
                    c.classList.toggle('active', c.dataset.filter === filter);
                });
            }
            renderEventLists();
        }

        function getFilteredEvents(sourceEvents) {
            switch (currentFilter) {
                case 'pending':
                    return sourceEvents.filter(e => !e.completed);
                case 'done':
                    return sourceEvents.filter(e => e.completed);
                case 'work':
                case 'life':
                case 'study':
                case 'health':
                    return sourceEvents.filter(e => e.category === currentFilter);
                default:
                    return sourceEvents;
            }
        }

        // ==================== Rendering ====================
        function renderAll() {
            updateStats();
            renderEventLists();
            renderCalendar();
            renderCharts();
        }

        function updateStats() {
            const total = events.length;
            const done = events.filter(e => e.completed).length;
            const pending = total - done;
            const rate = total > 0 ? Math.round((done / total) * 100) : 0;

            document.getElementById('statTotal').textContent = total;
            document.getElementById('statDone').textContent = done;
            document.getElementById('statPending').textContent = pending;
            document.getElementById('statRate').textContent = rate + '%';
        }

        function renderEventLists() {
            const today = formatDate(new Date());
            const todayEvents = getFilteredEvents(events.filter(e => e.date === today));
            const allEvents = getFilteredEvents([...events].sort((a, b) => {
                if (a.completed !== b.completed) return a.completed ? 1 : -1;
                return new Date(b.date) - new Date(a.date);
            }));

            document.getElementById('todayList').innerHTML = renderEventItems(todayEvents);
            document.getElementById('allList').innerHTML = renderEventItems(allEvents);

            // Update streak
            const streak = calculateStreak();
            document.getElementById('streakDays').textContent = streak.current;
            document.getElementById('maxStreak').textContent = streak.max;
        }

        function renderEventItems(eventList) {
            if (eventList.length === 0) {
                return `
                    <div class="empty-state">
                        <div class="empty-icon">📝</div>
                        <p>暂无事件，添加一个吧</p>
                    </div>
                `;
            }

            return eventList.map(event => {
                const isOverdue = !event.completed && event.date < formatDate(new Date());
                const categoryClass = 'cat-' + event.category;

                return `
                    <div class="event-item priority-${event.priority} ${event.completed ? 'completed' : ''}">
                        <div class="event-checkbox">
                            <div class="custom-checkbox ${event.completed ? 'checked' : ''}"
                                 onclick="toggleComplete('${event.id}')"></div>
                        </div>
                        <div class="event-content" ondblclick="openEditModal('${event.id}')">
                            <div class="event-title">${escapeHtml(event.title)}</div>
                            ${event.desc ? `<div class="event-desc">${escapeHtml(event.desc)}</div>` : ''}
                            <div class="event-meta">
                                <span class="event-tag ${categoryClass}">${CATEGORY_MAP[event.category]}</span>
                                <span class="event-tag" style="background:${priorityBg(event.priority)};color:${priorityColor(event.priority)};">
                                    ${PRIORITY_MAP[event.priority]}
                                </span>
                                <span class="tag-date">📅 ${formatDisplayDate(event.date)}</span>
                                ${event.time ? `<span class="tag-date">⏰ ${event.time}</span>` : ''}
                                ${isOverdue ? '<span class="event-tag tag-overdue">已过期</span>' : ''}
                            </div>
                        </div>
                        <div class="event-actions">
                            <button class="btn-icon btn-sm" onclick="openEditModal('${event.id}')" title="编辑">✏️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function priorityBg(p) {
            return p === 'high' ? '#fee2e2' : p === 'medium' ? '#fef3c7' : '#dcfce7';
        }
        function priorityColor(p) {
            return p === 'high' ? '#dc2626' : p === 'medium' ? '#d97706' : '#16a34a';
        }

        // ==================== Calendar ====================
        function renderCalendar() {
            const year = calendarDate.getFullYear();
            const month = calendarDate.getMonth();

            document.getElementById('calendarMonth').textContent = `${year}年${month + 1}月`;

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startWeekday = firstDay.getDay();
            const daysInMonth = lastDay.getDate();

            const prevMonthLastDay = new Date(year, month, 0).getDate();

            let html = '';
            const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            weekdays.forEach(d => {
                html += `<div class="calendar-header">${d}</div>`;
            });

            // Previous month days
            for (let i = startWeekday - 1; i >= 0; i--) {
                const day = prevMonthLastDay - i;
                const dateStr = formatDate(new Date(year, month - 1, day));
                html += renderCalendarDay(day, dateStr, true);
            }

            // Current month days
            const todayStr = formatDate(new Date());
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = formatDate(new Date(year, month, day));
                const isToday = dateStr === todayStr;
                const isSelected = selectedDate === dateStr;
                html += renderCalendarDay(day, dateStr, false, isToday, isSelected);
            }

            // Next month days
            const totalCells = Math.ceil((startWeekday + daysInMonth) / 7) * 7;
            const remaining = totalCells - (startWeekday + daysInMonth);
            for (let day = 1; day <= remaining; day++) {
                const dateStr = formatDate(new Date(year, month + 1, day));
                html += renderCalendarDay(day, dateStr, true);
            }

            document.getElementById('calendarGrid').innerHTML = html;
        }

        function renderCalendarDay(day, dateStr, otherMonth, isToday, isSelected) {
            const dayEvents = events.filter(e => e.date === dateStr);
            const hasEvents = dayEvents.length > 0;
            const hasPending = dayEvents.some(e => !e.completed);
            const hasDone = dayEvents.some(e => e.completed);

            let classes = 'calendar-day';
            if (otherMonth) classes += ' other-month';
            if (isToday) classes += ' today';
            if (isSelected) classes += ' selected';

            let dots = '';
            if (hasEvents) {
                dots = '<div class="day-dot">';
                if (hasPending) dots += '<div class="dot pending"></div>';
                if (hasDone) dots += '<div class="dot"></div>';
                dots += '</div>';
            }

            return `<div class="${classes}" onclick="selectDate('${dateStr}')">
                ${day}
                ${dots}
            </div>`;
        }

        function changeMonth(delta) {
            calendarDate.setMonth(calendarDate.getMonth() + delta);
            renderCalendar();
        }

        function jumpToDate() {
            const val = document.getElementById('calendarDatePicker').value;
            if (val) {
                calendarDate = new Date(val);
                selectedDate = val;
                renderCalendar();
                renderCalendarDayEvents();
            }
        }

        function selectDate(dateStr) {
            selectedDate = dateStr;
            renderCalendar();
            renderCalendarDayEvents();
        }

        function renderCalendarDayEvents() {
            if (!selectedDate) {
                document.getElementById('selectedDateTitle').textContent = '选择日期查看事件';
                document.getElementById('calendarDayList').innerHTML = '';
                return;
            }

            const dayEvents = events.filter(e => e.date === selectedDate)
                .sort((a, b) => a.completed - b.completed);

            document.getElementById('selectedDateTitle').textContent =
                `${formatDisplayDate(selectedDate)} 的事件 (${dayEvents.length})`;

            document.getElementById('calendarDayList').innerHTML = renderEventItems(dayEvents);
        }

        // ==================== Charts ====================
        function renderCharts() {
            renderTrendChart();
            renderCategoryChart();
            renderPriorityChart();
            renderHeatmapChart();
        }

        function renderTrendChart() {
            const ctx = document.getElementById('trendChart');
            if (!ctx) return;

            const days = [];
            const completedData = [];
            const totalData = [];

            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dateStr = formatDate(d);
                days.push(formatShortDate(dateStr));

                const dayEvents = events.filter(e => e.date === dateStr);
                totalData.push(dayEvents.length);
                completedData.push(dayEvents.filter(e => e.completed).length);
            }

            if (charts.trend) charts.trend.destroy();
            charts.trend = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: days,
                    datasets: [
                        {
                            label: '已完成',
                            data: completedData,
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            fill: true,
                            tension: 0.4,
                            pointRadius: 4,
                            pointBackgroundColor: '#10b981'
                        },
                        {
                            label: '总数',
                            data: totalData,
                            borderColor: '#6366f1',
                            backgroundColor: 'rgba(99, 102, 241, 0.1)',
                            fill: false,
                            tension: 0.4,
                            pointRadius: 4,
                            pointBackgroundColor: '#6366f1',
                            borderDash: [5, 5]
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { font: { size: 12 }, usePointStyle: true }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { stepSize: 1, font: { size: 11 } },
                            grid: { color: '#f1f5f9' }
                        },
                        x: {
                            ticks: { font: { size: 11 } },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        function renderCategoryChart() {
            const ctx = document.getElementById('categoryChart');
            if (!ctx) return;

            const counts = {};
            events.forEach(e => {
                counts[e.category] = (counts[e.category] || 0) + 1;
            });

            const labels = Object.keys(counts).map(k => CATEGORY_MAP[k] || k);
            const data = Object.values(counts);
            const colors = ['#3b82f6', '#22c55e', '#f59e0b', '#ec4899', '#64748b'];

            if (charts.category) charts.category.destroy();
            charts.category = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels.length ? labels : ['暂无数据'],
                    datasets: [{
                        data: data.length ? data : [1],
                        backgroundColor: data.length ? colors : ['#e2e8f0'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { font: { size: 12 }, usePointStyle: true, padding: 12 }
                        }
                    },
                    cutout: '65%'
                }
            });
        }

        function renderPriorityChart() {
            const ctx = document.getElementById('priorityChart');
            if (!ctx) return;

            const counts = { high: 0, medium: 0, low: 0 };
            events.forEach(e => {
                counts[e.priority] = (counts[e.priority] || 0) + 1;
            });

            if (charts.priority) charts.priority.destroy();
            charts.priority = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['紧急', '重要', '普通'],
                    datasets: [{
                        label: '事件数',
                        data: [counts.high, counts.medium, counts.low],
                        backgroundColor: ['#ef4444', '#f59e0b', '#10b981'],
                        borderRadius: 6,
                        barThickness: 32
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { stepSize: 1, font: { size: 11 } },
                            grid: { color: '#f1f5f9' }
                        },
                        x: {
                            ticks: { font: { size: 12 } },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        function renderHeatmapChart() {
            const ctx = document.getElementById('heatmapChart');
            if (!ctx) return;

            const year = calendarDate.getFullYear();
            const month = calendarDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const labels = [];
            const completedCounts = [];
            const totalCounts = [];

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = formatDate(new Date(year, month, day));
                labels.push(day + '日');
                const dayEvents = events.filter(e => e.date === dateStr);
                totalCounts.push(dayEvents.length);
                completedCounts.push(dayEvents.filter(e => e.completed).length);
            }

            if (charts.heatmap) charts.heatmap.destroy();
            charts.heatmap = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '已完成',
                            data: completedCounts,
                            backgroundColor: '#10b981',
                            borderRadius: 4,
                            barThickness: 'flex'
                        },
                        {
                            label: '待完成',
                            data: totalCounts.map((t, i) => t - completedCounts[i]),
                            backgroundColor: '#fbbf24',
                            borderRadius: 4,
                            barThickness: 'flex'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { font: { size: 12 }, usePointStyle: true }
                        }
                    },
                    scales: {
                        x: {
                            stacked: true,
                            ticks: { font: { size: 10 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 15 },
                            grid: { display: false }
                        },
                        y: {
                            stacked: true,
                            beginAtZero: true,
                            ticks: { stepSize: 1, font: { size: 11 } },
                            grid: { color: '#f1f5f9' }
                        }
                    }
                }
            });
        }

        // ==================== Notifications ====================
        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        }

        function scheduleNotification(event) {
            if (!event.time || !event.date || event.completed) return;

            const now = new Date();
            const eventDateTime = new Date(`${event.date}T${event.time}`);

            if (eventDateTime <= now) return;

            const delay = eventDateTime - now;
            if (delay > 2147483000) return; // Max setTimeout limit (~24 days)

            setTimeout(() => {
                // Re-check event still exists and is not completed
                const current = events.find(e => e.id === event.id);
                if (current && !current.completed && !current.notified) {
                    showBrowserNotification(current);
                    current.notified = true;
                    saveEvents();
                }
            }, delay);
        }

        function showBrowserNotification(event) {
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification('记事簿提醒', {
                    body: `${PRIORITY_MAP[event.priority]}｜${event.title}`,
                    icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">✨</text></svg>'
                });
            }
            showToast(`⏰ 提醒：${event.title}`, 'warning');
        }

        function initScheduledNotifications() {
            const now = new Date();
            events.forEach(event => {
                if (event.time && event.date && !event.completed && !event.notified) {
                    const eventDateTime = new Date(`${event.date}T${event.time}`);
                    if (eventDateTime > now) {
                        scheduleNotification(event);
                    }
                }
            });
        }

        // ==================== Streak Calculation ====================
        function calculateStreak() {
            if (events.length === 0) return { current: 0, max: 0 };

            const dateSet = new Set(events.map(e => e.date));
            const dates = Array.from(dateSet).sort();

            let maxStreak = 0;
            let currentStreak = 1;

            for (let i = 1; i < dates.length; i++) {
                const prev = new Date(dates[i - 1]);
                const curr = new Date(dates[i]);
                const diffDays = Math.round((curr - prev) / (1000 * 60 * 60 * 24));

                if (diffDays === 1) {
                    currentStreak++;
                    maxStreak = Math.max(maxStreak, currentStreak);
                } else {
                    currentStreak = 1;
                }
            }
            maxStreak = Math.max(maxStreak, currentStreak);

            // Current streak (ending today or yesterday)
            let curStreak = 0;
            const today = formatDate(new Date());
            const yesterday = formatDate(new Date(Date.now() - 86400000));

            if (dateSet.has(today) || dateSet.has(yesterday)) {
                let checkDate = dateSet.has(today) ? new Date() : new Date(Date.now() - 86400000);
                while (dateSet.has(formatDate(checkDate))) {
                    curStreak++;
                    checkDate.setDate(checkDate.getDate() - 1);
                }
            }

            return { current: curStreak, max: maxStreak };
        }

        // ==================== Utilities ====================
        function formatDate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function formatDisplayDate(dateStr) {
            const d = new Date(dateStr);
            const today = new Date();
            const diff = Math.round((d - today) / (1000 * 60 * 60 * 24));

            if (diff === 0) return '今天';
            if (diff === 1) return '明天';
            if (diff === -1) return '昨天';

            const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            return `${d.getMonth() + 1}月${d.getDate()}日 ${weekdays[d.getDay()]}`;
        }

        function formatShortDate(dateStr) {
            const d = new Date(dateStr);
            return `${d.getMonth() + 1}/${d.getDate()}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100px)';
                toast.style.transition = 'all 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // ==================== Tab Switching ====================
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                currentTab = tab;

                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById('tab-' + tab).classList.add('active');

                if (tab === 'calendar') {
                    renderCalendar();
                    if (!selectedDate) {
                        selectedDate = formatDate(new Date());
                        renderCalendarDayEvents();
                    }
                } else if (tab === 'stats') {
                    setTimeout(renderCharts, 50);
                }
            });
        });

        // Close modal on overlay click
        document.getElementById('editModal').addEventListener('click', (e) => {
            if (e.target.id === 'editModal') closeEditModal();
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeEditModal();
            if (e.key === 'Enter' && e.target.id === 'eventTitle') {
                e.preventDefault();
                addEvent();
            }
        });

        // ==================== Init ====================
        function init() {
            loadEvents();

            // Set default date to today
            const today = formatDate(new Date());
            document.getElementById('eventDate').value = today;
            selectedDate = today;

            renderAll();
            renderCalendarDayEvents();

            // Request notification permission
            requestNotificationPermission();
            initScheduledNotifications();

            // Check for overdue items on load
            const overdueCount = events.filter(e =>
                !e.completed && e.date < formatDate(new Date())
            ).length;
            if (overdueCount > 0) {
                showToast(`有 ${overdueCount} 个过期事件待处理`, 'warning');
            }
        }

        init();
    </script>
</body>
</html>
