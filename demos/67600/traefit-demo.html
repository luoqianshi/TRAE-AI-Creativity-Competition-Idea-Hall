<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TraeFit - AI 体重管理</title>
<style>
  :root {
    --bg: #0b1410;
    --bg2: #13221b;
    --bg3: #1a3026;
    --ink: #e8f0ec;
    --muted: #7a9a8a;
    --rule: #1f3d30;
    --accent: #3ddc97;
    --accent2: #ffb347;
    --danger: #ff6b6b;
    --info: #5bc0de;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg); color: var(--ink); line-height:1.6; font-size:15px;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width:520px; margin:0 auto; min-height:100vh; padding-bottom:2rem; }

  /* Header */
  .header {
    padding: 1.2rem 1.25rem 0.5rem;
    display:flex; justify-content:space-between; align-items:center;
  }
  .logo { font-size:1.4rem; font-weight:800; letter-spacing:-0.5px; }
  .logo span { color:var(--accent); }
  .date { font-size:0.8rem; color:var(--muted); }

  /* Section */
  .section { margin: 0 1rem 1.25rem; }
  .section-title {
    font-size:0.85rem; font-weight:600; color:var(--muted);
    text-transform:uppercase; letter-spacing:0.08em; margin-bottom:0.6rem;
    display:flex; align-items:center; gap:0.4rem;
  }

  /* Card */
  .card {
    background:var(--bg2); border:1px solid var(--rule); border-radius:16px;
    padding:1.1rem; transition:border-color 0.2s;
  }
  .card:hover { border-color:var(--rule); }

  /* Dashboard */
  .dashboard { text-align:center; padding:1.5rem 1rem; position:relative; }
  .ring-wrap { position:relative; width:200px; height:200px; margin:0 auto 1rem; }
  .ring-svg { width:100%; height:100%; transform:rotate(-90deg); }
  .ring-bg { fill:none; stroke:var(--bg3); stroke-width:12; }
  .ring-track { fill:none; stroke:var(--accent); stroke-width:12; stroke-linecap:round;
    stroke-dasharray:565.5; stroke-dashoffset:565.5; transition:stroke-dashoffset 1s ease;
  }
  .ring-track.over { stroke:var(--danger); }
  .ring-text { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }
  .ring-value { font-size:2.6rem; font-weight:800; line-height:1; }
  .ring-unit { font-size:0.75rem; color:var(--muted); margin-top:0.2rem; }
  .ring-label { font-size:0.8rem; color:var(--muted); margin-top:0.15rem; }

  .dash-stats { display:flex; justify-content:center; gap:2rem; margin-top:0.5rem; }
  .dash-stat { text-align:center; }
  .dash-stat .num { font-size:1.3rem; font-weight:700; }
  .dash-stat .num.in { color:var(--danger); }
  .dash-stat .num.out { color:var(--accent); }
  .dash-stat .lab { font-size:0.7rem; color:var(--muted); }

  /* Toggle button */
  .toggle-btn {
    width:100%; padding:0.7rem; background:var(--bg3); border:1px solid var(--rule);
    border-radius:12px; color:var(--ink); font-size:0.85rem; cursor:pointer;
    display:flex; align-items:center; justify-content:space-between;
    transition:all 0.2s;
  }
  .toggle-btn:hover { border-color:var(--accent); }
  .toggle-btn::after { content:'▼'; font-size:0.65rem; color:var(--muted); transition:transform 0.2s; }
  .toggle-btn.open::after { transform:rotate(180deg); }

  /* Form */
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.7rem; margin-top:0.8rem; }
  .form-row { display:flex; flex-direction:column; gap:0.25rem; }
  .form-row.full { grid-column:1/-1; }
  .form-row label { font-size:0.75rem; color:var(--muted); }
  .form-row input, .form-row select {
    background:var(--bg); border:1px solid var(--rule); border-radius:10px;
    padding:0.55rem 0.7rem; color:var(--ink); font-size:0.9rem; outline:none;
    transition:border-color 0.2s; width:100%;
  }
  .form-row input:focus, .form-row select:focus { border-color:var(--accent); }
  .form-row select { appearance:none; cursor:pointer; }

  .mode-select { display:flex; gap:0.5rem; margin-top:0.5rem; }
  .mode-btn {
    flex:1; padding:0.6rem; background:var(--bg); border:1px solid var(--rule);
    border-radius:10px; color:var(--muted); font-size:0.8rem; cursor:pointer;
    text-align:center; transition:all 0.2s;
  }
  .mode-btn.active { border-color:var(--accent); color:var(--accent); background:rgba(61,220,151,0.08); }

  .btn-primary {
    width:100%; padding:0.75rem; background:var(--accent); border:none;
    border-radius:12px; color:#000; font-size:0.9rem; font-weight:700;
    cursor:pointer; margin-top:0.8rem; transition:opacity 0.2s;
  }
  .btn-primary:hover { opacity:0.85; }

  /* Quick add */
  .quick-tabs { display:flex; gap:0.4rem; margin-bottom:0.7rem; }
  .qtab {
    flex:1; padding:0.5rem; background:var(--bg3); border:1px solid var(--rule);
    border-radius:10px; color:var(--muted); font-size:0.8rem; cursor:pointer;
    text-align:center; transition:all 0.2s;
  }
  .qtab.active { border-color:var(--accent); color:var(--accent); }

  .input-wrap { display:flex; gap:0.5rem; margin-bottom:0.7rem; }
  .input-wrap input {
    flex:1; background:var(--bg); border:1px solid var(--rule); border-radius:10px;
    padding:0.6rem 0.8rem; color:var(--ink); font-size:0.9rem; outline:none;
  }
  .input-wrap input:focus { border-color:var(--accent); }
  .input-wrap button {
    padding:0 1rem; background:var(--accent); border:none; border-radius:10px;
    color:#000; font-weight:700; cursor:pointer; font-size:0.85rem;
  }

  .chips { display:flex; flex-wrap:wrap; gap:0.4rem; }
  .chip {
    padding:0.35rem 0.7rem; background:var(--bg3); border:1px solid var(--rule);
    border-radius:20px; font-size:0.78rem; color:var(--muted); cursor:pointer;
    transition:all 0.15s; user-select:none;
  }
  .chip:hover { border-color:var(--accent); color:var(--accent); }
  .chip:active { transform:scale(0.96); }

  /* Nutrition bars */
  .nutri-list { display:flex; flex-direction:column; gap:0.7rem; }
  .nutri-item { display:flex; flex-direction:column; gap:0.25rem; }
  .nutri-top { display:flex; justify-content:space-between; font-size:0.78rem; }
  .nutri-top .name { color:var(--muted); }
  .nutri-top .val { color:var(--ink); font-weight:600; }
  .nutri-bar { height:6px; background:var(--bg3); border-radius:3px; overflow:hidden; }
  .nutri-bar-fill { height:100%; border-radius:3px; transition:width 0.6s ease; }
  .nutri-bar-fill.ok { background:var(--accent); }
  .nutri-bar-fill.warn { background:var(--accent2); }
  .nutri-bar-fill.bad { background:var(--danger); }

  /* Records */
  .record-item {
    display:flex; align-items:center; justify-content:space-between;
    padding:0.65rem 0; border-bottom:1px solid var(--rule);
  }
  .record-item:last-child { border-bottom:none; }
  .record-left { display:flex; align-items:center; gap:0.6rem; }
  .record-icon { width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:1rem; }
  .record-icon.food { background:rgba(255,107,107,0.12); }
  .record-icon.sport { background:rgba(61,220,151,0.12); }
  .record-name { font-size:0.85rem; color:var(--ink); }
  .record-sub { font-size:0.7rem; color:var(--muted); }
  .record-kcal { font-size:0.85rem; font-weight:700; }
  .record-kcal.in { color:var(--danger); }
  .record-kcal.out { color:var(--accent); }
  .record-del { background:none; border:none; color:var(--muted); cursor:pointer; font-size:1rem; margin-left:0.5rem; }
  .record-del:hover { color:var(--danger); }

  .empty { text-align:center; padding:1.5rem; color:var(--muted); font-size:0.85rem; }

  /* Suggestion */
  .suggest { background:rgba(61,220,151,0.06); border:1px solid var(--rule); border-radius:12px; padding:0.8rem 1rem; }
  .suggest-title { font-size:0.75rem; color:var(--accent); font-weight:600; margin-bottom:0.3rem; }
  .suggest-text { font-size:0.82rem; color:var(--muted); line-height:1.5; }

  /* Collapsible */
  .collapse { max-height:0; overflow:hidden; transition:max-height 0.3s ease; }
  .collapse.open { max-height:800px; }

  /* Animations */
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:translateY(0);} }
  .fade-in { animation:fadeIn 0.3s ease forwards; }

  /* Scrollbar */
  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--rule); border-radius:2px; }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="logo">Trae<span>Fit</span></div>
    <div class="date" id="todayDate"></div>
  </div>

  <!-- Dashboard -->
  <div class="section">
    <div class="card dashboard">
      <div class="ring-wrap">
        <svg class="ring-svg" viewBox="0 0 200 200">
          <circle class="ring-bg" cx="100" cy="100" r="90"/>
          <circle class="ring-track" id="ringTrack" cx="100" cy="100" r="90"/>
        </svg>
        <div class="ring-text">
          <div class="ring-value" id="remainKcal">--</div>
          <div class="ring-unit">kcal 剩余</div>
          <div class="ring-label" id="targetLabel">目标 --</div>
        </div>
      </div>
      <div class="dash-stats">
        <div class="dash-stat">
          <div class="num in" id="inKcal">0</div>
          <div class="lab">摄入</div>
        </div>
        <div class="dash-stat">
          <div class="num out" id="outKcal">0</div>
          <div class="lab">消耗</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Settings -->
  <div class="section">
    <button class="toggle-btn" id="settingToggle" onclick="toggleSettings()">⚙️ 个人设置与目标</button>
    <div class="collapse" id="settingPanel">
      <div class="card" style="margin-top:0.6rem;">
        <div class="form-grid">
          <div class="form-row">
            <label>身高 (cm)</label>
            <input type="number" id="height" value="170" onchange="saveProfile()">
          </div>
          <div class="form-row">
            <label>体重 (kg)</label>
            <input type="number" id="weight" value="65" onchange="saveProfile()">
          </div>
          <div class="form-row">
            <label>年龄</label>
            <input type="number" id="age" value="25" onchange="saveProfile()">
          </div>
          <div class="form-row">
            <label>性别</label>
            <select id="gender" onchange="saveProfile()">
              <option value="male">男</option>
              <option value="female">女</option>
            </select>
          </div>
          <div class="form-row full">
            <label>日常活动水平</label>
            <select id="activity" onchange="saveProfile()">
              <option value="1.2">久坐不动（办公室工作）</option>
              <option value="1.375" selected>轻度活动（每周运动1-3次）</option>
              <option value="1.55">中度活动（每周运动3-5次）</option>
              <option value="1.725">高度活动（每周运动6-7次）</option>
            </select>
          </div>
        </div>
        <div style="margin-top:0.7rem;">
          <label style="font-size:0.75rem;color:var(--muted);display:block;margin-bottom:0.3rem;">目标模式</label>
          <div class="mode-select">
            <div class="mode-btn active" data-mode="lose" onclick="setMode('lose')">🔥 减脂</div>
            <div class="mode-btn" data-mode="maintain" onclick="setMode('maintain')">⚖️ 维持</div>
            <div class="mode-btn" data-mode="gain" onclick="setMode('gain')">💪 增肌</div>
          </div>
        </div>
        <div style="margin-top:0.8rem; padding-top:0.8rem; border-top:1px solid var(--rule);">
          <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:var(--muted);">
            <span>基础代谢 (BMR)</span><span id="bmrVal" style="color:var(--ink);font-weight:600;">--</span>
          </div>
          <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:var(--muted); margin-top:0.3rem;">
            <span>每日总消耗 (TDEE)</span><span id="tdeeVal" style="color:var(--ink);font-weight:600;">--</span>
          </div>
          <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:var(--muted); margin-top:0.3rem;">
            <span>建议每日摄入</span><span id="targetVal" style="color:var(--accent);font-weight:700;">--</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Quick Add -->
  <div class="section">
    <div class="section-title">➕ 快速记录</div>
    <div class="card">
      <div class="quick-tabs">
        <div class="qtab active" onclick="switchTab('food')">🍱 饮食</div>
        <div class="qtab" onclick="switchTab('sport')">🏃 运动</div>
      </div>

      <div id="foodPanel">
        <div class="input-wrap">
          <input type="text" id="foodInput" placeholder="例如：一碗牛肉面加鸡蛋" onkeypress="if(event.key==='Enter')addFood()">
          <button onclick="addFood()">添加</button>
        </div>
        <div class="chips" id="foodChips"></div>
      </div>

      <div id="sportPanel" style="display:none;">
        <div class="input-wrap">
          <input type="text" id="sportInput" placeholder="例如：跑步 30 分钟" onkeypress="if(event.key==='Enter')addSport()">
          <button onclick="addSport()">添加</button>
        </div>
        <div class="chips" id="sportChips"></div>
      </div>
    </div>
  </div>

  <!-- Nutrition -->
  <div class="section">
    <div class="section-title">📊 今日营养</div>
    <div class="card">
      <div class="nutri-list" id="nutriList"></div>
    </div>
  </div>

  <!-- Records -->
  <div class="section">
    <div class="section-title">📝 今日记录</div>
    <div class="card" id="recordCard">
      <div class="empty" id="emptyRecords">今天还没有记录，快添加一条吧 👆</div>
      <div id="recordList"></div>
    </div>
  </div>

  <!-- Suggestion -->
  <div class="section" id="suggestSection" style="display:none;">
    <div class="section-title">💡 智能建议</div>
    <div class="suggest" id="suggestBox"></div>
  </div>

</div>

<script>
// ========== Data ==========
const FOOD_DB = {
  '米饭': {kcal:230, p:5, c:50, f:1, fiber:0.5},
  '糙米饭': {kcal:215, p:5, c:45, f:1.8, fiber:3.5},
  '鸡胸肉': {kcal:165, p:31, c:0, f:3.6, fiber:0},
  '鸡蛋': {kcal:70, p:6, c:0.6, f:5, fiber:0},
  '牛肉面': {kcal:550, p:20, c:70, f:18, fiber:2},
  '苹果': {kcal:95, p:0.5, c:25, f:0.3, fiber:4},
  '牛奶': {kcal:150, p:8, c:12, f:8, fiber:0},
  '酸奶': {kcal:120, p:5, c:15, f:4, fiber:0},
  '香蕉': {kcal:105, p:1.3, c:27, f:0.4, fiber:3},
  '燕麦': {kcal:150, p:5, c:27, f:3, fiber:4},
  '西兰花': {kcal:55, p:3.7, c:11, f:0.6, fiber:5},
  '三文鱼': {kcal:208, p:20, c:0, f:13, fiber:0},
  '豆腐': {kcal:76, p:8, c:1.9, f:4.8, fiber:0.3},
  '红薯': {kcal:86, p:1.6, c:20, f:0.1, fiber:3},
  '坚果': {kcal:180, p:6, c:5, f:16, fiber:2},
};

const SPORT_DB = {
  '跑步': {met:8.0},
  '快走': {met:4.0},
  '游泳': {met:7.0},
  '骑车': {met:6.0},
  '力量训练': {met:5.0},
  '瑜伽': {met:3.0},
  '跳绳': {met:10.0},
  '篮球': {met:6.5},
  '羽毛球': {met:5.5},
  '爬楼梯': {met:8.0},
};

const FOOD_CHIPS = [
  {name:'米饭 (1碗)', key:'米饭', scale:1},
  {name:'鸡胸肉 (100g)', key:'鸡胸肉', scale:1},
  {name:'鸡蛋 (1个)', key:'鸡蛋', scale:1},
  {name:'牛肉面 (1碗)', key:'牛肉面', scale:1},
  {name:'苹果 (1个)', key:'苹果', scale:1},
  {name:'牛奶 (250ml)', key:'牛奶', scale:1},
  {name:'香蕉 (1根)', key:'香蕉', scale:1},
  {name:'燕麦 (50g)', key:'燕麦', scale:0.5},
  {name:'西兰花 (150g)', key:'西兰花', scale:1.5},
  {name:'三文鱼 (100g)', key:'三文鱼', scale:1},
];

const SPORT_CHIPS = [
  {name:'跑步 30分', key:'跑步', min:30},
  {name:'快走 30分', key:'快走', min:30},
  {name:'游泳 30分', key:'游泳', min:30},
  {name:'骑车 30分', key:'骑车', min:30},
  {name:'力量训练 45分', key:'力量训练', min:45},
  {name:'跳绳 15分', key:'跳绳', min:15},
  {name:'瑜伽 60分', key:'瑜伽', min:60},
];

// ========== State ==========
let state = {
  height:170, weight:65, age:25, gender:'male', activity:1.375, mode:'lose',
  records: []
};

// ========== Init ==========
function init() {
  const saved = localStorage.getItem('traefit_state');
  if (saved) {
    const s = JSON.parse(saved);
    state = {...state, ...s};
  }
  document.getElementById('todayDate').textContent = new Date().toLocaleDateString('zh-CN', {month:'long', day:'numeric', weekday:'long'});
  loadProfile();
  renderChips();
  updateAll();
}

function loadProfile() {
  document.getElementById('height').value = state.height;
  document.getElementById('weight').value = state.weight;
  document.getElementById('age').value = state.age;
  document.getElementById('gender').value = state.gender;
  document.getElementById('activity').value = state.activity;
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === state.mode);
  });
}

function saveProfile() {
  state.height = +document.getElementById('height').value || 170;
  state.weight = +document.getElementById('weight').value || 65;
  state.age = +document.getElementById('age').value || 25;
  state.gender = document.getElementById('gender').value;
  state.activity = +document.getElementById('activity').value;
  persist();
  updateAll();
}

function setMode(m) {
  state.mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  persist();
  updateAll();
}

function persist() {
  localStorage.setItem('traefit_state', JSON.stringify(state));
}

// ========== Calculation ==========
function calcBMR() {
  const {height, weight, age, gender} = state;
  if (gender === 'male') {
    return 10*weight + 6.25*height - 5*age + 5;
  }
  return 10*weight + 6.25*height - 5*age - 161;
}

function calcTDEE() {
  return calcBMR() * state.activity;
}

function calcTarget() {
  const tdee = calcTDEE();
  if (state.mode === 'lose') return Math.round(tdee - 500);
  if (state.mode === 'gain') return Math.round(tdee + 300);
  return Math.round(tdee);
}

function getNutriTargets() {
  const w = state.weight;
  const target = calcTarget();
  let proteinG;
  if (state.mode === 'lose') proteinG = w * 2.0;
  else if (state.mode === 'gain') proteinG = w * 2.2;
  else proteinG = w * 1.6;
  const fatG = (target * 0.28) / 9;
  const carbG = (target - proteinG*4 - fatG*9) / 4;
  return {
    kcal: target,
    protein: Math.round(proteinG),
    fat: Math.round(fatG),
    carb: Math.round(Math.max(carbG, 100)),
    fiber: 30,
    vitaC: 100
  };
}

function calcTotals() {
  let inKcal=0, outKcal=0, p=0, c=0, f=0, fiber=0;
  for (const r of state.records) {
    if (r.type === 'food') {
      inKcal += r.kcal;
      p += r.p||0; c += r.c||0; f += r.f||0; fiber += r.fiber||0;
    } else {
      outKcal += r.kcal;
    }
  }
  return {inKcal, outKcal, p, c, f, fiber};
}

// ========== Update UI ==========
function updateAll() {
  const bmr = calcBMR();
  const tdee = calcTDEE();
  const target = calcTarget();
  document.getElementById('bmrVal').textContent = Math.round(bmr) + ' kcal';
  document.getElementById('tdeeVal').textContent = Math.round(tdee) + ' kcal';
  document.getElementById('targetVal').textContent = target + ' kcal';
  document.getElementById('targetLabel').textContent = `目标 ${target}`;

  const totals = calcTotals();
  const remain = target - totals.inKcal + totals.outKcal;
  document.getElementById('inKcal').textContent = totals.inKcal;
  document.getElementById('outKcal').textContent = totals.outKcal;
  document.getElementById('remainKcal').textContent = remain;

  // Ring
  const ring = document.getElementById('ringTrack');
  const circumference = 2 * Math.PI * 90;
  const pct = Math.min(Math.max(totals.inKcal / target, 0), 1);
  ring.style.strokeDasharray = circumference;
  ring.style.strokeDashoffset = circumference * (1 - pct);
  ring.classList.toggle('over', totals.inKcal > target);

  renderNutrition(totals);
  renderRecords();
  renderSuggestion(totals, remain);
}

function renderNutrition(totals) {
  const tgt = getNutriTargets();
  const items = [
    {name:'蛋白质', cur:Math.round(totals.p), max:tgt.protein, unit:'g'},
    {name:'碳水', cur:Math.round(totals.c), max:tgt.carb, unit:'g'},
    {name:'脂肪', cur:Math.round(totals.f), max:tgt.fat, unit:'g'},
    {name:'膳食纤维', cur:Math.round(totals.fiber), max:tgt.fiber, unit:'g'},
  ];
  const html = items.map(it => {
    const pct = Math.min((it.cur / it.max) * 100, 100);
    const cls = pct >= 80 ? 'ok' : (pct >= 50 ? 'warn' : 'bad');
    return `
      <div class="nutri-item">
        <div class="nutri-top">
          <span class="name">${it.name}</span>
          <span class="val">${it.cur} / ${it.max} ${it.unit}</span>
        </div>
        <div class="nutri-bar"><div class="nutri-bar-fill ${cls}" style="width:${pct}%"></div></div>
      </div>`;
  }).join('');
  document.getElementById('nutriList').innerHTML = html;
}

function renderRecords() {
  const list = document.getElementById('recordList');
  const empty = document.getElementById('emptyRecords');
  if (state.records.length === 0) {
    empty.style.display = 'block';
    list.innerHTML = '';
    return;
  }
  empty.style.display = 'none';
  list.innerHTML = state.records.map((r, i) => `
    <div class="record-item fade-in">
      <div class="record-left">
        <div class="record-icon ${r.type}">${r.type==='food'?'🍱':'🏃'}</div>
        <div>
          <div class="record-name">${r.name}</div>
          <div class="record-sub">${r.desc||''}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;">
        <span class="record-kcal ${r.type}">${r.type==='food'?'+':'-'}${r.kcal}</span>
        <button class="record-del" onclick="delRecord(${i})">×</button>
      </div>
    </div>
  `).join('');
}

function renderSuggestion(totals, remain) {
  const sec = document.getElementById('suggestSection');
  const box = document.getElementById('suggestBox');
  if (state.records.length === 0) { sec.style.display='none'; return; }
  sec.style.display='block';

  const tgt = getNutriTargets();
  let text = '';

  if (remain > 300) {
    text += `今日还剩余 ${remain} kcal，建议再吃一份蛋白质丰富的食物。`;
  } else if (remain < -200) {
    text += `今日已超出 ${-remain} kcal，建议晚餐清淡一些。`;
  } else {
    text += `今日热量控制很好，继续保持！`;
  }

  const proteinGap = tgt.protein - totals.p;
  if (proteinGap > 20) {
    text += ` 蛋白质缺口约 ${Math.round(proteinGap)}g，推荐补充 ${Math.round(proteinGap/6)} 个鸡蛋或 ${Math.round(proteinGap/3.1)}0g 鸡胸肉。`;
  }

  const fiberGap = tgt.fiber - totals.fiber;
  if (fiberGap > 10) {
    text += ` 膳食纤维不足，建议增加蔬菜或粗粮。`;
  }

  box.innerHTML = `<div class="suggest-title">AI 建议</div><div class="suggest-text">${text}</div>`;
}

// ========== Actions ==========
function addFood() {
  const input = document.getElementById('foodInput');
  const txt = input.value.trim();
  if (!txt) return;

  const item = parseFoodInput(txt);
  state.records.unshift({type:'food', ...item, id:Date.now()});
  persist();
  input.value = '';
  updateAll();
}

function addSport() {
  const input = document.getElementById('sportInput');
  const txt = input.value.trim();
  if (!txt) return;

  const item = parseSportInput(txt);
  state.records.unshift({type:'sport', ...item, id:Date.now()});
  persist();
  input.value = '';
  updateAll();
}

function delRecord(idx) {
  state.records.splice(idx, 1);
  persist();
  updateAll();
}

function parseFoodInput(txt) {
  // Try exact match
  for (const key in FOOD_DB) {
    if (txt.includes(key)) {
      const d = FOOD_DB[key];
      let scale = 1;
      if (/两碗|两份|双倍/.test(txt)) scale = 2;
      else if (/半碗|半份|半个/.test(txt)) scale = 0.5;
      else if (/三碗|三份/.test(txt)) scale = 3;
      if (/加蛋|鸡蛋/.test(txt) && key !== '鸡蛋') {
        return {name:txt, kcal:Math.round(d.kcal*scale)+70, p:d.p*scale+6, c:d.c*scale+0.6, f:d.f*scale+5, fiber:d.fiber*scale, desc:`${key} + 鸡蛋`};
      }
      return {name:txt, kcal:Math.round(d.kcal*scale), p:d.p*scale, c:d.c*scale, f:d.f*scale, fiber:d.fiber*scale, desc:key};
    }
  }
  // Fallback
  return {name:txt, kcal:300, p:10, c:40, f:10, fiber:2, desc:'估算值'};
}

function parseSportInput(txt) {
  let min = 30;
  const m = txt.match(/(\d+)\s*分/);
  if (m) min = +m[1];

  for (const key in SPORT_DB) {
    if (txt.includes(key)) {
      const met = SPORT_DB[key].met;
      const kcal = Math.round(met * state.weight * (min/60));
      return {name:`${key} ${min}分钟`, kcal, desc:`MET ${met}`};
    }
  }
  const kcal = Math.round(5 * state.weight * (min/60));
  return {name:txt, kcal, desc:'估算值'};
}

function quickFood(chip) {
  const d = FOOD_DB[chip.key];
  const scale = chip.scale || 1;
  const kcal = Math.round(d.kcal * scale);
  state.records.unshift({
    type:'food', name:chip.name, kcal,
    p:d.p*scale, c:d.c*scale, f:d.f*scale, fiber:d.fiber*scale,
    desc:chip.key, id:Date.now()
  });
  persist();
  updateAll();
}

function quickSport(chip) {
  const d = SPORT_DB[chip.key];
  const kcal = Math.round(d.met * state.weight * (chip.min/60));
  state.records.unshift({
    type:'sport', name:chip.name, kcal,
    desc:`MET ${d.met}`, id:Date.now()
  });
  persist();
  updateAll();
}

// ========== UI Helpers ==========
function toggleSettings() {
  const btn = document.getElementById('settingToggle');
  const panel = document.getElementById('settingPanel');
  btn.classList.toggle('open');
  panel.classList.toggle('open');
}

function switchTab(tab) {
  document.querySelectorAll('.qtab').forEach(t => t.classList.toggle('active', t.textContent.includes(tab==='food'?'饮食':'运动')));
  document.getElementById('foodPanel').style.display = tab==='food' ? 'block' : 'none';
  document.getElementById('sportPanel').style.display = tab==='sport' ? 'block' : 'none';
}

function renderChips() {
  document.getElementById('foodChips').innerHTML = FOOD_CHIPS.map((c,i) =>
    `<span class="chip" onclick="quickFood(FOOD_CHIPS[${i}])">${c.name}</span>`
  ).join('');
  document.getElementById('sportChips').innerHTML = SPORT_CHIPS.map((c,i) =>
    `<span class="chip" onclick="quickSport(SPORT_CHIPS[${i}])">${c.name}</span>`
  ).join('');
}

// ========== Boot ==========
init();
</script>
