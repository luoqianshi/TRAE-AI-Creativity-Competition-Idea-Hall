<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>格式哨兵｜结课作业格式体检</title>
    <style>
        :root {
            --bg-primary: #f8fbff;
            --bg-card: #ffffff;
            --text-primary: #2d3748;
            --text-secondary: #4a5568;
            --border: #e2e8f0;
            --accent-blue: #4a6fa5;
            --accent-green: #6b9a86;
            --error: #e53e3e;
            --warning: #dd6b20;
            --info: #3182ce;
            --success: #38a169;
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
            --radius: 12px;
            --transition: all 0.2s ease;
        }

        .dark-theme {
            --bg-primary: #1a202c;
            --bg-card: #2d3748;
            --text-primary: #e2e8f0;
            --text-secondary: #a0aec0;
            --border: #4a5568;
            --accent-blue: #63b3ed;
            --accent-green: #76c7a5;
            --error: #fc8181;
            --warning: #f6ad55;
            --info: #63b3ed;
            --success: #68d391;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            line-height: 1.6;
            color: var(--text-primary);
            background-color: var(--bg-primary);
            transition: var(--transition);
            padding: 16px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
            padding-top: 12px;
        }

        h1 {
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: var(--accent-blue);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.05rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            margin-bottom: 24px;
            transition: var(--transition);
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title svg {
            width: 20px;
            height: 20px;
            fill: var(--accent-blue);
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            line-height: 1.6;
            resize: vertical;
            transition: var(--transition);
            background: var(--bg-card);
            color: var(--text-primary);
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(74, 111, 165, 0.1);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
        }

        .btn:hover {
            background: #3a5a8c;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-block {
            width: 100%;
        }

        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--accent-blue);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            z-index: 100;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            background: #3a5a8c;
        }

        .theme-toggle svg {
            width: 20px;
            height: 20px;
        }

        .result-section {
            display: none;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .result-count {
            font-weight: 600;
            color: var(--accent-blue);
        }

        .issue-list {
            list-style: none;
        }

        .issue-item {
            background: rgba(239, 246, 255, 0.5);
            border-left: 4px solid var(--error);
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 0 8px 8px 0;
            transition: var(--transition);
        }

        .issue-item.warning {
            border-left-color: var(--warning);
            background: rgba(255, 247, 237, 0.5);
        }

        .issue-item.info {
            border-left-color: var(--info);
            background: rgba(224, 240, 255, 0.5);
        }

        .issue-text {
            font-weight: 500;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .issue-fix {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .fix-btn {
            background: var(--success);
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .fix-btn:hover {
            background: #2f855a;
        }

        .copy-feedback {
            margin-top: 8px;
            padding: 6px 12px;
            background: rgba(56, 161, 105, 0.15);
            border-radius: 6px;
            font-size: 0.85rem;
            display: none;
        }

        .footer-note {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 12px;
            }
            h1 {
                font-size: 1.5rem;
            }
            .card {
                padding: 18px;
            }
            textarea {
                min-height: 160px;
                padding: 12px;
            }
            .theme-toggle {
                width: 40px;
                height: 40px;
                top: 12px;
                right: 12px;
            }
        }

        /* Print hide */
        @media print {
            .theme-toggle, .footer-note {
                display: none;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" aria-label="切换深色/浅色模式">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H12a.75.75 0 01-.75-.75V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.162a.75.75 0 00-1.04-.132l-.853-.853A.75.75 0 009 12l.853.853a.75.75 0 001.04.132l3.01-3.02zM21.123 11.482a.75.75 0 00-.132-1.04l-.853.853A.75.75 0 0012 12l.853.853a.75.75 0 001.04-.132l3.01-3.02z"/></svg>
    </button>

    <div class="container">
        <header>
            <h1>格式哨兵</h1>
            <p class="subtitle">结课作业格式体检｜粘贴文字，3秒查出常见格式问题</p>
        </header>

        <main>
            <section class="card">
                <h2 class="card-title">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm1-4a1 1 0 10-2 0 1 1 0 002 0zm-1 12a1 1 0 10-2 0 1 1 0 002 0zm-1-7a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>
                    粘贴你的作业内容
                </h2>
                <textarea id="inputText" placeholder="请粘贴你的课程报告、论文段落（支持中文、参考文献、标题等）...&#xa;例如：&#xa;一、引言&#xa;本研究基于社会调查方法……&#xa;参考文献：&#xa;[1] 张明. 教育心理学导论[M]. 北京：高等教育出版社，2020.&#xa;（2）李华. 数据结构实践指南[J]. 计算机学报，2021(3):45-52."></textarea>
                <button id="checkBtn" class="btn btn-block">🔍 格式体检</button>
            </section>

            <section class="card result-section" id="resultSection">
                <div class="result-header">
                    <h2 class="card-title">📋 检测结果</h2>
                    <span class="result-count" id="issueCount">发现 0 处格式问题</span>
                </div>
                <ul class="issue-list" id="issueList">
                    <!-- issues will be inserted here -->
                </ul>
            </section>

            <div class="footer-note">
                ✅ 无需上传文件｜纯前端运行｜所有数据仅在本地处理<br>
                💡 常见问题：中英文标点混用、全角空格、参考文献编号不统一、标题层级缺失等
            </div>
        </main>
    </div>

    <script>
        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        
        if (localStorage.getItem('theme') === 'dark') {
            html.classList.add('dark-theme');
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            html.classList.add('dark-theme');
        }

        themeToggle.addEventListener('click', () => {
            html.classList.toggle('dark-theme');
            localStorage.setItem('theme', html.classList.contains('dark-theme') ? 'dark' : 'light');
        });

        // Format checking logic
        const checkBtn = document.getElementById('checkBtn');
        const inputText = document.getElementById('inputText');
        const resultSection = document.getElementById('resultSection');
        const issueList = document.getElementById('issueList');
        const issueCount = document.getElementById('issueCount');

        // Sample test text for demo
        inputText.value = `一、引言\n本研究基于社会调查方法开展……\n参考文献：\n[1] 张明. 教育心理学导论[M]. 北京：高等教育出版社，2020.\n（2）李华. 数据结构实践指南[J]. 计算机学报，2021(3):45-52.\n图表1：调查样本分布图\n\n二、方法\n采用问卷法，共发放10 份问卷。`;

        checkBtn.addEventListener('click', () => {
            const text = inputText.value.trim();
            if (!text) return;

            const issues = [];

            // Rule 1: Chinese/English punctuation mix in refs
            const refLines = text.split('\n').filter(line => /参考文献|REFERENCES/i.test(line) || /^\[\d+\]/.test(line) || /^\(\d+\)/.test(line));
            for (let i = 0; i < refLines.length; i++) {
                const line = refLines[i];
                if (/^\(\d+\)/.test(line) && !/^\[\d+\]/.test(line)) {
                    issues.push({
                        type: 'warning',
                        text: `参考文献编号格式不统一：${line.substring(0, 30)}...`,
                        fix: '请将“(2)”改为“[2]”',
                        copy: line.replace(/^\(\d+\)/, `[${line.match(/\((\d+)\)/)?.[1] || '2'}]`)
                    });
                }
                if (/[，。！？；：“”‘’]/.test(line) && /[,.!?;:"'`]/.test(line)) {
                    issues.push({
                        type: 'error',
                        text: `中英文标点混用：${line.substring(0, 30)}...`,
                        fix: '中文语境下请统一使用中文标点（，。！？；：“”）',
                        copy: line.replace(/[,.!?;:"'`]/g, '，。！？；：“”')
                    });
                }
            }

            // Rule 2: Full-width space before numbers or units
            const spaceMatches = text.match(/[\u3000\s]+(\d+)[\u3000\s]+([人台件次年月日])/g);
            if (spaceMatches) {
                spaceMatches.slice(0, 2).forEach(match => {
                    const clean = match.replace(/[\u3000\s]+/g, '');
                    issues.push({
                        type: 'warning',
                        text: `数字与单位间存在多余空格：${match}`,
                        fix: `请改为“${clean}”`,
                        copy: clean
                    });
                });
            }

            // Rule 3: Title level missing (e.g., no "一、" "二、" pattern)
            const titlePattern = /(^|\n)([一二三四五六七八九十]+、|第[一二三四五六七八九十]+章|附录[一二三四])/g;
            if (!titlePattern.test(text)) {
                issues.push({
                    type: 'info',
                    text: '未检测到标准中文标题层级（如“一、”“二、”）',
                    fix: '建议在章节开头使用“一、”“二、”等编号，便于结构识别',
                    copy: '一、引言\n二、方法\n三、结果'
                });
            }

            // Render results
            issueList.innerHTML = '';
            issues.forEach((issue, idx) => {
                const li = document.createElement('li');
                li.className = `issue-item ${issue.type}`;
                li.innerHTML = `
                    <div class="issue-text">${issue.text}</div>
                    <div class="issue-fix">${issue.fix}</div>
                    <button class="fix-btn" data-copy="${issue.copy}">📋 复制修正版</button>
                    <div class="copy-feedback" id="feedback-${idx}">已复制：${issue.copy}</div>
                `;
                issueList.appendChild(li);
            });

            issueCount.textContent = `发现 ${issues.length} 处格式问题`;
            resultSection.style.display = 'block';

            // Add copy handlers
            document.querySelectorAll('.fix-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const copyText = this.getAttribute('data-copy');
                    navigator.clipboard.writeText(copyText).then(() => {
                        const feedback = document.getElementById(`feedback-${this.closest('.issue-item').index || 0}`);
                        if (feedback) {
                            feedback.style.display = 'block';
                            setTimeout(() => feedback.style.display = 'none', 2000);
                        }
                    });
                });
            });

            // Scroll to results
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
    </script>
</body>
</html>
