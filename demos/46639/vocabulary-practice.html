<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>词汇练习 — Vocabulary Practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif+SC:wght@400;600;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0f1c15;
            --bg-card: #1a2e22;
            --bg-input: #243d2e;
            --accent-gold: #c9a96e;
            --accent-gold-dim: #8a7347;
            --text-primary: #e8e4dc;
            --text-secondary: #a39b8d;
            --text-muted: #6b655c;
            --correct: #5a9e6b;
            --correct-glow: rgba(90, 158, 107, 0.3);
            --error: #c76b6b;
            --error-glow: rgba(199, 107, 107, 0.3);
            --border-subtle: rgba(201, 169, 110, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Source Sans 3', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Atmospheric background */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(ellipse at 30% 20%, rgba(201, 169, 110, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(90, 158, 107, 0.03) 0%, transparent 50%);
            animation: drift 20s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-2%, -1%); }
        }

        .container {
            width: 90%;
            max-width: 680px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 48px;
            opacity: 0;
            animation: fadeSlideDown 0.8s ease forwards;
        }

        .header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--accent-gold);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .header .subtitle {
            font-family: 'Noto Serif SC', serif;
            font-size: 0.95rem;
            color: var(--text-secondary);
            letter-spacing: 4px;
        }

        /* Progress */
        .progress-wrapper {
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeSlideDown 0.8s ease 0.15s forwards;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .progress-bar-bg {
            height: 3px;
            background: var(--bg-input);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-gold-dim), var(--accent-gold));
            border-radius: 2px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
        }

        /* Card */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 56px 48px;
            text-align: center;
            position: relative;
            opacity: 0;
            animation: fadeSlideUp 0.8s ease 0.3s forwards;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(201, 169, 110, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 24px 70px rgba(0, 0, 0, 0.35),
                0 0 0 1px rgba(201, 169, 110, 0.08);
        }

        /* Word number badge */
        .word-number {
            position: absolute;
            top: 20px;
            right: 24px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
        }

        /* Chinese meaning */
        .meaning {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
            line-height: 1.5;
        }

        /* Phonetic */
        .phonetic {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            color: var(--accent-gold);
            letter-spacing: 1px;
            margin-bottom: 48px;
            font-style: italic;
        }

        /* Input area */
        .input-wrapper {
            position: relative;
            max-width: 400px;
            margin: 0 auto;
        }

        .word-input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 18px 24px;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 1.15rem;
            color: var(--text-primary);
            text-align: center;
            letter-spacing: 1px;
            outline: none;
            transition: all 0.3s ease;
        }

        .word-input::placeholder {
            color: var(--text-muted);
            font-weight: 300;
        }

        .word-input:focus {
            border-color: var(--accent-gold-dim);
            box-shadow: 0 0 0 3px rgba(201, 169, 110, 0.1);
        }

        .word-input.correct {
            border-color: var(--correct);
            background: rgba(90, 158, 107, 0.08);
            box-shadow: 0 0 0 3px var(--correct-glow);
            color: var(--correct);
        }

        .word-input.error {
            border-color: var(--error);
            background: rgba(199, 107, 107, 0.08);
            box-shadow: 0 0 0 3px var(--error-glow);
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            15% { transform: translateX(-8px); }
            30% { transform: translateX(7px); }
            45% { transform: translateX(-5px); }
            60% { transform: translateX(4px); }
            75% { transform: translateX(-2px); }
        }

        /* Feedback */
        .feedback {
            margin-top: 20px;
            font-size: 0.9rem;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .feedback.visible {
            opacity: 1;
        }

        .feedback.correct-text {
            color: var(--correct);
        }

        .feedback.error-text {
            color: var(--error);
        }

        /* Streak counter */
        .streak {
            margin-top: 32px;
            font-size: 0.85rem;
            color: var(--text-muted);
            opacity: 0;
            animation: fadeSlideUp 0.8s ease 0.45s forwards;
        }

        .streak-value {
            color: var(--accent-gold);
            font-weight: 600;
        }

        /* Completion screen */
        .completion {
            display: none;
            text-align: center;
            opacity: 0;
        }

        .completion.active {
            display: block;
            animation: fadeSlideUp 0.8s ease forwards;
        }

        .completion-icon {
            font-size: 4rem;
            margin-bottom: 24px;
        }

        .completion h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            color: var(--accent-gold);
            margin-bottom: 16px;
        }

        .completion p {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 8px;
        }

        .completion .final-score {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            color: var(--accent-gold);
            margin: 24px 0;
        }

        .restart-btn {
            margin-top: 32px;
            background: transparent;
            border: 1px solid var(--accent-gold-dim);
            color: var(--accent-gold);
            padding: 14px 36px;
            border-radius: 10px;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 1rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .restart-btn:hover {
            background: var(--accent-gold);
            color: var(--bg-deep);
            border-color: var(--accent-gold);
        }

        /* Show answer button */
        .show-answer-btn {
            margin-top: 16px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: 'Source Sans 3', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 1px;
            cursor: pointer;
            padding: 6px 14px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .show-answer-btn:hover {
            color: var(--accent-gold);
            background: rgba(201, 169, 110, 0.08);
        }

        /* Answer reveal */
        .answer-reveal {
            margin-top: 16px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            color: var(--accent-gold);
            letter-spacing: 2px;
            opacity: 0;
            transform: translateY(8px);
            transition: all 0.4s ease;
        }

        .answer-reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Animations */
        @keyframes fadeSlideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Card transition states */
        .card.exiting {
            animation: fadeOut 0.3s ease forwards;
        }

        .card.entering {
            animation: fadeSlideUp 0.5s ease forwards;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 2rem;
            }
            .card {
                padding: 40px 28px;
            }
            .meaning {
                font-size: 1.3rem;
            }
            .phonetic {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Vocabulary Practice</h1>
            <div class="subtitle">词汇练习</div>
        </div>

        <div class="progress-wrapper" id="progressWrapper">
            <div class="progress-info">
                <span>进度</span>
                <span id="progressText">1 / 20</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <div class="card" id="card">
            <div class="word-number" id="wordNumber">#1</div>
            <div class="meaning" id="meaning">认真的，尽责的</div>
            <div class="phonetic" id="phonetic">/ˌkɒnʃiˈenʃəs/</div>
            <div class="input-wrapper">
                <input 
                    type="text" 
                    class="word-input" 
                    id="wordInput" 
                    placeholder="输入单词，按回车提交"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                >
            </div>
            <div class="feedback" id="feedback"></div>
            <div class="answer-reveal" id="answerReveal"></div>
            <button class="show-answer-btn" id="showAnswerBtn">查看答案</button>
        </div>

        <div class="streak" id="streak">
            当前连对：<span class="streak-value" id="streakValue">0</span>
        </div>

        <div class="completion" id="completion">
            <div class="completion-icon">✦</div>
            <h2>练习完成</h2>
            <p>已完成全部 20 个单词</p>
            <div class="final-score" id="finalScore">0 / 20</div>
            <p id="finalMessage">继续加油！</p>
            <button class="restart-btn" id="restartBtn">再来一次</button>
        </div>
    </div>

    <script>
        const words = [
            { word: "conscientious", phonetic: "/ˌkɒnʃiˈenʃəs/", meaning: "认真的，尽责的" },
            { word: "ubiquitous", phonetic: "/juːˈbɪkwɪtəs/", meaning: "无处不在的，普遍存在的" },
            { word: "ephemeral", phonetic: "/ɪˈfemərəl/", meaning: "短暂的，瞬息的" },
            { word: "paradigm", phonetic: "/ˈpærədaɪm/", meaning: "典范，范例，模式" },
            { word: "ambiguous", phonetic: "/æmˈbɪɡjuəs/", meaning: "模棱两可的，含糊不清的" },
            { word: "pragmatic", phonetic: "/præɡˈmætɪk/", meaning: "务实的，实用的" },
            { word: "quintessential", phonetic: "/ˌkwɪntɪˈsenʃəl/", meaning: "典型的，最完美的典范" },
            { word: "meticulous", phonetic: "/məˈtɪkjələs/", meaning: "一丝不苟的，严谨的" },
            { word: "eloquent", phonetic: "/ˈeləkwənt/", meaning: "雄辩的，有说服力的" },
            { word: "resilient", phonetic: "/rɪˈzɪliənt/", meaning: "有弹性的，能迅速复原的" },
            { word: "benevolent", phonetic: "/bəˈnevələnt/", meaning: "仁慈的，慈善的" },
            { word: "cynical", phonetic: "/ˈsɪnɪkəl/", meaning: "愤世嫉俗的，怀疑的" },
            { word: "dubious", phonetic: "/ˈdjuːbiəs/", meaning: "可疑的，不确定的" },
            { word: "exacerbate", phonetic: "/ɪɡˈzæsəbeɪt/", meaning: "加剧，使恶化" },
            { word: "heterogeneous", phonetic: "/ˌhetərəˈdʒiːniəs/", meaning: "多种多样的，异质的" },
            { word: "inevitable", phonetic: "/ɪnˈevɪtəbl/", meaning: "不可避免的，必然的" },
            { word: "jurisdiction", phonetic: "/ˌdʒʊərɪsˈdɪkʃn/", meaning: "司法权，管辖权" },
            { word: "nostalgia", phonetic: "/nɒˈstældʒə/", meaning: "怀旧，乡愁" },
            { word: "spontaneous", phonetic: "/spɒnˈteɪniəs/", meaning: "自发的，自然的" },
            { word: "vulnerable", phonetic: "/ˈvʌlnərəbl/", meaning: "脆弱的，易受伤害的" }
        ];

        let currentIndex = 0;
        let streak = 0;
        let correctCount = 0;
        let answered = new Set();

        const card = document.getElementById('card');
        const wordNumber = document.getElementById('wordNumber');
        const meaningEl = document.getElementById('meaning');
        const phoneticEl = document.getElementById('phonetic');
        const wordInput = document.getElementById('wordInput');
        const feedback = document.getElementById('feedback');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const streakValue = document.getElementById('streakValue');
        const progressWrapper = document.getElementById('progressWrapper');
        const streakEl = document.getElementById('streak');
        const completion = document.getElementById('completion');
        const finalScore = document.getElementById('finalScore');
        const finalMessage = document.getElementById('finalMessage');
        const restartBtn = document.getElementById('restartBtn');
        const showAnswerBtn = document.getElementById('showAnswerBtn');
        const answerReveal = document.getElementById('answerReveal');

        function updateCard() {
            const w = words[currentIndex];
            wordNumber.textContent = `#${currentIndex + 1}`;
            meaningEl.textContent = w.meaning;
            phoneticEl.textContent = w.phonetic;
            wordInput.value = '';
            wordInput.classList.remove('correct', 'error');
            feedback.classList.remove('visible');
            answerReveal.classList.remove('visible');
            answerReveal.textContent = '';
            showAnswerBtn.style.display = 'inline-block';
            updateProgress();
        }

        function updateProgress() {
            const pct = (currentIndex / words.length) * 100;
            progressBar.style.width = pct + '%';
            progressText.textContent = `${currentIndex + 1} / ${words.length}`;
        }

        function showFeedback(isCorrect, message) {
            feedback.textContent = message;
            feedback.className = 'feedback visible ' + (isCorrect ? 'correct-text' : 'error-text');
        }

        function nextWord() {
            answered.add(currentIndex);
            correctCount++;
            streak++;
            streakValue.textContent = streak;

            wordInput.classList.add('correct');
            showFeedback(true, '✓ 正确！');

            setTimeout(() => {
                currentIndex++;
                if (currentIndex >= words.length) {
                    showCompletion();
                    return;
                }

                // Animate card transition
                card.classList.add('exiting');
                setTimeout(() => {
                    card.classList.remove('exiting');
                    updateCard();
                    card.classList.add('entering');
                    setTimeout(() => {
                        card.classList.remove('entering');
                    }, 500);
                }, 300);
            }, 600);
        }

        function handleError() {
            streak = 0;
            streakValue.textContent = streak;
            wordInput.classList.add('error');
            showFeedback(false, `✗ 正确答案是：${words[currentIndex].word}`);

            setTimeout(() => {
                wordInput.classList.remove('error');
                feedback.classList.remove('visible');
                wordInput.value = '';
                wordInput.focus();
            }, 1800);
        }

        function checkAnswer() {
            const input = wordInput.value.trim().toLowerCase();
            if (!input) return;

            const correct = words[currentIndex].word.toLowerCase();
            if (input === correct) {
                nextWord();
            } else {
                handleError();
            }
        }

        function showCompletion() {
            card.style.display = 'none';
            progressWrapper.style.display = 'none';
            streakEl.style.display = 'none';
            completion.classList.add('active');
            finalScore.textContent = `${correctCount} / ${words.length}`;

            if (correctCount === words.length) {
                finalMessage.textContent = '太棒了！全部正确！🎉';
            } else if (correctCount >= 15) {
                finalMessage.textContent = '表现优异，继续加油！';
            } else if (correctCount >= 10) {
                finalMessage.textContent = '还不错，再练习一下会更好！';
            } else {
                finalMessage.textContent = '再接再厉，多多练习！';
            }
        }

        function showAnswer() {
            const correctWord = words[currentIndex].word;
            answerReveal.textContent = correctWord;
            answerReveal.classList.add('visible');
            showAnswerBtn.style.display = 'none';
            wordInput.focus();
        }

        function restart() {
            currentIndex = 0;
            streak = 0;
            correctCount = 0;
            answered.clear();

            card.style.display = 'block';
            progressWrapper.style.display = 'block';
            streakEl.style.display = 'block';
            completion.classList.remove('active');

            streakValue.textContent = '0';
            updateCard();
            wordInput.focus();
        }

        wordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        restartBtn.addEventListener('click', restart);
        showAnswerBtn.addEventListener('click', showAnswer);

        // Focus input on load
        wordInput.focus();
        updateCard();
    </script>
</body>
</html>
