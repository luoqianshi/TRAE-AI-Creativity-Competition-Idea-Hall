<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>银发智慧助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            padding: 24px;
            text-align: center;
            color: white;
        }

        .header h1 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #f5f5f5;
            font-size: 14px;
            color: #666;
        }

        .greeting {
            padding: 20px;
            background: linear-gradient(135deg, #fff5f5 0%, #ffe4e4 100%);
            border-radius: 16px;
            margin: 16px;
            text-align: center;
        }

        .greeting h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 8px;
        }

        .greeting p {
            font-size: 16px;
            color: #666;
            margin-bottom: 12px;
        }

        .greeting .tips {
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 14px;
            color: #5c6bc0;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 0 16px;
            margin-bottom: 16px;
        }

        .feature-card {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid #eee;
        }

        .feature-card:active {
            transform: scale(0.95);
            border-color: #ff6b6b;
        }

        .feature-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 12px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .icon-health { background: #e8f5e9; color: #4caf50; }
        .icon-call { background: #ffebee; color: #f44336; }
        .icon-life { background: #e3f2fd; color: #2196f3; }
        .icon-chat { background: #fff3e0; color: #ff9800; }

        .feature-card h3 {
            font-size: 18px;
            color: #333;
            margin-bottom: 8px;
        }

        .feature-card p {
            font-size: 13px;
            color: #888;
        }

        .chat-section {
            padding: 16px;
            background: #f8f9fa;
        }

        .chat-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            margin-right: 12px;
        }

        .chat-title h3 {
            font-size: 16px;
            color: #333;
        }

        .chat-title p {
            font-size: 12px;
            color: #4caf50;
        }

        .chat-messages {
            background: white;
            border-radius: 12px;
            padding: 12px;
            min-height: 120px;
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.6;
        }

        .chat-input {
            display: flex;
            gap: 8px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 24px;
            border: 2px solid #ddd;
            font-size: 16px;
            outline: none;
        }

        .chat-input button {
            padding: 12px 20px;
            border-radius: 24px;
            background: #ff6b6b;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }

        .chat-input button:active {
            background: #ee5a5a;
        }

        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 16px;
            background: white;
            border-top: 1px solid #eee;
        }

        .nav-item {
            text-align: center;
            color: #888;
            cursor: pointer;
            font-size: 24px;
        }

        .nav-item.active {
            color: #ff6b6b;
        }

        .nav-item p {
            font-size: 12px;
            margin-top: 4px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            border-radius: 20px;
            padding: 24px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .modal h3 {
            font-size: 22px;
            margin-bottom: 16px;
            color: #333;
        }

        .modal p {
            font-size: 16px;
            color: #666;
            margin-bottom: 24px;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            padding: 12px 32px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: #ff6b6b;
            color: white;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .action-result {
            margin-top: 16px;
            padding: 12px;
            background: #e8f5e9;
            border-radius: 8px;
            color: #4caf50;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .app-container {
                margin: 0;
                border-radius: 0;
                min-height: 100vh;
            }

            .feature-grid {
                gap: 12px;
            }

            .feature-card {
                padding: 16px;
            }

            .feature-icon {
                width: 56px;
                height: 56px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>👵 银发智慧助手</h1>
            <p>您的贴心智能陪伴</p>
        </div>

        <div class="status-bar">
            <span>📅 2026年7月12日</span>
            <span>☀️ 北京 28°C</span>
        </div>

        <div class="greeting">
            <h2>早上好，王阿姨！</h2>
            <p>今天天气不错，记得多出去走走哦~</p>
            <div class="tips" id="dailyTip">
                <span>🌱 今日小贴士：多喝温水，保持身体健康~</span>
            </div>
        </div>

        <div class="feature-grid">
            <div class="feature-card" onclick="openFeature('health')">
                <div class="feature-icon icon-health">💊</div>
                <h3>健康管家</h3>
                <p>用药提醒 · 健康记录</p>
            </div>

            <div class="feature-card" onclick="openFeature('call')">
                <div class="feature-icon icon-call">🆘</div>
                <h3>紧急呼叫</h3>
                <p>一键联系家人 · 急救</p>
            </div>

            <div class="feature-card" onclick="openFeature('life')">
                <div class="feature-icon icon-life">📰</div>
                <h3>生活助手</h3>
                <p>新闻播报 · 天气查询</p>
            </div>

            <div class="feature-card" onclick="openFeature('chat')">
                <div class="feature-icon icon-chat">💬</div>
                <h3>情感陪伴</h3>
                <p>聊天谈心 · 解闷说话</p>
            </div>
        </div>

        <div class="chat-section">
            <div class="chat-header">
                <div class="avatar">🤖</div>
                <div class="chat-title">
                    <h3>小智助手</h3>
                    <p>在线 · 随时为您服务</p>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <p><strong>小智：</strong>阿姨，您好！有什么我可以帮您的吗？</p>
            </div>

            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="请输入您想说的话..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">发送</button>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active">
                <span>🏠</span>
                <p>首页</p>
            </div>
            <div class="nav-item">
                <span>💊</span>
                <p>健康</p>
            </div>
            <div class="nav-item">
                <span>📞</span>
                <p>联系</p>
            </div>
            <div class="nav-item">
                <span>⚙️</span>
                <p>设置</p>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent">
            <h3 id="modalTitle">标题</h3>
            <p id="modalText">内容</p>
            <div class="modal-buttons" id="modalButtons">
                <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="confirmAction()">确认</button>
            </div>
            <div class="action-result" id="actionResult" style="display: none;"></div>
        </div>
    </div>

    <script>
        let currentFeature = '';

        function openFeature(feature) {
            currentFeature = feature;
            const modal = document.getElementById('modalOverlay');
            const title = document.getElementById('modalTitle');
            const text = document.getElementById('modalText');
            const buttons = document.getElementById('modalButtons');
            const result = document.getElementById('actionResult');

            result.style.display = 'none';

            switch(feature) {
                case 'health':
                    title.textContent = '💊 健康管家';
                    text.textContent = '今天您需要按时服用降压药和维生素哦。是否需要我提醒您？';
                    buttons.innerHTML = `
                        <button class="btn btn-secondary" onclick="closeModal()">稍后提醒</button>
                        <button class="btn btn-primary" onclick="confirmAction()">现在提醒</button>
                    `;
                    break;
                case 'call':
                    title.textContent = '🆘 紧急呼叫';
                    text.textContent = '请选择您要联系的人：子女、社区服务中心或急救中心。';
                    buttons.innerHTML = `
                        <button class="btn btn-secondary" onclick="callPerson('child')">👦 联系子女</button>
                        <button class="btn btn-primary" onclick="callPerson('emergency')">🚑 急救中心</button>
                    `;
                    break;
                case 'life':
                    title.textContent = '📰 生活助手';
                    text.textContent = '今天北京天气晴朗，最高温度28°C，最低温度22°C。适合外出散步~';
                    buttons.innerHTML = `
                        <button class="btn btn-primary" onclick="closeModal()">知道了</button>
                    `;
                    break;
                case 'chat':
                    title.textContent = '💬 情感陪伴';
                    text.textContent = '阿姨，今天心情怎么样？我来陪您聊聊天吧~';
                    buttons.innerHTML = `
                        <button class="btn btn-primary" onclick="closeModal()">开始聊天</button>
                    `;
                    break;
            }

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        function confirmAction() {
            const result = document.getElementById('actionResult');
            if (currentFeature === 'health') {
                result.textContent = '✅ 已设置提醒！半小时后我会再次提醒您服药~';
            } else if (currentFeature === 'chat') {
                result.textContent = '💬 聊天模式已开启，您可以在下方对话框中与我交流~';
            }
            result.style.display = 'block';
        }

        function callPerson(type) {
            const result = document.getElementById('actionResult');
            if (type === 'child') {
                result.textContent = '📞 正在拨打子女电话... 嘟嘟嘟...';
            } else if (type === 'emergency') {
                result.textContent = '🚑 正在连接急救中心... 请保持电话畅通~';
            }
            result.style.display = 'block';
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const messages = document.getElementById('chatMessages');
            const text = input.value.trim();

            if (!text) return;

            messages.innerHTML += `<p><strong>您：</strong>${text}</p>`;

            input.value = '';

            setTimeout(() => {
                let response = '';
                const lowerText = text.toLowerCase();
                
                if (lowerText.includes('天气') || lowerText.includes('温度')) {
                    response = '🌤️ 今天北京天气晴朗，最高温度28°C，最低温度22°C，适合外出散步~';
                } else if (lowerText.includes('吃药') || lowerText.includes('药') || lowerText.includes('健康')) {
                    response = '💊 您今天需要按时服用降压药和维生素哦，记得饭后服用~';
                } else if (lowerText.includes('吃饭') || lowerText.includes('饭') || lowerText.includes('吃')) {
                    response = '🍚 阿姨，记得按时吃饭哦，多吃蔬菜水果对身体好~';
                } else if (lowerText.includes('子女') || lowerText.includes('孩子') || lowerText.includes('儿子') || lowerText.includes('女儿')) {
                    response = '❤️ 您的子女很关心您呢，昨天还打电话来询问您的情况~';
                } else if (lowerText.includes('无聊') || lowerText.includes('闷') || lowerText.includes('孤单')) {
                    response = '💬 阿姨别难过，我来陪您聊聊天，您想听什么呢？';
                } else if (lowerText.includes('谢谢') || lowerText.includes('感谢')) {
                    response = '😊 不用谢，能帮到您我很开心~';
                } else if (lowerText.includes('再见') || lowerText.includes('拜拜')) {
                    response = '👋 阿姨再见，有什么需要随时叫我哦~';
                } else {
                    const responses = [
                        '好的，阿姨，我记住了~',
                        '阿姨说得对，多出去走走对身体好！',
                        '别担心，有什么事随时找我~',
                        '阿姨，您今天心情怎么样呀？',
                        '天气不错，适合去公园散散步哦~',
                        '要注意身体，按时吃饭，别太累了~',
                        '有什么烦心事都可以跟我说，我会认真听的~',
                        '阿姨，您最近有没有出去活动活动呀？',
                        '今天有没有想吃什么特别的东西呀？',
                        '多喝温水对身体好哦~'
                    ];
                    response = responses[Math.floor(Math.random() * responses.length)];
                }
                
                messages.innerHTML += `<p><strong>小智：</strong>${response}</p>`;
                messages.scrollTop = messages.scrollHeight;
            }, 800);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        window.onclick = function(event) {
            const modal = document.getElementById('modalOverlay');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
