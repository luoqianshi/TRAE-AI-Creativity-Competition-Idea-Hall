<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>题库答题系统</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --primary-light: #e0e7ff;
    --success: #059669;
    --success-light: #d1fae5;
    --danger: #dc2626;
    --danger-light: #fee2e2;
    --warning: #d97706;
    --warning-light: #fef3c7;
    --bg: #f1f5f9;
    --card-bg: #ffffff;
    --text: #1e293b;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --border: #e2e8f0;
    --border-focus: #4f46e5;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
    --radius: 12px;
    --radius-sm: 8px;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
}

/* 顶部导航栏 */
.app-header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: 0;
    z-index: 100;
}
.app-header .logo {
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 8px;
}
.app-header .logo i { font-size: 22px; }
.header-actions { display: flex; gap: 10px; align-items: center; }

/* 按钮 */
.btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 20px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    white-space: nowrap;
}
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--primary-hover); box-shadow: var(--shadow); }
.btn-outline { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
.btn-outline:hover:not(:disabled) { background: var(--primary-light); }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover:not(:disabled) { background: #047857; }
.btn-sm { padding: 6px 14px; font-size: 13px; }
.btn-icon { width: 36px; height: 36px; padding: 0; border-radius: 50%; justify-content: center; background: #f1f5f9; color: var(--text-secondary); border: 1px solid var(--border); }
.btn-icon:hover:not(:disabled) { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
.btn-warn { background: var(--warning); color: #fff; }
.btn-warn:hover:not(:disabled) { background: #b45309; }
.btn-danger { background: #fff; color: var(--danger); border: 1.5px solid var(--danger); }
.btn-danger:hover:not(:disabled) { background: var(--danger); color: #fff; }

/* 主布局 */
.main-container {
    max-width: 1300px;
    margin: 0 auto;
    padding: 24px 32px;
    display: flex;
    gap: 24px;
    min-height: calc(100vh - 60px);
}

/* 侧边栏 */
.sidebar {
    width: 280px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
}
.sidebar-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
}
.sidebar-card h3 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
    margin-bottom: 12px;
    font-weight: 600;
}
.chapter-row {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 2px;
    border-radius: 6px;
    transition: all 0.15s;
}
.chapter-row.active { background: var(--primary-light); }
.chapter-row:hover { background: #f8fafc; }
.chapter-row.active:hover { background: var(--primary-light); }
.chapter-filter-btn {
    flex: 1;
    min-width: 0;
    text-align: left;
    padding: 6px 8px;
    border: none;
    background: transparent;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-secondary);
    font-family: inherit;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.chapter-filter-btn.active { color: var(--primary); font-weight: 600; }
.chapter-count {
    font-size: 11px;
    color: var(--text-muted);
    padding: 0 4px;
    flex-shrink: 0;
}
.chapter-submit-btn {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    font-size: 11px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
}
.chapter-submit-btn:hover { background: var(--success); color: #fff; border-color: var(--success); }
.chapter-submit-btn.submitted { background: var(--success-light); color: var(--success); border-color: var(--success); cursor: default; }
.chapter-submit-btn.submitted:hover { background: var(--primary); color: #fff; border-color: var(--primary); cursor: pointer; }

/* 快速跳转 */
.quick-jump-row {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
}
.quick-jump-input {
    flex: 1;
    min-width: 0;
    padding: 6px 10px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    text-align: center;
    transition: border-color 0.2s;
    -moz-appearance: textfield;
}
.quick-jump-input::-webkit-inner-spin-button,
.quick-jump-input::-webkit-outer-spin-button {
    opacity: 1;
    height: 24px;
}
.quick-jump-input:focus { outline: none; border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
.quick-jump-btn { padding: 6px 10px; font-size: 12px; flex-shrink: 0; }

/* 题目导航列表 */
.question-nav-list {
    max-height: 350px;
    overflow-y: auto;
}
.question-nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
    border: 1px solid transparent;
}
.question-nav-item:hover { background: #f8fafc; }
.question-nav-item.active { background: var(--primary-light); border-color: var(--primary); }
.question-nav-item .q-num { font-weight: 600; color: var(--text-secondary); min-width: 28px; }
.question-nav-item .q-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    background: var(--text-muted);
}
.question-nav-item .q-dot.answered { background: var(--success); }
.question-nav-item .q-dot.marked { background: var(--warning); }
.question-nav-item .q-tag {
    font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 600;
    background: #e2e8f0; color: var(--text-secondary); flex-shrink: 0;
}

/* 主内容区 */
.content-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
    min-width: 0;
}

/* 上传区 */
.upload-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 40px;
    text-align: center;
    box-shadow: var(--shadow);
    border: 2px dashed var(--border);
    cursor: pointer;
    transition: all 0.2s;
}
.upload-card:hover { border-color: var(--primary); background: #fafbff; }
.upload-card.drag-over { border-color: var(--primary); background: var(--primary-light); }
.upload-card i { font-size: 48px; color: var(--primary); margin-bottom: 12px; }
.upload-card h2 { font-size: 18px; margin-bottom: 8px; }
.upload-card p { color: var(--text-secondary); font-size: 14px; }
.upload-card input[type="file"] { display: none; }

/* 文件信息条 */
.file-info-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
}
.file-info-bar .file-icon { font-size: 24px; color: var(--primary); }
.file-info-bar .file-name { font-weight: 500; flex: 1; }
.file-info-bar .file-status {
    font-size: 13px; padding: 4px 12px; border-radius: 20px; font-weight: 500;
}
.file-status.loading { background: var(--warning-light); color: var(--warning); }
.file-status.success { background: var(--success-light); color: var(--success); }
.file-status.error { background: var(--danger-light); color: var(--danger); }

/* 答题卡片 */
.quiz-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    overflow: hidden;
}
.quiz-card-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fafbfc;
}
.quiz-card-header .chapter-label {
    font-size: 13px;
    color: var(--primary);
    font-weight: 600;
    background: var(--primary-light);
    padding: 3px 10px;
    border-radius: 12px;
}
.quiz-card-header .progress-info { font-size: 14px; color: var(--text-secondary); font-weight: 500; }
.quiz-card-body { padding: 28px 24px; }
.quiz-card-body .q-type-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 16px;
}
.q-type-badge.single { background: #dbeafe; color: #1d4ed8; }
.q-type-badge.multiple { background: #fce7f3; color: #be185d; }
.q-type-badge.essay { background: #d1fae5; color: #047857; }

.quiz-card-body .question-text {
    font-size: 16px;
    font-weight: 500;
    line-height: 1.8;
    margin-bottom: 20px;
    color: var(--text);
    white-space: pre-wrap;
}

.options-list { display: flex; flex-direction: column; gap: 10px; }
.option-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 16px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.15s;
}
.option-item:hover { border-color: var(--primary); background: #fafbff; }
.option-item.selected { border-color: var(--primary); background: var(--primary-light); }
.option-item input[type="radio"], .option-item input[type="checkbox"] {
    width: 18px; height: 18px; margin-top: 2px; accent-color: var(--primary); cursor: pointer; flex-shrink: 0;
}
.option-item .option-label {
    font-weight: 700; color: var(--primary); min-width: 24px; font-size: 15px;
}
.option-item .option-text { flex: 1; font-size: 15px; }

.essay-input {
    width: 100%;
    min-height: 160px;
    padding: 14px 16px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-family: inherit;
    line-height: 1.7;
    resize: vertical;
    transition: border-color 0.2s;
}
.essay-input:focus { outline: none; border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }

/* 答题卡片底部导航 */
.quiz-card-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fafbfc;
}
.quiz-nav-btns { display: flex; gap: 8px; }

/* 进度条 */
.progress-bar-wrap {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
}
.progress-bar-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 2px;
    transition: width 0.3s;
}

/* 加载动画 */
.spinner {
    display: inline-block;
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 结果面板 */
.result-panel {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    padding: 32px;
}
.result-panel h2 { font-size: 22px; margin-bottom: 24px; text-align: center; }
.result-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
}
.stat-card {
    background: #f8fafc;
    border-radius: var(--radius-sm);
    padding: 20px;
    text-align: center;
    border: 1px solid var(--border);
}
.stat-card .stat-value { font-size: 32px; font-weight: 700; color: var(--primary); }
.stat-card .stat-label { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

/* 用户信息区 */
.user-info-form {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 24px;
}
.user-info-form .form-group { flex: 1; min-width: 160px; }
.user-info-form label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
.user-info-form input {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.2s;
}
.user-info-form input:focus { outline: none; border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }

/* Toast */
.toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 24px;
    border-radius: var(--radius-sm);
    font-weight: 500;
    font-size: 14px;
    z-index: 1000;
    box-shadow: var(--shadow-lg);
    animation: toastIn 0.3s ease;
    pointer-events: none;
}
.toast.success { background: var(--success); color: #fff; }
.toast.error { background: var(--danger); color: #fff; }
.toast.warning { background: var(--warning); color: #fff; }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* 滚动条 */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

/* 响应式 */
@media (max-width: 900px) {
    .main-container { flex-direction: column; padding: 16px; }
    .sidebar { width: 100%; }
    .question-nav-list { max-height: 200px; }
    .app-header { padding: 0 16px; }
}

.hidden { display: none !important; }
</style>
</head>
<body>

<!-- 顶部导航 -->
<header class="app-header">
    <div class="logo"><i class="fa-solid fa-book-open"></i>题库答题系统</div>
    <div class="header-actions">
        <button class="btn btn-outline btn-sm" id="btnUploadAnswer" title="上传答案文件"><i class="fa-solid fa-key"></i>导入答案</button>
        <button class="btn btn-outline btn-sm" id="btnReset" title="重新上传题库"><i class="fa-solid fa-arrow-rotate-left"></i>重新上传题库</button>
    </div>
</header>

<!-- 主布局 -->
<div class="main-container">

    <!-- 侧边栏 -->
    <aside class="sidebar hidden" id="sidebar">
        <div class="sidebar-card">
            <h3><i class="fa-solid fa-layer-group"></i> 章节筛选</h3>
            <div id="chapterFilters"></div>
        </div>
        <div class="sidebar-card">
            <h3><i class="fa-solid fa-list-ol"></i> 题目导航</h3>
            <div class="quick-jump-row">
                <input type="number" class="quick-jump-input" id="quickJumpInput" placeholder="输入题号…" min="1">
                <button class="btn btn-primary btn-sm quick-jump-btn" id="btnQuickJump">跳转</button>
            </div>
            <div class="question-nav-list" id="questionNavList"></div>
        </div>
    </aside>

    <!-- 主内容 -->
    <div class="content-area" id="contentArea">

        <!-- 上传区 -->
        <div class="upload-card" id="uploadCard">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <h2>上传题库文档</h2>
            <p>点击或拖拽上传 .docx 或 .pdf 格式的题库文件</p>
            <input type="file" id="fileInput" accept=".docx,.pdf">
        </div>
        <!-- 答案文件上传 input（独立于 uploadCard，避免被 hidden 阻止） -->
        <input type="file" id="answerFileInput" accept=".docx,.pdf" style="display:none;">

        <!-- 文件信息条 -->
        <div class="file-info-bar hidden" id="fileInfoBar">
            <i class="fa-solid fa-file-word file-icon"></i>
            <span class="file-name" id="fileName"></span>
            <span class="file-status" id="fileStatus"></span>
            <button class="btn btn-success btn-sm hidden" id="btnImportAnswer" title="导入标准答案"><i class="fa-solid fa-key"></i>导入答案</button>
            <button class="btn btn-primary btn-sm hidden" id="btnStartQuiz"><i class="fa-solid fa-play"></i>开始答题</button>
        </div>

        <!-- 进度条 -->
        <div class="progress-bar-wrap hidden" id="progressBarWrap">
            <div class="progress-bar-fill" id="progressBarFill" style="width:0%"></div>
        </div>

        <!-- 答题卡片 -->
        <div class="quiz-card hidden" id="quizCard">
            <div class="quiz-card-header">
                <span class="chapter-label" id="quizChapterLabel">章节</span>
                <span class="progress-info" id="quizProgressInfo">第 1 题 / 共 50 题</span>
            </div>
            <div class="quiz-card-body" id="quizCardBody"></div>
            <div class="quiz-card-footer">
                <button class="btn btn-icon" id="btnMark" title="标记此题"><i class="fa-regular fa-bookmark"></i></button>
                <div class="quiz-nav-btns">
                    <button class="btn btn-outline btn-sm" id="btnPrev"><i class="fa-solid fa-chevron-left"></i>上一题</button>
                    <button class="btn btn-outline btn-sm" id="btnNext">下一题<i class="fa-solid fa-chevron-right"></i></button>
                </div>
                <button class="btn btn-primary btn-sm" id="btnSubmit" disabled>提交并查看结果</button>
            </div>
        </div>

        <!-- 结果面板 -->
        <div class="result-panel hidden" id="resultPanel">
            <h2><i class="fa-solid fa-chart-bar"></i> 作答统计</h2>
            <div class="user-info-form">
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" id="userName" placeholder="请输入姓名（可选）">
                </div>
                <div class="form-group">
                    <label>日期</label>
                    <input type="text" id="userDate" placeholder="请输入日期（可选）">
                </div>
            </div>
            <div class="result-stats" id="resultStats"></div>
            <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
                <button class="btn btn-primary" id="btnExport"><i class="fa-solid fa-file-export"></i>导出作答记录 (Word)</button>
                <button class="btn btn-outline" id="btnReview"><i class="fa-solid fa-list-check"></i>继续查看答案</button>
                <button class="btn btn-danger" id="btnRestart"><i class="fa-solid fa-rotate-left"></i>重新开始</button>
            </div>
        </div>
    </div>
</div>

<!-- Toast 容器 -->
<div id="toastContainer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/docx@7.8.0/build/index.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<script>
(function() {
    'use strict';

    // 配置 PDF.js worker
    if (typeof pdfjsLib !== 'undefined') {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    // ==================== 全局状态管理 ====================
    const AppState = {
        questions: [],           // 所有解析出的题目
        userAnswers: {},         // { questionId: answer }  单选存选项字母, 多选存字母串如"ABD", 简答存文本
        markedQuestions: {},     // { questionId: true }
        currentIndex: 0,         // 当前题目索引（在过滤后列表中的位置）
        filteredQuestions: [],   // 按章节筛选后的题目列表
        activeChapter: 'all',    // 当前筛选章节
        quizStarted: false,
        submitted: false,
        submittedChapters: {},   // { chapterName: true }
        fileName: '',
        userName: '',
        userDate: ''
    };

    // 从 localStorage 恢复状态
    function loadState() {
        try {
            const saved = localStorage.getItem('quiz_app_state_v2');
            if (saved) {
                const data = JSON.parse(saved);
                if (data.questions && data.questions.length > 0) {
                    AppState.questions = data.questions;
                    AppState.userAnswers = data.userAnswers || {};
                    AppState.markedQuestions = data.markedQuestions || {};
                    AppState.currentIndex = data.currentIndex || 0;
                    AppState.activeChapter = data.activeChapter || 'all';
                    AppState.quizStarted = data.quizStarted || false;
                    AppState.submitted = data.submitted || false;
                    AppState.submittedChapters = data.submittedChapters || {};
                    AppState.fileName = data.fileName || '';
                    AppState.userName = data.userName || '';
                    AppState.userDate = data.userDate || '';
                    return true;
                }
            }
        } catch(e) {}
        return false;
    }

    // ==================== Toast 通知 ====================
    function showToast(msg, type) {
        type = type || 'success';

    // ==================== 题库解析模块 ====================
    /*
     * 解析流程（状态机）：
     * 1. 用 mammoth.js 提取 .docx 的纯文本
     * 2. 逐行扫描，维护三个状态变量：currentChapter / currentType / currentQuestion
     * 3. 遇到章节标题 -> 更新 currentChapter
     * 4. 遇到题型标题 -> 更新 currentType
     * 5. 遇到题目编号 -> 完成上一题并开始新题
     * 6. 遇到选项行 -> 追加到当前题目的 options
     * 7. 遇到答案行 -> 记录到当前题目的 answer
     * 8. 文档结束时提交最后一题
     */

    // 中文数字映射
    const CN_NUM_MAP = {
        '一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,
        '十一':11,'十二':12,'十三':13,'十四':14,'十五':15,'十六':16,'十七':17,'十八':18,'十九':19,'二十':20,
        '二十一':21,'二十二':22,'二十三':23,'二十四':24,'二十五':25,'二十六':26,'二十七':27,'二十八':28,'二十九':29,'三十':30
    };

    // 章节识别正则
    const CHAPTER_RE = /^第([一二三四五六七八九十百千\d]+)[章节讲单元课篇]\s*(.*)/;
    // 「一、第一章 xxx」格式
    const CHAPTER_RE_V2 = /^[（(]?[一二三四五六七八九十\d]+\s*[）).、．，,。]\s*第([一二三四五六七八九十百千\d]+)[章节讲单元课篇]\s*(.*)/;
    // 精简匹配：行较短且包含"第X章"
    const CHAPTER_RE_SHORT = /第([一二三四五六七八九十百千\d]+)[章节讲单元课篇]/;

    function detectChapter(line) {
        line = line.trim();
        if (line.length === 0) return null;
        var m = line.match(CHAPTER_RE);
        if (m) return line;
        m = line.match(CHAPTER_RE_V2);
        if (m) return line;
        // 兜底：行较短且某处出现第X章且无题号，视为章节标题
        if (line.length < 50 && CHAPTER_RE_SHORT.test(line) && !QUESTION_START_RE.test(line)) return line;
        return null;
    }

    // 从章节名中提取指纹（如 "第一章 进入近代..." → "第一章"、"一、第一章" → "第一章"）
    function extractChapterFingerprint(chapterName) {
        if (!chapterName) return null;
        var m = chapterName.match(/第([一二三四五六七八九十百千\d]+)[章节讲单元课篇]/);
        return m ? m[0] : null;
    }

    // ======== 两遍扫描题型识别 ========
    // 题型关键字 → 枚举映射
    var TYPE_MAP = {
        '多项选择题': 'multiple', '多选题': 'multiple',
        '单项选择题': 'single', '单选题': 'single',
        '简答题': 'essay', '问答题': 'essay', '材料分析题': 'essay', '论述题': 'essay', '名词解释': 'essay',
        '判断题': 'single'
    };
    var TYPE_KEYS = Object.keys(TYPE_MAP);

    // 剥离行首的序数前缀（中/阿数字 + 标点），返回被剥离的文本和剩余内容
    // 例: "二．多项选择题" → stripped="多项选择题"  "1. 单选题" → stripped="单选题"
    var PREFIX_RE = /^[\s\u3000]*[（(]?[一二三四五六七八九十\d]+[）)\s\u00A0]*[\.、．，,。\u3001\uFF0E\u3002]?\s*/;

    function isTypeLine(line) {
        var trimmed = line.trim();
        if (trimmed.length === 0 || trimmed.length > 60) return null;
        if (QUESTION_START_RE.test(trimmed)) return null;

        // 剥离序数前缀后，关键字必须从位置 0 开始
        // 例: "二．多项选择题" → 剥离"二．"→剩"多项选择题"→匹配 ✓
        // 例: "多项选择题的特征" → 剥离为空→剩"多项选择题的特征"→匹配 ✓
        //     (无前缀的纯题型标题是合法的)
        // 例: "下列属于多项选择题的是" → 剥离为空→剩原文→"多项选择题" 不在位置0 → 不匹配 ✗
        var stripped = trimmed.replace(PREFIX_RE, '');
        for (var k = 0; k < TYPE_KEYS.length; k++) {
            if (stripped.indexOf(TYPE_KEYS[k]) === 0) {
                return TYPE_KEYS[k];
            }
        }
        return null;
    }

    // 题目起始标记正则：数字 + 标点（1. 2． 3、 4) 等）
    const QUESTION_START_RE = /^\s*(\d+)\s*[\.、．，,。\)）]\s*/;

    // 选项行正则（保留向后兼容）
    var OPTION_RE = /^\s*([A-Ha-h])\s*[\.、．，,。\)）]\s*/;

    // 全角字母 → 半角映射表
    var FULLWIDTH_MAP = {};
    (function() {
        var fwLetters = 'ＡＢＣＤＥＦＧＨａｂｃｄｅｆｇｈ';
        var hwLetters = 'ABCDEFGHABCDEFGH';
        for (var fi = 0; fi < fwLetters.length; fi++) {
            FULLWIDTH_MAP[fwLetters[fi]] = hwLetters[fi];
        }
    })();

    // 归一化选项标签（全角→半角→大写）
    function normalizeOptLabel(raw) {
        var ch = FULLWIDTH_MAP[raw] || raw;
        return ch.toUpperCase();
    }

    // 从文本中提取选项标记：返回 [{label, startIdx, endIdx}, ...]
    // 严格要求选项标记必须独立出现，不能是英文单词的一部分（如 English. Enterprise: 等）
    function findOptionMarkers(text) {
        var markers = [];

        function isEnglishLetter(ch) {
            return ch && /[A-Za-z]/.test(ch);
        }

        function isIsolated(idx) {
            // 选项字母前不能是另一个英文字母（防止 English. 中的 E. 被误识别）
            if (idx === 0) return true;
            return !isEnglishLetter(text[idx - 1]);
        }

        // 模式1: (A) （A） (Ａ) （Ａ） — 括号包围，天然隔离，无需额外校验
        var parenRe = /[(（]\s*([A-Ha-hＡ-Ｈａ-ｈ])\s*[)）]/g;
        var pm;
        while ((pm = parenRe.exec(text)) !== null) {
            markers.push({
                label: normalizeOptLabel(pm[1]),
                startIdx: pm.index,
                endIdx: pm.index + pm[0].length
            });
        }

        // 模式2: A. A、 A) A） Ａ． Ａ、 Ａ） — 需校验前置字符不是英文字母
        var suffixRe = /([A-Ha-hＡ-Ｈａ-ｈ])\s*[\.、．，,。\)）]/g;
        var sm;
        while ((sm = suffixRe.exec(text)) !== null) {
            // 跳过已被模式1覆盖的
            var covered = markers.some(function(m) {
                return sm.index >= m.startIdx && sm.index < m.endIdx;
            });
            if (covered) continue;

            // 关键校验：选项字母必须独立，不能是英文单词的一部分
            if (!isIsolated(sm.index)) continue;

            markers.push({
                label: normalizeOptLabel(sm[1]),
                startIdx: sm.index,
                endIdx: sm.index + sm[0].length
            });
        }

        markers.sort(function(a, b) { return a.startIdx - b.startIdx; });
        return markers;
    }

    // 答案识别正则（支持全角字母）
    var ANSWER_RE = /^(?:答案|参考答案|标准答案)[：:\s]*([A-Ha-hＡ-Ｈａ-ｈ]+)/i;
    var ANSWER_SIMPLE_RE = /^([A-Ha-hＡ-Ｈａ-ｈ]+)$/;

    function parseDocxText(text) {
        var lines = text.split(/\r?\n/);
        var questions = [];
        var currentChapter = '';
        var currentType = 'single'; // single | multiple | essay
        var currentQuestion = null;
        var globalId = 0;

        // 预处理：清理页码、空行、无关标记
        var cleanedLines = [];
        for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            // 跳过页码行（纯数字或带横线的页码）
            if (/^\s*\d+\s*$/.test(line)) continue;
            if (/^\s*-\s*\d+\s*-\s*$/.test(line)) continue;
            // 跳过明显的页眉页脚
            if (/^第\s*\d+\s*页/.test(line)) continue;
            // 跳过过短的无意义行（但保留可能为答案的单字母）
            if (line.length === 0) { cleanedLines.push(line); continue; }
            cleanedLines.push(line);
        }

        // 将文本按选项标记切分成 {question, options[]}
        function splitOptionsFromText(rawText) {
            var markers = findOptionMarkers(rawText);
            if (markers.length === 0) {
                return { question: rawText, options: [] };
            }
            // 题干 = 第一个选项标记之前的内容
            var question = rawText.substring(0, markers[0].startIdx).trim();
            // 选项 = 相邻标记之间的内容
            var options = [];
            for (var oi = 0; oi < markers.length; oi++) {
                var textStart = markers[oi].endIdx;
                var textEnd = (oi + 1 < markers.length) ? markers[oi + 1].startIdx : rawText.length;
                var optText = rawText.substring(textStart, textEnd).trim();
                options.push({ label: markers[oi].label, text: optText });
            }
            return { question: question, options: options };
        }

        function finalizeQuestion() {
            if (!currentQuestion) return;
            // 清理题干：移除多余的空白
            currentQuestion.question = currentQuestion.question.replace(/\s+/g, ' ').trim();

            // 后处理：选择题如果还没有选项，尝试从题干文本中分离内嵌选项
            if ((currentQuestion.type === 'single' || currentQuestion.type === 'multiple') &&
                currentQuestion.options.length === 0 && currentQuestion.question.length > 0) {
                var split = splitOptionsFromText(currentQuestion.question);
                if (split.options.length > 0) {
                    currentQuestion.question = split.question;
                    currentQuestion.options = split.options;
                }
            }

            if (currentQuestion.question.length > 0) {
                globalId++;
                currentQuestion.id = globalId;
                currentQuestion.chapter = currentChapter || '未分类';
                questions.push(currentQuestion);
            }
            currentQuestion = null;
        }

        // ====== 预处理：将所有章节/题型标题与后续内容拆分为独立行 ======
        var expandedLines = [];
        for (var pi = 0; pi < cleanedLines.length; pi++) {
            var pLine = cleanedLines[pi];

            // 章节标题拆分
            var chMatch = pLine.match(CHAPTER_RE) || pLine.match(CHAPTER_RE_V2);
            if (chMatch) {
                expandedLines.push(pLine); // 保留完整章节行
                var chRem = pLine.substring(chMatch.index + chMatch[0].length).trim();
                if (chRem.length > 0) expandedLines.push(chRem);
                continue;
            }

            // 题型标题拆分
            var kw = isTypeLine(pLine);
            if (kw) {
                expandedLines.push(pLine); // 保留完整题型行
                var kwIdx = pLine.indexOf(kw);
                var tyRem = pLine.substring(kwIdx + kw.length).trim();
                if (tyRem.length > 0) expandedLines.push(tyRem);
                continue;
            }

            expandedLines.push(pLine);
        }
        cleanedLines = expandedLines;

        // ====== 第一遍扫描：预记录所有题型切换位置 ======
        var typeTransitions = [];
        var defaultStartType = 'single';
        for (var ti = 0; ti < cleanedLines.length; ti++) {
            var tLine = cleanedLines[ti].trim();
            if (tLine.length === 0) continue;
            var kw2 = isTypeLine(tLine);
            if (kw2) {
                var tp = TYPE_MAP[kw2];
                typeTransitions.push({ lineIndex: ti, keyword: kw2, type: tp });
                if (ti === 0) defaultStartType = tp;
            }
        }
        currentType = defaultStartType;
        console.log('Pre-scan: found ' + typeTransitions.length + ' type transitions (total lines: ' + cleanedLines.length + ')');
        for (var tti = 0; tti < typeTransitions.length; tti++) {
            var dbgLine = cleanedLines[typeTransitions[tti].lineIndex];
            console.log('  Line ' + typeTransitions[tti].lineIndex + ': "' + (dbgLine.length > 50 ? dbgLine.substring(0, 47) + '...' : dbgLine) + '" → ' + typeTransitions[tti].type + ' (' + typeTransitions[tti].keyword + ')');
        }

        // ====== 第二遍扫描：主解析循环（所有 split 已在预处理完成，不再 splice） ======
        var transIdx = 0;
        for (var i = 0; i < cleanedLines.length; i++) {
            var line = cleanedLines[i];

            // 跳过空行
            if (line.length === 0) continue;

            // === 题型切换（预先记录，精准定位于当前行）===
            while (transIdx < typeTransitions.length && typeTransitions[transIdx].lineIndex <= i) {
                if (typeTransitions[transIdx].lineIndex === i) {
                    finalizeQuestion();
                    var newT = typeTransitions[transIdx].type;
                    if (newT) currentType = newT;
                    console.log('TYPE SWITCH at line ' + i + ': → ' + currentType + ' (' + typeTransitions[transIdx].keyword + ')');
                }
                transIdx++;
            }

            // === 章节标题（预处理已拆分，此处仅记录章节名）===
            var chapterMatch = detectChapter(line);
            if (chapterMatch) {
                finalizeQuestion();
                currentChapter = line.trim();
                continue;
            }

            // === 题型标题行（预处理已拆分，此处仅跳过）===
            if (isTypeLine(line)) {
                continue;
            }

            // === 检测题目起始 ===
            var qStartMatch = line.match(QUESTION_START_RE);
            if (qStartMatch) {
                finalizeQuestion();
                var rawText = line.substring(qStartMatch[0].length);

                if (currentType === 'single' || currentType === 'multiple') {
                    var split = splitOptionsFromText(rawText);
                    currentQuestion = {
                        chapter: currentChapter,
                        id: 0,
                        type: currentType,
                        question: split.question,
                        options: split.options,
                        answer: ''
                    };
                } else {
                    currentQuestion = {
                        chapter: currentChapter,
                        id: 0,
                        type: currentType,
                        question: rawText,
                        options: [],
                        answer: ''
                    };
                }
                continue;
            }

            // 如果尚未开始任何题目，跳过
            if (!currentQuestion) continue;

            // === 当前在题目内部，检测选项行 ===
            if (currentType === 'single' || currentType === 'multiple') {
                var optMarkers = findOptionMarkers(line);
                if (optMarkers.length > 0) {
                    for (var oi = 0; oi < optMarkers.length; oi++) {
                        var textStart = optMarkers[oi].endIdx;
                        var textEnd = (oi + 1 < optMarkers.length) ? optMarkers[oi + 1].startIdx : line.length;
                        var optText = line.substring(textStart, textEnd).trim();
                        currentQuestion.options.push({ label: optMarkers[oi].label, text: optText });
                    }
                    continue;
                }
            }

            // === 检测答案行 ===
            var ansMatch = line.match(ANSWER_RE);
            if (ansMatch) {
                currentQuestion.answer = normalizeOptLabel(ansMatch[1]);
                continue;
            }
            var ansSimpleMatch = line.match(ANSWER_SIMPLE_RE);
            if (ansSimpleMatch && line.length <= 8 && currentQuestion.options.length > 0 &&
                !currentQuestion.answer && (currentType === 'single' || currentType === 'multiple')) {
                var rawAns = ansSimpleMatch[1];
                var normalized = '';
                for (var ci = 0; ci < rawAns.length; ci++) {
                    normalized += normalizeOptLabel(rawAns[ci]);
                }
                currentQuestion.answer = normalized;
                continue;
            }

            // === 其他行：追加到题干 ===
            if (currentType === 'essay') {
                currentQuestion.question += '\n' + line;
            } else if (currentQuestion.options.length === 0) {
                currentQuestion.question += ' ' + line;
            }
        }

        // 处理最后一题
        finalizeQuestion();

        // === 二次校正：修复题型分类漏网之鱼 ===
        for (var qi = 0; qi < questions.length; qi++) {
            var q = questions[qi];
            if (q.type !== 'single' && q.type !== 'multiple') continue;

            // 规则1：答案长度 > 1 必定是多选
            if (q.answer && q.answer.length > 1 && q.type === 'single') {
                console.log('Correction (answer length): Q' + q.id + ' single→multiple (answer=' + q.answer + ')');
                q.type = 'multiple';
            }

            // 规则2：选项数 > 4 大概率是多选
            if (q.options.length > 4 && q.type === 'single') {
                console.log('Correction (options count): Q' + q.id + ' single→multiple (' + q.options.length + ' options)');
                q.type = 'multiple';
            }
        }

        // 打印解析统计
        var stats = { single: 0, multiple: 0, essay: 0 };
        for (var si = 0; si < questions.length; si++) { stats[questions[si].type]++; }
        console.log('Parse complete: ' + questions.length + ' questions (' + stats.single + ' single / ' + stats.multiple + ' multiple / ' + stats.essay + ' essay)');

        return questions;
    }

    // ==================== 文件上传处理 ====================
    function handleFile(file) {
        if (!file) return;
        var nameLower = file.name.toLowerCase();
        var isDocx = nameLower.endsWith('.docx');
        var isPdf = nameLower.endsWith('.pdf');
        if (!isDocx && !isPdf) {
            showToast('请选择 .docx 或 .pdf 格式的文件', 'error');
            return;
        }

        // 如果已有题目，二次确认（重新上传题库将清除已导入的答案）
        if (AppState.questions.length > 0) {
            if (!confirm('⚠️ 重新上传题库将清除当前题库、导入的答案和所有答题记录。上传后需要重新导入答案文件。\n\n确定要继续吗？')) {
                return;
            }
        }
        AppState.fileName = file.name;
        dom.fileName.textContent = file.name;
        dom.fileStatus.textContent = '正在解析...';
        dom.fileStatus.className = 'file-status loading';
        dom.fileInfoBar.classList.remove('hidden');
        dom.btnStartQuiz.classList.add('hidden');
        dom.btnImportAnswer.classList.add('hidden');
        dom.uploadCard.classList.add('hidden');
        // 清除旧缓存，确保全新解析
        localStorage.removeItem('quiz_app_state_v2');

        // 更新文件图标
        var fileIcon = dom.fileInfoBar.querySelector('.file-icon');
        if (fileIcon) {
            if (isPdf) {
                fileIcon.className = 'fa-solid fa-file-pdf file-icon';
            } else {
                fileIcon.className = 'fa-solid fa-file-word file-icon';
            }
        }

        var reader = new FileReader();
        reader.onload = function(e) {
            var arrayBuffer = e.target.result;

            // 提取文本的 Promise
            var textPromise;
            if (isDocx) {
                textPromise = mammoth.extractRawText({ arrayBuffer: arrayBuffer }).then(function(result) {
                    return result.value;
                });
            } else {
                textPromise = extractPdfText(arrayBuffer);
            }

            textPromise.then(function(text) {
                // 调试输出
                console.log('=== RAW TEXT (first 3000 chars) ===');
                console.log(text.substring(0, 3000));
                console.log('=== END RAW TEXT ===');
                var kwMatch = text.match(/多项选择题|多选题/g);
                if (kwMatch) {
                    console.log('FOUND type keywords: ' + kwMatch.length + ' occurrences');
                    var idx = text.indexOf('多项选择题');
                    if (idx >= 0) {
                        console.log('First "多项选择题" context: "' + text.substring(Math.max(0, idx - 20), idx + 40) + '"');
                    }
                } else {
                    console.log('WARNING: "多项选择题" keyword NOT FOUND in document!');
                }

                var questions = parseDocxText(text);

                if (questions.length === 0) {
                    throw new Error('未能识别到有效题目，请检查文档格式');
                }

                // 检测是否为答案文件（而非题库）：答案文件的题干极短
                var emptyQuestionCount = 0;
                for (var eqi = 0; eqi < questions.length; eqi++) {
                    if (questions[eqi].question.length < 5 && questions[eqi].options.length === 0) emptyQuestionCount++;
                }
                var emptyRatio = emptyQuestionCount / questions.length;
                if (emptyRatio > 0.7 && questions.length > 10) {
                    dom.fileStatus.textContent = '疑似答案文件';
                    dom.fileStatus.className = 'file-status error';

                    showToast('⚠️ 该文件看起来像答案文件而非题库文件！\n\n正确操作：先在此上传题库文件，再点击顶部「🔑 导入答案」按钮上传答案文件。', 'error');
                    return;
                }

                AppState.questions = questions;
                AppState.userAnswers = {};
                AppState.markedQuestions = {};
                AppState.currentIndex = 0;
                AppState.activeChapter = 'all';
                AppState.quizStarted = false;

                AppState.submittedChapters = {};
                updateFilteredQuestions();

                dom.fileStatus.textContent = '解析完成 (' + questions.length + ' 题)';
                dom.fileStatus.className = 'file-status success';
                dom.btnStartQuiz.classList.remove('hidden');
                showToast('解析成功！共识别 ' + questions.length + ' 道题目', 'success');

                // 显示「导入答案」按钮，引导用户上传答案文件
                dom.btnImportAnswer.classList.remove('hidden');
            }).catch(function(err) {

                dom.fileStatus.textContent = '解析失败';
                dom.fileStatus.className = 'file-status error';
                showToast('解析失败：' + (err.message || '未知错误'), 'error');
                console.error(err);
            });
        };
        reader.onerror = function() {
            showToast('文件读取失败，请重试', 'error');
        };
        reader.readAsArrayBuffer(file);
    }

    // PDF 文本提取（使用 PDF.js）
    function extractPdfText(arrayBuffer) {
        return pdfjsLib.getDocument({ data: arrayBuffer }).promise.then(function(pdf) {
            var maxPages = pdf.numPages;
            var pagePromises = [];
            for (var pageNum = 1; pageNum <= maxPages; pageNum++) {
                pagePromises.push(
                    pdf.getPage(pageNum).then(function(page) {
                        return page.getTextContent().then(function(textContent) {
                            var pageText = '';
                            var lastY = null;
                            var items = textContent.items;
                            for (var i = 0; i < items.length; i++) {
                                var item = items[i];
                                var tx = item.transform;
                                var y = Math.round(tx ? tx[5] : 0);
                                // 如果 Y 坐标大幅跳跃，插入换行（模拟布局）
                                if (lastY !== null && Math.abs(y - lastY) > 4) {
                                    pageText += '\n';
                                }
                                if (item.str) {
                                    pageText += item.str;
                                }
                                // 空格间距判断
                                if (item.hasEOL) {
                                    pageText += '\n';
                                }
                                lastY = y;
                            }
                            return pageText;
                        });
                    })
                );
            }
            return Promise.all(pagePromises).then(function(pageTexts) {
                return pageTexts.join('\n');
            });
        });
    }

    function handleAnswerFile(file) {
        if (!file) return;
        if (AppState.questions.length === 0) {
            showToast('题库未加载，无法导入答案。请先上传题库文件。', 'error');
            return;
        }
        var nameLower = file.name.toLowerCase();
        var isDocx = nameLower.endsWith('.docx');
        var isPdf = nameLower.endsWith('.pdf');
        if (!isDocx && !isPdf) {
            showToast('请选择 .docx 或 .pdf 格式的答案文件', 'error');
            return;
        }

        showToast('正在解析答案文件...', 'warning');

        var reader = new FileReader();
        reader.onload = function(e) {
            var arrayBuffer = e.target.result;
            var textPromise;
            if (isDocx) {
                textPromise = mammoth.extractRawText({ arrayBuffer: arrayBuffer }).then(function(r) { return r.value; });
            } else {
                textPromise = extractPdfText(arrayBuffer);
            }

            textPromise.then(function(text) {
                console.log('=== ANSWER FILE RAW TEXT (first 2000 chars) ===');
                console.log(text.substring(0, 2000));
                console.log('=== END ANSWER RAW TEXT ===');

                var parsedAnswers = parseAnswerText(text);
                console.log('Answer parser result: ' + Object.keys(parsedAnswers).length + ' entries');

                // 章节模糊匹配：答案文件章节名（如 "一、第一章"）与题库章节名（如 "第一章 进入近代..."）不一致，
                // 按第X章指纹对齐
                var chapterFingerprint = {}; // "第一章" → 题库中的完整章节名
                for (var ci = 0; ci < AppState.questions.length; ci++) {
                    var qc = AppState.questions[ci].chapter;
                    var fp = extractChapterFingerprint(qc);
                    if (fp) chapterFingerprint[fp] = qc;
                }

                // 重建 parsedAnswers，用题库的完整章节名替换章节名
                var alignedAnswers = {};
                var answerKeys = Object.keys(parsedAnswers);
                for (var ki = 0; ki < answerKeys.length; ki++) {
                    var k = answerKeys[ki];
                    if (k === '_formatFlag') continue;
                    var parts = k.split('|||');
                    if (parts.length !== 3) continue;
                    var ansFp = extractChapterFingerprint(parts[0]);
                    var realChapter = chapterFingerprint[ansFp] || parts[0]; // 匹配不到则原样保留
                    alignedAnswers[realChapter + '|||' + parts[1] + '|||' + parts[2]] = parsedAnswers[k];
                }

                console.log('Aligned answers: ' + Object.keys(alignedAnswers).length + ' entries');
                console.log('Chapter fingerprints from bank:');
                var bankFps = Object.keys(chapterFingerprint);
                for (var bfi = 0; bfi < bankFps.length; bfi++) {
                    console.log('  "' + bankFps[bfi] + '" → "' + chapterFingerprint[bankFps[bfi]] + '"');
                }

                // 构建题型内序数索引
                var typePosition = {};
                for (var i = 0; i < AppState.questions.length; i++) {
                    var q = AppState.questions[i];
                    if (q.type === 'essay') continue;
                    var tk = q.chapter + '|||' + q.type;
                    if (!typePosition[tk]) typePosition[tk] = 0;
                    typePosition[tk]++;
                    var lookupKey = q.chapter + '|||' + q.type + '|||' + typePosition[tk];
                    typePosition['_map_' + q.id] = lookupKey;
                }

                // 应用答案
                var applied = 0;
                for (var i = 0; i < AppState.questions.length; i++) {
                    var q = AppState.questions[i];
                    if (q.type === 'essay') continue;
                    var lookupKey = typePosition['_map_' + q.id];
                    if (lookupKey && alignedAnswers[lookupKey] !== undefined) {
                        q.answer = alignedAnswers[lookupKey];
                        applied++;
                    }
                }

                saveState();

                console.log('Answer import: ' + applied + ' answers applied from ' + Object.keys(alignedAnswers).length + ' aligned entries');

                if (applied > 0) {
                    showToast('成功导入 ' + applied + ' 道选择题的标准答案', 'success');
                    if (AppState.quizStarted) {
                        renderCurrentQuestion();
                    }
                } else if (Object.keys(alignedAnswers).length === 0) {
                    showToast('❌ 答案文件中未识别到任何答案', 'error');
                } else {
                    showToast('❌ 解析出 ' + Object.keys(alignedAnswers).length + ' 条答案但未匹配到任何题目——章节名可能不一致，请查看控制台 (F12) 对比章节指纹', 'error');
                    console.log('Aligned answer keys (first 30):');
                    var keys = Object.keys(alignedAnswers);
                    for (var ki = 0; ki < Math.min(keys.length, 30); ki++) {
                        console.log('  PARSED: ' + keys[ki] + ' = ' + alignedAnswers[keys[ki]]);
                    }
                    console.log('Question bank expected keys (first 30):');
                    var allSampleKeys = [];
                    for (var i = 0; i < Math.min(AppState.questions.length, 30); i++) {
                        var aq = AppState.questions[i];
                        if (aq.type === 'essay') continue;
                        var ask = typePosition['_map_' + aq.id];
                        if (ask) allSampleKeys.push(ask);
                    }
                    for (var ai = 0; ai < allSampleKeys.length; ai++) {
                        console.log('  EXPECT: ' + allSampleKeys[ai]);
                    }
                }
            }).catch(function(err) {
                showToast('答案解析失败：' + (err.message || '未知错误'), 'error');
                console.error(err);
            });
        };
        reader.onerror = function() {
            showToast('文件读取失败，请重试', 'error');
        };
        reader.readAsArrayBuffer(file);
    }

    // 解析答案文件文本，返回 { "章节|||type|||题号": "答案" } 映射
    // 题号是章节内按题型分组的顺序号（从1开始）
    function parseAnswerText(text) {
        var lines = text.split(/\r?\n/);
        var answers = {};
        var currentChapter = '';
        var currentType = null;
        var questionNum = 0;

        // 预处理：拆分同行章节/题型标题
        var expandedLines = [];
        for (var pi = 0; pi < lines.length; pi++) {
            var pLine = lines[pi];
            var chMatch = pLine.match(CHAPTER_RE) || pLine.match(CHAPTER_RE_V2);
            if (chMatch) {
                expandedLines.push(pLine);
                var rem = pLine.substring(chMatch.index + chMatch[0].length).trim();
                if (rem.length > 0) expandedLines.push(rem);
                continue;
            }
            var kw = isTypeLine(pLine);
            if (kw) {
                expandedLines.push(pLine);
                var kwIdx = pLine.indexOf(kw);
                var tyRem = pLine.substring(kwIdx + kw.length).trim();
                if (tyRem.length > 0) expandedLines.push(tyRem);
                continue;
            }
            expandedLines.push(pLine);
        }

        for (var i = 0; i < expandedLines.length; i++) {
            var line = expandedLines[i].trim();
            if (line.length === 0) continue;

            // 章节
            var chMatch = detectChapter(line);
            if (chMatch) {
                currentChapter = line.trim();
                questionNum = 0;
                currentType = null;
                continue;
            }

            // 题型
            var kw = isTypeLine(line);
            if (kw) {
                currentType = TYPE_MAP[kw];
                questionNum = 0; // 每种题型序号从头开始
                continue;
            }

            // 答案行：数字 + 标点（可能无空格）+ 答案字母
            // 支持单行多答案：1.B 2.A 3.A 4.D 5.C
            // 支持紧凑格式：1.B（无空格）
            // 支持分隔格式：1. B / 1、A / 1) B
            var globalAnsRe = /(\d+)\s*[\.、．，,。\)）]\s*/g;
            var ansMatches = [];
            var gam;
            while ((gam = globalAnsRe.exec(line)) !== null) {
                ansMatches.push({
                    num: gam[1],
                    startIdx: gam.index,
                    endIdx: gam.index + gam[0].length
                });
            }
            if (ansMatches.length > 0) {
                if (currentType === 'essay') continue;
                if (!currentChapter || !currentType) continue;

                for (var ai = 0; ai < ansMatches.length; ai++) {
                    questionNum++;
                    var textStart = ansMatches[ai].endIdx;
                    var textEnd = (ai + 1 < ansMatches.length) ? ansMatches[ai + 1].startIdx : line.length;
                    var afterNum = line.substring(textStart, textEnd).trim();

                    var ansMatch = afterNum.match(/[A-Ha-hＡ-Ｈａ-ｈ]+/);
                    if (ansMatch) {
                        var rawAns = ansMatch[0];
                        var normalized = '';
                        for (var ci = 0; ci < rawAns.length; ci++) {
                            normalized += normalizeOptLabel(rawAns[ci]);
                        }
                        answers[currentChapter + '|||' + currentType + '|||' + questionNum] = normalized;
                        if (!answers._formatFlag) answers._formatFlag = 'numbered';
                    }
                }
                continue;
            }

            // "答案：X" 格式
            var ansKeywordMatch = line.match(ANSWER_RE);
            if (ansKeywordMatch && currentType !== 'essay' && currentChapter && currentType) {
                questionNum++;
                var kwAns = '';
                for (var cci = 0; cci < ansKeywordMatch[1].length; cci++) {
                    kwAns += normalizeOptLabel(ansKeywordMatch[1][cci]);
                }
                answers[currentChapter + '|||' + currentType + '|||' + questionNum] = kwAns;
                if (!answers._formatFlag) answers._formatFlag = 'numbered';
                continue;
            }

            // 纯字母行：仅在无编号格式时自增计数
            var pureAnsMatch = line.match(/^\s*([A-Ha-hＡ-Ｈａ-ｈ]+)\s*$/);
            if (pureAnsMatch && currentType !== 'essay' && currentChapter && currentType) {
                if (answers._formatFlag !== 'numbered') {
                    questionNum++;
                }
                var rawAns2 = pureAnsMatch[1];
                var normalized2 = '';
                for (var ci2 = 0; ci2 < rawAns2.length; ci2++) {
                    normalized2 += normalizeOptLabel(rawAns2[ci2]);
                }
                var key2 = currentChapter + '|||' + currentType + '|||' + questionNum;
                if (!answers[key2]) {
                    answers[key2] = normalized2;
                }
            }
        }

        // 清除内部标记
        delete answers._formatFlag;
        return answers;
    }
