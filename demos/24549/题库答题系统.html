    // 渲染当前题目
    function renderCurrentQuestion() {
        var list = AppState.filteredQuestions;
        if (list.length === 0) {
            dom.quizCardBody.innerHTML = '<p style="text-align:center;color:var(--text-secondary);padding:40px;">该章节暂无题目</p>';
            dom.quizChapterLabel.textContent = '无题目';
            dom.quizProgressInfo.textContent = '';
            updateNavButtons();
            updateMarkButton();
            return;
        }

        if (AppState.currentIndex >= list.length) AppState.currentIndex = list.length - 1;
        if (AppState.currentIndex < 0) AppState.currentIndex = 0;

        var q = list[AppState.currentIndex];
        dom.quizChapterLabel.textContent = truncateChapter(q.chapter);
        dom.quizProgressInfo.textContent = '第 ' + (AppState.currentIndex + 1) + ' 题 / 共 ' + list.length + ' 题';

        var html = '';
        var typeLabel, typeClass;
        if (q.type === 'single') { typeLabel = '单项选择题'; typeClass = 'single'; }
        else if (q.type === 'multiple') { typeLabel = '多项选择题'; typeClass = 'multiple'; }
        else { typeLabel = '简答题'; typeClass = 'essay'; }

        html += '<span class="q-type-badge ' + typeClass + '">' + typeLabel + '</span>';
        html += '<div class="question-text">' + escapeHtml(q.question) + '</div>';

        if (q.type === 'single' || q.type === 'multiple') {
            html += '<div class="options-list">';
            var inputType = q.type === 'single' ? 'radio' : 'checkbox';
            var inputName = 'q_' + q.id;
            var userAnswer = AppState.userAnswers[q.id] || '';

            for (var i = 0; i < q.options.length; i++) {
                var opt = q.options[i];
                var checked = '';
                if (q.type === 'single') {
                    checked = (userAnswer === opt.label) ? ' checked' : '';
                } else {
                    checked = (userAnswer.indexOf(opt.label) !== -1) ? ' checked' : '';
                }
                html += '<label class="option-item' + (checked ? ' selected' : '') + '" data-opt="' + opt.label + '">';
                html += '<input type="' + inputType + '" name="' + inputName + '" value="' + opt.label + '"' + checked + '>';
                html += '<span class="option-label">' + opt.label + '.</span>';
                html += '<span class="option-text">' + escapeHtml(opt.text) + '</span>';
                html += '</label>';
            }
            html += '</div>';
        } else {
            // 简答题
            html += '<textarea class="essay-input" id="essayInput" placeholder="请输入你的答案...">';
            html += escapeHtml(AppState.userAnswers[q.id] || '');
            html += '</textarea>';
        }

        dom.quizCardBody.innerHTML = html;

        // 绑定选项事件
        if (q.type === 'single' || q.type === 'multiple') {
            var optionItems = dom.quizCardBody.querySelectorAll('.option-item');
            for (var i = 0; i < optionItems.length; i++) {
                optionItems[i].addEventListener('click', function(e) {
                    var label = this.getAttribute('data-opt');
                    var input = this.querySelector('input');
                    if (q.type === 'single') {
                        // 单选题：选中当前，取消其他
                        AppState.userAnswers[q.id] = label;
                    } else {
                        // 多选题：切换勾选
                        input.checked = !input.checked;
                        var currentVals = AppState.userAnswers[q.id] || '';
                        if (input.checked) {
                            if (currentVals.indexOf(label) === -1) currentVals += label;
                        } else {
                            currentVals = currentVals.replace(label, '');
                        }
                        // 按字母排序
                        AppState.userAnswers[q.id] = currentVals.split('').sort().join('');
                    }
                    saveState();
                    renderCurrentQuestion();
                    renderQuestionNav();
                    checkAllAnswered();
                });
            }
        }

        // 绑定简答题输入事件
        if (q.type === 'essay') {
            var essayInput = $('#essayInput');
            if (essayInput) {
                essayInput.addEventListener('input', function() {
                    AppState.userAnswers[q.id] = this.value;
                    saveState();
                    renderQuestionNav();
                    checkAllAnswered();
                });
            }
        }

        updateNavButtons();
        updateMarkButton();
        updateProgress();
    }

    function updateNavButtons() {
        var list = AppState.filteredQuestions;
        dom.btnPrev.disabled = (AppState.currentIndex <= 0);
        dom.btnNext.disabled = (AppState.currentIndex >= list.length - 1);
    }

    function updateMarkButton() {
        var list = AppState.filteredQuestions;
        if (list.length === 0) return;
        var q = list[AppState.currentIndex];
        var marked = AppState.markedQuestions[q.id];
        dom.btnMark.innerHTML = marked ? '<i class="fa-solid fa-bookmark"></i>' : '<i class="fa-regular fa-bookmark"></i>';
        dom.btnMark.style.color = marked ? 'var(--warning)' : '';
    }

    function checkAllAnswered() {
        var allAnswered = true;
        for (var i = 0; i < AppState.questions.length; i++) {
            var q = AppState.questions[i];
            var ans = AppState.userAnswers[q.id];
            if (ans === undefined || ans === '') {
                allAnswered = false;
                break;
            }
        }
        dom.btnSubmit.disabled = !allAnswered || AppState.submitted;
    }

    function updateProgress() {
        var list = AppState.filteredQuestions;
        var total = AppState.questions.length;
        var answered = 0;
        for (var i = 0; i < AppState.questions.length; i++) {
            var ans = AppState.userAnswers[AppState.questions[i].id];
            if (ans !== undefined && ans !== '') answered++;
        }
        var pct = total > 0 ? Math.round((answered / total) * 100) : 0;
        dom.progressBarFill.style.width = pct + '%';
        checkAllAnswered();
    }

    // 导航按钮事件
    dom.btnPrev.addEventListener('click', function() {
        if (AppState.currentIndex > 0) {
            AppState.currentIndex--;
            renderCurrentQuestion();
            renderQuestionNav();
            saveState();
        }
    });
    dom.btnNext.addEventListener('click', function() {
        var list = AppState.filteredQuestions;
        if (AppState.currentIndex < list.length - 1) {
            AppState.currentIndex++;
            renderCurrentQuestion();
            renderQuestionNav();
            saveState();
        }
    });

    // 标记按钮
    dom.btnMark.addEventListener('click', function() {
        var list = AppState.filteredQuestions;
        if (list.length === 0) return;
        var q = list[AppState.currentIndex];
        if (AppState.markedQuestions[q.id]) {
            delete AppState.markedQuestions[q.id];
        } else {
            AppState.markedQuestions[q.id] = true;
        }
        updateMarkButton();
        renderQuestionNav();
        saveState();
    });

    // 快速跳转到指定题号
    function jumpToQuestionId(targetId) {
        var targetIdNum = parseInt(targetId);
        if (isNaN(targetIdNum) || targetIdNum < 1) {
            showToast('请输入有效的题号', 'error');
            return false;
        }
        // 在全部题目中查找
        var found = null;
        for (var i = 0; i < AppState.questions.length; i++) {
            if (AppState.questions[i].id === targetIdNum) {
                found = AppState.questions[i];
                break;
            }
        }
        if (!found) {
            showToast('未找到第 ' + targetIdNum + ' 题（共 ' + AppState.questions.length + ' 题）', 'error');
            return false;
        }
        // 需要切换到对应章节
        if (AppState.activeChapter !== 'all' && AppState.activeChapter !== found.chapter) {
            AppState.activeChapter = found.chapter;
            updateFilteredQuestions();
            renderChapterFilters();
        } else if (AppState.activeChapter === 'all') {
            updateFilteredQuestions();
        }
        // 在筛选后列表中找到对应位置
        for (var j = 0; j < AppState.filteredQuestions.length; j++) {
            if (AppState.filteredQuestions[j].id === targetIdNum) {
                AppState.currentIndex = j;
                renderCurrentQuestion();
                renderQuestionNav();
                updateProgress();
                saveState();
                dom.quickJumpInput.value = '';
                return true;
            }
        }
        showToast('当前筛选下未找到该题，请切换章节', 'warning');
        return false;
    }

    // 跳转按钮点击
    dom.btnQuickJump.addEventListener('click', function() {
        var val = dom.quickJumpInput.value.trim();
        jumpToQuestionId(val);
    });

    // 回车键跳转
    dom.quickJumpInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            jumpToQuestionId(this.value.trim());
        }
    });

    // 键盘导航
    document.addEventListener('keydown', function(e) {
        if (!AppState.quizStarted || AppState.submitted) return;
        // 在输入框/文本域中时不处理导航键
        if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') {
            return;
        }
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            e.preventDefault();
            dom.btnPrev.click();
        } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
            e.preventDefault();
            dom.btnNext.click();
        }
    });

    // ==================== 提交与结果 ====================
    dom.btnSubmit.addEventListener('click', function() {
        if (!confirm('确定要提交答案吗？提交后将无法修改。')) return;
        AppState.submitted = true;
        saveState();
        showResults();
    });

    function showResults() {
        dom.quizCard.classList.add('hidden');
        dom.resultPanel.classList.remove('hidden');
        dom.btnSubmit.disabled = true;

        var total = AppState.questions.length;
        var answered = 0;
        var correctCount = 0;
        var choiceTotal = 0; // 选择题总数（单选+多选）
        var essayTotal = 0;

        for (var i = 0; i < AppState.questions.length; i++) {
            var q = AppState.questions[i];
            var userAns = AppState.userAnswers[q.id] || '';
            if (userAns !== '') answered++;
            if (q.type === 'single' || q.type === 'multiple') {
                choiceTotal++;
                if (userAns.toUpperCase() === q.answer.toUpperCase()) correctCount++;
            } else {
                essayTotal++;
            }
        }

        var accuracy = choiceTotal > 0 ? Math.round((correctCount / choiceTotal) * 100) : 0;

        dom.resultStats.innerHTML =
            '<div class="stat-card"><div class="stat-value">' + total + '</div><div class="stat-label">总题数</div></div>' +
            '<div class="stat-card"><div class="stat-value">' + answered + '</div><div class="stat-label">已答题数</div></div>' +
            '<div class="stat-card"><div class="stat-value">' + correctCount + '</div><div class="stat-label">选择题正确数</div></div>' +
            '<div class="stat-card"><div class="stat-value">' + accuracy + '%</div><div class="stat-label">选择题正确率</div></div>' +
            '<div class="stat-card"><div class="stat-value">' + (total - answered) + '</div><div class="stat-label">未答题数</div></div>' +
            '<div class="stat-card"><div class="stat-value">' + essayTotal + '</div><div class="stat-label">简答题数</div></div>';

        // 用户名和日期
        dom.userName.value = AppState.userName || '';
        dom.userDate.value = AppState.userDate || '';
    }

    // 用户信息保存
    dom.userName.addEventListener('input', function() { AppState.userName = this.value; saveState(); });
    dom.userDate.addEventListener('input', function() { AppState.userDate = this.value; saveState(); });

    // 继续查看答案
    dom.btnReview.addEventListener('click', function() {
        dom.resultPanel.classList.add('hidden');
        dom.quizCard.classList.remove('hidden');
        // 在 quiz 模式下显示答案（通过 submitted 标志）
        renderCurrentQuestion();
    });

    // 重新开始
    dom.btnRestart.addEventListener('click', function() {
        if (!confirm('确定要重新开始吗？当前作答记录将会被清空。')) return;
        AppState.userAnswers = {};
        AppState.markedQuestions = {};
        AppState.currentIndex = 0;
        AppState.submitted = false;
        AppState.submittedChapters = {};
        updateFilteredQuestions();
        saveState();
        dom.resultPanel.classList.add('hidden');
        dom.quizCard.classList.remove('hidden');
        dom.btnSubmit.disabled = true;
        showQuizUI();
        showToast('已重新开始，之前的作答记录已清空', 'warning');
    });

    // ==================== Docx 导出模块 ====================
    dom.btnExport.addEventListener('click', function() {
        try {
            exportToDocx(null);
            showToast('导出成功！文件已开始下载', 'success');
        } catch(err) {
            showToast('导出失败：' + (err.message || '未知错误'), 'error');
            console.error(err);
        }
    });

    // 分章提交并导出
    function submitAndExportChapter(chapterName) {
        // 收集该章节题目
        var chQuestions = [];
        for (var i = 0; i < AppState.questions.length; i++) {
            if (AppState.questions[i].chapter === chapterName) {
                chQuestions.push(AppState.questions[i]);
            }
        }
        if (chQuestions.length === 0) {
            showToast('该章节无题目', 'warning');
            return;
        }

        // 统计该章节答题情况
        var answered = 0;
        for (var i = 0; i < chQuestions.length; i++) {
            var ans = AppState.userAnswers[chQuestions[i].id];
            if (ans !== undefined && ans !== '') answered++;
        }
        if (answered === 0) {
            showToast('「' + truncateChapter(chapterName) + '」尚未作答任何题目', 'warning');
            return;
        }

        // 标记已提交
        if (!AppState.submittedChapters) AppState.submittedChapters = {};
        AppState.submittedChapters[chapterName] = true;
        saveState();
        renderChapterFilters();

        // 导出该章节
        exportToDocx(chapterName);
        showToast('「' + truncateChapter(chapterName) + '」导出成功！(' + answered + '/' + chQuestions.length + ' 题已答)', 'success');
    }

    // filterChapter: null = 全部章节, string = 只导出该章节
    function exportToDocx(filterChapter) {
        var userName = dom.userName.value.trim() || '(未填写)';
        var userDate = dom.userDate.value.trim() || '(未填写)';

        // 按章节分组（可选过滤）
        var chapters = [];
        var chapterMap = {};
        for (var i = 0; i < AppState.questions.length; i++) {
            var q = AppState.questions[i];
            if (filterChapter && q.chapter !== filterChapter) continue;
            if (!chapterMap[q.chapter]) {
                chapterMap[q.chapter] = { name: q.chapter, questions: [] };
                chapters.push(chapterMap[q.chapter]);
            }
            chapterMap[q.chapter].questions.push(q);
        }

        // 统计
        var scopeQuestions = filterChapter ? chapters[0].questions : AppState.questions;
        var total = scopeQuestions.length;
        var answered = 0, correctCount = 0, choiceTotal = 0;
        for (var i = 0; i < scopeQuestions.length; i++) {
            var q = scopeQuestions[i];
            var userAns = AppState.userAnswers[q.id] || '';
            if (userAns !== '') answered++;
            if (q.type === 'single' || q.type === 'multiple') {
                choiceTotal++;
                if (userAns.toUpperCase() === q.answer.toUpperCase()) correctCount++;
            }
        }
        var accuracy = choiceTotal > 0 ? Math.round((correctCount / choiceTotal) * 100) : 0;

        // 构建文档内容
        var docChildren = [];

        var titleSuffix = filterChapter ? ' — ' + filterChapter : '';
        docChildren.push(new docx.Paragraph({
            children: [new docx.TextRun({ text: '题库作答记录' + titleSuffix, bold: true, size: 36, font: 'Microsoft YaHei' })],
            alignment: docx.AlignmentType.CENTER,
            spacing: { after: 300 }
        }));

        // 用户信息
        docChildren.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: '姓名：', bold: true, size: 24, font: 'Microsoft YaHei' }),
                new docx.TextRun({ text: userName, size: 24, font: 'Microsoft YaHei' })
            ],
            spacing: { after: 100 }
        }));
        docChildren.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: '日期：', bold: true, size: 24, font: 'Microsoft YaHei' }),
                new docx.TextRun({ text: userDate, size: 24, font: 'Microsoft YaHei' })
            ],
            spacing: { after: 300 }
        }));

        // 按章节输出
        for (var c = 0; c < chapters.length; c++) {
            var ch = chapters[c];

            docChildren.push(new docx.Paragraph({
                children: [new docx.TextRun({ text: ch.name, bold: true, size: 28, font: 'Microsoft YaHei' })],
                spacing: { before: 300, after: 200 },
                border: { bottom: { color: '#4f46e5', size: 6, space: 4, style: 'single' } }
            }));

            // 选择题表格
            var choiceQuestions = ch.questions.filter(function(q) { return q.type === 'single' || q.type === 'multiple'; });
            if (choiceQuestions.length > 0) {
                docChildren.push(new docx.Paragraph({
                    children: [new docx.TextRun({ text: '选择题作答记录', bold: true, size: 24, font: 'Microsoft YaHei' })],
                    spacing: { before: 200, after: 150 }
                }));

                var tableHeader = [
                    new docx.TableCell({ children: [new docx.Paragraph({ children: [new docx.TextRun({ text: '题号', bold: true, size: 18, font: 'Microsoft YaHei' })], alignment: docx.AlignmentType.CENTER })], width: { size: 800, type: docx.WidthType.DXA } }),
                    new docx.TableCell({ children: [new docx.Paragraph({ children: [new docx.TextRun({ text: '题型', bold: true, size: 18, font: 'Microsoft YaHei' })], alignment: docx.AlignmentType.CENTER })], width: { size: 800, type: docx.WidthType.DXA } }),
                    new docx.TableCell({ children: [new docx.Paragraph({ children: [new docx.TextRun({ text: '题干', bold: true, size: 18, font: 'Microsoft YaHei' })], alignment: docx.AlignmentType.CENTER })], width: { size: 3500, type: docx.WidthType.DXA } }),
                    new docx.TableCell({ children: [new docx.Paragraph({ children: [new docx.TextRun({ text: '用户答案', bold: true, size: 18, font: 'Microsoft YaHei' })], alignment: docx.AlignmentType.CENTER })], width: { size: 1000, type: docx.WidthType.DXA } }),
                    new docx.TableCell({ children: [new docx.Paragraph({ children: [new docx.TextRun({ text: '标准答案', bold: true, size: 18, font: 'Microsoft YaHei' })], alignment: docx.AlignmentType.CENTER })], width: { size: 1000, type: docx.WidthType.DXA } }),
                    new docx.TableCell({ children: [new docx.Paragraph({ children: [new docx.TextRun({ text: '结果', bold: true, size: 18, font: 'Microsoft YaHei' })], alignment: docx.AlignmentType.CENTER })], width: { size: 800, type: docx.WidthType.DXA } })
                ];

                var tableRows = [new docx.TableRow({ children: tableHeader, tableHeader: true })];
                for (var j = 0; j < choiceQuestions.length; j++) {
                    var qc = choiceQuestions[j];
                    var userAns = AppState.userAnswers[qc.id] || '(未作答)';
                    var isCorrect = (userAns.toUpperCase() === qc.answer.toUpperCase());
                    var resultText = userAns === '(未作答)' ? '未答' : (isCorrect ? '✓ 正确' : '✗ 错误');
                    var resultColor = isCorrect ? '#059669' : '#dc2626';

                    var rowCells = [
                        new docx.TableCell({ children: [new docx.Paragraph({ children: [new docx.TextRun({ text: String(qc.id), size: 18, font: 'Microsoft YaHei' })], alignment: docx.AlignmentType.CENTER })], width: { size: 800, type: docx.WidthType.DXA } }),
                        new docx.TableCell({ children: [new docx.Paragraph({ children: [new docx.TextRun({ text: qc.type === 'single' ? '单选' : '多选', size: 18, font: 'Microsoft YaHei' })], alignment: docx.AlignmentType.CENTER })], width: { size: 800, type: docx.WidthType.DXA } }),
                        new docx.TableCell({ children: [new docx.Paragraph({ children: [new docx.TextRun({ text: truncateForExport(qc.question, 60), size: 18, font: 'Microsoft YaHei' })] })], width: { size: 3500, type: docx.WidthType.DXA } }),
                        new docx.TableCell({ children: [new docx.Paragraph({ children: [new docx.TextRun({ text: userAns, size: 18, font: 'Microsoft YaHei' })], alignment: docx.AlignmentType.CENTER })], width: { size: 1000, type: docx.WidthType.DXA } }),
                        new docx.TableCell({ children: [new docx.Paragraph({ children: [new docx.TextRun({ text: qc.answer, size: 18, font: 'Microsoft YaHei' })], alignment: docx.AlignmentType.CENTER })], width: { size: 1000, type: docx.WidthType.DXA } }),
                        new docx.TableCell({ children: [new docx.Paragraph({ children: [new docx.TextRun({ text: resultText, color: resultColor, size: 18, font: 'Microsoft YaHei' })], alignment: docx.AlignmentType.CENTER })], width: { size: 800, type: docx.WidthType.DXA } })
                    ];
                    tableRows.push(new docx.TableRow({ children: rowCells }));
                }

                docChildren.push(new docx.Table({
                    rows: tableRows,
                    width: { size: 100, type: docx.WidthType.PERCENTAGE }
                }));
                docChildren.push(new docx.Paragraph({ spacing: { after: 100 }, children: [] }));
            }

            // 简答题
            var essayQuestions = ch.questions.filter(function(q) { return q.type === 'essay'; });
            if (essayQuestions.length > 0) {
                docChildren.push(new docx.Paragraph({
                    children: [new docx.TextRun({ text: '简答题作答记录', bold: true, size: 24, font: 'Microsoft YaHei' })],
                    spacing: { before: 300, after: 150 }
                }));

                for (var k = 0; k < essayQuestions.length; k++) {
                    var eq = essayQuestions[k];
                    var essayUserAns = AppState.userAnswers[eq.id] || '(未作答)';

                    docChildren.push(new docx.Paragraph({
                        children: [new docx.TextRun({ text: '题号：' + eq.id + '  ', bold: true, size: 22, font: 'Microsoft YaHei' })],
                        spacing: { before: 150 }
                    }));
                    docChildren.push(new docx.Paragraph({
                        children: [
                            new docx.TextRun({ text: '题干：', bold: true, size: 22, font: 'Microsoft YaHei' }),
                            new docx.TextRun({ text: eq.question, size: 22, font: 'Microsoft YaHei' })
                        ],
                        spacing: { after: 60 }
                    }));
                    docChildren.push(new docx.Paragraph({
                        children: [
                            new docx.TextRun({ text: '你的答案：', bold: true, size: 22, font: 'Microsoft YaHei', color: '#4f46e5' }),
                            new docx.TextRun({ text: essayUserAns, size: 22, font: 'Microsoft YaHei' })
                        ],
                        spacing: { after: 100 }
                    }));
                    docChildren.push(new docx.Paragraph({
                        border: { bottom: { color: '#e2e8f0', size: 2, space: 4, style: 'dashed' } },
                        spacing: { after: 100 },
                        children: []
                    }));
                }
            }
        }

        // 末尾汇总
        docChildren.push(new docx.Paragraph({
            children: [new docx.TextRun({ text: '', size: 24 })],
            spacing: { before: 400 }
        }));
        docChildren.push(new docx.Paragraph({
            children: [new docx.TextRun({ text: '作答统计汇总', bold: true, size: 28, font: 'Microsoft YaHei' })],
            spacing: { after: 200 },
            border: { bottom: { color: '#4f46e5', size: 6, space: 4, style: 'single' } }
        }));
        docChildren.push(new docx.Paragraph({
            children: [new docx.TextRun({ text: '总题数：' + total + '    已答题数：' + answered + '    选择题正确数：' + correctCount + '    选择题正确率：' + accuracy + '%', size: 24, font: 'Microsoft YaHei' })],
            spacing: { after: 100 }
        }));

        var doc = new docx.Document({
            sections: [{ properties: {}, children: docChildren }]
        });

        docx.Packer.toBlob(doc).then(function(blob) {
            var title = userName !== '(未填写)' ? userName : 'export';
            var date = userDate !== '(未填写)' ? '_' + userDate : '';
            var chTag = filterChapter ? '_' + filterChapter.substring(0, 8).replace(/[\\/:*?"<>|]/g, '') : '';
            var fileName = '作答记录_' + title + date + chTag + '.docx';
            fileName = fileName.replace(/[:*?"<>|]/g, '_');
            saveAs(blob, fileName);
        });
    }

    // ==================== 辅助函数 ====================
    function escapeHtml(str) {
        if (!str) return '';
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function truncateChapter(chapter) {
        if (!chapter) return '未分类';
        if (chapter.length > 20) return chapter.substring(0, 18) + '...';
        return chapter;
    }

    function truncateQuestion(text, maxLen) {
        if (!text) return '';
        if (text.length > maxLen) return text.substring(0, maxLen) + '...';
        return text;
    }

    function truncateForExport(text, maxLen) {
        if (!text) return '';
        return text.length > maxLen ? text.substring(0, maxLen) + '...' : text;
    }

    // ==================== 初始化 ====================
    function init() {
        // 尝试从 localStorage 恢复状态
        if (loadState()) {
            AppState.submitted = false; // 重新打开后总是不处于已提交状态
            dom.fileName.textContent = AppState.fileName;
            dom.fileStatus.textContent = '已加载 (' + AppState.questions.length + ' 题)';
            dom.fileStatus.className = 'file-status success';
            dom.fileInfoBar.classList.remove('hidden');
            dom.btnStartQuiz.classList.remove('hidden');
            dom.btnImportAnswer.classList.remove('hidden');
            dom.uploadCard.classList.add('hidden');
            dom.btnSubmit.disabled = true;

            if (AppState.quizStarted) {
                updateFilteredQuestions();
                showQuizUI();
            } else {
                dom.sidebar.classList.remove('hidden');
                updateFilteredQuestions();
                renderChapterFilters();
                renderQuestionNav();
                updateProgress();
            }
        }
    }

    init();
})();
</script>
</body>
</html>
