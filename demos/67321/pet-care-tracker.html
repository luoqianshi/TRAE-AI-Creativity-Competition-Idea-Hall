<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宠物照护与日常记录系统</title>
    <style>
        /* ===== 基础重置与全局样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #fff8f0 0%, #ffe8d6 100%);
            min-height: 100vh;
            color: #5a4a42;
            padding: 20px;
        }

        /* ===== 顶部标题区 ===== */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 28px;
            color: #d97941;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            color: #a08070;
        }

        /* ===== 主容器：卡片式布局 ===== */
        .container {
            max-width: 800px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(217, 121, 65, 0.12);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8b5e3c;
        }

        /* ===== 任务系统区 ===== */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff6ed;
            border-radius: 14px;
            padding: 14px 16px;
            cursor: pointer;
            transition: background 0.2s ease, opacity 0.2s ease;
            border: 2px solid transparent;
        }

        .task-item:hover {
            background: #ffe8d6;
        }

        .task-item.completed {
            opacity: 0.7;
            background: #e8f5e9;
            border-color: #a5d6a7;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .task-icon {
            font-size: 22px;
        }

        .task-name {
            font-size: 15px;
            font-weight: 500;
        }

        .task-check {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #f0e0d4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: transparent;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .task-item.completed .task-check {
            background: #66bb6a;
            color: white;
        }

        /* ===== 日记系统区 ===== */
        .diary-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #f0e0d4;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
            resize: vertical;
            min-height: 60px;
            font-family: inherit;
        }

        .diary-input:focus {
            border-color: #ff8c42;
        }

        .btn-secondary {
            padding: 10px 18px;
            border: none;
            border-radius: 12px;
            background: #8b5e3c;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn-secondary:hover {
            background: #6d4c41;
        }

        .diary-list {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .diary-entry {
            background: #fff8f0;
            border-left: 4px solid #ff8c42;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 14px;
            line-height: 1.6;
        }

        .diary-date {
            font-size: 12px;
            color: #a08070;
            margin-bottom: 4px;
        }

        /* ===== 相册系统区 ===== */
        .album-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .upload-btn,
        .add-album-btn,
        .back-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ffb347 0%, #ff8c42 100%);
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 140, 66, 0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            white-space: nowrap;
        }

        .upload-btn:hover,
        .add-album-btn:hover,
        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(255, 140, 66, 0.35);
        }

        .album-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
        }

        .album-item {
            background: #fff0e0;
            border-radius: 18px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(139, 94, 60, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .album-item:hover {
            transform: scale(1.04);
            box-shadow: 0 6px 16px rgba(139, 94, 60, 0.18);
        }

        .album-cover {
            flex: 1;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .album-cover-edit {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            color: #8b5e3c;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .album-item:hover .album-cover-edit {
            opacity: 1;
        }

        .album-name {
            padding: 10px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            color: #5a4a42;
            background: #ffffff;
            outline: none;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .album-name:focus {
            background: #fff6ed;
        }

        .add-album-card {
            aspect-ratio: 1;
            border: 2px dashed #f0c4a8;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            color: #d97941;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .add-album-card:hover {
            background: #fff6ed;
            border-color: #ff8c42;
        }

        .add-album-icon {
            font-size: 42px;
        }

        .add-album-text {
            font-size: 14px;
            font-weight: 600;
        }

        /* ===== 相册详情页 ===== */
        .album-detail {
            display: none;
        }

        .album-detail.active {
            display: block;
        }

        .album-detail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .album-detail-title {
            font-size: 18px;
            font-weight: bold;
            color: #8b5e3c;
            outline: none;
            padding: 4px 8px;
            border-radius: 8px;
            flex: 1;
            min-width: 120px;
        }

        .album-detail-title:focus {
            background: #fff6ed;
        }

        .empty-tip {
            text-align: center;
            color: #a08070;
            padding: 40px 20px;
            font-size: 14px;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 14px;
        }

        .photo-item {
            aspect-ratio: 1;
            background: #fff0e0;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 46px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(139, 94, 60, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            user-select: none;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }

        .photo-item:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(139, 94, 60, 0.18);
        }

        /* ===== 图片放大弹窗 ===== */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
            padding: 20px;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            max-width: 680px;
            width: 90%;
        }

        .modal.active .modal-content {
            transform: scale(1);
        }

        .modal-media {
            max-width: 100%;
            max-height: 60vh;
            border-radius: 16px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        .modal-emoji {
            font-size: 100px;
            margin-bottom: 12px;
        }

        .modal-text {
            font-size: 16px;
            color: #5a4a42;
            margin-bottom: 16px;
            word-break: break-word;
        }

        .modal-close {
            padding: 10px 24px;
            border: none;
            border-radius: 12px;
            background: #ff8c42;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .modal-close:hover {
            background: #e67332;
        }

        /* ===== 隐藏元素 ===== */
        .hidden {
            display: none !important;
        }

        /* ===== 响应式适配 ===== */
        @media (max-width: 480px) {
            .header h1 {
                font-size: 22px;
            }

            .album-list {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                gap: 12px;
            }

            .album-cover {
                min-height: 100px;
                font-size: 46px;
            }

            .photo-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部标题 -->
    <header class="header">
        <h1>🐾 宠物照护与日常记录系统</h1>
        <p>记录每一天，陪伴每一刻</p>
    </header>

    <main class="container">
        <!-- 任务系统卡片 -->
        <section class="card">
            <h2 class="card-title">📋 今日任务</h2>
            <div class="task-list" id="taskList">
                <div class="task-item" data-task="喂食">
                    <div class="task-left">
                        <span class="task-icon">🍖</span>
                        <span class="task-name">喂食</span>
                    </div>
                    <div class="task-check">✓</div>
                </div>
                <div class="task-item" data-task="散步">
                    <div class="task-left">
                        <span class="task-icon">🚶</span>
                        <span class="task-name">散步</span>
                    </div>
                    <div class="task-check">✓</div>
                </div>
                <div class="task-item" data-task="清洁">
                    <div class="task-left">
                        <span class="task-icon">🛁</span>
                        <span class="task-name">清洁</span>
                    </div>
                    <div class="task-check">✓</div>
                </div>
            </div>
        </section>

        <!-- 日记系统卡片 -->
        <section class="card">
            <h2 class="card-title">📝 宠物日记</h2>
            <textarea class="diary-input" id="diaryInput" placeholder="输入今天的趣事，或直接生成..."></textarea>
            <button class="btn-secondary" id="addDiaryBtn">✨ 新增日记</button>
            <div class="diary-list" id="diaryList"></div>
        </section>

        <!-- 相册系统卡片 -->
        <section class="card album-card">
            <!-- 相册列表 -->
            <div id="albumListView">
                <div class="album-header">
                    <h2 class="card-title">📷 萌宠相册</h2>
                    <button class="add-album-btn" id="addAlbumBtn">➕ 新建相册</button>
                </div>
                <div class="album-list" id="albumList"></div>
            </div>

            <!-- 相册详情 -->
            <div class="album-detail" id="albumDetailView">
                <div class="album-detail-header">
                    <button class="back-btn" id="backToAlbums">← 返回</button>
                    <div class="album-detail-title" id="detailTitle" contenteditable="true">相册名称</div>
                    <button class="upload-btn" id="uploadPhotoBtn">📤 上传照片</button>
                </div>
                <div class="photo-grid" id="detailPhotoGrid"></div>
                <div class="empty-tip" id="emptyTip">这里还没有照片，点击右上角“上传照片”添加吧～</div>
            </div>

            <!-- 隐藏的文件输入 -->
            <input type="file" id="coverUpload" accept="image/*" style="display: none;">
            <input type="file" id="photoUpload" accept="image/*" multiple style="display: none;">
        </section>
    </main>

    <!-- 图片放大弹窗 -->
    <div class="modal" id="photoModal">
        <div class="modal-content">
            <img class="modal-media" id="modalImage" src="" alt="照片" style="display: none;">
            <div class="modal-emoji" id="modalEmoji" style="display: none;">🐕</div>
            <p class="modal-text" id="modalText">照片描述</p>
            <button class="modal-close" id="modalClose">关闭</button>
        </div>
    </div>

    <script>
        /* ===== 任务系统逻辑 ===== */
        const taskItems = document.querySelectorAll('.task-item');
        taskItems.forEach(function (item) {
            item.addEventListener('click', function () {
                item.classList.toggle('completed');
            });
        });

        /* ===== 日记系统逻辑 ===== */
        const diaryInput = document.getElementById('diaryInput');
        const addDiaryBtn = document.getElementById('addDiaryBtn');
        const diaryList = document.getElementById('diaryList');

        const diaryTemplates = [
            '今天宠物很开心，因为你完成了{task}',
            '小家伙今天特别粘人，看来{task}让它心情大好',
            '完成{task}后，它的尾巴摇得像小马达一样',
            '今天的{task}很顺利，它现在正舒舒服服地躺着',
            '看到你为它{task}，它露出了满足的小表情'
        ];

        const taskNames = ['喂食', '散步', '清洁', '梳毛', '训练'];

        function getRandomDiaryText() {
            const template = diaryTemplates[Math.floor(Math.random() * diaryTemplates.length)];
            const task = taskNames[Math.floor(Math.random() * taskNames.length)];
            return template.replace('{task}', task);
        }

        function getCurrentDate() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hour = String(now.getHours()).padStart(2, '0');
            const minute = String(now.getMinutes()).padStart(2, '0');
            return year + '-' + month + '-' + day + ' ' + hour + ':' + minute;
        }

        function addDiaryEntry(text) {
            const entry = document.createElement('div');
            entry.className = 'diary-entry';

            const date = document.createElement('div');
            date.className = 'diary-date';
            date.textContent = getCurrentDate();

            const content = document.createElement('div');
            content.textContent = text;

            entry.appendChild(date);
            entry.appendChild(content);
            diaryList.insertBefore(entry, diaryList.firstChild);
        }

        addDiaryBtn.addEventListener('click', function () {
            const inputText = diaryInput.value.trim();
            const diaryText = inputText ? inputText : getRandomDiaryText();
            addDiaryEntry(diaryText);
            diaryInput.value = '';
        });

        /* ===== 相册系统逻辑 ===== */
        const albumListView = document.getElementById('albumListView');
        const albumDetailView = document.getElementById('albumDetailView');
        const albumList = document.getElementById('albumList');
        const addAlbumBtn = document.getElementById('addAlbumBtn');
        const backToAlbums = document.getElementById('backToAlbums');
        const detailTitle = document.getElementById('detailTitle');
        const uploadPhotoBtn = document.getElementById('uploadPhotoBtn');
        const detailPhotoGrid = document.getElementById('detailPhotoGrid');
        const emptyTip = document.getElementById('emptyTip');
        const coverUpload = document.getElementById('coverUpload');
        const photoUpload = document.getElementById('photoUpload');

        const photoModal = document.getElementById('photoModal');
        const modalImage = document.getElementById('modalImage');
        const modalEmoji = document.getElementById('modalEmoji');
        const modalText = document.getElementById('modalText');
        const modalClose = document.getElementById('modalClose');

        // 默认 emoji 封面池
        const defaultCovers = ['🐕', '🐈', '🦴', '🎾', '🐾', '💤', '🐶', '🌳', '🏠', '🌞'];

        // 相册数据
        let albums = [
            { id: 1, name: '日常', coverType: 'emoji', coverContent: '🐕', photos: [] },
            { id: 2, name: '零食', coverType: 'emoji', coverContent: '🦴', photos: [] },
            { id: 3, name: '户外', coverType: 'emoji', coverContent: '🌳', photos: [] },
            { id: 4, name: '玩具', coverType: 'emoji', coverContent: '🎾', photos: [] },
            { id: 5, name: '睡觉', coverType: 'emoji', coverContent: '💤', photos: [] },
            { id: 6, name: '足迹', coverType: 'emoji', coverContent: '🐾', photos: [] }
        ];
        let nextAlbumId = 7;
        let currentAlbumId = null;
        let editingCoverAlbumId = null;

        function getAlbumById(id) {
            for (let i = 0; i < albums.length; i++) {
                if (albums[i].id === id) {
                    return albums[i];
                }
            }
            return null;
        }

        function createAlbumCoverElement(album) {
            const cover = document.createElement('div');
            cover.className = 'album-cover';

            if (album.coverType === 'image') {
                cover.style.backgroundImage = 'url(' + album.coverContent + ')';
            } else {
                cover.textContent = album.coverContent;
            }

            const editIcon = document.createElement('div');
            editIcon.className = 'album-cover-edit';
            editIcon.textContent = '✎';
            editIcon.title = '更换封面';
            editIcon.addEventListener('click', function (event) {
                event.stopPropagation();
                editingCoverAlbumId = album.id;
                coverUpload.click();
            });

            cover.appendChild(editIcon);
            return cover;
        }

        function createAlbumElement(album) {
            const item = document.createElement('div');
            item.className = 'album-item';
            item.setAttribute('data-id', album.id);

            item.appendChild(createAlbumCoverElement(album));

            const name = document.createElement('div');
            name.className = 'album-name';
            name.contentEditable = 'true';
            name.textContent = album.name;
            name.spellcheck = false;

            // 失焦保存名称
            name.addEventListener('blur', function () {
                album.name = name.textContent.trim() || album.name;
                name.textContent = album.name;
            });

            // 回车结束编辑
            name.addEventListener('keydown', function (event) {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    name.blur();
                }
            });

            item.appendChild(name);

            // 点击打开相册详情
            item.addEventListener('click', function (event) {
                if (event.target === name || event.target.closest('.album-cover-edit')) {
                    return;
                }
                openAlbumDetail(album.id);
            });

            return item;
        }

        function createAddAlbumCard() {
            const card = document.createElement('div');
            card.className = 'add-album-card';
            card.innerHTML = '<div class="add-album-icon">➕</div><div class="add-album-text">新建相册</div>';
            card.addEventListener('click', createNewAlbum);
            return card;
        }

        function renderAlbumList() {
            albumList.innerHTML = '';
            albums.forEach(function (album) {
                albumList.appendChild(createAlbumElement(album));
            });
            albumList.appendChild(createAddAlbumCard());
        }

        function createNewAlbum() {
            const randomCover = defaultCovers[Math.floor(Math.random() * defaultCovers.length)];
            const newAlbum = {
                id: nextAlbumId++,
                name: '新建相册 ' + (nextAlbumId - 1),
                coverType: 'emoji',
                coverContent: randomCover,
                photos: []
            };
            albums.push(newAlbum);
            renderAlbumList();
        }

        function openAlbumDetail(albumId) {
            currentAlbumId = albumId;
            const album = getAlbumById(albumId);
            if (!album) {
                return;
            }

            detailTitle.textContent = album.name;
            renderDetailPhotos();

            albumListView.classList.add('hidden');
            albumDetailView.classList.add('active');
        }

        function backToAlbumList() {
            albumDetailView.classList.remove('active');
            albumListView.classList.remove('hidden');
            currentAlbumId = null;
            renderAlbumList();
        }

        function renderDetailPhotos() {
            const album = getAlbumById(currentAlbumId);
            detailPhotoGrid.innerHTML = '';

            if (!album || album.photos.length === 0) {
                detailPhotoGrid.classList.add('hidden');
                emptyTip.classList.remove('hidden');
                return;
            }

            detailPhotoGrid.classList.remove('hidden');
            emptyTip.classList.add('hidden');

            album.photos.forEach(function (photo, index) {
                const item = document.createElement('div');
                item.className = 'photo-item';
                item.style.backgroundImage = 'url(' + photo + ')';
                item.addEventListener('click', function () {
                    openPhotoModal(photo);
                });
                detailPhotoGrid.appendChild(item);
            });
        }

        function openPhotoModal(photoUrl) {
            modalImage.src = photoUrl;
            modalImage.style.display = 'block';
            modalEmoji.style.display = 'none';
            modalText.textContent = '上传于 ' + getCurrentDate();
            photoModal.classList.add('active');
        }

        function closeModal() {
            photoModal.classList.remove('active');
        }

        // 新建相册按钮
        addAlbumBtn.addEventListener('click', createNewAlbum);

        // 返回相册列表
        backToAlbums.addEventListener('click', backToAlbumList);

        // 详情页标题编辑
        detailTitle.addEventListener('blur', function () {
            const album = getAlbumById(currentAlbumId);
            if (album) {
                album.name = detailTitle.textContent.trim() || album.name;
                detailTitle.textContent = album.name;
            }
        });

        detailTitle.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                detailTitle.blur();
            }
        });

        // 上传照片到当前相册
        uploadPhotoBtn.addEventListener('click', function () {
            photoUpload.click();
        });

        photoUpload.addEventListener('change', function (event) {
            const album = getAlbumById(currentAlbumId);
            if (!album) {
                return;
            }

            const files = event.target.files;
            if (!files || files.length === 0) {
                return;
            }

            Array.prototype.forEach.call(files, function (file) {
                if (!file.type.startsWith('image/')) {
                    return;
                }
                const imageUrl = URL.createObjectURL(file);
                album.photos.unshift(imageUrl);
            });

            renderDetailPhotos();
            photoUpload.value = '';
        });

        // 更换相册封面
        coverUpload.addEventListener('change', function (event) {
            const album = getAlbumById(editingCoverAlbumId);
            if (!album) {
                return;
            }

            const file = event.target.files[0];
            if (file && file.type.startsWith('image/')) {
                album.coverType = 'image';
                album.coverContent = URL.createObjectURL(file);
                renderAlbumList();
            }

            editingCoverAlbumId = null;
            coverUpload.value = '';
        });

        // 弹窗关闭
        modalClose.addEventListener('click', closeModal);
        photoModal.addEventListener('click', function (event) {
            if (event.target === photoModal) {
                closeModal();
            }
        });

        /* ===== 初始化 ===== */
        renderAlbumList();
    </script>
</body>
</html>
