<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>德语单词碰碰乐 | TRAE AI 创意大赛</title>
    <!--
      德语单词碰碰乐 · 创意提案 Demo
      ================================
      开发日志：2026.06.16
      开发地点：深圳
      开发人：至元德语陈老师
      说明：TRAE AI 创造力大赛创意产物
      技术栈：原生 HTML/CSS/JS（单文件，无依赖）
      功能概述：通过可视化拼合动画展示德语复合词的构词逻辑
    -->
    <style>
        /* ===== 主题变量 ===== */
        :root {
            --bg: #f5f0eb;
            --card-bg: #ffffff;
            --text: #2c2416;
            --text-light: #6b5e4a;
            --accent1: #e07b4c;
            --accent1-light: #fde8db;
            --accent2: #4a90b8;
            --accent2-light: #dbeaf5;
            --gold: #c8963e;
            --gold-light: #fdf3e2;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.1);
            --border-subtle: rgba(0, 0, 0, 0.04);
            --btn-secondary-bg: #fff;
            --btn-secondary-border: #e0d5c5;
            --btn-secondary-hover-bg: #faf7f2;
            --btn-secondary-hover-border: #c4b89e;
        }

        body.dark-theme {
            --bg: #1e1b18;
            --card-bg: #2a2520;
            --text: #e8e0d5;
            --text-light: #b3a692;
            --accent1: #f08c5a;
            --accent1-light: #3d2a1e;
            --accent2: #6aaed9;
            --accent2-light: #1e2f3d;
            --gold: #d4a44c;
            --gold-light: #3e3525;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.4);
            --border-subtle: rgba(255,255,255,0.05);
            --btn-secondary-bg: #36302a;
            --btn-secondary-border: #5a4e40;
            --btn-secondary-hover-bg: #423b33;
            --btn-secondary-hover-border: #7a6850;
        }

        /* ===== 基础样式 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background 0.3s, color 0.3s;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== 头部区域 ===== */
        .app-container {
            width: 100%;
            max-width: 960px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            padding: 10px 14px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border-subtle);
            transition: background 0.3s, box-shadow 0.3s;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 8px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .title {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .title-icon { font-size: 1.5rem; line-height: 1; }
        .title-text {
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .main-title {
            font-size: 1.24rem;
            font-weight: 800;
            color: var(--accent1);
            letter-spacing: 0.03em;
            line-height: 1.2;
        }
        .sub-title {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-light);
            letter-spacing: 0.05em;
            line-height: 1.2;
        }
        .settings-btn {
            position: relative;
            background: var(--btn-secondary-bg);
            border: 2px solid var(--btn-secondary-border);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 1.1rem;
            cursor: default;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            transition: all 0.2s;
        }
        .settings-btn:hover { background: var(--btn-secondary-hover-bg); border-color: var(--btn-secondary-hover-border); }
        .settings-btn::after {
            content: '';
            position: absolute;
            top: 6px;
            right: 6px;
            width: 8px;
            height: 8px;
            background: var(--accent1);
            border-radius: 50%;
            opacity: 0.7;
        }

        /* ===== 游戏主区域 ===== */
        .game-stage {
            display: flex; align-items: center; justify-content: center; width: 100%;
            gap: 10px; flex-wrap: wrap; min-height: 260px; padding: 4px 0; position: relative;
            background: linear-gradient(135deg, rgba(0,0,0,0.01) 0%, transparent 50%);
            border-radius: 20px;
        }

        /* ===== 图片卡片 ===== */
        .image-card {
            position: relative;
            width: 220px; height: 220px;
            border-radius: 18px; overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s, all 0.3s;
            background: #f9f9f9;
            border: 3px solid transparent;
            cursor: pointer;
        }
        .image-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.10);
        }
        .card-1 { border-color: var(--accent1-light); background: var(--accent1-light); }
        .card-2 { border-color: var(--accent2-light); background: var(--accent2-light); }
        .image-card img { width: 100%; height: 100%; object-fit: cover; }
        .label-overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.55); color: #fff; text-align: center;
            padding: 6px 4px; font-weight: 600;
            display: flex; flex-direction: column; gap: 1px;
        }
        .de-label { font-size: 0.9rem; }
        .zh-label { font-size: 0.75rem; opacity: 0.85; transition: opacity 0.4s; }
        .zh-hidden { opacity: 0 !important; }

        .center-zone { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-width: 70px; height: 220px; position: relative; }
        .operator-sign { font-size: 2.8rem; font-weight: 900; color: var(--text-light); line-height: 1; margin-top: 14px; }
        .question-mark { font-size: 2.5rem; font-weight: 900; color: var(--gold); animation: float-gentle 2.5s infinite; line-height: 1; margin-bottom: 8px; }
        @keyframes float-gentle { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-10px); } }
        .countdown-number { font-size: 4rem; font-weight: 900; color: var(--accent1); animation: count-pulse 0.5s; }
        @keyframes count-pulse { 0%{ transform: scale(2); opacity:0; } 60%{ transform: scale(0.9); opacity:1; } 100%{ transform: scale(1); opacity:1; } }

        .flash-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0);
            width: 120px; height: 120px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,220,150,0.9) 0%, rgba(255,180,60,0.5) 30%, transparent 70%);
            pointer-events: none; z-index: 9; opacity: 0;
        }
        .flash-overlay.active { animation: flash-boom 0.7s ease-out forwards; }
        @keyframes flash-boom { 0%{ transform: translate(-50%,-50%) scale(0); opacity:1; } 50%{ transform: translate(-50%,-50%) scale(2.5); opacity:0.8; } 100%{ transform: translate(-50%,-50%) scale(4); opacity:0; } }

        /* 粒子动画容器 */
        .particles-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 8;
            width: 0; height: 0;
        }
        .particle {
            position: absolute;
            top: 0; left: 0;
            border-radius: 3px;
            opacity: 1;
            animation: particle-burst var(--duration, 0.6s) ease-out forwards;
        }
        @keyframes particle-burst {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
        }

        /* ===== 等式栏 ===== */
        .result-equation {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            padding: 6px 12px; background: var(--gold-light); border-radius: 18px;
            border: 2px dashed var(--gold);
            opacity: 1;
            transition: clip-path 0.6s cubic-bezier(0.22, 0.61, 0.36, 1), opacity 0.4s;
            width: 100%;
            position: relative;
            overflow: hidden;
            flex-wrap: nowrap;
        }
        .result-equation.visible {
            clip-path: inset(0 0 0 0);
        }
        .result-equation.result-hidden {
            clip-path: inset(0 50% 0 50%);
            opacity: 0;
        }

        .eq-center-wrap {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            pointer-events: none;
        }
        .result-equation .question-mark {
            font-size: 3rem;
            font-weight: 900;
            color: var(--gold);
            animation: float-gentle 2.5s infinite;
            pointer-events: none;
        }
        .result-equation .countdown-number {
            font-size: 4.5rem;
            font-weight: 900;
            color: var(--accent1);
            pointer-events: none;
        }
        .result-equation.visible .eq-center-wrap { display: none !important; }
        .result-equation:not(.visible) > .eq-block,
        .result-equation:not(.visible) > .eq-operator,
        .result-equation:not(.visible) > .compound-highlight { visibility: hidden; }

        .eq-block { display: flex; flex-direction: row; align-items: center; gap: 4px; min-width: auto; }
        .eq-img-12 { width: 69px; height: 69px; border-radius: 12px; object-fit: cover; background: #fff; border: 1px solid #eee; }
        .eq-img-3 { width: 74px; height: 74px; border-radius: 14px; object-fit: cover; background: #fff; border: 2px solid var(--gold); }
        .eq-operator { font-size: 2.4rem; font-weight: 700; color: var(--text-light); line-height: 1; }
        .eq-text { font-size: 1.4rem; text-align: left; line-height: 1.3; white-space: nowrap; }
        .eq-compound-text { font-size: 1.4rem; text-align: center; line-height: 1.3; white-space: nowrap; }
        #eqCompoundZh { font-weight: 700; }

        .compound-highlight {
            display: flex; flex-direction: row; align-items: center; gap: 6px;
            padding: 6px 12px; border-radius: 14px;
            background: var(--card-bg);
            box-shadow: 0 2px 10px rgba(200,150,62,0.15); border: 2px solid var(--gold);
            text-align: center; animation: highlight-glow 2s infinite;
        }
        @keyframes highlight-glow { 0%,100%{ box-shadow: 0 2px 10px rgba(200,150,62,0.15); } 50%{ box-shadow: 0 4px 20px rgba(200,150,62,0.35); } }

        /* ===== 按钮 ===== */
        .btn {
            padding: 8px 20px; border-radius: 22px; border: none; font-weight: 700;
            cursor: pointer; transition: all 0.2s; font-family: inherit; font-size: 0.95rem;
        }
        .btn:disabled { animation: disabled-breath 2s ease-in-out infinite; }
        @keyframes disabled-breath { 0%,100%{ opacity: 0.5; } 50%{ opacity: 0.35; } }
        .btn-primary { background: var(--accent1); color: #fff; box-shadow: 0 4px 12px rgba(224,123,76,0.25); }
        .btn-primary:hover { background: #d06a3e; transform: translateY(-1px); }

        .controls {
            display: flex;
            gap: 16px;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-top: 4px;
            min-height: 44px;
        }

        /* ===== 放大预览 ===== */
        .big-image-reveal {
            position: absolute; top: -24px; left: 50%;
            transform: translate(-50%, 0) scale(0.3);
            width: 260px; height: 260px; border-radius: 24px; overflow: hidden;
            box-shadow: 0 12px 36px rgba(0,0,0,0.30); z-index: 20;
            animation: reveal-big 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            pointer-events: auto;
        }
        .big-image-reveal img { width: 100%; height: 100%; object-fit: contain; }
        @keyframes reveal-big {
            0% { transform: translate(-50%, 0) scale(0.3); opacity: 0; }
            50% { transform: translate(-50%, 0) scale(1.05); opacity: 1; }
            70% { transform: translate(-50%, 0) scale(0.95); }
            100% { transform: translate(-50%, 0) scale(1); opacity: 1; }
        }

        /* ===== 动画关键帧 ===== */
    </style>
</head>
<body>
    <div class="app-container" id="app">
        <div class="header">
            <div class="title">
                <span class="title-icon">🧩</span>
                <div class="title-text">
                    <span class="main-title">德语单词碰碰乐</span>
                </div>
            </div>
            <div class="header-right">
                <button class="settings-btn" id="settingsBtn" title="装饰">⚙️</button>
            </div>
        </div>

        <div class="game-stage" id="gameStage">
            <div class="image-card card-1" id="card1">
                <img id="img1" src="" alt="图片1" onerror="handleImgError(this, 1)">
                <div class="label-overlay"><span class="de-label" id="labelDe1"></span><span class="zh-label zh-hidden" id="labelZh1"></span></div>
            </div>
            <div class="center-zone" id="centerZone">
                <span class="operator-sign">+</span>
            </div>
            <div class="image-card card-2" id="card2">
                <img id="img2" src="" alt="图片2" onerror="handleImgError(this, 2)">
                <div class="label-overlay"><span class="de-label" id="labelDe2"></span><span class="zh-label zh-hidden" id="labelZh2"></span></div>
            </div>
            <div class="flash-overlay"></div>
            <div class="particles-container"></div>
        </div>

        <div class="result-equation" id="resultEquation">
            <div class="eq-center-wrap"><span class="question-mark">?</span></div>
            <div class="eq-center-wrap"><span class="countdown-number" style="display:none;"></span></div>
            <div class="eq-block"><img class="eq-img eq-img-12" id="eqImg1" src="" onerror="handleImgError(this, 1)"><div class="eq-text"><span id="eqDe1"></span><span id="eqZh1"></span></div></div>
            <span class="eq-operator">+</span>
            <div class="eq-block"><img class="eq-img eq-img-12" id="eqImg2" src="" onerror="handleImgError(this, 2)"><div class="eq-text"><span id="eqDe2"></span><span id="eqZh2"></span></div></div>
            <span class="eq-operator">=</span>
            <div class="compound-highlight">
                <img class="eq-img eq-img-3" id="eqImg3" src="" onerror="handleImgError(this, 3)">
                <div class="eq-compound-text">
                    <div id="eqCompoundDe" style="font-weight:800;color:var(--gold)"></div>
                    <div id="eqCompoundZh"></div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="btnNext" style="display:none;">▶ 下一题</button>
        </div>
    </div>

    <!-- 开发者信息（独立于主容器，底部居中） -->
    <div style="width:100%; text-align:center; padding:14px 0 10px; color:var(--text-light); font-size:0.78rem; opacity:0.55; letter-spacing:0.03em; flex-shrink:0;">
        开发者：至元德语-陈老师 &nbsp;（TRAE AI 创造力大赛提案）
    </div>

    <script>
        (function() {
            // ===== 音效引擎 =====
            class AudioEngine {
                constructor() { this.ctx = null; this.enabled = true; }
                init() { if (!this.ctx) try { this.ctx = new(window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.enabled = false; } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }
                play(freq, type, duration, vol = 0.15) { this.init(); if (!this.enabled || !this.ctx) return; const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain(); osc.type = type; osc.frequency.value = freq; gain.gain.setValueAtTime(vol, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration); osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + duration); }
                tick() { this.play(800, 'sine', 0.12); this.play(1200, 'sine', 0.08); }
                collision() { this.play(60, 'triangle', 0.35); this.play(200, 'square', 0.2); }
                reveal() { this.play(523, 'sine', 0.3); setTimeout(() => this.play(659, 'sine', 0.25), 120); }
                success() { this.play(600, 'sine', 0.35); }
            }
            const audio = new AudioEngine();

            // ===== 数据层 =====
            const wordBank = [
                { id:'schneemann',  word1:{de:'Schnee',zh:'雪'},     word2:{de:'Mann',zh:'男人'},   compound:{de:'Schneemann',zh:'雪人'},   level:'easy', type:'noun', emoji1:'❄️', emoji2:'🧑', emoji3:'⛄' },
                { id:'sonnenblume', word1:{de:'Sonne',zh:'太阳'},    word2:{de:'Blume',zh:'花'},    compound:{de:'Sonnenblume',zh:'向日葵'}, level:'easy', type:'noun', emoji1:'☀️', emoji2:'🌸', emoji3:'🌻' },
                { id:'regenschirm', word1:{de:'Regen',zh:'雨'},      word2:{de:'Schirm',zh:'伞'},    compound:{de:'Regenschirm',zh:'雨伞'},   level:'easy', type:'noun', emoji1:'🌧️', emoji2:'🌂', emoji3:'☔' },
            ];

            function buildPicSrc(type, seq, part, deWord, wordId) {
                return 'data:,demo-placeholder-' + part;
            }

            // ===== 设置系统 =====
            const defaultSettings = {
                theme: 'light',
                countdownTime: 3,
                difficulty: 'mixed',
                questionsPerRound: 3,
            };
            let settings = { ...defaultSettings };

            // ===== DOM引用 =====
            const dom = {
                gameStage: document.getElementById('gameStage'),
                card1: document.getElementById('card1'),
                card2: document.getElementById('card2'),
                img1: document.getElementById('img1'),
                img2: document.getElementById('img2'),
                labelDe1: document.getElementById('labelDe1'),
                labelZh1: document.getElementById('labelZh1'),
                labelDe2: document.getElementById('labelDe2'),
                labelZh2: document.getElementById('labelZh2'),
                questionMark: document.querySelector('.question-mark'),
                countdownNum: document.querySelector('.countdown-number'),
                flashOverlay: document.querySelector('.flash-overlay'),
                particlesContainer: document.querySelector('.particles-container'),
                resultEquation: document.getElementById('resultEquation'),
                eqImg1: document.getElementById('eqImg1'),
                eqImg2: document.getElementById('eqImg2'),
                eqImg3: document.getElementById('eqImg3'),
                eqDe1: document.getElementById('eqDe1'),
                eqZh1: document.getElementById('eqZh1'),
                eqDe2: document.getElementById('eqDe2'),
                eqZh2: document.getElementById('eqZh2'),
                eqCompoundDe: document.getElementById('eqCompoundDe'),
                eqCompoundZh: document.getElementById('eqCompoundZh'),
                btnNext: document.getElementById('btnNext'),
                operatorSign: document.querySelector('.operator-sign'),
            };

            // ===== 游戏状态 =====
            let questionSequence = [];
            let currentIndex = 0;
            let gamePhase = 'idle';
            let countdownTimer = null;
            let currentEmojis = { 1:'❄️', 2:'🧑', 3:'⛄' };  /* 当前词条的图标，供占位图使用 */
            let zhDelayTimer = null;
            let userInteracted = false;

            // ===== 核心流程 =====
            window.handleImgError = function(imgEl, type) {
                if (imgEl.dataset.fallbacked === 'true') return;
                imgEl.dataset.fallbacked = 'true';
                const canvas = document.createElement('canvas');
                canvas.width = 300; canvas.height = 300;
                const ctx = canvas.getContext('2d');
                const colors = {
                    1:{bg:'#fde8db',border:'#e07b4c',text:'#c0562b'},
                    2:{bg:'#dbeaf5',border:'#4a90b8',text:'#2d6080'},
                    3:{bg:'#fdf3e2',border:'#c8963e',text:'#8b5e20'}
                };
                const c = colors[type] || colors[1];
                const emoji = currentEmojis[type] || '❓';
                const grad = ctx.createLinearGradient(0,0,300,300);
                grad.addColorStop(0, c.bg);
                grad.addColorStop(1, '#fff');
                ctx.fillStyle = grad;
                ctx.fillRect(0,0,300,300);
                ctx.strokeStyle = c.border; ctx.lineWidth=8;
                ctx.setLineDash([12,6]); ctx.strokeRect(14,14,272,272);
                ctx.font = '80px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.fillText(emoji, 150, 115);
                ctx.fillStyle = c.text; ctx.font='bold 22px sans-serif';
                const labels = {1:'词根 A', 2:'词根 B', 3:'复合词'};
                ctx.fillText(labels[type], 150, 195);
                ctx.font='13px sans-serif'; ctx.fillStyle='#aaa';
                ctx.fillText('Demo · AI配图中', 150, 240);
                imgEl.src = canvas.toDataURL();
            };

            function spawnParticles() {
                const container = dom.particlesContainer;
                const colors = ['#e07b4c','#4a90b8','#c8963e','#f5a623','#ffd700'];
                container.innerHTML = '';
                for(let i=0;i<16;i++) {
                    const p = document.createElement('div'); p.className='particle';
                    const angle = Math.PI*2*i/16 + (Math.random()-0.5)*0.5;
                    const dist = 60+Math.random()*80;
                    p.style.setProperty('--dx', Math.cos(angle)*dist+'px');
                    p.style.setProperty('--dy', Math.sin(angle)*dist+'px');
                    p.style.setProperty('--duration', (0.5+Math.random()*0.6)+'s');
                    p.style.width = (6+Math.random()*10)+'px'; p.style.height = p.style.width;
                    p.style.background = colors[Math.floor(Math.random()*colors.length)];
                    container.appendChild(p);
                }
                setTimeout(()=>{ container.innerHTML=''; },1000);
            }

            function triggerFlash() {
                const flash = dom.flashOverlay;
                flash.classList.remove('active'); void flash.offsetWidth; flash.classList.add('active');
            }

            function resetStage() {
                gamePhase = 'idle';
                clearTimeout(countdownTimer); clearTimeout(zhDelayTimer);
                document.body.classList.remove('result-showing');
                dom.card1.style.transform = ''; dom.card1.style.opacity = '1'; dom.card1.style.zIndex = '1';
                dom.card2.style.transform = ''; dom.card2.style.opacity = '1'; dom.card2.style.zIndex = '1';
                dom.card1.style.filter = ''; dom.card2.style.filter = '';
                dom.operatorSign.style.opacity = '1'; dom.questionMark.style.display = ''; dom.questionMark.style.opacity = '1';
                dom.countdownNum.style.display = 'none'; dom.countdownNum.textContent = '';
                dom.eqImg1.src = ''; dom.eqImg2.src = ''; dom.eqImg3.src = '';
                const req = dom.resultEquation;
                req.style.transition = 'none';
                req.classList.remove('visible');
                req.offsetHeight;
                req.style.transition = '';
                req.classList.add('result-hidden');
                dom.flashOverlay.classList.remove('active'); dom.particlesContainer.innerHTML = '';
                dom.gameStage.querySelectorAll('.big-image-reveal').forEach(el => el.remove());
                dom.btnNext.style.display = 'none';
                dom.labelZh1.classList.add('zh-hidden'); dom.labelZh2.classList.add('zh-hidden');
                [dom.img1,dom.img2,dom.eqImg1,dom.eqImg2,dom.eqImg3].forEach(img=>{img.dataset.fallbacked='false';});
            }

            function loadWord(word) {
                currentEmojis = { 1: word.emoji1, 2: word.emoji2, 3: word.emoji3 };
                dom.img1.src = buildPicSrc(word.type, word.seq, 1, word.word1.de, word.id); dom.labelDe1.textContent = word.word1.de; dom.labelZh1.textContent = word.word1.zh;
                dom.img2.src = buildPicSrc(word.type, word.seq, 2, word.word2.de, word.id); dom.labelDe2.textContent = word.word2.de; dom.labelZh2.textContent = word.word2.zh;
                dom.labelZh1.classList.add('zh-hidden'); dom.labelZh2.classList.add('zh-hidden');
                clearTimeout(zhDelayTimer);
                zhDelayTimer = setTimeout(() => {
                    dom.labelZh1.classList.remove('zh-hidden');
                    dom.labelZh2.classList.remove('zh-hidden');
                }, 500);
                new Image().src = buildPicSrc(word.type, word.seq, 3, word.compound.de, word.id);
                dom.eqImg1.src = buildPicSrc(word.type, word.seq, 1, word.word1.de, word.id); dom.eqDe1.textContent = word.word1.de; dom.eqZh1.textContent = word.word1.zh;
                dom.eqImg2.src = buildPicSrc(word.type, word.seq, 2, word.word2.de, word.id); dom.eqDe2.textContent = word.word2.de; dom.eqZh2.textContent = word.word2.zh;
                dom.eqImg3.src = buildPicSrc(word.type, word.seq, 3, word.compound.de, word.id); dom.eqCompoundDe.textContent = word.compound.de; dom.eqCompoundZh.textContent = word.compound.zh;
            }

            function startCountdown() {
                gamePhase = 'countdown';
                dom.questionMark.style.display = 'none';
                dom.countdownNum.style.display = '';
                let count = settings.countdownTime;
                const showCount = () => {
                    if(gamePhase !== 'countdown') return;
                    dom.countdownNum.textContent = count;
                    dom.countdownNum.style.animation = 'none'; void dom.countdownNum.offsetWidth;
                    dom.countdownNum.style.animation = 'count-pulse 0.5s ease-out';
                    audio.tick();
                    if(count <= 0) {
                        dom.countdownNum.style.display = 'none';
                        triggerFusionAnimation();
                        return;
                    }
                    count--;
                    countdownTimer = setTimeout(showCount, 900);
                };
                showCount();
            }

            function triggerFusionAnimation() {
                gamePhase = 'animating';
                dom.operatorSign.style.opacity = '0';
                dom.questionMark.style.display = 'none'; dom.countdownNum.style.display = 'none';
                dom.card1.style.transition = 'all 0.55s cubic-bezier(0.22, 0.61, 0.36, 1)';
                dom.card2.style.transition = 'all 0.55s cubic-bezier(0.22, 0.61, 0.36, 1)';
                const move1 = (dom.gameStage.offsetWidth/2 - dom.card1.offsetLeft - dom.card1.offsetWidth/2 - dom.card1.offsetWidth/2 + 20);
                const move2 = (dom.gameStage.offsetWidth/2 - dom.card2.offsetLeft - dom.card2.offsetWidth/2 + dom.card2.offsetWidth/2 - 20);
                dom.card1.style.transform = `translateX(${move1}px) scale(0.85)`; dom.card1.style.zIndex = '4';
                dom.card2.style.transform = `translateX(${move2}px) scale(0.85)`; dom.card2.style.zIndex = '4';
                setTimeout(()=>{ audio.collision(); triggerFlash(); spawnParticles(); dom.card1.style.filter='brightness(1.4)'; dom.card2.style.filter='brightness(1.4)'; setTimeout(()=>{dom.card1.style.filter='';dom.card2.style.filter='';},150); },400);
                setTimeout(()=>{ dom.card1.style.opacity='0'; dom.card2.style.opacity='0'; dom.card1.style.zIndex='1'; dom.card2.style.zIndex='1'; showResult(); },750);
            }

            function showResult() {
                gamePhase = 'result';
                audio.reveal();
                dom.resultEquation.classList.remove('result-hidden');
                dom.resultEquation.classList.add('visible');
                document.body.classList.add('result-showing');

                const word = questionSequence[currentIndex];
                const bigImg = document.createElement('div');
                bigImg.className = 'big-image-reveal';
                bigImg.innerHTML = `<img src="${buildPicSrc(word.type, word.seq, 3, word.compound.de, word.id)}" onerror="handleImgError(this, 3)">`;
                dom.gameStage.appendChild(bigImg);

                dom.btnNext.style.display = '';
                dom.btnNext.textContent = currentIndex >= questionSequence.length-1 ? '🔄 更多练习' : '▶ 下一题';
            }

            function nextWord() {
                if(currentIndex >= questionSequence.length-1) { startNewGame(); return; }
                currentIndex++;
                resetStage();
                dom.resultEquation.classList.remove('result-hidden');
                const word = questionSequence[currentIndex];
                if(word) {
                    loadWord(word);
                    gamePhase = 'showing';
                    countdownTimer = setTimeout(()=> startCountdown(), 1500);
                }
            }

            function finishGame() {
                gamePhase = 'idle';
                resetStage();
                dom.questionMark.style.display = ''; dom.questionMark.textContent = '🎉'; dom.questionMark.style.animation = 'none';
                dom.operatorSign.style.display = 'none';
                dom.labelDe1.textContent = '恭喜！'; dom.labelZh1.textContent = '全部完成'; dom.labelZh1.classList.remove('zh-hidden');
                dom.labelDe2.textContent = '太棒了！'; dom.labelZh2.textContent = '继续加油'; dom.labelZh2.classList.remove('zh-hidden');
                dom.img1.src = ''; dom.img2.src = ''; handleImgError(dom.img1,1); handleImgError(dom.img2,2);
                dom.resultEquation.classList.remove('visible');
                dom.btnNext.style.display = 'none';
                audio.success();
            }

            function buildQuestionSequence() {
                let pool = [];
                const filteredByType = wordBank.filter(w => w.type === 'noun');
                if (filteredByType.length === 0) return [];

                if (settings.difficulty === 'mixed') {
                    const easy = filteredByType.filter(w => w.level === 'easy');
                    const medium = filteredByType.filter(w => w.level === 'medium');
                    const hard = filteredByType.filter(w => w.level === 'hard');
                    pool = [...shuffleArray(easy), ...shuffleArray(medium), ...shuffleArray(hard)];
                } else {
                    pool = filteredByType.filter(w => w.level === settings.difficulty);
                    pool = shuffleArray(pool);
                }
                return pool.slice(0, settings.questionsPerRound);
            }

            function shuffleArray(arr) {
                const a = [...arr];
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
            }

            function startNewGame() {
                questionSequence = buildQuestionSequence();
                if(questionSequence.length === 0) {
                    dom.gameStage.innerHTML = '<div style="padding:40px;text-align:center;">😕 当前筛选条件下没有词汇。</div>';
                    dom.btnNext.style.display = 'none';
                    return;
                }
                currentIndex = 0;
                resetStage();
                dom.resultEquation.classList.remove('result-hidden');
                dom.questionMark.textContent = '?'; dom.questionMark.style.animation = 'float-gentle 2.5s infinite';
                dom.operatorSign.style.display = '';
                const word = questionSequence[0];
                loadWord(word);
                gamePhase = 'showing';
                countdownTimer = setTimeout(()=> startCountdown(), 1500);
            }

            // ===== 事件绑定 =====
            dom.btnNext.addEventListener('click', ()=>{ audio.init(); userInteracted=true; nextWord(); });

            document.addEventListener('keydown', (e)=>{
                if(e.key===' '||e.key==='Enter') {
                    e.preventDefault(); audio.init(); userInteracted=true;
                    if(gamePhase==='countdown'||gamePhase==='showing') triggerFusionAnimation();
                    else if(gamePhase==='result') nextWord();
                }
            });
            dom.gameStage.addEventListener('click', (e)=>{
                if(e.target.closest('.image-card') && (gamePhase==='countdown'||gamePhase==='showing')) {
                    audio.init(); userInteracted=true; triggerFusionAnimation();
                }
            });

            // 初始化
            startNewGame();
        })();
    </script>
</body>
</html>
