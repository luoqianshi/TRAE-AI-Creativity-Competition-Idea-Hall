<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心镜 Echo - 私人AI访谈助手</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #000;
    color: #fff;
    overflow: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* 宇宙背景层 */
.universe-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: 
        radial-gradient(ellipse at 20% 80%, rgba(72, 61, 139, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(25, 25, 112, 0.2) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(10, 10, 40, 0.9) 0%, #000 100%);
    z-index: 0;
}

/* 星云层 */
.nebula {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    opacity: 0.3;
    filter: blur(40px);
}

.nebula-cloud {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    animation: drift 60s ease-in-out infinite;
}

.nebula-1 {
    width: 400px; height: 400px;
    top: 10%; left: 15%;
    background: radial-gradient(circle, rgba(100, 80, 200, 0.4), transparent 70%);
}

.nebula-2 {
    width: 500px; height: 500px;
    top: 50%; right: 10%;
    background: radial-gradient(circle, rgba(30, 80, 180, 0.3), transparent 70%);
    animation-delay: -20s;
    animation-direction: reverse;
}

.nebula-3 {
    width: 300px; height: 300px;
    bottom: 20%; left: 40%;
    background: radial-gradient(circle, rgba(150, 50, 150, 0.3), transparent 70%);
    animation-delay: -40s;
}

@keyframes drift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(50px, -30px) scale(1.1); }
    66% { transform: translate(-30px, 50px) scale(0.95); }
}

canvas {
    position: fixed;
    top: 0; left: 0;
    pointer-events: none;
}

#starCanvas { z-index: 2; }
#meteorCanvas { z-index: 3; }

/* 主容器 */
.container {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 800px;
    padding: 2rem;
    height: 100vh;
    justify-content: space-between;
}

/* 顶部标题 */
.header {
    text-align: center;
    padding-top: 2rem;
}

.logo {
    font-size: 2rem;
    font-weight: 200;
    letter-spacing: 8px;
    opacity: 0.95;
    background: linear-gradient(135deg, #a8c6ff 0%, #7ba4ff 50%, #c8a8ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.5rem;
}

.subtitle {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.4);
    letter-spacing: 4px;
    text-transform: uppercase;
}

/* 对话区域 */
.dialogue-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: 100%;
    max-width: 600px;
    min-height: 200px;
}

.dialogue-box {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 24px;
    padding: 2rem;
    text-align: center;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    min-height: 140px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.dialogue-box.active {
    border-color: rgba(120, 160, 255, 0.3);
    box-shadow: 0 8px 40px rgba(100, 140, 255, 0.1);
}

.speaker-label {
    font-size: 0.7rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 1rem;
    opacity: 0.5;
    font-weight: 500;
}

.speaker-label.ai {
    background: linear-gradient(90deg, #7ba4ff, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    opacity: 0.9;
}

.speaker-label.user {
    color: rgba(255, 255, 255, 0.6);
}

.dialogue-text {
    font-size: 1.05rem;
    line-height: 1.9;
    color: rgba(255, 255, 255, 0.9);
    font-weight: 300;
    letter-spacing: 0.5px;
    transition: opacity 0.3s ease;
}

.dialogue-text.thinking::after {
    content: '';
    display: inline-block;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #7ba4ff;
    margin-left: 6px;
    animation: blink 1.4s infinite;
    box-shadow: 8px 0 #7ba4ff, 16px 0 #7ba4ff;
}

@keyframes blink {
    0%, 20% { opacity: 0; }
    50% { opacity: 1; }
    100% { opacity: 0; }
}

/* 音波可视化区 */
.wave-section {
    width: 100%;
    padding: 2rem 0;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.wave-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    height: 80px;
    margin-bottom: 1.5rem;
}

.wave-bar {
    width: 4px;
    height: 8px;
    background: linear-gradient(180deg, #7ba4ff 0%, #4a7dff 50%, #a78bfa 100%);
    border-radius: 2px;
    transition: height 0.08s cubic-bezier(0.4, 0, 0.2, 1);
    opacity: 0.3;
    box-shadow: 0 0 8px rgba(123, 164, 255, 0.3);
}

.wave-bar.active {
    opacity: 1;
    box-shadow: 0 0 15px rgba(123, 164, 255, 0.6);
}

/* 状态指示器 */
.status-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.4);
    letter-spacing: 2px;
}

.status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    transition: all 0.3s ease;
}

.status-dot.listening {
    background: #4ade80;
    box-shadow: 0 0 10px rgba(74, 222, 128, 0.6);
    animation: pulse-dot 1.5s ease-in-out infinite;
}

.status-dot.speaking {
    background: #7ba4ff;
    box-shadow: 0 0 10px rgba(123, 164, 255, 0.6);
    animation: pulse-dot 1.5s ease-in-out infinite;
}

.status-dot.thinking {
    background: #fbbf24;
    box-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
}

@keyframes pulse-dot {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.7; }
}

/* 控制按钮区 */
.controls {
    padding-bottom: 3rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
}

.btn-start {
    position: relative;
    padding: 16px 56px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, rgba(123, 164, 255, 0.15) 0%, rgba(167, 139, 250, 0.15) 100%);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 400;
    letter-spacing: 4px;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    overflow: hidden;
}

.btn-start::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transition: left 0.6s ease;
}

.btn-start:hover::before {
    left: 100%;
}

.btn-start:hover {
    transform: translateY(-2px);
    border-color: rgba(123, 164, 255, 0.5);
    box-shadow: 0 10px 40px rgba(123, 164, 255, 0.2);
    background: linear-gradient(135deg, rgba(123, 164, 255, 0.25) 0%, rgba(167, 139, 250, 0.25) 100%);
}

.btn-start:active {
    transform: translateY(0);
}

.btn-start:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
}

.btn-start:disabled:hover::before {
    left: -100%;
}

.btn-hint {
    font-size: 0.7rem;
    color: rgba(255,255,255,0.3);
    letter-spacing: 1px;
}

/* 录音按钮 */
.btn-mic {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 2px solid rgba(123, 164, 255, 0.3);
    background: rgba(123, 164, 255, 0.1);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    margin-bottom: 1rem;
}

.btn-mic.visible {
    display: flex;
}

.btn-mic:hover {
    background: rgba(123, 164, 255, 0.2);
    border-color: rgba(123, 164, 255, 0.6);
    transform: scale(1.05);
}

.btn-mic.recording {
    border-color: #ef4444;
    background: rgba(239, 68, 68, 0.2);
    animation: pulse-rec 1.5s ease-in-out infinite;
}

@keyframes pulse-rec {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
    50% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
}

.btn-mic svg {
    width: 24px;
    height: 24px;
    fill: #fff;
}

/* 滚动条 */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: rgba(123, 164, 255, 0.3); border-radius: 10px; }

/* 动画淡入 */
.fade-in {
    animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* 响应式 */
@media (max-width: 640px) {
    .logo { font-size: 1.5rem; letter-spacing: 5px; }
    .dialogue-box { padding: 1.5rem; border-radius: 20px; }
    .dialogue-text { font-size: 0.95rem; }
    .wave-bar { width: 3px; }
    .container { padding: 1rem; }
}
</style>
</head>
<body>

<div class="universe-bg"></div>

<div class="nebula">
    <div class="nebula-cloud nebula-1"></div>
    <div class="nebula-cloud nebula-2"></div>
    <div class="nebula-cloud nebula-3"></div>
</div>

<canvas id="starCanvas"></canvas>
<canvas id="meteorCanvas"></canvas>

<div class="container">
    <header class="header fade-in">
        <h1 class="logo">心镜 ECHO</h1>
        <p class="subtitle">私人 AI 深度访谈助手</p>
    </header>

    <main class="dialogue-area fade-in" style="animation-delay: 0.2s;">
        <div class="dialogue-box" id="dialogueBox">
            <div class="speaker-label ai" id="speakerLabel">心镜 AI</div>
            <div class="dialogue-text" id="dialogueText">
                你好，我是你的访谈伙伴。<br>准备好开始一场与自己的对话了吗？
            </div>
        </div>
    </main>

    <section class="wave-section fade-in" style="animation-delay: 0.4s;">
        <div class="wave-container" id="waveContainer"></div>
        <div class="status-indicator">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">等待开始</span>
        </div>
    </section>

    <div class="controls fade-in" style="animation-delay: 0.6s;">
        <button class="btn-mic" id="btnMic">
            <svg viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
        </button>
        <button class="btn-start" id="btnStart">开始访谈</button>
        <span class="btn-hint" id="btnHint">点击开启一段与自己的深度对话</span>
    </div>
</div>

<script>
// ===== 星空渲染 =====
const starCanvas = document.getElementById('starCanvas');
const starCtx = starCanvas.getContext('2d');
let stars = [];

function resizeCanvases() {
    starCanvas.width = window.innerWidth;
    starCanvas.height = window.innerHeight;
    meteorCanvas.width = window.innerWidth;
    meteorCanvas.height = window.innerHeight;
    initStars();
}

function initStars() {
    stars = [];
    const count = Math.floor((starCanvas.width * starCanvas.height) / 5000);
    for (let i = 0; i < count; i++) {
        stars.push({
            x: Math.random() * starCanvas.width,
            y: Math.random() * starCanvas.height,
            radius: Math.random() * 1.8 + 0.2,
            baseAlpha: Math.random() * 0.7 + 0.3,
            alpha: 0,
            twinkleSpeed: Math.random() * 0.015 + 0.005,
            twinklePhase: Math.random() * Math.PI * 2,
            color: Math.random() > 0.9 ? 
                `rgba(${180 + Math.random()*75}, ${200 + Math.random()*55}, 255, ` : 
                Math.random() > 0.8 ? 
                `rgba(255, ${220 + Math.random()*35}, ${180 + Math.random()*50}, ` :
                'rgba(255, 255, 255, '
        });
    }
}

function drawStars(time) {
    starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
    
    stars.forEach(star => {
        star.alpha = star.baseAlpha * (0.6 + 0.4 * Math.sin(time * star.twinkleSpeed + star.twinklePhase));
        
        // 大星星添加十字光芒
        if (star.radius > 1.4) {
            starCtx.save();
            starCtx.globalAlpha = star.alpha * 0.3;
            starCtx.strokeStyle = star.color + '0.5)';
            starCtx.lineWidth = 0.5;
            starCtx.beginPath();
            starCtx.moveTo(star.x - star.radius * 3, star.y);
            starCtx.lineTo(star.x + star.radius * 3, star.y);
            starCtx.moveTo(star.x, star.y - star.radius * 3);
            starCtx.lineTo(star.x, star.y + star.radius * 3);
            starCtx.stroke();
            starCtx.restore();
        }
        
        starCtx.beginPath();
        starCtx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        starCtx.fillStyle = star.color + star.alpha + ')';
        starCtx.fill();
    });
}

// ===== 流星系统 =====
const meteorCanvas = document.getElementById('meteorCanvas');
const meteorCtx = meteorCanvas.getContext('2d');
let meteors = [];

class Meteor {
    constructor() {
        this.reset();
    }
    
    reset() {
        this.x = Math.random() * meteorCanvas.width * 1.5 - meteorCanvas.width * 0.25;
        this.y = -50;
        this.length = Math.random() * 120 + 80;
        this.speed = Math.random() * 12 + 8;
        this.angle = (Math.random() * 20 + 30) * Math.PI / 180;
        this.opacity = 1;
        this.trail = [];
        this.active = true;
        this.thickness = Math.random() * 1.5 + 0.5;
    }
    
    update() {
        if (!this.active) return;
        
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        
        this.trail.push({ x: this.x, y: this.y, opacity: 1 });
        
        if (this.trail.length > this.length / 3) {
            this.trail.shift();
        }
        
        this.trail.forEach(point => {
            point.opacity -= 0.04;
        });
        
        if (this.y > meteorCanvas.height + 50 || this.x > meteorCanvas.width + 100) {
            this.active = false;
        }
    }
    
    draw() {
        if (!this.active || this.trail.length < 2) return;
        
        for (let i = 1; i < this.trail.length; i++) {
            const prev = this.trail[i - 1];
            const curr = this.trail[i];
            const progress = i / this.trail.length;
            
            meteorCtx.beginPath();
            meteorCtx.moveTo(prev.x, prev.y);
            meteorCtx.lineTo(curr.x, curr.y);
            
            const alpha = progress * curr.opacity;
            meteorCtx.strokeStyle = `rgba(200, 220, 255, ${alpha})`;
            meteorCtx.lineWidth = this.thickness * progress;
            meteorCtx.stroke();
        }
        
        // 头部光点
        const head = this.trail[this.trail.length - 1];
        meteorCtx.beginPath();
        meteorCtx.arc(head.x, head.y, this.thickness * 1.5, 0, Math.PI * 2);
        meteorCtx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        meteorCtx.fill();
        
        // 头部光晕
        const glowGrad = meteorCtx.createRadialGradient(head.x, head.y, 0, head.x, head.y, 8);
        glowGrad.addColorStop(0, 'rgba(200, 220, 255, 0.5)');
        glowGrad.addColorStop(1, 'rgba(200, 220, 255, 0)');
        meteorCtx.beginPath();
        meteorCtx.arc(head.x, head.y, 8, 0, Math.PI * 2);
        meteorCtx.fillStyle = glowGrad;
        meteorCtx.fill();
    }
}

function spawnMeteor() {
    if (meteors.filter(m => m.active).length < 3) {
        meteors.push(new Meteor());
    }
}

function updateMeteors() {
    meteorCtx.clearRect(0, 0, meteorCanvas.width, meteorCanvas.height);
    meteors.forEach(m => {
        m.update();
        m.draw();
    });
    meteors = meteors.filter(m => m.active);
}

// 随机生成流星
function scheduleMeteor() {
    const delay = Math.random() * 5000 + 2000;
    setTimeout(() => {
        spawnMeteor();
        scheduleMeteor();
    }, delay);
}

// ===== 主渲染循环 =====
let animTime = 0;
function animate() {
    animTime += 1;
    drawStars(animTime);
    updateMeteors();
    requestAnimationFrame(animate);
}

window.addEventListener('resize', resizeCanvases);
resizeCanvases();
animate();
scheduleMeteor();

// ===== 音波可视化 =====
const waveContainer = document.getElementById('waveContainer');
const BAR_COUNT = 48;
let waveBars = [];
let targetHeights = new Array(BAR_COUNT).fill(8);
let currentHeights = new Array(BAR_COUNT).fill(8);

// 初始化音波条
function initWaveBars() {
    waveContainer.innerHTML = '';
    waveBars = [];
    for (let i = 0; i < BAR_COUNT; i++) {
        const bar = document.createElement('div');
        bar.className = 'wave-bar';
        bar.style.height = '8px';
        waveContainer.appendChild(bar);
        waveBars.push(bar);
    }
}
initWaveBars();

// 平滑更新音波
function updateWaveVisual() {
    waveBars.forEach((bar, i) => {
        currentHeights[i] += (targetHeights[i] - currentHeights[i]) * 0.15;
        bar.style.height = currentHeights[i] + 'px';
        
        if (targetHeights[i] > 15) {
            bar.classList.add('active');
        } else {
            bar.classList.remove('active');
        }
    });
    requestAnimationFrame(updateWaveVisual);
}
updateWaveVisual();

// 模拟音波（当没有真实音频时）
let waveSimulation = null;
function startWaveSimulation(type) {
    stopWaveSimulation();
    
    waveSimulation = setInterval(() => {
        for (let i = 0; i < BAR_COUNT; i++) {
            const center = BAR_COUNT / 2;
            const dist = Math.abs(i - center) / center;
            
            if (type === 'speaking') {
                // AI 说话 - 较规律的波动
                const base = 35 * (1 - dist * 0.7);
                const noise = Math.sin(Date.now() * 0.01 + i * 0.5) * 15;
                const pulse = Math.sin(Date.now() * 0.003) * 10;
                targetHeights[i] = Math.max(6, base + noise + pulse);
            } else if (type === 'listening') {
                // 人说话 - 更随机的波动
                const base = 25 * (1 - dist * 0.6);
                const noise = Math.random() * 25;
                const burst = Math.sin(Date.now() * 0.008 + i * 0.3) * 20;
                targetHeights[i] = Math.max(5, base + noise + burst);
            }
        }
    }, 60);
}

function stopWaveSimulation() {
    if (waveSimulation) {
        clearInterval(waveSimulation);
        waveSimulation = null;
    }
    // 平滑回归静态
    for (let i = 0; i < BAR_COUNT; i++) {
        targetHeights[i] = 8;
    }
}

// 空闲状态 - 轻微波动
let idleWave = null;
function startIdleWave() {
    if (idleWave) return;
    idleWave = setInterval(() => {
        for (let i = 0; i < BAR_COUNT; i++) {
            const center = BAR_COUNT / 2;
            const dist = Math.abs(i - center) / center;
            const wave = Math.sin(Date.now() * 0.002 + i * 0.2) * 3;
            targetHeights[i] = 8 + wave * (1 - dist * 0.5);
        }
    }, 100);
}

function stopIdleWave() {
    if (idleWave) {
        clearInterval(idleWave);
        idleWave = null;
    }
}

// 初始空闲波动
setTimeout(startIdleWave, 1000);

// ===== 音频处理 =====
let audioContext, analyser, dataArray, source, micStream;

async function initAudio() {
    try {
        micStream = await navigator.mediaDevices.getUserMedia({ 
            audio: { 
                echoCancellation: true, 
                noiseSuppression: true,
                autoGainControl: true
            } 
        });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 128;
        analyser.smoothingTimeConstant = 0.7;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        source = audioContext.createMediaStreamSource(micStream);
        source.connect(analyser);
        return true;
    } catch (e) {
        console.error('Audio init failed:', e);
        return false;
    }
}

function processAudio() {
    if (!analyser || !isListening) return;
    
    analyser.getByteFrequencyData(dataArray);
    
    for (let i = 0; i < BAR_COUNT; i++) {
        const dataIndex = Math.floor(i * dataArray.length / BAR_COUNT);
        const value = dataArray[dataIndex];
        // 映射到 8-70px 高度
        targetHeights[i] = Math.max(8, 8 + (value / 255) * 62);
    }
    
    requestAnimationFrame(processAudio);
}

// ===== 语音识别 =====
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isListening = false;
let isAiSpeaking = false;

if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'zh-CN';
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
        isListening = true;
        setStatus('listening', '正在倾听');
        stopIdleWave();
        startWaveSimulation('listening');
        if (analyser) processAudio();
    };

    recognition.onresult = (event) => {
        let finalTranscript = '';
        let interimTranscript = '';
        
        for (let i = event.resultIndex; i < event.results.length; i++) {
            const transcript = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
                finalTranscript += transcript;
            } else {
                interimTranscript += transcript;
            }
        }
        
        const displayText = finalTranscript || interimTranscript;
        if (displayText) {
            showDialogue('你说', displayText, 'user');
        }
    };

    recognition.onend = () => {
        isListening = false;
        stopWaveSimulation();
        const text = document.getElementById('dialogueText').textContent;
        if (text && text !== '正在倾听...') {
            aiRespond(text);
        }
    };

    recognition.onerror = (event) => {
        console.error('Recognition error:', event.error);
        isListening = false;
        stopWaveSimulation();
        
        if (event.error === 'no-speech') {
            setStatus('idle', '没有检测到声音');
        } else if (event.error === 'not-allowed') {
            setStatus('error', '请允许麦克风权限');
        }
        
        startIdleWave();
    };
}

// ===== AI 对话逻辑 =====
const interviewQuestions = [
    "欢迎来到这次与自己的对话。让我先问你一个问题——此刻，你最想对自己说什么？",
    "这很有意思。当你想到这个的时候，你内心最真实的感觉是什么？",
    "如果用一个比喻来形容你现在的状态，你会怎么描述？",
    "在你的生活中，什么时候你感觉最像真正的自己？",
    "有没有什么事情，是你一直想做但还没勇气开始的？是什么在阻止你？",
    "如果你能回到一年前，你会对那时的自己说什么？",
    "你刚才提到了很多感受。如果这些感受可以告诉你一个信息，你觉得是什么？",
    "最后一个问题——今天这次对话之后，你最想记住的一件事是什么？"
];

let questionIndex = 0;
let dialogueHistory = [];

function showDialogue(speaker, text, type) {
    const label = document.getElementById('speakerLabel');
    const textBox = document.getElementById('dialogueText');
    const box = document.getElementById('dialogueBox');
    
    label.textContent = speaker;
    label.className = 'speaker-label ' + type;
    
    textBox.classList.remove('thinking');
    textBox.textContent = text;
    
    box.classList.toggle('active', type === 'ai');
    
    dialogueHistory.push({ speaker, text, type, time: Date.now() });
}

function setStatus(type, text) {
    const dot = document.getElementById('statusDot');
    const textEl = document.getElementById('statusText');
    
    dot.className = 'status-dot ' + (type === 'idle' ? '' : type);
    textEl.textContent = text;
}

function aiRespond(userText) {
    isAiSpeaking = true;
    setStatus('thinking', '思考中');
    showDialogue('心镜 AI', '', 'ai');
    
    const textBox = document.getElementById('dialogueText');
    textBox.classList.add('thinking');
    
    // 模拟思考延迟
    const thinkTime = 1200 + Math.random() * 800;
    
    setTimeout(() => {
        const question = interviewQuestions[questionIndex % interviewQuestions.length];
        questionIndex++;
        
        setStatus('speaking', '正在说话');
        textBox.classList.remove('thinking');
        showDialogue('心镜 AI', question, 'ai');
        
        stopWaveSimulation();
        startWaveSimulation('speaking');
        
        // 文字转语音
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(question);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.88;
            utterance.pitch = 1.05;
            utterance.volume = 1;
            
            // 尝试选择更好的中文语音
            const voices = speechSynthesis.getVoices();
            const zhVoice = voices.find(v => v.lang.includes('zh'));
            if (zhVoice) utterance.voice = zhVoice;
            
            utterance.onend = () => {
                isAiSpeaking = false;
                stopWaveSimulation();
                startIdleWave();
                setStatus('idle', '等待你说话');
                
                setTimeout(() => {
                    if (recognition) {
                        try { recognition.start(); } catch(e) {}
                    }
                }, 800);
            };
            
            utterance.onerror = () => {
                isAiSpeaking = false;
                stopWaveSimulation();
                startIdleWave();
                setStatus('idle', '等待你说话');
            };
            
            speechSynthesis.speak(utterance);
        } else {
            setTimeout(() => {
                isAiSpeaking = false;
                stopWaveSimulation();
                startIdleWave();
                setStatus('idle', '等待你说话');
            }, 4000);
        }
    }, thinkTime);
}

// ===== UI 控制 =====
const btnStart = document.getElementById('btnStart');
const btnMic = document.getElementById('btnMic');
const btnHint = document.getElementById('btnHint');
let interviewStarted = false;

btnStart.addEventListener('click', async () => {
    if (interviewStarted) return;
    interviewStarted = true;
    
    btnStart.textContent = '正在准备...';
    btnStart.disabled = true;
    btnHint.textContent = '请允许使用麦克风';
    setStatus('thinking', '初始化中');
    
    // 初始化音频
    const audioOk = await initAudio();
    
    if (audioOk) {
        btnStart.textContent = '访谈进行中';
        btnMic.classList.add('visible');
        btnHint.textContent = 'AI 说话后会自动开启倾听';
        
        // 开始第一个问题
        aiRespond('');
    } else {
        btnStart.textContent = '开始访谈';
        btnStart.disabled = false;
        btnHint.textContent = '需要麦克风权限才能开始';
        interviewStarted = false;
        setStatus('error', '音频初始化失败');
    }
});

btnMic.addEventListener('click', () => {
    if (isListening) {
        recognition.stop();
        btnMic.classList.remove('recording');
    } else if (!isAiSpeaking) {
        try {
            recognition.start();
            btnMic.classList.add('recording');
        } catch(e) {}
    }
});

recognition && (recognition.onstart = () => {
    isListening = true;
    btnMic.classList.add('recording');
    setStatus('listening', '正在倾听');
    stopIdleWave();
    startWaveSimulation('listening');
    if (analyser) processAudio();
});

recognition && (recognition.onend = () => {
    isListening = false;
    btnMic.classList.remove('recording');
    stopWaveSimulation();
    const text = document.getElementById('dialogueText').textContent;
    if (text && text !== '正在倾听...') {
        aiRespond(text);
    } else {
        startIdleWave();
    }
});

// 预加载语音
if ('speechSynthesis' in window) {
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}
</script>
