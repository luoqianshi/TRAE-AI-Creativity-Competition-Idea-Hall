<!-- 自定义样式 -->
<style>
    .error {
        color: red;
        text-align: center;
    }

    .success {
        color: green;
        text-align: center;
    }

    .info {
        color: #333;
        text-align: left;
        font-size: 14px;
        padding: 5px;
        background-color: #f5f5f5;
        border-radius: 4px;
        margin-top: 5px;
    }

    input[type="text"] {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 16px;
    }

    .btn-start {
        background-color: #4CAF50 !important;
        color: white !important;
    }

    .btn-pause {
        background-color: #ff9800 !important;
        color: white !important;
    }

    .btn-resume {
        background-color: #2196F3 !important;
        color: white !important;
    }

    .btn-end {
        background-color: #f44336 !important;
        color: white !important;
    }

    .btn-disabled {
        opacity: 0.5 !important;
        pointer-events: none !important;
    }

    .status-card {
        background-color: #fff;
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 10px;
        margin: 10px 0;
    }

    .status-row {
        display: flex;
        justify-content: space-between;
        padding: 5px 0;
        border-bottom: 1px solid #eee;
    }

    .status-row:last-child {
        border-bottom: none;
    }

    .status-label {
        font-weight: bold;
        color: #666;
    }

    .status-value {
        color: #333;
    }

    .timer-display {
        font-size: 24px;
        font-weight: bold;
        text-align: center;
        color: #333;
        padding: 10px;
        background-color: #f9f9f9;
        border-radius: 4px;
    }

    </style>

<!-- 生产工序报工页面 -->
<div data-role="page" id="pageOne">
    <div data-role="header" data-position="fixed">
        <h5 style="padding: 3px; margin: 0px;">
            <div><label style="font-size: 17px !important; font-weight: bold; color: #FFFFFF">生产工序报工</label></div>
        </h5>
        <a href="#" role="button" class="goBack ui-btn-left lang" data-icon="back" data-transition="none" data-ajax="false" key="Back">返回</a>
        <a href="../Index.aspx" class="ui-btn-right lang" data-icon="home" data-transition="none" data-ajax="false" key="Home">首页</a>
    </div>

    <div data-role="content">
        <!-- 扫码输入区 -->
        <table style="width: 100%; padding-top: 8px;">
            <tr>
                <td style="width: 30%;"><label for="txtMoldCode" style="text-align: center; margin-top: 10px; font-weight: bold;">模具编码</label></td>
                <td style="width: 70%;"><input id="txtMoldCode" placeholder="请扫描或输入模具编码" autocomplete="off" /></td>
            </tr>
            <tr>
                <td><label for="txtProcessCode" style="text-align: center; margin-top: 10px; font-weight: bold;">加工编码</label></td>
                <td><input id="txtProcessCode" placeholder="请扫描或输入加工编码" autocomplete="off" /></td>
            </tr>
            <tr>
                <td><label for="txtOperationCode" style="text-align: center; margin-top: 10px; font-weight: bold;">当前工序</label></td>
                <td><input id="txtOperationCode" placeholder="请扫描或输入工序代码" autocomplete="off" /></td>
            </tr>
        </table>

        

        <div style="text-align: center; padding-bottom: 10px; padding-top: 5px;">
            <label id="msg1" class="error"></label>
        </div>

        <!-- 状态显示区 -->
        <div class="status-card">
            <div class="status-row">
                <span class="status-label">当前状态：</span>
                <span class="status-value" id="currentStatus">空闲</span>
            </div>
            <div class="status-row">
                <span class="status-label">开始时间：</span>
                <span class="status-value" id="startTime">-</span>
            </div>
            <div class="status-row">
                <span class="status-label">结束时间：</span>
                <span class="status-value" id="endTime">-</span>
            </div>
            <div class="status-row">
                <span class="status-label">暂停次数：</span>
                <span class="status-value" id="pauseCount">0</span>
            </div>
            <div class="status-row">
                <span class="status-label">累计暂停：</span>
                <span class="status-value" id="totalPause">-</span>
            </div>
        </div>

        <!-- 计时器显示 -->
        <div class="timer-display" id="timerDisplay">00:00:00</div>

        <!-- 操作控制区 (固定在底部) -->
        <div style="position: fixed; bottom: 0; left: 0; width: 100%; padding: 10px; background: #fff; border-top: 1px solid #eee; box-sizing: border-box; z-index: 100;">
            <div style="display: flex; gap: 5px;">
                <a data-corners="false" onclick="startWork()" data-role="button" data-fullscreen="true" data-theme="a" class="btn-start" style="flex: 1;" id="btnStart">开始</a>
                <a data-corners="false" onclick="pauseWork()" data-role="button" data-fullscreen="true" data-theme="a" class="btn-pause btn-disabled" style="flex: 1;" id="btnPause">暂停</a>
                <a data-corners="false" onclick="resumeWork()" data-role="button" data-fullscreen="true" data-theme="a" class="btn-resume btn-disabled" style="flex: 1;" id="btnResume">继续</a>
                <a data-corners="false" onclick="endWork()" data-role="button" data-fullscreen="true" data-theme="a" class="btn-end btn-disabled" style="flex: 1;" id="btnEnd">结束</a>
            </div>
        </div>
    </div>
</div>

<script>
    var currentState = 'idle';
    var startTime = null;
    var endTime = null;
    var pauseTime = null;
    var resumeTime = null;
    var pauseIntervals = [];
    var timerInterval = null;
    var workReportId = null;

    

    function init() {
        $("#msg1").text("");
        $("#txtProcessCode").val("");
        $("#txtOperationCode").val("");
        resetStatus();
        updateButtonState();
    }

    function loadActiveWorkReport() {
        if (!userName) return;

        var paramObj = {
            UserName: userName
        };

        try {
            var ajax = AjaxService.ExecProc("SP_tb_bs_WorkReport_GetActive", JSON.stringify(paramObj));

            if (!!ajax.error) {
                return;
            }

            var data = JSON.parse(ajax.value);
            if (data.length > 0) {
                var record = data[0];
                if (record.ID) {
                    workReportId = record.ID;
                    $("#txtMoldCode").val(record.MoldCode || "");
                    $("#txtProcessCode").val(record.ProcessCode || "");
                    $("#txtOperationCode").val(record.OperationCode || "");
                    
                    var startTimeStr = record.StartTime;
                    startTime = new Date(startTimeStr);
                    currentState = record.Status.toLowerCase();
                    
                    $("#currentStatus").text(currentState === 'running' ? '进行中' : '已暂停');
                    $("#startTime").text(formatTime(startTime));
                    $("#pauseCount").text(record.PauseCount || 0);
                    $("#totalPause").text(formatDuration(record.TotalPauseSeconds || 0));
                    
                    updateButtonState();

                    if (currentState === 'running') {
                        timerInterval = setInterval(updateTimer, 1000);
                        $("#msg1").removeClass("error").addClass("success").text("检测到进行中的报工，已自动恢复");
                    } else {
                        var elapsedSeconds = Math.floor((new Date() - startTime) / 1000);
                        var netSeconds = elapsedSeconds - (record.TotalPauseSeconds || 0);
                        $("#timerDisplay").text(formatDuration(netSeconds));
                        $("#msg1").removeClass("error").addClass("success").text("检测到已暂停的报工，已自动恢复");
                    }
                }
            }
        } catch (e) {
            console.log("加载进行中报工失败:", e);
        }
    }

    function resetStatus() {
        currentState = 'idle';
        startTime = null;
        endTime = null;
        pauseTime = null;
        resumeTime = null;
        pauseIntervals = [];
        workReportId = null;
        
        $("#currentStatus").text("空闲");
        $("#startTime").text("-");
        $("#endTime").text("-");
        $("#pauseCount").text("0");
        $("#totalPause").text("-");
        $("#timerDisplay").text("00:00:00");
        
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function updateButtonState() {
        $("#btnStart").removeClass("btn-disabled");
        $("#btnPause").removeClass("btn-disabled");
        $("#btnResume").removeClass("btn-disabled");
        $("#btnEnd").removeClass("btn-disabled");

        switch (currentState) {
            case 'idle':
                $("#btnStart").removeClass("btn-disabled");
                $("#btnPause").addClass("btn-disabled");
                $("#btnResume").addClass("btn-disabled");
                $("#btnEnd").addClass("btn-disabled");
                break;
            case 'running':
                $("#btnStart").addClass("btn-disabled");
                $("#btnPause").removeClass("btn-disabled");
                $("#btnResume").addClass("btn-disabled");
                $("#btnEnd").removeClass("btn-disabled");
                break;
            case 'paused':
                $("#btnStart").addClass("btn-disabled");
                $("#btnPause").addClass("btn-disabled");
                $("#btnResume").removeClass("btn-disabled");
                $("#btnEnd").removeClass("btn-disabled");
                break;
            case 'ended':
                $("#btnStart").removeClass("btn-disabled");
                $("#btnPause").addClass("btn-disabled");
                $("#btnResume").addClass("btn-disabled");
                $("#btnEnd").addClass("btn-disabled");
                break;
        }
    }

    function validateInput(inputId, value) {
        if (!value || value.trim() === "") {
            $("#" + inputId).focus();
            return false;
        }
        return true;
    }

    

    function formatTime(date) {
        if (!date) return "-";
        var y = date.getFullYear();
        var m = String(date.getMonth() + 1).padStart(2, '0');
        var d = String(date.getDate()).padStart(2, '0');
        var h = String(date.getHours()).padStart(2, '0');
        var min = String(date.getMinutes()).padStart(2, '0');
        var s = String(date.getSeconds()).padStart(2, '0');
        return y + "-" + m + "-" + d + " " + h + ":" + min + ":" + s;
    }

    function formatDuration(seconds) {
        var h = Math.floor(seconds / 3600);
        var m = Math.floor((seconds % 3600) / 60);
        var s = seconds % 60;
        return String(h).padStart(2, '0') + ":" + String(m).padStart(2, '0') + ":" + String(s).padStart(2, '0');
    }

    function calculateNetWorkTime() {
        if (!startTime) return 0;
        
        var end = endTime || new Date();
        var totalSeconds = Math.floor((end - startTime) / 1000);
        
        for (var i = 0; i < pauseIntervals.length; i++) {
            totalSeconds -= pauseIntervals[i];
        }
        
        return totalSeconds;
    }

    function updateTimer() {
        var netSeconds = calculateNetWorkTime();
        $("#timerDisplay").text(formatDuration(netSeconds));
    }

    function startWork() {
        var moldCode = $("#txtMoldCode").val().trim();
        var processCode = $("#txtProcessCode").val().trim();
        var opCode = $("#txtOperationCode").val().trim();

        if (!validateInput("txtMoldCode", moldCode)) {
            $("#msg1").removeClass("success").addClass("error").text("请扫描模具编码");
            return;
        }
        if (!validateInput("txtProcessCode", processCode)) {
            $("#msg1").removeClass("success").addClass("error").text("请扫描加工编码");
            return;
        }
        if (!validateInput("txtOperationCode", opCode)) {
            $("#msg1").removeClass("success").addClass("error").text("请扫描工序代码");
            return;
        }

        if (currentState === 'ended') {
            resetStatus();
        }

        if (currentState !== 'idle') {
            $("#msg1").removeClass("success").addClass("error").text("当前状态不允许开始");
            return;
        }

        var $btn = $("#btnStart");
        var originalText = $btn.text();
        $btn.text("处理中...").addClass("ui-disabled").prop("disabled", true);

        setTimeout(function () {
            try {
                var paramObj = {
                    MoldCode: moldCode,
                    MoldName: "",
                    ProcessCode: processCode,
                    ProcessName: "",
                    OperationCode: opCode,
                    OperationName: "",
                    UserName: userName
                };

                var ajax = AjaxService.ExecProc("SP_tb_bs_WorkReport_Start", JSON.stringify(paramObj));

                if (!!ajax.error) {
                    var msg = !!ajax.error.Message ? ajax.error.Message : ajax.error;
                    $("#msg1").removeClass("success").addClass("error").text(msg);
                    $btn.text(originalText).removeClass("ui-disabled").prop("disabled", false);
                    return;
                }

                var data = JSON.parse(ajax.value);
                if (data.length > 0) {
                    var result = data[0];
                    if (result.ResultCode !== 0) {
                        $("#msg1").removeClass("success").addClass("error").text(result.ResultMsg);
                        $btn.text(originalText).removeClass("ui-disabled").prop("disabled", false);
                        return;
                    }
                    if (result.ID) {
                        workReportId = result.ID;
                    }
                }

                startTime = new Date();
                currentState = 'running';

                $("#currentStatus").text("进行中");
                $("#startTime").text(formatTime(startTime));
                $("#msg1").removeClass("error").addClass("success").text("工序已开始");

                updateButtonState();

                timerInterval = setInterval(updateTimer, 1000);
            } catch (e) {
                $("#msg1").removeClass("success").addClass("error").text("系统异常: " + e.message);
            } finally {
                $btn.text(originalText).removeClass("ui-disabled").prop("disabled", false);
            }
        }, 10);
    }

    function pauseWork() {
        if (currentState !== 'running') {
            $("#msg1").removeClass("success").addClass("error").text("当前状态不允许暂停");
            return;
        }

        if (!workReportId) {
            $("#msg1").removeClass("success").addClass("error").text("报工记录ID无效");
            return;
        }

        var $btn = $("#btnPause");
        var originalText = $btn.text();
        $btn.text("处理中...").addClass("ui-disabled").prop("disabled", true);

        setTimeout(function () {
            try {
                var paramObj = {
                    ID: workReportId,
                    UserName: userName
                };

                var ajax = AjaxService.ExecProc("SP_tb_bs_WorkReport_Pause", JSON.stringify(paramObj));

                if (!!ajax.error) {
                    var msg = !!ajax.error.Message ? ajax.error.Message : ajax.error;
                    $("#msg1").removeClass("success").addClass("error").text(msg);
                    $btn.text(originalText).removeClass("ui-disabled").prop("disabled", false);
                    return;
                }

                var data = JSON.parse(ajax.value);
                if (data.length > 0) {
                    var result = data[0];
                    if (result.ResultCode !== 0) {
                        $("#msg1").removeClass("success").addClass("error").text(result.ResultMsg);
                        $btn.text(originalText).removeClass("ui-disabled").prop("disabled", false);
                        return;
                    }
                }

                pauseTime = new Date();
                currentState = 'paused';

                $("#currentStatus").text("已暂停");
                $("#msg1").removeClass("error").addClass("success").text("工序已暂停");

                updateButtonState();

                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
            } catch (e) {
                $("#msg1").removeClass("success").addClass("error").text("系统异常: " + e.message);
            } finally {
                $btn.text(originalText).removeClass("ui-disabled").prop("disabled", false);
            }
        }, 10);
    }

    function resumeWork() {
        if (currentState !== 'paused') {
            $("#msg1").removeClass("success").addClass("error").text("当前状态不允许继续");
            return;
        }

        if (!workReportId) {
            $("#msg1").removeClass("success").addClass("error").text("报工记录ID无效");
            return;
        }

        var $btn = $("#btnResume");
        var originalText = $btn.text();
        $btn.text("处理中...").addClass("ui-disabled").prop("disabled", true);

        setTimeout(function () {
            try {
                var paramObj = {
                    ID: workReportId,
                    UserName: userName
                };

                var ajax = AjaxService.ExecProc("SP_tb_bs_WorkReport_Resume", JSON.stringify(paramObj));

                if (!!ajax.error) {
                    var msg = !!ajax.error.Message ? ajax.error.Message : ajax.error;
                    $("#msg1").removeClass("success").addClass("error").text(msg);
                    $btn.text(originalText).removeClass("ui-disabled").prop("disabled", false);
                    return;
                }

                var data = JSON.parse(ajax.value);
                if (data.length > 0) {
                    var result = data[0];
                    if (result.ResultCode !== 0) {
                        $("#msg1").removeClass("success").addClass("error").text(result.ResultMsg);
                        $btn.text(originalText).removeClass("ui-disabled").prop("disabled", false);
                        return;
                    }
                }

                resumeTime = new Date();
                
                if (pauseTime) {
                    var pauseSeconds = Math.floor((resumeTime - pauseTime) / 1000);
                    pauseIntervals.push(pauseSeconds);
                }

                currentState = 'running';

                $("#currentStatus").text("进行中");
                $("#pauseCount").text(pauseIntervals.length);
                var totalPauseSeconds = pauseIntervals.reduce(function(a, b) { return a + b; }, 0);
                $("#totalPause").text(formatDuration(totalPauseSeconds));
                $("#msg1").removeClass("error").addClass("success").text("工序已继续");

                updateButtonState();

                timerInterval = setInterval(updateTimer, 1000);
            } catch (e) {
                $("#msg1").removeClass("success").addClass("error").text("系统异常: " + e.message);
            } finally {
                $btn.text(originalText).removeClass("ui-disabled").prop("disabled", false);
            }
        }, 10);
    }

    function endWork() {
        if (currentState !== 'running' && currentState !== 'paused') {
            $("#msg1").removeClass("success").addClass("error").text("请先点击开始按钮");
            return;
        }

        if (!workReportId) {
            $("#msg1").removeClass("success").addClass("error").text("报工记录ID无效");
            return;
        }

        var $btn = $("#btnEnd");
        var originalText = $btn.text();
        $btn.text("处理中...").addClass("ui-disabled").prop("disabled", true);

        setTimeout(function () {
            try {
                var paramObj = {
                    ID: workReportId,
                    UserName: userName
                };

                var ajax = AjaxService.ExecProc("SP_tb_bs_WorkReport_End", JSON.stringify(paramObj));

                if (!!ajax.error) {
                    var msg = !!ajax.error.Message ? ajax.error.Message : ajax.error;
                    $("#msg1").removeClass("success").addClass("error").text(msg);
                    $btn.text(originalText).removeClass("ui-disabled").prop("disabled", false);
                    return;
                }

                var data = JSON.parse(ajax.value);
                if (data.length > 0) {
                    var result = data[0];
                    if (result.ResultCode !== 0) {
                        $("#msg1").removeClass("success").addClass("error").text(result.ResultMsg);
                        $btn.text(originalText).removeClass("ui-disabled").prop("disabled", false);
                        return;
                    }
                }

                endTime = new Date();
                
                if (currentState === 'paused') {
                    var pauseSeconds = Math.floor((endTime - pauseTime) / 1000);
                    pauseIntervals.push(pauseSeconds);
                }

                var totalPauseSeconds = pauseIntervals.reduce(function(a, b) { return a + b; }, 0);
                var netWorkSeconds = calculateNetWorkTime();

                currentState = 'ended';

                $("#currentStatus").text("已结束");
                $("#endTime").text(formatTime(endTime));
                $("#pauseCount").text(pauseIntervals.length);
                $("#totalPause").text(formatDuration(totalPauseSeconds));
                $("#timerDisplay").text(formatDuration(netWorkSeconds));
                $("#msg1").removeClass("error").addClass("success").text("工序已结束，净工时：" + formatDuration(netWorkSeconds));

                updateButtonState();

                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }

                setTimeout(function() {
                    init();
                }, 2000);
            } catch (e) {
                $("#msg1").removeClass("success").addClass("error").text("系统异常: " + e.message);
            } finally {
                $btn.text(originalText).removeClass("ui-disabled").prop("disabled", false);
            }
        }, 10);
    }

    function checkProcessStatus() {
        var processCode = $("#txtProcessCode").val().trim();

        if (!validateInput("txtProcessCode", processCode)) {
            $("#msg1").removeClass("success").addClass("error").text("请扫描加工编码");
            return;
        }

        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        var paramObj = {
            ProcessCode: processCode
        };

        try {
            var ajax = AjaxService.ExecProc("SP_tb_bs_WorkReport_GetByProcessCode", JSON.stringify(paramObj));

            if (!!ajax.error) {
                var msg = !!ajax.error.Message ? ajax.error.Message : ajax.error;
                $("#msg1").removeClass("success").addClass("error").text("查询失败: " + msg);
                $("#txtOperationCode").focus();
                return;
            }

            if (!ajax.value) {
                $("#msg1").removeClass("success").addClass("error").text("查询返回数据为空");
                $("#txtOperationCode").focus();
                return;
            }

            var data = JSON.parse(ajax.value);
            if (!Array.isArray(data) || data.length === 0) {
                workReportId = null;
                $("#txtOperationCode").val("");
                currentState = 'idle';
                resetStatus();
                updateButtonState();
                $("#msg1").text("");
                $("#txtOperationCode").focus();
                return;
            }

            var record = data[0];
            if (!record.ID) {
                workReportId = null;
                $("#txtOperationCode").val("");
                currentState = 'idle';
                resetStatus();
                updateButtonState();
                $("#msg1").text("");
                $("#txtOperationCode").focus();
                return;
            }

            workReportId = record.ID;
            $("#txtMoldCode").val(record.MoldCode || "");
            $("#txtOperationCode").val(record.OperationCode || "");
            
            var startTimeStr = record.StartTime;
            startTime = new Date(startTimeStr);
            
            if (isNaN(startTime.getTime())) {
                $("#msg1").removeClass("success").addClass("error").text("日期格式解析失败");
                $("#txtOperationCode").focus();
                return;
            }
            
            currentState = record.Status.toLowerCase();
            
            $("#currentStatus").text(currentState === 'running' ? '进行中' : '已暂停');
            $("#startTime").text(formatTime(startTime));
            $("#endTime").text(record.EndTime ? formatTime(new Date(record.EndTime)) : '-');
            $("#pauseCount").text(record.PauseCount || 0);
            $("#totalPause").text(formatDuration(record.TotalPauseSeconds || 0));
            
            updateButtonState();

            if (currentState === 'running') {
                timerInterval = setInterval(updateTimer, 1000);
                $("#msg1").removeClass("error").addClass("success").text("检测到进行中的工序，已自动恢复");
            } else {
                var elapsedSeconds = Math.floor((new Date() - startTime) / 1000);
                var netSeconds = elapsedSeconds - (record.TotalPauseSeconds || 0);
                $("#timerDisplay").text(formatDuration(netSeconds));
                $("#msg1").removeClass("error").addClass("success").text("检测到已暂停的工序，已自动恢复");
            }
        } catch (e) {
            console.log("查询加工编码状态失败:", e);
            $("#msg1").removeClass("success").addClass("error").text("查询异常: " + e.message);
            $("#txtOperationCode").focus();
        }
    }

    function validateOperation() {
        var moldCode = $("#txtMoldCode").val().trim();
        var processCode = $("#txtProcessCode").val().trim();
        var opCode = $("#txtOperationCode").val().trim();

        if (!validateInput("txtMoldCode", moldCode)) {
            $("#msg1").removeClass("success").addClass("error").text("请先扫描模具编码");
            $("#txtMoldCode").focus();
            return;
        }
        if (!validateInput("txtProcessCode", processCode)) {
            $("#msg1").removeClass("success").addClass("error").text("请先扫描加工编码");
            $("#txtProcessCode").focus();
            return;
        }
        if (!validateInput("txtOperationCode", opCode)) {
            $("#msg1").removeClass("success").addClass("error").text("请扫描工序代码");
            return;
        }

        $("#msg1").text("");

        var paramObj = {
            MoldCode: moldCode,
            ProcessCode: processCode,
            OperationCode: opCode
        };

        var ajax = AjaxService.ExecProc("SP_tb_bs_WorkReport_Validate", JSON.stringify(paramObj));

        if (!!ajax.error) {
            var msg = !!ajax.error.Message ? ajax.error.Message : ajax.error;
            $("#msg1").removeClass("success").addClass("error").text(msg);
            $("#txtOperationCode").val("");
            $("#txtOperationCode").focus();
            return;
        }

        var data = JSON.parse(ajax.value);
        if (data.length > 0) {
            var result = data[0];
            if (result.ResultCode !== 0) {
                $("#msg1").removeClass("success").addClass("error").text(result.ResultMsg);
                $("#txtOperationCode").val("");
                $("#txtOperationCode").focus();
                return;
            }
            $("#msg1").removeClass("error").addClass("success").text(result.ResultMsg);
            $("#txtOperationCode").blur();
        }
    }

    $(document).ready(function () {
        init();

        $("#txtMoldCode").keypress(function (e) {
            if (e.which === 13) {
                $("#txtProcessCode").focus();
            }
        });
        $("#txtProcessCode").keypress(function (e) {
            if (e.which === 13) {
                checkProcessStatus();
            }
        });
        $("#txtOperationCode").keypress(function (e) {
            if (e.which === 13) {
                validateOperation();
            }
        });

        setTimeout(function () {
            $("#txtMoldCode").focus();
        }, 500);
    });
</script>
