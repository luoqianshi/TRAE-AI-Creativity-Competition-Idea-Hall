<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown 转 HTML 工具</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #fafaf9;
    --bg-secondary: #f5f5f4;
    --bg-tertiary: #ffffff;
    --text-primary: #1c1917;
    --text-secondary: #57534e;
    --text-muted: #a8a29e;
    --border-color: #e7e5e4;
    --accent: #10b981;
    --accent-hover: #059669;
    --accent-light: #d1fae5;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
    --shadow-lg: 0 10px 40px rgba(0,0,0,0.08);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, Monaco, monospace;
    --font-sans: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  [data-theme="dark"] {
    --bg-primary: #0f172a;
    --bg-secondary: #1e293b;
    --bg-tertiary: #1e293b;
    --text-primary: #f1f5f9;
    --text-secondary: #cbd5e1;
    --text-muted: #64748b;
    --border-color: #334155;
    --accent: #34d399;
    --accent-hover: #10b981;
    --accent-light: rgba(16, 185, 129, 0.15);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
    --shadow-lg: 0 10px 40px rgba(0,0,0,0.5);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: var(--font-sans);
    background: var(--bg-primary);
    color: var(--text-primary);
    transition: background 0.3s ease, color 0.3s ease;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    background: var(--bg-tertiary);
    border-bottom: 1px solid var(--border-color);
    box-shadow: var(--shadow-sm);
    z-index: 10;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--accent), #06b6d4);
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: white;
    font-size: 18px;
    box-shadow: var(--shadow-md);
  }

  .title {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .subtitle {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 1px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .icon-btn {
    width: 38px;
    height: 38px;
    border: 1px solid var(--border-color);
    background: var(--bg-secondary);
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    transition: all 0.2s ease;
    font-size: 16px;
  }

  .icon-btn:hover {
    background: var(--accent-light);
    color: var(--accent);
    border-color: var(--accent);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }

  .icon-btn:active {
    transform: translateY(0);
  }

  /* Main Container */
  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
  }

  /* Editor Panel */
  .panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .panel-header {
    padding: 10px 20px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
  }

  .panel-title {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .panel-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  .panel-actions {
    display: flex;
    gap: 6px;
  }

  .mini-btn {
    padding: 4px 10px;
    font-size: 12px;
    border: 1px solid var(--border-color);
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
  }

  .mini-btn:hover {
    background: var(--accent-light);
    color: var(--accent);
    border-color: var(--accent);
  }

  /* Editor */
  #editor {
    flex: 1;
    width: 100%;
    border: none;
    outline: none;
    resize: none;
    padding: 24px 28px;
    font-family: var(--font-mono);
    font-size: 14px;
    line-height: 1.7;
    background: var(--bg-primary);
    color: var(--text-primary);
    tab-size: 2;
    transition: background 0.3s ease, color 0.3s ease;
  }

  #editor::placeholder {
    color: var(--text-muted);
  }

  /* Divider */
  .divider {
    width: 1px;
    background: var(--border-color);
    cursor: col-resize;
    position: relative;
    z-index: 5;
    transition: background 0.2s ease;
  }

  .divider:hover {
    background: var(--accent);
    width: 3px;
    margin: 0 -1px;
  }

  /* Preview */
  #preview {
    flex: 1;
    padding: 28px 36px;
    overflow-y: auto;
    background: var(--bg-tertiary);
    transition: background 0.3s ease;
  }

  /* Markdown Styles */
  #preview h1,
  #preview h2,
  #preview h3,
  #preview h4,
  #preview h5,
  #preview h6 {
    font-weight: 700;
    line-height: 1.3;
    margin-top: 1.6em;
    margin-bottom: 0.6em;
    color: var(--text-primary);
    letter-spacing: -0.02em;
  }

  #preview h1:first-child,
  #preview h2:first-child,
  #preview h3:first-child {
    margin-top: 0;
  }

  #preview h1 {
    font-size: 2em;
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 0.4em;
  }

  #preview h2 {
    font-size: 1.5em;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 0.3em;
  }

  #preview h3 { font-size: 1.25em; }
  #preview h4 { font-size: 1.1em; }
  #preview h5 { font-size: 1em; }
  #preview h6 { font-size: 0.9em; color: var(--text-secondary); }

  #preview p {
    line-height: 1.8;
    margin-bottom: 1em;
    color: var(--text-primary);
  }

  #preview a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s ease;
  }

  #preview a:hover {
    border-bottom-color: var(--accent);
  }

  #preview strong { font-weight: 700; }
  #preview em { font-style: italic; }
  #preview del { text-decoration: line-through; color: var(--text-muted); }

  #preview ul,
  #preview ol {
    margin-bottom: 1em;
    padding-left: 1.8em;
    line-height: 1.8;
  }

  #preview li { margin-bottom: 0.2em; }

  #preview ul li::marker { color: var(--accent); }

  #preview blockquote {
    border-left: 4px solid var(--accent);
    padding: 0.6em 1.2em;
    margin: 1em 0;
    background: var(--accent-light);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    color: var(--text-secondary);
  }

  #preview blockquote p {
    margin-bottom: 0;
  }

  #preview code {
    font-family: var(--font-mono);
    font-size: 0.88em;
    background: var(--bg-secondary);
    padding: 0.2em 0.5em;
    border-radius: 4px;
    color: var(--accent);
    border: 1px solid var(--border-color);
  }

  #preview pre {
    background: var(--bg-secondary);
    padding: 1.2em 1.4em;
    border-radius: var(--radius-md);
    overflow-x: auto;
    margin: 1em 0;
    border: 1px solid var(--border-color);
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.04);
  }

  #preview pre code {
    background: none;
    border: none;
    padding: 0;
    color: var(--text-primary);
    font-size: 0.88em;
    line-height: 1.6;
  }

  #preview table {
    width: 100%;
    border-collapse: collapse;
    margin: 1em 0;
    font-size: 0.95em;
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }

  #preview th,
  #preview td {
    padding: 10px 14px;
    border: 1px solid var(--border-color);
    text-align: left;
  }

  #preview th {
    background: var(--bg-secondary);
    font-weight: 600;
  }

  #preview tr:nth-child(even) td {
    background: var(--bg-secondary);
    opacity: 0.5;
  }

  #preview hr {
    border: none;
    border-top: 2px solid var(--border-color);
    margin: 2em 0;
    border-radius: 2px;
  }

  #preview img {
    max-width: 100%;
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-md);
    margin: 1em 0;
  }

  /* Task list */
  #preview input[type="checkbox"] {
    margin-right: 8px;
    accent-color: var(--accent);
  }

  /* Status Bar */
  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 24px;
    background: var(--bg-secondary);
    border-top: 1px solid var(--border-color);
    font-size: 12px;
    color: var(--text-muted);
    font-family: var(--font-mono);
  }

  .status-left,
  .status-right {
    display: flex;
    gap: 20px;
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .status-item span { font-variant-numeric: tabular-nums; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text-primary);
    color: var(--bg-primary);
    padding: 10px 20px;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 1000;
    box-shadow: var(--shadow-lg);
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Scrollbar */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }

  ::-webkit-scrollbar-track {
    background: transparent;
  }

  ::-webkit-scrollbar-thumb {
    background: var(--border-color);
    border-radius: 4px;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: var(--text-muted);
  }

  /* Mobile */
  @media (max-width: 768px) {
    .main {
      flex-direction: column;
    }
    .divider {
      width: 100%;
      height: 1px;
      cursor: row-resize;
    }
    .divider:hover {
      width: 100%;
      height: 3px;
      margin: -1px 0;
    }
    .header {
      padding: 12px 16px;
    }
    .title { font-size: 15px; }
    .subtitle { display: none; }
    #editor { padding: 16px; }
    #preview { padding: 20px; }
  }

  /* Animation */
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .main > * {
    animation: fadeInUp 0.4s ease both;
  }

  .panel:nth-child(1) { animation-delay: 0.05s; }
  .divider { animation-delay: 0.1s; }
  .panel:nth-child(3) { animation-delay: 0.15s; }
</style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <div class="logo">M↓</div>
      <div>
        <div class="title">Markdown 转 HTML</div>
        <div class="subtitle">实时预览 · 一键导出</div>
      </div>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="loadSampleBtn" title="加载示例">📝</button>
      <button class="icon-btn" id="copyHtmlBtn" title="复制 HTML">📋</button>
      <button class="icon-btn" id="exportBtn" title="导出文件">💾</button>
      <button class="icon-btn" id="themeToggle" title="切换主题">🌙</button>
    </div>
  </header>

  <div class="main">
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <span class="panel-dot"></span>
          <span>Markdown 编辑器</span>
        </div>
        <div class="panel-actions">
          <button class="mini-btn" id="clearBtn">清空</button>
        </div>
      </div>
      <textarea id="editor" placeholder="在这里输入 Markdown...

# 标题

这是一段普通文本，支持 **粗体**、*斜体*、~~删除线~~。

## 列表

- 项目一
- 项目二
  - 子项目

## 代码

行内代码：`console.log('hello')`

代码块：
```js
function hello() {
  return 'world';
}
```"></textarea>
    </div>

    <div class="divider" id="divider"></div>

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <span class="panel-dot"></span>
          <span>HTML 预览</span>
        </div>
        <div class="panel-actions">
          <button class="mini-btn" id="copyMdBtn">复制 MD</button>
        </div>
      </div>
      <div id="preview"></div>
    </div>
  </div>

  <footer class="status-bar">
    <div class="status-left">
      <div class="status-item">字符: <span id="charCount">0</span></div>
      <div class="status-item">单词: <span id="wordCount">0</span></div>
      <div class="status-item">行数: <span id="lineCount">1</span></div>
    </div>
    <div class="status-right">
      <div class="status-item">Markdown → HTML</div>
    </div>
  </footer>

  <div class="toast" id="toast">已复制到剪贴板</div>

<script>
  const editor = document.getElementById('editor');
  const preview = document.getElementById('preview');
  const themeToggle = document.getElementById('themeToggle');
  const clearBtn = document.getElementById('clearBtn');
  const copyHtmlBtn = document.getElementById('copyHtmlBtn');
  const copyMdBtn = document.getElementById('copyMdBtn');
  const loadSampleBtn = document.getElementById('loadSampleBtn');
  const exportBtn = document.getElementById('exportBtn');
  const toast = document.getElementById('toast');
  const charCount = document.getElementById('charCount');
  const wordCount = document.getElementById('wordCount');
  const lineCount = document.getElementById('lineCount');
  const divider = document.getElementById('divider');

  const SAMPLE_MD = `# Markdown 使用指南

欢迎使用 **Markdown 转 HTML 工具**！这是一个实时预览的转换工具。

## 功能特点

- ✨ 实时预览，所见即所得
- 🎨 明暗双主题切换
- 📋 一键复制 HTML 代码
- 💾 支持导出文件
- 📊 实时字数统计

## 基础语法

### 文本格式

这是 **粗体文本**，这是 *斜体文本*，这是 ~~删除线~~。

### 链接与图片

[访问 GitHub](https://github.com)

### 引用

> 生活就像骑自行车，为了保持平衡，你必须不断前进。
> 
> —— 爱因斯坦

## 代码

行内代码：\`const name = 'Markdown'\`

代码块：

\`\`\`javascript
function markdownToHtml(md) {
  return marked.parse(md);
}

console.log(markdownToHtml('# Hello'));
\`\`\`

## 表格

| 功能 | 描述 | 状态 |
|------|------|------|
| 实时预览 | 输入即时渲染 | ✅ 完成 |
| 主题切换 | 明暗双主题 | ✅ 完成 |
| 导出功能 | 支持 HTML/MD | ✅ 完成 |

## 列表

### 无序列表

- 水果
  - 苹果
  - 香蕉
  - 橙子
- 蔬菜
  - 胡萝卜
  - 西兰花

### 有序列表

1. 第一项
2. 第二项
3. 第三项

### 任务列表

- [x] 完成 Markdown 解析
- [x] 添加主题切换
- [x] 实现复制功能
- [ ] 添加更多功能

---

**开始在左侧编辑器输入你的 Markdown 吧！** 🚀
`;

  marked.setOptions({
    gfm: true,
    breaks: true,
    headerIds: true,
    mangle: false
  });

  function updatePreview() {
    const md = editor.value;
    preview.innerHTML = marked.parse(md);
    updateStats(md);
  }

  function updateStats(text) {
    charCount.textContent = text.length;
    const words = text.trim() ? text.trim().split(/\s+/).length : 0;
    wordCount.textContent = words;
    lineCount.textContent = text.split('\n').length;
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  function initTheme() {
    const saved = localStorage.getItem('md-theme');
    if (saved === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeToggle.textContent = '☀️';
    } else {
      themeToggle.textContent = '🌙';
    }
  }

  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    if (current === 'dark') {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('md-theme', 'light');
      themeToggle.textContent = '🌙';
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('md-theme', 'dark');
      themeToggle.textContent = '☀️';
    }
  });

  clearBtn.addEventListener('click', () => {
    if (editor.value && !confirm('确定要清空编辑器吗？')) return;
    editor.value = '';
    updatePreview();
    editor.focus();
  });

  copyHtmlBtn.addEventListener('click', async () => {
    const html = preview.innerHTML;
    try {
      await navigator.clipboard.writeText(html);
      showToast('HTML 已复制');
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = html;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('HTML 已复制');
    }
  });

  copyMdBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(editor.value);
      showToast('Markdown 已复制');
    } catch (e) {
      showToast('复制失败');
    }
  });

  loadSampleBtn.addEventListener('click', () => {
    editor.value = SAMPLE_MD;
    updatePreview();
  });

  exportBtn.addEventListener('click', () => {
    const htmlContent = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 800px; margin: 0 auto; padding: 40px 20px; line-height: 1.8; color: #1c1917; }
  h1,h2,h3,h4,h5,h6 { font-weight: 700; line-height: 1.3; margin-top: 1.5em; margin-bottom: 0.5em; }
  h1 { font-size: 2em; border-bottom: 2px solid #e7e5e4; padding-bottom: 0.3em; }
  h2 { font-size: 1.5em; border-bottom: 1px solid #e7e5e4; padding-bottom: 0.3em; }
  p { margin-bottom: 1em; }
  a { color: #10b981; text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { font-family: 'JetBrains Mono', Consolas, monospace; background: #f5f5f4; padding: 0.2em 0.5em; border-radius: 4px; font-size: 0.9em; color: #059669; }
  pre { background: #f5f5f4; padding: 1.2em; border-radius: 8px; overflow-x: auto; }
  pre code { background: none; padding: 0; color: inherit; }
  blockquote { border-left: 4px solid #10b981; padding: 0.5em 1em; margin: 1em 0; background: #d1fae5; border-radius: 0 6px 6px 0; color: #57534e; }
  blockquote p { margin: 0; }
  table { width: 100%; border-collapse: collapse; margin: 1em 0; }
  th, td { padding: 10px 14px; border: 1px solid #e7e5e4; text-align: left; }
  th { background: #f5f5f4; font-weight: 600; }
  img { max-width: 100%; border-radius: 8px; }
  hr { border: none; border-top: 2px solid #e7e5e4; margin: 2em 0; }
  ul, ol { padding-left: 1.8em; line-height: 1.8; margin-bottom: 1em; }
</style>
</head>
<body>
${preview.innerHTML}
</body>
</html>`;

    const blob = new Blob([htmlContent], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'document.html';
    a.click();
    URL.revokeObjectURL(url);
    showToast('HTML 文件已导出');
  });

  editor.addEventListener('input', updatePreview);

  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
      editor.selectionStart = editor.selectionEnd = start + 2;
      updatePreview();
    }
  });

  let isDragging = false;
  divider.addEventListener('mousedown', (e) => {
    isDragging = true;
    document.body.style.cursor = 'col-resize';
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const main = document.querySelector('.main');
    const rect = main.getBoundingClientRect();
    const leftPanel = document.querySelector('.panel:first-child');
    const rightPanel = document.querySelector('.panel:last-child');
    const leftWidth = e.clientX - rect.left;
    const rightWidth = rect.width - leftWidth - 1;
    if (leftWidth > 200 && rightWidth > 200) {
      leftPanel.style.flex = `0 0 ${leftWidth}px`;
      rightPanel.style.flex = `1`;
    }
  });

  document.addEventListener('mouseup', () => {
    isDragging = false;
    document.body.style.cursor = '';
  });

  initTheme();
  editor.value = SAMPLE_MD;
  updatePreview();
</script>
</body>
</html>
