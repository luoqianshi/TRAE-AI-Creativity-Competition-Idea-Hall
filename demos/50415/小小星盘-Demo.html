  <script>
    // ===== Data =====
    let profiles = [
      { id: 1, name: '我', birth: '2000-03-21', place: '上海市' },
      { id: 2, name: '小星', birth: '1998-07-15', place: '北京市' }
    ];
    let selectedId = 1;
    let editId = null;
    let currentUser = null;

    // ===== Planets config =====
    const planets = ['☉','☽','☿','♀','♂','♃','♄','♅','♆','♇'];
    const planetNames = ['太阳','月亮','水星','金星','火星','木星','土星','天王星','海王星','冥王星'];
    const signs = ['白羊','金牛','双子','巨蟹','狮子','处女','天秤','天蝎','射手','摩羯','水瓶','双鱼'];

    function getProfile(id) { return profiles.find(p => p.id === id); }

    // ===== Seeded random =====
    function seededRandom(seed) {
      let s = 0;
      for (let i = 0; i < seed.length; i++) s = ((s << 5) - s) + seed.charCodeAt(i);
      return function() { s = (s * 16807 + 0) % 2147483647; return (s & 0x7fffffff) / 0x7fffffff; };
    }

    function getPlanetPositions(profile) {
      const rng = seededRandom(profile.birth + profile.place);
      return planets.map((_, i) => ({ sign: Math.floor(rng() * 12), deg: Math.floor(rng() * 30), house: Math.floor(rng() * 12) + 1 }));
    }

    // ===== Render Profile List =====
    function renderList() {
      const list = document.getElementById('profileList');
      list.innerHTML = profiles.map(p => `
        <div class="profile-item ${p.id === selectedId ? 'active' : ''}" onclick="selectProfile(${p.id})">
          <div class="profile-name">${p.name}</div>
          <div class="profile-meta">${p.birth} · ${p.place}</div>
          <div class="profile-actions">
            <button class="btn-icon" onclick="event.stopPropagation();openModal('edit',${p.id})">✎</button>
            <button class="btn-icon delete" onclick="event.stopPropagation();deleteProfile(${p.id})">✕</button>
          </div>
        </div>
      `).join('');
    }

    function selectProfile(id) {
      selectedId = id;
      const p = getProfile(id);
      document.getElementById('topbarTitle').textContent = `${p.name} 的星盘`;
      renderList();
      renderChart();
      renderInterpretations();
    }

    // ===== Draw Star Chart SVG =====
    function renderChart() {
      const p = getProfile(selectedId);
      if (!p) return;
      const positions = getPlanetPositions(p);
      const svg = document.getElementById('chartSvg');
      const cx = 210, cy = 210, r1 = 80, r2 = 140, r3 = 180;

      let html = `
        <defs>
          <radialGradient id="bgGrad"><stop offset="0%" stop-color="#1a1a3a"/><stop offset="100%" stop-color="#0a0a1a"/></radialGradient>
        </defs>
        <circle cx="${cx}" cy="${cy}" r="${r3+10}" fill="url(#bgGrad)" stroke="#2a2a4a" stroke-width="1"/>
        <circle cx="${cx}" cy="${cy}" r="${r3}" fill="none" stroke="#3a3a5a" stroke-width="1.5"/>
        <circle cx="${cx}" cy="${cy}" r="${r2}" fill="none" stroke="#3a3a5a" stroke-width="1"/>
        <circle cx="${cx}" cy="${cy}" r="${r1}" fill="none" stroke="#3a3a5a" stroke-width="1" stroke-dasharray="4,4"/>`;

      // House lines
      for (let i = 0; i < 12; i++) {
        const a1 = (i * 30 - 90) * Math.PI / 180;
        html += `<line x1="${cx + r2*Math.cos(a1)}" y1="${cy + r2*Math.sin(a1)}" x2="${cx + r3*Math.cos(a1)}" y2="${cy + r3*Math.sin(a1)}" stroke="#2a2a4a" stroke-width="0.8"/>`;
      }

      // Sign glyphs on outer ring
      const signGlyphs = ['♈','♉','♊','♋','♌','♍','♎','♏','♐','♑','♒','♓'];
      for (let i = 0; i < 12; i++) {
        const a = (i * 30 - 90) * Math.PI / 180;
        const x = cx + (r3 - 12) * Math.cos(a);
        const y = cy + (r3 - 12) * Math.sin(a);
        html += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" fill="#8888aa" font-size="13">${signGlyphs[i]}</text>`;
      }

      // House numbers
      for (let i = 0; i < 12; i++) {
        const a = ((i * 30 + 15) - 90) * Math.PI / 180;
        const x = cx + (r2 + 10) * Math.cos(a);
        const y = cy + (r2 + 10) * Math.sin(a);
        html += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" fill="#555577" font-size="10">${i+1}</text>`;
      }

      // Aspect lines
      for (let i = 0; i < Math.min(positions.length, 5); i++) {
        for (let j = i+1; j < Math.min(positions.length, 5); j++) {
          if (Math.abs(positions[i].sign - positions[j].sign) % 6 === 0 ||
              Math.abs(positions[i].sign - positions[j].sign) % 4 === 0 ||
              Math.abs(positions[i].sign - positions[j].sign) % 3 === 0) {
            const a1 = ((positions[i].sign * 30 + positions[i].deg) - 90) * Math.PI / 180;
            const a2 = ((positions[j].sign * 30 + positions[j].deg) - 90) * Math.PI / 180;
            const pr = (r1 + r2) / 2;
            const clr = Math.abs(positions[i].sign - positions[j].sign) % 6 === 0 ? '#e94560' :
                        Math.abs(positions[i].sign - positions[j].sign) % 4 === 0 ? '#f0a500' : '#8b5cf6';
            html += `<line x1="${cx+pr*Math.cos(a1)}" y1="${cy+pr*Math.sin(a1)}" x2="${cx+pr*Math.cos(a2)}" y2="${cy+pr*Math.sin(a2)}" stroke="${clr}" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6"/>`;
          }
        }
      }

      // Planets
      const planetColors = ['#f0a500','#c8c8ff','#a0d0ff','#ffb0c0','#ff6655','#f0a060','#d0c090','#60e0e0','#4070ff','#a050c0'];
      positions.forEach((pos, i) => {
        if (i >= 5 && i < positions.length) return; // outer planets inside for clarity
        const a = ((pos.sign * 30 + pos.deg) - 90) * Math.PI / 180;
        const pr = (r1 + r2) / 2;
        const x = cx + pr * Math.cos(a);
        const y = cy + pr * Math.sin(a);
        html += `<circle cx="${x}" cy="${y}" r="12" fill="${planetColors[i]}33" stroke="${planetColors[i]}" stroke-width="1.2"/>`;
        html += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" fill="${planetColors[i]}" font-size="14">${planets[i]}</text>`;
      });

      // Inner planets (mercury to mars) slightly inner
      for (let i = 2; i < Math.min(5, positions.length); i++) {
        const pos = positions[i];
        const a = ((pos.sign * 30 + pos.deg) - 90) * Math.PI / 180;
        const pr = (r1 * 0.5 + r2 * 0.5) / 2 + (i-2)*15;
        const x = cx + pr * Math.cos(a);
        const y = cy + pr * Math.sin(a);
        html += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" fill="${planetColors[i]}" font-size="12">${planets[i]}</text>`;
      }

      // Sun & Moon center
      const sunA = ((positions[0].sign * 30 + positions[0].deg) - 90) * Math.PI / 180;
      const moonA = ((positions[1].sign * 30 + positions[1].deg) - 90) * Math.PI / 180;
      const spr = r1 * 0.65;
      html += `<text x="${cx+spr*Math.cos(sunA)}" y="${cy+spr*Math.sin(sunA)}" text-anchor="middle" dominant-baseline="central" fill="#f0a500" font-size="18" font-weight="bold">☉</text>`;
      html += `<text x="${cx+(spr-20)*Math.cos(moonA)}" y="${cy+(spr-20)*Math.sin(moonA)}" text-anchor="middle" dominant-baseline="central" fill="#c8c8ff" font-size="15">☽</text>`;

      // Person name label
      html += `<text x="${cx}" y="${cy+r3+6}" text-anchor="middle" fill="#8888aa" font-size="12">${p.name} · ${p.birth} · ${p.place}</text>`;

      svg.innerHTML = html;
    }

    // ===== Interpretations =====
    function renderInterpretations() {
      const p = getProfile(selectedId);
      if (!p) return;
      const positions = getPlanetPositions(p);
      const area = document.getElementById('interpArea');

      const interpData = [
        { icon: '☉', cls: 'sun', title: `太阳落在${signs[positions[0].sign]}座`, sub: `第${positions[0].house}宫`,
          body: `太阳是星盘中最重要的星体，代表你的核心自我与生命力。太阳落在${signs[positions[0].sign]}座的人，通常具有${signs[positions[0].sign]}座的特质——${getSunDesc(positions[0].sign)}。太阳落入第${positions[0].house}宫，意味着这些特质在你生活的${getHouseDesc(positions[0].house)}领域中尤为突出，是你展现自我、获得成就的关键领域。` },
        { icon: '☽', cls: 'moon', title: `月亮落在${signs[positions[1].sign]}座`, sub: `第${positions[1].house}宫`,
          body: `月亮代表你的情感需求、内心世界和潜意识反应模式。月亮落在${signs[positions[1].sign]}座，说明你在情感上${getMoonDesc(positions[1].sign)}。月亮落入第${positions[1].house}宫，表明你的情感安全感与${getHouseDesc(positions[1].house)}密切相关。` },
        { icon: '1', cls: 'house1', title: `第一宫（上升星座）：${signs[positions[0].house > 6 ? 0 : 6]}座`, sub: '自我与外在形象',
          body: `第一宫也称为上升宫，代表你给外界的第一印象以及你面对世界的方式。你的上升星座为${signs[positions[0].house > 6 ? 0 : 6]}座，这意味着你在别人眼中是一个${getRisingDesc(positions[0].house > 6 ? 0 : 6)}的人。上升星座如同你的"面具"，它影响着你的外貌气质、行为举止和社交风格。` },
        { icon: '♀', cls: 'venus', title: `金星落在${signs[positions[3].sign]}座`, sub: `第${positions[3].house}宫`,
          body: `金星掌管爱情、审美和价值观。金星落在${signs[positions[3].sign]}座的人，在感情中${getVenusDesc(positions[3].sign)}。金星落入第${positions[3].house}宫，暗示你的爱情运势和审美偏好与${getHouseDesc(positions[3].house)}息息相关。` },
        { icon: '♂', cls: 'mars', title: `火星落在${signs[positions[4].sign]}座`, sub: `第${positions[4].house}宫`,
          body: `火星代表行动力、欲望和竞争意识。火星落在${signs[positions[4].sign]}座，说明你在行动时${getMarsDesc(positions[4].sign)}。火星落入第${positions[4].house}宫，表明你的精力与斗志主要集中在${getHouseDesc(positions[4].house)}方面。` },
      ];

      area.innerHTML = interpData.map((d, i) => `
        <div class="interp-card" onclick="this.classList.toggle('expanded')">
          <div class="interp-header">
            <div class="interp-icon ${d.cls}">${d.icon}</div>
            <div>
              <div class="interp-title">${d.title}</div>
              <div class="interp-subtitle">${d.sub}</div>
            </div>
            <span class="interp-arrow">▶</span>
          </div>
          <div class="interp-body">${d.body}</div>
        </div>
      `).join('');
    }

    // ===== Description generators =====
    function getSunDesc(s) {
      return ['热情冲动、勇于开拓','踏实稳重、追求安全感','聪明灵活、善于沟通','敏感细腻、重视家庭','自信大方、渴望被认可','严谨务实、追求完美','优雅和谐、注重关系','深沉专注、洞察力强','乐观开朗、追求自由','沉稳踏实、目标明确','独立创新、崇尚自由','温柔浪漫、富有同理心'][s];
    }
    function getMoonDesc(s) {
      return ['情绪直接、需要独立空间','渴望稳定、容易囤积安全感','需要交流、思绪活跃','非常敏感、重视情感纽带','热情慷慨、需要被关注','容易焦虑、追求细节完美','需要和谐、厌恶冲突','情感浓烈、占有欲强','乐观豁达、不爱记仇','内敛隐忍、害怕失控','疏离理性、需要精神空间','共情力强、容易受伤'][s];
    }
    function getHouseDesc(h) {
      return ['自我形象与个人发展','财务与物质资源','学习沟通与短途旅行','家庭与原生环境','创造力与恋爱子女','健康与日常工作','伴侣与合作关系','深层转化与共享资源','远行与高等学习','事业与社会地位','社群与理想愿景','隐秘与灵性成长'][h-1];
    }
    function getRisingDesc(s) {
      return ['自信、直接、充满活力','温和、稳重、给人可靠感','机灵、善变、反应迅速','柔和、亲切、给人温暖感','大方、热情、有领导力','谦逊、细致、看起来干净利落','优雅、得体、给人和谐感','神秘、冷静、气场强大','开朗、随意、看起来很好相处','成熟、严肃、给人专业感','独特、前卫、与众不同','温柔、梦幻、给人文艺感'][s];
    }
    function getVenusDesc(s) {
      return ['热情直接、喜欢追求的快感','注重感官享受、喜欢浪漫氛围','需要精神交流、喜欢有趣的伴侣','深情专一、非常重视家庭温暖','慷慨大方、喜欢被崇拜的感觉','细心体贴、通过服务表达爱','追求平衡、注重外在美感','激情强烈、喜欢深度纠缠','轻松愉快、不爱被束缚','务实谨慎、看重对方条件','注重友谊基础、精神契合重要','浪漫多情、富有牺牲精神'][s];
    }
    function getMarsDesc(s) {
      return ['雷厉风行、喜欢冲锋在前','稳扎稳打、不急于求成','灵活多变、擅长辩论','情绪化、行动受心情驱动','直接霸气、习惯主导局面','注重效率、做事有条理','犹豫不决、容易权衡太久','坚定果断、一旦决定不回头','行动迅速但三分钟热度','有耐心、能打持久战','出其不意、不走寻常路','跟着感觉走、行动力受灵感驱动'][s];
    }

    // ===== Modal =====
    function openModal(type, id) {
      document.getElementById('userDropdown').classList.remove('show');
      if (type === 'add') {
        editId = null;
        document.getElementById('profileModalTitle').textContent = '添加星盘档案';
        document.getElementById('pName').value = '';
        document.getElementById('pBirth').value = '';
        document.getElementById('pPlace').value = '';
        document.getElementById('profileModal').classList.add('show');
      } else if (type === 'edit' && id) {
        editId = id;
        const p = getProfile(id);
        document.getElementById('profileModalTitle').textContent = '编辑档案';
        document.getElementById('pName').value = p.name;
        document.getElementById('pBirth').value = p.birth;
        document.getElementById('pPlace').value = p.place;
        document.getElementById('profileModal').classList.add('show');
      } else if (type === 'login') {
        document.getElementById('loginName').value = '';
        document.getElementById('loginPwd').value = '';
        document.getElementById('loginModal').classList.add('show');
      } else if (type === 'editProfile') {
        document.getElementById('editName').value = currentUser?.name || '';
        document.getElementById('editBio').value = currentUser?.bio || '';
        document.getElementById('profileEditModal').classList.add('show');
      }
    }
    function closeModal(type) {
      if (type === 'profile' || type === 'edit') document.getElementById('profileModal').classList.remove('show');
      else if (type === 'login') document.getElementById('loginModal').classList.remove('show');
      else if (type === 'editProfile') document.getElementById('profileEditModal').classList.remove('show');
    }

    function saveProfile() {
      const name = document.getElementById('pName').value.trim();
      const birth = document.getElementById('pBirth').value;
      const place = document.getElementById('pPlace').value.trim();
      if (!name || !birth || !place) return alert('请填写完整信息');
      if (editId) {
        const p = getProfile(editId);
        p.name = name; p.birth = birth; p.place = place;
      } else {
        profiles.push({ id: Date.now(), name, birth, place });
      }
      closeModal('profile');
      if (!editId) selectedId = profiles[profiles.length-1].id;
      renderList();
      selectProfile(selectedId);
    }

    function deleteProfile(id) {
      if (!confirm('确定删除该档案吗？')) return;
      profiles = profiles.filter(p => p.id !== id);
      if (selectedId === id && profiles.length > 0) selectedId = profiles[0].id;
      renderList();
      selectProfile(selectedId);
    }

    // ===== Login =====
    function doLogin() {
      const name = document.getElementById('loginName').value.trim();
      if (!name) return alert('请输入用户名');
      currentUser = { name, bio: '这个人很懒，什么都没写~' };
      document.getElementById('loginArea').style.display = 'none';
      document.getElementById('userArea').style.display = 'flex';
      document.getElementById('dispName').textContent = name;
      closeModal('login');
      addAiMsg(`欢迎回来，${name}！有什么想聊的吗？✨`);
    }
    function logout() {
      currentUser = null;
      document.getElementById('loginArea').style.display = 'block';
      document.getElementById('userArea').style.display = 'none';
      document.getElementById('userDropdown').classList.remove('show');
    }
    function toggleDropdown() {
      document.getElementById('userDropdown').classList.toggle('show');
    }
    function saveUserProfile() {
      currentUser.name = document.getElementById('editName').value.trim() || currentUser.name;
      currentUser.bio = document.getElementById('editBio').value.trim() || currentUser.bio;
      document.getElementById('dispName').textContent = currentUser.name;
      document.getElementById('dispBio').textContent = currentUser.bio;
      closeModal('editProfile');
    }
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.user-avatar') && !e.target.closest('.user-dropdown')) {
        document.getElementById('userDropdown').classList.remove('show');
      }
    });

    // ===== Chat =====
    const aiResponses = [
      '根据你当前的星盘配置，我看到你近期可能会在事业方面遇到一些转折点，但别担心，你的守护星正处在一个有利的位置，相信自己的直觉就好 ✨',
      '你的月亮星座暗示你内心其实非常敏感细腻，有时候焦虑并不是因为真的有什么问题，而是你太在意结果了。试着放松一下，不是所有事都需要完美的答案。',
      '从星盘来看，你最近的人际关系可能会有些小波动，但这其实是成长的信号。沟通是你的强项，相信你能处理好 💫',
      '我注意到你的金星位置暗示你在感情中非常重视真诚和深度。如果你现在有困惑，可能是因为对方还没有完全展现真实的一面，给彼此一些时间。',
      '星盘中的火星能量提醒你，最近不要做太冲动的决定。深呼吸，给自己三天时间再回头看这个问题，答案会更清晰。',
      '你的上升星座说明你给人的第一印象是独立而坚强的，但月亮的位置告诉我，你内心深处其实很渴望被理解和被温柔以待。',
      '根据行运星盘，接下来两周适合做规划和内省，还不急着行动。把焦虑写下来，你会发现大部分担忧其实并不会发生。',
      '你的第十宫有很强的能量，这意味着事业对你来说非常重要。当前的星象提示，暂时放下过度思考，专注于当下能做的一件小事就好。',
    ];
    let aiIdx = 0;

    function sendMsg() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      addMsg(text, 'user');
      setTimeout(() => {
        addAiMsg(aiResponses[aiIdx % aiResponses.length]);
        aiIdx++;
      }, 600 + Math.random() * 800);
    }

    function addMsg(text, type) {
      const box = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.textContent = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }
    function addAiMsg(text) { addMsg(text, 'ai'); }

    // ===== Download =====
    function downloadChart() {
      const svg = document.getElementById('chartSvg');
      const svgData = new XMLSerializer().serializeToString(svg);
      const blob = new Blob([svgData], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const p = getProfile(selectedId);
      a.download = `${p ? p.name : '星盘'}.svg`;
      a.href = url;
      a.click();
      URL.revokeObjectURL(url);
    }

    // ===== Init =====
    renderList();
    selectProfile(selectedId);
  </script>
</body>
</html>
