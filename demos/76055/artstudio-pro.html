<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ArtStudio Pro - 绘画软件</title>
<style>
/* ============================================
   CSS Variables & Theme
   ============================================ */
:root {
  --surface: #1a1a2e;
  --surface-alt: #16213e;
  --surface-muted: #262640;
  --surface-card: #1e1e36;
  --text: #e8e8f0;
  --text-muted: #9090a8;
  --border: rgba(200, 200, 220, 0.1);
  --brand: #6c5ce7;
  --brand-hover: #7c6df7;
  --brand-soft: rgba(108, 92, 231, 0.15);
  --accent: #00cec9;
  --accent-hover: #00e5e0;
  --danger: #e74c3c;
  --success: #2ecc71;
  --warning: #f39c12;
  --radius: 8px;
  --radius-card: 12px;
  --font-sans: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
  --toolbar-w: 56px;
  --panel-w: 220px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-sans);
  background: var(--surface);
  color: var(--text);
  overflow: hidden;
  height: 100vh;
  user-select: none;
  -webkit-user-select: none;
}

/* ============================================
   App Layout
   ============================================ */
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* ---- Top Bar ---- */
.topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: var(--surface-alt);
  border-bottom: 1px solid var(--border);
  height: 44px;
  flex-shrink: 0;
}
.topbar .logo {
  font-size: 16px;
  font-weight: 600;
  color: var(--brand);
  letter-spacing: 0.5px;
  margin-right: 12px;
  white-space: nowrap;
}
.topbar .logo span { color: var(--accent); }
.topbar-sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; flex-shrink: 0; }
.topbar .btn-group { display: flex; gap: 2px; }
.topbar button {
  background: transparent;
  border: none;
  color: var(--text-muted);
  padding: 5px 10px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 13px;
  font-family: var(--font-sans);
  transition: all 0.15s;
  white-space: nowrap;
}
.topbar button:hover { background: var(--surface-muted); color: var(--text); }
.topbar button:active { transform: scale(0.95); }
.topbar .brand-btn {
  background: var(--brand);
  color: #fff;
}
.topbar .brand-btn:hover { background: var(--brand-hover); }
.topbar .danger-btn:hover { background: rgba(231,76,60,0.2); color: var(--danger); }

/* ---- Main Area ---- */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ---- Left Toolbar ---- */
.toolbar {
  width: var(--toolbar-w);
  background: var(--surface-alt);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 6px 4px;
  gap: 2px;
  flex-shrink: 0;
  overflow-y: auto;
}
.toolbar .tool-btn {
  width: 48px;
  height: 48px;
  border: 2px solid transparent;
  background: transparent;
  border-radius: var(--radius);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  transition: all 0.15s;
  position: relative;
}
.toolbar .tool-btn:hover { background: var(--surface-muted); color: var(--text); }
.toolbar .tool-btn.active {
  border-color: var(--brand);
  background: var(--brand-soft);
  color: var(--brand);
}
.toolbar .tool-btn svg { width: 22px; height: 22px; }
.toolbar .tool-sep { height: 1px; background: var(--border); margin: 4px 8px; flex-shrink: 0; }
.toolbar .tool-label {
  position: absolute;
  left: 56px;
  top: 50%;
  transform: translateY(-50%);
  background: var(--surface-card);
  color: var(--text);
  padding: 3px 8px;
  border-radius: var(--radius);
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
  z-index: 100;
  box-shadow: var(--shadow);
}
.toolbar .tool-btn:hover .tool-label { opacity: 1; }

/* ---- Canvas Area ---- */
.canvas-area {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: #0d0d1a;
}
.canvas-area .canvas-wrap {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(1);
  transform-origin: center center;
  transition: none;
  box-shadow: 0 4px 40px rgba(0,0,0,0.5);
}
.canvas-area canvas {
  display: block;
  background: #ffffff;
  cursor: crosshair;
}
.canvas-area .grid-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
}
.canvas-area .grid-overlay.visible { opacity: 0.06; }
.canvas-area .zoom-indicator {
  position: absolute;
  bottom: 12px;
  right: 12px;
  background: var(--surface-card);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: var(--radius);
  font-size: 12px;
  color: var(--text-muted);
  pointer-events: none;
}
.canvas-area .coord-indicator {
  position: absolute;
  bottom: 12px;
  left: 12px;
  background: var(--surface-card);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: var(--radius);
  font-size: 12px;
  color: var(--text-muted);
  pointer-events: none;
  font-variant-numeric: tabular-nums;
}

/* ---- Right Panel ---- */
.panel {
  width: var(--panel-w);
  background: var(--surface-alt);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
}
.panel-section {
  padding: 12px;
  border-bottom: 1px solid var(--border);
}
.panel-section:last-child { border-bottom: none; }
.panel-section .section-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
  letter-spacing: 0.8px;
}

/* Color */
.color-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.color-swatch {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 2px solid var(--border);
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.15s;
}
.color-swatch:hover { transform: scale(1.1); }
.color-swatch.primary { border-color: var(--brand); }
.color-input-wrap { flex: 1; }
.color-input-wrap input[type="color"] {
  width: 100%;
  height: 36px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-muted);
  cursor: pointer;
  padding: 2px;
}
.color-palette {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 4px;
}
.color-palette .palette-swatch {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 4px;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: transform 0.1s;
}
.color-palette .palette-swatch:hover { transform: scale(1.2); z-index: 1; }

/* Slider */
.slider-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.slider-row label {
  font-size: 12px;
  color: var(--text-muted);
  flex-shrink: 0;
  width: 40px;
}
.slider-row input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  background: var(--surface-muted);
  border-radius: 2px;
  outline: none;
}
.slider-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--brand);
  cursor: pointer;
  border: 2px solid var(--surface-alt);
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}
.slider-row .slider-value {
  font-size: 12px;
  color: var(--text);
  width: 32px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* Buttons in panel */
.panel-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  padding: 6px 10px;
  background: var(--surface-muted);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 12px;
  font-family: var(--font-sans);
  cursor: pointer;
  transition: all 0.15s;
  margin-bottom: 4px;
}
.panel-btn:hover { background: var(--brand-soft); border-color: var(--brand); }
.panel-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

/* Layer list */
.layer-list { display: flex; flex-direction: column; gap: 4px; max-height: 180px; overflow-y: auto; }
.layer-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px;
  background: var(--surface-muted);
  border: 1px solid transparent;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.12s;
  font-size: 12px;
}
.layer-item:hover { border-color: var(--border); }
.layer-item.active { border-color: var(--brand); background: var(--brand-soft); }
.layer-item .layer-vis { cursor: pointer; opacity: 0.5; transition: opacity 0.15s; }
.layer-item .layer-vis:hover { opacity: 1; }
.layer-item .layer-vis.hidden { opacity: 0.2; }
.layer-item .layer-thumb {
  width: 32px; height: 32px;
  border-radius: 4px;
  background: #fff;
  border: 1px solid var(--border);
  flex-shrink: 0;
  overflow: hidden;
}
.layer-item .layer-thumb canvas { width: 100%; height: 100%; }
.layer-item .layer-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Shape options */
.shape-options { display: none; }
.shape-options.visible { display: block; }
.radio-group { display: flex; gap: 4px; }
.radio-group label {
  flex: 1;
  text-align: center;
  padding: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 11px;
  cursor: pointer;
  transition: all 0.12s;
}
.radio-group input { display: none; }
.radio-group input:checked + label { background: var(--brand); border-color: var(--brand); color: #fff; }

/* Mode indicator */
.mode-indicator {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 2px 8px;
  background: var(--surface-muted);
  border-radius: var(--radius);
  font-size: 12px;
  color: var(--text-muted);
}
.mode-indicator kbd {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 0 5px;
  border-radius: 3px;
  font-size: 11px;
  font-family: var(--font-sans);
}

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-muted); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* Responsive */
@media (max-width: 800px) {
  .panel { display: none; }
  :root { --toolbar-w: 48px; }
  .toolbar .tool-btn { width: 40px; height: 40px; }
  .toolbar .tool-btn svg { width: 18px; height: 18px; }
}

/* Tooltip for topbar buttons */
[data-tip] { position: relative; }
[data-tip]::after {
  content: attr(data-tip);
  position: absolute;
  bottom: -28px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface-card);
  color: var(--text);
  padding: 3px 8px;
  border-radius: var(--radius);
  font-size: 11px;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
  box-shadow: var(--shadow);
  z-index: 200;
}
[data-tip]:hover::after { opacity: 1; }
</style>
</head>
<body>

<div class="app">
  <!-- Top Bar -->
  <header class="topbar">
    <div class="logo">Art<span>Studio</span> Pro</div>
    <div class="topbar-sep"></div>
    <div class="btn-group">
      <button data-tip="新建" onclick="app.newProject()">
        <svg viewBox="0 0 16 16" fill="currentColor" width="14" height="14"><rect x="2" y="2" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="8" y1="5" x2="8" y2="11" stroke="currentColor" stroke-width="1.5"/><line x1="5" y1="8" x2="11" y2="8" stroke="currentColor" stroke-width="1.5"/></svg>
        新建
      </button>
      <button data-tip="撤销 Ctrl+Z" onclick="app.undo()">
        <svg viewBox="0 0 16 16" fill="currentColor" width="14" height="14"><polyline points="4,8 1,5 4,2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3 5h8a3 3 0 0 1 3 3v3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        撤销
      </button>
      <button data-tip="重做 Ctrl+Shift+Z" onclick="app.redo()">
        <svg viewBox="0 0 16 16" fill="currentColor" width="14" height="14"><polyline points="12,8 15,5 12,2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M13 5H5a3 3 0 0 0-3 3v3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        重做
      </button>
    </div>
    <div class="topbar-sep"></div>
    <div class="btn-group">
      <button data-tip="保存为 PNG" class="brand-btn" onclick="app.savePNG()">
        <svg viewBox="0 0 16 16" fill="currentColor" width="14" height="14"><path d="M11 2H3a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V5l-3-3z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M11 2v3h3" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="10" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="6" y1="2" x2="6" y2="4" stroke="currentColor" stroke-width="1.5"/></svg>
        导出
      </button>
      <button data-tip="清空画布" class="danger-btn" onclick="app.clearCanvas()">
        <svg viewBox="0 0 16 16" fill="currentColor" width="14" height="14"><polyline points="3,3 13,3 11,14 5,14 3,3" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="6" y1="3" x2="6" y2="2" stroke="currentColor" stroke-width="1.5"/><line x1="10" y1="3" x2="10" y2="2" stroke="currentColor" stroke-width="1.5"/></svg>
        清空
      </button>
    </div>
    <div class="topbar-sep"></div>
    <div class="mode-indicator" id="modeIndicator">
      画笔 · <kbd>B</kbd> 切换
    </div>
    <div style="flex:1"></div>
    <button data-tip="切换网格" onclick="app.toggleGrid()" style="background:transparent;border:none;color:var(--text-muted);cursor:pointer;padding:4px 8px;border-radius:var(--radius);font-size:13px">
      <svg viewBox="0 0 16 16" fill="currentColor" width="14" height="14"><rect x="1" y="1" width="14" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1"/><line x1="5.5" y1="1" x2="5.5" y2="15" stroke="currentColor" stroke-width="0.5"/><line x1="10.5" y1="1" x2="10.5" y2="15" stroke="currentColor" stroke-width="0.5"/><line x1="1" y1="5.5" x2="15" y2="5.5" stroke="currentColor" stroke-width="0.5"/><line x1="1" y1="10.5" x2="15" y2="10.5" stroke="currentColor" stroke-width="0.5"/></svg>
    </button>
  </header>

  <!-- Main Area -->
  <div class="main">
    <!-- Left Toolbar -->
    <nav class="toolbar" id="toolbar">
      <button class="tool-btn active" data-tool="pencil" title="铅笔">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
        <span class="tool-label">铅笔 (P)</span>
      </button>
      <button class="tool-btn" data-tool="brush" title="画笔">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16a6 6 0 0 1 10-4.5"/><path d="M14 10a3 3 0 0 1 4 4"/><path d="M19 14a3 3 0 0 1 1 5"/><path d="M21 20a2 2 0 0 1-2 2H5"/><path d="M10 18 2 20"/></svg>
        <span class="tool-label">画笔 (B)</span>
      </button>
      <button class="tool-btn" data-tool="eraser" title="橡皮擦">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H7L3 16c-1-1-1-2 0-3l9-9c1-1 2-1 3 0l7 7c1 1 1 2 0 3Z"/><path d="M6.5 13.5 11 18"/></svg>
        <span class="tool-label">橡皮擦 (E)</span>
      </button>
      <div class="tool-sep"></div>
      <button class="tool-btn" data-tool="fill" title="填充">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="M3.5 14.5 12 6l2 2"/><path d="m17 10-5-5"/><path d="m14 11-2-2"/><path d="M11 14 6.5 9.5"/><path d="M16 12c3 0 5 2 5 5s-2 5-5 5-5-2-5-5 2-5 5-5Z"/></svg>
        <span class="tool-label">填充 (G)</span>
      </button>
      <div class="tool-sep"></div>
      <button class="tool-btn" data-tool="line" title="直线">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/></svg>
        <span class="tool-label">直线 (L)</span>
      </button>
      <button class="tool-btn" data-tool="rect" title="矩形">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
        <span class="tool-label">矩形 (R)</span>
      </button>
      <button class="tool-btn" data-tool="circle" title="椭圆">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>
        <span class="tool-label">椭圆 (O)</span>
      </button>
      <div class="tool-sep"></div>
      <button class="tool-btn" data-tool="eyedropper" title="取色器">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 22 11 13"/><path d="M14 6 18 2 22 6 18 10Z"/><path d="M18 2 9 11"/></svg>
        <span class="tool-label">取色器 (I)</span>
      </button>
    </nav>

    <!-- Canvas Area -->
    <div class="canvas-area" id="canvasArea">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="mainCanvas" width="900" height="600"></canvas>
      </div>
      <div class="coord-indicator" id="coordDisplay">X: 0  Y: 0</div>
      <div class="zoom-indicator" id="zoomDisplay">100%</div>
    </div>

    <!-- Right Panel -->
    <div class="panel" id="rightPanel">
      <!-- Color -->
      <div class="panel-section">
        <div class="section-title">颜色</div>
        <div class="color-row">
          <div class="color-swatch primary" id="colorSwatch" style="background:#6c5ce7"></div>
          <div class="color-input-wrap">
            <input type="color" id="colorPicker" value="#6c5ce7">
          </div>
        </div>
        <div class="color-palette" id="colorPalette"></div>
      </div>

      <!-- Brush -->
      <div class="panel-section">
        <div class="section-title">画笔</div>
        <div class="slider-row">
          <label>大小</label>
          <input type="range" id="brushSize" min="1" max="100" value="5">
          <span class="slider-value" id="brushSizeVal">5</span>
        </div>
        <div class="slider-row">
          <label>不透明度</label>
          <input type="range" id="brushOpacity" min="1" max="100" value="100">
          <span class="slider-value" id="brushOpacityVal">100</span>
        </div>
      </div>

      <!-- Shape options -->
      <div class="panel-section shape-options" id="shapeOptions">
        <div class="section-title">形状</div>
        <div class="radio-group">
          <input type="radio" name="shapeMode" id="shapeStroke" value="stroke" checked>
          <label for="shapeStroke">描边</label>
          <input type="radio" name="shapeMode" id="shapeFill" value="fill">
          <label for="shapeFill">填充</label>
          <input type="radio" name="shapeMode" id="shapeBoth" value="both">
          <label for="shapeBoth">两者</label>
        </div>
      </div>

      <!-- Layers -->
      <div class="panel-section" style="flex:1">
        <div class="section-title">图层</div>
        <div style="display:flex;gap:4px;margin-bottom:6px">
          <button class="panel-btn" onclick="app.addLayer()" style="flex:1;margin:0">
            <svg viewBox="0 0 16 16" fill="currentColor" width="12" height="12"><rect x="2" y="7" width="12" height="2" rx="1"/><rect x="7" y="2" width="2" height="12" rx="1"/></svg>
            添加
          </button>
          <button class="panel-btn" onclick="app.deleteLayer()" style="flex:1;margin:0">
            <svg viewBox="0 0 16 16" fill="currentColor" width="12" height="12"><rect x="3" y="5" width="10" height="2" rx="1"/><path d="M6 5V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
            删除
          </button>
        </div>
        <div style="display:flex;gap:4px;margin-bottom:8px">
          <button class="panel-btn" onclick="app.moveLayerUp()" style="flex:1;margin:0">↑ 上移</button>
          <button class="panel-btn" onclick="app.moveLayerDown()" style="flex:1;margin:0">↓ 下移</button>
        </div>
        <div class="layer-list" id="layerList"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================
   ArtStudio Pro - Drawing Application
   ============================================ */
class DrawingApp {
  constructor() {
    this.canvas = document.getElementById('mainCanvas');
    this.ctx = this.canvas.getContext('2d');
    this.canvasWrap = document.getElementById('canvasWrap');
    this.canvasArea = document.getElementById('canvasArea');

    // State
    this.tool = 'pencil';
    this.color = '#6c5ce7';
    this.brushSize = 5;
    this.opacity = 1;
    this.zoom = 1;
    this.gridVisible = false;
    this.shapeMode = 'stroke';

    // Drawing state
    this.isDrawing = false;
    this.lastX = 0;
    this.lastY = 0;
    this.points = [];

    // Layers
    this.layers = [];
    this.activeLayerIndex = 0;

    // History
    this.undoStack = [];
    this.redoStack = [];
    this.maxHistory = 50;

    this.init();
  }

  init() {
    this.setupDefaultLayers();
    this.setupColorPalette();
    this.setupEvents();
    this.setupShortcuts();
    this.renderLayers();
    this.updateUI();
    this.compositeLayers();
  }

  /* ========== Layers ========== */
  setupDefaultLayers() {
    this.layers = [];
    for (let i = 0; i < 2; i++) {
      this.layers.push(this.createLayer(`图层 ${i+1}`));
    }
    this.activeLayerIndex = 0;
    this.saveState();
  }

  createLayer(name) {
    const c = document.createElement('canvas');
    c.width = this.canvas.width;
    c.height = this.canvas.height;
    return {
      name: name || '图层',
      canvas: c,
      ctx: c.getContext('2d'),
      visible: true,
      opacity: 1
    };
  }

  get activeLayer() {
    return this.layers[this.activeLayerIndex];
  }

  addLayer() {
    const idx = this.activeLayerIndex + 1;
    this.layers.splice(idx, 0, this.createLayer(`图层 ${this.layers.length + 1}`));
    this.activeLayerIndex = idx;
    this.renderLayers();
    this.saveState();
    this.updateUI();
  }

  deleteLayer() {
    if (this.layers.length <= 1) return;
    this.layers.splice(this.activeLayerIndex, 1);
    this.activeLayerIndex = Math.min(this.activeLayerIndex, this.layers.length - 1);
    this.compositeLayers();
    this.renderLayers();
    this.saveState();
    this.updateUI();
  }

  moveLayerUp() {
    if (this.activeLayerIndex <= 0) return;
    [this.layers[this.activeLayerIndex], this.layers[this.activeLayerIndex - 1]] =
      [this.layers[this.activeLayerIndex - 1], this.layers[this.activeLayerIndex]];
    this.activeLayerIndex--;
    this.compositeLayers();
    this.renderLayers();
  }

  moveLayerDown() {
    if (this.activeLayerIndex >= this.layers.length - 1) return;
    [this.layers[this.activeLayerIndex], this.layers[this.activeLayerIndex + 1]] =
      [this.layers[this.activeLayerIndex + 1], this.layers[this.activeLayerIndex]];
    this.activeLayerIndex++;
    this.compositeLayers();
    this.renderLayers();
  }

  setActiveLayer(index) {
    this.activeLayerIndex = index;
    this.renderLayers();
  }

  toggleLayerVisibility(index) {
    this.layers[index].visible = !this.layers[index].visible;
    this.compositeLayers();
    this.renderLayers();
  }

  renderLayers() {
    const list = document.getElementById('layerList');
    list.innerHTML = '';
    [...this.layers].reverse().forEach((layer, ri) => {
      const idx = this.layers.length - 1 - ri;
      const item = document.createElement('div');
      item.className = 'layer-item' + (idx === this.activeLayerIndex ? ' active' : '');
      
      const vis = document.createElement('span');
      vis.className = 'layer-vis' + (layer.visible ? '' : ' hidden');
      vis.innerHTML = layer.visible 
        ? '<svg viewBox="0 0 16 16" fill="currentColor" width="14" height="14"><path d="M8 3C4 3 1.5 6 1.5 8s2.5 5 6.5 5 6.5-3 6.5-5-2.5-5-6.5-5zm0 8a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/><circle cx="8" cy="8" r="1.5"/></svg>'
        : '<svg viewBox="0 0 16 16" fill="currentColor" width="14" height="14"><path d="M2 2l12 12M5.5 5.5a3 3 0 0 0 4.2 4.2M8 3c4 0 6.5 3 6.5 5 0 .8-.5 1.8-1.3 2.7M3.3 5.3C2 6.5 1.5 7.5 1.5 8c0 2 2.5 5 6.5 5 1.2 0 2.3-.3 3.2-.8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>';
      vis.onclick = (e) => { e.stopPropagation(); this.toggleLayerVisibility(idx); };
      item.appendChild(vis);

      const thumb = document.createElement('div');
      thumb.className = 'layer-thumb';
      const tc = document.createElement('canvas');
      tc.width = 32; tc.height = 32;
      const tctx = tc.getContext('2d');
      tctx.drawImage(layer.canvas, 0, 0, 32, 32);
      thumb.appendChild(tc);
      item.appendChild(thumb);

      const name = document.createElement('span');
      name.className = 'layer-name';
      name.textContent = layer.name;
      item.appendChild(name);

      item.onclick = () => this.setActiveLayer(idx);
      list.appendChild(item);
    });
  }

  /* ========== Composite ========== */
  compositeLayers() {
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    for (const layer of this.layers) {
      if (!layer.visible) continue;
      this.ctx.globalAlpha = layer.opacity;
      this.ctx.drawImage(layer.canvas, 0, 0);
    }
    this.ctx.globalAlpha = 1;
  }

  /* ========== Color Palette ========== */
  setupColorPalette() {
    const colors = [
      '#000000','#2c3e50','#34495e','#7f8c8d','#95a5a6','#bdc3c7','#ecf0f1','#ffffff',
      '#e74c3c','#e67e22','#f39c12','#f1c40f','#2ecc71','#1abc9c','#3498db','#2980b9',
      '#9b59b6','#8e44ad','#6c5ce7','#a29bfe','#fd79a8','#e84393','#d63031','#fdcb6e',
      '#55efc4','#00cec9','#74b9ff','#0984e3','#636e72','#b2bec3','#dfe6e9','#ffeaa7'
    ];
    const pal = document.getElementById('colorPalette');
    colors.forEach(c => {
      const sw = document.createElement('div');
      sw.className = 'palette-swatch';
      sw.style.background = c;
      sw.onclick = () => { this.setColor(c); };
      pal.appendChild(sw);
    });
  }

  setColor(c) {
    this.color = c;
    document.getElementById('colorPicker').value = c;
    document.getElementById('colorSwatch').style.background = c;
  }

  /* ========== Events ========== */
  setupEvents() {
    // Canvas events
    this.canvas.addEventListener('mousedown', (e) => this.startDraw(e));
    this.canvas.addEventListener('mousemove', (e) => this.moveDraw(e));
    this.canvas.addEventListener('mouseup', (e) => this.endDraw(e));
    this.canvas.addEventListener('mouseleave', (e) => this.endDraw(e));

    // Touch events
    this.canvas.addEventListener('touchstart', (e) => { e.preventDefault(); this.startDraw(this.touchToMouse(e)); }, {passive:false});
    this.canvas.addEventListener('touchmove', (e) => { e.preventDefault(); this.moveDraw(this.touchToMouse(e)); }, {passive:false});
    this.canvas.addEventListener('touchend', (e) => { e.preventDefault(); this.endDraw(e); }, {passive:false});

    // Tool buttons
    document.querySelectorAll('[data-tool]').forEach(btn => {
      btn.addEventListener('click', () => this.selectTool(btn.dataset.tool));
    });

    // Color picker
    document.getElementById('colorPicker').addEventListener('input', (e) => {
      this.setColor(e.target.value);
    });

    // Brush size
    document.getElementById('brushSize').addEventListener('input', (e) => {
      this.brushSize = parseInt(e.target.value);
      document.getElementById('brushSizeVal').textContent = this.brushSize;
    });

    // Opacity
    document.getElementById('brushOpacity').addEventListener('input', (e) => {
      this.opacity = parseInt(e.target.value) / 100;
      document.getElementById('brushOpacityVal').textContent = e.target.value;
    });

    // Shape mode radios
    document.querySelectorAll('input[name="shapeMode"]').forEach(r => {
      r.addEventListener('change', () => {
        if (r.checked) this.shapeMode = r.value;
      });
    });

    // Zoom via scroll
    this.canvasArea.addEventListener('wheel', (e) => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        const delta = e.deltaY > 0 ? -0.1 : 0.1;
        this.zoom = Math.max(0.1, Math.min(10, this.zoom + delta));
        this.applyZoom();
      }
    }, {passive: false});

    // Canvas resize on window resize
    window.addEventListener('resize', () => this.adjustCanvasSize());
    this.adjustCanvasSize();
  }

  adjustCanvasSize() {
    const area = this.canvasArea;
    const w = Math.max(400, area.clientWidth - 20);
    const h = Math.max(300, area.clientHeight - 20);
    const curW = this.canvas.width;
    const curH = this.canvas.height;
    if (w !== curW || h !== curH) {
      this.resizeCanvas(w, h);
    }
  }

  resizeCanvas(w, h) {
    const oldW = this.canvas.width;
    const oldH = this.canvas.height;
    
    this.canvas.width = w;
    this.canvas.height = h;
    
    this.layers.forEach((layer) => {
      const oldImg = layer.ctx.getImageData(0, 0, Math.min(oldW, w), Math.min(oldH, h));
      layer.canvas.width = w;
      layer.canvas.height = h;
      layer.ctx = layer.canvas.getContext('2d');
      layer.ctx.putImageData(oldImg, 0, 0);
    });
    
    this.compositeLayers();
    this.renderLayers();
  }

  touchToMouse(e) {
    const touch = e.touches[0];
    const rect = this.canvas.getBoundingClientRect();
    return {
      offsetX: (touch.clientX - rect.left) / this.zoom,
      offsetY: (touch.clientY - rect.top) / this.zoom,
      clientX: touch.clientX,
      clientY: touch.clientY
    };
  }

  applyZoom() {
    const scale = this.zoom;
    this.canvasWrap.style.transform = `translate(-50%, -50%) scale(${scale})`;
    document.getElementById('zoomDisplay').textContent = Math.round(scale * 100) + '%';
  }

  /* ========== Drawing ========== */
  getCanvasPos(e) {
    const rect = this.canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) / this.zoom,
      y: (e.clientY - rect.top) / this.zoom
    };
  }

  startDraw(e) {
    if (e.type === 'touchend') return;
    const pos = this.getCanvasPos(e);
    this.isDrawing = true;
    this.lastX = pos.x;
    this.lastY = pos.y;
    this.points = [{x: pos.x, y: pos.y}];

    if (this.tool === 'fill') {
      this.floodFill(Math.round(pos.x), Math.round(pos.y));
      this.isDrawing = false;
      return;
    }

    if (this.tool === 'eyedropper') {
      this.pickColor(Math.round(pos.x), Math.round(pos.y));
      this.isDrawing = false;
      return;
    }

    // Draw a single dot for pencil/brush
    if (this.tool === 'pencil' || this.tool === 'brush' || this.tool === 'eraser') {
      const ctx = this.activeLayer.ctx;
      ctx.save();
      ctx.globalAlpha = this.tool === 'eraser' ? 1 : this.opacity;
      ctx.globalCompositeOperation = this.tool === 'eraser' ? 'destination-out' : 'source-over';
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, this.brushSize / 2, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.fill();
      ctx.restore();
      this.compositeLayers();
    }
  }

  moveDraw(e) {
    if (!this.isDrawing) return;
    const pos = this.getCanvasPos(e);
    this.points.push({x: pos.x, y: pos.y});

    // Update coordinates
    document.getElementById('coordDisplay').textContent =
      `X: ${Math.round(pos.x)}  Y: ${Math.round(pos.y)}`;

    const tool = this.tool;
    if (tool === 'pencil' || tool === 'brush' || tool === 'eraser') {
      this.drawStroke(pos);
    } else if (tool === 'line' || tool === 'rect' || tool === 'circle') {
      this.drawShapePreview(pos);
    }

    // Show preview on main canvas for shape tools
    if (['line','rect','circle'].includes(tool)) {
      this.compositeLayers();
      const ctx = this.ctx;
      ctx.save();
      ctx.globalAlpha = 0.6;
      ctx.strokeStyle = this.color;
      ctx.fillStyle = this.color;
      ctx.lineWidth = this.brushSize;
      ctx.lineCap = 'round';
      const x0 = this.points[0].x, y0 = this.points[0].y;
      const x1 = pos.x, y1 = pos.y;

      if (tool === 'line') {
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      } else if (tool === 'rect') {
        const rx = Math.min(x0, x1), ry = Math.min(y0, y1), rw = Math.abs(x1 - x0), rh = Math.abs(y1 - y0);
        if (this.shapeMode === 'stroke' || this.shapeMode === 'both') {
          ctx.strokeRect(rx, ry, rw, rh);
        }
        if (this.shapeMode === 'fill' || this.shapeMode === 'both') {
          ctx.globalAlpha = 0.3;
          ctx.fillRect(rx, ry, rw, rh);
        }
      } else if (tool === 'circle') {
        const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
        const rx = Math.abs(x1 - x0) / 2, ry = Math.abs(y1 - y0) / 2;
        ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        if (this.shapeMode === 'fill' || this.shapeMode === 'both') {
          ctx.globalAlpha = 0.3; ctx.fill();
        }
        ctx.globalAlpha = 0.6;
        if (this.shapeMode === 'stroke' || this.shapeMode === 'both') ctx.stroke();
      }
      ctx.restore();
    }
  }

  drawStroke(pos) {
    const ctx = this.activeLayer.ctx;
    const pts = this.points;
    const len = pts.length;

    ctx.save();
    ctx.globalAlpha = this.tool === 'eraser' ? 1 : this.opacity;
    ctx.globalCompositeOperation = this.tool === 'eraser' ? 'destination-out' : 'source-over';
    ctx.strokeStyle = this.color;
    ctx.fillStyle = this.color;
    ctx.lineWidth = this.brushSize;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (this.tool === 'pencil') {
      ctx.imageSmoothingEnabled = false;
    } else {
      ctx.imageSmoothingEnabled = true;
    }

    if (len >= 2) {
      ctx.beginPath();
      ctx.moveTo(pts[len - 2].x, pts[len - 2].y);
      if (len >= 3) {
        // Bezier curve through midpoint for smooth strokes
        const midX = (pts[len - 3].x + pts[len - 1].x) / 2;
        const midY = (pts[len - 3].y + pts[len - 1].y) / 2;
        ctx.quadraticCurveTo(pts[len - 2].x, pts[len - 2].y, midX, midY);
      } else {
        ctx.lineTo(pts[len - 1].x, pts[len - 1].y);
      }
      ctx.stroke();
    }

    ctx.restore();
    this.compositeLayers();
  }

  drawShapePreview(pos) {}

  endDraw(e) {
    if (!this.isDrawing) return;

    const tool = this.tool;
    if (['line','rect','circle'].includes(tool) && this.points.length >= 2) {
      // Draw final shape to active layer
      const ctx = this.activeLayer.ctx;
      ctx.save();
      ctx.strokeStyle = this.color;
      ctx.fillStyle = this.color;
      ctx.lineWidth = this.brushSize;
      ctx.lineCap = 'round';
      ctx.globalAlpha = this.opacity;

      const x0 = this.points[0].x, y0 = this.points[0].y;
      const x1 = this.points[this.points.length-1].x, y1 = this.points[this.points.length-1].y;

      if (tool === 'line') {
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      } else if (tool === 'rect') {
        const rx = Math.min(x0, x1), ry = Math.min(y0, y1), rw = Math.abs(x1 - x0), rh = Math.abs(y1 - y0);
        if (this.shapeMode === 'fill') {
          ctx.fillRect(rx, ry, rw, rh);
        } else if (this.shapeMode === 'stroke') {
          ctx.strokeRect(rx, ry, rw, rh);
        } else {
          ctx.fillRect(rx, ry, rw, rh);
          ctx.strokeRect(rx, ry, rw, rh);
        }
      } else if (tool === 'circle') {
        const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
        const rx = Math.abs(x1 - x0) / 2, ry = Math.abs(y1 - y0) / 2;
        ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        if (this.shapeMode === 'fill') { ctx.fill(); }
        else if (this.shapeMode === 'stroke') { ctx.stroke(); }
        else { ctx.fill(); ctx.stroke(); }
      }
      ctx.restore();
      this.compositeLayers();
    }

    this.isDrawing = false;
    this.points = [];
    this.saveState();
  }

  /* ========== Flood Fill ========== */
  floodFill(startX, startY) {
    const ctx = this.activeLayer.ctx;
    const w = this.canvas.width;
    const h = this.canvas.height;
    const imgData = ctx.getImageData(0, 0, w, h);
    const data = imgData.data;

    const idx = (startY * w + startX) * 4;
    const targetR = data[idx], targetG = data[idx + 1], targetB = data[idx + 2], targetA = data[idx + 3];

    const color = this.hexToRgb(this.color);

    // If target color is already the fill color, skip
    if (Math.abs(targetR - color.r) < 5 && Math.abs(targetG - color.g) < 5 && Math.abs(targetB - color.b) < 5 && targetA === 255) return;

    const visited = new Uint8Array(w * h);
    const stack = [[startX, startY]];
    const maxStack = 100000;
    let count = 0;

    while (stack.length > 0 && count < maxStack) {
      const [x, y] = stack.pop();
      const i = (y * w + x) * 4;
      const vi = y * w + x;

      if (x < 0 || x >= w || y < 0 || y >= h) continue;
      if (visited[vi]) continue;

      const dr = Math.abs(data[i] - targetR);
      const dg = Math.abs(data[i + 1] - targetG);
      const db = Math.abs(data[i + 2] - targetB);
      const da = Math.abs(data[i + 3] - targetA);

      // Tolerance check
      if (dr > 30 || dg > 30 || db > 30 || da > 30) continue;

      visited[vi] = 1;
      data[i] = color.r;
      data[i + 1] = color.g;
      data[i + 2] = color.b;
      data[i + 3] = 255;
      count++;

      stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
    }

    ctx.putImageData(imgData, 0, 0);
    this.compositeLayers();
    this.saveState();
  }

  hexToRgb(hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return { r, g, b };
  }

  /* ========== Eyedropper ========== */
  pickColor(x, y) {
    const w = this.canvas.width, h = this.canvas.height;
    if (x < 0 || x >= w || y < 0 || y >= h) return;
    const tempC = document.createElement('canvas');
    tempC.width = 1; tempC.height = 1;
    const tempCtx = tempC.getContext('2d');
    tempCtx.drawImage(this.canvas, x, y, 1, 1, 0, 0, 1, 1);
    const [r, g, b] = tempCtx.getImageData(0, 0, 1, 1).data;
    const hex = '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
    this.setColor(hex);
  }

  /* ========== Tools ========== */
  selectTool(tool) {
    this.tool = tool;
    document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === tool));
    
    const names = {pencil:'铅笔', brush:'画笔', eraser:'橡皮擦', fill:'填充', line:'直线', rect:'矩形', circle:'椭圆', eyedropper:'取色器'};
    const keys = {pencil:'P', brush:'B', eraser:'E', fill:'G', line:'L', rect:'R', circle:'O', eyedropper:'I'};
    document.getElementById('modeIndicator').innerHTML = `${names[tool]} · <kbd>${keys[tool]}</kbd> 切换`;

    // Show shape options only for shape tools
    document.getElementById('shapeOptions').classList.toggle('visible', ['line','rect','circle'].includes(tool));

    // Cursor
    if (tool === 'fill') this.canvas.style.cursor = 'cell';
    else if (tool === 'eyedropper') this.canvas.style.cursor = 'crosshair';
    else this.canvas.style.cursor = 'crosshair';

    // Special size for pencil
    if (tool === 'pencil') {
      document.getElementById('brushSize').value = Math.min(this.brushSize, 5);
      this.brushSize = Math.min(this.brushSize, 5);
      document.getElementById('brushSizeVal').textContent = this.brushSize;
    }
  }

  /* ========== Shortcuts ========== */
  setupShortcuts() {
    document.addEventListener('keydown', (e) => {
      // Ignore if typing in input
      if (e.target.tagName === 'INPUT') return;

      const map = { 'p':'pencil','b':'brush','e':'eraser','g':'fill','l':'line','r':'rect','o':'circle','i':'eyedropper' };
      if (map[e.key]) { this.selectTool(map[e.key]); e.preventDefault(); return; }

      if (e.ctrlKey && e.key === 'z' && !e.shiftKey) { this.undo(); e.preventDefault(); }
      if (e.ctrlKey && e.key === 'z' && e.shiftKey) { this.redo(); e.preventDefault(); }
      if (e.ctrlKey && e.key === 'y') { this.redo(); e.preventDefault(); }
      if (e.ctrlKey && e.key === 's') { this.savePNG(); e.preventDefault(); }
      if (e.key === '[') { this.zoomOut(); e.preventDefault(); }
      if (e.key === ']') { this.zoomIn(); e.preventDefault(); }
    });
  }

  /* ========== History ========== */
  saveState() {
    const state = this.layers.map(l => {
      const c = document.createElement('canvas');
      c.width = l.canvas.width;
      c.height = l.canvas.height;
      c.getContext('2d').drawImage(l.canvas, 0, 0);
      return c;
    });
    this.undoStack.push(state);
    if (this.undoStack.length > this.maxHistory) this.undoStack.shift();
    this.redoStack = [];
  }

  undo() {
    if (this.undoStack.length <= 1) return;
    const current = this.layers.map(l => {
      const c = document.createElement('canvas');
      c.width = l.canvas.width; c.height = l.canvas.height;
      c.getContext('2d').drawImage(l.canvas, 0, 0);
      return c;
    });
    this.redoStack.push(current);

    this.undoStack.pop();
    const state = this.undoStack[this.undoStack.length - 1];
    this.layers.forEach((l, i) => {
      l.ctx.clearRect(0, 0, l.canvas.width, l.canvas.height);
      if (state[i]) l.ctx.drawImage(state[i], 0, 0);
    });
    this.compositeLayers();
    this.renderLayers();
  }

  redo() {
    if (this.redoStack.length === 0) return;
    const state = this.redoStack.pop();

    const current = this.layers.map(l => {
      const c = document.createElement('canvas');
      c.width = l.canvas.width; c.height = l.canvas.height;
      c.getContext('2d').drawImage(l.canvas, 0, 0);
      return c;
    });
    this.undoStack.push(current);

    this.layers.forEach((l, i) => {
      l.ctx.clearRect(0, 0, l.canvas.width, l.canvas.height);
      if (state[i]) l.ctx.drawImage(state[i], 0, 0);
    });
    this.compositeLayers();
    this.renderLayers();
  }

  /* ========== Actions ========== */
  clearCanvas() {
    if (!confirm('确定要清空当前画布吗？')) return;
    this.layers.forEach(l => {
      l.ctx.clearRect(0, 0, l.canvas.width, l.canvas.height);
    });
    this.compositeLayers();
    this.saveState();
  }

  newProject() {
    if (!confirm('新建将清除当前作品，是否继续？')) return;
    this.setupDefaultLayers();
    this.compositeLayers();
    this.renderLayers();
    this.zoom = 1;
    this.applyZoom();
    this.undoStack = [];
    this.redoStack = [];
    this.saveState();
  }

  savePNG() {
    // Compose all layers into a single canvas
    const c = document.createElement('canvas');
    c.width = this.canvas.width;
    c.height = this.canvas.height;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, c.width, c.height);
    for (const layer of this.layers) {
      if (!layer.visible) continue;
      ctx.drawImage(layer.canvas, 0, 0);
    }
    const link = document.createElement('a');
    link.download = 'artstudio_作品_' + new Date().toISOString().slice(0,19).replace(/[:.]/g, '-') + '.png';
    link.href = c.toDataURL('image/png');
    link.click();
  }

  toggleGrid() {
    this.gridVisible = !this.gridVisible;
    // Grid overlay not implemented yet but we can add a canvas overlay
  }

  zoomIn() { this.zoom = Math.min(10, this.zoom + 0.2); this.applyZoom(); }
  zoomOut() { this.zoom = Math.max(0.1, this.zoom - 0.2); this.applyZoom(); }

  updateUI() {
    this.renderLayers();
  }
}

// Initialize
const app = new DrawingApp();
</script>
