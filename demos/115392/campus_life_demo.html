<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园智慧生活服务平台 - 产品演示</title>
<style>
:root {
  --primary: #3b82f6; --primary-light: #60a5fa; --primary-dark: #2563eb;
  --secondary: #8b5cf6; --accent: #10b981; --warning: #f59e0b; --danger: #ef4444;
  --bg: #f3f4f6; --bg-card: #ffffff; --text: #1f2937; --text-secondary: #6b7280; --text-muted: #9ca3af;
  --border: #e5e7eb; --border-light: #f3f4f6;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 20px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05); --shadow-md: 0 4px 12px rgba(0,0,0,0.08); --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #e0e7ff 0%, #f0f9ff 50%, #ecfdf5 100%); color: var(--text); overflow-x: hidden; }

.header { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 24px 32px; background: rgba(255,255,255,0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.5); position: sticky; top: 0; z-index: 100; }
.header .logo { width: 40px; height: 40px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 18px; box-shadow: var(--shadow-md); }
.header h1 { font-size: 20px; font-weight: 700; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.header .tag { font-size: 12px; color: var(--text-secondary); background: rgba(59,130,246,0.1); padding: 4px 12px; border-radius: 20px; }

.container { max-width: 1400px; margin: 0 auto; padding: 32px 24px; display: flex; gap: 40px; justify-content: center; align-items: flex-start; }
@media (max-width: 1200px) { .container { flex-direction: column; align-items: center; } }

.demo-tip { background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); border-radius: var(--radius-lg); padding: 16px 20px; margin-bottom: 24px; display: flex; align-items: flex-start; gap: 12px; box-shadow: var(--shadow-sm); border-left: 4px solid var(--primary); }
.demo-tip .icon { font-size: 18px; }
.demo-tip .content { font-size: 14px; line-height: 1.6; color: var(--text-secondary); }
.demo-tip .content strong { color: var(--text); }

.phone-wrapper { width: 420px; flex-shrink: 0; }
.phone { width: 420px; height: 840px; background: #0f0f0f; border-radius: 44px; padding: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.1); position: relative; overflow: hidden; }
.phone-inner { width: 100%; height: 100%; background: var(--bg); border-radius: 36px; overflow: hidden; display: flex; flex-direction: column; }
.phone-status-bar { height: 44px; background: #0f0f0f; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; color: white; font-size: 13px; font-weight: 500; }
.phone-status-bar .time { font-variant-numeric: tabular-nums; }
.phone-navbar { height: 56px; background: var(--bg-card); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 16px; position: relative; flex-shrink: 0; }
.phone-navbar .back-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 22px; color: var(--text); border-radius: 50%; transition: var(--transition); }
.phone-navbar .back-btn:hover { background: var(--bg); }
.phone-navbar .title { position: absolute; left: 0; right: 0; text-align: center; font-size: 17px; font-weight: 600; color: var(--text); }
.phone-screen { flex: 1; overflow-y: auto; background: var(--bg); padding-bottom: 80px; scrollbar-width: none; }
.phone-screen::-webkit-scrollbar { width: 0; }

.admin-panel { width: 600px; flex-shrink: 0; background: var(--bg-card); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); overflow: hidden; }
@media (max-width: 1200px) { .admin-panel { width: 100%; max-width: 600px; } }
.admin-header { background: linear-gradient(135deg, var(--primary), var(--secondary)); padding: 24px; color: white; }
.admin-header h2 { font-size: 20px; font-weight: 700; }
.admin-header p { font-size: 13px; opacity: 0.85; margin-top: 4px; }
.admin-body { padding: 20px; }

.search-bar { display: flex; align-items: center; gap: 8px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 10px 14px; margin: 12px; transition: var(--transition); }
.search-bar:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
.search-bar .icon { font-size: 16px; color: var(--text-muted); }
.search-bar input { flex: 1; border: none; outline: none; background: transparent; font-size: 14px; color: var(--text); }
.search-bar input::placeholder { color: var(--text-muted); }
.search-bar .btn { background: var(--primary); color: white; border: none; padding: 6px 14px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; transition: var(--transition); }
.search-bar .btn:hover { background: var(--primary-dark); }

.banner { margin: 12px; border-radius: var(--radius-lg); padding: 20px; color: white; position: relative; overflow: hidden; cursor: pointer; transition: var(--transition); }
.banner:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.banner::before { content: ''; position: absolute; right: -20px; top: -20px; width: 100px; height: 100px; border-radius: 50%; opacity: 0.2; }
.banner.b1 { background: linear-gradient(135deg, #3b82f6, #60a5fa); }
.banner.b1::before { background: white; }
.banner.b2 { background: linear-gradient(135deg, #8b5cf6, #a78bfa); }
.banner.b2::before { background: white; }
.banner.b3 { background: linear-gradient(135deg, #10b981, #34d399); }
.banner.b3::before { background: white; }
.banner .tag { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; }
.banner h3 { font-size: 18px; font-weight: 700; }
.banner p { font-size: 13px; opacity: 0.9; margin-top: 6px; }

.grid-section { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 12px; margin-top: 12px; }
.grid-item { background: var(--bg-card); border-radius: var(--radius-md); padding: 18px 12px; text-align: center; cursor: pointer; transition: var(--transition); box-shadow: var(--shadow-sm); }
.grid-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.grid-item .icon { font-size: 28px; margin-bottom: 8px; display: block; }
.grid-item .label { font-size: 13px; font-weight: 500; color: var(--text); }

.section-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 16px 8px; }
.section-header .title { font-size: 16px; font-weight: 700; color: var(--text); }
.section-header .more { font-size: 13px; color: var(--text-secondary); cursor: pointer; transition: var(--transition); }
.section-header .more:hover { color: var(--primary); }

.card-list { padding: 0 12px; }
.card { background: var(--bg-card); border-radius: var(--radius-md); padding: 14px; margin-bottom: 10px; cursor: pointer; transition: var(--transition); box-shadow: var(--shadow-sm); display: flex; gap: 12px; }
.card:hover { transform: translateX(4px); box-shadow: var(--shadow-md); }
.card .thumb { width: 72px; height: 72px; border-radius: var(--radius-sm); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 28px; color: white; }
.card .info { flex: 1; min-width: 0; }
.card .info h4 { font-size: 15px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .info .meta { font-size: 12px; color: var(--text-secondary); margin-top: 4px; line-height: 1.5; }
.card .info .price { font-size: 16px; font-weight: 700; color: var(--danger); margin-top: 6px; }
.card .info .tags { display: flex; gap: 6px; margin-top: 8px; }
.card .tag { font-size: 11px; padding: 2px 8px; border-radius: 12px; background: rgba(59,130,246,0.1); color: var(--primary); font-weight: 500; }
.card .tag.warn { background: rgba(245,158,11,0.1); color: var(--warning); }
.card .tag.success { background: rgba(16,185,129,0.1); color: var(--accent); }
.card .tag.danger { background: rgba(239,68,68,0.1); color: var(--danger); }
.card .tag.muted { background: var(--bg); color: var(--text-muted); }

.chip-bar { display: flex; gap: 8px; padding: 8px 12px; overflow-x: auto; scrollbar-width: none; }
.chip-bar::-webkit-scrollbar { display: none; }
.chip { flex-shrink: 0; background: var(--bg-card); border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; font-size: 13px; color: var(--text-secondary); cursor: pointer; transition: var(--transition); white-space: nowrap; }
.chip.active { background: var(--primary); color: white; border-color: var(--primary); }
.chip:hover { border-color: var(--primary); color: var(--primary); }

.detail-card { background: var(--bg-card); margin: 12px; border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-md); }
.detail-card .gallery { display: flex; gap: 4px; }
.detail-card .gallery .img-box { flex: 1; height: 140px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 48px; color: white; }
.detail-card .gallery .img-box:first-child { flex: 2; }
.detail-card .content { padding: 16px; }
.detail-card .content h3 { font-size: 18px; font-weight: 700; color: var(--text); }
.detail-card .content .price-row { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
.detail-card .content .price { font-size: 24px; font-weight: 800; color: var(--danger); }
.detail-card .content .condition { font-size: 13px; color: var(--text-secondary); }
.detail-card .content .desc { font-size: 14px; color: var(--text-secondary); line-height: 1.7; margin-top: 12px; }
.detail-card .content .seller { display: flex; align-items: center; gap: 10px; margin-top: 16px; padding: 12px; background: var(--bg); border-radius: var(--radius-md); }
.detail-card .content .seller .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; }
.detail-card .content .seller .info .name { font-size: 14px; font-weight: 600; color: var(--text); }
.detail-card .content .seller .info .meta { font-size: 12px; color: var(--text-muted); }
.detail-card .actions { display: flex; gap: 10px; padding: 16px; border-top: 1px solid var(--border); }
.detail-card .actions .btn { flex: 1; padding: 12px; border-radius: var(--radius-md); font-size: 14px; font-weight: 600; cursor: pointer; transition: var(--transition); border: none; }
.detail-card .actions .btn.primary { background: var(--primary); color: white; }
.detail-card .actions .btn.primary:hover { background: var(--primary-dark); }
.detail-card .actions .btn.ghost { background: var(--bg); color: var(--text); }
.detail-card .actions .btn.ghost:hover { background: var(--border); }
.detail-card .actions .btn.danger { background: var(--danger); color: white; }
.detail-card .actions .btn.danger:hover { background: #dc2626; }

.tab-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 68px; background: var(--bg-card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
.tab-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: var(--transition); padding: 8px 16px; border-radius: var(--radius-md); }
.tab-item .icon { font-size: 22px; }
.tab-item .label { font-size: 11px; color: var(--text-muted); }
.tab-item.active .icon { transform: scale(1.1); }
.tab-item.active .label { color: var(--primary); font-weight: 600; }
.tab-item:hover { background: var(--bg); }

.float-btn { position: absolute; right: 20px; bottom: 90px; width: 56px; height: 56px; background: var(--primary); color: white; border: none; border-radius: 50%; font-size: 28px; cursor: pointer; box-shadow: 0 4px 16px rgba(59,130,246,0.4); transition: var(--transition); z-index: 50; }
.float-btn:hover { transform: scale(1.1); box-shadow: 0 6px 20px rgba(59,130,246,0.5); }

.login-page { padding: 60px 32px; text-align: center; }
.login-page .logo { width: 80px; height: 80px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: 24px; display: flex; align-items: center; justify-content: center; color: white; font-size: 36px; margin: 0 auto 24px; box-shadow: var(--shadow-lg); }
.login-page h2 { font-size: 24px; font-weight: 700; color: var(--text); }
.login-page p { font-size: 14px; color: var(--text-secondary); margin-top: 8px; }
.login-page .form { margin-top: 32px; text-align: left; }
.login-page .form .input { width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 15px; margin-bottom: 14px; outline: none; transition: var(--transition); }
.login-page .form .input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
.login-page .form .input::placeholder { color: var(--text-muted); }
.login-page .btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: var(--radius-md); font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: var(--transition); }
.login-page .btn:hover { background: var(--primary-dark); }

.profile-page { padding: 20px; }
.profile-header { text-align: center; padding: 20px 0; }
.profile-header .avatar { width: 88px; height: 88px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 36px; margin: 0 auto; box-shadow: var(--shadow-md); }
.profile-header .name { font-size: 20px; font-weight: 700; color: var(--text); margin-top: 12px; }
.profile-header .desc { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
.profile-stats { display: flex; justify-content: space-around; background: var(--bg-card); border-radius: var(--radius-md); margin: 12px; padding: 20px 0; box-shadow: var(--shadow-sm); }
.profile-stat { text-align: center; }
.profile-stat .num { font-size: 24px; font-weight: 700; color: var(--primary); }
.profile-stat .label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.profile-menu { background: var(--bg-card); border-radius: var(--radius-md); margin: 12px; overflow: hidden; box-shadow: var(--shadow-sm); }
.profile-menu-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: var(--transition); }
.profile-menu-item:last-child { border-bottom: none; }
.profile-menu-item:hover { background: var(--bg); }
.profile-menu-item .left { display: flex; align-items: center; gap: 12px; }
.profile-menu-item .left .icon { font-size: 18px; }
.profile-menu-item .left .text { font-size: 15px; color: var(--text); }
.profile-menu-item .right { color: var(--text-muted); font-size: 14px; }
.profile-logout { margin: 20px 12px; padding: 14px; background: var(--bg-card); border: 1px solid rgba(239,68,68,0.2); border-radius: var(--radius-md); color: var(--danger); font-size: 15px; cursor: pointer; transition: var(--transition); }
.profile-logout:hover { background: rgba(239,68,68,0.05); }

.chat-page { display: flex; flex-direction: column; height: 100%; }
.chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.chat-message { max-width: 75%; padding: 10px 14px; border-radius: var(--radius-md); font-size: 14px; line-height: 1.5; word-break: break-word; }
.chat-message.me { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 4px; }
.chat-message.other { align-self: flex-start; background: var(--bg-card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.chat-input-bar { display: flex; gap: 10px; padding: 12px; background: var(--bg-card); border-top: 1px solid var(--border); }
.chat-input-bar input { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 20px; font-size: 14px; outline: none; }
.chat-input-bar input:focus { border-color: var(--primary); }
.chat-input-bar button { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 20px; font-size: 14px; cursor: pointer; }

.conversation-list { padding: 12px; }
.conversation-item { display: flex; align-items: center; gap: 12px; background: var(--bg-card); border-radius: var(--radius-md); padding: 14px; margin-bottom: 10px; cursor: pointer; transition: var(--transition); box-shadow: var(--shadow-sm); }
.conversation-item:hover { transform: translateX(4px); box-shadow: var(--shadow-md); }
.conversation-item .avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.conversation-item .content { flex: 1; min-width: 0; }
.conversation-item .content .name { font-size: 15px; font-weight: 600; color: var(--text); }
.conversation-item .content .last-message { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
.conversation-item .badge { background: var(--danger); color: white; font-size: 11px; min-width: 20px; height: 20px; border-radius: 10px; display: flex; align-items: center; justify-content: center; padding: 0 6px; }

.sheet-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: flex-end; z-index: 200; animation: fadeIn 0.2s ease; }
.sheet-mask.show { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.sheet { background: var(--bg-card); width: 100%; max-width: 420px; border-radius: var(--radius-xl) var(--radius-xl) 0 0; padding: 24px; animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1); max-height: 85vh; overflow-y: auto; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.sheet-header h3 { font-size: 18px; font-weight: 700; }
.sheet-header .close { font-size: 24px; cursor: pointer; color: var(--text-muted); }
.sheet-form .form-group { margin-bottom: 16px; }
.sheet-form .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
.sheet-form .form-group input, .sheet-form .form-group textarea, .sheet-form .form-group select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; outline: none; transition: var(--transition); }
.sheet-form .form-group input:focus, .sheet-form .form-group textarea:focus, .sheet-form .form-group select:focus { border-color: var(--primary); }
.sheet-form .form-group textarea { resize: vertical; min-height: 80px; }
.sheet-form .btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: var(--radius-md); font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }

.stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.stat-card { background: var(--bg); border-radius: var(--radius-md); padding: 16px; text-align: center; }
.stat-card .value { font-size: 28px; font-weight: 800; color: var(--primary); }
.stat-card .label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.stat-card.warning .value { color: var(--warning); }
.stat-card.success .value { color: var(--accent); }
.stat-card.danger .value { color: var(--danger); }

.admin-tabs { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 2px solid var(--border); }
.admin-tab { padding: 12px 20px; font-size: 14px; font-weight: 500; color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent; transition: var(--transition); margin-right: 8px; }
.admin-tab.active { color: var(--primary); border-bottom-color: var(--primary); }

.admin-list { max-height: 400px; overflow-y: auto; }
.admin-item { background: var(--bg); border-radius: var(--radius-md); padding: 14px; margin-bottom: 10px; }
.admin-item .title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.admin-item .title { font-size: 15px; font-weight: 600; color: var(--text); }
.admin-item .type-tag { font-size: 11px; padding: 3px 8px; border-radius: 12px; background: rgba(59,130,246,0.1); color: var(--primary); }
.admin-item .meta { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
.admin-item .actions { display: flex; gap: 8px; margin-top: 12px; }
.admin-item .actions button { padding: 8px 14px; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; transition: var(--transition); }
.admin-item .actions .btn-approve { background: var(--accent); color: white; }
.admin-item .actions .btn-approve:hover { background: #059669; }
.admin-item .actions .btn-reject { background: var(--danger); color: white; }
.admin-item .actions .btn-reject:hover { background: #dc2626; }
.admin-item .actions .btn-edit { background: var(--primary); color: white; }
.admin-item .actions .btn-edit:hover { background: var(--primary-dark); }
.admin-item .actions .btn-ignore { background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border); }

.login-card { background: var(--bg-card); border-radius: var(--radius-xl); padding: 40px; text-align: center; box-shadow: var(--shadow-lg); }
.login-card .logo { font-size: 48px; margin-bottom: 16px; }
.login-card h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
.login-card p { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; }
.login-card .form { text-align: left; }
.login-card .form input { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 15px; margin-bottom: 14px; outline: none; }
.login-card .form input:focus { border-color: var(--primary); }
.login-card .btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: var(--radius-md); font-size: 16px; font-weight: 600; cursor: pointer; }

let currentUser = null;
let navStack = [{ view: 'login' }];
let currentTab = 'home';
let filterCategory = '全部';
let filterMutualType = '';

function getUser(id) { return APP_DATA.users.find(u => u.id === id); }

  const map = { pending: '待审核', published: '已发布', sold: '已售出', closed: '已关闭', removed: '已下架', rejected: '已驳回' };
  return map[status] || status;
}

function getStatusClass(status) {
  const map = { pending: 'warn', published: 'success', sold: 'muted', closed: 'muted', removed: 'danger', rejected: 'danger' };
  return map[status] || '';
}

function getMutualTypeText(type) {
  const map = { request: '求助', lostfound: '失物招领', activity: '活动' };
  return map[type] || type;
}

function getMutualTypeClass(type) {
  const map = { request: '', lostfound: 'warn', activity: 'success' };
  return map[type] || '';
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

function goBack() {
  if (navStack.length > 1) {
    navStack.pop();
    render();
  }
}

function goTab(tab) {
  navStack = [{ view: tab }];
  currentTab = tab;
  filterCategory = '全部';
  filterMutualType = '';
  render();
}

function navigate(view, params = {}) {
  navStack.push({ view, params });
  render();
}

function render() {
  const current = navStack[navStack.length - 1];
  const isTab = ['home', 'secondhand', 'mutual', 'message', 'profile'].includes(current.view);
  
  document.getElementById('navBack').style.visibility = isTab ? 'hidden' : 'visible';
  document.getElementById('tabBar').style.display = isTab ? 'flex' : 'none';
  document.getElementById('floatBtn').style.display = (current.view === 'secondhand' || current.view === 'mutual') && currentUser ? 'block' : 'none';
  
  const titles = {
    login: '校园智慧生活',
    home: '校园智慧生活',
    secondhand: '二手交易',
    mutual: '社区互助',
    message: '消息',
    profile: '我的',
    query: '商品/空间查询',
    queryDetail: '详情',
    secondhandDetail: '详情',
    mutualDetail: '详情',
    chat: '对话',
    myPosts: '我的发布',
  };

  document.querySelectorAll('.tab-item').forEach(el => {

  const renderers = {

    home: renderHome,
    query: renderQuery,
    queryDetail: renderQueryDetail,
    secondhand: renderSecondhand,
    secondhandDetail: renderSecondhandDetail,
    mutual: renderMutual,
    mutualDetail: renderMutualDetail,
    message: renderMessage,

    profile: renderProfile,
    myPosts: renderMyPosts,
  };

  adminRender();
}

}

function handleLogin() {
  const studentId = document.getElementById('loginStudentId').value.trim();
  const nickname = document.getElementById('loginNickname').value.trim() || '匿名同学';
  
  let user = APP_DATA.users.find(u => u.studentId === studentId);
  if (!user) {
    user = { id: Date.now(), studentId, nickname, role: 'student' };
    APP_DATA.users.push(user);
  }
  
  currentUser = user;
  goTab('home');
  toast(`欢迎，${nickname}`);

            <span class="tag ${getStatusClass(item.status)}">${getStatusText(item.status)}</span>

}

function renderMessage() {
  const conversations = [];
  APP_DATA.messages.forEach(m => {
    const otherId = m.fromUserId === currentUser?.id ? m.toUserId : m.fromUserId;
    const existing = conversations.find(c => c.otherId === otherId);
    if (!existing) {
      conversations.push({
        otherId,
        otherName: getUser(otherId)?.nickname || '匿名',
        lastMessage: m.content,
        unread: m.toUserId === currentUser?.id && !m.isRead ? 1 : 0,
      });
    } else {
      existing.lastMessage = m.content;
      if (m.toUserId === currentUser?.id && !m.isRead) existing.unread++;
    }
  });
  
  return `
    <div class="conversation-list">
      ${conversations.map(c => `
        <div class="conversation-item" onclick="navigate('chat',{userId:${c.otherId}})">
          <div class="avatar">${c.otherName[0]}</div>
          <div class="content">
            <div class="name">${c.otherName}</div>
            <div class="last-message">${c.lastMessage}</div>
          </div>
          ${c.unread > 0 ? `<div class="badge">${c.unread}</div>` : ''}
        </div>
      `).join('')}
    </div>
    
    ${!conversations.length ? '<div class="empty-state"><span class="icon">💬</span><p>暂无消息</p></div>' : ''}
  `;
}

function submitPublish() {
  const type = document.getElementById('publishType').value;
  const title = document.getElementById('publishTitle').value.trim();
  
  if (!title) {
    toast('请输入标题');
    return;
  }
  
  if (type === 'secondhand') {
    APP_DATA.secondhand.unshift({
      id: Date.now(),
      userId: currentUser.id,
      title,
      category: document.getElementById('publishCategory').value,
      price: Number(document.getElementById('publishPrice').value) || 0,
      condition: document.getElementById('publishCondition').value || '全新',
      description: document.getElementById('publishDesc').value.trim(),
      images: ['📦'],
      status: 'pending',
      createTime: new Date().toISOString().slice(0, 16).replace('T', ' '),
    });
  } else {
    APP_DATA.mutual.unshift({
      id: Date.now(),
      userId: currentUser.id,
      type: document.getElementById('publishMutualType').value,
      title,
      description: document.getElementById('publishDesc').value.trim(),
      images: [],
      status: 'pending',
      createTime: new Date().toISOString().slice(0, 16).replace('T', ' '),
    });

  closeSheet();
  goTab(type === 'secondhand' ? 'secondhand' : 'mutual');

function renderAudit() {
  const pending = [
    ...APP_DATA.secondhand.filter(s => s.status === 'pending').map(s => ({ ...s, type: 'secondhand' })),
    ...APP_DATA.mutual.filter(m => m.status === 'pending').map(m => ({ ...m, type: 'mutual' })),
  ];
  
  if (!pending.length) {
    return '<div class="empty-state"><span class="icon">✅</span><p>暂无待审核内容</p></div>';
  }
  
  return `
    <div class="admin-list">
      ${pending.map(item => {
        const user = getUser(item.userId);
        return `
          <div class="admin-item">
            <div class="title-row">
              <span class="title">${item.title}</span>
              <span class="type-tag">${item.type === 'secondhand' ? '二手' : '互助'}</span>
            </div>
            <div class="meta">
              发布者：${user?.nickname || '匿名'}<br>
              ${item.type === 'secondhand' ? `¥${item.price} · ${item.condition}` : getMutualTypeText(item.type)}
            </div>
            <div class="actions">
              <button class="btn-approve" onclick="auditApprove(${item.id},'${item.type}')">通过</button>
              <button class="btn-reject" onclick="auditReject(${item.id},'${item.type}')">驳回</button>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function auditApprove(id, type) {
  const arr = type === 'secondhand' ? APP_DATA.secondhand : APP_DATA.mutual;
  const item = arr.find(i => i.id === id);
  if (item) item.status = 'published';
  adminRender();
  render();
  toast('已通过审核');
}

function auditReject(id, type) {
  const arr = type === 'secondhand' ? APP_DATA.secondhand : APP_DATA.mutual;
  const item = arr.find(i => i.id === id);
  if (item) item.status = 'rejected';
  adminRender();
  render();
  toast('已驳回');
}

function renderReport() {
  const reports = APP_DATA.reports.filter(r => r.status === 'pending');
  
  if (!reports.length) {
    return '<div class="empty-state"><span class="icon">✅</span><p>暂无待处理举报</p></div>';
  }
  
  return `
    <div class="admin-list">
      ${reports.map(r => {
        const target = r.targetType === 'secondhand' 
          ? APP_DATA.secondhand.find(s => s.id === r.targetId)
          : APP_DATA.mutual.find(m => m.id === r.targetId);
        return `
          <div class="admin-item">
            <div class="title-row">
              <span class="title">举报：${target?.title || '已删除'}</span>
              <span class="type-tag">${r.targetType === 'secondhand' ? '二手' : '互助'}</span>
            </div>
            <div class="meta">
              原因：${r.reason}<br>
              举报人：${getUser(r.reporterId)?.nickname || '匿名'}
            </div>
            <div class="actions">
              <button class="btn-reject" onclick="handleReport(${r.id})">下架处理</button>
              <button class="btn-ignore" onclick="ignoreReport(${r.id})">忽略</button>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function handleReport(id) {
  const report = APP_DATA.reports.find(r => r.id === id);
  if (report) {
    report.status = 'handled';
    const arr = report.targetType === 'secondhand' ? APP_DATA.secondhand : APP_DATA.mutual;
    const target = arr.find(i => i.id === report.targetId);
    if (target) target.status = 'removed';
  }
  adminRender();
  render();
  toast('已处理举报');
}

function ignoreReport(id) {
  const report = APP_DATA.reports.find(r => r.id === id);
  if (report) report.status = 'handled';
  adminRender();
  toast('已忽略');
}

function renderCorrection() {
  const corrections = APP_DATA.corrections.filter(c => c.status === 'pending');
  
  if (!corrections.length) {
    return '<div class="empty-state"><span class="icon">✅</span><p>暂无待核实纠错</p></div>';
  }
  
  return `
    <div class="admin-list">
      ${corrections.map(c => {
        const place = APP_DATA.places.find(p => p.id === c.targetId);
        return `
          <div class="admin-item">
            <div class="title-row">
              <span class="title">纠错：${place?.name || '已删除'}</span>
              <span class="type-tag">信息纠错</span>
            </div>
            <div class="meta">
              纠错内容：${c.content}<br>
              提交人：${getUser(c.userId)?.nickname || '匿名'}
            </div>
            <div class="actions">
              <button class="btn-approve" onclick="acceptCorrection(${c.id})">采纳</button>
              <button class="btn-ignore" onclick="rejectCorrection(${c.id})">驳回</button>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function acceptCorrection(id) {
  const correction = APP_DATA.corrections.find(c => c.id === id);
  if (correction) {
    correction.status = 'resolved';
  }
  adminRender();
  toast('已采纳纠错');
}

function rejectCorrection(id) {
  const correction = APP_DATA.corrections.find(c => c.id === id);
  if (correction) {
    correction.status = 'rejected';
  }
  adminRender();
  toast('已驳回纠错');
}

function renderManage() {
  const items = [
    ...APP_DATA.secondhand.map(s => ({ ...s, type: 'secondhand' })),
    ...APP_DATA.mutual.map(m => ({ ...m, type: 'mutual' })),
  ];
  
  return `
    <div class="admin-list">
      ${items.map(item => {
        const user = getUser(item.userId);
        return `
          <div class="admin-item">
            <div class="title-row">
              <span class="title">${item.title}</span>
              <span class="type-tag">${item.type === 'secondhand' ? '二手' : '互助'}</span>
            </div>
            <div class="meta">
              发布者：${user?.nickname || '匿名'}<br>
              状态：${getStatusText(item.status)}
              ${item.type === 'secondhand' ? ` · ¥${item.price}` : ''}
            </div>
            <div class="actions">
              <button class="btn-edit" onclick="editItem(${item.id},'${item.type}')">编辑</button>
              ${item.status !== 'removed' ? `
                <button class="btn-reject" onclick="takeDown(${item.id},'${item.type}')">下架</button>
              ` : ''}
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function takeDown(id, type) {
  const arr = type === 'secondhand' ? APP_DATA.secondhand : APP_DATA.mutual;
  const item = arr.find(i => i.id === id);
  if (item) item.status = 'removed';
  adminRender();
  render();
  toast('已下架');
}

function editItem(id, type) {
  const arr = type === 'secondhand' ? APP_DATA.secondhand : APP_DATA.mutual;
  const item = arr.find(i => i.id === id);
  if (!item) return;
  
  const html = `
    <div class="sheet-header">
      <h3>编辑内容</h3>
      <div class="close" onclick="closeSheet()">✕</div>
    </div>
    <div class="sheet-form">
      <div class="form-group">
        <label>标题</label>
        <input id="editTitle" value="${item.title}">
      </div>
      <div class="form-group">
        <label>描述</label>
        <textarea id="editDesc">${item.description}</textarea>
      </div>
      <button class="btn" onclick="saveEdit(${id},'${type}')">保存</button>
    </div>
  `;
  document.getElementById('sheetContent').innerHTML = html;
  document.getElementById('sheetMask').classList.add('show');
}

function saveEdit(id, type) {
  const arr = type === 'secondhand' ? APP_DATA.secondhand : APP_DATA.mutual;
  const item = arr.find(i => i.id === id);
  if (item) {
    item.title = document.getElementById('editTitle').value.trim() || item.title;
    item.description = document.getElementById('editDesc').value.trim() || item.description;
  }
  closeSheet();
  adminRender();
  render();
  toast('已保存');
}

render();
adminRender();
</script>
</body>
</html>
