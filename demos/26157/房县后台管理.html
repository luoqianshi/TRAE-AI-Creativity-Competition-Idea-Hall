<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI社工后台管理系统 - 全功能版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#F0F2F5;overflow:hidden}
.app{display:flex;height:100vh}

/* ===== 侧边栏 ===== */
.sidebar{width:230px;background:#1F2937;color:#fff;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;overflow-x:hidden}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px}
.sidebar-logo{padding:18px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.sidebar-logo .li{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sidebar-logo .lt{font-size:15px;font-weight:700}
.sidebar-logo .ls{font-size:10px;color:#9CA3AF;margin-top:1px}
.sidebar-nav{padding:10px 6px;flex:1}
.ng{margin-bottom:12px}
.ngt{font-size:10px;color:#6B7280;padding:0 12px;margin-bottom:4px;letter-spacing:.5px;font-weight:600}
.ni{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;transition:all .12s;font-size:13px;color:#D1D5DB;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni:hover{background:rgba(255,255,255,.06);color:#fff}
.ni.act{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(102,126,234,.3)}
.ni .ic{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.ni .nb{margin-left:auto;background:#EF4444;color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:600;flex-shrink:0}

/* ===== 主区域 ===== */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:54px;background:#fff;display:flex;align-items:center;padding:0 24px;gap:16px;border-bottom:1px solid #E5E7EB;flex-shrink:0}
.topbar-title{font-size:16px;font-weight:600;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-shrink:0}
.topbar-user{display:flex;align-items:center;gap:8px;font-size:13px;color:#666}
.topbar-av{width:32px;height:32px;border-radius:50%;background:#E0E7FF;display:flex;align-items:center;justify-content:center;font-size:14px}
.topbar-dot{width:8px;height:8px;border-radius:50%;background:#16A34A}
.topbar-btn{padding:6px 14px;border-radius:8px;background:#F2F3F5;color:#666;font-size:12px;cursor:pointer;border:none;font-family:inherit}
.topbar-btn:hover{background:#E5E7EB}

.content{flex:1;overflow-y:auto;padding:20px 24px}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:#D1D5DB;border-radius:3px}

/* ===== 页面 ===== */
.page{display:none}
.page.act{display:block}

/* ===== 通用组件 ===== */
.panel{background:#fff;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.pt{font-size:14px;font-weight:600;color:#333;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.pt .pm{font-size:12px;color:#2563EB;cursor:pointer;font-weight:400}
.btn{padding:7px 14px;border-radius:8px;font-size:12px;cursor:pointer;border:none;font-family:inherit;transition:all .12s;font-weight:500;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn-p{background:#2563EB;color:#fff}
.btn-o{background:#fff;color:#2563EB;border:1px solid #DBEAFE}
.btn-d{background:#FEF2F2;color:#EF4444;border:1px solid #FECACA}
.btn-s{background:#F0FDF4;color:#16A34A;border:1px solid #BBF7D0}
.btn-g{background:#F2F3F5;color:#666}
.btn-w{background:#fff;color:#333;border:1px solid #E5E7EB}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:500}
.b-blue{background:#EFF6FF;color:#2563EB}.b-green{background:#F0FDF4;color:#16A34A}
.b-orange{background:#FFF7ED;color:#EA580C}.b-red{background:#FEF2F2;color:#EF4444}
.b-purple{background:#FDF4FF;color:#7C3AED}.b-gray{background:#F2F3F5;color:#6B7280}

.table{width:100%;border-collapse:collapse}
.table th{font-size:12px;font-weight:600;color:#9CA3AF;text-align:left;padding:10px 12px;border-bottom:1px solid #F0F0F0;white-space:nowrap}
.table td{font-size:13px;color:#333;padding:10px 12px;border-bottom:1px solid #F5F5F5}
.table tr:hover td{background:#FAFBFC}
.table tr:last-child td{border-bottom:none}

/* 统计卡片 */
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.sc{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.sc .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sc .sl{font-size:12px;color:#9CA3AF}
.sc .si{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px}
.sc .sv{font-size:24px;font-weight:700;color:#333;margin-bottom:2px}
.sc .sc2{font-size:11px;display:flex;align-items:center;gap:4px}
.sc .up{color:#16A34A}.sc .dn{color:#EF4444}

/* 搜索栏 */
.sb{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.si{height:34px;border:1px solid #E5E7EB;border-radius:8px;padding:0 12px;font-size:13px;outline:none;font-family:inherit;background:#fff;width:200px}
.si:focus{border-color:#2563EB}
.ss{height:34px;border:1px solid #E5E7EB;border-radius:8px;padding:0 10px;font-size:13px;outline:none;font-family:inherit;background:#fff;appearance:none;min-width:110px}

/* 弹窗 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.ms{background:#fff;border-radius:16px;width:100%;max-width:640px;max-height:85vh;overflow:hidden;display:flex;flex-direction:column;animation:mIn .25s ease-out}
@keyframes mIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.mh{padding:16px 20px;border-bottom:1px solid #F0F0F0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.mt{font-size:16px;font-weight:700;color:#333}
.mx{font-size:20px;color:#9CA3AF;cursor:pointer;line-height:1}
.mb{padding:20px;overflow-y:auto;flex:1}
.mb::-webkit-scrollbar{width:4px}
.mb::-webkit-scrollbar-thumb{background:#D1D5DB;border-radius:2px}
.mf{padding:14px 20px;border-top:1px solid #F0F0F0;display:flex;gap:10px;justify-content:flex-end;flex-shrink:0}

/* 表单 */
.fg{margin-bottom:14px}
.fl{font-size:13px;font-weight:500;color:#333;margin-bottom:5px;display:block}
.fi{width:100%;height:38px;border:1px solid #E5E7EB;border-radius:8px;padding:0 12px;font-size:13px;outline:none;font-family:inherit;transition:all .12s}
.fi:focus{border-color:#2563EB}
.ft{width:100%;min-height:72px;border:1px solid #E5E7EB;border-radius:8px;padding:10px 12px;font-size:13px;outline:none;font-family:inherit;resize:none;line-height:1.5}
.ft:focus{border-color:#2563EB}
.fsel{width:100%;height:38px;border:1px solid #E5E7EB;border-radius:8px;padding:0 12px;font-size:13px;outline:none;font-family:inherit;background:#fff;appearance:none}
.fr{display:flex;gap:12px}
.fr .fg{flex:1}

/* 详情 */
.dh{display:flex;align-items:center;gap:16px;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid #F0F0F0}
.da{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.di{flex:1;min-width:0}
.dn{font-size:18px;font-weight:700;color:#333;margin-bottom:3px}
.dm{font-size:12px;color:#9CA3AF;display:flex;gap:10px;flex-wrap:wrap}
.dt{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.ii{background:#F9FAFB;border-radius:8px;padding:10px 12px}
.ii .ik{font-size:11px;color:#9CA3AF;margin-bottom:3px}
.ii .iv{font-size:13px;font-weight:600;color:#333}

/* 时间线 */
.tl{padding-left:18px;position:relative}
.tl::before{content:'';position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:#E5E7EB}
.tli{position:relative;padding-bottom:14px}
.tli::before{content:'';position:absolute;left:-15px;top:4px;width:8px;height:8px;border-radius:50%;background:#2563EB;border:2px solid #fff}
.tlt{font-size:11px;color:#9CA3AF;margin-bottom:3px}
.tlc{font-size:13px;color:#333}

/* 风险 */
.ri{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border-radius:10px;border-left:3px solid;margin-bottom:8px}
.ri.rh{border-left-color:#EF4444}.ri.rm{border-left-color:#F59E0B}.ri.rl{border-left-color:#16A34A}
.ri .ric{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.ri .rii{flex:1;min-width:0}
.ri .rit{font-size:13px;font-weight:600;color:#333}
.ri .rid{font-size:11px;color:#9CA3AF;margin-top:2px}

/* 工具卡片 */
.tc{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border-radius:10px;border:1px solid #F0F0F0;margin-bottom:8px}
.tc .tci{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tc .tci2{flex:1;min-width:0}
.tc .tcn{font-size:13px;font-weight:600;color:#333}
.tc .tcm{font-size:11px;color:#9CA3AF;margin-top:2px}
.tc .tcs{font-size:12px;font-weight:600;padding:4px 10px;border-radius:6px;flex-shrink:0}

/* 知识库 */
.kc{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.kb{padding:6px 14px;border-radius:20px;font-size:12px;background:#F2F3F5;color:#666;cursor:pointer;border:none;font-family:inherit;transition:all .12s}
.kb.act{background:#2563EB;color:#fff}
.qa{background:#fff;border-radius:10px;padding:14px;border:1px solid #F0F0F0;margin-bottom:10px;cursor:pointer;transition:all .12s}
.qa:hover{border-color:#93C5FD}
.qa .qq{font-size:14px;font-weight:600;color:#333;margin-bottom:6px}
.qa .qaa{font-size:13px;color:#666;line-height:1.6}
.qa .qat{display:flex;gap:4px;margin-top:8px}
.qatag{font-size:10px;padding:2px 8px;border-radius:4px;background:#EFF6FF;color:#2563EB}

/* 配置 */
.cs{background:#fff;border-radius:12px;padding:18px;margin-bottom:16px}
.cst{font-size:15px;font-weight:600;color:#333;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #F0F0F0}
.ci{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #F5F5F5}
.ci:last-child{border-bottom:none}
.cil{font-size:13px;color:#333}
.cid{font-size:11px;color:#9CA3AF;margin-top:2px}
.sw{position:relative;width:42px;height:22px;background:#E5E7EB;border-radius:11px;cursor:pointer;transition:all .2s;flex-shrink:0}
.sw.on{background:#2563EB}
.sw::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:2px;left:2px;transition:all .2s;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.sw.on::after{left:22px}

/* 对话 */
.cc{display:flex;gap:14px;height:calc(100vh - 130px)}
.cl{width:250px;background:#fff;border-radius:12px;padding:10px;overflow-y:auto;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.cl::-webkit-scrollbar{width:4px}
.cl::-webkit-scrollbar-thumb{background:#D1D5DB;border-radius:2px}
.clt{font-size:13px;font-weight:600;color:#333;margin-bottom:8px;padding:0 4px}
.cu{display:flex;align-items:center;gap:8px;padding:9px 8px;border-radius:8px;cursor:pointer;transition:all .12s;margin-bottom:1px}
.cu:hover{background:#F9FAFB}
.cu.act{background:#EFF6FF}
.cu .cua{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.cu .cui{flex:1;min-width:0}
.cu .cun{font-size:13px;font-weight:500;color:#333}
.cu .cum{font-size:11px;color:#9CA3AF;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cu .cuu{width:17px;height:17px;border-radius:50%;background:#EF4444;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.cm{flex:1;background:#fff;border-radius:12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.cmh{height:50px;border-bottom:1px solid #F0F0F0;display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0}
.cmb{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.cmb::-webkit-scrollbar{width:4px}
.cmb::-webkit-scrollbar-thumb{background:#D1D5DB;border-radius:2px}
.cmf{border-top:1px solid #F0F0F0;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-shrink:0}
.cmfi{flex:1;height:36px;border:1px solid #E5E7EB;border-radius:8px;padding:0 12px;font-size:13px;outline:none;font-family:inherit}
.cmfi:focus{border-color:#2563EB}
.cbr{max-width:70%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6;word-break:break-word}
.cbr.ai{background:#F3F4F6;color:#333;align-self:flex-start;border-bottom-left-radius:4px}
.cbr.user{background:#2563EB;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.cbrw{display:flex;gap:8px}

/* 进度条 */
.pb{height:6px;background:#F2F3F5;border-radius:3px;overflow:hidden}
.pf{height:100%;border-radius:3px}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(16px);background:rgba(0,0,0,.78);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;opacity:0;transition:all .25s;z-index:999;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">

<!-- ===== 侧边栏 ===== -->
<div class="sidebar">
  <div class="sidebar-logo">
    <div class="li">&#129420;</div>
    <div><div class="lt">AI社工管理</div><div class="ls">房县智慧社区后台</div></div>
  </div>
  <div class="sidebar-nav">
    <div class="ng"><div class="ngt">概览</div>
      <div class="ni act" data-p="dashboard" onclick="go('dashboard',this)"><span class="ic">&#128202;</span>数据仪表盘</div>
    </div>
    <div class="ng"><div class="ngt">居民服务</div>
      <div class="ni" data-p="residents" onclick="go('residents',this)"><span class="ic">&#128101;</span>居民管理<span class="nb">1,286</span></div>
      <div class="ni" data-p="tools" onclick="go('tools',this)"><span class="ic">&#128295;</span>工具借用<span class="nb">12</span></div>
      <div class="ni" data-p="daren" onclick="go('daren',this)"><span class="ic">&#11088;</span>达人管理<span class="nb">8</span></div>
      <div class="ni" data-p="exchange" onclick="go('exchange',this)"><span class="ic">&#128230;</span>旧物交换<span class="nb">36</span></div>
    </div>
    <div class="ng"><div class="ngt">运营管理</div>
      <div class="ni" data-p="announce" onclick="go('announce',this)"><span class="ic">&#128227;</span>公告管理</div>
      <div class="ni" data-p="risk" onclick="go('risk',this)"><span class="ic">&#9888;</span>风险预警<span class="nb" style="background:#F59E0B">3</span></div>
      <div class="ni" data-p="aichat" onclick="go('aichat',this)"><span class="ic">&#129302;</span>AI对话监控<span class="nb">5</span></div>
    </div>
    <div class="ng"><div class="ngt">AI知识库</div>
      <div class="ni" data-p="kbqa" onclick="go('kbqa',this)"><span class="ic">&#128218;</span>问答管理</div>
      <div class="ni" data-p="kbconfig" onclick="go('kbconfig',this)"><span class="ic">&#9881;</span>预设配置</div>
      <div class="ni" data-p="kbtrain" onclick="go('kbtrain',this)"><span class="ic">&#128200;</span>训练数据</div>
    </div>
    <div class="ng"><div class="ngt">系统</div>
      <div class="ni" data-p="report" onclick="go('report',this)"><span class="ic">&#128202;</span>报表统计</div>
      <div class="ni" data-p="settings" onclick="go('settings',this)"><span class="ic">&#128295;</span>系统设置</div>
      <div class="ni" data-p="permission" onclick="go('permission',this)"><span class="ic">&#128272;</span>权限管理</div>
    </div>
  </div>
</div>

<!-- ===== 主区域 ===== -->
<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="tt">数据仪表盘</div>
    <div class="topbar-right">
      <button class="topbar-btn" onclick="showToast('刷新成功')">&#128260; 刷新</button>
      <button class="topbar-btn" onclick="showToast('导出成功')">&#128196; 导出</button>
      <div class="topbar-user"><div class="topbar-av">&#128100;</div><span>管理员</span><div class="topbar-dot"></div></div>
    </div>
  </div>
  <div class="content" id="ct"></div>
</div>
</div>

<!-- ===== 弹窗容器 ===== -->
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="ms">
    <div class="mh"><span class="mt" id="modalTitle">标题</span><span class="mx" onclick="closeModal()">&#10005;</span></div>
    <div class="mb" id="modalBody"></div>
    <div class="mf" id="modalFooter"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== 页面模板 =====
const pages = {};

// ---------- 仪表盘 ----------
pages.dashboard = () => `
<div class="sg">
  <div class="sc"><div class="sh"><span class="sl">注册居民</span><div class="si" style="background:#EFF6FF">&#128101;</div></div><div class="sv">1,286</div><div class="sc2 up">&#9650; +32 本周</div></div>
  <div class="sc"><div class="sh"><span class="sl">今日服务</span><div class="si" style="background:#F0FDF4">&#128640;</div></div><div class="sv">89</div><div class="sc2 up">&#9650; +12</div></div>
  <div class="sc"><div class="sh"><span class="sl">工具借出</span><div class="si" style="background:#FFF7ED">&#128295;</div></div><div class="sv">12</div><div class="sc2 dn">&#9660; 3件到期</div></div>
  <div class="sc"><div class="sh"><span class="sl">风险预警</span><div class="si" style="background:#FEF2F2">&#9888;</div></div><div class="sv">3</div><div class="sc2 dn">&#9660; 1条高风险</div></div>
</div>
<div style="display:grid;grid-template-columns:5fr 3fr;gap:16px;margin-bottom:16px">
  <div class="panel">
    <div class="pt">最近服务记录 <span class="pm" onclick="go('residents')">查看全部 &#8250;</span></div>
    <table class="table"><thead><tr><th>居民</th><th>服务类型</th><th>时间</th><th>状态</th></tr></thead><tbody>
      <tr><td><b>张德明</b></td><td>工具借用 - 锤子</td><td>10:32</td><td><span class="badge b-green">进行中</span></td></tr>
      <tr><td><b>李小红</b></td><td>达人匹配 - 家电维修</td><td>10:15</td><td><span class="badge b-blue">已匹配</span></td></tr>
      <tr><td><b>王建国</b></td><td>信息录入 - 低保户</td><td>09:48</td><td><span class="badge b-green">已完成</span></td></tr>
      <tr><td><b>赵阿姨</b></td><td>旧物交换 - 发布</td><td>09:30</td><td><span class="badge b-orange">审核中</span></td></tr>
      <tr><td><b>刘妈妈</b></td><td>工具归还 - 轮椅</td><td>09:12</td><td><span class="badge b-green">已归还</span></td></tr>
      <tr><td><b>陈医生</b></td><td>达人申报</td><td>08:55</td><td><span class="badge b-purple">待审核</span></td></tr>
    </tbody></table>
  </div>

function go(name, el) {
  document.querySelectorAll('.ni').forEach(n => n.classList.remove('act'));
  if (el) el.classList.add('act');
  document.getElementById('ct').innerHTML = pages[name]();
  document.getElementById('tt').textContent = titles[name] || name;
}

function openModal(title, body, footer) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalFooter').innerHTML = footer || '';
  document.getElementById('modal').classList.add('on');
}
function closeModal() {
  document.getElementById('modal').classList.remove('on');
}

let toastTimer;
function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// 初始化
go('dashboard', document.querySelector('.ni.act'));
