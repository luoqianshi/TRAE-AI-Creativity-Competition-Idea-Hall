<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>记忆花园 · 创意原型</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(180deg, #f7f3e8 0%, #e8e0d3 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .prototype {
      max-width: 400px;
      width: 100%;
      background: #ffffff;
      border-radius: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      border: 1px solid rgba(184, 156, 114, 0.2);
    }
    .header {
      background: #5d8c6b;
      padding: 30px 20px 20px;
      text-align: center;
      color: #fff;
      border-bottom-left-radius: 30px;
      border-bottom-right-radius: 30px;
      position: relative;
    }
    .header::after {
      content: '';
      position: absolute;
      bottom: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 5px;
      background: #d9b382;
      border-radius: 5px;
    }
    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .logo span {
      background: #fff;
      color: #5d8c6b;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .subtitle {
      font-size: 14px;
      opacity: 0.9;
      font-weight: 300;
    }
    .main-card {
      padding: 30px 20px 20px;
    }
    .greeting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
    }
    .greeting-text h2 {
      font-size: 22px;
      font-weight: 600;
      color: #4a3f35;
    }
    .greeting-text p {
      color: #8b7a62;
      margin-top: 4px;
    }
    .avatar {
      width: 60px;
      height: 60px;
      background: #f3e1c7;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      border: 2px solid #d9b382;
    }
    .task-box {
      background: #fefaf3;
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #ecd9b4;
      box-shadow: 0 8px 18px rgba(154, 114, 63, 0.08);
    }
    .task-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 600;
      color: #5e4632;
      margin-bottom: 15px;
    }
    .flower-icon {
      background: #fae24c;
      border-radius: 12px;
      padding: 4px 10px;
    }
    .memory-game {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-bottom: 15px;
    }
    .card {
      width: 70px;
      height: 90px;
      background: #fff;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.06);
      transition: 0.2s;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .card:hover {
      border-color: #c4a267;
    }
    .card.flipped {
      background: #faf0dd;
      border-color: #c4a267;
    }
    .prompt-text {
      font-size: 16px;
      color: #5e4632;
      text-align: center;
      font-weight: 500;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }
    .btn {
      flex: 1;
      padding: 14px 0;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: #e7d7bb;
      color: #5e4632;
      transition: 0.2s;
      box-shadow: 0 4px 8px rgba(0,0,0,0.04);
    }
    .btn.primary {
      background: #5d8c6b;
      color: white;
      box-shadow: 0 10px 15px -6px rgba(93,140,107,0.4);
    }
    .report-section {
      background: #fcf7ed;
      border-radius: 20px;
      padding: 16px;
      margin-top: 10px;
      font-size: 14px;
      color: #5c4b31;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge {
      background: #d9b382;
      color: white;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .footer-note {
      text-align: center;
      color: #b7a084;
      font-size: 12px;
      margin: 25px 0 10px;
    }
    hr {
      border: 0.5px solid #e2d4bc;
      margin: 16px 0;
    }
    .value-props {
      display: flex;
      justify-content: space-around;
      color: #6b5c44;
      font-size: 13px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="prototype">
    <div class="header">
      <div class="logo">
        <span>🌸</span> 记忆花园
      </div>
      <div class="subtitle">守护每一份珍贵的回忆</div>
    </div>
    <div class="main-card">
      <div class="greeting">
        <div class="greeting-text">
          <h2>下午好，李爷爷 👋</h2>
          <p>今天的认知训练开始啦</p>
        </div>
        <div class="avatar">👴</div>
      </div>

      <div class="task-box">
        <div class="task-title">
          <span class="flower-icon">🌼</span> 今日任务：记住花园里的物品
        </div>
        <div class="memory-game">
          <div class="card">🌻</div>
          <div class="card flipped">🐦</div>
          <div class="card">🍎</div>
          <div class="card">📖</div>
        </div>
        <div class="prompt-text">“请选出刚才出现过的小鸟”</div>
        <div class="btn-group">
          <button class="btn">🌻 向日葵</button>
          <button class="btn primary">🐦 小鸟</button>
        </div>
        <div style="text-align:right; margin-top:10px; font-size:13px; color:#b1946b;">语音提问中 🎤</div>
      </div>

      <div class="report-section">
        <span>📊 本周训练报告</span>
        <span class="badge">认知评分 +3%</span>
      </div>
      <div style="margin-top:12px;">
        <button class="btn primary" style="width:100%;">📞 呼叫子女共同陪伴</button>
      </div>
      <hr>
      <div class="value-props">
        <span>🧠 认知刺激疗法</span>
        <span>👪 家庭互动报告</span>
        <span>🏠 社区机构SaaS</span>
      </div>
      <div class="footer-note">
        记忆花园 · 阿尔茨海默症认知训练与社会公益平台<br>创意原型由 TRAE Work 生成
      </div>
    </div>
  </div>
</body>
</html>
