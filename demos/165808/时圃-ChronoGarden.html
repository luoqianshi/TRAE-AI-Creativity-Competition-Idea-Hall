    var total = monthEnd - monthStart;
    var passed = now - monthStart;
    return Math.min(100, Math.max(0, passed / total * 100));
  }

  function showToast(msg) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function () { toast.classList.remove('show'); }, 2200);
  }

  function getFlower(id) { return FLOWERS.find(function (f) { return f.id === id; }); }

  function getStageIndex(plot) {
    var cfg = MODE_CONFIG[plot.mode] || MODE_CONFIG.countdown;
    if (!plot.flowerId) return 0;
    if (plot.mode === 'countdown') {
      if (plot.finished) return 4;
      var ratio = Math.max(0, Math.min(1, (Date.now() - plot.startTime) / plot.duration));
      var idx = 0;
      for (var i = 0; i < cfg.thresholds.length; i++) { if (ratio >= cfg.thresholds[i]) idx = i; }
      return idx;
    }
    if (plot.mode === 'countup') {
      var elapsed = Date.now() - plot.startTime;
      var idx2 = 0;
      for (var j = 0; j < cfg.thresholds.length; j++) { if (elapsed >= cfg.thresholds[j]) idx2 = j; }
      return idx2;
    }
    if (plot.mode === 'monthly') {
      var months = elapsedMonths(plot.startTime);
      var idx3 = 0;
      for (var k = 0; k < cfg.thresholds.length; k++) { if (months >= cfg.thresholds[k]) idx3 = k; }
      return idx3;
    }
    return 0;
  }

  function stageFor(plot) {
    if (!plot.flowerId) return { svg: SVG_SEED, label: '点击播种' };
    var idx = getStageIndex(plot);
    var growth = GROWTH_STAGES[idx];
    var s = growth.svg === null ? FLOWER_SVGS[plot.flowerId] : growth.svg;
    return { svg: s, label: growth.label };
  }

  function timerText(plot) {
    if (!plot.flowerId) return '';
    if (plot.mode === 'countdown') {
      if (plot.finished) return '可收获';
      return formatTime(Math.max(0, plot.startTime + plot.duration - Date.now()));
    }
    if (plot.mode === 'countup') return formatTime(Date.now() - plot.startTime);
    if (plot.mode === 'monthly') {
      var start = new Date(plot.startTime);
      var now = new Date();
      var months = (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth());
      var days = now.getDate() - start.getDate();
      if (days < 0) {
        months -= 1;
        var prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
        days += prevMonth.getDate();
      }
      return months + ' 个月 ' + days + ' 天';
    }
    return '';
  }

  function progress(plot) {
    if (!plot.flowerId) return 0;
    var idx = getStageIndex(plot);
    if (plot.mode === 'countdown') {
      if (plot.finished) return 100;
      return Math.max(0, Math.min(100, (Date.now() - plot.startTime) / plot.duration * 100));
    }
    if (plot.mode === 'countup') {
      var thresholds = MODE_CONFIG.countup.thresholds;
      if (idx >= 4) return 100;
      var lower = thresholds[idx];
      var upper = thresholds[idx + 1];
      var elapsed = Date.now() - plot.startTime;
      return Math.max(0, Math.min(100, (elapsed - lower) / (upper - lower) * 100));
    }
    if (plot.mode === 'monthly') {
      if (idx >= 4) return 100;
      return monthProgress(plot.startTime);
    }
    return 0;
  }

  function checkFinished() {
    var changed = false;
    state.plots.forEach(function (plot) {
      if (plot.mode === 'countdown' && plot.flowerId && !plot.finished && Date.now() >= plot.startTime + plot.duration) {
        plot.finished = true; changed = true;
      }
    });
    if (changed) saveState();
  }

  function addXp(amount) {
    state.xp += amount;
    var newLevel = Math.floor(state.xp / 60) + 1;
    if (newLevel > state.level) {
      state.level = newLevel;
      showToast('升级啦！Lv.' + state.level + ' 园丁');
    }
  }

  function harvest(plot) {
    var flower = getFlower(plot.flowerId);
    state.catalog[flower.id] = (state.catalog[flower.id] || 0) + 1;
    addXp(Math.max(5, Math.floor(plot.duration / 60000)));
    plot.flowerId = null; plot.startTime = null; plot.duration = 0; plot.finished = false;
    saveState(); render();
    showToast('收获了 ' + flower.name + '！已收录图鉴');
  }

  function plant(plotIndex) {
    var plot = state.plots[plotIndex];
    if (!plot.unlocked || plot.flowerId) return;
    var flower = getFlower(selectedFlower);
    if (flower.premium && !state.pro) { showToast('该种子需要 Pro 才能种植'); return; }
    var duration = 0;
    if (currentMode === 'countdown') {
      var minutes = parseInt(document.getElementById('duration').value, 10);
      if (!minutes || minutes < 1) { showToast('请先设置种植时长'); return; }
      duration = minutes * 60 * 1000;
    }
    plot.flowerId = selectedFlower;
    plot.mode = currentMode;
    plot.duration = duration;
    plot.startTime = Date.now();
    plot.finished = false;
    saveState(); render();
    var modeName = currentMode === 'countdown' ? '倒计时' : currentMode === 'countup' ? '正计时' : '月度成长';
    showToast('种下 ' + flower.name + '（' + modeName + '）');
  }

  function cancel(plotIndex) {
    var plot = state.plots[plotIndex];
    if (!plot.flowerId) return;
    plot.flowerId = null; plot.mode = 'countdown'; plot.startTime = null; plot.duration = 0; plot.finished = false;
    saveState(); render();
    showToast('已清除这块田地');
  }

  function renderSeeds() {
    var bar = document.getElementById('seedBar');
    bar.innerHTML = '';
    FLOWERS.forEach(function (f) {
      var chip = document.createElement('button');
      chip.className = 'seed-chip';
      if (f.premium) chip.classList.add('premium');
      if (f.premium && state.pro) chip.classList.add('unlocked');
      if (selectedFlower === f.id) chip.classList.add('active');
      chip.innerHTML = '<span class="seed-emoji">' + FLOWER_SVGS[f.id] + '</span><span>' + f.name + '</span>';
      chip.title = f.desc;
      chip.addEventListener('click', function () {
        if (f.premium && !state.pro) { showToast('升级 Pro 解锁 ' + f.name); return; }
        selectedFlower = f.id;
        renderSeeds();
      });
      bar.appendChild(chip);
    });
  }

  function renderMode() {
    document.querySelectorAll('.mode-chip').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.mode === currentMode);
    });
    var timeBar = document.querySelector('.time-bar');
    timeBar.classList.toggle('hidden', currentMode !== 'countdown');
  }

  function renderGarden() {
    var garden = document.getElementById('garden');
    garden.innerHTML = '';
    state.plots.forEach(function (plot) {
      var el = document.createElement('div');
      el.className = 'plot' + (!plot.flowerId ? ' empty' : '') + (!plot.unlocked ? ' locked' : '');
      var idxSpan = document.createElement('span');
      idxSpan.className = 'plot-index';
      idxSpan.textContent = '田 ' + (plot.index + 1);
      el.appendChild(idxSpan);

      if (plot.unlocked) {
        var stage = stageFor(plot);
        var plantEl = document.createElement('div');
        plantEl.className = 'plant-stage';
        plantEl.innerHTML = stage.svg;
        el.appendChild(plantEl);

        var info = document.createElement('div');
        info.className = 'plot-info';
        var name = document.createElement('span');
        name.className = 'plot-name';
        var flowerName = plot.flowerId ? getFlower(plot.flowerId).name : '';
        name.textContent = plot.flowerId ? flowerName + ' · ' + stage.label : stage.label;
        info.appendChild(name);

        if (plot.flowerId) {
          var timer = document.createElement('div');
          timer.className = 'plot-timer';
          timer.textContent = timerText(plot);
          timer.id = 'timer-' + plot.index;
          info.appendChild(timer);
        }
        el.appendChild(info);

        var bar = document.createElement('div');
        bar.className = 'progress-bar';
        var fill = document.createElement('div');
        fill.className = 'progress-fill';
        fill.id = 'progress-' + plot.index;
        fill.style.width = progress(plot) + '%';
        bar.appendChild(fill);
        el.appendChild(bar);

        var actions = document.createElement('div');
        actions.className = 'plot-actions';
        if (plot.flowerId) {
          var actionBtn = document.createElement('button');
          actionBtn.className = 'icon-btn';
          actionBtn.textContent = (plot.mode === 'countdown' && plot.finished) ? '\u2702\uFE0F' : '\u23F9';
          actionBtn.title = (plot.mode === 'countdown' && plot.finished) ? '收获' : '铲除';
          actionBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            if (plot.mode === 'countdown' && plot.finished) harvest(plot);
            else cancel(plot.index);
          });
          actions.appendChild(actionBtn);
        }
        el.appendChild(actions);

        el.addEventListener('click', function () {
          if (plot.mode === 'countdown' && plot.finished) harvest(plot);
          else if (!plot.flowerId) plant(plot.index);
        });
      } else {
        var lock = document.createElement('div');
        lock.className = 'plant-stage';
        lock.innerHTML = SVG_LOCK;
        el.appendChild(lock);
        var lockInfo = document.createElement('div');
        lockInfo.className = 'plot-info';
        var lockName = document.createElement('span');
        lockName.className = 'plot-name';
        lockName.textContent = 'Pro 解锁';
        lockInfo.appendChild(lockName);
        el.appendChild(lockInfo);
      }
      garden.appendChild(el);
    });
  }

  function renderCatalog() {
    var grid = document.getElementById('catalog');
    grid.innerHTML = '';
    FLOWERS.forEach(function (f) {
      var count = state.catalog[f.id] || 0;
      var locked = f.premium && !state.pro;
      var item = document.createElement('div');
      item.className = 'catalog-item' + (locked ? ' locked' : '');
      item.title = f.desc;
      item.innerHTML = '<span class="emoji">' + (locked ? SVG_LOCK : FLOWER_SVGS[f.id]) + '</span><span class="name">' + f.name + '</span><span class="count">x' + count + '</span>';
      grid.appendChild(item);
    });
  }

  function renderProfile() {
    document.getElementById('level').textContent = state.level;
    var badge = document.getElementById('proBadge');
    badge.classList.toggle('active', state.pro);
    if (state.pro) {
      var proCard = document.getElementById('proCard');
      proCard.querySelector('h2').textContent = '\u2728 已是 Pro 花圃';
      proCard.querySelector('ul').innerHTML = '<li>已解锁额外 4 块花田</li><li>已解锁珍稀花卉种子</li><li>专属场景开发中</li>';
      document.getElementById('btnPro').textContent = 'Pro 已生效';
      document.getElementById('btnPro').disabled = true;
    }
  }

  function renderInvite() {
    document.getElementById('myCode').textContent = state.inviteCode || '------';
  }

  function render() {
    if (timerId) { clearInterval(timerId); timerId = null; }
    checkFinished();
    renderSeeds();
    renderMode();
    renderGarden();
    renderCatalog();
    renderProfile();
    renderInvite();
    ensureTimerLoop();
  }

  function startTimerLoop() {
    if (timerId) return;
    timerId = setInterval(function () {
      var any = false;
      state.plots.forEach(function (plot) {
        if (!plot.flowerId) return;
        any = true;
        var t = document.getElementById('timer-' + plot.index);
        var p = document.getElementById('progress-' + plot.index);
        if (t) t.textContent = timerText(plot);
        if (p) p.style.width = progress(plot) + '%';
        if (plot.mode === 'countdown' && !plot.finished && Date.now() >= plot.startTime + plot.duration) {
          plot.finished = true; saveState(); renderGarden();
          showToast('一朵花盛开了，快来收获吧！');
        }
      });
      if (!any) { clearInterval(timerId); timerId = null; }
    }, 1000);
  }

  function ensureTimerLoop() {
    var hasRunning = state.plots.some(function (p) { return p.flowerId && !(p.mode === 'countdown' && p.finished); });
    if (hasRunning) startTimerLoop();
  }

  function setMode(mode) {
    currentMode = mode;
    state.mode = mode;
    saveState();
    render();
  }

  function generateCode() {
    var code = Math.random().toString(36).slice(2, 8).toUpperCase();
    state.inviteCode = code;
    saveState();
    renderInvite();
    showToast('邀请码已生成：' + code);
  }

  function joinCode() {
    var input = document.getElementById('inputCode');
    var code = input.value.trim().toUpperCase();
    if (!code) return;
    if (code === state.inviteCode) { showToast('不能加入自己的花圃哦'); return; }
    showToast('成功加入 ' + code + ' 的联机花圃（演示）');
    input.value = '';
  }

  function unlockPro() {
    if (state.pro) return;
    state.pro = true;
    for (var i = STARTER_PLOTS; i < TOTAL_PLOTS; i++) {
      state.plots[i].unlocked = true;
    }
    saveState(); render();
    showToast('Pro 花圃已解锁！');
  }

  function bindEvents() {
    document.querySelectorAll('.quick-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { document.getElementById('duration').value = btn.dataset.min; });
    });
    document.querySelectorAll('.mode-chip').forEach(function (btn) {
      btn.addEventListener('click', function () { setMode(btn.dataset.mode); });
    });
    document.getElementById('btnCode').addEventListener('click', generateCode);
    document.getElementById('btnJoin').addEventListener('click', joinCode);
    document.getElementById('btnPro').addEventListener('click', unlockPro);
  }

  function init() {
    render();
    bindEvents();
    ensureTimerLoop();
  }

  init();
})();
  </script>
</body>
</html>
