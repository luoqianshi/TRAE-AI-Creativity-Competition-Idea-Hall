<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>餐厅排队等待小游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
    background: #fff8f0;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    color: #1a1a2e;
  }
  .app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background: linear-gradient(180deg, #fff8f0 0%, #ffffff 100%);
    position: relative;
    overflow: hidden;
    padding-bottom: 80px;
  }

  /* Header */
  .header {
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-back {
    width: 38px; height: 38px;
    background: rgba(0,0,0,0.04);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    cursor: pointer;
  }
  .header-title {
    font-size: 17px;
    font-weight: 700;
  }
  .header-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, #ff6b35, #ff8c42);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    color: #fff;
  }

  /* Queue Card */
  .queue-section {
    padding: 0 20px 16px;
  }
  .queue-card {
    background: linear-gradient(135deg, #ff6b35, #ff8c42);
    border-radius: 20px;
    padding: 20px;
    color: #fff;
    box-shadow: 0 8px 24px rgba(255,107,53,0.25);
  }
  .queue-store {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .queue-row {
    display: flex;
    gap: 12px;
  }
  .queue-item {
    flex: 1;
    background: rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 14px;
    text-align: center;
  }
  .queue-item-label {
    font-size: 12px;
    opacity: 0.9;
    margin-bottom: 6px;
  }
  .queue-item-num {
    font-size: 28px;
    font-weight: 800;
  }
  .queue-wait {
    margin-top: 14px;
    text-align: center;
    font-size: 14px;
    opacity: 0.95;
  }
  .queue-wait span {
    font-weight: 700;
    font-size: 18px;
  }

  /* Progress */
  .progress-section {
    padding: 0 20px 16px;
  }
  .progress-bar {
    height: 8px;
    background: #f3f4f6;
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 35%;
    background: linear-gradient(90deg, #ff6b35, #ff8c42);
    border-radius: 4px;
    transition: width 0.5s ease;
  }
  .progress-text {
    font-size: 12px;
    color: #6b7280;
    text-align: center;
    margin-top: 8px;
  }

  /* Game Section */
  .game-section {
    padding: 0 20px;
  }
  .game-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .game-subtitle {
    font-size: 12px;
    color: #6b7280;
    font-weight: 400;
  }

  .game-area {
    background: linear-gradient(180deg, #fef3e8 0%, #fff5eb 100%);
    border: 2px solid rgba(255,107,53,0.15);
    border-radius: 20px;
    padding: 20px;
    position: relative;
    overflow: hidden;
    min-height: 340px;
  }

  /* Game Start Screen */
  .game-start {
    text-align: center;
    padding: 30px 20px;
  }
  .game-start-icon {
    font-size: 60px;
    margin-bottom: 16px;
    animation: bounce 1.5s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .game-start-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .game-start-desc {
    font-size: 13px;
    color: #6b7280;
    margin-bottom: 20px;
    line-height: 1.6;
  }
  .game-start-btn {
    background: linear-gradient(90deg, #ff6b35, #ff8c42);
    color: #fff;
    border: none;
    padding: 14px 40px;
    border-radius: 24px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(255,107,53,0.3);
  }
  .game-rewards {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 20px;
  }
  .game-reward {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #ff6b35;
    background: rgba(255,107,53,0.08);
    padding: 6px 12px;
    border-radius: 12px;
    font-weight: 600;
  }

  /* Game Play */
  .game-play {
    display: none;
  }
  .game-play.active { display: block; }
  .game-hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .game-score {
    font-size: 20px;
    font-weight: 800;
    color: #ff6b35;
  }
  .game-timer {
    font-size: 16px;
    font-weight: 700;
    background: rgba(0,0,0,0.06);
    padding: 6px 14px;
    border-radius: 20px;
    font-variant-numeric: tabular-nums;
  }
  .game-canvas-wrap {
    position: relative;
    width: 100%;
    height: 220px;
    background: linear-gradient(180deg, #e0f7fa 0%, #b2ebf2 50%, #80deea 100%);
    border-radius: 16px;
    overflow: hidden;
  }
  .game-basket {
    position: absolute;
    bottom: 10px;
    width: 50px;
    height: 40px;
    background: linear-gradient(135deg, #8d6e63, #a1887f);
    border-radius: 0 0 20px 20px;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: left 0.1s ease;
    z-index: 10;
  }
  .game-basket::before {
    content: '🧺';
  }
  .falling-item {
    position: absolute;
    font-size: 24px;
    animation: fall linear forwards;
    z-index: 5;
  }
  @keyframes fall {
    from { transform: translateY(0) rotate(0deg); }
    to { transform: translateY(240px) rotate(360deg); }
  }
  .game-controls {
    display: flex;
    gap: 12px;
    margin-top: 12px;
  }
  .game-btn {
    flex: 1;
    padding: 14px;
    background: linear-gradient(135deg, #ff6b35, #ff8c42);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .game-btn:active {
    transform: scale(0.95);
  }

  /* Game Over */
  .game-over {
    display: none;
    text-align: center;
    padding: 20px;
  }
  .game-over.active { display: block; animation: fade-in 0.5s ease; }
  @keyframes fade-in {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }
  .game-over-emoji {
    font-size: 56px;
    margin-bottom: 12px;
  }
  .game-over-title {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .game-over-score {
    font-size: 36px;
    font-weight: 800;
    color: #ff6b35;
    margin-bottom: 16px;
  }
  .game-over-reward {
    background: linear-gradient(135deg, #fff3e0, #ffe0b2);
    border: 1.5px solid rgba(255,107,53,0.2);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .reward-title {
    font-size: 14px;
    font-weight: 700;
    color: #e65100;
    margin-bottom: 10px;
  }
  .reward-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(0,0,0,0.04);
  }
  .reward-item:last-child { border-bottom: none; }
  .reward-icon {
    font-size: 24px;
  }
  .reward-text {
    flex: 1;
    text-align: left;
  }
  .reward-name {
    font-size: 14px;
    font-weight: 600;
  }
  .reward-desc {
    font-size: 12px;
    color: #6b7280;
  }
  .game-restart {
    background: linear-gradient(90deg, #ff6b35, #ff8c42);
    color: #fff;
    border: none;
    padding: 14px 36px;
    border-radius: 24px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  /* Rules */
  .rules-section {
    padding: 16px 20px;
  }
  .rules-card {
    background: #fff;
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: 16px;
    padding: 16px;
  }
  .rules-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .rule-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: #4b5563;
    padding: 6px 0;
  }
  .rule-icon {
    font-size: 18px;
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(0,0,0,0.85);
    color: #fff;
    padding: 12px 24px;
    border-radius: 24px;
    font-size: 14px;
    z-index: 200;
    transition: transform 0.3s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { transform: translate(-50%, -50%) scale(1); }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div class="header-back">←</div>
    <div class="header-title">排队小游戏</div>
    <div class="header-icon">🎮</div>
  </div>

  <div class="queue-section">
    <div class="queue-card">
      <div class="queue-store">🍲 海底捞火锅（三里屯店）</div>
      <div class="queue-row">
        <div class="queue-item">
          <div class="queue-item-label">当前叫号</div>
          <div class="queue-item-num">A42</div>
        </div>
        <div class="queue-item">
          <div class="queue-item-label">我的号码</div>
          <div class="queue-item-num" style="font-size: 32px;">A58</div>
        </div>
        <div class="queue-item">
          <div class="queue-item-label">前面还有</div>
          <div class="queue-item-num">16桌</div>
        </div>
      </div>
      <div class="queue-wait">预计等待 <span>25 分钟</span></div>
    </div>
  </div>

  <div class="progress-section">
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
    <div class="progress-text">排队进度：已等待 8 分钟 / 预计 25 分钟</div>
  </div>

  <div class="game-section">
    <div class="game-title">
      <span>🎮 等位小游戏</span>
      <span class="game-subtitle">通关领福利</span>
    </div>

    <div class="game-area">
      <!-- Start Screen -->
      <div class="game-start" id="gameStart">
        <div class="game-start-icon">🍜</div>
        <div class="game-start-title">美食大接龙</div>
        <div class="game-start-desc">移动篮子接住掉落的美食<br>避开炸弹！60秒挑战</div>
        <button class="game-start-btn" id="startBtn">开始游戏</button>
        <div class="game-rewards">
          <div class="game-reward">🏆 优先叫号</div>
          <div class="game-reward">🎁 免费小菜</div>
        </div>
      </div>

      <!-- Play Screen -->
      <div class="game-play" id="gamePlay">
        <div class="game-hud">
          <div class="game-score">得分: <span id="score">0</span></div>
          <div class="game-timer">⏱ <span id="timer">60</span>s</div>
        </div>
        <div class="game-canvas-wrap" id="gameCanvas">
          <div class="game-basket" id="basket" style="left: 50%;"></div>
        </div>
        <div class="game-controls">
          <button class="game-btn" id="leftBtn">← 左</button>
          <button class="game-btn" id="rightBtn">右 →</button>
        </div>
      </div>

      <!-- Game Over -->
      <div class="game-over" id="gameOver">
        <div class="game-over-emoji">🎉</div>
        <div class="game-over-title">挑战完成！</div>
        <div class="game-over-score" id="finalScore">128 分</div>
        <div class="game-over-reward">
          <div class="reward-title">🏆 获得奖励</div>
          <div class="reward-item">
            <span class="reward-icon">🎫</span>
            <div class="reward-text">
              <div class="reward-name">优先叫号权</div>
              <div class="reward-desc">下次叫号提前3桌通知</div>
            </div>
          </div>
          <div class="reward-item">
            <span class="reward-icon">🥗</span>
            <div class="reward-text">
              <div class="reward-name">免费凉拌黄瓜</div>
              <div class="reward-desc">入座后自动兑换</div>
            </div>
          </div>
        </div>
        <button class="game-restart" id="restartBtn">再玩一次</button>
      </div>
    </div>
  </div>

  <div class="rules-section">
    <div class="rules-card">
      <div class="rules-title">📋 游戏规则</div>
      <div class="rule-item"><span class="rule-icon">🍔</span> 接住美食 +10 分</div>
      <div class="rule-item"><span class="rule-icon">💣</span> 碰到炸弹 -20 分</div>
      <div class="rule-item"><span class="rule-icon">⏱</span> 限时 60 秒</div>
      <div class="rule-item"><span class="rule-icon">🏆</span> 满 100 分即可获得奖励</div>
    </div>
  </div>

  <div style="height: 40px;"></div>

  <div class="toast" id="toast"></div>
</div>

<script>
  const gameStart = document.getElementById('gameStart');
  const gamePlay = document.getElementById('gamePlay');
  const gameOver = document.getElementById('gameOver');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const scoreEl = document.getElementById('score');
  const timerEl = document.getElementById('timer');
  const finalScore = document.getElementById('finalScore');
  const basket = document.getElementById('basket');
  const canvas = document.getElementById('gameCanvas');
  const leftBtn = document.getElementById('leftBtn');
  const rightBtn = document.getElementById('rightBtn');

  let score = 0;
  let timeLeft = 60;
  let basketPos = 50;
  let gameInterval;
  let spawnInterval;
  let timerInterval;
  let isPlaying = false;

  const foods = ['🍔', '🍕', '🍟', '🍗', '🥟', '🍜', '🍣', '🥗'];
  const bombs = ['💣'];

  function startGame() {
    score = 0;
    timeLeft = 60;
    basketPos = 50;
    scoreEl.textContent = score;
    timerEl.textContent = timeLeft;
    basket.style.left = basketPos + '%';

    gameStart.style.display = 'none';
    gameOver.classList.remove('active');
    gamePlay.classList.add('active');
    isPlaying = true;

    // Clear any existing items
    document.querySelectorAll('.falling-item').forEach(el => el.remove());

    timerInterval = setInterval(() => {
      timeLeft--;
      timerEl.textContent = timeLeft;
      if (timeLeft <= 0) endGame();
    }, 1000);

    spawnInterval = setInterval(() => {
      if (!isPlaying) return;
      spawnItem();
    }, 800);

    gameInterval = setInterval(() => {
      if (!isPlaying) return;
      checkCollisions();
    }, 50);
  }

  function spawnItem() {
    const item = document.createElement('div');
    item.className = 'falling-item';
    const isBomb = Math.random() < 0.25;
    item.textContent = isBomb ? bombs[0] : foods[Math.floor(Math.random() * foods.length)];
    item.dataset.type = isBomb ? 'bomb' : 'food';
    item.style.left = (Math.random() * 80 + 5) + '%';
    item.style.top = '-30px';
    item.style.animationDuration = (Math.random() * 1.5 + 2) + 's';
    canvas.appendChild(item);

    setTimeout(() => {
      if (item.parentNode) item.remove();
    }, 4000);
  }

  function checkCollisions() {
    const basketRect = basket.getBoundingClientRect();
    const canvasRect = canvas.getBoundingClientRect();

    document.querySelectorAll('.falling-item').forEach(item => {
      const itemRect = item.getBoundingClientRect();
      if (
        itemRect.bottom > basketRect.top + 10 &&
        itemRect.bottom < basketRect.bottom + 10 &&
        itemRect.left < basketRect.right - 5 &&
        itemRect.right > basketRect.left + 5
      ) {
        if (item.dataset.type === 'bomb') {
          score -= 20;
          showToast('💣 碰到炸弹 -20');
        } else {
          score += 10;
        }
        scoreEl.textContent = Math.max(0, score);
        item.remove();
      }
    });
  }

  function moveBasket(dir) {
    if (!isPlaying) return;
    basketPos += dir * 12;
    basketPos = Math.max(5, Math.min(85, basketPos));
    basket.style.left = basketPos + '%';
  }

  function endGame() {
    isPlaying = false;
    clearInterval(timerInterval);
    clearInterval(spawnInterval);
    clearInterval(gameInterval);

    gamePlay.classList.remove('active');
    gameOver.classList.add('active');
    finalScore.textContent = score + ' 分';
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);

  leftBtn.addEventListener('click', () => moveBasket(-1));
  rightBtn.addEventListener('click', () => moveBasket(1));

  // Keyboard controls
  document.addEventListener('keydown', e => {
    if (!isPlaying) return;
    if (e.key === 'ArrowLeft') moveBasket(-1);
    if (e.key === 'ArrowRight') moveBasket(1);
  });

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1500);
  }
</script>
</body>
</html>
