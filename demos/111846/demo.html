<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智记·碎片知识管理助手 - 产品概念展示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #e4eaf1 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      max-width: 400px;
      width: 100%;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.1), 0 10px 20px rgba(0,0,0,0.06);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a2e;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .logo span {
      background: #2f80ed;
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
    }
    .avatar {
      width: 40px;
      height: 40px;
      background: #c4d7f2;
      border-radius: 50%;
    }
    .search-bar {
      background: #f0f4f8;
      border-radius: 20px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #8e99a4;
      font-size: 15px;
    }
    .today-capture {
      background: #ffffff;
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);
    }
    .today-capture h3 {
      font-size: 16px;
      color: #1a1a2e;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .capture-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #f0f2f5;
    }
    .capture-item:last-child {
      border-bottom: none;
    }
    .capture-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .title {
      font-weight: 600;
      color: #2d3436;
      font-size: 15px;
    }
    .source {
      font-size: 12px;
      color: #a0a7b0;
    }
    .tag {
      background: #e8f0fe;
      color: #2f80ed;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }
    .add-btn {
      width: 100%;
      background: #2f80ed;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      margin-top: 8px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 6px 15px rgba(47,128,237,0.3);
    }
    .add-btn:hover {
      background: #1a6dd4;
    }
    .review-section {
      background: #ffffff;
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);
    }
    .review-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .review-header h3 {
      font-size: 16px;
      color: #1a1a2e;
    }
    .review-card {
      background: #f8faff;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      border-left: 4px solid #2f80ed;
    }
    .review-question {
      font-weight: 600;
      color: #2d3436;
      margin-bottom: 8px;
    }
    .review-answer {
      color: #636e72;
      font-size: 14px;
      line-height: 1.5;
    }
    .review-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    .review-btn {
      flex: 1;
      padding: 10px;
      border-radius: 16px;
      border: none;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-again {
      background: #ffeaa7;
      color: #d68910;
    }
    .btn-easy {
      background: #55efc4;
      color: #00b894;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo">
        🧠 智记 <span>Beta</span>
      </div>
      <div class="avatar"></div>
    </div>
    <div class="search-bar">
      🔍 搜索你的知识卡片...
    </div>
    <div class="today-capture">
      <h3>📥 今日剪藏 · 3条</h3>
      <div class="capture-item">
        <div class="capture-info">
          <div class="title">费曼学习法的核心步骤</div>
          <div class="source">来自 · 公众号文章</div>
        </div>
        <div class="tag">学习方法</div>
      </div>
      <div class="capture-item">
        <div class="capture-info">
          <div class="title">产品思维中的“场景七要素”</div>
          <div class="source">来自 · 得到课程</div>
        </div>
        <div class="tag">产品经理</div>
      </div>
      <div class="capture-item">
        <div class="capture-info">
          <div class="title">如何用CAR原则写周报</div>
          <div class="source">来自 · 小红书笔记</div>
        </div>
        <div class="tag">职场沟通</div>
      </div>
      <button class="add-btn">+ 快速剪藏当前内容</button>
    </div>
    <div class="review-section">
      <div class="review-header">
        <h3>🔁 智能回顾</h3>
        <span style="color:#2f80ed; font-size:14px;">间隔重复中</span>
      </div>
      <div class="review-card">
        <div class="review-question">❓ 费曼学习法核心步骤是什么？</div>
        <div class="review-answer">Concept、Teach、Review、Simplify（概念、教给别人、回顾、简化）</div>
        <div class="review-actions">
          <button class="review-btn btn-again">🔄 再来一次</button>
          <button class="review-btn btn-easy">✅ 记住了</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
