<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>AI Star Mood Studio</title>

    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial;
        background: linear-gradient(180deg, #f8fafc, #eef2ff);
        color: #111;
      }

      header {
        padding: 24px;
        text-align: center;
        font-weight: 600;
        letter-spacing: 1px;
      }

      .subtitle {
        font-size: 12px;
        color: #666;
        margin-top: 6px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        padding: 20px;
        max-width: 1100px;
        margin: auto;
      }

      .card {
        background: #fff;
        border-radius: 18px;
        padding: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      }

      textarea {
        width: 100%;
        height: 90px;
        border-radius: 12px;
        border: 1px solid #eee;
        padding: 12px;
        resize: none;
      }

      button {
        margin-top: 10px;
        padding: 10px 14px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #a78bfa, #60a5fa);
        color: white;
        cursor: pointer;
      }

      .tag {
        display: inline-block;
        margin-top: 10px;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        background: #f1f5f9;
      }

      .output {
        margin-top: 10px;
        padding: 12px;
        background: #fafafa;
        border-radius: 12px;
        min-height: 80px;
        white-space: pre-wrap;
        border: 1px solid #f0f0f0;
      }

      .ins-img {
        width: 100%;
        height: 140px;
        border-radius: 12px;
        background: linear-gradient(135deg, #ddd6fe, #bfdbfe);
        margin-top: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: #555;
      }

      .mood-bar {
        height: 8px;
        border-radius: 10px;
        background: #eee;
        overflow: hidden;
        margin-top: 10px;
      }

      .mood-fill {
        height: 100%;
        width: 50%;
        background: linear-gradient(90deg, #f472b6, #60a5fa);
      }

      ul {
        padding-left: 16px;
      }

      .small {
        font-size: 12px;
        color: #666;
      }
    </style>
  </head>

  <body>
    <header>
      AI STAR MOOD STUDIO ✨
      <div class="subtitle">INS风追星情绪共创空间 · Emotional AI for Fans</div>
    </header>

    <div class="grid">
      <!-- 输入 -->
      <div class="card">
        <h3>💬 今日心动记录</h3>
        <textarea
          id="input"
          placeholder="记录你今天追星的心情，比如：周也今天太绝了，我真的会疯"
        ></textarea>

        <div class="small">情绪强度</div>
        <input
          id="range"
          type="range"
          min="1"
          max="10"
          value="6"
          style="width: 100%"
        />

        <button onclick="generate()">生成情绪内容</button>

        <div id="tag" class="tag"></div>

        <div class="ins-img">INS风封面图（情绪视觉占位）</div>
      </div>

      <!-- AI输出 -->
      <div class="card">
        <h3>🤖 AI情绪扩写</h3>

        <b>✨ 发疯文学</b>
        <div id="crazy" class="output"></div>

        <b>📱 小红书风</b>
        <div id="red" class="output"></div>

        <b>💬 超话发帖</b>
        <div id="forum" class="output"></div>

        <b>🧠 AI情绪解读</b>
        <div id="analysis" class="output"></div>
      </div>

      <!-- 情绪趋势 -->
      <div class="card">
        <h3>📊 情绪趋势</h3>
        <div class="small">本周追星情绪波动</div>

        <div class="mood-bar"><div class="mood-fill" id="bar"></div></div>

        <div id="trendText" class="small" style="margin-top: 10px"></div>
      </div>

      <!-- 情绪日记 -->
      <div class="card">
        <h3>📔 Mood Diary</h3>
        <button onclick="save()">保存今日记录</button>
        <ul id="list"></ul>
      </div>
    </div>

    <script>
      let logs = [];

      function getEmotion(t) {
        if (t.includes("绝") || t.includes("美")) return "心动❤️";
        if (t.includes("哭") || t.includes("感动")) return "破防🥲";
        if (t.includes("疯") || t.includes("啊")) return "发疯🤯";
        return "平静追星✨";
      }

      function generate() {
        const t = document.getElementById("input").value;
        const lv = document.getElementById("range").value;

        const emo = getEmotion(t);

        document.getElementById("tag").innerText = `${emo} · 强度 ${lv}/10`;

        document.getElementById("crazy").innerText =
          `她不是漂亮，是那种让我反复回看的存在。\n甚至连呼吸都变得不正常。\n\n原话：${t}`;

        document.getElementById("red").innerText =
          `今日被狠狠击中😭✨\n#追星日常 #心动瞬间 #情绪记录\n\n${t}`;

        document.getElementById("forum").innerText =
          `【超话签到】\n状态：${emo}\n强度：${lv}/10\n今日关键词：心动放大中`;

        document.getElementById("analysis").innerText =
          `AI分析结果：\n你当前处于「高敏感心动型追星状态」\n建议：适度保存物料，避免情绪过载（但可以继续发疯）`;

        const percent = lv * 10;
        document.getElementById("bar").style.width = percent + "%";

        document.getElementById("trendText").innerText =
          `当前情绪指数：${percent}% · 今日偏“高心动波动区间”`;
      }

      function save() {
        const t = document.getElementById("input").value;
        const lv = document.getElementById("range").value;
        if (!t) return;

        const time = new Date().toLocaleString();

        logs.unshift(`💫 ${time} ｜ ${t}（${lv}/10）`);

        document.getElementById("list").innerHTML = logs
          .map((i) => `<li>${i}</li>`)
          .join("");
      }
    </script>
  </body>
</html>
