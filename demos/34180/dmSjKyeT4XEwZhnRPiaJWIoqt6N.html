<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>出片神器 — AI写真修图</title>
<style>
:root {
  --bg: #0f0f1a;
  --surface: #1a1b2e;
  --surface2: #252640;
  --surface3: #2d2f4a;
  --ink: #ffffff;
  --muted: #8b8da3;
  --muted2: #5a5c75;
  --accent: #7c3aed;
  --accent-light: #a78bfa;
  --accent2: #f43f5e;
  --accent3: #0ea5e9;
  --accent4: #10b981;
  --grad: linear-gradient(135deg, #7c3aed 0%, #f43f5e 100%);
  --grad-soft: linear-gradient(135deg, #7c3aed20 0%, #f43f5e20 100%);
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
  background: #000;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* ===== APP CONTAINER ===== */
#app {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  position: relative;
}

#app::before {
  content: '';
  position: absolute;
  top: 10%;
  left: 5%;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(124,58,237,0.15) 0%, transparent 70%);
  border-radius: 50%;
  filter: blur(40px);
}
#app::after {
  content: '';
  position: absolute;
  bottom: 10%;
  right: 5%;
  width: 250px;
  height: 250px;
  background: radial-gradient(circle, rgba(244,63,94,0.12) 0%, transparent 70%);
  border-radius: 50%;
  filter: blur(40px);
}

/* ===== PHONE FRAME ===== */
.phone {
  width: 390px;
  height: 844px;
  max-height: 95vh;
  background: var(--bg);
  border-radius: 44px;
  border: 3px solid #2a2a3a;
  box-shadow: 0 0 0 1px #1a1a2a, 0 20px 60px rgba(0,0,0,0.5), 0 0 80px rgba(124,58,237,0.15);
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
  z-index: 1;
}

/* Notch */
.phone::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 28px;
  background: #000;
  border-radius: 0 0 18px 18px;
  z-index: 1000;
}

/* Status bar */
.status-bar {
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px 0 28px;
  font-size: 14px;
  font-weight: 600;
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}
.status-bar .time { font-variant-numeric: tabular-nums; }
.status-bar .icons { display: flex; gap: 6px; align-items: center; }
.status-bar .icons svg { width: 16px; height: 16px; fill: var(--ink); }

/* ===== SCREEN AREA ===== */
.screen {
  flex: 1;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}

/* ===== TOP BAR ===== */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 16px 12px;
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}
.top-bar .title {
  font-size: 17px;
  font-weight: 700;
}
.top-bar .btn-text {
  font-size: 15px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  padding: 4px 8px;
}
.top-bar .btn-text.active { color: var(--accent-light); }
.top-bar .btn-text:active { opacity: 0.6; }

/* ===== CONTENT AREA ===== */
.content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  position: relative;
}
.content::-webkit-scrollbar { display: none; }

/* ===== TAB PAGES ===== */
.tab-page { display: none; flex-direction: column; min-height: 100%; }
.tab-page.active { display: flex; }

/* ===== BOTTOM NAV ===== */
.bottom-nav {
  display: flex;
  height: 72px;
  background: var(--surface);
  border-top: 1px solid var(--surface3);
  flex-shrink: 0;
  padding-bottom: 4px;
  position: relative;
  z-index: 10;
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  cursor: pointer;
  color: var(--muted2);
  transition: color 0.2s;
  position: relative;
}
.nav-item.active { color: var(--accent-light); }
.nav-item .nav-icon {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.nav-item .nav-icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav-item .nav-label {
  font-size: 10px;
  font-weight: 600;
}
.nav-item.active::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 32px;
  height: 3px;
  background: var(--accent-light);
  border-radius: 0 0 3px 3px;
}
.nav-step {
  position: absolute;
  top: -1px;
  left: 50%;
  transform: translateX(-50%);
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--surface3);
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--surface);
}
.nav-item.active .nav-step {
  background: var(--accent);
  color: #fff;
}
.nav-item.completed .nav-step {
  background: var(--accent4);
  color: #fff;
}

/* ===== SELECTION PAGE ===== */
.sel-info {
  padding: 0 16px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sel-info .count {
  font-size: 13px;
  color: var(--muted);
}
.sel-info .count strong { color: var(--accent-light); }
.sel-sort {
  display: flex;
  gap: 6px;
}
.sel-sort .chip {
  padding: 4px 12px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  background: var(--surface2);
  color: var(--muted);
  border: 1px solid transparent;
}
.sel-sort .chip.active {
  background: var(--accent);
  color: #fff;
}

.photo-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  padding: 0 8px 16px;
}
.photo-item {
  position: relative;
  aspect-ratio: 1;
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
  background: var(--surface2);
}
.photo-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.photo-item .score-badge {
  position: absolute;
  top: 4px;
  right: 4px;
  padding: 2px 6px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 700;
  color: #fff;
  backdrop-filter: blur(4px);
}
.photo-item .score-badge.high { background: rgba(16,185,129,0.85); }
.photo-item .score-badge.mid { background: rgba(245,158,11,0.85); }
.photo-item .score-badge.low { background: rgba(107,114,128,0.85); }
.photo-item .score-badge.none { background: rgba(0,0,0,0.5); color: var(--muted); }
.photo-item .check-mark {
  position: absolute;
  top: 4px;
  left: 4px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.5);
  background: rgba(0,0,0,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.photo-item.selected .check-mark {
  background: var(--accent);
  border-color: var(--accent);
}
.photo-item.selected .check-mark::after {
  content: '';
  width: 6px;
  height: 10px;
  border: solid #fff;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg) translate(-1px, -1px);
}
.photo-item.selected img { opacity: 0.7; }
.photo-item:active img { transform: scale(0.95); }
.photo-item img { transition: transform 0.2s, opacity 0.2s; }

.ai-analyze-btn {
  margin: 0 16px 16px;
  padding: 14px;
  background: var(--grad);
  border-radius: var(--radius-sm);
  text-align: center;
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  cursor: pointer;
  transition: opacity 0.2s;
}
.ai-analyze-btn:active { opacity: 0.8; }
.ai-analyze-btn.loading {
  background: var(--surface3);
  color: var(--muted);
  pointer-events: none;
}
.ai-analyze-btn .spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid var(--muted);
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 8px;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== EDITOR COMMON ===== */
.editor-preview {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  background: #000;
  min-height: 300px;
}
.editor-preview .preview-img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  transition: filter 0.15s ease-out;
}
.editor-preview .bg-layer {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background-size: cover;
  background-position: center;
  z-index: 0;
}
.editor-preview .fg-layer {
  position: relative;
  z-index: 1;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  -webkit-mask-image: radial-gradient(ellipse 70% 85% at center, #000 60%, transparent 95%);
  mask-image: radial-gradient(ellipse 70% 85% at center, #000 60%, transparent 95%);
}

.preview-overlay {
  position: absolute;
  top: 12px;
  left: 12px;
  display: flex;
  gap: 6px;
  z-index: 5;
}
.preview-tag {
  padding: 4px 10px;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 600;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(8px);
  color: #fff;
}

.compare-hint {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: rgba(255,255,255,0.6);
  background: rgba(0,0,0,0.4);
  padding: 4px 12px;
  border-radius: 100px;
  backdrop-filter: blur(8px);
  z-index: 5;
}

/* ===== TOOL PANELS ===== */
.tool-panel {
  background: var(--surface);
  border-top: 1px solid var(--surface3);
  flex-shrink: 0;
  max-height: 320px;
  overflow-y: auto;
  overflow-x: hidden;
}
.tool-panel::-webkit-scrollbar { display: none; }

.tool-tabs {
  display: flex;
  gap: 4px;
  padding: 10px 16px 8px;
  border-bottom: 1px solid var(--surface3);
  overflow-x: auto;
}
.tool-tabs::-webkit-scrollbar { display: none; }
.tool-tab {
  padding: 6px 14px;
  border-radius: 100px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  background: var(--surface2);
  border: 1px solid transparent;
  transition: all 0.2s;
}
.tool-tab.active {
  background: var(--accent);
  color: #fff;
}

.tool-content {
  padding: 16px;
}

/* Slider control */
.slider-group {
  margin-bottom: 16px;
}
.slider-group:last-child { margin-bottom: 0; }
.slider-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.slider-label .name {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
}
.slider-label .value {
  font-size: 12px;
  color: var(--accent-light);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.slider-track {
  position: relative;
  height: 36px;
  display: flex;
  align-items: center;
}
.slider-track input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  border-radius: 2px;
  background: var(--surface3);
  outline: none;
}
.slider-track input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid var(--accent);
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.slider-track input[type="range"]::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid var(--accent);
  cursor: pointer;
}

/* One-click beauty */
.beauty-presets {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.beauty-preset {
  aspect-ratio: 1;
  border-radius: var(--radius-sm);
  background: var(--surface2);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.2s;
}
.beauty-preset.active { border-color: var(--accent); }
.beauty-preset:active { transform: scale(0.95); }
.beauty-preset .preset-icon {
  font-size: 24px;
}
.beauty-preset .preset-name {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
}
.beauty-preset.active .preset-name { color: var(--accent-light); }

/* Filter grid */
.filter-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.filter-item {
  cursor: pointer;
}
.filter-item .filter-thumb {
  aspect-ratio: 1;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 2px solid transparent;
  transition: border-color 0.2s;
}
.filter-item.active .filter-thumb { border-color: var(--accent); }
.filter-item .filter-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.filter-item .filter-name {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px;
  font-weight: 600;
}
.filter-item.active .filter-name { color: var(--accent-light); }

/* Background templates */
.bg-template-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.bg-template {
  aspect-ratio: 1;
  border-radius: var(--radius-sm);
  overflow: hidden;
  cursor: pointer;
  border: 2px solid transparent;
  position: relative;
  transition: all 0.2s;
}
.bg-template.active { border-color: var(--accent); }
.bg-template:active { transform: scale(0.95); }
.bg-template img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.bg-template .bg-name {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 4px;
  font-size: 10px;
  color: #fff;
  text-align: center;
  background: linear-gradient(transparent, rgba(0,0,0,0.7));
  font-weight: 600;
}

/* Color picker */
.color-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
}
.color-swatch {
  aspect-ratio: 1;
  border-radius: 50%;
  cursor: pointer;
  border: 3px solid transparent;
  transition: all 0.2s;
}
.color-swatch.active { border-color: var(--accent-light); transform: scale(1.1); }
.color-swatch:active { transform: scale(0.9); }

/* AI generate input */
.ai-input-group {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.ai-input-group input {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--surface3);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  color: var(--ink);
  font-size: 14px;
  outline: none;
}
.ai-input-group input::placeholder { color: var(--muted2); }
.ai-input-group input:focus { border-color: var(--accent); }
.ai-input-group button {
  padding: 12px 18px;
  background: var(--grad);
  border: none;
  border-radius: var(--radius-sm);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}
.ai-input-group button:active { opacity: 0.8; }
.ai-input-group button:disabled { opacity: 0.5; }

.ai-prompt-suggestions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.prompt-chip {
  padding: 5px 12px;
  border-radius: 100px;
  font-size: 12px;
  background: var(--surface2);
  color: var(--muted);
  cursor: pointer;
  border: 1px solid var(--surface3);
}
.prompt-chip:active { background: var(--surface3); }

.ai-generating {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px;
  gap: 12px;
}
.ai-generating .gen-spinner {
  width: 40px;
  height: 40px;
  border: 3px solid var(--surface3);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
.ai-generating .gen-text {
  font-size: 13px;
  color: var(--muted);
}
.ai-generating .gen-progress {
  font-size: 11px;
  color: var(--muted2);
}

.ai-candidates {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
.ai-candidate {
  aspect-ratio: 1;
  border-radius: var(--radius-sm);
  overflow: hidden;
  cursor: pointer;
  border: 2px solid transparent;
  position: relative;
}
.ai-candidate.active { border-color: var(--accent); }
.ai-candidate img { width: 100%; height: 100%; object-fit: cover; }
.ai-candidate .cand-label {
  position: absolute;
  top: 4px;
  left: 4px;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 9px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  font-weight: 600;
}

/* Toggle switch */
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
}
.toggle-row .toggle-label { font-size: 14px; font-weight: 600; }
.toggle-row .toggle-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
.toggle {
  width: 44px;
  height: 26px;
  border-radius: 100px;
  background: var(--surface3);
  position: relative;
  cursor: pointer;
  transition: background 0.2s;
  flex-shrink: 0;
}
.toggle.on { background: var(--accent); }
.toggle::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.2s;
}
.toggle.on::after { transform: translateX(18px); }

/* Usage counter */
.usage-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px;
  background: var(--surface2);
  border-radius: var(--radius-sm);
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 12px;
}
.usage-bar .usage-num { color: var(--accent-light); font-weight: 700; }
.usage-bar .upgrade-link { color: var(--accent2); font-weight: 700; cursor: pointer; }

/* ===== EXPORT PAGE ===== */
.export-preview {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  position: relative;
  overflow: hidden;
  min-height: 300px;
}
.export-preview .export-img {
  max-width: 90%;
  max-height: 90%;
  object-fit: contain;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}

.platform-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}
.platform-card {
  padding: 14px 8px;
  border-radius: var(--radius-sm);
  background: var(--surface2);
  text-align: center;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.2s;
}
.platform-card.active { border-color: var(--accent); background: var(--surface3); }
.platform-card .platform-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  margin: 0 auto 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 700;
  color: #fff;
}
.platform-card .platform-name { font-size: 12px; font-weight: 600; }
.platform-card .platform-size { font-size: 10px; color: var(--muted); margin-top: 2px; }

.size-options {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.size-chip {
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  background: var(--surface2);
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  border: 1px solid transparent;
}

/* ===== MODAL ===== */
.modal-overlay {

.loading-overlay {

// ===== UTILITY =====
function showToast(msg, duration) {
  var toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(function() { toast.classList.remove('show'); }, duration || 2000);
}

function showLoading(text, sub) {
  document.getElementById('loadingText').textContent = text || '处理中...';
  document.getElementById('loadingSub').textContent = sub || '请稍候';
  document.getElementById('loadingOverlay').classList.add('show');
}

function hideLoading() {
  document.getElementById('loadingOverlay').classList.remove('show');
}

function showModal(title, body, onConfirm, confirmText, cancelText) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').textContent = body;
  document.getElementById('modalConfirm').textContent = confirmText || '确定';
  document.getElementById('modalCancel').textContent = cancelText || '取消';
  document.getElementById('modalOverlay').classList.add('show');
  document.getElementById('modalConfirm').onclick = function() {
    document.getElementById('modalOverlay').classList.remove('show');
    if (onConfirm) onConfirm();
  };
  document.getElementById('modalCancel').onclick = function() {
    document.getElementById('modalOverlay').classList.remove('show');
  };
}

// ===== TIME UPDATE =====
function updateTime() {
  var now = new Date();
  var h = now.getHours();
  var m = now.getMinutes();
  document.getElementById('statusTime').textContent = h + ':' + (m < 10 ? '0' + m : m);
}
updateTime();
setInterval(updateTime, 30000);

// ===== TAB SWITCHING =====
var tabTitles = {
  select: { title: '智能选片', left: '取消', right: '完成' },
  retouch: { title: '人像精修', left: '返回', right: '下一步' },
  bg: { title: 'AI换背景', left: '返回', right: '导出' },
  export: { title: '社交导出', left: '返回', right: '' }
};

function switchTab(tab) {
  // Check if photo selected for tabs 2-4
  if (tab !== 'select' && !state.selectedPhoto) {
    showToast('请先在选片页面选择一张照片');
    return;
  }

  // For retouch/bg/export, set the image
  if (tab !== 'select' && state.selectedPhoto) {
    var photo = state.photos.find(function(p) { return p.id === state.selectedPhoto; });
    if (photo) {
      var imgSrc = photo.src;
      document.getElementById('retouchImg').src = imgSrc;
      document.getElementById('bgFgImg').src = imgSrc;
      document.getElementById('exportImg').src = imgSrc;
    }
  }

  state.currentTab = tab;

  // Update pages
  document.querySelectorAll('.tab-page').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('page-' + tab).classList.add('active');

  // Update nav
  document.querySelectorAll('.nav-item').forEach(function(n) {
    n.classList.remove('active', 'completed');
    if (n.dataset.tab === tab) n.classList.add('active');
  });

  // Mark completed steps
  var tabOrder = ['select', 'retouch', 'bg', 'export'];
  var currentIdx = tabOrder.indexOf(tab);
  tabOrder.forEach(function(t, i) {
    if (i < currentIdx) {
      document.querySelector('.nav-item[data-tab="' + t + '"]').classList.add('completed');
    }
  });

  // Update top bar
  var cfg = tabTitles[tab];
  document.getElementById('topTitle').textContent = cfg.title;
  document.getElementById('topLeftBtn').textContent = cfg.left;
  document.getElementById('topRightBtn').textContent = cfg.right;
  document.getElementById('topRightBtn').style.visibility = cfg.right ? 'visible' : 'hidden';

  // Initialize tab content
  if (tab === 'retouch') initRetouch();
  if (tab === 'bg') initBackground();
  if (tab === 'export') initExport();

  // Scroll content to top
  document.getElementById('content').scrollTop = 0;
}

document.querySelectorAll('.nav-item').forEach(function(item) {
  item.addEventListener('click', function() {
    switchTab(this.dataset.tab);
  });
});

// Top bar buttons
document.getElementById('topLeftBtn').addEventListener('click', function() {
  var tabOrder = ['select', 'retouch', 'bg', 'export'];
  var idx = tabOrder.indexOf(state.currentTab);
  if (idx > 0) switchTab(tabOrder[idx - 1]);
});

document.getElementById('topRightBtn').addEventListener('click', function() {
  var tabOrder = ['select', 'retouch', 'bg', 'export'];
  var idx = tabOrder.indexOf(state.currentTab);
  if (state.currentTab === 'select') {
    if (!state.selectedPhoto) {
      showToast('请至少选择一张照片');
      return;
    }
    switchTab('retouch');
  } else if (idx < tabOrder.length - 1) {
    switchTab(tabOrder[idx + 1]);
  }
});

// ===== SELECTION PAGE =====
function renderPhotoGrid() {
  var grid = document.getElementById('photoGrid');
  var photos = state.photos.slice();

  // Sort
  if (state.sortMode === 'score' && state.analyzed) {
    photos.sort(function(a, b) {
      if (a.score === null && b.score === null) return 0;
      if (a.score === null) return 1;
      if (b.score === null) return -1;
      return b.score - a.score;
    });
  }

  grid.innerHTML = '';
  photos.forEach(function(photo) {
    var item = document.createElement('div');
    item.className = 'photo-item' + (photo.selected ? ' selected' : '');
    item.dataset.id = photo.id;

    var scoreBadge = '';
    if (photo.score !== null) {
      var cls = photo.score >= 80 ? 'high' : (photo.score >= 60 ? 'mid' : 'low');
      scoreBadge = '<div class="score-badge ' + cls + '">' + photo.score + '</div>';
    } else if (state.analyzed) {
      scoreBadge = '<div class="score-badge none">--</div>';
    }

    item.innerHTML =
      '<img src="' + photo.src + '" alt="">' +
      '<div class="check-mark"></div>' +
      scoreBadge;

    item.addEventListener('click', function() {
      photo.selected = !photo.selected;
      item.classList.toggle('selected');
      updateSelectedCount();
      if (photo.selected) {
        state.selectedPhoto = photo.id;
      } else {
        // If deselecting the currently selected photo, pick another selected one
        if (state.selectedPhoto === photo.id) {

}

function updateRetouchPreview() {
  var img = document.getElementById('retouchImg');
  var p = state.retouch.params;

  // Build CSS filter from beauty params
  // skin smoothing -> blur
  // whiten -> brightness
  // contrast for sharpness
  var blur = (p.skin / 100) * 1.5;
  var brightness = 1 + (p.whiten / 100) * 0.15;
  var contrast = 1 + (p.skin / 100) * 0.05 - (p.skin / 100) * 0.1;
  var saturate = 1 + (p.whiten / 100) * 0.05;

  // Also apply color adjustments
  var c = state.color;
  var colorFilter = '';
  if (c.filter !== 'none') {
    var filterObj = c.filters.find(function(f) { return f.id === c.filter; });
    if (filterObj) colorFilter = filterObj.css;
  }
  var adjBrightness = brightness * (1 + c.brightness / 100);
  var adjContrast = contrast * (1 + c.contrast / 100);
  var adjSaturate = saturate * (1 + c.saturation / 100);
  var hueRotate = c.temperature * 0.5;

  var filterStr = 'blur(' + blur + 'px) brightness(' + adjBrightness + ') contrast(' + adjContrast + ') saturate(' + adjSaturate + ') hue-rotate(' + hueRotate + 'deg)';
  if (colorFilter && colorFilter !== 'none') {
    filterStr = colorFilter + ' ' + filterStr;
  }

  img.style.filter = filterStr;
}

function updateExportPreview() {
  var img = document.getElementById('exportImg');
  var ratio = state.export.ratio;
  var container = document.getElementById('exportPreview');

  // Apply ratio
  var ratios = { '3:4': 3/4, '1:1': 1, '4:3': 4/3, '9:16': 9/16 };
  var r = ratios[ratio] || 3/4;

  // Apply current filter
  var p = state.retouch.params;
  var blur = (p.skin / 100) * 1.5;
  var brightness = 1 + (p.whiten / 100) * 0.15;
  var contrast = 1 + (p.skin / 100) * 0.05;

  var c = state.color;
  var colorFilter = '';
  if (c.filter !== 'none') {
    var filterObj = c.filters.find(function(f) { return f.id === c.filter; });
    if (filterObj) colorFilter = filterObj.css;
  }

  var adjBrightness = brightness * (1 + c.brightness / 100);
  var adjContrast = contrast * (1 + c.contrast / 100);
  var adjSaturate = (1 + (p.whiten / 100) * 0.05) * (1 + c.saturation / 100);

  var filterStr = 'blur(' + blur + 'px) brightness(' + adjBrightness + ') contrast(' + adjContrast + ') saturate(' + adjSaturate + ')';
  if (colorFilter && colorFilter !== 'none') filterStr = colorFilter + ' ' + filterStr;

  img.style.filter = filterStr;
  img.style.aspectRatio = r.toString();
  img.style.maxHeight = (90 * r) + '%';

  // Add watermark if not removed
  var existingWm = container.querySelector('.watermark');
  if (existingWm) existingWm.remove();
  if (!state.export.noWatermark) {
    var wm = document.createElement('div');

    wm.style.cssText = 'position:absolute;bottom:12px;right:12px;font-size:11px;color:rgba(255,255,255,0.5);font-weight:600;z-index:5;';

  }
}

  state.export.hd = !state.export.hd;
  this.classList.toggle('on');
  if (state.export.hd) showToast('已开启高清画质（会员功能）');
});

document.getElementById('watermarkToggle').addEventListener('click', function() {
  state.export.noWatermark = !state.export.noWatermark;
  this.classList.toggle('on');
  updateExportPreview();
  if (state.export.noWatermark) showToast('已去除水印（会员功能）');
});

// Export button
document.getElementById('exportBtn').addEventListener('click', function() {
  var btn = this;
  btn.classList.add('loading');
  btn.textContent = '导出中...';

  setTimeout(function() {
    btn.classList.remove('loading');
    btn.textContent = '导出到相册';

    var platformNames = { xhs: '小红书', dy: '抖音', ig: 'Instagram' };
    var quality = state.export.hd ? '4K高清' : '标准';
    showToast('已导出 ' + state.export.ratio + ' ' + quality + ' 到相册');

    setTimeout(function() {
      showModal('导出成功', '照片已保存到相册，可直接发布到' + platformNames[state.export.platform] + '。', function() {
        // Reset to selection
        switchTab('select');
      }, '完成', '继续编辑');
    }, 500);
  }, 2000);
});

// ===== COLOR ADJUSTMENT PANEL =====
// Add color tab to retouch tool
var colorTabHTML = '<span class="tool-tab" data-rtab="color">色调滤镜</span>';
document.querySelector('#page-retouch .tool-tabs').insertAdjacentHTML('beforeend', colorTabHTML);

// Override the retouch tab handler to include color
document.querySelectorAll('[data-rtab]').forEach(function(tab) {
  tab.addEventListener('click', function() {
    document.querySelectorAll('[data-rtab]').forEach(function(t) { t.classList.remove('active'); });
    this.classList.add('active');
    state.retouch.mode = this.dataset.rtab;
    if (state.retouch.mode === 'color') {
      renderColorTool();
    } else {
      renderRetouchTool();
    }
  });
});

function renderColorTool() {
  var content = document.getElementById('retouchToolContent');
  var c = state.color;

  // Filter grid
  var filterGridHTML = '<div style="font-size:13px;font-weight:700;margin-bottom:10px;">滤镜</div><div class="filter-grid">' +
    c.filters.map(function(f) {
      return '<div class="filter-item' + (c.filter === f.id ? ' active' : '') + '" data-filter="' + f.id + '">' +
        '<div class="filter-thumb"><img src="' + state.photos.find(function(p) { return p.id === state.selectedPhoto; }).src + '" style="filter:' + (f.css === 'none' ? '' : f.css) + ';" alt=""></div>' +
        '<div class="filter-name">' + f.name + '</div>' +
      '</div>';
    }).join('') + '</div>';

  // Sliders
  var slidersHTML = '<div style="font-size:13px;font-weight:700;margin:16px 0 10px;">参数调整</div>' +
    [
      { key: 'brightness', name: '亮度', min: -50, max: 50 },
      { key: 'contrast', name: '对比度', min: -50, max: 50 },
      { key: 'saturation', name: '饱和度', min: -50, max: 50 },
      { key: 'temperature', name: '色温', min: -50, max: 50 },
      { key: 'sharpness', name: '锐度', min: 0, max: 100 }
    ].map(function(s) {
      var val = c[s.key];
      return '<div class="slider-group">' +
        '<div class="slider-label"><span class="name">' + s.name + '</span><span class="value" id="cval-' + s.key + '">' + val + '</span></div>' +
        '<div class="slider-track"><input type="range" min="' + s.min + '" max="' + s.max + '" value="' + val + '" data-ckey="' + s.key + '"></div>' +
      '</div>';
    }).join('') +
    '<button style="width:100%;margin-top:8px;padding:10px;background:var(--surface2);border:none;border-radius:10px;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;" id="resetColor">重置所有参数</button>';

  content.innerHTML = filterGridHTML + slidersHTML;

  // Filter click
  content.querySelectorAll('.filter-item').forEach(function(el) {
    el.addEventListener('click', function() {
      content.querySelectorAll('.filter-item').forEach(function(e) { e.classList.remove('active'); });
      this.classList.add('active');
      c.filter = this.dataset.filter;
      updateRetouchPreview();
    });
  });

  // Slider input
  content.querySelectorAll('input[type="range"]').forEach(function(input) {
    input.addEventListener('input', function() {
      var key = this.dataset.ckey;
      var val = parseInt(this.value);
      c[key] = val;
      document.getElementById('cval-' + key).textContent = val;
      updateRetouchPreview();
    });
  });

  // Reset
  document.getElementById('resetColor').addEventListener('click', function() {
    state.color = {
      filter: 'none', filterIntensity: 100,
      brightness: 0, contrast: 0, saturation: 0, temperature: 0, sharpness: 0,
      filters: c.filters
    };
    renderColorTool();
    updateRetouchPreview();
  });
}

// ===== INIT =====
renderPhotoGrid();
updateSelectedCount();

// Auto-select first photo for convenience
state.photos[0].selected = true;
state.selectedPhoto = state.photos[0].id;
renderPhotoGrid();
updateSelectedCount();

</script>

</body>
