<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>饭搭子 · 一键匹配附近同口味的小伙伴</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #fff5e6 0%, #ffe8d6 50%, #ffd4b3 100%);
    min-height: 100vh;
    color: #2c1810;
    line-height: 1.6;
  }
  .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }

  /* Hero */
  .hero {
    text-align: center;
    padding: 50px 20px 40px;
    background: linear-gradient(135deg, #ff944d 0%, #ff6b35 100%);
    border-radius: 24px;
    color: #fff;
    box-shadow: 0 20px 60px rgba(255, 107, 53, 0.3);
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: "🍜 🍱 🍲 🥟 🍔 🍕 🍣 🌮";
    position: absolute;
    top: 20px; left: 50%;
    transform: translateX(-50%);
    font-size: 28px;
    letter-spacing: 8px;
    opacity: 0.3;
  }
  .hero h1 { font-size: 42px; margin-bottom: 12px; letter-spacing: 2px; }
  .hero .slogan { font-size: 18px; opacity: 0.95; margin-bottom: 24px; }
  .hero .badges { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .badge {
    background: rgba(255,255,255,0.25);
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 14px;
    backdrop-filter: blur(10px);
  }

  /* Sections */
  .section {
    background: #fff;
    border-radius: 20px;
    padding: 32px;
    margin-top: 24px;
    box-shadow: 0 8px 30px rgba(44, 24, 16, 0.08);
  }
  .section h2 {
    font-size: 24px;
    margin-bottom: 8px;
    color: #ff6b35;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section .subtitle { color: #8a6d5a; font-size: 14px; margin-bottom: 20px; }

  /* Taste Tags */
  .tags-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .tag {
    padding: 14px 12px;
    border: 2px solid #ffe0c2;
    border-radius: 14px;
    background: #fff8f0;
    cursor: pointer;
    text-align: center;
    font-size: 15px;
    transition: all 0.2s;
    user-select: none;
  }
  .tag:hover { border-color: #ff944d; transform: translateY(-2px); }
  .tag.selected {
    background: linear-gradient(135deg, #ff944d, #ff6b35);
    color: #fff;
    border-color: #ff6b35;
    box-shadow: 0 6px 16px rgba(255, 107, 53, 0.35);
  }
  .tag .emoji { font-size: 22px; display: block; margin-bottom: 4px; }

  .tag-group-title {
    font-size: 15px;
    color: #8a6d5a;
    margin: 16px 0 10px;
    font-weight: 600;
  }

  /* Location */
  .location-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .location-input {
    flex: 1;
    min-width: 200px;
    padding: 14px 18px;
    border: 2px solid #ffe0c2;
    border-radius: 12px;
    font-size: 15px;
    outline: none;
    transition: border 0.2s;
  }
  .location-input:focus { border-color: #ff944d; }
  .radius-slider {
    flex: 1;
    min-width: 200px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fff8f0;
    padding: 10px 16px;
    border-radius: 12px;
    border: 2px solid #ffe0c2;
  }
  .radius-slider input[type=range] { flex: 1; accent-color: #ff6b35; }
  .radius-value { color: #ff6b35; font-weight: 600; white-space: nowrap; }

  /* Match Button */
  .match-btn {
    display: block;
    margin: 32px auto 0;
    padding: 18px 60px;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #ff944d 0%, #ff6b35 100%);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4);
    transition: all 0.2s;
    letter-spacing: 2px;
  }
  .match-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(255, 107, 53, 0.5); }
  .match-btn:active { transform: translateY(0); }
  .match-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  /* Loading */
  .loading {
    display: none;
    text-align: center;
    padding: 40px;
    font-size: 18px;
    color: #ff6b35;
  }
  .loading .spinner {
    display: inline-block;
    width: 40px; height: 40px;
    border: 4px solid #ffe0c2;
    border-top-color: #ff6b35;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 12px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Results */
  .results-summary {
    background: linear-gradient(135deg, #fff5e6, #ffe8d6);
    padding: 16px 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    font-size: 15px;
    color: #8a4b25;
  }
  .results-summary strong { color: #ff6b35; font-size: 17px; }

  .partners-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  .partner-card {
    background: #fff;
    border: 2px solid #ffe0c2;
    border-radius: 16px;
    padding: 20px;
    transition: all 0.2s;
    animation: fadeIn 0.4s ease-out backwards;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .partner-card:hover {
    border-color: #ff944d;
    box-shadow: 0 12px 30px rgba(255, 107, 53, 0.15);
    transform: translateY(-4px);
  }
  .partner-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffb380, #ff944d);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
  }
  .partner-name { font-size: 17px; font-weight: 700; color: #2c1810; }
  .partner-info { font-size: 13px; color: #8a6d5a; margin-top: 2px; }
  .match-score {
    background: linear-gradient(135deg, #ff944d, #ff6b35);
    color: #fff;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 700;
    margin-left: auto;
  }
  .partner-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }
  .mini-tag {
    background: #fff5e6;
    color: #ff6b35;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 10px;
  }
  .mini-tag.match {
    background: #ffe8d6;
    font-weight: 600;
  }
  .partner-bio {
    font-size: 14px;
    color: #5a3820;
    padding: 10px 12px;
    background: #fff8f0;
    border-radius: 8px;
    margin-bottom: 12px;
    font-style: italic;
  }
  .partner-footer {
    display: flex;
    gap: 8px;
  }
  .btn-small {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s;
  }
  .btn-primary { background: linear-gradient(135deg, #ff944d, #ff6b35); color: #fff; }
  .btn-primary:hover { box-shadow: 0 6px 16px rgba(255, 107, 53, 0.35); }
  .btn-secondary { background: #fff5e6; color: #ff6b35; }
  .btn-secondary:hover { background: #ffe8d6; }

  .empty { text-align: center; padding: 40px; color: #8a6d5a; }
  .empty .big-emoji { font-size: 60px; margin-bottom: 12px; display: block; }

  /* Footer */
  .footer {
    text-align: center;
    padding: 30px 20px;
    color: #8a6d5a;
    font-size: 13px;
  }

  @media (max-width: 640px) {
    .hero h1 { font-size: 30px; }
    .hero { padding: 40px 20px 30px; }
    .section { padding: 24px 20px; }
    .section h2 { font-size: 20px; }
    .match-btn { padding: 16px 40px; font-size: 17px; width: 100%; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- Hero -->
  <div class="hero">
    <h1>🍚 饭搭子</h1>
    <div class="slogan">一键查询附近和你同吃饭口味的小伙伴</div>
    <div class="badges">
      <span class="badge">🎯 口味匹配</span>
      <span class="badge">📍 附近 3km</span>
      <span class="badge">⚡ 一键发起</span>
      <span class="badge">😊 不再一人食</span>
    </div>
  </div>

  <!-- Step 1: 口味偏好 -->
  <div class="section">
    <h2>🎨 选择你的口味偏好</h2>
    <div class="subtitle">多选，选择你喜欢的口味和菜系，匹配度越高越合拍</div>

    <div class="tag-group-title">🍲 菜系偏好</div>
    <div class="tags-grid" id="cuisine-tags"></div>

    <div class="tag-group-title">🌶️ 口味轻重</div>
    <div class="tags-grid" id="taste-tags"></div>

    <div class="tag-group-title">🥗 饮食偏好</div>
    <div class="tags-grid" id="diet-tags"></div>

    <div class="tag-group-title">💰 人均预算</div>
    <div class="tags-grid" id="budget-tags"></div>
  </div>

  <!-- Step 2: 位置 & 范围 -->
  <div class="section">
    <h2>📍 告诉我你在哪里</h2>
    <div class="subtitle">我们会在你指定的范围内寻找饭搭子</div>
    <div class="location-row">
      <input type="text" class="location-input" id="location" placeholder="输入你的位置（如：中关村地铁站 / 五角场 / 南山科技园）" value="中关村">
      <div class="radius-slider">
        <span>范围</span>
        <input type="range" id="radius" min="1" max="10" value="3">
        <span class="radius-value" id="radiusValue">3 km</span>
      </div>
    </div>
  </div>

  <!-- Match Button -->
  <button class="match-btn" id="matchBtn">🔍 一键匹配饭搭子</button>

  <!-- Loading -->
  <div class="loading" id="loading">
    <span class="spinner"></span>正在附近寻找和你口味相近的小伙伴...
  </div>

  <!-- Results -->
  <div class="section" id="results" style="display:none;">
    <h2>🎉 为你找到的饭搭子</h2>
    <div class="subtitle">按口味匹配度排序，点击卡片发起约饭</div>
    <div class="results-summary" id="summary"></div>
    <div class="partners-grid" id="partners"></div>
  </div>

  <div class="footer">
    🍜 饭搭子 · 让每一顿饭都不再孤单 · 创意展示 Demo
  </div>
</div>

<script>
  // 选项数据
  const cuisines = [
    { name: "川菜", emoji: "🌶️" },
    { name: "粤菜", emoji: "🥟" },
    { name: "日料", emoji: "🍣" },
    { name: "韩餐", emoji: "🍲" },
    { name: "西餐", emoji: "🍝" },
    { name: "火锅", emoji: "🍲" },
    { name: "烧烤", emoji: "🍢" },
    { name: "东北菜", emoji: "🥘" },
    { name: "江浙菜", emoji: "🍜" },
    { name: "湘菜", emoji: "🌶️" },
    { name: "东南亚", emoji: "🍛" },
    { name: "素食", emoji: "🥗" }
  ];
  const tastes = [
    { name: "无辣不欢", emoji: "🔥" },
    { name: "清淡养生", emoji: "🍵" },
    { name: "酸甜口", emoji: "🍅" },
    { name: "重口味", emoji: "🧂" },
    { name: "咸鲜党", emoji: "🥣" },
    { name: "麻酱爱好者", emoji: "🥜" }
  ];
  const diets = [
    { name: "什么都吃", emoji: "😋" },
    { name: "不吃香菜", emoji: "🚫" },
    { name: "不吃葱蒜", emoji: "🧄" },
    { name: "不吃海鲜", emoji: "🦐" },
    { name: "素食主义", emoji: "🌱" },
    { name: "低糖低脂", emoji: "🥑" }
  ];
  const budgets = [
    { name: "30元以下", emoji: "🍙" },
    { name: "30–60元", emoji: "🍜" },
    { name: "60–120元", emoji: "🍱" },
    { name: "120–200元", emoji: "🍲" },
    { name: "200元以上", emoji: "🍽️" }
  ];

  // 渲染标签
  function renderTags(containerId, data, key) {
    const container = document.getElementById(containerId);
    data.forEach((item, idx) => {
      const tag = document.createElement("div");
      tag.className = "tag";
      tag.innerHTML = `<span class="emoji">${item.emoji}</span>${item.name}`;
      tag.dataset.group = key;
      tag.dataset.name = item.name;
      tag.addEventListener("click", () => tag.classList.toggle("selected"));
      container.appendChild(tag);
    });
  }
  renderTags("cuisine-tags", cuisines, "cuisine");
  renderTags("taste-tags", tastes, "taste");
  renderTags("diet-tags", diets, "diet");
  renderTags("budget-tags", budgets, "budget");

  // 范围滑块
  const radius = document.getElementById("radius");
  const radiusValue = document.getElementById("radiusValue");
  radius.addEventListener("input", () => {
    radiusValue.textContent = radius.value + " km";
  });

  // 获取已选择的标签
  function getSelected() {
    return Array.from(document.querySelectorAll(".tag.selected")).map(t => ({
      group: t.dataset.group,
      name: t.dataset.name
    }));
  }

  // 模拟饭搭子数据
  const mockPartners = [
    { name: "小陈", avatar: "👧", age: 25, job: "产品经理", distance: 0.8, tags: ["川菜", "火锅", "无辣不欢", "什么都吃", "60–120元"], bio: "工作日午休天天找饭搭子，不挑食但要够辣！" },
    { name: "Amy", avatar: "👩", age: 28, job: "设计师", distance: 1.2, tags: ["日料", "粤菜", "清淡养生", "不吃香菜", "120–200元"], bio: "喜欢精致小馆子，周末探店狂魔，可以约下午茶。" },
    { name: "老王", avatar: "🧔", age: 32, job: "程序员", distance: 1.5, tags: ["烧烤", "东北菜", "重口味", "什么都吃", "30–60元"], bio: "晚餐+夜宵党，能喝一点，吃饭不玩手机。" },
    { name: "Lina", avatar: "👩‍🦰", age: 23, job: "应届生", distance: 2.1, tags: ["韩餐", "西餐", "酸甜口", "什么都吃", "30–60元"], bio: "刚到这座城市，想认识新朋友一起探索美食！" },
    { name: "阿杰", avatar: "🧑", age: 27, job: "运营", distance: 2.5, tags: ["火锅", "川菜", "湘菜", "无辣不欢", "60–120元"], bio: "标准川渝胃，无辣不欢，约饭我请客也OK。" },
    { name: "Miko", avatar: "👧", age: 26, job: "插画师", distance: 2.8, tags: ["日料", "东南亚", "清淡养生", "低糖低脂", "120–200元"], bio: "工作日健身，周末要好好吃一顿，找志同道合的人。" },
    { name: "大刘", avatar: "👨", age: 30, job: "销售", distance: 3.5, tags: ["烧烤", "火锅", "重口味", "麻酱爱好者", "60–120元"], bio: "周末组局专业户，经常组织4-6人聚餐。" },
    { name: "小雨", avatar: "👩", age: 24, job: "老师", distance: 1.8, tags: ["江浙菜", "粤菜", "清淡养生", "不吃葱蒜", "30–60元"], bio: "口味比较清淡，喜欢安静的餐厅，聊得来最重要。" },
    { name: "Tony", avatar: "🧑‍💼", age: 29, job: "金融", distance: 4.2, tags: ["西餐", "日料", "咸鲜党", "什么都吃", "200元以上"], bio: "周末经常想吃好一点，米其林探店爱好者。" },
    { name: "小鹿", avatar: "👧", age: 22, job: "学生", distance: 0.5, tags: ["韩餐", "火锅", "酸甜口", "什么都吃", "30元以下"], bio: "穷学生一枚，AA约饭，平价好吃就行！" }
  ];

  // 匹配逻辑
  function calculateMatch(userTags, partner) {
    const userNames = userTags.map(t => t.name);
    let matches = 0;
    partner.tags.forEach(t => { if (userNames.includes(t)) matches++; });
    const total = Math.max(userNames.length, 1);
    let score = Math.round((matches / total) * 70);
    // 距离加分
    if (partner.distance <= 1) score += 30;
    else if (partner.distance <= 3) score += 20;
    else score += 10;
    return Math.min(score, 99);
  }

  // 匹配按钮
  document.getElementById("matchBtn").addEventListener("click", () => {
    const selected = getSelected();
    const location = document.getElementById("location").value.trim();
    const r = parseInt(radius.value);

    if (selected.length === 0) {
      alert("请先选择至少一个口味偏好哦～");
      return;
    }
    if (!location) {
      alert("请输入你的位置～");
      return;
    }

    const loading = document.getElementById("loading");
    const results = document.getElementById("results");
    const partners = document.getElementById("partners");
    const summary = document.getElementById("summary");

    results.style.display = "none";
    loading.style.display = "block";
    partners.innerHTML = "";

    setTimeout(() => {
      loading.style.display = "none";

      const userNames = selected.map(t => t.name);
      const filtered = mockPartners
        .filter(p => p.distance <= r)
        .map(p => ({ ...p, score: calculateMatch(selected, p) }))
        .sort((a, b) => b.score - a.score);

      if (filtered.length === 0) {
        results.style.display = "block";
        summary.innerHTML = `在<strong> ${location} </strong>附近<strong> ${r}km </strong>范围内，暂时没有找到合适的饭搭子 😢`;
        partners.innerHTML = `<div class="empty"><span class="big-emoji">🍽️</span>可以尝试扩大搜索范围，或选择更多口味标签～</div>`;
        results.scrollIntoView({ behavior: "smooth" });
        return;
      }

      results.style.display = "block";
      summary.innerHTML = `在<strong> ${location} </strong>附近<strong> ${r}km </strong>范围内，共为你找到 <strong>${filtered.length}</strong> 位口味相近的饭搭子！已按匹配度排序。`;

      filtered.forEach((p, idx) => {
        const card = document.createElement("div");
        card.className = "partner-card";
        card.style.animationDelay = (idx * 0.05) + "s";
        const tagsHtml = p.tags.map(t =>
          `<span class="mini-tag ${userNames.includes(t) ? "match" : ""}">${userNames.includes(t) ? "✓ " : ""}${t}</span>`
        ).join("");
        card.innerHTML = `
          <div class="partner-header">
            <div class="avatar">${p.avatar}</div>
            <div style="flex:1; min-width:0;">
              <div class="partner-name">${p.name} · ${p.age}岁</div>
              <div class="partner-info">${p.job} · ${p.distance}km</div>
            </div>
            <div class="match-score">${p.score}% 合拍</div>
          </div>
          <div class="partner-tags">${tagsHtml}</div>
          <div class="partner-bio">"${p.bio}"</div>
          <div class="partner-footer">
            <button class="btn-small btn-primary" onclick="alert('已向 ${p.name} 发送约饭请求！')">💌 发起约饭</button>
            <button class="btn-small btn-secondary" onclick="alert('已添加 ${p.name} 到收藏')">⭐ 收藏</button>
          </div>
        `;
        partners.appendChild(card);
      });

      results.scrollIntoView({ behavior: "smooth" });
    }, 1200);
  });
</script>
</body>
</html>
