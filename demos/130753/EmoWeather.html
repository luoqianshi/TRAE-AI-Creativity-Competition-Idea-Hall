<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EmoWeather 情绪天气站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .app-container {
    max-width: 420px;
    width: 100%;
    background: rgba(255,255,255,0.95);
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    overflow: hidden;
  }
  .app-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 28px 24px;
    text-align: center;
  }
  .app-header h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .app-header .subtitle {
    font-size: 13px;
    opacity: 0.85;
  }
  .current-weather {
    padding: 24px;
    text-align: center;
    border-bottom: 1px solid #eee;
  }
  .weather-icon {
    font-size: 72px;
    margin-bottom: 8px;
    transition: transform 0.3s;
    cursor: pointer;
  }
  .weather-icon:hover { transform: scale(1.15); }
  .weather-label {
    font-size: 20px;
    font-weight: 600;
    color: #333;
  }
  .weather-desc {
    font-size: 13px;
    color: #888;
    margin-top: 4px;
  }
  .mood-selector {
    padding: 20px 24px;
  }
  .mood-selector h3 {
    font-size: 16px;
    color: #333;
    margin-bottom: 14px;
    text-align: center;
  }
  .mood-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .mood-item {
    background: #f5f5f5;
    border-radius: 16px;
    padding: 14px 8px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s;
    border: 2px solid transparent;
  }
  .mood-item:hover {
    background: #ede7f6;
    border-color: #7c4dff;
    transform: translateY(-2px);
  }
  .mood-item.selected {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border-color: #5c3dbf;
    transform: scale(1.05);
  }
  .mood-item .emoji { font-size: 32px; display: block; margin-bottom: 4px; }
  .mood-item .label { font-size: 12px; font-weight: 500; }
  .mood-item.selected .label { color: rgba(255,255,255,0.9); }
  .note-section {
    padding: 0 24px 20px;
  }
  .note-section textarea {
    width: 100%;
    border: 2px solid #e0e0e0;
    border-radius: 14px;
    padding: 12px 16px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    height: 80px;
    transition: border-color 0.3s;
    outline: none;
  }
  .note-section textarea:focus {
    border-color: #7c4dff;
  }
  .btn-record {
    display: block;
    width: calc(100% - 48px);
    margin: 0 24px 10px;
    padding: 14px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 2px;
  }
  .btn-record:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
  }
  .btn-record:active { transform: scale(0.97); }
  .history-section {
    padding: 20px 24px;
    border-top: 1px solid #eee;
  }
  .history-section h3 {
    font-size: 16px;
    color: #333;
    margin-bottom: 14px;
  }
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .history-item {
    display: flex;
    align-items: center;
    background: #f9f9f9;
    border-radius: 12px;
    padding: 12px 16px;
    gap: 12px;
  }
  .history-item .h-emoji { font-size: 28px; }
  .history-item .h-info { flex: 1; }
  .history-item .h-date { font-size: 12px; color: #999; }
  .history-item .h-note { font-size: 13px; color: #555; }
  .history-item .h-tag {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    background: #ede7f6;
    color: #7c4dff;
  }
  .chart-area {
    margin: 16px 0;
    display: flex;
    align-items: flex-end;
    justify-content: space-around;
    height: 100px;
    gap: 6px;
  }
  .chart-bar {
    flex: 1;
    border-radius: 8px 8px 0 0;
    min-width: 28px;
    transition: all 0.5s ease;
    position: relative;
  }
  .chart-bar .bar-label {
    position: absolute;
    bottom: -20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: #999;
    white-space: nowrap;
  }
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: white;
    padding: 12px 28px;
    border-radius: 30px;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 999;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="app-container">
  <!-- 头部 -->
  <div class="app-header">
    <h1>🌤 EmoWeather</h1>
    <div class="subtitle">每一天的情绪，都值得被记录</div>
  </div>

  <!-- 当前情绪天气 -->
  <div class="current-weather">
    <div class="weather-icon" id="currentWeatherIcon">😊</div>
    <div class="weather-label" id="currentWeatherLabel">晴朗</div>
    <div class="weather-desc" id="currentWeatherDesc">今天还没有记录情绪哦～</div>
  </div>

  <!-- 情绪选择器 -->
  <div class="mood-selector">
    <h3>📝 今天的心情像什么天气？</h3>
    <div class="mood-grid" id="moodGrid">
      <div class="mood-item" data-mood="sunny" data-emoji="☀️" data-label="晴朗" data-color="#FFB74D">
        <span class="emoji">☀️</span><span class="label">晴朗</span>
      </div>
      <div class="mood-item" data-mood="cloudy" data-emoji="☁️" data-label="多云" data-color="#B0BEC5">
        <span class="emoji">☁️</span><span class="label">多云</span>
      </div>
      <div class="mood-item" data-mood="rainy" data-emoji="🌧" data-label="阴雨" data-color="#5C6BC0">
        <span class="emoji">🌧</span><span class="label">阴雨</span>
      </div>
      <div class="mood-item" data-mood="stormy" data-emoji="⛈" data-label="雷暴" data-color="#EF5350">
        <span class="emoji">⛈</span><span class="label">雷暴</span>
      </div>
      <div class="mood-item" data-mood="rainbow" data-emoji="🌈" data-label="彩虹" data-color="#AB47BC">
        <span class="emoji">🌈</span><span class="label">彩虹</span>
      </div>
      <div class="mood-item" data-mood="windy" data-emoji="💨" data-label="大风" data-color="#78909C">
        <span class="emoji">💨</span><span class="label">大风</span>
      </div>
      <div class="mood-item" data-mood="snowy" data-emoji="❄️" data-label="飘雪" data-color="#90CAF9">
        <span class="emoji">❄️</span><span class="label">飘雪</span>
      </div>
      <div class="mood-item" data-mood="starry" data-emoji="🌟" data-label="星空" data-color="#7E57C2">
        <span class="emoji">🌟</span><span class="label">星空</span>
      </div>
    </div>
  </div>

  <!-- 心情备注 -->
  <div class="note-section">
    <textarea id="moodNote" placeholder="写点什么吧（选填）..."></textarea>
  </div>

  <!-- 记录按钮 -->
  <button class="btn-record" id="btnRecord">📌 记录今日情绪</button>

  <!-- 历史记录 -->
  <div class="history-section">
    <h3>📅 最近一周情绪趋势</h3>
    <div class="chart-area" id="chartArea"></div>
    <h3 style="margin-top: 20px;">📋 历史记录</h3>
    <div class="history-list" id="historyList">
      <div class="history-item">
        <span class="h-emoji">☀️</span>
        <div class="h-info">
          <div class="h-date">07月12日</div>
          <div class="h-note">和朋友一起去看了电影，超开心！</div>
        </div>
        <span class="h-tag">晴朗</span>
      </div>
      <div class="history-item">
        <span class="h-emoji">☁️</span>
        <div class="h-info">
          <div class="h-date">07月11日</div>
          <div class="h-note">加班有点累，心情一般</div>
        </div>
        <span class="h-tag">多云</span>
      </div>
      <div class="history-item">
        <span class="h-emoji">🌈</span>
        <div class="h-info">
          <div class="h-date">07月10日</div>
          <div class="h-note">收到了一份意外的礼物～</div>
        </div>
        <span class="h-tag">彩虹</span>
      </div>
    </div>
  </div>
</div>

<!-- Toast 提示 -->
<div class="toast" id="toast"></div>

<script>
  let selectedMood = null;

  // 情绪选择
  document.querySelectorAll('.mood-item').forEach(item => {
    item.addEventListener('click', function() {
      document.querySelectorAll('.mood-item').forEach(i => i.classList.remove('selected'));
      this.classList.add('selected');
      selectedMood = {
        mood: this.dataset.mood,
        emoji: this.dataset.emoji,
        label: this.dataset.label,
        color: this.dataset.color
      };
      document.getElementById('currentWeatherIcon').textContent = this.dataset.emoji;
      document.getElementById('currentWeatherLabel').textContent = this.dataset.label;
      document.getElementById('currentWeatherDesc').textContent = '已选择「' + this.dataset.label + '」心情';
    });
  });

  // 记录情绪
  document.getElementById('btnRecord').addEventListener('click', function() {
    if (!selectedMood) {
      showToast('请先选择一种天气心情哦～');
      return;
    }
    const note = document.getElementById('moodNote').value.trim() || '今天没有特别的记录';
    const now = new Date();
    const dateStr = (now.getMonth() + 1).toString().padStart(2, '0') + '月' + now.getDate().toString().padStart(2, '0') + '日';

    const historyList = document.getElementById('historyList');
    const newItem = document.createElement('div');
    newItem.className = 'history-item';
    newItem.style.animation = 'fadeIn 0.5s ease';
    newItem.innerHTML = `
      <span class="h-emoji">${selectedMood.emoji}</span>
      <div class="h-info">
        <div class="h-date">${dateStr}</div>
        <div class="h-note">${note}</div>
      </div>
      <span class="h-tag">${selectedMood.label}</span>
    `;
    historyList.insertBefore(newItem, historyList.firstChild);

    document.getElementById('moodNote').value = '';
    document.querySelectorAll('.mood-item').forEach(i => i.classList.remove('selected'));
    selectedMood = null;
    updateChart();
    showToast('✅ 情绪已记录！');
  });

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  function updateChart() {
    const chart = document.getElementById('chartArea');
    const colors = ['#FFB74D', '#B0BEC5', '#AB47BC', '#FFB74D', '#90CAF9', '#5C6BC0', '#FFB74D'];
    const heights = [70, 40, 85, 60, 30, 55, 75];
    const labels = ['一', '二', '三', '四', '五', '六', '日'];
    chart.innerHTML = colors.map((c, i) =>
      `<div class="chart-bar" style="height:${heights[i]}px;background:${c};"><span class="bar-label">${labels[i]}</span></div>`
    ).join('');
  }

  // 初始图表
  updateChart();

  // 添加动画样式
  const style = document.createElement('style');
  style.textContent = '@keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }';
  document.head.appendChild(style);
</script>

</body>
</html>
