<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FocusFlow - 智能番茄钟专注工具</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --bg-primary: #1a1d29;
    --bg-secondary: #252938;
    --bg-card: #2d3142;
    --accent: #ff6b6b;
    --accent-hover: #ff5252;
    --success: #4ecdc4;
    --text-primary: #f7f7f7;
    --text-secondary: #a0a3b1;
    --border: #3d4156;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #1a1d29 0%, #252938 100%);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1.2fr;
    gap: 24px;
  }

  .header {
    grid-column: 1 / -1;
    text-align: center;
    padding: 24px 0;
  }

  .header h1 {
    font-size: 32px;
    font-weight: 700;
    background: linear-gradient(135deg, #ff6b6b 0%, #4ecdc4 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }

  .header p {
    color: var(--text-secondary);
    font-size: 14px;
  }

  /* 计时器卡片 */
  .timer-card {
    background: var(--bg-card);
    border-radius: 20px;
    padding: 32px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .mode-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    background: var(--bg-primary);
    padding: 6px;
    border-radius: 12px;
  }

  .mode-tab {
    padding: 8px 16px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    border-radius: 8px;
    font-size: 13px;
    transition: all 0.3s;
  }

  .mode-tab.active {
    background: var(--accent);
    color: white;
  }

  .timer-circle {
    width: 240px;
    height: 240px;
    position: relative;
    margin: 16px 0;
  }

  .timer-circle svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .timer-circle .bg-ring {
    fill: none;
    stroke: var(--bg-primary);
    stroke-width: 8;
  }

  .timer-circle .progress-ring {
    fill: none;
    stroke: var(--accent);
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear, stroke 0.3s;
  }

  .timer-display {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }

  .timer-display .time {
    font-size: 48px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -1px;
  }

  .timer-display .status {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .timer-controls {
    display: flex;
    gap: 12px;
    margin-top: 24px;
  }

  .btn {
    padding: 12px 28px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-primary {
    background: var(--accent);
    color: white;
  }

  .btn-primary:hover {
    background: var(--accent-hover);
    transform: translateY(-2px);
  }

  .btn-secondary {
    background: var(--bg-primary);
    color: var(--text-primary);
  }

  .btn-secondary:hover {
    background: var(--border);
  }

  .session-info {
    margin-top: 20px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 13px;
  }

  .session-info .count {
    color: var(--accent);
    font-weight: 700;
    font-size: 16px;
  }

  /* 任务管理 */
  .task-card {
    background: var(--bg-card);
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }

  .section-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .task-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .task-input {
    flex: 1;
    padding: 12px 16px;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .task-input:focus {
    border-color: var(--accent);
  }

  .task-input::placeholder {
    color: var(--text-secondary);
  }

  .add-btn {
    padding: 12px 20px;
    background: var(--success);
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s;
  }

  .add-btn:hover {
    opacity: 0.9;
  }

  .task-list {
    list-style: none;
    max-height: 280px;
    overflow-y: auto;
  }

  .task-list::-webkit-scrollbar {
    width: 6px;
  }

  .task-list::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }

  .task-item {
    display: flex;
    align-items: center;
    padding: 12px 14px;
    background: var(--bg-primary);
    border-radius: 10px;
    margin-bottom: 8px;
    transition: all 0.2s;
    border: 1px solid transparent;
  }

  .task-item.active {
    border-color: var(--accent);
    background: rgba(255,107,107,0.1);
  }

  .task-item.completed {
    opacity: 0.5;
  }

  .task-item.completed .task-text {
    text-decoration: line-through;
  }

  .task-checkbox {
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    margin-right: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .task-checkbox.checked {
    background: var(--success);
    border-color: var(--success);
  }

  .task-checkbox.checked::after {
    content: '✓';
    color: white;
    font-size: 13px;
    font-weight: 700;
  }

  .task-text {
    flex: 1;
    font-size: 14px;
    cursor: pointer;
    word-break: break-word;
  }

  .task-pomodoros {
    font-size: 11px;
    color: var(--text-secondary);
    background: var(--bg-secondary);
    padding: 3px 8px;
    border-radius: 10px;
    margin: 0 8px;
    white-space: nowrap;
  }

  .task-delete {
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 16px;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.2s;
  }

  .task-delete:hover {
    color: var(--accent);
    background: rgba(255,107,107,0.1);
  }

  .empty-state {
    text-align: center;
    padding: 32px 16px;
    color: var(--text-secondary);
    font-size: 13px;
  }

  /* 统计卡片 */
  .stats-card {
    grid-column: 1 / -1;
    background: var(--bg-card);
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }

  .stat-box {
    background: var(--bg-primary);
    border-radius: 14px;
    padding: 20px;
    text-align: center;
  }

  .stat-box .label {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }

  .stat-box .value {
    font-size: 28px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .stat-box .unit {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  .stat-box.accent .value { color: var(--accent); }
  .stat-box.success .value { color: var(--success); }

  /* 周视图 */
  .weekly-chart {
    grid-column: 1 / -1;
    background: var(--bg-card);
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }

  .chart-bars {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    height: 120px;
    margin-top: 20px;
    gap: 12px;
  }

  .chart-bar-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .chart-bar {
    width: 100%;
    max-width: 40px;
    background: linear-gradient(180deg, var(--accent) 0%, #ff8e8e 100%);
    border-radius: 6px 6px 0 0;
    transition: height 0.5s;
    min-height: 4px;
    position: relative;
  }

  .chart-bar.today {
    background: linear-gradient(180deg, var(--success) 0%, #7eddd5 100%);
  }

  .chart-bar-count {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .chart-label {
    font-size: 11px;
    color: var(--text-secondary);
  }

  /* 设置 */
  .settings-row {
    display: flex;
    gap: 12px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .setting-item {
    flex: 1;
    min-width: 120px;
    background: var(--bg-primary);
    border-radius: 10px;
    padding: 10px 14px;
  }

  .setting-item label {
    font-size: 11px;
    color: var(--text-secondary);
    display: block;
    margin-bottom: 4px;
  }

  .setting-item input {
    width: 100%;
    background: none;
    border: none;
    color: var(--text-primary);
    font-size: 16px;
    font-weight: 600;
    outline: none;
  }

  /* 完成提示 */
  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: var(--success);
    color: white;
    padding: 14px 24px;
    border-radius: 12px;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 1000;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
  }

  /* 响应式 */
  @media (max-width: 768px) {
    .container { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .header h1 { font-size: 24px; }
    .timer-circle { width: 200px; height: 200px; }
    .timer-display .time { font-size: 40px; }
  }

  .footer {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--text-secondary);
    font-size: 12px;
    padding: 20px 0;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🍅 FocusFlow</h1>
    <p>智能番茄钟专注工具 · 让专注成为一种习惯</p>
  </div>

  <!-- 计时器 -->
  <div class="timer-card">
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="focus" data-time="25">专注 25min</button>
      <button class="mode-tab" data-mode="short" data-time="5">短休息 5min</button>
      <button class="mode-tab" data-mode="long" data-time="15">长休息 15min</button>
    </div>

    <div class="timer-circle">
      <svg viewBox="0 0 200 200">
        <circle class="bg-ring" cx="100" cy="100" r="92"/>
        <circle class="progress-ring" id="progressRing" cx="100" cy="100" r="92"
                stroke-dasharray="578.05" stroke-dashoffset="0"/>
      </svg>
      <div class="timer-display">
        <div class="time" id="timeDisplay">25:00</div>
        <div class="status" id="statusDisplay">准备专注</div>
      </div>
    </div>

    <div class="timer-controls">
      <button class="btn btn-primary" id="startBtn">▶ 开始专注</button>
      <button class="btn btn-secondary" id="resetBtn">↻ 重置</button>
    </div>

    <div class="session-info">
      今日已完成 <span class="count" id="todayCount">0</span> 个番茄钟
    </div>
  </div>

  <!-- 任务管理 -->
  <div class="task-card">
    <div class="section-title">📝 任务清单</div>
    <div class="task-input-row">
      <input type="text" class="task-input" id="taskInput" placeholder="添加一个任务，按回车确认..." maxlength="60">
      <button class="add-btn" id="addBtn">添加</button>
    </div>
    <ul class="task-list" id="taskList"></ul>
    <div class="empty-state" id="emptyState">还没有任务，添加一个开始专注吧 ✨</div>
  </div>

  <!-- 统计 -->
  <div class="stats-card">
    <div class="section-title">📊 专注统计</div>
    <div class="stats-grid">
      <div class="stat-box accent">
        <div class="label">今日番茄钟</div>
        <div class="value" id="statToday">0</div>
        <div class="unit">个</div>
      </div>
      <div class="stat-box success">
        <div class="label">今日专注时长</div>
        <div class="value" id="statTodayTime">0</div>
        <div class="unit">分钟</div>
      </div>
      <div class="stat-box">
        <div class="label">累计番茄钟</div>
        <div class="value" id="statTotal">0</div>
        <div class="unit">个</div>
      </div>
      <div class="stat-box">
        <div class="label">累计专注时长</div>
        <div class="value" id="statTotalTime">0</div>
        <div class="unit">小时</div>
      </div>
    </div>
    <div class="settings-row">
      <div class="setting-item">
        <label>专注时长（分钟）</label>
        <input type="number" id="focusDuration" value="25" min="1" max="90">
      </div>
      <div class="setting-item">
        <label>短休息（分钟）</label>
        <input type="number" id="shortDuration" value="5" min="1" max="30">
      </div>
      <div class="setting-item">
        <label>长休息（分钟）</label>
        <input type="number" id="longDuration" value="15" min="1" max="60">
      </div>
      <div class="setting-item">
        <label>长休息间隔（个）</label>
        <input type="number" id="longInterval" value="4" min="2" max="10">
      </div>
    </div>
  </div>

  <!-- 周视图 -->
  <div class="weekly-chart">
    <div class="section-title">📅 本周专注轨迹</div>
    <div class="chart-bars" id="chartBars"></div>
  </div>

  <div class="footer">
    FocusFlow © 2026 · 数据保存在本地浏览器 · TRAE AI 创造力大赛参赛作品
  </div>
</div>

<div class="toast" id="toast">🎉 番茄钟完成！</div>

<script>
  // ========== 数据存储 ==========
  const STORAGE_KEY = 'focusflow_data_v1';

  function loadData() {
    try {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) return JSON.parse(data);
    } catch(e) {}
    return {
      tasks: [],
      sessions: [], // {date: 'YYYY-MM-DD', mode: 'focus', duration: 25, taskId: null}
      settings: { focus: 25, short: 5, long: 15, longInterval: 4 }
    };
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch(e) {}
  }

  let state = loadData();

  // ========== 计时器逻辑 ==========
  let timer = {
    mode: 'focus',
    duration: 25 * 60, // 秒
    remaining: 25 * 60,
    running: false,
    intervalId: null
  };

  const modeConfig = {
    focus: { label: '专注中', color: '#ff6b6b', nextMode: null },
    short: { label: '短休息', color: '#4ecdc4', nextMode: 'focus' },
    long: { label: '长休息', color: '#4ecdc4', nextMode: 'focus' }
  };

  const RING_CIRCUMFERENCE = 2 * Math.PI * 92; // ~578.05

  function updateDisplay() {
    const min = Math.floor(timer.remaining / 60);
    const sec = timer.remaining % 60;
    document.getElementById('timeDisplay').textContent =
      `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;

    const progress = 1 - (timer.remaining / timer.duration);
    const offset = RING_CIRCUMFERENCE * (1 - progress);
    document.getElementById('progressRing').style.strokeDashoffset = offset;
    document.getElementById('progressRing').style.stroke = modeConfig[timer.mode].color;

    const statusEl = document.getElementById('statusDisplay');
    if (timer.running) {
      statusEl.textContent = modeConfig[timer.mode].label;
    } else {
      statusEl.textContent = timer.mode === 'focus' ? '准备专注' : '休息时间';
    }

    // 更新页面标题
    document.title = timer.running
      ? `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')} - FocusFlow`
      : 'FocusFlow - 智能番茄钟专注工具';
  }

  function startTimer() {
    if (timer.running) {
      // 暂停
      clearInterval(timer.intervalId);
      timer.running = false;
      document.getElementById('startBtn').innerHTML = '▶ 继续';
    } else {
      timer.running = true;
      document.getElementById('startBtn').innerHTML = '⏸ 暂停';
      timer.intervalId = setInterval(() => {
        timer.remaining--;
        if (timer.remaining <= 0) {
          completeSession();
        }
        updateDisplay();
      }, 1000);
    }
    updateDisplay();
  }

  function resetTimer() {
    clearInterval(timer.intervalId);
    timer.running = false;
    timer.remaining = timer.duration;
    document.getElementById('startBtn').innerHTML = '▶ 开始专注';
    updateDisplay();
  }

  function switchMode(mode) {
    clearInterval(timer.intervalId);
    timer.running = false;
    timer.mode = mode;
    const settings = state.settings;
    let minutes;
    if (mode === 'focus') minutes = settings.focus;
    else if (mode === 'short') minutes = settings.short;
    else minutes = settings.long;
    timer.duration = minutes * 60;
    timer.remaining = timer.duration;

    document.querySelectorAll('.mode-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.mode === mode);
    });
    document.getElementById('startBtn').innerHTML = '▶ 开始';
    updateDisplay();
  }

  function completeSession() {
    clearInterval(timer.intervalId);
    timer.running = false;

    // 记录会话
    if (timer.mode === 'focus') {
      const today = new Date().toISOString().split('T')[0];
      const activeTask = state.tasks.find(t => t.active);
      state.sessions.push({
        date: today,
        mode: 'focus',
        duration: state.settings.focus,
        taskId: activeTask ? activeTask.id : null
      });
      if (activeTask) {
        activeTask.pomodoros = (activeTask.pomodoros || 0) + 1;
      }
      saveData();
      showToast('🎉 专注完成！该休息一下了');
      playBeep();

      // 自动切换到休息
      const todayFocusCount = getTodayCount();
      const shouldLongBreak = todayFocusCount % state.settings.longInterval === 0;
      setTimeout(() => switchMode(shouldLongBreak ? 'long' : 'short'), 1000);
    } else {
      showToast('☕ 休息结束，继续专注吧！');
      playBeep();
      setTimeout(() => switchMode('focus'), 1000);
    }

    renderAll();
  }

  // ========== 提示音 ==========
  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 800;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.5);
    } catch(e) {}
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  // ========== 任务管理 ==========
  function addTask(text) {
    if (!text.trim()) return;
    state.tasks.push({
      id: Date.now(),
      text: text.trim(),
      completed: false,
      pomodoros: 0,
      active: false,
      createdAt: Date.now()
    });
    saveData();
    renderTasks();
  }

  function toggleTask(id) {
    const task = state.tasks.find(t => t.id === id);
    if (task) {
      task.completed = !task.completed;
      saveData();
      renderTasks();
    }
  }

  function deleteTask(id) {
    state.tasks = state.tasks.filter(t => t.id !== id);
    saveData();
    renderTasks();
  }

  function setActiveTask(id) {
    state.tasks.forEach(t => t.active = (t.id === id));
    saveData();
    renderTasks();
  }

  function renderTasks() {
    const list = document.getElementById('taskList');
    const empty = document.getElementById('emptyState');
    list.innerHTML = '';

    if (state.tasks.length === 0) {
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    // 按完成状态排序，未完成在前
    const sorted = [...state.tasks].sort((a,b) => {
      if (a.completed !== b.completed) return a.completed ? 1 : -1;
      return b.createdAt - a.createdAt;
    });

    sorted.forEach(task => {
      const li = document.createElement('li');
      li.className = 'task-item' + (task.completed ? ' completed' : '') + (task.active ? ' active' : '');

      const checkbox = document.createElement('div');
      checkbox.className = 'task-checkbox' + (task.completed ? ' checked' : '');
      checkbox.onclick = () => toggleTask(task.id);

      const text = document.createElement('div');
      text.className = 'task-text';
      text.textContent = task.text;
      if (!task.completed) {
        text.onclick = () => setActiveTask(task.id);
        text.title = '点击设为当前专注任务';
      }

      const pomodoro = document.createElement('span');
      pomodoro.className = 'task-pomodoros';
      pomodoro.textContent = `🍅 ${task.pomodoros || 0}`;

      const del = document.createElement('button');
      del.className = 'task-delete';
      del.textContent = '×';
      del.onclick = () => deleteTask(task.id);

      li.appendChild(checkbox);
      li.appendChild(text);
      li.appendChild(pomodoro);
      li.appendChild(del);
      list.appendChild(li);
    });
  }

  // ========== 统计 ==========
  function getTodayCount() {
    const today = new Date().toISOString().split('T')[0];
    return state.sessions.filter(s => s.date === today && s.mode === 'focus').length;
  }

  function getTodayMinutes() {
    const today = new Date().toISOString().split('T')[0];
    return state.sessions
      .filter(s => s.date === today && s.mode === 'focus')
      .reduce((sum, s) => sum + s.duration, 0);
  }

  function getTotalCount() {
    return state.sessions.filter(s => s.mode === 'focus').length;
  }

  function getTotalHours() {
    const minutes = state.sessions
      .filter(s => s.mode === 'focus')
      .reduce((sum, s) => sum + s.duration, 0);
    return (minutes / 60).toFixed(1);
  }

  function getWeeklyData() {
    const days = [];
    const labels = ['日','一','二','三','四','五','六'];
    const today = new Date();
    const todayIdx = today.getDay();

    for (let i = 6; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      const dateStr = d.toISOString().split('T')[0];
      const count = state.sessions.filter(s => s.date === dateStr && s.mode === 'focus').length;
      days.push({
        label: labels[d.getDay()],
        count: count,
        isToday: i === 0
      });
    }
    return days;
  }

  function renderStats() {
    document.getElementById('todayCount').textContent = getTodayCount();
    document.getElementById('statToday').textContent = getTodayCount();
    document.getElementById('statTodayTime').textContent = getTodayMinutes();
    document.getElementById('statTotal').textContent = getTotalCount();
    document.getElementById('statTotalTime').textContent = getTotalHours();
  }

  function renderChart() {
    const data = getWeeklyData();
    const maxCount = Math.max(...data.map(d => d.count), 1);
    const container = document.getElementById('chartBars');
    container.innerHTML = '';

    data.forEach(day => {
      const wrapper = document.createElement('div');
      wrapper.className = 'chart-bar-wrapper';

      const bar = document.createElement('div');
      bar.className = 'chart-bar' + (day.isToday ? ' today' : '');
      const heightPct = (day.count / maxCount) * 100;
      bar.style.height = day.count > 0 ? `${Math.max(heightPct, 8)}%` : '4px';

      if (day.count > 0) {
        const count = document.createElement('span');
        count.className = 'chart-bar-count';
        count.textContent = day.count;
        bar.appendChild(count);
      }

      const label = document.createElement('div');
      label.className = 'chart-label';
      label.textContent = day.label;
      if (day.isToday) label.style.color = 'var(--success)';
      label.style.fontWeight = day.isToday ? '700' : '400';

      wrapper.appendChild(bar);
      wrapper.appendChild(label);
      container.appendChild(wrapper);
    });
  }

  function renderAll() {
    renderTasks();
    renderStats();
    renderChart();
  }

  // ========== 事件绑定 ==========
  document.getElementById('startBtn').onclick = startTimer;
  document.getElementById('resetBtn').onclick = resetTimer;

  document.querySelectorAll('.mode-tab').forEach(tab => {
    tab.onclick = () => switchMode(tab.dataset.mode);
  });

  document.getElementById('addBtn').onclick = () => {
    const input = document.getElementById('taskInput');
    addTask(input.value);
    input.value = '';
    input.focus();
  };

  document.getElementById('taskInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      addTask(e.target.value);
      e.target.value = '';
    }
  });

  // 设置项
  ['focusDuration','shortDuration','longDuration','longInterval'].forEach((id, idx) => {
    const key = ['focus','short','long','longInterval'][idx];
    document.getElementById(id).addEventListener('change', (e) => {
      let val = parseInt(e.target.value);
      const min = parseInt(e.target.min);
      const max = parseInt(e.target.max);
      if (isNaN(val) || val < min) val = min;
      if (val > max) val = max;
      e.target.value = val;
      state.settings[key] = val;
      saveData();
      // 如果当前模式对应的设置改变且未运行，更新计时器
      if (!timer.running) {
        const modeMap = {focus:'focus', short:'short', long:'long'};
        if (modeMap[timer.mode] === key) {
          timer.duration = val * 60;
          timer.remaining = timer.duration;
          updateDisplay();
        }
      }
    });
  });

  // 键盘快捷键
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') {
      e.preventDefault();
      startTimer();
    }
    if (e.code === 'KeyR') resetTimer();
  });

  // 初始化
  renderAll();
  updateDisplay();
</script>

</body>
</html>
