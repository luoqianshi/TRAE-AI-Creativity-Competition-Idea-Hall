<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智录 - 防雷检测数据自动化协同系统</title>
    <style>
        :root {
            --primary-color: #4F46E5;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }
        .header {
            border-bottom: 2px solid #E5E7EB;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            color: var(--primary-color);
        }
        .header p {
            margin: 8px 0 0;
            color: var(--text-muted);
            font-size: 14px;
        }
        .upload-zone {
            border: 2px dashed #D1D5DB;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            background-color: #F9FAFB;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        .upload-zone:hover {
            border-color: var(--primary-color);
        }
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #4338CA;
        }
        .dashboard {
            margin-top: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #E5E7EB;
        }
        th {
            background-color: #F9FAFB;
            color: var(--text-muted);
            font-weight: 600;
        }
        .status-success {
            color: #10B981;
            font-weight: bold;
        }
        .status-processing {
            color: #F59E0B;
            font-weight: bold;
        }
        .progress-bar-container {
            width: 100%;
            background-color: #E5E7EB;
            border-radius: 999px;
            height: 8px;
            margin-top: 20px;
            overflow: hidden;
        }
        .progress-bar {
            background-color: var(--primary-color);
            height: 100%;
            width: 65%;
            border-radius: 999px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>智录 (SmartEntry) v1.0</h1>
        <p>防雷检测云管理平台 - 电阻数据OCR自动录入与多维匹配工具</p>
    </div>

    <div class="upload-zone" onclick="alert('这里将调用系统文件选择器')">
        <svg style="width:48px;height:48px;color:#9CA3AF;margin:0 auto;" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
        <h3 style="margin: 15px 0 5px; color: #374151;">点击或拖拽上传现场检测文件</h3>
        <p style="color: #6B7280; margin: 0;">支持扫描件 (JPG/PNG) 或 录入模板 (Excel)</p>
        <button class="btn">选择文件</button>
    </div>

    <div class="dashboard">
        <h3>数据处理看板</h3>
        <div style="display: flex; justify-content: space-between; font-size: 14px; color: #4B5563;">
            <span>正在处理: 录入模板_已合并1.xlsx</span>
            <span>进度: 60/90 条</span>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar"></div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>单体编号</th>
                    <th>检测类型</th>
                    <th>电阻类型 (匹配点)</th>
                    <th>提取条数</th>
                    <th>状态</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>单体 01</td>
                    <td>接闪装置 / 等电位连接</td>
                    <td>标准匹配</td>
                    <td>25 条</td>
                    <td class="status-success">✓ 成功转换</td>
                </tr>
                <tr>
                    <td>单体 03</td>
                    <td>接闪装置</td>
                    <td>多维修正</td>
                    <td>6 条</td>
                    <td class="status-success">✓ 成功转换</td>
                </tr>
                <tr>
                    <td>单体 04</td>
                    <td>等电位连接</td>
                    <td>类型缺失</td>
                    <td>-</td>
                    <td class="status-processing">⟳ 智能对齐中...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
