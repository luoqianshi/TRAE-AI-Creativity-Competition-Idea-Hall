<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭一周食谱与买菜清单生成器</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 页面主体样式 - 温馨暖色调 */
        :root {
            --primary-orange: #E67E22;          /* 暖橙色 - 主色调 */
            --primary-orange-light: #F5B041;     /* 浅橙色 */
            --primary-orange-dark: #D35400;     /* 深橙色 */
            --cream-white: #FDF6E3;            /* 米白色 - 背景色 */
            --cream-light: #FFF9F0;             /* 更浅的米白色 */
            --text-dark: #5D4E37;               /* 深棕色文字 */
            --text-light: #8B7355;              /* 浅棕色文字 */
            --border-color: #E8DCC8;            /* 边框色 */
            --shadow-soft: rgba(230, 126, 34, 0.15); /* 柔和阴影 */
            --success-green: #27AE60;          /* 成功绿色 */
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            background: linear-gradient(135deg, var(--cream-white) 0%, #FFF5E6 100%);
            min-height: 100vh;
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* 页面容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 页面标题区域 */
        .header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, var(--primary-orange) 0%, var(--primary-orange-light) 100%);
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px var(--shadow-soft);
            position: relative;
            overflow: hidden;
        }

        /* 标题装饰元素 */
        .header::before {
            content: '🍳';
            position: absolute;
            top: 20px;
            left: 30px;
            font-size: 40px;
            opacity: 0.3;
        }

        .header::after {
            content: '🥗';
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            opacity: 0.3;
        }

        .header h1 {
            font-size: 2.2em;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1em;
        }

        /* 配置区域 */
        .config-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px var(--shadow-soft);
            border: 2px solid var(--border-color);
        }

        .section-title {
            font-size: 1.5em;
            color: var(--primary-orange);
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 3px solid var(--primary-orange-light);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '⚙️';
            font-size: 1.2em;
        }

        /* 配置表单网格 */
        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 25px;
        }

        /* 表单项样式 */
        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
            font-size: 1em;
        }

        .form-group input[type="text"],
        .form-group select {
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1em;
            transition: all 0.3s ease;
            background: var(--cream-light);
            color: var(--text-dark);
        }

        .form-group input[type="text"]:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 3px var(--shadow-soft);
            background: white;
        }

        .form-group input[type="text"]::placeholder {
            color: var(--text-light);
        }

        /* 复选框组 */
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 10px 15px;
            background: var(--cream-light);
            border-radius: 10px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .checkbox-item:hover {
            border-color: var(--primary-orange-light);
        }

        .checkbox-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--primary-orange);
            cursor: pointer;
        }

        .checkbox-item span {
            font-size: 1em;
            color: var(--text-dark);
        }

        /* 生成按钮 */
        .generate-btn {
            width: 100%;
            padding: 18px 40px;
            background: linear-gradient(135deg, var(--primary-orange) 0%, var(--primary-orange-dark) 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px var(--shadow-soft);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .generate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(230, 126, 34, 0.4);
        }

        .generate-btn:active {
            transform: translateY(-1px);
        }

        /* 输出区域 */
        .output-section {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .output-section.show {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 输出卡片 */
        .output-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px var(--shadow-soft);
            border: 2px solid var(--border-color);
            position: relative;
        }

        .output-card .section-title {
            margin-bottom: 20px;
        }

        /* 一键复制按钮 */
        .copy-all-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            padding: 10px 20px;
            background: var(--success-green);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .copy-all-btn:hover {
            background: #219A52;
            transform: scale(1.05);
        }

        .copy-all-btn::before {
            content: '📋';
        }

        /* 食谱表格样式 */
        .recipe-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.95em;
        }

        .recipe-table th {
            background: linear-gradient(135deg, var(--primary-orange) 0%, var(--primary-orange-light) 100%);
            color: white;
            padding: 15px 12px;
            text-align: left;
            font-weight: 600;
        }

        .recipe-table th:first-child {
            border-radius: 10px 0 0 10px;
        }

        .recipe-table th:last-child {
            border-radius: 0 10px 10px 0;
        }

        .recipe-table td {
            padding: 14px 12px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: top;
        }

        .recipe-table tr:nth-child(even) {
            background: var(--cream-light);
        }

        .recipe-table tr:last-child td {
            border-bottom: none;
        }

        .recipe-table tr:hover {
            background: #FFF5E6;
        }

        .meal-type {
            font-weight: 600;
            color: var(--primary-orange-dark);
            margin-bottom: 5px;
        }

        .meal-item {
            color: var(--text-dark);
            line-height: 1.5;
        }

        /* 采购清单样式 */
        .shopping-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .shopping-category {
            background: var(--cream-light);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid var(--border-color);
        }

        .category-title {
            font-size: 1.2em;
            color: var(--primary-orange);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px dashed var(--border-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-title::before {
            font-size: 1.3em;
        }

        .category-vegetables::before { content: '🥬'; }
        .category-meat::before { content: '🥩'; }
        .category-staple::before { content: '🍚'; }
        .category-seasoning::before { content: '🧂'; }

        .ingredient-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed var(--border-color);
        }

        .ingredient-item:last-child {
            border-bottom: none;
        }

        .ingredient-name {
            color: var(--text-dark);
        }

        .ingredient-amount {
            background: var(--primary-orange-light);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }

        /* 空状态提示 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }

        .empty-state::before {
            content: '🍽️';
            display: block;
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 1.2em;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.6em;
            }

            .header::before,
            .header::after {
                display: none;
            }

            .config-section,
            .output-card {
                padding: 20px;
            }

            .recipe-table {
                font-size: 0.85em;
            }

            .recipe-table th,
            .recipe-table td {
                padding: 10px 8px;
            }

            .copy-all-btn {
                position: static;
                margin-bottom: 15px;
                width: 100%;
                justify-content: center;
            }

            .shopping-list {
                grid-template-columns: 1fr;
            }
        }

        /* 打印样式 */
        @media print {
            .config-section {
                display: none;
            }

            .copy-all-btn {
                display: none;
            }

            .output-card {
                box-shadow: none;
                border: 1px solid #ddd;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 页面标题 -->
        <header class="header">
            <h1>🏠 家庭一周食谱与买菜清单一键生成工具 🏠</h1>
            <p>智能搭配营养均衡的每日三餐，轻松管理家庭饮食</p>
        </header>

        <!-- 配置区域 -->
        <section class="config-section">
            <h2 class="section-title">个性化配置</h2>
            
            <div class="config-grid">
                <!-- 用餐人数 -->
                <div class="form-group">
                    <label for="peopleCount">👨‍👩‍👧‍👦 用餐人数</label>
                    <select id="peopleCount">
                        <option value="1">1人</option>
                        <option value="2" selected>2人</option>
                        <option value="3">3-4人</option>
                        <option value="5">5人以上</option>
                    </select>
                </div>

                <!-- 口味偏好 -->
                <div class="form-group">
                    <label for="tastePreference">🌶️ 口味偏好</label>
                    <select id="tastePreference">
                        <option value="light">清淡</option>
                        <option value="mild">微辣</option>
                        <option value="spicy">重辣</option>
                        <option value="any" selected>无要求</option>
                    </select>
                </div>

                <!-- 忌口食材 -->
                <div class="form-group">
                    <label for="foodRestrictions">🚫 忌口食材（可选）</label>
                    <input type="text" id="foodRestrictions" placeholder="如：香菜、海鲜、牛肉等">
                </div>
            </div>

            <!-- 餐食选择 -->
            <div class="form-group">
                <label>🍽️ 包含餐食</label>
                <div class="checkbox-group">
                    <label class="checkbox-item">
                        <input type="checkbox" id="includeBreakfast" checked>
                        <span>早餐</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="includeDinner" checked>
                        <span>午餐</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="includeLunch">
                        <span>晚餐</span>
                    </label>
                </div>
            </div>

            <!-- 生成按钮 -->
            <button class="generate-btn" onclick="generateMealPlan()">
                ✨ 一键生成食谱与清单 ✨
            </button>
        </section>

        <!-- 输出区域 -->
        <section class="output-section" id="outputSection">
            <!-- 一周食谱表 -->
            <div class="output-card">
                <h2 class="section-title">📅 一周食谱表</h2>
                <button class="copy-all-btn" onclick="copyAllContent()">复制全部内容</button>
                <div id="recipeTableContainer"></div>
            </div>

            <!-- 食材采购清单 -->
            <div class="output-card">
                <h2 class="section-title">🛒 食材采购清单</h2>
                <div id="shoppingListContainer"></div>
            </div>
        </section>
    </div>

        /**
         * 基础调料库 - 每餐都会用到的基本调料
         */
        const basicSeasonings = {
            '食用油': 0.05,
            '盐': 0.01,
            '生抽': 0.02,
            '鸡精': 0.005
        };

        /**
         * 根据用餐人数调整用量系数
         * @param {number} peopleCount - 用餐人数
         * @returns {number} 用量系数
         */
        function getQuantityMultiplier(peopleCount) {
            const multipliers = {
                '1': 0.6,    // 1人
                '2': 0.8,    // 2人
                '3': 1.0,    // 3-4人
                '5': 1.3     // 5人以上
            };
            return multipliers[peopleCount] || 1.0;
        }

        /**
         * 解析忌口食材列表
         * @returns {string[]} 忌口食材数组
         */
        function getFoodRestrictions() {
            const input = document.getElementById('foodRestrictions').value.trim();
            if (!input) return [];
            // 按中文逗号、英文逗号、空格或顿号分隔
            return input.split(/[,，、\s]+/).filter(item => item.length > 0);
        }

        /**
         * 检查食材是否在忌口列表中
         * @param {Object} ingredients - 食材对象
         * @param {string[]} restrictions - 忌口列表
         * @returns {boolean} 是否包含忌口食材
         */
        function containsRestrictedIngredient(ingredients, restrictions) {
            if (restrictions.length === 0) return false;
            const ingredientNames = Object.keys(ingredients);
            return ingredientNames.some(name => 
                restrictions.some(restricted => 
                    name.includes(restricted) || restricted.includes(name)
                )
            );
        }

        /**
         * 根据口味偏好过滤菜品
         * @param {Object[]} recipes - 菜品数组
         * @param {string} preference - 口味偏好
         * @returns {Object[]} 过滤后的菜品
         */
        function filterByTaste(recipes, preference) {
            if (preference === 'any') return recipes;
            return recipes.filter(recipe => recipe.taste.includes(preference) || recipe.taste.includes('light'));
        }

        /**
         * 随机打乱数组顺序
         * @param {Array} array - 输入数组
         * @returns {Array} 打乱后的新数组
         */
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        /**
         * 生成一周的食谱计划
         * @returns {Object} 包含每天的食谱和汇总食材
         */
        function generateWeeklyPlan() {
            // 获取用户配置
            const peopleCount = document.getElementById('peopleCount').value;
            const tastePreference = document.getElementById('tastePreference').value;
            const includeBreakfast = document.getElementById('includeBreakfast').checked;
            const includeLunch = document.getElementById('includeDinner').checked;
            const includeDinner = document.getElementById('includeLunch').checked;
            const restrictions = getFoodRestrictions();
            
            const quantityMultiplier = getQuantityMultiplier(peopleCount);
            
            // 准备可用菜品池
            let availableBreakfasts = filterByTaste(recipeDatabase.breakfast, tastePreference);
            let availableLunchMains = filterByTaste(recipeDatabase.lunchMain, tastePreference);
            let availableDinnerMains = filterByTaste(recipeDatabase.dinnerMain, tastePreference);
            let availableSideDishes = filterByTaste(recipeDatabase.sideDishes, 'any');
            
            // 过滤掉包含忌口食材的菜品
            availableBreakfasts = availableBreakfasts.filter(b => !containsRestrictedIngredient(b.ingredients, restrictions));
            availableLunchMains = availableLunchMains.filter(b => !containsRestrictedIngredient(b.ingredients, restrictions));
            availableDinnerMains = availableDinnerMains.filter(b => !containsRestrictedIngredient(b.ingredients, restrictions));
            availableSideDishes = availableSideDishes.filter(b => !containsRestrictedIngredient(b.ingredients, restrictions));
            
            // 打乱菜品顺序
            availableBreakfasts = shuffleArray(availableBreakfasts);
            availableLunchMains = shuffleArray(availableLunchMains);
            availableDinnerMains = shuffleArray(availableDinnerMains);
            availableSideDishes = shuffleArray(availableSideDishes);
            
            // 一周每天的计划
            const weekPlan = [];
            const totalIngredients = {};
            
            // 初始化基础调料
            Object.keys(basicSeasonings).forEach(seasoning => {
                totalIngredients[seasoning] = basicSeasonings[seasoning] * 7; // 假设每天至少两餐
            });
            
            // 星期名称
            const weekDays = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
            
            for (let dayIndex = 0; dayIndex < 7; dayIndex++) {
                const dayPlan = {
                    day: weekDays[dayIndex],
                    breakfast: null,
                    lunch: null,
                    dinner: null
                };
                
                // 早餐
                if (includeBreakfast && availableBreakfasts.length > 0) {
                    const breakfastIndex = dayIndex % availableBreakfasts.length;
                    dayPlan.breakfast = availableBreakfasts[breakfastIndex];
                    // 累加食材
                    Object.keys(dayPlan.breakfast.ingredients).forEach(ing => {
                        const amount = dayPlan.breakfast.ingredients[ing] * quantityMultiplier;
                        totalIngredients[ing] = (totalIngredients[ing] || 0) + amount;
                    });
                }
                
                // 午餐
                if (includeLunch && availableLunchMains.length > 0) {
                    const lunchIndex = (dayIndex + 3) % availableLunchMains.length;
                    dayPlan.lunch = availableLunchMains[lunchIndex];
                    // 累加食材
                    Object.keys(dayPlan.lunch.ingredients).forEach(ing => {
                        const amount = dayPlan.lunch.ingredients[ing] * quantityMultiplier;
                        totalIngredients[ing] = (totalIngredients[ing] || 0) + amount;
                    });
                    
                    // 添加一个配菜
                    if (availableSideDishes.length > 0) {
                        const sideIndex = dayIndex % availableSideDishes.length;
                        dayPlan.lunchSide = availableSideDishes[sideIndex];
                        Object.keys(dayPlan.lunchSide.ingredients).forEach(ing => {
                            const amount = dayPlan.lunchSide.ingredients[ing] * quantityMultiplier;
                            totalIngredients[ing] = (totalIngredients[ing] || 0) + amount;
                        });
                    }
                }
                
                // 晚餐
                if (includeDinner && availableDinnerMains.length > 0) {
                    const dinnerIndex = (dayIndex + 5) % availableDinnerMains.length;
                    dayPlan.dinner = availableDinnerMains[dinnerIndex];
                    // 累加食材
                    Object.keys(dayPlan.dinner.ingredients).forEach(ing => {
                        const amount = dayPlan.dinner.ingredients[ing] * quantityMultiplier;
                        totalIngredients[ing] = (totalIngredients[ing] || 0) + amount;
                    });
                    
                    // 添加一个配菜
                    if (availableSideDishes.length > 0) {
                        const sideIndex = (dayIndex + 2) % availableSideDishes.length;
                        dayPlan.dinnerSide = availableSideDishes[sideIndex];
                        Object.keys(dayPlan.dinnerSide.ingredients).forEach(ing => {
                            const amount = dayPlan.dinnerSide.ingredients[ing] * quantityMultiplier;
                            totalIngredients[ing] = (totalIngredients[ing] || 0) + amount;
                        });
                    }
                }
                
                weekPlan.push(dayPlan);
            }
            
            return { weekPlan, totalIngredients };
        }

        /**
         * 格式化用量
         * @param {number} amount - 用量数值
         * @returns {string} 格式化后的用量字符串
         */
        function formatAmount(amount) {
            if (amount >= 1) {
                if (amount >= 10) {
                    return Math.round(amount).toString() + '个/份';
                }
                return amount.toFixed(1).replace(/\.0$/, '') + '份';
            } else if (amount >= 0.1) {
                return (amount * 10).toFixed(0) + '两左右';
            } else if (amount >= 0.05) {
                return '少量';
            } else if (amount >= 0.02) {
                return '少许';
            } else {
                return '适量';
            }
        }

        /**
         * 渲染食谱表格
         * @param {Object} data - 生成的食谱数据
         */
        function renderRecipeTable(data) {
            const container = document.getElementById('recipeTableContainer');
            const { weekPlan } = data;
            
            let html = `
                <table class="recipe-table">
                    <thead>
                        <tr>
                            <th>星期</th>
                            <th>早餐</th>
                            <th>午餐</th>
                            <th>晚餐</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            weekPlan.forEach(day => {
                // 早餐单元格
                let breakfastCell = '-';
                if (day.breakfast) {
                    breakfastCell = `<div class="meal-item">${day.breakfast.name}</div>`;
                }
                
                // 午餐单元格
                let lunchCell = '-';
                if (day.lunch) {
                    lunchCell = `<div class="meal-item">${day.lunch.name}`;
                    if (day.lunchSide) {
                        lunchCell += `<br><small style="color:#8B7355;">+ ${day.lunchSide.name}</small>`;
                    }
                    lunchCell += '</div>';
                }
                
                // 晚餐单元格
                let dinnerCell = '-';
                if (day.dinner) {
                    dinnerCell = `<div class="meal-item">${day.dinner.name}`;
                    if (day.dinnerSide) {
                        dinnerCell += `<br><small style="color:#8B7355;">+ ${day.dinnerSide.name}</small>`;
                    }
                    dinnerCell += '</div>';
                }
                
                html += `
                    <tr>
                        <td><strong>${day.day}</strong></td>
                        <td>${breakfastCell}</td>
                        <td>${lunchCell}</td>
                        <td>${dinnerCell}</td>
                    </tr>
                `;
            });
            
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        /**
         * 渲染采购清单
         * @param {Object} categorizedIngredients - 分类后的食材
         */
        function renderShoppingList(categorizedIngredients) {
            const container = document.getElementById('shoppingListContainer');
            
            let html = '<div class="shopping-list">';
            
            // 蔬菜类
            html += renderCategory('蔬菜类', categorizedIngredients['蔬菜类'], 'vegetables');
            
            // 肉类
            html += renderCategory('肉类', categorizedIngredients['肉类'], 'meat');
            
            // 主食类
            html += renderCategory('主食类', categorizedIngredients['主食类'], 'staple');
            
            // 调料类
            html += renderCategory('调料类', categorizedIngredients['调料类'], 'seasoning');
            
            html += '</div>';
            container.innerHTML = html;
        }

        /**
         * 渲染单个分类
         * @param {string} title - 分类标题
         * @param {Object} items - 食材项目
         * @param {string} className - CSS类名
         * @returns {string} HTML字符串
         */
        function renderCategory(title, items, className) {
            const itemKeys = Object.keys(items);
            if (itemKeys.length === 0) return '';
            
            let itemsHtml = '';
            itemKeys.sort().forEach(name => {
                itemsHtml += `
                    <div class="ingredient-item">
                        <span class="ingredient-name">${name}</span>
                        <span class="ingredient-amount">${formatAmount(items[name])}</span>
                    </div>
                `;
            });
            
            return `
                <div class="shopping-category">
                    <h3 class="category-title category-${className}">${title}</h3>
                    ${itemsHtml}
                </div>
            `;
        }

        /**
         * 生成完整的文本内容用于复制
         * @param {Object} data - 生成的食谱数据
         * @param {Object} categorizedIngredients - 分类后的食材
         * @returns {string} 完整文本
         */
        function generateCopyText(data, categorizedIngredients) {
            const { weekPlan } = data;
            let text = '========== 家庭一周食谱 ==========\n\n';
            
            // 生成食谱表
            weekPlan.forEach(day => {
                text += `${day.day}\n`;
                text += `早餐: ${day.breakfast ? day.breakfast.name : '无'}\n`;
                text += `午餐: ${day.lunch ? day.lunch.name : '无'}`;
                if (day.lunchSide) text += ` + ${day.lunchSide.name}`;
                text += '\n';
                text += `晚餐: ${day.dinner ? day.dinner.name : '无'}`;
                if (day.dinnerSide) text += ` + ${day.dinnerSide.name}`;
                text += '\n\n';
            });
            
            // 生成采购清单
            text += '\n========== 食材采购清单 ==========\n\n';
            
            const categories = ['蔬菜类', '肉类', '主食类', '调料类'];
            categories.forEach(category => {
                const items = categorizedIngredients[category];
                const itemKeys = Object.keys(items);
                if (itemKeys.length > 0) {
                    text += `[${category}]\n`;
                    itemKeys.sort().forEach(name => {
                        text += `${name}: ${formatAmount(items[name])}\n`;
                    });
                    text += '\n';
                }
            });
            
            return text;
        }

        /**
         * 主生成函数
         */
        function generateMealPlan() {
            // 生成一周计划
            const { weekPlan, totalIngredients } = generateWeeklyPlan();
            
            // 对食材进行分类
            const categorizedIngredients = categorizeIngredients(totalIngredients);
            
            // 渲染到页面
            renderRecipeTable({ weekPlan });
            renderShoppingList(categorizedIngredients);
            
            // 保存数据供复制使用
            window.currentMealData = { weekPlan, totalIngredients };
            window.currentCategorizedIngredients = categorizedIngredients;
            
            // 显示输出区域
            const outputSection = document.getElementById('outputSection');
            outputSection.classList.add('show');
            
            // 滚动到输出区域
            outputSection.scrollIntoView({ behavior: 'smooth' });
        }

        /**
         * 复制全部内容
         */
        function copyAllContent() {
            if (!window.currentMealData || !window.currentCategorizedIngredients) {
                alert('请先生成食谱！');
                return;
            }
            
            const text = generateCopyText(window.currentMealData, window.currentCategorizedIngredients);
            
            // 尝试使用剪贴板API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showCopySuccess();
                }).catch(err => {
                    // 降级到传统方法
                    fallbackCopyText(text);
                });
            } else {
                fallbackCopyText(text);
            }
        }

        /**
         * 传统复制方法（兼容旧浏览器）
         * @param {string} text - 要复制的文本
         */
        function fallbackCopyText(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showCopySuccess();
            } catch (err) {
                alert('复制失败，请手动选择文本复制');
            }
            
            document.body.removeChild(textarea);
        }

        /**
         * 显示复制成功提示
         */
        function showCopySuccess() {
            const btn = document.querySelector('.copy-all-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '✅ 复制成功！';
            btn.style.background = '#27AE60';
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.background = '';
            }, 2000);
        }
    </script>
