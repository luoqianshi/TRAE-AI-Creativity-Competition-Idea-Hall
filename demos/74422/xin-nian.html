ging:!1},{line:`九二`,text:`包蒙吉。纳妇吉，子克家。`,changing:!1},{line:`六三`,text:`勿用取女，见金夫，不有躬，无攸利。`,changing:!1},{line:`六四`,text:`困蒙，吝。`,changing:!1},{line:`六五`,text:`童蒙，吉。`,changing:!1},{line:`上九`,text:`击蒙，不利为寇，利御寇。`,changing:!1}],nayin:{upper:[`丙寅`,`丙子`,`丙戌`],lower:[`戊寅`,`戊辰`,`戊午`]},shiPosition:3,yingPosition:6},{id:5,name:`水天需`,shortName:`需`,upper:`kan`,lower:`qian`,judgment:`有孚，光亨，贞吉。利涉大川。`,lines:[{line:`初九`,text:`需于郊，利用恒，无咎。`,changing:!1},{line:`九二`,text:`需于沙，小有言，终吉。`,changing:!1},{line:`九三`,text:`需于泥，致寇至。`,changing:!1},{line:`六四`,text:`需于血，出自穴。`,changing:!1},{line:`九五`,text:`需于酒食，贞吉。`,changing:!1},{line:`上六`,text:`入于穴，有不速之客三人来，敬之终吉。`,changing:!1}],nayin:{upper:[`戊子`,`戊戌`,`戊申`],lower:[`甲子`,`甲寅`,`甲辰`]},shiPosition:1,yingPosition:4},{id:6,name:`天水讼`,shortName:`讼`,upper:`qian`,lower:`kan`,judgment:`有孚，窒惕，中吉，终凶。利见大人，不利涉大川。`,lines:[{line:`初六`,text:`不永所事，小有言，终吉。`,changing:!1},{line:`九二`,text:`不克讼，归而逋，其邑人三百户，无眚。`,changing:!1},{line:`六三`,text:`食旧德，贞厉，终吉。或从王事，无成。`,changing:!1},{line:`九四`,text:`不克讼，复即命渝，安贞吉。`,changing:!1},{line:`九五`,text:`讼，元吉。`,changing:!1},{line:`上九`,text:`或锡之鞶带，终朝三褫之。`,changing:!1}],nayin:{upper:[`壬戌`,`壬申`,`壬午`],lower:[`戊午`,`戊辰`,`戊寅`]},shiPosition:2,yingPosition:5},{id:7,name:`地水师`,shortName:`师`,upper:`kun`,lower:`kan`,judgment:`贞，丈人吉，无咎。`,lines:[{line:`初六`,text:`师出以律，否臧凶。`,changing:!1},{line:`九二`,text:`在师中吉，无咎，王三锡命。`,changing:!1},{line:`六三`,text:`师或舆尸，凶。`,changing:!1},{line:`六四`,text:`师左次，无咎。`,changing:!1},{line:`六五`,text:`田有禽，利执言，无咎。长子帅师，弟子舆尸，贞凶。`,changing:!1},{line:`上六`,text:`大君有命，开国承家，小人勿用。`,changing:!1}],nayin:{upper:[`癸酉`,`癸亥`,`癸丑`],lower:[`戊午`,`戊辰`,`戊寅`]},shiPosition:2,yingPosition:5},{id:8,name:`水地比`,shortName:`比`,upper:`kan`,lower:`kun`,judgment:`吉。原筮元永贞，无咎。不宁方来，后夫凶。`,lines:[{line:`初六`,text:`有孚比之，无咎。有孚盈缶，终来有它吉。`,changing:!1},{line:`六二`,text:`比之自内，贞吉。`,changing:!1},{line:`六三`,text:`比之匪人。`,changing:!1},{line:`六四`,text:`外比之，贞吉。`,changing:!1},{line:`九五`,text:`显比，王用三驱，失前禽，邑人不诫，吉。`,changing:!1},{line:`上六`,text:`比之无首，凶。`,changing:!1}],nayin:{upper:[`戊子`,`戊戌`,`戊申`],lower:[`乙卯`,`乙巳`,`乙未`]},shiPosition:5,yingPosition:2},{id:9,name:`风天小畜`,shortName:`小畜`,upper:`xun`,lower:`qian`,judgment:`亨。密云不雨，自我西郊。`,lines:[{line:`初九`,text:`复自道，何其咎，吉。`,changing:!1},{line:`九二`,text:`牵复，吉。`,changing:!1},{line:`九三`,text:`舆说辐，夫妻反目。`,changing:!1},{line:`六四`,text:`有孚，血去惕出，无咎。`,changing:!1},{line:`九五`,text:`有孚挛如，富以其邻。`,changing:!1},{line:`上九`,text:`既雨既处，尚德载，妇贞厉。月几望，君子征凶。`,changing:!1}],nayin:{upper:[`辛卯`,`辛巳`,`辛未`],lower:[`甲子`,`甲寅`,`甲辰`]},shiPosition:3,yingPosition:6},{id:10,name:`天泽履`,shortName:`履`,upper:`qian`,lower:`dui`,judgment:`履虎尾，不咥人，亨。`,lines:[{line:`初九`,text:`素履，往无咎。`,changing:!1},{line:`九二`,text:`履道坦坦，幽人贞吉。`,changing:!1},{line:`六三`,text:`眇能视，跛能履，履虎尾咥人，凶。武人为于大君。`,changing:!1},{line:`九四`,text:`履虎尾，愬愬终吉。`,changing:!1},{line:`九五`,text:`夬履，贞厉。`,changing:!1},{line:`上九`,text:`视履考祥，其旋元吉。`,changing:!1}],nayin:{upper:[`壬戌`,`壬申`,`壬午`],lower:[`丁丑`,`丁卯`,`丁巳`]},shiPosition:5,yingPosition:2},{id:11,name:`地天泰`,shortName:`泰`,upper:`kun`,lower:`qian`,judgment:`小往大来，吉亨。`,lines:[{line:`初九`,text:`拔茅茹，以其汇，征吉。`,changing:!1},{line:`九二`,text:`包荒，用冯河，不遐遗，朋亡，得尚于中行。`,changing:!1},{line:`九三`,text:`无平不陂，无往不复，艰贞无咎。勿恤其孚，于食有福。`,changing:!1},{line:`六四`,text:`翩翩，不富以其邻，不戒以孚。`,changing:!1},{line:`六五`,text:`帝乙归妹，以祉元吉。`,changing:!1},{line:`上六`,text:`城复于隍，勿用师。自邑告命，贞吝。`,changing:!1}],nayin:{upper:[`癸酉`,`癸亥`,`癸丑`],lower:[`甲子`,`甲寅`,`甲辰`]},shiPosition:3,yingPosition:6},{id:12,name:`天地否`,shortName:`否`,upper:`qian`,lower:`kun`,judgment:`否之匪人，不利君子贞，大往小来。`,lines:[{line:`初六`,text:`拔茅茹，以其汇，贞吉亨。`,changing:!1},{line:`六二`,text:`包承，小人吉，大人否亨。`,changing:!1},{line:`六三`,text:`包羞。`,changing:!1},{line:`九四`,text:`有命无咎，畴离祉。`,changing:!1},{line:`九五`,text:`休否，大人吉。其亡其亡，系于苞桑。`,changing:!1},{line:`上九`,text:`倾否，先否后喜。`,changing:!1}],nayin:{upper:[`壬戌`,`壬申`,`壬午`],lower:[`乙未`,`乙巳`,`乙卯`]},shiPosition:3,yingPosition:6},{id:13,name:`天火同人`,shortName:`同人`,upper:`qian`,lower:`li`,judgment:`同人于野，亨。利涉大川，利君子贞。`,lines:[{line:`初九`,text:`同人于门，无咎。`,changing:!1},{line:`六二`,text:`同人于宗，吝。`,changing:!1},{line:`九三`,text:`伏戎于莽，升其高陵，三岁不兴。`,changing:!1},{line:`九四`,text:`乘其墉，弗克攻，吉。`,changing:!1},{line:`九五`,text:`同人，先号啕而后笑。大师克相遇。`,changing:!1},{line:`上九`,text:`同人于郊，无悔。`,changing:!1}],nayin:{upper:[`壬戌`,`壬申`,`壬午`],lower:[`己卯`,`己丑`,`己亥`]},shiPosition:2,yingPosition:5},{id:14,name:`火天大有`,shortName:`大有`,upper:`li`,lower:`qian`,judgment:`元亨。`,lines:[{line:`初九`,text:`无交害，匪咎，艰则无咎。`,changing:!1},{line:`九二`,text:`大车以载，有攸往，无咎。`,changing:!1},{line:`九三`,text:`公用亨于天子，小人弗克。`,changing:!1},{line:`九四`,text:`匪其彭，无咎。`,changing:!1},{line:`六五`,text:`厥孚交如，威如，吉。`,changing:!1},{line:`上九`,text:`自天祐之，吉无不利。`,changing:!1}],nayin:{upper:[`己巳`,`己未`,`己酉`],lower:[`甲子`,`甲寅`,`甲辰`]},shiPosition:5,yingPosition:2},{id:15,name:`地山谦`,shortName:`谦`,upper:`kun`,lower:`gen`,judgment:`亨，君子有终。`,lines:[{line:`初六`,text:`谦谦君子，用涉大川，吉。`,changing:!1},{line:`六二`,text:`鸣谦，贞吉。`,changing:!1},{line:`九三`,text:`劳谦，君子有终，吉。`,changing:!1},{line:`六四`,text:`无不利，撝谦。`,changing:!1},{line:`六五`,text:`不富以其邻，利用侵伐，无不利。`,changing:!1},{line:`上六`,text:`鸣谦，利用行师，征邑国。`,changing:!1}],nayin:{upper:[`癸酉`,`癸亥`,`癸丑`],lower:[`丙辰`,`丙午`,`丙申`]},shiPosition:3,yingPosition:6},{id:16,name:`雷地豫`,shortName:`豫`,upper:`zhen`,lower:`kun`,judgment:`利建侯行师。`,lines:[{line:`初六`,text:`鸣豫，凶。`,changing:!1},{line:`六二`,text:`介于石，不终日，贞吉。`,changing:!1},{line:`六三`,text:`盱豫，悔。迟有悔。`,changing:!1},{line:`九四`,text:`由豫，大有得。勿疑。朋盍簪。`,changing:!1},{line:`六五`,text:`贞疾，恒不死。`,changing:!1},{line:`上六`,text:`冥豫，成有渝，无咎。`,changing:!1}],nayin:{upper:[`庚戌`,`庚申`,`庚午`],lower:[`乙未`,`乙巳`,`乙卯`]},shiPosition:1,yingPosition:4},{id:17,name:`泽雷随`,shortName:`随`,upper:`dui`,lower:`zhen`,judgment:`元亨利贞，无咎。`,lines:[{line:`初九`,text:`官有渝，贞吉。出门交有功。`,changing:!1},{line:`六二`,text:`系小子，失丈夫。`,changing:!1},{line:`六三`,text:`系丈夫，失小子。随有求得，利居贞。`,changing:!1},{line:`九四`,text:`随有获，贞凶。有孚在道，以明，何咎。`,changing:!1},{line:`九五`,text:`孚于嘉，吉。`,changing:!1},{line:`上六`,text:`拘系之，乃从维之。王用亨于西山。`,changing:!1}],nayin:{upper:[`丁未`,`丁酉`,`丁亥`],lower:[`庚辰`,`庚寅`,`庚子`]},shiPosition:3,yingPosition:6},{id:18,name:`山风蛊`,shortName:`蛊`,upper:`gen`,lower:`xun`,judgment:`元亨，利涉大川。先甲三日，后甲三日。`,lines:[{line:`初六`,text:`干父之蛊，有子，考无咎，厉终吉。`,changing:!1},{line:`九二`,text:`干母之蛊，不可贞。`,changing:!1},{line:`九三`,text:`干父之蛊，小有悔，无大咎。`,changing:!1},{line:`六四`,text:`裕父之蛊，往见吝。`,changing:!1},{line:`六五`,text:`干父之蛊，用誉。`,changing:!1},{line:`上九`,text:`不事王侯，高尚其事。`,changing:!1}],nayin:{upper:[`丙寅`,`丙子`,`丙戌`],lower:[`辛丑`,`辛亥`,`辛酉`]},shiPosition:6,yingPosition:3},{id:19,name:`地泽临`,shortName:`临`,upper:`kun`,lower:`dui`,judgment:`元亨利贞。至于八月有凶。`,lines:[{line:`初九`,text:`咸临，贞吉。`,changing:!1},{line:`九二`,text:`咸临，吉无不利。`,changing:!1},{line:`六三`,text:`甘临，无攸利。既忧之，无咎。`,changing:!1},{line:`六四`,text:`至临，无咎。`,changing:!1},{line:`六五`,text:`知临，大君之宜，吉。`,changing:!1},{line:`上六`,text:`敦临，吉无咎。`,changing:!1}],nayin:{upper:[`癸酉`,`癸亥`,`癸丑`],lower:[`丁丑`,`丁卯`,`丁巳`]},shiPosition:2,yingPosition:5},{id:20,name:`风地观`,shortName:`观`,upper:`xun`,lower:`kun`,judgment:`盥而不荐，有孚颙若。`,lines:[{line:`初六`,text:`童观，小人无咎，君子吝。`,changing:!1},{line:`六二`,text:`窥观，利女贞。`,changing:!1},{line:`六三`,text:`观我生，进退。`,changing:!1},{line:`六四`,text:`观国之光，利用宾于王。`,changing:!1},{line:`九五`,text:`观我生，君子无咎。`,changing:!1},{line:`上九`,text:`观其生，君子无咎。`,changing:!1}],nayin:{upper:[`辛卯`,`辛巳`,`辛未`],lower:[`乙未`,`乙巳`,`乙卯`]},shiPosition:4,yingPosition:1},{id:21,name:`火雷噬嗑`,shortName:`噬嗑`,upper:`li`,lower:`zhen`,judgment:`亨，利用狱。`,lines:[{line:`初九`,text:`屦校灭趾，无咎。`,changing:!1},{line:`六二`,text:`噬肤灭鼻，无咎。`,changing:!1},{line:`六三`,text:`噬腊肉，遇毒，小吝，无咎。`,changing:!1},{line:`九四`,text:`噬干胏，得金矢，利艰贞，吉。`,changing:!1},{line:`六五`,text:`噬干肉，得黄金，贞厉，无咎。`,changing:!1},{line:`上九`,text:`何校灭耳，凶。`,changing:!1}],nayin:{upper:[`己巳`,`己未`,`己酉`],lower:[`庚子`,`庚寅`,`庚辰`]},shiPosition:5,yingPosition:2},{id:22,name:`山火贲`,shortName:`贲`,upper:`gen`,lower:`li`,judgment:`亨。小利有攸往。`,lines:[{line:`初九`,text:`贲其趾，舍车而徒。`,changing:!1},{line:`六二`,text:`贲其须。`,changing:!1},{line:`九三`,text:`贲如濡如，永贞吉。`,changing:!1},{line:`六四`,text:`贲如皤如，白马翰如，匪寇婚媾。`,changing:!1},{line:`六五`,text:`贲于丘园，束帛戋戋，吝，终吉。`,changing:!1},{line:`上九`,text:`白贲，无咎。`,changing:!1}],nayin:{upper:[`丙寅`,`丙子`,`丙戌`],lower:[`己卯`,`己丑`,`己亥`]},shiPosition:1,yingPosition:4},{id:23,name:`山地剥`,shortName:`剥`,upper:`gen`,lower:`kun`,judgment:`不利有攸往。`,lines:[{line:`初六`,text:`剥床以足，蔑贞凶。`,changing:!1},{line:`六二`,text:`剥床以辨，蔑贞凶。`,changing:!1},{line:`六三`,text:`剥之，无咎。`,changing:!1},{line:`六四`,text:`剥床以肤，凶。`,changing:!1},{line:`六五`,text:`贯鱼，以宫人宠，无不利。`,changing:!1},{line:`上九`,text:`硕果不食，君子得舆，小人剥庐。`,changing:!1}],nayin:{upper:[`丙寅`,`丙子`,`丙戌`],lower:[`乙未`,`乙巳`,`乙卯`]},shiPosition:3,yingPosition:6},{id:24,name:`地雷复`,shortName:`复`,upper:`kun`,lower:`zhen`,judgment:`亨。出入无疾，朋来无咎。反复其道，七日来复，利有攸往。`,lines:[{line:`初九`,text:`不远复，无祗悔，元吉。`,changing:!1},{line:`六二`,text:`休复，吉。`,changing:!1},{line:`六三`,text:`频复，厉无咎。`,changing:!1},{line:`六四`,text:`中行独复。`,changing:!1},{line:`六五`,text:`敦复，无悔。`,changing:!1},{line:`上六`,text:`迷复，凶，有灾眚。用行师，终有大败，以其国君，凶。至于十年不克征。`,changing:!1}],nayin:{upper:[`癸酉`,`癸亥`,`癸丑`],lower:[`庚辰`,`庚寅`,`庚子`]},shiPosition:1,yingPosition:4},{id:25,name:`天雷无妄`,shortName:`无妄`,upper:`qian`,lower:`zhen`,judgment:`元亨利贞。其匪正有眚，不利有攸往。`,lines:[{line:`初九`,text:`无妄，往吉。`,changing:!1},{line:`六二`,text:`不耕获，不菑畲，则利有攸往。`,changing:!1},{line:`六三`,text:`无妄之灾，或系之牛，行人之得，邑人之灾。`,changing:!1},{line:`九四`,text:`可贞，无咎。`,changing:!1},{line:`九五`,text:`无妄之疾，勿药有喜。`,changing:!1},{line:`上九`,text:`无妄，行有眚，无攸利。`,changing:!1}],nayin:{upper:[`壬戌`,`壬申`,`壬午`],lower:[`庚子`,`庚寅`,`庚辰`]},shiPosition:4,yingPosition:1},{id:26,name:`山天大畜`,shortName:`大畜`,upper:`gen`,lower:`qian`,judgment:`利贞，不家食吉，利涉大川。`,lines:[{line:`初九`,text:`有厉，利已。`,changing:!1},{line:`九二`,text:`舆说輹。`,changing:!1},{line:`九三`,text:`良马逐，利艰贞。曰闲舆卫，利有攸往。`,changing:!1},{line:`六四`,text:`童牛之牿，元吉。`,changing:!1},{line:`六五`,text:`豮豕之牙，吉。`,changing:!1},{line:`上九`,text:`何天之衢，亨。`,changing:!1}],nayin:{upper:[`丙寅`,`丙子`,`丙戌`],lower:[`甲子`,`甲寅`,`甲辰`]},shiPosition:4,yingPosition:1},{id:27,name:`山雷颐`,shortName:`颐`,upper:`gen`,lower:`zhen`,judgment:`贞吉。观颐，自求口实。`,lines:[{line:`初九`,text:`舍尔灵龟，观我朵颐，凶。`,changing:!1},{line:`六二`,text:`颠颐，拂经，于丘颐，征凶。`,changing:!1},{line:`六三`,text:`拂颐，贞凶，十年勿用，无攸利。`,changing:!1},{line:`六四`,text:`颠颐，吉。虎视眈眈，其欲逐逐，无咎。`,changing:!1},{line:`六五`,text:`拂经，居贞吉，不可涉大川。`,changing:!1},{line:`上九`,text:`由颐，厉吉，利涉大川。`,changing:!1}],nayin:{upper:[`丙寅`,`丙子`,`丙戌`],lower:[`庚子`,`庚寅`,`庚辰`]},shiPosition:6,yingPosition:3},{id:28,name:`泽风大过`,shortName:`大过`,upper:`dui`,lower:`xun`,judgment:`栋桡，利有攸往，亨。`,lines:[{line:`初六`,text:`藉用白茅，无咎。`,changing:!1},{line:`九二`,text:`枯杨生稊，老夫得其女妻，无不利。`,changing:!1},{line:`九三`,text:`栋桡，凶。`,changing:!1},{line:`九四`,text:`栋隆，吉。有它吝。`,changing:!1},{line:`九五`,text:`枯杨生华，老妇得其士夫，无咎无誉。`,changing:!1},{line:`上六`,text:`过涉灭顶，凶，无咎。`,changing:!1}],nayin:{upper:[`丁未`,`丁酉`,`丁亥`],lower:[`辛丑`,`辛亥`,`辛酉`]},shiPosition:6,yingPosition:3},{id:29,name:`坎为水`,shortName:`坎`,upper:`kan`,lower:`kan`,judgment:`习坎，有孚维心，亨，行有尚。`,lines:[{line:`初六`,text:`习坎，入于坎窞，凶。`,changing:!1},{line:`九二`,text:`坎有险，求小得。`,changing:!1},{line:`六三`,text:`来之坎坎，险且枕，入于坎窞，勿用。`,changing:!1},{line:`六四`,text:`樽酒簋贰，用缶，纳约自牖，终无咎。`,changing:!1},{line:`九五`,text:`坎不盈，祇既平，无咎。`,changing:!1},{line:`上六`,text:`系用徽纆，寘于丛棘，三岁不得，凶。`,changing:!1}],nayin:{upper:[`戊子`,`戊戌`,`戊申`],lower:[`戊寅`,`戊辰`,`戊午`]},shiPosition:5,yingPosition:2},{id:30,name:`离为火`,shortName:`离`,upper:`li`,lower:`li`,judgment:`利贞，亨。畜牝牛，吉。`,lines:[{line:`初九`,text:`履错然，敬之无咎。`,changing:!1},{line:`六二`,text:`黄离，元吉。`,changing:!1},{line:`九三`,text:`日昃之离，不鼓缶而歌，则大耋之嗟，凶。`,changing:!1},{line:`九四`,text:`突如其来如，焚如，死如，弃如。`,changing:!1},{line:`六五`,text:`出涕沱若，戚嗟若，吉。`,changing:!1},{line:`上九`,text:`王用出征，有嘉折首，获匪其丑，无咎。`,changing:!1}],nayin:{upper:[`己巳`,`己未`,`己酉`],lower:[`己卯`,`己丑`,`己亥`]},shiPosition:2,yingPosition:5},{id:31,name:`泽山咸`,shortName:`咸`,upper:`dui`,lower:`gen`,judgment:`亨，利贞，取女吉。`,lines:[{line:`初六`,text:`咸其拇。`,changing:!1},{line:`六二`,text:`咸其腓，凶，居吉。`,changing:!1},{line:`九三`,text:`咸其股，执其随，往吝。`,changing:!1},{line:`九四`,text:`贞吉悔亡，憧憧往来，朋从尔思。`,changing:!1},{line:`九五`,text:`咸其脢，无悔。`,changing:!1},{line:`上六`,text:`咸其辅颊舌。`,changing:!1}],nayin:{upper:[`丁未`,`丁酉`,`丁亥`],lower:[`丙辰`,`丙午`,`丙申`]},shiPosition:3,yingPosition:6},{id:32,name:`雷风恒`,shortName:`恒`,upper:`zhen`,lower:`xun`,judgment:`亨，无咎，利贞，利有攸往。`,lines:[{line:`初六`,text:`浚恒，贞凶，无攸利。`,changing:!1},{line:`九二`,text:`悔亡。`,changing:!1},{line:`九三`,text:`不恒其德，或承之羞，贞吝。`,changing:!1},{line:`九四`,text:`田无禽。`,changing:!1},{line:`六五`,text:`恒其德，贞，妇人吉，夫子凶。`,changing:!1},{line:`上六`,text:`振恒，凶。`,changing:!1}],nayin:{upper:[`庚戌`,`庚申`,`庚午`],lower:[`辛丑`,`辛亥`,`辛酉`]},shiPosition:4,yingPosition:1},{id:33,name:`天山遯`,shortName:`遯`,upper:`qian`,lower:`gen`,judgment:`亨，小利贞。`,lines:[{line:`初六`,text:`遯尾，厉，勿用有攸往。`,changing:!1},{line:`六二`,text:`执之用黄牛之革，莫之胜说。`,changing:!1},{line:`九三`,text:`系遯，有疾厉，畜臣妾吉。`,changing:!1},{line:`九四`,text:`好遯，君子吉，小人否。`,changing:!1},{line:`九五`,text:`嘉遯，贞吉。`,changing:!1},{line:`上九`,text:`肥遯，无不利。`,changing:!1}],nayin:{upper:[`壬戌`,`壬申`,`壬午`],lower:[`丙辰`,`丙午`,`丙申`]},shiPosition:3,yingPosition:6},{id:34,name:`雷天大壮`,shortName:`大壮`,upper:`zhen`,lower:`qian`,judgment:`利贞。`,lines:[{line:`初九`,text:`壮于趾，征凶，有孚。`,changing:!1},{line:`九二`,text:`贞吉。`,changing:!1},{line:`九三`,text:`小人用壮，君子用罔，贞厉。羝羊触藩，羸其角。`,changing:!1},{line:`九四`,text:`贞吉悔亡，藩决不羸，壮于大舆之輹。`,changing:!1},{line:`六五`,text:`丧羊于易，无悔。`,changing:!1},{line:`上六`,text:`羝羊触藩，不能退，不能遂，无攸利，艰则吉。`,changing:!1}],nayin:{upper:[`庚戌`,`庚申`,`庚午`],lower:[`甲子`,`甲寅`,`甲辰`]},shiPosition:4,yingPosition:1},{id:35,name:`火地晋`,shortName:`晋`,upper:`li`,lower:`kun`,judgment:`康侯用锡马蕃庶，昼日三接。`,lines:[{line:`初六`,text:`晋如，摧如，贞吉。罔孚，裕无咎。`,changing:!1},{line:`六二`,text:`晋如，愁如，贞吉。受兹介福，于其王母。`,changing:!1},{line:`六三`,text:`众允，悔亡。`,changing:!1},{line:`九四`,text:`晋如鼫鼠，贞厉。`,changing:!1},{line:`六五`,text:`悔亡，失得勿恤，往吉无不利。`,changing:!1},{line:`上九`,text:`晋其角，维用伐邑，厉吉无咎，贞吝。`,changing:!1}],nayin:{upper:[`己巳`,`己未`,`己酉`],lower:[`乙未`,`乙巳`,`乙卯`]},shiPosition:4,yingPosition:1},{id:36,name:`地火明夷`,shortName:`明夷`,upper:`kun`,lower:`li`,judgment:`利艰贞。`,lines:[{line:`初九`,text:`明夷于飞，垂其翼。君子于行，三日不食，有攸往，主人有言。`,changing:!1},{line:`六二`,text:`明夷，夷于左股，用拯马壮，吉。`,changing:!1},{line:`九三`,text:`明夷于南狩，得其大首，不可疾贞。`,changing:!1},{line:`六四`,text:`入于左腹，获明夷之心，于出门庭。`,changing:!1},{line:`六五`,text:`箕子之明夷，利贞。`,changing:!1},{line:`上六`,text:`不明晦，初登于天，后入于地。`,changing:!1}],nayin:{upper:[`癸酉`,`癸亥`,`癸丑`],lower:[`己卯`,`己丑`,`己亥`]},shiPosition:2,yingPosition:5},{id:37,name:`风火家人`,shortName:`家人`,upper:`xun`,lower:`li`,judgment:`利女贞。`,lines:[{line:`初九`,text:`闲有家，悔亡。`,changing:!1},{line:`六二`,text:`无攸遂，在中馈，贞吉。`,changing:!1},{line:`九三`,text:`家人嗃嗃，悔厉吉。妇子嘻嘻，终吝。`,changing:!1},{line:`六四`,text:`富家，大吉。`,changing:!1},{line:`九五`,text:`王假有家，勿恤吉。`,changing:!1},{line:`上九`,text:`有孚威如，终吉。`,changing:!1}],nayin:{upper:[`辛卯`,`辛巳`,`辛未`],lower:[`己卯`,`己丑`,`己亥`]},shiPosition:2,yingPosition:5},{id:38,name:`火泽睽`,shortName:`睽`,upper:`li`,lower:`dui`,judgment:`小事吉。`,lines:[{line:`初九`,text:`悔亡，丧马勿逐，自复。见恶人，无咎。`,changing:!1},{line:`九二`,text:`遇主于巷，无咎。`,changing:!1},{line:`六三`,text:`见舆曳，其牛掣，其人天且劓，无初有终。`,changing:!1},{line:`九四`,text:`睽孤，遇元夫，交孚，厉无咎。`,changing:!1},{line:`六五`,text:`悔亡，厥宗噬肤，往何咎。`,changing:!1},{line:`上九`,text:`睽孤，见豕负涂，载鬼一车，先张之弧，后说之弧，匪寇婚媾，往遇雨则吉。`,changing:!1}],nayin:{upper:[`己巳`,`己未`,`己酉`],lower:[`丁丑`,`丁卯`,`丁巳`]},shiPosition:2,yingPosition:5},{id:39,name:`水山蹇`,shortName:`蹇`,upper:`kan`,lower:`gen`,judgment:`利西南，不利东北。利见大人，贞吉。`,lines:[{line:`初六`,text:`往蹇，来誉。`,changing:!1},{line:`六二`,text:`王臣蹇蹇，匪躬之故。`,changing:!1},{line:`九三`,text:`往蹇来反。`,changing:!1},{line:`六四`,text:`往蹇来连。`,changing:!1},{line:`九五`,text:`大蹇朋来。`,changing:!1},{line:`上六`,text:`往蹇来硕，吉。利见大人。`,changing:!1}],nayin:{upper:[`戊子`,`戊戌`,`戊申`],lower:[`丙辰`,`丙午`,`丙申`]},shiPosition:5,yingPosition:2},{id:40,name:`雷水解`,shortName:`解`,upper:`zhen`,lower:`kan`,judgment:`利西南，无所往，其来复吉。有攸往，夙吉。`,lines:[{line:`初六`,text:`无咎。`,changing:!1},{line:`九二`,text:`田获三狐，得黄矢，贞吉。`,changing:!1},{line:`六三`,text:`负且乘，致寇至，贞吝。`,changing:!1},{line:`九四`,text:`解而拇，朋至斯孚。`,changing:!1},{line:`六五`,text:`君子维有解，吉。有孚于小人。`,changing:!1},{line:`上六`,text:`公用射隼于高墉之上，获之，无不利。`,changing:!1}],nayin:{upper:[`庚戌`,`庚申`,`庚午`],lower:[`戊寅`,`戊辰`,`戊午`]},shiPosition:2,yingPosition:5},{id:41,name:`山泽损`,shortName:`损`,upper:`gen`,lower:`dui`,judgment:`有孚，元吉，无咎，可贞，利有攸往。曷之用，二簋可用享。`,lines:[{line:`初九`,text:`已事遄往，无咎，酌损之。`,changing:!1},{line:`九二`,text:`利贞，征凶，弗损益之。`,changing:!1},{line:`六三`,text:`三人行，则损一人；一人行，则得其友。`,changing:!1},{line:`六四`,text:`损其疾，使遄有喜，无咎。`,changing:!1},{line:`六五`,text:`或益之十朋之龟，弗克违，元吉。`,changing:!1},{line:`上九`,text:`弗损益之，无咎，贞吉，利有攸往，得臣无家。`,changing:!1}],nayin:{upper:[`丙寅`,`丙子`,`丙戌`],lower:[`丁丑`,`丁卯`,`丁巳`]},shiPosition:5,yingPosition:2},{id:42,name:`风雷益`,shortName:`益`,upper:`xun`,lower:`zhen`,judgment:`利有攸往，利涉大川。`,lines:[{line:`初九`,text:`利用为大作，元吉，无咎。`,changing:!1},{line:`六二`,text:`或益之十朋之龟，弗克违，永贞吉。王用享于帝，吉。`,changing:!1},{line:`六三`,text:`益之用凶事，无咎。有孚中行，告公用圭。`,changing:!1},{line:`六四`,text:`中行告公从，利用为依迁国。`,changing:!1},{line:`九五`,text:`有孚惠心，勿问元吉。有孚惠我德。`,changing:!1},{line:`上九`,text:`莫益之，或击之，立心勿恒，凶。`,changing:!1}],nayin:{upper:[`辛卯`,`辛巳`,`辛未`],lower:[`庚子`,`庚寅`,`庚辰`]},shiPosition:3,yingPosition:6},{id:43,name:`泽天夬`,shortName:`夬`,upper:`dui`,lower:`qian`,judgment:`扬于王庭，孚号有厉，告自邑，不利即戎，利有攸往。`,lines:[{line:`初九`,text:`壮于前趾，往不胜为咎。`,changing:!1},{line:`九二`,text:`惕号，莫夜有戎，勿恤。`,changing:!1},{line:`九三`,text:`壮于頄，有凶。君子夬夬独行，遇雨若濡，有愠，无咎。`,changing:!1},{line:`九四`,text:`臀无肤，其行次且。牵羊悔亡，闻言不信。`,changing:!1},{line:`九五`,text:`苋陆夬夬，中行无咎。`,changing:!1},{line:`上六`,text:`无号，终有凶。`,changing:!1}],nayin:{upper:[`丁未`,`丁酉`,`丁亥`],lower:[`甲子`,`甲寅`,`甲辰`]},shiPosition:1,yingPosition:4},{id:44,name:`天风姤`,shortName:`姤`,upper:`qian`,lower:`xun`,judgment:`女壮，勿用取女。`,lines:[{line:`初六`,text:`系于金柅，贞吉，有攸往，见凶，羸豕孚蹢躅。`,changing:!1},{line:`九二`,text:`包有鱼，无咎，不利宾。`,changing:!1},{line:`九三`,text:`臀无肤，其行次且，厉，无大咎。`,changing:!1},{line:`九四`,text:`包无鱼，起凶。`,changing:!1},{line:`九五`,text:`以杞包瓜，含章，有陨自天。`,changing:!1},{line:`上九`,text:`姤其角，吝，无咎。`,changing:!1}],nayin:{upper:[`壬戌`,`壬申`,`壬午`],lower:[`辛丑`,`辛亥`,`辛酉`]},shiPosition:1,yingPosition:4},{id:45,name:`泽地萃`,shortName:`萃`,upper:`dui`,lower:`kun`,judgment:`亨。王假有庙，利见大人，亨，利贞。用大牲吉，利有攸往。`,lines:[{line:`初六`,text:`有孚不终，乃乱乃萃，若号一握为笑，勿恤，往无咎。`,changing:!1},{line:`六二`,text:`引吉，无咎，孚乃利用禴。`,changing:!1},{line:`六三`,text:`萃如，嗟如，无攸利，往无咎，小吝。`,changing:!1},{line:`九四`,text:`大吉，无咎。`,changing:!1},{line:`九五`,text:`萃有位，无咎。匪孚，元永贞，悔亡。`,changing:!1},{line:`上六`,text:`赍咨涕洟，无咎。`,changing:!1}],nayin:{upper:[`丁未`,`丁酉`,`丁亥`],lower:[`乙未`,`乙巳`,`乙卯`]},shiPosition:4,yingPosition:1},{id:46,name:`地风升`,shortName:`升`,upper:`kun`,lower:`xun`,judgment:`元亨，用见大人，勿恤，南征吉。`,lines:[{line:`初六`,text:`允升，大吉。`,changing:!1},{line:`九二`,text:`孚乃利用禴，无咎。`,changing:!1},{line:`九三`,text:`升虚邑。`,changing:!1},{line:`六四`,text:`王用亨于岐山，吉无咎。`,changing:!1},{line:`六五`,text:`贞吉，升阶。`,changing:!1},{line:`上六`,text:`冥升，利于不息之贞。`,changing:!1}],nayin:{upper:[`癸酉`,`癸亥`,`癸丑`],lower:[`辛丑`,`辛亥`,`辛酉`]},shiPosition:5,yingPosition:2},{id:47,name:`泽水困`,shortName:`困`,upper:`dui`,lower:`kan`,judgment:`亨，贞，大人吉，无咎，有言不信。`,lines:[{line:`初六`,text:`臀困于株木，入于幽谷，三岁不觌。`,changing:!1},{line:`九二`,text:`困于酒食，朱绂方来，利用享祀，征凶，无咎。`,changing:!1},{line:`六三`,text:`困于石，据于蒺藜，入于其宫，不见其妻，凶。`,changing:!1},{line:`九四`,text:`来徐徐，困于金车，吝，有终。`,changing:!1},{line:`九五`,text:`劓刖，困于赤绂，乃徐有说，利用祭祀。`,changing:!1},{line:`上六`,text:`困于葛藟，于臲卼，曰动悔。有悔，征吉。`,changing:!1}],nayin:{upper:[`丁未`,`丁酉`,`丁亥`],lower:[`戊寅`,`戊辰`,`戊午`]},shiPosition:5,yingPosition:2},{id:48,name:`水风井`,shortName:`井`,upper:`kan`,lower:`xun`,judgment:`改邑不改井，无丧无得，往来井井。汔至亦未繘井，羸其瓶，凶。`,lines:[{line:`初六`,text:`井泥不食，旧井无禽。`,changing:!1},{line:`九二`,text:`井谷射鲋，瓮敝漏。`,changing:!1},{line:`九三`,text:`井渫不食，为我心恻，可用汲，王明，并受其福。`,changing:!1},{line:`六四`,text:`井甃，无咎。`,changing:!1},{line:`九五`,text:`井冽，寒泉食。`,changing:!1},{line:`上六`,text:`井收勿幕，有孚元吉。`,changing:!1}],nayin:{upper:[`戊子`,`戊戌`,`戊申`],lower:[`辛丑`,`辛亥`,`辛酉`]},shiPosition:1,yingPosition:4},{id:49,name:`泽火革`,shortName:`革`,upper:`dui`,lower:`li`,judgment:`己日乃孚，元亨利贞，悔亡。`,lines:[{line:`初九`,text:`巩用黄牛之革。`,changing:!1},{line:`六二`,text:`己日乃革之，征吉，无咎。`,changing:!1},{line:`九三`,text:`征凶，贞厉，革言三就，有孚。`,changing:!1},{line:`九四`,text:`悔亡，有孚改命，吉。`,changing:!1},{line:`九五`,text:`大人虎变，未占有孚。`,changing:!1},{line:`上六`,text:`君子豹变，小人革面，征凶，居贞吉。`,changing:!1}],nayin:{upper:[`丁未`,`丁酉`,`丁亥`],lower:[`己卯`,`己丑`,`己亥`]},shiPosition:4,yingPosition:1},{id:50,name:`火风鼎`,shortName:`鼎`,upper:`li`,lower:`xun`,judgment:`元吉，亨。`,lines:[{line:`初六`,text:`鼎颠趾，利出否，得妾以其子，无咎。`,changing:!1},{line:`九二`,text:`鼎有实，我仇有疾，不我能即，吉。`,changing:!1},{line:`九三`,text:`鼎耳革，其行塞，雉膏不食，方雨亏悔，终吉。`,changing:!1},{line:`九四`,text:`鼎折足，覆公餗，其形渥，凶。`,changing:!1},{line:`六五`,text:`鼎黄耳金铉，利贞。`,changing:!1},{line:`上九`,text:`鼎玉铉，大吉，无不利。`,changing:!1}],nayin:{upper:[`己巳`,`己未`,`己酉`],lower:[`辛丑`,`辛亥`,`辛酉`]},shiPosition:5,yingPosition:2},{id:51,name:`震为雷`,shortName:`震`,upper:`zhen`,lower:`zhen`,judgment:`亨。震来虩虩，笑言哑哑。震惊百里，不丧匕鬯。`,lines:[{line:`初九`,text:`震来虩虩，后笑言哑哑，吉。`,changing:!1},{line:`六二`,text:`震来厉，亿丧贝，跻于九陵，勿逐，七日得。`,changing:!1},{line:`六三`,text:`震苏苏，震行无眚。`,changing:!1},{line:`九四`,text:`震遂泥。`,changing:!1},{line:`六五`,text:`震往来厉，亿无丧，有事。`,changing:!1},{line:`上六`,text:`震索索，视矍矍，征凶。震不于其躬，于其邻，无咎。婚媾有言。`,changing:!1}],nayin:{upper:[`庚戌`,`庚申`,`庚午`],lower:[`庚子`,`庚寅`,`庚辰`]},shiPosition:3,yingPosition:6},{id:52,name:`艮为山`,shortName:`艮`,upper:`gen`,lower:`gen`,judgment:`艮其背，不获其身，行其庭，不见其人，无咎。`,lines:[{line:`初六`,text:`艮其趾，无咎，利永贞。`,changing:!1},{line:`六二`,text:`艮其腓，不拯其随，其心不快。`,changing:!1},{line:`九三`,text:`艮其限，列其夤，厉薰心。`,changing:!1},{line:`六四`,text:`艮其身，无咎。`,changing:!1},{line:`六五`,text:`艮其辅，言有序，悔亡。`,changing:!1},{line:`上九`,text:`敦艮，吉。`,changing:!1}],nayin:{upper:[`丙寅`,`丙子`,`丙戌`],lower:[`丙辰`,`丙午`,`丙申`]},shiPosition:3,yingPosition:6},{id:53,name:`风山渐`,shortName:`渐`,upper:`xun`,lower:`gen`,judgment:`女归吉，利贞。`,lines:[{line:`初六`,text:`鸿渐于干，小子厉，有言，无咎。`,changing:!1},{line:`六二`,text:`鸿渐于磐，饮食衎衎，吉。`,changing:!1},{line:`九三`,text:`鸿渐于陆，夫征不复，妇孕不育，凶，利御寇。`,changing:!1},{line:`六四`,text:`鸿渐于木，或得其桷，无咎。`,changing:!1},{line:`九五`,text:`鸿渐于陵，妇三岁不孕，终莫之胜，吉。`,changing:!1},{line:`上九`,text:`鸿渐于陆，其羽可用为仪，吉。`,changing:!1}],nayin:{upper:[`辛卯`,`辛巳`,`辛未`],lower:[`丙辰`,`丙午`,`丙申`]},shiPosition:6,yingPosition:3},{id:54,name:`雷泽归妹`,shortName:`归妹`,upper:`zhen`,lower:`dui`,judgment:`征凶，无攸利。`,lines:[{line:`初九`,text:`归妹以娣，跛能履，征吉。`,changing:!1},{line:`九二`,text:`眇能视，利幽人之贞。`,changing:!1},{line:`六三`,text:`归妹以须，反归以娣。`,changing:!1},{line:`九四`,text:`归妹愆期，迟归有时。`,changing:!1},{line:`六五`,text:`帝乙归妹，其君之袂，不如其娣之袂良，月几望，吉。`,changing:!1},{line:`上六`,text:`女承筐无实，士刲羊无血，无攸利。`,changing:!1}],nayin:{upper:[`庚戌`,`庚申`,`庚午`],lower:[`丁丑`,`丁卯`,`丁巳`]},shiPosition:2,yingPosition:5},{id:55,name:`雷火丰`,shortName:`丰`,upper:`zhen`,lower:`li`,judgment:`亨，王假之，勿忧，宜日中。`,lines:[{line:`初九`,text:`遇其配主，虽旬无咎，往有尚。`,changing:!1},{line:`六二`,text:`丰其蔀，日中见斗，往得疑疾，有孚发若，吉。`,changing:!1},{line:`九三`,text:`丰其沛，日中见沫，折其右肱，无咎。`,changing:!1},{line:`九四`,text:`丰其蔀，日中见斗，遇其夷主，吉。`,changing:!1},{line:`六五`,text:`来章，有庆誉，吉。`,changing:!1},{line:`上六`,text:`丰其屋，蔀其家，窥其户，阒其无人，三岁不觌，凶。`,changing:!1}],nayin:{upper:[`庚戌`,`庚申`,`庚午`],lower:[`己卯`,`己丑`,`己亥`]},shiPosition:1,yingPosition:4},{id:56,name:`火山旅`,shortName:`旅`,upper:`li`,lower:`gen`,judgment:`小亨，旅贞吉。`,lines:[{line:`初六`,text:`旅琐琐，斯其所取灾。`,changing:!1},{line:`六二`,text:`旅即次，怀其资，得童仆贞。`,changing:!1},{line:`九三`,text:`旅焚其次，丧其童仆，贞厉。`,changing:!1},{line:`九四`,text:`旅于处，得其资斧，我心不快。`,changing:!1},{line:`六五`,text:`射雉，一矢亡，终以誉命。`,changing:!1},{line:`上九`,text:`鸟焚其巢，旅人先笑后号啕。丧牛于易，凶。`,changing:!1}],nayin:{upper:[`己巳`,`己未`,`己酉`],lower:[`丙辰`,`丙午`,`丙申`]},shiPosition:5,yingPosition:2},{id:57,name:`巽为风`,shortName:`巽`,upper:`xun`,lower:`xun`,judgment:`小亨，利有攸往，利见大人。`,lines:[{line:`初六`,text:`进退，利武人之贞。`,changing:!1},{line:`九二`,text:`巽在床下，用史巫纷若，吉无咎。`,changing:!1},{line:`九三`,text:`频巽，吝。`,changing:!1},{line:`六四`,text:`悔亡，田获三品。`,changing:!1},{line:`九五`,text:`贞吉悔亡，无不利。无初有终，先庚三日，后庚三日，吉。`,changing:!1},{line:`上九`,text:`巽在床下，丧其资斧，贞凶。`,changing:!1}],nayin:{upper:[`辛卯`,`辛巳`,`辛未`],lower:[`辛丑`,`辛亥`,`辛酉`]},shiPosition:4,yingPosition:1},{id:58,name:`兑为泽`,shortName:`兑`,upper:`dui`,lower:`dui`,judgment:`亨，利贞。`,lines:[{line:`初九`,text:`和兑，吉。`,changing:!1},{line:`九二`,text:`孚兑，吉，悔亡。`,changing:!1},{line:`六三`,text:`来兑，凶。`,changing:!1},{line:`九四`,text:`商兑未宁，介疾有喜。`,changing:!1},{line:`九五`,text:`孚于剥，有厉。`,changing:!1},{line:`上六`,text:`引兑。`,changing:!1}],nayin:{upper:[`丁未`,`丁酉`,`丁亥`],lower:[`丁丑`,`丁卯`,`丁巳`]},shiPosition:4,yingPosition:1},{id:59,name:`风水涣`,shortName:`涣`,upper:`xun`,lower:`kan`,judgment:`亨。王假有庙，利涉大川，利贞。`,lines:[{line:`初六`,text:`用拯马壮，吉。`,changing:!1},{line:`九二`,text:`涣奔其机，悔亡。`,changing:!1},{line:`六三`,text:`涣其躬，无悔。`,changing:!1},{line:`六四`,text:`涣其群，元吉。涣有丘，匪夷所思。`,changing:!1},{line:`九五`,text:`涣汗其大号，涣王居，无咎。`,changing:!1},{line:`上九`,text:`涣其血，去逖出，无咎。`,changing:!1}],nayin:{upper:[`辛卯`,`辛巳`,`辛未`],lower:[`戊寅`,`戊辰`,`戊午`]},shiPosition:5,yingPosition:2},{id:60,name:`水泽节`,shortName:`节`,upper:`kan`,lower:`dui`,judgment:`亨。苦节不可贞。`,lines:[{line:`初六`,text:`不出户庭，无咎。`,changing:!1},{line:`九二`,text:`不出门庭，凶。`,changing:!1},{line:`六三`,text:`不节若，则嗟若，无咎。`,changing:!1},{line:`六四`,text:`安节，亨。`,changing:!1},{line:`九五`,text:`甘节，吉，往有尚。`,changing:!1},{line:`上六`,text:`苦节，贞凶，悔亡。`,changing:!1}],nayin:{upper:[`戊子`,`戊戌`,`戊申`],lower:[`丁丑`,`丁卯`,`丁巳`]},shiPosition:1,yingPosition:4},{id:61,name:`风泽中孚`,shortName:`中孚`,upper:`xun`,lower:`dui`,judgment:`豚鱼吉，利涉大川，利贞。`,lines:[{line:`初九`,text:`虞吉，有它不燕。`,changing:!1},{line:`九二`,text:`鸣鹤在阴，其子和之，我有好爵，吾与尔靡之。`,changing:!1},{line:`六三`,text:`得敌，或鼓或罢，或泣或歌。`,changing:!1},{line:`六四`,text:`月几望，马匹亡，无咎。`,changing:!1},{line:`九五`,text:`有孚挛如，无咎。`,changing:!1},{line:`上九`,text:`翰音登于天，贞凶。`,changing:!1}],nayin:{upper:[`辛卯`,`辛巳`,`辛未`],lower:[`丁丑`,`丁卯`,`丁巳`]},shiPosition:4,yingPosition:1},{id:62,name:`雷山小过`,shortName:`小过`,upper:`zhen`,lower:`gen`,judgment:`亨，利贞，可小事，不可大事。飞鸟遗之音，不宜上宜下，大吉。`,lines:[{line:`初六`,text:`飞鸟以凶。`,changing:!1},{line:`六二`,text:`过其祖，遇其妣，不及其君，遇其臣，无咎。`,changing:!1},{line:`九三`,text:`弗过防之，从或戕之，凶。`,changing:!1},{line:`九四`,text:`无咎，弗过遇之。往厉必戒，勿用永贞。`,changing:!1},{line:`六五`,text:`密云不雨，自我西郊，公弋取彼在穴。`,changing:!1},{line:`上六`,text:`弗遇过之，飞鸟离之，凶，是谓灾眚。`,changing:!1}],nayin:{upper:[`庚戌`,`庚申`,`庚午`],lower:[`丙辰`,`丙午`,`丙申`]},shiPosition:3,yingPosition:6},{id:63,name:`水火既济`,shortName:`既济`,upper:`kan`,lower:`li`,judgment:`亨小，利贞，初吉终乱。`,lines:[{line:`初九`,text:`曳其轮，濡其尾，无咎。`,changing:!1},{line:`六二`,text:`妇丧其茀，勿逐，七日得。`,changing:!1},{line:`九三`,text:`高宗伐鬼方，三年克之，小人勿用。`,changing:!1},{line:`六四`,text:`繻有衣袽，终日戒。`,changing:!1},{line:`九五`,text:`东邻杀牛，不如西邻之禴祭，实受其福。`,changing:!1},{line:`上六`,text:`濡其首，厉。`,changing:!1}],nayin:{upper:[`戊子`,`戊戌`,`
