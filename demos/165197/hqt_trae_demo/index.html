<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pawfolio · 萌爪志</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <div class="logo">🐾 Pawfolio</div>
    <div class="nav-tabs">
      <a href="#home" class="nav-tab active" data-view="home">主页</a>
      <a href="#circle" class="nav-tab" data-view="circle">宠物圈</a>
      <a href="#health" class="nav-tab" data-view="health">健康管理</a>
    </div>
  </div>
</nav>

<main class="container">

  <section id="view-home" class="view active">
    <div class="card profile-card">
      <div class="avatar-wrapper">
        <div class="avatar" id="avatarDisplay">
          <span class="avatar-placeholder">🐶</span>
        </div>
        <input type="file" id="avatarInput" accept="image/*" hidden>
        <button class="avatar-edit-btn" id="avatarEditBtn" title="更换头像">📷</button>
      </div>

      <div class="profile-body" id="profileView">
        <div class="profile-row">
          <span class="label">昵称</span>
          <span class="value" id="viewName">-</span>
        </div>
        <div class="profile-row">
          <span class="label">年龄</span>
          <span class="value" id="viewAge">-</span>
        </div>
        <div class="profile-row">
          <span class="label">性别</span>
          <span class="value" id="viewGender">-</span>
        </div>
        <div class="profile-row">
          <span class="label">品种</span>
          <span class="value" id="viewBreed">-</span>
        </div>
        <div class="profile-row motto-row">
          <span class="label">个性签名</span>
          <span class="value motto" id="viewMotto">-</span>
        </div>
        <div class="profile-actions">
          <button class="btn btn-primary" id="editProfileBtn">✏️ 编辑</button>
        </div>
      </div>

      <div class="profile-body hidden" id="profileEdit">
        <div class="profile-row">
          <label class="label">昵称</label>
          <input type="text" class="input" id="inputName" maxlength="12" placeholder="请输入昵称">
        </div>
        <div class="profile-row age-row">
          <label class="label">年龄</label>
          <div class="age-input-group">
            <input type="number" class="input" id="inputAge" min="0" max="50" placeholder="0">
            <select class="select" id="inputAgeUnit">
              <option value="岁">岁</option>
              <option value="月">月</option>
            </select>
          </div>
        </div>
        <div class="profile-row">
          <label class="label">性别</label>
          <div class="gender-group" id="inputGender">
            <label class="gender-option"><input type="radio" name="gender" value="♂"> ♂ 公</label>
            <label class="gender-option"><input type="radio" name="gender" value="♀"> ♀ 母</label>
            <label class="gender-option"><input type="radio" name="gender" value="未知"> ❓ 未知</label>
          </div>
        </div>
        <div class="profile-row">
          <label class="label">品种</label>
          <input type="text" class="input" id="inputBreed" placeholder="如：柯基（非必填）">
        </div>
        <div class="profile-row motto-row">
          <label class="label">个性签名</label>
          <textarea class="textarea" id="inputMotto" maxlength="30" rows="2" placeholder="最多30字"></textarea>
        </div>
        <div class="profile-actions">
          <button class="btn btn-secondary" id="cancelEditBtn">取消</button>
          <button class="btn btn-primary" id="saveProfileBtn">💾 保存</button>
        </div>
      </div>

      <div class="last-updated" id="lastUpdated"></div>
    </div>
  </section>

  <section id="view-circle" class="view">
    <div class="card publish-card">
      <textarea class="textarea" id="momentText" placeholder="今天毛孩子做了什么？" rows="3"></textarea>
      <div class="publish-actions">
        <div class="publish-images-preview" id="momentImagesPreview"></div>
        <div class="publish-buttons">
          <label class="btn btn-secondary">
            🖼️ 添加图片
            <input type="file" id="momentImageInput" accept="image/*" multiple hidden>
          </label>
          <button class="btn btn-primary" id="publishMomentBtn">📝 发布</button>
        </div>
      </div>
    </div>

    <div id="momentsList" class="moments-list"></div>
  </section>

  <section id="view-health" class="view">
    <div class="card filter-card">
      <div class="filter-info">
        <span>总记录数：<strong id="healthCount">0</strong></span>
      </div>
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">全部</button>
        <button class="filter-tab" data-filter="clinic">就医 🏥</button>
        <button class="filter-tab" data-filter="treatment">治疗 💊</button>
        <button class="filter-tab" data-filter="checkup">体检 🩺</button>
        <button class="filter-tab" data-filter="other">其他 📌</button>
      </div>
    </div>

    <div id="healthList" class="health-list"></div>

    <button class="fab" id="addHealthBtn" title="添加记录">+</button>
  </section>

</main>

<div class="modal hidden" id="healthModal">
  <div class="modal-mask"></div>
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="healthModalTitle">添加健康记录</h3>
      <button class="modal-close" id="healthModalClose">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="label">日期</label>
        <input type="date" class="input" id="healthDate">
      </div>
      <div class="form-group">
        <label class="label">事件类型</label>
        <select class="select" id="healthType">
          <option value="clinic">就医 🏥</option>
          <option value="treatment">治疗 💊</option>
          <option value="checkup">体检 🩺</option>
          <option value="other">其他 📌</option>
        </select>
      </div>
      <div class="form-group">
        <label class="label">标题</label>
        <input type="text" class="input" id="healthTitle" placeholder="如：第三次疫苗">
      </div>
      <div class="form-group">
        <label class="label">详细描述</label>
        <textarea class="textarea" id="healthDescription" rows="3" placeholder="记录详细信息"></textarea>
      </div>
      <div class="form-group">
        <label class="label">附件图片（最多2张）</label>
        <div class="health-images-preview" id="healthImagesPreview"></div>
        <label class="btn btn-secondary btn-sm">
          📷 上传图片
          <input type="file" id="healthImageInput" accept="image/*" multiple hidden>
        </label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="healthModalCancel">取消</button>
      <button class="btn btn-primary" id="healthModalSave">💾 保存</button>
    </div>
  </div>
</div>

<div class="image-lightbox hidden" id="imageLightbox">
  <div class="lightbox-mask"></div>
  <div class="lightbox-content">
    <button class="lightbox-close" id="lightboxClose">×</button>
    <img id="lightboxImage" src="" alt="预览图">
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/app.js"></script>
</body>
</html>
