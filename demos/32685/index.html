<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>缝隙背卡 - 碎片时间学习工具</title>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    :root {
      --bg: #f6f7f2;
      --panel: #ffffff;
      --panel-strong: #102321;
      --text: #18201f;
      --muted: #66716e;
      --line: #d9dfd8;
      --green: #1f8a70;
      --green-dark: #11604e;
      --blue: #2d6cdf;
      --yellow: #e7a92d;
      --coral: #d96b5f;
      --shadow: 0 18px 42px rgba(20, 39, 36, 0.12);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--text);
      background:
        linear-gradient(180deg, rgba(31, 138, 112, 0.12), transparent 340px),
        var(--bg);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      padding: 24px 18px;
      background: var(--panel-strong);
      color: #eef8f4;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 0;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: var(--radius);
      background: #f1d06a;
      color: #102321;
    }

    .side-section {
      margin-top: 26px;
    }

    .side-title {
      margin: 0 0 12px;
      color: rgba(238, 248, 244, 0.62);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .metric-list {
      display: grid;
      gap: 10px;
    }

    .metric {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
      padding: 10px 12px;
      border: 1px solid rgba(238, 248, 244, 0.12);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.06);
    }

    .metric span {
      color: rgba(238, 248, 244, 0.72);
      font-size: 13px;
    }

    .metric strong {
      font-size: 22px;
      line-height: 1;
    }

    .category-list {
      display: grid;
      gap: 8px;
    }

    .category-chip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid rgba(238, 248, 244, 0.12);
      border-radius: var(--radius);
      color: rgba(238, 248, 244, 0.84);
      background: transparent;
      text-align: left;
    }

    .category-chip.active {
      color: #102321;
      background: #f1d06a;
      border-color: #f1d06a;
      font-weight: 700;
    }

    .main {
      padding: 24px clamp(16px, 4vw, 44px);
      min-width: 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .title-block h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 42px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .title-block p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .icon-btn,
    .text-btn {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--text);
      box-shadow: none;
    }

    .icon-btn {
      width: 42px;
      display: grid;
      place-items: center;
    }

    .text-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      font-weight: 700;
    }

    .text-btn.primary {
      background: var(--green);
      color: white;
      border-color: var(--green);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(320px, 1.18fr) minmax(280px, 0.82fr);
      gap: 18px;
      align-items: start;
    }

    .study-panel,
    .editor-panel,
    .list-panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .study-panel {
      padding: clamp(18px, 3vw, 28px);
    }

    .queue-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .progress-track {
      flex: 1;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #e8ece5;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--green), var(--yellow));
      transition: width 0.25s ease;
    }

    .flashcard {
      min-height: 380px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 18px;
      padding: clamp(18px, 4vw, 34px);
      border: 1px solid #dce4df;
      border-radius: var(--radius);
      background:
        radial-gradient(circle at 100% 0%, rgba(231, 169, 45, 0.18), transparent 280px),
        linear-gradient(180deg, #ffffff, #fbfcf8);
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(45, 108, 223, 0.1);
      color: var(--blue);
      font-weight: 700;
    }

    .question {
      align-self: center;
      margin: 0;
      font-size: clamp(27px, 4.2vw, 46px);
      line-height: 1.18;
      letter-spacing: 0;
    }

    .answer-box {
      display: none;
      padding: 16px;
      border-left: 4px solid var(--green);
      background: rgba(31, 138, 112, 0.08);
      color: #1d3934;
    }

    .answer-box.visible {
      display: block;
    }

    .action-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .grade-btn {
      min-height: 52px;
      border: 0;
      border-radius: var(--radius);
      color: white;
      font-weight: 800;
    }

    .grade-btn.again {
      background: var(--coral);
    }

    .grade-btn.hard {
      background: var(--yellow);
      color: #31220b;
    }

    .grade-btn.good {
      background: var(--green);
    }

    .grade-btn.easy {
      background: var(--blue);
    }

    .empty-state {
      display: none;
      min-height: 380px;
      place-items: center;
      padding: 28px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      color: var(--muted);
      text-align: center;
    }

    .empty-state.visible {
      display: grid;
    }

    .stack {
      display: grid;
      gap: 18px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 16px 0;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 0;
    }

    .editor-panel form {
      display: grid;
      gap: 10px;
      padding: 16px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--text);
      outline: none;
    }

    input,
    select {
      height: 42px;
      padding: 0 12px;
    }

    textarea {
      min-height: 82px;
      resize: vertical;
      padding: 10px 12px;
    }

    .list-panel {
      overflow: hidden;
    }

    .card-list {
      display: grid;
      max-height: 338px;
      overflow: auto;
      padding: 10px 16px 16px;
      gap: 10px;
    }

    .mini-card {
      display: grid;
      gap: 6px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcf8;
    }

    .mini-card-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .mini-card strong {
      line-height: 1.35;
    }

    .mini-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .mini-actions button {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: white;
      color: var(--muted);
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 20;
      max-width: min(360px, calc(100vw - 36px));
      padding: 12px 14px;
      border-radius: var(--radius);
      background: #102321;
      color: #fff;
      box-shadow: var(--shadow);
      transform: translateY(18px);
      opacity: 0;
      transition: all 0.2s ease;
    }

    .toast.visible {
      transform: translateY(0);
      opacity: 1;
    }

    @media (max-width: 980px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .workspace {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .main {
        padding: 16px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .toolbar {
        width: 100%;
        justify-content: stretch;
      }

      .text-btn {
        flex: 1;
        justify-content: center;
      }

      .flashcard {
        min-height: 340px;
      }

      .action-row,
      .field-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><i data-lucide="layers-3"></i></div>
        <span>缝隙背卡</span>
      </div>

      <section class="side-section">
        <p class="side-title">今日概览</p>
        <div class="metric-list">
          <div class="metric"><span>待复习</span><strong id="dueCount">0</strong></div>
          <div class="metric"><span>已完成</span><strong id="doneCount">0</strong></div>
          <div class="metric"><span>连续天数</span><strong id="streakCount">0</strong></div>
        </div>
      </section>

      <section class="side-section">
        <p class="side-title">卡组</p>
        <div class="category-list" id="categoryList"></div>
      </section>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="title-block">
          <h1>碎片时间学习卡</h1>
          <p>用 5 分钟清空今日待复习，把零散时间攒成长期记忆。</p>
        </div>
        <div class="toolbar">
          <button class="text-btn" id="exportBtn" title="导出本地数据">
            <i data-lucide="download"></i><span>导出</span>
          </button>
          <button class="text-btn primary" id="startBtn" title="开始今日复习">
            <i data-lucide="play"></i><span>开始</span>
          </button>
        </div>
      </header>

      <section class="workspace">
        <div class="study-panel">
          <div class="queue-row">
            <span id="queueText">今日队列 0/0</span>
            <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
            <span id="minutesText">0 分钟</span>
          </div>

          <article class="flashcard" id="flashcard">
            <div class="card-meta">
              <span class="tag" id="cardCategory">英语</span>
              <span id="cardLevel">新卡</span>
            </div>
            <h2 class="question" id="cardQuestion">点击开始，进入今日复习。</h2>
            <div>
              <div class="answer-box" id="answerBox"></div>
              <button class="text-btn primary" id="showAnswerBtn">
                <i data-lucide="eye"></i><span>看答案</span>
              </button>
            </div>
          </article>

          <div class="empty-state" id="emptyState">
            <div>
              <strong>今天清空了</strong>
              <p>可以新增卡片，或者切换卡组继续学习。</p>
            </div>
          </div>

          <div class="action-row" id="gradeRow">
            <button class="grade-btn again" data-grade="1">忘了</button>
            <button class="grade-btn hard" data-grade="3">模糊</button>
            <button class="grade-btn good" data-grade="4">记得</button>
            <button class="grade-btn easy" data-grade="5">秒答</button>
          </div>
        </div>

        <div class="stack">
          <section class="editor-panel">
            <div class="panel-header">
              <h2>新增学习卡</h2>
              <button class="icon-btn" id="resetBtn" title="重置示例数据"><i data-lucide="rotate-ccw"></i></button>
            </div>
            <form id="cardForm">
              <div class="field-grid">
                <input id="questionInput" placeholder="问题，例如 abandon" required>
                <input id="categoryInput" placeholder="卡组，例如 四六级" required>
              </div>
              <textarea id="answerInput" placeholder="答案，例如 放弃；抛弃；中止" required></textarea>
              <button class="text-btn primary" type="submit">
                <i data-lucide="plus"></i><span>添加卡片</span>
              </button>
            </form>
          </section>

          <section class="list-panel">
            <div class="panel-header">
              <h2>卡片库</h2>
              <select id="filterSelect" title="筛选卡组"></select>
            </div>
            <div class="card-list" id="cardList"></div>
          </section>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = "gap_flashcards_v1";

    const seedCards = [
      { question: "abandon", answer: "放弃；抛弃；中止。例句：Never abandon your plan too early.", category: "四六级" },
      { question: "生产力中的两分钟原则是什么？", answer: "能在两分钟内完成的任务，立刻做完，减少待办堆积。", category: "效率方法" },
      { question: "HTTP 404 表示什么？", answer: "客户端请求的资源不存在，常见于路径错误或资源已删除。", category: "编程" },
      { question: "考研政治：实践和认识的关系？", answer: "实践决定认识，认识反作用于实践；实践是认识的来源、动力、目的和检验标准。", category: "考研" },
      { question: "interval repetition", answer: "间隔重复：根据遗忘曲线安排下一次复习时间。", category: "英语表达" },
      { question: "CSS grid-template-columns 用来做什么？", answer: "定义网格容器的列轨道大小和数量。", category: "编程" }
    ];

    let state = loadState();
    let activeCategory = "全部";
    let currentCard = null;
    let sessionTotal = 0;
    let sessionDone = 0;
    let sessionStart = Date.now();

    const els = {
      dueCount: document.querySelector("#dueCount"),
      doneCount: document.querySelector("#doneCount"),
      streakCount: document.querySelector("#streakCount"),
      categoryList: document.querySelector("#categoryList"),
      queueText: document.querySelector("#queueText"),
      minutesText: document.querySelector("#minutesText"),
      progressFill: document.querySelector("#progressFill"),
      flashcard: document.querySelector("#flashcard"),
      emptyState: document.querySelector("#emptyState"),
      cardCategory: document.querySelector("#cardCategory"),
      cardLevel: document.querySelector("#cardLevel"),
      cardQuestion: document.querySelector("#cardQuestion"),
      answerBox: document.querySelector("#answerBox"),
      showAnswerBtn: document.querySelector("#showAnswerBtn"),
      gradeRow: document.querySelector("#gradeRow"),
      cardForm: document.querySelector("#cardForm"),
      questionInput: document.querySelector("#questionInput"),
      answerInput: document.querySelector("#answerInput"),
      categoryInput: document.querySelector("#categoryInput"),
      cardList: document.querySelector("#cardList"),
      filterSelect: document.querySelector("#filterSelect"),
      toast: document.querySelector("#toast")
    };

    function todayKey() {
      return new Date().toISOString().slice(0, 10);
    }

    function toDateKey(timestamp) {
      return new Date(timestamp).toISOString().slice(0, 10);
    }

    function addDays(days) {
      const date = new Date();
      date.setDate(date.getDate() + days);
      date.setHours(0, 0, 0, 0);
      return date.getTime();
    }

    function normalizeCard(card, index) {
      return {
        id: card.id || crypto.randomUUID(),
        question: card.question,
        answer: card.answer,
        category: card.category || "默认",
        ease: card.ease || 2.5,
        interval: card.interval || 0,
        repetitions: card.repetitions || 0,
        reviewed: card.reviewed || 0,
        createdAt: card.createdAt || Date.now() + index,
        dueAt: card.dueAt || Date.now()
      };
    }

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          return {
            cards: parsed.cards.map(normalizeCard),
            daily: parsed.daily || {},
            streak: parsed.streak || 0,
            lastStudyDate: parsed.lastStudyDate || ""
          };
        } catch (error) {
          console.warn("本地数据读取失败，已使用示例数据。", error);
        }
      }

      return {
        cards: seedCards.map(normalizeCard),
        daily: {},
        streak: 0,
        lastStudyDate: ""
      };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function getCategories() {
      return ["全部", ...new Set(state.cards.map(card => card.category))];
    }

    function getDueCards() {
      const now = Date.now();
      return state.cards
        .filter(card => activeCategory === "全部" || card.category === activeCategory)
        .filter(card => card.dueAt <= now)
        .sort((a, b) => a.dueAt - b.dueAt || a.createdAt - b.createdAt);
    }

    function render() {
      const dueCards = getDueCards();
      const today = todayKey();
      const doneToday = state.daily[today] || 0;
      const totalForProgress = Math.max(sessionTotal, dueCards.length + sessionDone);
      const progress = totalForProgress ? Math.round((sessionDone / totalForProgress) * 100) : 0;

      els.dueCount.textContent = dueCards.length;
      els.doneCount.textContent = doneToday;
      els.streakCount.textContent = state.streak;
      els.queueText.textContent = `今日队列 ${sessionDone}/${totalForProgress}`;
      els.progressFill.style.width = `${progress}%`;
      els.minutesText.textContent = `${Math.max(1, Math.round((Date.now() - sessionStart) / 60000))} 分钟`;

      renderCategories();
      renderFilter();
      renderCardList();
      if (currentCard && currentCard.dueAt <= Date.now()) {
        showCurrentCard();
      } else {
        pickNextCard();
      }
    }

    function renderCategories() {
      els.categoryList.innerHTML = "";
      getCategories().forEach(category => {
        const count = category === "全部"
          ? state.cards.length
          : state.cards.filter(card => card.category === category).length;
        const button = document.createElement("button");
        button.className = `category-chip${category === activeCategory ? " active" : ""}`;
        button.innerHTML = `<span>${category}</span><strong>${count}</strong>`;
        button.addEventListener("click", () => {
          activeCategory = category;
          currentCard = null;
          sessionTotal = getDueCards().length;
          sessionDone = 0;
          render();
        });
        els.categoryList.appendChild(button);
      });
    }

    function renderFilter() {
      const selected = els.filterSelect.value || "全部";
      els.filterSelect.innerHTML = "";
      getCategories().forEach(category => {
        const option = document.createElement("option");
        option.value = category;
        option.textContent = category;
        els.filterSelect.appendChild(option);
      });
      els.filterSelect.value = getCategories().includes(selected) ? selected : "全部";
    }

    function renderCardList() {
      const filter = els.filterSelect.value || "全部";
      const cards = state.cards.filter(card => filter === "全部" || card.category === filter);
      els.cardList.innerHTML = "";

      cards.forEach(card => {
        const item = document.createElement("article");
        item.className = "mini-card";
        item.innerHTML = `
          <div class="mini-card-top">
            <span>${card.category}</span>
            <span>${card.repetitions ? `${card.interval} 天后` : "新卡"}</span>
          </div>
          <strong>${escapeHtml(card.question)}</strong>
          <span>${escapeHtml(card.answer)}</span>
          <div class="mini-actions">
            <button title="立即复习" data-action="review"><i data-lucide="play"></i></button>
            <button title="删除卡片" data-action="delete"><i data-lucide="trash-2"></i></button>
          </div>
        `;
        item.querySelector('[data-action="review"]').addEventListener("click", () => {
          card.dueAt = Date.now();
          currentCard = card;
          sessionTotal = Math.max(sessionTotal, getDueCards().length);
          saveState();
          render();
        });
        item.querySelector('[data-action="delete"]').addEventListener("click", () => {
          state.cards = state.cards.filter(saved => saved.id !== card.id);
          if (currentCard?.id === card.id) currentCard = null;
          saveState();
          showToast("已删除卡片");
          render();
        });
        els.cardList.appendChild(item);
      });

      if (window.lucide) lucide.createIcons();
    }

    function pickNextCard() {
      const dueCards = getDueCards();
      currentCard = dueCards[0] || null;
      if (!sessionTotal) sessionTotal = dueCards.length;
      showCurrentCard();
    }

    function showCurrentCard() {
      const hasCard = Boolean(currentCard);
      els.flashcard.style.display = hasCard ? "grid" : "none";
      els.gradeRow.style.display = hasCard ? "grid" : "none";
      els.emptyState.classList.toggle("visible", !hasCard);

      if (!hasCard) return;

      els.cardCategory.textContent = currentCard.category;
      els.cardLevel.textContent = currentCard.repetitions ? `第 ${currentCard.repetitions + 1} 轮` : "新卡";
      els.cardQuestion.textContent = currentCard.question;
      els.answerBox.textContent = currentCard.answer;
      els.answerBox.classList.remove("visible");
      els.showAnswerBtn.style.display = "inline-flex";
    }

    function reviewCard(grade) {
      if (!currentCard) return;

      // 这里使用 SM-2 的核心思想：答得越轻松，下一次复习间隔越长。
      if (grade < 3) {
        currentCard.repetitions = 0;
        currentCard.interval = 1;
      } else {
        currentCard.repetitions += 1;
        if (currentCard.repetitions === 1) currentCard.interval = 1;
        else if (currentCard.repetitions === 2) currentCard.interval = 3;
        else currentCard.interval = Math.round(currentCard.interval * currentCard.ease);
      }

      const easeDelta = 0.1 - (5 - grade) * (0.08 + (5 - grade) * 0.02);
      currentCard.ease = Math.max(1.3, currentCard.ease + easeDelta);
      currentCard.reviewed += 1;
      currentCard.dueAt = addDays(currentCard.interval);

      markDailyDone();
      sessionDone += 1;
      currentCard = null;
      saveState();
      render();
    }

    function markDailyDone() {
      const today = todayKey();
      state.daily[today] = (state.daily[today] || 0) + 1;

      // 连续天数只在跨天时更新，避免同一天重复点击导致虚高。
      if (state.lastStudyDate !== today) {
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        const yesterdayKey = yesterday.toISOString().slice(0, 10);
        state.streak = state.lastStudyDate === yesterdayKey ? state.streak + 1 : 1;
        state.lastStudyDate = today;
      }
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `缝隙背卡-${todayKey()}.json`;
      link.click();
      URL.revokeObjectURL(url);
      showToast("数据已导出");
    }

    function resetData() {
      state = {
        cards: seedCards.map(normalizeCard),
        daily: {},
        streak: 0,
        lastStudyDate: ""
      };
      activeCategory = "全部";
      currentCard = null;
      sessionTotal = 0;
      sessionDone = 0;
      saveState();
      showToast("已恢复示例卡组");
      render();
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("visible");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => els.toast.classList.remove("visible"), 1800);
    }

    els.showAnswerBtn.addEventListener("click", () => {
      els.answerBox.classList.add("visible");
      els.showAnswerBtn.style.display = "none";
    });

    els.gradeRow.addEventListener("click", event => {
      const button = event.target.closest("[data-grade]");
      if (!button) return;
      reviewCard(Number(button.dataset.grade));
    });

    els.cardForm.addEventListener("submit", event => {
      event.preventDefault();
      state.cards.unshift(normalizeCard({
        question: els.questionInput.value.trim(),
        answer: els.answerInput.value.trim(),
        category: els.categoryInput.value.trim(),
        dueAt: Date.now()
      }, 0));
      els.cardForm.reset();
      saveState();
      showToast("已添加到今日队列");
      render();
    });

    els.filterSelect.addEventListener("change", renderCardList);
    document.querySelector("#exportBtn").addEventListener("click", exportData);
    document.querySelector("#resetBtn").addEventListener("click", resetData);
    document.querySelector("#startBtn").addEventListener("click", () => {
      sessionStart = Date.now();
      sessionTotal = getDueCards().length;
      sessionDone = 0;
      pickNextCard();
      showToast("已进入今日复习");
      render();
    });

    setInterval(render, 60000);
    render();
    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
