<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>真香 - 差评里见真章</title>
<style>
:root {
  --pri: #FF6600;
  --pri-dark: #E55A00;
  --pri-light: #FFF1E8;
  --green: #00B578;
  --green-light: #E8F8F1;
  --red: #FF3141;
  --red-light: #FFF0F1;
  --yellow: #FF8F1F;
  --yellow-light: #FFF6ED;
  --orange: #FF8F1F;
  --text: #222;
  --text2: #666;
  --text3: #999;
  --bg: #F5F5F5;
  --card: #FFFFFF;
  --border: #F0F0F0;
  --shadow: 0 2px 12px rgba(0,0,0,.06);
  --radius: 12px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text);
  max-width: 420px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
  padding-bottom: 70px;
  -webkit-font-smoothing: antialiased;
}

/* ── Top Bar ── */
.topbar {
  position: sticky; top:0; z-index:100;
  background: linear-gradient(135deg, #FF6600 0%, #FF8F1F 100%);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.topbar-logo {
  font-size: 22px;
  font-weight: 800;
  color: #fff;
  letter-spacing: 1px;
}
.topbar-sub {
  font-size: 10px;
  color: rgba(255,255,255,.75);
  letter-spacing: 1px;
  margin-left: 2px;
}
.topbar-search {
  flex:1; height:36px;
  background: rgba(255,255,255,.2);
  border-radius: 18px;
  display: flex; align-items: center;
  padding: 0 14px;
  color: rgba(255,255,255,.8);
  font-size: 13px;
  backdrop-filter: blur(10px);
}

/* ── Golden Banner ── */
.banner {
  margin: 12px 14px;
  padding: 16px 18px;
  background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
  border-radius: var(--radius);
  color: #ddd;
  font-size: 13px;
  line-height: 1.8;
  position: relative;
  overflow: hidden;
}
.banner::after {
  content: '';
  position: absolute;
  right: -20px; top: -20px;
  width: 100px; height: 100px;
  background: rgba(255,102,0,.08);
  border-radius: 50%;
}
.banner .gold {
  color: var(--pri);
  font-weight: 600;
}
.banner-title {
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 6px;
}

/* ── Section Header ── */
.sec-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 14px 6px;
}
.sec-title {
  font-size: 17px;
  font-weight: 700;
}
.sec-title .icon {
  margin-right: 4px;
}
.sec-more {
  font-size: 12px;
  color: var(--text3);
}

/* ── Store Card ── */
.card {
  background: var(--card);
  margin: 0 14px 10px;
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform .15s;
}
.card:active { transform: scale(.985); }
.card-top {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 10px;
}
.card-avatar {
  width: 54px; height: 54px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
  font-weight: 700;
}
.card-info { flex: 1; min-width: 0; }
.card-name {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 2px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.card-dz {
  font-size: 11px;
  color: var(--text3);
}
.card-dz b { color: #FF6600; font-weight: 600; }
.card-scores {
  display: flex;
  gap: 16px;
  align-items: center;
  margin-top: 4px;
}
.card-score-item { text-align: center; }
.card-score-label { font-size: 10px; color: var(--text3); margin-bottom: 1px; }
.card-score-val {
  font-size: 26px;
  font-weight: 900;
  line-height: 1;
}
.card-score-val.green { color: var(--green); }
.card-score-val.red { color: var(--red); }
.card-score-val.orange { color: var(--orange); }
.card-score-val.yellow { color: #F5A623; }
.card-arrow {
  color: #FF6600;
  font-size: 20px;
  font-weight: 800;
  opacity: .6;
}
.card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.tag {
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 4px;
  font-weight: 600;
  letter-spacing: .5px;
}
.tag-green { background: var(--green-light); color: var(--green); }
.tag-red { background: var(--red-light); color: var(--red); }
.tag-yellow { background: var(--yellow-light); color: var(--yellow); }
.tag-pri { background: var(--pri-light); color: var(--pri); }
.card-quote {
  font-size: 11px;
  color: var(--text2);
  line-height: 1.5;
  background: #F9F9F9;
  padding: 8px 10px;
  border-radius: 6px;
  border-left: 3px solid #FF6600;
}
.card-quote .qt { color: #FF6600; font-weight: 600; margin-right: 2px; }

/* ── Detail Page ── */
.detail-page { display: none; padding-bottom: 70px; }
.detail-page.show { display: block; }

.detail-hero {
  margin: 12px 14px;
  background: var(--card);
  border-radius: var(--radius);
  padding: 24px 20px;
  box-shadow: var(--shadow);
  text-align: center;
}
.detail-store-name {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 4px;
}
.detail-dz-row {
  font-size: 12px;
  color: var(--text3);
  margin-bottom: 16px;
}
.detail-dz-row b { color: #FF6600; }
.detail-big-score {
  font-size: 64px;
  font-weight: 900;
  line-height: 1;
  margin-bottom: 4px;
}
.detail-level {
  display: inline-block;
  padding: 5px 18px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 14px;
}
.detail-level.green { background: var(--green-light); color: var(--green); }
.detail-level.red { background: var(--red-light); color: var(--red); }
.detail-level.orange { background: var(--yellow-light); color: var(--orange); }
.detail-compare {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
}
.detail-comp-item { text-align: center; }
.detail-comp-label { font-size: 11px; color: var(--text3); }
.detail-comp-num { font-size: 22px; font-weight: 800; margin-top: 2px; }
.detail-comp-num.dz { color: #FF6600; }
.detail-comp-vs { color: #ddd; font-size: 13px; }

.detail-section {
  margin: 0 14px 10px;
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.detail-sec-title {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.pro-con-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pro-box, .con-box {
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 12px;
  line-height: 1.6;
}
.pro-box { background: var(--green-light); }
.con-box { background: var(--red-light); }
.pro-box .label { color: var(--green); font-weight: 700; font-size: 11px; margin-bottom: 4px; }
.con-box .label { color: var(--red); font-weight: 700; font-size: 11px; margin-bottom: 4px; }

.quote-item {
  padding: 10px 12px;
  border-radius: 8px;
  margin-bottom: 6px;
  font-size: 12px;
  line-height: 1.7;
}
.quote-item.good { background: var(--green-light); border-left: 3px solid var(--green); }
.quote-item.bad { background: var(--red-light); border-left: 3px solid var(--red); }
.quote-item .q-author { font-size: 10px; color: var(--text3); margin-top: 4px; }

.trust-bar { margin-bottom: 10px; }
.trust-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
.trust-track { height: 6px; background: #EEE; border-radius: 3px; overflow: hidden; }
.trust-fill { height: 100%; border-radius: 3px; transition: width .5s ease; }
.trust-fill.good { background: var(--green); }
.trust-fill.bad { background: var(--red); }
.trust-fill.mid { background: var(--yellow); }

/* ── Ranking Page ── */
.rank-page { display: none; padding-bottom: 70px; }
.rank-page.show { display: block; }
.rank-item {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 14px 8px;
  padding: 14px;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  cursor: pointer;
}
.rank-item:active { transform: scale(.985); }
.rank-num {
  width: 24px;
  text-align: center;
  font-size: 18px;
  font-weight: 900;
  color: #CCC;
  flex-shrink: 0;
}
.rank-num.gold { color: #FFB800; }
.rank-num.silver { color: #A0A8B8; }
.rank-num.bronze { color: #C8986E; }
.rank-avatar {
  width: 40px; height: 40px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
  font-weight: 700;
}
.rank-info { flex:1; min-width:0; }
.rank-name { font-size: 14px; font-weight: 600; }
.rank-sub { font-size: 10px; color: var(--text3); }
.rank-zx { font-size: 22px; font-weight: 900; flex-shrink: 0; }

/* ── Bottom Nav ── */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 100%; max-width: 420px;
  background: var(--card);
  display: flex;
  border-top: 1px solid #EEE;
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.nav-item {
  flex:1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 0 4px;
  cursor: pointer;
  color: #999;
  transition: color .2s;
}
.nav-item.active { color: #FF6600; }
.nav-icon { font-size: 20px; margin-bottom: 2px; }
.nav-label { font-size: 10px; font-weight: 500; }

/* ── Back Button ── */
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 8px 14px;
  margin: 4px 14px;
  font-size: 13px;
  color: var(--text2);
  cursor: pointer;
}
.back-btn:hover { color: #FF6600; }

/* ── Mine Page ── */
.mine-header {
  background: linear-gradient(135deg, #FF6600 0%, #FF8F1F 100%);
  padding: 30px 20px 20px;
  text-align: center;
  color: #fff;
}
.mine-avatar {
  width: 64px; height: 64px;
  background: rgba(255,255,255,.2);
  border-radius: 50%;
  font-size: 30px;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 10px;
}
.mine-name { font-size: 18px; font-weight: 700; }
.mine-id { font-size: 12px; opacity: .7; margin-top: 2px; }
.mine-login-btn {
  display: inline-block;
  margin-top: 12px;
  padding: 8px 28px;
  background: rgba(255,255,255,.25);
  color: #fff;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,.3);
}
.mine-stats {
  display: flex;
  background: var(--card);
  margin: -10px 14px 0;
  border-radius: var(--radius);
  padding: 16px 0;
  box-shadow: var(--shadow);
  position: relative;
  z-index: 1;
}
.mine-stat-item {
  flex:1; text-align:center;
  border-right: 1px solid var(--border);
}
.mine-stat-item:last-child { border-right: none; }
.mine-stat-num { font-size: 20px; font-weight: 800; }
.mine-stat-label { font-size: 11px; color: var(--text3); margin-top: 2px; }
.mine-menu {
  margin: 14px 14px 0;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.mine-menu-item {
  display: flex; align-items: center;
  padding: 15px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
}
.mine-menu-item:last-child { border-bottom: none; }
.mine-menu-item:active { background: #FAFAFA; }
.mine-menu-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  margin-right: 12px;
  flex-shrink: 0;
}
.mine-menu-arrow { color: #CCC; margin-left: auto; font-size: 14px; }
.mine-menu-badge {
  margin-left: auto;
  margin-right: 6px;
  font-size: 11px;
  background: var(--red);
  color: #fff;
  border-radius: 10px;
  padding: 1px 7px;
}
.mine-section-title {
  padding: 12px 14px 6px;
  font-size: 12px;
  color: var(--text3);
  font-weight: 500;
}
.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text3);
  font-size: 13px;
}
.empty-icon { font-size: 48px; margin-bottom: 10px; }

/* page switching */
.page { display: none; }
.page.show { display: block; }

/* ── Anim ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.fade-up { animation: fadeUp .3s ease-out; }

@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
.pulse { animation: pulse .6s ease-in-out; }
</style>
</head>

// ── HELPER: score color ──
function zxClass(v) {
  if (v>=80) return 'green';
  if (v>=60) return 'yellow';
  if (v>=40) return 'orange';
  return 'red';
}

// ── BUILD HOME ──
function buildHome() {
  let h = '';
  stores.forEach(s => {
    const zc = zxClass(s.zx);
    const pal = palettes[(s.id-1) % palettes.length];
    h += `
    <div class="card fade-up" onclick="showDetail(${s.id})">
      <div class="card-top">
        <div class="card-avatar" style="background:${pal[0]}; color:${pal[1]};">${s.emoji}</div>
        <div class="card-info">
          <div class="card-name">${s.name}</div>
          <div class="card-dz">大众差评 <b>${String(s.dz||'?')}</b> 分</div>
        </div>
        <div class="card-scores">
          <div class="card-score-item">
            <div class="card-score-val ${zc}">${s.zx}</div>
            <div class="card-score-label">真香指数</div>
          </div>
          <div class="card-arrow">→</div>
        </div>
      </div>
      <div class="card-tags">
        ${s.tags.map(t => `<span class="tag tag-${s.grade==='green'?'green':s.grade==='red'?'red':s.grade==='orange'?'yellow':'pri'}">${t}</span>`).join('')}
      </div>
      <div class="card-quote"><span class="qt">"</span>${s.story.substring(0,55)}...<span class="qt">"</span></div>
    </div>`;
  });
  document.getElementById('home-list').innerHTML = h;
}

// ── BUILD RANKING ──
function buildRank() {
  let sorted = [...stores].sort((a,b) => b.zx - a.zx);
  let h = '';
  sorted.forEach((s,i) => {
    const zc = zxClass(s.zx);
    const pal = palettes[(s.id-1) % palettes.length];
    const rk = i<3 ? (i===0?'gold':i===1?'silver':'bronze') : '';
    h += `
    <div class="rank-item fade-up" onclick="showDetail(${s.id})">
      <div class="rank-num ${rk}">${i+1}</div>
      <div class="rank-avatar" style="background:${pal[0]}; color:${pal[1]};">${s.emoji}</div>
      <div class="rank-info">
        <div class="rank-name">${s.name}</div>
        <div class="rank-sub">大众差评 ${s.dz} · ${s.level}</div>
      </div>
      <div class="rank-zx" style="color:${s.grade==='green'?'var(--green)':s.grade==='red'?'var(--red)':'var(--orange)'}">${s.zx}</div>
    </div>`;
  });
  document.getElementById('rank-list').innerHTML = h;
}

// ── SWITCH PAGE ──
function switchTo(pageName) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('show'));
  document.getElementById(pageName).classList.add('show');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const nav = document.querySelector(`.nav-item[data-page="${pageName}"]`);
  if (nav) nav.classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}

// ── SHOW DETAIL ──
function showDetail(id) {
  const s = stores.find(x => x.id === id);
  if (!s) return;
  const zc = zxClass(s.zx);
  let h = `
  <div class="back-btn" onclick="switchTo('home')">← 返回差评雷达</div>
  <div class="detail-hero fade-up">
    <div class="detail-store-name">${s.name}</div>
    <div class="detail-dz-row">大众差评 <b>${s.dz||'?'}</b> 分</div>
    <div class="detail-big-score pulse" style="color:${s.grade==='green'?'var(--green)':s.grade==='red'?'var(--red)':'var(--orange)'}">${s.zx}</div>
    <div class="detail-level ${s.grade}">${s.level}</div>
    <div class="detail-compare">
      <div class="detail-comp-item">
        <div class="detail-comp-label">大众差评</div>
        <div class="detail-comp-num dz">${s.dz}</div>
      </div>
      <div class="detail-comp-vs">VS</div>
      <div class="detail-comp-item">
        <div class="detail-comp-label">真香指数</div>
        <div class="detail-comp-num" style="color:${s.grade==='green'?'var(--green)':s.grade==='red'?'var(--red)':'var(--orange)'}">${s.zx}</div>
      </div>
    </div>
  </div>

  <div class="detail-section fade-up">
    <div class="detail-sec-title">📖 ${s.name}</div>
    <p style="font-size:13px;color:var(--text2);line-height:1.8;">${s.story}</p>
  </div>

  <div class="detail-section fade-up">
    <div class="detail-sec-title">🏷️ 标签</div>
    <div class="card-tags">
      ${s.tags.map(t => `<span class="tag tag-${s.grade==='green'?'green':s.grade==='red'?'red':s.grade==='orange'?'yellow':'pri'}">${t}</span>`).join('')}
    </div>
  </div>

  <div class="detail-section fade-up">
    <div class="detail-sec-title">📊 核心评价</div>
    <div class="pro-con-grid">
      <div class="pro-box">
        <div class="label">✅ 核心优点</div>
        ${s.pros.map(p => `<div>· ${p}</div>`).join('')}
      </div>
      <div class="con-box">
        <div class="label">⚠️ 核心缺点</div>
        ${s.cons.map(c => `<div>· ${c}</div>`).join('')}
      </div>
    </div>
  </div>`;

  if (s.goodQuotes.length) {
    h += `<div class="detail-section fade-up">
      <div class="detail-sec-title">💚 反向好评</div>`;
    s.goodQuotes.forEach(q => {
      h += `<div class="quote-item good">"${q.t}"<div class="q-author">—— ${q.a}</div></div>`;
    });
    h += `</div>`;
  }

  if (s.badQuotes.length) {
    h += `<div class="detail-section fade-up">
      <div class="detail-sec-title">🚨 致命差评</div>`;
    s.badQuotes.forEach(q => {
      h += `<div class="quote-item bad">"${q.t}"<div class="q-author">—— ${q.a}</div></div>`;
    });
    h += `</div>`;
  }

  h += `<div class="detail-section fade-up">
    <div class="detail-sec-title">🔍 刷评检测</div>
    <div class="trust-bar">
      <div class="trust-label"><span>好评可信度</span><span style="color:${s.goodTrust>=70?'var(--green)':s.goodTrust>=50?'var(--yellow)':'var(--red)'};font-weight:700;">${s.goodTrust}%</span></div>
      <div class="trust-track"><div class="trust-fill ${s.goodTrust>=70?'good':s.goodTrust>=50?'mid':'bad'}" style="width:${s.goodTrust}%"></div></div>
    </div>
    <div class="trust-bar">
      <div class="trust-label"><span>差评可信度</span><span style="color:${s.badTrust>=70?'var(--green)':'var(--yellow)'};font-weight:700;">${s.badTrust}%</span></div>
      <div class="trust-track"><div class="trust-fill ${s.badTrust>=70?'good':'mid'}" style="width:${s.badTrust}%"></div></div>
    </div>
  </div>`;

  document.getElementById('detail-content').innerHTML = h;
  switchTo('detail');
  window.scrollTo({top:0});
}
