    // Render skills
    function renderSkills(filteredSkills) {
      const grid = document.getElementById('skillsGrid');
      const noResults = document.getElementById('noResults');
      const visibleCount = document.getElementById('visibleCount');

      if (filteredSkills.length === 0) {
        grid.innerHTML = '';
        noResults.style.display = 'block';
        visibleCount.textContent = '0';
        return;
      }

      noResults.style.display = 'none';
      visibleCount.textContent = filteredSkills.length;

      grid.innerHTML = filteredSkills.map(skill => `
        <div class="skill-card" data-category="${skill.category}" data-scenes="${skill.scenes.join(',')}">
          <div class="skill-header">
            <div class="skill-icon ${skill.iconClass}">${skill.icon}</div>
            <div class="skill-info">
              <h3>${skill.name}</h3>
              <div class="skill-id">${skill.id}</div>
            </div>
          </div>
          <div class="skill-desc">${skill.desc}</div>
          <div class="skill-tags">
            ${skill.tags.map(tag => `<span class="skill-tag">${tag}</span>`).join('')}
          </div>
          <div class="skill-footer">
            <div class="skill-meta">
              <span>🔥 ${skill.popularity}</span>
              <span>📂 ${getCategoryName(skill.category)}</span>
            </div>
            <button class="skill-action">查看详情</button>
          </div>
        </div>
      `).join('');
    }

    function getCategoryName(cat) {
      const names = { media: '媒体', data: '数据', doc: '文档', browser: '浏览器', ai: 'AI', code: '开发', tool: '工具' };
      return names[cat] || cat;
    }

    // Filter logic
    function filterSkills() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const categoryChecks = Array.from(document.querySelectorAll('.filter-group input[value]:checked')).map(cb => cb.value);
      const sceneChecks = Array.from(document.querySelectorAll('.filter-group input[value]:checked')).map(cb => cb.value);

      const filtered = skills.filter(skill => {
        const matchSearch = !search || 
          skill.name.toLowerCase().includes(search) || 
          skill.desc.toLowerCase().includes(search) ||
          skill.tags.some(t => t.toLowerCase().includes(search));
        const matchCategory = categoryChecks.includes(skill.category);
        const matchScene = skill.scenes.some(s => sceneChecks.includes(s));
        return matchSearch && matchCategory && matchScene;
      });

      renderSkills(filtered);
    }

    function clearFilters() {
      document.getElementById('searchInput').value = '';
      document.querySelectorAll('.filter-group input[type="checkbox"]').forEach(cb => cb.checked = true);
      filterSkills();
    }

    // Event listeners
    document.getElementById('searchInput').addEventListener('input', filterSkills);
    document.querySelectorAll('.filter-group input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', filterSkills);
    });
    document.getElementById('sortSelect').addEventListener('change', function() {
      const sort = this.value;
      let filtered = skills.slice();
      if (sort === 'name') {
        filtered.sort((a, b) => a.name.localeCompare(b.name, 'zh'));
      } else if (sort === 'category') {
        filtered.sort((a, b) => a.category.localeCompare(b.category));
      }
      // Re-apply current filters
      filterSkills();
    });

    // Initial render
    renderSkills(skills);
  </script>
