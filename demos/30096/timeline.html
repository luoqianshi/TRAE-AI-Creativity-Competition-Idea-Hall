<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时空抉择 - 历史时间轴</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/pixel-style.css">
  <style>
    body {
      background: var(--pixel-black);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 主容器 */
    .main-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
    }

    /* 顶部标题 */
    .hero-section {
      text-align: center;
      padding: 60px 20px;
      position: relative;
    }

    .game-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 28px;
      color: var(--pixel-gold);
      text-shadow: 
        4px 4px 0 var(--pixel-red),
        -2px -2px 0 var(--pixel-blue);
      margin-bottom: 16px;
      animation: title-glow 2s infinite;
    }

    @keyframes title-glow {
      0%, 100% { text-shadow: 4px 4px 0 var(--pixel-red), -2px -2px 0 var(--pixel-blue), 0 0 20px var(--pixel-gold); }
      50% { text-shadow: 4px 4px 0 var(--pixel-red), -2px -2px 0 var(--pixel-blue), 0 0 40px var(--pixel-gold); }
    }

    .game-subtitle {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: var(--pixel-white);
      opacity: 0.8;
    }

    /* 状态栏 */
    .status-bar {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 20px;
      background: var(--pixel-dark);
      border: 4px solid var(--pixel-black);
      margin-bottom: 30px;
    }

    .status-item {
      text-align: center;
    }

    .status-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      color: var(--pixel-gray);
      margin-bottom: 8px;
    }

    .status-value {
      font-family: 'Press Start 2P', monospace;
      font-size: 16px;
      color: var(--pixel-cyan);
    }

    /* 时间轴容器 */
    .timeline-container {
      background: var(--pixel-dark);
      border: 4px solid var(--pixel-black);
      padding: 30px;
      margin-bottom: 30px;
      position: relative;
      overflow: hidden;
    }

    .timeline-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: var(--pixel-gold);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .timeline-title::before {
      content: '▶';
      color: var(--pixel-red);
    }

    /* 朝代网格 */
    .dynasty-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
    }

    .dynasty-card {
      background: var(--pixel-blue);
      border: 4px solid var(--pixel-black);
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    .dynasty-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--pixel-gray);
      transition: background 0.2s;
    }

    .dynasty-card:hover {
      transform: translateY(-4px);
      border-color: var(--pixel-gold);
      background: var(--pixel-blue);
    }

    .dynasty-card:hover::before {
      background: var(--pixel-gold);
    }

    .dynasty-card.has-events::before {
      background: var(--pixel-green);
    }

    .dynasty-card.active {
      border-color: var(--pixel-gold);
      box-shadow: 0 0 20px rgba(230, 184, 0, 0.5);
    }

    .dynasty-card.active::before {
      background: var(--pixel-gold);
      animation: pulse-bar 1s infinite;
    }

    @keyframes pulse-bar {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .dynasty-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .dynasty-name {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: var(--pixel-white);
      margin-bottom: 4px;
    }

    .dynasty-year {
      font-size: 8px;
      color: var(--pixel-gray);
    }

    /* 事件列表 */
    .events-section {
      background: var(--pixel-dark);
      border: 4px solid var(--pixel-black);
      padding: 30px;
      display: none;
    }

    .events-section.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    .events-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .events-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: var(--pixel-gold);
    }

    .events-grid {
      display: grid;
      gap: 16px;
    }

    .event-card {
      background: var(--pixel-blue);
      border: 4px solid var(--pixel-black);
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .event-card:hover {
      border-color: var(--pixel-cyan);
      transform: translateX(8px);
      box-shadow: -4px 4px 0 var(--pixel-cyan);
    }

    .event-card.start-here {
      border-color: var(--pixel-green);
      background: linear-gradient(135deg, var(--pixel-blue) 0%, #1a4a1a 100%);
    }

    .event-card.start-here::before {
      content: '▶ 起始事件';
      position: absolute;
      top: -12px;
      left: 20px;
      background: var(--pixel-green);
      color: var(--pixel-black);
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      padding: 4px 8px;
    }

    .event-thumb {
      width: 80px;
      height: 80px;
      background: var(--pixel-black);
      border: 4px solid var(--pixel-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      flex-shrink: 0;
    }

    .event-info {
      flex: 1;
    }

    .event-name {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: var(--pixel-white);
      margin-bottom: 8px;
    }

    .event-meta {
      display: flex;
      gap: 16px;
      font-size: 10px;
      color: var(--pixel-gray);
      margin-bottom: 8px;
    }

    .event-difficulty {
      color: var(--pixel-gold);
    }

    .event-desc {
      font-size: 12px;
      color: var(--pixel-white);
      opacity: 0.8;
      line-height: 1.6;
    }

    .event-stages {
      font-size: 10px;
      color: var(--pixel-cyan);
      margin-top: 8px;
    }

    /* 底部装饰 */
    .footer-decoration {
      text-align: center;
      padding: 40px;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      color: var(--pixel-gray);
    }

    .footer-decoration span {
      color: var(--pixel-gold);
    }
  </style>
</head>
<body class="pixel-grid-bg">
  <div class="main-container">
    <!-- 标题区 -->
    <section class="hero-section">
      <h1 class="game-title">时空抉择</h1>
      <p class="game-subtitle">如果历史重来一次，你会怎么选择？</p>
    </section>

    <!-- 状态栏 -->
    <div class="status-bar pixel-window">
      <div class="status-item">
        <div class="status-label">朝代</div>
        <div class="status-value" id="currentDynasty">--</div>
      </div>
      <div class="status-item">
        <div class="status-label">事件</div>
        <div class="status-value" id="currentEvent">--</div>
      </div>
      <div class="status-item">
        <div class="status-label">历史还原度</div>
        <div class="status-value" id="accuracyValue">100%</div>
      </div>
      <div class="status-item">
        <div class="status-label">历史偏离度</div>
        <div class="status-value" id="deviationValue">0%</div>
      </div>
    </div>

    <!-- 时间轴 -->
    <section class="timeline-container">
      <h2 class="timeline-title">选择你想要探索的朝代</h2>
      <div class="dynasty-grid" id="dynastyGrid">
        <!-- 动态生成 -->
      </div>
    </section>

    <!-- 事件列表 -->
    <section class="events-section" id="eventsSection">
      <div class="events-header">
        <h2 class="events-title" id="eventsTitle">该朝代的历史事件</h2>
        <button class="pixel-btn" onclick="hideEvents()">返回</button>
      </div>
      <div class="events-grid" id="eventsGrid">
        <!-- 动态生成 -->
      </div>
    </section>

    <!-- 底部 -->
    <div class="footer-decoration">
      <span>★</span> 选择一个朝代开始你的时空之旅 <span>★</span>
    </div>
  </div>

  <script src="js/game-data.js"></script>
  <script>
    // 页面状态
    let selectedDynasty = null;

    // 初始化
    function init() {
      renderDynasties();
      // 默认选中三国
      selectDynasty('sanguo');
    }

    // 渲染朝代列表
    function renderDynasties() {
      const grid = document.getElementById('dynastyGrid');
      const dynastiesWithEvents = ['sanguo', 'qin', 'tang']; // 有事件的朝代

      grid.innerHTML = GameData.dynasties.map(d => `
        <div class="dynasty-card ${dynastiesWithEvents.includes(d.id) ? 'has-events' : ''}" 
             onclick="selectDynasty('${d.id}')">
          <div class="dynasty-icon">${d.icon}</div>
          <div class="dynasty-name">${d.name}</div>
          <div class="dynasty-year">${d.year}</div>
        </div>
      `).join('');
    }

    // 选择朝代
    function selectDynasty(dynastyId) {
      selectedDynasty = dynastyId;
      const dynasty = GameData.dynasties.find(d => d.id === dynastyId);

      // 更新状态栏
      document.getElementById('currentDynasty').textContent = dynasty.name + '朝';

      // 高亮选中朝代
      document.querySelectorAll('.dynasty-card').forEach(card => {
        card.classList.remove('active');
      });
      event.target.closest('.dynasty-card').classList.add('active');

      // 显示事件列表
      showEvents(dynastyId);
    }

    // 显示事件列表
    function showEvents(dynastyId) {
      const eventsSection = document.getElementById('eventsSection');
      const eventsTitle = document.getElementById('eventsTitle');
      const eventsGrid = document.getElementById('eventsGrid');
      const dynasty = GameData.dynasties.find(d => d.id === dynastyId);

      eventsTitle.textContent = dynasty.name + '朝的历史事件';

      // 获取该朝代的事件
      const events = Object.values(GameData.events).filter(e => e.dynasty === dynastyId);

      if (events.length === 0) {
        eventsGrid.innerHTML = `
          <div style="text-align: center; padding: 40px; color: var(--pixel-gray);">
            <p style="font-size: 48px; margin-bottom: 16px;">🔜</p>
            <p>该朝代的事件正在开发中...</p>
          </div>
        `;
      } else {
        eventsGrid.innerHTML = events.map(e => `
          <div class="event-card ${e.id === 'chibi' ? 'start-here' : ''}" 
               onclick="startEvent('${e.id}')"
               style="position: relative;">
            <div class="event-thumb">${e.difficulty.startsWith('★') ? '⚔️' : '📜'}</div>
            <div class="event-info">
              <div class="event-name">${e.name}</div>
              <div class="event-meta">
                <span class="event-difficulty">${e.difficulty}</span>
                <span>${e.year}</span>
                <span>${e.stages.length}个阶段</span>
              </div>
              <div class="event-desc">${e.description}</div>
              <div class="event-stages">🎮 点击开始时空之旅</div>
            </div>
          </div>
        `).join('');
      }

      eventsSection.classList.add('show');
      eventsSection.scrollIntoView({ behavior: 'smooth' });
    }

    // 隐藏事件列表
    function hideEvents() {
      document.getElementById('eventsSection').classList.remove('show');
      document.querySelectorAll('.dynasty-card').forEach(card => {
        card.classList.remove('active');
      });
      selectedDynasty = null;
    }

    // 开始事件
    function startEvent(eventId) {
      GameState.reset();
      GameState.currentEvent = eventId;
      const event = GameData.events[eventId];
      const dynasty = GameData.dynasties.find(d => d.id === event.dynasty);

      document.getElementById('currentEvent').textContent = event.name;
      document.getElementById('accuracyValue').textContent = '100%';
      document.getElementById('deviationValue').textContent = '0%';

      // 跳转到事件页面
      window.location.href = `event.html?id=${eventId}`;
    }

    // 更新统计显示
    function updateStats() {
      document.getElementById('accuracyValue').textContent = GameState.getHistoricalAccuracy() + '%';
      document.getElementById('deviationValue').textContent = GameState.getDeviationDegree() + '%';
    }

    // 初始化
    init();
  </script>
</body>
</html>
