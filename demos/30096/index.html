<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时空抉择 - 如果历史重来一次</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/pixel-style.css">
  <style>
    body {
      background: var(--pixel-black);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 主容器 */
    .main-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* 顶部标题 */
    .hero-section {
      text-align: center;
      padding: 40px 20px;
      position: relative;
    }

    .game-logo {
      font-size: 64px;
      margin-bottom: 20px;
      animation: logo-float 3s ease-in-out infinite;
    }

    @keyframes logo-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .game-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 32px;
      color: var(--pixel-gold);
      text-shadow: 
        4px 4px 0 var(--pixel-red),
        -2px -2px 0 var(--pixel-blue);
      margin-bottom: 16px;
      animation: title-glow 2s infinite;
    }

    @keyframes title-glow {
      0%, 100% { text-shadow: 4px 4px 0 var(--pixel-red), -2px -2px 0 var(--pixel-blue), 0 0 20px var(--pixel-gold); }
      50% { text-shadow: 4px 4px 0 var(--pixel-red), -2px -2px 0 var(--pixel-blue), 0 0 40px var(--pixel-gold); }
    }

    .game-subtitle {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: var(--pixel-white);
      opacity: 0.8;
      margin-bottom: 40px;
    }

    /* 快速开始区 */
    .quick-start {
      background: var(--pixel-dark);
      border: 4px solid var(--pixel-black);
      padding: 30px;
      margin-bottom: 30px;
      position: relative;
    }

    .quick-start::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--pixel-gold), var(--pixel-orange), var(--pixel-gold));
    }

    .section-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: var(--pixel-gold);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-title::before {
      content: '▶';
      color: var(--pixel-red);
    }

    /* 事件卡片 */
    .event-showcase {
      display: grid;
      gap: 20px;
    }

    .event-card {
      background: var(--pixel-blue);
      border: 4px solid var(--pixel-black);
      padding: 24px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      gap: 24px;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .event-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 8px;
      height: 100%;
      background: var(--pixel-gold);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s;
    }

    .event-card:hover::before {
      transform: scaleX(1);
    }

    .event-card:hover {
      border-color: var(--pixel-gold);
      transform: translateX(8px);
      box-shadow: -8px 8px 0 rgba(230, 184, 0, 0.3);
    }

    .event-card.featured {
      background: linear-gradient(135deg, var(--pixel-blue) 0%, #1a3a5c 100%);
      border-color: var(--pixel-gold);
    }

    .event-card.featured::before {
      background: var(--pixel-green);
      transform: scaleX(1);
    }

    .event-thumb {
      width: 100px;
      height: 100px;
      background: var(--pixel-black);
      border: 4px solid var(--pixel-gold);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      flex-shrink: 0;
      position: relative;
    }

    .event-thumb::after {
      content: '⚔️';
      font-size: 14px;
      margin-top: 4px;
    }

    .event-info {
      flex: 1;
    }

    .event-badge {
      display: inline-block;
      background: var(--pixel-red);
      color: white;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      padding: 4px 8px;
      margin-bottom: 8px;
    }

    .event-name {
      font-family: 'Press Start 2P', monospace;
      font-size: 16px;
      color: var(--pixel-white);
      margin-bottom: 8px;
    }

    .event-meta {
      display: flex;
      gap: 16px;
      font-size: 10px;
      color: var(--pixel-gray);
      margin-bottom: 12px;
    }

    .event-desc {
      font-size: 12px;
      color: var(--pixel-white);
      opacity: 0.8;
      line-height: 1.7;
    }

    .event-features {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .feature-tag {
      background: var(--pixel-black);
      padding: 4px 8px;
      font-size: 9px;
      color: var(--pixel-cyan);
      border: 2px solid var(--pixel-cyan);
    }

    .play-btn {
      background: var(--pixel-green);
      color: var(--pixel-black);
      border: none;
      padding: 12px 24px;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .play-btn:hover {
      background: var(--pixel-gold);
      transform: scale(1.05);
    }

    /* 状态栏 */
    .status-bar {
      background: var(--pixel-dark);
      border: 4px solid var(--pixel-black);
      padding: 20px;
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 30px;
    }

    .status-item {
      text-align: center;
    }

    .status-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      color: var(--pixel-gray);
      margin-bottom: 8px;
    }

    .status-value {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: var(--pixel-cyan);
    }

    /* 朝代选择 */
    .dynasty-select {
      background: var(--pixel-dark);
      border: 4px solid var(--pixel-black);
      padding: 30px;
    }

    .dynasty-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 12px;
    }

    .dynasty-chip {
      background: var(--pixel-blue);
      border: 4px solid var(--pixel-black);
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .dynasty-chip:hover {
      border-color: var(--pixel-gold);
      transform: translateY(-2px);
    }

    .dynasty-chip.active {
      border-color: var(--pixel-gold);
      background: var(--pixel-gold);
    }

    .dynasty-chip.active .dynasty-name,
    .dynasty-chip.active .dynasty-year {
      color: var(--pixel-black);
    }

    .dynasty-icon {
      font-size: 24px;
      margin-bottom: 4px;
    }

    .dynasty-name {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: var(--pixel-white);
    }

    .dynasty-year {
      font-size: 8px;
      color: var(--pixel-gray);
    }

    /* 底部 */
    .footer {
      text-align: center;
      padding: 40px 20px;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      color: var(--pixel-gray);
    }

    .footer span {
      color: var(--pixel-gold);
    }
  </style>
</head>
<body class="pixel-grid-bg">
  <div class="main-container">
    <!-- 标题区 -->
    <section class="hero-section">
      <div class="game-logo">⏳</div>
      <h1 class="game-title">时空抉择</h1>
      <p class="game-subtitle">如果历史重来一次，你会怎么选择？</p>
    </section>

    <!-- 状态栏 -->
    <div class="status-bar pixel-window">
      <div class="status-item">
        <div class="status-label">当前朝代</div>
        <div class="status-value" id="currentDynasty">三国</div>
      </div>
      <div class="status-item">
        <div class="status-label">历史还原度</div>
        <div class="status-value" id="accuracyValue">100%</div>
      </div>
      <div class="status-item">
        <div class="status-label">历史偏离度</div>
        <div class="status-value" id="deviationValue">0%</div>
      </div>
    </div>

    <!-- 快速开始 -->
    <section class="quick-start">
      <h2 class="section-title">🚀 快速开始</h2>
      <div class="event-showcase">
        <!-- 赤壁之战 - 主打 -->
        <div class="event-card featured" onclick="startEvent('chibi')">
          <div class="event-thumb"></div>
          <div class="event-info">
            <div class="event-badge">推荐入门</div>
            <div class="event-name">赤壁之战</div>
            <div class="event-meta">
              <span>📅 208年</span>
              <span>⚔️ 三国</span>
              <span>📍 5个阶段</span>
            </div>
            <div class="event-desc">
              东汉末年，曹操率二十万大军南下，刘备与孙权联手抗曹。这是一场以少胜多的经典战役，三国格局由此奠定。你的选择将决定历史的走向...
            </div>
            <div class="event-features">
              <span class="feature-tag">🔥 火攻计</span>
              <span class="feature-tag">🤝 联盟</span>
              <span class="feature-tag">⚔️ 决战</span>
              <span class="feature-tag">🏆 多结局</span>
            </div>
          </div>
          <button class="play-btn">
            开始 <span>▶</span>
          </button>
        </div>
      </div>
    </section>

    <!-- 朝代选择 -->
    <section class="dynasty-select">
      <h2 class="section-title">选择朝代探索</h2>
      <div class="dynasty-grid" id="dynastyGrid">
        <!-- 动态生成 -->
      </div>
    </section>

    <!-- 底部 -->
    <div class="footer">
      <span>★</span> 选择一个事件，开始你的时空之旅 <span>★</span>
    </div>
  </div>

  <script src="js/game-data.js"></script>
  <script>
    // 初始化
    function init() {
      renderDynasties();
    }

    // 渲染朝代
    function renderDynasties() {
      const grid = document.getElementById('dynastyGrid');
      grid.innerHTML = GameData.dynasties.map(d => `
        <div class="dynasty-chip ${d.id === 'sanguo' ? 'active' : ''}" 
             onclick="selectDynasty('${d.id}')">
          <div class="dynasty-icon">${d.icon}</div>
          <div class="dynasty-name">${d.name}</div>
          <div class="dynasty-year">${d.year}</div>
        </div>
      `).join('');
    }

    // 选择朝代
    function selectDynasty(dynastyId) {
      document.querySelectorAll('.dynasty-chip').forEach(chip => {
        chip.classList.remove('active');
      });
      event.target.closest('.dynasty-chip').classList.add('active');

      const dynasty = GameData.dynasties.find(d => d.id === dynastyId);
      document.getElementById('currentDynasty').textContent = dynasty.name + '朝';
    }

    // 开始事件
    function startEvent(eventId) {
      window.location.href = `event.html?id=${eventId}`;
    }

    // 初始化
    init();
  </script>
</body>
</html>
