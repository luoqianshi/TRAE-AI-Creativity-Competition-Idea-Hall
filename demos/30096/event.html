<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赤壁之战 - 时空抉择</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/pixel-style.css">
  <style>
    body {
      background: var(--pixel-black);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 顶部导航 */
    .top-nav {
      background: var(--pixel-dark);
      border-bottom: 4px solid var(--pixel-black);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-back {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--pixel-white);
      text-decoration: none;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      padding: 8px 16px;
      background: var(--pixel-blue);
      border: 2px solid var(--pixel-black);
      transition: all 0.2s;
    }

    .nav-back:hover {
      border-color: var(--pixel-gold);
      color: var(--pixel-gold);
    }

    .nav-center {
      text-align: center;
    }

    .nav-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: var(--pixel-gold);
      margin-bottom: 4px;
    }

    .nav-stage {
      font-size: 10px;
      color: var(--pixel-gray);
    }

    .nav-stats {
      display: flex;
      gap: 20px;
    }

    .nav-stat {
      text-align: center;
      background: var(--pixel-black);
      padding: 8px 12px;
      border: 2px solid;
    }

    .nav-stat.accuracy {
      border-color: var(--pixel-green);
    }

    .nav-stat.deviation {
      border-color: var(--pixel-orange);
    }

    .nav-stat-label {
      font-size: 7px;
      color: var(--pixel-gray);
      margin-bottom: 4px;
    }

    .nav-stat-value {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: var(--pixel-cyan);
    }

    /* 主容器 */
    .event-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    /* 剧情卡片 */
    .story-card {
      background: var(--pixel-dark);
      border: 4px solid var(--pixel-black);
      margin-bottom: 16px;
      overflow: hidden;
    }

    .story-card-header {
      background: var(--pixel-blue);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px solid var(--pixel-black);
    }

    .story-card-icon {
      font-size: 16px;
    }

    .story-card-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: var(--pixel-white);
    }

    .story-card-content {
      padding: 16px;
      font-size: 13px;
      line-height: 1.9;
      color: var(--pixel-white);
    }

    /* 对话气泡 */
    .dialogue-section {
      margin-bottom: 20px;
    }

    .dialogue-bubble {
      background: var(--pixel-blue);
      border: 4px solid var(--pixel-black);
      padding: 20px;
      position: relative;
      margin-bottom: 16px;
    }

    .dialogue-bubble::after {
      content: '';
      position: absolute;
      bottom: -16px;
      left: 30px;
      border: 8px solid transparent;
      border-top-color: var(--pixel-black);
    }

    .dialogue-speaker {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .speaker-avatar {
      width: 48px;
      height: 48px;
      background: var(--pixel-black);
      border: 3px solid var(--pixel-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .speaker-info {
      flex: 1;
    }

    .speaker-name {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      color: var(--pixel-gold);
      margin-bottom: 4px;
    }

    .speaker-title {
      font-size: 9px;
      color: var(--pixel-gray);
    }

    .dialogue-text {
      font-size: 13px;
      line-height: 1.8;
      color: var(--pixel-white);
      padding-left: 60px;
    }

    /* 响应气泡 */
    .response-bubble {
      background: linear-gradient(135deg, var(--pixel-green) 0%, #1a5a1a 100%);
      border: 4px solid var(--pixel-green);
      padding: 20px;
      margin-bottom: 20px;
      animation: response-appear 0.4s ease;
      display: none;
    }

    .response-bubble.show {
      display: block;
    }

    @keyframes response-appear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .response-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      color: var(--pixel-white);
    }

    .response-text {
      font-size: 13px;
      line-height: 1.8;
      color: var(--pixel-white);
    }

    /* 抉择区域 */
    .choice-section {
      background: var(--pixel-dark);
      border: 4px solid var(--pixel-red);
      padding: 20px;
      margin-bottom: 20px;
    }

    .choice-header {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      color: var(--pixel-red);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .choice-header::before {
      content: '⚔';
      font-size: 18px;
    }

    .choice-header::after {
      content: '你的选择将影响历史';
      color: var(--pixel-gray);
      font-size: 8px;
      margin-left: auto;
    }

    .choice-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .choice-btn {
      background: var(--pixel-blue);
      border: 4px solid var(--pixel-black);
      padding: 16px 20px;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .choice-btn:hover {
      border-color: var(--pixel-gold);
      background: var(--pixel-gold);
      transform: translateX(8px);
    }

    .choice-btn:hover .choice-label {
      color: var(--pixel-black);
    }

    .choice-btn:hover .choice-desc {
      color: rgba(0,0,0,0.7);
    }

    .choice-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
      border-color: var(--pixel-gray) !important;
      background: var(--pixel-gray) !important;
    }

    .choice-marker {
      width: 32px;
      height: 32px;
      background: var(--pixel-black);
      border: 3px solid var(--pixel-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: var(--pixel-gold);
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .choice-btn:hover .choice-marker {
      background: var(--pixel-black);
      color: var(--pixel-white);
    }

    .choice-content {
      flex: 1;
    }

    .choice-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      color: var(--pixel-white);
      margin-bottom: 6px;
      transition: color 0.15s;
    }

    .choice-desc {
      font-size: 11px;
      color: var(--pixel-gray);
      transition: color 0.15s;
    }

    /* 自动继续提示 */
    .auto-continue-hint {
      text-align: center;
      padding: 16px;
      font-size: 10px;
      color: var(--pixel-gray);
      animation: blink 1s infinite;
      display: none;
    }

    .auto-continue-hint.show {
      display: block;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .auto-continue-hint::after {
      content: ' ▶▶';
      color: var(--pixel-gold);
    }

    /* 人物栏 */
    .characters-bar {
      background: var(--pixel-black);
      border: 4px solid var(--pixel-black);
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      gap: 24px;
    }

    .character-mini {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .character-mini-avatar {
      width: 48px;
      height: 48px;
      background: var(--pixel-dark);
      border: 3px solid var(--pixel-gray);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      transition: all 0.2s;
    }

    .character-mini.active .character-mini-avatar {
      border-color: var(--pixel-gold);
      box-shadow: 0 0 10px var(--pixel-gold);
    }

    .character-mini-name {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      color: var(--pixel-gray);
    }

    .character-mini.active .character-mini-name {
      color: var(--pixel-gold);
    }

    /* 结局画面 */
    .ending-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.98);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      overflow-y: auto;
      padding: 20px;
    }

    .ending-overlay.show {
      display: flex;
    }

    .ending-card {
      background: var(--pixel-dark);
      border: 8px solid var(--pixel-gold);
      max-width: 550px;
      width: 100%;
      text-align: center;
      animation: ending-appear 0.6s ease;
    }

    @keyframes ending-appear {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .ending-header {
      background: var(--pixel-black);
      padding: 24px;
      border-bottom: 4px solid var(--pixel-gold);
    }

    .ending-icon {
      font-size: 72px;
      margin-bottom: 16px;
      animation: ending-icon-bounce 1s ease infinite;
    }

    @keyframes ending-icon-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .ending-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 18px;
      color: var(--pixel-gold);
      margin-bottom: 8px;
    }

    .ending-subtitle {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      color: var(--pixel-gray);
    }

    .ending-body {
      padding: 24px;
    }

    .ending-desc {
      font-size: 13px;
      line-height: 1.9;
      color: var(--pixel-white);
      text-align: left;
      margin-bottom: 24px;
    }

    .ending-stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .ending-stat-box {
      background: var(--pixel-black);
      padding: 16px;
      border: 3px solid var(--pixel-gray);
    }

    .ending-stat-value {
      font-family: 'Press Start 2P', monospace;
      font-size: 20px;
      color: var(--pixel-cyan);
      margin-bottom: 6px;
    }

    .ending-stat-label {
      font-size: 9px;
      color: var(--pixel-gray);
    }

    .ending-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* 粒子效果 */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: var(--pixel-gold);
      opacity: 0.5;
    }

    /* 进度点 */
    .progress-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .progress-dot {
      width: 12px;
      height: 12px;
      background: var(--pixel-gray);
      border: 2px solid var(--pixel-black);
      transition: all 0.3s;
    }

    .progress-dot.completed {
      background: var(--pixel-green);
    }

    .progress-dot.current {
      background: var(--pixel-cyan);
      box-shadow: 0 0 10px var(--pixel-cyan);
    }
  </style>
</head>
<body>
  <!-- 粒子背景 -->
  <div class="particles" id="particles"></div>

  <!-- 顶部导航 -->
  <nav class="top-nav">
    <a href="index.html" class="nav-back">◀ 返回</a>
    <div class="nav-center">
      <div class="nav-title" id="eventTitle">赤壁之战</div>
      <div class="nav-stage" id="navStage">第 1 步 / 共 5 步</div>
    </div>
    <div class="nav-stats">
      <div class="nav-stat accuracy">
        <div class="nav-stat-label">还原度</div>
        <div class="nav-stat-value" id="accuracyNav">100%</div>
      </div>
      <div class="nav-stat deviation">
        <div class="nav-stat-label">偏离度</div>
        <div class="nav-stat-value" id="deviationNav">0%</div>
      </div>
    </div>
  </nav>

  <!-- 主内容 -->
  <main class="event-container">
    <!-- 进度点 -->
    <div class="progress-dots" id="progressDots">
      <div class="progress-dot current"></div>
      <div class="progress-dot"></div>
      <div class="progress-dot"></div>
      <div class="progress-dot"></div>
      <div class="progress-dot"></div>
    </div>

    <!-- 人物栏 -->
    <div class="characters-bar" id="charactersBar">
      <!-- 动态生成 -->
    </div>

    <!-- 背景卡片 -->
    <div class="story-card">
      <div class="story-card-header">
        <span class="story-card-icon">📖</span>
        <span class="story-card-title">时代背景</span>
      </div>
      <div class="story-card-content" id="backgroundText">
        加载中...
      </div>
    </div>

    <!-- 当前局势 -->
    <div class="story-card">
      <div class="story-card-header">
        <span class="story-card-icon">⚔️</span>
        <span class="story-card-title">当前局势</span>
      </div>
      <div class="story-card-content" id="situationText">
        加载中...
      </div>
    </div>

    <!-- 对话气泡 -->
    <div class="dialogue-section">
      <div class="dialogue-bubble">
        <div class="dialogue-speaker">
          <div class="speaker-avatar" id="speakerAvatar">👤</div>
          <div class="speaker-info">
            <div class="speaker-name" id="speakerName">周瑜</div>
            <div class="speaker-title" id="speakerTitle">吴军都督</div>
          </div>
        </div>
        <div class="dialogue-text" id="dialogueText">
          加载中...
        </div>
      </div>
    </div>

    <!-- 响应气泡 -->
    <div class="response-bubble" id="responseBubble">
      <div class="response-header">
        <span>💬</span>
        <span>你的选择</span>
      </div>
      <div class="response-text" id="responseText"></div>
    </div>

    <!-- 抉择区域 -->
    <div class="choice-section" id="choiceSection">
      <div class="choice-header">关键抉择</div>
      <div class="choice-list" id="choiceList">
        <!-- 动态生成 -->
      </div>
    </div>

    <!-- 自动继续提示 -->
    <div class="auto-continue-hint" id="autoContinueHint">
      选择后将自动继续...
    </div>
  </main>

  <!-- 结局弹窗 -->
  <div class="ending-overlay" id="endingOverlay">
    <div class="ending-card">
      <div class="ending-header">
        <div class="ending-icon" id="endingIcon">🏆</div>
        <h2 class="ending-title" id="endingTitle">结局标题</h2>
        <p class="ending-subtitle" id="endingSubtitle">副标题</p>
      </div>
      <div class="ending-body">
        <p class="ending-desc" id="endingDesc">结局描述</p>
        <div class="ending-stats-grid">
          <div class="ending-stat-box">
            <div class="ending-stat-value" id="finalAccuracy">92%</div>
            <div class="ending-stat-label">历史还原度</div>
          </div>
          <div class="ending-stat-box">
            <div class="ending-stat-value" id="finalDeviation">8%</div>
            <div class="ending-stat-label">历史偏离度</div>
          </div>
          <div class="ending-stat-box">
            <div class="ending-stat-value" id="choicesCount">5</div>
            <div class="ending-stat-label">总抉择数</div>
          </div>
          <div class="ending-stat-box">
            <div class="ending-stat-value" id="bestChoice">-</div>
            <div class="ending-stat-label">关键选择</div>
          </div>
        </div>
        <div class="ending-buttons">
          <button class="pixel-btn" onclick="goHome()">返回主页</button>
          <button class="pixel-btn pixel-btn-primary" onclick="restartGame()">重新挑战</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/game-data.js"></script>
  <script>
    // 游戏状态
    let currentEvent = null;
    let currentStageIndex = 0;
    let totalSteps = 5;
    let isTransitioning = false;
    let currentChoices = [];
    let pendingChoice = null;
    let typewriterInterval = null;

    // 获取事件ID
    function getEventId() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id') || 'chibi';
    }

    // 初始化
    function init() {
      const eventId = getEventId();
      currentEvent = GameData.events[eventId];

      if (!currentEvent) {
        alert('事件不存在');
        window.location.href = 'index.html';
        return;
      }

      GameState.reset();
      GameState.currentEvent = eventId;
      currentStageIndex = 0;
      totalSteps = currentEvent.stages.length;

      createParticles();
      updateProgressDots();
      renderStage(0);
      updateStats();
    }

    // 创建粒子
    function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 20; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.top = Math.random() * 100 + '%';
        p.style.animationDuration = (Math.random() * 10 + 10) + 's';
        p.style.opacity = Math.random() * 0.5;
        container.appendChild(p);
      }
    }

    // 更新进度点
    function updateProgressDots() {
      const dots = document.getElementById('progressDots');
      dots.innerHTML = '';
      for (let i = 0; i < totalSteps; i++) {
        const dot = document.createElement('div');
        dot.className = 'progress-dot';
        if (i < currentStageIndex) dot.classList.add('completed');
        if (i === currentStageIndex) dot.classList.add('current');
        dots.appendChild(dot);
      }
    }

    // 打字机效果
    function typeWriter(element, text, speed = 30, callback) {
      if (typewriterInterval) clearInterval(typewriterInterval);
      element.textContent = '';
      let i = 0;
      typewriterInterval = setInterval(() => {
        if (i < text.length) {
          element.textContent += text.charAt(i);
          i++;
        } else {
          clearInterval(typewriterInterval);
          typewriterInterval = null;
          if (callback) callback();
        }
      }, speed);
    }

    // 停止打字机
    function stopTypewriter() {
      if (typewriterInterval) {
        clearInterval(typewriterInterval);
        typewriterInterval = null;
      }
    }

    // 渲染阶段
    function renderStage(index) {
      const stage = currentEvent.stages[index];
      if (!stage) {
        showEnding();
        return;
      }

      // 背景和局势（直接显示）
      document.getElementById('backgroundText').textContent = stage.background;
      document.getElementById('situationText').textContent = stage.situation;

      // 渲染选项（先渲染，打字完成后显示）
      renderChoices(stage.choices);

      // 对话（打字机效果）
      const speaker = getSpeakerInfo(stage.speaker);
      document.getElementById('speakerAvatar').textContent = speaker.avatar;
      document.getElementById('speakerName').textContent = stage.speaker;
      document.getElementById('speakerTitle').textContent = speaker.title;
      const dialogueText = '"' + stage.dialogue + '"';
      typeWriter(document.getElementById('dialogueText'), dialogueText, 25, () => {
        // 打字完成后显示选项
        document.getElementById('choiceSection').style.display = 'block';
      });

      // 隐藏选项直到打字完成
      document.getElementById('choiceSection').style.display = 'none';

      // 人物栏
      renderCharacters(stage.speaker);

      // 隐藏响应
      document.getElementById('responseBubble').classList.remove('show');
      document.getElementById('autoContinueHint').classList.remove('show');

      // 更新导航
      document.getElementById('navStage').textContent = `第 ${index + 1} 步 / 共 ${totalSteps} 步`;
      updateProgressDots();
    }

    // 获取人物信息
    function getSpeakerInfo(name) {
      const speakers = {
        '周瑜': { avatar: '⚔️', title: '吴军都督' },
        '黄盖': { avatar: '🛡️', title: '东吴老将' },
        '诸葛亮': { avatar: '📖', title: '蜀汉军师' },
        '鲁肃': { avatar: '📜', title: '东吴谋士' },
        '刘备': { avatar: '👑', title: '蜀汉之主' },
        '关羽': { avatar: '⚔️', title: '蜀汉名将' },
        '士兵': { avatar: '🪖', title: '联军士兵' },
        '曹操': { avatar: '👤', title: '北方霸主' }
      };
      return speakers[name] || { avatar: '👤', title: '' };
    }

    // 渲染人物栏
    function renderCharacters(speaking) {
      const bar = document.getElementById('charactersBar');
      const chars = [
        { name: '周瑜', avatar: '⚔️' },
        { name: '诸葛亮', avatar: '📖' },
        { name: '刘备', avatar: '👑' },
        { name: '曹操', avatar: '👤' }
      ];

      bar.innerHTML = chars.map(c => `
        <div class="character-mini ${c.name === speaking ? 'active' : ''}">
          <div class="character-mini-avatar">${c.avatar}</div>
          <div class="character-mini-name">${c.name}</div>
        </div>
      `).join('');
    }

    // 渲染抉择
    function renderChoices(choices) {
      const list = document.getElementById('choiceList');
      list.innerHTML = choices.map((c, i) => `
        <button class="choice-btn" onclick="makeChoice(${i})">
          <div class="choice-marker">${i + 1}</div>
          <div class="choice-content">
            <div class="choice-label">${c.label}</div>
            <div class="choice-desc">${c.desc}</div>
          </div>
        </button>
      `).join('');
    }

    // 选择
    function makeChoice(index) {
      if (isTransitioning) return;
      isTransitioning = true;

      // 停止打字机
      stopTypewriter();

      const stage = currentEvent.stages[currentStageIndex];
      const choice = stage.choices[index];

      // 记录选择
      currentChoices.push(choice);
      GameState.addChoice(choice);

      // 显示响应（打字机效果）
      const responseBubble = document.getElementById('responseBubble');
      responseBubble.classList.add('show');
      typeWriter(document.getElementById('responseText'), choice.response, 20, () => {
        // 打字完成后显示继续提示
        document.getElementById('autoContinueHint').classList.add('show');
      });

      // 禁用所有选项
      document.querySelectorAll('.choice-btn').forEach(btn => {
        btn.disabled = true;
      });

      // 隐藏继续提示直到打字完成
      document.getElementById('autoContinueHint').classList.remove('show');

      // 更新统计
      updateStats();

      // 根据响应文字长度调整等待时间（至少2.5秒）
      const waitTime = Math.max(2500, choice.response.length * 25 + 1000);
      setTimeout(() => {
        continueStory();
      }, waitTime);
    }

    // 继续故事
    function continueStory() {
      // 停止打字机
      stopTypewriter();

      // 检查是否还有下一阶段
      if (currentStageIndex >= currentEvent.stages.length - 1) {
        showEnding();
        return;
      }

      // 简单线性推进
      currentStageIndex++;
      pendingChoice = null;
      isTransitioning = false;

      // 渲染新阶段
      renderStage(currentStageIndex);

      // 滚动到顶部
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 更新统计
    function updateStats() {
      const accuracy = Math.max(0, 100 - GameState.totalDeviation);
      document.getElementById('accuracyNav').textContent = accuracy + '%';
      document.getElementById('deviationNav').textContent = GameState.totalDeviation + '%';
    }

    // 显示结局
    function showEnding() {
      const ending = GameState.getEnding();
      if (!ending) return;

      document.getElementById('endingIcon').textContent = ending.icon;
      document.getElementById('endingTitle').textContent = ending.title;
      document.getElementById('endingSubtitle').textContent = ending.subtitle;
      document.getElementById('endingDesc').textContent = ending.description;
      document.getElementById('finalAccuracy').textContent = ending.stats.historical_accuracy + '%';
      document.getElementById('finalDeviation').textContent = ending.stats.deviation + '%';
      document.getElementById('choicesCount').textContent = ending.stats.choices_made;
      document.getElementById('bestChoice').textContent = ending.stats.best_choice;

      document.getElementById('endingOverlay').classList.add('show');
    }

    // 返回主页
    function goHome() {
      window.location.href = 'index.html';
    }

    // 重新开始
    function restartGame() {
      document.getElementById('endingOverlay').classList.remove('show');
      GameState.reset();
      currentStageIndex = 0;
      currentChoices = [];
      pendingChoice = null;
      isTransitioning = false;
      updateProgressDots();
      updateStats();
      renderStage(0);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 初始化
    init();
  </script>
</body>
</html>
