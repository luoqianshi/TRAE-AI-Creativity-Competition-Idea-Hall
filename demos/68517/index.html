<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>育儿收支管理工具 | 家庭养娃记账神器</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"微软雅黑",sans-serif;}
        body{background:#f0f8ff;padding:20px;}
        .container{max-width:620px;margin:0 auto;background:#fff;border-radius:20px;padding:25px;box-shadow:0 4px 16px #dceaf8;}
        h1{text-align:center;color:#4096ff;font-size:26px;margin-bottom:20px;}
        .desc{background:#f5faff;padding:15px;border-radius:12px;margin-bottom:20px;color:#333;line-height:1.7;}
        .box{margin:18px 0;}
        label{display:block;font-size:16px;color:#222;margin-bottom:6px;font-weight:500;}
        input,select{width:100%;padding:12px 14px;border:1px solid #cce4ff;border-radius:10px;font-size:16px;background:#fbfdff;}
        button{width:100%;padding:14px;background:#4096ff;color:#fff;border:none;border-radius:10px;font-size:18px;margin-top:8px;cursor:pointer;}
        .total-card{display:flex;gap:10px;margin:20px 0;}
        .total-item{flex:1;text-align:center;padding:12px;border-radius:10px;}
        .in{background:#e8f7ee;color:#27ae60;}
        .out{background:#fef0f0;color:#f53f3f;}
        .chart-wrap{height:320px;margin:20px 0;}
        .list-title{font-size:18px;margin:10px 0;color:#333;}
        .item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee;}
        .red{color:#f53f3f;}
        .green{color:#27ae60;}
    </style>
</head>
<body>
    <div class="container">
        <h1>👶 育儿收支管理工具</h1>

        <div class="desc">
            <strong>产品简介：</strong>专为家长打造的<strong>专属育儿记账工具</strong>，覆盖奶粉辅食、早教兴趣班、医疗体检、衣物玩具、亲子出行等八大育儿分类。自动统计每月养娃总成本、可视化开销占比，帮家庭科学管控育儿预算。
        </div>

        <div class="total-card">
            <div class="total-item in">
                <div>育儿收入</div>
                <div id="totalIn" style="font-size:20px;font-weight:bold;">¥0.00</div>
            </div>
            <div class="total-item out">
                <div>育儿支出</div>
                <div id="totalOut" style="font-size:20px;font-weight:bold;">¥0.00</div>
            </div>
        </div>

        <div class="box">
            <label>收支类型</label>
            <select id="type">
                <option value="out">育儿支出</option>
                <option value="in">育儿补贴/红包收入</option>
            </select>
        </div>

        <div class="box">
            <label>育儿分类</label>
            <select id="cate">
                <option value="奶粉辅食">🍼 奶粉/辅食/零食</option>
                <option value="衣物用品">👕 衣物/尿裤/生活用品</option>
                <option value="早教学习">📖 早教/绘本/文具</option>
                <option value="兴趣培训">🎨 兴趣班/培训费</option>
                <option value="医疗健康">🏥 体检/疫苗/药品</option>
                <option value="玩具游乐">🎮 玩具/游乐/亲子</option>
                <option value="出行餐食">🚗 出行/餐食</option>
                <option value="其他">📌 其他育儿开销</option>
            </select>
        </div>

        <div class="box">
            <label>金额（元）</label>
            <input type="number" id="money" placeholder="请输入金额">
        </div>

        <div class="box">
            <label>备注</label>
            <input type="text" id="note" placeholder="简单记录用途">
        </div>

        <button onclick="addData()">✅ 保存本条育儿记录</button>

        <div class="chart-wrap">
            <canvas id="myChart"></canvas>
        </div>

        <div class="list-title">📋 育儿收支明细</div>
        <div id="list"></div>
    </div>

    <script>
        let dataList = [];
        const cateList = ["奶粉辅食","衣物用品","早教学习","兴趣培训","医疗健康","玩具游乐","出行餐食","其他"];
        let chartIns;

        // 初始化图表
        function initChart(){
            const ctx = document.getElementById("myChart").getContext("2d");
            chartIns = new Chart(ctx,{
                type:"doughnut",
                data:{
                    labels:cateList,
                    datasets:[{
                        data:[0,0,0,0,0,0,0,0],
                        backgroundColor:["#ff7875","#ffcb45","#95de64","#5cdbd3","#85a5ff","#b37feb","#ff9add","#cccccc"]
                    }]
                },
                options:{
                    plugins:{title:{display:true,text:"本月育儿支出分类占比",font:{size:16}}}
                }
            })
        }
        initChart();

        // 添加记录
        function addData(){
            let type = document.getElementById("type").value;
            let cate = document.getElementById("cate").value;
            let money = parseFloat(document.getElementById("money").value);
            let note = document.getElementById("note").value || "无备注";

            if(!money || money<=0){alert("请输入正确金额！");return;}

            dataList.push({
                type,cate,money,note,time:new Date().toLocaleString()
            })

            document.getElementById("money").value = "";
            document.getElementById("note").value = "";

            updateUI();
        }

        // 更新页面
        function updateUI(){
            // 统计总额
            let inSum = 0, outSum = 0;
            let cateSum = {};
            cateList.forEach(k=>cateSum[k]=0);

            dataList.forEach(item=>{
                if(item.type==="in") inSum += item.money;
                else {
                    outSum += item.money;
                    cateSum[item.cate] += item.money;
                }
            })

            document.getElementById("totalIn").innerText = `¥${inSum.toFixed(2)}`;
            document.getElementById("totalOut").innerText = `¥${outSum.toFixed(2)}`;

            // 更新图表
            chartIns.data.datasets[0].data = Object.values(cateSum);
            chartIns.update();

            // 更新列表
            let html = "";
            dataList.reverse().forEach(item=>{
                html += `
                <div class="item">
                    <div>【${item.cate}】${item.note}<br/><small style="color:#999">${item.time}</small></div>
                    <div class="${item.type==='in'?'green':'red'}">${item.type==='in'?'+':'-'}${item.money}元</div>
                </div>
                `
            })
            document.getElementById("list").innerHTML = html;
        }
    </script>
</body>
</html>
