<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI学途汇 - 大学生一站式学习统筹小程序</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system}
        body{background:#f7f8fa;color:#333;max-width:430px;margin:0 auto;min-height:100vh}
        header{background:#407bff;color:white;padding:16px;text-align:center;font-size:18px;font-weight:600}
        .nav-tab{display:flex;background:white;border-bottom:1px solid #eee}
        .nav-tab div{flex:1;text-align:center;padding:12px 0;font-size:14px;color:#666}
        .nav-tab div.active{color:#407bff;border-bottom:2px solid #407bff;font-weight:500}
        .container{padding:14px}
        .card{background:white;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}
        .card-title{font-size:16px;font-weight:600;margin-bottom:10px}
        .item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f5f5f5}
        .item:last-child{border:none}
        .tag{font-size:12px;padding:3px 8px;border-radius:12px;background:#e8f0ff;color:#407bff}
        .btn-blue{width:100%;background:#407bff;color:white;border:none;border-radius:10px;padding:12px;font-size:15px;margin-top:10px}
        .bottom-bar{position:fixed;bottom:0;width:100%;max-width:430px;background:white;display:flex;padding:8px 0;border-top:1px solid #eee}
        .bottom-bar div{flex:1;text-align:center;font-size:12px;color:#777;padding:6px 0}
        .bottom-bar div.active{color:#407bff}
    </style>
</head>
<body>
<header>AI学途汇</header>
<div class="nav-tab">
    <div class="active">日程看板</div>
    <div>AI规划</div>
    <div>资料库</div>
    <div>我的</div>
</div>
<div class="container">
    <div class="card">
        <div class="card-title">今日学习任务</div>
        <div class="item">
            <span>数据库作业提交</span>
            <span class="tag">今日截止</span>
        </div>
        <div class="item">
            <span>英语单词打卡</span>
            <span class="tag">日常任务</span>
        </div>
        <div class="item">
            <span>算法习题刷题</span>
            <span class="tag">三天内</span>
        </div>
        <button class="btn-blue">AI生成本周计划</button>
    </div>

    <div class="card">
        <div class="card-title">课表速览</div>
        <div class="item">周一｜数据库原理</div>
        <div class="item">周二｜算法设计与分析</div>
        <div class="item">周三｜Web前端开发</div>
    </div>

    <div class="card">
        <div class="card-title">同校共享资料</div>
        <div class="item">数据库期末复习笔记</div>
        <div class="item">算法选择填空题库</div>
        <div class="item">Web课程设计参考文档</div>
    </div>
</div>

<div style="height:70px"></div>
<div class="bottom-bar">
    <div class="active">首页</div>
    <div>任务</div>
    <div>资料</div>
    <div>个人</div>
</div>
</body>
</html>
