      'more-horizontal': `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>`,
      bell: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>`,
      settings: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>`,
      droplist: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 6h12M6 12h12M6 18h12"/></svg>`,
      wind: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9.59 4.59A2 2 0 1111 8H2m10.59 11.41A2 2 0 1014 16H2m15.73-8.27A2.5 2.5 0 1119.5 12H2"/></svg>`,
      droplets: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0014 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 01-11.91 4.97"/></svg>`,
      'power-off': `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 11-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>`,
      newspaper: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 22h16a2 2 0 002-2V4a2 2 0 00-2-2H8a2 2 0 00-2 2v16a2 2 0 01-2 2zm0 0a2 2 0 01-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8M15 18h-5M10 6h8v4h-8z"/></svg>`,
    };

    // 生成唯一ID
    function generateId() {
      return Math.random().toString(36).substr(2, 9);
    }

    // AI回复逻辑
    function generateAIResponse(userMessage) {
      const lowerMsg = userMessage.toLowerCase();
      
      if (lowerMsg.includes('天气')) {
        return `今天北京多云，28度，体感31度。空气质量良好，适合户外活动哦~ 要我为您播报详细的天气预报吗？`;
      }
      if (lowerMsg.includes('灯') || lowerMsg.includes('开灯') || lowerMsg.includes('关灯')) {
        if (lowerMsg.includes('开')) {
          return '好的，已为您打开客厅主灯。亮度已调整为80%，需要调节亮度或色温吗？';
        }
        if (lowerMsg.includes('关')) {
          return '好的，已为您关闭客厅主灯。晚安，做个好梦~';
        }
        return '好的，您想调节哪个房间的灯光呢？我可以帮您控制亮度和色温哦。';
      }
      if (lowerMsg.includes('音乐') || lowerMsg.includes('歌') || lowerMsg.includes('播放')) {
        return '好的，为您播放您最喜欢的轻音乐列表。当前播放：周杰伦 - 夜曲。需要切换歌曲或调节音量吗？';
      }
      if (lowerMsg.includes('热') || lowerMsg.includes('新闻') || lowerMsg.includes('热点')) {
        return '今日热点TOP3：1. AI技术重大突破 2. 新能源汽车销量创新高 3. 股市行情分析。您想深入了解哪个话题？';
      }
      if (lowerMsg.includes('模式') || lowerMsg.includes('场景')) {
        return '我为您准备了多种场景模式：晨起模式、工作模式、休闲模式、睡眠模式、观影模式、用餐模式。您想开启哪个模式？';
      }
      if (lowerMsg.includes('你好') || lowerMsg.includes('嗨') || lowerMsg.includes('hi')) {
        return '你好呀！很高兴见到你~ 有什么我可以帮你的吗？我可以控制家里的设备、播放音乐、播报天气和新闻哦。';
      }
      if (lowerMsg.includes('谢谢') || lowerMsg.includes('感谢')) {
        return '不客气~ 能帮到您我很开心！还有其他需要吗？';
      }
      if (lowerMsg.includes('晚安') || lowerMsg.includes('睡觉')) {
        return '晚安，做个好梦~ 我会帮您关好灯，设置好睡眠空调温度。明天见！';
      }
      if (lowerMsg.includes('早上好') || lowerMsg.includes('早安')) {
        return '早上好！新的一天开始啦~ 今天天气不错，心情也要美美哒。要我为您播报今日新闻和天气吗？';
      }
      
      return '我收到了~ 有什么我可以帮您的吗？您可以试试让我播放音乐、调节灯光、播报天气、查看热点新闻哦。';
    }

    // 发送消息
    function sendMessage(content, type = 'text') {
      const userMessage = {
        id: generateId(),
        content,
        sender: 'user',
        timestamp: new Date(),
        type,
      };
      state.messages.push(userMessage);
      state.isAssistantSpeaking = true;
      render();
      
      setTimeout(() => {
        const aiResponse = generateAIResponse(content);
        const assistantMessage = {
          id: generateId(),
          content: aiResponse,
          sender: 'assistant',
          timestamp: new Date(),
          type: 'text',
        };
        state.messages.push(assistantMessage);
        state.isAssistantSpeaking = false;
        render();
      }, 1000 + Math.random() * 1000);
    }

    // 切换设备状态
    function toggleDevice(deviceId) {
      const device = state.devices.find(d => d.id === deviceId);
      if (device) {
        device.isOn = !device.isOn;
        render();
      }
    }

    // 设置设备值
    function setDeviceValue(deviceId, value) {
      const device = state.devices.find(d => d.id === deviceId);
      if (device) {
        device.value = value;
        render();
      }
    }

    // 切换音乐播放
    function toggleMusicPlay() {
      state.musicDevice.isPlaying = !state.musicDevice.isPlaying;
      render();
    }

    // 播放音乐
    function playMusic(songId) {
      const song = state.musicDevice.playlist.find(s => s.id === songId);
      if (song) {
        state.musicDevice.currentSong = song;
        state.musicDevice.isPlaying = true;
        render();
      }
    }

    // 设置音量
    function setVolume(volume) {
      state.musicDevice.volume = volume;
      render();
    }

    // 激活场景
    function activateScene(sceneId) {
      state.scenes.forEach(s => {
        s.isActive = s.id === sceneId;
      });
      render();
    }

    // 格式化时间
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    // 获取AQI颜色
    function getAqiColor(aqi) {
      if (aqi <= 50) return 'text-green-400';
      if (aqi <= 100) return 'text-yellow-400';
      if (aqi <= 150) return 'text-orange-400';
      return 'text-red-400';
    }

    // 获取设备值标签
    function getValueLabel(device) {
      if (device.type === 'ac') return `${device.value || 26}°C`;
      if (device.type === 'curtain') return `${device.value || 0}%`;
      if (device.type === 'light') return `${device.value || 50}%`;
      if (device.type === 'tv') return `音量 ${device.value || 50}`;
      return '';
    }

    // 获取设备颜色
    function getDeviceColor(type) {
      const colors = {
        light: 'from-yellow-400 to-orange-400',
        ac: 'from-blue-400 to-cyan-400',
        curtain: 'from-purple-400 to-pink-400',
        tv: 'from-indigo-400 to-blue-400',
        security: 'from-green-400 to-emerald-400',
        music: 'from-pink-400 to-rose-400',
      };
      return colors[type] || 'from-gray-400 to-gray-500';
    }

    // 获取推荐类型颜色
    function getTypeColor(type) {
      const colors = {
        music: 'from-pink-500 to-purple-500',
        news: 'from-blue-500 to-cyan-500',
        topic: 'from-blue-500 to-cyan-500',
        scene: 'from-amber-500 to-orange-500',
        video: 'from-red-500 to-pink-500',
      };
      return colors[type] || 'from-primary-500 to-purple-500';
    }

    // 获取推荐图标
    function getTypeIcon(type) {
      const iconMap = {
        music: icons.music,
        news: icons.newspaper,
        topic: icons.newspaper,
        scene: icons.sparkles,
        video: icons.film,
      };
      return iconMap[type] || icons.sparkles;
    }

    // 获取趋势图标
    function getTrendingIcon(trending) {
      if (trending === 'up') return icons['trending-up'];
      if (trending === 'down') return icons['trending-down'];
      return icons.minus;
    }

    // 获取场景图标
    function getSceneIcon(iconName) {
      return icons[iconName] || icons.sofa;
    }

    // 获取天气图标
    function getWeatherIcon(iconName) {
      return icons[iconName] || icons['cloud-sun'];
    }

    // 获取设备图标
    function getDeviceIcon(iconName) {
      return icons[iconName] || icons.lightbulb;
    }

    // 获取问候语
    function getGreeting() {
      const hour = new Date().getHours();
      if (hour < 6) return '夜深了';
      if (hour < 12) return '早上好';
      if (hour < 14) return '中午好';
      if (hour < 18) return '下午好';
      if (hour < 22) return '晚上好';
      return '夜深了';
    }

    // 渲染应用
    function render() {
      const app = document.getElementById('app');
      
      const activeDevicesCount = state.devices.filter(d => d.isOn).length;
      
      let content = '';
      
      if (state.activeTab === 'home') {
        content = renderHomePage(activeDevicesCount);
      } else if (state.activeTab === 'devices') {
        content = renderDevicesPage();
      } else if (state.activeTab === 'assistant') {
        content = renderAssistantPage();
      }
      
      app.innerHTML = `
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">
          ${renderHeader(activeDevicesCount)}
          ${content}
        </div>
        ${renderBottomNav()}
        ${state.isVoiceListening ? renderVoiceOverlay() : ''}
      `;
      
      attachEventListeners();
    }

    // 渲染头部
    function renderHeader(activeDevicesCount) {
      return `
        <div class="flex items-center justify-between mb-6">
          <div>
            <h1 class="text-2xl font-bold text-white">
              ${getGreeting()}，主人 👋
            </h1>
            <p class="text-gray-400 mt-1">
              欢迎回家，当前有 ${activeDevicesCount} 个设备正在运行
            </p>
          </div>
          <div class="flex items-center gap-3">
            <button class="p-2.5 bg-white/5 hover:bg-white/10 rounded-xl text-gray-400 hover:text-white transition-colors relative">
              ${icons.bell}
              <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full"></span>
            </button>
            <button class="p-2.5 bg-white/5 hover:bg-white/10 rounded-xl text-gray-400 hover:text-white transition-colors">
              ${icons.settings}
            </button>
            <div class="w-10 h-10 bg-gradient-to-br from-primary-500 to-purple-500 rounded-xl flex items-center justify-center">
              ${icons.user}
            </div>
          </div>
        </div>
      `;
    }

    // 渲染首页
    function renderHomePage(activeDevicesCount) {
      return `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div class="lg:col-span-2 space-y-6">
            ${renderScenes()}
            ${renderDevices()}
            ${renderMusicPlayer()}
          </div>
          <div class="space-y-6">
            ${renderWeatherCard()}
            ${renderRecommendations()}
          </div>
        </div>
      `;
    }

    // 渲染场景
    function renderScenes() {
      return `
        <div class="bg-white/5 backdrop-blur-xl rounded-2xl p-6 border border-white/10">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-semibold text-white">智能场景</h3>
            <button class="text-sm text-primary-400 hover:text-primary-300 transition-colors">
              管理场景
            </button>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
            ${state.scenes.map(scene => `
              <button
                onclick="activateScene('${scene.id}')"
                class="relative p-4 rounded-xl text-left transition-all duration-300 overflow-hidden group ${scene.isActive ? 'ring-2 ring-primary-500/50 shadow-lg' : 'hover:scale-[1.02]'}"
              >
                <div class="absolute inset-0 bg-gradient-to-br ${scene.color} ${scene.isActive ? 'opacity-30' : 'opacity-10 group-hover:opacity-20'} transition-opacity"></div>
                <div class="relative">
                  <div class="w-10 h-10 rounded-lg flex items-center justify-center mb-3 bg-gradient-to-br ${scene.color} ${scene.isActive ? 'opacity-100' : 'opacity-70'} text-white">
                    ${getSceneIcon(scene.icon)}
                  </div>
                  <h4 class="font-medium text-white mb-1">${scene.name}</h4>
                  <p class="text-xs text-gray-400 line-clamp-2">${scene.description}</p>
                  ${scene.isActive ? `
                    <div class="mt-2 flex items-center gap-1.5">
                      <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
                      <span class="text-xs text-green-400">运行中</span>
                    </div>
                  ` : ''}
                </div>
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    // 渲染设备
    function renderDevices() {
      return `
        <div class="bg-white/5 backdrop-blur-xl rounded-2xl p-6 border border-white/10">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-semibold text-white">常用设备</h3>
            <button onclick="switchTab('devices')" class="text-sm text-primary-400 hover:text-primary-300 transition-colors">
              全部设备
            </button>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
            ${state.devices.slice(0, 8).map(device => renderDeviceCard(device)).join('')}
          </div>
        </div>
      `;
    }

    // 渲染设备卡片
    function renderDeviceCard(device) {
      const hasSlider = ['light', 'ac', 'curtain', 'tv'].includes(device.type);
      
      return `
        <div class="bg-white/5 backdrop-blur-xl rounded-2xl p-4 border transition-all duration-300 ${device.isOn ? 'border-white/20 shadow-lg' : 'border-white/5 opacity-70'}">
          <div class="flex items-start justify-between mb-3">
            <div class="w-12 h-12 rounded-xl flex items-center justify-center bg-gradient-to-br ${getDeviceColor(device.type)} ${device.isOn ? 'opacity-100' : 'opacity-40'} ${device.isOn ? 'text-white' : 'text-gray-400'}">
              ${getDeviceIcon(device.icon)}
            </div>
            <button onclick="toggleDevice('${device.id}')" class="p-2 rounded-lg transition-all duration-200 ${device.isOn ? 'bg-primary-500/20 text-primary-400 hover:bg-primary-500/30' : 'bg-white/5 text-gray-500 hover:bg-white/10'}">
              ${icons['power-off']}
            </button>
          </div>
          <div class="mb-2">
            <h4 class="font-medium ${device.isOn ? 'text-white' : 'text-gray-400'}">${device.name}</h4>
            <p class="text-sm text-gray-500">${device.room}</p>
          </div>
          ${hasSlider && device.isOn ? `
            <div class="mt-3">
              <div class="flex items-center justify-between mb-2">
                <span class="text-sm text-gray-400">${getValueLabel(device)}</span>
              </div>
              <input
                type="range"
                min="${device.type === 'ac' ? 16 : 0}"
                max="${device.type === 'ac' ? 32 : 100}"
                value="${device.value || 0}"
                onchange="setDeviceValue('${device.id}', parseInt(this.value))"
                class="w-full h-2 bg-white/10 rounded-full appearance-none cursor-pointer"
                style="accent-color: #6366f1;"
              />
            </div>
          ` : ''}
          ${!hasSlider ? `
            <div class="text-sm font-medium mt-2 ${device.isOn ? 'text-green-400' : 'text-gray-500'}">
              ${device.isOn ? '已开启' : '已关闭'}
            </div>
          ` : ''}
        </div>
      `;
    }

    // 渲染音乐播放器
    function renderMusicPlayer() {
      const { currentSong, isPlaying, volume, playlist } = state.musicDevice;
      
      return `
        <div class="bg-white/5 backdrop-blur-xl rounded-2xl p-6 border border-white/10">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-semibold text-white">音乐播放</h3>
            <span class="text-sm text-gray-400">智能音箱</span>
          </div>
          <div class="flex gap-4 mb-6">
            <div class="w-24 h-24 rounded-xl overflow-hidden flex-shrink-0 shadow-2xl">
              <img src="${currentSong.cover}" alt="${currentSong.title}" class="w-full h-full object-cover ${isPlaying ? 'animate-pulse' : ''}" />
            </div>
            <div class="flex-1 flex flex-col justify-center min-w-0">
              <h4 class="text-white font-semibold text-lg truncate">${currentSong.title}</h4>
              <p class="text-gray-400 text-sm truncate">${currentSong.artist}</p>
              <p class="text-gray-500 text-xs truncate mt-1">${currentSong.album}</p>
            </div>
            <button onclick="toggleLiked()" class="p-2 rounded-full transition-colors self-start ${isLiked ? 'text-pink-500 hover:bg-pink-500/10' : 'text-gray-400 hover:bg-white/10 hover:text-white'}">
              <svg class="w-5 h-5 ${isLiked ? 'fill-current' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
            </button>
          </div>
          <div class="mb-4">
            <div class="relative h-1.5 bg-white/10 rounded-full overflow-hidden">
              <div class="absolute left-0 top-0 h-full bg-gradient-to-r from-pink-500 to-purple-500 rounded-full" style="width: ${musicProgress}%"></div>
              <input type="range" min="0" max="100" value="${musicProgress}" onchange="musicProgress = parseInt(this.value); render();" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
            </div>
            <div class="flex justify-between mt-1.5 text-xs text-gray-500">
              <span>${formatTime(Math.floor((musicProgress / 100) * currentSong.duration))}</span>
              <span>${formatTime(currentSong.duration)}</span>
            </div>
          </div>
          <div class="flex items-center justify-center gap-4 mb-4">
            <button onclick="toggleShuffle()" class="p-2 rounded-full transition-colors ${isShuffle ? 'text-primary-400' : 'text-gray-400 hover:text-white'}">
              ${icons.shuffle}
            </button>
            <button onclick="playPrev()" class="p-2 text-gray-400 hover:text-white transition-colors">
              ${icons['skip-back']}
            </button>
            <button onclick="toggleMusicPlay()" class="w-14 h-14 bg-gradient-to-r from-pink-500 to-purple-500 rounded-full flex items-center justify-center text-white shadow-lg hover:shadow-pink-500/30 transition-all hover:scale-105">
              ${isPlaying ? icons.pause : '<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>'}
            </button>
            <button onclick="playNext()" class="p-2 text-gray-400 hover:text-white transition-colors">
              ${icons['skip-forward']}
            </button>
            <button onclick="toggleRepeat()" class="p-2 rounded-full transition-colors ${isRepeat ? 'text-primary-400' : 'text-gray-400 hover:text-white'}">
              ${icons.repeat}
            </button>
          </div>
          <div class="flex items-center gap-3">
            <button onclick="toggleVolumeMute()" class="text-gray-400 hover:text-white transition-colors">
              ${volume === 0 ? icons['volume-x'] : icons['volume-2']}
            </button>
            <div class="flex-1 relative h-1.5 bg-white/10 rounded-full overflow-hidden">
              <div class="absolute left-0 top-0 h-full bg-white/60 rounded-full" style="width: ${volume}%"></div>
              <input type="range" min="0" max="100" value="${volume}" onchange="setVolume(parseInt(this.value))" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
            </div>
            <span class="text-sm text-gray-400 w-10 text-right">${volume}%</span>
          </div>
          ${playlist && playlist.length > 0 ? `
            <div class="mt-6 border-t border-white/10 pt-4">
              <div class="text-sm text-gray-400 mb-3">播放列表</div>
              <div class="space-y-2 max-h-48 overflow-y-auto">
                ${playlist.map((song, index) => `
                  <div onclick="playMusic('${song.id}')" class="flex items-center gap-3 p-2 rounded-lg cursor-pointer transition-colors ${currentSong.id === song.id ? 'bg-white/10' : 'hover:bg-white/5'}">
                    <span class="text-xs text-gray-500 w-4">${index + 1}</span>
                    <img src="${song.cover}" alt="${song.title}" class="w-8 h-8 rounded object-cover" />
                    <div class="flex-1 min-w-0">
                      <div class="text-sm truncate ${currentSong.id === song.id ? 'text-primary-400' : 'text-white'}">${song.title}</div>
                      <div class="text-xs text-gray-500 truncate">${song.artist}</div>
                    </div>
                    <span class="text-xs text-gray-500">${formatTime(song.duration)}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    // 渲染天气卡片
    function renderWeatherCard() {
      return `
        <div class="bg-white/5 backdrop-blur-xl rounded-2xl p-6 border border-white/10">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-semibold text-white">天气</h3>
            <span class="text-sm text-gray-400">${state.weather.city}</span>
          </div>
          <div class="flex items-center gap-4 mb-6">
            <div class="text-yellow-400">
              ${getWeatherIcon(state.weather.icon)}
            </div>
            <div>
              <div class="text-4xl font-bold text-white">${state.weather.temperature}°</div>
              <div class="text-gray-400 text-sm">体感 ${state.weather.feelsLike}° · ${state.weather.condition}</div>
            </div>
          </div>
          <div class="grid grid-cols-3 gap-3 mb-6">
            <div class="bg-white/5 rounded-xl p-3 text-center">
              <div class="text-orange-400 mx-auto mb-1">${icons.thermometer}</div>
              <div class="text-white font-medium">${state.weather.temperature}°</div>
              <div class="text-xs text-gray-400">温度</div>
            </div>
            <div class="bg-white/5 rounded-xl p-3 text-center">
              <div class="text-blue-400 mx-auto mb-1">${icons.droplets}</div>
              <div class="text-white font-medium">${state.weather.humidity}%</div>
              <div class="text-xs text-gray-400">湿度</div>
            </div>
            <div class="bg-white/5 rounded-xl p-3 text-center">
              <div class="text-cyan-400 mx-auto mb-1">${icons.wind}</div>
              <div class="text-white font-medium">${state.weather.windSpeed}</div>
              <div class="text-xs text-gray-400">风速km/h</div>
            </div>
          </div>
          <div class="mb-4">
            <div class="flex items-center justify-between mb-2">
              <span class="text-sm text-gray-400">空气质量</span>
              <span class="text-sm font-medium ${getAqiColor(state.weather.airQuality.aqi)}">${state.weather.airQuality.level} (${state.weather.airQuality.aqi})</span>
            </div>
            <div class="h-2 bg-white/10 rounded-full overflow-hidden">
              <div class="h-full bg-gradient-to-r from-green-400 via-yellow-400 to-red-400 rounded-full" style="width: ${Math.min(state.weather.airQuality.aqi / 3, 100)}%"></div>
            </div>
            <div class="flex justify-between mt-1 text-xs text-gray-500">
              <span>PM2.5: ${state.weather.airQuality.pm25}</span>
              <span>PM10: ${state.weather.airQuality.pm10}</span>
            </div>
          </div>
          <div class="border-t border-white/10 pt-4">
            <div class="text-sm text-gray-400 mb-3">未来天气</div>
            <div class="flex justify-between">
              ${state.weather.forecast.map(day => `
                <div class="text-center">
                  <div class="text-xs text-gray-400 mb-1">${day.date}</div>
                  <div class="mb-1 text-yellow-400">${getWeatherIcon(day.icon)}</div>
                  <div class="text-white text-sm font-medium">${day.high}°/${day.low}°</div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // 渲染推荐
    function renderRecommendations() {
      return `
        <div class="space-y-6">
          <div class="bg-white/5 backdrop-blur-xl rounded-2xl p-6 border border-white/10">
            <div class="flex items-center justify-between mb-4">
              <div class="flex items-center gap-2">
                <div class="text-primary-400">${icons.sparkles}</div>
                <h3 class="text-lg font-semibold text-white">为你推荐</h3>
              </div>
              <span class="text-xs text-gray-500">基于你的习惯和实时热点</span>
            </div>
            <div class="space-y-3">
              ${state.recommendations.map(rec => `
                <div onclick="sendMessage('${rec.action?.command || rec.title}')" class="bg-white/5 rounded-xl p-4 hover:bg-white/10 transition-colors cursor-pointer group">
                  <div class="flex gap-4">
                    ${rec.image ? `
                      <div class="w-20 h-20 rounded-lg overflow-hidden flex-shrink-0">
                        <img src="${rec.image}" alt="${rec.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
                      </div>
                    ` : `
                      <div class="w-12 h-12 rounded-lg flex items-center justify-center flex-shrink-0 bg-gradient-to-br ${getTypeColor(rec.type)} text-white">
                        ${getTypeIcon(rec.type)}
                      </div>
                    `}
                    <div class="flex-1 min-w-0">
                      <div class="flex items-start justify-between gap-2">
                        <h4 class="text-white font-medium">${rec.title}</h4>
                        <span class="text-xs text-gray-500 flex-shrink-0">${rec.priority < 3 ? '🔥 热门' : '推荐'}</span>
                      </div>
                      <p class="text-sm text-gray-400 mt-1 line-clamp-2">${rec.description}</p>
                      <div class="flex items-center justify-between mt-2">
                        <span class="text-xs text-primary-400">${rec.reason}</span>
                        ${rec.action ? `
                          <button class="flex items-center gap-1 text-xs text-white bg-primary-500/20 hover:bg-primary-500/30 px-3 py-1 rounded-full transition-colors">
                            ${icons.play}
                            ${rec.action.label}
                          </button>
                        ` : ''}
                      </div>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
          ${renderHotTopics()}
        </div>
      `;
    }

    // 渲染热点话题
    function renderHotTopics() {
      return `
        <div class="bg-white/5 backdrop-blur-xl rounded-2xl p-6 border border-white/10">
          <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2">
              <div class="text-red-400">${icons['trending-up']}</div>
              <h3 class="text-lg font-semibold text-white">实时热点</h3>
            </div>
            <button class="text-sm text-primary-400 hover:text-primary-300 transition-colors">查看全部</button>
          </div>
          <div class="space-y-2">
            ${state.hotTopics.map((topic, index) => `
              <div onclick="sendMessage('查看关于「${topic.title}」的新闻')" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 cursor-pointer transition-colors group">
                <span class="w-6 h-6 rounded-lg flex items-center justify-center text-sm font-bold ${index < 3 ? 'bg-red-500/20 text-red-400' : 'bg-white/5 text-gray-400'}">${index + 1}</span>
                <div class="flex-1 min-w-0">
                  <div class="text-white text-sm font-medium truncate group-hover:text-primary-400 transition-colors">${topic.title}</div>
                  <div class="flex items-center gap-2 mt-0.5">
                    <span class="text-xs text-gray-500">${topic.source}</span>
                    <span class="text-xs text-gray-600">·</span>
                    <span class="text-xs text-gray-500">${topic.category}</span>
                  </div>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-sm text-gray-400">${(topic.hotScore / 1000).toFixed(1)}万</span>
                  <div class="${topic.trending === 'up' ? 'text-red-400' : topic.trending === 'down' ? 'text-green-400' : 'text-gray-400'}">
                    ${getTrendingIcon(topic.trending)}
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // 渲染设备页面
    function renderDevicesPage() {
      const filteredDevices = state.currentRoom === '全部' ? state.devices : state.devices.filter(d => d.room === state.currentRoom);
      
      return `
        <div class="mb-6">
          <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
            <button onclick="setCurrentRoom('全部')" class="px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-colors ${state.currentRoom === '全部' ? 'bg-primary-500 text-white' : 'bg-white/5 text-gray-400 hover:bg-white/10 hover:text-white'}">全部房间</button>
            ${state.rooms.map(room => `
              <button onclick="setCurrentRoom('${room}')" class="px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-colors ${state.currentRoom === room ? 'bg-primary-500 text-white' : 'bg-white/5 text-gray-400 hover:bg-white/10 hover:text-white'}">${room}</button>
            `).join('')}
          </div>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
          ${filteredDevices.map(device => renderDeviceCard(device)).join('')}
        </div>
      `;
    }

    // 渲染助手页面
    function renderAssistantPage() {
      return `
        <div class="max-w-3xl mx-auto">
          <div class="bg-white/5 backdrop-blur-xl rounded-2xl border border-white/10 flex flex-col h-[600px]">
            <div class="p-4 border-b border-white/10 flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="relative">
                  <div class="w-10 h-10 bg-gradient-to-br from-primary-500 to-purple-500 rounded-xl flex items-center justify-center text-white">
                    ${icons.bot}
                  </div>
                  ${state.isAssistantSpeaking ? '<span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-400 border-2 border-gray-900 rounded-full animate-pulse"></span>' : ''}
                </div>
                <div>
                  <h3 class="text-white font-semibold">智能助手小暖</h3>
                  <p class="text-xs text-gray-400">${state.isAssistantSpeaking ? '正在回复...' : state.isVoiceListening ? '正在聆听...' : '随时为您服务'}</p>
                </div>
              </div>
              <button class="p-2 text-gray-400 hover:text-white hover:bg-white/10 rounded-lg transition-colors">
                ${icons['more-horizontal']}
              </button>
            </div>
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-4">
              ${state.messages.map(message => `
                <div class="flex gap-3 ${message.sender === 'user' ? 'flex-row-reverse' : ''}">
                  <div class="w-8 h-8 rounded-lg flex-shrink-0 flex items-center justify-center ${message.sender === 'assistant' ? 'bg-gradient-to-br from-primary-500 to-purple-500 text-white' : 'bg-white/10 text-white'}">
                    ${message.sender === 'assistant' ? icons.bot : icons.user}
                  </div>
                  <div class="max-w-[75%] ${message.sender === 'user' ? 'items-end' : 'items-start'}">
                    <div class="px-4 py-3 rounded-2xl ${message.sender === 'assistant' ? 'bg-white/10 text-white rounded-bl-md' : 'bg-primary-500 text-white rounded-br-md'}">
                      <p class="text-sm leading-relaxed">${message.content}</p>
                    </div>
                    <div class="text-xs text-gray-500 mt-1 ${message.sender === 'user' ? 'text-right' : ''}">
                      ${new Date(message.timestamp).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}
                    </div>
                  </div>
                </div>
              `).join('')}
              ${state.isAssistantSpeaking ? `
                <div class="flex gap-3">
                  <div class="w-8 h-8 rounded-lg flex-shrink-0 flex items-center justify-center bg-gradient-to-br from-primary-500 to-purple-500 text-white">
                    ${icons.bot}
                  </div>
                  <div class="px-4 py-3 rounded-2xl bg-white/10 rounded-bl-md">
                    <div class="flex gap-1">
                      <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0ms"></span>
                      <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 150ms"></span>
                      <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 300ms"></span>
                    </div>
                  </div>
                </div>
              ` : ''}
            </div>
            <div class="px-4 py-2 border-t border-white/10">
              <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                <button onclick="sendMessage('今天天气怎么样')" class="flex-shrink-0 px-3 py-1.5 bg-white/5 hover:bg-white/10 rounded-full text-sm text-gray-300 transition-colors flex items-center gap-1.5">
                  <span>☀️</span>
                  <span>今天天气</span>
                </button>
                <button onclick="sendMessage('热点新闻')" class="flex-shrink-0 px-3 py-1.5 bg-white/5 hover:bg-white/10 rounded-full text-sm text-gray-300 transition-colors flex items-center gap-1.5">
                  <span>🔥</span>
                  <span>热点新闻</span>
                </button>
                <button onclick="sendMessage('播放音乐')" class="flex-shrink-0 px-3 py-1.5 bg-white/5 hover:bg-white/10 rounded-full text-sm text-gray-300 transition-colors flex items-center gap-1.5">
                  <span>🎵</span>
                  <span>播放音乐</span>
                </button>
                <button onclick="sendMessage('睡眠模式')" class="flex-shrink-0 px-3 py-1.5 bg-white/5 hover:bg-white/10 rounded-full text-sm text-gray-300 transition-colors flex items-center gap-1.5">
                  <span>🌙</span>
                  <span>睡眠模式</span>
                </button>
              </div>
            </div>
            <div class="p-4 border-t border-white/10">
              <div class="flex items-end gap-3">
                <button onclick="toggleVoiceListening()" class="p-3 rounded-xl transition-all ${state.isVoiceListening ? 'bg-red-500 text-white animate-pulse' : 'bg-white/10 text-gray-400 hover:text-white hover:bg-white/20'}">
                  ${state.isVoiceListening ? icons['mic-off'] : icons.mic}
                </button>
                <div class="flex-1 relative">
                  <textarea id="message-input" value="${inputValue}" oninput="inputValue = this.value" onkeydown="handleKeyPress(event)" placeholder="说点什么..." rows="1" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:border-primary-500 transition-colors resize-none max-h-24"></textarea>
                </div>
                <button onclick="handleSend()" class="p-3 bg-primary-500 hover:bg-primary-600 rounded-xl text-white transition-colors">
                  ${icons.send}
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // 渲染底部导航
    function renderBottomNav() {
      const tabs = [
        { id: 'home', icon: 'home', label: '首页' },
        { id: 'devices', icon: 'layout-grid', label: '设备' },
        { id: 'assistant', icon: 'message-circle', label: '助手' },
      ];
      
      return `
        <div class="fixed bottom-0 left-0 right-0 bg-gray-900/80 backdrop-blur-xl border-t border-white/10">
          <div class="max-w-lg mx-auto px-4">
            <div class="flex items-center justify-around py-3">
              ${tabs.map(tab => `
                <button onclick="switchTab('${tab.id}')" class="flex flex-col items-center gap-1 px-4 py-1 rounded-xl transition-all ${state.activeTab === tab.id ? 'text-primary-400' : 'text-gray-500 hover:text-gray-300'}">
                  <div class="${state.activeTab === tab.id ? 'scale-110' : ''} transition-transform">
                    ${icons[tab.icon]}
                  </div>
                  <span class="text-xs font-medium">${tab.label}</span>
                </button>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // 渲染语音界面
    function renderVoiceOverlay() {
      return `
        <div class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50">
          <div class="bg-gray-900 rounded-3xl p-8 max-w-sm w-full mx-4 text-center">
            <div class="relative w-24 h-24 mx-auto mb-6">
              <div class="absolute inset-0 bg-red-500/20 rounded-full animate-ping"></div>
              <div class="absolute inset-2 bg-red-500/30 rounded-full animate-pulse"></div>
              <div class="relative w-full h-full bg-gradient-to-br from-red-500 to-pink-500 rounded-full flex items-center justify-center text-white">
                ${icons.mic}
              </div>
            </div>
            <h4 class="text-white text-xl font-semibold mb-2">正在聆听...</h4>
            <p class="text-gray-400 mb-6">请说出您的指令</p>
            <div class="flex justify-center gap-2 mb-6">
              ${[...Array(5)].map((_, i) => `<div class="w-1 bg-primary-500 rounded-full animate-pulse" style="height: ${20 + Math.random() * 30}px; animation-delay: ${i * 100}ms"></div>`).join('')}
            </div>
            <button onclick="toggleVoiceListening()" class="px-8 py-3 bg-white/10 hover:bg-white/20 rounded-full text-white transition-colors">
              取消
            </button>
          </div>
        </div>
      `;
    }

    // 切换标签
    function switchTab(tabId) {
      state.activeTab = tabId;
      render();
      window.scrollTo(0, 0);
    }

    // 设置当前房间
    function setCurrentRoom(room) {
      state.currentRoom = room;
      render();
    }

    // 切换语音监听
    function toggleVoiceListening() {
      state.isVoiceListening = !state.isVoiceListening;
      render();
      
      if (state.isVoiceListening) {
        setTimeout(() => {
          state.isVoiceListening = false;
          const voiceMessages = ['播放音乐', '今天天气怎么样', '看看有什么热点新闻', '开启休闲模式'];
          const randomMsg = voiceMessages[Math.floor(Math.random() * voiceMessages.length)];
          sendMessage(randomMsg, 'voice');
        }, 3000);
      }
    }

    // 处理发送
    function handleSend() {
      if (!inputValue.trim()) return;
      sendMessage(inputValue.trim());
      inputValue = '';
      render();
    }

    // 处理按键
    function handleKeyPress(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    }

    // 切换收藏
    function toggleLiked() {
      isLiked = !isLiked;
      render();
    }

    // 切换随机播放
    function toggleShuffle() {
      isShuffle = !isShuffle;
      render();
    }

    // 切换循环
    function toggleRepeat() {
      isRepeat = !isRepeat;
      render();
    }

    // 切换静音
    function toggleVolumeMute() {
      if (state.musicDevice.volume === 0) {
        state.musicDevice.volume = 60;
      } else {
        state.musicDevice.volume = 0;
      }
      render();
    }

    // 上一首
    function playPrev() {
      const currentIndex = state.musicDevice.playlist.findIndex(s => s.id === state.musicDevice.currentSong.id);
      const prevIndex = currentIndex > 0 ? currentIndex - 1 : state.musicDevice.playlist.length - 1;
      playMusic(state.musicDevice.playlist[prevIndex].id);
    }

    // 下一首
    function playNext() {
      const currentIndex = state.musicDevice.playlist.findIndex(s => s.id === state.musicDevice.currentSong.id);
      const nextIndex = currentIndex < state.musicDevice.playlist.length - 1 ? currentIndex + 1 : 0;
      playMusic(state.musicDevice.playlist[nextIndex].id);
    }

    // 附加事件监听器
    function attachEventListeners() {
      // 滚动到底部
      const messagesContainer = document.getElementById('messages-container');
      if (messagesContainer) {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }
    }

    // 初始化
    render();
  </script>
</body>
</html>
