<html lang="zh-CN"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>摸鱼大作战 - 打工人三消</title>

  <style>
    /* === Font faces === */
    @font-face {
      font-family: 'InstrumentSans';
      src: url('./_shared/fonts/InstrumentSans-Regular.ttf') format('truetype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'InstrumentSans';
      src: url('./_shared/fonts/InstrumentSans-Bold.ttf') format('truetype');
      font-weight: 700;
    }
    @font-face {
      font-family: 'SmoochSans';
      src: url('./_shared/fonts/SmoochSans-Medium.ttf') format('truetype');
      font-weight: 500;
    }

    /* === Theme CSS variables === */
    :root {
      --bg: #1a1a2e;
      --bg2: #16213e;
      --bg3: #0f3460;
      --ink: #ffffff;
      --muted: #a0a0b0;
      --rule: #2a2a4a;
      --accent: #e94560;
      --accent2: #f9a826;
      --accent3: #00d9ff;
      --font: 'InstrumentSans', sans-serif;
      --font-display: 'SmoochSans', sans-serif;
      --max: 420px;
    }

    /* === Base styles === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* === Game Container === */
    .game-container {
      max-width: var(--max);
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* === Start Screen === */
    .start-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 300;
      text-align: center;
      padding: 40px 20px;
    }
    .start-screen.hidden {
      display: none;
    }
    .start-bg {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('assets/title-bg.jpg') center/cover no-repeat;
      opacity: 0.3;
    }
    .start-content {
      position: relative;
      z-index: 1;
    }
    .start-icon {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(233, 69, 96, 0.3);
    }
    .start-logo {
      font-family: var(--font-display);
      font-size: 3rem;
      color: var(--accent);
      margin-bottom: 8px;
      letter-spacing: 4px;
      text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
    }
    .start-subtitle {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 40px;
    }
    .start-btn {
      padding: 16px 48px;
      font-size: 1.2rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 16px;
      font-family: var(--font);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(233, 69, 96, 0.4);
    }
    .start-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(233, 69, 96, 0.6);
    }
    .start-tip {
      color: var(--muted);
      font-size: 0.8rem;
    }
    .start-features {
      display: flex;
      gap: 16px;
      margin-top: 32px;
      justify-content: center;
    }
    .feature-tag {
      background: var(--bg2);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      color: var(--accent2);
      border: 1px solid var(--rule);
    }

    /* === Header === */
    .game-header {
      background: var(--bg2);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--rule);
    }
    .game-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--accent);
      letter-spacing: 2px;
    }
    .game-stats {
      display: flex;
      gap: 16px;
      font-size: 0.85rem;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .stat-label {
      color: var(--muted);
      font-size: 0.7rem;
    }
    .stat-value {
      color: var(--accent2);
      font-weight: 700;
      font-size: 1.1rem;
    }

    /* === Level Info === */
    .level-info {
      background: var(--bg3);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }
    .level-scene {
      color: var(--accent3);
      font-weight: 600;
    }
    .level-target {
      color: var(--muted);
    }
    .moves-left {
      color: var(--accent2);
      font-weight: 700;
    }
    .moves-left.warning {
      color: var(--accent);
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* === Progress Bar === */
    .progress-bar {
      height: 4px;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.5s ease;
      border-radius: 0 2px 2px 0;
    }

    /* === Game Board === */
    .board-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      background: var(--bg);
    }
    .game-board {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1;
    }
    .cell {
      aspect-ratio: 1;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.6rem;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
      background: var(--bg2);
      border: 1px solid var(--rule);
      user-select: none;
      position: relative;
      overflow: hidden;
    }
    .cell::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.1) 0%, transparent 50%);
      pointer-events: none;
    }
    .cell:hover {
      transform: scale(1.08);
      z-index: 2;
    }
    .cell.selected {
      background: var(--accent);
      transform: scale(1.12);
      box-shadow: 0 0 20px rgba(233, 69, 96, 0.6);
      border-color: var(--accent);
      z-index: 3;
    }
    .cell.matched {
      animation: matchPop 0.5s ease-out forwards;
    }
    .cell.special-match {
      animation: specialPop 0.6s ease-out forwards;
    }
    .cell.falling {
      animation: fallDown 0.4s ease-in;
    }
    .cell.boss-warning {
      animation: bossShake 0.5s ease-in-out;
      border-color: var(--accent);
    }

    @keyframes matchPop {
      0% { transform: scale(1); opacity: 1; }
      30% { transform: scale(1.4); opacity: 0.8; }
      60% { transform: scale(0.8); opacity: 0.4; }
      100% { transform: scale(0); opacity: 0; }
    }
    @keyframes specialPop {
      0% { transform: scale(1) rotate(0deg); opacity: 1; }
      25% { transform: scale(1.5) rotate(10deg); opacity: 0.9; }
      50% { transform: scale(1.2) rotate(-10deg); opacity: 0.7; }
      75% { transform: scale(0.8) rotate(5deg); opacity: 0.3; }
      100% { transform: scale(0) rotate(0deg); opacity: 0; }
    }
    @keyframes fallDown {
      0% { transform: translateY(-60px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    @keyframes bossShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-5px) rotate(-2deg); }
      40% { transform: translateX(5px) rotate(2deg); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }

    /* === Power-ups Bar === */
    .powerups-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 12px;
      background: var(--bg2);
      border-top: 1px solid var(--rule);
    }
    .powerup-btn {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: var(--bg3);
      border: 2px solid var(--rule);
      color: var(--ink);
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s;
      position: relative;
    }
    .powerup-btn:hover {
      border-color: var(--accent);
      transform: scale(1.1);
      box-shadow: 0 0 12px rgba(233, 69, 96, 0.3);
    }
    .powerup-btn .count {
      position: absolute;
      bottom: -6px;
      right: -6px;
      background: var(--accent);
      color: white;
      font-size: 0.65rem;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 700;
      border: 2px solid var(--bg2);
    }
    .powerup-btn .label {
      position: absolute;
      bottom: -20px;
      font-size: 0.6rem;
      color: var(--muted);
      white-space: nowrap;
    }

    /* === Quote Overlay (Level Complete) === */
    .quote-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }
    .quote-overlay.active {
      display: flex;
    }
    .quote-card {
      background: var(--bg2);
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      border: 2px solid var(--accent);
      animation: slideUp 0.5s ease-out;
      position: relative;
      overflow: hidden;
    }
    .quote-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(233, 69, 96, 0.1) 0%, transparent 70%);
      animation: shimmer 4s infinite linear;
    }
    @keyframes shimmer {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes slideUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .quote-badge {
      display: inline-block;
      background: var(--accent);
      color: white;
      padding: 4px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }
    .quote-icon {
      font-size: 3rem;
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }
    .quote-text {
      font-size: 1.25rem;
      color: var(--ink);
      margin-bottom: 12px;
      line-height: 1.6;
      font-weight: 600;
      position: relative;
      z-index: 1;
    }
    .quote-author {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }
    .quote-rarity {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 10px;
      font-size: 0.7rem;
      font-weight: 700;
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
    }
    .rarity-common { background: #6c757d; color: white; }
    .rarity-rare { background: var(--accent3); color: var(--bg); }
    .rarity-legendary { background: linear-gradient(90deg, var(--accent), var(--accent2)); color: white; }
    .quote-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    /* === Share Modal === */
    .share-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.92);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 20px;
    }
    .share-modal.active {
      display: flex;
    }
    .share-content {
      background: var(--bg2);
      border-radius: 24px;
      padding: 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }
    .poster-preview {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      border-radius: 20px;
      padding: 40px 28px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }
    .poster-preview::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);
      animation: shimmer 3s infinite linear;
    }
    .poster-quote {
      font-size: 1.2rem;
      font-weight: 700;
      color: white;
      margin-bottom: 20px;
      line-height: 1.5;
      position: relative;
      z-index: 1;
    }
    .poster-stats {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }
    .poster-stat {
      text-align: center;
    }
    .poster-stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent2);
    }
    .poster-stat-label {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.7);
    }
    .poster-level {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.9);
      position: relative;
      z-index: 1;
    }
    .poster-logo {
      margin-top: 20px;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.6);
      position: relative;
      z-index: 1;
    }
    .share-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .share-btn {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-family: var(--font);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .share-wechat {
      background: #07c160;
      color: white;
    }
    .share-wechat:hover {
      background: #06ad56;
      transform: scale(1.02);
    }
    .share-copy {
      background: var(--bg3);
      color: var(--ink);
      border: 1px solid var(--rule);
    }
    .share-copy:hover {
      border-color: var(--accent3);
    }

    /* === Buttons === */
    .btn {
      padding: 12px 24px;
      border-radius: 14px;
      border: none;
      font-family: var(--font);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover {
      background: #ff6b7a;
      transform: scale(1.05);
    }
    .btn-secondary {
      background: var(--bg3);
      color: var(--ink);
      border: 1px solid var(--rule);
    }
    .btn-secondary:hover {
      border-color: var(--accent3);
      background: var(--bg2);
    }

    /* === Combo Animation === */
    .combo-text {
      position: absolute;
      font-family: var(--font-display);
      font-size: 1.6rem;
      color: var(--accent2);
      font-weight: 700;
      pointer-events: none;
      animation: comboFloat 1.2s ease-out forwards;
      z-index: 50;
      text-shadow: 0 0 10px rgba(249, 168, 38, 0.5);
    }
    @keyframes comboFloat {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      30% { transform: translateY(-30px) scale(1.2); opacity: 1; }
      100% { transform: translateY(-80px) scale(1.5); opacity: 0; }
    }

    /* === Score Popup === */
    .score-popup {
      position: absolute;
      font-family: var(--font-display);
      font-size: 1.2rem;
      color: var(--accent2);
      font-weight: 700;
      pointer-events: none;
      animation: scoreFloat 1s ease-out forwards;
      z-index: 50;
    }
    @keyframes scoreFloat {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-40px); opacity: 0; }
    }

    /* === Toast === */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg3);
      color: var(--ink);
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 0.9rem;
      z-index: 400;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      border: 1px solid var(--rule);
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .toast.show {
      opacity: 1;
    }

    /* === Game Over Screen === */
    .game-over-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }
    .game-over-overlay.active {
      display: flex;
    }
    .game-over-card {
      background: var(--bg2);
      border-radius: 24px;
      padding: 40px 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      border: 2px solid var(--accent);
    }
    .game-over-icon {
      font-size: 4rem;
      margin-bottom: 16px;
    }
    .game-over-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .game-over-subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .game-over-stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 24px;
    }
    .game-over-stat {
      text-align: center;
    }
    .game-over-stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent2);
    }
    .game-over-stat-label {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .game-over-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    /* === Office Decoration === */
    .office-decoration {
      position: absolute;
      font-size: 1.2rem;
      opacity: 0.15;
      pointer-events: none;
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
    }

    /* === Responsive === */
    @media (max-width: 400px) {
      .game-board {
        gap: 3px;
      }
      .cell {
        font-size: 1.3rem;
        border-radius: 8px;
      }
      .game-title {
        font-size: 1.2rem;
      }
      .start-logo {
        font-size: 2.2rem;
      }
    }

    /* === Particle Effects === */
    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      pointer-events: none;
      animation: particleBurst 0.8s ease-out forwards;
      z-index: 100;
    }
    @keyframes particleBurst {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

    /* === Scene Indicator === */
    .scene-indicator {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg2);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.75rem;
      color: var(--accent3);
      border: 1px solid var(--rule);
      z-index: 50;
      opacity: 0;
      transition: opacity 0.5s;
      pointer-events: none;
    }
    .scene-indicator.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <!-- Start Screen -->
  <div class="start-screen" id="startScreen">
    <div class="start-bg"></div>
    <div class="start-content">
      <img src="./摸鱼大作战 - 打工人三消_files/game-icon.jpg" alt="游戏图标" class="start-icon">
      <div class="start-logo">摸鱼大作战</div>
      <div class="start-subtitle">打工人专属三消游戏</div>
      <button class="start-btn" onclick="startGame()">开始摸鱼</button>
      <div class="start-tip">通勤路上 · 午休时间 · 随时可玩</div>
      <div class="start-features">
        <span class="feature-tag">🎯 三消玩法</span>
        <span class="feature-tag">💬 语录收集</span>
        <span class="feature-tag">📱 单手操作</span>
      </div>
    </div>
  </div>

  <!-- Game Container -->
  <div class="game-container" id="gameContainer" style="display:none;">
    <!-- Header -->
    <div class="game-header">
      <div class="game-title">摸鱼大作战</div>
      <div class="game-stats">
        <div class="stat-item">
          <span class="stat-label">分数</span>
          <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">关卡</span>
          <span class="stat-value" id="level">1</span>
        </div>
      </div>
    </div>

    <!-- Level Info -->
    <div class="level-info">
      <div>
        <span class="level-scene" id="sceneName">周一晨会</span>
        <span class="level-target"> 目标: <span id="target">1000</span>分</span>
      </div>
      <div class="moves-left" id="movesContainer">
        剩余步数: <span id="moves">20</span>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>

    <!-- Scene Indicator -->
    <div class="scene-indicator" id="sceneIndicator"></div>

    <!-- Game Board -->
    <div class="board-container">
      <div class="game-board" id="gameBoard"></div>
    </div>

    <!-- Power-ups -->
    <div class="powerups-bar">
      <div class="powerup-btn" onclick="usePowerup(&#39;hammer&#39;)" title="摸鱼神手">
        🔨
        <span class="count" id="hammerCount">3</span>
        <span class="label">摸鱼手</span>
      </div>
      <div class="powerup-btn" onclick="usePowerup(&#39;shuffle&#39;)" title="重新洗牌">
        🔄
        <span class="count" id="shuffleCount">2</span>
        <span class="label">洗牌</span>
      </div>
      <div class="powerup-btn" onclick="usePowerup(&#39;bomb&#39;)" title="老板来了">
        💣
        <span class="count" id="bombCount">1</span>
        <span class="label">老板</span>
      </div>
    </div>
  </div>

  <!-- Quote Overlay (Level Complete) -->
  <div class="quote-overlay" id="quoteOverlay">
    <div class="quote-card">
      <div class="quote-badge" id="quoteBadge">通关奖励</div>
      <div class="quote-icon">🎉</div>
      <div class="quote-text" id="quoteText">"随薪所欲，薪尽自然凉"</div>
      <div class="quote-author" id="quoteAuthor">—— 当代打工人</div>
      <div class="quote-rarity rarity-common" id="quoteRarity">普通语录</div>
      <div class="quote-actions">
        <button class="btn btn-primary" onclick="showShareModal()">生成海报</button>
        <button class="btn btn-secondary" onclick="nextLevel()">下一关</button>
      </div>
    </div>
  </div>

  <!-- Game Over Overlay -->
  <div class="game-over-overlay" id="gameOverOverlay">
    <div class="game-over-card">
      <div class="game-over-icon">😵</div>
      <div class="game-over-title">这班非上不可吗</div>
      <div class="game-over-subtitle">步数用完了，但摸鱼精神永存</div>
      <div class="game-over-stats">
        <div class="game-over-stat">
          <div class="game-over-stat-value" id="finalScore">0</div>
          <div class="game-over-stat-label">最终得分</div>
        </div>
        <div class="game-over-stat">
          <div class="game-over-stat-value" id="finalLevel">1</div>
          <div class="game-over-stat-label">到达关卡</div>
        </div>
      </div>
      <div class="game-over-actions">
        <button class="btn btn-primary" onclick="showShareModal()">生成海报</button>
        <button class="btn btn-secondary" onclick="restartGame()">重新开始</button>
      </div>
    </div>
  </div>

  <!-- Share Modal -->
  <div class="share-modal" id="shareModal">
    <div class="share-content">
      <div class="poster-preview" id="posterPreview">
        <div class="poster-quote" id="posterQuote">"随薪所欲，薪尽自然凉"</div>
        <div class="poster-stats">
          <div class="poster-stat">
            <div class="poster-stat-value" id="posterScore">0</div>
            <div class="poster-stat-label">得分</div>
          </div>
          <div class="poster-stat">
            <div class="poster-stat-value" id="posterLevel">1</div>
            <div class="poster-stat-label">关卡</div>
          </div>
        </div>
        <div class="poster-level" id="posterLevelText">第 1 关通关</div>
        <div class="poster-logo">摸鱼大作战 · 打工人专属</div>
      </div>
      <div class="share-buttons">
        <button class="share-btn share-wechat" onclick="shareToWechat()">微信分享</button>
        <button class="share-btn share-copy" onclick="copyQuote()">复制语录</button>
      </div>
      <button class="btn btn-secondary" style="margin-top:16px;width:100%;" onclick="closeShareModal()">关闭</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // ===== Game Data =====
    const ITEMS = [
      { emoji: '📧', name: '邮件', color: '#4ecdc4' },
      { emoji: '📄', name: '文件', color: '#45b7d1' },
      { emoji: '💻', name: '电脑', color: '#96ceb4' },
      { emoji: '☕', name: '咖啡', color: '#d4a574' },
      { emoji: '📊', name: '报表', color: '#f9ca24' },
      { emoji: '📅', name: '日历', color: '#6c5ce7' },
      { emoji: '💼', name: '公文包', color: '#a29bfe' }
    ];

    const SCENES = [
      { name: '周一晨会', target: 1000, moves: 20, emoji: '😴' },
      { name: '周二摸鱼', target: 1500, moves: 18, emoji: '🐟' },
      { name: '周三崩溃', target: 2000, moves: 16, emoji: '😫' },
      { name: '周四摆烂', target: 2500, moves: 15, emoji: '🛋️' },
      { name: '周五狂欢', target: 3000, moves: 14, emoji: '🎉' },
      { name: '月底冲KPI', target: 4000, moves: 12, emoji: '📈' },
      { name: '年终述职', target: 5000, moves: 10, emoji: '📊' },
      { name: '加班地狱', target: 6000, moves: 8, emoji: '🔥' }
    ];

    const QUOTES = [
      { text: "随薪所欲，薪尽自然凉", author: "当代打工人", rarity: 'common' },
      { text: "你摆烂，我摆烂，老板鱼翅变炒饭", author: "职场哲学家", rarity: 'common' },
      { text: "天下没有免费的午餐，但有免费的加班", author: "加班达人", rarity: 'common' },
      { text: "小时候兴趣班上多了，现在完全没兴趣上班", author: "回忆型选手", rarity: 'rare' },
      { text: "大家好我是第57个民族，上班族", author: "民族学家", rarity: 'rare' },
      { text: "打工很累我也不能哭，因为骑电动车擦眼泪不安全", author: "安全员", rarity: 'rare' },
      { text: "别人在外面搂搂抱抱，我在公司好的收到", author: "回复机器", rarity: 'common' },
      { text: "我的生活很好，随薪所欲，薪尽自然凉", author: "佛系青年", rarity: 'common' },
      { text: "喜欢上班的N个理由：工资像中彩票、地位像盆栽、快乐像WiFi", author: "乐观主义者", rarity: 'rare' },
      { text: "周六睡一天，周日焦虑一天，周一：这班非上不可吗", author: "周末战士", rarity: 'rare' },
      { text: "公司生存法则：会干的不如会说的，会说的不如会装的", author: "职场老油条", rarity: 'legendary' },
      { text: "专注力训练：看5分钟工作，刷2小时手机", author: "时间管理大师", rarity: 'rare' },
      { text: "今日KPI：活着", author: "极简主义者", rarity: 'common' },
      { text: "上班就像旧时代的婚姻，明明不幸福还得长相厮守", author: "婚姻顾问", rarity: 'legendary' },
      { text: "工资三千八，每天笑哈哈", author: "快乐打工人", rarity: 'common' }
    ];

    // ===== Game State =====
    let board = [];
    let score = 0;
    let level = 1;
    let moves = 20;
    let target = 1000;
    let selectedCell = null;
    let isProcessing = false;
    let powerups = { hammer: 3, shuffle: 2, bomb: 1 };
    let currentQuote = null;
    let totalScore = 0;

    const ROWS = 7;
    const COLS = 7;

    // ===== Initialization =====
    function startGame() {
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameContainer').style.display = 'flex';
      initGame();
    }

    function initGame() {
      const scene = SCENES[(level - 1) % SCENES.length];
      score = 0;
      moves = scene.moves;
      target = scene.target;
      
      document.getElementById('sceneName').textContent = scene.emoji + ' ' + scene.name;
      showSceneIndicator(scene.emoji + ' 进入场景：' + scene.name);
      
      updateUI();
      createBoard();
      renderBoard();
      updateProgress();
    }

    function createBoard() {
      board = [];
      for (let r = 0; r < ROWS; r++) {
        board[r] = [];
        for (let c = 0; c < COLS; c++) {
          board[r][c] = getRandomItem();
        }
      }
      // Remove initial matches
      while (findMatches().length > 0) {
        const matches = findMatches();
        matches.forEach(({ row, col }) => {
          board[row][col] = -1;
        });
        dropDown();
        fillBoard();
      }
    }

    function getRandomItem() {
      return Math.floor(Math.random() * ITEMS.length);
    }

    // ===== Rendering =====
    function renderBoard() {
      const boardEl = document.getElementById('gameBoard');
      boardEl.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.row = r;
          cell.dataset.col = c;
          cell.textContent = ITEMS[board[r][c]].emoji;
          cell.style.background = ITEMS[board[r][c]].color + '18';
          cell.style.borderColor = ITEMS[board[r][c]].color + '30';
          cell.addEventListener('click', () => onCellClick(r, c));
          boardEl.appendChild(cell);
        }
      }
    }

    function updateUI() {
      document.getElementById('score').textContent = score;
      document.getElementById('level').textContent = level;
      document.getElementById('moves').textContent = moves;
      document.getElementById('target').textContent = target;
      document.getElementById('hammerCount').textContent = powerups.hammer;
      document.getElementById('shuffleCount').textContent = powerups.shuffle;
      document.getElementById('bombCount').textContent = powerups.bomb;
      
      // Warning for low moves
      const movesContainer = document.getElementById('movesContainer');
      if (moves <= 3) {
        movesContainer.classList.add('warning');
      } else {
        movesContainer.classList.remove('warning');
      }
    }

    function updateProgress() {
      const percent = Math.min((score / target) * 100, 100);
      document.getElementById('progressFill').style.width = percent + '%';
    }

    function showSceneIndicator(text) {
      const indicator = document.getElementById('sceneIndicator');
      indicator.textContent = text;
      indicator.classList.add('show');
      setTimeout(() => indicator.classList.remove('show'), 2500);
    }

    // ===== Game Logic =====
    function onCellClick(row, col) {
      if (isProcessing || moves <= 0) return;

      // Handle powerup modes
      if (selectedCell === 'hammer') {
        useHammer(row, col);
        return;
      }
      if (selectedCell === 'bomb') {
        useBomb(row, col);
        return;
      }

      const cellEl = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);

      if (selectedCell && typeof selectedCell === 'object') {
        const { row: sr, col: sc } = selectedCell;
        if (sr === row && sc === col) {
          document.querySelector(`[data-row="${sr}"][data-col="${sc}"]`).classList.remove('selected');
          selectedCell = null;
          return;
        }

        if (isAdjacent(sr, sc, row, col)) {
          swapCells(sr, sc, row, col);
          document.querySelector(`[data-row="${sr}"][data-col="${sc}"]`).classList.remove('selected');
          selectedCell = null;
        } else {
          document.querySelector(`[data-row="${sr}"][data-col="${sc}"]`).classList.remove('selected');
          cellEl.classList.add('selected');
          selectedCell = { row, col };
        }
      } else {
        cellEl.classList.add('selected');
        selectedCell = { row, col };
      }
    }

    function isAdjacent(r1, c1, r2, c2) {
      return Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1;
    }

    async function swapCells(r1, c1, r2, c2) {
      isProcessing = true;

      const temp = board[r1][c1];
      board[r1][c1] = board[r2][c2];
      board[r2][c2] = temp;

      const matches = findMatches();

      if (matches.length === 0) {
        board[r2][c2] = board[r1][c1];
        board[r1][c1] = temp;
        showToast('无法消除，再想想！');
        isProcessing = false;
        return;
      }

      moves--;
      renderBoard();
      await processMatches();
      updateUI();
      updateProgress();

      if (score >= target) {
        setTimeout(() => {
          showQuote();
          isProcessing = false;
        }, 500);
      } else if (moves <= 0) {
        setTimeout(() => {
          showGameOver();
          isProcessing = false;
        }, 500);
      } else {
        isProcessing = false;
      }
    }

    function findMatches() {
      const matches = [];
      const visited = new Set();

      // Horizontal
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS - 2; c++) {
          const type = board[r][c];
          if (type === -1) continue;
          let count = 1;
          while (c + count < COLS && board[r][c + count] === type) count++;
          if (count >= 3) {
            for (let i = 0; i < count; i++) {
              const key = `${r},${c + i}`;
              if (!visited.has(key)) {
                visited.add(key);
                matches.push({ row: r, col: c + i, type: count >= 4 ? 'special' : 'normal' });
              }
            }
          }
        }
      }

      // Vertical
      for (let c = 0; c < COLS; c++) {
        for (let r = 0; r < ROWS - 2; r++) {
          const type = board[r][c];
          if (type === -1) continue;
          let count = 1;
          while (r + count < ROWS && board[r + count][c] === type) count++;
          if (count >= 3) {
            for (let i = 0; i < count; i++) {
              const key = `${r + i},${c}`;
              if (!visited.has(key)) {
                visited.add(key);
                matches.push({ row: r + i, col: c, type: count >= 4 ? 'special' : 'normal' });
              }
            }
          }
        }
      }

      return matches;
    }

    async function processMatches() {
      let combo = 0;
      while (true) {
        const matches = findMatches();
        if (matches.length === 0) break;

        combo++;
        const basePoints = matches.length * 10;
        const comboMultiplier = Math.min(combo, 5);
        const points = basePoints * comboMultiplier;
        score += points;
        totalScore += points;

        if (combo > 1) {
          showComboText(combo);
        }

        // Show score popup
        const centerMatch = matches[Math.floor(matches.length / 2)];
        showScorePopup(centerMatch.row, centerMatch.col, '+' + points);

        // Create particles
        matches.forEach(({ row, col, type }) => {
          const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
          if (cell) {
            cell.classList.add(type === 'special' ? 'special-match' : 'matched');
            createParticles(cell, ITEMS[board[row][col]].color);
          }
        });

        await sleep(500);

        matches.forEach(({ row, col }) => {
          board[row][col] = -1;
        });

        dropDown();
        fillBoard();

        renderBoard();
        await sleep(350);
      }
    }

    function dropDown() {
      for (let c = 0; c < COLS; c++) {
        let writeRow = ROWS - 1;
        for (let r = ROWS - 1; r >= 0; r--) {
          if (board[r][c] !== -1) {
            board[writeRow][c] = board[r][c];
            if (writeRow !== r) board[r][c] = -1;
            writeRow--;
          }
        }
      }
    }

    function fillBoard() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c] === -1) {
            board[r][c] = getRandomItem();
          }
        }
      }
    }

    // ===== Power-ups =====
    function usePowerup(type) {
      if (powerups[type] <= 0 || isProcessing) {
        showToast('道具不足！');
        return;
      }

      if (type === 'shuffle') {
        powerups.shuffle--;
        shuffleBoard();
        updateUI();
        showToast('已重新洗牌！');
      } else if (type === 'hammer') {
        if (selectedCell === 'hammer') {
          selectedCell = null;
          showToast('取消选择');
        } else {
          selectedCell = 'hammer';
          showToast('点击要消除的方块');
        }
      } else if (type === 'bomb') {
        if (selectedCell === 'bomb') {
          selectedCell = null;
          showToast('取消选择');
        } else {
          selectedCell = 'bomb';
          showToast('点击要引爆的位置');
        }
      }
    }

    function useHammer(row, col) {
      isProcessing = true;
      powerups.hammer--;
      selectedCell = null;
      updateUI();
      board[row][col] = -1;
      dropDown();
      fillBoard();
      renderBoard();
      showToast('已消除！');
      
      // Check for matches after hammer
      setTimeout(async () => {
        await processMatches();
        updateUI();
        updateProgress();
        if (score >= target) {
          setTimeout(() => {
            showQuote();
            isProcessing = false;
          }, 500);
        } else if (moves <= 0) {
          setTimeout(() => {
            showGameOver();
            isProcessing = false;
          }, 500);
        } else {
          isProcessing = false;
        }
      }, 400);
    }

    function useBomb(row, col) {
      isProcessing = true;
      powerups.bomb--;
      selectedCell = null;
      updateUI();
      
      // Create explosion effect
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = row + dr;
          const nc = col + dc;
          if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
            board[nr][nc] = -1;
          }
        }
      }
      
      dropDown();
      fillBoard();
      renderBoard();
      showToast('💥 炸弹引爆！');
      
      setTimeout(async () => {
        await processMatches();
        updateUI();
        updateProgress();
        if (score >= target) {
          setTimeout(() => {
            showQuote();
            isProcessing = false;
          }, 500);
        } else if (moves <= 0) {
          setTimeout(() => {
            showGameOver();
            isProcessing = false;
          }, 500);
        } else {
          isProcessing = false;
        }
      }, 400);
    }

    function shuffleBoard() {
      const items = [];
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          items.push(board[r][c]);
        }
      }
      for (let i = items.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
      }
      let idx = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          board[r][c] = items[idx++];
        }
      }
      renderBoard();
    }

    // ===== Quote System =====
    function showQuote() {
      const quote = QUOTES[Math.floor(Math.random() * QUOTES.length)];
      currentQuote = quote;
      
      document.getElementById('quoteText').textContent = '"' + quote.text + '"';
      document.getElementById('quoteAuthor').textContent = '—— ' + quote.author;
      
      const rarityEl = document.getElementById('quoteRarity');
      rarityEl.className = 'quote-rarity rarity-' + quote.rarity;
      rarityEl.textContent = quote.rarity === 'legendary' ? '🔥 传说语录' : 
                             quote.rarity === 'rare' ? '✨ 稀有语录' : '📝 普通语录';
      
      document.getElementById('quoteOverlay').classList.add('active');
    }

    function showGameOver() {
      document.getElementById('finalScore').textContent = totalScore;
      document.getElementById('finalLevel').textContent = level;
      document.getElementById('gameOverOverlay').classList.add('active');
    }

    function nextLevel() {
      level++;
      document.getElementById('quoteOverlay').classList.remove('active');
      initGame();
    }

    function restartGame() {
      level = 1;
      totalScore = 0;
      powerups = { hammer: 3, shuffle: 2, bomb: 1 };
      document.getElementById('gameOverOverlay').classList.remove('active');
      document.getElementById('quoteOverlay').classList.remove('active');
      initGame();
    }

    // ===== Share System =====
    function showShareModal() {
      document.getElementById('quoteOverlay').classList.remove('active');
      document.getElementById('gameOverOverlay').classList.remove('active');
      
      document.getElementById('posterQuote').textContent = '"' + currentQuote.text + '"';
      document.getElementById('posterScore').textContent = totalScore;
      document.getElementById('posterLevel').textContent = level;
      document.getElementById('posterLevelText').textContent = '第 ' + level + ' 关 · ' + SCENES[(level - 1) % SCENES.length].name;
      
      document.getElementById('shareModal').classList.add('active');
    }

    function closeShareModal() {
      document.getElementById('shareModal').classList.remove('active');
    }

    function shareToWechat() {
      showToast('请截图分享到朋友圈！');
    }

    function copyQuote() {
      const text = currentQuote.text + ' —— ' + currentQuote.author + ' 【摸鱼大作战】';
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
          showToast('语录已复制！');
        }).catch(() => {
          showToast('请手动复制语录');
        });
      } else {
        showToast('请手动复制语录');
      }
    }

    // ===== Visual Effects =====
    function createParticles(element, color) {
      const rect = element.getBoundingClientRect();
      const boardRect = document.getElementById('gameBoard').getBoundingClientRect();
      
      for (let i = 0; i < 6; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.background = color;
        particle.style.left = (rect.left - boardRect.left + rect.width / 2) + 'px';
        particle.style.top = (rect.top - boardRect.top + rect.height / 2) + 'px';
        particle.style.setProperty('--tx', (Math.random() - 0.5) * 80 + 'px');
        particle.style.setProperty('--ty', (Math.random() - 0.5) * 80 + 'px');
        document.getElementById('gameBoard').appendChild(particle);
        setTimeout(() => particle.remove(), 800);
      }
    }

    function showComboText(combo) {
      const boardEl = document.getElementById('gameBoard');
      const text = document.createElement('div');
      text.className = 'combo-text';
      const labels = ['', '', '双杀！', '三连击！', '四连击！', '五连击！', '超神！'];
      text.textContent = labels[Math.min(combo, 6)] || combo + '连击！';
      text.style.left = '50%';
      text.style.top = '45%';
      text.style.transform = 'translateX(-50%)';
      boardEl.appendChild(text);
      setTimeout(() => text.remove(), 1200);
    }

    function showScorePopup(row, col, text) {
      const boardEl = document.getElementById('gameBoard');
      const popup = document.createElement('div');
      popup.className = 'score-popup';
      popup.textContent = text;
      popup.style.left = ((col + 0.5) / COLS * 100) + '%';
      popup.style.top = ((row + 0.5) / ROWS * 100) + '%';
      popup.style.transform = 'translate(-50%, -50%)';
      boardEl.appendChild(popup);
      setTimeout(() => popup.remove(), 1000);
    }

    // ===== Utilities =====
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // ===== Keyboard Support =====
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeShareModal();
      }
    });
  </script>

</body></html>
