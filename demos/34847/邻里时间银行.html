<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邻里时间银行 - 社会服务</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f0f4f0;
            min-height: 100vh;
            color: #333;
            padding-bottom: 80px;
        }

        /* ---- Header ---- */
        .header {
            background: linear-gradient(135deg, #2e7d32 0%, #43a047 40%, #66bb6a 100%);
            color: #fff;
            padding: 28px 20px 36px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .header::after {
            content: "";
            position: absolute;
            bottom: -24px; left: 0; right: 0;
            height: 48px;
            background: #f0f4f0;
            border-radius: 50% 50% 0 0;
        }
        .header h1 {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 6px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .header .subtitle {
            font-size: 14px;
            opacity: 0.92;
            font-weight: 300;
        }
        .coin-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.18);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 40px;
            padding: 10px 22px;
            margin-top: 16px;
            position: relative;
            z-index: 1;
            cursor: default;
        }
        .coin-badge .coin-icon {
            font-size: 28px;
            animation: coinPulse 2s ease-in-out infinite;
        }
        @keyframes coinPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        .coin-badge .coin-amount {
            font-size: 24px;
            font-weight: 700;
        }
        .coin-badge .coin-label {
            font-size: 12px;
            opacity: 0.85;
        }

        /* ---- Stats ---- */
        .stats-row {
            display: flex;
            gap: 10px;
            max-width: 600px;
            margin: -8px auto 0;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }
        .stat-card {
            flex: 1;
            background: #fff;
            border-radius: 14px;
            padding: 16px 12px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .stat-card .stat-num {
            font-size: 22px;
            font-weight: 700;
            color: #2e7d32;
        }
        .stat-card .stat-label {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
        }

        /* ---- Main Container ---- */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ---- Tab Switcher ---- */
        .tab-bar {
            display: flex;
            background: #fff;
            border-radius: 14px;
            padding: 5px;
            margin-top: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: transparent;
            color: #999;
            transition: all 0.25s;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #2e7d32, #43a047);
            color: #fff;
            box-shadow: 0 4px 12px rgba(46,125,50,0.3);
        }
        .tab-btn .tab-icon { margin-right: 4px; }

        /* ---- Category Chips ---- */
        .category-row {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .category-row::-webkit-scrollbar { display: none; }
        .cat-chip {
            flex-shrink: 0;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1.5px solid #e0e0e0;
            background: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .cat-chip:hover { border-color: #81c784; }
        .cat-chip.active {
            background: #e8f5e9;
            border-color: #43a047;
            color: #2e7d32;
            font-weight: 600;
        }

        /* ---- Cards ---- */
        .card-list {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .service-card {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            display: flex;
            gap: 14px;
            align-items: flex-start;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }
        .service-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        .service-card .avatar {
            width: 48px; height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a5d6a7, #66bb6a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }
        .service-card .card-body { flex: 1; min-width: 0; }
        .service-card .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .service-card .card-meta {
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
        }
        .service-card .card-desc {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .service-card .card-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .service-card .card-tags .tag {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 12px;
            background: #f0f4f0;
            color: #555;
        }
        .service-card .card-tags .tag.time-tag {
            background: #fff3e0;
            color: #e65100;
            font-weight: 600;
        }
        .service-card .card-tags .tag.urgent-tag {
            background: #ffebee;
            color: #c62828;
            font-weight: 600;
            animation: urgentBlink 1.5s ease-in-out infinite;
        }
        @keyframes urgentBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .service-card .action-btn {
            padding: 8px 18px;
            border-radius: 20px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            align-self: center;
        }
        .action-btn.help-btn {
            background: #2e7d32;
            color: #fff;
        }
        .action-btn.help-btn:hover { background: #1b5e20; }
        .action-btn.done-btn {
            background: #fff;
            color: #2e7d32;
            border: 1.5px solid #2e7d32;
        }
        .action-btn.done-btn:hover { background: #e8f5e9; }
        .status-badge {
            font-size: 11px;
            padding: 6px 12px;
            border-radius: 12px;
            font-weight: 600;
        }
        .status-badge.completed { background: #e8f5e9; color: #2e7d32; }
        .status-badge.ongoing { background: #fff3e0; color: #e65100; }
        .status-badge.open { background: #e3f2fd; color: #1565c0; }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: #aaa;
        }
        .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }

        /* ---- FAB ---- */
        .fab {
            position: fixed;
            bottom: 28px;
            right: 24px;
            width: 56px; height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2e7d32, #43a047);
            color: #fff;
            border: none;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 6px 24px rgba(46,125,50,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 10;
        }
        .fab:hover { transform: scale(1.08); box-shadow: 0 8px 30px rgba(46,125,50,0.5); }

        /* ---- Modal ---- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            animation: fadeIn 0.25s;
        }
        .modal-overlay.hidden { display: none; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal {
            background: #fff;
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 28px 24px 36px;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal h3 {
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .modal .form-group {
            margin-bottom: 16px;
        }
        .modal label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #555;
        }
        .modal input, .modal textarea, .modal select {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .modal input:focus, .modal textarea:focus, .modal select:focus {
            outline: none;
            border-color: #43a047;
        }
        .modal textarea { resize: vertical; min-height: 80px; }
        .modal .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .modal .btn-row button {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .modal .btn-cancel { background: #f5f5f5; color: #666; }
        .modal .btn-submit { background: #2e7d32; color: #fff; }
        .modal .btn-submit:hover { background: #1b5e20; }

        /* ---- Footer ---- */
        .app-footer {
            text-align: center;
            color: #bbb;
            font-size: 12px;
            padding: 24px 0 16px;
        }

        /* ---- Toast ---- */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 14px;
            z-index: 200;
            animation: toastIn 0.3s ease-out, toastOut 0.3s ease-in 1.7s forwards;
            pointer-events: none;
        }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

        @media (max-width: 400px) {
            .header h1 { font-size: 24px; }
            .service-card { flex-wrap: wrap; }
            .service-card .action-btn { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <h1>🏦 邻里时间银行</h1>
        <p class="subtitle">用时间交换温暖，让社区更有温度</p>
        <div class="coin-badge" id="coinBadge">
            <span class="coin-icon">⏳</span>
            <span class="coin-amount" id="coinAmount">12</span>
            <span class="coin-label">时间币</span>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-num" id="statMembers">386</div>
            <div class="stat-label">邻里成员</div>
        </div>
        <div class="stat-card">
            <div class="stat-num" id="statCompleted">1,052</div>
            <div class="stat-label">已帮次数</div>
        </div>
        <div class="stat-card">
            <div class="stat-num" id="statHours">3,408</div>
            <div class="stat-label">互助小时</div>
        </div>
    </div>

    <!-- Main -->
    <div class="container">

        <!-- Tab Switcher -->
        <div class="tab-bar">
            <button class="tab-btn active" data-tab="need" id="tabNeed">🙋 我需要帮助</button>
            <button class="tab-btn" data-tab="offer" id="tabOffer">🤝 我能帮忙</button>
        </div>

        <!-- Category Chips -->
        <div class="category-row" id="categoryRow">
            <button class="cat-chip active" data-cat="all">全部</button>
            <button class="cat-chip" data-cat="companion">👴 陪伴照料</button>
            <button class="cat-chip" data-cat="housework">🏠 家政帮手</button>
            <button class="cat-chip" data-cat="skill">📚 技能教学</button>
            <button class="cat-chip" data-cat="errand">🏃 代办跑腿</button>
            <button class="cat-chip" data-cat="pet">🐾 宠物协助</button>
            <button class="cat-chip" data-cat="other">📌 其他</button>
        </div>

        <!-- Card List -->
        <div class="card-list" id="cardList"></div>
        <div class="empty-state hidden" id="emptyState">
            <div class="empty-icon">📭</div>
            <p>暂时没有匹配的需求</p>
            <p style="font-size:12px">点击右下角按钮发布第一条吧</p>
        </div>
    </div>

    <!-- FAB -->
    <button class="fab" id="fabBtn" title="发布需求/帮助">+</button>

    <!-- Modal -->
    <div class="modal-overlay hidden" id="modalOverlay">
        <div class="modal">
            <h3 id="modalTitle">发布求助</h3>
            <div class="form-group">
                <label>类型</label>
                <select id="modalType">
                    <option value="need">我需要帮助</option>
                    <option value="offer">我能提供帮助</option>
                </select>
            </div>
            <div class="form-group">
                <label>分类</label>
                <select id="modalCat">
                    <option value="companion">陪伴照料</option>
                    <option value="housework">家政帮手</option>
                    <option value="skill">技能教学</option>
                    <option value="errand">代办跑腿</option>
                    <option value="pet">宠物协助</option>
                    <option value="other">其他</option>
                </select>
            </div>
            <div class="form-group">
                <label>标题</label>
                <input type="text" id="modalTitleInput" placeholder="简要描述你需要的帮助..." maxlength="30">
            </div>
            <div class="form-group">
                <label>详细描述</label>
                <textarea id="modalDesc" placeholder="详细说明时间、地点、具体要求等..." maxlength="200"></textarea>
            </div>
            <div class="form-group">
                <label>预计时长</label>
                <select id="modalDuration">
                    <option value="0.5">0.5 小时（0.5 币）</option>
                    <option value="1" selected>1 小时（1 币）</option>
                    <option value="1.5">1.5 小时（1.5 币）</option>
                    <option value="2">2 小时（2 币）</option>
                    <option value="3">3 小时（3 币）</option>
                </select>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" id="modalUrgent" style="width:auto; margin-right:6px;">
                    标记为紧急
                </label>
            </div>
            <div class="btn-row">
                <button class="btn-cancel" id="btnCancel">取消</button>
                <button class="btn-submit" id="btnSubmit">发布</button>
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div id="toastContainer"></div>

    <div class="app-footer">
        <p>社会服务赛道创意项目 · 邻里时间银行</p>
    </div>

    <script>
        // ==================== Data Store ====================
        const defaultServices = [
            {
                id: 1, type: 'need', category: 'companion', title: '陪老人去医院复查',
                desc: '奶奶腿脚不便，需要有人帮忙搀扶和陪伴去社区医院，就在本小区对面，大约半天时间。',
                duration: 3, urgent: true, poster: '李阿姨', avatar: '👵', status: 'open',
                time: '今天 14:00', location: '阳光花园 3栋'
            },
            {
                id: 2, type: 'need', category: 'skill', title: '教我用手机挂号看病',
                desc: '孩子不在身边，想在手机上预约挂号，但总是操作不对，希望有人耐心教一下。',
                duration: 0.5, urgent: false, poster: '张爷爷', avatar: '👴', status: 'open',
                time: '任意时间', location: '翠苑新村 6栋'
            },
            {
                id: 3, type: 'offer', category: 'skill', title: '免费教老年人用智能手机',
                desc: '我是大学生，周末可以教社区里的长辈用手机：微信、拍照、挂号、网购等。',
                duration: 1, urgent: false, poster: '小王同学', avatar: '🧑‍🎓', status: 'open',
                time: '周六/周日', location: '社区活动中心'
            },
            {
                id: 4, type: 'need', category: 'errand', title: '帮忙取快递和买药',
                desc: '最近感冒在家休息，不方便出门，希望有人帮忙取 2 个快递和去药店买感冒药。',
                duration: 0.5, urgent: true, poster: '小赵', avatar: '🤒', status: 'ongoing',
                time: '今天 16:00 前', location: '翠湖苑 2栋'
            },
            {
                id: 5, type: 'offer', category: 'pet', title: '周末免费帮遛狗',
                desc: '我特别喜欢小动物，周末有空可以帮邻居遛狗或临时照看宠物，大型犬也没问题。',
                duration: 1, urgent: false, poster: '小陈', avatar: '🐕', status: 'open',
                time: '周六/周日', location: '附近公园'
            },
            {
                id: 6, type: 'need', category: 'housework', title: '帮忙搬一件大家具',
                desc: '新买的书柜到了，一个人搬不动，需要一位力气大的邻居搭把手，10分钟就好。',
                duration: 0.5, urgent: false, poster: '周姐', avatar: '🙋‍♀️', status: 'completed',
                time: '已完成', location: '阳光花园 8栋'
            },
            {
                id: 7, type: 'offer', category: 'companion', title: '陪独居老人散步聊天',
                desc: '下班后时间比较空闲，可以陪小区里的老人散散步、聊聊天，每次1小时左右。',
                duration: 1, urgent: false, poster: '大刘', avatar: '🚶', status: 'open',
                time: '工作日 18:00 后', location: '本小区'
            },
            {
                id: 8, type: 'need', category: 'skill', title: '帮忙辅导小学数学',
                desc: '女儿五年级数学有些跟不上，希望找一位有耐心的邻居帮忙每周辅导一次。',
                duration: 2, urgent: false, poster: '陈爸爸', avatar: '👨‍👧', status: 'open',
                time: '周三或周四晚', location: '翠苑新村 1栋'
            }
        ];

        let services = JSON.parse(localStorage.getItem('timebank_services') || 'null') || defaultServices;
        let timeCoins = parseInt(localStorage.getItem('timebank_coins') || '12');
        let myServices = JSON.parse(localStorage.getItem('timebank_myservices') || '[]');

        let currentTab = 'need';
        let currentCat = 'all';

        function save() {
            localStorage.setItem('timebank_services', JSON.stringify(services));
            localStorage.setItem('timebank_coins', String(timeCoins));
            localStorage.setItem('timebank_myservices', JSON.stringify(myServices));
        }

        // ==================== Render ====================
        const catNames = {
            companion: '陪伴照料', housework: '家政帮手', skill: '技能教学',
            errand: '代办跑腿', pet: '宠物协助', other: '其他'
        };
        const catIcons = {
            companion: '👴', housework: '🏠', skill: '📚', errand: '🏃', pet: '🐾', other: '📌'
        };

        function renderCards() {
            const list = document.getElementById('cardList');
            const empty = document.getElementById('emptyState');

            let filtered = services.filter(s => {
                const tabMatch = s.type === currentTab;
                const catMatch = currentCat === 'all' || s.category === currentCat;
                return tabMatch && catMatch;
            });

            if (filtered.length === 0) {
                list.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            list.innerHTML = filtered.map(s => {
                const tagsHtml = [
                    `<span class="tag time-tag">⏱ ${s.duration}h · ${s.duration}币</span>`,
                    `<span class="tag">${catIcons[s.category]} ${catNames[s.category]}</span>`,
                    s.urgent ? `<span class="tag urgent-tag">🔴 紧急</span>` : '',
                    `<span class="tag">📍 ${s.location}</span>`
                ].join('');

                let actionHtml = '';
                if (s.status === 'open') {
                    if (s.type === 'need') {
                        actionHtml = `<button class="action-btn help-btn" onclick="acceptService(${s.id})">我来帮忙</button>`;
                    } else {
                        actionHtml = `<button class="action-btn done-btn" onclick="requestService(${s.id})">我需要这个</button>`;
                    }
                } else if (s.status === 'ongoing') {
                    actionHtml = `<span class="status-badge ongoing">进行中</span>`;
                } else if (s.status === 'completed') {
                    actionHtml = `<span class="status-badge completed">✓ 已完成</span>`;
                }

                return `
                    <div class="service-card">
                        <div class="avatar">${s.avatar}</div>
                        <div class="card-body">
                            <div class="card-title">${s.title}</div>
                            <div class="card-meta">${s.poster} · ${s.time}</div>
                            <div class="card-desc">${s.desc}</div>
                            <div class="card-tags">${tagsHtml}</div>
                        </div>
                        ${actionHtml}
                    </div>
                `;
            }).join('');
        }

        function updateStats() {
            const completed = services.filter(s => s.status === 'completed').length;
            const totalHours = services.reduce((sum, s) => sum + (s.status === 'completed' ? s.duration : 0), 0);
            const members = new Set(services.map(s => s.poster)).size;
            document.getElementById('statCompleted').textContent = completed.toLocaleString();
            document.getElementById('statHours').textContent = totalHours.toLocaleString();
            document.getElementById('statMembers').textContent = (members * 48 + 50);
        }

        function updateCoins() {
            document.getElementById('coinAmount').textContent = timeCoins;
        }

        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2200);
        }

        // ==================== Actions ====================
        function acceptService(id) {
            const service = services.find(s => s.id === id);
            if (!service || service.status !== 'open') return;
            if (timeCoins < service.duration) {
                showToast('⏳ 时间币不足！先去帮助别人赚取时间币吧~');
                return;
            }
            service.status = 'ongoing';
            myServices.push({ id: service.id, role: 'helper', title: service.title });
            save();
            renderCards();
            updateStats();
            showToast('🙌 已接单！完成后将消耗 ' + service.duration + ' 时间币');
        }

        function requestService(id) {
            const service = services.find(s => s.id === id);
            if (!service || service.status !== 'open') return;
            service.status = 'ongoing';
            myServices.push({ id: service.id, role: 'requester', title: service.title });
            save();
            renderCards();
            updateStats();
            showToast('🤝 已请求！服务完成后你将支付 ' + service.duration + ' 时间币');
        }

        function completeService(id) {
            const service = services.find(s => s.id === id);
            if (!service || service.status !== 'ongoing') return;
            service.status = 'completed';
            const my = myServices.find(m => m.id === id);
            if (my) {
                if (my.role === 'helper') {
                    timeCoins += service.duration;
                    showToast('✅ 完成！获得 +' + service.duration + ' 时间币 🎉');
                } else if (my.role === 'requester') {
                    timeCoins = Math.max(0, timeCoins - service.duration);
                    showToast('✅ 完成！支付 ' + service.duration + ' 时间币');
                }
            }
            updateCoins();
            save();
            renderCards();
            updateStats();
        }

        // Double-click ongoing card to complete it (for demo)
        document.getElementById('cardList').addEventListener('dblclick', function(e) {
            const card = e.target.closest('.service-card');
            if (!card) return;
            const ongoingBadge = card.querySelector('.status-badge.ongoing');
            if (!ongoingBadge) return;
            const titleEl = card.querySelector('.card-title');
            const title = titleEl?.textContent;
            const service = services.find(s => s.title === title && s.status === 'ongoing');
            if (service) {
                completeService(service.id);
            }
        });

        function addService(type, category, title, desc, duration, urgent) {
            const newService = {
                id: Date.now(),
                type, category, title, desc,
                duration: parseFloat(duration),
                urgent,
                poster: '我',
                avatar: type === 'need' ? '🙋' : '🤝',
                status: 'open',
                time: '刚刚发布',
                location: '本小区'
            };
            services.unshift(newService);
            save();
            renderCards();
            updateStats();
        }

        // ==================== Modal ====================
        const modalOverlay = document.getElementById('modalOverlay');
        const modalType = document.getElementById('modalType');
        const modalTitle = document.getElementById('modalTitle');

        document.getElementById('fabBtn').addEventListener('click', () => {
            modalOverlay.classList.remove('hidden');
            onModalTypeChange();
        });

        modalType.addEventListener('change', onModalTypeChange);
        function onModalTypeChange() {
            modalTitle.textContent = modalType.value === 'need' ? '发布求助' : '发布帮助';
        }

        document.getElementById('btnCancel').addEventListener('click', () => {
            modalOverlay.classList.add('hidden');
            clearModal();
        });

        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) {
                modalOverlay.classList.add('hidden');
                clearModal();
            }
        });

        function clearModal() {
            document.getElementById('modalTitleInput').value = '';
            document.getElementById('modalDesc').value = '';
            document.getElementById('modalUrgent').checked = false;
            document.getElementById('modalDuration').value = '1';
            document.getElementById('modalCat').value = 'companion';
        }

        document.getElementById('btnSubmit').addEventListener('click', () => {
            const type = modalType.value;
            const cat = document.getElementById('modalCat').value;
            const title = document.getElementById('modalTitleInput').value.trim();
            const desc = document.getElementById('modalDesc').value.trim();
            const duration = document.getElementById('modalDuration').value;
            const urgent = document.getElementById('modalUrgent').checked;

            if (!title) { showToast('请填写标题'); return; }
            if (!desc) { showToast('请填写描述'); return; }
            if (desc.length < 10) { showToast('描述不少于10个字哦~'); return; }

            addService(type, cat, title, desc, duration, urgent);
            modalOverlay.classList.add('hidden');
            clearModal();
            showToast(type === 'need' ? '📢 求助已发布！' : '🌟 帮助已发布！');
        });

        // ==================== Tab & Category ====================
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTab = btn.dataset.tab;
                renderCards();
            });
        });

        document.querySelectorAll('.cat-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentCat = chip.dataset.cat;
                renderCards();
            });
        });

        // ==================== Init ====================
        renderCards();
        updateStats();
        updateCoins();

        // Quick demo: auto-complete ongoing items after 10 seconds
        setTimeout(() => {
            const ongoing = services.find(s => s.status === 'ongoing');
            if (ongoing) {
                completeService(ongoing.id);
            }
        }, 15000);
    </script>
</body>
</html>
