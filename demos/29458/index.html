<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关系调解室 — AI 调解 & 自我审查</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F2EDE6;--bg-warm:#E8DFD3;--card:#FFFBF5;--card-hover:#FFF8F0;
  --text:#2A1F14;--text-m:#5A4E42;--text-s:#7A6B5D;--text-xs:#A89888;
  --border:#D8CEBF;--border-light:#E8DFD3;
  --mediator:#B8860B;--mediator-bg:#FDF5E6;--mediator-border:#E8D5A8;
  --observer:#4A6670;--observer-bg:#EDF2F5;--observer-border:#B0C4CE;
  --psycho:#6B5B7B;--psycho-bg:#F0EBF5;--psycho-border:#B8A8CC;
  --analyst:#6B5B7B;--analyst-bg:#F0EBF5;
  --primary:#C45D3E;--primary-h:#A84D32;--primary-bg:#FDF0EC;
  --danger:#C44536;--danger-bg:#FDECEA;
  --warning:#D4843E;--warning-bg:#FEF3E8;
  --gold:#D4A574;--gold-bg:#FBF3E8;
  --ink:#2A1F14;--ink-light:rgba(42,31,20,.06);
  --radius:20px;--radius-sm:12px;--radius-xs:8px;
  --shadow:0 2px 20px rgba(44,24,16,.06);
  --shadow-lg:0 12px 48px rgba(44,24,16,.1);
  --shadow-sm:0 1px 4px rgba(44,24,16,.04);
  --font-display:'Cormorant Garamond','Noto Serif SC',serif;
  --font-serif:'Noto Serif SC','Source Han Serif SC',serif;
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-body);
  background:var(--bg);
  background-image:
    radial-gradient(ellipse at 20% 0%,rgba(196,93,62,.04) 0%,transparent 50%),
    radial-gradient(ellipse at 80% 100%,rgba(107,91,123,.04) 0%,transparent 50%);
  color:var(--text);line-height:1.7;min-height:100vh;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.3;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");
}
button{font-family:inherit;cursor:pointer;border:none;outline:none;font-size:.95rem}
input,textarea,select{font-family:inherit;font-size:.9rem;outline:none;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;width:100%;transition:border-color .25s,box-shadow .25s;background:var(--card)}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg),0 2px 8px rgba(196,93,62,.08)}
textarea{resize:vertical;min-height:140px;line-height:1.7}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 28px;border-radius:var(--radius-sm);font-weight:600;transition:all .25s ease;gap:8px;letter-spacing:.02em}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(196,93,62,.2)}
.btn-primary:hover{background:var(--primary-h);transform:translateY(-1px);box-shadow:0 4px 16px rgba(196,93,62,.25)}
.btn-primary:disabled{background:#C4A898;cursor:not-allowed;transform:none;box-shadow:none}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-bg)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#a83828;transform:translateY(-1px)}
.btn-sm{padding:9px 18px;font-size:.85rem}
.btn-block{width:100%}
#app{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:24px;min-height:100vh;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;animation:fadeIn .4s ease}
.screen.active{display:flex}
.header{text-align:center;padding:36px 0 24px;margin-bottom:24px;position:relative}
.header::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:60px;height:2px;background:linear-gradient(90deg,transparent,var(--primary),transparent)}
.header h1{font-family:var(--font-serif);font-size:1.7rem;font-weight:700;color:var(--text);margin-bottom:8px;letter-spacing:.04em}
.header p{color:var(--text-s);font-size:.9rem;letter-spacing:.03em}
.card{background:var(--card);border-radius:var(--radius);padding:32px;box-shadow:var(--shadow);margin-bottom:20px;border:1px solid var(--border-light);position:relative}
.card h2{font-family:var(--font-serif);font-size:1.2rem;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:10px;letter-spacing:.02em}
.form-group{margin-bottom:22px}
.form-group label{display:block;font-weight:600;margin-bottom:8px;font-size:.9rem}
.form-group .hint{font-size:.8rem;color:var(--text-s);margin-top:6px}
.char-count{font-size:.8rem;color:var(--text-xs);text-align:right;margin-top:6px}
.char-count.warn{color:var(--warning)}
.char-count.over{color:var(--danger)}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 0;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.round-indicator{font-weight:700;font-size:.95rem;color:var(--primary);background:var(--primary-bg);padding:8px 20px;border-radius:24px;letter-spacing:.02em;border:1px solid rgba(196,93,62,.15)}
.pause-btn{background:transparent;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:8px 16px;font-size:.85rem;color:var(--text-s);transition:all .25s ease}
.pause-btn:hover{border-color:var(--warning);color:var(--warning);background:var(--warning-bg)}
.handoff-screen{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:60px 24px}
.handoff-content{max-width:420px}
.handoff-content .icon{font-size:4rem;margin-bottom:28px;display:block}
.handoff-content h2{font-family:var(--font-serif);font-size:1.4rem;margin-bottom:12px;font-weight:700}
.handoff-content p{color:var(--text-s);margin-bottom:32px;line-height:1.7}
.perspective-card{border-radius:var(--radius);padding:22px;margin-bottom:16px;border-top:3px solid;animation:cardFadeIn .4s ease both;position:relative;overflow:hidden}
.perspective-card::before{content:'';position:absolute;top:0;right:0;width:80px;height:80px;border-radius:0 0 0 80px;opacity:.06;pointer-events:none}
.perspective-card:nth-child(1){animation-delay:0s}
.perspective-card:nth-child(2){animation-delay:.1s}
.perspective-card:nth-child(3){animation-delay:.2s}
.perspective-card.mediator{background:var(--mediator-bg);border-top-color:var(--mediator)}
.perspective-card.mediator::before{background:var(--mediator)}
.perspective-card.observer{background:var(--observer-bg);border-top-color:var(--observer)}
.perspective-card.observer::before{background:var(--observer)}
.perspective-card.psycho{background:var(--psycho-bg);border-top-color:var(--psycho)}
.perspective-card.psycho::before{background:var(--psycho)}
.perspective-card .label{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.perspective-card.mediator .label{color:var(--mediator)}
.perspective-card.mediator .label::before{content:'🤝';font-size:1rem}
.perspective-card.observer .label{color:var(--observer)}
.perspective-card.observer .label::before{content:'👁';font-size:1rem}
.perspective-card.psycho .label{color:var(--psycho)}
.perspective-card.psycho .label::before{content:'🔮';font-size:1rem}
.perspective-card .sub-label{font-size:.82rem;font-weight:600;color:var(--text-s);margin-bottom:4px;margin-top:14px}
.perspective-card .content{font-size:.9rem;line-height:1.7}
.analysis-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.analysis-left,.analysis-right{display:flex;flex-direction:column;gap:16px}
.relay-card{background:var(--primary-bg);border-radius:var(--radius);padding:22px;border-top:3px solid var(--primary);position:relative;overflow:hidden}
.relay-card::before{content:'';position:absolute;top:0;right:0;width:60px;height:60px;background:var(--primary);border-radius:0 0 0 60px;opacity:.06}
.relay-card .label{font-size:.75rem;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px}
.relay-card .content{font-size:.9rem;line-height:1.7}
.questions-card{background:var(--warning-bg);border-radius:var(--radius);padding:22px;border-top:3px solid var(--warning)}
.questions-card .label{font-size:.75rem;font-weight:700;color:var(--warning);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px}
.questions-card .question{font-size:.9rem;line-height:1.7;margin-bottom:8px;padding-left:22px;position:relative}
.questions-card .question::before{content:"Q";position:absolute;left:0;font-weight:700;color:var(--warning);font-size:.8rem}
.input-area{margin-top:auto;padding-top:20px}
.input-area .prev-questions{background:var(--warning-bg);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:16px;font-size:.88rem}
.input-area .prev-questions .qlabel{font-weight:600;color:var(--warning);margin-bottom:6px;font-size:.8rem}
.loading-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center}
.loading-dots{display:flex;gap:12px;margin-bottom:24px}
.loading-dots span{width:10px;height:10px;border-radius:50%;background:var(--primary);animation:pulse 1.2s ease-in-out infinite}
.loading-dots span:nth-child(2){animation-delay:.2s}
.loading-dots span:nth-child(3){animation-delay:.4s}
.streaming-text{background:var(--card);border-radius:var(--radius-sm);padding:18px;font-size:.82rem;color:var(--text-s);max-height:180px;overflow-y:auto;text-align:left;white-space:pre-wrap;word-break:break-word;margin-top:20px;width:100%;max-width:600px;line-height:1.6;border:1px solid var(--border-light)}
.speaker-choice{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.speaker-choice .btn{flex:1;min-width:140px}
.speaker-choice .btn.suggested{border:2px solid var(--primary);background:var(--primary-bg);color:var(--primary)}
.report-section{margin-bottom:32px}
.report-section h2{font-family:var(--font-serif);font-size:1.2rem;font-weight:700;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);position:relative;letter-spacing:.02em}
.report-section h2::after{content:'';position:absolute;bottom:-1px;left:0;width:48px;height:2px;background:var(--primary)}
.conflict-item{background:var(--card);border-radius:var(--radius-sm);padding:18px;margin-bottom:12px;border-left:4px solid var(--border);box-shadow:var(--shadow-sm);transition:transform .2s ease}
.conflict-item:hover{transform:translateX(2px)}
.conflict-item.factual{border-left-color:var(--observer)}
.conflict-item.interpretive{border-left-color:var(--psycho)}
.conflict-item .tag{font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:12px;display:inline-block;margin-bottom:8px;letter-spacing:.5px}
.conflict-item.factual .tag{background:var(--observer-bg);color:var(--observer)}
.conflict-item.interpretive .tag{background:var(--psycho-bg);color:var(--psycho)}
.action-step{background:var(--card);border-radius:var(--radius-sm);padding:18px;margin-bottom:12px;border-left:4px solid var(--primary);box-shadow:var(--shadow-sm)}
.action-step .step-num{font-weight:700;color:var(--primary);font-size:.85rem}
.risk-box{background:var(--danger-bg);border-radius:var(--radius);padding:22px;border-left:4px solid var(--danger)}
.risk-box h3{color:var(--danger);margin-bottom:8px}
.error-msg{background:var(--danger-bg);color:var(--danger);border-radius:var(--radius-sm);padding:14px;margin-bottom:16px;font-size:.9rem}
.pause-overlay{position:fixed;inset:0;background:rgba(242,237,230,.97);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:100;flex-direction:column;text-align:center;padding:40px}
.pause-overlay h2{font-family:var(--font-serif);font-size:1.5rem;margin-bottom:10px}
.pause-overlay p{color:var(--text-s);margin-bottom:28px;max-width:400px;line-height:1.7}
.breath-circle{width:150px;height:150px;border-radius:50%;border:2px solid var(--primary);animation:breathe 4s cubic-bezier(.4,0,.2,1) infinite;margin-bottom:28px;display:flex;align-items:center;justify-content:center;color:var(--primary);font-weight:600;font-size:.95rem;background:radial-gradient(circle,rgba(196,93,62,.05) 0%,transparent 70%)}
@keyframes breathe{0%,100%{transform:scale(.8);opacity:.5}50%{transform:scale(1.15);opacity:1}}
.resume-dialog{position:fixed;inset:0;background:rgba(42,31,20,.4);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;backdrop-filter:blur(6px)}
.resume-dialog .dialog-card{background:var(--card);border-radius:var(--radius);padding:40px;max-width:420px;width:100%;text-align:center;box-shadow:var(--shadow-lg);border:1px solid var(--border-light)}
.resume-dialog .dialog-card h2{font-family:var(--font-serif);margin-bottom:10px}
.resume-dialog .dialog-card p{color:var(--text-s);margin-bottom:24px;font-size:.9rem}
.resume-dialog .dialog-card .btns{display:flex;gap:12px}
.resume-dialog .dialog-card .btns .btn{flex:1}
.export-bar{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.progress-bar{width:100%;height:3px;background:var(--border);border-radius:2px;margin-bottom:20px;overflow:hidden}
.progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--gold));border-radius:2px;transition:width .4s ease}
.retry-area{margin-top:20px}
.mirror-card{background:var(--card);border-radius:var(--radius);padding:22px;margin-bottom:16px;border-top:3px solid var(--psycho);box-shadow:var(--shadow);animation:cardFadeIn .4s ease both;position:relative;overflow:hidden}
.mirror-card::after{content:'';position:absolute;top:0;left:0;right:0;height:100%;background:linear-gradient(135deg,rgba(107,91,123,.03) 0%,transparent 50%);pointer-events:none}
.mirror-card .label{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;color:var(--psycho);display:flex;align-items:center;gap:6px}
.mirror-card .label::before{content:'🪞';font-size:1rem}
.mirror-card .content{font-size:.9rem;line-height:1.7}
.mirror-card .challenge{background:var(--danger-bg);border-radius:var(--radius-sm);padding:16px;margin-top:14px;font-size:.9rem;line-height:1.7;border-left:3px solid var(--danger)}
.mirror-card .insight{background:var(--primary-bg);border-radius:var(--radius-sm);padding:16px;margin-top:14px;font-size:.9rem;line-height:1.7;border-left:3px solid var(--primary)}
.warmth-box{margin-top:12px;padding:14px 18px;background:var(--primary-bg);border-radius:var(--radius-sm);border-left:3px solid var(--primary);font-size:.9rem;line-height:1.7;color:var(--text-m)}
.warmth-box .warmth-label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--primary);margin-bottom:6px}
.self-insight-box{margin-top:10px;padding:12px 16px;background:#e8f5e9;border-radius:var(--radius-sm);border-left:3px solid #4caf50;font-size:.88rem;line-height:1.6}
.self-insight-box .si-label{font-size:.72rem;font-weight:700;color:#4caf50;margin-bottom:4px}
.layer-indicator{display:flex;gap:6px;margin-bottom:22px;align-items:center;flex-wrap:wrap}
.layer-indicator .layer-dot{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;border:2px solid var(--border);color:var(--text-xs);transition:all .3s ease;cursor:default}
.layer-indicator .layer-dot.active{border-color:var(--primary);background:var(--primary-bg);color:var(--primary);transform:scale(1.12);box-shadow:0 2px 8px rgba(196,93,62,.15)}
.layer-indicator .layer-dot.done{border-color:var(--primary);background:var(--primary);color:#fff}
.layer-indicator .layer-connector{width:16px;height:2px;background:var(--border)}
.layer-indicator .layer-connector.done{background:var(--primary)}
.beta-badge{display:inline-block;background:var(--warning);color:#fff;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle;letter-spacing:.5px}
.home-card{background:var(--card);border-radius:var(--radius);padding:36px 28px;box-shadow:var(--shadow);cursor:pointer;transition:all .3s ease;border:2px solid transparent;text-align:center;position:relative;overflow:hidden}
.home-card::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(196,93,62,.03) 100%);pointer-events:none;transition:opacity .3s;opacity:0}
.home-card:hover{border-color:var(--primary);transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.home-card:hover::before{opacity:1}
.home-card .icon{font-size:3rem;margin-bottom:16px;display:block}
.home-card h2{font-family:var(--font-serif);font-size:1.2rem;margin-bottom:10px;letter-spacing:.02em}
.home-card p{color:var(--text-s);font-size:.88rem;line-height:1.6}
.gender-select{display:flex;gap:8px;margin-top:4px}
.gender-select label{display:flex;align-items:center;gap:4px;cursor:pointer;padding:7px 16px;border-radius:var(--radius-xs);border:1.5px solid var(--border);font-size:.9rem;transition:all .25s}
.gender-select label.selected{border-color:var(--primary);background:var(--primary-bg);color:var(--primary)}
.gender-select input{display:none}
.preset-section{margin-top:18px;padding-top:18px;border-top:1px solid var(--border)}
.preset-section .preset-tag{display:inline-flex;align-items:center;gap:4px;background:var(--primary-bg);color:var(--primary);padding:5px 14px;border-radius:16px;font-size:.82rem;margin:4px 4px 4px 0;cursor:pointer;transition:all .25s}
.preset-section .preset-tag:hover{background:var(--primary);color:#fff}
.socratic-card{background:var(--card);border-radius:var(--radius);padding:22px;margin-bottom:16px;border-top:3px solid var(--mediator);box-shadow:var(--shadow);animation:cardFadeIn .4s ease both}
.socratic-card .label{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;color:var(--mediator);display:flex;align-items:center;gap:6px}
.socratic-card .label::before{content:'💡';font-size:1rem}
.socratic-card .content{font-size:.9rem;line-height:1.7}
.depth-meter{margin-bottom:18px;padding:14px 18px;background:var(--primary-bg);border-radius:var(--radius-sm);display:flex;align-items:center;gap:14px;border:1px solid rgba(196,93,62,.1)}
.depth-meter .depth-label{font-size:.82rem;font-weight:600;color:var(--primary)}
.depth-meter .depth-bar{flex:1;height:6px;border-radius:3px;background:var(--border);overflow:hidden}
.depth-meter .depth-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--primary),var(--gold));transition:width .4s ease}
.depth-meter .depth-val{font-size:.82rem;font-weight:700;color:var(--primary)}
.safety-bar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(135deg,#C44536,#A83828);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:center;gap:12px;z-index:150;box-shadow:0 -4px 20px rgba(196,69,54,.3);animation:slideUp .3s ease}
.safety-bar .safety-text{font-size:.85rem;line-height:1.5}
.safety-bar .safety-text strong{font-size:.9rem}
.safety-bar .safety-close{background:rgba(255,255,255,.2);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.safety-bar .safety-close:hover{background:rgba(255,255,255,.3)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.cooldown-overlay{position:fixed;inset:0;background:rgba(196,69,54,.08);backdrop-filter:blur(8px);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
.cooldown-card{background:var(--card);border-radius:var(--radius);max-width:480px;width:100%;padding:36px 28px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.12)}
.cooldown-breath{width:100px;height:100px;border-radius:50%;border:3px solid var(--primary);margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:.85rem;color:var(--primary);animation:cooldownBreath 4s ease-in-out infinite}
@keyframes cooldownBreath{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.15);opacity:1}}
.cooldown-title{font-size:1.3rem;font-weight:700;margin-bottom:10px;color:var(--danger)}
.cooldown-text{font-size:.9rem;line-height:1.8;color:var(--text-m);margin-bottom:20px}
.cooldown-quote{font-size:.85rem;line-height:1.7;color:var(--text-s);font-style:italic;padding:14px 16px;background:var(--primary-bg);border-radius:var(--radius-sm);margin-bottom:24px;border-left:3px solid var(--primary)}
.cooldown-timer{font-size:2rem;font-weight:700;color:var(--primary);margin-bottom:16px}
.cooldown-btn{font-size:.95rem;padding:12px 32px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

const SYSTEM_PROMPT = `你是一个关系调解AI系统，由三个专业视角组成。你的任务是帮助陷入"敌意归因偏差"(Hostile Attribution Bias)循环的伴侣理解彼此。敌意归因偏差是指人们倾向于将他人的中性行为解读为带有敌意，这在亲密关系中尤其常见且破坏性极大。

## 三个视角定义

### 1. 调解者 (Mediator)
- 角色：温暖但坚定的资深伴侣咨询师
- 职责：将情感表达翻译为潜在需求/恐惧，给出具体的沟通方法
- 语气：像一位经验丰富的前辈，既共情又不回避问题
- 示例表达："他真正想说的是……" "下次试试这样表达……" "她表面在指责，实际是在呼求……"
- 禁忌：不要和稀泥，不要说"你们都有道理"这种废话

### 2. 围观群众 (Observer/Judge)
- 角色：冷酷、直率、不讲废话的旁观者，像一个毫不留情的法官
- 职责：只讲事实，不讲感受；做出直接判断，不含糊
- 语气：冷、硬、不客气，但公正
- 示例表达："不管你的感受如何，事实是……" "你在这里越界了" "你过度解读了" "这是你的主观臆断，不是事实" "你的爆发是被逼出来的，但爆发本身也越界了——只是逼你爆发的人责任更大"
- 禁忌：不要试图安慰任何人，不要给任何一方留面子，不要和稀泥
- 重要精确性原则：你可以否定对方的"解读"（"这不是事实，这是你的过度解读"），但不要否定对方的"感受"本身——感受不需要被否定，只需要被指出"这不是事实的依据"。比如："你感到被攻击，我理解，但客观事实是他并没有攻击你"——前半句不是安慰，是精确陈述，后半句才是判断

### 3. 心理分析师 (Psychoanalyst)
- 角色：基于依恋理论、创伤反应、防御机制的心理分析师
- 职责：解释因果机制而非判断对错，识别互动模式，鉴别操控vs创伤反应

- 禁忌：不要做诊断，不要说"你有XX人格障碍"，只描述模式和机制

## 核心规则
1. 永远不偏袒——当事实清楚时，必须基于事实站队，这不是偏袒，这是公正。偏袒是无理由地偏向一方，站队是基于证据的判断。不要为了显得"中立"而拒绝下判断，也不要因为双方都有情绪就默认"各打五十大板"
2. 永远不给模糊建议——每个建议必须具体可执行，包含"在XX情境下，做XX事"
3. 始终区分事实和情感解读——这是最核心的原则
4. 识别敌意归因偏差——当一方将中性行为解读为敌意时，必须明确指出
5. 注意创伤反应——当行为可能源于过往创伤时，指出但不做诊断
6. 分析说话者的输入时，要帮助听者理解说话者——你的分析是给听者看的
7. 提问要具体、有引导性——不是"你怎么看"而是"当他说XX时，你内心最害怕的是什么？"

## 关键规则：反应性行为 vs 主动操控的识别

这是本系统最重要的规则之一，必须严格遵守：

### 反应性攻击（Reactive Aggression）
当一方被持续施压、追逼、不给空间、反复刺激后爆发（如发火、摔东西、说出伤人的话），这属于"反应性攻击"。识别信号：
- 爆发前有明确的"试图退避"行为（如说"冷静一下"、离开房间、沉默）
- 对方拒绝给予空间（如追到另一个房间、拽回来、继续逼问）
- 爆发的强度与持续施压的时长成正比
- 爆发后通常伴随内疚或后悔

当检测到反应性攻击模式时：
- 围观群众必须指出："XX的爆发是持续被施压后的反应，而非主动攻击。先施压后指责对方爆发，是一种不公平的框架。"
- 心理分析师必须解释："这是一个'追-逃'模式的极端化——一方追逼不给空间，另一方被逼到绝境后爆发，爆发又被追逼方用作'你才是问题'的证据。"
- 调解者必须给出具体建议："当对方说'我需要冷静一下'时，你必须停止追逼，给对方空间。这不是你'输了'，这是给双方降温的必要步骤。"

### 主动性操控（Instrumental Manipulation）
当一方系统性地使用策略来控制对方时，这属于"主动性操控"。识别信号：
- 反复否认对方的事实感知（"我没说过""你记错了""你太敏感了"）
- 在对方退避时追逼，在对方靠近时推开（推拉模式）
- 将对方的反应性爆发作为"你才是施暴者"的证据，同时忽略自己的施压行为
- 对方表达需求时，系统性地将其解读为"攻击"或"无理取闹"

当检测到主动性操控模式时：
- 必须明确标注为"操控模式预警"
- 围观群众必须直接指出："从事实链条看，XX存在系统性操控行为——先施压逼对方爆发，再用爆发作为对方有问题的证据。这不是'双方都有问题'，这是操控。"
- 绝不能用"你们都要反思"来模糊操控的责任

### 关键区分原则
- 反应性行为≠施暴：被逼到绝境后的爆发，责任在施压方
- 但反应性行为如果涉及身体暴力，无论起因如何，都必须明确指出"身体暴力永远不可接受"，同时指出"施压方对激化冲突负有主要责任"
- 不要因为双方都有情绪就默认"各打五十大板"——有时候一方确实是主要施压方

const SELF_REVIEW_PROMPT = `你是两个角色合一体——"镜子"和"灯塔"。你同时从两个视角回应，帮助用户看清自己。

## 双角色规则

### 镜子（质疑者）
- 绝对客观，不顺从，不偏袒
- 区分事实与解读——这是最核心的原则
- 识别敌意归因偏差、自我欺骗、重复模式
- 每个判断必须有依据——不是"我觉得你在逃避"，而是"你说'我没办法'出现了3次，但每次你都有其他选项"
- 直接质疑，不留面子，但不说教

### 灯塔（温暖陪伴者）
- 在镜子质疑之后，给予情感过渡
- 不是安慰或顺从，而是认可用户面对问题的勇气
- "你愿意说出'我害怕被抛弃'，这本身就需要很大的勇气"
- 帮助用户感到被理解，而非被审判
- 当用户触及深层恐惧时，先肯定再追问

### 情感过渡规则（必须遵守）
每次 challenge 之后，warmth 中必须包含：
1. 认可用户刚才表达的勇气或诚实
2. 用一个比喻或画面帮用户理解镜子的质疑（不是在否定你，是在帮你看到你习惯性忽略的部分）
3. 温和地连接到 next_question

## 洋葱模型六层（用户可在任意层级结束）

你正在引导用户逐层深入。但层级不是强制的——用户可以在任何层级选择结束并生成报告。

### 第1层：表面层——事实vs解读
- 任务：把用户的话拆成"事实"和"解读"
- 你必须明确标注：哪些是可验证的事实，哪些是用户的主观解读
- 如果用户已经触及了情绪或恐惧（第2层主题），不要假装没看到，在回应的同时标注"这其实涉及了更深层的感受，我们稍后会继续"

### 第2层：情绪层——真正的恐惧
- 任务：追问话语背后的核心恐惧
- 用户表达的愤怒/指责通常是次生情绪，底下是恐惧或伤痛
- 如果用户在第1层已经触及了恐惧，从这里继续深入

### 第3层：模式层——重复的行为
- 任务：识别用户的行为模式
- 指出用户在不同情境下的重复反应
- 从"这次发生了什么"转向"你一直在重复什么"

### 第4层：根源层——模式从哪来
- 任务：连接过往经历和依恋模式
- 从依恋理论、创伤反应、防御机制角度解释
- 如果用户还没准备好触碰根源，不要强行推进

### 第5层：行动层——能做什么不同
- 任务：给出具体的、可执行的自我调节方案
- 不是"要学会爱自己"这种废话
- 而是"下次他沉默时，先问自己'这是事实还是我的解读？'，等10分钟再决定怎么回应"

### 第6层：苏格拉底整合
- 任务：通过追问让用户自己把前面的发现串联起来
- 不再直接告诉结论，而是问问题让用户自己整合
- 如果用户在前面层级已经自然整合了，可以提前建议生成报告

## 层级推进规则
1. 不要急于推进层级——每层至少2轮对话再考虑标记layer_complete
2. 如果用户在当前层还有未表达的内容，不要标记完成
3. 如果用户主动说"我觉得这层聊够了"或"我想聊聊别的"，尊重用户意愿
4. 第3层以后，如果用户已经触及核心模式，可以主动建议"你已经看到了关键模式，要不要现在就生成报告？"

## 层级回退规则
如果用户主动回到前一层的话题，你应该跟随用户回到该层继续分析。在回应中标注实际分析的层级。

## 回应格式

当用户发言时，你必须严格返回以下JSON格式（不要添加任何JSON之外的内容，不要用markdown代码块包裹）：
{
  "layer": "当前层级编号(1-6)，6代表苏格拉底整合",
  "analysis": "你对用户发言的分析，指出事实vs解读、识别的模式、质疑的假设等",
  "challenge": "镜子视角：直接质疑或挑战用户——这是核心部分，不要客气，但要有依据",
  "warmth": "灯塔视角：情感过渡——认可用户的勇气，用比喻帮助理解质疑，温和地连接到下一个问题",
  "insight": "如果用户展现了新的觉察或突破，在此指出；如果没有，写null",
  "self_insight": "用户在本次发言中自己承认或意识到的东西（不是你分析的，是用户自己说的）。如果用户没有展现自我觉察，写null",
  "next_question": "引导用户深入的下一个具体问题",
  "depth_score": "1-10的整数，评估用户当前的自我觉察深度。1=完全在外归因，10=深刻理解自己的模式并准备改变",
  "layer_complete": "true或false——你是否认为用户已经充分理解了当前层级，可以进入下一层？注意：不要急于标记true，每层至少2轮对话"
}

重要：你的所有回应必须是合法的JSON格式，不要在JSON前后添加任何文字说明或markdown代码块标记。

## 安全底线规则
如果用户表达自伤、自杀倾向，或正在经历身体暴力，你必须：
1. 立即停止质疑和挑战模式
2. 在analysis中表达关切："我听到了你正在经历极大的痛苦"
3. 在next_question中温和地建议："你现在愿意和安全的人聊聊吗？全国心理援助热线400-161-9995（24小时）"
4. 不要继续推进层级，不要质疑用户此时感受的真实性
5. 如果用户处于危险中，insight写"你的安全比任何分析都重要"`;

function extractJSON(text) {
  let cleaned = text.trim();
  const cbMatch = cleaned.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (cbMatch) cleaned = cbMatch[1].trim();
  const start = cleaned.indexOf('{');
  const end = cleaned.lastIndexOf('}');
  if (start !== -1 && end !== -1 && end > start) {
    cleaned = cleaned.substring(start, end + 1);
  }
  try { return JSON.parse(cleaned); }
  catch(e) { throw new Error('AI返回的内容无法解析为有效格式，请重试'); }
}

async function callAPI(messages, onStream) {
  const base = state.apiBase || 'https://api.deepseek.com/v1';
  const controller = new AbortController();
  let timeoutId = null;
  const resetTimeout = () => {
    if (timeoutId) clearTimeout(timeoutId);
    timeoutId = setTimeout(() => controller.abort(), 60000);
  };
  resetTimeout();
  let resp;
  try {
    resp = await fetch(`${base}/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.apiKey}` },
      body: JSON.stringify({ model: state.model || MODEL, messages, stream: true, temperature: 0.7, max_tokens: 10000 }),
      signal: controller.signal
    });
  } catch(e) {
    if (timeoutId) clearTimeout(timeoutId);
    if (e.name === 'AbortError') throw new Error('请求超时（60秒无响应），请检查网络后重试');
    throw e;
  }
  if (!resp.ok) {
    if (timeoutId) clearTimeout(timeoutId);
    const errBody = await resp.text().catch(() => '');
    if (resp.status === 401) throw new Error('API密钥无效，请检查后重新输入');
    if (resp.status === 429) throw new Error('请求过于频繁，请稍等片刻再试');
    if (resp.status === 402) throw new Error('API账户余额不足，请充值后重试');
    throw new Error(`API请求失败 (${resp.status}): ${errBody.slice(0, 200)}`);
  }
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let fullText = '';
  let buffer = '';
  let completed = false;
  try {
    while (true) {
      const { done, value } = await reader.read();
      resetTimeout();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || !trimmed.startsWith('data: ')) continue;
        const data = trimmed.slice(6);
        if (data === '[DONE]') {
          if (!completed) { completed = true; onStream(fullText, true); }
          if (timeoutId) clearTimeout(timeoutId);
          return fullText;
        }
        try {
          const parsed = JSON.parse(data);
          const content = parsed.choices?.[0]?.delta?.content || '';
          if (content) { fullText += content; onStream(fullText, false); }
        } catch(e) {}
      }
    }
  } catch(e) {
    if (timeoutId) clearTimeout(timeoutId);
    if (e.name === 'AbortError') throw new Error('请求超时（60秒无数据），请检查网络后重试');
    throw e;
  }
  if (timeoutId) clearTimeout(timeoutId);
  if (!completed) { onStream(fullText, true); }
  return fullText;
}

function getPerson(id) { return id === 'A' ? state.personA : state.personB; }
function getOther(id) { return id === 'A' ? 'B' : 'A'; }

function getProgressPercent() {
  const mr = state.maxRounds;
  if (state.phase === 'setup' || state.phase === 'opening-a') return 0;
  if (state.phase === 'handoff-opening' || state.phase === 'opening-b') return 10;
  if (state.phase === 'generating-portrait') return 20;
  if (state.phase === 'portrait') return 25;
  if (mr === 0) {
    const turns = state.dialogueInputs.length;
    return Math.min(25 + turns * 5, 85);
  }
  const totalTurns = mr * 2;
  let turnsDone = (state.currentRound - 1) * 2;
  if (state.currentSpeaker !== state.firstSpeaker) turnsDone += 1;
  if (state.phase === 'dialogue-analysis' || state.phase === 'handoff-dialogue') turnsDone += 1;
  return 25 + Math.round((turnsDone / totalTurns) * 60);
}

const COMPRESS_AFTER = 6;

function buildDialogueMessages(msgs, includeAnalysis) {
  const total = state.dialogueInputs.length;
  if (total <= COMPRESS_AFTER) {
    for (let i = 0; i < total; i++) {
      const d = state.dialogueInputs[i];
      msgs.push({ role: 'user', content: `第${d.round}轮 — ${d.speakerName}说：\n${d.content}` });
      if (includeAnalysis && state.analyses[i]) {
        msgs.push({ role: 'assistant', content: JSON.stringify(state.analyses[i]) });
      }
    }
    return;
  }
  const keepRecent = 4;
  const compressCount = total - keepRecent;
  let summary = '【前序对话摘要】\n';
  for (let i = 0; i < compressCount; i++) {
    const d = state.dialogueInputs[i];
    summary += `第${d.round}轮 ${d.speakerName}：${d.content.slice(0, 400)}${d.content.length > 400 ? '...' : ''}\n`;
    if (state.analyses[i]) {
      const a = state.analyses[i];
      if (a.tension_score) summary += `  [紧张度${a.tension_score}/10]`;
      if (a.perspectives?.psychoanalyst?.pattern) summary += ` [模式：${a.perspectives.psychoanalyst.pattern.slice(0, 60)}]`;
      if (a.perspectives?.observer?.judgment) summary += ` [判断：${a.perspectives.observer.judgment.slice(0, 60)}]`;
      summary += '\n';
    }
  }
  msgs.push({ role: 'user', content: summary });
  for (let i = compressCount; i < total; i++) {
    const d = state.dialogueInputs[i];
    msgs.push({ role: 'user', content: `第${d.round}轮 — ${d.speakerName}说：\n${d.content}` });
    if (includeAnalysis && state.analyses[i]) {
      msgs.push({ role: 'assistant', content: JSON.stringify(state.analyses[i]) });
    }
  }
}

function buildMessagesForAnalysis(speakerInput) {
  const speaker = getPerson(state.currentSpeaker);
  const viewer = getPerson(getOther(state.currentSpeaker));
  const msgs = [
    { role: 'system', content: SYSTEM_PROMPT + getRelationshipFramework() },
    { role: 'user', content: `${state.personA.name}的开场白：\n${state.personA.opening}` },
    { role: 'user', content: `${state.personB.name}的开场白：\n${state.personB.opening}` },
  ];
  if (state.portrait) {
    msgs.push({ role: 'assistant', content: JSON.stringify(state.portrait) });
  }
  buildDialogueMessages(msgs, true);
  const nextSpeaker = getPerson(getOther(state.currentSpeaker));
  msgs.push({
    role: 'user',
    content: `第${state.currentRound}轮 — ${speaker.name}说：\n${speakerInput}\n\n请分析${speaker.name}的发言，帮助${viewer.name}理解${speaker.name}。\n\n【关键规则】questions数组中的问题必须且只能针对下一位发言者${nextSpeaker.name}。禁止向${speaker.name}提问，禁止向${viewer.name}提问，禁止同时问两个人。每个问题用'你'来称呼${nextSpeaker.name}，不要在问题中出现${speaker.name}的名字。例如：如果下一位发言者是${nextSpeaker.name}，问题应该是"${nextSpeaker.name}，你觉得..."或"你能否..."，绝不能是"${speaker.name}，你..."。严格按照JSON格式返回分析结果。`
  });
  return msgs;
}

function buildMessagesForReport() {
  const msgs = [
    { role: 'system', content: SYSTEM_PROMPT + getRelationshipFramework() },
    { role: 'user', content: `${state.personA.name}的开场白：\n${state.personA.opening}` },
    { role: 'user', content: `${state.personB.name}的开场白：\n${state.personB.opening}` },
  ];
  if (state.portrait) msgs.push({ role: 'assistant', content: JSON.stringify(state.portrait) });
  buildDialogueMessages(msgs, false);
  const isContinuation = !!state.previousReport;
  if (isContinuation) {
    msgs.push({ role: 'assistant', content: JSON.stringify(state.previousReport) });
    msgs.push({ role: 'user', content: `以上是之前的调解报告。之后双方又继续了对话（共${state.dialogueInputs.length}次发言，${state.currentRound}轮）。请基于之前的报告和新增的对话，生成一份更新的综合报告。注意：不是重写，而是在之前基础上深化和更新，保留仍然有效的分析，更新有变化的部分，补充新增的发现。严格按照JSON格式返回。` });
  } else {
    msgs.push({ role: 'user', content: `对话已全部结束（共${state.dialogueInputs.length}次发言，${state.currentRound}轮）。请生成综合报告，包含关系画像、矛盾地图、创伤链条、行动方案和风险提示。严格按照JSON格式返回。` });
  }
  return msgs;
}

function buildMessagesForReanalysis(originalInput, originalAnalysis, clarification) {
  const speaker = getPerson(state.currentSpeaker);
  const viewer = getPerson(getOther(state.currentSpeaker));
  const msgs = buildMessagesForAnalysis(originalInput);
  msgs.push({ role: 'assistant', content: JSON.stringify(originalAnalysis) });
  msgs.push({
    role: 'user',
    content: `说话者${speaker.name}的补充说明：\n${clarification}\n\n说话者声称之前的分析误解了TA。请同时考虑原始发言和TA的补充说明，但保持独立判断——不要自动接受说话者的自我解读。如果TA的补充确实澄清了之前模糊的地方，接受；如果TA的补充只是在美化自己的表达，指出这一点。请重新分析${speaker.name}的发言，帮助${viewer.name}理解${speaker.name}。严格按照JSON格式返回分析结果。`
  });
  return msgs;
}

    const gB = document.querySelector('input[name="genderB"]:checked');
    const roundsRadio = document.querySelector('input[name="rounds"]:checked');
    const relRadio = document.querySelector('input[name="reltype"]:checked');
    const roundsVal = roundsRadio ? parseInt(roundsRadio.value) : 3;

    state.personB.name = nB;
    state.personB.gender = gB ? gB.value : '';

    state.phase = 'opening-a';
    saveState();
    render();
  };
  document.getElementById('btn-back-home').onclick = () => {
    state.phase = 'home';

  document.querySelectorAll('.round-opt').forEach(label => {
    const radio = label.querySelector('input');
    const update = () => {
      document.querySelectorAll('.round-opt').forEach(l => {
        l.style.borderColor = 'var(--border)';
        l.style.background = 'transparent';
        l.style.color = 'var(--text)';

        label.style.borderColor = 'var(--primary)';
        label.style.background = 'var(--primary-bg)';
        label.style.color = 'var(--primary)';
      }
    };
    radio.addEventListener('change', update);
    update();
  });
}

function initGenderSelect(groupId) {
  const container = document.getElementById(groupId);
  if (!container) return;
  container.querySelectorAll('label').forEach(label => {
    const radio = label.querySelector('input');
    const update = () => {
      container.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
      if (radio.checked) label.classList.add('selected');
    };
    radio.addEventListener('change', update);
    update();
  });
}

function renderSettings() {
  const hasKey = !!state.apiKey;
  app.innerHTML = `
    <div class="screen active">
      <div class="progress-bar"><div class="fill" style="width:50%"></div></div>
      <div class="header">
        <h1>API 设置</h1>
        <p>配置 AI 接口，全局生效</p>
      </div>
      <div class="card" style="margin-top:20px">

            ${(() => {
              const groups = {};
              MODEL_PRESETS.forEach((p, i) => {
                if (!groups[p.group]) groups[p.group] = [];
                groups[p.group].push({ ...p, index: i });
              });
              return Object.entries(groups).map(([groupName, items]) =>
                `<optgroup label="${groupName}">${items.map(p =>
                  `<option value="${p.index}" ${state.apiBase === p.base && state.model === p.model ? 'selected' : ''}>${p.name}</option>`
                ).join('')}</optgroup>`
              ).join('');
            })()}
          </select>
          <div class="hint">选择模型服务商和档次，下拉框会自动填充地址和模型名。如名称有误可手动修改</div>
        </div>
        <div class="form-group">
          <label>API 密钥</label>
          <input type="password" id="inp-apikey" placeholder="sk-..." value="${esc(state.apiKey)}">
          <div class="hint">密钥仅保存在本地浏览器中，不会上传到任何服务器</div>
        </div>
        <div class="form-group">
          <label>API 地址</label>
          <input type="text" id="inp-apibase" placeholder="https://api.deepseek.com/v1" value="${esc(state.apiBase || 'https://api.deepseek.com/v1')}">
          <div class="hint">选择模型后自动填充，也可手动修改。如遇跨域(CORS)错误，可改为你的代理地址</div>
        </div>
        <div class="form-group">
          <label>模型名称</label>
          <input type="text" id="inp-model" placeholder="deepseek-v4-pro" value="${esc(state.model || 'deepseek-v4-pro')}">
          <div class="hint">选择模型后自动填充，也可手动修改</div>
        </div>
        <div class="form-group">
          <button class="btn btn-outline btn-sm" id="btn-test-api" style="margin-bottom:4px">测试连接</button>
          <div id="api-test-result" style="font-size:.82rem;margin-top:4px;display:none"></div>
        </div>
        <div id="settings-error" style="display:none" class="error-msg"></div>
        <button class="btn btn-primary btn-block" id="btn-save-settings">保存设置</button>
      </div>
      <div style="text-align:center;margin-top:12px">
        <button class="btn btn-outline btn-sm" id="btn-settings-back" style="color:var(--text-s);border-color:var(--border)">← 返回首页</button>
      </div>
    </div>`;
  const selModel = document.getElementById('sel-model');
  const inpApiBase = document.getElementById('inp-apibase');
  const inpModel = document.getElementById('inp-model');
  selModel.onchange = () => {
    const preset = MODEL_PRESETS[parseInt(selModel.value)];
    if (preset) {
      if (preset.base) inpApiBase.value = preset.base;
      if (preset.model) inpModel.value = preset.model;
    }
  };
  document.getElementById('btn-save-settings').onclick = () => {
    const key = document.getElementById('inp-apikey').value.trim();
    const base = inpApiBase.value.trim();
    const model = inpModel.value.trim();
    const errEl = document.getElementById('settings-error');
    if (!key) { errEl.textContent='请输入API密钥'; errEl.style.display='block'; return; }
    if (!base) { errEl.textContent='请输入API地址'; errEl.style.display='block'; return; }
    if (!model) { errEl.textContent='请输入模型名称'; errEl.style.display='block'; return; }
    state.apiKey = key;
    state.apiBase = base;
    state.model = model;
    saveState();
    state.phase = 'home';
    render();
  };
  document.getElementById('btn-settings-back').onclick = () => {
    state.phase = 'home';
    render();
  };
  document.getElementById('btn-test-api').onclick = async () => {
    const key = document.getElementById('inp-apikey').value.trim();
    const base = inpApiBase.value.trim();
    const model = inpModel.value.trim();
    const resultEl = document.getElementById('api-test-result');
    resultEl.style.display = 'block';
    resultEl.style.color = 'var(--text-s)';
    resultEl.textContent = '正在测试连接...';
    try {
      const resp = await fetch(`${base}/chat/completions`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
        body: JSON.stringify({ model: model || MODEL, messages: [{ role: 'user', content: 'hi' }], max_tokens: 1 })
      });
      if (resp.ok) {
        resultEl.style.color = 'var(--primary)';
        resultEl.textContent = '✓ 连接成功，API可用';
      } else if (resp.status === 401) {
        resultEl.style.color = 'var(--danger)';
        resultEl.textContent = '✗ API密钥无效';
      } else if (resp.status === 402) {
        resultEl.style.color = 'var(--danger)';
        resultEl.textContent = '✗ 账户余额不足';
      } else {
        resultEl.style.color = 'var(--danger)';
        resultEl.textContent = `✗ 请求失败 (${resp.status})`;
      }
    } catch(e) {
      resultEl.style.color = 'var(--danger)';
      if (e.message.includes('Failed to fetch') || e.message.includes('NetworkError') || e.message.includes('CORS') || e.name === 'TypeError') {
        resultEl.innerHTML = '✗ 跨域(CORS)错误：浏览器无法直接访问此API地址。<br><span style="font-size:.78rem;color:var(--text-s)">解决方法（二选一）：<br>① 安装浏览器扩展：Chrome 搜索"CORS Unblock"或"Allow CORS"扩展，一键开启即可<br>② 运行本地代理：同目录下 <code style="background:var(--ink-light);padding:2px 6px;border-radius:4px">node proxy.js</code>，然后将 API 地址改为 <code style="background:var(--ink-light);padding:2px 6px;border-radius:4px">http://localhost:3000/v1</code></span>';
      } else {
        resultEl.textContent = `✗ 连接失败：${e.message}`;
      }
    }
  };
}

  };
  ta.oninput = updateCC;

  };

  state.phase = 'dialogue-input';
  saveState();
  render();
}

function renderDialogueInput() {
  const speaker = getPerson(state.currentSpeaker);
  const mr = state.maxRounds;
  const isUnlimited = mr === 0;
  const turnNum = (state.currentRound - 1) * 2 + (state.currentSpeaker === state.firstSpeaker ? 1 : 2);
  const totalTurns = isUnlimited ? 0 : mr * 2;
  const roundLabel = isUnlimited ? `第 ${state.currentRound} 轮 · 无限模式` : `第 ${state.currentRound}/${mr} 轮`;
  const otherPerson = getPerson(getOther(state.currentSpeaker));
  const filteredQuestions = state.pendingQuestions.filter(q => {
    if (!q) return false;
    if (otherPerson.name && q.includes(otherPerson.name) && !q.includes(speaker.name)) return false;
    return true;
  });
  const myInputs = state.dialogueInputs.filter(d => d.speakerId === state.currentSpeaker);
  let historyHTML = '';
  if (myInputs.length > 0) {
    historyHTML = `<div style="margin-bottom:12px">
      <button class="btn btn-outline btn-sm" id="btn-toggle-history" style="font-size:.8rem;color:var(--text-s);border-color:var(--border)">查看我的历史发言 (${myInputs.length}条)</button>
      <div id="history-list" style="display:none;margin-top:8px;max-height:200px;overflow-y:auto">
        ${myInputs.map((d, i) => {
          const short = d.content.length > 100 ? d.content.slice(0, 100) + '...' : d.content;
          return `<div style="font-size:.82rem;color:var(--text-s);padding:8px 0;${i < myInputs.length - 1 ? 'border-bottom:1px solid var(--border)' : ''}">
            <span style="font-weight:600">第${d.round}轮:</span> <span class="history-short">${esc(short)}</span>${d.content.length > 100 ? `<span class="history-full" style="display:none">${esc(d.content)}</span>` : ''}
            ${d.content.length > 100 ? ` <a href="javascript:void(0)" class="history-toggle" style="font-size:.78rem;color:var(--primary)">展开</a>` : ''}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }
  let reanalysisNoteHTML = '';
  for (let i = 0; i < state.analyses.length; i++) {
    if (state.analyses[i].reanalyzed && state.dialogueInputs[i]) {
      const d = state.dialogueInputs[i];
      reanalysisNoteHTML += `<div class="tip-box" style="margin-bottom:8px;border-left-color:var(--warning)">⚠ ${esc(d.speakerName)}的第${d.round}轮发言分析经说话者补充后AI已重新评估</div>`;
    }
  }
  let partnerContextHTML = '';
  const lastAnalysisIdx = state.analyses.length - 1;
  if (lastAnalysisIdx >= 0 && state.dialogueInputs.length > 0) {
    const lastInput = state.dialogueInputs[lastAnalysisIdx];
    const lastAnalysis = state.analyses[lastAnalysisIdx];
    if (lastInput && lastInput.speakerId !== state.currentSpeaker) {
      const otherName = getPerson(getOther(state.currentSpeaker)).name;
      const relay = lastAnalysis?.relay || '';
      const bridge = lastAnalysis?.perspectives?.mediator?.bridge || '';
      const lastQuestions = Array.isArray(lastAnalysis?.questions) ? lastAnalysis.questions.filter(q => q && String(q).trim()) : [];
      partnerContextHTML = `
        <div style="margin-bottom:12px;padding:18px;background:var(--observer-bg);border-radius:var(--radius-sm);border-top:3px solid var(--observer)">
          <div style="font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--observer);margin-bottom:10px">👁 ${esc(otherName)}上一轮说了什么</div>
          <div style="font-size:.9rem;line-height:1.7;margin-bottom:10px">${esc(relay)}</div>
          ${bridge ? `<div style="font-size:.85rem;color:var(--text-s);line-height:1.6;border-top:1px solid var(--observer-border);padding-top:10px;margin-top:4px"><strong style="color:var(--mediator)">💡 建议回应方向：</strong>${esc(bridge)}</div>` : ''}
          ${lastQuestions.length ? `<div style="font-size:.85rem;color:var(--text-s);line-height:1.6;border-top:1px solid var(--observer-border);padding-top:10px;margin-top:8px"><strong style="color:var(--warning)">❓ AI 提问：</strong>${lastQuestions.map(q => esc(q)).join('；')}</div>` : ''}
        </div>`;
    }
  }
  app.innerHTML = `
    <div class="screen active">
      <div class="progress-bar"><div class="fill" style="width:${getProgressPercent()}%"></div></div>
      <div class="top-bar">
        <span class="round-indicator">${roundLabel} · ${esc(speaker.name)} 发言</span>
        <div style="display:flex;gap:8px">
          ${isUnlimited && state.dialogueInputs.length >= 2 ? `<button class="btn btn-outline btn-sm" id="btn-end-dlg" style="color:var(--danger);border-color:var(--danger)">结束并生成报告</button>` : ''}
          <button class="pause-btn" id="btn-pause">⏸ 暂停</button>
        </div>
      </div>
      ${partnerContextHTML}
      ${filteredQuestions.length ? `
        <div style="margin-bottom:12px">
          <div class="tip-box">
            <div style="font-weight:600;margin-bottom:6px">AI 提问</div>
            ${filteredQuestions.map(q => `<div style="margin-bottom:4px">· ${esc(q)}</div>`).join('')}
          </div>
        </div>` : ''}
      ${reanalysisNoteHTML}
      <div style="flex:1"></div>
      <div class="input-area">
        ${historyHTML}
        <div class="form-group" style="margin-bottom:8px">
          <textarea id="inp-dialogue" placeholder="${esc(speaker.name)}，请说出你的想法和感受..." rows="5"></textarea>
          <div class="char-count" id="char-count-dlg">0 字</div>
        </div>
        <div id="dlg-error" style="display:none" class="error-msg"></div>
        <button class="btn btn-primary btn-block" id="btn-submit-dlg">提交发言</button>
        ${isUnlimited && state.dialogueInputs.length >= 2 ? `<button class="btn btn-outline btn-block" id="btn-end-dlg-bottom" style="margin-top:8px;color:var(--danger);border-color:var(--danger);font-weight:600">📋 结束对话并生成报告 →</button>` : ''}
        <div style="text-align:center;color:var(--text-xs);font-size:.78rem;margin-top:6px">Ctrl + Enter 快速提交${!isUnlimited ? ` · 进度 ${turnNum}/${totalTurns}` : ` · 已对话 ${state.dialogueInputs.length} 次`}</div>
      </div>
    </div>`;
  const ta = document.getElementById('inp-dialogue');
  const cc = document.getElementById('char-count-dlg');
  const updateCC = () => {
    const len = ta.value.length;
    cc.textContent = `${len} 字`;
    cc.className = 'char-count' + (len > CHAR_SOFT_LIMIT ? (len > CHAR_SOFT_LIMIT*1.5 ? ' over' : ' warn') : '');
    if (len > CHAR_SOFT_LIMIT) cc.textContent += ' · 建议聚焦核心要点';
  };
  ta.oninput = updateCC;
  ta.addEventListener('keydown', e => { if (e.ctrlKey && e.key === 'Enter') document.getElementById('btn-submit-dlg').click(); });
  updateCC();
  ta.focus();
  const endBtn = document.getElementById('btn-end-dlg');
  const endBtnBottom = document.getElementById('btn-end-dlg-bottom');
  const endHandler = () => {
    if (confirm('确定要结束对话并生成综合报告吗？')) {
      state.phase = 'generating-report';
      saveState();
      render();
      generateReport();
    }
  };
  if (endBtn) endBtn.onclick = endHandler;
  if (endBtnBottom) endBtnBottom.onclick = endHandler;
  document.getElementById('btn-pause').onclick = () => showPause();
  const toggleHistBtn = document.getElementById('btn-toggle-history');
  if (toggleHistBtn) {
    toggleHistBtn.onclick = () => {
      const list = document.getElementById('history-list');
      if (list) {
        const showing = list.style.display !== 'none';
        list.style.display = showing ? 'none' : 'block';
        toggleHistBtn.textContent = showing ? `查看我的历史发言 (${myInputs.length}条)` : '收起历史发言';
      }
    };
  }
  document.querySelectorAll('.history-toggle').forEach(a => {
    a.onclick = (e) => {
      e.preventDefault();
      const parent = a.parentElement;
      const shortEl = parent.querySelector('.history-short');
      const fullEl = parent.querySelector('.history-full');
      if (shortEl && fullEl) {
        const expanding = fullEl.style.display === 'none';
        shortEl.style.display = expanding ? 'none' : 'inline';
        fullEl.style.display = expanding ? 'inline' : 'none';
        a.textContent = expanding ? '收起' : '展开';
      }
    };
  });
  document.getElementById('btn-submit-dlg').onclick = () => {
    const val = ta.value.trim();
    const errEl = document.getElementById('dlg-error');
    if (!val) { errEl.textContent='请写下你的想法'; errEl.style.display='block'; return; }
    submitDialogueInput(val);
  };
}

async function submitDialogueInput(input) {
  if (checkSafetyRisk(input)) showSafetyBar();
  const speaker = getPerson(state.currentSpeaker);
  state.dialogueInputs.push({
    round: state.currentRound,
    speakerId: state.currentSpeaker,
    speakerName: speaker.name,
    content: input
  });
  state.pendingQuestions = [];
  state.phase = 'generating-analysis';
  state.isGenerating = true;
  saveState();
  render();
  try {
    const msgs = buildMessagesForAnalysis(input);
    await callAPI(msgs, (text, done) => {
      const area = document.getElementById('streaming-area');
      if (area) area.textContent = text;
      if (done) {
        try {
          const parsed = extractJSON(text);
          state.analyses.push(parsed);
          state.currentAnalysis = parsed;
          if (checkSafetyRisk(JSON.stringify(parsed))) showSafetyBar();
          if (state.currentSpeaker !== state.firstSpeaker && parsed.tension_score != null) {
            state.tensionScores.push(Math.min(10, Math.max(1, Number(parsed.tension_score))));
          }
        } catch(e) {
          state.analyses.push({ raw: text });
          state.currentAnalysis = { raw: text };
        }
        state.isGenerating = false;
        state.phase = 'self-feedback';
        saveState();
        render();
      }
    });
  } catch(e) {
    state.isGenerating = false;
    state.dialogueInputs.pop();
    saveState();
    showRetryError(e.message);
  }
}

function renderSelfFeedback() {
  const a = state.currentAnalysis;
  if (!a || !a.perspectives) {
    advanceDialogue();
    return;
  }
  const speaker = getPerson(state.currentSpeaker);
  const isSecondSpeaker = state.currentSpeaker !== state.firstSpeaker;
  let tensionHTML = '';
  if (isSecondSpeaker && a.tension_score != null) {
    const score = Math.min(10, Math.max(1, Number(a.tension_score) || 1));
    const pct = score * 10;
    let color, desc;
    if (score <= 3) { color = 'var(--primary)'; desc = '双方相对平静'; }
    else if (score <= 6) { color = 'var(--warning)'; desc = '紧张感在上升，需要注意'; }
    else if (score <= 8) { color = '#E07A2F'; desc = '情绪高度紧张，建议冷静'; }
    else { color = 'var(--danger)'; desc = '即将爆发，强烈建议暂停'; }
    let trendHTML = '';
    if (state.tensionScores.length >= 2) {
      const prev = state.tensionScores[state.tensionScores.length - 2];
      const diff = score - prev;
      const arrow = diff > 0 ? '↑' : diff < 0 ? '↓' : '→';
      trendHTML = `<div style="font-size:.8rem;color:var(--text-s);margin-top:4px">上次: ${prev} → 这次: ${score} ${arrow}</div>`;
    }
    tensionHTML = `<div class="tension-meter" style="margin-bottom:18px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <span style="font-weight:600;font-size:.9rem">关系紧张程度</span>
        <span style="font-weight:700;font-size:1.1rem;color:${color}">${score}/10</span>
      </div>
      <div class="tension-bar">
        <div class="tension-fill" style="width:${pct}%;background:${color}"></div>
      </div>
      <div style="font-size:.8rem;color:var(--text-s);margin-top:6px">${desc}</div>
      ${trendHTML}
    </div>`;
  }
  const reanalysisDisabled = a.reanalyzed || state.reanalysisUsed;
  app.innerHTML = `
    <div class="screen active">
      <div class="progress-bar"><div class="fill" style="width:${getProgressPercent()}%"></div></div>
      <div class="header">
        <h1>${esc(speaker.name)}，AI怎么理解了你的话</h1>
        <p>确认AI是否准确理解了你的意思，然后再交给对方查看</p>
      </div>
      ${tensionHTML}
      ${a.reanalyzed ? `<div class="tip-box" style="margin-bottom:12px;border-left-color:var(--warning)">⚠ 你对本次分析提出了补充说明，AI已重新评估</div>` : ''}
      <div class="card">
        <div class="perspective-card mediator">
          <div class="label">调解者视角</div>
          <div class="sub-label">AI认为你真正在表达</div>
          <div class="content">${esc(a.perspectives?.mediator?.decode || '')}</div>
          <div class="sub-label">AI建议你换种说法</div>
          <div class="content">${esc(a.perspectives?.mediator?.bridge || '')}</div>
        </div>
        <div class="perspective-card observer">
          <div class="label">围观群众视角</div>
          <div class="sub-label">AI剥离出的客观事实</div>
          <div class="content">${esc(a.perspectives?.observer?.facts || '')}</div>
          <div class="sub-label">AI对你的判断</div>
          <div class="content">${esc(a.perspectives?.observer?.judgment || '')}</div>
          ${a.perspectives?.observer?.responsibility ? `
          <div class="sub-label">责任比例</div>
          <div class="content" style="font-weight:600">${esc(a.perspectives.observer.responsibility)}</div>` : ''}
        </div>
        <div class="perspective-card psycho">
          <div class="label">心理分析师视角</div>
          <div class="sub-label">AI识别的互动模式</div>
          <div class="content">${esc(a.perspectives?.psychoanalyst?.pattern || '')}</div>
          <div class="sub-label">AI对因果机制的解释</div>
          <div class="content">${esc(a.perspectives?.psychoanalyst?.mechanism || '')}</div>
          ${a.perspectives?.psychoanalyst?.manipulation_check && a.perspectives.psychoanalyst.manipulation_check !== 'null' ? `
          <div class="sub-label" style="color:var(--warning)">互动模式提醒</div>
          <div class="content" style="background:var(--warning-bg);padding:8px;border-radius:6px;border-left:3px solid var(--warning)">${esc(a.perspectives.psychoanalyst.manipulation_check)}</div>` : ''}
        </div>
      </div>
      <div class="tip-box" style="margin-top:16px">
        💡 <strong>提示：</strong>如果你觉得AI误解了你的意思，可以点下方"AI理解有误"补充说明。确认无误后点"继续"，分析将交给对方查看。
      </div>
      ${a.alignment && String(a.alignment).trim() && !['null','none','无','没有'].includes(String(a.alignment).trim().toLowerCase()) ? `
      <div class="tip-box" style="margin-top:12px;border-left-color:var(--primary);background:var(--primary-bg)">
        <strong>🤝 共识捕捉</strong><br>${esc(a.alignment)}
      </div>` : ''}
      <div style="margin-top:16px;display:flex;flex-direction:column;gap:10px">
        <button class="btn btn-primary btn-block" id="btn-self-ok">我明白了，继续</button>
        <button class="btn btn-outline btn-block" id="btn-reanalysis" ${reanalysisDisabled ? 'disabled style="opacity:.5;cursor:not-allowed"' : ''}>${a.reanalyzed ? '已重新评估' : 'AI理解有误'}</button>
      </div>
      <div id="reanalysis-form" style="display:none;margin-top:12px">
        <div class="card">
          <div class="form-group">
            <label>请说明AI哪里误解了你</label>
            <textarea id="inp-reanalysis" placeholder="描述你真正想表达的意思..." rows="4" style="min-height:100px"></textarea>
          </div>
          <div id="reanalysis-error" style="display:none" class="error-msg"></div>
          <div style="display:flex;gap:10px">
            <button class="btn btn-outline btn-sm" id="btn-cancel-reanalysis">取消</button>
            <button class="btn btn-primary btn-sm" id="btn-submit-reanalysis" style="flex:1">提交补充说明</button>
          </div>
        </div>
      </div>
      <div id="reanalysis-loading" style="display:none;margin-top:12px">
        <div class="card" style="text-align:center;padding:24px">
          <div class="loading-dots" style="justify-content:center"><span></span><span></span><span></span></div>
          <p style="color:var(--text-s);font-size:.9rem;margin-top:8px">AI正在重新评估...</p>
          <div class="streaming-text" id="reanalysis-stream" style="margin-top:12px;text-align:left;max-height:200px;overflow-y:auto"></div>
        </div>
      </div>
    </div>`;
  document.getElementById('btn-self-ok').onclick = () => {
    state.phase = 'handoff-dialogue';
    saveState();
    render();
  };
  const reanalysisBtn = document.getElementById('btn-reanalysis');
  const reanalysisForm = document.getElementById('reanalysis-form');
  if (reanalysisBtn && !reanalysisDisabled) {
    reanalysisBtn.onclick = () => {
      reanalysisForm.style.display = 'block';
      reanalysisBtn.style.display = 'none';
    };
  }
  const cancelBtn = document.getElementById('btn-cancel-reanalysis');
  if (cancelBtn) {
    cancelBtn.onclick = () => {
      reanalysisForm.style.display = 'none';
      reanalysisBtn.style.display = '';
    };
  }
  const submitReanalysisBtn = document.getElementById('btn-submit-reanalysis');
  if (submitReanalysisBtn) {
    submitReanalysisBtn.onclick = async () => {
      const clarification = document.getElementById('inp-reanalysis').value.trim();
      const errEl = document.getElementById('reanalysis-error');
      if (!clarification) { errEl.textContent = '请说明AI哪里误解了你'; errEl.style.display = 'block'; return; }
      const lastInput = state.dialogueInputs[state.dialogueInputs.length - 1];
      if (!lastInput) return;
      const originalInput = lastInput.content;
      const originalAnalysis = { ...a };
      delete originalAnalysis.reanalyzed;
      reanalysisForm.style.display = 'none';
      document.getElementById('reanalysis-loading').style.display = 'block';
      try {
        const msgs = buildMessagesForReanalysis(originalInput, originalAnalysis, clarification);
        const fullText = await callAPI(msgs, (text, done) => {
          const streamEl = document.getElementById('reanalysis-stream');
          if (streamEl) streamEl.textContent = text;
        });
        const parsed = extractJSON(fullText);
        parsed.reanalyzed = true;
        state.currentAnalysis = parsed;
        state.analyses[state.analyses.length - 1] = parsed;
        state.reanalysisUsed = true;
        if (parsed.tension_score != null && isSecondSpeaker) {
          const newScore = Math.min(10, Math.max(1, Number(parsed.tension_score)));
          if (state.tensionScores.length > 0) {
            state.tensionScores[state.tensionScores.length - 1] = newScore;
          }
        }
        saveState();
        render();
      } catch(e) {
        document.getElementById('reanalysis-loading').style.display = 'none';
        reanalysisForm.style.display = 'block';
        errEl.textContent = '重新评估失败：' + e.message;
        errEl.style.display = 'block';
      }
    };
  }
}

function advanceDialogue() {
  // 从当前分析中提取问题，兼容多种格式
  if (state.currentAnalysis) {
    const q = state.currentAnalysis.questions || state.currentAnalysis.question;
    if (Array.isArray(q) && q.length > 0) {
      state.pendingQuestions = q.filter(x => x && String(x).trim());
    } else if (typeof q === 'string' && q.trim()) {
      state.pendingQuestions = [q.trim()];
    } else {
      // 尝试从最近的分析记录中回退取问题
      state.pendingQuestions = [];
      for (let i = state.analyses.length - 1; i >= 0; i--) {
        const aq = state.analyses[i]?.questions;
        if (Array.isArray(aq) && aq.length > 0) {
          state.pendingQuestions = aq.filter(x => x && String(x).trim());
          break;
        }
      }
    }
  } else {
    state.pendingQuestions = [];
  }
  state.currentAnalysis = null;
  state.reanalysisUsed = false;
  const lastTension = state.tensionScores.length > 0 ? state.tensionScores[state.tensionScores.length - 1] : 0;
  const proceed = () => {
    if (state.currentSpeaker === state.firstSpeaker) {
      state.currentSpeaker = getOther(state.currentSpeaker);
      state.phase = 'dialogue-input';
    } else {
      const mr = state.maxRounds;
      if (mr > 0 && state.currentRound >= mr) {
        state.phase = 'generating-report';
        saveState();
        render();
        generateReport();
        return;
      }
      state.currentRound++;
      state.currentSpeaker = state.firstSpeaker;
      state.phase = 'dialogue-input';
    }
    saveState();
    render();
  };
  if (lastTension >= 8) {
    showCooldown(proceed);
  } else {
    proceed();
  }
}

const COOLDOWN_QUOTES = [
  '愤怒之下说出的真话，往往比沉默更伤人。先冷静，再表达。',
  '你不是在跟对方战斗，你是在跟自己的情绪战斗。给它一点时间。',
  '当你说"我恨你"的时候，其实是在说"我太在乎了，所以我受伤了"。',
  '停下来不是认输，是为了不让接下来的话变成你后悔的武器。',
  '关系里没有赢家。如果一个人赢了，两个人都输了。',
  '你现在的愤怒，可能是在保护一个更脆弱的感受。给它一点空间。'
];

function showCooldown(callback) {
  const overlay = document.createElement('div');
  overlay.className = 'cooldown-overlay';
  overlay.id = 'cooldown-overlay';
  const quote = COOLDOWN_QUOTES[Math.floor(Math.random() * COOLDOWN_QUOTES.length)];
  let remaining = 30;
  overlay.innerHTML = `
    <div class="cooldown-card">
      <div class="cooldown-breath">深呼吸</div>
      <div class="cooldown-title">⚠ 情绪温度过高</div>
      <div class="cooldown-text">
        刚才的对话紧张程度达到了危险水平。<br>
        在继续之前，请花30秒让自己冷静下来。<br>
        深呼吸：吸气4秒，屏住4秒，呼气6秒。
      </div>
      <div class="cooldown-quote">"${quote}"</div>
      <div class="cooldown-timer" id="cooldown-timer">30</div>
      <button class="btn btn-primary cooldown-btn" id="btn-cooldown-continue" disabled style="opacity:.4;cursor:not-allowed">请等待...</button>
    </div>`;
  document.body.appendChild(overlay);
  const timerEl = document.getElementById('cooldown-timer');
  const btnEl = document.getElementById('btn-cooldown-continue');
  const interval = setInterval(() => {
    remaining--;
    if (timerEl) timerEl.textContent = remaining;
    if (remaining <= 0) {
      clearInterval(interval);
      if (timerEl) timerEl.style.display = 'none';
      if (btnEl) {
        btnEl.disabled = false;
        btnEl.style.opacity = '1';
        btnEl.style.cursor = 'pointer';
        btnEl.textContent = '我冷静下来了，继续';
      }
    }
  }, 1000);
  btnEl.onclick = () => {
    if (btnEl.disabled) return;
    clearInterval(interval);
    overlay.remove();
    if (callback) callback();
  };
}

function exportReport(format, includeChat) {
  const r = state.report;
  if (!r) return;
  if (format === 'md') {
    let md = `# 关系调解报告\n\n**${state.relationshipType || '情侣'}关系** · **${state.personA.name}** & **${state.personB.name}**\n\n---\n\n`;
    md += `## 关系画像\n\n${r.relationship_portrait || ''}\n\n`;
    const consensusArr = Array.isArray(r.consensus) ? r.consensus.filter(c => c && String(c).trim() && !['null','none','无','没有'].includes(String(c).trim().toLowerCase())) : [];
    if (consensusArr.length) {
      md += `## 🤝 你们达成的共识\n\n`;
      consensusArr.forEach((c, i) => { md += `${i+1}. ${c}\n`; });
      md += '\n';
    }
    if (state.tensionScores.length > 0) {
      md += `## 紧张程度轨迹\n\n`;
      state.tensionScores.forEach((s, i) => { md += `- 第${i+1}轮: ${s}/10\n`; });
      if (state.tensionScores.length >= 2) {
        const first = state.tensionScores[0];
        const last = state.tensionScores[state.tensionScores.length - 1];
        const diff = last - first;
        md += `\n**趋势**: ${diff > 0 ? '升温↑' : diff < 0 ? '降温↓' : '平稳→'} (${first} → ${last})\n\n`;
      }
    }
    md += `## 矛盾地图\n\n`;
    (r.conflict_map || []).forEach((c, i) => {
      md += `### ${i+1}. ${c.point}\n- **类型**: ${c.type === 'factual' ? '事实分歧' : '解读分歧'}\n- **详情**: ${c.detail}\n\n`;
    });
    md += `## 创伤链条\n\n${r.trauma_chain || ''}\n\n`;

      md += `## 互动模式评估\n\n${r.manipulation_assessment}\n\n`;
    }
    md += `## 行动方案\n\n`;
    (r.action_plan || []).forEach(a => {
      md += `### 步骤 ${a.step}\n- **谁先行动**: ${a.who_moves_first || ''}${a.why_first ? '（' + a.why_first + '）' : ''}\n- **情境**: 当${a.situation}时\n- **行动**: ${a.action}\n- **原因**: ${a.rationale}\n\n`;
    });
    md += `## 风险提示\n\n> ${r.risk_warning || ''}\n`;
    // 三角色最终总结
    if (r.final_words) {
      md += `\n## 三角色最终总结\n\n`;
      if (r.final_words.mediator) md += `### 🤝 调解者的话\n\n${r.final_words.mediator}\n\n`;

    (r.conflict_map || []).forEach((c, i) => {
      text += `${i+1}. [${c.type === 'factual' ? '事实分歧' : '解读分歧'}] ${c.point}\n   ${c.detail}\n`;
    });
    text += `\n【创伤链条】\n${r.trauma_chain || ''}\n\n`;
    if (r.manipulation_assessment) {
      text += `【互动模式评估】\n${r.manipulation_assessment}\n\n`;
    }
    text += `【行动方案】\n`;
    (r.action_plan || []).forEach(a => {
      text += `步骤${a.step}: ${a.who_moves_first ? a.who_moves_first + '先行动（' + (a.why_first || '') + '）\n   ' : ''}当${a.situation}时 → ${a.action}\n   原因：${a.rationale}\n`;
    });
    text += `\n【风险提示】\n${r.risk_warning || ''}\n`;
    // 三角色最终总结
    if (r.final_words) {
      text += '\n【三角色最终总结】\n';
      if (r.final_words.mediator) text += `\n调解者的话：\n${r.final_words.mediator}\n`;
      if (r.final_words.observer) text += `\n旁观者的话：\n${r.final_words.observer}\n`;
      if (r.final_words.psychoanalyst) text += `\n心理分析师的话：\n${r.final_words.psychoanalyst}\n`;
    }
    // 完整对话记录（仅含对话模式）
    if (includeChat && state.dialogueInputs.length > 0) {
      text += `\n${'='.repeat(40)}\n【完整对话记录】\n\n`;
      text += `${state.personA.name}的开场白：\n${state.personA.opening}\n\n`;
      text += `${state.personB.name}的开场白：\n${state.personB.opening}\n\n`;
      state.dialogueInputs.forEach((d, i) => {
        const speaker = d.speakerId === 'A' ? state.personA.name : state.personB.name;
        text += `---\n第${i+1}次发言 — ${speaker}：\n${d.text}\n`;
        if (state.analyses[i]) {
          const a = state.analyses[i];
          text += `  AI中转解读：${a.relay || ''}\n`;
          text += `  紧张程度：${a.tension || '?'}/10\n`;
          if (a.alignment && String(a.alignment).trim() && !['null','none','无','没有'].includes(String(a.alignment).trim().toLowerCase())) {
            text += `  🤝 共识捕捉：${a.alignment}\n`;
          }
        }
        text += '\n';
      });
    }
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `调解报告_${state.personA.name}_${state.personB.name}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  }
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function checkSafetyRisk(text) {

function handleResume(saved) {
  const wasPaused = saved.isPaused || false;
  Object.assign(state, saved, { isPaused: false, isGenerating: false, streamingText: '' });
  if (!state.selfReview) {
    state.selfReview = { userName: '', userGender: '', relationshipDuration: '', livingStatus: '', hasChildren: '', partnerName: '', relationshipNotes: '', background: '', importedReport: null, currentLayer: 1, layerHistory: [], depthScores: [], messages: [], layerComplete: {}, report: null, selfInsights: [], previousReport: null };
  }
  if (!state.presets) state.presets = [];
  if (!state.personA.gender) state.personA.gender = '';
  if (!state.personB.gender) state.personB.gender = '';
  if (state.phase === 'generating-portrait') {
    if (state.portrait) { state.phase = 'portrait'; }
    else if (state.personA.opening && state.personB.opening) {
      render();
      generatePortrait();
      return;
    } else { state.phase = 'opening-b'; }
  } else if (state.phase === 'generating-analysis') {
    if (state.dialogueInputs.length > state.analyses.length) {
      const lastInput = state.dialogueInputs.pop();
      state.phase = 'dialogue-input';
      state.pendingQuestions = [];
    } else if (state.currentAnalysis) {
      state.phase = 'handoff-dialogue';
    } else {
      state.phase = 'dialogue-input';
    }
  } else if (state.phase === 'generating-report') {
    if (state.report) { state.phase = 'report'; }
    else { state.phase = 'report-interrupted'; }
  } else if (state.phase === 'dialogue-analysis' && !state.currentAnalysis) {
    if (state.analyses.length > 0) {
      state.currentAnalysis = state.analyses[state.analyses.length - 1];
    } else {
      state.phase = 'dialogue-input';
    }
  } else if (state.phase === 'self-feedback' && !state.currentAnalysis) {
    if (state.analyses.length > 0) {
      state.currentAnalysis = state.analyses[state.analyses.length - 1];
    } else {
      state.phase = 'dialogue-input';
    }
  } else if (state.phase === 'sr-generating') {
    if (state.selfReview.report) { state.phase = 'sr-report'; }
    else if (state.selfReview.messages.length > 0) {
      const msgs = state.selfReview.messages;
      if (msgs.length > 0 && msgs[msgs.length - 1].role === 'user') {
        let hasAssistantAfter = false;
        for (let i = msgs.length - 1; i >= 0; i--) {
          if (msgs[i].role === 'assistant') { hasAssistantAfter = true; break; }
        }
        if (!hasAssistantAfter) {
          msgs.pop();
        }
      }
      state.phase = 'sr-dialogue';
    }
    else { state.phase = 'sr-setup'; }
  }
  saveState();
  render();
  if (wasPaused) showPause();
}

  const msgs = [{ role: 'system', content: SELF_REVIEW_PROMPT }];
  let contextBlock = `用户信息：${sr.userName}${sr.userGender ? '（' + sr.userGender + '）' : ''}\n`;
  if (sr.partnerName) contextBlock += `对方：${sr.partnerName}\n`;
  if (sr.relationshipDuration) contextBlock += `恋爱时长：${sr.relationshipDuration}\n`;
  if (sr.livingStatus) contextBlock += `居住状态：${sr.livingStatus}\n`;
  if (sr.hasChildren) contextBlock += `有无孩子：${sr.hasChildren}\n`;
  if (sr.relationshipNotes) contextBlock += `备注：${sr.relationshipNotes}\n`;
  if (sr.background) contextBlock += `背景描述：${sr.background}\n`;
  if (sr.importedReport) {
    if (typeof sr.importedReport === 'string') {
      contextBlock += `\n【导入的调解报告】\n${sr.importedReport.slice(0, 3000)}\n`;
    } else {
      contextBlock += `\n【导入的调解报告摘要】\n关系画像：${sr.importedReport.relationship_portrait || ''}\n`;
      if (sr.importedReport.trauma_chain) contextBlock += `创伤链条：${sr.importedReport.trauma_chain}\n`;
      if (sr.importedReport.manipulation_assessment) contextBlock += `互动模式评估：${sr.importedReport.manipulation_assessment}\n`;
      if (sr.importedReport.action_plan) {
        contextBlock += `行动方案：${sr.importedReport.action_plan.map(a => `当${a.situation}时→${a.action}`).join('；')}\n`;
      }
    }
  }
  msgs.push({ role: 'user', content: contextBlock });
  const total = sr.messages.length;
  const keepRecent = 8;
  if (total > keepRecent) {
    let summary = '【前序对话摘要】\n';
    for (let i = 0; i < total - keepRecent; i++) {
      const m = sr.messages[i];
      if (m.role === 'assistant') {
        try {
          const p = JSON.parse(m.content);
          summary += `镜子：${(p.analysis || '').slice(0, 200)}${p.challenge ? ' | 挑战：' + p.challenge.slice(0, 100) : ''}\n`;
        } catch(e) {
          summary += `镜子：${m.content.slice(0, 200)}...\n`;
        }
      } else {
        summary += `${sr.userName}：${m.content.slice(0, 300)}${m.content.length > 300 ? '...' : ''}\n`;
      }
    }
    msgs.push({ role: 'user', content: summary });
    for (let i = total - keepRecent; i < total; i++) {
      const m = sr.messages[i];
      msgs.push({ role: m.role, content: m.content });
    }
  } else {
    for (const m of sr.messages) {
      msgs.push({ role: m.role, content: m.content });
    }
  }
  const layerName = LAYER_NAMES[sr.currentLayer - 1] || '未知';
  const layerDesc = LAYER_DESC[sr.currentLayer - 1] || '';
  // 不再在层级提示中重复用户输入，因为sr.messages已经包含了
  msgs.push({
    role: 'user',
    content: `当前层级：第${sr.currentLayer}层——${layerName}（${layerDesc}）\n请按照当前层级的要求分析${sr.userName}的发言，返回JSON格式。`
  });
  return msgs;
}

async function submitSRInput(input) {
  if (checkSafetyRisk(input)) showSafetyBar();
  const sr = state.selfReview;
  sr.messages.push({ role: 'user', content: input });
  state.phase = 'sr-generating';
  state.isGenerating = true;
  saveState();
  render();
  try {
    const msgs = buildSRMessages(input);
    const text = await callAPI(msgs, (t, done) => {
      const area = document.getElementById('streaming-area');
      if (area) area.textContent = t;
      if (done) {
        try {
          const parsed = extractJSON(t);
          sr.messages.push({ role: 'assistant', content: JSON.stringify(parsed) });
          if (parsed.depth_score) sr.depthScores.push(Math.min(10, Math.max(1, Number(parsed.depth_score))));
          if (parsed.self_insight && parsed.self_insight !== 'null' && String(parsed.self_insight).trim()) {
            sr.selfInsights = sr.selfInsights || [];
            sr.selfInsights.push(parsed.self_insight);
          }
          if (parsed.layer_complete === true) {
            // 以当前实际层级为准，防止AI返回不一致的layer导致跳层
            const completedLayer = sr.currentLayer;
            sr.layerComplete[completedLayer] = true;
            if (completedLayer < 6) {
              sr.currentLayer = completedLayer + 1;
              sr.messages.push({ role: 'user', content: `【我已准备好进入第${sr.currentLayer}层——${LAYER_NAMES[sr.currentLayer-1]}】` });
            }
          } else if (parsed.layer) {
            // AI建议的层级只作为参考，不允许向前跳层
            const suggestedLayer = parseInt(parsed.layer);
            if (suggestedLayer > 0 && suggestedLayer <= sr.currentLayer) {
              sr.currentLayer = suggestedLayer;
            }
          }
          state.isGenerating = false;
          state.phase = 'sr-dialogue';
          saveState();
          render();
        } catch(e) {
          sr.messages.push({ role: 'assistant', content: t });
          state.isGenerating = false;
          state.phase = 'sr-dialogue';
          saveState();
          render();
        }
      }
    });
  } catch(e) {
    state.isGenerating = false;
    state.phase = 'sr-dialogue';
    if (sr.messages.length > 0 && sr.messages[sr.messages.length - 1].role === 'user') {
      sr.messages.pop();
    }
    saveState();
    render();
    setTimeout(() => {
      const errEl = document.getElementById('sr-error');
      if (errEl) {
        errEl.textContent = '分析失败：' + e.message;
        errEl.style.display = 'block';
      }
    }, 100);
  }
}

function retrySRAnalysis() {
  const sr = state.selfReview;
  if (sr.messages.length > 0 && sr.messages[sr.messages.length - 1].role === 'assistant') {
    sr.messages.pop();
    if (sr.depthScores.length > 0) sr.depthScores.pop();
  }
  if (sr.messages.length > 0 && sr.messages[sr.messages.length - 1].role === 'user') {
    const lastInput = sr.messages.pop();
    state.isGenerating = false;
    saveState();
    submitSRInput(lastInput.content);
  }
}

  const sr = state.selfReview;

        assistantMsgs.unshift(sr.messages[i]);
      }
    }
    for (let ai = 0; ai < assistantMsgs.length; ai++) {
      const m = assistantMsgs[ai];
      const isOldest = ai === 0 && assistantMsgs.length > 1;

        const parsed = JSON.parse(m.content);

          <div class="mirror-card" ${isOldest ? 'style="opacity:.7"' : ''}>
            <div class="label">🪞 镜子分析</div>
