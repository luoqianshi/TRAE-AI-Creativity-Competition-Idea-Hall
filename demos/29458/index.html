            ${parsed.warmth ? `<div class="warmth-box"><div class="warmth-label">🏮 灯塔</div>${esc(parsed.warmth)}</div>` : ''}
            ${parsed.insight && parsed.insight !== 'null' ? `<div class="insight">💡 ${esc(parsed.insight)}</div>` : ''}
            ${parsed.self_insight && parsed.self_insight !== 'null' ? `<div class="self-insight-box"><div class="si-label">✨ 你自己的觉察</div>${esc(parsed.self_insight)}</div>` : ''}
            ${parsed.next_question ? `<div class="tip-box" style="margin-top:14px">❓ ${esc(parsed.next_question)}</div>` : ''}
          </div>`;
      } catch(e) {
        lastResponseHTML += `<div class="mirror-card" ${isOldest ? 'style="opacity:.7"' : ''}><div class="content">${esc(m.content)}</div><div class="tip-box" style="margin-top:10px;border-left-color:var(--warning)">⚠ AI回复格式异常，建议重试</div></div>`;
      }
    }
  }
  let advanceHintHTML = '';
  if (sr.currentLayer >= 3 && !sr.layerComplete[sr.currentLayer] && sr.depthScores.length >= 4) {
    advanceHintHTML = `<div class="tip-box" style="margin-bottom:14px;border-left-color:var(--primary);background:var(--primary-bg)">💡 你已经触及了一些深层模式。如果觉得聊够了，随时可以点击"结束并生成报告"。</div>`;
  } else if (sr.currentLayer === 6 && sr.layerComplete[6]) {
    advanceHintHTML = `<div class="tip-box" style="margin-bottom:14px;border-left-color:var(--primary);background:var(--primary-bg)">✅ 苏格拉底整合已完成。你可以继续深入对话，或点击"结束并生成报告"查看你的自我审查报告。</div>`;
  } else if (!sr.layerComplete[sr.currentLayer] && sr.currentLayer <= 5) {
    const layerUserMsgs = sr.messages.filter(m => m.role === 'user' && !m.content.startsWith('【')).length;
    if (layerUserMsgs >= 5) {
      advanceHintHTML = `<div class="tip-box" style="margin-bottom:14px;border-left-color:var(--warning)">💡 你已经在这层聊了不少了。如果觉得这层聊够了，可以点下方"进入下一层"。</div>`;
    }
  }
  let historyHTML = '';
  if (sr.messages.length > 3) {
    const showCount = Math.min(sr.messages.length - 3, 6);
    const startIdx = Math.max(0, sr.messages.length - 3 - showCount);
    historyHTML = '<div style="margin-bottom:12px"><button class="btn btn-outline btn-sm" id="btn-sr-history" style="font-size:.8rem;color:var(--text-s);border-color:var(--border)">查看对话历史 (' + userMsgCount + '条)</button><div id="sr-history-list" style="display:none;margin-top:8px;max-height:200px;overflow-y:auto">';
    for (let i = startIdx; i < sr.messages.length; i++) {
      if (i >= sr.messages.length - 3 && sr.messages[i].role === 'assistant') continue;
      const m = sr.messages[i];
      const isUser = m.role === 'user';
      const short = m.content.length > 80 ? m.content.slice(0, 80) + '...' : m.content;
      historyHTML += `<div style="font-size:.82rem;padding:6px 0;color:${isUser ? 'var(--text)' : 'var(--psycho)'};border-bottom:1px solid var(--border)"><strong>${isUser ? esc(sr.userName) : '镜子'}:</strong> ${esc(short)}</div>`;
    }
    historyHTML += '</div></div>';
  }
  const canAdvance = !sr.layerComplete[sr.currentLayer] && sr.currentLayer <= 5;
  app.innerHTML = `
    <div class="screen active">
      <div class="progress-bar"><div class="fill" style="width:${layerProgress}%"></div></div>
      <div class="top-bar">
        <span class="round-indicator">第${sr.currentLayer}层 · ${esc(layerName)} <span class="beta-badge">测试版</span></span>
        <div style="display:flex;gap:8px">
          <button class="btn btn-outline btn-sm" id="btn-sr-end" style="color:var(--danger);border-color:var(--danger)">结束并生成报告</button>
          <button class="pause-btn" id="btn-pause">⏸ 暂停</button>
        </div>
      </div>
      ${layerIndicatorHTML}
      <div class="depth-meter">
        <span class="depth-label">对话进展</span>
        <div class="depth-bar"><div class="depth-fill" style="width:${lastDepth * 10}%"></div></div>
      </div>
      <div class="tip-box" style="margin-bottom:6px;font-size:.78rem;color:var(--text-s)">进度条反映对话深入程度，不是对你个人的评估</div>
      <div class="tip-box" style="margin-bottom:14px">${esc(layerDesc)}</div>
      <div class="tip-box" style="margin-bottom:14px;background:var(--primary-bg);border-left:3px solid var(--primary);color:var(--text-m)">💡 ${esc(layerGuide)}</div>
      ${advanceHintHTML}
      ${lastResponseHTML}
      ${!lastResponseHTML && sr.messages.length === 0 ? `
      <div class="mirror-card">
        <div class="label">镜子准备好了</div>
        <div class="content">现在开始第1层——<strong>表面层</strong>。请说出你最近的困扰，或者你在这段关系中最想聊的事情。镜子会帮你区分哪些是事实，哪些是你的解读。</div>
        <div class="tip-box" style="margin-top:14px">❓ 你最近最困扰的一件事是什么？说说看。</div>
      </div>` : ''}
      ${historyHTML}
      <div style="flex:1"></div>
      <div class="input-area">
        <div class="form-group" style="margin-bottom:8px">
          <textarea id="inp-sr-dialogue" placeholder="${esc(sr.userName)}，说出你的想法和感受..." rows="4"></textarea>
          <div class="char-count" id="char-count-sr">0 字</div>
        </div>
        <div id="sr-error" style="display:none" class="error-msg"></div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary" id="btn-sr-submit" style="flex:1">提交</button>
          ${canAdvance ? `<button class="btn btn-outline" id="btn-sr-advance" style="white-space:nowrap">进入下一层 →</button>` : ''}
        </div>
        <div style="text-align:center;color:var(--text-xs);font-size:.78rem;margin-top:6px">Ctrl + Enter 快速提交 · 已对话 ${userMsgCount} 条</div>
      </div>
    </div>`;
  const ta = document.getElementById('inp-sr-dialogue');
  const cc = document.getElementById('char-count-sr');
  const updateCC = () => {
    const len = ta.value.length;
    cc.textContent = `${len} 字`;
    cc.className = 'char-count' + (len > CHAR_SOFT_LIMIT ? ' warn' : '');
  };
  ta.oninput = updateCC;
  ta.addEventListener('keydown', e => { if (e.ctrlKey && e.key === 'Enter') document.getElementById('btn-sr-submit').click(); });
  ta.focus();
  document.getElementById('btn-sr-submit').onclick = () => {
    const val = ta.value.trim();
    const errEl = document.getElementById('sr-error');
    if (!val) { errEl.textContent='请输入你的想法'; errEl.style.display='block'; return; }
    submitSRInput(val);
  };
  const advanceBtn = document.getElementById('btn-sr-advance');
  if (advanceBtn) {
    advanceBtn.onclick = () => {
      const sr = state.selfReview;
      if (sr.currentLayer <= 5) {
        const oldLayer = sr.currentLayer;
        sr.layerComplete[sr.currentLayer] = true;
        sr.currentLayer++;
        sr.messages.push({ role: 'user', content: `【我已准备好进入第${sr.currentLayer}层——${LAYER_NAMES[sr.currentLayer-1]}】` });
        saveState();
        render();
      }
    };

  document.querySelectorAll('.layer-dot[data-layer]').forEach(dot => {
    dot.onclick = () => {

      if (targetLayer < sr.currentLayer || sr.layerComplete[targetLayer]) {
        const oldLayer = sr.currentLayer;
        sr.currentLayer = targetLayer;
        if (oldLayer !== targetLayer) {
          sr.messages.push({ role: 'user', content: `【我选择回到第${targetLayer}层——${LAYER_NAMES[targetLayer-1]}继续探讨】` });

        render();

    }
  };
  const histBtn = document.getElementById('btn-sr-history');
  if (histBtn) {
    histBtn.onclick = () => {
      const list = document.getElementById('sr-history-list');
      if (list) list.style.display = list.style.display === 'none' ? 'block' : 'none';

  }
}

async function generateSRReport() {
  const sr = state.selfReview;
  state.phase = 'sr-generating';
  state.isGenerating = true;
  const reportMsgs = [{ role: 'system', content: SELF_REVIEW_PROMPT }];
  let ctx = `用户信息：${sr.userName}${sr.userGender ? '（' + sr.userGender + '）' : ''}\n`;
  if (sr.partnerName) ctx += `对方：${sr.partnerName}\n`;
  if (sr.relationshipDuration) ctx += `恋爱时长：${sr.relationshipDuration}\n`;
  if (sr.livingStatus) ctx += `居住状态：${sr.livingStatus}\n`;
  if (sr.hasChildren) ctx += `有无孩子：${sr.hasChildren}\n`;
  if (sr.relationshipNotes) ctx += `备注：${sr.relationshipNotes}\n`;
  if (sr.background) ctx += `背景描述：${sr.background}\n`;
  if (sr.importedReport) {
    if (typeof sr.importedReport === 'string') {
      ctx += `\n【导入的调解报告】\n${sr.importedReport.slice(0, 2000)}\n`;
    } else {
      ctx += `\n【导入的调解报告摘要】\n关系画像：${sr.importedReport.relationship_portrait || ''}\n`;
      if (sr.importedReport.trauma_chain) ctx += `创伤链条：${sr.importedReport.trauma_chain}\n`;
    }
  }
  reportMsgs.push({ role: 'user', content: ctx });
  if (sr.previousReport) {
    reportMsgs.push({ role: 'assistant', content: JSON.stringify(sr.previousReport) });
    reportMsgs.push({ role: 'user', content: `以上是之前的自我审查报告。之后用户又继续了对话。请基于之前的报告和新增的对话，生成一份更新的综合报告。注意：不是重写，而是在之前基础上深化和更新。` });
  }
  let summary = '【自我审查对话摘要】\n';
  for (const m of sr.messages) {
    if (m.role === 'assistant') {
      try {
        const p = JSON.parse(m.content);
        summary += `镜子：${(p.analysis || '').slice(0, 200)}${p.challenge ? ' | 挑战：' + p.challenge.slice(0, 100) : ''}${p.next_question ? ' | 追问：' + p.next_question.slice(0, 100) : ''}\n`;
      } catch(e) {
        summary += `镜子：${m.content.slice(0, 200)}...\n`;
      }
    } else {
      summary += `${sr.userName}：${m.content.slice(0, 300)}${m.content.length > 300 ? '...' : ''}\n`;
    }
  }
  reportMsgs.push({ role: 'user', content: summary });
  if (sr.selfInsights && sr.selfInsights.length > 0) {
    reportMsgs.push({ role: 'user', content: `【用户在对话中自己承认/意识到的东西】\n${sr.selfInsights.map((s, i) => `${i+1}. ${s}`).join('\n')}` });
  }
  reportMsgs.push({
    role: 'user',
    content: `自我审查对话已结束。请生成自我审查报告，严格返回以下JSON格式：
{
  "core_blind_spots": ["盲区1", "盲区2"],
  "recurring_patterns": [{"pattern": "模式描述", "evidence": "对话中的证据", "origin": "可能的根源"}],
  "key_fears": ["核心恐惧1", "核心恐惧2"],
  "user_strengths": ["用户在对话中展现的力量或资源1", "力量2"],
  "breakthrough_moments": [{"moment": "突破时刻描述", "significance": "为什么这是突破"}],
  "self_insights": ["用户自己承认或意识到的东西1（不是AI分析的，是用户自己说的）", "自我觉察2"],
  "fact_vs_interpretation": [{"fact": "客观事实", "interpretation": "用户的解读", "reality_check": "更客观的视角"}],
  "action_plan": [{"situation": "当XX发生时", "action": "你应该做XX", "rationale": "因为XX"}],
  "growth_summary": "2-3句话总结用户的自我觉察成长",
  "relationship_impact": "这些发现如何影响你和对方的关系，2-3句话",
  "final_words": {
    "mirror": "镜子视角的最终总结——你看到的真实的TA，不带修饰的真相，2-3句话",
    "lighthouse": "灯塔视角的最终总结——你相信TA可以成为的样子，温暖而坚定，2-3句话"
  }
}`
  });
  saveState();
  render();
  try {
    const text = await callAPI(reportMsgs, (t, done) => {
      const area = document.getElementById('streaming-area');
      if (area) area.textContent = t;
      if (done) {
        try {
          sr.report = extractJSON(t);
        } catch(e) {
          sr.report = { raw: t };
        }
        state.isGenerating = false;
        state.phase = 'sr-report';
        saveState();
        render();
      }
    });
  } catch(e) {
    state.isGenerating = false;
    state.phase = 'sr-dialogue';
    saveState();
    render();
    setTimeout(() => {
      const errEl = document.getElementById('sr-error');
      if (errEl) {
        errEl.textContent = '报告生成失败：' + e.message + '，请重试';
        errEl.style.display = 'block';
      }
    }, 100);
  }
}

  if (!r) return;
  const blindSpots = r.core_blind_spots || [];
  const patterns = r.recurring_patterns || [];
  const fears = r.key_fears || [];
  const fvi = r.fact_vs_interpretation || [];
  const actions = r.action_plan || [];
  let depthChartHTML = '';
  if (sr.depthScores.length > 0) {
    const depthLabel = s => s <= 3 ? '表层探索' : s <= 6 ? '深入对话' : s <= 8 ? '触及核心' : '深刻觉察';
    const bars = sr.depthScores.map((s, i) => {
      const color = s <= 3 ? 'var(--danger)' : s <= 6 ? 'var(--warning)' : 'var(--primary)';
      return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <span style="font-size:.85rem;font-weight:600;min-width:50px">第${i+1}次</span>
        <div class="tension-bar" style="flex:1">
          <div class="tension-fill" style="width:${s*10}%;background:${color}"></div>
        </div>
        <span style="font-size:.82rem;font-weight:600;color:${color};min-width:70px">${depthLabel(s)}</span>
      </div>`;
    }).join('');
    depthChartHTML = `<div class="report-section"><h2>对话进展</h2><p style="font-size:.85rem;color:var(--text-s);margin-bottom:12px">反映对话逐步深入的过程，不是对你个人的评估</p>${bars}</div>`;
  }
  app.innerHTML = `
    <div class="screen active">
      <div class="progress-bar"><div class="fill" style="width:100%"></div></div>
      <div class="header">
        <h1>自我审查报告 <span class="beta-badge">测试版</span></h1>
        <p>${esc(sr.userName)} · 洋葱式深层审查</p>
      </div>
      ${blindSpots.length ? `
      <div class="report-section">
        <h2>核心盲区</h2>
        ${blindSpots.map(b => `<div class="conflict-item interpretive"><span class="tag">盲区</span><div style="font-size:.9rem;line-height:1.7">${esc(b)}</div></div>`).join('')}
      </div>` : ''}
      ${depthChartHTML}
      ${fvi.length ? `
      <div class="report-section">
        <h2>事实 vs 解读</h2>
        ${fvi.map(f => `<div class="conflict-item factual">
          <span class="tag">事实</span><div style="font-size:.9rem">${esc(f.fact || '')}</div>
          <div style="margin-top:6px"><span class="tag" style="background:var(--psycho-bg);color:var(--psycho)">你的解读</span><div style="font-size:.9rem">${esc(f.interpretation || '')}</div></div>
          <div style="margin-top:6px"><span class="tag" style="background:var(--primary-bg);color:var(--primary)">客观视角</span><div style="font-size:.9rem">${esc(f.reality_check || '')}</div></div>
        </div>`).join('')}
      </div>` : ''}
      ${patterns.length ? `
      <div class="report-section">
        <h2>重复模式</h2>
        ${patterns.map(p => `<div class="conflict-item interpretive">
          <div style="font-weight:600;margin-bottom:4px">${esc(p.pattern || '')}</div>
          <div style="font-size:.88rem;color:var(--text-s)">证据：${esc(p.evidence || '')}</div>
          <div style="font-size:.88rem;color:var(--psycho);margin-top:4px">根源：${esc(p.origin || '')}</div>
        </div>`).join('')}
      </div>` : ''}
      ${fears.length ? `
      <div class="report-section">
        <h2>核心恐惧</h2>
        ${fears.map(f => `<div class="risk-box"><p style="line-height:1.7">${esc(f)}</p></div>`).join('')}
      </div>` : ''}
      ${r.user_strengths && r.user_strengths.length ? `
      <div class="report-section">
        <h2>💪 你展现的力量</h2>
        <p style="font-size:.9rem;color:var(--text-s);margin-bottom:12px">这些是你在对话中展现的勇气和资源——你比你以为的更有力量</p>
        ${r.user_strengths.map(s => `<div class="conflict-item" style="border-left-color:var(--primary)"><span class="tag" style="background:var(--primary-bg);color:var(--primary)">力量</span><div style="font-size:.9rem;line-height:1.7">${esc(s)}</div></div>`).join('')}
      </div>` : ''}
      ${r.breakthrough_moments && r.breakthrough_moments.length ? `
      <div class="report-section">
        <h2>✨ 突破时刻</h2>
        <p style="font-size:.9rem;color:var(--text-s);margin-bottom:12px">这些是对话中你真正看见自己的瞬间</p>
        ${r.breakthrough_moments.map(b => `<div class="conflict-item" style="border-left-color:#4caf50"><span class="tag" style="background:#e8f5e9;color:#4caf50">突破</span><div style="font-weight:600;margin-bottom:2px">${esc(b.moment || '')}</div><div style="font-size:.88rem;color:var(--text-s)">${esc(b.significance || '')}</div></div>`).join('')}
      </div>` : ''}
      ${r.self_insights && r.self_insights.length ? `
      <div class="report-section">
        <h2>🪞 你自己的觉察</h2>
        <p style="font-size:.9rem;color:var(--text-s);margin-bottom:12px">这些不是AI的分析——是你自己说出的话</p>
        ${r.self_insights.map(s => `<div class="conflict-item" style="border-left-color:var(--analyst)"><span class="tag" style="background:var(--analyst-bg);color:var(--analyst)">自我觉察</span><div style="font-size:.9rem;line-height:1.7">${esc(s)}</div></div>`).join('')}
      </div>` : ''}
      ${actions.length ? `
      <div class="report-section">
        <h2>行动方案</h2>
        ${actions.map((a, i) => `<div class="action-step">
          <div class="step-num">步骤 ${i + 1}</div>
          <div style="margin:4px 0"><strong>情境：</strong>${esc(a.situation || '')}</div>
          <div style="margin:4px 0"><strong>行动：</strong>${esc(a.action || '')}</div>
          <div style="font-size:.88rem;color:var(--text-s)"><strong>原因：</strong>${esc(a.rationale || '')}</div>
        </div>`).join('')}
      </div>` : ''}
      ${r.growth_summary ? `
      <div class="report-section">
        <h2>成长总结</h2>
        <p style="line-height:1.7">${esc(r.growth_summary)}</p>
      </div>` : ''}
      ${r.relationship_impact ? `
      <div class="report-section">
        <h2>对关系的影响</h2>
        <p style="line-height:1.7">${esc(r.relationship_impact)}</p>
      </div>` : ''}
      ${r.final_words ? `
      <div class="report-section">
        <h2>最后的话</h2>
        <div style="margin-bottom:16px;padding:20px;background:var(--psycho-bg);border-radius:var(--radius-sm);border-top:3px solid var(--psycho)">
          <div style="font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--psycho);margin-bottom:10px">🪞 镜子的话</div>
          <p style="line-height:1.8;font-size:.95rem">${esc(r.final_words.mirror || '')}</p>
        </div>
        <div style="padding:20px;background:var(--primary-bg);border-radius:var(--radius-sm);border-top:3px solid var(--primary)">
          <div style="font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--primary);margin-bottom:10px">🏮 灯塔的话</div>
          <p style="line-height:1.8;font-size:.95rem">${esc(r.final_words.lighthouse || '')}</p>
        </div>
      </div>` : ''}
      <div class="export-bar">
        <button class="btn btn-primary" id="btn-sr-continue">继续审查</button>
        <button class="btn btn-outline" id="btn-sr-export-txt">导出 TXT（仅报告）</button>
        <button class="btn btn-outline" id="btn-sr-export-txt-full">导出 TXT（含对话）</button>
        <button class="btn btn-outline" id="btn-sr-export-md">导出 MD（仅报告）</button>
        <button class="btn btn-outline" id="btn-sr-export-md-full">导出 MD（含对话）</button>
        <button class="btn btn-outline" id="btn-sr-regen" style="color:var(--warning);border-color:var(--warning)">重新生成报告</button>
        <button class="btn btn-outline" id="btn-sr-new">新的自我审查</button>
        <button class="btn btn-outline" id="btn-sr-home">返回首页</button>
      </div>
    </div>`;
  document.getElementById('btn-sr-continue').onclick = () => {
    const sr = state.selfReview;
    sr.previousReport = sr.report;
    sr.report = null;
    state.phase = 'sr-dialogue';
    saveState();
    render();
  };
  document.getElementById('btn-sr-export-txt').onclick = () => exportSRReport('txt', false);
  document.getElementById('btn-sr-export-txt-full').onclick = () => exportSRReport('txt', true);
  document.getElementById('btn-sr-export-md').onclick = () => exportSRReport('md', false);
  document.getElementById('btn-sr-export-md-full').onclick = () => exportSRReport('md', true);
  document.getElementById('btn-sr-regen').onclick = () => {
    if (confirm('确定要重新生成报告吗？当前报告将被覆盖。')) {
      state.selfReview.report = null;
      generateSRReport();
    }
  };
  document.getElementById('btn-sr-new').onclick = () => {
    if (confirm('确定要开始新的自我审查吗？当前记录将被清除。')) {
      state.selfReview = {
        userName: '', userGender: '', relationshipDuration: '', livingStatus: '', hasChildren: '', partnerName: '', relationshipNotes: '', background: '', importedReport: null,
        currentLayer: 1, layerHistory: [], depthScores: [], messages: [],
        layerComplete: {}, report: null, selfInsights: [], previousReport: null,
      };
      state.phase = 'sr-setup';
      saveState();
      render();
    }
  };
  document.getElementById('btn-sr-home').onclick = () => {
    state.phase = 'home';
    render();
  };
}

function exportSRReport(format, includeChat) {
  const sr = state.selfReview;
  const r = sr.report;
  if (!r) return;
  function buildChatSection(format) {
    if (!includeChat || !sr.messages || sr.messages.length === 0) return '';
    let chat = '';
    if (format === 'md') {
      chat += `\n---\n\n## 完整对话记录\n\n`;
      sr.messages.forEach(m => {
        if (m.role === 'user') {
          if (m.content.startsWith('【')) {
            chat += `> *${m.content}*\n\n`;
          } else {
            chat += `**${sr.userName}：** ${m.content}\n\n`;
          }
        } else {
          try {
            const p = JSON.parse(m.content);
            chat += `**🪞 镜子：** ${p.analysis || ''}\n\n`;
            if (p.challenge) chat += `> ⚡ ${p.challenge}\n\n`;
            if (p.warmth) chat += `> 🏮 ${p.warmth}\n\n`;
            if (p.next_question) chat += `> ❓ ${p.next_question}\n\n`;
          } catch(e) {
            chat += `**镜子：** ${m.content}\n\n`;
          }
        }
      });
    } else {
      chat += `\n${'='.repeat(40)}\n完整对话记录\n${'='.repeat(40)}\n\n`;
      sr.messages.forEach(m => {
        if (m.role === 'user') {
          if (m.content.startsWith('【')) {
            chat += `[系统] ${m.content}\n`;
          } else {
            chat += `${sr.userName}：${m.content}\n`;
          }
        } else {
          try {
            const p = JSON.parse(m.content);
            chat += `镜子：${p.analysis || ''}\n`;
            if (p.challenge) chat += `  挑战：${p.challenge}\n`;
            if (p.warmth) chat += `  灯塔：${p.warmth}\n`;
            if (p.next_question) chat += `  追问：${p.next_question}\n`;
            chat += '\n';
          } catch(e) {
            chat += `镜子：${m.content}\n\n`;
          }
        }
      });
    }
    return chat;
  }
  if (format === 'md') {
    let md = `# 自我审查报告\n\n**${sr.userName}** · 洋葱式深层审查\n\n---\n\n`;
    if (r.core_blind_spots && r.core_blind_spots.length) {
      md += `## 核心盲区\n\n`;
      r.core_blind_spots.forEach(b => { md += `- ${b}\n`; });
      md += '\n';
    }
    if (sr.depthScores.length > 0) {
      const depthLabel = s => s <= 3 ? '表层探索' : s <= 6 ? '深入对话' : s <= 8 ? '触及核心' : '深刻觉察';
      md += `## 对话进展\n\n`;
      sr.depthScores.forEach((s, i) => { md += `- 第${i+1}次: ${depthLabel(s)}\n`; });
      md += '\n';
    }
    if (r.fact_vs_interpretation && r.fact_vs_interpretation.length) {
      md += `## 事实 vs 解读\n\n`;
      r.fact_vs_interpretation.forEach(f => {
        md += `### 事实\n${f.fact || ''}\n\n### 你的解读\n${f.interpretation || ''}\n\n### 客观视角\n${f.reality_check || ''}\n\n`;
      });
    }
    if (r.recurring_patterns && r.recurring_patterns.length) {
      md += `## 重复模式\n\n`;
      r.recurring_patterns.forEach(p => {
        md += `### ${p.pattern || ''}\n- **证据**：${p.evidence || ''}\n- **根源**：${p.origin || ''}\n\n`;
      });
    }
    if (r.key_fears && r.key_fears.length) {
      md += `## 核心恐惧\n\n`;
      r.key_fears.forEach(f => { md += `- ${f}\n`; });
      md += '\n';
    }
    if (r.user_strengths && r.user_strengths.length) {
      md += `## 💪 你展现的力量\n\n`;
      r.user_strengths.forEach(s => { md += `- ${s}\n`; });
      md += '\n';
    }
    if (r.breakthrough_moments && r.breakthrough_moments.length) {
      md += `## ✨ 突破时刻\n\n`;
      r.breakthrough_moments.forEach(b => { md += `- **${b.moment || ''}**：${b.significance || ''}\n`; });
      md += '\n';
    }
    if (r.self_insights && r.self_insights.length) {
      md += `## 🪞 你自己的觉察\n\n`;
      r.self_insights.forEach(s => { md += `- ${s}\n`; });
      md += '\n';
    }
    if (r.action_plan && r.action_plan.length) {
      md += `## 行动方案\n\n`;
      r.action_plan.forEach((a, i) => {
        md += `### 步骤 ${i+1}\n- **情境**：${a.situation || ''}\n- **行动**：${a.action || ''}\n- **原因**：${a.rationale || ''}\n\n`;
      });
    }
    if (r.growth_summary) md += `## 成长总结\n\n${r.growth_summary}\n\n`;
    if (r.relationship_impact) md += `## 对关系的影响\n\n${r.relationship_impact}\n\n`;
    if (r.final_words) {
      md += `## 最后的话\n\n`;
      if (r.final_words.mirror) md += `### 🪞 镜子的话\n\n${r.final_words.mirror}\n\n`;
      if (r.final_words.lighthouse) md += `### 🏮 灯塔的话\n\n${r.final_words.lighthouse}\n\n`;
    }
    md += buildChatSection('md');
    const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `自我审查报告_${sr.userName}.md`;
    a.click();
    URL.revokeObjectURL(url);
  } else {
    let text = `自我审查报告\n${sr.userName} · 洋葱式深层审查\n${'='.repeat(40)}\n\n`;
    if (r.core_blind_spots && r.core_blind_spots.length) {
      text += `【核心盲区】\n`;
      r.core_blind_spots.forEach(b => { text += `· ${b}\n`; });
      text += '\n';
    }
    if (sr.depthScores.length > 0) {
      const depthLabel = s => s <= 3 ? '表层探索' : s <= 6 ? '深入对话' : s <= 8 ? '触及核心' : '深刻觉察';
      text += `【对话进展】\n`;
      sr.depthScores.forEach((s, i) => { text += `第${i+1}次: ${depthLabel(s)}\n`; });
      text += '\n';
    }
    if (r.fact_vs_interpretation && r.fact_vs_interpretation.length) {
      text += `【事实vs解读】\n`;
      r.fact_vs_interpretation.forEach(f => {
        text += `事实：${f.fact || ''}\n你的解读：${f.interpretation || ''}\n客观视角：${f.reality_check || ''}\n\n`;
      });
    }
    if (r.recurring_patterns && r.recurring_patterns.length) {
      text += `【重复模式】\n`;
      r.recurring_patterns.forEach(p => {
        text += `模式：${p.pattern || ''}\n证据：${p.evidence || ''}\n根源：${p.origin || ''}\n\n`;
      });
    }
    if (r.key_fears && r.key_fears.length) {
      text += `【核心恐惧】\n`;
      r.key_fears.forEach(f => { text += `· ${f}\n`; });
      text += '\n';
    }
    if (r.user_strengths && r.user_strengths.length) {
      text += `【你展现的力量】\n`;
      r.user_strengths.forEach(s => { text += `· ${s}\n`; });
      text += '\n';
    }
    if (r.breakthrough_moments && r.breakthrough_moments.length) {
      text += `【突破时刻】\n`;
      r.breakthrough_moments.forEach(b => { text += `· ${b.moment || ''}——${b.significance || ''}\n`; });
      text += '\n';
    }
    if (r.self_insights && r.self_insights.length) {
      text += `【你自己的觉察】\n`;
      r.self_insights.forEach(s => { text += `· ${s}\n`; });
      text += '\n';
    }
    if (r.action_plan && r.action_plan.length) {
      text += `【行动方案】\n`;
      r.action_plan.forEach((a, i) => {
        text += `步骤${i+1}: 当${a.situation}时 → ${a.action}\n原因：${a.rationale}\n`;
      });
      text += '\n';
    }
    if (r.growth_summary) text += `【成长总结】\n${r.growth_summary}\n\n`;
    if (r.relationship_impact) text += `【对关系的影响】\n${r.relationship_impact}\n\n`;
    if (r.final_words) {
      text += `【最后的话】\n`;
      if (r.final_words.mirror) text += `镜子的话：${r.final_words.mirror}\n`;
      if (r.final_words.lighthouse) text += `灯塔的话：${r.final_words.lighthouse}\n`;
    }
    text += buildChatSection('txt');
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `自我审查报告_${sr.userName}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  }
}

function init() {
  const saved = loadState();
  if (saved && saved.phase && saved.phase !== 'setup' && saved.phase !== 'home') {
    const overlay = document.createElement('div');
    overlay.className = 'resume-dialog';
    overlay.innerHTML = `
      <div class="dialog-card">
        <h2>检测到未完成的会话</h2>
        <p>你上次在"${phaseLabel(saved.phase)}"阶段退出了，是否继续？</p>
        <div class="btns">
          <button class="btn btn-outline" id="btn-fresh">回到首页</button>
          <button class="btn btn-primary" id="btn-resume">继续会话</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    document.getElementById('btn-resume').onclick = () => {
      overlay.remove();
      handleResume(saved);
    };
    document.getElementById('btn-fresh').onclick = () => {
      clearState();
      overlay.remove();
      render();
    };
  } else {
    state.phase = 'home';
    render();
  }
}

window.addEventListener('load', init);
</script>
</body>
</html>
