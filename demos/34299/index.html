<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经纬未来 - 你的AI职场进化导航仪</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s ease;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }
        .input-focus:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        .progress-bar {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>
<body class="min-h-screen py-8 px-4">
    <div class="max-w-6xl mx-auto">
        <header class="text-center mb-10">
            <div class="flex items-center justify-center gap-3 mb-3">
                <i class="fas fa-compass text-4xl text-white"></i>
                <h1 class="text-4xl font-bold text-white">经纬未来</h1>
            </div>
            <p class="text-white/80 text-lg">你的AI职场进化导航仪</p>
        </header>

        <div class="glass p-6 mb-6 fade-in">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-semibold text-gray-800 flex items-center gap-2">
                    <i class="fas fa-cog"></i> 模型配置
                </h2>
                <button id="toggleConfig" class="text-sm text-indigo-600 hover:text-indigo-800">收起</button>
            </div>
            <div id="configPanel">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">API 类型</label>
                        <select id="apiType" class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus">
                            <option value="deepseek">DeepSeek</option>
                            <option value="openai">OpenAI</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">API 地址</label>
                        <input type="text" id="apiUrl" class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus" 
                               value="https://api.deepseek.com/v1/chat/completions">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">API Key</label>
                        <input type="password" id="apiKey" class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus" 
                               placeholder="请输入你的API Key" value="sk-deepseek-default-key-for-demo">
                    </div>
                </div>
                <div class="flex items-center gap-2 mt-4">
                    <button id="testApi" class="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition">
                        <i class="fas fa-check-circle"></i> 测试连接
                    </button>
                    <span id="testResult" class="text-sm"></span>
                </div>
            </div>
        </div>

        <div class="glass p-6 mb-6 fade-in">
            <h2 class="text-xl font-semibold text-gray-800 flex items-center gap-2 mb-6">
                <i class="fas fa-user"></i> 个人信息
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">你的专业/技能背景</label>
                    <textarea id="background" rows="3" class="w-full px-4 py-3 border border-gray-300 rounded-lg input-focus resize-none"
                              placeholder="例如：计算机科学专业，3年前端开发经验，熟悉React和Node.js"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">当前职场痛点</label>
                    <textarea id="painPoints" rows="3" class="w-full px-4 py-3 border border-gray-300 rounded-lg input-focus resize-none"
                              placeholder="例如：感觉技术栈跟不上，想跳槽但不知道差距在哪，晋升受阻"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">未来职业规划</label>
                    <textarea id="goals" rows="3" class="w-full px-4 py-3 border border-gray-300 rounded-lg input-focus resize-none"
                              placeholder="例如：3年内成为技术主管，目标公司：字节跳动、阿里云"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">可用学习时间</label>
                    <select id="timeAvailable" class="w-full px-4 py-3 border border-gray-300 rounded-lg input-focus">
                        <option value="1-2">每天1-2小时</option>
                        <option value="2-4">每天2-4小时</option>
                        <option value="4-6">每天4-6小时</option>
                        <option value="6+">每天6小时以上</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="glass p-6 mb-6 fade-in">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-semibold text-gray-800 flex items-center gap-2">
                    <i class="fas fa-map"></i> 生成学习与求职计划
                </h2>
            </div>
            <button id="generatePlan" class="btn-primary w-full py-4 text-white font-semibold rounded-lg text-lg flex items-center justify-center gap-2">
                <i class="fas fa-magic"></i> 开始智能规划
            </button>
            <div id="loading" class="mt-4 text-center hidden">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent"></div>
                <p class="mt-2 text-gray-600">AI正在为您分析并生成个性化计划...</p>
            </div>
            <div id="error" class="mt-4 p-4 bg-red-50 border border-red-200 rounded-lg text-red-600 hidden">
                <i class="fas fa-exclamation-circle"></i> <span id="errorMsg">请求失败，请检查API配置</span>
            </div>
        </div>

        <div id="resultPanel" class="glass p-6 fade-in hidden">
            <h2 class="text-xl font-semibold text-gray-800 flex items-center gap-2 mb-6">
                <i class="fas fa-chart-line"></i> 您的专属学习地图
            </h2>
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 space-y-6">
                    <div class="card-hover p-5 bg-gradient-to-r from-indigo-50 to-purple-50 rounded-xl border border-indigo-100">
                        <h3 class="font-semibold text-gray-800 mb-3 flex items-center gap-2">
                            <i class="fas fa-target text-indigo-600"></i> 诊断结果
                        </h3>
                        <div id="diagnosis" class="text-gray-600 leading-relaxed whitespace-pre-line"></div>
                    </div>
                    
                    <div class="card-hover p-5 bg-gradient-to-r from-green-50 to-teal-50 rounded-xl border border-green-100">
                        <h3 class="font-semibold text-gray-800 mb-3 flex items-center gap-2">
                            <i class="fas fa-book-open text-green-600"></i> 学习计划
                        </h3>
                        <div id="studyPlan" class="text-gray-600 leading-relaxed whitespace-pre-line"></div>
                    </div>
                    
                    <div class="card-hover p-5 bg-gradient-to-r from-orange-50 to-amber-50 rounded-xl border border-orange-100">
                        <h3 class="font-semibold text-gray-800 mb-3 flex items-center gap-2">
                            <i class="fas fa-briefcase text-orange-600"></i> 求职时间轴
                        </h3>
                        <div id="jobPlan" class="text-gray-600 leading-relaxed whitespace-pre-line"></div>
                    </div>
                </div>
                
                <div class="space-y-6">
                    <div class="card-hover p-5 bg-white rounded-xl border border-gray-200">
                        <h3 class="font-semibold text-gray-800 mb-3 flex items-center gap-2">
                            <i class="fas fa-calendar-check-o text-blue-600"></i> 进度追踪
                        </h3>
                        <div class="space-y-4">
                            <div>
                                <div class="flex justify-between text-sm mb-1">
                                    <span>学习进度</span>
                                    <span id="studyProgress">0%</span>
                                </div>
                                <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
                                    <div id="studyBar" class="progress-bar h-full w-0"></div>
                                </div>
                            </div>
                            <div>
                                <div class="flex justify-between text-sm mb-1">
                                    <span>求职准备</span>
                                    <span id="jobProgress">0%</span>
                                </div>
                                <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
                                    <div id="jobBar" class="progress-bar h-full w-0"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card-hover p-5 bg-white rounded-xl border border-gray-200">
                        <h3 class="font-semibold text-gray-800 mb-3 flex items-center gap-2">
                            <i class="fas fa-lightbulb text-yellow-500"></i> 今日建议
                        </h3>
                        <div id="todaySuggestion" class="text-gray-600 text-sm leading-relaxed whitespace-pre-line"></div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="text-center mt-10 text-white/60 text-sm">
            <p>经纬未来 - 让每一步努力都有方向</p>
        </footer>
    </div>

    <script>
        const API_CONFIG = {
            deepseek: {
                url: 'https://api.deepseek.com/v1/chat/completions',
                model: 'deepseek-chat'
            },
            openai: {
                url: 'https://api.openai.com/v1/chat/completions',
                model: 'gpt-3.5-turbo'
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const toggleConfig = document.getElementById('toggleConfig');
            const configPanel = document.getElementById('configPanel');
            const apiType = document.getElementById('apiType');
            const apiUrl = document.getElementById('apiUrl');
            const apiKey = document.getElementById('apiKey');
            const testApi = document.getElementById('testApi');
            const testResult = document.getElementById('testResult');
            const generatePlan = document.getElementById('generatePlan');
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const errorMsg = document.getElementById('errorMsg');
            const resultPanel = document.getElementById('resultPanel');

            apiType.addEventListener('change', () => {
                const type = apiType.value;
                apiUrl.value = API_CONFIG[type].url;
            });

            toggleConfig.addEventListener('click', () => {
                const isHidden = configPanel.style.display === 'none';
                configPanel.style.display = isHidden ? 'block' : 'none';
                toggleConfig.textContent = isHidden ? '收起' : '展开';
            });

            testApi.addEventListener('click', async () => {
                testApi.disabled = true;
                testResult.textContent = '测试中...';
                testResult.className = 'text-sm text-gray-500';
                
                try {
                    const response = await fetch(apiUrl.value, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey.value}`
                        },
                        body: JSON.stringify({
                            model: API_CONFIG[apiType.value].model,
                            messages: [{ role: 'user', content: 'Hello' }],
                            max_tokens: 10
                        })
                    });
                    
                    if (response.ok) {
                        testResult.textContent = '✓ 连接成功';
                        testResult.className = 'text-sm text-green-600';
                    } else {
                        const data = await response.json();
                        testResult.textContent = `✗ ${data.error?.message || '连接失败'}`;
                        testResult.className = 'text-sm text-red-600';
                    }
                } catch (err) {
                    testResult.textContent = `✗ ${err.message}`;
                    testResult.className = 'text-sm text-red-600';
                } finally {
                    testApi.disabled = false;
                }
            });

            generatePlan.addEventListener('click', async () => {
                const background = document.getElementById('background').value.trim();
                const painPoints = document.getElementById('painPoints').value.trim();
                const goals = document.getElementById('goals').value.trim();
                const timeAvailable = document.getElementById('timeAvailable').value;

                if (!background || !painPoints || !goals) {
                    errorMsg.textContent = '请填写完整的个人信息';
                    error.style.display = 'block';
                    return;
                }

                generatePlan.disabled = true;
                loading.style.display = 'block';
                error.style.display = 'none';
                resultPanel.style.display = 'none';

                try {
                    const prompt = `你是一位专业的职业规划师，请根据用户提供的信息，生成一份详细的学习和求职计划。

用户信息：
- 专业/技能背景：${background}
- 当前职场痛点：${painPoints}
- 未来职业规划：${goals}
- 可用学习时间：${timeAvailable}小时/天

请按照以下结构输出：

【诊断结果】：分析用户当前的核心问题和能力差距

【学习计划】：分阶段列出学习内容、推荐资源、预期时间

【求职时间轴】：按月份规划求职准备步骤和里程碑

【今日建议】：今天可以开始的具体行动

请用简洁明了的语言，避免使用专业术语，让用户容易理解和执行。`.trim();

                    const response = await fetch(apiUrl.value, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey.value}`
                        },
                        body: JSON.stringify({
                            model: API_CONFIG[apiType.value].model,
                            messages: [{ role: 'user', content: prompt }],
                            max_tokens: 3000,
                            temperature: 0.7
                        })
                    });

                    if (!response.ok) {
                        const data = await response.json();
                        throw new Error(data.error?.message || '请求失败');
                    }

                    const data = await response.json();
                    const content = data.choices?.[0]?.message?.content;

                    if (!content) {
                        throw new Error('未能获取到响应内容');
                    }

                    parseResult(content);
                    resultPanel.style.display = 'block';
                } catch (err) {
                    errorMsg.textContent = err.message;
                    error.style.display = 'block';
                } finally {
                    generatePlan.disabled = false;
                    loading.style.display = 'none';
                }
            });

            function parseResult(content) {
                const diagnosisMatch = content.match(/【诊断结果】[\s\S]*?(?=【学习计划】|【求职时间轴】|【今日建议】|$)/);
                const studyPlanMatch = content.match(/【学习计划】[\s\S]*?(?=【求职时间轴】|【今日建议】|$)/);
                const jobPlanMatch = content.match(/【求职时间轴】[\s\S]*?(?=【今日建议】|$)/);
                const todaySuggestionMatch = content.match(/【今日建议】[\s\S]*$/);

                document.getElementById('diagnosis').textContent = diagnosisMatch ? diagnosisMatch[0].replace('【诊断结果】', '').trim() : '暂无诊断结果';
                document.getElementById('studyPlan').textContent = studyPlanMatch ? studyPlanMatch[0].replace('【学习计划】', '').trim() : '暂无学习计划';
                document.getElementById('jobPlan').textContent = jobPlanMatch ? jobPlanMatch[0].replace('【求职时间轴】', '').trim() : '暂无求职计划';
                document.getElementById('todaySuggestion').textContent = todaySuggestionMatch ? todaySuggestionMatch[0].replace('【今日建议】', '').trim() : '暂无今日建议';

                document.getElementById('studyProgress').textContent = '25%';
                document.getElementById('studyBar').style.width = '25%';
                document.getElementById('jobProgress').textContent = '15%';
                document.getElementById('jobBar').style.width = '15%';
            }
        });
    </script>
</body>
</html>
