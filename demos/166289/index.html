<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>Lottie Inspector</title>
  <style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0f1115;
  color: #fff;
  padding: 20px;
}

h1 { font-size: 18px; margin-bottom: 10px; }

.box {
  border: 1px solid #2a2f3a;
  padding: 16px;
  border-radius: 12px;
  margin-top: 12px;
  background: #151923;
}

input { color: #fff; }

#file {
  width: 100%;
  height: 120px;
  border: 2px dashed #2a2f3a;
  border-radius: 12px;
  background: #0f131b;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s ease;
}

#file:hover {
  border-color: #3b82f6;
  background: #151923;
}

#file::-webkit-file-upload-button {
  display: none;
}

#file::before {
  content: "📁 点击或拖拽上传 Lottie JSON 文件";
  color: rgba(255, 255, 255, 0.7);
}

.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 12px;
}

.high { background: #ff3b30; }
.mid { background: #ff9500; }
.low { background: #ffd60a; color:#000; }
.ok { background: #34c759; }

.item {
  display: flex;
  gap: 12px;
  padding: 12px;
  margin-bottom: 10px;
  border: 1px solid #2a2f3a;
  border-radius: 10px;
  background: #0f131b;
}

.left {
  min-width: 70px;
}

.title {
  font-weight: 600;
  margin-bottom: 4px;
}

.subtitle {
  font-size: 12px;
  opacity: 0.7;
  margin-bottom: 4px;
}

.desc {
  font-size: 12px;
  opacity: 0.85;
}

.scores {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-top: 12px;
}

.score-card {
  text-align: center;
}

.score-label {
  font-size: 12px;
  opacity: 0.7;
  margin-bottom: 6px;
}

.score-value {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 6px;
}

.score-bar-container {
  height: 6px;
  background: #2a2f3a;
  border-radius: 3px;
  overflow: hidden;
}

.score-bar {
  height: 100%;
  border-radius: 3px;
  transition: width 0.3s ease;
}

.score-bar.green { background: #34c759; }
.score-bar.yellow { background: #ffd60a; }
.score-bar.orange { background: #ff9500; }
.score-bar.red { background: #ff3b30; }

.layer-group {
  margin-bottom: 16px;
  border: 1px solid #2a2f3a;
  border-radius: 12px;
  overflow: hidden;
  background: #0f131b;
}

.layer-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: #151923;
  border-bottom: 1px solid #2a2f3a;
}

.layer-index {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #2a2f3a;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
}

.layer-name {
  flex: 1;
  font-weight: 600;
  font-size: 14px;
}

.layer-count {
  font-size: 12px;
  opacity: 0.7;
}

.layer-group .item {
  margin-bottom: 0;
  border: none;
  border-radius: 0;
  border-bottom: 1px solid #2a2f3a;
  background: transparent;
}

.layer-group .item:last-child {
  border-bottom: none;
}
  </style>
</head>

<body>

<h1>🧪 Lottie 兼容性检测工具</h1>

<div class="box">
  <input type="file" id="file" accept=".json" />
</div>

<div class="box" id="scoreboard" style="display: none;">
  <h3>📊 平台兼容性评分</h3>
  <div class="scores"></div>
</div>

<div class="box">
  <h3>检测结果</h3>
  <div id="result">请上传 Lottie JSON</div>
</div>

<script>
const resultBox = document.getElementById("result");
const scoreboardBox = document.getElementById("scoreboard");

document.getElementById("file").addEventListener("change", handleFile);

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const json = JSON.parse(evt.target.result);

      if (!isLottie(json)) {
        scoreboardBox.style.display = "none";
        resultBox.innerHTML = `
          <span class="tag high">错误</span>
          <p>❌ 该文件不是有效 Lottie 动画</p>
        `;
        return;
      }

      analyze(json);

    } catch (err) {
      scoreboardBox.style.display = "none";
      resultBox.innerHTML = `
        <span class="tag high">错误</span>
        <p>❌ JSON 解析失败</p>
      `;
    }
  };

  reader.readAsText(file);
}

function isLottie(json) {
  return json &&
         typeof json === "object" &&
         Array.isArray(json.layers) &&
         json.v;
}

function getEffectName(effect) {
  const nm = effect.nm;
  const ty = effect.ty;
  
  if (nm) {
    return nm;
  }
  
  const effectMap = {
    20: "高斯模糊 (Gaussian Blur)",
    21: "填充 (Fill)",
    22: "描边 (Stroke)",
    23: "色调 (Tint)",
    24: "三色调 (Tritone)",
    25: "色阶 (Levels)",
    26: "投影 (Drop Shadow)",
    27: "渐变叠加 (Gradient Overlay)",
    28: "纯色叠加 (Color Overlay)",
    29: "内阴影 (Inner Shadow)",
    30: "外发光 (Outer Glow)",
    31: "内发光 (Inner Glow)",
    32: "斜面和浮雕 (Bevel & Emboss)",
    33: "色相/饱和度 (Hue/Saturation)",
    34: "亮度/对比度 (Brightness/Contrast)",
    35: "曲线 (Curves)",
    36: "色彩平衡 (Color Balance)",
    37: "通道混合器 (Channel Mixer)",
    38: "渐变映射 (Gradient Map)",
    39: "反相 (Invert)",
    40: "阈值 (Threshold)",
    41: "色调分离 (Posterize)",
    42: "模糊 (Blur)",
    43: "快速模糊 (Fast Blur)",
    44: "智能模糊 (Smart Blur)",
    45: "径向模糊 (Radial Blur)",
    46: "运动模糊 (Motion Blur)",
    47: "添加杂色 (Add Noise)",
    48: "减少杂色 (Reduce Noise)",
    49: "中间值 (Median)",
    50: "钝化蒙版 (Unsharp Mask)",
    51: "灰尘与划痕 (Dust & Scratches)",
    52: "扩散 (Diffuse)",
    53: "拼贴 (Posterize)",
    54: "胶片颗粒 (Film Grain)",
    55: "画笔描边 (Brush Strokes)",
    56: "粗糙边缘 (Roughen Edges)",
    57: "彩色铅笔 (Colored Pencil)",
    58: "木刻 (Cutout)",
    59: "干画笔 (Dry Brush)",
    60: "海报边缘 (Poster Edges)",
    61: "海绵 (Sponge)",
    62: "涂抹棒 (Smudge Stick)",
    63: "水彩 (Watercolor)",
    64: "镜头光晕 (Lens Flare)",
    65: "噪点 (Noise)",
    66: "位移地图 (Displacement Map)",
    67: "液化 (Liquify)",
    68: "碎片 (Shatter)",
    69: "变换 (Transform)",
    70: "裁剪 (Crop)",
    71: "时间重映射 (Time Remapping)",
    72: "表达式 (Expression)",
    73: "音频频谱 (Audio Spectrum)",
    74: "音频波形 (Audio Waveform)",
    75: "数值 (Numbers)",
    76: "时间码 (Timecode)",
    77: "计数 (Count)",
    78: "随机植入 (Randomize)",
    79: "渐变 (Gradient)",
    80: "四色渐变 (Four-Color Gradient)",
    81: "彩虹渐变 (Rainbow Gradient)",
    82: "箭头 (Arrow)",
    83: "星形 (Star)",
    84: "圆角矩形 (Round Rectangle)",
    85: "椭圆 (Ellipse)",
    86: "矩形 (Rectangle)",
    87: "多边形 (Polygon)",
    88: "贝塞尔曲线 (Bezier)",
    89: "路径文本 (Path Text)",
    90: "棋盘格 (Checkerboard)",
    91: "网格 (Grid)",
    92: "圆形 (Circle)"
  };
  return effectMap[ty] || `未知特效 (Type ${ty})`;
}

function analyze(lottie) {
  const layersIssues = {};
  const layers = lottie.layers || [];
  const matteRefs = {};

  layers.forEach((layer, i) => {

    const name = layer.nm || `未命名图层 ${i + 1}`;
    if (!layersIssues[i]) {
      layersIssues[i] = {
        layerName: name,
        layerIndex: i,
        issues: []
      };
    }

    if (layer.ef?.length) {
      layer.ef.forEach(effect => {
        const effectName = getEffectName(effect);
        layersIssues[i].issues.push({
          level: "high",
          title: effectName,
          msg: `包含 AE 特效 "${effectName}" (ty:${effect.ty})，Web / iOS / Android 可能忽略`
        });
      });
    }

    if (layer.tt && layer.tt !== 0) {
      const matteTypes = {
        1: "Alpha 遮罩",
        2: "Alpha 反转遮罩",
        3: "亮度遮罩",
        4: "亮度反转遮罩"
      };
      const matteType = matteTypes[layer.tt] || `未知遮罩类型 (${layer.tt})`;
      
      const maskedLayerName = name;
      let maskLayerName = "";
      let matteLayerId = null;
      let isInvalidOrder = false;
      
      if (i >= layers.length - 1) {
        isInvalidOrder = true;
        maskLayerName = "无（已是最顶层图层）";
      } else {
        const maskLayer = layers[i + 1];
        maskLayerName = maskLayer.nm || `未命名图层 ${i + 2}`;
        matteLayerId = maskLayer.ind || (i + 1);
        
        if (maskLayer.tt && maskLayer.tt !== 0) {
          isInvalidOrder = true;
        }
      }
      
      if (!matteRefs[matteLayerId]) {
        matteRefs[matteLayerId] = {
          maskLayerName: maskLayerName,
          uses: []
        };
      }
      
      matteRefs[matteLayerId].uses.push({
        maskedLayerName: maskedLayerName,
        matteType: matteType,
        isInvalidOrder: isInvalidOrder,
        index: i
      });
    }

    if (layer.dd === 1) {
      layersIssues[i].issues.push({
        level: "high",
        title: "3D 图层",
        msg: "Lottie 不支持真正 3D"
      });
    }

    if (layer.bm && layer.bm !== 0) {
      layersIssues[i].issues.push({
        level: "medium",
        title: "混合模式",
        msg: "跨平台渲染不一致"
      });
    }

    if (layer.masksProperties?.length) {
      layersIssues[i].issues.push({
        level: "medium",
        title: "遮罩（Mask）",
        msg: "Android / Web 可能有差异"
      });
    }

    if (layer.shapes?.length) {
      layer.shapes.forEach(shape => {
        if (shape.ty === 'g' && shape.it?.length) {
          shape.it.forEach(innerShape => {
            if (innerShape.ty === 'gr') {
              const fillName = innerShape.nm || '';
              if (fillName && !/^[a-zA-Z\s\-_]+$/.test(fillName)) {
                layersIssues[i].issues.push({
                  level: "high",
                  title: "渐变填充",
                  msg: `组内渐变填充名称「${fillName}」包含非英文字符，部分平台可能渲染异常`
                });
              }
            }
          });
        }
      });
    }
  });

  for (const [matteId, matteInfo] of Object.entries(matteRefs)) {
    const maskLayerName = matteInfo.maskLayerName;
    const uses = matteInfo.uses;
    const useCount = uses.length;
    
    uses.forEach(use => {
      const { maskedLayerName, matteType, isInvalidOrder, index } = use;
      
      let level = "medium";
      let msg = `遮罩层「${maskLayerName}」→ 被遮罩层「${maskedLayerName}」（${matteType}），该遮罩层共被 ${useCount} 个图层使用`;
      
      if (isInvalidOrder) {
        level = "high";
        msg += " ⚠️ 遮罩层位置异常";
      } else if (useCount === 1) {
        level = "low";
        msg += " ✅ 遮罩层位置正确且只被一个图层使用";
      } else {
        level = "high";
        msg += " ⚠️ 遮罩层被多个图层共用，跨平台表现可能不一致";
      }
      
      if (layersIssues[index]) {
        layersIssues[index].issues.push({
          level: level,
          title: `轨道遮罩（${matteType}）`,
          msg: msg
        });
      }
    });
  }

  const validLayers = Object.values(layersIssues).filter(l => l.issues.length > 0);
  const totalIssues = validLayers.reduce((sum, l) => sum + l.issues.length, 0);
  
  const scores = calcPlatformScores(validLayers.flatMap(l => l.issues));
  renderScoreboard(scores);
  renderByLayer(validLayers, totalIssues);
}

function renderByLayer(layers, totalIssues) {
  if (!layers.length) {
    resultBox.innerHTML = `
      <span class="tag ok">兼容性良好</span>
      <p>未检测到明显问题 🎉</p>
    `;
    return;
  }

  layers.sort((a, b) => a.layerIndex - b.layerIndex);

  resultBox.innerHTML = `
    <p>检测到 <b>${totalIssues}</b> 个潜在问题：</p>
    ${layers.map(layerInfo => {
      const layerIndex = layerInfo.layerIndex;
      const layerName = layerInfo.layerName;
      const issues = layerInfo.issues;

      return `
        <div class="layer-group">
          <div class="layer-header">
            <span class="layer-index">${layerIndex + 1}</span>
            <span class="layer-name">${layerName}</span>
            <span class="layer-count">${issues.length} 个问题</span>
          </div>
          ${issues.map(issue => {
            let cls = "low";
            let label = "低风险";

            if (issue.level === "high") { cls = "high"; label = "高风险"; }
            else if (issue.level === "medium") { cls = "mid"; label = "中风险"; }

            return `
              <div class="item">
                <div class="left">
                  <span class="tag ${cls}">${label}</span>
                </div>
                <div style="flex:1;">
                  <div class="title">${issue.title}</div>
                  <div class="desc">${issue.msg}</div>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }).join("")}
  `;
}

function calcPlatformScores(issues) {
  let web = 100;
  let ios = 100;
  let android = 100;

  issues.forEach(issue => {
    const isAEEffect = issue.msg.includes("AE 特效");
    const is3DLayer = issue.title.includes("3D");
    const isTrackMatte = issue.title.includes("轨道遮罩");
    const isMask = issue.title.includes("遮罩（Mask）");
    const isBlendMode = issue.title.includes("混合模式");
    const isHighRisk = issue.level === "high";

    if (isAEEffect) {
      web -= 20;
      ios -= 20;
      android -= 20;
    } else if (is3DLayer) {
      web -= 30;
      ios -= 30;
      android -= 30;
    } else if (isTrackMatte) {
      if (isHighRisk) {
        web -= 25;
        ios -= 25;
        android -= 25;
      } else {
        web -= 10;
        ios -= 5;
        android -= 15;
      }
    } else if (isMask) {
      web -= 8;
      ios -= 3;
      android -= 12;
    } else if (isBlendMode) {
      web -= 5;
      ios -= 5;
      android -= 8;
    } else if (isHighRisk) {
      web -= 15;
      ios -= 15;
      android -= 15;
    } else {
      web -= 5;
      ios -= 5;
      android -= 5;
    }
  });

  return {
    web: Math.max(0, Math.round(web)),
    ios: Math.max(0, Math.round(ios)),
    android: Math.max(0, Math.round(android))
  };
}

function renderScoreboard(scores) {
  scoreboardBox.style.display = "block";
  
  const getBarClass = (score) => {
    if (score >= 80) return "green";
    if (score >= 60) return "yellow";
    if (score >= 40) return "orange";
    return "red";
  };

  const platforms = [
    { name: "🌐 Web", key: "web", score: scores.web },
    { name: "📱 iOS", key: "ios", score: scores.ios },
    { name: "🤖 Android", key: "android", score: scores.android }
  ];

  scoreboardBox.querySelector(".scores").innerHTML = platforms.map(p => `
    <div class="score-card">
      <div class="score-label">${p.name}</div>
      <div class="score-value">${p.score}%</div>
      <div class="score-bar-container">
        <div class="score-bar ${getBarClass(p.score)}" style="width: ${p.score}%"></div>
      </div>
    </div>
  `).join("");
}
</script>

</body>
</html>
