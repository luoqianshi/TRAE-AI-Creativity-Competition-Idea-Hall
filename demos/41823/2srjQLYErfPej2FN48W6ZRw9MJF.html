  // --- Resizer ---
  function initResizer() {
    const resizer = document.getElementById('resizer');
    const editorPanel = document.getElementById('editorPanel');
    const previewPanel = document.getElementById('previewPanel');
    let startX, startEditorWidth;

    resizer.addEventListener('mousedown', (e) => {
      e.preventDefault();
      startX = e.clientX;
      startEditorWidth = editorPanel.getBoundingClientRect().width;
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';

      function onMouseMove(e) {
        const dx = e.clientX - startX;
        const mainArea = document.querySelector('.main-area');
        const totalWidth = mainArea.getBoundingClientRect().width - 6;
        const newEditorWidth = startEditorWidth + dx;
        const percent = (newEditorWidth / totalWidth) * 100;
        if (percent > 20 && percent < 80) {
          editorPanel.style.flex = '0 0 ' + percent + '%';
          previewPanel.style.flex = '1';
        }
      }

      function onMouseUp() {
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      }

      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
    });
  }

  // --- Markdown Parser ---
  function parseMarkdown(md) {
    let html = md;

    // Escape HTML entities in non-code sections
    // We'll process code blocks first, then escape, then restore

    // Store code blocks
    const codeBlocks = [];
    html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
      const idx = codeBlocks.length;
      codeBlocks.push({ lang: lang || '', code: code.trimEnd() });
      return '%%CODEBLOCK_' + idx + '%%';
    });

    // Store inline code
    const inlineCodes = [];
    html = html.replace(/`([^`]+)`/g, (_, code) => {
      const idx = inlineCodes.length;
      inlineCodes.push(code);
      return '%%INLINE_' + idx + '%%';
    });

    // Escape HTML
    html = html.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    // Restore inline code
    html = html.replace(/%%INLINE_(\d+)%%/g, (_, idx) => {
      return '<code>' + inlineCodes[parseInt(idx)] + '</code>';
    });

    // Headers
    html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
    html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

    // Horizontal rule
    html = html.replace(/^(---|\*\*\*|___)\s*$/gm, '<hr>');

    // Bold and italic
    html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
    html = html.replace(/~~(.+?)~~/g, '<del>$1</del>');

    // Images
    html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');

    // Links
    html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

    // Blockquotes
    html = html.replace(/^&gt; (.+)$/gm, '<blockquote><p>$1</p></blockquote>');
    // Merge consecutive blockquotes
    html = html.replace(/<\/blockquote>\n<blockquote>/g, '\n');

    // Task lists
    html = html.replace(/^- \[x\] (.+)$/gm, '<li><input type="checkbox" checked disabled> $1</li>');
    html = html.replace(/^- \[ \] (.+)$/gm, '<li><input type="checkbox" disabled> $1</li>');

    // Unordered lists
    html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
    html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');

    // Ordered lists
    html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
    // Fix ordered lists that got wrapped in <ul> by the unordered list rule
    // We need to handle this more carefully. Let's re-process.
    // Actually, let's handle ordered lists before unordered to avoid conflicts.

    // Tables
    html = html.replace(/^\|(.+)\|$/gm, (line) => {
      const cells = line.split('|').filter(c => c.trim() !== '').map(c => c.trim());
      if (cells.length === 0) return line;
      return '%%TROW%%' + cells.join('%%TCELL%%') + '%%TROW%%';
    });

    // Process table rows
    const tableRegex = /(%%TROW%%.+?%%TROW%%\n?)+/g;
    html = html.replace(tableRegex, (tableBlock) => {
      const rows = tableBlock.trim().split('\n').filter(r => r.trim());
      let result = '<table>';
      let isHeader = true;
      rows.forEach((row, ri) => {
        const content = row.replace(/%%TROW%%/g, '');
        const cells = content.split('%%TCELL%%');
        // Skip separator row
        if (cells.every(c => /^[-:]+$/.test(c.trim()))) {
          isHeader = false;
          return;
        }
        const tag = isHeader ? 'th' : 'td';
        result += '<tr>' + cells.map(c => '<' + tag + '>' + c.trim() + '</' + tag + '>').join('') + '</tr>';
        if (isHeader && ri === 0) isHeader = false;
      });
      result += '</table>';
      return result;
    });

    // Paragraphs - wrap remaining text blocks
    // Split by double newline
    const blocks = html.split(/\n\n+/);
    html = blocks.map(block => {
      block = block.trim();
      if (!block) return '';
      // Skip blocks that are already HTML tags
      if (/^<(h[1-4]|ul|ol|table|blockquote|pre|hr|img|li)/.test(block)) return block;
      // Replace single newlines with <br> within paragraphs
      block = block.replace(/\n/g, '<br>');
      return '<p>' + block + '</p>';
    }).join('\n');

    // Restore code blocks
    html = html.replace(/%%CODEBLOCK_(\d+)%%/g, (_, idx) => {
      const cb = codeBlocks[parseInt(idx)];
      const langTag = cb.lang ? ' class="language-' + cb.lang + '"' : '';
      return '<pre><code' + langTag + '>' + cb.code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code></pre>';
    });

    return html;
  }

  // --- Render ---
  function renderMarkdown() {
    const raw = textarea.value.trim();
    if (!raw) {
      previewBody.innerHTML = '<div class="preview-placeholder"><div class="icon">📝</div><div class="text">在左侧编写 Markdown，实时预览效果</div></div>';
      return;
    }
    const html = parseMarkdown(raw);
    previewBody.innerHTML = '<div class="md-body">' + html + '</div>';
  }

  // --- Debounce ---
  function debouncePreview() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(renderMarkdown, 300);
  }

  // --- Line numbers ---
  function updateLineNumbers() {
    const lines = textarea.value.split('\n');
    const count = lines.length;
    let html = '';
    for (let i = 1; i <= count; i++) {
      html += i + '\n';
    }
    lineNumbers.innerHTML = html || '1';
  }

  // --- Sync scroll ---
  function syncScroll() {
    lineNumbers.scrollTop = textarea.scrollTop;
  }

  // --- Tab key ---
  function handleTab(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      textarea.value = textarea.value.substring(0, start) + '  ' + textarea.value.substring(end);
      textarea.selectionStart = textarea.selectionEnd = start + 2;
      updateLineNumbers();
    }
  }

  // --- Insert markdown syntax ---
  function insertMarkdown(before, after) {
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    const selected = textarea.value.substring(start, end);
    const text = before + selected + after;
    textarea.value = textarea.value.substring(0, start) + text + textarea.value.substring(end);
    textarea.selectionStart = start + before.length;
    textarea.selectionEnd = start + before.length + selected.length;
    textarea.focus();
    updateLineNumbers();
    renderMarkdown();
  }

  function insertLine(prefix) {
    const start = textarea.selectionStart;
    const lineStart = textarea.value.lastIndexOf('\n', start - 1) + 1;
    textarea.value = textarea.value.substring(0, lineStart) + prefix + textarea.value.substring(lineStart);
    textarea.selectionStart = textarea.selectionEnd = lineStart + prefix.length;
    textarea.focus();
    updateLineNumbers();
    renderMarkdown();
  }

  function insertBlock(before, after) {
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    const selected = textarea.value.substring(start, end);
    const text = before + (selected || '// 在此输入代码') + after;
    textarea.value = textarea.value.substring(0, start) + text + textarea.value.substring(end);
    textarea.focus();
    updateLineNumbers();
    renderMarkdown();
  }

  // --- Export HTML ---
  function exportHTML() {
    renderMarkdown();
    const mdHtml = previewBody.innerHTML;
    const fullHtml = '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>Markdown Export</title>\n<style>\n' +
      'body { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #333; line-height: 1.75; }\n' +
      'h1 { font-size: 1.8rem; border-bottom: 2px solid #eee; padding-bottom: 10px; }\n' +
      'h2 { font-size: 1.4rem; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-top: 28px; }\n' +
      'h3 { font-size: 1.15rem; margin-top: 22px; }\n' +
      'pre { background: #1e1e2e; color: #cdd6f4; padding: 16px 20px; border-radius: 8px; overflow-x: auto; }\n' +
      'code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; color: #e94560; font-size: 0.88em; }\n' +
      'pre code { background: none; color: #cdd6f4; padding: 0; }\n' +
      'blockquote { border-left: 4px solid #4ecdc4; padding: 10px 16px; background: #f0fafa; margin: 12px 0; border-radius: 0 6px 6px 0; }\n' +
      'table { border-collapse: collapse; width: 100%; }\n' +
      'th { background: #4ecdc4; color: #fff; padding: 10px 14px; }\n' +
      'td { padding: 8px 14px; border-bottom: 1px solid #eee; }\n' +
      'img { max-width: 100%; border-radius: 6px; }\n' +
      'hr { border: none; border-top: 1px solid #e0e0e0; margin: 20px 0; }\n' +
      '</style>\n</head>\n<body>\n' + mdHtml + '\n</body>\n</html>';

    const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'markdown-export.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('HTML 文件已导出');
  }

  // --- Load example ---
  function loadExample() {
    textarea.value = EXAMPLE_MD;
    updateLineNumbers();
    renderMarkdown();
    showToast('示例 Markdown 已加载');
  }

  // --- Copy ---
  function copyCode() {
    const raw = textarea.value;
    if (!raw) { showToast('没有可复制的内容'); return; }
    navigator.clipboard.writeText(raw).then(() => {
      showToast('源码已复制到剪贴板');
    }).catch(() => {
      textarea.select();
      document.execCommand('copy');
      showToast('源码已复制到剪贴板');
    });
  }

  // --- Clear ---
  function clearAll() {
    textarea.value = '';
    updateLineNumbers();
    previewBody.innerHTML = '<div class="preview-placeholder"><div class="icon">📝</div><div class="text">在左侧编写 Markdown，实时预览效果</div></div>';
    showToast('已清空');
  }

  // --- Toast ---
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  // --- Keyboard shortcuts ---
  document.addEventListener('keydown', function(e) {
    if (e.target !== textarea) return;
    if ((e.ctrlKey || e.metaKey) && e.key === 'b') {
      e.preventDefault();
      insertMarkdown('**', '**');
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'i') {
      e.preventDefault();
      insertMarkdown('*', '*');
    }
  });
</script>

</body>
