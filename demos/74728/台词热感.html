<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>台词热感器</title>
  <style>
    :root {
      --bg-primary: #fdfaf7;
      --bg-card: #ffffff;
      --text-primary: #333333;
      --text-secondary: #6a6a6a;
      --accent: #d97706;
      --accent-light: #fbbf24;
      --border: #e8e0d5;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
      --radius: 12px;
      --transition: all 0.25s ease;
    }

    .dark-theme {
      --bg-primary: #1a1a1a;
      --bg-card: #2d2d2d;
      --text-primary: #f8f8f8;
      --text-secondary: #a1a1a1;
      --accent: #fbbf24;
      --accent-light: #fcd34d;
      --border: #3a3a3a;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", "SF Pro SC", "PingFang SC", "Hiragino Sans GB", sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 16px;
      transition: var(--transition);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
      padding-top: 16px;
    }

    h1 {
      font-weight: 700;
      font-size: 1.8rem;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--accent), #ea580c);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      padding: 24px;
      margin-bottom: 24px;
      transition: var(--transition);
    }

    .card-title {
      font-weight: 600;
      font-size: 1.2rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title svg {
      width: 20px;
      height: 20px;
      fill: var(--accent);
    }

    textarea {
      width: 100%;
      min-height: 140px;
      padding: 14px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text-primary);
      resize: vertical;
      transition: var(--transition);
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15);
    }

    .counter {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .counter span {
      font-weight: 500;
      color: var(--accent);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-size: 1rem;
      width: 100%;
      margin-top: 16px;
    }

    .btn:hover:not(:disabled) {
      background: #c26006;
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .result-section {
      display: none;
      margin-top: 24px;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .filter-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 6px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: var(--transition);
      color: var(--text-secondary);
    }

    .filter-btn.active, .filter-btn:hover:not(.active) {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .highlight {
      background: rgba(217, 119, 6, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      color: var(--accent);
    }

    .highlight-pause {
      background: rgba(59, 130, 246, 0.15);
      color: #3b82f6;
    }

    .highlight-emphasis {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
    }

    .highlight-speed {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
    }

    .highlight-mood {
      background: rgba(139, 92, 246, 0.15);
      color: #8b5cf6;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 2px;
    }

    .legend-pause { background: rgba(59, 130, 246, 0.3); }
    .legend-emphasis { background: rgba(239, 68, 68, 0.3); }
    .legend-speed { background: rgba(16, 185, 129, 0.3); }
    .legend-mood { background: rgba(139, 92, 246, 0.3); }

    .theme-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-md);
      z-index: 100;
      transition: var(--transition);
      font-size: 1.2rem;
    }

    .theme-toggle:hover:not(:disabled) {
      transform: scale(1.05);
      background: #c26006;
    }

    .instructions {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
    }

    /* Responsive */
    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }
      h1 {
        font-size: 1.5rem;
      }
      .card {
        padding: 18px;
      }
      .result-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .filter-tabs {
        width: 100%;
      }
      .btn {
        padding: 11px;
        font-size: 0.95rem;
      }
    }

    /* Smooth scroll for mobile focus */
    @media (max-width: 768px) {
      textarea:focus {
        scroll-margin-top: 80px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>台词热感器</h1>
      <p class="subtitle">给你的台词加一点情绪温度 —— 不改一个字，三秒获得可跟读的情绪执行指南</p>
    </header>

    <main>
      <section class="card">
        <h2 class="card-title">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
          输入你的台词
        </h2>
        <textarea id="script-input" placeholder="粘贴一段30–200字的台词，例如：‘奶奶颤巍巍递来糖纸，指尖还沾着灶灰…’"></textarea>
        <div class="counter">
          <span id="char-count">0</span>/200 字
          <span id="status-tip"></span>
        </div>
        <button id="generate-btn" class="btn">生成情绪热感标注</button>
      </section>

      <section class="result-section" id="result-section">
        <div class="card">
          <div class="result-header">
            <h2 class="card-title">
              <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
              情绪热感标注版
            </h2>
            <div class="filter-tabs">
              <button class="filter-btn active" data-filter="all">全部</button>
              <button class="filter-btn" data-filter="pause">停顿</button>
              <button class="filter-btn" data-filter="emphasis">重音</button>
              <button class="filter-btn" data-filter="speed">语速</button>
              <button class="filter-btn" data-filter="mood">情绪</button>
            </div>
          </div>
          <div id="annotated-text"></div>
          <div class="legend">
            <div class="legend-item">
              <span class="legend-color legend-pause"></span>
              <span>停顿（｜）</span>
            </div>
            <div class="legend-item">
              <span class="legend-color legend-emphasis"></span>
              <span>重音（【】）</span>
            </div>
            <div class="legend-item">
              <span class="legend-color legend-speed"></span>
              <span>语速建议（↗↘）</span>
            </div>
            <div class="legend-item">
              <span class="legend-color legend-mood"></span>
              <span>情绪关键词</span>
            </div>
          </div>
        </div>
      </section>

      <div class="instructions">
        <p>💡 提示：点击任意标注类型（如「重音」），可高亮查看该类提示；再次点击「全部」恢复完整视图。</p>
      </div>
    </main>
  </div>

  <button id="theme-toggle" class="theme-toggle" aria-label="切换深色/浅色主题">☀️</button>

  <script>
    // 主题切换
    const themeToggle = document.getElementById('theme-toggle');
    const body = document.body;
    
    function updateTheme() {
      const isDark = localStorage.getItem('dark-theme') === 'true';
      if (isDark) {
        body.classList.add('dark-theme');
        themeToggle.innerHTML = '🌙';
      } else {
        body.classList.remove('dark-theme');
        themeToggle.innerHTML = '☀️';
      }
    }

    themeToggle.addEventListener('click', () => {
      const isDark = localStorage.getItem('dark-theme') === 'true';
      localStorage.setItem('dark-theme', String(!isDark));
      updateTheme();
    });

    // 初始化主题
    updateTheme();

    // 字数统计与状态提示
    const inputEl = document.getElementById('script-input');
    const charCountEl = document.getElementById('char-count');
    const statusTipEl = document.getElementById('status-tip');

    inputEl.addEventListener('input', () => {
      const len = inputEl.value.length;
      charCountEl.textContent = len;
      
      if (len < 30 && len > 0) {
        statusTipEl.textContent = '建议 ≥30 字效果更准';
        statusTipEl.style.color = '#3b82f6';
      } else if (len > 200) {
        statusTipEl.textContent = '已超限，将自动截取前200字';
        statusTipEl.style.color = '#ef4444';
      } else {
        statusTipEl.textContent = '';
      }
    });

    // 模拟生成逻辑（轻量本地模拟，无API调用）
    const generateBtn = document.getElementById('generate-btn');
    const resultSection = document.getElementById('result-section');
    const annotatedTextEl = document.getElementById('annotated-text');
    const filterBtns = document.querySelectorAll('.filter-btn');

    // 预设几组典型台词样本（用于演示）
    const sampleScripts = [
      "奶奶颤巍巍递来糖纸，指尖还沾着灶灰，我低头接住，那点甜味在舌尖化开，像小时候偷吃的秘密。",
      "别走！求你再听我说一句——不是道歉，是我想让你知道，那天的雨里，我其实一直站在原地。",
      "这杯咖啡凉了，但我的话还没说完。你看着窗外，而我在等一个眼神，哪怕一秒。"
    ];

    // 模拟AI标注结果（简化逻辑，纯前端生成）
    function mockAnnotate(text) {
      // 简单规则：按句号/逗号切分，随机插入标注
      const sentences = text.split(/([。？！，、])/).filter(s => s.trim());
      let result = [];
      let moodKeywords = ['克制哽咽', '温柔试探', '疲惫中带笑', '欲言又止', '强装镇定'];
      let speedHints = ['↗稍快', '↘渐慢', '→平稳', '↗→↘起伏'];
      let pauseChars = ['｜', '｜', '｜｜', '｜｜｜'];
      let emphasisChars = ['【', '】'];

      for (let i = 0; i < sentences.length; i++) {
        const seg = sentences[i].trim();
        if (!seg) continue;

        let annotated = seg;

        // 插入停顿（每句1–2处）
        if (Math.random() > 0.4 && seg.length > 8) {
          const mid = Math.floor(seg.length / 2);
          const insertPos = Math.max(3, Math.min(mid + (Math.random() - 0.5) * 5, seg.length - 3));
          annotated = seg.slice(0, insertPos) + pauseChars[Math.floor(Math.random() * pauseChars.length)] + seg.slice(insertPos);
        }

        // 插入重音（1–2处）
        if (Math.random() > 0.5 && seg.length > 5) {
          const wordLen = Math.min(3, Math.max(1, Math.floor(Math.random() * 2) + 1));
          const start = Math.floor(Math.random() * (seg.length - wordLen));
          const word = seg.slice(start, start + wordLen);
          annotated = annotated.replace(word, emphasisChars[0] + word + emphasisChars[1]);
        }

        // 插入语速提示（句末）
        if (Math.random() > 0.7) {
          const hint = speedHints[Math.floor(Math.random() * speedHints.length)];
          annotated += ` ${hint}`;
        }

        result.push(annotated);
      }

      // 添加情绪关键词（句首或句末）
      const mood = moodKeywords[Math.floor(Math.random() * moodKeywords.length)];
      result.unshift(`<span class="highlight highlight-mood">【情绪】${mood}</span>`);

      return result.join('');
    }

    // 过滤显示逻辑
    function applyFilter(filter) {
      const allHighlights = annotatedTextEl.querySelectorAll('.highlight');
      allHighlights.forEach(el => {
        el.style.display = 'inline';
      });

      if (filter !== 'all') {
        const types = {
          'pause': '.highlight-pause',
          'emphasis': '.highlight-emphasis',
          'speed': '.highlight-speed',
          'mood': '.highlight-mood'
        };
        const hideSelector = Object.keys(types).filter(k => k !== filter).map(k => types[k]).join(', ');
        const toHide = annotatedTextEl.querySelectorAll(hideSelector);
        toHide.forEach(el => el.style.display = 'none');
      }
    }

    // 绑定过滤按钮
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        applyFilter(btn.dataset.filter);
      });
    });

    // 生成按钮事件
    generateBtn.addEventListener('click', () => {
      const text = inputEl.value.trim();
      if (!text) {
        alert('请先输入台词～');
        return;
      }

      // 截断超长文本
      const processedText = text.length > 200 ? text.substring(0, 200) : text;

      // 模拟加载
      generateBtn.disabled = true;
      generateBtn.textContent = '正在加温…';
      setTimeout(() => {
        const annotatedHTML = mockAnnotate(processedText);
        annotatedTextEl.innerHTML = annotatedHTML;
        resultSection.style.display = 'block';

        // 滚动到结果
        resultSection.scrollIntoView({ behavior: 'smooth' });

        // 重置按钮
        generateBtn.disabled = false;
        generateBtn.textContent = '重新生成';
      }, 800);
    });

    // 初始化：随机填入一条样本台词
    window.addEventListener('load', () => {
      const sample = sampleScripts[Math.floor(Math.random() * sampleScripts.length)];
      inputEl.value = sample;
      charCountEl.textContent = sample.length;
    });
  </script>
</body>
</html>
