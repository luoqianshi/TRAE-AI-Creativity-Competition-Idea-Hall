<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 互动故事生成器</title>
    <style>
        :root {
            --bg-dark: #0a0a1a;
            --bg-card: #12122a;
            --bg-card-hover: #1a1a3e;
            --text-primary: #e8e8f0;
            --text-secondary: #a0a0c0;
            --accent: #7c5cfc;
            --accent-glow: #7c5cfc66;
            --gold: #f0c060;
            --danger: #f05050;
            --success: #50d080;
            --fantasy: #9b59b6;
            --scifi: #3498db;
            --mystery: #2c3e50;
            --wuxia: #e67e22;
            --campus: #1abc9c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 星空背景 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            animation-delay: var(--delay);
            opacity: 0;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        /* 主容器 */
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 头部 */
        .header {
            text-align: center;
            padding: 40px 0 20px;
            animation: slideDown 0.8s ease-out;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header .logo {
            font-size: 48px;
            margin-bottom: 8px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .header h1 {
            font-size: 2.2em;
            background: linear-gradient(135deg, #7c5cfc, #f0c060, #7c5cfc);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease infinite;
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .header .subtitle {
            color: var(--text-secondary);
            font-size: 1.05em;
            margin-top: 6px;
        }

        /* 步骤卡片 */
        .step {
            display: none;
            animation: fadeInUp 0.5s ease-out;
        }
        .step.active {
            display: block;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 32px;
            margin: 12px 0;
            box-shadow: 0 8px 40px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        /* 类型选择 */
        .genre-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
        .genre-card {
            background: var(--bg-card);
            border: 2px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .genre-card:hover {
            border-color: var(--accent);
            background: var(--bg-card-hover);
            transform: translateY(-4px);
            box-shadow: 0 8px 30px var(--accent-glow);
        }
        .genre-card.selected {
            border-color: var(--accent);
            background: rgba(124, 92, 252, 0.15);
            box-shadow: 0 0 30px var(--accent-glow);
        }
        .genre-card .icon {
            font-size: 2.5em;
            margin-bottom: 10px;
            display: block;
        }
        .genre-card .name {
            font-size: 1.1em;
            font-weight: 600;
        }
        .genre-card .desc {
            font-size: 0.8em;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        /* 设置面板 */
        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .setting-row:last-child { border-bottom: none; }
        .setting-row label {
            color: var(--text-secondary);
            font-size: 0.95em;
        }
        .setting-row select, .setting-row input {
            background: var(--bg-dark);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: var(--text-primary);
            padding: 8px 14px;
            font-size: 0.9em;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s;
        }
        .setting-row select:focus, .setting-row input:focus {
            border-color: var(--accent);
        }

        /* 按钮 */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: 12px;
            border: none;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #7c5cfc, #5b3ecc);
            color: white;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(124,92,252,0.5);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.05);
            color: var(--text-primary);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
        }
        .btn-danger {
            background: rgba(240,80,80,0.15);
            color: var(--danger);
            border: 1px solid rgba(240,80,80,0.3);
        }
        .btn-danger:hover {
            background: rgba(240,80,80,0.25);
        }
        .btn-block {
            display: flex;
            width: 100%;
            justify-content: center;
            margin-top: 20px;
        }

        /* 故事面板 */
        .story-panel {
            min-height: 200px;
            position: relative;
        }
        .story-content {
            line-height: 2;
            font-size: 1.05em;
            white-space: pre-wrap;
            position: relative;
        }
        .story-content .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: var(--accent);
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 0.8s step-end infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }

        .segment-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .segment-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }
        .badge-genre {
            background: rgba(124,92,252,0.2);
            color: #b49dff;
        }
        .badge-chapter {
            background: rgba(240,192,96,0.2);
            color: var(--gold);
        }
        .badge-wordcount {
            color: var(--text-secondary);
            font-size: 0.8em;
        }

        /* 选择区域 */
        .choices-area {
            margin-top: 24px;
        }
        .choices-area h3 {
            color: var(--text-secondary);
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }
        .choice-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 16px 20px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1em;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s ease;
            position: relative;
        }
        .choice-btn:hover {
            border-color: var(--accent);
            background: rgba(124,92,252,0.1);
            padding-left: 28px;
            box-shadow: 0 4px 20px rgba(124,92,252,0.15);
        }
        .choice-btn .choice-arrow {
            position: absolute;
            left: 10px;
            opacity: 0;
            transition: all 0.3s ease;
            color: var(--accent);
        }
        .choice-btn:hover .choice-arrow {
            opacity: 1;
            left: 14px;
        }

        /* 历史面板 */
        .history-panel {
            margin-top: 20px;
        }
        .history-panel h3 {
            color: var(--text-secondary);
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }
        .history-panel h3 .arrow {
            transition: transform 0.3s;
            display: inline-block;
        }
        .history-panel.open h3 .arrow {
            transform: rotate(180deg);
        }
        .history-list {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
        }
        .history-panel.open .history-list {
            max-height: 2000px;
        }
        .history-item {
            padding: 12px 16px;
            margin: 8px 0;
            background: rgba(255,255,255,0.02);
            border-left: 3px solid rgba(255,255,255,0.1);
            border-radius: 0 8px 8px 0;
            transition: all 0.3s ease;
        }
        .history-item:hover {
            background: rgba(255,255,255,0.05);
            border-left-color: var(--accent);
        }
        .history-item .h-meta {
            font-size: 0.75em;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .history-item .h-text {
            font-size: 0.9em;
            line-height: 1.6;
        }

        /* 控制栏 */
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        /* 工具栏 */
        .toolbar {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        /* 加载/API 设置区 */
        .api-section {
            background: rgba(124,92,252,0.05);
            border: 1px dashed rgba(124,92,252,0.3);
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
        }
        .api-section h4 {
            color: var(--accent);
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px 24px;
            color: white;
            z-index: 1000;
            animation: toastIn 0.4s ease-out;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .toast.hiding {
            animation: toastOut 0.3s ease-in forwards;
        }
        @keyframes toastOut {
            to { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .app-container { padding: 12px; }
            .card { padding: 20px; border-radius: 16px; }
            .header h1 { font-size: 1.6em; }
            .genre-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .controls { flex-direction: column; }
            .btn { padding: 10px 20px; font-size: 0.95em; }
        }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <!-- 星空背景 -->
    <div class="stars" id="stars"></div>

    <!-- Toast 提示 -->
    <div id="toastContainer"></div>

    <div class="app-container">
        <!-- 头部 -->
        <div class="header">
            <div class="logo">📖</div>
            <h1>互动故事生成器</h1>
            <p class="subtitle">选择你的冒险，AI 为你谱写独一无二的故事</p>
        </div>

        <!-- 步骤 1: 类型选择 -->
        <div class="step active" id="step-genre">
            <div class="card">
                <h2 style="margin-bottom:4px;">🎭 选择故事类型</h2>
                <p style="color:var(--text-secondary);font-size:0.9em;">挑选一个世界，开始你的冒险</p>
                <div class="genre-grid" id="genreGrid">
                    <!-- JS 动态填充 -->
                </div>

                <div class="api-section">
                    <h4>⚙️ API 设置（可选）</h4>
                    <div class="setting-row">
                        <label>生成模式</label>
                        <select id="genMode">
                            <option value="demo">🎲 演示模式（内置故事）</option>
                            <option value="api">🤖 AI 生成（需配置 API）</option>
                        </select>
                    </div>
                    <div id="apiSettings" style="display:none;">
                        <div class="setting-row">
                            <label>API 地址</label>
                            <input type="text" id="apiUrl" placeholder="https://api.openai.com/v1/chat/completions" style="width:100%;">
                        </div>
                        <div class="setting-row">
                            <label>API Key</label>
                            <input type="password" id="apiKey" placeholder="sk-..." style="width:100%;">
                        </div>
                        <div class="setting-row">
                            <label>模型名称</label>
                            <input type="text" id="apiModel" placeholder="gpt-3.5-turbo" style="width:100%;">
                        </div>
                    </div>
                </div>

                <button class="btn btn-primary btn-block" id="btnStart" disabled>
                    🚀 开始冒险
                </button>
            </div>
        </div>

        <!-- 步骤 2: 故事进行中 -->
        <div class="step" id="step-story">
            <div class="card story-panel">
                <div class="segment-meta">
                    <span class="segment-badge badge-genre" id="metaGenre"></span>
                    <span class="segment-badge badge-chapter" id="metaChapter"></span>
                    <span class="segment-badge badge-wordcount" id="metaWordCount"></span>
                </div>
                <div class="story-content" id="storyContent"></div>
            </div>

            <!-- 选择 -->
            <div class="card choices-area" id="choicesArea">
                <h3>🤔 接下来……</h3>
                <div id="choiceButtons"></div>
            </div>

            <!-- 控制按钮 -->
            <div class="controls">
                <button class="btn btn-secondary btn-sm" id="btnHistory" title="查看故事历史">
                    📜 故事历史
                </button>
                <button class="btn btn-secondary btn-sm" id="btnRestart">
                    🔄 重新开始
                </button>
                <button class="btn btn-secondary btn-sm" id="btnExport">
                    💾 导出故事
                </button>
            </div>

            <!-- 历史面板 -->
            <div class="card history-panel" id="historyPanel">
                <h3 onclick="toggleHistory()">
                    📜 故事记录 <span class="arrow">▼</span>
                </h3>
                <div class="history-list" id="historyList"></div>
            </div>
        </div>

        <!-- 步骤 3: 结局 -->
        <div class="step" id="step-ending">
            <div class="card" style="text-align:center;">
                <div style="font-size:4em;margin-bottom:12px;">🎉</div>
                <h2>故事完结！</h2>
                <p style="color:var(--text-secondary);margin:12px 0;" id="endingSummary"></p>
                <div class="toolbar" style="justify-content:center;">
                    <button class="btn btn-primary" id="btnPlayAgain">🔄 再来一次</button>
                    <button class="btn btn-secondary" id="btnViewFull" onclick="toggleHistory();document.getElementById('historyPanel').classList.add('open');">📜 查看完整故事</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== 星空背景 ====================
        function createStars() {
            const container = document.getElementById('stars');
            const count = 100;
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.setProperty('--delay', Math.random() * 3 + 's');
                container.appendChild(star);
            }
        }
        createStars();

        // ==================== 类型定义 ====================
        const genres = [
            { id: 'fantasy', name: '奇幻冒险', icon: '🧙', desc: '魔法、巨龙与英雄传说', color: 'var(--fantasy)' },
            { id: 'scifi', name: '科幻未来', icon: '🚀', desc: '星际航行与人工智能', color: 'var(--scifi)' },
            { id: 'mystery', name: '悬疑推理', icon: '🔍', desc: '谜题、线索与真相', color: 'var(--mystery)' },
            { id: 'wuxia', name: '江湖武侠', icon: '⚔️', desc: '侠客、恩怨与江湖', color: 'var(--wuxia)' },
            { id: 'campus', name: '校园青春', icon: '🎒', desc: '友情、成长与梦想', color: 'var(--campus)' },
        ];

        // ==================== 演示故事库 ====================
        const storyDB = {
            fantasy: {
                title: '奇幻冒险',
                start: {
                    text: '夜幕降临，古老的黑森林笼罩在神秘的薄雾中。你站在森林边缘，手中紧握着祖传的魔法护符，它能感知到前方隐藏的力量。\n\n远处传来狼嚎，月光透过枝叶洒下斑驳的光影。你深吸一口气，踏上了通往未知的第一步。突然间，护符开始微微发光……\n\n树林深处，有东西在召唤你。',
                    choices: [
                        { text: '跟随护符的光芒深入森林', next: 'follow_light' },
                        { text: '先在森林边缘扎营，等天亮再行动', next: 'camp' },
                        { text: '爬上附近的高树，先观察周围地形', next: 'climb' },
                    ]
                },
                follow_light: {
                    text: '你沿着发光的方向前进，树枝在身后轻轻合拢，仿佛森林在吞噬来路。走了大约半个时辰，你来到一处隐秘的林中空地。\n\n空地中央伫立着一座古老的石台，石台上放着一本泛着金光的魔法书。书页自动翻开，上面浮现出流动的符文。\n\n一个低沉的声音在你脑海中响起："终于……你来了。被选中的人。"',
                    choices: [
                        { text: '伸手触摸魔法书', next: 'touch_book' },
                        { text: '后退，警惕地质问那个声音', next: 'question_voice' },
                        { text: '用护符探查魔法书的能量', next: 'scan_book' },
                    ]
                },
                scan_book: {
                    text: '你举起护符对准魔法书，符文中射出一道探测之光。护符震动起来，显示出一个古老的名字——"麦林"。\n\n就在此时，书页猛然翻开，一个身穿星袍的老法师幻影从书中浮出。"千年了，终于有人持护符而来。"他的声音苍老而庄严，"孩子，黑暗正在苏醒，你愿意继承我的力量吗？"',
                    choices: [
                        { text: '接受传承，走入书中世界', next: 'ending_hero' },
                        { text: '询问如何才能对抗黑暗', next: 'ask_darkness' },
                        { text: '谨慎地说需要时间考虑', next: 'not_ready' },
                    ]
                },
                camp: {
                    text: '你在森林边缘找了一块平整的岩石，生起篝火。火焰跳动的光影中，你注意到远处的灌木丛中有两只发光的眼睛正注视着你。\n\n那不是野兽的眼睛——那是一双充满智慧的眼睛。一只浑身雪白的九尾狐缓缓走出，化作一位银发少女。\n\n"夜深了，旅人。"她的声音如风铃般清脆，"这森林不太平，不如随我去安全的地方？"',
                    choices: [
                        { text: '相信她，跟她走', next: 'fox_trail' },
                        { text: '婉拒，独自继续旅程', next: 'alone_continue' },
                        { text: '问她森林中发生了什么', next: 'ask_danger' },
                    ]

        // ==================== 应用状态 ====================
        const state = {

            currentNode: null,

            chapter: 0,
            isTyping: false,

            genMode: 'demo',

        // ==================== UI 辅助 ====================
        function showStep(id) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            const el = document.getElementById(id);
            if (el) el.classList.add('active');
        }

        function showToast(msg, duration = 2000) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('hiding');
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        function toggleHistory() {
            document.getElementById('historyPanel').classList.toggle('open');
        }

        // ==================== 渲染类型卡片 ====================
        function renderGenres() {
            const grid = document.getElementById('genreGrid');
            grid.innerHTML = genres.map(g => `
            <div class="genre-card" data-genre="${g.id}" onclick="selectGenre('${g.id}')">
              <span class="icon">${g.icon}</span>
              <div class="name">${g.name}</div>
              <div class="desc">${g.desc}</div>
            </div>
          `).join('');
        }

        function selectGenre(id) {
            state.currentGenre = id;
            document.querySelectorAll('.genre-card').forEach(c => c.classList.remove('selected'));
            const card = document.querySelector(`.genre-card[data-genre="${id}"]`);
            if (card) card.classList.add('selected');
            document.getElementById('btnStart').disabled = false;
        }

        // ==================== 打字动画 ====================
        function typeText(element, text, speed = 40, callback) {
            state.isTyping = true;
            if (state.typingTimer) clearInterval(state.typingTimer);
            element.innerHTML = '';
            let i = 0;
            const cursor = document.createElement('span');
            cursor.className = 'typing-cursor';
            element.appendChild(cursor);

            state.typingTimer = setInterval(() => {
                if (i < text.length) {
                    const char = text[i];
                    if (char === '\n') {
                        cursor.insertAdjacentHTML('beforebegin', '<br>');
                    } else {
                        cursor.insertAdjacentHTML('beforebegin', char);
                    }
                    i++;
                    // 滚动到底部
                    element.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    clearInterval(state.typingTimer);
                    state.typingTimer = null;
                    cursor.remove();
                    state.isTyping = false;
                    if (callback) callback();
                }
            }, speed);
        }

        function skipTyping(element, text) {
            if (state.typingTimer) clearInterval(state.typingTimer);
            state.typingTimer = null;
            element.innerHTML = text.replace(/\n/g, '<br>');
            state.isTyping = false;
        }

        // ==================== 渲染故事 ====================
        function renderStory(nodeId, choiceText) {
            const story = storyDB[state.currentGenre];
            if (!story) {
                console.error('Genre not found:', state.currentGenre);
                showToast('故事数据出错，请重新开始');
                return;
            }
            const node = story[nodeId];
            if (!node) {
                console.error('Node not found:', nodeId, 'in genre:', state.currentGenre);
                // 容错：自动生成一个结局
                const fallbackEnding = {
                    text: `你做出了选择——「${choiceText || '继续前行'}」。\n\n故事在这里暂时告一段落。也许前方还有更多的冒险等待，也许这个选择本身就是最好的结局。\n\n无论如何，你已经在这段旅程中留下了自己的足迹。`,
                    isEnding: true
                };
                // 将 fallback 注册到 story 中以支持后续流程
                story[nodeId] = fallbackEnding;
                showToast('该分支故事尚在创作中，已自动收尾');
            }

            const resolvedNode = story[nodeId];
            state.currentNode = nodeId;
            state.chapter++;

            // 添加到历史
            if (choiceText) {
                state.history.push({
                    type: 'choice',
                    text: choiceText,
                    chapter: state.chapter,
                });
            }
            state.history.push({
                type: 'story',
                text: resolvedNode.text,
                chapter: state.chapter,
            });

            // 更新 meta
            document.getElementById('metaGenre').textContent = story.title;
            document.getElementById('metaChapter').textContent = `第 ${state.chapter} 章`;
            document.getElementById('metaWordCount').textContent = `约 ${resolvedNode.text.length} 字`;

            showStep('step-story');

            const contentEl = document.getElementById('storyContent');

            if (state.genMode === 'demo') {
                // 演示模式使用打字动画
                typeText(contentEl, resolvedNode.text, 35, () => {
                    renderChoices(resolvedNode);
                });
                // 点击文本跳过动画
                contentEl.onclick = () => {
                    if (state.isTyping) {
                        skipTyping(contentEl, resolvedNode.text);
                        renderChoices(resolvedNode);
                    }
                };
            } else {
                contentEl.innerHTML = resolvedNode.text.replace(/\n/g, '<br>');
                renderChoices(resolvedNode);
            }

            // 更新历史面板
            renderHistory();

            // 如果是结局
            if (resolvedNode.isEnding) {
                document.getElementById('choicesArea').style.display = 'none';
                document.getElementById('endingSummary').textContent =
                    `你经历了 ${state.chapter} 个章节，完成了一段精彩的冒险。`;
                setTimeout(() => showStep('step-ending'), 2000);
            }
        }

        function renderChoices(node) {
            const choicesArea = document.getElementById('choicesArea');
            const choiceBtns = document.getElementById('choiceButtons');

            if (!node.choices || node.choices.length === 0) {
                choicesArea.style.display = 'none';
                return;
            }

            choicesArea.style.display = 'block';
            choiceBtns.innerHTML = node.choices.map((c, i) => `
            <button class="choice-btn" onclick="makeChoice('${c.next}', '${escapeHtml(c.text)}')">
              <span class="choice-arrow">▶</span>
              <span style="margin-left:8px;">${c.text}</span>
            </button>
          `).join('');
        }

        function makeChoice(nextNode, choiceText) {
            if (state.isTyping) {
                // 如果还在打字，先跳过
                const story = storyDB[state.currentGenre];
                const node = story[state.currentNode];
                const contentEl = document.getElementById('storyContent');
                skipTyping(contentEl, node.text);
                // 等一帧让 DOM 更新
                setTimeout(() => makeChoice(nextNode, choiceText), 50);
                return;
            }
            renderStory(nextNode, choiceText);
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ==================== 历史面板 ====================
        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = state.history.map(h => `
            <div class="history-item">
              <div class="h-meta">${h.type === 'choice' ? '🎯 你的选择' : '📖 第' + h.chapter + '章'}</div>
              <div class="h-text">${h.type === 'choice' ? '➤ ' + h.text : h.text.replace(/\n/g, '<br>')}</div>
            </div>
          `).join('');
        }

        // ==================== 按钮事件 ====================
        document.getElementById('btnStart').addEventListener('click', () => {
            if (!state.currentGenre) {
                showToast('请先选择一个故事类型！');
                return;
            }
            state.history = [];
            state.chapter = 0;
            const story = storyDB[state.currentGenre];
            renderStory('start', null);
        });

        document.getElementById('btnRestart').addEventListener('click', () => {
            if (confirm('确定要重新开始吗？当前故事进度将丢失。')) {
                state.history = [];
                state.chapter = 0;
                state.currentNode = null;
                showStep('step-genre');
                selectGenre(state.currentGenre);
            }
        });

        document.getElementById('btnPlayAgain').addEventListener('click', () => {
            state.history = [];
            state.chapter = 0;
            state.currentNode = null;
            showStep('step-genre');
            selectGenre(state.currentGenre);
        });

        document.getElementById('btnExport').addEventListener('click', () => {
            if (state.history.length === 0) {
                showToast('还没有故事可以导出！');
                return;
            }
            const story = storyDB[state.currentGenre];
            let text = `《${story.title}》\n`;
            text += '='.repeat(40) + '\n\n';
            state.history.forEach(h => {
                if (h.type === 'story') {
                    text += `第 ${h.chapter} 章\n${'-'.repeat(20)}\n${h.text}\n\n`;
                } else {
                    text += `🎯 选择：${h.text}\n\n`;
                }
            });
            const blob = new Blob([text], { type: 'text/plain;charset=UTF-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `互动故事_${story.title}_${new Date().toLocaleDateString()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('故事已导出！');
        });

        // ==================== API 设置切换 ====================
        document.getElementById('genMode').addEventListener('change', (e) => {
            state.genMode = e.target.value;
            document.getElementById('apiSettings').style.display =
                e.target.value === 'api' ? 'block' : 'none';
            if (e.target.value === 'api') {
                showToast('API 模式：需自行配置 Key 和地址');
            }
        });

        // ==================== 键盘快捷键 ====================
        document.addEventListener('keydown', (e) => {
            // 数字键 1-3 快速选择
            if (state.currentNode && !state.isTyping) {
                const story = storyDB[state.currentGenre];
                const node = story[state.currentNode];
                if (node && node.choices) {
                    const num = parseInt(e.key);
                    if (num >= 1 && num <= node.choices.length) {
                        const choice = node.choices[num - 1];
                        makeChoice(choice.next, choice.text);
                    }
                }
            }
            // 空格键跳过打字动画
            if (e.key === ' ' && state.isTyping) {
                e.preventDefault();
                const story = storyDB[state.currentGenre];
                const node = story[state.currentNode];
                const contentEl = document.getElementById('storyContent');
                if (node && contentEl) {
                    skipTyping(contentEl, node.text);
                    renderChoices(node);
                }
            }
        });

        // ==================== 初始化 ====================
        function init() {
            renderGenres();
            // 默认选中第一个类型
            selectGenre(genres[0].id);
        }
        init();

        console.log('📖 互动故事生成器已就绪！');
        console.log('  - 选择故事类型开始冒险');
        console.log('  - 按数字键 1-3 快速选择');
        console.log('  - 按空格键跳过打字动画');
        console.log('  - 点击故事文本也可跳过动画');
    </script>
</body>
</html>
