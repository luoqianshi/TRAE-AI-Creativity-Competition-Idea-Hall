  <style>
    :root {

      --bg2: #12122a;
      --ink: #e8e8f0;
      --muted: #8888a0;
      --rule: #2a2a4a;
      --accent: #00d4ff;
      --accent2: #ff6b9d;
      --accent3: #a855f7;
      --accent-glow: rgba(0, 212, 255, 0.3);
      --font: 'Outfit', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-display: 'Tektur', 'Outfit', sans-serif;
      --font-mono: 'JetBrainsMono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Canvas Background */
    #nebula-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: all;
    }

    /* Content Layer */
    .content-layer {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 2rem;
      animation: fadeInDown 1s ease-out;
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 1rem;
      border: 1px solid var(--accent);
      border-radius: 100px;
      font-size: 0.75rem;
      color: var(--accent);
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
    }
    .logo-badge::before {
      content: '';
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    .header h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 500;
      background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    .header p {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 520px;
      margin: 0 auto;
    }

    /* Control Panel */
    .control-panel {
      background: rgba(18, 18, 42, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid var(--rule);
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 600px;
      margin-bottom: 2rem;
      animation: fadeInUp 1s ease-out 0.3s both;
    }
    .domain-selector {
      margin-bottom: 1.5rem;
    }
    .domain-selector-label {
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.75rem;
      display: block;
      font-family: var(--font-mono);
    }
    .domain-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .domain-tag {
      padding: 0.4rem 0.9rem;
      border-radius: 100px;
      border: 1px solid var(--rule);
      background: transparent;
      color: var(--muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: var(--font);
      position: relative;
      overflow: hidden;
    }
    .domain-tag:hover {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
    }
    .domain-tag.active {
      border-color: var(--accent);
      color: var(--bg);
      background: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }
    .domain-tag .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      transform: scale(0);
      animation: ripple 0.6s linear;
      pointer-events: none;
    }

    .generate-btn {
      width: 100%;
      padding: 1rem 2rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      color: var(--bg);
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 500;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .generate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 40px rgba(0, 212, 255, 0.3);
    }
    .generate-btn:active {
      transform: translateY(0);
    }
    .generate-btn.generating {
      pointer-events: none;
      opacity: 0.7;
    }
    .generate-btn .btn-text {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .generate-btn .btn-icon {
      font-size: 1.2rem;
      transition: transform 0.5s ease;
    }
    .generate-btn.generating .btn-icon {
      animation: spin 1s linear infinite;
    }

    /* Idea Card */
    .idea-stage {
      width: 100%;
      max-width: 700px;
      perspective: 1000px;
    }
    .idea-card {
      background: rgba(18, 18, 42, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid var(--rule);
      border-radius: 20px;
      padding: 2rem;
      margin-bottom: 1.5rem;
      position: relative;
      overflow: hidden;
      animation: cardAppear 0.6s ease-out;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .idea-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 0 0 30px rgba(0, 212, 255, 0.1);
    }
    .idea-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
    }
    .idea-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .idea-domains {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .idea-domain-tag {
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .idea-domain-tag.tech { background: rgba(0, 212, 255, 0.15); color: var(--accent); }
    .idea-domain-tag.art { background: rgba(255, 107, 157, 0.15); color: var(--accent2); }
    .idea-domain-tag.nature { background: rgba(74, 222, 128, 0.15); color: #4ade80; }
    .idea-domain-tag.business { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }
    .idea-domain-tag.life { background: rgba(192, 132, 252, 0.15); color: #c084fc; }
    .idea-domain-tag.society { background: rgba(248, 113, 113, 0.15); color: #f87171; }

    .idea-score {
      text-align: right;
    }
    .score-value {
      font-family: var(--font-display);
      font-size: 1.5rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .score-label {
      font-size: 0.65rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .idea-title {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }
    .idea-desc {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.7;
      margin-bottom: 1rem;
    }
    .idea-scenario {
      background: rgba(0, 212, 255, 0.05);
      border-left: 3px solid var(--accent);
      padding: 0.75rem 1rem;
      border-radius: 0 8px 8px 0;
      font-size: 0.85rem;
      color: var(--ink);
      margin-bottom: 1rem;
    }
    .idea-scenario-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.25rem;
    }
    .idea-actions {
      display: flex;
      gap: 0.75rem;
    }
    .idea-btn {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--rule);
      background: transparent;
      color: var(--muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: var(--font);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .idea-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .idea-btn.favorited {
      border-color: var(--accent2);
      color: var(--accent2);
    }

    /* Favorites Panel */
    .favorites-panel {
      position: fixed;
      right: -400px;
      top: 0;
      width: 380px;
      height: 100vh;
      background: rgba(10, 10, 26, 0.98);
      backdrop-filter: blur(20px);
      border-left: 1px solid var(--rule);
      z-index: 100;
      transition: right 0.4s ease;
      padding: 1.5rem;
      overflow-y: auto;
    }
    .favorites-panel.open {
      right: 0;
    }
    .favorites-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .favorites-header h3 {
      font-family: var(--font-display);
      font-size: 1.1rem;
    }
    .close-panel {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.25rem;
      line-height: 1;
    }
    .close-panel:hover {
      color: var(--ink);
    }
    .fav-toggle {
      position: fixed;
      right: 1.5rem;
      top: 1.5rem;
      z-index: 99;
      width: 44px; height: 44px;
      border-radius: 12px;
      border: 1px solid var(--rule);
      background: rgba(18, 18, 42, 0.9);
      backdrop-filter: blur(10px);
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fav-toggle:hover {
      border-color: var(--accent2);
      color: var(--accent2);
      box-shadow: 0 0 20px rgba(255, 107, 157, 0.2);
    }
    .fav-count {
      position: absolute;
      top: -6px; right: -6px;
      background: var(--accent2);
      color: var(--bg);
      font-size: 0.65rem;
      font-weight: 700;
      width: 18px; height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
    }
    .fav-idea-item {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .fav-idea-item:hover {
      border-color: var(--accent);
    }
    .fav-idea-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .fav-idea-domains {
      font-size: 0.7rem;
      color: var(--muted);
      font-family: var(--font-mono);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
      animation: fadeIn 1s ease-out 0.6s both;
    }
    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }
    .empty-state p {
      font-size: 0.9rem;
    }

    /* Overlay for collision effect */
    .collision-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 50;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(30px) rotateX(10deg); }
      to { opacity: 1; transform: translateY(0) rotateX(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes ripple {
      to { transform: scale(4); opacity: 0; }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    /* Responsive */
    @media (max-width: 600px) {
      .content-layer { padding: 1.5rem 0.75rem 3rem; }
      .control-panel { padding: 1.5rem; }
      .idea-card { padding: 1.5rem; }
      .favorites-panel { width: 100%; right: -100%; }
      .header h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <canvas id="nebula-canvas"></canvas>

  <div class="content-layer">
    <header class="header">
      <div class="logo-badge">TRAE AI 创造力大赛</div>
      <h1>灵感星云</h1>
      <p>在浩瀚的灵感宇宙中探索跨界可能。选择你感兴趣的领域，让 AI 为你点燃创新的火花。</p>
    </header>

    <div class="control-panel">
      <div class="domain-selector">
        <span class="domain-selector-label">选择灵感领域（可多选）</span>
        <div class="domain-tags" id="domainTags">
          <button class="domain-tag active" data-domain="tech" data-color="#00d4ff">
            <span class="tag-icon">&#9889;</span> 科技
          </button>
          <button class="domain-tag active" data-domain="art" data-color="#ff6b9d">
            <span class="tag-icon">&#127912;</span> 艺术
          </button>
          <button class="domain-tag active" data-domain="nature" data-color="#4ade80">
            <span class="tag-icon">&#127807;</span> 自然
          </button>
          <button class="domain-tag active" data-domain="business" data-color="#fbbf24">
            <span class="tag-icon">&#128200;</span> 商业
          </button>
          <button class="domain-tag active" data-domain="life" data-color="#c084fc">
            <span class="tag-icon">&#127861;</span> 生活
          </button>
          <button class="domain-tag active" data-domain="society" data-color="#f87171">
            <span class="tag-icon">&#127758;</span> 社会
          </button>
        </div>
      </div>
      <button class="generate-btn" id="generateBtn">
        <span class="btn-text">
          <span class="btn-icon">&#10024;</span>
          <span>激发灵感</span>
        </span>
      </button>
    </div>

    <div class="idea-stage" id="ideaStage">
      <div class="empty-state">
        <div class="empty-state-icon">&#127775;</div>
        <p>点击「激发灵感」按钮，探索跨界创意的无限可能</p>
      </div>
    </div>
  </div>

  <button class="fav-toggle" id="favToggle" title="我的收藏">
    <span>&#9829;</span>
    <span class="fav-count" id="favCount" style="display:none">0</span>
  </button>

  <div class="favorites-panel" id="favoritesPanel">
    <div class="favorites-header">
      <h3>&#9829; 我的收藏</h3>
      <button class="close-panel" id="closePanel">&times;</button>
    </div>
    <div id="favoritesList"></div>
  </div>

  <canvas class="collision-overlay" id="collisionCanvas"></canvas>

  <script src="./assets/app.js"></script>
</body>
