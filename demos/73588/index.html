<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>字母探险家 - Letter Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ========== Reset & Base ========== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --orange: #FF9A56;
  --coral: #FF6B6B;
  --sky: #4ECDC4;
  --yellow: #FFE66D;
  --bg-start: #FFF5EE;
  --bg-end: #E8F8F5;
  --card-bg: #FFFFFF;
  --text-dark: #2D3436;
  --text-light: #636E72;
  --shadow: 0 8px 32px rgba(0,0,0,0.12);
  --radius-btn: 30px;
  --font: 'Quicksand', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
}

body {
  font-family: var(--font);
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow-x: hidden;
}

/* ========== Phone Frame ========== */
.phone-frame {
  width: 100%;
  max-width: 430px;
  height: 90vh;
  max-height: 900px;
  background: linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
  border-radius: 40px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3), inset 0 0 0 3px rgba(255,255,255,0.2);
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}

/* Notch */
.phone-frame::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 150px;
  height: 28px;
  background: #1a1a2e;
  border-radius: 0 0 20px 20px;
  z-index: 100;
}

.phone-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding-top: 28px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}

/* ========== Decorative Clouds ========== */
.cloud {
  position: absolute;
  opacity: 0.15;
  font-size: 40px;
  z-index: 0;
  pointer-events: none;
  animation: floatCloud 12s ease-in-out infinite;
}
.cloud-1 { top: 60px; left: 10px; animation-delay: 0s; }
.cloud-2 { top: 120px; right: 15px; animation-delay: 3s; font-size: 30px; }
.cloud-3 { bottom: 100px; left: 20px; animation-delay: 6s; font-size: 35px; }

@keyframes floatCloud {
  0%, 100% { transform: translateY(0) translateX(0); }
  50% { transform: translateY(-12px) translateX(8px); }
}

/* ========== Status Bar ========== */
.status-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 16px;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  position: sticky;
  top: 0;
  z-index: 50;
}

.status-left {
  display: flex;
  align-items: center;
  gap: 6px;
}

.fox-avatar {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, var(--orange), var(--coral));
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  box-shadow: 0 2px 8px rgba(255,154,86,0.4);
}

.nickname {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dark);
}

.status-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--coral);
  text-align: center;
}

.parent-btn {
  background: rgba(255,255,255,0.8);
  border: 2px solid var(--sky);
  border-radius: 20px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 600;
  font-family: var(--font);
  color: var(--sky);
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  gap: 4px;
}
.parent-btn:active { transform: scale(0.95); background: var(--sky); color: #fff; }

/* ========== Banner ========== */
.celebration-banner {
  position: absolute;
  top: 40px;
  left: 50%;
  transform: translateX(-50%) translateY(-100px);
  background: linear-gradient(135deg, var(--yellow), var(--orange));
  color: #fff;
  font-size: 18px;
  font-weight: 700;
  padding: 12px 28px;
  border-radius: 20px;
  box-shadow: 0 6px 24px rgba(255,154,86,0.5);
  z-index: 200;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
}
.celebration-banner.show {
  animation: bannerSlide 2.5s ease forwards;
}
@keyframes bannerSlide {
  0% { transform: translateX(-50%) translateY(-100px) scale(0.5); opacity: 0; }
  15% { transform: translateX(-50%) translateY(0) scale(1.1); opacity: 1; }
  20% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
  75% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
  100% { transform: translateX(-50%) translateY(-60px) scale(0.8); opacity: 0; }
}

/* ========== Learning Card ========== */
.card-section {
  padding: 12px 16px;
  position: relative;
}

.learning-card {
  background: linear-gradient(135deg, #fff 0%, #FFF8F0 100%);
  border-radius: 24px;
  padding: 20px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
  cursor: pointer;
  min-height: 280px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* Stars in card background */
.card-star {
  position: absolute;
  font-size: 14px;
  opacity: 0.3;
  pointer-events: none;
  animation: twinkleStar 3s ease-in-out infinite;
}
.card-star:nth-child(1) { top: 10%; left: 8%; animation-delay: 0s; }
.card-star:nth-child(2) { top: 20%; right: 12%; animation-delay: 0.8s; }
.card-star:nth-child(3) { bottom: 25%; left: 15%; animation-delay: 1.6s; }
.card-star:nth-child(4) { bottom: 15%; right: 8%; animation-delay: 0.4s; }
.card-star:nth-child(5) { top: 45%; left: 5%; animation-delay: 2.2s; }
.card-star:nth-child(6) { top: 35%; right: 5%; animation-delay: 1.2s; }

@keyframes twinkleStar {
  0%, 100% { opacity: 0.2; transform: scale(0.8) rotate(0deg); }
  50% { opacity: 0.6; transform: scale(1.2) rotate(15deg); }
}

/* Fox mascot in card */
.card-mascot {
  position: absolute;
  top: 8px;
  right: 12px;
  font-size: 28px;
  animation: foxBounce 2s ease-in-out infinite;
}
@keyframes foxBounce {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-6px) rotate(5deg); }
}

.letter-display {
  font-size: 80px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--coral), var(--orange));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
  margin-bottom: 8px;
  animation: letterEntry 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
  transform-style: preserve-3d;
  perspective: 600px;
}

@keyframes letterEntry {
  0% { transform: rotateY(180deg) scale(0.3); opacity: 0; }
  60% { transform: rotateY(-10deg) scale(1.1); opacity: 1; }
  80% { transform: rotateY(5deg) scale(0.95); }
  100% { transform: rotateY(0deg) scale(1); opacity: 1; }
}

.letter-entry {
  animation: letterEntry 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
}

.word-display {
  font-size: 26px;
  font-weight: 700;
  color: var(--text-dark);
  margin-bottom: 4px;
  animation: wordPop 0.5s ease forwards;
  animation-delay: 0.3s;
  opacity: 0;
  transform: scale(0);
}

@keyframes wordPop {
  0% { transform: scale(0); opacity: 0; }
  70% { transform: scale(1.15); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

.word-entry {
  animation: wordPop 0.5s ease forwards;
}

.meaning-display {
  font-size: 16px;
  color: var(--text-light);
  margin-bottom: 6px;
}

.sentence-display {
  font-size: 13px;
  color: var(--text-light);
  font-style: italic;
  margin-bottom: 12px;
  opacity: 0;
  animation: fadeInUp 0.5s ease forwards 0.6s;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.sentence-entry {
  animation: fadeInUp 0.5s ease forwards;
  animation-delay: 0.2s;
}

.read-btn {
  background: linear-gradient(135deg, var(--coral), #FF8E8E);
  color: #fff;
  border: none;
  border-radius: var(--radius-btn);
  padding: 12px 32px;
  font-size: 16px;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(255,107,107,0.4);
  transition: all 0.3s ease;
  margin-top: 8px;
}
.read-btn:active { transform: scale(0.95); box-shadow: 0 2px 8px rgba(255,107,107,0.3); }

.tap-hint {
  font-size: 11px;
  color: #B2BEC3;
  margin-top: 10px;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

/* +1 Star float animation */
.star-float {
  position: fixed;
  font-size: 24px;
  font-weight: 700;
  color: var(--yellow);
  z-index: 300;
  pointer-events: none;
  text-shadow: 0 2px 8px rgba(255,230,109,0.6);
  animation: starFloat 1.2s ease-out forwards;
}
@keyframes starFloat {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-80px) scale(1.5); }
}

/* ========== Progress Map ========== */
.map-section {
  padding: 8px 16px 12px;
}

.map-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.map-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-dark);
  display: flex;
  align-items: center;
  gap: 6px;
}

.progress-text {
  font-size: 13px;
  font-weight: 600;
  color: var(--coral);
  background: rgba(255,107,107,0.1);
  padding: 4px 12px;
  border-radius: 12px;
}

.letter-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
}

.letter-node {
  aspect-ratio: 1;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  position: relative;
  transition: all 0.3s ease;
  cursor: default;
}

.letter-node.learned {
  background: linear-gradient(135deg, var(--sky), #45B7AA);
  color: #fff;
  box-shadow: 0 2px 8px rgba(78,205,196,0.3);
}

.letter-node.current {
  background: linear-gradient(135deg, var(--orange), var(--coral));
  color: #fff;
  box-shadow: 0 0 0 0 rgba(255,154,86,0.4);
  animation: breathGlow 2s ease-in-out infinite;
  font-size: 18px;
  z-index: 2;
}

@keyframes breathGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,154,86,0.4), 0 4px 12px rgba(255,107,107,0.3); }
  50% { box-shadow: 0 0 0 8px rgba(255,154,86,0), 0 4px 16px rgba(255,107,107,0.5); }
}

.letter-node.locked {
  background: #E8E8E8;
  color: #BDBDBD;
}

.letter-node .check-mark {
  position: absolute;
  top: 2px;
  right: 3px;
  font-size: 10px;
}

.letter-node .lock-icon {
  font-size: 10px;
  opacity: 0.5;
}

/* ========== Bottom Toolbar ========== */
.bottom-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: rgba(255,255,255,0.8);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid rgba(0,0,0,0.05);
  margin-top: auto;
}

.coins {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 16px;
  font-weight: 700;
  color: var(--text-dark);
}

.coins-anim {
  transition: all 0.3s ease;
}
.coins-anim.bump {
  animation: coinBump 0.4s ease;
}
@keyframes coinBump {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

.game-btn {
  background: linear-gradient(135deg, var(--sky), #45B7AA);
  color: #fff;
  border: none;
  border-radius: var(--radius-btn);
  padding: 10px 24px;
  font-size: 14px;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(78,205,196,0.4);
  transition: all 0.3s ease;
}
.game-btn:active { transform: scale(0.95); }

/* ========== Modals ========== */
.modal-overlay {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.4);
  z-index: 500;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.modal-overlay.active {
  display: flex;
  opacity: 1;
}

.modal-box {
  background: #fff;
  border-radius: 24px;
  padding: 24px;
  width: 100%;
  max-width: 360px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  transform: scale(0.8);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
}
.modal-overlay.active .modal-box {
  transform: scale(1);
}

.modal-close {
  position: absolute;
  top: 12px;
  right: 16px;
  background: none;
  border: none;
  font-size: 24px;
  cursor: pointer;
  color: #B2BEC3;
  font-family: var(--font);
  line-height: 1;
}

.modal-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-dark);
  text-align: center;
  margin-bottom: 16px;
}

/* Password modal */
.password-input {
  width: 100%;
  padding: 14px 18px;
  border: 2px solid #E0E0E0;
  border-radius: 16px;
  font-size: 18px;
  font-family: var(--font);
  text-align: center;
  letter-spacing: 8px;
  outline: none;
  transition: border-color 0.3s;
}
.password-input:focus { border-color: var(--sky); }

.modal-submit {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--sky), #45B7AA);
  color: #fff;
  border: none;
  border-radius: var(--radius-btn);
  font-size: 16px;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  margin-top: 12px;
  transition: all 0.3s ease;
}
.modal-submit:active { transform: scale(0.97); }

/* Report modal */
.report-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: #F8F9FA;
  border-radius: 14px;
  margin-bottom: 8px;
}
.report-label {
  font-size: 14px;
  color: var(--text-light);
  font-weight: 600;
}
.report-value {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-dark);
}

/* Read aloud popup */
.read-popup {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  background: linear-gradient(135deg, var(--yellow), var(--orange));
  color: #fff;
  font-size: 20px;
  font-weight: 700;
  padding: 20px 32px;
  border-radius: 24px;
  z-index: 600;
  text-align: center;
  box-shadow: 0 10px 40px rgba(255,154,86,0.5);
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
  opacity: 0;
}
.read-popup.show {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}

/* ========== Game Modal ========== */
.game-modal .modal-box {
  max-width: 380px;
  max-height: 70vh;
  overflow-y: auto;
}

.game-area {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 10px 0;
}

.game-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.game-col-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-light);
  text-align: center;
  margin-bottom: 4px;
}

.game-item {
  padding: 14px;
  border-radius: 16px;
  text-align: center;
  font-size: 28px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
  border: 3px solid transparent;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.game-item.letter-item {
  background: linear-gradient(135deg, #FFF3E0, #FFE0CC);
  color: var(--orange);
  font-size: 32px;
}
.game-item.letter-item.selected {
  border-color: var(--orange);
  box-shadow: 0 0 0 3px rgba(255,154,86,0.2);
}
.game-item.letter-item.matched {
  background: linear-gradient(135deg, var(--sky), #45B7AA);
  color: #fff;
  border-color: var(--sky);
}

.game-item.emoji-item {
  background: linear-gradient(135deg, #E8F5E9, #C8E6C9);
  font-size: 36px;
}
.game-item.emoji-item.selected {
  border-color: var(--sky);
  box-shadow: 0 0 0 3px rgba(78,205,196,0.2);
}
.game-item.emoji-item.matched {
  background: linear-gradient(135deg, var(--sky), #45B7AA);
  border-color: var(--sky);
}

.game-item.wrong {
  animation: shakeItem 0.4s ease;
  border-color: var(--coral);
}
@keyframes shakeItem {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

.game-status {
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  color: var(--sky);
  margin-top: 12px;
  min-height: 20px;
}

.game-complete {
  text-align: center;
  padding: 20px;
}
.game-complete-emoji {
  font-size: 60px;
  margin-bottom: 8px;
  animation: celebratePop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes celebratePop {
  0% { transform: scale(0); }
  100% { transform: scale(1); }
}
.game-complete-text {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-dark);
}

/* ========== Reduced Motion ========== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ========== Scrollbar ========== */
.phone-content::-webkit-scrollbar { width: 3px; }
.phone-content::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 3px; }
</style>
</head>
<body>

<div class="phone-frame" id="app">
  <!-- Decorative clouds -->
  <div class="cloud cloud-1">☁️</div>
  <div class="cloud cloud-2">☁️</div>
  <div class="cloud cloud-3">⭐</div>

  <!-- Celebration banner -->
  <div class="celebration-banner" id="banner">🎁 你的新字母来啦！</div>

  <!-- Read aloud popup -->
  <div class="read-popup" id="readPopup">🗣️ 请大声读出来！<br><span style="font-size:14px;opacity:0.8">大声朗读，小狐狸在听哦~</span></div>

  <div class="phone-content">
    <!-- Status Bar -->
    <div class="status-bar">
      <div class="status-left">
        <div class="fox-avatar">🦊</div>
        <span class="nickname">小狐狸奇奇</span>
      </div>
      <div class="status-title">今日探险任务</div>
      <button class="parent-btn" onclick="openParentCenter()">🔒 家长</button>
    </div>

    <!-- Learning Card -->
    <div class="card-section">
      <div class="learning-card" id="learningCard" onclick="switchWord()">
        <div class="card-star">⭐</div>
        <div class="card-star">✨</div>
        <div class="card-star">⭐</div>
        <div class="card-star">✨</div>
        <div class="card-star">⭐</div>
        <div class="card-star">✨</div>
        <div class="card-mascot">🦊</div>

        <div class="letter-display" id="letterDisplay">Aa</div>
        <div class="word-display" id="wordDisplay">🍎 Apple</div>
        <div class="meaning-display" id="meaningDisplay">苹果</div>
        <div class="sentence-display" id="sentenceDisplay">"I like apples."</div>

        <button class="read-btn" onclick="event.stopPropagation(); startReading()">🎤 点我跟读</button>
        <div class="tap-hint">👆 点击卡片切换更多单词</div>
      </div>
    </div>

    <!-- Progress Map -->
    <div class="map-section">
      <div class="map-header">
        <div class="map-title">🗺️ 探险地图</div>
        <div class="progress-text" id="progressText">探险进度：3/26</div>
      </div>
      <div class="letter-grid" id="letterGrid"></div>
    </div>
  </div>

  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <div class="coins">
      ⭐ <span class="coins-anim" id="coinCount">5</span> 星星币
    </div>
    <button class="game-btn" onclick="openGame()">🎮 复习小游戏</button>
  </div>

  <!-- Parent Center Modal -->
  <div class="modal-overlay" id="parentModal">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal('parentModal')">&times;</button>
      <div class="modal-title" id="parentModalTitle">🔒 家长中心</div>
      <div id="parentContent">
        <input type="password" class="password-input" id="passwordInput" placeholder="请输入密码" maxlength="6">
        <p style="text-align:center;font-size:12px;color:#B2BEC3;margin-top:8px;">默认密码：123</p>
        <button class="modal-submit" onclick="checkPassword()">确认进入</button>
      </div>
      <div id="reportContent" style="display:none;">
        <div class="report-item">
          <span class="report-label">📅 今日学习时长</span>
          <span class="report-value">23 分钟</span>
        </div>
        <div class="report-item">
          <span class="report-label">📚 掌握单词数</span>
          <span class="report-value">3 个</span>
        </div>
        <div class="report-item">
          <span class="report-label">📝 错词本</span>
          <span class="report-value" style="color:var(--sky);">暂无 ✨</span>
        </div>
        <div class="report-item">
          <span class="report-label">🔥 连续学习天数</span>
          <span class="report-value">3 天</span>
        </div>
        <button class="modal-submit" onclick="closeModal('parentModal')" style="margin-top:16px;background:linear-gradient(135deg, var(--coral), #FF8E8E);">关闭</button>
      </div>
    </div>
  </div>

  <!-- Game Modal -->
  <div class="modal-overlay game-modal" id="gameModal">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal('gameModal')">&times;</button>
      <div class="modal-title">🎮 字母配对游戏</div>
      <div id="gameContent"></div>
    </div>
  </div>
</div>

<script>
// ========== Data ==========
const letterData = {
  'A': {
    word: 'Apple', meaning: '苹果', emoji: '🍎',
    sentence: '"I like apples."',
    extra: [
      { word: 'Ant', emoji: '🐜', meaning: '蚂蚁', sentence: '"The ant is small."' },
      { word: 'Alligator', emoji: '🐊', meaning: '鳄鱼', sentence: '"The alligator swims."' }
    ]
  },
  'B': {
    word: 'Bear', meaning: '熊', emoji: '🐻',
    sentence: '"The bear is big."',
    extra: [
      { word: 'Bird', emoji: '🐦', meaning: '鸟', sentence: '"The bird can fly."' },
      { word: 'Ball', emoji: '⚽', meaning: '球', sentence: '"I have a ball."' }
    ]
  },
  'C': {
    word: 'Cat', meaning: '猫', emoji: '🐱',
    sentence: '"The cat is cute."',
    extra: [
      { word: 'Car', emoji: '🚗', meaning: '汽车', sentence: '"The car is fast."' },
      { word: 'Cake', emoji: '🎂', meaning: '蛋糕', sentence: '"I like cake."' }
    ]
  }
};

const allLetters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
let currentLetter = 'A';
let currentWordIndex = -1; // -1 means showing default word
let coins = 5;
let learnedCount = 3; // A, B already learned, C is current

// ========== Init ==========
function init() {
  renderLetterGrid();
  updateCard();
  showBanner();
}

function showBanner() {
  const banner = document.getElementById('banner');
  setTimeout(() => banner.classList.add('show'), 300);
  setTimeout(() => banner.classList.remove('show'), 2800);
}

// ========== Card ==========
function updateCard() {
  const data = letterData[currentLetter];
  if (!data) return;

  const letterEl = document.getElementById('letterDisplay');
  const wordEl = document.getElementById('wordDisplay');
  const meaningEl = document.getElementById('meaningDisplay');
  const sentenceEl = document.getElementById('sentenceDisplay');

  let word, emoji, meaning, sentence;

  if (currentWordIndex === -1) {
    word = data.word;
    emoji = data.emoji;
    meaning = data.meaning;
    sentence = data.sentence;
  } else {
    const extra = data.extra[currentWordIndex];
    word = extra.word;
    emoji = extra.emoji;
    meaning = extra.meaning;
    sentence = extra.sentence;
  }

  // Animate letter
  letterEl.classList.remove('letter-entry');
  void letterEl.offsetWidth;
  letterEl.textContent = currentLetter + currentLetter.toLowerCase();
  letterEl.classList.add('letter-entry');

  // Animate word
  wordEl.classList.remove('word-entry');
  void wordEl.offsetWidth;
  wordEl.textContent = emoji + ' ' + word;
  wordEl.style.opacity = '0';
  wordEl.style.transform = 'scale(0)';
  wordEl.classList.add('word-entry');

  meaningEl.textContent = meaning;

  // Animate sentence
  sentenceEl.classList.remove('sentence-entry');
  void sentenceEl.offsetWidth;
  sentenceEl.textContent = sentence;
  sentenceEl.style.opacity = '0';
  sentenceEl.classList.add('sentence-entry');
}

function switchWord() {
  const data = letterData[currentLetter];
  if (!data) return;

  const totalWords = 1 + data.extra.length;
  currentWordIndex = currentWordIndex + 1;
  if (currentWordIndex >= totalWords - 1) {
    currentWordIndex = -1;
  }

  updateCard();
  spawnStarFloat();
  addCoin();
}

function spawnStarFloat() {
  const card = document.getElementById('learningCard');
  const rect = card.getBoundingClientRect();
  const phone = document.getElementById('app');
  const phoneRect = phone.getBoundingClientRect();

  const el = document.createElement('div');
  el.className = 'star-float';
  el.textContent = '+1 🌟';
  el.style.left = (rect.left - phoneRect.left + rect.width / 2 - 30) + 'px';
  el.style.top = (rect.top - phoneRect.top + 20) + 'px';
  phone.appendChild(el);
  setTimeout(() => el.remove(), 1200);
}

// ========== Coins ==========
function addCoin() {
  coins++;
  const el = document.getElementById('coinCount');
  el.textContent = coins;
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
}

// ========== Letter Grid ==========
function renderLetterGrid() {
  const grid = document.getElementById('letterGrid');
  grid.innerHTML = '';

  allLetters.forEach((letter, idx) => {
    const node = document.createElement('div');
    node.className = 'letter-node';

    if (idx < learnedCount - 1) {
      node.classList.add('learned');
      node.innerHTML = letter + '<span class="check-mark">✅</span>';
    } else if (idx === learnedCount - 1) {
      node.classList.add('current');
      node.textContent = letter;
    } else {
      node.classList.add('locked');
      node.innerHTML = letter + '<span class="lock-icon">🔒</span>';
    }

    grid.appendChild(node);
  });
}

// ========== Reading ==========
function startReading() {
  const popup = document.getElementById('readPopup');
  popup.classList.add('show');
  setTimeout(() => popup.classList.remove('show'), 2000);
}

// ========== Parent Center ==========
function openParentCenter() {
  const modal = document.getElementById('parentModal');
  document.getElementById('parentContent').style.display = 'block';
  document.getElementById('reportContent').style.display = 'none';
  document.getElementById('parentModalTitle').textContent = '🔒 家长中心';
  document.getElementById('passwordInput').value = '';
  modal.style.display = 'flex';
  requestAnimationFrame(() => modal.classList.add('active'));
}

function checkPassword() {
  const input = document.getElementById('passwordInput').value;
  if (input === '123') {
    document.getElementById('parentContent').style.display = 'none';
    document.getElementById('reportContent').style.display = 'block';
    document.getElementById('parentModalTitle').textContent = '📊 学习报告';
  } else {
    const inp = document.getElementById('passwordInput');
    inp.style.borderColor = 'var(--coral)';
    inp.value = '';
    inp.placeholder = '密码错误，请重试';
    setTimeout(() => {
      inp.style.borderColor = '#E0E0E0';
      inp.placeholder = '请输入密码';
    }, 1500);
  }
}

// ========== Game ==========
const gamePairs = [
  { letter: 'A', emoji: '🍎' },
  { letter: 'B', emoji: '🐻' },
  { letter: 'C', emoji: '🐱' }
];

let gameSelectedLetter = null;
let gameSelectedEmoji = null;
let gameMatched = [];

function openGame() {
  gameSelectedLetter = null;
  gameSelectedEmoji = null;
  gameMatched = [];

  const modal = document.getElementById('gameModal');
  modal.style.display = 'flex';
  requestAnimationFrame(() => modal.classList.add('active'));
  renderGame();
}

function renderGame() {
  const container = document.getElementById('gameContent');

  if (gameMatched.length === gamePairs.length) {
    container.innerHTML = `
      <div class="game-complete">
        <div class="game-complete-emoji">🎉</div>
        <div class="game-complete-text">太棒了！全部配对成功！</div>
        <button class="modal-submit" onclick="closeModal('gameModal')" style="margin-top:16px;">太开心了！</button>
      </div>
    `;
    return;
  }

  const shuffledEmojis = [...gamePairs].sort(() => Math.random() - 0.5);

  container.innerHTML = `
    <div class="game-area">
      <div class="game-col">
        <div class="game-col-title">字母</div>
        ${gamePairs.map((p, i) => {
          const matched = gameMatched.includes(p.letter);
          const selected = gameSelectedLetter === p.letter;
          return `<div class="game-item letter-item ${matched ? 'matched' : ''} ${selected ? 'selected' : ''}"
            onclick="${matched ? '' : `selectGameLetter('${p.letter}')`}"
            data-letter="${p.letter}">
            ${matched ? p.letter + ' ✅' : p.letter}
          </div>`;
        }).join('')}
      </div>
      <div class="game-col">
        <div class="game-col-title">图片</div>
        ${shuffledEmojis.map((p) => {
          const matched = gameMatched.includes(p.letter);
          const selected = gameSelectedEmoji === p.letter;
          return `<div class="game-item emoji-item ${matched ? 'matched' : ''} ${selected ? 'selected' : ''}"
            onclick="${matched ? '' : `selectGameEmoji('${p.letter}', this)`}"
            data-letter="${p.letter}">
            ${matched ? p.emoji + ' ✅' : p.emoji}
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="game-status" id="gameStatus">点击左边字母，再点击右边图片配对</div>
  `;
}

function selectGameLetter(letter) {
  gameSelectedLetter = letter;
  gameSelectedEmoji = null;
  renderGame();
}

function selectGameEmoji(letter, el) {
  if (!gameSelectedLetter) {
    document.getElementById('gameStatus').textContent = '请先点击左边的字母~';
    return;
  }

  gameSelectedEmoji = letter;

  if (gameSelectedLetter === letter) {
    // Match!
    gameMatched.push(letter);
    gameSelectedLetter = null;
    gameSelectedEmoji = null;
    addCoin();
    renderGame();
  } else {
    // Wrong
    el.classList.add('wrong');
    document.getElementById('gameStatus').textContent = '再试试看~ 🤔';
    setTimeout(() => {
      el.classList.remove('wrong');
      gameSelectedEmoji = null;
      gameSelectedLetter = null;
      renderGame();
    }, 600);
  }
}

// ========== Modal Helpers ==========
function closeModal(id) {
  const modal = document.getElementById(id);
  modal.classList.remove('active');
  setTimeout(() => { modal.style.display = 'none'; }, 300);
}

// Close modal on overlay click
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('modal-overlay')) {
    e.target.classList.remove('active');
    setTimeout(() => { e.target.style.display = 'none'; }, 300);
  }
});

// ========== Start ==========
window.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
