<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>反诈剧本杀 | 视觉小说</title>
<style>
/* ═══════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════ */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

body {
  font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: #000;
  color: #fff;
  width: 100vw; height: 100dvh;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

/* ═══════════════════════════════════════════
   MAIN STAGE — 全屏视觉小说画布
   ═══════════════════════════════════════════ */
#stage {
  position: relative;
  width: 100%; height: 100%;
  overflow: hidden;
}

/* ── 背景层 ── */
#bg-layer {
  position: absolute; inset: 0;
  transition: background 1.2s ease, filter 0.8s ease;
  z-index: 0;
}
#bg-layer::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.65) 100%);
  pointer-events: none;
}

/* 背景纹理叠加 */
#bg-texture {
  position: absolute; inset: 0;
  opacity: 0.06; z-index: 1; pointer-events: none;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.03) 2px, rgba(255,255,255,0.03) 4px),
    repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255,255,255,0.03) 2px, rgba(255,255,255,0.03) 4px);
}

/* 粒子 */
#particles {
  position: absolute; inset: 0;
  z-index: 2; pointer-events: none; opacity: 0.5;
}

/* 暗角 */
#vignette {
  position: absolute; inset: 0;
  box-shadow: inset 0 0 120px 40px rgba(0,0,0,0.7);
  z-index: 3; pointer-events: none;
}

/* ── 角色立绘区 ── */
#character-area {
  position: absolute;
  bottom: 22%; left: 50%; transform: translateX(-50%);
  z-index: 4;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
#character-portrait {
  width: min(220px, 40vw); height: min(220px, 40vw);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: min(100px, 18vw);
  position: relative;
  transition: all 0.5s ease;
  filter: drop-shadow(0 0 30px rgba(0,0,0,0.5));
}
#character-portrait .glow-ring {
  position: absolute; inset: -6px; border-radius: 50%;
  border: 2px solid transparent;
  opacity: 0.4;
  animation: ringPulse 3s ease-in-out infinite;
}
@keyframes ringPulse {
  0%,100% { transform: scale(1); opacity: 0.3; }
  50%     { transform: scale(1.06); opacity: 0.6; }
}

#character-nameplate {
  position: absolute;
  bottom: 28%; left: 50%; transform: translateX(-50%);
  z-index: 5;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 6px 18px;
  font-size: 13px; font-weight: 700;
  letter-spacing: 2px;
  transition: all 0.4s ease;
  white-space: nowrap;
}

/* ── 场景情绪光 ── */
#mood-light {
  position: absolute; top: 0; left: 0; right: 0;
  height: 35%; z-index: 3; pointer-events: none;
  transition: background 1s ease;
}

/* ── 对话文本框 ── */
#textbox-container {
  position: absolute; bottom: 0; left: 0; right: 0;
  z-index: 10;
  padding: 0 12px calc(16px + var(--safe-bottom));
}
#textbox {
  background: linear-gradient(180deg,
    rgba(10,10,20,0.88) 0%,
    rgba(10,10,20,0.94) 100%
  );
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 16px 18px 14px;
  position: relative;
  min-height: 130px;
  transition: border-color 0.6s ease, box-shadow 0.6s ease;
}

/* 说话人标签 */
#speaker-tag {
  position: absolute; top: -18px; left: 20px;
  background: var(--speaker-color, #ff6b35);
  color: #fff;
  font-size: 12px; font-weight: 800;
  letter-spacing: 3px;
  padding: 5px 16px;
  border-radius: 20px 20px 4px 4px;
  transition: background 0.4s ease;
  white-space: nowrap;
}

/* 对话文本 */
#dialogue-text {
  font-size: 16px; line-height: 1.8;
  color: #e8e0f0;
  min-height: 48px;
  position: relative;
}
#dialogue-text .char-name {
  font-weight: 700;
  color: var(--speaker-color, #ff6b35);
}

/* 继续提示 */
#continue-hint {
  position: absolute; bottom: 8px; right: 18px;
  font-size: 18px; color: rgba(255,255,255,0.3);
  animation: hintBounce 1.2s ease-in-out infinite;
  pointer-events: none;
}
@keyframes hintBounce {
  0%,100% { transform: translateY(0); opacity: 0.3; }
  50%     { transform: translateY(4px); opacity: 0.7; }
}

/* ── 选项覆盖层 ── */
#choices-overlay {
  position: absolute; inset: 0; z-index: 20;
  background: rgba(0,0,0,0.55);
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-end;
  padding: 0 20px calc(30px + var(--safe-bottom));
  gap: 10px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.35s ease;
}
#choices-overlay.active {
  opacity: 1; pointer-events: auto;
}

#choices-overlay .choice-title {
  font-size: 14px; color: rgba(255,255,255,0.6);
  margin-bottom: 6px; letter-spacing: 2px;
  text-align: center;
}

.choice-btn {
  width: 100%; max-width: 420px;
  padding: 15px 20px;
  border: 1.5px solid rgba(255,255,255,0.15);
  border-radius: 14px;
  background: rgba(20,20,40,0.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: #ddd;
  font-size: 15px; font-weight: 600;
  cursor: pointer;
  text-align: left;
  transition: all 0.25s ease;
  display: flex; align-items: center; gap: 14px;
  position: relative;
  overflow: hidden;
}
.choice-btn::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,107,53,0.08), transparent);
  opacity: 0; transition: opacity 0.25s;
}
.choice-btn:hover, .choice-btn:active {
  border-color: rgba(255,107,53,0.6);
  background: rgba(30,20,50,0.9);
  transform: translateX(6px);
  box-shadow: 0 4px 24px rgba(255,107,53,0.12);
}
.choice-btn:hover::before, .choice-btn:active::before { opacity: 1; }
.choice-btn .choice-label {
  width: 28px; height: 28px; border-radius: 8px;
  background: rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800;
  color: rgba(255,255,255,0.5);
  flex-shrink: 0;
}

/* ── 反馈弹出层 ── */
#feedback-overlay {
  position: absolute; inset: 0; z-index: 30;
  background: rgba(0,0,0,0.8);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.4s ease;
}
#feedback-overlay.active {
  opacity: 1; pointer-events: auto;
}

.feedback-card {
  background: rgba(20,20,35,0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 20px;
  padding: 32px 24px 24px;
  text-align: center;
  max-width: 380px; width: 100%;
  border: 1px solid rgba(255,255,255,0.1);
  animation: popUp 0.45s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes popUp {
  0%   { transform: scale(0.7); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.feedback-card .fb-icon   { font-size: 52px; margin-bottom: 10px; }
.feedback-card .fb-title  { font-size: 20px; font-weight: 900; margin-bottom: 10px; }
.feedback-card .fb-desc   { font-size: 13px; line-height: 1.8; color: #aaa; margin-bottom: 22px; text-align: left; }
.feedback-card .fb-btn    {
  width: 100%; padding: 14px; border-radius: 25px;
  border: none; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: all 0.2s;
  letter-spacing: 1px;
}
.fb-correct .fb-icon  { color: #00e676; }
.fb-correct .fb-title { color: #00e676; }
.fb-correct .fb-btn   { background: #00e676; color: #000; }
.fb-wrong .fb-icon    { color: #ff1744; }
.fb-wrong .fb-title   { color: #ff1744; }
.fb-wrong .fb-btn     { background: #ff1744; color: #fff; }

/* 抖动 */
.shake { animation: shake 0.5s ease; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%     { transform: translateX(-6px); }
  40%     { transform: translateX(6px); }
  60%     { transform: translateX(-4px); }
  80%     { transform: translateX(4px); }
}

/* ── 场景切换转场 ── */
#transition-overlay {
  position: absolute; inset: 0; z-index: 50;
  background: #000; opacity: 0; pointer-events: none;
  transition: opacity 0.5s ease;
}
#transition-overlay.active { opacity: 1; }

/* ── 结算画面 ── */
#result-container {
  position: absolute; inset: 0; z-index: 15;
  background: rgba(5,5,12,0.92);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex; flex-direction: column;
  align-items: center;
  overflow-y: auto;
  padding: 40px 20px 60px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.5s ease;
  -webkit-overflow-scrolling: touch;
}
#result-container.active {
  opacity: 1; pointer-events: auto;
}

.result-grade-badge {
  font-size: 13px; font-weight: 800; letter-spacing: 3px;
  padding: 6px 20px; border-radius: 20px;
  margin-bottom: 12px;
}
.grade-s { background: rgba(0,230,118,0.15); color: #00e676; border: 1px solid #00e676; }
.grade-a { background: rgba(105,240,174,0.12); color: #69f0ae; border: 1px solid #69f0ae; }
.grade-b { background: rgba(255,193,7,0.12); color: #ffc107; border: 1px solid #ffc107; }
.grade-c { background: rgba(255,23,68,0.12); color: #ff1744; border: 1px solid #ff1744; }

.result-score-ring {
  width: 140px; height: 140px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 8px;
  position: relative;
}
.result-score-inner {
  width: 108px; height: 108px; border-radius: 50%;
  background: rgba(10,10,20,0.9);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.result-score-num { font-size: 38px; font-weight: 900; }
.result-score-label { font-size: 11px; color: #888; }

.result-verdict {
  font-size: 14px; color: #aaa; text-align: center;
  margin-bottom: 20px; max-width: 280px;
}

/* 雷达图 */
#radar-canvas {
  margin: 0 auto; display: block;
}

/* 维度条 */
.dim-list { width: 100%; max-width: 320px; margin: 14px auto; }
.dim-row {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
}
.dim-row .dim-icon  { font-size: 18px; width: 26px; text-align: center; }
.dim-row .dim-info  { flex: 1; }
.dim-row .dim-name  { font-size: 12px; font-weight: 600; }
.dim-row .dim-desc  { font-size: 10px; color: #777; margin-top: 1px; }
.dim-row .dim-bar-o { width: 52px; height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
.dim-row .dim-bar-i { height: 100%; border-radius: 3px; transition: width 0.8s ease; }
.bar-h { background: #00e676; }
.bar-m { background: #ff6b35; }
.bar-l { background: #ff1744; }

.result-btn-row { display: flex; gap: 10px; width: 100%; max-width: 340px; margin-top: 10px; }
.btn-outline, .btn-solid {
  flex: 1; padding: 13px 0; border-radius: 12px;
  font-size: 14px; font-weight: 700; cursor: pointer;
  text-align: center; transition: all 0.2s; letter-spacing: 1px;
}
.btn-outline {
  background: transparent; color: #ff6b35;
  border: 1.5px solid rgba(255,107,53,0.5);
}
.btn-outline:active { background: rgba(255,107,53,0.1); }
.btn-solid {
  background: #ff6b35; color: #fff; border: none;
}
.btn-solid:active { background: #e55a2b; }

/* ═══════════════════════════════════════════
   首页 — 标题画面
   ═══════════════════════════════════════════ */
#title-screen {
  position: absolute; inset: 0; z-index: 25;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 40px 24px;
  transition: opacity 0.6s ease;
}
#title-screen.hidden { opacity: 0; pointer-events: none; }

.title-logo {
  font-size: 64px; margin-bottom: 8px;
  filter: drop-shadow(0 0 30px rgba(255,107,53,0.4));
  animation: logoFloat 4s ease-in-out infinite;
}
@keyframes logoFloat {
  0%,100% { transform: translateY(0); }
  50%     { transform: translateY(-8px); }
}

.title-main {
  font-size: 32px; font-weight: 900; letter-spacing: 4px;
  margin-bottom: 6px;
  background: linear-gradient(180deg, #fff 30%, #ff8c5a 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.title-sub {
  font-size: 13px; color: #888; letter-spacing: 2px;
  margin-bottom: 32px;
}

.scenario-list { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; }
.sc-card {
  background: rgba(20,20,35,0.8); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px; padding: 15px 18px;
  text-align: left; cursor: pointer;
  transition: all 0.3s ease;
  display: flex; align-items: center; gap: 14px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.sc-card:hover, .sc-card:active {
  border-color: rgba(255,107,53,0.5);
  background: rgba(30,20,45,0.85);
  transform: translateX(6px);
  box-shadow: 0 4px 20px rgba(255,107,53,0.08);
}
.sc-card .sc-icon { font-size: 30px; flex-shrink: 0; }
.sc-card .sc-body { flex: 1; }
.sc-card .sc-name { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
.sc-card .sc-desc { font-size: 11px; color: #777; line-height: 1.5; }
.sc-card .sc-badge {
  font-size: 9px; font-weight: 700; letter-spacing: 1px;
  background: rgba(255,107,53,0.2); color: #ff8c5a;
  padding: 3px 10px; border-radius: 10px;
}

.title-footer {
  margin-top: 24px; font-size: 11px; color: #555;
  letter-spacing: 2px;
}

/* ═══════════════════════════════════════════
   场景专属配色（CSS 变量覆盖）
   ═══════════════════════════════════════════ */
.scene-police  { --speaker-color: #ff5252; }
.scene-romance { --speaker-color: #e040fb; }
.scene-deepfake{ --speaker-color: #448aff; }

/* ── 场景背景 ── */
.bg-police {
  background: linear-gradient(170deg, #0a0a1a 0%, #1a0a14 30%, #140a1a 60%, #0a0a18 100%);
  position: relative;
}
.bg-police::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 70% 20%, rgba(255,50,50,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 30% 60%, rgba(0,0,80,0.15) 0%, transparent 50%);
  pointer-events: none;
}

.bg-romance {
  background: linear-gradient(170deg, #0f0a14 0%, #1a0a1e 30%, #140a1a 60%, #0a0a14 100%);
}
.bg-romance::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 60% 25%, rgba(200,50,220,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 40% 70%, rgba(80,0,60,0.1) 0%, transparent 50%);
  pointer-events: none;
}

.bg-deepfake {
  background: linear-gradient(170deg, #080c18 0%, #0a101a 30%, #080e18 60%, #060a16 100%);
}
.bg-deepfake::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 50% 20%, rgba(50,100,255,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 60%, rgba(0,200,255,0.04) 0%, transparent 50%);
  pointer-events: none;
}

/* ── 场景专属粒子色 ── */
.scene-police  .bg-particle { color: #ff5252; }
.scene-romance .bg-particle { color: #e040fb; }
.scene-deepfake .bg-particle { color: #448aff; }

/* ── 文本框场景边框光 ── */
.scene-police  #textbox { border-color: rgba(255,82,82,0.15); box-shadow: 0 -4px 30px rgba(255,82,82,0.06); }
.scene-romance #textbox { border-color: rgba(224,64,251,0.15); box-shadow: 0 -4px 30px rgba(224,64,251,0.06); }
.scene-deepfake#textbox { border-color: rgba(68,138,255,0.15); box-shadow: 0 -4px 30px rgba(68,138,255,0.06); }

/* ── 角色光圈色 ── */
.scene-police  #character-portrait .glow-ring { border-color: rgba(255,82,82,0.5); }
.scene-romance #character-portrait .glow-ring { border-color: rgba(224,64,251,0.5); }
.scene-deepfake#character-portrait .glow-ring { border-color: rgba(68,138,255,0.5); }

/* ═══════════════════════════════════════════
   电话来电特效（冒充公检法第一段）
   ═══════════════════════════════════════════ */
#phone-ring-overlay {
  position: absolute; inset: 0; z-index: 12;
  background: rgba(0,0,0,0.7);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 16px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
#phone-ring-overlay.active { opacity: 1; pointer-events: auto; }

.phone-ring-icon {
  font-size: 56px;
  animation: phoneRing 1s ease-in-out infinite;
}
@keyframes phoneRing {
  0%,100% { transform: rotate(0); }
  15%     { transform: rotate(15deg); }
  30%     { transform: rotate(-15deg); }
  45%     { transform: rotate(10deg); }
  60%     { transform: rotate(-10deg); }
  75%     { transform: rotate(0); }
}

.phone-ring-number {
  font-size: 20px; font-weight: 700; letter-spacing: 3px;
  color: #ccc;
}
.phone-ring-label {
  font-size: 12px; color: #888; letter-spacing: 2px;
}

.phone-ring-btns { display: flex; gap: 24px; margin-top: 10px; }
.phone-ring-btns button {
  width: 56px; height: 56px; border-radius: 50%;
  border: none; font-size: 22px; cursor: pointer;
  transition: all 0.2s;
}
.phone-accept { background: #00c853; color: #fff; }
.phone-accept:active { background: #00a844; transform: scale(0.92); }
.phone-reject { background: #ff1744; color: #fff; }
.phone-reject:active { background: #d50000; transform: scale(0.92); }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════
     主舞台
     ═══════════════════════════════════════ -->
<div id="stage">

  <!-- 背景 -->
  <div id="bg-layer" class="bg-police"></div>
  <div id="bg-texture"></div>
  <canvas id="particles"></canvas>
  <div id="mood-light"></div>
  <div id="vignette"></div>

  <!-- 电话来电特效 -->
  <div id="phone-ring-overlay">
    <div class="phone-ring-icon">📞</div>
    <div class="phone-ring-number">+86 010-xxxxxxxx</div>
    <div class="phone-ring-label">北京市 · 未知来电</div>
    <div class="phone-ring-btns">
      <button class="phone-accept" onclick="answerPhone()">📞</button>
      <button class="phone-reject" onclick="rejectPhone()">📵</button>
    </div>
  </div>

  <!-- 角色立绘 -->
  <div id="character-area">
    <div id="character-portrait">
      <div class="glow-ring"></div>
      🕵️
    </div>
  </div>
  <div id="character-nameplate">???</div>

  <!-- 对话文本框 -->
  <div id="textbox-container">
    <div id="textbox">
      <div id="speaker-tag">系统</div>
      <div id="dialogue-text"></div>
      <div id="continue-hint">▼</div>
    </div>
  </div>

  <!-- 选项覆盖 -->
  <div id="choices-overlay">
    <div class="choice-title">— 做出你的选择 —</div>
    <div id="choices-inner"></div>
  </div>

  <!-- 反馈弹窗 -->
  <div id="feedback-overlay"></div>

  <!-- 转场 -->
  <div id="transition-overlay"></div>

  <!-- 结算画面 -->
  <div id="result-container">
    <div id="result-inner"></div>
  </div>

  <!-- 标题画面 -->
  <div id="title-screen">
    <div class="title-logo">🔍</div>

let audioCtx = null;
function beep(freq, type, dur, vol=0.06) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

// ═══════════════════════════════════════════
//  打字机效果
// ═══════════════════════════════════════════
async function typeText(text, speed=35) {
  game.isTyping = true;
  dialogueText.innerHTML = '';
  continueHint.style.display = 'none';

  // 解析混合内容（HTML标签 + 文本）
  const parser = new DOMParser();
  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = text;

  // 简化：逐字符处理（跳过HTML标签）
  let html = '';
  let i = 0;
  const rawText = text.replace(/<[^>]*>/g, '');
  const totalLen = rawText.length;

  // 直接用innerHTML逐步渲染——为了支持标签，我们同步逐词
  // 简化策略：每20ms放一个词
  const words = text.split(/(<[^>]*>)/g).filter(Boolean);
  for (const part of words) {
    if (part.startsWith('<')) {
      html += part;
      dialogueText.innerHTML = html;
    } else {
      for (const char of part) {
        html += char;
        dialogueText.innerHTML = html;
        await sleep(speed);
      }
    }
  }

  game.isTyping = false;
  continueHint.style.display = 'block';
  game.waitingForClick = true;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ═══════════════════════════════════════════
//  队列处理
// ═══════════════════════════════════════════
let currentStepIndex = 0;
let stepData = null;

async function processQueue() {
  const cfg = sceneConfig[game.scenario];
  const steps = cfg.steps;

  if (currentStepIndex >= steps.length) {
    // 所有步骤完成 → 结算
    showResult();
    return;
  }

  const step = steps[currentStepIndex];
  stepData = step;
  currentStepIndex++;

  // 特殊类型：来电
  if (step.type === 'phone_ring') {
    game.phoneAnswered = false;
    phoneRingOv.classList.add('active');
    sfxRing();
    return;
  }

  // 设置说话人
  speakerTag.textContent = step.speaker;
  speakerTag.style.setProperty('--speaker-color', cfg.speakerColor);

  // 打字
  await typeText(step.text, 30);

  // 如果这个步骤有选项
  if (step.question) {
    game.waitingForClick = false;
    continueHint.style.display = 'none';
    game.waitingForChoice = true;
    showChoices(step);
  }
}

  game.choices.push(true);

  ['vigilance','verify','law'].forEach(d => {
    game.dims[d] = Math.min(100, game.dims[d] + 35);
  });

  // 显示特殊反馈
  const stepWithChoices = sceneConfig[game.scenario].steps.find(s => s.question);
  if (stepWithChoices) {
    stepData = stepWithChoices;
    showFeedback(true, stepWithChoices.explain);
  } else {
    // 继续
    processQueue();
  }
}

function handleChoice(choice, step) {
  choicesOverlay.classList.remove('active');
  game.waitingForChoice = false;
  continueHint.style.display = 'none';

  const isCorrect = choice.correct;
  game.choices.push(isCorrect);
  if (isCorrect) game.score++;

  choice.dims.forEach(d => {
    game.dims[d] = Math.min(100, game.dims[d] + (isCorrect ? 35 : 10));
  });

  // 延迟显示反馈
  setTimeout(() => {
    showFeedback(isCorrect, step.explain);
  }, 300);
}

  else { grade = 'C级 · 高风险'; gradeClass='grade-c'; verdict='你的防骗意识急需提升！建议和家人一起反复练习。'; }

  `;

  resultContainer.classList.add('active');

  // 延迟绘制雷达图

function drawRadar(dims, color) {
  const canvas = $('radar-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w=220, h=220, cx=w/2, cy=h/2, r=75;
  const labels = ['警惕性','信息核实','情绪控制','技术识别','法律常识'];
  const keys = ['vigilance','verify','emotion','tech','law'];

  ctx.clearRect(0,0,w,h);

  // 网格
  for (let lv=1; lv<=5; lv++) {
    ctx.beginPath();
    for (let i=0;i<5;i++) {
      const a = (Math.PI*2/5)*i - Math.PI/2;
      const x=cx+r*lv/5*Math.cos(a), y=cy+r*lv/5*Math.sin(a);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.closePath(); ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.stroke();
  }

  // 轴线
  for (let i=0;i<5;i++) {
    const a = (Math.PI*2/5)*i - Math.PI/2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));
    ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.stroke();
  }

  // 数据
  ctx.beginPath();
  for (let i=0;i<5;i++) {
    const v = dims[keys[i]]/100, lr=r*v;
    const a = (Math.PI*2/5)*i - Math.PI/2;
    const x=cx+lr*Math.cos(a), y=cy+lr*Math.sin(a);
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fillStyle = color.replace(')', ',0.2)').replace('rgb','rgba').replace('#00e676','rgba(0,230,118,0.2)').replace('#ffc107','rgba(255,193,7,0.2)').replace('#ff1744','rgba(255,23,68,0.2)');
  // 简化：直接用颜色
  ctx.fillStyle = 'rgba(255,107,53,0.2)';
  ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth=2; ctx.stroke();

  // 点
  for (let i=0;i<5;i++) {
    const v = dims[keys[i]]/100, lr=r*v;
    const a = (Math.PI*2/5)*i - Math.PI/2;
    ctx.beginPath(); ctx.arc(cx+lr*Math.cos(a), cy+lr*Math.sin(a), 3.5, 0, Math.PI*2);
    ctx.fillStyle=color; ctx.fill();
  }

  // 标签
  ctx.fillStyle='#888'; ctx.font='11px "PingFang SC","Microsoft YaHei",sans-serif'; ctx.textAlign='center';
  for (let i=0;i<5;i++) {
    const a = (Math.PI*2/5)*i - Math.PI/2;
    ctx.fillText(labels[i], cx+(r+20)*Math.cos(a), cy+(r+20)*Math.sin(a)+4);
  }
}

  dialogueText.innerHTML = '';
  continueHint.style.display = 'none';
  choicesOverlay.classList.remove('active');
  feedbackOverlay.classList.remove('active');
  phoneRingOv.classList.remove('active');
  setTimeout(() => processQueue(), 400);
}

function shareResult() {
  sfxClick();
  const pct = Math.round((game.score / game.totalSteps) * 100);
  const cfg = sceneConfig[game.scenario];
  const text = `🕵️ 我在「反诈剧本杀」挑战了"${cfg.charName}"剧本，防骗指数 ${pct} 分！\n\n你也来测测能得多少分？别等被骗了才后悔！\n\n👉 转发给家人，一起建立防骗抗体！`;

  if (navigator.share) {
    navigator.share({ title: '反诈剧本杀 - 测测你的防骗指数', text }).catch(()=>{});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => alert('✅ 已复制分享文案到剪贴板！快去发给家人吧～'));
  } else {
    alert(text);
  }
}

applyScene('police');
speakerTag.textContent = '系统';
dialogueText.innerHTML = '';
continueHint.style.display = 'none';
</script>
