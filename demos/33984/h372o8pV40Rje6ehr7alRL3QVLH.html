<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卦象食缘 - 抛硬币问六爻，AI告诉你今天该吃什么</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            padding: 40px 0;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #f39c12, #e74c3c, #f39c12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(243, 156, 18, 0.3);
        }
        
        .header .subtitle {
            font-size: 1.1em;
            color: #bdc3c7;
            margin-top: 10px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        .card-title {
            font-size: 1.3em;
            margin-bottom: 20px;
            color: #f39c12;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .card-title .icon {
            font-size: 1.5em;
        }
        
        .preference-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }
        
        .preference-item {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }
        
        .preference-item:hover {
            border-color: #f39c12;
            background: rgba(243, 156, 18, 0.1);
        }
        
        .preference-item.active {
            border-color: #f39c12;
            background: rgba(243, 156, 18, 0.2);
            box-shadow: 0 0 15px rgba(243, 156, 18, 0.3);
        }
        
        .preference-item .emoji {
            font-size: 2em;
            display: block;
            margin-bottom: 8px;
        }
        
        .preference-item .label {
            font-size: 0.9em;
            color: #ecf0f1;
        }
        
        .coin-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 40px 0;
            perspective: 1000px;
        }
        
        .coin {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ffd700, #b8860b);
            border: 4px solid #daa520;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            font-weight: bold;
            color: #8b4513;
            cursor: pointer;
            transition: transform 0.6s ease;
            transform-style: preserve-3d;
            box-shadow: 0 5px 20px rgba(218, 165, 32, 0.4);
            position: relative;
        }
        
        .coin::before {
            content: '';
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid rgba(139, 69, 19, 0.3);
        }
        
        .coin.flipping {
            animation: flipCoin 1s ease-in-out;
        }
        
        @keyframes flipCoin {
            0% { transform: rotateY(0deg); }
            50% { transform: rotateY(1800deg); }
            100% { transform: rotateY(0deg); }
        }
        
        .coin-result {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #f39c12, #e74c3c);
            border: none;
            border-radius: 12px;
            padding: 15px 40px;
            font-size: 1.2em;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 20px auto;
            font-family: inherit;
        }
        
        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 25px rgba(243, 156, 18, 0.5);
        }
        
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .hexagram-display {
            text-align: center;
            padding: 30px 0;
            display: none;
        }
        
        .hexagram-display.active {
            display: block;
        }
        
        .yao-line {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 8px 0;
            font-size: 1.5em;
        }
        
        .yao-yang {
            width: 120px;
            height: 8px;
            background: linear-gradient(90deg, #f39c12, #e74c3c);
            border-radius: 4px;
            margin: 0 10px;
        }
        
        .yao-yin {
            width: 120px;
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 0 10px;
        }
        
        .yao-yin .segment {
            width: 50px;
            height: 8px;
            background: linear-gradient(90deg, #3498db, #2980b9);
            border-radius: 4px;
        }
        
        .yao-changing {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        .result-card {
            background: linear-gradient(135deg, rgba(243, 156, 18, 0.1), rgba(231, 76, 60, 0.1));
            border: 2px solid rgba(243, 156, 18, 0.3);
            border-radius: 16px;
            padding: 30px;
            margin-top: 20px;
            text-align: center;
            display: none;
        }
        
        .result-card.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .result-card .hexagram-name {
            font-size: 2em;
            color: #f39c12;
            margin-bottom: 10px;
        }
        
        .result-card .hexagram-meaning {
            font-size: 1.1em;
            color: #ecf0f1;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .restaurant-recommendation {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .restaurant-recommendation h3 {
            color: #f39c12;
            margin-bottom: 15px;
        }
        
        .restaurant-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 10px;
            transition: background 0.3s ease;
        }
        
        .restaurant-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .restaurant-item .rank {
            font-size: 1.5em;
            font-weight: bold;
            color: #f39c12;
            min-width: 30px;
        }
        
        .restaurant-item .info {
            flex: 1;
        }
        
        .restaurant-item .name {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .restaurant-item .details {
            font-size: 0.9em;
            color: #bdc3c7;
        }
        
        .restaurant-item .match-score {
            background: linear-gradient(45deg, #f39c12, #e74c3c);
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 0.9em;
            font-weight: bold;
        }
        
        .location-info {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: rgba(52, 152, 219, 0.1);
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #bdc3c7;
        }
        
        .location-info .icon {
            font-size: 1.5em;
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin: 20px 0;
            overflow: hidden;
        }
        
        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #f39c12, #e74c3c);
            border-radius: 2px;
            transition: width 0.5s ease;
            width: 0%;
        }
        
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        
        .step .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .step.active .dot {
            background: #f39c12;
            box-shadow: 0 0 10px rgba(243, 156, 18, 0.5);
        }
        
        .step.completed .dot {
            background: #27ae60;
        }
        
        .step .label {
            font-size: 0.8em;
            color: #bdc3c7;
        }
        
        .step.active .label {
            color: #f39c12;
        }
        
        .footer {
            text-align: center;
            padding: 40px 0;
            color: #7f8c8d;
            font-size: 0.9em;
        }
        
        .footer a {
            color: #f39c12;
            text-decoration: none;
        }
        
        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .coin-container {
                gap: 15px;
            }
            
            .coin {
                width: 60px;
                height: 60px;
                font-size: 1.5em;
            }
            
            .preference-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        .loading-spinner {
            display: none;
            text-align: center;
            padding: 40px 0;
        }
        
        .loading-spinner.active {
            display: block;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(243, 156, 18, 0.2);
            border-top-color: #f39c12;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: #bdc3c7;
            font-size: 1.1em;
        }
        
        .loading-text .dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }
        
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🪙 卦象食缘</h1>
            <p class="subtitle">抛硬币问六爻，AI 告诉你今天该吃什么</p>
        </div>
        
        <div class="step-indicator">
            <div class="step active" id="step1">
                <div class="dot"></div>
                <div class="label">设置偏好</div>
            </div>
            <div class="step" id="step2">
                <div class="dot"></div>
                <div class="label">抛硬币起卦</div>
            </div>
            <div class="step" id="step3">
                <div class="dot"></div>
                <div class="label">查看推荐</div>
            </div>
        </div>
        
        <!-- 步骤 1: 设置偏好 -->
        <div class="card" id="preferences-card">
            <div class="card-title">
                <span class="icon">🍽️</span>
                <span>你的口味偏好</span>
            </div>
            <div class="preference-grid" id="taste-preferences">
                <div class="preference-item" data-value="spicy">
                    <span class="emoji">🌶️</span>
                    <span class="label">麻辣</span>
                </div>
                <div class="preference-item" data-value="sweet">
                    <span class="emoji">🍯</span>
                    <span class="label">甜口</span>
                </div>
                <div class="preference-item" data-value="sour">
                    <span class="emoji">🍋</span>
                    <span class="label">酸辣</span>
                </div>
                <div class="preference-item" data-value="salty">
                    <span class="emoji">🧂</span>
                    <span class="label">咸鲜</span>
                </div>
                <div class="preference-item" data-value="light">
                    <span class="emoji">🥗</span>
                    <span class="label">清淡</span>
                </div>
                <div class="preference-item" data-value="rich">
                    <span class="emoji">🍖</span>
                    <span class="label">浓郁</span>
                </div>
            </div>
            
            <div class="card-title" style="margin-top: 30px;">
                <span class="icon">🚫</span>
                <span>忌口设置</span>
            </div>
            <div class="preference-grid" id="avoid-preferences">
                <div class="preference-item" data-value="no-spicy">
                    <span class="emoji">🌶️</span>
                    <span class="label">不吃辣</span>
                </div>
                <div class="preference-item" data-value="no-seafood">
                    <span class="emoji">🦐</span>
                    <span class="label">不吃海鲜</span>
                </div>
                <div class="preference-item" data-value="no-meat">
                    <span class="emoji">🥩</span>
                    <span class="label">素食</span>
                </div>
                <div class="preference-item" data-value="no-gluten">
                    <span class="emoji">🌾</span>
                    <span class="label">无麸质</span>
                </div>
                <div class="preference-item" data-value="no-dairy">
                    <span class="emoji">🥛</span>
                    <span class="label">无乳制品</span>
                </div>
                <div class="preference-item" data-value="no-nuts">
                    <span class="emoji">🥜</span>
                    <span class="label">坚果过敏</span>
                </div>
            </div>
            
            <div class="location-info" id="location-info">
                <span class="icon">📍</span>
                <span id="location-text">正在获取你的位置...</span>
            </div>
            
            <button class="btn-primary" id="btn-next" onclick="goToStep2()">
                下一步：开始起卦 🪙
            </button>
        </div>
        
        <!-- 步骤 2: 抛硬币起卦 -->
        <div class="card" id="divination-card" style="display: none;">
            <div class="card-title">
                <span class="icon">🪙</span>
                <span>抛硬币起卦</span>
            </div>
            <p style="text-align: center; color: #bdc3c7; margin-bottom: 20px;">
                点击硬币或按钮，连续抛 6 次，生成你的专属卦象
            </p>
            
            <div class="coin-container">
                <div class="coin" id="coin1" onclick="flipCoin(0)">正</div>
                <div class="coin" id="coin2" onclick="flipCoin(1)">正</div>
                <div class="coin" id="coin3" onclick="flipCoin(2)">正</div>
            </div>
            
            <div class="progress-bar">
                <div class="fill" id="progress-fill"></div>
            </div>
            
            <p style="text-align: center; color: #bdc3c7;" id="flip-status">
                已抛 0 / 6 次
            </p>
            
            <button class="btn-primary" id="btn-flip-all" onclick="flipAllCoins()">
                抛硬币 🪙
            </button>
            
            <div class="hexagram-display" id="hexagram-display">
                <h3 style="color: #f39c12; margin-bottom: 20px;">你的卦象</h3>
                <div id="yao-lines"></div>
            </div>
            
            <button class="btn-primary" id="btn-get-result" style="display: none;" onclick="getResult()">
                查看美食推荐 🍜
            </button>
        </div>
        
        <!-- 加载中 -->
        <div class="loading-spinner" id="loading-spinner">
            <div class="spinner"></div>
            <p class="loading-text">
                正在结合卦象、位置、口味为你推算<span class="dots"></span>
            </p>
        </div>
        
        <!-- 步骤 3: 查看推荐 -->
        <div class="result-card" id="result-card">
            <div class="hexagram-name" id="result-hexagram-name"></div>
            <div class="hexagram-meaning" id="result-hexagram-meaning"></div>
            
            <div class="restaurant-recommendation">
                <h3>🏆 今日最佳推荐</h3>
                <div id="restaurant-list"></div>
            </div>
            
            <button class="btn-primary" onclick="resetAll()">
                再起一卦 🔄
            </button>
        </div>
        
        <div class="footer">
            <p>基于传统六爻算法 · 结合现代 AI 推荐</p>
            <p style="margin-top: 10px;">
                <a href="#">卦象食缘</a> · 让每一次用餐都充满缘分
            </p>
        </div>
    </div>

                    stepEl.classList.add('completed');

                    stepEl.classList.add('active');

                } else {
                    stepEl.classList.remove('active', 'completed');
                }
            }

        // 抛硬币

            if (flipCount >= 6) return;
            
            const coin = document.getElementById(`coin${index + 1}`);
            coin.classList.add('flipping');
            
            setTimeout(() => {
                coin.classList.remove('flipping');
                const result = Math.random() > 0.5 ? '正' : '反';
                coin.textContent = result;
                
                if (index === 2) {
                    // 记录这一爻的结果
                    const coin1 = document.getElementById('coin1').textContent;
                    const coin2 = document.getElementById('coin2').textContent;
                    const coin3 = document.getElementById('coin3').textContent;
                    
                    const heads = [coin1, coin2, coin3].filter(c => c === '正').length;
                    let yao;
                    if (heads === 3) yao = { value: 1, changing: true, name: '老阳' };
                    else if (heads === 2) yao = { value: 0, changing: false, name: '少阴' };
                    else if (heads === 1) yao = { value: 1, changing: false, name: '少阳' };
                    else yao = { value: 0, changing: true, name: '老阴' };
                    
                    yaos.push(yao);
                    flipCount++;

                    }
                }
            }, 1000);

                // 检查忌口
                if (selectedAvoids.includes('no-spicy') && r.tags.includes('麻辣')) return false;
                if (selectedAvoids.includes('no-seafood') && r.type === '海鲜') return false;
                if (selectedAvoids.includes('no-meat') && !r.tags.includes('素食') && !r.tags.includes('轻食')) return false;
                return true;
            });
            
            // 排序并取前 3
            const sorted = filtered.sort(() => Math.random() - 0.5).slice(0, 3);
            
            sorted.forEach((restaurant, index) => {
                const matchScore = Math.floor(Math.random() * 15) + 85; // 85-100
                const item = document.createElement('div');
                item.className = 'restaurant-item';
                item.innerHTML = `
                    <div class="rank">${index + 1}</div>
                    <div class="info">
                        <div class="name">${restaurant.name}</div>
                        <div class="details">
                            ${restaurant.type} · ${restaurant.distance} · ${restaurant.rating}⭐ · ${restaurant.price}
                        </div>
                        <div class="details" style="margin-top: 5px;">
                            ${restaurant.tags.map(tag => `<span style="background: rgba(243,156,18,0.2); padding: 2px 8px; border-radius: 10px; font-size: 0.8em;">${tag}</span>`).join(' ')}
                        </div>
                    </div>
                    <div class="match-score">${matchScore}% 匹配</div>
                `;
                restaurantList.appendChild(item);
            });
            
            document.getElementById('result-card').classList.add('active');
            updateStepIndicator(3);
            currentStep = 3;
        }
        
        // 重置
        function resetAll() {
            currentStep = 1;
            flipCount = 0;
            yaos = [];
            selectedTastes = [];
            selectedAvoids = [];
            
            document.getElementById('result-card').classList.remove('active');
            document.getElementById('hexagram-display').classList.remove('active');
            document.getElementById('divination-card').style.display = 'none';
            document.getElementById('preferences-card').style.display = 'block';
            document.getElementById('btn-flip-all').style.display = 'block';
            document.getElementById('btn-get-result').style.display = 'none';
            document.getElementById('progress-fill').style.width = '0%';
            document.getElementById('flip-status').textContent = '已抛 0 / 6 次';
            
            document.querySelectorAll('.preference-item').forEach(item => {
                item.classList.remove('active');
            });
            
            document.getElementById('coin1').textContent = '正';
            document.getElementById('coin2').textContent = '正';
            document.getElementById('coin3').textContent = '正';
            
            updateStepIndicator(1);
        }
    </script>
</body>
</html>
