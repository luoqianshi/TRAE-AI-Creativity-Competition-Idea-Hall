/* --- Diagnosis --- */

    const na = [...answers]; na[qi] = ai; setAnswers(na);

  const score = answers.reduce((s,a,i) => s + (a===QUIZ_QUESTIONS[i].ans?20:0), 0);
  const dims = [
    { name:'基础语法', val:Math.min(100, score + 20) },
    { name:'数据结构', val:Math.min(100, score * 0.8) },
    { name:'算法思维', val:Math.min(100, score * 0.7 + 10) },
    { name:'数学基础', val:Math.min(100, score * 0.6 + 25) },
    { name:'竞赛策略', val:Math.min(100, score * 0.5 + 15) },
    { name:'项目实践', val:Math.min(100, score * 0.4 + 20) },

  const gradeRank = score>=90?'S':score>=80?'A':score>=70?'B+':score>=60?'B':'C';
  const rankColor = gradeRank==='S'?'#00e68a':gradeRank==='A'?'#00d4ff':gradeRank==='B+'?'#fbbf24':gradeRank==='B'?'#fb923c':'#ef4444';

    <section className="max-w-4xl mx-auto px-4 py-20">

            {grades.map(g=>(
              <button key={g} onClick={()=>{setGrade(g);setStep(1);}}

      {step===2 && (

/* --- Skill Tree / Learning Path --- */
function LearningPath() {
  const [selectedNode, setSelectedNode] = useState(null);
  const nodeW = 130, nodeH = 50;
  const levels = [[],[],[],[],[]];
  SKILL_NODES.forEach(n => levels[n.level-1].push(n));
  const getY = (lvl) => lvl * 110 + 30;
  const nodePos = {};
  levels.forEach((lvlNodes, li) => {
    const totalW = lvlNodes.length * (nodeW + 20) - 20;
    const startX = (900 - totalW) / 2;
    lvlNodes.forEach((n, ni) => { nodePos[n.id] = { x: startX + ni*(nodeW+20) + nodeW/2, y: getY(li+1) }; });
  });

  return (
    <section className="max-w-7xl mx-auto px-4 py-20">
      <h2 className="text-3xl font-bold text-center mb-2 bg-gradient-to-r from-accent to-cyan bg-clip-text text-transparent">可视化学习路径图</h2>
      <p className="text-gray-400 text-center mb-4">点击节点查看详情 · 颜色表示掌握程度</p>
      <div className="flex flex-wrap justify-center gap-4 mb-8">
        {[{s:'mastered',l:'已掌握',c:'#00e68a'},{s:'learning',l:'学习中',c:'#fbbf24'},{s:'weak',l:'薄弱',c:'#ef4444'},{s:'notstarted',l:'未开始',c:'#4b5563'}].map(x=>(
          <div key={x.s} className="flex items-center gap-2 text-sm"><div className="w-4 h-4 rounded" style={{background:x.c}}></div><span className="text-gray-400">{x.l}</span></div>
        ))}
      </div>
      <div className="relative overflow-x-auto">
        <svg viewBox="0 0 900 620" className="w-full min-w-[600px]" style={{maxHeight:'600px'}}>
          {/* Edges */}
          {SKILL_EDGES.map(([from,to],i)=>{
            const fp = nodePos[from], tp = nodePos[to];
            if(!fp||!tp) return null;
            return <line key={i} x1={fp.x} y1={fp.y} x2={tp.x} y2={tp.y} stroke="#1e293b" strokeWidth="2" markerEnd="url(#arrow)"/>
          })}
          <defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b"/></marker></defs>
          {/* Nodes */}
          {SKILL_NODES.map(n=>{
            const p = nodePos[n.id];
            if(!p) return null;
            return (
              <g key={n.id} className="cursor-pointer" onClick={()=>setSelectedNode(n.id)}>
                <rect x={p.x-nodeW/2} y={p.y-nodeH/2} width={nodeW} height={nodeH} rx="12"
                  fill={statusColor(n.status)} fillOpacity="0.2" stroke={statusColor(n.status)} strokeWidth="2"
                  className="hover:fill-opacity-40 transition-all"/>
                <text x={p.x} y={p.y+1} fill="#e2e8f0" fontSize="13" textAnchor="middle" dominantBaseline="middle" fontWeight="500">{n.name}</text>
                <text x={p.x} y={p.y+nodeH/2+14} fill={statusColor(n.status)} fontSize="10" textAnchor="middle">{statusLabel(n.status)}</text>
              </g>
            );
          })}
          {/* Level labels */}
          {[1,2,3,4,5].map(l=>(
            <text key={l} x="20" y={getY(l)} fill="#4b5563" fontSize="12" dominantBaseline="middle">Level {l}</text>
          ))}
        </svg>
        {/* Tooltip */}
        {selectedNode && (()=>{
          const n = SKILL_NODES.find(x=>x.id===selectedNode);
          if(!n) return null;
          return (
            <div className="node-tooltip" style={{left:'50%',top:'10px',transform:'translateX(-50%)'}}>
              <button className="absolute top-2 right-3 text-gray-400 hover:text-white text-lg" onClick={()=>setSelectedNode(null)}>×</button>
              <h4 className="text-accent font-bold text-lg mb-2">{n.name}</h4>
              <p className="text-gray-400 text-sm mb-2">状态：<span style={{color:statusColor(n.status)}}>{statusLabel(n.status)}</span></p>
              <p className="text-gray-300 text-sm mb-2">该知识点是竞赛核心内容，建议系统学习并配合专项练习。</p>
              <p className="text-cyan text-sm">📚 推荐资源：洛谷专题 + 《算法竞赛进阶指南》</p>
              <p className="text-gray-500 text-sm mt-1">🎯 练习题数：15-30 道</p>
            </div>
          );
        })()}
      </div>
      {/* Competition Timeline */}
      <div className="mt-12 bg-darkCard rounded-xl p-6 border border-darkBorder">
        <h4 className="font-bold text-cyan mb-4">📅 竞赛时间线</h4>
        <div className="space-y-4">
          {[{t:'CSP-J/S',d:'9月'},{t:'NOIP',d:'11月'},{t:'省选',d:'3月'},{t:'NOI',d:'7月'},{t:'IOI',d:'8月'}].map((e,i)=>(
            <div key={i} className="flex items-center gap-4">
              <div className="w-24 text-right text-accent text-sm font-mono">{e.d}</div>
              <div className="w-3 h-3 rounded-full bg-accent"></div>
              <div className="flex-1 h-px bg-darkBorder"></div>
              <div className="text-white font-medium">{e.t}</div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

                    <p className="text-gray-500 text-xs">{k==='schools'?'招生学校':k==='students'?'招生人数':'招生比例'}</p>
                    <p className="text-white font-bold">{v}</p>

                <div className="flex flex-wrap gap-2">{city.tags.map(t=>(<span key={t} className="px-2 py-1 bg-cyan/10 text-cyan text-xs rounded-full">{t}</span>))}</div>
              </div>
            </div>
            <div>
              <h4 className="text-cyan font-bold mb-3">📅 2026时间节点</h4>
              <div className="space-y-0">
                {city.timeline.map((ev,i)=>(
                  <div key={i} className="flex gap-3">
                    <div className="flex flex-col items-center">
                      <div className="w-3 h-3 rounded-full bg-cyan mt-1"></div>
                      {i<city.timeline.length-1 && <div className="w-px flex-1 bg-darkBorder"></div>}
                    </div>
                    <div className="pb-4">
                      <p className="text-cyan text-xs font-mono">{ev.d}</p>
                      <p className="text-white text-sm">{ev.t}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
            <div>
              <h4 className="text-yellow-400 font-bold mb-3">📝 报名条件</h4>
              <p className="text-gray-300 text-sm leading-relaxed mb-4">{city.condition}</p>
              <h4 className="text-yellow-400 font-bold mb-2">⭐ 政策特色</h4>
              <p className="text-gray-300 text-sm leading-relaxed mb-4">{city.feature}</p>
              <p className="text-gray-500 text-xs">📎 参考来源：{city.source}</p>

          </div>
        </div>
      )}

  );
}

/* --- Event Calendar --- */
function EventCalendar() {
  const [filter, setFilter] = useState('all');
  const months = ['','1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  // Extract month from date string
  function getMonth(dateStr) {
    if (!dateStr) return 0;
    // Handle "3-5月" patterns - assign to middle month
    if (dateStr.includes('3-5月')) return 4;
    if (dateStr.includes('4-6月')) return 5;
    if (dateStr.includes('7-8月')) return 7;
    if (dateStr.includes('7/13')) return 7; // CSP报名 spans 7-9
    // Handle "X月" pattern
    const monthMatch = dateStr.match(/(\d+)月/);
    if (monthMatch) return parseInt(monthMatch[1]);
    // Handle "X/Y" pattern - take first number as month
    const slashMatch = dateStr.match(/^(\d+)\//);
    if (slashMatch) return parseInt(slashMatch[1]);
    return 0;
  }

  const filtered = filter==='all' ? EVENTS_DATA : EVENTS_DATA.filter(e=>e.cat===filter);
  const monthGroups = {};
  filtered.forEach(ev => {
    const m = getMonth(ev.date);
    if (!monthGroups[m]) monthGroups[m] = [];
    monthGroups[m].push(ev);
  });

  const sortedMonths = Object.keys(monthGroups).map(Number).sort((a,b)=>a-b);

  return (
    <section className="max-w-7xl mx-auto px-4 py-20">
      <h2 className="text-3xl font-bold text-center mb-2 bg-gradient-to-r from-accent to-cyan bg-clip-text text-transparent">赛事日历 2026</h2>
      <p className="text-gray-400 text-center mb-8">全年重要赛事时间安排，助力科学备赛</p>
      {/* Filter Tags */}
      <div className="flex flex-wrap justify-center gap-3 mb-10">
        {Object.entries(CAT_LABELS).map(([k,l])=>(
          <button key={k} onClick={()=>setFilter(k)}
            className={`px-5 py-2.5 rounded-xl text-sm font-medium transition-all ${filter===k?'bg-accent text-dark':'bg-darkCard border border-darkBorder text-gray-300 hover:border-accent'}`}>
            {l}
          </button>
        ))}
      </div>
      {/* Calendar */}
      <div className="space-y-10">
        {sortedMonths.map(m => (
          <div key={m} className="fade-in">
            <div className="flex items-center gap-3 mb-4">
              <div className="w-10 h-10 rounded-full bg-accent/20 flex items-center justify-center text-accent font-bold">{m}</div>
              <h3 className="text-xl font-bold text-white">{months[m]}</h3>
              <div className="flex-1 h-px bg-darkBorder"></div>
            </div>
            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
              {monthGroups[m].map((ev,i)=>(
                <div key={ev.name+i} className="bg-darkCard rounded-xl p-5 border border-darkBorder hover:border-accent/30 transition-all slide-in" style={{animationDelay:`${i*0.05}s`}}>
                  <div className="flex items-start justify-between mb-2">
                    <h4 className="font-bold text-white text-sm">{ev.name}</h4>
                    {ev.rec && <span className="px-2 py-0.5 bg-accent/20 text-accent text-xs rounded-full shrink-0 ml-2">推荐</span>}
                  </div>
                  <p className="text-gray-400 text-sm mb-2">📅 {ev.date}</p>
                  {ev.deadline && <p className="text-yellow-400 text-xs mb-2">报名截止: {ev.deadline}</p>}
                  {ev.loc && <p className="text-gray-500 text-xs mb-2">📍 {ev.loc}</p>}
                  <span className="inline-block px-2 py-1 rounded-full text-xs" style={{background:CAT_COLORS[ev.cat]+'22', color:CAT_COLORS[ev.cat]}}>{CAT_LABELS[ev.cat]}</span>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
    </section>
  );
}

/* --- Dashboard --- */
function Dashboard() {
  const mastered = SKILL_NODES.filter(n=>n.status==='mastered').length;
  const learning = SKILL_NODES.filter(n=>n.status==='learning').length;
  const total = SKILL_NODES.length;
  const pct = Math.round(((mastered+learning*0.5)/total)*100);
  const streak = 14;
  const days = Array.from({length:28},(_,i)=>Math.random());
  const weeklyData = [3,5,4,6,2,7,5];

  // Ring chart params
  const ringR = 70, ringW = 12, cx=90, cy=90;
  const circ = 2*Math.PI*ringR;
  const offset = circ*(1-pct/100);

  return (
    <section className="max-w-7xl mx-auto px-4 py-20">
      <h2 className="text-3xl font-bold text-center mb-8 bg-gradient-to-r from-accent to-cyan bg-clip-text text-transparent">学习仪表盘</h2>
      {/* Stats Cards */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        {[
          { label:'已掌握知识点', val:mastered, icon:'✅', color:'text-accent' },
          { label:'学习中', val:learning, icon:'📖', color:'text-yellow-400' },
          { label:'连续打卡', val:`${streak}天`, icon:'🔥', color:'text-orange-400' },
          { label:'掌握率', val:`${pct}%`, icon:'📊', color:'text-cyan' },
        ].map((s,i)=>(
          <div key={i} className="bg-darkCard rounded-xl p-5 border border-darkBorder fade-in" style={{animationDelay:`${i*0.1}s`}}>
            <div className="text-2xl mb-2">{s.icon}</div>
            <p className={`text-2xl font-bold ${s.color}`}>{s.val}</p>
            <p className="text-gray-500 text-sm">{s.label}</p>
          </div>
        ))}
      </div>
      <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
        {/* Ring Chart */}
        <div className="bg-darkCard rounded-xl p-6 border border-darkBorder fade-in">
          <h4 className="font-bold text-white mb-4">学习进度</h4>
          <svg viewBox="0 0 180 180" className="w-48 mx-auto">
            <circle cx={cx} cy={cy} r={ringR} fill="none" stroke="#1e293b" strokeWidth={ringW}/>
            <circle cx={cx} cy={cy} r={ringR} fill="none" stroke="#00e68a" strokeWidth={ringW}
              strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round" transform={`rotate(-90 ${cx} ${cy})`}
              className="transition-all duration-1000"/>
            <text x={cx} y={cy-5} fill="#e2e8f0" fontSize="28" fontWeight="bold" textAnchor="middle">{pct}%</text>
            <text x={cx} y={cy+18} fill="#64748b" fontSize="12" textAnchor="middle">总进度</text>
          </svg>
        </div>
        {/* Weekly Bar Chart */}
        <div className="bg-darkCard rounded-xl p-6 border border-darkBorder fade-in" style={{animationDelay:'0.1s'}}>
          <h4 className="font-bold text-white mb-4">本周学习时长(h)</h4>
          <svg viewBox="0 0 280 150" className="w-full">
            {weeklyData.map((v,i)=>{
              const max = Math.max(...weeklyData);
              const h = (v/max)*100;
              return (
                <g key={i}>
                  <rect x={10+i*38} y={130-h} width="26" height={h} rx="4" fill="#00e68a" opacity="0.8" className="hover:opacity-100 transition-all"/>
                  <text x={10+i*38+13} y={145} fill="#64748b" fontSize="10" textAnchor="middle">{'日一二三四五六'[i]}</text>
                  <text x={10+i*38+13} y={130-h-5} fill="#00e68a" fontSize="10" textAnchor="middle">{v}h</text>
                </g>
              );
            })}
          </svg>
        </div>
        {/* Heatmap */}
        <div className="bg-darkCard rounded-xl p-6 border border-darkBorder fade-in md:col-span-2 lg:col-span-1" style={{animationDelay:'0.2s'}}>
          <h4 className="font-bold text-white mb-4">28天打卡热力图</h4>
          <div className="flex flex-wrap gap-1 justify-center">
            {days.map((d,i)=>{
              const opacity = d < 0.2 ? 0.1 : d < 0.4 ? 0.3 : d < 0.6 ? 0.5 : d < 0.8 ? 0.7 : 0.9;
              return <div key={i} className="heatmap-cell" style={{background:`rgba(0,230,138,${opacity})`}} title={`第${i+1}天`}></div>;
            })}
          </div>
          <div className="flex items-center justify-center gap-2 mt-3">
            <span className="text-gray-500 text-xs">少</span>
            {[0.1,0.3,0.5,0.7,0.9].map((o,i)=>(
              <div key={i} className="w-3 h-3 rounded" style={{background:`rgba(0,230,138,${o})`}}></div>
            ))}
            <span className="text-gray-500 text-xs">多</span>
          </div>
        </div>
      </div>
    </section>
  );
}
