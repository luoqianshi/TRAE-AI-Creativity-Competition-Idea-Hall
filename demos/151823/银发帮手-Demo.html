<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>银发帮手 - 不会手机也能办</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #4A90D9;
  --primary-dark: #3A7BC8;
  --primary-light: #E8F2FE;
  --accent: #F5A623;
  --accent-dark: #E09613;
  --accent-light: #FFF5E6;
  --bg: #F0F4F8;
  --text: #2D3436;
  --text-light: #636E72;
  --success: #00B894;
  --danger: #E74C3C;
  --card-bg: #FFFFFF;
  --shadow: 0 4px 20px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
  --radius: 20px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #E8F0FE 0%, #FFF5E6 100%);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
}

.page {
  display: none;
  min-height: 100vh;
  padding: 24px 20px;
  flex-direction: column;
  align-items: center;
  animation: fadeIn 0.5s ease;
}
.page.active { display: flex; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slideInRight {
  from { opacity: 0; transform: translateX(50px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes slideInLeft {
  from { opacity: 0; transform: translateX(-30px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes pulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(74,144,217,0.4); }
  50% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(74,144,217,0); }
}

@keyframes bounce {
  0% { transform: scale(0.5); opacity: 0; }
  60% { transform: scale(1.1); opacity: 1; }
  100% { transform: scale(1); }
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

/* ========== Welcome Page ========== */
#welcome-page { justify-content: center; gap: 16px; text-align: center; }

.welcome-icon {
  font-size: 72px;
  animation: float 3s ease-in-out infinite;
  margin-bottom: 8px;
}

.welcome-title {
  font-size: 42px;
  font-weight: 800;
  color: var(--primary);
  letter-spacing: 2px;
}

.welcome-subtitle {
  font-size: 22px;
  color: var(--text-light);
  margin-bottom: 8px;
}

.welcome-tagline {
  font-size: 16px;
  color: var(--accent-dark);
  background: var(--accent-light);
  padding: 8px 20px;
  border-radius: 30px;
  margin-bottom: 32px;
}

.btn-start {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  border: none;
  font-size: 26px;
  font-weight: 700;
  padding: 18px 60px;
  border-radius: 50px;
  cursor: pointer;
  box-shadow: var(--shadow-lg);
  transition: transform 0.2s;
}
.btn-start:active { transform: scale(0.95); }

.welcome-footer {
  margin-top: 40px;
  font-size: 14px;
  color: #B2BEC3;
}

/* ========== Main Page ========== */
#main-page { justify-content: flex-start; gap: 20px; }

.top-bar {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.top-bar .app-name {
  font-size: 22px;
  font-weight: 700;
  color: var(--primary);
}

.status-dot {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  color: var(--success);
}

.status-dot::before {
  content: '';
  width: 10px;
  height: 10px;
  background: var(--success);
  border-radius: 50%;
  animation: pulse 2s infinite;
}

.clock-card {
  width: 100%;
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 24px;
  text-align: center;
  box-shadow: var(--shadow);
}

.clock-time {
  font-size: 40px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: 2px;
}

.clock-date {
  font-size: 18px;
  color: var(--text-light);
  margin-top: 4px;
}

.mic-section {
  width: 100%;
  text-align: center;
  margin: 12px 0;
}

.mic-btn {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto;
  animation: pulse 2.5s infinite;
  transition: transform 0.2s;
}
.mic-btn:active { transform: scale(0.92); }
.mic-btn.listening { background: linear-gradient(135deg, var(--danger), #C0392B); }

.mic-btn svg { width: 44px; height: 44px; fill: white; }

.mic-hint {
  font-size: 18px;
  color: var(--text-light);
  margin-top: 12px;
}

.scenarios {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.scenario-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 24px 16px;
  text-align: center;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 0.2s, box-shadow 0.2s;
  border: 2px solid transparent;
}
.scenario-card:active {
  transform: scale(0.96);
  border-color: var(--primary);
}

.scenario-icon {
  font-size: 40px;
  margin-bottom: 8px;
}

.scenario-name {
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
}

.main-footer {
  margin-top: auto;
  font-size: 14px;
  color: var(--text-light);
  text-align: center;
  padding-top: 16px;
}

/* ========== Demo Page ========== */
#demo-page { justify-content: flex-start; gap: 16px; }

.demo-header {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
}

.btn-back {
  background: var(--card-bg);
  border: none;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  font-size: 22px;
  cursor: pointer;
  box-shadow: var(--shadow);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
}

.demo-title {
  font-size: 24px;
  font-weight: 700;
}

.ai-bubble {
  width: 100%;
  background: var(--primary-light);
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  animation: slideInLeft 0.4s ease;
}

.ai-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
}

.ai-text {
  font-size: 20px;
  line-height: 1.6;
  color: var(--text);
  padding-top: 4px;
}

.steps-container {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.step-item {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--card-bg);
  border-radius: 14px;
  padding: 16px 18px;
  box-shadow: var(--shadow);
  opacity: 0;
  animation: slideInLeft 0.4s ease forwards;
}

.step-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 16px;
}

.step-icon.loading {
  background: var(--primary-light);
  border: 3px solid var(--primary);
  border-top-color: transparent;
  animation: spin 0.8s linear infinite;
}

.step-icon.done {
  background: var(--success);
  color: white;
}

.step-text {
  font-size: 19px;
  color: var(--text);
}

/* Son's Phone Mockup */
.phone-mockup {
  display: none;
  width: 280px;
  background: #1a1a2e;
  border-radius: 32px;
  padding: 12px;
  box-shadow: var(--shadow-lg);
  animation: slideInRight 0.5s ease;
  margin: 8px auto;
}
.phone-mockup.show { display: block; }

.phone-screen {
  background: #f0f0f0;
  border-radius: 24px;
  padding: 20px 16px;
  text-align: center;
}

.phone-notch {
  width: 60px;
  height: 6px;
  background: #333;
  border-radius: 3px;
  margin: 0 auto 16px;
}

.phone-notification {
  background: white;
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  text-align: left;
}

.phone-notif-title {
  font-size: 14px;
  color: var(--text-light);
  margin-bottom: 6px;
}

.phone-notif-body {
  font-size: 17px;
  color: var(--text);
  line-height: 1.5;
  margin-bottom: 16px;
}

.phone-btns {
  display: flex;
  gap: 10px;
}

.phone-btn {
  flex: 1;
  border: none;
  border-radius: 10px;
  padding: 12px;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
}

.phone-btn.confirm {
  background: var(--success);
  color: white;
}

.phone-btn.cancel {
  background: #E0E0E0;
  color: var(--text-light);
}

.phone-label {
  font-size: 14px;
  color: var(--text-light);
  margin-top: 10px;
}

/* Success State */
.success-state {
  display: none;
  text-align: center;
  padding: 20px;
}
.success-state.show { display: block; animation: bounce 0.6s ease; }

.success-icon {
  font-size: 64px;
  margin-bottom: 12px;
}

.success-text {
  font-size: 26px;
  font-weight: 700;
  color: var(--success);
  margin-bottom: 8px;
}

.success-detail {
  font-size: 18px;
  color: var(--text-light);
}

/* Demo Footer */
.demo-footer {
  margin-top: auto;
  width: 100%;
  padding-top: 16px;
}

.btn-next {
  width: 100%;
  background: var(--accent);
  color: white;
  border: none;
  font-size: 22px;
  font-weight: 700;
  padding: 16px;
  border-radius: 14px;
  cursor: pointer;
  box-shadow: var(--shadow);
  display: none;
}
.btn-next.show { display: block; animation: fadeIn 0.4s ease; }
.btn-next:active { transform: scale(0.98); }

/* ========== Teaching Card Page ========== */
#card-page { justify-content: center; gap: 20px; }

.teaching-card {
  width: 100%;
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 32px 24px;
  box-shadow: var(--shadow-lg);
  text-align: center;
}

.teaching-icon {
  font-size: 56px;
  margin-bottom: 12px;
}

.teaching-title {
  font-size: 26px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 20px;
}

.teaching-content {
  font-size: 19px;
  line-height: 1.8;
  color: var(--text);
  text-align: left;
  background: var(--primary-light);
  border-radius: 14px;
  padding: 20px;
  white-space: pre-line;
}

.teaching-quote {
  font-size: 17px;
  color: var(--accent-dark);
  margin-top: 16px;
  font-style: italic;
}

.btn-done {
  width: 100%;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  border: none;
  font-size: 22px;
  font-weight: 700;
  padding: 16px;
  border-radius: 14px;
  cursor: pointer;
  box-shadow: var(--shadow);
}
.btn-done:active { transform: scale(0.98); }

/* Listening indicator */
.listening-text {
  display: none;
  font-size: 20px;
  color: var(--danger);
  text-align: center;
  margin-top: 8px;
  animation: pulse 1s infinite;
}
.listening-text.show { display: block; }

@media (max-width: 360px) {
  .welcome-title { font-size: 36px; }
  .clock-time { font-size: 32px; }
  .scenario-name { font-size: 16px; }
}
</style>
</head>
<body>
<div class="app">

<!-- ===== Welcome Page ===== -->
<div id="welcome-page" class="page active">
  <div class="welcome-icon">👴</div>
  <div class="welcome-title">银发帮手</div>
  <div class="welcome-subtitle">不会手机也能办</div>
  <div class="welcome-tagline">不是代替你，是陪你学</div>
  <button class="btn-start" onclick="goPage('main-page')">开始使用</button>
  <div class="welcome-footer">为独居老人设计的 AI 数字代理人</div>
</div>

<!-- ===== Main Page ===== -->
<div id="main-page" class="page">
  <div class="top-bar">
    <span class="app-name">银发帮手</span>
    <span class="status-dot">儿子远程协助 已连接</span>
  </div>

  <div class="clock-card">
    <div class="clock-time" id="clock-time">--:--</div>
    <div class="clock-date" id="clock-date">--</div>
  </div>

  <div class="mic-section">
    <button class="mic-btn" id="mic-btn" onclick="toggleMic()">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
    </button>
    <div class="mic-hint">按住说话，告诉我您要办什么</div>
    <div class="listening-text" id="listening-text">正在聆听...</div>
  </div>

  <div class="scenarios">
    <div class="scenario-card" onclick="startScenario('hospital')">
      <div class="scenario-icon">🏥</div>
      <div class="scenario-name">去医院挂号</div>
    </div>
    <div class="scenario-card" onclick="startScenario('bill')">
      <div class="scenario-icon">💡</div>
      <div class="scenario-name">缴水电费</div>
    </div>
    <div class="scenario-card" onclick="startScenario('taxi')">
      <div class="scenario-icon">🚕</div>
      <div class="scenario-name">叫车出行</div>
    </div>
    <div class="scenario-card" onclick="startScenario('weather')">
      <div class="scenario-icon">🌤️</div>
      <div class="scenario-name">查天气</div>
    </div>
  </div>

  <div class="main-footer">银发帮手 · 让科技有温度</div>
</div>

<!-- ===== Demo Page ===== -->
<div id="demo-page" class="page">
  <div class="demo-header">
    <button class="btn-back" onclick="goPage('main-page')">←</button>
    <span class="demo-title" id="demo-title">操作中</span>
  </div>

  <div class="ai-bubble" id="ai-bubble">
    <div class="ai-avatar">🤖</div>
    <div class="ai-text" id="ai-text">好的，我来帮您</div>
  </div>

  <div class="steps-container" id="steps-container"></div>

  <div class="phone-mockup" id="phone-mockup">
    <div class="phone-screen">
      <div class="phone-notch"></div>
      <div class="phone-notification">
        <div class="phone-notif-title">📱 儿子的手机</div>
        <div class="phone-notif-body" id="phone-notif-body">妈妈需要您确认</div>
        <div class="phone-btns">
          <button class="phone-btn cancel" onclick="cancelConfirm()">取消</button>
          <button class="phone-btn confirm" onclick="confirmStep()">确认</button>
        </div>
      </div>
      <div class="phone-label">远程协助 · 安全验证</div>
    </div>
  </div>

  <div class="success-state" id="success-state">
    <div class="success-icon" id="success-icon">✅</div>
    <div class="success-text" id="success-text">操作成功！</div>
    <div class="success-detail" id="success-detail"></div>
  </div>

  <div class="demo-footer">
    <button class="btn-next" id="btn-next" onclick="showTeachingCard()">查看今天学了什么 →</button>
  </div>
</div>

<!-- ===== Teaching Card Page ===== -->
<div id="card-page" class="page">
  <div class="teaching-card">
    <div class="teaching-icon" id="teaching-icon">📚</div>
    <div class="teaching-title">今天您学了什么</div>
    <div class="teaching-content" id="teaching-content"></div>
    <div class="teaching-quote" id="teaching-quote">"不是代替你，是陪你学"</div>
  </div>
  <button class="btn-done" onclick="goPage('main-page')">我知道了</button>
</div>

</div>

<script>
// ========== Scenario Data ==========
const scenarios = {
  hospital: {
    name: '医院挂号',
    icon: '🏥',
    aiText: '好的，我来帮您挂号。别着急，一步一步来。',
    steps: [
      { text: '正在打开挂号平台...', loading: true },
      { text: '已选择：市第一人民医院', done: true },
      { text: '已选择：心内科', done: true },
      { text: '已选择：明天下午 2:00', done: true },
    ],
    needConfirm: true,
    confirmText: '妈妈要挂明天下午 2:00 心内科的号，请确认。',
    successIcon: '✅',
    successText: '挂号成功！',
    successDetail: '明天下午 2:00 · 心内科 · 市第一人民医院\n请提前 30 分钟到达',
    teaching: '今天帮您挂了号。其实您也可以自己试试：\n\n第一步：打开绿色的「挂号」图标\n第二步：点「预约挂号」\n第三步：选「心内科」\n第四步：选时间，点「确认」\n\n就这四步，下次试试看？'
  },
  bill: {
    name: '缴纳水电费',
    icon: '💡',
    aiText: '好的，我来帮您交水电费。',
    steps: [
      { text: '正在打开缴费平台...', loading: true },
      { text: '已识别：水费 + 电费', done: true },
      { text: '已输入户号：3301****88', done: true },
      { text: '应缴金额：¥186.50', done: true },
    ],
    needConfirm: true,
    confirmText: '妈妈要交水电费 ¥186.50，请确认支付。',
    successIcon: '✅',
    successText: '缴费成功！',
    successDetail: '水费 ¥68.30 + 电费 ¥118.20\n共计 ¥186.50 已缴纳',
    teaching: '今天帮您交了水电费。您也可以自己试试：\n\n第一步：打开「支付宝」\n第二步：点「生活缴费」\n第三步：输入户号（贴在电表上的那张纸有）\n第四步：点「缴费」\n\n其实不难的，下次试试？'
  },
  taxi: {
    name: '叫车出行',
    icon: '🚕',
    aiText: '好的，我来帮您叫个车。',
    steps: [
      { text: '正在打开打车软件...', loading: true },
      { text: '已定位：您当前位置', done: true },
      { text: '已选择目的地：市第一人民医院', done: true },
      { text: '预计费用：约 ¥15-20', done: true },
    ],
    needConfirm: true,
    confirmText: '妈妈要叫车去市第一人民医院，预计 ¥15-20，请确认。',
    successIcon: '🚗',
    successText: '叫车成功！',
    successDetail: '司机李师傅 · 蓝色比亚迪 · 5分钟后到达\n车牌：苏A·8****6',
    teaching: '今天帮您叫了车。其实叫车也不难：\n\n第一步：打开「滴滴」图标\n第二步：点上面「去哪儿」\n第三步：输入要去的地方\n第四步：点「叫车」\n\n学会了出门就方便多啦！'
  },
  weather: {
    name: '查天气',
    icon: '🌤️',
    aiText: '好的，我帮您查一下明天天气。',
    steps: [
      { text: '正在查询天气信息...', loading: true },
      { text: '明天天气：多云转晴', done: true },
      { text: '气温：22°C ~ 30°C', done: true },
      { text: '风力：东南风 3 级', done: true },
    ],
    needConfirm: false,
    successIcon: '☀️',
    successText: '查到啦！',
    successDetail: '明天多云转晴，22~30°C\n适合外出，记得防晒哦~',
    teaching: '查天气最简单啦！\n\n您只需要按住中间的大按钮\n说一句「明天天气怎么样」\n我就会告诉您\n\n不用打开任何 APP，试试看？'
  }
};

let currentScenario = null;
let currentStepIndex = 0;

// ========== Navigation ==========
function goPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  if (pageId === 'main-page') {
    resetDemoPage();
  }
}

// ========== Clock ==========
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('clock-time').textContent = h + ':' + m;
  const days = ['日','一','二','三','四','五','六'];
  document.getElementById('clock-date').textContent =
    now.getMonth()+1 + '月' + now.getDate() + '日 星期' + days[now.getDay()];
}
setInterval(updateClock, 1000);
updateClock();

// ========== Voice ==========
function speak(text) {
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.9;
    u.pitch = 1.0;
    speechSynthesis.speak(u);
  }
}

let recognition = null;
let isListening = false;

function toggleMic() {
  const btn = document.getElementById('mic-btn');
  const txt = document.getElementById('listening-text');

  if (isListening) {
    isListening = false;
    btn.classList.remove('listening');
    txt.classList.remove('show');
    if (recognition) recognition.stop();
    return;
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    // Fallback: show a hint
    alert('您的浏览器不支持语音输入，请直接点击下方按钮选择服务');
    return;
  }

  recognition = new SR();
  recognition.lang = 'zh-CN';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    isListening = true;
    btn.classList.add('listening');
    txt.classList.add('show');
  };

  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    handleVoiceInput(transcript);
  };

  recognition.onerror = () => {
    isListening = false;
    btn.classList.remove('listening');
    txt.classList.remove('show');
  };

  recognition.onend = () => {
    isListening = false;
    btn.classList.remove('listening');
    txt.classList.remove('show');
  };

  recognition.start();
}

function handleVoiceInput(text) {
  const t = text.toLowerCase();
  if (t.includes('挂号') || t.includes('医院')) {
    startScenario('hospital');
  } else if (t.includes('水电') || t.includes('缴费') || t.includes('交费')) {
    startScenario('bill');
  } else if (t.includes('车') || t.includes('打车') || t.includes('叫车') || t.includes('出租')) {
    startScenario('taxi');
  } else if (t.includes('天气')) {
    startScenario('weather');
  } else {
    speak('我没听太清楚，您可以点下面的按钮选择');
  }
}

// ========== Demo Flow ==========
function startScenario(key) {
  currentScenario = scenarios[key];
  currentStepIndex = 0;
  document.getElementById('demo-title').textContent = currentScenario.name;
  document.getElementById('ai-text').textContent = currentScenario.aiText;
  document.getElementById('steps-container').innerHTML = '';
  document.getElementById('phone-mockup').classList.remove('show');
  document.getElementById('success-state').classList.remove('show');
  document.getElementById('btn-next').classList.remove('show');
  goPage('demo-page');
  speak(currentScenario.aiText);

  // Start steps after a delay
  setTimeout(() => runStep(0), 1500);
}

function runStep(index) {
  if (index >= currentScenario.steps.length) {
    // All steps done
    if (currentScenario.needConfirm) {
      showPhoneMockup();
    } else {
      showSuccess();
    }
    return;
  }

  const step = currentScenario.steps[index];
  const container = document.getElementById('steps-container');

  const div = document.createElement('div');
  div.className = 'step-item';
  div.style.animationDelay = '0s';

  const icon = document.createElement('div');
  icon.className = 'step-icon loading';

  const text = document.createElement('div');
  text.className = 'step-text';
  text.textContent = step.text;

  div.appendChild(icon);
  div.appendChild(text);
  container.appendChild(div);

  // After loading, mark as done
  setTimeout(() => {
    icon.classList.remove('loading');
    icon.classList.add('done');
    icon.textContent = '✓';
    if (step.done) {
      // Proceed to next step
      setTimeout(() => runStep(index + 1), 800);
    }
  }, 1500);
}

function showPhoneMockup() {
  const phone = document.getElementById('phone-mockup');
  document.getElementById('phone-notif-body').textContent = currentScenario.confirmText;
  phone.classList.add('show');
  speak('这一步需要您儿子确认，已经发通知给他了。');
}

function confirmStep() {
  document.getElementById('phone-mockup').classList.remove('show');
  speak('儿子已确认，继续操作。');
  setTimeout(() => showSuccess(), 800);
}

function cancelConfirm() {
  document.getElementById('phone-mockup').classList.remove('show');
  speak('已取消，没事的，下次再办也行。');
  setTimeout(() => goPage('main-page'), 1500);
}

function showSuccess() {
  const state = document.getElementById('success-state');
  document.getElementById('success-icon').textContent = currentScenario.successIcon;
  document.getElementById('success-text').textContent = currentScenario.successText;
  document.getElementById('success-detail').textContent = currentScenario.successDetail;
  state.classList.add('show');
  speak(currentScenario.successText);
  document.getElementById('btn-next').classList.add('show');
}

function showTeachingCard() {
  document.getElementById('teaching-icon').textContent = currentScenario.icon;
  document.getElementById('teaching-content').textContent = currentScenario.teaching;
  goPage('card-page');
  speak('今天帮您办了事，我也教您怎么做，下次您可以自己试试。');
}

function resetDemoPage() {
  document.getElementById('steps-container').innerHTML = '';
  document.getElementById('phone-mockup').classList.remove('show');
  document.getElementById('success-state').classList.remove('show');
  document.getElementById('btn-next').classList.remove('show');
}

// ========== Init ==========
// Preload voices
if ('speechSynthesis' in window) {
  speechSynthesis.getVoices();
}
</script>
