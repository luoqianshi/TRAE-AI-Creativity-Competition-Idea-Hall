<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智慧问答 - 伟人抽卡</title>
    <style id="theme-vars">
:root {
  /* ── Brand Colors ── */
  --color-primary: #8B0000;
  --color-primary-light: #A52A2A;
  --color-primary-lighter: #CD5C5C;
  --color-primary-lightest: #F5D5D5;
  --color-gold: #DAA520;
  --color-gold-light: #F0D060;
  --color-gold-lighter: #F5E8A8;
  --color-bg: #FDF5E6;
  --color-bg-warm: #F8ECD4;
  --color-bg-card: #FFFFFF;
  --color-bg-card-alt: #FFFAF0;
  --color-ink: #2F2F2F;
  --color-ink-light: #4A4A4A;
  --color-ink-muted: #666666;
  --color-ink-subtle: #999999;
  --color-accent: #DC143C;
  --color-border: #E8D5C0;
  --color-border-light: #F0E6D8;
  --color-divider: #E0D0B8;
  --color-shadow: rgba(139, 0, 0, 0.05);

  /* ── State Colors ── */
  --state-success: #2E7D32;
  --state-warning: #E65100;
  --state-error: #C62828;
  --state-info: #1565C0;

  /* ── Typography ── */
  --font-display: "Noto Serif SC", "STSong", "SimSun", "Songti SC", serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  --font-mono: "Fira Code", "Source Code Pro", monospace;

  --text-xs: 0.6875rem;
  --text-sm: 0.8125rem;
  --text-base: 0.9375rem;
  --text-lg: 1.125rem;
  --text-xl: 1.3125rem;
  --text-2xl: 1.625rem;
  --text-3xl: 2rem;
  --text-4xl: 2.5rem;

  --leading-tight: 1.3;
  --leading-normal: 1.6;
  --leading-relaxed: 1.8;

  --tracking-tight: -0.02em;
  --tracking-normal: 0;
  --tracking-wide: 0.05em;

  /* ── Spacing ── */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;
  --space-16: 4rem;

  /* ── Radius ── */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* ── Shadows ── */
  --shadow-xs: 0 1px 2px rgba(139, 0, 0, 0.03);
  --shadow-sm: 0 1px 3px rgba(139, 0, 0, 0.04);
  --shadow-md: 0 2px 8px rgba(139, 0, 0, 0.04);
  --shadow-lg: 0 4px 16px rgba(139, 0, 0, 0.05);
  --shadow-xl: 0 8px 32px rgba(139, 0, 0, 0.05);

  /* ── Z-index ── */
  --z-base: 0;
  --z-above: 10;
  --z-nav: 100;
  --z-overlay: 200;
  --z-modal: 300;
  --z-toast: 400;

  /* ── Layout ── */
  --container-max: 420px;
  --content-padding: 1.25rem;
  --section-gap: 1.5rem;
}

html.dark {
  --color-primary: #CD5C5C;
  --color-primary-light: #E07070;
  --color-primary-lighter: #F0A0A0;
  --color-primary-lightest: #3A2020;
  --color-gold: #F0D060;
  --color-gold-light: #F5E080;
  --color-gold-lighter: #4A4020;
  --color-bg: #1A1510;
  --color-bg-warm: #221C14;
  --color-bg-card: #2A2218;
  --color-bg-card-alt: #302820;
  --color-ink: #E8DCC8;
  --color-ink-light: #C8BCA8;
  --color-ink-muted: #A09080;
  --color-ink-subtle: #706050;
  --color-accent: #FF4060;
  --color-border: #3A3020;
  --color-border-light: #302818;
  --color-divider: #4A3828;
  --color-shadow: rgba(0, 0, 0, 0.3);
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.15);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.18);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.2);
  --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.25);
  --shadow-xl: 0 8px 32px rgba(0, 0, 0, 0.3);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-accent: var(--color-accent);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>

<body>
  <!-- Main Mobile Container -->
  <div class="w-full max-w-[420px] min-h-screen flex flex-col relative bg-[#FDF5E6]">

    <!-- ======================== -->
    <!-- Top Bar                 -->
    <!-- ======================== -->
    <header class="sticky top-0 z-50 bg-[#FDF5E6] border-b border-[#E8D5C0] px-4 py-3 flex items-center justify-center">
      <div class="absolute left-4">
        <svg class="w-5 h-5 text-[#666666]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </div>
      <h1 class="font-display text-lg font-semibold text-[#2F2F2F] tracking-tight">AI智慧问答</h1>
      <div class="absolute right-4">
        <svg class="w-5 h-5 text-[#666666]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </div>
    </header>

    <!-- ======================== -->
    <!-- Quick Question Tags      -->
    <!-- ======================== -->
    <div class="px-4 py-3 bg-[#FDF5E6]">
      <div class="tags-scroll flex gap-2">
        <button class="shrink-0 px-4 py-1.5 rounded-full border border-[#DAA520] text-[#8B0000] text-xs font-medium font-body whitespace-nowrap bg-transparent hover:bg-[#F5E8A8] transition-colors">
          事业运势
        </button>
        <button class="shrink-0 px-4 py-1.5 rounded-full border border-[#DAA520] text-[#8B0000] text-xs font-medium font-body whitespace-nowrap bg-transparent hover:bg-[#F5E8A8] transition-colors">
          感情困惑
        </button>
        <button class="shrink-0 px-4 py-1.5 rounded-full border border-[#DAA520] text-[#8B0000] text-xs font-medium font-body whitespace-nowrap bg-transparent hover:bg-[#F5E8A8] transition-colors">
          学业指导
        </button>
        <button class="shrink-0 px-4 py-1.5 rounded-full border border-[#DAA520] text-[#8B0000] text-xs font-medium font-body whitespace-nowrap bg-transparent hover:bg-[#F5E8A8] transition-colors">
          人生方向
        </button>
        <button class="shrink-0 px-4 py-1.5 rounded-full border border-[#DAA520] text-[#8B0000] text-xs font-medium font-body whitespace-nowrap bg-transparent hover:bg-[#F5E8A8] transition-colors">
          诗词赏析
        </button>
      </div>
    </div>

    <!-- ======================== -->
    <!-- Chat Message Area        -->
    <!-- ======================== -->
    <div class="flex-1 overflow-y-auto scrollbar-hidden px-4 py-4 space-y-4 bg-[#FDF5E6]" style="padding-bottom: 140px;">

      <!-- System Message -->
      <div class="flex justify-center">
        <span class="text-xs text-[#999999] font-body bg-[#F0E6D8] px-3 py-1 rounded-full">AI以伟人风格为您解读签文</span>
      </div>

      <!-- User Message -->
      <div class="flex justify-end">
        <div class="max-w-[80%] bg-[#F5D5D5] rounded-2xl rounded-tr-sm px-4 py-2.5 shadow-sm">
          <p class="text-sm text-[#2F2F2F] font-body leading-relaxed">最近工作遇到瓶颈，该如何突破？</p>
        </div>
      </div>

      <!-- AI Response -->
      <div class="flex items-start gap-2.5">
        <!-- Avatar -->
        <div class="shrink-0 w-9 h-9 rounded-full bg-[#8B0000] flex items-center justify-center shadow-sm">
          <span class="text-white text-sm font-display font-semibold">毛</span>
        </div>
        <!-- AI Card -->
        <div class="max-w-[82%] ai-card bg-white rounded-2xl rounded-tl-sm px-4 py-3 shadow-md">
          <div class="text-sm font-display text-[#2F2F2F] leading-relaxed space-y-3">
            <p class="font-semibold text-[#8B0000]">"世上无难事，只要肯登攀。"</p>

            <p>这阕词，是我重上井冈山时写的。革命道路比你今日的工作瓶颈不知艰难多少倍，但我们就是凭着一股子"登攀"的劲头走过来的。</p>

            <p>工作遇到瓶颈不可怕，怕的是失去信心。井冈山那么高我们都上去了，这点困难算得了什么？</p>

            <p>"可上九天揽月，可下五洋捉鳖，谈笑凯歌还。"要有这样的气概。</p>
          </div>

          <!-- Action Buttons -->
          <div class="flex items-center gap-4 mt-3 pt-3 border-t border-[#F0E6D8]">
            <button class="flex items-center gap-1 text-[#999999] hover:text-[#8B0000] transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072M12 6a7 7 0 010 14M18.364 5.636a9 9 0 010 12.728" />
              </svg>
              <span class="text-xs font-body">朗读</span>
            </button>
            <button class="flex items-center gap-1 text-[#999999] hover:text-[#DAA520] transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
              </svg>
              <span class="text-xs font-body">收藏</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Poem Reference Card -->
      <div class="flex justify-start pl-[2.875rem]">
        <button class="flex items-center gap-2 bg-[#FFFAF0] border border-[#F0E6D8] rounded-xl px-3.5 py-2.5 shadow-sm hover:border-[#DAA520] transition-colors w-full max-w-[82%]">
          <svg class="w-4 h-4 text-[#DAA520] shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          </svg>
          <div class="flex items-center gap-1.5">
            <span class="text-xs text-[#999999] font-body">引用：</span>
            <span class="text-xs text-[#DAA520] font-display font-semibold">《水调歌头·重上井冈山》</span>
          </div>
          <svg class="w-3.5 h-3.5 text-[#999999] shrink-0 ml-auto" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </div>

    </div>

    <!-- ======================== -->
    <!-- Input Area (fixed bottom) -->
    <!-- ======================== -->
    <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[420px] z-40">
      <!-- Input Bar -->
      <div class="bg-white border-t border-[#F0E6D8] px-4 py-3 flex items-center gap-2.5">
        <input
          type="text"
          placeholder="输入你的问题..."
          class="flex-1 h-9 px-4 rounded-full bg-[#FDF5E6] border border-[#E8D5C0] text-sm text-[#2F2F2F] placeholder-[#999999] font-body outline-none focus:border-[#DAA520] transition-colors"
        />
        <button class="shrink-0 h-9 px-4 rounded-full bg-[#8B0000] text-white text-sm font-medium font-body flex items-center gap-1.5 shadow-sm hover:bg-[#A52A2A] transition-colors">
          <span>发送</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 19V5m0 0l-7 7m7-7l7 7" />
          </svg>
        </button>
      </div>

      <!-- Bottom Navigation Bar -->
      <nav class="bg-white border-t border-[#E8D5C0] px-2 py-1.5 flex items-center justify-around">
        <!-- 求签 Tab -->
        <a href="home.html" class="flex flex-col items-center gap-0.5 py-1 px-3" data-dom-id="nav-home">
          <svg class="w-5 h-5 text-[#999999]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9" />
          </svg>
          <span class="text-[10px] text-[#999999] font-body">求签</span>
        </a>

        <!-- 诗词 Tab -->
        <a href="poems.html" class="flex flex-col items-center gap-0.5 py-1 px-3" data-dom-id="nav-poems">
          <svg class="w-5 h-5 text-[#999999]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          </svg>
          <span class="text-[10px] text-[#999999] font-body">诗词</span>
        </a>

        <!-- 选集 Tab -->
        <a href="xuanji.html" class="flex flex-col items-center gap-0.5 py-1 px-3" data-dom-id="nav-xuanji">
          <svg class="w-5 h-5 text-[#999999]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
          </svg>
          <span class="text-[10px] text-[#999999] font-body">选集</span>
        </a>

        <!-- 问答 Tab (Active) -->
        <a href="ai-chat.html" class="flex flex-col items-center gap-0.5 py-1 px-3" data-dom-id="nav-ai">
          <svg class="w-5 h-5 text-[#8B0000]" fill="currentColor" stroke="currentColor" stroke-width="0" viewBox="0 0 24 24">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12zM7 9h2v2H7zm4 0h2v2h-2zm4 0h2v2h-2z" />
          </svg>
          <span class="text-[10px] text-[#8B0000] font-body font-semibold">问答</span>
        </a>

        <!-- 设置 Tab -->
        <a href="settings.html" class="flex flex-col items-center gap-0.5 py-1 px-3" data-dom-id="nav-settings">
          <svg class="w-5 h-5 text-[#999999]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <span class="text-[10px] text-[#999999] font-body">设置</span>
        </a>
      </nav>
    </div>

  </div>

    <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: var(--color-bg);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    /* Hide scrollbar but allow scrolling */
    .scrollbar-hidden::-webkit-scrollbar { display: none; }
    .scrollbar-hidden { -ms-overflow-style: none; scrollbar-width: none; }

    /* Quick tag scroll container */
    .tags-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .tags-scroll::-webkit-scrollbar { display: none; }

    /* AI response gold left border */
    .ai-card {
      border-left: 3px solid var(--color-gold);
    }
  </style>
</body>
