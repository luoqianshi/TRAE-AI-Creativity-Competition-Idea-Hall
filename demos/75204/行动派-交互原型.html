<script>
(function() {
  // Data
  let habits = [
    { id: 1, name: '晨跑5公里', icon: '🏃', freq: '每天', time: '07:00', streak: 12, checked: false, color: '#E8F5E9', checkins: 45, notes: [] },
    { id: 2, name: '吉他练习', icon: '🎸', freq: '每天', time: '20:00', streak: 5, checked: false, color: '#FFF3E0', checkins: 28, notes: [] },
    { id: 3, name: '阅读30分钟', icon: '📖', freq: '每天', time: '22:00', streak: 8, checked: true, color: '#E3F2FD', checkins: 36, notes: [{date:'今天',text:'读完了《原子习惯》第三章，收获很大'}] },
  ];

  let badges = [
    { id: 1, name: '初次行动', desc: '完成首次打卡', emoji: '🚀', unlocked: true },
    { id: 2, name: '坚持3天', desc: '连续打卡3天', emoji: '🔥', unlocked: true },
    { id: 3, name: '坚持7天', desc: '连续打卡7天', emoji: '⭐', unlocked: true },
    { id: 4, name: '坚持21天', desc: '连续打卡21天', emoji: '💎', unlocked: false },
    { id: 5, name: '坚持100天', desc: '连续打卡100天', emoji: '👑', unlocked: false },
    { id: 6, name: '多面手', desc: '同时坚持3个事项', emoji: '🎯', unlocked: true },
    { id: 7, name: '早起鸟', desc: '早上7点前打卡', emoji: '🌅', unlocked: true },
    { id: 8, name: '夜行者', desc: '晚上10点后打卡', emoji: '🌙', unlocked: false },
    { id: 9, name: '心得达人', desc: '记录10条心得', emoji: '✍️', unlocked: false },
  ];

  let currentCheckinHabit = null;

  // Helpers
  function $(s) { return document.querySelector(s); }
  function $$(s) { return document.querySelectorAll(s); }

  function showToast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  function updateDate() {
    const now = new Date();
    const opts = { month: 'long', day: 'numeric', weekday: 'short' };
    $('#currentDate').textContent = now.toLocaleDateString('zh-CN', opts);
  }

  function updateHeader() {
    let total = habits.reduce((s, h) => s + h.checkins, 0);
    let today = habits.filter(h => h.checked).length;
    let maxStreak = Math.max(...habits.map(h => h.streak), 0);
    $('#totalCheckins').textContent = total;
    $('#todayCheckins').textContent = today;
    $('#streakDays').textContent = maxStreak;
  }

  function renderHabits() {
    const list = $('#habitList');
    if (habits.length === 0) {
      list.innerHTML = '<div style="text-align:center;color:var(--muted);padding:32px 0;">还没有事项，点击右下角 + 创建一个吧</div>';
      return;
    }
    list.innerHTML = habits.map(h => `
      <div class="habit-item">
        <div class="habit-icon" style="background:${h.color}">${h.icon}</div>
        <div class="habit-info">
          <div class="habit-name">${h.name}</div>
          <div class="habit-meta">${h.freq} · ${h.time}提醒</div>
          ${h.streak > 0 ? `<div class="habit-streak">连续${h.streak}天</div>` : ''}
          ${h.notes.length > 0 ? `<div class="habit-note-preview">最新：${h.notes[h.notes.length-1].text}</div>` : ''}
        </div>
        <button class="check-btn ${h.checked ? 'checked' : ''}" data-id="${h.id}"></button>
      </div>
    `).join('');

    $$('.check-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const id = parseInt(this.dataset.id);
        const habit = habits.find(h => h.id === id);
        if (!habit || habit.checked) return;
        currentCheckinHabit = habit;
        $('#noteModal').classList.add('active');
      });
    });
  }

  function renderNotes() {
    const container = $('#recentNotes');
    const allNotes = [];
    habits.forEach(h => {
      h.notes.forEach(n => allNotes.push({...n, habitName: h.name, icon: h.icon}));
    });
    allNotes.sort((a,b) => b.ts - a.ts);
    if (allNotes.length === 0) {
      container.innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px 0;font-size:14px;">暂无心得，快去打卡记录吧~</div>';
      return;
    }
    container.innerHTML = allNotes.slice(0, 3).map(n => `
      <div class="habit-item" style="border-bottom:1px solid var(--rule);padding:12px 0;">
        <div class="habit-icon" style="background:var(--bg);width:40px;height:40px;font-size:20px;">${n.icon}</div>
        <div class="habit-info">
          <div class="habit-name" style="font-size:14px;">${n.habitName}</div>
          <div style="font-size:13px;color:var(--muted);margin-top:4px;">${n.text}</div>
        </div>
      </div>
    `).join('');
  }

  function renderReport() {
    $('#weekTotal').textContent = habits.reduce((s,h) => s + h.checkins, 0);
    $('#weekStreak').textContent = Math.max(...habits.map(h => h.streak), 0);

    // Week chart
    const days = ['一','二','三','四','五','六','日'];
    const values = [2, 3, 1, 3, 2, 3, habits.filter(h=>h.checked).length];
    const maxV = Math.max(...values, 1);
    $('#weekChart').innerHTML = days.map((d,i) => `
      <div class="bar-item">
        <div class="bar-fill" style="height:${(values[i]/maxV*100)}%"></div>
        <div class="bar-label">${d}</div>
      </div>
    `).join('');

    // Distribution
    const dist = $('#habitDistribution');
    dist.innerHTML = habits.map(h => `
      <div style="display:flex;align-items:center;margin-bottom:10px;">
        <div style="width:28px;text-align:center;margin-right:8px;font-size:20px;">${h.icon}</div>
        <div style="flex:1;">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
            <span style="font-size:14px;font-weight:600;">${h.name}</span>
            <span style="font-size:13px;color:var(--muted);">${h.checkins}次</span>
          </div>
          <div style="height:8px;background:var(--bg);border-radius:4px;overflow:hidden;">
            <div style="height:100%;width:${Math.min(h.checkins/50*100,100)}%;background:var(--primary);border-radius:4px;transition:width 0.6s;"></div>
          </div>
        </div>
      </div>
    `).join('');
  }

  function renderBadges() {
    $('#badgeGrid').innerHTML = badges.map(b => `
      <div class="badge-item ${b.unlocked ? '' : 'locked'}">
        <div class="badge-emoji">${b.emoji}</div>
        <div class="badge-name">${b.name}</div>
        <div class="badge-desc">${b.desc}</div>
      </div>
    `).join('');
  }

  function renderProfile() {
    $('#joinDays').textContent = '12';
    $('#profileStats').innerHTML = habits.map(h => `
      <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--rule);">
        <span style="font-size:14px;">${h.icon} ${h.name}</span>
        <span style="font-size:14px;color:var(--muted);">累计 ${h.checkins} 次 · 连续 ${h.streak} 天</span>
      </div>
    `).join('');
  }

  // Navigation
  $$('.nav-item').forEach(item => {
    item.addEventListener('click', function() {
      const page = this.dataset.page;
      $$('.nav-item').forEach(n => n.classList.remove('active'));
      $$('.page').forEach(p => p.classList.remove('active'));
      this.classList.add('active');
      $('#page-' + page).classList.add('active');
      if (page === 'report') renderReport();
      if (page === 'achievements') renderBadges();
      if (page === 'profile') renderProfile();
    });
  });

  // FAB
  $('#fabAdd').addEventListener('click', () => {
    $('#addModal').classList.add('active');
  });

  // Close modals
  $('#closeAdd').addEventListener('click', () => $('#addModal').classList.remove('active'));
  $('#closeNote').addEventListener('click', () => $('#noteModal').classList.remove('active'));

  // Icon picker
  $$('.icon-option').forEach(opt => {
    opt.addEventListener('click', function() {
      $$('.icon-option').forEach(o => o.classList.remove('selected'));
      this.classList.add('selected');
    });
  });

  // Save habit
  $('#saveHabit').addEventListener('click', () => {
    const name = $('#habitName').value.trim();
    if (!name) { showToast('请输入事项名称'); return; }
    const icon = $('.icon-option.selected').dataset.icon;
    const freq = $('#habitFreq').value;
    const time = $('#habitTime').value;
    const colors = ['#E8F5E9','#FFF3E0','#E3F2FD','#F3E5F5','#E0F2F1','#FFF8E1'];
    habits.push({
      id: Date.now(),
      name, icon, freq, time,
      streak: 0, checked: false,
      color: colors[habits.length % colors.length],
      checkins: 0, notes: []
    });
    $('#habitName').value = '';
    $('#addModal').classList.remove('active');
    renderHabits();
    updateHeader();
    showToast('创建成功！');
  });

  // Save note & checkin
  $('#saveNote').addEventListener('click', () => {
    const note = $('#checkinNote').value.trim();
    if (currentCheckinHabit) {
      currentCheckinHabit.checked = true;
      currentCheckinHabit.checkins++;
      currentCheckinHabit.streak++;
      if (note) {
        currentCheckinHabit.notes.push({ date: '今天', text: note, ts: Date.now() });
      }
      $('#checkinNote').value = '';
      $('#noteModal').classList.remove('active');
      renderHabits();
      renderNotes();
      updateHeader();
      showToast('打卡成功！连续' + currentCheckinHabit.streak + '天');
      currentCheckinHabit = null;
    }
  });

  // Init
  updateDate();
  updateHeader();
  renderHabits();
  renderNotes();
})();
</script>
</body>
</html>
