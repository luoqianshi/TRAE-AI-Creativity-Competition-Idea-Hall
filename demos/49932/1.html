<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>邻帮邻 · 时间银行原型</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f2f2f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .phone {
      width: 375px; height: 700px; background: white;
      border-radius: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      overflow: hidden; display: flex; flex-direction: column;
      position: relative;
    }
    .status-bar {
      padding: 12px 20px 6px; background: #fff; display: flex;
      justify-content: space-between; font-size: 14px; color: #333;
      border-bottom: 1px solid #e5e5ea;
    }
    .header {
      padding: 16px 20px; background: #ffffff;
      border-bottom: 1px solid #e5e5ea;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header h1 { font-size: 22px; font-weight: 600; color: #007AFF; }
    .header .time-coins {
      background: #FFD60A; color: #1c1c1e; padding: 6px 12px;
      border-radius: 20px; font-size: 14px; font-weight: 600;
    }
    .task-list {
      flex: 1; overflow-y: auto; padding: 12px 16px;
      background: #f2f2f7;
    }
    .card {
      background: white; border-radius: 16px; padding: 16px;
      margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .card .title { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
    .card .desc { font-size: 14px; color: #3a3a3c; margin-bottom: 12px; }
    .card .meta {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 13px; color: #8e8e93;
    }
    .card .time-badge {
      background: #e9f0ff; color: #007AFF; padding: 4px 10px;
      border-radius: 12px; font-weight: 500;
    }
    .help-btn {
      background: #34C759; border: none; color: white;
      padding: 8px 16px; border-radius: 20px; font-size: 14px;
      font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .help-btn.taken {
      background: #8e8e93; cursor: default;
    }
    .fab {
      position: absolute; bottom: 24px; right: 24px;
      width: 56px; height: 56px; background: #007AFF;
      border-radius: 28px; color: white; font-size: 28px;
      border: none; box-shadow: 0 4px 12px rgba(0,122,255,0.4);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .bottom-nav {
      padding: 8px 16px; background: #fff; border-top: 1px solid #e5e5ea;
      display: flex; justify-content: space-around; font-size: 12px; color: #8e8e93;
    }
    .nav-item.active { color: #007AFF; font-weight: 600; }
  </style>
</head>
<body>
<div class="phone">
  <div class="status-bar"><span>9:41</span><span>📶 🔋 91%</span></div>
  <div class="header">
    <h1>🏡 邻帮邻</h1>
    <div class="time-coins">⏳ 12 时间币</div>
  </div>
  <div class="task-list" id="taskContainer">
    <!-- 动态任务卡片 -->
  </div>
  <button class="fab" id="publishBtn" title="发布求助">+</button>
  <div class="bottom-nav">
    <span class="nav-item active">🏠 首页</span>
    <span class="nav-item">🔍 发现</span>
    <span class="nav-item">💬 消息</span>
    <span class="nav-item">👤 我的</span>
  </div>
</div>

<script>
  // 由 TRAE Work (Auto 模式) 生成的创意原型脚本
  (function() {
    const tasks = [
      {
        title: "帮忙取快递并送上门",
        desc: "菜鸟驿站在小区南门，有两件小包裹，家里有人但腰不好不便下楼。",
        time: 0.5,
        taken: false
      },
      {
        title: "陪老人去医院复查",
        desc: "明天上午9点，需搀扶并协助挂号，大概2小时。",
        time: 2,
        taken: false
      },
      {
        title: "教我用手机挂号",
        desc: "我73岁，想学微信预约挂号，可提供一顿家常午饭作为交换。",
        time: 1,
        taken: false
      },
      {
        title: "临时照看3岁孩子1小时",
        desc: "妈妈需要去楼下办事，只需在家陪伴玩耍，有监控。",
        time: 1,
        taken: true
      }
    ];

    const container = document.getElementById('taskContainer');

    function renderTasks() {
      container.innerHTML = tasks.map((task, index) => {
        const status = task.taken ? '已被接单' : '我来帮忙';
        const disabledClass = task.taken ? 'taken' : '';
        return `
          <div class="card">
            <div class="title">${task.title}</div>
            <div class="desc">${task.desc}</div>
            <div class="meta">
              <span class="time-badge">⏱️ ${task.time}小时</span>
              <button class="help-btn ${disabledClass}" data-index="${index}" ${task.taken ? 'disabled' : ''}>${status}</button>
            </div>
          </div>
        `;
      }).join('');
    }

    container.addEventListener('click', (e) => {
      if (e.target.classList.contains('help-btn') && !e.target.classList.contains('taken')) {
        const index = e.target.getAttribute('data-index');
        if (index !== null && tasks[index]) {
          tasks[index].taken = true;
          renderTasks();
          alert('🙌 已接单！时间币将在服务确认后增加。');
        }
      }
    });

    document.getElementById('publishBtn').addEventListener('click', () => {
      alert('📝 发布新任务（原型演示）\n标题：急需帮忙搬家具\n预计耗时：1.5小时');
    });

    renderTasks();
  })();
</script>
</body>
</html>
