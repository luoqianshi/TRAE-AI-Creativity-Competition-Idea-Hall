<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>打包快照</title>
    <style>
        :root {
            --bg-primary: #f8f9fa;
            --bg-card: #ffffff;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --accent: #4a6fa5;
            --accent-light: #6a8bc7;
            --border: #e9ecef;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
            --radius: 12px;
            --transition: all 0.2s ease;
        }

        .dark-theme {
            --bg-primary: #1e293b;
            --bg-card: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #60a5fa;
            --accent-light: #93c5fd;
            --border: #475569;
            --success: #4ade80;
            --warning: #f59e0b;
            --danger: #f87171;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 16px;
            transition: var(--transition);
        }

        .container {
            max-width: 1024px;
            margin: 0 auto;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 24px;
            padding: 12px 0;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--accent);
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Theme Toggle */
        .theme-toggle {
            position: absolute;
            top: 16px;
            right: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .theme-toggle:hover {
            transform: scale(1.05);
        }

        .theme-toggle svg {
            width: 20px;
            height: 20px;
            fill: var(--text-primary);
        }

        /* Controls */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            justify-content: center;
        }

        .tab-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-primary);
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .filter-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .filter-tag {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-primary);
        }

        .filter-tag:hover, .filter-tag.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Items List */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .item-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
            position: relative;
        }

        .item-card:hover {
            transform: translateY(-2px);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .item-title {
            font-weight: 600;
            font-size: 1.05rem;
        }

        .item-room {
            background: rgba(74, 111, 165, 0.1);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .item-desc {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 12px;
            min-height: 48px;
        }

        .item-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .meta-tag {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .tag-fragile { background: rgba(255, 193, 7, 0.15); color: var(--warning); }
        .tag-valuable { background: rgba(40, 167, 69, 0.15); color: var(--success); }
        .tag-discard { background: rgba(220, 53, 69, 0.15); color: var(--danger); }
        .tag-packed { background: rgba(74, 111, 165, 0.15); color: var(--accent); }

        .item-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 16px;
        }

        .check-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: #e2e8f0;
            color: #64748b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: var(--transition);
        }

        .check-btn.checked {
            background: var(--success);
            color: white;
        }

        .check-btn:hover:not(.checked) {
            background: #cbd5e1;
        }

        /* Voice Button */
        .voice-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 8px;
        }

        .voice-btn:hover:not(:disabled) {
            background: var(--accent-light);
        }

        .voice-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 24px 0;
            color: var(--text-secondary);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
            margin-top: 24px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: center;
            }
            .filter-tags {
                justify-content: center;
            }
            h1 {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .theme-toggle {
                top: 12px;
                right: 12px;
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="theme-toggle" id="themeToggle">
        <svg viewBox="0 0 24 24">
            <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.162a.75.75 0 00-1.042-.132l-.853.853-.853-.853a.75.75 0 10-1.042 1.042l.853.853.853-.853a.75.75 0 001.042.132l.853-.853.853.853a.75.75 0 101.042-1.042l-.853-.853-.853.853zM21.75 12a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z"/>
        </svg>
    </div>

    <div class="container">
        <header>
            <h1>打包快照</h1>
            <p class="subtitle">搬家前30分钟搞定打包清单｜语音速录 · 房间分拣 · 一键勾选</p>
        </header>

        <main>
            <!-- Controls -->
            <div class="controls">
                <button class="tab-btn active" data-room="all">全部</button>
                <button class="tab-btn" data-room="living">客厅</button>
                <button class="tab-btn" data-room="bedroom">卧室</button>
                <button class="tab-btn" data-room="kitchen">厨房</button>
            </div>

            <div class="filter-tags">
                <button class="filter-tag active" data-type="all">全部</button>
                <button class="filter-tag" data-type="fragile">易碎</button>
                <button class="filter-tag" data-type="valuable">贵重</button>
                <button class="filter-tag" data-type="discard">待丢弃</button>
                <button class="filter-tag" data-type="packed">已装箱</button>
            </div>

            <!-- Voice Input -->
            <div style="text-align:center; margin:24px 0;">
                <button class="voice-btn" id="voiceBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M12 14C14.21 14 16 12.21 16 10V6C16 3.79 14.21 2 12 2C9.79 2 8 3.79 8 6V10C8 12.21 9.79 14 12 14Z"></path>
                        <path d="M12 14V22M8 18H16"></path>
                    </svg>
                    语音速录（点击模拟）
                </button>
            </div>

            <!-- Items Grid -->
            <div class="items-grid" id="itemsGrid">
                <!-- Initial items -->
                <div class="item-card" data-room="living" data-type="fragile">
                    <div class="item-header">
                        <div class="item-title">陶瓷马克杯（3只）</div>
                        <div class="item-room">客厅</div>
                    </div>
                    <div class="item-desc">白色带蓝边，放在电视柜左上格，需用气泡膜单独包裹</div>
                    <div class="item-meta">
                        <span class="meta-tag tag-fragile">易碎</span>
                    </div>
                    <div class="item-actions">
                        <button class="check-btn">✓</button>
                        <span>09:15</span>
                    </div>
                </div>

                <div class="item-card" data-room="bedroom" data-type="valuable">
                    <div class="item-header">
                        <div class="item-title">护照 & 签证复印件</div>
                        <div class="item-room">卧室</div>
                    </div>
                    <div class="item-desc">红色硬壳文件夹，夹在床头柜抽屉第二层</div>
                    <div class="item-meta">
                        <span class="meta-tag tag-valuable">贵重</span>
                    </div>
                    <div class="item-actions">
                        <button class="check-btn">✓</button>
                        <span>09:18</span>
                    </div>
                </div>

                <div class="item-card" data-room="kitchen" data-type="discard">
                    <div class="item-header">
                        <div class="item-title">过期酱油（2瓶）</div>
                        <div class="item-room">厨房</div>
                    </div>
                    <div class="item-desc">保质期至2023.10，绿色玻璃瓶，冰箱门上层</div>
                    <div class="item-meta">
                        <span class="meta-tag tag-discard">待丢弃</span>
                    </div>
                    <div class="item-actions">
                        <button class="check-btn">✓</button>
                        <span>09:20</span>
                    </div>
                </div>

                <div class="item-card" data-room="living" data-type="packed">
                    <div class="item-header">
                        <div class="item-title">蓝牙音箱（JBL Flip 5）</div>
                        <div class="item-room">客厅</div>
                    </div>
                    <div class="item-desc">黑色，充电线已缠好放原盒内，已装进蓝色收纳箱</div>
                    <div class="item-meta">
                        <span class="meta-tag tag-packed">已装箱</span>
                    </div>
                    <div class="item-actions">
                        <button class="check-btn checked">✓</button>
                        <span>09:05</span>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>打包快照 · 轻量清单工具｜双击勾选即完成，搬家更安心</p>
        </footer>
    </div>

    <script>
        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            body.classList.add('dark-theme');
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-theme');
            const isDark = body.classList.contains('dark-theme');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        // Tab filtering
        const tabBtns = document.querySelectorAll('.tab-btn');
        const filterTags = document.querySelectorAll('.filter-tag');
        const items = document.querySelectorAll('.item-card');

        function updateFilters() {
            const activeRoom = Array.from(tabBtns).find(btn => btn.classList.contains('active'))?.dataset.room || 'all';
            const activeType = Array.from(filterTags).find(btn => btn.classList.contains('active'))?.dataset.type || 'all';

            items.forEach(item => {
                const itemRoom = item.dataset.room;
                const itemType = item.dataset.type;

                const roomMatch = activeRoom === 'all' || itemRoom === activeRoom;
                const typeMatch = activeType === 'all' || itemType === activeType;

                item.style.display = roomMatch && typeMatch ? 'block' : 'none';
            });
        }

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                updateFilters();
            });
        });

        filterTags.forEach(tag => {
            tag.addEventListener('click', () => {
                filterTags.forEach(t => t.classList.remove('active'));
                tag.classList.add('active');
                updateFilters();
            });
        });

        // Check buttons
        document.querySelectorAll('.check-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                btn.classList.toggle('checked');
                if (btn.classList.contains('checked')) {
                    btn.textContent = '✓';
                } else {
                    btn.textContent = '✓';
                }
            });
        });

        // Voice button simulation
        const voiceBtn = document.getElementById('voiceBtn');
        const itemsGrid = document.getElementById('itemsGrid');

        voiceBtn.addEventListener('click', () => {
            voiceBtn.disabled = true;
            voiceBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10" stroke-width="1.5"/></svg> 正在识别...';

            // Simulate audio playback with Web Audio API (no external file)
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 600;
                gain.gain.value = 0.1;
                osc.start();
                setTimeout(() => {
                    osc.stop();
                }, 3000);
            } catch (e) {
                // Fallback if AudioContext fails
            }

            // Add simulated item after delay
            setTimeout(() => {
                const now = new Date();
                const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
                
                const newItem = document.createElement('div');
                newItem.className = 'item-card';
                newItem.dataset.room = 'living';
                newItem.dataset.type = 'fragile';
                newItem.innerHTML = `
                    <div class="item-header">
                        <div class="item-title">这个陶瓷杯要包好放箱子最上面</div>
                        <div class="item-room">客厅</div>
                    </div>
                    <div class="item-desc">语音录入 · ${timeStr}</div>
                    <div class="item-meta">
                        <span class="meta-tag tag-fragile">易碎</span>
                    </div>
                    <div class="item-actions">
                        <button class="check-btn">✓</button>
                        <span>${timeStr}</span>
                    </div>
                `;
                
                itemsGrid.prepend(newItem);

                // Rebind check event
                newItem.querySelector('.check-btn').addEventListener('click', () => {
                    const btn = newItem.querySelector('.check-btn');
                    btn.classList.toggle('checked');
                    btn.textContent = '✓';
                });

                voiceBtn.disabled = false;
                voiceBtn.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M12 14C14.21 14 16 12.21 16 10V6C16 3.79 14.21 2 12 2C9.79 2 8 3.79 8 6V10C8 12.21 9.79 14 12 14Z"></path>
                        <path d="M12 14V22M8 18H16"></path>
                    </svg>
                    语音速录（点击模拟）
                `;
            }, 3000);
        });
    </script>
</body>
</html>
