<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵感调色盘 - Color Palette Generator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  min-height: 100vh;
  background: #0f0f1a;
  color: #fff;
}
.container { max-width: 960px; margin: 0 auto; padding: 20px; }

header { text-align: center; padding: 30px 20px 24px; }
header h1 {
  font-size: 2.4rem;
  background: linear-gradient(135deg, #f093fb, #f5576c, #4facfe, #43e97b);
  background-size: 300% 300%; animation: gradientShift 6s ease infinite;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
@keyframes gradientShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
header p { opacity: 0.55; font-size: 1rem; margin-top: 8px; }

/* 情绪选择 */
.mood-bar {
  display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 28px;
}
.mood-chip {
  padding: 10px 22px; border-radius: 25px; border: 2px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.04); cursor: pointer; transition: all 0.3s;
  font-family: inherit; font-size: 0.92rem; color: rgba(255,255,255,0.75); display: flex; align-items: center; gap: 6px;
}
.mood-chip:hover { border-color: rgba(255,255,255,0.3); transform: translateY(-2px); }
.mood-chip.active { border-color: #4facfe; background: rgba(79,172,254,0.12); color: #fff; box-shadow: 0 4px 20px rgba(79,172,254,0.2); }
.mood-emoji { font-size: 1.15rem; }

/* 配色展示 */
.palette-showcase {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 28px;
}
.color-card {
  aspect-ratio: 1; border-radius: 18px; position: relative; cursor: pointer;
  transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); overflow: hidden;
  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 16px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.2);
}
.color-card:hover {
  transform: translateY(-8px) scale(1.04);
  box-shadow: 0 16px 40px var(--card-glow, rgba(0,0,0,0.3));
  z-index: 5;
}
.color-card::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.4));
}
.color-hex {
  position: relative; z-index: 1; font-size: 0.85rem; font-weight: 600;
  letter-spacing: 0.5px; text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  font-family: 'SF Mono', 'Consolas', monospace;
}
.color-copy-toast {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0);
  background: rgba(255,255,255,0.95); color: #333; padding: 8px 18px;
  border-radius: 10px; font-size: 0.88rem; font-weight: 500; z-index: 10;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  white-space: nowrap;
}
.color-card.copied .color-copy-toast { transform: translate(-50%,-50%) scale(1); }

/* 色彩信息面板 */
.info-panel {
  background: rgba(255,255,255,0.04); border-radius: 20px; padding: 24px;
  border: 1px solid rgba(255,255,255,0.07); margin-bottom: 24px;
}
.info-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.info-title { font-size: 1.1rem; }
.palette-name { font-size: 1.05rem; color: #4facfe; font-weight: 600; }

.action-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.action-btn {
  padding: 9px 20px; border-radius: 11px; border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.06); color: #fff; cursor: pointer;
  font-family: inherit; font-size: 0.88rem; transition: all 0.3s; display: flex; align-items: center; gap: 6px;
}
.action-btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.3); }
.action-btn.primary { background: linear-gradient(135deg, #667eea, #764ba2); border: none; }
.action-btn.primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(102,126,234,0.35); }

/* 调色板格式 */
.format-section { margin-top: 16px; }
.format-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.format-tab {
  padding: 5px 14px; border-radius: 8px; border: none; background: rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.55); cursor: pointer; font-family: inherit; font-size: 0.82rem;
  transition: all 0.3s;
}
.format-tab.active { background: rgba(79,172,254,0.2); color: #4facfe; }
.code-output {
  background: rgba(0,0,0,0.3); border-radius: 12px; padding: 14px 18px;
  font-family: 'SF Mono', Consolas, monospace; font-size: 0.85rem;
  line-height: 1.8; overflow-x: auto; color: #a0e8af; white-space: pre;
}

/* 预览区域 */
.preview-section {
  background: rgba(255,255,255,0.04); border-radius: 20px; padding: 24px;
  border: 1px solid rgba(255,255,255,0.07); margin-bottom: 24px;
}
.preview-ui {
  border-radius: 14px; padding: 32px; transition: all 0.5s ease;
  box-shadow: 0 4px 30px rgba(0,0,0,0.15);
}
.preview-nav {
  display: flex; align-items: center; gap: 16px; margin-bottom: 24px;
  padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.1);
}
.preview-logo {
  width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-weight: bold; font-size: 1.1rem;
}
.preview-links { display: flex; gap: 20px; flex: 1; font-size: 0.88rem; opacity: 0.7; }
.preview-hero {
  border-radius: 12px; padding: 32px; margin-bottom: 20px; text-align: center;
}
.preview-hero h2 { font-size: 1.6rem; margin-bottom: 10px; }
.preview-hero p { font-size: 0.92rem; opacity: 0.75; line-height: 1.6; }
.preview-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.preview-mini-card {
  border-radius: 12px; padding: 20px 16px; text-align: center;
}
.preview-mini-card .pc-icon { font-size: 1.8rem; margin-bottom: 8px; }
.preview-mini-card .pc-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; }
.preview-mini-card .pc-desc { font-size: 0.78rem; opacity: 0.6; }
.preview-cta {
  display: inline-block; margin-top: 20px; padding: 12px 32px; border-radius: 10px;
  font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: all 0.3s;
}

/* 收藏 */
.favorites-section {
  background: rgba(255,255,255,0.04); border-radius: 20px; padding: 24px;
  border: 1px solid rgba(255,255,255,0.07);
}
.fav-grid { display: flex; gap: 12px; flex-wrap: wrap; }
.fav-item {
  display: flex; border-radius: 12px; overflow: hidden; cursor: pointer;
  transition: all 0.3s; width: 200px; height: 44px; position: relative;
}
.fav-item:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
.fav-swatch { flex: 1; }
.fav-name {
  position: absolute; bottom: 0; left: 0; right: 0; padding: 3px 8px;
  background: rgba(0,0,0,0.6); font-size: 0.72rem; text-align: center;
  backdrop-filter: blur(4px);
}
.empty-fav { text-align: center; padding: 24px; opacity: 0.4; font-size: 0.9rem; }

/* 随机按钮 */
.generate-row { text-align: center; margin-bottom: 24px; }
.gen-btn {
  padding: 14px 42px; border: none; border-radius: 16px; font-size: 1.05rem;
  font-weight: 600; cursor: pointer; font-family: inherit; color: #fff;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  background-size: 200% 200%; animation: genGradient 4s ease infinite;
  transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px;
}
@keyframes genGradient {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
.gen-btn:hover { transform: scale(1.06); box-shadow: 0 8px 30px rgba(102,126,234,0.45); }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>灵感调色盘</h1>
    <p>输入情绪关键词，AI 为你生成专属配色方案 🎨</p>
  </header>

  <!-- 情绪/风格选择 -->
  <div class="mood-bar" id="moodBar"></div>

  <!-- 生成按钮 -->
  <div class="generate-row">
    <button class="gen-btn" onclick="generatePalette()">
      <span style="font-size:1.3rem">✨</span> 生成新配色
    </button>
  </div>

  <!-- 配色展示 -->
  <div class="palette-showcase" id="paletteShowcase"></div>

  <!-- 色彩信息 + 格式导出 -->
  <div class="info-panel">
    <div class="info-header">
      <div><span class="info-title">当前配色：</span><span class="palette-name" id="paletteName">-</span></div>
      <div class="action-btns">
        <button class="action-btn primary" onclick="copyAllColors()">复制全部颜色</button>
        <button class="action-btn" onclick="favoritePalette()">收藏此配色</button>
        <button class="action-btn" onclick="exportImage()">导出图片</button>
      </div>
    </div>

    <div class="format-section">
      <div class="format-tabs" id="formatTabs">
        <button class="format-tab active" data-format="css" onclick="switchFormat('css')">CSS Variables</button>
        <button class="format-tab" data-format="tailwind" onclick="switchFormat('tailwind')">Tailwind</button>
        <button class="format-tab" data-format="json" onclick="switchFormat('json')">JSON</button>
        <button class="format-tab" data-format="swiftui" onclick="switchFormat('swiftui')">SwiftUI</button>
      </div>
      <div class="code-output" id="codeOutput"></div>
    </div>
  </div>

  <!-- 实时UI预览 -->
  <div class="preview-section">
    <div class="info-header"><span class="info-title">UI 组件预览</span></div>
    <div class="preview-ui" id="previewUi">
      <nav class="preview-nav">
        <div class="preview-logo" id="prevLogo">P</div>
        <div class="preview-links" id="prevLinks">
          <span>首页</span><span>产品</span><span>关于</span>
        </div>
        <button id="prevBtn" style="padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-size:0.85rem;">开始使用</button>
      </nav>
      <div class="preview-hero" id="prevHero">
        <h2 id="prevTitle">创意无限可能</h2>
        <p id="prevDesc">用色彩讲述你的故事，让设计更有温度。每一个配色方案都经过精心调配，为你的项目注入灵感。</p>
      </div>
      <div class="preview-cards" id="prevCards">
        <div class="preview-mini-card" id="prevCard1">
          <div class="pc-icon">🎨</div>
          <div class="pc-title">智能配色</div>
          <div class="pc-desc">基于情绪的智能生成</div>
        </div>
        <div class="preview-mini-card" id="prevCard2">
          <div class="pc-icon">⚡</div>
          <div class="pc-title">一键导出</div>
          <div class="pc-desc">支持多种代码格式</div>
        </div>
        <div class="preview-mini-card" id="prevCard3">
          <div class="pc-icon">💾</div>
          <div class="pc-title">收藏管理</div>
          <div class="pc-desc">保存你的灵感配色</div>
        </div>
      </div>
      <div style="text-align:center;">
        <div class="preview-cta" id="prevCta">立即体验 →</div>
      </div>
    </div>
  </div>

  <!-- 收藏夹 -->
  <div class="favorites-section">
    <div class="info-header">
      <span class="info-title">我的收藏</span>
      <span style="font-size:0.82rem;opacity:0.4;" id="favCount">(0 个)</span>
    </div>
    <div class="fav-grid" id="favGrid">
      <div class="empty-fav">还没有收藏，点击上方"收藏此配色"吧 ✨</div>
    </div>
  </div>
</div>

<script>
// ===== 情绪配色库 =====
const MOOD_PALETTES = [
  {
    name: '日落黄昏', mood: 'warm',
    colors: ['#FF6B6B', '#FFA06B', '#FFD93D', '#F4A261', '#E76F51'],
    bg: '#FFF8F0', text: '#2D1810'
  },
  {
    name: '深海幽蓝', mood: 'calm',
    colors: ['#0077B6', '#00B4D8', '#90E0EF', '#CAF0F8', '#03045E'],
    bg: '#F0F8FF', text: '#03045E'
  },
  {
    name: '森林秘境', mood: 'nature',
    colors: ['#2D6A4F', '#40916C', '#52B788', '#74C69D', '#95D5B2'],
    bg: '#F0FFF4', text: '#1B4332'
  },
  {
    name: '樱花物语', mood: 'soft',
    colors: ['#FFB5C8', '#FF8FAB', '#FB6F92', '#E05780', '#C9184A'],
    bg: '#FFF0F5', text: '#5C0A2E'
  },
  {
    name: '赛博朋克', mood: 'tech',
    colors: ['#7209B7', '#B5179E', '#F72585', '#4CC9F0', '#4361EE'],
    bg: '#0F0F23', text: '#E0E0FF'
  },
  {
    name: '薄荷清晨', mood: 'fresh',
    colors: ['#00B894', '#00CEC9', '#81ECEC', '#55EFC4', '#DFE6E9'],
    bg: '#F0FFFF', text: '#006266'
  },
  {
    name: '复古胶片', mood: 'vintage',
    colors: ['#E17055', '#DC7633', '#F39C12', '#F1C40F', '#E67E22'],
    bg: '#FEF9EF', text: '#5D4037'
  },
  {
    name: '极光之夜', mood: 'mystery',
    colors: ['#6C63FF', '#4834D4', '#30336B', '#130F40', '#686DE0'],
    bg: '#F0F0FF', text: '#1A1053'
  },
  {
    name: '焦糖拿铁', mood: 'cozy',
    colors: ['#6B4423', '#8B5A2B', '#A0522D', '#CD853F', '#DEB887'],
    bg: '#FFF8EE', text: '#3E2723'
  },
  {
    name: '霓虹都市', mood: 'energy',
    colors: ['#FF0080', '#FF8C00', '#40E0D0', '#ADFF2F', '#FF1493'],
    bg: '#0A0A0A', text: '#FFFFFF'
  },
];

const MOODS = [
  { key: 'warm', emoji: '🌅', label: '温暖' },
  { key: 'calm', emoji: '🌊', label: '宁静' },
  { key: 'nature', emoji: '🌿', label: '自然' },
  { key: 'soft', emoji: '🌸', label: '柔和' },
  { key: 'tech', emoji: '🤖', label: '科技' },
  { key: 'fresh', emoji: '🍃', label: '清新' },
  { key: 'vintage', emoji: '📷', label: '复古' },
  { key: 'mystery', emoji: '🔮', label: '神秘' },
  { key: 'cozy', emoji: '☕', label: '舒适' },
  { key: 'energy', emoji: '⚡', label: '活力' },
];

let currentPalette = null;
let currentFormat = 'css';
let favorites = JSON.parse(localStorage.getItem('colorFavorites') || '[]');

function init() {
  renderMoods();
  generatePalette();
  renderFavorites();
}

function renderMoods() {
  document.getElementById('moodBar').innerHTML = MOODS.map(m => `
    <button class="mood-chip" data-mood="${m.key}" onclick="setMood('${m.key}')">
      <span class="mood-emoji">${m.emoji}</span>${m.label}
    </button>
  `).join('');
}

function setMood(moodKey) {
  document.querySelectorAll('.mood-chip').forEach(c => c.classList.remove('active'));
  document.querySelector(`.mood-chip[data-mood="${moodKey}"]`).classList.add('active');

  const matching = MOOD_PALETTES.filter(p => p.mood === moodKey);
  if (matching.length > 0) {
    currentPalette = matching[Math.floor(Math.random() * matching.length)];
    applyPalette();
  } else {
    generatePalette();
  }
}

function generatePalette() {
  currentPalette = MOOD_PALETTES[Math.floor(Math.random() * MOOD_PALETTES.length)];
  // 更新mood选中状态
  document.querySelectorAll('.mood-chip').forEach(c => c.classList.remove('active'));
  const activeChip = document.querySelector(`.mood-chip[data-mood="${currentPalette.mood}"]`);
  if (activeChip) activeChip.classList.add('active');
  applyPalette();
}

function applyPalette() {
  if (!currentPalette) return;

  const { colors, name, bg, text } = currentPalette;

  // 渲染色卡
  document.getElementById('paletteShowcase').innerHTML = colors.map((c, i) => `
    <div class="color-card" style="background:${c};--card-glow:${c}40;" onclick="copyColor(this,'${c}')">
      <span class="color-hex">${c}</span>
      <span class="color-copy-toast">已复制!</span>
    </div>
  `).join('');

  document.getElementById('paletteName').textContent = name;

  // 更新预览
  updatePreview(colors, bg, text);

  // 更新代码输出
  switchFormat(currentFormat);
}

function copyColor(card, hex) {
  navigator.clipboard.writeText(hex).then(() => {
    card.classList.add('copied');
    setTimeout(() => card.classList.remove('copied'), 1200);
  });
}

function updatePreview(colors, bgColor, textColor) {
  const ui = document.getElementById('previewUi');
  ui.style.background = bgColor;
  ui.style.color = textColor;

  document.getElementById('prevLogo').style.background = `linear-gradient(135deg, ${colors[0]}, ${colors[1]})`;
  document.getElementById('prevLogo').style.color = '#fff';
  document.getElementById('prevHero').style.background = `linear-gradient(135deg, ${colors[0]}15, ${colors[1]}15)`;
  document.getElementById('prevBtn').style.background = colors[0];
  document.getElementById('prevBtn').style.color = isLight(colors[0]) ? textColor : '#fff';
  document.getElementById('prevCta').style.background = colors[0];
  document.getElementById('prevCta').style.color = isLight(colors[0]) ? textColor : '#fff';

  for (let i = 1; i <= 3; i++) {
    const card = document.getElementById(`prevCard${i}`);
    if (card) card.style.background = `${colors[i]}18`;
  }
}

function isLight(hex) {
  const c = hex.replace('#', '');
  const r = parseInt(c.substr(0, 2), 16);
  const g = parseInt(c.substr(2, 2), 16);
  const b = parseInt(c.substr(4, 2), 16);
  return (r * 299 + g * 587 + b * 114) / 1000 > 155;
}

function switchFormat(fmt) {
  currentFormat = fmt;
  document.querySelectorAll('.format-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.format-tab[data-format="${fmt}"]`).classList.add('active');

  if (!currentPalette) return;
  const colors = currentPalette.colors;

  let output = '';
  switch (fmt) {
    case 'css':
      output = `:root {\n${colors.map((c, i) => `  --color-${i+1}: ${c};`).join('\n')}\n}`;
      break;
    case 'tailwind':
      output = colors.map((c, i) => `// tailwind.config.js\ncolors: {\n  brand: {\n${colors.map((c, i) => `    '${i+1}': '${c}',`).join('\n')}\n  }\n}`).join('');
      output = `// tailwind.config.js\nmodule.exports = {\n  theme: {\n    extend: {\n      colors: {\n        brand: {\n${colors.map((c, i) => `          '${i+1}': '${c}',`).join('\n')}\n        }\n      }\n    }\n  }\n}`;
      break;
    case 'json':
      output = JSON.stringify({ name: currentPalette.name, colors }, null, 2);
      break;
    case 'swiftui':
      output = colors.map((c, i) => `extension Color {\n    static let brand${i+1} = Color(red: ${parseInt(c.slice(1,3),16)/255}, green: ${parseInt(c.slice(3,5),16)/255}, blue: ${parseInt(c.slice(5,7),16)/255})\n}`).join('\n\n');
      break;
  }
  document.getElementById('codeOutput').textContent = output;
}

function copyAllColors() {
  if (!currentPalette) return;
  navigator.clipboard.writeText(currentPalette.colors.join(', '));
  alert('已复制所有颜色值!');
}

function favoritePalette() {
  if (!currentPalette) return;
  if (favorites.find(f => f.name === currentPalette.name)) {
    alert('已收藏过这个配色啦~'); return;
  }
  favorites.unshift({ ...currentPalette });
  localStorage.setItem('colorFavorites', JSON.stringify(favorites));
  renderFavorites();
  alert(`"${currentPalette.name}" 已加入收藏!`);
}

function loadFavorite(index) {
  if (favorites[index]) {
    currentPalette = favorites[index];
    applyPalette();
  }
}

function removeFavorite(index) {
  favorites.splice(index, 1);
  localStorage.setItem('colorFavorites', JSON.stringify(favorites));
  renderFavorites();
}

function renderFavorites() {
  const grid = document.getElementById('favGrid');
  document.getElementById('favCount').textContent = `(${favorites.length} 个)`;

  if (favorites.length === 0) {
    grid.innerHTML = '<div class="empty-fav">还没有收藏，点击上方"收藏此配色"吧 ✨</div>';
    return;
  }

  grid.innerHTML = favorites.map((f, i) => `
    <div class="fav-item" onclick="loadFavorite(${i})" title="点击应用: ${f.name}">
      ${f.colors.map(c => `<div class="fav-swatch" style="background:${c}"></div>`).join('')}
      <div class="fav-name">${f.name} <span onclick="event.stopPropagation();removeFavorite(${i})" style="cursor:pointer;margin-left:4px">×</span></div>
    </div>
  `).join('');
}

function exportImage() {
  if (!currentPalette) return;
  // 简单提示
  const canvas = document.createElement('canvas');
  canvas.width = 800; canvas.height = 200;
  const ctx = canvas.getContext('2d');
  const w = 800 / currentPalette.colors.length;
  currentPalette.colors.forEach((c, i) => {
    ctx.fillStyle = c;
    ctx.fillRect(i * w, 0, w, 200);
  });

  // 下载
  const link = document.createElement('a');
  link.download = `palette-${currentPalette.name}.png`;
  link.href = canvas.toDataURL();
  link.click();
}

init();
</script>
</body>
