function updateCatBar(type) {
  const cats = catsByType[type] || catsByType.all;
  const bar = document.getElementById('cat-bar');
  bar.innerHTML = cats.map((c, i) =>
    `<button class="cat-btn ${i===0?'active':''}" onclick="filterCat(this,'${c==='全部'?'all':c}')">${c}</button>`
  ).join('');
  currentCat = 'all';
}

// ===== RENDER HOME =====
function renderItems() {
  const grid = document.getElementById('home-items');
  let filtered = allItems;
  if (currentType !== 'all') filtered = filtered.filter(i => i.type === currentType);
  if (currentCat !== 'all') filtered = filtered.filter(i => i.cat === currentCat);

  grid.innerHTML = filtered.map(item => {
    const typeLabel = { donate: '捐赠', service: '服务', help: '求助', swap: '置换' }[item.type];
    const typeClass = item.type;
    const tagClass = item.type === 'service' ? 'service-tag' : item.type === 'help' ? 'help-tag' : item.type === 'swap' ? 'swap-tag' : '';
    const actionLabel = { donate: '申请', service: '预约', help: '我来帮', swap: '去换' }[item.type];
    return `
    <div class="item-card" onclick="openDetail(${item.id})">
      <div style="position:relative;">
        <img class="item-card-img" src="${item.img}" alt="${item.title}" loading="lazy">
        <span class="item-type-tag ${typeClass}">${typeLabel}</span>
      </div>
      <div class="item-card-body">
        <div class="item-card-title">${item.title}</div>
        <div class="item-card-meta">
          <span class="item-card-tag ${tagClass}">${item.cond}</span>
          <span>${item.dist}</span>
        </div>
        <div class="item-card-meta" style="margin-top:4px;">
          <span style="font-size:11px;">${item.time}</span>
          <span class="item-card-action">${actionLabel}</span>
        </div>
      </div>
    </div>
  `;
  }).join('');

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <p>暂无相关内容，换个分类试试吧～</p>
    </div>`;
  }
}

// ===== TYPE SWITCH =====
function switchType(el, type) {
  document.querySelectorAll('.type-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  currentType = type;
  updateCatBar(type);
  renderItems();
}

// ===== FILTER =====
function filterCat(btn, cat) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentCat = cat;
  renderItems();
}

// ===== PUBLISH TYPE SWITCH =====
function switchPubType(el, type) {
  document.querySelectorAll('.pub-type').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  currentPubType = type;
  document.getElementById('form-donate').style.display = type === 'donate' ? 'block' : 'none';
  document.getElementById('form-swap').style.display = type === 'swap' ? 'block' : 'none';
  document.getElementById('form-service').style.display = type === 'service' ? 'block' : 'none';
  document.getElementById('form-help').style.display = type === 'help' ? 'block' : 'none';
}

        <div class="donor-avatar">${currentItem.donor[0]}</div>
        <div class="donor-info">
          <div class="donor-name">${currentItem.donor}</div>
          <div class="donor-badge">爱心认证用户</div>
        </div>
        <div class="donor-score">信用 ${currentItem.score}</div>
      </div>
      <button class="btn ${btnClass}" onclick="showApplyModal('${t}')">${btnText}</button>
    </div>
  `;
  goPage('detail');
}

// ===== NAVIGATION =====
function goPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  if (historyStack[historyStack.length - 1] !== name) {
    historyStack.push(name);
  }
  const navMap = { home: 0, messages: 1, publish: 2, profile: 3 };
  const idx = navMap[name];
  if (idx !== undefined) {
    document.querySelectorAll('.nav-item').forEach((n, i) => n.classList.toggle('active', i === idx));
  }
}

function goBack() {
  historyStack.pop();
  const prev = historyStack[historyStack.length - 1] || 'home';
  goPage(prev);
}

function switchTab(name) {
  historyStack = ['home'];
  goPage(name);
}

// ===== PUBLISH =====
function publishItem(type) {
  const msgs = {
    donate: '发布成功！获得 45 积分',
    swap: '置换发布成功！成功置换可获得 35 积分',
    service: '服务发布成功！获得 60 积分',
    help: '求助发布成功，愿你早日得到帮助'
  };
  showToast(msgs[type]);
  setTimeout(() => {
    historyStack = ['home'];
    goPage('home');
  }, 1500);
}

// ===== MALL =====
let currentMallCat = 'all';
let userPoints = 128;

function renderMall() {
  const grid = document.getElementById('mall-grid');
  let filtered = currentMallCat === 'all' ? mallProducts : mallProducts.filter(p => p.cat === currentMallCat);
  grid.innerHTML = filtered.map(p => {
    const canExchange = userPoints >= p.points;
    return `
    <div class="mall-card">
      <img class="mall-card-img" src="${p.img}" alt="${p.name}" loading="lazy">
      <div class="mall-card-body">
        <div class="mall-card-title">${p.name}</div>
        <div class="mall-card-points">${p.points} 积分</div>
        <button class="mall-card-btn" ${canExchange ? '' : 'disabled'} onclick="exchangeItem('${p.id}', ${p.points})">${canExchange ? '立即兑换' : '积分不足'}</button>
      </div>
    </div>
  `;
  }).join('');
  document.getElementById('mall-points').textContent = userPoints;
}

function filterMallCat(btn, cat) {
  document.querySelectorAll('#page-mall .cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentMallCat = cat;
  renderMall();
}

function exchangeItem(id, points) {
  const p = mallProducts.find(x => x.id === id);
  if (!p || userPoints < points) return;
  userPoints -= points;
  showToast(`兑换成功！消耗 ${points} 积分，获得「${p.name}」`);
  renderMall();
}

// ===== MESSAGES =====
function renderMessages() {
  const list = document.getElementById('msg-list');
  list.innerHTML = messages.map(m => {
    let iconClass = m.type === 'service' ? 'blue' : m.type === 'help' ? 'orange' : '';
    return `
    <div class="msg-item" onclick="showToast('功能开发中')">
      <div class="msg-icon ${iconClass}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      </div>
      <div class="msg-body">
        <div class="msg-title">
          ${m.title}
          <span class="msg-time">${m.time}</span>
        </div>
        <div class="msg-text">${m.text}</div>
      </div>
      ${m.unread ? '<div class="msg-dot"></div>' : ''}
    </div>
  `;
  }).join('');
}

// ===== MODAL =====
function showApplyModal(type) {
  const titles = { donate: '确认申请领取？', service: '确认预约这项服务？', help: '确认要提供帮助吗？' };
  const confirms = { donate: '立即申请', service: '确认预约', help: '我来帮忙' };
  document.getElementById('apply-title').textContent = titles[type];
  document.getElementById('apply-confirm').textContent = confirms[type];
  document.getElementById('apply-modal').classList.add('show');
  window._applyType = type;
}
function closeModal() {
  document.getElementById('apply-modal').classList.remove('show');
}
function confirmApply() {
  closeModal();
  const msgs = {
    donate: '申请已提交，等待捐赠者确认',
    service: '预约已提交，等待服务者确认',
    help: '已发送帮助意向，等待求助者回复'
  };
  showToast(msgs[window._applyType || 'donate']);
}

// ===== TOAST =====
function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ===== INIT =====
updateCatBar('all');
renderItems();
renderMessages();
renderMall();
</script>

</body>
</html>
