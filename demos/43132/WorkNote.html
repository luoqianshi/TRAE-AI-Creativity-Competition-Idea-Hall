<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日常工作记录工作台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.3s ease-out;
        }
        .animate-slideIn {
            animation: slideIn 0.3s ease-out;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 顶部统计看板 -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <h1 class="text-2xl font-bold text-gray-800 mb-6">日常工作记录工作台</h1>
            <div class="grid grid-cols-4 gap-4">
                <div class="bg-blue-50 rounded-lg p-4 border border-blue-100">
                    <p class="text-sm text-blue-600 font-medium">今日记录总数</p>
                    <p id="todayCount" class="text-3xl font-bold text-blue-700">0</p>
                </div>
                <div class="bg-green-50 rounded-lg p-4 border border-green-100">
                    <p class="text-sm text-green-600 font-medium">本周累计工时</p>
                    <p id="weekHours" class="text-3xl font-bold text-green-700">0</p>
                </div>
                <div class="bg-purple-50 rounded-lg p-4 border border-purple-100">
                    <p class="text-sm text-purple-600 font-medium">已完成任务</p>
                    <p id="completedCount" class="text-3xl font-bold text-purple-700">0</p>
                </div>
                <div class="bg-orange-50 rounded-lg p-4 border border-orange-100">
                    <p class="text-sm text-orange-600 font-medium">待完成任务</p>
                    <p id="pendingCount" class="text-3xl font-bold text-orange-700">0</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="flex gap-6">
            <!-- 左侧表单区域 -->
            <div class="w-80 flex-shrink-0">
                <div class="bg-white rounded-lg shadow-sm p-5 animate-slideIn">
                    <h2 class="text-lg font-semibold text-gray-800 mb-4">新增工作记录</h2>
                    <form id="recordForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">日期</label>
                            <input type="date" id="date" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">工作分类</label>
                            <select id="category" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" required>
                                <option value="">请选择分类</option>
                                <option value="项目工作">项目工作</option>
                                <option value="行政事务">行政事务</option>
                                <option value="临时任务">临时任务</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">工作内容</label>
                            <textarea id="content" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-none" placeholder="请输入工作内容..." required></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">耗时（小时）</label>
                            <input type="number" id="hours" min="0" step="0.5" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="例如：2.5" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">完成状态</label>
                            <div class="flex gap-4">
                                <label class="flex items-center gap-2">
                                    <input type="radio" name="status" value="已完成" class="text-blue-600" required>
                                    <span class="text-sm text-gray-700">已完成</span>
                                </label>
                                <label class="flex items-center gap-2">
                                    <input type="radio" name="status" value="进行中" class="text-blue-600">
                                    <span class="text-sm text-gray-700">进行中</span>
                                </label>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">备注</label>
                            <input type="text" id="remark" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="选填备注信息...">
                        </div>
                        <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition-colors font-medium">
                            提交记录
                        </button>
                    </form>
                </div>
            </div>

            <!-- 右侧列表区域 -->
            <div class="flex-1">
                <!-- 筛选区 -->
                <div class="bg-white rounded-lg shadow-sm p-4 mb-4">
                    <div class="flex flex-wrap items-center gap-4">
                        <div>
                            <label class="text-sm font-medium text-gray-700 mr-2">工作分类</label>
                            <select id="filterCategory" class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                                <option value="">全部</option>
                                <option value="项目工作">项目工作</option>
                                <option value="行政事务">行政事务</option>
                                <option value="临时任务">临时任务</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-sm font-medium text-gray-700 mr-2">完成状态</label>
                            <select id="filterStatus" class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                                <option value="">全部</option>
                                <option value="已完成">已完成</option>
                                <option value="进行中">进行中</option>
                            </select>
                        </div>
                        <div class="flex gap-2">
                            <button id="filterToday" class="px-4 py-2 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200 transition-colors text-sm font-medium">今日</button>
                            <button id="filterWeek" class="px-4 py-2 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200 transition-colors text-sm font-medium">本周</button>
                            <button id="filterAll" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors text-sm font-medium">全部</button>
                        </div>
                    </div>
                </div>

                <!-- 记录列表 -->
                <div id="recordList" class="space-y-3">
                    <!-- 记录卡片将通过JS动态生成 -->
                </div>

                <!-- 空状态提示 -->
                <div id="emptyState" class="text-center py-12 bg-white rounded-lg shadow-sm">
                    <p class="text-gray-500">暂无工作记录，请添加新记录</p>
                </div>
            </div>
        </div>

        <!-- AI辅助输入区 -->
        <div class="mt-6 bg-white rounded-lg shadow-sm p-4">
            <div class="flex gap-3">
                <input type="text" id="aiInput" class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="输入指令，AI自动总结今日工作生成周报草稿">
                <button id="aiSubmit" class="px-6 py-3 bg-gradient-to-r from-purple-600 to-blue-600 text-white rounded-lg hover:from-purple-700 hover:to-blue-700 transition-all font-medium">
                    AI生成
                </button>
            </div>
        </div>
    </main>

    <!-- 提示弹窗 -->
    <div id="toast" class="fixed top-4 right-4 px-4 py-3 rounded-lg shadow-lg opacity-0 transform translate-x-full transition-all z-50">
        <span id="toastText"></span>
    </div>

    <script>
        // 初始化数据
        function initData() {
            if (!localStorage.getItem('workRecords')) {
                localStorage.setItem('workRecords', JSON.stringify([]));
            }
        }

        // 获取所有记录
        function getRecords() {
            return JSON.parse(localStorage.getItem('workRecords') || '[]');
        }

        // 保存记录
        function saveRecords(records) {
            localStorage.setItem('workRecords', JSON.stringify(records));
        }

        // 获取今日日期字符串
        function getTodayStr() {
            return new Date().toISOString().split('T')[0];
        }

        // 获取本周开始日期
        function getWeekStart() {
            const today = new Date();
            const day = today.getDay();
            const diff = today.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(today.setDate(diff)).toISOString().split('T')[0];
        }

        // 更新统计数据
        function updateStats() {
            const records = getRecords();
            const today = getTodayStr();
            const weekStart = getWeekStart();

            const todayRecords = records.filter(r => r.date === today);
            const weekRecords = records.filter(r => r.date >= weekStart);
            const completed = records.filter(r => r.status === '已完成');
            const pending = records.filter(r => r.status === '进行中');

            const weekHours = weekRecords.reduce((sum, r) => sum + parseFloat(r.hours || 0), 0);

            document.getElementById('todayCount').textContent = todayRecords.length;
            document.getElementById('weekHours').textContent = weekHours.toFixed(1) + 'h';
            document.getElementById('completedCount').textContent = completed.length;
            document.getElementById('pendingCount').textContent = pending.length;
        }

        // 显示提示
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const text = document.getElementById('toastText');
            text.textContent = message;
            
            if (type === 'error') {
                toast.className = 'fixed top-4 right-4 px-4 py-3 rounded-lg shadow-lg opacity-100 transform translate-x-0 transition-all z-50 bg-red-500 text-white';
            } else {
                toast.className = 'fixed top-4 right-4 px-4 py-3 rounded-lg shadow-lg opacity-100 transform translate-x-0 transition-all z-50 bg-green-500 text-white';
            }

            setTimeout(() => {
                toast.className = 'fixed top-4 right-4 px-4 py-3 rounded-lg shadow-lg opacity-0 transform translate-x-full transition-all z-50';
            }, 2000);
        }

        // 渲染记录列表
        function renderRecords(filteredRecords) {
            const list = document.getElementById('recordList');
            const emptyState = document.getElementById('emptyState');

            if (filteredRecords.length === 0) {
                list.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            list.style.display = 'block';
            emptyState.style.display = 'none';

            list.innerHTML = filteredRecords.map(record => `
                <div class="bg-white rounded-lg shadow-sm p-4 animate-fadeIn hover:shadow-md transition-shadow">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="px-2 py-1 text-xs font-medium rounded-full ${getCategoryClass(record.category)}">
                                    ${record.category}
                                </span>
                                <span class="px-2 py-1 text-xs font-medium rounded-full ${getStatusClass(record.status)}">
                                    ${record.status}
                                </span>
                                <span class="text-sm text-gray-500">${record.date}</span>
                            </div>
                            <p class="text-gray-800 font-medium mb-1">${record.content}</p>
                            <p class="text-sm text-gray-500 mb-1">耗时：${record.hours}小时</p>
                            ${record.remark ? `<p class="text-sm text-gray-400">备注：${record.remark}</p>` : ''}
                        </div>
                        <button onclick="deleteRecord('${record.id}')" class="delete-btn p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                            </svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 获取分类样式
        function getCategoryClass(category) {
            switch(category) {
                case '项目工作': return 'bg-blue-100 text-blue-700';
                case '行政事务': return 'bg-green-100 text-green-700';
                case '临时任务': return 'bg-orange-100 text-orange-700';
                default: return 'bg-gray-100 text-gray-700';
            }
        }

        // 获取状态样式
        function getStatusClass(status) {
            return status === '已完成' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700';
        }

        // 删除记录
        function deleteRecord(id) {
            const records = getRecords();
            const newRecords = records.filter(r => r.id !== id);
            saveRecords(newRecords);
            updateStats();
            applyFilters();
            showToast('删除成功');
        }

        // 应用筛选
        function applyFilters() {
            const records = getRecords();
            const category = document.getElementById('filterCategory').value;
            const status = document.getElementById('filterStatus').value;
            const timeFilter = document.querySelector('.time-active')?.dataset.filter || 'all';

            let filtered = records;

            if (category) {
                filtered = filtered.filter(r => r.category === category);
            }
            if (status) {
                filtered = filtered.filter(r => r.status === status);
            }
            if (timeFilter === 'today') {
                filtered = filtered.filter(r => r.date === getTodayStr());
            } else if (timeFilter === 'week') {
                filtered = filtered.filter(r => r.date >= getWeekStart());
            }

            renderRecords(filtered);
        }

        // 表单提交
        document.getElementById('recordForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const date = document.getElementById('date').value;
            const category = document.getElementById('category').value;
            const content = document.getElementById('content').value.trim();
            const hours = document.getElementById('hours').value;
            const status = document.querySelector('input[name="status"]:checked')?.value;
            const remark = document.getElementById('remark').value.trim();

            if (!date || !category || !content || !hours || !status) {
                showToast('请填写所有必填项', 'error');
                return;
            }

            const newRecord = {
                id: Date.now().toString(),
                date,
                category,
                content,
                hours,
                status,
                remark,
                createdAt: new Date().toISOString()
            };

            const records = getRecords();
            records.unshift(newRecord);
            saveRecords(records);

            // 清空表单
            this.reset();
            document.getElementById('date').value = getTodayStr();

            updateStats();
            applyFilters();
            showToast('添加成功');
        });

        // 筛选事件
        document.getElementById('filterCategory').addEventListener('change', applyFilters);
        document.getElementById('filterStatus').addEventListener('change', applyFilters);

        // 时间筛选按钮
        document.getElementById('filterToday').addEventListener('click', function() {
            setTimeFilter('today', this);
        });

        document.getElementById('filterWeek').addEventListener('click', function() {
            setTimeFilter('week', this);
        });

        document.getElementById('filterAll').addEventListener('click', function() {
            setTimeFilter('all', this);
        });

        function setTimeFilter(filter, element) {
            document.querySelectorAll('.time-active').forEach(el => el.classList.remove('time-active', 'bg-blue-600', 'text-white'));
            element.classList.add('time-active', 'bg-blue-600', 'text-white');
            element.dataset.filter = filter;
            applyFilters();
        }

        // AI按钮点击（仅UI展示）
        document.getElementById('aiSubmit').addEventListener('click', function() {
            const input = document.getElementById('aiInput').value;
            if (!input.trim()) {
                showToast('请输入指令内容', 'error');
            } else {
                showToast('AI正在处理，请稍候...');
                document.getElementById('aiInput').value = '';
            }
        });

        // 页面加载初始化
        document.addEventListener('DOMContentLoaded', function() {
            initData();
            document.getElementById('date').value = getTodayStr();
            document.getElementById('filterAll').classList.add('time-active', 'bg-blue-600', 'text-white');
            document.getElementById('filterAll').dataset.filter = 'all';
            updateStats();
            applyFilters();
        });
    </script>
</body>
</html>
