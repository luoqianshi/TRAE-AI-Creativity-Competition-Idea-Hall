<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日省 - 每日省钱优惠券线报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .phone-frame {
            width: 375px;
            background: #fff;
            border-radius: 40px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.15);
            overflow: hidden;
            position: relative;
            border: 8px solid #1a1a1a;
        }
        .notch {
            width: 150px;
            height: 28px;
            background: #1a1a1a;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            z-index: 100;
        }
        .screen {
            height: 100%;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .screen::-webkit-scrollbar {
            display: none;
        }
        .header {
            background: #ff6b35;
            color: #fff;
            padding: 50px 20px 30px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .header h1 {
            font-size: 22px;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        .header p {
            font-size: 13px;
            opacity: 0.9;
        }
        .date-tag {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 20px;
            margin-top: 12px;
            font-size: 12px;
        }
        .categories {
            display: flex;
            padding: 15px;
            gap: 10px;
            overflow-x: auto;
            background: #fff;
            scrollbar-width: none;
        }
        .categories::-webkit-scrollbar {
            display: none;
        }
        .category {
            flex-shrink: 0;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .category.active {
            background: #ff6b35;
            color: #fff;
        }
        .category:not(.active) {
            background: #f5f5f5;
            color: #666;
        }
        .section-title {
            padding: 15px 20px 5px;
            font-size: 16px;
            font-weight: 700;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::before {
            content: '';
            width: 4px;
            height: 16px;
            background: #ff6b35;
            border-radius: 2px;
        }
        .deals-list {
            padding: 10px 15px 30px;
        }
        .deal-card {
            background: #fff;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            display: flex;
            gap: 12px;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid #f0f0f0;
        }
        .deal-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .deal-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }
        .deal-info {
            flex: 1;
        }
        .deal-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }
        .deal-desc {
            font-size: 12px;
            color: #999;
        }
        .deal-tag {
            display: inline-block;
            background: #fff0ed;
            color: #ff6b35;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            margin-top: 4px;
            margin-right: 4px;
        }
        .deal-btn {
            background: #ff6b35;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
        }
        .countdown {
            font-size: 11px;
            color: #ff4757;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .hot-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #ff4757;
            color: #fff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 8px;
        }
        .tab-bar {
            position: sticky;
            bottom: 0;
            background: #fff;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 50;
        }
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: #999;
            cursor: pointer;
        }
        .tab-item.active {
            color: #ff6b35;
        }
        .tab-icon {
            font-size: 22px;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="notch"></div>
        <div class="screen">
            <div class="header">
                <h1>每日省</h1>
                <p>汇聚全网优惠，每日省钱快报</p>
                <div class="date-tag">7月13日 周日</div>
            </div>

            <div class="categories">
                <div class="category active">全部</div>
                <div class="category">外卖</div>
                <div class="category">电商</div>
                <div class="category">出行</div>
                <div class="category">本地生活</div>
            </div>

            <div class="section-title">限时热券</div>
            <div class="deals-list">
                <div class="deal-card">
                    <div class="deal-icon" style="background: #fff0ed;">🍔</div>
                    <div class="deal-info">
                        <div class="deal-title">美团外卖 满30减15</div>
                        <div class="deal-desc">午餐晚餐通用，限量领取</div>
                        <div class="countdown">⏰ 剩余 2小时34分</div>
                        <div>
                            <span class="deal-tag">今日必领</span>
                            <span class="deal-tag">高省</span>
                        </div>
                    </div>
                    <button class="deal-btn">领券</button>
                </div>

                <div class="deal-card">
                    <div class="deal-icon" style="background: #e8f5e9;">🛒</div>
                    <div class="deal-info">
                        <div class="deal-title">京东 全品类满200减20</div>
                        <div class="deal-desc">叠加店铺券更优惠</div>
                        <div class="countdown">⏰ 剩余 5小时12分</div>
                        <div>
                            <span class="deal-tag">可叠加</span>
                        </div>
                    </div>
                    <button class="deal-btn">领券</button>
                </div>

                <div class="deal-card">
                    <div class="deal-icon" style="background: #e3f2fd;">☕</div>
                    <div class="deal-info">
                        <div class="deal-title">瑞幸咖啡 9.9元券</div>
                        <div class="deal-desc">全国门店通用，每日可领</div>
                        <div>
                            <span class="deal-tag">每日</span>
                            <span class="deal-tag">热门</span>
                        </div>
                    </div>
                    <button class="deal-btn">领券</button>
                </div>

                <div class="deal-card">
                    <div class="deal-icon" style="background: #f3e5f5;">🚕</div>
                    <div class="deal-info">
                        <div class="deal-title">滴滴出行 5折快车券</div>
                        <div class="deal-desc">周末出行专用，最高减15元</div>
                        <div class="countdown">⏰ 仅限本周末</div>
                        <div>
                            <span class="deal-tag">周末</span>
                        </div>
                    </div>
                    <button class="deal-btn">领券</button>
                </div>

                <div class="deal-card">
                    <div class="deal-icon" style="background: #fff8e1;">🎬</div>
                    <div class="deal-info">
                        <div class="deal-title">淘票票 电影票立减10元</div>
                        <div class="deal-desc">暑期档大片通用</div>
                        <div>
                            <span class="deal-tag">暑期</span>
                        </div>
                    </div>
                    <button class="deal-btn">领券</button>
                </div>
            </div>

            <div class="tab-bar">
                <div class="tab-item active">
                    <span class="tab-icon">🏠</span>
                    <span>今日</span>
                </div>
                <div class="tab-item">
                    <span class="tab-icon">📋</span>
                    <span>分类</span>
                </div>
                <div class="tab-item">
                    <span class="tab-icon">🔥</span>
                    <span>精选</span>
                </div>
                <div class="tab-item">
                    <span class="tab-icon">👤</span>
                    <span>我的</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
