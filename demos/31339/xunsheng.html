<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寻声 — 昆曲声音互动装置</title>
<style>
/* ==================== CSS 区域 ==================== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background-color: #ffffff;
  font-family: "SimSun", "Songti SC", "STSong", serif;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* 主屏幕容器，模仿竖屏展览屏 */
.screen {
  position: relative;
  width: 100%;
  height: 100%;
  max-width: 900px;
  max-height: 1200px;
  background: #ffffff;
  overflow: hidden;
}

/* ---------- 左上角书法标题 ---------- */
.top-title {
  position: absolute;
  top: 40px;
  left: 50px;
  z-index: 20;
}

.top-title .calligraphy {
  font-size: 64px;
  font-weight: 700;
  color: #111;
  letter-spacing: 0.1em;
  line-height: 1;
  writing-mode: horizontal-tb;
  font-family: "KaiTi", "STKaiti", "楷体", serif;
}

.top-title .sub-calligraphy {
  display: block;
  font-size: 11px;
  color: #888;
  letter-spacing: 0.15em;
  margin-top: 8px;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  text-transform: uppercase;
}

/* ---------- 右上角控制标签 ---------- */
.top-right {
  position: absolute;
  top: 48px;
  right: 50px;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 20;
}

.show-label {
  font-size: 11px;
  color: #666;
  letter-spacing: 0.05em;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
}

.rush-btn {
  font-size: 10px;
  color: #333;
  border: 1px solid #ccc;
  padding: 3px 10px;
  border-radius: 2px;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  letter-spacing: 0.05em;
}

/* ---------- 左侧竖排信息栏 ---------- */
.left-info {
  position: absolute;
  top: 180px;
  left: 50px;
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.left-info .vertical-text {
  writing-mode: vertical-rl;
  font-size: 22px;
  color: #222;
  letter-spacing: 0.2em;
  font-family: "KaiTi", "STKaiti", "楷体", serif;
  line-height: 1.6;
}

.left-info .vertical-divider {
  width: 1px;
  height: 40px;
  background: #ddd;
  margin: 0 auto;
}

.left-info .track-meta {
  font-size: 12px;
  color: #999;
  line-height: 1.8;
  letter-spacing: 0.05em;
}

/* ---------- 中央曼陀罗区 ---------- */
.mandala-wrap {
  position: absolute;
  top: 50%;
  left: 55%;
  transform: translate(-50%, -50%);
  z-index: 10;
}

#mandalaCanvas {
  width: 520px;
  height: 520px;
  display: block;
}

/* 中央控制按钮 */
#controlBtn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 90px;
  height: 90px;
  border-radius: 50%;
  border: 1px solid #bbb;
  background: rgba(255, 255, 255, 0.92);
  color: #333;
  font-family: "SimSun", "Songti SC", serif;
  font-size: 13px;
  letter-spacing: 0.1em;
  cursor: pointer;
  outline: none;
  transition: all 0.4s ease;
  z-index: 30;
}

#controlBtn:hover {
  border-color: #888;
  transform: translate(-50%, -50%) scale(1.05);
}

#controlBtn.active {
  border-color: #C0392B;
  color: #C0392B;
}

/* ---------- 底部波形区 ---------- */
.bottom-wave {
  position: absolute;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%);
  width: 80%;
  max-width: 700px;
  z-index: 15;
}

#waveCanvas {
  width: 100%;
  height: 80px;
  display: block;
}

/* ---------- 左下角说明 ---------- */
.bottom-left-text {
  position: absolute;
  bottom: 40px;
  left: 50px;
  font-size: 11px;
  color: #bbb;
  line-height: 1.8;
  letter-spacing: 0.08em;
  z-index: 20;
}

/* ---------- 右下角提示 ---------- */
.bottom-right-hint {
  position: absolute;
  bottom: 40px;
  right: 50px;
  font-size: 11px;
  color: #ccc;
  letter-spacing: 0.1em;
  z-index: 20;
}

/* ---------- 状态提示 ---------- */
#statusMsg {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  margin-top: 70px;
  font-size: 11px;
  color: #aaa;
  letter-spacing: 0.1em;
  opacity: 0;
  transition: opacity 0.5s ease;
  pointer-events: none;
  white-space: nowrap;
  z-index: 30;
}

#statusMsg.show {
  opacity: 1;
}
</style>
</head>
<body>

<!-- ==================== HTML 区域 ==================== -->
<div class="screen">

  <!-- 左上角标题 -->
  <div class="top-title">
    <div class="calligraphy">寻声</div>
    <span class="sub-calligraphy">Kunqu Sound Interaction</span>
  </div>

  <!-- 右上角标签 -->
  <div class="top-right">
    <span class="show-label">SHOW ON 1.00</span>
    <span class="rush-btn">RUSH</span>
  </div>

  <!-- 左侧信息栏 -->
  <div class="left-info">
    <div class="vertical-text">牡丹亭 · 寻梦</div>
    <div class="vertical-divider"></div>
    <div class="track-meta">
      昆曲 水磨调<br>
      声纹互动装置<br><br>
      情不知所起<br>
      一往而深
    </div>
  </div>

  <!-- 中央曼陀罗 -->
  <div class="mandala-wrap">
    <canvas id="mandalaCanvas" width="520" height="520"></canvas>
    <button id="controlBtn">聆听 · 发声</button>
    <div id="statusMsg"></div>
  </div>

  <!-- 底部波形 -->
  <div class="bottom-wave">
    <canvas id="waveCanvas" width="700" height="80"></canvas>
  </div>

  <!-- 左下角说明 -->
  <div class="bottom-left-text">
    《寻声》昆曲声音互动装置<br>
    开口发声，与古老唱腔形成视觉对话
  </div>

  <!-- 右下角提示 -->
  <div class="bottom-right-hint">开口，让昆曲听见你</div>

</div>

<script>
/* ==================== JS 区域 ==================== */

// ---------- 全局变量与配置 ----------
const canvas = document.getElementById('mandalaCanvas');
const ctx = canvas.getContext('2d');
const waveCanvas = document.getElementById('waveCanvas');
const waveCtx = waveCanvas.getContext('2d');
const btn = document.getElementById('controlBtn');
const statusMsg = document.getElementById('statusMsg');

const W = canvas.width;
const H = canvas.height;
const CX = W / 2;
const CY = H / 2;

const WW = waveCanvas.width;
const WH = waveCanvas.height;

// 状态枚举
const STATE = { IDLE: 'idle', ACTIVE: 'active', END: 'end' };
let currentState = STATE.IDLE;

// 动画时间
let animTime = 0;

// Web Audio API 相关
let audioCtx = null;
let analyser = null;
let micStream = null;
let micSource = null;

// 用户声纹淡出相关
let userFadeOut = 0;
const FADE_SPEED = 0.015;

// FFT 数据缓冲
const FFT_SIZE = 2048;
let freqData = null;
let timeData = null;

// 噪声函数
function noise(x) {
  const n = Math.sin(x * 12.9898 + Math.sin(x * 78.233)) * 43758.5453;
  return n - Math.floor(n);
}
function smoothNoise(x) {
  const i = Math.floor(x);
  const f = x - i;
  return noise(i) * (1 - f) + noise(i + 1) * f;
}

// ---------- 工具函数 ----------

function computeRMS(arr) {
  let sum = 0;
  for (let i = 0; i < arr.length; i++) {
    const v = arr[i] - 128;
    sum += v * v;
  }
  return Math.sqrt(sum / arr.length);
}

function getUserSpectrumAtAngle(angle, data) {
  if (!data) return 0;
  const binCount = data.length;
  const idx = Math.floor((angle / (2 * Math.PI)) * (binCount * 0.5));
  const safeIdx = Math.min(idx, binCount - 1);
  return data[safeIdx] / 255;
}

// ---------- 曼陀罗绘制 ----------

function layerRadius(t, angle, layerIndex, totalLayers, isUser, freqDataRef) {
  let r = 0;
  const symmetry = 12 + layerIndex * 4;
  const baseFreq = 0.5 + layerIndex * 0.3;

  if (isUser && freqDataRef) {
    const spec = getUserSpectrumAtAngle(angle, freqDataRef);
    r = spec * (0.6 + 0.4 * Math.sin(angle * symmetry + t * baseFreq));
    r += spec * 0.15 * Math.sin(angle * symmetry * 2 + t * 1.5);
  } else {
    r += 0.5 * Math.sin(angle * symmetry + t * baseFreq);
    r += 0.25 * Math.sin(angle * symmetry * 2 + t * baseFreq * 1.3 + 1);
    r += 0.12 * Math.sin(angle * symmetry * 3 + t * baseFreq * 0.7 + 2);
    r += 0.08 * smoothNoise(angle * symmetry * 0.5 + t * 0.2);
    const breath = 0.9 + 0.1 * Math.sin(t * 0.4 + layerIndex);
    r *= breath;
    r = (r / 1.0) * 0.5 + 0.5;
  }
  return Math.max(0, Math.min(1, r));
}

function drawRing(radius, segments, radiusFn, color, alpha, lineWidth) {
  // 修复：确保 lineWidth 不为负
  const safeLineWidth = Math.max(0.1, lineWidth);

  ctx.save();
  ctx.translate(CX, CY);
  ctx.strokeStyle = color;
  ctx.lineWidth = safeLineWidth;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.globalAlpha = alpha;

  const step = (Math.PI * 2) / segments;

  // 绘制闭合曲线
  ctx.beginPath();
  for (let i = 0; i <= segments; i++) {
    const angle = i * step;
    const rFactor = radiusFn(angle);
    const r = rFactor * radius;
    const x = Math.cos(angle) * r;
    const y = Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // 花瓣尖端装饰点
  ctx.fillStyle = color;
  for (let i = 0; i < segments; i++) {
    const angle = i * step;
    const rFactor = radiusFn(angle);
    const prev = radiusFn(angle - step);
    const next = radiusFn(angle + step);
    if (rFactor > prev && rFactor > next && rFactor > 0.7) {
      const r = rFactor * radius;
      const x = Math.cos(angle) * r;
      const y = Math.sin(angle) * r;
      // 修复：确保 dotSize 不为负
      const dotSize = Math.max(0.1, safeLineWidth * (0.5 + rFactor * 0.8));
      ctx.globalAlpha = alpha * 0.6;
      ctx.beginPath();
      ctx.arc(x, y, dotSize, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.restore();
}

function drawMandalaComplex(t, isUser, freqDataRef, globalAlphaMult, rms) {
  const layers = isUser ? 5 : 8;
  const maxR = isUser ? 220 : 250;
  const baseColor = isUser ? '#C0392B' : '#1a1a1a';

  for (let i = 0; i < layers; i++) {
    const progress = (i + 1) / layers;
    const radius = maxR * progress;
    const segments = 24 + i * 16;
    const layerAlpha = (1.0 - progress * 0.5) * globalAlphaMult;

    // 修复：lineW 可能为负，加 Math.max 保护
    const rawLineW = isUser
      ? (0.4 + (rms / 128) * 1.2) * (1.2 - progress * 0.3)
      : (0.35 + 0.5 * Math.sin(t * 0.5 + i)) * (1.1 - progress * 0.3);
    const lineW = Math.max(0.1, rawLineW);

    const fn = (angle) => layerRadius(t, angle, i, layers, isUser, freqDataRef);
    drawRing(radius, segments, fn, baseColor, layerAlpha, lineW);

    if (!isUser) {
      const fnMirror = (angle) => layerRadius(t, angle + Math.PI / segments, i, layers, isUser, freqDataRef);
      drawRing(radius * 0.95, segments, fnMirror, baseColor, layerAlpha * 0.5, lineW * 0.7);
    }
  }

  // 中心装饰圆
  ctx.save();
  ctx.translate(CX, CY);
  ctx.strokeStyle = baseColor;
  ctx.globalAlpha = 0.15 * globalAlphaMult;
  ctx.lineWidth = 0.5;
  const centerR = maxR * 0.08;
  ctx.beginPath();
  ctx.arc(0, 0, Math.max(0.1, centerR), 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalAlpha = 0.08 * globalAlphaMult;
  ctx.beginPath();
  ctx.arc(0, 0, Math.max(0.1, centerR * 0.6), 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

// ---------- 底部波形绘制 ----------

function drawWaveform(freqDataRef, timeDataRef, isActive) {
  waveCtx.fillStyle = '#ffffff';
  waveCtx.fillRect(0, 0, WW, WH);

  if (!isActive || !freqDataRef || !timeDataRef) {
    // 待机状态：绘制静态细线
    waveCtx.strokeStyle = '#e0e0e0';
    waveCtx.lineWidth = 0.5;
    for (let y = 10; y < WH; y += 24) {
      waveCtx.beginPath();
      waveCtx.moveTo(0, y);
      waveCtx.lineTo(WW, y);
      waveCtx.stroke();
    }
    return;
  }

  const barCount = 64;
  const barWidth = WW / barCount;
  const step = Math.floor(freqDataRef.length / barCount);

  // 频谱条
  for (let i = 0; i < barCount; i++) {
    const value = freqDataRef[i * step] / 255;
    const barHeight = value * (WH * 0.7);
    const x = i * barWidth;
    const y = WH - barHeight;

    waveCtx.fillStyle = `rgba(192, 57, 43, ${0.15 + value * 0.5})`;
    waveCtx.fillRect(x + 1, y, barWidth - 2, barHeight);
  }

  // 时域波形线
  waveCtx.strokeStyle = '#1a1a1a';
  waveCtx.lineWidth = 0.8;
  waveCtx.globalAlpha = 0.4;
  waveCtx.beginPath();
  for (let i = 0; i < WW; i++) {
    const idx = Math.floor((i / WW) * timeDataRef.length);
    const v = timeDataRef[idx] / 255;
    const y = WH * 0.5 + (v - 0.5) * WH * 0.6;
    if (i === 0) waveCtx.moveTo(i, y);
    else waveCtx.lineTo(i, y);
  }
  waveCtx.stroke();
  waveCtx.globalAlpha = 1;
}

// ---------- 音频初始化 ----------

async function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = FFT_SIZE;
  analyser.smoothingTimeConstant = 0.8;

  freqData = new Uint8Array(analyser.frequencyBinCount);
  timeData = new Uint8Array(analyser.frequencyBinCount);

  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    micSource = audioCtx.createMediaStreamSource(micStream);
    micSource.connect(analyser);
  } catch (err) {
    console.error('无法获取麦克风权限:', err);
    showStatus('无法访问麦克风，请检查权限设置');
    throw err;
  }
}

function stopAudio() {
  if (micStream) {
    micStream.getTracks().forEach(track => track.stop());
    micStream = null;
  }
  if (micSource) {
    micSource.disconnect();
    micSource = null;
  }
  if (analyser) {
    analyser.disconnect();
    analyser = null;
  }
  if (audioCtx && audioCtx.state !== 'closed') {
    audioCtx.close();
    audioCtx = null;
  }
  freqData = null;
  timeData = null;
}

// ---------- 状态与 UI 管理 ----------

function showStatus(msg) {
  statusMsg.textContent = msg;
  statusMsg.classList.add('show');
  setTimeout(() => {
    statusMsg.classList.remove('show');
  }, 2500);
}

function enterIdle() {
  currentState = STATE.IDLE;
  btn.textContent = '聆听 · 发声';
  btn.classList.remove('active');
  userFadeOut = 0;
}

async function enterActive() {
  try {
    await initAudio();
    currentState = STATE.ACTIVE;
    btn.textContent = '停止';
    btn.classList.add('active');
    userFadeOut = 1;
    showStatus('正在聆听你的声音…');
  } catch (e) {
    // 保持 IDLE
  }
}

function enterEnd() {
  currentState = STATE.END;
  btn.textContent = '聆听 · 发声';
  btn.classList.remove('active');
}

btn.addEventListener('click', () => {
  if (currentState === STATE.IDLE) {
    enterActive();
  } else if (currentState === STATE.ACTIVE) {
    enterEnd();
  } else if (currentState === STATE.END) {
    if (!audioCtx) {
      enterIdle();
    } else {
      enterActive();
    }
  }
});

// ---------- 主动画循环 ----------

function animate() {
  requestAnimationFrame(animate);
  animTime += 0.016;

  // 拖影残影
  ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
  ctx.fillRect(0, 0, W, H);

  // END 状态淡出
  if (currentState === STATE.END) {
    userFadeOut -= FADE_SPEED;
    if (userFadeOut <= 0) {
      userFadeOut = 0;
      stopAudio();
      currentState = STATE.IDLE;
    }
  }

  // 获取麦克风数据
  let hasUserData = false;
  let userRMS = 0;
  if (analyser && freqData && timeData) {
    analyser.getByteFrequencyData(freqData);
    analyser.getByteTimeDomainData(timeData);
    userRMS = computeRMS(timeData);
    hasUserData = true;
  }

  // 1. 昆曲声纹（黑色）
  const kunquRMS = 0.3 + 0.2 * Math.sin(animTime * 0.4);
  drawMandalaComplex(animTime, false, null, 1.0, kunquRMS);

  // 2. 用户声纹（朱砂红）
  if ((currentState === STATE.ACTIVE || currentState === STATE.END) && hasUserData && userFadeOut > 0) {
    const globalAlpha = (0.5 + (userRMS / 128) * 0.5) * userFadeOut;
    drawMandalaComplex(animTime, true, freqData, globalAlpha, userRMS);
  }

  // 3. 底部波形
  const isActive = currentState === STATE.ACTIVE || (currentState === STATE.END && userFadeOut > 0);
  drawWaveform(freqData, timeData, isActive);
}

animate();
enterIdle();
</script>
</body>
</html>
