<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesture Control PPT - 新设计方案</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #0f1629;
            --bg-card: #151d2e;
            --bg-card-hover: #1c263a;
            --border-color: #2a3a5c;
            --border-color-light: #3a4a6c;
            --text-primary: #f0f4ff;
            --text-secondary: #8892a8;
            --text-muted: #5a6478;
            --accent-primary: #4a9eff;
            --accent-primary-light: #6ab0ff;
            --accent-primary-dark: #3a8ef0;
            --accent-success: #00d4aa;
            --accent-warning: #ffb84d;
            --accent-danger: #ff6b6b;
            --accent-info: #6c5ce7;
            --gradient-start: #1a237e;
            --gradient-end: #0d47a1;
            --glow-primary: rgba(74, 158, 255, 0.3);
            --glow-success: rgba(0, 212, 170, 0.3);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-xl: 24px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
        }
        
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            position: relative;
        }
        
        /* 背景装饰 */
        .bg-decoration {
            position: absolute;
            top: -200px;
            right: -100px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(74, 158, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        
        .bg-decoration-2 {
            position: absolute;
            bottom: -150px;
            left: -80px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(108, 92, 231, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        
        /* 导航栏 */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: linear-gradient(180deg, rgba(15, 22, 41, 0.95) 0%, rgba(10, 14, 23, 0.9) 100%);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(42, 58, 92, 0.5);
            z-index: 100;
            position: relative;
        }
        
        .navbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .logo {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-info) 100%);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 4px 20px var(--glow-primary);
        }
        
        .logo::before {
            content: '';
            position: absolute;
            inset: 2px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: calc(var(--radius-md) - 2px);
        }
        
        .logo-icon {
            width: 24px;
            height: 24px;
            position: relative;
            z-index: 1;
        }
        
        .logo-icon::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 6px;
            background: white;
            border-radius: 3px;
        }
        
        .logo-icon::after {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 12px;
            background: white;
            border-radius: 2px;
            box-shadow: -6px 0 0 white, 6px 0 0 white;
        }
        
        .brand-info {
            display: flex;
            flex-direction: column;
        }
        
        .brand-name {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        
        .brand-tagline {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        
        .navbar-center {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: all 0.3s ease;
        }
        
        .status-indicator.running {
            background: var(--accent-success);
            box-shadow: 0 0 12px var(--glow-success);
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }
        
        .status-text {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .navbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .nav-btn {
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text-secondary);
        }
        
        .nav-btn:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }
        
        .nav-btn.primary {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-primary-dark) 100%);
            color: white;
            box-shadow: 0 4px 15px var(--glow-primary);
        }
        
        .nav-btn.primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--glow-primary);
        }
        
        .nav-btn.success {
            background: linear-gradient(135deg, var(--accent-success) 0%, #00c096 100%);
            color: var(--bg-primary);
        }
        
        /* 主内容区 */
        .main-content {
            flex: 1;
            display: flex;
            padding: 20px 24px;
            gap: 20px;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        
        /* 摄像头区域 */
        .camera-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .camera-container {
            flex: 1;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            overflow: hidden;
            position: relative;
            min-height: 400px;
        }
        
        .camera-frame {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-card) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .camera-placeholder {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        
        .camera-icon-wrapper {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, rgba(74, 158, 255, 0.15) 0%, rgba(108, 92, 231, 0.15) 100%);
            border-radius: var(--radius-xl);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(74, 158, 255, 0.2);
            position: relative;
        }
        
        .camera-icon {
            width: 50px;
            height: 50px;
            position: relative;
        }
        
        .camera-icon::before {
            content: '';
            position: absolute;
            inset: 0;
            border: 4px solid var(--accent-primary);
            border-radius: 12px;
        }
        
        .camera-icon::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: var(--accent-primary);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--glow-primary);
        }
        
        .camera-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }
        
        .camera-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            max-width: 400px;
            line-height: 1.6;
        }
        
        .camera-overlay {
            position: absolute;
            inset: 20px;
            pointer-events: none;
        }
        
        .corner-bracket {
            position: absolute;
            width: 32px;
            height: 32px;
            border: 2px solid var(--accent-primary);
            opacity: 0.6;
        }
        
        .corner-bracket.top-left {
            top: 0;
            left: 0;
            border-right: none;
            border-bottom: none;
            border-radius: 6px 0 0 0;
        }
        
        .corner-bracket.top-right {
            top: 0;
            right: 0;
            border-left: none;
            border-bottom: none;
            border-radius: 0 6px 0 0;
        }
        
        .corner-bracket.bottom-left {
            bottom: 40px;
            left: 0;
            border-right: none;
            border-top: none;
            border-radius: 0 0 0 6px;
        }
        
        .corner-bracket.bottom-right {
            bottom: 40px;
            right: 0;
            border-left: none;
            border-top: none;
            border-radius: 0 0 6px 0;
        }
        
        .live-indicator {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 107, 107, 0.15);
            border: 1px solid rgba(255, 107, 107, 0.3);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        
        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-danger);
            border-radius: 50%;
            animation: blink 1s ease-in-out infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .live-text {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-danger);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        /* 事件通知条 */
        .event-bar {
            height: 52px;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 24px;
            gap: 12px;
            transition: all 0.3s ease;
        }
        
        .event-bar.active {
            background: rgba(0, 212, 170, 0.1);
            border-color: rgba(0, 212, 170, 0.3);
        }
        
        .event-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .event-icon svg {
            width: 100%;
            height: 100%;
        }
        
        .event-text {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .event-bar.active .event-text {
            color: var(--accent-success);
        }
        
        .event-bar.idle .event-text {
            color: var(--text-secondary);
        }
        
        /* 右侧面板 */
        .right-panel {
            width: 360px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        /* 控制面板卡片 */
        .control-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            padding: 20px;
        }
        
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        
        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .card-title::before {
            content: '';
            width: 3px;
            height: 18px;
            background: linear-gradient(180deg, var(--accent-primary) 0%, var(--accent-info) 100%);
            border-radius: 2px;
        }
        
        .card-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
            background: rgba(74, 158, 255, 0.15);
            color: var(--accent-primary);
        }
        
        /* 快捷键列表 */
        .hotkey-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .hotkey-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-sm);
            transition: all 0.2s ease;
        }
        
        .hotkey-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        
        .hotkey-key {
            min-width: 44px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(74, 158, 255, 0.2) 0%, rgba(108, 92, 231, 0.2) 100%);
            border: 1px solid rgba(74, 158, 255, 0.3);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .hotkey-desc {
            font-size: 13px;
            color: var(--text-secondary);
            flex: 1;
        }
        
        /* 主按钮 */
        .main-btn {
            width: 100%;
            padding: 16px;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .main-btn.start {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-info) 100%);
            color: white;
            box-shadow: 0 4px 20px var(--glow-primary);
        }
        
        .main-btn.start:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--glow-primary);
        }
        
        .main-btn.stop {
            background: linear-gradient(135deg, var(--accent-danger) 0%, #ee5a5a 100%);
            color: white;
            box-shadow: 0 4px 20px rgba(255, 107, 107, 0.3);
        }
        
        .main-btn.stop:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 107, 107, 0.3);
        }
        
        .btn-icon {
            width: 18px;
            height: 18px;
            position: relative;
        }
        
        .btn-icon.play::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-40%, -50%);
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 8px 0 8px 12px;
            border-color: transparent transparent transparent white;
        }
        
        .btn-icon.stop::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            background: white;
            border-radius: 2px;
            box-shadow: 6px 0 0 white;
        }
        
        /* 手势说明卡片 */
        .gesture-card {
            flex: 1;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            padding: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .gesture-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            padding-right: 4px;
        }
        
        .gesture-list::-webkit-scrollbar {
            width: 6px;
        }
        
        .gesture-list::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .gesture-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }
        
        .gesture-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-md);
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }
        
        .gesture-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--border-color-light);
        }
        
        .gesture-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }
        
        .gesture-icon.one {
            background: rgba(0, 212, 170, 0.15);
            border: 1px solid rgba(0, 212, 170, 0.3);
        }
        
        .gesture-icon.two {
            background: rgba(74, 158, 255, 0.15);
            border: 1px solid rgba(74, 158, 255, 0.3);
        }
        
        .gesture-icon.three {
            background: rgba(255, 184, 77, 0.15);
            border: 1px solid rgba(255, 184, 77, 0.3);
        }
        
        .gesture-icon.five {
            background: rgba(255, 107, 107, 0.15);
            border: 1px solid rgba(255, 107, 107, 0.3);
        }
        
        .finger-line {
            position: absolute;
            width: 4px;
            background: currentColor;
            border-radius: 2px;
        }
        
        .gesture-icon.one .finger-line {
            color: var(--accent-success);
            height: 20px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .gesture-icon.two .finger-line {
            color: var(--accent-primary);
            height: 20px;
        }
        
        .gesture-icon.two .finger-line:nth-child(1) {
            top: 50%;
            left: 35%;
            transform: translateY(-50%);
        }
        
        .gesture-icon.two .finger-line:nth-child(2) {
            top: 50%;
            right: 35%;
            transform: translateY(-50%);
        }
        
        .gesture-icon.three .finger-line {
            color: var(--accent-warning);
            height: 20px;
        }
        
        .gesture-icon.three .finger-line:nth-child(1) {
            top: 50%;
            left: 28%;
            transform: translateY(-50%);
        }
        
        .gesture-icon.three .finger-line:nth-child(2) {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .gesture-icon.three .finger-line:nth-child(3) {
            top: 50%;
            right: 28%;
            transform: translateY(-50%);
        }
        
        .gesture-icon.five .finger-line {
            color: var(--accent-danger);
            height: 18px;
        }
        
        .gesture-icon.five .finger-line:nth-child(1) {
            top: 52%;
            left: 22%;
            transform: translateY(-50%);
        }
        
        .gesture-icon.five .finger-line:nth-child(2) {
            top: 50%;
            left: 38%;
            transform: translateY(-50%);
        }
        
        .gesture-icon.five .finger-line:nth-child(3) {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .gesture-icon.five .finger-line:nth-child(4) {
            top: 50%;
            right: 38%;
            transform: translateY(-50%);
        }
        
        .gesture-icon.five .finger-line:nth-child(5) {
            top: 52%;
            right: 22%;
            transform: translateY(-50%);
        }
        
        .gesture-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .gesture-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .gesture-action {
            font-size: 12px;
            color: var(--text-muted);
        }
        
        .gesture-badge {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
        }
        
        .gesture-badge.next {
            background: var(--accent-success);
            color: var(--bg-primary);
        }
        
        .gesture-badge.prev {
            background: var(--accent-warning);
            color: var(--bg-primary);
        }
        
        .gesture-badge.quit {
            background: var(--accent-danger);
            color: white;
        }
        
        .gesture-badge.toggle {
            background: var(--accent-primary);
            color: white;
        }
        
        /* 底部状态栏 */
        .status-bar {
            height: 44px;
            background: rgba(15, 22, 41, 0.9);
            border-top: 1px solid rgba(42, 58, 92, 0.5);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            backdrop-filter: blur(20px);
        }
        
        .status-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .status-icon {
            font-size: 14px;
        }
        
        .status-text-left {
            font-size: 12px;
            color: var(--text-muted);
        }
        
        .status-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-success);
        }
        
        .status-label {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        /* 升级弹窗 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-color);
            padding: 32px;
            width: 420px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .modal-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-info) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px var(--glow-primary);
        }
        
        .modal-icon svg {
            width: 32px;
            height: 32px;
        }
        
        .modal-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        
        .modal-desc {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 24px;
        }
        
        .modal-version {
            display: inline-block;
            padding: 6px 14px;
            background: rgba(74, 158, 255, 0.15);
            border: 1px solid rgba(74, 158, 255, 0.3);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-primary);
            margin-bottom: 24px;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 14px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            border: none;
            outline: none;
        }
        
        .modal-btn.primary {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-info) 100%);
            color: white;
        }
        
        .modal-btn.primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px var(--glow-primary);
        }
        
        .modal-btn.secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        
        .modal-btn.secondary:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }
        
        /* 响应式设计 */
        @media (max-width: 1024px) {
            .right-panel {
                width: 320px;
            }
            
            .camera-title {
                font-size: 20px;
            }
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .right-panel {
                width: 100%;
            }
            
            .navbar-center {
                display: none;
            }
            
            .camera-title {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="bg-decoration"></div>
        <div class="bg-decoration-2"></div>
        
        <!-- 导航栏 -->
        <nav class="navbar">
            <div class="navbar-left">
                <div class="logo">
                    <div class="logo-icon"></div>
                </div>
                <div class="brand-info">
                    <div class="brand-name">Gesture Control</div>
                    <div class="brand-tagline">PPT 演示助手</div>
                </div>
            </div>
            
            <div class="navbar-center">
                <div class="status-indicator"></div>
                <span class="status-text">已停止</span>
            </div>
            
            <div class="navbar-right">
                <button class="nav-btn">English</button>
                <button class="nav-btn primary">升级</button>
                <button class="nav-btn">日志</button>
            </div>
        </nav>
        
        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 摄像头区域 -->
            <section class="camera-section">
                <div class="camera-container">
                    <div class="camera-frame">
                        <div class="camera-placeholder">
                            <div class="camera-icon-wrapper">
                                <div class="camera-icon"></div>
                            </div>
                            <div class="camera-title">PPT 演示助手</div>
                            <div class="camera-subtitle">请先打开本软件，并点击启动按钮。然后打开PPT，并正式播放后，可使用手势控制</div>
                        </div>
                    </div>
                    <div class="camera-overlay">
                        <div class="corner-bracket top-left"></div>
                        <div class="corner-bracket top-right"></div>
                        <div class="corner-bracket bottom-left"></div>
                        <div class="corner-bracket bottom-right"></div>
                    </div>
                </div>
                
                <div class="event-bar idle">
                    <div class="event-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 6v6l4 2"/>
                        </svg>
                    </div>
                    <span class="event-text">等待手势操作...</span>
                </div>
            </section>
            
            <!-- 右侧面板 -->
            <aside class="right-panel">
                <!-- 控制面板 -->
                <div class="control-card">
                    <div class="card-header">
                        <h3 class="card-title">快捷键</h3>
                    </div>
                    
                    <div class="hotkey-list">
                        <div class="hotkey-item">
                            <div class="hotkey-key">Space</div>
                            <span class="hotkey-desc">开始 / 停止</span>
                        </div>
                        <div class="hotkey-item">
                            <div class="hotkey-key">Q</div>
                            <span class="hotkey-desc">退出演示</span>
                        </div>
                        <div class="hotkey-item">
                            <div class="hotkey-key">L</div>
                            <span class="hotkey-desc">切换演讲者视图</span>
                        </div>
                    </div>
                    
                    <button class="main-btn start">
                        <span class="btn-icon play"></span>
                        开始演示
                    </button>
                </div>
                
                <!-- 手势说明 -->
                <div class="gesture-card">
                    <div class="card-header">
                        <h3 class="card-title">操作说明</h3>
                        <span class="card-badge">4种手势</span>
                    </div>
                    
                    <div class="gesture-list">
                        <div class="gesture-item">
                            <div class="gesture-icon one">
                                <div class="finger-line"></div>
                            </div>
                            <div class="gesture-info">
                                <div class="gesture-name">1根手指</div>
                                <div class="gesture-action">控制鼠标移动</div>
                            </div>
                            <span class="gesture-badge next">下一页</span>
                        </div>
                        
                        <div class="gesture-item">
                            <div class="gesture-icon two">
                                <div class="finger-line"></div>
                                <div class="finger-line"></div>
                            </div>
                            <div class="gesture-info">
                                <div class="gesture-name">2根手指</div>
                                <div class="gesture-action">控制鼠标移动</div>
                            </div>
                            <span class="gesture-badge toggle">切换</span>
                        </div>
                        
                        <div class="gesture-item">
                            <div class="gesture-icon three">
                                <div class="finger-line"></div>
                                <div class="finger-line"></div>
                                <div class="finger-line"></div>
                            </div>
                            <div class="gesture-info">
                                <div class="gesture-name">3根手指</div>
                                <div class="gesture-action">控制鼠标移动</div>
                            </div>
                            <span class="gesture-badge prev">上一页</span>
                        </div>
                        
                        <div class="gesture-item">
                            <div class="gesture-icon five">
                                <div class="finger-line"></div>
                                <div class="finger-line"></div>
                                <div class="finger-line"></div>
                                <div class="finger-line"></div>
                                <div class="finger-line"></div>
                            </div>
                            <div class="gesture-info">
                                <div class="gesture-name">5根手指</div>
                                <div class="gesture-action">控制鼠标移动</div>
                            </div>
                            <span class="gesture-badge quit">退出</span>
                        </div>
                    </div>
                </div>
            </aside>
        </main>
        
        <!-- 底部状态栏 -->
        <footer class="status-bar">
            <div class="status-left">
                <span class="status-icon">⚠</span>
                <span class="status-text-left">提示：请在光线充足的环境中使用</span>
            </div>
            <div class="status-right">
                <div class="status-item">
                    <div class="status-dot"></div>
                    <span class="status-label">Camera Ready</span>
                </div>
                <div class="status-item">
                    <div class="status-dot"></div>
                    <span class="status-label">Gesture Idle</span>
                </div>
            </div>
        </footer>
    </div>
    
    <!-- 升级弹窗 -->
    <div class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <path d="M12 1v6m0 6v6m6-6h-6m-6 0h6"/>
                </svg>
            </div>
            <h2 class="modal-title">发现新版本</h2>
            <p class="modal-desc">检测到新版本 2.0.1，建议立即升级以获取更好的体验和功能。</p>
            <span class="modal-version">v2.0.1</span>
            <div class="modal-actions">
                <button class="modal-btn secondary">稍后升级</button>
                <button class="modal-btn primary">立即升级</button>
            </div>
        </div>
    </div>
</body>
</html>
