HTML

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智学方舟 - 小学初中语数英学习平台</title>
  <style>
    :root {
      --bg: #eef6ff;
      --surface: #ffffff;
      --surface-soft: #f7fbff;
      --primary: #1d74f5;
      --primary-dark: #1258c7;
      --primary-light: #d8eaff;
      --accent: #27a7ff;
      --text: #17324d;
      --muted: #6c8199;
      --border: #d7e7f7;
      --shadow: 0 16px 40px rgba(29, 116, 245, 0.12);
      --radius-lg: 22px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 1024px;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(39, 167, 255, 0.18), transparent 28%),
        radial-gradient(circle at 85% 15%, rgba(29, 116, 245, 0.14), transparent 26%),
        linear-gradient(135deg, #eef6ff 0%, #f8fbff 58%, #eaf4ff 100%);
    }

    .page {
      width: min(1180px, calc(100% - 64px));
      margin: 0 auto;
      padding: 28px 0 22px;
    }

    .navbar {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 18px 22px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 210px;
      margin-right: auto;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      color: #ffffff;
      font-size: 22px;
      font-weight: 800;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      box-shadow: 0 10px 24px rgba(29, 116, 245, 0.28);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--primary-dark);
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--muted);
    }

    .select-group {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }

    .select-group label {
      font-size: 14px;
      color: var(--muted);
      white-space: nowrap;
    }

    select {
      min-width: 88px;
      border: 0;
      outline: 0;
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      background: transparent;
      cursor: pointer;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .feature-btn {
      border: 0;
      outline: 0;
      padding: 11px 15px;
      color: var(--primary-dark);
      font-size: 14px;
      font-weight: 700;
      background: var(--primary-light);
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.2s ease, color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .feature-btn:hover {
      transform: translateY(-2px);
      background: #c9e1ff;
    }

    .feature-btn.active {
      color: #ffffff;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      box-shadow: 0 10px 22px rgba(29, 116, 245, 0.24);
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr 1.08fr;
      gap: 24px;
      margin-top: 24px;
    }

    .panel {
      min-height: 560px;
      padding: 24px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .panel-title {
      margin: 0;
      font-size: 22px;
      color: var(--primary-dark);
    }

    .tag {
      padding: 6px 10px;
      color: var(--primary-dark);
      font-size: 13px;
      font-weight: 700;
      background: var(--primary-light);
      border-radius: 999px;
    }

    .hint {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    textarea {
      width: 100%;
      height: 355px;
      resize: none;
      padding: 18px;
      color: var(--text);
      font-size: 16px;
      line-height: 1.7;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      outline: none;
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
      transition: border 0.2s ease, box-shadow 0.2s ease;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(39, 167, 255, 0.14);
    }

    .input-tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
    }

    .primary-btn,
    .ghost-btn {
      border: 0;
      outline: 0;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .primary-btn {
      color: #ffffff;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      box-shadow: 0 12px 22px rgba(29, 116, 245, 0.22);
    }

    .primary-btn:hover,
    .ghost-btn:hover {
      transform: translateY(-2px);
    }

    .ghost-btn {
      color: var(--primary-dark);
      background: var(--primary-light);
    }

    .result-panel {
      display: flex;
      flex-direction: column;
    }

    .result-box {
      flex: 1;
      max-height: 462px;
      overflow-y: auto;
      padding: 20px;
      background: linear-gradient(180deg, #f8fbff 0%, #ffffff 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      scroll-behavior: smooth;
    }

    .result-box::-webkit-scrollbar {
      width: 10px;
    }

    .result-box::-webkit-scrollbar-thumb {
      background: #b9d6f7;
      border-radius: 999px;
      border: 2px solid #f8fbff;
    }

    .result-card {
      margin-bottom: 16px;
      padding: 18px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: 0 8px 22px rgba(23, 50, 77, 0.05);
    }

    .result-card:last-child {
      margin-bottom: 0;
    }

    .result-card h3 {
      margin: 0 0 10px;
      color: var(--primary-dark);
      font-size: 18px;
    }

    .result-card p {
      margin: 8px 0;
      color: var(--text);
      line-height: 1.75;
    }

    .result-card ul {
      margin: 10px 0 0;
      padding-left: 20px;
      color: var(--text);
      line-height: 1.8;
    }

    .result-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .pill {
      padding: 5px 9px;
      color: var(--primary-dark);
      font-size: 12px;
      font-weight: 700;
      background: var(--primary-light);
      border-radius: 999px;
    }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 390px;
      text-align: center;
      color: var(--muted);
    }

    .empty-state strong {
      display: block;
      margin-bottom: 8px;
      color: var(--primary-dark);
      font-size: 20px;
    }

    .quick-examples {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .example-chip {
      border: 1px solid var(--border);
      padding: 8px 10px;
      color: var(--primary-dark);
      font-size: 13px;
      font-weight: 700;
      background: #ffffff;
      border-radius: 999px;
      cursor: pointer;
    }

    .footer {
      margin-top: 22px;
      padding: 18px;
      text-align: center;
      color: var(--primary-dark);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }

    @media (max-width: 1100px) {
      .page {
        width: calc(100% - 40px);
      }

      .navbar {
        flex-wrap: wrap;
      }

      .brand {
        width: 100%;
      }

      .actions {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="navbar">
      <div class="brand">
        <div class="brand-icon">舟</div>
        <div class="brand-text">
          <div class="brand-title">智学方舟</div>
          <div class="brand-subtitle">小学初中语数英学习平台</div>
        </div>
      </div>

      <div class="select-group">
        <label for="gradeSelect">年级</label>
        <select id="gradeSelect">
          <option value="小学">小学</option>
          <option value="初中">初中</option>
        </select>
      </div>

      <div class="select-group">
        <label for="subjectSelect">科目</label>
        <select id="subjectSelect">
          <option value="语文">语文</option>
          <option value="数学">数学</option>
          <option value="英语">英语</option>
        </select>
      </div>

      <nav class="actions" aria-label="功能切换">
        <button class="feature-btn active" data-feature="micro">微课讲解</button>
        <button class="feature-btn" data-feature="solve">解题助手</button>
        <button class="feature-btn" data-feature="mistake">错题整理</button>
        <button class="feature-btn" data-feature="paper">智能组卷</button>
      </nav>
    </header>

    <main class="hero">
      <section class="panel">
        <div class="panel-header">
          <h1 class="panel-title">学习输入区</h1>
          <span class="tag" id="currentModeTag">微课讲解</span>
        </div>
        <p class="hint">输入知识点、题目或学习需求，点击右侧功能按钮可模拟切换不同学习场景。</p>
        <textarea id="studyInput" placeholder="例如：请讲解分数加减法的核心方法，或输入一道需要解析的题目。"></textarea>

        <div class="quick-examples">
          <button class="example-chip" data-text="讲解《春晓》的诗意和重点字词。">语文示例</button>
          <button class="example-chip" data-text="计算：一辆车2小时行驶90千米，平均每小时行驶多少千米？">数学示例</button>
          <button class="example-chip" data-text="讲解一般现在时中第三人称单数的用法。">英语示例</button>
        </div>

        <div class="input-tools">
          <button class="ghost-btn" id="clearBtn">清空输入</button>
          <button class="primary-btn" id="generateBtn">生成演示结果</button>
        </div>
      </section>

      <section class="panel result-panel">
        <div class="panel-header">
          <h2 class="panel-title">智能展示区</h2>
          <span class="tag" id="contextTag">小学 · 语文</span>
        </div>
        <div class="result-box" id="resultBox">
          <div class="empty-state">
            <div>
              <strong>选择功能，开始学习演示</strong>
              <span>系统将在这里展示微课、解析、错题或组卷内容。</span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">以智为舟，载你驶向满分彼岸</footer>
  </div>

  <script>
    const featureButtons = document.querySelectorAll(".feature-btn");
    const gradeSelect = document.getElementById("gradeSelect");
    const subjectSelect = document.getElementById("subjectSelect");
    const studyInput = document.getElementById("studyInput");
    const resultBox = document.getElementById("resultBox");
    const currentModeTag = document.getElementById("currentModeTag");
    const contextTag = document.getElementById("contextTag");
    const generateBtn = document.getElementById("generateBtn");
    const clearBtn = document.getElementById("clearBtn");
    const exampleChips = document.querySelectorAll(".example-chip");

    let activeFeature = "micro";

    const featureMap = {
      micro: {
        title: "微课讲解",
        heading: "知识点微课",
        points: [
          "用简明步骤拆解核心概念，先理解，再练习。",
          "结合当前年级与科目，给出适合课堂复习的学习路径。",
          "最后提供一个小练习，帮助巩固刚学到的内容。"
        ],
        suggestion: "建议学习节奏：概念理解 3 分钟，例题演示 5 分钟，自主练习 8 分钟。"
      },
      solve: {
        title: "解题助手",
        heading: "题目解析",
        points: [
          "先定位题目考查点，再提取题干中的关键条件。",
          "按步骤展示思路，避免直接跳到答案。",
          "补充易错提醒，帮助形成稳定的解题方法。"
        ],
        suggestion: "建议先独立思考 1 分钟，再对照解析检查每一步是否清楚。"
      },
      mistake: {
        title: "错题整理",
        heading: "错题归纳",
        points: [
          "记录错误原因：概念不清、计算失误、审题遗漏或表达不完整。",
          "提炼同类题型的解题模板，方便下次快速识别。",
          "生成复习标签，便于后续集中训练。"
        ],
        suggestion: "建议将本题加入“本周复盘”，隔天再做一次同类题。"
      },
      paper: {
        title: "智能组卷",
        heading: "练习卷生成",
        points: [
          "围绕输入内容生成基础题、提升题和综合应用题。",
          "题量可按课堂小测设计，兼顾知识覆盖与难度梯度。",
          "附带简要答案方向，便于教师或学生自查。"
        ],
        suggestion: "建议组卷结构：基础 5 题，提升 3 题，综合 2 题。"
      }
    };

    function updateContext() {
      contextTag.textContent = `${gradeSelect.value} · ${subjectSelect.value}`;
      currentModeTag.textContent = featureMap[activeFeature].title;
    }

    function getInputText() {
      return studyInput.value.trim() || "暂未输入具体内容，可先选择左侧示例或输入知识点/题目。";
    }

    function renderResult() {
      const grade = gradeSelect.value;
      const subject = subjectSelect.value;
      const input = getInputText();
      const feature = featureMap[activeFeature];

      resultBox.innerHTML = `
        <article class="result-card">
          <div class="result-meta">
            <span class="pill">${grade}</span>
            <span class="pill">${subject}</span>
            <span class="pill">${feature.title}</span>
          </div>
          <h3>${feature.heading}</h3>
          <p><strong>输入内容：</strong>${escapeHtml(input)}</p>
          <p><strong>演示反馈：</strong>智学方舟已根据当前学习场景生成一份前端模拟结果。</p>
        </article>
        <article class="result-card">
          <h3>学习步骤</h3>
          <ul>
            ${feature.points.map(point => `<li>${point}</li>`).join("")}
          </ul>
        </article>
        <article class="result-card">
          <h3>示例输出</h3>
          <p>${createDemoText(activeFeature, subject)}</p>
          <p><strong>学习建议：</strong>${feature.suggestion}</p>
        </article>
      `;
      resultBox.scrollTop = 0;
    }

    function createDemoText(type, subject) {
      const demo = {
        micro: `这是一个${subject}微课演示：先用生活化例子引入知识点，再归纳关键方法，最后用一道小题检测掌握情况。`,
        solve: `这是一个${subject}解题演示：系统会标出关键条件，列出解题步骤，并提示容易出错的位置。`,
        mistake: `这是一个${subject}错题整理演示：系统会归纳错误原因、对应知识点和下次复习重点。`,
        paper: `这是一个${subject}智能组卷演示：系统会围绕输入内容生成分层练习题，覆盖基础、提升和综合应用。`
      };
      return demo[type];
    }

    function escapeHtml(text) {
      return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    featureButtons.forEach(button => {
      button.addEventListener("click", () => {
        featureButtons.forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        activeFeature = button.dataset.feature;
        updateContext();
        renderResult();
      });
    });

    gradeSelect.addEventListener("change", () => {
      updateContext();
      renderResult();
    });

    subjectSelect.addEventListener("change", () => {
      updateContext();
      renderResult();
    });

    generateBtn.addEventListener("click", renderResult);

    clearBtn.addEventListener("click", () => {
      studyInput.value = "";
      resultBox.innerHTML = `
        <div class="empty-state">
          <div>
            <strong>输入已清空</strong>
            <span>请重新输入知识点或题目，再生成演示结果。</span>
          </div>
        </div>
      `;
    });

    exampleChips.forEach(chip => {
      chip.addEventListener("click", () => {
        studyInput.value = chip.dataset.text;
        renderResult();
      });
    });

    updateContext();
  </script>
</body>
</html>
