<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智阅笔记 - AI 读书笔记助手</title>
<style>
  :root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --primary-light: #eef2ff;
    --bg: #f8fafc;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.05);
    --radius: 12px;
    --radius-lg: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* 顶部导航 */
  .nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow-sm);
  }
  .nav-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--primary), #8b5cf6);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: #fff;
  }
  .brand {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }
  .brand span { color: var(--primary); }
  .nav-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .nav-badge {
    background: var(--primary-light);
    color: var(--primary-dark);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }
  .avatar {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
  }

  /* 主容器 */
  .main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px;
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 24px;
  }

  /* 侧边栏 */
  .sidebar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px;
    height: fit-content;
    position: sticky;
    top: 84px;
  }
  .sidebar-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
    padding: 0 8px;
  }
  .note-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 20px;
  }
  .note-item {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-secondary);
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .note-item:hover {
    background: var(--bg);
    color: var(--text);
  }
  .note-item.active {
    background: var(--primary-light);
    color: var(--primary-dark);
    font-weight: 600;
  }
  .note-item .icon { font-size: 16px; }
  .new-note-btn {
    width: 100%;
    padding: 10px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .new-note-btn:hover { background: var(--primary-dark); }

  /* 工作区 */
  .workspace {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    min-height: 600px;
  }

  /* 工作区头部 */
  .ws-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .ws-title {
    font-size: 20px;
    font-weight: 700;
  }
  .ws-tabs {
    display: flex;
    gap: 4px;
    background: var(--bg);
    padding: 4px;
    border-radius: 10px;
  }
  .tab-btn {
    padding: 8px 16px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 500;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab-btn.active {
    background: var(--surface);
    color: var(--primary-dark);
    box-shadow: var(--shadow-sm);
    font-weight: 600;
  }
  .tab-btn:hover:not(.active) { color: var(--text); }

  /* 内容区 */
  .ws-body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 500px;
  }
  .ws-panel {
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
  }
  .ws-panel:first-child {
    border-right: 1px solid var(--border);
  }
  .panel-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .panel-label .count {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-muted);
  }

  /* 输入区 */
  .input-section {
    margin-bottom: 14px;
  }
  .input-section label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .text-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: var(--surface);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .text-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
  }
  textarea.text-input {
    resize: vertical;
    min-height: 180px;
    line-height: 1.7;
  }
  .generate-btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, var(--primary), #8b5cf6);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 8px;
  }
  .generate-btn:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }
  .generate-btn:active { transform: translateY(0); }
  .generate-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }
  .generate-btn .loading-icon {
    display: none;
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .generate-btn.loading .loading-icon { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 快速示例 */
  .quick-examples {
    margin-top: 16px;
  }
  .quick-examples .label {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .example-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .example-chip {
    padding: 5px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 12px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s;
  }
  .example-chip:hover {
    background: var(--primary-light);
    border-color: var(--primary);
    color: var(--primary-dark);
  }

  /* 输出面板 */
  .output-area {
    flex: 1;
    overflow-y: auto;
    padding-right: 8px;
  }
  .output-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-muted);
    text-align: center;
    padding: 40px;
  }
  .output-empty .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
  .output-empty .hint { font-size: 13px; }

  /* 摘要结果 */
  .result-section {
    margin-bottom: 20px;
  }
  .result-section h3 {
    font-size: 15px;
    font-weight: 700;
    color: var(--primary-dark);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .result-section h3 .emoji { font-size: 16px; }
  .summary-text {
    font-size: 14px;
    line-height: 1.8;
    color: var(--text);
    background: var(--bg);
    padding: 14px 16px;
    border-radius: 10px;
    border-left: 3px solid var(--primary);
  }

  /* 要点列表 */
  .point-list {
    list-style: none;
    padding: 0;
  }
  .point-item {
    padding: 10px 14px;
    background: var(--bg);
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 14px;
    line-height: 1.6;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .point-item .num {
    flex-shrink: 0;
    width: 22px; height: 22px;
    background: var(--primary);
    color: #fff;
    border-radius: 50%;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
  }
  .point-item strong { color: var(--text); }

  /* 知识卡片 */
  .cards-grid {
    display: grid;
    gap: 10px;
  }
  .knowledge-card {
    background: linear-gradient(135deg, #fef3c7, #fde68a);
    border-radius: 10px;
    padding: 14px 16px;
    position: relative;
  }
  .knowledge-card:nth-child(2) {
    background: linear-gradient(135deg, #dbeafe, #bfdbfe);
  }
  .knowledge-card:nth-child(3) {
    background: linear-gradient(135deg, #d1fae5, #a7f3d0);
  }
  .knowledge-card:nth-child(4) {
    background: linear-gradient(135deg, #fce7f3, #fbcfe8);
  }
  .knowledge-card .quote {
    font-size: 14px;
    color: var(--text);
    font-weight: 500;
    line-height: 1.6;
    font-style: italic;
  }
  .knowledge-card .source {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 6px;
    text-align: right;
  }

  /* 思维导图 */
  .mindmap {
    background: var(--bg);
    border-radius: 10px;
    padding: 20px;
    position: relative;
  }
  .mindmap-center {
    background: var(--primary);
    color: #fff;
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 15px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 20px;
    display: inline-block;
    position: relative;
    left: 50%;
    transform: translateX(-50%);
  }
  .mindmap-branches {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .mindmap-branch {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .branch-line {
    width: 2px;
    min-height: 24px;
    background: var(--primary);
    flex-shrink: 0;
    position: relative;
  }
  .branch-line::before {
    content: "";
    position: absolute;
    top: 8px;
    left: 0;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--primary);
    margin-left: -3px;
  }
  .branch-content {
    flex: 1;
  }
  .branch-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--primary-dark);
    margin-bottom: 4px;
  }
  .branch-sub {
    font-size: 12px;
    color: var(--text-secondary);
    padding-left: 12px;
    margin-bottom: 2px;
  }

  /* Tab 内容切换 */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* 操作栏 */
  .action-bar {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .action-btn {
    flex: 1;
    padding: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 12px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .action-btn:hover {
    background: var(--primary-light);
    border-color: var(--primary);
    color: var(--primary-dark);
  }

  /* 底部信息 */
  .footer {
    text-align: center;
    padding: 24px;
    font-size: 12px;
    color: var(--text-muted);
  }

  /* 响应式 */
  @media (max-width: 960px) {
    .main { grid-template-columns: 1fr; }
    .sidebar { position: static; }
    .ws-body { grid-template-columns: 1fr; }
    .ws-panel:first-child { border-right: none; border-bottom: 1px solid var(--border); }
  }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
</style>
</head>
<body>

<!-- 顶部导航 -->
<div class="nav">
  <div class="nav-left">
    <div class="logo">📖</div>
    <div class="brand">智阅<span>笔记</span></div>
    <div class="nav-badge">AI 读书笔记助手</div>
  </div>
  <div class="nav-right">
    <div class="nav-badge">⚡ 100 次/月</div>
    <div class="avatar">我</div>
  </div>
</div>

<div class="main">

  <!-- 侧边栏 -->
  <div class="sidebar">
    <button class="new-note-btn" onclick="newNote()">
      <span>＋</span> 新建笔记
    </button>

    <div style="margin-top:20px;">
      <div class="sidebar-title">我的笔记</div>
      <div class="note-list">
        <div class="note-item active" onclick="switchNote(this, 0)">
          <span class="icon">📘</span>
          <span>原子习惯</span>
        </div>
        <div class="note-item" onclick="switchNote(this, 1)">
          <span class="icon">📗</span>
          <span>思考，快与慢</span>
        </div>
        <div class="note-item" onclick="switchNote(this, 2)">
          <span class="icon">📕</span>
          <span>人类简史</span>
        </div>
      </div>
    </div>

    <div>
      <div class="sidebar-title">最近导入</div>
      <div class="note-list">
        <div class="note-item">
          <span class="icon">📄</span>
          <span>产品方法论.pdf</span>
        </div>
        <div class="note-item">
          <span class="icon">📄</span>
          <span>第3章 行为设计</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 工作区 -->
  <div class="workspace">
    <div class="ws-header">
      <div class="ws-title" id="noteTitle">原子习惯 · 读书笔记</div>
      <div class="ws-tabs">
        <button class="tab-btn active" onclick="switchTab(this, 'summary')">📝 内容摘要</button>
        <button class="tab-btn" onclick="switchTab(this, 'mindmap')">🧠 思维导图</button>
        <button class="tab-btn" onclick="switchTab(this, 'cards')">💳 知识卡片</button>
        <button class="tab-btn" onclick="switchTab(this, 'review')">🔄 复习模式</button>
      </div>
    </div>

    <div class="ws-body">
      <!-- 左侧输入区 -->
      <div class="ws-panel">
        <div class="input-section">
          <label>书籍/章节名称</label>
          <input type="text" class="text-input" id="bookTitle" value="原子习惯（第1-3章）" placeholder="请输入书籍或章节名称">
        </div>
        <div class="panel-label">
          <span>粘贴书籍内容</span>
          <span class="count" id="charCount">0 字</span>
        </div>
        <textarea class="text-input" id="bookContent" placeholder="在这里粘贴书籍章节内容，AI 将自动生成结构化读书笔记..."></textarea>

        <button class="generate-btn" id="genBtn" onclick="generateNote()">
          <span class="loading-icon"></span>
          <span class="btn-text">✨ 生成读书笔记</span>
        </button>

        <div class="quick-examples">
          <div class="label">快速填充示例：</div>
          <div class="example-chips">
            <span class="example-chip" onclick="fillExample(0)">原子习惯摘要</span>
            <span class="example-chip" onclick="fillExample(1)">思考快与慢</span>
            <span class="example-chip" onclick="fillExample(2)">人类简史节选</span>
          </div>
        </div>
      </div>

      <!-- 右侧输出区 -->
      <div class="ws-panel">
        <div class="panel-label">
          <span>AI 生成结果</span>
          <span class="count" id="resultCount">—</span>
        </div>
        <div class="output-area" id="outputArea">
          <div class="output-empty">
            <div class="icon">🤖</div>
            <div>左侧粘贴书籍内容</div>
            <div class="hint">点击"生成读书笔记"，AI 将自动提取核心观点、生成摘要和知识卡片</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="footer">
  智阅笔记 · 由 AI 驱动的读书笔记助手 · Demo 版本
</div>

<script>
// 示例内容
const examples = [
  {
    title: "原子习惯（第1-3章）",
    content: `习惯是自我提升的复利。每天进步1%，一年后你会进步37倍；每天退步1%，一年后你会几乎归零。

改变习惯的最有效方法不是关注你想要达成的目标，而是关注你想要成为什么样的人。身份认同的转变是习惯改变的核心。

习惯养成的四个步骤：提示、渴望、反应、奖励。提示触发渴望，渴望激发反应，反应带来奖励。奖励满足渴望，又反过来让大脑记住这个循环。

要培养好习惯，就要让它显而易见、有吸引力、简便易行、令人满足。要戒掉坏习惯，就要让它隐而不见、缺乏吸引力、难以执行、令人不满。

环境设计比意志力更重要。与其依靠意志力抵抗诱惑，不如从一开始就设计一个让好习惯更容易、坏习惯更难的环境。`
  },
  {
    title: "思考，快与慢（节选）",
    content: `我们的大脑有两个思维系统：系统1和系统2。系统1是直觉思维，快速、自动、不费力；系统2是理性思维，缓慢、审慎、需要集中注意力。

系统1善于处理熟悉的事情，它会根据经验和直觉快速做出判断，但也容易犯错。系统2则负责复杂的计算和逻辑推理，但它很懒，通常会接受系统1的建议。

锚定效应：人们在做判断时，往往会被最初接触到的信息所"锚定"。比如先看到一个高价，再看正常价格，就会觉得正常价格很便宜。

可得性启发：人们判断事情发生的概率时，往往依据的是回忆起来的难易程度，而不是实际的统计数据。媒体报道越多的事情，人们越容易高估它的风险。

损失厌恶：人们对损失的痛苦感，是对获得的快乐感的两倍。所以失去100元的痛苦，需要得到200元才能弥补。`
  },
  {
    title: "人类简史（农业革命章节）",
    content: `农业革命是人类历史上最大的骗局。表面上看，农业让人类获得了更稳定的食物来源，但实际上，农民的生活比狩猎采集者更加辛苦，工作时间更长，营养更差，疾病更多。

let currentExample = 0;

// 填充示例
function fillExample(idx) {
  currentExample = idx;
  document.getElementById('bookTitle').value = examples[idx].title;
  document.getElementById('bookContent').value = examples[idx].content;
  updateCharCount();
  // 更新侧边栏激活状态
  const items = document.querySelectorAll('.note-item');
  items.forEach((item, i) => {
    if (i === idx) item.classList.add('active');
    else if (i < 3) item.classList.remove('active');
  });
  document.getElementById('noteTitle').textContent = examples[idx].title.split('（')[0] + ' · 读书笔记';
}

// 更新字数
function updateCharCount() {
  const content = document.getElementById('bookContent').value;
  document.getElementById('charCount').textContent = content.length + ' 字';
}
document.getElementById('bookContent').addEventListener('input', updateCharCount);

// 切换笔记
function switchNote(el, idx) {
  if (idx >= examples.length) return;
  fillExample(idx);
}

// 切换标签
function switchTab(btn, tabName) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  // 如果还没生成结果，不处理
  const output = document.getElementById('outputArea');
  if (output.querySelector('.output-empty')) return;

  const result = generatedResults[0];
  let html = '';

  if (tabName === 'summary') {
    html = renderSummary(result);
  } else if (tabName === 'mindmap') {
    html = renderMindmap(result);
  } else if (tabName === 'cards') {
    html = renderCards(result);
  } else if (tabName === 'review') {
    html = renderReview(result);
  }

  output.innerHTML = html + renderActionBar();
}

// 生成笔记
function generateNote() {
  const content = document.getElementById('bookContent').value.trim();
  if (!content) {
    alert('请先粘贴书籍内容，或点击下方示例快速填充～');
    return;
  }

  const btn = document.getElementById('genBtn');
  btn.classList.add('loading');
  btn.disabled = true;
  btn.querySelector('.btn-text').textContent = 'AI 正在生成中...';

  const output = document.getElementById('outputArea');
  output.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:300px;gap:16px;">
      <div style="width:40px;height:40px;border:3px solid var(--primary-light);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;"></div>
      <div style="color:var(--text-secondary);font-size:14px;">AI 正在阅读并提炼核心观点...</div>
      <div style="color:var(--text-muted);font-size:12px;">预计需要 10-20 秒</div>
    </div>
  `;

  setTimeout(() => {
    const result = generatedResults[0];
    output.innerHTML = renderSummary(result) + renderActionBar();
    document.getElementById('resultCount').textContent = '5 个核心要点';
    btn.classList.remove('loading');
    btn.disabled = false;
    btn.querySelector('.btn-text').textContent = '✨ 重新生成';
  }, 2000);
}

// 渲染摘要
function renderSummary(result) {
  let pointsHtml = result.points.map((p, i) => `
    <div class="point-item">
      <div class="num">${i+1}</div>
      <div><strong>${p.title}</strong> — ${p.desc}</div>
    </div>
  `).join('');

  return `
    <div class="result-section">
      <h3><span class="emoji">📝</span> 内容摘要</h3>
      <div class="summary-text">${result.summary}</div>
    </div>
    <div class="result-section">
      <h3><span class="emoji">🎯</span> 核心观点</h3>
      <div class="point-list">${pointsHtml}</div>
    </div>
  `;
}

  const branches = result.mindmap.map(b => `

      <div class="branch-content">
        <div class="branch-title">${b.title}</div>
        ${b.subs.map(s => `<div class="branch-sub">• ${s}</div>`).join('')}
      </div>
    </div>
  `).join('');

  return `
    <div class="result-section">
      <h3><span class="emoji">🧠</span> 知识框架</h3>
      <div class="mindmap">
        <div class="mindmap-center">${examples[currentExample].title.split('（')[0]}</div>
        <div class="mindmap-branches">${branches}</div>
      </div>
    </div>
    <div class="result-section">
      <h3><span class="emoji">💡</span> 核心洞察</h3>
      <div class="summary-text">整本书的核心脉络围绕"习惯如何被设计"展开。从底层的复利理论，到中层的四步模型，再到上层的四条实操法则，构成了一套完整的习惯改造方法论。环境设计是贯穿始终的暗线——它提醒我们，比起对抗自己的本性，设计一个顺应本性的环境才是更聪明的做法。</div>

  `;
}
