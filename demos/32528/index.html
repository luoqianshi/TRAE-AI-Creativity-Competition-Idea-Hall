<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>治愈清理小世界</title>
<style>
/* ========== CSS Variables & Reset ========== */
:root {
  --cream: #FFF8E7;
  --peach: #FFE4C4;
  --pink: #FFB5C2;
  --mint: #B5EAD7;
  --sky: #C4E0F9;
  --lavender: #D5C6E0;
  --warm-yellow: #FFE0A3;
  --blush: #FFD1DC;
  --text: #5D4E37;
  --text-light: #8B7B6B;
  --shadow: rgba(180, 160, 140, 0.25);
  --card-bg: rgba(255, 255, 255, 0.7);
  --radius: 20px;
  --radius-sm: 12px;
  --radius-xs: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  background: linear-gradient(135deg, #FFF5E8 0%, #FFE8D6 25%, #FFE0EC 50%, #E8F4FD 75%, #F0E8F8 100%);
  background-attachment: fixed;
  min-height: 100vh;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  color: var(--text);
}

/* ========== Background Decorations ========== */
.bg-decorations {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
}
.decor {
  position: absolute; opacity: 0.35; animation: floatDecor 8s ease-in-out infinite;
}
.decor:nth-child(1) { top: 5%; left: 5%; font-size: 3rem; animation-delay: 0s; }
.decor:nth-child(2) { top: 12%; right: 8%; font-size: 2.5rem; animation-delay: 1.5s; }
.decor:nth-child(3) { top: 60%; left: 3%; font-size: 2rem; animation-delay: 3s; }
.decor:nth-child(4) { top: 75%; right: 5%; font-size: 3.5rem; animation-delay: 4.5s; }
.decor:nth-child(5) { top: 40%; left: 90%; font-size: 2.8rem; animation-delay: 2s; }
.decor:nth-child(6) { top: 85%; left: 50%; font-size: 2.2rem; animation-delay: 5.5s; }
.decor:nth-child(7) { top: 20%; left: 45%; font-size: 1.8rem; animation-delay: 6.5s; }
.decor:nth-child(8) { top: 50%; right: 15%; font-size: 2.6rem; animation-delay: 3.8s; }
@keyframes floatDecor {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-15px) rotate(3deg); }
  50% { transform: translateY(-8px) rotate(-2deg); }
  75% { transform: translateY(-20px) rotate(1deg); }
}

/* ========== Main Container ========== */
.game-container {
  position: relative; z-index: 1;
  max-width: 900px; margin: 0 auto; padding: 16px;
  display: flex; flex-direction: column; height: 100vh;
}

/* ========== Header ========== */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px;
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  border-radius: var(--radius);
  box-shadow: 0 4px 24px var(--shadow);
  margin-bottom: 12px;
  border: 1.5px solid rgba(255,255,255,0.6);
  flex-shrink: 0;
}
.header-left {
  display: flex; align-items: center; gap: 10px;
}
.title-badge {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px;
  background: linear-gradient(135deg, var(--pink), var(--lavender));
  border-radius: 50px;
  color: #fff;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 2px 8px rgba(255,181,194,0.4);
  white-space: nowrap;
}
.title-badge:hover {
  transform: scale(1.05);
  box-shadow: 0 4px 16px rgba(255,181,194,0.6);
}
.title-badge .icon { font-size: 1.3rem; }

.score-display {
  display: flex; align-items: center; gap: 6px;
  font-size: 1.1rem; font-weight: 700;
  color: var(--text);
}
.score-display .star { color: #FFB84D; font-size: 1.4rem; animation: pulseStar 1.5s ease-in-out infinite; }
@keyframes pulseStar {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.25); }
}

.header-right {
  display: flex; align-items: center; gap: 12px;
}
.milestone-btn {
  padding: 6px 14px;
  background: var(--mint);
  border: none; border-radius: 50px;
  color: var(--text);
  font-size: 0.85rem; font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 2px 8px rgba(181,234,215,0.4);
}
.milestone-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 4px 16px rgba(181,234,215,0.6);
}
.combo-display {
  font-size: 0.85rem; font-weight: 600;
  color: var(--pink);
  background: rgba(255,181,194,0.15);
  padding: 4px 10px; border-radius: 50px;
  opacity: 0; transition: opacity 0.3s;
  white-space: nowrap;
}
.combo-display.active { opacity: 1; animation: comboBounce 0.5s ease-out; }
@keyframes comboBounce {
  0% { transform: scale(0.5); }
  60% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

/* ========== Progress Bar ========== */
.progress-section {
  padding: 8px 20px;
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  border-radius: var(--radius);
  box-shadow: 0 4px 24px var(--shadow);
  margin-bottom: 12px;
  border: 1.5px solid rgba(255,255,255,0.6);
  flex-shrink: 0;
}
.progress-info {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 6px; font-size: 0.85rem; font-weight: 600;
}
.progress-bar-outer {
  height: 14px;
  background: rgba(255,255,255,0.5);
  border-radius: 50px;
  overflow: hidden;
  border: 2px solid rgba(255,255,255,0.8);
}
.progress-bar-inner {
  height: 100%;
  background: linear-gradient(90deg, var(--mint), var(--sky), var(--pink));
  border-radius: 50px;
  transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}
.progress-bar-inner::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  animation: shimmer 2s infinite;
}
@keyframes shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

/* ========== Game Scene ========== */
.game-scene {
  flex: 1;
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  border-radius: var(--radius);
  box-shadow: 0 4px 24px var(--shadow);
  border: 1.5px solid rgba(255,255,255,0.6);
  position: relative;
  overflow: hidden;
  min-height: 350px;
}
.scene-bg {
  position: absolute; inset: 0;
  background: 
    radial-gradient(ellipse at 30% 20%, rgba(255,181,194,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 60%, rgba(181,234,215,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 80%, rgba(196,224,249,0.1) 0%, transparent 50%);
}
/* Shelf / target zones */
.target-zones {
  position: absolute; inset: 0; padding: 20px;
  display: flex; flex-wrap: wrap; gap: 12px;
  align-content: flex-start; justify-content: center;
}
.target-zone {
  width: 90px; height: 90px;
  border: 3px dashed rgba(180,160,140,0.35);
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.7rem; color: rgba(180,160,140,0.4);
  transition: all 0.3s;
  position: relative;
  background: rgba(255,255,255,0.3);
}
.target-zone.highlight {
  border-color: var(--mint);
  background: rgba(181,234,215,0.2);
  animation: targetPulse 1s ease-in-out infinite;
}
@keyframes targetPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(181,234,215,0.4); }
  50% { box-shadow: 0 0 0 12px rgba(181,234,215,0); }
}
.target-zone.filled {
  border-style: solid;
  border-color: var(--mint);
  background: rgba(181,234,215,0.25);
}

/* Draggable items */
.scattered-items {
  position: absolute; inset: 0; pointer-events: none;
}
.game-item {
  position: absolute; pointer-events: auto;
  font-size: 2.8rem;
  cursor: grab;
  transition: transform 0.15s, filter 0.3s;
  filter: drop-shadow(0 3px 6px rgba(0,0,0,0.1));
  z-index: 2;
  animation: itemWiggle 3s ease-in-out infinite;
}
.game-item:nth-child(odd) { animation-delay: 0.5s; }
.game-item:nth-child(3n) { animation-delay: 1s; }
.game-item:nth-child(4n+1) { animation-delay: 1.5s; }
@keyframes itemWiggle {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(2deg); }
  75% { transform: rotate(-2deg); }
}
.game-item:hover {
  transform: scale(1.2) !important;
  filter: drop-shadow(0 6px 12px rgba(0,0,0,0.15)) brightness(1.1);
  z-index: 10;
}
.game-item:active { cursor: grabbing; }
.game-item.dragging {
  opacity: 0.85; transform: scale(1.15) !important;
  filter: drop-shadow(0 8px 16px rgba(0,0,0,0.2)) brightness(1.15);
  z-index: 100;
}
.game-item.cleaned {
  animation: cleanPop 0.5s ease-out forwards;
  pointer-events: none;
}
.game-item.powerup-item {
  animation: powerupGlow 1.5s ease-in-out infinite;
}
@keyframes powerupGlow {
  0%, 100% { filter: drop-shadow(0 3px 6px rgba(0,0,0,0.1)) drop-shadow(0 0 0px rgba(255,184,77,0)); }
  50% { filter: drop-shadow(0 3px 6px rgba(0,0,0,0.1)) drop-shadow(0 0 15px rgba(255,184,77,0.6)); }
}
@keyframes cleanPop {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.4); opacity: 0.8; }
  100% { transform: scale(0); opacity: 0; }
}

/* Cleaned item indicator in target zone */
.placed-item {
  font-size: 2.4rem;
  animation: placedBounce 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
}
@keyframes placedBounce {
  0% { transform: scale(0); }
  60% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

/* ========== PowerUp Bar ========== */
.powerup-section {
  padding: 10px 20px;
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  border-radius: var(--radius);
  box-shadow: 0 4px 24px var(--shadow);
  margin-top: 12px;
  border: 1.5px solid rgba(255,255,255,0.6);
  flex-shrink: 0;
}
.powerup-label {
  font-size: 0.8rem; font-weight: 600;
  color: var(--text-light); margin-bottom: 8px;
}
.powerup-list {
  display: flex; gap: 10px; flex-wrap: wrap;
}
.powerup-item {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 16px;
  background: linear-gradient(135deg, var(--warm-yellow), #FFD180);
  border: none; border-radius: 50px;
  color: var(--text);
  font-size: 0.85rem; font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 2px 8px rgba(255,224,163,0.5);
  position: relative;
  overflow: hidden;
}
.powerup-item:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(255,224,163,0.7);
}
.powerup-item:active {
  transform: scale(0.95);
}
.powerup-item .pu-icon { font-size: 1.3rem; }
.powerup-item .pu-count {
  background: rgba(255,255,255,0.5);
  border-radius: 50px;
  padding: 1px 7px;
  font-size: 0.75rem;
}
.powerup-empty {
  color: var(--text-light);
  font-size: 0.85rem;
  opacity: 0.6;
  font-style: italic;
}

/* ========== Modal Overlay ========== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
  animation: fadeIn 0.3s ease-out;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.modal-card {
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 32px;
  max-width: 420px; width: 90%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  border: 2px solid rgba(255,255,255,0.8);
  animation: modalPop 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
}
@keyframes modalPop {
  0% { transform: scale(0.5); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.modal-emoji {
  font-size: 4rem;
  animation: modalEmojiBounce 0.6s ease-out;
}
@keyframes modalEmojiBounce {
  0% { transform: scale(0) rotate(-20deg); }
  60% { transform: scale(1.3) rotate(5deg); }
  100% { transform: scale(1) rotate(0deg); }
}
.modal-title {
  font-size: 1.5rem; font-weight: 700;
  margin: 12px 0 8px;
  background: linear-gradient(135deg, var(--pink), var(--lavender));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.modal-message {
  font-size: 1rem; color: var(--text);
  line-height: 1.6; margin-bottom: 20px;
}
.modal-btn {
  padding: 12px 36px;
  background: linear-gradient(135deg, var(--pink), var(--lavender));
  border: none; border-radius: 50px;
  color: #fff; font-size: 1rem; font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 4px 16px rgba(255,181,194,0.4);
}
.modal-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 6px 24px rgba(255,181,194,0.6);
}

/* ========== Milestone Panel ========== */
.milestone-panel {
  position: fixed; right: 0; top: 0; bottom: 0;
  width: 320px; max-width: 85vw;
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  z-index: 999;
  box-shadow: -4px 0 30px rgba(0,0,0,0.1);
  border-left: 1.5px solid rgba(255,255,255,0.6);
  padding: 24px;
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 16px;
}
.milestone-panel.open {
  transform: translateX(0);
}
.milestone-panel h3 {
  font-size: 1.3rem; font-weight: 700;
  color: var(--text);
}
.milestone-panel .close-btn {
  position: absolute; top: 16px; right: 16px;
  width: 32px; height: 32px;
  border-radius: 50%; border: none;
  background: rgba(0,0,0,0.05);
  cursor: pointer; font-size: 1.2rem;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.milestone-panel .close-btn:hover { background: rgba(0,0,0,0.1); }

.stat-card {
  background: rgba(255,255,255,0.5);
  border-radius: var(--radius-sm);
  padding: 14px;
  display: flex; align-items: center; gap: 12px;
}
.stat-icon {
  font-size: 2rem; width: 50px; text-align: center;
}
.stat-info { flex: 1; }
.stat-label { font-size: 0.8rem; color: var(--text-light); margin-bottom: 2px; }
.stat-value { font-size: 1.3rem; font-weight: 700; color: var(--text); }

.title-list {
  display: flex; flex-direction: column; gap: 8px;
}
.title-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.5);
  transition: all 0.2s;
}
.title-item.unlocked { background: linear-gradient(135deg, rgba(255,224,163,0.5), rgba(255,181,194,0.3)); }
.title-item.locked { opacity: 0.5; }
.title-item .tl-icon { font-size: 1.5rem; }
.title-item .tl-name { font-weight: 600; font-size: 0.9rem; }
.title-item .tl-status { font-size: 0.75rem; margin-left: auto; }
.title-item .tl-status.unlocked { color: #FFB84D; }
.title-item .tl-status.locked { color: var(--text-light); }
.title-item.current { border: 2px solid var(--pink); }

/* ========== Celebrations / Particles ========== */
.particles-container {
  position: fixed; inset: 0; pointer-events: none; z-index: 999;
}
.particle {
  position: absolute;
  animation: particleFall 2.5s ease-in forwards;
  font-size: 1.5rem;
}
@keyframes particleFall {
  0% { transform: translateY(-10vh) rotate(0deg) scale(0); opacity: 1; }
  20% { transform: translateY(5vh) rotate(90deg) scale(1.2); }
  100% { transform: translateY(110vh) rotate(720deg) scale(0.3); opacity: 0; }
}

/* Power-up collect animation */
.powerup-collect {
  position: fixed;
  font-size: 2rem;
  pointer-events: none;
  z-index: 1001;
  animation: collectFloat 1.2s ease-out forwards;
}
@keyframes collectFloat {
  0% { opacity: 0; transform: translateY(0) scale(0); }
  30% { opacity: 1; transform: translateY(-20px) scale(1.3); }
  100% { opacity: 0; transform: translateY(-80px) scale(0.5); }
}

/* ========== Scene Transition ========== */
.scene-transition {
  position: absolute; inset: 0;
  background: rgba(255,255,255,0.9);
  display: flex; align-items: center; justify-content: center;
  z-index: 50;
  font-size: 1.5rem; font-weight: 700;
  color: var(--text);
  animation: fadeIn 0.3s ease-out;
}

/* ========== Reset Button ========== */
.reset-btn {
  padding: 6px 14px;
  background: rgba(0,0,0,0.05);
  border: none; border-radius: 50px;
  color: var(--text-light);
  font-size: 0.8rem; font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.reset-btn:hover {
  background: rgba(0,0,0,0.1);
}

/* ========== Responsive ========== */
@media (max-width: 640px) {
  .game-container { padding: 8px; }
  .header { padding: 8px 12px; flex-wrap: wrap; gap: 8px; }
  .title-badge { font-size: 0.75rem; padding: 4px 10px; }
  .target-zone { width: 60px; height: 60px; }
  .game-item { font-size: 2rem; }
  .placed-item { font-size: 1.8rem; }
  .modal-card { padding: 24px; }
  .milestone-panel { width: 280px; }
  .powerup-item { padding: 6px 12px; font-size: 0.75rem; }
}
</style>
</head>
<body>

<!-- Background Decorations -->
<div class="bg-decorations">
  <span class="decor">🌸</span><span class="decor">☁️</span><span class="decor">⭐</span>
  <span class="decor">🌿</span><span class="decor">💫</span><span class="decor">🫧</span>
  <span class="decor">✨</span><span class="decor">🌷</span>
</div>

<!-- Main Game Container -->
<div class="game-container" id="gameContainer">
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="title-badge" id="titleBadge" title="点击查看称号详情">
        <span class="icon">🏅</span>
        <span id="titleName">初来乍到的小帮手</span>
      </div>
      <div class="score-display">
        <span class="star">⭐</span>
        <span id="scoreValue">0</span>
      </div>
    </div>
    <div class="header-right">
      <span class="combo-display" id="comboDisplay">🔥 连击 x1</span>
      <button class="milestone-btn" id="milestoneBtn">📊 里程</button>
      <button class="reset-btn" id="resetBtn">🔄 重置</button>
    </div>
  </div>

  <!-- Progress -->
  <div class="progress-section">
    <div class="progress-info">
      <span id="levelName">第 1 关 · 温馨小书桌</span>
      <span id="progressText">0 / 8</span>
    </div>
    <div class="progress-bar-outer">
      <div class="progress-bar-inner" id="progressBar" style="width: 0%"></div>
    </div>
  </div>

  <!-- Game Scene -->
  <div class="game-scene" id="gameScene">
    <div class="scene-bg"></div>
    <div class="target-zones" id="targetZones"></div>
    <div class="scattered-items" id="scatteredItems"></div>
  </div>

  <!-- PowerUp Bar -->
  <div class="powerup-section">
    <div class="powerup-label">🎒 道具背包</div>
    <div class="powerup-list" id="powerupList">
      <span class="powerup-empty">还没有道具哦，试试找到隐藏道具吧~</span>
    </div>
  </div>
</div>

<!-- Milestone Panel -->
<div class="milestone-panel" id="milestonePanel">
  <button class="close-btn" id="closeMilestone">✕</button>
  <h3>📊 我的里程</h3>
  <div class="stat-card">
    <span class="stat-icon">🧹</span>
    <div class="stat-info">
      <div class="stat-label">累计清理</div>
      <div class="stat-value" id="statTotalCleaned">0 个</div>
    </div>
  </div>
  <div class="stat-card">
    <span class="stat-icon">⭐</span>
    <div class="stat-info">
      <div class="stat-label">累计得分</div>
      <div class="stat-value" id="statTotalScore">0 分</div>
    </div>
  </div>
  <div class="stat-card">
    <span class="stat-icon">🔥</span>
    <div class="stat-info">
      <div class="stat-label">最高连击</div>
      <div class="stat-value" id="statMaxCombo">0 次</div>
    </div>
  </div>
  <div class="stat-card">
    <span class="stat-icon">🎯</span>
    <div class="stat-info">
      <div class="stat-label">已完成关卡</div>
      <div class="stat-value" id="statLevels">0 关</div>
    </div>
  </div>
  <h3 style="margin-top: 8px;">🏅 称号</h3>
  <div class="title-list" id="titleList"></div>
</div>

<!-- Particles Container -->
<div class="particles-container" id="particlesContainer"></div>

<!-- Modal Container -->
<div id="modalContainer"></div>

// ============ Game State ============
const state = {
  playerData: {
    totalCleaned: 0,
    totalScore: 0,
    maxCombo: 0,
    currentTitle: 0,
    unlockedTitles: [0],
    powerUpsUsed: 0,
    levelsCompleted: 0,
  },
  currentLevelIndex: 0,
  items: [],           // current level items with positions
  cleanedCount: 0,
  combo: 0,
  powerUps: [],        // collected powerups
  doubleScoreActive: false,
  doubleScoreRemaining: 0,
  isDragging: false,
  dragItem: null,
  showingModal: false,
};

// ============ Persistence ============
function loadData() {
  try {
    const raw = localStorage.getItem('healing_cleaner_player');
    if (raw) {
      const data = JSON.parse(raw);
      state.playerData = { ...state.playerData, ...data };
    }
  } catch (e) { /* ignore */ }
}

function saveData() {
  try {
    localStorage.setItem('healing_cleaner_player', JSON.stringify(state.playerData));
  } catch (e) { /* ignore */ }
}

// ============ Initialize ============
loadData();

function generateItemPositions(count) {
  const positions = [];
  const scene = document.getElementById('gameScene');
  const rect = scene ? scene.getBoundingClientRect() : { width: 800, height: 400 };
  const w = rect.width || 800;
  const h = rect.height || 400;
  const padding = 60;
  const usedPositions = [];

  for (let i = 0; i < count; i++) {
    let x, y, overlaps;
    let attempts = 0;
    do {
      x = padding + Math.random() * (w - padding * 2);
      y = padding + Math.random() * (h - padding * 2);
      overlaps = usedPositions.some(p => Math.hypot(p.x - x, p.y - y) < 70);
      attempts++;
    } while (overlaps && attempts < 50);
    usedPositions.push({ x, y });
    positions.push({ x: x - 30, y: y - 30 });
  }
  return positions;
}

function initLevel(levelIndex) {
  if (levelIndex >= LEVELS.length) {
    // All levels completed - loop back
    state.currentLevelIndex = 0;
    levelIndex = 0;
  }
  const level = LEVELS[levelIndex];
  const positions = generateItemPositions(level.items.length);

  // Mark one random item as hidden powerup
  const powerupIndex = Math.floor(Math.random() * level.items.length);

  state.items = level.items.map((item, i) => ({
    ...item,
    id: `item-${level.id}-${i}`,
    position: { x: positions[i].x, y: positions[i].y },
    isCleaned: false,
    isPowerUp: i === powerupIndex,
    powerUpType: i === powerupIndex
      ? (['clear_all', 'clear_area', 'magnet', 'double_score'][Math.floor(Math.random() * 4)])
      : null,
  }));
  state.cleanedCount = 0;
  state.combo = 0;
  state.currentLevelIndex = levelIndex;
  updateComboDisplay();
  render();
}

// ============ Rendering ============
function render() {
  renderHeader();
  renderProgress();
  renderScene();
  renderPowerUps();
  renderMilestone();
}

function renderHeader() {
  document.getElementById('titleName').textContent = TITLES[state.playerData.currentTitle].name;
  document.getElementById('titleBadge').querySelector('.icon').textContent = TITLES[state.playerData.currentTitle].icon;
  document.getElementById('scoreValue').textContent = state.playerData.totalScore;
}

function renderProgress() {
  const level = LEVELS[state.currentLevelIndex];
  const total = state.items.length;
  const pct = total > 0 ? Math.round((state.cleanedCount / total) * 100) : 0;
  document.getElementById('levelName').textContent = `第 ${level.id} 关 · ${level.name}`;
  document.getElementById('progressText').textContent = `${state.cleanedCount} / ${total}`;
  document.getElementById('progressBar').style.width = `${pct}%`;
}

function renderScene() {
  const targetZones = document.getElementById('targetZones');
  const scatteredItems = document.getElementById('scatteredItems');
  const level = LEVELS[state.currentLevelIndex];

  // Render target zones
  targetZones.innerHTML = level.items.map((item, i) => {
    const cleanedItem = state.items.find(it => it.target === i && it.isCleaned);
    return `<div class="target-zone ${cleanedItem ? 'filled' : ''}" data-target="${i}">
      ${cleanedItem ? `<span class="placed-item">${cleanedItem.emoji}</span>` : `<span style="opacity:0.4">${item.emoji}</span>`}
    </div>`;
  }).join('');

  // Render scattered items
  scatteredItems.innerHTML = state.items
    .filter(item => !item.isCleaned)
    .map(item => `
      <div class="game-item ${item.isPowerUp ? 'powerup-item' : ''}"
           data-id="${item.id}"
           style="left: ${item.position.x}px; top: ${item.position.y}px;"
           draggable="true"
           title="${item.name}${item.isPowerUp ? ' ✨隐藏道具' : ''}">
        ${item.emoji}
      </div>
    `).join('');

  // Attach drag events
  document.querySelectorAll('.game-item').forEach(el => {
    el.addEventListener('dragstart', handleDragStart);
    el.addEventListener('dragend', handleDragEnd);
    // Touch support
    el.addEventListener('touchstart', handleTouchStart, { passive: false });
    el.addEventListener('touchmove', handleTouchMove, { passive: false });
    el.addEventListener('touchend', handleTouchEnd);
    // Click support (alternative to drag)
    el.addEventListener('click', handleItemClick);
  });

  // Attach drop events to target zones
  document.querySelectorAll('.target-zone').forEach(zone => {
    zone.addEventListener('dragover', e => {
      e.preventDefault();
      zone.classList.add('highlight');
    });
    zone.addEventListener('dragleave', () => zone.classList.remove('highlight'));
    zone.addEventListener('drop', handleDrop);
  });
}

function renderPowerUps() {
  const container = document.getElementById('powerupList');
  if (state.powerUps.length === 0) {
    container.innerHTML = '<span class="powerup-empty">还没有道具哦，试试找到隐藏道具吧~</span>';
    return;
  }
  container.innerHTML = state.powerUps.map((pu, i) => `
    <button class="powerup-item" onclick="usePowerUp(${i})" title="${pu.desc}">
      <span class="pu-icon">${pu.icon}</span>
      <span>${pu.name}</span>
    </button>
  `).join('');
}

function renderMilestone() {
  const pd = state.playerData;
  document.getElementById('statTotalCleaned').textContent = `${pd.totalCleaned} 个`;
  document.getElementById('statTotalScore').textContent = `${pd.totalScore} 分`;
  document.getElementById('statMaxCombo').textContent = `${pd.maxCombo} 次`;
  document.getElementById('statLevels').textContent = `${pd.levelsCompleted} 关`;

  const titleList = document.getElementById('titleList');
  titleList.innerHTML = TITLES.map((t, i) => {
    const unlocked = pd.unlockedTitles.includes(i);
    const isCurrent = pd.currentTitle === i;
    return `<div class="title-item ${unlocked ? 'unlocked' : 'locked'} ${isCurrent ? 'current' : ''}">
      <span class="tl-icon">${t.icon}</span>
      <span class="tl-name">${t.name}</span>
      <span class="tl-status ${unlocked ? 'unlocked' : 'locked'}">${unlocked ? (isCurrent ? '当前' : '已解锁') : '🔒'}</span>
    </div>`;
  }).join('');
}

// ============ Drag & Drop Handlers ============
function handleDragStart(e) {
  if (state.showingModal) return;
  state.isDragging = true;
  state.dragItem = e.target.closest('.game-item');
  if (state.dragItem) {
    state.dragItem.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', state.dragItem.dataset.id);
  }
}

function handleDragEnd(e) {
  state.isDragging = false;
  if (state.dragItem) {
    state.dragItem.classList.remove('dragging');
    state.dragItem = null;
  }
  document.querySelectorAll('.target-zone').forEach(z => z.classList.remove('highlight'));
}

function handleDrop(e) {
  e.preventDefault();
  const targetZone = e.target.closest('.target-zone');
  if (!targetZone) return;
  targetZone.classList.remove('highlight');
  const targetIndex = parseInt(targetZone.dataset.target);
  const itemId = e.dataTransfer.getData('text/plain');
  if (itemId) tryCleanItem(itemId, targetIndex);
}

// ============ Touch Support ============
let touchData = null;

function handleTouchStart(e) {
  if (state.showingModal) return;
  const el = e.target.closest('.game-item');
  if (!el) return;
  e.preventDefault();
  state.isDragging = true;
  state.dragItem = el;
  el.classList.add('dragging');
  const touch = e.touches[0];
  touchData = {
    item: el,
    startX: touch.clientX,
    startY: touch.clientY,
    elStartX: el.offsetLeft,
    elStartY: el.offsetTop,
  };
}

function handleTouchMove(e) {
  if (!touchData || !state.isDragging) return;
  e.preventDefault();
  const touch = e.touches[0];
  const dx = touch.clientX - touchData.startX;
  const dy = touch.clientY - touchData.startY;
  touchData.item.style.left = (touchData.elStartX + dx) + 'px';
  touchData.item.style.top = (touchData.elStartY + dy) + 'px';

  // Highlight target zone under finger
  document.querySelectorAll('.target-zone').forEach(z => z.classList.remove('highlight'));
  const elUnder = document.elementFromPoint(touch.clientX, touch.clientY);
  const zone = elUnder?.closest('.target-zone');
  if (zone) zone.classList.add('highlight');
}

function handleTouchEnd(e) {
  if (!touchData) return;
  document.querySelectorAll('.target-zone').forEach(z => z.classList.remove('highlight'));

  const touch = e.changedTouches[0];
  const elUnder = document.elementFromPoint(touch.clientX, touch.clientY);
  const zone = elUnder?.closest('.target-zone');

  if (zone && state.dragItem) {
    const targetIndex = parseInt(zone.dataset.target);
    const itemId = state.dragItem.dataset.id;
    tryCleanItem(itemId, targetIndex);
  }

  // Reset position
  if (state.dragItem) {
    state.dragItem.classList.remove('dragging');
    const item = state.items.find(it => it.id === state.dragItem.dataset.id);
    if (item && !item.isCleaned) {
      state.dragItem.style.left = item.position.x + 'px';
      state.dragItem.style.top = item.position.y + 'px';
    }
  }

  state.isDragging = false;
  state.dragItem = null;
  touchData = null;
}

// ============ Click Handler (simpler alternative) ============
function handleItemClick(e) {
  if (state.isDragging) return;
  if (state.showingModal) return;
  const el = e.target.closest('.game-item');
  if (!el) return;
  const itemId = el.dataset.id;
  const item = state.items.find(it => it.id === itemId);
  if (!item || item.isCleaned) return;

  // Find nearest empty target zone
  const targetZone = findNearestEmptyTarget(el);
  if (targetZone !== null) {
    tryCleanItem(itemId, targetZone);
  }
}

function findNearestEmptyTarget(el) {
  const item = state.items.find(it => it.id === el.dataset.id);
  if (!item) return null;
  // Just find the correct target
  if (!state.items.find(it => it.target === item.target && it.isCleaned)) {
    return item.target;
  }
  // Find any empty target
  for (let i = 0; i < state.items.length; i++) {
    if (!state.items.find(it => it.target === i && it.isCleaned)) {
      return i;
    }
  }
  return null;
}

// ============ Core Game Logic ============
function tryCleanItem(itemId, targetIndex) {
  const item = state.items.find(it => it.id === itemId);
  if (!item || item.isCleaned) return;
  if (state.showingModal) return;

  // Check if target is already occupied
  if (state.items.find(it => it.target === targetIndex && it.isCleaned)) return;

  // Clean the item
  item.isCleaned = true;
  state.cleanedCount++;
  state.combo++;

  // Score
  let score = 10 + state.combo * 2;
  if (state.doubleScoreActive) {
    score *= 2;
    state.doubleScoreRemaining--;
    if (state.doubleScoreRemaining <= 0) {
      state.doubleScoreActive = false;
    }
  }
  state.playerData.totalScore += score;
  state.playerData.totalCleaned++;

  if (state.combo > state.playerData.maxCombo) {
    state.playerData.maxCombo = state.combo;
  }

  updateComboDisplay();
  saveData();

  // Check for hidden powerup
  if (item.isPowerUp && item.powerUpType) {
    const pu = POWERUP_TYPES[item.powerUpType];
    state.powerUps.push({ ...pu, id: Date.now().toString() });
    showPowerUpCollect(pu);
  }

  render();

  // Check level completion
  const total = state.items.length;
  if (state.cleanedCount >= total) {
    onLevelComplete();
  } else {
    // Check milestones
    checkMilestones();
  }
}

function updateComboDisplay() {
  const el = document.getElementById('comboDisplay');
  if (state.combo > 1) {
    el.textContent = `🔥 连击 x${state.combo}`;
    el.classList.add('active');
  } else {
    el.classList.remove('active');
  }
}

function checkMilestones() {
  const pct = state.items.length > 0 ? state.cleanedCount / state.items.length : 0;
  const milestones = [0.25, 0.5, 0.75, 0.9];
  const level = LEVELS[state.currentLevelIndex];
  const prevCleaned = state.cleanedCount - 1;

  for (const m of milestones) {
    const threshold = Math.ceil(state.items.length * m);
    if (state.cleanedCount === threshold && prevCleaned < threshold) {
      showEncouragement();
      return;
    }
  }
}

function onLevelComplete() {
  state.playerData.levelsCompleted++;
  state.combo = 0;
  updateComboDisplay();
  saveData();

  // Check title upgrade
  checkTitleUpgrade();

  // Show celebration
  spawnParticles(30);

  setTimeout(() => {
    showModal(
      '🎉',
      '关卡完成！',
      `太棒了！你成功整理了「${LEVELS[state.currentLevelIndex].name}」！\n你的治愈之力又变强了呢~`,
      () => {
        // Next level
        if (state.currentLevelIndex + 1 < LEVELS.length) {
          initLevel(state.currentLevelIndex + 1);
        } else {
          // Loop all levels with increased difficulty (just loop)
          state.currentLevelIndex = 0;
          initLevel(0);
        }
      }
    );
  }, 600);
}

function checkTitleUpgrade() {
  const pd = state.playerData;
  let newTitle = pd.currentTitle;

  for (let i = TITLES.length - 1; i > pd.currentTitle; i--) {
    const cond = TITLES[i].condition;
    let met = true;
    if (cond.totalCleaned && pd.totalCleaned < cond.totalCleaned) met = false;
    if (cond.powerUpsUsed && pd.powerUpsUsed < cond.powerUpsUsed) met = false;
    if (cond.maxCombo && pd.maxCombo < cond.maxCombo) met = false;
    if (met) {
      newTitle = i;
      break;
    }
  }

  if (newTitle > pd.currentTitle) {
    // Unlock intermediate titles too
    for (let i = pd.currentTitle + 1; i <= newTitle; i++) {
      if (!pd.unlockedTitles.includes(i)) {
        pd.unlockedTitles.push(i);
      }
    }
    pd.currentTitle = newTitle;
    saveData();
    spawnParticles(20);
    setTimeout(() => {
      showModal(
        TITLES[newTitle].icon,
        '称号升级！',
        `恭喜你获得了新称号：「${TITLES[newTitle].name}」！\n你的成长我们都看在眼里，继续加油哦~`,
        null
      );
    }, 400);
  }
}

function showEncouragement() {
  const enc = ENCOURAGEMENTS[Math.floor(Math.random() * ENCOURAGEMENTS.length)];
  const msg = enc.messages[Math.floor(Math.random() * enc.messages.length)];
  showModal(enc.emoji, '做得好！', msg, null);
}

function showPowerUpCollect(pu) {
  const container = document.getElementById('particlesContainer');
  const el = document.createElement('div');
  el.className = 'powerup-collect';
  el.textContent = pu.icon;
  el.style.left = '50%';
  el.style.top = '50%';
  el.style.transform = 'translate(-50%, -50%)';
  container.appendChild(el);

  setTimeout(() => el.remove(), 1200);

  // Small encouragement
  const msgEl = document.createElement('div');
  msgEl.className = 'powerup-collect';
  msgEl.textContent = `获得道具：${pu.name}！`;
  msgEl.style.left = '50%';
  msgEl.style.top = '55%';
  msgEl.style.fontSize = '1rem';
  msgEl.style.fontWeight = '700';
  msgEl.style.color = '#FFB84D';
  container.appendChild(msgEl);
  setTimeout(() => msgEl.remove(), 1500);
}

// ============ PowerUp Usage ============
function usePowerUp(index) {
  if (state.showingModal) return;
  if (index >= state.powerUps.length) return;
  const pu = state.powerUps[index];
  state.powerUps.splice(index, 1);
  state.playerData.powerUpsUsed++;

  switch (pu.effect) {
    case 'clear_all':
      clearAllItems();
      break;
    case 'clear_area':
      clearAreaItems();
      break;
    case 'magnet':
      magnetItems();
      break;
    case 'double_score':
      state.doubleScoreActive = true;
      state.doubleScoreRemaining = 5;
      break;
  }

  saveData();
  render();

  // Show effect
  spawnParticles(15);
  const container = document.getElementById('particlesContainer');
  const msgEl = document.createElement('div');
  msgEl.className = 'powerup-collect';
  msgEl.textContent = `${pu.icon} 使用了${pu.name}！`;
  msgEl.style.left = '50%';
  msgEl.style.top = '40%';
  msgEl.style.fontSize = '1.1rem';
  msgEl.style.fontWeight = '700';
  msgEl.style.color = '#FFB84D';
  container.appendChild(msgEl);
  setTimeout(() => msgEl.remove(), 1500);
}

function clearAllItems() {
  state.items.forEach(item => {
    if (!item.isCleaned) {
      item.isCleaned = true;
      state.cleanedCount++;
      state.combo++;
      state.playerData.totalScore += 10;
      state.playerData.totalCleaned++;
      if (state.combo > state.playerData.maxCombo) {
        state.playerData.maxCombo = state.combo;
      }
    }
  });
  updateComboDisplay();
  saveData();
  render();
  if (state.cleanedCount >= state.items.length) {
    setTimeout(onLevelComplete, 300);
  }
}

function clearAreaItems() {
  // Clear 3 random items
  const uncleaned = state.items.filter(it => !it.isCleaned);
  const toClear = uncleaned.sort(() => Math.random() - 0.5).slice(0, 3);
  toClear.forEach(item => {
    item.isCleaned = true;
    state.cleanedCount++;
    state.combo++;
    state.playerData.totalScore += 10;
    state.playerData.totalCleaned++;
    if (state.combo > state.playerData.maxCombo) {
      state.playerData.maxCombo = state.combo;
    }
  });
  updateComboDisplay();
  saveData();
  render();
  if (state.cleanedCount >= state.items.length) {
    setTimeout(onLevelComplete, 300);
  }
}

function magnetItems() {
  // Auto-place 3 items to their correct targets
  const uncleaned = state.items.filter(it => !it.isCleaned);
  const toPlace = uncleaned.sort(() => Math.random() - 0.5).slice(0, 3);
  toPlace.forEach(item => {
    // Check if target is free
    if (!state.items.find(it => it.target === item.target && it.isCleaned)) {
      item.isCleaned = true;
      state.cleanedCount++;
      state.combo++;
      state.playerData.totalScore += 10;
      state.playerData.totalCleaned++;
      if (state.combo > state.playerData.maxCombo) {
        state.playerData.maxCombo = state.combo;
      }
    }
  });
  updateComboDisplay();
  saveData();
  render();
  if (state.cleanedCount >= state.items.length) {
    setTimeout(onLevelComplete, 300);
  }
}

// ============ Particles ============
function spawnParticles(count) {
  const container = document.getElementById('particlesContainer');
  const emojis = ['⭐', '✨', '💫', '🌟', '💖', '🌸', '🎀', '💝', '🫧', '🌷'];

  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      particle.style.left = (10 + Math.random() * 80) + '%';
      particle.style.top = -20 + 'px';
      particle.style.animationDuration = (2 + Math.random() * 2) + 's';
      particle.style.animationDelay = '0s';
      container.appendChild(particle);
      setTimeout(() => particle.remove(), 3000);
    }, i * 30);
  }
}

// ============ Modal ============
function showModal(emoji, title, message, onClose) {
  if (state.showingModal) return;
  state.showingModal = true;
  const container = document.getElementById('modalContainer');

  container.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-card">
        <div class="modal-emoji">${emoji}</div>
        <div class="modal-title">${title}</div>
        <div class="modal-message">${message.replace(/\n/g, '<br>')}</div>
        <button class="modal-btn" id="modalCloseBtn">
          ${onClose ? '继续冒险 →' : '知道啦 💕'}
        </button>
      </div>
    </div>
  `;

  document.getElementById('modalCloseBtn').addEventListener('click', () => {
    container.innerHTML = '';
    state.showingModal = false;
    if (onClose) onClose();
  });

  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) {
      container.innerHTML = '';
      state.showingModal = false;
      if (onClose) onClose();
    }
  });
}

// ============ Milestone Panel ============
document.getElementById('milestoneBtn').addEventListener('click', () => {
  renderMilestone();
  document.getElementById('milestonePanel').classList.add('open');
});
document.getElementById('closeMilestone').addEventListener('click', () => {
  document.getElementById('milestonePanel').classList.remove('open');
});
document.getElementById('titleBadge').addEventListener('click', () => {
  renderMilestone();
  document.getElementById('milestonePanel').classList.add('open');
});

// ============ Reset ============
document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('确定要重置游戏数据吗？这将清除所有进度和称号哦~')) {
    state.playerData = {
      totalCleaned: 0,
      totalScore: 0,
      maxCombo: 0,
      currentTitle: 0,
      unlockedTitles: [0],
      powerUpsUsed: 0,
      levelsCompleted: 0,
    };
    state.powerUps = [];
    state.doubleScoreActive = false;
    state.doubleScoreRemaining = 0;
    saveData();
    initLevel(0);
    render();
    document.getElementById('milestonePanel').classList.remove('open');
  }
});

// ============ Start Game ============
initLevel(0);
render();
</script>
