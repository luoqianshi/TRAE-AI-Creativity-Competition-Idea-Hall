    time: '10分钟',
    heat: '中火',
    mainFoods: ['鸡蛋','蘑菇'],
    seasonings: ['食盐','生抽'],
    missing: [],
    steps: ['蘑菇洗净切片，鸡蛋打散','热锅凉油，倒入蛋液炒成块盛出','锅中加少许油，下蘑菇片炒软','倒入炒好的鸡蛋','加盐和少许生抽调味，翻炒均匀即可']
  }
];

// ========== 交互函数 ==========

function changePeople(delta) {
  people = Math.max(1, Math.min(10, people + delta));
  document.getElementById('peopleCount').textContent = people;
}

function addToBasket(food) {
  if (!basket.includes(food)) {
    basket.push(food);
    renderBasket();
  }
}

function removeFood(zone, food) {
  if (zone === 'fridge') {
    fridge = fridge.filter(f => f !== food);
    renderFridge();
  } else {
    basket = basket.filter(f => f !== food);
    renderBasket();
  }
}

function renderFridge() {
  const el = document.getElementById('fridgeTags');
  if (fridge.length === 0) {
    el.innerHTML = '<span class="empty-hint">冰箱里空空如也</span>';
    return;
  }
  el.innerHTML = fridge.map(f => `<span class="food-tag">${f} <span class="remove" onclick="removeFood('fridge','${f}')">×</span></span>`).join('');
}

function renderBasket() {
  const el = document.getElementById('basketTags');
  if (basket.length === 0) {
    el.innerHTML = '<span class="empty-hint">点击下面常用食材，添加到菜篮子</span>';
    return;
  }
  el.innerHTML = basket.map(f => `<span class="food-tag">${f} <span class="remove" onclick="removeFood('basket','${f}')">×</span></span>`).join('');
}

function getTypeLabel(type) {
  const map = { meat: '荤菜', veg: '素菜', soup: '汤品' };
  const cls = { meat: 'tag-meat', veg: 'tag-veg', soup: 'tag-soup' };
  return `<span class="dish-tag ${cls[type]}">${map[type]}</span>`;
}

function renderRecipes(list) {
  const container = document.getElementById('menuCards');
  container.innerHTML = list.map((r, i) => {
    const hasMissing = r.missing.length > 0;
    const missingHtml = hasMissing ? `
      <div class="missing-alert">
        <span class="icon">⚠️</span>
        <span>还缺辅料：${r.missing.join('、')}，记得购买</span>
      </div>
    ` : '';

    const mainFoodHtml = r.mainFoods.map(f => {
      const inBasket = basket.includes(f);
      return `<span class="ingredient-tag main-food">${f}${inBasket ? '' : '（家里）'}</span>`;
    }).join('');

    const seasonHtml = r.seasonings.map(s => {
      const hasIt = fridge.includes(s) || basket.includes(s);
      return `<span class="ingredient-tag seasoning">${s}${hasIt ? '' : '（缺）'}</span>`;
    }).join('');

    return `
      <div class="menu-card" style="animation-delay:${i*0.1}s">
        <div class="menu-card-header">
          <div>
            ${getTypeLabel(r.type)}
            <h3>${r.name}</h3>
          </div>
          <button class="replace-btn" onclick="replaceDish(${i})">换一道</button>
        </div>
        <div class="menu-meta">
          <span>⏱️ ${r.time}</span>
          <span>🔥 ${r.heat}</span>
          <span>👤 ${people}人份</span>
        </div>
        <div class="ingredients">
          <h4>主食材</h4>
          <div class="ingredient-list">${mainFoodHtml}</div>
        </div>
        <div class="ingredients">
          <h4>调味料</h4>
          <div class="ingredient-list">${seasonHtml}</div>
        </div>
        ${missingHtml}
        <div class="steps">
          <h4>做法步骤</h4>
          <ol>
            ${r.steps.map(s => `<li>${s}</li>`).join('')}
          </ol>
        </div>
      </div>
    `;
  }).join('');
}

let currentMenu = [];

function generateMenu() {
  if (basket.length === 0) {
    alert('请先在菜篮子里添加一些食材');
    return;
  }

  currentMenu = matchRecipes();
  if (currentMenu.length === 0) {
    alert('暂无用这些食材能做的菜，试试换些食材');
    return;
  }

  renderRecipes(currentMenu);
  document.getElementById('resultArea').classList.add('show');
  document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth' });
}

function matchRecipes() {
  const allFoods = [...fridge, ...basket];
  const scored = recipes.map(r => {
    const mainMatch = r.mainFoods.filter(f => allFoods.includes(f)).length;
    const seasonMatch = r.seasonings.filter(s => allFoods.includes(s)).length;
    const score = mainMatch * 3 + seasonMatch;
    return { recipe: r, score, mainMatch };
  }).filter(s => s.mainMatch > 0);

  scored.sort((a, b) => b.score - a.score);

  // 优先确保荤素搭配
  let result = [];
  let hasMeat = false, hasVeg = false, hasSoup = false;

  for (const s of scored) {
    if (result.length >= 4) break;
    const type = s.recipe.type;
    if (type === 'meat' && hasMeat) continue;
    if (type === 'veg' && hasVeg) continue;
    if (type === 'soup' && hasSoup) continue;
    result.push(s.recipe);
    if (type === 'meat') hasMeat = true;
    if (type === 'veg') hasVeg = true;
    if (type === 'soup') hasSoup = true;
  }

  // 如果不够4道，补充高分菜
  for (const s of scored) {
    if (result.length >= 4) break;
    if (!result.includes(s.recipe)) {
      result.push(s.recipe);
    }
  }

  return result;
}

function replaceDish(index) {
  const allFoods = [...fridge, ...basket];
  const usedNames = currentMenu.map(r => r.name);
  const candidates = recipes.filter(r => {
    if (usedNames.includes(r.name)) return false;
    const mainMatch = r.mainFoods.filter(f => allFoods.includes(f)).length;
    return mainMatch > 0;
  });

  if (candidates.length === 0) {
    alert('暂无可替换的菜谱了');
    return;
  }

  // 随机选一个
  const pick = candidates[Math.floor(Math.random() * candidates.length)];
  currentMenu[index] = pick;
  renderRecipes(currentMenu);
}

function replaceAll() {
  currentMenu = matchRecipes();
  renderRecipes(currentMenu);
}

// 初始化
renderFridge();
renderBasket();
</script>
