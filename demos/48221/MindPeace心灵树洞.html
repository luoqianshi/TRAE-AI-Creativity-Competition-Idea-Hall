你不需要一下子解决所有问题，今天只需要过好今天就好。一步一步来，每一步都算数。`,`疲惫是身体和心灵在提醒你：该休息了。辛苦了这么久，你值得好好休息一下。去吃点好吃的，看一部轻松的动画片，或者干脆什么都不做，就躺一会儿。你已经做得很好了。`]},{keywords:[`失眠`,`睡不着`,`熬夜`,`噩梦`],responses:[`睡不着的时候不要勉强自己，越是努力想睡反而越清醒。你可以试试放下手机，闭上眼睛，想象自己躺在一片柔软的草地上，听风轻轻吹过的声音。慢慢放松身体的每一个部位。`,`失眠很难受，第二天还会影响精神。建议你试试在睡前用热水泡脚，听一点白噪音或者轻音乐，避免看刺激的内容。如果持续失眠，记得跟家人或老师说说，寻求帮助是很重要的。`,`做噩梦醒来后那种害怕的感觉会很真实，抱抱你。你可以试着把梦写下来，告诉自己"那只是一个梦，我很安全"。然后喝口温水，调整一下呼吸。实在睡不着的话，也可以看看轻松的书。`]},{keywords:[`同学`,`朋友`,`被欺负`,`孤立`,`校园`],responses:[`在学校里交不到朋友或者跟同学闹矛盾，确实会让人很难受。但请记住，交朋友需要时间和缘分，不是你的问题。试着主动跟有共同兴趣的同学聊聊，或者参加一些社团活动，慢慢来。`,`如果有人欺负你，请一定要告诉老师或你信任的大人。被欺负从来都不是你的错，你有权利在一个安全的环境里学习和生活。勇敢说出来，是保护自己的第一步，你值得被善待。`,`被孤立的感觉像全世界都在远离你，这种感觉特别痛苦。但我想告诉你，真正的朋友不需要很多，有一两个知心的就足够了。保持善良和真诚，适合你的人终会出现。`,`人际关系有时候确实让人头疼。同学之间有矛盾很正常，重要的是用对方式去沟通和解决。如果不知道怎么办，可以先冷静一下，然后找信任的人帮你一起想办法。你不是一个人在面对。`]},{keywords:[`父母`,`家`,`吵架`,`不理解`,`管太多`],responses:[`跟父母吵架后心里会很难受吧。虽然父母有时候的方式不对，但大多数时候他们的出发点是关心你。等双方都冷静下来后，可以试试用写信的方式告诉他们你的感受，这样不容易激动。`,`觉得父母不理解你，这种感觉在青春期特别常见。大人和小孩看待世界的方式不同，沟通需要一个过程。你可以试着选一个轻松的时机，慢慢跟他们分享你的想法，给他们一些时间理解。`,`被管太多会觉得很不自由吧。其实随着你慢慢长大，父母也需要学习怎么给你更多的空间。你可以试着跟他们聊聊，让他们看到你已经在变得独立和 responsible，他们可能会慢慢放心。`,`家里的事情让你不开心了，我很理解。家本来应该是让人感到温暖的地方。如果你觉得自己很难跟父母沟通，可以找一个你信任的长辈或者老师帮忙调解一下。你值得拥有一个温馨的家。`]},{keywords:[`学习`,`成绩`,`作业`,`不想上学`,`厌学`],responses:[`学习确实有时候让人很头疼，不是每个人都是学霸，这完全没关系。每个人都有自己的节奏和擅长的事。找到适合自己的学习方法比一味的努力更重要，如果需要的话可以请老师帮你分析一下。`,`成绩不好不代表你不行，一次考试说明不了什么。重要的是你有没有在进步，哪怕只是进步一点点。不要因为一时的成绩给自己太大压力，学习是长跑不是短跑，慢慢来。`,`有时候不想上学是因为太累了，或者是遇到了一些让你不开心的事。先弄清楚原因很重要。如果只是累了，就好好休息一下。如果是遇到了困难，找人聊聊，你不需要一个人硬撑。`,`作业写不完确实会让人很崩溃。建议你先把作业按难易程度排个序，从简单的开始做，这样容易进入状态。中间记得休息，不要一口气写太久。遇到不会的题，第二天问老师也没关系的。`]},{keywords:[`开心`,`高兴`,`好事`,`快乐`],responses:[`太棒了！听到你开心我也觉得好高兴。开心的感觉要好好珍惜和记住哦。你可以把这份快乐分享给你在乎的人，快乐会变成双倍。希望你每天都像今天一样开心！`,`好事情发生的时候一定要好好庆祝一下！不管是多大的好事，都说明你的努力被看到了，或者是运气在眷顾你。继续保持这种积极的状态吧，好的事情会一个接一个来的。`,`看到你说开心，我的心情也被点亮了。你知道吗，快乐是会传染的，你现在的笑容一定也能温暖身边的人。记住此刻的快乐，以后遇到不开心的时候，拿出来回味一下。`]},{keywords:[`自残`,`死`,`不想活`,`自杀`,`伤害`],isEmergency:!0,responses:[`看到你说这些话，我非常担心你。你现在一定经历了很大的痛苦才会这么想，但请你相信，这种感觉是暂时的，情况会好起来的。你愿意跟我多说说发生了什么吗？我一直在。`,`谢谢你愿意把这些话说出来，这说明你内心深处还是想要被帮助的。你现在承受的痛苦一定很沉重，但你不需要一个人独自面对。身边一定有人愿意听你说、愿意帮你，请给他们一个机会。`,`我能感受到你现在有多痛苦，但请再给自己一点时间。很多时候，最黑暗的时刻往往就是黎明前的那一刻。你很重要，你的存在对这个世界有意义。如果你愿意，可以拨打心理援助热线。`,`不管发生了什么让你这么绝望，都请先不要伤害自己。你的感受是被重视的，你的痛苦是真实的，但这不代表没有出路。请跟一个你信任的人说说你的感受，或者寻求专业的帮助。`,`如果你现在感觉非常糟糕，请一定要寻求专业帮助。全国24小时心理援助热线：400-161-9995，随时有专业的人在那里等着帮助你。你不是一个人，请给未来一个机会，好吗？`]},{keywords:[`无聊`,`没意思`,`空虚`],responses:[`无聊的感觉确实让人不太好受，不过换个角度想，无聊也可能是大脑在告诉你"是时候尝试一些新东西了"。你可以试着学一个新技能、看一本有趣的书，或者出去走走，说不定会有意想不到的收获。`,`觉得生活没什么意思，可能是因为最近的生活比较单调。试着给自己设定一个小小的目标，比如学一道新菜、跑一次步，完成后的成就感会让生活多一些色彩和期待。`,`空虚感有时候是因为我们太久没有做自己真正喜欢的事了。回忆一下，以前有什么事情是让你沉浸其中忘了时间的？试着重新捡起来，让自己的生活多一些让你期待的东西。`]},{keywords:[`谢谢`,`感谢`,`好了`,`没事了`],responses:[`不客气！能帮到你我很开心。以后有任何不开心或者烦恼，都可以随时来找我聊聊。记住，不管什么时候，你都不是一个人。好好照顾自己，祝你每天都开开心心的！`,`看到你说好了我就放心了！你很棒，能够面对自己的情绪并且愿意说出来，这已经是很勇敢的事情了。继续保持这份勇气，不管遇到什么困难，你都比自己想象的更强大。`,`太好了，能帮到你我真的特别开心。希望和你聊天的这段时光，能给你带去一点点温暖。记得要好好爱自己，想聊天的时候随时来找我，我一直在这里等你。加油哦！`]},{keywords:[`自卑`,`丑`,`胖`,`没用`,`不够好`],responses:[`我想告诉你，每个人都有自己的闪光点。你可能还没有发现你身上那些美好的地方，但这不代表它们不存在。不要因为别人的评价而否定自己，你是独一无二的，这本身就是一种珍贵。`,`觉得自己不够好？其实能这样反思说明你很有自我意识。但请记住，不需要完美才是有价值的。你现在的样子就很好，接受自己的不完美，才是真正自信的开始。`,`自卑感会让世界看起来灰暗很多，但请相信这只是你现在的感受，并不是事实。多看看自己做成过的事情，哪怕是很小的事也值得肯定。给自己写一封鼓励信吧，说说你觉得自己做得好的地方。`,`不管你说自己怎样，在我看来，愿意来这里倾诉说明你是一个善良且有勇气的人。不要拿自己和别人比较，你的价值不是由外表或者成绩决定的。请试着对自己温柔一些，你值得被温柔对待。`]},{keywords:[`暗恋`,`喜欢`,`恋爱`,`分手`,`失恋`],responses:[`暗恋一个人的感觉又甜又酸，对吧？有人让你心动说明你的情感世界很丰富，这是青春里很美好的一部分。不用急着表白或做什么决定，顺其自然就好，最重要的是照顾好自己的心情。`,`失恋真的很痛，我能理解你现在的心情。但请记住，失恋不代表你不好，只是说明这段缘分到头了。给自己时间去难过和疗愈，不要急于开始新的一段关系。相信未来会有人更加珍惜你。`,`恋爱是青春期很正常的情感，喜欢一个人说明你在成长。不过现阶段学习也很重要，你可以试着把这份喜欢变成让自己变得更优秀的动力。无论这段感情结果如何，它都会成为你成长的一部分。`]}],OV=[`谢谢你愿意跟我分享你的心情。不管你在经历什么，都请记住，你不是一个人在面对。如果你愿意，可以多说一些，我会认真听。`,`我能感受到你现在的心情可能不太好。虽然我不太确定具体发生了什么，但我想告诉你，不管怎样，我都愿意陪你聊聊天。有什么想说的都可以告诉我。`,`每个人都有情绪低落的时候，这很正常。你愿意说出来就已经很勇敢了。如果一时不知道说什么也没关系，在这里安静待一会儿也可以，我一直都在。`,`听到你说的话，我想告诉你：你现在的感受是完全正当的，不需要觉得不好意思。慢慢说，我在这里认真听，我们一起面对。`];function kV(e){let t=e.toLowerCase();for(let e of DV)if(e.keywords.some(e=>t.includes(e))){let t=e.responses;return{text:t[Math.floor(Math.random()*t.       `})]})}var NV=[{id:`1`,content:`今天考试没考好，感觉自己好笨...怎么努力都看不到进步，真的好沮丧。有没有人也这样过？`,author:`小星星`,timestamp:Date.now()-72e5,likes:12,liked:!1,comments:[{id:`c1`,content:`你不是笨，只是这次没发挥好！下次一定能行的，相信自己！`,author:`小太阳`,timestamp:Date.now()-36e5},{id:`c2`,content:`抱抱，我也有过这样的感觉，后来发现其实是方法不太对。加油！`,author:`匿名蜗牛`,timestamp:Date.now()-18e5}]},{id:`2`,content:`最近跟好朋友闹矛盾了，感觉好孤独。以前有什么心事都跟她说，现在不知道该跟谁说了...`,author:`匿名蝴蝶`,timestamp:Date.now()-144e5,likes:8,liked:!1,comments:[{id:`c3`,content:`真正的友谊是经得起考验的，冷静下来试着沟通一下看看？`,author:`小雨滴`,timestamp:Date.now()-108e5}]},{id:`3`,content:`被同学嘲笑胖，回家偷偷哭了好久。明明已经很努力控制饮食了，为什么别人还是这么说我...`,author:`小月亮`,timestamp:Date.now()-288e5,likes:23,liked:!1,comments:[{id:`c4`,content:`你不是一个人，我也被说过。记住，你的价值不由外表决定。你很棒的！`,author:`小太阳`,timestamp:Date.now()-252e5},{id:`c5`,content:`那些说别人的人才是有问题的。健康最重要，不要为了别人的评价折磨自己。`,author:`匿名猫咪`,timestamp:Date.now()-216e5},{id:`c6`,content:`抱抱你，不要在意那些人的话。你已经很美了！`,author:`小云朵`,timestamp:Date.now()-18e6}]},{id:`4`,content:`终于鼓起勇气跟爸妈说想学画画，结果被说"学那个有什么用"。好难过，感觉他们从来不关心我真正喜欢什么...`,author:`匿名树叶`,timestamp:Date.now()-432e5,likes:15,liked:!1,comments:[{id:`c7`,content:`父母有时候不太理解我们的爱好，但你可以先自己偷偷学嘛，等有了作品再给他们看！`,author:`小星星`,timestamp:Date.now()-396e5},{id:`c8`,content:`加油！喜欢的事情就坚持去做，总有一天会被看到的。`,author:`匿名风`,timestamp:Date.now()-36e6}]},{id:`5`,content:`最近总是失眠，躺好久了也睡不着，脑子里一直想各种事情。白天上课就犯困，恶性循环了快...`,author:`匿名蜗牛`,timestamp:Date.now()-576e5,likes:9,liked:!1,comments:[{id:`c9`,content:`睡前试试听白噪音或者冥想音频，对我挺有用的。另外睡前别看手机！`,author:`小雨滴`,timestamp:Date.now()-54e6},{id:`c10`,content:`如果持续失眠的话建议跟家长说说，看看医生也挺好的，没什么不好意思的。`,author:`小月亮`,timestamp:Date.now()-504e5}]},{id:`6`,content:`今天发生了一件特别开心的事！征文比赛居然得了二等奖！以前总觉得自己写作不行，这次真的给了我很大的信心！`,author:`小太阳`,timestamp:Date.now()-864e5,likes:31,liked:!1,comments:[{id:`c11`,content:`恭喜你！太棒了！继续加油，你一定可以写出更好的作品！`,author:`匿名蝴蝶`,timestamp:Date.now()-828e5},{id:`c12`,content:`太厉害了！什么时候能分享给我们看看呀？`,author:`小星星`,timestamp:Date.now()-792e5},{id:`c13`,content:`为你开心！这就是坚持的力量，相信自己的感觉真好！`,author:`匿名猫咪`,timestamp:Date.now()-756e5}]},{id:`7`,content:`作业太多根本写不完，每天写到手酸。感觉自己就像个写作业机器，什么时候才能有一点自己的时间...`,author:`匿名猫咪`,timestamp:Date.now()-1008e5,likes:18,liked:!1,comments:[{id:`c14`,content:`理解你，我最近也是。建议写40分钟就休息10分钟，效率会高一些。`,author:`匿名风`,timestamp:Date.now()-972e5},{id:`c15`,content:`别把自己逼太紧了，适当休息也很重要。身体是革命的本钱呀！`,author:`小云朵`,timestamp:Date.now()-936e5}]},{id:`8`,content:`跟同桌偷偷说了一句话就被老师点名批评，真的好丢脸。又不是上课不听讲，只是讨论一个问题而已...`,author:`小云朵`,timestamp:Date.now()-1296e5,likes:7,liked:!1,comments:[{id:`c16`,content:`尴尬是暂时的，明天大家就忘了，别太放在心上。`,author:`匿名蝴蝶`,timestamp:Date.now()-126e6}]},{id:`9`,content:`暗恋一个人快一年了，一直没勇气说。马上就要毕业了，不知道要不要表白...怕说了连朋友都做不了`,author:`小雨滴`,timestamp:Date.now()-1728e5,likes:27,liked:!1,comments:[{id:`c17`,content:`毕业前说吧，至少给自己一个交代，不留遗憾。不管结果怎样，你都很勇敢！`,author:`匿名树叶`,timestamp:Date.now()-1692e5},{id:`c18`,content:`我也经历过一样的事情，当时没说现在想起来还是会遗憾。加油！`,author:`小太阳`,timestamp:Date.now()-1656e5},{id:`c19`,content:`不管你选择什么，这段心动的感觉本身就很珍贵。把它当作美好的回忆也很好呀。`,author:`匿名蜗牛`,timestamp:Date.now()-162e6}]},{id:`10`,content:`今天被班里几个同学孤立了，午饭都是一个人吃的。不知道为什么突然就不带我玩了，我做错什么了吗...`,author:`匿名风`,timestamp:Date.now()-216e6,likes:20,liked:!1,comments:[{id:`c20`,content:`你没有做错什么，是他们的问题。真正的朋友不会这样对你。`,author:`小月亮`,timestamp:Date.now()-2124e5},{id:`c21`,content:`如果持续被欺负一定要跟老师说，不要一个人默默承受。`,author:`小星星`,timestamp:Date.now()-2088e5},{id:`c22`,content:`抱抱你，你会遇到更好的朋友的。这段时间先好好照顾自己。`,author:`匿名猫咪`,timestamp:Date.now()-2052e5}]}],PV=[`小星星`,`匿名蜗牛`,`小太阳`,`匿名蝴蝶`,`小月亮`,`匿名猫咪`,`小云朵`,`匿名树叶`,`小雨滴`,`匿名风`];function FV(){let e=(0,S.useCallback)(()=>{let e=B.get(`my_anonymous_name`);return e||(e=PV[Math.floor(Math.random()*PV.length)],B.set(`my_anonymous_name`,e)),e},[]),t=(0,S.useCallback)(()=>{B.get(`community_posts`)||B.set(`community_posts`,NV)},[]),n=(0,S.useCallback)(()=>B.get(`community_posts`,[]).sort((e,t)=>t.timestamp-e.timestamp),[]);return{initPosts:t,getPosts:n,addPost:(0,S.useCallback)(t=>{let r=n(),i={id:Date.now().toString(),content:t,author:e(),timestamp:Date.now(),likes:0,liked:!1,comments:[]};return r.unshift(i),B.set(`community_posts`,r),r},[ tent:`这是一种简单有效的放松技巧：1) 用鼻子吸气4秒；2) 屏住呼吸7秒；3) 用嘴缓慢呼气8秒。重复3-4次，可以快速缓解焦虑和紧张。这个方法的原理是通过延长呼气时间，激活副交感神经系统，让身体进入放松状态。`,category:`放松技巧`,icon:`🌬️`},{id:3,title:`认识焦虑`,content:`焦虑是一种对未来可能发生的不利事件感到担忧的情绪。适度的焦虑可以帮助我们做好准备，但过度焦虑会影响日常生活。常见的缓解方法包括：深呼吸、规律运动、倾诉、写日记、正念冥想等。如果焦虑持续影响你的生活，建议寻求专业帮助。`,category:`基础认知`,icon:`😰`},{id:4,title:`渐进式肌肉放松`,content:`从脚趾开始，依次绷紧然后放松全身各部位肌肉：脚→小腿→大腿→腹部→胸部→手→手臂→肩膀→面部。每个部位绷紧5秒，然后放松15秒。这种方法可以有效缓解身体紧张，帮助你感知放松与紧张的区别。`,category:`放松技巧`,icon:`💪`},{id:5,title:`如何建立自信`,content:`建立自信是一个循序渐进的过程：1) 关注自己的优点和成就；2) 设定可实现的小目标；3) 用积极的自我对话替代消极想法；4) 接受不完美，允许自己犯错；5) 多与支持你的人相处。记住，自信不是没有恐惧，而是在恐惧中依然行动。`,category:`自我关怀`,icon:`🌟`},{id:6,title:`友谊的力量`,content:`良好的人际关系是心理健康的重要保护因素。维护友谊的小技巧：1) 主动表达关心；2) 学会倾听；3) 分享自己的感受；4) 尊重差异；5) 在朋友需要时给予支持。如果你正在经历人际困扰，记住真正的朋友会理解你，不要害怕表达自己。`,category:`人际交往`,icon:`🤝`},{id:7,title:`正念冥想入门`,content:`正念冥想是一种将注意力集中在当下的练习。初学者可以从5分钟开始：找一个安静的地方坐下，闭上眼睛，专注于呼吸的感觉。当思绪飘走时，温柔地将注意力拉回呼吸。每天练习，你会发现自己的注意力和情绪调节能力都在提升。`,category:`放松技巧`,icon:`🧘`},{id:8,title:`应对考试压力`,content:`考试压力是学生常见的心理困扰。应对策略：1) 制定合理的复习计划；2) 保证充足的睡眠（至少7小时）；3) 适当运动释放压力；4) 与朋友或家人倾诉；5) 把"我必须考好"改为"我会尽力而为"。考试只是评价方式之一，不能定义你的价值。`,category:`压力管理`,icon:`📚`},{id:9,title:`学会说"不"`,content:`拒绝别人是一件需要学习的事情。健康地说"不"的技巧：1) 表达感谢："谢谢你想到我"；2) 简洁明确地拒绝："但这次我没办法参加"；3) 给出简单理由（可选）；4) 提出替代方案（如果愿意）。记住，拒绝不合理的要求是保护自己边界的重要方式。`,category:`人际交往`,icon:`🛡️`},{id:10,title:`睡眠与心理健康`,content:`充足的睡眠对心理健康至关重要。改善睡眠的建议：1) 保持规律的作息时间；2) 睡前1小时远离电子屏幕；3) 创造舒适的睡眠环境；4) 避免咖啡因和刺激性食物；5) 睡前可以尝试4-7-8呼吸法或渐进式肌肉放松。青少年建议每天睡8-10小时。`,category:`自我关怀`,icon:`😴`},{id:11,title:`情绪日记的力量`,content:`写情绪日记是一种有效的自我觉察工具。每天花5-10分钟记录：1) 今天最强烈的情绪是什么；2) 是什么事件引发了这种情绪；3) 你是如何应对的。长期坚持可以帮助你发现情绪模式，更好地理解自己，也是与心理老师沟通时的有力参考。`,category:`基础认知`,icon:`✍️`},{id:12,title:`什么时候该寻求帮助`,content:`以下情况建议寻求专业心理帮助：1) 持续两周以上的情绪低落；2) 失眠或嗜睡持续存在；3) 食欲明显变化；4) 对平时喜欢的事物失去兴趣；5) 出现自我伤害的想法。寻求帮助不是软弱的表现，而是勇敢的选择。学校的心理咨询室是免费且保密的。`,category:`自我关怀`,icon:`💝`}],YV=[`全部`,`基础认知`,`放松技巧`,`人际交往`,`自我关怀`,`压力管理`];function XV(){let[e,t]=(0,S.useState)(`全部`),[n,r]=(0,S.useState)(null),i=(0,S.useMemo)(()=>e===`全部`?JV:JV.filter
