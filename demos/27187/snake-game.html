<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>怀旧贪吃蛇 - Retro Snake</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-light: #1a1a2e;
            --neon-green: #39ff14;
            --neon-cyan: #00fff5;
            --neon-pink: #ff00ff;
            --neon-yellow: #ffff00;
            --crt-green: #9bbc0f;
            --crt-dark-green: #0f380f;
            --crt-light-green: #8bac0f;
            --crt-medium-green: #306230;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', monospace;
            background: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* CRT Scanline Effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
        }

        /* CRT Flicker */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 16, 16, 0.1);
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.27861; }
            5% { opacity: 0.34769; }
            10% { opacity: 0.23604; }
            15% { opacity: 0.90626; }
            20% { opacity: 0.18128; }
            25% { opacity: 0.83891; }
            30% { opacity: 0.65583; }
            35% { opacity: 0.67807; }
            40% { opacity: 0.26559; }
            45% { opacity: 0.84693; }
            50% { opacity: 0.96019; }
            55% { opacity: 0.08594; }
            60% { opacity: 0.20313; }
            65% { opacity: 0.71988; }
            70% { opacity: 0.53455; }
            75% { opacity: 0.37288; }
            80% { opacity: 0.71428; }
            85% { opacity: 0.70419; }
            90% { opacity: 0.7003; }
            95% { opacity: 0.36108; }
            100% { opacity: 0.24387; }
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 30px;
            background: linear-gradient(135deg, var(--bg-light) 0%, var(--bg-dark) 100%);
            border: 4px solid var(--neon-green);
            border-radius: 8px;
            box-shadow: 
                0 0 20px var(--neon-green),
                0 0 40px rgba(57, 255, 20, 0.3),
                inset 0 0 60px rgba(57, 255, 20, 0.1);
            position: relative;
        }

        .title {
            font-size: 24px;
            color: var(--neon-green);
            text-shadow: 
                0 0 10px var(--neon-green),
                0 0 20px var(--neon-green),
                0 0 30px var(--neon-green);
            letter-spacing: 4px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 
                    0 0 10px var(--neon-green),
                    0 0 20px var(--neon-green),
                    0 0 30px var(--neon-green);
            }
            to {
                text-shadow: 
                    0 0 20px var(--neon-green),
                    0 0 30px var(--neon-green),
                    0 0 40px var(--neon-green),
                    0 0 50px var(--neon-green);
            }
        }

        .subtitle {
            font-size: 10px;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
            margin-top: -10px;
            letter-spacing: 2px;
        }

        .score-board {
            display: flex;
            gap: 40px;
            font-size: 12px;
        }

        .score-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .score-label {
            color: var(--neon-cyan);
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        .score-value {
            color: var(--neon-yellow);
            text-shadow: 0 0 10px var(--neon-yellow);
            font-size: 16px;
        }

        .game-area {
            position: relative;
            background: #000;
            border: 3px solid var(--neon-cyan);
            box-shadow: 
                inset 0 0 30px rgba(0, 255, 245, 0.2),
                0 0 20px rgba(0, 255, 245, 0.5);
        }

        canvas {
            display: block;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 10;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay-title {
            font-size: 18px;
            color: var(--neon-pink);
            text-shadow: 0 0 20px var(--neon-pink);
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .overlay-text {
            font-size: 10px;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
            text-align: center;
            line-height: 2;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(2, 50px);
            gap: 5px;
            margin-top: 10px;
        }

        .control-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 16px;
            background: var(--bg-dark);
            color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 5px var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 255, 245, 0.3);
        }

        .control-btn:hover {
            background: var(--neon-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .control-btn.up { grid-column: 2; grid-row: 1; }
        .control-btn.left { grid-column: 1; grid-row: 2; }
        .control-btn.down { grid-column: 2; grid-row: 2; }
        .control-btn.right { grid-column: 3; grid-row: 2; }

        .instructions {
            font-size: 8px;
            color: var(--crt-light-green);
            text-align: center;
            line-height: 2;
            max-width: 400px;
            text-shadow: 0 0 5px var(--crt-light-green);
        }

        .footer {
            position: fixed;
            bottom: 20px;
            font-size: 8px;
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* Game Over specific */
        .game-over-score {
            font-size: 14px;
            color: var(--neon-yellow);
            text-shadow: 0 0 15px var(--neon-yellow);
        }

        /* Pixel art decorations */
        .pixel-border {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green);
        }

        .pixel-border.tl { top: -4px; left: -4px; }
        .pixel-border.tr { top: -4px; right: -4px; }
        .pixel-border.bl { bottom: -4px; left: -4px; }
        .pixel-border.br { bottom: -4px; right: -4px; }

        /* High score celebration */
        .new-record {
            animation: rainbow 0.5s infinite;
        }

        @keyframes rainbow {
            0% { color: #ff0000; text-shadow: 0 0 20px #ff0000; }
            33% { color: #00ff00; text-shadow: 0 0 20px #00ff00; }
            66% { color: #0000ff; text-shadow: 0 0 20px #0000ff; }
            100% { color: #ff0000; text-shadow: 0 0 20px #ff0000; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="pixel-border tl"></div>
        <div class="pixel-border tr"></div>
        <div class="pixel-border bl"></div>
        <div class="pixel-border br"></div>
        
        <h1 class="title">SNAKE</h1>
        <p class="subtitle">RETRO EDITION</p>
        
        <div class="score-board">
            <div class="score-item">
                <span class="score-label">SCORE</span>
                <span class="score-value" id="score">0</span>
            </div>
            <div class="score-item">
                <span class="score-label">HIGH</span>
                <span class="score-value" id="highScore">0</span>
            </div>
            <div class="score-item">
                <span class="score-label">LEVEL</span>
                <span class="score-value" id="level">1</span>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            
            <div class="overlay" id="startOverlay">
                <div class="overlay-title">READY?</div>
                <div class="overlay-text">
                    按空格键或点击开始<br>
                    USE ARROW KEYS OR BUTTONS<br>
                    TO CONTROL THE SNAKE
                </div>
            </div>
            
            <div class="overlay hidden" id="gameOverOverlay">
                <div class="overlay-title">GAME OVER</div>
                <div class="game-over-score" id="finalScore">SCORE: 0</div>
                <div class="overlay-text">
                    按空格键重新开始<br>
                    PRESS SPACE TO RESTART
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button class="control-btn up" data-dir="up">▲</button>
            <button class="control-btn left" data-dir="left">◀</button>
            <button class="control-btn down" data-dir="down">▼</button>
            <button class="control-btn right" data-dir="right">▶</button>
        </div>
        
        <p class="instructions">
            方向键/WASD 控制蛇的移动方向<br>
            每吃一个食物得分+10，每升一级速度加快<br>
            撞到墙壁或自己的身体游戏结束
        </p>
    </div>
    
    <div class="footer">TRAE AI CREATIVITY CONTEST 2026</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GRID_SIZE = 20;
        const CELL_SIZE = canvas.width / GRID_SIZE;
        
        // Colors - Retro Game Boy inspired
        const COLORS = {
            snake: '#9bbc0f',
            snakeHead: '#0f380f',
            snakeEye: '#0f380f',
            food: '#ff0000',
            foodGlow: '#ff6b6b',
            background: '#0f380f',
            grid: '#1a4d1a'
        };
        
        let snake = [];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let food = { x: 0, y: 0 };
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let level = 1;
        let gameSpeed = 150;
        let gameLoop = null;
        let isPlaying = false;
        let isGameOver = false;
        
        // DOM Elements
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const levelEl = document.getElementById('level');
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const finalScoreEl = document.getElementById('finalScore');
        
        highScoreEl.textContent = highScore;
        
        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            level = 1;
            gameSpeed = 150;
            isGameOver = false;
            
            scoreEl.textContent = score;
            levelEl.textContent = level;
            finalScoreEl.textContent = 'SCORE: 0';
            finalScoreEl.classList.remove('new-record');
            
            spawnFood();
        }
        
        function spawnFood() {
            do {
                food.x = Math.floor(Math.random() * GRID_SIZE);
                food.y = Math.floor(Math.random() * GRID_SIZE);
            } while (isSnakeCell(food.x, food.y));
        }
        
        function isSnakeCell(x, y) {
            return snake.some(seg => seg.x === x && seg.y === y);
        }
        
        function drawPixelRect(x, y, color, size = CELL_SIZE - 1) {
            ctx.fillStyle = color;
            ctx.fillRect(x * CELL_SIZE + 1, y * CELL_SIZE + 1, size, size);
        }
        
        function draw() {
            // Clear with background
            ctx.fillStyle = COLORS.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid (subtle)
            ctx.strokeStyle = COLORS.grid;
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }
            
            // Draw food with glow effect
            ctx.shadowColor = COLORS.foodGlow;
            ctx.shadowBlur = 15;
            drawPixelRect(food.x, food.y, COLORS.food, CELL_SIZE - 2);
            ctx.shadowBlur = 0;
            
            // Draw snake
            snake.forEach((segment, index) => {
                const isHead = index === 0;
                
                // Snake body
                ctx.shadowColor = COLORS.snake;
                ctx.shadowBlur = 8;
                drawPixelRect(segment.x, segment.y, isHead ? COLORS.snakeHead : COLORS.snake);
                ctx.shadowBlur = 0;
                
                // Draw eyes on head
                if (isHead) {
                    ctx.fillStyle = COLORS.snakeEye;
                    const eyeSize = 3;
                    const eyeOffset = 5;
                    
                    if (direction.x === 1) { // Right
                        ctx.fillRect(segment.x * CELL_SIZE + CELL_SIZE - eyeOffset - 2, segment.y * CELL_SIZE + 5, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * CELL_SIZE + CELL_SIZE - eyeOffset - 2, segment.y * CELL_SIZE + CELL_SIZE - 8, eyeSize, eyeSize);
                    } else if (direction.x === -1) { // Left
                        ctx.fillRect(segment.x * CELL_SIZE + eyeOffset, segment.y * CELL_SIZE + 5, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * CELL_SIZE + eyeOffset, segment.y * CELL_SIZE + CELL_SIZE - 8, eyeSize, eyeSize);
                    } else if (direction.y === -1) { // Up
                        ctx.fillRect(segment.x * CELL_SIZE + 5, segment.y * CELL_SIZE + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * CELL_SIZE + CELL_SIZE - 8, segment.y * CELL_SIZE + eyeOffset, eyeSize, eyeSize);
                    } else { // Down
                        ctx.fillRect(segment.x * CELL_SIZE + 5, segment.y * CELL_SIZE + CELL_SIZE - eyeOffset - 2, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * CELL_SIZE + CELL_SIZE - 8, segment.y * CELL_SIZE + CELL_SIZE - eyeOffset - 2, eyeSize, eyeSize);
                    }
                }
            });
        }
        
        function update() {
            direction = { ...nextDirection };
            
            const head = { 
                x: snake[0].x + direction.x, 
                y: snake[0].y + direction.y 
            };
            
            // Check wall collision
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                gameOver();
                return;
            }
            
            // Check self collision
            if (isSnakeCell(head.x, head.y)) {
                gameOver();
                return;
            }
            
            snake.unshift(head);
            
            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                
                // Level up every 50 points
                if (score % 50 === 0 && level < 10) {
                    level++;
                    levelEl.textContent = level;
                    gameSpeed = Math.max(50, 150 - (level - 1) * 10);
                    restartGameLoop();
                }
                
                spawnFood();
            } else {
                snake.pop();
            }
        }
        
        function gameOver() {
            isGameOver = true;
            isPlaying = false;
            clearInterval(gameLoop);
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreEl.textContent = highScore;
                finalScoreEl.textContent = 'NEW RECORD: ' + score;
                finalScoreEl.classList.add('new-record');
            } else {
                finalScoreEl.textContent = 'SCORE: ' + score;
            }
            
            gameOverOverlay.classList.remove('hidden');
        }
        
        function restartGameLoop() {
            clearInterval(gameLoop);
            gameLoop = setInterval(() => {
                update();
                draw();
            }, gameSpeed);
        }
        
        function startGame() {
            if (isPlaying) return;
            
            initGame();
            isPlaying = true;
            startOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            
            draw();
            restartGameLoop();
        }
        
        function setDirection(newDir) {
            if (!isPlaying || isGameOver) return;
            
            const dirs = {
                up: { x: 0, y: -1 },
                down: { x: 0, y: 1 },
                left: { x: -1, y: 0 },
                right: { x: 1, y: 0 }
            };
            
            const d = dirs[newDir];
            if (d && (d.x !== -direction.x || d.y !== -direction.y)) {
                nextDirection = d;
            }
        }
        
        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!isPlaying || isGameOver) {
                    startGame();
                }
                return;
            }
            
            const keyMap = {
                'ArrowUp': 'up', 'KeyW': 'up',
                'ArrowDown': 'down', 'KeyS': 'down',
                'ArrowLeft': 'left', 'KeyA': 'left',
                'ArrowRight': 'right', 'KeyD': 'right'
            };
            
            if (keyMap[e.code]) {
                e.preventDefault();
                setDirection(keyMap[e.code]);
            }
        });
        
        // Touch/Click controls
        document.querySelectorAll('.control-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (!isPlaying || isGameOver) {
                    startGame();
                } else {
                    setDirection(btn.dataset.dir);
                }
            });
        });
        
        startOverlay.addEventListener('click', startGame);
        
        // Initial draw
        initGame();
        draw();
    </script>
</body>
</html>
