<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今天吃什么</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #FF6B35;
      --primary-dark: #E85A2B;
      --bg: #FFF5F0;
      --white: #FFFFFF;
      --text-dark: #2D2D2D;
      --text-light: #666666;
      --shadow: rgba(255, 107, 53, 0.15);
      --shadow-hover: rgba(255, 107, 53, 0.25);
    }

    body {
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      max-width: 900px;
      width: 100%;
      text-align: center;
    }

    .header {
      margin-bottom: 40px;
      animation: fadeInDown 0.6s ease-out;
    }

    .title {
      font-size: clamp(2.5rem, 8vw, 4rem);
      font-weight: 800;
      color: var(--primary);
      text-shadow: 3px 3px 0 var(--white), 5px 5px 10px var(--shadow);
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 1.1rem;
      color: var(--text-light);
      margin-top: 8px;
      font-weight: 600;
    }

    .decision-btn {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: var(--white);
      border: none;
      padding: 18px 48px;
      font-size: 1.3rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      margin: 30px 0 50px;
      box-shadow: 0 8px 25px var(--shadow);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
    }

    .decision-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s;
    }

    .decision-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 35px var(--shadow-hover);
    }

    .decision-btn:hover::before {
      left: 100%;
    }

    .decision-btn:active,
    .decision-btn.bouncing {
      animation: bounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .cards-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }

    @media (max-width: 1023px) {
      .cards-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 767px) {
      .cards-container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--white);
      border-radius: 20px;
      padding: 30px 20px;
      box-shadow: 0 5px 20px var(--shadow);
      transition: all 0.3s ease-out;
      cursor: pointer;
      border: 3px solid transparent;
      opacity: 0;
      animation: fadeInUp 0.5s ease-out forwards;
    }

    .card:nth-child(1) { animation-delay: 0.1s; }
    .card:nth-child(2) { animation-delay: 0.2s; }
    .card:nth-child(3) { animation-delay: 0.3s; }
    .card:nth-child(4) { animation-delay: 0.4s; }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 35px var(--shadow-hover);
    }

    .card.selected {
      border-color: var(--primary);
      background: linear-gradient(135deg, var(--white) 0%, #FFF0E8 100%);
      transform: scale(1.05);
      box-shadow: 0 15px 40px var(--shadow-hover);
      animation: pulse 0.5s ease-in-out;
    }

    .card-icon {
      font-size: 3.5rem;
      margin-bottom: 15px;
      display: block;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .result-message {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 20px;
      min-height: 40px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .result-message.show {
      opacity: 1;
      animation: fadeIn 0.4s ease-out;
    }

    .stats {
      color: var(--text-light);
      font-size: 1rem;
      font-weight: 600;
      padding: 20px;
      background: var(--white);
      border-radius: 15px;
      display: inline-block;
      box-shadow: 0 3px 15px var(--shadow);
    }

    .stats-number {
      color: var(--primary);
      font-weight: 800;
      font-size: 1.3rem;
    }

    @keyframes bounce {
      0% { transform: scale(1); }
      30% { transform: scale(0.9); }
      50% { transform: scale(1.15); }
      70% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0% { transform: scale(1.05); box-shadow: 0 15px 40px var(--shadow-hover); }
      50% { transform: scale(1.1); box-shadow: 0 20px 50px var(--shadow-hover), 0 0 30px var(--primary); }
      100% { transform: scale(1.05); box-shadow: 0 15px 40px var(--shadow-hover); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">今天吃什么？</h1>
      <p class="subtitle">让选择困难症不再困扰你</p>
    </header>

    <button class="decision-btn" id="decideBtn">不纠结！帮我决定</button>

    <p class="result-message" id="resultMsg"></p>

    <div class="cards-container">
      <div class="card" data-option="takeout">
        <span class="card-icon">🛵</span>
        <h3 class="card-title">外卖点餐</h3>
      </div>
      <div class="card" data-option="canteen">
        <span class="card-icon">🍽️</span>
        <h3 class="card-title">食堂就餐</h3>
      </div>
      <div class="card" data-option="bento">
        <span class="card-icon">🍱</span>
        <h3 class="card-title">自带便当</h3>
      </div>
      <div class="card" data-option="outside">
        <span class="card-icon">🚶</span>
        <h3 class="card-title">外出觅食</h3>
      </div>
    </div>

    <div class="stats">
      已帮 <span class="stats-number" id="statsNumber">0</span> 位打工人做出选择
    </div>
  </div>

  <script>
    const options = [
      { id: 'takeout', name: '外卖点餐', icon: '🛵' },
      { id: 'canteen', name: '食堂就餐', icon: '🍽️' },
      { id: 'bento', name: '自带便当', icon: '🍱' },
      { id: 'outside', name: '外出觅食', icon: '🚶' }
    ];

    const messages = [
      '就这个了，开吃！',
      '完美选择，期待美味！',
      '决定就是它，别犹豫了！',
      '这顿稳了，口福不错哦！'
    ];

    const STORAGE_KEY = 'lunch_decider_count';

    const decideBtn = document.getElementById('decideBtn');
    const resultMsg = document.getElementById('resultMsg');
    const statsNumber = document.getElementById('statsNumber');
    const cards = document.querySelectorAll('.card');

    function getCount() {
      return parseInt(localStorage.getItem(STORAGE_KEY) || '0');
    }

    function setCount(count) {
      localStorage.setItem(STORAGE_KEY, count.toString());
    }

    function updateStats() {
      const count = getCount();
      statsNumber.textContent = count.toLocaleString();
    }

    function clearSelection() {
      cards.forEach(card => card.classList.remove('selected'));
      resultMsg.classList.remove('show');
    }

    function selectOption(option) {
      clearSelection();

      const card = document.querySelector(`[data-option="${option.id}"]`);
      if (card) {
        card.classList.add('selected');
      }

      const message = messages[Math.floor(Math.random() * messages.length)];
      resultMsg.textContent = `${option.icon} ${option.name} —— ${message}`;
      resultMsg.classList.add('show');
    }

    function makeDecision() {
      const count = getCount() + 1;
      setCount(count);
      updateStats();

      const randomIndex = Math.floor(Math.random() * options.length);
      const selectedOption = options[randomIndex];

      selectOption(selectedOption);
    }

    decideBtn.addEventListener('click', function() {
      this.classList.add('bouncing');
      setTimeout(() => {
        this.classList.remove('bouncing');
      }, 400);

      makeDecision();
    });

    cards.forEach(card => {
      card.addEventListener('click', function() {
        const optionId = this.dataset.option;
        const option = options.find(o => o.id === optionId);
        if (option) {
          const count = getCount() + 1;
          setCount(count);
          updateStats();
          selectOption(option);
        }
      });
    });

    updateStats();
  </script>
</body>
</html>
