<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天训练室 - 从把天聊死到聊天高手</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --warm-bg: #FDF8F3;
            --warm-card: #FFFFFF;
            --warm-primary: #E8A87C;
            --warm-primary-light: #F5D5C0;
            --warm-secondary: #85C1B2;
            --warm-accent: #D4A574;
            --warm-text: #4A403A;
            --warm-text-light: #8B7E74;
            --warm-border: #F0E6DC;
            --warm-shadow: rgba(74, 64, 58, 0.08);
            --warm-highlight: #FFF5EB;
            --warm-success: #7EB8A2;
            --warm-warning: #E8A87C;
            --warm-danger: #D4918C;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--warm-bg);
            color: var(--warm-text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 背景装饰 */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-decoration::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 80%;
            height: 100%;
            background: radial-gradient(ellipse, var(--warm-primary-light) 0%, transparent 70%);
            opacity: 0.4;
            animation: float 20s ease-in-out infinite;
        }

        .bg-decoration::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 60%;
            height: 80%;
            background: radial-gradient(ellipse, var(--warm-secondary) 0%, transparent 70%);
            opacity: 0.15;
            animation: float 25s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        /* 主容器 */
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        /* 头部 */
        .header {
            text-align: center;
            padding: 40px 0 30px;
            animation: fadeInDown 0.8s ease-out;
        }

        .header h1 {
            font-family: 'Noto Serif SC', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--warm-text);
            margin-bottom: 10px;
        }

        .header .subtitle {
            font-size: 1.1rem;
            color: var(--warm-text-light);
            font-weight: 300;
        }

        /* 导航标签 */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .nav-tab {
            padding: 12px 24px;
            border-radius: 50px;
            border: 2px solid var(--warm-border);
            background: var(--warm-card);
            color: var(--warm-text-light);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .nav-tab:hover {
            border-color: var(--warm-primary);
            color: var(--warm-primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--warm-shadow);
        }

        .nav-tab.active {
            background: var(--warm-primary);
            border-color: var(--warm-primary);
            color: white;
            box-shadow: 0 4px 16px rgba(232, 168, 124, 0.3);
        }

        /* 内容区域 */
        .content-area {
            animation: fadeIn 0.6s ease-out;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* 聊天训练区 */
        .chat-container {
            background: var(--warm-card);
            border-radius: 24px;
            box-shadow: 0 8px 32px var(--warm-shadow);
            overflow: hidden;
            min-height: 500px;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px 24px;
            background: linear-gradient(135deg, var(--warm-primary-light) 0%, var(--warm-highlight) 100%);
            border-bottom: 1px solid var(--warm-border);
        }

        .chat-header h3 {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.2rem;
            color: var(--warm-text);
        }

        .chat-header .scene-info {
            font-size: 0.85rem;
            color: var(--warm-text-light);
            margin-top: 4px;
        }

        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            max-height: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.4s ease-out;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .message.bot .message-avatar {
            background: var(--warm-primary-light);
        }

        .message.user .message-avatar {
            background: var(--warm-secondary);
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .message.bot .message-content {
            background: var(--warm-highlight);
            border-bottom-left-radius: 4px;
        }

        .message.user .message-content {
            background: var(--warm-secondary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-time {
            font-size: 0.75rem;
            color: var(--warm-text-light);
            margin-top: 4px;
            text-align: right;
        }

        /* 选项区域 */
        .options-area {
            padding: 20px 24px;
            background: var(--warm-bg);
            border-top: 1px solid var(--warm-border);
        }

        .options-title {
            font-size: 0.9rem;
            color: var(--warm-text-light);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            padding: 14px 18px;
            background: var(--warm-card);
            border: 2px solid var(--warm-border);
            border-radius: 14px;
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;
            color: var(--warm-text);
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.5;
        }

        .option-btn:hover {
            border-color: var(--warm-primary);
            background: var(--warm-highlight);
            transform: translateX(4px);
        }

        .option-btn.selected {
            border-color: var(--warm-primary);
            background: var(--warm-primary-light);
        }

        .option-btn.correct {
            border-color: var(--warm-success);
            background: #E8F5F0;
        }

        .option-btn.incorrect {
            border-color: var(--warm-danger);
            background: #FDF0EF;
        }

        /* 反馈区域 */
        .feedback-area {
            margin-top: 16px;
            padding: 16px;
            border-radius: 14px;
            animation: fadeIn 0.4s ease-out;
        }

        .feedback-area.good {
            background: #E8F5F0;
            border: 1px solid var(--warm-success);
        }

        .feedback-area.bad {
            background: #FDF0EF;
            border: 1px solid var(--warm-danger);
        }

        .feedback-title {
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .feedback-area.good .feedback-title {
            color: var(--warm-success);
        }

        .feedback-area.bad .feedback-title {
            color: var(--warm-danger);
        }

        .feedback-text {
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--warm-text);
        }

        .feedback-tip {
            margin-top: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--warm-text-light);
        }

        .next-btn {
            margin-top: 12px;
            padding: 10px 24px;
            background: var(--warm-primary);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .next-btn:hover {
            background: var(--warm-accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(232, 168, 124, 0.3);
        }

        /* 技巧学习卡片 */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .skill-card {
            background: var(--warm-card);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 20px var(--warm-shadow);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .skill-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 32px var(--warm-shadow);
            border-color: var(--warm-primary-light);
        }

        .skill-card.expanded {
            border-color: var(--warm-primary);
            grid-column: 1 / -1;
        }

        .skill-number {
            display: inline-block;
            width: 32px;
            height: 32px;
            background: var(--warm-primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .skill-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--warm-text);
        }

        .skill-desc {
            font-size: 0.9rem;
            color: var(--warm-text-light);
            line-height: 1.6;
        }

        .skill-detail {
            display: none;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--warm-border);
        }

        .skill-card.expanded .skill-detail {
            display: block;
            animation: fadeIn 0.4s ease-out;
        }

        .skill-example {
            background: var(--warm-highlight);
            padding: 16px;
            border-radius: 12px;
            margin-top: 12px;
        }

        .skill-example-label {
            font-size: 0.8rem;
            color: var(--warm-primary);
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .skill-example-dialog {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .example-line {
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .example-line .speaker {
            font-weight: 600;
            color: var(--warm-primary);
        }

        /* 进度统计 */
        .stats-container {
            background: var(--warm-card);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 20px var(--warm-shadow);
            text-align: center;
        }

        .stats-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.3rem;
            margin-bottom: 24px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-item {
            padding: 20px;
            background: var(--warm-bg);
            border-radius: 16px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--warm-primary);
            font-family: 'Noto Serif SC', serif;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--warm-text-light);
            margin-top: 4px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--warm-border);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--warm-primary), var(--warm-secondary));
            border-radius: 4px;
            transition: width 0.6s ease;
        }

        /* 开始页面 */
        .start-screen {
            text-align: center;
            padding: 60px 20px;
        }

        .start-screen h2 {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.8rem;
            margin-bottom: 16px;
        }

        .start-screen p {
            color: var(--warm-text-light);
            margin-bottom: 32px;
            line-height: 1.8;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .start-btn {
            padding: 16px 48px;
            background: var(--warm-primary);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
            box-shadow: 0 4px 16px rgba(232, 168, 124, 0.3);
        }

        .start-btn:hover {
            background: var(--warm-accent);
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(232, 168, 124, 0.4);
        }

        /* 动画 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .message-content {
                max-width: 85%;
            }
        }

        /* 打字机效果 */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: var(--warm-highlight);
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            width: fit-content;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--warm-primary);
            border-radius: 50%;
            animation: typingBounce 1.4s ease-in-out infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="bg-decoration"></div>
    
    <div class="app-container">
        <header class="header">
            <h1>聊天训练室</h1>
            <p class="subtitle">从把天聊死到聊天高手，用提问搭建双向通道</p>
        </header>

        <nav class="nav-tabs">
            <button class="nav-tab active" data-section="training">对话训练</button>
            <button class="nav-tab" data-section="skills">技巧学习</button>
            <button class="nav-tab" data-section="progress">我的进度</button>
        </nav>

        <main class="content-area">
            <!-- 对话训练区 -->
            <section id="training" class="section active">
                <div class="chat-container">
                    <div class="chat-header">
                        <h3 id="scene-title">场景：朋友分享日常</h3>
                        <div class="scene-info" id="scene-desc">练习用提问延续对话，避免单向输出</div>
                    </div>
                    
                    <div class="chat-messages" id="chat-messages">
                        <!-- 消息会动态添加 -->
                    </div>

                    <div class="options-area" id="options-area">
                        <div class="options-title">选择你的回复方式：</div>
                        <div class="options-list" id="options-list">
                            <!-- 选项会动态添加 -->
                        </div>
                        <div id="feedback-container"></div>
                    </div>
                </div>
            </section>

            <!-- 技巧学习区 -->
            <section id="skills" class="section">
                <div class="skills-grid" id="skills-grid">
                    <!-- 技巧卡片会动态添加 -->
                </div>
            </section>

            <!-- 进度统计区 -->
            <section id="progress" class="section">
                <div class="stats-container">
                    <h2 class="stats-title">学习进度</h2>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-value" id="stat-completed">0</div>
                            <div class="stat-label">已完成场景</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="stat-correct">0</div>
                            <div class="stat-label">正确选择</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="stat-streak">0</div>
                            <div class="stat-label">连续正确</div>
                        </div>
                    </div>
                    <div style="text-align: left;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <span style="font-size: 0.9rem; color: var(--warm-text-light);">总体进度</span>
                            <span style="font-size: 0.9rem; font-weight: 600; color: var(--warm-primary);" id="progress-percent">0%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // 数据定义
        const scenarios = [
            {
                id: 1,
                title: "朋友分享日常",
                desc: "练习用提问延续对话，避免单向输出",
                messages: [
                    { sender: "bot", text: "最近一直在养猫" }
                ],
                options: [
                    {
                        text: "小猫也太治愈了！养多久啦？我之前也想养，但怕没时间照顾。你家小猫会不会很调皮？",
                        type: "good",
                        feedback: "太棒了！你使用了承接式提问：先附和，再细节追问，简短分享自己，最后二次提问。",
                        tip: "公式：附和 + 提问 + 简短分享 + 二次提问"
                    },
                    {
                        text: "哦，挺好。",
                        type: "bad",
                        feedback: "这个回复太简短了，没有任何提问，对方很难接下去。",
                        tip: "避免零提问型回复，至少抛出一个问题让对方有继续聊天的支点。"
                    },
                    {
                        text: "我也养过猫，猫真的很麻烦，每天要铲屎、喂食、梳毛，还要定期打疫苗，生病了更麻烦，上次我家猫......（长篇大论）",
                        type: "bad",
                        feedback: "单向输出型！你只顾自己讲，没有给对方回应的空间。",
                        tip: "遵守「输出-留白」规则：短输出（1-2句）+ 立刻抛提问。"
                    }
                ]
            },
            {
                id: 2,
                title: "同事抱怨加班",
                desc: "练习转换共鸣提问，把话题拉到你擅长的领域",
                messages: [
                    { sender: "bot", text: "最近总加班，感觉好累啊" }
                ],
                options: [
                    {
                        text: "加班真的消耗人，我之前连续加班一周，每天都没胃口。你加班一般会点什么外卖？",
                        type: "good",
                        feedback: "很好！先共情，再自然转换到美食话题+提问。",
                        tip: "转换共鸣提问：共情 + 自然跳转话题 + 提问"
                    },
                    {
                        text: "加班有加班费吗？加到几点？周末也加吗？",
                        type: "bad",
                        feedback: "审问式提问！连续盘问会让人有压迫感。",
                        tip: "避免连续追问，先共情回应，再温和提问。"
                    },
                    {
                        text: "是啊，现在工作都不好做。",
                        type: "bad",
                        feedback: "虽然表达了认同，但没有提问，对话难以延续。",
                        tip: "即使认同对方，也要搭配一个问题来延续对话。"
                    }
                ]
            },
            {
                id: 3,
                title: "朋友说起周末计划",
                desc: "练习开放式提问，避开封闭式问答",
                messages: [
                    { sender: "bot", text: "周末打算出去逛逛" }
                ],
                options: [
                    {
                        text: "听起来不错！你一般周末喜欢去什么样的地方放松？",
                        type: "good",
                        feedback: "优秀的开放式提问！让对方可以展开说，而不是只能回答'是'或'否'。",
                        tip: "开放式提问用'什么'、'怎么'、'为什么'开头，避免'是不是'、'有没有'。"
                    },
                    {
                        text: "去逛街吗？",
                        type: "bad",
                        feedback: "封闭式提问，对方只能回答'是'或'不是'，容易聊死。",
                        tip: "封闭式问题（是不是/有没有）→ 开放式问题（什么/怎么/为什么）"
                    },
                    {
                        text: "我周末通常在家打游戏，最近那个新出的游戏特别好玩，画面特别精美，剧情也很棒，你要不要试试？",
                        type: "bad",
                        feedback: "单向输出！自己讲了一大堆，没有先了解对方的兴趣。",
                        tip: "先提问了解对方，再决定是否分享自己的相关经历。"
                    }
                ]
            },
            {
                id: 4,
                title: "朋友分享旅行经历",
                desc: "练习细节追问法，抓住关键词提问",
                messages: [
                    { sender: "bot", text: "昨天去爬山了，累瘫了" }
                ],
                options: [
                    {
                        text: "爬山也太爽了吧！是去的附近的山还是远一点的景区？路上堵不堵？",
                        type: "good",
                        feedback: "很好的细节追问！抓住'爬山'这个关键词，从地点、交通等细节切入。",
                        tip: "细节追问法：抓住对方话里的任意名词（爬山→地点/交通/难度/风景）"
                    },
                    {
                        text: "爬山挺好的，锻炼身体。",
                        type: "bad",
                        feedback: "简单结论，没有提问，对话终结。",
                        tip: "即使是认同的话，也要加上一个问题。"
                    },
                    {
                        text: "我也喜欢爬山，上周我去了一个特别美的地方，早上六点出门，路上堵车一小时，山顶人巨多，台阶又陡，中途还下雨......",
                        type: "bad",
                        feedback: "典型的单向输出型！对方说累瘫了，你却在讲自己的经历。",
                        tip: "先回应对方的感受（累瘫了→辛苦了/那要好好休息），再提问。"
                    }
                ]
            },
            {
                id: 5,
                title: "朋友说起工作烦恼",
                desc: "练习安全模板：分享一小段经历 + 反问对方",
                messages: [
                    { sender: "bot", text: "今天被领导批评了，心情好差" }
                ],
                options: [
                    {
                        text: "被批评确实很难受，我之前也被说过一次，当时整晚都没睡好。你现在感觉怎么样？",
                        type: "good",
                        feedback: "完美！使用安全模板：简短共情 + 简短分享 + 关心提问。",
                        tip: "安全模板：共情回应 + 简短自我分享（1-2句）+ 反问对方感受"
                    },
                    {
                        text: "为什么被批评？你做了什么？领导怎么说？",
                        type: "bad",
                        feedback: "审问式提问！对方心情已经不好了，连续追问会增加压力。",
                        tip: "对方情绪低落时，先给予情感支持，而不是追问细节。"
                    },
                    {
                        text: "别难过了，想开点，工作就是这样。",
                        type: "bad",
                        feedback: "虽然想安慰，但过于敷衍，没有真正回应对方的情绪。",
                        tip: "避免'想开点'这类无效安慰，尝试理解对方的具体感受。"
                    }
                ]
            }
        ];

        const skills = [
            {
                id: 1,
                title: "承接式提问",
                desc: "先接住对方的话，再抛小问题，既尊重对方，又悄悄把话题往你想聊的方向带。",
                formula: "共情回应 + 细节小提问",
                example: {
                    other: "周末去露营了",
                    you: "露营也太舒服了吧！你们是自己搭帐篷还是租的？"
                }
            },
            {
                id: 2,
                title: "细节追问法",
                desc: "不用想复杂话题，抓住对方话里任意一个名词提问，万能不会冷场。",
                formula: "抓住关键词 → 从细节切入提问",
                example: {
                    other: "今天上班好累",
                    you: "今天是加班了吗？还是工作内容特别繁琐？"
                }
            },
            {
                id: 3,
                title: "转换共鸣提问",
                desc: "先共情，再自然跳转话题+提问，把话题拉到你擅长的领域。",
                formula: "共情 + 自然跳转话题 + 提问",
                example: {
                    other: "最近总加班",
                    you: "加班真的消耗人，我之前连续加班一周，每天都没胃口。你加班一般会点什么外卖？"
                }
            },
            {
                id: 4,
                title: "开放式提问",
                desc: "避开只能答是/否的封闭式问题，让对方有展开说的空间。",
                formula: "用'什么/怎么/为什么'代替'是不是/有没有'",
                example: {
                    other: "周末出去玩了",
                    you: "你去过最有意思的地方是哪里？"
                }
            },
            {
                id: 5,
                title: "安全模板",
                desc: "适合不善聊天的人直接套用，保证有来有回不会冷场。",
                formula: "附和（1句）+ 提问 + 简短分享 + 二次提问",
                example: {
                    other: "最近一直在养猫",
                    you: "小猫也太治愈了！养多久啦？我之前也想养，但怕没时间照顾。你家小猫会不会很调皮？"
                }
            },
            {
                id: 6,
                title: "输出-留白规则",
                desc: "不是禁止讲自己的事，而是遵守规则，保持双向交流。",
                formula: "短输出（1-2句）+ 立刻抛提问",
                example: {
                    other: "你周末怎么过的？",
                    you: "我昨天尝试做饭差点翻车，油溅得到处都是。你平时会自己下厨吗？"
                }
            }
        ];

        // 状态管理
        let currentScenario = 0;
        let stats = {
            completed: 0,
            correct: 0,
            streak: 0,
            total: scenarios.length
        };
        let isWaitingForNext = false;

        // DOM 元素
        const chatMessages = document.getElementById('chat-messages');
        const optionsList = document.getElementById('options-list');
        const feedbackContainer = document.getElementById('feedback-container');
        const sceneTitle = document.getElementById('scene-title');
        const sceneDesc = document.getElementById('scene-desc');

        // 初始化
        function init() {
            loadScenario(0);
            renderSkills();
            updateStats();
            setupNavigation();
        }

        // 加载场景
        function loadScenario(index) {
            if (index >= scenarios.length) {
                showCompletion();
                return;
            }

            currentScenario = index;
            const scenario = scenarios[index];
            
            sceneTitle.textContent = `场景：${scenario.title}`;
            sceneDesc.textContent = scenario.desc;
            
            chatMessages.innerHTML = '';
            feedbackContainer.innerHTML = '';
            isWaitingForNext = false;

            // 添加初始消息
            scenario.messages.forEach(msg => {
                addMessage(msg.sender, msg.text);
            });

            // 添加选项
            renderOptions(scenario.options);
        }

        // 添加消息到聊天区
        function addMessage(sender, text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = sender === 'bot' ? '👤' : '😊';
            
            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = text;
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(content);
            chatMessages.appendChild(messageDiv);
            
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 渲染选项
        function renderOptions(options) {
            optionsList.innerHTML = '';
            options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option.text;
                btn.onclick = () => selectOption(index);
                optionsList.appendChild(btn);
            });
        }

        // 选择选项
        function selectOption(index) {
            if (isWaitingForNext) return;
            
            const scenario = scenarios[currentScenario];
            const option = scenario.options[index];
            const buttons = optionsList.querySelectorAll('.option-btn');
            
            // 禁用所有按钮
            buttons.forEach(btn => btn.disabled = true);
            
            // 标记选中
            buttons[index].classList.add('selected');
            
            // 显示反馈
            showFeedback(option);
            
            // 添加用户消息到聊天
            addMessage('user', option.text);
            
            // 更新统计
            if (option.type === 'good') {
                stats.correct++;
                stats.streak++;
                buttons[index].classList.add('correct');
            } else {
                stats.streak = 0;
                buttons[index].classList.add('incorrect');
                
                // 标记正确答案
                scenario.options.forEach((opt, i) => {
                    if (opt.type === 'good') {
                        buttons[i].classList.add('correct');
                    }
                });
            }
            
            stats.completed++;
            updateStats();
            
            isWaitingForNext = true;
        }

        // 显示反馈
        function showFeedback(option) {
            const feedbackDiv = document.createElement('div');
            feedbackDiv.className = `feedback-area ${option.type}`;
            
            const title = document.createElement('div');
            title.className = 'feedback-title';
            title.textContent = option.type === 'good' ? '✓ 做得好！' : '✗ 还可以改进';
            
            const text = document.createElement('div');
            text.className = 'feedback-text';
            text.textContent = option.feedback;
            
            const tip = document.createElement('div');
            tip.className = 'feedback-tip';
            tip.textContent = `💡 ${option.tip}`;
            
            feedbackDiv.appendChild(title);
            feedbackDiv.appendChild(text);
            feedbackDiv.appendChild(tip);
            
            if (currentScenario < scenarios.length - 1) {
                const nextBtn = document.createElement('button');
                nextBtn.className = 'next-btn';
                nextBtn.textContent = '下一个场景 →';
                nextBtn.onclick = () => loadScenario(currentScenario + 1);
                feedbackDiv.appendChild(nextBtn);
            } else {
                const completeBtn = document.createElement('button');
                completeBtn.className = 'next-btn';
                completeBtn.textContent = '查看学习进度 →';
                completeBtn.onclick = () => {
                    document.querySelector('[data-section="progress"]').click();
                };
                feedbackDiv.appendChild(completeBtn);
            }
            
            feedbackContainer.innerHTML = '';
            feedbackContainer.appendChild(feedbackDiv);
        }

        // 显示完成
        function showCompletion() {
            chatMessages.innerHTML = '';
            optionsList.innerHTML = '';
            feedbackContainer.innerHTML = '';
            
            const completionDiv = document.createElement('div');
            completionDiv.style.textAlign = 'center';
            completionDiv.style.padding = '40px 20px';
            completionDiv.innerHTML = `
                <div style="font-size: 4rem; margin-bottom: 20px;">🎉</div>
                <h3 style="font-family: 'Noto Serif SC', serif; font-size: 1.5rem; margin-bottom: 12px;">恭喜你完成了所有训练场景！</h3>
                <p style="color: var(--warm-text-light); margin-bottom: 24px;">你已经掌握了提问的核心技巧，继续练习，聊天会越来越自然。</p>
                <button class="next-btn" onclick="location.reload()">重新训练</button>
            `;
            chatMessages.appendChild(completionDiv);
        }

        // 渲染技巧卡片
        function renderSkills() {
            const grid = document.getElementById('skills-grid');
            skills.forEach(skill => {
                const card = document.createElement('div');
                card.className = 'skill-card';
                card.onclick = () => toggleSkill(card);
                
                card.innerHTML = `
                    <div class="skill-number">${skill.id}</div>
                    <div class="skill-title">${skill.title}</div>
                    <div class="skill-desc">${skill.desc}</div>
                    <div class="skill-detail">
                        <div style="font-weight: 600; color: var(--warm-primary); margin-bottom: 8px;">公式：${skill.formula}</div>
                        <div class="skill-example">
                            <div class="skill-example-label">示例对话</div>
                            <div class="skill-example-dialog">
                                <div class="example-line"><span class="speaker">对方：</span>${skill.example.other}</div>
                                <div class="example-line"><span class="speaker">你：</span>${skill.example.you}</div>
                            </div>
                        </div>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }

        // 切换技巧卡片展开
        function toggleSkill(card) {
            const isExpanded = card.classList.contains('expanded');
            document.querySelectorAll('.skill-card').forEach(c => c.classList.remove('expanded'));
            if (!isExpanded) {
                card.classList.add('expanded');
            }
        }

        // 更新统计
        function updateStats() {
            document.getElementById('stat-completed').textContent = Math.min(stats.completed, stats.total);
            document.getElementById('stat-correct').textContent = stats.correct;
            document.getElementById('stat-streak').textContent = stats.streak;
            
            const percent = Math.round((Math.min(stats.completed, stats.total) / stats.total) * 100);
            document.getElementById('progress-percent').textContent = `${percent}%`;
            document.getElementById('progress-fill').style.width = `${percent}%`;
        }

        // 设置导航
        function setupNavigation() {
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    const section = tab.dataset.section;
                    
                    // 更新标签状态
                    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    
                    // 切换内容
                    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                    document.getElementById(section).classList.add('active');
                });
            });
        }

        // 启动
        init();
    </script>
</body>
</html>
