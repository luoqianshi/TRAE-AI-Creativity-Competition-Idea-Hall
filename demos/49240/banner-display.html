  const colorPresets   = document.getElementById('colorPresets');
  const scrollToggle   = document.getElementById('scrollToggle');
  const scrollTag      = document.getElementById('scrollTag');

  // Display overlay
  const displayOverlay       = document.getElementById('displayOverlay');
  const displayRangeFontSize = document.getElementById('displayRangeFontSize');
  const displayRangeSpeed    = document.getElementById('displayRangeSpeed');
  const displayFontSizeVal   = document.getElementById('displayFontSizeVal');
  const displaySpeedVal      = document.getElementById('displaySpeedVal');

  // ========== State ==========
  let settings = {
    fontSize: 56,
    speed: 60,
    color: '#1C1C1E',
    theme: 'light',
    scroll: true
  };

  let isPaused    = false;
  let animFrameId = null;
  let marqueeX    = 0;
  let lastTime    = 0;
  let textWidth   = 0;
  let overlayTimer = null;

  // ========== Load saved settings ==========
  function loadSettings() {
    try {
      const saved = localStorage.getItem('banner-display-settings');
      if (saved) {
        const parsed = JSON.parse(saved);
        settings = { ...settings, ...parsed };
      }
    } catch (e) { /* ignore */ }
    applySettingsToUI();
    applyTheme();
  }

  function saveSettings() {
    try {
      localStorage.setItem('banner-display-settings', JSON.stringify(settings));
    } catch (e) { /* ignore */ }
  }

  function applySettingsToUI() {
    rangeFontSize.value = settings.fontSize;
    rangeSpeed.value = settings.speed;
    colorPicker.value = settings.color;
    updateFontSizeTag();
    updateSpeedTag();
    updateColorTag();
    updateColorPresetActive();
    updateScrollUI();
  }

  // ========== Theme ==========
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', settings.theme);
    btnThemeToggle.textContent = settings.theme === 'dark' ? '🌙' : '☀️';
    if (settings.theme === 'dark' && settings.color === '#1C1C1E') {
      settings.color = '#E8E8ED';
      colorPicker.value = settings.color;
      updateColorTag();
      updateColorPresetActive();
    } else if (settings.theme === 'light' && settings.color === '#E8E8ED') {
      settings.color = '#1C1C1E';
      colorPicker.value = settings.color;
      updateColorTag();
      updateColorPresetActive();
    }
  }

  function toggleTheme() {
    settings.theme = settings.theme === 'light' ? 'dark' : 'light';
    applyTheme();
    saveSettings();
  }

  // ========== Toast ==========
  let toastTimer = null;
  function showToast(msg) {
    if (toastTimer) clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.classList.add('visible');
    toastTimer = setTimeout(() => {
      toastEl.classList.remove('visible');
    }, 2000);
  }

  // ========== Settings updates ==========
  function updateFontSizeTag() {
    fontSizeTag.textContent = settings.fontSize + 'px';
    displayFontSizeVal.textContent = settings.fontSize + 'px';
    displayRangeFontSize.value = settings.fontSize;
  }

  function updateSpeedTag() {
    const s = settings.speed;
    let label;
    if (s <= 60) label = '慢速';
    else if (s <= 140) label = '中速';
    else if (s <= 250) label = '快速';
    else label = '极速';
    speedTag.textContent = label;
    displaySpeedVal.textContent = label;
    displayRangeSpeed.value = settings.speed;
  }

  function updateColorTag() {
    const colorNames = {
      '#1C1C1E': '墨黑', '#DC2626': '红色', '#EA580C': '橙色',
      '#CA8A04': '金色', '#16A34A': '绿色', '#2563EB': '蓝色',
      '#7C3AED': '紫色', '#DB2777': '粉色', '#E8E8ED': '浅白', '#FFFFFF': '白色'
    };
    colorTag.textContent = colorNames[settings.color.toUpperCase()] || '自定义';
  }

  function updateColorPresetActive() {
    const presets = colorPresets.querySelectorAll('.color-preset');
    presets.forEach(p => {
      const c = p.dataset.color.toUpperCase();
      p.classList.toggle('active', c === settings.color.toUpperCase());
    });
  }

  function updateScrollUI() {
    scrollTag.textContent = settings.scroll ? '滚动' : '静止';
    const opts = scrollToggle.querySelectorAll('.toggle-option');
    opts.forEach(o => o.classList.toggle('active', o.dataset.scroll === 'true' ? settings.scroll : !settings.scroll));
  }

  // ========== Input ==========
  function updateCharCount() {
    const len = inputText.value.length;
    charCount.textContent = len + ' / 500';
    btnStart.disabled = len === 0;
    // Show/hide clear button
    btnClear.classList.toggle('visible', len > 0);
  }

  // ========== Marquee Animation ==========
  function applyMarqueeStyle() {
    marqueeText1.style.fontSize = settings.fontSize + 'px';
    marqueeText1.style.color = settings.color;
    marqueeText2.style.fontSize = settings.fontSize + 'px';
    marqueeText2.style.color = settings.color;
  }

  function startMarquee() {
    const text = inputText.value.trim();
    if (!text) return;

    // Clear
    marqueeTrack.classList.remove('static');
    marqueeTrack.style.transform = '';
    marqueeText1.style.paddingRight = '';
    marqueeText2.style.paddingRight = '';
    marqueeText2.style.display = '';

    marqueeText1.textContent = text;
    marqueeText2.textContent = text;
    applyMarqueeStyle();

    if (settings.scroll) {
      const gap = 60;
      marqueeText1.style.paddingRight = gap + 'px';
      marqueeText2.style.paddingRight = gap + 'px';
      textWidth = marqueeText1.offsetWidth;
      marqueeX = 0;
      isPaused = false;
      lastTime = 0;
    } else {
      marqueeTrack.classList.add('static');
      marqueeText2.style.display = 'none';
      textWidth = 0;
      marqueeX = 0;
      isPaused = true;
      lastTime = 0;
    }

    marqueeTrack.style.transform = 'translateX(0px)';
    displayScreen.classList.add('active');
    appContainer.style.display = 'none';
    requestLandscape();

    if (animFrameId) cancelAnimationFrame(animFrameId);
    animFrameId = requestAnimationFrame(animate);
  }

  function animate(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    if (!isPaused) {
      marqueeX -= settings.speed * dt;
      if (marqueeX <= -textWidth) {
        marqueeX += textWidth;
      }
    }

    marqueeTrack.style.transform = 'translateX(' + marqueeX + 'px)';
    animFrameId = requestAnimationFrame(animate);
  }

  function stopMarquee() {
    if (animFrameId) {
      cancelAnimationFrame(animFrameId);
      animFrameId = null;
    }
    hideOverlay();
    displayScreen.classList.remove('active');
    appContainer.style.display = '';
    releaseLandscape();
  }

  function togglePause() {
    isPaused = !isPaused;
    if (isPaused) {
      pauseHint.classList.add('show');
      setTimeout(() => pauseHint.classList.remove('show'), 1500);
    } else {
      pauseHint.classList.remove('show');
      lastTime = 0;
    }
  }

  // ========== Display Overlay ==========
  function showOverlay() {
    displayOverlay.classList.add('visible');
    displayRangeFontSize.value = settings.fontSize;
    displayRangeSpeed.value = settings.speed;
    displayFontSizeVal.textContent = settings.fontSize + 'px';
    updateSpeedTag();
    resetOverlayTimer();
  }

  function hideOverlay() {
    displayOverlay.classList.remove('visible');
    if (overlayTimer) clearTimeout(overlayTimer);
    overlayTimer = null;
  }

  function resetOverlayTimer() {
    if (overlayTimer) clearTimeout(overlayTimer);
    overlayTimer = setTimeout(() => {
      displayOverlay.classList.remove('visible');
    }, 5000);
  }

  // ========== Orientation ==========
  function requestLandscape() {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(function() {
        screen.orientation.lock('landscape-primary').catch(function() {});
      });
    }
  }

  function releaseLandscape() {
    if (screen.orientation && screen.orientation.unlock) {
      screen.orientation.unlock();
    }
  }

  // ========== Event Listeners ==========

  // Input
  inputText.addEventListener('input', updateCharCount);

  // Clear button
  btnClear.addEventListener('click', () => {
    inputText.value = '';
    updateCharCount();
    inputText.focus();
  });

  // Start
  btnStart.addEventListener('click', () => {
    if (inputText.value.trim()) {
      startMarquee();
    }
  });

  // Theme
  btnThemeToggle.addEventListener('click', toggleTheme);

  // Exit display
  btnExit.addEventListener('click', (e) => {
    e.stopPropagation();
    stopMarquee();
  });

  // Tap display screen: show overlay OR pause
  displayScreen.addEventListener('click', (e) => {
    if (e.target === btnExit || btnExit.contains(e.target)) return;
    // If overlay is visible and tap is outside overlay => hide overlay
    if (displayOverlay.classList.contains('visible')) {
      if (!displayOverlay.contains(e.target)) {
        hideOverlay();
        return;
      }
      return;
    }
    // If overlay is hidden, show it
    showOverlay();
  });

  // Long press on display screen to toggle pause (only when scrolling)
  let longPressTimer = null;
  displayScreen.addEventListener('touchstart', (e) => {
    if (e.target === btnExit || btnExit.contains(e.target)) return;
    if (displayOverlay.contains(e.target)) return;
    if (!settings.scroll) return;
    longPressTimer = setTimeout(() => {
      togglePause();
      longPressTimer = null;
    }, 600);
  }, { passive: true });
  displayScreen.addEventListener('touchend', () => {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  });
  displayScreen.addEventListener('touchmove', () => {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  });

  // Display overlay sliders
  displayRangeFontSize.addEventListener('input', () => {
    settings.fontSize = parseInt(displayRangeFontSize.value);
    displayFontSizeVal.textContent = settings.fontSize + 'px';
    rangeFontSize.value = settings.fontSize;
    updateFontSizeTag();
    applyMarqueeStyle();
    saveSettings();
    resetOverlayTimer();
  });

  displayRangeSpeed.addEventListener('input', () => {
    settings.speed = parseInt(displayRangeSpeed.value);
    rangeSpeed.value = settings.speed;
    updateSpeedTag();
    lastTime = 0;
    saveSettings();
    resetOverlayTimer();
  });

  // Main page settings
  rangeFontSize.addEventListener('input', () => {
    settings.fontSize = parseInt(rangeFontSize.value);
    updateFontSizeTag();
    saveSettings();
  });

  rangeSpeed.addEventListener('input', () => {
    settings.speed = parseInt(rangeSpeed.value);
    updateSpeedTag();
    lastTime = 0;
    saveSettings();
  });

  colorPicker.addEventListener('input', () => {
    settings.color = colorPicker.value;
    updateColorTag();
    updateColorPresetActive();
    saveSettings();
  });

  colorPresets.addEventListener('click', (e) => {
    const preset = e.target.closest('.color-preset');
    if (!preset) return;
    settings.color = preset.dataset.color;
    colorPicker.value = settings.color;
    updateColorTag();
    updateColorPresetActive();
    saveSettings();
  });

  scrollToggle.addEventListener('click', (e) => {
    const opt = e.target.closest('.toggle-option');
    if (!opt) return;
    settings.scroll = opt.dataset.scroll === 'true';
    updateScrollUI();
    saveSettings();
  });

  // System back button
  window.handleBackButton = function() {
    if (displayScreen.classList.contains('active')) {
      stopMarquee();
      return;
    }
    if (navigator.app && navigator.app.exitApp) {
      navigator.app.exitApp();
    }
  };

  document.addEventListener('backbutton', function(e) {
    window.handleBackButton();
  }, false);

  // Keyboard
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && displayScreen.classList.contains('active')) {
      stopMarquee();
    }
  });

  // Visibility
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && displayScreen.classList.contains('active')) {
      if (!isPaused) {
        isPaused = true;
        pauseHint.classList.add('show');
      }
    }
  });

  // Orientation change
  window.addEventListener('orientationchange', () => {
    if (displayScreen.classList.contains('active')) {
      setTimeout(() => {
        const text = inputText.value.trim();
        if (text) {
          stopMarquee();
          setTimeout(() => startMarquee(), 100);
        }
      }, 300);
    }
  });

  // ========== Init ==========
  loadSettings();
  updateCharCount();

  console.log('✅ 展板显示工具已就绪');
})();
</script>

</body>
</html>
