<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>灶伴</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg: #fdfbf7;
            --bg2: #f5f0e8;
            --ink: #2d2417;
            --muted: #9a8e7b;
            --rule: #e8e2d8;
            --accent: #d4602e;
            --accent-light: #fff4ef;
            --green: #4a8c6f;
            --green-light: #eef6f1;
            --shadow: 0 2px 12px rgba(45,36,23,0.06);
            --radius: 16px;
            --radius-sm: 10px;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== App Shell ===== */
        .app {
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--bg);
            position: relative;
            overflow: hidden;
        }

        .page { display: none; animation: fadeUp .3s ease; }
        .page.active { display: block; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== Tab Bar ===== */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            background: #fff;
            border-top: 1px solid var(--rule);
            display: flex;
            z-index: 100;
            padding-bottom: env(safe-area-inset-bottom, 0);
        }
        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 0 6px;
            cursor: pointer;
            transition: color .2s;
            color: var(--muted);
            font-size: 10px;
            gap: 3px;
            border: none;
            background: none;
            font-family: inherit;
        }
        .tab-item svg { width: 24px; height: 24px; }
        .tab-item.active { color: var(--accent); }
        .tab-item.active svg { fill: var(--accent); stroke: var(--accent); }
        .tab-item svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

        .page-content { padding-bottom: 80px; }

        /* ===== Home Page ===== */
        .home-header {
            padding: 20px 20px 0;
        }
        .home-greeting {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 4px;
        }
        .home-title {
            font-size: 24px;
            font-weight: 900;
        }
        .home-subtitle {
            font-size: 13px;
            color: var(--muted);
            margin-top: 4px;
        }

        /* Ingredient Input */
        .ingredient-input-area {
            padding: 20px;
        }
        .ingredient-box {
            background: #fff;
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
        }
        .ingredient-box h3 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ingredient-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
        }
        .ingredient-tag {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all .2s;
            border: 1.5px solid var(--rule);
            background: #fff;
            color: var(--ink);
            font-family: inherit;
        }
        .ingredient-tag.selected {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .ingredient-add {
            display: flex;
            gap: 8px;
        }
        .ingredient-add input {
            flex: 1;
            padding: 10px 14px;
            border: 1.5px solid var(--rule);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: inherit;
            background: #fff;
            color: var(--ink);
            outline: none;
        }
        .ingredient-add input:focus { border-color: var(--accent); }
        .ingredient-add input::placeholder { color: var(--muted); }

        .btn-matched {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 14px;
            font-family: inherit;
            transition: background .2s;
        }
        .btn-matched:hover { background: #c55528; }
        .btn-matched:disabled { background: var(--muted); cursor: not-allowed; }

        /* Recommended Recipes */
        .recipe-section {
            padding: 0 20px 20px;
        }
        .recipe-section h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 14px;
        }
        .recipe-scroll {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding-bottom: 4px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }
        .recipe-card {
            min-width: 200px;
            background: #fff;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: transform .2s;
            scroll-snap-align: start;
        }
        .recipe-card:active { transform: scale(0.97); }
        .recipe-card-img {
            width: 100%;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }
        .recipe-card-body { padding: 14px; }
        .recipe-card-name { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
        .recipe-card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .recipe-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 500;
        }
        .recipe-tag-diff { background: var(--bg2); color: var(--muted); }
        .recipe-tag-match { background: var(--green-light); color: var(--green); }

        /* ===== Recipe Detail ===== */
        .detail-header {
            padding: 0;
            position: relative;
        }
        .detail-hero {
            width: 100%;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
        }
        .detail-back {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            z-index: 10;
            font-size: 18px;
        }
        .detail-info {
            padding: 20px;
            background: #fff;
            margin-top: -20px;
            border-radius: 20px 20px 0 0;
            position: relative;
            z-index: 5;
        }
        .detail-name {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 10px;
        }
        .detail-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .meta-chip {
            padding: 4px 12px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 500;
        }
        .meta-chip-time { background: var(--accent-light); color: var(--accent); }
        .meta-chip-diff { background: var(--bg2); color: var(--muted); }
        .meta-chip-serv { background: var(--green-light); color: var(--green); }

        .detail-desc {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 20px;
            line-height: 1.7;
        }

        /* Ingredients List */
        .ingredients-section {
            padding: 0 20px 20px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--accent);
            display: inline-block;
        }
        .ingredient-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px dashed var(--rule);
            font-size: 14px;
        }
        .ingredient-item:last-child { border-bottom: none; }
        .ingredient-item .amount {
            color: var(--accent);
            font-weight: 600;
            font-size: 13px;
        }
        .ingredient-item .have-tag {
            font-size: 11px;
            background: var(--green-light);
            color: var(--green);
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 6px;
        }
        .ingredient-item .need-tag {
            font-size: 11px;
            background: var(--accent-light);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 6px;
        }

        .btn-start-cook {
            display: block;
            width: calc(100% - 40px);
            margin: 10px 20px 30px;
            padding: 16px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 0.05em;
        }
        .btn-start-cook:active { background: #c55528; }

        /* ===== Cooking Mode ===== */
        .cook-page { background: var(--ink); min-height: 100vh; color: #fff; }
        .cook-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
        }
        .cook-recipe-name {
            font-size: 14px;
            font-weight: 600;
            opacity: 0.7;
        }
        .cook-exit {
            padding: 6px 14px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            background: none;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
        }
        .cook-progress {
            padding: 0 20px 20px;
        }
        .cook-progress-bar {
            height: 4px;
            background: rgba(255,255,255,0.15);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px;
        }
        .cook-progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            transition: width .4s ease;
        }
        .cook-step-label {
            font-size: 12px;
            opacity: 0.5;
        }

        .cook-step-card {
            margin: 0 20px;
            background: rgba(255,255,255,0.08);
            border-radius: var(--radius);
            padding: 28px 24px;
            min-height: 340px;
            display: flex;
            flex-direction: column;
        }
        .cook-step-num {
            font-size: 48px;
            font-weight: 900;
            color: var(--accent);
            margin-bottom: 8px;
            line-height: 1;
        }
        .cook-step-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.4;
        }
        .cook-step-detail {
            font-size: 15px;
            line-height: 1.8;
            opacity: 0.85;
            flex: 1;
        }
        .cook-tip {
            margin-top: 20px;
            padding: 14px 16px;
            background: rgba(74,140,111,0.2);
            border-left: 3px solid var(--green);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            font-size: 13px;
            line-height: 1.7;
        }
        .cook-tip strong {
            color: var(--green);
        }

        .cook-actions {
            display: flex;
            gap: 12px;
            padding: 20px;
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            background: var(--ink);
            padding-bottom: calc(20px + env(safe-area-inset-bottom, 0));
        }
        .cook-btn-prev {
            flex: 1;
            padding: 16px;
            border: 1.5px solid rgba(255,255,255,0.25);
            border-radius: var(--radius-sm);
            background: none;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }
        .cook-btn-prev:disabled { opacity: 0.3; cursor: not-allowed; }
        .cook-btn-next {
            flex: 2;
            padding: 16px;
            background: var(--accent);
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }
        .cook-btn-next:active { background: #c55528; }

        /* ===== Cook Complete ===== */
        .cook-complete {
            text-align: center;
            padding: 60px 30px;
        }
        .cook-complete-icon {
            font-size: 80px;
            margin-bottom: 16px;
        }
        .cook-complete h2 {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 10px;
        }
        .cook-complete p {
            font-size: 15px;
            opacity: 0.7;
            margin-bottom: 30px;
        }
        .cook-complete .btn-back-home {
            padding: 14px 40px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        /* ===== Explore Page ===== */
        .explore-header {
            padding: 20px 20px 0;
        }
        .explore-header h1 { font-size: 22px; font-weight: 900; }
        .explore-header p { font-size: 13px; color: var(--muted); margin-top: 4px; }

        .category-scroll {
            display: flex;
            gap: 10px;
            padding: 16px 20px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .cat-pill {
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            border: 1.5px solid var(--rule);
            background: #fff;
            color: var(--ink);
            font-weight: 500;
            font-family: inherit;
            transition: all .2s;
        }
        .cat-pill.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .explore-grid {
            padding: 0 20px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .explore-card {
            background: #fff;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            cursor: pointer;
        }
        .explore-card:active { transform: scale(0.97); }
        .explore-card-img {
            width: 100%;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        .explore-card-body { padding: 12px; }
        .explore-card-name { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
        .explore-card-meta { font-size: 11px; color: var(--muted); }

        /* ===== Profile Page ===== */
        .profile-header {
            padding: 40px 20px 24px;
            text-align: center;
        }
        .profile-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #e8946a);
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        .profile-name { font-size: 18px; font-weight: 700; }
        .profile-level {
            font-size: 13px;
            color: var(--accent);
            font-weight: 500;
            margin-top: 4px;
        }
        .profile-stats {
            display: flex;
            justify-content: center;
            gap: 32px;
            padding: 20px;
            margin: 0 20px;
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .stat-item { text-align: center; }
        .stat-num { font-size: 22px; font-weight: 900; color: var(--accent); }
        .stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; }

        .profile-section {
            padding: 20px;
        }
        .profile-section h3 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .profile-menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: #fff;
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            cursor: pointer;
        }
        .profile-menu-item .label {
            font-size: 14px;
            font-weight: 500;
        }
        .profile-menu-item .arrow {
            color: var(--muted);
            font-size: 14px;
        }

        /* ===== SOS Modal ===== */
        .sos-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }
        .sos-overlay.show { display: flex; }
        .sos-panel {
            width: 100%;
            max-width: 430px;
            background: var(--bg);
            border-radius: 20px 20px 0 0;
            padding: 24px;
            max-height: 70vh;
            overflow-y: auto;
            animation: slideUp .3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(30px); }
            to { transform: translateY(0); }
        }
        .sos-panel h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .sos-panel .sos-desc {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 16px;
        }
        .sos-item {
            padding: 16px;
            background: #fff;
            border-radius: var(--radius-sm);
            margin-bottom: 10px;
        }
        .sos-item h4 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
        .sos-item p { font-size: 13px; color: var(--muted); line-height: 1.7; }
        .sos-close {
            width: 100%;
            padding: 14px;
            border: 1.5px solid var(--rule);
            border-radius: var(--radius-sm);
            background: none;
            color: var(--ink);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            font-family: inherit;
        }

        /* Utility */
        .empty { display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        .empty-icon { font-size: 56px; margin-bottom: 12px; }
        .empty h3 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
        .empty p { font-size: 13px; color: var(--muted); text-align: center; }
    </style>
</head>
<body>
<div class="app" id="app">

    <!-- ===== HOME PAGE ===== -->
    <div class="page active" id="page-home">
        <div class="page-content">
            <div class="home-header">
                <div class="home-greeting" id="greeting"></div>
                <div class="home-title">今天想做什么菜？</div>
                <div class="home-subtitle">告诉我冰箱里有什么，我来帮你配菜</div>
            </div>

            <div class="ingredient-input-area">
                <div class="ingredient-box">
                    <h3>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"><path d="M20 4L10 14"/><path d="M14 4h6v6"/></svg>
                        我手上有这些食材
                    </h3>
                    <div class="ingredient-tags" id="ingredientTags"></div>
                    <div class="ingredient-add">
                        <input type="text" id="ingredientInput" placeholder="输入食材名称，如：鸡蛋" maxlength="10">
                        <button class="btn-add-tag" onclick="addIngredient()" style="padding:10px 18px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;">添加</button>
                    </div>
                    <button class="btn-matched" id="btnMatch" onclick="matchRecipes()" disabled>根据食材匹配菜谱</button>
                </div>
            </div>

            <div class="recipe-section">
                <h3>推荐新手菜</h3>
                <div class="recipe-scroll" id="recommendScroll"></div>
            </div>
        </div>
    </div>

    <!-- ===== EXPLORE PAGE ===== -->
    <div class="page" id="page-explore">
        <div class="page-content">
            <div class="explore-header">
                <h1>菜谱大全</h1>
                <p>按分类浏览，找到想做的菜</p>
            </div>
            <div class="category-scroll" id="categoryScroll"></div>
            <div class="explore-grid" id="exploreGrid"></div>
        </div>
    </div>

    <!-- ===== PROFILE PAGE ===== -->
    <div class="page" id="page-profile">
        <div class="page-content">
            <div class="profile-header">
                <div class="profile-avatar">&#x1f468;&#x200d;&#x1f373;</div>
                <div class="profile-name">厨房新手</div>
                <div class="profile-level">Lv.1 入门学徒</div>
            </div>
            <div class="profile-stats">
                <div class="stat-item">
                    <div class="stat-num" id="statCooked">0</div>
                    <div class="stat-label">已做菜谱</div>
                </div>
                <div class="stat-item">
                    <div class="stat-num" id="statCollect">0</div>
                    <div class="stat-label">收藏菜谱</div>
                </div>
                <div class="stat-item">
                    <div class="stat-num">3</div>
                    <div class="stat-label">连续天数</div>
                </div>
            </div>
            <div class="profile-section">
                <h3>我的功能</h3>
                <div class="profile-menu-item" onclick="showToast('开发中，敬请期待')">
                    <span class="label">我的收藏</span>
                    <span class="arrow">&rsaquo;</span>
                </div>
                <div class="profile-menu-item" onclick="showToast('开发中，敬请期待')">
                    <span class="label">做饭记录</span>
                    <span class="arrow">&rsaquo;</span>
                </div>
                <div class="profile-menu-item" onclick="showToast('开发中，敬请期待')">
                    <span class="label">我的工具箱</span>
                    <span class="arrow">&rsaquo;</span>
                </div>

// ===== STATE =====
let selectedIngredients = [];
let currentRecipe = null;
let currentStep = 0;
let currentTab = 'home';
let pageStack = [];
let cookedCount = 0;

// ===== INIT =====
function init() {
    setGreeting();
    renderIngredientTags();
    renderRecommendations();
    renderExplore();
    document.getElementById('ingredientInput').addEventListener('keydown', e => { if (e.key === 'Enter') addIngredient(); });
}

function setGreeting() {
    const h = new Date().getHours();
    let g = '晚上好';
    if (h < 6) g = '夜深了';
    else if (h < 12) g = '早上好';
    else if (h < 14) g = '中午好';
    else if (h < 18) g = '下午好';
    document.getElementById('greeting').textContent = g + '，灶伴陪你做饭';
}

// ===== INGREDIENTS =====
const quickIngredients = ['鸡蛋','番茄','米饭','黄瓜','豆腐','猪肉','土豆','面条','大葱','大蒜','生抽','盐','糖','醋'];

function renderIngredientTags() {
    const el = document.getElementById('ingredientTags');
    el.innerHTML = quickIngredients.map(name =>
        `<button class="ingredient-tag ${selectedIngredients.includes(name)?'selected':''}" onclick="toggleIngredient('${name}')">${name}</button>`
    ).join('');
}

function toggleIngredient(name) {
    if (selectedIngredients.includes(name)) {
        selectedIngredients = selectedIngredients.filter(n => n !== name);
    } else {
        selectedIngredients.push(name);
    }
    renderIngredientTags();
    document.getElementById('btnMatch').disabled = selectedIngredients.length === 0;
}

function addIngredient() {
    const input = document.getElementById('ingredientInput');
    const name = input.value.trim();
    if (!name || selectedIngredients.includes(name)) { input.value = ''; return; }
    selectedIngredients.push(name);
    if (!quickIngredients.includes(name)) quickIngredients.push(name);
    input.value = '';
    renderIngredientTags();
    document.getElementById('btnMatch').disabled = false;
    showToast(`已添加「${name}」`);
}

function matchRecipes() {
    switchTab('explore');
    showToast(`已为你匹配 ${recipes.length} 道菜`);
}

// ===== RECOMMENDATIONS =====
function renderRecommendations() {
    const el = document.getElementById('recommendScroll');
    el.innerHTML = recipes.map(r => `
        <div class="recipe-card" onclick="openDetail('${r.id}')">
            <div class="recipe-card-img" style="background:${r.heroBg}">${r.emoji}</div>
            <div class="recipe-card-body">
                <div class="recipe-card-name">${r.name}</div>
                <div class="recipe-card-tags">
                    <span class="recipe-tag recipe-tag-diff">${r.difficulty} / ${r.time}</span>
                    <span class="recipe-tag recipe-tag-match">新手推荐</span>
                </div>
            </div>
        </div>
    `).join('');
}

// ===== EXPLORE =====
let activeCategory = '全部';
function renderExplore() {
    const scroll = document.getElementById('categoryScroll');
    scroll.innerHTML = categories.map(c =>
        `<button class="cat-pill ${c===activeCategory?'active':''}" onclick="setCategory('${c}')">${c}</button>`
    ).join('');

    const grid = document.getElementById('exploreGrid');
    const filtered = activeCategory === '全部' ? recipes : recipes.filter(r => r.category === activeCategory);
    grid.innerHTML = filtered.map(r => `
        <div class="explore-card" onclick="openDetail('${r.id}')">
            <div class="explore-card-img" style="background:${r.heroBg}">${r.emoji}</div>
            <div class="explore-card-body">
                <div class="explore-card-name">${r.name}</div>
                <div class="explore-card-meta">${r.difficulty} · ${r.time} · ${r.servings}</div>
            </div>
        </div>
    `).join('');
    if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty"><div class="empty-icon">&#x1f4ed;</div><h3>暂无菜谱</h3><p>该分类还在准备中</p></div>';
    }
}

function setCategory(c) { activeCategory = c; renderExplore(); }

// ===== DETAIL =====
function openDetail(id) {
    currentRecipe = recipes.find(r => r.id === id);
    if (!currentRecipe) return;

    document.getElementById('detailHero').style.background = currentRecipe.heroBg;
    document.getElementById('detailHero').textContent = currentRecipe.emoji;
    document.getElementById('detailName').textContent = currentRecipe.name;
    document.getElementById('detailMeta').innerHTML = `
        <span class="meta-chip meta-chip-time">⏱ ${currentRecipe.time}</span>
        <span class="meta-chip meta-chip-diff">${currentRecipe.difficulty}</span>
        <span class="meta-chip meta-chip-serv">👥 ${currentRecipe.servings}</span>
    `;
    document.getElementById('detailDesc').textContent = currentRecipe.desc;

    const hasIng = selectedIngredients.map(i => i.includes(currentRecipe.ingredients.find(x => x.name === i)?.name || ''));
    document.getElementById('detailIngredients').innerHTML = `
        <div class="section-title">食材准备</div>
        ${currentRecipe.ingredients.map(i => `
            <div class="ingredient-item">
                <span>${i.name} <span class="${selectedIngredients.includes(i.name)?'have-tag':'need-tag'}">${selectedIngredients.includes(i.name)?'已有':'需准备'}</span></span>
                <span class="amount">${i.amount}</span>
            </div>
        `).join('')}
    `;

    document.getElementById('btnStartCook').style.display = 'block';
    showPage('page-detail');
    pageStack.push('detail');
    document.getElementById('tabBar').style.display = 'none';
}

// ===== COOKING MODE =====
function startCooking() {
    if (!currentRecipe) return;
    currentStep = 0;
    renderCookStep();
    showPage('page-cook');
    document.getElementById('tabBar').style.display = 'none';
}

function renderCookStep() {
    const r = currentRecipe;
    const total = r.steps.length;
    const step = r.steps[currentStep];

    document.getElementById('cookRecipeName').textContent = r.name;
    document.getElementById('cookStepLabel').textContent = `步骤 ${currentStep + 1} / ${total}`;
    document.getElementById('cookProgressFill').style.width = ((currentStep + 1) / total * 100) + '%';

    const detailHtml = step.detail.replace(/\n/g, '<br>');
    const tipHtml = step.tip ? `<div class="cook-tip"><strong>💡 新手提示</strong><br>${step.tip.replace(/\n/g, '<br>')}</div>` : '';

    document.getElementById('cookStepCard').innerHTML = `
        <div class="cook-step-num">${String(currentStep + 1).padStart(2, '0')}</div>
        <div class="cook-step-title">${step.title}</div>
        <div class="cook-step-detail">${detailHtml}</div>
        ${tipHtml}
    `;

    document.getElementById('cookBtnPrev').disabled = currentStep === 0;
    document.getElementById('cookBtnNext').textContent = currentStep === total - 1 ? '完成！' : '下一步';
}

function cookPrev() {
    if (currentStep > 0) { currentStep--; renderCookStep(); }
}
function cookNext() {
    if (currentStep < currentRecipe.steps.length - 1) { currentStep++; renderCookStep(); }
    else { completeCook(); }
}

function completeCook() {
    cookedCount++;
    document.getElementById('statCooked').textContent = cookedCount;
    document.getElementById('completeMsg').textContent = `你成功做出了「${currentRecipe.name}」！每一次动手都是进步，继续加油！`;
    showPage('page-complete');
}

function finishCook() {
    switchTab('home');
}

function exitCook() {
    if (confirm('确定退出跟做模式吗？进度不会保存。')) finishCook();
}

// ===== SOS =====
function openSos() {
    if (!currentRecipe || !currentRecipe.sos) return;
    const overlay = document.getElementById('sosOverlay');
    document.getElementById('sosList').innerHTML = currentRecipe.sos.map(s => `
        <div class="sos-item"><h4>${s.title}</h4><p>${s.desc}</p></div>
    `).join('');
    overlay.classList.add('show');
}
function closeSos() { document.getElementById('sosOverlay').classList.remove('show'); }
document.getElementById('sosOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeSos(); });

// ===== NAVIGATION =====
function switchTab(name) {
    currentTab = name;
    document.querySelectorAll('.tab-item').forEach(t => t.classList.toggle('active', t.dataset.page === name));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    document.getElementById('tabBar').style.display = 'flex';
    pageStack = [];
}

function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function goBack() {
    pageStack.pop();
    if (pageStack.length === 0) {
        switchTab(currentTab);
    } else if (pageStack[pageStack.length - 1] === 'detail') {
        showPage('page-detail');
    }
}

// ===== TOAST =====
let toastTimer;
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ===== START =====
init();
</script>
</body>
</html>
