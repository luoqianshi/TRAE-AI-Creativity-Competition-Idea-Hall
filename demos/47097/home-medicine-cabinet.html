<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家用药箱管家</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  /* ===== Apple Design System Tokens ===== */
  :root {
    /* Brand */
    --brand-50: #e8f2ff;
    --brand-100: #cfe5ff;
    --brand-200: #9fcbff;
    --brand-300: #66abff;
    --brand-400: #2e8dff;
    --brand-500: #007aff;
    --brand-600: #0064d6;
    --brand-700: #004fad;
    --brand-800: #003b82;
    --brand-900: #00275a;

    /* Background */
    --background: #f5f5f7;
    --background-50: #ffffff;
    --background-100: #f7f7fa;
    --background-200: #f2f2f7;
    --background-300: #e5e5ea;
    --background-400: #d1d1d6;
    --background-500: #aeaeb2;
    --background-600: #8e8e93;
    --background-700: #3a3a3c;
    --background-800: #1c1c1e;
    --background-900: #000000;

    /* Text */
    --foreground: #1d1d1f;
    --text-50: #f5f5f7;
    --text-100: #e3e3e8;
    --text-200: #c7c7cc;
    --text-300: #aeaeb2;
    --text-400: #8e8e93;
    --text-500: #6e6e73;
    --text-600: #48484a;
    --text-700: #3c3c43;
    --text-800: #1d1d1f;
    --text-900: #000000;

    /* State */
    --primary: #007aff;
    --primary-foreground: #ffffff;
    --destructive: #ff3b30;
    --destructive-foreground: #ffffff;
    --success: #34c759;
    --success-foreground: #ffffff;
    --warning: #ff9500;
    --warning-surface: #fff6e5;
    --destructive-surface: #ffecea;
    --success-surface: #e9f9ee;

    /* Semantic aliases used in this page */
    --card: #ffffff;
    --card-foreground: #1d1d1f;
    --muted: #f2f2f7;
    --muted-foreground: #8e8e93;
    --border: #e5e5ea;
    --input: #d1d1d6;
    --ring: #007aff;
    --icon-muted: #8e8e93;

    /* Chart */
    --chart-1: #34c759;
    --chart-2: #007aff;
    --chart-3: #ff9500;
    --chart-4: #5856d6;
    --chart-5: #af52de;

    /* Typography */
    --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --tracking-normal: 0em;

    /* Radius */
    --radius: 1.2rem;

    /* Shadows — whisper-light */
    --shadow-2xs: 0 1px 2px -1px rgba(0,0,0,.04);
    --shadow-xs: 0 1px 2px 0 rgba(0,0,0,.04);
    --shadow-sm: 0 1px 2px 0 rgba(0,0,0,.05), 0 1px 3px -1px rgba(0,0,0,.05);
    --shadow: 0 2px 4px -1px rgba(0,0,0,.06), 0 1px 2px -1px rgba(0,0,0,.05);
    --shadow-md: 0 4px 8px -2px rgba(0,0,0,.06), 0 2px 4px -2px rgba(0,0,0,.05);
    --shadow-lg: 0 8px 24px -8px rgba(0,0,0,.08), 0 4px 8px -4px rgba(0,0,0,.05);
    --shadow-xl: 0 16px 40px -10px rgba(0,0,0,.10), 0 8px 16px -8px rgba(0,0,0,.06);
    --shadow-2xl: 0 24px 64px -12px rgba(0,0,0,.12);

    /* Spacing */
    --spacing: 0.24rem;

    /* Motion */
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
    --duration-fast: 150ms;
    --duration-normal: 250ms;
    --duration-slow: 350ms;
    --transition: 250ms var(--ease);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    color: var(--foreground);
    line-height: 1.55;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-size: 13px;
    /* Liquid Glass: vibrant mesh background */
    background: #f5f5f7;
    background-image:
      radial-gradient(ellipse 80% 50% at 20% 10%, rgba(0,122,255,.12) 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 80% 5%, rgba(88,86,214,.10) 0%, transparent 70%),
      radial-gradient(ellipse 50% 60% at 50% 50%, rgba(52,199,89,.06) 0%, transparent 70%),
      radial-gradient(ellipse 70% 50% at 10% 80%, rgba(175,82,222,.08) 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 90% 90%, rgba(255,149,0,.07) 0%, transparent 70%);
    background-attachment: fixed;
  }
  .container { max-width: 980px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

  /* ===== Liquid Glass base mixin ===== */
  /* Applied to cards, nav, tabs, modals, toasts, buttons */
  .glass {
    background: rgba(255,255,255,.55);
    backdrop-filter: blur(40px) saturate(180%) brightness(1.05);
    -webkit-backdrop-filter: blur(40px) saturate(180%) brightness(1.05);
    border: 1px solid rgba(255,255,255,.65);
    box-shadow:
      0 0 0 .5px rgba(255,255,255,.4),
      0 4px 16px rgba(0,0,0,.06),
      inset 0 1px 0 rgba(255,255,255,.7),
      inset 0 -.5px 0 rgba(0,0,0,.04);
  }
  .glass-strong {
    background: rgba(255,255,255,.72);
    backdrop-filter: blur(60px) saturate(200%) brightness(1.06);
    -webkit-backdrop-filter: blur(60px) saturate(200%) brightness(1.06);
    border: 1px solid rgba(255,255,255,.75);
    box-shadow:
      0 0 0 .5px rgba(255,255,255,.5),
      0 8px 32px rgba(0,0,0,.08),
      inset 0 1px 0 rgba(255,255,255,.8),
      inset 0 -.5px 0 rgba(0,0,0,.03);
  }
  .glass-subtle {
    background: rgba(255,255,255,.35);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid rgba(255,255,255,.45);
    box-shadow:
      0 2px 8px rgba(0,0,0,.04),
      inset 0 1px 0 rgba(255,255,255,.5);
  }

  /* ===== Webbar (Apple nav) — liquid glass ===== */
  .webbar {
    position: sticky; top: 0; z-index: 100;
    height: 52px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 0;
    border-top: none; border-left: none; border-right: none;
    border-bottom: .5px solid rgba(255,255,255,.5);
    background: rgba(255,255,255,.6);
    backdrop-filter: blur(40px) saturate(180%) brightness(1.05);
    -webkit-backdrop-filter: blur(40px) saturate(180%) brightness(1.05);
    box-shadow:
      0 1px 0 rgba(255,255,255,.6) inset,
      0 -.5px 0 rgba(0,0,0,.06),
      0 4px 12px rgba(0,0,0,.04);
  }
  .webbar-brand {
    font-size: 14px; font-weight: 700; color: var(--foreground);
    letter-spacing: .01em;
    background: linear-gradient(135deg, var(--foreground), var(--text-600));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ===== Header ===== */
  .header {
    padding: 52px 0 44px;
    text-align: center;
    position: relative;
  }
  .header h1 {
    font-size: 36px; font-weight: 700;
    letter-spacing: var(--tracking-normal); line-height: 1.1;
    background: linear-gradient(135deg, var(--foreground) 0%, var(--text-600) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header p {
    font-size: 15px; color: var(--text-400); margin-top: 10px;
    font-weight: 400;
  }

  /* ===== Stats ===== */
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    margin-top: -24px; position: relative; z-index: 1; padding-bottom: 0;
  }
  .stat-card {
    border-radius: var(--radius); padding: 20px 16px;
    text-align: center;
    transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    cursor: default;
    /* Liquid Glass */
    background: rgba(255,255,255,.5);
    backdrop-filter: blur(40px) saturate(180%) brightness(1.05);
    -webkit-backdrop-filter: blur(40px) saturate(180%) brightness(1.05);
    border: 1px solid rgba(255,255,255,.6);
    box-shadow:
      0 0 0 .5px rgba(255,255,255,.35),
      0 4px 16px rgba(0,0,0,.05),
      inset 0 1px 0 rgba(255,255,255,.7),
      inset 0 -.5px 0 rgba(0,0,0,.03);
  }
  .stat-card:hover {
    transform: translateY(-3px);
    background: rgba(255,255,255,.65);
    box-shadow:
      0 0 0 .5px rgba(255,255,255,.5),
      0 12px 32px rgba(0,0,0,.10),
      inset 0 1px 0 rgba(255,255,255,.85),
      inset 0 -.5px 0 rgba(0,0,0,.03);
    border-color: rgba(0,122,255,.35);
  }
  .stat-card .icon { font-size: 20px; margin-bottom: 8px; color: var(--muted-foreground); }
  .stat-card .num {
    font-size: 28px; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .stat-card .label {
    font-size: 11px; color: var(--muted-foreground); margin-top: 4px;
    letter-spacing: .04em; text-transform: uppercase; font-weight: 600;
  }
  .stat-card.total .num { color: var(--primary); }
  .stat-card.expiring .num { color: var(--warning); }
  .stat-card.expired .num { color: var(--destructive); }
  .stat-card.today .num { color: var(--chart-4); }

  /* ===== Section ===== */
  .section { margin-top: 40px; }

  /* Eyebrow style for section titles */
  .section-title {
    font-size: 11px; font-weight: 700; color: var(--muted-foreground);
    display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
    letter-spacing: .08em; text-transform: uppercase;
    border-bottom: 1px solid rgba(0,0,0,.06);
    padding-bottom: 8px;
  }

  /* Title style (larger heading for key sections) */
  .title {
    font-size: 18px; font-weight: 600; color: var(--foreground);
    line-height: 1.15; letter-spacing: var(--tracking-normal);
  }

  /* ===== Card — Liquid Glass ===== */
  .card {
    border-radius: var(--radius); padding: 24px;
    transition: box-shadow var(--transition), border-color var(--transition), background var(--transition);
    /* Liquid Glass */
    background: rgba(255,255,255,.5);
    backdrop-filter: blur(40px) saturate(180%) brightness(1.05);
    -webkit-backdrop-filter: blur(40px) saturate(180%) brightness(1.05);
    border: 1px solid rgba(255,255,255,.6);
    box-shadow:
      0 0 0 .5px rgba(255,255,255,.35),
      0 4px 16px rgba(0,0,0,.05),
      inset 0 1px 0 rgba(255,255,255,.7),
      inset 0 -.5px 0 rgba(0,0,0,.03);
  }
  .card:hover {
    background: rgba(255,255,255,.6);
    box-shadow:
      0 0 0 .5px rgba(255,255,255,.45),
      0 8px 24px rgba(0,0,0,.08),
      inset 0 1px 0 rgba(255,255,255,.8),
      inset 0 -.5px 0 rgba(0,0,0,.03);
    border-color: rgba(0,122,255,.25);
  }

  /* ===== Form ===== */
  .form-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group label {
    font-size: 11px; font-weight: 700; color: var(--muted-foreground);
    letter-spacing: .04em; text-transform: uppercase;
  }
  .form-group input, .form-group select, .form-group textarea {
    height: 44px; padding: 0 14px;
    border: 1px solid rgba(0,0,0,.08); border-radius: var(--radius);
    font-size: 13px; color: var(--foreground);
    background: rgba(255,255,255,.5);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    outline: none; font-family: var(--font-sans);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.6),
      0 1px 2px rgba(0,0,0,.03);
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: var(--ring);
    background: rgba(255,255,255,.75);
    box-shadow: 0 0 0 3px rgba(0,122,255,.15), inset 0 1px 0 rgba(255,255,255,.7);
  }
  .form-group input::placeholder, .form-group select::placeholder,
  .form-group textarea::placeholder {
    color: var(--muted-foreground);
  }
  .form-group textarea {
    height: auto; min-height: 60px; padding: 12px 14px; resize: vertical;
  }
  .form-actions { margin-top: 20px; display: flex; gap: 12px; }

  /* ===== Buttons (pill-shaped, Apple style) ===== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 40px; padding: 0 20px; border: none;
    border-radius: 999px;
    font: 600 14px/1 var(--font-sans);
    letter-spacing: var(--tracking-normal);
    white-space: nowrap; cursor: pointer;
    transition: background-color var(--transition), opacity var(--transition), filter var(--transition);
    box-shadow: var(--shadow-sm);
    font-family: var(--font-sans);
  }
  .btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .btn:disabled { opacity: .42; cursor: not-allowed; }
  .btn-primary {
    background: rgba(0,122,255,.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--primary-foreground);
    box-shadow:
      0 0 0 .5px rgba(255,255,255,.2),
      0 4px 12px rgba(0,122,255,.2),
      inset 0 1px 0 rgba(255,255,255,.2);
  }
  .btn-primary:hover {
    background: rgba(0,122,255,.95);
    box-shadow:
      0 0 0 .5px rgba(255,255,255,.3),
      0 6px 20px rgba(0,122,255,.3),
      inset 0 1px 0 rgba(255,255,255,.25);
  }
  .btn-secondary {
    background: rgba(255,255,255,.45);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--foreground);
    border: 1px solid rgba(255,255,255,.5);
    box-shadow:
      0 1px 4px rgba(0,0,0,.04),
      inset 0 1px 0 rgba(255,255,255,.5);
  }
  .btn-secondary:hover { background: rgba(255,255,255,.6); }
  .btn-danger {
    background: var(--destructive-surface); color: var(--destructive);
    box-shadow: none;
  }
  .btn-danger:hover { background: #ffd6d2; }
  .btn-accent {
    background: rgba(88,86,214,.8);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #fff;
    box-shadow:
      0 4px 12px rgba(88,86,214,.2),
      inset 0 1px 0 rgba(255,255,255,.15);
  }
  .btn-accent:hover {
    background: rgba(88,86,214,.9);
    box-shadow:
      0 6px 20px rgba(88,86,214,.3),
      inset 0 1px 0 rgba(255,255,255,.2);
  }
  .btn-sm { height: 32px; padding: 0 14px; font-size: 12px; }

  /* btn-lg for primary CTA */
  .btn-primary.btn-lg,
  .form-actions > .btn-primary {
    height: 48px; padding: 0 24px; font-size: 16px;
  }

  /* ===== Tabs — Liquid Glass pill bar ===== */
  .tabs {
    display: inline-flex; gap: 4px; margin-bottom: 16px;
    border-radius: 999px; padding: 4px;
    /* Liquid Glass */
    background: rgba(255,255,255,.4);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid rgba(255,255,255,.5);
    box-shadow:
      0 2px 8px rgba(0,0,0,.04),
      inset 0 1px 0 rgba(255,255,255,.6);
  }
  .tab-btn {
    padding: 8px 20px; border: none; background: transparent;
    border-radius: 999px; font-size: 13px; font-weight: 600;
    color: var(--muted-foreground); cursor: pointer;
    transition: all var(--transition); font-family: var(--font-sans);
    box-shadow: none;
  }
  .tab-btn.active {
    background: rgba(255,255,255,.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: var(--foreground);
    box-shadow:
      0 2px 8px rgba(0,0,0,.06),
      inset 0 1px 0 rgba(255,255,255,.8);
  }
  .tab-btn:hover:not(.active) { color: var(--foreground); }

  /* ===== Table (Apple comparison-table style) ===== */
  .med-table { width: 100%; border-collapse: collapse; }
  .med-table th {
    text-align: left; padding: 10px 14px; font-size: 10px;
    font-weight: 700; color: var(--muted-foreground);
    letter-spacing: .08em; text-transform: uppercase;
    background: var(--background);
    border-bottom: 1px solid rgba(0,0,0,.06);
    white-space: nowrap;
  }
  .med-table td {
    padding: 14px;
    border-bottom: 1px solid rgba(0,0,0,.04);
    font-size: 13px; vertical-align: middle; color: var(--foreground);
  }
  .med-table tbody tr { transition: background-color .15s ease; }
  .med-table tbody tr:hover { background-color: var(--background-100); }

  /* ===== Status badges ===== */
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
  }
  .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .badge-ok { background: var(--success-surface); color: #248a3d; }
  .badge-ok::before { background: var(--success); }
  .badge-warn { background: var(--warning-surface); color: #c77c00; }
  .badge-warn::before { background: var(--warning); }
  .badge-danger { background: var(--destructive-surface); color: #d70015; }
  .badge-danger::before { background: var(--destructive); }

  /* ===== Category tags ===== */
  .cat-tag {
    display: inline-block; padding: 3px 12px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
    background: var(--brand-50); color: var(--brand-700);
  }

  /* ===== Action buttons ===== */
  .action-btns { display: flex; gap: 6px; flex-wrap: nowrap; }

  /* ===== Search — Liquid Glass surface ===== */
  .search-bar {
    display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap;
    border-radius: var(--radius);
    padding: 16px;
    /* Liquid Glass */
    background: rgba(255,255,255,.35);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid rgba(255,255,255,.5);
    box-shadow:
      0 2px 8px rgba(0,0,0,.04),
      inset 0 1px 0 rgba(255,255,255,.6);
  }
  .search-bar .search-input-wrap { flex: 1; min-width: 240px; position: relative; }
  .search-bar .search-input-wrap::before {
    content: '\2315'; position: absolute; left: 14px; top: 50%;
    transform: translateY(-50%); font-size: 13px; z-index: 1;
    color: var(--icon-muted); pointer-events: none;
  }
  .search-bar .search-input-wrap input {
    width: 100%; height: 44px; padding: 0 14px 0 38px;
    border: 1px solid rgba(0,0,0,.06); border-radius: var(--radius);
    font-size: 13px;
    background: rgba(255,255,255,.5);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.5),
      0 1px 2px rgba(0,0,0,.03);
    transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    outline: none; font-family: var(--font-sans); color: var(--foreground);
  }
  .search-bar .search-input-wrap input:focus {
    border-color: var(--ring);
    background: rgba(255,255,255,.75);
    box-shadow: 0 0 0 3px rgba(0,122,255,.12), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .search-bar .search-input-wrap input::placeholder { color: var(--muted-foreground); }
  .search-bar select {
    height: 44px; padding: 0 14px; border: 1px solid rgba(0,0,0,.06);
    border-radius: var(--radius); font-size: 13px;
    background: rgba(255,255,255,.5);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: var(--foreground);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.5),
      0 1px 2px rgba(0,0,0,.03);
    outline: none;
    font-family: var(--font-sans); min-width: 130px;
    transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
  }
  .search-bar select:focus {
    border-color: var(--ring);
    background: rgba(255,255,255,.75);
    box-shadow: 0 0 0 3px rgba(0,122,255,.12), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .search-results { margin-top: 16px; }

  /* ===== Modal — Liquid Glass ===== */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.2);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; opacity: 0; pointer-events: none;
    transition: opacity var(--duration-normal) var(--ease);
    backdrop-filter: blur(16px) brightness(.95);
    -webkit-backdrop-filter: blur(16px) brightness(.95);
  }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal {
    border-radius: calc(var(--radius) * 1.5); padding: 28px;
    padding-top: 4px;
    width: 92%; max-width: 480px; max-height: 85vh; overflow-y: auto;
    transform: translateY(20px) scale(.96);
    transition: transform var(--duration-normal) var(--ease);
    /* Liquid Glass */
    background: rgba(255,255,255,.72);
    backdrop-filter: blur(60px) saturate(200%) brightness(1.06);
    -webkit-backdrop-filter: blur(60px) saturate(200%) brightness(1.06);
    border: 1px solid rgba(255,255,255,.75);
    box-shadow:
      0 0 0 .5px rgba(255,255,255,.5),
      0 24px 64px rgba(0,0,0,.12),
      inset 0 1px 0 rgba(255,255,255,.9),
      inset 0 -.5px 0 rgba(0,0,0,.03);
  }
  .modal-overlay.show .modal { transform: translateY(0) scale(1); }
  .modal h3 { font-size: 17px; font-weight: 600; margin-bottom: 20px; margin-top: 16px; color: var(--foreground); }
  .modal-close {
    float: right; background: none; border: none; font-size: 18px;
    color: var(--muted-foreground); cursor: pointer; line-height: 1;
    transition: background-color var(--duration-fast) var(--ease), color var(--duration-fast) var(--ease);
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { background: var(--muted); color: var(--foreground); }

  /* ===== Records ===== */
  .record-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid rgba(0,0,0,.04);
    transition: background-color .15s ease;
  }
  .record-item:last-child { border-bottom: none; }
  .record-item:hover { background-color: var(--background-100); }
  .record-info { display: flex; flex-direction: column; gap: 3px; }
  .record-name { font-weight: 600; font-size: 13px; color: var(--foreground); }
  .record-detail { font-size: 12px; color: var(--muted-foreground); }
  .record-time { font-size: 12px; color: var(--text-400); white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ===== Charts ===== */
  .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .chart-wrap { position: relative; }
  .chart-wrap canvas { max-height: 280px; }
  .chart-subtitle {
    font-size: 11px; font-weight: 700; color: var(--muted-foreground);
    letter-spacing: .06em; text-transform: uppercase;
    margin-bottom: 12px;
  }

  /* ===== Empty state ===== */
  .empty-state { text-align: center; padding: 48px 20px; color: var(--muted-foreground); }
  .empty-state .empty-icon { font-size: 28px; margin-bottom: 8px; }
  .empty-state p { font-size: 13px; }

  /* ===== Toast — Liquid Glass pill ===== */
  .toast-container {
    position: fixed; top: 24px; right: 24px; z-index: 2000;
    display: flex; flex-direction: column; gap: 8px;
  }
  .toast {
    padding: 12px 20px; border-radius: 999px;
    font-size: 13px; font-weight: 500;
    /* Liquid Glass */
    background: rgba(255,255,255,.65);
    backdrop-filter: blur(40px) saturate(180%) brightness(1.05);
    -webkit-backdrop-filter: blur(40px) saturate(180%) brightness(1.05);
    border: 1px solid rgba(255,255,255,.6);
    box-shadow:
      0 0 0 .5px rgba(255,255,255,.4),
      0 8px 24px rgba(0,0,0,.08),
      inset 0 1px 0 rgba(255,255,255,.7);
    animation: toastIn var(--duration-normal) var(--ease), toastOut var(--duration-normal) var(--ease) 2.7s forwards;
    display: flex; align-items: center; gap: 8px;
    color: var(--foreground);
  }
  .toast.success { border-left: 3px solid var(--success); }
  .toast.error { border-left: 3px solid var(--destructive); }
  .toast.warning { border-left: 3px solid var(--warning); }
  @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateX(40px); } }

  /* ===== Footer ===== */
  .footer {
    text-align: center; font-size: 11px; color: var(--muted-foreground);
    padding: 24px 0 48px; letter-spacing: .04em; text-transform: uppercase;
  }

  /* ===== Batch Operations ===== */
  .batch-bar-wrapper {
    position: relative; height: 0; overflow: visible;
  }
  .batch-bar {
    position: fixed; bottom: 32px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    display: flex; align-items: center; gap: 12px;
    padding: 10px 20px;
    border-radius: 999px;
    z-index: 500;
    opacity: 0; pointer-events: none;
    transition: transform 350ms var(--ease), opacity 350ms var(--ease);
    /* Liquid Glass */
    background: rgba(255,255,255,.72);
    backdrop-filter: blur(60px) saturate(200%) brightness(1.06);
    -webkit-backdrop-filter: blur(60px) saturate(200%) brightness(1.06);
    border: 1px solid rgba(255,255,255,.7);
    box-shadow:
      0 0 0 .5px rgba(255,255,255,.5),
      0 12px 40px rgba(0,0,0,.12),
      inset 0 1px 0 rgba(255,255,255,.85);
    white-space: nowrap;
  }
  .batch-bar.visible {
    transform: translateX(-50%) translateY(0);
    opacity: 1; pointer-events: auto;
  }
  .batch-count {
    font-size: 13px; font-weight: 600; color: var(--foreground);
    min-width: 60px;
  }
  .batch-bar .btn { box-shadow: var(--shadow-sm); }

  /* Custom checkbox — Apple style */
  .med-check {
    width: 18px; height: 18px;
    border: 1.5px solid rgba(0,0,0,.15);
    border-radius: 5px;
    appearance: none; -webkit-appearance: none;
    background: rgba(255,255,255,.5);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    cursor: pointer;
    position: relative;
    transition: all var(--duration-fast) var(--ease);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.5),
      0 1px 2px rgba(0,0,0,.03);
    flex-shrink: 0;
  }
  .med-check:hover {
    border-color: rgba(0,122,255,.4);
    background: rgba(255,255,255,.7);
  }
  .med-check:checked {
    background: var(--primary);
    border-color: var(--primary);
    box-shadow: 0 2px 8px rgba(0,122,255,.3);
  }
  .med-check:checked::after {
    content: '';
    position: absolute; left: 5px; top: 2px;
    width: 5px; height: 9px;
    border: solid #fff; border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg);
  }
  .med-check:focus-visible {
    outline: 2px solid var(--ring); outline-offset: 2px;
  }
  .check-col { width: 40px; text-align: center; }
  .check-col th { padding: 10px 8px; }
  .check-col td { padding: 14px 8px; }
  .check-label { display: flex; align-items: center; justify-content: center; cursor: pointer; }

  /* Row highlight when selected */
  .med-table tbody tr.selected {
    background: rgba(0,122,255,.06) !important;
  }
  .med-table tbody tr.selected td {
    background: transparent;
  }

  /* ===== Responsive ===== */
  @media (max-width: 768px) {
    .stats { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .header h1 { font-size: 24px; }
    .header { padding: 36px 0 32px; }
    .form-grid { grid-template-columns: 1fr; }
    .med-table { font-size: 13px; }
    .med-table th, .med-table td { padding: 10px 8px; }
    .charts-grid { grid-template-columns: 1fr; }
    .tabs { overflow-x: auto; }
    .search-bar { flex-direction: column; align-items: stretch; }
    .search-bar .search-input-wrap { min-width: 0; }
    .action-btns { flex-wrap: wrap; }
    .section { margin-top: 32px; }
    .card { padding: 16px; }
    .container { padding: 0 16px; }
  }
  @media (max-width: 480px) {
    .stat-card { padding: 14px 10px; }
    .stat-card .num { font-size: 22px; }
  }

  /* Mobile card view for table */
  @media (max-width: 600px) {
    .med-table thead { display: none; }
    .med-table tbody tr {
      display: block; border-radius: var(--radius);
      margin-bottom: 8px; padding: 14px;
      /* Liquid Glass */
      background: rgba(255,255,255,.45);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      border: 1px solid rgba(255,255,255,.5);
      box-shadow:
        0 2px 8px rgba(0,0,0,.04),
        inset 0 1px 0 rgba(255,255,255,.5);
    }
    .med-table tbody td {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid rgba(0,0,0,.04);
    }
    .med-table tbody td:last-child { border-bottom: none; }
    .med-table tbody td::before {
      content: attr(data-label); font-weight: 700; font-size: 11px;
      color: var(--muted-foreground); margin-right: 10px;
      letter-spacing: .04em; text-transform: uppercase;
    }
  }

  /* Modal form overrides */
  .modal .form-grid { gap: 14px; }
  .modal .form-group input,
  .modal .form-group select,
  .modal .form-group textarea { width: 100%; }
</style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<!-- Webbar -->
<nav class="webbar">
  <span class="webbar-brand">家用药箱管家</span>
</nav>

<!-- Header -->
<header class="header">
  <div class="container">
    <h1>家用药箱管家</h1>
    <p>管好药箱，守护家人健康</p>
  </div>
</header>

<div class="container">

  <!-- Stats -->
  <div class="stats" id="statsGrid">
    <div class="stat-card total">
      <div class="icon">&#9635;</div>
      <div class="num" id="statTotal">0</div>
      <div class="label">药品总数</div>
    </div>
    <div class="stat-card expiring">
      <div class="icon">&#9202;</div>
      <div class="num" id="statExpiring">0</div>
      <div class="label">即将过期</div>
    </div>
    <div class="stat-card expired">
      <div class="icon">&#9888;</div>
      <div class="num" id="statExpired">0</div>
      <div class="label">已过期</div>
    </div>
    <div class="stat-card today">
      <div class="icon">&#128197;</div>
      <div class="num" id="statToday">0</div>
      <div class="label">今日用药</div>
    </div>
  </div>

  <!-- Medicine Entry Form -->
  <div class="section">
    <div class="section-title">添加药品</div>
    <div style="margin-bottom:12px;"><h2 class="title">录入新药品信息</h2></div>
    <div class="card">
      <form id="medForm" class="form-grid" onsubmit="return false;">
        <div class="form-group">
          <label for="medName">药品名称 *</label>
          <input type="text" id="medName" placeholder="如：布洛芬缓释胶囊" required>
        </div>
        <div class="form-group">
          <label for="medSpec">规格</label>
          <input type="text" id="medSpec" placeholder="如：0.3g x 24粒">
        </div>
        <div class="form-group">
          <label for="medQty">数量</label>
          <input type="number" id="medQty" placeholder="如：2盒" min="1" value="1">
        </div>
        <div class="form-group">
          <label for="medProdDate">生产日期</label>
          <input type="date" id="medProdDate">
        </div>
        <div class="form-group">
          <label for="medExpDate">有效期至 *</label>
          <input type="date" id="medExpDate" required>
        </div>
        <div class="form-group">
          <label for="medCategory">用途分类 *</label>
          <select id="medCategory" required>
            <option value="">请选择</option>
            <option value="感冒">感冒</option>
            <option value="退烧">退烧</option>
            <option value="止咳">止咳</option>
            <option value="肠胃">肠胃</option>
            <option value="外伤">外伤</option>
            <option value="慢性病">慢性病</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div class="form-group">
          <label for="medLocation">存放位置</label>
          <input type="text" id="medLocation" placeholder="如：客厅药箱第二层">
        </div>
        <div class="form-group">
          <label for="medNotes">备注</label>
          <input type="text" id="medNotes" placeholder="如：饭后服用">
        </div>
      </form>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="addMedicine()">添加药品</button>
        <button class="btn btn-secondary" onclick="resetForm()">重置</button>
      </div>
    </div>
  </div>

  <!-- Medicine List -->
  <div class="section">
    <div class="section-title">药品列表</div>
    <div class="card">
      <div class="tabs" id="listTabs">
        <button class="tab-btn active" data-tab="all" onclick="switchTab(this)">全部</button>
        <button class="tab-btn" data-tab="expiring" onclick="switchTab(this)">即将过期</button>
        <button class="tab-btn" data-tab="expired" onclick="switchTab(this)">已过期</button>
      </div>
      <div style="overflow-x:auto;">
        <table class="med-table">
          <thead>
            <tr>
              <th class="check-col"><label class="check-label"><input type="checkbox" class="med-check" id="checkAll" onchange="toggleCheckAll(this)"></label></th>
              <th>药品名称</th>
              <th>规格</th>
              <th>剩余天数</th>
              <th>用途分类</th>
              <th>存放位置</th>
              <th>数量</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="medListBody">
          </tbody>
        </table>
      </div>
      <div class="empty-state" id="emptyState" style="display:none;">
        <div class="empty-icon">&#9638;</div>
        <p>暂无药品记录，快来添加吧</p>
      </div>
    </div>
    <!-- Batch action bar -->
    <div class="batch-bar" id="batchBar">
      <span class="batch-count" id="batchCount">已选 0 项</span>
      <button class="btn btn-danger btn-sm" onclick="batchDelete()">批量删除</button>
      <button class="btn btn-secondary btn-sm" onclick="batchExport()">导出数据</button>
      <button class="btn btn-secondary btn-sm" onclick="clearSelection()">取消选择</button>
    </div>
  </div>

  <!-- Smart Search -->
  <div class="section">
    <div class="section-title">智能找药</div>
    <div class="card">
      <div class="search-bar">
        <div class="search-input-wrap">
          <input type="text" id="searchInput" placeholder="输入症状关键词，如：发烧、头痛、拉肚子..." oninput="searchMedicine()">
        </div>
        <select id="filterCategory" onchange="searchMedicine()">
          <option value="">全部分类</option>
          <option value="感冒">感冒</option>
          <option value="退烧">退烧</option>
          <option value="止咳">止咳</option>
          <option value="肠胃">肠胃</option>
          <option value="外伤">外伤</option>
          <option value="慢性病">慢性病</option>
          <option value="其他">其他</option>
        </select>
        <select id="filterLocation" onchange="searchMedicine()">
          <option value="">全部位置</option>
        </select>
      </div>
      <div class="search-results" id="searchResults">
        <div class="empty-state" style="padding:24px;">
          <div class="empty-icon" style="font-size:20px;">&#8982;</div>
          <p>试试输入"发烧"、"咳嗽"等关键词查找对症药品</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Medication Records -->
  <div class="section">
    <div class="section-title" style="justify-content:space-between;">
      <span>用药记录</span>
      <button class="btn btn-primary btn-sm" onclick="openRecordModal()">记录用药</button>
    </div>
    <div class="card">
      <div id="recordList">
        <div class="empty-state" style="padding:24px;">
          <div class="empty-icon" style="font-size:20px;">&#8226;</div>
          <p>暂无用药记录</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Charts -->
  <div class="section">
    <div class="section-title">数据统计</div>
    <div class="card">
      <div class="charts-grid">
        <div class="chart-wrap">
          <div class="chart-subtitle">药品分类占比</div>
          <canvas id="categoryPieChart"></canvas>
        </div>
        <div class="chart-wrap">
          <div class="chart-subtitle">有效期分布</div>
          <canvas id="expiryBarChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">家用药箱管家</footer>
</div>

<!-- Record Modal -->
<div class="modal-overlay" id="recordModal">
  <div class="modal">
    <button class="modal-close" onclick="closeRecordModal()">&times;</button>
    <h3>记录用药</h3>
    <div class="form-grid" style="gap:14px;">
      <div class="form-group">
        <label for="recMedicine">选择药品 *</label>
        <select id="recMedicine" required></select>
      </div>
      <div class="form-group">
        <label for="recPerson">用药人 *</label>
        <input type="text" id="recPerson" placeholder="如：爸爸、妈妈、孩子" required>
      </div>
      <div class="form-group">
        <label for="recDosage">剂量</label>
        <input type="text" id="recDosage" placeholder="如：1粒、10ml">
      </div>
      <div class="form-group">
        <label for="recTime">用药时间 *</label>
        <input type="datetime-local" id="recTime" required>
      </div>
    </div>
    <div class="form-actions" style="margin-top:20px;">
      <button class="btn btn-primary" onclick="saveRecord()">保存记录</button>
      <button class="btn btn-secondary" onclick="closeRecordModal()">取消</button>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <button class="modal-close" onclick="closeEditModal()">&times;</button>
    <h3>编辑药品</h3>
    <div class="form-grid" style="gap:14px;">
      <div class="form-group"><label>药品名称</label><input type="text" id="editName"></div>
      <div class="form-group"><label>规格</label><input type="text" id="editSpec"></div>
      <div class="form-group"><label>数量</label><input type="number" id="editQty" min="1"></div>
      <div class="form-group"><label>生产日期</label><input type="date" id="editProdDate"></div>
      <div class="form-group"><label>有效期至</label><input type="date" id="editExpDate"></div>
      <div class="form-group"><label>用途分类</label>
        <select id="editCategory">
          <option value="感冒">感冒</option><option value="退烧">退烧</option><option value="止咳">止咳</option>
          <option value="肠胃">肠胃</option><option value="外伤">外伤</option><option value="慢性病">慢性病</option><option value="其他">其他</option>
        </select>
      </div>
      <div class="form-group"><label>存放位置</label><input type="text" id="editLocation"></div>
      <div class="form-group"><label>备注</label><input type="text" id="editNotes"></div>
    </div>
    <div class="form-actions" style="margin-top:16px;">
      <button class="btn btn-primary" onclick="saveEdit()">保存修改</button>
      <button class="btn btn-secondary" onclick="closeEditModal()">取消</button>
    </div>
  </div>
</div>

<script>
// ============ Data Layer ============
const STORAGE_KEY = 'medicine_cabinet_data';
const RECORD_KEY = 'medicine_cabinet_records';
const DEMO_KEY = 'medicine_cabinet_demo_initialized';
let currentTab = 'all';
let editingId = null;
let pieChart = null;
let barChart = null;
let selectedIds = new Set(); // batch selection state

// Symptom-keyword mapping for smart search
const SYMPTOM_MAP = {
  '发烧': ['退烧', '感冒'],
  '发热': ['退烧', '感冒'],
  '头痛': ['退烧', '感冒'],
  '感冒': ['感冒'],
  '流鼻涕': ['感冒'],
  '鼻塞': ['感冒'],
  '咳嗽': ['止咳', '感冒'],
  '嗓子疼': ['止咳', '感冒'],
  '咽喉': ['止咳', '感冒'],
  '拉肚子': ['肠胃'],
  '腹泻': ['肠胃'],
  '胃痛': ['肠胃'],
  '胃疼': ['肠胃'],
  '消化不良': ['肠胃'],
  '呕吐': ['肠胃'],
  '恶心': ['肠胃'],
  '便秘': ['肠胃'],
  '烫伤': ['外伤'],
  '割伤': ['外伤'],
  '擦伤': ['外伤'],
  '扭伤': ['外伤'],
  '伤口': ['外伤'],
  '消肿': ['外伤'],
  '高血压': ['慢性病'],
  '糖尿病': ['慢性病'],
  '血压': ['慢性病'],
  '血糖': ['慢性病'],
  '过敏': ['其他', '感冒'],
  '止痒': ['其他'],
  '牙疼': ['其他'],
  '牙痛': ['其他'],
  '眼睛': ['其他'],
  '上火': ['其他'],
  '消炎': ['外伤', '感冒', '其他'],
  '疼痛': ['退烧', '外伤'],
  '镇痛': ['退烧'],
};

function loadData() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
}
function saveData(meds) { localStorage.setItem(STORAGE_KEY, JSON.stringify(meds)); }
function loadRecords() {
  try { return JSON.parse(localStorage.getItem(RECORD_KEY)) || []; } catch { return []; }
}
function saveRecords(recs) { localStorage.setItem(RECORD_KEY, JSON.stringify(recs)); }

// ============ Demo Data ============
function initDemoData() {
  if (localStorage.getItem(DEMO_KEY)) return;
  const today = new Date();
  const d = (offset) => { const dt = new Date(today); dt.setDate(dt.getDate() + offset); return dt.toISOString().slice(0, 10); };
  const demoMeds = [
    { id: genId(), name: '布洛芬缓释胶囊', spec: '0.3g x 24粒', qty: 2, prodDate: d(-180), expDate: d(25), category: '退烧', location: '客厅药箱第二层', notes: '饭后服用，每日不超过3次' },
    { id: genId(), name: '板蓝根颗粒', spec: '10g x 20袋', qty: 3, prodDate: d(-300), expDate: d(180), category: '感冒', location: '客厅药箱第一层', notes: '冲服，一次1-2袋' },
    { id: genId(), name: '健胃消食片', spec: '0.8g x 32片', qty: 1, prodDate: d(-200), expDate: d(15), category: '肠胃', location: '厨房抽屉', notes: '嚼服，一次3片' },
    { id: genId(), name: '创可贴', spec: '透气型 x 10片', qty: 5, prodDate: d(-400), expDate: d(-10), category: '外伤', location: '卧室床头柜', notes: '' },
    { id: genId(), name: '氨溴索口服液', spec: '100ml', qty: 1, prodDate: d(-100), expDate: d(365), category: '止咳', location: '客厅药箱第二层', notes: '一日3次，一次10ml' },
  ];
  saveData(demoMeds);
  const demoRecords = [
    { id: genId(), medId: demoMeds[0].id, medName: '布洛芬缓释胶囊', person: '爸爸', dosage: '1粒', time: new Date(today.getFullYear(), today.getMonth(), today.getDate(), 8, 30).toISOString() },
    { id: genId(), medId: demoMeds[4].id, medName: '氨溴索口服液', person: '妈妈', dosage: '10ml', time: new Date(today.getFullYear(), today.getMonth(), today.getDate(), 12, 0).toISOString() },
  ];
  saveRecords(demoRecords);
  localStorage.setItem(DEMO_KEY, 'true');
}

// ============ Helpers ============
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function getDaysRemaining(expDateStr) {
  const today = new Date(); today.setHours(0,0,0,0);
  const exp = new Date(expDateStr); exp.setHours(0,0,0,0);
  return Math.ceil((exp - today) / (1000*60*60*24));
}
function getStatus(expDateStr) {
  const days = getDaysRemaining(expDateStr);
  if (days < 0) return { label: `已过期${Math.abs(days)}天`, cls: 'badge-danger', status: 'expired' };
  if (days <= 30) return { label: `剩余${days}天`, cls: 'badge-warn', status: 'expiring' };
  return { label: `剩余${days}天`, cls: 'badge-ok', status: 'ok' };
}
function showToast(msg, type = 'success') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  const icons = { success: '\u2713', error: '\u2717', warning: '!' };
  toast.innerHTML = `<span style="font-weight:700;">${icons[type] || ''}</span> ${msg}`;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3200);
}
function formatDate(isoStr) {
  const d = new Date(isoStr);
  return `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function esc(str) {
  const div = document.createElement('div'); div.textContent = str; return div.innerHTML;
}

// ============ CRUD ============
function addMedicine() {
  const name = document.getElementById('medName').value.trim();
  const spec = document.getElementById('medSpec').value.trim();
  const qty = parseInt(document.getElementById('medQty').value) || 1;
  const prodDate = document.getElementById('medProdDate').value;
  const expDate = document.getElementById('medExpDate').value;
  const category = document.getElementById('medCategory').value;
  const location = document.getElementById('medLocation').value.trim();
  const notes = document.getElementById('medNotes').value.trim();
  if (!name || !expDate || !category) { showToast('请填写必填项（药品名称、有效期、用途分类）', 'warning'); return; }
  const meds = loadData();
  meds.push({ id: genId(), name, spec, qty, prodDate, expDate, category, location, notes });
  saveData(meds); resetForm(); refreshAll();
  showToast(`已添加「${name}」`);
}

function deleteMedicine(id) {
  const meds = loadData(); const med = meds.find(m => m.id === id);
  if (!med) return;
  if (!confirm(`确定要删除「${med.name}」吗？`)) return;
  saveData(meds.filter(m => m.id !== id)); refreshAll();
  showToast(`已删除「${med.name}」`, 'warning');
}

function openEditModal(id) {
  const meds = loadData(); const med = meds.find(m => m.id === id);
  if (!med) return;
  editingId = id;
  document.getElementById('editName').value = med.name;
  document.getElementById('editSpec').value = med.spec;
  document.getElementById('editQty').value = med.qty;
  document.getElementById('editProdDate').value = med.prodDate;
  document.getElementById('editExpDate').value = med.expDate;
  document.getElementById('editCategory').value = med.category;
  document.getElementById('editLocation').value = med.location;
  document.getElementById('editNotes').value = med.notes;
  document.getElementById('editModal').classList.add('show');
}
function closeEditModal() { document.getElementById('editModal').classList.remove('show'); editingId = null; }

function saveEdit() {
  if (!editingId) return;
  const meds = loadData(); const idx = meds.findIndex(m => m.id === editingId);
  if (idx < 0) return;
  meds[idx].name = document.getElementById('editName').value.trim();
  meds[idx].spec = document.getElementById('editSpec').value.trim();
  meds[idx].qty = parseInt(document.getElementById('editQty').value) || 1;
  meds[idx].prodDate = document.getElementById('editProdDate').value;
  meds[idx].expDate = document.getElementById('editExpDate').value;
  meds[idx].category = document.getElementById('editCategory').value;
  meds[idx].location = document.getElementById('editLocation').value.trim();
  meds[idx].notes = document.getElementById('editNotes').value.trim();
  saveData(meds); closeEditModal(); refreshAll();
  showToast(`已更新「${meds[idx].name}」`);
}

function resetForm() {
  document.getElementById('medForm').querySelectorAll('input, select, textarea').forEach(el => {
    if (el.type === 'number') el.value = '1'; else el.value = '';
  });
  document.getElementById('medCategory').value = '';
}

// ============ Batch Operations ============
function toggleCheck(id, checkbox) {
  if (checkbox.checked) selectedIds.add(id); else selectedIds.delete(id);
  const row = checkbox.closest('tr');
  if (row) row.classList.toggle('selected', checkbox.checked);
  updateBatchBar();
  updateCheckAllState();
}

function toggleCheckAll(masterCheckbox) {
  const checkboxes = document.querySelectorAll('#medListBody .med-check');
  checkboxes.forEach(cb => {
    cb.checked = masterCheckbox.checked;
    const row = cb.closest('tr');
    if (row) row.classList.toggle('selected', masterCheckbox.checked);
    const id = cb.dataset.id;
    if (masterCheckbox.checked) selectedIds.add(id); else selectedIds.delete(id);
  });
  updateBatchBar();
}

function updateCheckAllState() {
  const checkboxes = document.querySelectorAll('#medListBody .med-check');
  const master = document.getElementById('checkAll');
  if (!master || checkboxes.length === 0) { if (master) master.checked = false; return; }
  const allChecked = [...checkboxes].every(cb => cb.checked);
  const someChecked = [...checkboxes].some(cb => cb.checked);
  master.checked = allChecked;
  master.indeterminate = someChecked && !allChecked;
}

function updateBatchBar() {
  const bar = document.getElementById('batchBar');
  const countEl = document.getElementById('batchCount');
  const count = selectedIds.size;
  countEl.textContent = `已选 ${count} 项`;
  if (count > 0) bar.classList.add('visible');
  else bar.classList.remove('visible');
}

function clearSelection() {
  selectedIds.clear();
  document.querySelectorAll('#medListBody .med-check').forEach(cb => {
    cb.checked = false;
    const row = cb.closest('tr');
    if (row) row.classList.remove('selected');
  });
  const master = document.getElementById('checkAll');
  if (master) { master.checked = false; master.indeterminate = false; }
  updateBatchBar();
}

function batchDelete() {
  if (selectedIds.size === 0) { showToast('请先选择要删除的药品', 'warning'); return; }
  if (!confirm(`确定要删除选中的 ${selectedIds.size} 个药品吗？此操作不可撤销。`)) return;
  const meds = loadData();
  const deleted = meds.filter(m => selectedIds.has(m.id));
  saveData(meds.filter(m => !selectedIds.has(m.id)));
  selectedIds.clear();
  refreshAll();
  showToast(`已删除 ${deleted.length} 个药品`, 'warning');
}

function batchExport() {
  if (selectedIds.size === 0) { showToast('请先选择要导出的药品', 'warning'); return; }
  const meds = loadData().filter(m => selectedIds.has(m.id));
  const header = '药品名称,规格,数量,生产日期,有效期至,用途分类,存放位置,备注,剩余天数';
  const rows = meds.map(m => {
    const days = getDaysRemaining(m.expDate);
    return [m.name, m.spec||'', m.qty, m.prodDate||'', m.expDate, m.category, m.location||'', m.notes||'', days]
      .map(v => `"${String(v).replace(/"/g, '""')}"`).join(',');
  });
  const csv = '\uFEFF' + header + '\n' + rows.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `药品数据_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`已导出 ${meds.length} 条药品数据`);
}

// ============ Tabs & Rendering ============
function switchTab(btn) {
  document.querySelectorAll('#listTabs .tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active'); currentTab = btn.dataset.tab; renderMedList();
}

function renderMedList() {
  const meds = loadData(); const tbody = document.getElementById('medListBody'); const empty = document.getElementById('emptyState');
  let filtered = meds;
  if (currentTab === 'expiring') filtered = meds.filter(m => { const d = getDaysRemaining(m.expDate); return d >= 0 && d <= 30; });
  else if (currentTab === 'expired') filtered = meds.filter(m => getDaysRemaining(m.expDate) < 0);
  if (filtered.length === 0) { tbody.innerHTML = ''; empty.style.display = 'block'; updateBatchBar(); return; }
  empty.style.display = 'none';
  tbody.innerHTML = filtered.map(m => {
    const st = getStatus(m.expDate);
    const checked = selectedIds.has(m.id) ? 'checked' : '';
    const selClass = selectedIds.has(m.id) ? ' selected' : '';
    return `<tr class="${selClass}">
      <td data-label="" class="check-col"><label class="check-label"><input type="checkbox" class="med-check" data-id="${m.id}" ${checked} onchange="toggleCheck('${m.id}', this)"></label></td>
      <td data-label="药品名称"><strong>${esc(m.name)}</strong></td>
      <td data-label="规格">${esc(m.spec || '-')}</td>
      <td data-label="剩余天数"><span class="badge ${st.cls}">${st.label}</span></td>
      <td data-label="用途分类"><span class="cat-tag">${esc(m.category)}</span></td>
      <td data-label="存放位置">${esc(m.location || '-')}</td>
      <td data-label="数量">${m.qty}</td>
      <td data-label="操作"><div class="action-btns">
        <button class="btn btn-secondary btn-sm" onclick="openEditModal('${m.id}')">编辑</button>
        <button class="btn btn-danger btn-sm" onclick="deleteMedicine('${m.id}')">删除</button>
        <button class="btn btn-accent btn-sm" onclick="openRecordModalWith('${m.id}')">用药</button>
      </div></td>
    </tr>`;
  }).join('');
  updateBatchBar();
  updateCheckAllState();
}

// ============ Stats ============
function updateStats() {
  const meds = loadData(); const records = loadRecords();
  const today = new Date(); today.setHours(0,0,0,0);
  const expiring = meds.filter(m => { const d = getDaysRemaining(m.expDate); return d >= 0 && d <= 30; }).length;
  const expired = meds.filter(m => getDaysRemaining(m.expDate) < 0).length;
  const todayRecords = records.filter(r => { const rd = new Date(r.time); return rd.getFullYear()===today.getFullYear() && rd.getMonth()===today.getMonth() && rd.getDate()===today.getDate(); }).length;
  document.getElementById('statTotal').textContent = meds.length;
  document.getElementById('statExpiring').textContent = expiring;
  document.getElementById('statExpired').textContent = expired;
  document.getElementById('statToday').textContent = todayRecords;
}

// ============ Smart Search ============
function searchMedicine() {
  const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
  const catFilter = document.getElementById('filterCategory').value;
  const locFilter = document.getElementById('filterLocation').value;
  const container = document.getElementById('searchResults');
  const meds = loadData();
  if (!keyword && !catFilter && !locFilter) {
    container.innerHTML = `<div class="empty-state" style="padding:24px;"><div class="empty-icon" style="font-size:20px;">&#8982;</div><p>试试输入"发烧"、"咳嗽"等关键词查找对症药品</p></div>`;
    return;
  }
  let matchedCats = new Set();
  if (keyword) {
    Object.entries(SYMPTOM_MAP).forEach(([symptom, cats]) => {
      if (symptom.includes(keyword) || keyword.includes(symptom)) cats.forEach(c => matchedCats.add(c));
    });
    meds.forEach(m => {
      if (m.name.toLowerCase().includes(keyword) || (m.notes && m.notes.toLowerCase().includes(keyword))) matchedCats.add(m.category);
    });
  }
  let results = meds.filter(m => {
    if (catFilter && m.category !== catFilter) return false;
    if (locFilter && m.location !== locFilter) return false;
    if (matchedCats.size > 0 && !matchedCats.has(m.category)) return false;
    return true;
  });
  if (keyword && matchedCats.size === 0) {
    results = meds.filter(m => {
      if (catFilter && m.category !== catFilter) return false;
      if (locFilter && m.location !== locFilter) return false;
      return true;
    });
  }
  if (results.length === 0) {
    container.innerHTML = `<div class="empty-state" style="padding:24px;"><div class="empty-icon" style="font-size:20px;">&#8709;</div><p>未找到匹配的药品</p></div>`;
    return;
  }
  container.innerHTML = results.map(m => {
    const st = getStatus(m.expDate);
    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);transition:background-color .15s ease;" onmouseenter="this.style.backgroundColor='var(--background-100)'" onmouseleave="this.style.backgroundColor='transparent'">
      <div>
        <strong style="font-size:13px;">${esc(m.name)}</strong>
        <span class="cat-tag" style="margin-left:8px;">${esc(m.category)}</span>
        <div style="font-size:12px;color:var(--muted-foreground);margin-top:4px;">${esc(m.spec||'')} &middot; ${esc(m.location||'无位置信息')}${m.notes ? ' &middot; '+esc(m.notes) : ''}</div>
      </div>
      <span class="badge ${st.cls}">${st.label}</span>
    </div>`;
  }).join('');
}

function updateLocationFilter() {
  const meds = loadData(); const locations = [...new Set(meds.map(m => m.location).filter(Boolean))];
  const sel = document.getElementById('filterLocation'); const currentVal = sel.value;
  sel.innerHTML = '<option value="">全部位置</option>' + locations.map(l => `<option value="${esc(l)}">${esc(l)}</option>`).join('');
  sel.value = currentVal;
}

// ============ Records ============
function openRecordModal() {
  populateMedSelect();
  document.getElementById('recPerson').value = '';
  document.getElementById('recDosage').value = '';
  const now = new Date();
  const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  document.getElementById('recTime').value = local;
  document.getElementById('recordModal').classList.add('show');
}
function openRecordModalWith(medId) { openRecordModal(); document.getElementById('recMedicine').value = medId; }
function closeRecordModal() { document.getElementById('recordModal').classList.remove('show'); }
function populateMedSelect() {
  const meds = loadData(); const sel = document.getElementById('recMedicine');
  sel.innerHTML = '<option value="">请选择药品</option>' + meds.map(m => `<option value="${m.id}">${esc(m.name)}${m.spec ? ' ('+esc(m.spec)+')' : ''}</option>`).join('');
}
function saveRecord() {
  const medId = document.getElementById('recMedicine').value;
  const person = document.getElementById('recPerson').value.trim();
  const dosage = document.getElementById('recDosage').value.trim();
  const time = document.getElementById('recTime').value;
  if (!medId || !person || !time) { showToast('请填写必填项（药品、用药人、时间）', 'warning'); return; }
  const meds = loadData(); const med = meds.find(m => m.id === medId);
  if (!med) { showToast('未找到该药品', 'error'); return; }
  const records = loadRecords();
  records.unshift({ id: genId(), medId, medName: med.name, person, dosage, time: new Date(time).toISOString() });
  saveRecords(records); closeRecordModal(); refreshAll();
  showToast(`已记录「${med.name}」用药`);
}

function renderRecords() {
  const records = loadRecords(); const container = document.getElementById('recordList');
  if (records.length === 0) {
    container.innerHTML = `<div class="empty-state" style="padding:24px;"><div class="empty-icon" style="font-size:20px;">&#8226;</div><p>暂无用药记录</p></div>`;
    return;
  }
  container.innerHTML = records.slice(0, 20).map(r => `
    <div class="record-item">
      <div class="record-info">
        <span class="record-name">${esc(r.medName)}</span>
        <span class="record-detail">${esc(r.person)} ${r.dosage ? '&middot; '+esc(r.dosage) : ''}</span>
      </div>
      <span class="record-time">${formatDate(r.time)}</span>
    </div>
  `).join('');
}

// ============ Charts ============
function renderCharts() {
  const meds = loadData();
  const categories = ['感冒','退烧','止咳','肠胃','外伤','慢性病','其他'];
  const catCounts = categories.map(c => meds.filter(m => m.category === c).length);

  // Apple chart palette
  const appleColors = ['#34c759','#007aff','#5856d6','#ff9500','#ff3b30','#af52de','#8e8e93'];

  if (pieChart) pieChart.destroy();
  const pieCtx = document.getElementById('categoryPieChart').getContext('2d');
  pieChart = new Chart(pieCtx, {
    type: 'doughnut',
    data: {
      labels: categories,
      datasets: [{ data: catCounts, backgroundColor: appleColors, borderWidth: 2, borderColor: '#ffffff', hoverOffset: 6 }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'bottom', labels: { padding: 16, usePointStyle: true, pointStyle: 'circle', font: { size: 12, family: "'DM Sans', sans-serif", weight: '500' }, color: '#1d1d1f' } }
      },
      cutout: '62%'
    }
  });

  if (barChart) barChart.destroy();
  const barCtx = document.getElementById('expiryBarChart').getContext('2d');
  const expiredCount = meds.filter(m => getDaysRemaining(m.expDate) < 0).length;
  const within7 = meds.filter(m => { const d = getDaysRemaining(m.expDate); return d >= 0 && d <= 7; }).length;
  const within15 = meds.filter(m => { const d = getDaysRemaining(m.expDate); return d > 7 && d <= 15; }).length;
  const within30 = meds.filter(m => { const d = getDaysRemaining(m.expDate); return d > 15 && d <= 30; }).length;
  const within90 = meds.filter(m => { const d = getDaysRemaining(m.expDate); return d > 30 && d <= 90; }).length;
  const beyond90 = meds.filter(m => getDaysRemaining(m.expDate) > 90).length;

  barChart = new Chart(barCtx, {
    type: 'bar',
    data: {
      labels: ['已过期', '0-7天', '8-15天', '16-30天', '31-90天', '90天以上'],
      datasets: [{
        label: '药品数量',
        data: [expiredCount, within7, within15, within30, within90, beyond90],
        backgroundColor: ['#ff3b30','#ff9500','#ffcc00','#34c759','#007aff','#5856d6'],
        borderRadius: 6,
        borderSkipped: false,
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        y: {
          beginAtZero: true,
          ticks: { stepSize: 1, font: { size: 11, family: "'DM Sans', sans-serif" }, color: '#8e8e93' },
          grid: { color: 'rgba(0,0,0,.04)' }
        },
        x: {
          grid: { display: false },
          ticks: { font: { size: 11, family: "'DM Sans', sans-serif" }, color: '#8e8e93' }
        }
      }
    }
  });
}

// ============ Refresh ============
function refreshAll() {
  updateStats(); renderMedList(); renderRecords(); renderCharts(); updateLocationFilter();
}

// ============ Init ============
initDemoData();
refreshAll();

document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) { overlay.classList.remove('show'); editingId = null; }
  });
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.show').forEach(m => m.classList.remove('show'));
    editingId = null;
  }
});
