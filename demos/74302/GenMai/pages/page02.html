<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>根脉 - AI族谱</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="phone-container">
    <img class="page-bg" src="../images/02.jpg" alt="页面背景">
    <div class="hotspot" id="field-name"
         style="left:38%;top:30%;width:52%;height:3.5%;"
         onclick="showInputModal('编辑姓名', '请输入姓名', function(v){if(v)showToast('姓名已更新为：'+v)})"></div>
    <div class="hotspot" id="field-gender"
         style="left:38%;top:34.5%;width:52%;height:3.5%;"
         onclick="showToast('当前性别：男（Demo演示）')"></div>
    <div class="hotspot" id="field-year"
         style="left:38%;top:39%;width:52%;height:3.5%;"
         onclick="showInputModal('编辑出生年份', '请输入年份，如：1037', function(v){if(v)showToast('出生年份已更新为：'+v+'年')})"></div>
    <div class="hotspot" id="field-place"
         style="left:38%;top:43.5%;width:52%;height:3.5%;"
         onclick="showInputModal('编辑籍贯', '请输入籍贯', function(v){if(v)showToast('籍贯已更新为：'+v)})"></div>
    <div class="hotspot" id="member-father"
         style="left:5%;top:56%;width:90%;height:5%;"
         onclick="showToast('查看父亲：苏洵（Demo演示）')"></div>
    <div class="hotspot" id="member-brother"
         style="left:5%;top:62%;width:90%;height:5%;"
         onclick="showToast('查看弟弟：苏辙（Demo演示）')"></div>
    <div class="hotspot" id="btn-add-member"
         style="left:5%;top:68%;width:90%;height:4.5%;"
         onclick="showToast('添加家庭成员（Demo演示）')"></div>
    <div class="hotspot" id="btn-next"
         style="left:8%;top:90%;width:84%;height:6.5%;"
         onclick="goTo('page03.html')"></div>
    <div class="hotspot" id="btn-back"
         style="left:2%;top:5%;width:8%;height:4%;"
         onclick="goTo('page01.html')"></div>

  <!-- 通用输入弹窗 -->
  <div class="modal-overlay" id="inputModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div class="modal-title" id="modalTitle">编辑</div>
      <input class="modal-input" id="modalInput" type="text" placeholder="请输入">
      <div class="modal-actions">
        <button class="modal-btn cancel" onclick="closeModal()">取消</button>
        <button class="modal-btn confirm" onclick="confirmModal()">确认</button>
      </div>
    </div>
  </div>
  <!-- 商品详情弹窗 -->
  <div class="modal-overlay" id="productModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeProductModal()">&times;</button>
      <div class="product-modal-img">商品图片</div>
      <div class="product-name" id="productName">商品名称</div>
      <div class="product-price" id="productPrice">800 根脉币</div>
      <div class="modal-actions">
        <button class="modal-btn cancel" onclick="closeProductModal()">关闭</button>
        <button class="modal-btn confirm" onclick="exchangeProduct()">立即兑换</button>
      </div>
    </div>
  </div>
  <!-- QR Code弹窗 -->
  <div class="modal-overlay" id="qrModal">
    <div class="qr-modal-content">
      <button class="modal-close" onclick="closeQRModal()">&times;</button>
      <div class="modal-title">邀请家人加入</div>
      <div class="qr-placeholder">二维码占位</div>
      <div class="modal-actions">
        <button class="modal-btn cancel" onclick="closeQRModal()">关闭</button>
        <button class="modal-btn confirm" onclick="showToast('链接已复制！（Demo演示）');closeQRModal()">复制链接</button>
      </div>
    </div>
  </div>
  <!-- 录音动画覆盖层 -->
  <div class="recording-overlay" id="recordingOverlay">
    <div class="recording-circle">
      <span class="recording-icon">&#127908;</span>
    </div>
    <div class="recording-waves">
      <div class="recording-wave"></div>
      <div class="recording-wave"></div>
      <div class="recording-wave"></div>
      <div class="recording-wave"></div>
      <div class="recording-wave"></div>
      <div class="recording-wave"></div>
      <div class="recording-wave"></div>
    </div>
    <div class="recording-text">录音中...</div>
  </div>
  </div>
  <script src="../js/common.js"></script>
</body>
</html>
