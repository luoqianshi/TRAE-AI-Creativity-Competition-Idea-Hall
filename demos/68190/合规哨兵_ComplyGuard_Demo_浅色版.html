<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>合规哨兵 ComplyGuard Demo（浅色版）</title>
  <style>
    :root{
      --bg:#f6f8fc;
      --bg2:#eef3ff;
      --card:#ffffff;
      --card2:#f7f9ff;
      --line:rgba(15, 23, 42, .10);
      --text:#0f172a;
      --muted:#51607a;

      --brand:#1a56db;
      --brand2:#4f8cff;
      --brandSoft:rgba(26,86,219,.10);

      --success:#059669;
      --successSoft:rgba(5,150,105,.10);
      --warning:#d97706;
      --warningSoft:rgba(217,119,6,.12);
      --danger:#dc2626;
      --dangerSoft:rgba(220,38,38,.10);

      --shadow:0 18px 48px rgba(15,23,42,.10);
      --shadow2:0 10px 26px rgba(15,23,42,.08);
      --radius:14px;
    }

    *{box-sizing:border-box;}
    html,body{margin:0;min-height:100%;}
    body{
      font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 14% 12%, rgba(79,140,255,.18), transparent 26%),
        radial-gradient(circle at 88% 18%, rgba(5,150,105,.10), transparent 26%),
        radial-gradient(circle at 70% 92%, rgba(217,119,6,.10), transparent 28%),
        linear-gradient(180deg, var(--bg2) 0%, var(--bg) 60%);
    }

    button,input,textarea,select{font:inherit;}
    button{border:0;cursor:pointer;}

    .app{
      width:min(1200px, calc(100vw - 32px));
      margin:24px auto;
      display:grid;
      grid-template-columns:280px 1fr;
      gap:16px;
      min-height:calc(100vh - 48px);
    }

    .sidebar{
      background:linear-gradient(180deg, #ffffff 0%, #f7f9ff 100%);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:18px 14px;
      position:sticky;
      top:16px;
      height:fit-content;
      overflow:hidden;
    }
    .sidebar::after{
      content:"";
      position:absolute;
      width:220px;height:220px;
      right:-80px;top:-90px;
      background:radial-gradient(circle, rgba(79,140,255,.22), rgba(79,140,255,0));
      pointer-events:none;
    }

    .brand{
      display:flex;gap:12px;align-items:flex-start;
      padding:4px 4px 14px;
      margin-bottom:12px;
      border-bottom:1px solid var(--line);
      position:relative;
      z-index:1;
    }
    .brand-badge{
      width:42px;height:42px;border-radius:14px;
      display:grid;place-items:center;
      background:linear-gradient(135deg, var(--brand), var(--brand2));
      color:#fff;font-weight:900;
      box-shadow:0 14px 30px rgba(26,86,219,.22);
    }
    .brand h1{margin:0 0 6px;font-size:18px;line-height:1.2;}
    .brand p{margin:0;color:var(--muted);font-size:12px;line-height:1.6;}

    .nav{display:grid;gap:8px;margin-top:14px;position:relative;z-index:1;}
    .nav-item{
      width:100%;
      text-align:left;
      padding:12px 12px;
      border-radius:14px;
      background:rgba(26,86,219,.03);
      border:1px solid rgba(15,23,42,.06);
      color:var(--text);
      transition:.18s ease;
    }
    .nav-item:hover{
      transform:translateY(-1px);
      border-color:rgba(26,86,219,.22);
      box-shadow:var(--shadow2);
    }
    .nav-item.active{
      background:linear-gradient(135deg, rgba(26,86,219,.14), rgba(79,140,255,.10));
      border-color:rgba(26,86,219,.32);
    }
    .nav-item.locked{opacity:.55;}
    .nav-label{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      font-weight:800;font-size:13px;
    }
    .nav-meta{margin-top:6px;color:var(--muted);font-size:11px;}
    .check{color:var(--success);font-weight:900;}

    .sidebar-card{
      margin-top:12px;
      padding:12px;
      border-radius:16px;
      background:linear-gradient(180deg, #ffffff, #f7f9ff);
      border:1px solid rgba(15,23,42,.08);
      box-shadow:0 10px 24px rgba(15,23,42,.06);
      position:relative;
      z-index:1;
    }
    .sidebar-card h3{margin:0 0 8px;font-size:13px;}
    .sidebar-card p,.sidebar-card li{margin:0;color:var(--muted);font-size:12px;line-height:1.75;}
    .sidebar-card ul{margin:8px 0 0;padding-left:16px;}

    .main{min-width:0;}
    .topbar{
      display:flex;align-items:center;justify-content:space-between;gap:14px;
      padding:14px 16px;
      border-radius:18px;
      background:rgba(255,255,255,.78);
      border:1px solid rgba(15,23,42,.08);
      box-shadow:var(--shadow2);
      backdrop-filter: blur(12px);
    }
    .topbar-left h2{margin:0 0 6px;font-size:20px;}
    .topbar-left p{margin:0;color:var(--muted);font-size:13px;line-height:1.6;}
    .top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}

    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:10px 14px;border-radius:12px;
      font-weight:800;font-size:13px;
      transition:.18s ease;
      white-space:nowrap;
    }
    .btn:hover{transform:translateY(-1px);}
    .btn:disabled{opacity:.55;cursor:not-allowed;transform:none;}
    .btn-primary{
      color:#fff;
      background:linear-gradient(135deg, var(--brand), var(--brand2));
      box-shadow:0 14px 30px rgba(26,86,219,.18);
    }
    .btn-secondary{
      color:var(--text);
      background:#fff;
      border:1px solid rgba(15,23,42,.10);
      box-shadow:0 10px 22px rgba(15,23,42,.06);
    }

    .page{
      margin-top:14px;
      background:rgba(255,255,255,.80);
      border:1px solid rgba(15,23,42,.08);
      border-radius:18px;
      box-shadow:var(--shadow);
      overflow:hidden;
      min-height:calc(100vh - 132px);
    }
    .page-inner{padding:20px;animation:fadeIn .22s ease;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

    .hero{
      padding:20px;
      border-radius:18px;
      background:
        radial-gradient(circle at 90% 10%, rgba(79,140,255,.20), transparent 26%),
        radial-gradient(circle at 12% 90%, rgba(5,150,105,.12), transparent 28%),
        linear-gradient(180deg, #ffffff, #f7f9ff);
      border:1px solid rgba(15,23,42,.08);
      box-shadow:0 12px 30px rgba(15,23,42,.06);
    }
    .eyebrow{
      display:inline-flex;
      padding:6px 10px;border-radius:999px;
      font-size:12px;font-weight:900;
      color:var(--brand);
      background:var(--brandSoft);
    }
    .hero-title{margin:10px 0 10px;font-size:24px;line-height:1.25;}
    .hero-copy{margin:0;color:var(--muted);font-size:13px;line-height:1.85;max-width:880px;}

    .grid-2,.grid-3,.grid-4,.grid-6{display:grid;gap:14px;margin-top:14px;}
    .grid-2{grid-template-columns:repeat(2,minmax(0,1fr));}
    .grid-3{grid-template-columns:repeat(3,minmax(0,1fr));}
    .grid-4{grid-template-columns:repeat(4,minmax(0,1fr));}
    .grid-6{grid-template-columns:repeat(6,minmax(0,1fr));}

    .card{
      background:linear-gradient(180deg, #ffffff, #f7f9ff);
      border:1px solid rgba(15,23,42,.08);
      border-radius:16px;
      box-shadow:0 10px 24px rgba(15,23,42,.06);
      padding:16px;
    }
    .card h3{margin:0 0 10px;font-size:16px;}
    .muted{color:var(--muted);font-size:13px;line-height:1.75;margin:0;}

    .pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:7px 10px;border-radius:999px;
      font-size:12px;font-weight:900;
      border:1px solid transparent;
      background:#f5f7ff;
    }
    .pill.blue{color:var(--brand);background:var(--brandSoft);border-color:rgba(26,86,219,.16);}
    .pill.green{color:var(--success);background:var(--successSoft);border-color:rgba(5,150,105,.18);}
    .pill.orange{color:var(--warning);background:var(--warningSoft);border-color:rgba(217,119,6,.18);}
    .pill.red{color:var(--danger);background:var(--dangerSoft);border-color:rgba(220,38,38,.18);}

    .stage-card{
      padding:14px;
      border-radius:16px;
      border:1px solid rgba(15,23,42,.08);
      background:linear-gradient(180deg, #ffffff, #f7f9ff);
      box-shadow:0 10px 24px rgba(15,23,42,.06);
      transition:.18s ease;
      position:relative;overflow:hidden;
    }
    .stage-card:hover{transform:translateY(-2px);border-color:rgba(26,86,219,.24);}
    .stage-head{
      display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;
      font-weight:900;font-size:13px;
    }
    .stage-score{font-size:22px;font-weight:900;margin:8px 0 6px;}
    .progress{
      height:8px;border-radius:999px;background:rgba(15,23,42,.06);overflow:hidden;margin-top:10px;
    }
    .progress span{
      display:block;height:100%;
      background:linear-gradient(90deg, var(--brand), var(--success));
      border-radius:inherit;
    }

    .table-wrap{
      overflow-x:auto;
      border:1px solid rgba(15,23,42,.08);
      border-radius:14px;
      background:#fff;
    }
    table{width:100%;border-collapse:collapse;min-width:640px;font-size:13px;}
    th,td{padding:12px 14px;text-align:left;border-bottom:1px solid rgba(15,23,42,.08);vertical-align:top;}
    th{
      background:linear-gradient(180deg, #f7f9ff, #ffffff);
      color:#0b1b3a;
      font-weight:900;
      font-size:12px;
    }
    tr:last-child td{border-bottom:0;}
    tr.clickable{cursor:pointer;}
    tr.clickable:hover{background:rgba(26,86,219,.05);}

    .tag{
      display:inline-flex;align-items:center;gap:6px;
      padding:6px 10px;border-radius:999px;
      font-size:12px;font-weight:900;
      white-space:nowrap;
      border:1px solid transparent;
    }
    .tag.success{color:var(--success);background:var(--successSoft);border-color:rgba(5,150,105,.18);}
    .tag.warning{color:var(--warning);background:var(--warningSoft);border-color:rgba(217,119,6,.18);}
    .tag.danger{color:var(--danger);background:var(--dangerSoft);border-color:rgba(220,38,38,.18);}
    .tag.neutral{color:#334155;background:rgba(15,23,42,.06);border-color:rgba(15,23,42,.08);}

    .checkpoint{
      margin-top:14px;
      padding:14px;
      border-radius:14px;
      border:1px solid rgba(217,119,6,.22);
      background:linear-gradient(180deg, rgba(217,119,6,.10), rgba(255,255,255,.90));
    }
    .checkpoint strong{display:inline-flex;margin-bottom:8px;font-size:13px;color:#8a4b00;}
    .checkpoint p{margin:0;color:#6b4a1f;font-size:13px;line-height:1.8;}

    .chart-wrap{
      padding:12px;border-radius:14px;
      background:linear-gradient(180deg, #ffffff, #f7f9ff);
      border:1px solid rgba(15,23,42,.08);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
    }
    canvas{width:100%;display:block;}
    .chart-caption{margin-top:8px;color:var(--muted);font-size:12px;}

    .accordion{
      border:1px solid rgba(15,23,42,.08);
      border-radius:14px;
      background:linear-gradient(180deg, #ffffff, #f7f9ff);
      overflow:hidden;
      margin-bottom:10px;
    }
    .accordion-btn{
      width:100%;
      background:transparent;
      padding:14px 14px;
      display:flex;justify-content:space-between;align-items:center;gap:12px;
      font-weight:900;font-size:13px;color:var(--text);
    }
    .accordion-btn:hover{background:rgba(26,86,219,.05);}
    .accordion-content{display:none;padding:0 14px 14px;color:var(--muted);font-size:13px;line-height:1.85;}
    .accordion.open .accordion-content{display:block;}

    .actions{
      display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
      margin-top:14px;
    }
    .actions .left,.actions .right{display:flex;gap:10px;flex-wrap:wrap;}

    .modal-backdrop{
      position:fixed;inset:0;
      background:rgba(15,23,42,.50);
      backdrop-filter: blur(8px);
      display:none;align-items:center;justify-content:center;
      padding:18px;
      z-index:999;
    }
    .modal-backdrop.open{display:flex;}
    .modal{
      width:min(760px,100%);
      max-height:88vh;overflow:auto;
      border-radius:18px;
      background:#fff;
      border:1px solid rgba(15,23,42,.10);
      box-shadow:0 24px 70px rgba(15,23,42,.22);
    }
    .modal-head,.modal-body,.modal-foot{padding:16px 18px;}
    .modal-head{
      display:flex;justify-content:space-between;gap:12px;align-items:flex-start;
      border-bottom:1px solid rgba(15,23,42,.08);
      background:linear-gradient(180deg, #ffffff, #f7f9ff);
    }
    .modal-head h3{margin:0 0 6px;font-size:16px;}
    .modal-head p{margin:0;color:var(--muted);font-size:13px;line-height:1.7;}
    .modal-foot{
      display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;
      border-top:1px solid rgba(15,23,42,.08);
      background:linear-gradient(180deg, #f7f9ff, #ffffff);
    }
    .close{
      width:34px;height:34px;border-radius:12px;
      background:rgba(15,23,42,.06);color:var(--text);
      font-size:18px;font-weight:900;
    }

    .field{margin-bottom:12px;}
    .field label{display:block;margin-bottom:8px;font-size:12px;font-weight:900;color:#0b1b3a;}
    .input,.select,.textarea{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid rgba(15,23,42,.10);
      background:#fff;
      outline:none;
    }
    .input:focus,.select:focus,.textarea:focus{
      border-color:rgba(26,86,219,.35);
      box-shadow:0 0 0 4px rgba(26,86,219,.12);
    }
    .textarea{min-height:96px;resize:vertical;}

    .notice{
      margin-top:10px;
      padding:10px 12px;
      border-radius:12px;
      background:rgba(26,86,219,.06);
      border:1px solid rgba(26,86,219,.12);
      color:#27467f;
      font-size:12px;
      line-height:1.7;
    }

    .footer-note{
      margin-top:14px;
      text-align:center;
      color:var(--muted);
      font-size:12px;
    }

    @media (max-width:1080px){
      .app{grid-template-columns:1fr;}
      .sidebar{position:static;}
      .grid-2,.grid-3,.grid-4,.grid-6{grid-template-columns:1fr;}
      .topbar{flex-direction:column;align-items:flex-start;}
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-badge">合</div>
        <div>
          <h1>合规哨兵</h1>
          <p>中小企业 AI 内控与税务风险自查助手<br/>浅色主题 · 离线单HTML</p>
        </div>
      </div>

      <div class="nav" id="nav"></div>

      <div class="sidebar-card">
        <h3>演示案例</h3>
        <p>豫中机械设备有限公司</p>
        <ul>
          <li>行业：制造业</li>
          <li>营收：约2800万</li>
          <li>员工：85人</li>
          <li>纳税人：一般纳税人</li>
        </ul>
      </div>

      <div class="sidebar-card">
        <h3>提示</h3>
        <ul>
          <li>完成六个步骤后，体检报告自动解锁</li>
          <li>任意表格可点击行查看详情或指派整改</li>
          <li>所有数据集中在 JS 常量，方便替换</li>
        </ul>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="topbar-left">
          <h2 id="pageTitle">企业概览</h2>
          <p id="pageSubtitle">浅色主题：更适合在白底屏幕/投影/路演场景展示。</p>
        </div>
        <div class="top-actions">
          <button class="btn btn-secondary" id="resetBtn">重新体检</button>
          <button class="btn btn-primary" id="downloadBtn">下载报告</button>
        </div>
      </div>

      <section class="page">
        <div class="page-inner">
          <div id="root"></div>
          <p class="footer-note">本工具仅用于企业合规自查演示，不构成正式税务或法律意见。</p>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <div>
          <h3 id="modalTitle">详情</h3>
          <p id="modalSubtitle">查看当前项目的详细说明。</p>
        </div>
        <button class="close" id="closeModalBtn" aria-label="关闭">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>

  <script>
    // =========================
    // Mock 数据模型（集中定义）
    // =========================
    const COMPANY = {
      name: '豫中机械设备有限公司',
      industry: '制造业',
      regCapital: '1000万',
      employees: 85,
      taxpayerType: '一般纳税人',
      annualRevenue: '约2800万',
      regDate: '2024-03-01',
      taxRegDate: '2024-03-15',
      hasRD: true,
      patentCount: 2,
      annualRevenueGrowth: 0.18
    };

    const STAGE_SCORES = {
      registration: 80,
      invoice: 45,
      declaration: 65,
      benefit: 90,
      warning: 40,
      planning: 60
    };

    const APP_DATA = {
      overview: { taxScore: 62, internalScore: 58, riskLabel: '中等', riskLevel: 'warning' },
      registration: {
        registrationStatus: '已登记',
        taxTypes: ['增值税', '企业所得税', '城建税', '教育费附加', '印花税'],
        checks: [
          { status: 'success', icon: '✅', item: '纳税人类型选择', result: '合理', note: '按2800万年营收，一般纳税人身份判断正确。' },
          { status: 'success', icon: '✅', item: '税种认定完整性', result: '完整', note: '主要税种均已认定，满足当前业务形态。' },
          { status: 'warning', icon: '⚠️', item: '小规模转一般纳税人生效时间', result: '已超500万，无风险', note: '系统已对年营收规模进行交叉验证。' },
          { status: 'success', icon: '✅', item: '行业与税目匹配', result: '匹配', note: '制造业场景与当前税目设置相符。' }
        ],
        checkpoint: '企业注册时工商信息与税务登记信息一致性需确认。建议每年复核一次纳税人类型。'
      },
      invoice: {
        kpis: [
          { label: '进项发票', value: '186份', extra: '842万', level: 'neutral' },
          { label: '销项发票', value: '243份', extra: '1560万', level: 'neutral' },
          { label: '异常发票', value: '3份', extra: '需核查', level: 'danger' },
          { label: '三单匹配率', value: '78%', extra: '标准≥95%', level: 'warning' }
        ],
        anomalies: [
          { id: 'inv-1', level: 'danger', icon: '🔴', issue: '发票金额＞采购订单', amount: '23,500元', action: '补充说明或退货', detail: '采购订单金额为198,000元，入账发票金额为221,500元，需核实是否追加采购或含税口径错误。' },
          { id: 'inv-2', level: 'danger', icon: '🔴', issue: '无采购订单直接入库', amount: '18,200元', action: '补录入库手续', detail: '存在零星辅料采购直接入库，缺少采购申请与审批单，需补录并追溯责任环节。' },
          { id: 'inv-3', level: 'warning', icon: '🟡', issue: '发票日期＞入库30天', amount: '45,000元', action: '确认是否跨期', detail: '该批设备零件于4月入库，发票于6月开具，需核查是否形成跨期确认及抵扣时点风险。' }
        ],
        trend: { months: ['1月','2月','3月','4月','5月','6月'], input: [118,126,133,142,151,172], output: [188,205,236,248,318,365] },
        checkpoint: '三单匹配率78%，低于95%标准线。建议建立采购单→入库单→发票的强制三单匹配流程。'
      },
      declaration: {
        taxBurden: { company: 2.8, industry: 3.2, deviation: -12.5, trend: [2.6, 2.8, 2.8] },
        checklist: [
          { id: 'dec-1', done: true, label: '增值税销项税额复核', detail: '已完成销项汇总与税控开票系统对账。' },

      const cls = level==='success'?'success':level==='warning'?'warning':level==='danger'?'danger':'neutral';
      return `<span class="tag ${cls}">${safeText(text)}</span>`;
    }
    function pill(level, text){
      const cls = level==='success'?'green':level==='warning'?'orange':level==='danger'?'red':'blue';
      return `<span class="pill ${cls}">${text}</span>`;
    }
    function stageMeta(score){
      if(score>=85) return {lvl:'success', label:'🟢 优势项'};
      if(score>=60) return {lvl:'warning', label:'🟡 可优化'};
      return {lvl:'danger', label:'🔴 高风险'};
    }

    function setPage(id){
      if(id==='report' && !allDone()){

          title:'体检报告未解锁',

        });
        return;
      }
      state.current = id;
      render();
    }

    function markComplete(id){
      if(state.completed[id]!==undefined){
        state.completed[id] = true;
        render();
      }
    }

    function resetAll(){
      Object.keys(state.completed).forEach(k=>state.completed[k]=false);
      state.current='overview';
      state.openChecklist.clear();
      state.openPlans.clear();
      state.warningAssignments = {};
      render();
    }

    function nextOf(id){
      const order=['registration','invoice','declaration','benefit','warning','planning','report'];
      const idx=order.indexOf(id);
      return order[idx+1] || 'report';
    }
    function prevOf(id){
      const order=['overview','registration','invoice','declaration','benefit','warning','planning','report'];
      const idx=order.indexOf(id);
      return order[Math.max(0, idx-1)] || 'overview';
    }

      modalBackdrop.classList.add('open');
      state.modalOpen = true;
      const closeOnly = document.getElementById('modalCloseOnly');
      if(closeOnly) closeOnly.addEventListener('click', closeModal);
    }
    function closeModal(){
      modalBackdrop.classList.remove('open');
      state.modalOpen = false;
    }

    // =========================
    // 图表：Canvas（轻量绘制）
    // =========================
    function roundRect(ctx,x,y,w,h,r){
      const rr = Math.min(r, w/2, h/2);
      ctx.beginPath();
      ctx.moveTo(x+rr, y);
      ctx.arcTo(x+w, y, x+w, y+h, rr);
      ctx.arcTo(x+w, y+h, x, y+h, rr);
      ctx.arcTo(x, y+h, x, y, rr);
      ctx.arcTo(x, y, x+w, y, rr);
      ctx.closePath();
    }

    function drawInvoiceTrend(){
      const canvas = document.getElementById('invoiceTrend');
      if(!canvas) return;
      const ctx = canvas.getContext('2d');
      const {months, input, output} = APP_DATA.invoice.trend;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const pad={l:46,r:18,t:18,b:42};
      const W=canvas.width-pad.l-pad.r;
      const H=canvas.height-pad.t-pad.b;
      const max=Math.max(...input,...output)*1.12;

      // grid
      ctx.strokeStyle='rgba(15,23,42,.10)';
      for(let i=0;i<=4;i++){
        const y=pad.t + H/4*i;
        ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(pad.l+W,y); ctx.stroke();
      }

      const blue='#1a56db';
      const green='#059669';
      const gBlue = ctx.createLinearGradient(0,pad.t,0,pad.t+H);
      gBlue.addColorStop(0,'rgba(26,86,219,.95)'); gBlue.addColorStop(1,'rgba(26,86,219,.22)');
      const gGreen = ctx.createLinearGradient(0,pad.t,0,pad.t+H);
      gGreen.addColorStop(0,'rgba(5,150,105,.95)'); gGreen.addColorStop(1,'rgba(5,150,105,.22)');

      months.forEach((m,i)=>{
        const baseX = pad.l + i*(W/months.length) + 14;
        const inH = input[i]/max*H;
        const outH = output[i]/max*H;

        ctx.save();
        ctx.shadowColor='rgba(26,86,219,.18)'; ctx.shadowBlur=12;
        ctx.fillStyle=gBlue;
        roundRect(ctx, baseX, pad.t+H-inH, 14, inH, 6); ctx.fill();
        ctx.shadowColor='rgba(5,150,105,.18)';
        ctx.fillStyle=gGreen;
        roundRect(ctx, baseX+16, pad.t+H-outH, 14, outH, 6); ctx.fill();
        ctx.restore();

        ctx.fillStyle='rgba(81,96,122,.95)';
        ctx.font='12px Segoe UI';
        ctx.fillText(m, baseX-4, canvas.height-16);
      });

      // legend
      ctx.fillStyle=blue; ctx.fillRect(canvas.width-128, 10, 14, 8);
      ctx.fillStyle=green; ctx.fillRect(canvas.width-66, 10, 14, 8);
      ctx.fillStyle='rgba(15,23,42,.72)';
      ctx.font='12px Segoe UI';
      ctx.fillText('进项', canvas.width-110, 18);
      ctx.fillText('销项', canvas.width-48, 18);
    }

    function drawTaxGauge(){
      const canvas = document.getElementById('taxGauge');
      if(!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const cx=canvas.width/2, cy=canvas.height-24, r=110;

      ctx.lineWidth=18;
      ctx.strokeStyle='rgba(15,23,42,.10)';
      ctx.beginPath(); ctx.arc(cx,cy,r,Math.PI,0); ctx.stroke();

      const pct = Math.min(APP_DATA.declaration.taxBurden.company/5, 1);
      const end = Math.PI + Math.PI*pct;
      const grad = ctx.createLinearGradient(cx-r,0,cx+r,0);
      grad.addColorStop(0,'#f59e0b'); grad.addColorStop(.65,'#fb923c'); grad.addColorStop(1,'#dc2626');
      ctx.strokeStyle=grad;
      ctx.shadowColor='rgba(251,146,60,.22)'; ctx.shadowBlur=16;
      ctx.beginPath(); ctx.arc(cx,cy,r,Math.PI,end); ctx.stroke();
      ctx.shadowBlur=0;

      ctx.fillStyle='rgba(255,255,255,.78)';
      ctx.beginPath(); ctx.arc(cx,cy,62,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(15,23,42,.08)'; ctx.stroke();

      ctx.textAlign='center';
      ctx.fillStyle='rgba(15,23,42,.92)';
      ctx.font='900 30px Segoe UI';
      ctx.fillText(APP_DATA.declaration.taxBurden.company+'%', cx, cy-28);
      ctx.fillStyle='rgba(81,96,122,.95)';
      ctx.font='13px Segoe UI';
      ctx.fillText('行业均值 '+APP_DATA.declaration.taxBurden.industry+'%', cx, cy-2);
      ctx.fillText('偏离度 '+APP_DATA.declaration.taxBurden.deviation+'%', cx, cy+22);
      ctx.fillStyle='rgba(15,23,42,.70)';
      ctx.font='12px Segoe UI';
      ctx.fillText('申报风险仪表盘', cx, 24);
    }

    function drawPlanningBar(){
      const canvas = document.getElementById('planningBar');
      if(!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const data = APP_DATA.planning.structure;
      const pad={l:46,r:18,t:18,b:42};
      const W=canvas.width-pad.l-pad.r;
      const H=canvas.height-pad.t-pad.b;
      const max=Math.max(...data.map(x=>x.value))*1.2;

      ctx.strokeStyle='rgba(15,23,42,.10)';
      for(let i=0;i<=4;i++){
        const y=pad.t+H/4*i;
        ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(pad.l+W,y); ctx.stroke();
      }

      const gap=W/data.length;
      data.forEach((it,i)=>{
        const x=pad.l + i*gap + gap*.2;
        const w=gap*.52;
        const h=it.value/max*H;
        const grad=ctx.createLinearGradient(0,pad.t+H-h,0,pad.t+H);
        grad.addColorStop(0,it.color);
        grad.addColorStop(1,'rgba(255,255,255,.20)');
        ctx.save();
        ctx.shadowColor='rgba(15,23,42,.12)'; ctx.shadowBlur=12;
        ctx.fillStyle=grad;
        roundRect(ctx, x, pad.t+H-h, w, h, 8); ctx.fill();
        ctx.restore();

        ctx.fillStyle='rgba(81,96,122,.95)';
        ctx.font='12px Segoe UI';
        ctx.textAlign='center';
        ctx.fillText(it.label, x+w/2, canvas.height-16);
        ctx.fillStyle='rgba(15,23,42,.78)';
        ctx.fillText(it.value+'%', x+w/2, pad.t+H-h-8);
      });
    }

    function drawRadar(){
      const canvas = document.getElementById('radar');
      if(!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const cx=canvas.width/2, cy=canvas.height/2+10, R=112;
      const axes=[
        {label:'登记',value:STAGE_SCORES.registration},
        {label:'发票',value:STAGE_SCORES.invoice},
        {label:'申报',value:STAGE_SCORES.declaration},
        {label:'优惠',value:STAGE_SCORES.benefit},
        {label:'预警',value:STAGE_SCORES.warning},
        {label:'筹划',value:STAGE_SCORES.planning}
      ];

      ctx.strokeStyle='rgba(15,23,42,.10)';
      for(let level=1;level<=5;level++){
        ctx.beginPath();
        axes.forEach((a,i)=>{
          const ang=-Math.PI/2 + i*Math.PI*2/axes.length;
          const r=R*(level/5);
          const x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r;
          if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        });
        ctx.closePath(); ctx.stroke();
      }

      axes.forEach((a,i)=>{
        const ang=-Math.PI/2 + i*Math.PI*2/axes.length;
        const x=cx+Math.cos(ang)*R, y=cy+Math.sin(ang)*R;
        ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y); ctx.stroke();
        ctx.fillStyle='rgba(81,96,122,.95)';
        ctx.font='12px Segoe UI';
        ctx.fillText(a.label + a.value, cx+Math.cos(ang)*(R+22)-18, cy+Math.sin(ang)*(R+22)+4);
      });

      const rg = ctx.createRadialGradient(cx,cy,8,cx,cy,R);
      rg.addColorStop(0,'rgba(5,150,105,.26)');
      rg.addColorStop(.55,'rgba(26,86,219,.18)');
      rg.addColorStop(1,'rgba(26,86,219,.08)');

      ctx.beginPath();
      axes.forEach((a,i)=>{
        const ang=-Math.PI/2 + i*Math.PI*2/axes.length;
        const r=R*(a.value/100);
        const x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.closePath();
      ctx.fillStyle=rg;
      ctx.strokeStyle='rgba(26,86,219,.75)';
      ctx.lineWidth=2;
      ctx.fill(); ctx.stroke();

      axes.forEach((a,i)=>{
        const ang=-Math.PI/2 + i*Math.PI*2/axes.length;
        const r=R*(a.value/100);
        const x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r;
        ctx.beginPath(); ctx.arc(x,y,4.2,0,Math.PI*2);
        ctx.fillStyle='#1a56db'; ctx.fill();
        ctx.strokeStyle='#ffffff'; ctx.lineWidth=2; ctx.stroke();
      });
    }

    function drawCharts(){
      drawInvoiceTrend();
      drawTaxGauge();
      drawPlanningBar();
      drawRadar();
    }

    // =========================
    // 下载报告
    // =========================
    function generateReportText(){
      const top3 = top3Merged();
      return [
        '# 合规哨兵 Demo 体检报告（浅色版生成）',
        '',
        '企业：' + COMPANY.name,
        '综合评分：' + computeOverallScore() + '分',
        '税务评分：' + APP_DATA.overview.taxScore + '分',
        '内控评分：' + APP_DATA.overview.internalScore + '分',
        '风险等级：' + APP_DATA.overview.riskLabel,
        '',
        '## 六段评分',
        '- 税务登记：' + STAGE_SCORES.registration,
        '- 发票管理：' + STAGE_SCORES.invoice,
        '- 申报合规：' + STAGE_SCORES.declaration,
        '- 优惠适配：' + STAGE_SCORES.benefit,
        '- 风险预警：' + STAGE_SCORES.warning,
        '- 筹划优化：' + STAGE_SCORES.planning,
        '',
        '## 紧急事项',
        ...APP_DATA.report.urgent.map(x=>'- '+x),
        '',
        '## 重要事项',
        ...APP_DATA.report.important.map(x=>'- '+x),
        '',
        '## 建议事项',
        ...APP_DATA.report.advised.map(x=>'- '+x),
        '',
        '## 可量化收益',
        ...APP_DATA.report.quantified.map(x=>'- '+x),
        '',
        '## 当前整改责任（TOP3）',
        ...top3.map(x=>'- TOP'+x.rank+'：'+x.title+' / '+x.dept+' / '+x.owner+' / '+x.deadline+' / '+x.status),
        '',
        '说明：本报告为离线 Demo 自动生成，仅用于初赛演示。'
      ].join('\\n');
    }

    function downloadReport(){
      if(!allDone()){
        openModal({
          title:'报告还不能下载',
          subtitle:'请先完成六个步骤，再下载最终体检报告。',
          body:`<div class="notice">完成后“体检报告”页会解锁，顶部“下载报告”按钮也会自动可用。</div>`
        });
        return;
      }
      const blob = new Blob([generateReportText()], {type:'text/markdown;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '合规哨兵_体检报告_浅色版.md';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // 顶部按钮
    elReset.addEventListener('click', resetAll);
    elDownload.addEventListener('click', downloadReport);

    // 报告页按钮绑定（渲染后）
    function bindReportButtons(){
      const r1=document.getElementById('reportReset');
      if(r1) r1.addEventListener('click', resetAll);
      const r2=document.getElementById('reportDownload');
      if(r2) r2.addEventListener('click', downloadReport);
    }

    // 重新渲染后补绑定
    const _render = render;
    render = function(){
      _render();
      bindReportButtons();
    };

    // 初始化
    render();
  </script>
