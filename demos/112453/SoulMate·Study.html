<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>星友 · 中学生成长搭子</title>
    <style>
        /* ===== 全局重置 & 暗色主题 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0d0d0f;
            --bg-card: rgba(255, 255, 255, 0.06);
            --bg-card-hover: rgba(255, 255, 255, 0.10);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-primary: #f0f0f5;
            --text-secondary: rgba(255, 255, 255, 0.55);
            --text-muted: rgba(255, 255, 255, 0.30);
            --accent: #7c6cf0;
            --accent-glow: rgba(124, 108, 240, 0.30);
            --accent-dim: rgba(124, 108, 240, 0.12);
            --green: #4ade80;
            --red: #f87171;
            --orange: #fb923c;
            --radius: 20px;
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.60);
            --font: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background-image: radial-gradient(ellipse at 30% 20%, #1a1730 0%, #0d0d0f 70%);
        }

        .app-container {
            max-width: 420px;
            width: 100%;
            background: var(--bg-card);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            padding: 20px 18px 0;
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
            min-height: 560px;
        }

        .app-container::before {
            content: '';
            position: absolute;
            top: -40%;
            right: -30%;
            width: 200px;
            height: 200px;
            background: var(--accent-glow);
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }

        /* ===== 顶部 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .logo-text {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        .logo-text span {
            color: var(--accent);
        }

        .xp-badge {
            background: var(--accent-dim);
            border: 1px solid rgba(124, 108, 240, 0.20);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: default;
        }
        .xp-badge strong {
            color: var(--accent);
            font-weight: 700;
        }

        /* ===== 页面容器 ===== */
        .page {
            display: none;
            position: relative;
            z-index: 1;
            padding-bottom: 12px;
        }
        .page.active {
            display: block;
        }

        /* ============================================================
                   页面1: 自习室
                   ============================================================ */
        .timer-section {
            text-align: center;
            padding: 6px 0 10px;
        }

        .timer-ring-wrapper {
            position: relative;
            width: 210px;
            height: 210px;
            margin: 0 auto 12px;
        }

        .timer-ring-wrapper svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .timer-ring-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.06);
            stroke-width: 6;
        }

        .timer-ring-progress {
            fill: none;
            stroke: var(--accent);
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 565.48;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.3s ease, stroke 0.5s ease;
        }
        .timer-ring-progress.warning {
            stroke: var(--orange);
        }
        .timer-ring-progress.danger {
            stroke: var(--red);
        }
        .timer-ring-progress.complete {
            stroke: var(--green);
        }
        .timer-ring-wrapper.running .timer-ring-progress {
            animation: pulseGlow 2s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%,
            100% {
                filter: drop-shadow(0 0 20px var(--accent-glow));
            }
            50% {
                filter: drop-shadow(0 0 40px var(--accent-glow));
            }
        }

        .timer-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .timer-display .time {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }
        .timer-display .mode-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            background: var(--bg-card);
            padding: 2px 14px;
            border-radius: 30px;
            border: 1px solid var(--border-glass);
            margin-top: 4px;
        }

        .mode-selector {
            display: flex;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 4px;
            margin: 4px auto 14px;
            max-width: 260px;
        }
        .mode-btn {
            flex: 1;
            padding: 8px 0;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: var(--font);
        }
        .mode-btn.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .mode-btn:hover:not(.active) {
            color: var(--text-primary);
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 14px 0 10px;
        }
        .ctrl-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font);
            flex: 1;
            max-width: 130px;
        }
        .ctrl-btn.primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .ctrl-btn.primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px var(--accent-glow);
        }
        .ctrl-btn.primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .ctrl-btn.secondary {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            border: 1px solid var(--border-glass);
        }
        .ctrl-btn.secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.10);
            color: var(--text-primary);
        }
        .ctrl-btn.secondary:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .ctrl-btn.danger {
            background: rgba(248, 113, 113, 0.12);
            color: var(--red);
            border: 1px solid rgba(248, 113, 113, 0.15);
        }
        .ctrl-btn.danger:hover {
            background: rgba(248, 113, 113, 0.20);
        }

        /* ---- 底部统计 ---- */
        .stats-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid var(--border-glass);
            font-size: 12px;
            color: var(--text-muted);
        }
        .stats-footer span strong {
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* ============================================================
                   页面2: 情绪归因日记
                   ============================================================ */
        .diary-header {
            margin-bottom: 16px;
        }
        .diary-header h2 {
            font-size: 20px;
            font-weight: 700;
        }
        .diary-header p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 2px;
        }

        .emotion-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .emotion-btn {
            padding: 12px 6px;
            border: 2px solid var(--border-glass);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-secondary);
            font-size: 26px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            font-family: var(--font);
        }
        .emotion-btn .emotion-label {
            display: block;
            font-size: 12px;
            margin-top: 4px;
            font-weight: 500;
        }
        .emotion-btn.active {
            border-color: var(--accent);
            background: var(--accent-dim);
            color: var(--text-primary);
            box-shadow: 0 0 24px var(--accent-glow);
        }
        .emotion-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .tag-section {
            margin-bottom: 14px;
        }
        .tag-section .section-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 10px;
            display: block;
        }
        .tag-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tag-btn {
            padding: 6px 16px;
            border: 1px solid var(--border-glass);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font);
        }
        .tag-btn.active {
            background: var(--accent-dim);
            border-color: var(--accent);
            color: var(--text-primary);
        }
        .tag-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.04);
        }

        .diary-input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid var(--border-glass);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            font-size: 14px;
            font-family: var(--font);
            resize: vertical;
            min-height: 60px;
            transition: border-color 0.2s;
        }
        .diary-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .diary-input::placeholder {
            color: var(--text-muted);
        }
        .char-count {
            text-align: right;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .diary-submit-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 14px;
            background: var(--accent);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font);
            margin-top: 14px;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .diary-submit-btn:hover {
            transform: translateY(-2px);
        }
        .diary-submit-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .dashboard-section {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid var(--border-glass);
        }
        .dashboard-section h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }
        .dashboard-chart {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            height: 100px;
            padding: 4px 0;
        }
        .chart-bar-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .chart-bar {
            width: 100%;
            max-width: 32px;
            border-radius: 6px 6px 0 0;
            background: var(--accent);
            min-height: 4px;
            transition: height 0.5s ease;
            position: relative;
        }
        .chart-bar .bar-value {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .chart-label {
            font-size: 10px;
            color: var(--text-muted);
            text-align: center;
        }

        .no-data-msg {
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
            padding: 20px 0;
        }

        /* ===== Tab 导航 ===== */
        .tab-bar {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 4px;
            margin-top: 4px;
            position: relative;
            z-index: 1;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: var(--font);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .tab-btn.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .tab-btn:hover:not(.active) {
            color: var(--text-primary);
        }

        /* ===== 弹窗 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.70);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 999;
            animation: fadeIn 0.3s ease;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-box {
            background: #1a1a24;
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            padding: 28px 24px;
            max-width: 340px;
            width: 100%;
            text-align: center;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.80);
            animation: slideUp 0.35s ease;
        }
        .modal-box .modal-icon {
            font-size: 44px;
            margin-bottom: 10px;
        }
        .modal-box h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .modal-box p {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
            margin: 6px 0 16px;
        }
        .modal-box .xp-gain {
            background: var(--accent-dim);
            border-radius: 12px;
            padding: 10px;
            margin: 10px 0 18px;
            font-size: 26px;
            font-weight: 700;
            color: var(--accent);
        }
        .modal-box .xp-gain small {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-secondary);
        }
        .modal-btn {
            padding: 10px 36px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: var(--font);
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 20px var(--accent-glow);
            transition: all 0.2s ease;
        }
        .modal-btn:hover {
            transform: translateY(-2px);
        }
        .modal-btn.danger-btn {
            background: var(--red);
            box-shadow: 0 4px 20px rgba(248, 113, 113, 0.25);
        }
        .modal-btn.secondary-btn {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            box-shadow: none;
            margin-right: 8px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 440px) {
            .app-container {
                padding: 16px 14px 0;
            }
            .timer-ring-wrapper {
                width: 180px;
                height: 180px;
            }
            .timer-display .time {
                font-size: 38px;
            }
            .ctrl-btn {
                padding: 10px 16px;
                font-size: 13px;
                max-width: 110px;
            }
            .emotion-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .modal-box {
                padding: 20px 16px;
            }
            .tab-btn {
                font-size: 12px;
                padding: 8px 0;
            }
            .tab-btn span {
                display: none;
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ===== 主应用 ===== -->
    <div class="app-container" id="app">

        <!-- 顶部 -->
        <div class="header">
            <div class="logo-area">
                <div class="logo-icon">✦</div>
                <div class="logo-text">星<span>友</span></div>
            </div>
            <div class="xp-badge">
                ⚡ <strong id="xpDisplay">0</strong> XP
            </div>
        </div>

        <!-- ========== 页面1: 自习室 ========== -->
        <div class="page active" id="pageStudy">

            <div class="timer-section">
                <div class="timer-ring-wrapper" id="ringWrapper">
                    <svg viewBox="0 0 190 190">
                        <circle class="timer-ring-bg" cx="95" cy="95" r="90" />
                        <circle class="timer-ring-progress" id="ringProgress" cx="95" cy="95" r="90"
                        stroke-dasharray="565.48" stroke-dashoffset="0" />
                    </svg>
                    <div class="timer-display">
                        <div class="time" id="timeDisplay">25:00</div>
                        <div class="mode-badge" id="modeBadge">🍅 番茄钟</div>
                    </div>
                </div>
            </div>

            <div class="mode-selector">
                <button class="mode-btn active" data-mode="pomodoro" id="modePomodoro">🍅 番茄钟</button>
                <button class="mode-btn" data-mode="deep" id="modeDeep">🧠 深度专注</button>
            </div>

            <div class="controls">
                <button class="ctrl-btn primary" id="btnStart">开始专注</button>
                <button class="ctrl-btn secondary" id="btnPause" disabled>暂停</button>
                <button class="ctrl-btn danger" id="btnAbandon">放弃</button>
            </div>

            <div class="stats-footer">
                <span>📊 今日专注 <strong id="todayMinutes">0</strong> 分钟</span>
                <span>🔥 连续 <strong id="streakDays">0</strong> 天</span>
            </div>
        </div>

        <!-- ========== 页面2: 情绪归因日记 ========== -->
        <div class="page" id="pageDiary">

            <div class="diary-header">
                <h2>📝 今日心情</h2>
                <p>选一个情绪，告诉星友发生了什么</p>
            </div>

            <div class="emotion-grid" id="emotionGrid">
                <button class="emotion-btn" data-emotion="开心">
                    😊 <span class="emotion-label">开心</span>
                </button>
                <button class="emotion-btn" data-emotion="平静">
                    😌 <span class="emotion-label">平静</span>
                </button>
                <button class="emotion-btn" data-emotion="焦虑">
                    😰 <span class="emotion-label">焦虑</span>
                </button>
                <button class="emotion-btn" data-emotion="烦躁">
                    😤 <span class="emotion-label">烦躁</span>
                </button>
                <button class="emotion-btn" data-emotion="疲惫">
                    😴 <span class="emotion-label">疲惫</span>
                </button>
                <button class="emotion-btn" data-emotion="迷茫">
                    😶 <span class="emotion-label">迷茫</span>
                </button>
            </div>

            <div class="tag-section">
                <span class="section-label">🏷️ 主要原因是？（可多选）</span>
                <div class="tag-grid" id="tagGrid">
                    <button class="tag-btn" data-tag="学业">📚 学业</button>
                    <button class="tag-btn" data-tag="人际">👥 人际</button>
                    <button class="tag-btn" data-tag="家庭">🏠 家庭</button>
                    <button class="tag-btn" data-tag="生理">😴 生理</button>
                    <button class="tag-btn" data-tag="未来">🔮 未来</button>
                </div>
            </div>

            <textarea class="diary-input" id="diaryText" placeholder="今天最想对自己说的一句话…（选填，50字内）" maxlength="50"></textarea>
            <div class="char-count"><span id="charCount">0</span>/50</div>

            <button class="diary-submit-btn" id="diarySubmit">✨ 记录今天</button>

            <div class="dashboard-section" id="dashboardSection">
                <h3>📊 本周情绪归因分布</h3>
                <div id="dashboardContent">
                    <div class="no-data-msg">还没有记录，写一篇日记吧 📝</div>
                </div>
            </div>
        </div>

        <!-- ===== Tab 导航 ===== -->
        <div class="tab-bar">
            <button class="tab-btn active" data-page="study">
                📖 <span>自习室</span>
            </button>
            <button class="tab-btn" data-page="diary">
                💭 <span>心情日记</span>
            </button>
        </div>
    </div>

    <!-- ===== 弹窗们 ===== -->
    <div class="modal-overlay" id="modalComplete">
        <div class="modal-box">
            <div class="modal-icon">🎉</div>
            <h2>太强了！</h2>
            <p id="completeMsg">你又干掉了一张试卷！</p>
            <div class="xp-gain">+<span id="xpGain">0</span> <small>XP</small></div>
            <button class="modal-btn" id="modalCompleteBtn">太棒了！继续</button>
        </div>
    </div>

    <div class="modal-overlay" id="modalAbandon">
        <div class="modal-box">
            <div class="modal-icon">😤</div>
            <h2>真的要放弃吗？</h2>
            <p>你已经坚持了 <strong id="abandonTime">0:00</strong>，再坚持一下就能拿到 XP 了！</p>
            <div class="modal-actions">
                <button class="modal-btn secondary-btn" id="modalAbandonCancel">我继续</button>
                <button class="modal-btn danger-btn" id="modalAbandonConfirm">确认放弃</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalDiarySuccess">
        <div class="modal-box">
            <div class="modal-icon">💜</div>
            <h2>已保存</h2>
            <p id="diarySuccessMsg">星友收到了你的心情，明天继续加油！</p>
            <div class="xp-gain">+<span id="diaryXpGain">5</span> <small>XP</small></div>
            <button class="modal-btn" id="modalDiaryBtn">好的</button>
        </div>
    </div>


    <script>
        // ============================================================
        //  星友 · 自习室 + 情绪归因日记（无白噪音）
        // ============================================================

        (function() {
            'use strict';

            // ============================================================
            //  1. DOM 引用
            // ============================================================
            const $ = id => document.getElementById(id);

            const xpDisplay = $('xpDisplay');

            // 自习室
            const timeDisplay = $('timeDisplay');
            const modeBadge = $('modeBadge');
            const ringProgress = $('ringProgress');
            const ringWrapper = $('ringWrapper');
            const btnStart = $('btnStart');
            const btnPause = $('btnPause');
            const btnAbandon = $('btnAbandon');
            const modePomodoro = $('modePomodoro');
            const modeDeep = $('modeDeep');
            const todayMinutes = $('todayMinutes');
            const streakDays = $('streakDays');

            // 日记
            const emotionBtns = document.querySelectorAll('.emotion-btn');
            const tagBtns = document.querySelectorAll('.tag-btn');
            const diaryText = $('diaryText');
            const charCount = $('charCount');
            const diarySubmit = $('diarySubmit');
            const dashboardContent = $('dashboardContent');

            // 弹窗
            const modalComplete = $('modalComplete');
            const modalAbandon = $('modalAbandon');
            const modalDiarySuccess = $('modalDiarySuccess');
            const xpGain = $('xpGain');
            const completeMsg = $('completeMsg');
            const abandonTime = $('abandonTime');
            const diaryXpGain = $('diaryXpGain');
            const diarySuccessMsg = $('diarySuccessMsg');

            // Tab
            const tabBtns = document.querySelectorAll('.tab-btn');
            const pages = {
                study: $('pageStudy'),
                diary: $('pageDiary'),
            };

            // ============================================================
            //  2. 数据状态
            // ============================================================
            const STATE = { IDLE: 'idle', RUNNING: 'running', PAUSED: 'paused' };

            const MODES = {
                pomodoro: { label: '🍅 番茄钟', work: 25 * 60 },
                deep: { label: '🧠 深度专注', work: 90 * 60 },
            };

            let currentMode = 'pomodoro';
            let currentState = STATE.IDLE;
            let timeLeft = MODES.pomodoro.work;
            let totalSeconds = MODES.pomodoro.work;
            let timerInterval = null;

            // 日记
            let selectedEmotion = null;
            let selectedTags = [];

            // ============================================================
            //  3. 数据持久化
            // ============================================================
            let stats = {
                totalXP: 0,
                todayMinutes: 0,
                streakDays: 0,
                lastDate: null,
                sessions: [],
                diaryEntries: [],
            };

            function getToday() { return new Date().toISOString().slice(0, 10); }

            function loadStats() {
                try {
                    const raw = localStorage.getItem('xingyou_stats_v2');
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        stats = parsed;
                        const today = getToday();
                        if (stats.lastDate !== today) {
                            stats.todayMinutes = 0;
                            stats.lastDate = today;
                            saveStats();
                        }
                        return;
                    }
                } catch (e) { /* ignore */ }
                stats = {
                    totalXP: 0,
                    todayMinutes: 0,
                    streakDays: 0,
                    lastDate: getToday(),
                    sessions: [],
                    diaryEntries: [],
                };
                saveStats();
            }

            function saveStats() {
                try {
                    localStorage.setItem('xingyou_stats_v2', JSON.stringify(stats));
                } catch (e) { /* ignore */ }
            }

            // ============================================================
            //  4. 自习室核心逻辑
            // ============================================================
            function startTimer() {
                if (currentState === STATE.RUNNING) return;
                if (currentState === STATE.IDLE) {
                    const mode = MODES[currentMode];
                    timeLeft = mode.work;
                    totalSeconds = mode.work;
                }
                currentState = STATE.RUNNING;
                ringWrapper.classList.add('running');
                timerInterval = setInterval(tick, 1000);
                updateControls();
                updateUI();
            }

            function pauseTimer() {
                if (currentState !== STATE.RUNNING) return;
                currentState = STATE.PAUSED;
                clearInterval(timerInterval);
                timerInterval = null;
                ringWrapper.classList.remove('running');
                updateControls();
                updateUI();
            }

            function resumeTimer() {
                if (currentState !== STATE.PAUSED) return;
                currentState = STATE.RUNNING;
                ringWrapper.classList.add('running');
                timerInterval = setInterval(tick, 1000);
                updateControls();
                updateUI();
            }

            function resetTimer() {
                clearInterval(timerInterval);
                timerInterval = null;
                currentState = STATE.IDLE;
                ringWrapper.classList.remove('running');
                const mode = MODES[currentMode];
                timeLeft = mode.work;
                totalSeconds = mode.work;
                updateControls();
                updateUI();
            }

            function tick() {
                timeLeft--;
                updateUI();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    currentState = STATE.IDLE;
                    ringWrapper.classList.remove('running');
                    completeSession();
                }
            }

            function completeSession() {
                const mode = MODES[currentMode];
                const minutes = Math.round(mode.work / 60);
                const earnedXP = minutes * 2;

                stats.totalXP += earnedXP;
                stats.todayMinutes += minutes;
                const today = getToday();
                if (stats.lastDate !== today) {
                    stats.lastDate = today;
                    stats.todayMinutes = minutes;
                    stats.streakDays = 0;
                }
                const todaySessions = stats.sessions.filter(s => s.date === today);
                if (todaySessions.length === 0) {
                    stats.streakDays += 1;
                }
                stats.sessions.push({ date: today, minutes: minutes, xp: earnedXP });
                saveStats();

                const cheers = ['你又干掉了一张试卷！💪', '牛啊，今天又卷了同桌一把！🚀', '学霸之路，从专注开始！📚',
                    '你这专注力，清华北大在招手！🎯', '劳逸结合，你是懂节奏的！🧘', '悄悄变强，然后惊艳所有人！✨'
                ];
                completeMsg.textContent = cheers[Math.floor(Math.random() * cheers.length)];
                xpGain.textContent = earnedXP;
                modalComplete.classList.add('show');

                resetTimer();
                updateUI();
            }

            function abandonTimer() {
                if (currentState === STATE.IDLE) return;
                const elapsed = totalSeconds - timeLeft;
                const mins = Math.floor(elapsed / 60);
                const secs = elapsed % 60;
                abandonTime.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                modalAbandon.classList.add('show');
            }

            function confirmAbandon() {
                modalAbandon.classList.remove('show');
                resetTimer();
                updateUI();
            }

            // ============================================================
            //  5. 情绪归因日记
            // ============================================================
            function renderDashboard() {
                const entries = stats.diaryEntries;
                if (entries.length === 0) {
                    dashboardContent.innerHTML = '<div class="no-data-msg">还没有记录，写一篇日记吧 📝</div>';
                    return;
                }

                const today = new Date();
                const weekAgo = new Date(today);
                weekAgo.setDate(weekAgo.getDate() - 7);
                const weekEntries = entries.filter(e => {
                    const d = new Date(e.date);
                    return d >= weekAgo && d <= today;
                });

                if (weekEntries.length === 0) {
                    dashboardContent.innerHTML = '<div class="no-data-msg">本周还没有记录哦 📝</div>';
                    return;
                }

                const tagCount = {};
                weekEntries.forEach(e => {
                    (e.tags || []).forEach(t => {
                        tagCount[t] = (tagCount[t] || 0) + 1;
                    });
                });

                const tagColors = {
                    '学业': '#7c6cf0',
                    '人际': '#60a5fa',
                    '家庭': '#f472b6',
                    '生理': '#4ade80',
                    '未来': '#fb923c',
                };
                const maxCount = Math.max(1, ...Object.values(tagCount));
                const tagNames = Object.keys(tagCount);

                let html = '<div class="dashboard-chart">';
                tagNames.forEach(tag => {
                    const count = tagCount[tag] || 0;
                    const height = Math.max(8, (count / maxCount) * 80);
                    const color = tagColors[tag] || '#7c6cf0';
                    html += `
                        <div class="chart-bar-wrapper">
                            <div class="chart-bar" style="height:${height}px;background:${color}">
                                <span class="bar-value">${count}</span>
                            </div>
                            <span class="chart-label">${tag}</span>
                        </div>
                    `;
                });
                html += '</div>';
                html +=
                    `<p style="text-align:center;font-size:11px;color:var(--text-muted);margin-top:4px;">📌 本周共 ${weekEntries.length} 条记录</p>`;
                dashboardContent.innerHTML = html;
            }

            function submitDiary() {
                if (!selectedEmotion) {
                    alert('先选一个今天的心情吧 😊');
                    return;
                }
                if (selectedTags.length === 0) {
                    alert('选一下主要原因，帮星友更懂你 🏷️');
                    return;
                }

                const text = diaryText.value.trim();
                const entry = {
                    date: getToday(),
                    emotion: selectedEmotion,
                    tags: [...selectedTags],
                    text: text,
                };

                stats.diaryEntries.push(entry);
                stats.totalXP += 5;
                saveStats();

                const msgs = ['星友收到了你的心情，明天继续加油！💜', '记录本身就是一种力量，你很棒！🌟',
                    '说出来就好，星友一直在听 👂', '今天的你，又勇敢了一次！🦋'
                ];
                diarySuccessMsg.textContent = msgs[Math.floor(Math.random() * msgs.length)];
                diaryXpGain.textContent = 5;
                modalDiarySuccess.classList.add('show');

                selectedEmotion = null;
                selectedTags = [];
                emotionBtns.forEach(b => b.classList.remove('active'));
                tagBtns.forEach(b => b.classList.remove('active'));
                diaryText.value = '';
                charCount.textContent = '0';

                updateUI();
                renderDashboard();
            }

            // ============================================================
            //  6. UI 更新
            // ============================================================
            function updateUI() {
                xpDisplay.textContent = stats.totalXP;

                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                timeDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

                const progress = totalSeconds > 0 ? (timeLeft / totalSeconds) : 0;
                const circumference = 565.48;
                ringProgress.style.strokeDashoffset = circumference * (1 - progress);

                ringProgress.classList.remove('warning', 'danger', 'complete');
                if (currentState !== STATE.IDLE || timeLeft !== totalSeconds) {
                    if (progress < 0.15) ringProgress.classList.add('danger');
                    else if (progress < 0.30) ringProgress.classList.add('warning');
                }

                const mode = MODES[currentMode];
                modeBadge.textContent = mode.label;
                todayMinutes.textContent = stats.todayMinutes;
                streakDays.textContent = stats.streakDays;
                updateControls();
            }

            function updateControls() {
                const isIdle = currentState === STATE.IDLE;
                const isRunning = currentState === STATE.RUNNING;
                const isPaused = currentState === STATE.PAUSED;

                btnStart.disabled = false;
                btnPause.disabled = true;

                if (isIdle) {
                    btnStart.textContent = '开始专注';
                    btnStart.className = 'ctrl-btn primary';
                    btnPause.textContent = '暂停';
                    btnPause.className = 'ctrl-btn secondary';
                    btnPause.disabled = true;
                } else if (isRunning) {
                    btnStart.textContent = '专注中...';
                    btnStart.className = 'ctrl-btn primary';
                    btnStart.disabled = true;
                    btnPause.textContent = '暂停';
                    btnPause.className = 'ctrl-btn secondary';
                    btnPause.disabled = false;
                } else if (isPaused) {
                    btnStart.textContent = '继续';
                    btnStart.className = 'ctrl-btn primary';
                    btnPause.textContent = '已暂停';
                    btnPause.className = 'ctrl-btn secondary';
                    btnPause.disabled = true;
                }
            }

            // ============================================================
            //  7. Tab 切换
            // ============================================================
            function switchTab(page) {
                tabBtns.forEach(b => b.classList.toggle('active', b.dataset.page === page));
                Object.keys(pages).forEach(key => {
                    pages[key].classList.toggle('active', key === page);
                });
                if (page === 'diary') {
                    renderDashboard();
                }
            }

            // ============================================================
            //  8. 事件绑定
            // ============================================================
            function bindEvents() {
                // 模式切换
                modePomodoro.addEventListener('click', function() {
                    if (currentState !== STATE.IDLE) {
                        if (!confirm('切换模式将重置当前计时，确定吗？')) return;
                    }
                    currentMode = 'pomodoro';
                    modePomodoro.classList.add('active');
                    modeDeep.classList.remove('active');
                    resetTimer();
                });
                modeDeep.addEventListener('click', function() {
                    if (currentState !== STATE.IDLE) {
                        if (!confirm('切换模式将重置当前计时，确定吗？')) return;
                    }
                    currentMode = 'deep';
                    modeDeep.classList.add('active');
                    modePomodoro.classList.remove('active');
                    resetTimer();
                });

                // 控制按钮
                btnStart.addEventListener('click', function() {
                    if (currentState === STATE.IDLE) startTimer();
                    else if (currentState === STATE.PAUSED) resumeTimer();
                });
                btnPause.addEventListener('click', function() {
                    if (currentState === STATE.RUNNING) pauseTimer();
                });
                btnAbandon.addEventListener('click', abandonTimer);

                // 弹窗
                modalCompleteBtn.addEventListener('click', () => modalComplete.classList.remove('show'));
                modalComplete.addEventListener('click', function(e) {
                    if (e.target === this) this.classList.remove('show');
                });

                modalAbandonCancel.addEventListener('click', () => modalAbandon.classList.remove('show'));
                modalAbandonConfirm.addEventListener('click', confirmAbandon);
                modalAbandon.addEventListener('click', function(e) {
                    if (e.target === this) this.classList.remove('show');
                });

                modalDiaryBtn.addEventListener('click', () => modalDiarySuccess.classList.remove('show'));
                modalDiarySuccess.addEventListener('click', function(e) {
                    if (e.target === this) this.classList.remove('show');
                });

                // 情绪选择
                emotionBtns.forEach(btn => {
                    btn.addEventListener('click', function() {
                        emotionBtns.forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        selectedEmotion = this.dataset.emotion;
                    });
                });

                // 归因标签
                tagBtns.forEach(btn => {
                    btn.addEventListener('click', function() {
                        this.classList.toggle('active');
                        const tag = this.dataset.tag;
                        if (this.classList.contains('active')) {
                            if (!selectedTags.includes(tag)) selectedTags.push(tag);
                        } else {
                            selectedTags = selectedTags.filter(t => t !== tag);
                        }
                    });
                });

                // 字数统计
                diaryText.addEventListener('input', function() {
                    charCount.textContent = this.value.length;
                });

                // 提交日记
                diarySubmit.addEventListener('click', submitDiary);

                // Tab
                tabBtns.forEach(btn => {
                    btn.addEventListener('click', function() {
                        switchTab(this.dataset.page);
                    });
                });

                // 键盘快捷键
                document.addEventListener('keydown', function(e) {
                    const activePage = document.querySelector('.page.active');
                    if (!activePage || activePage.id !== 'pageStudy') return;
                    if (e.key === ' ') {
                        e.preventDefault();
                        if (currentState === STATE.RUNNING) pauseTimer();
                        else if (currentState === STATE.PAUSED) resumeTimer();
                        else if (currentState === STATE.IDLE) startTimer();
                    }
                    if (e.key === 'r' || e.key === 'R') {
                        if (currentState !== STATE.IDLE) {
                            if (confirm('重置计时器？')) resetTimer();
                        }
                    }
                });

                // 切后台惩罚
                document.addEventListener('visibilitychange', function() {
                    if (document.hidden && currentState === STATE.RUNNING) {
                        pauseTimer();
                        const container = document.querySelector('.app-container');
                        container.style.borderColor = 'var(--red)';
                        setTimeout(() => { container.style.borderColor = 'var(--border-glass)'; }, 1500);
                    }
                });
            }

            // ============================================================
            //  9. 初始化
            // ============================================================
            function init() {
                loadStats();
                updateUI();
                renderDashboard();
                bindEvents();
            }

            init();

        })();
    </script>

</body>
</html>
