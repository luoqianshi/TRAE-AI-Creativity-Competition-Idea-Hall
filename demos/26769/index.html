<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刷题网站</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --bg: #f9fafb;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #1f2937;
    --text-muted: #6b7280;
    --success: #10b981;
    --success-bg: #ecfdf5;
    --danger: #ef4444;
    --danger-bg: #fef2f2;
    --warn: #f59e0b;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  nav {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  nav .inner {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    gap: 4px;
    overflow-x: auto;
  }
  nav button {
    background: none;
    border: none;
    padding: 14px 16px;
    font-size: 15px;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  nav button:hover { color: var(--text); }
  nav button.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
    font-weight: 600;
  }
  main {
    max-width: 800px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }
  section[hidden] { display: none; }
  h1 { font-size: 22px; margin-bottom: 16px; }
  h2 { font-size: 18px; margin-bottom: 12px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }
  .muted { color: var(--text-muted); font-size: 13px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .row > * { flex: 1; min-width: 0; }
  label { display: block; font-size: 14px; margin-bottom: 6px; font-weight: 500; }
  input[type="text"], input[type="number"], select {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    background: #fff;
  }
  input[type="file"] { font-size: 13px; }
  button.btn {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 9px 18px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 500;
  }
  button.btn:hover { background: var(--primary-hover); }
  button.btn:disabled { background: #c7d2fe; cursor: not-allowed; }
  button.btn.secondary {
    background: #fff;
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.btn.secondary:hover { background: #f3f4f6; }
  button.btn.danger { background: var(--danger); }
  button.btn.danger:hover { background: #dc2626; }
  button.btn.small { padding: 5px 12px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table th, table td {
    border: 1px solid var(--border);
    padding: 6px 8px;
    text-align: left;
    vertical-align: top;
    word-break: break-word;
  }
  table th { background: #f3f4f6; font-weight: 600; }
  .preview-table { max-height: 240px; overflow: auto; }
  .config-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .col-config {
    display: grid;
    grid-template-columns: 120px 1fr;
    gap: 8px;
    align-items: start;
    font-size: 13px;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .col-config .col-name { font-weight: 600; word-break: break-all; }
  .col-config .col-roles { display: flex; flex-wrap: wrap; gap: 8px; }
  .col-config .col-roles label {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin: 0;
    font-weight: 400;
    cursor: pointer;
  }
  .role-group { display: inline-flex; align-items: center; gap: 4px; }
  .mapping-row {
    display: grid;
    grid-template-columns: 1fr 120px;
    gap: 8px;
    align-items: center;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .mapping-row .val {
    padding: 6px 8px;
    background: #f3f4f6;
    border-radius: 4px;
    word-break: break-all;
  }
  .bank-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 8px;
  }
  .bank-item .info { flex: 1; min-width: 0; }
  .bank-item .name { font-weight: 600; }
  .bank-item .meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    margin-right: 4px;
  }
  .tag.single { background: #dbeafe; color: #1e40af; }
  .tag.multi { background: #fef3c7; color: #92400e; }
  .tag.judge { background: #e0e7ff; color: #3730a3; }
  .empty {
    text-align: center;
    padding: 40px 16px;
    color: var(--text-muted);
  }
  .practice-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .progress { font-size: 14px; color: var(--text-muted); }
  .question-text {
    font-size: 16px;
    font-weight: 500;
    margin-bottom: 16px;
    white-space: pre-wrap;
  }
  .options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .option-btn {
    text-align: left;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.15s;
  }
  .option-btn:hover:not(.disabled) { border-color: var(--primary); background: #f5f3ff; }
  .option-btn.selected { border-color: var(--primary); background: #eef2ff; }
  .option-btn.correct { border-color: var(--success); background: var(--success-bg); }
  .option-btn.wrong { border-color: var(--danger); background: var(--danger-bg); }
  .option-btn.disabled { cursor: default; }
  .option-btn .opt-label { font-weight: 600; margin-right: 8px; }
  .option-checkbox {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    font-size: 14px;
  }
  .option-checkbox:hover:not(.disabled) { border-color: var(--primary); background: #f5f3ff; }
  .option-checkbox.selected { border-color: var(--primary); background: #eef2ff; }
  .option-checkbox.correct { border-color: var(--success); background: var(--success-bg); }
  .option-checkbox.wrong { border-color: var(--danger); background: var(--danger-bg); }
  .option-checkbox.disabled { cursor: default; }
  .option-checkbox input { margin-top: 3px; }
  .feedback {
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 12px;
    font-size: 14px;
  }
  .feedback.correct { background: var(--success-bg); color: #065f46; border: 1px solid #a7f3d0; }
  .feedback.wrong { background: var(--danger-bg); color: #991b1b; border: 1px solid #fecaca; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .result-summary {
    text-align: center;
    padding: 24px;
  }
  .result-summary .score { font-size: 36px; font-weight: 700; color: var(--primary); }
  .result-summary .rate { font-size: 16px; color: var(--text-muted); margin-top: 4px; }
  .history-item {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .history-item .h-q { font-weight: 500; margin-bottom: 4px; }
  .history-item .h-meta { color: var(--text-muted); font-size: 12px; }
  .wrong-item, .right-item {
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 10px;
  }
  .wrong-item .wi-q, .right-item .ri-q { font-weight: 500; margin-bottom: 6px; }
  .wrong-item .wi-opts, .right-item .ri-opts {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 6px;
    white-space: pre-wrap;
  }
  .wrong-item .wi-ans, .right-item .ri-ans { font-size: 13px; }
  .wrong-item .wi-ans .correct-ans { color: var(--success); font-weight: 600; }
  .wrong-item .wi-ans .user-ans { color: var(--danger); font-weight: 600; }
  .right-item .ri-ans .correct-ans { color: var(--success); font-weight: 600; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .hidden { display: none !important; }
  @media (max-width: 600px) {
    .col-config { grid-template-columns: 1fr; }
    .mapping-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<nav>
  <div class="inner">
    <button data-nav="load" class="active">加载题目</button>
    <button data-nav="practice">开始练习</button>
    <button data-nav="wrong">错题本</button>
    <button data-nav="right">对题本</button>
  </div>
</nav>
<main>
  <!-- 加载题目视图 -->
  <section id="view-load">
    <h1>加载题目</h1>
    <div class="card">
      <label>选择 CSV 文件</label>
      <input type="file" id="csv-file" accept=".csv,text/csv">
      <p class="muted" style="margin-top:6px;">支持带引号转义、字段内换行的标准 CSV（UTF-8 编码）</p>
    </div>
    <div id="csv-config" class="hidden"></div>
    <div class="card">
      <h2>已加载题库</h2>
      <div id="bank-list"></div>
    </div>
  </section>

  <!-- 开始练习视图 -->
  <section id="view-practice" hidden>
    <div id="practice-config">
      <h1>开始练习</h1>
      <div class="card">
        <div class="row">
          <div>
            <label>题库</label>
            <select id="p-bank"></select>
          </div>
          <div>
            <label>题型</label>
            <select id="p-type">
              <option value="all">全部</option>
              <option value="single">单选</option>
              <option value="multi">多选</option>
              <option value="judge">判断</option>
            </select>
          </div>
          <div>
            <label>数量</label>
            <input type="text" id="p-count" value="10" placeholder="数字或全部">
          </div>
        </div>
        <div style="margin-top:12px;">
          <button class="btn" id="p-start">开始练习</button>
        </div>
      </div>
    </div>
    <div id="practice-area" class="hidden"></div>
  </section>

  <!-- 错题本视图 -->
  <section id="view-wrong" hidden>
    <div class="toolbar">
      <h1>错题本</h1>
      <button class="btn danger small" id="wrong-clear">清空全部</button>
    </div>
    <div id="wrong-list"></div>
  </section>

  <!-- 对题本视图 -->
  <section id="view-right" hidden>
    <div class="toolbar">
      <h1>对题本</h1>
      <button class="btn danger small" id="right-clear">清空全部</button>
    </div>
    <div id="right-list"></div>
  </section>
</main>

<script>
"use strict";

/* ============ 工具函数 ============ */

// CSV 解析器：支持引号转义、字段内逗号/换行、BOM
function parseCSV(text) {
  // 去除 BOM
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = [];
  let row = [];
  let field = "";
  let inQuotes = false;
  let i = 0;
  const len = text.length;
  while (i < len) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"') {
        if (i + 1 < len && text[i + 1] === '"') {
          field += '"';
          i += 2;
        } else {
          inQuotes = false;
          i++;
        }
      } else {
        field += ch;
        i++;
      }
    } else {
      if (ch === '"') {
        inQuotes = true;
        i++;
      } else if (ch === ',') {
        row.push(field);
        field = "";
        i++;
      } else if (ch === '\r') {
        // 处理 \r\n 或单独 \r
        row.push(field);
        field = "";
        rows.push(row);
        row = [];
        if (i + 1 < len && text[i + 1] === '\n') i += 2;
        else i++;
      } else if (ch === '\n') {
        row.push(field);
        field = "";
        rows.push(row);
        row = [];
        i++;
      } else {
        field += ch;
        i++;
      }
    }
  }
  // 处理最后一个字段/行
  if (field.length > 0 || row.length > 0) {
    row.push(field);
    rows.push(row);
  }
  // 过滤完全空行
  const filtered = rows.filter(r => r.some(c => c.trim() !== ""));
  if (filtered.length === 0) return { headers: [], rows: [] };
  const headers = filtered[0].map(h => h.trim());
  const dataRows = filtered.slice(1);
  return { headers, rows: dataRows };
}

// DOM 辅助
function el(tag, attrs = {}, children = []) {
  const e = document.createElement(tag);
  for (const k in attrs) {
    if (k === "class") e.className = attrs[k];
    else if (k === "text") e.textContent = attrs[k];
    else if (k === "html") e.innerHTML = attrs[k];
    else if (k.startsWith("on") && typeof attrs[k] === "function") {
      e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    } else if (attrs[k] !== null && attrs[k] !== undefined) {
      e.setAttribute(k, attrs[k]);
    }
  }
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null) return;
    if (typeof c === "string" || typeof c === "number") e.appendChild(document.createTextNode(String(c)));
    else e.appendChild(c);
  });
  return e;
}
function $(id) { return document.getElementById(id); }
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

/* ============ 答案归一化与题型工具 ============ */

// 字母索引转数字 (A->0, B->1)
function letterToIndex(letter) { return letter.toUpperCase().charCodeAt(0) - 65; }
function indexToLetter(idx) { return String.fromCharCode(65 + idx); }

// 从原始字符串提取多选 token（支持多种分隔符与连写）
function parseMultiTokens(raw, format) {
  if (raw == null) return [];
  let s = String(raw).trim();
  if (!s) return [];
  // 先按分隔符拆分
  const parts = s.split(/[,;，；、\s]+/).filter(p => p !== "");
  if (parts.length > 1) {
    return parts.map(p => normalizeSingleToken(p, format)).filter(t => t !== null);
  }
  // 单个 token：判断是否连写字母（如 "ACD"）
  if (format === "letter" && /^[A-Za-z]+$/.test(s) && s.length > 1) {
    return s.toUpperCase().split("").map(c => c);
  }
  // 单个 token
  const t = normalizeSingleToken(s, format);
  return t === null ? [] : [t];
}

function normalizeSingleToken(token, format) {
  if (token == null) return null;
  let s = String(token).trim();
  if (!s) return null;
  if (format === "letter") {
    const upper = s.toUpperCase();
    if (/^[A-Z]$/.test(upper)) return upper;
    return null;
  } else if (format === "index") {
    const n = parseInt(s, 10);
    if (!isNaN(n) && n >= 1) return indexToLetter(n - 1);
    return null;
  }
  return s; // text 模式返回原值，后续匹配
}

// 归一化答案为字母串（单选/判断单字母，多选排序拼接）
function normalizeAnswer(raw, format, type, options) {
  if (type === "multi") {
    let tokens;
    if (format === "text") {
      // text 模式：按分隔符拆分，匹配选项索引
      const parts = String(raw).trim().split(/[,;，；、\s]+/).filter(p => p !== "");
      const indices = parts.map(p => {
        const t = p.trim();
        const idx = options.findIndex(o => o.trim() === t);
        return idx >= 0 ? indexToLetter(idx) : null;
      }).filter(x => x !== null);
      tokens = indices;
    } else {
      tokens = parseMultiTokens(raw, format);
    }
    return tokens.sort().join("");
  } else {
    // single / judge
    if (format === "text") {
      const t = String(raw).trim();
      const idx = options.findIndex(o => o.trim() === t);
      return idx >= 0 ? indexToLetter(idx) : null;
    }
    return normalizeSingleToken(raw, format);
  }
}

// 比较用户答案与标准答案
function compareAnswer(user, standard, type) {
  if (user == null || standard == null) return false;
  if (type === "multi") {
    // 字母集合相等（已排序拼接，直接字符串比较）
    return user === standard;
  }
  return user === standard;
}

// 题型标签
function typeLabel(t) {
  return { single: "单选", multi: "多选", judge: "判断" }[t] || "单选";
}
function typeTag(t) {
  return `<span class="tag ${t}">${typeLabel(t)}</span>`;
}

// 推断题型映射默认值
function inferType(value) {
  const v = String(value).trim();
  if (v.includes("多")) return "multi";
  if (v.includes("判断")) return "judge";
  return "single";
}

/* ============ localStorage 封装 ============ */

const Storage = {
  get(key, def) {
    try {
      const v = localStorage.getItem(key);
      return v === null ? def : JSON.parse(v);
    } catch (e) { return def; }
  },
  set(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }
};

const Banks = {
  KEY: "quiz:banks",
  list() { return Storage.get(this.KEY, []); },
  get(id) { return this.list().find(b => b.id === id) || null; },
  add(bank) {
    const list = this.list();
    list.push(bank);
    Storage.set(this.KEY, list);
  },
  remove(id) {
    const list = this.list().filter(b => b.id !== id);
    Storage.set(this.KEY, list);
  }
};

function makeBook(KEY) {
  return {
    all() { return Storage.get(KEY, []); },
    add(item) {
      const list = this.all();
      // 去重：同 bankId + questionId 覆盖
      const idx = list.findIndex(x => x.bankId === item.bankId && x.questionId === item.questionId);
      if (idx >= 0) list[idx] = item;
      else list.push(item);
      Storage.set(KEY, list);
    },
    clear() { Storage.set(KEY, []); },
    remove(bankId, questionId) {
      const list = this.all().filter(x => !(x.bankId === bankId && x.questionId === questionId));
      Storage.set(KEY, list);
    }
  };
}
const WrongBook = makeBook("quiz:wrong");
const RightBook = makeBook("quiz:right");

/* ============ 视图切换 ============ */

const VIEWS = ["load", "practice", "wrong", "right"];
function switchView(name) {
  VIEWS.forEach(v => {
    $(`view-${v}`).hidden = v !== name;
  });
  document.querySelectorAll("nav button[data-nav]").forEach(b => {
    b.classList.toggle("active", b.dataset.nav === name);
  });
  // 进入视图时刷新数据
  if (name === "load") renderBankList();
  if (name === "practice") renderPracticeConfig();
  if (name === "wrong") renderWrongList();
  if (name === "right") renderRightList();
}

document.querySelectorAll("nav button[data-nav]").forEach(b => {
  b.addEventListener("click", () => switchView(b.dataset.nav));
});

/* ============ 加载题目视图 ============ */

let pendingCSV = null; // { headers, rows, fileName }

$("csv-file").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const parsed = parseCSV(ev.target.result);
      if (parsed.headers.length === 0 || parsed.rows.length === 0) {
        alert("CSV 文件为空或解析失败");
        return;
      }
      pendingCSV = { headers: parsed.headers, rows: parsed.rows, fileName: file.name };
      renderCSVConfig();
    } catch (err) {
      alert("解析 CSV 失败：" + err.message);
    }
  };
  reader.readAsText(file, "utf-8");
});

function renderCSVConfig() {
  const container = $("csv-config");
  clear(container);
  if (!pendingCSV) { container.classList.add("hidden"); return; }
  container.classList.remove("hidden");

  const { headers, rows, fileName } = pendingCSV;
  const defaultName = fileName.replace(/\.csv$/i, "");

  // 题库名
  const nameCard = el("div", { class: "card" }, [
    el("label", { text: "题库名称" }),
    el("input", { type: "text", id: "c-name", value: defaultName })
  ]);

  // 预览表
  const previewCard = el("div", { class: "card" }, [
    el("h2", { text: "数据预览（前 5 行）" }),
    el("div", { class: "preview-table" }, [buildPreviewTable(headers, rows.slice(0, 5))])
  ]);

  // 列配置
  const configCard = el("div", { class: "card" }, [
    el("h2", { text: "列配置" }),
    el("p", { class: "muted", text: "为每列指定角色：题目列（单选）、答案列（单选）、选项列（多选，按勾选顺序作 A/B/C…）、题型列（单选，可选无）" }),
    buildColConfig(headers, rows)
  ]);

  // 答案格式
  const formatCard = el("div", { class: "card" }, [
    el("h2", { text: "答案格式" }),
    el("p", { class: "muted", text: "指定答案列的存储格式，用于判分" }),
    el("div", { class: "row" }, [
      el("label", {}, [
        el("input", { type: "radio", name: "c-format", value: "letter", checked: true }),
        " 字母 (A/B/C/D)"
      ]),
      el("label", {}, [
        el("input", { type: "radio", name: "c-format", value: "index" }),
        " 序号 (1/2/3/4)"
      ]),
      el("label", {}, [
        el("input", { type: "radio", name: "c-format", value: "text" }),
        " 选项文本"
      ])
    ])
  ]);

  // 题型映射容器（动态填充）
  const mappingCard = el("div", { class: "card hidden", id: "c-mapping-card" }, [
    el("h2", { text: "题型映射" }),
    el("p", { class: "muted", text: "为题型列中每个出现的值指定标准题型" }),
    el("div", { id: "c-mapping" })
  ]);

  // 加载按钮
  const actionCard = el("div", { class: "card" }, [
    el("button", { class: "btn", onclick: doLoadBank, text: "加载题库" })
  ]);

  container.appendChild(nameCard);
  container.appendChild(previewCard);
  container.appendChild(configCard);
  container.appendChild(formatCard);
  container.appendChild(mappingCard);
  container.appendChild(actionCard);

  // 触发默认预选与映射刷新
  applyDefaults(headers);
  updateMappingCard();
}

function buildPreviewTable(headers, rows) {
  const table = el("table", {});
  const thead = el("thead", {}, [el("tr", {}, headers.map(h => el("th", { text: h })))]);
  const tbody = el("tbody", {});
  rows.forEach(r => {
    tbody.appendChild(el("tr", {}, headers.map((_, i) => el("td", { text: r[i] ?? "" }))));
  });
  table.appendChild(thead);
  table.appendChild(tbody);
  return table;
}

function buildColConfig(headers, rows) {
  const wrap = el("div", { class: "config-grid" });
  headers.forEach((h, idx) => {
    const col = el("div", { class: "col-config" }, [
      el("div", { class: "col-name", text: h }),
      el("div", { class: "col-roles" }, [
        el("label", {}, [
          el("input", { type: "radio", name: "role-question", value: h, "data-col": h }),
          "题目"
        ]),
        el("label", {}, [
          el("input", { type: "radio", name: "role-answer", value: h, "data-col": h }),
          "答案"
        ]),
        el("label", {}, [
          el("input", { type: "checkbox", name: "role-option", value: h, "data-col": h }),
          "选项"
        ]),
        el("label", {}, [
          el("input", { type: "radio", name: "role-type", value: h, "data-col": h }),
          "题型"
        ])
      ])
    ]);
    wrap.appendChild(col);
  });
  // 添加"无题型"选项
  wrap.appendChild(el("div", { class: "col-config" }, [
    el("div", { class: "col-name", text: "（无）" }),
    el("div", { class: "col-roles" }, [
      el("label", {}, [
        el("input", { type: "radio", name: "role-type", value: "", checked: true }),
        "不使用题型列"
      ])
    ])
  ]));
  // 监听题型列变化
  wrap.querySelectorAll('input[name="role-type"]').forEach(r => {
    r.addEventListener("change", updateMappingCard);
  });
  return wrap;
}

function applyDefaults(headers) {
  if (headers.length < 2) return;
  // 默认：第 1 列题目，最后 1 列答案，中间为选项
  const qRadio = document.querySelector('input[name="role-question"][value="' + headers[0] + '"]');
  if (qRadio) qRadio.checked = true;
  const aRadio = document.querySelector('input[name="role-answer"][value="' + headers[headers.length - 1] + '"]');
  if (aRadio) aRadio.checked = true;
  // 中间列作为选项
  for (let i = 1; i < headers.length - 1; i++) {
    const cb = document.querySelector('input[name="role-option"][value="' + headers[i] + '"]');
    if (cb) cb.checked = true;
  }
  // 题型列默认"无"已 checked
  // 答案格式默认推断
  if (pendingCSV.rows.length > 0) {
    const ansCol = headers.length - 1;
    const sample = pendingCSV.rows[0][ansCol] || "";
    const first = sample.trim();
    let fmt = "text";
    if (/^[A-Za-z]+$/.test(first)) fmt = "letter";
    else if (/^\d+$/.test(first)) fmt = "index";
    const radio = document.querySelector('input[name="c-format"][value="' + fmt + '"]');
    if (radio) radio.checked = true;
  }
}

function getSelectedCol(role) {
  const checked = document.querySelector('input[name="role-' + role + '"]:checked');
  return checked ? checked.value : "";
}

function getSelectedOptions() {
  // 按勾选顺序（DOM 顺序）返回
  const cbs = document.querySelectorAll('input[name="role-option"]:checked');
  return Array.from(cbs).map(cb => cb.value);
}

function getSelectedFormat() {
  const checked = document.querySelector('input[name="c-format"]:checked');
  return checked ? checked.value : "letter";
}

function updateMappingCard() {
  const typeCol = getSelectedCol("type");
  const card = $("c-mapping-card");
  const mappingDiv = $("c-mapping");
  clear(mappingDiv);
  if (!typeCol) {
    card.classList.add("hidden");
    return;
  }
  card.classList.remove("hidden");
  // 收集题型列所有唯一值
  const idx = pendingCSV.headers.indexOf(typeCol);
  const values = new Set();
  pendingCSV.rows.forEach(r => {
    const v = (r[idx] || "").trim();
    if (v) values.add(v);
  });
  Array.from(values).forEach(v => {
    const row = el("div", { class: "mapping-row" }, [
      el("div", { class: "val", text: v }),
      el("select", { "data-mapping-val": v }, [
        el("option", { value: "single", selected: inferType(v) === "single" ? "selected" : null }, "单选"),
        el("option", { value: "multi", selected: inferType(v) === "multi" ? "selected" : null }, "多选"),
        el("option", { value: "judge", selected: inferType(v) === "judge" ? "selected" : null }, "判断")
      ])
    ]);
    mappingDiv.appendChild(row);
  });
}

function getTypeMapping() {
  const typeCol = getSelectedCol("type");
  if (!typeCol) return {};
  const mapping = {};
  document.querySelectorAll("#c-mapping select[data-mapping-val]").forEach(sel => {
    mapping[sel.dataset.mappingVal] = sel.value;
  });
  return mapping;
}

function doLoadBank() {
  const name = $("c-name").value.trim();
  if (!name) { alert("请填写题库名称"); return; }
  const questionCol = getSelectedCol("question");
  const answerCol = getSelectedCol("answer");
  const optionCols = getSelectedOptions();
  const typeCol = getSelectedCol("type");
  const format = getSelectedFormat();
  const typeMapping = getTypeMapping();

  if (!questionCol) { alert("请选择题目列"); return; }
  if (!answerCol) { alert("请选择答案列"); return; }
  if (optionCols.length < 2) { alert("请至少选择 2 个选项列"); return; }

  const headers = pendingCSV.headers;
  const qIdx = headers.indexOf(questionCol);
  const aIdx = headers.indexOf(answerCol);
  const optIdx = optionCols.map(h => headers.indexOf(h));
  const typeIdx = typeCol ? headers.indexOf(typeCol) : -1;

  const questions = [];
  pendingCSV.rows.forEach((r, i) => {
    const question = (r[qIdx] || "").trim();
    if (!question) return;
    const options = optIdx.map(i => (r[i] || "").trim());
    const rawAnswer = r[aIdx] || "";
    const type = typeIdx >= 0 ? (typeMapping[(r[typeIdx] || "").trim()] || "single") : "single";
    const answer = normalizeAnswer(rawAnswer, format, type, options);
    if (answer == null || answer === "") {
      // 答案解析失败，跳过并提示
      console.warn("答案解析失败，跳过第 " + (i + 1) + " 行：", rawAnswer);
      return;
    }
    questions.push({
      id: "q_" + i,
      question,
      options,
      answer,
      type
    });
  });

  if (questions.length === 0) { alert("没有有效的题目，请检查配置"); return; }

  const bank = {
    id: "bank_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8),
    name,
    createdAt: Date.now(),
    config: {
      questionCol,
      answerCol,
      optionCols,
      answerFormat: format,
      typeCol: typeCol || null,
      typeMapping
    },
    questions
  };
  Banks.add(bank);

  // 重置
  pendingCSV = null;
  $("csv-file").value = "";
  $("csv-config").classList.add("hidden");
  clear($("csv-config"));
  renderBankList();
  alert("加载成功：共 " + questions.length + " 题");
}

function renderBankList() {
  const container = $("bank-list");
  clear(container);
  const banks = Banks.list();
  if (banks.length === 0) {
    container.appendChild(el("div", { class: "empty", text: "暂无题库，请先加载 CSV 文件" }));
    return;
  }
  banks.forEach(b => {
    // 按题型分项统计
    const stats = { single: 0, multi: 0, judge: 0 };
    b.questions.forEach(q => { stats[q.type] = (stats[q.type] || 0) + 1; });
    const tags = Object.entries(stats).filter(([_, v]) => v > 0)
      .map(([t, v]) => `<span class="tag ${t}">${typeLabel(t)} ${v}</span>`).join("");
    const item = el("div", { class: "bank-item" }, [
      el("div", { class: "info" }, [
        el("div", { class: "name", text: b.name }),
        el("div", { class: "meta", html: tags + " · 共 " + b.questions.length + " 题 · " + new Date(b.createdAt).toLocaleString() })
      ]),
      el("button", { class: "btn danger small", onclick: () => {
        if (confirm("确定删除题库「" + b.name + "」？")) {
          Banks.remove(b.id);
          renderBankList();
          renderPracticeConfig();
        }
      }, text: "删除" })
    ]);
    container.appendChild(item);
  });
}

/* ============ 开始练习视图 ============ */

let practiceState = null; // { queue, index, correctCount, wrongInSession }

function renderPracticeConfig() {
  const sel = $("p-bank");
  clear(sel);
  const banks = Banks.list();
  sel.appendChild(el("option", { value: "all", text: "全部题库" }));
  banks.forEach(b => {
    sel.appendChild(el("option", { value: b.id, text: b.name + "（" + b.questions.length + " 题）" }));
  });
  if (banks.length === 0) {
    $("p-start").disabled = true;
  } else {
    $("p-start").disabled = false;
  }
}

$("p-start").addEventListener("click", () => {
  const bankId = $("p-bank").value;
  const typeFilter = $("p-type").value;
  const countStr = $("p-count").value.trim().toLowerCase();
  let banks = bankId === "all" ? Banks.list() : [Banks.get(bankId)].filter(Boolean);
  if (banks.length === 0) { alert("请先加载题库"); return; }
  // 收集题目
  let pool = [];
  banks.forEach(b => {
    b.questions.forEach(q => {
      if (typeFilter === "all" || q.type === typeFilter) {
        pool.push({ ...q, bankId: b.id, bankName: b.name });
      }
    });
  });
  if (pool.length === 0) { alert("没有符合条件的题目"); return; }
  // 数量
  let count;
  if (countStr === "all" || countStr === "全部") count = pool.length;
  else count = parseInt(countStr, 10) || 10;
  count = Math.min(count, pool.length);
  // 抽题（Fisher-Yates 洗牌）
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const queue = pool.slice(0, count);
  practiceState = { queue, index: 0, correctCount: 0, wrongInSession: [] };
  $("practice-config").classList.add("hidden");
  $("practice-area").classList.remove("hidden");
  renderCurrentQuestion();
});

function exitPractice() {
  practiceState = null;
  $("practice-area").classList.add("hidden");
  clear($("practice-area"));
  $("practice-config").classList.remove("hidden");
}

function renderCurrentQuestion() {
  if (!practiceState) return;
  const { queue, index } = practiceState;
  const area = $("practice-area");
  clear(area);
  if (index >= queue.length) {
    renderResult();
    return;
  }
  const q = queue[index];
  const headerDiv = el("div", { class: "practice-header" });
  const left = el("div", {});
  left.appendChild(el("span", { class: "progress", text: "第 " + (index + 1) + " / " + queue.length + " 题" }));
  left.appendChild(document.createTextNode(" · " + q.bankName + " "));
  const tagSpan = document.createElement("span");
  tagSpan.innerHTML = typeTag(q.type);
  left.appendChild(tagSpan);
  headerDiv.appendChild(left);
  headerDiv.appendChild(el("button", { class: "btn secondary small", onclick: exitPractice, text: "退出" }));

  const card = el("div", { class: "card" });
  card.appendChild(el("div", { class: "question-text", text: q.question }));

  const optionsWrap = el("div", { class: "options" });
  if (q.type === "multi") {
    // checkbox 形式
    const selected = new Set();
    q.options.forEach((opt, i) => {
      const label = el("label", { class: "option-checkbox" }, [
        el("input", { type: "checkbox", value: indexToLetter(i) }),
        el("span", { class: "opt-label", text: indexToLetter(i) + "." }),
        el("span", { text: opt })
      ]);
      label.querySelector("input").addEventListener("change", () => {
        const v = indexToLetter(i);
        if (label.querySelector("input").checked) selected.add(v);
        else selected.delete(v);
        label.classList.toggle("selected", label.querySelector("input").checked);
      });
      optionsWrap.appendChild(label);
    });
    card.appendChild(optionsWrap);
    const submitBtn = el("button", { class: "btn", text: "提交答案" });
    submitBtn.addEventListener("click", () => {
      if (selected.size === 0) { alert("请至少选择一个选项"); return; }
      const userAnswer = Array.from(selected).sort().join("");
      judgeAnswer(q, userAnswer, card);
    });
    card.appendChild(submitBtn);
  } else {
    // single / judge：按钮形式
    q.options.forEach((opt, i) => {
      const btn = el("button", { class: "option-btn", type: "button" }, [
        el("span", { class: "opt-label", text: indexToLetter(i) + "." }),
        el("span", { text: opt })
      ]);
      btn.addEventListener("click", () => {
        const userAnswer = indexToLetter(i);
        judgeAnswer(q, userAnswer, card);
      });
      optionsWrap.appendChild(btn);
    });
    card.appendChild(optionsWrap);
  }
  area.appendChild(headerDiv);
  area.appendChild(card);
}

function judgeAnswer(q, userAnswer, card) {
  const correct = compareAnswer(userAnswer, q.answer, q.type);
  // 禁用所有选项
  card.querySelectorAll(".option-btn, .option-checkbox").forEach(b => {
    b.classList.add("disabled");
    const input = b.querySelector("input");
    if (input) input.disabled = true;
  });
  // 标记正确/错误选项
  const correctLetters = q.type === "multi" ? q.answer.split("") : [q.answer];
  const userLetters = q.type === "multi" ? userAnswer.split("") : [userAnswer];
  // 选项按钮/checkbox 标记
  const optionEls = card.querySelectorAll(".option-btn, .option-checkbox");
  optionEls.forEach((optEl, i) => {
    const letter = indexToLetter(i);
    if (correctLetters.includes(letter)) optEl.classList.add("correct");
    else if (userLetters.includes(letter)) optEl.classList.add("wrong");
  });
  // 反馈
  const feedback = el("div", { class: "feedback " + (correct ? "correct" : "wrong") });
  const userDisplay = q.type === "multi" ? userAnswer.split("").join(",") : userAnswer;
  const stdDisplay = q.type === "multi" ? q.answer.split("").join(",") : q.answer;
  feedback.innerHTML = correct
    ? "<strong>回答正确</strong>"
    : "<strong>回答错误</strong> · 你的答案：" + userDisplay + " · 正确答案：" + stdDisplay;
  card.appendChild(feedback);

  // 记录
  const snapshot = {
    bankId: q.bankId,
    bankName: q.bankName,
    questionId: q.id,
    question: q.question,
    options: q.options,
    answer: q.answer,
    userAnswer,
    type: q.type,
    addedAt: Date.now()
  };
  if (correct) {
    practiceState.correctCount++;
    RightBook.add(snapshot);
  } else {
    practiceState.wrongInSession.push(snapshot);
    WrongBook.add(snapshot);
  }

  // 下一题按钮
  const isLast = practiceState.index >= practiceState.queue.length - 1;
  const nextBtn = el("button", { class: "btn", text: isLast ? "查看结果" : "下一题" });
  nextBtn.addEventListener("click", () => {
    practiceState.index++;
    renderCurrentQuestion();
  });
  card.appendChild(el("div", { class: "actions", style: "margin-top:12px;" }, [nextBtn]));
}

function renderResult() {
  const area = $("practice-area");
  clear(area);
  const { queue, correctCount, wrongInSession } = practiceState;
  const total = queue.length;
  const rate = total > 0 ? Math.round((correctCount / total) * 100) : 0;
  const card = el("div", { class: "card result-summary" });
  card.appendChild(el("div", { class: "score", text: correctCount + " / " + total }));
  card.appendChild(el("div", { class: "rate", text: "正确率 " + rate + "%" }));
  card.appendChild(el("div", { style: "margin-top:16px;" }, [
    el("button", { class: "btn", onclick: exitPractice, text: "返回" })
  ]));
  area.appendChild(card);

  if (wrongInSession.length > 0) {
    const wrongCard = el("div", { class: "card" });
    wrongCard.appendChild(el("h2", { text: "本次错题（" + wrongInSession.length + " 题）" }));
    wrongInSession.forEach(s => {
      const item = el("div", { class: "history-item" });
      item.innerHTML = '<div class="h-q">' + escapeHtml(s.question) + '</div>' +
        '<div class="h-meta">你的答案：' + (s.type === "multi" ? s.userAnswer.split("").join(",") : s.userAnswer) +
        ' · 正确答案：' + (s.type === "multi" ? s.answer.split("").join(",") : s.answer) + '</div>';
      wrongCard.appendChild(item);
    });
    area.appendChild(wrongCard);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

/* ============ 错题本视图 ============ */

$("wrong-clear").addEventListener("click", () => {
  if (WrongBook.all().length === 0) return;
  if (confirm("确定清空全部错题？此操作不可恢复。")) {
    WrongBook.clear();
    renderWrongList();
  }
});

function renderWrongList() {
  const container = $("wrong-list");
  clear(container);
  const list = WrongBook.all();
  if (list.length === 0) {
    container.appendChild(el("div", { class: "empty", text: "错题本为空" }));
    return;
  }
  // 按时间倒序
  list.slice().reverse().forEach(s => {
    container.appendChild(buildRecordCard(s, "wrong"));
  });
}

/* ============ 对题本视图 ============ */

$("right-clear").addEventListener("click", () => {
  if (RightBook.all().length === 0) return;
  if (confirm("确定清空全部对题？此操作不可恢复。")) {
    RightBook.clear();
    renderRightList();
  }
});

function renderRightList() {
  const container = $("right-list");
  clear(container);
  const list = RightBook.all();
  if (list.length === 0) {
    container.appendChild(el("div", { class: "empty", text: "对题本为空" }));
    return;
  }
  list.slice().reverse().forEach(s => {
    container.appendChild(buildRecordCard(s, "right"));
  });
}

function buildRecordCard(s, kind) {
  const card = el("div", { class: kind === "wrong" ? "wrong-item" : "right-item" });
  const tagHtml = typeTag(s.type);
  const headerDiv = el("div");
  headerDiv.innerHTML = tagHtml + ' <span class="muted">' + escapeHtml(s.bankName) + '</span>';
  card.appendChild(headerDiv);
  card.appendChild(el("div", { class: kind === "wrong" ? "wi-q" : "ri-q", text: s.question }));
  // 选项
  const optsDiv = el("div", { class: kind === "wrong" ? "wi-opts" : "ri-opts" });
  s.options.forEach((o, i) => {
    const letter = indexToLetter(i);
    const isCorrect = (s.type === "multi" ? s.answer.split("") : [s.answer]).includes(letter);
    const isUser = (s.type === "multi" ? s.userAnswer.split("") : [s.userAnswer]).includes(letter);
    let prefix = "  " + letter + ". " + o;
    if (isCorrect) prefix += "  ✓";
    if (isUser && kind === "wrong") prefix += "  (你的选择)";
    optsDiv.appendChild(document.createTextNode(prefix + "\n"));
  });
  card.appendChild(optsDiv);
  // 答案行
  const ansDiv = el("div", { class: kind === "wrong" ? "wi-ans" : "ri-ans" });
  const userDisplay = s.type === "multi" ? s.userAnswer.split("").join(",") : s.userAnswer;
  const stdDisplay = s.type === "multi" ? s.answer.split("").join(",") : s.answer;
  if (kind === "wrong") {
    ansDiv.innerHTML = '正确答案：<span class="correct-ans">' + stdDisplay + '</span> · 你的答案：<span class="user-ans">' + userDisplay + '</span>';
  } else {
    ansDiv.innerHTML = '正确答案：<span class="correct-ans">' + stdDisplay + '</span>';
  }
  card.appendChild(ansDiv);
  card.appendChild(el("div", { class: "muted", style: "margin-top:6px;font-size:11px;", text: new Date(s.addedAt).toLocaleString() }));
  return card;
}

/* ============ 初始化 ============ */

renderBankList();
renderPracticeConfig();

</script>
