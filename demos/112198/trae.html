<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DreamVerse · 梦境方舟</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "PingFang SC", "SF Pro Text", -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 20% 30%, #1a0c2c, #04010a 80%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #f0eaff;
    }
    .app-container {
      width: 100%;
      max-width: 400px;
      background: rgba(12, 5, 28, 0.7);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: 44px;
      padding: 28px 22px 32px;
      box-shadow: 0 40px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(180, 130, 255, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    .star-field {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: radial-gradient(2px 2px at 10% 20%, white, transparent 30%),
                  radial-gradient(2px 2px at 85% 15%, #d9c5ff, transparent 30%),
                  radial-gradient(1px 1px at 40% 70%, #b794f4, transparent 20%),
                  radial-gradient(1px 1px at 70% 60%, #ffffff, transparent 20%);
      opacity: 0.5;
    }
    h1 {
      font-size: 30px;
      font-weight: 700;
      background: linear-gradient(135deg, #ddc9ff, #a479ff, #6d3bff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 1px;
      z-index: 2;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 14px;
      color: #9f8ec7;
      z-index: 2;
      margin-bottom: 28px;
      font-style: italic;
    }
    .dream-input-area {
      width: 100%;
      background: rgba(20, 10, 40, 0.5);
      border: 1px solid rgba(200, 180, 255, 0.3);
      border-radius: 24px;
      padding: 16px;
      backdrop-filter: blur(12px);
      z-index: 2;
      margin-bottom: 20px;
    }
    .dream-input {
      width: 100%;
      background: transparent;
      border: none;
      color: #e8ddff;
      font-size: 16px;
      resize: none;
      outline: none;
      height: 70px;
      line-height: 1.5;
    }
    .dream-input::placeholder {
      color: #6b5b8a;
      font-style: italic;
    }
    .dream-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .tag {
      background: rgba(140, 110, 230, 0.2);
      border: 1px solid rgba(180, 150, 255, 0.4);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      color: #cdbaff;
      cursor: pointer;
      transition: 0.2s;
      user-select: none;
    }
    .tag.selected {
      background: rgba(160, 120, 255, 0.4);
      border-color: #c9abff;
      color: white;
      box-shadow: 0 0 14px #9f7aff;
    }
    .generate-btn {
      width: 100%;
      background: linear-gradient(125deg, #6d3bff, #3a1c8a);
      border: none;
      border-radius: 30px;
      padding: 16px;
      font-size: 18px;
      font-weight: 600;
      color: white;
      letter-spacing: 2px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(120, 50, 255, 0.7);
      cursor: pointer;
      transition: 0.2s;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .generate-btn:active {
      transform: scale(0.96);
      background: linear-gradient(125deg, #5a2be0, #2e1270);
    }
    .dream-canvas-container {
      width: 100%;
      height: 220px;
      background: rgba(0,0,0,0.4);
      border-radius: 28px;
      overflow: hidden;
      position: relative;
      z-index: 2;
      margin-bottom: 16px;
      display: none;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .dream-canvas-container.active {
      display: block;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .dream-meta {
      text-align: center;
      z-index: 2;
      display: none;
    }
    .dream-meta.active {
      display: block;
    }
    .dream-title {
      font-size: 22px;
      font-weight: 600;
      background: linear-gradient(135deg, #e2d0ff, #c09eff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .dream-desc {
      color: #b7a3dd;
      font-size: 14px;
    }
    .explore-hint {
      font-size: 12px;
      color: #7e6da2;
      margin-top: 8px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="star-field"></div>
    <h1>DreamVerse</h1>
    <div class="subtitle">🌌 潜入你的潜意识奇境</div>
    
    <div class="dream-input-area">
      <textarea class="dream-input" id="dreamInput" placeholder="描述你记得的梦境碎片，例如：发光的鲸鱼在紫色沙漠游动…"></textarea>
      <div class="dream-tags" id="dreamTags">
        <span class="tag" data-tag="飞鲸">🐋 飞鲸</span>
        <span class="tag" data-tag="镜面海">🌊 镜面海</span>
        <span class="tag" data-tag="倒流的雨">💧 倒流的雨</span>
        <span class="tag" data-tag="水晶森林">🌳 水晶森林</span>
        <span class="tag" data-tag="漂浮城市">🏙️ 漂浮城市</span>
      </div>
    </div>
    
    <button class="generate-btn" id="generateDreamBtn">
      <span>✨</span> 生成梦境世界
    </button>
    
    <div class="dream-canvas-container" id="dreamCanvasContainer">
      <canvas id="dreamCanvas"></canvas>
    </div>
    
    <div class="dream-meta" id="dreamMeta">
      <div class="dream-title" id="dreamWorldName">鲸歌沙漠</div>
      <div class="dream-desc" id="dreamWorldDesc">飞鲸在紫色沙丘间歌唱，雨滴从地面升向星空</div>
      <div class="explore-hint">🖐️ 点击并拖动以探索 · 梦境已保存至方舟</div>
    </div>
  </div>

  <script>
    const tags = document.querySelectorAll('.tag');
    const dreamInput = document.getElementById('dreamInput');
    const generateBtn = document.getElementById('generateDreamBtn');
    const canvasContainer = document.getElementById('dreamCanvasContainer');
    const canvas = document.getElementById('dreamCanvas');
    const ctx = canvas.getContext('2d');
    const dreamMeta = document.getElementById('dreamMeta');
    const dreamWorldName = document.getElementById('dreamWorldName');
    const dreamWorldDesc = document.getElementById('dreamWorldDesc');
    
    let selectedTags = [];
    
    tags.forEach(tag => {
      tag.addEventListener('click', function() {
        this.classList.toggle('selected');
        const tagValue = this.getAttribute('data-tag');
        if (this.classList.contains('selected')) {
          selectedTags.push(tagValue);
        } else {
          selectedTags = selectedTags.filter(t => t !== tagValue);
        }
      });
    });
    
    const dreamPresets = [
      { name: '鲸歌沙漠', desc: '飞鲸在紫色沙丘间歌唱，雨滴从地面升向星空', colors: ['#a05bff', '#2a0d5c', '#f0c4ff'] },
      { name: '镜渊海', desc: '你行走在绝对平静的镜面上，天空投射出另一个自己', colors: ['#6dd5ed', '#1b3b4f', '#a3e4ff'] },
      { name: '逆雨城', desc: '雨水从地面升起，落入颠倒的云层，城市悬浮在半空', colors: ['#ff8c6b', '#5c1a3c', '#ffc8a0'] },
      { name: '晶森回响', desc: '透明的水晶树干中流淌着光芒，脚步声化作音符', colors: ['#7fffa0', '#1a3d2b', '#c4ffe0'] },
      { name: '浮岛墓园', desc: '无数长满青苔的浮岛缓缓漂移，每个岛上都有一座安静的墓碑', colors: ['#b8b8d0', '#1f1e33', '#e0ddf5'] }
    ];
    
    function resizeCanvas() {
      canvas.width = canvasContainer.clientWidth;
      canvas.height = canvasContainer.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    
    let animationId;
    let particles = [];
    
    function createParticles(colorPalette) {
      particles = [];
      for (let i = 0; i < 45; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 3.5 + 1.5,
          speedX: (Math.random() - 0.5) * 0.7,
          speedY: (Math.random() - 0.8) * 0.6,
          color: colorPalette[Math.floor(Math.random() * colorPalette.length)]
        });
      }
    }
    
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // 绘制星云背景
      const gradient = ctx.createLinearGradient(0, 0, canvas.width*0.4, canvas.height);
      gradient.addColorStop(0, 'rgba(30,10,60,0.9)');
      gradient.addColorStop(1, 'rgba(10,5,25,0.95)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      particles.forEach(p => {
        p.x += p.speedX;
        p.y += p.speedY;
        if (p.y < -10) p.y = canvas.height + 10;
        if (p.y > canvas.height + 10) p.y = -10;
        if (p.x < -10) p.x = canvas.width + 10;
        if (p.x > canvas.width + 10) p.x = -10;
        
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.shadowBlur = 0; // reset for performance
        ctx.shadowColor = 'transparent';
      });
      
      animationId = requestAnimationFrame(animate);
    }
    
    generateBtn.addEventListener('click', function() {
      const userText = dreamInput.value.trim();
      if (userText === '' && selectedTags.length === 0) {
        alert('请至少输入一段梦境或选择一个意象标签～');
        return;
      }
      
      // 随机选择一个梦境预设，结合标签或文字
      const preset = dreamPresets[Math.floor(Math.random() * dreamPresets.length)];
      dreamWorldName.textContent = preset.name;
      dreamWorldDesc.textContent = preset.desc;
      
      canvasContainer.classList.add('active');
      dreamMeta.classList.add('active');
      resizeCanvas();
      
      if (animationId) cancelAnimationFrame(animationId);
      createParticles(preset.colors);
      animate();
    });
    
    // 初始不可见，点击生成后显示
    window.addEventListener('load', () => {
      resizeCanvas();
    });
  </script>
</body>
</html>
