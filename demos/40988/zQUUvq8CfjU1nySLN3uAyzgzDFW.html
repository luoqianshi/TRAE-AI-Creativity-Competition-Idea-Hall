<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>牛牛学院 BullAcademy - 像玩多邻国一样学会股票投资</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #58cc02;
            --primary-dark: #58a700;
            --primary-light: #89e219;
            --secondary: #1cb0f6;
            --secondary-dark: #1899d6;
            --accent: #ff9600;
            --accent-light: #ffc800;
            --danger: #ff4b4b;
            --danger-dark: #ea2b2b;
            --success: #58cc02;
            --bg: #f7f7f7;
            --card: #ffffff;
            --text: #3c3c3c;
            --text-light: #777777;
            --border: #e5e5e5;
            --shadow: 0 4px 0 #e5e5e5;
            --shadow-primary: 0 4px 0 var(--primary-dark);
            --shadow-secondary: 0 4px 0 var(--secondary-dark);
            --shadow-danger: 0 4px 0 var(--danger-dark);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== 顶部状态栏 ===== */
        .top-bar {
            background: var(--card);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 18px;
            color: var(--primary);
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .stats {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 700;
            font-size: 14px;
        }

        .stat-icon {
            font-size: 18px;
        }

        .stat-item.xp { color: var(--accent); }
        .stat-item.streak { color: var(--danger); }
        .stat-item.gems { color: var(--secondary); }

        /* ===== 主内容区 ===== */
        .main-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
        }

        /* ===== 欢迎/关卡选择界面 ===== */
        .screen {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 课程路径 */
        .path-container {
            position: relative;
            padding: 20px 0;
        }

        .path-line {
            position: absolute;
            left: 50%;
            top: 40px;
            bottom: 40px;
            width: 8px;
            background: linear-gradient(to bottom, var(--primary), var(--primary-light));
            transform: translateX(-50%);
            border-radius: 4px;
            opacity: 0.3;
        }

        .level-node {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 24px 0;
            z-index: 2;
        }

        .level-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
            transition: all 0.2s;
            position: relative;
        }

        .level-btn.locked {
            background: #ddd;
            color: #999;
            box-shadow: 0 4px 0 #bbb;
            cursor: not-allowed;
        }

        .level-btn.available {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            box-shadow: 0 6px 0 var(--primary-dark);
            animation: pulse 2s infinite;
        }

        .level-btn.completed {
            background: linear-gradient(135deg, var(--secondary), var(--secondary-dark));
            color: white;
            box-shadow: 0 4px 0 var(--secondary-dark);
        }

        .level-btn.available:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--primary-dark);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .level-label {
            margin-top: 8px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            text-align: center;
        }

        .level-stars {
            display: flex;
            gap: 2px;
            margin-top: 4px;
        }

        .star {
            font-size: 14px;
            color: #ddd;
        }

        .star.filled {
            color: var(--accent-light);
        }

        /* ===== 答题界面 ===== */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .progress-bar {
            flex: 1;
            height: 16px;
            background: var(--border);
            border-radius: 8px;
            overflow: hidden;
            margin-right: 12px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            border-radius: 8px;
            transition: width 0.3s ease;
        }

        .quit-btn {
            background: none;
            border: 2px solid var(--border);
            width: 36px;
            height: 36px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            color: var(--text-light);
        }

        .question-card {
            background: var(--card);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .question-type {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .question-text {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .question-hint {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 20px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid var(--border);
            border-radius: 16px;
            background: var(--card);
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            text-align: left;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: inherit;
            color: var(--text);
        }

        .option-btn:hover:not(:disabled) {
            background: #f0f0f0;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(2px);
        }

        .option-btn.correct {
            border-color: var(--success);
            background: #e8f5d6;
            color: var(--primary-dark);
        }

        .option-btn.wrong {
            border-color: var(--danger);
            background: #ffe5e5;
            color: var(--danger-dark);
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-letter {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 14px;
            flex-shrink: 0;
        }

        .option-btn.correct .option-letter {
            background: var(--success);
            color: white;
        }

        .option-btn.wrong .option-letter {
            background: var(--danger);
            color: white;
        }

        /* 底部操作区 */
        .action-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card);
            padding: 16px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
            z-index: 50;
        }

        .action-inner {
            max-width: 480px;
            margin: 0 auto;
        }

        .check-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: var(--border);
            color: #aaa;
            font-size: 16px;
            font-weight: 800;
            cursor: not-allowed;
            transition: all 0.2s;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 1px;
            pointer-events: none;
        }

        .check-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            box-shadow: var(--shadow-primary);
            cursor: pointer;
            pointer-events: auto;
        }

        .check-btn.active:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .check-btn.correct {
            background: linear-gradient(135deg, var(--success), var(--primary-light));
            pointer-events: auto;
            cursor: pointer;
            color: white;
        }

        .check-btn.wrong {
            background: linear-gradient(135deg, var(--danger), var(--danger-dark));
            pointer-events: auto;
            cursor: pointer;
            color: white;
        }

        /* 反馈动画 */
        .feedback-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .feedback-text {
            font-size: 48px;
            font-weight: 900;
            opacity: 0;
            transform: scale(0.5);
        }

        .feedback-text.show {
            animation: feedbackPop 0.8s ease forwards;
        }

        @keyframes feedbackPop {
            0% { opacity: 0; transform: scale(0.5) rotate(-10deg); }
            30% { opacity: 1; transform: scale(1.2) rotate(5deg); }
            60% { transform: scale(0.95) rotate(-2deg); }
            100% { opacity: 0; transform: scale(1) rotate(0deg) translateY(-100px); }
        }

        /* 连击提示 */
        .streak-popup {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 16px;
            box-shadow: 0 4px 16px rgba(255, 150, 0, 0.4);
            opacity: 0;
            z-index: 150;
            pointer-events: none;
            white-space: nowrap;
        }

        .streak-popup.show {
            animation: streakIn 0.5s ease forwards;
        }

        @keyframes streakIn {
            0% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            50% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.1); }
            100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
        }

        /* XP 获得动画 */
        .xp-float {
            position: fixed;
            font-weight: 900;
            font-size: 20px;
            color: var(--accent);
            pointer-events: none;
            z-index: 150;
            opacity: 0;
        }

        .xp-float.show {
            animation: xpFloat 1s ease forwards;
        }

        @keyframes xpFloat {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-80px); }
        }

        /* ===== 结果界面 ===== */
        .result-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .result-emoji {
            font-size: 80px;
            margin-bottom: 16px;
        }

        .result-title {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .result-subtitle {
            font-size: 16px;
            color: var(--text-light);
            margin-bottom: 32px;
        }

        .result-stats {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-bottom: 32px;
        }

        .result-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .result-stat-value {
            font-size: 32px;
            font-weight: 900;
            color: var(--primary);
        }

        .result-stat-label {
            font-size: 14px;
            color: var(--text-light);
            font-weight: 600;
        }

        .continue-btn {
            width: 100%;
            max-width: 320px;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: var(--shadow-primary);
            font-family: inherit;
            transition: all 0.2s;
        }

        .continue-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* ===== 等级提升弹窗 ===== */
        .levelup-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 300;
            padding: 20px;
        }

        .levelup-modal.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .levelup-card {
            background: var(--card);
            border-radius: 24px;
            padding: 40px 32px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            animation: scaleIn 0.4s ease;
        }

        @keyframes scaleIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .levelup-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .levelup-title {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .levelup-text {
            font-size: 16px;
            color: var(--text-light);
            margin-bottom: 24px;
        }

        .levelup-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: white;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 0 #d48000;
            font-family: inherit;
        }

        /* 底部占位 */
        .bottom-spacer {
            height: 100px;
        }

        /* 响应式 */
        @media (max-width: 400px) {
            .question-text { font-size: 18px; }
            .option-btn { padding: 14px 16px; font-size: 15px; }
        }
    </style>
</head>
<body>

<!-- 顶部状态栏 -->
<div class="top-bar">
    <div class="logo">
        <div class="logo-icon">🐮</div>
        <span>牛牛学院</span>
    </div>
    <div class="stats">
        <div class="stat-item streak">
            <span class="stat-icon">🔥</span>
            <span id="streakDisplay">3</span>
        </div>
        <div class="stat-item xp">
            <span class="stat-icon">⚡</span>
            <span id="xpDisplay">120</span>
        </div>
        <div class="stat-item gems">
            <span class="stat-icon">💎</span>
            <span id="gemsDisplay">50</span>
        </div>
    </div>
</div>

<div class="main-container">

    <!-- ===== 关卡选择界面 ===== -->
    <div class="screen active" id="levelScreen">
        <div style="text-align: center; margin-bottom: 8px;">
            <h2 style="font-size: 22px; font-weight: 800;">股票入门之路</h2>
            <p style="color: var(--text-light); font-size: 14px; margin-top: 4px;">第 1 单元 · 投资小白变达人</p>
        </div>

        <div class="path-container">
            <div class="path-line"></div>

            <div class="level-node">
                <button class="level-btn completed" onclick="startLevel(0)">
                    🌟
                </button>
                <div class="level-label">什么是股票</div>
                <div class="level-stars">
                    <span class="star filled">★</span>
                    <span class="star filled">★</span>
                    <span class="star filled">★</span>
                </div>
            </div>

            <div class="level-node">
                <button class="level-btn completed" onclick="startLevel(1)">
                    📈
                </button>
                <div class="level-label">K线基础</div>
                <div class="level-stars">
                    <span class="star filled">★</span>
                    <span class="star filled">★</span>
                    <span class="star">★</span>
                </div>
            </div>

            <div class="level-node">
                <button class="level-btn available" onclick="startLevel(2)" id="currentLevelBtn">
                    3
                </button>
                <div class="level-label">市盈率入门</div>
                <div class="level-stars">
                    <span class="star">★</span>
                    <span class="star">★</span>
                    <span class="star">★</span>
                </div>
            </div>

            <div class="level-node">
                <button class="level-btn locked">
                    🔒
                </button>
                <div class="level-label">成交量解密</div>
                <div class="level-stars">
                    <span class="star">★</span>
                    <span class="star">★</span>
                    <span class="star">★</span>
                </div>
            </div>

            <div class="level-node">
                <button class="level-btn locked">
                    🔒
                </button>
                <div class="level-label">财报速读</div>
                <div class="level-stars">
                    <span class="star">★</span>
                    <span class="star">★</span>
                    <span class="star">★</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 答题界面 ===== -->
    <div class="screen" id="quizScreen">
        <div class="quiz-header">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <button class="quit-btn" onclick="quitQuiz()">✕</button>
        </div>

        <div class="question-card">
            <div class="question-type" id="questionType">选择题</div>
            <div class="question-text" id="questionText">加载中...</div>
            <div class="question-hint" id="questionHint">选择最符合题意的答案</div>
            <div class="options-list" id="optionsList"></div>
        </div>

        <div class="bottom-spacer"></div>
    </div>

    <!-- ===== 结果界面 ===== -->
    <div class="screen" id="resultScreen">
        <div class="result-screen">
            <div class="result-emoji" id="resultEmoji">🎉</div>
            <div class="result-title" id="resultTitle">太棒了！</div>
            <div class="result-subtitle" id="resultSubtitle">你已完成本关所有题目</div>

            <div class="result-stats">
                <div class="result-stat">
                    <div class="result-stat-value" id="resultXP">+45</div>
                    <div class="result-stat-label">获得经验</div>
                </div>
                <div class="result-stat">
                    <div class="result-stat-value" id="resultAccuracy">100%</div>
                    <div class="result-stat-label">正确率</div>
                </div>
                <div class="result-stat">
                    <div class="result-stat-value" id="resultStreak">5</div>
                    <div class="result-stat-label">最高连击</div>
                </div>
            </div>

            <button class="continue-btn" onclick="backToLevels()">继续闯关</button>
        </div>
    </div>

</div>

<!-- 底部操作区 -->
<div class="action-area" id="actionArea" style="display: none;">
    <div class="action-inner">
        <button class="check-btn" id="checkBtn" onclick="checkAnswer()">检查答案</button>
    </div>
</div>

<!-- 反馈动画 -->
<div class="feedback-overlay" id="feedbackOverlay">
    <div class="feedback-text" id="feedbackText">正确！</div>
</div>

<!-- 连击提示 -->
<div class="streak-popup" id="streakPopup">🔥 3 连击！</div>

<!-- 等级提升弹窗 -->
<div class="levelup-modal" id="levelupModal">
    <div class="levelup-card">
        <div class="levelup-icon">🎓</div>
        <div class="levelup-title">等级提升！</div>
        <div class="levelup-text">恭喜你升到 <strong>Level 3</strong><br>解锁新称号：股市小学徒</div>
        <button class="levelup-btn" onclick="closeLevelUp()">太棒了！</button>
    </div>
</div>

<script>
// ===== 游戏数据 =====
const levels = [
    {
        title: "什么是股票",
        questions: [
            {
                type: "概念题",
                text: "股票本质上代表了什么？",
                hint: "想想你买了股票后，你和公司是什么关系？",
                options: [
                    { text: "公司欠你一笔钱", correct: false },
                    { text: "你拥有公司的一部分所有权", correct: true },
                    { text: "你可以随意进入公司", correct: false },
                    { text: "公司必须给你分红", correct: false }
                ],
                explanation: "股票代表对公司的部分所有权，股东是公司的所有者之一。"
            }
        ]
    },
    {
        title: "K线基础",
        questions: [
            {
                type: "识图题",
                text: "如果一根K线的收盘价高于开盘价，通常是什么颜色？",
                hint: "在中国股市中，上涨通常用什么颜色表示？",
                options: [
                    { text: "绿色", correct: false },
                    { text: "红色", correct: true },
                    { text: "蓝色", correct: false },
                    { text: "黄色", correct: false }
                ],
                explanation: "中国股市中，红色K线表示上涨（收盘价>开盘价），绿色表示下跌。"
            }
        ]
    },
    {
        title: "市盈率入门",
        questions: [
            {
                type: "计算题",
                text: "某公司股票价格 100 元，每股收益 5 元，市盈率是多少？",
                hint: "市盈率 = 股价 ÷ 每股收益",
                options: [
                    { text: "5 倍", correct: false },
                    { text: "10 倍", correct: false },
                    { text: "20 倍", correct: true },
                    { text: "25 倍", correct: false }
                ],
                explanation: "市盈率 = 100 ÷ 5 = 20 倍，表示投资者愿意为每1元收益支付20元。"
            },
            {
                type: "概念题",
                text: "市盈率（PE）越低，通常意味着什么？",
                hint: "从投资回收的角度思考",
                options: [
                    { text: "股票一定更值得买", correct: false },
                    { text: "投资回收期可能更短", correct: true },
                    { text: "公司一定在成长", correct: false },
                    { text: "股价一定会涨", correct: false }
                ],
                explanation: "低PE意味着相对每股收益而言股价较低，回收投资成本的时间可能更短，但不代表一定值得买。"
            },
            {
                type: "应用题",
                text: "以下哪种情况，市盈率指标可能「失效」？",
                hint: "什么情况下每股收益会失去参考意义？",
                options: [
                    { text: "公司处于亏损状态", correct: true },
                    { text: "股价上涨", correct: false },
                    { text: "市场牛市", correct: false },
                    { text: "公司分红", correct: false }
                ],
                explanation: "亏损公司每股收益为负数，市盈率失去意义，需要用其他指标分析。"
            },
            {
                type: "对比题",
                text: "市盈率和市净率（PB）的主要区别是？",
                hint: "两个指标的分母分别是什么？",
                options: [
                    { text: "PE看盈利，PB看净资产", correct: true },
                    { text: "PE看股价，PB看市值", correct: false },
                    { text: "没有区别，是一样的", correct: false },
                    { text: "PE用于短线，PB用于长线", correct: false }
                ],
                explanation: "市盈率（PE）= 股价/每股收益；市净率（PB）= 股价/每股净资产。"
            }
        ]
    }
];

// ===== 游戏状态 =====
let currentLevel = 2;
let currentQuestion = 0;
let selectedOption = null;
let score = 0;
let streak = 3;
let maxStreak = 3;
let xp = 120;
let gems = 50;
let answered = false;

// ===== 界面切换 =====
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

// ===== 开始关卡 =====
function startLevel(levelIndex) {
    const level = levels[levelIndex];
    if (!level) return;

    currentLevel = levelIndex;
    currentQuestion = 0;
    score = 0;
    maxStreak = streak;
    answered = false;
    selectedOption = null;

    showScreen('quizScreen');
    document.getElementById('actionArea').style.display = 'block';
    loadQuestion();
}

// ===== 加载题目 =====
function loadQuestion() {
    const level = levels[currentLevel];
    const q = level.questions[currentQuestion];

    answered = false;
    selectedOption = null;

    // 更新进度
    const progress = ((currentQuestion) / level.questions.length) * 100;
    document.getElementById('progressFill').style.width = progress + '%';

    // 更新题目
    document.getElementById('questionType').textContent = q.type;
    document.getElementById('questionText').textContent = q.text;
    document.getElementById('questionHint').textContent = q.hint;

    // 生成选项
    const optionsHtml = q.options.map((opt, i) => `
        <button class="option-btn" onclick="selectOption(${i})" data-index="${i}">
            <span class="option-letter">${String.fromCharCode(65 + i)}</span>
            <span>${opt.text}</span>
        </button>
    `).join('');
    document.getElementById('optionsList').innerHTML = optionsHtml;

    // 重置检查按钮
    const checkBtn = document.getElementById('checkBtn');
    checkBtn.textContent = '检查答案';
    checkBtn.className = 'check-btn';
    checkBtn.onclick = checkAnswer;
}

// ===== 选择选项 =====
function selectOption(index) {
    if (answered) return;

    selectedOption = index;

    // 更新选项样式
    document.querySelectorAll('.option-btn').forEach((btn, i) => {
        if (i === index) {
            btn.style.borderColor = 'var(--secondary)';
            btn.style.background = '#e6f7ff';
        } else {
            btn.style.borderColor = 'var(--border)';
            btn.style.background = 'var(--card)';
        }
    });

    // 激活检查按钮
    const checkBtn = document.getElementById('checkBtn');
    checkBtn.classList.add('active');
}

// ===== 检查答案 =====
function checkAnswer() {
    if (selectedOption === null || answered) return;

    answered = true;
    const level = levels[currentLevel];
    const q = level.questions[currentQuestion];
    const isCorrect = q.options[selectedOption].correct;

    const checkBtn = document.getElementById('checkBtn');
    const optionBtns = document.querySelectorAll('.option-btn');

    // 显示正确答案
    optionBtns.forEach((btn, i) => {
        btn.disabled = true;
        if (q.options[i].correct) {
            btn.classList.add('correct');
        } else if (i === selectedOption && !isCorrect) {
            btn.classList.add('wrong');
        }
    });

    if (isCorrect) {
        // 正确
        score++;
        streak++;
        if (streak > maxStreak) maxStreak = streak;

        const xpGain = 10 + (streak > 1 ? 5 : 0);
        xp += xpGain;

        checkBtn.textContent = '下一题';
        checkBtn.className = 'check-btn correct active';

        showFeedback('正确！', 'correct');
        showXPFloating(xpGain);

        if (streak >= 3) {
            showStreakPopup(streak);
        }
    } else {
        // 错误
        streak = 0;
        checkBtn.textContent = '下一题';
        checkBtn.className = 'check-btn wrong active';

        showFeedback('再想想', 'wrong');
    }

    updateStats();

    // 更改按钮行为为下一题
    checkBtn.onclick = nextQuestion;
}

// ===== 下一题 =====
function nextQuestion() {
    const level = levels[currentLevel];
    currentQuestion++;

    if (currentQuestion >= level.questions.length) {
        // 关卡完成
        showResult();
    } else {
        loadQuestion();
    }
}

// ===== 显示结果 =====
function showResult() {
    document.getElementById('actionArea').style.display = 'none';
    showScreen('resultScreen');

    const level = levels[currentLevel];
    const accuracy = Math.round((score / level.questions.length) * 100);
    const xpGain = score * 10 + (accuracy === 100 ? 20 : 0);

    document.getElementById('resultEmoji').textContent = accuracy >= 80 ? '🎉' : accuracy >= 60 ? '👍' : '💪';
    document.getElementById('resultTitle').textContent = accuracy >= 80 ? '太棒了！' : accuracy >= 60 ? '做得不错！' : '继续加油！';
    document.getElementById('resultSubtitle').textContent = `已完成「${level.title}」`;
    document.getElementById('resultXP').textContent = '+' + xpGain;
    document.getElementById('resultAccuracy').textContent = accuracy + '%';
    document.getElementById('resultStreak').textContent = maxStreak;

    xp += xpGain;
    gems += score >= level.questions.length ? 5 : 2;
    updateStats();

    // 检查升级
    if (xp >= 150 && xp - xpGain < 150) {
        setTimeout(() => {
            document.getElementById('levelupModal').classList.add('show');
        }, 800);
    }
}

// ===== 返回关卡列表 =====
function backToLevels() {
    document.getElementById('actionArea').style.display = 'none';
    showScreen('levelScreen');

    // 更新当前关卡按钮状态
    const btn = document.getElementById('currentLevelBtn');
    if (btn) {
        btn.textContent = '🌟';
        btn.className = 'level-btn completed';
    }
}

// ===== 退出答题 =====
function quitQuiz() {
    if (confirm('确定要退出当前关卡吗？进度将不会保存。')) {
        document.getElementById('actionArea').style.display = 'none';
        showScreen('levelScreen');
    }
}

// ===== 更新状态显示 =====
function updateStats() {
    document.getElementById('streakDisplay').textContent = streak;
    document.getElementById('xpDisplay').textContent = xp;
    document.getElementById('gemsDisplay').textContent = gems;
}

// ===== 显示反馈动画 =====
function showFeedback(text, type) {
    const el = document.getElementById('feedbackText');
    el.textContent = text;
    el.style.color = type === 'correct' ? 'var(--primary)' : 'var(--danger)';
    el.classList.remove('show');
    void el.offsetWidth; // 触发重排
    el.classList.add('show');
}

// ===== 显示连击提示 =====
function showStreakPopup(count) {
    const el = document.getElementById('streakPopup');
    el.textContent = `🔥 ${count} 连击！`;
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');

    setTimeout(() => {
        el.classList.remove('show');
    }, 2000);
}

// ===== 显示XP浮动 =====
function showXPFloating(amount) {
    const el = document.createElement('div');
    el.className = 'xp-float';
    el.textContent = '+' + amount + ' XP';
    el.style.left = (window.innerWidth / 2 + Math.random() * 60 - 30) + 'px';
    el.style.top = '200px';
    document.body.appendChild(el);

    void el.offsetWidth;
    el.classList.add('show');

    setTimeout(() => el.remove(), 1000);
}

// ===== 关闭升级弹窗 =====
function closeLevelUp() {
    document.getElementById('levelupModal').classList.remove('show');
}

// 初始化
updateStats();
</script>
