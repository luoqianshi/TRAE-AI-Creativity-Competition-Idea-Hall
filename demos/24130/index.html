<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>动物语言转化助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Quicksand:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-deep:#030b08;
  --bg-mid:#0a1f16;
  --bg-surface:rgba(8,28,20,0.7);
  --bio-cyan:#00f5d4;
  --bio-green:#39ff8e;
  --bio-teal:#0abab5;
  --bio-amber:#f0c040;
  --bio-rose:#ff6b9d;
  --bio-violet:#a78bfa;
  --glow-cyan:0 0 20px rgba(0,245,212,0.4);
  --text-primary:#e8f5e9;
  --text-secondary:rgba(200,235,215,0.65);
  --text-dim:rgba(200,235,215,0.4);
  --glass-border:1px solid rgba(0,245,212,0.12);
  --radius:18px;
  --radius-sm:12px;
  --radius-xs:8px;
  --font-display:'Cinzel',serif;
  --font-body:'Quicksand','Noto Sans SC',sans-serif;
  --accent:#00f5d4;
}
html{font-size:16px;scroll-behavior:smooth}
body{
  font-family:var(--font-body);
  background:var(--bg-deep);
  color:var(--text-primary);
  min-height:100vh;
  overflow-x:hidden;
}
#particleCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.bg-gradient{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 60% at 20% 80%,rgba(0,245,212,0.05) 0%,transparent 70%),
    radial-gradient(ellipse 60% 50% at 80% 20%,rgba(57,255,142,0.035) 0%,transparent 70%),
    radial-gradient(ellipse 100% 100% at 50% 50%,rgba(10,186,181,0.025) 0%,transparent 60%);
}
.app-container{position:relative;z-index:1;max-width:1140px;margin:0 auto;padding:20px 24px 60px}

/* ===== 头部 ===== */
.header{text-align:center;padding:36px 0 24px;animation:fadeDown .8s ease-out}
.header h1{
  font-family:var(--font-display);font-size:clamp(1.6rem,3.8vw,2.6rem);
  font-weight:700;letter-spacing:.06em;
  background:linear-gradient(135deg,var(--bio-cyan),var(--bio-green),var(--bio-amber));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:8px;
}
.header .subtitle{font-size:.88rem;color:var(--text-secondary);font-weight:300;letter-spacing:.14em}
.deco-line{width:100px;height:1px;margin:14px auto 0;background:linear-gradient(90deg,transparent,var(--bio-cyan),transparent)}

/* ===== 动物网格 ===== */
.animal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:24px 0}
.animal-card{
  position:relative;background:var(--bg-surface);border:var(--glass-border);
  border-radius:var(--radius);padding:18px 10px 14px;text-align:center;cursor:pointer;
  transition:all .35s cubic-bezier(.25,.46,.45,.94);backdrop-filter:blur(10px);overflow:hidden;
}
.animal-card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(circle at 50% 120%,var(--accent-glow,rgba(0,245,212,0.1)),transparent 70%);
  opacity:0;transition:opacity .35s;
}
.animal-card:hover::before,.animal-card.active::before{opacity:1}
.animal-card:hover{transform:translateY(-3px);border-color:rgba(0,245,212,0.3);box-shadow:0 8px 30px rgba(0,245,212,0.08)}
.animal-card.active{border-color:var(--accent);box-shadow:0 0 24px rgba(0,245,212,0.15),inset 0 0 30px rgba(0,245,212,0.04)}
.animal-card .emoji{font-size:2rem;margin-bottom:6px;display:block;transition:transform .3s}
.animal-card:hover .emoji,.animal-card.active .emoji{transform:scale(1.12)}
.animal-card .name{font-size:.82rem;font-weight:600;color:var(--text-primary);letter-spacing:.04em}
.animal-card .sci-name{font-size:.62rem;color:var(--text-dim);font-style:italic;margin-top:2px}

/* ===== 知识面板 ===== */
.knowledge-panel{
  background:var(--bg-surface);border:var(--glass-border);border-radius:var(--radius);
  padding:20px 24px;margin:20px 0;backdrop-filter:blur(14px);
  display:grid;grid-template-columns:1fr 1fr;gap:20px;
  animation:fadeUp .5s ease-out;
}
.kp-header{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin-bottom:4px}
.kp-header .kp-emoji{font-size:2.2rem}
.kp-header .kp-title{flex:1}
.kp-header .kp-title h3{font-family:var(--font-display);font-size:.9rem;letter-spacing:.1em;color:var(--accent)}
.kp-header .kp-title .kp-latin{font-size:.7rem;color:var(--text-dim);font-style:italic;margin-top:2px}
.kp-header .kp-badge{
  font-size:.6rem;padding:4px 10px;border-radius:20px;
  background:rgba(0,245,212,0.1);border:1px solid rgba(0,245,212,0.2);color:var(--accent);
  letter-spacing:.08em;font-weight:600;
}
.kp-section{background:rgba(0,0,0,0.2);border-radius:var(--radius-xs);padding:14px}
.kp-section h4{font-size:.72rem;color:var(--accent);letter-spacing:.1em;margin-bottom:8px;font-weight:600;text-transform:uppercase}
.kp-section p{font-size:.78rem;color:var(--text-secondary);line-height:1.65}
.kp-section .fact-tag{
  display:inline-block;font-size:.65rem;padding:3px 8px;margin:3px 2px;
  background:rgba(0,245,212,0.06);border:1px solid rgba(0,245,212,0.1);
  border-radius:12px;color:var(--text-secondary);
}
@media(max-width:700px){.knowledge-panel{grid-template-columns:1fr}}

/* ===== 主面板 ===== */
.main-panel{display:grid;grid-template-columns:1fr 64px 1fr;gap:0;align-items:stretch;margin:24px 0}
@media(max-width:768px){
  .main-panel{grid-template-columns:1fr;gap:16px}
  .swap-btn-wrap{display:flex;justify-content:center;order:0}
  .panel-section{order:1}
}
.panel-section{
  background:var(--bg-surface);border:var(--glass-border);border-radius:var(--radius);
  padding:20px;backdrop-filter:blur(14px);position:relative;overflow:hidden;
}
.panel-section::after{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:conic-gradient(from 0deg,transparent,rgba(0,245,212,0.02),transparent,transparent);
  animation:panelGlow 10s linear infinite;pointer-events:none;
}
.panel-label{
  font-family:var(--font-display);font-size:.68rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.panel-label .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pulse 2s ease-in-out infinite}

/* 交换按钮 */
.swap-btn-wrap{display:flex;align-items:center;justify-content:center}
.swap-btn{
  width:46px;height:46px;border-radius:50%;
  background:rgba(0,245,212,0.08);border:1px solid rgba(0,245,212,0.25);
  color:var(--accent);font-size:1.2rem;cursor:pointer;transition:all .3s;
  display:flex;align-items:center;justify-content:center;
}
.swap-btn:hover{background:rgba(0,245,212,0.18);box-shadow:var(--glow-cyan);transform:rotate(180deg)}

/* 波形 */
.waveform-container{
  height:72px;background:rgba(0,0,0,0.3);border-radius:var(--radius-sm);
  margin:10px 0;overflow:hidden;position:relative;border:1px solid rgba(0,245,212,0.06);
}
.waveform-container canvas{width:100%;height:100%;display:block}

/* 控件 */
.audio-controls{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.ctrl-btn{
  flex:1;min-width:70px;padding:9px 12px;border-radius:var(--radius-xs);
  border:1px solid rgba(0,245,212,0.15);background:rgba(0,245,212,0.05);
  color:var(--accent);font-family:var(--font-body);font-size:.75rem;font-weight:500;
  cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:5px;
}
.ctrl-btn:hover{background:rgba(0,245,212,0.12);border-color:rgba(0,245,212,0.35)}
.ctrl-btn.recording{background:rgba(255,60,60,0.12);border-color:rgba(255,60,60,0.4);color:#ff6b6b;animation:recPulse 1s ease-in-out infinite}
.ctrl-btn .icon{font-size:1rem}

/* 翻译区 */
.translate-area{
  min-height:90px;background:rgba(0,0,0,0.22);border-radius:var(--radius-sm);
  border:1px solid rgba(0,245,212,0.06);padding:12px;margin:10px 0;
}
.translate-area textarea{
  width:100%;height:72px;background:transparent;border:none;outline:none;
  color:var(--text-primary);font-family:var(--font-body);font-size:.88rem;line-height:1.6;resize:none;
}
.translate-area textarea::placeholder{color:var(--text-dim)}
.translate-result{font-size:.88rem;line-height:1.7;color:var(--bio-green);min-height:36px}
.translate-result .animal-sound{
  display:inline-block;background:rgba(0,245,212,0.08);border:1px solid rgba(0,245,212,0.18);
  border-radius:20px;padding:3px 11px;margin:2px;font-size:.8rem;animation:soundPop .4s ease-out;
}
.translate-btn{
  width:100%;padding:12px;border-radius:var(--radius-sm);border:none;
  background:linear-gradient(135deg,rgba(0,245,212,0.18),rgba(57,255,142,0.12));
  color:var(--accent);font-family:var(--font-body);font-size:.9rem;font-weight:600;
  letter-spacing:.1em;cursor:pointer;transition:all .3s;margin-top:10px;
  position:relative;overflow:hidden;
}
.translate-btn::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.06),transparent);transition:left .5s;
}
.translate-btn:hover::before{left:100%}
.translate-btn:hover{box-shadow:var(--glow-cyan);transform:translateY(-1px)}

/* 快捷短语 */
.quick-phrases{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.quick-phrase{
  font-size:.7rem;padding:5px 10px;border-radius:16px;
  background:rgba(0,245,212,0.05);border:1px solid rgba(0,245,212,0.12);
  color:var(--text-secondary);cursor:pointer;transition:all .25s;
}
.quick-phrase:hover{background:rgba(0,245,212,0.12);border-color:rgba(0,245,212,0.3);color:var(--accent)}

/* ===== 音效库 ===== */
.sound-library{margin:24px 0}
.section-title{
  font-family:var(--font-display);font-size:.8rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);margin-bottom:14px;
  display:flex;align-items:center;gap:10px;
}
.section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(0,245,212,0.25),transparent)}
.sound-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.sound-chip{
  background:var(--bg-surface);border:var(--glass-border);border-radius:var(--radius-sm);
  padding:12px;cursor:pointer;transition:all .3s;display:flex;align-items:center;gap:9px;
  backdrop-filter:blur(6px);
}
.sound-chip:hover{border-color:rgba(0,245,212,0.3);box-shadow:0 6px 20px rgba(0,245,212,0.06);transform:translateY(-2px)}
.sound-chip .s-emoji{font-size:1.3rem}
.sound-chip .s-info{flex:1}
.sound-chip .s-name{font-size:.76rem;font-weight:500;color:var(--text-primary)}
.sound-chip .s-type{font-size:.62rem;color:var(--text-dim);margin-top:2px}
.sound-chip .s-play{
  width:28px;height:28px;border-radius:50%;background:rgba(0,245,212,0.08);
  border:1px solid rgba(0,245,212,0.15);color:var(--accent);font-size:.6rem;
  display:flex;align-items:center;justify-content:center;transition:all .3s;flex-shrink:0;
}
.sound-chip:hover .s-play{background:rgba(0,245,212,0.18)}

/* ===== 音频设置 ===== */
.audio-settings{margin:24px 0;background:var(--bg-surface);border:var(--glass-border);border-radius:var(--radius);padding:20px;backdrop-filter:blur(14px)}
.setting-row{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid rgba(0,245,212,0.04)}
.setting-row:last-child{border-bottom:none}
.setting-label{flex:0 0 110px;font-size:.78rem;color:var(--text-secondary)}
.setting-control{flex:1;display:flex;align-items:center;gap:12px}
.setting-control input[type="range"]{
  flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:3px;
  background:rgba(0,245,212,0.12);outline:none;
}
.setting-control input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 8px rgba(0,245,212,0.5);cursor:pointer;
}
.setting-value{font-size:.72rem;color:var(--accent);min-width:36px;text-align:right}
.setting-select{
  flex:1;background:rgba(0,0,0,0.25);border:1px solid rgba(0,245,212,0.15);
  border-radius:6px;color:var(--text-primary);font-family:var(--font-body);font-size:.78rem;padding:7px 10px;outline:none;
}
.setting-select option{background:#0a1f16;color:var(--text-primary)}

/* ===== 历史 ===== */
.history-panel{margin:24px 0}
.history-list{display:flex;flex-direction:column;gap:6px}
.history-item{
  background:var(--bg-surface);border:var(--glass-border);border-radius:var(--radius-sm);
  padding:10px 14px;display:flex;align-items:center;gap:10px;backdrop-filter:blur(6px);
  animation:fadeUp .3s ease-out;
}
.history-item .h-icon{font-size:1.1rem;flex-shrink:0}
.history-item .h-content{flex:1;min-width:0}
.history-item .h-source{font-size:.72rem;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-item .h-arrow{color:var(--accent);font-size:.72rem;flex-shrink:0}
.history-item .h-result{font-size:.76rem;color:var(--bio-green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-item .h-time{font-size:.6rem;color:var(--text-dim);flex-shrink:0}

/* ===== 状态栏 ===== */
.status-bar{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;font-size:.72rem;color:var(--text-secondary);letter-spacing:.05em}
.status-dot{width:5px;height:5px;border-radius:50%;background:var(--bio-green);box-shadow:0 0 8px var(--bio-green);animation:pulse 2s ease-in-out infinite}
.footer{text-align:center;padding:24px 0 8px;font-size:.65rem;color:var(--text-dim);letter-spacing:.1em}

/* ===== 动画 ===== */
@keyframes fadeDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,60,60,0.25)}50%{box-shadow:0 0 0 8px rgba(255,60,60,0)}}
@keyframes panelGlow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes soundPop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}

/* 滚动条 */
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(0,245,212,0.15);border-radius:3px}
@media(max-width:600px){
  .app-container{padding:12px 12px 40px}
  .animal-grid{grid-template-columns:repeat(4,1fr);gap:8px}
  .animal-card{padding:12px 6px 10px}
  .animal-card .emoji{font-size:1.6rem}
  .panel-section{padding:14px}
  .sound-grid{grid-template-columns:1fr 1fr}
  .audio-settings .setting-row{flex-direction:column;align-items:flex-start;gap:6px}
  .setting-label{flex:none}
}
</style>
</head>
<body>

<canvas id="particleCanvas"></canvas>
<div class="bg-gradient"></div>

<div class="app-container">
  <header class="header">
    <h1>动物语言转化助手</h1>
    <p class="subtitle">跨物种交流 · 聆听自然之声</p>
    <div class="deco-line"></div>
  </header>

  <div class="animal-grid" id="animalGrid"></div>

  <div class="knowledge-panel" id="knowledgePanel"></div>

  <div class="main-panel">
    <div class="panel-section" id="humanPanel">
      <div class="panel-label"><span class="dot"></span>人类语言</div>
      <div class="waveform-container"><canvas id="humanWaveform"></canvas></div>
      <div class="audio-controls">
        <button class="ctrl-btn" id="btnRecordHuman" onclick="toggleRecord('human')"><span class="icon">🎤</span> 录音</button>
        <button class="ctrl-btn" id="btnPlayHuman" onclick="playRecordedAudio('human')"><span class="icon">▶</span> 播放</button>
        <button class="ctrl-btn" id="btnStopHuman" onclick="stopAudio('human')"><span class="icon">⏹</span> 停止</button>
      </div>
      <div class="translate-area">
        <textarea id="humanText" placeholder="输入你想对动物说的话..."></textarea>
      </div>
      <div class="quick-phrases" id="quickPhrases"></div>
      <button class="translate-btn" onclick="translate('humanToAnimal')">✦ 转化为动物语言 ✦</button>
    </div>

    <div class="swap-btn-wrap">
      <button class="swap-btn" onclick="swapPanels()" title="交换翻译方向">⇄</button>
    </div>

    <div class="panel-section" id="animalPanel">
      <div class="panel-label"><span class="dot" style="background:var(--bio-green);box-shadow:0 0 8px var(--bio-green)"></span>动物语言</div>
      <div class="waveform-container"><canvas id="animalWaveform"></canvas></div>
      <div class="audio-controls">
        <button class="ctrl-btn" id="btnRecordAnimal" onclick="toggleRecord('animal')"><span class="icon">🎤</span> 录音</button>
        <button class="ctrl-btn" id="btnPlayAnimal" onclick="playRecordedAudio('animal')"><span class="icon">▶</span> 播放</button>
        <button class="ctrl-btn" id="btnStopAnimal" onclick="stopAudio('animal')"><span class="icon">⏹</span> 停止</button>
      </div>
      <div class="translate-area">
        <div class="translate-result" id="animalResult">
          <span style="color:var(--text-dim);font-size:.8rem">等待翻译结果...</span>
        </div>
      </div>
      <button class="translate-btn" onclick="translate('animalToHuman')">✦ 转化为人类语言 ✦</button>
    </div>
  </div>

  <div class="sound-library">
    <div class="section-title">动物音效库</div>
    <div class="sound-grid" id="soundGrid"></div>
  </div>

  <div class="audio-settings">
    <div class="section-title">音频设置</div>
    <div class="setting-row">
      <div class="setting-label">音量</div>
      <div class="setting-control">
        <input type="range" id="volumeSlider" min="0" max="100" value="75" oninput="updateSetting('volume',this.value)">
        <span class="setting-value" id="volumeValue">75%</span>
      </div>
    </div>
    <div class="setting-row">
      <div class="setting-label">语速</div>
      <div class="setting-control">
        <input type="range" id="speedSlider" min="50" max="200" value="100" oninput="updateSetting('speed',this.value)">
        <span class="setting-value" id="speedValue">1.0x</span>
      </div>
    </div>
    <div class="setting-row">
      <div class="setting-label">音调</div>
      <div class="setting-control">
        <input type="range" id="pitchSlider" min="50" max="200" value="100" oninput="updateSetting('pitch',this.value)">
        <span class="setting-value" id="pitchValue">1.0</span>
      </div>
    </div>
    <div class="setting-row">
      <div class="setting-label">音频格式</div>
      <div class="setting-control">
        <select class="setting-select" id="audioFormat">
          <option value="wav">WAV (无损)</option>
          <option value="mp3" selected>MP3 (压缩)</option>
          <option value="ogg">OGG (开源)</option>
        </select>
      </div>
    </div>
    <div class="setting-row">
      <div class="setting-label">采样率</div>
      <div class="setting-control">
        <select class="setting-select" id="sampleRate">
          <option value="22050">22.05 kHz</option>
          <option value="44100" selected>44.1 kHz</option>
          <option value="48000">48 kHz</option>
        </select>
      </div>
    </div>
  </div>

  <div class="history-panel">
    <div class="section-title">翻译历史</div>
    <div class="history-list" id="historyList">
      <div class="history-item" style="justify-content:center;color:var(--text-dim);font-size:.78rem;padding:18px">暂无翻译记录</div>
    </div>
  </div>

  <div class="status-bar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">就绪 · 等待输入</span>
  </div>
  <div class="footer">ANIMAL LANGUAGE TRANSLATOR · 跨越物种的对话</div>
</div>

<script>
// ═══════════════════════════════════════════
//  状态
// ═══════════════════════════════════════════
const S = {
  animal: 'dog', isRecording: false, recSource: null,
  audioCtx: null, mediaRec: null, chunks: [],
  humanUrl: null, animalUrl: null, animFrame: null,
  history: [], vol: .75, speed: 1, pitch: 1,
};

// ═══════════════════════════════════════════

//  初始化
// ═══════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  renderAnimalGrid();

// ═══════════════════════════════════════════
//  动物网格
// ═══════════════════════════════════════════
function renderAnimalGrid() {
  const g = document.getElementById('animalGrid');
  g.innerHTML = '';
  Object.entries(D).forEach(([k, v]) => {
    const d = document.createElement('div');
    d.className = 'animal-card' + (k === S.animal ? ' active' : '');
    d.dataset.animal = k;
    d.onclick = () => selectAnimal(k);
    d.innerHTML = `<span class="emoji">${v.emoji}</span><div class="name">${v.name}</div><div class="sci-name">${v.latin.split(' ')[0]}</div>`;
    g.appendChild(d);
  });
}

function selectAnimal(a) {
  S.animal = a;
  document.querySelectorAll('.animal-card').forEach(c => c.classList.toggle('active', c.dataset.animal === a));
  renderKnowledge(a);
  renderQuickPhrases(a);
  setStatus(`已选择: ${D[a].emoji} ${D[a].name}`);
}

//  知识面板
// ═══════════════════════════════════════════
function renderKnowledge(a) {
  const d = D[a], f = d.facts;
  document.getElementById('knowledgePanel').innerHTML = `
    <div class="kp-header">
      <span class="kp-emoji">${d.emoji}</span>
      <div class="kp-title"><h3>${d.name}</h3><div class="kp-latin">${d.latin}</div></div>
      <span class="kp-badge">${d.badge}</span>

    <div class="kp-section"><h4>交流方式</h4><p>${f.communication}</p></div>
    <div class="kp-section"><h4>物种档案</h4><p>${f.habitat}</p>
      <div style="margin-top:8px">${f.tags.map(t => `<span class="fact-tag">${t}</span>`).join('')}</div>
    </div>
  `;
}

// ═══════════════════════════════════════════
//  音效合成（大幅增强仿真度）
// ═══════════════════════════════════════════
function getCtx() {
  if (!S.audioCtx) S.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return S.audioCtx;
}

function playAnimalSound(animal, sound, canvasId) {
  const ctx = getCtx();
  const now = ctx.currentTime;
  const vol = S.vol;
  const pitch = S.pitch;

  const master = ctx.createGain();
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 2048;
  master.connect(analyser);
  analyser.connect(ctx.destination);

  const baseFreq = sound.freq * pitch;
  const dur = sound.dur / (S.speed > 0 ? S.speed : 1);

  // 根据环境包络类型定制合成链
  switch (sound.env) {
    case 'sharp': // 吠叫类 — 快起快落
      synthSharp(ctx, master, baseFreq, dur, vol);
      break;
    case 'meow': // 猫叫 — 频率滑音
      synthMeow(ctx, master, baseFreq, dur, vol);
      break;
    case 'purr': // 呼噜 — 低频调制
      synthPurr(ctx, master, baseFreq, dur, vol);
      break;
    case 'hiss': // 嘶声 — 噪声
      synthNoise(ctx, master, dur, vol, 1200, 400);
      break;
    case 'howl': // 嚎叫 — 长滑音
      synthHowl(ctx, master, baseFreq, dur, vol);
      break;
    case 'whaleSong': // 鲸歌 — 双正弦调制
      synthWhale(ctx, master, baseFreq, dur, vol);
      break;
    case 'chirp': // 鸟鸣 — 快速啁啾
      synthChirp(ctx, master, baseFreq, dur, vol);
      break;
    case 'click': // 咔嗒 — 脉冲
      synthClick(ctx, master, baseFreq, dur, vol);
      break;
    case 'whistle': // 哨声 — 滑音
      synthWhistle(ctx, master, baseFreq, dur, vol);
      break;
    case 'trumpet': // 大象喇叭 — 和声
      synthTrumpet(ctx, master, baseFreq, dur, vol);
      break;
    case 'rumble': // 次声波 — 低频
      synthRumble(ctx, master, baseFreq, dur, vol);
      break;
    case 'growl': // 低吼 — 噪声+低频
      synthGrowl(ctx, master, baseFreq, dur, vol);
      break;
    case 'breath': // 喘息 — 噪声包络
      synthBreath(ctx, master, dur, vol);
      break;
    default: // 默认正弦波
      synthDefault(ctx, master, baseFreq, dur, vol);
  }

  if (canvasId) drawLiveWave(canvasId, analyser);
  setStatus(`播放: ${D[animal].emoji} ${sound.name}`);
  setTimeout(() => {
    if (canvasId) { cancelAnimationFrame(S.animFrame); initWaveforms(); }
  }, dur * 1000 + 100);
}

// --- 合成器 ---

function synthSharp(ctx, dest, freq, dur, vol) {
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(freq * .6, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(freq, ctx.currentTime + .02);
  osc.frequency.exponentialRampToValueAtTime(freq * .7, ctx.currentTime + dur);
  // 添加谐波
  const osc2 = ctx.createOscillator();
  osc2.type = 'square';
  osc2.frequency.setValueAtTime(freq * 2, ctx.currentTime);
  const g2 = ctx.createGain();
  g2.gain.setValueAtTime(vol * .15, ctx.currentTime);
  g.gain.setValueAtTime(0, ctx.currentTime);
  g.gain.linearRampToValueAtTime(vol * .35, ctx.currentTime + .01);
  g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + dur);
  osc.connect(g); g.connect(dest);
  osc2.connect(g2); g2.connect(dest);
  osc.start(); osc.stop(ctx.currentTime + dur);
  osc2.start(); osc2.stop(ctx.currentTime + dur);
}

function synthMeow(ctx, dest, freq, dur, vol) {
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = 'sine';
  const t = ctx.currentTime;
  osc.frequency.setValueAtTime(freq * .8, t);
  osc.frequency.linearRampToValueAtTime(freq * 1.3, t + dur * .3);
  osc.frequency.linearRampToValueAtTime(freq, t + dur * .7);
  osc.frequency.linearRampToValueAtTime(freq * .7, t + dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol * .3, t + .03);
  g.gain.setValueAtTime(vol * .3, t + dur * .5);
  g.gain.exponentialRampToValueAtTime(.001, t + dur);
  osc.connect(g); g.connect(dest);
  osc.start(t); osc.stop(t + dur);
  // 呼噜声叠加
  if (dur > .4) {
    const lfo = ctx.createOscillator();
    const lfoG = ctx.createGain();
    lfo.frequency.value = 25;
    lfoG.gain.value = vol * .08;
    lfo.connect(lfoG); lfoG.connect(dest);
    lfo.start(t); lfo.stop(t + dur);
  }
}

function synthPurr(ctx, dest, freq, dur, vol) {
  const t = ctx.currentTime;
  // 主低频
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  // LFO 调制音量产生"呼噜"节奏
  const lfo = ctx.createOscillator();
  const lfoG = ctx.createGain();
  lfo.frequency.value = 4.5; // 4.5Hz 呼噜节奏
  lfoG.gain.value = vol * .2;
  lfo.connect(lfoG);
  g.gain.value = vol * .15;
  osc.connect(g); g.connect(dest);
  lfoG.connect(g.gain);
  osc.start(t); lfo.start(t);
  osc.stop(t + dur); lfo.stop(t + dur);
}

function synthNoise(ctx, dest, dur, vol, hiFreq, loFreq) {
  const t = ctx.currentTime;
  const bufferSize = ctx.sampleRate * dur;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = (hiFreq + loFreq) / 2;
  bp.Q.value = 0.5;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol * .2, t + .02);
  g.gain.setValueAtTime(vol * .2, t + dur * .5);
  g.gain.exponentialRampToValueAtTime(.001, t + dur);
  src.connect(bp); bp.connect(g); g.connect(dest);
  src.start(t); src.stop(t + dur);
}

function synthHowl(ctx, dest, freq, dur, vol) {
  const t = ctx.currentTime;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq * .7, t);
  osc.frequency.linearRampToValueAtTime(freq * 1.1, t + dur * .3);
  osc.frequency.setValueAtTime(freq * 1.1, t + dur * .6);
  osc.frequency.linearRampToValueAtTime(freq * .8, t + dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol * .25, t + dur * .1);
  g.gain.setValueAtTime(vol * .25, t + dur * .7);
  g.gain.exponentialRampToValueAtTime(.001, t + dur);
  osc.connect(g); g.connect(dest);
  // 第二谐波
  const osc2 = ctx.createOscillator();
  const g2 = ctx.createGain();
  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(freq * 1.5, t);
  osc2.frequency.linearRampToValueAtTime(freq * 2, t + dur * .3);
  osc2.frequency.linearRampToValueAtTime(freq * 1.5, t + dur);
  g2.gain.setValueAtTime(0, t);
  g2.gain.linearRampToValueAtTime(vol * .08, t + dur * .15);
  g2.gain.exponentialRampToValueAtTime(.001, t + dur);
  osc2.connect(g2); g2.connect(dest);
  osc.start(t); osc2.start(t);
  osc.stop(t + dur); osc2.stop(t + dur);
}

function synthWhale(ctx, dest, freq, dur, vol) {
  const t = ctx.currentTime;
  // FM 合成 — 深海鲸歌
  const carrier = ctx.createOscillator();
  const modulator = ctx.createOscillator();
  const modGain = ctx.createGain();
  const outGain = ctx.createGain();

  carrier.type = 'sine';
  carrier.frequency.setValueAtTime(freq, t);
  carrier.frequency.linearRampToValueAtTime(freq * .6, t + dur * .5);
  carrier.frequency.linearRampToValueAtTime(freq * .9, t + dur);

  modulator.type = 'sine';
  modulator.frequency.setValueAtTime(freq * 2.5, t);
  modulator.frequency.linearRampToValueAtTime(freq * 1.5, t + dur);
  modGain.gain.value = freq * .8;

  modulator.connect(modGain);
  modGain.connect(carrier.frequency);

  outGain.gain.setValueAtTime(0, t);
  outGain.gain.linearRampToValueAtTime(vol * .2, t + dur * .1);
  outGain.gain.setValueAtTime(vol * .2, t + dur * .7);
  outGain.gain.exponentialRampToValueAtTime(.001, t + dur);

  carrier.connect(outGain); outGain.connect(dest);
  carrier.start(t); modulator.start(t);
  carrier.stop(t + dur); modulator.stop(t + dur);
}

function synthChirp(ctx, dest, freq, dur, vol) {
  const t = ctx.currentTime;
  // 快速啁啾序列
  const notes = [1, 1.3, 1.5, 1.2, 1.6];
  const noteDur = dur / notes.length;
  notes.forEach((n, i) => {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq * n, t + i * noteDur);
    osc.frequency.linearRampToValueAtTime(freq * n * 1.2, t + i * noteDur + noteDur * .5);
    osc.frequency.linearRampToValueAtTime(freq * n * .9, t + i * noteDur + noteDur);
    g.gain.setValueAtTime(0, t + i * noteDur);
    g.gain.linearRampToValueAtTime(vol * .2, t + i * noteDur + .01);
    g.gain.exponentialRampToValueAtTime(.001, t + (i + 1) * noteDur);
    osc.connect(g); g.connect(dest);
    osc.start(t + i * noteDur); osc.stop(t + (i + 1) * noteDur);
  });
}

function synthClick(ctx, dest, freq, dur, vol) {
  const t = ctx.currentTime;
  const count = Math.max(3, Math.floor(dur * 30));
  for (let i = 0; i < count; i++) {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    const st = t + i / 30;
    g.gain.setValueAtTime(vol * .15, st);
    g.gain.exponentialRampToValueAtTime(.001, st + .003);
    osc.connect(g); g.connect(dest);
    osc.start(st); osc.stop(st + .005);
  }
}

function synthWhistle(ctx, dest, freq, dur, vol) {
  const t = ctx.currentTime;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq * .8, t);
  osc.frequency.linearRampToValueAtTime(freq * 1.4, t + dur * .3);
  osc.frequency.linearRampToValueAtTime(freq, t + dur * .6);
  osc.frequency.linearRampToValueAtTime(freq * 1.1, t + dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol * .22, t + .02);
  g.gain.setValueAtTime(vol * .22, t + dur * .7);
  g.gain.exponentialRampToValueAtTime(.001, t + dur);
  osc.connect(g); g.connect(dest);
  osc.start(t); osc.stop(t + dur);
}

function synthTrumpet(ctx, dest, freq, dur, vol) {
  const t = ctx.currentTime;
  [1, 1.25, 1.5, 2].forEach((h, i) => {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = i < 2 ? 'sawtooth' : 'sine';
    osc.frequency.value = freq * h;
    g.gain.value = vol * (.18 - i * .03);
    // 起伏包络
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol * (.18 - i * .03), t + .05);
    g.gain.setValueAtTime(vol * (.18 - i * .03) * .8, t + dur * .6);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    osc.connect(g); g.connect(dest);
    osc.start(t); osc.stop(t + dur);
  });
}

function synthRumble(ctx, dest, freq, dur, vol) {
  const t = ctx.currentTime;
  // 超低频 + 调制
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  const lfo = ctx.createOscillator();
  const lfoG = ctx.createGain();
  lfo.frequency.value = 6; // 6Hz 振动
  lfoG.gain.value = freq * .3;
  lfo.connect(lfoG); lfoG.connect(osc.frequency);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol * .3, t + dur * .1);
  g.gain.setValueAtTime(vol * .3, t + dur * .7);
  g.gain.exponentialRampToValueAtTime(.001, t + dur);
  osc.connect(g); g.connect(dest);
  osc.start(t); lfo.start(t);
  osc.stop(t + dur); lfo.stop(t + dur);
}

function synthGrowl(ctx, dest, freq, dur, vol) {
  const t = ctx.currentTime;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.value = freq;
  // 低频调制产生"喉音"
  const lfo = ctx.createOscillator();
  const lfoG = ctx.createGain();
  lfo.frequency.value = 25;
  lfoG.gain.value = vol * .12;
  lfo.connect(lfoG); lfoG.connect(g.gain);
  g.gain.value = vol * .2;
  // 低通滤波
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = freq * 4;
  osc.connect(lp); lp.connect(g); g.connect(dest);
  osc.start(t); lfo.start(t);
  osc.stop(t + dur); lfo.stop(t + dur);
}

function synthBreath(ctx, dest, dur, vol) {
  const t = ctx.currentTime;
  const bufSize = ctx.sampleRate * dur;
  const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) d[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 600; bp.Q.value = 2;
  const g = ctx.createGain();
  // 模拟呼吸节奏
  g.gain.setValueAtTime(0, t);
  for (let i = 0; i < 4; i++) {
    const p = t + i * dur / 4;
    g.gain.linearRampToValueAtTime(vol * .15, p + dur / 8);
    g.gain.linearRampToValueAtTime(.001, p + dur / 4);
  }
  src.connect(bp); bp.connect(g); g.connect(dest);
  src.start(t); src.stop(t + dur);
}

function synthDefault(ctx, dest, freq, dur, vol) {
  const t = ctx.currentTime;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol * .25, t + .02);
  g.gain.exponentialRampToValueAtTime(.001, t + dur);
  osc.connect(g); g.connect(dest);
  osc.start(t); osc.stop(t + dur);
}

// ═══════════════════════════════════════════
//  波形可视化
// ═══════════════════════════════════════════
function initWaveforms() {
  setupWave('humanWaveform');
  setupWave('animalWaveform');
}

function setupWave(id) {
  const c = document.getElementById(id);
  if (!c) return;
  const ctx = c.getContext('2d');
  c.width = c.parentElement.clientWidth * 2;
  c.height = c.parentElement.clientHeight * 2;
  function draw() {
    ctx.clearRect(0, 0, c.width, c.height);
    const mid = c.height / 2;
    const t = Date.now() / 1000;
    // 双波叠加
    ctx.beginPath();
    for (let x = 0; x < c.width; x++) {
      const y = mid + Math.sin(x * .015 + t) * 3 + Math.sin(x * .004 + t * .6) * 6;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = 'rgba(0,245,212,0.12)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // 中线
    ctx.beginPath();
    ctx.moveTo(0, mid); ctx.lineTo(c.width, mid);
    ctx.strokeStyle = 'rgba(0,245,212,0.04)';
    ctx.stroke();
    requestAnimationFrame(draw);
  }
  draw();
}

function drawLiveWave(id, analyser) {
  const c = document.getElementById(id);
  if (!c) return;
  const ctx = c.getContext('2d');
  const bufLen = analyser.frequencyBinCount;
  const data = new Uint8Array(bufLen);
  function draw() {
    analyser.getByteTimeDomainData(data);
    ctx.clearRect(0, 0, c.width, c.height);
    const mid = c.height / 2;
    const sw = c.width / bufLen;
    ctx.beginPath();
    for (let i = 0; i < bufLen; i++) {
      const y = (data[i] / 128) * mid;
      i === 0 ? ctx.moveTo(0, y) : ctx.lineTo(i * sw, y);
    }
    ctx.strokeStyle = 'rgba(0,245,212,0.55)';
    ctx.lineWidth = 2;
    ctx.shadowColor = 'rgba(0,245,212,0.3)';
    ctx.shadowBlur = 8;
    ctx.stroke();
    ctx.shadowBlur = 0;
    // 频谱柱
    analyser.getByteFrequencyData(data);
    const bw = c.width / 48;
    for (let i = 0; i < 48; i++) {
      const bh = (data[i * 4] / 255) * mid * .7;
      ctx.fillStyle = `rgba(0,245,212,${.04 + data[i * 4] / 800})`;
      ctx.fillRect(i * bw, c.height - bh, bw - 1, bh);
    }
    S.animFrame = requestAnimationFrame(draw);
  }
  draw();
}

// ═══════════════════════════════════════════
//  录音
// ═══════════════════════════════════════════
async function toggleRecord(src) {
  if (S.isRecording && S.recSource === src) { stopRecording(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = getCtx();
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 2048;
    ctx.createMediaStreamSource(stream).connect(analyser);

    S.mediaRec = new MediaRecorder(stream);
    S.chunks = [];
    S.mediaRec.ondataavailable = e => { if (e.data.size > 0) S.chunks.push(e.data); };
    S.mediaRec.onstop = () => {
      const url = URL.createObjectURL(new Blob(S.chunks, { type: 'audio/webm' }));
      if (src === 'human') S.humanUrl = url; else S.animalUrl = url;
      stream.getTracks().forEach(t => t.stop());
      setStatus(`录音完成 · ${src === 'human' ? '人类语言' : '动物语言'}`);
    };
    S.mediaRec.start();
    S.isRecording = true; S.recSource = src;

    const btn = document.getElementById(src === 'human' ? 'btnRecordHuman' : 'btnRecordAnimal');
    btn.classList.add('recording');
    btn.querySelector('.icon').textContent = '⏹';
    btn.childNodes[1].textContent = ' 停止';
    setStatus(`录音中 · ${src === 'human' ? '人类语言' : '动物语言'}...`);
    drawLiveWave(src === 'human' ? 'humanWaveform' : 'animalWaveform', analyser);
  } catch (e) {
    setStatus('无法访问麦克风，请检查权限设置');
  }
}

function stopRecording() {
  if (S.mediaRec && S.mediaRec.state !== 'inactive') S.mediaRec.stop();
  S.isRecording = false;
  const btn = document.getElementById(S.recSource === 'human' ? 'btnRecordHuman' : 'btnRecordAnimal');
  if (btn) {
    btn.classList.remove('recording');
    btn.querySelector('.icon').textContent = '🎤';
    btn.childNodes[1].textContent = ' 录音';
  }
  cancelAnimationFrame(S.animFrame);
  initWaveforms();
  S.recSource = null;
}

function playRecordedAudio(src) {
  const url = src === 'human' ? S.humanUrl : S.animalUrl;
  if (!url) { setStatus('没有可播放的音频，请先录音'); return; }
  const a = new Audio(url);
  a.playbackRate = S.speed;
  a.play();
  setStatus(`播放中 · ${src === 'human' ? '人类语言' : '动物语言'}`);
  a.onended = () => setStatus('播放完成');
}

function stopAudio(src) { setStatus('已停止'); }

// ═══════════════════════════════════════════
//  翻译（智能匹配 + 情绪识别）
// ═══════════════════════════════════════════
function translate(dir) {
  const a = S.animal, d = D[a];

  if (dir === 'humanToAnimal') {
    const text = document.getElementById('humanText').value.trim();
    if (!text) { setStatus('请输入要翻译的文本'); return; }
    const result = document.getElementById('animalResult');

    let matched = null;
    let matchType = '';

    // 第1优先级：精确关键词匹配
    for (const [k, v] of Object.entries(d.keywords)) {
      if (text === k || text.includes(k)) { matched = v; matchType = 'keyword'; break; }
    }

    // 第2优先级：情绪关键词匹配
    if (!matched) {
      for (const [emotion, data] of Object.entries(d.emotions)) {
        if (text.includes(emotion)) { matched = data.sounds; matchType = 'emotion'; break; }
      }
    }

    // 第3优先级：模糊匹配（基于部分关键词）
    if (!matched) {
      const allKeys = Object.keys(d.keywords);
      for (const k of allKeys) {
        for (const char of k) {
          if (text.includes(char) && k.length > 1) {
            matched = d.keywords[k];
            matchType = 'fuzzy';
            break;
          }
        }
        if (matched) break;
      }
    }

    // 第4优先级：通用翻译（根据文本情感色彩）
    if (!matched) {
      const len = text.length;
      const sounds = d.sounds.map(s => s.name);
      if (text.includes('?') || text.includes('？') || text.includes('吗')) {
        matched = [sounds[0] + '?', '(歪头)', '(竖耳朵)'];
      } else if (text.includes('!') || text.includes('！')) {
        matched = [sounds[Math.floor(Math.random() * 2)], '(摇尾巴)', '(蹦跳)'];
      } else {
        const n = Math.min(len, 3);
        const r = [];
        for (let i = 0; i < n; i++) r.push(sounds[i % sounds.length]);
        r.push('(' + ['摇尾巴', '竖耳朵', '歪头', '蹭过来', '跑过来'][Math.floor(Math.random() * 5)] + ')');
        matched = r;
      }
      matchType = 'generic';
    }

    result.innerHTML = matched.map(s =>
      s.startsWith('(') ? `<br><span style="color:var(--text-secondary);font-size:.72rem;margin-left:4px">${s}</span>` :
      `<span class="animal-sound">${d.emoji} ${s}</span>`
    ).join('');

    // 播放翻译音效
    const first = d.sounds.find(s => matched.some(m => m.includes(s.name.replace(/[~!？?]/g, '')))) || d.sounds[0];
    setTimeout(() => playAnimalSound(a, first, 'animalWaveform'), 300);

    addHistory('human', text, matched.join(' '), a);
    setStatus(`翻译完成 · 人类 → ${d.name}` + (matchType !== 'keyword' ? ` (${matchType}匹配)` : ''));

  } else {
    // 动物→人类
    const el = document.getElementById('animalResult');
    const text = el.textContent.trim();
    if (!text || text === '等待翻译结果...') { setStatus('请先进行人→动物翻译'); return; }

    let translated = null;

    // 反向匹配
    for (const [k, v] of Object.entries(d.reverse)) {
      if (text.includes(k)) { translated = v; break; }
    }

    if (!translated) {
      // 情绪推断
      const sounds = d.sounds.map(s => s.name.replace(/[~!？?]/g, ''));
      for (const s of sounds) {
        if (text.includes(s)) {
          const sound = d.sounds.find(ss => ss.name.replace(/[~!？?]/g, '') === s);
          if (sound) translated = `${d.name}的"${sound.name}"(${sound.type.replace('·', '：')})——这是${d.name}在表达某种情感`;
          break;
        }
      }
    }

    if (!translated) {
      const fallbacks = [
        `${d.name}正在用独特的方式与你交流，试着用心感受它的情感`,
        `这可能是${d.name}在表达某种情绪，每种声音都有特殊的含义`,
        `${d.name}的语言充满了丰富的情感层次，值得我们仔细聆听`,
      ];
      translated = fallbacks[Math.floor(Math.random() * fallbacks.length)];
    }

    el.innerHTML = `
      <div style="margin-bottom:6px;color:var(--text-dim);font-size:.72rem">原声: ${text}</div>
      <div style="color:var(--bio-amber);font-size:.88rem;line-height:1.6">人类含义: ${translated}</div>
    `;
    addHistory('animal', text, translated, a);
    setStatus(`翻译完成 · ${d.name} → 人类`);
  }
}

// ═══════════════════════════════════════════
//  交换面板
// ═══════════════════════════════════════════
function swapPanels() {
  const t = document.getElementById('humanText');
  const r = document.getElementById('animalResult');
  t.value = r.textContent.includes('人类含义:') ? r.textContent.split('人类含义:')[1]?.trim() || '' : '';
  setStatus('已交换翻译方向');
}

// ═══════════════════════════════════════════
//  历史
// ═══════════════════════════════════════════
function addHistory(src, input, output, a) {
  const d = D[a];
  const now = new Date();
  const t = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  S.history.unshift({ src, input, output, animal: a, time: t, emoji: d.emoji });
  if (S.history.length > 30) S.history.pop();
  renderHistory();
}

function renderHistory() {
  const el = document.getElementById('historyList');
  if (!S.history.length) {
    el.innerHTML = '<div class="history-item" style="justify-content:center;color:var(--text-dim);font-size:.76rem;padding:16px">暂无翻译记录</div>';
    return;
  }
  el.innerHTML = S.history.map(h => `
    <div class="history-item">
      <span class="h-icon">${h.src === 'human' ? '🗣' : h.emoji}</span>
      <div class="h-content"><div class="h-source">${h.input}</div></div>
      <span class="h-arrow">→</span>
      <div class="h-content"><div class="h-result">${h.output}</div></div>
      <span class="h-time">${h.time}</span>
    </div>
  `).join('');
}

// ═══════════════════════════════════════════
//  设置
// ═══════════════════════════════════════════
function updateSetting(key, val) {
  if (key === 'volume') { S.vol = val / 100; document.getElementById('volumeValue').textContent = val + '%'; }
  if (key === 'speed') { S.speed = val / 100; document.getElementById('speedValue').textContent = (val / 100).toFixed(1) + 'x'; }
  if (key === 'pitch') { S.pitch = val / 100; document.getElementById('pitchValue').textContent = (val / 100).toFixed(1); }
}

// ═══════════════════════════════════════════
//  状态
// ═══════════════════════════════════════════
function setStatus(t) {
  document.getElementById('statusText').textContent = t;
}

// ═══════════════════════════════════════════
//  粒子系统（增强版）
// ═══════════════════════════════════════════
function initParticles() {
  const c = document.getElementById('particleCanvas');
  const ctx = c.getContext('2d');
  let pts = [];
  const COUNT = 60;

  function resize() { c.width = window.innerWidth; c.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  class P {
    constructor() { this.reset(); }
    reset() {
      this.x = Math.random() * c.width;
      this.y = Math.random() * c.height;
      this.sz = Math.random() * 2 + .5;
      this.vx = (Math.random() - .5) * .25;
      this.vy = (Math.random() - .5) * .25 - .08;
      this.op = Math.random() * .4 + .08;
      this.hue = 140 + Math.random() * 40;
      this.phase = Math.random() * Math.PI * 2;
      this.speed = Math.random() * .015 + .005;
    }
    update() {
      this.x += this.vx; this.y += this.vy; this.phase += this.speed;
      if (this.x < -10 || this.x > c.width + 10 || this.y < -10 || this.y > c.height + 10) this.reset();
    }
    draw() {
      const g = this.op * (.7 + .3 * Math.sin(this.phase));
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.sz, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${this.hue},75%,68%,${g})`;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.sz * 3, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${this.hue},75%,68%,${g * .12})`;
      ctx.fill();
    }
  }

  for (let i = 0; i < COUNT; i++) pts.push(new P());

  function loop() {
    ctx.clearRect(0, 0, c.width, c.height);
    // 连线
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const dx = pts[i].x - pts[j].x;
        const dy = pts[i].y - pts[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) {
          ctx.beginPath();
          ctx.moveTo(pts[i].x, pts[i].y);
          ctx.lineTo(pts[j].x, pts[j].y);
          ctx.strokeStyle = `rgba(0,245,212,${.04 * (1 - dist / 120)})`;
          ctx.lineWidth = .5;
          ctx.stroke();
        }
      }
    }
    pts.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(loop);
  }
  loop();
}

// 窗口调整
window.addEventListener('resize', initWaveforms);
</script>
