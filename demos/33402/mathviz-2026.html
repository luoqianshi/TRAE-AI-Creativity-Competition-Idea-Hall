<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathViz · 创意科学计算器 V1.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            --bg-primary: #080c16;
            --bg-secondary: #0e1525;
            --bg-panel: #141d33;
            --bg-card: #1a2540;
            --text-primary: #e8edf5;
            --text-secondary: #7b8db5;
            --text-muted: #4a5a80;
            --accent: #00e5ff;
            --accent-glow: rgba(0, 229, 255, 0.15);
            --accent-secondary: #ff5c93;
            --accent-tertiary: #5cff8a;
            --accent-warm: #ffb347;
            --border: rgba(255, 255, 255, 0.06);
            --border-active: rgba(0, 229, 255, 0.3);
            --glass: rgba(14, 21, 37, 0.85);
            --canvas-bg: #080c16;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
        }

        .app-container {
            display: grid;
            grid-template-columns: 72px 1fr 300px;
            grid-template-rows: 56px 1fr;
            height: 100vh;
        }

        /* Header */
        .header {
            grid-column: 1 / -1;
            background: var(--glass);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .logo-sub {
            font-size: 11px;
            color: var(--text-muted);
            margin-left: 10px;
            font-weight: 400;
        }

        .header-actions { display: flex; gap: 8px; }

        .btn {
            padding: 7px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--bg-card);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #00b8d4);
            color: var(--bg-primary);
            border-color: transparent;
            font-weight: 600;
        }

        .btn-primary:hover {
            opacity: 0.9;
            box-shadow: 0 0 24px var(--accent-glow);
        }

        /* Sidebar */
        .sidebar {
            background: var(--glass);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 0;
            gap: 6px;
            border-right: 1px solid var(--border);
        }

        .nav-item {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 20px;
            position: relative;
            border: 1px solid transparent;
        }

        .nav-item:hover {
            background: var(--bg-card);
            border-color: var(--border);
            transform: scale(1.05);
        }

        .nav-item.active {
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.15), rgba(0, 229, 255, 0.05));
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow), inset 0 0 20px rgba(0, 229, 255, 0.05);
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            left: -1px;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 24px;
            background: var(--accent);
            border-radius: 0 3px 3px 0;
        }

        .nav-item .tooltip {
            position: absolute;
            left: 60px;
            background: var(--bg-card);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s;
            z-index: 100;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transform: translateX(-5px);
        }

        .nav-item:hover .tooltip {
            opacity: 1;
            transform: translateX(0);
        }

        .sidebar-divider {
            width: 28px;
            height: 1px;
            background: var(--border);
            margin: 6px 0;
        }

        /* Main Canvas Area */
        .main-area {
            background: var(--canvas-bg);
            position: relative;
            overflow: hidden;
        }

        .canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .canvas-overlay {
            position: absolute;
            bottom: 16px;
            left: 16px;
            background: var(--glass);
            backdrop-filter: blur(12px);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 11px;
            color: var(--text-muted);
            pointer-events: none;
            border: 1px solid var(--border);
            transition: all 0.3s;
        }

        .module-label {
            position: absolute;
            top: 16px;
            left: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .module-label .icon {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
        }

        .module-label .text {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            background: var(--glass);
            backdrop-filter: blur(12px);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        /* Right Panel */
        .right-panel {
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-left: 1px solid var(--border);
        }

        .panel-section {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border);
            transition: all 0.3s;
        }

        .panel-section:hover {
            border-color: rgba(255, 255, 255, 0.1);
        }

        .panel-title {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group { margin-bottom: 10px; }

        .input-group label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 5px;
            font-weight: 500;
        }

        .input-group input,
        .input-group select,
        .input-group textarea {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.2s;
        }

        .input-group input:focus,
        .input-group select:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .input-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .slider-group { margin-bottom: 12px; }

        .slider-group label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .slider-group input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            height: 4px;
            border-radius: 2px;
            background: var(--bg-primary);
            outline: none;
            border: 1px solid var(--border);
        }

        .slider-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 8px var(--accent-glow);
            transition: all 0.2s;
        }

        .slider-group input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .color-picker {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .color-option {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .color-option:hover,
        .color-option.active {
            border-color: var(--text-primary);
            transform: scale(1.15);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
        }

        /* Start Button (per module) */
        .start-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .start-btn.start {
            background: linear-gradient(135deg, var(--accent), #00b8d4);
            color: var(--bg-primary);
        }

        .start-btn.start:hover {
            box-shadow: 0 4px 20px var(--accent-glow);
            transform: translateY(-1px);
        }

        .start-btn.stop {
            background: linear-gradient(135deg, var(--accent-secondary), #e91e63);
            color: white;
        }

        .start-btn.stop:hover {
            box-shadow: 0 4px 20px rgba(255, 92, 147, 0.3);
            transform: translateY(-1px);
        }

        .start-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.1));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .start-btn:hover::after { opacity: 1; }

        /* Function list */
        .function-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .function-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: var(--bg-primary);
            border-radius: 8px;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }

        .function-item:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }

        .function-color {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 6px currentColor;
        }

        .function-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }

        .function-input:focus { outline: none; }

        .function-remove {
            cursor: pointer;
            opacity: 0.3;
            transition: all 0.2s;
            font-size: 14px;
        }

        .function-remove:hover {
            opacity: 1;
            color: var(--accent-secondary);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }

        .tab {
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.25s;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .tab:hover {
            border-color: var(--border-active);
            color: var(--text-primary);
        }

        .tab.active {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
            font-weight: 600;
        }

        /* Presets */
        .presets {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .preset-btn {
            padding: 7px 8px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .preset-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(0, 229, 255, 0.05);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .info-text {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.7;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .stat-item {
            background: var(--bg-primary);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 3px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* Canvas transition */
        .canvas-container canvas {
            transition: opacity 0.15s ease;
        }

        .canvas-container.switching canvas {
            opacity: 0;
        }

        /* Ambient glow behind canvas */
        .main-area::before {
            content: '';
            position: absolute;
            top: -100px;
            left: -100px;
            right: -100px;
            bottom: -100px;
            background: radial-gradient(ellipse at center, var(--accent-glow) 0%, transparent 60%);
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
            transition: opacity 0.5s;
        }

        /* Coordinate display */
        .coord-display {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: var(--glass);
            backdrop-filter: blur(12px);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-muted);
            pointer-events: none;
            border: 1px solid var(--border);
        }

        /* Add function btn */
        .add-btn {
            width: 100%;
            padding: 8px;
            border: 1px dashed var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            color: var(--text-muted);
            background: transparent;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .add-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(0, 229, 255, 0.03);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div style="display:flex;align-items:center;">
                <div class="logo">MathViz <span style="font-size:12px;opacity:0.6;font-weight:400">V1.0</span></div>
                <span class="logo-sub">Creative Scientific Calculator</span>
            </div>
            <div class="header-actions">
                <button class="btn" onclick="exportImage()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    导出
                </button>
                <button class="btn" onclick="resetView()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                    重置
                </button>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="nav-item active" onclick="switchModule('function')" data-module="function">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12C2 6.5 6.5 2 12 2a10 10 0 0 1 8 4"/><path d="M5 19.5C5.5 18 6 15 6 12c0-.7.1-1.4.2-2"/><path d="M1 10h4"/><path d="M22 12c0 5.5-4.5 10-10 10a10 10 0 0 1-8-4"/><path d="M19 4.5c-.5 1.5-1 4.5-1 8 0 .7-.1 1.4-.2 2"/><path d="M23 14h-4"/></svg>
                <span class="tooltip">函数绘图</span>
            </div>
            <div class="nav-item" onclick="switchModule('fractal')" data-module="fractal">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4"/><path d="M12 19v4"/><path d="M1 12h4"/><path d="M19 12h4"/><path d="M4.22 4.22l2.83 2.83"/><path d="M16.95 16.95l2.83 2.83"/><path d="M4.22 19.78l2.83-2.83"/><path d="M16.95 7.05l2.83-2.83"/></svg>
                <span class="tooltip">分形艺术</span>
            </div>
            <div class="nav-item" onclick="switchModule('stats')" data-module="stats">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg>
                <span class="tooltip">统计分析</span>
            </div>
            <div class="sidebar-divider"></div>
            <div class="nav-item" onclick="switchModule('physics')" data-module="physics">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/><path d="M12 2v4"/><path d="M12 18v4"/><path d="M4.93 4.93l2.83 2.83"/><path d="M16.24 16.24l2.83 2.83"/></svg>
                <span class="tooltip">物理模拟</span>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="main-area">
            <div class="canvas-container" id="canvasContainer">
                <canvas id="mainCanvas"></canvas>
                <div class="module-label" id="moduleLabel">
                    <div class="icon" id="moduleIcon">📐</div>
                    <div class="text" id="moduleText">函数绘图</div>
                </div>
                <div class="canvas-overlay" id="canvasOverlay">
                    鼠标拖拽平移 · 滚轮缩放
                </div>
                <div class="coord-display" id="coordDisplay">x: 0.00, y: 0.00</div>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="right-panel" id="rightPanel"></div>
    </div>

    <script>
        // ==================== Core Framework ====================
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        let currentModule = 'function';
        let width, height;

        // Per-module independent state
        const moduleState = {
            function: { playing: false, time: 0, animId: null, speed: 1.0, mode: 'wave' },
            fractal: { playing: false, time: 0, animId: null },
            stats:   { playing: false, time: 0, animId: null },
            physics: { playing: false, time: 0, animId: null }
        };

        // Function animation parameters
        let funcAnimParams = {
            amplitude: 1.0,
            frequency: 1.0,
            phase: 0,
            damping: 0,
            waveSpeed: 1.0
        };

        // Viewport for function plotting
        let view = { xMin: -10, xMax: 10, yMin: -10, yMax: 10 };
        let isDragging = false;
        let lastMouse = { x: 0, y: 0 };

        // Module metadata
        const moduleMeta = {
            function: { icon: '📐', label: '函数绘图', overlay: '鼠标拖拽平移 · 滚轮缩放' },
            fractal:  { icon: '🎨', label: '分形艺术', overlay: '调节右侧参数探索分形世界' },
            stats:    { icon: '📊', label: '统计分析', overlay: '在右侧输入或生成数据集' },
            physics:  { icon: '🔬', label: '物理模拟', overlay: '点击「开始模拟」观察粒子运动' }
        };

        // Resize canvas
        function resizeCanvas() {
            const container = canvas.parentElement;
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
            renderCurrentModule();
        }

        window.addEventListener('resize', resizeCanvas);

        // Mouse interactions
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouse = { x: e.clientX, y: e.clientY };
        });

        canvas.addEventListener('mousemove', (e) => {
            // Update coordinate display for function module
            if (currentModule === 'function') {
                const rect = canvas.getBoundingClientRect();
                const sx = e.clientX - rect.left;
                const sy = e.clientY - rect.top;
                const w = screenToWorld(sx, sy);
                document.getElementById('coordDisplay').textContent = `x: ${w.x.toFixed(2)}, y: ${w.y.toFixed(2)}`;
            }
            if (isDragging && currentModule === 'function') {
                const dx = e.clientX - lastMouse.x;
                const dy = e.clientY - lastMouse.y;
                const xRange = view.xMax - view.xMin;
                const yRange = view.yMax - view.yMin;
                view.xMin -= dx * xRange / width;
                view.xMax -= dx * xRange / width;
                view.yMin += dy * yRange / height;
                view.yMax += dy * yRange / height;
                lastMouse = { x: e.clientX, y: e.clientY };
                if (!moduleState.function.playing) renderCurrentModule();
            }
        });

        canvas.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('mouseleave', () => isDragging = false);

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (currentModule === 'function') {
                const zoom = e.deltaY > 0 ? 1.1 : 0.9;
                const xRange = view.xMax - view.xMin;
                const yRange = view.yMax - view.yMin;
                const xCenter = (view.xMin + view.xMax) / 2;
                const yCenter = (view.yMin + view.yMax) / 2;
                view.xMin = xCenter - xRange * zoom / 2;
                view.xMax = xCenter + xRange * zoom / 2;
                view.yMin = yCenter - yRange * zoom / 2;
                view.yMax = yCenter + yRange * zoom / 2;
                if (!moduleState.function.playing) renderCurrentModule();
            }
        });

        // ==================== Math Expression Parser ====================
        function evaluateExpression(expr, x, t) {
            try {
                const scope = {
                    x, t, time: t,
                    sin: Math.sin, cos: Math.cos, tan: Math.tan,
                    asin: Math.asin, acos: Math.acos, atan: Math.atan,
                    sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
                    sqrt: Math.sqrt, cbrt: Math.cbrt,
                    exp: Math.exp, log: Math.log, ln: Math.log,
                    log10: Math.log10, log2: Math.log2,
                    abs: Math.abs, floor: Math.floor, ceil: Math.ceil,
                    round: Math.round, trunc: Math.trunc,
                    min: Math.min, max: Math.max,
                    pow: Math.pow, PI: Math.PI, E: Math.E,
                    random: Math.random, sign: Math.sign,
                    fact: (n) => { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; }
                };
                const fn = new Function(...Object.keys(scope), `return ${expr};`);
                return fn(...Object.values(scope));
            } catch (e) {
                return NaN;
            }
        }

        // ==================== Function Plotting Module ====================
        let functions = [
            { expr: 'sin(x) * exp(-x^2/10)', color: '#00e5ff', visible: true },
            { expr: 'cos(x) * 0.5', color: '#ff5c93', visible: true }
        ];

        function worldToScreen(wx, wy) {
            return {
                x: (wx - view.xMin) / (view.xMax - view.xMin) * width,
                y: height - (wy - view.yMin) / (view.yMax - view.yMin) * height
            };
        }

        function screenToWorld(sx, sy) {
            return {
                x: view.xMin + sx / width * (view.xMax - view.xMin),
                y: view.yMin + (height - sy) / height * (view.yMax - view.yMin)
            };
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
            ctx.lineWidth = 1;

            const xStep = Math.pow(10, Math.floor(Math.log10(view.xMax - view.xMin)));
            const yStep = Math.pow(10, Math.floor(Math.log10(view.yMax - view.yMin)));

            for (let x = Math.floor(view.xMin / xStep) * xStep; x <= view.xMax; x += xStep) {
                const p = worldToScreen(x, 0);
                ctx.beginPath();
                ctx.moveTo(p.x, 0);
                ctx.lineTo(p.x, height);
                ctx.stroke();
                ctx.fillStyle = 'rgba(123, 141, 181, 0.5)';
                ctx.font = '10px JetBrains Mono, monospace';
                ctx.textAlign = 'center';
                ctx.fillText(x.toFixed(1), p.x, height - 8);
            }

            for (let y = Math.floor(view.yMin / yStep) * yStep; y <= view.yMax; y += yStep) {
                const p = worldToScreen(0, y);
                ctx.beginPath();
                ctx.moveTo(0, p.y);
                ctx.lineTo(width, p.y);
                ctx.stroke();
                ctx.fillStyle = 'rgba(123, 141, 181, 0.5)';
                ctx.font = '10px JetBrains Mono, monospace';
                ctx.textAlign = 'left';
                ctx.fillText(y.toFixed(1), 8, p.y - 4);
            }

            // Axes
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
            ctx.lineWidth = 1.5;
            const origin = worldToScreen(0, 0);
            ctx.beginPath();
            ctx.moveTo(0, origin.y);
            ctx.lineTo(width, origin.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(origin.x, 0);
            ctx.lineTo(origin.x, height);
            ctx.stroke();
        }

        function plotFunction(fn, color) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.shadowColor = color;
            ctx.shadowBlur = 8;
            ctx.beginPath();

            const t = moduleState.function.time;
            const mode = moduleState.function.mode;
            const amp = funcAnimParams.amplitude;
            const freq = funcAnimParams.frequency;
            const phase = funcAnimParams.phase;
            const damp = funcAnimParams.damping;
            const ws = funcAnimParams.waveSpeed;

            let first = true;
            for (let px = 0; px <= width; px += 1) {
                const wx = view.xMin + px / width * (view.xMax - view.xMin);
                let wy = evaluateExpression(fn.expr, wx, t);
                if (isNaN(wy) || !isFinite(wy)) { first = true; continue; }

                // Apply animation transformations based on mode
                if (mode === 'wave') {
                    // Traveling wave effect: shift x by time
                    const shiftedX = wx - t * ws;
                    wy = evaluateExpression(fn.expr, shiftedX, 0);
                } else if (mode === 'pulse') {
                    // Pulsing amplitude
                    const pulse = 1 + 0.5 * Math.sin(t * 2);
                    wy = wy * pulse;
                } else if (mode === 'morph') {
                    // Morph between original and frequency-modulated version
                    const morph = (Math.sin(t) + 1) / 2;
                    const baseY = evaluateExpression(fn.expr, wx, 0);
                    const morphY = evaluateExpression(fn.expr, wx * (1 + 0.5 * Math.sin(t)), 0);
                    wy = baseY * (1 - morph) + morphY * morph;
                } else if (mode === 'spiral') {
                    // Spiral rotation effect
                    const angle = t * ws;
                    const rx = wx * Math.cos(angle) - wy * Math.sin(angle);
                    const ry = wx * Math.sin(angle) + wy * Math.cos(angle);
                    wy = ry;
                }

                // Apply global amplitude and damping
                wy = wy * amp * Math.exp(-damp * Math.abs(wx) / 10);

                if (isNaN(wy) || !isFinite(wy)) { first = true; continue; }
                const py = height - (wy - view.yMin) / (view.yMax - view.yMin) * height;
                if (first) { ctx.moveTo(px, py); first = false; }
                else ctx.lineTo(px, py);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function renderFunction() {
            ctx.fillStyle = '#080c16';
            ctx.fillRect(0, 0, width, height);
            drawGrid();
            functions.forEach(fn => { if (fn.visible) plotFunction(fn, fn.color); });
        }

        // ==================== Fractal Module ====================
        let fractalParams = {
            maxIter: 100,
            zoom: 1,
            offsetX: 0,
            offsetY: 0,
            type: 'mandelbrot',
            colorScheme: 'fire'
        };

        function getFractalColor(iter, maxIter, cycleOffset) {
            if (iter >= maxIter) return [8, 12, 22];
            const t = iter / maxIter;
            const cycle = (cycleOffset || 0) / 360;
            const schemes = {
                fire: () => {
                    const shift = Math.sin(cycle * Math.PI * 2) * 0.1;
                    return [
                        Math.min(255, (t + shift) * 512),
                        Math.min(255, t * 256 * (1 + 0.3 * Math.sin(cycle * 3))),
                        Math.min(255, t * 128)
                    ];
                },
                ocean: () => {
                    const shift = Math.sin(cycle * Math.PI * 2) * 0.1;
                    return [
                        Math.min(255, t * 128),
                        Math.min(255, (t + shift) * 256),
                        Math.min(255, t * 512 * (1 + 0.2 * Math.cos(cycle * 2)))
                    ];
                },
                rainbow: () => {
                    const h = (t * 360 + cycleOffset) % 360;
                    const s = 0.8;
                    const l = 0.5 + 0.1 * Math.sin(cycle * Math.PI * 2);
                    const c = (1 - Math.abs(2 * l - 1)) * s;
                    const x = c * (1 - Math.abs((h / 60) % 2 - 1));
                    const m = l - c / 2;
                    let r, g, b;
                    if (h < 60) [r, g, b] = [c, x, 0];
                    else if (h < 120) [r, g, b] = [x, c, 0];
                    else if (h < 180) [r, g, b] = [0, c, x];
                    else if (h < 240) [r, g, b] = [0, x, c];
                    else if (h < 300) [r, g, b] = [x, 0, c];
                    else [r, g, b] = [c, 0, x];
                    return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
                },
                neon: () => [
                    Math.min(255, 100 + t * 400 + 50 * Math.sin(cycle * Math.PI * 2)),
                    Math.min(255, 50 + Math.sin(t * Math.PI) * 200 + 30 * Math.cos(cycle * 3)),
                    Math.min(255, 200 + t * 100 + 40 * Math.sin(cycle * 2))
                ]
            };
            return (schemes[fractalParams.colorScheme] || schemes.fire)();
        }

        function renderFractalHalf(imageData, data, t, isPlaying, colorCycle, isLeft, halfWidth, halfHeight) {
            const offsetX = isLeft ? 0 : halfWidth;
            const cx = -0.7 + Math.sin(t * 0.5) * 0.3;
            const cy = 0.27015 + Math.cos(t * 0.5) * 0.1;

            for (let py = 0; py < halfHeight; py++) {
                for (let px = 0; px < halfWidth; px++) {
                    const screenPx = offsetX + px;
                    const screenPy = py;
                    const x0 = (px - halfWidth / 2) * 4.0 / (halfWidth * fractalParams.zoom) + fractalParams.offsetX;
                    const y0 = (py - halfHeight / 2) * 4.0 / (halfHeight * fractalParams.zoom) + fractalParams.offsetY;
                    let x = 0, y = 0, iter = 0;

                    if (isLeft) {
                        // Mandelbrot
                        while (x * x + y * y <= 4 && iter < fractalParams.maxIter) {
                            const xt = x * x - y * y + x0;
                            y = 2 * x * y + y0;
                            x = xt;
                            iter++;
                        }
                    } else {
                        // Julia
                        x = x0; y = y0;
                        while (x * x + y * y <= 4 && iter < fractalParams.maxIter) {
                            const xt = x * x - y * y + cx;
                            y = 2 * x * y + cy;
                            x = xt;
                            iter++;
                        }
                    }

                    const [r, g, b] = getFractalColor(iter, fractalParams.maxIter, colorCycle);
                    const idx = (screenPy * width + screenPx) * 4;
                    data[idx] = r; data[idx + 1] = g; data[idx + 2] = b; data[idx + 3] = 255;
                }
            }
        }

        function renderFractal() {
            const imageData = ctx.createImageData(width, height);
            const data = imageData.data;
            const t = moduleState.fractal.time;
            const isPlaying = moduleState.fractal.playing;
            const colorCycle = isPlaying ? t * 30 : 0;

            const halfWidth = Math.floor(width / 2);
            const halfHeight = height;

            // Render Mandelbrot on left half
            renderFractalHalf(imageData, data, t, isPlaying, colorCycle, true, halfWidth, halfHeight);
            // Render Julia on right half
            renderFractalHalf(imageData, data, t, isPlaying, colorCycle, false, halfWidth, halfHeight);

            ctx.putImageData(imageData, 0, 0);

            // Draw divider line
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.3)';
            ctx.lineWidth = 2;
            ctx.shadowColor = 'rgba(0, 229, 255, 0.5)';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.moveTo(halfWidth, 0);
            ctx.lineTo(halfWidth, height);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Labels
            ctx.fillStyle = 'rgba(0, 229, 255, 0.6)';
            ctx.font = 'bold 14px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Mandelbrot', halfWidth / 2, 30);
            ctx.fillText('Julia', halfWidth + halfWidth / 2, 30);

            // Animated overlay glow when playing
            if (isPlaying) {
                const glowAlpha = 0.02 + 0.01 * Math.sin(t * 3);
                const gradient = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, Math.min(width, height)/3);
                gradient.addColorStop(0, `rgba(0, 229, 255, ${glowAlpha})`);
                gradient.addColorStop(1, 'rgba(0, 229, 255, 0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, width, height);
            }
        }

        // ==================== Statistics Module ====================
        let statsData = [12, 19, 23, 17, 28, 34, 45, 56, 67, 78, 89, 90, 85, 72, 63, 54, 47, 38, 29, 21];

        function calculateStats(data) {
            const n = data.length;
            const sum = data.reduce((a, b) => a + b, 0);
            const mean = sum / n;
            const variance = data.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / n;
            const std = Math.sqrt(variance);
            const min = Math.min(...data);
            const max = Math.max(...data);
            const sorted = [...data].sort((a, b) => a - b);
            const median = n % 2 === 0 ? (sorted[n / 2 - 1] + sorted[n / 2]) / 2 : sorted[Math.floor(n / 2)];
            return { mean, variance, std, min, max, median };
        }

        // Stats animation state
        let statsAnimState = {
            targetData: [],
            currentData: [],
            animProgress: 1,
            isAnimating: false,
            lastDistribution: ''
        };

        function renderStats() {
            ctx.fillStyle = '#080c16';
            ctx.fillRect(0, 0, width, height);

            // Animated background grid
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let x = 0; x < width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
            }
            for (let y = 0; y < height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
            }

            // Handle data transition animation
            let displayData = statsData;
            if (statsAnimState.isAnimating) {
                statsAnimState.animProgress += 0.05;
                if (statsAnimState.animProgress >= 1) {
                    statsAnimState.animProgress = 1;
                    statsAnimState.isAnimating = false;
                }
                // Interpolate data values for smooth transition
                const t = easeOutCubic(statsAnimState.animProgress);
                displayData = statsAnimState.currentData.map((v, i) => {
                    const target = statsAnimState.targetData[i] || v;
                    return v + (target - v) * t;
                });
            }

            const stats = calculateStats(displayData);
            const padding = 70;
            const chartWidth = width - padding * 2;
            const chartHeight = height - padding * 2;

            const bins = 12;
            const min = stats.min;
            const max = stats.max;
            const binWidth = (max - min) / bins || 1;
            const histogram = new Array(bins).fill(0);
            displayData.forEach(v => { histogram[Math.min(Math.floor((v - min) / binWidth), bins - 1)]++; });
            const maxCount = Math.max(...histogram, 1);
            const barWidth = chartWidth / bins;

            // Draw animated bars with individual delay based on index
            histogram.forEach((count, i) => {
                const barHeight = (count / maxCount) * chartHeight * 0.7;
                const x = padding + i * barWidth;
                const y = height - padding - barHeight;
                const barCenter = x + barWidth / 2;

                // Animated bar growth
                let animScale = 1;
                if (statsAnimState.isAnimating) {
                    const delay = i * 0.03;
                    animScale = Math.max(0, Math.min(1, (statsAnimState.animProgress - delay) / 0.3));
                    animScale = easeOutBack(animScale);
                }

                const animBarHeight = barHeight * animScale;
                const animY = height - padding - animBarHeight;

                // Bar gradient with dynamic color based on height
                const hue = 180 + (count / maxCount) * 60; // Cyan to blue
                const gradient = ctx.createLinearGradient(0, animY, 0, height - padding);
                gradient.addColorStop(0, `hsla(${hue}, 90%, 60%, 0.9)`);
                gradient.addColorStop(0.5, `hsla(${hue}, 80%, 45%, 0.7)`);
                gradient.addColorStop(1, `hsla(${hue}, 70%, 25%, 0.3)`);
                ctx.fillStyle = gradient;

                // Rounded top bar
                const r = 5;
                const bw = barWidth - 6;
                ctx.beginPath();
                ctx.moveTo(x + 3, animY + r);
                ctx.arcTo(x + 3, animY, x + 3 + bw, animY, r);
                ctx.arcTo(x + 3 + bw, animY, x + 3 + bw, animY + r, r);
                ctx.lineTo(x + 3 + bw, height - padding);
                ctx.lineTo(x + 3, height - padding);
                ctx.closePath();
                ctx.fill();

                // Top glow line
                if (animScale > 0.5) {
                    ctx.strokeStyle = `hsla(${hue}, 90%, 70%, 0.6)`;
                    ctx.lineWidth = 2;
                    ctx.shadowColor = `hsla(${hue}, 90%, 60%, 0.5)`;
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.moveTo(x + 3, animY + 1);
                    ctx.lineTo(x + 3 + bw, animY + 1);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }

                // Count label
                if (animScale > 0.8) {
                    ctx.fillStyle = 'rgba(232, 237, 245, 0.8)';
                    ctx.font = '10px JetBrains Mono, monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(count.toString(), barCenter, animY - 10);
                }
            });

            // Axes with glow
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1.5;
            ctx.shadowColor = 'rgba(0, 229, 255, 0.2)';
            ctx.shadowBlur = 4;
            ctx.beginPath();
            ctx.moveTo(padding, padding);
            ctx.lineTo(padding, height - padding);
            ctx.lineTo(width - padding, height - padding);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // X-axis labels
            ctx.fillStyle = 'rgba(123, 141, 181, 0.6)';
            ctx.font = '10px JetBrains Mono, monospace';
            ctx.textAlign = 'center';
            for (let i = 0; i <= bins; i += 2) {
                const val = min + i * binWidth;
                ctx.fillText(val.toFixed(0), padding + i * barWidth, height - padding + 20);
            }

            // Distribution curve overlay (KDE-like)
            if (displayData.length > 5) {
                ctx.strokeStyle = 'rgba(0, 229, 255, 0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                const bandwidth = (max - min) / bins * 1.5;
                for (let px = 0; px <= chartWidth; px += 2) {
                    const val = min + (px / chartWidth) * (max - min);
                    let density = 0;
                    displayData.forEach(d => {
                        const diff = (val - d) / bandwidth;
                        density += Math.exp(-0.5 * diff * diff);
                    });
                    density = density / displayData.length / bandwidth * chartHeight * 0.5;
                    const py = height - padding - Math.min(density, chartHeight * 0.6);
                    if (px === 0) ctx.moveTo(padding + px, py);
                    else ctx.lineTo(padding + px, py);
                }
                ctx.stroke();
            }

            // Stats overlay with glassmorphism
            ctx.fillStyle = 'rgba(8, 12, 22, 0.88)';
            const boxW = 220, boxH = 140, boxX = 14, boxY = 14;
            ctx.beginPath();
            ctx.roundRect(boxX, boxY, boxW, boxH, 12);
            ctx.fill();
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Animated stat values
            ctx.font = '11px JetBrains Mono, monospace';
            ctx.textAlign = 'left';
            const lines = [
                ['均值', stats.mean.toFixed(2)],
                ['中位数', stats.median.toFixed(2)],
                ['标准差', stats.std.toFixed(2)],
                ['最小值', stats.min.toFixed(2)],
                ['最大值', stats.max.toFixed(2)]
            ];
            lines.forEach(([label, val], i) => {
                const ly = boxY + 24 + i * 22;
                ctx.fillStyle = '#7b8db5';
                ctx.fillText(`${label}:`, boxX + 16, ly);
                ctx.fillStyle = '#00e5ff';
                ctx.shadowColor = 'rgba(0, 229, 255, 0.3)';
                ctx.shadowBlur = 4;
                ctx.fillText(val, boxX + 85, ly);
                ctx.shadowBlur = 0;
            });

            // Data points as floating particles
            const t = moduleState.stats.time;
            displayData.slice(0, Math.min(displayData.length, 50)).forEach((v, i) => {
                const px = padding + ((v - min) / (max - min || 1)) * chartWidth;
                const baseY = height - padding - 5;
                const floatY = baseY - 5 - Math.sin(t * 2 + i * 0.5) * 3;
                const alpha = 0.2 + 0.3 * Math.sin(t + i * 0.3);

                ctx.fillStyle = `rgba(0, 229, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(px, floatY, 2, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // Easing functions
        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
        function easeOutBack(t) {
            const c1 = 1.70158;
            const c3 = c1 + 1;
            return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
        }

        // ==================== Physics Module ====================
        let particles = [];
        const numParticles = 200;
        let physicsGravity = 50;
        let physicsSpeed = 20;
        let physicsMode = 'orbit'; // orbit, vortex, swarm, explosion
        let physicsTrail = 0.3; // trail opacity (0 = full clear, 1 = no clear)

        function initParticles() {
            particles = [];
            for (let i = 0; i < numParticles; i++) {
                const angle = (i / numParticles) * Math.PI * 2;
                const radius = 50 + Math.random() * 200;
                particles.push({
                    x: width / 2 + Math.cos(angle) * radius,
                    y: height / 2 + Math.sin(angle) * radius,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    life: Math.random() * 100 + 50,
                    maxLife: 150,
                    size: Math.random() * 3 + 1,
                    angle: angle,
                    orbitRadius: radius,
                    orbitSpeed: (Math.random() - 0.5) * 0.02
                });
            }
        }

        function renderPhysics() {
            const t = moduleState.physics.time;

            // Trail effect with configurable opacity
            if (physicsTrail > 0.05) {
                ctx.fillStyle = `rgba(8, 12, 22, ${1 - physicsTrail})`;
                ctx.fillRect(0, 0, width, height);
            } else {
                ctx.fillStyle = '#080c16';
                ctx.fillRect(0, 0, width, height);
            }

            // Dynamic center based on mode
            let centerX, centerY;
            if (physicsMode === 'orbit') {
                centerX = width / 2 + Math.sin(t * 0.5) * 80;
                centerY = height / 2 + Math.cos(t * 0.7) * 60;
            } else if (physicsMode === 'vortex') {
                centerX = width / 2;
                centerY = height / 2;
            } else if (physicsMode === 'swarm') {
                centerX = width / 2 + Math.sin(t) * 150;
                centerY = height / 2 + Math.cos(t * 1.3) * 100;
            } else {
                centerX = width / 2;
                centerY = height / 2;
            }

            // Draw animated background rings
            const numRings = 5;
            for (let r = 0; r < numRings; r++) {
                const ringRadius = 60 + r * 50 + Math.sin(t * 0.5 + r) * 10;
                const alpha = 0.02 + 0.01 * Math.sin(t + r * 0.8);
                ctx.strokeStyle = `rgba(0, 229, 255, ${alpha})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(centerX, centerY, ringRadius, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Draw connections between nearby particles (enhanced)
            for (let i = 0; i < particles.length; i++) {
                let connections = 0;
                for (let j = i + 1; j < particles.length && connections < 5; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 80) {
                        const alpha = (1 - dist / 80) * 0.15;
                        const hue = ((t * 30 + i * 5) % 360);
                        ctx.strokeStyle = `hsla(${hue}, 70%, 50%, ${alpha})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                        connections++;
                    }
                }
            }

            particles.forEach((p, i) => {
                const dx = centerX - p.x;
                const dy = centerY - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy) + 1;

                // Different force calculations per mode
                let fx = 0, fy = 0;
                if (physicsMode === 'orbit') {
                    const force = physicsGravity / dist;
                    fx = dx / dist * force * 0.1 * (physicsSpeed / 20);
                    fy = dy / dist * force * 0.1 * (physicsSpeed / 20);
                    // Add tangential velocity for orbit
                    fx += -dy / dist * force * 0.05 * (physicsSpeed / 20);
                    fy += dx / dist * force * 0.05 * (physicsSpeed / 20);
                } else if (physicsMode === 'vortex') {
                    const force = physicsGravity / dist;
                    fx = -dy / dist * force * 0.15 * (physicsSpeed / 20);
                    fy = dx / dist * force * 0.15 * (physicsSpeed / 20);
                    fx += dx / dist * force * 0.02;
                    fy += dy / dist * force * 0.02;
                } else if (physicsMode === 'swarm') {
                    const force = physicsGravity / (dist * 0.5);
                    fx = dx / dist * force * 0.08 * (physicsSpeed / 20);
                    fy = dy / dist * force * 0.08 * (physicsSpeed / 20);
                    // Random jitter
                    fx += (Math.random() - 0.5) * 0.3;
                    fy += (Math.random() - 0.5) * 0.3;
                } else if (physicsMode === 'explosion') {
                    const force = -physicsGravity / (dist * 0.3);
                    fx = dx / dist * force * 0.1 * (physicsSpeed / 20);
                    fy = dy / dist * force * 0.1 * (physicsSpeed / 20);
                }

                p.vx += fx;
                p.vy += fy;
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                p.vx *= 0.995;
                p.vy *= 0.995;

                const alpha = Math.min(1, p.life / p.maxLife);
                const hue = (t * 40 + i * 1.8 + dist * 0.1) % 360;
                const sat = 70 + 20 * Math.sin(t * 2 + i);
                const light = 50 + 15 * Math.sin(t * 3 + i * 0.5);

                // Multi-layer glow effect
                // Outer glow
                ctx.shadowColor = `hsla(${hue}, ${sat}%, ${light}%, ${alpha * 0.5})`;
                ctx.shadowBlur = 15;
                ctx.fillStyle = `hsla(${hue}, ${sat}%, ${light}%, ${alpha * 0.3})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * alpha * 2, 0, Math.PI * 2);
                ctx.fill();

                // Inner core
                ctx.shadowColor = `hsla(${hue}, ${sat}%, ${light + 20}%, ${alpha})`;
                ctx.shadowBlur = 8;
                ctx.fillStyle = `hsla(${hue}, ${sat}%, ${light + 10}%, ${alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Respawn logic based on mode
                if (p.life <= 0 || p.x < -50 || p.x > width + 50 || p.y < -50 || p.y > height + 50) {
                    if (physicsMode === 'explosion') {
                        p.x = centerX + (Math.random() - 0.5) * 20;
                        p.y = centerY + (Math.random() - 0.5) * 20;
                        const angle = Math.random() * Math.PI * 2;
                        const speed = 2 + Math.random() * 4;
                        p.vx = Math.cos(angle) * speed;
                        p.vy = Math.sin(angle) * speed;
                    } else {
                        const angle = Math.random() * Math.PI * 2;
                        const radius = 50 + Math.random() * 250;
                        p.x = centerX + Math.cos(angle) * radius;
                        p.y = centerY + Math.sin(angle) * radius;
                        p.vx = (Math.random() - 0.5) * 2;
                        p.vy = (Math.random() - 0.5) * 2;
                    }
                    p.life = p.maxLife;
                }
            });

            // Center glow with pulsing effect
            const pulseSize = 60 + Math.sin(t * 2) * 15;
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, pulseSize);
            gradient.addColorStop(0, `rgba(0, 229, 255, ${0.15 + 0.05 * Math.sin(t * 3)})`);
            gradient.addColorStop(0.5, 'rgba(0, 229, 255, 0.04)');
            gradient.addColorStop(1, 'rgba(0, 229, 255, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, pulseSize, 0, Math.PI * 2);
            ctx.fill();

            // Center core with glow
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#00e5ff';
            ctx.shadowBlur = 25;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Mode indicator text on canvas
            ctx.fillStyle = 'rgba(0, 229, 255, 0.15)';
            ctx.font = 'bold 80px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const modeLabels = { orbit: 'ORBIT', vortex: 'VORTEX', swarm: 'SWARM', explosion: 'BLAST' };
            ctx.fillText(modeLabels[physicsMode] || '', width / 2, height / 2);
        }

        // ==================== Module Render & Animation ====================
        function renderCurrentModule() {
            switch (currentModule) {
                case 'function': renderFunction(); break;
                case 'fractal':  renderFractal();  break;
                case 'stats':    renderStats();    break;
                case 'physics':  renderPhysics();  break;
            }
        }

        function animateModule(mod) {
            const state = moduleState[mod];
            if (!state.playing) return;
            state.time += 0.016;
            renderCurrentModule();
            state.animId = requestAnimationFrame(() => animateModule(mod));
        }

        function toggleModulePlay(mod) {
            const state = moduleState[mod];
            state.playing = !state.playing;
            if (state.playing) {
                animateModule(mod);
            } else {
                if (state.animId) cancelAnimationFrame(state.animId);
                state.animId = null;
            }
            updateRightPanel();
        }

        // ==================== Module Switching ====================
        function switchModule(mod) {
            if (mod === currentModule) return;

            // Stop all animations
            Object.keys(moduleState).forEach(m => {
                if (moduleState[m].animId) {
                    cancelAnimationFrame(moduleState[m].animId);
                    moduleState[m].animId = null;
                }
            });

            // Transition effect
            const container = document.getElementById('canvasContainer');
            container.classList.add('switching');

            setTimeout(() => {
                currentModule = mod;

                // Full canvas clear
                ctx.clearRect(0, 0, width, height);

                // Reset physics particles when entering physics
                if (mod === 'physics') initParticles();

                // Update UI
                document.querySelectorAll('.nav-item').forEach(item => {
                    item.classList.toggle('active', item.dataset.module === mod);
                });

                const meta = moduleMeta[mod];
                document.getElementById('moduleIcon').textContent = meta.icon;
                document.getElementById('moduleText').textContent = meta.label;
                document.getElementById('canvasOverlay').textContent = meta.overlay;

                // Show/hide coord display
                document.getElementById('coordDisplay').style.display = mod === 'function' ? 'block' : 'none';

                updateRightPanel();
                renderCurrentModule();

                // Resume current module animation if it was playing
                if (moduleState[mod].playing) {
                    animateModule(mod);
                }

                container.classList.remove('switching');
            }, 150);
        }

                                ].map(s => `

                case 'stats':

                    panel.innerHTML = `
                        <div class="panel-section">

                                <div class="stat-item">

                case 'physics':
                    const totalSec = Math.floor(state.time);

                                <b>群聚</b>: 粒子跟随移动中心并随机抖动<br>
                                <b>爆发</b>: 粒子从中心向外爆发扩散<br>
                                调整拖尾可创造光轨效果
                            </div>
                        </div>
                    `;

        }

        // ==================== Control Functions ====================
        function addFunction() {
            const colors = ['#00e5ff', '#ff5c93', '#5cff8a', '#ffb347', '#a78bfa', '#f472b6'];
            functions.push({ expr: 'sin(x)', color: colors[functions.length % colors.length], visible: true });
            updateRightPanel();
            if (!moduleState.function.playing) renderCurrentModule();
        }

        function removeFunction(index) {
            functions.splice(index, 1);
            updateRightPanel();
            if (!moduleState.function.playing) renderCurrentModule();
        }

        function updateFunction(index, expr) {
            functions[index].expr = expr;
            if (!moduleState.function.playing) renderCurrentModule();
        }

        function setFunctionColor(color) {
            if (functions.length > 0) {
                functions[functions.length - 1].color = color;
                if (!moduleState.function.playing) renderCurrentModule();
            }
        }

        function loadPreset(expr) {
            const colors = ['#00e5ff', '#ff5c93', '#5cff8a', '#ffb347', '#a78bfa'];
            functions.push({ expr, color: colors[functions.length % colors.length], visible: true });
            updateRightPanel();
            if (!moduleState.function.playing) renderCurrentModule();
        }

        function setFractalType(type) {
            fractalParams.type = type;
            updateRightPanel();
            if (!moduleState.fractal.playing) renderCurrentModule();
        }

        function setFractalIter(value) {
            fractalParams.maxIter = parseInt(value);
            document.getElementById('iterValue').textContent = value;
            if (!moduleState.fractal.playing) renderCurrentModule();
        }

        function setFractalZoom(value) {
            fractalParams.zoom = parseFloat(value);
            document.getElementById('zoomValue').textContent = value;
            if (!moduleState.fractal.playing) renderCurrentModule();
        }

        function setFractalColor(scheme) {
            fractalParams.colorScheme = scheme;
            updateRightPanel();
            if (!moduleState.fractal.playing) renderCurrentModule();
        }

        function updateStatsData(value) {
            statsData = value.split(/[,，\s]+/).map(v => parseFloat(v)).filter(v => !isNaN(v));
            updateRightPanel();
            renderCurrentModule();
        }

        function generateRandomData(type) {
            let newData;
            const count = 200;
            if (type === 'normal') {
                newData = Array.from({ length: count }, () => {
                    let sum = 0;
                    for (let i = 0; i < 12; i++) sum += Math.random();
                    return (sum - 6) * 15 + 50;
                });
            } else if (type === 'uniform') {
                newData = Array.from({ length: count }, () => Math.random() * 100);
            } else if (type === 'exponential') {
                newData = Array.from({ length: count }, () => -20 * Math.log(1 - Math.random()));
            } else if (type === 'bimodal') {
                newData = Array.from({ length: count }, () => {
                    return Math.random() < 0.5
                        ? (Math.random() * 20 + 30)
                        : (Math.random() * 20 + 70);
                });
            }

            // Start smooth transition animation
            statsAnimState.currentData = [...statsData];
            statsAnimState.targetData = newData;
            statsAnimState.animProgress = 0;
            statsAnimState.isAnimating = true;
            statsAnimState.lastDistribution = type;
            statsData = newData;

            updateRightPanel();
            renderCurrentModule();
        }

        function exportImage() {
            const link = document.createElement('a');
            link.download = `mathviz-${currentModule}-${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }

        function setAnimMode(mode) {
            moduleState.function.mode = mode;
            updateRightPanel();
            if (!moduleState.function.playing) renderCurrentModule();
        }

        function setAnimParam(key, value) {
            funcAnimParams[key] = parseFloat(value);
            updateRightPanel();
            if (!moduleState.function.playing) renderCurrentModule();
        }

        function setPhysicsMode(mode) {
            physicsMode = mode;
            initParticles();
            updateRightPanel();
            if (!moduleState.physics.playing) renderCurrentModule();
        }

        function resetView() {
            // Stop all
            Object.keys(moduleState).forEach(m => {
                if (moduleState[m].animId) cancelAnimationFrame(moduleState[m].animId);
                moduleState[m].playing = false;
                moduleState[m].time = 0;
                moduleState[m].animId = null;
            });
            view = { xMin: -10, xMax: 10, yMin: -10, yMax: 10 };
            fractalParams = { maxIter: 100, zoom: 1, offsetX: 0, offsetY: 0, type: 'mandelbrot', colorScheme: 'fire' };
            physicsGravity = 50;
            physicsSpeed = 20;
            physicsMode = 'orbit';
            physicsTrail = 0.3;
            funcAnimParams = { amplitude: 1.0, frequency: 1.0, phase: 0, damping: 0, waveSpeed: 1.0 };
            moduleState.function.mode = 'wave';
            statsAnimState = { targetData: [], currentData: [], animProgress: 1, isAnimating: false, lastDistribution: '' };
            initParticles();
            updateRightPanel();
            renderCurrentModule();
        }

        // ==================== Initialization ====================
        window.onload = () => {
            resizeCanvas();
            updateRightPanel();
            initParticles();
            renderCurrentModule();
        };
    </script>
</body>
</html>
