<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>“看见”你的手 - 视障助手原型</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "PingFang SC", sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            padding: 24px 20px 32px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #1e293b;
        }
        .badge {
            background: #eef2ff;
            color: #4f46e5;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .camera-box {
            background: #e2e8f0;
            border-radius: 24px;
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 14px;
            border: 2px dashed #94a3b8;
            margin-bottom: 20px;
            transition: 0.2s;
            cursor: pointer;
        }
        .camera-box:active { background: #cbd5e1; }
        .camera-box .icon { font-size: 48px; margin-bottom: 8px; }
        .result-area {
            background: #f8fafc;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 20px;
            border-left: 4px solid #4f46e5;
        }
        .result-area .label {
            font-size: 12px;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }
        .result-area .value {
            font-size: 24px;
            font-weight: 600;
            color: #0f172a;
            margin-top: 4px;
        }
        .result-area .sub {
            font-size: 14px;
            color: #475569;
            margin-top: 6px;
        }
        .voice-btn {
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 500;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
            cursor: pointer;
        }
        .voice-btn:active { transform: scale(0.96); background: #4338ca; }
        .voice-btn .mic { font-size: 20px; }
        .footer-note {
            margin-top: 16px;
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
            border-top: 1px solid #e2e8f0;
            padding-top: 16px;
        }
        .tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 12px 0 8px;
        }
        .tag {
            background: #e2e8f0;
            border-radius: 16px;
            padding: 2px 12px;
            font-size: 11px;
            color: #334155;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👀 看见你的手</h1>
            <span class="badge">v0.1 原型</span>
        </div>

        <!-- 模拟取景框 -->
        <div class="camera-box" id="cameraSim">
            <div class="icon">📷</div>
            <div>点击模拟拍照 / 取景</div>
            <div style="font-size:12px; margin-top:4px;">（实际将调用摄像头）</div>
        </div>

        <!-- 识别结果展示 -->
        <div class="result-area" id="resultArea">
            <div class="label">🔍 识别结果</div>
            <div class="value" id="resultValue">等待识别...</div>
            <div class="sub" id="resultSub">点击上方拍照按钮开始</div>
            <div class="tag-group">
                <span class="tag"># 颜色：红色</span>
                <span class="tag"># 位置：正前方</span>
                <span class="tag"># 可信度：92%</span>
            </div>
        </div>

        <!-- 语音播报按钮 -->
        <button class="voice-btn" id="voiceBtn">
            <span class="mic">🔊</span> 语音播报结果
        </button>

        <div class="footer-note">
            TRAE Work 生成 · 创意概念演示 · 支持自定义物品标签
        </div>
    </div>

    <script>
        // 模拟物品识别库（实际调用AI API）
        const mockItems = [
            { name: '红色药瓶', color: '红色', pos: '正前方', confidence: '92%' },
            { name: '白色食盐罐', color: '白色', pos: '左前方', confidence: '88%' },
            { name: '蓝色运动鞋', color: '蓝色', pos: '右下方', confidence: '79%' },
            { name: '绿色苹果', color: '绿色', pos: '正上方', confidence: '95%' },
        ];

        let currentResult = mockItems[0];

        // 更新结果展示
        function updateResult(item) {
            document.getElementById('resultValue').textContent = item.name;
            document.getElementById('resultSub').textContent = `颜色：${item.color} ｜ 位置：${item.pos} ｜ 可信度：${item.confidence}`;
            // 更新标签（简单处理）
            const tagGroup = document.querySelector('.tag-group');
            tagGroup.innerHTML = `
                <span class="tag"># 颜色：${item.color}</span>
                <span class="tag"># 位置：${item.pos}</span>
                <span class="tag"># 可信度：${item.confidence}</span>
            `;
            currentResult = item;
        }

        // 随机选取一个物品
        function randomPick() {
            const idx = Math.floor(Math.random() * mockItems.length);
            return mockItems[idx];
        }

        // 拍照模拟
        document.getElementById('cameraSim').addEventListener('click', function() {
            const item = randomPick();
            updateResult(item);
            // 触感反馈（震动模拟）
            if (navigator.vibrate) navigator.vibrate(20);
            // 语音播报提示
            const msg = `识别到 ${item.name}，颜色 ${item.color}，在 ${item.pos}`;
            // 使用Web Speech API播报（可选）
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(msg);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.9;
                speechSynthesis.speak(utterance);
            }
        });

        // 语音播报按钮（重复播报当前结果）
        document.getElementById('voiceBtn').addEventListener('click', function() {
            if (!currentResult) return;
            const msg = `识别到 ${currentResult.name}，颜色 ${currentResult.color}，在 ${currentResult.pos}`;
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(msg);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.9;
                speechSynthesis.speak(utterance);
            } else {
                alert('您的浏览器不支持语音播报，但实际App中会集成。\n' + msg);
            }
        });

        // 初始化显示
        updateResult(mockItems[0]);
    </script>
</body>
</html>
