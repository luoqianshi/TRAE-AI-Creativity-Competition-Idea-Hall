<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创图工具箱 CreatoBox v2.0</title>
<!-- Google Fonts: Poppins(标题) + Noto Sans SC(UI中文) + 画布用字体 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&family=ZCOOL+XiaoWei&family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&family=Fira+Code&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<!-- Fabric.js 画布引擎 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<style>
/* ============================================================
   一、CSS 变量 & 主题（浅色/深色）
   设计基调：暖纸感底 + 紫色品牌主色 + 橙色AI辅色，区别于常见白底紫渐变
   ============================================================ */
:root{
  /* 浅色 */
  --bg-app:#faf9f5;        /* 暖纸感应用底 */
  --bg-surface:#ffffff;    /* 面板表面 */
  --bg-elev:#f3f1ea;       /* 凹陷/悬停 */
  --bg-canvas:#ffffff;
  --ink:#141413;           /* 主文字 */
  --ink-2:#4a4944;         /* 次文字 */
  --ink-3:#8d8b82;         /* 弱文字 */
  --line:#e6e3d8;          /* 分割线 */
  --line-2:#d9d5c7;
  --brand:#7C3AED;         /* 品牌紫 */
  --brand-2:#6D28D9;
  --brand-soft:#efe9fd;
  --ai:#d97757;            /* AI 橙 */
  --ai-soft:#fbe7df;
  --ok:#788c5d;            /* 成功绿 */
  --warn:#c98a2b;
  --danger:#c0473b;
  --shadow-sm:0 1px 2px rgba(20,20,19,.06),0 1px 1px rgba(20,20,19,.04);
  --shadow:0 4px 14px rgba(20,20,19,.08),0 2px 4px rgba(20,20,19,.05);
  --shadow-lg:0 18px 50px rgba(20,20,19,.18),0 6px 12px rgba(20,20,19,.08);
  --radius:10px;
  --radius-sm:7px;
  --radius-lg:16px;
  --nav-w:64px;
  --left-w:248px;
  --right-w:272px;
  --font-ui:'Noto Sans SC','Poppins',system-ui,sans-serif;
  --font-display:'Poppins','Noto Sans SC',sans-serif;
}
[data-theme="dark"]{
  --bg-app:#15151c;
  --bg-surface:#1d1d27;
  --bg-elev:#262633;
  --bg-canvas:#2a2a2a;
  --ink:#ece9e2;
  --ink-2:#b8b5ac;
  --ink-3:#7e7c75;
  --line:#2e2e3a;
  --line-2:#3a3a48;
  --brand:#A78BFA;
  --brand-2:#8B5CF6;
  --brand-soft:#2a2238;
  --ai:#e08a6c;
  --ai-soft:#3a241c;
  --ok:#9bb07e;
  --warn:#dca45a;
  --danger:#d9685b;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 6px 18px rgba(0,0,0,.45);
  --shadow-lg:0 24px 60px rgba(0,0,0,.6);
}

/* ============================================================
   二、全局样式 & 布局
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-ui);
  background:var(--bg-app);
  color:var(--ink);
  font-size:13px;
  line-height:1.5;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:13px;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);background-clip:content-box}

/* 细微纸纹噪点，增加质感 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(var(--line) 0.5px,transparent 0.5px);
  background-size:22px 22px;
}

/* 应用外壳：左导航 + 主区 */
.app-shell{position:relative;z-index:1;display:grid;grid-template-columns:var(--nav-w) 1fr;height:100vh;overflow:hidden}

/* ============================================================
   三、左侧导航栏
   ============================================================ */
.sidebar{
  background:var(--bg-surface);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;
  padding:14px 0 12px;gap:6px;position:relative;
}
.sidebar .logo{
  width:38px;height:38px;border-radius:11px;margin-bottom:10px;
  background:linear-gradient(135deg,var(--brand) 0%,#9b6df0 60%,var(--ai) 140%);
  display:grid;place-items:center;color:#fff;font-family:var(--font-display);
  font-weight:800;font-size:18px;box-shadow:0 6px 16px rgba(124,58,237,.4);
  position:relative;
}
.sidebar .logo::after{content:"";position:absolute;inset:0;border-radius:11px;border:1px solid rgba(255,255,255,.25)}
.nav-btn{
  width:44px;height:44px;border-radius:11px;display:grid;place-items:center;
  color:var(--ink-2);font-size:19px;position:relative;transition:.18s;
}
.nav-btn:hover{background:var(--bg-elev);color:var(--ink)}
.nav-btn.active{background:var(--brand-soft);color:var(--brand)}
.nav-btn.active::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:3px;height:22px;border-radius:3px;background:var(--brand)}
.nav-btn .tip{
  position:absolute;left:54px;top:50%;transform:translateY(-50%) translateX(-6px);
  background:var(--ink);color:var(--bg-surface);padding:5px 9px;border-radius:6px;
  font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:.16s;z-index:50;
  box-shadow:var(--shadow);
}
.nav-btn:hover .tip{opacity:1;transform:translateY(-50%) translateX(0)}
.sidebar .spacer{flex:1}
.sidebar .ver{font-size:10px;color:var(--ink-3);writing-mode:vertical-rl;letter-spacing:1px;margin-top:8px}

/* ============================================================
   四、主内容区 三栏
   ============================================================ */
.main-area{display:grid;grid-template-columns:var(--left-w) 1fr var(--right-w);min-width:0;overflow:hidden}
.main-area.no-side{grid-template-columns:0 1fr 0}
.main-area.no-side .left-panel,.main-area.no-side .right-panel{display:none}

/* —— 左面板 —— */
.left-panel{
  background:var(--bg-surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
}
.panel-head{
  padding:12px 14px 10px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.panel-head h3{font-family:var(--font-display);font-size:13px;font-weight:600;letter-spacing:.2px;display:flex;align-items:center;gap:7px}
.panel-head h3 .ic{font-size:15px}
.panel-search{position:relative;margin:10px 12px}
.panel-search input{
  width:100%;padding:8px 10px 8px 30px;border:1px solid var(--line);border-radius:var(--radius-sm);
  background:var(--bg-elev);color:var(--ink);outline:none;transition:.15s;
}
.panel-search input:focus{border-color:var(--brand);background:var(--bg-surface);box-shadow:0 0 0 3px var(--brand-soft)}
.panel-search .si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:13px}

/* 素材分类标签 */
.cat-tabs{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{
  flex:0 0 auto;padding:6px 11px;border-radius:999px;font-size:12px;color:var(--ink-2);
  background:var(--bg-elev);border:1px solid transparent;transition:.15s;white-space:nowrap;
}
.cat-tab:hover{color:var(--ink)}
.cat-tab.active{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 3px 9px rgba(124,58,237,.35)}

/* 素材网格 */
.asset-grid{flex:1;overflow-y:auto;padding:4px 12px 16px;display:grid;grid-template-columns:repeat(2,1fr);gap:9px;align-content:start}
.asset-item{
  position:relative;border-radius:var(--radius);overflow:hidden;cursor:grab;border:1px solid var(--line);
  background:var(--bg-elev);aspect-ratio:1;transition:.15s;
}
.asset-item:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--brand)}
.asset-item:active{cursor:grabbing}
.asset-item .thumb{width:100%;height:100%;display:grid;place-items:center}
.asset-item .lbl{position:absolute;left:0;right:0;bottom:0;padding:4px 7px;font-size:10.5px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));text-align:center}
.asset-item.color-row{aspect-ratio:auto;height:54px;grid-column:span 2;display:flex}
.asset-item.color-row .sw{flex:1;cursor:pointer;transition:.15s}
.asset-item.color-row .sw:hover{transform:scaleY(1.12)}

/* 工具箱卡片 */
.tool-list{flex:1;overflow-y:auto;padding:10px 12px 16px;display:flex;flex-direction:column;gap:8px}
.tool-card{
  display:flex;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--bg-surface);transition:.15s;cursor:pointer;
}
.tool-card:hover{border-color:var(--brand);box-shadow:var(--shadow-sm);transform:translateX(2px)}
.tool-card .tic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:18px;background:var(--brand-soft);flex-shrink:0}
.tool-card .tt{font-weight:600;font-size:12.5px}
.tool-card .td{font-size:11px;color:var(--ink-3);margin-top:2px}

/* —— 中间画布区 —— */
.center-col{display:flex;flex-direction:column;min-width:0;background:var(--bg-app)}
.tabs-bar{
  display:flex;align-items:center;gap:2px;padding:7px 10px 0;background:var(--bg-surface);
  border-bottom:1px solid var(--line);min-height:40px;
}
.tab{
  display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:9px 9px 0 0;font-size:12.5px;
  color:var(--ink-2);border:1px solid transparent;border-bottom:none;cursor:pointer;transition:.15s;max-width:180px;
}
.tab .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab:hover{background:var(--bg-elev);color:var(--ink)}
.tab.active{background:var(--bg-app);color:var(--ink);border-color:var(--line);position:relative}
.tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--bg-app)}
.tab .close{opacity:.5;font-size:14px;width:16px;height:16px;border-radius:4px;display:grid;place-items:center}
.tab .close:hover{opacity:1;background:var(--bg-elev)}
.tab-add{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3);font-size:18px;margin-left:4px}
.tab-add:hover{background:var(--bg-elev);color:var(--brand)}

/* 画布工具栏 */
.canvas-toolbar{
  display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg-surface);
  border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.tbtn{
  display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:var(--radius-sm);font-size:12.5px;
  color:var(--ink-2);background:var(--bg-elev);border:1px solid var(--line);transition:.15s;
}
.tbtn:hover{background:var(--bg-surface);color:var(--ink);border-color:var(--line-2)}
.tbtn.ai{color:var(--ai)}
.tbtn.ai:hover{background:var(--ai-soft);border-color:var(--ai)}
.tbtn.brand{color:var(--brand)}
.tbtn.brand:hover{background:var(--brand-soft);border-color:var(--brand)}
.tbtn .ic{font-size:14px}
.tbtn.icon-only{padding:7px 9px}
.tsep{width:1px;height:22px;background:var(--line);margin:0 3px}
.toolbar-spacer{flex:1}
.zoom-ctl{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3)}
.zoom-ctl input[type=range]{width:90px;accent-color:var(--brand)}

/* 画布容器 */
.canvas-wrap{
  flex:1;position:relative;overflow:auto;background:
    linear-gradient(45deg,var(--bg-elev) 25%,transparent 25%,transparent 75%,var(--bg-elev) 75%),
    linear-gradient(45deg,var(--bg-elev) 25%,var(--bg-app) 25%,var(--bg-app) 75%,var(--bg-elev) 75%);
  background-size:20px 20px;background-position:0 0,10px 10px;
  display:grid;place-items:center;padding:24px;
}
.canvas-stage{position:relative;box-shadow:var(--shadow-lg);background:#fff;border-radius:2px}
.canvas-stage canvas{display:block;border-radius:2px}
.canvas-bg-transparent .canvas-stage{background:
  conic-gradient(var(--bg-elev) 0 25%,transparent 0 50%,var(--bg-elev) 0 75%,transparent 0) 0 0/16px 16px;
}
.canvas-info{position:absolute;right:14px;bottom:14px;display:flex;align-items:center;gap:8px;background:var(--bg-surface);border:1px solid var(--line);padding:5px 10px;border-radius:999px;font-size:11px;color:var(--ink-2);box-shadow:var(--shadow-sm)}

/* 底部配文区 */
.caption-bar{
  background:var(--bg-surface);border-top:1px solid var(--line);padding:10px 12px;
  display:flex;gap:10px;align-items:flex-start;
}
.caption-bar textarea{
  flex:1;resize:none;height:48px;min-height:48px;max-height:120px;padding:9px 11px;border:1px solid var(--line);
  border-radius:var(--radius-sm);background:var(--bg-elev);color:var(--ink);outline:none;transition:.15s;line-height:1.5;
}
.caption-bar textarea:focus{border-color:var(--brand);background:var(--bg-surface);box-shadow:0 0 0 3px var(--brand-soft)}
.cap-actions{display:flex;flex-direction:column;gap:6px}
.cap-templates{display:flex;gap:6px;flex-wrap:wrap}
.cap-tpl{padding:5px 9px;border-radius:6px;font-size:11px;background:var(--bg-elev);color:var(--ink-2);border:1px solid var(--line);transition:.15s}
.cap-tpl:hover{color:var(--brand);border-color:var(--brand)}
.cap-count{font-size:10.5px;color:var(--ink-3);text-align:right;margin-top:2px}

/* 底部导出栏 */
.export-bar{
  background:var(--bg-surface);border-top:1px solid var(--line);padding:9px 12px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.export-bar .lbl{font-size:11.5px;color:var(--ink-3);margin-right:2px}
.size-btn{padding:6px 10px;border-radius:7px;font-size:11.5px;background:var(--bg-elev);border:1px solid var(--line);color:var(--ink-2);transition:.15s}
.size-btn:hover{color:var(--brand);border-color:var(--brand)}
.size-btn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.exp-sel{padding:6px 8px;border-radius:7px;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);outline:none}
.exp-spacer{flex:1}
.exp-btn{padding:8px 16px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 12px rgba(124,58,237,.35);transition:.15s}
.exp-btn:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(124,58,237,.45)}

/* —— 右面板 —— */
.right-panel{background:var(--bg-surface);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.rp-section{border-bottom:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.rp-section.flex{flex:1}
.rp-head{padding:11px 14px 9px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.rp-head h4{font-family:var(--font-display);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.rp-head .ic{font-size:14px;color:var(--brand)}
.rp-body{padding:0 12px 12px;overflow-y:auto}

/* 图层列表 */
.layer-list{display:flex;flex-direction:column;gap:4px;padding:0 10px 10px;overflow-y:auto;max-height:38vh}
.layer-item{
  display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:8px;border:1px solid transparent;
  cursor:pointer;transition:.12s;background:transparent;
}
.layer-item:hover{background:var(--bg-elev)}
.layer-item.active{background:var(--brand-soft);border-color:var(--brand)}
.layer-item .lthumb{width:24px;height:24px;border-radius:5px;background:var(--bg-elev);display:grid;place-items:center;font-size:12px;flex-shrink:0;overflow:hidden}
.layer-item .lname{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer-item .lname input{width:100%;background:var(--bg-surface);border:1px solid var(--brand);border-radius:4px;padding:2px 4px;outline:none}
.layer-item .lact{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font-size:12px;color:var(--ink-3);opacity:.6;transition:.12s}
.layer-item .lact:hover{opacity:1;background:var(--bg-surface);color:var(--ink)}
.layer-item.locked .lname{color:var(--ink-3)}
.layer-item.hidden{opacity:.45}
.layer-empty{padding:24px 12px;text-align:center;color:var(--ink-3);font-size:12px}

/* 属性面板 */
.prop-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 8px}
.prop-row{display:flex;flex-direction:column;gap:3px}
.prop-row.full{grid-column:span 2}
.prop-row label{font-size:10.5px;color:var(--ink-3);font-weight:500}
.prop-row input[type=number],.prop-row input[type=text],.prop-row select{
  width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg-elev);color:var(--ink);outline:none;transition:.12s;font-size:12px;
}
.prop-row input:focus,.prop-row select:focus{border-color:var(--brand);background:var(--bg-surface)}
.prop-row input[type=range]{width:100%;accent-color:var(--brand)}
.prop-row .with-val{display:flex;align-items:center;gap:7px}
.prop-row .with-val input[type=range]{flex:1}
.prop-row .with-val .v{font-size:11px;color:var(--ink-2);min-width:34px;text-align:right}
.color-input{display:flex;align-items:center;gap:6px}
.color-input input[type=color]{width:30px;height:28px;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer;padding:2px}
.color-input input[type=text]{flex:1}
.prop-section-title{font-size:11px;font-weight:600;color:var(--ink-2);margin:12px 0 7px;padding-bottom:5px;border-bottom:1px dashed var(--line);display:flex;align-items:center;gap:6px}
.prop-empty{padding:30px 14px;text-align:center;color:var(--ink-3);font-size:12px}
.prop-empty .emo{font-size:26px;display:block;margin-bottom:8px;opacity:.6}

.preset-styles{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.preset-style{padding:6px 9px;border-radius:6px;font-size:11px;background:var(--bg-elev);border:1px solid var(--line);transition:.12s}
.preset-style:hover{color:var(--brand);border-color:var(--brand)}

/* ============================================================
   五、弹窗组件
   ============================================================ */
.modal-mask{
  position:fixed;inset:0;background:rgba(20,20,19,.55);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;z-index:200;animation:fade .2s;
}
.modal-mask.show{display:flex}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.modal{
  background:var(--bg-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
  width:min(640px,92vw);max-height:88vh;overflow:hidden;display:flex;flex-direction:column;animation:pop .22s;
}
.modal.wide{width:min(820px,94vw)}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{font-family:var(--font-display);font-size:16px;font-weight:700;display:flex;align-items:center;gap:9px}
.modal-head .close{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:18px;color:var(--ink-3);transition:.12s}
.modal-head .close:hover{background:var(--bg-elev);color:var(--ink)}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;background:var(--bg-elev)}

.btn{padding:8px 16px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:500;transition:.15s;border:1px solid var(--line);background:var(--bg-surface);color:var(--ink)}
.btn:hover{background:var(--bg-elev)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(124,58,237,.3)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 7px 16px rgba(124,58,237,.4)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--bg-elev)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:#fff}

/* 工作流卡片 */
.wf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.wf-card{
  border:1.5px solid var(--line);border-radius:var(--radius);padding:16px 12px;text-align:center;cursor:pointer;transition:.16s;background:var(--bg-surface);
}
.wf-card:hover{border-color:var(--brand);transform:translateY(-3px);box-shadow:var(--shadow)}
.wf-card .wic{font-size:34px;margin-bottom:8px;display:block}
.wf-card .wtn{font-weight:600;font-size:13px;margin-bottom:4px}
.wf-card .wds{font-size:11px;color:var(--ink-3);line-height:1.4}
.wf-card .wratio{margin-top:7px;font-size:10px;color:var(--brand);background:var(--brand-soft);padding:2px 7px;border-radius:5px;display:inline-block}

/* AI 生成面板 */
.ai-gen-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.ai-gen-item{position:relative;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;aspect-ratio:1;background:var(--bg-elev);cursor:pointer;transition:.15s}
.ai-gen-item:hover{border-color:var(--brand);transform:scale(1.02)}
.ai-gen-item img{width:100%;height:100%;object-fit:cover}
.ai-gen-item .add-ov{position:absolute;inset:0;background:rgba(124,58,237,.6);display:grid;place-items:center;color:#fff;font-size:22px;opacity:0;transition:.15s}
.ai-gen-item:hover .add-ov{opacity:1}
.ai-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;color:var(--ink-3)}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============================================================
   六、设置 / 项目管理 整页视图
   ============================================================ */
.page-view{position:absolute;inset:0;background:var(--bg-app);z-index:30;display:none;flex-direction:column;overflow:hidden}
.page-view.show{display:flex}
.page-head{background:var(--bg-surface);border-bottom:1px solid var(--line);padding:16px 28px;display:flex;align-items:center;gap:14px}
.page-head h2{font-family:var(--font-display);font-size:18px;font-weight:700}
.page-head .back{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;background:var(--bg-elev);border:1px solid var(--line);font-size:12.5px;transition:.15s}
.page-head .back:hover{color:var(--brand);border-color:var(--brand)}
.page-body{flex:1;overflow-y:auto;padding:24px 28px 60px}
.page-body .inner{max-width:880px;margin:0 auto}

.set-card{background:var(--bg-surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.set-card h3{font-family:var(--font-display);font-size:14px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.set-card .desc{font-size:12px;color:var(--ink-3);margin-bottom:14px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px dashed var(--line)}
.set-row:last-child{border-bottom:none}
.set-row .k{font-size:13px;font-weight:500}
.set-row .k .sub{font-size:11px;color:var(--ink-3);font-weight:400;margin-top:2px}
.set-row .v{display:flex;align-items:center;gap:8px}

.radio-group{display:flex;gap:8px;flex-wrap:wrap}
.radio-card{display:flex;align-items:flex-start;gap:9px;padding:11px 13px;border:1.5px solid var(--line);border-radius:var(--radius);cursor:pointer;transition:.15s;flex:1;min-width:160px}
.radio-card:hover{border-color:var(--brand)}
.radio-card.active{border-color:var(--brand);background:var(--brand-soft)}
.radio-card .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);flex-shrink:0;margin-top:1px;position:relative;transition:.15s}
.radio-card.active .dot{border-color:var(--brand)}
.radio-card.active .dot::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--brand)}
.radio-card .rt .t{font-size:12.5px;font-weight:600}
.radio-card .rt .s{font-size:11px;color:var(--ink-3);margin-top:2px}

.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:7px 13px;font-size:12px;color:var(--ink-2);transition:.12s;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.active{background:var(--brand);color:#fff}

.input-pwd{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--bg-elev);min-width:240px}
.input-pwd input{border:none;background:none;outline:none;flex:1;font-size:12.5px}
.input-pwd .toggle{font-size:12px;color:var(--ink-3);padding:2px 6px;border-radius:5px;cursor:pointer}
.input-pwd .toggle:hover{background:var(--bg-surface);color:var(--ink)}
.key-status{font-size:11px;padding:3px 9px;border-radius:999px;font-weight:500}
.key-status.unverified{background:var(--bg-elev);color:var(--ink-3)}
.key-status.valid{background:rgba(120,140,93,.15);color:var(--ok)}
.key-status.invalid{background:rgba(192,71,59,.15);color:var(--danger)}

/* 项目管理 */
.pm-tabs{display:flex;gap:4px;background:var(--bg-surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.pm-tab{padding:7px 16px;border-radius:7px;font-size:12.5px;color:var(--ink-2);transition:.12s}
.pm-tab.active{background:var(--brand);color:#fff}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.proj-card{background:var(--bg-surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:.15s}
.proj-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--brand)}
.proj-card .pthumb{aspect-ratio:4/3;background:var(--bg-elev);display:grid;place-items:center;color:var(--ink-3);font-size:30px}
.proj-card .pbody{padding:11px 12px}
.proj-card .pn{font-weight:600;font-size:12.5px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-card .pm{font-size:11px;color:var(--ink-3)}
.proj-card .pacts{display:flex;gap:5px;padding:0 12px 11px;flex-wrap:wrap}
.proj-card .pacts button{font-size:11px;padding:4px 9px;border-radius:5px;background:var(--bg-elev);color:var(--ink-2);transition:.12s}
.proj-card .pacts button:hover{background:var(--brand);color:#fff}

/* Toast */
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:500;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:var(--bg-surface);padding:10px 18px;border-radius:999px;font-size:12.5px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;animation:toastIn .25s}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--danger)}

/* 右键菜单 */
.ctx-menu{position:fixed;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow-lg);padding:5px;z-index:300;min-width:160px;animation:pop .12s}
.ctx-menu .item{padding:7px 12px;border-radius:6px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--ink)}
.ctx-menu .item:hover{background:var(--brand-soft);color:var(--brand)}
.ctx-menu .item.danger:hover{background:rgba(192,71,59,.12);color:var(--danger)}
.ctx-menu .sep{height:1px;background:var(--line);margin:4px 2px}

.hidden{display:none!important}
</style>
</head>

<div class="app-shell">
  <!-- ===================== 左侧导航栏 ===================== -->

      <!-- 素材库视图 -->

      <!-- 工具箱视图 -->
      <div id="toolsView" class="hidden">
        <div class="tool-list" id="toolList"></div>
      </div>

    <!-- 中间画布区 -->
    <main class="center-col">
      <div class="tabs-bar" id="tabsBar"></div>

        <div class="tsep"></div>
        <button class="tbtn icon-only" id="btnUndo" title="撤销"><span class="ic">↶</span></button>
        <button class="tbtn icon-only" id="btnRedo" title="重做"><span class="ic">↷</span></button>
        <div class="tsep"></div>
        <button class="tbtn brand" id="btnSavePreset"><span class="ic">💾</span>保存预设</button>
        <button class="tbtn" id="btnPresets"><span class="ic">📋</span>预设</button>

          <button class="tbtn icon-only" id="btnZoomOut">−</button>

      <div class="canvas-wrap" id="canvasWrap">

      <div class="caption-bar">

          <button class="cap-tpl" data-tpl="xhs">小红书</button>

          <button class="cap-tpl" data-tpl="pyq">朋友圈</button>

        <textarea id="captionInput" placeholder="输入配文，或点击 ✨AI生成 配文…"></textarea>
        <div class="cap-actions">
          <button class="tbtn ai" id="btnAiCaption"><span class="ic">✨</span>AI生成</button>
          <button class="tbtn" id="btnCopyCap"><span class="ic">📋</span>复制</button>

      <div class="caption-bar" style="padding-top:0;border-top:none">

      <div class="export-bar">
        <span class="lbl">平台尺寸：</span>
        <button class="size-btn" data-w="1080" data-h="1440">小红书 3:4</button>
        <button class="size-btn" data-w="1080" data-h="1920">抖音 9:16</button>
        <button class="size-btn active" data-w="1080" data-h="1080">朋友圈 1:1</button>
        <button class="size-btn" data-w="900" data-h="383">公众号 2.35:1</button>
        <button class="size-btn" data-w="1920" data-h="1080">微博 16:9</button>

    <!-- 右面板 -->

<script>
/* ============================================================
  CreatoBox v2.0 —— 单文件实现
   分区：
   1. 全局状态  2. 工具函数  3. IndexedDB  4. AI API 层
   5. 画布核心  6. 图层管理  7. 素材库  8. 工具箱
   9. AI 配文   10. 预设系统  11. 设置中心  12. 项目管理
   13. 多标签页  14. 导出  15. 主题  16. 事件绑定 & 初始化
   ============================================================ */

/* ========== 1. 全局状态 ========== */
const State = {
  canvas: null,            // Fabric.Canvas 实例
  zoom: 1,
  theme: localStorage.getItem('cb_theme') || 'light',
  aiMode: localStorage.getItem('ai_mode') || 'demo',       // demo | builtin | custom
  aiPlatform: localStorage.getItem('ai_platform') || 'agnes',
  currentTab: null,        // 当前项目 tab
  tabs: [],                // 所有打开的项目 {id,name,workflow,canvasJSON,thumbnail}
  activeLayer: null,
  leftView: 'assets',      // assets | tools
  selectedWorkflow: 'default',
  undoStack: [],
  redoStack: [],
  maxUndo: 50,

/* ========== 3. IndexedDB 操作层 ========== */
const DB = {
  db: null,
  async init(){
    return new Promise((res,rej)=>{
      const req = indexedDB.open('CreatoBoxDB', 1);
      req.onupgradeneeded = e=>{
        const db = e.target.result;
        if(!db.objectStoreNames.contains('projects')) db.createObjectStore('projects',{keyPath:'id'});
        if(!db.objectStoreNames.contains('drafts')) db.createObjectStore('drafts',{keyPath:'id'});
        if(!db.objectStoreNames.contains('presets')) db.createObjectStore('presets',{keyPath:'id'});
        if(!db.objectStoreNames.contains('aiMaterials')) db.createObjectStore('aiMaterials',{keyPath:'id'});
        if(!db.objectStoreNames.contains('customMaterials')) db.createObjectStore('customMaterials',{keyPath:'id'});
      };
      req.onsuccess = e=>{ DB.db = e.target.result; res(); };
      req.onerror = e=>rej(e);
    });
  },
  async put(store, val){ return new Promise((res,rej)=>{ const tx=DB.db.transaction(store,'readwrite'); tx.objectStore(store).put(val); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); },
  async get(store, id){ return new Promise((res,rej)=>{ const tx=DB.db.transaction(store,'readonly'); const r=tx.objectStore(store).get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  async all(store){ return new Promise((res,rej)=>{ const tx=DB.db.transaction(store,'readonly'); const r=tx.objectStore(store).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  async del(store, id){ return new Promise((res,rej)=>{ const tx=DB.db.transaction(store,'readwrite'); tx.objectStore(store).delete(id); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); },
};

/* ========== 4. AI API 调用层 ========== */
/* 安全策略：密钥只从 localStorage 读取，绝不来自源码。
   - demo 模式：纯本地模板，不联网
   - custom 模式：用 localStorage 中的 key 调用 Agnes（OpenAI 兼容）
   - builtin 模式：占位，自动降级到 demo（避免在源码暴露密钥） */
function getApiKey(){
  if(State.aiMode === 'custom') return localStorage.getItem('custom_api_key') || '';
  return ''; // builtin 不内置任何密钥，降级到 demo
}
function getPlatformCfg(){
  return AGNES.platforms[State.aiPlatform] || AGNES.platforms.agnes;
}

/* 调用 Agnes Chat（OpenAI 兼容） */
async function callAIChat(prompt, system){
  const mode = State.aiMode;
  if(mode === 'demo' || mode === 'builtin') return null; // 由调用方走演示
  const key = getApiKey();
  if(!key){ toast('请先在设置中心配置 API Key','err'); return null; }
  const cfg = getPlatformCfg();
  try{
    const resp = await fetch(cfg.chat, {
      method:'POST',
      headers:{ 'Content-Type':'application/json','Authorization':`Bearer ${key}` },
      body: JSON.stringify({
        model: cfg.chatModel,
        messages: [
          { role:'system', content: system || '你是创意文案助手，用中文回答。' },
          { role:'user', content: prompt }
        ],
        temperature: 0.9
      })
    });
    if(!resp.ok){ const t = await resp.text(); console.warn('AI err',resp.status,t); return null; }
    const data = await resp.json();
    return data.choices?.[0]?.message?.content || null;
  }catch(e){ console.warn('AI call failed',e); return null; }
}

/* 调用 Agnes 图像生成 */
async function callAIImage(prompt, n=4){
  const mode = State.aiMode;
  if(mode === 'demo' || mode === 'builtin') return null;
  const key = getApiKey();
  if(!key){ toast('请先在设置中心配置 API Key','err'); return null; }
  const cfg = getPlatformCfg();
  if(!cfg.image){ toast('当前平台不支持图像生成','err'); return null; }
  try{
    const resp = await fetch(cfg.image, {
      method:'POST',
      headers:{ 'Content-Type':'application/json','Authorization':`Bearer ${key}` },
      body: JSON.stringify({ model: cfg.imageModel, prompt, n, size:'1024x1024', response_format:'url' })
    });
    if(!resp.ok){ console.warn('img err',resp.status, await resp.text()); return null; }
    const data = await resp.json();
    return (data.data||[]).map(d=>d.url || (d.b64_json? 'data:image/png;base64,'+d.b64_json : null)).filter(Boolean);
  }catch(e){ console.warn('img call failed',e); return null; }
}

/* ========== 5. 画布核心（Fabric.js 封装） ========== */
const CanvasCore = {
  init(w=1080, h=1080){
    if(State.canvas){ State.canvas.dispose(); }
    State.canvas = new fabric.Canvas('c', {
      width: w, height: h,
      backgroundColor: '#ffffff',
      preserveObjectStacking: true,
      selection: true,
    });
    this.bindCanvasEvents();
    this.setZoom(State.zoom);
  },
  bindCanvasEvents(){
    const c = State.canvas;
    c.on('selection:created', e=>{ LayerPanel.render(); PropPanel.render(); });
    c.on('selection:updated', e=>{ LayerPanel.render(); PropPanel.render(); });
    c.on('selection:cleared', e=>{ LayerPanel.render(); PropPanel.render(); });
    c.on('object:modified', ()=>{ this.pushUndo(); LayerPanel.render(); });
    c.on('object:added', ()=>{ LayerPanel.render(); });
    c.on('object:removed', ()=>{ LayerPanel.render(); });
    // 智能参考线吸附（简化版：中心对齐）
    c.on('object:moving', e=>{
      const obj = e.target; if(!obj) return;
      const cw = c.width, ch = c.height;
      const cx = obj.left + obj.width*obj.scaleX/2;
      const cy = obj.top + obj.height*obj.scaleY/2;
      if(Math.abs(cx - cw/2) < 6){ obj.left = cw/2 - obj.width*obj.scaleX/2; }
      if(Math.abs(cy - ch/2) < 6){ obj.top = ch/2 - obj.height*obj.scaleY/2; }
    });
  },
  setZoom(z){
    State.zoom = clamp(z, 0.2, 4);
    const c = State.canvas; if(!c) return;
    c.setZoom(State.zoom);
    const w = Math.round(c.getWidth()/State.zoom), h = Math.round(c.getHeight()/State.zoom);
    // Fabric 5: setDimensions with zoom via cssOnly 不直接缩放，使用 setZoom + setDimensions
    $('#zoomLabel').textContent = Math.round(State.zoom*100)+'%';
    $('#zoomRange').value = State.zoom;
    this.updateInfo();
  },
  updateInfo(){
    const c = State.canvas; if(!c) return;
    $('#canvasInfo').textContent = `${c.getWidth()} × ${c.getHeight()} · ${Math.round(State.zoom*100)}%`;
  },
  resize(w,h){
    const c = State.canvas; if(!c) return;
    c.setDimensions({width:w,height:h});
    this.updateInfo();
  },
  /* 添加图片对象（从 URL 或 dataURL） */
  addImageFromURL(url, opts={}){
    fabric.Image.fromURL(url, (img)=>{
      const c = State.canvas; const maxW = c.width*0.8, maxH = c.height*0.8;
      const scale = Math.min(maxW/img.width, maxH/img.height, 1);
      img.set({
        left: opts.left ?? (c.width/2 - img.width*scale/2),
        top: opts.top ?? (c.height/2 - img.height*scale/2),
        scaleX: scale, scaleY: scale,
        originX:'left', originY:'top',
      });
      img.set({ name: opts.name || '图片' });
      c.add(img); c.setActiveObject(img);
      this.pushUndo();
    }, {crossOrigin:'anonymous'});
  },
  addText(text='双击编辑文字', opts={}){
    const obj = new fabric.IText(text, {
      left: State.canvas.width/2 - 100, top: State.canvas.height/2 - 20,
      fontFamily:'Noto Sans SC', fontSize:36, fill:'#141413',
      fontWeight:'600', ...opts
    });
    obj.set('name','文字');
    State.canvas.add(obj); State.canvas.setActiveObject(obj);
    this.pushUndo();
  },
  addRectBg(fill){
    const c = State.canvas;
    const r = new fabric.Rect({ left:0, top:0, width:c.width, height:c.height, fill, selectable:true, evented:true });
    r.set('name','背景');
    c.add(r); c.sendToBack(r); c.setActiveObject(r);
    this.pushUndo();
  },
  /* 添加 SVG 贴纸 */
  addSVG(svgStr, opts={}){
    fabric.loadSVGFromString(svgStr, (objects, opt)=>{
      const obj = fabric.util.groupSVGElements(objects, opt);
      const c = State.canvas;
      const scale = Math.min(c.width*0.25/obj.width, c.height*0.25/obj.height, 1);
      obj.set({ left:c.width/2-obj.width*scale/2, top:c.height/2-obj.height*scale/2, scaleX:scale, scaleY:scale });
      obj.set('name','贴纸');
      if(opts.fill){ obj.set('fill', opts.fill); }
      c.add(obj); c.setActiveObject(obj); this.pushUndo();
    });
  },
  deleteActive(){
    const c = State.canvas; const objs = c.getActiveObjects();
    if(!objs.length) return;
    objs.forEach(o=>c.remove(o)); c.discardActiveObject();
    this.pushUndo();
  },
  pushUndo(){
    const json = JSON.stringify(State.canvas.toJSON(['name']));
    State.undoStack.push(json);
    if(State.undoStack.length > State.maxUndo) State.undoStack.shift();
    State.redoStack = [];
  },
  undo(){
    if(!State.undoStack.length) return;
    const cur = JSON.stringify(State.canvas.toJSON(['name']));
    State.redoStack.push(cur);
    const prev = State.undoStack.pop();
    State.canvas.loadFromJSON(prev, ()=>{ State.canvas.renderAll(); LayerPanel.render(); PropPanel.render(); });
  },
  redo(){
    if(!State.redoStack.length) return;
    const cur = JSON.stringify(State.canvas.toJSON(['name']));
    State.undoStack.push(cur);
    const next = State.redoStack.pop();
    State.canvas.loadFromJSON(next, ()=>{ State.canvas.renderAll(); LayerPanel.render(); PropPanel.render(); });
  },
};

/* ========== 6. 图层管理 ========== */
const LayerPanel = {
  render(){
    const c = State.canvas; const list = $('#layerList');
    if(!c){ list.innerHTML = '<div class="layer-empty">画布未初始化</div>'; return; }
    const objs = c.getObjects();
    if(!objs.length){ list.innerHTML = '<div class="layer-empty">画布上还没有图层</div>'; return; }
    // 顶层在前
    list.innerHTML = '';
    [...objs].reverse().forEach((o,i)=>{
      const active = c.getActiveObject() === o;
      const item = document.createElement('div');
      item.className = 'layer-item' + (active?' active':'') + (o.visible===false?' hidden':'') + (o.selectable===false?' locked':'');
      const icon = o.type==='i-text'||o.type==='text'?'🔤':o.type==='rect'?'⬛':o.type==='image'?'🖼️':o.type==='path'?'✏️':'◻️';
      item.innerHTML = `
        <div class="lthumb">${icon}</div>
        <div class="lname" data-id="${i}">${o.name||o.type}</div>
        <button class="lact" data-act="vis" title="可见性">${o.visible===false?'🚫':'👁️'}</button>
        <button class="lact" data-act="lock" title="锁定">${o.selectable===false?'🔒':'🔓'}</button>
      `;
      item.onclick = (e)=>{
        if(e.target.closest('.lact')) return;
        c.setActiveObject(o); c.renderAll();
      };
      item.querySelector('[data-act=vis]').onclick = ()=>{ o.visible = !o.visible; c.renderAll(); this.render(); };
      item.querySelector('[data-act=lock]').onclick = ()=>{ o.selectable = !o.selectable; o.evented = o.selectable; c.renderAll(); this.render(); };
      const nm = item.querySelector('.lname');
      nm.ondblclick = ()=>{ const cur = nm.textContent; const inp = document.createElement('input'); inp.value=cur; nm.textContent=''; nm.appendChild(inp); inp.focus(); inp.onblur=()=>{ o.name = inp.value||o.type; this.render(); }; inp.onkeydown=(ev)=>{ if(ev.key==='Enter') inp.blur(); }; };
      list.appendChild(item);
    });
  }
};

  async renderAIGrid(grid){
    try{
      const list = await DB.all('aiMaterials');
      if(!list.length){ grid.innerHTML='<div class="layer-empty" style="grid-column:span 2">还没有AI生成的素材，点击 ✨AI生成素材 创建</div>'; return; }
      list.sort((a,b)=>b.createdAt-a.createdAt).forEach(m=>{
        const el = document.createElement('div');
        el.className='asset-item';
        el.innerHTML = `<div class="thumb" style="background:url(${m.imageData||m.thumbnail}) center/cover"></div><div class="lbl">${(m.prompt||'').slice(0,12)}</div>`;
        el.onclick = ()=>{ CanvasCore.addImageFromURL(m.imageData||m.thumbnail, {name:'AI素材'}); };
        grid.appendChild(el);
      });
    }catch(e){ grid.innerHTML='<div class="layer-empty">读取失败</div>'; }
  },
  async renderMine(grid){
    try{
      const list = await DB.all('customMaterials');
      if(!list.length){
        grid.innerHTML=`<div class="layer-empty" style="grid-column:span 2">还没有自定义素材<br><button class="btn primary" style="margin-top:8px" onclick="document.getElementById('mineUpload').click()">上传素材</button></div>`;
        const inp = document.createElement('input'); inp.type='file'; inp.id='mineUpload'; inp.accept='image/*'; inp.style.display='none';
        inp.onchange = e=>{ AssetLib.uploadMine(e.target.files[0]); };
        grid.appendChild(inp);
        return;
      }
      list.forEach(m=>{
        const el = document.createElement('div');
        el.className='asset-item';
        el.innerHTML = `<div class="thumb" style="background:url(${m.imageData}) center/cover"></div><div class="lbl">${m.name}</div>`;
        el.onclick = ()=>{ CanvasCore.addImageFromURL(m.imageData, {name:m.name}); };
        grid.appendChild(el);
      });
    }catch(e){ grid.innerHTML='<div class="layer-empty">读取失败</div>'; }
  },
  uploadMine(file){
    if(!file) return;
    const r = new FileReader();
    r.onload = async ()=>{
      await DB.put('customMaterials', { id:uid(), name:file.name, imageData:r.result, thumbnail:r.result, createdAt:Date.now() });
      toast('已添加到我的素材','ok'); this.renderGrid();
    };
    r.readAsDataURL(file);
  },
  applyBackground(css){
    // 用渐变作为画布背景：生成 dataURL 太重，改为绘制 fabric Rect 填充（渐变用 fabric.Gradient）
    const c = State.canvas;
    // 解析简单 linear-gradient
    const m = css.match(/linear-gradient\((\d+)deg,(.+)\)/);
    if(m){
      const angle = parseInt(m[1]); const colors = m[2].split(',').map(s=>s.trim());
      const rect = new fabric.Rect({ left:0, top:0, width:c.width, height:c.height, selectable:true, evented:true });
      rect.set('name','背景');
      const grad = new fabric.Gradient({
        type:'linear',
        gradientUnits:'percentage',
        coords:{ x1:0,y1:0,x2:1,y2:1 },
        colorStops: colors.map((col,i)=>({offset:i/(colors.length-1), color:col}))
      });
      rect.set('fill', grad);
      c.add(rect); c.sendToBack(rect); c.setActiveObject(rect);
      CanvasCore.pushUndo();
    } else {
      CanvasCore.addRectBg(css);
    }
  }
};

  async generate(){

    const wf = WORKFLOWS.find(w=>w.id===State.selectedWorkflow)?.name || '默认';
    const prompt = `主题：${kw}。画布对象数：${objCount}，工作流：${wf}。请生成3条适合社交媒体的中文配文，每条带emoji和话题标签，用换行分隔。`;

    const result = await callAIChat(prompt, '你是社交媒体文案专家，用中文生成有吸引力的配文，每条独立一行。');
    let captions;
    if(result){
      captions = result.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,3);

          <div class="prop-row"><label>字体</label><select data-p="fontFamily">${['Noto Sans SC','Poppins','ZCOOL XiaoWei','ZCOOL KuaiLe','Ma Shan Zheng','Fira Code','Inter'].map(f=>`<option ${obj.fontFamily===f?'selected':''}>${f}</option>`).join('')}</select></div>
          <div class="prop-row"><label>字号</label><div class="with-val"><input type="range" min="8" max="200" data-p="fontSize" value="${obj.fontSize}"><span class="v">${obj.fontSize}</span></div></div>
          <div class="prop-row"><label>字重</label><select data-p="fontWeight">${['300','400','500','600','700','800','900'].map(w=>`<option ${String(obj.fontWeight)===w?'selected':''}>${w}</option>`).join('')}</select></div>
          <div class="prop-row"><label>行高</label><div class="with-val"><input type="range" min="0.8" max="3" step="0.05" data-p="lineHeight" value="${obj.lineHeight}"><span class="v">${obj.lineHeight.toFixed(2)}</span></div></div>
          <div class="prop-row full"><label>颜色</label><div class="color-input"><input type="color" data-p="fill" value="${obj.fill&&obj.fill[0]==='#'?obj.fill:'#141413'}"><input type="text" data-p="fillText" value="${obj.fill||''}"></div></div>
          <div class="prop-row"><label>对齐</label><select data-p="textAlign"><option ${obj.textAlign==='left'?'selected':''}>left</option><option ${obj.textAlign==='center'?'selected':''}>center</option><option ${obj.textAlign==='right'?'selected':''}>right</option></select></div>
          <div class="prop-row"><label>字间距</label><input type="number" data-p="charSpacing" value="${obj.charSpacing||0}"></div>
        </div>`;
    }
    body.innerHTML = html;
    this.bindProps(obj);
  },
  bindProps(obj){
    const c = State.canvas;
    $$('#propBody [data-p]').forEach(el=>{
      const p = el.dataset.p;
      const handler = ()=>{
        let v = el.type==='number'||el.type==='range'? parseFloat(el.value) : el.value;
        if(p==='fillText'){ obj.set('fill', el.value); }
        else if(p==='shadow'){ obj.set('shadow', v>0? new fabric.Shadow({color:'rgba(0,0,0,0.3)',blur:v,offsetX:0,offsetY:4}):null); }
        else if(p==='strokeW'){ obj.set('strokeWidth', v); if(v>0&&!obj.stroke) obj.set('stroke','#000'); }
        else if(p==='rx'){ obj.set('rx',v); obj.set('ry',v); }
        else if(p==='flipX'){ obj.set('flipX',!obj.flipX); }
        else if(p==='flipY'){ obj.set('flipY',!obj.flipY); }
        else if(p==='fill'){ obj.set('fill', el.value); }
        else { obj.set(p, v); }
        obj.setCoords(); c.renderAll();
        if(el.type==='range'){ const sib = el.parentElement.querySelector('.v'); if(sib) sib.textContent = p==='opacity'? Math.round(v*100)+'%' : (v.toFixed?p.includes('scale')?v.toFixed(2):Math.round(v):v); }
      };
      if(el.tagName==='BUTTON') el.onclick = handler;
      else el.oninput = handler;
    });
    $$('#propBody [data-ts]').forEach(b=>{
      b.onclick = ()=>{
        const s = b.dataset.ts;
        const styles = { title:{fontSize:36,fontWeight:'700'}, sub:{fontSize:24,fontWeight:'600'}, body:{fontSize:16,fontWeight:'400'}, water:{fontSize:14,fontWeight:'300',opacity:0.5} };
        Object.assign(obj, styles[s]); obj.set(styles[s]); c.renderAll(); this.render();
      };
    });
  }
};

/* ========== 14. 多标签页 ========== */
const Tabs = {
  create(name, workflow, canvasJSON){
    const tab = { id:uid(), name, workflow, canvasJSON, thumbnail:null };
    State.tabs.push(tab); State.currentTab = tab.id;
    this.render(); return tab;
  },
  render(){
    const bar = $('#tabsBar'); bar.innerHTML='';
    State.tabs.forEach(t=>{
      const wf = WORKFLOWS.find(w=>w.id===t.workflow);
      const el = document.createElement('div');
      el.className = 'tab'+(t.id===State.currentTab?' active':'');
      el.innerHTML = `<span>${wf?.icon||'⚪'}</span><span class="tn">${t.name}</span><span class="close" data-id="${t.id}">×</span>`;
      el.onclick = (e)=>{ if(e.target.classList.contains('close')) return; this.switch(t.id); };
      el.querySelector('.close').onclick = (e)=>{ e.stopPropagation(); this.close(t.id); };
      bar.appendChild(el);
    });
    const add = document.createElement('button');
    add.className='tab-add'; add.textContent='+'; add.onclick = ()=> openModal('newProjectModal');
    bar.appendChild(add);
  },
  switch(id){
    // 保存当前
    if(State.currentTab){ this.saveCurrent(); }
    State.currentTab = id;
    const t = State.tabs.find(x=>x.id===id);
    if(t && t.canvasJSON){ State.canvas.loadFromJSON(t.canvasJSON, ()=>{ State.canvas.renderAll(); LayerPanel.render(); PropPanel.render(); }); }
    this.render();
  },
  close(id){
    if(!confirm('关闭该标签页？')) return;
    State.tabs = State.tabs.filter(t=>t.id!==id);
    if(State.currentTab===id){
      if(State.tabs.length){ this.switch(State.tabs[State.tabs.length-1].id); }
      else { // 自动新建默认项目
        createDefaultProject();
      }
    }
    this.render();
  },
  saveCurrent(){
    const t = State.tabs.find(x=>x.id===State.currentTab);
    if(t){ t.canvasJSON = JSON.stringify(State.canvas.toJSON(['name'])); }
  }
};

/* ========== AI 素材生成 ========== */
async function generateAIAssets(){
  const prompt = $('#aiAssetPrompt').value.trim();
  if(!prompt){ toast('请输入描述','err'); return; }
  const grid = $('#aiGenGrid');
  grid.innerHTML = '';
  // 占位 loading
  for(let i=0;i<4;i++){
    const d = document.createElement('div');
    d.className='ai-gen-item'; d.innerHTML='<div class="ai-loading"><div class="spinner"></div>生成中…</div>';
    grid.appendChild(d);
  }
  // 尝试真实 API
  let urls = await callAIImage(prompt, 4);
  if(urls && urls.length){
    grid.innerHTML='';
    urls.forEach(u=>{
      const el = document.createElement('div');
      el.className='ai-gen-item';
      el.innerHTML = `<img src="${u}" alt=""><div class="add-ov">＋</div>`;
      el.onclick = async ()=>{
        CanvasCore.addImageFromURL(u, {name:'AI素材'});
        // 保存到素材库
        try{
          // 转 base64 存储
          const resp = await fetch(u); const blob = await resp.blob();
          const r = new FileReader();
          r.onload = async ()=>{ await DB.put('aiMaterials',{ id:uid(), prompt, imageData:r.result, thumbnail:r.result, type:$('#aiAssetType').value, createdAt:Date.now() }); };
          r.readAsDataURL(blob);
        }catch(e){}
        closeModal('aiAssetModal');
      };
      grid.appendChild(el);
    });
    toast('已生成 '+urls.length+' 张','ok');
  } else {
    // 演示模式：用 CSS 渐变模拟生成
    grid.innerHTML='';
    const palettes = [['#7C3AED','#22D3EE'],['#FF6B6B','#FFD93D'],['#065F46','#34D399'],['#1a1a2e','#FF00FF']];
    palettes.forEach((p,i)=>{
      const el = document.createElement('div');
      el.className='ai-gen-item';
      el.style.background = `linear-gradient(135deg,${p[0]},${p[1]})`;
      el.innerHTML = `<div class="add-ov">＋ 演示图</div>`;
      el.onclick = ()=>{
        // 用渐变生成一张图加到画布
        const off = document.createElement('canvas'); off.width=512; off.height=512;
        const oc = off.getContext('2d');
        const g = oc.createLinearGradient(0,0,512,512); g.addColorStop(0,p[0]); g.addColorStop(1,p[1]);
        oc.fillStyle=g; oc.fillRect(0,0,512,512);
        CanvasCore.addImageFromURL(off.toDataURL(), {name:'AI素材(演示)'});
        closeModal('aiAssetModal');
      };
      grid.appendChild(el);
    });
    toast('演示模式：已生成示例素材','');
  }
}

    { name:'方案 B · 左右分栏', apply:()=>{ objs.forEach((o,i)=>{ o.set({left: i%2===0? c.width*0.08 : c.width*0.52, top: c.height*0.2 + Math.floor(i/2)*c.height*0.3}); o.setCoords(); }); c.renderAll(); }},

  const el = $('#aiAssetMode'); if(!el) return;
  const map = { demo:'演示模式', builtin:'内置模式(降级演示)', custom: State.aiPlatform.toUpperCase()+' 已配置' };
  el.textContent = map[State.aiMode] || '演示模式';
  el.className = 'key-status ' + (State.aiMode==='custom'?'valid':'unverified');
}
function updateCapCount(){ const v = $('#captionInput').value; $('#capCount').textContent = v.length; }

/* ========== 事件绑定 & 初始化 ========== */
function bindEvents(){
  // 导航
  $$('.nav-btn').forEach(b=>b.onclick=()=>{
    const n = b.dataset.nav;
    if(n==='new'){ openModal('newProjectModal'); return; }
    if(n==='settings'){ showSettings(); return; }
    if(n==='projects'){ showProjects(); return; }
    // assets / tools：切换左面板
    $$('.nav-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    if(n==='assets'){ State.leftView='assets'; $('#assetsView').classList.remove('hidden'); $('#toolsView').classList.add('hidden'); $('#leftTitleIc').textContent='📦'; $('#leftTitle').textContent='素材库'; AssetLib.render(); }
    if(n==='tools'){ State.leftView='tools'; $('#toolsView').classList.remove('hidden'); $('#assetsView').classList.add('hidden'); $('#leftTitleIc').textContent='🛠️'; $('#leftTitle').textContent='工具箱'; Toolbox.render(); }
  });
  // 关闭弹窗
  $$('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));
  $$('.modal-mask').forEach(m=>m.onclick=e=>{ if(e.target===m) m.classList.remove('show'); });

  // 工作流卡片
  const wfg = $('#wfGrid'); wfg.innerHTML='';
  WORKFLOWS.forEach(w=>{
    const c = document.createElement('div'); c.className='wf-card';
    c.innerHTML = `<span class="wic">${w.icon}</span><div class="wtn">${w.name}</div><div class="wds">${w.desc}</div><div class="wratio">${w.ratio} · ${w.w}×${w.h}</div>`;
    c.onclick=()=>createProject(w.id);
    wfg.appendChild(c);
  });

  // 工具栏
  $('#btnImport').onclick=()=>$('#fileInput').click();
  $('#fileInput').onchange=e=>{ [...e.target.files].forEach(f=>{ const r=new FileReader(); r.onload=()=>CanvasCore.addImageFromURL(r.result,{name:f.name}); r.readAsDataURL(f); }); e.target.value=''; };
  $('#btnAddText').onclick=()=>CanvasCore.addText('双击编辑文字');
  $('#btnAiAsset').onclick=()=>{ updateAIModeBadge(); openModal('aiAssetModal'); };
  $('#btnAiAssetGen').onclick=generateAIAssets;
  $('#btnAiLayout').onclick=()=>openModal('aiLayoutModal');
  $('#btnLayoutGen').onclick=generateLayout;
  $('#btnSavePreset').onclick=()=>openModal('savePresetModal');
  $('#btnSavePreset2').onclick=()=>{ closeModal('presetModal'); openModal('savePresetModal'); };
  $('#btnPresets').onclick=async()=>{ await PresetSys.renderList(); openModal('presetModal'); };
  $('#btnLoadBuiltin').onclick=async()=>{ await PresetSys.renderList(); };
  $('#btnUndo').onclick=()=>CanvasCore.undo();
  $('#btnRedo').onclick=()=>CanvasCore.redo();
  $('#btnDelLayer').onclick=()=>CanvasCore.deleteActive();
  $('#btnZoomIn').onclick=()=>CanvasCore.setZoom(State.zoom+0.1);
  $('#btnZoomOut').onclick=()=>CanvasCore.setZoom(State.zoom-0.1);
  $('#zoomRange').oninput=e=>CanvasCore.setZoom(parseFloat(e.target.value));

  // 平台尺寸
  $$('.size-btn').forEach(b=>b.onclick=()=>{
    $$('.size-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active');
    CanvasCore.resize(parseInt(b.dataset.w), parseInt(b.dataset.h));
  });
  $('#btnExport').onclick=exportImage;

  // 配文
  $('#btnAiCaption').onclick=()=>AICaption.generate();
  $('#btnCopyCap').onclick=()=>{ navigator.clipboard.writeText($('#captionInput').value); toast('已复制','ok'); };
  $('#captionInput').oninput=updateCapCount;
  $$('.cap-tpl').forEach(b=>b.onclick=()=>{
    const tpls = { xhs:'✨ ｜ 这里填标题\n\n正文内容写在这里，记得分段哦～\n\n#话题1 #话题2', dy:'🔥 你绝对想不到…\n\n正文内容\n\n#话题', gzh:'标题\n\n摘要：一句话概括正文内容。', pyq:'今日份分享 ✨' };
    $('#captionInput').value = tpls[b.dataset.tpl]; updateCapCount();
  });

  // 保存预设
  $$('#presetTypeSeg button').forEach(b=>b.onclick=()=>{ $$('#presetTypeSeg button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); State.presetSaveType=b.dataset.v; });
  $('#btnConfirmSavePreset').onclick=()=>{
    const name = $('#presetName').value.trim() || '我的预设';
    const desc = $('#presetDesc').value.trim();
    PresetSys.save(name, desc, State.presetSaveType);
    closeModal('savePresetModal'); $('#presetName').value=''; $('#presetDesc').value='';
  };

  // 设置返回
  $('#settingsBack').onclick=showCanvas;
  $('#projectsBack').onclick=showCanvas;
  $$('.pm-tab').forEach(b=>b.onclick=()=>{ $$('.pm-tab').forEach(x=>x.classList.remove('active')); b.classList.add('active'); ProjectMgr.currentTab=b.dataset.pmtab; ProjectMgr.render(); });

  // 素材搜索
  $('#assetSearch').oninput=()=>AssetLib.renderGrid();

  // 画布拖放
  const wrap = $('#canvasWrap');
  wrap.ondragover=e=>{ e.preventDefault(); };
  wrap.ondrop=e=>{
    e.preventDefault();
    const data = e.dataTransfer.getData('text/plain');
    if(data.startsWith('bg::')){
      const [,css,name] = data.split('::'); AssetLib.applyBackground(css);
    } else if(data.startsWith('svg::')){
      const [,b64,name] = data.split('::');
      const svg = decodeURIComponent(escape(atob(b64)));
      CanvasCore.addSVG(svg);
    }
    // 拖拽文件
    if(e.dataTransfer.files.length){
      [...e.dataTransfer.files].forEach(f=>{ if(f.type.startsWith('image/')){ const r=new FileReader(); r.onload=()=>CanvasCore.addImageFromURL(r.result,{name:f.name}); r.readAsDataURL(f); } });
    }
  };
  // 粘贴图片
  document.addEventListener('paste', e=>{
    const items = e.clipboardData?.items; if(!items) return;
    [...items].forEach(it=>{ if(it.type.startsWith('image/')){ const blob=it.getAsFile(); const r=new FileReader(); r.onload=()=>CanvasCore.addImageFromURL(r.result,{name:'粘贴图片'}); r.readAsDataURL(blob); } });
  });
  // 键盘
  document.addEventListener('keydown', e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
    if(e.key==='Delete'||e.key==='Backspace'){ const c=State.canvas; if(c?.getActiveObject()){ e.preventDefault(); CanvasCore.deleteActive(); } }
    if((e.ctrlKey||e.metaKey)&&e.key==='z'){ e.preventDefault(); CanvasCore.undo(); }
    if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.shiftKey&&e.key==='z'))){ e.preventDefault(); CanvasCore.redo(); }
    if((e.ctrlKey||e.metaKey)&&e.key==='g'){ const c=State.canvas; const objs=c?.getActiveObjects(); if(objs&&objs.length>1){ e.preventDefault(); const g=new fabric.Group(objs); objs.forEach(o=>c.remove(o)); c.add(g); c.setActiveObject(g); } }
  });
}

/* ========== 启动 ========== */
async function init(){
  await DB.init();
  Theme.set(State.theme);
  bindEvents();
  AssetLib.render();
  // 创建默认项目并打开画布
  createDefaultProject();
  // 自动保存当前标签页到 IndexedDB（每 60 秒）
  setInterval(async ()=>{
    if(!State.canvas || !State.currentTab) return;
    const t = State.tabs.find(x=>x.id===State.currentTab); if(!t) return;
    Tabs.saveCurrent();
    const thumb = State.canvas.toDataURL({format:'png',multiplier:0.15});
    await DB.put('projects', { id:t.id, name:t.name, workflowType:t.workflow, canvasJSON:t.canvasJSON, thumbnail:thumb, updatedAt:Date.now(), layerCount: State.canvas.getObjects().length });
  }, 60000);
  // 系统主题变化监听
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if(State.theme==='auto') Theme.set('auto'); });
}
window.addEventListener('DOMContentLoaded', init);
</script>
</body>
