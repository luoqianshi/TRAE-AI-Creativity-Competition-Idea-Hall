<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水滴时钟 · DrinkDrop 智能喝水提醒</title>
<style>
  :root {
    --bg-1: #e0f2fe;
    --bg-2: #bae6fd;
    --card: rgba(255,255,255,0.7);
    --card-border: rgba(255,255,255,0.5);
    --title: #0369a1;
    --text: #0c4a6e;
    --sub: #075985;
    --accent: #0284c7;
    --accent-2: #38bdf8;
    --chip-bg: rgba(255,255,255,0.5);
    --chip-border: rgba(255,255,255,0.6);
    --btn-bg: rgba(255,255,255,0.8);
    --shadow: rgba(0,100,148,0.15);
    --track: rgba(2,132,199,0.12);
  }
  [data-theme="dark"] {
    --bg-1: #0c1a2b;
    --bg-2: #082f49;
    --card: rgba(15,35,55,0.7);
    --card-border: rgba(56,189,248,0.2);
    --title: #7dd3fc;
    --text: #e0f2fe;
    --sub: #bae6fd;
    --accent: #38bdf8;
    --accent-2: #0ea5e9;
    --chip-bg: rgba(56,189,248,0.1);
    --chip-border: rgba(56,189,248,0.25);
    --btn-bg: rgba(56,189,248,0.12);
    --shadow: rgba(0,0,0,0.4);
    --track: rgba(56,189,248,0.15);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(145deg, var(--bg-1) 0%, var(--bg-2) 100%);
    font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    color: var(--text);
    transition: background 0.4s;
  }
  .card {
    background: var(--card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 40px;
    padding: 30px 25px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 25px 45px var(--shadow), inset 0 1px 1px rgba(255,255,255,0.4);
    text-align: center;
    border: 1px solid var(--card-border);
    position: relative;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .icon-btn {
    background: var(--btn-bg);
    border: 1px solid var(--chip-border);
    width: 38px; height: 38px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.1em;
    color: var(--title);
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { transform: translateY(-2px); }
  .title {
    font-size: 1.8em;
    font-weight: 600;
    color: var(--title);
    letter-spacing: 2px;
  }
  .subtitle {
    color: var(--text);
    font-size: 0.9em;
    margin-bottom: 24px;
    opacity: 0.8;
  }
  .drop-container {
    position: relative;
    width: 180px;
    height: 180px;
    margin: 0 auto 22px;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    user-select: none;
  }
  .drop-container:active { transform: scale(0.94); }
  svg.drop { width: 100%; height: 100%; filter: drop-shadow(0 10px 15px rgba(2,132,199,0.25)); }
  .progress-text {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 2.4em;
    font-weight: 700;
    color: var(--text);
    text-shadow: 0 2px 5px rgba(255,255,255,0.8);
    pointer-events: none;
  }
  [data-theme="dark"] .progress-text { text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
  .glass-counter {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin: 12px 0 20px;
    font-size: 1.15em;
    color: var(--sub);
    background: var(--chip-bg);
    border-radius: 100px;
    padding: 8px 20px;
    backdrop-filter: blur(10px);
    border: 1px solid var(--chip-border);
  }
  .reminder-msg {
    background: var(--chip-bg);
    border-radius: 20px;
    padding: 12px 18px;
    margin: 12px 0 8px;
    color: var(--text);
    font-weight: 500;
    backdrop-filter: blur(5px);
    border: 1px solid var(--chip-border);
    transition: 0.3s;
    font-size: 0.95em;
  }
  .btn-group {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 14px;
  }
  .btn {
    background: var(--btn-bg);
    border: 1px solid var(--chip-border);
    padding: 12px 20px;
    border-radius: 30px;
    font-weight: 600;
    font-size: 0.95em;
    color: var(--title);
    box-shadow: 0 8px 18px rgba(0,115,148,0.1);
    cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(5px);
  }
  .btn:hover { box-shadow: 0 12px 22px rgba(0,115,148,0.2); transform: translateY(-2px); }
  .btn.primary { background: var(--accent); color: white; border: none; }
  .btn.primary:hover { background: var(--title); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .hint { margin-top:18px; font-size:0.75em; opacity:0.7; }

  /* 历史柱状图 */
  .history {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--chip-border);
  }
  .history-title { font-size: 0.9em; color: var(--sub); margin-bottom: 10px; font-weight: 600; }
  .chart { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; height: 90px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; }
  .bar-wrap { flex: 1; width: 100%; display: flex; align-items: flex-end; }
  .bar {
    width: 100%;
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
    border-radius: 6px 6px 2px 2px;
    transition: height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    min-height: 3px;
  }
  .bar.today { background: linear-gradient(180deg, #fbbf24, #f59e0b); box-shadow: 0 0 12px rgba(251,191,36,0.5); }
  .bar-label { font-size: 0.65em; color: var(--sub); opacity: 0.8; }
  .bar-val { font-size: 0.6em; color: var(--sub); opacity: 0.7; }

  /* 成就 */
  .achievements { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .badge {
    font-size: 0.72em;
    padding: 5px 11px;
    border-radius: 100px;
    background: var(--chip-bg);
    border: 1px solid var(--chip-border);
    color: var(--sub);
    opacity: 0.45;
    transition: 0.3s;
  }
  .badge.unlocked { opacity: 1; background: linear-gradient(135deg, #fef3c7, #fde68a); color: #92400e; border-color: #fbbf24; }

  /* 设置面板 */
  .modal-mask {
    position: fixed; inset: 0;
    background: rgba(8,47,73,0.4);
    backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center;
    z-index: 50;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 28px;
    padding: 26px;
    width: 90%; max-width: 360px;
    box-shadow: 0 25px 45px var(--shadow);
    text-align: left;
  }
  .modal h3 { color: var(--title); margin-bottom: 16px; text-align: center; }
  .setting-row { display: flex; justify-content: space-between; align-items: center; margin: 14px 0; color: var(--text); font-size: 0.95em; }
  .setting-row input[type="number"] {
    width: 64px; padding: 6px 8px; border-radius: 10px;
    border: 1px solid var(--chip-border); background: var(--btn-bg); color: var(--text);
    text-align: center; font-size: 1em;
  }
  .switch { position: relative; width: 46px; height: 26px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background: var(--track); border-radius: 100px; transition: 0.3s;
  }
  .slider:before {
    content: ""; position: absolute; height: 20px; width: 20px;
    left: 3px; top: 3px; background: white; border-radius: 50%; transition: 0.3s;
  }
  input:checked + .slider { background: var(--accent); }
  input:checked + .slider:before { transform: translateX(20px); }

  /* 涟漪 */
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.6);
    transform: translate(-50%, -50%) scale(0);
    pointer-events: none;
    animation: rippleAnim 0.7s ease-out forwards;
  }
  @keyframes rippleAnim {
    to { transform: translate(-50%, -50%) scale(3); opacity: 0; }
  }
  @keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-5px); }
    100% { transform: translateY(0px); }
  }
  .floating { animation: float 3s ease-in-out infinite; }
  @keyframes waveMove {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(2,132,199,0.95); color: white; padding: 12px 22px;
    border-radius: 100px; font-size: 0.9em; opacity: 0; transition: all 0.3s;
    z-index: 100; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="card">
  <div class="top-bar">
    <button class="icon-btn" id="themeBtn" title="切换主题">🌙</button>
    <span class="title">💧 水滴时钟</span>
    <button class="icon-btn" id="settingsBtn" title="设置">⚙️</button>
  </div>
  <div class="subtitle">DrinkDrop · 温柔提醒每一杯</div>

  <div class="drop-container floating" id="dropContainer">
    <svg class="drop" viewBox="0 0 100 100">
      <defs>
        <clipPath id="dropClip">
          <path d="M50 95 C25 95 15 70 15 55 C15 35 50 8 50 8 C50 8 85 35 85 55 C85 70 75 95 50 95 Z" />
        </clipPath>
        <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#7dd3fc"/>
          <stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>
      </defs>
      <path d="M50 95 C25 95 15 70 15 55 C15 35 50 8 50 8 C50 8 85 35 85 55 C85 70 75 95 50 95 Z" fill="none" stroke="#0284c7" stroke-width="2.5" opacity="0.7"/>
      <g clip-path="url(#dropClip)">
        <rect class="water-bg" x="12" y="95" width="76" height="0" fill="url(#waterGrad)" opacity="0.85" id="waterFill"/>
        <!-- 双层水波 -->
        <g id="waveGroup" transform="translate(0,95)">
          <path d="M-40 0 Q -30 -4 -20 0 T 0 0 T 20 0 T 40 0 T 60 0 T 80 0 T 100 0 T 120 0 L 120 20 L -40 20 Z" fill="#bae6fd" opacity="0.6" id="wave1"/>
          <path d="M-40 0 Q -25 4 -10 0 T 10 0 T 30 0 T 50 0 T 70 0 T 90 0 T 110 0 L 110 20 L -40 20 Z" fill="#7dd3fc" opacity="0.5" id="wave2"/>
        </g>
      </g>
      <ellipse cx="38" cy="45" rx="6" ry="9" fill="white" opacity="0.5" />
    </svg>
    <div class="progress-text" id="percentDisplay">0%</div>
  </div>

  <div class="glass-counter">
    <span>🥛</span> <span id="glassCount">0</span> <span id="goalText">/ 8 杯今日</span>
  </div>

  <div class="reminder-msg" id="reminderMsg">
    ⏰ 下次提醒：30分钟后
  </div>

  <div class="btn-group">
    <button class="btn" id="addGlassBtn">➕ 喝一杯</button>
    <button class="btn primary" id="resetBtn">🔄 重新开始</button>
  </div>

  <div class="achievements" id="achievements"></div>

  <div class="history">
    <div class="history-title">📊 近 7 日饮水记录</div>
    <div class="chart" id="chart"></div>
  </div>

  <p class="hint">点击水滴或按钮记录饮水 · 目标每日 <span id="goalHint">8</span> 杯(约200ml/杯)</p>
</div>

<!-- 设置弹窗 -->
<div class="modal-mask" id="settingsModal">
  <div class="modal">
    <h3>⚙️ 设置</h3>
    <div class="setting-row">
      <span>每日目标（杯）</span>
      <input type="number" id="goalInput" min="1" max="20" value="8">
    </div>
    <div class="setting-row">
      <span>提醒间隔（分钟）</span>
      <input type="number" id="intervalInput" min="5" max="240" value="30">
    </div>
    <div class="setting-row">
      <span>水滴音效</span>
      <label class="switch"><input type="checkbox" id="soundToggle" checked><span class="slider"></span></label>
    </div>
    <div class="setting-row">
      <span>浏览器通知</span>
      <label class="switch"><input type="checkbox" id="notifToggle"><span class="slider"></span></label>
    </div>
    <div class="btn-group">
      <button class="btn primary" id="saveSettingsBtn">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  const STORAGE_KEY = 'drinkdrop_v1';
  const MAX_HISTORY = 7;

  // 默认配置
  const defaults = {
    goal: 8,
    interval: 30,
    sound: true,
    notif: false,
    theme: 'light'
  };

  let state = loadState();

  // ---- 持久化 ----
  function todayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
  }
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return freshState();
      const s = JSON.parse(raw);
      // 跨天重置
      if (s.date !== todayKey()) {
        // 把昨天数据存入历史
        s.history = s.history || [];
        s.history.push({ date: s.date, count: s.count, goal: s.goal });
        if (s.history.length > MAX_HISTORY) s.history.shift();
        // 昨天未达标则连续天数清零
        if (s.count < (s.goal || defaults.goal)) s.streak = 0;
        s.count = 0;
        s.date = todayKey();
        s.streakClaimed = false;
        s.lastNotify = Date.now();
      }
      s.history = s.history || [];
      s.goal = s.goal || defaults.goal;
      s.interval = s.interval || defaults.interval;
      s.sound = s.sound !== undefined ? s.sound : defaults.sound;
      s.notif = s.notif !== undefined ? s.notif : defaults.notif;
      s.theme = s.theme || defaults.theme;
      s.streak = s.streak || 0;
      s.streakClaimed = s.streakClaimed || false;
      // lastNotify 为 0 时初始化为当前时间，避免首次加载立即触发提醒
      s.lastNotify = s.lastNotify || Date.now();
      return s;
    } catch(e) {
      return freshState();
    }
  }
  function freshState() {
    return {
      date: todayKey(),
      count: 0,
      goal: defaults.goal,
      interval: defaults.interval,
      sound: defaults.sound,
      notif: defaults.notif,
      theme: defaults.theme,
      history: [],
      streak: 0,
      streakClaimed: false,
      lastNotify: Date.now()
    };
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  }

  // ---- DOM ----
  const waterFill = document.getElementById('waterFill');
  const waveGroup = document.getElementById('waveGroup');
  const percentDisplay = document.getElementById('percentDisplay');
  const glassCountSpan = document.getElementById('glassCount');
  const goalText = document.getElementById('goalText');
  const goalHint = document.getElementById('goalHint');
  const reminderMsg = document.getElementById('reminderMsg');
  const dropContainer = document.getElementById('dropContainer');
  const achievementsEl = document.getElementById('achievements');
  const chartEl = document.getElementById('chart');
  const toastEl = document.getElementById('toast');

  // ---- 音效（Web Audio 生成水滴声）----
  let audioCtx = null;
  function playDropSound() {
    if (!state.sound) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const ctx = audioCtx;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.setValueAtTime(900, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.18);
      gain.gain.setValueAtTime(0.25, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } catch(e) {}
  }

  // ---- 振动反馈 ----
  function vibrate() {
    if (navigator.vibrate) navigator.vibrate(30);
  }

  // ---- 涟漪 ----
  function spawnRipple(x, y) {
    const r = document.createElement('span');
    r.className = 'ripple';
    const size = 40 + Math.random()*20;
    r.style.width = r.style.height = size + 'px';
    r.style.left = x + 'px';
    r.style.top = y + 'px';
    dropContainer.appendChild(r);
    setTimeout(() => r.remove(), 700);
  }

  // ---- Toast ----
  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  // ---- UI 更新 ----
  function updateUI() {
    const fillPercent = Math.min(state.count / state.goal, 1);
    const maxHeight = 80;
    const currentHeight = fillPercent * maxHeight;
    const waterY = 95 - currentHeight;
    waterFill.setAttribute('y', waterY);
    waterFill.setAttribute('height', currentHeight);
    waveGroup.setAttribute('transform', `translate(0,${waterY})`);

    percentDisplay.textContent = Math.round(fillPercent * 100) + '%';
    glassCountSpan.textContent = state.count;
    goalText.textContent = `/ ${state.goal} 杯今日`;
    goalHint.textContent = state.goal;

    updateReminder();
    renderAchievements();
    renderChart();
  }

  function updateReminder() {
    if (state.count >= state.goal) {
      reminderMsg.innerHTML = '🎉 太棒了！今日饮水目标达成！';
      return;
    }
    const remain = state.goal - state.count;
    const nextMs = (state.lastNotify || Date.now()) + state.interval * 60000 - Date.now();
    const mins = Math.max(0, Math.ceil(nextMs / 60000));
    reminderMsg.innerHTML = `⏰ 还差 ${remain} 杯，继续加油~ 下次提醒：约 ${mins} 分钟后`;
  }

  // ---- 成就 ----
  const ACHIEVEMENTS = [
    { id: 'first', icon: '🌱', name: '初次启程', test: s => s.count >= 1 },
    { id: 'half', icon: '⚡', name: '过半达成', test: s => s.count >= s.goal/2 },
    { id: 'done', icon: '🏆', name: '今日达标', test: s => s.count >= s.goal },
    { id: 'streak3', icon: '🔥', name: '连续3天', test: s => s.streak >= 3 },
    { id: 'streak7', icon: '💎', name: '连续7天', test: s => s.streak >= 7 }
  ];
  function renderAchievements() {
    achievementsEl.innerHTML = ACHIEVEMENTS.map(a => {
      const ok = a.test(state);
      return `<span class="badge ${ok?'unlocked':''}">${a.icon} ${a.name}</span>`;
    }).join('');
  }

  // ---- 历史柱状图 ----
  function renderChart() {
    // 取近7天：history(过去) + 今天
    const days = (state.history || []).slice(-6);
    const today = { date: todayKey(), count: state.count, goal: state.goal, today: true };
    const list = [...days, today].slice(-7);
    // 补齐到7天
    while (list.length < 7) list.unshift({ date: '', count: 0, goal: state.goal });
    const maxGoal = Math.max(...list.map(d => d.goal || state.goal), state.goal);
    chartEl.innerHTML = list.map(d => {
      const h = Math.round((d.count / (d.goal||state.goal)) * 100);
      const label = d.date ? d.date.slice(-2) : '·';
      return `<div class="bar-col">
        <div class="bar-wrap"><div class="bar ${d.today?'today':''}" style="height:${Math.max(3,h)}%"></div></div>
        <span class="bar-val">${d.count}</span>
        <span class="bar-label">${d.today?'今':label}</span>
      </div>`;
    }).join('');
  }

  // ---- 喝一杯 ----
  function addGlass(e) {
    if (state.count >= state.goal) {
      toast('今日目标已完成，你超棒！🥳');
      return;
    }
    state.count++;
    // 涟漪位置
    if (e) {
      const rect = dropContainer.getBoundingClientRect();
      const x = (e.clientX || rect.left+rect.width/2) - rect.left;
      const y = (e.clientY || rect.top+rect.height/2) - rect.top;
      spawnRipple(x, y);
    }
    playDropSound();
    vibrate();
    // 达标处理 streak（每日仅累加一次）
    if (state.count === state.goal) {
      if (!state.streakClaimed) {
        state.streak = (state.streak || 0) + 1;
        state.streakClaimed = true;
      }
      toast('🎉 达成今日目标！连续 ' + state.streak + ' 天');
      if (state.notif && Notification.permission === 'granted') {
        new Notification('💧 水滴时钟', { body: '太棒了！今日饮水目标已达成！' });
      }
    }
    saveState();
    updateUI();
    dropContainer.style.transform = 'scale(1.06)';
    setTimeout(() => { dropContainer.style.transform = ''; }, 160);
  }

  function resetDay() {
    if (confirm('确定要重置今日饮水记录吗？')) {
      state.count = 0;
      saveState();
      updateUI();
      toast('已重置今日记录');
    }
  }

  // ---- 提醒定时器 ----
  function checkReminder() {
    if (state.count >= state.goal) return;
    const now = Date.now();
    if (now - state.lastNotify >= state.interval * 60000) {
      state.lastNotify = now;
      saveState();
      const remain = state.goal - state.count;
      if (state.notif && Notification.permission === 'granted') {
        new Notification('💧 该喝水啦', { body: `还差 ${remain} 杯达成今日目标，喝一口吧~` });
      }
      toast('💧 喝口水吧，还差 ' + remain + ' 杯');
      vibrate();
    }
    updateReminder();
  }

  // ---- 水波动画 ----
  let waveOffset = 0;
  function animateWave() {
    waveOffset = (waveOffset - 0.4) % 40;
    waveGroup.setAttribute('transform', `translate(${waveOffset},${95 - (Math.min(state.count/state.goal,1))*80})`);
    requestAnimationFrame(animateWave);
  }

  // ---- 主题 ----
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', state.theme);
    document.getElementById('themeBtn').textContent = state.theme === 'dark' ? '☀️' : '🌙';
  }
  function toggleTheme() {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    applyTheme();
    saveState();
  }

  // ---- 设置 ----
  const settingsModal = document.getElementById('settingsModal');
  document.getElementById('settingsBtn').addEventListener('click', () => {
    document.getElementById('goalInput').value = state.goal;
    document.getElementById('intervalInput').value = state.interval;
    document.getElementById('soundToggle').checked = state.sound;
    document.getElementById('notifToggle').checked = state.notif;
    settingsModal.classList.add('show');
  });
  settingsModal.addEventListener('click', e => { if (e.target === settingsModal) settingsModal.classList.remove('show'); });
  document.getElementById('saveSettingsBtn').addEventListener('click', () => {
    state.goal = Math.max(1, Math.min(20, parseInt(document.getElementById('goalInput').value)||8));
    state.interval = Math.max(5, Math.min(240, parseInt(document.getElementById('intervalInput').value)||30));
    state.sound = document.getElementById('soundToggle').checked;
    state.notif = document.getElementById('notifToggle').checked;
    if (state.notif && Notification.permission === 'default') {
      Notification.requestPermission();
    }
    saveState();
    updateUI();
    settingsModal.classList.remove('show');
    toast('设置已保存');
  });

  // ---- 事件绑定 ----
  dropContainer.addEventListener('click', addGlass);
  document.getElementById('addGlassBtn').addEventListener('click', addGlass);
  document.getElementById('resetBtn').addEventListener('click', resetDay);
  document.getElementById('themeBtn').addEventListener('click', toggleTheme);

  // ---- 初始化 ----
  applyTheme();
  updateUI();
  animateWave();
  // 每30秒检查一次提醒
  setInterval(checkReminder, 30000);
  // 每分钟刷新倒计时显示
  setInterval(updateReminder, 60000);
})();
</script>
</body>
</html>
