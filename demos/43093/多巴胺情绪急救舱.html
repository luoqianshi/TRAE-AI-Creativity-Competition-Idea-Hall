<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多巴胺情绪急救舱</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            padding-bottom: 40px;
            transition: background 1s ease;
        }

        .gradient-1 { background: linear-gradient(135deg, #ff6b6b 0%, #feca57 50%, #48dbfb 100%); }
        .gradient-2 { background: linear-gradient(135deg, #ff9ff3 0%, #f368e0 50%, #ee5a24 100%); }
        .gradient-3 { background: linear-gradient(135deg, #54a0ff 0%, #5f27cd 50%, #00d2d3 100%); }
        .gradient-4 { background: linear-gradient(135deg, #1dd1a1 0%, #10ac84 50%, #ff9ff3 100%); }
        .gradient-5 { background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 50%, #ff9ff3 100%); }
        .gradient-6 { background: linear-gradient(135deg, #48dbfb 0%, #0abde3 50%, #54a0ff 100%); }
        .gradient-7 { background: linear-gradient(135deg, #feca57 0%, #ff9f43 50%, #ee5a24 100%); }

        .container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-width: 500px;
            width: 100%;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .title {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(255, 107, 107, 0.3);
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .mu-yu-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mu-yu {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ff9f43, #ee5a24);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 
                0 10px 40px rgba(238, 90, 36, 0.4),
                inset 0 -5px 15px rgba(0, 0, 0, 0.2),
                inset 0 5px 15px rgba(255, 255, 255, 0.3);
            transition: transform 0.1s ease;
            position: relative;
            user-select: none;
        }

        .mu-yu:active {
            transform: scale(0.9);
        }

        .mu-yu:hover {
            box-shadow: 
                0 15px 50px rgba(238, 90, 36, 0.5),
                inset 0 -5px 15px rgba(0, 0, 0, 0.2),
                inset 0 5px 15px rgba(255, 255, 255, 0.3);
        }

        .mu-yu-inner {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ffc048, #ff9f43);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                inset 0 3px 8px rgba(255, 255, 255, 0.5),
                inset 0 -3px 8px rgba(0, 0, 0, 0.1);
        }

        .mu-yu-text {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: 4px;
        }

        .floating-text {
            position: absolute;
            font-size: 20px;
            font-weight: 600;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 100;
        }

        .floating-text.positive {
            background: linear-gradient(135deg, #1dd1a1, #10ac84);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .floating-text.negative {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-60px) scale(1.2);
            }
        }

        .merit-count {
            margin-top: 20px;
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .merit-count span {
            background: linear-gradient(135deg, #ff9f43, #ee5a24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .gacha-card {
            text-align: center;
        }

        .gacha-title {
            font-size: 20px;
            font-weight: 700;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .gacha-title::before,
        .gacha-title::after {
            content: '🎰';
        }

        .gacha-display {
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px dashed #ddd;
            transition: all 0.3s ease;
        }

        .gacha-display.reveal {
            border-color: #ff9f43;
            background: linear-gradient(135deg, #fff9f0 0%, #fff5eb 100%);
        }

        .gacha-quote {
            font-size: 16px;
            color: #333;
            line-height: 1.6;
            font-weight: 500;
        }

        .gacha-btn {
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #ff9f43, #ee5a24);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(238, 90, 36, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .gacha-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(238, 90, 36, 0.4);
        }

        .gacha-btn:active {
            transform: translateY(0);
        }

        .gacha-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .gacha-btn:hover::before {
            left: 100%;
        }

        .breathing-card {
            text-align: center;
        }

        .breathing-title {
            font-size: 20px;
            font-weight: 700;
            color: #333;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .breathing-title::before,
        .breathing-title::after {
            content: '🌬️';
        }

        .breathing-circle-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            height: 200px;
        }

        .breathing-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: linear-gradient(135deg, #48dbfb, #0abde3);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: breathing 19s ease-in-out infinite;
            box-shadow: 
                0 0 30px rgba(72, 219, 251, 0.4),
                0 0 60px rgba(72, 219, 251, 0.2),
                inset 0 0 30px rgba(255, 255, 255, 0.3);
            position: relative;
        }

        .breathing-circle::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
        }

        .breathing-status {
            position: relative;
            font-size: 18px;
            font-weight: 600;
            color: #333;
            z-index: 1;
        }

        .breathing-timer {
            position: absolute;
            bottom: 0;
            font-size: 14px;
            color: #999;
            margin-top: 10px;
        }

        @keyframes breathing {
            0% {
                transform: scale(1);
                box-shadow: 
                    0 0 30px rgba(72, 219, 251, 0.4),
                    0 0 60px rgba(72, 219, 251, 0.2),
                    inset 0 0 30px rgba(255, 255, 255, 0.3);
            }
            21% {
                transform: scale(1);
                box-shadow: 
                    0 0 30px rgba(72, 219, 251, 0.4),
                    0 0 60px rgba(72, 219, 251, 0.2),
                    inset 0 0 30px rgba(255, 255, 255, 0.3);
            }
            42% {
                transform: scale(1.25);
                box-shadow: 
                    0 0 45px rgba(72, 219, 251, 0.5),
                    0 0 90px rgba(72, 219, 251, 0.3),
                    inset 0 0 40px rgba(255, 255, 255, 0.3);
            }
            42.1% {
                transform: scale(1.25);
            }
            80% {
                transform: scale(1.25);
                box-shadow: 
                    0 0 45px rgba(72, 219, 251, 0.5),
                    0 0 90px rgba(72, 219, 251, 0.3),
                    inset 0 0 40px rgba(255, 255, 255, 0.3);
            }
            100% {
                transform: scale(1);
                box-shadow: 
                    0 0 30px rgba(72, 219, 251, 0.4),
                    0 0 60px rgba(72, 219, 251, 0.2),
                    inset 0 0 30px rgba(255, 255, 255, 0.3);
            }
        }

        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body class="gradient-1">
    <div class="container">
        <div class="card">
            <h1 class="title">🎯 多巴胺情绪急救舱</h1>
            <p class="subtitle">打工人的心灵按摩站</p>
            
            <div class="mu-yu-wrapper">
                <div class="mu-yu" id="muYu">
                    <div class="mu-yu-inner">
                        <span class="mu-yu-text">赛博木鱼</span>
                    </div>
                </div>
                <div class="merit-count">累计功德: <span id="meritCount">0</span></div>
            </div>
        </div>

        <div class="card gacha-card">
            <h2 class="gacha-title">情绪扭蛋机</h2>
            <div class="gacha-display" id="gachaDisplay">
                <span class="gacha-quote">点击按钮抽取今日毒舌安慰</span>
            </div>
            <button class="gacha-btn" id="gachaBtn">🎲 抽取今日毒舌安慰</button>
        </div>

        <div class="card breathing-card">
            <h2 class="breathing-title">呼吸冥想</h2>
            <div class="breathing-circle-wrapper">
                <div class="breathing-circle">
                    <span class="breathing-status" id="breathingStatus">吸气</span>
                </div>
                <div class="breathing-timer" id="breathingTimer">4''</div>
            </div>
        </div>
    </div>

    <div class="footer">
        💡 点击木鱼获得功德 | 抽取毒舌安慰 | 跟随呼吸放松
    </div>

    <script>
        const gradients = ['gradient-1', 'gradient-2', 'gradient-3', 'gradient-4', 'gradient-5', 'gradient-6', 'gradient-7'];
        const quotes = [
            '搞钱要紧，emo伤身',
            '哪怕生活把你打倒，也别忘了摆个舒服的姿势',
            '今天过得不好没关系，反正明天也差不多',
            '赛博木鱼敲得响，明天就把老板宰（开除）',
            '上班只是带薪学习，摸鱼才是主业',
            '人生苦短，必须性感（划掉）——必须摸鱼',
            '打工是不可能打工的，这辈子都不可能打工的',
            '老板画的饼太大，我怕消化不良'
        ];
        
        let meritCount = 0;
        let currentGradient = 0;
        let breathingPhase = 0;
        let breathingTimer = 4;
        let breathingInterval;

        const muYu = document.getElementById('muYu');
        const meritCountEl = document.getElementById('meritCount');
        const gachaDisplay = document.getElementById('gachaDisplay');
        const gachaBtn = document.getElementById('gachaBtn');
        const breathingStatus = document.getElementById('breathingStatus');
        const breathingTimerEl = document.getElementById('breathingTimer');

        muYu.addEventListener('click', function(e) {
            meritCount++;
            meritCountEl.textContent = meritCount;
            
            const rect = muYu.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const floatingText = document.createElement('span');
            floatingText.className = `floating-text ${Math.random() > 0.5 ? 'positive' : 'negative'}`;
            floatingText.textContent = Math.random() > 0.5 ? '功德 +1' : '焦虑 -1';
            floatingText.style.left = `${x}px`;
            floatingText.style.top = `${y}px`;
            muYu.appendChild(floatingText);
            
            setTimeout(() => {
                floatingText.remove();
            }, 1000);
            
            currentGradient = (currentGradient + 1) % gradients.length;
            document.body.className = gradients[currentGradient];
        });

        gachaBtn.addEventListener('click', function() {
            gachaDisplay.classList.remove('reveal');
            gachaDisplay.innerHTML = '<span class="gacha-quote">🎰 正在抽取...</span>';
            
            setTimeout(() => {
                const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
                gachaDisplay.classList.add('reveal');
                gachaDisplay.innerHTML = `<span class="gacha-quote">💬 ${randomQuote}</span>`;
            }, 800);
        });

        function startBreathingCycle() {
            breathingInterval = setInterval(() => {
                breathingTimer--;
                
                if (breathingTimer <= 0) {
                    breathingPhase = (breathingPhase + 1) % 3;
                    
                    if (breathingPhase === 0) {
                        breathingStatus.textContent = '吸气';
                        breathingTimer = 4;
                    } else if (breathingPhase === 1) {
                        breathingStatus.textContent = '憋气';
                        breathingTimer = 7;
                    } else {
                        breathingStatus.textContent = '呼气';
                        breathingTimer = 8;
                    }
                }
                
                breathingTimerEl.textContent = breathingTimer + '\'\'';
            }, 1000);
        }

        startBreathingCycle();
    </script>
</body>
</html>
