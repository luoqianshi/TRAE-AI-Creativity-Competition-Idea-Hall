<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>拥有积极的心理</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fdf5df;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      touch-action: manipulation;
    }
    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at top, #fff6d6 0%, #ffe8ba 45%, #f8cfa1 100%);
    }
    #gameCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #uiLayer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .panel {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(92vw, 560px);
      max-height: min(82vh, 900px);
      overflow-y: auto;
      border-radius: 24px;
      padding: 18px 16px 20px;
      background: rgba(255, 251, 242, 0.96);
      border: 4px solid #7f5c43;
      box-shadow: 0 18px 40px rgba(92, 60, 39, 0.18);
      pointer-events: auto;
      color: #5a3d2b;
    }
    .panel h2 {
      margin: 0 0 12px;
      text-align: center;
      font-size: clamp(22px, 4.6vw, 30px);
      color: #6b3f2f;
    }
    .panel p {
      margin: 0 0 12px;
      line-height: 1.7;
      font-size: clamp(14px, 3.4vw, 18px);
    }
    .prompt {
      display: block;
      margin-bottom: 10px;
      font-weight: 700;
      color: #7b4e37;
      font-size: clamp(15px, 3.4vw, 18px);
    }
    textarea {
      width: 100%;
      min-height: 104px;
      resize: vertical;
      padding: 12px 14px;
      border-radius: 16px;
      border: 3px solid #d7b38e;
      outline: none;
      background: #fffdfa;
      color: #5c3f2f;
      font-size: 16px;
      line-height: 1.6;
      box-shadow: inset 0 2px 8px rgba(160, 126, 88, 0.08);
    }
    textarea:focus {
      border-color: #f29d62;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .field {
      padding: 10px;
      background: #fff5e7;
      border-radius: 16px;
      border: 2px dashed #deb98e;
    }
    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 700;
      color: #895839;
    }
    .field textarea {
      min-height: 78px;
    }
    .actions {
      display: flex;
      justify-content: center;
      margin-top: 14px;
    }
    button {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 14px 28px;
      min-width: 160px;
      background: linear-gradient(180deg, #ffb877 0%, #f28c5b 100%);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 8px 0 #cb6f43;
      cursor: pointer;
    }
    button:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #cb6f43;
    }
    #errorBox {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(84, 45, 36, 0.72);
      color: #fff8f2;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      pointer-events: auto;
      font-size: clamp(18px, 4.5vw, 24px);
      line-height: 1.7;
    }
    #errorBox.show {
      display: flex;
    }
    @media (min-width: 720px) {
      .grid.two-col {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="gameCanvas"></canvas>
    <div id="uiLayer">
      <div id="inputPanel" class="panel" style="display:none;"></div>
      <div id="errorBox">哎呀，出错了，请重启试试吧~</div>
    </div>
  </div>

  <script>
    (function () {
      const ERROR_TEXT = "哎呀，出错了，请重启试试吧~";

      try {
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const app = document.getElementById("app");
        const inputPanel = document.getElementById("inputPanel");
        const errorBox = document.getElementById("errorBox");

        const state = {
          width: 0,
          height: 0,
          dpr: Math.max(1, Math.min(2, window.devicePixelRatio || 1)),
          scene: "start",
          potionCount: 0,
          startButton: null,
          restartButton: null,
          fireworks: [],
          sparkles: [],
          petals: [],
          sceneEnteredAt: performance.now(),
          transitionAlpha: 0,
          flashAlpha: 0,
          text1: "",
          text3: "",
          game2Answers: ["", "", "", "", "", ""],
          lastTime: performance.now(),
          audioUnlocked: false,
          audioCtx: null
        };

        const COLORS = {
          ink: "#5e4333",
          line: "#7a563e",
          panel: "#fff8ef",
          panelSoft: "#fff2dc",
          accent: "#f49763",
          accentDeep: "#d76b4a",
          green: "#93c47d",
          blue: "#74b9ff",
          pink: "#f9a8c1",
          cream: "#fff8dc",
          shadow: "rgba(83, 53, 35, 0.16)"
        };

        function showError() {
          errorBox.textContent = ERROR_TEXT;
          errorBox.classList.add("show");
        }

        function safe(fn) {
          return function () {
            try {
              return fn.apply(this, arguments);
            } catch (err) {
              console.error(err);
              showError();
            }
          };
        }

        function resize() {
          state.width = app.clientWidth;
          state.height = app.clientHeight;
          canvas.width = Math.floor(state.width * state.dpr);
          canvas.height = Math.floor(state.height * state.dpr);
          ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
          createAmbientPetals();
          draw();
        }

        function createAmbientPetals() {
          state.petals = [];
          for (let i = 0; i < 16; i++) {
            state.petals.push(makePetal(Math.random() * state.width, Math.random() * state.height, 0.4 + Math.random() * 0.6));
          }
        }

        function makePetal(x, y, speedScale) {
          return {
            x,
            y,
            vx: 12 + Math.random() * 18 * speedScale,
            vy: 10 + Math.random() * 18 * speedScale,
            sway: Math.random() * Math.PI * 2,
            size: 8 + Math.random() * 9,
            rot: Math.random() * Math.PI * 2,
            vr: -0.8 + Math.random() * 1.6,
            color: ["#ffd7e4", "#fff4b8", "#cfe9ff", "#ffe0c2"][Math.floor(Math.random() * 4)]
          };
        }

        function ensureAudio() {
          try {
            if (!state.audioCtx) {
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              if (!AudioCtx) return;
              state.audioCtx = new AudioCtx();
            }
            if (state.audioCtx.state === "suspended") {
              state.audioCtx.resume();
            }
            state.audioUnlocked = true;
          } catch (err) {
            console.warn("音频初始化失败", err);
          }
        }

        function playTone(freq, duration, type, volume, when, slideTo) {
          try {
            if (!state.audioCtx || !state.audioUnlocked) return;
            const now = state.audioCtx.currentTime + (when || 0);
            const osc = state.audioCtx.createOscillator();
            const gain = state.audioCtx.createGain();
            osc.type = type || "sine";
            osc.frequency.setValueAtTime(freq, now);
            if (slideTo) {
              osc.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), now + duration);
            }
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, volume || 0.05), now + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            osc.connect(gain);
            gain.connect(state.audioCtx.destination);
            osc.start(now);
            osc.stop(now + duration + 0.03);
          } catch (err) {
            console.warn("音效播放失败", err);
          }
        }

        function playNoise(duration, volume, when) {
          try {
            if (!state.audioCtx || !state.audioUnlocked) return;
            const sampleRate = state.audioCtx.sampleRate;
            const length = Math.max(1, Math.floor(sampleRate * duration));
            const buffer = state.audioCtx.createBuffer(1, length, sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < length; i++) {
              data[i] = (Math.random() * 2 - 1) * (1 - i / length);
            }
            const source = state.audioCtx.createBufferSource();
            const filter = state.audioCtx.createBiquadFilter();
            const gain = state.audioCtx.createGain();
            const now = state.audioCtx.currentTime + (when || 0);
            source.buffer = buffer;
            filter.type = "highpass";
            filter.frequency.value = 500;
            gain.gain.setValueAtTime(volume || 0.02, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            source.connect(filter);
            filter.connect(gain);
            gain.connect(state.audioCtx.destination);
            source.start(now);
            source.stop(now + duration + 0.02);
          } catch (err) {
            console.warn("噪声音效失败", err);
          }
        }

        function playUiClick() {
          playTone(620, 0.06, "triangle", 0.03, 0, 760);
        }

        function playSceneWhoosh() {
          playNoise(0.18, 0.012, 0);
          playTone(240, 0.22, "sine", 0.02, 0, 420);
        }

        function playSuccess() {
          playTone(523, 0.14, "triangle", 0.04, 0, 659);
          playTone(659, 0.16, "triangle", 0.04, 0.08, 784);
          playTone(784, 0.24, "triangle", 0.045, 0.18, 988);
        }

        function playFireworkSound() {
          playNoise(0.1, 0.02, 0);
          playTone(180, 0.18, "sawtooth", 0.028, 0.02, 90);
          playTone(620, 0.12, "triangle", 0.018, 0.04, 980);
        }

        function setScene(scene) {
          state.scene = scene;
          state.sceneEnteredAt = performance.now();
          state.transitionAlpha = 0.85;
          state.flashAlpha = 0.16;
          renderInputPanel();
          playSceneWhoosh();
          if (scene === "ending") {
            launchFireworksBurst(24);
          }
        }

        function launchFireworksBurst(count) {
          const cx = state.width * (0.3 + Math.random() * 0.4);
          const cy = state.height * (0.16 + Math.random() * 0.22);
          const palette = ["#ff7b7b", "#ffd166", "#7bdff2", "#c3f584", "#cba6ff", "#ff9bd6"];
          for (let i = 0; i < count; i++) {
            const angle = (Math.PI * 2 * i) / count + Math.random() * 0.2;
            const speed = 1.8 + Math.random() * 4.6;
            const color = palette[i % palette.length];
            state.fireworks.push({
              x: cx,
              y: cy,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed - Math.random() * 0.6,
              life: 46 + Math.random() * 32,
              age: 0,
              color,
              size: 2 + Math.random() * 4,
              trail: []
            });
          }
          for (let i = 0; i < 18; i++) {
            state.sparkles.push({
              x: cx + (Math.random() - 0.5) * 40,
              y: cy + (Math.random() - 0.5) * 30,
              vx: (Math.random() - 0.5) * 0.9,
              vy: -0.4 - Math.random() * 0.8,
              life: 24 + Math.random() * 16,
              age: 0,
              size: 3 + Math.random() * 4,
              color: "#fff7cc"
            });
          }
          playFireworkSound();
        }

        function update(dt) {
          updateFireworks(dt);
          updateAmbient(dt);
          state.transitionAlpha = Math.max(0, state.transitionAlpha - dt * 1.8);
          state.flashAlpha = Math.max(0, state.flashAlpha - dt * 1.4);
        }

        function updateAmbient(dt) {
          state.petals.forEach((p) => {
            p.sway += dt * 1.8;
            p.x += p.vx * dt + Math.sin(p.sway) * 0.3;
            p.y += p.vy * dt;
            p.rot += p.vr * dt;
            if (p.y > state.height + 20 || p.x > state.width + 20) {
              Object.assign(p, makePetal(-20 - Math.random() * 50, Math.random() * state.height * 0.4, 0.4 + Math.random() * 0.6));
            }
          });

          state.sparkles = state.sparkles.filter((p) => {
            p.x += p.vx * 60 * dt;
            p.y += p.vy * 60 * dt;
            p.age += 60 * dt;
            return p.age < p.life;
          });
        }

        function updateFireworks(dt) {
          if (state.scene === "ending" && Math.random() < dt * 1.3) {
            launchFireworksBurst(14 + Math.floor(Math.random() * 8));
          }
          state.fireworks = state.fireworks.filter((p) => {
            p.trail.push({ x: p.x, y: p.y, a: 1 });
            if (p.trail.length > 6) p.trail.shift();
            p.x += p.vx * 60 * dt;
            p.y += p.vy * 60 * dt;
            p.vy += 0.04;
            p.age += 60 * dt;
            return p.age < p.life;
          });
        }

        function roundedRect(x, y, w, h, r, fill, stroke) {
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + w, y, x + w, y + h, r);
          ctx.arcTo(x + w, y + h, x, y + h, r);
          ctx.arcTo(x, y + h, x, y, r);
          ctx.arcTo(x, y, x + w, y, r);
          ctx.closePath();
          if (fill) {
            ctx.fillStyle = fill;
            ctx.fill();
          }
          if (stroke) {
            ctx.strokeStyle = stroke;
            ctx.lineWidth = 3;
            ctx.stroke();
          }
        }

        function ovalShadow(x, y, w, h, alpha) {
          ctx.beginPath();
          ctx.fillStyle = "rgba(92, 64, 45," + alpha + ")";
          ctx.ellipse(x, y, w, h, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        function drawSparkle(x, y, size, alpha) {
          ctx.save();
          ctx.translate(x, y);
          ctx.strokeStyle = "rgba(255,255,255," + alpha + ")";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-size, 0);
          ctx.lineTo(size, 0);
          ctx.moveTo(0, -size);
          ctx.lineTo(0, size);
          ctx.stroke();
          ctx.restore();
        }

        function drawAmbientPetals() {
          state.petals.forEach((p) => {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = 0.55;
            ctx.beginPath();
            ctx.ellipse(0, 0, p.size * 0.9, p.size * 0.5, 0.25, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.restore();
          });
        }

        function drawBackground() {
          const g = ctx.createLinearGradient(0, 0, 0, state.height);
          g.addColorStop(0, "#fff5d8");
          g.addColorStop(0.52, "#ffe8bf");
          g.addColorStop(1, "#ffd3a9");
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, state.width, state.height);

          const sun = ctx.createRadialGradient(state.width * 0.82, state.height * 0.16, 10, state.width * 0.82, state.height * 0.16, state.width * 0.18);
          sun.addColorStop(0, "rgba(255,247,202,0.95)");
          sun.addColorStop(1, "rgba(255,247,202,0)");
          ctx.fillStyle = sun;
          ctx.fillRect(0, 0, state.width, state.height);

          ctx.fillStyle = "rgba(255,255,255,0.46)";
          for (let i = 0; i < 7; i++) {
            const x = state.width * (0.1 + i * 0.14);
            const y = state.height * (0.08 + (i % 3) * 0.03);
            ctx.beginPath();
            ctx.arc(x, y, 24, 0, Math.PI * 2);
            ctx.arc(x + 22, y + 8, 18, 0, Math.PI * 2);
            ctx.arc(x - 22, y + 10, 18, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.fillStyle = "#c2e0a0";
          ctx.fillRect(0, state.height * 0.72, state.width, state.height * 0.08);
          ctx.fillStyle = "#e6c287";
          ctx.fillRect(0, state.height * 0.8, state.width, state.height * 0.2);

          for (let i = 0; i < 20; i++) {
            const x = (i / 20) * state.width + 10;
            const y = state.height * 0.77 + ((i % 2) * 8);
            drawFlower(x, y, 0.74 + (i % 3) * 0.1);
          }

          drawAmbientPetals();
        }

        function drawFlower(x, y, s) {
          ctx.save();
          ctx.translate(x, y);
          ctx.scale(s, s);
          ctx.fillStyle = "#6aa84f";
          ctx.fillRect(-1, 0, 3, 18);
          const petals = ["#ff8db1", "#f9d65c", "#9ec9ff", "#f2a66a"];
          for (let i = 0; i < 5; i++) {
            const a = (Math.PI * 2 * i) / 5;
            ctx.beginPath();
            ctx.fillStyle = petals[i % petals.length];
            ctx.arc(Math.cos(a) * 6, Math.sin(a) * 6, 4.5, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.beginPath();
          ctx.fillStyle = "#fff2b2";
          ctx.arc(0, 0, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        function drawTitleBlock() {
          const w = state.width * 0.42;
          const h = Math.min(220, state.height * 0.28);
          const x = state.width * 0.52;
          const y = state.height * 0.1;
          roundedRect(x, y, w, h, 28, "rgba(255,248,235,0.9)", COLORS.line);
          ctx.fillStyle = "#b26b52";
          ctx.font = "700 " + Math.max(24, state.width * 0.045) + "px Microsoft YaHei";
          wrapText("拥有的积极心理", x + 26, y + 54, w - 52, 44);
          ctx.fillStyle = COLORS.ink;
          ctx.font = "500 " + Math.max(14, state.width * 0.022) + "px Microsoft YaHei";
          wrapText("一趟温柔的幸福收集之旅", x + 26, y + 112, w - 52, 28);
          drawSparkle(x + w - 52, y + 40, 8, 0.8);
        }

        function drawStartScene() {
          drawBackground();
          drawTitleBlock();

          const t = performance.now() * 0.0028;
          drawCat(state.width * 0.23, state.height * 0.59 + Math.sin(t) * 4, Math.min(state.width, state.height) * 0.0033, true);
          ctx.fillStyle = COLORS.ink;
          ctx.font = "600 " + Math.max(16, state.width * 0.026) + "px Microsoft YaHei";
          wrapText("点一点，开始收集属于你的幸福药水。", state.width * 0.08, state.height * 0.22, state.width * 0.34, 30);

          const bw = Math.min(200, state.width * 0.28);
          const bh = 68;
          const bx = state.width * 0.12;
          const by = state.height * 0.55;
          state.startButton = { x: bx, y: by, w: bw, h: bh };
          roundedRect(bx, by, bw, bh, 34, COLORS.accent, COLORS.accentDeep);
          ctx.fillStyle = "#fff";
          ctx.font = "700 " + Math.max(22, state.width * 0.038) + "px Microsoft YaHei";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("开始", bx + bw / 2, by + bh / 2 + 1);
          drawSparkle(bx + bw - 26, by + 18, 6, 0.75);
          ctx.textAlign = "start";
          ctx.textBaseline = "alphabetic";
        }

        function drawCenteredRuleScene() {
          drawBackground();
          const w = Math.min(state.width * 0.86, 600);
          const h = Math.min(state.height * 0.48, 360);
          const x = (state.width - w) / 2;
          const y = state.height * 0.18;
          roundedRect(x, y, w, h, 28, "rgba(255,251,242,0.96)", COLORS.line);
          ctx.fillStyle = "#a9684e";
          ctx.font = "700 " + Math.max(22, state.width * 0.04) + "px Microsoft YaHei";
          ctx.fillText("游戏规则", x + 28, y + 44);
          ctx.fillStyle = COLORS.ink;
          ctx.font = "500 " + Math.max(18, state.width * 0.027) + "px Microsoft YaHei";
          wrapText("游戏一共有三个环节，每个环节你都要完成特定的任务，完成任务就能获得幸福药水，幸福药水越多你的幸福感就越强。", x + 28, y + 96, w - 56, 36);
          drawPotionIcon(x + w - 72, y + 52, 0.95);
          ctx.fillStyle = "#8d6b56";
          ctx.font = "500 " + Math.max(13, state.width * 0.02) + "px Microsoft YaHei";
          ctx.textAlign = "center";
          ctx.fillText("点击屏幕任意处继续", state.width / 2, y + h - 24);
          ctx.textAlign = "start";
        }

        function drawTopPotionCounter() {
          const pw = Math.min(132, state.width * 0.26);
          const ph = 56;
          const px = state.width - pw - 18;
          const py = 18;
          roundedRect(px, py, pw, ph, 22, "rgba(255,251,242,0.93)", COLORS.line);
          drawPotionIcon(px + 30, py + 28, 0.7);
          if (Math.floor(performance.now() / 400) % 2 === 0 && state.potionCount > 0) {
            drawSparkle(px + 22, py + 18, 5, 0.8);
          }
          ctx.fillStyle = COLORS.ink;
          ctx.font = "700 24px Microsoft YaHei";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(state.potionCount + "/3", px + 86, py + 30);
          ctx.textAlign = "start";
          ctx.textBaseline = "alphabetic";
        }

        function drawSpeechBubble(text, x, y, w, h) {
          roundedRect(x, y, w, h, 22, "#fffdf7", COLORS.line);
          ctx.beginPath();
          ctx.moveTo(x + 36, y + h);
          ctx.lineTo(x + 52, y + h + 22);
          ctx.lineTo(x + 72, y + h);
          ctx.closePath();
          ctx.fillStyle = "#fffdf7";
          ctx.fill();
          ctx.strokeStyle = COLORS.line;
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.fillStyle = COLORS.ink;
          ctx.font = "600 " + Math.max(15, state.width * 0.024) + "px Microsoft YaHei";
          wrapText(text, x + 18, y + 34, w - 36, 28);
        }

        function drawTaskBox(title, content, x, y, w, h) {
          roundedRect(x, y, w, h, 24, "#fff3de", COLORS.line);
          ctx.fillStyle = "#b36a4f";
          ctx.font = "700 " + Math.max(16, state.width * 0.024) + "px Microsoft YaHei";
          wrapText(title, x + 18, y + 28, w - 36, 24);
          ctx.fillStyle = COLORS.ink;

        function wrapText(text, x, y, maxWidth, lineHeight) {
          const chars = String(text).split("");
          let line = "";
          let currentY = y;
          for (let i = 0; i < chars.length; i++) {
            const testLine = line + chars[i];
            if (ctx.measureText(testLine).width > maxWidth && line) {
              ctx.fillText(line, x, currentY);
              line = chars[i];
              currentY += lineHeight;
            } else {
              line = testLine;
            }
          }
          if (line) ctx.fillText(line, x, currentY);
        }

        function hexToRgba(hex, alpha) {
          const value = hex.replace("#", "");
          const num = parseInt(value, 16);
          const r = (num >> 16) & 255;
          const g = (num >> 8) & 255;
          const b = num & 255;
          return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
        }

          if (state.scene === "game2_done_a") drawGame2Intro("doneA");
          if (state.scene === "game2_done_b") drawGame2Intro("doneB");
          if (state.scene === "game3_intro") drawGame3Intro(false);
          if (state.scene === "game3_done") drawGame3Intro(true);
          if (state.scene === "game1_input" || state.scene === "game2_input" || state.scene === "game3_input") drawInputBackdrop();
          if (state.scene === "ending") drawEndingScene();

          drawTransitionOverlay();
        }

            setTimeout(() => {
              const el = document.getElementById("praiseInput");
              if (el) el.focus();
            }, 60);
          }
        }

        function createFieldHtml(id, label, value) {
          return (
            '<div class="field">' +
            '<label for="' + id + '">' + label + '</label>' +
            '<textarea id="' + id + '" placeholder="请填写...">' + escapeHtml(value) + '</textarea>' +
            '</div>'
          );
        }

        function escapeHtml(str) {
          return String(str)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;");
        }

        function submitGame1() {
          ensureAudio();
          const val = document.getElementById("gratitudeInput").value.trim();
          if (val.length < 6) {
            alert("请再多写一点点，让感谢更具体哦。");
            return;
          }
          state.text1 = val;
          state.potionCount = 1;
          playSuccess();
          setScene("game1_done");
        }

        function submitGame2() {
          ensureAudio();
          const ids = ["g2_0", "g2_1", "g2_2", "g2_3", "g2_4", "g2_5"];
          const values = ids.map((id) => document.getElementById(id).value.trim());
          if (values.some((v) => v.length < 2)) {
            alert("六个框都要认真填写完成哦。");
            return;
          }
          state.game2Answers = values;
          state.potionCount = 2;
          playSuccess();
          setScene("game2_done_a");
        }

        function submitGame3() {
          ensureAudio();
          const val = document.getElementById("praiseInput").value.trim();
          if (val.length < 4) {
            alert("请写下几句更温暖的赞美吧。");
            return;
          }
          state.text3 = val;
          state.potionCount = 3;
          playSuccess();
          setScene("game3_done");
        }

        function isInside(pos, rect) {
          return rect && pos.x >= rect.x && pos.x <= rect.x + rect.w && pos.y >= rect.y && pos.y <= rect.y + rect.h;
        }

        function handlePointer(clientX, clientY) {
          if (errorBox.classList.contains("show")) return;
          if (inputPanel.style.display === "block") return;

          ensureAudio();
          playUiClick();

          const rect = canvas.getBoundingClientRect();
          const pos = {
            x: clientX - rect.left,
            y: clientY - rect.top
          };

          if (state.scene === "start") {
            if (isInside(pos, state.startButton)) setScene("rules");
            return;
          }
          if (state.scene === "rules") {
            setScene("game1_intro");
            return;
          }
          if (state.scene === "game1_intro") {
            setScene("game1_input");
            return;
          }
          if (state.scene === "game1_done") {
            setScene("game2_intro");
            return;
          }
          if (state.scene === "game2_intro") {
            setScene("game2_input");
            return;
          }
          if (state.scene === "game2_done_a") {
            setScene("game2_done_b");
            return;
          }
          if (state.scene === "game2_done_b") {
            setScene("game3_intro");
            return;
          }
          if (state.scene === "game3_intro") {
            setScene("game3_input");
            return;
          }
          if (state.scene === "game3_done") {
            setScene("ending");
            return;
          }
          if (state.scene === "ending") {
            if (isInside(pos, state.restartButton)) {
              restartGame();
            } else {
              launchFireworksBurst(12);
            }
          }
        }

        function restartGame() {
          state.potionCount = 0;
          state.text1 = "";
          state.text3 = "";
          state.game2Answers = ["", "", "", "", "", ""];
          state.fireworks = [];
          state.sparkles = [];
          setScene("start");
        }

        canvas.addEventListener("pointerdown", safe((e) => {
          handlePointer(e.clientX, e.clientY);
        }));

        window.addEventListener("resize", safe(resize));
        window.addEventListener("error", function () {
          showError();
        });

        function loop(now) {
          try {
            const dt = Math.min(0.033, (now - state.lastTime) / 1000 || 0.016);
            state.lastTime = now;
            update(dt);
            draw();
          } catch (err) {
            console.error(err);
            showError();
          }
          requestAnimationFrame(loop);
        }

        resize();
        renderInputPanel();
        requestAnimationFrame(loop);
      } catch (err) {
        console.error(err);
        const errorBox = document.getElementById("errorBox");
        if (errorBox) {
          errorBox.textContent = ERROR_TEXT;
          errorBox.classList.add("show");
        }
      }
    })();
  </script>
</body>
</html>
