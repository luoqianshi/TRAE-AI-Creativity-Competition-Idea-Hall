<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>溺水叮咚 · 方言童谣生成器</title>
  <style>
    :root {
      --bg-primary: #fdf7f0;
      --bg-card: #fff;
      --text-primary: #333;
      --text-secondary: #666;
      --accent: #ff7e5f;
      --border: #f0e6d8;
      --shadow: 0 4px 12px rgba(255, 126, 95, 0.08);
      --transition: all 0.25s ease;
    }

    .dark-mode {
      --bg-primary: #1a2530;
      --bg-card: #24303e;
      --text-primary: #e6e6e6;
      --text-secondary: #a0aebc;
      --accent: #ff9a75;
      --border: #3a4b5c;
      --shadow: 0 4px 12px rgba(255, 154, 117, 0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 16px;
      transition: var(--transition);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
      padding-top: 12px;
    }

    h1 {
      font-weight: 700;
      font-size: 1.8rem;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--accent), #ffaa75);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 24px;
      transition: var(--transition);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title svg {
      width: 20px;
      height: 20px;
      fill: var(--accent);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text-primary);
    }

    select, input, button {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 1rem;
      transition: var(--transition);
    }

    select:focus, input:focus, button:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 126, 95, 0.15);
    }

    button {
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
      border: none;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:active {
      transform: scale(0.98);
    }

    .result-area {
      margin-top: 24px;
      min-height: 200px;
      padding: 20px;
      background: rgba(255, 126, 95, 0.05);
      border-radius: 12px;
      border: 1px dashed rgba(255, 126, 95, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: var(--transition);
    }

    .result-empty {
      color: var(--text-secondary);
      font-style: italic;
    }

    .lyric-display {
      width: 100%;
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      margin-top: 12px;
      font-size: 1.1rem;
      line-height: 1.7;
      text-align: left;
      border-left: 4px solid var(--accent);
    }

    .lyric-display .dialect {
      color: var(--accent);
      font-weight: 600;
    }

    .lyric-display .mandarin {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-top: 8px;
      display: block;
    }

    .action-hint {
      margin-top: 16px;
      padding: 12px;
      background: rgba(255, 192, 128, 0.15);
      border-radius: 8px;
      font-size: 0.95rem;
      color: #d35400;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-hint svg {
      width: 18px;
      height: 18px;
      fill: #d35400;
    }

    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 100;
      transition: var(--transition);
      font-size: 1.2rem;
    }

    .theme-toggle:hover {
      transform: rotate(30deg);
    }

    footer {
      text-align: center;
      margin-top: 32px;
      padding: 16px;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    /* Responsive */
    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      h1 {
        font-size: 1.5rem;
      }
      .card {
        padding: 20px;
      }
      .lyric-display {
        font-size: 1rem;
        padding: 16px;
      }
    }

    /* Hand-drawn icon SVG */
    .icon-volume {
      width: 20px;
      height: 20px;
      vertical-align: middle;
      fill: currentColor;
    }

    .icon-sun {
      width: 20px;
      height: 20px;
      fill: #ffd166;
    }

    .icon-moon {
      width: 20px;
      height: 20px;
      fill: #a9a9a9;
    }
  </style>
</head>
<body>
  <button id="themeToggle" class="theme-toggle" aria-label="切换主题">
    <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  </button>

  <div class="container">
    <header>
      <h1>溺水叮咚</h1>
      <p class="subtitle">把防溺水口诀变成孩子爱听的方言童谣 · 30秒生成 · 一键跟读</p>
    </header>

    <main>
      <section class="card">
        <h2 class="card-title">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
          选方言 · 输要点 · 听童谣
        </h2>
        <div class="form-group">
          <label for="dialect">你所在的方言区</label>
          <select id="dialect">
            <option value="changsha">长沙话（湖南）</option>
            <option value="chaoshan">潮汕话（广东）</option>
            <option value="chengdu">成都话（四川）</option>
            <option value="xiamen">厦门话（福建）</option>
            <option value="shanghai">上海话（江苏/浙江）</option>
          </select>
        </div>
        <div class="form-group">
          <label for="keywords">想教孩子的安全要点（可填1–2个词）</label>
          <input type="text" id="keywords" placeholder="例如：仰漂、手拉手、大声喊" maxlength="20" />
        </div>
        <button id="generateBtn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" class="icon-volume"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          生成童谣
        </button>
      </section>

      <section class="card">
        <h2 class="card-title">
          <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          你的方言童谣（已生成）
        </h2>
        <div class="result-area">
          <p class="result-empty">选好方言和要点后，点击上方按钮生成专属童谣 ↓</p>
          <div id="lyricOutput" class="lyric-display" style="display:none;"></div>
          <div id="actionHint" class="action-hint" style="display:none;">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            配套动作：仰面漂浮像睡莲，脚尖朝天手放松～
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>© 2024 溺水叮咚 · 安全童谣轻工具 | 无需下载 · 双击打开即用</p>
    </footer>
  </div>

  <script>
    // 主题切换
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;
    const sunIcon = themeToggle.querySelector('.icon-sun');
    const moonIcon = document.createElement('svg');
    moonIcon.setAttribute('viewBox', '0 0 24 24');
    moonIcon.setAttribute('class', 'icon-moon');
    moonIcon.innerHTML = '<path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9-4.03-9-9-9zm0 16c-3.86 0-7-3.14-7-7s3.14-7 7-7 7 3.14 7 7-3.14 7-7 7z"/>';

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-mode');
      if (body.classList.contains('dark-mode')) {
        themeToggle.innerHTML = '';
        themeToggle.appendChild(moonIcon);
      } else {
        themeToggle.innerHTML = '';
        themeToggle.appendChild(sunIcon);
      }
    });

    // 童谣生成逻辑（轻量规则库）
    const dialectRules = {
      changsha: {
        prefix: "咯",
        suffix: "哒",
        words: {
          "仰漂": "仰面漂起像睡莲，莫慌莫怕莫乱抓",
          "手拉手": "手拉手是连环掉，喊大人来最可靠",
          "大声喊": "嘴巴张大喊救命，声音传远有人应"
        },
        action: "仰面漂浮像睡莲，脚尖朝天手放松～"
      },
      chaoshan: {
        prefix: "咧",
        suffix: "啊",
        words: {
          "仰漂": "仰起身来浮水面，像朵莲花静静开",
          "手拉手": "手牵手会一齐沉，快叫阿叔阿伯来",
          "大声喊": "大声喊‘救命啊’三声，声音越响越得救"
        },
        action: "仰面躺平像莲花，手脚伸直莫挣扎～"
      },
      chengdu: {
        prefix: "嘛",
        suffix: "哈",
        words: {
          "仰漂": "仰起身子漂水上，像只鸭子耍得欢",
          "手拉手": "手拉手要遭殃嘛，快喊大人来帮忙",
          "大声喊": "嘴巴张大喊‘救命’，声音传得越远越好"
        },
        action: "仰面漂着像鸭子，手脚摊开莫着急～"
      },
      xiamen: {
        prefix: "咧",
        suffix: "矣",
        words: {
          "仰漂": "仰身浮水似浮萍，莫惊莫跳莫乱扑",
          "手拉手": "手牵手会一齐沉，快叫大人来救急",
          "大声喊": "大声喊‘救命啊’三遍，声音越大越有救"
        },
        action: "仰面浮水似浮萍，手脚摊开稳住气～"
      },
      shanghai: {
        prefix: "呀",
        suffix: "啦",
        words: {
          "仰漂": "仰面浮在水面上，像片叶子轻轻飘",
          "手拉手": "手拉手要一起沉，快叫大人来帮忙",
          "大声喊": "嘴巴张大喊救命，声音传远有人听"
        },
        action: "仰面浮着像叶子，手脚放松慢慢漂～"
      }
    };

    const generateBtn = document.getElementById('generateBtn');
    const dialectSelect = document.getElementById('dialect');
    const keywordsInput = document.getElementById('keywords');
    const lyricOutput = document.getElementById('lyricOutput');
    const actionHint = document.getElementById('actionHint');
    const resultArea = document.querySelector('.result-area');

    generateBtn.addEventListener('click', () => {
      const dialect = dialectSelect.value;
      const rawInput = keywordsInput.value.trim();
      const keywords = rawInput ? rawInput.split(/[,，、\s]+/).filter(k => k).slice(0, 2) : ['仰漂'];
      
      // 构建童谣
      const rule = dialectRules[dialect];
      let lines = [];
      let actionText = rule.action;

      keywords.forEach(k => {
        const key = Object.keys(rule.words).find(w => w.includes(k) || k.includes(w) || k === w);
        if (key && rule.words[key]) {
          lines.push(`${rule.prefix} ${rule.words[key]} ${rule.suffix}`);
        }
      });

      if (lines.length === 0) {
        lines = [`${rule.prefix} 落水莫慌先仰漂，喊人救命最重要 ${rule.suffix}`];
      }

      // 拼接成童谣段落
      const fullLyric = lines.join('\n\n');
      lyricOutput.innerHTML = `<div class="dialect">${fullLyric}</div><span class="mandarin">（普通话意思：${lines.map(l => l.replace(new RegExp(`[${rule.prefix}${rule.suffix}]`, 'g'), '').trim()).join('；')}</span>`;
      lyricOutput.style.display = 'block';
      actionHint.style.display = 'flex';
      actionHint.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg> 配套动作：${actionText}`;
      resultArea.classList.remove('result-empty');
      resultArea.style.background = 'rgba(255, 126, 95, 0.05)';
    });

    // 初始化：预设示例
    keywordsInput.value = '仰漂';
  </script>
</body>
</html>
