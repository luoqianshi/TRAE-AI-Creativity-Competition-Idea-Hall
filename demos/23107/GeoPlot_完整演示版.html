<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地维 GeoPlot - 智能地块数字化工作台</title>
<style>
/* ===== DESIGN SYSTEM ===== */
:root {
  --blue-500: oklch(0.52 0.18 255); --blue-600: oklch(0.44 0.19 255);
  --blue-400: oklch(0.62 0.15 253); --blue-100: oklch(0.94 0.03 255);
  --blue-50: oklch(0.97 0.01 255); --green-500: oklch(0.58 0.16 155);
  --green-100: oklch(0.94 0.05 155); --amber-500: oklch(0.62 0.14 75);
  --amber-100: oklch(0.95 0.05 75); --red-500: oklch(0.52 0.19 20);
  --red-100: oklch(0.94 0.04 20); --purple-500: oklch(0.48 0.18 300);
  --purple-100: oklch(0.94 0.04 300);
  --surface-0: oklch(0.985 0.002 255); --surface-1: oklch(0.97 0.003 255);
  --surface-2: oklch(0.94 0.005 255); --surface-3: oklch(0.90 0.006 255);
  --border: oklch(0.87 0.006 255); --border-subtle: oklch(0.91 0.004 255);
  --text-primary: oklch(0.18 0.01 255); --text-secondary: oklch(0.42 0.02 252);
  --text-tertiary: oklch(0.58 0.02 250);
  --sidebar-bg: oklch(0.16 0.02 260); --sidebar-fg: oklch(0.75 0.02 250);
  --sidebar-hover: oklch(0.22 0.025 262); --sidebar-dim: oklch(0.38 0.02 255);
  --shadow-xs: 0 1px 2px oklch(0 0 0 / 0.04);
  --shadow-sm: 0 1px 3px oklch(0 0 0 / 0.06), 0 1px 2px oklch(0 0 0 / 0.04);
  --shadow-md: 0 4px 12px oklch(0 0 0 / 0.08), 0 2px 4px oklch(0 0 0 / 0.04);
  --shadow-lg: 0 12px 32px oklch(0 0 0 / 0.10), 0 4px 8px oklch(0 0 0 / 0.05);
  --shadow-xl: 0 20px 48px oklch(0 0 0 / 0.14), 0 8px 16px oklch(0 0 0 / 0.06);
  --shadow-drop: 0 8px 24px oklch(0 0 0 / 0.12), 0 2px 6px oklch(0 0 0 / 0.06);
  --radius-sm: 5px; --radius-md: 8px; --radius-lg: 14px; --radius-xl: 20px;
  --sidebar-w: 224px; --toolbar-h: 48px; --panel-w: 340px;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; font-family: var(--font-sans); font-size: 13px; line-height: 1.5; color: var(--text-primary); background: var(--surface-1); -webkit-font-smoothing: antialiased; }
body { user-select: none; }

.app { display: flex; height: 100vh; width: 100vw; background: var(--surface-0); }

/* ===== SIDEBAR ===== */
.sidebar { width: var(--sidebar-w); min-width: var(--sidebar-w); background: var(--sidebar-bg); color: var(--sidebar-fg); display: flex; flex-direction: column; z-index: 200; box-shadow: 2px 0 24px oklch(0 0 0 / 0.2); position: relative; }
.sidebar::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, oklch(1 0 0 / 0.03) 0%, transparent 40%); pointer-events: none; }
.sb-logo { padding: 18px 20px; border-bottom: 1px solid oklch(1 0 0 / 0.06); display: flex; align-items: center; gap: 12px; }
.sb-logo .l-icon { width: 36px; height: 36px; background: var(--blue-500); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; font-weight: 700; box-shadow: 0 2px 8px oklch(0.52 0.18 255 / 0.4); }
.sb-logo .l-txt { font-size: 14px; font-weight: 600; color: oklch(0.92 0.01 255); letter-spacing: 0.02em; }
.sb-logo .l-ver { font-size: 10px; color: var(--sidebar-dim); background: oklch(1 0 0 / 0.06); padding: 2px 6px; border-radius: 4px; margin-left: auto; }
.sb-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
.sb-nav::-webkit-scrollbar { width: 0; }
.sb-sec { padding: 0 8px; margin-bottom: 8px; }
.sb-sec-title { font-size: 10px; color: var(--sidebar-dim); text-transform: uppercase; letter-spacing: 0.08em; padding: 10px 14px 6px; font-weight: 600; }
.sb-item { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.15s var(--ease-out); font-size: 13px; color: var(--sidebar-fg); margin-bottom: 1px; position: relative; }
.sb-item:hover { background: var(--sidebar-hover); color: oklch(0.9 0.01 255); }
.sb-item.active { background: var(--sidebar-hover); color: #fff; font-weight: 500; box-shadow: 0 2px 8px oklch(0.52 0.18 255 / 0.35); }
.sb-item .i-icon { width: 18px; text-align: center; font-size: 15px; flex-shrink: 0; }
.sb-item .i-badge { margin-left: auto; background: var(--red-500); color: #fff; font-size: 10px; font-weight: 600; min-width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
.sb-footer { padding: 14px 20px; border-top: 1px solid oklch(1 0 0 / 0.06); display: flex; align-items: center; gap: 10px; }
.sb-footer .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--blue-500); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; }
.sb-footer .u-name { font-size: 12px; color: oklch(0.9 0.01 255); font-weight: 500; }
.sb-footer .u-role { font-size: 10px; color: var(--sidebar-dim); }

/* ===== MAIN ===== */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }

/* ===== TOOLBAR ===== */
.toolbar {
  background: var(--surface-0); border-bottom: 1px solid var(--border-subtle);
  display: flex; align-items: center; padding: 0 16px;
  height: var(--toolbar-h); min-height: var(--toolbar-h);
  gap: 0; z-index: 150; box-shadow: var(--shadow-xs);
}
.tbar-div { width: 1px; height: 24px; background: var(--border-subtle); margin: 0 10px; flex-shrink: 0; }
.tbar-grp { display: flex; align-items: center; gap: 2px; position: relative; }

.tbtn {
  display: flex; align-items: center; gap: 5px; padding: 5px 10px;
  border: none; background: transparent; border-radius: var(--radius-sm);
  cursor: pointer; font-size: 12px; color: var(--text-primary);
  white-space: nowrap; transition: all 0.12s var(--ease-out);
  font-family: var(--font-sans); height: 32px; position: relative;
}
.tbtn:hover { background: var(--surface-2); }
.tbtn:active { background: var(--surface-3); transform: scale(0.97); }
.tbtn.triggered { background: var(--blue-100); color: var(--blue-500); font-weight: 500; }
.tbtn .tb-icon { font-size: 15px; line-height: 1; width: 18px; text-align: center; color: var(--text-tertiary); }
.tbtn:hover .tb-icon { color: var(--text-secondary); }
.tbtn.triggered .tb-icon { color: var(--blue-500); }
.tbtn:focus-visible { outline: 2px solid var(--blue-400); outline-offset: -2px; border-radius: var(--radius-sm); }

.badge-num {
  position: absolute; top: -3px; right: -3px; background: var(--red-500);
  color: #fff; font-size: 9px; font-weight: 700; min-width: 16px; height: 16px;
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  padding: 0 4px; box-shadow: 0 0 0 2px var(--surface-0);
}

.tbar-search {
  display: flex; align-items: center; background: var(--surface-1);
  border-radius: 20px; padding: 5px 14px; margin-left: auto; gap: 8px;
  border: 1px solid transparent; transition: all 0.2s var(--ease-out);
  width: 220px; height: 32px;
}
.tbar-search:focus-within { background: var(--surface-0); border-color: var(--blue-400); box-shadow: 0 0 0 3px oklch(0.62 0.15 253 / 0.15); }
.tbar-search .s-icon { font-size: 13px; color: var(--text-tertiary); flex-shrink: 0; }
.tbar-search input { border: none; background: transparent; outline: none; font-size: 12px; width: 100%; font-family: var(--font-sans); color: var(--text-primary); }
.tbar-search input::placeholder { color: var(--text-tertiary); }

/* ===== DROPDOWN PANELS ===== */
.dropdown {
  position: absolute; top: calc(100% + 6px);
  background: var(--surface-0); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-drop); z-index: 170;
  display: none; overflow: hidden;
  border: 1px solid var(--border-subtle);
  animation: dropIn 0.2s var(--ease-spring);
}
.dropdown.show { display: block; }

.dropdown::before {
  content: ''; position: absolute; top: -6px;
  width: 12px; height: 12px;
  background: var(--surface-0);
  border: 1px solid var(--border-subtle);
  border-right: none; border-bottom: none;
  transform: rotate(45deg);
}

@keyframes dropIn {
  from { opacity: 0; transform: translateY(-8px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.dd-header {
  padding: 12px 16px; border-bottom: 1px solid var(--border-subtle);
  font-size: 13px; font-weight: 700; color: var(--text-primary);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface-1);
}
.dd-body { padding: 8px; max-height: 360px; overflow-y: auto; }
.dd-body::-webkit-scrollbar { width: 4px; }
.dd-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.dd-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px;
  border-radius: var(--radius-sm); cursor: pointer; font-size: 12px;
  color: var(--text-primary); transition: all 0.1s var(--ease-out);
  border-bottom: 1px solid transparent;
}
.dd-item:hover { background: var(--blue-50); color: var(--blue-500); }
.dd-item .dd-icon { width: 20px; text-align: center; font-size: 15px; flex-shrink: 0; }
.dd-item .dd-label { flex: 1; font-weight: 500; }
.dd-item .dd-desc { flex: 1; }
.dd-item .dd-desc small { display: block; font-size: 10px; color: var(--text-tertiary); font-weight: 400; }
.dd-item .dd-badge { font-size: 10px; background: var(--blue-100); color: var(--blue-500); padding: 2px 7px; border-radius: 10px; font-weight: 500; white-space: nowrap; }
.dd-item .dd-badge.warn { background: var(--red-100); color: var(--red-500); }
.dd-item .dd-badge.ok { background: var(--green-100); color: var(--green-500); }

.dd-check { display: flex; align-items: center; gap: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
.dd-check input[type="checkbox"] { accent-color: var(--blue-500); }

.dd-sep { height: 1px; background: var(--border-subtle); margin: 4px 0; }

.dd-input-row { padding: 6px 12px; }
.dd-input-row label { display: block; font-size: 10px; color: var(--text-secondary); margin-bottom: 3px; font-weight: 500; }
.dd-input-row input, .dd-input-row select {
  width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 5px 8px; font-size: 12px; font-family: var(--font-sans);
  background: var(--surface-0); color: var(--text-primary);
  transition: border-color 0.15s var(--ease-out);
}
.dd-input-row input:focus, .dd-input-row select:focus { outline: none; border-color: var(--blue-400); box-shadow: 0 0 0 3px oklch(0.62 0.15 253 / 0.12); }

.dd-footer {
  padding: 8px 12px; border-top: 1px solid var(--border-subtle);
  display: flex; gap: 6px; justify-content: flex-end;
  background: var(--surface-1);
}
.dd-btn {
  padding: 5px 14px; border-radius: var(--radius-sm); cursor: pointer;
  font-size: 11px; font-weight: 500; font-family: var(--font-sans);
  border: 1px solid var(--border); background: var(--surface-0);
  color: var(--text-primary); transition: all 0.12s var(--ease-out);
}
.dd-btn:hover { background: var(--surface-2); }
.dd-btn:active { transform: scale(0.97); }
.dd-btn.primary { background: var(--blue-500); color: #fff; border-color: var(--blue-500); }
.dd-btn.primary:hover { background: var(--blue-600); }

.dd-tabs { display: flex; border-bottom: 1px solid var(--border-subtle); padding: 0 8px; background: var(--surface-1); }
.dd-tab { padding: 8px 14px; cursor: pointer; font-size: 11px; color: var(--text-secondary); border-bottom: 2px solid transparent; transition: all 0.15s var(--ease-out); font-weight: 500; }
.dd-tab:hover { color: var(--text-primary); }
.dd-tab.active { color: var(--blue-500); border-bottom-color: var(--blue-500); font-weight: 600; }

.dd-search { display: flex; align-items: center; background: var(--surface-1); margin: 6px 8px; border-radius: var(--radius-sm); padding: 5px 10px; gap: 6px; border: 1px solid var(--border-subtle); }
.dd-search input { border: none; background: transparent; outline: none; font-size: 12px; width: 100%; font-family: var(--font-sans); }
.dd-search:focus-within { border-color: var(--blue-400); }

.dd-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; }
.dd-stat-card { background: var(--surface-1); padding: 12px; border-radius: var(--radius-md); text-align: center; border: 1px solid var(--border-subtle); }
.dd-stat-val { font-size: 22px; font-weight: 800; color: var(--blue-500); }
.dd-stat-lbl { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }

.dd-prog { padding: 8px 12px; }
.dd-prog .dp-lbl { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; }
.dd-prog .dp-track { height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.dd-prog .dp-fill { height: 100%; background: var(--blue-500); border-radius: 3px; }

/* ===== MAP ===== */
.map-wrap { flex: 1; position: relative; background: oklch(0.92 0.008 255); overflow: hidden; }
.map-bg {
  position: absolute; inset: 0;
  background:
    linear-gradient(oklch(0 0 0 / 0.04) 1px, transparent 1px),
    linear-gradient(90deg, oklch(0 0 0 / 0.04) 1px, transparent 1px),
    linear-gradient(oklch(0 0 0 / 0.08) 1px, transparent 1px),
    linear-gradient(90deg, oklch(0 0 0 / 0.08) 1px, transparent 1px),
    radial-gradient(ellipse at 30% 20%, oklch(0.95 0.01 200) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 60%, oklch(0.93 0.015 240) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 80%, oklch(0.96 0.005 180) 0%, transparent 40%),
    oklch(0.94 0.006 252);
  background-size: 40px 40px, 40px 40px, 200px 200px, 200px 200px, 100% 100%, 100% 100%, 100% 100%, 100% 100%;
}

/* ===== PLOTS ===== */
.plot { position: absolute; cursor: pointer; transition: transform 0.15s var(--ease-out), box-shadow 0.15s var(--ease-out); z-index: 10; border-radius: var(--radius-sm); }
.plot::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(135deg, oklch(0.62 0.16 255 / 0.22) 0%, oklch(0.52 0.18 255 / 0.12) 50%, oklch(0.44 0.19 255 / 0.18) 100%); border: 1.5px solid oklch(0.52 0.18 255 / 0.35); transition: all 0.15s var(--ease-out); }
.plot::after { content: ''; position: absolute; inset: 3px; border-radius: inherit; background: linear-gradient(135deg, oklch(1 0 0 / 0.15) 0%, transparent 40%); pointer-events: none; }
.plot:hover { transform: scale(1.03); z-index: 11; }
.plot:hover::before { border-color: oklch(0.52 0.18 255 / 0.55); background: linear-gradient(135deg, oklch(0.62 0.16 255 / 0.28) 0%, oklch(0.52 0.18 255 / 0.16) 50%, oklch(0.44 0.19 255 / 0.22) 100%); box-shadow: 0 0 0 4px oklch(0.52 0.18 255 / 0.12); }
.plot.selected { z-index: 12; }
.plot.selected::before { border-color: var(--blue-500); border-width: 2px; background: linear-gradient(135deg, oklch(0.62 0.16 255 / 0.32) 0%, oklch(0.52 0.18 255 / 0.20) 50%, oklch(0.44 0.19 255 / 0.26) 100%); box-shadow: 0 0 0 5px oklch(0.52 0.18 255 / 0.18), 0 0 0 1px oklch(0.52 0.18 255 / 0.5); }
.plot.source::before { border-color: var(--amber-500); background: linear-gradient(135deg, oklch(0.62 0.14 75 / 0.28) 0%, oklch(0.62 0.14 75 / 0.18) 100%); box-shadow: 0 0 0 5px oklch(0.62 0.14 75 / 0.2); animation: pulse-src 1.2s ease-in-out infinite; }
.plot.target::before { border-color: var(--green-500); background: linear-gradient(135deg, oklch(0.58 0.16 155 / 0.28) 0%, oklch(0.58 0.16 155 / 0.18) 100%); }
@keyframes pulse-src { 0%, 100% { box-shadow: 0 0 0 4px oklch(0.62 0.14 75 / 0.2); } 50% { box-shadow: 0 0 0 10px oklch(0.62 0.14 75 / 0.06); } }
.plbl { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 600; color: var(--text-primary); background: var(--surface-0); padding: 2px 7px; border-radius: 4px; white-space: nowrap; pointer-events: none; box-shadow: var(--shadow-sm); border: 1px solid var(--border-subtle); }
.psize { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); font-size: 9px; color: var(--text-tertiary); background: oklch(1 0 0 / 0.8); padding: 1px 5px; border-radius: 3px; pointer-events: none; }

.plot.hide-labels .plbl,
.plot.hide-labels .psize { display: none; }

/* ===== MAP CONTROLS ===== */
.issue-float { position: absolute; bottom: 60px; right: 20px; background: var(--surface-0); border-radius: var(--radius-lg); padding: 8px 14px; box-shadow: var(--shadow-md); cursor: pointer; display: flex; align-items: center; gap: 8px; z-index: 30; font-size: 12px; font-weight: 500; border: 1px solid var(--border-subtle); }
.issue-float .idot { width: 8px; height: 8px; background: var(--red-500); border-radius: 50%; animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.inum { background: var(--red-500); color: #fff; padding: 1px 7px; border-radius: 10px; font-size: 10px; font-weight: 700; }
.map-ctrls { position: absolute; top: 16px; right: 20px; display: flex; flex-direction: column; gap: 4px; z-index: 30; }
.mc-btn { width: 32px; height: 32px; background: var(--surface-0); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-xs); color: var(--text-secondary); transition: all 0.12s var(--ease-out); }
.mc-btn:hover { background: var(--surface-2); color: var(--text-primary); }
.mc-btn:active { transform: scale(0.93); }
.map-sb { position: absolute; bottom: 16px; left: 20px; font-size: 10px; color: var(--text-tertiary); z-index: 30; display: flex; gap: 8px; align-items: center; background: oklch(1 0 0 / 0.88); padding: 5px 12px; border-radius: 6px; backdrop-filter: blur(8px); border: 1px solid oklch(0 0 0 / 0.04); }
.draw-hint { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: oklch(0.2 0.01 255 / 0.88); color: #fff; font-size: 13px; padding: 10px 24px; border-radius: var(--radius-lg); z-index: 45; pointer-events: none; opacity: 0; transition: opacity 0.2s var(--ease-out); backdrop-filter: blur(12px); }
.draw-hint.show { opacity: 1; }

.draw-point { position: absolute; width: 10px; height: 10px; background: var(--blue-500); border: 2px solid var(--surface-0); border-radius: 50%; transform: translate(-50%, -50%); z-index: 25; pointer-events: none; box-shadow: 0 0 0 4px oklch(0.52 0.18 255 / 0.25); }
.draw-line { position: absolute; height: 2px; background: var(--blue-500); transform-origin: left center; z-index: 24; pointer-events: none; opacity: 0.7; }
.draw-polygon { position: absolute; background: oklch(0.52 0.18 255 / 0.06); border: 1.5px dashed oklch(0.52 0.18 255 / 0.4); z-index: 23; pointer-events: none; border-radius: 2px; }

/* ===== RIGHT PANEL ===== */
.rpanel {
  width: var(--panel-w); min-width: var(--panel-w);
  background: var(--surface-0); border-left: 1px solid var(--border-subtle);
  display: flex; flex-direction: column; z-index: 180;
  box-shadow: var(--shadow-xl);
  position: absolute; right: 0; top: var(--toolbar-h); bottom: 0;
  transform: translateX(100%);
  transition: transform 0.3s var(--ease-out);
}
.rpanel.show { transform: translateX(0); }
.rp-header { padding: 14px 20px; border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between; background: var(--surface-0); }
.rp-title { font-size: 14px; font-weight: 700; color: var(--text-primary); }
.rp-close { background: none; border: none; font-size: 16px; cursor: pointer; color: var(--text-tertiary); padding: 4px 8px; border-radius: var(--radius-sm); transition: all 0.12s var(--ease-out); }
.rp-close:hover { background: var(--surface-2); color: var(--text-primary); }
.rp-body { flex: 1; overflow-y: auto; padding: 18px 20px; }
.rp-body::-webkit-scrollbar { width: 4px; }
.rp-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.rp-actions { padding: 14px 20px; border-top: 1px solid var(--border-subtle); display: flex; gap: 8px; justify-content: flex-end; background: var(--surface-1); }

.pg { display: flex; gap: 12px; margin-bottom: 14px; align-items: center; }
.pg .pl { font-size: 11px; color: var(--text-secondary); width: 90px; flex-shrink: 0; text-align: right; }
.pg .pv { flex: 1; font-size: 13px; font-weight: 500; }
.pg .pv.editable { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 5px 10px; font-family: var(--font-sans); font-size: 13px; transition: border-color 0.15s var(--ease-out); }
.pg .pv.editable:focus { outline: none; border-color: var(--blue-400); box-shadow: 0 0 0 3px oklch(0.62 0.15 253 / 0.12); }

.modal-overlay { position: fixed; inset: 0; background: oklch(0 0 0 / 0.45); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 500; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s var(--ease-out); }

/* ===== SHARED ===== */
.btn { border: 1px solid var(--border); background: var(--surface-0); padding: 7px 18px; border-radius: var(--radius-sm); cursor: pointer; font-size: 12px; font-weight: 500; font-family: var(--font-sans); color: var(--text-primary); transition: all 0.12s var(--ease-out); }
.btn:hover { background: var(--surface-2); }

.alert { padding: 10px 14px; border-radius: var(--radius-md); font-size: 11px; line-height: 1.5; }

.fg { margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
.fl { font-size: 12px; color: var(--text-secondary); width: 90px; flex-shrink: 0; text-align: right; }
.fs { flex: 1; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 13px; font-family: var(--font-sans); background: var(--surface-0); transition: border-color 0.15s var(--ease-out); }
.fs:focus { outline: none; border-color: var(--blue-400); box-shadow: 0 0 0 3px oklch(0.62 0.15 253 / 0.12); }
.fi { flex: 1; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 13px; font-family: var(--font-sans); background: var(--surface-1); }
.fi:focus { outline: none; border-color: var(--blue-400); }

.progress-wrap { padding: 12px 0; }
.progress-lbl { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; }
.progress-track { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--blue-500); border-radius: 3px; transition: width 0.4s var(--ease-out); }

.toast { position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%); background: oklch(0.25 0.01 255 / 0.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); color: #fff; padding: 10px 24px; border-radius: var(--radius-lg); font-size: 12px; font-weight: 500; z-index: 600; box-shadow: var(--shadow-lg); animation: toast-in 0.3s var(--ease-out); pointer-events: none; }
@keyframes toast-in { from { opacity: 0; transform: translateX(-50%) translateY(12px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

.merge-steps { display: flex; gap: 8px; margin-bottom: 16px; }

/* ===== PLOT FLOATING PANEL ===== */

  { id:'PD-2026-010', name:'孙家岗旱地B', area:4.92, type:'旱地',       lat:250, lng:260, w:180, h:190, unit:'亩', ownerName:'孙大海', certType:'居民身份证', certNo:'220122199107220001', isQrd:'否', hasAllowance:'是', isHighStandard:'否', remark:'' }
];

// ============================================================
// 工具箱15项 — 手册规格
// ============================================================
const toolboxData = [
  [ // 导出(2)
    { name:'地块数据导出', desc:'将所有地块属性数据导出为Excel/CSV格式文件', icon:'&#x1F4E6;', style:'blue', action:'exportPlotData' },
    { name:'历史地块导出', desc:'导出历史基础地块图层的完整数据', icon:'&#x1F4BE;', style:'green', action:'exportHistory' }
  ],
  [ // 导入(3)

    { name:'坐标导入', desc:'手动输入或粘贴坐标序列生成地块', icon:'&#x1F4CD;', style:'orange', action:'importCoords' },
    { name:'按字段导入', desc:'按指定字段匹配并导入外部数据', icon:'&#x1F4CB;', style:'purple', action:'importByField' }
  ],
  [ // 校验(2)
    { name:'地块校验', desc:'校验地块边界合法性、重叠检测、拓扑检查', icon:'&#x2705;', style:'green', action:'checkPlot' },
    { name:'面积校验', desc:'校验地块实测面积与登记面积的一致性', icon:'&#x1F4CF;', style:'blue', action:'checkArea' }
  ],
  [ // 合并(3)
    { name:'选取点合并', desc:'在地图上选取控制点进行多边形合并', icon:'&#x2B55;', style:'green', action:'pointMerge' },
    { name:'底边合并', desc:'保留地块编号，将选定地块边界合并为一个整体', icon:'&#x25E6;', style:'blue', action:'baseMerge' },

  ],

    { name:'拆分删除', desc:'拆分后删除指定子地块并更新总面积', icon:'&#x274C;', style:'orange', action:'splitDelete' }
  ],
  [ // 修改(1)

  ],

  ],

    { name:'底图更新', desc:'更新底图图层数据到最新版本', icon:'&#x1F5FA;', style:'green', action:'baseUpdate' }
  ]
];

// ============================================================
// 问题数据 — 手册规格
// ============================================================
const issues = [
  { code:'W-2026-001', status:'unsolved', desc:'PD-2026-002 地块边界与相邻地块存在约3.2米重叠区域', reviewer:'张三', time:'2026-06-15 14:30' },
  { code:'W-2026-002', status:'modified', desc:'PD-2026-004 确权面积与实测面积偏差超5%需复核', reviewer:'张三', time:'2026-06-14 09:15' },
  { code:'W-2026-003', status:'solved',  desc:'PD-2026-008 地块属性中证件号格式校验未通过', reviewer:'张三', time:'2026-06-12 16:45' }
];

let selectedPlotId = null;
let isDrawing = false;
let drawPoints = [];
let plotScale = 1;
let mergeSourceId = null;
let mergeTargetId = null;
let mergeStep = 0;
let activeToolboxTab = 0;
let showLabels = true;
let attrBrushSource = null;
let isSelectBoxMode = false;
let isMultiMoveMode = false;

// ============================================================
// RENDER PLOTS
// ============================================================
function renderPlots() {
  const map = document.getElementById('mapWrap');
  map.querySelectorAll('.plot, .draw-point, .draw-line, .draw-polygon').forEach(el => el.remove());
  plots.forEach(p => {
    const div = document.createElement('div');
    let cls = 'plot' + (p.id===selectedPlotId?' selected':'') + (p.id===mergeSourceId?' source':'') + (p.id===mergeTargetId?' target':'');
    if (!showLabels) cls += ' hide-labels';
    div.className = cls;
    div.style.cssText = 'left:'+p.lat+'px;top:'+p.lng+'px;width:'+(p.w*plotScale)+'px;height:'+(p.h*plotScale)+'px';
    div.setAttribute('data-id', p.id);
    div.onclick = function(e){ e.stopPropagation(); onPlotClick(p, e); };
    div.ondblclick = function(e){ e.stopPropagation(); if(isDrawing) finishDrawing(); };
    const lbl = document.createElement('span'); lbl.className = 'plbl'; lbl.textContent = p.name;
    const sz = document.createElement('span'); sz.className = 'psize'; sz.textContent = p.area + p.unit;
    div.appendChild(lbl); div.appendChild(sz);
    map.appendChild(div);
  });
}

// ============================================================
// PLOT CLICK
// ============================================================
function onPlotClick(p, e) {
  if (isDrawing) return;
  // 属性刷粘贴
  if (attrBrushSource && attrBrushSource !== p.id) {
    if (p.type !== plots.find(pp=>pp.id===attrBrushSource).type) {
      showToast('仅限同类型地块间使用属性刷');
      return;
    }
    const src = plots.find(pp=>pp.id===attrBrushSource);
    p.ownerName = src.ownerName; p.certType = src.certType; p.certNo = src.certNo;
    p.isQrd = src.isQrd; p.hasAllowance = src.hasAllowance; p.isHighStandard = src.isHighStandard;
    p.remark = src.remark;
    renderPlots();
    showToast('属性已从 ' + src.name + ' 粘贴到 ' + p.name);
    attrBrushSource = null;
    document.getElementById('btn-plotAttrBrush').classList.remove('triggered');
    return;
  }
  if (isSelectBoxMode) { selectedPlotId = p.id; renderPlots(); return; }
  if (mergeStep === 1) { mergeSourceId = p.id; mergeStep = 2; updateMergeDropdown(); return; }
  if (mergeStep === 2 && p.id !== mergeSourceId) { mergeTargetId = p.id; mergeStep = 3; updateMergeDropdown(); return; }
  selectedPlotId = p.id;
  mergeSourceId = null; mergeTargetId = null;
  renderPlots();
  closeAllDropdowns();
  showPlotPanel(p, e);
}

function showPlotPanel(p, e) {
  closePlotPanel();
  const panel = document.createElement('div');
  panel.className = 'plot-panel show';
  panel.id = 'plotPanel';
  panel.innerHTML = '<div class="dd-header">'+p.name+'<span style="font-size:10px;color:var(--text-tertiary);font-weight:400">'+p.id+'</span></div>'+
    '<div style="padding:8px 12px">'+

// ============================================================
// DROPDOWN SYSTEM
// ============================================================
let activeDropdown = null;
let activeTrigger = null;

function closeAllDropdowns() {
  document.querySelectorAll('.dropdown.show').forEach(d => d.classList.remove('show'));
  document.querySelectorAll('.tbtn.triggered').forEach(b => b.classList.remove('triggered'));
  if (activeDropdown) { activeDropdown.remove(); activeDropdown = null; }
  activeTrigger = null;
  closePlotPanel();
}

function toggleDropdown(triggerId, contentFn, opts) {
  opts = opts || {};
  const btn = document.getElementById(triggerId);
  if (!btn) return;
  if (activeTrigger === btn) { closeAllDropdowns(); return; }
  closeAllDropdowns();
  activeTrigger = btn;
  btn.classList.add('triggered');
  const dropdown = document.createElement('div');
  dropdown.className = 'dropdown show';
  dropdown.innerHTML = contentFn();
  dropdown.style.width = (opts.width || 280) + 'px';
  const btnRect = btn.getBoundingClientRect();
  const toolbarRect = document.querySelector('.toolbar').getBoundingClientRect();
  dropdown.style.position = 'fixed';
  dropdown.style.top = (toolbarRect.bottom + 6) + 'px';
  let left = btnRect.left;
  if (opts.alignRight) left = btnRect.right - (opts.width || 280);
  if (left + (opts.width || 280) > window.innerWidth - 12) left = window.innerWidth - (opts.width || 280) - 12;
  if (left < 12) left = 12;
  dropdown.style.left = left + 'px';
  const arrowLeft = btnRect.left + btnRect.width/2 - left - 6;
  dropdown.style.setProperty('--arrow-left', Math.max(12, Math.min(arrowLeft, (opts.width||280)-24)) + 'px');
  const styleId = 'dropdown-arrow-style';
  if (!document.getElementById(styleId)) {
    const s = document.createElement('style'); s.id = styleId;
    s.textContent = '.dropdown::before { left: var(--arrow-left); }';
    document.head.appendChild(s);
  }
  document.body.appendChild(dropdown);
  activeDropdown = dropdown;
  setTimeout(() => { document.addEventListener('click', outsideHandler, {once: true}); }, 50);
}

function outsideHandler(e) {
  if (activeDropdown && !activeDropdown.contains(e.target) && e.target !== activeTrigger && !activeTrigger.contains(e.target)) {
    closeAllDropdowns();
  } else if (activeDropdown) {
    setTimeout(() => document.addEventListener('click', outsideHandler, {once: true}), 50);
  }
}

function renderSearchFilterResults(qrr, type, name, owner, code, qrCode) {
  let flt = plots;
  if (qrr) flt = flt.filter(p => p.ownerName && p.ownerName.includes(qrr));
  if (type) flt = flt.filter(p => p.type === type);
  if (name) flt = flt.filter(p => p.name && p.name.includes(name));
  if (owner) flt = flt.filter(p => p.ownerName && p.ownerName.includes(owner));
  if (code) flt = flt.filter(p => p.id && p.id.includes(code));
  if (qrCode) flt = flt.filter(p => p.id && p.id.includes(qrCode));
  if (!flt.length) return '<div style="padding:16px;text-align:center;color:var(--text-tertiary);font-size:12px">无匹配地块</div>';
  return flt.map(p => '<div class="dd-item" onclick="closeAllDropdowns();selectAndLocate(\''+p.id+'\')"><span class="dd-icon">&#x1F4CD;</span><span class="dd-desc">'+p.name+'<small>'+p.ownerName+' | '+p.area+p.unit+'</small></span><span class="dd-badge">'+p.type+'</span></div>').join('');
}

document.querySelectorAll('.tbtn[data-action]').forEach(btn => {

    const action = this.getAttribute('data-action');
    switch(action) {
      case 'plotDraw': toggleDropdown('btn-plotDraw', ddDrawContent, {width:240}); break;
      case 'plotSelectBox':
        isSelectBoxMode = !isSelectBoxMode;
        if (isSelectBoxMode) { this.classList.add('triggered'); showToast('已进入地块框选模式，点击地块可选中'); }
        else { this.classList.remove('triggered'); }

      case 'plotAttrBrush':
        if (!selectedPlotId) { showToast('请先选择一个源地块'); return; }
        attrBrushSource = selectedPlotId;
        this.classList.add('triggered');
        showToast('已复制属性，请点击同类型目标地块粘贴');
        break;
      case 'multiMove':
        isMultiMoveMode = !isMultiMoveMode;
        if (isMultiMoveMode) { this.classList.add('triggered'); showToast('已进入多项移动模式，Ctrl+方向键微调'); }
        else { this.classList.remove('triggered'); }
        break;
      case 'showName':
        showLabels = !showLabels;
        if (showLabels) { this.classList.remove('triggered'); showToast('地块名称已显示'); }
        else { this.classList.add('triggered'); showToast('地块名称已隐藏'); }
        renderPlots();
        break;
      case 'polyMerge': toggleDropdown('btn-polyMerge', ddMergeContent, {width:260}); break;
      case 'plotMerge': closeAllDropdowns(); openPlotMergeModal(); break;
      case 'plotSearch': toggleDropdown('btn-plotSearch', ddSearchContent, {width:340}); break;
      case 'layer': toggleDropdown('btn-layer', ddLayerContent, {width:260}); break;
      case 'statistics': toggleDropdown('btn-statistics', ddStatisticsContent, {width:280}); break;
      case 'classify': toggleDropdown('btn-classify', ddClassifyContent, {width:240}); break;
      case 'history': toggleDropdown('btn-history', ddHistoryContent, {width:280}); break;
      case 'toolbox': toggleDropdown('btn-toolbox', ddToolboxContent, {width:300}); break;
      case 'issue': toggleDropdown('btn-issue', ddIssueContent, {width:340, alignRight:true}); break;
    }
  });
});

document.addEventListener('click', function(e) {
  const tab = e.target.closest('#ddToolTabs .dd-tab');
  if (tab) {
    const idx = parseInt(tab.getAttribute('data-tab'));
    activeToolboxTab = idx;
    document.querySelectorAll('#ddToolTabs .dd-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const body = document.getElementById('ddToolBody');
    if (body) body.innerHTML = renderToolToolbox(idx);
  }

document.getElementById('mapWrap').addEventListener('click', function(e) {
  if (e.target === this || e.target.classList.contains('map-bg')) {
    selectedPlotId = null; renderPlots(); closeRPanel(); closeAllDropdowns();
  }
});

// ============================================================
// DRAWING
// ============================================================
function startDraw(mode) { closeAllDropdowns(); isDrawing = true; drawPoints = [];
  document.getElementById('btn-plotDraw').classList.add('triggered');
  document.getElementById('drawHint').classList.add('show');
  document.getElementById('mapWrap').style.cursor = 'crosshair'; }
function cancelDrawing() { isDrawing = false; drawPoints = [];
  document.getElementById('btn-plotDraw').classList.remove('triggered');
  document.getElementById('drawHint').classList.remove('show');
  document.getElementById('mapWrap').style.cursor = 'default'; renderDrawElements(); }
function finishDrawing() {
  if (drawPoints.length < 3) { showToast('至少需要3个顶点'); return; }
  const num = String(plots.length + 1).padStart(3, '0');
  const id = 'PD-2026-' + num;
  plots.push({
    id:id, name:'新地块-'+num, type:'种植地块', area:(Math.random()*5+1).toFixed(2),
    ownerName:'待确认', certType:'居民身份证', certNo:'', isQrd:'否', hasAllowance:'否', isHighStandard:'否', remark:'',
    lat:Math.min(...drawPoints.map(p=>p.x)), lng:Math.min(...drawPoints.map(p=>p.y)),
    w:Math.max(...drawPoints.map(p=>p.x))-Math.min(...drawPoints.map(p=>p.x)),
    h:Math.max(...drawPoints.map(p=>p.y))-Math.min(...drawPoints.map(p=>p.y)), unit:'亩'
  });
  cancelDrawing(); renderPlots(); showToast('新地块 '+id+' 已创建');
}

document.getElementById('mapWrap').addEventListener('click', function(e) {
  if (!isDrawing) return;
  const rect = this.getBoundingClientRect();
  drawPoints.push({x: e.clientX-rect.left, y: e.clientY-rect.top});
  renderDrawElements();
});
document.getElementById('mapWrap').addEventListener('contextmenu', function(e) {
  e.preventDefault(); if (isDrawing) finishDrawing();
});

function renderDrawElements() {
  renderPlots(); const map = document.getElementById('mapWrap');
  if (!drawPoints.length) return;
  drawPoints.forEach((pt,i) => {
    const dot = document.createElement('div'); dot.className = 'draw-point';
    dot.style.cssText = 'left:'+pt.x+'px;top:'+pt.y+'px'; map.appendChild(dot);
    if (i > 0) {
      const prev = drawPoints[i-1], dx = pt.x-prev.x, dy = pt.y-prev.y;
      const dist = Math.sqrt(dx*dx+dy*dy), angle = Math.atan2(dy,dx)*180/Math.PI;
      const line = document.createElement('div'); line.className = 'draw-line';
      line.style.cssText = 'left:'+prev.x+'px;top:'+prev.y+'px;width:'+dist+'px;transform:rotate('+angle+'deg)';
      map.appendChild(line);
    }
  });
}

// ============================================================
// MODALS
// ============================================================
function openModal(title, bodyHTML, footerHTML) {
  const existing = document.querySelector('.modal-overlay');
  if (existing) existing.remove();
  const overlay = document.createElement('div'); overlay.className = 'modal-overlay';
  overlay.innerHTML = '<div class="modal"><div class="modal-header"><span class="m-title">'+title+'</span><button class="modal-close" onclick="closeModal()">&#x2715;</button></div><div class="modal-body">'+bodyHTML+'</div><div class="modal-footer">'+footerHTML+'</div></div>';
  overlay.onclick = function(e) { if (e.target === this) closeModal(); };
  document.body.appendChild(overlay);
  requestAnimationFrame(() => overlay.classList.add('show'));
}
function closeModal() {
  const overlay = document.querySelector('.modal-overlay');
  if (overlay) { overlay.classList.remove('show'); setTimeout(() => overlay.remove(), 250); }
}

function openPolyMergeModal() {
  openModal('多边形合并',
    '<div class="alert alert-info">在地图上用鼠标依次点击多边形顶点，右键或双击完成绘制</div><div class="progress-wrap"><div class="progress-lbl"><span>已选顶点</span><span id="polyCount">0/6</span></div><div class="progress-track"><div class="progress-fill" id="polyFill" style="width:0%"></div></div></div>',
    '<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="closeModal();showProgress()">开始绘制</button>');
}
function showProgress() {
  closeModal();
  let cnt = 0; const iv = setInterval(() => {
    cnt++; if (cnt>6) { clearInterval(iv); showToast('多边形合并完成'); return; }
    const f = document.getElementById('polyFill'); if (f) f.style.width = (cnt/6*100)+'%';
    const c = document.getElementById('polyCount'); if (c) c.textContent = cnt+'/6';
  }, 500);
}

function openPlotMergeModal() {
  mergeStep = 1; mergeSourceId = null; mergeTargetId = null;
  updateMergeDropdown();
}
function updateMergeDropdown() {
  let body = '<div class="merge-steps"><div class="merge-step'+(mergeStep>=1?' active':'')+(mergeStep>1?' done':'')+'">选择源地块</div><div class="merge-step'+(mergeStep>=2?' active':'')+(mergeStep>2?' done':'')+'">选择目标</div><div class="merge-step'+(mergeStep>=3?' active':'')+'">确认合并</div></div>';
  if (mergeStep === 1) body += '<div class="alert alert-info">请在地图上点击作为合并源的地块</div>';
  else if (mergeStep === 2) body += '<div class="alert alert-info">已选源: '+((plots.find(p=>p.id===mergeSourceId)||{}).name||'')+'，请点击目标地块</div>';
  else {
    const s = plots.find(p=>p.id===mergeSourceId)||{}, t = plots.find(p=>p.id===mergeTargetId)||{};
    body += '<div class="alert alert-warn">将把 <b>'+s.name+'</b> 合并到 <b>'+t.name+'</b>，源地块将被删除。</div>';
  }
  openModal('地块合并', body,
    mergeStep===3
    ? '<button class="btn" onclick="closeModal();mergeCleanup()">取消</button><button class="btn btn-primary" onclick="executeMerge()">确认合并</button>'
    : '<button class="btn" onclick="closeModal();mergeCleanup()">取消</button>');
}
function executeMerge() { closeModal(); showProgressModal('地块合并', ()=>{ showToast('地块已合并'); mergeCleanup(); }); }
function mergeCleanup() { mergeStep=0; mergeSourceId=null; mergeTargetId=null; renderPlots(); }

function dispatchToolboxAction(action) {
  switch(action) {
    case 'exportPlotData': openExportModal('地块数据导出'); break;
    case 'exportHistory': openSimpleModal('历史地块导出', '将导出历史基础地块图层的完整数据记录', ()=>{ showProgressModal('历史地块导出'); }); break;
    case 'importFile': openImportModal('文件'); break;
    case 'importCoords': openImportModal('坐标'); break;
    case 'importByField': openFormModal('按字段导入', [
      {l:'数据源',v:'<select class="fs"><option>本地文件</option><option>远程URL</option></select>'},
      {l:'匹配字段',v:'<select class="fs"><option>地块编码</option><option>地块名称</option><option>确权编码</option></select>'},
      {l:'冲突处理',v:'<select class="fs"><option>跳过重复</option><option>覆盖已有</option></select>'}
    ], ()=>{ showProgressModal('按字段导入'); }); break;
    case 'checkPlot': openSimpleModal('地块校验', '校验所有地块的拓扑合法性、边界完整性和重叠检测', ()=>{ showProgressModal('地块校验'); }); break;
    case 'checkArea': openSimpleModal('面积校验', '校验地块实测面积与登记面积的一致性', ()=>{ showProgressModal('面积校验'); }); break;
    case 'pointMerge': openSimpleModal('选取点合并', '在地图上选取控制点进行多边形合并操作', ()=>{ showProgressModal('选取点合并'); }); break;
    case 'baseMerge': openFormModal('底边合并', [
      {l:'范围',v:'<select class="fs"><option>选中地块</option><option>同地块类型</option></select>'},
      {l:'策略',v:'<select class="fs"><option>保留内部编号</option><option>仅合并边界</option></select>'}
    ], ()=>{ showProgressModal('底边合并'); }); break;
    case 'smallMerge': openFormModal('碎块合并', [
      {l:'面积阈值',v:'<input class="fs" value="1.0" placeholder="亩">'},
      {l:'策略',v:'<select class="fs"><option>合并到相邻最大地块</option><option>合并到相邻同名地块</option></select>'}
    ], ()=>{ showProgressModal('碎块合并'); }); break;
    case 'plotSplit': openFormModal('地块分割', [
      {l:'分割方式',v:'<select class="fs"><option>按面积阈值</option><option>按网格均分</option></select>'},
      {l:'阈值参数',v:'<input class="fs" value="2.0">'},
      {l:'范围',v:'<select class="fs"><option>全部地块</option><option>仅选中</option></select>'}
    ], ()=>{ showProgressModal('地块分割'); }); break;
    case 'splitDelete': openFormModal('拆分删除', [
      {l:'地块',v:'<select class="fs">'+plots.map(p=>'<option>'+p.name+'</option>').join('')+'</select>'},
      {l:'删除子地块',v:'<select class="fs"><option>子地块A</option><option>子地块B</option></select>'}
    ], ()=>{ showToast('拆分删除完成'); }); break;
    case 'fieldEdit': openFormModal('字段修改', [
      {l:'修改类型',v:'<select class="fs"><option>用地类型</option><option>所有人姓名</option><option>证件类型</option><option>确权地</option><option>粮食补贴</option><option>高标准农田</option></select>'},
      {l:'目标',v:'<select class="fs"><option>全部地块 ('+plots.length+'个)</option><option>仅选中</option></select>'},
      {l:'新值',v:'<select class="fs"><option>种植地块</option><option>耕种地块</option><option>旱地</option><option>水田</option></select>'}
    ], ()=>{ showProgressModal('字段修改'); }); break;
    case 'attrCheck': openSimpleModal('属性检查', '检查 '+plots.length+' 个地块的属性字段空值、格式和合法性', ()=>{ showProgressModal('属性检查'); }); break;
    case 'baseUpdate': openSimpleModal('底图更新', '将底图图层数据更新到最新版本', ()=>{ showProgressModal('底图更新'); }); break;
  }
}

function openSimpleModal(title, msg, onConfirm) {
  openModal(title, '<div class="alert alert-info">'+msg+'</div>', '<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="closeModal();('+(onConfirm?onConfirm.toString():'()=>{}')+')()">确认</button>');
}

function openFormModal(title, fields, onConfirm) {
  const body = fields.map(f => '<div class="fg"><span class="fl">'+f.l+'</span>'+f.v+'</div>').join('');
  if (onConfirm) {
    openModal(title, body, '<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="closeModal();('+onConfirm.toString()+')()">确认</button>');
  } else {
    openModal(title, body, '<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="closeModal()">确认</button>');
  }
}

function openImportModal(type) {
  openFormModal('导入'+type+'数据', [
    {l:'数据源',v:'<select class="fs"><option>本地文件</option><option>远程URL</option></select>'},
    {l:'冲突处理',v:'<select class="fs"><option>跳过重复</option><option>覆盖已有</option></select>'}
  ], ()=>{ showProgressModal('导入'+type+'数据'); });
}

function openExportModal(type) {
  let body = '<div class="alert alert-info">选择导出范围后将导出为文件</div>';
  body += '<div style="padding:8px 0"><label class="dd-check"><input type="checkbox" checked> 全部地块数据层</label></div>';
  body += '<div style="padding:0 0 8px"><label class="dd-check"><input type="checkbox"> 地块分类汇总</label></div>';
  body += '<div class="fg"><span class="fl">导出格式</span><select class="fs"><option>Excel (.xlsx)</option><option>CSV (.csv)</option></select></div>';
  openModal(type, body, '<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="closeModal();showProgressModal(\''+type+'\')">导出</button>');
}

function showProgressModal(title) {
  closeModal();
  openModal(title,
    '<div class="progress-wrap"><div class="progress-lbl"><span>处理中...</span><span id="pgPercent">0%</span></div><div class="progress-track"><div class="progress-fill" id="pgFill" style="width:0%"></div></div></div>',
    '<button class="btn" onclick="closeModal()">取消</button>');
  let p = 0;
  const iv = setInterval(() => {
    p += Math.random()*25+5;
    if (p >= 100) { p = 100; clearInterval(iv); setTimeout(closeModal, 400); showToast(title+'完成'); }
    const f = document.getElementById('pgFill'); if (f) f.style.width = p+'%';
    const c = document.getElementById('pgPercent'); if (c) c.textContent = Math.round(p)+'%';
  }, 400);
}

// ============================================================
// UTILS
// ============================================================
function selectAndLocate(id) { selectedPlotId = id; renderPlots(); showToast('已定位到地块 '+id); }
function doGlobalSearch(q) { selectedPlotId = null; if (q) { const f = plots.find(p=>p.name.includes(q)||p.id.includes(q)||p.ownerName.includes(q)); if(f) selectedPlotId=f.id; } renderPlots(); }
function zoomMap(dir) { plotScale = Math.max(0.4, Math.min(2, plotScale+dir*0.15)); renderPlots(); }
function resetZoom() { plotScale = 1; renderPlots(); }
function closeRPanel() { document.getElementById('rpanel').classList.remove('show'); }
function showToast(msg) {
  const e = document.querySelector('.toast'); if (e) e.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=>{ if(t.parentNode)t.remove(); }, 2500);
}
function updatePlotAttr(id, key, value) { const p = plots.find(pp=>pp.id===id); if(p){ p[key]=value; renderPlots(); showToast('属性已更新'); } }
function toggleLayer(idx, checked) {
  const layers = ['基础地块','分类地块','历史基础地块图层'];
  showToast((checked?'显示':'隐藏')+layers[idx]);
}
function showIssues() { toggleDropdown('btn-issue', ddIssueContent, {width:340, alignRight:true}); }

document.querySelectorAll('.sb-item[data-menu]').forEach(item => {
  item.addEventListener('click', function() {
    document.querySelectorAll('.sb-item').forEach(i=>i.classList.remove('active'));
    this.classList.add('active'); showToast('切换到: '+this.textContent.trim());
  });
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    if (isDrawing) cancelDrawing();
    else if (document.querySelector('.modal-overlay.show')) closeModal();
    else { closeAllDropdowns(); closeRPanel(); selectedPlotId=null; renderPlots(); }
  }
  if (isMultiMoveMode && selectedPlotId && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
    e.preventDefault();
    const step = e.ctrlKey ? 10 : 1;
    const p = plots.find(pp=>pp.id===selectedPlotId);
    if (!p) return;
    if (e.key === 'ArrowUp') p.lng -= step;
    if (e.key === 'ArrowDown') p.lng += step;
    if (e.key === 'ArrowLeft') p.lat -= step;
    if (e.key === 'ArrowRight') p.lat += step;
    renderPlots();
  }
});

renderPlots();
</script>
