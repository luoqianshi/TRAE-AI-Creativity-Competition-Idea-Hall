<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>约练详情</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #e8e8e8;
  display: flex; justify-content: center; align-items: flex-start;
  min-height: 100vh; padding: 20px;
}
.phone {
  width: 375px; background: #f5f5f5;
  border-radius: 20px; overflow: hidden;
  box-shadow: 0 10px 40px rgba(0,0,0,0.2);
}

.hero {
  padding: 15px 10px 16px; color: #fff; position: relative; overflow: hidden;
  display: flex; flex-direction: column; gap: 10px;
  background: linear-gradient(135deg, #FF6B35 0%, #FF8F5E 50%, #FFB088 100%);
}
.hero-deco {
  position: absolute; border-radius: 50%; opacity: 0.1; background: #fff;
}
.deco-1 { width: 170px; height: 170px; top: -50px; right: -30px; }
.deco-2 { width: 80px; height: 80px; top: 60%; left: -20px; }
.deco-3 { width: 50px; height: 50px; top: 40px; left: 20px; opacity: 0.07; }
.deco-4 { width: 40px; height: 40px; bottom: 30px; right: 25px; opacity: 0.06; }

.hero-top-row {
  position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: space-between;
}
.hero-main { flex: 1; }
.hero-icon { font-size: 40px; display: block; margin-bottom: 2px; }
.hero-name { font-size: 20px; font-weight: bold; }

.hero-creator-card {
  display: flex; align-items: center; gap: 6px;
  background: rgba(0,0,0,0.25); backdrop-filter: blur(4px); border-radius: 25px;
  padding: 5px 10px 5px 5px; border: 1px solid rgba(255,255,255,0.2); flex-shrink: 0;
}
.creator-avatar {
  width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.5);
  background: #ccc; display: flex; align-items: center; justify-content: center; font-size: 12px;
}
.creator-label { font-size: 9px; opacity: 0.7; }
.creator-name { font-size: 12px; font-weight: 600; }

.hero-info-card {
  position: relative; z-index: 1; width: 100%;
  background: rgba(0,0,0,0.25); backdrop-filter: blur(6px);
  border-radius: 10px; padding: 10px 12px; border: 1px solid rgba(255,255,255,0.2);
}
.hero-info-top { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.hero-badge {
  display: inline-block; padding: 3px 12px; border-radius: 15px;
  font-size: 12px; font-weight: bold; background: rgba(0,0,0,0.25);
}
.hero-duration-tag { font-size: 12px; opacity: 0.85; flex: 1; text-align: right; }

.hero-schedule {
  display: flex; align-items: center; gap: 4px;
  font-size: 13px; margin-bottom: 6px; padding: 5px 8px;
  background: rgba(0,0,0,0.15); border-radius: 6px;
}
.hero-arrow { opacity: 0.6; font-size: 11px; }

.hero-countdown-row {
  margin-bottom: 6px; display: flex; align-items: center; justify-content: center; gap: 4px;
  padding: 5px; background: rgba(255,255,255,0.12); border-radius: 6px;
}
.hero-countdown-text { font-size: 16px; font-weight: bold; }

.hero-code-row {
  margin-bottom: 6px; display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 5px; background: rgba(0,0,0,0.12); border-radius: 6px;
}
.hero-code-value { font-size: 16px; font-weight: bold; letter-spacing: 3px; font-family: monospace; }

.hero-summary-row {
  text-align: center; font-size: 12px; opacity: 0.8;
  padding: 4px 0 0; border-top: 1px solid rgba(255,255,255,0.12);
}

.section {
  background: #fff; margin: 10px; padding: 15px;
  border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,0.04);
}

.progress-overview {
  display: flex; align-items: center; justify-content: space-around;
  padding: 10px 0; margin-bottom: 10px; background: #FFFBFA; border-radius: 8px;
}
.progress-stat { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.progress-num { font-size: 24px; font-weight: bold; }
.progress-num.orange { color: #FF9800; }
.progress-num.red { color: #FF6B35; }
.progress-num.gray { color: #999; }
.progress-label { font-size: 11px; color: #666; }
.progress-divider { width: 1px; height: 25px; background: #F0F0F0; }

.progress-countdown {
  text-align: center; padding: 6px 0; margin-bottom: 8px;
  background: #FFF8F3; border-radius: 6px;
}
.progress-countdown-text { font-size: 16px; font-weight: bold; color: #FF6B35; }

.participant-item {
  display: flex; align-items: center; padding: 10px 0;
  border-bottom: 1px solid #f8f8f8;
}
.participant-item:last-child { border-bottom: none; }

.p-avatar {
  width: 32px; height: 32px; border-radius: 50%; margin-right: 10px;
  background: #e0e0e0; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 14px;
}
.p-info { flex: 1; }
.p-name { font-size: 14px; color: #333; }
.p-tag-creator {
  font-size: 10px; color: #FF6B35; background: #FFF3ED;
  padding: 1px 6px; border-radius: 6px; margin-left: 6px;
}
.p-duration { font-size: 11px; color: #52C41A; display: block; margin-top: 2px; }
.p-duration-progress { color: #FF9800; font-weight: 500; }

.p-status-badge {
  font-size: 11px; padding: 3px 9px; border-radius: 10px; flex-shrink: 0;
}
.status-in-progress { background: #FFF3E0; color: #FF9800; }
.status-completed { background: #E8F5E9; color: #4CAF50; }
.status-joined { background: #F5F5F5; color: #999; }

.actions { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.action-btn {
  font-size: 14px; padding: 10px; border-radius: 25px; border: none; cursor: pointer; text-align: center;
}
.btn-primary { background: #FF6B35; color: #fff; }
.btn-cancel { background: #f5f5f5; color: #999; border: 1px solid #ddd; }
.action-tip { text-align: center; font-size: 14px; color: #FF9800; padding: 5px 0; }
</style>
</head>
<body>
<div class="phone">

  <div class="hero">
    <div class="hero-deco deco-1"></div>
    <div class="hero-deco deco-2"></div>
    <div class="hero-deco deco-3"></div>
    <div class="hero-deco deco-4"></div>

    <div class="hero-top-row">
      <div class="hero-main">
        <span class="hero-icon">🏃</span>
        <span class="hero-name">跑步</span>
      </div>
      <div class="hero-creator-card">
        <div class="creator-avatar">🏃</div>
        <div>
          <div class="creator-label">发起人</div>
          <div class="creator-name">跑步爱好者</div>
        </div>
      </div>
    </div>

    <div class="hero-info-card">
      <div class="hero-info-top">
        <span class="hero-badge">招募中</span>
        <span class="hero-duration-tag">30分钟</span>
      </div>
      <div class="hero-schedule">
        📅 2026-06-22 19:00 <span class="hero-arrow">→</span> 19:30
      </div>
      <div class="hero-countdown-row">
        ⏱ <span class="hero-countdown-text">距开始 01:23:45</span>
      </div>
      <div class="hero-code-row">
        邀请码 <span class="hero-code-value">K7M9P2</span>
      </div>
      <div class="hero-summary-row">3 人已加入 · 上限 10 人</div>
    </div>
  </div>

  <div class="section">
    <div style="margin-bottom:12px; font-size:15px; font-weight:bold; color:#333;">
      已加入 · 3 人 <span style="font-size:12px; color:#999; font-weight:normal; float:right; margin-top:3px;">上限 10 人</span>
    </div>

    <div class="participant-item">
      <div class="p-avatar">🏃</div>
      <div class="p-info">
        <span class="p-name">跑步爱好者</span>
        <span class="p-tag-creator">发起人</span>
      </div>
    </div>
    <div class="participant-item">
      <div class="p-avatar">💪</div>
      <div class="p-info"><span class="p-name">运动达人</span></div>
    </div>
    <div class="participant-item">
      <div class="p-avatar">🚴</div>
      <div class="p-info"><span class="p-name">健身新手</span></div>
    </div>

    <div class="actions">
      <button class="action-btn" style="background:#f5f5f5;color:#333;border:1px solid #ddd;">分享邀请好友</button>
      <button class="action-btn btn-primary">🏃 开始运动</button>
      <button class="action-btn" style="background:#fff;color:#FF6B35;border:1px solid #FF6B35;">📅 修改时间</button>
      <button class="action-btn btn-cancel">取消约练</button>
    </div>
  </div>

</div>
</body>
</html>
