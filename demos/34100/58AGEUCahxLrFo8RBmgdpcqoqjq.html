<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时光相册 - 3D照片回忆</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <h1>时光相册</h1>
            <p class="subtitle">3D照片回忆画廊</p>
            <div class="upload-btn-wrapper">
                <button class="upload-btn">+ 添加照片</button>
                <input type="file" id="fileInput" accept="image/*" multiple>
            </div>
        </header>

        <div class="gallery-container" id="galleryContainer">
            <div class="scene" id="scene">
                <div class="photo-sphere" id="photoSphere">
                    <!-- 照片将通过JavaScript动态生成 -->
                </div>
            </div>
            <div class="info-panel" id="infoPanel">
                <h3>操作提示</h3>
                <p>拖拽旋转球体</p>
                <p>滚轮缩放大小</p>
                <p>点击照片查看详情</p>
            </div>
            <div class="zoom-indicator" id="zoomIndicator">缩放: 100%</div>
        </div>

        <div class="modal" id="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <img id="modalImg" src="" alt="照片详情">
                <div class="modal-info">
                    <p id="modalName">照片名称</p>
                    <p id="modalDate">上传时间</p>
                </div>
            </div>
        </div>

        <div class="empty-state" id="emptyState">
            <div class="empty-icon">📷</div>
            <h2>还没有照片</h2>
            <p>点击上方按钮添加您的珍贵回忆</p>
        </div>

        <footer class="footer">
            <p>时光相册 - 留住美好瞬间</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
