<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网络延迟透视监控面板 · 演示原型</title>
    <!-- 引入 ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: #0b0e14;
            color: #e5e9f0;
            padding: 20px;
            min-height: 100vh;
        }

        .app-container {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* ----- 顶部工具栏 ----- */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 20px;
            background: #1a1f2b;
            padding: 14px 24px;
            border-radius: 12px;
            border: 1px solid #2d3545;
        }

        .toolbar .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            background: #2d3545;
            border: none;
            color: #c8d0dd;
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background: #3d465a;
            color: #fff;
        }

        .btn-primary {
            background: #2a6df4;
            color: #fff;
        }

        .btn-primary:hover {
            background: #1e5ad9;
        }

        .btn-success {
            background: #1db954;
            color: #fff;
        }

        .btn-success:hover {
            background: #17a44a;
        }

        .btn-danger {
            background: #e74c3c;
            color: #fff;
        }

        .btn-danger:hover {
            background: #d63a2a;
        }

        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            background: #232a38;
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid #3a4357;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.idle {
            background: #6c7a92;
        }
        .status-dot.running {
            background: #f1c40f;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        .capture-progress {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: #a8b2c7;
            margin-left: auto;
            flex-wrap: wrap;
        }

        .progress-bar {
            width: 140px;
            height: 6px;
            background: #2d3545;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #2a6df4;
            border-radius: 3px;
            transition: width 0.3s;
        }

        /* ----- 统计卡片 ----- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 14px;
        }

        .stat-card {
            background: #1a1f2b;
            border: 1px solid #2d3545;
            border-radius: 10px;
            padding: 16px 18px;
        }

        .stat-card .label {
            font-size: 12px;
            text-transform: uppercase;
            color: #8892a8;
            letter-spacing: 0.5px;
        }

        .stat-card .value {
            font-size: 24px;
            font-weight: 600;
            margin-top: 4px;
            color: #f0f4ff;
        }

        .stat-card .sub {
            font-size: 13px;
            color: #8892a8;
            margin-top: 2px;
        }

        /* ----- 图表 + 分组区 (双栏) ----- */
        .chart-group-row {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }

        .chart-wrapper {
            flex: 3;
            min-width: 0;
            background: #1a1f2b;
            border: 1px solid #2d3545;
            border-radius: 12px;
            padding: 12px;
            height: 320px;
        }

        .group-panel {
            flex: 1;
            min-width: 200px;
            background: #1a1f2b;
            border: 1px solid #2d3545;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .group-panel h4 {
            font-size: 14px;
            font-weight: 500;
            color: #a8b2c7;
            margin-bottom: 4px;
        }

        .drop-zone {
            background: #10151e;
            border: 2px dashed #2d3545;
            border-radius: 8px;
            padding: 14px 10px;
            min-height: 80px;
            transition: 0.2s;
            color: #6c7a92;
            font-size: 13px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }

        .drop-zone.drag-over {
            border-color: #2a6df4;
            background: #1a253b;
        }

        .drop-zone .group-tag {
            background: #2a6df4;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .drop-zone .group-tag .remove {
            cursor: pointer;
            opacity: 0.7;
        }

        .dimension-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
        }

        .dimension-item {
            background: #2d3545;
            color: #c8d0dd;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: grab;
            user-select: none;
            transition: 0.15s;
            border: 1px solid transparent;
        }

        .dimension-item:hover {
            background: #3d465a;
            border-color: #5a6a82;
        }

        .dimension-item:active {
            cursor: grabbing;
        }

        .group-stats-table {
            margin-top: 6px;
            font-size: 13px;
            width: 100%;
            border-collapse: collapse;
        }

        .group-stats-table td {
            padding: 4px 0;
            border-bottom: 1px solid #232a38;
        }

        .group-stats-table .num {
            text-align: right;
            font-weight: 500;
        }

        /* ----- 数据包列表 + 详情 ----- */
        .packet-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #1a1f2b;
            border: 1px solid #2d3545;
            border-radius: 12px;
            padding: 14px 18px;
        }

        .packet-section .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .packet-section .header h3 {
            font-size: 16px;
            font-weight: 500;
        }

        .packet-table-wrap {
            max-height: 200px;
            overflow-y: auto;
            border-radius: 6px;
            border: 1px solid #232a38;
        }

        .packet-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .packet-table th {
            background: #10151e;
            padding: 8px 12px;
            text-align: left;
            font-weight: 500;
            color: #8892a8;
            position: sticky;
            top: 0;
            z-index: 2;
            border-bottom: 1px solid #2d3545;
        }

        .packet-table td {
            padding: 7px 12px;
            border-bottom: 1px solid #232a38;
            cursor: pointer;
            transition: 0.1s;
        }

        .packet-table tr:hover td {
            background: #232a38;
        }

        .packet-table .highlight-row {
            background: #1e2a3f !important;
        }

        .packet-detail-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #10151e;
            border-radius: 8px;
            padding: 14px 16px;
            margin-top: 4px;
            border: 1px solid #2d3545;
        }

        .packet-detail-area .row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 24px;
        }

        .packet-detail-area .row .field {
            font-size: 13px;
        }

        .packet-detail-area .row .field .tag {
            color: #8892a8;
        }

        .payload-tools {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 6px 0 4px;
        }

        .payload-tools .btn-sm {
            background: #2d3545;
            border: none;
            color: #c8d0dd;
            padding: 3px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        .payload-tools .btn-sm.active {
            background: #2a6df4;
            color: #fff;
        }

        .payload-box {
            background: #0b0e14;
            padding: 10px 14px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 13px;
            word-break: break-all;
            max-height: 100px;
            overflow-y: auto;
            white-space: pre-wrap;
            border: 1px solid #232a38;
            color: #d4dcec;
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0e14;
        }
        ::-webkit-scrollbar-thumb {
            background: #3d465a;
            border-radius: 3px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .toolbar { flex-direction: column; align-items: stretch; }
            .capture-progress { margin-left: 0; }
        }
    </style>
</head>
<body>
<div class="app-container">

    <!-- 工具栏 -->
    <div class="toolbar">
        <div class="btn-group">
            <button class="btn btn-success" id="btnStart">▶ 开始抓包</button>
            <button class="btn btn-danger" id="btnStop" disabled>⏹ 停止抓包</button>
            <button class="btn" id="btnLoad">📂 加载PCAP</button>
        </div>
        <div class="status-badge">
            <span class="status-dot idle" id="statusDot"></span>
            <span id="statusText">空闲</span>
        </div>
        <div class="capture-progress">
            <span>包数: <strong id="pktCount">0</strong></span>
            <span>速率: <strong id="pktRate">0</strong> pps</span>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        </div>
    </div>

    <!-- 统计卡片 -->
    <div class="stats-grid">
        <div class="stat-card"><div class="label">总包数</div><div class="value" id="statTotal">0</div></div>
        <div class="stat-card"><div class="label">平均延迟 (ns)</div><div class="value" id="statAvgLatency">0</div></div>
        <div class="stat-card"><div class="label">穿透耗时 (ns)</div><div class="value" id="statPenetration">0</div><div class="sub">服务内部 T3-T2</div></div>
        <div class="stat-card"><div class="label">TCP握手平均 (ns)</div><div class="value" id="statHandshake">0</div></div>
    </div>

    <!-- 图表 + 分组 -->
    <div class="chart-group-row">
        <div class="chart-wrapper" id="chartContainer"></div>
        <div class="group-panel">
            <h4>📊 拖拽分组聚合</h4>
            <div class="drop-zone" id="dropZone">
                <span style="color:#6c7a92;">将维度拖至此处</span>
            </div>
            <div style="font-size:13px; color:#8892a8;">维度字段</div>
            <div class="dimension-list">
                <span class="dimension-item" draggable="true" data-dim="protocol">协议 (protocol)</span>
                <span class="dimension-item" draggable="true" data-dim="srcIp">源IP</span>
                <span class="dimension-item" draggable="true" data-dim="msgType">MsgType</span>
                <span class="dimension-item" draggable="true" data-dim="contract">合约代码</span>
            </div>
            <table class="group-stats-table" id="groupStatsTable">
                <tbody><tr><td colspan="2" style="color:#6c7a92; text-align:center; padding:8px 0;">暂无分组</td></tr></tbody>
            </table>
        </div>
    </div>

    <!-- 数据包列表 + 详情 -->
    <div class="packet-section">
        <div class="header">
            <h3>📦 数据包列表 <span style="font-weight:400;font-size:13px;color:#8892a8;">(点击行查看详情)</span></h3>
            <span style="font-size:13px;color:#8892a8;">实时捕获</span>
        </div>
        <div class="packet-table-wrap">
            <table class="packet-table" id="packetTable">
                <thead>
                    <tr><th>#</th><th>时间</th><th>协议</th><th>源IP</th><th>目的IP</th><th>延迟 (ns)</th><th>穿透 (ns)</th></tr>
                </thead>
                <tbody id="packetBody"></tbody>
            </table>
        </div>
        <div class="packet-detail-area" id="detailArea">
            <div class="row">
                <span class="field"><span class="tag">包序号</span> <strong id="detailIdx">-</strong></span>
                <span class="field"><span class="tag">协议</span> <strong id="detailProto">-</strong></span>
                <span class="field"><span class="tag">源IP</span> <strong id="detailSrc">-</strong></span>
                <span class="field"><span class="tag">目的IP</span> <strong id="detailDst">-</strong></span>
                <span class="field"><span class="tag">延迟</span> <strong id="detailLat">-</strong> ns</span>
                <span class="field"><span class="tag">穿透</span> <strong id="detailPen">-</strong> ns</span>
            </div>
            <div class="payload-tools">
                <span style="color:#8892a8;font-size:13px;margin-right:6px;">载荷转义:</span>
                <button class="btn-sm active" data-base="hex">Hex</button>
                <button class="btn-sm" data-base="bin">Bin</button>
                <button class="btn-sm" data-base="dec">Dec</button>
                <button class="btn-sm" data-base="ascii">ASCII</button>
            </div>
            <div class="payload-box" id="payloadBox">(点击数据包查看载荷)</div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- 模拟数据环境 ----------
        const packetBody = document.getElementById('packetBody');
        const statTotal = document.getElementById('statTotal');
        const statAvgLatency = document.getElementById('statAvgLatency');
        const statPenetration = document.getElementById('statPenetration');
        const statHandshake = document.getElementById('statHandshake');
        const pktCount = document.getElementById('pktCount');
        const pktRate = document.getElementById('pktRate');
        const progressFill = document.getElementById('progressFill');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const detailIdx = document.getElementById('detailIdx');
        const detailProto = document.getElementById('detailProto');
        const detailSrc = document.getElementById('detailSrc');
        const detailDst = document.getElementById('detailDst');
        const detailLat = document.getElementById('detailLat');
        const detailPen = document.getElementById('detailPen');
        const payloadBox = document.getElementById('payloadBox');

        // ECharts
        const chartDom = document.getElementById('chartContainer');
        const myChart = echarts.init(chartDom, 'dark');
        let chartOption = {
            tooltip: { trigger: 'axis' },
            legend: { data: ['延迟 (ns)', '穿透耗时 (ns)'], textStyle: { color: '#a8b2c7' } },
            grid: { left: '3%', right: '4%', bottom: '10%', top: '15%', containLabel: true },
            xAxis: { type: 'category', data: [], axisLabel: { color: '#8892a8', fontSize: 10 } },
            yAxis: { type: 'value', name: '耗时 (ns)', nameTextStyle: { color: '#8892a8' }, axisLabel: { color: '#8892a8' } },
            dataZoom: [{
                type: 'inside',
                start: 0,
                end: 100,
                minSpan: 10
            }],
            series: [
                { name: '延迟 (ns)', type: 'line', smooth: true, data: [], lineStyle: { color: '#2a6df4' }, itemStyle: { color: '#2a6df4' } },
                { name: '穿透耗时 (ns)', type: 'line', smooth: true, data: [], lineStyle: { color: '#f1c40f' }, itemStyle: { color: '#f1c40f' } }
            ]
        };
        myChart.setOption(chartOption);

        // ---------- 状态 ----------
        let isRunning = false;
        let packetHistory = [];          // 存储所有包对象
        let selectedIdx = null;
        let timerId = null;
        let ppsCounter = 0;
        let ppsInterval = null;
        let lastPps = 0;
        let startTime = null;

        // 分组当前维度 (默认无)
        let currentGroupDim = null;

        // ---------- 工具函数 ----------
        function randomIp() {
            return `${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}`;
        }

        function randomHex(len = 16) {
            let s = '';
            for (let i=0; i<len; i++) s += Math.floor(Math.random()*16).toString(16).toUpperCase();
            return s;
        }

        // 生成模拟数据包
        function generatePacket() {
            const protocols = ['TCP', 'UDP', 'FTD', 'ICMP'];
            const proto = protocols[Math.floor(Math.random() * protocols.length)];
            const src = randomIp();
            const dst = randomIp();
            const latency = Math.floor(Math.random() * 50000) + 1000; // 1us ~ 50us
            const penetration = Math.floor(Math.random() * 20000) + 500; // 穿透耗时
            // 载荷 随机 32 字节 hex
            const payloadHex = randomHex(32);
            // 模拟 MsgType / 合约 (用于分组)
            const msgType = ['Login', 'Order', 'Quote', 'Cancel'][Math.floor(Math.random()*4)];
            const contract = ['IF2306', 'RB2310', 'CU2308', 'AU2312'][Math.floor(Math.random()*4)];
            // 时间
            const now = Date.now();
            const timeStr = new Date(now).toLocaleTimeString('zh-CN', { hour12: false });
            return {
                idx: packetHistory.length + 1,
                time: now,
                timeStr: timeStr,
                protocol: proto,
                srcIp: src,
                dstIp: dst,
                latency: latency,
                penetration: penetration,
                payloadHex: payloadHex,
                msgType: msgType,
                contract: contract,
                // 模拟三次握手标记 (仅用于演示)
                isHandshake: Math.random() < 0.15 && proto === 'TCP'
            };
        }

        // 生成一个握手序列 (连续3个包)
        function generateHandshakeSequence() {
            const baseTime = Date.now();
            const src = randomIp();
            const dst = randomIp();
            const synLat = 1200 + Math.random()*800;
            const synAckLat = 900 + Math.random()*600;
            const ackLat = 500 + Math.random()*400;
            const totalHandshake = synLat + synAckLat + ackLat;
            // 三个包
            const p1 = {
                idx: packetHistory.length + 1,
                time: baseTime,
                timeStr: new Date(baseTime).toLocaleTimeString('zh-CN', { hour12: false }),
                protocol: 'TCP',
                srcIp: src,
                dstIp: dst,
                latency: synLat,
                penetration: 0,
                payloadHex: randomHex(16),
                msgType: 'SYN',
                contract: 'N/A',
                isHandshake: true,
                handshakeType: 'SYN'
            };
            const p2 = {
                idx: packetHistory.length + 2,
                time: baseTime + 50,
                timeStr: new Date(baseTime + 50).toLocaleTimeString('zh-CN', { hour12: false }),
                protocol: 'TCP',
                srcIp: dst,
                dstIp: src,
                latency: synAckLat,
                penetration: 0,
                payloadHex: randomHex(16),
                msgType: 'SYN-ACK',
                contract: 'N/A',
                isHandshake: true,
                handshakeType: 'SYN-ACK'
            };
            const p3 = {
                idx: packetHistory.length + 3,
                time: baseTime + 100,
                timeStr: new Date(baseTime + 100).toLocaleTimeString('zh-CN', { hour12: false }),
                protocol: 'TCP',
                srcIp: src,
                dstIp: dst,
                latency: ackLat,
                penetration: 0,
                payloadHex: randomHex(16),
                msgType: 'ACK',
                contract: 'N/A',
                isHandshake: true,
                handshakeType: 'ACK'
            };
            return { packets: [p1, p2, p3], totalHandshake };
        }

        // 添加包到历史
        function addPackets(packets) {
            for (let p of packets) {
                p.idx = packetHistory.length + 1;
                packetHistory.push(p);
            }
            renderPackets();
            updateStatsAndChart();
            // 自动选中最后一个
            if (packets.length > 0) {
                selectPacket(packetHistory.length - 1);
            }
        }

        // 渲染表格
        function renderPackets() {
            const tbody = packetBody;
            tbody.innerHTML = '';
            // 只显示最近 50 个
            const start = Math.max(0, packetHistory.length - 50);
            const slice = packetHistory.slice(start);
            slice.forEach((p, i) => {
                const tr = document.createElement('tr');
                tr.dataset.idx = p.idx - 1; // 实际索引
                if (selectedIdx === p.idx - 1) tr.classList.add('highlight-row');
                tr.innerHTML = `
                    <td>${p.idx}</td>
                    <td>${p.timeStr}</td>
                    <td>${p.protocol}</td>
                    <td>${p.srcIp}</td>
                    <td>${p.dstIp}</td>
                    <td>${p.latency}</td>
                    <td>${p.penetration}</td>
                `;
                tr.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    selectPacket(idx);
                });
                tbody.appendChild(tr);
            });
            pktCount.textContent = packetHistory.length;
        }

        // 选中包显示详情
        function selectPacket(idx) {
            if (idx < 0 || idx >= packetHistory.length) return;
            selectedIdx = idx;
            const p = packetHistory[idx];
            detailIdx.textContent = p.idx;
            detailProto.textContent = p.protocol;
            detailSrc.textContent = p.srcIp;
            detailDst.textContent = p.dstIp;
            detailLat.textContent = p.latency;
            detailPen.textContent = p.penetration;
            // 默认显示 Hex
            showPayload('hex', p);
            // 高亮表格行
            document.querySelectorAll('#packetBody tr').forEach(tr => tr.classList.remove('highlight-row'));
            const rows = document.querySelectorAll('#packetBody tr');
            for (let tr of rows) {
                if (parseInt(tr.dataset.idx) === idx) {
                    tr.classList.add('highlight-row');
                    break;
                }
            }
            // 更新分组统计 (如果有点击，重新计算)
            updateGroupStats();
        }

        // 显示载荷
        let currentPayloadBase = 'hex';
        let currentPayloadPacket = null;

        function showPayload(base, packet) {
            currentPayloadBase = base;
            currentPayloadPacket = packet;
            if (!packet) {
                payloadBox.textContent = '(无数据)';
                return;
            }
            const hex = packet.payloadHex;
            let output = '';
            if (base === 'hex') {
                output = hex;
            } else if (base === 'bin') {
                // 转二进制
                let bin = '';
                for (let i=0; i<hex.length; i+=2) {
                    const byte = parseInt(hex.substr(i,2), 16);
                    bin += byte.toString(2).padStart(8, '0') + ' ';
                }
                output = bin.trim();
            } else if (base === 'dec') {
                let dec = '';
                for (let i=0; i<hex.length; i+=2) {
                    const byte = parseInt(hex.substr(i,2), 16);
                    dec += byte + ' ';
                }
                output = dec.trim();
            } else if (base === 'ascii') {
                let ascii = '';
                for (let i=0; i<hex.length; i+=2) {
                    const byte = parseInt(hex.substr(i,2), 16);
                    if (byte >= 32 && byte <= 126) ascii += String.fromCharCode(byte);
                    else ascii += '.';
                }
                output = ascii;
            }
            payloadBox.textContent = output || '(空)';
        }

        // 载荷切换按钮
        document.querySelectorAll('.payload-tools .btn-sm').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.payload-tools .btn-sm').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                const base = this.dataset.base;
                if (currentPayloadPacket) {
                    showPayload(base, currentPayloadPacket);
                } else {
                    payloadBox.textContent = '(请点击数据包)';
                }
            });
        });

        // 更新统计和图表
        function updateStatsAndChart() {
            const total = packetHistory.length;
            statTotal.textContent = total;
            if (total === 0) {
                statAvgLatency.textContent = '0';
                statPenetration.textContent = '0';
                statHandshake.textContent = '0';
                myChart.setOption({
                    xAxis: { data: [] },
                    series: [{ data: [] }, { data: [] }]
                });
                return;
            }

            // 平均延迟
            const sumLat = packetHistory.reduce((s, p) => s + p.latency, 0);
            const avgLat = Math.round(sumLat / total);
            statAvgLatency.textContent = avgLat;

            // 平均穿透
            const sumPen = packetHistory.reduce((s, p) => s + p.penetration, 0);
            const avgPen = Math.round(sumPen / total);
            statPenetration.textContent = avgPen;

            // 握手平均 (只取有 isHandshake 的)
            const handshakePkts = packetHistory.filter(p => p.isHandshake);
            let avgHandshake = 0;
            if (handshakePkts.length > 0) {
                const sumHand = handshakePkts.reduce((s, p) => s + p.latency, 0);
                avgHandshake = Math.round(sumHand / handshakePkts.length);
            }
            statHandshake.textContent = avgHandshake;

            // 更新图表 (取最近 100 个)
            const show = packetHistory.slice(-100);
            const times = show.map(p => p.timeStr);
            const latData = show.map(p => p.latency);
            const penData = show.map(p => p.penetration);
            myChart.setOption({
                xAxis: { data: times },
                series: [
                    { data: latData },
                    { data: penData }
                ]
            });
            myChart.resize();

            // 更新进度条 (模拟)
            const progress = Math.min(100, (total / 200) * 100);
            progressFill.style.width = progress + '%';
        }

        // 分组统计更新
        function updateGroupStats() {
            const tbody = document.querySelector('#groupStatsTable tbody');
            if (!currentGroupDim) {
                tbody.innerHTML = '<tr><td colspan="2" style="color:#6c7a92; text-align:center; padding:8px 0;">暂无分组</td></tr>';
                return;
            }
            // 按维度聚合
            const groups = {};
            packetHistory.forEach(p => {
                let key = p[currentGroupDim] || '未知';
                if (!groups[key]) groups[key] = { count: 0, sumLat: 0, sumPen: 0 };
                groups[key].count++;
                groups[key].sumLat += p.latency;
                groups[key].sumPen += p.penetration;
            });
            let html = '';
            for (let [key, val] of Object.entries(groups)) {
                const avgLat = Math.round(val.sumLat / val.count);
                const avgPen = Math.round(val.sumPen / val.count);
                html += `<tr><td>${key}</td><td class="num">包${val.count}  avg延迟${avgLat}ns</td></tr>`;
            }
            tbody.innerHTML = html || '<tr><td colspan="2" style="color:#6c7a92; text-align:center;">无数据</td></tr>';
        }

        // 模拟抓包循环
        function captureLoop() {
            if (!isRunning) return;

            // 随机生成 1~3 个包
            const count = Math.floor(Math.random() * 3) + 1;
            let newPackets = [];
            for (let i = 0; i < count; i++) {
                // 偶尔生成握手序列
                if (Math.random() < 0.12 && packetHistory.length > 5) {
                    const seq = generateHandshakeSequence();
                    newPackets.push(...seq.packets);
                    // 更新握手统计 (额外处理)
                    // 但这里我们直接加包，不特殊处理
                } else {
                    newPackets.push(generatePacket());
                }
            }
            // 限制长度，避免过多
            if (packetHistory.length + newPackets.length > 500) {
                packetHistory.splice(0, newPackets.length);
            }
            addPackets(newPackets);
            // 更新pps
            ppsCounter += newPackets.length;

            // 调度下一次
            timerId = setTimeout(captureLoop, 300 + Math.random() * 400);
        }

        // 开始抓包
        function startCapture() {
            if (isRunning) return;
            isRunning = true;
            btnStart.disabled = true;
            btnStop.disabled = false;
            statusDot.className = 'status-dot running';
            statusText.textContent = '抓包中';
            // 重置计数器
            ppsCounter = 0;
            startTime = Date.now();
            if (ppsInterval) clearInterval(ppsInterval);
            ppsInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                const rate = elapsed > 0 ? Math.round(ppsCounter / elapsed) : 0;
                pktRate.textContent = rate;
            }, 1000);
            // 开始循环
            if (timerId) clearTimeout(timerId);
            captureLoop();
        }

        function stopCapture() {
            if (!isRunning) return;
            isRunning = false;
            btnStart.disabled = false;
            btnStop.disabled = true;
            statusDot.className = 'status-dot idle';
            statusText.textContent = '已停止';
            if (timerId) {
                clearTimeout(timerId);
                timerId = null;
            }
            if (ppsInterval) {
                clearInterval(ppsInterval);
                ppsInterval = null;
            }
            pktRate.textContent = '0';
        }

        // 按钮事件
        btnStart.addEventListener('click', startCapture);
        btnStop.addEventListener('click', stopCapture);
        btnLoad.addEventListener('click', function() {
            alert('模拟加载PCAP文件 (实际演示中无真实文件)');
            // 可生成一些随机数据
            for (let i=0; i<10; i++) {
                const p = generatePacket();
                addPackets([p]);
            }
        });

        // ---------- 拖拽分组 ----------
        const dropZone = document.getElementById('dropZone');
        const dimItems = document.querySelectorAll('.dimension-item');

        dimItems.forEach(item => {
            item.addEventListener('dragstart', function(e) {
                e.dataTransfer.setData('text/plain', this.dataset.dim);
                this.style.opacity = '0.5';
            });
            item.addEventListener('dragend', function(e) {
                this.style.opacity = '1';
            });
        });

        dropZone.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.classList.add('drag-over');
        });
        dropZone.addEventListener('dragleave', function(e) {
            this.classList.remove('drag-over');
        });
        dropZone.addEventListener('drop', function(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            const dim = e.dataTransfer.getData('text/plain');
            if (!dim) return;
            currentGroupDim = dim;
            // 显示分组标签
            this.innerHTML = `<span class="group-tag">${dim} <span class="remove" data-dim="${dim}">✕</span></span>`;
            // 重新统计
            updateGroupStats();
            // 移除事件的监听
            const removeBtn = this.querySelector('.remove');
            removeBtn.addEventListener('click', function() {
                currentGroupDim = null;
                dropZone.innerHTML = '<span style="color:#6c7a92;">将维度拖至此处</span>';
                updateGroupStats();
            });
        });

        // 初始显示
        updateGroupStats();

        // 窗口resize图表
        window.addEventListener('resize', function() { myChart.resize(); });

        // 生成一些初始数据
        for (let i=0; i<12; i++) {
            const p = generatePacket();
            addPackets([p]);
        }
        // 选中第一个
        if (packetHistory.length > 0) selectPacket(0);

        // 自动开始抓包演示 (可注释)
        // setTimeout(startCapture, 500);
    })();
</script>
