<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seedance 2.0 · AI 视频工坊</title>
    <!-- 字体 & 图标库 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #0b0d15;
            color: #edeff2;
            min-height: 100vh;
            padding: 24px 32px;
            background-image: radial-gradient(circle at 20% 30%, rgba(120, 80, 255, 0.08) 0%, transparent 50%),
                              radial-gradient(circle at 80% 70%, rgba(0, 200, 255, 0.06) 0%, transparent 50%);
        }
        /* 滚动条 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e2029; border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: #5b5f7a; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #7b7f9a; }

        .app {
            max-width: 1440px;
            margin: 0 auto;
        }

        /* ----- 顶部导航 ----- */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 32px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.6);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 20px;
            letter-spacing: -0.3px;
        }
        .logo i {
            font-size: 28px;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo span {
            background: linear-gradient(135deg, #e0e7ff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .project-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #9ca3af;
            background: rgba(255,255,255,0.05);
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #34d399;
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.9); }
        }
        .btn-primary {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            border: none;
            color: #fff;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 8px 24px -6px rgba(124, 58, 237, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px -6px rgba(124, 58, 237, 0.6);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: #d1d5db;
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.12);
        }

        /* ----- 卡片通用 ----- */
        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 28px;
            padding: 28px 32px;
            margin-bottom: 28px;
            box-shadow: 0 12px 32px -8px rgba(0,0,0,0.5);
            transition: 0.2s;
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-title i {
            color: #818cf8;
            font-size: 20px;
        }
        .badge {
            background: rgba(129, 140, 248, 0.15);
            color: #a5b4fc;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid rgba(129, 140, 248, 0.2);
        }
        .step-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            margin-right: 8px;
        }

        /* ----- 文案输入 ----- */
        .prompt-area {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .prompt-area textarea {
            width: 100%;
            min-height: 100px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 16px 20px;
            color: #f0f2f5;
            font-size: 15px;
            line-height: 1.6;
            resize: vertical;
            font-family: 'Inter', sans-serif;
            transition: 0.2s;
        }
        .prompt-area textarea:focus {
            outline: none;
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2);
        }
        .prompt-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        /* ----- 图片候选网格 ----- */
        .candidates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 8px;
        }
        .candidate-item {
            background: rgba(0,0,0,0.25);
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid transparent;
            transition: 0.2s;
            cursor: pointer;
            position: relative;
        }
        .candidate-item.selected {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.3);
        }
        .candidate-item.best {
            border-color: #fbbf24;
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.4);
        }
        .candidate-item img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
        }
        .candidate-info {
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
        }
        .candidate-score {
            font-size: 13px;
            font-weight: 600;
            background: rgba(255,255,255,0.08);
            padding: 2px 12px;
            border-radius: 40px;
        }
        .candidate-score.high {
            color: #fbbf24;
        }
        .candidate-badge {
            font-size: 11px;
            background: #4f46e5;
            padding: 2px 10px;
            border-radius: 40px;
            color: #fff;
            font-weight: 600;
        }
        .candidate-item .check-mark {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #4f46e5;
            color: #fff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            opacity: 0;
            transition: 0.2s;
        }
        .candidate-item.selected .check-mark {
            opacity: 1;
        }
        .candidate-item .best-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #fbbf24;
            color: #0b0d15;
            font-weight: 700;
            font-size: 11px;
            padding: 2px 12px;
            border-radius: 40px;
        }

        /* 视频生成进度 */
        .progress-wrapper {
            margin: 16px 0 8px;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #2a2d3a;
            border-radius: 8px;
            overflow: hidden;
            margin: 6px 0;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #818cf8, #a78bfa);
            border-radius: 8px;
            transition: width 0.3s;
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #9ca3af;
        }

        /* 视频预览 & 时间轴 */
        .video-preview {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
        }
        .video-player {
            flex: 1 1 420px;
            background: #0b0d15;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.06);
            position: relative;
        }
        .video-player img, .video-player video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-player .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: rgba(255,255,255,0.7);
            backdrop-filter: blur(4px);
            opacity: 0;
            transition: 0.3s;
            cursor: pointer;
        }
        .video-player:hover .play-overlay {
            opacity: 1;
        }

        .timeline-container {
            flex: 2 1 600px;
            min-width: 300px;
        }
        .timeline-tracks {
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 16px 12px;
            margin-top: 8px;
        }
        .track {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .track-label {
            width: 60px;
            font-size: 12px;
            font-weight: 600;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .track-clips {
            flex: 1;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .clip {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 500;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            cursor: grab;
            transition: 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .clip:hover {
            transform: scale(1.03);
        }
        .clip.audio {
            background: linear-gradient(135deg, #0e7490, #06b6d4);
        }
        .clip.subtitle {
            background: linear-gradient(135deg, #b45309, #f59e0b);
        }
        .clip .fa-times {
            font-size: 11px;
            opacity: 0.6;
            cursor: pointer;
            margin-left: 4px;
        }
        .clip .fa-times:hover {
            opacity: 1;
        }
        .timeline-controls {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        /* 辅助 */
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .mt-16 { margin-top: 16px; }
        .mb-8 { margin-bottom: 8px; }
        .text-muted { color: #9ca3af; font-size: 14px; }
        .gap-8 { gap: 8px; }

        /* 响应式 */
        @media (max-width: 768px) {
            body { padding: 16px; }
            .card { padding: 20px; }
            .navbar { flex-wrap: wrap; gap: 12px; }
            .candidates-grid { grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); }
        }
    </style>
</head>
<body>
<div class="app">

    <!-- 导航 -->
    <header class="navbar">
        <div class="logo">
            <i class="fas fa-film"></i>
            <span>Seedance · 工坊</span>
        </div>
        <div class="nav-actions">
            <span class="project-status">
                <span class="status-dot"></span> 项目：AI 宣传片
            </span>
            <button class="btn-secondary" onclick="alert('导出功能模拟')"><i class="fas fa-download"></i> 导出</button>
            <button class="btn-primary" onclick="resetDemo()"><i class="fas fa-plus"></i> 新建项目</button>
        </div>
    </header>

    <!-- Step 1: 文案输入 -->
    <section class="card">
        <div class="card-header">
            <div class="card-title">
                <span class="step-number">1</span> 文案输入
                <span class="badge">支持批量</span>
            </div>
            <span class="text-muted">输入你的创意描述</span>
        </div>
        <div class="prompt-area">
            <textarea id="promptInput" placeholder="例如：一只赛博朋克风格的猫在霓虹雨中行走，未来城市，4K，电影感">一只赛博朋克风格的猫在霓虹雨中行走，未来城市，4K，电影感</textarea>
            <div class="prompt-actions">
                <button class="btn-secondary" onclick="document.getElementById('promptInput').value += ' 添加更多细节'"><i class="fas fa-pen"></i> 丰富文案</button>
                <button class="btn-primary" onclick="generateCandidates()"><i class="fas fa-image"></i> 生成候选图片</button>
            </div>
        </div>
    </section>

    <!-- Step 2: 智能筛选 -->
    <section class="card" id="step2">
        <div class="card-header">
            <div class="card-title">
                <span class="step-number">2</span> 智能筛选
                <span class="badge"><i class="fas fa-robot"></i> CLIP 匹配</span>
            </div>
            <span class="text-muted">自动评分，高亮最佳</span>
        </div>
        <div id="candidatesContainer">
            <div class="text-muted" style="padding:20px 0; text-align:center;">
                <i class="fas fa-info-circle"></i> 点击「生成候选图片」开始
            </div>
        </div>
        <div class="flex-between mt-16">
            <span id="selectionInfo" class="text-muted">未选择任何图片</span>
            <button class="btn-primary" id="generateVideoBtn" disabled onclick="generateVideo()">
                <i class="fas fa-video"></i> 生成视频
            </button>
        </div>
    </section>

    <!-- Step 3: 视频生成 -->
    <section class="card" id="step3">
        <div class="card-header">
            <div class="card-title">
                <span class="step-number">3</span> 视频生成
                <span class="badge"><i class="fas fa-bolt"></i> Seedance 2.0</span>
            </div>
            <span class="text-muted">批量处理中</span>
        </div>
        <div id="videoGenArea">
            <div class="text-muted" style="padding:12px 0;">请先完成步骤 2 并点击「生成视频」</div>
        </div>
    </section>

    <!-- Step 4: 专业剪辑时间轴 -->
    <section class="card" id="step4">
        <div class="card-header">
            <div class="card-title">
                <span class="step-number">4</span> 专业剪辑
                <span class="badge"><i class="fas fa-clock"></i> 毫秒级时间轴</span>
            </div>
            <span class="text-muted">拖拽拼接 · 转场 · 字幕</span>
        </div>
        <div class="video-preview">
            <div class="video-player" id="videoPlayer">
                <div style="color:#6b7280; font-size:15px; display:flex; flex-direction:column; align-items:center; gap:8px;">
                    <i class="fas fa-play-circle" style="font-size:40px; opacity:0.3;"></i>
                    <span>视频预览</span>
                </div>
                <div class="play-overlay" onclick="alert('模拟播放')">
                    <i class="fas fa-play-circle"></i>
                </div>
            </div>
            <div class="timeline-container">
                <div class="timeline-tracks">
                    <div class="track">
                        <span class="track-label"><i class="fas fa-video"></i> 视频</span>
                        <div class="track-clips" id="videoTrack">
                            <span class="clip"><i class="fas fa-film"></i> 片段 A <i class="fas fa-times" onclick="this.parentElement.remove()"></i></span>
                            <span class="clip"><i class="fas fa-film"></i> 片段 B <i class="fas fa-times" onclick="this.parentElement.remove()"></i></span>
                        </div>
                    </div>
                    <div class="track">
                        <span class="track-label"><i class="fas fa-music"></i> 音频</span>
                        <div class="track-clips" id="audioTrack">
                            <span class="clip audio"><i class="fas fa-headphones"></i> 背景音乐 <i class="fas fa-times" onclick="this.parentElement.remove()"></i></span>
                        </div>
                    </div>
                    <div class="track">
                        <span class="track-label"><i class="fas fa-font"></i> 字幕</span>
                        <div class="track-clips" id="subtitleTrack">
                            <span class="clip subtitle"><i class="fas fa-align-left"></i> 开场字幕 <i class="fas fa-times" onclick="this.parentElement.remove()"></i></span>
                        </div>
                    </div>
                </div>
                <div class="timeline-controls">
                    <button class="btn-secondary" onclick="addClip()"><i class="fas fa-plus"></i> 添加片段</button>
                    <button class="btn-secondary" onclick="alert('转场效果面板模拟')"><i class="fas fa-arrows-left-right"></i> 转场</button>
                    <button class="btn-secondary" onclick="alert('导出最终视频')"><i class="fas fa-file-export"></i> 导出成片</button>
                </div>
            </div>
        </div>
    </section>

    <!-- 页脚提示 -->
    <div style="text-align:center; padding:24px 0 8px; font-size:13px; color:#4b5563; border-top:1px solid rgba(255,255,255,0.04);">
        ⚡ 本界面为前端原型 · 实际需接入 Seedance 2.0 API 及后端服务
    </div>
</div>

<script>
    // ---------- 状态 ----------
    let candidates = [];           // 候选图片对象 { id, url, score, selected }
    let selectedId = null;
    let videoGenerated = false;

    // ---------- 工具 ----------
    function randomScore() {
        return Math.round((0.65 + Math.random() * 0.35) * 100) / 100;
    }

    // 生成占位图片 (来自 picsum)
    function getRandomImageUrl() {
        const id = Math.floor(Math.random() * 1000);
        return `https://picsum.photos/seed/${id}/400/225`;
    }

    // 重置演示
    function resetDemo() {
        document.getElementById('promptInput').value = '一只赛博朋克风格的猫在霓虹雨中行走，未来城市，4K，电影感';
        document.getElementById('candidatesContainer').innerHTML = `<div class="text-muted" style="padding:20px 0; text-align:center;"><i class="fas fa-info-circle"></i> 点击「生成候选图片」开始</div>`;
        document.getElementById('generateVideoBtn').disabled = true;
        document.getElementById('selectionInfo').innerText = '未选择任何图片';
        document.getElementById('videoGenArea').innerHTML = `<div class="text-muted" style="padding:12px 0;">请先完成步骤 2 并点击「生成视频」</div>`;
        // 重置时间轴
        document.getElementById('videoTrack').innerHTML = `<span class="clip"><i class="fas fa-film"></i> 片段 A <i class="fas fa-times" onclick="this.parentElement.remove()"></i></span><span class="clip"><i class="fas fa-film"></i> 片段 B <i class="fas fa-times" onclick="this.parentElement.remove()"></i></span>`;
        document.getElementById('audioTrack').innerHTML = `<span class="clip audio"><i class="fas fa-headphones"></i> 背景音乐 <i class="fas fa-times" onclick="this.parentElement.remove()"></i></span>`;
        document.getElementById('subtitleTrack').innerHTML = `<span class="clip subtitle"><i class="fas fa-align-left"></i> 开场字幕 <i class="fas fa-times" onclick="this.parentElement.remove()"></i></span>`;
        // 重置播放器
        const player = document.getElementById('videoPlayer');
        player.innerHTML = `<div style="color:#6b7280; font-size:15px; display:flex; flex-direction:column; align-items:center; gap:8px;"><i class="fas fa-play-circle" style="font-size:40px; opacity:0.3;"></i><span>视频预览</span></div><div class="play-overlay" onclick="alert('模拟播放')"><i class="fas fa-play-circle"></i></div>`;
        videoGenerated = false;
        candidates = [];
        selectedId = null;
    }

    // ---------- 生成候选图片 ----------
    function generateCandidates() {
        const prompt = document.getElementById('promptInput').value.trim();
        if (!prompt) {
            alert('请输入文案描述');
            return;
        }

        // 模拟生成 6 张候选图片
        const container = document.getElementById('candidatesContainer');
        container.innerHTML = `<div style="padding:12px 0; color:#a5b4fc;"><i class="fas fa-spinner fa-spin"></i> 生成中 ...</div>`;

        setTimeout(() => {
            candidates = [];
            const count = 6;
            let html = `<div class="candidates-grid">`;
            let bestScore = -1;
            let bestId = null;

            for (let i = 0; i < count; i++) {
                const score = randomScore();
                const id = `cand-${i}`;
                const url = getRandomImageUrl();
                candidates.push({ id, url, score, selected: false });
                if (score > bestScore) {
                    bestScore = score;
                    bestId = id;
                }
            }

            // 标记最佳
            candidates.forEach(c => {
                if (c.id === bestId) c.selected = true;
                selectedId = bestId;
            });

            // 渲染
            candidates.forEach(c => {
                const isBest = c.id === bestId;
                const isSelected = c.selected;
                const scoreClass = c.score >= 0.85 ? 'high' : '';
                html += `
                    <div class="candidate-item ${isSelected ? 'selected' : ''} ${isBest ? 'best' : ''}" data-id="${c.id}" onclick="toggleSelect('${c.id}')">
                        <img src="${c.url}" alt="候选图片" loading="lazy" />
                        ${isBest ? '<span class="best-badge"><i class="fas fa-crown"></i> 最佳</span>' : ''}
                        <span class="check-mark"><i class="fas fa-check"></i></span>
                        <div class="candidate-info">
                            <span class="candidate-score ${scoreClass}">${(c.score * 100).toFixed(0)}%</span>
                            <span style="font-size:12px; color:#6b7280;">匹配度</span>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;

            // 更新选择信息
            updateSelectionInfo();
            document.getElementById('generateVideoBtn').disabled = false;
        }, 1200);
    }

    // ---------- 切换选择 ----------
    function toggleSelect(id) {
        const item = candidates.find(c => c.id === id);
        if (!item) return;

        // 取消之前的选择
        candidates.forEach(c => c.selected = false);
        item.selected = true;
        selectedId = id;

        // 重新渲染（简单刷新）
        const container = document.getElementById('candidatesContainer');
        // 重新构建 html（保留最佳标记）
        let html = `<div class="candidates-grid">`;
        candidates.forEach(c => {
            const isBest = c.id === id; // 我们不再自动最佳，但之前最佳已标记，这里保持最佳显示，但用户可以手动改选
            // 重算最佳：我们保留之前的最佳标记，但为了演示，我们允许用户选任意一张，但仍然显示原始最佳徽章（我们可以在生成时固定最佳）
            // 为了简单，我们保留原最佳标记不变，但高亮选中的。
            const isSelected = c.selected;
            const scoreClass = c.score >= 0.85 ? 'high' : '';
            // 判断是否是最佳（我们从生成时记录的 bestId 比较）
            const bestId = candidates.find(c2 => c2.selected)?.id || candidates[0]?.id; // 实际我们存储最佳在生成时，但为了演示，我们简单用最高分作为最佳
            // 重新计算最高分
            let bestScore = Math.max(...candidates.map(c => c.score));
            let bestId2 = candidates.find(c => c.score === bestScore)?.id;
            const isBestNow = c.id === bestId2;

            html += `
                <div class="candidate-item ${isSelected ? 'selected' : ''} ${isBestNow ? 'best' : ''}" data-id="${c.id}" onclick="toggleSelect('${c.id}')">
                    <img src="${c.url}" alt="候选图片" loading="lazy" />
                    ${isBestNow ? '<span class="best-badge"><i class="fas fa-crown"></i> 最佳</span>' : ''}
                    <span class="check-mark"><i class="fas fa-check"></i></span>
                    <div class="candidate-info">
                        <span class="candidate-score ${scoreClass}">${(c.score * 100).toFixed(0)}%</span>
                        <span style="font-size:12px; color:#6b7280;">匹配度</span>
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        container.innerHTML = html;
        updateSelectionInfo();
    }

    function updateSelectionInfo() {
        const selected = candidates.find(c => c.selected);
        if (selected) {
            document.getElementById('selectionInfo').innerHTML = `<i class="fas fa-check-circle" style="color:#34d399;"></i> 已选图片 (匹配度 ${(selected.score * 100).toFixed(0)}%)`;
            document.getElementById('generateVideoBtn').disabled = false;
        } else {
            document.getElementById('selectionInfo').innerText = '未选择任何图片';
            document.getElementById('generateVideoBtn').disabled = true;
        }
    }

    // ---------- 生成视频 ----------
    function generateVideo() {
        const selected = candidates.find(c => c.selected);
        if (!selected) {
            alert('请先选择一张图片');
            return;
        }

        const area = document.getElementById('videoGenArea');
        area.innerHTML = `
            <div class="progress-wrapper">
                <div class="flex-between">
                    <span><i class="fas fa-spinner fa-spin"></i> 正在生成视频 ...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width:0%;"></div>
                </div>
                <div class="progress-label">
                    <span>调用 Seedance 2.0</span>
                    <span>预计 15 秒</span>
                </div>
            </div>
        `;

        let progress = 0;
        const interval = setInterval(() => {
            progress += Math.floor(Math.random() * 6) + 2;
            if (progress > 100) progress = 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressPercent').innerText = progress + '%';
            if (progress >= 100) {
                clearInterval(interval);
                // 完成
                area.innerHTML = `
                    <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:8px 0;">
                        <span style="color:#34d399;"><i class="fas fa-check-circle"></i> 视频生成完成！</span>
                        <span class="badge" style="background:rgba(52,211,153,0.15); color:#34d399;">时长 8s · 1080p</span>
                        <button class="btn-secondary" onclick="previewVideo()"><i class="fas fa-eye"></i> 预览</button>
                    </div>
                `;
                videoGenerated = true;
                // 自动在时间轴中添加新片段
                addGeneratedClip();
            }
        }, 200);
    }

    // 预览视频（模拟）
    function previewVideo() {
        const player = document.getElementById('videoPlayer');
        // 随机取一张图片作为视频封面
        const imgUrl = getRandomImageUrl();
        player.innerHTML = `
            <img src="${imgUrl}" alt="视频预览" style="width:100%;height:100%;object-fit:cover;" />
            <div class="play-overlay" onclick="alert('模拟播放视频')">
                <i class="fas fa-play-circle"></i>
            </div>
        `;
    }

    // 添加生成的片段到时间轴
    function addGeneratedClip() {
        const track = document.getElementById('videoTrack');
        const newClip = document.createElement('span');
        newClip.className = 'clip';
        newClip.innerHTML = `<i class="fas fa-film"></i> 生成片段 <i class="fas fa-times" onclick="this.parentElement.remove()"></i>`;
        track.appendChild(newClip);
        // 也加一个音频片段
        const audioTrack = document.getElementById('audioTrack');
        const audioClip = document.createElement('span');
        audioClip.className = 'clip audio';
        audioClip.innerHTML = `<i class="fas fa-headphones"></i> 环境音效 <i class="fas fa-times" onclick="this.parentElement.remove()"></i>`;
        audioTrack.appendChild(audioClip);
    }

    // 添加片段（手动）
    function addClip() {
        const track = document.getElementById('videoTrack');
        const newClip = document.createElement('span');
        newClip.className = 'clip';
        newClip.innerHTML = `<i class="fas fa-film"></i> 片段 ${String.fromCharCode(67 + track.children.length)} <i class="fas fa-times" onclick="this.parentElement.remove()"></i>`;
        track.appendChild(newClip);
    }

    // 初始化（可自动生成示例）
    window.onload = function() {
        // 自动生成候选图片以便展示
        setTimeout(generateCandidates, 300);
    };
</script>
</body>
</html>
