<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>色盲测试</title>
<style>
  :root {
    --primary: #4f6df5;
    --primary-light: #e8ecfd;
    --success: #22c55e;
    --danger: #ef4444;
    --warning: #f59e0b;
    --bg: #f0f4ff;
    --card: #ffffff;
    --text: #1e293b;
    --text-muted: #64748b;
    --radius: 16px;
    --shadow: 0 8px 32px rgba(79, 109, 245, 0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--text);
    overflow-x: hidden;
  }

  .container {
    max-width: 680px;
    width: 100%;
    padding: 24px 20px 40px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 32px;
  }

  .header h1 {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--primary), #8b5cf6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }

  .header p {
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.6;
  }

  /* Progress bar */
  .progress-bar {
    width: 100%;
    height: 6px;
    background: #e2e8f0;
    border-radius: 3px;
    margin-bottom: 24px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), #8b5cf6);
    border-radius: 3px;
    transition: width 0.5s ease;
    width: 0%;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
    font-size: 13px;
    color: var(--text-muted);
  }

  /* Plate card */
  .plate-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 32px;
    text-align: center;
    margin-bottom: 24px;
    transition: transform 0.3s ease;
  }

  .plate-card:hover { transform: translateY(-2px); }

  .plate-label {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  .plate-canvas-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 24px;
  }

  .plate-canvas-wrap canvas {
    border-radius: 50%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }

  /* Options */
  .options-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  .option-btn {
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    background: var(--card);
    padding: 14px 8px;
    font-size: 22px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    color: var(--text);
  }

  .option-btn:hover {
    border-color: var(--primary);
    background: var(--primary-light);
    transform: scale(1.05);
  }

  .option-btn.selected {
    border-color: var(--primary);
    background: var(--primary);
    color: white;
  }

  .option-btn.correct {
    border-color: var(--success);
    background: #dcfce7;
    color: #166534;
  }

  .option-btn.wrong {
    border-color: var(--danger);
    background: #fef2f2;
    color: #991b1b;
  }

  .option-btn:disabled {
    cursor: default;
    transform: none;
  }

  .cant-see-btn {
    grid-column: 1 / -1;
    border: 2px dashed #cbd5e1;
    border-radius: 12px;
    background: transparent;
    padding: 10px;
    font-size: 14px;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .cant-see-btn:hover {
    border-color: var(--warning);
    color: var(--warning);
    background: #fffbeb;
  }

  .cant-see-btn.selected {
    border-color: var(--warning);
    background: #fef3c7;
    color: #92400e;
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 32px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--primary), #8b5cf6);
    color: white;
    box-shadow: 0 4px 16px rgba(79, 109, 245, 0.3);
  }

  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 24px rgba(79, 109, 245, 0.4);
  }

  .btn-primary:disabled {
    opacity: 0.5;
    cursor: default;
    transform: none;
    box-shadow: none;
  }

  .btn-outline {
    background: transparent;
    border: 2px solid #e2e8f0;
    color: var(--text);
  }

  .btn-outline:hover {
    border-color: var(--primary);
    background: var(--primary-light);
  }

  .actions {
    display: flex;
    justify-content: center;
    gap: 12px;
  }

  /* Feedback */
  .feedback {
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 14px;
    margin-bottom: 20px;
    display: none;
    line-height: 1.6;
  }

  .feedback.show { display: block; }

  .feedback.correct {
    background: #dcfce7;
    color: #166534;
    border: 1px solid #bbf7d0;
  }

  .feedback.wrong {
    background: #fef2f2;
    color: #991b1b;
    border: 1px solid #fecaca;
  }

  .feedback.partial {
    background: #fffbeb;
    color: #92400e;
    border: 1px solid #fde68a;
  }

  /* Start / Result screens */
  .screen { display: none; }
  .screen.active { display: block; }

  .start-screen {
    text-align: center;
    padding-top: 60px;
  }

  .start-icon {
    width: 120px;
    height: 120px;
    margin: 0 auto 32px;
    background: linear-gradient(135deg, var(--primary-light), #f3e8ff);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    box-shadow: 0 8px 32px rgba(79, 109, 245, 0.15);
  }

  .start-screen h2 {
    font-size: 24px;
    margin-bottom: 12px;
  }

  .start-screen p {
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.8;
    margin-bottom: 8px;
    max-width: 460px;
    margin-left: auto;
    margin-right: auto;
  }

  .info-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 32px 0;
  }

  .info-card {
    background: var(--card);
    border-radius: 12px;
    padding: 20px 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  }

  .info-card .icon {
    font-size: 28px;
    margin-bottom: 8px;
  }

  .info-card .label {
    font-size: 12px;
    color: var(--text-muted);
  }

  /* Result screen */
  .result-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 40px 32px;
    text-align: center;
    margin-bottom: 24px;
  }

  .result-icon {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    margin: 0 auto 20px;
  }

  .result-icon.normal {
    background: #dcfce7;
  }

  .result-icon.mild {
    background: #fffbeb;
  }

  .result-icon.strong {
    background: #fef2f2;
  }

  .result-card h2 {
    font-size: 22px;
    margin-bottom: 8px;
  }

  .result-card .subtitle {
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 24px;
  }

  .score-ring {
    width: 120px;
    height: 120px;
    margin: 0 auto 24px;
    position: relative;
  }

  .score-ring svg {
    transform: rotate(-90deg);
  }

  .score-ring .score-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px;
    font-weight: 700;
    color: var(--primary);
  }

  .result-detail {
    text-align: left;
    background: #f8fafc;
    border-radius: 12px;
    padding: 20px;
    margin-top: 20px;
  }

  .result-detail h3 {
    font-size: 15px;
    margin-bottom: 12px;
  }

  .result-detail p {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.8;
  }

  /* Responsive */
  @media (max-width: 520px) {
    .container { padding: 16px 12px 32px; }
    .plate-card { padding: 20px 16px; }
    .options-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .option-btn { padding: 12px 4px; font-size: 20px; }
    .info-cards { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .info-card { padding: 14px 8px; }
  }

  /* Animations */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .fade-in {
    animation: fadeIn 0.4s ease forwards;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <h1>色觉测试</h1>
    <p>基于石原色觉检测原理，快速评估您的色觉能力</p>
  </div>

  <!-- Start Screen -->
  <div class="screen start-screen active" id="startScreen">
    <div class="start-icon">👁️</div>
    <h2>准备好了吗？</h2>
    <p>本测试包含 12 组色觉检测图，请仔细辨认圆盘中的数字。</p>
    <p>测试过程中请保持屏幕亮度适中，距离屏幕约 50 厘米。</p>
    <div class="info-cards">
      <div class="info-card">
        <div class="icon">📊</div>
        <div class="label">12 道题目</div>
      </div>
      <div class="info-card">
        <div class="icon">⏱️</div>
        <div class="label">约 3 分钟</div>
      </div>
      <div class="info-card">
        <div class="icon">🎯</div>
        <div class="label">即时结果</div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="startTest()">开始测试</button>
  </div>

  <!-- Test Screen -->
  <div class="screen" id="testScreen">
    <div class="progress-info">
      <span id="progressLabel">第 1 / 12 题</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="plate-card fade-in">
      <div class="plate-label" id="plateLabel">请辨认下图中显示的数字</div>
      <div class="plate-canvas-wrap">
        <canvas id="plateCanvas" width="280" height="280"></canvas>
      </div>
    </div>

    <div class="options-grid" id="optionsGrid"></div>

    <div class="feedback" id="feedback"></div>

    <div class="actions">
      <button class="btn btn-primary" id="nextBtn" disabled onclick="nextQuestion()">下一题</button>
    </div>
  </div>

  <!-- Result Screen -->
  <div class="screen" id="resultScreen">
    <div class="result-card fade-in">
      <div class="result-icon" id="resultIcon">✅</div>
      <h2 id="resultTitle">测试完成</h2>
      <div class="subtitle" id="resultSubtitle">以下是您的测试结果</div>

      <div class="score-ring">
        <svg width="120" height="120">
          <circle cx="60" cy="60" r="52" stroke="#e2e8f0" stroke-width="10" fill="none"/>
          <circle id="scoreCircle" cx="60" cy="60" r="52" stroke="url(#scoreGrad)" stroke-width="10" fill="none"
                  stroke-linecap="round" stroke-dasharray="326.73" stroke-dashoffset="326.73"/>
          <defs>
            <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" style="stop-color:#4f6df5"/>
              <stop offset="100%" style="stop-color:#8b5cf6"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="score-text" id="scoreText">0</div>
      </div>

      <div class="result-detail" id="resultDetail">
        <h3>详细分析</h3>
        <p id="resultText"></p>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-outline" onclick="restartTest()">重新测试</button>
    </div>
  </div>
</div>

<script>
// ============ Ishihara Plate Generator ============

const PLATES = [
  {
    number: 12,
    normalColors: ['#d45a2a','#e0784a','#c44a1a','#b84010','#d45a2a','#a83808'],
    confuseColors: ['#6b7a3a','#5a6930','#7c8b4a','#4e5d28','#8b9a5a','#3d4c20'],
    options: [12, 17, 21, 10],

  {
    number: 8,
    normalColors: ['#c94c2c','#b84018','#d45a2a','#a83410','#e06840','#983008'],
    confuseColors: ['#4a7a4a','#3a6a3a','#5a8a5a','#2a5a2a','#6a9a6a','#1a4a1a'],
    options: [8, 3, 6, 5],
  },
  {
    number: 6,
    normalColors: ['#b84018','#c84c2c','#a83410','#d45a2a','#982c08','#e06840'],
    confuseColors: ['#5a7a3a','#4a6a2a','#6a8a4a','#3a5a1a','#7a9a5a','#2a4a10'],
    options: [6, 9, 2, 5],
  },
  {
    number: 29,
    normalColors: ['#d45a2a','#c44a1a','#e07040','#b84010','#f08858','#a83410'],
    confuseColors: ['#4a7a3a','#3a6a2a','#5a8a4a','#2a5a1a','#6a9a5a','#1a4a0a'],
    options: [29, 70, 26, 35],
  },
  {
    number: 5,
    normalColors: ['#c94c2c','#b84018','#d45a2a','#a83410','#e06840','#983008'],
    confuseColors: ['#5a7a4a','#4a6a3a','#6a8a5a','#3a5a2a','#7a9a6a','#2a4a1a'],
    options: [5, 3, 8, 6],
  },
  {
    number: 74,
    normalColors: ['#d45a2a','#c44a1a','#e07040','#b84010','#f08858','#a83410'],
    confuseColors: ['#4a7a3a','#3a6a2a','#5a8a4a','#2a5a1a','#6a9a5a','#1a4a0a'],
    options: [74, 21, 47, 78],
  },
  {
    number: 16,
    normalColors: ['#c94c2c','#b84018','#d45a2a','#a83410','#e06840','#983008'],
    confuseColors: ['#5a7a3a','#4a6a2a','#6a8a4a','#3a5a1a','#7a9a5a','#2a4a10'],
    options: [16, 18, 15, 19],
  },
  {
    number: 2,
    normalColors: ['#b84018','#c84c2c','#a83410','#d45a2a','#982c08','#e06840'],
    confuseColors: ['#5a7a4a','#4a6a3a','#6a8a5a','#3a5a2a','#7a9a6a','#2a4a1a'],
    options: [2, 7, 5, 3],
  },
  {
    number: 45,
    normalColors: ['#d45a2a','#c44a1a','#e07040','#b84010','#f08858','#a83410'],
    confuseColors: ['#4a7a3a','#3a6a2a','#5a8a4a','#2a5a1a','#6a9a5a','#1a4a0a'],
    options: [45, 55, 42, 48],
  },
  {
    number: 7,
    normalColors: ['#c94c2c','#b84018','#d45a2a','#a83410','#e06840','#983008'],
    confuseColors: ['#5a7a3a','#4a6a2a','#6a8a4a','#3a5a1a','#7a9a5a','#2a4a10'],
    options: [7, 1, 4, 9],
  },
  {
    number: 57,
    normalColors: ['#d45a2a','#c44a1a','#e07040','#b84010','#f08858','#a83410'],
    confuseColors: ['#4a7a3a','#3a6a2a','#5a8a4a','#2a5a1a','#6a9a5a','#1a4a0a'],
    options: [57, 35, 75, 50],
  },
  {
    number: 9,
    normalColors: ['#b84018','#c84c2c','#a83410','#d45a2a','#982c08','#e06840'],
    confuseColors: ['#5a7a4a','#4a6a3a','#6a8a5a','#3a5a2a','#7a9a6a','#2a4a1a'],
    options: [9, 6, 8, 0],
  }
];

// Seeded random for reproducibility
function seededRandom(seed) {
  let s = seed;
  return function() {
    s = (s * 16807 + 0) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

// Digit path definitions for digits 0-9 (normalized 0-1 coords)
const DIGIT_PATHS = {
  0: [[0.35,0.2],[0.65,0.2],[0.7,0.25],[0.7,0.45],[0.7,0.65],[0.65,0.7],[0.35,0.7],[0.3,0.65],[0.3,0.45],[0.3,0.25],[0.35,0.2]],
  1: [[0.45,0.2],[0.45,0.7],[0.35,0.55]],
  2: [[0.35,0.2],[0.65,0.2],[0.7,0.25],[0.7,0.38],[0.55,0.55],[0.3,0.55],[0.3,0.65],[0.35,0.7],[0.65,0.7],[0.7,0.65]],
  3: [[0.35,0.2],[0.65,0.2],[0.7,0.25],[0.7,0.35],[0.6,0.43],[0.7,0.5],[0.7,0.65],[0.65,0.7],[0.35,0.7],[0.3,0.65],[0.3,0.5],[0.4,0.43],[0.3,0.35],[0.3,0.25]],
  4: [[0.6,0.7],[0.6,0.2],[0.3,0.55],[0.7,0.55]],
  5: [[0.7,0.2],[0.35,0.2],[0.3,0.25],[0.3,0.43],[0.55,0.43],[0.7,0.43],[0.7,0.65],[0.65,0.7],[0.35,0.7],[0.3,0.65],[0.3,0.5]],
  6: [[0.65,0.2],[0.4,0.2],[0.3,0.3],[0.3,0.65],[0.35,0.7],[0.65,0.7],[0.7,0.65],[0.7,0.5],[0.55,0.43],[0.3,0.43]],
  7: [[0.3,0.2],[0.7,0.2],[0.5,0.7]],
  8: [[0.5,0.45],[0.35,0.55],[0.35,0.65],[0.4,0.7],[0.6,0.7],[0.65,0.65],[0.65,0.55],[0.5,0.45],[0.35,0.35],[0.35,0.25],[0.4,0.2],[0.6,0.2],[0.65,0.25],[0.65,0.35]],
  9: [[0.3,0.55],[0.45,0.43],[0.7,0.43],[0.7,0.65],[0.65,0.7],[0.35,0.7],[0.3,0.65],[0.3,0.5],[0.45,0.55],[0.65,0.2],[0.4,0.2]]
};

function drawIshiharaPlate(canvas, plate, plateIndex) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;
  const cx = W / 2;
  const cy = H / 2;
  const R = W / 2 - 4;

  ctx.clearRect(0, 0, W, H);

  const rand = seededRandom(plateIndex * 1000 + 42);

  // Get digits to draw
  const digits = String(plate.number).split('');

  // Build digit polygons with proper positioning
  const digitPolygons = [];
  const totalWidth = digits.length;
  const digitWidth = 0.35;
  const digitHeight = 0.55;
  const startX = 0.5 - (totalWidth * digitWidth) / 2;

  digits.forEach((d, i) => {
    const offsetX = startX + i * digitWidth;
    const offsetY = 0.5 - digitHeight / 2;
    const path = DIGIT_PATHS[d];
    if (path) {
      digitPolygons.push(
        path.map(p => [p[0] * digitWidth + offsetX, p[1] * digitHeight + offsetY])
      );
    }
  });

  // Point in polygon test
  function pointInPolygon(x, y, polygon) {
    let inside = false;
    for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
      const xi = polygon[i][0], yi = polygon[i][1];
      const xj = polygon[j][0], yj = polygon[j][1];
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) {
        inside = !inside;
      }
    }
    return inside;
  }

  function isInDigit(px, py) {
    for (const poly of digitPolygons) {
      if (pointInPolygon(px, py, poly)) return true;
    }
    return false;
  }

  // Generate packed dots using Poisson-like distribution
  const dots = [];
  const minDotR = 4;
  const maxDotR = 11;
  const attempts = 3000;

  for (let a = 0; a < attempts; a++) {
    const angle = rand() * Math.PI * 2;
    const dist = Math.sqrt(rand()) * R;
    const x = cx + Math.cos(angle) * dist;
    const y = cy + Math.sin(angle) * dist;

    // Check if inside circle
    const dx = x - cx, dy = y - cy;
    if (dx * dx + dy * dy > (R - 2) * (R - 2)) continue;

    // Random dot size
    const r = minDotR + rand() * (maxDotR - minDotR);

    // Check overlap with existing dots
    let overlaps = false;
    for (const dot of dots) {
      const ddx = x - dot.x, ddy = y - dot.y;
      const minDist = r + dot.r - 1.5;
      if (ddx * ddx + ddy * ddy < minDist * minDist) {
        overlaps = true;
        break;
      }
    }
    if (overlaps) continue;

    // Normalized position for digit check (0-1)
    const nx = (x - (cx - R)) / (2 * R);
    const ny = (y - (cy - R)) / (2 * R);

    const inDigit = isInDigit(nx, ny);

    // Color selection
    const colors = inDigit ? plate.normalColors : plate.confuseColors;
    const color = colors[Math.floor(rand() * colors.length)];

    dots.push({ x, y, r, color, inDigit });
  }

  // Draw background circle
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.fillStyle = '#e8e0d8';
  ctx.fill();
  ctx.restore();

  // Draw dots
  for (const dot of dots) {
    ctx.beginPath();
    ctx.arc(dot.x, dot.y, dot.r, 0, Math.PI * 2);
    ctx.fillStyle = dot.color;
    ctx.fill();
  }
}

// ============ Test Logic ============

let currentPlate = 0;
let score = 0;
let results = [];
let answered = false;

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startTest() {
  currentPlate = 0;
  score = 0;
  results = [];
  showScreen('testScreen');
  loadPlate();
}

function loadPlate() {
  answered = false;
  const plate = PLATES[currentPlate];
  const total = PLATES.length;

  // Update progress
  document.getElementById('progressLabel').textContent = `第 ${currentPlate + 1} / ${total} 题`;
  document.getElementById('progressPct').textContent = `${Math.round(((currentPlate) / total) * 100)}%`;
  document.getElementById('progressFill').style.width = `${((currentPlate) / total) * 100}%`;

  // Draw plate
  const canvas = document.getElementById('plateCanvas');
  drawIshiharaPlate(canvas, plate, currentPlate);

  // Create options
  const grid = document.getElementById('optionsGrid');
  grid.innerHTML = '';

  plate.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(opt, btn);
    grid.appendChild(btn);
  });

  // Can't see button
  const cantSee = document.createElement('button');
  cantSee.className = 'cant-see-btn';
  cantSee.textContent = '看不清数字';
  cantSee.onclick = () => selectAnswer(null, cantSee);
  grid.appendChild(cantSee);

  // Reset
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('nextBtn').textContent = currentPlate < total - 1 ? '下一题' : '查看结果';
  const fb = document.getElementById('feedback');
  fb.className = 'feedback';
  fb.textContent = '';

  // Animate card
  const card = document.querySelector('.plate-card');
  card.classList.remove('fade-in');
  void card.offsetWidth;
  card.classList.add('fade-in');
}

function selectAnswer(value, btn) {
  if (answered) return;
  answered = true;

  const plate = PLATES[currentPlate];
  const correct = value === plate.number;

  if (correct) score++;

  results.push({
    plate: currentPlate,
    expected: plate.number,
    answered: value,
    correct: correct
  });

  // Style buttons
  document.querySelectorAll('.option-btn, .cant-see-btn').forEach(b => {
    b.disabled = true;
    if (parseInt(b.textContent) === plate.number) {
      b.classList.add('correct');
    }
  });

  if (!correct) {
    btn.classList.add('wrong');
  }
  if (value === null && plate.number !== null) {
    btn.classList.add('wrong');
  }
  btn.classList.add('selected');

  // Show feedback
  const fb = document.getElementById('feedback');
  fb.classList.add('show');
  if (correct) {
    fb.className = 'feedback correct show';
    fb.textContent = '正确！您能清晰地辨认这个数字。';
  } else {
    fb.className = 'feedback wrong show';
    fb.textContent = `正确答案是 ${plate.number}。色觉异常的人可能无法辨认此数字。`;
  }

  document.getElementById('nextBtn').disabled = false;
}

function nextQuestion() {
  currentPlate++;
  if (currentPlate >= PLATES.length) {
    showResult();
  } else {
    loadPlate();
  }
}

function showResult() {
  showScreen('resultScreen');

  const total = PLATES.length;
  const pct = Math.round((score / total) * 100);

  // Animate score circle
  const circle = document.getElementById('scoreCircle');
  const circumference = 2 * Math.PI * 52;
  circle.style.transition = 'stroke-dashoffset 1.5s ease';
  setTimeout(() => {
    circle.style.strokeDashoffset = circumference - (circumference * pct / 100);
  }, 200);

  // Animate score number
  const scoreText = document.getElementById('scoreText');
  let current = 0;
  const step = pct / 40;
  const timer = setInterval(() => {
    current += step;
    if (current >= pct) {
      current = pct;
      clearInterval(timer);
    }
    scoreText.textContent = Math.round(current);
  }, 30);

  // Determine result level
  const icon = document.getElementById('resultIcon');
  const title = document.getElementById('resultTitle');
  const subtitle = document.getElementById('resultSubtitle');
  const detail = document.getElementById('resultText');

  let level, levelText;

  if (pct >= 90) {
    level = 'normal';
    levelText = '色觉正常';
    icon.textContent = '✅';
    icon.className = 'result-icon normal';
    title.textContent = '色觉正常';
    subtitle.textContent = '您的色觉能力表现优秀';
    detail.innerHTML = `您在本次测试中答对了 ${score}/${total} 题，准确率 ${pct}%。` +
      `<br><br>这表明您的色觉功能正常，能够正常分辨红色、绿色等常见颜色。` +
      `<br><br>请注意：本测试仅供参考，不能替代专业的色觉检查。如需确诊，请前往医院眼科进行专业检测。`;
  } else if (pct >= 60) {
    level = 'mild';
    levelText = '可能存在轻度色觉异常';
    icon.textContent = '⚠️';
    icon.className = 'result-icon mild';
    title.textContent = '可能存在轻度色觉异常';
    subtitle.textContent = '建议进行专业检查';
    detail.innerHTML = `您在本次测试中答对了 ${score}/${total} 题，准确率 ${pct}%。` +
      `<br><br>部分题目的辨认结果提示您可能存在轻度的色觉异常（如红色弱或绿色弱）。` +
      `<br><br>轻度色觉异常在日常生活中的影响较小，但可能影响某些职业的选择。建议您前往医院眼科进行专业的色觉检查以获取准确诊断。`;
  } else {
    level = 'strong';
    levelText = '可能存在较明显色觉异常';
    icon.textContent = '🔴';
    icon.className = 'result-icon strong';
    title.textContent = '可能存在较明显色觉异常';
    subtitle.textContent = '建议尽早进行专业检查';
    detail.innerHTML = `您在本次测试中答对了 ${score}/${total} 题，准确率 ${pct}%。` +
      `<br><br>测试结果显示您可能存在较明显的色觉异常。色觉异常分为多种类型，包括红色盲、绿色盲、蓝色盲以及全色盲等。` +
      `<br><br>建议您尽快前往正规医院眼科进行全面的色觉功能检查，以确定具体类型和程度。医生可以根据检查结果提供相应的建议和指导。`;
  }

  // Update progress to 100%
  document.getElementById('progressFill').style.width = '100%';
}

function restartTest() {
  // Reset score circle
  const circle = document.getElementById('scoreCircle');
  circle.style.transition = 'none';
  circle.style.strokeDashoffset = 326.73;
  document.getElementById('scoreText').textContent = '0';

  showScreen('startScreen');
}
</script>
