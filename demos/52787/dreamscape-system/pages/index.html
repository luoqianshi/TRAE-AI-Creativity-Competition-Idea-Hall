<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梦境入口</title>
    <style id="theme-vars">
:root {
  /* ── Dreamscape Brand Colors ── */
  --color-primary: #4A2D8A;
  --color-primary-light: #6B4DAE;
  --color-primary-lighter: #9B85C7;
  --color-primary-dark: #2E1B5E;
  --color-primary-bg: rgba(74, 45, 138, 0.06);

  /* ── Night Sky Base ── */
  --color-bg-base: #0C0E1A;
  --color-bg-surface: #13162B;
  --color-bg-elevated: #1A1E38;
  --color-bg-overlay: rgba(12, 14, 26, 0.85);

  /* ── Ethereal Accents ── */
  --color-gold: #D4A853;
  --color-gold-light: #F0D48A;
  --color-lavender: #B8A9E8;
  --color-mist: #C5BFD6;
  --color-aurora-green: #7ECFAD;
  --color-aurora-pink: #D98BA0;

  /* ── Semantic State ── */
  --state-success: #7ECFAD;
  --state-warning: #D4A853;
  --state-error: #D98BA0;
  --state-info: #7EB5CF;

  /* ── Text ── */
  --color-text-primary: #E8E4F3;
  --color-text-secondary: #A9A3BE;
  --color-text-muted: #6E687F;
  --color-text-inverse: #0C0E1A;
  --color-text-link: #B8A9E8;

  /* ── Border ── */
  --color-border: rgba(184, 169, 232, 0.15);
  --color-border-strong: rgba(184, 169, 232, 0.3);
  --color-border-glow: rgba(184, 169, 232, 0.08);

  /* ── Radius ── */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* ── Typography ── */
  --font-display: 'Playfair Display', 'Noto Serif SC', 'Georgia', serif;
  --font-body: 'Noto Sans SC', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  --font-size-hero: 3.5rem;
  --font-size-h1: 2.25rem;
  --font-size-h2: 1.75rem;
  --font-size-h3: 1.25rem;
  --font-size-body: 1rem;
  --font-size-sm: 0.875rem;
  --font-size-xs: 0.75rem;

  --line-height-tight: 1.2;
  --line-height-normal: 1.6;
  --line-height-relaxed: 1.75;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  --letter-spacing-tight: -0.02em;
  --letter-spacing-normal: 0;
  --letter-spacing-wide: 0.05em;
  --letter-spacing-wider: 0.1em;

  /* ── Spacing ── */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: 48px;
  --space-3xl: 64px;
  --space-4xl: 96px;

  /* ── Shadow ── */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.4);
  --shadow-xl: 0 8px 32px rgba(0, 0, 0, 0.5);
  --shadow-glow: 0 0 24px rgba(184, 169, 232, 0.08);
  --shadow-gold-glow: 0 0 32px rgba(212, 168, 83, 0.12);

  /* ── Animation ── */
  --transition-fast: 150ms ease;
  --transition-base: 250ms ease;
  --transition-slow: 400ms ease;
  --transition-dreamy: 600ms cubic-bezier(0.23, 1, 0.32, 1);
}

/* ── Typography Classes ── */
.ds-hero {
  font-family: var(--font-display);
  font-size: var(--font-size-hero);
  font-weight: var(--font-weight-bold);
  line-height: var(--line-height-tight);
  letter-spacing: var(--letter-spacing-tight);
}

.ds-h1 {
  font-family: var(--font-display);
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-bold);
  line-height: var(--line-height-tight);
  letter-spacing: var(--letter-spacing-tight);
}

.ds-h2 {
  font-family: var(--font-display);
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-semibold);
  line-height: var(--line-height-tight);
  letter-spacing: var(--letter-spacing-normal);
}

.ds-h3 {
  font-family: var(--font-body);
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-semibold);
  line-height: var(--line-height-normal);
}

.ds-body {
  font-family: var(--font-body);
  font-size: var(--font-size-body);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

.ds-body-sm {
  font-family: var(--font-body);
  font-size: var(--font-size-sm);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

.ds-caption {
  font-family: var(--font-body);
  font-size: var(--font-size-xs);
  font-weight: var(--font-weight-medium);
  letter-spacing: var(--letter-spacing-wide);
  text-transform: uppercase;
  color: var(--color-text-muted);
}

/* ── Utility Classes ── */
.ds-gradient-text {
  background: linear-gradient(135deg, var(--color-lavender), var(--color-gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.ds-glow-border {
  border: 1px solid var(--color-border-glow);
  box-shadow: var(--shadow-glow);
}

.ds-card-surface {
  background: var(--color-bg-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
}

.ds-btn-primary {
  display: inline-flex;
  align-items: center;
  gap: var(--space-sm);
  padding: var(--space-md) var(--space-xl);
  background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light));
  color: var(--color-text-primary);
  border: none;
  border-radius: var(--radius-full);
  font-family: var(--font-body);
  font-size: var(--font-size-body);
  font-weight: var(--font-weight-medium);
  cursor: pointer;
  transition: all var(--transition-dreamy);
}

.ds-btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 20px rgba(74, 45, 138, 0.4);
}

.ds-btn-secondary {
  display: inline-flex;
  align-items: center;
  gap: var(--space-sm);
  padding: var(--space-md) var(--space-xl);
  background: transparent;
  color: var(--color-lavender);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-full);
  font-family: var(--font-body);
  font-size: var(--font-size-body);
  font-weight: var(--font-weight-medium);
  cursor: pointer;
  transition: all var(--transition-dreamy);
}

.ds-btn-secondary:hover {
  background: rgba(184, 169, 232, 0.08);
  border-color: var(--color-lavender);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-bg-base); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
        <!-- Navigation Bar -->
        <nav class="fixed top-0 left-0 right-0 z-50" style="background: var(--color-bg-overlay); backdrop-filter: blur(12px); border-bottom: 1px solid var(--color-border);">
            <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
                <a href="#" class="flex items-center gap-2" style="color: var(--color-text-primary); text-decoration: none;">
                    <i data-lucide="moon-star" class="w-5 h-5" style="color: var(--color-lavender);"></i>
                    <span class="font-semibold text-lg" style="font-family: var(--font-display); letter-spacing: var(--letter-spacing-tight);">Dreamscape</span>
                </a>
                <div class="hidden md:flex items-center gap-8">
                    <a href="garden.html" data-dom-id="nav-garden" class="text-sm" style="color: var(--color-text-secondary); text-decoration: none; transition: color var(--transition-fast);" onmouseover="this.style.color='var(--color-text-primary)'" onmouseout="this.style.color='var(--color-text-secondary)'">梦境花园</a>
                    <a href="interpret.html" data-dom-id="nav-interpret" class="text-sm" style="color: var(--color-text-secondary); text-decoration: none; transition: color var(--transition-fast);" onmouseover="this.style.color='var(--color-text-primary)'" onmouseout="this.style.color='var(--color-text-secondary)'">解梦空间</a>
                    <a href="workshop.html" data-dom-id="nav-workshop" class="text-sm" style="color: var(--color-text-secondary); text-decoration: none; transition: color var(--transition-fast);" onmouseover="this.style.color='var(--color-text-primary)'" onmouseout="this.style.color='var(--color-text-secondary)'">创意工坊</a>
                </div>
                <a href="page-dream-scene.html" data-dom-id="nav-cta" class="ds-btn-secondary text-sm" style="padding: 8px 20px; text-decoration: none;">
                    开始体验
                </a>
            </div>
        </nav>

        <!-- Hero Section -->
        <section class="relative flex flex-col items-center justify-center text-center" style="min-height: 100vh; background: linear-gradient(180deg, var(--color-bg-base) 0%, var(--color-bg-surface) 100%); padding-top: 80px;">
            <img src="../assets/hero-stars.jpg" alt="深邃星空背景，银河与极光交织" class="absolute inset-0 w-full h-full object-cover" style="opacity: 0.35; pointer-events: none;">
            <div class="absolute inset-0" style="background: linear-gradient(180deg, rgba(12,14,26,0.6) 0%, rgba(12,14,26,0.85) 100%); pointer-events: none;"></div>

            <div class="relative z-10 max-w-3xl mx-auto px-6 flex flex-col items-center gap-6">
                <h1 class="ds-gradient-text ds-hero" style="text-wrap: balance; word-break: keep-all; overflow-wrap: break-word;">描述你的梦境</h1>
                <p class="ds-body text-lg max-w-xl mx-auto" style="color: var(--color-text-secondary); line-height: var(--line-height-relaxed);">
                    用文字描绘你梦境中的景象、感受与故事，让系统为你还原那些转瞬即逝的画面。
                </p>
            </div>

            <!-- Dream Input Area -->
            <div class="relative z-10 w-full max-w-2xl mx-auto px-6 mt-10 flex flex-col items-center gap-5">
                <div class="w-full ds-glow-border dream-input-glow" style="background: var(--color-bg-surface); border-radius: var(--radius-lg);">
                    <textarea
                        rows="5"
                        placeholder="闭上眼睛，回忆你的梦境……"
                        class="w-full resize-none outline-none ds-body"
                        style="background: transparent; color: var(--color-text-primary); padding: var(--space-lg); line-height: var(--line-height-relaxed);"
                        aria-label="梦境描述输入框"
                    ></textarea>
                </div>
                <button data-dom-id="cta-restore" class="ds-btn-primary">
                    <i data-lucide="sparkles" class="w-4 h-4"></i>
                    开始还原梦境
                </button>
            </div>

            <!-- Scroll hint -->
            <div class="absolute bottom-8 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2" style="color: var(--color-text-muted);">
                <span class="text-xs" style="letter-spacing: var(--letter-spacing-wide);">向下探索</span>
                <i data-lucide="chevron-down" class="w-4 h-4" style="animation: float-down 2s ease-in-out infinite;"></i>
            </div>
        </section>

        <!-- Features Section -->
        <section style="background: var(--color-bg-surface); padding: var(--space-4xl) 0;">
            <div class="max-w-5xl mx-auto px-6">
                <div class="text-center mb-16">
                    <h2 class="ds-h2" style="color: var(--color-text-primary); text-wrap: balance; word-break: keep-all;">三步还原梦境</h2>
                    <p class="ds-body mt-4 max-w-lg mx-auto" style="color: var(--color-text-secondary);">从文字到画面的超现实旅程，只需三个简单步骤。</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 lg:gap-8 items-stretch">
                    <!-- Card 1: Describe -->
                    <div class="ds-card-surface flex flex-col p-6 lg:p-8 gap-4 feature-card-hover" style="transition: transform var(--transition-dreamy), border-color var(--transition-dreamy);">
                        <div class="w-10 h-10 flex items-center justify-center" style="background: var(--color-primary-bg); border-radius: var(--radius-md);">
                            <i data-lucide="pen-line" class="w-5 h-5" style="color: var(--color-lavender);"></i>
                        </div>
                        <h3 class="ds-h3" style="color: var(--color-text-primary);">描述梦境</h3>
                        <p class="ds-body-sm" style="color: var(--color-text-secondary); line-height: var(--line-height-relaxed);">
                            用你自己的语言，记录下梦境中的场景、人物、情绪与细节。文字越生动，还原越真实。
                        </p>
                    </div>

                    <!-- Card 2: Generate -->
                    <div class="ds-card-surface flex flex-col p-6 lg:p-8 gap-4 feature-card-hover" style="transition: transform var(--transition-dreamy), border-color var(--transition-dreamy);">
                        <div class="w-10 h-10 flex items-center justify-center" style="background: var(--color-primary-bg); border-radius: var(--radius-md);">
                            <i data-lucide="wand-2" class="w-5 h-5" style="color: var(--color-gold);"></i>
                        </div>
                        <h3 class="ds-h3" style="color: var(--color-text-primary);">智能生成</h3>
                        <p class="ds-body-sm" style="color: var(--color-text-secondary); line-height: var(--line-height-relaxed);">
                            系统解析你的描述，融合超现实视觉风格，生成独一无二的梦境画面。
                        </p>
                    </div>

                    <!-- Card 3: Explore -->
                    <div class="ds-card-surface flex flex-col p-6 lg:p-8 gap-4 feature-card-hover" style="transition: transform var(--transition-dreamy), border-color var(--transition-dreamy);">
                        <div class="w-10 h-10 flex items-center justify-center" style="background: var(--color-primary-bg); border-radius: var(--radius-md);">
                            <i data-lucide="eye" class="w-5 h-5" style="color: var(--color-aurora-green);"></i>
                        </div>
                        <h3 class="ds-h3" style="color: var(--color-text-primary);">沉浸探索</h3>
                        <p class="ds-body-sm" style="color: var(--color-text-secondary); line-height: var(--line-height-relaxed);">
                            在还原的梦境世界中自由漫游，发现潜意识中隐藏的故事与象征。
                        </p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="flex items-center justify-center py-8 px-6" style="background: var(--color-bg-base); border-top: 1px solid var(--color-border);">
            <p class="ds-body-sm" style="color: var(--color-text-muted);">&copy; 2026 Dreamscape. 梦境还原系统。</p>
        </footer>
    </main>

    <style>
        /* Dream input pulsing glow animation */
        .dream-input-glow {
            animation: breathe 4s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { border-color: var(--color-border-glow); box-shadow: var(--shadow-glow); }
            50% { border-color: var(--color-border-strong); box-shadow: 0 0 32px rgba(184, 169, 232, 0.15); }
        }
        /* Scroll down chevron float */
        @keyframes float-down {
            0%, 100% { transform: translateY(0); opacity: 0.6; }
            50% { transform: translateY(6px); opacity: 1; }
        }
        /* Feature card hover */
        .feature-card-hover:hover {
            transform: translateY(-2px);
            border-color: var(--color-border-strong);
        }
        .feature-card-hover:focus-visible {
            outline: 2px solid var(--color-lavender);
            outline-offset: 2px;
        }
        /* CTA active state */
        .ds-btn-primary:active {
            transform: translateY(0);
        }
        .ds-btn-primary:focus-visible {
            outline: 2px solid var(--color-lavender);
            outline-offset: 2px;
        }
        .ds-btn-secondary:focus-visible {
            outline: 2px solid var(--color-lavender);
            outline-offset: 2px;
        }
        /* Textarea focus */
        textarea:focus {
            border-color: transparent;
        }
        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .dream-input-glow { animation-duration: 0.01ms; }
            .feature-card-hover:hover { transform: none; }
            .feature-card-hover { transition-duration: 0.01ms; }
        }
    </style>

    <script>lucide.createIcons();</script>
</body>
</html>
