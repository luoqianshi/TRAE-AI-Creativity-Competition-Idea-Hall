<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭记账本 · 温暖每一笔</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #faf6f0;
            --bg-card: #ffffff;
            --bg-sidebar: #2c3e50;
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
            --text-muted: #bdc3c7;
            --accent-warm: #e67e22;
            --accent-warm-light: #f39c12;
            --accent-green: #27ae60;
            --accent-red: #e74c3c;
            --accent-blue: #3498db;
            --accent-purple: #9b59b6;
            --border-color: #ecf0f1;
            --shadow-soft: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.12);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --font-display: 'Noto Serif SC', serif;
            --font-body: 'Noto Sans SC', sans-serif;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 背景装饰 */
        body::before {
            content: '';
            position: fixed;
            top: -200px;
            right: -200px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(230, 126, 34, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -300px;
            left: -300px;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(39, 174, 96, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .app-container {
            display: flex;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* 侧边栏 */
        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            color: white;
            padding: 30px 20px;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .sidebar-header {
            margin-bottom: 40px;
            text-align: center;
        }

        .sidebar-logo {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .sidebar-logo .heart {
            color: var(--accent-red);
            display: inline-block;
            animation: heartbeat 2s ease infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .sidebar-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
            letter-spacing: 1px;
        }

        .nav-menu {
            list-style: none;
            flex: 1;
        }

        .nav-item {
            padding: 14px 16px;
            margin-bottom: 4px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            font-size: 15px;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.08);
            color: white;
        }

        .nav-item.active {
            background: var(--accent-warm);
            color: white;
            box-shadow: 0 4px 12px rgba(230, 126, 34, 0.3);
        }

        .nav-icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        .sidebar-footer {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 40px;
            min-height: 100vh;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-title {
            font-family: var(--font-display);
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .page-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .current-date {
            text-align: right;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .current-date .day {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 700;
            color: var(--accent-warm);
        }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 24px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-soft);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
        }

        .stat-card.income::before { background: var(--accent-green); }
        .stat-card.expense::before { background: var(--accent-red); }
        .stat-card.balance::before { background: var(--accent-blue); }
        .stat-card.budget::before { background: var(--accent-purple); }

        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-value {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 700;
        }

        .stat-card.income .stat-value { color: var(--accent-green); }
        .stat-card.expense .stat-value { color: var(--accent-red); }
        .stat-card.balance .stat-value { color: var(--accent-blue); }
        .stat-card.budget .stat-value { color: var(--accent-purple); }

        .stat-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* 内容区域 */
        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
            margin-bottom: 30px;
        }

        .panel {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 24px;
            box-shadow: var(--shadow-soft);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .panel-title {
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 700;
        }

        .panel-actions {
            display: flex;
            gap: 8px;
        }

        /* 按钮 */
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: var(--font-body);
            font-size: 14px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--accent-warm);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-warm-light);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(230, 126, 34, 0.3);
        }

        .btn-secondary {
            background: var(--border-color);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: #d5dbdb;
        }

        .btn-icon {
            width: 32px;
            height: 32px;
            padding: 0;
            justify-content: center;
        }

        /* 交易列表 */
        .transactions-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .transaction-item {
            display: flex;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-color);
            gap: 16px;
        }

        .transaction-item:last-child {
            border-bottom: none;
        }

        .transaction-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .transaction-icon.food { background: #fef3e2; color: #e67e22; }
        .transaction-icon.transport { background: #e8f5e9; color: #27ae60; }
        .transaction-icon.shopping { background: #fde8e8; color: #e74c3c; }
        .transaction-icon.entertainment { background: #f3e5f5; color: #9b59b6; }
        .transaction-icon.salary { background: #e3f2fd; color: #3498db; }
        .transaction-icon.other { background: #f5f5f5; color: #7f8c8d; }

        .transaction-info {
            flex: 1;
        }

        .transaction-category {
            font-weight: 500;
            font-size: 15px;
            margin-bottom: 2px;
        }

        .transaction-note {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .transaction-date {
            font-size: 12px;
            color: var(--text-muted);
        }

        .transaction-amount {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 700;
        }

        .transaction-amount.income { color: var(--accent-green); }
        .transaction-amount.expense { color: var(--accent-red); }

        .transaction-delete {
            opacity: 0;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 4px;
        }

        .transaction-item:hover .transaction-delete {
            opacity: 1;
        }

        .transaction-delete:hover {
            color: var(--accent-red);
        }

        /* 图表 */
        .chart-container {
            position: relative;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .donut-chart {
            position: relative;
            width: 180px;
            height: 180px;
        }

        .donut-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .donut-center .label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .donut-center .value {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .chart-legend {
            margin-top: 20px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            font-size: 13px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            margin-right: 10px;
        }

        .legend-label {
            flex: 1;
        }

        .legend-value {
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 32px;
            width: 90%;
            max-width: 480px;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-title {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-size: 15px;
            transition: border-color 0.3s ease;
            background: white;
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--accent-warm);
        }

        .type-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .type-option {
            padding: 12px;
            text-align: center;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .type-option.active.income {
            border-color: var(--accent-green);
            background: #e8f5e9;
            color: var(--accent-green);
        }

        .type-option.active.expense {
            border-color: var(--accent-red);
            background: #fde8e8;
            color: var(--accent-red);
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .category-option {
            padding: 12px 8px;
            text-align: center;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 13px;
        }

        .category-option .cat-icon {
            font-size: 24px;
            display: block;
            margin-bottom: 4px;
        }

        .category-option.active {
            border-color: var(--accent-warm);
            background: #fef3e2;
            color: var(--accent-warm);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .modal-actions .btn {
            flex: 1;
            justify-content: center;
            padding: 12px;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-state .empty-text {
            font-size: 16px;
        }

        /* 浮动按钮 */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--accent-warm);
            color: white;
            border: none;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(230, 126, 34, 0.4);
            z-index: 50;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fab:hover {
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 6px 28px rgba(230, 126, 34, 0.5);
        }

        /* Toast 通知 */
        .toast {
            position: fixed;
            top: 30px;
            right: 30px;
            padding: 16px 24px;
            background: var(--text-primary);
            color: white;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-hover);
            z-index: 2000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success { background: var(--accent-green); }
        .toast.error { background: var(--accent-red); }

        /* 移动端菜单按钮 */
        .menu-toggle {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 101;
            background: var(--bg-sidebar);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            font-size: 20px;
            cursor: pointer;
        }

        /* 响应式 */
        @media (max-width: 1024px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .menu-toggle {
                display: block;
            }

            .main-content {
                margin-left: 0;
                padding: 70px 20px 20px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .page-title {
                font-size: 24px;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .stat-card {
                padding: 16px;
            }

            .stat-value {
                font-size: 22px;
            }

            .category-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .fab {
                bottom: 20px;
                right: 20px;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .category-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* 动画 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stat-card,
        .panel {
            animation: fadeInUp 0.5s ease backwards;
        }

        .stat-card:nth-child(1) { animation-delay: 0.1s; }
        .stat-card:nth-child(2) { animation-delay: 0.2s; }
        .stat-card:nth-child(3) { animation-delay: 0.3s; }
        .stat-card:nth-child(4) { animation-delay: 0.4s; }

        /* 预算进度条 */
        .budget-bar {
            width: 100%;
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }

        .budget-progress {
            height: 100%;
            background: var(--accent-purple);
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .budget-progress.warning {
            background: var(--accent-red);
        }
    </style>
</head>
<body>
    <!-- 移动端菜单按钮 -->
    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>

    <div class="app-container">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">家庭<span class="heart">♥</span>记账</div>
                <div class="sidebar-subtitle">温暖每一笔</div>
            </div>

            <ul class="nav-menu">
                <li class="nav-item active" onclick="switchPage('dashboard')">
                    <span class="nav-icon">🏠</span>
                    <span>概览</span>
                </li>
                <li class="nav-item" onclick="switchPage('transactions')">
                    <span class="nav-icon">📋</span>
                    <span>明细</span>
                </li>
                <li class="nav-item" onclick="switchPage('statistics')">
                    <span class="nav-icon">📊</span>
                    <span>统计</span>
                </li>
                <li class="nav-item" onclick="switchPage('budget')">
                    <span class="nav-icon">💰</span>
                    <span>预算</span>
                </li>
            </ul>

            <div class="sidebar-footer">
                <div>数据本地存储</div>
                <div style="margin-top:4px;">♥ 用心记录生活</div>
            </div>
        </aside>

        <!-- 主内容 -->
        <main class="main-content">
            <!-- 页面头部 -->
            <div class="page-header">
                <div>
                    <h1 class="page-title" id="pageTitle">家庭账本概览</h1>
                    <div class="page-subtitle" id="pageSubtitle">了解家庭财务状况</div>
                </div>
                <div class="current-date" id="currentDate"></div>
            </div>

            <!-- 统计卡片 -->
            <div class="stats-grid">
                <div class="stat-card income">
                    <div class="stat-label">
                        <span>📥</span>
                        <span>本月收入</span>
                    </div>
                    <div class="stat-value" id="totalIncome">¥0.00</div>
                    <div class="stat-meta" id="incomeCount">0 笔记录</div>
                </div>

                <div class="stat-card expense">
                    <div class="stat-label">
                        <span>📤</span>
                        <span>本月支出</span>
                    </div>
                    <div class="stat-value" id="totalExpense">¥0.00</div>
                    <div class="stat-meta" id="expenseCount">0 笔记录</div>
                </div>

                <div class="stat-card balance">
                    <div class="stat-label">
                        <span>💰</span>
                        <span>本月结余</span>
                    </div>
                    <div class="stat-value" id="balance">¥0.00</div>
                    <div class="stat-meta" id="balanceRate">收支平衡</div>
                </div>

                <div class="stat-card budget">
                    <div class="stat-label">
                        <span>🎯</span>
                        <span>预算使用</span>
                    </div>
                    <div class="stat-value" id="budgetUsed">¥0 / ¥0</div>
                    <div class="budget-bar">
                        <div class="budget-progress" id="budgetProgress" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- 内容区域 -->
            <div class="content-grid">
                <!-- 最近交易 -->
                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title">最近交易</div>
                        <div class="panel-actions">
                            <button class="btn btn-primary" onclick="openModal()">
                                <span>+</span>
                                <span>记一笔</span>
                            </button>
                        </div>
                    </div>
                    <div class="transactions-list" id="transactionsList">
                        <!-- 交易记录动态生成 -->
                    </div>
                </div>

                <!-- 分类统计 -->
                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title">支出分类</div>
                    </div>
                    <div class="chart-container">
                        <div class="donut-chart">
                            <svg width="180" height="180" viewBox="0 0 180 180" id="donutChart">
                                <circle cx="90" cy="90" r="70" fill="none" stroke="#ecf0f1" stroke-width="20"/>
                            </svg>
                            <div class="donut-center">
                                <div class="label">总支出</div>
                                <div class="value" id="chartTotal">¥0</div>
                            </div>
                        </div>
                    </div>
                    <div class="chart-legend" id="chartLegend">
                        <!-- 图例动态生成 -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 浮动按钮 -->
    <button class="fab" onclick="openModal()" title="记一笔">+</button>

    <!-- 添加交易模态框 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-title">记一笔</div>

            <div class="form-group">
                <label class="form-label">类型</label>
                <div class="type-selector">
                    <div class="type-option expense active" data-type="expense" onclick="selectType('expense')">
                        📤 支出
                    </div>
                    <div class="type-option income" data-type="income" onclick="selectType('income')">
                        📥 收入
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">分类</label>
                <div class="category-grid" id="categoryGrid">
                    <!-- 分类选项动态生成 -->
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">金额</label>
                <input type="number" class="form-input" id="amountInput" placeholder="0.00" step="0.01" min="0">
            </div>

            <div class="form-group">
                <label class="form-label">备注</label>
                <input type="text" class="form-input" id="noteInput" placeholder="写点什么...">
            </div>

            <div class="form-group">
                <label class="form-label">日期</label>
                <input type="date" class="form-input" id="dateInput">
            </div>

            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="saveTransaction()">保存</button>
            </div>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div class="toast" id="toast"></div>

    <script>
        // 分类配置
        const CATEGORIES = {
            expense: [
                { id: 'food', name: '餐饮', icon: '🍱' },
                { id: 'transport', name: '交通', icon: '🚗' },
                { id: 'shopping', name: '购物', icon: '🛍️' },
                { id: 'entertainment', name: '娱乐', icon: '🎮' },
                { id: 'housing', name: '住房', icon: '🏠' },
                { id: 'medical', name: '医疗', icon: '💊' },
                { id: 'education', name: '教育', icon: '📚' },
                { id: 'other_expense', name: '其他', icon: '📝' }
            ],
            income: [
                { id: 'salary', name: '工资', icon: '💼' },
                { id: 'bonus', name: '奖金', icon: '🎁' },
                { id: 'investment', name: '理财', icon: '📈' },
                { id: 'other_income', name: '其他', icon: '💰' }
            ]
        };

        // 分类颜色
        const CATEGORY_COLORS = {
            food: '#e67e22',
            transport: '#27ae60',
            shopping: '#e74c3c',
            entertainment: '#9b59b6',
            housing: '#3498db',
            medical: '#e91e63',
            education: '#00bcd4',
            other_expense: '#7f8c8d',
            salary: '#3498db',
            bonus: '#27ae60',
            investment: '#9b59b6',
            other_income: '#7f8c8d'
        };

        // 状态
        let currentType = 'expense';
        let currentCategory = '';
        let transactions = [];
        let monthlyBudget = 5000;

        // 初始化
        function init() {
            loadData();
            renderCurrentDate();
            renderCategories();
            renderAll();
            document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
        }

        // 加载数据
        function loadData() {
            const saved = localStorage.getItem('familyAccounting');
            if (saved) {
                const data = JSON.parse(saved);
                transactions = data.transactions || [];
                monthlyBudget = data.budget || 5000;
            }

            // 如果没有数据，添加示例数据
            if (transactions.length === 0) {
                const today = new Date();
                const formatDate = (d) => d.toISOString().split('T')[0];
                transactions = [
                    { id: 1, type: 'income', category: 'salary', amount: 8000, note: '本月工资', date: formatDate(today) },
                    { id: 2, type: 'expense', category: 'food', amount: 120, note: '午餐', date: formatDate(today) },
                    { id: 3, type: 'expense', category: 'transport', amount: 50, note: '地铁', date: formatDate(today) },
                    { id: 4, type: 'expense', category: 'shopping', amount: 280, note: '日用品', date: formatDate(new Date(today - 86400000)) },
                    { id: 5, type: 'expense', category: 'entertainment', amount: 150, note: '看电影', date: formatDate(new Date(today - 86400000 * 2)) }
                ];
                saveData();
            }
        }

        // 保存数据
        function saveData() {
            localStorage.setItem('familyAccounting', JSON.stringify({
                transactions,
                budget: monthlyBudget
            }));
        }

        // 显示当前日期
        function renderCurrentDate() {
            const now = new Date();
            const months = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
            const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            document.getElementById('currentDate').innerHTML = `
                <div>${months[now.getMonth()]} ${now.getDate()}日 · ${days[now.getDay()]}</div>
                <div class="day">${now.getFullYear()}</div>
            `;
        }

        // 渲染分类选项
        function renderCategories() {
            const grid = document.getElementById('categoryGrid');
            const cats = CATEGORIES[currentType];
            grid.innerHTML = cats.map(cat => `
                <div class="category-option ${currentCategory === cat.id ? 'active' : ''}"
                     onclick="selectCategory('${cat.id}')">
                    <span class="cat-icon">${cat.icon}</span>
                    <span>${cat.name}</span>
                </div>
            `).join('');

            if (!currentCategory && cats.length > 0) {
                selectCategory(cats[0].id);
            }
        }

        // 选择类型
        function selectType(type) {
            currentType = type;
            currentCategory = '';
            document.querySelectorAll('.type-option').forEach(el => {
                el.classList.remove('active');
            });
            document.querySelector(`.type-option[data-type="${type}"]`).classList.add('active');
            renderCategories();
        }

        // 选择分类
        function selectCategory(catId) {
            currentCategory = catId;
            document.querySelectorAll('.category-option').forEach(el => {
                el.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
        }

        // 打开模态框
        function openModal() {
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('amountInput').value = '';
            document.getElementById('noteInput').value = '';
            document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
            currentType = 'expense';
            currentCategory = '';
            selectType('expense');
        }

        // 关闭模态框
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        // 保存交易
        function saveTransaction() {
            const amount = parseFloat(document.getElementById('amountInput').value);
            const note = document.getElementById('noteInput').value;
            const date = document.getElementById('dateInput').value;

            if (!amount || amount <= 0) {
                showToast('请输入有效金额', 'error');
                return;
            }

            if (!currentCategory) {
                showToast('请选择分类', 'error');
                return;
            }

            const transaction = {
                id: Date.now(),
                type: currentType,
                category: currentCategory,
                amount: amount,
                note: note || '',
                date: date
            };

            transactions.unshift(transaction);
            saveData();
            renderAll();
            closeModal();
            showToast('记录成功 ♥', 'success');
        }

        // 删除交易
        function deleteTransaction(id) {
            if (confirm('确定要删除这条记录吗？')) {
                transactions = transactions.filter(t => t.id !== id);
                saveData();
                renderAll();
                showToast('已删除', 'success');
            }
        }

        // 获取本月交易
        function getMonthlyTransactions() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            return transactions.filter(t => {
                const d = new Date(t.date);
                return d.getFullYear() === year && d.getMonth() === month;
            });
        }

        // 渲染所有
        function renderAll() {
            renderStats();
            renderTransactions();
            renderChart();
        }

        // 渲染统计
        function renderStats() {
            const monthly = getMonthlyTransactions();
            const income = monthly.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
            const expense = monthly.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
            const balance = income - expense;

            document.getElementById('totalIncome').textContent = `¥${income.toFixed(2)}`;
            document.getElementById('totalExpense').textContent = `¥${expense.toFixed(2)}`;
            document.getElementById('balance').textContent = `¥${balance.toFixed(2)}`;

            const incomeCount = monthly.filter(t => t.type === 'income').length;
            const expenseCount = monthly.filter(t => t.type === 'expense').length;
            document.getElementById('incomeCount').textContent = `${incomeCount} 笔记录`;
            document.getElementById('expenseCount').textContent = `${expenseCount} 笔记录`;

            // 结余比例
            const rate = income > 0 ? ((balance / income) * 100).toFixed(1) : 0;
            let rateText = '';
            if (balance > 0) {
                rateText = `储蓄率 ${rate}%`;
            } else if (balance < 0) {
                rateText = `超支 ${Math.abs(balance).toFixed(2)}`;
            } else {
                rateText = '收支平衡';
            }
            document.getElementById('balanceRate').textContent = rateText;

            // 预算
            const budgetUsed = expense;
            const budgetPercent = monthlyBudget > 0 ? (budgetUsed / monthlyBudget) * 100 : 0;
            document.getElementById('budgetUsed').textContent = `¥${budgetUsed.toFixed(0)} / ¥${monthlyBudget}`;
            const progressEl = document.getElementById('budgetProgress');
            progressEl.style.width = `${Math.min(budgetPercent, 100)}%`;
            if (budgetPercent > 80) {
                progressEl.classList.add('warning');
            } else {
                progressEl.classList.remove('warning');
            }
        }

        // 渲染交易列表
        function renderTransactions() {
            const list = document.getElementById('transactionsList');
            const recent = transactions.slice(0, 8);

            if (recent.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📝</div>
                        <div class="empty-text">还没有记录，点击"记一笔"开始吧</div>
                    </div>
                `;
                return;
            }

            list.innerHTML = recent.map(t => {
                const cat = getCategoryInfo(t.category);
                return `
                    <div class="transaction-item">
                        <div class="transaction-icon ${t.category}">
                            ${cat.icon}
                        </div>
                        <div class="transaction-info">
                            <div class="transaction-category">${cat.name}</div>
                            <div class="transaction-note">${t.note || '无备注'}</div>
                            <div class="transaction-date">${formatDateDisplay(t.date)}</div>
                        </div>
                        <div class="transaction-amount ${t.type}">
                            ${t.type === 'income' ? '+' : '-'}¥${t.amount.toFixed(2)}
                        </div>
                        <div class="transaction-delete" onclick="deleteTransaction(${t.id})">✕</div>
                    </div>
                `;
            }).join('');
        }

        // 渲染图表
        function renderChart() {
            const monthly = getMonthlyTransactions();
            const expenses = monthly.filter(t => t.type === 'expense');

            // 按分类汇总
            const categoryTotals = {};
            expenses.forEach(t => {
                categoryTotals[t.category] = (categoryTotals[t.category] || 0) + t.amount;
            });

            const total = Object.values(categoryTotals).reduce((s, v) => s + v, 0);
            document.getElementById('chartTotal').textContent = `¥${total.toFixed(0)}`;

            const svg = document.getElementById('donutChart');
            const legend = document.getElementById('chartLegend');

            if (total === 0) {
                svg.innerHTML = '<circle cx="90" cy="90" r="70" fill="none" stroke="#ecf0f1" stroke-width="20"/>';
                legend.innerHTML = '<div style="text-align:center;color:#bdc3c7;padding:20px;">暂无支出数据</div>';
                return;
            }

            // 绘制环形图
            let cumulativePercent = 0;
            let circles = '<circle cx="90" cy="90" r="70" fill="none" stroke="#ecf0f1" stroke-width="20"/>';

            const sortedCategories = Object.entries(categoryTotals).sort((a, b) => b[1] - a[1]);

            sortedCategories.forEach(([catId, amount]) => {
                const percent = amount / total;
                const dashArray = 2 * Math.PI * 70;
                const dashOffset = dashArray * (1 - percent);
                const rotation = cumulativePercent * 360 - 90;

                circles += `
                    <circle cx="90" cy="90" r="70" fill="none"
                        stroke="${CATEGORY_COLORS[catId] || '#7f8c8d'}"
                        stroke-width="20"
                        stroke-dasharray="${dashArray}"
                        stroke-dashoffset="${dashOffset}"
                        transform="rotate(${rotation} 90 90)"
                        style="transition: stroke-dashoffset 0.5s ease"/>
                `;

                cumulativePercent += percent;
            });

            svg.innerHTML = circles;

            // 图例
            legend.innerHTML = sortedCategories.map(([catId, amount]) => {
                const cat = getCategoryInfo(catId);
                const percent = ((amount / total) * 100).toFixed(1);
                return `
                    <div class="legend-item">
                        <div class="legend-color" style="background: ${CATEGORY_COLORS[catId] || '#7f8c8d'}"></div>
                        <div class="legend-label">${cat.icon} ${cat.name}</div>
                        <div class="legend-value">¥${amount.toFixed(0)} · ${percent}%</div>
                    </div>
                `;
            }).join('');
        }

        // 获取分类信息
        function getCategoryInfo(catId) {
            for (const type of Object.keys(CATEGORIES)) {
                const cat = CATEGORIES[type].find(c => c.id === catId);
                if (cat) return cat;
            }
            return { id: 'other', name: '其他', icon: '📝' };
        }

        // 格式化日期显示
        function formatDateDisplay(dateStr) {
            const date = new Date(dateStr);
            const now = new Date();
            const diff = now - date;
            const today = new Date(now.toISOString().split('T')[0]);
            const targetDate = new Date(dateStr);

            if (today.getTime() === targetDate.getTime()) {
                return '今天';
            } else if (diff < 2 * 86400000) {
                return '昨天';
            } else {
                return `${date.getMonth() + 1}月${date.getDate()}日`;
            }
        }

        // 显示 Toast
        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // 切换页面
        function switchPage(page) {
            const titles = {
                dashboard: { title: '家庭账本概览', subtitle: '了解家庭财务状况' },
                transactions: { title: '交易明细', subtitle: '查看所有收支记录' },
                statistics: { title: '统计分析', subtitle: '深入了解消费习惯' },
                budget: { title: '预算管理', subtitle: '合理规划家庭开支' }
            };

            const info = titles[page];
            document.getElementById('pageTitle').textContent = info.title;
            document.getElementById('pageSubtitle').textContent = info.subtitle;

            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('active');
            });
            event.currentTarget.classList.add('active');

            // 移动端关闭侧边栏
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }

            showToast(`已切换到${info.title}`);
        }

        // 切换侧边栏（移动端）
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // 点击模态框外部关闭
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // 键盘快捷键
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
            if (e.key === 'n' || e.key === 'N') {
                if (!document.getElementById('modalOverlay').classList.contains('active')) {
                    openModal();
                }
            }
        });

        // 启动
        init();
    </script>
</body>
</html>
