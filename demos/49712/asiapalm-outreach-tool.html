<body>

<header class="header">
  <div class="header-left">
    <div class="logo-mark">A</div>
    <div>
      <h1>AsiaPalm 客户开发消息生成器</h1>
      <p>输入联系人信息，自动生成个性化 B2B  outreach 方案</p>
    </div>
  </div>
</header>

<div class="container">
  <!-- Left: Form -->
  <aside>
    <div class="form-card">
      <h2>📝 联系人信息</h2>
      <form id="outreachForm" onsubmit="event.preventDefault(); generateAll();">
        <div class="form-group">
          <label for="contactName">联系人姓名 <span class="opt">*</span></label>
          <input type="text" id="contactName" placeholder="例如：Stefannie Rae Baring-Terante" required>
        </div>
        <div class="form-group">
          <label for="jobTitle">职位 <span class="opt">*</span></label>
          <input type="text" id="jobTitle" placeholder="例如：Production Supervisor" required>
        </div>
        <div class="form-group">
          <label for="company">公司 <span class="opt">*</span></label>
          <input type="text" id="company" placeholder="例如：Profood International Corp." required>
        </div>
        <div class="form-group">
          <label for="country">国家/地区</label>
          <input type="text" id="country" placeholder="例如：Philippines">
        </div>
        <div class="form-group">
          <label for="industry">行业</label>
          <input type="text" id="industry" placeholder="例如：Food / Cosmetics / Pharma">
        </div>
        <div class="form-group">
          <label for="channel">沟通渠道 <span class="opt">*</span></label>
          <select id="channel" required>
            <option value="linkedin-first">LinkedIn 首次私信</option>
            <option value="linkedin-connect">LinkedIn 加好友申请</option>
            <option value="linkedin-followup">LinkedIn 跟进消息</option>
            <option value="email-first">开发信（首次邮件）</option>
            <option value="email-followup">跟进邮件</option>
            <option value="whatsapp-first">WhatsApp 首次消息</option>
            <option value="whatsapp-followup">WhatsApp 跟进</option>
            <option value="tradeshow-invite">展会会议邀请</option>
            <option value="tradeshow-followup">展会后跟进</option>
            <option value="coldcall">Cold Call 开场白</option>
            <option value="wechat">微信问候</option>
          </select>
        </div>
        <div class="form-group">
          <label for="currentSupplier">当前供应商（如有）</label>
          <input type="text" id="currentSupplier" placeholder="例如：KLK Oleo">
        </div>
        <div class="form-group">
          <label for="notes">备注 / 特殊信息</label>
          <textarea id="notes" placeholder="例如：刚参加完展会、对可持续采购感兴趣、正在扩产..."></textarea>
        </div>
        <div class="form-group">
          <label for="myName">我的名字（落款用）</label>
          <input type="text" id="myName" value="Rosa">
        </div>
        <div class="form-group">
          <label for="linkedinUrl">LinkedIn 主页 <span class="opt">可选</span></label>
          <input type="url" id="linkedinUrl" placeholder="https://linkedin.com/in/...">
        </div>
        <div class="form-group">
          <label for="website">公司官网 <span class="opt">可选</span></label>
          <input type="url" id="website" placeholder="https://...">
        </div>
        <button type="submit" class="btn-primary">✨ 生成 Outreach 方案</button>
      </form>
    </div>
  </aside>

  <!-- Right: Output -->
  <main>
    <div id="out-section">

      <!-- 1. Customer Analysis -->
      <div class="out-block">
        <div class="out-header">
          <h3>① 客户分析</h3>
          <button class="copy-btn" onclick="copyText('out-analysis')">复制</button>
        </div>
        <div class="out-body" id="out-analysis"></div>
      </div>

      <!-- 2. Strategy -->
      <div class="out-block">
        <div class="out-header">
          <h3>② 推荐沟通策略</h3>
          <button class="copy-btn" onclick="copyText('out-strategy')">复制</button>
        </div>
        <div class="out-body" id="out-strategy"></div>
      </div>

      <!-- 3. Value Prop -->
      <div class="out-block">
        <div class="out-header">
          <h3>③ 最佳价值主张</h3>
          <button class="copy-btn" onclick="copyText('out-value')">复制</button>
        </div>
        <div class="out-body" id="out-value"></div>
      </div>

      <!-- 4. Message -->
      <div class="out-block message-block">
        <div class="out-header">
          <h3>④ 生成的消息</h3>
          <button class="copy-btn" onclick="copyText('out-message')">复制</button>
        </div>
        <div class="out-body" id="out-message"></div>
        <div class="message-meta">
          <span id="out-message-meta"></span>
          <span id="out-stats"></span>
        </div>
      </div>

      <!-- 5. Subject -->
      <div class="out-block" id="out-subject-wrap" style="display:none;">
        <div class="out-header">
          <h3>⑤ 邮件主题</h3>
          <button class="copy-btn" onclick="copyText('out-subject')">复制</button>
        </div>
        <div class="out-body" id="out-subject" style="font-family: GeistMono, monospace; background:#FAFAF8;"></div>
      </div>

      <!-- 6. CTA -->
      <div class="out-block">
        <div class="out-header">
          <h3>⑥ 建议行动号召 (CTA)</h3>
          <button class="copy-btn" onclick="copyText('out-cta')">复制</button>
        </div>
        <div class="out-body">
          <div class="cta-box" id="out-cta"></div>
        </div>
      </div>

      <!-- 7. Timing -->
      <div class="out-block">
        <div class="out-header">
          <h3>⑦ 推荐跟进时机</h3>
        </div>
        <div class="out-body" id="out-timing"></div>
      </div>

      <!-- 8. Follow-up -->
      <div class="out-block message-block">
        <div class="out-header">
          <h3>⑧ 第二次跟进消息（若无回复）</h3>
          <button class="copy-btn" onclick="copyText('out-followup')">复制</button>
        </div>
        <div class="out-body" id="out-followup"></div>
      </div>

    </div>

    <!-- Empty state -->
    <div id="empty-state" class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <p>请在左侧填写联系人信息，点击「生成 Outreach 方案」开始。</p>
    </div>
  </main>
</div>

<script src="assets/app.js"></script>
</body>
