<title>WebGIS 项目评估向导 · 原型</title>
<style>
  :root {
    --bg: #F4F7F6;
    --surface: #FFFFFF;
    --surface-2: #EDF2F0;
    --ink: #17211E;
    --muted: #5C6B66;
    --line: #DCE4E1;
    --accent: #146E63;
    --accent-ink: #0D4A43;
    --accent-soft: #E2F0EC;
    --warn: #9A5B00;
    --warn-soft: #F6EBD7;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "SF Pro SC", "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101715; --surface: #192220; --surface-2: #1F2B28;
      --ink: #E4EDEA; --muted: #8FA39D; --line: #2A3733;
      --accent: #4FC4B2; --accent-ink: #8ADFD2; --accent-soft: #16332E;
      --warn: #E0A65B; --warn-soft: #2E250F;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101715; --surface: #192220; --surface-2: #1F2B28;
    --ink: #E4EDEA; --muted: #8FA39D; --line: #2A3733;
    --accent: #4FC4B2; --accent-ink: #8ADFD2; --accent-soft: #16332E;
    --warn: #E0A65B; --warn-soft: #2E250F;
  }
  :root[data-theme="light"] {
    --bg: #F4F7F6; --surface: #FFFFFF; --surface-2: #EDF2F0;
    --ink: #17211E; --muted: #5C6B66; --line: #DCE4E1;
    --accent: #146E63; --accent-ink: #0D4A43; --accent-soft: #E2F0EC;
    --warn: #9A5B00; --warn-soft: #F6EBD7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 14px; line-height: 1.6;
  }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  .app { max-width: 1280px; margin: 0 auto; padding: 0 20px 60px; }
  header.top {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 22px 4px 16px; border-bottom: 1px solid var(--line); margin-bottom: 20px;
  }
  header.top h1 { font-size: 19px; margin: 0; letter-spacing: .01em; }
  .chip {
    font-family: var(--mono); font-size: 11px; padding: 2px 8px; border-radius: 3px;
    background: var(--accent-soft); color: var(--accent-ink); white-space: nowrap;
  }
  .scope { color: var(--muted); font-size: 12.5px; }
  .spacer { flex: 1; }
  .reset-btn {
    background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 5px; padding: 4px 12px; font-size: 12px; cursor: pointer;
  }
  .reset-btn:hover { border-color: var(--accent); color: var(--accent); }

  .layout { display: grid; grid-template-columns: 196px minmax(0, 1fr) 296px; gap: 24px; align-items: start; }

  /* ---- 左侧步骤导航 ---- */
  nav.rail { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 2px; }
  .rail-item {
    display: flex; align-items: center; gap: 10px; text-align: left;
    background: none; border: none; border-left: 2px solid var(--line);
    padding: 9px 12px; cursor: pointer; color: var(--muted); font-size: 13px;
    transition: color .15s, border-color .15s;
  }
  .rail-item .idx { font-family: var(--mono); font-size: 11px; min-width: 14px; }
  .rail-item.active { color: var(--ink); border-left-color: var(--accent); font-weight: 600; }
  .rail-item .done-dot { margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: 0; }
  .rail-item.answered .done-dot { opacity: 1; }

  /* ---- 中间表单 ---- */
  main.content { min-width: 0; }
  .step-head { margin-bottom: 18px; }
  .step-head h2 { font-size: 17px; margin: 0 0 4px; text-wrap: balance; }
  .step-head p { margin: 0; color: var(--muted); font-size: 13px; max-width: 60ch; }
  .field { margin-bottom: 22px; }
  .field > label.f-label { display: block; font-weight: 600; font-size: 13.5px; margin-bottom: 2px; }
  .impact { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  input[type="text"], textarea {
    width: 100%; max-width: 560px; background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px;
    font-family: inherit; font-size: 13.5px;
  }
  textarea { min-height: 64px; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }

  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 8px; max-width: 720px; }
  .opt {
    display: flex; flex-direction: column; gap: 1px; text-align: left;
    background: var(--surface); border: 1px solid var(--line); border-radius: 7px;
    padding: 9px 12px; cursor: pointer; color: var(--ink);
    transition: border-color .12s, background .12s;
  }
  .opt:hover { border-color: var(--accent); }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .opt .o-label { font-size: 13px; font-weight: 550; }
  .opt .o-hint { font-size: 11.5px; color: var(--muted); line-height: 1.45; }
  .opt[aria-pressed="true"] .o-hint { color: var(--accent-ink); opacity: .85; }

  /* ---- 业务图层清单编辑器 ---- */
  .layer-box { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; max-width: 720px; overflow-x: auto; }
  .layer-rows { min-width: 640px; }
  .layer-row { display: grid; grid-template-columns: minmax(130px, 1.4fr) repeat(4, minmax(104px, 1fr)) 26px; gap: 6px; align-items: center; margin-bottom: 6px; }
  .layer-row.layer-head { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .layer-row input[type="text"] { max-width: none; padding: 6px 9px; font-size: 12.5px; }
  select.sel {
    width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--surface); color: var(--ink); font-family: inherit; font-size: 12.5px;
  }
  select.sel:focus { outline: none; border-color: var(--accent); }
  .del-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 2px; }
  .del-btn:hover { color: var(--warn); }
  .add-layer-btn {
    background: none; border: 1px dashed var(--line); color: var(--accent);
    border-radius: 6px; padding: 6px 14px; font-size: 12.5px; cursor: pointer; margin-top: 4px;
  }
  .add-layer-btn:hover { border-color: var(--accent); }
  .agg {
    font-size: 12.5px; color: var(--muted); background: var(--surface-2);
    border-left: 2px solid var(--accent); border-radius: 4px; padding: 7px 11px; max-width: 560px;
  }
  .agg strong { color: var(--ink); font-weight: 600; }

  .step-nav { display: flex; gap: 10px; margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); }
  .btn {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 6px; padding: 7px 18px; font-size: 13px; cursor: pointer;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  :root[data-theme="dark"] .btn.primary, :root:not([data-theme="light"]) .btn.primary { color: #0B1513; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .btn.primary { color: #fff; } }
  :root[data-theme="light"] .btn.primary { color: #fff; }

  /* ---- 方案卡片（步骤5） ---- */
  .plan-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 9px;
    padding: 16px 18px; margin-bottom: 14px;
  }
  .plan-card .dim { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .plan-card h3 { margin: 4px 0 2px; font-size: 15.5px; }
  .plan-card .eng-tag { font-size: 11px; margin-left: 8px; padding: 1px 7px; border-radius: 3px; background: var(--accent-soft); color: var(--accent-ink); font-weight: 500; vertical-align: 2px; }
  .plan-card .reason { color: var(--muted); font-size: 13px; margin: 4px 0 0; max-width: 68ch; }
  .plan-card .risk { margin-top: 10px; font-size: 12.5px; color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 7px 11px; }
  .alts { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .alts .alts-label { font-size: 12px; color: var(--muted); }
  .alt-chip {
    border: 1px dashed var(--line); background: none; color: var(--ink);
    border-radius: 14px; padding: 3px 12px; font-size: 12px; cursor: pointer;
  }
  .alt-chip:hover { border-color: var(--accent); color: var(--accent); }
  .override-note { font-size: 12px; color: var(--warn); margin-top: 8px; }
  table.eng-table { min-width: 680px; }
  table.eng-table td { font-size: 12.5px; }
  .eng-row { cursor: pointer; }
  .eng-row:hover td { background: var(--surface-2); }
  .eng-row.sel td { background: var(--accent-soft); }
  .eng-row.sel td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
  .perf-item { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .perf-item:last-child { border-bottom: none; }
  .perf-item input { margin-top: 4px; accent-color: var(--accent); }
  .perf-item .p-title { font-weight: 550; font-size: 13px; }
  .perf-item .p-detail { color: var(--muted); font-size: 12.5px; }

  /* ---- 成本表（步骤6） ---- */
  .demo-badge { display: inline-block; font-size: 11.5px; padding: 2px 9px; border-radius: 3px; background: var(--warn-soft); color: var(--warn); margin-bottom: 12px; }
  .tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; }
  table.cost { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 13px; }
  table.cost th, table.cost td { padding: 9px 14px; text-align: left; border-bottom: 1px solid var(--line); }
  table.cost th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--surface-2); }
  table.cost td.num, table.cost th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 12.5px; }
  table.cost tr.total td { font-weight: 700; border-bottom: none; }
  .factor-line { display: flex; gap: 8px; align-items: baseline; padding: 5px 0; font-size: 13px; }
  .factor-line.inactive { color: var(--muted); opacity: .55; }
  .factor-line .f-mark { font-family: var(--mono); font-size: 11px; min-width: 44px; }
  .factor-line.active .f-mark { color: var(--accent); }

  /* ---- 导出（步骤7） ---- */
  .export-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
  .export-card { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 14px 18px; }
  .export-card h3 { font-size: 14px; margin: 0 0 8px; }
  .export-card ol { margin: 0; padding-left: 18px; color: var(--muted); font-size: 12.5px; }
  .export-card ol li { margin-bottom: 4px; }
  .p1-note { font-size: 12.5px; color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 8px 12px; margin-bottom: 16px; }
  pre.report {
    background: var(--surface); border: 1px solid var(--line); border-radius: 9px;
    padding: 18px 20px; font-family: var(--mono); font-size: 12px; line-height: 1.7;
    overflow-x: auto; white-space: pre-wrap; max-height: 480px; overflow-y: auto;
  }

  /* ---- 右侧实时面板 ---- */
  aside.panel { position: sticky; top: 20px; }
  .panel-box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .panel-box h2 { font-size: 12px; margin: 0 0 12px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; font-family: var(--mono); }
  .live-row { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .live-row:last-of-type { border-bottom: none; }
  .live-row .l-dim { font-size: 11px; color: var(--muted); }
  .live-row .l-val { font-size: 13.5px; font-weight: 600; }
  .live-row .l-sub { font-size: 12px; color: var(--muted); }
  .warn-box { margin-top: 14px; background: var(--warn-soft); border-radius: 8px; padding: 10px 13px; }
  .warn-box .w-title { font-size: 11px; color: var(--warn); font-family: var(--mono); letter-spacing: .08em; margin-bottom: 6px; }
  .warn-box ul { margin: 0; padding-left: 16px; font-size: 12px; color: var(--warn); }
  .warn-box li { margin-bottom: 3px; }

  @media (max-width: 1060px) {
    .layout { grid-template-columns: 172px minmax(0, 1fr); }
    aside.panel { grid-column: 1 / -1; position: static; }
    .export-cols { grid-template-columns: 1fr; }
  }
  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; }
    nav.rail { position: static; flex-direction: row; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
    .rail-item { border-left: none; border-bottom: 2px solid transparent; padding: 5px 8px; }
    .rail-item.active { border-bottom-color: var(--accent); }
    .rail-item .done-dot { display: none; }
  }
</style>

<div class="app">
  <header class="top">
    <h1>WebGIS 项目评估向导</h1>
    <span class="chip" id="version"></span>

    <span class="spacer"></span>
    <button class="reset-btn" id="resetBtn">重置作答</button>
  </header>
  <div class="layout">
    <nav class="rail" id="rail" aria-label="步骤导航"></nav>
    <main class="content" id="content"></main>
    <aside class="panel">
      <div class="panel-box">
        <h2>实时推荐</h2>
        <div id="livePanel"></div>
        <div id="liveWarnings"></div>
      </div>
    </aside>
  </div>
</div>

  "rules": {
    "engine": {
      "mode": "first-match",
      "rules": [
        {
          "id": "legacy_small",
          "when": {
            "all": [
              {
                "f": "browser",
                "op": "eq",
                "v": "legacy"
              },
              {
                "f": "vector_volume",
                "op": "in",
                "v": [
                  "tiny",
                  "small"
                ]
              }
            ]
          },
          "result": {
            "choice": "leaflet",
            "reason": "旧内核浏览器 WebGL 不可保证，Leaflet 的 Canvas/DOM 渲染兼容性最好，且数据量在其能力范围内",
            "alternatives": [
              {
                "id": "openlayers",
                "note": "同样兼容旧内核，OGC 对接更强"
              }
            ],
            "risks": [
              "数据量后续增长将触及 Leaflet 性能上限，需预留迁移路径"
            ]
          }
        },
        {
          "id": "legacy_big",
          "when": {
            "all": [
              {
                "f": "browser",
                "op": "eq",
                "v": "legacy"
              },
              {
                "f": "vector_volume",
                "op": "in",
                "v": [
                  "medium",
                  "large"
                ]
              }
            ]
          },
          "result": {
            "choice": "openlayers",
            "reason": "旧内核 + 大数据量：OpenLayers Canvas 渲染 + 服务端出图（WMS）兜底是唯一稳妥组合",
            "alternatives": [
              {
                "id": "maplibre",
                "note": "若能推动浏览器升级，体验显著更好"
              }
            ],
            "risks": [
              "强烈建议推动客户升级浏览器内核，否则性能体验受限且开发成本上升"
            ]
          }
        },
        {
          "id": "massive_or_realtime_track",
          "when": {
            "any": [
              {
                "f": "vector_volume",
                "op": "eq",
                "v": "large"
              },
              {
                "f": "realtime_track",
                "op": "eq",
                "v": "yes"
              },
              {
                "all": [
                  {
                    "f": "update_freq",
                    "op": "eq",
                    "v": "realtime"
                  },
                  {
                    "f": "geometry_type",
                    "op": "in",
                    "v": [
                      "point",
                      "line"
                    ]
                  },
                  {
                    "f": "vector_volume",
                    "op": "in",
                    "v": [
                      "small",
                      "medium",
                      "large"
                    ]
                  }
                ]
              }
            ]
          },
          "result": {
            "choice": "maplibre",
            "companion": "deckgl",
            "reason": "百万级要素或实时点/轨迹流，需要 WebGL 批量渲染：MapLibre 承载底图与常规图层，deck.gl 承载大数据动态图层",
            "alternatives": [
              {
                "id": "openlayers",
                "note": "需配 WebGL 渲染扩展，工程复杂度更高"
              }
            ],
            "risks": [
              "deck.gl 学习曲线较陡，团队无经验时工作量上浮"
            ]
          }
        },
        {
          "id": "ogc_stack",
          "when": {
            "any": [
              {
                "f": "vector_sources",
                "op": "has",
                "v": "gis_service"
              },
              {
                "f": "crs",
                "op": "in",
                "v": [
                  "cgcs2000",
                  "mixed"
                ]
              },
              {
                "f": "basemap_source",
                "op": "eq",
                "v": "customer_gis"
              }
            ]
          },
          "result": {
            "choice": "openlayers",
            "reason": "存在存量 GIS 服务或非 Web Mercator 投影（CGCS2000）：OpenLayers 的 OGC 标准与任意投影支持最完整",
            "alternatives": [
              {
                "id": "maplibre",
                "note": "需服务端统一重投影到 Web Mercator，增加数据链路工作"
              }
            ],
            "risks": []
          }
        },
        {
          "id": "cn_sdk_simple",
          "when": {
            "all": [
              {
                "f": "basemap_source",
                "op": "eq",
                "v": "commercial"
              },
              {
                "f": "vector_volume",
                "op": "in",
                "v": [
                  "tiny",
                  "small"
                ]
              },
              {
                "f": "network",
                "op": "eq",
                "v": "internet"
              }
            ]
          },
          "result": {
            "choice": "amap_baidu",
            "reason": "底图选定高德 / 腾讯等商业服务且数据量小：直接用高德 / 百度 JS API 一体化 SDK，底图、POI、地理编码开箱即用，开发最快",
            "alternatives": [
              {
                "id": "maplibre",
                "note": "需要深度样式定制或自有数据为主时"
              }
            ],
            "risks": [
              "坐标锁定 GCJ-02，自有数据叠加需统一转换"
            ]
          }
        },
        {
          "id": "default_maplibre",
          "when": null,
          "result": {
            "choice": "maplibre",
            "reason": "无特殊硬约束时的默认选择：矢量瓦片 + WebGL，交互流畅、样式可定制，移动端与大屏表现最好",
            "alternatives": [
              {
                "id": "openlayers",
                "note": "后续要对接政务 GIS 平台时更稳"
              },
              {
                "id": "leaflet",
                "note": "需求确认极简单时更轻"
              }
            ],
            "risks": []
          }
        }
      ]
    },
    "basemap": {
      "mode": "first-match",
      "rules": [
        {

                "f": "crs",
                "op": "eq",
                "v": "gcj02"

          "when": {
            "all": [

                "f": "vector_volume",

                "f": "update_freq",
                "op": "in",

                  "static",
                  "low"
                ]
              }

          },
          "result": {
            "title": "预切矢量瓦片（静态）",
            "detail": "tippecanoe 预切 → PMTiles / 静态目录托管，CDN 或 Nginx 直出；更新走定时重切",
            "risks": []
          }
        },
        {
          "id": "medium_dynamic",
          "when": {
            "f": "vector_volume",
            "op": "eq",
            "v": "medium"

            "title": "动态矢量瓦片（PostGIS）",
            "detail": "数据入 PostGIS，martin / pg_tileserv 动态切片（ST_AsMVT），瓦片缓存 TTL 按更新频率设定",
            "risks": [
              "动态切片的慢查询需要空间索引与预聚合兜底"

          }
        },
        {
          "id": "large",
          "when": {
            "f": "vector_volume",
            "op": "eq",
            "v": "large"

            "title": "矢量瓦片 + 分级抽稀 + GPU 渲染",
            "detail": "低 zoom 预聚合 / 抽稀（分级 generalization），高 zoom 动态瓦片；点 / 轨迹类图层叠 deck.gl；极端场景服务端出图（WMS）兜底",
            "risks": [
              "数据处理管线（抽稀 / 预聚合）本身是一个独立工作包，成本评估时单列"

          }

        {
          "id": "v_unset",
          "when": null,
          "result": {
            "title": "待定（未填写数据画像）",

            "risks": []
          }
        }
      ]

    "update": {

            "title": "构建期 / 导入期一次处理",

            "f": "update_freq",

            "risks": [
              "实时层要素数需控制在万级以内，超出时先在服务端做空间过滤（只推视野内）"

          }

        {
          "id": "up_unset",
          "when": null,
          "result": {
            "title": "待定（未填写更新频率）",

            "risks": []
          }
        }
      ]

/* ================= 状态 ================= */
const LS_KEY = 'webgis-proto-v01';
let state = { answers: {}, layers: [], engineOverride: null, frameworkOverride: null, basemapOverride: null, basemapTypeOverride: null, crsTransformOverride: null, perfOff: [], step: 0 };
try { const s = localStorage.getItem(LS_KEY); if (s) state = Object.assign(state, JSON.parse(s)); } catch (e) {}
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }

const FORM_STEPS = DATA.steps.length;               // 4 个表单步骤
const STEPS = DATA.steps.map(s => s.title).concat(['方案确认', '成本评估', '导出']);

/* ================= 规则引擎 ================= */
function evalCond(cond, ansObj) {
  const ans = ansObj || state.answers;
  if (cond == null) return true;
  if (cond.all) return cond.all.every(c => evalCond(c, ans));
  if (cond.any) return cond.any.some(c => evalCond(c, ans));
  const a = ans[cond.f];
  switch (cond.op) {
    case 'eq': return a === cond.v;
    case 'in': return cond.v.includes(a);
    case 'has': return Array.isArray(a) && a.includes(cond.v);
    default: return false;
  }
}
function firstMatch(dim, ansObj) {
  for (const r of DATA.rules[dim].rules) if (evalCond(r.when, ansObj)) return r;
  return null;
}
function collect(dim) {
  return DATA.rules[dim].rules.filter(r => evalCond(r.when)).map(r => r.item);
}

/* ================= 业务图层清单 ================= */
const VOL_ORDER = ['tiny', 'small', 'medium', 'large'];
const UPD_ORDER = ['static', 'low', 'high', 'realtime'];
const LAYER_SRC = Object.fromEntries(DATA.layer_config.source_options.map(o => [o.value, o]));
const AGG_FIELDS = ['vector_sources', 'vector_volume', 'geometry_type', 'update_freq'];
function aggregateLayers() {
  if (!state.layers.length) return;
  const a = state.answers;
  a.vector_volume = state.layers.reduce((m, l) => VOL_ORDER.indexOf(l.volume) > VOL_ORDER.indexOf(m) ? l.volume : m, 'tiny');
  a.update_freq = state.layers.reduce((m, l) => UPD_ORDER.indexOf(l.update) > UPD_ORDER.indexOf(m) ? l.update : m, 'static');
  const geos = [...new Set(state.layers.map(l => l.geometry))];
  a.geometry_type = geos.length === 1 ? geos[0] : 'mixed';
  a.vector_sources = [...new Set(state.layers.map(l => LAYER_SRC[l.source].map_to))];
  // 分图层信号：存在 1 万+ 的实时点/线图层时，触发 deck.gl 与 React 推荐（汇总几何为 mixed 时的盲区补偿）
  const rt = state.layers.some(l => l.update === 'realtime' && (l.geometry === 'point' || l.geometry === 'line') && l.volume !== 'tiny');
  if (rt) a.realtime_track = 'yes'; else delete a.realtime_track;
  state.engineOverride = null;
  state.frameworkOverride = null;
  state.crsTransformOverride = null;
}
function layerPseudoAnswers(ly) {
  return { vector_volume: ly.volume, geometry_type: ly.geometry, update_freq: ly.update, vector_sources: [LAYER_SRC[ly.source].map_to] };
}
function derive() {
  const engRule = firstMatch('engine');
  let engineId = engRule.result.choice, overridden = false;
  if (state.engineOverride && state.engineOverride !== engineId) { engineId = state.engineOverride; overridden = true; }
  const btRule = firstMatch('basemap_type');
  let basemapTypeId = btRule.result.choice, btOverridden = false;
  if (state.basemapTypeOverride && state.basemapTypeOverride !== basemapTypeId) { basemapTypeId = state.basemapTypeOverride; btOverridden = true; }
  const fwRule = firstMatch('framework');
  let frameworkId = fwRule.result.choice, fwOverridden = false;
  if (state.frameworkOverride && state.frameworkOverride !== frameworkId) { frameworkId = state.frameworkOverride; fwOverridden = true; }
  const bmRule = firstMatch('basemap');
  let basemapId = bmRule.result.choice, bmOverridden = false;
  if (state.basemapOverride && state.basemapOverride !== basemapId) { basemapId = state.basemapOverride; bmOverridden = true; }

  // 坐标转换：数据坐标系 vs 所选底图原生坐标基准
  const a = state.answers;
  const bmFamily = DATA.crs_config.basemap_family[basemapId];
  const dataFamily = DATA.crs_config.data_family[a.crs];
  const crs = { need: 'unanswered', transformId: null, recId: null, overridden: false, sameLabel: '' };
  if (a.crs) {
    // 数据自身坐标系不明 / 混合时，无论底图为何都要先解决，优先级高于“自建底图统一基准”
    if (dataFamily === 'unknown') { crs.need = 'unknown'; }
    else if (bmFamily === null && dataFamily !== 'mixed') { crs.need = 'none_self'; }
    else if (dataFamily === 'mixed' || dataFamily !== bmFamily) {
      crs.need = 'need';
      const realtime = a.update_freq === 'realtime' || a.update_freq === 'high'
        || (Array.isArray(a.vector_sources) && a.vector_sources.includes('realtime_stream'));
      crs.recId = realtime ? 'service' : 'batch';
      crs.transformId = state.crsTransformOverride || crs.recId;
      crs.overridden = crs.transformId !== crs.recId;
    } else {
      crs.need = 'none';
      crs.sameLabel = DATA.crs_config.family_labels[bmFamily];
    }
  }
  return {
    crs,
    fwRule, frameworkId, fwOverridden,
    engineRule: engRule, engineId, overridden,
    btRule, basemapTypeId, btOverridden,
    bmRule, basemapId, bmOverridden,
    vector: firstMatch('vector'),
    update: firstMatch('update'),
    editing: firstMatch('editing'),
    perf: collect('performance'),
    warnings: collect('warnings'),
  };
}

/* ================= 成本计算 ================= */
function computeCost() {
  const allIds = DATA.cost.roles.map(r => r.id);
  const active = DATA.cost.factors.filter(f => evalCond(f.when));
  const rows = DATA.cost.roles.map(role => {
    let mult = 1, add = 0;
    active.forEach(f => {
      const applies = f.applies === 'all' ? allIds : f.applies;
      if (!applies.includes(role.id)) return;
      if (f.multiplier) mult *= f.multiplier;
      if (f.add_days) add += f.add_days / applies.length;
    });
    const days = Math.round((role.base_days * mult + add) * 2) / 2;
    return { role, days, cost: days * role.day_rate };
  });
  return { rows, active, totalDays: rows.reduce((s, r) => s + r.days, 0), totalCost: rows.reduce((s, r) => s + r.cost, 0) };
}

/* ================= 工具 ================= */
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fieldDef(fieldId) {
  for (const step of DATA.steps) for (const f of step.fields) if (f.id === fieldId) return f;
  return null;
}
function optLabel(fieldId, value) {
  for (const step of DATA.steps) for (const f of step.fields) if (f.id === fieldId) {
    const o = (f.options || []).find(o => o.value === value);
    return o ? o.label : value;
  }
  return value;
}
function stepAnswered(i) {
  if (i >= FORM_STEPS) return true;
  return DATA.steps[i].fields.some(f => {
    const a = state.answers[f.id];
    return Array.isArray(a) ? a.length > 0 : (a != null && a !== '');
  });
}

    row.appendChild(mkSel(DATA.layer_config.source_options, ly.source, upd('source')));
    row.appendChild(mkSel(fieldDef('geometry_type').options, ly.geometry, upd('geometry')));
    row.appendChild(mkSel(fieldDef('vector_volume').options, ly.volume, upd('volume')));

  add.addEventListener('click', () => {
    state.layers.push({ name: '', source: 'api_geojson', geometry: 'point', volume: 'tiny', update: 'static' });

  box.appendChild(add);
  return card;
}

function renderFormStep(stepDef) {
  const wrap = el(`<div><div class="step-head"><h2>${esc(stepDef.title)}</h2><p>${esc(stepDef.desc)}</p></div></div>`);
  if (stepDef.id === 'data') wrap.appendChild(renderLayerEditor());
  stepDef.fields.forEach(f => {

    if (stepDef.id === 'data' && state.layers.length && AGG_FIELDS.includes(f.id)) {
      const v = state.answers[f.id];
      const label = Array.isArray(v) ? v.map(x => optLabel(f.id, x)).join('、') : optLabel(f.id, v);
      field.appendChild(el(`<div class="agg">由图层清单自动汇总：<strong>${esc(label)}</strong></div>`));
      wrap.appendChild(field);
      return;
    }
    if (f.type === 'text' || f.type === 'textarea') {
      const input = el(f.type === 'text'
        ? `<input type="text" placeholder="${esc(f.placeholder || '')}">`
        : `<textarea placeholder="${esc(f.placeholder || '')}"></textarea>`);
      input.value = state.answers[f.id] || '';
      input.addEventListener('input', () => { state.answers[f.id] = input.value; save(); renderRail(); renderPanel(); });
      field.appendChild(input);
    } else {
      const opts = el('<div class="opts"></div>');
      f.options.forEach(o => {
        const cur = state.answers[f.id];
        const pressed = f.type === 'multi' ? Array.isArray(cur) && cur.includes(o.value) : cur === o.value;
        const b = el(`<button class="opt" aria-pressed="${pressed}">
          <span class="o-label">${esc(o.label)}</span>${o.hint ? `<span class="o-hint">${esc(o.hint)}</span>` : ''}</button>`);
        b.addEventListener('click', () => {
          if (f.type === 'multi') {
            let arr = Array.isArray(state.answers[f.id]) ? state.answers[f.id].slice() : [];
            if (arr.includes(o.value)) arr = arr.filter(v => v !== o.value);
            else {
              // “无 / 无特殊要求” 与其它选项互斥
              if (o.value === 'none') arr = ['none'];
              else { arr = arr.filter(v => v !== 'none'); arr.push(o.value); }
            }
            state.answers[f.id] = arr;
          } else {
            state.answers[f.id] = state.answers[f.id] === o.value ? undefined : o.value;
          }
          // 关键约束变化时清除手动覆盖
          if (f.id === 'browser' || f.id === 'vector_volume') state.engineOverride = null;
          if (['web_framework', 'vector_volume', 'update_freq', 'geometry_type', 'delivery'].includes(f.id)) state.frameworkOverride = null;
          if (['browser', 'basemap_source', 'basemap_style', 'network', 'terminals'].includes(f.id)) state.basemapTypeOverride = null;
          if (['basemap_source', 'network', 'compliance', 'industry', 'crs'].includes(f.id)) state.basemapOverride = null;
          if (['crs', 'update_freq', 'vector_sources', 'basemap_source', 'network', 'compliance', 'industry'].includes(f.id)) state.crsTransformOverride = null;
          save(); render();
        });
        opts.appendChild(b);
      });
      field.appendChild(opts);
    }
    wrap.appendChild(field);
  });
  return wrap;
}

    <tbody></tbody></table></div>`);

  Object.entries(DATA.basemap_providers).forEach(([id, p]) => {
    const isSel = id === d.basemapId;
    const tr = el(`<tr class="eng-row ${isSel ? 'sel' : ''}" tabindex="0" role="button" aria-pressed="${isSel}">
      <td style="white-space:nowrap"><strong>${esc(p.name)}</strong>${id === bmRecId ? ' <span class="eng-tag">推荐</span>' : ''}</td>
      ${p.matrix.map(v => '<td>' + esc(v) + '</td>').join('')}</tr>`);
    const pick = () => { state.basemapOverride = id === bmRecId ? null : id; state.crsTransformOverride = null; save(); render(); };
    tr.addEventListener('click', pick);
    tr.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pick(); } });
    bmBody.appendChild(tr);
  });
  bmCard.appendChild(bmTbl);
  wrap.appendChild(bmCard);

  // 底图类型：可点选的对比矩阵
  const bt = DATA.basemap_types[d.basemapTypeId];
  const btRecId = d.btRule.result.choice;
  const btConflict = d.basemapTypeId === 'vector' && ans.browser === 'legacy'
    ? '旧内核浏览器无 WebGL，矢量瓦片底图无法渲染' : null;
  const btCard = el(`<div class="plan-card">
    <div class="dim">底图类型（点击表格行切换）</div>
    <h3>${esc(bt.name)}</h3>
    <p class="reason">${d.btOverridden ? esc(bt.desc) : esc(d.btRule.result.reason)}</p>
    ${d.btOverridden ? '<div class="override-note">⚠ 已手动选择，非系统推荐（推荐：' + esc(DATA.basemap_types[btRecId].name) + '，点击其表格行可恢复）</div>' : ''}
    ${btConflict ? '<div class="risk"><strong>约束冲突</strong> — ' + esc(btConflict) + '</div>' : ''}
    ${bt.risks.length ? '<div class="risk">' + bt.risks.map(esc).join('；') + '</div>' : ''}
  </div>`);
  const btTbl = el(`<div class="tbl-wrap" style="margin-top:12px"><table class="cost eng-table" style="min-width:560px">
    <thead><tr><th>底图类型</th>${DATA.basemap_type_matrix_columns.map(c => '<th>' + esc(c) + '</th>').join('')}</tr></thead>
    <tbody></tbody></table></div>`);
  const btBody = btTbl.querySelector('tbody');
  Object.entries(DATA.basemap_types).forEach(([id, t]) => {
    const isSel = id === d.basemapTypeId;
    const tr = el(`<tr class="eng-row ${isSel ? 'sel' : ''}" tabindex="0" role="button" aria-pressed="${isSel}">
      <td><strong>${esc(t.name)}</strong>${id === btRecId ? ' <span class="eng-tag">推荐</span>' : ''}</td>
      ${t.matrix.map(v => '<td>' + esc(v) + '</td>').join('')}</tr>`);
    const pick = () => { state.basemapTypeOverride = id === btRecId ? null : id; save(); render(); };
    tr.addEventListener('click', pick);
    tr.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pick(); } });
    btBody.appendChild(tr);
  });
  btCard.appendChild(btTbl);
  wrap.appendChild(btCard);

  // 坐标转换：底图与数据坐标基准不一致时才需要选择方案
  if (d.crs.need !== 'unanswered') {
    if (d.crs.need === 'need') {
      const ct = DATA.crs_transforms[d.crs.transformId];
      const ctCard = el(`<div class="plan-card">
        <div class="dim">坐标转换方案（点击表格行切换）</div>
        <h3>${esc(ct.name)}<span class="eng-tag">${esc(ct.tag)}</span></h3>
        <p class="reason">数据坐标系（${esc(optLabel('crs', ans.crs))}）与所选底图（${esc(bm.name)}）基准不一致，必须统一转换。${esc(ct.desc)}</p>
        ${d.crs.overridden ? '<div class="override-note">⚠ 已手动选择，非系统推荐（推荐：' + esc(DATA.crs_transforms[d.crs.recId].name) + '，点击其表格行可恢复）</div>' : ''}
        ${ct.risks.length ? '<div class="risk">' + ct.risks.map(esc).join('；') + '</div>' : ''}
      </div>`);
      const ctTbl = el(`<div class="tbl-wrap" style="margin-top:12px"><table class="cost eng-table" style="min-width:640px">
        <thead><tr><th>转换方案</th>${DATA.crs_transform_matrix_columns.map(c => '<th>' + esc(c) + '</th>').join('')}</tr></thead>
        <tbody></tbody></table></div>`);
      const ctBody = ctTbl.querySelector('tbody');
      Object.entries(DATA.crs_transforms).forEach(([id, t]) => {
        const isSel = id === d.crs.transformId;
        const tr = el(`<tr class="eng-row ${isSel ? 'sel' : ''}" tabindex="0" role="button" aria-pressed="${isSel}">
          <td style="white-space:nowrap"><strong>${esc(t.name)}</strong>${id === d.crs.recId ? ' <span class="eng-tag">推荐</span>' : ''}</td>
          ${t.matrix.map(v => '<td>' + esc(v) + '</td>').join('')}</tr>`);
        const pick = () => { state.crsTransformOverride = id === d.crs.recId ? null : id; save(); render(); };
        tr.addEventListener('click', pick);
        tr.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pick(); } });
        ctBody.appendChild(tr);
      });
      ctCard.appendChild(ctTbl);
      wrap.appendChild(ctCard);
    } else {
      const msg = d.crs.need === 'none'
        ? '无需坐标转换 — 数据与底图坐标基准一致（' + d.crs.sameLabel + '），直接叠加'
        : d.crs.need === 'none_self'
          ? '无需独立转换 — 自建 / 客户平台底图，与业务数据统一坐标基准即可'
          : '坐标系未确认，转换方案待定 — 进场后先用样例数据确认坐标系再定';
      wrap.appendChild(el(`<div class="plan-card">
        <div class="dim">坐标转换</div><h3>${d.crs.need === 'unknown' ? '待确认' : '无需转换'}</h3>
        <p class="reason">${esc(msg)}</p></div>`));
    }
  }

  // 矢量渲染（汇总）+ 分图层策略
  renderResultCards(wrap, [['矢量渲染', d.vector]]);
  if (state.layers.length) {
    const lyCard = el(`<div class="plan-card"><div class="dim">分图层策略（按图层清单逐层推导）</div></div>`);
    const lyTbl = el(`<div class="tbl-wrap" style="margin-top:8px"><table class="cost" style="min-width:680px">
      <thead><tr><th>图层</th><th>数据来源</th><th>渲染方案</th><th>更新方式</th></tr></thead><tbody></tbody></table></div>`);
    const lyBody = lyTbl.querySelector('tbody');
    state.layers.forEach((ly, i) => {
      const pa = layerPseudoAnswers(ly);
      const v = firstMatch('vector', pa), u = firstMatch('update', pa);
      lyBody.appendChild(el(`<tr>
        <td style="white-space:nowrap"><strong>${esc(ly.name || '图层 ' + (i + 1))}</strong></td>
        <td style="white-space:nowrap">${esc(LAYER_SRC[ly.source].label)}</td>
        <td>${esc(v.result.title)}</td><td>${esc(u.result.title)}</td></tr>`));
    });
    lyCard.appendChild(lyTbl);
    wrap.appendChild(lyCard);
  }

  // 更新 / 编辑
  renderResultCards(wrap, [['图层更新', d.update], ['绘制编辑', d.editing]]);
  function renderResultCards(parent, pairs) {
    pairs.forEach(([dim, rule]) => {
      if (!rule || !rule.result) return;
      const r = rule.result;
      parent.appendChild(el(`<div class="plan-card">
        <div class="dim">${esc(dim)}</div><h3>${esc(r.title)}</h3>
        <p class="reason">${esc(r.detail)}</p>
        ${r.risks && r.risks.length ? '<div class="risk">' + r.risks.map(esc).join('；') + '</div>' : ''}
      </div>`));
    });
  }

  // 性能方案清单
  const perfCard = el(`<div class="plan-card"><div class="dim">性能方案（可勾选取舍）</div></div>`);
  if (d.perf.length === 0) perfCard.appendChild(el('<p class="reason">当前约束未触发额外性能项</p>'));
  d.perf.forEach(item => {
    const off = state.perfOff.includes(item.title);
    const row = el(`<label class="perf-item"><input type="checkbox" ${off ? '' : 'checked'}>
      <span><span class="p-title">${esc(item.title)}</span><br><span class="p-detail">${esc(item.detail)}</span></span></label>`);
    row.querySelector('input').addEventListener('change', ev => {
      if (ev.target.checked) state.perfOff = state.perfOff.filter(t => t !== item.title);
      else state.perfOff.push(item.title);
      save(); renderPanel();
    });
    perfCard.appendChild(row);
  });
  wrap.appendChild(perfCard);

  // 风险
  if (d.warnings.length) {
    const wCard = el(`<div class="plan-card"><div class="dim">风险提示</div></div>`);
    d.warnings.forEach(w => wCard.appendChild(el(`<div class="risk" style="margin-top:8px"><strong>${esc(w.title)}</strong> — ${esc(w.detail)}</div>`)));
    wrap.appendChild(wCard);
  }
  return wrap;
}

/* ================= 渲染：步骤6 成本 ================= */
function renderCostStep() {
  const { rows, active, totalDays, totalCost } = computeCost();
  const wrap = el(`<div><div class="step-head"><h2>成本评估</h2>
    <p>基准人天 × 复杂度因子。因子由前四步作答自动触发。</p></div>
    <span class="demo-badge">Demo 样例数据 — ${esc(DATA.cost.note)}</span></div>`);

  const factorCard = el('<div class="plan-card"><div class="dim">复杂度因子</div></div>');
  DATA.cost.factors.forEach(f => {
    const on = active.includes(f);
    const effect = f.multiplier ? '×' + f.multiplier : '+' + f.add_days + '天';
    factorCard.appendChild(el(`<div class="factor-line ${on ? 'active' : 'inactive'}">
      <span class="f-mark">${on ? '● ' + effect : '○ ' + effect}</span><span>${esc(f.label)}</span></div>`));
  });
  wrap.appendChild(factorCard);

  const tbl = el(`<div class="tbl-wrap"><table class="cost">
    <thead><tr><th>角色</th><th class="num">基准人天</th><th class="num">调整后人天</th><th class="num">单价（元/天）</th><th class="num">小计（元）</th></tr></thead>
    <tbody></tbody></table></div>`);
  const tbody = tbl.querySelector('tbody');
  rows.forEach(r => tbody.appendChild(el(`<tr><td>${esc(r.role.name)}</td>
    <td class="num">${r.role.base_days}</td><td class="num">${r.days}</td>
    <td class="num">${r.role.day_rate.toLocaleString()}</td><td class="num">${r.cost.toLocaleString()}</td></tr>`)));
  tbody.appendChild(el(`<tr class="total"><td>合计</td><td class="num"></td>
    <td class="num">${totalDays}</td><td class="num"></td><td class="num">${totalCost.toLocaleString()}</td></tr>`));
  wrap.appendChild(tbl);
  return wrap;
}

/* ================= 渲染：步骤7 导出 ================= */
function buildReport(d) {
  const a = state.answers;
  const { rows, active, totalDays, totalCost } = computeCost();
  const lines = [];
  lines.push('# WebGIS 技术框架需求报告');
  lines.push('');
  lines.push('> ' + DATA.meta.scope_note + ' · 原型 ' + DATA.meta.version);
  lines.push('');
  lines.push('## 1. 项目概述');
  lines.push('- 项目名称：' + (a.project_name || '（未填写）'));
  lines.push('- 项目描述：' + (a.project_desc || '（未填写）'));
  lines.push('');
  lines.push('## 2. 约束清单');
  DATA.steps.forEach(s => s.fields.forEach(f => {
    if (f.type === 'text' || f.type === 'textarea') return;
    const v = a[f.id];
    if (v == null || (Array.isArray(v) && !v.length)) return;
    const label = Array.isArray(v) ? v.map(x => optLabel(f.id, x)).join('、') : optLabel(f.id, v);
    lines.push('- ' + f.label + '：' + label);
  }));
  lines.push('');
  if (state.layers.length) {
    lines.push('## 2.1 业务图层清单与分层策略');
    lines.push('| 图层 | 数据来源 | 几何 | 量级 | 更新频率 | 渲染方案 | 更新方式 |');
    lines.push('| --- | --- | --- | --- | --- | --- | --- |');
    state.layers.forEach((ly, i) => {
      const pa = layerPseudoAnswers(ly);
      const v = firstMatch('vector', pa), u = firstMatch('update', pa);
      lines.push('| ' + (ly.name || '图层 ' + (i + 1)) + ' | ' + LAYER_SRC[ly.source].label
        + ' | ' + optLabel('geometry_type', ly.geometry) + ' | ' + optLabel('vector_volume', ly.volume)
        + ' | ' + optLabel('update_freq', ly.update) + ' | ' + v.result.title + ' | ' + u.result.title + ' |');
    });
    lines.push('');
  }
  lines.push('## 3. 技术选型结论');
  const eng = DATA.engines[d.engineId];
  const comp = d.engineRule.result.companion && !d.overridden ? DATA.engines[d.engineRule.result.companion] : null;
  lines.push('### 渲染引擎：' + eng.name + (comp ? ' + ' + comp.name : '') + (d.overridden ? '（手动选择，非系统推荐）' : ''));
  lines.push(d.overridden ? eng.desc : d.engineRule.result.reason);
  const engRisks = d.overridden ? (eng.risks || []) : d.engineRule.result.risks;
  engRisks.forEach(r => lines.push('- ⚠ ' + r));
  const fw = DATA.frameworks[d.frameworkId];
  const engBindings = DATA.engines[d.engineId].bindings || {};
  const bindText = engBindings[d.frameworkId] || fw.bind_fallback || '封装引擎原生 API';
  lines.push('### Web 技术底座：' + fw.name + (d.fwOverridden ? '（手动选择，非系统推荐）' : ''));
  lines.push(d.fwOverridden ? fw.desc : d.fwRule.result.reason);
  lines.push('与 ' + DATA.engines[d.engineId].name + ' 的集成方式：' + (bindText || '封装引擎原生 API'));
  fw.risks.forEach(r => lines.push('- ⚠ ' + r));
  const bm = DATA.basemap_providers[d.basemapId];
  lines.push('### 底图方案：' + bm.name + (d.bmOverridden ? '（手动选择，非系统推荐）' : ''));
  lines.push(d.bmOverridden ? bm.desc : d.bmRule.result.reason);
  bm.risks.forEach(r => lines.push('- ⚠ ' + r));
  const bt = DATA.basemap_types[d.basemapTypeId];
  lines.push('### 底图类型：' + bt.name + (d.btOverridden ? '（手动选择，非系统推荐）' : ''));
  lines.push(d.btOverridden ? bt.desc : d.btRule.result.reason);
  bt.risks.forEach(r => lines.push('- ⚠ ' + r));
  if (d.crs.need === 'need') {
    const ct = DATA.crs_transforms[d.crs.transformId];
    lines.push('### 坐标转换：' + ct.name + (d.crs.overridden ? '（手动选择，非系统推荐）' : ''));
    lines.push('数据坐标系（' + optLabel('crs', a.crs) + '）与底图（' + bm.name + '）基准不一致：' + ct.desc);
    ct.risks.forEach(r => lines.push('- ⚠ ' + r));
  } else if (d.crs.need === 'none') {
    lines.push('### 坐标转换：无需');
    lines.push('数据与底图坐标基准一致（' + d.crs.sameLabel + '），直接叠加。');
  } else if (d.crs.need === 'none_self') {
    lines.push('### 坐标转换：无需独立转换');
    lines.push('自建 / 客户平台底图，与业务数据统一坐标基准即可。');
  } else if (d.crs.need === 'unknown') {
    lines.push('### 坐标转换：待确认');
    lines.push('坐标系未确认，进场后先用样例数据确认坐标系再定转换方案。');
  }
  [['矢量渲染', d.vector], ['图层更新', d.update], ['绘制编辑', d.editing]].forEach(([dim, rule]) => {
    if (!rule || !rule.result) return;
    lines.push('### ' + dim + '：' + rule.result.title);
    lines.push(rule.result.detail);
  });
  lines.push('');
  lines.push('## 4. 性能方案');
  const perfOn = d.perf.filter(p => !state.perfOff.includes(p.title));
  if (!perfOn.length) lines.push('（当前约束未触发额外性能项）');
  perfOn.forEach(p => lines.push('- **' + p.title + '**：' + p.detail));
  lines.push('');
  lines.push('## 5. 风险提示');
  if (!d.warnings.length) lines.push('（无）');
  d.warnings.forEach(w => lines.push('- **' + w.title + '**：' + w.detail));
  lines.push('');
  lines.push('## 6. 成本评估（Demo 样例）');
  lines.push('| 角色 | 基准人天 | 调整后 | 单价 | 小计 |');
  lines.push('| --- | ---: | ---: | ---: | ---: |');
  rows.forEach(r => lines.push('| ' + r.role.name + ' | ' + r.role.base_days + ' | ' + r.days + ' | ' + r.role.day_rate + ' | ' + r.cost.toLocaleString() + ' |'));
  lines.push('| **合计** | | **' + totalDays + '** | | **' + totalCost.toLocaleString() + '** |');
  lines.push('');
  lines.push('适用因子：' + (active.length ? active.map(f => f.label).join('、') : '无'));
  lines.push('');
  lines.push('## 7. AI 上下文包（导出内容）');
  DATA.export.context_pack.forEach(c => lines.push('- ' + c));
  lines.push('');
  lines.push('> ' + DATA.export.p1_note);
  return lines.join('\n');
}
function renderExportStep(d) {
  const wrap = el(`<div><div class="step-head"><h2>导出</h2>
    <p>生成技术框架需求报告与 AI 上下文包。框架代码直接生成为 P1 里程碑。</p></div></div>`);
  wrap.appendChild(el(`<div class="p1-note">${esc(DATA.export.p1_note)}</div>`));
  const cols = el('<div class="export-cols"></div>');
  const c1 = el('<div class="export-card"><h3>报告章节</h3><ol></ol></div>');
  DATA.export.report_sections.forEach(s => c1.querySelector('ol').appendChild(el('<li>' + esc(s) + '</li>')));
  const c2 = el('<div class="export-card"><h3>AI 上下文包内容</h3><ol></ol></div>');
  DATA.export.context_pack.forEach(s => c2.querySelector('ol').appendChild(el('<li>' + esc(s) + '</li>')));
  cols.appendChild(c1); cols.appendChild(c2);
  wrap.appendChild(cols);

  const copyBtn = el('<button class="btn primary" style="margin-bottom:12px">复制报告 Markdown</button>');
  const pre = el('<pre class="report"></pre>');
  const report = buildReport(d);
  pre.textContent = report;
  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(report).then(
      () => { copyBtn.textContent = '已复制 ✓'; setTimeout(() => copyBtn.textContent = '复制报告 Markdown', 1600); },
      () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    );
  });
  wrap.appendChild(copyBtn);
  wrap.appendChild(pre);
  return wrap;
}

/* ================= 渲染：右侧实时面板 ================= */
function renderPanel() {
  const d = derive();
  const eng = DATA.engines[d.engineId];
  const comp = d.engineRule.result.companion && !d.overridden ? DATA.engines[d.engineRule.result.companion] : null;
  const perfOn = d.perf.filter(p => !state.perfOff.includes(p.title));
  const live = document.getElementById('livePanel');
  live.innerHTML = '';
  const rowsDef = [
    ['渲染引擎', eng.name + (comp ? ' + ' + comp.name : '') + (d.overridden ? '（手动）' : ''), eng.tag],
    ['Web 底座', DATA.frameworks[d.frameworkId].name + (d.fwOverridden ? '（手动）' : ''), ''],
    ['底图方案', DATA.basemap_providers[d.basemapId].name + (d.bmOverridden ? '（手动）' : ''), ''],
    ['底图类型', DATA.basemap_types[d.basemapTypeId].name + (d.btOverridden ? '（手动）' : ''), ''],
    ['坐标转换', d.crs.need === 'need' ? DATA.crs_transforms[d.crs.transformId].name + (d.crs.overridden ? '（手动）' : '')
      : d.crs.need === 'unknown' ? '待确认坐标系' : d.crs.need === 'unanswered' ? '—' : '无需转换', ''],
    ['矢量渲染', d.vector && d.vector.result ? d.vector.result.title : '—', ''],
    ['图层更新', d.update && d.update.result ? d.update.result.title : '—', ''],
    ['绘制编辑', d.editing && d.editing.result ? d.editing.result.title : '无', ''],
    ['性能方案', perfOn.length + ' 项已启用', ''],
  ];
  rowsDef.forEach(([dim, val, sub]) => live.appendChild(el(
    `<div class="live-row"><div class="l-dim">${esc(dim)}</div><div class="l-val">${esc(val)}</div>${sub ? `<div class="l-sub">${esc(sub)}</div>` : ''}</div>`)));
  const lw = document.getElementById('liveWarnings');
  lw.innerHTML = '';
  if (d.warnings.length) {
    const box = el('<div class="warn-box"><div class="w-title">RISK · ' + d.warnings.length + '</div><ul></ul></div>');
    d.warnings.forEach(w => box.querySelector('ul').appendChild(el('<li>' + esc(w.title) + '</li>')));
    lw.appendChild(box);
  }
}

/* ================= 主渲染 ================= */
function render() {
  renderRail();
  const content = document.getElementById('content');
  content.innerHTML = '';
  const d = derive();
  if (state.step < FORM_STEPS) content.appendChild(renderFormStep(DATA.steps[state.step]));
  else if (state.step === FORM_STEPS) content.appendChild(renderPlanStep(d));
  else if (state.step === FORM_STEPS + 1) content.appendChild(renderCostStep());
  else content.appendChild(renderExportStep(d));

  const nav = el('<div class="step-nav"></div>');
  if (state.step > 0) {
    const prev = el('<button class="btn">上一步</button>');
    prev.addEventListener('click', () => { state.step--; save(); render(); window.scrollTo(0, 0); });
    nav.appendChild(prev);
  }
  if (state.step < STEPS.length - 1) {
    const next = el(`<button class="btn primary">${state.step === FORM_STEPS - 1 ? '生成方案' : '下一步'}</button>`);
    next.addEventListener('click', () => { state.step++; save(); render(); window.scrollTo(0, 0); });
    nav.appendChild(next);
  }
  content.appendChild(nav);
  renderPanel();
}

document.getElementById('version').textContent = DATA.meta.version;
document.getElementById('scope').textContent = DATA.meta.scope_note;
document.getElementById('resetBtn').addEventListener('click', () => {
  state = { answers: {}, layers: [], engineOverride: null, frameworkOverride: null, basemapOverride: null, basemapTypeOverride: null, crsTransformOverride: null, perfOff: [], step: 0 };
  save(); render();
});
render();
</script>
