<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>王者荣耀英雄攻略</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header class="header">
    <div class="container header-content">
      <div class="logo">
        <div class="logo-icon">⚔️</div>
        <div class="logo-text">王者攻略</div>
      </div>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="搜索英雄名称..." />
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
      </div>
      <nav class="nav-links">
        <a href="#">首页</a>
        <a href="#">英雄</a>
        <a href="#">攻略</a>
        <a href="#">关于</a>
      </nav>
    </div>
  </header>

  <main class="hero-section">
    <div class="container">
      <h2 class="section-title">英雄列表</h2>
      
      <div class="role-filters">
        <button class="role-btn active" data-role="全部">全部 <span class="role-count">12</span></button>
        <button class="role-btn" data-role="战士">战士 <span class="role-count">3</span></button>
        <button class="role-btn" data-role="法师">法师 <span class="role-count">3</span></button>
        <button class="role-btn" data-role="坦克">坦克 <span class="role-count">3</span></button>
        <button class="role-btn" data-role="刺客">刺客 <span class="role-count">3</span></button>
        <button class="role-btn" data-role="射手">射手 <span class="role-count">3</span></button>
        <button class="role-btn" data-role="辅助">辅助 <span class="role-count">3</span></button>
      </div>

      <div id="hero-grid" class="hero-grid"></div>
    </div>
  </main>

  <div id="hero-modal" class="modal-overlay">
    <div id="modal-content" class="modal-content"></div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>王者荣耀英雄攻略网站 | 数据仅供参考</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
