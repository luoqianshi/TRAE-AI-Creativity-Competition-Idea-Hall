* { margin: 0; padding: 0; box-sizing: border-box; }
:root {

  --success: #0d9488; --warning: #f59e0b; --danger: #ef4444;

  --text: #1e293b; --text-secondary: #64748b; --border: #e2e8f0;
  --shadow: 0 1px 3px rgba(0,0,0,.08); --radius: 8px;
}
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

.sidebar-logo { padding: 20px; border-bottom: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 10px; }
.sidebar-logo .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--primary), #4f46e5); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; }
.sidebar-logo h1 { font-size: 15px; font-weight: 600; color: #fff; line-height: 1.3; }
.sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
.sidebar-nav .nav-group { margin-bottom: 4px; }
.sidebar-nav .nav-group-title { padding: 12px 20px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #64748b; }
.sidebar-nav .nav-item { padding: 10px 20px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; transition: all .15s; border-left: 3px solid transparent; }
.sidebar-nav .nav-item:hover { background: rgba(255,255,255,.05); color: #e2e8f0; }
.sidebar-nav .nav-item.active { background: rgba(26,115,232,.2); color: #fff; border-left-color: var(--primary); }
.sidebar-nav .nav-item .nav-icon { width: 20px; text-align: center; font-size: 16px; }
.sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,.08); font-size: 12px; color: #64748b; }
.main { flex: 1; margin-left: 240px; padding: 0; }
.header { background: var(--card-bg); padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); box-shadow: var(--shadow); }
.header-left h2 { font-size: 18px; font-weight: 600; }
.header-right { display: flex; align-items: center; gap: 16px; }
.header-right .user-info { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.header-right .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
.content { padding: 24px 28px; }
.page { display: none; }
.page.active { display: block; }

/* Cards */
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.stat-card { background: var(--card-bg); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px; }
.stat-card .stat-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
.stat-card .stat-icon.blue { background: #e8f0fe; color: var(--primary); }
.stat-card .stat-icon.green { background: #e6f7f5; color: var(--success); }
.stat-card .stat-icon.orange { background: #fef3e2; color: var(--warning); }
.stat-card .stat-icon.red { background: #fde8e8; color: var(--danger); }
.stat-card .stat-info .stat-value { font-size: 24px; font-weight: 700; }
.stat-card .stat-info .stat-label { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

.chart-row { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 20px; }
.chart-row.equal { grid-template-columns: 1fr 1fr; }
.chart-row.three { grid-template-columns: repeat(3, 1fr); }
.card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
.card-body { padding: 20px; }
.card-body.no-padding { padding: 0; }

/* Tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
table th { background: #f8fafc; padding: 10px 14px; text-align: left; font-weight: 600; color: var(--text-secondary); border-bottom: 2px solid var(--border); white-space: nowrap; }
table td { padding: 10px 14px; border-bottom: 1px solid var(--border); }
table tr:hover td { background: #f8fafc; }

/* Badges */
.badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
.badge-success { background: #e6f7f5; color: #0d9488; }
.badge-warning { background: #fef3e2; color: #d97706; }
.badge-danger { background: #fde8e8; color: #dc2626; }
.badge-info { background: #e8f0fe; color: #1a73e8; }
.badge-gray { background: #f1f5f9; color: #64748b; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: all .15s; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-outline { background: #fff; border-color: var(--border); color: var(--text); }
.btn-outline:hover { background: #f8fafc; }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-success { background: var(--success); color: #fff; }

/* Forms */
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; color: var(--text); }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; }
.form-group textarea { resize: vertical; min-height: 80px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* Modal */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.4); z-index: 1000; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: 12px; width: 90%; max-width: 700px; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.15); }
.modal-lg { max-width: 900px; }
.modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; font-size: 16px; font-weight: 600; }
.modal-header .close-btn { cursor: pointer; font-size: 20px; color: var(--text-secondary); }
.modal-body { padding: 20px; }
.modal-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }

/* Alerts */
.alert { padding: 12px 16px; border-radius: 6px; font-size: 13px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.alert-warning { background: #fef3e2; color: #92400e; border: 1px solid #fcd34d; }
.alert-danger { background: #fde8e8; color: #991b1b; border: 1px solid #fca5a5; }
.alert-info { background: #e8f0fe; color: #1e40af; border: 1px solid #93c5fd; }
.alert-success { background: #e6f7f5; color: #065f46; border: 1px solid #6ee7b7; }

/* Search bar */
.search-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.search-bar input, .search-bar select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
.search-bar input { flex: 1; min-width: 200px; }

/* Tabs */
.tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
.tab { padding: 10px 20px; font-size: 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; color: var(--text-secondary); transition: all .15s; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

/* Timeline */
.timeline { position: relative; padding-left: 24px; }
.timeline::before { content: ''; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: var(--border); }
.timeline-item { position: relative; padding-bottom: 20px; }
.timeline-item::before { content: ''; position: absolute; left: -20px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
.timeline-item .time { font-size: 12px; color: var(--text-secondary); }
.timeline-item .desc { font-size: 14px; margin-top: 2px; }

/* Risk panel */
.risk-list { list-style: none; }
.risk-list li { padding: 12px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 10px; font-size: 13px; }
.risk-list li .risk-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
.risk-list li .risk-dot.high { background: var(--danger); }
.risk-list li .risk-dot.medium { background: var(--warning); }
.risk-list li .risk-dot.low { background: var(--success); }

/* AI check */
.ai-check-result { background: #f8fafc; border-radius: 8px; padding: 16px; margin-top: 16px; }
.conflict-item { padding: 12px; background: #fff; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; }
.conflict-item .conflict-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.conflict-item .conflict-body { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }

/* Progress */
.progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-bar .fill { height: 100%; border-radius: 3px; }
.progress-bar .fill.green { background: var(--success); }
.progress-bar .fill.blue { background: var(--primary); }
.progress-bar .fill.orange { background: var(--warning); }

/* Quick actions */
.quick-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.quick-action { background: var(--card-bg); border-radius: var(--radius); padding: 16px; text-align: center; cursor: pointer; box-shadow: var(--shadow); transition: all .15s; }
.quick-action:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
.quick-action .qa-icon { font-size: 28px; margin-bottom: 8px; }
.quick-action .qa-label { font-size: 13px; font-weight: 500; }

/* Responsive */
@media (max-width: 1200px) { .stats-row { grid-template-columns: repeat(2, 1fr); } .chart-row { grid-template-columns: 1fr; } }
@media (max-width: 768px) { .sidebar { width: 60px; } .sidebar-logo h1, .nav-group-title, .nav-item span:not(.nav-icon) { display: none; } .main { margin-left: 60px; } .stats-row { grid-template-columns: 1fr; } }
</style>
</head>

document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    const page = item.dataset.page;
    document.getElementById('pageTitle').textContent = pageTitles[page];
    renderPage(page);
  });
});

// ============ PAGE RENDERERS ============
function renderPage(page) {
  const c = document.getElementById('mainContent');
  switch(page) {
    case 'dashboard': renderDashboard(c); break;
    case 'library': renderLibrary(c); break;
    case 'lifecycle': renderLifecycle(c); break;
    case 'ai-check': renderAICheck(c); break;
    case 'signoff': renderSignoff(c); break;
    case 'risk': renderRisk(c); break;
    case 'admin': renderAdmin(c); break;
  }
}

function filterRegulations() {
  const search = (document.getElementById('libSearch')?.value || '').toLowerCase();
  const cat = document.getElementById('libCategory')?.value || '';
  const status = document.getElementById('libStatus')?.value || '';
  const filtered = store.regulations.filter(r => {
    return (!search || r.title.toLowerCase().includes(search) || r.id.toLowerCase().includes(search) || r.tags.some(t => t.includes(search)))
      && (!cat || r.category === cat) && (!status || r.status === status);
  });
  const tbody = document.getElementById('libTableBody');
  if (!tbody) return;
  const statusMap = { published: ['success', '已发布'], draft: ['info', '起草中'], review: ['warning', '审批中'], abolished: ['gray', '已废止'] };
  tbody.innerHTML = filtered.map(r => `
    <tr>
      <td>${r.id}</td><td><a href="#" onclick="viewDetail('${r.id}');return false" style="color:var(--primary);text-decoration:none;">${r.title}</a></td>
      <td>${r.category}</td><td>${r.version}</td>
      <td><span class="badge badge-${statusMap[r.status][0]}">${statusMap[r.status][1]}</span></td>
      <td>${r.author}</td><td>${r.publishDate || '-'}</td>
      <td>${r.signoffRate ? `<div style="display:flex;align-items:center;gap:6px;"><div class="progress-bar" style="width:60px;"><div class="fill ${r.signoffRate >= 90 ? 'green' : 'orange'}" style="width:${r.signoffRate}%"></div></div>${r.signoffRate}%</div>` : '-'}</td>
      <td>
        <button class="btn btn-outline btn-sm" onclick="viewDetail('${r.id}')">详情</button>
        ${r.status === 'draft' ? `<button class="btn btn-primary btn-sm" onclick="submitReview('${r.id}')">提交审批</button>` : ''}
      </td>
    </tr>
  `).join('');
}

  c.innerHTML = `
    <div class="tabs">
      <div class="tab active" onclick="switchLifecycleTab('draft', this)">制度起草</div>
      <div class="tab" onclick="switchLifecycleTab('review', this)">审批管理</div>

  renderLifecycleDraft();

function switchLifecycleTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const container = document.getElementById('lifecycleContent');
  switch(tab) {
    case 'draft': renderLifecycleDraft(container); break;
    case 'review': renderLifecycleReview(container); break;
    case 'publish': renderLifecyclePublish(container); break;
    case 'revise': renderLifecycleRevise(container); break;
  }
}

function saveDraft() {
  const title = document.getElementById('draftTitle').value.trim();
  const category = document.getElementById('draftCategory').value;
  const author = document.getElementById('draftAuthor').value.trim();
  const version = document.getElementById('draftVersion').value.trim();
  const tags = document.getElementById('draftTags').value.split(',').map(t => t.trim()).filter(Boolean);
  const content = document.getElementById('draftContent').value.trim();
  if (!title || !category || !author) { alert('请填写必填字段'); return; }

  const newReg = {
    id: 'R2026-' + String(store.regulations.length + 1).padStart(3, '0'),
    title, category, version, status: 'draft', author, publishDate: '', effectiveDate: '', signoffRate: 0, tags, content
  };
  store.regulations.push(newReg);
  closeModal();
  renderLifecycleDraft();
  alert('草稿保存成功！编号：' + newReg.id);
}

function editDraft(id) {
  const r = store.regulations.find(x => x.id === id);
  if (!r) return;
  const modal = document.getElementById('modalBox');
  modal.innerHTML = `
    <div class="modal-header"><span>编辑制度 - ${r.id}</span><span class="close-btn" onclick="closeModal()">&times;</span></div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group"><label>制度名称 *</label><input type="text" id="draftTitle" value="${r.title}"></div>
        <div class="form-group"><label>分类 *</label><select id="draftCategory">${['科研管理','知识产权','安全管理','采购管理','人力资源','财务管理','信息安全','法务合规','行政管理','质量管理'].map(c => `<option ${c === r.category ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>起草部门 *</label><input type="text" id="draftAuthor" value="${r.author}"></div>
        <div class="form-group"><label>版本号</label><input type="text" id="draftVersion" value="${r.version}"></div>
      </div>
      <div class="form-group"><label>标签（逗号分隔）</label><input type="text" id="draftTags" value="${r.tags.join(', ')}"></div>
      <div class="form-group"><label>制度内容</label><textarea id="draftContent" rows="6">${r.content}</textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="updateDraft('${r.id}')">保存修改</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
}

function updateDraft(id) {
  const r = store.regulations.find(x => x.id === id);
  if (!r) return;
  r.title = document.getElementById('draftTitle').value.trim();
  r.category = document.getElementById('draftCategory').value;
  r.author = document.getElementById('draftAuthor').value.trim();
  r.version = document.getElementById('draftVersion').value.trim();
  r.tags = document.getElementById('draftTags').value.split(',').map(t => t.trim()).filter(Boolean);
  r.content = document.getElementById('draftContent').value.trim();
  closeModal();
  renderLifecycleDraft();
  alert('修改保存成功！');
}

function submitReview(id) {
  const r = store.regulations.find(x => x.id === id);
  if (!r) return;
  if (!confirm(`确认将「${r.title}」提交审批？`)) return;
  r.status = 'review';
  renderPage('lifecycle');
  alert('已提交审批！');
}

function approveRegulation(id) {
  const r = store.regulations.find(x => x.id === id);
  if (!r) return;
  if (!confirm(`确认通过「${r.title}」的审批？`)) return;
  r.status = 'published';
  r.publishDate = new Date().toISOString().split('T')[0];
  r.effectiveDate = new Date(Date.now() + 15*86400000).toISOString().split('T')[0];
  r.signoffRate = 0;
  store.signoffs.push({ id: store.signoffs.length + 1, regulationId: r.id, regulationTitle: r.title, department: r.author, total: 50, signed: 0, rate: 0 });
  renderPage('lifecycle');
  alert('审批通过！制度已发布。');
}

function rejectRegulation(id) {
  const r = store.regulations.find(x => x.id === id);
  if (!r) return;
  if (!confirm(`确认驳回「${r.title}」？`)) return;
  r.status = 'draft';
  renderPage('lifecycle');
  alert('已驳回，请修改后重新提交。');
}

function deleteRegulation(id) {
  if (!confirm('确认删除该制度草稿？此操作不可恢复。')) return;
  store.regulations = store.regulations.filter(r => r.id !== id);
  renderLifecycleDraft();
}

function startRevise(id) {
  const r = store.regulations.find(x => x.id === id);
  if (!r) return;
  if (!confirm(`确认启动「${r.title}」的修订流程？将创建新版本草稿。`)) return;
  const newVersion = 'V' + (parseFloat(r.version.substring(1)) + 0.1).toFixed(1);
  store.regulations.push({
    ...r, id: 'R2026-' + String(store.regulations.length + 1).padStart(3, '0'),
    version: newVersion, status: 'draft', publishDate: '', effectiveDate: '', signoffRate: 0
  });
  renderPage('lifecycle');
  alert('修订流程已启动，新版本：' + newVersion);
}

// ============ AI CHECK ============
function renderAICheck(c) {
  c.innerHTML = `
    <div class="alert alert-info">&#9881; <strong>AI合规校验引擎</strong> — 基于大模型自动检索关联制度，比对条款内容，发现冲突或不一致时主动预警。</div>
    <div class="form-row" style="margin-bottom:16px;">
      <div class="form-group">
        <label>选择待校验制度</label>
        <select id="aiCheckRegulation" style="width:100%;">
          <option value="">-- 请选择 --</option>
          ${store.regulations.filter(r => r.status === 'draft' || r.status === 'review').map(r => `<option value="${r.id}">${r.id} - ${r.title}</option>`).join('')}
        </select>
      </div>
      <div class="form-group" style="display:flex;align-items:flex-end;">
        <button class="btn btn-primary" onclick="runAICheck()" style="height:38px;">开始AI校验</button>
      </div>
    </div>
    <div id="aiCheckResult"></div>
  `;
}

function runAICheck() {
  const regId = document.getElementById('aiCheckRegulation').value;
  if (!regId) { alert('请选择待校验制度'); return; }
  const r = store.regulations.find(x => x.id === regId);
  const resultDiv = document.getElementById('aiCheckResult');

  // Simulated AI check results
  const relatedRegs = store.regulations.filter(x => x.id !== regId && x.status === 'published').slice(0, 3);
  const simConflicts = [
    { severity: 'high', desc: `「${r.title}」中关于审批权限的规定与「${relatedRegs[0]?.title || '关联制度'}」第5条存在不一致：前者要求部门负责人审批，后者要求分管领导审批。`, related: relatedRegs[0]?.id || 'R2026-001' },
    { severity: 'medium', desc: `「${r.title}」中关于文档归档期限（30天）与「${relatedRegs[1]?.title || '关联制度'}」规定的15天存在差异，建议统一标准。`, related: relatedRegs[1]?.id || 'R2026-002' },
    { severity: 'low', desc: `「${r.title}」引用了已废止的「${store.regulations.find(x => x.status === 'abolished')?.title || '合同管理办法'}」，建议更新引用。`, related: store.regulations.find(x => x.status === 'abolished')?.id || 'R2026-009' }
  ];

  resultDiv.innerHTML = `
    <div class="card"><div class="card-header">AI校验结果 - ${r.title}</div>
    <div class="card-body">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:14px;">
        <span style="color:var(--danger);font-size:20px;">&#9888;</span> 检测到 <strong>${simConflicts.length}</strong> 处潜在风险点
      </div>
      ${simConflicts.map((c, i) => `
        <div class="conflict-item">
          <div class="conflict-header">
            <span class="badge badge-${c.severity === 'high' ? 'danger' : c.severity === 'medium' ? 'warning' : 'info'}">${c.severity === 'high' ? '高风险' : c.severity === 'medium' ? '中风险' : '低风险'}</span>
            <span style="font-size:12px;color:var(--text-secondary);">关联制度：${c.related}</span>
          </div>
          <div class="conflict-body">${c.desc}</div>
        </div>
      `).join('')}
      <div style="margin-top:16px;display:flex;gap:10px;">
        <button class="btn btn-primary" onclick="alert('已标记，将在修订时合并处理。')">一键标记处理</button>
        <button class="btn btn-outline" onclick="alert('已导出校验报告。')">导出校验报告</button>
      </div>
    </div></div>
  `;
}

      <div class="stat-card"><div class="stat-icon blue">&#9776;</div><div class="stat-info"><div class="stat-value">${store.signoffs.length}</div><div class="stat-label">在签制度数</div></div></div>
      <div class="stat-card"><div class="stat-icon orange">&#9888;</div><div class="stat-info"><div class="stat-value">${store.signoffs.filter(s => s.rate < 85).length}</div><div class="stat-label">签收率偏低</div></div></div>
      <div class="stat-card"><div class="stat-icon red">&#10005;</div><div class="stat-info"><div class="stat-value">${store.signoffs.reduce((s, i) => s + (i.total - i.signed), 0)}</div><div class="stat-label">未签收总人数</div></div></div>

    <div class="card-body no-padding"><div class="table-wrap">

    </div></div></div>
  `;
}

function viewSignoffDetail(id) {
  const s = store.signoffs.find(x => x.id === id);
  if (!s) return;
  const unsigned = s.total - s.signed;
  const modal = document.getElementById('modalBox');
  modal.innerHTML = `
    <div class="modal-header"><span>签收详情 - ${s.regulationTitle}</span><span class="close-btn" onclick="closeModal()">&times;</span></div>
    <div class="modal-body">
      <div class="form-row" style="margin-bottom:16px;">
        <div class="form-group"><label>应签总人数</label><div style="font-size:20px;font-weight:700;">${s.total}</div></div>
        <div class="form-group"><label>已签人数</label><div style="font-size:20px;font-weight:700;color:var(--success);">${s.signed}</div></div>
        <div class="form-group"><label>未签人数</label><div style="font-size:20px;font-weight:700;color:var(--danger);">${unsigned}</div></div>
        <div class="form-group"><label>签收率</label><div style="font-size:20px;font-weight:700;">${s.rate}%</div></div>
      </div>
      <div class="progress-bar" style="height:10px;margin-bottom:16px;"><div class="fill ${s.rate >= 90 ? 'green' : 'orange'}" style="width:${s.rate}%"></div></div>
      <div style="font-size:13px;color:var(--text-secondary);">* 模拟明细：按部门维度统计，具体人员签收明细需对接OA系统后展示。</div>
    </div>
    <div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">关闭</button></div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
}

// ============ UTILS ============
function navigateTo(page) {
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  const navItem = document.querySelector(`.nav-item[data-page="${page}"]`);
  if (navItem) navItem.classList.add('active');
  document.getElementById('pageTitle').textContent = pageTitles[page];
  renderPage(page);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
