<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苦思冥想泡泡 - 灵感收集器</title>
    <style>
        :root {
            --bg: #0a0e1a;
            --bg2: #121830;
            --ink: #e8ecf4;
            --muted: #7a8ab0;
            --rule: #2a3458;
            --accent: #6c9fff;
            --accent2: #ff8a6c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--ink);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* 背景星空效果 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* 主容器 */
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 标题区域 */
        .header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(108, 159, 255, 0.5);
            margin-bottom: 8px;
        }

        .header p {
            font-size: 0.9rem;
            color: var(--muted);
            letter-spacing: 0.1em;
        }

        /* 输入区域 */
        .input-area {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
            background: rgba(18, 24, 48, 0.8);
            padding: 16px 24px;
            border-radius: 50px;
            border: 1px solid var(--rule);
            backdrop-filter: blur(10px);
        }

        .input-area input {
            background: transparent;
            border: none;
            color: var(--ink);
            font-size: 1rem;
            width: 300px;
            outline: none;
            font-family: inherit;
        }

        .input-area input::placeholder {
            color: var(--muted);
        }

        .input-area button {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.3s ease;
            letter-spacing: 0.05em;
        }

        .input-area button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(108, 159, 255, 0.4);
        }

        /* 泡泡容器 */
        .bubble-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 2;
        }

        /* 泡泡样式 */
        .bubble {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 16px;
            font-size: 0.85rem;
            line-height: 1.4;
            word-break: break-word;
            transition: transform 0.3s ease;
            box-shadow: 
                inset -10px -10px 20px rgba(0,0,0,0.3),
                inset 10px 10px 20px rgba(255,255,255,0.2),
                0 0 30px rgba(255,255,255,0.1);
            animation: float 6s infinite ease-in-out;
        }

        .bubble::before {
            content: '';
            position: absolute;
            top: 15%;
            left: 20%;
            width: 25%;
            height: 15%;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            filter: blur(2px);
        }

        .bubble:hover {
            transform: scale(1.1);
            z-index: 100;
        }

        .bubble .idea-text {
            color: white;
            font-weight: 500;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            max-height: 80%;
            overflow: hidden;
        }

        .bubble .idea-date {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.8);
            margin-top: 4px;
        }

        /* 石化效果 */
        .bubble.petrified {
            background: linear-gradient(135deg, #4a4a5a, #2a2a3a) !important;
            box-shadow: 
                inset -5px -5px 10px rgba(0,0,0,0.5),
                inset 5px 5px 10px rgba(255,255,255,0.05),
                0 0 10px rgba(0,0,0,0.5) !important;
            animation: none;
        }

        .bubble.petrified::before {
            display: none;
        }

        .bubble.petrified .idea-text {
            color: #aaa;
        }

        .bubble.petrified .idea-date {
            color: #888;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-10px) rotate(1deg); }
            50% { transform: translateY(-5px) rotate(-1deg); }
            75% { transform: translateY(-15px) rotate(0.5deg); }
        }

        /* 底部沉淀区域 */
        .sediment-area {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(to top, rgba(10,14,26,0.9), transparent);
            z-index: 3;
            pointer-events: none;
        }

        /* 统计信息 */
        .stats {
            position: absolute;
            top: 80px;
            right: 20px;
            z-index: 10;
            background: rgba(18, 24, 48, 0.7);
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid var(--rule);
            font-size: 0.8rem;
            color: var(--muted);
            backdrop-filter: blur(10px);
        }

        .stats span {
            color: var(--accent);
            font-weight: 600;
        }

        /* 提示信息 */
        .hint {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--muted);
            font-size: 0.8rem;
            z-index: 10;
            opacity: 0.7;
            pointer-events: none;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .header h1 { font-size: 1.5rem; }
            .input-area { width: 90%; }
            .input-area input { width: 200px; }
        }
    </style>
</head>
<body>
    <!-- 星空背景 -->
    <div class="stars" id="stars"></div>

    <div class="container">
        <!-- 标题 -->
        <div class="header">
            <h1>苦思冥想泡泡</h1>
            <p>捕捉每一个稍纵即逝的灵感</p>
        </div>

        <!-- 统计 -->
        <div class="stats">
            <div>活跃泡泡: <span id="activeCount">0</span></div>
            <div>已石化: <span id="petrifiedCount">0</span></div>
            <div>总灵感: <span id="totalCount">0</span></div>
        </div>

        <!-- 泡泡容器 -->
        <div class="bubble-container" id="bubbleContainer"></div>

        <!-- 沉淀区域 -->
        <div class="sediment-area"></div>

        <!-- 提示 -->
        <div class="hint">输入灵感，按回车或点击按钮生成泡泡 · 泡泡会随时间沉淀石化</div>

        <!-- 输入区域 -->
        <div class="input-area">
            <input type="text" id="ideaInput" placeholder="输入你的灵感想法..." maxlength="50">
            <button onclick="createBubble()">生成泡泡</button>
        </div>
    </div>

    <script>
        // 泡泡颜色配置 - 五颜六色
        const bubbleColors = [
            'linear-gradient(135deg, #ff6b9d, #c44569)',
            'linear-gradient(135deg, #f8b500, #f093fb)',
            'linear-gradient(135deg, #4facfe, #00f2fe)',
            'linear-gradient(135deg, #43e97b, #38f9d7)',
            'linear-gradient(135deg, #fa709a, #fee140)',
            'linear-gradient(135deg, #a8edea, #fed6e3)',
            'linear-gradient(135deg, #ff9a9e, #fecfef)',
            'linear-gradient(135deg, #667eea, #764ba2)',
            'linear-gradient(135deg, #f093fb, #f5576c)',
            'linear-gradient(135deg, #4facfe, #00f2fe)',
            'linear-gradient(135deg, #43e97b, #38f9d7)',
            'linear-gradient(135deg, #fa709a, #fee140)'
        ];

        let bubbles = [];
        let bubbleIdCounter = 0;
        const PETRIFY_TIME = 30000; // 30秒后石化
        const SEDIMENT_TIME = 15000; // 15秒后开始下沉

        // 初始化星空背景
        function initStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }

        // 获取当前时间字符串
        function getCurrentTime() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        }

        // 创建泡泡
        function createBubble() {
            const input = document.getElementById('ideaInput');
            const text = input.value.trim();
            if (!text) return;

            const container = document.getElementById('bubbleContainer');
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            // 随机大小
            const size = Math.random() * 60 + 100; // 100-160px
            bubble.style.width = size + 'px';
            bubble.style.height = size + 'px';
            
            // 随机颜色
            const colorIndex = Math.floor(Math.random() * bubbleColors.length);
            bubble.style.background = bubbleColors[colorIndex];
            
            // 随机位置（上半部分）
            const x = Math.random() * (window.innerWidth - size);
            const y = Math.random() * (window.innerHeight * 0.4) + 80;
            bubble.style.left = x + 'px';
            bubble.style.top = y + 'px';
            
            // 内容
            const ideaText = document.createElement('div');
            ideaText.className = 'idea-text';
            ideaText.textContent = text;
            
            const ideaDate = document.createElement('div');
            ideaDate.className = 'idea-date';
            ideaDate.textContent = getCurrentTime();
            
            bubble.appendChild(ideaText);
            bubble.appendChild(ideaDate);
            
            // 存储泡泡数据
            const bubbleData = {
                id: bubbleIdCounter++,
                element: bubble,
                createdAt: Date.now(),
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.3,
                isPetrified: false,
                text: text
            };
            
            bubbles.push(bubbleData);
            container.appendChild(bubble);
            
            // 清空输入
            input.value = '';
            
            // 更新统计
            updateStats();
            
            // 点击删除
            bubble.addEventListener('click', function() {
                if (!bubbleData.isPetrified) {
                    removeBubble(bubbleData);
                }
            });
        }

        // 移除泡泡
        function removeBubble(bubbleData) {
            const index = bubbles.indexOf(bubbleData);
            if (index > -1) {
                bubbles.splice(index, 1);
                bubbleData.element.remove();
                updateStats();
            }
        }

        // 更新统计
        function updateStats() {
            const active = bubbles.filter(b => !b.isPetrified).length;
            const petrified = bubbles.filter(b => b.isPetrified).length;
            document.getElementById('activeCount').textContent = active;
            document.getElementById('petrifiedCount').textContent = petrified;
            document.getElementById('totalCount').textContent = bubbles.length;
        }

        // 动画循环
        function animate() {
            const now = Date.now();
            const containerHeight = window.innerHeight;
            
            bubbles.forEach(bubble => {
                const age = now - bubble.createdAt;
                
                // 石化判断
                if (age > PETRIFY_TIME && !bubble.isPetrified) {
                    bubble.isPetrified = true;
                    bubble.element.classList.add('petrified');
                    updateStats();
                }
                
                // 运动逻辑
                if (!bubble.isPetrified) {
                    // 活跃泡泡随机运动
                    bubble.x += bubble.vx;
                    bubble.y += bubble.vy;
                    
                    // 边界反弹
                    if (bubble.x <= 0 || bubble.x >= window.innerWidth - 100) bubble.vx *= -1;
                    if (bubble.y <= 80 || bubble.y >= containerHeight * 0.6) bubble.vy *= -1;
                    
                    // 添加随机扰动
                    bubble.vx += (Math.random() - 0.5) * 0.02;
                    bubble.vy += (Math.random() - 0.5) * 0.02;
                    
                    // 限制速度
                    bubble.vx = Math.max(-1, Math.min(1, bubble.vx));
                    bubble.vy = Math.max(-1, Math.min(1, bubble.vy));
                } else {
                    // 石化后下沉到底部
                    const targetY = containerHeight - 120 - Math.random() * 50;
                    bubble.y += (targetY - bubble.y) * 0.02;
                    bubble.x += (Math.random() - 0.5) * 0.1;
                }
                
                // 更新位置
                bubble.element.style.left = bubble.x + 'px';
                bubble.element.style.top = bubble.y + 'px';
            });
            
            requestAnimationFrame(animate);
        }

        // 回车提交
        document.getElementById('ideaInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') createBubble();
        });

        // 初始化
        initStars();
        animate();

        // 预置几个示例泡泡
        setTimeout(() => {
            document.getElementById('ideaInput').value = '做一个会发光的时钟';
            createBubble();
            
            setTimeout(() => {
                document.getElementById('ideaInput').value = '自动浇花的机器人';
                createBubble();
                
                setTimeout(() => {
                    document.getElementById('ideaInput').value = '能记住梦境的APP';
                    createBubble();
                }, 500);
            }, 500);
        }, 500);
    </script>
</body>
</html>
