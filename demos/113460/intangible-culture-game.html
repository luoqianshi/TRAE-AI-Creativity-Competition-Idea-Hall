function playTone(freq, duration, type = 'sine', vol = 0.08) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + duration);
}

// ============ RENDER MENU ============
function renderMenu() {
  const grid = document.getElementById('craft-grid');
  grid.innerHTML = crafts.map((c, i) => `
    <div class="craft-card animate-in" style="animation-delay:${i*0.1}s" onclick="startCraft('${c.id}')">
      <div class="card-glow"></div>
      <span class="icon">${c.icon}</span>
      <div class="name">${c.name}</div>
      <div class="tag">${c.tag}</div>
      ${completedCrafts.has(c.id) ? '<div style="color:var(--jade);font-size:0.75rem;margin-top:0.3rem">✓ 已完成</div>' : ''}
    </div>
  `).join('');
}

// ============ SCREEN SWITCHING ============
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ============ START CRAFT ============
function startCraft(craftId) {
  initAudio();
  currentCraft = crafts.find(c => c.id === craftId);
  currentStep = 0;
  showScreen('game-screen');
  document.getElementById('game-title').textContent = currentCraft.name;
  document.getElementById('game-subtitle').textContent = currentCraft.tag;
  renderProgress();
  renderStep();
}

function goBack() {
  showScreen('menu-screen');
  renderMenu();
  currentCraft = null;
}

document.getElementById('back-btn').addEventListener('click', goBack);

// ============ PROGRESS BAR ============
function renderProgress() {
  const total = currentCraft.steps.length;
  const pct = currentStep === total ? 100 : (currentStep / total * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  const stepsDiv = document.getElementById('progress-steps');
  stepsDiv.innerHTML = currentCraft.steps.map((s, i) => {
    let cls = 'step-dot';
    if (i < currentStep) cls += ' done';
    if (i === currentStep && currentStep < total) cls += ' active';
    return `<span class="${cls}">${i+1}.${s.name}</span>`;
  }).join('');
}

// ============ RENDER STEP ============
function renderStep() {
  const area = document.getElementById('game-area');
  if (currentStep >= currentCraft.steps.length) {
    showCompletion();
    return;
  }
  const step = currentCraft.steps[currentStep];
  actionProgress = 0;
  actionMax = step.max;
  actionActive = false;

  area.innerHTML = `
    <div class="step-container animate-in">
      <div class="step-title">${step.name}</div>
      <div class="step-desc">${step.desc}</div>
      <div class="interactive-zone" id="interactive-zone"></div>
      <div class="timeline-dots" id="timeline-dots">${'<div class="timeline-dot"></div>'.repeat(step.max)}</div>
      <div style="font-size:0.8rem;color:var(--muted);margin-top:0.5rem" id="progress-text">进度: 0/${step.max}</div>
    </div>
  `;
  renderProgress();
  setupInteraction(step);
}

function updateProgressDots() {
  const dots = document.getElementById('timeline-dots');
  if (!dots) return;
  Array.from(dots.children).forEach((d, i) => {
    d.className = 'timeline-dot' + (i < actionProgress ? ' done' : '');
    if (i === actionProgress && actionProgress < actionMax) d.classList.add('active');
  });
  const text = document.getElementById('progress-text');
  if (text) text.textContent = `进度: ${actionProgress}/${actionMax}`;
}

function advanceProgress() {
  if (actionProgress >= actionMax) return;
  actionProgress++;
  updateProgressDots();
  playTone(400 + actionProgress * 60, 0.15, 'sine', 0.06);
  if (actionProgress >= actionMax) {
    setTimeout(() => {
      currentStep++;
      renderStep();
      if (currentStep >= currentCraft.steps.length) {
        completedCrafts.add(currentCraft.id);
      }
    }, 600);
  }
}

// ============ INTERACTION SETUP ============
function setupInteraction(step) {
  const zone = document.getElementById('interactive-zone');
  if (!zone) return;

  switch (step.action) {
    case 'click_collect':
      setupClickCollect(zone, step);
      break;
    case 'click_repeat':
      setupClickRepeat(zone, step);
      break;
    case 'click_rhythm':
      setupClickRhythm(zone, step);
      break;
    case 'click_hold':
      setupClickHold(zone, step);
      break;
    case 'draw_pattern':
      setupDrawPattern(zone, step);
      break;
  }
}

function setupClickCollect(zone, step) {
  // 资源点散布在区域中
  const items = ['💎','🪨','⛏️','💠','🔮','✨','🪨','💎','⛏️','💠'];
  zone.innerHTML = '';
  for (let i = 0; i < step.max; i++) {
    const item = document.createElement('div');
    item.style.cssText = `font-size:2rem;cursor:pointer;transition:all 0.3s;padding:0.3rem`;
    item.textContent = items[i];
    item.onclick = () => {
      item.style.transform = 'scale(1.5)';
      item.style.opacity = '0';
      setTimeout(() => item.remove(), 300);
      spawnParticles(item);
      advanceProgress();
    };
    zone.appendChild(item);
  }
}

function setupClickRepeat(zone, step) {
  zone.innerHTML = `
    <div style="text-align:center">
      <div class="craft-visual pulse-anim" id="click-target" style="cursor:pointer;font-size:3rem;">
        ${currentCraft.icon}
      </div>
      <div style="margin-top:0.8rem;font-size:0.8rem;color:var(--muted)">点击图标进行操作</div>
    </div>
  `;
  document.getElementById('click-target').onclick = function() {
    this.style.transform = 'scale(0.9)';
    setTimeout(() => this.style.transform = '', 150);
    spawnParticles(this);
    advanceProgress();
  };
}

function setupClickRhythm(zone, step) {
  const rhythmNotes = ['♪','♫','♩','♬','🎵','🎶'];
  zone.innerHTML = `
    <div style="text-align:center">
      <div style="font-size:0.85rem;color:var(--muted);margin-bottom:0.8rem">跟随节奏点击</div>
      <div class="craft-visual" id="rhythm-target" style="cursor:pointer;font-size:3rem;border-color:var(--accent2)">
        ${currentCraft.icon}
      </div>
    </div>
  `;
  let pulseInt = setInterval(() => {
    const el = document.getElementById('rhythm-target');
    if (!el) { clearInterval(pulseInt); return; }
    el.style.transform = 'scale(1.08)';
    el.style.borderColor = 'var(--accent)';
    setTimeout(() => {
      el.style.transform = 'scale(1)';
      el.style.borderColor = 'var(--accent2)';
    }, 200);
  }, 1000);

  document.getElementById('rhythm-target').onclick = function() {
    playTone(523, 0.2, 'triangle', 0.1);
    spawnParticles(this);
    advanceProgress();
    if (actionProgress >= step.max) clearInterval(pulseInt);
  };
}

function setupClickHold(zone, step) {
  zone.innerHTML = `
    <div style="text-align:center">
      <div style="font-size:0.85rem;color:var(--muted);margin-bottom:0.8rem">长按按钮完成此步骤</div>
      <button class="action-btn" id="hold-btn" style="font-size:1.1rem;padding:1rem 3rem;">
        按住完成
      </button>
      <div style="margin-top:0.8rem;width:200px;height:6px;background:var(--rule);border-radius:3px;overflow:hidden">
        <div id="hold-fill" style="height:100%;width:0%;background:var(--accent2);transition:width 0.1s linear;border-radius:3px"></div>
      </div>
    </div>
  `;
  let holdTimer = null;
  let holdProgress = 0;
  const btn = document.getElementById('hold-btn');
  const fill = document.getElementById('hold-fill');

  btn.addEventListener('mousedown', () => {
    holdTimer = setInterval(() => {
      holdProgress += 3;
      fill.style.width = holdProgress + '%';
      if (holdProgress >= 100) {
        clearInterval(holdTimer);
        spawnParticles(btn);
        advanceProgress();
      }
    }, 50);
  });
  btn.addEventListener('mouseup', () => { clearInterval(holdTimer); });
  btn.addEventListener('mouseleave', () => { clearInterval(holdTimer); });
  btn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    holdTimer = setInterval(() => {
      holdProgress += 3;
      fill.style.width = holdProgress + '%';
      if (holdProgress >= 100) {
        clearInterval(holdTimer);
        spawnParticles(btn);
        advanceProgress();
      }
    }, 50);
  });
  btn.addEventListener('touchend', () => { clearInterval(holdTimer); });
}

function setupDrawPattern(zone, step) {
  zone.innerHTML = `
    <div style="text-align:center">
      <div style="font-size:0.85rem;color:var(--muted);margin-bottom:0.8rem">在画布上绘制图案</div>
      <canvas id="draw-canvas" width="280" height="200" style="background:var(--bg);border:1px solid var(--rule);border-radius:8px;cursor:crosshair;touch-action:none"></canvas>
      <div style="margin-top:0.8rem">
        <button class="action-btn" id="draw-done-btn" disabled>绘制完成</button>
      </div>
    </div>
  `;
  const canvas = document.getElementById('draw-canvas');
  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent2').trim();
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  let drawing = false;
  let hasDrawn = false;

  function startDraw(e) {
    e.preventDefault();
    drawing = true;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX || e.touches[0].clientX) - rect.left;
    const y = (e.clientY || e.touches[0].clientY) - rect.top;
    ctx.beginPath();
    ctx.moveTo(x, y);
  }
  function draw(e) {
    if (!drawing) return;
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX || e.touches[0].clientX) - rect.left;
    const y = (e.clientY || e.touches[0].clientY) - rect.top;
    ctx.lineTo(x, y);
    ctx.stroke();
    hasDrawn = true;
    document.getElementById('draw-done-btn').disabled = false;
  }
  function stopDraw() { drawing = false; }

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDraw);
  canvas.addEventListener('mouseleave', stopDraw);
  canvas.addEventListener('touchstart', startDraw);
  canvas.addEventListener('touchmove', draw);
  canvas.addEventListener('touchend', stopDraw);

  document.getElementById('draw-done-btn').onclick = () => {
    if (hasDrawn) {
      spawnParticles(canvas);
      advanceProgress();
      if (actionProgress < step.max) {
        // Reset canvas for next draw
        setTimeout(() => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          document.getElementById('draw-done-btn').disabled = true;
          hasDrawn = false;
        }, 400);
      }
    }
  };
}

// ============ PARTICLE EFFECTS ============
function spawnParticles(el) {
  const rect = el.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const emojis = ['✨','💫','⭐','🌟','💛','🧡','🌸','🍂','🪷','🎋'];
  for (let i = 0; i < 8; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    p.style.setProperty('--dx', (Math.random() - 0.5) * 200 + 'px');
    p.style.setProperty('--dy', (Math.random() - 0.5) * 200 - 60 + 'px');
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1300);
  }
}

// ============ COMPLETION ============
function showCompletion() {
  const area = document.getElementById('game-area');
  area.innerHTML = `
    <div class="step-container animate-in glow-anim" style="border-color:var(--accent2)">
      <div class="step-title" style="font-size:2rem">🎉 匠心之作，完美呈现！</div>
      <div class="craft-visual" style="font-size:4rem;width:150px;height:150px">${currentCraft.icon}</div>
      <div style="font-size:1.3rem;color:var(--accent2);font-weight:700">${currentCraft.name}</div>
      <div style="font-size:0.9rem;color:var(--muted);max-width:400px;line-height:1.7">
        你已完成${currentCraft.name}的全部制作工序！<br>
        从材料采集到成品诞生，每一步都凝聚着匠人的智慧与坚守。<br>
        非遗之美，因传承而永恒。
      </div>
      <button class="action-btn" onclick="goBack()" style="margin-top:0.5rem">返回主菜单</button>
    </div>
  `;
  renderProgress();
  // Celebration particles
  for (let i = 0; i < 5; i++) {
    setTimeout(() => {
      const fake = document.createElement('div');
      fake.style.cssText = 'position:fixed;top:50%;left:50%;width:1px;height:1px';
      document.body.appendChild(fake);
      spawnParticles(fake);
      setTimeout(() => fake.remove(), 100);
    }, i * 200);
  }
  playTone(523, 0.5, 'triangle', 0.1);
  setTimeout(() => playTone(659, 0.5, 'triangle', 0.1), 200);
  setTimeout(() => playTone(784, 0.6, 'triangle', 0.1), 400);
}

// ============ INIT ============
renderMenu();
</script>

<script>
// =============================================
// 三维实物与沉浸工坊覆盖层
// =============================================
const craftVisualMap = {
  porcelain: {
    material: ['sphere', '#c9b18b', '高岭瓷土'],
    tool: ['brush', '#d4a84b', '画笔 / 修坯刀'],
    product: ['vase', '#d9eef0', '青花瓷器'],
    chips: ['瓷土淘洗', '拉坯旋转', '青花描绘', '高温成瓷']
  },
  embroidery: {
    material: ['sheet', '#f5e6d3', '绢布与蚕丝'],
    tool: ['needle', '#d4a84b', '绣针'],
    product: ['embroidery', '#f5e6d3', '苏绣绣品'],
    chips: ['劈丝细如发', '绷布平如镜', '以针作画']
  },
  papercut: {
    material: ['sheet', '#c9403a', '红纸'],
    tool: ['scissors', '#c9c9c9', '剪刀'],
    product: ['papercut', '#c9403a', '窗花剪纸'],
    chips: ['折叠对称', '线条贯通', '镂空见巧']
  },
  teapot: {
    material: ['sphere', '#9a5f36', '紫砂泥料'],
    tool: ['hammer', '#c4956a', '木拍 / 明针'],
    product: ['teapot', '#9a5f36', '紫砂壶'],
    chips: ['泥片镶接', '明针修光', '壶中天地']
  },
  umbrella: {
    material: ['rod', '#8db06e', '楠竹与皮纸'],
    tool: ['knife', '#d4a84b', '削刀'],
    product: ['umbrella', '#8db06e', '油纸伞'],
    chips: ['竹骨开合', '皮纸裱面', '桐油防水']
  },
  calico: {
    material: ['sheet', '#fdf5e6', '棉布与靛蓝'],
    tool: ['brush', '#2d4b7a', '花版 / 刮刀'],
    product: ['cloth', '#2d4b7a', '蓝印花布'],
    chips: ['刻版防染', '靛蓝浸染', '蓝白显花']
  }
};

function modelHTML(kind, color, extraClass) {
  const style = `--face:${color}`;
  if (kind === 'sphere') return `<div class="model3d ${extraClass || ''}" style="${style}"><div class="sphere3d"></div></div>`;
  if (kind === 'sheet') return `<div class="model3d ${extraClass || ''}" style="${style}"><div class="sheet3d"></div></div>`;
  if (kind === 'rod') return `<div class="model3d ${extraClass || ''}" style="${style}"><div class="rod3d"></div></div>`;
  if (kind === 'brush' || kind === 'needle' || kind === 'knife' || kind === 'hammer') return `<div class="model3d tool3d ${kind} ${extraClass || ''}" style="${style}"><div class="rod3d"></div></div>`;
  if (kind === 'scissors') return `<div class="model3d tool3d scissors ${extraClass || ''}" style="${style}"><span class="ring r1"></span><span class="ring r2"></span></div>`;
  if (kind === 'vase') return `<div class="model3d ${extraClass || ''}" style="${style}"><div class="vase3d"></div></div>`;
  if (kind === 'teapot') return `<div class="model3d ${extraClass || ''}" style="${style}"><div class="teapot3d"></div></div>`;
  if (kind === 'umbrella') return `<div class="model3d ${extraClass || ''}" style="${style}"><div class="umbrella3d"></div></div>`;
  if (kind === 'cloth') return `<div class="model3d ${extraClass || ''}" style="${style}"><div class="cloth3d"></div></div>`;
  if (kind === 'embroidery') return `<div class="model3d ${extraClass || ''}" style="${style}"><div class="embroidery3d"></div></div>`;
  if (kind === 'papercut') return `<div class="model3d ${extraClass || ''}" style="${style}"><div class="papercut3d"></div></div>`;
  return `<div class="model3d ${extraClass || ''}" style="${style}"><div class="cube3d"><span class="face front"></span><span class="face back"></span><span class="face right"></span><span class="face left"></span><span class="face top"></span><span class="face bottom"></span></div></div>`;
}

function render3DScene(step, working) {
  const map = craftVisualMap[currentCraft.id];
  return `
    <div class="scene-shell">
      <div class="scene-camera">
        <div class="scene-floor"></div>
        <div class="workbench"><div class="bench-top"></div></div>
        <div class="model-pedestal material">
          ${modelHTML(map.material[0], map.material[1], working ? 'working' : '')}
          <div class="pedestal-label">材料 · ${map.material[2]}</div>
        </div>
        <div class="model-pedestal tool">
          ${modelHTML(map.tool[0], map.tool[1], working ? 'working' : '')}
          <div class="pedestal-label">工具 · ${map.tool[2]}</div>
        </div>
        <div class="model-pedestal product">
          ${modelHTML(map.product[0], map.product[1], actionProgress >= actionMax ? 'finished' : '')}
          <div class="pedestal-label">成品 · ${map.product[2]}</div>
        </div>
      </div>
      <div class="stage-hint">拖慢心绪，跟随镜头走进非遗工坊</div>
    </div>
    <div class="scene-chip-row">${map.chips.map(t => `<span class="scene-chip">${t}</span>`).join('')}</div>
  `;
}

const originalRenderStep3D = renderStep;
renderStep = function() {
  const area = document.getElementById('game-area');
  if (currentStep >= currentCraft.steps.length) {
    showCompletion();
    return;
  }
  const step = currentCraft.steps[currentStep];
  actionProgress = 0;
  actionMax = step.max;
  actionActive = false;
  area.innerHTML = `
    <div class="step-container immersive animate-in">
      <div class="step-title">${step.name}</div>
      <div class="step-desc">${step.desc}</div>
      <div id="scene-3d-wrap">${render3DScene(step, false)}</div>
      <div class="immersive-controls" id="interactive-zone"></div>
      <div class="timeline-dots" id="timeline-dots">${'<div class="timeline-dot"></div>'.repeat(step.max)}</div>
      <div class="immersive-note" id="progress-text">进度: 0/${step.max} · 每次操作都会推动材料、工具与成品的三维变化</div>
    </div>
  `;
  renderProgress();
  setupInteraction(step);
};

function refresh3DScene(working) {
  const wrap = document.getElementById('scene-3d-wrap');
  if (!wrap || !currentCraft || currentStep >= currentCraft.steps.length) return;
  wrap.innerHTML = render3DScene(currentCraft.steps[currentStep], !!working);
}

const originalAdvance3D = advanceProgress;
advanceProgress = function() {
  if (actionProgress >= actionMax) return;
  actionProgress++;
  refresh3DScene(true);
  updateProgressDots();
  playTone(400 + actionProgress * 60, 0.15, 'sine', 0.06);
  setTimeout(() => refresh3DScene(false), 360);
  if (actionProgress >= actionMax) {
    refresh3DScene(false);
    const product = document.querySelector('.model-pedestal.product .model3d');
    if (product) product.classList.add('finished');
    setTimeout(() => {
      currentStep++;
      renderStep();
      if (currentStep >= currentCraft.steps.length) completedCrafts.add(currentCraft.id);
    }, 850);
  }
};

setupClickRepeat = function(zone, step) {
  zone.innerHTML = `
    <div style="text-align:center">
      <div class="craft-visual scene-button pulse-anim" id="click-target" style="cursor:pointer;">
        操作工序
      </div>
      <div class="immersive-note" style="margin-top:0.55rem">点击工坊按钮，观察三维材料被工具逐步加工</div>
    </div>
  `;
  document.getElementById('click-target').onclick = function() {
    this.style.transform = 'scale(0.94) rotateX(8deg)';
    setTimeout(() => this.style.transform = '', 160);
    spawnParticles(this);
    advanceProgress();
  };
};

setupClickCollect = function(zone, step) {
  zone.innerHTML = `<div class="scene-chip-row" id="collect-3d-row"></div>`;
  const row = document.getElementById('collect-3d-row');
  for (let i = 0; i < step.max; i++) {
    const btn = document.createElement('button');
    btn.className = 'action-btn';
    btn.style.cssText = 'padding:0.55rem 1rem;font-size:0.82rem;background:linear-gradient(135deg,var(--accent2),#886526);';
    btn.textContent = '采集材料';
    btn.onclick = () => {
      btn.disabled = true;
      btn.textContent = '已入库';
      btn.style.opacity = '0.45';
      spawnParticles(btn);
      advanceProgress();
    };
    row.appendChild(btn);
  }
};

setupClickRhythm = function(zone, step) {
  zone.innerHTML = `
    <div style="text-align:center">
      <button class="action-btn" id="rhythm-target">跟随匠心节奏</button>
      <div class="immersive-note" style="margin-top:0.55rem">按钮发光时点击，模拟拉坯、穿线、组骨、浸染等节奏动作</div>
    </div>
  `;
  let pulseInt = setInterval(() => {
    const el = document.getElementById('rhythm-target');
    if (!el) { clearInterval(pulseInt); return; }
    el.style.boxShadow = '0 0 32px rgba(212,168,75,0.72)';
    el.style.transform = 'translateY(-2px) scale(1.03)';
    refresh3DScene(true);
    setTimeout(() => {
      if (el) {
        el.style.boxShadow = '';
        el.style.transform = '';
        refresh3DScene(false);
      }
    }, 260);
  }, 920);
  document.getElementById('rhythm-target').onclick = function() {
    playTone(523, 0.2, 'triangle', 0.1);
    spawnParticles(this);
    advanceProgress();
    if (actionProgress >= step.max) clearInterval(pulseInt);
  };
};

setupClickHold = function(zone, step) {
  zone.innerHTML = `
    <div style="text-align:center">
      <button class="action-btn" id="hold-btn" style="font-size:1rem;padding:0.85rem 2.8rem;">按住沉浸制作</button>
      <div style="margin:0.75rem auto 0;width:230px;height:7px;background:var(--rule);border-radius:4px;overflow:hidden">
        <div id="hold-fill" style="height:100%;width:0%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width 0.1s linear;border-radius:4px"></div>
      </div>
      <div class="immersive-note" style="margin-top:0.5rem">长按时镜头会推进，模拟窑火、晾晒、陈腐等时间工艺</div>
    </div>
  `;
  let holdTimer = null;
  let holdProgress = 0;
  const btn = document.getElementById('hold-btn');
  const fill = document.getElementById('hold-fill');
  const start = () => {
    refresh3DScene(true);
    clearInterval(holdTimer);
    holdTimer = setInterval(() => {
      holdProgress += 3;
      fill.style.width = Math.min(holdProgress, 100) + '%';
      if (holdProgress >= 100) {
        clearInterval(holdTimer);
        spawnParticles(btn);
        advanceProgress();
        holdProgress = 0;
        fill.style.width = '0%';
      }
    }, 50);
  };
  const stop = () => { clearInterval(holdTimer); refresh3DScene(false); };
  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup', stop);
  btn.addEventListener('mouseleave', stop);
  btn.addEventListener('touchstart', e => { e.preventDefault(); start(); });
  btn.addEventListener('touchend', stop);
};

setupDrawPattern = function(zone, step) {
  zone.innerHTML = `
    <div style="text-align:center">
      <canvas id="draw-canvas" class="immersive-draw-canvas" width="290" height="150"></canvas>
      <div style="margin-top:0.65rem">
        <button class="action-btn" id="draw-done-btn" disabled>把纹样印到成品上</button>
      </div>
      <div class="immersive-note" style="margin-top:0.45rem">在三维工坊中绘制纹样，完成后成品会发光确认</div>
    </div>
  `;
  const canvas = document.getElementById('draw-canvas');
  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  let drawing = false;
  let hasDrawn = false;
  function point(e) {
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  }
  function startDraw(e) {
    e.preventDefault();
    drawing = true;
    const p = point(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    refresh3DScene(true);
  }
  function draw(e) {
    if (!drawing) return;
    e.preventDefault();
    const p = point(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    hasDrawn = true;
    document.getElementById('draw-done-btn').disabled = false;
  }
  function stopDraw() { drawing = false; refresh3DScene(false); }
  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDraw);
  canvas.addEventListener('mouseleave', stopDraw);
  canvas.addEventListener('touchstart', startDraw);
  canvas.addEventListener('touchmove', draw);
  canvas.addEventListener('touchend', stopDraw);
  document.getElementById('draw-done-btn').onclick = () => {
    if (!hasDrawn) return;
    spawnParticles(canvas);
    advanceProgress();
    if (actionProgress < step.max) {
      setTimeout(() => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        document.getElementById('draw-done-btn').disabled = true;
        hasDrawn = false;
      }, 420);
    }
  };
};
</script>

  if (type === 'brush' || type === 'needle' || type === 'knife' || type === 'hammer' || type === 'scissors') {
    return `<div class="world-object tool working">${modelHTML(type, '#d4a84b', 'working')}<span class="tool-label-3d">${label}</span></div>`;
  }
  if (type === 'vase') return `<div class="world-object product">${modelHTML('vase', '#d9eef0', 'finished')}<span class="tool-label-3d">${label}</span></div>`;
  if (type === 'teapot') return `<div class="world-object product">${modelHTML('teapot', '#9a5f36', 'finished')}<span class="tool-label-3d">${label}</span></div>`;
  if (type === 'umbrella') return `<div class="world-object product">${modelHTML('umbrella', '#8db06e', 'finished')}<span class="tool-label-3d">${label}</span></div>`;
  if (type === 'embroidery') return `<div class="world-object product">${modelHTML('embroidery', '#f5e6d3', 'finished')}<span class="tool-label-3d">${label}</span></div>`;
  if (type === 'papercut') return `<div class="world-object product">${modelHTML('papercut', '#c9403a', 'finished')}<span class="tool-label-3d">${label}</span></div>`;
  return `<div class="world-object product">${modelHTML('cloth', '#2d4b7a', 'finished')}<span class="tool-label-3d">${label}</span></div>`;
}

render3DScene = function(step, working) {
  const spec = stepSceneLibrary[currentCraft.id]?.[step.id];
  if (!spec) return '';
  const [env, title, caption, material, tool, product] = spec;
  return `
    <div class="step-world ${env}">
      <div class="world-title">${title}</div>
      <div class="world-stage">
        ${object3DHTML(material, '材料')}
        ${object3DHTML(tool, '工具')}
        ${object3DHTML(product, '成品')}
        <div class="process-arrows"></div>
      </div>
      <div class="world-caption">${caption}</div>
    </div>
    <div class="scene-chip-row">
      <span class="scene-chip">当前工序：${step.name}</span>
      <span class="scene-chip">材料、工具、成品均按此步骤变化</span>
      <span class="scene-chip">点击操作会触发工艺动作</span>
    </div>
  `;
};

  if (shape === 'silkSplit') return `<div class="mat-silk-split" style="--mat:#d4a84b"><span class="thread-line"></span><span class="thread-line"></span><span class="thread-line"></span></div>`;
  if (shape === 'clothBlank') return `<div class="mat-cloth-blank"><div class="cloth-plane"></div></div>`;
  if (shape === 'clothSketch') return `<div class="mat-cloth-sketch"><div class="cloth-plane sketch"></div></div>`;
  if (shape === 'stitchedCloth') return `<div class="mat-stitched"><div class="cloth-plane stitched"></div></div>`;
  if (shape === 'mountedEmbroidery') return `<div class="mat-mounted"><div class="cloth-plane stitched" style="box-shadow:0 18px 18px rgba(0,0,0,.24),0 0 0 8px #7a4b2d"></div></div>`;
  if (shape === 'paperFlat') return `<div class="mat-paper-flat"><div class="paper-plane"></div></div>`;
  if (shape === 'paperFolded') return `<div class="mat-paper-folded"><div class="paper-plane folded"></div></div>`;
  if (shape === 'paperDrawn') return `<div class="mat-paper-drawn"><div class="paper-plane folded drawn"></div></div>`;

  if (shape === 'zishaPolished') return `<div class="mat-zisha-polished"><div class="zisha-body" style="filter:brightness(1.12) saturate(1.1)"></div><span class="glaze-shine" style="background:rgba(212,168,75,.28)"></span></div>`;

  if (shape === 'bambooSplit') return `<div class="mat-bamboo-split"><span class="bamboo-stick" style="--x:26px;--y:10px;--w:8px;--r:-18deg;--z:8px"></span><span class="bamboo-stick" style="--x:58px;--y:12px;--w:8px;--r:4deg;--z:18px"></span><span class="bamboo-stick" style="--x:88px;--y:15px;--w:8px;--r:20deg;--z:14px"></span></div>`;

  if (shape === 'umbrellaPapered') return `<div class="mat-umbrella-papered"><div class="umbrella-mini" style="--umb:linear-gradient(135deg,#f5e6d3,#d8ba91)"></div></div>`;
  if (shape === 'umbrellaOiled') return `<div class="mat-umbrella-oiled"><div class="umbrella-mini" style="--umb:linear-gradient(135deg,#d4a84b,#a86235)"></div><span class="glaze-shine" style="left:62px;top:24px;height:38px"></span></div>`;

  if (shape === 'whiteCloth') return `<div class="mat-white-cloth"><div class="cloth-blue"></div></div>`;
  if (shape === 'printPaste') return `<div class="mat-print-paste"><div class="cloth-blue paste"></div></div>`;
  if (shape === 'dyedCloth') return `<div class="mat-dyed-cloth"><div class="cloth-blue dyed"></div></div>`;
  if (shape === 'blueWhiteCloth') return `<div class="mat-blue-white"><div class="cloth-blue final"></div></div>`;
  return `<div class="mat-clay-ball"><div class="clay-form"></div></div>`;
}

function renderMaterialEvolution(step) {
  const evo = materialEvolution[currentCraft.id]?.[step.id];
  if (!evo) return '';
  const progress = actionMax ? Math.max(8, Math.round((actionProgress / actionMax) * 100)) : 8;
  return `
    <div class="material-evolution" style="--mprog:${progress}%">
      <div class="e-title">材料变化 · ${evo[0]}</div>
      <div class="e-text">${evo[1]}</div>
      <div class="e-bar"><div class="e-fill"></div></div>
    </div>
    <div class="material-view">
      ${materialShapeHTML(evo[2])}
      <span class="label">${evo[0]}</span>
    </div>
  `;
}

const render3DSceneBeforeMaterialEvolution = render3DScene;
render3DScene = function(step, working) {
  const base = render3DSceneBeforeMaterialEvolution(step, working);
  return base.replace('<div class="world-stage">', `<div class="world-stage">${renderMaterialEvolution(step)}`);
};
</script>

<script>

const toolDisplayName = {
  pickaxe: '采矿镐',
  hammer: '木拍/捶泥槌',
  knife: '刻刀/削刀',
  brush: '毛笔/刷子',
  needle: '绣针',
  hand: '双手',
  kiln: '窑炉',
  sun: '阳光与风',
  dyeVat: '靛蓝染缸',
  scissorsReal: '剪刀',
  scissors: '剪刀'
};

const productDisplayName = {
  vase: '瓷器阶段成果',
  teapot: '紫砂壶阶段成果',
  umbrella: '油纸伞阶段成果',
  embroidery: '绣品阶段成果',
  papercut: '剪纸阶段成果',
  cloth: '蓝印花布阶段成果'
};

const render3DSceneBeforeTextLayoutFix = render3DScene;
render3DScene = function(step, working) {
  const html = render3DSceneBeforeTextLayoutFix(step, working);
  const spec = stepSceneLibrary[currentCraft.id]?.[step.id];
  const evo = materialEvolution[currentCraft.id]?.[step.id];
  if (!spec || !evo) return html;
  const toolName = toolDisplayName[spec[4]] || '制作工具';
  const productName = productDisplayName[spec[5]] || '阶段成果';
  const legend = `
      <div class="world-legend">
        <span><b>材料</b>${evo[0]}</span>
        <span><b>工具</b>${toolName}</span>
        <span><b>变化</b>${productName}</span>
      </div>`;
  return html.replace('<div class="world-stage">', `${legend}<div class="world-stage">`);
};
</script>
