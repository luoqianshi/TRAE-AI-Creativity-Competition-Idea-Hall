<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 论文速读站 · PaperReader Pro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    color: #2d3748;
    line-height: 1.6;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px 60px;
  }

  /* ===== 头部 ===== */
  header {
    text-align: center;
    color: white;
    margin-bottom: 32px;
  }
  header h1 {
    font-size: 40px;
    font-weight: 700;
    margin-bottom: 10px;
    letter-spacing: -0.5px;
  }
  header p { font-size: 17px; opacity: 0.95; }
  .badge {
    display: inline-block;
    background: rgba(255,255,255,0.25);
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 13px;
    margin-top: 14px;
    backdrop-filter: blur(4px);
  }

  /* ===== 卡片通用 ===== */
  .card {
    background: white;
    border-radius: 18px;
    padding: 28px;
    margin-bottom: 22px;
    box-shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
  }

  /* ===== 输入区 ===== */
  .input-card h2 {
    font-size: 20px;
    margin-bottom: 14px;
    color: #1a202c;
  }

  textarea {
    width: 100%;
    min-height: 130px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
    transition: border-color 0.2s;
    background: #f7fafc;
  }
  textarea:focus {
    outline: none;
    border-color: #667eea;
    background: white;
  }

  .row {
    display: flex;
    gap: 12px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .example-btn {
    background: #edf2f7;
    color: #4a5568;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .example-btn:hover { background: #e2e8f0; }

  .analyze-btn {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    padding: 14px 28px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    margin-top: 16px;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 14px rgba(102, 126, 234, 0.4);
  }
  .analyze-btn:hover { transform: translateY(-1px); }
  .analyze-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  /* ===== 加载动画 ===== */
  .loading { display: none; text-align: center; padding: 30px; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid #e2e8f0;
    border-top-color: #667eea;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== 结果区 ===== */
  .result-card { display: none; }
  .result-title {
    font-size: 22px;
    color: #1a202c;
    margin-bottom: 4px;
  }
  .result-subtitle {
    font-size: 14px;
    color: #718096;
    margin-bottom: 20px;
  }
  .section {
    border-left: 4px solid #667eea;
    padding: 14px 18px;
    margin-bottom: 16px;
    background: #f8fafc;
    border-radius: 0 12px 12px 0;
  }
  .section-title {
    font-size: 15px;
    font-weight: 600;
    color: #553c9a;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-body {
    font-size: 14.5px;
    color: #2d3748;
  }

  /* ===== 问答区 ===== */
  .qa-card { display: none; }
  .qa-input-wrap {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  .qa-input {
    flex: 1;
    padding: 12px 14px;
    border: 2px solid #e2e8f0;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
  }
  .qa-input:focus {
    outline: none;
    border-color: #764ba2;
  }
  .qa-btn {
    background: #764ba2;
    color: white;
    border: none;
    padding: 0 20px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
  }
  .qa-history { margin-top: 16px; }
  .qa-item { margin-bottom: 12px; }
  .qa-q {
    background: #e9ecef;
    padding: 10px 14px;
    border-radius: 10px 10px 10px 0;
    margin-bottom: 6px;
    font-size: 14px;
  }
  .qa-a {
    background: linear-gradient(135deg, #f3e8ff, #ede9fe);
    padding: 10px 14px;
    border-radius: 10px 10px 0 10px;
    font-size: 14px;
    color: #1a202c;
  }

  /* ===== 图表/统计 ===== */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-top: 18px;
  }
  .stat-box {
    background: linear-gradient(135deg, #f0f4ff, #fdf4ff);
    padding: 16px;
    border-radius: 12px;
    text-align: center;
  }
  .stat-num {
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stat-label { font-size: 12.5px; color: #4a5568; }

  footer {
    text-align: center;
    color: rgba(255,255,255,0.8);
    font-size: 13px;
    padding: 16px;
    margin-top: 20px;
  }

  @media (max-width: 640px) {
    header h1 { font-size: 28px; }
    .card { padding: 20px; }
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📚 AI 论文速读站</h1>
      <p>把 30 页论文，读成 5 分钟对话</p>
      <span class="badge">PaperReader Pro · for Students</span>
    </header>

    <!-- 输入卡片 -->
    <div class="card input-card">
      <h2>✍️ 粘贴论文摘要 / 标题，开始速读</h2>
      <textarea id="paperInput" placeholder="粘贴论文的标题、摘要或DOI编号，或直接粘贴全文关键段落…"></textarea>

      <div class="row">
        <button class="example-btn" onclick="loadExample(1)">📄 示例 1：Transformer</button>
        <button class="example-btn" onclick="loadExample(2)">📄 示例 2：Attention</button>
        <button class="example-btn" onclick="loadExample(3)">📄 示例 3：Diffusion</button>
      </div>

      <button class="analyze-btn" onclick="analyzePaper()">🚀 开始速读分析（模拟 AI 解析）</button>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p style="color:#4a5568;font-size:14px;">AI 正在拆解论文结构，请稍候…</p>
      </div>
    </div>

    <!-- 结果卡片 -->
    <div class="card result-card" id="resultCard">
      <h2 class="result-title" id="paperTitle"></h2>
      <p class="result-subtitle" id="paperMeta"></p>

      <div class="section">
        <div class="section-title">💡 核心贡献（一句话）</div>
        <div class="section-body" id="contribution"></div>
      </div>

      <div class="section">
        <div class="section-title">🔬 研究背景</div>
        <div class="section-body" id="background"></div>
      </div>

      <div class="section">
        <div class="section-title">⚙️ 方法框架</div>
        <div class="section-body" id="method"></div>
      </div>

      <div class="section">
        <div class="section-title">📊 实验结果</div>
        <div class="section-body" id="results"></div>
      </div>

      <div class="section">
        <div class="section-title">⚠️ 局限性与讨论</div>
        <div class="section-body" id="limitations"></div>
      </div>

      <div class="stats">
        <div class="stat-box">
          <div class="stat-num">~5 min</div>
          <div class="stat-label">阅读时间</div>
        </div>
        <div class="stat-box">
          <div class="stat-num">5</div>
          <div class="stat-label">关键部分</div>
        </div>
        <div class="stat-box">
          <div class="stat-num">∞</div>
          <div class="stat-label">问答轮次</div>
        </div>
        <div class="stat-box">
          <div class="stat-num">RAG</div>
          <div class="stat-label">技术底座</div>
        </div>
      </div>
    </div>

    <!-- 问答卡片 -->
    <div class="card qa-card" id="qaCard">
      <h2 style="font-size:20px;margin-bottom:8px;">💬 对论文还有疑问？继续追问</h2>
      <p style="font-size:14px;color:#718096;">比如："这个方法的核心创新点在哪里？"、"和之前的 baseline 相比好多少？"</p>

      <div class="qa-input-wrap">
        <input type="text" class="qa-input" id="qaInput" placeholder="输入你的问题…" />
        <button class="qa-btn" onclick="askQuestion()">追问</button>
      </div>

      <div class="qa-history" id="qaHistory"></div>
    </div>

    <footer>
      ✨ 用 TRAE Work 创作 · 让每一篇论文都能被快速理解
    </footer>
  </div>

<script>
  const examples = {
    1: {
      title: "Attention Is All You Need (Transformer)",
      text: "We propose a new simple network architecture, the Transformer, based solely on attention mechanisms, dispensing with recurrence and convolutions entirely. Experiments on two machine translation tasks show these models to be superior in quality while requiring significantly less time to train. Our model achieves 28.4 BLEU on the WMT 2014 English-to-German translation task, improving over the existing best results including ensembles by over 2 BLEU. On the WMT 2014 English-to-French translation task, our model establishes a new single-model state-of-the-art BLEU score of 41.8 after training for 3.5 days on eight GPUs, a small fraction of the training costs of the best models from the literature. We show that the Transformer generalizes well to other tasks by applying it successfully to English constituency parsing both with large and limited training data."
    },
    2: {
      title: "BERT: Pre-training of Deep Bidirectional Transformers",
      text: "We introduce a new language representation model called BERT, which stands for Bidirectional Encoder Representations from Transformers. Unlike recent language representation models, BERT is designed to pre-train deep bidirectional representations from unlabeled text by jointly conditioning on both left and right context in all layers. As a result, the pre-trained BERT model can be fine-tuned with just one additional output layer to create state-of-the-art models for a wide range of tasks, such as question answering and language inference, without substantial task-specific architecture modifications. BERT is conceptually simple and empirically powerful. It obtains new state-of-the-art results on eleven natural language processing tasks, including pushing the GLUE score to 80.5% (7.7% point absolute improvement), MultiNLI accuracy to 86.7% (4.6% absolute improvement), SQuAD v1.1 question answering Test F1 to 93.2 (1.5 point absolute improvement) and SQuAD v2.0 Test F1 to 83.1 (5.1 point absolute improvement)."
    },
    3: {
      title: "Denoising Diffusion Probabilistic Models",
      text: "We present high quality image synthesis results using diffusion probabilistic models, a class of latent variable models inspired by considerations from nonequilibrium thermodynamics. Our best results are obtained by training on a weighted variational bound designed according to a novel connection between diffusion probabilistic models and denoising score matching with Langevin dynamics, and our models naturally admit a progressive lossy decompression scheme that can be interpreted as a generalization of autoregressive decoding. On the unconditional CIFAR10 dataset, we obtain an Inception score of 9.46 and a state-of-the-art FID score of 3.17. On 256x256 LSUN, we obtain similar sample quality as ProgressiveGAN. Our implementation is based on NVIDIA's DDPM code."
    }
  };

  const analyses = {
    1: {
      meta: "Vaswani et al. · NeurIPS 2017 · 里程碑论文",
      contribution: "提出了完全基于注意力机制的 Transformer 架构，**抛弃了传统的 RNN 和 CNN**，在翻译任务上同时实现了更高的效果（BLEU 提升 2+）和更快的训练速度（数天即可在 8 个 GPU 上完成训练）。",
      background: "当时主流的序列建模方法依赖 RNN/LSTM，天生存在**难以并行、长距离依赖困难**两大问题。注意力机制虽然已有应用，但通常与 RNN 结合使用，未能充分释放并行潜力。",
      method: "核心设计包括：(1) 多头自注意力机制（Multi-Head Self-Attention），让模型同时关注来自不同子空间的信息；(2) 位置编码（Positional Encoding），使用正弦/余弦函数为序列位置信息编码，无需循环也能建模顺序关系；(3) 编码器-解码器结构，每层包含注意力+前馈网络+残差连接+层归一化。",
      results: "① WMT 2014 英→德翻译：**BLEU 28.4**，超越当时所有单模型；② WMT 2014 英→法翻译：**BLEU 41.8**，新 SOTA；③ 训练时间仅 3.5 天（8 张 GPU），远低于当时最优模型；④ 在英语成分句法分析任务上也展示了良好的泛化能力。",
      limitations: "① Transformer 对长文本的计算复杂度是 O(n²)，在极长序列上仍有瓶颈；② 位置编码方式较为简单，后续工作（如 RoPE、ALiBi）对此进行了改进；③ 需要大量训练数据才能充分发挥能力。"
    },
    2: {
      meta: "Devlin et al. · NAACL 2019 · 预训练语言模型里程碑",
      contribution: "提出 BERT（Bidirectional Encoder Representations from Transformers），通过**双向深度预训练**，一个模型 + 一个输出层即可在 11 个 NLP 任务上刷新 SOTA，且无需大幅修改任务相关架构。",
      background: "此前的语言表示模型（如 GPT、ELMo）要么是**单向**的（从左到右或从右到左），要么是**浅层双向**的拼接，无法同时利用左右上下文信息进行深度双向表示。",
      method: "两大创新训练目标：(1) **Masked LM**：随机掩盖输入中的部分 token，让模型预测被掩盖的 token，从而学习双向上下文；(2) **Next Sentence Prediction**：让模型判断两个句子是否为连续文本，学习句子级别的关系理解。预训练后通过**微调**适配下游任务。",
      results: "① GLUE 基准：**80.5%**（+7.7%）；② MultiNLI：**86.7%**（+4.6%）；③ SQuAD v1.1 QA：F1 **93.2**（+1.5）；④ SQuAD v2.0：F1 **83.1**（+5.1）。11 个任务全部 SOTA。",
      limitations: "① Masked token 在预训练和微调时不一致（微调没有 [MASK]）；② Next Sentence Prediction 相对简单，后续工作（如 RoBERTa）发现可移除；③ 对超大模型的训练成本很高；④ BERT-base 已被证明在某些任务上被更大模型（如 GPT、LLaMA）超越。"
    },
    3: {
      meta: "Ho et al. · NeurIPS 2020 · 扩散模型奠基论文",
      contribution: "系统地将扩散概率模型（DDPM）与去噪分数匹配建立数学联系，证明**扩散模型能够生成与 GAN 质量相当甚至更好的图像**，且训练更稳定。",
      background: "图像生成长期被 GAN 主导，但 GAN 存在**训练不稳定、模式崩塌、模式覆盖不足**等问题。扩散模型思路源自非平衡热力学，但此前未被充分发掘其在图像生成上的潜力。",
      method: "(1) **前向过程**：逐步向图像添加高斯噪声（共 T 步）；(2) **反向过程**：学习一个神经网络逐步去噪，从纯噪声还原为清晰图像；(3) 使用**加权变分下界**作为训练目标；(4) 与 Langevin 动力学和分数匹配建立理论联系；(5) 可解释为一种自回归解码的泛化。",
      results: "① 无条件 CIFAR-10：Inception 评分 **9.46**，FID **3.17**（当时 SOTA）；② 256×256 LSUN：样本质量与 ProgressiveGAN 相当；③ 训练稳定，不依赖对抗训练。",
      limitations: "① 采样速度慢（需要迭代数百步），后续工作（如 DDIM、DPM-Solver 对此大幅加速；② 扩散模型的似然估计不如基于流的模型精确；③ 当时主要在无条件生成场景下验证，条件生成（如图像到图像）后续由 Stable Diffusion 等发扬光大。"
    }
  };

  const qaAnswers = [
    "这是一个很好的问题！从论文的结构来看，核心创新点在于：它重新定义了该领域的基本范式，把之前需要多步才能完成的流程，用一个统一的端到端框架重新实现。这使得模型更简洁、训练更高效、同时效果也更好。",
    "对比之前的 baseline（传统方法），该工作在以下方面有显著优势：(1) 训练效率提升了数倍；(2) 最终指标有明显提升；(3) 泛化到其他任务的能力更强。具体的量化对比可以参考论文中的实验表格。",
    "该方法的核心可以用一句话总结：把复杂问题分解为多个可学习的子问题，再用统一框架求解。关键洞察是：很多我们以前认为必须顺序处理的问题，其实可以用注意力机制并行处理。",
    "从实现角度看，这个工作的工程价值在于：它证明了一个更简洁的设计，往往比复杂的工程技巧更有效。论文中多处用了「做减法」的设计思路——去掉不必要的组件，反而让整体更强大。",
    "这个方向的后续发展非常值得关注。后续工作在此基础上做了大量延伸：更大规模的数据、更深的网络、更高效的训练策略、以及向更多模态（图像、语音、视频）的扩展。"
  ];

  function loadExample(id) {
    const ex = examples[id];
    document.getElementById('paperInput').value = ex.title + "\n\n" + ex.text;
    document.getElementById('paperInput').dataset.exampleId = id;
    document.getElementById('resultCard').style.display = 'none';
    document.getElementById('qaCard').style.display = 'none';
  }

  function analyzePaper() {
    const input = document.getElementById('paperInput').value.trim();
    if (input.length < 20) {
      alert('请输入至少 20 字的论文内容~');
      return;
    }

    document.getElementById('loading').style.display = 'block';
    document.getElementById('analyze-btn');

    setTimeout(() => {
      const exampleId = document.getElementById('paperInput').dataset.exampleId || (input.substring(0, 30).includes('Attention') ? 1 : input.substring(0, 30).includes('BERT') ? 2 : 1);
      const analysis = analyses[exampleId] || analyses[1];

      document.getElementById('paperTitle').textContent = '📖 ' + (examples[exampleId]?.title || '论文分析报告');
      document.getElementById('paperMeta').textContent = analysis.meta;
      document.getElementById('contribution').textContent = analysis.contribution;
      document.getElementById('background').textContent = analysis.background;
      document.getElementById('method').textContent = analysis.method;
      document.getElementById('results').textContent = analysis.results;
      document.getElementById('limitations').textContent = analysis.limitations;

      document.getElementById('loading').style.display = 'none';
      document.getElementById('resultCard').style.display = 'block';
      document.getElementById('qaCard').style.display = 'block';

      document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 1800);
  }

  function askQuestion() {
    const q = document.getElementById('qaInput').value.trim();
    if (!q) return;
    const history = document.getElementById('qaHistory');
    const answer = qaAnswers[Math.floor(Math.random() * qaAnswers.length)];
    const item = document.createElement('div');
    item.className = 'qa-item';
    item.innerHTML = `<div class="qa-q">🙋 你：${q}</div><div class="qa-a">🤖 AI：${answer}</div>`;
    history.insertBefore(item, history.firstChild);
    document.getElementById('qaInput').value = '';
  }

  document.getElementById('qaInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') askQuestion();
  });
</script>
</body>
</html>
