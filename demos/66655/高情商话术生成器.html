          pattern: /.* /,
          results: [
            { strategy: 'praise', text: '好久不见！你状态越来越好了，是有什么保养秘诀吗？快传授一下。' },
            { strategy: 'buffer', text: '今天能聚到一起真的不容易。说起来，咱们上次见面还是XX的时候呢，时间过得真快。' },
            { strategy: 'guide', text: '我最近发现了一个特别有意思的地方/事，感觉你会喜欢。要不要找个时间去看看？' }
          ]
        }
      ],
      family: [
        {
          pattern: /催婚|催生|唠叨|管太多/,
          results: [
            { strategy: 'empathy', text: '妈/爸，我知道您是为我好，您的担心我都懂。感情这事我想慎重一点，找到真正合适的，比匆忙决定更重要，您说是吧？' },
            { strategy: 'buffer', text: '您说的这些我都记着呢。其实我也在努力，只是缘分还没到。您放心，有好消息我一定第一个告诉您。' },
            { strategy: 'guide', text: '您和我爸/妈当年也是慢慢了解才走到一起的吧？我也想找到那个真正懂我的人，您会支持我的，对吗？' }
          ]
        },
        {
          pattern: /.* /,
          results: [
            { strategy: 'praise', text: '妈/爸，您做的这个菜真的太好吃了，我在外面天天想着这一口。有您在，家才叫家。' },
            { strategy: 'empathy', text: '我知道您最近挺辛苦的，别总操心我，您自己也要多休息。有什么事咱们一起商量。' },
            { strategy: 'honest', text: '我想跟您聊聊我最近的一些想法。可能跟您期望的不太一样，但我希望您能听听，也给我点建议。' }
          ]
        }
      ],
      apology: [
        {
          pattern: /.* /,
          results: [
            { strategy: 'honest', text: '对不起，这件事是我考虑不周，伤害到你我很抱歉。我不奢求你立刻原谅我，但请相信我会用行动证明我的诚意。' },
            { strategy: 'empathy', text: '我能想象你现在的感受，换作是我也会很难过。我不该那样说/做，真的很对不起。' },
            { strategy: 'buffer', text: '我想郑重跟你道个歉。我认真反思了，问题出在我的XX上。如果可以重来，我会选择XX。希望你给我一个机会。' }
          ]
        }
      ],
      praise: [
        {
          pattern: /.* /,
          results: [
            { strategy: 'praise', text: '你这次的做法让我特别佩服。尤其是XX那个环节，换作我肯定想不到这么周全，跟你学到了。' },
            { strategy: 'guide', text: '我发现你有个特别厉害的地方——不管多复杂的事，经你手一处理就清晰明了。这是怎么练出来的？' },
            { strategy: 'honest', text: '跟你合作真的很愉快，你不仅能力强，脾气还好。能认识你这样的朋友/同事，是我的运气。' }
          ]
        }
      ],
      refuse: [
        {
          pattern: /借钱|借东西|帮忙|办事/,
          results: [
            { strategy: 'empathy', text: '我特别理解你现在的处境，如果是平时我肯定二话不说。但最近我手头也比较紧/忙，实在帮不上，你别介意。' },
            { strategy: 'buffer', text: '这件事我确实想帮你，但我目前的能力/时间可能撑不起来。要不我们一起想想别的办法？' },
            { strategy: 'guide', text: '我觉得XX可能比我更适合帮你，他在这方面更有经验/资源。需要的话我可以帮你引荐一下。' }
          ]
        },
        {
          pattern: /.* /,
          results: [
            { strategy: 'honest', text: '谢谢你的邀请/提议，我很珍惜跟你的关系。但这次可能不太方便，希望你能理解。下次有机会一定参与。' },
            { strategy: 'empathy', text: '我知道你是出于好意才想到我。不过这段时间我想把精力放在XX上，所以暂时不能答应你，抱歉。' },
            { strategy: 'buffer', text: '这个请求有点超出我目前的能力范围了。我不想因为勉强答应而影响结果，那样对你也不负责。' }
          ]
        }
      ],
      ask: [
        {
          pattern: /.* /,
          results: [
            { strategy: 'praise', text: '你在这方面真的很专业，我一直很佩服。正好我遇到个难题，不知道方不方便请你指点一下？' },
            { strategy: 'buffer', text: '有件事想麻烦你，但有点不好意思开口。如果你方便的话，能不能帮我XX？当然，要是不方便完全没关系。' },
            { strategy: 'guide', text: '我在做XX的时候遇到了瓶颈，想来想去觉得你是最懂这个的人。不知道你最近有没有时间聊聊？' }
          ]
        }
      ],
      criticize: [
        {
          pattern: /.* /,
          results: [
            { strategy: 'praise', text: '你整体做得已经非常好了，尤其是在XX方面。如果有个小建议的话，XX部分稍微调整一下可能会更完美。' },
            { strategy: 'buffer', text: '我想从一个旁观者的角度分享一点观察，不一定对，你听听看……我觉得XX方面或许还有优化的空间。' },
            { strategy: 'empathy', text: '我理解做这件事不容易，你付出了很多。如果换个思路来处理XX，效果可能会更好，你觉得呢？' }
          ]
        }
      ],
      negotiate: [
        {
          pattern: /.* /,
          results: [
            { strategy: 'guide', text: '我们的目标其实是一致的——都是想把这件事做好。在这个前提下，关于XX条款，我有一个双赢的方案想跟您探讨。' },
            { strategy: 'praise', text: '贵方的专业度和诚意我一直很认可。为了长期合作，我们能否在XX方面找到一个双方都能接受的平衡点？' },
            { strategy: 'buffer', text: '我理解您的立场，这些顾虑很合理。同时我也希望您了解我们的实际情况……基于此，我建议咱们这样调整……' }
          ]
        }
      ]
    };

    // ===== Utility =====
    function fillNeed(text) {
      document.getElementById('needInput').value = text;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    function copyText(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('已复制到剪贴板');
        if (btn) {
          btn.classList.add('copied');
          btn.innerHTML = '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>';
          setTimeout(() => {
            btn.classList.remove('copied');
            btn.innerHTML = '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>';
          }, 1800);
        }
      });
    }

    function copyAll() {
      const cards = document.querySelectorAll('.phrase-card');
      let text = '';
      cards.forEach(c => {
        const tag = c.querySelector('.phrase-tag').textContent;
        const phrase = c.querySelector('.phrase-text').textContent;
        text += `[${tag}]\n${phrase}\n\n`;
      });
      navigator.clipboard.writeText(text.trim()).then(() => showToast('全部话术已复制'));
    }

    function regenerate() {
      generatePhrases(true);
    }

    // ===== Generate =====
    function generatePhrases(isRegen = false) {
      const scene = document.getElementById('sceneSelect').value;
      const need = document.getElementById('needInput').value.trim();
      const btn = document.getElementById('generateBtn');

      if (!scene) {
        showToast('请先选择沟通场景');
        return;
      }
      if (!need) {
        showToast('请描述您的聊天需求');
        document.getElementById('needInput').focus();
        return;
      }

      btn.disabled = true;
      btn.classList.add('loading');

      setTimeout(() => {
        const templates = sceneTemplates[scene] || sceneTemplates.work;
        let matched = [];

        for (const t of templates) {
          if (t.pattern.test(need + ' ')) {
            matched = [...matched, ...t.results];
          }
        }

        if (matched.length === 0) {
          matched = templates[templates.length - 1].results;
        }

        // Shuffle and pick 3
        const shuffled = matched.sort(() => 0.5 - Math.random());
        const picked = shuffled.slice(0, Math.min(3, shuffled.length));

        // Build HTML
        const list = document.getElementById('phrasesList');
        list.innerHTML = '';
        picked.forEach((item, idx) => {
          const s = strategies[item.strategy];
          const card = document.createElement('div');
          card.className = 'phrase-card';
          card.style.animationDelay = (idx * 0.1) + 's';
          card.innerHTML = `
            <span class="phrase-tag ${s.class}">${s.name}</span>
            <button class="copy-btn" onclick="copyText('${item.text.replace(/'/g, "\\'")}', this)" title="复制">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <rect x="9" y="9" width="13" height="13" rx="2"/>
                <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
              </svg>
            </button>
            <div class="phrase-text">${item.text}</div>
            <div class="phrase-note">${s.desc}</div>
          `;
          list.appendChild(card);
        });

        document.getElementById('introCard').style.display = 'none';
        document.getElementById('resultsArea').classList.add('show');

        btn.disabled = false;
        btn.classList.remove('loading');
      }, isRegen ? 600 : 900);
    }

    // Allow Ctrl+Enter to generate
    document.getElementById('needInput').addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.key === 'Enter') {
        generatePhrases();
      }
    });
  </script>
