<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nihongo Michi - 日语学习 Demo</title>
  <style>
    :root {
      --bg: #FFF8FA;
      --card: #FFFFFF;
      --text: #1F2937;
      --muted: #6B7280;
      --primary: #FF6B9D;
      --primary-dark: #E83E8C;
      --primary-light: #FFF0F5;
      --secondary: #0EA5E9;
      --success: #22C55E;
      --success-dark: #16A34A;
      --warning: #FFC800;
      --error: #FF4B4B;
      --border: #FCE7F3;
      --shadow: 0 4px 0 #FCE7F3;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Kaku Gothic ProN", sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(#FFD1DC 1.2px, transparent 1.2px);
      background-size: 26px 26px;
      color: var(--text);
      overflow-x: hidden;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 248, 250, 0.95);
      backdrop-filter: blur(6px);
      border-bottom: 2px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 18px;
      color: var(--primary-dark);
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--primary);
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: white;
      font-size: 18px;
      box-shadow: 0 3px 0 var(--primary-dark);
    }

    .stats-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 700;
    }

    .pill {
      background: var(--card);
      border: 2px solid var(--border);
      border-bottom: 4px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Layout */
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 20px 16px 96px;
    }

    .view {
      display: none;
      animation: fadeIn 0.25s ease;
    }

    .view.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cards */
    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 2px solid var(--border);
    }

    .card-title {
      font-size: 18px;
      font-weight: 800;
      margin: 0 0 12px;
      color: var(--text);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      border-radius: 14px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.1s ease;
      width: 100%;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border-bottom: 4px solid var(--primary-dark);
    }

    .btn-primary:hover { filter: brightness(1.05); }
    .btn-primary:active {
      transform: translateY(4px);
      border-bottom-width: 0;
    }

    .btn-secondary {
      background: white;
      color: var(--primary);
      border: 2px solid var(--primary);
      border-bottom: 4px solid var(--primary);
    }

    .btn-secondary:hover { background: var(--primary-light); }
    .btn-secondary:active {
      transform: translateY(4px);
      border-bottom-width: 2px;
    }

    .btn-success {
      background: var(--success);
      color: white;
      border-bottom: 4px solid var(--success-dark);
    }

    .btn-success:active {
      transform: translateY(4px);
      border-bottom-width: 0;
    }

    .btn-option {
      background: white;
      color: var(--text);
      border: 2px solid var(--border);
      border-bottom: 4px solid var(--border);
      font-weight: 700;
    }

    .btn-option:hover { background: var(--primary-light); }
    .btn-option:active {
      transform: translateY(4px);
      border-bottom-width: 0;
    }

    .btn-option.correct {
      background: var(--success);
      color: white;
      border-color: var(--success-dark);
      animation: pop 0.3s ease;
    }

    .btn-option.wrong {
      background: var(--error);
      color: white;
      border-color: #DC2626;
      animation: shake 0.4s ease;
    }

    .btn-option:disabled {
      opacity: 0.9;
      cursor: default;
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 28px 20px;
    }

    .hero h1 {
      font-size: 28px;
      margin: 0 0 8px;
      color: var(--primary-dark);
    }

    .hero p {
      color: var(--muted);
      margin: 0 0 20px;
      font-size: 15px;
    }

    .mascot {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 16px;
      filter: drop-shadow(0 4px 0 var(--border));
    }

    /* Progress path */
    .path {
      display: flex;
      flex-direction: column;
      gap: 0;
      position: relative;
      padding-left: 28px;
    }

    .path::before {
      content: "";
      position: absolute;
      left: 44px;
      top: 24px;
      bottom: 24px;
      width: 6px;
      background: var(--border);
      border-radius: 999px;
    }

    .path-node {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 0;
      position: relative;
      z-index: 1;
    }

    .node-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 800;
      flex-shrink: 0;
      background: white;
      border: 3px solid var(--border);
      box-shadow: var(--shadow);
    }

    .node-icon.done {
      background: var(--success);
      border-color: var(--success-dark);
      color: white;
    }

    .node-icon.current {
      background: var(--primary);
      border-color: var(--primary-dark);
      color: white;
      animation: bounce 1.6s infinite;
    }

    .node-info h3 {
      margin: 0 0 2px;
      font-size: 16px;
    }

    .node-info span {
      font-size: 13px;
      color: var(--muted);
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    /* Kana grid */
    .kana-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .kana-tab {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: white;
      font-weight: 700;
      cursor: pointer;
    }

    .kana-tab.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary-dark);
    }

    .kana-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .kana-card {
      aspect-ratio: 1;
      background: white;
      border: 2px solid var(--border);
      border-bottom: 4px solid var(--border);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: all 0.1s ease;
    }

    .kana-card:active {
      transform: translateY(4px);
      border-bottom-width: 0;
    }

    .kana-char {
      font-size: 26px;
      font-weight: 800;
      color: var(--text);
      line-height: 1;
    }

    .kana-roma {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .speaker {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 18px;
      height: 18px;
      opacity: 0.5;
    }

    /* Game */
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .progress-bar {
      height: 12px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .question-card {
      text-align: center;
      padding: 32px 20px;
    }

    .bubble {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      background: var(--primary-light);
      border: 3px solid var(--primary);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 56px;
      font-weight: 800;
      color: var(--primary-dark);
      box-shadow: 0 6px 0 var(--primary);
      animation: float 2.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .feedback {
      text-align: center;
      margin: 16px 0;
      font-weight: 800;
      min-height: 24px;
    }

    .feedback.correct { color: var(--success); }
    .feedback.wrong { color: var(--error); }

    /* Result */
    .result {
      text-align: center;
      padding: 20px;
    }

    .result .score-ring {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 8px solid var(--primary);
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
      font-size: 32px;
      font-weight: 800;
      color: var(--primary-dark);
    }

    /* Achievements */
    .achievement-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .achievement {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: white;
      border: 2px solid var(--border);
      border-radius: 14px;
    }

    .achievement.locked { opacity: 0.55; }

    .achievement-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--warning);
      display: grid;
      place-items: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .achievement h4 {
      margin: 0 0 2px;
      font-size: 15px;
    }

    .achievement p {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
    }

    /* Bottom nav */
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 2px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 0 12px;
      z-index: 50;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      padding: 6px;
    }

    .nav-item.active { color: var(--primary-dark); }

    .nav-icon {
      width: 26px;
      height: 26px;
    }

    /* XP Toast */
    .xp-toast {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--warning);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 800;
      box-shadow: 0 4px 0 #E6A800;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      transition: all 0.4s ease;
    }
    .xp-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 200;
      animation: confetti-fall 1.2s ease-out forwards;
    }
    @keyframes confetti-fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(80vh) rotate(720deg); opacity: 0; }
    }

    /* Utilities */
    .text-center { text-align: center; }
    .mb-2 { margin-bottom: 8px; }
    .mb-3 { margin-bottom: 12px; }
    .flex { display: flex; }
    .gap-2 { gap: 8px; }

    @media (max-width: 380px) {
      .kana-grid { grid-template-columns: repeat(4, 1fr); }
      .options { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon">あ</div>
      <span>Nihongo Michi</span>
    </div>
    <div class="stats-pill">
      <div class="pill" title="经验值">
        <span>⚡</span>
        <span id="xpDisplay">0</span>
      </div>
      <div class="pill" title="连续学习">
        <span>🔥</span>
        <span id="streakDisplay">1</span>
      </div>
    </div>
  </header>

  <main>
    <!-- 首页 -->
    <section class="view active" id="homeView">
      <div class="card hero">
        <div class="mascot">🌸</div>
        <h1>日本語道</h1>
        <p>像闯关一样学日语，从零基础一路通关到 N1</p>
        <button class="btn btn-primary" onclick="startGame()">开始闯关</button>
      </div>

      <div class="card">
        <h2 class="card-title">今日学习路径</h2>
        <div class="path">
          <div class="path-node">
            <div class="node-icon" id="nodeKana">あ</div>
            <div class="node-info">
              <h3>五十音图</h3>
              <span>学习平假名与片假名</span>
            </div>
          </div>
          <div class="path-node">
            <div class="node-icon" id="nodeLesson">1</div>
            <div class="node-info">
              <h3>N5 入门课</h3>
              <span>です / ます 体</span>
            </div>
          </div>
          <div class="path-node">
            <div class="node-icon" id="nodeGame">🎮</div>
            <div class="node-info">
              <h3>假名泡泡</h3>
              <span>小游戏巩固读音</span>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">每日任务</h2>
        <div class="progress-bar">
          <div class="progress-fill" id="dailyProgress" style="width: 0%"></div>
        </div>
        <p class="text-center" id="dailyText" style="color: var(--muted); font-size: 14px;">完成 0/3：浏览五十音</p>
      </div>
    </section>

    <!-- 五十音 -->
    <section class="view" id="kanaView">
      <div class="card">
        <h2 class="card-title">五十音图</h2>
        <div class="kana-tabs">
          <button class="kana-tab active" onclick="switchKanaTab('hiragana', this)">平假名</button>
          <button class="kana-tab" onclick="switchKanaTab('katakana', this)">片假名</button>
        </div>
        <div class="kana-grid" id="kanaGrid"></div>
      </div>
      <button class="btn btn-secondary" onclick="goTo('game')">去测试</button>
    </section>

    <!-- 游戏 -->
    <section class="view" id="gameView">
      <div class="card" id="gameCard">
        <div class="game-header">
          <span style="font-weight: 800;">假名泡泡</span>
          <span style="color: var(--muted); font-size: 14px;">题目 <span id="qIndex">1</span>/5</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="gameProgress" style="width: 0%"></div>
        </div>
        <div id="gameContent">
          <div class="question-card">
            <div class="bubble" id="questionBubble">あ</div>
            <p style="color: var(--muted); margin: 0 0 16px;">选择正确的读音</p>
            <div class="options" id="optionsBox"></div>
            <div class="feedback" id="feedback"></div>
            <button class="btn btn-primary" id="nextBtn" style="display:none;" onclick="nextQuestion()">下一题</button>
          </div>
        </div>
        <div class="result" id="resultBox" style="display:none;">
          <div class="score-ring" id="scoreRing">0</div>
          <h3 class="card-title">闯关完成！</h3>
          <p id="resultText" style="color: var(--muted);"></p>
          <button class="btn btn-success mb-2" onclick="startGame()">再玩一次</button>
          <button class="btn btn-secondary" onclick="goTo('profile')">查看成就</button>
        </div>
      </div>
    </section>

    <!-- 个人中心 -->
    <section class="view" id="profileView">
      <div class="card text-center">
        <div class="mascot">🦊</div>
        <h2 class="card-title" style="margin-bottom: 4px;">学习小达人</h2>
        <p style="color: var(--muted); margin: 0 0 16px;">连续学习 <span id="profileStreak">1</span> 天 · 总经验 <span id="profileXp">0</span></p>
        <div class="flex gap-2" style="justify-content: center;">
          <button class="btn btn-secondary" style="width:auto; padding: 10px 16px;" onclick="resetProgress()">重置进度</button>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">成就徽章</h2>
        <div class="achievement-list" id="achievementList"></div>
      </div>
    </section>
  </main>

  <nav>
    <button class="nav-item active" data-nav="home" onclick="goTo('home')">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      首页
    </button>
    <button class="nav-item" data-nav="kana" onclick="goTo('kana')">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"></rect><path d="M8 12h8"></path><path d="M12 8v8"></path></svg>
      五十音
    </button>
    <button class="nav-item" data-nav="game" onclick="goTo('game')">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 12h.01"></path><path d="M16 12h.01"></path><path d="M9 16a3 3 0 0 0 6 0"></path></svg>
      闯关
    </button>
    <button class="nav-item" data-nav="profile" onclick="goTo('profile')">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      我的
    </button>
  </nav>

  <div class="xp-toast" id="xpToast"></div>

  <script>
    // 数据
    const hiragana = [
      { kana: "あ", roma: "a" }, { kana: "い", roma: "i" }, { kana: "う", roma: "u" }, { kana: "え", roma: "e" }, { kana: "お", roma: "o" },
      { kana: "か", roma: "ka" }, { kana: "き", roma: "ki" }, { kana: "く", roma: "ku" }, { kana: "け", roma: "ke" }, { kana: "こ", roma: "ko" },
      { kana: "さ", roma: "sa" }, { kana: "し", roma: "shi" }, { kana: "す", roma: "su" }, { kana: "せ", roma: "se" }, { kana: "そ", roma: "so" },
      { kana: "た", roma: "ta" }, { kana: "ち", roma: "chi" }, { kana: "つ", roma: "tsu" }, { kana: "て", roma: "te" }, { kana: "と", roma: "to" },
      { kana: "な", roma: "na" }, { kana: "に", roma: "ni" }, { kana: "ぬ", roma: "nu" }, { kana: "ね", roma: "ne" }, { kana: "の", roma: "no" },
      { kana: "は", roma: "ha" }, { kana: "ひ", roma: "hi" }, { kana: "ふ", roma: "fu" }, { kana: "へ", roma: "he" }, { kana: "ほ", roma: "ho" },
      { kana: "ま", roma: "ma" }, { kana: "み", roma: "mi" }, { kana: "む", roma: "mu" }, { kana: "め", roma: "me" }, { kana: "も", roma: "mo" },
      { kana: "や", roma: "ya" }, { kana: "ゆ", roma: "yu" }, { kana: "よ", roma: "yo" },
      { kana: "ら", roma: "ra" }, { kana: "り", roma: "ri" }, { kana: "る", roma: "ru" }, { kana: "れ", roma: "re" }, { kana: "ろ", roma: "ro" },
      { kana: "わ", roma: "wa" }, { kana: "を", roma: "wo" }, { kana: "ん", roma: "n" }
    ];

    const katakana = [
      { kana: "ア", roma: "a" }, { kana: "イ", roma: "i" }, { kana: "ウ", roma: "u" }, { kana: "エ", roma: "e" }, { kana: "オ", roma: "o" },
      { kana: "カ", roma: "ka" }, { kana: "キ", roma: "ki" }, { kana: "ク", roma: "ku" }, { kana: "ケ", roma: "ke" }, { kana: "コ", roma: "ko" },
      { kana: "サ", roma: "sa" }, { kana: "シ", roma: "shi" }, { kana: "ス", roma: "su" }, { kana: "セ", roma: "se" }, { kana: "ソ", roma: "so" },
      { kana: "タ", roma: "ta" }, { kana: "チ", roma: "chi" }, { kana: "ツ", roma: "tsu" }, { kana: "テ", roma: "te" }, { kana: "ト", roma: "to" },
      { kana: "ナ", roma: "na" }, { kana: "ニ", roma: "ni" }, { kana: "ヌ", roma: "nu" }, { kana: "ネ", roma: "ne" }, { kana: "ノ", roma: "no" },
      { kana: "ハ", roma: "ha" }, { kana: "ヒ", roma: "hi" }, { kana: "フ", roma: "fu" }, { kana: "ヘ", roma: "he" }, { kana: "ホ", roma: "ho" },
      { kana: "マ", roma: "ma" }, { kana: "ミ", roma: "mi" }, { kana: "ム", roma: "mu" }, { kana: "メ", roma: "me" }, { kana: "モ", roma: "mo" },
      { kana: "ヤ", roma: "ya" }, { kana: "ユ", roma: "yu" }, { kana: "ヨ", roma: "yo" },
      { kana: "ラ", roma: "ra" }, { kana: "リ", roma: "ri" }, { kana: "ル", roma: "ru" }, { kana: "レ", roma: "re" }, { kana: "ロ", roma: "ro" },
      { kana: "ワ", roma: "wa" }, { kana: "ヲ", roma: "wo" }, { kana: "ン", roma: "n" }
    ];

    const achievements = [
      { id: "first_step", icon: "🌱", title: "踏出第一步", desc: "完成第一次小游戏" },
      { id: "kana_master", icon: "あ", title: "五十音达人", desc: "点击 3 个假名并跟读" },
      { id: "game_master", icon: "🎮", title: "游戏达人", desc: "小游戏获得满分" },
      { id: "streak_star", icon: "🔥", title: "连胜之星", desc: "连续学习 3 天" }
    ];

    // 状态
    let state = loadState();
    let currentKanaTab = "hiragana";
    let gameQuestions = [];
    let gameIndex = 0;
    let gameScore = 0;
    let answered = false;

    function loadState() {
      const raw = localStorage.getItem("nihongoMichiDemo");
      const defaults = { xp: 0, streak: 1, gamesCompleted: 0, achievements: [], visitedKana: false, kanaClicks: 0, lastStudyDate: null };
      if (!raw) return defaults;
      try { return { ...defaults, ...JSON.parse(raw) }; } catch { return defaults; }
    }

    function getToday() {
      return new Date().toISOString().slice(0, 10);
    }

    function computeStreak() {
      const today = getToday();
      if (!state.lastStudyDate) {
        state.streak = 1;
        return;
      }
      if (state.lastStudyDate === today) return;
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const yestStr = yesterday.toISOString().slice(0, 10);
      state.streak = state.lastStudyDate === yestStr ? state.streak + 1 : 1;
    }

    function recordStudy() {
      computeStreak();
      state.lastStudyDate = getToday();
    }

    function saveState() {
      localStorage.setItem("nihongoMichiDemo", JSON.stringify(state));
    }

    function updateStats() {
      document.getElementById("xpDisplay").textContent = state.xp;
      document.getElementById("streakDisplay").textContent = state.streak;
      document.getElementById("profileXp").textContent = state.xp;
      document.getElementById("profileStreak").textContent = state.streak;
      updatePath();
      updateDailyTask();
      renderAchievements();
    }

    function updatePath() {
      const kanaDone = state.kanaClicks >= 3;
      const gameDone = state.gamesCompleted > 0;
      const nodes = {
        kana: document.getElementById("nodeKana"),
        lesson: document.getElementById("nodeLesson"),
        game: document.getElementById("nodeGame"),
      };
      Object.values(nodes).forEach((n) => (n.className = "node-icon"));
      nodes.kana.textContent = kanaDone ? "✓" : "あ";
      nodes.lesson.textContent = gameDone ? "✓" : "1";
      nodes.game.textContent = gameDone ? "✓" : "🎮";
      if (kanaDone) nodes.kana.classList.add("done");
      if (gameDone) {
        nodes.lesson.classList.add("done");
        nodes.game.classList.add("done");
      }
      if (!kanaDone) nodes.kana.classList.add("current");
      else if (!gameDone) nodes.lesson.classList.add("current");
      // 全部完成后不添加 current，保持 done 样式
    }

    function updateDailyTask() {
      const tasks = [
        { done: state.visitedKana, label: "浏览五十音" },
        { done: state.kanaClicks >= 3, label: "跟读 3 个假名" },
        { done: state.gamesCompleted > 0, label: "完成假名泡泡" },
      ];
      const completed = tasks.filter((t) => t.done).length;
      const next = tasks.find((t) => !t.done) || tasks[tasks.length - 1];
      document.getElementById("dailyProgress").style.width = (completed / tasks.length * 100) + "%";
      document.getElementById("dailyText").textContent = `完成 ${completed}/3：${next.label}`;
    }

    function goTo(view) {
      document.querySelectorAll(".view").forEach(el => el.classList.remove("active"));
      document.getElementById(view + "View").classList.add("active");
      document.querySelectorAll(".nav-item").forEach(el => el.classList.remove("active"));
      document.querySelector(`.nav-item[data-nav="${view}"]`).classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
      if (view === "kana") {
        state.visitedKana = true;
        saveState();
        renderKanaGrid();
        updateStats();
      }
      if (view === "game" && (gameQuestions.length === 0 || gameIndex >= gameQuestions.length)) {
        startGame();
        return;
      }
      if (view === "profile") renderAchievements();
    }

    // 五十音渲染
    function renderKanaGrid() {
      const grid = document.getElementById("kanaGrid");
      const data = currentKanaTab === "hiragana" ? hiragana : katakana;
      grid.innerHTML = data.map(item => `
        <div class="kana-card" onclick="speak('${item.kana}')">
          <svg class="speaker" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
          <div class="kana-char">${item.kana}</div>
          <div class="kana-roma">${item.roma}</div>
        </div>
      `).join("");
    }

    function switchKanaTab(tab, btn) {
      currentKanaTab = tab;
      document.querySelectorAll(".kana-tab").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderKanaGrid();
    }

    function speak(text) {
      state.kanaClicks++;
      if (state.kanaClicks >= 3 && !state.achievements.includes("kana_master")) {
        state.achievements.push("kana_master");
      }
      saveState();
      updateStats();

      if ("speechSynthesis" in window) {
        try {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = "ja-JP";
          u.rate = 0.9;
          window.speechSynthesis.speak(u);
        } catch (e) {
          console.warn("语音合成失败：", e);
        }
      }
    }

    // 游戏逻辑
    function startGame() {
      gameQuestions = buildQuestions(5);
      gameIndex = 0;
      gameScore = 0;
      document.getElementById("gameContent").style.display = "block";
      document.getElementById("resultBox").style.display = "none";
      goTo("game");
      renderQuestion();
    }

    function buildQuestions(count) {
      const source = currentKanaTab === "katakana" ? katakana : hiragana;
      const shuffled = [...source].sort(() => Math.random() - 0.5);
      return shuffled.slice(0, count).map(item => {
        const distractors = source
          .filter(x => x.roma !== item.roma)
          .sort(() => Math.random() - 0.5)
          .slice(0, 3)
          .map(x => x.roma);
        const options = [...distractors, item.roma].sort(() => Math.random() - 0.5);
        return { kana: item.kana, answer: item.roma, options };
      });
    }

    function renderQuestion() {
      answered = false;
      const q = gameQuestions[gameIndex];
      document.getElementById("qIndex").textContent = gameIndex + 1;
      document.getElementById("questionBubble").textContent = q.kana;
      document.getElementById("gameProgress").style.width = (gameIndex / gameQuestions.length * 100) + "%";
      document.getElementById("feedback").textContent = "";
      document.getElementById("feedback").className = "feedback";
      document.getElementById("nextBtn").style.display = "none";

      const box = document.getElementById("optionsBox");
      box.innerHTML = q.options.map(opt => `
        <button class="btn btn-option" data-option="${opt}" onclick="chooseAnswer(this)">${opt}</button>
      `).join("");
    }

    function chooseAnswer(btn) {
      if (answered) return;
      answered = true;
      const option = btn.dataset.option;
      const q = gameQuestions[gameIndex];
      const correct = option === q.answer;
      const buttons = document.querySelectorAll("#optionsBox .btn-option");

      buttons.forEach(b => {
        b.disabled = true;
        if (b.dataset.option === q.answer) b.classList.add("correct");
      });

      const feedback = document.getElementById("feedback");
      if (correct) {
        gameScore++;
        btn.classList.add("correct");
        feedback.textContent = "太棒了！🎉";
        feedback.classList.add("correct");
      } else {
        btn.classList.add("wrong");
        feedback.textContent = `正确答案是 ${q.answer}`;
        feedback.classList.add("wrong");
      }
      document.getElementById("nextBtn").style.display = "inline-flex";
    }

    function nextQuestion() {
      gameIndex++;
      if (gameIndex >= gameQuestions.length) {
        finishGame();
      } else {
        renderQuestion();
      }
    }

    function finishGame() {
      document.getElementById("gameContent").style.display = "none";
      document.getElementById("resultBox").style.display = "block";
      document.getElementById("gameProgress").style.width = "100%";
      document.getElementById("scoreRing").textContent = gameScore + "/" + gameQuestions.length;

      const gained = gameScore * 10;
      state.xp += gained;
      state.gamesCompleted++;

      if (!state.achievements.includes("first_step")) state.achievements.push("first_step");
      if (gameScore === gameQuestions.length && !state.achievements.includes("game_master")) {
        state.achievements.push("game_master");
      }

      recordStudy();
      if (state.streak >= 3 && !state.achievements.includes("streak_star")) {
        state.achievements.push("streak_star");
      }

      saveState();
      updateStats();
      showXpToast(gained);
      if (gameScore === gameQuestions.length) launchConfetti();

      let msg = `获得 ${gained} 经验值！`;
      if (gameScore === gameQuestions.length) msg += " 满分通关，解锁游戏达人徽章！";
      document.getElementById("resultText").textContent = msg;
    }

    function showXpToast(amount) {
      const el = document.getElementById("xpToast");
      el.textContent = `+${amount} XP`;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 1500);
    }

    function launchConfetti() {
      const colors = ["#FF6B9D", "#0EA5E9", "#22C55E", "#FFC800"];
      for (let i = 0; i < 40; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.animationDuration = (0.8 + Math.random() * 0.8) + "s";
        c.style.animationDelay = Math.random() * 0.3 + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 1500);
      }
    }

    function renderAchievements() {
      const list = document.getElementById("achievementList");
      list.innerHTML = achievements.map(a => {
        const unlocked = state.achievements.includes(a.id);
        return `
          <div class="achievement ${unlocked ? "" : "locked"}">
            <div class="achievement-icon">${a.icon}</div>
            <div>
              <h4>${a.title}</h4>
              <p>${unlocked ? "已解锁 · " + a.desc : "未解锁 · " + a.desc}</p>
            </div>
          </div>
        `;
      }).join("");
    }

    function resetProgress() {
      if (confirm("确定要重置所有学习进度吗？")) {
        state = { xp: 0, streak: 1, gamesCompleted: 0, achievements: [], visitedKana: false, kanaClicks: 0, lastStudyDate: null };
        saveState();
        updateStats();
        goTo("home");
      }
    }

    // 初始化
    computeStreak();
    renderKanaGrid();
    updateStats();
  </script>
</body>
</html>
