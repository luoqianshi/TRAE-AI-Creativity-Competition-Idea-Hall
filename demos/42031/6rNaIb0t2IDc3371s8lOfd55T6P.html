<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>碎片时间阅读助手 | TRAE AI创造力大赛</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: #333; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }
        .container { 
            background: #fff; 
            padding: 45px; 
            border-radius: 20px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); 
            width: 100%; 
            max-width: 420px; 
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
        }
        .logo-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        .logo-badge svg { width: 16px; height: 16px; }
        h2 { 
            margin-top: 0; 
            color: #2d3748; 
            font-size: 22px; 
            font-weight: 700;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #718096;
            font-size: 14px;
            margin-bottom: 35px;
        }
        .time-options { 
            display: flex; 
            justify-content: space-between; 
            margin: 30px 0;
            gap: 12px;
        }
        .time-btn { 
            flex: 1; 
            padding: 18px 12px; 
            border: 2px solid #e2e8f0; 
            background: #f7fafc; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 600;
            color: #4a5568;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .time-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s;
        }
        .time-btn:hover::before { left: 100%; }
        .time-btn:hover { 
            border-color: #667eea; 
            background: #eef2ff; 
            color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2);
        }
        .time-btn.active { 
            border-color: #667eea; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: #fff;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            transform: translateY(-2px);
        }
        .time-btn.active::before { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); }
        .time-btn .minute-label { display: block; font-size: 12px; font-weight: 400; opacity: 0.8; margin-top: 2px; }
        #actionBtn { 
            width: 100%; 
            padding: 18px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: #fff; 
            border: none; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: 700;
            cursor: pointer; 
            margin-top: 15px; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
        }
        #actionBtn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        #actionBtn:hover::before { left: 100%; }
        #actionBtn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.5);
        }
        #actionBtn:active { transform: translateY(0); }
        #actionBtn.loading {
            pointer-events: none;
            opacity: 0.8;
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .result-card { 
            margin-top: 30px; 
            padding: 24px; 
            background: #fff; 
            border: 1px solid #e2e8f0; 
            border-radius: 16px; 
            display: none; 
            text-align: left;
            animation: cardSlideIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        }
        @keyframes cardSlideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .ai-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            border-radius: 12px;
        }
        .ai-badge svg { width: 12px; height: 12px; }
        .result-title { 
            font-weight: 700; 
            font-size: 18px; 
            color: #2d3748;
            line-height: 1.4;
            margin-bottom: 12px;
        }
        .result-meta { 
            display: flex;
            gap: 16px;
            font-size: 12px; 
            color: #718096; 
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .result-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .result-meta svg { width: 14px; height: 14px; }
        .result-summary { 
            font-size: 14px; 
            color: #4a5568; 
            line-height: 1.7;
            background: #f7fafc;
            padding: 16px;
            border-radius: 10px;
            border-left: 3px solid #667eea;
            position: relative;
        }
        .result-summary::before {
            content: '';
            position: absolute;
            top: 16px;
            left: -3px;
            width: 3px;
            height: 20px;
            background: #667eea;
        }
        .start-reading-btn {
            width: 100%;
            padding: 14px;
            background: #f7fafc;
            color: #667eea;
            border: 1.5px solid #667eea;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 18px;
            transition: all 0.2s;
        }
        .start-reading-btn:hover {
            background: #667eea;
            color: #fff;
        }
        .empty-state {
            display: none;
            margin-top: 20px;
            padding: 16px;
            background: #fff5f5;
            border: 1px solid #fed7d7;
            border-radius: 8px;
            color: #c53030;
            font-size: 13px;
            animation: shake 0.4s;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .footer-note {
            margin-top: 25px;
            font-size: 12px;
            color: #a0aec0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-badge">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            TRAE AI创造力大赛
        </div>
        
        <h2>告诉助手，你现在有几分钟？</h2>
        <p class="subtitle">让AI为你匹配最适合当下阅读的文章</p>
        
        <div class="time-options">
            <button class="time-btn" onclick="selectTime(3, this)">
                3<span class="minute-label">分钟</span>
            </button>
            <button class="time-btn" onclick="selectTime(5, this)">
                5<span class="minute-label">分钟</span>
            </button>
            <button class="time-btn" onclick="selectTime(10, this)">
                10<span class="minute-label">分钟</span>
            </button>
        </div>
        
        <button id="actionBtn" onclick="matchArticle()">
            从收藏夹捞一篇文章
        </button>
        
        <div class="empty-state" id="emptyState">
            ⚠️ 请先选择您当前拥有的空闲时间！
        </div>

        <div class="result-card" id="resultCard">
            <div class="card-header">
                <div class="ai-badge">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2a10 10 0 1010 10A10 10 0 0012 2zm0 18a8 8 0 118-8 8 8 0 01-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
                    </svg>
                    AI智能匹配
                </div>
            </div>
            
            <div class="result-title" id="articleTitle"></div>
            
            <div class="result-meta" id="articleMeta">
                <span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                    </svg>
                    <span id="readTime"></span>
                </span>
                <span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                    <span id="articleTags"></span>
                </span>
            </div>
            
            <div class="result-summary" id="articleSummary"></div>
            
            <button class="start-reading-btn" onclick="startReading()">
                📖 开始阅读
            </button>
        </div>
        
        <p class="footer-note">基于TRAE Work生成 | 学习工作赛道参赛作品</p>
    </div>

    <script>
        let selectedTime = 0;
        const mockDatabase = {
            3: { 
                title: "如何用STAR法则写简历", 
                tags: "职场 / 效率", 
                summary: "AI智能摘要：STAR法则代表情境(Situation)、任务(Task)、行动(Action)和结果(Result)。本文教你用4个步骤精简描述工作经验，3分钟即可读完并掌握要点，让你的简历脱颖而出。" 
            },
            5: { 
                title: "产品经理必懂的A/B测试基础", 
                tags: "产品 / 数据", 
                summary: "AI智能摘要：A/B测试是验证产品决策的核心手段。本文介绍了如何设置对照组、控制变量以及判断数据显著性，通过实际案例帮助你快速掌握A/B测试的核心方法论。" 
            },
            10: { 
                title: "大语言模型(LLM)原理解析与应用探讨", 
                tags: "AI / 深度阅读", 
                summary: "AI智能摘要：本文深入浅出地拆解了Transformer架构的核心原理，包括自注意力机制、编码器-解码器结构等关键概念，并探讨了Prompt工程的进阶技巧和实际应用场景。" 
            }
        };

        function selectTime(minutes, btn) {
            selectedTime = minutes;
            document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('emptyState').style.display = 'none';
        }

        function matchArticle() {
            if (selectedTime === 0) {
                const emptyState = document.getElementById('emptyState');
                emptyState.style.display = 'block';
                setTimeout(() => { emptyState.style.display = 'none'; }, 2500);
                return;
            }
            
            const btn = document.getElementById('actionBtn');
            btn.innerHTML = '<span class="loading-spinner"></span>正在AI匹配中...';
            btn.classList.add('loading');
            
            document.getElementById('resultCard').style.display = 'none';
            
            setTimeout(() => {
                const article = mockDatabase[selectedTime];
                document.getElementById('articleTitle').innerText = article.title;
                document.getElementById('readTime').innerText = `预计阅读 ${selectedTime} 分钟`;
                document.getElementById('articleTags').innerText = article.tags;
                document.getElementById('articleSummary').innerText = article.summary;
                
                const resultCard = document.getElementById('resultCard');
                resultCard.style.display = 'block';
                
                btn.innerHTML = '重新匹配文章';
                btn.classList.remove('loading');
            }, 1200);
        }

        function startReading() {
            const title = document.getElementById('articleTitle').innerText;
            alert(`即将开始阅读：《${title}》\n\n在实际产品中，这里将跳转到原文阅读页面，支持沉浸式阅读体验。`);
        }
    </script>
</body>
</html>
