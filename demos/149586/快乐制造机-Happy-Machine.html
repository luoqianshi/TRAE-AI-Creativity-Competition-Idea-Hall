<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🎉 快乐制造机 | Happy Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Pacifico&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --c-purple:#8B5CF6;--c-pink:#EC4899;--c-yellow:#FACC15;
    --c-cyan:#22D3EE;--c-orange:#FB923C;--c-green:#84CC16;
    --c-blue:#3B82F6;--c-dark:#1F2937;--c-cream:#FFF8E7;
    --shadow-lg:0 20px 60px -15px rgba(139,92,246,.55);
    --shadow-btn:0 6px 0 #1F2937,0 8px 20px rgba(0,0,0,.25);
    --shadow-btn-press:0 2px 0 #1F2937,0 3px 8px rgba(0,0,0,.2);
  }
  html,body{height:100%;overflow-x:hidden}
  body{
    font-family:'ZCOOL KuaiLe','Ma Shan Zheng',system-ui,sans-serif;
    color:var(--c-dark);
    background:
      radial-gradient(ellipse at 10% 0%, #FDE68A55, transparent 50%),
      radial-gradient(ellipse at 100% 100%, #C4B5FD55, transparent 50%),
      radial-gradient(ellipse at 50% 50%, #FCE7F355, transparent 60%),
      linear-gradient(135deg,#FFF8E7 0%,#F3E8FF 50%,#FEF3C7 100%);
    position:relative;
    min-height:100vh;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
    background-image:
      radial-gradient(circle at 20% 30%, var(--c-yellow) 2px, transparent 3px),
      radial-gradient(circle at 80% 70%, var(--c-pink) 2px, transparent 3px),
      radial-gradient(circle at 60% 20%, var(--c-cyan) 2px, transparent 3px),
      radial-gradient(circle at 30% 80%, var(--c-green) 2px, transparent 3px);
    background-size:320px 320px,280px 280px,420px 420px,380px 380px;
    opacity:.5;
    animation:bgShift 30s linear infinite;
  }
  @keyframes bgShift{from{background-position:0 0}to{background-position:800px 600px}}

  /* floating emoji decorations */
  .float-emoji{position:fixed;font-size:3rem;pointer-events:none;z-index:2;opacity:.7;animation:floatUp linear infinite}
  @keyframes floatUp{
    0%{transform:translateY(110vh) rotate(0deg);opacity:0}
    10%{opacity:.8}
    90%{opacity:.8}
    100%{transform:translateY(-120px) rotate(360deg);opacity:0}
  }

  .app{position:relative;z-index:5;max-width:1100px;margin:0 auto;padding:24px 20px 60px}

  /* Header */
  header{text-align:center;margin-bottom:28px;position:relative}
  header h1{
    font-size:clamp(2.4rem,6vw,4rem);
    font-family:'ZCOOL KuaiLe',sans-serif;
    background:linear-gradient(92deg,var(--c-purple) 0%,var(--c-pink) 30%,var(--c-orange) 55%,var(--c-yellow) 75%,var(--c-cyan) 100%);
    background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
    letter-spacing:4px;
    animation:shine 4s linear infinite;
    display:inline-block;
    filter:drop-shadow(0 4px 0 rgba(139,92,246,.15));
  }
  @keyframes shine{to{background-position:200% center}}
  header .sub{
    margin-top:8px;font-size:clamp(.95rem,2vw,1.15rem);color:#6B7280;
    font-family:'Pacifico',cursive;letter-spacing:1px;
  }
  header .sub span{animation:bounce 2s infinite;display:inline-block}
  header .sub span:nth-child(2){animation-delay:.1s}
  header .sub span:nth-child(3){animation-delay:.2s}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

  /* Quick actions */
  .quick-actions{position:fixed;top:20px;right:20px;display:flex;gap:8px;z-index:50}
  .qa-btn{
    width:44px;height:44px;border-radius:14px;border:none;cursor:pointer;
    background:#fff;font-size:1.3rem;box-shadow:var(--shadow-btn);
    transition:all .15s ease;display:grid;place-items:center;
  }
  .qa-btn:hover{transform:translateY(-2px) rotate(-5deg)}
  .qa-btn:active{transform:translateY(3px);box-shadow:var(--shadow-btn-press)}
  .qa-badge{
    position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;
    background:var(--c-pink);color:#fff;border-radius:10px;font-size:.7rem;
    display:grid;place-items:center;padding:0 5px;box-shadow:0 2px 4px rgba(0,0,0,.2);
  }

  /* Main layout */
  .layout{
    display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start;
  }
  @media(max-width:920px){.layout{grid-template-columns:1fr}}

  /* Slot Machine */
  .slot-wrap{position:relative;padding-top:30px;display:flex;justify-content:center;align-items:flex-start}
  .slot{
    position:relative;width:min(460px,100%);
    background:linear-gradient(180deg,#4C1D95 0%,#5B21B6 50%,#6D28D9 100%);
    border-radius:40px 40px 28px 28px;
    padding:30px 22px 90px;
    box-shadow:
      0 0 0 8px #7C3AED,
      0 0 0 12px var(--c-dark),
      var(--shadow-lg);
  }
  /* bulbs */
  .bulbs{position:absolute;inset:14px;pointer-events:none}
  .bulb{
    position:absolute;width:14px;height:14px;border-radius:50%;
    background:#FCD34D;box-shadow:0 0 8px #FBBF24,0 0 16px #F59E0B;
    animation:bulbFlash 1.6s steps(2) infinite;
  }
  @keyframes bulbFlash{50%{opacity:.3;transform:scale(.85)}}
  .bulbs .top-row,.bulbs .bot-row{position:absolute;left:22px;right:22px;display:flex;justify-content:space-between}
  .bulbs .top-row{top:0}
  .bulbs .bot-row{bottom:60px}
  .bulbs .left-col,.bulbs .right-col{position:absolute;top:30px;bottom:80px;display:flex;flex-direction:column;justify-content:space-between}
  .bulbs .left-col{left:0}
  .bulbs .right-col{right:0}
  .bulb.b1{background:#F87171;animation-delay:.1s;box-shadow:0 0 8px #F87171}
  .bulb.b2{background:#FBBF24;animation-delay:.2s;box-shadow:0 0 8px #FBBF24}
  .bulb.b3{background:#34D399;animation-delay:.3s;box-shadow:0 0 8px #34D399}
  .bulb.b4{background:#60A5FA;animation-delay:.4s;box-shadow:0 0 8px #60A5FA}
  .bulb.b5{background:#C084FC;animation-delay:.5s;box-shadow:0 0 8px #C084FC}
  .bulb.b6{background:#F472B6;animation-delay:.6s;box-shadow:0 0 8px #F472B6}

  .slot-window-wrap{
    background:linear-gradient(180deg,#111827 0%,#1F2937 100%);
    border-radius:24px;padding:14px;
    box-shadow:inset 0 4px 12px rgba(0,0,0,.8),0 0 0 4px #374151,0 0 0 6px #111827;
  }
  .slot-window{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
    background:#0f172a;border-radius:16px;padding:12px 8px;
  }
  .reel{
    position:relative;height:90px;border-radius:12px;overflow:hidden;
    background:linear-gradient(180deg,#fff 0%,#FFF8E7 50%,#fff 100%);
    box-shadow:inset 0 0 20px rgba(0,0,0,.15),0 0 0 2px #fff;
  }
  .reel::before,.reel::after{
    content:"";position:absolute;left:0;right:0;height:20px;z-index:2;pointer-events:none;
  }
  .reel::before{top:0;background:linear-gradient(180deg,rgba(15,23,42,.6),transparent)}
  .reel::after{bottom:0;background:linear-gradient(0deg,rgba(15,23,42,.6),transparent)}
  .reel-inner{position:absolute;left:0;right:0;top:0;will-change:transform}
  .reel-cell{height:90px;display:grid;place-items:center;font-size:3rem}
  .reel.spinning .reel-inner{animation:spin .25s linear infinite}
  @keyframes spin{to{transform:translateY(-90px)}}

  /* Lever */
  .lever{
    position:absolute;right:-42px;top:40%;transform:translateY(-50%);
    width:50px;cursor:pointer;user-select:none;z-index:5;
  }
  .lever-knob{
    width:50px;height:50px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#FECACA 0%,#EF4444 50%,#B91C1C 100%);
    box-shadow:0 6px 0 #7F1D1D,0 10px 22px rgba(0,0,0,.4),inset -4px -4px 10px rgba(0,0,0,.3);
    transition:all .15s ease;
  }
  .lever-stick{
    width:14px;height:90px;margin:-4px auto 0;
    background:linear-gradient(90deg,#9CA3AF 0%,#E5E7EB 50%,#9CA3AF 100%);
    border-radius:0 0 4px 4px;
    box-shadow:inset -2px 0 4px rgba(0,0,0,.2);
    transform-origin:top center;
    transition:transform .25s cubic-bezier(.68,-.55,.27,1.55);
  }
  .lever:hover .lever-knob{animation:knobWobble 1s ease-in-out infinite}
  @keyframes knobWobble{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  .lever.pulled .lever-stick{transform:rotate(55deg)}
  .lever.pulled .lever-knob{transform:translateY(6px);box-shadow:0 2px 0 #7F1D1D,0 4px 10px rgba(0,0,0,.3)}

  .prompt{
    text-align:center;margin-top:20px;
    color:#fff;font-family:'Ma Shan Zheng',serif;font-size:1.1rem;
    letter-spacing:3px;text-shadow:0 2px 4px rgba(0,0,0,.5);
    opacity:.9;
  }
  .prompt .arrow{display:inline-block;animation:arrowPoint 1.4s ease-in-out infinite}
  @keyframes arrowPoint{50%{transform:translateX(8px)}}

  /* Legs & Base */
  .legs{display:flex;justify-content:space-between;padding:0 30px;margin-top:-2px}
  .legs span{width:26px;height:40px;background:#374151;border-radius:0 0 10px 10px;box-shadow:0 4px 8px rgba(0,0,0,.3)}

  /* Result Card */
  .result-col{padding-top:10px}
  .result-wrap{position:relative;min-height:320px}
  .result-card{
    position:relative;background:#fff;border-radius:28px;padding:26px 24px 22px;
    box-shadow:var(--shadow-lg);
    transform-origin:center center;
    border:3px dashed transparent;
    transition:all .35s cubic-bezier(.34,1.56,.64,1);
  }
  .result-card::before{
    content:"";position:absolute;inset:6px;border:3px dashed var(--c-yellow);
    border-radius:22px;opacity:.5;pointer-events:none;
    animation:rotateBorder 20s linear infinite;
  }
  @keyframes rotateBorder{
    0%{clip-path:polygon(0 0,100% 0,100% 3px,3px 3px,3px calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 3px,100% 3px,100% 100%,0 100%)}
    50%{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,0 calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 3px,3px 3px,3px calc(100% - 3px),0 calc(100% - 3px))}
  }
  .result-card.empty{
    transform:scale(.9) rotate(-2deg);
    opacity:.8;
    background:repeating-linear-gradient(45deg,#fff 0 20px,#FEF3C7 20px 40px);
  }
  .result-card.show{animation:popIn .6s cubic-bezier(.34,1.56,.64,1)}
  @keyframes popIn{
    0%{transform:scale(.3) rotate(-15deg);opacity:0}
    60%{transform:scale(1.08) rotate(4deg);opacity:1}
    100%{transform:scale(1) rotate(0)}
  }
  .type-badge{
    display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;
    color:#fff;font-size:.9rem;letter-spacing:1px;margin-bottom:16px;
    box-shadow:0 4px 0 rgba(0,0,0,.15);
  }
  .type-badge.joke{background:linear-gradient(135deg,#EC4899,#F472B6)}
  .type-badge.cold{background:linear-gradient(135deg,#06B6D4,#22D3EE)}
  .type-badge.poison{background:linear-gradient(135deg,#7C3AED,#A78BFA)}
  .type-badge.meme{background:linear-gradient(135deg,#F59E0B,#FACC15)}
  .type-badge.suggestion{background:linear-gradient(135deg,#65A30D,#84CC16)}
  .type-badge.fortune{background:linear-gradient(135deg,#EA580C,#FB923C)}

  .result-text{
    font-size:clamp(1.1rem,2.4vw,1.45rem);line-height:1.75;
    font-family:'Ma Shan Zheng',serif;color:var(--c-dark);
    margin:8px 0 22px;min-height:100px;
    position:relative;z-index:2;
  }
  .result-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
  .result-tags span{
    background:#F3F4F6;color:#6B7280;font-size:.75rem;
    padding:3px 10px;border-radius:999px;border:1px dashed #D1D5DB;
  }
  .result-actions{display:flex;gap:10px;flex-wrap:wrap}
  .r-btn{
    flex:1;min-width:100px;padding:12px 14px;border-radius:14px;border:none;cursor:pointer;
    font-family:inherit;font-size:1rem;color:#fff;box-shadow:var(--shadow-btn);
    transition:all .12s ease;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  }
  .r-btn:hover{transform:translateY(-2px)}
  .r-btn:active{transform:translateY(3px);box-shadow:var(--shadow-btn-press)}
  .r-btn.save{background:linear-gradient(135deg,#8B5CF6,#A78BFA)}
  .r-btn.copy{background:linear-gradient(135deg,#2563EB,#60A5FA)}
  .r-btn.share{background:linear-gradient(135deg,#059669,#34D399)}
  .r-btn.again{background:linear-gradient(135deg,#DC2626,#F87171);flex:0 0 auto;padding:12px 18px}

  .empty-hint{
    position:absolute;inset:0;display:grid;place-items:center;
    text-align:center;color:#9CA3AF;font-family:'ZCOOL KuaiLe';
  }
  .empty-hint .b{font-size:4rem;display:block;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-10px) rotate(6deg)}}
  .empty-hint p{font-size:1.1rem;margin-top:8px;letter-spacing:2px}

  /* Energy bar */
  .energy{
    margin-top:24px;background:#fff;border-radius:22px;padding:16px 18px;
    box-shadow:0 10px 30px -10px rgba(0,0,0,.15);
  }
  .energy-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:12px;flex-wrap:wrap}
  .level-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:linear-gradient(135deg,var(--c-purple),var(--c-pink));
    color:#fff;padding:4px 12px;border-radius:999px;font-size:.9rem;
    box-shadow:0 3px 0 rgba(0,0,0,.15);
  }
  .next-hint{font-size:.85rem;color:#6B7280}
  .next-hint b{color:var(--c-purple)}
  .bar{position:relative;height:16px;background:#F3F4F6;border-radius:999px;overflow:hidden;border:2px solid #fff;box-shadow:inset 0 2px 4px rgba(0,0,0,.1)}
  .bar-fill{
    position:absolute;left:0;top:0;bottom:0;width:0%;
    background:linear-gradient(90deg,var(--c-cyan),var(--c-green),var(--c-yellow),var(--c-orange),var(--c-pink),var(--c-purple));
    background-size:200% 100%;
    animation:rainbowMove 4s linear infinite;
    transition:width .8s cubic-bezier(.34,1.56,.64,1);
    box-shadow:0 0 12px var(--c-pink);
  }
  @keyframes rainbowMove{to{background-position:200% 0}}

  /* modal */
  .modal-mask{
    position:fixed;inset:0;background:rgba(15,23,42,.65);
    backdrop-filter:blur(8px);z-index:200;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .modal-mask.show{display:flex;animation:fadeIn .25s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{
    background:#fff;border-radius:28px;width:min(720px,100%);
    max-height:85vh;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 30px 80px rgba(0,0,0,.35);
    animation:modalIn .4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes modalIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-head{
    padding:20px 24px;border-bottom:2px dashed #F3F4F6;
    display:flex;justify-content:space-between;align-items:center;
    background:linear-gradient(135deg,#FEF3C7,#F3E8FF);
  }
  .modal-head h2{font-size:1.5rem;color:var(--c-purple);letter-spacing:2px}
  .modal-head button{
    width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;
    background:#fff;font-size:1.1rem;box-shadow:0 4px 0 rgba(0,0,0,.1);
  }
  .modal-body{padding:20px 24px;overflow-y:auto}
  .fav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .fav-card{
    background:linear-gradient(135deg,#fff 0%,#FEF3C7 100%);
    border:2px dashed var(--c-yellow);border-radius:18px;padding:14px;
    position:relative;transition:all .2s ease;
  }
  .fav-card:hover{transform:translateY(-4px) rotate(-1deg);box-shadow:0 12px 20px -8px rgba(0,0,0,.15)}
  .fav-card .del{
    position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;
    border:none;background:#FEE2E2;color:#EF4444;cursor:pointer;font-size:.8rem;
  }
  .fav-card .type{font-size:.75rem;padding:2px 8px;border-radius:999px;color:#fff;display:inline-block;margin-bottom:8px}
  .fav-card p{font-family:'Ma Shan Zheng',serif;line-height:1.6;color:#374151;min-height:60px}
  .fav-card time{font-size:.7rem;color:#9CA3AF;margin-top:8px;display:block}
  .empty-fav{grid-column:1/-1;text-align:center;padding:40px 20px;color:#9CA3AF}
  .empty-fav .emoji{font-size:3rem;display:block;margin-bottom:10px}

  /* share card */
  .share-card-preview{
    width:100%;max-width:340px;margin:0 auto;background:#fff;
    border-radius:18px;overflow:hidden;
    box-shadow:0 20px 40px -10px rgba(0,0,0,.2);
  }
  .share-head{
    background:linear-gradient(135deg,var(--c-purple),var(--c-pink));
    padding:20px;text-align:center;color:#fff;
  }
  .share-head h3{font-size:1.2rem;letter-spacing:2px;margin-bottom:4px}
  .share-head p{font-family:'Pacifico',cursive;font-size:.8rem;opacity:.9}
  .share-body{padding:24px;min-height:220px;position:relative;background:linear-gradient(135deg,#FFF8E7,#F3E8FF)}
  .share-body p{font-family:'Ma Shan Zheng',serif;font-size:1.2rem;line-height:1.8;color:var(--c-dark)}
  .share-foot{
    padding:14px 20px;border-top:1px dashed #E5E7EB;
    display:flex;justify-content:space-between;align-items:center;
    font-size:.7rem;color:#9CA3AF;
  }
  .share-foot .qr{width:46px;height:46px;background:repeating-conic-gradient(#000 0 25%,#fff 0 50%) 50%/6px 6px;border-radius:4px}
  .share-actions{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}

  /* Canvas overlay */
  #fxCanvas{position:fixed;inset:0;z-index:100;pointer-events:none}

  /* Easter egg overlays */
  .egg-layer{position:fixed;inset:0;z-index:150;pointer-events:none;display:none}
  .egg-layer.show{display:block}
  .rainbow-egg canvas{position:absolute;inset:0;width:100%;height:100%}
  .birthday-egg{
    display:none;align-items:center;justify-content:center;flex-direction:column;
    background:rgba(0,0,0,.4);backdrop-filter:blur(4px);
  }
  .birthday-egg.show{display:flex;animation:fadeIn .5s}
  .cake{font-size:8rem;animation:cakePop 1s cubic-bezier(.34,1.56,.64,1)}
  @keyframes cakePop{from{transform:scale(0) rotate(-30deg)}60%{transform:scale(1.3)}to{transform:scale(1)}}
  .birthday-text{
    color:#fff;font-size:3rem;font-family:'ZCOOL KuaiLe';letter-spacing:6px;margin-top:20px;
    text-shadow:0 0 20px var(--c-yellow);animation:txtGlow 1s ease-in-out infinite alternate;
  }
  @keyframes txtGlow{to{text-shadow:0 0 30px var(--c-pink),0 0 60px var(--c-purple)}}

  /* Coronation */
  .crown-egg{
    display:none;align-items:center;justify-content:center;flex-direction:column;
    background:radial-gradient(ellipse at center,rgba(250,204,21,.2) 0%,rgba(0,0,0,.7) 80%);
  }
  .crown-egg.show{display:flex}
  .crown{font-size:10rem;animation:floatCrown 2s ease-in-out infinite;filter:drop-shadow(0 10px 20px rgba(250,204,21,.6))}
  @keyframes floatCrown{50%{transform:translateY(-20px) rotate(4deg)}}
  .crown-title{
    font-size:4rem;font-family:'ZCOOL KuaiLe';color:var(--c-yellow);
    letter-spacing:10px;margin-top:20px;text-shadow:0 4px 0 var(--c-orange),0 0 40px var(--c-yellow);
    animation:popIn 1s .3s both cubic-bezier(.34,1.56,.64,1);
  }
  .crown-sub{color:#fff;font-family:'Ma Shan Zheng',serif;font-size:1.3rem;margin-top:12px;letter-spacing:4px;opacity:.9}

  /* toast */
  .toast{
    position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-30px);
    background:var(--c-dark);color:#fff;padding:10px 20px;border-radius:999px;
    font-size:.9rem;z-index:300;opacity:0;transition:all .3s ease;pointer-events:none;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* mobile */
  @media(max-width:640px){
    .slot-wrap{padding:30px 0 0}
    .lever{right:10px;top:54px;transform:none}
    .lever-stick{height:60px}
    .quick-actions{top:10px;right:10px}
    .qa-btn{width:38px;height:38px;font-size:1.1rem}
  }
</style>
</head>
<body>

<!-- Floating emoji decor -->
<div class="float-emoji" style="left:5%;animation-duration:18s;animation-delay:-2s">😂</div>
<div class="float-emoji" style="left:18%;animation-duration:22s;animation-delay:-8s">💕</div>

// ---------- STATE ----------
const STATE_KEY = 'happy-machine-v1';
let state = loadState();
function defaultState(){return{totalPulls:0,soundEnabled:true,currentTheme:'neon',favorites:[],unlockedEasterEggs:[]}}
function loadState(){try{return Object.assign(defaultState(),JSON.parse(localStorage.getItem(STATE_KEY)||'{}'))}catch(e){return defaultState()}}
function saveState(){localStorage.setItem(STATE_KEY,JSON.stringify(state));updateFavBadge()}

// ---------- DOM ----------
const $ = s=>document.querySelector(s);
const reels = [$('#reel1 .reel-inner'),$('#reel2 .reel-inner'),$('#reel3 .reel-inner')];
const reelDom = [$('#reel1'),$('#reel2'),$('#reel3')];
const lever = $('#lever');
const slot = $('#slotMachine');
const resultCard = $('#resultCard');
const emptyHint = $('#emptyHint');
const resultContent = $('#resultContent');
const barFill = $('#barFill');
const levelBadge = $('#levelBadge');
const nextHint = $('#nextHint');
const nextCountEl = $('#nextCount');
const toast = $('#toast');
const fxCanvas = $('#fxCanvas');
const fctx = fxCanvas.getContext('2d');
const rainbowCanvas = $('#rainbowCanvas');
const rctx = rainbowCanvas.getContext('2d');

// ---------- REELS ----------
function buildReel(inner){
  // 12 cells of random emoji
  let html = '';
  for(let i=0;i<12;i++){
    html += `<div class="reel-cell">${EMOJI_POOL[Math.floor(Math.random()*EMOJI_POOL.length)]}</div>`;
  }
  inner.innerHTML = html;
  inner._emojis = inner.querySelectorAll('.reel-cell');
}
reels.forEach(buildReel);

// ---------- FX CANVAS ----------
function resizeFX(){
  try{ fxCanvas.width=innerWidth;fxCanvas.height=innerHeight; }catch(e){}
  try{ rainbowCanvas.width=innerWidth;rainbowCanvas.height=innerHeight; }catch(e){}
}
resizeFX();
addEventListener('resize',resizeFX);

/* Confetti */
let particles = [];
function spawnConfetti(count=160){
  const colors=['#8B5CF6','#EC4899','#FACC15','#22D3EE','#FB923C','#84CC16','#3B82F6'];
  for(let i=0;i<count;i++){
    particles.push({
      x:Math.random()*innerWidth,y:innerHeight/2 - (Math.random()*200),
      vx:(Math.random()-.5)*10,vy:Math.random()*-10-3,
      g:.35+.2*Math.random(),size:4+Math.random()*8,
      color:colors[(Math.random()*colors.length)|0],
      rot:Math.random()*6.28,vr:(Math.random()-.5)*.4,
      shape:Math.random()<.5?'rect':'circle',
      life:180+Math.random()*60
    });
  }
}
function loopFX(){
  fctx.clearRect(0,0,fxCanvas.width,fxCanvas.height);
  particles = particles.filter(p=>{
    p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life--;
    if(p.life<=0||p.y>fxCanvas.height+50)return false;
    fctx.save();fctx.globalAlpha=Math.min(1,p.life/60);
    fctx.translate(p.x,p.y);fctx.rotate(p.rot);fctx.fillStyle=p.color;
    if(p.shape==='rect')fctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.6);
    else{fctx.beginPath();fctx.arc(0,0,p.size*.5,0,6.28);fctx.fill()}
    fctx.restore();return true;
  });
  if(state._emojiRain){updateEmojiRain()}
  if(state._rainbowActive){updateRainbow()}
  requestAnimationFrame(loopFX);
}
loopFX();

/* Emoji rain */
let emojiRainDrops=[];
function startEmojiRain(){
  state._emojiRain=true;emojiRainDrops=[];
  const pool=['😂','🤣','💖','✨','🎉','😂','🤪','😭','😂'];
  for(let i=0;i<70;i++){
    emojiRainDrops.push({
      x:Math.random()*innerWidth,
      y:-Math.random()*innerHeight,
      vy:3+Math.random()*4,
      vx:(Math.random()-.5)*1.5,
      s:2+Math.random()*2.5,
      e:pool[(Math.random()*pool.length)|0],
      rot:(Math.random()-.5)*.5,vr:(Math.random()-.5)*.03
    });
  }
  setTimeout(()=>{state._emojiRain=false;emojiRainDrops=[]},6500);
}
function updateEmojiRain(){
  fctx.save();fctx.textAlign='center';fctx.textBaseline='middle';
  for(const d of emojiRainDrops){
    d.x+=d.vx;d.y+=d.vy;d.rot+=d.vr;
    if(d.y>innerHeight+60){d.y=-40;d.x=Math.random()*innerWidth}
    fctx.save();fctx.translate(d.x,d.y);fctx.rotate(d.rot);fctx.scale(d.s,d.s);
    fctx.fillText(d.e,0,0);fctx.restore();
  }
  fctx.restore();
}

/* Rainbow wave */
let rainbowT=0,rainbowInterval=null;
function startRainbow(){
  state._rainbowActive=true;rainbowT=0;
  $('#rainbowEgg').classList.add('show');
  rainbowInterval=setInterval(()=>{rainbowT+=.02},16);
  setTimeout(()=>{
    state._rainbowActive=false;
    $('#rainbowEgg').classList.remove('show');
    clearInterval(rainbowInterval);
    rctx.clearRect(0,0,rainbowCanvas.width,rainbowCanvas.height);
  },8000);
}
function updateRainbow(){
  rctx.clearRect(0,0,rainbowCanvas.width,rainbowCanvas.height);
  const colors=['rgba(239,68,68,.35)','rgba(249,115,22,.35)','rgba(234,179,8,.35)','rgba(34,197,94,.35)','rgba(59,130,246,.35)','rgba(139,92,246,.35)','rgba(236,72,153,.35)'];
  for(let i=0;i<7;i++){
    rctx.beginPath();
    rctx.moveTo(0,innerHeight);
    for(let x=0;x<=innerWidth;x+=20){
      const y = innerHeight/2 + Math.sin(x*0.005 + rainbowT + i*0.5)*120 + i*35;
      rctx.lineTo(x,y);
    }
    rctx.lineTo(innerWidth,innerHeight);rctx.closePath();
    rctx.fillStyle=colors[i];rctx.fill();
  }
}

/* Fireworks */
let rockets=[],stars=[];
function launchFirework(x,y,color){
  rockets.push({x,y:innerHeight,tx:x,ty:y,vx:0,vy:-6,color,exploded:false,trail:[]});
}
function loopFireworks(){
  if(rockets.length===0 && stars.length===0)return;
  requestAnimationFrame(loopFireworks);
  fctx.globalCompositeOperation='lighter';
  rockets=rockets.filter(r=>{
    r.trail.push({x:r.x,y:r.y});if(r.trail.length>12)r.trail.shift();
    r.vy+=.15;r.x+=r.vx;r.y+=r.vy;
    // trail
    for(let i=0;i<r.trail.length;i++){
      const t=r.trail[i];fctx.globalAlpha=i/r.trail.length*.8;
      fctx.fillStyle=r.color;fctx.beginPath();fctx.arc(t.x,t.y,2,0,6.28);fctx.fill();
    }
    fctx.globalAlpha=1;
    if(r.y<=r.ty||r.vy>=0){
      // explode
      const n=100;
      for(let i=0;i<n;i++){
        const a=i/n*6.28,v=2+Math.random()*5;
        stars.push({x:r.x,y:r.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,color:r.color,life:90+Math.random()*30,size:2+Math.random()*2});
      }
      return false;
    }
    return true;
  });
  stars=stars.filter(s=>{
    s.vy+=.05;s.x+=s.vx;s.y+=s.vy;s.life--;
    if(s.life<=0)return false;
    fctx.globalAlpha=Math.min(1,s.life/60);
    fctx.fillStyle=s.color;fctx.beginPath();
    fctx.arc(s.x,s.y,s.size,0,6.28);fctx.fill();
    return true;
  });
  fctx.globalAlpha=1;fctx.globalCompositeOperation='source-over';
}
function startFireworkShow(){
  const colors=['#EF4444','#F59E0B','#FACC15','#84CC16','#22D3EE','#8B5CF6','#EC4899'];
  let n=0;
  const tick=()=>{
    for(let i=0;i<2;i++){
      launchFirework(100+Math.random()*(innerWidth-200),innerHeight*.2+Math.random()*innerHeight*.3,colors[(Math.random()*colors.length)|0]);
    }
    if(n++===0)loopFireworks();
    if(n<18)setTimeout(tick,400);
  };tick();
}

// ---------- TOAST ----------
let toastT=null;
function showToast(msg){
  toast.textContent=msg;toast.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>toast.classList.remove('show'),2000);
}

// ---------- SOUND (WebAudio beeps) ----------
let audioCtx=null;
function ensureAudio(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){audioCtx=null}}}
function beep(freq=520,dur=.08,type='square',vol=.08){
  if(!state.soundEnabled)return;ensureAudio();if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;g.gain.value=vol;
  o.connect(g).connect(audioCtx.destination);
  o.start();g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
  o.stop(audioCtx.currentTime+dur);
}
function pullSound(){beep(220,.1,'sawtooth');setTimeout(()=>beep(160,.15,'sawtooth'),80)}
function spinTick(){beep(880,.04,'square',.04)}
function winJingle(){
  const notes=[523,659,784,1047];let i=0;
  const t=()=>{if(i<notes.length){beep(notes[i],.14,'triangle',.1);i++;setTimeout(t,110)}};t();
}
function birthdaySong(){
  if(!state.soundEnabled)return;ensureAudio();if(!audioCtx)return;
  const seq=[[262,.4],[262,.2],[294,.6],[262,.6],[349,.6],[330,1.2],[262,.4],[262,.2],[294,.6],[262,.6],[392,.6],[349,1.2]];
  let t=0;seq.forEach(([f,d])=>{
    setTimeout(()=>beep(f,d*.9,'sine',.15),t*1000);
    t+=d;
  });
}

// ---------- PULL LOGIC ----------
let spinning=false,currentResult=null;
async function pullLever(){
  if(spinning)return;
  spinning=true;
  ensureAudio();
  pullSound();

  // lever animation
  lever.classList.add('pulled');
  setTimeout(()=>lever.classList.remove('pulled'),350);

  // start spinning reels
  reelDom.forEach(r=>r.classList.add('spinning'));
  reels.forEach(buildReel);
  let tickN=0;const tickI=setInterval(()=>{spinTick();tickN++},70);

  // pick result content first
  const typeKeys=Object.keys(HAPPY_CONTENT);
  const typeKey=typeKeys[(Math.random()*typeKeys.length)|0];
  const arr=HAPPY_CONTENT[typeKey];
  const item=arr[(Math.random()*arr.length)|0];
  const meta=TYPE_META[typeKey];
  currentResult={type:typeKey,meta,...item};

  // stop reels one by one
  const stopTimes=[900,1400,1900];
  stopTimes.forEach((t,i)=>{
    setTimeout(()=>{
      reelDom[i].classList.remove('spinning');
      // stop on final 3 emojis from meta + content
      const finals=[meta.emoji,meta.emoji,meta.emoji];
      reels[i].innerHTML = finals.concat(
        Array.from({length:9},()=>EMOJI_POOL[(Math.random()*EMOJI_POOL.length)|0])
      ).map(e=>`<div class="reel-cell">${e}</div>`).join('');
      reels[i].style.transform='translateY(0px)';
    },t);
  });

  await new Promise(r=>setTimeout(r,2000));
  clearInterval(tickI);

  // reveal
  revealResult(currentResult);
  winJingle();
  spawnConfetti(140+((Math.random()*80)|0));

  // state update
  state.totalPulls++;
  if(!state.unlockedEasterEggs.includes(state.totalPulls) && EASTER_EGGS[state.totalPulls]){
    triggerEasterEgg(state.totalPulls);
    state.unlockedEasterEggs.push(state.totalPulls);
  }
  saveState();
  updateEnergy();
  spinning=false;
}
lever.addEventListener('click',pullLever);
slot.addEventListener('dblclick',pullLever);

/* Result */
function revealResult(r){
  const meta = r.meta;
  emptyHint.style.display='none';
  resultContent.style.display='block';
  resultCard.classList.remove('empty');
  resultCard.classList.remove('show');void resultCard.offsetWidth;
  resultCard.classList.add('show');
  resultContent.innerHTML=`
    <span class="type-badge ${meta.cls}">${meta.emoji} ${meta.label}</span>
    <p class="result-text">${r.text}</p>
    <div class="result-tags">${r.tags.map(t=>`<span>#${t}</span>`).join('')}</div>
    <div class="result-actions">
      <button class="r-btn save" id="btnSaveFav">💖 收藏</button>
      <button class="r-btn copy" id="btnCopyText">📋 复制</button>
      <button class="r-btn share" id="btnShowShare">💌 分享卡片</button>
      <button class="r-btn again" title="再来一次">🎰</button>
    </div>
  `;
  // bind
  resultContent.querySelector('.r-btn.again').onclick = pullLever;
  resultContent.querySelector('#btnSaveFav').onclick = ()=>saveFavorite(r);
  resultContent.querySelector('#btnCopyText').onclick = ()=>{copyText(`${r.text} —— 来自快乐制造机`);showToast('已复制到剪贴板📋')};
  resultContent.querySelector('#btnShowShare').onclick = ()=>openShare(r);
}

/* Favorites */
function saveFavorite(r){
  if(state.favorites.some(f=>f.contentId===r.id)){showToast('这个快乐已经收藏啦~ 💕');return}
  state.favorites.unshift({id:'f'+Date.now(),contentId:r.id,type:r.type,icon:r.meta.emoji,text:r.text,savedAt:Date.now()});
  saveState();showToast('收藏成功！快乐+1 ⭐');
  // heart burst
  for(let i=0;i<20;i++){
    particles.push({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*12,vy:(Math.random()-.5)*12-4,g:.2,size:8,color:'#EC4899',rot:0,vr:.2,shape:'heart',life:80});
  }
}
function updateFavBadge(){
  const n=state.favorites.length;const el=$('#favCount');
  if(n>0){el.style.display='grid';el.textContent=n}else{el.style.display='none'}
}
updateFavBadge();

/* Energy */
function calcLevel(n){
  let lv=0;for(let i=LEVELS.length-1;i>=0;i--){if(n>=LEVELS[i].need){lv=i;break}}
  return lv;
}
function updateEnergy(){
  const lv=calcLevel(state.totalPulls);
  const L=LEVELS[lv],N=LEVELS[lv+1];
  levelBadge.textContent = `${L.badge} Lv.${lv+1} ${L.name}`;
  let pct;
  if(N){
    const step=N.need-L.need,cur=state.totalPulls-L.need;
    pct=Math.min(100,cur/step*100);
  }else{pct=100}
  barFill.style.width=pct+'%';
  // next egg hint
  const eggs=Object.keys(EASTER_EGGS).map(Number).sort((a,b)=>a-b);
  const next=eggs.find(e=>e>state.totalPulls);
  if(next){
    nextCountEl.textContent = next-state.totalPulls;
    nextHint.innerHTML = `再拉 <b>${next-state.totalPulls}</b> 次解锁下一个彩蛋：第 <b>${next}</b> 次 ${EASTER_EGGS[next].text.slice(0,6)}`;
  }else{
    nextHint.innerHTML = `<b>所有彩蛋已解锁！🎉 你就是快乐本身！</b>`;
  }
}
updateEnergy();

/* Easter eggs */
function triggerEasterEgg(n){
  const egg=EASTER_EGGS[n];showToast('🎊 '+egg.text);
  if(egg.name==='rainbow')setTimeout(startRainbow,500);
  if(egg.name==='emojiRain')setTimeout(startEmojiRain,500);
  if(egg.name==='birthday'){
    setTimeout(()=>{
      $('#birthdayEgg').classList.add('show');birthdaySong();
      spawnConfetti(320);startFireworkShow();
      setTimeout(()=>{$('#birthdayEgg').classList.remove('show')},7000);
    },500);
  }
  if(egg.name==='crown'){
    setTimeout(()=>{
      $('#crownEgg').classList.add('show');
      spawnConfetti(400);startFireworkShow();winJingle();
      setTimeout(()=>{$('#crownEgg').classList.remove('show')},9000);
    },500);
  }
}

/* Copy */
function copyText(txt){
  try{navigator.clipboard.writeText(txt)}catch(e){
    const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy')}catch(_){}document.body.removeChild(ta);
  }
}

/* Modals */
function openModal(id){$('#'+id).classList.add('show');renderFav()}
function closeModal(id){$('#'+id).classList.remove('show')}
document.addEventListener('click',e=>{
  if(e.target.dataset&&e.target.dataset.close)closeModal(e.target.dataset.close);
  if(e.target.classList&&e.target.classList.contains('modal-mask'))e.target.classList.remove('show');
});
$('#btnFav').onclick=()=>openModal('favModal');

/* Fav list */
function renderFav(){
  const grid=$('#favGrid');
  if(state.favorites.length===0){grid.innerHTML=`<div class="empty-fav"><span class="emoji">💔</span>还没有收藏的快乐，快去拉杆制造吧~</div>`;return}
  grid.innerHTML=state.favorites.map(f=>{
    const m=TYPE_META[f.type]||TYPE_META.joke;
    return `<div class="fav-card">
      <button class="del" data-del="${f.id}" title="删除">✕</button>
      <span class="type" style="background:${m.color}">${m.emoji} ${m.label}</span>
      <p>${f.text}</p>
      <time>${new Date(f.savedAt).toLocaleString()}</time>
    </div>`;
  }).join('');
  grid.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    state.favorites=state.favorites.filter(f=>f.id!==b.dataset.del);
    saveState();renderFav();showToast('已从收藏夹移除');
  });
}

  $('#shareCurrent')&&($('#shareCurrent').onclick=null);
  $('#btnCopyShare').onclick = ()=>{copyText(`${r.text}\n—— 快乐制造机 · 你的专属快乐生成器 🎰`);showToast('文案已复制')};
  $('#btnSaveImg').onclick = ()=>saveShareImage(r);
  state._lastShare = r;
}
function saveShareImage(r){
  try{
    const c=document.createElement('canvas');c.width=680;c.height=960;
    const g=c.getContext('2d');
    // bg
    const bg=g.createLinearGradient(0,0,0,c.height);bg.addColorStop(0,'#FFF8E7');bg.addColorStop(.5,'#F3E8FF');bg.addColorStop(1,'#FEF3C7');g.fillStyle=bg;g.fillRect(0,0,c.width,c.height);
    // dots
    for(let i=0;i<60;i++){g.fillStyle=['#8B5CF622','#EC489922','#FACC1522','#22D3EE22'][i%4];g.beginPath();g.arc(Math.random()*c.width,Math.random()*c.height,3+Math.random()*5,0,6.28);g.fill()}
    // header band
    const hg=g.createLinearGradient(0,0,c.width,0);hg.addColorStop(0,'#8B5CF6');hg.addColorStop(1,'#EC4899');g.fillStyle=hg;roundRect(g,30,30,c.width-60,140,24,true);
    g.fillStyle='#fff';g.textAlign='center';g.font='bold 44px "ZCOOL KuaiLe",sans-serif';g.fillText('🎉 我在快乐制造机收获了',c.width/2,95);
    g.font='24px Pacifico,cursive';g.globalAlpha=.95;g.fillText('Happiness x '+(state.totalPulls+1),c.width/2,140);g.globalAlpha=1;
    // body card
    g.fillStyle='#ffffffcc';roundRect(g,60,220,c.width-120,520,28,true);
    g.strokeStyle='#FACC15';g.setLineDash([8,8]);g.lineWidth=3;roundRect(g,60,220,c.width-120,520,28,false,true);g.setLineDash([]);
    // type badge
    const m=r.meta;g.fillStyle=m.color;roundRect(g,90,260,220,50,25,true);
    g.fillStyle='#fff';g.textAlign='left';g.font='bold 24px "ZCOOL KuaiLe"';g.fillText(`${m.emoji} ${m.label}`,112,294);
    // text
    g.fillStyle='#1F2937';g.textAlign='left';g.font='34px "Ma Shan Zheng",serif';
    wrapText(g,r.text,90,360,c.width-180,52);
    // footer
    g.fillStyle='#8B5CF6';g.font='bold 26px "ZCOOL KuaiLe"';g.textAlign='left';g.fillText('快乐制造机',80,c.height-110);
    g.fillStyle='#6B7280';g.font='18px sans-serif';g.fillText('Pull the lever · Get happy ✨',80,c.height-80);
    // qr-like
    g.fillStyle='#fff';roundRect(g,c.width-160,c.height-150,100,100,10,true);
    g.fillStyle='#1F2937';for(let i=0;i<64;i++){const x=c.width-150+(i%8)*12,y=c.height-140+((i/8)|0)*12;if(Math.random()<.55)g.fillRect(x,y,10,10)}
    // qr corners
    [[0,0],[7,0],[0,7]].forEach(([cx,cy])=>{g.strokeStyle='#8B5CF6';g.lineWidth=3;g.strokeRect(c.width-150+cx*12-2,c.height-140+cy*12-2,18,18)});
    // download
    const a=document.createElement('a');a.download=`快乐卡片_${Date.now()}.png`;a.href=c.toDataURL('image/png');a.click();
    showToast('图片已保存 💾');
  }catch(e){showToast('保存失败，请尝试截图');console.error(e)}
}
function roundRect(g,x,y,w,h,r,fill,stroke){
  g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();
  if(fill)g.fill();if(stroke)g.stroke();
}
function wrapText(g,text,x,y,maxW,lh){
  const chars=Array.from(text);let line='',cy=y;
  for(let i=0;i<chars.length;i++){
    const test=line+chars[i];
    if(g.measureText(test).width>maxW && line){
      g.fillText(line,x,cy);line=chars[i];cy+=lh;
    }else{line=test}
    if(cy>y+460)break;
  }
  if(line)g.fillText(line,x,cy);
}

/* Quick actions */
$('#btnSound').onclick=()=>{
  state.soundEnabled=!state.soundEnabled;saveState();
  $('#btnSound').textContent = state.soundEnabled?'🔊':'🔇';
  showToast(state.soundEnabled?'音效已开启🔊':'音效已静音🔇');
};
$('#btnReset').onclick=()=>{
  if(!confirm('确定重置快乐能量吗？收藏夹会保留。'))return;
  state.totalPulls=0;state.unlockedEasterEggs=[];saveState();updateEnergy();
  showToast('能量已重置，新的快乐旅程开始啦🌱');
};
const THEMES=['neon','candy','sunset','forest'];let themeIdx=0;
$('#btnTheme').onclick=()=>{
  themeIdx=(themeIdx+1)%THEMES.length;
  const t=THEMES[themeIdx];
  const map={
    neon:['#FFF8E7','#F3E8FF','#FEF3C7'],
    candy:['#FFE4E6','#FCE7F3','#FDF4FF'],
    sunset:['#FFF7ED','#FFEDD5','#FEF3C7'],
    forest:['#F0FDF4','#ECFCCB','#F0FDFA']
  };
  const c=map[t];
  document.body.style.background=`
    radial-gradient(ellipse at 10% 0%, ${c[0]}55, transparent 50%),
    radial-gradient(ellipse at 100% 100%, ${c[1]}55, transparent 50%),
    radial-gradient(ellipse at 50% 50%, ${c[2]}55, transparent 60%),
    linear-gradient(135deg,${c[0]} 0%,${c[1]} 50%,${c[2]} 100%)
  `;
  showToast(`主题切换：${t==='neon'?'霓虹紫电':t==='candy'?'糖果甜心':t==='sunset'?'日落橘光':'森林呼吸'} 🎨`);
};

/* Heart particle shape support (override draw) */
const origFCR=CanvasRenderingContext2D.prototype.fillRect;
CanvasRenderingContext2D.prototype.fillRect = function(x,y,w,h){
  // tiny hack for heart
  if(this.fillStyle==='#EC4899' && (this.globalAlpha===1||this.globalAlpha>.2) && w===8 && h===8){
    this.beginPath();
    const cx=x+w/2,cy=y+h/2,s=5;
    this.moveTo(cx,cy+s*.4);
    this.bezierCurveTo(cx+s,cy-s*.3,cx+s*1.2,cy+s*.3,cx,cy+s);
    this.bezierCurveTo(cx-s*1.2,cy+s*.3,cx-s,cy-s*.3,cx,cy+s*.4);
    this.fill();
    return;
  }
  origFCR.call(this,x,y,w,h);
};

/* Keyboard: space to pull */
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.target.matches('input,textarea')){e.preventDefault();pullLever()}});
