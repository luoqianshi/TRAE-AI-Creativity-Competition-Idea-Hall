<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智序 AI —— 智能时间规划助手 · 报名上传</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    overflow: hidden;
  }

  .header {
    background: linear-gradient(135deg, #c45d3e 0%, #d4a853 100%);
    padding: 2rem;
    text-align: center;
    color: #fff;
  }

  .header h1 {
    font-size: 1.75rem;
    margin-bottom: 0.5rem;
    font-weight: 700;
  }

  .header p {
    font-size: 0.9rem;
    opacity: 0.9;
  }

  .body {
    padding: 2rem;
  }

  .form-group {
    margin-bottom: 1.5rem;
  }

  .form-group label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: #333;
    margin-bottom: 0.5rem;
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 0.85rem 1rem;
    border: 1.5px solid #e0e0e0;
    border-radius: 10px;
    font-size: 0.95rem;
    transition: all 0.25s ease;
    font-family: inherit;
  }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: #c45d3e;
    box-shadow: 0 0 0 3px rgba(196, 93, 62, 0.1);
  }

  .form-group textarea {
    resize: vertical;
    min-height: 100px;
  }

  .form-group .hint {
    font-size: 0.75rem;
    color: #999;
    margin-top: 0.35rem;
  }

  .upload-area {
    border: 2px dashed #ddd;
    border-radius: 12px;
    padding: 2.5rem 2rem;
    text-align: center;
    transition: all 0.3s ease;
    cursor: pointer;
    background: #fafafa;
  }

  .upload-area:hover,
  .upload-area.dragover {
    border-color: #c45d3e;
    background: rgba(196, 93, 62, 0.03);
  }

  .upload-area.has-file {
    border-style: solid;
    border-color: #7a9e7e;
    background: rgba(122, 158, 126, 0.05);
  }

  .upload-icon {
    font-size: 2.5rem;
    margin-bottom: 1rem;
    color: #c45d3e;
  }

  .upload-text {
    font-size: 0.95rem;
    color: #666;
    margin-bottom: 0.5rem;
  }

  .upload-hint {
    font-size: 0.75rem;
    color: #999;
  }

  .file-info {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    padding: 1rem;
    background: rgba(122, 158, 126, 0.1);
    border-radius: 8px;
    margin-top: 1rem;
  }

  .file-info .icon {
    font-size: 1.25rem;
  }

  .file-info .name {
    font-size: 0.85rem;
    color: #333;
    font-weight: 500;
  }

  .file-info .size {
    font-size: 0.75rem;
    color: #7a9e7e;
  }

  .file-info .remove {
    font-size: 0.75rem;
    color: #c45d3e;
    cursor: pointer;
    padding: 0.25rem 0.5rem;
    border-radius: 4px;
    transition: background 0.2s;
  }

  .file-info .remove:hover {
    background: rgba(196, 93, 62, 0.1);
  }

  .btn {
    width: 100%;
    padding: 1rem;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
  }

  .btn-primary {
    background: linear-gradient(135deg, #c45d3e 0%, #d4a853 100%);
    color: #fff;
  }

  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(196, 93, 62, 0.3);
  }

  .btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .footer {
    padding: 1.5rem 2rem;
    background: #f8f9fa;
    text-align: center;
    font-size: 0.75rem;
    color: #999;
    border-top: 1px solid #eee;
  }

  .footer a {
    color: #c45d3e;
    text-decoration: none;
  }

  .footer a:hover {
    text-decoration: underline;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    align-items: center;
    justify-content: center;
    z-index: 1000;
    backdrop-filter: blur(4px);
  }

  .modal-overlay.show {
    display: flex;
  }

  .modal {
    background: #fff;
    border-radius: 16px;
    padding: 2rem;
    max-width: 400px;
    width: 90%;
    text-align: center;
    animation: modalIn 0.3s ease;
  }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  .modal-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
  }

  .modal h3 {
    font-size: 1.25rem;
    margin-bottom: 0.5rem;
    color: #333;
  }

  .modal p {
    font-size: 0.9rem;
    color: #666;
    margin-bottom: 1.5rem;
    line-height: 1.6;
  }

  .btn-secondary {
    background: #f0f0f0;
    color: #333;
  }

  .btn-secondary:hover {
    background: #e0e0e0;
  }

  .progress-bar {
    width: 100%;
    height: 6px;
    background: #eee;
    border-radius: 3px;
    overflow: hidden;
    margin-top: 1rem;
    display: none;
  }

  .progress-bar.show {
    display: block;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #c45d3e, #d4a853);
    border-radius: 3px;
    width: 0%;
    transition: width 0.3s ease;
  }

  input[type="file"] {
    display: none;
  }

  .required {
    color: #c45d3e;
    margin-left: 2px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>智序 AI —— 智能时间规划助手</h1>
    <p>生活娱乐赛道 · 创意方案报名上传</p>
  </div>

  <div class="body">
    <form id="signupForm" enctype="multipart/form-data">
      <div class="form-group">
        <label>姓名 <span class="required">*</span></label>
        <input type="text" id="name" name="name" placeholder="请输入您的姓名" required>
      </div>

      <div class="form-group">
        <label>手机号 <span class="required">*</span></label>
        <input type="tel" id="phone" name="phone" placeholder="请输入您的手机号" required>
        <div class="hint">用于接收报名审核结果通知</div>
      </div>

      <div class="form-group">
        <label>邮箱 <span class="required">*</span></label>
        <input type="email" id="email" name="email" placeholder="请输入您的邮箱" required>
      </div>

      <div class="form-group">
        <label>赛道选择 <span class="required">*</span></label>
        <select id="track" name="track" required>
          <option value="">请选择参赛赛道</option>
          <option value="life">生活娱乐</option>
          <option value="work">学习工作</option>
          <option value="service">社会服务</option>
          <option value="hardware">硬件交互</option>
        </select>
      </div>

      <div class="form-group">
        <label>附加标签</label>
        <select id="tag" name="tag">
          <option value="">无附加标签</option>
          <option value="public">社会公益</option>
        </select>
        <div class="hint">参加附加赛题时可选择"社会公益"标签</div>
      </div>

      <div class="form-group">
        <label>创意描述 <span class="required">*</span></label>
        <textarea id="description" name="description" placeholder="用 1-2 句话描述您发现的痛点或需求，以及产品形态（App/小程序/网站/系统/硬件等）" required></textarea>
      </div>

      <div class="form-group">
        <label>上传创意产物 HTML 文件 <span class="required">*</span></label>
        <label class="upload-area" id="uploadArea">
          <input type="file" id="fileInput" accept=".html" required>
          <div class="upload-icon">&#x1F4C1;</div>
          <div class="upload-text">点击或拖拽文件到此处上传</div>
          <div class="upload-hint">支持 .html 格式，文件大小不超过 10MB</div>
          <div id="fileInfo" class="file-info" style="display:none;">
            <span class="icon">&#x1F4C4;</span>
            <span class="name" id="fileName"></span>
            <span class="size" id="fileSize"></span>
            <span class="remove" id="removeFile">移除</span>
          </div>
        </label>
        <div class="hint">请上传 TRAE Work 生成的创意产物 HTML 文件，用于更完整地展示您的创意方案</div>
      </div>

      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn">提交报名</button>
    </form>
  </div>

  <div class="footer">
    <p>© 2026 TRAE Work 创意大赛 · <a href="#" target="_blank">查看比赛规则</a></p>
  </div>
</div>

<div class="modal-overlay" id="successModal">
  <div class="modal">
    <div class="modal-icon">&#x2705;</div>
    <h3>报名提交成功</h3>
    <p>您的创意方案已成功提交！<br>我们将在 3 个工作日内通过短信和邮箱通知您审核结果。</p>
    <button class="btn btn-primary" onclick="closeModal()">我知道了</button>
  </div>
</div>

<div class="modal-overlay" id="errorModal">
  <div class="modal">
    <div class="modal-icon">&#x274C;</div>
    <h3>提交失败</h3>
    <p id="errorMessage">请检查您的信息是否填写完整，文件格式是否正确。</p>
    <button class="btn btn-secondary" onclick="closeModal()">重新填写</button>
  </div>
</div>

<script>
  const form = document.getElementById('signupForm');
  const uploadArea = document.getElementById('uploadArea');
  const fileInput = document.getElementById('fileInput');
  const fileInfo = document.getElementById('fileInfo');
  const fileName = document.getElementById('fileName');
  const fileSize = document.getElementById('fileSize');
  const removeFile = document.getElementById('removeFile');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const submitBtn = document.getElementById('submitBtn');
  const successModal = document.getElementById('successModal');
  const errorModal = document.getElementById('errorModal');
  const errorMessage = document.getElementById('errorMessage');

  let selectedFile = null;

  uploadArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadArea.classList.add('dragover');
  });

  uploadArea.addEventListener('dragleave', () => {
    uploadArea.classList.remove('dragover');
  });

  uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    const files = e.dataTransfer.files;
    if (files.length > 0) {
      handleFile(files[0]);
    }
  });

  fileInput.addEventListener('change', (e) => {
    const files = e.target.files;
    if (files.length > 0) {
      handleFile(files[0]);
    }
  });

  function handleFile(file) {
    if (file.type !== 'text/html' && !file.name.endsWith('.html')) {
      alert('请上传 HTML 文件');
      return;
    }
    if (file.size > 10 * 1024 * 1024) {
      alert('文件大小不能超过 10MB');
      return;
    }
    selectedFile = file;
    fileName.textContent = file.name;
    fileSize.textContent = formatSize(file.size);
    fileInfo.style.display = 'flex';
    uploadArea.classList.add('has-file');
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  removeFile.addEventListener('click', (e) => {
    e.stopPropagation();
    selectedFile = null;
    fileInput.value = '';
    fileInfo.style.display = 'none';
    uploadArea.classList.remove('has-file');
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!selectedFile) {
      alert('请上传创意产物 HTML 文件');
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = '提交中...';
    progressBar.classList.add('show');

    let progress = 0;
    const interval = setInterval(() => {
      progress += Math.random() * 15;
      if (progress >= 90) progress = 90;
      progressFill.style.width = progress + '%';
    }, 200);

    setTimeout(() => {
      clearInterval(interval);
      progressFill.style.width = '100%';
      setTimeout(() => {
        progressBar.classList.remove('show');
        progressFill.style.width = '0%';
        submitBtn.disabled = false;
        submitBtn.textContent = '提交报名';
        successModal.classList.add('show');
        form.reset();
        selectedFile = null;
        fileInfo.style.display = 'none';
        uploadArea.classList.remove('has-file');
      }, 500);
    }, 2000);
  });

  function closeModal() {
    successModal.classList.remove('show');
    errorModal.classList.remove('show');
  }

  window.addEventListener('click', (e) => {
    if (e.target === successModal || e.target === errorModal) {
      closeModal();
    }
  });
</script>

</body>
</html>
