<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>FocuStone · 智感专注石 交互演示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #1a1e2b 0%, #242b3a 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
      padding: 20px;
    }

    .demo-container {
      max-width: 600px;
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 48px;
      padding: 36px 28px 32px;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    h2 {
      color: #eef5ff;
      font-weight: 500;
      font-size: 1.7rem;
      letter-spacing: 2px;
      text-align: center;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h2 span {
      background: #3e4b63;
      padding: 4px 14px;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 400;
      color: #b7c9e8;
      letter-spacing: 0.5px;
    }

    /* 专注石硬件外观 */
    .stone-base {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .focustone {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #3a4458, #1b1f2b);
      box-shadow: 0 18px 30px rgba(0, 0, 0, 0.7), inset 0 -6px 0 rgba(0,0,0,0.5), inset 0 6px 12px rgba(255,255,255,0.08);
      position: relative;
      transition: all 0.4s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 2px solid rgba(255, 255, 255, 0.15);
    }

    /* 呼吸灯光环 */
    .glow-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: transparent;
      box-shadow: 0 0 0px 0px rgba(120, 180, 255, 0);
      transition: box-shadow 1.2s ease;
      pointer-events: none;
    }

    .focustone.active .glow-ring {
      animation: breatheGlow 3s infinite ease-in-out;
    }

    @keyframes breatheGlow {
      0% {
        box-shadow: 0 0 12px 4px rgba(90, 160, 255, 0.5), 0 0 30px 10px rgba(70, 130, 255, 0.3);
      }
      50% {
        box-shadow: 0 0 28px 14px rgba(100, 180, 255, 0.9), 0 0 60px 25px rgba(70, 150, 255, 0.6);
      }
      100% {
        box-shadow: 0 0 12px 4px rgba(90, 160, 255, 0.5), 0 0 30px 10px rgba(70, 130, 255, 0.3);
      }
    }

    .stone-center {
      font-size: 2rem;
      color: #cbd5e8;
      z-index: 2;
      transition: color 0.4s;
      user-select: none;
    }
    .focustone.active .stone-center {
      color: #ffffff;
      text-shadow: 0 0 15px #9bc9ff;
    }

    /* 手机模拟区域 */
    .phone-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .phone-model {
      width: 120px;
      height: 200px;
      background: #1e1e2a;
      border-radius: 28px;
      border: 2px solid #4b5262;
      box-shadow: 0 18px 28px rgba(0,0,0,0.6);
      position: relative;
      transform-origin: center;
      transition: transform 0.45s cubic-bezier(0.34, 1.3, 0.7, 1), box-shadow 0.4s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: linear-gradient(135deg, #232837, #0f1119);
      user-select: none;
    }

    .phone-model.flipped {
      transform: rotateY(180deg);
      box-shadow: 0 -12px 26px rgba(0,0,0,0.8);
      border-color: #5a6b8c;
    }

    .phone-screen {
      background: #0b0d14;
      width: 90px;
      height: 140px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3f4b5e;
      font-size: 1.9rem;
      transition: background 0.3s;
    }
    .phone-model.flipped .phone-screen {
      background: #07090e;
      color: #1f2a3a;
    }

    .timer-display {
      font-size: 2.8rem;
      font-weight: 500;
      color: #d4e2ff;
      background: rgba(10, 15, 25, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 12px 36px;
      border-radius: 60px;
      letter-spacing: 2px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      font-variant-numeric: tabular-nums;
    }

    .status-text {
      color: #9aa9c1;
      font-size: 1rem;
      font-weight: 400;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #5f6b84;
      transition: background 0.3s;
    }
    .status-dot.active {
      background: #5cadff;
      box-shadow: 0 0 14px #4a9eff;
    }

    button {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255,255,255,0.2);
      color: #dce3f0;
      padding: 14px 28px;
      border-radius: 50px;
      font-size: 1rem;
      backdrop-filter: blur(8px);
      cursor: pointer;
      transition: all 0.25s;
      font-weight: 500;
      letter-spacing: 0.8px;
    }
    button:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255,255,255,0.4);
      color: white;
    }

    .hint-text {
      color: #7d8ba3;
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <h2>
      🌑 FocuStone
      <span>智感专注石</span>
    </h2>

    <!-- 专注石硬件 (点击切换状态，同时通过按钮翻转手机联动) -->
    <div class="stone-base">
      <div class="focustone" id="focuStone">
        <div class="glow-ring"></div>
        <div class="stone-center">◉</div>
      </div>
    </div>

    <!-- 计时器 -->
    <div class="timer-display" id="timerDisplay">00:00</div>
    <div class="status-text">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusLabel">等待手机倒扣</span>
    </div>

    <!-- 手机区域 -->
    <div class="phone-slot">
      <div class="phone-model" id="phoneModel" title="点击翻转手机 / 再次点击拿起">
        <div class="phone-screen">📱</div>
      </div>
      <div class="hint-text">点击手机模拟“倒扣”或“拿起”</div>
    </div>

    <button id="resetBtn">⟳ 重置专注会话</button>
  </div>

  <script>
    (function() {
      // DOM 元素
      const focuStone = document.getElementById('focuStone');
      const phoneModel = document.getElementById('phoneModel');
      const timerDisplay = document.getElementById('timerDisplay');
      const statusDot = document.getElementById('statusDot');
      const statusLabel = document.getElementById('statusLabel');
      const resetBtn = document.getElementById('resetBtn');

      // 状态变量
      let isActive = false;          // 是否处于专注模式（手机倒扣且灯光呼吸）
      let seconds = 0;
      let timerInterval = null;

      // 更新计时器显示 (mm:ss)
      function updateTimerDisplay() {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }

      // 启动专注模式
      function startFocus() {
        if (isActive) return;
        isActive = true;
        focuStone.classList.add('active');
        phoneModel.classList.add('flipped');
        statusDot.classList.add('active');
        statusLabel.textContent = '深度专注中 · 光效呼吸';
        
        // 启动计时器
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          seconds++;
          updateTimerDisplay();
        }, 1000);
      }

      // 停止专注模式 (拿起手机 / 重置)
      function stopFocus() {
        if (!isActive) return;
        isActive = false;
        focuStone.classList.remove('active');
        phoneModel.classList.remove('flipped');
        statusDot.classList.remove('active');
        statusLabel.textContent = '专注已暂停';
        
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
        // 保留计时器时间，不清零，但状态停止
        // 可以让用户看到累积时间。
        // 再次点击手机可继续倒扣，会重新计时（累加）。
      }

      // 重置整个会话
      function resetSession() {
        // 先停止专注模式（如果有）
        if (isActive) {
          stopFocus();
        }
        // 清零计时器
        seconds = 0;
        updateTimerDisplay();
        statusLabel.textContent = '等待手机倒扣';
        // 确保样式移除
        focuStone.classList.remove('active');
        phoneModel.classList.remove('flipped');
        statusDot.classList.remove('active');
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
        isActive = false;
      }

      // 手机点击事件：切换倒扣/拿起状态
      phoneModel.addEventListener('click', () => {
        if (isActive) {
          // 当前处于专注模式 -> 拿起手机，停止专注
          stopFocus();
        } else {
          // 当前未专注 -> 倒扣手机，启动专注
          startFocus();
        }
      });

      // 也可以点击专注石本身来切换（模拟触控感应）
      focuStone.addEventListener('click', (e) => {
        // 防止点到内部元素导致重复触发
        e.stopPropagation();
        if (isActive) {
          stopFocus();
        } else {
          startFocus();
        }
      });

      // 重置按钮
      resetBtn.addEventListener('click', resetSession);

      // 初始化计时器显示
      updateTimerDisplay();

      // 附加说明：演示时预置一个状态提示
      console.log('✨ FocuStone 演示：点击手机或专注石切换专注状态，呼吸光效与计时器联动。');
    })();
  </script>
</body>
</html>
