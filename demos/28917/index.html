
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心情日记 - MBTI 内容生成器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f5f3ff',
              100: '#ede9fe',
              200: '#ddd6fe',
              300: '#c4b5fd',
              400: '#a78bfa',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
              800: '#5b21b6',
              900: '#4c1d95',
            }
          },
          fontFamily: {
            sans: ['"PingFang SC"', '"Microsoft YaHei"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    @layer utilities {
      .gradient-bg {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      .glass-effect {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .card-shadow {
        box-shadow: 0 20px 60px rgba(102, 126, 234, 0.3);
      }
      .animate-float {
        animation: float 3s ease-in-out infinite;
      }
      .animate-pulse-slow {
        animation: pulse 3s ease-in-out infinite;
      }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
    }
    .mood-tag:hover {
      transform: scale(1.05);
      transition: all 0.3s ease;
    }
    .mood-tag.active {
      transform: scale(1.1);
      box-shadow: 0 0 20px currentColor;
    }
    .mbti-btn:hover {
      transform: translateY(-2px);
      transition: all 0.3s ease;
    }
    .mbti-btn.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .result-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .song-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(102, 126, 234, 0.3);
      transition: all 0.3s ease;
    }
    .generate-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      transition: all 0.3s ease;
    }
    .generate-btn:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }
    .generate-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .download-btn {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      transition: all 0.3s ease;
    }
    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
    }
  </style>
</head>
<body class="min-h-screen text-white p-4 md:p-8">
  <div class="max-w-4xl mx-auto">
    <header class="text-center mb-12">
      <div class="inline-flex items-center gap-3 mb-4">
        <span class="text-5xl animate-float">🌟</span>
        <h1 class="text-4xl md:text-5xl font-bold bg-gradient-to-r from-purple-400 via-pink-400 to-purple-400 bg-clip-text text-transparent">
          心情日记
        </h1>
        <span class="text-5xl animate-float" style="animation-delay: 0.5s;">✨</span>
      </div>
      <p class="text-gray-400 text-lg">记录心情，发现自我 - 基于 MBTI 的个性化内容生成器</p>
    </header>

    <section class="glass-effect rounded-2xl p-6 mb-8">
      <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
        <span>🌈</span> 选择你的心情
      </h2>
      <div class="flex flex-wrap gap-3" id="mood-container">
        <button class="mood-tag px-4 py-3 rounded-xl bg-white/10 hover:bg-white/20 transition-all text-lg" data-mood="happy" data-emoji="😊">
          😊 开心
        </button>
        <button class="mood-tag px-4 py-3 rounded-xl bg-white/10 hover:bg-white/20 transition-all text-lg" data-mood="sad" data-emoji="😢">
          😢 难过
        </button>
        <button class="mood-tag px-4 py-3 rounded-xl bg-white/10 hover:bg-white/20 transition-all text-lg" data-mood="anxious" data-emoji="😰">
          😰 焦虑
        </button>
        <button class="mood-tag px-4 py-3 rounded-xl bg-white/10 hover:bg-white/20 transition-all text-lg" data-mood="calm" data-emoji="😌">
          😌 平静
        </button>
        <button class="mood-tag px-4 py-3 rounded-xl bg-white/10 hover:bg-white/20 transition-all text-lg" data-mood="excited" data-emoji="🤩">
          🤩 兴奋
        </button>
        <button class="mood-tag px-4 py-3 rounded-xl bg-white/10 hover:bg-white/20 transition-all text-lg" data-mood="tired" data-emoji="😴">
          😴 疲惫
        </button>
        <button class="mood-tag px-4 py-3 rounded-xl bg-white/10 hover:bg-white/20 transition-all text-lg" data-mood="confused" data-emoji="😕">
          😕 迷茫
        </button>
        <button class="mood-tag px-4 py-3 rounded-xl bg-white/10 hover:bg-white/20 transition-all text-lg" data-mood="expectant" data-emoji="🌟">
          🌟 期待
        </button>
      </div>
    </section>

    <section class="glass-effect rounded-2xl p-6 mb-8">
      <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
        <span>🧠</span> 你的 MBTI 类型
      </h2>
      <div class="grid grid-cols-4 md:grid-cols-8 gap-2" id="mbti-container">
        <button class="mbti-btn px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20 transition-all text-sm font-medium" data-mbti="INTJ">INTJ</button>
        <button class="mbti-btn px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20 transition-all text-sm font-medium" data-mbti="INTP">INTP</button>
        <button class="mbti-btn px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20 transition-all text-sm font-medium" data-mbti="ENTJ">ENTJ</button>
        <button class="mbti-btn px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20 transition-all text-sm font-medium" data-mbti="ENTP">ENTP</button>
        <button class="mbti-btn px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20 transition-all text-sm font-medium" data-mbti="INFJ">INFJ</button>
        <button class="mbti-btn px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20 transition-all text-sm font-medium" data-mbti="INFP">INFP</button>
        <button class="mbti-btn px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20 transition-all text-sm font-medium" data-mbti="ENFJ">ENFJ</button>
        <button class="mbti-btn px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20 transition-all text-sm font-medium" data-mbti="ENFP">ENFP</button>
        <button class="mbti-btn px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20 transition-all text-sm font-medium" data-mbti="ISTJ">ISTJ</button>
        <button class="mbti-btn px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20 transition-all text-sm font-medium" data-mbti="ISFJ">ISFJ</button>
        <button class="mbti-btn px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20 transition-all text-sm font-medium" data-mbti="ESTJ">ESTJ</button>
        <button class="mbti-btn px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20 transition-all text-sm font-medium" data-mbti="ESFJ">ESFJ</button>
        <button class="mbti-btn px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20 transition-all text-sm font-medium" data-mbti="ISTP">ISTP</button>
        <button class="mbti-btn px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20 transition-all text-sm font-medium" data-mbti="ISFP">ISFP</button>
        <button class="mbti-btn px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20 transition-all text-sm font-medium" data-mbti="ESTP">ESTP</button>
        <button class="mbti-btn px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20 transition-all text-sm font-medium" data-mbti="ESFP">ESFP</button>
      </div>
      <p class="text-gray-400 text-sm mt-3">选择你的 MBTI 类型，获取更精准的内容推荐</p>
    </section>

    <section class="text-center mb-8">
      <button class="generate-btn px-8 py-4 rounded-full text-xl font-semibold text-white shadow-lg" id="generate-btn">
        <span class="inline-flex items-center gap-2">
          <span>🚀</span>
          <span>生成专属内容</span>
          <span class="animate-pulse-slow">✨</span>
        </span>
      </button>
    </section>

    <section id="results" class="hidden">
      <div class="grid md:grid-cols-3 gap-6 mb-8">
        <div class="result-card p-6">
          <div class="flex items-center gap-2 mb-4">
            <span class="text-2xl">💬</span>
            <h3 class="text-lg font-semibold">今日推荐语</h3>
          </div>
          <p class="text-gray-200 text-lg leading-relaxed" id="recommendation-content"></p>
        </div>

        <div class="result-card p-6">
          <div class="flex items-center gap-2 mb-4">
            <span class="text-2xl">🎵</span>
            <h3 class="text-lg font-semibold">歌词灵感</h3>
          </div>
          <p class="text-gray-200 text-lg leading-relaxed" id="lyrics-content"></p>
        </div>

        <div class="result-card p-6">
          <div class="flex items-center gap-2 mb-4">
            <span class="text-2xl">📝</span>
            <h3 class="text-lg font-semibold">心灵鸡汤</h3>
          </div>
          <p class="text-gray-200 text-lg leading-relaxed" id="chicken-content"></p>
        </div>
      </div>

      <section class="glass-effect rounded-2xl p-6 mb-8">
        <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
          <span>🎶</span> 音乐推荐
        </h2>
        <div class="grid md:grid-cols-3 gap-4" id="music-container">
        </div>
      </section>

      <section class="glass-effect rounded-2xl p-6">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-xl font-semibold flex items-center gap-2">
            <span>🖼️</span> 精美卡片
          </h2>
          <button class="download-btn px-6 py-2 rounded-lg text-white font-medium" id="download-btn">
            <span class="inline-flex items-center gap-2">
              <span>📥</span>
              <span>下载卡片</span>
            </span>
          </button>
        </div>
        <div id="card-container" class="bg-gradient-to-br from-purple-900/50 via-indigo-900/50 to-blue-900/50 rounded-2xl p-8">
          <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-full gradient-bg mb-4">
              <span class="text-4xl" id="card-mood-emoji">😊</span>
            </div>
            <span class="text-3xl font-bold" id="card-mbti">INTJ</span>
            <p class="text-gray-400 mt-2" id="card-mood">开心</p>
          </div>
          
          <div class="bg-white/5 rounded-xl p-6 mb-6">
            <p class="text-center text-xl italic text-gray-200" id="card-quote">等待生成内容...</p>
          </div>

          <div class="flex justify-center">
            <div id="qrcode-container" class="bg-white p-4 rounded-xl"></div>
          </div>
          
          <div class="text-center mt-6">
            <p class="text-gray-500 text-sm">扫码查看完整内容</p>
          </div>
        </div>
      </section>
    </section>

    <footer class="text-center mt-12 text-gray-500 text-sm">
      <p>🌟 心情日记 - 记录每一个珍贵的瞬间 🌟</p>
    </footer>
  </div>

  <script>
    const moods = {
      happy: { name: '开心', emoji: '😊', color: '#FFD700' },
      sad: { name: '难过', emoji: '😢', color: '#4169E1' },
      anxious: { name: '焦虑', emoji: '😰', color: '#FF6347' },
      calm: { name: '平静', emoji: '😌', color: '#20B2AA' },
      excited: { name: '兴奋', emoji: '🤩', color: '#FF69B4' },
      tired: { name: '疲惫', emoji: '😴', color: '#708090' },
      confused: { name: '迷茫', emoji: '😕', color: '#9370DB' },
      expectant: { name: '期待', emoji: '🌟', color: '#FFA500' }
    };

    const mbtiNames = {
      INTJ: '建筑师', INTP: '逻辑学家', ENTJ: '指挥官', ENTP: '辩论家',
      INFJ: '提倡者', INFP: '调停者', ENFJ: '教育家', ENFP: '竞选者',
      ISTJ: '物流师', ISFJ: '守卫者', ESTJ: '总经理', ESFJ: '执政官',
      ISTP: '鉴赏家', ISFP: '艺术家', ESTP: '企业家', ESFP: '表演者'
    };

    const musicDatabase = {
      happy: {
        INTJ: [{ name: '胜利', artist: 'Two Steps From Hell', cover: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=epic%20victory%20music%20album%20cover%20golden%20light&image_size=square' }],
        INFJ: [{ name: 'Happy', artist: 'Pharrell Williams', cover: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=happy%20sunshine%20music%20album%20cover&image_size=square' }],
        default: [{ name: 'Happy', artist: 'Pharrell Williams', cover: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=happy%20sunshine%20music%20album%20cover&image_size=square' }]
      },
      sad: {
        INTJ: [{ name: 'Hurt', artist: 'Johnny Cash', cover: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=sad%20emotional%20music%20album%20cover%20dark&image_size=square' }],
        INFJ: [{ name: 'Someone Like You', artist: 'Adele', cover: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=emotional%20sad%20music%20album%20cover%20blue&image_size=square' }],
        default: [{ name: 'Someone Like You', artist: 'Adele', cover: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=emotional%20sad%20music%20album%20cover%20blue&image_size=square' }]
      },
      anxious: {
        INTJ: [{ name: 'Weightless', artist: 'Marconi Union', cover: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=calm%20peaceful%20music%20album%20cover%20soft%20colors&image_size=square' }],
        INFJ: [{ name: 'Clair de Lune', artist: 'Debussy', cover: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=classical%20piano%20music%20album%20cover%20moonlight&image_size=square' }],
        default: [{ name: 'Weightless', artist: 'Marconi Union', cover: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=calm%20peaceful%20music%20album%20cover%20soft%20colors&image_size=square' }]
      },
      calm: {
        INTJ: [{ name: 'Canon in D', artist: 'Pachelbel', cover: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=classical%20peaceful%20music%20album%20cover%20serene&image_size=square' }],
        INFJ: [{ name: 'Moon River', artist: 'Audrey Hepburn', cover: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=gentle%20romantic%20music%20album%20cover%20moonlight&image_size=square' }],
        default: [{ name: 'Canon in D', artist: 'Pachelbel', cover: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=classical%20peaceful%20music%20album%20cover%20serene&image_size=square' }]
      },
      excited: {
        INTJ: [{ name: 'Thunder', artist: 'Imagine Dragons', cover: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=exciting%20rock%20music%20album%20cover%20electric&image_size=square' }],
        INFJ: [{ name: 'Shut Up and Dance', artist: 'WALK THE MOON', cover: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=fun%20pop%20music%20album%20cover%20colorful&image_size=square' }],
        default: [{ name: 'Thunder', artist: 'Imagine Dragons', cover: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=exciting%20rock%20music%20album%20cover%20electric&image_size=square' }]
      },
      tired: {
        INTJ: [{ name: 'Sleep Away', artist: 'Bob Acri', cover: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=sleepy%20relaxing%20music%20album%20cover%20soft%20pastel&image_size=square' }],
        INFJ: [{ name: 'Lullaby', artist: 'The Cure', cover: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=gentle%20lullaby%20music%20album%20cover%20dreamy&image_size=square' }],
        default: [{ name: 'Sleep Away', artist: 'Bob Acri', cover: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=sleepy%20relaxing%20music%20album%20cover%20soft%20pastel&image_size=square' }]
      },
      confused: {
        INTJ: [{ name: 'Mr. Brightside', artist: 'The Killers', cover: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=mysterious%20indie%20music%20album%20cover%20dark%20moody&image_size=square' }],
        INFJ: [{ name: 'Boulevard of Broken Dreams', artist: 'Green Day', cover: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=melancholic%20rock%20music%20album%20cover%20urban%20night&image_size=square' }],
        default: [{ name: 'Mr. Brightside', artist: 'The Killers', cover: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=mysterious%20indie%20music%20album%20cover%20dark%20moody&image_size=square' }]
      },
      expectant: {
        INTJ: [{ name: 'A Sky Full of Stars', artist: 'Coldplay', cover: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=hopeful%20inspirational%20music%20album%20cover%20stars%20night%20sky&image_size=square' }],
        INFJ: [{ name: 'Rise Up', artist: 'Andra Day', cover: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=inspirational%20motivational%20music%20album%20cover%20sunrise&image_size=square' }],
        default: [{ name: 'A Sky Full of Stars', artist: 'Coldplay', cover: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=hopeful%20inspirational%20music%20album%20cover%20stars%20night%20sky&image_size=square' }]
      }
    };

    let selectedMood = null;
    let selectedMbti = null;
    let generatedContent = {};

    document.querySelectorAll('.mood-tag').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mood-tag').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedMood = btn.dataset.mood;
        updateGenerateButton();
      });
    });

    document.querySelectorAll('.mbti-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mbti-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedMbti = btn.dataset.mbti;
        updateGenerateButton();
      });
    });

    function updateGenerateButton() {
      const btn = document.getElementById('generate-btn');
      if (selectedMood && selectedMbti) {
        btn.disabled = false;
      } else {
        btn.disabled = true;
      }
    }

    document.getElementById('generate-btn').addEventListener('click', async () => {
      if (!selectedMood || !selectedMbti) return;

      const btn = document.getElementById('generate-btn');
      btn.innerHTML = '<span class="inline-flex items-center gap-2"><span class="animate-spin">⏳</span><span>生成中...</span></span>';
      btn.disabled = true;

      try {
        generatedContent = await generateContent(selectedMood, selectedMbti);
        
        document.getElementById('recommendation-content').textContent = generatedContent.recommendation;
        document.getElementById('lyrics-content').textContent = generatedContent.lyrics;
        document.getElementById('chicken-content').textContent = generatedContent.chickenSoup;

        document.getElementById('card-mood-emoji').textContent = moods[selectedMood].emoji;
        document.getElementById('card-mbti').textContent = selectedMbti;
        document.getElementById('card-mood').textContent = moods[selectedMood].name;
        document.getElementById('card-quote').textContent = generatedContent.recommendation;

        generateMusic();
        generateQRCode();

        document.getElementById('results').classList.remove('hidden');
      } catch (error) {
        console.error('生成内容失败:', error);
        alert('生成内容失败，请重试');
      } finally {
        btn.innerHTML = '<span class="inline-flex items-center gap-2"><span>🚀</span><span>生成专属内容</span><span class="animate-pulse-slow">✨</span></span>';
        btn.disabled = false;
      }
    });

    async function generateContent(mood, mbti) {
      const prompt = `
        我现在的心情是${moods[mood].name}，MBTI类型是${mbti}(${mbtiNames[mbti]})。请帮我生成以下内容：
        
        1. 推荐语：一句简短有力的励志短句，适合当前心情
        2. 歌词片段：一段符合当前心情的歌词风格文字
        3. 鸡汤文字：一段温暖治愈的段落
        
        请用JSON格式输出，键名分别为：recommendation、lyrics、chickenSoup
      `;

      const response = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer demo-key'
        },
        body: JSON.stringify({
          model: 'gpt-3.5-turbo',
          messages: [{ role: 'user', content: prompt }],
          temperature: 0.7
        })
      });

      if (!response.ok) {
        return getMockContent(mood, mbti);
      }

      const data = await response.json();
      return JSON.parse(data.choices[0].message.content);
    }

    function getMockContent(mood, mbti) {

    function generateMusic() {
      const container = document.getElementById('music-container');
      container.innerHTML = '';

      const moodMusic = musicDatabase[selectedMood] || {};
      const songs = moodMusic[selectedMbti] || moodMusic.default || moodMusic.happy || [{ name: '默认歌曲', artist: '未知', cover: '' }];

      songs.slice(0, 3).forEach((song, index) => {
        const songCard = document.createElement('div');
        songCard.className = 'song-card bg-white/5 rounded-xl p-4 cursor-pointer';
        songCard.innerHTML = `
          <img src="${song.cover || 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=music%20album%20cover&image_size=square'}" 
               alt="${song.name}" class="w-full aspect-square object-cover rounded-lg mb-3">
          <h4 class="font-semibold">${song.name}</h4>
          <p class="text-gray-400 text-sm">${song.artist}</p>
          <a href="https://music.163.com/#/search/m=${encodeURIComponent(song.name)}" 
             target="_blank" class="inline-flex items-center gap-1 mt-2 text-purple-400 text-sm hover:underline">
            <span>🎵</span> 去网易云听
          </a>
        `;
        songCard.style.animationDelay = `${index * 0.1}s`;
        container.appendChild(songCard);
      });
    }

    function generateQRCode() {
      const container = document.getElementById('qrcode-container');
      container.innerHTML = '';

      const content = `${selectedMood} | ${selectedMbti} | ${generatedContent.recommendation}`;
      QRCode.toCanvas(container, content, {
        width: 120,
        color: {
          dark: '#1a1a2e',
          light: '#ffffff'
        }
      }, (error) => {
        if (error) console.error('生成二维码失败:', error);
      });
    }

    document.getElementById('download-btn').addEventListener('click', () => {
      const cardContainer = document.getElementById('card-container');
      
      html2canvas(cardContainer, {
        backgroundColor: null,
        scale: 2
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = `心情日记_${selectedMood}_${selectedMbti}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(error => {
        console.error('导出图片失败:', error);
        alert('导出图片失败，请重试');
      });
    });
  </script>
