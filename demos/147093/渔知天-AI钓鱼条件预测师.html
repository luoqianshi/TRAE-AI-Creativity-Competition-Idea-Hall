<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>渔知天 · AI钓鱼条件预测师</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --teal: #00838f;
  --teal-deep: #006064;
  --teal-light: #4dd0e1;
  --teal-pale: #b2ebf2;
  --cyan: #26c6da;
  --text: #e0f7fa;
  --text-dim: #80cbc4;
  --gold: #ffeb3b;
}
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(160deg, var(--teal-deep) 0%, var(--teal) 100%);
  color: var(--text);
  position: relative;
}
#waterCanvas { position: fixed; inset: 0; z-index: 0; opacity: 0.5; }
#fishCanvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

/* 头部 */
header {
  position: relative; z-index: 10;
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 30px;
}
.logo-wrap { display: flex; align-items: center; gap: 12px; }
.logo-icon {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--cyan), #00bcd4);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 20px rgba(0,188,212,0.4);
  animation: logoFloat 3s ease-in-out infinite;
}
@keyframes logoFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.logo-icon svg { width: 26px; height: 26px; color: var(--teal-deep); }
.logo-text .name { font-size: 24px; font-weight: 800; letter-spacing: 4px; text-shadow: 0 0 15px rgba(224,247,250,0.4); }
.logo-text .name span { color: var(--teal-light); }
.logo-text .en { font-size: 10px; color: var(--text-dim); letter-spacing: 4px; margin-top: 2px; }

.time-display {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; letter-spacing: 2px;
  background: rgba(0,96,100,0.5);
  padding: 8px 16px; border-radius: 20px;
  border: 1px solid rgba(128,203,196,0.3);
  color: var(--text-dim);
  font-family: "Consolas", monospace;
}
.time-display .dot { width: 6px; height: 6px; border-radius: 50%; background: #00e676; box-shadow: 0 0 6px #00e676; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: 0.3; } }

main {
  position: relative; z-index: 5;
  display: grid;
  grid-template-rows: auto auto 1fr;
  height: calc(100% - 72px);
  padding: 0 24px 16px; gap: 14px;
}

/* 仪表盘 */
.dashboard { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.gauge-card {
  background: linear-gradient(180deg, rgba(0,77,80,0.6), rgba(0,77,80,0.3));
  border: 1px solid rgba(128,203,196,0.2);
  border-radius: 16px; padding: 14px 10px;
  backdrop-filter: blur(10px);
  text-align: center;
  transition: all 0.3s; position: relative; overflow: hidden;
}
.gauge-card::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 0%, rgba(128,203,196,0.18), transparent 60%);
  pointer-events: none;
}
.gauge-card:hover { transform: translateY(-3px); border-color: var(--teal-pale); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
.gauge-head { display: flex; align-items: center; justify-content: center; gap: 4px; margin-bottom: 6px; }
.gauge-head svg { width: 14px; height: 14px; color: var(--teal-light); }
.gauge-title { font-size: 12px; letter-spacing: 2px; opacity: 0.85; }
.gauge-svg { width: 78px; height: 78px; margin: 0 auto; }
.gauge-bg { fill: none; stroke: rgba(128,203,196,0.15); stroke-width: 6; }
.gauge-fg { fill: none; stroke: url(#gaugeGrad); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 1s ease; filter: drop-shadow(0 0 6px rgba(128,203,196,0.6)); }
.gauge-value { font-size: 22px; font-weight: 800; margin-top: -56px; position: relative; z-index: 1; color: #fff; }
.gauge-unit { font-size: 9px; opacity: 0.6; margin-top: 56px; letter-spacing: 1px; }

.moon-card .gauge-svg { width: 70px; height: 70px; }
.moon-circle { fill: #fff8e1; filter: drop-shadow(0 0 10px #fff8e1); cursor: pointer; transition: transform 0.5s; }
.moon-card:hover .moon-circle { transform: rotate(30deg); }
.moon-shadow { fill: var(--teal-deep); }
.moon-card .gauge-value { margin-top: 4px; font-size: 14px; }
.moon-card .gauge-unit { margin-top: 6px; }

/* 时间轴 */
.timeline-card {
  background: linear-gradient(180deg, rgba(0,77,80,0.6), rgba(0,77,80,0.3));
  border: 1px solid rgba(128,203,196,0.2);
  border-radius: 16px; padding: 16px 20px;
  backdrop-filter: blur(10px);
  position: relative; overflow: hidden;
}
.timeline-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--teal-light), transparent);
}
.timeline-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.timeline-header h3 {
  font-size: 14px; letter-spacing: 3px; display: flex; align-items: center; gap: 6px;
}
.timeline-header h3 svg { width: 16px; height: 16px; color: var(--teal-light); }
.timeline-header .cur-time {
  font-size: 14px; color: var(--gold); font-weight: 700;
  background: rgba(255,235,59,0.1); padding: 4px 12px; border-radius: 12px;
  border: 1px solid rgba(255,235,59,0.3);
  display: flex; align-items: center; gap: 6px;
}
.timeline-header .cur-time svg { width: 14px; height: 14px; }
.timeline-canvas-wrap { position: relative; height: 110px; }
#timelineCanvas { width: 100%; height: 100%; }
.timeline-slider {
  width: 100%; margin-top: 8px; height: 6px;
  -webkit-appearance: none; appearance: none;
  background: linear-gradient(90deg, rgba(77,208,225,0.2), rgba(255,235,59,0.2));
  border-radius: 3px; outline: none; cursor: pointer;
}
.timeline-slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--gold); cursor: pointer;
  box-shadow: 0 0 10px rgba(255,235,59,0.6), 0 0 0 3px rgba(255,235,59,0.2);
  border: 2px solid #fff;
}
.hour-marks { display: flex; justify-content: space-between; font-size: 9px; opacity: 0.5; margin-top: 4px; padding: 0 4px; }

/* 鱼种 */
.fish-section { overflow-y: auto; padding-right: 4px; }
.fish-section::-webkit-scrollbar { width: 6px; }
.fish-section::-webkit-scrollbar-thumb { background: rgba(128,203,196,0.3); border-radius: 3px; }
.section-title { font-size: 13px; letter-spacing: 3px; margin-bottom: 12px; opacity: 0.9; display: flex; align-items: center; gap: 8px; }
.section-title svg { width: 16px; height: 16px; color: var(--teal-light); }
.fish-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.fish-card {
  background: linear-gradient(180deg, rgba(0,77,80,0.6), rgba(0,77,80,0.3));
  border: 1px solid rgba(128,203,196,0.2);
  border-radius: 14px; padding: 14px;
  backdrop-filter: blur(10px);
  transition: all 0.35s; cursor: pointer;
  position: relative; overflow: hidden;
}
.fish-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--teal-pale), var(--teal-light));
  opacity: 0.5; transition: opacity 0.3s;
}
.fish-card:hover {
  transform: translateY(-4px);
  border-color: var(--teal-pale);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
.fish-card:hover::before { opacity: 1; }
.fish-card.active {
  border-color: var(--gold);
  background: linear-gradient(180deg, rgba(255,235,59,0.1), rgba(255,235,59,0.02));
  box-shadow: 0 0 20px rgba(255,235,59,0.3);
}
.fish-card.active::before { background: linear-gradient(90deg, var(--gold), #fff176); }
.fish-icon { width: 100%; height: 56px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
.fish-icon svg { width: 90%; height: 100%; transition: transform 0.4s; }
.fish-card:hover .fish-icon svg { transform: scale(1.12) rotate(-5deg); }
.fish-name { font-size: 15px; font-weight: 700; letter-spacing: 2px; text-align: center; }
.fish-activity { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.activity-bar { flex: 1; height: 6px; background: rgba(128,203,196,0.15); border-radius: 3px; overflow: hidden; }
.activity-fill { height: 100%; background: linear-gradient(90deg, var(--teal-light), var(--gold)); border-radius: 3px; transition: width 0.6s; }
.activity-val { font-size: 11px; font-weight: 700; color: var(--gold); min-width: 32px; text-align: right; }
.bait-tag { display: inline-block; font-size: 10px; background: rgba(128,203,196,0.2); padding: 3px 10px; border-radius: 10px; margin-top: 8px; letter-spacing: 1px; color: var(--teal-pale); }
.bait-icon { display: inline-block; margin-right: 3px; }

/* Toast */
.toast {
  position: fixed; top: 30px; left: 50%;
  transform: translateX(-50%) translateY(-30px);
  background: rgba(128,203,196,0.95); color: var(--teal-deep);
  padding: 10px 24px; border-radius: 20px;
  font-size: 13px; letter-spacing: 2px;
  opacity: 0; transition: all 0.4s;
  z-index: 100; font-weight: 600;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  display: flex; align-items: center; gap: 6px;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 900px) {
  .dashboard { grid-template-columns: repeat(3, 1fr); }
  .fish-grid { grid-template-columns: repeat(2, 1fr); }
  main { padding: 0 12px 12px; }
}
@media (max-width: 600px) {
  .dashboard { grid-template-columns: repeat(2, 1fr); }
  .fish-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<canvas id="waterCanvas"></canvas>
<canvas id="fishCanvas"></canvas>

<header>
  <div class="logo-wrap">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14c-2.21 0-4-1.79-4-4s1.79-4 4-4c1.1 0 2.1.45 2.83 1.17L12 10.83V16zm6-2c0 1.1-.45 2.1-1.17 2.83L14.17 15H12v-2.17l2.17 2.17C15.6 14.45 17 13.1 17 12s-1.4-2.45-2.83-2.83L12 11.34V8.83l2.17-2.17C15.55 5.45 17 6.45 17 8v6z"/></svg>
    </div>
    <div class="logo-text">
      <div class="name">渔<span>知</span>天</div>
      <div class="en">FISHING INTELLIGENCE</div>
    </div>
  </div>
  <div class="time-display">
    <span class="dot"></span>
    <span id="timeDisplay">实时监测中</span>
  </div>
</header>

<main>
  <div class="dashboard">
    <div class="gauge-card">
      <div class="gauge-head">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 13V5c0-1.66-1.34-3-3-3S9 3.34 9 5v8c-1.21.91-2 2.37-2 4 0 2.76 2.24 5 5 5s5-2.24 5-5c0-1.63-.79-3.09-2-4zm-4-8c0-.55.45-1 1-1s1 .45 1 1h-1v1h1v2h-1v1h1v2h-2V5z"/></svg>
        <div class="gauge-title">气 温</div>
      </div>
      <svg class="gauge-svg" viewBox="0 0 80 80">
        <defs>
          <linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4dd0e1"/>
            <stop offset="100%" stop-color="#00838f"/>
          </linearGradient>
        </defs>
        <circle class="gauge-bg" cx="40" cy="40" r="32"/>
        <circle class="gauge-fg" id="g1" cx="40" cy="40" r="32" stroke-dasharray="201" stroke-dashoffset="60" transform="rotate(-90 40 40)"/>
      </svg>
      <div class="gauge-value" id="v1">26°</div>
      <div class="gauge-unit">CELSIUS</div>
    </div>
    <div class="gauge-card">
      <div class="gauge-head">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v2h-2V7zm0 4h2v6h-2v-6z"/></svg>
        <div class="gauge-title">气 压</div>
      </div>
      <svg class="gauge-svg" viewBox="0 0 80 80">
        <circle class="gauge-bg" cx="40" cy="40" r="32"/>
        <circle class="gauge-fg" id="g2" cx="40" cy="40" r="32" stroke-dasharray="201" stroke-dashoffset="80" transform="rotate(-90 40 40)"/>
      </svg>
      <div class="gauge-value" id="v2">1013</div>
      <div class="gauge-unit">HPA</div>
    </div>
    <div class="gauge-card">
      <div class="gauge-head">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.5 17c0 1.65-1.35 3-3 3s-3-1.35-3-3h2c0 .55.45 1 1 1s1-.45 1-1-.45-1-1-1c-1.65 0-3-1.35-3-3 0-1.65 1.35-3 3-3v2c-.55 0-1 .45-1 1s.45 1 1 1c1.65 0 3 1.35 3 3zM12 6c2.21 0 4 1.79 4 4v3h2v3H6v-3h2v-3c0-2.21 1.79-4 4-4z"/></svg>
        <div class="gauge-title">风 速</div>
      </div>
      <svg class="gauge-svg" viewBox="0 0 80 80">
        <circle class="gauge-bg" cx="40" cy="40" r="32"/>
        <circle class="gauge-fg" id="g3" cx="40" cy="40" r="32" stroke-dasharray="201" stroke-dashoffset="140" transform="rotate(-90 40 40)"/>
      </svg>
      <div class="gauge-value" id="v3">3.2</div>
      <div class="gauge-unit">M/S</div>
    </div>
    <div class="gauge-card">
      <div class="gauge-head">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.77L11.25 4.61C11.25 4.61 9.97 6.06 8.68 7.94C7.39 9.82 6 12.07 6 14.23A6 6 0 0 0 12 20.23A6 6 0 0 0 18 14.23C18 12.07 16.61 9.82 15.32 7.94C14.03 6.06 12.75 4.61 12.75 4.61L12 3.77M12 6.9C12.44 7.42 12.84 7.85 13.68 9.07C14.89 10.83 16 13.07 16 14.23C16 16.45 14.22 18.23 12 18.23S8 16.45 8 14.23C8 13.07 9.11 10.83 10.32 9.07C11.16 7.85 11.56 7.42 12 6.9Z"/></svg>
        <div class="gauge-title">水 温</div>
      </div>
      <svg class="gauge-svg" viewBox="0 0 80 80">
        <circle class="gauge-bg" cx="40" cy="40" r="32"/>
        <circle class="gauge-fg" id="g4" cx="40" cy="40" r="32" stroke-dasharray="201" stroke-dashoffset="100" transform="rotate(-90 40 40)"/>
      </svg>
      <div class="gauge-value" id="v4">22°</div>
      <div class="gauge-unit">CELSIUS</div>
    </div>
    <div class="gauge-card moon-card">
      <div class="gauge-head">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
        <div class="gauge-title">月 相</div>
      </div>
      <svg class="gauge-svg" viewBox="0 0 70 70" id="moonSvg">
        <circle class="moon-circle" cx="35" cy="35" r="24"/>
        <circle class="moon-shadow" id="moonShadow" cx="47" cy="35" r="24"/>
      </svg>
      <div class="gauge-value" id="v5">盈凸月</div>
      <div class="gauge-unit">PHASE</div>
    </div>
  </div>

  <div class="timeline-card">
    <div class="timeline-header">
      <h3>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/></svg>
        24 小 时 鱼 情 活 跃 度
      </h3>
      <div class="cur-time">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
        <span id="curHour">当前: 06:00</span>
      </div>
    </div>
    <div class="timeline-canvas-wrap">
      <canvas id="timelineCanvas"></canvas>
    </div>
    <input type="range" class="timeline-slider" id="hourSlider" min="0" max="23" value="6" oninput="updateHour(this.value)">
    <div class="hour-marks">
      <span>00</span><span>04</span><span>08</span><span>12</span><span>16</span><span>20</span><span>24</span>
    </div>
  </div>

  <div class="fish-section">
    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.4 0-8-3.6-8-8s3.6-8 8-8 8 3.6 8 8-3.6 8-8 8z"/></svg>
      推 荐 鱼 种 与 饵 料
    </div>
    <div class="fish-grid" id="fishGrid"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const fishData = [
  { name: '鲫鱼', bait: '红虫·蚯蚓', svg: '<path d="M10,30 Q30,15 60,30 Q80,40 60,50 Q30,65 10,50 Z" fill="#80cbc4"/><path d="M60,30 L78,20 L78,60 L60,50 Z" fill="#4db6ac"/><circle cx="25" cy="28" r="3" fill="#006064"/><path d="M30,32 L40,28 M30,38 L40,34" stroke="#006064" stroke-width="0.8" fill="none"/>' },
  { name: '鲤鱼', bait: '玉米·面团', svg: '<path d="M10,35 Q35,15 65,35 Q85,45 65,55 Q35,75 10,55 Z" fill="#ffb74d"/><path d="M65,35 L82,22 L82,68 L65,55 Z" fill="#f57c00"/><circle cx="28" cy="32" r="3" fill="#3e2723"/><path d="M30,55 Q50,48 70,55" stroke="#e65100" stroke-width="1.5" fill="none"/>' },
  { name: '草鱼', bait: '嫩草·芦苇', svg: '<path d="M8,32 Q32,14 58,32 Q78,42 58,52 Q32,70 8,52 Z" fill="#81c784"/><path d="M58,32 L76,18 L76,66 L58,52 Z" fill="#388e3c"/><circle cx="24" cy="30" r="3" fill="#1b5e20"/><path d="M15,42 L25,38 M30,48 L42,42" stroke="#1b5e20" stroke-width="0.8" fill="none"/>' },
  { name: '鲈鱼', bait: '小鱼·虾', svg: '<path d="M10,34 Q30,12 55,30 Q80,42 55,54 Q30,72 10,54 Z" fill="#90caf9"/><path d="M55,30 L75,15 L75,69 L55,54 Z" fill="#1976d2"/><circle cx="26" cy="30" r="3" fill="#0d47a1"/><path d="M15,25 L35,20 M18,60 L35,55 M22,42 L38,38" stroke="#1976d2" stroke-width="1" fill="none"/>' },
  { name: '鳊鱼', bait: '麦麸·豆饼', svg: '<ellipse cx="40" cy="35" rx="38" ry="20" fill="#ffcc80"/><path d="M75,35 L88,22 L88,48 L75,35 Z" fill="#e65100"/><circle cx="22" cy="32" r="3" fill="#bf360c"/><path d="M30,42 L40,38 M50,42 L60,40" stroke="#bf360c" stroke-width="0.8" fill="none"/>' },
  { name: '黑鱼', bait: '青蛙·泥鳅', svg: '<path d="M10,36 Q28,14 55,32 Q85,44 55,56 Q28,74 10,56 Z" fill="#424242"/><path d="M55,32 L78,16 L78,72 L55,56 Z" fill="#212121"/><circle cx="25" cy="30" r="4" fill="#ffeb3b"/><path d="M22,30 L28,30" stroke="#212121" stroke-width="1"/>' },
  { name: '鲶鱼', bait: '鸡肝·蚯蚓', svg: '<path d="M5,38 Q20,20 50,35 Q78,45 88,38 Q78,42 50,55 Q20,70 5,52 Z" fill="#8d6e63"/><circle cx="18" cy="34" r="2.5" fill="#3e2723"/><path d="M15,28 L8,22 M15,48 L8,54" stroke="#5d4037" stroke-width="1.2" fill="none"/>' },
  { name: '翘嘴', bait: '路亚·米诺', svg: '<path d="M10,35 Q35,10 60,30 Q82,40 60,50 Q35,70 10,55 Z" fill="#b3e5fc"/><path d="M60,30 L80,15 L80,65 L60,55 Z" fill="#0288d1"/><circle cx="28" cy="28" r="3" fill="#01579b"/><path d="M40,32 L45,28 M15,42 L25,38" stroke="#0288d1" stroke-width="1" fill="none"/>' },
];

let currentHour = 6;
const activityCurve = [0.3,0.2,0.15,0.25,0.5,0.8,0.95,0.85,0.6,0.4,0.35,0.3,
  0.4,0.5,0.45,0.4,0.55,0.7,0.85,0.9,0.75,0.55,0.45,0.35];
const moonPhases = ['新月','蛾眉月','上弦月','盈凸月','满月','亏凸月','下弦月','残月'];

// 水波纹Canvas
const wc = document.getElementById('waterCanvas');
const wctx = wc.getContext('2d');
let ripples = [];
function resizeW() { wc.width = window.innerWidth; wc.height = window.innerHeight; }
resizeW();
window.addEventListener('resize', resizeW);
wc.style.pointerEvents = 'auto';
wc.addEventListener('click', function(e) {
  ripples.push({ x: e.clientX, y: e.clientY, r: 0, opacity: 0.7 });
});
function animateWater() {
  wctx.clearRect(0, 0, wc.width, wc.height);
  const t = Date.now() * 0.0005;
  wctx.strokeStyle = 'rgba(128,203,196,0.08)';
  wctx.lineWidth = 1;
  for (let y = 0; y < wc.height; y += 40) {
    wctx.beginPath();
    for (let x = 0; x <= wc.width; x += 10) {
      const wy = y + Math.sin(x * 0.01 + t) * 8 + Math.sin(x * 0.02 + t * 1.5) * 4;
      if (x === 0) wctx.moveTo(x, wy); else wctx.lineTo(x, wy);
    }
    wctx.stroke();
  }
  ripples = ripples.filter(function(r) {
    r.r += 2; r.opacity -= 0.01;
    if (r.opacity <= 0) return false;
    wctx.strokeStyle = 'rgba(128,203,196,' + r.opacity + ')';
    wctx.lineWidth = 2;
    wctx.beginPath(); wctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); wctx.stroke();
    return true;
  });
  requestAnimationFrame(animateWater);
}
animateWater();

// 鱼群Canvas
const fc = document.getElementById('fishCanvas');
const fctx = fc.getContext('2d');
let fishes = [];
function resizeF() { fc.width = window.innerWidth; fc.height = window.innerHeight; }
resizeF();
window.addEventListener('resize', resizeF);
function initFish() {
  fishes = [];
  const count = Math.floor(8 + activityCurve[currentHour] * 20);
  for (let i = 0; i < count; i++) {
    fishes.push({
      x: Math.random() * fc.width, y: Math.random() * fc.height,
      vx: (Math.random() - 0.5) * (1 + activityCurve[currentHour] * 3),
      vy: (Math.random() - 0.5) * (0.5 + activityCurve[currentHour] * 2),
      size: Math.random() * 8 + 4,
      dir: Math.random() > 0.5 ? 1 : -1
    });
  }
}
function animateFish() {
  fctx.clearRect(0, 0, fc.width, fc.height);
  const speed = 0.5 + activityCurve[currentHour] * 2;
  fishes.forEach(function(f) {
    f.x += f.vx * speed; f.y += f.vy * speed;
    if (f.x < -20) f.x = fc.width + 20; if (f.x > fc.width + 20) f.x = -20;
    if (f.y < -20) f.y = fc.height + 20; if (f.y > fc.height + 20) f.y = -20;
    fctx.save();
    fctx.translate(f.x, f.y);
    if (f.vx < 0) fctx.scale(-1, 1);
    fctx.fillStyle = 'rgba(128,203,196,0.6)';
    fctx.beginPath();
    fctx.ellipse(0, 0, f.size, f.size * 0.4, 0, 0, Math.PI * 2);
    fctx.fill();
    fctx.beginPath();
    fctx.moveTo(-f.size, 0);
    fctx.lineTo(-f.size * 1.6, -f.size * 0.5);
    fctx.lineTo(-f.size * 1.6, f.size * 0.5);
    fctx.fill();
    fctx.restore();
  });
  requestAnimationFrame(animateFish);
}
initFish();
animateFish();

// 时间轴Canvas
const tc = document.getElementById('timelineCanvas');
const tctx = tc.getContext('2d');
function resizeT() {
  tc.width = tc.offsetWidth * window.devicePixelRatio;
  tc.height = tc.offsetHeight * window.devicePixelRatio;
  tctx.scale(window.devicePixelRatio, window.devicePixelRatio);
}
function drawTimeline() {
  const w = tc.offsetWidth, h = tc.offsetHeight;
  tctx.clearRect(0, 0, w, h);
  const padding = 10;
  const cw = w - padding * 2, ch = h - padding * 2;
  tctx.strokeStyle = 'rgba(128,203,196,0.1)';
  tctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = padding + (ch / 4) * i;
    tctx.beginPath(); tctx.moveTo(padding, y); tctx.lineTo(w - padding, y); tctx.stroke();
  }
  const grad = tctx.createLinearGradient(0, padding, 0, h - padding);
  grad.addColorStop(0, 'rgba(255,235,59,0.3)');
  grad.addColorStop(1, 'rgba(128,203,196,0.05)');
  tctx.beginPath();
  tctx.moveTo(padding, h - padding);
  activityCurve.forEach(function(v, i) {
    const x = padding + (cw / 23) * i;
    const y = padding + ch - (v * ch);
    if (i === 0) tctx.lineTo(x, y); else {
      const px = padding + (cw / 23) * (i - 1);
      const py = padding + ch - (activityCurve[i - 1] * ch);
      const cpx = (px + x) / 2;
      tctx.bezierCurveTo(cpx, py, cpx, y, x, y);
    }
  });
  tctx.lineTo(w - padding, h - padding);
  tctx.closePath();
  tctx.fillStyle = grad; tctx.fill();
  tctx.beginPath();
  activityCurve.forEach(function(v, i) {
    const x = padding + (cw / 23) * i;
    const y = padding + ch - (v * ch);
    if (i === 0) tctx.moveTo(x, y); else {
      const px = padding + (cw / 23) * (i - 1);
      const py = padding + ch - (activityCurve[i - 1] * ch);
      const cpx = (px + x) / 2;
      tctx.bezierCurveTo(cpx, py, cpx, y, x, y);
    }
  });
  tctx.strokeStyle = '#80cbc4'; tctx.lineWidth = 2.5; tctx.stroke();
  const cx = padding + (cw / 23) * currentHour;
  const cy = padding + ch - (activityCurve[currentHour] * ch);
  tctx.beginPath(); tctx.arc(cx, cy, 6, 0, Math.PI * 2);
  tctx.fillStyle = '#ffeb3b'; tctx.shadowBlur = 12; tctx.shadowColor = '#ffeb3b'; tctx.fill();
  tctx.shadowBlur = 0;
  tctx.strokeStyle = 'rgba(255,235,59,0.4)'; tctx.lineWidth = 1; tctx.setLineDash([3, 3]);
  tctx.beginPath(); tctx.moveTo(cx, padding); tctx.lineTo(cx, h - padding); tctx.stroke();
  tctx.setLineDash([]);
}
resizeT();
drawTimeline();
window.addEventListener('resize', function() { resizeT(); drawTimeline(); });

// 鱼种卡片
function renderFish() {
  const grid = document.getElementById('fishGrid');
  grid.innerHTML = '';
  const activity = activityCurve[currentHour];
  fishData.forEach(function(f, i) {
    const fa = Math.round((0.3 + Math.random() * 0.4 + activity * 0.5) * 100);
    const card = document.createElement('div');
    card.className = 'fish-card' + (fa > 70 ? ' active' : '');
    card.innerHTML =
      '<div class="fish-icon"><svg viewBox="0 0 90 70">' + f.svg + '</svg></div>' +
      '<div class="fish-name">' + f.name + '</div>' +
      '<div class="fish-activity">' +
        '<div class="activity-bar"><div class="activity-fill" style="width:' + fa + '%"></div></div>' +
        '<span class="activity-val">' + fa + '%</span>' +
      '</div>' +
      '<div class="bait-tag">🎣 饵: ' + f.bait + '</div>';
    card.onclick = function() { showToast('🐟 ' + f.name + ' · 饵料: ' + f.bait); };
    grid.appendChild(card);
    setTimeout(function() {
      card.style.opacity = '0'; card.style.transform = 'translateY(15px)';
      requestAnimationFrame(function() {
        card.style.transition = 'all 0.4s'; card.style.opacity = '1'; card.style.transform = 'translateY(0)';
      });
    }, i * 50);
  });
}
renderFish();

function updateHour(h) {
  currentHour = +h;
  document.getElementById('curHour').textContent = '当前: ' + String(h).padStart(2, '0') + ':00';
  drawTimeline();
  renderFish();
  initFish();
  updateGauges();
}
function updateGauges() {
  const a = activityCurve[currentHour];
  document.getElementById('v1').textContent = Math.round(20 + a * 12) + '°';
  document.getElementById('v2').textContent = Math.round(1005 + a * 15);
  document.getElementById('v3').textContent = (1 + a * 5).toFixed(1);
  document.getElementById('v4').textContent = Math.round(18 + a * 6) + '°';
  document.getElementById('g1').style.strokeDashoffset = Math.round(201 - a * 100);
  document.getElementById('g2').style.strokeDashoffset = Math.round(201 - a * 80);
  document.getElementById('g3').style.strokeDashoffset = Math.round(201 - a * 140);
  document.getElementById('g4').style.strokeDashoffset = Math.round(201 - a * 90);
}
updateGauges();

// 月相
let moonAngle = 0;
document.getElementById('moonSvg').addEventListener('click', function() {
  moonAngle += 45;
  const phaseIdx = Math.floor(moonAngle / 45) % 8;
  document.getElementById('moonShadow').setAttribute('transform', 'rotate(' + moonAngle + ' 35 35)');
  document.getElementById('v5').textContent = moonPhases[phaseIdx];
  showToast('🌙 月相: ' + moonPhases[phaseIdx]);
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(function() { t.classList.remove('show'); }, 1800);
}

setInterval(function() {
  const d = new Date();
  document.getElementById('timeDisplay').textContent =
    d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0') + '  ' +
    String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}, 1000);
</script>
