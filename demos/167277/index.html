  <section class="album-head"><div><div class="eyebrow" id="count">SHARED ALBUM · 0 PHOTOS</div><h1 id="provinceTitle">广东</h1><p class="desc" id="provinceDesc"></p></div><div><input class="file" id="file" type="file" accept="image/jpeg,image/png,image/webp"><button class="upload" id="upload">+ 上传照片</button></div></section>

<script>
const home=document.querySelector('#home'),album=document.querySelector('#album'),gallery=document.querySelector('#gallery'),fileInput=document.querySelector('#file');let currentProvince='广东';
const openDb=()=>new Promise((resolve,reject)=>{const req=indexedDB.open('map-album-demo',1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('photos'))db.createObjectStore('photos',{keyPath:'id'});if(!db.objectStoreNames.contains('likes'))db.createObjectStore('likes',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
const tx=(store,mode='readonly')=>openDb().then(db=>db.transaction(store,mode).objectStore(store));
const all=async store=>new Promise(async(resolve,reject)=>{const r=(await tx(store)).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const put=async(store,value)=>new Promise(async(resolve,reject)=>{const r=(await tx(store,'readwrite')).put(value);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)});
const del=async(store,id)=>new Promise(async(resolve,reject)=>{const r=(await tx(store,'readwrite')).delete(id);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)});
document.querySelectorAll('.province').forEach(btn=>{const name=btn.dataset.name;const p=btn.querySelector('path');p.addEventListener('mouseenter',()=>document.querySelector('#hoverName').textContent=name);p.addEventListener('mouseleave',()=>document.querySelector('#hoverName').textContent='选择省份');p.addEventListener('click',()=>openProvince(name))});
async function openProvince(name){currentProvince=name;home.classList.add('hidden');album.classList.remove('hidden');document.querySelector('#provinceTitle').textContent=name;document.querySelector('#provinceDesc').textContent='那些在'+name+'按下快门的瞬间，正在这里相遇。';await render();scrollTo(0,0)}
document.querySelector('#back').onclick=()=>{album.classList.add('hidden');home.classList.remove('hidden');scrollTo(0,0)};
document.querySelector('#upload').onclick=()=>fileInput.click();
fileInput.onchange=async()=>{const f=fileInput.files[0];if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)){alert('请选择 JPG、PNG 或 WebP 图片');return}if(f.size>8*1024*1024){alert('单张图片请控制在 8 MB 以内');return}await put('photos',{id:crypto.randomUUID(),province:currentProvince,name:f.name,createdAt:Date.now(),blob:f});fileInput.value='';await render()};
async function render(){const photos=(await all('photos')).filter(x=>x.province===currentProvince).sort((a,b)=>b.createdAt-a.createdAt),likes=await all('likes');document.querySelector('#count').textContent='SHARED ALBUM · '+photos.length+' PHOTOS';if(!photos.length){gallery.innerHTML='<div class="empty"><span>01</span><b>这里还没有照片</b><p>成为第一个把'+currentProvince+'的精彩瞬间留在这里的人。</p></div>';return}gallery.className='grid';gallery.innerHTML='';for(const photo of photos){const url=URL.createObjectURL(photo.blob),liked=likes.some(x=>x.id===photo.id);const card=document.createElement('article');card.className='card';card.innerHTML='<div class="photo"><img alt="'+currentProvince+'照片"></div><div class="meta"><div><b>匿名旅人</b><small>'+new Date(photo.createdAt).toLocaleDateString('zh-CN')+'</small></div><div class="actions"><button class="like '+(liked?'liked':'')+'">♥ '+(liked?1:0)+'</button><button class="delete">删除</button></div></div>';card.querySelector('img').src=url;card.querySelector('.photo').onclick=()=>{document.querySelector('#lightboxImg').src=url;document.querySelector('#lightbox').classList.remove('hidden')};card.querySelector('.like').onclick=async()=>{if(liked)await del('likes',photo.id);else await put('likes',{id:photo.id});await render()};card.querySelector('.delete').onclick=async()=>{if(confirm('确定删除这张照片吗？')){await del('photos',photo.id);await del('likes',photo.id);await render()}};gallery.appendChild(card)}}
document.querySelector('#lightbox').onclick=()=>document.querySelector('#lightbox').classList.add('hidden');
</script>
