<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D几何绘图闯关</title>
<style>
/* ============================================
   全局样式 - 固定标准配色
   冰蓝#87CEFA  亮冰蓝#00BFFF  深空灰#1A1A2E
   极简科技UI，全程无弹窗
   ============================================ */
:root {
  --ice-blue: #87CEFA;
  --bright-ice: #00BFFF;
  --deep-gray: #1A1A2E;
  --white: #E8F0FE;
  --success: #4CAF50;
  --danger: #FF5252;
  --warning: #FFB74D;
  --bg-dark: #0D0D1A;
  --panel-bg: rgba(26, 26, 46, 0.95);
  --border-color: rgba(135, 206, 250, 0.25);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #0D0D1A;
  color: #E8F0FE;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

#loading-msg {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  color: #87CEFA; font-size: 16px; z-index: 9999;
}

#app {
  width: 100%; height: 100%;
  position: relative;
}

/* 3D画布容器 */
#canvas-container {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1;
}

#canvas-container canvas { display: block; }

/* 顶部信息栏 */
#top-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 44px;
  background: rgba(26, 26, 46, 0.95);
  border-bottom: 1px solid rgba(135, 206, 250, 0.25);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  z-index: 10;
  backdrop-filter: blur(10px);
}

#level-info {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: #87CEFA;
}

#level-info .level-num {
  font-size: 20px;
  font-weight: bold;
  color: #00BFFF;
}

.level-task {
  color: #E8F0FE;
  font-size: 13px;
  font-weight: 500;
  margin: 0 4px;
  white-space: nowrap;
}

#mode-badge {
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  background: #00BFFF;
  color: #1A1A2E;
  font-weight: bold;
}

#user-area {
  display: flex;
  align-items: center;
  gap: 6px;
  position: relative;
}

#login-btn-tx, #login-btn-local, #user-name {
  padding: 4px 12px;
  border-radius: 14px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid #87CEFA;
  background: transparent;
  color: #87CEFA;
  transition: all 0.2s;
  white-space: nowrap;
}

#login-btn-tx {
  background: rgba(0, 191, 255, 0.15);
  border-color: #00BFFF;
  color: #00BFFF;
}

#login-btn-tx:hover { background: #00BFFF; color: #1A1A2E; }
#login-btn-local:hover { background: #87CEFA; color: #1A1A2E; }

#user-name {
  border: none;
  color: #00BFFF;
  cursor: default;
  font-weight: bold;
}

#logout-btn {
  padding: 4px 10px;
  border-radius: 10px;
  font-size: 11px;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.2);
  background: transparent;
  color: rgba(255,255,255,0.5);
}
#logout-btn:hover { color: #FF5252; border-color: #FF5252; }

/* 登录下拉表单 - 无弹窗，从顶部展开 */
#login-dropdown {
  position: absolute;
  top: 48px;
  right: 0;
  width: 260px;
  background: rgba(26, 26, 46, 0.98);
  border: 1px solid rgba(135, 206, 250, 0.25);
  border-radius: 12px;
  padding: 16px;
  z-index: 30;
  backdrop-filter: blur(10px);
  display: none;
}

#login-dropdown.show { display: block; }

#login-dropdown h3 {
  font-size: 14px;
  color: #87CEFA;
  margin-bottom: 12px;
  text-align: center;
}

.form-group { margin-bottom: 10px; }

.form-group label {
  display: block;
  font-size: 12px;
  color: #87CEFA;
  margin-bottom: 3px;
}

.form-input {
  width: 100%;
  padding: 8px 10px;
  border-radius: 6px;
  border: 1px solid rgba(135, 206, 250, 0.25);
  background: rgba(255,255,255,0.05);
  color: #E8F0FE;
  font-size: 13px;
  outline: none;
}

.form-input:focus { border-color: #00BFFF; }

.form-btn {
  width: 100%;
  padding: 8px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  border: none;
  background: #00BFFF;
  color: #1A1A2E;
  font-weight: bold;
  margin-top: 4px;
}

.form-switch {
  text-align: center;
  margin-top: 10px;
  font-size: 11px;
  color: rgba(255,255,255,0.5);
}

.form-switch span {
  color: #87CEFA;
  cursor: pointer;
}

.form-msg {
  text-align: center;
  font-size: 11px;
  margin-top: 6px;
  min-height: 16px;
}
.form-msg.error { color: #FF5252; }
.form-msg.success { color: #4CAF50; }

/* 导航按钮组 */
#nav-btns {
  position: absolute;
  top: 52px;
  right: 12px;
  display: flex;
  gap: 6px;
  z-index: 10;
}

.nav-btn {
  padding: 6px 14px;
  border-radius: 14px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid rgba(135, 206, 250, 0.25);
  background: rgba(26, 26, 46, 0.95);
  color: #E8F0FE;
  backdrop-filter: blur(10px);
  transition: all 0.2s;
}

.nav-btn:hover, .nav-btn.active {
  border-color: #87CEFA;
  color: #87CEFA;
}

/* 底部工具栏 */
#bottom-bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: rgba(26, 26, 46, 0.95);
  border-top: 1px solid rgba(135, 206, 250, 0.25);
  padding: 10px 12px;
  z-index: 10;
  backdrop-filter: blur(10px);
}

#controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.coord-group {
  display: flex;
  align-items: center;
  gap: 4px;
}

.coord-label {
  font-size: 12px;
  font-weight: bold;
  width: 16px;
  text-align: center;
}
.coord-label.x { color: #FF4444; }
.coord-label.y { color: #44FF44; }
.coord-label.z { color: #4488FF; }

.coord-input {
  width: 58px;
  padding: 6px 4px;
  border-radius: 6px;
  border: 1px solid rgba(135, 206, 250, 0.25);
  background: rgba(255,255,255,0.05);
  color: #E8F0FE;
  font-size: 13px;
  text-align: center;
  outline: none;
}

.coord-input:focus { border-color: #87CEFA; }

.action-btn {
  padding: 7px 14px;
  border-radius: 16px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid rgba(135, 206, 250, 0.25);
  background: rgba(26, 26, 46, 0.95);
  color: #E8F0FE;
  transition: all 0.2s;
  white-space: nowrap;
}

.action-btn:hover { border-color: #87CEFA; color: #87CEFA; }

/* 视角控制浮动面板 */
#view-controls {
  position: absolute;
  top: 60px;
  right: 12px;
  z-index: 12;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
#view-controls .view-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid rgba(135, 206, 250, 0.3);
  background: rgba(26, 26, 46, 0.9);
  color: #87CEFA;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  line-height: 1;
}
#view-controls .view-btn:hover {
  background: rgba(0, 191, 255, 0.2);
  border-color: #00BFFF;
  color: #fff;
}
.action-btn.primary {
  background: #00BFFF;
  color: #1A1A2E;
  border-color: #00BFFF;
  font-weight: bold;
}
.action-btn.danger { border-color: #FF5252; color: #FF5252; }
.action-btn.danger:hover { background: #FF5252; color: white; }
.action-btn.gallery-btn { border-color: #87CEFA; color: #87CEFA; }

/* 顶点列表 */
#vertex-list {
  position: absolute;
  bottom: 80px;
  left: 12px;
  max-height: 180px;
  overflow-y: auto;
  z-index: 10;
  font-size: 11px;
  color: #87CEFA;
  background: rgba(26, 26, 46, 0.95);
  border-radius: 8px;
  padding: 8px;
  border: 1px solid rgba(135, 206, 250, 0.25);
  min-width: 150px;
  display: none;
}

#vertex-list.show { display: block; }

#vertex-list .v-item {
  padding: 3px 6px;
  border-radius: 3px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}

#vertex-list .v-item:hover { background: rgba(135,206,250,0.15); }
#vertex-list .v-item.selected { color: #00BFFF; font-weight: bold; background: rgba(0,191,255,0.15); }
#vertex-list .v-item.select-source { border-left: 2px solid #FFB74D; }
#vertex-list .v-item.select-target { border-left: 2px solid #00BFFF; }

#vertex-list .v-num {
  display: inline-block;
  width: 18px;
  height: 18px;
  line-height: 18px;
  text-align: center;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  font-size: 10px;
}

#vertex-list .v-del {
  margin-left: auto;
  width: 20px;
  height: 20px;
  line-height: 20px;
  text-align: center;
  border-radius: 50%;
  font-size: 14px;
  color: #FF5252;
  cursor: pointer;
  opacity: 0.5;
  transition: all 0.15s;
}
#vertex-list .v-del:hover {
  opacity: 1;
  background: rgba(255, 82, 82, 0.2);
}

/* 线段列表 */
#edge-list {
  position: absolute;
  bottom: 80px;
  right: 12px;
  max-height: 180px;
  overflow-y: auto;
  z-index: 10;
  font-size: 11px;
  color: #87CEFA;
  background: rgba(26, 26, 46, 0.95);
  border-radius: 8px;
  padding: 8px;
  border: 1px solid rgba(135, 206, 250, 0.25);
  min-width: 130px;
  display: none;
}
#edge-list.show { display: block; }
#edge-list .e-item {
  padding: 3px 6px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  cursor: default;
}
#edge-list .e-item:hover { background: rgba(135,206,250,0.08); }
#edge-list .e-num {
  display: inline-block;
  width: 16px;
  height: 16px;
  line-height: 16px;
  text-align: center;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  font-size: 9px;
  flex-shrink: 0;
}
#edge-list .e-del {
  margin-left: auto;
  width: 18px;
  height: 18px;
  line-height: 18px;
  text-align: center;
  border-radius: 50%;
  color: #FF5252;
  cursor: pointer;
  opacity: 0.5;
  transition: all 0.15s;
  flex-shrink: 0;
}
#edge-list .e-del:hover {
  opacity: 1;
  background: rgba(255, 82, 82, 0.2);
}

/* 连接模式提示 */
#connect-hint {
  position: absolute;
  bottom: 80px;
  left: 180px;
  z-index: 10;
  font-size: 11px;
  color: #FFB74D;
  background: rgba(26, 26, 46, 0.95);
  border-radius: 8px;
  padding: 6px 12px;
  border: 1px solid rgba(255, 183, 77, 0.25);
  display: none;
}

#connect-hint.show { display: block; }

/* 满级提示 */
#max-level-indicator {
  display: none;
  color: #FFB74D;
  font-weight: bold;
  font-size: 12px;
}
#max-level-indicator.show { display: inline; }

/* 结果提示条 */
#result-toast {
  position: absolute;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  padding: 8px 24px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: bold;
  z-index: 20;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}

#result-toast.show { opacity: 1; }
#result-toast.success { background: #4CAF50; color: white; }
#result-toast.fail { background: #FF5252; color: white; }

/* ============================================
   页面面板 - 无弹窗，全屏切换视图
   ============================================ */
.page-panel {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg-dark);
  z-index: 40;
  display: none;
  flex-direction: column;
  overflow-y: auto;
}

.page-panel.show { display: flex; }

.page-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border-color);
  background: rgba(26, 26, 46, 0.95);
  backdrop-filter: blur(10px);
  min-height: 44px;
  flex-shrink: 0;
}

.page-panel-header h2 {
  font-size: 16px;
  color: var(--ice-blue);
}

.page-panel-close {
  font-size: 20px;
  cursor: pointer;
  color: rgba(255,255,255,0.4);
  background: none;
  border: none;
  padding: 4px 8px;
  border-radius: 6px;
}

.page-panel-close:hover { color: #E8F0FE; background: rgba(255,255,255,0.05); }

.page-panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}

/* 图鉴面板 */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 8px;
}

@media (max-width: 600px) {
  .gallery-grid { grid-template-columns: repeat(8, 1fr); gap: 5px; }
}

.gallery-item {
  aspect-ratio: 1;
  border-radius: 8px;
  border: 1px solid rgba(135, 206, 250, 0.25);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 11px;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}

.gallery-score {
  font-size: 9px;
  color: #FFB74D;
  margin-top: 1px;
}

.gallery-time {
  font-size: 8px;
  color: rgba(135, 206, 250, 0.6);
  margin-top: 1px;
}

.gallery-item.locked {
  background: rgba(255,255,255,0.03);
  color: rgba(255,255,255,0.2);
  cursor: not-allowed;
}

.gallery-item.completed {
  background: rgba(0, 191, 255, 0.1);
  border-color: #00BFFF;
  color: #87CEFA;
}

.gallery-item.current {
  border-color: #FFB74D;
  color: #FFB74D;
  animation: pulse-border 2s infinite;
}

@keyframes pulse-border {
  0%, 100% { border-color: #FFB74D; }
  50% { border-color: rgba(255,183,77,0.3); }
}

.gallery-item .level-num { font-size: 16px; font-weight: bold; }
.gallery-item .level-icon { font-size: 18px; margin-bottom: 1px; }
.gallery-task { font-size: 8px; color: rgba(135,206,250,0.7); margin-top: 1px; white-space: nowrap; }
.gallery-item .check-mark { 
  position: absolute; 
  top: 2px; right: 4px; 
  font-size: 9px; 
  color: #4CAF50; 
}

.gallery-item .lock-icon {
  position: absolute;
  top: 2px; right: 4px;
  font-size: 9px;
  opacity: 0.4;
}

/* 绘图历史面板 */
.history-record {
  padding: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  font-size: 12px;
}

.history-record .h-header {
  color: #87CEFA;
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
}

.history-record .h-vertices {
  color: rgba(255,255,255,0.5);
  font-size: 11px;
  word-break: break-all;
}

/* 腾讯登录分隔线 */
.login-divider {
  display: flex;
  align-items: center;
  margin: 12px 0;
  color: rgba(255,255,255,0.3);
  font-size: 11px;
}

.login-divider::before,
.login-divider::after {
  content: '';
  flex: 1;
  border-top: 1px solid rgba(255,255,255,0.1);
}

.login-divider span { padding: 0 10px; }

/* 响应式适配 */
@media (max-width: 768px) {
  #bottom-bar { padding: 6px 4px; }
  #controls { 
    gap: 3px; 
    flex-wrap: wrap;
    justify-content: center;
  }
  .coord-input { width: 42px; padding: 4px 1px; font-size: 11px; }
  .coord-label { font-size: 10px; width: 12px; }
  .action-btn { padding: 4px 8px; font-size: 10px; border-radius: 12px; }
  #level-info { font-size: 11px; }
  #level-info .level-num { font-size: 15px; }
  #nav-btns { top: 46px; right: 4px; gap: 3px; }
  .nav-btn { padding: 3px 8px; font-size: 10px; border-radius: 10px; }
  #login-btn-tx, #login-btn-local, #user-name { padding: 2px 8px; font-size: 10px; }
  #logout-btn { padding: 2px 6px; font-size: 9px; }
  #top-bar { padding: 0 8px; height: 40px; }
  #vertex-list { bottom: 70px; left: 6px; max-height: 120px; font-size: 10px; }
  #edge-list { bottom: 70px; right: 6px; max-height: 120px; font-size: 10px; min-width: 110px; }
  #login-dropdown { right: -8px; width: 240px; }
  #connect-hint { left: 160px; font-size: 10px; }
  .page-panel-header { padding: 8px 12px; }
  .page-panel-header h2 { font-size: 15px; }
  .page-panel-body { padding: 12px; }
}

@media (max-width: 400px) {
  .coord-input { width: 36px; padding: 3px 0; font-size: 10px; }
  .action-btn { padding: 3px 6px; font-size: 9px; }
  .nav-btn { padding: 2px 6px; font-size: 9px; }
  #level-info .level-num { font-size: 13px; }
  #login-btn-tx, #login-btn-local { font-size: 9px; padding: 2px 6px; }
  #login-dropdown { width: 220px; right: -10px; }
}
</style>
</head>
<body>
<div id="loading-msg">加载中...</div>

<div id="app">
  <!-- 3D画布 -->
  <div id="canvas-container"></div>

  <!-- 视角控制面板 -->
  <div id="view-controls">
    <button class="view-btn" onclick="setCameraView('top')" title="俯视 (T键)">⊙</button>
    <button class="view-btn" onclick="setCameraView('front')" title="正视 (F键)">◉</button>
    <button class="view-btn" onclick="setCameraView('right')" title="右侧视 (R键)">◒</button>
    <button class="view-btn" onclick="setCameraView('default')" title="默认视角 (空格)">↺</button>
  </div>

  <!-- 顶部信息栏 -->
  <div id="top-bar">
    <div id="level-info">
      <span>关卡</span>
      <span class="level-num" id="current-level">1</span>
      <span class="level-task" id="level-task">绘制平面正方形</span>
      <span id="mode-badge">主线</span>
      <span id="max-level-indicator">满级</span>
    </div>
    <div id="user-area">
      <button id="login-btn-tx" onclick="tencentLogin()">腾讯登录</button>
      <button id="login-btn-local" onclick="toggleLoginDropdown()">账号登录</button>
      <span id="user-name" style="display:none;"></span>
      <button id="logout-btn" style="display:none;" onclick="doLogout()">退出</button>
      <!-- 登录下拉表单 -->
      <div id="login-dropdown">
        <h3 id="login-title">账号登录</h3>
        <div class="form-group">
          <label>用户名</label>
          <input type="text" class="form-input" id="login-username" placeholder="请输入用户名" maxlength="20">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" class="form-input" id="login-password" placeholder="请输入密码" maxlength="30">
        </div>
        <div id="login-confirm-password" class="form-group" style="display:none;">
          <label>确认密码</label>
          <input type="password" class="form-input" id="login-password2" placeholder="请再次输入密码" maxlength="30">
        </div>
        <button class="form-btn" id="login-submit-btn" onclick="doLogin()">登录</button>
        <div class="form-switch">
          <span id="form-switch-text" onclick="toggleLoginMode()">没有账号？去注册</span>
        </div>
        <div class="form-msg" id="form-msg"></div>
        <div class="login-divider"><span>或</span></div>
        <button class="form-btn" style="background:transparent;border:1px solid #00BFFF;color:#00BFFF;font-weight:normal;" onclick="tencentLogin()">使用腾讯账号登录</button>
      </div>
    </div>
  </div>

  <!-- 导航按钮 -->
  <div id="nav-btns">
    <button class="nav-btn active" id="nav-game" onclick="switchView('game')">闯关</button>
    <button class="nav-btn" id="nav-gallery" onclick="switchView('gallery')">图鉴</button>

    <button class="nav-btn" id="nav-infinite" onclick="switchToInfinite()" style="display:none;">无限</button>
  </div>

  <!-- 结果提示条 -->

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================
// 全局状态
// ============================================
const state = {
  mode: 'mainline',
  currentLevel: 1,
  currentDifficulty: 1,
  isMaxLevel: false,
  user: null,
  token: null,
  vertices: [],
  edges: [],
  mainlineProgress: {},
  infiniteStats: { totalChallenges: 0, successCount: 0 },
  currentView: 'game',
  isLoginMode: true,
  levelTargets: generateLevelTargets(),
  connectMode: false,       // 连线模式
  connectSource: null,      // 连线的第一个选中顶点
  connectTarget: null,      // 连线的第二个选中顶点
  localDrawings: {}         // 本地绘图记录 {levelId: [records]}
};

// ============================================
// 关卡目标生成（1-100关梯度递进）
// 前期：立体正方体 → 立体三角体(四面体) → 平面正方形 → 平面三角形
// 中期：三棱柱(6顶点) → 长方体(8顶点)
// 后期：增强混合图形，难度循序渐进
// ============================================
function generateLevelTargets() {
  const targets = {};
  const SHAPE_NAMES = {
    square: '平面正方形', triangle: '平面三角形',
    cube: '立体正方体', tetrahedron: '立体三角体',
    prism: '立体三棱柱', cuboid: '立长方体'
  };
  const SHAPE_ICONS = {
    square: '◻', triangle: '△', cube: '◻',
    tetrahedron: '△', prism: '▽', cuboid: '▢'
  };
  for (let i = 1; i <= 100; i++) {
    let shapeType, vertexCount, size;
    if (i <= 18) {
      // 前期①：立体正方体（8顶点），从简单尺寸起步
      shapeType = 'cube'; vertexCount = 8;
      size = 2 + Math.floor((i - 1) / 5);
    } else if (i <= 36) {
      // 前期②：立体三角体/四面体（4顶点）
      shapeType = 'tetrahedron'; vertexCount = 4;
      size = 2 + Math.floor((i - 19) / 5);
    } else if (i <= 53) {
      // 前期③：平面正方形（4顶点）
      shapeType = 'square'; vertexCount = 4;
      size = 2 + Math.floor((i - 37) / 5);
    } else if (i <= 70) {
      // 前期④：平面三角形（3顶点）
      shapeType = 'triangle'; vertexCount = 3;
      size = 2 + Math.floor((i - 54) / 5);
    } else if (i <= 83) {
      // 中期①：立体三棱柱（6顶点），新增多面体
      shapeType = 'prism'; vertexCount = 6;
      size = 3 + Math.floor((i - 71) / 4);
    } else if (i <= 93) {
      // 中期②：长方体（8顶点），三种不同边长
      shapeType = 'cuboid'; vertexCount = 8;
      size = 3 + Math.floor((i - 84) / 3);
    } else {
      // 后期：增强混合图形，更大尺寸、更高难度
      const lateShapes = ['cube', 'tetrahedron', 'prism', 'cuboid'];
      shapeType = lateShapes[(i - 94) % 4];
      vertexCount = shapeType === 'cube' ? 8 : shapeType === 'tetrahedron' ? 4 : shapeType === 'prism' ? 6 : 8;
      size = 6 + Math.floor((i - 94) / 2);
    }
    const taskName = SHAPE_NAMES[shapeType] || shapeType;
    const icon = SHAPE_ICONS[shapeType] || '?';
    targets[i] = { shapeType, vertexCount, size, taskName, icon };
  }
  return targets;
}

async function loadLevelTemplates() {
  try {
    const resp = await fetch('/api/level-templates');
    const data = await resp.json();
    if (data.success && data.templates.length > 0) {
      const SHAPE_NAMES = {
        square: '平面正方形', triangle: '平面三角形',
        cube: '立体正方体', tetrahedron: '立体三角体',
        prism: '立体三棱柱', cuboid: '立长方体'
      };
      const SHAPE_ICONS = {
        square: '◻', triangle: '△', cube: '◻',
        tetrahedron: '△', prism: '▽', cuboid: '▢'
      };
      const serverTargets = {};
      data.templates.forEach(t => {
        serverTargets[t.levelId] = {
          shapeType: t.shapeType, vertexCount: t.vertexCount, size: t.size,
          taskName: SHAPE_NAMES[t.shapeType] || t.shapeType,
          icon: SHAPE_ICONS[t.shapeType] || '?'
        };
      });
      state.levelTargets = serverTargets;
    }
  } catch (e) {
    console.log('使用本地关卡模板');
  }
}

// ============================================
// Three.js 3D场景初始化
// ============================================
let scene, camera, renderer, controls;
let gridGroup, axisGroup, drawingGroup, vertexMarkersGroup, edgeLinesGroup;
let vertexSpheres = [];
let edgeLineObjects = [];

const COLORS = {
  iceBlue: 0x87CEFA, brightIce: 0x00BFFF, deepGray: 0x1A1A2E,
  axisX: 0xFF4444, axisY: 0x44FF44, axisZ: 0x4488FF,
  gridLine: 0x87CEFA, vertex: 0x00BFFF, edge: 0xFFFFFF, origin: 0xFFFFFF
};

function initThreeJS() {
  const container = document.getElementById('canvas-container');
  const w = container.clientWidth;
  const h = container.clientHeight;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0D0D1A);

  camera = new THREE.PerspectiveCamera(50, w / h, 0.5, 1000);
  camera.position.set(280, 200, 360);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.12;
  controls.rotateSpeed = 0.6;
  controls.zoomSpeed = 1.2;
  controls.panSpeed = 0.8;
  controls.minDistance = 10;
  controls.maxDistance = 800;
  controls.target.set(0, 0, 0);
  controls.update();
  controls.touches = {
    ONE: THREE.TOUCH.ROTATE,
    TWO: THREE.TOUCH.DOLLY_PAN
  };

  // 视角快捷键
  window.addEventListener('keydown', (e) => {
    // 避免在输入框中触发
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    switch (e.key.toLowerCase()) {
      case 't': setCameraView('top'); break;
      case 'f': setCameraView('front'); break;
      case 'r': setCameraView('right'); break;
      case ' ': e.preventDefault(); setCameraView('default'); break;
    }
  });

  const ambientLight = new THREE.AmbientLight(0x404060, 2);
  scene.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0xffffff, 1);
  dirLight.position.set(10, 15, 10);
  scene.add(dirLight);

  gridGroup = new THREE.Group();
  axisGroup = new THREE.Group();
  drawingGroup = new THREE.Group();
  vertexMarkersGroup = new THREE.Group();
  edgeLinesGroup = new THREE.Group();

  scene.add(gridGroup);
  scene.add(axisGroup);
  scene.add(drawingGroup);
  drawingGroup.add(vertexMarkersGroup);
  drawingGroup.add(edgeLinesGroup);

  buildGridSystem();
  buildAxes();

  // 隐藏加载提示
  const lm = document.getElementById('loading-msg');
  if (lm) lm.style.display = 'none';

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    const cw = container.clientWidth;
    const ch = container.clientHeight;
    camera.aspect = cw / ch;
    camera.updateProjectionMatrix();
    renderer.setSize(cw, ch);
  });
}

// 视角快切函数（带平滑动画）
window.setCameraView = function(view) {
  if (!camera || !controls) return;
  const DISTANCE = 400;
  const target = new THREE.Vector3(0, 0, 0);

  let newPos;
  switch (view) {
    case 'top':
      newPos = new THREE.Vector3(0, DISTANCE, 5);
      break;
    case 'front':
      newPos = new THREE.Vector3(0, 0, DISTANCE);
      break;
    case 'right':
      newPos = new THREE.Vector3(DISTANCE, 0, 0);
      break;
    case 'default':
    default:
      newPos = new THREE.Vector3(280, 200, 360);
      break;
  }

  // 平滑过渡动画
  const startPos = camera.position.clone();
  const startTarget = controls.target.clone();
  const startTime = performance.now();
  const DURATION = 600; // ms

  function animateView(now) {
    const elapsed = now - startTime;
    const t = Math.min(elapsed / DURATION, 1.0);
    // easeInOutCubic
    const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

    camera.position.lerpVectors(startPos, newPos, ease);
    controls.target.lerpVectors(startTarget, target, ease);
    controls.update();

    if (t < 1) {
      requestAnimationFrame(animateView);
    }
  }
  requestAnimationFrame(animateView);
};

// ============================================
// 网格系统 - XY/XZ/YZ三平面，全域±200，每1单位1格
// ============================================
function buildGridSystem() {
  gridGroup.clear();
  const R = 200;
  const GRID_STEP = 20; // 每20单位一条网格线，避免视觉过密
  const RGridMaterial = new THREE.LineBasicMaterial({
    color: COLORS.gridLine,
    transparent: true,
    opacity: 0.12,
    depthTest: true
  });
  gridGroup.add(planeGrid('xy', GRID_STEP, RGridMaterial));
  gridGroup.add(planeGrid('xz', GRID_STEP, RGridMaterial));
  gridGroup.add(planeGrid('yz', GRID_STEP, RGridMaterial));
}

function planeGrid(type, step, material) {
  const R = 200;
  const v = [];
  if (type === 'xy') {
    for (let y = -R; y <= R; y += step) v.push(-R, y, 0, R, y, 0);
    for (let x = -R; x <= R; x += step) v.push(x, -R, 0, x, R, 0);
  } else if (type === 'xz') {
    for (let z = -R; z <= R; z += step) v.push(-R, 0, z, R, 0, z);
    for (let x = -R; x <= R; x += step) v.push(x, 0, -R, x, 0, R);
  } else {
    for (let y = -R; y <= R; y += step) v.push(0, y, -R, 0, y, R);
    for (let z = -R; z <= R; z += step) v.push(0, -R, z, 0, R, z);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  return new THREE.LineSegments(g, material);
}

// ============================================
// 坐标轴 - 完整标注-200到+200全部整数刻度
// 每个整数位置搭配迷你实心点 + 白色数字
// ============================================
function buildAxes() {
  axisGroup.clear();
  const AXIS_LEN = 200;

  // 轴线
  const xGeom = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-AXIS_LEN, 0, 0), new THREE.Vector3(AXIS_LEN, 0, 0)
  ]);
  axisGroup.add(new THREE.Line(xGeom, new THREE.LineBasicMaterial({ color: COLORS.axisX })));

  const yGeom = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, -AXIS_LEN, 0), new THREE.Vector3(0, AXIS_LEN, 0)
  ]);
  axisGroup.add(new THREE.Line(yGeom, new THREE.LineBasicMaterial({ color: COLORS.axisY })));

  const zGeom = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, 0, -AXIS_LEN), new THREE.Vector3(0, 0, AXIS_LEN)
  ]);
  axisGroup.add(new THREE.Line(zGeom, new THREE.LineBasicMaterial({ color: COLORS.axisZ })));

  // 原点白色圆点
  axisGroup.add(new THREE.Mesh(
    new THREE.SphereGeometry(0.6, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0xFFFFFF })
  ));

  // 轴端点标签 X / Y / Z
  makeLabel(AXIS_LEN + 10, 0, 0, 'X', COLORS.axisX);
  makeLabel(0, AXIS_LEN + 10, 0, 'Y', COLORS.axisY);
  makeLabel(0, 0, AXIS_LEN + 10, 'Z', COLORS.axisZ);

  // 整数刻度：-200到+200，每个整数位置一个迷你实心点（InstancedMesh高效）
  // 数字标签仅每20单位标注一个，避免1200个Sprite耗尽GPU内存
  const TICK_INTERVAL = 20;
  const tickDotGeom = new THREE.SphereGeometry(0.3, 4, 4);

  // X轴刻度点和数字
  const xDotMat = new THREE.MeshBasicMaterial({ color: COLORS.axisX, depthTest: false });
  const xDots = new THREE.InstancedMesh(tickDotGeom, xDotMat, AXIS_LEN * 2 + 1);
  let xIdx = 0;
  for (let v = -AXIS_LEN; v <= AXIS_LEN; v++) {
    if (v === 0) continue;
    const m = new THREE.Matrix4().setPosition(v, 0, 0);
    xDots.setMatrixAt(xIdx, m);
    xIdx++;
    if (v % TICK_INTERVAL === 0) makeTickNumber(v, 0, 0, v, 'x');
  }
  xDots.count = xIdx;
  xDots.instanceMatrix.needsUpdate = true;
  axisGroup.add(xDots);

  // Y轴刻度点和数字
  const yDotMat = new THREE.MeshBasicMaterial({ color: COLORS.axisY, depthTest: false });
  const yDots = new THREE.InstancedMesh(tickDotGeom, yDotMat, AXIS_LEN * 2 + 1);
  let yIdx = 0;
  for (let v = -AXIS_LEN; v <= AXIS_LEN; v++) {
    if (v === 0) continue;
    const m = new THREE.Matrix4().setPosition(0, v, 0);
    yDots.setMatrixAt(yIdx, m);
    yIdx++;
    if (v % TICK_INTERVAL === 0) makeTickNumber(0, v, 0, v, 'y');
  }
  yDots.count = yIdx;
  yDots.instanceMatrix.needsUpdate = true;
  axisGroup.add(yDots);

  // Z轴刻度点和数字
  const zDotMat = new THREE.MeshBasicMaterial({ color: COLORS.axisZ, depthTest: false });
  const zDots = new THREE.InstancedMesh(tickDotGeom, zDotMat, AXIS_LEN * 2 + 1);
  let zIdx = 0;
  for (let v = -AXIS_LEN; v <= AXIS_LEN; v++) {
    if (v === 0) continue;
    const m = new THREE.Matrix4().setPosition(0, 0, v);
    zDots.setMatrixAt(zIdx, m);
    zIdx++;
    if (v % TICK_INTERVAL === 0) makeTickNumber(0, 0, v, v, 'z');
  }
  zDots.count = zIdx;
  zDots.instanceMatrix.needsUpdate = true;
  axisGroup.add(zDots);
}

function makeLabel(x, y, z, text, colorHex) {
  const c = document.createElement('canvas');
  c.width = 96; c.height = 48;
  const t = c.getContext('2d');
  t.fillStyle = '#' + colorHex.toString(16).padStart(6, '0');
  t.font = 'bold 36px monospace';
  t.textAlign = 'center';
  t.textBaseline = 'middle';
  t.fillText(text, 48, 24);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
  s.position.set(x, y, z);
  s.scale.set(18, 9, 1);
  axisGroup.add(s);
}

// 整数刻度数字标签（始终朝向屏幕）
function makeTickNumber(x, y, z, value, axis) {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 20;
  const t = c.getContext('2d');
  t.fillStyle = '#FFFFFF';
  t.font = '9px monospace';
  t.textAlign = 'center';
  t.textBaseline = 'middle';
  t.fillText(String(value), 32, 10);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true, opacity: 0.85 }));
  const OFF = 4;
  if (axis === 'x') s.position.set(x, -OFF, 0);
  else if (axis === 'y') s.position.set(-OFF, y, 0);
  else s.position.set(0, -OFF, z);
  s.scale.set(8, 2.5, 1);
  axisGroup.add(s);
}

// ============================================
// 顶点标记
// ============================================
function addVertexMarker(vertex, index) {
  const { x, y, z } = vertex;

  const sphereGeom = new THREE.SphereGeometry(0.6, 8, 8);
  const sphereMat = new THREE.MeshBasicMaterial({ color: COLORS.vertex });
  const sphere = new THREE.Mesh(sphereGeom, sphereMat);
  sphere.position.set(x, y, z);
  vertexMarkersGroup.add(sphere);

  const canvas = document.createElement('canvas');
  canvas.width = 200; canvas.height = 50;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#87CEFA';
  ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`(${x},${y},${z})`, 100, 30);
  const texture = new THREE.CanvasTexture(canvas);
  const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false, depthWrite: false });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.position.set(x, y + 5, z);
  sprite.scale.set(12, 3, 1);
  vertexMarkersGroup.add(sprite);

  vertexSpheres.push({ sphere, sprite, vertex, index });
}

function refreshVertexMarkers() {
  while (vertexMarkersGroup.children.length > 0) {
    vertexMarkersGroup.remove(vertexMarkersGroup.children[0]);
  }
  vertexSpheres = [];
  state.vertices.forEach((v, i) => addVertexMarker(v, i));
}

// ============================================
// 连线渲染
// ============================================
function refreshEdges() {
  while (edgeLinesGroup.children.length > 0) {
    edgeLinesGroup.remove(edgeLinesGroup.children[0]);
  }
  edgeLineObjects = [];

  state.edges.forEach(([fromIdx, toIdx]) => {
    if (fromIdx < state.vertices.length && toIdx < state.vertices.length) {
      const from = state.vertices[fromIdx];
      const to = state.vertices[toIdx];
      const geom = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(from.x, from.y, from.z),
        new THREE.Vector3(to.x, to.y, to.z)
      ]);
      const mat = new THREE.LineBasicMaterial({ color: 0xFFFFFF, linewidth: 2 });
      const line = new THREE.Line(geom, mat);
      edgeLinesGroup.add(line);
      edgeLineObjects.push({ line, fromIdx, toIdx });
    }
  });
  updateEdgeList();
}

// ============================================
// 图形识别与判定（仅按几何特征，不限平面/绘制顺序）
// ============================================
function identifyShape() {
  const verts = state.vertices;
  const edg = state.edges;

  if (verts.length < 3) return { type: 'unknown', confidence: 0 };

  // 邻接表
  const adj = {};
  verts.forEach((_, i) => { adj[i] = []; });
  edg.forEach(([a, b]) => {
    if (!adj[a].includes(b)) adj[a].push(b);
    if (!adj[b].includes(a)) adj[b].push(a);
  });

  // 两点距离
  const dist = (i, j) => {
    const a = verts[i], b = verts[j];
    return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2 + (a.z - b.z) ** 2);
  };

  // 顶点i处的内角（由两个邻接边构成）
  const angleAt = (i) => {
    const nbr = adj[i];
    if (nbr.length < 2) return null;
    const o = verts[i], a = verts[nbr[0]], b = verts[nbr[1]];
    const v1 = { x: a.x - o.x, y: a.y - o.y, z: a.z - o.z };
    const v2 = { x: b.x - o.x, y: b.y - o.y, z: b.z - o.z };
    const dot = v1.x * v2.x + v1.y * v2.y + v1.z * v2.z;
    const m1 = Math.sqrt(v1.x ** 2 + v1.y ** 2 + v1.z ** 2);
    const m2 = Math.sqrt(v2.x ** 2 + v2.y ** 2 + v2.z ** 2);
    if (m1 === 0 || m2 === 0) return 0;
    return Math.acos(dot / (m1 * m2));
  };

  // 闭合判定：每个顶点至少2条边
  const isClosed = Object.values(adj).every(d => d.length >= 2);
  if (!isClosed && verts.length > 3) return { type: 'unknown', confidence: 0 };

  const vertexCount = verts.length;
  const edgeCount = edg.length;

  // 收集所有不重复的边长
  const allDists = [];
  const edgeSet = new Set();
  edg.forEach(([a, b]) => {
    const key = Math.min(a, b) + '_' + Math.max(a, b);
    if (!edgeSet.has(key)) {
      edgeSet.add(key);
      allDists.push(dist(a, b));
    }
  });

  // ===== 正方形：4顶点、4边（每顶点度=2）+ 四边等长(±1) + 四角≈90°(±5°) =====
  if (vertexCount === 4 && edgeCount === 4 && isClosed) {
    const allDeg2 = Object.values(adj).every(d => d.length === 2);
    if (allDeg2 && allDists.length === 4) {
      const avgDist = allDists.reduce((s, d) => s + d, 0) / 4;
      const edgesEqual = allDists.every(d => Math.abs(d - avgDist) <= 1);
      if (edgesEqual) {
        const angles = [0, 1, 2, 3].map(i => angleAt(i)).filter(a => a !== null);
        if (angles.length === 4) {
          const rightAngle = Math.PI / 2;
          const anglesOk = angles.every(a => Math.abs(a - rightAngle) <= 0.087);
          if (anglesOk) {
            return { type: 'square', confidence: 0.9 };
          }
        }
      }
    }
  }

  // ===== 三角形：3顶点、3边、闭合 + 边长>0 + 不共线 =====
  if (vertexCount === 3 && edgeCount === 3 && isClosed) {
    if (allDists.every(d => d > 0)) {
      // 三点不共线检测（叉积模长）
      const p0 = verts[0], p1 = verts[1], p2 = verts[2];
      const v1 = { x: p1.x - p0.x, y: p1.y - p0.y, z: p1.z - p0.z };
      const v2 = { x: p2.x - p0.x, y: p2.y - p0.y, z: p2.z - p0.z };
      const cross = {
        x: v1.y * v2.z - v1.z * v2.y,
        y: v1.z * v2.x - v1.x * v2.z,
        z: v1.x * v2.y - v1.y * v2.x
      };
      const crossLen = Math.sqrt(cross.x ** 2 + cross.y ** 2 + cross.z ** 2);
      if (crossLen > 0.01) {
        return { type: 'triangle', confidence: 0.9 };
      }
    }
  }

  // ===== 正方立体：8顶点、等边(±1) + 相邻棱夹角≈90°(±5°) =====
  if (vertexCount === 8 && edgeCount >= 12) {
    const avgDist = allDists.reduce((s, d) => s + d, 0) / allDists.length;
    const allEdgesEqual = allDists.every(d => Math.abs(d - avgDist) <= 1);
    if (allEdgesEqual) {
      // 检查每个顶点处相邻棱的夹角是否接近90°
      let allAngles90 = true;
      const RIGHT = Math.PI / 2;
      const TOLERANCE = 0.087; // ±5°
      for (let i = 0; i < 8; i++) {
        const nbr = adj[i];
        if (nbr.length < 2) { allAngles90 = false; break; }
        for (let j = 0; j < nbr.length; j++) {
          for (let k = j + 1; k < nbr.length; k++) {
            const o = verts[i], a = verts[nbr[j]], b = verts[nbr[k]];
            const v1 = { x: a.x - o.x, y: a.y - o.y, z: a.z - o.z };
            const v2 = { x: b.x - o.x, y: b.y - o.y, z: b.z - o.z };
            const dot = v1.x * v2.x + v1.y * v2.y + v1.z * v2.z;
            const m1 = Math.sqrt(v1.x ** 2 + v1.y ** 2 + v1.z ** 2);
            const m2 = Math.sqrt(v2.x ** 2 + v2.y ** 2 + v2.z ** 2);
            if (m1 === 0 || m2 === 0) continue;
            const angle = Math.acos(dot / (m1 * m2));
            if (Math.abs(angle - RIGHT) > TOLERANCE) {
              allAngles90 = false;
              break;
            }
          }
          if (!allAngles90) break;
        }
        if (!allAngles90) break;
      }
      if (allAngles90) {
        return { type: 'cube', confidence: 0.9 };
      }
    }
  }

  // ===== 四面体（正三角立体）：4顶点、6边等长(±1) + 每顶点邻边夹角≈60°(±5°) =====
  if (vertexCount === 4 && edgeCount >= 6) {
    const avgDist = allDists.reduce((s, d) => s + d, 0) / allDists.length;
    const allEdgesEqual = allDists.every(d => Math.abs(d - avgDist) <= 1);
    if (allEdgesEqual) {
      let allAngles60 = true;
      const EQUILATERAL = Math.PI / 3; // 60°
      const TOLERANCE = 0.087; // ±5°
      for (let i = 0; i < 4; i++) {
        const nbr = adj[i];
        if (nbr.length < 3) { allAngles60 = false; break; }
        for (let j = 0; j < nbr.length; j++) {
          for (let k = j + 1; k < nbr.length; k++) {
            const o = verts[i], a = verts[nbr[j]], b = verts[nbr[k]];
            const v1 = { x: a.x - o.x, y: a.y - o.y, z: a.z - o.z };
            const v2 = { x: b.x - o.x, y: b.y - o.y, z: b.z - o.z };
            const dot = v1.x * v2.x + v1.y * v2.y + v1.z * v2.z;
            const m1 = Math.sqrt(v1.x ** 2 + v1.y ** 2 + v1.z ** 2);
            const m2 = Math.sqrt(v2.x ** 2 + v2.y ** 2 + v2.z ** 2);
            if (m1 === 0 || m2 === 0) continue;
            const angle = Math.acos(dot / (m1 * m2));
            if (Math.abs(angle - EQUILATERAL) > TOLERANCE) {
              allAngles60 = false;
              break;
            }
          }
          if (!allAngles60) break;
        }
        if (!allAngles60) break;
      }
      if (allAngles60) {
        return { type: 'tetrahedron', confidence: 0.9 };
      }
    }
  }

  // ===== 三棱柱：6顶点 + 边长可分组为2种（3条高 + 6条底面边） =====
  if (vertexCount === 6 && edgeCount >= 9) {
    const grouped = groupEdgesByLength(allDists);
    // 2组不同长度，一组约3条边，另一组约6条边 → 三棱柱特征
    if (grouped.length === 2) {
      const counts = grouped.map(g => g.count);
      if ((counts[0] >= 3 && counts[1] >= 5) || (counts[0] >= 5 && counts[1] >= 3)) {
        // 进一步检查：每个顶点至少2条边
        const allConnected = Object.values(adj).every(d => d.length >= 2);
        if (allConnected) {
          return { type: 'prism', confidence: 0.85 };
        }
      }
    }
  }

  // ===== 长方体：8顶点 + 边长可分组为3种（各4条边）+ 90°夹角 =====
  if (vertexCount === 8 && edgeCount >= 12) {
    const grouped = groupEdgesByLength(allDists);
    // 3组不同长度，每组约4条边 → 长方体特征
    if (grouped.length === 3) {
      const counts = grouped.map(g => g.count);
      if (counts.every(c => c >= 3 && c <= 5)) {
        // 检查相邻棱夹角是否接近90°
        let allAngles90 = true;
        const RIGHT = Math.PI / 2;
        const TOLERANCE = 0.087;
        for (let i = 0; i < 8; i++) {
          const nbr = adj[i];
          if (nbr.length < 2) { allAngles90 = false; break; }
          for (let j = 0; j < nbr.length; j++) {
            for (let k = j + 1; k < nbr.length; k++) {
              const o = verts[i], a = verts[nbr[j]], b = verts[nbr[k]];
              const v1 = { x: a.x - o.x, y: a.y - o.y, z: a.z - o.z };
              const v2 = { x: b.x - o.x, y: b.y - o.y, z: b.z - o.z };
              const dot = v1.x * v2.x + v1.y * v2.y + v1.z * v2.z;
              const m1 = Math.sqrt(v1.x ** 2 + v1.y ** 2 + v1.z ** 2);
              const m2 = Math.sqrt(v2.x ** 2 + v2.y ** 2 + v2.z ** 2);
              if (m1 === 0 || m2 === 0) continue;
              const angle = Math.acos(dot / (m1 * m2));
              if (Math.abs(angle - RIGHT) > TOLERANCE) {
                allAngles90 = false;
                break;
              }
            }
            if (!allAngles90) break;
          }
          if (!allAngles90) break;
        }
        if (allAngles90) {
          return { type: 'cuboid', confidence: 0.85 };
        }
      }
    }
  }

  return { type: 'unknown', confidence: 0 };
}

// 辅助函数：将边长数组按长度分组（±1容差合并）
function groupEdgesByLength(dists) {
  if (dists.length === 0) return [];
  const sorted = [...dists].sort((a, b) => a - b);
  const groups = [];
  let current = { avg: sorted[0], edges: [sorted[0]] };
  for (let i = 1; i < sorted.length; i++) {
    if (Math.abs(sorted[i] - current.avg) <= 1.5) {
      current.edges.push(sorted[i]);
      current.avg = current.edges.reduce((s, d) => s + d, 0) / current.edges.length;
    } else {
      groups.push({ avg: Math.round(current.avg), count: current.edges.length });
      current = { avg: sorted[i], edges: [sorted[i]] };
    }
  }
  groups.push({ avg: Math.round(current.avg), count: current.edges.length });
  return groups;
}

// ============================================
// 自动补全闭合：检测链状结构（恰好2个端点），自动首尾连接形成闭环
// ============================================
function autoCompleteClosure() {
  const V = state.vertices.length;
  if (V < 3) return;

  const adj = {};
  for (let i = 0; i < V; i++) adj[i] = [];
  state.edges.forEach(([a, b]) => {
    if (!adj[a].includes(b)) adj[a].push(b);
    if (!adj[b].includes(a)) adj[b].push(a);
  });

  // 找出所有度数=1的顶点（链的端点）
  const endpoints = [];
  for (let i = 0; i < V; i++) {
    if (adj[i].length === 1) endpoints.push(i);
  }

  // 恰好2个端点 → 链状结构 → 自动首尾闭合
  if (endpoints.length === 2) {
    const [a, b] = endpoints;
    if (!adj[a].includes(b)) {
      state.edges.push([Math.min(a, b), Math.max(a, b)]);
    }
  }
}

// ============================================
// 提交判定
// ============================================
window.submitJudgment = function() {
  if (state.vertices.length < 3) {
    showToast('请至少添加3个顶点', 'fail');
    return;
  }
  if (state.edges.length < 2) {
    showToast('请至少连接两条边', 'fail');
    return;
  }

  // 自动补全闭合：检测并补全缺失的首尾连线
  autoCompleteClosure();
  refreshEdges();

  const result = identifyShape();
  let target;
  if (state.mode === 'mainline') {
    target = state.levelTargets[state.currentLevel];
  } else {
    const types = ['cube', 'tetrahedron', 'square', 'triangle', 'prism', 'cuboid'];
    const typeIdx = Math.min(state.currentDifficulty - 1, types.length - 1);
    const type = types[typeIdx] || types[Math.floor(Math.random() * types.length)];
    target = { shapeType: type, vertexCount: ({ square:4, triangle:3, cube:8, tetrahedron:4, prism:6, cuboid:8 })[type] || 4, size: 2 + state.currentDifficulty * 2 };
  }

  if (result.type === 'unknown') {
    showToast('未识别出有效图形，请检查顶点和连线', 'fail');
    return;
  }

  if (result.type === target.shapeType) {
    const score = Math.round(result.confidence * 100);
    showToast(`通关成功！识别正确，得分：${score}`, 'success');
    handleLevelComplete(score, result.type);
  } else {
    const typeNames = { square: '正方形', triangle: '三角形', cube: '正方体', tetrahedron: '四面体', prism: '三棱柱', cuboid: '长方体' };
    showToast(`不符合要求，请重试（当前为${typeNames[result.type] || '未知'}）`, 'fail');
    saveLocalAttempt();
  }
};

async function handleLevelComplete(score, shapeType) {
  if (state.mode === 'mainline') {
    const levelId = state.currentLevel;
    state.mainlineProgress[levelId] = {
      status: 'completed',
      bestScore: Math.max((state.mainlineProgress[levelId]?.bestScore || 0), score),
      completedAt: state.mainlineProgress[levelId]?.completedAt || new Date().toISOString()
    };
    if (levelId < 100) {
      state.mainlineProgress[levelId + 1] = {
        ...state.mainlineProgress[levelId + 1],
        status: 'unlocked'
      };
    }
    if (levelId >= 100) {
      const allDone = Object.values(state.mainlineProgress).filter(p => p.status === 'completed').length >= 99;
      if (allDone) {
        state.isMaxLevel = true;
        document.getElementById('max-level-indicator').classList.add('show');
        document.getElementById('nav-infinite').style.display = '';
        showToast('全部通关！满级达成！无限模式已开启', 'success');
      }
    }

    // 保存本地绘图记录
    saveLocalDrawing(levelId, score, shapeType, true);
    saveLocalData();
    updateUI();

    // 云端同步
    if (state.user && state.token && !usingLocalAuth) {
      try {
        await fetch('/api/progress/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.token}` },
          body: JSON.stringify({ userId: state.user.id, levelId, score, mode: 'mainline' })
        });
        await fetch('/api/drawing/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.token}` },
          body: JSON.stringify({
            userId: state.user.id, levelId, mode: 'mainline',
            vertices: state.vertices, edges: state.edges,
            shapeType, score, isCorrect: true
          })
        });
        await loadCloudProgress();
      } catch (e) {
        console.error('云端同步失败:', e);
      }
    }
  } else {
    state.infiniteStats.totalChallenges++;
    state.infiniteStats.successCount++;
    saveLocalData();
    updateUI();

    if (state.user && state.token && !usingLocalAuth) {
      try {
        await fetch('/api/progress/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.token}` },
          body: JSON.stringify({
            userId: state.user.id, levelId: state.infiniteStats.totalChallenges,
            score, mode: 'infinite', difficulty: state.currentDifficulty,
            shapeType, isSuccess: true
          })
        });
      } catch (e) {
        console.error('云端同步失败:', e);
      }
    }
  }
}

async function saveLocalAttempt() {
  if (state.mode === 'mainline') {
    const levelId = state.currentLevel;
    if (!state.mainlineProgress[levelId]) {
      state.mainlineProgress[levelId] = { status: 'unlocked', bestScore: 0 };
    }
    state.mainlineProgress[levelId].attempts = (state.mainlineProgress[levelId].attempts || 0) + 1;
  } else {
    state.infiniteStats.totalChallenges++;
    if (state.user && state.token && !usingLocalAuth) {
      try {
        await fetch('/api/progress/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.token}` },
          body: JSON.stringify({
            userId: state.user.id, levelId: state.infiniteStats.totalChallenges,
            score: 0, mode: 'infinite', difficulty: state.currentDifficulty,
            shapeType: 'unknown', isSuccess: false
          })
        });
      } catch (e) {
        console.error('失败记录同步失败:', e);
      }
    }
  }
  saveLocalData();
}

// ============================================
// 本地绘图历史记录
// ============================================
function saveLocalDrawing(levelId, score, shapeType, isCorrect) {
  if (!state.localDrawings[levelId]) {
    state.localDrawings[levelId] = [];
  }
  state.localDrawings[levelId].push({
    levelId,
    score,
    shapeType,
    isCorrect,
    vertices: JSON.parse(JSON.stringify(state.vertices)),
    edges: JSON.parse(JSON.stringify(state.edges)),
    timestamp: new Date().toISOString()
  });
  // 最多保留50条
  if (state.localDrawings[levelId].length > 50) {
    state.localDrawings[levelId] = state.localDrawings[levelId].slice(-50);
  }
  localStorage.setItem('geometry_drawings', JSON.stringify(state.localDrawings));
}

function loadLocalDrawings() {
  const raw = localStorage.getItem('geometry_drawings');
  if (raw) {
    try {
      state.localDrawings = JSON.parse(raw);
    } catch (e) {
      state.localDrawings = {};
    }
  }
}

// ============================================
// 绘图操作
// ============================================
let selectedVertexIndex = null;

window.addVertex = function() {
  const x = parseFloat(document.getElementById('input-x').value);
  const y = parseFloat(document.getElementById('input-y').value);
  const z = parseFloat(document.getElementById('input-z').value);

  if (isNaN(x) || isNaN(y) || isNaN(z)) {
    showToast('请输入有效的数字坐标', 'fail');
    return;
  }

  const vertex = { x, y, z };
  state.vertices.push(vertex);
  addVertexMarker(vertex, state.vertices.length - 1);
  updateVertexList();

  // 如果处于连线模式且有源顶点，自动连线
  if (state.connectMode && state.connectSource !== null && state.connectSource !== state.vertices.length - 1) {
    connectVertices(state.connectSource, state.vertices.length - 1);
    state.connectSource = state.vertices.length - 1; // 新顶点成为新的源
    updateVertexList();
  }
};

// 连线模式：选中两个顶点后点击按钮连线
window.toggleConnectMode = function() {
  // 如果已有两个选中顶点，执行连线而不是切换模式
  if (state.connectMode && state.connectSource !== null && state.connectTarget !== null) {
    window.confirmConnect();
    return;
  }

  state.connectMode = !state.connectMode;
  state.connectSource = null;
  state.connectTarget = null;
  const btn = document.getElementById('btn-connect');
  const hint = document.getElementById('connect-hint');

  if (state.connectMode) {
    hint.classList.add('show');
    showToast('连线模式：选中两个顶点后点击「确认连线」', 'success');
  } else {
    hint.classList.remove('show');
  }
  updateConnectButton();
  updateVertexList();
};

// 确认双选连线
window.confirmConnect = function() {
  if (state.connectSource !== null && state.connectTarget !== null && state.connectSource !== state.connectTarget) {
    connectVertices(state.connectSource, state.connectTarget);
    state.connectSource = state.connectTarget;
    state.connectTarget = null;
    updateVertexList();
    updateConnectButton();
  }
};

// 更新连线按钮样式与文字
function updateConnectButton() {
  const btn = document.getElementById('btn-connect');
  if (state.connectMode && state.connectSource !== null && state.connectTarget !== null) {
    btn.textContent = '确认连线 ✓';
    btn.style.borderColor = '#00BFFF';
    btn.style.color = '#1A1A2E';
    btn.style.background = '#00BFFF';
    btn.style.fontWeight = 'bold';
  } else if (state.connectMode) {
    btn.textContent = '连接顶点';
    btn.style.borderColor = '#FFB74D';
    btn.style.color = '#FFB74D';
    btn.style.background = '';
    btn.style.fontWeight = '';
  } else {
    btn.textContent = '连接顶点';
    btn.style.borderColor = 'rgba(135, 206, 250, 0.25)';
    btn.style.color = '#E8F0FE';
    btn.style.background = '';
    btn.style.fontWeight = '';
  }
}

function connectVertices(idx1, idx2) {
  if (idx1 === idx2) return;
  const exists = state.edges.some(([a, b]) =>
    (a === idx1 && b === idx2) || (a === idx2 && b === idx1)
  );
  if (!exists) {
    state.edges.push([Math.min(idx1, idx2), Math.max(idx1, idx2)]);
    refreshEdges();
    showToast(`已连接顶点${idx1 + 1}和顶点${idx2 + 1}`, 'success');
  }
}

window.closeShape = function() {
  if (state.vertices.length < 3) {
    showToast('至少需要3个顶点才能闭合', 'fail');
    return;
  }
  const lastIdx = state.vertices.length - 1;
  const exists = state.edges.some(([a, b]) =>
    (a === 0 && b === lastIdx) || (a === lastIdx && b === 0)
  );
  if (!exists) {
    state.edges.push([0, lastIdx]);
    refreshEdges();
  }
};

window.clearCanvas = function() {
  state.vertices = [];
  state.edges = [];
  selectedVertexIndex = null;
  state.connectSource = null;
  state.connectTarget = null;
  state.connectMode = false;
  const btn = document.getElementById('btn-connect');
  btn.style.borderColor = 'rgba(135, 206, 250, 0.25)';
  btn.style.color = '#E8F0FE';
  btn.textContent = '连接顶点';
  btn.style.background = '';
  btn.style.fontWeight = '';
  document.getElementById('connect-hint').classList.remove('show');

  while (vertexMarkersGroup.children.length > 0) {
    vertexMarkersGroup.remove(vertexMarkersGroup.children[0]);
  }
  while (edgeLinesGroup.children.length > 0) {
    edgeLinesGroup.remove(edgeLinesGroup.children[0]);
  }
  vertexSpheres = [];
  edgeLineObjects = [];
  updateVertexList();
  updateEdgeList();
};

function updateVertexList() {
  const listEl = document.getElementById('vertex-list');
  if (state.vertices.length === 0) {
    listEl.classList.remove('show');
    return;
  }
  listEl.classList.add('show');
  listEl.innerHTML = state.vertices.map((v, i) => {
    let cls = 'v-item';
    if (selectedVertexIndex === i) cls += ' selected';
    if (state.connectSource === i) cls += ' select-source';
    if (state.connectTarget === i) cls += ' select-target';
    return `<div class="${cls}" onclick="selectVertex(${i})">
      <span class="v-num">${i + 1}</span>
      <span>(${v.x}, ${v.y}, ${v.z})</span>
      <span class="v-del" onclick="event.stopPropagation();deleteVertex(${i})" title="删除此顶点">×</span>
    </div>`;
  }).join('');
}

// 线段列表渲染
function updateEdgeList() {
  const listEl = document.getElementById('edge-list');
  if (state.edges.length === 0) {
    listEl.classList.remove('show');
    return;
  }
  listEl.classList.add('show');
  listEl.innerHTML = state.edges.map(([a, b], i) => {
    return `<div class="e-item">
      <span class="e-num">${i + 1}</span>
      <span>${a + 1}↔${b + 1}</span>
      <span class="e-del" onclick="deleteEdge(${i})" title="删除此线段">×</span>
    </div>`;
  }).join('');
}

// 删除单条线段
window.deleteEdge = function(index) {
  if (index < 0 || index >= state.edges.length) return;
  state.edges.splice(index, 1);
  refreshEdges();
  updateEdgeList();
  showToast('已删除该线段', 'success');
};

window.selectVertex = function(index) {
  const v = state.vertices[index];

  if (state.connectMode) {
    // 连线模式：同时选中两个顶点，然后点击「确认连线」
    if (state.connectSource === null) {
      // 第一个选中
      state.connectSource = index;
    } else if (state.connectSource === index) {
      // 取消第一个
      state.connectSource = null;
      state.connectTarget = null;
    } else if (state.connectTarget === null) {
      // 第二个选中
      state.connectTarget = index;
    } else if (state.connectTarget === index) {
      // 取消第二个
      state.connectTarget = null;
    } else {
      // 已有两个选中，替换第二个
      state.connectTarget = index;
    }
    updateVertexList();
    updateConnectButton();
  } else {
    // 普通模式：选中顶点回填坐标
    selectedVertexIndex = index;
    document.getElementById('input-x').value = v.x;
    document.getElementById('input-y').value = v.y;
    document.getElementById('input-z').value = v.z;
    updateVertexList();
  }
};

// 删除单个顶点及其关联的所有连线
window.deleteVertex = function(index) {
  if (index < 0 || index >= state.vertices.length) return;
  const deletedNum = index + 1;

  // 1) 从顶点数组中移除
  state.vertices.splice(index, 1);

  // 2) 移除涉及该顶点的所有边，并重新映射剩余边索引
  const newEdges = [];
  state.edges.forEach(([a, b]) => {
    if (a === index || b === index) return; // 跳过被删除顶点的边
    // splice后，index之后的顶点索引需要 -1
    const newA = a > index ? a - 1 : a;
    const newB = b > index ? b - 1 : b;
    newEdges.push([newA, newB]);
  });
  state.edges = newEdges;

  // 3) 更新连线模式/选中状态
  if (state.connectSource === index) {
    state.connectSource = null;
  } else if (state.connectSource !== null && state.connectSource > index) {
    state.connectSource--;
  }
  if (state.connectTarget === index) {
    state.connectTarget = null;
  } else if (state.connectTarget !== null && state.connectTarget > index) {
    state.connectTarget--;
  }
  if (selectedVertexIndex === index) {
    selectedVertexIndex = null;
  } else if (selectedVertexIndex !== null && selectedVertexIndex > index) {
    selectedVertexIndex--;
  }

  // 4) 刷新3D渲染
  refreshVertexMarkers();
  refreshEdges();
  updateVertexList();

  showToast(`已删除顶点${deletedNum}及其关联连线`, 'success');
};

// 删除当前选中的顶点（通过工具栏按钮触发）
window.deleteSelectedVertex = function() {
  if (selectedVertexIndex === null || selectedVertexIndex < 0) {
    if (state.vertices.length === 1) {
      // 只有一个顶点时，直接删除它
      deleteVertex(0);
      return;
    }
    showToast('请先在顶点列表中选中要删除的顶点', 'fail');
    return;
  }
  deleteVertex(selectedVertexIndex);
};

      const data = JSON.parse(raw);
      state.mainlineProgress = data.mainlineProgress || {};

      state.isMaxLevel = data.isMaxLevel || false;

      state.currentDifficulty = data.currentDifficulty || 1;
      state.mode = data.mode || 'mainline';

      console.error('本地数据解析失败:', e);

  }
  if (!state.mainlineProgress[1]) {
    state.mainlineProgress[1] = { status: 'unlocked', bestScore: 0 };

}

function renderGallery() {
  const grid = document.getElementById('gallery-grid');

  let html = '';
  for (let i = 1; i <= 100; i++) {
    const prog = state.mainlineProgress[i];
    let status = prog?.status || 'locked';
    const target = state.levelTargets[i];
    if (state.isMaxLevel && status === 'locked') status = 'unlocked';
    let cls = status;
    if (status === 'unlocked' && i === state.currentLevel && state.mode === 'mainline') cls += ' current';

    let timeStr = '';
    let scoreStr = '';
    if (status === 'completed' && prog.completedAt) {
      const d = new Date(prog.completedAt);
      timeStr = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }
    if (status === 'completed' && prog.bestScore !== undefined) {
      scoreStr = `${prog.bestScore}分`;
    }

    const clickHandler = (status === 'completed' || (state.localDrawings[i] && state.localDrawings[i].length > 0))
      ? `onclick="viewHistory(${i})"` : '';

    const taskName = target?.taskName || '';
    const icon = target?.icon || '?';

    html += `<div class="gallery-item ${cls}" ${clickHandler}>
      ${status === 'completed' ? '<span class="check-mark">✓</span>' : (status === 'locked' ? '<span class="lock-icon">🔒</span>' : '')}
      <span class="level-icon">${icon}</span>
      <span class="level-num">${i}</span>
      <span class="gallery-task">${taskName}</span>
      ${status === 'completed' ? `<span class="gallery-score">${scoreStr}</span>` : ''}
      ${status === 'completed' ? `<span class="gallery-time">${timeStr}</span>` : ''}
    </div>`;
  }
  grid.innerHTML = html;
}

window.viewHistory = async function(levelId) {
  document.getElementById('history-title').textContent = `关卡 ${levelId} 绘图历史`;
  const content = document.getElementById('history-content');

  // 隐藏其他面板，显示历史面板
  document.getElementById('page-gallery').classList.remove('show');
  document.getElementById('page-history').classList.add('show');

  let records = [];

  // 云端记录
  if (state.user && state.token) {
    try {
      const resp = await fetch(`/api/drawing/${state.user.id}/${levelId}`);
      const data = await resp.json();
      if (data.success && data.records.length > 0) {
        records = data.records;
      }
    } catch (e) {
      console.error('加载云端绘图记录失败:', e);
    }
  }

  // 本地记录
  const localRecords = state.localDrawings[levelId] || [];

  if (records.length === 0 && localRecords.length === 0) {
    content.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.5);padding:40px;">暂无绘图记录</div>';
    return;
  }

  let html = '';

  // 云端记录
  records.forEach((r, i) => {
    html += `<div class="history-record">
      <div class="h-header">
        <span>云端 · 第${i + 1}次 · ${r.shape_type} · 得分${r.score} ${r.is_correct ? '✓' : '✗'}</span>
        <span style="color:rgba(255,255,255,0.4);">${new Date(r.created_at).toLocaleString()}</span>
      </div>
      <div class="h-vertices">顶点: ${JSON.stringify(r.vertices)}</div>
    </div>`;
  });

  // 本地记录
  localRecords.forEach((r, i) => {
    html += `<div class="history-record">
      <div class="h-header">
        <span>本地 · 第${i + 1}次 · ${r.shapeType} · 得分${r.score} ${r.isCorrect ? '✓' : '✗'}</span>
        <span style="color:rgba(255,255,255,0.4);">${new Date(r.timestamp).toLocaleString()}</span>
      </div>
      <div class="h-vertices">顶点: ${JSON.stringify(r.vertices)}</div>
    </div>`;
  });

  content.innerHTML = html;
};

// ============================================
function getLocalUsers() {
  try { return JSON.parse(localStorage.getItem('geometry_local_users') || '{}'); } catch(e) { return {}; }
}
function saveLocalUsers(users) {
  localStorage.setItem('geometry_local_users', JSON.stringify(users));
}
function hashLocalPassword(pwd, salt) {
  // 简易哈希：不需要bcrypt，用浏览器原生SHA-256
  let h = salt + '|' + pwd;
  for (let i = 0; i < 100; i++) {
    let v = 0;
    for (let j = 0; j < h.length; j++) {
      v = ((v << 5) - v) + h.charCodeAt(j);
      v |= 0;
    }
    h = salt + '|' + Math.abs(v).toString(16);
  }
  return h;
}
function makeLocalToken(user) {
  // 生成简单的本地token（仅用于本地校验）
  const payload = JSON.stringify({ id: user.id, username: user.username, ts: Date.now() });
  return btoa(payload + '|' + user.pwHash);
}

let usingLocalAuth = false;

window.doLogin = async function() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  const msgEl = document.getElementById('form-msg');

  if (!username || !password) {
    msgEl.textContent = '请填写用户名和密码';
    msgEl.className = 'form-msg error';
    return;
  }

  if (!isLoginMode) {
    const password2 = document.getElementById('login-password2').value;
    if (password !== password2) {
      msgEl.textContent = '两次密码输入不一致';
      msgEl.className = 'form-msg error';
      return;
    }
  }

  // 先尝试服务端登录/注册
  const endpoint = isLoginMode ? '/api/login' : '/api/register';
  let serverOk = false;
  try {
    const resp = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await resp.json();

    if (data.success) {
      serverOk = true;
      usingLocalAuth = false;
      if (isLoginMode) {
        state.user = data.user;
        state.token = data.token;
        msgEl.textContent = '登录成功，正在同步数据...';
        msgEl.className = 'form-msg success';
        updateLoginState();
        await syncLocalToCloud();
        await loadCloudProgress();
        setTimeout(() => {
          document.getElementById('login-dropdown').classList.remove('show');
        }, 800);
      } else {
        msgEl.textContent = '注册成功，请登录';
        msgEl.className = 'form-msg success';
        setTimeout(() => {
          isLoginMode = true;
          updateLoginForm();
        }, 1000);
      }
    } else {
      msgEl.textContent = data.message;
      msgEl.className = 'form-msg error';
      return;
    }
  } catch (e) {
    // 服务器不可达，走本地 localStorage 模式
    console.log('服务器不可用，使用本地账号系统');
  }

  if (serverOk) return;

  // ===== 本地 localStorage 账号系统（离线模式） =====
  const users = getLocalUsers();

  if (isLoginMode) {
    // 登录
    const user = users[username];
    if (!user) {
      msgEl.textContent = '用户名或密码错误';
      msgEl.className = 'form-msg error';
      return;
    }
    const expectedHash = hashLocalPassword(password, user.salt);
    if (expectedHash !== user.pwHash) {
      msgEl.textContent = '用户名或密码错误';
      msgEl.className = 'form-msg error';
      return;
    }
    usingLocalAuth = true;
    state.user = { id: user.id, username: user.username, nickname: user.nickname, provider: 'local' };
    state.token = makeLocalToken(user);
    msgEl.textContent = '登录成功（本地模式）';
    msgEl.className = 'form-msg success';
    updateLoginState();
    setTimeout(() => {
      document.getElementById('login-dropdown').classList.remove('show');
    }, 800);
  } else {
    // 注册
    if (users[username]) {
      msgEl.textContent = '用户名已存在';
      msgEl.className = 'form-msg error';
      return;
    }
    if (username.length < 2 || username.length > 20) {
      msgEl.textContent = '用户名长度2-20个字符';
      msgEl.className = 'form-msg error';
      return;
    }
    if (password.length < 6) {
      msgEl.textContent = '密码至少6位';
      msgEl.className = 'form-msg error';
      return;
    }
    const userId = 'local_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    const salt = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    const pwHash = hashLocalPassword(password, salt);
    users[username] = {
      id: userId,
      username: username,
      nickname: username,
      salt: salt,
      pwHash: pwHash,
      createdAt: new Date().toISOString()
    };
    saveLocalUsers(users);
    msgEl.textContent = '注册成功，请登录';
    msgEl.className = 'form-msg success';
    setTimeout(() => {
      isLoginMode = true;
      updateLoginForm();
    }, 1000);
  }
};

function updateLoginState() {
  if (state.user) {
    document.getElementById('login-btn-tx').style.display = 'none';
    document.getElementById('login-btn-local').style.display = 'none';

    document.getElementById('logout-btn').style.display = 'none';

}

  localStorage.removeItem('geometry_game_token');
};

async function syncLocalToCloud() {
  if (!state.user || !state.token || usingLocalAuth) return;
  const localProgress = Object.entries(state.mainlineProgress).map(([levelId, data]) => ({
    levelId: parseInt(levelId),
    status: data.status,
    bestScore: data.bestScore || 0
  }));

  try {
    await fetch('/api/sync/upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.token}` },
      body: JSON.stringify({ userId: state.user.id, localProgress })
    });
  } catch (e) {
    console.error('同步失败:', e);
  }
}

async function loadCloudProgress() {
  if (!state.user || usingLocalAuth) return;
  try {
    const resp = await fetch(`/api/progress/${state.user.id}`);
    const data = await resp.json();
    if (data.success) {
      data.progress.forEach(p => {
        const local = state.mainlineProgress[p.level_id];
        if (!local || local.status !== 'completed' || p.status === 'completed') {
          state.mainlineProgress[p.level_id] = {
            status: p.status,
            bestScore: Math.max(local?.bestScore || 0, p.best_score || 0),
            completedAt: p.completed_at
          };
        }
      });
      state.isMaxLevel = data.isMaxLevel || state.isMaxLevel;
      for (let i = 1; i <= 100; i++) {
        const prog = state.mainlineProgress[i];
        if (!prog || prog.status === 'locked') {
          if (i === 1) {
            state.currentLevel = 1;
            state.mainlineProgress[1] = { status: 'unlocked', bestScore: 0 };
          } else {
            state.currentLevel = i - 1;
            if (state.mainlineProgress[i - 1]?.status === 'completed') {
              state.mainlineProgress[i] = { status: 'unlocked', bestScore: 0 };
              state.currentLevel = i;
            }
          }
          break;
        }
        if (prog.status === 'completed' && i === 100) {
          state.currentLevel = 100;
        }
      }
      saveLocalData();
      updateUI();
    }
  } catch (e) {
    console.error('加载云端进度失败:', e);
  }
}

// ============================================
// 腾讯OAuth回调处理：URL中提取token并验证
// ============================================
async function handleOAuthCallback() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const loginError = params.get('login_error');

  if (loginError) {
    showToast('腾讯登录失败，请重试', 'fail');
    // 清理URL参数
    window.history.replaceState({}, '', window.location.pathname);
    return;
  }

  if (token) {
    try {
      const resp = await fetch('/api/auth/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }
      });
      const data = await resp.json();
      if (data.success) {
        state.user = data.user;
        state.token = data.token || token;
        updateLoginState();
        await syncLocalToCloud();
        await loadCloudProgress();
        showToast('腾讯账号登录成功！数据已同步', 'success');
      } else {
        showToast('登录验证失败', 'fail');
      }
    } catch (e) {
      showToast('登录验证失败', 'fail');
    }
    // 清理URL参数
    window.history.replaceState({}, '', window.location.pathname);
  }
}

// ============================================
// 初始化
// ============================================
async function init() {
  loadLocalData();
  loadLocalDrawings();
  await loadLevelTemplates();
  initThreeJS();
  updateUI();
  updateLoginState();

  // 恢复之前登录状态
  const cachedToken = localStorage.getItem('geometry_game_token');
  const cachedUser = localStorage.getItem('geometry_game_user');
  let serverAuthOk = false;
  if (cachedToken && cachedUser) {
    try {
      const resp = await fetch('/api/auth/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${cachedToken}` }
      });
      const data = await resp.json();
      if (data.success) {
        serverAuthOk = true;
        state.user = data.user;
        state.token = data.token || cachedToken;
        updateLoginState();
        loadCloudProgress();
      } else {
        localStorage.removeItem('geometry_game_token');
        localStorage.removeItem('geometry_game_user');
      }
    } catch (e) {
      // 服务器不可达
    }
  }

  // 服务器不可用时，尝试恢复本地 localStorage 登录
  if (!serverAuthOk) {
    const localUser = localStorage.getItem('geometry_local_current_user');
    if (localUser) {
      try {
        const parsed = JSON.parse(localUser);
        const users = getLocalUsers();
        const user = users[parsed.username];
        if (user && parsed.pwHash === user.pwHash) {
          usingLocalAuth = true;
          state.user = { id: user.id, username: user.username, nickname: user.nickname, provider: 'local' };
          state.token = parsed.token;
          updateLoginState();
        } else {
          localStorage.removeItem('geometry_local_current_user');
        }
      } catch(e) {
        localStorage.removeItem('geometry_local_current_user');
      }
    }
  }

  // 处理OAuth回调
  await handleOAuthCallback();

  // 登录成功后缓存
  const origDoLogin = window.doLogin;
  window.doLogin = async function() {
    await origDoLogin();
    if (state.user && state.token) {
      localStorage.setItem('geometry_game_user', JSON.stringify(state.user));
      localStorage.setItem('geometry_game_token', state.token);
      // 本地模式也缓存当前用户
      if (usingLocalAuth) {
        const users = getLocalUsers();
        const user = users[state.user.username];
        if (user) {
          localStorage.setItem('geometry_local_current_user', JSON.stringify({
            username: user.username, pwHash: user.pwHash, token: state.token
          }));
        }
      }
    }
  };

  // 退出时清除缓存
  const origDoLogout = window.doLogout;
  window.doLogout = function() {
    localStorage.removeItem('geometry_game_user');
    localStorage.removeItem('geometry_game_token');
    localStorage.removeItem('geometry_local_current_user');
    usingLocalAuth = false;
    origDoLogout();
  };

  // 腾讯登录成功后也缓存
  const origUpdateState = updateLoginState;
  updateLoginState = function() {
    origUpdateState();
    if (state.user && state.token) {
      localStorage.setItem('geometry_game_user', JSON.stringify(state.user));
      localStorage.setItem('geometry_game_token', state.token);
    }
  };
}

init().catch(err => {
  console.error('初始化失败:', err);
  document.body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#87CEFA;font-size:18px;background:#0D0D1A;">⚠️ 页面加载失败，请刷新重试</div>`;
});
</script>

</body>
</html>
