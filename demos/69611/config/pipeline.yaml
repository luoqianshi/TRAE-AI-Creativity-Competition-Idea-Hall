# ============================================================
# OmniLog Intelligence - 流水线配置文件
# ============================================================

pipeline:
  # Redis Stream 配置
  redis:
    url: redis://localhost:6379
    input_stream: raw_documents
    output_stream: standard_docs
    consumer_group: omnilog_pipeline
    consumer_name: pipeline_worker_1
    batch_size: 50
    batch_timeout_sec: 5.0

  # Elasticsearch 配置
  elasticsearch:
    hosts:
      - http://localhost:9200
    index: omnilog_docs
    refresh: false

  # 语言检测配置
  language:
    supported:
      - zh-cn
      - en

  # 文本清洗配置
  cleaning:
    keep_urls: false
    min_length: 10

  # SimHash 去重配置
  deduplication:
    enabled: true
    threshold: 10  # 汉明距离阈值
    ttl_hours: 24  # 指纹过期时间

  # 零样本分类配置
  classification:
    enabled: true
    model: facebook/bart-large-mnli
    labels:
      - 科技
      - 财经
      - 政治
      - 健康
      - 体育
      - 娱乐
      - 教育
      - 社会
    threshold: 0.3
    top_k: 3

# 性能配置
performance:
  batch_size: 50
  max_workers: 4
  queue_size: 1000

# 日志配置
logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
