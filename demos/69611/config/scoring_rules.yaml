# Intelligence Asset Scoring Rules
# Multi-dimensional weighted scoring framework for entity intelligence assessment.
#
# Inspired by WorldMonitor CII v8 (Country Instability Index) stress-scoring model.
#
# Usage:
#   Dimensions group related indicators. Each indicator has a weight, score range,
#   and entity-type affinity. Scores are normalized to 0-1 per indicator, then
#   aggregated weighted by dimension, then composited into criticality_score (0-100).

dimensions:

  # ── Military & Security ────────────────────────────────────────────────────
  military:
    description: "Military capability, posture, and security risk indicators"
    indicators:
      - id: military_spending_ratio
        name: "Military spending ratio"
        description: "Defense budget as share of GDP or operating budget"
        weight: 1.0
        min_score: 0
        max_score: 10
        entity_types: ["ORG", "LOCATION", "GPE"]
        source_fields: ["defense_budget_pct"]
        default_value: 0.0

      - id: conflict_involvement
        name: "Active conflict involvement"
        description: "Degree of involvement in armed conflicts or hostilities"
        weight: 2.0
        min_score: 0
        max_score: 10
        entity_types: ["ORG", "LOCATION", "GPE", "EVENT"]
        source_fields: ["conflict_score"]
        default_value: 0.0

      - id: cyber_threat_activity
        name: "Cyber threat activity"
        description: "APT group activity, breach frequency, cyber espionage signals"
        weight: 1.5
        min_score: 0
        max_score: 10
        entity_types: ["ORG", "LOCATION", "GPE"]
        source_fields: ["cyber_incident_count"]
        default_value: 0.0

  # ── Economic & Financial ───────────────────────────────────────────────────
  economic:
    description: "Economic stability, market influence, and financial risk indicators"
    indicators:
      - id: market_cap_tier
        name: "Market capitalization tier"
        description: "Entity market cap or annual revenue tier (1-10)"
        weight: 1.0
        min_score: 0
        max_score: 10
        entity_types: ["ORG"]
        source_fields: ["market_cap", "revenue"]
        default_value: 0.0

      - id: supply_chain_criticality
        name: "Supply chain criticality"
        description: "Role in critical supply chains (semiconductors, energy, minerals)"
        weight: 1.5
        min_score: 0
        max_score: 10
        entity_types: ["ORG", "PRODUCT", "LOCATION"]
        source_fields: ["supply_chain_role"]
        default_value: 0.0

      - id: sanction_exposure
        name: "Sanctions & trade restriction exposure"
        description: "Degree of exposure to international sanctions or trade restrictions"
        weight: 1.0
        min_score: 0
        max_score: 10
        entity_types: ["ORG", "LOCATION", "GPE", "PERSON"]
        source_fields: ["sanctions_count"]
        default_value: 0.0

  # ── Social & Political ─────────────────────────────────────────────────────
  social_political:
    description: "Social stability, political risk, and governance indicators"
    indicators:
      - id: political_instability
        name: "Political instability"
        description: "Government stability, policy continuity risk, protest activity"
        weight: 1.5
        min_score: 0
        max_score: 10
        entity_types: ["ORG", "LOCATION", "GPE", "EVENT"]
        source_fields: ["instability_index"]
        default_value: 0.0

      - id: regulatory_pressure
        name: "Regulatory pressure"
        description: "Antitrust, data privacy, sector-specific regulatory actions"
        weight: 1.0
        min_score: 0
        max_score: 10
        entity_types: ["ORG"]
        source_fields: ["regulatory_actions"]
        default_value: 0.0

      - id: media_sentiment
        name: "Media sentiment score"
        description: "Aggregate sentiment from news coverage (-5 negative to +5 positive, mapped to 0-10)"
        weight: 0.5
        min_score: 0
        max_score: 10
        entity_types: ["*"]
        source_fields: ["sentiment_score"]
        default_value: 5.0

  # ── Infrastructure & Technology ────────────────────────────────────────────
  infrastructure:
    description: "Critical infrastructure, technology assets, and dependency indicators"
    indicators:
      - id: infrastructure_criticality
        name: "Infrastructure criticality"
        description: "Role in national/global infrastructure (energy grid, internet backbone, transport)"
        weight: 2.0
        min_score: 0
        max_score: 10
        entity_types: ["ORG", "LOCATION", "GPE", "ASSET"]
        source_fields: ["infra_role"]
        default_value: 0.0

      - id: technology_concentration
        name: "Technology concentration"
        description: "Monopoly or oligopoly position in critical technology sectors"
        weight: 1.0
        min_score: 0
        max_score: 10
        entity_types: ["ORG", "TECHNOLOGY", "PRODUCT"]
        source_fields: ["market_share_pct"]
        default_value: 0.0

      - id: data_center_density
        name: "Data center & AI infrastructure density"
        description: "Concentration of data centers, AI compute, or cloud infrastructure"
        weight: 0.5
        min_score: 0
        max_score: 10
        entity_types: ["LOCATION", "GPE"]
        source_fields: ["dc_count"]
        default_value: 0.0

  # ── Event & Incident Impact ────────────────────────────────────────────────
  incident_impact:
    description: "Recent events, incidents, and anomaly indicators"
    indicators:
      - id: recent_event_severity
        name: "Recent event severity"
        description: "Severity of events associated with this entity in the last N days"
        weight: 1.5
        min_score: 0
        max_score: 10
        entity_types: ["*"]
        source_fields: ["max_event_severity"]
        default_value: 0.0

      - id: mention_velocity
        name: "Mention velocity anomaly"
        description: "Deviation from normal mention frequency (Z-score based)"
        weight: 0.5
        min_score: 0
        max_score: 10
        entity_types: ["*"]
        source_fields: ["mention_z_score"]
        default_value: 0.0
