# ============================================================
# OmniLog Intelligence - 采集器配置文件
# ============================================================
# 支持的采集器类型: rss, twitter, news_api, web_scraper
# 环境变量使用 ${VAR_NAME} 格式

collectors:
  # ============================================================
  # RSS 采集器示例
  # ============================================================
  - type: rss
    name: hacker_news
    enabled: true
    config:
      url: https://news.ycombinator.com/rss
      max_items: 50
      update_interval: 300  # 秒

  - type: rss
    name: techcrunch
    enabled: true
    config:
      url: https://techcrunch.com/feed/
      max_items: 30
      update_interval: 600

  - type: rss
    name: arxiv_cs
    enabled: true
    config:
      url: http://export.arxiv.org/rss/cs.AI
      max_items: 100
      update_interval: 3600

  # ============================================================
  # Twitter API 采集器示例
  # ============================================================
  - type: twitter
    name: twitter_trending
    enabled: false  # 需要配置 API 密钥后启用
    config:
      bearer_token: ${TWITTER_BEARER_TOKEN}
      keywords:
        - AI
        - machine learning
        - LLM
      max_results: 100
      update_interval: 900

  # ============================================================
  # 新闻 API 采集器示例
  # ============================================================
  - type: news_api
    name: newsapi_tech
    enabled: false  # 需要配置 API 密钥后启用
    config:
      api_key: ${NEWS_API_KEY}
      sources: techcrunch,the-verge,ars-technica
      category: technology
      language: en
      page_size: 50
      update_interval: 1800

  - type: news_api
    name: newsapi_ai
    enabled: false
    config:
      api_key: ${NEWS_API_KEY}
      query: artificial intelligence OR machine learning
      language: en
      page_size: 30
      update_interval: 3600

  # ============================================================
  # 网页爬虫采集器示例
  # ============================================================
  - type: web_scraper
    name: github_trending
    enabled: true
    config:
      url: https://github.com/trending
      selector: "article.Box-row"
      max_pages: 1
      update_interval: 3600
      headers:
        User-Agent: "OmniLog/1.0"

  - type: web_scraper
    name: producthunt
    enabled: true
    config:
      url: https://www.producthunt.com
      selector: "[data-test=post-item]"
      max_pages: 1
      update_interval: 7200
      headers:
        User-Agent: "OmniLog/1.0"

  # ============================================================
  # 全球新闻源（扩展自 WorldMonitor 源）
  # ============================================================

  - type: rss
    name: reuters_world
    enabled: true
    config:
      url: https://news.google.com/rss/search?q=site:reuters.com+world&hl=en-US&gl=US&ceid=US:en
      max_items: 30
      update_interval: 600

  - type: rss
    name: guardian_world
    enabled: true
    config:
      url: https://www.theguardian.com/world/americas/rss
      max_items: 20
      update_interval: 900

  - type: rss
    name: bbc_world
    enabled: true
    config:
      url: https://feeds.bbci.co.uk/news/world/rss.xml
      max_items: 30
      update_interval: 600

  - type: rss
    name: ap_news
    enabled: true
    config:
      url: https://news.google.com/rss/search?q=site:apnews.com+world&hl=en-US&gl=US&ceid=US:en
      max_items: 20
      update_interval: 900

  - type: rss
    name: the_verge
    enabled: true
    config:
      url: https://www.theverge.com/rss/index.xml
      max_items: 30
      update_interval: 600

  - type: rss
    name: ars_technica
    enabled: true
    config:
      url: https://feeds.arstechnica.com/arstechnica/index
      max_items: 20
      update_interval: 900

  - type: rss
    name: bleeping_computer
    enabled: true
    config:
      url: https://www.bleepingcomputer.com/feed/
      max_items: 20
      update_interval: 900

  - type: rss
    name: cnbc_finance
    enabled: true
    config:
      url: https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=10000664
      max_items: 20
      update_interval: 900

  - type: rss
    name: economist
    enabled: true
    config:
      url: https://www.economist.com/feeds/print-sections/77/business.xml
      max_items: 15
      update_interval: 3600

  - type: rss
    name: scmp_asia
    enabled: true
    config:
      url: https://www.scmp.com/rss/4/feed
      max_items: 20
      update_interval: 900

  - type: rss
    name: reuters_energy
    enabled: true
    config:
      url: https://news.google.com/rss/search?q=site:reuters.com+energy+OR+oil+OR+gas+when:1d&hl=en-US&gl=US&ceid=US:en
      max_items: 20
      update_interval: 1800

  # ============================================================
  # 全局配置
# ============================================================
global:
  # 采集超时时间（秒）
  collect_timeout: 60

  # 失败重试次数
  max_retries: 3

  # 重试间隔（秒）
  retry_delay: 5

  # 并发采集数量
  max_concurrent: 5

  # 日志级别
  log_level: INFO
