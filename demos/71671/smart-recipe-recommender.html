      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .toast {

      color: white;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;

    @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateX(50px); } }

      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;

    .cat-tab.active { background: var(--accent); color: white; border-color: var(--accent); }

</head>

    // ===================== STATE =====================
    let currentIngredients = [];
    let matchedRecipes = [];
    let selectedCategory = '全部';

    // ===================== UPLOAD =====================
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const previewImg = document.getElementById('previewImg');
    const uploadPreview = document.getElementById('uploadPreview');
    const startAnalyzeBtn = document.getElementById('startAnalyzeBtn');

    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('drag-over');
    });
    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('drag-over');
    });
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('drag-over');
      const files = e.dataTransfer.files;
      if (files.length > 0 && files[0].type.startsWith('image/')) {
        handleFile(files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });

    function handleFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        previewImg.src = e.target.result;
        uploadPreview.classList.add('active');
        startAnalyzeBtn.disabled = false;
      };
      reader.readAsDataURL(file);
    }

    function removeImage() {
      previewImg.src = '';
      uploadPreview.classList.remove('active');
      fileInput.value = '';
      startAnalyzeBtn.disabled = true;
    }

    // ===================== ANALYZE =====================
    function startAnalyze() {
      const overlay = document.getElementById('analyzingOverlay');
      overlay.classList.add('active');
      // Simulate AI recognition with random ingredients
      setTimeout(() => {
        const shuffled = [...ingredientDB].sort(() => Math.random() - 0.5);
        const count = 5 + Math.floor(Math.random() * 6);
        const selected = shuffled.slice(0, count).map(ing => ({
          ...ing,
          confidence: (70 + Math.floor(Math.random() * 30))
        }));
        currentIngredients = selected;
        overlay.classList.remove('active');
        renderIngredients();
        updateSteps(2);
        document.getElementById('ingredients-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
        showToast('识别完成！共发现 ' + selected.length + ' 种食材');
      }, 2000);
    }

    // ===================== INGREDIENTS =====================
    function renderIngredients() {
      const grid = document.getElementById('ingredientsGrid');
      grid.innerHTML = currentIngredients.map((ing, i) => `
        <div class="ingredient-tag" style="animation-delay: ${i * 0.08}s">
          <span class="tag-emoji">${ing.emoji}</span>
          <span class="tag-name">${ing.name}</span>
          <span class="tag-confidence">${ing.confidence}%</span>
          <button class="tag-remove" onclick="removeIngredient(${i})" title="移除">&times;</button>
        </div>
      `).join('');
      document.getElementById('ingredientsContent').classList.add('active');
    }

    function removeIngredient(index) {
      const name = currentIngredients[index].name;
      currentIngredients.splice(index, 1);
      renderIngredients();
      showToast('已移除：' + name);
      if (matchedRecipes.length > 0) {
        findRecipes();
      }
    }

    function addManualIngredient() {
      const input = document.getElementById('addIngredientInput');
      const name = input.value.trim();
      if (!name) return;
      // Check if already exists
      if (currentIngredients.some(ing => ing.name === name)) {
        showToast('该食材已存在');
        input.value = '';
        return;
      }
      // Find in DB or create new
      const found = ingredientDB.find(db => db.name === name);
      currentIngredients.push({
        name: name,
        emoji: found ? found.emoji : '📦',
        category: found ? found.category : '其他',
        confidence: 100
      });
      input.value = '';
      renderIngredients();
      showToast('已添加：' + name);
      if (matchedRecipes.length > 0) {
        findRecipes();
      }
    }

    // ===================== RECIPES =====================
    function findRecipes() {
      const ingredientNames = currentIngredients.map(i => i.name);
      matchedRecipes = recipeDB.map(recipe => {
        const have = [];
        const need = [];
        recipe.ingredients.forEach(ri => {
          if (ingredientNames.includes(ri.name)) {
            have.push(ri);
          } else {
            // Check if it's a common pantry item
            const pantryItems = ['盐', '糖', '酱油', '醋', '料酒', '淀粉', '葱姜蒜', '葱', '姜', '大蒜', '生姜', '辣椒'];
            if (pantryItems.includes(ri.name) && ingredientNames.some(n => pantryItems.includes(n))) {
              // Likely have basic seasonings
              have.push(ri);
            } else {
              need.push(ri);
            }
          }
        });
        const matchRate = Math.round((have.length / recipe.ingredients.length) * 100);
        return { ...recipe, have, need, matchRate, matchCount: have.length, totalCount: recipe.ingredients.length };
      }).filter(r => r.matchRate >= 30).sort((a, b) => b.matchRate - a.matchRate);

      renderRecipes();
      updateSteps(3);
      document.getElementById('recipesContent').classList.add('active');
      document.getElementById('recipes-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
      showToast('找到 ' + matchedRecipes.length + ' 道推荐菜谱');
    }

    function renderRecipes() {
      // Category tabs
      const categories = ['全部', ...new Set(matchedRecipes.map(r => r.category))];
      const tabsContainer = document.getElementById('categoryTabs');
      tabsContainer.innerHTML = categories.map(cat => `
        <button class="cat-tab ${cat === selectedCategory ? 'active' : ''}" onclick="filterRecipes('${cat}')">${cat}</button>
      `).join('');

      // Recipe cards
      const filtered = selectedCategory === '全部' ? matchedRecipes : matchedRecipes.filter(r => r.category === selectedCategory);
      const grid = document.getElementById('recipesGrid');
      grid.innerHTML = filtered.map(recipe => `
        <div class="recipe-card" onclick="openRecipeDetail(${recipe.id})">
          <div class="recipe-card-img">${recipe.emoji}</div>
          <div class="recipe-card-body">
            <div class="recipe-card-top">
              <h3>${recipe.name}</h3>
              <span class="recipe-match-badge">${recipe.matchRate}% 匹配</span>
            </div>
            <p class="recipe-card-desc">${recipe.description}</p>
            <div class="recipe-card-meta">
              <span>⏱ ${recipe.time}</span>
              <span>📊 ${recipe.difficulty}</span>
              <span>🍽 ${recipe.servings}</span>
            </div>
            <div class="recipe-card-tags">
              ${recipe.have.map(h => `<span class="recipe-mini-tag have">✓ ${h.name}</span>`).join('')}
              ${recipe.need.map(n => `<span class="recipe-mini-tag need">+ ${n.name}</span>`).join('')}
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterRecipes(category) {
      selectedCategory = category;
      renderRecipes();
    }

    // ===================== RECIPE DETAIL =====================
    function openRecipeDetail(id) {
      const recipe = recipeDB.find(r => r.id === id);
      if (!recipe) return;

      const ingredientNames = currentIngredients.map(i => i.name);
      const pantryItems = ['盐', '糖', '酱油', '醋', '料酒', '淀粉', '葱', '姜', '大蒜', '生姜', '辣椒'];

      const modal = document.getElementById('modalContent');
      modal.innerHTML = `
        <div class="modal-header-img">${recipe.emoji}
          <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
          <h2>${recipe.name}</h2>
          <p class="modal-desc">${recipe.description}</p>
          <div class="modal-meta">
            <div class="modal-meta-item">
              <div class="meta-value">${recipe.time}</div>
              <div class="meta-label">烹饪时间</div>
            </div>
            <div class="modal-meta-item">
              <div class="meta-value">${recipe.difficulty}</div>
              <div class="meta-label">难度</div>
            </div>
            <div class="modal-meta-item">
              <div class="meta-value">${recipe.servings}</div>
              <div class="meta-label">份量</div>
            </div>
            <div class="modal-meta-item">
              <div class="meta-value">${recipe.category}</div>
              <div class="meta-label">分类</div>
            </div>
          </div>
          <div class="modal-section">
            <h4>所需食材</h4>
            <ul class="ingredient-list">
              ${recipe.ingredients.map(ing => {
                const have = ingredientNames.includes(ing.name) || (pantryItems.includes(ing.name) && ingredientNames.some(n => pantryItems.includes(n)));
                return `<li>
                  <span class="${have ? 'check' : 'missing'}">${have ? '✓' : '!'}</span>
                  <span>${ing.name}</span>
                  <span style="color:var(--muted);font-size:0.8rem">${ing.amount}</span>
                  ${!have ? '<span style="color:var(--accent);font-size:0.7rem;font-weight:700">需购买</span>' : ''}
                </li>`;
              }).join('')}
            </ul>
          </div>
          <div class="modal-section">
            <h4>烹饪步骤</h4>
            <ol class="step-list">
              ${recipe.steps.map(step => `<li>${step}</li>`).join('')}
            </ol>
          </div>
        </div>
      `;
      document.getElementById('recipeModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('recipeModal').classList.remove('active');
      document.body.style.overflow = '';
    }

    // ===================== SHOPPING LIST =====================
    function showShoppingList() {
      const shoppingMap = {};
      let totalItems = 0;
      matchedRecipes.forEach(recipe => {
        recipe.need.forEach(ing => {
          if (!shoppingMap[ing.name]) {
            const dbItem = ingredientDB.find(db => db.name === ing.name);
            shoppingMap[ing.name] = {
              name: ing.name,
              amount: ing.amount,
              emoji: dbItem ? dbItem.emoji : '📦',
              category: dbItem ? dbItem.category : '其他',
              recipes: [recipe.name]
            };
            totalItems++;
          } else {
            if (!shoppingMap[ing.name].recipes.includes(recipe.name)) {
              shoppingMap[ing.name].recipes.push(recipe.name);
            }
          }
        });
      });

      if (totalItems === 0) {
        showToast('所有食材都已齐全，无需购物！');
        return;
      }

      // Group by category
      const grouped = {};
      Object.values(shoppingMap).forEach(item => {
        if (!grouped[item.category]) grouped[item.category] = [];
        grouped[item.category].push(item);
      });

      const categoryIcons = {
        '蔬菜': '🥬', '肉类': '🥩', '海鲜': '🐟', '蛋奶': '🥚',
        '豆制品': '🧈', '调料': '🧂', '主食': '🍚', '其他': '📦'
      };

      const grid = document.getElementById('shoppingGrid');
      grid.innerHTML = Object.entries(grouped).map(([cat, items]) => `
        <div class="shopping-category">
          <h3><span class="cat-icon">${categoryIcons[cat] || '📦'}</span>${cat}</h3>
          ${items.map(item => `
            <div class="shopping-item" id="shop-${item.name}">
              <input type="checkbox" onchange="toggleShopItem('${item.name}', this.checked)">
              <span class="item-name">${item.name} <span style="color:var(--muted);font-size:0.8rem">${item.amount}</span></span>
              <span class="item-recipe">${item.recipes.join('、')}</span>
            </div>
          `).join('')}
        </div>
      `).join('');

      document.getElementById('shoppingSummary').innerHTML = `
        <p>共需购买 <span>${totalItems}</span> 种食材，涉及 <span>${matchedRecipes.length}</span> 道菜谱</p>
        <button class="btn-primary green" onclick="copyShoppingList()">📋 复制清单</button>
      `;

      document.getElementById('shoppingContent').classList.add('active');
      updateSteps(4);
      document.getElementById('shopping-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function toggleShopItem(name, checked) {
      const el = document.getElementById('shop-' + name);
      if (checked) {
        el.classList.add('checked');
      } else {
        el.classList.remove('checked');
      }
    }

    function copyShoppingList() {
      const items = document.querySelectorAll('.shopping-item');
      let text = '🛒 购物清单\n\n';
      items.forEach(item => {
        const name = item.querySelector('.item-name').textContent;
        const recipe = item.querySelector('.item-recipe').textContent;
        const checked = item.querySelector('input').checked;
        text += (checked ? '✅ ' : '⬜ ') + name.trim() + ' (用于: ' + recipe + ')\n';
      });
      navigator.clipboard.writeText(text).then(() => {
        showToast('购物清单已复制到剪贴板');
      }).catch(() => {
        showToast('复制失败，请手动选择复制');
      });
    }

    // ===================== STEPS =====================
    function updateSteps(current) {
      for (let i = 1; i <= 4; i++) {
        const el = document.getElementById('step' + i);
        el.classList.remove('active', 'done');
        if (i < current) el.classList.add('done');
        if (i === current) el.classList.add('active');
      }
    }

    // ===================== NAVIGATION =====================
    function scrollToUpload() {
      document.getElementById('upload-section').scrollIntoView({ behavior: 'smooth' });
    }
    function scrollToRecipes() {
      document.getElementById('recipes-section').scrollIntoView({ behavior: 'smooth' });
    }
    function scrollToShopping() {
      document.getElementById('shopping-section').scrollIntoView({ behavior: 'smooth' });
    }
    function scrollToIngredients() {
      document.getElementById('ingredients-section').scrollIntoView({ behavior: 'smooth' });
    }

    function resetAll() {
      currentIngredients = [];
      matchedRecipes = [];
      selectedCategory = '全部';
      removeImage();
      document.getElementById('ingredientsContent').classList.remove('active');
      document.getElementById('recipesContent').classList.remove('active');
      document.getElementById('shoppingContent').classList.remove('active');
      document.getElementById('ingredientsGrid').innerHTML = '';
      document.getElementById('recipesGrid').innerHTML = '';
      document.getElementById('categoryTabs').innerHTML = '';
      document.getElementById('shoppingGrid').innerHTML = '';
      updateSteps(1);
      window.scrollTo({ top: 0, behavior: 'smooth' });
      showToast('已重置，请重新拍照或选择食材');
    }

    // ===================== TOAST =====================
    function showToast(message) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => { toast.remove(); }, 3000);
    }

    // ===================== KEYBOARD =====================
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
  </script>
</body>
</html>
