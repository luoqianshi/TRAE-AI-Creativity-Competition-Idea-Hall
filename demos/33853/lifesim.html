<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>LifeSim AI 人生推演系统</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b0f1a;
    color:#e6f1ff;
    display:flex;
    height:100vh;
}

.panel{
    padding:12px;
    overflow:auto;
}

#left{width:30%;border-right:1px solid #1f2a44;}
#center{width:40%;border-right:1px solid #1f2a44;}
#right{width:30%;}

h2{color:#7cc4ff;font-size:16px;}

input,button{
    width:100%;
    padding:8px;
    margin-top:6px;
    border-radius:6px;
    border:none;
}

input{
    background:#0f1626;
    color:white;
    border:1px solid #2a3a5a;
}

button{
    background:#1f6feb;
    color:white;
    cursor:pointer;
}

.node{
    background:#121a2a;
    padding:10px;
    margin:6px 0;
    border-radius:6px;
    border-left:3px solid #3aa0ff;
}

.log{
    font-size:12px;
    padding:6px;
    margin:5px 0;
    background:#0f1626;
    border-left:2px solid #3aa0ff;
}
</style>
</head>

<body>

<div id="left" class="panel">
<h2>🎯 人生选择输入</h2>

<input id="goal" placeholder="例如：进入AI行业 / 出国留学 / 转行开发"/>
<input id="optionA" placeholder="选择A路径"/>
<input id="optionB" placeholder="选择B路径"/>

<button onclick="simulate()">生成人生推演</button>

<div id="summary"></div>
</div>

<div id="center" class="panel">
<h2>🌐 人生路径模拟</h2>
<div id="paths"></div>
</div>

<div id="right" class="panel">
<h2>🧠 AI推演日志</h2>
<div id="logs"></div>
</div>

<script>

function log(text){
    let el=document.getElementById("logs");
    let div=document.createElement("div");
    div.className="log";
    div.innerText=text;
    el.prepend(div);
}

function simulate(){
    let goal=document.getElementById("goal").value;
    let A=document.getElementById("optionA").value;
    let B=document.getElementById("optionB").value;

    if(!goal||!A||!B) return;

    document.getElementById("paths").innerHTML="";
    document.getElementById("logs").innerHTML="";

    log("🧠 AI开始分析目标：" + goal);

    setTimeout(()=>{
        log("📊 构建人生状态模型...");
    },500);

    setTimeout(()=>{
        log("🔀 生成路径A与路径B概率模型");
    },1000);

    setTimeout(()=>{
        renderPath("A路径",A,"较高稳定性 / 中等成长 / 风险较低");
        renderPath("B路径",B,"高成长潜力 / 不确定性较高 / 波动大");

        log("⚡ 推演完成");
        log("📌 建议：根据风险偏好选择路径");
    },1800);
}

function renderPath(name,text,analysis){
    let el=document.getElementById("paths");

    let div=document.createElement("div");
    div.className="node";
    div.innerHTML=`
        <b>${name}</b><br/>
        ${text}<br/>
        <span style="color:#8ab4ff">${analysis}</span>
    `;
    el.appendChild(div);
}

</script>

</body>
</html>
