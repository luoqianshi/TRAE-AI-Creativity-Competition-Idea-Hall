<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zeus AI 办公室工作台</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f4ef;
      --panel: rgba(255, 255, 255, 0.86);
      --panel-strong: #ffffff;
      --text: #141414;
      --muted: #7a7670;
      --line: rgba(20, 20, 20, 0.08);
      --soft: rgba(20, 20, 20, 0.04);
      --accent: #111111;
      --accent-soft: rgba(17, 17, 17, 0.06);
      --shadow: 0 26px 80px rgba(24, 22, 18, 0.10);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, rgba(31, 122, 103, 0.08), transparent 22%),
        radial-gradient(circle at 92% 8%, rgba(171, 120, 60, 0.08), transparent 20%),
        #f7f4ef;
    }

    .app {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr) 360px;
      gap: 0;
      overflow: hidden;
    }

    .sidebar {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      padding: 26px 22px 18px;
      border-right: 1px solid var(--line);
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(16px);
    }

    .brand {
      padding: 6px 6px 18px;
      font-size: 34px;
      line-height: 1;
      font-weight: 850;
      letter-spacing: 0;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 52px;
      margin: 0 0 18px;
      padding: 0 14px;
      border: 1px solid #e8e4de;
      border-radius: 14px;
      background: #fbfbf9;
      color: #a6a29c;
    }

    .search input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 14px;
    }

    .nav {
      display: grid;
      gap: 4px;
      padding-top: 10px;
    }

    .section-label {
      padding: 18px 8px 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 48px;
      padding: 0 12px;
      border-radius: 12px;
      color: var(--text);
      font-size: 16px;
    }

    .nav-item.active {
      background: var(--soft);
    }

    .nav-icon {
      width: 22px;
      text-align: center;
      font-size: 20px;
      line-height: 1;
    }

    .chev {
      margin-left: auto;
      color: #96928c;
      font-size: 16px;
    }

    .sidebar-bottom {
      align-self: end;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .user {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-size: 16px;
    }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ccb58a, #8d6d48);
      flex: 0 0 auto;
    }

    .bell {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--text);
      background: transparent;
      font-size: 20px;
    }

    .workspace {
      display: grid;
      grid-template-rows: auto 1fr;
      min-width: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0.35));
    }

    .topbar {
      display: grid;
      place-items: center;
      height: 86px;
      font-size: 28px;
      font-weight: 850;
      letter-spacing: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 18px;
      min-width: 0;
      padding: 10px 22px 18px 22px;
    }

    .scene {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 18px;
      min-width: 0;
      min-height: 0;
    }

    .set-piece {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.98), rgba(248,248,248,0.92));
      box-shadow: 0 18px 40px rgba(17,17,17,0.05);
    }

    .set-piece::before {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 52%;
      background: linear-gradient(180deg, transparent, rgba(17,17,17,0.03));
    }

    .set-piece.office {
      display: grid;
      align-items: center;
      justify-items: center;
    }

    .desk {
      position: relative;
      width: min(96%, 420px);
      height: 126px;
      margin-top: 10px;
      background: linear-gradient(180deg, #f8f8f8, #f0f0f0);
      border-radius: 2px;
      box-shadow: 0 30px 34px rgba(0,0,0,0.04);
    }

    .desk::before,
    .desk::after {
      content: "";
      position: absolute;
      bottom: -92px;
      width: 10px;
      height: 94px;
      background: linear-gradient(180deg, #e9e9e9, #dadada);
    }

    .desk::before { left: 26px; }
    .desk::after { right: 26px; }

    .shelves {
      position: absolute;
      top: 28px;
      left: 28px;
      right: 28px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      justify-content: flex-start;
    }

    .cup {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 30%, #fff4de, #d9ab70 70%, #8a5a2e 100%);
      box-shadow: 0 4px 8px rgba(0,0,0,0.06);
    }

    .cup.small { width: 14px; height: 14px; }
    .machine {
      margin-left: auto;
      width: 82px;
      height: 52px;
      background: linear-gradient(180deg, #e8e8e8, #cfcfcf);
      border-radius: 4px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.03);
    }

    .screen {
      position: absolute;
      left: 50%;
      top: 34px;
      transform: translateX(-50%);
      width: 74px;
      height: 46px;
      background: linear-gradient(180deg, #48a0ff, #2f7ad9);
      border-radius: 3px;
      box-shadow: 0 5px 0 rgba(0,0,0,0.05);
    }

    .bathroom {
      display: grid;
      place-items: center;
    }

    .toilet {
      position: relative;
      width: 120px;
      height: 156px;
      margin-left: 26px;
      background:
        linear-gradient(180deg, transparent 0 18px, #f3f3f3 18px 100%);
    }

    .toilet::before {
      content: "";
      position: absolute;
      left: 20px;
      top: 54px;
      width: 64px;
      height: 56px;
      border-radius: 8px 8px 22px 22px;
      background: linear-gradient(180deg, #fcfcfc, #e8e8e8);
      box-shadow: 0 24px 34px rgba(0,0,0,0.07);
    }

    .toilet::after {
      content: "";
      position: absolute;
      left: 48px;
      top: 34px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ededed;
      box-shadow: 0 0 0 10px rgba(255,255,255,0.5);
    }

    .desk-chair {
      position: absolute;
      left: 50%;
      top: 72px;
      width: 92px;
      height: 130px;
      transform: translateX(-50%);
      filter: drop-shadow(0 24px 20px rgba(0,0,0,0.16));
    }

    .desk-chair::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 78px;
      height: 78px;
      transform: translateX(-50%);
      border-radius: 16px 16px 26px 26px;
      background: linear-gradient(180deg, #595959, #303030);
    }

    .desk-chair::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 56px;
      height: 84px;
      transform: translateX(-50%);
      border-radius: 18px 18px 12px 12px;
      background: linear-gradient(180deg, #090909 0%, #060606 72%, #151515 100%);
    }

    .cape {
      position: absolute;
      left: 50%;
      top: 46px;
      width: 58px;
      height: 54px;
      transform: translateX(-50%);
      border-radius: 12px 12px 20px 20px;
      background: linear-gradient(180deg, #090909, #151515);
    }

    .cape.red { box-shadow: inset 0 -10px 0 #bf0d0d; }
    .cape.yellow { box-shadow: inset 0 -10px 0 #f7c400; }
    .cape.purple { box-shadow: inset 0 -10px 0 #6328ff; }

    .agent-label {
      position: absolute;
      left: 18px;
      top: 16px;
      color: var(--text);
      font-size: 18px;
      font-weight: 600;
    }

    .center-figure {
      position: absolute;
      left: 50%;
      top: 112px;
      width: 112px;
      height: 150px;
      transform: translateX(-50%);
      filter: drop-shadow(0 22px 18px rgba(0,0,0,0.14));
    }

    .center-figure .body {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 98px;
      height: 112px;
      transform: translateX(-50%);
      border-radius: 18px 18px 28px 28px;
      background: linear-gradient(180deg, #111, #252525);
    }

    .center-figure .head {
      position: absolute;
      left: 50%;
      top: 0;
      width: 54px;
      height: 72px;
      transform: translateX(-50%);
      border-radius: 24px 24px 18px 18px;
      background: linear-gradient(180deg, #090909, #171717);
    }

    .center-figure .tail {
      position: absolute;
      left: 50%;
      bottom: 26px;
      width: 72px;
      height: 12px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: var(--accent);
    }

    .file-figure .tail { background: #6f2bff; }
    .app-figure .tail { background: #f4c400; }

    .dashboard {
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 18px;
      min-width: 0;
      padding: 0 4px 0 0;
    }

    .stat-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: end;
      padding: 8px 0 12px;
    }

    .stat {
      min-width: 0;
    }

    .stat .label {
      color: #2b2b2b;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .stat .value {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 28px;
      font-weight: 850;
    }

    .bean {
      width: 16px;
      height: 22px;
      border-radius: 999px 999px 999px 999px / 110% 110% 70% 70%;
      background: linear-gradient(180deg, #8d5532, #6f4126);
      transform: rotate(-28deg);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
    }

    .rule {
      height: 4px;
      background: #e7e2db;
      border-radius: 999px;
    }

    .filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #6d6963;
      font-size: 16px;
    }

    .card {
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 18px;
      min-height: 140px;
      border-radius: 28px;
      background: linear-gradient(180deg, #f4f2ef, #f0eeea);
    }

    .card-grid {
      display: grid;
      gap: 18px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0;
      min-height: 122px;
      border-radius: 26px;
      background: linear-gradient(180deg, #f3f1ee, #efede9);
      overflow: hidden;
    }

    .summary-item {
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 12px;
      border-right: 1px solid var(--line);
    }

    .summary-item:last-child { border-right: 0; }

    .summary-item strong {
      font-size: 24px;
      font-weight: 850;
    }

    .summary-item span {
      color: #8b867f;
      font-size: 16px;
    }

    .empty {
      min-height: 180px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 10px;
      color: #b0aba4;
      font-size: 16px;
      text-align: center;
    }

    .ghost {
      width: 66px;
      height: 66px;
      opacity: 0.35;
      background:
        radial-gradient(circle at 40% 28%, #fff 0 5px, transparent 5px),
        radial-gradient(circle at 60% 28%, #fff 0 5px, transparent 5px),
        linear-gradient(180deg, #d2d2d2, #bdbdbd);
      border-radius: 30px 30px 14px 14px;
    }

    .window-controls {
      position: absolute;
      right: 16px;
      top: 12px;
      display: flex;
      gap: 16px;
      color: #111;
      font-size: 22px;
      line-height: 1;
    }

    .window-controls span {
      width: 24px;
      text-align: center;
    }

    @media (max-width: 1180px) {
      .app {
        grid-template-columns: 260px minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr) auto;
      }

      .dashboard {
        padding-right: 0;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 860px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
        overflow: auto;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .workspace {
        min-height: 760px;
      }

      .dashboard {
        padding: 0 22px 22px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand">Zeus</div>

      <label class="search" aria-label="搜索">
        <span>⌕</span>
        <input type="text" value="搜索" aria-label="搜索框">
      </label>

      <nav class="nav" aria-label="导航">
        <div class="nav-item"><span class="nav-icon">＋</span><span>新建对话</span></div>
        <div class="nav-item"><span class="nav-icon">◔</span><span>自动任务</span></div>
        <div class="nav-item"><span class="nav-icon">⌁</span><span>技能广场</span></div>

        <div class="section-label">本地知识库</div>
        <div class="nav-item"><span class="nav-icon">▣</span><span>应用</span></div>
        <div class="nav-item"><span class="nav-icon">▤</span><span>文档</span><span class="chev">⌄</span></div>
        <div class="nav-item"><span class="nav-icon">▥</span><span>图库</span><span class="chev">⌄</span></div>
        <div class="nav-item"><span class="nav-icon">▦</span><span>此电脑</span><span class="chev">⌄</span></div>

        <div class="section-label">对话</div>
        <div class="nav-item active"><span class="nav-icon">◉</span><span>办公室</span></div>
      </nav>

      <div class="sidebar-bottom">
        <div class="user"><span class="avatar"></span><span>卿十三</span></div>
        <div class="bell">◌</div>
      </div>
    </aside>

    <section class="workspace">
      <header class="window-controls" aria-hidden="true">
        <span>−</span><span>□</span><span>×</span>
      </header>
      <div class="topbar">Zeus办公室</div>

      <section class="grid" aria-label="办公室场景">
        <div class="scene">
          <div class="set-piece office">
            <div class="desk">
              <div class="shelves">
                <span class="cup small"></span>
                <span class="cup"></span>
                <span class="cup small"></span>
                <span class="cup"></span>
                <span class="cup"></span>
                <span class="cup"></span>
                <span class="machine"></span>
              </div>
            </div>
          </div>

          <div class="set-piece bathroom">
            <div class="toilet"></div>
          </div>
        </div>

        <div class="scene">
          <div class="set-piece office">
            <div class="agent-label">Zeus</div>
            <div class="center-figure">
              <div class="head"></div>
              <div class="body"></div>
              <div class="tail"></div>
            </div>
            <div class="screen" style="position:absolute;top:40px;"></div>
          </div>

          <div class="set-piece office">
            <div class="agent-label" style="top:12px;left:18px;">App Agent</div>
            <div class="center-figure app-figure" style="top:104px;">
              <div class="head"></div>
              <div class="body"></div>
              <div class="tail"></div>
            </div>
            <div class="screen" style="position:absolute;top:40px;"></div>
          </div>

          <div class="set-piece office">
            <div class="agent-label" style="top:12px;left:18px;">File Agent</div>
            <div class="center-figure file-figure" style="top:104px;">
              <div class="head"></div>
              <div class="body"></div>
              <div class="tail"></div>
            </div>
            <div class="screen" style="position:absolute;top:40px;"></div>
          </div>

          <div class="set-piece office">
            <div class="screen" style="position:absolute;top:40px;"></div>
            <div class="desk-chair" style="top:84px;"></div>
          </div>
        </div>
      </section>
    </section>

    <aside class="dashboard">
      <div class="topbar" style="height:86px;"> &nbsp; </div>

      <div style="padding:0 20px;">
        <div class="stat-row">
          <div class="stat">
            <div class="label">今日消耗Token</div>
            <div class="value">0/0 <span class="bean"></span></div>
          </div>
          <div class="stat">
            <div class="label">今日节省Token</div>
            <div class="value">0 <span class="bean"></span></div>
          </div>
        </div>
        <div class="rule"></div>
      </div>

      <div style="padding:8px 20px 0;">
        <div class="filter-row">
          <span>对话明细</span>
          <span>全部 ▾</span>
        </div>
      </div>

      <div class="card-grid" style="padding:0 20px;">
        <div class="summary">
          <div class="summary-item">
            <strong>0</strong>
            <span>进行中</span>
          </div>
          <div class="summary-item">
            <strong>0</strong>
            <span>已完成</span>
          </div>
          <div class="summary-item">
            <strong>0</strong>
            <span>总计</span>
          </div>
        </div>

        <div class="empty">
          <div class="ghost"></div>
          <div>暂时没有对话内容</div>
        </div>
      </div>
    </aside>
  </main>
</body>
</html>
