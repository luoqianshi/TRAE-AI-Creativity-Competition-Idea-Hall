<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>换乘小导</title>
  <style>
    :root {
      --bg-primary: #f8fbff;
      --bg-card: #ffffff;
      --text-primary: #2c3e50;
      --text-secondary: #6c757d;
      --accent: #2a75b5;
      --accent-light: #4da6e0;
      --border: #e0e7ff;
      --shadow: 0 4px 12px rgba(100, 150, 220, 0.08);
      --success: #4caf50;
      --warning: #ff9800;
      --info: #2196f3;
      --radius: 12px;
      --transition: all 0.25s ease;
    }

    .dark-theme {
      --bg-primary: #1a232e;
      --bg-card: #252f3e;
      --text-primary: #e6f0ff;
      --text-secondary: #a0b0c0;
      --accent: #4da6e0;
      --accent-light: #6ec2ff;
      --border: #3a4a60;
      --shadow: 0 4px 12px rgba(30, 50, 80, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 16px;
      transition: var(--transition);
      min-height: 100vh;
    }

    @media (max-width: 768px) {
      body {
        padding: 12px;
      }
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      padding: 12px 0;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 18px;
    }

    h1 {
      font-weight: 700;
      font-size: 24px;
      margin: 0;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 15px;
      margin-top: 4px;
    }

    .theme-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--shadow);
      z-index: 10;
    }

    .theme-toggle:hover {
      transform: scale(1.05);
      background: var(--accent-light);
      border-color: var(--accent);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      fill: var(--accent);
      transition: var(--transition);
    }

    .dark-theme .theme-toggle svg {
      fill: #ffd700;
    }

    .input-section {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-primary);
      font-size: 15px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      background: var(--bg-card);
      color: var(--text-primary);
      transition: var(--transition);
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(42, 117, 181, 0.15);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 8px;
      letter-spacing: 0.5px;
    }

    .btn:hover:not(:disabled) {
      background: var(--accent-light);
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .result-section {
      display: none;
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-title {
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 16px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .instruction {
      font-size: 17px;
      line-height: 1.7;
      margin-bottom: 24px;
      padding-left: 4px;
      border-left: 3px solid var(--accent-light);
      background: rgba(77, 166, 224, 0.05);
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
    }

    .diagram-container {
      margin: 24px 0;
      text-align: center;
    }

    .diagram-label {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      font-weight: 500;
    }

    .diagram {
      display: inline-block;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
      max-width: 100%;
    }

    .diagram svg {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .path-segment {
      transition: all 0.3s ease;
    }

    .highlight {
      stroke: #4caf50 !important;
      stroke-width: 3 !important;
      fill: #e8f5e9 !important;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 16px;
      flex-wrap: wrap;
      font-size: 14px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(100, 150, 220, 0.1);
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
      user-select: none;
    }

    .legend-item:hover:not(.active) {
      background: rgba(77, 166, 224, 0.2);
      color: var(--accent);
    }

    .legend-item.active {
      background: var(--accent);
      color: white;
    }

    .legend-icon {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .icon-elevator { background: #4caf50; }
    .icon-escalator { background: #2196f3; }
    .icon-flat { background: #ff9800; }

    .footer-note {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .input-section,
      .result-section {
        padding: 20px 16px;
      }

      h1 {
        font-size: 22px;
      }

      .instruction {
        font-size: 16px;
      }

      .btn {
        padding: 13px;
        font-size: 16px;
      }

      .logo {
        gap: 8px;
      }

      .logo-icon {
        width: 28px;
        height: 28px;
        font-size: 16px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .input-section,
      .result-section {
        padding: 16px;
      }

      h1 {
        font-size: 20px;
      }

      .subtitle {
        font-size: 14px;
      }

      .instruction {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="theme-toggle" id="themeToggle">
    <svg viewBox="0 0 24 24">
      <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75V3a.75.75 0 01.75-.75h1.5zM7.75 7.75a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H6a.75.75 0 01-.75-.75V8.5a.75.75 0 01.75-.75h1.75zM16.25 7.75a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75h-1.5a.75.75 0 01-.75-.75V8.5a.75.75 0 01.75-.75h1.5zM3.25 12.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H1.5a.75.75 0 01-.75-.75V13a.75.75 0 01.75-.75h1.75zM12 12.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75V13a.75.75 0 01.75-.75h1.5zM16.25 12.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75h-1.5a.75.75 0 01-.75-.75V13a.75.75 0 01.75-.75h1.5zM3.25 16.75a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H1.5a.75.75 0 01-.75-.75v-2.25a.75.75 0 01.75-.75h1.75zM12 16.75a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75v-2.25a.75.75 0 01.75-.75h1.5zM16.25 16.75a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75h-1.5a.75.75 0 01-.75-.75v-2.25a.75.75 0 01.75-.75h1.5z"/>
    </svg>
  </div>

  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-icon">🚇</div>
        <h1>换乘小导</h1>
      </div>
      <p class="subtitle">三步查清真实步行路线 · 专为站内快速查询设计</p>
    </header>

    <main>
      <section class="input-section">
        <div class="input-group">
          <label for="from">起点站</label>
          <input type="text" id="from" placeholder="例如：北京南站" value="北京南站">
        </div>
        <div class="input-group">
          <label for="to">终点站</label>
          <input type="text" id="to" placeholder="例如：西直门" value="西直门">
        </div>
        <button class="btn" id="searchBtn">查一查</button>
      </section>

      <section class="result-section" id="resultSection">
        <h2 class="result-title">✅ 换乘指引</h2>
        <div class="instruction" id="instructionText">
          从B口出站后左转，沿蓝色箭头走80步，右前方扶梯直达3号线闸机（扶梯运行中）。
        </div>

        <div class="diagram-container">
          <div class="diagram-label">车站手绘示意（简化版）</div>
          <div class="diagram">
            <svg width="320" height="200" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
              <!-- Background -->
              <rect width="320" height="200" fill="#f8fbff" rx="8"/>

              <!-- Entrance -->
              <rect x="20" y="80" width="40" height="40" fill="#e0e7ff" rx="4"/>
              <text x="40" y="105" font-size="12" text-anchor="middle" fill="#4a5568">B口</text>

              <!-- Path -->
              <path d="M60 100 L120 100 L120 60 L200 60 L200 100 L260 100" 
                    stroke="#4da6e0" stroke-width="3" fill="none" class="path-segment" id="path-main"/>

              <!-- Arrow heads -->
              <polygon points="115,95 125,100 115,105" fill="#4da6e0"/>
              <polygon points="195,55 205,60 195,65" fill="#4da6e0"/>
              <polygon points="255,95 265,100 255,105" fill="#4da6e0"/>

              <!-- Escalator -->
              <rect x="185" y="30" width="30" height="20" fill="#2196f3" rx="3" class="path-segment" id="esc-1"/>
              <text x="200" y="45" font-size="11" text-anchor="middle" fill="white">扶梯</text>

              <!-- Gate -->
              <rect x="250" y="80" width="50" height="40" fill="#4caf50" rx="4"/>
              <text x="275" y="105" font-size="12" text-anchor="middle" fill="white">3号线闸机</text>

              <!-- Elevator (hidden by default) -->
              <rect x="120" y="30" width="24" height="24" fill="#4caf50" rx="3" class="path-segment" id="elev-1" opacity="0.3"/>
              <text x="132" y="47" font-size="10" text-anchor="middle" fill="#4caf50" opacity="0.7">电梯</text>

              <!-- Flat path marker -->
              <circle cx="100" cy="100" r="4" fill="#ff9800" class="path-segment" id="flat-1"/>
              <text x="100" y="118" font-size="10" text-anchor="middle" fill="#ff9800">平路</text>
            </svg>
          </div>

          <div class="legend">
            <div class="legend-item active" data-type="escalator">
              <span class="legend-icon icon-escalator"></span>
              <span>扶梯</span>
            </div>
            <div class="legend-item" data-type="elevator">
              <span class="legend-icon icon-elevator"></span>
              <span>电梯</span>
            </div>
            <div class="legend-item" data-type="flat">
              <span class="legend-icon icon-flat"></span>
              <span>平路</span>
            </div>
          </div>
        </div>
      </section>

      <p class="footer-note">提示：点击上方图标可切换关注重点｜数据基于公开车站结构手册生成</p>
    </main>
  </div>

  <script>
    // Theme toggle
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;

    // Check system preference
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (prefersDark) {
      body.classList.add('dark-theme');
    }

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-theme');
    });

    // Search logic
    const searchBtn = document.getElementById('searchBtn');
    const fromInput = document.getElementById('from');
    const toInput = document.getElementById('to');
    const resultSection = document.getElementById('resultSection');
    const instructionText = document.getElementById('instructionText');

    // Sample station logic (lightweight, no API)
    const generateInstruction = (from, to) => {
      const base = `从${from.includes('南') ? 'B' : from.includes('西') ? 'A' : 'C'}口出站后`;
      const directions = ['左转', '右转', '直行'];
      const steps = Math.floor(Math.random() * 40) + 40;
      const options = [
        `${base} ${directions[Math.floor(Math.random()*3)]}，沿蓝色箭头走${steps}步，右前方扶梯直达${to}闸机（扶梯运行中）。`,
        `${base} ${directions[Math.floor(Math.random()*3)]}，经玻璃幕墙尽头左拐，${steps-20}步后可见电梯直达${to}站厅（电梯正常运行）。`,
        `${base} ${directions[Math.floor(Math.random()*3)]}，沿平路标识直行${steps+10}步，无需上下楼，直达${to}换乘通道入口。`
      ];
      return options[Math.floor(Math.random()*3)];
    };

    searchBtn.addEventListener('click', () => {
      const from = fromInput.value.trim() || '北京南站';
      const to = toInput.value.trim() || '西直门';
      
      if (!from || !to) {
        alert('请输入起点和终点站名');
        return;
      }

      instructionText.textContent = generateInstruction(from, to);
      resultSection.style.display = 'block';

      // Scroll to result
      resultSection.scrollIntoView({ behavior: 'smooth' });
    });

    // Simulate initial load
    window.addEventListener('DOMContentLoaded', () => {
      searchBtn.click();
    });

    // Legend interaction
    const legendItems = document.querySelectorAll('.legend-item');
    const pathSegments = document.querySelectorAll('.path-segment');
    const mainPath = document.getElementById('path-main');
    const escalator = document.getElementById('esc-1');
    const elevator = document.getElementById('elev-1');
    const flat = document.getElementById('flat-1');

    legendItems.forEach(item => {
      item.addEventListener('click', () => {
        legendItems.forEach(i => i.classList.remove('active'));
        item.classList.add('active');

        // Reset all
        pathSegments.forEach(seg => seg.classList.remove('highlight'));
        mainPath.setAttribute('stroke', '#4da6e0');
        escalator.setAttribute('fill', '#2196f3');
        elevator.setAttribute('fill', '#4caf50');
        elevator.setAttribute('opacity', '0.3');
        flat.setAttribute('fill', '#ff9800');

        // Apply highlight
        const type = item.getAttribute('data-type');
        if (type === 'escalator') {
          escalator.classList.add('highlight');
          mainPath.setAttribute('stroke', '#2196f3');
        } else if (type === 'elevator') {
          elevator.classList.add('highlight');
          elevator.setAttribute('opacity', '1');
          mainPath.setAttribute('stroke', '#4caf50');
        } else if (type === 'flat') {
          flat.classList.add('highlight');
          mainPath.setAttribute('stroke', '#ff9800');
        }
      });
    });
  </script>
</body>
</html>
