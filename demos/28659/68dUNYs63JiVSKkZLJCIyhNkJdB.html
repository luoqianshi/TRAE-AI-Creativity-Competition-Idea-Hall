<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoteDock 笔仓 - AI 笔记</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-tertiary: #334155;
      --bg-hover: rgba(255,255,255,0.05);
      --bg-active: rgba(37, 99, 235, 0.15);
      --border-color: rgba(255,255,255,0.08);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-tertiary: #64748b;
      --accent: #3b82f6;
      --accent-light: #60a5fa;
      --accent-glow: rgba(59, 130, 246, 0.2);
      --nas-teal: #14b8a6;
      --nas-teal-glow: rgba(20, 184, 166, 0.15);
      --ai-purple: #8b5cf6;
      --ai-purple-glow: rgba(139, 92, 246, 0.15);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
      --font-sans: "Noto Sans SC", -apple-system, "PingFang SC", sans-serif;
      --font-serif: "Noto Serif SC", "Songti SC", serif;
      --font-mono: "JetBrains Mono", "SF Mono", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root { width: 100vw; height: 100vh; }

    /* ===== APP LAYOUT ===== */
    .app {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 260px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 16px 16px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--nas-teal));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .sidebar-brand {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .sidebar-brand span {
      font-weight: 400;
      opacity: 0.5;
      font-size: 0.85em;
      margin-left: 4px;
    }

    .sidebar-search {
      padding: 12px 16px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 8px 12px;
      transition: all 0.2s;
    }

    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 13px;
      flex: 1;
      font-family: var(--font-sans);
    }

    .search-box input::placeholder {
      color: var(--text-tertiary);
    }

    .search-icon {
      color: var(--text-tertiary);
      font-size: 14px;
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }

    .nav-section {
      margin-bottom: 16px;
    }

    .nav-section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 0 8px;
      margin-bottom: 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 2px;
    }

    .nav-item:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: var(--bg-active);
      color: var(--accent-light);
    }

    .nav-item .nav-icon {
      width: 20px;
      text-align: center;
      font-size: 16px;
    }

    .nav-item .nav-count {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-tertiary);
      background: var(--bg-primary);
      padding: 2px 8px;
      border-radius: 100px;
    }

    .new-note-btn {
      margin: 0 16px 12px;
      background: linear-gradient(135deg, var(--accent), #2563eb);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      font-family: var(--font-sans);
    }

    .new-note-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--ai-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .user-info {
      flex: 1;
      min-width: 0;
    }

    .user-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .user-status {
      font-size: 11px;
      color: var(--nas-teal);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .user-status::before {
      content: "";
      width: 6px;
      height: 6px;
      background: var(--nas-teal);
      border-radius: 50%;
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ===== NOTE LIST ===== */
    .note-list-panel {
      width: 320px;
      background: var(--bg-primary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .note-list-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .note-list-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .note-list-actions {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: transparent;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .note-list-filter {
      padding: 8px 16px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .filter-chip {
      padding: 4px 12px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
      background: var(--bg-secondary);
      color: var(--text-secondary);
    }

    .filter-chip:hover {
      background: var(--bg-hover);
    }

    .filter-chip.active {
      background: var(--accent-glow);
      color: var(--accent-light);
      border-color: rgba(59, 130, 246, 0.3);
    }

    .note-list-content {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .note-item-card {
      padding: 14px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 4px;
      border: 1px solid transparent;
    }

    .note-item-card:hover {
      background: var(--bg-secondary);
    }

    .note-item-card.active {
      background: var(--bg-secondary);
      border-color: var(--border-color);
    }

    .note-item-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note-item-preview {
      font-size: 12px;
      color: var(--text-tertiary);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .note-item-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-tertiary);
    }

    .note-item-tag {
      padding: 2px 8px;
      border-radius: 100px;
      font-size: 10px;
      font-weight: 600;
    }

    .note-item-tag.ai {
      background: var(--ai-purple-glow);
      color: var(--ai-purple);
    }

    .note-item-tag.log {
      background: var(--accent-glow);
      color: var(--accent-light);
    }

    .note-item-tag.photo {
      background: var(--nas-teal-glow);
      color: var(--nas-teal);
    }

    /* ===== EDITOR ===== */
    .editor-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
      min-width: 0;
    }

    .editor-toolbar {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar-btn {
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      font-family: var(--font-sans);
    }

    .toolbar-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .toolbar-btn.primary {
      background: var(--accent-glow);
      color: var(--accent-light);
    }

    .toolbar-btn.primary:hover {
      background: rgba(59, 130, 246, 0.25);
    }

    .ai-btn {
      background: linear-gradient(135deg, var(--ai-purple-glow), rgba(139, 92, 246, 0.2)) !important;
      color: var(--ai-purple) !important;
      border: 1px solid rgba(139, 92, 246, 0.2) !important;
    }

    .ai-btn:hover {
      background: rgba(139, 92, 246, 0.25) !important;
    }

    .editor-content {
      flex: 1;
      overflow-y: auto;
      padding: 32px 48px;
    }

    .editor-title-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--font-serif);
      font-size: 32px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 16px;
      padding: 0;
    }

    .editor-title-input::placeholder {
      color: var(--text-tertiary);
    }

    .editor-meta-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .editor-meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-tertiary);
    }

    .editor-body {
      font-size: 16px;
      line-height: 1.8;
      color: var(--text-secondary);
    }

    .editor-body p {
      margin-bottom: 16px;
    }

    .editor-body h2 {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      margin: 32px 0 16px;
    }

    .editor-body h3 {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 24px 0 12px;
    }

    .editor-body ul {
      margin: 12px 0;
      padding-left: 24px;
    }

    .editor-body li {
      margin-bottom: 8px;
    }

    .editor-body strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .editor-body code {
      background: var(--bg-secondary);
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--accent-light);
    }

    .editor-body blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 16px;
      margin: 16px 0;
      color: var(--text-secondary);
      font-style: italic;
    }

    /* ===== AI ASSISTANT PANEL ===== */
    .ai-panel {
      width: 320px;
      background: var(--bg-secondary);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .ai-panel-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ai-panel-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .ai-panel-title .ai-badge {
      background: linear-gradient(135deg, var(--ai-purple), var(--ai-purple-light, #a78bfa));
      color: #fff;
      padding: 2px 8px;
      border-radius: 100px;
      font-size: 10px;
      font-weight: 700;
    }

    .ai-panel-close {
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
    }

    .ai-panel-close:hover {
      color: var(--text-primary);
    }

    .ai-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .ai-message {
      display: flex;
      gap: 10px;
    }

    .ai-message.user {
      flex-direction: row-reverse;
    }

    .ai-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }

    .ai-avatar.assistant {
      background: linear-gradient(135deg, var(--ai-purple), #a78bfa);
    }

    .ai-avatar.user {
      background: linear-gradient(135deg, var(--accent), var(--nas-teal));
    }

    .ai-message-content {
      background: var(--bg-primary);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-secondary);
      max-width: 220px;
    }

    .ai-message.user .ai-message-content {
      background: var(--accent-glow);
      color: var(--accent-light);
    }

    .ai-suggestions {
      padding: 0 16px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .ai-suggestion {
      padding: 6px 12px;
      border-radius: 100px;
      font-size: 12px;
      background: var(--bg-primary);
      color: var(--text-tertiary);
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.2s;
    }

    .ai-suggestion:hover {
      border-color: var(--ai-purple);
      color: var(--ai-purple);
    }

    .ai-input-area {
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
    }

    .ai-input-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 8px 12px;
    }

    .ai-input-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 13px;
      font-family: var(--font-sans);
    }

    .ai-input-box input::placeholder {
      color: var(--text-tertiary);
    }

    .ai-send-btn {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
    }

    .ai-send-btn:hover {
      color: var(--accent-light);
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary);
      gap: 16px;
    }

    .empty-state-icon {
      font-size: 64px;
      opacity: 0.3;
    }

    .empty-state-text {
      font-size: 16px;
    }

    .empty-state-hint {
      font-size: 13px;
      opacity: 0.7;
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 1200px) {
      .ai-panel { display: none; }
    }

    @media (max-width: 900px) {
      .note-list-panel { display: none; }
    }

    @media (max-width: 600px) {
      .sidebar { width: 60px; }
      .sidebar-brand, .nav-item span, .nav-count, .user-info { display: none; }
      .sidebar-search, .new-note-btn span { display: none; }
      .new-note-btn { padding: 10px; justify-content: center; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

      {

        content: `<h2>云南旅行照片整理</h2>

          <div className="sidebar-footer">
            <div className="user-avatar">{user.avatar}</div>

    function NoteList({ notes, activeNoteId, onSelectNote, filter, onFilterChange }) {
      const filters = [

              <button className="icon-btn">{Icons.more()}</button>

          </div>

          <div className="note-list-filter">
            {filters.map(f => (
              <button

      return (
        <div className="editor-panel">

              <button className="toolbar-btn">{Icons.bold()}</button>
              <button className="toolbar-btn">{Icons.italic()}</button>

          <div className="editor-content">

              defaultValue={note.title}
              placeholder="笔记标题"
            />
            <div className="editor-meta-bar">
              <span className="editor-meta-item">{Icons.clock()} {note.date}</span>
              <span className="editor-meta-item">{Icons.tag()} {note.category}</span>
              <span className="editor-meta-item">{Icons.check()} 已保存</span>

              className="editor-body"
              dangerouslySetInnerHTML={{ __html: note.content }}
            />
          </div>
        </div>
      );

    function AIPanel({ isOpen, onClose }) {
      const [messages, setMessages] = useState(mockAIConversations);
      const [inputValue, setInputValue] = useState("");
      const messagesEndRef = useRef(null);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages]);

      const handleSend = () => {
        if (!inputValue.trim()) return;
        setMessages([...messages, { role: "user", content: inputValue }]);
        setInputValue("");
        setTimeout(() => {
          setMessages(prev => [...prev, {
            role: "assistant",
            content: "收到！我正在处理你的请求。NoteDock AI 可以帮你整理笔记、提取关键信息、发现内容关联等。"
          }]);
        }, 1000);
      };

      const handleSuggestion = (suggestion) => {
        setMessages([...messages, { role: "user", content: suggestion }]);
        setTimeout(() => {
          setMessages(prev => [...prev, {
            role: "assistant",
            content: `已为你${suggestion}。AI 助手会持续学习你的笔记习惯，提供更精准的服务。`
          }]);
        }, 800);
      };

      if (!isOpen) return null;

      return (
        <div className="ai-panel">
          <div className="ai-panel-header">
            <div className="ai-panel-title">
              <span>{Icons.ai()}</span>
              <span>AI 助手</span>
              <span className="ai-badge">BETA</span>
            </div>
            <button className="ai-panel-close" onClick={onClose}>{Icons.close()}</button>
          </div>

          <div className="ai-messages">
            {messages.map((msg, i) => (
              <div key={i} className={`ai-message ${msg.role}`}>
                <div className={`ai-avatar ${msg.role}`}>
                  {msg.role === "assistant" ? "🤖" : "👤"}
                </div>
                <div className="ai-message-content">{msg.content}</div>
              </div>
            ))}
            <div ref={messagesEndRef} />
          </div>

          <div className="ai-suggestions">
            {mockAISuggestions.map((s, i) => (
              <button key={i} className="ai-suggestion" onClick={() => handleSuggestion(s)}>
                {s}
              </button>
            ))}
          </div>

          <div className="ai-input-area">
            <div className="ai-input-box">
              <input
                type="text"
                placeholder="询问 AI 助手..."
                value={inputValue}
                onChange={e => setInputValue(e.target.value)}
                onKeyPress={e => e.key === "Enter" && handleSend()}
              />
              <button className="ai-send-btn" onClick={handleSend}>{Icons.send()}</button>
            </div>
          </div>
        </div>
      );
    }

    // ===== MAIN APP =====
    function App() {
      const [activeView, setActiveView] = useState("all");
      const [activeNoteId, setActiveNoteId] = useState(1);
      const [filter, setFilter] = useState("all");
      const [aiPanelOpen, setAiPanelOpen] = useState(true);
      const [notes, setNotes] = useState(mockNotes);

      const activeNote = notes.find(n => n.id === activeNoteId) || null;

      const handleNewNote = () => {
        const newNote = {
          id: Date.now(),
          title: "未命名笔记",
          preview: "",
          content: "<p>开始输入...</p>",
          tag: "log",
          tagLabel: "笔记",
          date: "刚刚",
          category: "未分类"

        setNotes([newNote, ...notes]);
        setActiveNoteId(newNote.id);
      };

      return (
        <div className="app">
          <Sidebar
            activeView={activeView}
            onViewChange={setActiveView}
            onNewNote={handleNewNote}
            user={{ name: "NAS 用户", avatar: "N" }}
          />
          <NoteList
            notes={notes}
            activeNoteId={activeNoteId}
            onSelectNote={setActiveNoteId}
            filter={filter}
            onFilterChange={setFilter}
          />
          <Editor note={activeNote} />
          <AIPanel isOpen={aiPanelOpen} onClose={() => setAiPanelOpen(false)} />
        </div>
      );
    }

    // ===== RENDER =====
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
