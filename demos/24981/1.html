<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超级玛丽 - 童年回忆</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           全局重置与CSS变量
           精心调配的超级玛丽经典配色
           ============================================ */
        :root {
            --sky-top: #5c94fc;
            --sky-bottom: #9cd8f8;
            --grass: #5ab556;
            --grass-dark: #3d8b3a;
            --dirt: #c84c0c;
            --dirt-dark: #a0380c;
            --brick: #d88040;
            --brick-dark: #a05020;
            --brick-mortar: #e0a060;
            --coin: #f8d830;
            --coin-dark: #c8a020;
            --mario-red: #e44020;
            --mario-red-dark: #b83018;
            --mario-blue: #2038ec;
            --mario-blue-dark: #1828b0;
            --skin: #fca044;
            --pipe: #00a800;
            --pipe-light: #20d820;
            --pipe-dark: #006800;
            --cloud: #fcfcfc;
            --cloud-shadow: #d8e8f8;
            --bush: #5ab556;
            --bush-dark: #3d8b3a;
            --castle: #c8a878;
            --castle-dark: #a08050;
            --question-bg: #f8d830;
            --question-border: #e0a020;
            --white: #ffffff;
            --black: #000000;
            --ui-bg: rgba(0,0,0,0.65);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Press Start 2P', monospace;
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* ============================================
           游戏外框 - 模拟经典红白机/街机外壳
           ============================================ */
        .arcade-cabinet {
            position: relative;
            width: 820px;
            height: 620px;
            background: linear-gradient(145deg, #2a2a3a 0%, #1a1a28 50%, #0e0e18 100%);
            border-radius: 24px;
            padding: 12px;
            box-shadow:
                0 0 0 3px #3a3a4a,
                0 0 0 6px #1a1a28,
                0 20px 60px rgba(0,0,0,0.8),
                0 0 120px rgba(92,148,252,0.15);
        }

        /* 屏幕内框装饰线 */
        .arcade-cabinet::before {
            content: '';
            position: absolute;
            top: 8px; left: 8px; right: 8px; bottom: 8px;
            border: 2px solid #3a3a5a;
            border-radius: 18px;
            pointer-events: none;
            z-index: 200;
        }

        /* 屏幕区域 */
        .screen {
            width: 100%;
            height: 100%;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            background: var(--sky-top);
        }

        /* CRT扫描线 + 弧面反光 */
        .screen::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px),
                radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.06) 0%, transparent 60%);
            pointer-events: none;
            z-index: 150;
            border-radius: 16px;
        }

        /* ============================================
           标题画面 - 黄昏天空 + 城堡剪影
           ============================================ */
        .title-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            overflow: hidden;
        }

        /* 渐变天空背景 */
        .title-sky {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg,
                #1a0530 0%,
                #3a1060 15%,
                #8040a0 30%,
                #e07030 55%,
                #f8c040 70%,
                #f8e878 80%,
                var(--sky-bottom) 100%
            );
        }

        /* 星星 */
        .stars {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 40%;
        }
        .star {
            position: absolute;
            width: 3px; height: 3px;
            background: var(--white);
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite alternate;
        }
        .star:nth-child(odd) { animation-delay: 0.5s; }
        .star:nth-child(3n) { animation-delay: 1.2s; width: 2px; height: 2px; }
        .star:nth-child(5n) { animation-delay: 0.8s; width: 4px; height: 4px; }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* 远景山丘剪影 */
        .hills-silhouette {
            position: absolute;
            bottom: 18%;
            width: 100%;
            height: 120px;
        }
        .hill-far {
            position: absolute;
            bottom: 0;
            border-radius: 50% 50% 0 0;
            background: #2a6040;
            opacity: 0.6;
        }
        .hill-near {
            position: absolute;
            bottom: 0;
            border-radius: 50% 50% 0 0;
            background: #1a4030;
            opacity: 0.8;
        }

        /* 城堡剪影 */
        .castle-silhouette {
            position: absolute;
            bottom: 18%;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 160px;
        }
        .castle-main {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 100px;
            background: #1a2a20;
            border-radius: 4px 4px 0 0;
        }
        .castle-tower {
            position: absolute;
            bottom: 60px;
            width: 30px;
            height: 80px;
            background: #1a2a20;
            border-radius: 3px 3px 0 0;
        }
        .castle-tower.left { left: 10px; }
        .castle-tower.right { right: 10px; }
        .castle-tower::after {
            content: '';
            position: absolute;
            top: -12px;
            left: -4px;
            width: 38px;
            height: 14px;
            background: #1a2a20;
            border-radius: 2px 2px 0 0;
            clip-path: polygon(0% 100%, 15% 0%, 30% 100%, 45% 0%, 60% 100%, 75% 0%, 90% 100%);
        }
        .castle-door {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 36px;
            background: #0a0a10;
            border-radius: 12px 12px 0 0;
        }
        .castle-window {
            position: absolute;
            width: 12px;
            height: 16px;
            background: #f8c040;
            border-radius: 6px 6px 0 0;
            opacity: 0.7;
            animation: windowGlow 3s ease-in-out infinite alternate;
        }
        .castle-window:nth-child(1) { top: 20px; left: 20px; }
        .castle-window:nth-child(2) { top: 20px; right: 20px; animation-delay: 1s; }
        .castle-window:nth-child(3) { top: 50px; left: 50%; transform: translateX(-50%); animation-delay: 0.5s; }

        @keyframes windowGlow {
            0% { opacity: 0.4; }
            100% { opacity: 0.9; }
        }

        /* 地面 */
        .title-ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 18%;
            background: linear-gradient(180deg, var(--grass) 0%, var(--grass) 30%, var(--dirt) 30%, var(--dirt-dark) 100%);
        }
        .title-ground::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 8px;
            background: repeating-linear-gradient(90deg,
                var(--grass-dark) 0px, var(--grass-dark) 12px,
                var(--grass) 12px, var(--grass) 24px
            );
        }

        /* 标题文字容器 */
        .title-content {
            position: relative;
            z-index: 20;
            text-align: center;
            margin-bottom: 30px;
        }

        /* 主标题 - 带立体感 */
        .game-title {
            font-size: 42px;
            color: var(--white);
            text-shadow:
                3px 3px 0 var(--mario-red-dark),
                6px 6px 0 rgba(0,0,0,0.3);
            letter-spacing: 4px;
            animation: titleFloat 3s ease-in-out infinite;
            line-height: 1.4;
        }
        .game-title .highlight {
            color: var(--coin);
            text-shadow:
                3px 3px 0 var(--coin-dark),
                6px 6px 0 rgba(0,0,0,0.3);
        }

        @keyframes titleFloat {
            0%, 100% { transform: translateY(0) rotate(-0.5deg); }
            50% { transform: translateY(-8px) rotate(0.5deg); }
        }

        /* 副标题 */
        .game-subtitle {
            font-size: 11px;
            color: var(--white);
            text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
            margin-top: 12px;
            letter-spacing: 6px;
            opacity: 0.85;
        }

        /* 马里奥站立展示 - 像素风SVG */
        .mario-hero {
            position: relative;
            z-index: 20;
            width: 80px;
            height: 96px;
            margin-bottom: 36px;
            filter: drop-shadow(4px 6px 0 rgba(0,0,0,0.4));
            animation: marioIdle 1.5s ease-in-out infinite;
        }
        @keyframes marioIdle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        /* 开始按钮 - 像素风 */
        .start-btn {
            position: relative;
            z-index: 20;
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            color: var(--white);
            background: linear-gradient(180deg, var(--mario-red) 0%, var(--mario-red-dark) 100%);
            border: none;
            padding: 14px 48px;
            cursor: pointer;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.4);
            box-shadow:
                0 4px 0 #801810,
                0 6px 12px rgba(0,0,0,0.4);
            transition: all 0.08s;
            letter-spacing: 2px;
        }
        .start-btn:hover {
            transform: translateY(2px);
            box-shadow:
                0 2px 0 #801810,
                0 3px 6px rgba(0,0,0,0.4);
        }
        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #801810;
        }

        /* 版权信息 */
        .copyright {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 7px;
            color: rgba(255,255,255,0.4);
            z-index: 20;
            letter-spacing: 1px;
        }

        /* ============================================
           关卡选择 - 世界地图风格
           ============================================ */
        .level-screen {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            z-index: 20;
            overflow: hidden;
        }

        /* 地图背景 */
        .map-bg {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 60%, var(--grass) 60%, var(--grass) 63%, var(--dirt) 63%);
        }

        /* 地图装饰云朵 */
        .map-cloud {
            position: absolute;
            background: var(--cloud);
            border-radius: 20px;
            box-shadow: 0 4px 0 var(--cloud-shadow);
        }
        .map-cloud::before, .map-cloud::after {
            content: '';
            position: absolute;
            background: var(--cloud);
            border-radius: 50%;
        }

        /* 地图路径 */
        .map-path {
            position: absolute;
            z-index: 5;
        }

        /* 关卡节点 */
        .level-node {
            position: absolute;
            z-index: 10;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .level-node:hover { transform: scale(1.15); }

        .node-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: var(--white);
            text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
            box-shadow: 0 4px 0 rgba(0,0,0,0.3), 0 6px 16px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        .node-circle::after {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px;
            height: 40%;
            background: linear-gradient(180deg, rgba(255,255,255,0.35) 0%, transparent 100%);
            border-radius: 50% 50% 40% 40%;
        }

        .level-node.active .node-circle {
            animation: nodePulse 2s ease-in-out infinite;
        }
        @keyframes nodePulse {
            0%, 100% { box-shadow: 0 4px 0 rgba(0,0,0,0.3), 0 6px 16px rgba(0,0,0,0.2); }
            50% { box-shadow: 0 4px 0 rgba(0,0,0,0.3), 0 6px 24px rgba(248,216,48,0.5); }
        }

        .level-node.locked {
            cursor: not-allowed;
            opacity: 0.45;
            filter: grayscale(0.6);
        }
        .level-node.locked:hover { transform: none; }

        .node-label {
            text-align: center;
            font-size: 7px;
            color: var(--white);
            text-shadow: 1px 1px 0 rgba(0,0,0,0.6);
            margin-top: 6px;
            letter-spacing: 0.5px;
        }

        /* 关卡选择标题 */
        .map-title {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            color: var(--white);
            text-shadow: 2px 2px 0 rgba(0,0,0,0.4);
            z-index: 20;
            letter-spacing: 3px;
        }

        /* 返回按钮 */
        .back-btn {
            position: absolute;
            top: 16px;
            left: 20px;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            color: var(--white);
            background: rgba(0,0,0,0.4);
            border: 2px solid rgba(255,255,255,0.3);
            padding: 8px 14px;
            cursor: pointer;
            z-index: 20;
            transition: all 0.15s;
            letter-spacing: 1px;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.15);
            border-color: var(--white);
        }

        /* ============================================
           游戏场景
           ============================================ */
        .game-screen {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            z-index: 30;
            overflow: hidden;
        }

        /* 游戏HUD */
        .hud {
            height: 44px;
            background: var(--ui-bg);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            z-index: 50;
            border-bottom: 2px solid rgba(255,255,255,0.08);
        }
        .hud-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .hud-label {
            font-size: 9px;
            color: var(--coin);
            letter-spacing: 1px;
        }
        .hud-value {
            font-size: 11px;
            color: var(--white);
            text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
        }

        /* 游戏世界 */
        .world {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .world-bg {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 70%, var(--grass) 85%, var(--grass) 88%, var(--dirt) 88%);
        }

        /* 游戏地图滚动层 */
        .scroll-layer {
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            width: 3200px;
        }

        /* 场景云朵 */
        .scene-cloud {
            position: absolute;
            background: var(--cloud);
            border-radius: 20px;
            box-shadow: 0 3px 0 var(--cloud-shadow);
        }
        .scene-cloud::before, .scene-cloud::after {
            content: '';
            position: absolute;
            background: var(--cloud);
            border-radius: 50%;
        }

        /* 场景山丘 */
        .scene-hill {
            position: absolute;
            bottom: 15%;
            border-radius: 50% 50% 0 0;
        }

        /* 场景灌木 */
        .scene-bush {
            position: absolute;
            bottom: 15%;
            background: var(--bush);
            border-radius: 50% 50% 0 0;
            box-shadow: inset 0 -4px 0 var(--bush-dark);
        }
        .scene-bush::before, .scene-bush::after {
            content: '';
            position: absolute;
            bottom: 0;
            background: var(--bush);
            border-radius: 50% 50% 0 0;
            box-shadow: inset 0 -4px 0 var(--bush-dark);
        }

        /* 砖块 */
        .brick {
            position: absolute;
            width: 40px;
            height: 40px;
            background: var(--brick);
            border: 2px solid var(--brick-dark);
            box-shadow:
                inset 2px 2px 0 var(--brick-mortar),
                inset -2px -2px 0 var(--brick-dark);
            image-rendering: pixelated;
        }
        /* 砖块内纹理线 */
        .brick::before {
            content: '';
            position: absolute;
            top: 50%; left: 2px; right: 2px;
            height: 1px;
            background: var(--brick-dark);
        }
        .brick::after {
            content: '';
            position: absolute;
            left: 50%; top: 2px; bottom: 2px;
            width: 1px;
            background: var(--brick-dark);
        }

        /* 问号砖块 */
        .q-block {
            position: absolute;
            width: 40px;
            height: 40px;
            background: var(--question-bg);
            border: 3px solid var(--question-border);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: var(--brick-dark);
            cursor: pointer;
            box-shadow:
                inset 2px 2px 0 rgba(255,255,255,0.4),
                inset -2px -2px 0 rgba(0,0,0,0.15),
                0 3px 0 var(--question-border);
            transition: transform 0.1s;
        }
        .q-block:hover { transform: scale(1.05); }
        .q-block:active { transform: scale(0.95); }

        .q-block.hit {
            background: #887050;
            border-color: #605030;
            box-shadow: inset 2px 2px 0 rgba(0,0,0,0.2);
            cursor: default;
            animation: none;
        }
        .q-block.hit::after {
            content: '';
            position: absolute;
            inset: 4px;
            border: 1px solid rgba(0,0,0,0.2);
        }

        /* 水管 */
        .pipe {
            position: absolute;
            width: 56px;
            background: linear-gradient(90deg,
                var(--pipe-dark) 0%, var(--pipe-dark) 15%,
                var(--pipe) 15%, var(--pipe-light) 45%,
                var(--pipe) 55%, var(--pipe-dark) 85%,
                var(--pipe-dark) 100%
            );
            border: 2px solid var(--pipe-dark);
        }
        .pipe-top {
            position: absolute;
            top: -16px;
            left: -6px;
            right: -6px;
            height: 18px;
            background: linear-gradient(90deg,
                var(--pipe-dark) 0%, var(--pipe-dark) 12%,
                var(--pipe) 12%, var(--pipe-light) 42%,
                var(--pipe) 58%, var(--pipe-dark) 88%,
                var(--pipe-dark) 100%
            );
            border: 2px solid var(--pipe-dark);
            border-radius: 3px 3px 0 0;
        }

        /* 金币 */
        .coin {
            position: absolute;
            width: 24px;
            height: 28px;
            z-index: 15;
        }
        .coin-inner {
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 40% 35%, #f8e870, var(--coin), var(--coin-dark));
            border-radius: 50%;
            border: 2px solid var(--coin-dark);
            box-shadow: inset 0 -2px 0 rgba(0,0,0,0.15);
            animation: coinBob 2s ease-in-out infinite;
        }
        @keyframes coinBob {
            0%, 100% { transform: translateY(0) rotateY(0deg); }
            25% { transform: translateY(-6px) rotateY(90deg); }
            50% { transform: translateY(0) rotateY(180deg); }
            75% { transform: translateY(-6px) rotateY(270deg); }
        }

        .coin.collected .coin-inner {
            animation: coinPop 0.4s ease-out forwards;
        }
        @keyframes coinPop {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.8) translateY(-40px); opacity: 0; }
        }

        /* 敌人 - 板栗仔 */
        .enemy {
            position: absolute;
            width: 36px;
            height: 36px;
            z-index: 14;
        }
        .enemy-sprite {
            width: 100%;
            height: 100%;
            animation: enemyWalk 3s ease-in-out infinite;
        }
        @keyframes enemyWalk {
            0%, 100% { transform: translateX(0); }
            45% { transform: translateX(80px); }
            55% { transform: translateX(80px) scaleX(-1); }
            95% { transform: translateX(0) scaleX(-1); }
        }

        /* 马里奥角色 */
        .player {
            position: absolute;
            width: 36px;
            height: 44px;
            z-index: 30;
            filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.3));
            transition: none;
        }

        /* 暂停菜单 */
        .pause-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(6px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 60;
        }
        .pause-overlay.show { display: flex; }

        .pause-title {
            font-size: 28px;
            color: var(--white);
            text-shadow: 3px 3px 0 var(--mario-red);
            margin-bottom: 32px;
        }
        .pause-opt {
            font-family: 'Press Start 2P', monospace;
            font-size: 13px;
            color: var(--white);
            padding: 12px 0;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 1px;
        }
        .pause-opt:hover {
            color: var(--coin);
            transform: scale(1.08);
        }

        /* 控制提示条 */
        .controls-bar {
            position: absolute;
            bottom: 0;
            left: 0; right: 0;
            height: 32px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 50;
            font-size: 8px;
            color: rgba(255,255,255,0.6);
            letter-spacing: 0.5px;
        }
        .key-hint {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .key-cap {
            display: inline-block;
            padding: 2px 6px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 3px;
            font-size: 7px;
        }

        /* 粒子容器 */
        .fx-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 40;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            animation: pFade 0.8s ease-out forwards;
        }
        @keyframes pFade {
            0% { transform: translate(0,0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }

        /* 浮动得分文字 */
        .float-score {
            position: absolute;
            font-size: 12px;
            color: var(--coin);
            text-shadow: 1px 1px 0 rgba(0,0,0,0.6);
            z-index: 45;
            pointer-events: none;
            animation: scoreUp 0.8s ease-out forwards;
        }
        @keyframes scoreUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-40px); opacity: 0; }
        }

        /* 画面切换辅助 */
        .screen-hidden { display: none !important; }
        .screen-visible { display: flex !important; }
    </style>

    <script>
        // ============================================
        // 游戏核心状态
        // ============================================
        const G = {
            screen: 'title',
            level: null,
            score: 0,
            coins: 0,
            time: 300,
            paused: false,
            over: false,
            pos: { x: 80, y: 0 },
            vel: { x: 0, y: 0 },
            jumping: false,
            scroll: 0,
            keys: {},
            timer: null,
            // 碰撞检测用的实体列表（世界坐标）
            solids: [],      // 砖块、水管等不可穿透的实体
            qBlocks: [],     // 问号砖块
            coinList: [],    // 金币
            enemyList: [],   // 敌人
            groundH: 0       // 地面像素高度
        };

        // ============================================
        // DOM引用
        // ============================================
        const $ = id => document.getElementById(id);
        const titleScreen = $('titleScreen');
        const levelScreen = $('levelScreen');
        const gameScreen  = $('gameScreen');
        const scrollLayer = $('scrollLayer');
        const player     = $('player');
        const fxLayer    = $('fxLayer');
        const pauseOvl   = $('pauseOverlay');
        const mapCanvas  = $('mapCanvas');
        const levelNodes = $('levelNodes');

        // ============================================
        // 画面切换
        // ============================================
        function showScreen(name) {
            G.screen = name;
            titleScreen.className = 'title-screen ' + (name === 'title' ? 'screen-visible' : 'screen-hidden');
            levelScreen.className = 'level-screen ' + (name === 'levels' ? 'screen-visible' : 'screen-hidden');
            gameScreen.className  = 'game-screen '  + (name === 'game'  ? 'screen-visible' : 'screen-hidden');
        }

        // ============================================
        // 标题画面 - 生成星星
        // ============================================
        (function initStars() {
            const container = $('stars');
            for (let i = 0; i < 40; i++) {
                const s = document.createElement('div');
                s.className = 'star';
                s.style.left = Math.random() * 100 + '%';
                s.style.top = Math.random() * 100 + '%';
                s.style.animationDelay = (Math.random() * 3) + 's';
                container.appendChild(s);
            }
        })();

        // ============================================
        // 关卡选择 - 世界地图
        // ============================================
        const levels = [
            { id: 1, name: '1-1', label: '经典草原', color: '#5ab556', icon: '🌱', x: 120, y: 280, locked: false },
            { id: 2, name: '1-2', label: '地下迷宫', color: '#6a5acd', icon: '💎', x: 280, y: 220, locked: false },
            { id: 3, name: '1-3', label: '高空平台', color: '#87ceeb', icon: '☁️', x: 440, y: 300, locked: false },
            { id: 4, name: '1-4', label: '城堡决战', color: '#e44020', icon: '🏰', x: 600, y: 240, locked: false },
            { id: 5, name: '2-1', label: '???',       color: '#888',    icon: '🔒', x: 120, y: 420, locked: true },
            { id: 6, name: '2-2', label: '???',       color: '#888',    icon: '🔒', x: 280, y: 380, locked: true },
            { id: 7, name: '2-3', label: '???',       color: '#888',    icon: '🔒', x: 440, y: 440, locked: true },
            { id: 8, name: '2-4', label: '???',       color: '#888',    icon: '🔒', x: 600, y: 400, locked: true },
        ];

        /** 绘制关卡之间的连接路径 */
        function drawMapPaths() {
            const c = mapCanvas;
            const w = c.parentElement.clientWidth;
            const h = c.parentElement.clientHeight;
            c.width = w;
            c.height = h;
            const ctx = c.getContext('2d');

            // 绘制路径连线
            ctx.strokeStyle = 'rgba(255,255,255,0.25)';
            ctx.lineWidth = 4;
            ctx.setLineDash([8, 6]);

            // 第一行路径
            for (let i = 0; i < 3; i++) {
                const a = levels[i], b = levels[i + 1];
                ctx.beginPath();
                ctx.moveTo(a.x + 28, a.y + 28);
                ctx.quadraticCurveTo((a.x + b.x) / 2 + 28, Math.min(a.y, b.y) - 20, b.x + 28, b.y + 28);
                ctx.stroke();
            }
            // 第二行路径
            for (let i = 4; i < 7; i++) {
                const a = levels[i], b = levels[i + 1];
                ctx.beginPath();
                ctx.moveTo(a.x + 28, a.y + 28);
                ctx.quadraticCurveTo((a.x + b.x) / 2 + 28, Math.min(a.y, b.y) - 20, b.x + 28, b.y + 28);
                ctx.stroke();
            }

            ctx.setLineDash([]);
        }

        /** 生成关卡节点 */
        function buildLevelNodes() {
            levelNodes.innerHTML = '';
            levels.forEach(lv => {
                const node = document.createElement('div');
                node.className = 'level-node' + (lv.locked ? ' locked' : ' active');
                node.style.left = lv.x + 'px';
                node.style.top = lv.y + 'px';
                node.innerHTML = `
                    <div class="node-circle" style="background:${lv.locked ? '#555' : lv.color};">
                        <span style="font-size:18px;">${lv.icon}</span>
                    </div>
                    <div class="node-label">${lv.name}<br>${lv.label}</div>
                `;
                if (!lv.locked) {
                    node.addEventListener('click', () => startLevel(lv.id));
                }
                levelNodes.appendChild(node);
            });
        }

        // ============================================
        // 关卡配置
        // ============================================
        const LEVELS = {
            1: {
                name: '1-1', bg: 'linear-gradient(180deg,#5c94fc 0%,#9cd8f8 70%,#5ab556 85%,#5ab556 88%,#c84c0c 88%)',
                bricks: [
                    {x:300,y:180},{x:340,y:180},{x:380,y:180},
                    {x:520,y:130},{x:560,y:130},{x:600,y:130},
                    {x:740,y:180},{x:780,y:180},{x:820,y:180},{x:860,y:180},
                    {x:1020,y:130},{x:1060,y:130},{x:1100,y:130},
                    {x:1260,y:180},{x:1300,y:180}
                ],
                questions: [
                    {x:340,y:180,item:'coin'},{x:560,y:130,item:'mushroom'},
                    {x:780,y:180,item:'coin'},{x:1060,y:130,item:'coin'}
                ],
                pipes: [{x:460,y:80,h:80},{x:680,y:60,h:100},{x:940,y:80,h:80}],
                coins: [{x:360,y:280},{x:580,y:230},{x:800,y:280},{x:1000,y:230},{x:1200,y:280}],
                enemies: [{x:420,y:80},{x:850,y:80},{x:1150,y:80}],
                clouds: [{x:80,y:320,w:80},{x:400,y:340,w:60},{x:750,y:310,w:90},{x:1100,y:350,w:70}],
                hills: [{x:50,y:0,w:180,h:80},{x:500,y:0,w:220,h:100},{x:950,y:0,w:160,h:70}],
                bushes: [{x:200,y:0,w:80},{x:650,y:0,w:100},{x:1050,y:0,w:70}]
            },
            2: {
                name: '1-2', bg: 'linear-gradient(180deg,#0a0a2e 0%,#1a1a4e 70%,#3a3a2e 85%,#3a3a2e 88%,#2a1a0e 88%)',
                bricks: [
                    {x:220,y:180},{x:260,y:180},{x:300,y:180},
                    {x:440,y:130},{x:480,y:130},{x:520,y:130},
                    {x:660,y:180},{x:700,y:180}
                ],
                questions: [
                    {x:260,y:180,item:'coin'},{x:480,y:130,item:'coin'},{x:680,y:180,item:'mushroom'}
                ],
                pipes: [{x:380,y:80,h:80},{x:580,y:60,h:100}],
                coins: [{x:320,y:280},{x:540,y:230},{x:740,y:280}],
                enemies: [{x:480,y:80},{x:700,y:80}],
                clouds: [], hills: [], bushes: []
            },
            3: {
                name: '1-3', bg: 'linear-gradient(180deg,#87ceeb 0%,#b0e0f8 70%,#5ab556 85%,#5ab556 88%,#c84c0c 88%)',
                bricks: [
                    {x:260,y:230},{x:300,y:230},
                    {x:480,y:180},{x:520,y:180},{x:560,y:180},
                    {x:740,y:130},{x:780,y:130}
                ],
                questions: [
                    {x:280,y:230,item:'coin'},{x:520,y:180,item:'coin'},{x:760,y:130,item:'mushroom'}
                ],
                pipes: [{x:400,y:80,h:80},{x:640,y:60,h:100}],
                coins: [{x:380,y:330},{x:600,y:280},{x:800,y:230}],
                enemies: [{x:540,y:80},{x:700,y:80}],
                clouds: [{x:100,y:300,w:100},{x:500,y:280,w:80},{x:900,y:320,w:70}],
                hills: [{x:200,y:0,w:200,h:90},{x:700,y:0,w:180,h:70}],
                bushes: [{x:450,y:0,w:90}]
            },
            4: {
                name: '1-4', bg: 'linear-gradient(180deg,#1a0a08 0%,#3a1a10 70%,#4a2a18 85%,#4a2a18 88%,#2a0a04 88%)',
                bricks: [
                    {x:220,y:180},{x:260,y:180},{x:300,y:180},{x:340,y:180},
                    {x:520,y:130},{x:560,y:130},{x:600,y:130},
                    {x:820,y:180},{x:860,y:180}
                ],
                questions: [
                    {x:260,y:180,item:'coin'},{x:560,y:130,item:'mushroom'},{x:840,y:180,item:'coin'}
                ],
                pipes: [{x:420,y:80,h:80},{x:720,y:60,h:100}],
                coins: [{x:320,y:280},{x:580,y:230},{x:900,y:280}],
                enemies: [{x:480,y:80},{x:640,y:80},{x:800,y:80}],
                clouds: [], hills: [], bushes: []
            }
        };

        // ============================================
        // 生成关卡场景
        // ============================================
        function buildLevel(id) {
            const cfg = LEVELS[id];
            if (!cfg) return;
            scrollLayer.innerHTML = '';

            // 清空碰撞数据
            G.solids = [];
            G.qBlocks = [];
            G.coinList = [];
            G.enemyList = [];

            // 地面高度将在 startLevel 中计算（确保DOM已渲染）
            // G.groundH 初始为 0，在 startLevel 后更新

            // 设置背景
            const worldBg = document.querySelector('.world-bg');
            worldBg.style.background = cfg.bg;

            // 云朵（纯装饰，无碰撞）
            (cfg.clouds || []).forEach(c => {
                const el = document.createElement('div');
                el.className = 'scene-cloud';
                el.style.cssText = `left:${c.x}px;top:${c.y}px;width:${c.w}px;height:${c.w*0.4}px;`;
                el.innerHTML = `<span style="position:absolute;width:${c.w*0.5}px;height:${c.w*0.5}px;background:var(--cloud);border-radius:50%;top:-${c.w*0.25}px;left:${c.w*0.15}px;"></span>
                    <span style="position:absolute;width:${c.w*0.4}px;height:${c.w*0.4}px;background:var(--cloud);border-radius:50%;top:-${c.w*0.15}px;right:${c.w*0.1}px;"></span>`;
                scrollLayer.appendChild(el);
            });

            // 山丘（纯装饰）
            (cfg.hills || []).forEach(h => {
                const el = document.createElement('div');
                el.className = 'scene-hill';
                el.style.cssText = `left:${h.x}px;bottom:${15+h.y/10}%;width:${h.w}px;height:${h.h}px;background:var(--grass-dark);opacity:0.5;`;
                scrollLayer.appendChild(el);
            });

            // 灌木（纯装饰）
            (cfg.bushes || []).forEach(b => {
                const el = document.createElement('div');
                el.className = 'scene-bush';
                el.style.cssText = `left:${b.x}px;width:${b.w}px;height:${b.w*0.4}px;`;
                el.innerHTML = `<span style="width:${b.w*0.6}px;height:${b.w*0.5}px;left:-${b.w*0.1}px;bottom:0;"></span>
                    <span style="width:${b.w*0.5}px;height:${b.w*0.45}px;right:-${b.w*0.05}px;bottom:0;"></span>`;
                scrollLayer.appendChild(el);
            });

            // 砖块 - 记录到碰撞列表
            cfg.bricks.forEach(b => {
                const el = document.createElement('div');
                el.className = 'brick';
                el.style.left = b.x + 'px';
                el.style.bottom = b.y + 'px';
                scrollLayer.appendChild(el);
                G.solids.push({ x: b.x, y: b.y, w: 40, h: 40, type: 'brick' });
            });

            // 问号砖块 - 记录到碰撞列表
            cfg.questions.forEach((q, i) => {
                const el = document.createElement('div');
                el.className = 'q-block';
                el.style.left = q.x + 'px';
                el.style.bottom = q.y + 'px';
                el.textContent = '?';
                el.dataset.item = q.item;
                el.dataset.idx = i;
                scrollLayer.appendChild(el);
                G.qBlocks.push({ x: q.x, y: q.y, w: 40, h: 40, item: q.item, el: el });
            });

            // 水管 - 记录到碰撞列表
            cfg.pipes.forEach(p => {
                const el = document.createElement('div');
                el.className = 'pipe';
                el.style.left = p.x + 'px';
                el.style.bottom = p.y + 'px';
                el.style.height = p.h + 'px';
                el.innerHTML = '<div class="pipe-top"></div>';
                scrollLayer.appendChild(el);
                // 水管碰撞体：主体+顶部
                G.solids.push({ x: p.x, y: p.y, w: 56, h: p.h, type: 'pipe' });
                G.solids.push({ x: p.x - 6, y: p.y + p.h, w: 68, h: 18, type: 'pipeTop' });
            });

            // 金币 - 记录到碰撞列表
            cfg.coins.forEach(c => {
                const el = document.createElement('div');
                el.className = 'coin';
                el.style.left = c.x + 'px';
                el.style.bottom = c.y + 'px';
                el.innerHTML = '<div class="coin-inner"></div>';
                scrollLayer.appendChild(el);
                G.coinList.push({ x: c.x, y: c.y, w: 24, h: 28, collected: false, el: el });
            });

            // 敌人 - 记录到碰撞列表
            cfg.enemies.forEach(e => {
                const el = document.createElement('div');
                el.className = 'enemy';
                el.style.left = e.x + 'px';
                el.style.bottom = e.y + 'px';
                el.innerHTML = `<svg class="enemy-sprite" viewBox="0 0 12 12" xmlns="http://www.w3.org/2000/svg">
                    <rect x="1" y="4" width="10" height="6" rx="1" fill="#8b4513"/>
                    <rect x="0" y="5" width="12" height="4" rx="1" fill="#8b4513"/>
                    <rect x="2" y="10" width="3" height="2" rx="1" fill="#5c2f0d"/>
                    <rect x="7" y="10" width="3" height="2" rx="1" fill="#5c2f0d"/>
                    <rect x="2" y="5" width="3" height="3" rx="1" fill="#fff"/>
                    <rect x="7" y="5" width="3" height="3" rx="1" fill="#fff"/>
                    <rect x="3" y="6" width="1" height="2" fill="#000"/>
                    <rect x="8" y="6" width="1" height="2" fill="#000"/>
                    <rect x="1" y="3" width="4" height="2" rx="1" fill="#000"/>
                    <rect x="7" y="3" width="4" height="2" rx="1" fill="#000"/>
                </svg>`;
                scrollLayer.appendChild(el);
                G.enemyList.push({ x: e.x, y: e.y, w: 36, h: 36, dead: false, el: el });
            });

            // 更新HUD
            $('hudWorld').textContent = cfg.name;
        }

        // ============================================
        // 开始关卡
        // ============================================
        function startLevel(id) {
            G.level = id;
            G.score = 0;
            G.coins = 0;
            G.time = 300;
            G.paused = false;
            G.over = false;
            G.pos = { x: 80, y: 0 };
            G.vel = { x: 0, y: 0 };
            G.jumping = false;
            G.scroll = 0;
            pauseOvl.classList.remove('show');
            buildLevel(id);
            showScreen('game');
            // 在画面显示后计算地面高度（DOM已渲染）
            const worldH = $('world').clientHeight;
            G.groundH = worldH * 0.15;
            // 重置玩家位置和样式
            player.style.left = G.pos.x + 'px';
            player.style.bottom = G.groundH + 'px';
            player.style.filter = '';
            player.style.transform = 'scaleX(1)';
            updateHUD();
        }

        // ============================================
        // 问号砖块交互
        // ============================================
        function hitBlock(el) {
            if (el.classList.contains('hit')) return;
            el.classList.add('hit');
            el.textContent = '';
            const item = el.dataset.item;
            const x = parseInt(el.style.left) + 20;
            const y = parseInt(el.style.bottom) + 20;
            spawnParticles(x, y, item === 'mushroom' ? '#e44020' : '#f8d830');
            if (item === 'coin') {
                G.coins++;
                G.score += 200;
                showScoreText('+200', x, y);
            } else {
                G.score += 1000;
                showScoreText('+1000', x, y);
            }
            updateHUD();
        }

        // ============================================
        // 粒子特效
        // ============================================
        function spawnParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const angle = (Math.PI * 2 * i) / 10;
                const dist = 25 + Math.random() * 25;
                const size = 3 + Math.random() * 4;
                p.style.cssText = `left:${x}px;bottom:${y}px;width:${size}px;height:${size}px;background:${color};--dx:${Math.cos(angle)*dist}px;--dy:${Math.sin(angle)*dist}px;`;
                fxLayer.appendChild(p);
                setTimeout(() => p.remove(), 800);
            }
        }

        /** 浮动得分文字 */
        function showScoreText(text, x, y) {
            const el = document.createElement('div');
            el.className = 'float-score';
            el.textContent = text;
            el.style.left = x + 'px';
            el.style.bottom = (y + 20) + 'px';
            fxLayer.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        // ============================================
        // HUD更新
        // ============================================
        function updateHUD() {
            $('hudScore').textContent = G.score.toString().padStart(6, '0');
            $('hudCoins').textContent = 'x' + G.coins.toString().padStart(2, '0');
            $('hudTime').textContent = G.time;
        }

        // ============================================
        // 碰撞检测工具函数（AABB - 视口坐标系）
        // ============================================
        /** 两个矩形是否相交 */
        function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
            return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
        }

        /** 马里奥与实体碰撞检测（视口坐标系）
         * 将实体的世界坐标减去滚动偏移，转换为视口坐标，再与马里奥比较
         */
        function playerHitEntity(px, py, pw, ph, ex, ey, ew, eh) {
            // 将实体世界坐标转换为视口坐标
            const viewportEx = ex - G.scroll;
            return rectsOverlap(px, py, pw, ph, viewportEx, ey, ew, eh);
        }

        // ============================================
        // 马里奥物理 & 控制（完整碰撞版）
        // ============================================
        function updatePlayer() {
            if (G.paused || G.over) return;

            // --- 水平移动 ---
            if (G.keys['ArrowLeft'] || G.keys['a']) {
                G.vel.x = -4;
                player.style.transform = 'scaleX(-1)';
            } else if (G.keys['ArrowRight'] || G.keys['d']) {
                G.vel.x = 4;
                player.style.transform = 'scaleX(1)';
            } else {
                G.vel.x *= 0.7; // 摩擦力
            }

            // --- 跳跃 ---
            if ((G.keys[' '] || G.keys['ArrowUp'] || G.keys['w']) && !G.jumping) {
                G.vel.y = 10;
                G.jumping = true;
            }

            // --- 重力 ---
            G.vel.y -= 0.55;

            // --- 计算下一帧位置 ---
            let nextX = G.pos.x + G.vel.x;
            let nextY = G.pos.y + G.vel.y;

            // 马里奥尺寸（世界坐标系中的宽高）
            const pW = 36;
            const pH = 44;

            // --- 地面碰撞 ---
            if (nextY <= 0) {
                nextY = 0;
                G.vel.y = 0;
                G.jumping = false;
            }

            // --- 与固体（砖块、水管）的碰撞 ---
            // 先处理水平碰撞
            let hitSolidX = false;
            for (const s of G.solids) {
                if (playerHitEntity(nextX, G.pos.y, pW, pH, s.x, s.y, s.w, s.h)) {
                    hitSolidX = true;
                    // 从左边撞上去，停在左边
                    if (G.vel.x > 0) {
                        nextX = s.x - G.scroll - pW;
                    }
                    // 从右边撞上去，停在右边
                    else if (G.vel.x < 0) {
                        nextX = s.x + s.w - G.scroll;
                    }
                    G.vel.x = 0;
                    break;
                }
            }

            // 再处理垂直碰撞（下落时）
            let onGround = false;
            for (const s of G.solids) {
                if (playerHitEntity(nextX, nextY, pW, pH, s.x, s.y, s.w, s.h)) {
                    // 从上方落下（马里奥底部碰到实体顶部）
                    if (G.vel.y < 0 && G.pos.y >= s.y + s.h - 2) {
                        nextY = s.y + s.h;
                        G.vel.y = 0;
                        G.jumping = false;
                        onGround = true;
                    }
                    // 从下方跳上去（马里奥顶部碰到实体底部）
                    else if (G.vel.y > 0 && G.pos.y + pH <= s.y + 2) {
                        nextY = s.y - pH;
                        G.vel.y = 0;
                        // 如果是砖块，可以顶碎（这里简化处理：只是反弹）
                    }
                }
            }

            // --- 问号砖块碰撞（从下方顶上去） ---
            for (const q of G.qBlocks) {
                if (playerHitEntity(nextX, nextY, pW, pH, q.x, q.y, q.w, q.h)) {
                    // 从下方跳上去顶问号砖
                    if (G.vel.y > 0 && G.pos.y + pH <= q.y + 2) {
                        nextY = q.y - pH;
                        G.vel.y = 0;
                        // 触发问号砖效果
                        hitBlock(q.el);
                    }
                }
            }

            // --- 更新位置 ---
            G.pos.x = nextX;
            G.pos.y = nextY;

            // 边界限制
            G.pos.x = Math.max(0, Math.min(G.pos.x, 760));

            // --- 渲染位置 ---
            player.style.left = G.pos.x + 'px';
            player.style.bottom = (G.groundH + G.pos.y) + 'px';

            // --- 金币收集检测 ---
            checkCoins();

            // --- 敌人碰撞检测 ---
            checkEnemies();

            // --- 摄像机跟随 ---
            const target = Math.max(0, G.pos.x - 150);
            G.scroll += (target - G.scroll) * 0.08;
            scrollLayer.style.transform = `translateX(-${G.scroll}px)`;
        }

        /** 金币收集检测（世界坐标系） */
        function checkCoins() {
            const pW = 36, pH = 44;
            for (const c of G.coinList) {
                if (c.collected) continue;
                if (playerHitEntity(G.pos.x, G.pos.y, pW, pH, c.x, c.y, c.w, c.h)) {
                    c.collected = true;
                    c.el.classList.add('collected');
                    G.coins++;
                    G.score += 100;
                    updateHUD();
                    spawnParticles(c.x + 12, c.y + 14, '#f8d830');
                    setTimeout(() => c.el.remove(), 400);
                }
            }
        }

        /** 敌人碰撞检测（世界坐标系） */
        function checkEnemies() {
            const pW = 36, pH = 44;
            for (const e of G.enemyList) {
                if (e.dead) continue;
                if (playerHitEntity(G.pos.x, G.pos.y, pW, pH, e.x, e.y, e.w, e.h)) {
                    // 从上方踩下去：马里奥底部在敌人上半部分且正在下落
                    const marioBottom = G.pos.y;
                    const enemyMid = e.y + e.h * 0.6;
                    if (G.vel.y <= 0 && marioBottom >= enemyMid) {
                        // 踩死敌人
                        e.dead = true;
                        e.el.style.opacity = '0';
                        G.score += 200;
                        G.vel.y = 7; // 小弹跳
                        updateHUD();
                        spawnParticles(e.x + 18, e.y + 18, '#e44020');
                        showScoreText('+200', e.x + 10, e.y + 30);
                        setTimeout(() => e.el.remove(), 300);
                    } else {
                        // 被敌人碰到 -> 游戏结束
                        playerDie();
                    }
                }
            }
        }

        /** 马里奥死亡 */
        function playerDie() {
            if (G.over) return;
            G.over = true;
            // 死亡动画：向上弹起然后落下
            G.vel.y = 8;
            G.vel.x = 0;
            player.style.filter = 'grayscale(1) brightness(0.5)';
            let dieFrame = 0;
            function dieAnim() {
                dieFrame++;
                G.vel.y -= 0.4;
                G.pos.y += G.vel.y;
                player.style.bottom = (G.groundH + G.pos.y) + 'px';
                player.style.transform += ' rotate(' + (dieFrame * 5) + 'deg)';
                if (G.pos.y > -200) {
                    requestAnimationFrame(dieAnim);
                } else {
                    setTimeout(() => {
                        alert('GAME OVER! 得分: ' + G.score);
                        showScreen('levels');
                    }, 500);
                }
            }
            dieAnim();
        }

        // ============================================
        // 游戏循环 & 计时器
        // ============================================
        function loop() {
            if (G.screen === 'game') updatePlayer();
            requestAnimationFrame(loop);
        }

        function startTimer() {
            if (G.timer) clearInterval(G.timer);
            G.timer = setInterval(() => {
                if (G.screen === 'game' && !G.paused && G.time > 0) {
                    G.time--;
                    updateHUD();
                    if (G.time <= 0) gameOver();
                }
            }, 1000);
        }

        function gameOver() {
            G.over = true;
            alert('TIME UP! 得分: ' + G.score);
            showScreen('levels');
        }

        // ============================================
        // 暂停
        // ============================================
        function togglePause() {
            if (G.screen !== 'game') return;
            G.paused = !G.paused;
            pauseOvl.classList.toggle('show', G.paused);
        }

        // ============================================
        // 事件绑定
        // ============================================
        $('startBtn').addEventListener('click', () => {
            showScreen('levels');
            setTimeout(() => { drawMapPaths(); }, 50);
        });

        $('backBtn').addEventListener('click', () => showScreen('title'));

        $('resumeBtn').addEventListener('click', () => {
            G.paused = false;
            pauseOvl.classList.remove('show');
        });
        $('restartBtn').addEventListener('click', () => {
            pauseOvl.classList.remove('show');
            startLevel(G.level);
        });
        $('quitBtn').addEventListener('click', () => {
            pauseOvl.classList.remove('show');
            showScreen('levels');
        });

        document.addEventListener('keydown', e => {
            G.keys[e.key] = true;
            if (e.key === 'Escape') togglePause();
            // 防止空格滚动页面
            if (e.key === ' ' && G.screen === 'game') e.preventDefault();
        });
        document.addEventListener('keyup', e => { G.keys[e.key] = false; });

        // ============================================
        // 初始化
        // ============================================
        buildLevelNodes();
        loop();
        startTimer();
        showScreen('title');
    </script>
</body>
